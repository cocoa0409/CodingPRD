# =============================================================================
# SCAFFOLD.yaml — Data Broker Registration & Deletion Request Handling
# §1.0 Response Envelope … §1.7 RBAC Matrix
# (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  2782. Data Broker Registration & Deletion Request Handling (data broker compliance office): registration filing in states requiring data broker registries with business description and data practice disclosures, deletion request intake through required mechanisms including centralized state deletion platforms, consumer identity verification balancing fraud prevention against burdensome verification, deletion execution across active databases, backups, derived data and downstream recipients with propagation obligations, opt-out of sale and sharing with signal recognition including browser-based preference signals, ongoing suppression to prevent re-collection of deleted consumer records, sensitive data category restrictions with additional consent requirements, audit trail retention proving compliance with request handling and regulator inquiry response

domain_name: data-broker-compliance-office

# Flat topology: every collection is a root-level peer keyed by explicit foreign
# keys in request bodies. There is no single owning aggregate root, so the api
# prefix is the server root and each entity owns its own top-level collection.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions

  entity_topology: flat
  state_machine_shape: parallel

  relationship_patterns:
    - one_to_many
    - self_referential          # Registration.superseded_registration_id -> Registration.id
    - cross_aggregate           # PropagationTask -> DownstreamRecipient across the request aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: DataBroker
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the data broker entity.
        constraints: 1..160 chars, required
      - name: primary_contact_email
        type: string
        source: input
        description: Compliance contact the registries and regulators write to.
        constraints: must contain '@', 5..160 chars, required
      - name: home_state_code
        type: string
        source: input
        description: Two-letter code of the broker's state of incorporation.
        constraints: exactly 2 uppercase letters
      - name: operating_state_codes
        type: array
        source: input
        description: >
          Two-letter codes of every state whose registry the broker must file in.
          Drives registry_standing: a state in this list with no ACCEPTED
          Registration covering the current clock instant makes the broker
          DELINQUENT.
        constraints: non-empty array of distinct 2-uppercase-letter codes, max 12 entries
      - name: business_description
        type: string
        source: input
        description: Narrative of the broker's business, copied onto each state filing.
        constraints: minimum 60 characters
      - name: registry_standing
        type: enum
        source: computed
        description: >
          Derived posture over all operating states. Recomputed by
          calculations.registry_standing_derivation after every Registration status
          change, every compliance_breach flip, and every compliance sweep.
        default: DELINQUENT
        constraints: "one of {COMPLIANT, DELINQUENT, SUSPENDED}"
      - name: delinquent_since
        type: datetime
        source: system
        description: >
          Clock instant at which registry_standing last became DELINQUENT; cleared
          to null when it returns to COMPLIANT. ISO 8601 UTC, 3 fractional digits.
        default: null
      - name: fee_deposited_cents
        type: integer
        source: computed
        description: Lifetime sum of every accepted fee deposit, in whole cents.
        default: 0
        constraints: ">= 0; conserved quantity: fee_deposited_cents == fee_paid_cents + fee_credit_cents"
      - name: fee_paid_cents
        type: integer
        source: computed
        description: Cents currently committed to filing fees on non-refunded registrations.
        default: 0
        constraints: ">= 0"
      - name: fee_credit_cents
        type: integer
        source: computed
        description: Cents on deposit and not yet committed to a filing fee.
        default: 0
        constraints: ">= 0"
      - name: open_breach_count
        type: integer
        source: computed
        description: >
          Number of DeletionRequests of this broker with compliance_breach == true
          and status == PARTIALLY_COMPLETED. Non-zero forces DELINQUENT.
        default: 0
        constraints: ">= 0"
      - name: request_intake_total
        type: integer
        source: computed
        description: >
          Lifetime count of DeletionRequests created for this broker.
          Conserved quantity: request_intake_total == request_open_count +
          request_completed_count + request_terminated_count.
        default: 0
      - name: request_open_count
        type: integer
        source: computed
        description: "Count of this broker's DeletionRequests with status IN {RECEIVED, VERIFICATION_PENDING, VERIFIED, VERIFICATION_FAILED, EXECUTING}."
        default: 0
      - name: request_completed_count
        type: integer
        source: computed
        description: "Count of this broker's DeletionRequests with status IN {COMPLETED, PARTIALLY_COMPLETED}."
        default: 0
      - name: request_terminated_count
        type: integer
        source: computed
        description: "Count of this broker's DeletionRequests with status IN {DENIED, WITHDRAWN, SUPERSEDED}."
        default: 0
      - name: audit_sequence_high_water
        type: integer
        source: system
        description: Highest AuditEvent.sequence_no minted for this broker; next event uses this plus one.
        default: 0

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: FK -> DataBroker.id; the broker whose registry filing this is.
        constraints: must reference an existing DataBroker
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the state registry being filed in.
        constraints: exactly 2 uppercase letters; must appear in DataBroker.operating_state_codes
      - name: status
        type: enum
        source: computed
        description: Filing lifecycle state; see §1.2 state machine for Registration.status.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED}"
      - name: coverage_period_start
        type: datetime
        source: input
        description: Inclusive start of the registration year this filing covers. ISO 8601 UTC.
      - name: coverage_period_end
        type: datetime
        source: input
        description: >
          Exclusive end of the covered registration year. The coverage interval is
          half-open [coverage_period_start, coverage_period_end).
      - name: coverage_days
        type: integer
        source: computed
        description: Whole days in the half-open coverage interval; the proration numerator of the final filing fee.
        default: 0
      - name: business_description
        type: string
        source: input
        description: Business description as filed with this state registry.
        constraints: minimum 60 characters
      - name: disclosure_completeness_score
        type: number
        source: computed
        description: >
          0.00..100.00 weighted score over this registration's DisclosureItems,
          recomputed on every disclosure insert. Gate for submission.
        default: 0.00
        constraints: 2 decimal places
      - name: provisional_filing_fee_cents
        type: integer
        source: computed
        description: PROVISIONAL_AT_SUBMIT variant of calculations.filing_fee_assessment, frozen at submission.
        default: 0
      - name: final_filing_fee_cents
        type: integer
        source: computed
        description: FINAL_AT_ACCEPTANCE variant of calculations.filing_fee_assessment; null until ACCEPTED.
        default: null
      - name: charged_fee_cents
        type: integer
        source: computed
        description: >
          Cents currently held against this registration inside
          DataBroker.fee_paid_cents. Set to provisional at submit, reset to final
          at accept, and zeroed on REJECTED / WITHDRAWN / EXPIRED.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Clock instant of the most recent DRAFT -> SUBMITTED transition.
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Clock instant of the SUBMITTED -> ACCEPTED transition.
        default: null
      - name: rejection_reason_code
        type: enum
        source: input
        description: Registry examiner's rejection ground, supplied on the reject action.
        default: null
        constraints: "one of {INCOMPLETE_DISCLOSURE, INACCURATE_DESCRIPTION, FEE_DISPUTE} or null"
      - name: revision_count
        type: integer
        source: computed
        description: Number of REJECTED -> DRAFT revision loops this filing has been through.
        default: 0
      - name: superseded_registration_id
        type: string
        source: computed
        description: >
          FK -> Registration.id; set on a newly created Registration when it
          supersedes a pre-existing DRAFT filing for the same (broker_id,
          state_code) pair. Null when nothing was superseded.
        default: null

  - name: DisclosureItem
    parent: Registration
    common_fields: false
    fields:
      - name: registration_id
        type: string
        source: input
        description: FK -> Registration.id; the filing this data-practice disclosure belongs to.
      - name: category
        type: enum
        source: input
        description: Which mandatory data-practice disclosure this item answers.
        constraints: "one of {SOURCES, RECIPIENTS, RETENTION, SENSITIVE_CATEGORIES, OPT_OUT_MECHANISM, MINORS_DATA}; at most one item per category per registration"
      - name: content
        type: string
        source: input
        description: Disclosure prose as filed.
        constraints: 1..2000 chars, required
      - name: content_length
        type: integer
        source: computed
        description: Character count of content; a value below MIN_CONTENT_CHARS halves the category's weight credit.
        default: 0
      - name: covers_sensitive_categories
        type: boolean
        source: input
        description: True when this disclosure covers sensitive data categories, which multiplies its filing surcharge.
        default: false
      - name: weight_credit
        type: number
        source: computed
        description: Points this item contributes to Registration.disclosure_completeness_score.
        default: 0.00
      - name: surcharge_cents
        type: integer
        source: computed
        description: Per-category filing surcharge for this item, already rounded to whole cents.
        default: 0

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: FK -> DataBroker.id; the broker holding this consumer record.
      - name: identity_hash
        type: string
        source: input
        description: Pseudonymous handle for the consumer inside this broker's records.
        constraints: 8..128 chars; unique per broker_id
      - name: state_code
        type: string
        source: input
        description: Two-letter code of the consumer's residency state; selects which Registration must cover a deletion.
        constraints: exactly 2 uppercase letters
      - name: sensitive_categories
        type: array
        source: input
        description: >
          Sensitive data categories held about this consumer. A non-empty array
          makes CONSENT_GRANTED a precondition of any further collection.
        default: []
        constraints: "distinct values from {PRECISE_GEOLOCATION, BIOMETRIC, HEALTH, RACE_OR_ETHNICITY, SEXUAL_ORIENTATION, IMMIGRATION_STATUS, MINOR_STATUS}"
      - name: derived_profile_count
        type: integer
        source: input
        description: >
          Number of derived/inferred datasets built from this consumer. Greater than
          zero adds a DERIVED_DATASET PropagationTask at deletion execution.
        default: 0
        constraints: 0..50
      - name: source_label
        type: string
        source: input
        description: Label of the acquisition source of the most recent collection event.
        constraints: 1..80 chars, required
      - name: collection_status
        type: enum
        source: computed
        description: >
          Collection dimension of this consumer's parallel state machine; evolves
          independently of consent_status. See §1.2 Consumer.collection_status.
        default: ACTIVE
        constraints: "one of {ACTIVE, PURGE_PENDING, PURGED, REACQUIRED}"
      - name: consent_status
        type: enum
        source: computed
        description: >
          Sensitive-processing consent dimension of the same parallel machine.
          Initialised to NOT_REQUIRED when sensitive_categories is empty at
          creation, otherwise CONSENT_PENDING. See §1.2 Consumer.consent_status.
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, CONSENT_PENDING, CONSENT_GRANTED, CONSENT_REVOKED}"
      - name: collection_event_count
        type: integer
        source: computed
        description: Number of accepted collection events recorded for this consumer, starting at 1 for the creating call.
        default: 1
      - name: opt_out_sale
        type: boolean
        source: computed
        description: True once an OptOutSignal with scope SALE or SALE_AND_SHARING has been HONORED for this consumer.
        default: false
      - name: opt_out_sharing
        type: boolean
        source: computed
        description: True once an OptOutSignal with scope SHARING or SALE_AND_SHARING has been HONORED for this consumer.
        default: false
      - name: last_purged_at
        type: datetime
        source: system
        description: Clock instant at which collection_status last became PURGED.
        default: null

  - name: DeletionRequest
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: FK -> DataBroker.id; the broker obliged to execute the deletion.
      - name: consumer_id
        type: string
        source: input
        description: FK -> Consumer.id; the data subject. Must belong to broker_id.
      - name: intake_channel
        type: enum
        source: input
        description: Required intake mechanism the request arrived through.
        constraints: "one of {DIRECT_PORTAL, STATE_PLATFORM, AUTHORIZED_AGENT, EMAIL}"
      - name: requested_scope
        type: enum
        source: input
        description: Whether the consumer asked for full deletion or only sensitive categories.
        default: DELETE_ALL
        constraints: "one of {DELETE_ALL, DELETE_SENSITIVE_ONLY}"
      - name: status
        type: enum
        source: computed
        description: Request lifecycle state; see §1.2 state machine for DeletionRequest.status.
        default: RECEIVED
        constraints: "one of {RECEIVED, VERIFICATION_PENDING, VERIFIED, VERIFICATION_FAILED, EXECUTING, COMPLETED, PARTIALLY_COMPLETED, DENIED, WITHDRAWN, SUPERSEDED}"
      - name: identity_assurance_score
        type: number
        source: computed
        description: >
          Maximum VerificationAttempt.assurance_score across this request's
          attempts; 0.00 while no attempt exists. Gate for the VERIFIED decision.
        default: 0.00
        constraints: 0.00..100.00, 2 decimal places
      - name: verification_attempt_count
        type: integer
        source: computed
        description: Count of VerificationAttempts recorded on this request.
        default: 0
      - name: failed_attempt_count
        type: integer
        source: computed
        description: Count of this request's VerificationAttempts with outcome FAIL; drives the fraud penalty of the next attempt.
        default: 0
      - name: agent_loa_reference
        type: string
        source: input
        description: Letter-of-authority reference when an authorised agent filed the request.
        default: null
        constraints: 1..80 chars or null; required when intake_channel == AUTHORIZED_AGENT
      - name: intake_user_id
        type: string
        source: system
        description: X-User-ID captured at intake.
      - name: verification_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PrivacyReviewer who decided verification; segregation of duties bars this user from executing.
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID of the PrivacyReviewer who launched execution.
        default: null
      - name: propagation_required_count
        type: integer
        source: computed
        description: >
          Total PropagationTasks minted at execution. Conserved quantity:
          propagation_required_count == acked_task_count + waived_task_count +
          abandoned_task_count + outstanding_task_count.
        default: 0
      - name: downstream_task_count
        type: integer
        source: computed
        description: Subset of propagation_required_count with target_kind == DOWNSTREAM_RECIPIENT; zero when the recipient candidate pool is empty.
        default: 0
      - name: acked_task_count
        type: integer
        source: computed
        description: Count of this request's PropagationTasks with status ACKED.
        default: 0
      - name: waived_task_count
        type: integer
        source: computed
        description: Count of this request's PropagationTasks with status WAIVED.
        default: 0
      - name: abandoned_task_count
        type: integer
        source: computed
        description: Count of this request's PropagationTasks with status ABANDONED.
        default: 0
      - name: outstanding_task_count
        type: integer
        source: computed
        description: "Count of this request's PropagationTasks with status IN {PENDING, DISPATCHED, DEFERRED, FAILED}."
        default: 0
      - name: completion_ratio
        type: number
        source: computed
        description: Weighted propagation coverage from calculations.deletion_completion_ratio.
        default: 0.0000
        constraints: 0.0000..1.0000, 4 decimal places
      - name: compliance_breach
        type: boolean
        source: computed
        description: True when every task reached a terminal status but completion_ratio landed below COMPLETION_BREACH_THRESHOLD.
        default: false
      - name: executed_at
        type: datetime
        source: system
        description: Clock instant of the VERIFIED -> EXECUTING transition.
        default: null
      - name: denial_reason_code
        type: enum
        source: input
        description: Reviewer's denial ground, supplied on the deny action.
        default: null
        constraints: "one of {IDENTITY_UNVERIFIED, EXEMPT_RECORD, DUPLICATE_REQUEST} or null"

  - name: VerificationAttempt
    parent: DeletionRequest
    common_fields: false
    fields:
      - name: deletion_request_id
        type: string
        source: input
        description: FK -> DeletionRequest.id; the request this identity proof belongs to.
      - name: method
        type: enum
        source: input
        description: Identity proof mechanism presented.
        constraints: "one of {GOVT_ID, TWO_DATA_POINTS, PLATFORM_ASSERTION, AGENT_LOA}"
      - name: evidence_points_count
        type: integer
        source: input
        description: Count of corroborating data points supplied; only the first MAX_EVIDENCE_POINTS_COUNTED are credited.
        constraints: 0..10
      - name: document_quality_score
        type: number
        source: input
        description: Operator-graded legibility of the submitted documents, 0..100.
        default: 0.00
        constraints: 0.00..100.00
      - name: platform_assertion_reference
        type: string
        source: input
        description: Assertion id issued by the centralized state deletion platform; required to unlock the PLATFORM_ASSERTED variant.
        default: null
        constraints: 1..80 chars or null
      - name: variant_applied
        type: enum
        source: computed
        description: Which calculations.identity_assurance_score variant scored this attempt.
        constraints: "one of {FRAUD_WEIGHTED, PLATFORM_ASSERTED}"
      - name: raw_score
        type: number
        source: computed
        description: Pre-penalty, pre-floor score from the method base, credited evidence points and document quality.
        default: 0.00
      - name: fraud_penalty_applied
        type: number
        source: computed
        description: FRAUD_PENALTY_PER_PRIOR_FAIL times the number of FAIL attempts already on this request.
        default: 0.00
      - name: assurance_score
        type: number
        source: computed
        description: Final identity assurance for this attempt after variant, penalty, floor and clamp.
        default: 0.00
        constraints: 0.00..100.00, 2 decimal places
      - name: outcome
        type: enum
        source: computed
        description: Derived from assurance_score against ATTEMPT_PASS_THRESHOLD and ATTEMPT_INCONCLUSIVE_THRESHOLD; never accepted as input.
        constraints: "one of {PASS, INCONCLUSIVE, FAIL}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the intake operator or state platform that recorded the attempt.

  - name: DownstreamRecipient
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: FK -> DataBroker.id; the broker that sold or shared data to this recipient.
      - name: name
        type: string
        source: input
        description: Recipient organisation name.
        constraints: 1..160 chars, required
      - name: contract_propagation_required
        type: boolean
        source: input
        description: True when the data-sharing contract obliges the broker to propagate deletions to this recipient.
        default: true
      - name: ack_sla_days
        type: integer
        source: input
        description: Contractual days this recipient has to acknowledge a propagated deletion.
        constraints: 1..90
      - name: status
        type: enum
        source: computed
        description: Recipient posture; see §1.2 state machine for DownstreamRecipient.status.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"
      - name: on_time_ack_count
        type: integer
        source: computed
        description: Acknowledgements received at or before PropagationTask.due_at.
        default: 0
      - name: late_ack_count
        type: integer
        source: computed
        description: Acknowledgements received strictly after PropagationTask.due_at.
        default: 0
      - name: fail_count
        type: integer
        source: computed
        description: PropagationTasks of this recipient that were marked FAILED.
        default: 0
      - name: waive_count
        type: integer
        source: computed
        description: PropagationTasks of this recipient that were WAIVED.
        default: 0
      - name: reliability_score
        type: number
        source: computed
        description: calculations.recipient_reliability_score output; also the ranking key for propagation task minting order.
        default: 90.00
        constraints: 0.00..100.00, 2 decimal places

  - name: PropagationTask
    parent: DeletionRequest
    common_fields: true
    fields:
      - name: deletion_request_id
        type: string
        source: computed
        description: FK -> DeletionRequest.id; the request whose execution minted this task.
      - name: recipient_id
        type: string
        source: computed
        description: >
          FK -> DownstreamRecipient.id; null for the internal target kinds
          ACTIVE_DATABASE, BACKUP_ARCHIVE and DERIVED_DATASET.
        default: null
      - name: target_kind
        type: enum
        source: computed
        description: Which store the deletion must reach.
        constraints: "one of {ACTIVE_DATABASE, BACKUP_ARCHIVE, DERIVED_DATASET, DOWNSTREAM_RECIPIENT}"
      - name: status
        type: enum
        source: computed
        description: Task lifecycle; see §1.2 state machine for PropagationTask.status.
        default: PENDING
        constraints: "one of {PENDING, DISPATCHED, DEFERRED, FAILED, ACKED, WAIVED, ABANDONED}"
      - name: weight
        type: integer
        source: computed
        description: TARGET_WEIGHT for this target_kind; numerator and denominator unit of completion_ratio.
        default: 0
      - name: sla_days
        type: integer
        source: computed
        description: Days allowed to acknowledge; INTERNAL_SLA_DAYS for internal kinds, recipient.ack_sla_days for DOWNSTREAM_RECIPIENT.
        default: 0
      - name: due_at
        type: datetime
        source: computed
        description: Execution clock instant plus sla_days; an unacknowledged task past due_at is ABANDONED by the compliance sweep.
      - name: dispatched_at
        type: datetime
        source: system
        description: Clock instant of the most recent transition into DISPATCHED.
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: Clock instant of the DISPATCHED -> ACKED transition.
        default: null
      - name: ack_was_late
        type: boolean
        source: computed
        description: True when acknowledged_at is strictly after due_at.
        default: false
      - name: dispatch_count
        type: integer
        source: computed
        description: Number of times this task entered DISPATCHED, including re-dispatch after FAILED.
        default: 0
      - name: failure_code
        type: enum
        source: input
        description: Reason supplied on the fail action.
        default: null
        constraints: "one of {RECIPIENT_UNREACHABLE, SCHEMA_MISMATCH, LEGAL_HOLD} or null"
      - name: deferral_reason
        type: enum
        source: computed
        description: >
          Why a cascade parked this task in DEFERRED. RECIPIENT_SUSPENDED when the
          recipient itself was suspended (manual status change or a reliability
          drop below 70.00); BROKER_DELINQUENT when the parking was caused by the
          broker losing COMPLIANT registry standing.
        default: null
        constraints: "one of {RECIPIENT_SUSPENDED, BROKER_DELINQUENT} or null"
      - name: waiver_justification
        type: string
        source: input
        description: Reviewer's written justification recorded on the waive action.
        default: null
        constraints: 10..400 chars or null

  - name: SuppressionEntry
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: FK -> DataBroker.id; the broker bound by this suppression.
      - name: consumer_id
        type: string
        source: input
        description: FK -> Consumer.id; the consumer whose records must not be re-collected.
      - name: originating_request_id
        type: string
        source: computed
        description: >
          FK -> DeletionRequest.id; the request whose completion auto-created this
          entry. Null for entries created directly by a reviewer.
        default: null
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the suppression window. The window is the CLOSED interval [window_start, window_end].
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the suppression window.
      - name: source_scope
        type: enum
        source: input
        description: Whether suppression covers every acquisition source or only the originating one.
        constraints: "one of {ALL_SOURCES, SINGLE_SOURCE}"
      - name: status
        type: enum
        source: computed
        description: Suppression lifecycle; see §1.2 state machine for SuppressionEntry.status.
        default: ACTIVE
        constraints: "one of {ACTIVE, LIFTED, EXPIRED}"
      - name: lift_justification
        type: string
        source: input
        description: Reviewer's justification recorded on the lift action.
        default: null
        constraints: 10..400 chars or null
      - name: blocked_recollection_count
        type: integer
        source: computed
        description: >
          Number of collection attempts this entry has rejected. Incremented even
          though the rejected call answers 409, because the registry requires the
          attempt itself to be on the record.
        default: 0

  - name: OptOutSignal
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: FK -> DataBroker.id; the broker the opt-out is directed at.
      - name: consumer_id
        type: string
        source: input
        description: FK -> Consumer.id; the consumer exercising the opt-out.
      - name: signal_type
        type: enum
        source: input
        description: Which recognised mechanism carried the preference.
        constraints: "one of {GPC_BROWSER, PLATFORM_BULK, WRITTEN_REQUEST, AGENT_SUBMITTED}"
      - name: scope
        type: enum
        source: input
        description: Whether the consumer opted out of sale, sharing, or both.
        constraints: "one of {SALE, SHARING, SALE_AND_SHARING}"
      - name: gpc_header_value
        type: string
        source: input
        description: Raw browser Global-Privacy-Control header value; must be the string "1" for a GPC_BROWSER signal to be recognised.
        default: null
        constraints: 1..8 chars or null
      - name: agent_reference
        type: string
        source: input
        description: Authorised-agent reference; required when signal_type == AGENT_SUBMITTED.
        default: null
        constraints: 1..80 chars or null
      - name: status
        type: enum
        source: computed
        description: Signal lifecycle; see §1.2 state machine for OptOutSignal.status.
        default: RECEIVED
        constraints: "one of {RECEIVED, HONORED, SUPERSEDED}"
      - name: honor_deadline_at
        type: datetime
        source: computed
        description: Creation instant plus SIGNAL_HONOR_DEADLINE_DAYS; the compliance sweep honors non-instant signals once the clock reaches it.
      - name: honored_at
        type: datetime
        source: system
        description: Clock instant at which status became HONORED.
        default: null

  - name: RegulatorInquiry
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: FK -> DataBroker.id; the broker under inquiry.
      - name: scope_note
        type: string
        source: input
        description: Regulator's statement of what the inquiry covers.
        constraints: 10..600 chars, required
      - name: response_due_at
        type: datetime
        source: input
        description: Deadline for the broker's response; must be strictly after the current clock instant.
      - name: status
        type: enum
        source: computed
        description: Inquiry lifecycle; see §1.2 state machine for RegulatorInquiry.status.
        default: OPEN
        constraints: "one of {OPEN, RESPONDED, CLOSED, ESCALATED}"
      - name: cited_audit_event_ids
        type: array
        source: computed
        description: AuditEvent ids the broker cited in its most recent response, stored in the order supplied.
        default: []
      - name: cited_event_count
        type: integer
        source: computed
        description: Length of cited_audit_event_ids on the most recent response.
        default: 0
      - name: coverage_bonus_applied
        type: boolean
        source: computed
        description: True when the cited set contained at least one AuditEvent of each MANDATORY_COVERAGE_EVENT_TYPE.
        default: false
      - name: evidence_score
        type: number
        source: computed
        description: Step-1 output of calculations.regulator_response_adequacy; the key of the deficiency penalty tier.
        default: 0.00
      - name: deficiency_penalty
        type: number
        source: computed
        description: Step-2 penalty selected by the tier table keyed on evidence_score.
        default: 0.00
      - name: late_response_penalty
        type: number
        source: computed
        description: LATE_RESPONSE_PENALTY when the response landed after response_due_at, else 0.00.
        default: 0.00
      - name: adequacy_score
        type: number
        source: computed
        description: Step-3 output of calculations.regulator_response_adequacy.
        default: 0.00
        constraints: 0.00..100.00, 2 decimal places
      - name: adequacy_verdict
        type: enum
        source: computed
        description: ADEQUATE when adequacy_score >= ADEQUATE_THRESHOLD after a response, DEFICIENT when below, UNRATED before any response.
        default: UNRATED
        constraints: "one of {UNRATED, ADEQUATE, DEFICIENT}"
      - name: responded_at
        type: datetime
        source: system
        description: Clock instant of the most recent transition into RESPONDED.
        default: null
      - name: deficiency_code
        type: enum
        source: input
        description: Regulator's escalation ground, supplied on the escalate action; null for sweep-driven escalation.
        default: null
        constraints: "one of {MISSING_AUDIT_TRAIL, UNVERIFIED_IDENTITY_PRACTICE, PROPAGATION_GAP} or null"
      - name: escalation_count
        type: integer
        source: computed
        description: Number of times this inquiry has entered ESCALATED.
        default: 0

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: broker_id
        type: string
        source: computed
        description: FK -> DataBroker.id; the broker whose compliance record this event belongs to.
      - name: sequence_no
        type: integer
        source: computed
        description: Per-broker monotonic counter starting at 1; the canonical ordering key of the audit trail.
      - name: event_type
        type: enum
        source: computed
        description: Which recorded action this event attests to.
        constraints: "one of {BROKER_REGISTERED, FEE_DEPOSITED, REGISTRATION_CREATED, DISCLOSURE_ADDED, REGISTRATION_SUBMITTED, REGISTRATION_ACCEPTED, REGISTRATION_REJECTED, REGISTRATION_WITHDRAWN, REGISTRATION_EXPIRED, STANDING_CHANGED, CONSUMER_RECORDED, CONSUMER_COLLECTION_RECORDED, RECOLLECTION_BLOCKED, CONSENT_CHANGED, DELETION_REQUEST_RECEIVED, DELETION_REQUEST_SUPERSEDED, VERIFICATION_ATTEMPT_RECORDED, VERIFICATION_DECIDED, DELETION_EXECUTED, PROPAGATION_DISPATCHED, PROPAGATION_ACKED, PROPAGATION_FAILED, PROPAGATION_WAIVED, PROPAGATION_DEFERRED, PROPAGATION_ABANDONED, DELETION_COMPLETED, DELETION_DENIED, DELETION_WITHDRAWN, SUPPRESSION_CREATED, SUPPRESSION_LIFTED, SUPPRESSION_EXPIRED, RECIPIENT_REGISTERED, RECIPIENT_STATUS_CHANGED, OPT_OUT_RECEIVED, OPT_OUT_HONORED, INQUIRY_OPENED, INQUIRY_RESPONDED, INQUIRY_CLOSED, INQUIRY_ESCALATED}"
      - name: subject_kind
        type: enum
        source: computed
        description: Entity family the event is about.
        constraints: "one of {BROKER, REGISTRATION, DISCLOSURE, CONSUMER, DELETION_REQUEST, VERIFICATION_ATTEMPT, PROPAGATION_TASK, RECIPIENT, SUPPRESSION_ENTRY, OPT_OUT_SIGNAL, INQUIRY}"
      - name: subject_id
        type: string
        source: computed
        description: Identifier of the entity instance the event is about.
      - name: actor_role
        type: string
        source: computed
        description: X-User-Role of the caller that caused the event, or the literal "system" for sweep-driven events.
      - name: actor_user_id
        type: string
        source: computed
        description: X-User-ID of the caller that caused the event; null for sweep-driven events.
        default: null
      - name: summary
        type: string
        source: computed
        description: One-line human-readable description of what was recorded.
      - name: retention_expires_at
        type: datetime
        source: computed
        description: created_at plus AUDIT_RETENTION_DAYS; the event may not be pruned before this instant.

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# Consumer carries two independent state dimensions (collection_status and
# consent_status) on the same row; each is declared as its own machine below via
# the `state_field:` key.
# -----------------------------------------------------------------------------
state_machines:
  - entity: Registration
    state_field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /registrations/{id}/submit"
        actor: BrokerAdmin
        preconditions:
          - "Registration.status == DRAFT"
          - "X-User-ID == Registration.broker_id"
          - "every category in REQUIRED_DISCLOSURE_CATEGORIES has a DisclosureItem on this registration, else ERR_REQUIRED_DISCLOSURE_MISSING"
          - "if any Consumer with Consumer.broker_id == Registration.broker_id has a non-empty sensitive_categories array, a DisclosureItem with category == SENSITIVE_CATEGORIES must exist on this registration, else ERR_REQUIRED_DISCLOSURE_MISSING"
          - "Registration.disclosure_completeness_score >= SUBMIT_COMPLETENESS_THRESHOLD (80.00), else ERR_DISCLOSURE_INCOMPLETE"
          - "no other Registration with the same (broker_id, state_code) and status IN {SUBMITTED, ACCEPTED} has a half-open coverage interval intersecting this one, else ERR_COVERAGE_PERIOD_OVERLAP"
          - "DataBroker.fee_credit_cents >= the PROVISIONAL_AT_SUBMIT filing fee, else ERR_FILING_FEE_UNPAID"
        side_effects:
          - "calculations.filing_fee_assessment variant PROVISIONAL_AT_SUBMIT runs; Registration.provisional_filing_fee_cents and Registration.charged_fee_cents are both set to its output"
          - "DataBroker.fee_credit_cents -= Registration.charged_fee_cents; DataBroker.fee_paid_cents += Registration.charged_fee_cents (DataBroker.fee_deposited_cents unchanged)"
          - "Registration.submitted_at = current clock instant"
          - "increments DataBroker.version by 1"
          - "appends AuditEvent(event_type=REGISTRATION_SUBMITTED, subject_kind=REGISTRATION, subject_id=Registration.id)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /registrations/{id}/accept"
        actor: PlatformAdmin
        preconditions:
          - "Registration.status == SUBMITTED"
          - "when the FINAL_AT_ACCEPTANCE fee exceeds provisional_filing_fee_cents, DataBroker.fee_credit_cents >= (final - provisional), else ERR_FILING_FEE_UNPAID"
        side_effects:
          - "Registration.coverage_days = whole days in [coverage_period_start, coverage_period_end)"
          - "calculations.filing_fee_assessment variant FINAL_AT_ACCEPTANCE runs; Registration.final_filing_fee_cents = its output; Registration.charged_fee_cents = final_filing_fee_cents"
          - "settlement delta = final_filing_fee_cents - provisional_filing_fee_cents; when delta < 0 the broker's fee_paid_cents -= |delta| and fee_credit_cents += |delta|; when delta > 0 the reverse; DataBroker.fee_deposited_cents unchanged"
          - "Registration.accepted_at = current clock instant"
          - "calculations.registry_standing_derivation re-runs for the broker; a value change appends AuditEvent(event_type=STANDING_CHANGED) and, when the new value is COMPLIANT, clears DataBroker.delinquent_since to null"
          - "appends AuditEvent(event_type=REGISTRATION_ACCEPTED, subject_kind=REGISTRATION, subject_id=Registration.id)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /registrations/{id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "Registration.status == SUBMITTED"
          - "rejection_reason_code is one of {INCOMPLETE_DISCLOSURE, INACCURATE_DESCRIPTION, FEE_DISPUTE}"
        side_effects:
          - "Registration.rejection_reason_code = supplied code; Registration.final_filing_fee_cents = null"
          - "CASCADE LINK 1: DataBroker.fee_paid_cents -= Registration.charged_fee_cents and DataBroker.fee_credit_cents += the same amount, then Registration.charged_fee_cents = 0"
          - "CASCADE LINK 2 (caused by link 1 removing the state's only ACCEPTED-or-SUBMITTED filing): calculations.registry_standing_derivation re-runs; when it flips COMPLIANT -> DELINQUENT, DataBroker.delinquent_since = current clock instant and AuditEvent(event_type=STANDING_CHANGED) is appended"
          - "CASCADE LINK 3 (caused by link 2 only, and only when registry_standing actually changed value): every DownstreamRecipient of this broker with status == ACTIVE and contract_propagation_required == true transitions ACTIVE -> SUSPENDED"
          - "CASCADE LINK 4 (caused by link 3 only): for each recipient suspended by link 3, its PropagationTasks with status IN {PENDING, DISPATCHED} transition to DEFERRED with deferral_reason = BROKER_DELINQUENT (the standing flip, not a recipient-local fault, is what parked them)"
          - "appends AuditEvent(event_type=REGISTRATION_REJECTED, subject_kind=REGISTRATION, subject_id=Registration.id)"
        note: "Rejection is not terminal — adding a DisclosureItem reopens the filing as DRAFT."
      - from: REJECTED
        to: DRAFT
        trigger: "POST /registrations/{id}/disclosures"
        actor: BrokerAdmin
        preconditions:
          - "Registration.status == REJECTED"
          - "no DisclosureItem with the same category already exists on this registration, else ERR_DUPLICATE_DISCLOSURE_CATEGORY"
        side_effects:
          - "Registration.revision_count += 1; Registration.rejection_reason_code = null"
          - "the new DisclosureItem is inserted and Registration.disclosure_completeness_score is recomputed by calculations.disclosure_completeness_score"
          - "appends AuditEvent(event_type=DISCLOSURE_ADDED, subject_kind=DISCLOSURE, subject_id=DisclosureItem.id)"
        note: "Revision loop DRAFT -> SUBMITTED -> REJECTED -> DRAFT; each pass increments revision_count."
      - from: DRAFT
        to: DRAFT
        trigger: "POST /registrations/{id}/disclosures"
        actor: BrokerAdmin
        preconditions:
          - "Registration.status == DRAFT"
          - "no DisclosureItem with the same category already exists on this registration, else ERR_DUPLICATE_DISCLOSURE_CATEGORY"
        side_effects:
          - "the new DisclosureItem is inserted; DisclosureItem.content_length, weight_credit and surcharge_cents are computed"
          - "Registration.disclosure_completeness_score is recomputed by calculations.disclosure_completeness_score"
          - "appends AuditEvent(event_type=DISCLOSURE_ADDED, subject_kind=DISCLOSURE, subject_id=DisclosureItem.id)"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /registrations/{id}/withdraw"
        actor: BrokerAdmin
        preconditions:
          - "Registration.status IN {DRAFT, SUBMITTED, ACCEPTED}"
          - "X-User-ID == Registration.broker_id"
        side_effects:
          - "CASCADE LINK 1: DataBroker.fee_paid_cents -= Registration.charged_fee_cents and DataBroker.fee_credit_cents += the same amount, then Registration.charged_fee_cents = 0"
          - "CASCADE LINK 2 (caused by link 1 retiring the filing that covered an operating state): calculations.registry_standing_derivation re-runs; a COMPLIANT -> DELINQUENT flip sets DataBroker.delinquent_since = current clock instant and appends AuditEvent(event_type=STANDING_CHANGED)"
          - "CASCADE LINK 3 (caused by link 2 only, and only when registry_standing actually changed value): every DownstreamRecipient of this broker with status == ACTIVE and contract_propagation_required == true transitions ACTIVE -> SUSPENDED and appends AuditEvent(event_type=RECIPIENT_STATUS_CHANGED)"
          - "CASCADE LINK 4 (caused by link 3 only): for each recipient suspended by link 3, its PropagationTasks with status IN {PENDING, DISPATCHED} transition to DEFERRED with deferral_reason = BROKER_DELINQUENT (the standing flip, not a recipient-local fault, is what parked them) and append AuditEvent(event_type=PROPAGATION_DEFERRED)"
          - "appends AuditEvent(event_type=REGISTRATION_WITHDRAWN, subject_kind=REGISTRATION, subject_id=Registration.id)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /registrations (a newly created filing for the same broker_id and state_code supersedes this DRAFT)"
        actor: system
        preconditions:
          - "the pre-existing Registration has status == DRAFT and the same (broker_id, state_code) as the incoming filing"
        side_effects:
          - "the pre-existing DRAFT transitions to WITHDRAWN; its charged_fee_cents is already 0 so no fee movement occurs"
          - "the new Registration's superseded_registration_id is set to the withdrawn filing's id"
          - "appends AuditEvent(event_type=REGISTRATION_WITHDRAWN, subject_kind=REGISTRATION, subject_id=<withdrawn filing id>)"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "POST /_ops/run-compliance-sweep (step 1)"
        actor: system
        preconditions:
          - "Registration.status == ACCEPTED"
          - "Registration.coverage_period_end <= current clock instant"
        side_effects:
          - "DataBroker.fee_paid_cents -= Registration.charged_fee_cents; DataBroker.fee_credit_cents += the same amount; Registration.charged_fee_cents = 0"
          - "calculations.registry_standing_derivation re-runs for the broker with the same link-3 and link-4 cascade as the withdraw transition"
          - "appends AuditEvent(event_type=REGISTRATION_EXPIRED, subject_kind=REGISTRATION, subject_id=Registration.id)"

  - entity: DeletionRequest
    state_field: status
    initial_state: RECEIVED
    terminal_states: [COMPLETED, PARTIALLY_COMPLETED, DENIED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: VERIFICATION_PENDING
        trigger: "POST /deletion-requests/{id}/verification-attempts"
        actor: IntakeAgent
        preconditions:
          - "DeletionRequest.status IN {RECEIVED, VERIFICATION_PENDING, VERIFICATION_FAILED}"
          - "when method == AGENT_LOA, DeletionRequest.agent_loa_reference is not null, else ERR_INVALID_REQUEST"
        side_effects:
          - "calculations.identity_assurance_score runs for the new VerificationAttempt, setting variant_applied, raw_score, fraud_penalty_applied, assurance_score and outcome"
          - "DeletionRequest.verification_attempt_count += 1; failed_attempt_count += 1 when outcome == FAIL"
          - "DeletionRequest.identity_assurance_score = max(assurance_score) over all attempts on this request"
          - "appends AuditEvent(event_type=VERIFICATION_ATTEMPT_RECORDED, subject_kind=VERIFICATION_ATTEMPT, subject_id=VerificationAttempt.id)"
      - from: VERIFICATION_PENDING
        to: VERIFICATION_PENDING
        trigger: "POST /deletion-requests/{id}/verification-attempts"
        actor: IntakeAgent
        preconditions:
          - "DeletionRequest.status == VERIFICATION_PENDING"
        side_effects:
          - "same effects as the RECEIVED -> VERIFICATION_PENDING transition; the fraud penalty of this attempt uses failed_attempt_count as observed before this attempt is scored"
      - from: VERIFICATION_FAILED
        to: VERIFICATION_PENDING
        trigger: "POST /deletion-requests/{id}/verification-attempts"
        actor: IntakeAgent
        preconditions:
          - "DeletionRequest.status == VERIFICATION_FAILED"
        side_effects:
          - "same effects as the RECEIVED -> VERIFICATION_PENDING transition"
          - "DeletionRequest.verification_decided_by_user_id is left unchanged so the earlier reviewer stays barred from executing"
        note: "Re-verification loop VERIFICATION_PENDING -> VERIFICATION_FAILED -> VERIFICATION_PENDING."
      - from: VERIFICATION_PENDING
        to: VERIFIED
        trigger: "POST /deletion-requests/{id}/decide-verification with decision == VERIFIED"
        actor: PrivacyReviewer
        preconditions:
          - "DeletionRequest.status == VERIFICATION_PENDING"
          - "DeletionRequest.identity_assurance_score >= ATTEMPT_PASS_THRESHOLD (70.00), else ERR_ASSURANCE_BELOW_THRESHOLD"
        side_effects:
          - "DeletionRequest.verification_decided_by_user_id = X-User-ID"
          - "appends AuditEvent(event_type=VERIFICATION_DECIDED, subject_kind=DELETION_REQUEST, subject_id=DeletionRequest.id)"
      - from: VERIFICATION_PENDING
        to: VERIFICATION_FAILED
        trigger: "POST /deletion-requests/{id}/decide-verification with decision == FAILED"
        actor: PrivacyReviewer
        preconditions:
          - "DeletionRequest.status == VERIFICATION_PENDING"
        side_effects:
          - "DeletionRequest.verification_decided_by_user_id = X-User-ID"
          - "appends AuditEvent(event_type=VERIFICATION_DECIDED, subject_kind=DELETION_REQUEST, subject_id=DeletionRequest.id)"
      - from: VERIFIED
        to: EXECUTING
        trigger: "POST /deletion-requests/{id}/execute"
        actor: PrivacyReviewer
        preconditions:
          - "DeletionRequest.status == VERIFIED, else ERR_REQUEST_INVALID_STATE"
          - "the Consumer's sensitive_categories is empty OR Consumer.consent_status != CONSENT_PENDING, else ERR_SENSITIVE_CONSENT_REQUIRED"
          - "a Registration exists with the same broker_id, state_code == Consumer.state_code, status == ACCEPTED and coverage_period_start <= current clock instant < coverage_period_end, else ERR_NO_ACCEPTED_REGISTRATION"
          - "X-User-ID != DeletionRequest.verification_decided_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "DeletionRequest.executed_by_user_id = X-User-ID; executed_at = current clock instant"
          - "FORK: calculations.propagation_plan mints one PropagationTask per required target; propagation_required_count, downstream_task_count and outstanding_task_count are set from the minted set"
          - "Consumer.collection_status transitions ACTIVE -> PURGE_PENDING (or REACQUIRED -> PURGE_PENDING)"
          - "DeletionRequest.completion_ratio is recomputed by calculations.deletion_completion_ratio (0.0000 while nothing is acknowledged)"
          - "appends AuditEvent(event_type=DELETION_EXECUTED, subject_kind=DELETION_REQUEST, subject_id=DeletionRequest.id)"
      - from: EXECUTING
        to: COMPLETED
        trigger: "system join — the last PropagationTask of this request reaches a terminal status"
        actor: system
        preconditions:
          - "every PropagationTask of this request has status IN {ACKED, WAIVED, ABANDONED}"
          - "DeletionRequest.completion_ratio >= 1.0000"
        side_effects:
          - "CASCADE LINK 2 (caused by the task's own terminal transition): DeletionRequest.status = COMPLETED; compliance_breach stays false"
          - "CASCADE LINK 3 (caused by link 2): Consumer.collection_status PURGE_PENDING -> PURGED, Consumer.last_purged_at = current clock instant, and one SuppressionEntry is created with status ACTIVE, source_scope ALL_SOURCES, window_start = current clock instant, window_end = window_start + SUPPRESSION_DEFAULT_DAYS, originating_request_id = this request's id"
          - "CASCADE LINK 4 (caused by link 3): every other DeletionRequest of the same consumer with status IN {RECEIVED, VERIFICATION_PENDING, VERIFICATION_FAILED} transitions to SUPERSEDED, and for each one DataBroker.request_open_count -= 1 and DataBroker.request_terminated_count += 1"
          - "DataBroker.request_open_count -= 1 and DataBroker.request_completed_count += 1 for this request"
          - "appends AuditEvent(event_type=DELETION_COMPLETED) then AuditEvent(event_type=SUPPRESSION_CREATED) then one AuditEvent(event_type=DELETION_REQUEST_SUPERSEDED) per request superseded by link 4, in that order"
      - from: EXECUTING
        to: PARTIALLY_COMPLETED
        trigger: "system join — the last PropagationTask of this request reaches a terminal status"
        actor: system
        preconditions:
          - "every PropagationTask of this request has status IN {ACKED, WAIVED, ABANDONED}"
          - "DeletionRequest.completion_ratio < 1.0000"
        side_effects:
          - "DeletionRequest.status = PARTIALLY_COMPLETED"
          - "DeletionRequest.compliance_breach = true when completion_ratio < COMPLETION_BREACH_THRESHOLD (0.7500), false otherwise"
          - "when compliance_breach became true, DataBroker.open_breach_count += 1 and calculations.registry_standing_derivation re-runs (a non-zero open_breach_count forces DELINQUENT)"
          - "the same link-3 and link-4 cascade as the COMPLETED transition runs: Consumer -> PURGED, SuppressionEntry created, sibling open requests SUPERSEDED"
          - "DataBroker.request_open_count -= 1 and DataBroker.request_completed_count += 1 for this request"
          - "appends AuditEvent(event_type=DELETION_COMPLETED, subject_kind=DELETION_REQUEST, subject_id=DeletionRequest.id)"
        note: "Divergent branch of the fork-join: the same join point yields COMPLETED or PARTIALLY_COMPLETED with a strictly larger side-effect set on the latter."
      - from: RECEIVED
        to: DENIED
        trigger: "POST /deletion-requests/{id}/deny"
        actor: PrivacyReviewer
        preconditions:
          - "DeletionRequest.status IN {RECEIVED, VERIFICATION_PENDING, VERIFICATION_FAILED}"
          - "denial_reason_code is one of {IDENTITY_UNVERIFIED, EXEMPT_RECORD, DUPLICATE_REQUEST}"
        side_effects:
          - "DeletionRequest.denial_reason_code = supplied code"
          - "DataBroker.request_open_count -= 1; DataBroker.request_terminated_count += 1"
          - "appends AuditEvent(event_type=DELETION_DENIED, subject_kind=DELETION_REQUEST, subject_id=DeletionRequest.id)"
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /deletion-requests/{id}/withdraw"
        actor: Consumer
        preconditions:
          - "DeletionRequest.status IN {RECEIVED, VERIFICATION_PENDING, VERIFICATION_FAILED, VERIFIED}"
          - "when the caller's role is Consumer, X-User-ID == DeletionRequest.consumer_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "DataBroker.request_open_count -= 1; DataBroker.request_terminated_count += 1"
          - "appends AuditEvent(event_type=DELETION_WITHDRAWN, subject_kind=DELETION_REQUEST, subject_id=DeletionRequest.id)"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "POST /deletion-requests (a newer request for the same broker_id and consumer_id) or SuppressionEntry activation"
        actor: system
        preconditions:
          - "the pre-existing DeletionRequest has status IN {RECEIVED, VERIFICATION_PENDING, VERIFICATION_FAILED}"
        side_effects:
          - "the pre-existing request transitions to SUPERSEDED"
          - "DataBroker.request_open_count -= 1; DataBroker.request_terminated_count += 1"
          - "appends AuditEvent(event_type=DELETION_REQUEST_SUPERSEDED, subject_kind=DELETION_REQUEST, subject_id=<superseded request id>)"

  - entity: Consumer
    state_field: collection_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /consumers/{id}/collections"
        actor: BrokerAdmin
        preconditions:
          - "no SuppressionEntry of this (broker_id, consumer_id) has status == ACTIVE with window_start <= current clock instant <= window_end and a source_scope covering the submitted source_label, else ERR_SUPPRESSION_ACTIVE"
          - "Consumer.sensitive_categories is empty OR Consumer.consent_status == CONSENT_GRANTED, else ERR_SENSITIVE_CONSENT_REQUIRED"
        side_effects:
          - "Consumer.collection_event_count += 1; Consumer.source_label = submitted source_label"
          - "when derived_profile_count is supplied it replaces the stored value"
          - "appends AuditEvent(event_type=CONSUMER_COLLECTION_RECORDED, subject_kind=CONSUMER, subject_id=Consumer.id)"
      - from: ACTIVE
        to: PURGE_PENDING
        trigger: "POST /deletion-requests/{id}/execute"
        actor: system
        preconditions:
          - "the executing DeletionRequest references this consumer"
        side_effects:
          - "no change to Consumer.consent_status — the two dimensions advance independently"
      - from: REACQUIRED
        to: PURGE_PENDING
        trigger: "POST /deletion-requests/{id}/execute"
        actor: system
        preconditions:
          - "the executing DeletionRequest references this consumer"
        side_effects:
          - "no change to Consumer.consent_status"
      - from: PURGE_PENDING
        to: PURGED
        trigger: "system join — owning DeletionRequest reaches COMPLETED or PARTIALLY_COMPLETED"
        actor: system
        preconditions:
          - "every PropagationTask of the owning request has status IN {ACKED, WAIVED, ABANDONED}"
        side_effects:
          - "Consumer.last_purged_at = current clock instant"
          - "a SuppressionEntry for this consumer is created ACTIVE (see the DeletionRequest join transitions)"
      - from: PURGED
        to: REACQUIRED
        trigger: "POST /consumers/{id}/collections"
        actor: BrokerAdmin
        preconditions:
          - "no SuppressionEntry of this (broker_id, consumer_id) has status == ACTIVE covering the current clock instant and the submitted source_label, else ERR_SUPPRESSION_ACTIVE"
          - "Consumer.sensitive_categories is empty OR Consumer.consent_status == CONSENT_GRANTED, else ERR_SENSITIVE_CONSENT_REQUIRED"
        side_effects:
          - "Consumer.collection_event_count += 1"
          - "appends AuditEvent(event_type=CONSUMER_COLLECTION_RECORDED, subject_kind=CONSUMER, subject_id=Consumer.id)"
        note: "Re-collection after purge is only reachable once the suppression window has been LIFTED or EXPIRED."
      - from: REACQUIRED
        to: REACQUIRED
        trigger: "POST /consumers/{id}/collections"
        actor: BrokerAdmin
        preconditions:
          - "same preconditions as the PURGED -> REACQUIRED transition"
        side_effects:
          - "Consumer.collection_event_count += 1"

  - entity: Consumer
    state_field: consent_status
    initial_state: NOT_REQUIRED
    terminal_states: []
    transitions:
      - from: NOT_REQUIRED
        to: CONSENT_PENDING
        trigger: "POST /consumers/{id}/collections at creation time, or POST /consumers/{id}/consent with action == REQUEST"
        actor: BrokerAdmin
        preconditions:
          - "Consumer.sensitive_categories is non-empty, else ERR_CONSENT_INVALID_TRANSITION"
        side_effects:
          - "no change to Consumer.collection_status"
          - "appends AuditEvent(event_type=CONSENT_CHANGED, subject_kind=CONSUMER, subject_id=Consumer.id)"
        note: "A Consumer created with a non-empty sensitive_categories array is initialised directly in CONSENT_PENDING."
      - from: CONSENT_PENDING
        to: CONSENT_GRANTED
        trigger: "POST /consumers/{id}/consent with action == GRANT"
        actor: Consumer
        preconditions:
          - "Consumer.consent_status == CONSENT_PENDING, else ERR_CONSENT_INVALID_TRANSITION"
          - "X-User-ID == Consumer.id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "no change to Consumer.collection_status"
          - "appends AuditEvent(event_type=CONSENT_CHANGED, subject_kind=CONSUMER, subject_id=Consumer.id)"
      - from: CONSENT_GRANTED
        to: CONSENT_REVOKED
        trigger: "POST /consumers/{id}/consent with action == REVOKE"
        actor: Consumer
        preconditions:
          - "Consumer.consent_status == CONSENT_GRANTED, else ERR_CONSENT_INVALID_TRANSITION"
          - "X-User-ID == Consumer.id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "further collection events are blocked by ERR_SENSITIVE_CONSENT_REQUIRED while collection_status is unaffected"
          - "appends AuditEvent(event_type=CONSENT_CHANGED, subject_kind=CONSUMER, subject_id=Consumer.id)"
      - from: CONSENT_REVOKED
        to: CONSENT_PENDING
        trigger: "POST /consumers/{id}/consent with action == REQUEST"
        actor: BrokerAdmin
        preconditions:
          - "Consumer.consent_status IN {NOT_REQUIRED, CONSENT_REVOKED}, else ERR_CONSENT_INVALID_TRANSITION"
        side_effects:
          - "appends AuditEvent(event_type=CONSENT_CHANGED, subject_kind=CONSUMER, subject_id=Consumer.id)"
        note: "Consent cycle CONSENT_PENDING -> CONSENT_GRANTED -> CONSENT_REVOKED -> CONSENT_PENDING."

  - entity: PropagationTask
    state_field: status
    initial_state: PENDING
    terminal_states: [ACKED, WAIVED, ABANDONED]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /propagation-tasks/{id}/dispatch"
        actor: PrivacyReviewer
        preconditions:
          - "PropagationTask.status IN {PENDING, FAILED}, else ERR_TASK_INVALID_STATE"
          - "the owning DeletionRequest.status == EXECUTING, else ERR_REQUEST_INVALID_STATE"
          - "when target_kind == DOWNSTREAM_RECIPIENT, the referenced DownstreamRecipient.status == ACTIVE, else ERR_RECIPIENT_NOT_ACTIVE"
        side_effects:
          - "PropagationTask.dispatched_at = current clock instant; dispatch_count += 1"
          - "appends AuditEvent(event_type=PROPAGATION_DISPATCHED, subject_kind=PROPAGATION_TASK, subject_id=PropagationTask.id)"
      - from: FAILED
        to: DISPATCHED
        trigger: "POST /propagation-tasks/{id}/dispatch"
        actor: PrivacyReviewer
        preconditions:
          - "PropagationTask.status == FAILED"
          - "the owning DeletionRequest.status == EXECUTING"
          - "when target_kind == DOWNSTREAM_RECIPIENT, the referenced DownstreamRecipient.status == ACTIVE, else ERR_RECIPIENT_NOT_ACTIVE"
        side_effects:
          - "PropagationTask.failure_code = null; dispatched_at = current clock instant; dispatch_count += 1"
        note: "Retry cycle DISPATCHED -> FAILED -> DISPATCHED."
      - from: DISPATCHED
        to: ACKED
        trigger: "POST /propagation-tasks/{id}/ack"
        actor: PrivacyReviewer
        preconditions:
          - "PropagationTask.status == DISPATCHED, else ERR_TASK_INVALID_STATE"
        side_effects:
          - "CASCADE LINK 1: PropagationTask.acknowledged_at = current clock instant; ack_was_late = (acknowledged_at > due_at); when recipient_id is not null the recipient's on_time_ack_count or late_ack_count increments and calculations.recipient_reliability_score re-runs"
          - "CASCADE LINK 2 (caused by link 1): the owning DeletionRequest's acked_task_count += 1, outstanding_task_count -= 1 and completion_ratio is recomputed; when no task remains in {PENDING, DISPATCHED, DEFERRED, FAILED} the request leaves EXECUTING for COMPLETED or PARTIALLY_COMPLETED"
          - "CASCADE LINK 3 (caused by link 2 only): Consumer.collection_status PURGE_PENDING -> PURGED and a SuppressionEntry is created ACTIVE for that consumer"
          - "CASCADE LINK 4 (caused by link 3 only): every other DeletionRequest of that consumer with status IN {RECEIVED, VERIFICATION_PENDING, VERIFICATION_FAILED} transitions to SUPERSEDED"
          - "appends AuditEvent(event_type=PROPAGATION_ACKED, subject_kind=PROPAGATION_TASK, subject_id=PropagationTask.id)"
      - from: DISPATCHED
        to: FAILED
        trigger: "POST /propagation-tasks/{id}/fail"
        actor: PrivacyReviewer
        preconditions:
          - "PropagationTask.status == DISPATCHED, else ERR_TASK_INVALID_STATE"
          - "failure_code is one of {RECIPIENT_UNREACHABLE, SCHEMA_MISMATCH, LEGAL_HOLD}"
        side_effects:
          - "PropagationTask.failure_code = supplied code"
          - "when recipient_id is not null the recipient's fail_count += 1 and calculations.recipient_reliability_score re-runs; a resulting score strictly below RECIPIENT_SUSPEND_THRESHOLD transitions that recipient ACTIVE -> SUSPENDED"
          - "the owning DeletionRequest's outstanding_task_count is unchanged because FAILED remains an outstanding status"
          - "appends AuditEvent(event_type=PROPAGATION_FAILED, subject_kind=PROPAGATION_TASK, subject_id=PropagationTask.id)"
      - from: FAILED
        to: WAIVED
        trigger: "POST /propagation-tasks/{id}/waive"
        actor: PrivacyReviewer
        preconditions:
          - "PropagationTask.status == FAILED, else ERR_TASK_INVALID_STATE"
          - "waiver_justification is 10..400 characters, else ERR_INVALID_REQUEST"
        side_effects:
          - "PropagationTask.waiver_justification = supplied text"
          - "when recipient_id is not null the recipient's waive_count += 1 and calculations.recipient_reliability_score re-runs; a resulting score strictly below RECIPIENT_SUSPEND_THRESHOLD transitions that recipient ACTIVE -> SUSPENDED"
          - "the owning DeletionRequest's waived_task_count += 1, outstanding_task_count -= 1 and completion_ratio is recomputed at WAIVER_CREDIT_FACTOR of this task's weight; the same join evaluation as the ack transition then runs"
          - "appends AuditEvent(event_type=PROPAGATION_WAIVED, subject_kind=PROPAGATION_TASK, subject_id=PropagationTask.id)"
        note: "Waiving is the compensating action for a failed propagation; it must preserve DeletionRequest.propagation_required_count."
      - from: PENDING
        to: DEFERRED
        trigger: "system cascade — owning recipient transitions ACTIVE -> SUSPENDED, or broker registry_standing becomes DELINQUENT"
        actor: system
        preconditions:
          - "PropagationTask.status IN {PENDING, DISPATCHED}"
          - "PropagationTask.recipient_id is not null"
        side_effects:
          - "PropagationTask.deferral_reason = RECIPIENT_SUSPENDED when the recipient was suspended, BROKER_DELINQUENT when the sweep parked it for the broker's standing"
          - "the owning DeletionRequest's outstanding_task_count is unchanged because DEFERRED remains an outstanding status"
          - "appends AuditEvent(event_type=PROPAGATION_DEFERRED, subject_kind=PROPAGATION_TASK, subject_id=PropagationTask.id)"
      - from: DEFERRED
        to: PENDING
        trigger: "POST /downstream-recipients/{id}/status with status == ACTIVE"
        actor: BrokerAdmin
        preconditions:
          - "PropagationTask.status == DEFERRED and its recipient returns to ACTIVE"
        side_effects:
          - "PropagationTask.deferral_reason = null"
      - from: DISPATCHED
        to: ABANDONED
        trigger: "POST /_ops/run-compliance-sweep (step 3)"
        actor: system
        preconditions:
          - "PropagationTask.status IN {PENDING, DISPATCHED, DEFERRED, FAILED}"
          - "the task's abandon_at, which calculations.temporal_default_derivation puts at due_at + TASK_ABANDON_GRACE_DAYS (30) days, is strictly before the current clock instant"
        side_effects:
          - "the owning DeletionRequest's abandoned_task_count += 1, outstanding_task_count -= 1 and completion_ratio is recomputed; ABANDONED contributes nothing to the numerator"
          - "the same join evaluation as the ack transition then runs, which may drive the request to COMPLETED or PARTIALLY_COMPLETED"
          - "appends AuditEvent(event_type=PROPAGATION_ABANDONED, subject_kind=PROPAGATION_TASK, subject_id=PropagationTask.id)"

  - entity: DownstreamRecipient
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /downstream-recipients/{id}/status with status == SUSPENDED, or system cascade from a reliability drop or a DELINQUENT broker"
        actor: BrokerAdmin
        preconditions:
          - "DownstreamRecipient.status == ACTIVE, else ERR_RECIPIENT_INVALID_STATE"
        side_effects:
          - "every PropagationTask of this recipient with status IN {PENDING, DISPATCHED} transitions to DEFERRED with deferral_reason = RECIPIENT_SUSPENDED"
          - "appends AuditEvent(event_type=RECIPIENT_STATUS_CHANGED, subject_kind=RECIPIENT, subject_id=DownstreamRecipient.id)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /downstream-recipients/{id}/status with status == ACTIVE"
        actor: BrokerAdmin
        preconditions:
          - "DownstreamRecipient.status == SUSPENDED, else ERR_RECIPIENT_INVALID_STATE"
          - "DataBroker.registry_standing != SUSPENDED, else ERR_RECIPIENT_INVALID_STATE"
        side_effects:
          - "every PropagationTask of this recipient with status == DEFERRED returns to PENDING with deferral_reason = null"
          - "appends AuditEvent(event_type=RECIPIENT_STATUS_CHANGED, subject_kind=RECIPIENT, subject_id=DownstreamRecipient.id)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /downstream-recipients/{id}/status with status == TERMINATED"
        actor: BrokerAdmin
        preconditions:
          - "DownstreamRecipient.status IN {ACTIVE, SUSPENDED}, else ERR_RECIPIENT_INVALID_STATE"
        side_effects:
          - "every PropagationTask of this recipient with status IN {PENDING, DISPATCHED, DEFERRED, FAILED} transitions to ABANDONED and each owning DeletionRequest recomputes completion_ratio and re-evaluates its join"
          - "appends AuditEvent(event_type=RECIPIENT_STATUS_CHANGED, subject_kind=RECIPIENT, subject_id=DownstreamRecipient.id)"

  - entity: SuppressionEntry
    state_field: status
    initial_state: ACTIVE
    terminal_states: [LIFTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /suppression-entries/{id}/lift"
        actor: PrivacyReviewer
        preconditions:
          - "SuppressionEntry.status == ACTIVE, else ERR_SUPPRESSION_INVALID_STATE"
          - "lift_justification is present and 20..400 characters, else ERR_LIFT_JUSTIFICATION_REQUIRED"
        side_effects:
          - "SuppressionEntry.lift_justification = supplied text"
          - "collection events for this consumer stop being blocked by this entry, which is what allows PURGED -> REACQUIRED"
          - "appends AuditEvent(event_type=SUPPRESSION_LIFTED, subject_kind=SUPPRESSION_ENTRY, subject_id=SuppressionEntry.id)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_ops/run-compliance-sweep (step 2)"
        actor: system
        preconditions:
          - "SuppressionEntry.status == ACTIVE"
          - "SuppressionEntry.window_end < current clock instant"
        side_effects:
          - "appends AuditEvent(event_type=SUPPRESSION_EXPIRED, subject_kind=SUPPRESSION_ENTRY, subject_id=SuppressionEntry.id)"

  - entity: OptOutSignal
    state_field: status
    initial_state: RECEIVED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: HONORED
        trigger: "POST /opt-out-signals for signal_type IN {GPC_BROWSER, PLATFORM_BULK} (honored inside the creating request)"
        actor: system
        preconditions:
          - "when signal_type == GPC_BROWSER, gpc_header_value == \"1\", else ERR_OPT_OUT_SIGNAL_UNRECOGNIZED"
        side_effects:
          - "OptOutSignal.honored_at = current clock instant"
          - "Consumer.opt_out_sale = true when scope IN {SALE, SALE_AND_SHARING}; Consumer.opt_out_sharing = true when scope IN {SHARING, SALE_AND_SHARING}"
          - "appends AuditEvent(event_type=OPT_OUT_RECEIVED) then AuditEvent(event_type=OPT_OUT_HONORED)"
      - from: RECEIVED
        to: HONORED
        trigger: "POST /_ops/run-compliance-sweep (step 4) for signal_type IN {WRITTEN_REQUEST, AGENT_SUBMITTED}"
        actor: system
        preconditions:
          - "OptOutSignal.status == RECEIVED"
          - "OptOutSignal.honor_deadline_at <= current clock instant"
        side_effects:
          - "OptOutSignal.honored_at = current clock instant"
          - "Consumer.opt_out_sale and Consumer.opt_out_sharing are set per scope as in the instant-honor transition"
          - "appends AuditEvent(event_type=OPT_OUT_HONORED, subject_kind=OPT_OUT_SIGNAL, subject_id=OptOutSignal.id)"
      - from: HONORED
        to: SUPERSEDED
        trigger: "POST /opt-out-signals (a newer signal for the same broker_id and consumer_id)"
        actor: system
        preconditions:
          - "the pre-existing OptOutSignal has status IN {RECEIVED, HONORED}"
        side_effects:
          - "the pre-existing signal transitions to SUPERSEDED; already-set Consumer.opt_out_sale / opt_out_sharing flags are never cleared by supersession"
          - "appends AuditEvent(event_type=OPT_OUT_RECEIVED, subject_kind=OPT_OUT_SIGNAL, subject_id=<new signal id>)"

  - entity: RegulatorInquiry
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /regulator-inquiries/{id}/respond"
        actor: BrokerAdmin
        preconditions:
          - "RegulatorInquiry.status IN {OPEN, ESCALATED}, else ERR_INQUIRY_INVALID_STATE"
          - "X-User-ID == RegulatorInquiry.broker_id, else ERR_NOT_RESOURCE_OWNER"
          - "current clock instant <= response_due_at + RESPONSE_GRACE_DAYS, else ERR_RESPONSE_WINDOW_CLOSED"
          - "every id in cited_audit_event_ids resolves to an AuditEvent, else ERR_AUDIT_EVENT_NOT_FOUND"
          - "every cited AuditEvent has broker_id == RegulatorInquiry.broker_id, else ERR_AUDIT_EVENT_FOREIGN"
        side_effects:
          - "RegulatorInquiry.cited_audit_event_ids and cited_event_count are stored from the request"
          - "calculations.regulator_response_adequacy runs, setting coverage_bonus_applied, evidence_score, deficiency_penalty, late_response_penalty, adequacy_score and adequacy_verdict"
          - "RegulatorInquiry.responded_at = current clock instant"
          - "appends AuditEvent(event_type=INQUIRY_RESPONDED, subject_kind=INQUIRY, subject_id=RegulatorInquiry.id)"
      - from: ESCALATED
        to: RESPONDED
        trigger: "POST /regulator-inquiries/{id}/respond"
        actor: BrokerAdmin
        preconditions:
          - "RegulatorInquiry.status == ESCALATED"
          - "same citation and window preconditions as the OPEN -> RESPONDED transition"
        side_effects:
          - "same effects as the OPEN -> RESPONDED transition; escalation_count is retained"
        note: "Escalation cycle RESPONDED -> ESCALATED -> RESPONDED."
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /regulator-inquiries/{id}/close"
        actor: Regulator
        preconditions:
          - "RegulatorInquiry.status == RESPONDED, else ERR_INQUIRY_INVALID_STATE"
          - "RegulatorInquiry.adequacy_verdict == ADEQUATE, else ERR_RESPONSE_INADEQUATE"
        side_effects:
          - "appends AuditEvent(event_type=INQUIRY_CLOSED, subject_kind=INQUIRY, subject_id=RegulatorInquiry.id)"
      - from: RESPONDED
        to: ESCALATED
        trigger: "POST /regulator-inquiries/{id}/escalate"
        actor: Regulator
        preconditions:
          - "RegulatorInquiry.status == RESPONDED, else ERR_INQUIRY_INVALID_STATE"
          - "deficiency_code is one of {MISSING_AUDIT_TRAIL, UNVERIFIED_IDENTITY_PRACTICE, PROPAGATION_GAP}"
        side_effects:
          - "RegulatorInquiry.deficiency_code = supplied code; escalation_count += 1"
          - "DataBroker.open_breach_count += 1 and calculations.registry_standing_derivation re-runs, so an escalation forces the broker DELINQUENT"
          - "appends AuditEvent(event_type=INQUIRY_ESCALATED, subject_kind=INQUIRY, subject_id=RegulatorInquiry.id)"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /_ops/run-compliance-sweep (step 5)"
        actor: system
        preconditions:
          - "RegulatorInquiry.status == OPEN"
          - "RegulatorInquiry.response_due_at < current clock instant"
        side_effects:
          - "RegulatorInquiry.escalation_count += 1; deficiency_code stays null for sweep-driven escalation"
          - "DataBroker.open_breach_count += 1 and calculations.registry_standing_derivation re-runs, exactly as on the manual escalate path"
          - "appends AuditEvent(event_type=INQUIRY_ESCALATED, subject_kind=INQUIRY, subject_id=RegulatorInquiry.id)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: registration-create-stale-broker
    parent_entity: DataBroker
    write_endpoint: "POST /registrations"
    occ_field: "expected_broker_version"
    description: |
      Creating a Registration against a DataBroker whose version has advanced
      since the client last observed it is rejected. A new filing for a state that
      already has a DRAFT filing legitimately supersedes that DRAFT, so the create
      cannot be resolved by a state precondition; the stale-version check is what
      tells the client its view of the broker's filings and fee balances is out of
      date.
    error_id: ERR_STALE_BROKER_VERSION
    http_status: 412
  - rule_id: deletion-request-create-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /deletion-requests"
    occ_field: "expected_consumer_version"
    description: |
      Creating a DeletionRequest against a Consumer whose version has advanced
      since the client last observed it is rejected. A newer request legitimately
      supersedes an earlier non-terminal request for the same consumer, so a
      second create would otherwise succeed on identical observed state; the
      stale-version check gives the client a deterministic signal that the
      consumer's request history moved underneath it.
    error_id: ERR_STALE_CONSUMER_VERSION
    http_status: 412
  - rule_id: opt-out-signal-create-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /opt-out-signals"
    occ_field: "expected_consumer_version"
    description: |
      Recording an OptOutSignal against a Consumer whose version has advanced
      since the client last observed it is rejected. A newer signal legitimately
      supersedes the consumer's prior signal and may widen the opted-out scope, so
      the write is valid on identical observed state; the stale-version check
      prevents a client from narrowing a scope it has not actually seen.
    error_id: ERR_STALE_CONSUMER_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# No calculation, selector, ranking, tie-break, cascade order or replay order in
# this scaffold reads an entity `id`. Where a precise fallback over common fields
# is needed the key is `created_at ASC`.
# -----------------------------------------------------------------------------
calculations:
  - name: filing_fee_assessment
    trigger: "Registration DRAFT -> SUBMITTED (PROVISIONAL_AT_SUBMIT) and Registration SUBMITTED -> ACCEPTED (FINAL_AT_ACCEPTANCE)"
    algorithm: tiered_pricing
    formula: |
      # -- per-item surcharge, computed once when the DisclosureItem is inserted --
      # DisclosureItem.surcharge_cents =
      #     round_half_up( CATEGORY_SURCHARGE_CENTS[item.category]
      #                    * (SENSITIVE_MULTIPLIER if item.covers_sensitive_categories else 1.0) )
      #
      # -- variant PROVISIONAL_AT_SUBMIT (pinned rounding order: ROUND PER CATEGORY, THEN SUM) --
      surcharge_total = sum( item.surcharge_cents
                             for item in DisclosureItem
                             where item.registration_id == Registration.id )
      provisional_filing_fee_cents = BASE_FILING_FEE_CENTS + surcharge_total
      #
      # -- variant FINAL_AT_ACCEPTANCE (pinned rounding order: AGGREGATE, PRORATE, THEN ONE ROUND) --
      coverage_days   = whole days in [coverage_period_start, coverage_period_end)
      proration_ratio = min( 1.0, coverage_days / COVERAGE_DAY_DIVISOR )
      final_filing_fee_cents =
          round_half_up( (BASE_FILING_FEE_CENTS + surcharge_total) * proration_ratio )
      #
      # The two rounding orders are deliberately different and BOTH are pinned.
      # Prorating each category separately and then summing is WRONG and yields a
      # different number of cents (e.g. 32346 instead of 32344 for a 181-day
      # coverage period over the full six-category disclosure set).
    input_set: >
      Every DisclosureItem whose registration_id equals this Registration, with no
      status filter (DisclosureItem has no lifecycle). Exactly one item may exist
      per category, so the sum is order-independent and needs no tie-break. The
      FINAL variant re-reads the disclosure set as it stands at acceptance time, so
      a disclosure added during a REJECTED -> DRAFT revision loop changes the final
      fee relative to the provisional fee frozen at the earlier submission.
    constants:
      BASE_FILING_FEE_CENTS: 40000
      CATEGORY_SURCHARGE_CENTS:
        SOURCES: 1500
        RECIPIENTS: 2500
        RETENTION: 1200
        SENSITIVE_CATEGORIES: 6000
        OPT_OUT_MECHANISM: 1800
        MINORS_DATA: 7500
      SENSITIVE_MULTIPLIER: 1.35
      COVERAGE_DAY_DIVISOR: 365
    precision: "whole cents, round_half_up; the PROVISIONAL variant rounds each category before summing, the FINAL variant rounds exactly once after proration"
    variants:
      - name: PROVISIONAL_AT_SUBMIT
        when: "the DRAFT -> SUBMITTED transition; the amount debited from DataBroker.fee_credit_cents at submission"
        difference: "no proration at all — the full-year base plus the per-category rounded surcharges, so a half-year filing is over-charged until acceptance settles it"
      - name: FINAL_AT_ACCEPTANCE
        when: "the SUBMITTED -> ACCEPTED transition; the amount that stays in DataBroker.fee_paid_cents"
        difference: "prorates the aggregate by coverage_days / 365 and rounds once at the end, so identical disclosure data yields a strictly smaller number whenever coverage_days < 365"

  - name: disclosure_completeness_score
    trigger: "insertion of a DisclosureItem via POST /registrations/{id}/disclosures; gates the DRAFT -> SUBMITTED transition"
    algorithm: weighted_scoring
    formula: |
      for each DisclosureItem of this Registration:
          item.content_length = character count of item.content
          item.weight_credit  = CATEGORY_WEIGHTS[item.category]
                                * (1.00 if item.content_length >= MIN_CONTENT_CHARS else SHORT_CONTENT_FACTOR)
      disclosure_completeness_score = round_half_up( sum(item.weight_credit), 2 )
      # Submission requires disclosure_completeness_score >= SUBMIT_COMPLETENESS_THRESHOLD.
      # The comparison is inclusive: exactly 80.00 passes, 79.99 does not.
    input_set: >
      Every DisclosureItem whose registration_id equals this Registration; at most
      one per category, so the sum is order-independent. The six category weights
      total exactly 100.00, so the score cannot exceed 100.00 and needs no clamp.
    constants:
      CATEGORY_WEIGHTS:
        SOURCES: 20.00
        RECIPIENTS: 25.00
        RETENTION: 15.00
        OPT_OUT_MECHANISM: 20.00
        SENSITIVE_CATEGORIES: 12.00
        MINORS_DATA: 8.00
      MIN_CONTENT_CHARS: 40
      SHORT_CONTENT_FACTOR: 0.50
      SUBMIT_COMPLETENESS_THRESHOLD: 80.00
      REQUIRED_DISCLOSURE_CATEGORIES: [SOURCES, RECIPIENTS, RETENTION, OPT_OUT_MECHANISM]
    precision: "2 decimal places, round_half_up"

  - name: identity_assurance_score
    trigger: "insertion of a VerificationAttempt via POST /deletion-requests/{id}/verification-attempts"
    algorithm: weighted_scoring
    formula: |
      credited_points = min( attempt.evidence_points_count, MAX_EVIDENCE_POINTS_COUNTED )
      raw_score       = METHOD_BASE[attempt.method]
                        + EVIDENCE_POINT_VALUE * credited_points
                        + DOCUMENT_QUALITY_WEIGHT * attempt.document_quality_score
      prior_fails     = DeletionRequest.failed_attempt_count as observed BEFORE this
                        attempt is scored
      fraud_penalty_applied = FRAUD_PENALTY_PER_PRIOR_FAIL * prior_fails
      #
      # -- variant selection (both conditions must hold) --
      if attempt.method == PLATFORM_ASSERTION
         and attempt.platform_assertion_reference is not null
         and DeletionRequest.intake_channel == STATE_PLATFORM:
             variant_applied  = PLATFORM_ASSERTED
             assurance_score  = round_half_up( min( MAX_SCORE,
                                    max( PLATFORM_ASSERTED_FLOOR,
                                         raw_score - fraud_penalty_applied ) ), 2 )
      else:
             variant_applied  = FRAUD_WEIGHTED
             assurance_score  = round_half_up( min( MAX_SCORE,
                                    max( 0.00, raw_score - fraud_penalty_applied ) ), 2 )
      #
      outcome = PASS          if assurance_score >= ATTEMPT_PASS_THRESHOLD
                INCONCLUSIVE  if ATTEMPT_INCONCLUSIVE_THRESHOLD <= assurance_score < ATTEMPT_PASS_THRESHOLD
                FAIL          otherwise
      #
      DeletionRequest.identity_assurance_score =
          max( a.assurance_score for a in this request's VerificationAttempts )
    input_set: >
      The single attempt being scored, plus DeletionRequest.failed_attempt_count for
      the fraud penalty. The request-level roll-up is a max over every attempt on
      the request with no status filter, so it is order-independent; ties in the max
      are irrelevant because only the value is stored.
    constants:
      METHOD_BASE:
        GOVT_ID: 55.00
        TWO_DATA_POINTS: 30.00
        PLATFORM_ASSERTION: 25.00
        AGENT_LOA: 35.00
      EVIDENCE_POINT_VALUE: 7.50
      MAX_EVIDENCE_POINTS_COUNTED: 4
      DOCUMENT_QUALITY_WEIGHT: 0.20
      FRAUD_PENALTY_PER_PRIOR_FAIL: 12.00
      PLATFORM_ASSERTED_FLOOR: 70.00
      ATTEMPT_PASS_THRESHOLD: 70.00
      ATTEMPT_INCONCLUSIVE_THRESHOLD: 50.00
      MAX_SCORE: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: FRAUD_WEIGHTED
        when: "every attempt that is not a state-platform assertion, including a PLATFORM_ASSERTION method presented on a DIRECT_PORTAL request"
        difference: "no floor is applied, so the burden of proof falls entirely on the evidence supplied and prior failures push the score toward FAIL"
      - name: PLATFORM_ASSERTED
        when: "method == PLATFORM_ASSERTION with a platform_assertion_reference on a request whose intake_channel == STATE_PLATFORM"
        difference: "the centralized state platform's assertion substitutes a PLATFORM_ASSERTED_FLOOR of 70.00, so a zero-evidence attempt scores 70.00 and PASSES where FRAUD_WEIGHTED would score 25.00 and FAIL"

  - name: propagation_plan
    trigger: "DeletionRequest VERIFIED -> EXECUTING via POST /deletion-requests/{id}/execute"
    algorithm: constraint_propagation
    formula: |
      targets = []
      targets.append( ACTIVE_DATABASE )                       # always
      if DeletionRequest.requested_scope == DELETE_ALL:
          targets.append( BACKUP_ARCHIVE )                    # backups are only rewritten for a full deletion
      if Consumer.derived_profile_count > 0:
          targets.append( DERIVED_DATASET )
      #
      # eligibility filter for downstream propagation obligations
      eligible_recipients = [ r for r in DownstreamRecipient
                              where r.broker_id == DeletionRequest.broker_id
                                and r.status == ACTIVE
                                and r.contract_propagation_required == true ]
      # ranking expression, then tie-break; NEVER the recipient id
      eligible_recipients.sort( key = (-r.reliability_score, r.created_at) )
      # empty pool is not an error: downstream_task_count becomes 0
      #
      # minting order is pinned: internal targets in the literal order
      # [ACTIVE_DATABASE, BACKUP_ARCHIVE, DERIVED_DATASET], then the ranked
      # recipients. created_at of the minted tasks follows this order.
      for kind in targets:
          task.target_kind  = kind
          task.recipient_id = null
          task.weight       = TARGET_WEIGHT[kind]
          task.sla_days     = INTERNAL_SLA_DAYS[kind]
          task.due_at       = current clock instant + task.sla_days days
      for r in eligible_recipients:
          task.target_kind  = DOWNSTREAM_RECIPIENT
          task.recipient_id = r.id
          task.weight       = TARGET_WEIGHT[DOWNSTREAM_RECIPIENT]
          task.sla_days     = r.ack_sla_days
          task.due_at       = current clock instant + r.ack_sla_days days
      #
      DeletionRequest.propagation_required_count = len(targets) + len(eligible_recipients)
      DeletionRequest.downstream_task_count      = len(eligible_recipients)
      DeletionRequest.outstanding_task_count     = propagation_required_count
    input_set: >
      Consumer.derived_profile_count and DeletionRequest.requested_scope for the
      internal target set; DownstreamRecipient rows of the same broker filtered to
      status == ACTIVE and contract_propagation_required == true for the downstream
      set. SUSPENDED and TERMINATED recipients are excluded, and recipients with
      contract_propagation_required == false are excluded regardless of status.
    constants:
      TARGET_WEIGHT:
        ACTIVE_DATABASE: 40
        BACKUP_ARCHIVE: 20
        DERIVED_DATASET: 20
        DOWNSTREAM_RECIPIENT: 20
      INTERNAL_SLA_DAYS:
        ACTIVE_DATABASE: 5
        BACKUP_ARCHIVE: 45
        DERIVED_DATASET: 15
    precision: "integer weights and whole days; due_at is an exact clock instant plus n*24h, ISO 8601 UTC with 3 fractional digits"

  - name: deletion_completion_ratio
    trigger: "every PropagationTask transition into ACKED, WAIVED or ABANDONED, and the initial fork at execution"
    algorithm: aggregation
    formula: |
      numerator   = sum( t.weight for t in tasks if t.status == ACKED )
                    + WAIVER_CREDIT_FACTOR
                      * sum( t.weight for t in tasks if t.status == WAIVED )
      denominator = sum( t.weight for t in tasks )          # every task, any status
      completion_ratio = 1.0000 if denominator == 0
                         else round_half_up( numerator / denominator, 4 )
      #
      # join evaluation, only when no task remains in {PENDING, DISPATCHED, DEFERRED, FAILED}
      if completion_ratio >= 1.0000:                DeletionRequest.status = COMPLETED
                                                     compliance_breach     = false
      elif completion_ratio >= COMPLETION_BREACH_THRESHOLD:
                                                     status = PARTIALLY_COMPLETED
                                                     compliance_breach     = false
      else:                                          status = PARTIALLY_COMPLETED
                                                     compliance_breach     = true
      # Both comparisons are inclusive at the boundary: a ratio of exactly 0.7500
      # is NOT a breach, 0.7499 is.
    input_set: >
      Every PropagationTask whose deletion_request_id equals this request, with no
      status filter in the denominator. ABANDONED tasks stay in the denominator and
      contribute nothing to the numerator, which is what makes the ratio fall.
      The sum is order-independent; no tie-break is required.
    constants:
      WAIVER_CREDIT_FACTOR: 0.50
      COMPLETION_BREACH_THRESHOLD: 0.7500
    precision: "4 decimal places, round_half_up"

  - name: recipient_reliability_score
    trigger: "PropagationTask transitions DISPATCHED -> ACKED, DISPATCHED -> FAILED and FAILED -> WAIVED on a task whose recipient_id is not null"
    algorithm: decay_function
    formula: |
      raw = RELIABILITY_START
            + ACK_ON_TIME_BONUS  * recipient.on_time_ack_count
            - ACK_LATE_PENALTY   * recipient.late_ack_count
            - FAIL_PENALTY       * recipient.fail_count
            - WAIVE_PENALTY      * recipient.waive_count
      reliability_score = round_half_up( min( RELIABILITY_CEILING,
                                              max( RELIABILITY_FLOOR, raw ) ), 2 )
      # auto-suspension is strict: exactly 70.00 stays ACTIVE, 69.99 suspends
      if reliability_score < RECIPIENT_SUSPEND_THRESHOLD and recipient.status == ACTIVE:
          recipient.status = SUSPENDED   # cascades its PENDING/DISPATCHED tasks to DEFERRED
    input_set: >
      The four lifetime counters on the DownstreamRecipient row, each covering
      every PropagationTask of that recipient across all DeletionRequests with no
      time window. A task that was FAILED and then WAIVED increments both
      fail_count and waive_count, so both penalties apply.
    constants:
      RELIABILITY_START: 90.00
      ACK_ON_TIME_BONUS: 2.00
      ACK_LATE_PENALTY: 5.00
      FAIL_PENALTY: 20.00
      WAIVE_PENALTY: 25.00
      RELIABILITY_FLOOR: 0.00
      RELIABILITY_CEILING: 100.00
      RECIPIENT_SUSPEND_THRESHOLD: 70.00
    precision: "2 decimal places, round_half_up"

  - name: registry_standing_derivation
    trigger: "every Registration status change, every compliance_breach flip, every fee settlement, and step 6 of POST /_ops/run-compliance-sweep"
    algorithm: threshold
    formula: |
      # evaluation order is pinned; the first matching clause wins
      if broker.delinquent_since is not null
         and current_clock >= broker.delinquent_since + STANDING_SUSPEND_DAYS days:
             registry_standing = SUSPENDED
      elif broker.open_breach_count > 0:
             registry_standing = DELINQUENT
      elif every code in broker.operating_state_codes has at least one Registration
           with broker_id == broker.id, state_code == code, status == ACCEPTED and
           coverage_period_start <= current_clock < coverage_period_end:
             registry_standing = COMPLIANT
      else:
             registry_standing = DELINQUENT
      #
      # bookkeeping
      on transition into DELINQUENT or SUSPENDED from COMPLIANT:
          delinquent_since = current clock instant
      on transition into COMPLIANT:
          delinquent_since = null
      # A broker is created DELINQUENT with delinquent_since = its created_at,
      # because it has no ACCEPTED filing yet.
    input_set: >
      broker.operating_state_codes, broker.open_breach_count, broker.delinquent_since
      and every Registration of the broker filtered to status == ACCEPTED with a
      half-open coverage interval containing the current clock instant. DRAFT,
      SUBMITTED, REJECTED, WITHDRAWN and EXPIRED filings are excluded.
    constants:
      STANDING_SUSPEND_DAYS: 90
    precision: "enumerated value; no rounding"

  - name: temporal_default_derivation
    trigger: "SuppressionEntry creation, AuditEvent append, OptOutSignal creation, and steps 2-4 of POST /_ops/run-compliance-sweep"
    algorithm: chronological
    formula: |
      # SuppressionEntry — closed window, both ends inclusive
      window_start = supplied window_start, else current clock instant
      window_end   = supplied window_end,   else window_start + SUPPRESSION_DEFAULT_DAYS days
      # buffered conflict zone used by validations priority 61
      conflict_zone = [ other.window_start - RECOLLECTION_BUFFER_DAYS days,
                        other.window_end   + RECOLLECTION_BUFFER_DAYS days ]
      #
      # AuditEvent — retention floor that makes a citation admissible
      retention_expires_at = created_at + AUDIT_RETENTION_DAYS days
      #
      # OptOutSignal — deferred honor deadline for non-instant channels
      honor_deadline_at = created_at + SIGNAL_HONOR_DEADLINE_DAYS days
      #
      # PropagationTask — sweep step 3 abandonment horizon
      abandon_at = due_at + TASK_ABANDON_GRACE_DAYS days
    input_set: >
      the creating request's optional window_start / window_end, the current clock
      instant, and the created_at of the AuditEvent, OptOutSignal or PropagationTask
      being derived. No entity state is filtered out; these are pure date offsets.
    constants:
      SUPPRESSION_DEFAULT_DAYS: 730
      RECOLLECTION_BUFFER_DAYS: 30
      AUDIT_RETENTION_DAYS: 2555
      SIGNAL_HONOR_DEADLINE_DAYS: 45
      TASK_ABANDON_GRACE_DAYS: 30
    precision: "whole-day offsets on ISO 8601 UTC instants; the time-of-day component of the base instant is preserved"

  - name: regulator_response_adequacy
    trigger: "RegulatorInquiry OPEN -> RESPONDED and ESCALATED -> RESPONDED via POST /regulator-inquiries/{id}/respond"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — evidence, from the citation set alone
      credited_citations     = min( cited_event_count, MAX_CITED_EVENTS_COUNTED )
      coverage_bonus_applied = every type in MANDATORY_COVERAGE_EVENT_TYPES appears
                               at least once among the cited AuditEvents' event_type
      evidence_score = round_half_up( min( 100.00,
                            EVIDENCE_POINT_PER_CITED_EVENT * credited_citations
                            + (COVERAGE_BONUS if coverage_bonus_applied else 0.00) ), 2 )
      #
      # STEP 2 — deficiency penalty, KEYED ON evidence_score (the step-1 value),
      #          evaluated exactly once. It is NOT keyed on adequacy_score and the
      #          evaluation is NOT iterated to a fixed point, even though the tier
      #          table is expressed in the same 0..100 band that adequacy_score
      #          lives in. Keying it on adequacy_score would return 40.00 instead
      #          of 52.00 for an evidence_score of 60.00.
      deficiency_penalty = 0.00   if evidence_score >= 80.00
                           8.00   if 60.00 <= evidence_score < 80.00
                           20.00  if 40.00 <= evidence_score < 60.00
                           35.00  otherwise
      #
      # STEP 3 — lateness, then the single subtraction
      late_response_penalty = LATE_RESPONSE_PENALTY
                              if current_clock > inquiry.response_due_at else 0.00
      adequacy_score = round_half_up( max( 0.00,
                            evidence_score - deficiency_penalty
                            - late_response_penalty ), 2 )
      adequacy_verdict = ADEQUATE if adequacy_score >= ADEQUATE_THRESHOLD else DEFICIENT
    input_set: >
      The AuditEvents named by cited_audit_event_ids on this response, each of
      which must exist and carry broker_id == inquiry.broker_id. Duplicated ids in
      the citation list are counted once each as supplied (cited_event_count is the
      supplied array length), and only the first MAX_CITED_EVENTS_COUNTED are
      credited, taken in the order supplied.
    constants:
      EVIDENCE_POINT_PER_CITED_EVENT: 15.00
      MAX_CITED_EVENTS_COUNTED: 5
      COVERAGE_BONUS: 15.00
      MANDATORY_COVERAGE_EVENT_TYPES: [DELETION_REQUEST_RECEIVED, DELETION_EXECUTED, SUPPRESSION_CREATED]
      LATE_RESPONSE_PENALTY: 10.00
      ADEQUATE_THRESHOLD: 65.00
      RESPONSE_GRACE_DAYS: 30
    precision: "2 decimal places, round_half_up at step 1 and step 3; the tier lookup in step 2 is exact"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; the lowest-numbered
# violated rule determines the returned error_id and HTTP status)
# Domain ordering of the business tier: safety/compliance first (a consumer's
# deletion rights and a suppression window outrank any bookkeeping concern),
# then referential integrity, then constraint satisfaction, then temporal
# conflicts, then fiscal checks last.
# -----------------------------------------------------------------------------
validations:
  # ---- 1-2 authentication -----------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names a role declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  # ---- 3-4 authorization ------------------------------------------------------
  - priority: 3
    category: auth
    check: "the supplied role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "for an entity_backed role, X-User-ID matches the owning entity of the addressed resource: BrokerAdmin's X-User-ID equals the DataBroker.id reached through the resource's broker_id, and Consumer's X-User-ID equals the Consumer.id reached through the resource's consumer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose path or payload resolves to a broker-owned or consumer-owned resource"

  # ---- 5-13 existence (path params left-to-right, then payload FKs in the
  #      order the endpoint's input list declares them) -------------------------
  - priority: 5
    category: existence
    check: "the addressed or referenced DataBroker exists"
    error_id: ERR_BROKER_NOT_FOUND
    http_status: 404
    applies_to: "GET /brokers/{id}, POST /brokers/{id}/fee-deposits, GET /brokers/{id}/audit-events, and every endpoint carrying broker_id in its payload"
  - priority: 6
    category: existence
    check: "the addressed Registration exists"
    error_id: ERR_REGISTRATION_NOT_FOUND
    http_status: 404
    applies_to: "every /registrations/{id}... endpoint"
  - priority: 7
    category: existence
    check: "the addressed or referenced Consumer exists"
    error_id: ERR_CONSUMER_NOT_FOUND
    http_status: 404
    applies_to: "every /consumers/{id}... endpoint and every payload carrying consumer_id"
  - priority: 8
    category: existence
    check: "the addressed or referenced DeletionRequest exists"
    error_id: ERR_DELETION_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "every /deletion-requests/{id}... endpoint and every payload carrying originating_request_id"
  - priority: 9
    category: existence
    check: "the addressed PropagationTask exists"
    error_id: ERR_PROPAGATION_TASK_NOT_FOUND
    http_status: 404
    applies_to: "every /propagation-tasks/{id}... endpoint"
  - priority: 10
    category: existence
    check: "the addressed or referenced DownstreamRecipient exists"
    error_id: ERR_RECIPIENT_NOT_FOUND
    http_status: 404
    applies_to: "every /downstream-recipients/{id}... endpoint"
  - priority: 11
    category: existence
    check: "the addressed SuppressionEntry exists"
    error_id: ERR_SUPPRESSION_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "every /suppression-entries/{id}... endpoint"
  - priority: 12
    category: existence
    check: "the addressed RegulatorInquiry exists"
    error_id: ERR_INQUIRY_NOT_FOUND
    http_status: 404
    applies_to: "every /regulator-inquiries/{id}... endpoint"
  - priority: 13
    category: existence
    check: "every id listed in cited_audit_event_ids resolves to an existing AuditEvent"
    error_id: ERR_AUDIT_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /regulator-inquiries/{id}/respond"

  # ---- 14 tenant integrity ----------------------------------------------------
  - priority: 14
    category: existence
    check: "every entity referenced in one request belongs to the same DataBroker: a DeletionRequest's consumer_id must resolve to a Consumer whose broker_id equals the supplied broker_id; a SuppressionEntry's consumer_id and originating_request_id must share the broker; an OptOutSignal's consumer_id must belong to the supplied broker_id"
    error_id: ERR_CROSS_BROKER_REFERENCE
    http_status: 422
    applies_to: "POST /deletion-requests, POST /suppression-entries, POST /opt-out-signals, POST /consumers/{id}/collections"

  # ---- 15 payload shape -------------------------------------------------------
  - priority: 15
    category: existence
    check: "every required input field is present, every enum value is a declared member, every *_cents amount is a non-negative integer, every score is within its declared range, and every timestamp parses as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- 16-17 optimistic concurrency ------------------------------------------
  - priority: 16
    category: state
    check: "expected_broker_version equals the addressed DataBroker's current version"
    error_id: ERR_STALE_BROKER_VERSION
    http_status: 412
    applies_to: "POST /registrations"
  - priority: 17
    category: state
    check: "expected_consumer_version equals the referenced Consumer's current version"
    error_id: ERR_STALE_CONSUMER_VERSION
    http_status: 412
    applies_to: "POST /deletion-requests, POST /opt-out-signals"

  # ---- 18-19 uniqueness -------------------------------------------------------
  - priority: 18
    category: state
    check: "identity_hash is unique within the broker across Consumers whose collection_status is not PURGED"
    error_id: ERR_IDENTITY_HASH_DUPLICATE
    http_status: 409
    applies_to: "POST /consumers"
  - priority: 19
    category: state
    check: "the registration does not already carry a DisclosureItem in the submitted category"
    error_id: ERR_DUPLICATE_DISCLOSURE_CATEGORY
    http_status: 409
    applies_to: "POST /registrations/{id}/disclosures"

  # ---- 20-26 state preconditions ---------------------------------------------
  - priority: 20
    category: state
    check: "the Registration is in a state from which the requested transition is declared: DRAFT or REJECTED for disclosure insertion, DRAFT for submit, SUBMITTED for accept and reject, and any of DRAFT, SUBMITTED or ACCEPTED for withdraw"
    error_id: ERR_REGISTRATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /registrations/{id}/disclosures, /submit, /accept, /reject, /withdraw"
  - priority: 21
    category: state
    check: "the DeletionRequest is in a state from which the requested transition is declared: RECEIVED, VERIFICATION_PENDING or VERIFICATION_FAILED for a verification attempt, VERIFICATION_PENDING for decide-verification, VERIFIED for execute, any of RECEIVED, VERIFICATION_PENDING or VERIFICATION_FAILED for deny, and any of RECEIVED, VERIFICATION_PENDING, VERIFIED or VERIFICATION_FAILED for withdraw"
    error_id: ERR_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /deletion-requests/{id}/verification-attempts, /decide-verification, /execute, /deny, /withdraw"
  - priority: 22
    category: state
    check: "the PropagationTask is in a state from which the requested transition is declared: PENDING or FAILED for dispatch, DISPATCHED for ack and fail, FAILED for waive; a DEFERRED task is not dispatchable and must first return to PENDING by its recipient being restored to ACTIVE"
    error_id: ERR_TASK_INVALID_STATE
    http_status: 409
    applies_to: "POST /propagation-tasks/{id}/dispatch, /ack, /fail, /waive"
  - priority: 23
    category: state
    check: "the SuppressionEntry is ACTIVE"
    error_id: ERR_SUPPRESSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /suppression-entries/{id}/lift"
  - priority: 24
    category: state
    check: "the RegulatorInquiry is in a state from which the requested transition is declared: OPEN or ESCALATED for respond, RESPONDED for close, RESPONDED for escalate"
    error_id: ERR_INQUIRY_INVALID_STATE
    http_status: 409
    applies_to: "POST /regulator-inquiries/{id}/respond, /close, /escalate"
  - priority: 25
    category: state
    check: "the requested consent action is declared from the Consumer's current consent_status: REQUEST from NOT_REQUIRED or CONSENT_REVOKED, GRANT from CONSENT_PENDING, REVOKE from CONSENT_GRANTED"
    error_id: ERR_CONSENT_INVALID_TRANSITION
    http_status: 409
    applies_to: "POST /consumers/{id}/consent"
  - priority: 26
    category: state
    check: "the DownstreamRecipient's requested status change is declared from its current status: ACTIVE <-> SUSPENDED both ways, and either to TERMINATED, but nothing leaves TERMINATED"
    error_id: ERR_RECIPIENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /downstream-recipients/{id}/status"

  # ---- 30-33 business_safety (consumer rights and compliance) ----------------
  - priority: 30
    category: business_safety
    check: "no ACTIVE SuppressionEntry covers this consumer for this source at the current clock instant; an entry with source_scope ALL_SOURCES blocks every re-collection, an entry with SINGLE_SOURCE blocks only a collection whose source_label matches the originating request's consumer source_label"
    error_id: ERR_SUPPRESSION_ACTIVE
    http_status: 409
    applies_to: "POST /consumers, POST /consumers/{id}/collections"
  - priority: 31
    category: business_safety
    check: "when the consumer carries a non-empty sensitive_categories list, consent_status must be CONSENT_GRANTED before any collection is recorded and before any opt-out signal narrower than SALE_AND_SHARING is honored"
    error_id: ERR_SENSITIVE_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /consumers/{id}/collections, POST /opt-out-signals"
  - priority: 32
    category: business_safety
    check: "the X-User-ID executing a deletion differs from the verification_decided_by_user_id recorded on the request, and the X-User-ID waiving a propagation task differs from the executed_by_user_id of its request"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /deletion-requests/{id}/execute, POST /propagation-tasks/{id}/waive"
  - priority: 33
    category: business_safety
    check: "the request's identity_assurance_score is at least ATTEMPT_PASS_THRESHOLD (70.00) before verification can be decided VERIFIED and before execution proceeds"
    error_id: ERR_ASSURANCE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /deletion-requests/{id}/decide-verification with decision == VERIFIED"

  # ---- 40-42 business_referential --------------------------------------------
  - priority: 40
    category: business_referential
    check: "the broker holds an ACCEPTED Registration for the consumer's state_code whose half-open coverage period contains the current clock instant"
    error_id: ERR_NO_ACCEPTED_REGISTRATION
    http_status: 409
    applies_to: "POST /deletion-requests/{id}/execute, POST /consumers/{id}/collections"
  - priority: 41
    category: business_referential
    check: "every category in REQUIRED_DISCLOSURE_CATEGORIES has a DisclosureItem on the registration"
    error_id: ERR_REQUIRED_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /registrations/{id}/submit"
  - priority: 42
    category: business_referential
    check: "every AuditEvent named in cited_audit_event_ids carries broker_id equal to the inquiry's broker_id — an inquiry may not be answered with another broker's trail"
    error_id: ERR_AUDIT_EVENT_FOREIGN
    http_status: 422
    applies_to: "POST /regulator-inquiries/{id}/respond"
  - priority: 43
    category: business_referential
    check: "no cited AuditEvent has passed its retention_expires_at at the current clock instant; audit trail retention is what makes the citation admissible"
    error_id: ERR_CITED_EVENT_EXPIRED
    http_status: 422
    applies_to: "POST /regulator-inquiries/{id}/respond"

  # ---- 50-53 business_constraint ---------------------------------------------
  - priority: 50
    category: business_constraint
    check: "disclosure_completeness_score is at least SUBMIT_COMPLETENESS_THRESHOLD (80.00); exactly 80.00 passes"
    error_id: ERR_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /registrations/{id}/submit"
  - priority: 51
    category: business_constraint
    check: "a GPC_BROWSER signal carries gpc_header_value equal to the string '1' and an AGENT_SUBMITTED signal carries a non-empty agent_reference; any other combination is an unrecognized preference signal"
    error_id: ERR_OPT_OUT_SIGNAL_UNRECOGNIZED
    http_status: 422
    applies_to: "POST /opt-out-signals"
  - priority: 52
    category: business_constraint
    check: "the DownstreamRecipient owning this propagation task is ACTIVE at dispatch time"
    error_id: ERR_RECIPIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /propagation-tasks/{id}/dispatch"
  - priority: 53
    category: business_constraint
    check: "a lift request supplies a lift_justification of at least 20 and at most 400 characters"
    error_id: ERR_LIFT_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /suppression-entries/{id}/lift"

  # ---- 60-63 business_temporal -----------------------------------------------
  - priority: 60
    category: business_temporal
    check: "the registration's half-open coverage period [start, end) does not overlap any SUBMITTED or ACCEPTED Registration of the same broker and state_code; touching endpoints (one period's end equal to the next period's start) are adjacent, not overlapping, and are allowed. A pre-existing DRAFT filing for the same broker and state_code is not an overlap conflict — it is superseded per §1.2"
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /registrations"
  - priority: 61
    category: business_temporal
    check: "the entry's closed window [window_start, window_end] plus a symmetric RECOLLECTION_BUFFER_DAYS (30) margin on both sides does not touch any ACTIVE SuppressionEntry for the same consumer; the conflict test is window_start <= other.window_end + 30d AND window_end + 30d >= other.window_start"
    error_id: ERR_SUPPRESSION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /suppression-entries"
  - priority: 62
    category: business_temporal
    check: "coverage_period_start is strictly before coverage_period_end and window_start is strictly before window_end"
    error_id: ERR_COVERAGE_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /registrations, POST /suppression-entries"
  - priority: 63
    category: business_temporal
    check: "the current clock instant is at or before response_due_at plus RESPONSE_GRACE_DAYS (30); past that the inquiry can no longer be answered and must be escalated"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /regulator-inquiries/{id}/respond"

  # ---- 70-71 business_fiscal (last) ------------------------------------------
  - priority: 70
    category: business_fiscal
    check: "the broker's fee_credit_cents is at least the provisional_filing_fee_cents assessed for this submission"
    error_id: ERR_FILING_FEE_UNPAID
    http_status: 402
    applies_to: "POST /registrations/{id}/submit"
  - priority: 71
    category: business_fiscal
    check: "amount_cents on a fee deposit is a positive integer of at most 10000000"
    error_id: ERR_FEE_DEPOSIT_INVALID
    http_status: 422
    applies_to: "POST /brokers/{id}/fee-deposits"

  # ---- 80 outcome gate -------------------------------------------------------
  - priority: 80
    category: business_constraint
    check: "an inquiry may only be CLOSED when its adequacy_verdict is ADEQUATE"
    error_id: ERR_RESPONSE_INADEQUATE
    http_status: 422
    applies_to: "POST /regulator-inquiries/{id}/close"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Flat topology, api_prefix "", every path parameter is literally `{id}`.
# Every list endpoint carries limit?/offset? and returns the paginated envelope
# described in §1.0; every FK in §1.1 is reverse-reachable through either the
# sub-resource GET or the filtered-list GET below.
# -----------------------------------------------------------------------------
endpoints:
  # ---- DataBroker -----------------------------------------------------------
  - method: POST
    path: "/brokers"
    description: "Onboard a data broker into the compliance office. The broker starts DELINQUENT with delinquent_since set to its created_at, because it holds no ACCEPTED filing yet."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, primary_contact_email, home_state_code, operating_state_codes, business_description]
    output: DataBroker
    side_effects:
      - "registry_standing initialised to DELINQUENT and delinquent_since set to the current clock instant"
      - "all counters (fee_deposited_cents, fee_paid_cents, fee_credit_cents, open_breach_count, request_intake_total, request_open_count, request_completed_count, request_terminated_count, audit_sequence_high_water) initialised to 0"
      - "appends an AuditEvent BROKER_REGISTERED"
  - method: GET
    path: "/brokers/{id}"
    description: "Read one data broker with its live standing and fee ledger."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: []
    output: DataBroker
    side_effects: []
  - method: POST
    path: "/brokers/{id}/fee-deposits"
    description: "Credit the broker's filing-fee account. The invariant fee_deposited_cents == fee_paid_cents + fee_credit_cents holds after every deposit, submission and withdrawal."
    roles: [BrokerAdmin, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: DataBroker
    side_effects:
      - "fee_deposited_cents and fee_credit_cents both increase by amount_cents"
      - "appends an AuditEvent FEE_DEPOSITED"
  - method: GET
    path: "/brokers/{id}/audit-events"
    description: "The broker's append-only audit trail in ascending sequence_no order — the evidence channel for regulator inquiries. Reverse-reachability GET for AuditEvent.broker_id."
    roles: [BrokerAdmin, Regulator, PlatformAdmin]
    code: 200
    input: ["event_type?", "subject_kind?", "subject_id?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # ---- Registration ---------------------------------------------------------
  - method: POST
    path: "/registrations"
    description: "Open a DRAFT registration filing for one state registry. OCC write endpoint against the parent DataBroker."
    roles: [BrokerAdmin]
    code: 201
    input: [broker_id, state_code, coverage_period_start, coverage_period_end, business_description, expected_broker_version, "superseded_registration_id?"]
    output: Registration
    side_effects:
      - "increments DataBroker.version by 1"
      - "coverage_days computed from the half-open interval [coverage_period_start, coverage_period_end)"
      - "disclosure_completeness_score initialised to 0.00, revision_count to 0"
      - "appends an AuditEvent REGISTRATION_CREATED"
  - method: GET
    path: "/registrations"
    description: "List registration filings. Reverse-reachability GET for Registration.broker_id and for the self-referential Registration.superseded_registration_id."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: ["broker_id?", "state_code?", "status?", "superseded_registration_id?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: GET
    path: "/registrations/{id}"
    description: "Read one registration filing with both fee variants and the completeness score."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: "/registrations/{id}/disclosures"
    description: "Attach a data-practice disclosure to a DRAFT filing. Recomputes the filing's completeness score and the item's own surcharge."
    roles: [BrokerAdmin]
    code: 201
    input: [category, content, "covers_sensitive_categories?"]
    output: DisclosureItem
    side_effects:
      - "content_length computed from content"
      - "weight_credit computed by disclosure_completeness_score, halved when content_length < 40"
      - "surcharge_cents computed by filing_fee_assessment with the sensitive multiplier"
      - "recomputes Registration.disclosure_completeness_score"
      - "appends an AuditEvent DISCLOSURE_ADDED"
  - method: GET
    path: "/registrations/{id}/disclosures"
    description: "List a filing's disclosure items. Reverse-reachability GET for DisclosureItem.registration_id."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: DisclosureItem[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/submit"
    description: "File the registration with the state registry. Assesses the PROVISIONAL_AT_SUBMIT fee variant and debits the broker's fee credit."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "status DRAFT -> SUBMITTED, submitted_at set to the current clock instant"
      - "provisional_filing_fee_cents and charged_fee_cents computed by filing_fee_assessment variant PROVISIONAL_AT_SUBMIT"
      - "DataBroker.fee_credit_cents decreases and fee_paid_cents increases by provisional_filing_fee_cents"
      - "appends an AuditEvent REGISTRATION_SUBMITTED"
  - method: POST
    path: "/registrations/{id}/accept"
    description: "Registry acceptance. Settles the FINAL_AT_ACCEPTANCE fee variant, refunds the provisional over-charge, and re-derives the broker's registry standing."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "status SUBMITTED -> ACCEPTED, accepted_at set to the current clock instant"
      - "final_filing_fee_cents computed by filing_fee_assessment variant FINAL_AT_ACCEPTANCE; charged_fee_cents set to it"
      - "the delta provisional - final moves from DataBroker.fee_paid_cents back to fee_credit_cents"
      - "re-runs registry_standing_derivation for the broker; may append STANDING_CHANGED"
      - "appends an AuditEvent REGISTRATION_ACCEPTED"
  - method: POST
    path: "/registrations/{id}/reject"
    description: "Registry rejection with a deficiency code; the filing falls back to DRAFT for revision on the next disclosure edit."
    roles: [PlatformAdmin]
    code: 200
    input: [rejection_reason_code]
    output: Registration
    side_effects:
      - "status SUBMITTED -> REJECTED, rejection_reason_code stored"
      - "the provisional fee stays consumed; charged_fee_cents is unchanged"
      - "appends an AuditEvent REGISTRATION_REJECTED"
  - method: POST
    path: "/registrations/{id}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED filing. Refunds any provisional fee and can knock the broker out of COMPLIANT standing, cascading to recipients and their tasks."
    roles: [BrokerAdmin]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "status -> WITHDRAWN"
      - "any charged_fee_cents moves from DataBroker.fee_paid_cents back to fee_credit_cents; charged_fee_cents set to 0"
      - "re-runs registry_standing_derivation; a resulting DELINQUENT standing suspends the broker's ACTIVE recipients, whose PENDING and DISPATCHED tasks become DEFERRED with deferral_reason BROKER_DELINQUENT"
      - "appends an AuditEvent REGISTRATION_WITHDRAWN"

  # ---- Consumer -------------------------------------------------------------
  - method: POST
    path: "/consumers"
    description: "Record a consumer whose personal data the broker holds. Blocked by any covering ACTIVE suppression window."
    roles: [BrokerAdmin, IntakeAgent]
    code: 201
    input: [broker_id, identity_hash, state_code, source_label, "sensitive_categories?", "derived_profile_count?"]
    output: Consumer
    side_effects:
      - "collection_status set to ACTIVE, collection_event_count set to 1"
      - "consent_status set to CONSENT_PENDING when sensitive_categories is non-empty, otherwise NOT_REQUIRED"
      - "appends an AuditEvent CONSUMER_RECORDED"
      - "a suppression hit instead appends RECOLLECTION_BLOCKED, increments the entry's blocked_recollection_count, and returns ERR_SUPPRESSION_ACTIVE"
  - method: GET
    path: "/consumers"
    description: "List consumers. Reverse-reachability GET for Consumer.broker_id."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, IntakeAgent]
    code: 200
    input: ["broker_id?", "identity_hash?", "collection_status?", "consent_status?", "limit?", "offset?"]
    output: Consumer[]
    side_effects: []
  - method: GET
    path: "/consumers/{id}"
    description: "Read one consumer record with its collection and consent dimensions and its optimistic-concurrency version."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, IntakeAgent, Consumer]
    code: 200
    input: []
    output: Consumer
    side_effects: []
  - method: POST
    path: "/consumers/{id}/consent"
    description: "Drive the consumer's sensitive-data consent dimension. action is one of REQUEST, GRANT, REVOKE — an independent state dimension from collection_status."
    roles: [BrokerAdmin, Consumer]
    code: 200
    input: [action]
    output: Consumer
    side_effects:
      - "consent_status moves NOT_REQUIRED|CONSENT_REVOKED -> CONSENT_PENDING (REQUEST), CONSENT_PENDING -> CONSENT_GRANTED (GRANT), CONSENT_GRANTED -> CONSENT_REVOKED (REVOKE)"
      - "collection_status is untouched"
      - "appends an AuditEvent CONSENT_CHANGED"
  - method: POST
    path: "/consumers/{id}/collections"
    description: "Record a further collection event against an existing consumer, e.g. a refresh from the same source. This is the re-collection surface that ongoing suppression guards."
    roles: [BrokerAdmin, IntakeAgent]
    code: 200
    input: [source_label, "derived_profile_count?"]
    output: Consumer
    side_effects:
      - "collection_event_count increments by 1"
      - "collection_status PURGED -> REACQUIRED when the consumer had been purged and no suppression covers the source"
      - "appends an AuditEvent CONSUMER_COLLECTION_RECORDED"
      - "a suppression hit instead appends RECOLLECTION_BLOCKED, increments the entry's blocked_recollection_count, and returns ERR_SUPPRESSION_ACTIVE"

  # ---- DeletionRequest ------------------------------------------------------
  - method: POST
    path: "/deletion-requests"
    description: "Intake a consumer deletion request through one of the required mechanisms, including the centralized state deletion platform. OCC write endpoint against the parent Consumer."
    roles: [IntakeAgent, StatePlatform, Consumer]
    code: 201
    input: [broker_id, consumer_id, intake_channel, expected_consumer_version, "requested_scope?", "agent_loa_reference?"]
    output: DeletionRequest
    side_effects:
      - "increments Consumer.version by 1"
      - "status set to RECEIVED, intake_user_id set to the acting X-User-ID"
      - "DataBroker.request_intake_total and request_open_count both increment by 1"
      - "any earlier non-terminal DeletionRequest for the same consumer moves to SUPERSEDED, appending DELETION_REQUEST_SUPERSEDED and decrementing request_open_count for each"
      - "appends an AuditEvent DELETION_REQUEST_RECEIVED"
  - method: GET
    path: "/deletion-requests"
    description: "List deletion requests. Reverse-reachability GET for DeletionRequest.broker_id and DeletionRequest.consumer_id."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, IntakeAgent, StatePlatform, Consumer]
    code: 200
    input: ["broker_id?", "consumer_id?", "status?", "intake_channel?", "limit?", "offset?"]
    output: DeletionRequest[]
    side_effects: []
  - method: GET
    path: "/deletion-requests/{id}"
    description: "Read one deletion request with its assurance score, propagation counters and completion ratio."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, IntakeAgent, StatePlatform, Consumer]
    code: 200
    input: []
    output: DeletionRequest
    side_effects: []
  - method: POST
    path: "/deletion-requests/{id}/verification-attempts"
    description: "Record an identity-verification attempt. Scoring balances fraud prevention against burdensome verification and selects the FRAUD_WEIGHTED or PLATFORM_ASSERTED variant."
    roles: [IntakeAgent, StatePlatform, PrivacyReviewer]
    code: 201
    input: [method, evidence_points_count, document_quality_score, "platform_assertion_reference?"]
    output: VerificationAttempt
    side_effects:
      - "variant_applied, raw_score, fraud_penalty_applied, assurance_score and outcome computed by identity_assurance_score"
      - "DeletionRequest.verification_attempt_count increments; failed_attempt_count increments when outcome is FAIL"
      - "DeletionRequest.identity_assurance_score set to the max assurance_score across the request's attempts"
      - "DeletionRequest.status RECEIVED|VERIFICATION_FAILED -> VERIFICATION_PENDING"
      - "appends an AuditEvent VERIFICATION_ATTEMPT_RECORDED"
  - method: GET
    path: "/deletion-requests/{id}/verification-attempts"
    description: "List a request's verification attempts with their variant and score breakdown. Reverse-reachability GET for VerificationAttempt.deletion_request_id."
    roles: [PrivacyReviewer, BrokerAdmin, PlatformAdmin, Regulator, IntakeAgent, StatePlatform]
    code: 200
    input: ["outcome?", "method?", "limit?", "offset?"]
    output: VerificationAttempt[]
    side_effects: []
  - method: POST
    path: "/deletion-requests/{id}/decide-verification"
    description: "Privacy reviewer's verification decision. decision is VERIFIED or FAILED; VERIFIED requires an identity_assurance_score of at least 70.00."
    roles: [PrivacyReviewer]
    code: 200
    input: [decision]
    output: DeletionRequest
    side_effects:
      - "status VERIFICATION_PENDING -> VERIFIED (decision VERIFIED) or -> VERIFICATION_FAILED (decision FAILED)"
      - "verification_decided_by_user_id set to the acting X-User-ID, which the later execute call must not match"
      - "appends an AuditEvent VERIFICATION_DECIDED"
  - method: POST
    path: "/deletion-requests/{id}/execute"
    description: "Execute the deletion. Forks the propagation plan across active databases, backups, derived data and downstream recipients with propagation obligations."
    roles: [PrivacyReviewer, BrokerAdmin]
    code: 200
    input: []
    output: DeletionRequest
    side_effects:
      - "status VERIFIED -> EXECUTING, executed_at set, executed_by_user_id set to the acting X-User-ID"
      - "mints PropagationTasks per propagation_plan and sets propagation_required_count, downstream_task_count and outstanding_task_count"
      - "completion_ratio computed by deletion_completion_ratio (0.0000 at the fork)"
      - "Consumer.collection_status ACTIVE -> PURGE_PENDING"
      - "appends an AuditEvent DELETION_EXECUTED"
  - method: POST
    path: "/deletion-requests/{id}/deny"
    description: "Deny a request from RECEIVED, VERIFICATION_PENDING or VERIFICATION_FAILED with a denial reason code drawn from IDENTITY_UNVERIFIED, EXEMPT_RECORD, DUPLICATE_REQUEST."
    roles: [PrivacyReviewer]
    code: 200
    input: [denial_reason_code]
    output: DeletionRequest
    side_effects:
      - "status RECEIVED|VERIFICATION_PENDING|VERIFICATION_FAILED -> DENIED"
      - "DataBroker.request_open_count decrements and request_terminated_count increments"
      - "appends an AuditEvent DELETION_DENIED"
  - method: POST
    path: "/deletion-requests/{id}/withdraw"
    description: "Consumer or their authorized agent withdraws the request before execution."
    roles: [Consumer, IntakeAgent, StatePlatform]
    code: 200
    input: []
    output: DeletionRequest
    side_effects:
      - "status -> WITHDRAWN"
      - "DataBroker.request_open_count decrements and request_terminated_count increments"
      - "appends an AuditEvent DELETION_WITHDRAWN"

  # ---- PropagationTask ------------------------------------------------------
  - method: GET
    path: "/propagation-tasks"
    description: "List propagation tasks. Reverse-reachability GET for PropagationTask.deletion_request_id and PropagationTask.recipient_id; the only discovery channel for tasks minted by the execute cascade."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, StatePlatform]
    code: 200
    input: ["deletion_request_id?", "recipient_id?", "status?", "target_kind?", "limit?", "offset?"]
    output: PropagationTask[]
    side_effects: []
  - method: GET
    path: "/propagation-tasks/{id}"
    description: "Read one propagation task with its weight, SLA and due_at."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, StatePlatform]
    code: 200
    input: []
    output: PropagationTask
    side_effects: []
  - method: POST
    path: "/propagation-tasks/{id}/dispatch"
    description: "Dispatch the deletion instruction to the target. A downstream task requires its recipient to be ACTIVE."
    roles: [BrokerAdmin, PrivacyReviewer]
    code: 200
    input: []
    output: PropagationTask
    side_effects:
      - "status PENDING|DEFERRED -> DISPATCHED, dispatched_at set, dispatch_count increments, deferral_reason cleared"
      - "appends an AuditEvent PROPAGATION_DISPATCHED"
  - method: POST
    path: "/propagation-tasks/{id}/ack"
    description: "Record the target's acknowledgement. Advances the request's completion ratio and can close the join into COMPLETED or PARTIALLY_COMPLETED."
    roles: [BrokerAdmin, PrivacyReviewer, StatePlatform]
    code: 200
    input: []
    output: PropagationTask
    side_effects:
      - "status DISPATCHED -> ACKED, acknowledged_at set, ack_was_late set to acknowledged_at > due_at"
      - "for a downstream task, increments the recipient's on_time_ack_count or late_ack_count and re-runs recipient_reliability_score"
      - "DeletionRequest.acked_task_count increments, outstanding_task_count decrements, completion_ratio recomputed"
      - "when no task is left in PENDING, DISPATCHED, DEFERRED or FAILED the join fires: request -> COMPLETED or PARTIALLY_COMPLETED with compliance_breach set, Consumer -> PURGED with last_purged_at, a SuppressionEntry is created, sibling non-terminal requests for the consumer become SUPERSEDED, and a breach increments DataBroker.open_breach_count and re-derives registry standing"
      - "appends an AuditEvent PROPAGATION_ACKED, plus DELETION_COMPLETED and SUPPRESSION_CREATED when the join fires"
  - method: POST
    path: "/propagation-tasks/{id}/fail"
    description: "Record a dispatch failure with a failure code. The task stays retryable until it is waived or the sweep abandons it."
    roles: [BrokerAdmin, PrivacyReviewer]
    code: 200
    input: [failure_code]
    output: PropagationTask
    side_effects:
      - "status DISPATCHED -> FAILED, failure_code stored"
      - "for a downstream task, increments the recipient's fail_count and re-runs recipient_reliability_score, which may drop the recipient below 70.00 and suspend it, deferring its other PENDING and DISPATCHED tasks"
      - "appends an AuditEvent PROPAGATION_FAILED"
  - method: POST
    path: "/propagation-tasks/{id}/waive"
    description: "Waive a failed propagation obligation with a written justification. Waived weight counts at half credit toward the completion ratio."
    roles: [BrokerAdmin]
    code: 200
    input: [waiver_justification]
    output: PropagationTask
    side_effects:
      - "status FAILED -> WAIVED, waiver_justification stored"
      - "for a downstream task, increments the recipient's waive_count and re-runs recipient_reliability_score"
      - "DeletionRequest.waived_task_count increments, outstanding_task_count decrements, completion_ratio recomputed, and the join may fire as described on /ack"
      - "appends an AuditEvent PROPAGATION_WAIVED"

  # ---- DownstreamRecipient --------------------------------------------------
  - method: POST
    path: "/downstream-recipients"
    description: "Register a downstream recipient of the broker's data, with or without a contractual deletion-propagation obligation."
    roles: [BrokerAdmin]
    code: 201
    input: [broker_id, name, contract_propagation_required, ack_sla_days]
    output: DownstreamRecipient
    side_effects:
      - "status set to ACTIVE, reliability_score set to 90.00, all four ack counters set to 0"
      - "appends an AuditEvent RECIPIENT_REGISTERED"
  - method: GET
    path: "/downstream-recipients"
    description: "List downstream recipients in reliability rank order. Reverse-reachability GET for DownstreamRecipient.broker_id."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: ["broker_id?", "status?", "contract_propagation_required?", "limit?", "offset?"]
    output: DownstreamRecipient[]
    side_effects: []
  - method: GET
    path: "/downstream-recipients/{id}"
    description: "Read one downstream recipient with its live reliability score."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: []
    output: DownstreamRecipient
    side_effects: []
  - method: POST
    path: "/downstream-recipients/{id}/status"
    description: "Manually move a recipient between ACTIVE, SUSPENDED and TERMINATED. Suspension and termination cascade into the recipient's open propagation tasks."
    roles: [BrokerAdmin, PlatformAdmin]
    code: 200
    input: [status]
    output: DownstreamRecipient
    side_effects:
      - "status changes as declared in §1.2; TERMINATED is terminal"
      - "SUSPENDED defers the recipient's PENDING and DISPATCHED tasks with deferral_reason RECIPIENT_SUSPENDED; restoring ACTIVE returns its DEFERRED tasks to PENDING with deferral_reason cleared to null"
      - "TERMINATED abandons the recipient's non-terminal tasks, incrementing each request's abandoned_task_count and recomputing its completion_ratio"
      - "appends an AuditEvent RECIPIENT_STATUS_CHANGED"

  # ---- SuppressionEntry -----------------------------------------------------
  - method: POST
    path: "/suppression-entries"
    description: "Create an ongoing suppression window that prevents re-collection of a deleted consumer's records. window_start defaults to the current clock instant and window_end to window_start plus 730 days."
    roles: [BrokerAdmin, PrivacyReviewer]
    code: 201
    input: [broker_id, consumer_id, originating_request_id, source_scope, "window_start?", "window_end?"]
    output: SuppressionEntry
    side_effects:
      - "status set to ACTIVE, blocked_recollection_count set to 0"
      - "appends an AuditEvent SUPPRESSION_CREATED"
  - method: GET
    path: "/suppression-entries"
    description: "List suppression entries. Reverse-reachability GET for SuppressionEntry.broker_id, SuppressionEntry.consumer_id and SuppressionEntry.originating_request_id; the only discovery channel for entries minted by the completion join."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, IntakeAgent]
    code: 200
    input: ["broker_id?", "consumer_id?", "originating_request_id?", "status?", "source_scope?", "limit?", "offset?"]
    output: SuppressionEntry[]
    side_effects: []
  - method: GET
    path: "/suppression-entries/{id}"
    description: "Read one suppression entry with its closed window and block counter."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, IntakeAgent]
    code: 200
    input: []
    output: SuppressionEntry
    side_effects: []
  - method: POST
    path: "/suppression-entries/{id}/lift"
    description: "Lift an active suppression window with a written justification of at least 20 characters, re-opening the consumer to collection."
    roles: [PrivacyReviewer, PlatformAdmin]
    code: 200
    input: [lift_justification]
    output: SuppressionEntry
    side_effects:
      - "status ACTIVE -> LIFTED, lift_justification stored"
      - "appends an AuditEvent SUPPRESSION_LIFTED"

  # ---- OptOutSignal ---------------------------------------------------------
  - method: POST
    path: "/opt-out-signals"
    description: "Receive an opt-out of sale or sharing, including a browser-based Global Privacy Control preference signal. OCC write endpoint against the parent Consumer."
    roles: [Consumer, StatePlatform, IntakeAgent]
    code: 201
    input: [broker_id, consumer_id, signal_type, scope, expected_consumer_version, "gpc_header_value?", "agent_reference?"]
    output: OptOutSignal
    side_effects:
      - "increments Consumer.version by 1"
      - "status set to RECEIVED and honor_deadline_at set to the current clock instant plus SIGNAL_HONOR_DEADLINE_DAYS (45) days"
      - "a GPC_BROWSER signal carrying gpc_header_value '1' and a PLATFORM_BULK signal are honored inside this request: status becomes HONORED, honored_at is set and the consumer's opt_out_sale and opt_out_sharing flags are set per scope"
      - "any earlier RECEIVED or HONORED signal for the same broker and consumer moves to SUPERSEDED"
      - "appends an AuditEvent OPT_OUT_RECEIVED"
  - method: GET
    path: "/opt-out-signals"
    description: "List opt-out signals. Reverse-reachability GET for OptOutSignal.broker_id and OptOutSignal.consumer_id."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, Consumer, StatePlatform]
    code: 200
    input: ["broker_id?", "consumer_id?", "signal_type?", "scope?", "status?", "limit?", "offset?"]
    output: OptOutSignal[]
    side_effects: []
  - method: GET
    path: "/opt-out-signals/{id}"
    description: "Read one opt-out signal with its honor deadline."
    roles: [BrokerAdmin, PlatformAdmin, Regulator, PrivacyReviewer, Consumer, StatePlatform]
    code: 200
    input: []
    output: OptOutSignal
    side_effects: []

  # ---- RegulatorInquiry -----------------------------------------------------
  - method: POST
    path: "/regulator-inquiries"
    description: "Open a regulator inquiry into the broker's request handling, with a response deadline."
    roles: [Regulator]
    code: 201
    input: [broker_id, scope_note, response_due_at]
    output: RegulatorInquiry
    side_effects:
      - "status set to OPEN, adequacy_verdict set to UNRATED, all score fields set to 0.00, escalation_count to 0"
      - "appends an AuditEvent INQUIRY_OPENED"
  - method: GET
    path: "/regulator-inquiries"
    description: "List regulator inquiries. Reverse-reachability GET for RegulatorInquiry.broker_id."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: ["broker_id?", "status?", "adequacy_verdict?", "limit?", "offset?"]
    output: RegulatorInquiry[]
    side_effects: []
  - method: GET
    path: "/regulator-inquiries/{id}"
    description: "Read one inquiry with its evidence, penalty and adequacy breakdown."
    roles: [BrokerAdmin, PlatformAdmin, Regulator]
    code: 200
    input: []
    output: RegulatorInquiry
    side_effects: []
  - method: POST
    path: "/regulator-inquiries/{id}/respond"
    description: "Answer the inquiry by citing audit-trail events as evidence. Scores the response through the three pinned steps of regulator_response_adequacy."
    roles: [BrokerAdmin]
    code: 200
    input: [cited_audit_event_ids]
    output: RegulatorInquiry
    side_effects:
      - "cited_audit_event_ids and cited_event_count stored"
      - "coverage_bonus_applied, evidence_score, deficiency_penalty, late_response_penalty, adequacy_score and adequacy_verdict computed by regulator_response_adequacy"
      - "status OPEN|ESCALATED -> RESPONDED, responded_at set"
      - "a DEFICIENT verdict sets deficiency_code and increments DataBroker.open_breach_count, re-deriving registry standing"
      - "appends an AuditEvent INQUIRY_RESPONDED"
  - method: POST
    path: "/regulator-inquiries/{id}/close"
    description: "Close a responded inquiry. Only an ADEQUATE response may be closed."
    roles: [Regulator]
    code: 200
    input: []
    output: RegulatorInquiry
    side_effects:
      - "status RESPONDED -> CLOSED"
      - "any open_breach_count contribution from this inquiry is released and registry standing re-derived"
      - "appends an AuditEvent INQUIRY_CLOSED"
  - method: POST
    path: "/regulator-inquiries/{id}/escalate"
    description: "Escalate a deficient response, re-opening the inquiry for a further response. deficiency_code is one of MISSING_AUDIT_TRAIL, UNVERIFIED_IDENTITY_PRACTICE, PROPAGATION_GAP. An inquiry that simply ran past response_due_at is escalated by the sweep, not here."
    roles: [Regulator]
    code: 200
    input: [deficiency_code]
    output: RegulatorInquiry
    side_effects:
      - "status RESPONDED -> ESCALATED, escalation_count increments, deficiency_code stored"
      - "DataBroker.open_breach_count increments and registry standing is re-derived"
      - "appends an AuditEvent INQUIRY_ESCALATED"

  # ---- test-driving surface (/_ namespace) ----------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, coverage window, suppression window and retention horizon reads. Before any call the clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "the logical clock is set; no entity is mutated and no AuditEvent is appended"
  - method: POST
    path: "/_ops/run-compliance-sweep"
    description: "Run the deferred-action sweep at the current clock instant. Steps execute in the pinned order 1..6; within each step rows are processed in created_at ASC order."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { swept_at: datetime, expired_registration_count: integer, expired_suppression_count: integer, abandoned_task_count: integer, honored_signal_count: integer, escalated_inquiry_count: integer }
    side_effects:
      - "step 1: every ACCEPTED Registration whose coverage_period_end is at or before the clock becomes EXPIRED, appending REGISTRATION_EXPIRED"
      - "step 2: every ACTIVE SuppressionEntry whose window_end is strictly before the clock becomes EXPIRED, appending SUPPRESSION_EXPIRED"
      - "step 3: every PropagationTask in PENDING, DISPATCHED, DEFERRED or FAILED whose due_at is more than 30 days before the clock becomes ABANDONED, incrementing its request's abandoned_task_count, recomputing completion_ratio, and possibly firing the join with compliance_breach"
      - "step 4: every RECEIVED OptOutSignal whose honor_deadline_at is at or before the clock becomes HONORED, setting honored_at and the consumer's opt_out_sale and opt_out_sharing per its scope, appending OPT_OUT_HONORED"
      - "step 5: every OPEN RegulatorInquiry whose response_due_at is strictly before the clock becomes ESCALATED, incrementing escalation_count and DataBroker.open_breach_count and leaving deficiency_code null, appending INQUIRY_ESCALATED"
      - "step 6: registry_standing_derivation re-runs for every broker, which is where a broker delinquent for more than 90 days becomes SUSPENDED, appending STANDING_CHANGED"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# Every code below is triggerable through at least one §1.5 endpoint.
# -----------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty on any request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is a string that is not one of the seven roles declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role addresses a resource belonging to a different DataBroker or a different Consumer than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the user executing a deletion is the same user who decided its verification, or the user waiving a task is the same user who executed the deletion"

  # existence
  - id: ERR_BROKER_NOT_FOUND
    http: 404
    condition: "the addressed or referenced DataBroker id does not exist"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "the addressed Registration id does not exist"
  - id: ERR_CONSUMER_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Consumer id does not exist"
  - id: ERR_DELETION_REQUEST_NOT_FOUND
    http: 404
    condition: "the addressed or referenced DeletionRequest id does not exist"
  - id: ERR_PROPAGATION_TASK_NOT_FOUND
    http: 404
    condition: "the addressed PropagationTask id does not exist"
  - id: ERR_RECIPIENT_NOT_FOUND
    http: 404
    condition: "the addressed DownstreamRecipient id does not exist"
  - id: ERR_SUPPRESSION_ENTRY_NOT_FOUND
    http: 404
    condition: "the addressed SuppressionEntry id does not exist"
  - id: ERR_INQUIRY_NOT_FOUND
    http: 404
    condition: "the addressed RegulatorInquiry id does not exist"
  - id: ERR_AUDIT_EVENT_NOT_FOUND
    http: 404
    condition: "an id in cited_audit_event_ids does not resolve to any AuditEvent"

  # payload and tenancy
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is not a declared member, a *_cents amount is negative or non-integral, a score is out of range, or a timestamp is unparseable"
  - id: ERR_CROSS_BROKER_REFERENCE
    http: 422
    condition: "two entities referenced by one request belong to different DataBrokers"

  # optimistic concurrency
  - id: ERR_STALE_BROKER_VERSION
    http: 412
    condition: "expected_broker_version does not equal the addressed DataBroker's current version"
  - id: ERR_STALE_CONSUMER_VERSION
    http: 412
    condition: "expected_consumer_version does not equal the referenced Consumer's current version"

  # uniqueness
  - id: ERR_IDENTITY_HASH_DUPLICATE
    http: 409
    condition: "the broker already holds a non-PURGED Consumer with this identity_hash"
  - id: ERR_DUPLICATE_DISCLOSURE_CATEGORY
    http: 409
    condition: "the registration already carries a DisclosureItem in the submitted category"

  # state
  - id: ERR_REGISTRATION_INVALID_STATE
    http: 409
    condition: "the Registration's current status has no declared transition for the requested operation"
  - id: ERR_REQUEST_INVALID_STATE
    http: 409
    condition: "the DeletionRequest's current status has no declared transition for the requested operation"
  - id: ERR_TASK_INVALID_STATE
    http: 409
    condition: "the PropagationTask's current status has no declared transition for the requested operation"
  - id: ERR_SUPPRESSION_INVALID_STATE
    http: 409
    condition: "a lift is attempted on a SuppressionEntry that is already LIFTED or EXPIRED"
  - id: ERR_INQUIRY_INVALID_STATE
    http: 409
    condition: "the RegulatorInquiry's current status has no declared transition for the requested operation"
  - id: ERR_CONSENT_INVALID_TRANSITION
    http: 409
    condition: "the requested consent action is not declared from the Consumer's current consent_status"
  - id: ERR_RECIPIENT_INVALID_STATE
    http: 409
    condition: "the requested recipient status change is not declared from its current status, including any attempt to leave TERMINATED"

  # business_safety
  - id: ERR_SUPPRESSION_ACTIVE
    http: 409
    condition: "an ACTIVE SuppressionEntry covers this consumer for this source at the current clock instant, so the record may not be re-collected"
  - id: ERR_SENSITIVE_CONSENT_REQUIRED
    http: 422
    condition: "a consumer carrying sensitive_categories has not granted consent, so collection or a partial-scope opt-out cannot proceed"
  - id: ERR_ASSURANCE_BELOW_THRESHOLD
    http: 422
    condition: "a decision == VERIFIED is attempted while the request's identity_assurance_score is below 70.00"

  # business_referential
  - id: ERR_NO_ACCEPTED_REGISTRATION
    http: 409
    condition: "the broker holds no ACCEPTED Registration covering the consumer's state at the current clock instant"
  - id: ERR_REQUIRED_DISCLOSURE_MISSING
    http: 422
    condition: "one of SOURCES, RECIPIENTS, RETENTION or OPT_OUT_MECHANISM has no DisclosureItem on the filing being submitted"
  - id: ERR_AUDIT_EVENT_FOREIGN
    http: 422
    condition: "a cited AuditEvent belongs to a different DataBroker than the inquiry"
  - id: ERR_CITED_EVENT_EXPIRED
    http: 422
    condition: "a cited AuditEvent is past its retention_expires_at at the current clock instant"

  # business_constraint
  - id: ERR_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "disclosure_completeness_score is below 80.00 at submission; exactly 80.00 is accepted"
  - id: ERR_OPT_OUT_SIGNAL_UNRECOGNIZED
    http: 422
    condition: "a GPC_BROWSER signal arrives without gpc_header_value == '1', or an AGENT_SUBMITTED signal arrives without an agent_reference"
  - id: ERR_RECIPIENT_NOT_ACTIVE
    http: 409
    condition: "a downstream propagation task is dispatched while its DownstreamRecipient is SUSPENDED or TERMINATED"
  - id: ERR_LIFT_JUSTIFICATION_REQUIRED
    http: 422
    condition: "a suppression lift supplies a lift_justification shorter than 20 characters"
  - id: ERR_RESPONSE_INADEQUATE
    http: 422
    condition: "an inquiry whose adequacy_verdict is DEFICIENT or UNRATED is closed"

  # business_temporal
  - id: ERR_COVERAGE_PERIOD_OVERLAP
    http: 409
    condition: "the new filing's half-open coverage period overlaps an existing SUBMITTED or ACCEPTED filing for the same broker and state; abutting periods do not overlap"
  - id: ERR_SUPPRESSION_WINDOW_CONFLICT
    http: 409
    condition: "the new suppression window, widened by a symmetric 30-day re-collection buffer, touches an existing ACTIVE window for the same consumer"
  - id: ERR_COVERAGE_PERIOD_INVALID
    http: 422
    condition: "a period's start is at or after its end"
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 409
    condition: "a response is attempted more than 30 days after response_due_at"

  # business_fiscal
  - id: ERR_FILING_FEE_UNPAID
    http: 402
    condition: "the broker's fee_credit_cents is below the provisional filing fee assessed for this submission"
  - id: ERR_FEE_DEPOSIT_INVALID
    http: 422
    condition: "amount_cents on a fee deposit is not a positive integer of at most 10000000"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — role model: segregation_of_duties
# The compliance office splits deletion handling across intake, review and
# execution so no single X-User-ID can both decide a verification and execute
# the deletion it authorised (ERR_SEGREGATION_OF_DUTIES).
# -----------------------------------------------------------------------------
roles:
  - name: BrokerAdmin
    description: "The registered data broker acting on its own registry filings, recipients, propagation work and inquiry responses. Sees only its own broker's resources."
    identity: "entity_backed:DataBroker"
    exclusive_operations:
      - "POST /registrations"
      - "POST /registrations/{id}/disclosures"
      - "POST /registrations/{id}/submit"
      - "POST /registrations/{id}/withdraw"
      - "POST /downstream-recipients"
      - "POST /propagation-tasks/{id}/waive"
      - "POST /regulator-inquiries/{id}/respond"
    shared_operations:
      - "GET /brokers/{id}"
      - "POST /brokers/{id}/fee-deposits"
      - "GET /brokers/{id}/audit-events"
      - "GET /registrations, GET /registrations/{id}, GET /registrations/{id}/disclosures"
      - "POST /consumers, POST /consumers/{id}/consent, POST /consumers/{id}/collections"
      - "GET /consumers, GET /consumers/{id}"
      - "GET /deletion-requests, GET /deletion-requests/{id}, GET /deletion-requests/{id}/verification-attempts"
      - "POST /deletion-requests/{id}/execute"
      - "GET /propagation-tasks, GET /propagation-tasks/{id}"
      - "POST /propagation-tasks/{id}/dispatch, /ack, /fail"
      - "GET /downstream-recipients, GET /downstream-recipients/{id}, POST /downstream-recipients/{id}/status"
      - "POST /suppression-entries, GET /suppression-entries, GET /suppression-entries/{id}"
      - "GET /opt-out-signals, GET /opt-out-signals/{id}"
      - "GET /regulator-inquiries, GET /regulator-inquiries/{id}"
  - name: Consumer
    description: "The natural person whose data the broker holds, exercising deletion and opt-out rights directly. X-User-ID is the Consumer row's id."
    identity: "entity_backed:Consumer"
    exclusive_operations: []
    shared_operations:
      - "GET /consumers/{id}"
      - "POST /consumers/{id}/consent"
      - "POST /deletion-requests"
      - "GET /deletion-requests, GET /deletion-requests/{id}"
      - "POST /deletion-requests/{id}/withdraw"
      - "POST /opt-out-signals, GET /opt-out-signals, GET /opt-out-signals/{id}"
  - name: IntakeAgent
    description: "Compliance-office intake clerk who receives requests through the required mechanisms and records verification evidence. May never decide a verification outcome or execute a deletion."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /consumers, POST /consumers/{id}/collections"
      - "GET /consumers, GET /consumers/{id}"
      - "POST /deletion-requests"
      - "GET /deletion-requests, GET /deletion-requests/{id}"
      - "POST /deletion-requests/{id}/verification-attempts"
      - "GET /deletion-requests/{id}/verification-attempts"
      - "POST /deletion-requests/{id}/withdraw"
      - "POST /opt-out-signals, GET /opt-out-signals, GET /opt-out-signals/{id}"
      - "GET /suppression-entries, GET /suppression-entries/{id}"
  - name: PrivacyReviewer
    description: "Privacy officer who adjudicates identity verification, denies unverifiable requests and manages suppression. The segregation rule forbids the same X-User-ID from deciding a verification and then executing that deletion."
    identity: opaque
    exclusive_operations:
      - "POST /deletion-requests/{id}/decide-verification"
      - "POST /deletion-requests/{id}/deny"
      - "POST /suppression-entries/{id}/lift"
    shared_operations:
      - "POST /deletion-requests/{id}/verification-attempts"
      - "GET /deletion-requests, GET /deletion-requests/{id}, GET /deletion-requests/{id}/verification-attempts"
      - "POST /deletion-requests/{id}/execute"
      - "GET /propagation-tasks, GET /propagation-tasks/{id}"
      - "POST /propagation-tasks/{id}/dispatch, /ack, /fail"
      - "POST /suppression-entries, GET /suppression-entries, GET /suppression-entries/{id}"
      - "GET /opt-out-signals, GET /opt-out-signals/{id}"
  - name: StatePlatform
    description: "The centralized state deletion platform submitting requests and platform identity assertions on consumers' behalf, and acknowledging propagation on its own channel."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /deletion-requests"
      - "GET /deletion-requests, GET /deletion-requests/{id}"
      - "POST /deletion-requests/{id}/verification-attempts"
      - "GET /deletion-requests/{id}/verification-attempts"
      - "POST /deletion-requests/{id}/withdraw"
      - "GET /propagation-tasks, GET /propagation-tasks/{id}, POST /propagation-tasks/{id}/ack"
      - "POST /opt-out-signals, GET /opt-out-signals, GET /opt-out-signals/{id}"
  - name: Regulator
    description: "State enforcement authority that opens, escalates and closes inquiries and reads any broker's audit trail. Read-only over operational data; never mutates a filing, request or task."
    identity: opaque
    exclusive_operations:
      - "POST /regulator-inquiries"
      - "POST /regulator-inquiries/{id}/close"
      - "POST /regulator-inquiries/{id}/escalate"
    shared_operations:
      - "GET /brokers/{id}, GET /brokers/{id}/audit-events"
      - "GET /registrations, GET /registrations/{id}, GET /registrations/{id}/disclosures"
      - "GET /consumers, GET /consumers/{id}"
      - "GET /deletion-requests, GET /deletion-requests/{id}, GET /deletion-requests/{id}/verification-attempts"
      - "GET /propagation-tasks, GET /propagation-tasks/{id}"
      - "GET /downstream-recipients, GET /downstream-recipients/{id}"
      - "GET /suppression-entries, GET /suppression-entries/{id}"
      - "GET /opt-out-signals, GET /opt-out-signals/{id}"
      - "GET /regulator-inquiries, GET /regulator-inquiries/{id}"
  - name: PlatformAdmin
    description: "Registry operator and system operator: onboards brokers, accepts or rejects filings, drives the logical clock and runs the deferred-action sweep."
    identity: opaque
    exclusive_operations:
      - "POST /brokers"
      - "POST /registrations/{id}/accept"
      - "POST /registrations/{id}/reject"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-compliance-sweep"
    shared_operations:
      - "GET /brokers/{id}, POST /brokers/{id}/fee-deposits, GET /brokers/{id}/audit-events"
      - "GET /registrations, GET /registrations/{id}, GET /registrations/{id}/disclosures"
      - "GET /consumers, GET /consumers/{id}"
      - "GET /deletion-requests, GET /deletion-requests/{id}, GET /deletion-requests/{id}/verification-attempts"
      - "GET /propagation-tasks, GET /propagation-tasks/{id}"
      - "GET /downstream-recipients, GET /downstream-recipients/{id}, POST /downstream-recipients/{id}/status"
      - "GET /suppression-entries, GET /suppression-entries/{id}, POST /suppression-entries/{id}/lift"
      - "GET /opt-out-signals, GET /opt-out-signals/{id}"
      - "GET /regulator-inquiries, GET /regulator-inquiries/{id}"
