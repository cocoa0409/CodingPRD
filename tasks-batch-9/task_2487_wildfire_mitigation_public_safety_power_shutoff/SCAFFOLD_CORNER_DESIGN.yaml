          rationale: "ERR_REVIEW_TRACK_ALREADY_DECIDED and ERR_FILING_INVALID_STATE are both raised along that instance's fork-join walk."

  # =========================================================================
  # §1.9 SECTION 7 — RBAC (Table 7: peer roles with segregation of duties)
  # =========================================================================
  - section: rbac
    instances:
      - name: planning_roles_perform_their_own_exclusive_operations
        claim_type: RBAC allow
        grounds:
          - rbac.roles.GridPlanner
          - rbac.roles.MeteorologyAnalyst
          - rbac.roles.RegulatoryReviewer
          - rbac.roles.AssetInspector
        distinguishing_aspect: "The planning half of the matrix is exercised end to end by its rightful owners: GridPlanner writes circuits, projects, submissions and filings, MeteorologyAnalyst writes stations, observations and indices, RegulatoryReviewer reviews, and AssetInspector — whose only exclusive operation is record-completion — books the mileage."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock_default
          trigger:
            - *k_alpha
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
