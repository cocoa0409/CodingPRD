scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_fund_returns_201_with_system_fields
        claim_type: creation
        grounds: [entities.Fund, "endpoints[POST /funds]"]
        distinguishing_aspect: "Fund creation returns 201 with all input fields echoed, status-free config entity, version == 1, server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund C1", ein: "22-1000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 5000, management_fee_rate_bps: 100, fee_discount_threshold_cents: 5000000000, fee_discount_bps: 5000 }
              as: FundTaxAdmin
              captures: { f: "$.data.id", f_v: "$.data.version" }
          trigger: []
          assert:
            - "response code 201; Fund.${f}.version == 1; created_at/updated_at present; all nine config fields echoed"

      - name: tax_year_create_computes_fee_fields
        claim_type: computed_fields
        grounds: [entities.TaxYear.fields.management_fee_cents, entities.TaxYear.fields.net_ordinary_income_cents, entities.TaxYear.fields.k1_delivery_deadline]
        excluded_because:
          difficulty_instance: management_fee_evaluation_order_boundary
          rationale: "Fee/net computed values asserted on create responses there; deadline boundary asserted in deliver_exactly_at_deadline_is_not_late."
      - name: partner_create_computes_is_foreign_and_zero_balances
        claim_type: computed_fields
        grounds: [entities.Partner.fields.is_foreign, entities.Partner.fields.capital_account_balance_cents, entities.Partner.fields.status]
        distinguishing_aspect: "FOREIGN_ENTITY partner is created with is_foreign == true, balances 0, status ACTIVE; a US partner gets is_foreign == false."
        test_recipe:
          setup: ["one fund exists"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund C2", ein: "22-1000002", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "FR", partner_type: FOREIGN_ENTITY, partner_class: LIMITED, residency_state: "XX", ownership_pct_bps: 5000, capital_commitment_cents: 100, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_fr: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "US", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 5000, capital_commitment_cents: 100, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_us: "$.data.id" }
          assert:
            - "Partner.${p_fr}.is_foreign == true; Partner.${p_us}.is_foreign == false"
            - "both partners: capital_account_balance_cents == 0, tax_basis_cents == 0, excess_distribution_gain_cents == 0, current_ownership_pct_bps == ownership_pct_bps, status == ACTIVE"

      - name: create_partner_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Partner.fields.partner_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required partner_type is rejected with ERR_INVALID_REQUEST (400) before any existence/state check."
        test_recipe:
          setup: ["one fund exists"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund C3", ein: "22-1000003", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "NoType", partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: create_partner_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Partner.fields.partner_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "partner_type outside the declared enum is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one fund exists"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund C4", ein: "22-1000004", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "BadEnum", partner_type: ALIEN, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: get_nonexistent_partner_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a random UUID partner id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /funds/partners/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: special_allocation_inverted_window_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.SpecialAllocation.fields.effective_to, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "effective_from >= effective_to violates the half-open window invariant at request validation (priority 3)."
        test_recipe:
          setup: ["fund with one partner and a 2025 tax year"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund C5", ein: "22-1000005", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
          trigger:
            - call: "POST /funds/special-allocations"
              payload: { tax_year_id: "${ty}", partner_id: "${p}", category: ORDINARY, target_pct_bps: 1000, effective_from: "2025-07-01", effective_to: "2025-07-01" }
              as: TaxPreparer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (empty half-open window rejected)"

      - name: list_partners_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /funds/partners]"]
        distinguishing_aspect: "With 12 partners and the default limit 10, page 1 returns 10 items with total_count 12 and has_more true; offset 10 returns 2 items with has_more false."
        test_recipe:
          setup: ["one fund with 12 partners"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund C6", ein: "22-1000006", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P01", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P02", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P03", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P04", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P05", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P06", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P07", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P08", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P09", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P10", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P11", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P12", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 1, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
          trigger:
            - call: "GET /funds/partners?fund_id=${f}"
              payload: {}
              as: FundTaxAdmin
            - call: "GET /funds/partners?fund_id=${f}&offset=10"
              payload: {}
              as: FundTaxAdmin
          assert:
            - "page 1: 10 items, total_count == 12, has_more == true"
            - "page 2 (offset 10): 2 items, has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: close_books_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TaxYear, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "close-books is declared only from OPEN; the second call on BOOKS_CLOSED fails with ERR_INVALID_STATE_TRANSITION and no version bump."
        test_recipe:
          setup: ["fund with one partner; TaxYear 2025 BOOKS_CLOSED"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund S1", ein: "22-2000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id", ty_v0: "$.data.version" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v1: "$.data.version" }
          trigger:
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); TaxYear.${ty}.version unchanged at ${ty_v1}"

      - name: reverse_already_reversed_event_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CapitalAccountEvent, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "REVERSED is terminal: reversing the same original twice fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["fund, partner, tax year; a POSTED CONTRIBUTION event that has been reversed once"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund S2", ein: "22-2000002", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 0, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 100000, effective_date: "2025-01-15" }
              as: TaxPreparer
              captures: { ev: "$.data.id" }
            - call: "POST /funds/capital-events/${ev}/reverse"
              payload: {}
              as: TaxPreparer
          trigger:
            - call: "POST /funds/capital-events/${ev}/reverse"
              payload: {}
              as: TaxPreparer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (second reverse of the REVERSED original)"

      - name: amendment_on_undelivered_k1_returns_k1_not_delivered
        claim_type: precondition_enforcement
        grounds: [state_machines.K1Amendment, "errors[ERR_K1_NOT_DELIVERED]"]
        distinguishing_aspect: "Guarded transition across the K1Amendment -> K1Package pair: opening an amendment requires prep_status == DELIVERED; a GENERATED package yields ERR_K1_NOT_DELIVERED."
        test_recipe:
          setup: ["canonical single-partner fund; TaxYear 2025 APPROVED; K1 generated (prep GENERATED)"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund S3", ein: "22-2000003", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/tax-years/${ty}/submit-review"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/tax-years/${ty}/approve"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/k1-generation"
              payload: { tax_year_id: "${ty}" }
              as: TaxPreparer
              captures: { k1: "$.data[0].id" }
          trigger:
            - call: "POST /funds/k1-amendments"
              payload: { k1_package_id: "${k1}", reason: PARTNER_DATA_FIX }
              as: TaxPreparer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_K1_NOT_DELIVERED (409); no amendment persisted"

      - name: ticket_reopen_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.InvestorTicket, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "reopen is declared only from ANSWERED; an OPEN ticket rejects reopen."
        test_recipe:
          setup: ["fund with partner; an OPEN ticket"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund S4", ein: "22-2000004", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tickets"
              payload: { partner_id: "${p}", category: ALLOCATION_QUESTION, subject: "Q" }
              as: InvestorServicesRep
              captures: { tk: "$.data.id" }
          trigger:
            - call: "POST /funds/tickets/${tk}/reopen"
              payload: {}
              as: InvestorServicesRep
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; ticket remains OPEN"

      - name: composite_rejected_returns_to_draft_and_refilable
        claim_type: valid_transition
        grounds: [state_machines.CompositeFiling]
        distinguishing_aspect: "Cyclic shape: DRAFT -> FILED -> DRAFT (outcome REJECTED) -> FILED -> ACCEPTED all succeed in sequence; filed_at resets to null on rejection."
        test_recipe:
          setup: ["fund with one US partner; TaxYear 2025 with LOCKED FINAL run; DRAFT composite filing NY"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund S5", ein: "22-2000005", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
              payload: {}
              as: FundTaxAdmin
              captures: { ty_v: "$.data.version" }
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: FINAL, expected_tax_year_version: "${ty_v}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/composite-filings"
              payload: { tax_year_id: "${ty}", state_code: "NY", apportionment_pct_bps: 5000, composite_rate_bps: 800, min_income_cents: 1 }
              as: TaxPreparer
              captures: { cf: "$.data.id" }
          trigger:
            - call: "POST /funds/composite-filings/${cf}/file"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/composite-filings/${cf}/record-outcome"
              payload: { outcome: REJECTED }
              as: FundTaxAdmin
            - call: "POST /funds/composite-filings/${cf}/file"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/composite-filings/${cf}/record-outcome"
              payload: { outcome: ACCEPTED }
              as: FundTaxAdmin
          assert:
            - "after REJECTED: status == DRAFT and filed_at == null (cycle FILED -> DRAFT)"
            - "re-file succeeds: status == FILED again with filed_at set"
            - "after ACCEPTED: status == ACCEPTED (terminal)"

      - name: tax_year_completes_when_last_k1_delivered
        claim_type: side_effect_execution
        grounds: [state_machines.TaxYear, state_machines.K1Package]
        distinguishing_aspect: "Compound/bubble-up: delivering the first of two K1s leaves the tax year APPROVED; delivering the last non-SUPERSEDED package auto-transitions it to COMPLETED."
        test_recipe:
