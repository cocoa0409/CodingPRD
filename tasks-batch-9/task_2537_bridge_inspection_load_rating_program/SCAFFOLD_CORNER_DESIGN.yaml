          assert:
            - "HTTP 200; FederalSubmission.${fs_id}.status == ACCEPTED, reviewed_at == 2026-09-01T00:00:00Z, reviewer_user_id == fhwa-user-1, rejection_reason_code == NONE"
            - "FederalSubmission.${fs_id}.total_bridge_count == 1, overdue_inspection_count == 0, inspection_compliance_pct == 100.00, poa_noncompliant_count == 0, open_immediate_finding_count == 0, error_count == 0"
            - "ProgramCycle.${pc_id}.status == CLOSED with closed_at == 2026-09-01T00:00:00Z"
            - "A second POST /federal-submissions/${fs_id}/review with decision REJECT returns 409 ERR_PROGRAM_STATE_INVALID and leaves status ACCEPTED"
            - "POST /federal-submissions/${fs_id}/submit returns 409 ERR_PROGRAM_STATE_INVALID - BUILDING and REJECTED are the only submittable states"
            - "POST /program-cycles/${pc_id}/reopen returns 409 ERR_PROGRAM_STATE_INVALID - reopen is declared only from LOCKED"

      - name: plan_of_action_put_repeated_same_payload_is_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.PlanOfAction.DRAFT_to_DRAFT
          - entities.PlanOfAction.fields.revision_count
        distinguishing_aspect: "The DRAFT -> DRAFT self-loop is idempotent in content: replaying the identical PUT leaves status DRAFT, the three plan fields unchanged and revision_count at 0, because only a RETURN decision increments the revision counter."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; a SCOUR_CRITICAL Cedar Creek Bridge with the cascade-created plan already moved REQUIRED -> DRAFT by one PUT."
