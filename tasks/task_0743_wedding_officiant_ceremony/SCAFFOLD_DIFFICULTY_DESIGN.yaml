  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_money_conserved_on_cancel
        grounds:
          - calculations.deposit_escrow_invariant
          - calculations.cancellation_settlement
          - entities.Booking.fields.deposit_captured_cents
        distinguishing_aspect: |
          Conserved quantity = DEPOSIT MONEY (cents). A CONFIRMED booking captures deposit 83190; a couple-initiated
          cancel at 60 days splits it into refund 41595 + forfeit 41595 with ZERO drift
          (deposit_captured_cents == refund_issued_cents + forfeit_retained_cents), and Couple.refund_credit_cents == 41595.
        test_recipe:
          setup:
            - "Officiant ACTIVE; Couple; CLASSIC package; CA venue; booking dist100 + UNITY_CANDLE CONFIRMED (deposit 83190); clock at 60 days out"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Gil Hoe", email: "gilh@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Ida", partner_two_name: "Jax", email: "ij@x.com", phone: "555-0114" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Cove Hall", jurisdiction: "CA", address: "15 Ivy St" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 100, required_style: "SECULAR", addon_codes: ["UNITY_CANDLE"] }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${bk_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { deposit_amount_cents: 83190 }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T15:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancel_reason: "COUPLE_REQUEST" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { rf: $.data.refund_issued_cents, ff: $.data.forfeit_retained_cents }
          assert:
            - "Booking.${bk_id}.deposit_captured_cents == 83190"
            - "Booking.${bk_id}.refund_issued_cents == 41595"
            - "Booking.${bk_id}.forfeit_retained_cents == 41595"
            - "Couple.${cp_id}.refund_credit_cents == 41595"

      - name: hold_slot_count_conserved_on_release
        grounds:
          - calculations.hold_slot_invariant
          - state_machines.DateHold.HELD_to_RELEASED
          - entities.Officiant.fields.active_hold_count
        distinguishing_aspect: |
          Conserved quantity = HOLD-SLOT COUNT (integer, not money). Placing a hold raises Officiant.active_hold_count
          0->1; cancelling from HOLD releases the DateHold HELD->RELEASED and returns active_hold_count 1->0 with no
          drift — a distinct conserved quantity from deposit money.
        test_recipe:
          setup:
