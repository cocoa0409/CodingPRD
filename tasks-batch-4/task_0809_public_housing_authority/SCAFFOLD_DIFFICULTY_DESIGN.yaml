  - rule_id: resource_temporal_overlap
    instances:
      - name: cert_effective_period_equal_date_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_CERT_PERIOD_OVERLAP]
          - entities.Certification.fields.effective_date
        distinguishing_aspect: >
          A second cert whose effective_date EQUALS the current EFFECTIVE cert's effective_date
          (2026-04-01) is rejected with ERR_CERT_PERIOD_OVERLAP because the interval rule is
          strictly-after (adjacency/equal not allowed); a date strictly after would pass. Point
          ordering on the Certification/Tenancy resource.
        test_recipe:
          setup:
            - "Tenancy ACTIVE with cert1 (ANNUAL) finalized EFFECTIVE at effective_date 2026-04-01; single-member household income 3,000,000, high income limit."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Overlap" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head OV", relationship: "HEAD", annual_income_cents: 3000000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-OV", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}" }
              as: HousingSpecialist
              captures: { cert1_id: $.data.id }
            - call: "POST /pha/certifications/${cert1_id}/finalize"
              payload: {}
              as: HousingSpecialist
            - call: "GET /pha/tenancies/${t_id}"
              payload: {}
              as: HousingSpecialist
              captures: { t_v2: $.data.version }
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v2}" }
              as: HousingSpecialist
              captures: { cert2_id: $.data.id }
          trigger:
            - call: "POST /pha/certifications/${cert2_id}/finalize"
              payload: {}
              as: HousingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "the finalize returns HTTP 409 with ${err} == ERR_CERT_PERIOD_OVERLAP"
            - "Certification ${cert2_id}.status remains DRAFT and Certification ${cert1_id}.status stays EFFECTIVE"

      - name: unit_make_ready_buffer_not_elapsed
        grounds:
          - validations[priority=9]
          - errors[ERR_UNIT_TURNOVER_CONFLICT]
          - entities.Unit.fields.last_lease_end_date
        distinguishing_aspect: >
          Offering a bedroom-matching unit only 9 days after its last_lease_end_date
          (2026-03-01, clock 2026-03-10) is rejected with ERR_UNIT_TURNOVER_CONFLICT because
          the offer is allowed only once clock >= last_lease_end_date + 14 days — a buffered
          interval, a different geometry than the strictly-after cert rule, on a different resource.
        test_recipe:
          setup:
            - "Bedroom-2 unit U occupied by B1 then TERMINATED via overruled eviction on 2026-03-01 (U AVAILABLE, last_lease_end_date 2026-03-01). Applicant B2 has a drawn ACTIVE bedroom-2 entry. Clock advanced to 2026-03-10."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "MR-B1" }
              as: IntakeClerk
              captures: { b1_id: $.data.id }
            - call: "POST /pha/applicants/${b1_id}/members"
              payload: { full_name: "Head MRB1", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl2a_id: $.data.id }
            - call: "POST /pha/waitlists/${wl2a_id}/entries"
              payload: { applicant_id: "${b1_id}" }
              as: IntakeClerk
              captures: { entry_b1: $.data.id }
            - call: "POST /pha/waitlists/${wl2a_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-MR", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_b1}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer1: $.data.id }
            - call: "POST /pha/offers/${offer1}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${b1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pha/tenancies/${t1_id}/grievances"
              payload: { grievance_type: "EVICTION", reason: "cause" }
              as: PropertyManager
              captures: { griev_id: $.data.id }
            - call: "POST /pha/grievances/${griev_id}/decide"
              payload: { outcome: "OVERRULED" }
              as: PropertyManager
            - call: "POST /pha/applicants"
              payload: { household_name: "MR-B2" }
              as: IntakeClerk
              captures: { b2_id: $.data.id }
            - call: "POST /pha/applicants/${b2_id}/members"
              payload: { full_name: "Head MRB2", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site B", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl2b_id: $.data.id }
            - call: "POST /pha/waitlists/${wl2b_id}/entries"
              payload: { applicant_id: "${b2_id}" }
              as: IntakeClerk
              captures: { entry_b2: $.data.id }
            - call: "POST /pha/waitlists/${wl2b_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: IntakeClerk
          trigger:
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_b2}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "the offer returns HTTP 409 with ${err} == ERR_UNIT_TURNOVER_CONFLICT"
            - "Unit ${unit_id}.status stays AVAILABLE; no Offer created for entry ${entry_b2}"

  - rule_id: compensating_invariant
    instances:
      - name: offer_refuse_conserves_unit_availability
        grounds:
          - state_machines.Unit.AVAILABLE_to_OFFERED
          - state_machines.Unit.OFFERED_to_AVAILABLE
          - state_machines.Offer.PENDING_to_REFUSED
          - entities.Unit.fields.status
        distinguishing_aspect: >
          The forward reserve (offer: Unit AVAILABLE -> OFFERED) paired with its compensating
          release (refuse: Unit OFFERED -> AVAILABLE) leaves the conserved quantity
          count(Unit where status == AVAILABLE) unchanged: Unit ${unit_id}.status == AVAILABLE
          afterward and no Tenancy exists. Conserved quantity = unit-availability count.
        test_recipe:
          setup:
            - "A drawn ACTIVE bedroom-2 entry and an AVAILABLE bedroom-2 unit."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Cons1" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head C1", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-Cons1", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/refuse"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
          assert:
            - "after refuse Unit ${unit_id}.status == AVAILABLE (reserve then release conserved availability)"
            - "WaitlistEntry ${entry_id}.status == ACTIVE and refusal_count == 1"
            - "no Tenancy exists with unit_id == ${unit_id}"

      - name: preference_verify_revoke_conserves_points
        grounds:
          - state_machines.PreferenceClaim.CLAIMED_to_VERIFIED
          - state_machines.PreferenceClaim.VERIFIED_to_CLAIMED
          - calculations.waitlist_total_points
          - entities.WaitlistEntry.fields.total_points
        distinguishing_aspect: >
          Verifying a VETERAN claim adds 50 to the entry's total_points and revoking it removes
          exactly 50, so the conserved quantity WaitlistEntry.total_points == sum of VERIFIED
          PreferenceClaim points returns to 0 with no drift. Conserved quantity = preference
          points, distinct from the unit-availability count.
        test_recipe:
          setup:
            - "Applicant with a PENDING bedroom-2 waitlist entry (total_points 0) and one CLAIMED VETERAN preference claim."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Cons2" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/preference-claims"
              payload: { preference_type: "VETERAN" }
              as: IntakeClerk
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /pha/preference-claims/${claim_id}/verify"
              payload: { decision: "VERIFY" }
              as: IntakeClerk
            - call: "POST /pha/preference-claims/${claim_id}/revoke"
              payload: {}
              as: IntakeClerk
          assert:
            - "after verify WaitlistEntry ${entry_id}.total_points == 50"
            - "after revoke WaitlistEntry ${entry_id}.total_points == 0 (conserved to base, no drift)"
            - "after revoke PreferenceClaim ${claim_id}.status == CLAIMED and points_awarded == 0"
