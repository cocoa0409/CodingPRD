          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >-
          Four undeclared edges, all ERR_INVALID_STATE: resolving a protest that
          was never routed, DISMISSING on the NEGOTIATION track (only the HEARING
          track may dismiss), re-routing an already routed protest, and calling
          close-protest-period on an UNDER_PROTEST application.
