            - call: "POST /flood-zone/map-amendment-requests/${mar_id}/submission"
              payload: {}
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { mar_count_2: $.data.resubmission_count, mar_base_2: $.data.base_review_fee_cents, mar_tier_2: $.data.fee_tier, mar_total_2: $.data.total_fee_cents }
          trigger:
            - call: "POST /flood-zone/map-amendment-requests/${mar_id}/agency-decision"
              payload: { decision: "ADDITIONAL_DATA_REQUESTED", additional_data_note: "One more thing." }
              as: AgencyOfficer
              as_user_id: "agency-1"
            - call: "POST /flood-zone/map-amendment-requests/${mar_id}/agency-decision"
              payload: { decision: "GRANTED", agency_case_number: "26-04-9002A" }
              as: AgencyOfficer
              as_user_id: "agency-1"
              captures: { mar_final: $.data.status }
          assert:
            - "the resubmission counter moves only on the ADDITIONAL_DATA_REQUESTED -> SUBMITTED_TO_AGENCY edge: mar_count_1 == 1 and mar_count_2 == 2, while the first DRAFT -> SUBMITTED_TO_AGENCY submission left it at 0"
            - "the fee tracks the counter: mar_base_2 == 25000 (0 + 12500 * 2), mar_tier_2 == TIER_2, mar_total_2 == 25000 with no expedite surcharge"
            - "the third ADDITIONAL_DATA_REQUESTED returns 409 with data.error_id == ERR_RESUBMISSION_LIMIT because resubmission_count 2 is not < MAX_RESUBMISSIONS 2"
            - "the refusal leaves MapAmendmentRequest.${mar_id}.status == SUBMITTED_TO_AGENCY with .additional_data_note still 'Photographs are illegible.' and .decided_at == null"
            - "the immediately following GRANTED decision returns 200 with status GRANTED and decided_at == 2026-08-01T00:00:00Z: the ceiling bans one decision value, not the endpoint"

      - name: corner_notice_issuance_blocked_by_unavailable_coverage
        claim_type: violation_to_error
        grounds:
          - validations.priority_12_ERR_COVERAGE_UNAVAILABLE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / notice_issuance_gated_by_community_participation_status
          rationale: "That instance drives the gate across participation statuses and the CBRS flag on an otherwise identical folio, including the COVERAGE_UNAVAILABLE posture it forces."

      - name: corner_notice_cooldown_window_upper_bound
        claim_type: violation_to_error
        grounds:
          - validations.priority_24_ERR_NOTICE_WINDOW_ACTIVE
        excluded_because:
          difficulty_instance: resource_temporal_overlap / notice_cooldown_closed_window_inclusive_upper_bound
          rationale: "The inclusive [sent_at, response_deadline_at + 5] boundary is asserted there at the last blocked instant and the first allowed instant."

      - name: corner_panel_effective_date_overlap_boundary
        claim_type: violation_to_error
        grounds:
          - validations.priority_23_ERR_PANEL_EFFECTIVE_DATE_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / panel_effectivity_half_open_interval_strict_greater_boundary
          rationale: "That instance tests the strict-greater successor boundary and the equal-date rejection for the half-open effectivity interval."

      - name: corner_priority_folio_state_before_escrow_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_11_ERR_INVALID_<ENTITY>_STATE
          - validations.priority_31_ERR_ESCROW_INSUFFICIENT
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / folio_state_precedes_escrow_fiscal_check_on_second_force_placement
          rationale: "That instance violates the state rule and the fiscal rule in one request and asserts that the state error is the one reported."

      - name: corner_priority_ownership_before_folio_state
        claim_type: priority_ordering
        grounds:
          - validations.priority_7_ERR_FOLIO_NOT_OWNED
          - validations.priority_11_ERR_INVALID_<ENTITY>_STATE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lender_ownership_precedes_folio_state_on_foreign_force_placement
          rationale: "That instance pairs the auth-category ownership rule with the state rule on a foreign folio and asserts the ownership error wins."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_monitoring_run_honours_community_scope_filter
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/flood-zone/monitoring-runs
          - calculations.monitoring_run_sweep
        distinguishing_aspect: "Two communities each hold one FLAGGED_FOR_REVIEW determination; a run scoped by community_id clears exactly one of them and leaves the other flagged, so the optional scope parameter partitions the sweep rather than merely labelling it."
        test_recipe:
          setup:
            - "community FL with panel 12086C0312K and community NC with panel 37129C0088H, each EFFECTIVE zone AE"
            - "one ROOFTOP property, structure (sfha_offset_ft -500.0), folio and ORIGINATION determination per community"
            - "a geocode correction on each property flags both determinations"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p_fl_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "PARCEL_CENTROID", geocode_confidence_score: 0.88 }
              as: ProviderAnalyst
              captures: { pr_fl_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_fl_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -500.0 }
              as: ProviderAnalyst
              captures: { st_fl_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_fl_id}", loan_number: "LN-FL-01", borrower_user_id: "borrower-fl", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_fl_id: $.data.id, f_fl_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_fl_id}", structure_id: "${st_fl_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_fl_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_fl_id: $.data.id }
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "370229", name: "New Hanover County NC", state_code: "NC", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_nc_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_nc_id}", map_panel_number: "37129C0088H", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 14.20, effective_date: "2018-04-03T00:00:00Z" }
              as: AgencyOfficer
              captures: { p_nc_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_nc_id}", street_address: "5 Masonboro Loop", city: "Wilmington", postal_code: "28409", map_panel_number: "37129C0088H", latitude: 34.1954, longitude: -77.8710, geocode_method: "PARCEL_CENTROID", geocode_confidence_score: 0.87 }
              as: ProviderAnalyst
              captures: { pr_nc_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_nc_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "PIER", replacement_cost_cents: 24000000, sfha_offset_ft: -500.0 }
              as: ProviderAnalyst
              captures: { st_nc_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_nc_id}", loan_number: "LN-NC-01", borrower_user_id: "borrower-nc", principal_balance_cents: 21000000, policy_anniversary_date: "2027-05-01T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_nc_id: $.data.id, f_nc_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_nc_id}", structure_id: "${st_nc_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_nc_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_nc_id: $.data.id }
            - call: "POST /flood-zone/properties/${pr_fl_id}/geocode-corrections"
              payload: { latitude: 25.7618, longitude: -80.1919, geocode_method: "ROOFTOP", geocode_confidence_score: 0.98 }
              as: ProviderAnalyst
            - call: "POST /flood-zone/properties/${pr_nc_id}/geocode-corrections"
              payload: { latitude: 34.1955, longitude: -77.8711, geocode_method: "ROOFTOP", geocode_confidence_score: 0.97 }
              as: ProviderAnalyst
          trigger:
            - call: "POST /flood-zone/monitoring-runs"
              payload: { community_id: "${c_fl_id}" }
              as: ProviderAnalyst
              captures: { scoped_scanned: $.data.determinations_scanned, scoped_cleared: $.data.redeterminations_cleared }
            - call: "POST /flood-zone/monitoring-runs"
              payload: {}
              as: ProviderAnalyst
              captures: { open_scanned: $.data.determinations_scanned, open_cleared: $.data.redeterminations_cleared }
          assert:
            - "both determinations are FLAGGED_FOR_REVIEW with flagged_reason GEOCODE_CORRECTION before the first run"
            - "the scoped run reports determinations_scanned == 1 and redeterminations_cleared == 1; Determination.${det_fl_id}.status == ISSUED while Determination.${det_nc_id}.status is still FLAGGED_FOR_REVIEW"
            - "LoanFolio.${f_nc_id}.pending_redetermination_count == 1 and .compliance_posture == REVIEW_PENDING after the scoped run - out-of-scope folios are not reconciled as a side effect"
            - "the unscoped second run reports determinations_scanned == 1 (only the NC row is still flagged) and redeterminations_cleared == 1, leaving both folios at pending_redetermination_count 0"
            - "notices_sent == 0 and notices_expired == 0 in both runs; phase two is global but finds no SENT notice at all"

      - name: corner_impact_analysis_refused_for_effective_panel
        claim_type: conditional_action
        grounds:
          - endpoints.GET_/flood-zone/map-panels/{map_panel_id}/impact-analysis
          - calculations.preliminary_map_impact_analysis
        distinguishing_aspect: "The projection is admissible only for a panel under study: the EFFECTIVE panel in force and a SUPERSEDED predecessor are both refused with ERR_PANEL_NOT_PRELIMINARY, while the PRELIMINARY successor answers 200."
        test_recipe:
          setup:
            - "FL community with panel seq 1 EFFECTIVE (AE/7.75) and panel seq 2 PRELIMINARY (VE/12.50, shift 0.0, effective_date 2027-04-28)"
            - "no properties are needed: the gate is checked before the projection walks any structure"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z", supersedes_panel_id: "${p1_id}", study_case_number: "26-04-1234P" }
              as: AgencyOfficer
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /flood-zone/map-panels/${p1_id}/impact-analysis"
              as: AgencyOfficer
            - call: "GET /flood-zone/map-panels/${p2_id}/impact-analysis"
              as: AgencyOfficer
              captures: { ia_status: $.data.revision_status, ia_evaluated: $.data.structures_evaluated }
          assert:
            - "the EFFECTIVE panel returns 409 with data.error_id == ERR_PANEL_NOT_PRELIMINARY"
            - "the PRELIMINARY panel returns 200 with revision_status == PRELIMINARY and structures_evaluated == 0 - an empty structure set is a valid projection, not an error"
            - "every count in the successful response is 0 and aggregate_new_required_coverage_cents == 0"
            - "after the seq 2 panel is walked to EFFECTIVE (which supersedes seq 1), the analysis on ${p1_id} still returns ERR_PANEL_NOT_PRELIMINARY because SUPERSEDED is excluded too, and ${p2_id} then returns it as well"

      - name: corner_dispute_provider_review_records_recommendation_and_opens_agency_stage
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/flood-zone/disputes/{dispute_id}/provider-review
          - state_machines.Dispute.SUBMITTED_to_JOINT_AGENCY_REVIEW
          - validations.priority_9_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The two-stage joint review is ordered and duty-segregated: the agency stage cannot be entered first, and the provider stage cannot be performed by the analyst who issued the determination."
        test_recipe:
          setup:
            - "FL chain with an ORIGINATION determination issued by X-User-ID analyst-1, and a SUBMITTED dispute filed by borrower-a on basis STRUCTURE_LOCATION"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_a_id}", loan_number: "LN-4401", borrower_user_id: "borrower-a", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_a_id: $.data.id, f_a_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_a_id: $.data.id, det_a_issuer: $.data.issued_by_user_id }
            - call: "POST /flood-zone/disputes"
              payload: { determination_id: "${det_a_id}", basis: "STRUCTURE_LOCATION", borrower_statement: "Corner markers place the dwelling outside the mapped SFHA.", asserted_sfha_offset_ft: 30.0 }
              as: Borrower
              as_user_id: "borrower-a"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/disputes/${disp_id}/agency-review"
              payload: { agency_concurrence: "CONCUR" }
              as: AgencyOfficer
              as_user_id: "agency-1"
            - call: "POST /flood-zone/disputes/${disp_id}/provider-review"
              payload: { provider_recommendation: "UPHOLD_BORROWER" }
