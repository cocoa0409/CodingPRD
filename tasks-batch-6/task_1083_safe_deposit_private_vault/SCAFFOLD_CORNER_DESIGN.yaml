        claim_type: Computed read
        grounds:
          - endpoints
          - entities.Rental.fields.status
        distinguishing_aspect: "GET /vault/rentals?status=ACTIVE returns only ACTIVE rentals as a paginated array."
        test_recipe:
          setup: ["One ACTIVE rental and one PENDING rental in the DB."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Filt", code: "FL1", viewing_room_capacity: 4 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
