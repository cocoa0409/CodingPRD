            - "re-running with window_forecast_c: 30, relative_humidity_pct: 59 yields target_setpoint_c == 27.0"

      - name: labor_hours_smart_lock_simple_tier_has_no_rework
        claim_type: Correct Result
        grounds:
          - calculations.installation_labor_hours
          - endpoints.POST_/installation-jobs/{installationJobId}/complete
        distinguishing_aspect: "A SMART_LOCK install has base 0.5 (< 1.0) so it lands in the SIMPLE tier with no rework, completing at exactly 0.5 labor hours."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B (rssi=-60), unit U, non-resident-coordinated InstallationJob J for a SMART_LOCK is IN_PROGRESS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Simple Studio", address_line: "5 Easy St", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
