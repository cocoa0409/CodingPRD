              as_user_id: "${c3_id}"
              captures: { e3_id: $.data.id }
            - call: "POST /ugc/experiences/${e1_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${c1_id}"
            - call: "POST /ugc/experiences/${e2_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${c2_id}"
            - call: "POST /ugc/experiences/${e3_id}/submit-for-review"
