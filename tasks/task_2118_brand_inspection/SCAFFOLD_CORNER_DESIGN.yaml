              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 and ${err_id} == ERR_DUPLICATE_TERRITORY_CODE"
            - "GET /brand-inspection/territories/${terr_1} still reports travel_surcharge_cents 2500 and state_code MT"

