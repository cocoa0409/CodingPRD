            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/isolations", payload: { equipment_tag: "TK-301", isolation_mode: "SHARED", isolated_from: "2026-06-10T00:00:00Z", isolated_until: "2026-06-20T00:00:00Z" }, as: PermitCoordinator, captures: { i1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/isolations", payload: { equipment_tag: "TK-301", isolation_mode: "SHARED", isolated_from: "2026-06-10T00:00:00Z", isolated_until: "2026-06-15T00:00:00Z" }, as: PermitCoordinator, captures: { i2_id: "$.data.id" } }
          trigger:
            - { call: "POST /turnarounds/${t_id}/isolations", payload: { equipment_tag: "TK-301", isolation_mode: "EXCLUSIVE", isolated_from: "2026-06-20T00:00:00Z", isolated_until: "2026-06-30T00:00:00Z" }, as: PermitCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "I1 and I2 created (201): SHARED + SHARED interior overlap admitted"
            - "I3 rejected with ERR_ISOLATION_CONFLICT (409): closed-interval touch at 2026-06-20T00:00:00Z against I1 already counts as overlap once EXCLUSIVE is involved"

  - rule_id: compensating_invariant
    instances:
      - name: report_approve_then_void_restores_money_ledger
        grounds:
          - state_machines.DailyReport.SUBMITTED_to_APPROVED
          - state_machines.DailyReport.APPROVED_to_VOIDED
          - entities.Turnaround.fields.reported_cost_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY: invariant Turnaround.reported_cost_cents ==
          sum(total_cost_cents over APPROVED reports of the turnaround). The
          approve/void compensating pair drives the ledger 0 -> 74800 -> 0 with
          no drift.
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED with one BADGED worker; DAY shift 2026-06-15T08:00Z-16:00Z; clock 2026-06-15T21:00:00Z"
            - "Report R1 (date 2026-06-15, one 8h DAY line) submitted: labor 68000, overhead 6800, total 74800"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-MNY", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Filter changeout", system_area: "CRU-2-F", work_type: "PREVENTIVE", risk_class: "C", estimated_hours: 16, estimated_cost_cents: 30000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-15", shift_type: "DAY", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T16:00:00Z", planned_headcount: 3 }, as: Planner, captures: { sd_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T21:00:00Z" }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/daily-reports", payload: { report_date: "2026-06-15", lines: [ { worker_id: "${wk_id}", shift_id: "${sd_id}", hours: 8, hazard_flag: false } ] }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /daily-reports/${r1_id}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { r_tot: "$.data.total_cost_cents" } }
          trigger:
            - { call: "POST /daily-reports/${r1_id}/approve", payload: {}, as: CostController, as_user_id: "cc-1", captures: { ap_st: "$.data.status" } }
            - { call: "GET /turnarounds/${t_id}", payload: {}, as: TurnaroundManager, captures: { rep_after_approve: "$.data.reported_cost_cents" } }
            - { call: "POST /daily-reports/${r1_id}/void", payload: {}, as: CostController, as_user_id: "cc-1", captures: { vd_st: "$.data.status" } }
            - { call: "GET /turnarounds/${t_id}", payload: {}, as: TurnaroundManager, captures: { rep_after_void: "$.data.reported_cost_cents" } }
          assert:
            - "submit produced total_cost_cents == 74800 (labor 68000 + overhead 6800)"
            - "after approve: report status APPROVED and Turnaround.reported_cost_cents == 74800"
            - "after void: report status VOIDED and Turnaround.reported_cost_cents == 0 — the compensating pair leaves the money ledger exactly unchanged"

      - name: reservation_reserve_then_release_restores_space_ledger
        grounds:
          - calculations.laydown_occupancy
          - state_machines.StagingReservation.RESERVED_to_STAGED
          - state_machines.StagingReservation.STAGED_to_RELEASED
          - concurrency_rules[laydown-reservation-stale-area]
        distinguishing_aspect: |
          Conserved quantity = PHYSICAL SPACE (different quantity than the money
          ledger): LayDownArea.occupied_sqm == sum(area_sqm over reservations in
          {RESERVED, STAGED}); reserve 120 (0 -> 120), stage (120 -> 120), release
          (120 -> 0) leaves occupancy exactly restored and never negative, while
          the area version walks 1 -> 2 -> 2 -> 3.
        test_recipe:
          setup:
            - "Turnaround SCOPE_FROZEN with contractor invited; LayDownArea A1 capacity_sqm 500, occupied 0, version 1"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-SPC", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Catalyst unload", system_area: "CRU-2-C", work_type: "CORRECTIVE", risk_class: "B", estimated_hours: 60, estimated_cost_cents: 110000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/laydown-areas", payload: { name: "North Laydown", capacity_sqm: 500 }, as: TurnaroundManager, captures: { a_id: "$.data.id", a_v1: "$.data.version" } }
          trigger:
            - { call: "POST /laydown-areas/${a_id}/reservations", payload: { material_description: "Fresh catalyst drums", area_sqm: 120, window_from: "2026-06-10T00:00:00Z", window_until: "2026-06-20T00:00:00Z", expected_laydown_area_version: "${a_v1}" }, as: Planner, captures: { r1_id: "$.data.id" } }
            - { call: "GET /laydown-areas/${a_id}", payload: {}, as: Planner, captures: { occ1: "$.data.occupied_sqm", av2: "$.data.version" } }
            - { call: "POST /reservations/${r1_id}/stage", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { st1: "$.data.status" } }
            - { call: "GET /laydown-areas/${a_id}", payload: {}, as: Planner, captures: { occ2: "$.data.occupied_sqm", av3: "$.data.version" } }
            - { call: "POST /reservations/${r1_id}/release", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { st2: "$.data.status" } }
            - { call: "GET /laydown-areas/${a_id}", payload: {}, as: Planner, captures: { occ3: "$.data.occupied_sqm", av4: "$.data.version" } }
          assert:
            - "after reserve: occupied_sqm == 120, area version == 2"
            - "after stage: reservation STAGED and occupied_sqm == 120 (staging does not change occupancy), area version still == 2"
            - "after release: reservation RELEASED and occupied_sqm == 0, area version == 3"
            - "invariant held at every step: occupied_sqm == sum(area_sqm over {RESERVED, STAGED})"
