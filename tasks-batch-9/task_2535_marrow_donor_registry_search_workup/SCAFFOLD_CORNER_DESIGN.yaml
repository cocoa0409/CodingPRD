          trigger:
            - call: "PATCH /registry/registries/${reg_dom_id}"
              payload: { ct_response_deadline_hours: 240 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_v2: "$.data.version", reg_hours_2: "$.data.ct_response_deadline_hours", reg_tier_2: "$.data.cooperation_tier" }
            - call: "GET /registry/registries/${reg_dom_id}"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_code: "$.data.code", reg_name: "$.data.name", reg_currency: "$.data.currency_code", reg_fx: "$.data.fx_rate_to_usd", reg_domestic: "$.data.is_domestic", reg_coop: "$.data.cooperation_status", reg_donors: "$.data.donor_count" }
            - call: "POST /registry/match-candidates/${mc_d5}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct_after: "$.data.id", ct_after_deadline: "$.data.deadline_at" }
            - call: "GET /registry/match-candidates/${mc_d1}/typing-requests"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ct_before_deadline_again: "$.data[0].deadline_at" }
            - call: "PATCH /registry/registries/${reg_dom_id}"
