              payload: {}
              as: Provost
              as_user_id: "provost-second"
            - call: "GET /provost/review-cycles/${cycle_id}"
              payload: {}
              as: Provost
              as_user_id: "provost-second"
          assert:
            - "${e_stale} == ERR_STALE_CYCLE_VERSION with HTTP 412 — ${v_before} was current before the first proposal, and proposing moved the cycle RESPONSE_SUBMITTED -> DECISION_PROPOSED and bumped its version"
            - "${v_after} is exactly ${v_before} + 1, and the refused proposal did not bump it further"
            - "immediately after the refusal the decision list for the cycle returns total_count == 1: only the first DISCONTINUATION decision exists, still in state PROPOSED — a rejected supersede does not withdraw the incumbent"
            - "the retry with ${v_after} returns 201 with outcome IMPROVEMENT_PLAN, state PROPOSED, improvement_state NOT_APPLICABLE (it becomes ACTIVE only at effectuation), improvement_target_score 55.00 and proposed_by_user_id provost-second"
            - "the first decision now reads state WITHDRAWN — the accepted second proposal superseded it through the system-actor edge, not through any call the provost made"
            - "the final cycle read shows state DECISION_PROPOSED (unchanged by a second proposal from the same state) with version ${v_after} + 1"

      - name: one_accepted_write_bumps_the_version_once_and_a_refusal_never_does
        claim_type: optimistic_concurrency
        grounds:
          - entities.AcademicProgram.version
          - endpoints[POST /provost/academic-programs/{id}/review-cycles]
          - endpoints[POST /provost/academic-programs/{id}/metric-snapshots]
          - endpoints[POST /provost/academic-programs/{id}/faculty-appointments]
          - endpoints[POST /provost/academic-programs/{id}/catalog-status]
        distinguishing_aspect: |
          The version is a per-request counter, not a per-effect counter: the
          cycle create both inserts a child and moves the program's lifecycle
          axis ACTIVE -> UNDER_REVIEW, yet the program's version rises by exactly
          one. Writes on children bump the child and the program it re-derives,
          and every refused write — 403, 404 or 422 alike — leaves the counter
          exactly where the last accepted write left it, so a client can safely
          reuse the version it already holds after a failure.
        test_recipe:
          setup:
            - "One freshly registered program; the recipe then issues four accepted writes and three refused ones, reading the version after each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id, v_create: $.data.version }
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { v_after_snapshot: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FB", term_index: 1, enrollment_headcount: 31, credit_hours: 310, direct_cost_cents: 12100000, completions_count: 4, market_demand_index: 43 }
              as: ReviewCoordinator
              captures: { e_dup: $.data.error_id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { v_after_dup: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { v_after_cycle: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-1", tenure_status: "ADJUNCT", fte: 0.25, annual_salary_cents: 4000000 }
              as: HRPartner
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: HRPartner
              captures: { v_after_appt: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/faculty-appointments"
              payload: { faculty_number: "F-ADJ-2", tenure_status: "ADJUNCT", fte: 1.50, annual_salary_cents: 4000000 }
              as: HRPartner
              captures: { e_bad_fte: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "CATALOG_WITHDRAWN", suppression_note: "Skipping two steps." }
              as: Registrar
              captures: { e_catalog: $.data.error_id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: Registrar
              captures: { v_after_refusals: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/catalog-status"
              payload: { target_catalog_status: "MARKETING_SUPPRESSED", suppression_note: "One legal step." }
              as: Registrar
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: Registrar
              captures: { v_final: $.data.version }
          assert:
            - "${v_after_snapshot} == ${v_create} + 1 — a child insert that re-derives the parent's computed fields bumps the parent once"
            - "${e_dup} == ERR_DUPLICATE_TERM_SNAPSHOT with HTTP 409 and ${v_after_dup} == ${v_after_snapshot} — a refused child insert bumps nothing"
            - "${v_after_cycle} == ${v_after_snapshot} + 1 even though that single request ALSO moved lifecycle_state ACTIVE -> UNDER_REVIEW: one accepted request is one version increment, never two"
            - "${v_after_appt} == ${v_after_cycle} + 1"
            - "${e_bad_fte} == ERR_VALIDATION with HTTP 422 — fte 1.50 is outside (0, 1]"
            - "${e_catalog} == ERR_CATALOG_TRANSITION_INVALID with HTTP 409 — LISTED -> CATALOG_WITHDRAWN is not a declared catalog edge"
            - "${v_after_refusals} == ${v_after_appt} — two refusals in a row, a 422 on a child insert and a 409 on the program itself, left the counter untouched"
            - "${v_final} == ${v_after_refusals} + 1 with catalog_status MARKETING_SUPPRESSED and lifecycle_state still UNDER_REVIEW — the two axes move independently"
            - "the program's updated_at advances only on the accepted writes, and snapshot_count is 1, faculty_fte_baseline 0.25 throughout the refusals"

