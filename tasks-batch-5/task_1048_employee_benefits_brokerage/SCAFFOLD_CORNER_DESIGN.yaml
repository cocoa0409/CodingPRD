        distinguishing_aspect: "Two sequential POST /renewals both carry expected_policy_version=${pv} (the version after activate); the first succeeds and bumps Policy.version, so the second is stale -> ERR_STALE_POLICY_VERSION (412)."
        test_recipe:
          setup: ["Empty DB; ACTIVE policy; captured post-activate version ${pv}. First renewal create supersedes and advances Policy.version."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "OCC Co", ein: "200000024", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${cid}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp: "$.data.id" } }
            - { call: "POST /campaigns/${camp}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${cid}", quote_id: "${q}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol: "$.data.id" } }
            - { call: "POST /policies/${pol}/activate", payload: {}, as: BenefitsConsultant, captures: { pv: "$.data.version" } }
            - { call: "POST /renewals", payload: { policy_id: "${pol}", expected_policy_version: "${pv}", initial_offer_premium_cents: 900000 }, as: BenefitsConsultant, captures: { ren1: "$.data.id" } }
          trigger:
            - { call: "POST /renewals", payload: { policy_id: "${pol}", expected_policy_version: "${pv}", initial_offer_premium_cents: 880000 }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_POLICY_VERSION"

      - name: stop_loss_wellness_credit_computed
        claim_type: rate_threshold_triggers
        grounds: [calculations.stop_loss_recovery, entities.StopLossPolicy.fields.wellness_credit_cents, entities.StopLossPolicy.fields.total_recovery_cents]
        distinguishing_aspect: "Below the attachment point (claim 1000000, attachment 5000000) reimbursed_cents=0 but wellness_credit_cents=round(0.05*1000000)=50000 and total_recovery_cents=50000."
        test_recipe:
          setup: ["Empty DB; a StopLossPolicy attachment 5000000, wellness 0.05; one claim of 1000000."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Wellness Co", ein: "200000025", industry: "MANUFACTURING", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /stop-loss-policies", payload: { client_id: "${cid}", attachment_point_cents: 5000000, aggregate_limit_cents: 50000000, wellness_credit_pct: 0.05 }, as: BenefitsConsultant, captures: { sl: "$.data.id" } }
          trigger:
            - { call: "POST /stop-loss-policies/${sl}/record-claim", payload: { claim_amount_cents: 1000000 }, as: BenefitsConsultant }
          assert:
            - "StopLossPolicy.${sl}.reimbursed_cents == 0"
            - "StopLossPolicy.${sl}.wellness_credit_cents == 50000"
            - "StopLossPolicy.${sl}.total_recovery_cents == 50000"

      - name: census_terminate_recomputes_client_counts
        claim_type: derived_field_reconciliation
        grounds: [calculations.fte_and_ale, state_machines.CensusMember.ACTIVE_to_TERMINATED, entities.Client.fields.employee_count]
        distinguishing_aspect: "Terminating one of two ACTIVE members recomputes Client.employee_count from 2 to 1 and full_time_equivalent_count accordingly."
        test_recipe:
          setup: ["Empty DB; a client with two ACTIVE FULL_TIME members."]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Recompute Co", ein: "200000026", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { cid: "$.data.id" } }
            - { call: "POST /census-members", payload: { client_id: "${cid}", full_name: "Keep", birth_date: "1990-01-01", annual_salary_cents: 4000000, monthly_contribution_cents: 15000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m1: "$.data.id" } }
            - { call: "POST /census-members", payload: { client_id: "${cid}", full_name: "Drop", birth_date: "1991-01-01", annual_salary_cents: 4000000, monthly_contribution_cents: 15000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m2: "$.data.id" } }
          trigger:
            - { call: "POST /census-members/${m2}/terminate", payload: {}, as: BenefitsConsultant }
          assert:
            - "CensusMember.${m2}.status == TERMINATED"
            - "Client.${cid}.employee_count == 1"
            - "Client.${cid}.full_time_equivalent_count == 1"

