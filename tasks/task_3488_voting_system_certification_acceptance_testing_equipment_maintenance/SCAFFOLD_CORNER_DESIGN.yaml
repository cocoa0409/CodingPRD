      - name: accept_gate_requires_complete_passing_tests
        claim_type: Violation to Error
        grounds: ["errors[ERR_ACCEPTANCE_TESTS_INCOMPLETE]", "errors[ERR_ACCEPTANCE_TEST_FAILURES_PRESENT]"]
        distinguishing_aspect: "Accept with only HARDWARE_DIAGNOSTIC recorded fails ERR_ACCEPTANCE_TESTS_INCOMPLETE; after adding a FAILING calibration record the failure flips to ERR_ACCEPTANCE_TEST_FAILURES_PRESENT — the two errors are checked in that order."
        test_recipe:
          setup: ["Procurement in ACCEPTANCE_TESTING with one PASS HARDWARE_DIAGNOSTIC test."]
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - *k_jur
            - *k_off1
            - *k_proc
          trigger:
            - call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "DELIVERED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTANCE_TESTING" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "HARDWARE_DIAGNOSTIC", critical_defects: 0, major_defects: 0, minor_defects: 0 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "BALLOT_SCAN_CALIBRATION", critical_defects: 0, major_defects: 2, minor_defects: 3 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "accept without a calibration test: 422 ERR_ACCEPTANCE_TESTS_INCOMPLETE"
            - "after adding a FAIL calibration record (index 29 > 20): 422 ERR_ACCEPTANCE_TEST_FAILURES_PRESENT"
            - "procurement remains ACCEPTANCE_TESTING"

