# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1775_site_utility_excavation_contracting
# §1.9 Corner Design: breadth coverage of every §1.1–§1.7 testable claim not
# already covered by §1.8. Sections follow references/claim-extraction-guide.md.
# All chains replay against SCAFFOLD.yaml §1.5; placeholders bind to captures
# earlier in the same instance.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: project_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Project]
        distinguishing_aspect: "POST /projects with all required fields returns 201 with server-applied defaults: status ACTIVE, work_posture CLEAR, approved_co_total_cents 0, version 1, non-null id/created_at/updated_at."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /site-utility/projects"
              payload: { name: "P-ENT", contract_ref: "C-100", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
          assert:
            - "response code 201; data.id is a UUID; created_at == updated_at == 2026-08-01T00:00:00.000Z (logical clock)"
            - "Project.${p_id}.status == ACTIVE and work_posture == CLEAR and approved_co_total_cents == 0 and version == 1"

      - name: get_missing_segment_not_found
        claim_type: not_found
        grounds: [entities.PipeSegment, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND with the §1.0 error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /site-utility/pipe-segments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and http status == 404; envelope has meta.api_request_id and data.message"

      - name: create_project_missing_required_field
        claim_type: required_fields
        grounds: [entities.Project.fields.contingency_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input contingency_cents is rejected with 400 ERR_VALIDATION; nothing is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /site-utility/projects"
              payload: { name: "P-BAD", contract_ref: "C-101", soil_class_default: SOIL_B, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION and http status == 400"
            - "GET /site-utility/projects afterwards returns total_count == 0"

      - name: create_owner_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.UtilityOwner.fields.owner_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "owner_type PLUMBING is outside the declared enum {WATER, SEWER, GAS, ELECTRIC, TELECOM} and is rejected with 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /site-utility/utility-owners"
              payload: { name: "Bad Co", owner_type: PLUMBING, min_notice_hours: 24, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION and http status == 400"

      - name: compaction_pct_input_ignored
        claim_type: computed_fields
        grounds: [entities.CompactionTest.fields.compaction_pct, calculations.compaction_test_result]
        distinguishing_aspect: "compaction_pct is source:computed — a client-supplied value is ignored and the server computes 95.0 from the densities."
        test_recipe:
          setup:
            - "Project P ACTIVE; owner O; ticket ACTIVE (clock 2026-08-03); pothole VERIFIED; shallow segment S (invert 1.0, diameter 6, CLASS_D -> lifts_required 2) in BACKFILLING"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-CF", contract_ref: "C-102", soil_class_default: SOIL_A, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p_id}", locate_ticket_id: "${t_id}", station_label: "STA 1+00", expected_utility_type: WATER, method: VACUUM, design_depth_in: 21, design_offset_in: 0 }
              as: ProjectManager
              captures: { ph_id: $.data.id }
            - call: "POST /site-utility/pothole-verifications/${ph_id}/perform"
              payload: { measured_depth_in: 21, measured_offset_in: 0 }
              as: Foreman
            - call: "POST /site-utility/pothole-verifications/${ph_id}/verify"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-S-01", pipe_material: HDPE, diameter_in: 6, length_ft: 100.0, bedding_class: CLASS_D, design_invert_depth_ft: 1.0, design_slope_pct: 0.5, requires_dewatering: false }
              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 1.75, soil_class: SOIL_A, protective_system: SLOPING, slope_ratio: 0.75 }
              as: Foreman
              captures: { sp_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/submit"
              payload: {}
              as: Foreman
              as_user_id: "foreman-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/review"
              payload: { decision: APPROVE }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /site-utility/pipe-segments/${s_id}/mark-ready"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/pipe-segments/${s_id}/start-install"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/pipe-segments/${s_id}/complete-install"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/installation-inspections"
              payload: { pipe_segment_id: "${s_id}", bedding_ok: true, joint_ok: true, slope_measured_pct: 0.5, cover_depth_ft: 1.0 }
              as: Inspector
              as_user_id: "insp-1"
              captures: { ii_id: $.data.id }
            - call: "POST /site-utility/installation-inspections/${ii_id}/confirm"
              payload: {}
              as: Inspector
              as_user_id: "insp-2"
            - call: "POST /site-utility/pipe-segments/${s_id}/start-backfill"
              payload: {}
              as: Foreman
          trigger:
            - call: "POST /site-utility/compaction-tests"
              payload: { pipe_segment_id: "${s_id}", lift_number: 1, proctor_max_density_pcf: 150.0, field_density_pcf: 142.5, moisture_pct: 12.0, compaction_pct: 999 }
              as: Foreman
              captures: { ct_id: $.data.id, ct_pct: $.data.compaction_pct }
          assert:
            - "CompactionTest.${ct_id}.compaction_pct == 95.0 — the injected 999 was ignored and the formula result stored"
            - "CompactionTest.${ct_id}.result == PASS"

      - name: ticket_version_increments_on_mutation
        claim_type: system_fields
        grounds: [entities.LocateTicket, state_machines.LocateTicket.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "common_fields versioning: a LocateTicket is created at version 1 and submit advances it to version 2 with updated_at refreshed."
        test_recipe:
          setup: ["Project P ACTIVE"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-SYS", contract_ref: "C-103", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-9", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id, t_v0: $.data.version }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
              captures: { t_v1: $.data.version }
          assert:
            - "t_v0 == 1 and t_v1 == 2 (version increments by exactly 1 per mutation)"
            - "updated_at after submit >= created_at"

      - name: audit_events_append_only
        claim_type: immutability
        grounds:
          - entities.AuditEvent.fields.entity_type
          - entities.AuditEvent.fields.project_id
        distinguishing_aspect: "AuditEvent has common_fields: false (no version/updated_at) and the API exposes no mutation endpoint for it — each business mutation appends exactly one event."
        test_recipe:
          setup: ["Project P ACTIVE"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-AUD", contract_ref: "C-104", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "GET /site-utility/projects/${p_id}/audit-events"
              payload: {}
              as: ProjectManager
          assert:
            - "GET audit-events returns exactly 3 events (project create, ticket create, ticket submit), each with entity_type/entity_id/actor_role set and no version field"
            - "events are ordered created_at ASC and none can be mutated (no PUT/PATCH/DELETE endpoint exists for AuditEvent in §1.5)"

      - name: owners_list_pagination
        claim_type: listing
        grounds: [entities.UtilityOwner, response_envelope]
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more follow §1.0: 3 owners with limit=2 yields 2 items + has_more true; offset=2 yields 1 item + has_more false."
        test_recipe:
          setup: ["three utility owners registered"]
          setup_api_calls:
            - call: "POST /site-utility/utility-owners"
              payload: { name: "O1", owner_type: WATER, min_notice_hours: 24, max_shutdown_hours: 8 }
              as: OpsAdmin
            - call: "POST /site-utility/utility-owners"
              payload: { name: "O2", owner_type: GAS, min_notice_hours: 24, max_shutdown_hours: 8 }
              as: OpsAdmin
            - call: "POST /site-utility/utility-owners"
              payload: { name: "O3", owner_type: ELECTRIC, min_notice_hours: 24, max_shutdown_hours: 8 }
              as: OpsAdmin
          trigger:
            - call: "GET /site-utility/utility-owners"
              payload: { limit: 2, offset: 0 }
              as: Foreman
            - call: "GET /site-utility/utility-owners"
              payload: { limit: 2, offset: 2 }
              as: Foreman
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"

      - name: pothole_cross_project_ticket_rejected
        claim_type: parent_relationships
        grounds: [entities.PotholeVerification.fields.locate_ticket_id, "errors[ERR_CROSS_PROJECT_REFERENCE]"]
        distinguishing_aspect: "A pothole whose locate_ticket_id belongs to a different project than project_id is rejected with 422 ERR_CROSS_PROJECT_REFERENCE (FK scope integrity)."
        test_recipe:
          setup: ["Projects P1 and P2 ACTIVE; ticket T2 on P2 (DRAFT)"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P1-XREF", contract_ref: "C-105", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p1_id: $.data.id }
            - call: "POST /site-utility/projects"
              payload: { name: "P2-XREF", contract_ref: "C-106", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p2_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p2_id}", ticket_number: "T-P2", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p1_id}", locate_ticket_id: "${t2_id}", station_label: "STA 1+00", expected_utility_type: GAS, method: HAND_DIG, design_depth_in: 40, design_offset_in: 5 }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CROSS_PROJECT_REFERENCE (http 422); no PotholeVerification persisted"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ticket_submit_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.LocateTicket.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "DRAFT -> SUBMITTED succeeds and the clock-driven SUBMITTED -> ACTIVE fires when the clock reaches legal_start_at."
        test_recipe:
          setup: ["Project P ACTIVE; ticket T DRAFT with legal_start_at 2026-08-03T00:00:00Z"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-TS", contract_ref: "C-200", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
          assert:
            - "After submit: LocateTicket.${t_id}.status == SUBMITTED"
            - "After clock reaches legal_start_at: status == ACTIVE; valid_until == 2026-08-31T00:00:00Z (legal_start + 672h)"

      - name: submit_expired_ticket_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.LocateTicket]
        distinguishing_aspect: "EXPIRED is not a valid from-state for submit: ERR_INVALID_STATE, and the ticket is unchanged."
        test_recipe:
          setup: ["Project P; ticket T SUBMITTED at clock 2026-08-03; clock advanced past valid_until (2026-08-31) so T is EXPIRED"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-TE", contract_ref: "C-201", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (http 409); LocateTicket.${t_id}.status stays EXPIRED"

      - name: window_complete_releases_minutes_and_marks_tiein
        claim_type: side_effect_execution
        grounds: [state_machines.ShutdownWindow.ACTIVE_to_COMPLETED, state_machines.ShutdownWindow.CONFIRMED_to_ACTIVE]
        distinguishing_aspect: "The clock-driven CONFIRMED -> ACTIVE fires inside the window, and complete applies all listed side effects: status COMPLETED, segment.tie_in_completed true, owner committed minutes released."
        test_recipe:
          setup:
            - "Project P; owner O (notice 24h); ticket ACTIVE (clock 2026-08-03); pothole VERIFIED; segment S READY"
            - "Window W created 2026-08-04T08:00 -> 2026-08-04T10:00 (120 min) and CONFIRMED by the owner rep"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-WC", contract_ref: "C-202", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 24, max_shutdown_hours: 12 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p_id}", locate_ticket_id: "${t_id}", station_label: "STA 1+00", expected_utility_type: WATER, method: VACUUM, design_depth_in: 60, design_offset_in: 12 }
              as: ProjectManager
              captures: { ph_id: $.data.id }
            - call: "POST /site-utility/pothole-verifications/${ph_id}/perform"
              payload: { measured_depth_in: 60, measured_offset_in: 12 }
              as: Foreman
            - call: "POST /site-utility/pothole-verifications/${ph_id}/verify"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-W-01", pipe_material: PVC_C900, diameter_in: 12, length_ft: 200.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: false }
              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 9.5, soil_class: SOIL_C, protective_system: TRENCH_BOX }
              as: Foreman
              captures: { sp_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/submit"
              payload: {}
              as: Foreman
              as_user_id: "foreman-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/review"
              payload: { decision: APPROVE }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /site-utility/pipe-segments/${s_id}/mark-ready"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", pipe_segment_id: "${s_id}", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T10:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { w_id: $.data.id }
            - call: "POST /site-utility/shutdown-windows/${w_id}/review"
              payload: { decision: CONFIRM }
              as: UtilityOwnerRep
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/shutdown-windows/${w_id}/complete"
              payload: {}
              as: Foreman
          assert:
            - "After clock advance into [08:00, 10:00): ShutdownWindow.${w_id}.status == ACTIVE"
            - "After complete: status == COMPLETED; PipeSegment.${s_id}.tie_in_completed == true; UtilityOwner.${o_id}.committed_shutdown_minutes == 0"

      - name: inspection_fail_rework_loop
        claim_type: valid_transition
        grounds: [state_machines.PipeSegment.INSTALLED_to_INSTALLING, state_machines.PipeSegment.INSTALLED_to_BACKFILLING]
        distinguishing_aspect: "Cyclic rework: a CONFIRMED FAIL inspection permits INSTALLED -> INSTALLING; after rework a new CONFIRMED PASS inspection opens the backfill gate — the loop closes."
        test_recipe:
          setup:
            - "Project P; owner O; ticket ACTIVE (clock 2026-08-03); pothole VERIFIED; segment S INSTALLING (via READY)"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-RW", contract_ref: "C-203", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p_id}", locate_ticket_id: "${t_id}", station_label: "STA 1+00", expected_utility_type: WATER, method: VACUUM, design_depth_in: 60, design_offset_in: 12 }
              as: ProjectManager
              captures: { ph_id: $.data.id }
            - call: "POST /site-utility/pothole-verifications/${ph_id}/perform"
              payload: { measured_depth_in: 60, measured_offset_in: 12 }
              as: Foreman
            - call: "POST /site-utility/pothole-verifications/${ph_id}/verify"
              payload: {}
              as: ProjectManager
