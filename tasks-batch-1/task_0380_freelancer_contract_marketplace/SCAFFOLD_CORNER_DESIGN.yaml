# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Freelancer & Contract Work Marketplace — breadth probe over §1.1-§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Client.fields.display_name, entities.Client.fields.wallet_balance_cents]
        distinguishing_aspect: "POST /clients with display_name+email returns 201, status=ACTIVE, wallet_balance_cents=0, escrow_held_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { display_name: "Acme Co", email: "new@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          assert:
            - "HTTP 201; Client.status == ACTIVE; wallet_balance_cents == 0; version == 1; id is a non-prefixed UUID"

      - name: create_freelancer_default_tax_id_false
        claim_type: Defaults
        grounds: [entities.Freelancer.fields.tax_id_on_file, entities.Freelancer.fields.reputation_score]
        distinguishing_aspect: "POST /freelancers omitting tax_id_on_file applies default false; reputation_score defaults to 0, fee_tier TIER_A."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /freelancers"
              payload: { display_name: "Solo", email: "solo@x.com", skills: ["x"] }
              as: PlatformAdmin
              captures: { fid: $.data.id }
          assert:
            - "HTTP 201; Freelancer.tax_id_on_file == false; reputation_score == 0.0; fee_tier == TIER_A; lifetime_earnings_cents == 0"

      - name: get_freelancer_not_found
        claim_type: Not Found
        grounds: [entities.Freelancer, "errors[ERR_FREELANCER_NOT_FOUND]"]
        distinguishing_aspect: "GET /freelancers/{nonexistent} returns ERR_FREELANCER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /freelancers/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_FREELANCER_NOT_FOUND"

      - name: create_job_posting_missing_required_field
        claim_type: Required Fields
        grounds: [entities.JobPosting.fields.billing_type, "validations[priority=4]"]
        distinguishing_aspect: "POST /job-postings omitting billing_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c1@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "no billing", budget_cents: 1000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: computed_fee_tier_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Freelancer.fields.fee_tier, entities.Freelancer.fields.lifetime_earnings_cents]
        distinguishing_aspect: "fee_tier is source=computed; it derives only from lifetime_earnings_cents and is not settable via create/patch input."
        test_recipe:
          setup: ["A freelancer just created."]
          setup_api_calls:
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f2@x.com", skills: ["x"] }
              as: PlatformAdmin
              captures: { fid: $.data.id }
          trigger:
            - call: "GET /freelancers/${fid}"
              payload: {}
              as: PlatformAdmin
              captures: { tier: $.data.fee_tier }
          assert:
            - "Freelancer.fee_tier == TIER_A (lifetime_earnings_cents == 0); value reflects computation, not any input"

      - name: list_clients_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Client]
        distinguishing_aspect: "GET /clients returns response_type=array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two clients exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "A", email: "a3@x.com" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "B", email: "b3@x.com" }
              as: PlatformAdmin
          trigger:
            - call: "GET /clients"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == array; meta carries total_count >= 2 and has_more boolean"

      - name: immutable_escrow_transaction_no_version
        claim_type: Immutability
        grounds: [entities.EscrowTransaction]
        distinguishing_aspect: "EscrowTransaction has common_fields:false — no version field, append-only, no update endpoint exists."
        test_recipe:
          setup: ["A milestone has been funded (one FUND escrow row exists)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "EC", email: "ec@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f4@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fid: $.data.id }
            - call: "POST /clients/${cid}/wallet/deposit"
              payload: { amount_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "${fid}", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { pr: $.data.id }
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/activate"
              payload: { sow_text: "w" }
              as: Client
              as_user_id: "${cid}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${ct}/milestones"
              payload: { title: "M", amount_cents: 20000, ordinal: 1 }
              as: Client
              as_user_id: "${cid}"
              captures: { mid: $.data.id }
            - call: "POST /contracts/${ct}/milestones/${mid}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "GET /milestones/${mid}/escrow-transactions"
              payload: {}
              as: PlatformAdmin
              captures: { etype: "$.data[0].txn_type" }
          assert:
            - "Exactly one EscrowTransaction with txn_type == FUND, status == HELD, amount_cents == 20000; row carries no version field"

      - name: fk_integrity_proposal_bad_freelancer
        claim_type: Parent Relationships
        grounds: [entities.Proposal.fields.freelancer_id, "errors[ERR_FREELANCER_NOT_FOUND]"]
        distinguishing_aspect: "POST /proposals with a non-existent freelancer_id returns ERR_FREELANCER_NOT_FOUND (404)."
        test_recipe:
          setup: ["A client and an OPEN posting exist."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c5@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
          trigger:
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "00000000-0000-4000-8000-0000000000bb", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "00000000-0000-4000-8000-0000000000bb"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_FREELANCER_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_state_milestone_is_draft
        claim_type: Initial State
        grounds: [state_machines.Milestone, entities.Milestone.fields.status]
        distinguishing_aspect: "A newly created milestone starts in DRAFT with funded_cents 0."
        test_recipe:
          setup: ["ACTIVE FIXED contract."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c6@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f6@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fid: $.data.id }
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "${fid}", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { pr: $.data.id }
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/activate"
              payload: { sow_text: "w" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /contracts/${ct}/milestones"
              payload: { title: "M", amount_cents: 20000, ordinal: 1 }
              as: Client
              as_user_id: "${cid}"
              captures: { st: $.data.status }
          assert:
            - "Milestone.status == DRAFT; funded_cents == 0; released_gross_cents == 0"

      - name: invalid_transition_approve_from_funded
        claim_type: Invalid Transitions
        grounds: [state_machines.Milestone.FUNDED_to_SUBMITTED, "errors[ERR_INVALID_MILESTONE_STATE]"]
        distinguishing_aspect: "Approving a FUNDED (not SUBMITTED) milestone returns ERR_INVALID_MILESTONE_STATE (409); no escrow moves."
        test_recipe:
          setup: ["A FUNDED milestone that has NOT been submitted."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c7@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f7@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fid: $.data.id }
            - call: "POST /clients/${cid}/wallet/deposit"
              payload: { amount_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "${fid}", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { pr: $.data.id }
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/activate"
              payload: { sow_text: "w" }
              as: Client
              as_user_id: "${cid}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${ct}/milestones"
              payload: { title: "M", amount_cents: 20000, ordinal: 1 }
              as: Client
              as_user_id: "${cid}"
              captures: { mid: $.data.id }
            - call: "POST /contracts/${ct}/milestones/${mid}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /contracts/${ct}/milestones/${mid}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_MILESTONE_STATE; Milestone.status still FUNDED"

      - name: terminal_lockdown_release_already_released
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Milestone, "errors[ERR_INVALID_MILESTONE_STATE]"]
        distinguishing_aspect: "Re-releasing an already RELEASED milestone returns ERR_INVALID_MILESTONE_STATE; no second payout created."
        test_recipe:
          setup: ["A RELEASED milestone."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c8@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f8@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fid: $.data.id }
            - call: "POST /clients/${cid}/wallet/deposit"
              payload: { amount_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "${fid}", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { pr: $.data.id }
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/activate"
              payload: { sow_text: "w" }
              as: Client
              as_user_id: "${cid}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${ct}/milestones"
              payload: { title: "M", amount_cents: 20000, ordinal: 1 }
              as: Client
              as_user_id: "${cid}"
              captures: { mid: $.data.id }
            - call: "POST /contracts/${ct}/milestones/${mid}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${cid}"
            - call: "GET /contracts/${ct}"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { cv1: $.data.version }
            - call: "POST /contracts/${ct}/milestones/${mid}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fid}"
            - call: "POST /contracts/${ct}/milestones/${mid}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /contracts/${ct}/milestones/${mid}/release"
              payload: { expected_contract_version: "${cv1}" }
              as: Client
              as_user_id: "${cid}"
            - call: "GET /contracts/${ct}"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /contracts/${ct}/milestones/${mid}/release"
              payload: { expected_contract_version: "${cv2}" }
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_MILESTONE_STATE; Milestone.released_gross_cents still 20000"

      - name: idempotency_double_accept_proposal
        claim_type: Idempotency
        grounds: [state_machines.Proposal.SUBMITTED_to_ACCEPTED, "errors[ERR_INVALID_PROPOSAL_STATE]"]
        distinguishing_aspect: "A second accept on an already ACCEPTED proposal returns ERR_INVALID_PROPOSAL_STATE; only one contract exists."
        test_recipe:
          setup: ["A proposal already ACCEPTED (contract created)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c9@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f9@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fid: $.data.id }
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "${fid}", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { pr: $.data.id }
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_PROPOSAL_STATE"

      - name: precondition_complete_blocked_by_open_milestone
        claim_type: Precondition Enforcement
        grounds: [state_machines.Contract.ACTIVE_to_COMPLETED, "validations[priority=12]", "errors[ERR_CONTRACT_HAS_OPEN_ITEMS]"]
        distinguishing_aspect: "Completing an ACTIVE contract with a non-terminal (FUNDED) milestone returns ERR_CONTRACT_HAS_OPEN_ITEMS (409)."
        test_recipe:
          setup: ["ACTIVE contract with one FUNDED (non-terminal) milestone."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c10@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f10@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fid: $.data.id }
            - call: "POST /clients/${cid}/wallet/deposit"
              payload: { amount_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "${fid}", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { pr: $.data.id }
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/activate"
              payload: { sow_text: "w" }
              as: Client
              as_user_id: "${cid}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${ct}/milestones"
              payload: { title: "M", amount_cents: 20000, ordinal: 1 }
              as: Client
              as_user_id: "${cid}"
              captures: { mid: $.data.id }
            - call: "POST /contracts/${ct}/milestones/${mid}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /contracts/${ct}/complete"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_CONTRACT_HAS_OPEN_ITEMS; Contract.status still ACTIVE"

      - name: dispute_withdraw_returns_milestone_to_submitted
        claim_type: Side Effect Execution
        grounds: [state_machines.Dispute.OPEN_to_WITHDRAWN, entities.Milestone.fields.status]
        distinguishing_aspect: "Withdrawing an OPEN dispute by its raiser sets milestone back to SUBMITTED and decrements open_dispute_count to 0."
        test_recipe:
          setup: ["A DISPUTED milestone with an OPEN dispute raised by FREELANCER."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c11@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "F", email: "f11@x.com", skills: ["x"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fid: $.data.id }
            - call: "POST /clients/${cid}/wallet/deposit"
              payload: { amount_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${cid}", title: "J", billing_type: "FIXED", budget_cents: 30000, required_skills: ["x"] }
              as: Client
              as_user_id: "${cid}"
              captures: { jp: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp}", freelancer_id: "${fid}", bid_amount_cents: 20000, cover_letter: "b" }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { pr: $.data.id }
            - call: "POST /proposals/${pr}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${cid}"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/activate"
              payload: { sow_text: "w" }
              as: Client
              as_user_id: "${cid}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${ct}/milestones"
              payload: { title: "M", amount_cents: 20000, ordinal: 1 }
              as: Client
              as_user_id: "${cid}"
              captures: { mid: $.data.id }
            - call: "POST /contracts/${ct}/milestones/${mid}/fund"
              payload: { expected_contract_version: "${cv0}" }
              as: Client
              as_user_id: "${cid}"
            - call: "POST /contracts/${ct}/milestones/${mid}/submit-work"
              payload: {}
              as: Freelancer
              as_user_id: "${fid}"
            - call: "POST /contracts/${ct}/milestones/${mid}/dispute"
              payload: { raised_by: "FREELANCER", reason: "x", claimed_release_cents: 20000 }
              as: Freelancer
              as_user_id: "${fid}"
              captures: { did: $.data.id }
          trigger:
            - call: "POST /disputes/${did}/withdraw"
              payload: { actor_role: "FREELANCER" }
              as: Freelancer
              as_user_id: "${fid}"
            - call: "GET /contracts/${ct}/milestones/${mid}"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { st: $.data.status }
          assert:
            - "Dispute.status == WITHDRAWN; Milestone.${mid}.status == SUBMITTED; Contract.open_dispute_count == 0"

      - name: award_cascade_milestone_release
        claim_type: Side Effect Execution
        grounds: [state_machines.Dispute.UNDER_ARBITRATION_to_RESOLVED, state_machines.Milestone.DISPUTED_to_RELEASED]
