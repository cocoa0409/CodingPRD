              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/17", finished_hours: 6.0 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
            - call: "POST /titles/${ti}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /distribution-channels"
              payload: { name: "Ch17", supported_territories: ["US"], retailer_cut_pct: 0.40 }
              as: PlatformAdmin
              captures: { ch: $.data.id }
            - call: "POST /distribution-listings"
              payload: { title_id: "${ti}", channel_id: "${ch}", territory: "US", effective_from: "2026-03-01", effective_until: "2026-12-31" }
              as: PlatformAdmin
              captures: { li: $.data.id }
            - call: "POST /sales-events"
              payload: { listing_id: "${li}", units_sold: 100, units_returned: 10, unit_price_cents: 1500, occurred_at: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-events"
