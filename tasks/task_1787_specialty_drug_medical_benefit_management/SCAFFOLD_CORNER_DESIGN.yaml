          biosimilar_drug_id: ${dbs}
          provider_incentive_addon_pct: 0.02
          member_copay_waiver_pct: 1.0
          effective_start: '2026-08-01'
          effective_end: '2027-01-01'
        as: PlanAdmin
        captures:
          bpol: $.data.id
      - call: POST /api/biosimilar-policies/${bpol}/activate
        payload: {}
        as: PlanAdmin
      - call: POST /api/provider-accounts
        payload:
          name: Safety Provider
        as: PlanAdmin
        captures:
          prov_id: $.data.id
      - call: POST /api/prior-authorizations
        payload:
          drug_id: ${dst}
          member_id: MEM-V9
          diagnosis_code: C50
          requested_start_date: '2026-08-01'
          requested_dose_mg: 100
          step_therapy_completed: false
        as: ProviderRep
