            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 40.0, peroxide_kg: 25.0, surfactant_kg: 6.0 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/brightness", payload: { brightness_iso: 70.0 }, as: QualityLab, as_user_id: "ql_cert" }
            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 55.0, peroxide_kg: 35.0, surfactant_kg: 9.0 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/brightness", payload: { brightness_iso: 74.0 }, as: QualityLab, as_user_id: "ql_cert" }
            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 60.0, peroxide_kg: 40.0, surfactant_kg: 12.0 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/brightness", payload: { brightness_iso: 77.0 }, as: QualityLab, as_user_id: "ql_cert" }
          trigger:
            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 60.0, peroxide_kg: 40.0, surfactant_kg: 12.0 }, as: MachineOperator, as_user_id: "mo_1" }
          assert:
            - "response_type == error with HTTP 409 and data.error_id == \"ERR_DEINK_PASS_LIMIT\""
            - "PulpBatch.${pb_id}.status == DEINK_HOLD"
            - "PulpBatch.${pb_id}.deink_pass_count == 3"
            - "PulpBatch.${pb_id}.cumulative_chemical_cost == 333.20"
            - "GET /reject-streams?source_ref_id=${pb_id}&source_kind=DEINK_SLUDGE returns total_count == 3 with dry_solids_tons 0.258, 0.175 and 0.118"
            - "PulpBatch.${pb_id}.final_accepted_tons == null"

      - name: fiber_receipt_fork_join_with_divergent_side_effect_sets
        grounds:
          - state_machines.FiberReceipt.SAMPLED_to_ACCEPTED
          - state_machines.FiberReceipt.SAMPLED_to_DOWNGRADED
          - state_machines.FiberReceipt.SAMPLED_to_REJECTED
          - calculations.supplier_qualification_posture
          - entities.FiberInventoryLot.fields.grade_code
          - entities.FiberPurchaseOrder.fields.received_net_tons
        distinguishing_aspect: |
          Non-linearity on FiberReceipt is a three-way fork out of one state whose branches
          differ in their side-effect SETS, not merely in the label reached: ACCEPT mints a lot
          at the declared grade and books tonnage, DOWNGRADE mints a lot at
          downgrade_target_grade_code and books tonnage while also taking a strike, REJECT mints
          nothing and books nothing yet still takes a strike, so after all three branches the PO
          holds 30.00 of 200.00 tons, exactly two lots exist at two different grade_codes, and
          the supplier sits at PROBATION on 2 strikes.
        test_recipe:
          setup:
            - "FiberGrade MIX_54 (max_contamination 6.00) and OCC_11 (max_contamination 3.00, downgrade_target MIX_54) declared."
            - "Supplier Riverbend, initially QUALIFIED with contamination_strike_count 0, holding a CONFIRMED 200.00-ton OCC_11 purchase order."
            - "Three SAMPLED receipts on that order taken by ql_sample: A at contamination 2.50 (net 20.00), B at 4.50 (net 10.00), C at 7.00 (net 5.00), all at moisture 10.00 so no branch can be reached via the moisture route."
            - "Dispositions are taken by ql_dispo, a different QualityLab user, to satisfy segregation of duties."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-F-001", sublots: [ { sublot_no: 1, gross_tons: 22.000, tare_tons: 2.000, moisture_pct: 10.00, contamination_pct: 2.50 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_a: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-F-002", sublots: [ { sublot_no: 1, gross_tons: 12.000, tare_tons: 2.000, moisture_pct: 10.00, contamination_pct: 4.50 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_b: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-F-003", sublots: [ { sublot_no: 1, gross_tons: 7.000, tare_tons: 2.000, moisture_pct: 10.00, contamination_pct: 7.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_c: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_a}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "POST /fiber-receipts/${rcpt_b}/disposition", payload: { disposition: "DOWNGRADE" }, as: QualityLab, as_user_id: "ql_dispo" }
          trigger:
            - { call: "POST /fiber-receipts/${rcpt_c}/disposition", payload: { disposition: "REJECT" }, as: QualityLab, as_user_id: "ql_dispo" }
          assert:
            - "FiberReceipt.${rcpt_a}.status == ACCEPTED AND accepted_grade_code == \"OCC_11\" AND net_tons == 20.00"
            - "FiberReceipt.${rcpt_b}.status == DOWNGRADED AND accepted_grade_code == \"MIX_54\" AND net_tons == 10.00"
            - "FiberReceipt.${rcpt_c}.status == REJECTED AND accepted_grade_code == null AND net_tons == 5.00"
            - "GET /fiber-inventory-lots?grade_code=OCC_11 returns total_count == 1 with tons_received == 20.00"
            - "GET /fiber-inventory-lots?grade_code=MIX_54 returns total_count == 1 with tons_received == 10.00"
            - "GET /fiber-inventory-lots?receipt_id=${rcpt_c} returns total_count == 0"
            - "FiberPurchaseOrder.${po_id}.received_net_tons == 30.00"
            - "FiberPurchaseOrder.${po_id}.status == PARTIALLY_RECEIVED"
            - "Supplier.${sup_id}.contamination_strike_count == 2"
            - "Supplier.${sup_id}.qualification_status == PROBATION"

  # ===========================================================================
  # Rule 4 — transitive cascades reached by three different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: supplier_suspension_four_hop_cascade_via_downgrade_disposition
        grounds:
          - state_machines.FiberReceipt.SAMPLED_to_DOWNGRADED
          - calculations.supplier_qualification_posture
          - state_machines.PulpBatch.QUEUED_to_CANCELLED
          - state_machines.ProductionRun.SCHEDULED_to_ABORTED
          - state_machines.CustomerOrder.SCHEDULED_to_SUBMITTED
          - entities.FiberInventoryLot.fields.status
          - entities.CustomerOrder.fields.deschedule_count
        distinguishing_aspect: |
          The trigger is a quality disposition on an inbound truck (FiberReceipt SAMPLED ->
          DOWNGRADED), and the fourth-order consequence is a customer's order losing its
          production slot: strike 4 flips the supplier to SUSPENDED (hop 1), which quarantines
          every AVAILABLE lot of that supplier including the lot the very same disposition just
          minted (hop 2), which cancels the QUEUED PulpBatch holding one of those lots (hop 3),
          which aborts and condemns the SCHEDULED ProductionRun and returns its CustomerOrder to
          SUBMITTED with deschedule_count 1 (hop 4) — four entity kinds none of which appears in
          the request.
        test_recipe:
          setup:
            - "FiberGrades MIX_54 (max_contamination 6.00) and OCC_11 (max_contamination 3.00, downgrade_target MIX_54) and DLK_37 (max_contamination 2.00, no downgrade target) declared."
            - "PaperGradeSpec TL_140, PaperMachine PM1 RUNNABLE, EffluentPermit MILL-NPDES-01 COMPLIANT, Customer Boxworks ACTIVE."
            - "Supplier Riverbend holds two CONFIRMED orders priced while still QUALIFIED: PO_occ for 300.00 tons of OCC_11 and PO_dlk for 300.00 tons of DLK_37."
            - "Receipt A on PO_occ at contamination 2.50 is ACCEPTED, minting an AVAILABLE OCC_11 lot of 28.00 tons."
            - "Receipts B, C and D on PO_dlk each weigh net 5.00 at contamination 4.00 — above DLK_37's 2.00 ceiling with no downgrade target — and are all REJECTED, taking the supplier to 3 strikes and posture PROBATION."
            - "A PulpBatch is created QUEUED (never started) drawing 20.000 tons of lot A for TL_140 on OCC_LINE; a ProductionRun is created SCHEDULED on PM1 against that QUEUED batch with pulp_draw_tons 20.000; a CustomerOrder for 15.00 tons of TL_140 is SCHEDULED onto that run."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "DLK_37", index_symbol: "PPI_DLK", max_contamination_pct: 2.00, max_moisture_pct: 10.00, nominal_yield_pct: 72.00, deink_required: true, rank_order: 3 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_DLK", effective_month: "2026-07", published_price_per_ton: 150.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /effluent-permits", payload: { permit_number: "MILL-NPDES-01", bod_limit_kg_per_day: 100.00, tss_limit_kg_per_day: 200.00, flow_limit_m3_per_day: 5000.00, rolling_window_days: 7 }, as: EnvironmentalOfficer, as_user_id: "eo_log" }
            - { call: "POST /paper-machines", payload: { name: "PM1", wire_width_mm: 4200, max_tons_per_hour: 20.00, changeover_buffer_minutes: 60, steam_tph_per_ton: 1.400 }, as: MillPlanner, as_user_id: "mp_1", captures: { pm1_id: "$.data.id", pm1_v1: "$.data.version" } }
            - { call: "POST /customers", payload: { name: "Boxworks Packaging", allocation_priority_tier: 1, max_roll_diameter_mm: 1500, max_roll_width_mm: 2200, wrap_spec: "POLY_COATED" }, as: MillPlanner, as_user_id: "mp_1", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 300.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_occ: "$.data.id", po_occ_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_occ}/price", payload: { expected_purchase_order_version: "${po_occ_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_occ}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "DLK_37", contracted_tons: 300.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_dlk: "$.data.id", po_dlk_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/price", payload: { expected_purchase_order_version: "${po_dlk_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_occ}/receipts", payload: { truck_reference: "TRK-S-001", sublots: [ { sublot_no: 1, gross_tons: 30.000, tare_tons: 2.000, moisture_pct: 10.00, contamination_pct: 2.50 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_a: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_a}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_a}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_a: "$.data[0].id" } }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/receipts", payload: { truck_reference: "TRK-S-002", sublots: [ { sublot_no: 1, gross_tons: 6.000, tare_tons: 1.000, moisture_pct: 8.00, contamination_pct: 4.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_b: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_b}/disposition", payload: { disposition: "REJECT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/receipts", payload: { truck_reference: "TRK-S-003", sublots: [ { sublot_no: 1, gross_tons: 6.000, tare_tons: 1.000, moisture_pct: 8.00, contamination_pct: 4.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_c: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_c}/disposition", payload: { disposition: "REJECT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "POST /fiber-purchase-orders/${po_dlk}/receipts", payload: { truck_reference: "TRK-S-004", sublots: [ { sublot_no: 1, gross_tons: 6.000, tare_tons: 1.000, moisture_pct: 8.00, contamination_pct: 4.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_d: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_d}/disposition", payload: { disposition: "REJECT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_a}", tons_charged: 20.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T06:00:00Z", pulp_draw_tons: 20.000, expected_machine_version: "${pm1_v1}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run_id: "$.data.id" } }
            - { call: "POST /customer-orders", payload: { customer_id: "${cust_id}", product_code: "TL_140", ordered_tons: 15.00, requested_ship_date: "2026-08-20", roll_width_mm: 2000, roll_diameter_mm: 1200, wrap_spec: "POLY_COATED" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id", ord_v1: "$.data.version" } }
            - { call: "POST /customer-orders/${ord_id}/schedule", payload: { run_id: "${run_id}", expected_order_version: "${ord_v1}" }, as: MillPlanner, as_user_id: "mp_1" }
          trigger:
            - { call: "POST /fiber-purchase-orders/${po_occ}/receipts", payload: { truck_reference: "TRK-S-005", sublots: [ { sublot_no: 1, gross_tons: 12.000, tare_tons: 2.000, moisture_pct: 11.00, contamination_pct: 4.50 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_e: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_e}/disposition", payload: { disposition: "DOWNGRADE" }, as: QualityLab, as_user_id: "ql_dispo" }
          assert:
            - "FiberReceipt.${rcpt_e}.net_tons == 10.00 AND weighted_contamination_pct == 4.50 AND status == DOWNGRADED AND accepted_grade_code == \"MIX_54\""
            - "hop 1: Supplier.${sup_id}.contamination_strike_count == 4 AND Supplier.${sup_id}.qualification_status == SUSPENDED"
            - "hop 2: FiberInventoryLot.${lot_a}.status == QUARANTINED"
            - "hop 2: GET /fiber-inventory-lots?grade_code=MIX_54 returns total_count == 1 with status == QUARANTINED (the lot minted by this very disposition is also caught)"
            - "hop 2: GET /fiber-inventory-lots?status=AVAILABLE returns total_count == 0"
            - "hop 3: PulpBatch.${pb_id}.status == CANCELLED"
            - "hop 3: FiberInventoryLot.${lot_a}.tons_consumed == 0.000 AND FiberInventoryLot.${lot_a}.tons_available == 28.000"
            - "hop 4: ProductionRun.${run_id}.run_status == ABORTED AND ProductionRun.${run_id}.quality_status == CONDEMNED"
            - "hop 4: CustomerOrder.${ord_id}.status == SUBMITTED AND CustomerOrder.${ord_id}.scheduled_run_id == null AND CustomerOrder.${ord_id}.deschedule_count == 1"

      - name: run_condemn_cascade_scraps_rolls_into_solids_ledger
        grounds:
          - state_machines.ProductionRun.PROVISIONAL_to_HELD
          - state_machines.ProductionRun.HELD_to_CONDEMNED
          - state_machines.RollSet.WRAPPED_to_QUARANTINED
          - entities.RejectStream.fields.source_kind
          - calculations.solids_ledger_balance
          - entities.ProductionRun.fields.produced_tons
        distinguishing_aspect: |
          The trigger here is a quality-axis condemnation rather than a supplier posture change,
          and the cascade crosses out of the production domain into the environmental solids
          ledger: /hold quarantines both WRAPPED RollSets (hop 1), /condemn scraps them and mints
