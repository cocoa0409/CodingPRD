          - validations[priority 5 ERR_NOT_RESOURCE_OWNER]
          - endpoints["POST /mdu-agreements/{id}/owner-response"]
        distinguishing_aspect: "An entity_backed role is scoped to its own row: the second PROPERTY_OWNER account carries the correct MduOwner role and hits the correct endpoint, and is still refused with 403 ERR_NOT_RESOURCE_OWNER because owner_account_id names someone else -- while the rightful owner's identical body succeeds."
