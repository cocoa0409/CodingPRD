  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: assignment_slots_are_half_open_and_adjacency_is_allowed
        grounds:
          - validations[priority=12]
          - validations[priority=11]
          - entities.EngagementRoleAssignment.fields.started_on
          - entities.EngagementRoleAssignment.fields.scheduled_end_on
        distinguishing_aspect: "EngagementRoleAssignment slots use half-open [started_on, scheduled_end_on) arithmetic: a replacement assignment starting exactly at the predecessor's scheduled_end_on is admitted, while one starting inside the predecessor's scheduled window is rejected even though the predecessor was ended early."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. One non-PIE client, one engagement, and two professionals. Two assignments are created on the engagement: CONCURRING_PARTNER [2026-01-01, 2026-07-01) and EQ_REVIEWER [2026-01-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_j: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Beacon Aerospace", industry_code: "MANUFACTURING", jurisdiction_country: "US", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_ba: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Ivan Petrov", grade: "PARTNER", home_affiliate_id: "${aff_j}", rotation_role_class: "CONCURRING_PARTNER" }
              as: PlatformAdmin
              captures: { pro_ip: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Nadia Farouk", grade: "PARTNER", home_affiliate_id: "${aff_j}", rotation_role_class: "EQ_REVIEWER" }
              as: PlatformAdmin
              captures: { pro_nf: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_ba}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_ba: $.data.id, eng_ba_v: $.data.version }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_ba}", professional_id: "${pro_ip}", role: "CONCURRING_PARTNER", started_on: "2026-01-01T00:00:00Z", scheduled_end_on: "2026-07-01T00:00:00Z", expected_engagement_version: "${eng_ba_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_ip: $.data.id }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_ba}", professional_id: "${pro_nf}", role: "EQ_REVIEWER", started_on: "2026-01-01T00:00:00Z", scheduled_end_on: "2026-07-01T00:00:00Z", expected_engagement_version: "${eng_ba_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_nf: $.data.id }
          trigger:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/role-assignments/${asg_nf}/end"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_ba}", professional_id: "${pro_nf}", role: "EQ_REVIEWER", started_on: "2026-06-15T00:00:00Z", scheduled_end_on: "2026-12-15T00:00:00Z", expected_engagement_version: "${eng_ba_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { err_ov: $.data.error_id }
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/role-assignments/${asg_ip}/end"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_ba}", professional_id: "${pro_ip}", role: "CONCURRING_PARTNER", started_on: "2026-07-01T00:00:00Z", scheduled_end_on: "2027-01-01T00:00:00Z", expected_engagement_version: "${eng_ba_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_ip2: $.data.id }
          assert:
            - "the EQ_REVIEWER attempt is rejected with ERR_ROLE_ASSIGNMENT_OVERLAP because 2026-06-15 falls inside [2026-01-01, 2026-07-01) even though the predecessor was ended on 2026-06-15"
            - "the CONCURRING_PARTNER attempt starting exactly at 2026-07-01 is admitted because the interval is half-open and adjacency is legal"
            - "EngagementRoleAssignment.${asg_ip2}.status == ACTIVE and EngagementRoleAssignment.${asg_nf}.ended_on == 2026-06-15T00:00:00Z"
            - "no duplicate-holder error fires because the predecessors are ENDED, so the only rule separating the two attempts is the interval arithmetic"

      - name: quality_review_windows_require_a_five_day_buffer
        grounds:
          - validations[priority=13]
          - entities.QualityReview.fields.due_on
          - entities.QualityReview.fields.received_on
        distinguishing_aspect: "QualityReview windows carry a mandatory buffer rather than plain adjacency: a successor review for the same reviewer and review_type must start at least five days after the predecessor's due_on, so 2026-03-05 is rejected and 2026-03-06 is admitted."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-05T00:00:00Z. One client, one engagement, one PROFESSIONAL reviewer, and one existing ENGAGEMENT_QUALITY_REVIEW running 2026-01-01 to 2026-03-01."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-03-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_k: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Cobalt Semiconductor", industry_code: "TECH", jurisdiction_country: "US", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_cs: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Elena Marsh", grade: "PARTNER", home_affiliate_id: "${aff_k}", rotation_role_class: "EQ_REVIEWER" }
              as: PlatformAdmin
              captures: { pro_em: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_cs}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_cs: $.data.id }
            - call: "POST /audit/quality-reviews"
              payload: { engagement_id: "${eng_cs}", reviewer_id: "${pro_em}", review_type: "ENGAGEMENT_QUALITY_REVIEW", received_on: "2026-01-01T00:00:00Z", due_on: "2026-03-01T00:00:00Z", deficiency_count: 0 }
              as: QualityReviewer
              as_user_id: "${pro_em}"
              captures: { rev_em1: $.data.id }
          trigger:
            - call: "POST /audit/quality-reviews"
              payload: { engagement_id: "${eng_cs}", reviewer_id: "${pro_em}", review_type: "ENGAGEMENT_QUALITY_REVIEW", received_on: "2026-03-05T00:00:00Z", due_on: "2026-06-01T00:00:00Z", deficiency_count: 0 }
              as: QualityReviewer
              as_user_id: "${pro_em}"
              captures: { err_buf: $.data.error_id }
            - call: "POST /audit/quality-reviews"
              payload: { engagement_id: "${eng_cs}", reviewer_id: "${pro_em}", review_type: "ENGAGEMENT_QUALITY_REVIEW", received_on: "2026-03-06T00:00:00Z", due_on: "2026-06-06T00:00:00Z", deficiency_count: 0 }
              as: QualityReviewer
              as_user_id: "${pro_em}"
              captures: { rev_em2: $.data.id }
          assert:
            - "the 2026-03-05 attempt is rejected with ERR_REVIEW_WINDOW_CONFLICT (due_on 2026-03-01 + 5 days = 2026-03-06)"
            - "the 2026-03-06 attempt succeeds and QualityReview.${rev_em2}.status == SCHEDULED"
            - "the buffer is scoped to the (reviewer_id, review_type) pair: a review by the same reviewer with review_type INSPECTION_READINESS on the same dates is not blocked"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: naf_approve_then_revoke_conserves_the_client_fee_pool
        grounds:
          - calculations.naf_fee_pool
          - state_machines.NonAuditService.APPROVED_to_REVOKED
          - entities.Client.fields.naf_approved_fee_cents
        distinguishing_aspect: "The conserved quantity is the client's approved non-audit fee pool in cents: approving a 300000-cent service then revoking it leaves Client.naf_approved_fee_cents exactly where it started, with the intermediate value equal to the per-service rounded fee."
        test_recipe:
          setup:
            - "Logical clock at 2027-04-01T00:00:00Z. One client with a 5000000-cent cap and one PENDING_APPROVAL service of 300000 cents."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Summit Ridge Partners", industry_code: "TECH", jurisdiction_country: "US", naf_annual_cap_cents: 5000000 }
              as: PlatformAdmin
              captures: { cli_sr: $.data.id, cli_sr_v: $.data.version }
            - call: "POST /audit/non-audit-services"
              payload: { client_id: "${cli_sr}", service_category: "TAX_ADVISORY", fee_cents: 300000 }
              as: AuditCommitteeLiaison
              captures: { svc_sr: $.data.id }
            - call: "POST /audit/non-audit-services/${svc_sr}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: AuditCommitteeLiaison
          trigger:
            - call: "POST /audit/non-audit-services/${svc_sr}/transitions"
              payload: { action: "APPROVE", committee_resolution_ref: "AC-2027-0401" }
              as: AuditCommitteeLiaison
            - call: "GET /audit/clients/${cli_sr}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit/non-audit-services/${svc_sr}/transitions"
              payload: { action: "REVOKE" }
              as: IndependenceOfficer
            - call: "GET /audit/clients/${cli_sr}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "before approval Client.${cli_sr}.naf_approved_fee_cents == 0"
            - "at the first read it is exactly 300000 (the whole-dollar-rounded fee of the single APPROVED service)"
            - "at the second read, after REVOKE, it is back to 0 — the compensating action restores the conserved quantity with no drift"
            - "the invariant sum(rounded_fee of services with status APPROVED) == Client.naf_approved_fee_cents holds at every step"
            - "NonAuditService.${svc_sr}.approved_fee_cents and approved_on are null again after REVOKE"

      - name: assignment_create_then_end_conserves_workload_points
        grounds:
          - calculations.assignment_workload_points
          - entities.Professional.fields.active_workload_points
          - entities.Engagement.fields.assigned_workload_points
        distinguishing_aspect: "The conserved quantity is workload points, a different unit from the fee pool: creating a 40-point LEAD_PARTNER assignment then ending it returns both Professional.active_workload_points and Engagement.assigned_workload_points to their pre-assignment values of 0."
        test_recipe:
          setup:
            - "Logical clock at 2027-05-01T00:00:00Z. One non-PIE client, one LOW-tier engagement, one PARTNER professional with no assignments, and no other workload on the engagement."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_l: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Granite Peak Mining", industry_code: "RETAIL", jurisdiction_country: "US", is_public_interest_entity: false }
              as: PlatformAdmin
              captures: { cli_gp: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Rafael Duarte", grade: "PARTNER", home_affiliate_id: "${aff_l}", rotation_role_class: "LEAD_PARTNER", max_workload_points: 100 }
              as: PlatformAdmin
              captures: { pro_rd: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_gp}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2027-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_gp: $.data.id, eng_gp_v: $.data.version }
            - call: "GET /audit/professionals/${pro_rd}"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_gp}", professional_id: "${pro_rd}", role: "LEAD_PARTNER", started_on: "2027-05-01T00:00:00Z", scheduled_end_on: "2028-05-01T00:00:00Z", expected_engagement_version: "${eng_gp_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_gp: $.data.id }
            - call: "GET /audit/professionals/${pro_rd}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /audit/role-assignments/${asg_gp}/end"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "GET /audit/professionals/${pro_rd}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /audit/engagements/${eng_gp}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
          assert:
            - "before the assignment Professional.${pro_rd}.active_workload_points == 0 and Engagement.${eng_gp}.assigned_workload_points == 0"
            - "while ACTIVE the assignment contributes exactly 40 points (round_half_up(40 * 1.0) on a LOW tier) to both totals"
            - "after POST /audit/role-assignments/${asg_gp}/end both totals are back to 0 — the create/end pair leaves no drift"
            - "Engagement.${eng_gp}.lead_partner_id is null again after the end, and EngagementRoleAssignment.${asg_gp}.workload_points still records the 40-point base"
            - "the two invariants conserve different quantities: 300000 cents in naf_approve_then_revoke_conserves_the_client_fee_pool versus 40 workload points here"
