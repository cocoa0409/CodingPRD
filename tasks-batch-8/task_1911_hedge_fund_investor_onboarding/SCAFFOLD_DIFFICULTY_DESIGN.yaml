  # =========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: kyc_reject_cascades_to_subscriptions_and_investor
        grounds:
          - state_machines.KycCase.IN_REVIEW_to_REJECTED
          - state_machines.Subscription.COMPLIANCE_APPROVED_to_REJECTED
        distinguishing_aspect: |
          Trigger = KycCase.reject (depth 3): KycCase.REJECTED →
          Investor.kyc_status=REJECTED → all non-terminal Subscriptions
          for that investor transition to REJECTED → each Subscription's
          aggregate_unfunded_commitment_cents recomputed on Investor.
        test_recipe:
          setup:
            - "Investor I with KycCase IN_REVIEW; two Subscriptions in {SUBMITTED, COMPLIANCE_APPROVED}"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
              as: FundAdmin
