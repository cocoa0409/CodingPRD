          setup:
            - "An ASSET_DEPLETION program with depletion_horizon_months 84 and min_reserves_months 6, a 45-year-old borrower with 100 percent ownership, and a fully-amortizing 30000000 loan in UNDERWRITING whose PITIA is 274764."
