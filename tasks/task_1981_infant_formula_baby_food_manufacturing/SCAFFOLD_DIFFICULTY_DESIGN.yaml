      - name: business_referential_vs_business_constraint_on_formula_submit
        grounds:
          - validations[priority=12]
          - validations[priority=14]
        distinguishing_aspect: |
          Conflict between business_constraint (priority 12, ERR_PERCENTAGE_SUM_INVALID)
          and business_referential (priority 14, ERR_PROFILE_NOT_APPROVED). When a formula
          has ingredient percentages summing to 99.999 (violating the sum check) AND
          references a DRAFT NutrientProfile (not APPROVED), the percentage error wins
          because priority 12 < priority 14.
        test_recipe:
          setup:
            - "A DRAFT NutrientProfile exists (not yet submitted or approved)."
            - "An Ingredient exists."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
