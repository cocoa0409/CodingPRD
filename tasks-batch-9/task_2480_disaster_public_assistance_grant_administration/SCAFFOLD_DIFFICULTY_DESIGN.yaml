          - entities.Disaster.fields.incident_end_at
          - entities.Disaster.fields.incident_type
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN occupation [incident_start_at,
          incident_end_at) on the resource key (state_code, incident_type), so a
          period starting exactly at an existing period's end is accepted while
          a period starting one instant inside it is rejected, and the same
          calendar window on a different incident_type is a different resource
          and is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Exactly one declaration DR-4921 (TX / FLOOD) occupying 2026-06-10T00:00:00Z through 2026-06-25T00:00:00Z."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4921", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 900000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_a_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4922", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-20T00:00:00Z", incident_end_at: "2026-07-05T00:00:00Z", population: 900000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4923", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-25T00:00:00Z", incident_end_at: "2026-07-10T00:00:00Z", population: 900000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_c_id: $.data.id }
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4924", state_code: "TX", incident_type: "WILDFIRE", incident_start_at: "2026-06-20T00:00:00Z", incident_end_at: "2026-07-05T00:00:00Z", population: 900000, federal_cost_share_pct: 0.75, small_project_threshold_cents: 4000000 }
              as: PlatformAdmin
              captures: { disaster_d_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_INCIDENT_PERIOD_OVERLAP"
            - "the second trigger call returns HTTP 201 and Disaster.${disaster_c_id}.incident_start_at == 2026-06-25T00:00:00Z (adjacency at the exclusive end instant is allowed)"
            - "the third trigger call returns HTTP 201 and Disaster.${disaster_d_id}.incident_type == WILDFIRE (a different incident_type is a different resource)"
            - "exactly three Disaster rows exist and none of them carries declaration_number DR-4922"

      - name: force_account_labor_rest_buffer_collision
        grounds:
          - validations[priority=25]
          - entities.CostLineItem.fields.work_start_at
          - entities.CostLineItem.fields.work_end_at
          - entities.ForceAccountResource.fields.resource_kind
        distinguishing_aspect: |
          Interval semantics: CLOSED occupation [work_start_at, work_end_at]
