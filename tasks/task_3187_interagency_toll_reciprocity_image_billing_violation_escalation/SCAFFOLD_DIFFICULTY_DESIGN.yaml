              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 202, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T06:00:00Z", effective_to: "2026-09-01T12:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 303, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T12:00:00Z", effective_to: "2026-09-01T18:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Kim Sweep", holder_email: "kim@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 100000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-W", vehicle_class: "CLASS_2", plate_number: "SWP101", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-W", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T03:00:00Z", is_peak: false, idempotency_key: "w1" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-W", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T09:00:00Z", is_peak: false, idempotency_key: "w2" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-W", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T15:00:00Z", is_peak: false, idempotency_key: "w3" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/settlement-files/generate"
              payload: { from_agency_id: "${home_id}", to_agency_id: "${away_id}" }
              as: SettlementOfficer
              captures: { sf1: "$.data.id" }
            - call: "POST /toll/settlement-files/generate"
              payload: { from_agency_id: "${home_id}", to_agency_id: "${away_id}" }
              as: SettlementOfficer
              captures: { sf2: "$.data.id" }
          assert:
            - "SettlementFile.${sf1}.gross_amount_cents == 606 and fee_amount_cents + net_amount_cents == gross_amount_cents (10 + 596 == 606)"
            - "all three transactions are SETTLED with settlement_file_id == ${sf1}"
            - "SettlementFile.${sf2}.line_count == 0 and gross_amount_cents == 0 and net_amount_cents == 0 (no double sweep)"
