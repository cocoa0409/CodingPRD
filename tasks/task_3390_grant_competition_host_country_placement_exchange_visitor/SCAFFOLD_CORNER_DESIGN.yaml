              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_APPLICATION"
            - "Application.${app_b}.status remains DRAFT; Application.${app}.status remains NATIONAL_SCREENING"

