scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fraud_score_provisional_vs_final
        grounds:
          - calculations.calc_fraud_score
          - state_machines.Visit.RECORDED_to_VERIFIED
        distinguishing_aspect: |
          Dual variant on the VISIT domain (fraud scoring): the provisional variant counts
          RECORDED+VERIFIED visits in the velocity window, the final variant counts VERIFIED
          only, so identical visit history yields 40 at creation and 30 at verify.
        test_recipe:
          setup:
            - "Employer, ACTIVE plan (INDIVIDUAL tier, freq cap 8), funded account, ACTIVE IN_NETWORK provider, ELIGIBLE member with ACTIVE enrollment"
            - "Five GEO_FENCE visits v1..v5 on 2026-05-02 08:00-13:00 (hourly, adjacent), one MANUAL_REVIEW visit v6 13:00-14:00"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 100000 }, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T08:00:00Z", check_out_at: "2026-05-02T09:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v1: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T09:00:00Z", check_out_at: "2026-05-02T10:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v2: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T10:00:00Z", check_out_at: "2026-05-02T11:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v3: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T11:00:00Z", check_out_at: "2026-05-02T12:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v4: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T12:00:00Z", check_out_at: "2026-05-02T13:00:00Z", verification_method: "GEO_FENCE" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v5: $.data.id } }
            - { call: "POST /api/visits", payload: { enrollment_id: "${enr_id}", member_id: "${m_id}", check_in_at: "2026-05-02T13:00:00Z", check_out_at: "2026-05-02T14:00:00Z", verification_method: "MANUAL_REVIEW" }, as: ProviderOperator, as_user_id: "${prov_id}", captures: { v6: $.data.id, v6_score_prov: $.data.fraud_score } }
            - { call: "POST /api/visits/${v1}/verify", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/visits/${v2}/verify", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/visits/${v3}/verify", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/visits/${v4}/reject", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/visits/${v5}/reject", payload: {}, as: ClaimsReviewer }
          trigger:
            - { call: "POST /api/visits/${v6}/verify", payload: {}, as: ClaimsReviewer, captures: { v6_final: $.data.fraud_score } }
          assert:
            - "Visit.${v6}.fraud_score at creation (provisional) == 40 (MANUAL_REVIEW 30 + velocity 1 extra x 10)"
            - "Visit.${v6}.fraud_score after verify (final) == 30 (VERIFIED-only velocity count 4 -> 0 extra)"
            - "Visit.${v6}.status == VERIFIED"
            - "provisional 40 != final 30"

      - name: statement_provisional_vs_final
        grounds:
          - calculations.calc_statement_totals
          - state_machines.Statement.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Dual variant on the STATEMENT domain (member fiscal reporting): provisional includes
          open claims at claimed value plus approved-unpaid at approved value, final counts PAID
          minus clawbacks only — same May 2026 data yields 6500 vs 3000.
        test_recipe:
          setup:
            - "Standard fixture: employer, ACTIVE plan (INDIVIDUAL 30000/10000/5000), funding 100000, ACTIVE IN_NETWORK provider, ELIGIBLE member, ACTIVE enrollment"
            - "Claim A: claimed 3000, APPROVED 3000, PAID on 2026-05; Claim B: claimed 2000, SUBMITTED; Claim C: claimed 1500, APPROVED 1500 UNPAID"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 100000 }, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-A", line_items: [ { description: "gym", unit_amount_cents: 3000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { cA: $.data.id } }
            - { call: "POST /api/claims/${cA}/start-review", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${cA}/approve", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${cA}/pay", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-03T10:00:00Z", receipt_ref: "R-B", line_items: [ { description: "yoga", unit_amount_cents: 2000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { cB: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-04T10:00:00Z", receipt_ref: "R-C", line_items: [ { description: "swim", unit_amount_cents: 1500, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { cC: $.data.id } }
            - { call: "POST /api/claims/${cC}/start-review", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${cC}/approve", payload: {}, as: ClaimsReviewer }
          trigger:
            - { call: "POST /api/statements", payload: { member_id: "${m_id}", period_yyyymm: "2026-05" }, as: BenefitsAdmin, captures: { st_id: $.data.id, st_prov: $.data.provisional_total_cents } }
            - { call: "POST /api/statements/${st_id}/finalize", payload: {}, as: BenefitsAdmin, captures: { st_final: $.data.finalized_total_cents } }
          assert:
            - "Statement.${st_id}.provisional_total_cents == 6500 (claimed B 2000 + approved C 1500 + paid A 3000)"
            - "Statement.${st_id}.finalized_total_cents == 3000 (PAID only)"
            - "Statement.${st_id}.claim_count == 3"
            - "provisional 6500 != final 3000"

  - rule_id: combinatorial_formula
    instances:
      - name: claim_payable_nested_min
        grounds:
          - calculations.calc_claim_payable
        distinguishing_aspect: |
          Mode (a) non-linear interaction: approved = min(coverage-adjusted claim, per-claim cap,
          annual window, quarterly window) — claim1 shows the per-claim cap binding (8000 -> 5000
          at 100% coverage), claim2 shows the coverage branch binding (6000 -> 4800 at 80%).
        test_recipe:
          setup:
            - "Standard fixture plus a second PREFERRED provider; member enrollment with 30000 annual / 10000 quarterly / 5000 per-claim"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 100000 }, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_in: $.data.id } }
            - { call: "POST /api/providers/${prov_in}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "StudioPref", modality: "STUDIO", network_tier: "PREFERRED", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 2000 }, as: BenefitsAdmin, captures: { prov_pref: $.data.id } }
            - { call: "POST /api/providers/${prov_pref}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-1", line_items: [ { description: "annual gym", unit_amount_cents: 8000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c1: $.data.id } }
            - { call: "POST /api/claims/${c1}/start-review", payload: {}, as: ClaimsReviewer }
          trigger:
            - { call: "POST /api/claims/${c1}/approve", payload: {}, as: ClaimsReviewer, captures: { c1_approved: $.data.approved_amount_cents } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "DIRECT_PAY", service_date: "2026-05-03T10:00:00Z", receipt_ref: "R-2", line_items: [ { description: "studio pack", unit_amount_cents: 6000, quantity: 1, tax_pct: 0.0 } ], member_id: "${m_id}" }, as: ProviderOperator, as_user_id: "${prov_pref}", captures: { c2: $.data.id } }
            - { call: "POST /api/claims/${c2}/start-review", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${c2}/approve", payload: {}, as: ClaimsReviewer, captures: { c2_approved: $.data.approved_amount_cents } }
          assert:
            - "Claim.${c1}.approved_amount_cents == 5000 (per_claim_cap binds over covered 8000)"
            - "Claim.${c2}.approved_amount_cents == 4800 (PREFERRED coverage 0.8 binds: round_half_up(6000*0.8)=4800 < cap 5000)"

      - name: claim_line_rounding_per_line_then_sum
        grounds:
          - calculations.calc_line_rounding
        distinguishing_aspect: |
          Mode (b) nested rounding order: three lines of 333 cents at 5% tax round per-line to
          350 each and sum to 1050; the forbidden sum-then-round order yields 1049 — a 1-cent
          divergence the scaffold pins to per-line-first.
        test_recipe:
          setup:
            - "Standard fixture; member with ACTIVE enrollment"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E1", full_name: "Mem One", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-TAX", line_items: [ { description: "a", unit_amount_cents: 333, quantity: 1, tax_pct: 0.05 }, { description: "b", unit_amount_cents: 333, quantity: 1, tax_pct: 0.05 }, { description: "c", unit_amount_cents: 333, quantity: 1, tax_pct: 0.05 } ] }, as: Member, as_user_id: "${m_id}", captures: { c_id: $.data.id, claimed: $.data.claimed_amount_cents } }
          assert:
            - "Claim.${c_id}.claimed_amount_cents == 1050 (350+350+350, per-line round_half_up; NOT 1049 sum-then-round)"

      - name: funding_reserved_evaluation_order
        grounds:
          - calculations.calc_funding_reconciliation
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: available_cents is
          derived from the ledger replay and the open-approvals sum BEFORE the new hold is
          attempted — account funded 10000 with a 4000 open approval leaves 6000, so a second
          approval computed at 7000 fails even though both claims are individually allowance-legal.
        test_recipe:
          setup:
            - "Employer2 with plan (INDIVIDUAL tier annual 30000, quarterly 20000, per-claim 8000), funding account with only 10000, ELIGIBLE member2 with enrollment"
            - "Claim1 claimed 4000, APPROVED 4000 UNPAID (funding hold 4000, available 6000)"
            - "Claim2 claimed 7000, UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "BETA", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Beta", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 20000, per_claim_cap_cents: 8000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/funding-accounts", payload: { employer_id: "${emp_id}", benefit_year: 2026, initial_deposit_cents: 10000 }, as: BenefitsAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /api/providers", payload: { name: "GymIn", modality: "GYM", network_tier: "IN_NETWORK", contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-12-31T23:59:59Z", visit_rate_cents: 1500 }, as: BenefitsAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /api/providers/${prov_id}/activate", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/members", payload: { employer_id: "${emp_id}", plan_id: "${plan_id}", external_ref: "E9", full_name: "Mem Nine", tier_code: "INDIVIDUAL", hire_date: "2026-03-01T00:00:00Z" }, as: BenefitsAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-1", line_items: [ { description: "gym", unit_amount_cents: 4000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c1: $.data.id } }
            - { call: "POST /api/claims/${c1}/start-review", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${c1}/approve", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-03T10:00:00Z", receipt_ref: "R-2", line_items: [ { description: "gym2", unit_amount_cents: 7000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c2: $.data.id } }
            - { call: "POST /api/claims/${c2}/start-review", payload: {}, as: ClaimsReviewer }
          trigger:
            - { call: "POST /api/claims/${c2}/approve", payload: {}, as: ClaimsReviewer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FUNDING_INSUFFICIENT (available 6000 < approved 7000)"
            - "Claim.${c2}.review_status remains UNDER_REVIEW"
            - "FundingAccount.${fund_id}.available_cents == 6000 and reserved_cents == 4000"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_review_cycle_resubmission_cap
        grounds:
          - state_machines.Claim.NEEDS_INFO_to_UNDER_REVIEW
          - validations[priority=7]
        distinguishing_aspect: |
          Cyclic machine on Claim (review axis): UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW loops
          exactly 3 times; the 4th resubmit is rejected by the cycle counter.
        test_recipe:
          setup:
            - "Standard fixture; claim SUBMITTED then UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/employers", payload: { name: "ACME", funding_model: "PREFUNDED" }, as: BenefitsAdmin, captures: { emp_id: $.data.id } }
            - { call: "POST /api/benefit-plans", payload: { employer_id: "${emp_id}", name: "2026 Standard", benefit_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: BenefitsAdmin, captures: { plan_id: $.data.id, plan_v: $.data.version } }
            - { call: "PUT /api/benefit-plans/${plan_id}/tiers", payload: { tiers: [ { tier_code: "INDIVIDUAL", annual_allowance_cents: 30000, quarterly_cap_cents: 10000, per_claim_cap_cents: 5000, visit_frequency_cap: 8, dependent_cap_pct: 0.25, in_network_pct: 1.0, preferred_pct: 0.8, out_of_network_pct: 0.5 } ], expected_plan_version: "${plan_v}" }, as: BenefitsAdmin }
            - { call: "POST /api/benefit-plans/${plan_id}/activate", payload: {}, as: BenefitsAdmin }
