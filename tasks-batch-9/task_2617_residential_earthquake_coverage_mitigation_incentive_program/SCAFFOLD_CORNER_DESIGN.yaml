            - "${off_status} == \"ACCEPTED\" - respond is Policyholder-exclusive and succeeds for the offeree"
            - "${pol_status} == \"IN_FORCE\" - bind is ParticipatingInsurer-exclusive and succeeds for the writing insurer"
            - "${ev_status} == \"DECLARED\" - declare is ProgramAdmin-exclusive"
            - "the FNOL is accepted from the Policyholder role (a shared operation) while ${cl_status} == \"PROVISIONAL_ADJUSTED\" and ${cl_prov_user} == \"adj-1\" comes from the ClaimAdjuster-exclusive call"

      - name: mitigation_side_roles_each_perform_their_own_exclusive_operations
        claim_type: role_permitted_operations
        grounds:
          - roles.GrantReviewer
          - roles.FieldInspector
          - roles.CertifiedContractor
          - roles.ProgramAdmin
        distinguishing_aspect: "Every exclusive operation on the mitigation side is accepted for its own role: GrantReviewer alone decides the award, ProgramAdmin alone commits cycle money and certifies contractors, CertifiedContractor alone requests the inspection, and FieldInspector alone records the result."
        test_recipe:
          setup:
            - "An OPEN 2026 cycle with a 1,000,000-cent pool and a TIER_LOW applicant whose 200,000-cent cripple-wall scope is fully matched"
          setup_api_calls:
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Mira Sandal", email: "mira@example.com", county_code: "06013" }
              as: ProgramAdmin
