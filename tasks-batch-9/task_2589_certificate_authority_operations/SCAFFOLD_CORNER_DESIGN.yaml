      - name: incident_state_and_scope_errors_around_one_open_incident
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_SCOPE_WINDOW]
          - errors[ERR_SCOPE_METHOD_NOT_IN_PROFILE]
          - errors[ERR_INCIDENT_NOT_CLOSEABLE]
          - errors[ERR_INCIDENT_NOT_DISCLOSED]
          - errors[ERR_INCIDENT_NOT_OPEN]
          - validations[priority=96]
          - validations[priority=101]
          - validations[priority=52]
          - validations[priority=51]
          - validations[priority=50]
        distinguishing_aspect: "An OPEN incident is neither closeable nor mass-revocable nor escalatable: the three state gates return three different ids for the same state, and ERR_INCIDENT_NOT_CLOSEABLE is raised ahead of the outstanding-revocation check at priority 113. Scope validation rejects a zero-length window (scope_issued_to must be STRICTLY after scope_issued_from) and a scope_dcv_method the scoped profile does not allow."
        test_recipe:
          setup:
            - "One DNS_TXT-only profile and one OPEN incident scoped to it, discovered at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
