              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "August water drop", piece_type: "POSTCARD", drop_date: "2026-08-25", requested_quantity: 1000 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "First submission." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { rev_after_first: $.data.revision_count }
            - call: "POST /campaigns/${campaign_id}/decision"
              payload: { decision: "REJECT", decision_note: "Logo placement wrong." }
              as: PartnerBrandReviewer
              as_user_id: "${partner_id}"
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "Reworked logo." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { rev_after_second: $.data.revision_count }
            - call: "POST /campaigns/${campaign_id}/decision"
              payload: { decision: "REJECT", decision_note: "Disclaimer font too small." }
              as: PartnerBrandReviewer
              as_user_id: "${partner_id}"
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "Bigger disclaimer." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { rev_after_third: $.data.revision_count }
            - call: "POST /campaigns/${campaign_id}/decision"
              payload: { decision: "REJECT", decision_note: "Still not acceptable." }
              as: PartnerBrandReviewer
              as_user_id: "${partner_id}"
              captures: { rejected_status: $.data.status, campaign_v6: $.data.version }
          trigger:
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "Fourth attempt." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { e_id: $.data.error_id }
          assert:
            - "${rev_after_first} == 0  # the first submission comes from DRAFT and is not a revision"
            - "${rev_after_second} == 1 and ${rev_after_third} == 2"
            - "${rejected_status} == REJECTED and ${campaign_v6} == 6  # create 1 plus six accepted writes"
            - "${e_id} == ERR_REVISION_LIMIT_REACHED with HTTP 409  # revision_count 2 >= MAX_CAMPAIGN_REVISIONS 2"
            - "GET /campaigns/${campaign_id} still reports status REJECTED with revision_count 2 and version 6"

      - name: err_invalid_complaint_state_on_escalating_a_live_complaint
        claim_type: violation_to_error
        grounds:
          - validations.complaint-state-precondition
          - state_machines.RegulatorComplaint
          - endpoints.POST /regulator-complaints/{complaintId}/escalation
          - errors[ERR_INVALID_COMPLAINT_STATE]
        distinguishing_aspect: "Escalation is only defined from CLOSED_UNSUBSTANTIATED: it is refused on an OPEN complaint and refused again after a SUBSTANTIATED closure, which is the arm a naive 'any closed complaint may be escalated' implementation gets wrong."
        test_recipe:
          setup:
            - "One partner with two OPEN PUC complaints; complaint B is then closed as CLOSED_SUBSTANTIATED with remedy_type APOLOGY_ONLY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id }
            - call: "POST /regulator-complaints"
              payload: { partner_id: "${partner_id}", regulator: "PUC", allegation: "Mailer implies the utility endorses the product." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { complaint_a: $.data.id, complaint_a_v1: $.data.version, a_due: $.data.response_due_at, a_status: $.data.status }
            - call: "POST /regulator-complaints"
              payload: { partner_id: "${partner_id}", regulator: "PUC", allegation: "Second, unrelated allegation." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { complaint_b: $.data.id, complaint_b_v1: $.data.version }
            - call: "POST /regulator-complaints/${complaint_b}/response"
              payload: { response_summary: "Wording corrected and apology sent.", disposition: "SUBSTANTIATED", remedy_type: "APOLOGY_ONLY", expected_complaint_version: "${complaint_b_v1}" }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { b_status: $.data.status, b_version: $.data.version }
          trigger:
            - call: "POST /regulator-complaints/${complaint_a}/escalation"
              payload: { escalation_note: "Escalating a complaint that is still open." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { e_open: $.data.error_id }
            - call: "POST /regulator-complaints/${complaint_b}/escalation"
              payload: { escalation_note: "Escalating a substantiated closure." }
              as: RegulatoryAffairs
              as_user_id: "reg-001"
              captures: { e_substantiated: $.data.error_id }
          assert:
            - "${a_status} == OPEN and ${a_due} == 2026-08-11T00:00:00.000Z  # RESPONSE_DAYS[PUC] == 10 from received_at, no cited claim so no expedited floor"
            - "${b_status} == CLOSED_SUBSTANTIATED and ${b_version} == 2"
            - "${e_open} == ERR_INVALID_COMPLAINT_STATE with HTTP 409"
            - "${e_substantiated} == ERR_INVALID_COMPLAINT_STATE with HTTP 409"
            - "GET /regulator-complaints/${complaint_a} still reports status OPEN, escalation_count 0 and version ${complaint_a_v1}"
            - "GET /regulator-complaints/${complaint_b} still reports escalation_count 0, remedy_type APOLOGY_ONLY and version 2"

