          - entities.Quote.fields.monthly_recurring_cents
          - entities.Quote.fields.panel_unit_count
        distinguishing_aspect: |
          Because the footage tier is a FLAT rate on the whole run, one extra foot
          across a band edge makes the monthly rent DROP: 250 ft prices at 62 for
          15500 while 251 ft prices at 54 for 13554, and 500 ft prices at 54 for
          27000 while 501 ft prices at 47 for 23547. A marginal/blended tier
          implementation produces a monotonically rising 250 -> 251 and
