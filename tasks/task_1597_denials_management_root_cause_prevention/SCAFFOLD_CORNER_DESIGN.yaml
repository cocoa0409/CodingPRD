              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/department-scorecards"
              payload: { department: "CODING", period_start_date: "2026-08-01", period_end_date: "2026-12-31" }
              as: RevenueCycleDirector
              captures: { sc: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2401", patient_account_number: "PA-2401", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
            - call: "POST /rcm/department-scorecards/${sc}/finalize"
              payload: {}
              as: RevenueCycleDirector
              captures: { sc_status: $.data.status }
          trigger:
            - call: "POST /rcm/department-scorecards/${sc}/finalize"
              payload: {}
              as: RevenueCycleDirector
              captures: { err: $.data.error_id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2402", patient_account_number: "PA-2402", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-12", remittance_received_date: "2026-08-02" }
              as: DenialsSpecialist
              captures: { d2: $.data.id }
            - call: "POST /rcm/denial-cases/${d2}/triage"
              payload: { preventable_flag: true }
              as: DenialsSpecialist
            - call: "GET /rcm/department-scorecards/${sc}"
              payload: {}
              as: DenialsManager
              captures: { sc_count: $.data.denial_count, sc_prev: $.data.preventable_denial_count }
          assert:
            - "first finalize: status == FINALIZED"
            - "second finalize: error_id == ERR_SCORECARD_NOT_OPEN"
            - "after the post-finalize triage: denial_count still == 1 and preventable_denial_count still == 0 (counters frozen)"

