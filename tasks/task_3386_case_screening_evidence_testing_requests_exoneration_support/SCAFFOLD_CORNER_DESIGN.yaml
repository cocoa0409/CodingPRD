            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - call: "GET /cases/${case_id}"
              as: StaffAttorney
              captures: { case_v: $.data.version }
          trigger:
            - call: "PUT /cases/${case_id}"
              payload: { expected_case_version: "${case_v}", strategy_notes: "Pursue DNA first" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { v2: $.data.version }
            - call: "PUT /cases/${case_id}"
              payload: { expected_case_version: "${case_v}", strategy_notes: "Stale rewrite" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { err: $.data.error_id }
            - call: "GET /cases/${case_id}"
              as: StaffAttorney
              captures: { notes: $.data.strategy_notes }
          assert:
            - "first PUT: 200, version == 2 (== captured + 1)"
            - "second PUT with the stale expected version: 412 ERR_STALE_VERSION"
            - "strategy_notes remain 'Pursue DNA first' (the stale write did not land)"

      - name: stale_authorization_version_and_motion_amendment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "concurrency_rules[agreement-amend-stale-version]"
          - "endpoints.POST_/testing-authorizations/{id}/amendments"
        distinguishing_aspect: "OCC layer on the second parent: an amendment with the pre-amendment version fails 412 ERR_STALE_AUTHORIZATION_VERSION after a successful amendment bumped the version; and the amendments endpoint refuses a kind=MOTION authorization outright (409 ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Case INVESTIGATION with a CUSTODY_CONFIRMED item; one AGREEMENT (DRAFTED, version 1) and one MOTION (DRAFTED) authorization on it."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "MD", name: "Maryland", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Vic Han", inmate_number: "MD-6" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2018-01-01T00:00:00Z", conviction_summary: "OCC amendment probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "CONFIRMED_STORED", years_served: 8, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - { call: "POST /cases/${case_id}/advance", payload: { event: "BEGIN_INVESTIGATION" }, as: StaffAttorney, as_user_id: "atty_1" }
            - call: "POST /evidence-items"
              payload: { case_id: "${case_id}", description: "Swab", evidence_type: "BIOLOGICAL_SWAB", custodian_type: "CRIME_LAB", initial_sample_ng: 15 }
              as: EvidenceAnalyst
              captures: { item_id: $.data.id }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "START_SEARCH" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "MARK_LOCATED" }, as: EvidenceAnalyst }
            - { call: "POST /evidence-items/${item_id}/advance", payload: { event: "CONFIRM_CUSTODY" }, as: EvidenceAnalyst }
            - call: "POST /testing-authorizations"
              payload: { case_id: "${case_id}", evidence_item_id: "${item_id}", kind: "AGREEMENT", terms: "v1 terms" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { ta_id: $.data.id, ta_v: $.data.version }
            - call: "POST /testing-authorizations"
              payload: { case_id: "${case_id}", evidence_item_id: "${item_id}", kind: "MOTION" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { mot_id: $.data.id, mot_v: $.data.version }
          trigger:
            - call: "POST /testing-authorizations/${ta_id}/amendments"
              payload: { expected_testing_authorization_version: "${ta_v}", terms: "v2 terms: split costs" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { v2: $.data.version, terms2: $.data.terms }
            - call: "POST /testing-authorizations/${ta_id}/amendments"
              payload: { expected_testing_authorization_version: "${ta_v}", terms: "stale v3 attempt" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { err: $.data.error_id }
            - call: "POST /testing-authorizations/${mot_id}/amendments"
              payload: { expected_testing_authorization_version: "${mot_v}", terms: "motions are not amendable" }
              as: StaffAttorney
              as_user_id: "atty_1"
              captures: { err2: $.data.error_id }
          assert:
            - "first amendment: 200, version == ta_v + 1, terms == 'v2 terms: split costs'"
            - "second amendment reusing the original version: 412 ERR_STALE_AUTHORIZATION_VERSION"
            - "amendment on the MOTION: 409 ERR_INVALID_STATE (amendments exist only on the AGREEMENT lifecycle)"

      - name: layer_ops_run_checkpoint_covered
        claim_type: Ops-run checkpoint
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: contact_overdue_strict_greater_boundary_and_sweep_report
          rationale: "The sweep's epoch semantics, strict-greater boundary, and newly-overdue reporting are asserted in that §1.9 calculations instance."
      - name: layer_cascading_side_effects_covered
        claim_type: Cascading side effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: records_response_destroyed_cascade_reaches_policy_count
          rationale: "The 3-link cascade (records -> item -> case -> initiative) is asserted link-by-link in that §1.8 instance."
      - name: layer_conditional_feature_flags_covered
        claim_type: Conditional feature flags
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: clemency_petition_requires_jurisdiction_flag
          rationale: "Jurisdiction-flag-conditional behavior is asserted by the clemency, testing-statute, and compensation-statute §1.9 validations instances; this stub points at one representative."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_reflects_every_mutation
        claim_type: Immediate consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Immediate consistency: a write's effects are visible in the very next read issued after the write completes — no lag, no staleness window (jurisdiction fields, case strategy fields, and version all reflect the last committed write)."
        test_recipe:
          setup: ["Jurisdiction and an accepted case exist; case strategy_notes set via PUT."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "NJ", name: "New Jersey", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Wim Bek", inmate_number: "NJ-2" }
              as: IntakeSpecialist
              captures: { cl: $.data.id }
            - call: "POST /intake-requests"
              payload: { client_id: "${cl}", jurisdiction_id: "${jur_id}", conviction_date: "2019-01-01T00:00:00Z", conviction_summary: "Consistency probe", claim_of_actual_innocence: true, claim_strength: "STRONG", evidence_potential: "LIKELY_STORED", years_served: 7, health_urgency: "NONE" }
              as: IntakeSpecialist
              captures: { r_id: $.data.id }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "BEGIN_SCREENING" }, as: IntakeSpecialist }
            - { call: "POST /intake-requests/${r_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${r_id}/decide"
              payload: { decision: "ACCEPTED", assigned_attorney_id: "atty_1" }
              as: ManagingAttorney
              as_user_id: "ma_1"
              captures: { case_id: $.data.accepted_case_id }
            - call: "GET /cases/${case_id}"
              as: StaffAttorney
              captures: { case_v: $.data.version }
            - call: "PUT /cases/${case_id}"
              payload: { expected_case_version: "${case_v}", strategy_notes: "Immediate-read probe", theory_of_case: "Mistaken identity" }
              as: StaffAttorney
              as_user_id: "atty_1"
          trigger:
            - call: "GET /jurisdictions/${jur_id}"
              as: StaffAttorney
              captures: { jname: $.data.name }
            - call: "GET /cases/${case_id}"
              as: StaffAttorney
              captures: { notes: $.data.strategy_notes, toc: $.data.theory_of_case, ver: $.data.version }
          assert:
            - "GET jurisdiction reflects the create exactly (name == 'New Jersey')"
            - "GET case reflects the PUT exactly: strategy_notes == 'Immediate-read probe', theory_of_case == 'Mistaken identity', version == captured + 1"
            - "updated_at >= created_at on the case (mutations refresh the timestamp)"
