      - name: nested_unit_list_is_scoped_to_its_parent_property
        claim_type: cross_reference_link
        grounds: [endpoints.GET_properties_id_units, complexity_profile.entity_topology, errors.ERR_PROPERTY_NOT_FOUND]
        distinguishing_aspect: "The nested reverse-reachability route must filter on Unit.property_id rather than returning the global unit table, must combine that scoping with its own status filter and pagination, and must 404 on an unknown parent instead of returning an empty page."
        test_recipe:
          setup:
            - "Two properties exist. Cedar Ridge holds three units, Birch Court holds one."
            - "The unknown parent id 00000000-0000-4000-8000-000000000000 matches no Property row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_a_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Birch Court", state_code: "TX", billing_mode: "RESIDENT_BILLED", benefit_tier: "BASIC", damage_waiver_enabled: false, aqg_enabled: false, credit_limit_cents: 100000 }
              as: ProgramOperator
              captures: { prop_b_id: "$.data.id" }
            - call: "POST /properties/${prop_a_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a1_id: "$.data.id" }
            - call: "POST /properties/${prop_a_id}/units"
              payload: { unit_label: "A-201", hvac_system_type: "SINGLE_STAGE", filter_slot_count: 1, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a2_id: "$.data.id" }
            - call: "POST /properties/${prop_a_id}/units"
              payload: { unit_label: "A-301", hvac_system_type: "HEAT_PUMP", filter_slot_count: 1, return_grille_count: 2, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a3_id: "$.data.id" }
            - call: "POST /properties/${prop_b_id}/units"
              payload: { unit_label: "B-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "20x25x1" }
              as: ProgramOperator
              captures: { unit_b1_id: "$.data.id" }
          trigger:
            - call: "GET /properties/${prop_a_id}/units"
              payload: {}
              as: ProgramOperator
              captures: { a_first_id: "$.data[0].id" }
            - call: "GET /properties/${prop_b_id}/units"
              payload: {}
              as: ProgramOperator
              captures: { b_first_id: "$.data[0].id" }
            - call: "GET /properties/${prop_a_id}/units"
              payload: { status: "OUT_OF_SERVICE" }
              as: ProgramOperator
            - call: "GET /properties/${prop_a_id}/units"
              payload: { limit: 2, offset: 0 }
              as: ProgramOperator
            - call: "GET /properties/00000000-0000-4000-8000-000000000000/units"
              payload: {}
              as: ProgramOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "GET /properties/${prop_a_id}/units returns total_count == 3 and its ids are exactly the set of ${unit_a1_id}, ${unit_a2_id} and ${unit_a3_id} — ${unit_b1_id} is absent"
            - "GET /properties/${prop_b_id}/units returns total_count == 1 and ${b_first_id} == ${unit_b1_id}"
            - "Property.${prop_a_id}.unit_count == 3 and Property.${prop_b_id}.unit_count == 1, matching the two list totals"
            - "the status == OUT_OF_SERVICE filter returns HTTP 200 with an empty data array and total_count == 0 while the parent scoping still applies"
            - "limit 2 with offset 0 returns 2 rows with total_count == 3 and has_more == true, so the filter and the parent scope compose with pagination"
            - "the unknown parent returns HTTP 404 with data.error_id == ERR_PROPERTY_NOT_FOUND rather than an empty page"

