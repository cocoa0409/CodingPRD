              payload: { photo_urls: [], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RESIDENT_SIGNOFF_REQUIRED (business_safety, priority 18) — NOT ERR_COMPLETION_PHOTOS_REQUIRED (business_constraint, priority 19), although photo_urls is also empty"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics, different endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: purchase_threshold_exact_boundary
        grounds:
          - calculations.purchase_request_total
          - validations[priority=5]
          - entities.Property.fields.purchase_auto_approve_threshold_cents
        distinguishing_aspect: |
          Metric: money in cents on POST /work-orders/{id}/purchase-requests.
          estimated_total_cents == threshold (40880 <= 40880) auto-APPROVES;
          threshold + 1 cent (40881) goes PENDING.
        test_recipe:
          setup:
            - "Property with purchase_auto_approve_threshold_cents = 40880; work order IN_PROGRESS assigned to technician; part exists"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Threshold Property", purchase_auto_approve_threshold_cents: 40880 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "111", full_name: "R Eleven", email: "r11@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "VLV-9", name: "Valve", unit_cost_cents: 12000, reorder_level: 0, initial_stock: 0 }
              as: PropertyManager
              captures: { part_id: $.data.id }
