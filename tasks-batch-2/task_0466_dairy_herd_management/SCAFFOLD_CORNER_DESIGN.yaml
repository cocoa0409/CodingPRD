              payload: { expected_milk_check_version: "${mc_v}" }
              as: CoopSettlementAgent
          assert:
            - "response.status == 200"
            - "MilkCheck.${mc_id}.status == CANCELLED"
            - "MilkCheck.${mc_id}.version == 2"

      - name: error_finalize_already_finalized_milkcheck
        claim_type: Invalid Transitions
        grounds:
          - errors[ERR_MILK_CHECK_NOT_PROVISIONAL]
        excluded_because:
          difficulty_instance: "transitive_cascade / milk_check_finalize_cascade_stamp_then_quality_depth2"
          rationale: "The PROVISIONAL->FINALIZED valid transition is exercised by that §1.8 instance; the not-provisional rejection is its direct complement and would duplicate the same setup chain."

