              payload: { notice_code: "SHORT-44", change_type: "BENEFIT_REMOVAL", effective_at: "2026-09-14T00:00:00Z", grandfather_window_days: 0, cohort_enrolled_before: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pn_short_id: $.data.id }
            - call: "POST /rewards/change-notices/${pn_short_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/change-notices"
              payload: { notice_code: "EXACT-45", change_type: "BENEFIT_REMOVAL", effective_at: "2026-09-15T00:00:00Z", grandfather_window_days: 0, cohort_enrolled_before: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pn_exact_id: $.data.id }
            - call: "POST /rewards/change-notices/${pn_exact_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /rewards/change-notices/${pn_short_id}/announce"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "POST /rewards/change-notices/${pn_exact_id}/announce"
              as: ProgramApprover
              as_user_id: "approver-1"
          assert:
            - "the 44-day announce returns 422 with error_id ERR_NOTICE_PERIOD_TOO_SHORT"
            - "ProgramChangeNotice.${pn_short_id}.status == PENDING_APPROVAL and announced_at == null"
            - "the 45-day announce returns 200"
            - "ProgramChangeNotice.${pn_exact_id}.status == ANNOUNCED and announced_at == 2026-08-01T00:00:00Z"
            - "ProgramChangeNotice.${pn_exact_id}.approved_by_user_id == approver-1"

