      - name: tier_threshold_estimated_value_exactly_1m_is_high_value
        grounds:
          - calculations.tier_determination
          - calculations.fee_quote
        distinguishing_aspect: |
          Metric: estimated_value_cents threshold on determine-scope. The rule
          is >= 100000000: an estimate of exactly 100000000 yields HIGH_VALUE
          (retail fallback fee 85000 with no HIGH_VALUE schedule on file),
          while 99999999 on an identical SFR order yields STANDARD (panel
          fee 45000).
        test_recipe:
          setup:
            - "Client with only a STANDARD schedule (base 45000); two SFR CONVENTIONAL orders differing only in estimated_value_cents"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "AMC Fourteen", client_type: AMC, contact_email: "ops@amc14.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "Edge Case 1", property_type: SFR, estimated_value_cents: 100000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_hi: $.data.id }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "Edge Case 2", property_type: SFR, estimated_value_cents: 99999999, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_lo: $.data.id }
          trigger:
            - call: "POST /appraisal/orders/${o_hi}/determine-scope"
              payload: {}
              as: FirmAdmin
              captures: { hi_tier: $.data.complexity_tier, hi_fee: $.data.fee_quoted_cents }
            - call: "POST /appraisal/orders/${o_lo}/determine-scope"
              payload: {}
              as: FirmAdmin
              captures: { lo_tier: $.data.complexity_tier, lo_fee: $.data.fee_quoted_cents }
          assert:
            - "est == 100000000 -> complexity_tier HIGH_VALUE, fee_quoted_cents == 85000 (retail fallback, no HIGH_VALUE schedule; captured ${hi_tier}/${hi_fee})"
            - "est == 99999999 -> complexity_tier STANDARD, fee_quoted_cents == 45000 (panel schedule; captured ${lo_tier}/${lo_fee})"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_create_gated_by_locked_comparable_count
        grounds:
          - state_machines.Report
          - state_machines.Comparable.VERIFIED_to_LOCKED
          - calculations.value_conclusion
          - errors[ERR_INSUFFICIENT_LOCKED_COMPS]
        distinguishing_aspect: |
          Entity pair Report <- Comparable: report creation is legal only when
          the ORDER's comparable set has >= 3 rows in LOCKED with is_eligible —
          with exactly 2 locked it fails ERR_INSUFFICIENT_LOCKED_COMPS; locking
          the third flips the same endpoint to success with the weighted value
          45000000 computed from the comp triple.
        test_recipe:
          setup:
            - "Desktop STANDARD order in IN_ANALYSIS; exactly two eligible comps verified+locked, a third verified but not yet locked"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
