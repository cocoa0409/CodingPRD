      - name: a_request_without_role_headers_is_unauthenticated
        claim_type: unauthenticated
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope
        distinguishing_aspect: |
          The very first write against an empty database returns 401 ERR_UNAUTHENTICATED when the
          X-User-Role and X-User-ID headers are absent, and 401 again for a role string outside the
          eight declared roles, before any state profile exists.
        test_recipe:
          setup:
            - "The database is empty and the logical clock sits at its default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /state-profiles"
              payload: { state_code: "AK", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: "(no X-User-Role and no X-User-ID header sent)"
              captures: { err_missing: $.data.error_id }
            - call: "POST /state-profiles"
              payload: { state_code: "AK", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: "(X-User-Role: SuperUser, a role outside the eight declared roles)"
              captures: { err_unknown_role: $.data.error_id }
            - call: "POST /state-profiles"
              payload: { state_code: "AK", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_ak_id: $.data.id }
          assert:
            - "the first call returns HTTP status 401 and err_missing == ERR_UNAUTHENTICATED"
            - "the second call returns HTTP status 401 and err_unknown_role == ERR_UNAUTHENTICATED"
            - "the third call returns HTTP status 201 and st_ak_id is a non-null UUID"
            - "GET /state-profiles/${st_ak_id} returns state_code AK"

      - name: the_same_user_cannot_review_the_content_edit_it_proposed
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=32]
          - roles[PublisherEditor].note
        distinguishing_aspect: |
          User u-7 proposing an edit as PublisherEditor and then reviewing it as EditorialDirector is
          refused with 403 ERR_SEGREGATION_OF_DUTIES on X-User-ID identity alone, even though the
          reviewing role is correct; a different director approves the same edit.
        test_recipe:
          setup:
            - "State IN is OPEN_TERRITORY with min_verified_coverage_pct 50.00"
            - "Title IN-S-7 is ACTIVE at 300 pages with signature_page_capacity 384"
            - "A PROPOSED ADD_REQUIRED_TOPIC edit was created by X-User-ID u-7"
