              captures: { claim: $.data.id, claim_v: $.data.version }
          trigger:
            - call: "POST /claims/${claim}/deny"
              payload: { denial_reason: "COVERAGE", expected_claim_version: "${claim_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "Before deny (captured mid-setup by a prior GET): retained_claims_reserved_cents was 15000 and giveback_projected_cents was 28750"
            - "After deny: Cohort.${cohort_id}.retained_claims_reserved_cents == 0 (exactly the pre-escalation value)"
            - "After deny: Cohort.${cohort_id}.giveback_projected_cents == 43750 (exactly the pre-escalation value — no drift)"
            - "Claim.${claim}.reserve_cents is null and status == DENIED"
            - "Policyholder.${ph}.fraud_strike_count == 0 (COVERAGE denial carries no strike)"

      - name: giveback_allocation_conserves_total_donated_equals_pot
        grounds:
          - calculations.giveback_allocation
        distinguishing_aspect: |
          THIRD distinct conserved quantity — donation mass: the giveback run's
          per-cause allocations MUST sum to exactly giveback_actual_cents, and
          per-policy allocations (including largest-remainder cents) MUST sum to
