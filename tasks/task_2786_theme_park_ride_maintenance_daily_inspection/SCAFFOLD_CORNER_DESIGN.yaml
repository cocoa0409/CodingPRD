        distinguishing_aspect: "X-User-ID, not the role, is the identity that matters: the same person u-dual records the line as MaintenanceTechnician and is then refused sign-off as QualifiedInspector with 403 ERR_SEGREGATION_OF_DUTIES, while a different QualifiedInspector signs the identical inspection successfully."
