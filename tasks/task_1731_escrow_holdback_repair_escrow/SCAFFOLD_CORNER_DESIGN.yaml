        distinguishing_aspect: "After a first amend advances version 1 -> 2, a second amend carrying the stale observed version is rejected 412 ERR_STALE_VERSION; the first amend proves version increments exactly by 1."
        test_recipe:
          setup: ["DRAFT holdback; one successful amend already applied"]
          setup_api_calls:
            - { call: "POST /escrow/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EscrowOfficer }
