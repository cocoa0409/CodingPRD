            - { call: "POST /api/installation-tasks", payload: { window_id: "${w1_id}", room_id: "${r_id}", po_line_id: "${l_id}", quantity: 1 }, as: InstallationManager }
            - { call: "POST /api/installation-windows/${w1_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager }
          trigger:
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 4, start_date: "2026-07-15", end_date: "2026-07-20", crew_count: 1 }, as: InstallationManager, captures: { w2_id: $.data.id } }
            - { call: "POST /api/installation-tasks", payload: { window_id: "${w2_id}", room_id: "${r_id}", po_line_id: "${l_id}", quantity: 1 }, as: InstallationManager }
            - { call: "POST /api/installation-windows/${w2_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager, captures: { w2_status: $.data.status } }
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 4, start_date: "2026-07-14", end_date: "2026-07-16", crew_count: 1 }, as: InstallationManager, captures: { w3_id: $.data.id } }
            - { call: "POST /api/installation-tasks", payload: { window_id: "${w3_id}", room_id: "${r_id}", po_line_id: "${l_id}", quantity: 1 }, as: InstallationManager }
            - { call: "POST /api/installation-windows/${w3_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager, captures: { err: $.data.error_id } }
          assert:
            - "W2 [2026-07-15, 2026-07-20) touches W1 at the boundary day and releases successfully: status == RELEASED (half-open adjacency allowed)"
            - "W3 [2026-07-14, 2026-07-16) intersects W1 by one day: release rejected 409 with error_id == ERR_ROOM_WINDOW_OVERLAP"
            - "InstallationWindow.${w3_id}.status remains PLANNED"

      - name: floor_crew_capacity_equality_allowed
        grounds:
          - state_machines.InstallationWindow.PLANNED_to_RELEASED
          - errors[ERR_FLOOR_CREW_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity on the (project, floor_number) crew pool per calendar
          day — overlapping windows may coexist until the SUM of crew_count strictly exceeds
          default_crew_capacity_per_floor_day (8); a sum of exactly 8 is allowed, 9 rejected. Resource
          is the floor crew pool, not a Room, and overlap is permitted up to capacity — a different
          semantic than the sibling's half-open adjacency rule.
        test_recipe:
          setup:
            - "Project in PROCUREMENT with default_crew_capacity_per_floor_day 8"
            - "W1 floor 3 [2026-08-10, 2026-08-15) crew 5 RELEASED; W2 floor 3 same dates crew 2 RELEASED (running sum 7)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-TO2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 0, default_crew_capacity_per_floor_day: 8 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 1000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 3, start_date: "2026-08-10", end_date: "2026-08-15", crew_count: 5 }, as: InstallationManager, captures: { w1_id: $.data.id } }
            - { call: "POST /api/installation-windows/${w1_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager }
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 3, start_date: "2026-08-10", end_date: "2026-08-15", crew_count: 2 }, as: InstallationManager, captures: { w2_id: $.data.id } }
            - { call: "POST /api/installation-windows/${w2_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager }
          trigger:
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 3, start_date: "2026-08-12", end_date: "2026-08-13", crew_count: 1 }, as: InstallationManager, captures: { w3_id: $.data.id } }
            - { call: "POST /api/installation-windows/${w3_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager, captures: { w3_status: $.data.status } }
            - { call: "POST /api/installation-windows", payload: { project_id: "${p_id}", floor_number: 3, start_date: "2026-08-12", end_date: "2026-08-13", crew_count: 1 }, as: InstallationManager, captures: { w4_id: $.data.id } }
            - { call: "POST /api/installation-windows/${w4_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager, captures: { err: $.data.error_id } }
          assert:
            - "W3 releases successfully: summed crew 5 + 2 + 1 == 8 <= capacity 8 (equality allowed); status == RELEASED"
            - "W4 release rejected 409 with error_id == ERR_FLOOR_CREW_CAPACITY_EXCEEDED (sum would be 9 > 8)"
            - "InstallationWindow.${w4_id}.status remains PLANNED"

  - rule_id: compensating_invariant
    instances:
      - name: attic_units_conservation_in_out_pair
        grounds:
          - concurrency_rules[attic-transfer-stale-line]
          - entities.POLine.fields.qty_installable
          - entities.POLine.fields.qty_attic
        distinguishing_aspect: |
          Conserved quantity: physical units per POLine. The forward action (attic transfer IN 5)
          paired with its compensation (attic transfer OUT 2) leaves
          qty_installable + qty_attic + qty_installed + qty_damaged_unresolved + qty_damaged_credited
          == qty_received == 50 at every step. Sibling invariant conserves a money envelope, not units.
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 50 x 10000c cube 10 awarded and ordered"
            - "Shipment sealed + departed; receiving POSTED: 50 received, 10 damaged -> qty_installable 40, qty_damaged_unresolved 10, qty_attic 0, qty_installed 0"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-CI1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 0 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Dresser", brand_standard_ref: "MS-DR", quantity_per_room: 1, room_count: 50, unit_budget_cents: 10000, attic_min_qty: 10, attic_max_qty: 40 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 10000, freight_estimate_cents: 0, lead_time_days: 7 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 50, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 50, qty_damaged: 10 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "GET /api/po-lines/${l_id}", as: WarehouseReceiver, captures: { l_v1: $.data.version } }
          trigger:
            - { call: "POST /api/po-lines/${l_id}/attic-transfers", payload: { direction: "IN", quantity: 5, expected_po_line_version: "${l_v1}" }, as: WarehouseReceiver, captures: { m1_install: $.data.resulting_installable, m1_attic: $.data.resulting_attic } }
            - { call: "GET /api/po-lines/${l_id}", as: WarehouseReceiver, captures: { l_v2: $.data.version } }
            - { call: "POST /api/po-lines/${l_id}/attic-transfers", payload: { direction: "OUT", quantity: 2, expected_po_line_version: "${l_v2}" }, as: WarehouseReceiver, captures: { m2_install: $.data.resulting_installable, m2_attic: $.data.resulting_attic } }
            - { call: "GET /api/po-lines/${l_id}", as: WarehouseReceiver }
          assert:
            - "After IN 5: movement snapshots resulting_installable == 35, resulting_attic == 5; invariant 35 + 5 + 0 + 10 + 0 == 50 == qty_received"
            - "After OUT 2: resulting_installable == 37, resulting_attic == 3; invariant 37 + 3 + 0 + 10 + 0 == 50 == qty_received"
            - "POLine.${l_id} final: qty_installable == 37, qty_attic == 3, qty_installed == 0, qty_damaged_unresolved == 10, qty_received == 50"

      - name: funding_envelope_conserved_across_draw_and_return
        grounds:
          - calculations.contingency_draw_fee
          - state_machines.ChangeOrder.PROPOSED_to_APPLIED
          - concurrency_rules[co-apply-stale-project]
        distinguishing_aspect: |
          Conserved quantity: the funding envelope E = SUM(BudgetLine.budgeted_cents) +
          unallocated_contingency_cents + sunk_fees_cents == 10000000c. A +500000c draw (fee 40000c)
          followed by a compensating -500000c return (fee 0) restores budgeted_cents to 9000000c and
          keeps E unchanged at every step; the sunk fee is balanced inside E by definition. Sibling
          invariant conserves physical units, not money.
        test_recipe:
          setup:
            - "Project total 10000000c, unallocated 1000000c, FURNITURE budgeted 9000000c, in PROCUREMENT"
            - "Spec approved/awarded; PO VENDA line 40 x 200000c = 8000000c committed (E0 = 9000000 + 1000000 + 0 == 10000000)"
            - "CO-A (+500000c to FURNITURE) proposed by pa-1; CO-B (-500000c on FURNITURE) proposed by pa-1"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-CI2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 1000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 9000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Desk", brand_standard_ref: "MS-D", quantity_per_room: 2, room_count: 20, unit_budget_cents: 200000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 200000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO-A draw", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 500000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { coa_id: $.data.id } }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO-B return", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: -500000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { cob_id: $.data.id } }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep, captures: { p_v1: $.data.version } }
          trigger:
            - { call: "POST /api/change-orders/${coa_id}/apply", payload: {expected_project_version: "${p_v1}" }, as: OwnerRep, as_user_id: "owner-1" }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep, captures: { p_v2: $.data.version } }
            - { call: "POST /api/change-orders/${cob_id}/apply", payload: {expected_project_version: "${p_v2}" }, as: OwnerRep, as_user_id: "owner-1" }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep }
            - { call: "GET /api/budget-lines/${bl_id}", as: OwnerRep }
          assert:
            - "After CO-A: budgeted_cents == 9500000, unallocated == 460000, sunk_fees == 40000 -> E = 9500000 + 460000 + 40000 == 10000000 (unchanged)"
            - "After CO-B (return, POS == 0 so fee == 0): budgeted_cents == 9000000 (restored), unallocated == 960000, sunk_fees == 40000 -> E = 9000000 + 960000 + 40000 == 10000000 (unchanged)"
            - "ChangeOrder.${coa_id}.fee_cents == 40000 and ChangeOrder.${cob_id}.fee_cents == 0"
            - "Both change orders end APPLIED; envelope E is identical before and after the draw/return pair"
