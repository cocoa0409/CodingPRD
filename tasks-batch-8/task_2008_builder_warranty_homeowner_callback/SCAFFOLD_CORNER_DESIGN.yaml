        distinguishing_aspect: "optimistic_concurrency layer: after a successful adjustment bumps the reserve version to 2, replaying the adjustment with the stale observed version 1 fails ERR_STALE_VERSION 412 and posts nothing."
        test_recipe:
          setup: ["home; reserve at version 1, balance 0"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-950", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", res_v1: "$.data[0].version" }
          trigger:
            - call: "POST /warranty-reserves/${res_id}/adjustments"
              payload: { kind: "MANUAL_ADJUSTMENT", amount_cents: 10000, expected_reserve_version: "${res_v1}", note: "First writer" }
              as: FinanceAdmin
              captures: { e_kind: $.data.kind }
            - call: "POST /warranty-reserves/${res_id}/adjustments"
              payload: { kind: "MANUAL_ADJUSTMENT", amount_cents: 5000, expected_reserve_version: "${res_v1}", note: "Stale replay" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
            - call: "GET /warranty-reserves/${res_id}"
              as: FinanceAdmin
              captures: { bal: $.data.balance_cents, v: $.data.version }
          assert:
            - "e_kind == MANUAL_ADJUSTMENT (first write succeeded at version 1)"
            - "err == ERR_STALE_VERSION, HTTP 412 (second write replayed the stale version 1)"
            - "bal == 10000 and v == 2 (stale write applied nothing)"
      - name: cascading_side_effects_layer_covered_by_difficulty
        claim_type: cascade_chain
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
          - state_machines.Chargeback.APPROVED_to_PAID
        excluded_because:
          difficulty_instance: transitive_cascade / work_order_completion_cost_cascade
          rationale: "The completion cascade (WO -> SR cost -> reserve DRAW + alert) and the payment cascade (CB PAID -> reserve RECOVERY) are asserted end-to-end by the two §1.8 transitive_cascade instances."

