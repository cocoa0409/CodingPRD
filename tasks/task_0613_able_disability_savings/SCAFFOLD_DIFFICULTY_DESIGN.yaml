# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rule_ids x >=2 instances each (18 instances). Every grounds ref resolves
# into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls chain is empty-DB
# executable against §1.5.
#
# Reused config: Program annual_contribution_cap_cents=1900000,
#   able_to_work_fpl_cents=1506000, ssi_suspension_threshold_cents=10000000,
#   ssi_resource_limit_cents=200000, program_fee_bps=30,
#   nonqualified_additional_tax_pct=0.10, max_investment_changes_per_year=2,
#   disability_onset_max_age=26. Logical clock startup default 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ssi_vs_medicaid_disregard_same_balance
        grounds:
          - calculations.ssi_asset_disregard
          - entities.Account.fields.ssi_posture
          - entities.Beneficiary.fields.other_countable_resources_cents
          - endpoints["GET /able/accounts/{id}/means-test"]
        distinguishing_aspect: |
          The two variants operate on the Beneficiary/Account benefit domain: FEDERAL_SSI counts only the ABLE
          balance above $100,000 and suspends SSI, while MEDICAID disregards the entire ABLE balance, so an
          identical $101,500 balance yields total_countable 150000 (SSI_SUSPENDED) for SSI but 0 ABLE countable
          (affects_benefit false) for MEDICAID.
        test_recipe:
          setup:
            - "Program common config; one InvestmentOption; Beneficiary other_countable_resources_cents=0; CERTIFIED; OPEN account."
            - "Account balance driven to 10150000 cents ($101,500): REGULAR contribution 1900000 then credit_earnings +8250000."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, ssi_suspension_threshold_cents: 10000000, ssi_resource_limit_cents: 200000, program_fee_bps: 30, nonqualified_additional_tax_pct: 0.10, max_investment_changes_per_year: 2, disability_onset_max_age: 26 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Dana D", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA", other_countable_resources_cents: 0 }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1900000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 8250000 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /able/accounts/${acct_id}/means-test?variant=SSI"
              payload: { variant: "SSI" }
              as: ProgramAdministrator
              captures: { ssi_total: $.data.total_countable_cents, ssi_posture: $.data.ssi_posture }
            - call: "GET /able/accounts/${acct_id}/means-test?variant=MEDICAID"
              payload: { variant: "MEDICAID" }
              as: ProgramAdministrator
              captures: { mcd_able: $.data.able_countable_for_ssi_cents, mcd_affects: $.data.affects_benefit }
          assert:
            - "means-test(SSI).able_countable_for_ssi_cents == 150000"
            - "means-test(SSI).total_countable_cents == 150000"
            - "means-test(SSI).ssi_posture == SSI_SUSPENDED"
            - "means-test(MEDICAID).able_countable_for_ssi_cents == 0"
            - "means-test(MEDICAID).affects_benefit == false"

      - name: earnings_split_snapshot_vs_recompute
        grounds:
          - calculations.distribution_earnings_split
          - entities.Distribution.fields.earnings_portion_cents
          - state_machines.Distribution.APPROVED_to_DISBURSED
        distinguishing_aspect: |
          On the Distribution domain (distinct from the means-test domain), the pro-rata split is captured at
          disbursement: a $10,000 disbursement at ratio 0.24 fixes earnings_portion_cents=240000, and a later
          +900000 earnings credit does NOT retroactively move that distribution's earnings_portion_cents off 240000.
        test_recipe:
          setup:
            - "OPEN account: REGULAR contribution 1900000 (basis 1900000), credit_earnings +600000 (earnings 600000), balance 2500000, ratio 0.24."
            - "A distribution for 1000000, APPROVED."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Eli E", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1900000, expected_account_version: "${acct_v}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 600000 }
              as: ProgramAdministrator
              captures: { acct_v2: $.data.version }
            - call: "POST /able/accounts/${acct_id}/distributions"
              payload: { amount_cents: 1000000, category: "HEALTH" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /able/distributions/${dist_id}/approve"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
          trigger:
            - call: "POST /able/distributions/${dist_id}/disburse"
              payload: { expected_account_version: "${acct_v2}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { ep_at_disburse: $.data.earnings_portion_cents }
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 900000 }
              as: ProgramAdministrator
            - call: "GET /able/distributions/${dist_id}"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { ep_after: $.data.earnings_portion_cents }
          assert:
            - "Distribution.${dist_id}.earnings_portion_cents == 240000 immediately after disburse"
            - "Distribution.${dist_id}.earnings_portion_cents == 240000 still, after a later 900000 earnings credit (snapshot, not recomputed)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contribution_headroom_atw_nested_min_branch
        grounds:
          - calculations.contribution_headroom
          - entities.Beneficiary.fields.gross_employment_income_ytd_cents
          - validations[priority=15]
        distinguishing_aspect: |
          Mode (a): the ABLE-to-Work cap is min(FPL 1506000, income 1200000)=1200000 and the test branches on
          contribution_type plus the employer-plan flag; with atw_ytd 1150000 a new 60000 ABLE_TO_WORK contribution
          exceeds the 50000 room and is rejected ERR_ATW_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Beneficiary gross_employment_income_ytd_cents=1200000, employer_retirement_plan_participant=false; OPEN account."
            - "atw_contrib_ytd at 1150000 via a prior ABLE_TO_WORK contribution of 1150000."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Fay F", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA", gross_employment_income_ytd_cents: 1200000, employer_retirement_plan_participant: false }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "ABLE_TO_WORK", amount_cents: 1150000, expected_account_version: "${acct_v}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "ABLE_TO_WORK", amount_cents: 60000, expected_account_version: "${acct_v2}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ATW_CAP_EXCEEDED, HTTP 409"
            - "Account.${acct_id}.atw_contrib_ytd_cents == 1150000 (unchanged)"

      - name: management_fee_round_per_month_then_sum
        grounds:
          - calculations.program_management_fee
          - entities.Program.fields.program_fee_bps
          - endpoints["POST /able/accounts/{id}/assess-fee"]
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to round-per-month-then-sum. For period_end_balance 3333333 and 12
          months at 30 bps, the monthly fee rounds to 833 cents and the annual total is 833*12 = 9996, NOT the
          10000 that rounding one annual figure would give.
        test_recipe:
          setup:
            - "An OPEN account with balance 3333333 (REGULAR 1900000 + credit_earnings 1433333); period_end_balance and months are request inputs."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Gus G", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1900000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 1433333 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /able/accounts/${acct_id}/assess-fee"
              payload: { period_end_balance_cents: 3333333, months: 12 }
              as: ProgramAdministrator
              captures: { bal_after: $.data.balance_cents }
          assert:
            - "total_fee assessed == 9996 (833 per month x 12), NOT 10000"
            - "Account.${acct_id}.balance_cents == 3323337 (3333333 - 9996)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: distribution_fork_join_disburse_vs_reject
        grounds:
          - state_machines.Distribution.REQUESTED_to_APPROVED
          - state_machines.Distribution.REQUESTED_to_REJECTED
          - state_machines.Distribution.APPROVED_to_DISBURSED
          - entities.Distribution.fields.status
        distinguishing_aspect: |
          On the Distribution entity, REQUESTED forks to {APPROVED->DISBURSED, REJECTED} and DISBURSED forks again
          to {SUBSTANTIATED, CLAWED_BACK} with divergent side-effect sets, so the machine is non-linear branching,
          not an A->B->C pipeline.
        test_recipe:
          setup:
            - "OPEN account with balance >= 1000000 (REGULAR 1900000)."
            - "Two distributions: dist_a (1000000) and dist_b (500000), both REQUESTED."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Hal H", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1900000, expected_account_version: "${acct_v}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { acct_v2: $.data.version }
            - call: "POST /able/accounts/${acct_id}/distributions"
              payload: { amount_cents: 1000000, category: "HEALTH" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { dist_a: $.data.id }
            - call: "POST /able/accounts/${acct_id}/distributions"
              payload: { amount_cents: 500000, category: "EDUCATION" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { dist_b: $.data.id }
          trigger:
            - call: "POST /able/distributions/${dist_a}/approve"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /able/distributions/${dist_a}/disburse"
              payload: { expected_account_version: "${acct_v2}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { a_status: $.data.status }
            - call: "POST /able/distributions/${dist_b}/reject"
              payload: {}
              as: ProgramAdministrator
              captures: { b_status: $.data.status }
          assert:
            - "Distribution.${dist_a}.status == DISBURSED"
            - "Distribution.${dist_b}.status == REJECTED"

      - name: account_suspend_reinstate_cycle
        grounds:
          - state_machines.Account.OPEN_to_SUSPENDED
          - state_machines.Account.SUSPENDED_to_OPEN
          - entities.Account.fields.status
        distinguishing_aspect: |
          On the Account entity (different from Distribution), status cycles OPEN->SUSPENDED->OPEN, a true loop back
          to a prior state, which a purely linear pipeline cannot express.
        test_recipe:
          setup:
            - "OPEN account with a CERTIFIED beneficiary."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Ivy I", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /able/accounts/${acct_id}/suspend"
              payload: {}
              as: ProgramAdministrator
              captures: { s1: $.data.status }
            - call: "POST /able/accounts/${acct_id}/reinstate"
              payload: {}
              as: ProgramAdministrator
              captures: { s2: $.data.status }
          assert:
            - "after suspend: Account.${acct_id}.status == SUSPENDED"
            - "after reinstate: Account.${acct_id}.status == OPEN (returned to a prior state)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: death_freezes_account_then_revokes_reps_depth3
        grounds:
          - state_machines.Account.OPEN_to_FROZEN_DEATH
          - state_machines.AuthorizedRepresentative.ACTIVE_to_REVOKED
          - state_machines.Distribution.REQUESTED_to_REJECTED
          - entities.Beneficiary.fields.is_deceased
        distinguishing_aspect: |
          Depth-3 chain triggered by record_death: (1) Beneficiary.is_deceased=true -> (2) that flips the Account to
          FROZEN_DEATH -> (3) the account freeze, in turn, drives all ACTIVE AuthorizedRepresentatives on it to
          REVOKED; each hop is caused by the previous, not directly by the original call.
        test_recipe:
          setup:
            - "OPEN account with one ACTIVE AuthorizedRepresentative (PARENT, 2026-01-01..2030-01-01) and one REQUESTED distribution."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Jo J", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1000000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "POST /able/accounts/${acct_id}/authorized-representatives"
              payload: { full_name: "Parent P", relationship: "PARENT", authority_start: "2026-01-01", authority_end: "2030-01-01" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id }
            - call: "POST /able/accounts/${acct_id}/distributions"
              payload: { amount_cents: 200000, category: "HEALTH" }
              as: ProgramAdministrator
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /able/beneficiaries/${ben_id}/record_death"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "Account.${acct_id}.status == FROZEN_DEATH"
            - "AuthorizedRepresentative.${rep_id}.status == REVOKED"
            - "Distribution.${dist_id}.status == REJECTED"
            - "Beneficiary.${ben_id}.is_deceased == true"

      - name: clock_expires_cert_then_suspends_account_depth2
        grounds:
          - state_machines.Certification.CERTIFIED_to_EXPIRED
          - state_machines.Account.OPEN_to_SUSPENDED
          - entities.Beneficiary.fields.eligibility_status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (clock advance, not record_death): advancing current_utc past the
          certification's expires_on flips the Certification to EXPIRED, which in turn flips the OPEN Account to
          SUSPENDED. The second hop is caused by the first, not directly by the clock call.
        test_recipe:
          setup:
            - "OPEN account; CERTIFIED certification with expires_on 2026-06-30; clock at 2026-01-01 default."
          setup_api_calls:
            - call: "POST /able/programs"
