            - "after the SECOND line on the SAME order: allocated_sqft == 4400.00, fill_rate_pct == 100.00, status == ALLOCATED; InventoryLot.${lot_a}.allocated_sqft == 4400.00 — the parents aggregate over both lines rather than tracking the latest"
            - "after revoking the FIRST line: ChannelOrder.${order1}.allocated_sqft == 2200.00, fill_rate_pct == 50.00 and status back to PARTIAL; InventoryLot.${lot_a}.allocated_sqft == 2200.00 and status STILL ALLOCATED because line2 survives"
            - "AllocationLine.${line1}.status == REVOKED while AllocationLine.${line2}.status is untouched — revocation is per line, not per order"
            - "after revoking the SECOND line: ChannelOrder.${order1}.allocated_sqft == 0.00, fill_rate_pct == 0.00, status == BACKORDERED; InventoryLot.${lot_a}.allocated_sqft == 0.00, available_sqft == 10560.00 and status back to AVAILABLE"
            - "the lot's coverage is conserved end to end: allocated_sqft + available_sqft == produced_sqft == 10560.00 at every one of the four checkpoints"

      - name: five_hop_nonconformance_cascade_reaches_the_order_ledger
        claim_type: cascading_side_effects
        grounds:
          - state_machines[ProductionRun.qc_status].transitions[SAMPLED->NONCONFORMING]
          - errors[ERR_LOT_QUARANTINED]
        excluded_because:
          difficulty_instance: nonconforming_thermal_result_cascades_to_order_backorder_five_hops
          rationale: "The §1.8 instance already verifies the whole chain end to end — record-result NONCONFORMING -> run qc_status -> lot QUARANTINED -> AllocationLine REVOKED -> order allocated_sqft / fill_rate_pct / status BACKORDERED — including that a lot of a DIFFERENT run is untouched. A breadth-level version would either repeat it or check fewer hops."

      - name: provisional_and_reconciled_scrap_are_two_variants_of_one_rule
        claim_type: dual_variant_calculation
        grounds:
          - calculations.changeover_scrap_accounting.variants
        excluded_because:
          difficulty_instance: changeover_scrap_provisional_versus_reconciled_on_same_event
          rationale: "The §1.8 instance runs both variants on ONE ChangeoverEvent from identical inputs, computes the 1654.50 kg divergence and shows the reconciled figure overwriting the provisional one on outgoing_run.changeover_scrap_kg. The second dual-variant rule (thermal_conformance_verdict) is likewise owned by §1.8, so a breadth instance here would only re-derive published arithmetic."

  # ===========================================================================
  # 9. CONSISTENCY MODEL — `immediate`
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_and_side_effect_is_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.cullet_charge_allocation
          - calculations.binder_cure_index
          - calculations.packaging_compression_economics
        distinguishing_aspect: "consistency_model is `immediate`, so there is no settling period anywhere: the POST that charges the furnace already returns the finished charge arithmetic, the POST that cures already returns cure_index and the emission masses, and the POST that packages already returns the produced coverage while the InventoryLot it minted is listable in the very next request. Nothing in this scenario is allowed to require a re-read, a retry or a delay to become correct."
