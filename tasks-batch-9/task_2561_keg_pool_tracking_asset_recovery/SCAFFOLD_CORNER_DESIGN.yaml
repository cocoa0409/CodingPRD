          assert:
            - "the operator's and the analyst's CLEAN attempts both return HTTP 403 ERR_FORBIDDEN_ROLE even though the operator legitimately created this very cycle one call earlier: record-step is the technician's exclusive verb"
            - "the technician's identical CLEAN returns HTTP 200 with stage == CLEANED and caustic_cycle_minutes == 15, so the refusals were about the role and nothing else"
