  - rule_id: compensating_invariant
    instances:
      - name: credit_conservation_under_complete_and_early_cancel
        grounds:
          - entities.Package.fields.credits_remaining
          - state_machines.Session.SCHEDULED_to_COMPLETED
          - state_machines.Session.SCHEDULED_to_CANCELLED_EARLY
        distinguishing_aspect: |
          Conserved quantity: package credits. INV-CREDITS (credits_consumed +
          credits_forfeited + credits_remaining == credits_total) holds after
          every step, and the reserve/cancel-early pair on session s2 leaves
          every credit counter exactly as before the pair (net zero
          compensation).
        test_recipe:
          setup:
            - "ACTIVE WEEKLY plan; 8-credit INDIVIDUAL package; sessions s1 2026-08-03, s2 2026-08-08, s3 2026-08-13 all reserved"
          setup_api_calls:
