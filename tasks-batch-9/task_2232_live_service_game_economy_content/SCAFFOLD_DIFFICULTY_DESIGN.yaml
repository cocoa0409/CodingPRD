      - name: balance_change_go_live_requires_published_comms_notice
        grounds:
          - validations[priority=16]
          - errors[ERR_COMMS_NOTICE_REQUIRED]
          - state_machines.BalanceChange.CANARY_to_LIVE
          - state_machines.CommsNotice.DRAFT_to_PUBLISHED
          - entities.BalanceChange.fields.comms_state
        distinguishing_aspect: |
          The BalanceChange transition CANARY -> LIVE is gated on the state of a different
          entity (CommsNotice.status): with the notice still DRAFT the advance fails with
          ERR_COMMS_NOTICE_REQUIRED, and publishing that notice — by a user id other than the
          change author — is the only thing that changes, after which the same advance applies
          delta_bp 500 to Season.effective_sink_rate_bp.
