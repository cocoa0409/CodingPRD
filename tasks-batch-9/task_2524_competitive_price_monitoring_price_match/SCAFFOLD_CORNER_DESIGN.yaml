              as: "<no X-User-Role header>"
              captures: { e_norole: $.data.error_id }
            - call: "GET /pricing/markets"
              payload: {}
              as: PricingAnalyst
              as_user_id: "<no X-User-ID header>"
              captures: { e_nouser: $.data.error_id }
