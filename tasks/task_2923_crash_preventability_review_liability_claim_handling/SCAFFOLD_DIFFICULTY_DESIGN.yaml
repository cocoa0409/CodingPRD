              captures: { status_final: $.data.status, det_final: $.data.determination, score_final: $.data.committee_score }
            - call: "POST /review-cases/${rc_id}/appeal"
              payload: { appeal_grounds: "second bite at the apple", appeal_grounds_code: "PROCEDURAL" }
              as: SafetyManager
              as_user_id: "sm-002"
              captures: { err: $.data.error_id }
          assert:
            - "${status_first} == DECIDED and ${score_first} == 2.67 — round_half_up((4.00 + 3.00 + 1.00) / 3, 2)"
            - "${status_appealed} == DELIBERATION — the machine cycled backwards, which a linear machine cannot do"
            - "${round_appealed} == 1"
            - "${det_appealed} == PENDING and ${basis_appealed} == NOT_APPLICABLE and ReviewCase.${rc_id}.committee_score == null and ReviewCase.${rc_id}.decided_at == null and ReviewCase.${rc_id}.decided_by_user_id == null"
            - "Crash.${c_id}.preventability_status == UNDER_REVIEW and Crash.${c_id}.appeals_exhausted == false"
            - "GET /review-cases/${rc_id}/votes still returns exactly 3 rows, all with superseded == false, so quorum survives the appeal without re-balloting"
            - "${status_final} == CLOSED_FINAL, NOT DECIDED — the identical trigger took the other branch because appeal_round 1 >= APPEAL_MAX_ROUNDS 1"
            - "${det_final} == PREVENTABLE and ${score_final} == 2.67 (same ballots, same arithmetic)"
            - "Crash.${c_id}.appeals_exhausted == true — the extra side effect that only the CLOSED_FINAL branch applies"
            - "${err} == ERR_APPEALS_EXHAUSTED with HTTP 409, and ReviewCase.${rc_id}.status is still CLOSED_FINAL with appeal_round still 1"

