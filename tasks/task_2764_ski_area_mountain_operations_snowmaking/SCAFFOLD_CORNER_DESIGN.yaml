      - name: the_staff_assignment_child_list_is_parent_scoped_and_its_two_filters_compose
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /mountain-ops/lifts/{id}/staff-assignments]
          - entities.LiftStaffAssignment.fields.lift_id
          - state_machines.LiftStaffAssignment.ASSIGNED_to_RELEASED
        distinguishing_aspect: |
          The child list must be scoped by the path parent and by BOTH optional filters at once. Two
          lifts of the same season each own a TOP_OP row, so a query that scopes only by role_on_lift
          returns the wrong lift's operator, and the RELEASED row must remain listable - the unfiltered
          call returns it - while the state=ASSIGNED call must not. Combining state=ASSIGNED with
          role_on_lift=TOP_OP on L1 must return zero rows even though each filter alone matches one row,
          which is the composition an OR-style filter implementation gets wrong.
        test_recipe:
          setup:
            - "A PRESEASON season with two inspected lifts: L1 (required_operator_count 2) with OP-1 as TOP_OP and OP-2 as BOTTOM_OP, and L2 (required_operator_count 1) with OP-3 as TOP_OP."
