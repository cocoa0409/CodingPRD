            - "notice_published_at == \"2026-09-15T00:00:00.000Z\" is accepted for a 2026-09-25T18:00:00.000Z start, i.e. exactly HEARING_NOTICE_DAYS (10) days of lead time is sufficient"

  # ===========================================================================
  # Rule 9 - compensating invariants over TWO different conserved quantities:
  #   the plan's participation weight ledger and the element policy inventory
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: activity_cancellation_restores_participation_weight_ledger
        grounds:
          - calculations.participation_weight_conservation
          - state_machines.EngagementActivity.COMPLETED_to_CANCELLED
          - calculations.plan_equity_share_pct
        distinguishing_aspect: |
          Conserved quantity: the plan's participation weight ledger
          (participation_weight_total / underrepresented_weight_total), which must always equal the
          sum over COMPLETED activities. Completing a second, OUTREACH_WEIGHTED activity moves the
          ledger to 17.0 / 9.0 (plan equity 52.9) and cancelling it must return the ledger to exactly
          10.0 / 4.0 and the equity share to exactly 40.0 - no residue from the interpreter-doubled
          weights, and no double subtraction.
        test_recipe:
          setup:
            - "A plan with one ADA-accessible transit-served venue (turnover_buffer_minutes 0)."
            - "One COMPLETED WORKSHOP on 2026-07-10 with ten records (LOW_INCOME, LIMITED_ENGLISH, YOUTH, RENTER, four GENERAL, two SENIOR) under the STANDARD weighting variant: total 10.0, underrepresented 4.0, activity equity 40.0."
            - "The logical clock stays at its startup default 2026-08-01T00:00:00Z, which is past both activities' end_at."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
