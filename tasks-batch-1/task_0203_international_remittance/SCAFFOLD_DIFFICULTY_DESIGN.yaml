              payload: { decision: "REJECT", expected_case_version: "${case_v}" }
              as: ComplianceOfficer
          assert:
            - "Transfer.${transfer_id}.delivery_status == REFUNDED"
            - "Sum of LedgerEntry.amount_minor for transfer_id == ${transfer_id} equals 0 (SENDER_DEBIT -50799 + FEE_REVENUE 799 + REFUND_CREDIT 50000 + FEE_REVERSAL 799)"
            - "Corridor.${corridor_id}.reserved_minor == 0"

      - name: refund_conserves_corridor_reservation_quantity
        grounds:
          - entities.Corridor.fields.reserved_minor
          - state_machines.Transfer.FAILED_to_REFUNDED
          - calculations.refund_amount
        distinguishing_aspect: |
          Different conserved quantity = corridor reserved capacity (reserved_minor
          aggregate). Funding adds send_principal_minor to reserved_minor; a
          DELIVERY_FAILED refund after exhausted attempts subtracts the same
          amount, returning reserved_minor to its pre-fund value of 0 — capacity
          conservation, distinct from the funds-conservation invariant above.
        test_recipe:
          setup:
            - "FUNDED, CLEARED, VERIFIED-recipient transfer; two payout attempts both FAILED (MAX_PAYOUT_ATTEMPTS=2); delivery_status FAILED; reserved_minor==50000 before refund."
