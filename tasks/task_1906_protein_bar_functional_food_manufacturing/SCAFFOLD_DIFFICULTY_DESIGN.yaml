scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: label_vs_composite_protein_substantiation
        grounds:
          - calculations.protein_claim_substantiation
          - entities.FormulaRevision.fields.label_protein_g_per_serving
          - entities.FormulaRevision.fields.composite_protein_g_per_serving
        distinguishing_aspect: |
          Same revision and same ingredient lines produce two different protein-per-serving
          values because LABEL uses Ingredient.nominal_protein_pct while COMPOSITE uses the
          reserved lots' coa_protein_pct — a nutrition-domain dual variant (distinct from the
          commercial pricing variant and the ingredient-lot sweetener variant).
        test_recipe:
          setup:
            - "APPROVED supplier; WHEY (nominal 0.80), MPI (0.85), SYRUP (1.0), OATS ingredients"
            - "RELEASED lots: WL-1 whey 200kg CoA 0.76, ML-1 mpi 100kg CoA 0.85, SL-1 syrup 100kg CoA 1.0, OL-1 oats 200kg"
            - "customer C1 with ACTIVE agreement AG3 (MARGINAL flat 500c, MOQ 100, committed 300, quarter_start 2026-07-01)"
            - "formula F1 bar 60g; revision R1 batch 100kg lines WHEY 40 + MPI 10 (contributors) + SYRUP 10 + OATS 40, claims [HIGH_PROTEIN]; revision APPROVED with approved HIGH_PROTEIN claim review"
            - "line L1 slab 20kg; run planned 130 created and scheduled 2026-08-06T08:00-10:00Z (changeover NONE auto-validated)"
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK", "SOY"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "MPI", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.85 }, as: PlantAdmin, captures: { mpi: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "SYRUP", category: "SWEETENER", allergen_tags: [], nominal_sweetness_factor: 1.0 }, as: PlantAdmin, captures: { syr: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "OATS", category: "BINDER", allergen_tags: ["WHEAT"] }, as: PlantAdmin, captures: { oats: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.76 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${mpi}", supplier_id: "${sup}", lot_code: "ML-1", received_qty_kg: 100, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.85 }, as: PlantAdmin, captures: { ml: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${ml}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${syr}", supplier_id: "${sup}", lot_code: "SL-1", received_qty_kg: 100, received_at: "2026-08-01T00:00:00Z", coa_sweetness_factor: 1.0 }, as: PlantAdmin, captures: { sl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${sl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${oats}", supplier_id: "${sup}", lot_code: "OL-1", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z" }, as: PlantAdmin, captures: { ol: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${ol}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 300, tier_breaks: [{ upto_cases: 999999999, rate_cents_per_case: 500 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { ag: "$.data.id" } }
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F1", bar_weight_g: 60, serving_count_per_bar: 1 }, as: FormulationScientist, captures: { f1: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f1}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }, { ingredient_id: "${mpi}", qty_kg_per_batch: 10, is_protein_contributor: true }, { ingredient_id: "${syr}", qty_kg_per_batch: 10, is_protein_contributor: false }, { ingredient_id: "${oats}", qty_kg_per_batch: 40, is_protein_contributor: false }], batch_size_kg: 100, target_protein_g_per_serving: 20, claim_tags: ["HIGH_PROTEIN"] }, as: FormulationScientist, captures: { r1: "$.data.id" } }
            - { call: "POST /mfg/revisions/${r1}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r1}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/claim-reviews", payload: { revision_id: "${r1}", claim_tag: "HIGH_PROTEIN", claim_type: "NUTRIENT_CONTENT" }, as: FormulationScientist, captures: { cr1: "$.data.id" } }
            - { call: "POST /mfg/claim-reviews/${cr1}/start-review", payload: {}, as: QualityManager }
            - { call: "POST /mfg/claim-reviews/${cr1}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${r1}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r1}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/lines", payload: { name: "L1", capacity_kg_per_hour: 500, slab_weight_kg: 20 }, as: PlantAdmin, captures: { ln1: "$.data.id", ln_v: "$.data.version" } }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T06:00:00Z" }, as: PlantAdmin }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${r1}", agreement_id: "${ag}", line_id: "${ln1}", planned_cases: 130, expected_agreement_version: "${ag_v}" }, as: ProductionPlanner, captures: { run1: "$.data.id" } }
            - { call: "POST /mfg/production-runs/${run1}/schedule", payload: { start_utc: "2026-08-06T08:00:00Z", end_utc: "2026-08-06T10:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /mfg/production-runs/${run1}/verify-pre-run", payload: {}, as: QualityManager, captures: { run_after: "$.data.status" } }
            - { call: "GET /mfg/revisions/${r1}", payload: {}, as: QualityManager, captures: { lbl: "$.data.label_protein_g_per_serving", cmp: "$.data.composite_protein_g_per_serving" } }
          assert:
            - "FormulaRevision.${r1}.label_protein_g_per_serving == 24.31 (nominal: (40000*0.80 + 10000*0.85) / floor(100000/60) = 40500/1666)"
            - "FormulaRevision.${r1}.composite_protein_g_per_serving == 23.35 (CoA: (40000*0.76 + 10000*0.85) / 1666 = 38900/1666)"
            - "label and composite differ by exactly 0.96 g — same lines, two valid assays"
            - "ProductionRun.${run1}.status == PRE_RUN_VERIFIED (23.35 >= 10.0 satisfies HIGH_PROTEIN under both variants)"

      - name: marginal_vs_average_tier_pricing
        grounds:
          - calculations.agreement_case_pricing
          - entities.ManufacturingAgreement.fields.pricing_mode
        distinguishing_aspect: |
          Identical tier_breaks and identical case volume price differently under MARGINAL
          (each tier rate applies only inside its bracket) vs AVERAGE (reached tier rate
          applies to all cases) — a commercial-domain dual variant on ManufacturingAgreement,
          distinct from the nutrition-domain protein variant.
        test_recipe:
          setup:
            - "customer C1; AG-M marginal and AG-A average, both with tiers [{1000,500},{5000,450},{999999999,400}], MOQ 100, committed 1000, quarter 2026-07-01, both still NEGOTIATION (quote is status-agnostic)"
          setup_api_calls:
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 1000, tier_breaks: [{ upto_cases: 1000, rate_cents_per_case: 500 }, { upto_cases: 5000, rate_cents_per_case: 450 }, { upto_cases: 999999999, rate_cents_per_case: 400 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { agm: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "AVERAGE", moq_cases_per_run: 100, committed_cases_per_quarter: 1000, tier_breaks: [{ upto_cases: 1000, rate_cents_per_case: 500 }, { upto_cases: 5000, rate_cents_per_case: 450 }, { upto_cases: 999999999, rate_cents_per_case: 400 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { aga: "$.data.id" } }
          trigger:
            - { call: "GET /mfg/agreements/${agm}/quote", payload: { cases: 2000 }, as: ProductionPlanner, captures: { tot_m: "$.data.total_cents", ppc_m: "$.data.per_case_cents" } }
            - { call: "GET /mfg/agreements/${aga}/quote", payload: { cases: 2000 }, as: ProductionPlanner, captures: { tot_a: "$.data.total_cents", ppc_a: "$.data.per_case_cents" } }
          assert:
            - "MARGINAL quote total_cents == 950000 (1000*500 + 1000*450)"
            - "AVERAGE quote total_cents == 900000 (2000*450)"
            - "MARGINAL per_case_cents == 475; AVERAGE per_case_cents == 450"
            - "delta == 50000 cents for identical tiers and volume"

      - name: provisional_vs_final_sweetener_factor
        grounds:
          - calculations.sweetener_blend_adjustment
          - entities.ProductionRun.fields.provisional_sweetener_required_kg
          - entities.ProductionRun.fields.final_sweetener_required_kg
        distinguishing_aspect: |
          The same 10 kg syrup line prices 10.00 kg of reservation at run creation (nominal
          factor 1.0) but 12.50 kg at verify-pre-run (CoA factor 0.8) — an ingredient-lot
          supply-variability dual variant, distinct from both the nutrition and pricing domains.
        test_recipe:
          setup:
            - "Same fixture as label_vs_composite_protein_substantiation except SYRUP lot SL-1 carries coa_sweetness_factor 0.8"
            - "run created (PROVISIONAL variant), then scheduled"
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "SYRUP", category: "SWEETENER", allergen_tags: [], nominal_sweetness_factor: 1.0 }, as: PlantAdmin, captures: { syr: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${syr}", supplier_id: "${sup}", lot_code: "SL-1", received_qty_kg: 100, received_at: "2026-08-01T00:00:00Z", coa_sweetness_factor: 0.8 }, as: PlantAdmin, captures: { sl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${sl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 300, tier_breaks: [{ upto_cases: 999999999, rate_cents_per_case: 500 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { ag: "$.data.id" } }
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F2", bar_weight_g: 60, serving_count_per_bar: 1 }, as: FormulationScientist, captures: { f2: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f2}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }, { ingredient_id: "${syr}", qty_kg_per_batch: 10, is_protein_contributor: false }], batch_size_kg: 100, target_protein_g_per_serving: 15, claim_tags: [] }, as: FormulationScientist, captures: { r2: "$.data.id" } }
            - { call: "POST /mfg/revisions/${r2}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r2}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${r2}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r2}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/lines", payload: { name: "L1", capacity_kg_per_hour: 500, slab_weight_kg: 20 }, as: PlantAdmin, captures: { ln1: "$.data.id", ln_v: "$.data.version" } }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T06:00:00Z" }, as: PlantAdmin }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${r2}", agreement_id: "${ag}", line_id: "${ln1}", planned_cases: 100, expected_agreement_version: "${ag_v}" }, as: ProductionPlanner, captures: { run1: "$.data.id", prov: "$.data.provisional_sweetener_required_kg" } }
            - { call: "POST /mfg/production-runs/${run1}/schedule", payload: { start_utc: "2026-08-06T08:00:00Z", end_utc: "2026-08-06T10:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /mfg/production-runs/${run1}/verify-pre-run", payload: {}, as: QualityManager, captures: { fin: "$.data.final_sweetener_required_kg" } }
            - { call: "GET /mfg/ingredient-lots/${sl}", payload: {}, as: QualityManager, captures: { sl_res: "$.data.reserved_qty_kg" } }
          assert:
            - "ProductionRun.${run1}.provisional_sweetener_required_kg == 10.00 (10 kg * 1.0/1.0)"
            - "ProductionRun.${run1}.final_sweetener_required_kg == 12.50 (10 kg * 1.0/0.8, ceil to 0.01)"
            - "IngredientLot.${sl}.reserved_qty_kg == 12.50 after top-up (10.00 at create + 2.50 at verify)"
            - "ProductionRun.${run1}.status == PRE_RUN_VERIFIED"

  - rule_id: combinatorial_formula
    instances:
      - name: changeover_level_flips_on_wet_clean_staleness
        grounds:
          - calculations.changeover_level_matrix
          - entities.ProductionLine.fields.last_wet_clean_utc
          - state_machines.ChangeoverEvent.transitions
        distinguishing_aspect: |
          Mode (a) combinatorial: with an identical single-allergen, non-high-risk carryover
          set (|carryover| == 1, no PEANUT/TREE_NUT), the matrix returns WET_CLEAN when
          minutes_since_last_wet_clean == 270 (<= 1440) but SWAB_VALIDATE when == 1815 (> 1440)
          — the same allergen inputs flip level purely on the third input (staleness).
        test_recipe:
          setup:
            - "APPROVED supplier; ingredients WHEY(0.80,[MILK]), SOYPROT(0.85,[SOY]), MPI(0.85,[MILK]), SYRUP(1.0,[])"
            - "RELEASED lots: WL 300kg coa 0.80, SPL 200kg coa 0.85, ML 100kg coa 0.85, SL 100kg coa 1.0"
            - "customer + ACTIVE agreement AG3 (MOQ 100); formula FM bar 60g; line L1 slab 20kg"
            - "revision RA profile [MILK,SOY] approved; run A created, scheduled 2026-08-02T08:00-10:00Z, verified, started, completed (100 cases) — line profile now [MILK,SOY]"
            - "revision RB profile [SOY] approved (supersedes RA; run A already COMPLETED); run B scheduled 2026-08-02T12:00-14:00Z; its changeover SWAB_VALIDATE (last_wet_clean null => +inf); swab 10 ppm recorded by lt-001 and validated by qm-001 at clock 2026-08-02T11:00Z (last_wet_clean = 11:00); run B verified, started, completed — line profile now [SOY]"
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED", allergens_handled: ["MILK", "SOY"] }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "SOYPROT", category: "PROTEIN", allergen_tags: ["SOY"], nominal_protein_pct: 0.85 }, as: PlantAdmin, captures: { soy: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "MPI", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.85 }, as: PlantAdmin, captures: { mpi: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "SYRUP", category: "SWEETENER", allergen_tags: [], nominal_sweetness_factor: 1.0 }, as: PlantAdmin, captures: { syr: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 300, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${soy}", supplier_id: "${sup}", lot_code: "SPL-1", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.85 }, as: PlantAdmin, captures: { spl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${spl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${mpi}", supplier_id: "${sup}", lot_code: "ML-1", received_qty_kg: 100, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.85 }, as: PlantAdmin, captures: { ml: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${ml}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${syr}", supplier_id: "${sup}", lot_code: "SL-1", received_qty_kg: 100, received_at: "2026-08-01T00:00:00Z", coa_sweetness_factor: 1.0 }, as: PlantAdmin, captures: { sl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${sl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 3000, tier_breaks: [{ upto_cases: 999999999, rate_cents_per_case: 500 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { ag: "$.data.id" } }
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "FM", bar_weight_g: 60, serving_count_per_bar: 1 }, as: FormulationScientist, captures: { fm: "$.data.id" } }
            - { call: "POST /mfg/lines", payload: { name: "L1", capacity_kg_per_hour: 500, slab_weight_kg: 20 }, as: PlantAdmin, captures: { ln1: "$.data.id", ln_v: "$.data.version" } }
            - { call: "POST /mfg/formulas/${fm}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }, { ingredient_id: "${soy}", qty_kg_per_batch: 20, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 25, claim_tags: [] }, as: FormulationScientist, captures: { ra: "$.data.id" } }
            - { call: "POST /mfg/revisions/${ra}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${ra}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${ra}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${ra}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T06:00:00Z" }, as: PlantAdmin }
            - { call: "GET /mfg/agreements/${ag}", payload: {}, as: PlantAdmin, captures: { ag_v1: "$.data.version" } }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${ra}", agreement_id: "${ag}", line_id: "${ln1}", planned_cases: 100, expected_agreement_version: "${ag_v1}" }, as: ProductionPlanner, captures: { runA: "$.data.id" } }
            - { call: "POST /mfg/production-runs/${runA}/schedule", payload: { start_utc: "2026-08-02T08:00:00Z", end_utc: "2026-08-02T10:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionPlanner }
            - { call: "POST /mfg/production-runs/${runA}/verify-pre-run", payload: {}, as: QualityManager }
            - { call: "POST /mfg/production-runs/${runA}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /mfg/production-runs/${runA}/complete", payload: { produced_cases: 100, scrapped_cases: 0 }, as: ProductionPlanner }
            - { call: "POST /mfg/formulas/${fm}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${soy}", qty_kg_per_batch: 30, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 15, claim_tags: [] }, as: FormulationScientist, captures: { rb: "$.data.id" } }
            - { call: "POST /mfg/revisions/${rb}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rb}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${rb}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rb}/approve", payload: {}, as: QualityManager }
