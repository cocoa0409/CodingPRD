  # ===========================================================================
  # Rule 5 — Priority-pair validation conflicts, three different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: bind_policy_state_error_precedes_limit_minimum_rejects_superseded_quote
        grounds:
          - validations[12].ERR_INVALID_POLICY_STATE
          - validations[51].ERR_LIMIT_BELOW_MINIMUM
          - state_machines.CostCapPolicy.QUOTED_to_SUPERSEDED
          - calculations.cost_cap_premium
        distinguishing_aspect: |
          Category pair = state (priority 12) versus business_fiscal
          (priority 51). The superseded first quote violates BOTH: its status is
          SUPERSEDED (12) and its limit_cents of 10000000 is below
          MIN_LIMIT_CENTS 25000000 (51). The response must be
          ERR_INVALID_POLICY_STATE / 409. The second bind proves the fiscal rule
          is genuinely violated too: a QUOTED policy with the same limit returns
          ERR_LIMIT_BELOW_MINIMUM / 422.
        test_recipe:
          setup:
            - "Shared prefix through the ENROLLED enrollment."
            - "The site's only plan carries a single MONITORING/GROUNDWATER line (10 units at 100000 cents) with years_to_construction_start 2, so total_estimate_cents is 1714373 and the UNDERWRITING estimate is 2174597."
            - "One VAPOR_MITIGATION control satisfies the RESTRICTED goal's credited-control check; the plan is driven to APPROVED."
            - "Two quotes are created on that plan; each derives limit_cents 10000000 (ceil_to_step(652379)) and attachment_point_cents 2392057, and the first quote becomes SUPERSEDED when the second is created."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_insurer
            - *k_lab
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_clock_dec
            - *k_p2
            - *k_p2fa
            - *k_p2fb
            - *k_p2fc
            - *k_p2sub
            - *k_p2app
            - *k_g1
            - *k_g2
            - *k_enr
            - *k_elig
            - &k_planS
              call: "POST /remedial-action-plans"
              payload:
                vcp_enrollment_id: "${enr_id}"
                site_id: "${site_id}"
                remedy_narrative: "Monitored natural attenuation with vapour mitigation."
                basis_assessment_phase_id: "${p2_id}"
                years_to_construction_start: 2
                cost_lines:
                  - { cost_category: MONITORING, media: GROUNDWATER, quantity: 10, unit_cost_cents: 100000 }
                expected_vcp_enrollment_version: "${enr_v1}"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { planS_id: $.data.id }
            - &k_ctlS
