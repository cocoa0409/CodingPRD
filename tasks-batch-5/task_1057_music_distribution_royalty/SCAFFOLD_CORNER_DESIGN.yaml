      - name: request_without_role_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A POST /api/releases sent with the X-User-Role header omitted entirely returns 401 ERR_UNAUTHENTICATED before role, existence or body checks run."
        test_recipe:
          setup: ["Artist SCUTUM exists with an ACTIVE PRO subscription."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /api/subscription-plans"
              payload: { code: "PRO", name: "Pro", annual_fee_cents: 2000, included_release_slots: 5, commission_bps: 1500, allows_content_id: true }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /api/artists"
              payload: { display_name: "Scutum", legal_name: "Scutum LLC", country_code: "US", email: "scutum@example.com" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { artist_id: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { artist_id: "${artist_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /api/subscriptions/${sub_id}/activate"
              payload: { payment_reference: "pay-scutum-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
