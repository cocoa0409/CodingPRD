            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 35 }, as: QAInspector }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_20MIN", serial_capacity: 2 }, as: PlantManager, captures: { roll_id: $.data.id } }
          trigger:
            - { call: "GET /millwork/fire-label-rolls/${roll_id}", as: Any, captures: { rv1: $.data.version } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll_id}", expected_roll_version: "${rv1}" }, as: LabelAuthority, as_user_id: "la-1", captures: { alloc1: $.data.id } }
            - { call: "GET /millwork/fire-label-rolls/${roll_id}", as: Any, captures: { issued1: $.data.serials_issued, applied1: $.data.serials_applied, spoiled1: $.data.serials_spoiled, avail1: $.data.serials_available } }
            - { call: "PUT /millwork/label-allocations/${alloc1}/status", payload: { target_status: "VOIDED" }, as: LabelAuthority, as_user_id: "la-1" }
            - { call: "GET /millwork/fire-label-rolls/${roll_id}", as: Any, captures: { issued2: $.data.serials_issued, applied2: $.data.serials_applied, spoiled2: $.data.serials_spoiled, avail2: $.data.serials_available } }
          assert:
            - "after issue: ${issued1} == 1, ${applied1} == 0, ${spoiled1} == 0, ${avail1} == 1 (sum == 2 == capacity)"
            - "after void: ${issued2} == 0, ${applied2} == 0, ${spoiled2} == 1, ${avail2} == 1 (sum still == 2; availability NOT restored)"
            - "LabelAllocation.${alloc1}.status == VOIDED"
      - name: trip_leaf_commitment_symmetry
        grounds:
          - calculations.trip_load_accounting
          - entities.DeliveryTrip.fields.leaves_committed
        distinguishing_aspect: |
          Conserved quantity = trip leaf commitment identity: leaves_committed
          == sum(leaf_count of assigned SCHEDULED openings), and the
          assign-then-unassign pair restores leaves_committed, ship_status and
          assigned_trip_id exactly (no drift). Different conserved quantity
          than label serials above.
        test_recipe:
          setup:
            - "Unrated PAINT_GRADE order; opening U1 (2 leaves) STAGED; trip capacity 6 PLANNED."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Sym Proj", site_address: "4 Load Way", contract_code: "C-9102" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-9102", species: "PAINT_GRADE", profile_code: "PR-1", finish_system: "PAINT", sheen_target: "MATTE", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "U1", width_in: 36, height_in: 84, leaf_count: 2, fire_rating: "NONE", required_on_site_date: "2026-10-05" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 45 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-U", supported_species: ["PAINT_GRADE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 6, end_hour: 8 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-U" }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 8, cure_end_hour: 12 }, as: ProductionLead, captures: { batch_id: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 15 }, as: QAInspector }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead }
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-SYM", truck_capacity_leaves: 6, departure_date: "2026-10-02", site_arrival_date: "2026-10-04" }, as: PlantManager, captures: { trip_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator, captures: { c_after_assign: $.data.leaves_committed } }
            - { call: "POST /millwork/delivery-trips/${trip_id}/unassign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator, captures: { c_after_unassign: $.data.leaves_committed } }
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator, captures: { c_after_reassign: $.data.leaves_committed } }
          assert:
            - "captured ${c_after_assign} == 2 and Opening.${op1}.ship_status == SCHEDULED"
            - "captured ${c_after_unassign} == 0 and Opening.${op1}.ship_status == UNSCHEDULED and Opening.${op1}.assigned_trip_id == null"
            - "captured ${c_after_reassign} == 2 (assign/unassign pair leaves the committed total unchanged)"
