        excluded_because:
          difficulty_instance: non_linear_state_machine / withdrawal_request_forks_into_two_approval_branches_with_disjoint_effects
          rationale: "The requester-cannot-execute split, and the successful execution by tr-exec-9 immediately afterwards, are asserted by the named §1.8 instance."

  # ===========================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_cycle_version_on_round_open_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consensus_round_on_cycle]
          - validations[priority 7 ERR_STALE_CYCLE_VERSION]
          - endpoints[POST /consensus-rounds]
        distinguishing_aspect: |
          The OCC field is pinned to the version READ BEFORE lock-inputs: lock-inputs bumps the cycle
          from 1 to 2, so replaying the stale 1 returns ERR_STALE_CYCLE_VERSION 412 and no round is
          created, while the same call with the post-lock version succeeds — the guard therefore
          detects an intervening write rather than merely checking existence.
        test_recipe:
          setup:
            - "One PIT source and one DRAFT FY2027 cycle with a complete 6000/2500/1500 scenario set. The cycle's version is captured at creation (1) and again after lock-inputs (2)."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id, cyc_v_stale: $.data.version } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v_fresh: $.data.version } }
          trigger:
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v_stale}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v_fresh}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
          assert:
            - "${cyc_v_stale} == 1 and ${cyc_v_fresh} == 2"
            - "first trigger: HTTP 412 and ${err} == ERR_STALE_CYCLE_VERSION; GET /consensus-rounds with cycle_id ${cyc} returns total_count == 0"
            - "second trigger: HTTP 201; ConsensusRound.${rnd}.status == OPEN, round_number == 1, cycle_id == ${cyc}"
            - "ForecastCycle.${cyc}.version == 2 (the rejected attempt did not bump it)"

      - name: stale_expected_fund_version_on_withdrawal_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[withdrawal_request_on_fund]
          - validations[priority 8 ERR_STALE_FUND_VERSION]
          - endpoints[POST /withdrawal-requests]
        distinguishing_aspect: |
          The second declared concurrency rule guards a different parent with a different code: the
          fund version read before certification (1) is stale after certify bumps it to 2, so
          POST /withdrawal-requests returns ERR_STALE_FUND_VERSION 412 — a distinct error_id from the
          cycle rule's ERR_STALE_CYCLE_VERSION — and the retry with 2 is accepted.
        test_recipe:
          setup:
            - "SHORT chain in CONSENSUS_REACHED, plus a fund created BEFORE certification whose version 1 is captured at creation. certify then bumps the fund to version 2."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/ratify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id, fnd_v_stale: $.data.version } }
            - { call: "POST /forecast-cycles/${cyc}/certify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "GET /reserve-funds/${fnd}", payload: {}, as: ReserveTreasurer, as_user_id: "tr-1", captures: { fnd_v_fresh: $.data.version } }
          trigger:
            - { call: "POST /withdrawal-requests", payload: { fund_id: "${fnd}", cycle_id: "${cyc}", requested_amount_cents: 5000000, justification_type: "SUPERMAJORITY_VOTE", deadline_date: "2026-12-31", expected_fund_version: "${fnd_v_stale}" }, as: ReserveTreasurer, as_user_id: "tr-req-1", captures: { err: $.data.error_id } }
            - { call: "POST /withdrawal-requests", payload: { fund_id: "${fnd}", cycle_id: "${cyc}", requested_amount_cents: 5000000, justification_type: "SUPERMAJORITY_VOTE", deadline_date: "2026-12-31", expected_fund_version: "${fnd_v_fresh}" }, as: ReserveTreasurer, as_user_id: "tr-req-1", captures: { req: $.data.id } }
          assert:
            - "${fnd_v_stale} == 1 and ${fnd_v_fresh} == 2 (certify wrote the fund's adequacy fields)"
            - "first trigger: HTTP 412 and ${err} == ERR_STALE_FUND_VERSION, distinct from ERR_STALE_CYCLE_VERSION"
            - "second trigger: HTTP 201; WithdrawalRequest.${req}.status == DRAFT, requested_amount_cents == 5000000, requester_user_id == \"tr-req-1\""
            - "GET /withdrawal-requests with fund_id ${fnd} returns total_count == 1 (the rejected attempt persisted nothing)"

      - name: reserve_fund_version_increments_on_every_write_path
        claim_type: optimistic_concurrency
        grounds:
          - entities.ReserveFund.common_fields
          - endpoints[POST /reserve-funds/{id}/deposits]
          - endpoints[POST /reserve-funds/{id}/recompute-adequacy]
        distinguishing_aspect: |
          The OCC counter moves for INDIRECT writes too, not just for direct PATCHes: create is 1,
          the certify cascade takes it to 2, a manual deposit to 3 and recompute-adequacy to 4 —
          four monotonic steps, of which only one was addressed to a /reserve-funds write endpoint.
        test_recipe:
          setup:
            - "SHORT chain in CONSENSUS_REACHED and a fund with opening_balance_cents 50000000 (version 1). After certify the balance is unchanged at 50000000 (no deposit was owed) with cap_cents 129645668, so a 10000000 manual deposit fits inside the headroom of 79645668."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/ratify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /reserve-funds", payload: { name: "Budget Stabilization Fund", cap_pct_bps: 1000, trend_growth_rate_bps: 300, capture_rate_bps: 5000, deposit_rule_variant: "GROWTH_ABOVE_TREND", eligible_seats: 11, annual_withdrawal_cap_pct_bps: 3000, cooling_off_days: 3, opening_balance_cents: 50000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { fnd: $.data.id, v1: $.data.version } }
            - { call: "POST /forecast-cycles/${cyc}/certify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "GET /reserve-funds/${fnd}", payload: {}, as: ReserveTreasurer, as_user_id: "tr-1", captures: { v2: $.data.version } }
            - { call: "POST /reserve-funds/${fnd}/deposits", payload: { amount_cents: 10000000, memo: "Supplemental transfer within remaining headroom" }, as: ReserveTreasurer, as_user_id: "tr-1" }
            - { call: "GET /reserve-funds/${fnd}", payload: {}, as: ReserveTreasurer, as_user_id: "tr-1", captures: { v3: $.data.version } }
            - { call: "POST /reserve-funds/${fnd}/recompute-adequacy", payload: {}, as: ReserveTreasurer, as_user_id: "tr-1", captures: { v4: $.data.version } }
          assert:
            - "${v1} == 1, ${v2} == 2, ${v3} == 3, ${v4} == 4 — strictly increasing by one per write"
            - "after ${v2}: balance_cents == 50000000, cap_cents == 129645668, headroom_cents == 79645668, coverage_ratio_bps == 7713"
            - "after ${v3}: balance_cents == 60000000, coverage_ratio_bps == 9255, adequacy_band == ADEQUATE, deposit_posture == ACCEPTING"
            - "after ${v4}: balance_cents == 60000000 and coverage_ratio_bps == 9255 — recompute is idempotent in VALUE while still bumping version"

      - name: certification_cascade_reaches_fund_posture_and_briefing_staleness
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /forecast-cycles/{id}/certify]
        excluded_because:
          difficulty_instance: transitive_cascade / certification_cascades_deposit_then_cap_posture_then_briefing_staleness
          rationale: "The three-level chain cycle -> transaction -> fund posture -> briefing staleness is asserted level by level, in order, by the named §1.8 instance."

      - name: both_reconciliation_variants_produce_different_reconciled_totals
        claim_type: dual_variant_calculation
        grounds:
          - calculations.reconciled_total.variants
        excluded_because:
          difficulty_instance: dual_variant_calculation / reconciliation_policy_variant_divergence_on_consensus_round
          rationale: "The MIDPOINT_AVERAGE vs LOWER_OF_TWO delta on byte-identical inputs is asserted by the named §1.8 instance."

      - name: coverage_band_thresholds_tested_at_their_exact_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.reserve_adequacy.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / coverage_ratio_strong_band_at_exactly_10000_bps_versus_9999
          rationale: "The 9999-vs-10000 bps band flip, one cent either side of the required reserve, is asserted by the named §1.8 instance."

      - name: fund_balance_reconciles_with_its_ledger_after_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ReserveFund.fields.balance_cents
          - entities.ReserveTransaction.fields.signed_amount_cents
        excluded_because:
          difficulty_instance: compensating_invariant / fund_ledger_identity_conserved_across_withdrawal_and_reversal
          rationale: "balance_cents == fy_opening + sum(signed_amount_cents) is asserted after the deposit, after the withdrawal and after the reversal by the named §1.8 instance."

  # ===========================================================================
  # SECTION 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: writes_are_visible_in_the_same_response_and_in_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /revenue-sources]
          - endpoints[GET /revenue-sources/{id}]
        distinguishing_aspect: |
          Consistency is immediate with no read-your-write lag anywhere in the chain: the create
          response already carries every system and default field, a GET issued immediately after
          returns byte-identical values, and a derived counter written by a LATER call
          (posted_actual_count on the source) is likewise visible in the very next read with no
          settle time.
        test_recipe:
          setup:
            - "Empty database, clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id, created_v: $.data.version, created_status: $.data.status } }
            - { call: "GET /revenue-sources/${src_pit}", payload: {}, as: RatingAnalyst, as_user_id: "ra-1", captures: { read_v: $.data.version, read_status: $.data.status } }
            - { call: "GET /revenue-sources", payload: {}, as: RatingAnalyst, as_user_id: "ra-1" }
          assert:
            - "first trigger: HTTP 201; ${created_v} == 1 and ${created_status} == ACTIVE — the defaults are in the create response itself, not only in a later read"
            - "second trigger: HTTP 200 with ${read_v} == ${created_v} and ${read_status} == ${created_status}"
            - "second trigger: base_year_receipts_cents == 1234567800, the four elasticities are 4150 / 7825 / 640 / 1420, volatility_class == MEDIUM, mape_bps == 0, posted_actual_count == 0, methodology_flag == false"
            - "third trigger: total_count == 1 and has_more == false — the row is in the collection read immediately, with no settle period"
            - "every response body is wrapped in the standard envelope, and created_at == updated_at == \"2026-08-01T00:00:00Z\""
