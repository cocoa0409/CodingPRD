            - "Enrollment.${enr_id}.provider_id == ${p2_id} and transfer_count == 1"
            - "Enrollment.${enr_id}.benefit_start_date == 2026-08-01, port_freeze_until == 2026-09-30 and recert_due_date == 2027-08-01 - all preserved verbatim"
            - "Device.${dev1_id}.status == RECLAIM_PENDING and Enrollment.${enr_id}.device_status == RECLAIM_PENDING"
            - "Enrollment.${enr_id}.usage_status == PENDING_FIRST_USE with last_usage_at null"
            - "Enrollment.${enr_id}.audit_risk_score == 25 (10 for one issuance + 15 for the transfer)"
