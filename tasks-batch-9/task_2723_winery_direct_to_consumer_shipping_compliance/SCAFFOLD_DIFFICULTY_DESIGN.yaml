            - "Order.${oa_id}.compliance_status == \"REJECTED\" and Order.${oa_id}.rejection_error_id == \"ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED\""

      - name: permit_revoke_three_hop_cascade_to_winery_counter
        grounds:
          - state_machines.StatePermit.ACTIVE_to_REVOKED
          - state_machines.Order.CLEARED_to_SUSPENDED_PERMIT
          - state_machines.ClubSubscription.ACTIVE_to_SUSPENDED_COMPLIANCE
          - entities.ClubSubscription.fields.next_run_date
          - entities.Winery.fields.suspended_subscription_count
        distinguishing_aspect: |
          A different trigger (permit revocation, not a carrier scan) propagates exactly three hops
          across three different entities — StatePermit -> Order -> ClubSubscription -> Winery
          counter — and the club subscription's next_run_date is nulled so the scheduler can never
          pick it up again.
        test_recipe:
          setup:
            - "Winery Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; Consumer Ada is ID-verified. Clock 2026-08-01."
            - "Ada has an ACTIVE MONTHLY ClubSubscription (6 x 750 ml @ 2600 c, next_run_date 2026-08-15, annual_allotment 12)."
