              payload: { data_file_id: "${x5_file_id}", account_ref: "ABC4201", sequence_no: 1, statement_amount_cents: 4000, address_line1: "4200 Duplex Drive", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4201" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${x5_file_id}", account_ref: "ABC4202", sequence_no: 2, statement_amount_cents: 4000, address_line1: "4202 Duplex Drive", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4202" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${x5_file_id}", account_ref: "ABC4203", sequence_no: 3, statement_amount_cents: 4000, address_line1: "4204 Duplex Drive", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "4203" }
