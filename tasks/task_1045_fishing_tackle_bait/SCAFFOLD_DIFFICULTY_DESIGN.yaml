          - "errors[ERR_LICENSE_OUT_OF_SEASON]"
        distinguishing_aspect: "A single license-sale violates both the age-requirement safety rule (age 12 < min_age 16, priority 7) and the season temporal rule (clock 2026-07-10 before season start 2026-08-01, priority 8); safety wins — category pair business_safety x business_temporal (distinct from the state x constraint pair)."
