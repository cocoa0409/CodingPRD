              captures: { e_state: $.data.error_id }
            - call: "GET /provost/decision-records/${dec_id}"
              payload: {}
              as: Provost
              as_user_id: "provost-third"
          assert:
            - "${e_self} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — same user id as proposed_by_user_id"
            - "the second call returns 200 with state RATIFIED, ratified_by_user_id provost-ratifier, ratification_note \"Board ratified.\" and ratified_at 2026-09-15T10:00:00Z; two agency notifications are auto-minted"
            - "${e_self_again} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 and NOT ERR_DECISION_STATE_INVALID — priority 6 outranks priority 12, so the proposer never learns that the decision is already RATIFIED"
            - "${e_state} == ERR_DECISION_STATE_INVALID with HTTP 409 — a THIRD provost passes the duties check and is stopped by the state machine instead, which is what proves the two checks are distinct and ordered"
            - "the decision read shows ratification_note still \"Board ratified.\" and ratified_by_user_id still provost-ratifier — neither refusal overwrote the ratification"

      - name: a_chair_and_a_reviewer_are_confined_to_their_own_records
        claim_type: exclusive_operations
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_NOT_PROGRAM_OWNER]
          - errors[ERR_NOT_ASSIGNED_REVIEWER]
          - roles.ProgramChair
          - roles.ExternalReviewer
        distinguishing_aspect: |
          Both entity-backed roles are scoped by identity, and the scope follows
          the parent chain rather than the URL: a chair is refused on a
          self-study, a plan and an appointment that belong to another program,
          each resolved transitively to a program id that is not theirs. The
          reviewer scope is per visit, so reviewer B is refused on both the write
          and the read of reviewer A's report while reviewer A succeeds on the
          identical read. Ownership is checked at priority 4, ahead of every state
          and body check, so a chair's refused call cannot be distinguished by
          payload.
        test_recipe:
          setup:
            - "Two independent programs, HIST-BA and PHIL-BA, each with a review cycle and a DRAFT self-study; two external reviewers, only one of whom is assigned to the HIST visit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
