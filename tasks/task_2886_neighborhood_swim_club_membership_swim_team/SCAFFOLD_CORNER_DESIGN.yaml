# =============================================================================
# 1.9 Scaffold Corner Design (Behavior Coverage Index)
#
# A breadth walk of references/claim-extraction-guide.md over the surface already
# declared in SCAFFOLD.yaml §1.1-§1.7. Every `section:` and every `claim_type:`
# below is a row name taken from that guide; none are invented. Where a corner is
# already asserted by one of the 18 instances in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# the entry is a stub carrying `excluded_because:` and NO test_recipe.
#
# This file declares no new behavior: deleting it changes nothing about the API,
# only the auditability of coverage. Every literal in an `assert:` line was
# produced by executing the relevant §1.3 formula against its constants in
# Python. Every ${var} is bound by a `captures:` block earlier in the same
# instance. The logical clock starts at 2026-08-01T00:00:00Z, so every instance
# that depends on a season window moves it explicitly as its first call.
#
# Two guide rows are deliberately empty here and say so rather than inventing a
# claim:
#   * entities / Immutability - §1.5 declares no PATCH or PUT endpoint at all, so
#     no field can be re-sent for update; immutability is enforced structurally
#     (assessed_dues_cents and initiation_fee_cents are stamped once at creation,
#     which is asserted by seasonal_dues_calendar_day_vs_swim_week_on_membership).
#   * complexity_layers / ops_run_checkpoint - the guide's layer table has no row
#     for it; the checkpoint endpoint is covered under
#     endpoints / bulk_action instead.
#
# An error-catalog audit (guide Table 6) sits at the END of this file: all 59
# §1.6 codes mapped to the instance that triggers each one.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Entities (guide Table 1) - topology `graph`
  # ===========================================================================
  - section: entities
    instances:

      - name: creation_membership_category_echoes_every_declared_input_field
        claim_type: creation
        grounds:
          - entities.MembershipCategory
          - endpoints[POST /swim-club/membership-categories]
        distinguishing_aspect: |
          The plain create path for the one entity whose every field is client-supplied:
          MembershipCategory has no computed field at all, so a 201 must echo all eleven
          inputs unchanged alongside the four common system fields. Any implementation
          that quietly coerces cents to a float or drops a boolean flag fails here
          before any business rule is reached.
        test_recipe:
          setup:
            - "An empty club. No season, household or category exists yet."
            - "The logical clock is moved off its 2026-08-01 default so created_at is unambiguous."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family (two adults plus dependents)", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id, cat_ver: $.data.version }
          assert:
            - "HTTP 201"
            - "response_type is object and the payload sits under data per §1.0"
            - "data.code == FAMILY, data.label == 'Family (two adults plus dependents)'"
            - "data.bond_cents == 120000, data.initiation_fee_cents == 45000, data.seasonal_dues_cents == 78000 - all integer cents, never a decimal string"
            - "data.guest_pass_allotment == 4, data.max_household_size == 6, data.volunteer_credits_required == 4"
            - "data.waitlist_required == false, data.proration_allowed == true, data.party_privileges == true"
            - "the four common system fields id, created_at, updated_at and version are all present and non-null"

      - name: retrieval_new_household_reads_back_with_all_ledger_counters_zeroed
        claim_type: retrieval
        grounds:
          - entities.Household
          - endpoints[POST /swim-club/households]
          - endpoints[GET /swim-club/households/{id}]
        distinguishing_aspect: |
          Household is the money aggregate: six of its counters are computed and must all read
          back as 0 on a brand-new row, with standing GOOD_STANDING and bond_status NONE. This
          is the baseline every ledger assertion elsewhere in this file measures drift against,
          and it also pins that a GET returns the same representation as the POST that made it.
        test_recipe:
          setup:
            - "A household is created with no membership, so no category has yet granted it any guest passes."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Nadia Okonkwo", address_line: "3 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id, h_standing_post: $.data.standing, h_bond_post: $.data.bond_status }
          trigger:
            - call: "GET /swim-club/households/${h_id}"
              payload: {}
              as: Treasurer
              captures: { h_standing_get: $.data.standing, h_bond_get: $.data.bond_status, h_points: $.data.conduct_points, h_bal: $.data.guest_pass_balance }
          assert:
            - "HTTP 200"
            - "data.standing == GOOD_STANDING and data.bond_status == NONE"
            - "data.bond_paid_cents == 0, data.prior_member == false, data.guest_pass_allotment_granted == 0"
            - "data.conduct_points == 0, data.guest_passes_consumed == 0, data.guest_pass_balance == 0"
            - "data.guest_fee_owed_cents == 0, data.party_charges_owed_cents == 0, data.account_credit_cents == 0"
            - "data.transferred_from_household_id == null and data.member_count == 4"
            - "the GET representation equals the POST representation field for field, so no counter is computed only on write"

      - name: listing_memberships_filtered_by_season_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /swim-club/memberships]
          - entities.Membership.fields.season_id
        distinguishing_aspect: |
          Pagination is asserted against a filtered set, not the whole table: three memberships
          exist in the 2027 season and one in 2028, so total_count must be 3 (the filtered count)
          rather than 4, and has_more must flip false on the second page. A limit that is applied
          before the season filter, or a total_count taken from the unfiltered table, is caught.
        test_recipe:
          setup:
            - "One COUPLE category with waitlist_required false, so memberships can be created without an offer."
            - "Two OPEN seasons, 2027 and 2028, with matched windows."
            - "Three households each hold one 2027 membership; the first household also holds one 2028 membership."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_couple_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/seasons"
              payload: { year: 2028, open_date: "2028-05-20", close_date: "2028-09-04", dues_due_date: "2028-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s28_id: $.data.id }
            - call: "POST /swim-club/seasons/${s28_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "House One", address_line: "1 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h1_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "House Two", address_line: "2 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h2_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "House Three", address_line: "3 Cedar Court", residency: "OUT_OF_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h3_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h1_id}", membership_category_id: "${cat_couple_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m1_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h2_id}", membership_category_id: "${cat_couple_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m2_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h3_id}", membership_category_id: "${cat_couple_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m3_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h1_id}", membership_category_id: "${cat_couple_id}", season_id: "${s28_id}", join_date: "2028-05-20", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m4_id: $.data.id }
          trigger:
            - call: "GET /swim-club/memberships"
              payload: { season_id: "${s27_id}", limit: 2, offset: 0 }
              as: Treasurer
              captures: { page_1: $.data }
            - call: "GET /swim-club/memberships"
              payload: { season_id: "${s27_id}", limit: 2, offset: 2 }
              as: Treasurer
              captures: { page_2: $.data }
            - call: "GET /swim-club/memberships"
              payload: { household_id: "${h1_id}" }
              as: Treasurer
              captures: { page_h1: $.data }
          assert:
            - "page 1: HTTP 200, response_type array, exactly 2 rows, total_count == 3 (the 2028 membership is filtered out), has_more == true, limit == 2, offset == 0"
            - "page 2: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the union of page 1 and page 2 ids is exactly {${m1_id}, ${m2_id}, ${m3_id}} with no duplicate and no omission"
            - "the household filter returns exactly 2 rows (${m1_id} and ${m4_id}) with total_count == 2, proving the two filters are independent"
            - "the third call omits limit and offset entirely and still succeeds, defaulting to limit 10 and offset 0 per §1.0"

      - name: not_found_core_registry_ids_return_entity_specific_404s
        claim_type: not_found
        grounds:
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_CATEGORY_NOT_FOUND]
          - errors[ERR_HOUSEHOLD_NOT_FOUND]
          - errors[ERR_WAITLIST_ENTRY_NOT_FOUND]
          - errors[ERR_MEMBERSHIP_NOT_FOUND]
        distinguishing_aspect: |
          Existence errors are entity-specific, not a single generic 404: five reads against five
          well-formed but unknown ids must return five DIFFERENT error_id values. An implementation
          that funnels every miss through one ERR_NOT_FOUND passes a status-code check and fails
          this one. All five calls use non-Member roles so priority 4 ownership never intercepts.
        test_recipe:
          setup:
            - "An empty club: no entity of any kind has been created, so every id below is unknown."
            - "Each id is a syntactically valid UUID, so the shape gate at priority 10 cannot fire first."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /swim-club/seasons/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: BoardPresident
              captures: { err_season: $.data.error_id }
            - call: "GET /swim-club/membership-categories/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: MembershipChair
              captures: { err_category: $.data.error_id }
            - call: "GET /swim-club/households/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: MembershipChair
              captures: { err_household: $.data.error_id }
            - call: "GET /swim-club/waitlist-entries/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: MembershipChair
              captures: { err_waitlist: $.data.error_id }
            - call: "GET /swim-club/memberships/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: Treasurer
              captures: { err_membership: $.data.error_id }
          assert:
            - "all five responses are HTTP 404 with response_type error"
            - "${err_season} == ERR_SEASON_NOT_FOUND"
            - "${err_category} == ERR_CATEGORY_NOT_FOUND"
            - "${err_household} == ERR_HOUSEHOLD_NOT_FOUND"
            - "${err_waitlist} == ERR_WAITLIST_ENTRY_NOT_FOUND"
            - "${err_membership} == ERR_MEMBERSHIP_NOT_FOUND"
            - "the five error_id values are pairwise distinct"

      - name: not_found_operations_ids_return_entity_specific_404s
        claim_type: not_found
        grounds:
          - errors[ERR_GUEST_VISIT_NOT_FOUND]
          - errors[ERR_LIFEGUARD_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_GUARD_SHIFT_NOT_FOUND]
          - errors[ERR_REGISTRATION_NOT_FOUND]
        distinguishing_aspect: |
          The same claim on the operations half of the model, where Certification is the only
          child entity in §1.1: a miss on the child must return ERR_CERTIFICATION_NOT_FOUND and
          not the parent's ERR_LIFEGUARD_NOT_FOUND, which is the mistake a parent-scoped lookup
          makes.
        test_recipe:
          setup:
            - "An empty club: no lifeguard, certification, shift, visit or registration exists."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /swim-club/guest-visits/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: PoolManager
              captures: { err_visit: $.data.error_id }
            - call: "GET /swim-club/lifeguards/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: PoolManager
              captures: { err_guard: $.data.error_id }
            - call: "GET /swim-club/certifications/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: PoolManager
              captures: { err_cert: $.data.error_id }
            - call: "GET /swim-club/guard-shifts/00000000-0000-4000-8000-000000000014"
              payload: {}
              as: PoolManager
              captures: { err_shift: $.data.error_id }
            - call: "GET /swim-club/swim-team-registrations/00000000-0000-4000-8000-000000000015"
              payload: {}
              as: SwimTeamCoach
              captures: { err_reg: $.data.error_id }
          assert:
            - "all five responses are HTTP 404 with response_type error"
            - "${err_visit} == ERR_GUEST_VISIT_NOT_FOUND"
            - "${err_guard} == ERR_LIFEGUARD_NOT_FOUND"
            - "${err_cert} == ERR_CERTIFICATION_NOT_FOUND, not ERR_LIFEGUARD_NOT_FOUND"
            - "${err_shift} == ERR_GUARD_SHIFT_NOT_FOUND"
            - "${err_reg} == ERR_REGISTRATION_NOT_FOUND"
            - "the five error_id values are pairwise distinct"

      - name: not_found_program_and_finance_ids_return_entity_specific_404s
        claim_type: not_found
        grounds:
          - errors[ERR_MEET_NOT_FOUND]
          - errors[ERR_VOLUNTEER_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_PARTY_RESERVATION_NOT_FOUND]
          - errors[ERR_INSPECTION_FINDING_NOT_FOUND]
          - errors[ERR_CONDUCT_CASE_NOT_FOUND]
          - errors[ERR_CAPITAL_PROJECT_NOT_FOUND]
        distinguishing_aspect: |
          Closes the existence sweep over the remaining six aggregates, including the two
          restricted-visibility ones: CapitalProject is readable only by Treasurer and
          BoardPresident and InspectionFinding only by HealthInspector, PoolManager and
          BoardPresident, so each call also proves the 404 is reached by an authorized role
          rather than being masked by a 403.
        test_recipe:
          setup:
            - "An empty club: no meet, assignment, reservation, finding, conduct case or project exists."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /swim-club/meets/00000000-0000-4000-8000-000000000021"
              payload: {}
              as: SwimTeamCoach
              captures: { err_meet: $.data.error_id }
            - call: "GET /swim-club/volunteer-assignments/00000000-0000-4000-8000-000000000022"
              payload: {}
              as: SwimTeamCoach
              captures: { err_assign: $.data.error_id }
            - call: "GET /swim-club/party-reservations/00000000-0000-4000-8000-000000000023"
              payload: {}
              as: PoolManager
              captures: { err_party: $.data.error_id }
            - call: "GET /swim-club/inspection-findings/00000000-0000-4000-8000-000000000024"
              payload: {}
              as: HealthInspector
              captures: { err_finding: $.data.error_id }
            - call: "GET /swim-club/conduct-cases/00000000-0000-4000-8000-000000000025"
              payload: {}
              as: BoardPresident
              captures: { err_conduct: $.data.error_id }
            - call: "GET /swim-club/capital-projects/00000000-0000-4000-8000-000000000026"
              payload: {}
              as: Treasurer
              captures: { err_project: $.data.error_id }
          assert:
            - "all six responses are HTTP 404 with response_type error"
            - "${err_meet} == ERR_MEET_NOT_FOUND"
            - "${err_assign} == ERR_VOLUNTEER_ASSIGNMENT_NOT_FOUND"
            - "${err_party} == ERR_PARTY_RESERVATION_NOT_FOUND"
            - "${err_finding} == ERR_INSPECTION_FINDING_NOT_FOUND"
            - "${err_conduct} == ERR_CONDUCT_CASE_NOT_FOUND"
            - "${err_project} == ERR_CAPITAL_PROJECT_NOT_FOUND"
            - "the six error_id values are pairwise distinct"

      - name: required_fields_season_create_without_capacity_returns_validation
        claim_type: required_fields
        grounds:
          - endpoints[POST /swim-club/seasons]
          - validations[priority=10]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          bather_load_capacity is a REQUIRED input that also carries a declared default of 120 on
          the entity. The corner is that a default does not make an input optional: omitting it
          must be rejected at priority 10 rather than silently defaulted, while the two genuinely
          optional inputs (proration_basis, guest_settlement_policy) may be omitted in the same
          request shape and succeed.
        test_recipe:
          setup:
            - "No 2027 season exists, so the uniqueness constraint on year cannot mask the shape error."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0 }
              as: BoardPresident
              captures: { err_missing: $.data.error_id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s_id: $.data.id, s_basis: $.data.proration_basis, s_policy: $.data.guest_settlement_policy }
          assert:
            - "the first call is HTTP 422 with ${err_missing} == ERR_VALIDATION, and no Season row is created"
            - "the second call is HTTP 201: omitting the two optional inputs is accepted"
            - "the created season has proration_basis == CALENDAR_DAY and guest_settlement_policy == PASS_FIRST, the declared defaults"
            - "GET /swim-club/seasons filtered by year 2027 returns exactly one row, so the rejected request left nothing behind"

      - name: defaults_membership_category_optional_flags_default_to_true
        claim_type: defaults
        grounds:
          - entities.MembershipCategory.fields.waitlist_required
          - entities.MembershipCategory.fields.proration_allowed
          - entities.MembershipCategory.fields.party_privileges
          - endpoints[POST /swim-club/membership-categories]
        distinguishing_aspect: |
          All three optional booleans default to TRUE, which is the surprising direction: a category
          created without flags is waitlist-gated, so the household that joins it needs an accepted
          offer. The instance asserts the defaults and then proves the default is load-bearing by
          showing the same omission makes priority 71 fire downstream.
        test_recipe:
          setup:
            - "One OPEN 2027 season and one household with member_count 2."
            - "The category is created with only its eight required inputs, no boolean flags."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Default Flags Household", address_line: "7 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /swim-club/membership-categories"
              payload: { code: "SENIOR", label: "Senior", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 20000, guest_pass_allotment: 2, max_household_size: 2, volunteer_credits_required: 0 }
              as: MembershipChair
              captures: { cat_id: $.data.id, cat_wl: $.data.waitlist_required, cat_pro: $.data.proration_allowed, cat_party: $.data.party_privileges }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { err_offer: $.data.error_id }
          assert:
            - "HTTP 201 on the category, with data.waitlist_required == true, data.proration_allowed == true and data.party_privileges == true"
            - "no flag defaults to false: an implementation using a falsy zero-value default fails all three"
            - "the membership attempt is HTTP 409 with ${err_offer} == ERR_WAITLIST_OFFER_REQUIRED, because the defaulted waitlist_required is genuinely enforced"
            - "GET /swim-club/memberships filtered by household returns total_count == 0"

      - name: computed_fields_waitlist_entry_rank_and_queue_key_are_server_derived
        claim_type: computed_fields
        grounds:
          - entities.WaitlistEntry.fields.priority_tier_rank
          - entities.WaitlistEntry.fields.queue_key_at
          - endpoints[POST /swim-club/waitlist-entries]
          - calculations.waitlist_offer_selection
        distinguishing_aspect: |
          Both computed fields on WaitlistEntry are derived from other fields of the SAME row and
          are not accepted as input: priority_tier_rank is the LEGACY=0 / SIBLING=1 / STANDARD=2
          encoding of priority_tier, and queue_key_at equals created_at until a requeue moves it.
          The corner is the numeric direction of the rank - a 1-based encoding sorts identically
          but publishes the wrong integers, and the sort key is what
          waitlist_offer_selection reads.
        test_recipe:
          setup:
            - "One waitlist-gated FAMILY category."
            - "Three households, each joining the queue in a different priority tier."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: true, proration_allowed: true, party_privileges: true }
