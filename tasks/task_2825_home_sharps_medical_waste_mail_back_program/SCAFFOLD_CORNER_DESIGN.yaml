          - errors[ERR_CERTIFICATE_ALREADY_ISSUED]
          - endpoints.POST /sharps/shipments/{id}/destruction-certificates
        distinguishing_aspect: "Five refusals stacked on the last two calls of the route, each keyed on a different dimension: the conformance axis not yet resolved (409 at priority 29 even though transport is already DELIVERED), a second screening of the same parcel (409 at 30), the screening technician trying to certify their own parcel (403 at 15, the only 403 in the business bands), a destroyed count that misses the sealed count by one (422 at 31), and a replay of a successful certification (409 at 30). Exactly one certificate row may exist at the end."
