scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_cash_vs_accrual_late_report
        grounds:
          - calculations.royalty_recognition
          - entities.RoyaltyStatement.fields.recognized_sales_cents
          - entities.SalesReport.fields.finalized_at
        distinguishing_aspect: |
          Entity domain RoyaltyStatement: identical FINALIZED sales data recognized under the
          ACCRUAL variant (15000000 cents, royalty 450000) vs the CASH variant (10000000 cents,
          royalty 300000) because a report finalized after period end is included by ACCRUAL
          (finalized before generation) but excluded by CASH.
        test_recipe:
          setup:
            - "One licensee with two venues; agreement A (ACCRUAL) over store A, agreement B (CASH) over store B; both stores OPERATING via two shared CERTIFIED baristas"
            - "Each store: report R1 [2026-09-01,2026-09-14] net 10000000 finalized at clock 2026-09-10; report R2 [2026-09-15,2026-09-30] net 5000000 finalized at clock 2026-10-02"
            - "Clock at 2026-10-05 when both statements for September are generated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-1" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "VA", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_a: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "VB", venue_type: "AIRPORT", open_time_utc: "00:00", close_time_utc: "23:59", access_restricted: true, max_equipment_footprint_units: 100, security_badge_required: true }, as: BrandProgramAdmin, captures: { ven_b: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_a}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_a: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_a}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_a}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_a}" }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_b}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "CASH", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_b: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_b}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_b}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_b}" }
            - { call: "POST /licensing/license-agreements/${agr_a}/stores", payload: { store_code: "STA", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_a: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_b}/stores", payload: { store_code: "STB", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_b: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_a}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_a}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_b}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_b}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_a}/sales-reports", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-14", gross_sales_cents: 12000000, returns_cents: 1000000, loyalty_redemption_cents: 1000000 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { r1a: $.data.id } }
            - { call: "POST /licensing/sales-reports/${r1a}/finalize", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_a}/sales-reports", payload: { period_start_date: "2026-09-15", period_end_date: "2026-09-30", gross_sales_cents: 6000000, returns_cents: 500000, loyalty_redemption_cents: 500000 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { r2a: $.data.id } }
            - { call: "POST /licensing/stores/${store_b}/sales-reports", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-14", gross_sales_cents: 12000000, returns_cents: 1000000, loyalty_redemption_cents: 1000000 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { r1b: $.data.id } }
            - { call: "POST /licensing/sales-reports/${r1b}/finalize", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_b}/sales-reports", payload: { period_start_date: "2026-09-15", period_end_date: "2026-09-30", gross_sales_cents: 6000000, returns_cents: 500000, loyalty_redemption_cents: 500000 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { r2b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/sales-reports/${r2a}/finalize", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/sales-reports/${r2b}/finalize", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "GET /licensing/license-agreements/${agr_a}", payload: {}, as: BrandProgramAdmin, captures: { agr_a_v: $.data.version } }
            - { call: "GET /licensing/license-agreements/${agr_b}", payload: {}, as: BrandProgramAdmin, captures: { agr_b_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${agr_a}/royalty-statements", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", expected_agreement_version: "${agr_a_v}" }, as: BrandProgramAdmin, captures: { stmt_a: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_b}/royalty-statements", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", expected_agreement_version: "${agr_b_v}" }, as: BrandProgramAdmin, captures: { stmt_b: $.data.id } }
          assert:
            - "GET /licensing/royalty-statements/${stmt_a}: recognized_sales_cents == 15000000 and royalty_amount_cents == 450000 (ACCRUAL includes the late-finalized R2)"
            - "GET /licensing/royalty-statements/${stmt_b}: recognized_sales_cents == 10000000 and royalty_amount_cents == 300000 (CASH excludes the late-finalized R2)"
            - "stmt_a.royalty_amount_cents - stmt_b.royalty_amount_cents == 150000 (variant divergence on identical raw sales)"

      - name: certification_audited_variant_flips_boundary_pass
        grounds:
          - calculations.certification_exam_outcome
          - entities.Certification.fields.proctor_anomaly
        distinguishing_aspect: |
          Entity domain Certification (distinct from RoyaltyStatement): the same exam score 82
          yields EXAM_PASSED under the raw variant but stays ENROLLED under the audited variant
          because 82 - AUDIT_ANOMALY_PENALTY(5) = 77 < PASS_EXAM_SCORE(80).
        test_recipe:
          setup:
            - "Licensee with two employees each ENROLLED in BARISTA_CORE; no agreement needed because record-exam has no agreement precondition"
          setup_api_calls:
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-2" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
          trigger:
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 82, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 82, proctor_anomaly: true }, as: BrandInspector, as_user_id: "insp-P" }
          assert:
            - "GET /licensing/certifications/${cert1}: status == EXAM_PASSED, exam_score == 82, exam_attempts == 1"
            - "GET /licensing/certifications/${cert2}: status == ENROLLED, exam_score == 82, exam_attempts == 1 (audited variant fails the same raw score)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (three different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_tiered_marginal_straddle
        grounds:
          - calculations.royalty_recognition
          - entities.LicenseAgreement.fields.royalty_tiers
        distinguishing_aspect: |
          Mode (a): a >=3-input formula (recognized sales, tier thresholds, tier rates) with
          non-linear tiered-rate selection and nested min/max marginal allocation; a report of
          60000000 cents straddles the 50000000 threshold so 1500000 + 350000 = 1850000.
        test_recipe:
          setup:
            - "ACCRUAL agreement with tiers [{0,300},{50000000,350}] and one OPERATING store"
            - "One FINALIZED report [2026-09-01,2026-09-30] with gross 60000000, returns 0, loyalty 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-3" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 }, { threshold_cents: 50000000, rate_bps: 350 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/sales-reports", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", gross_sales_cents: 60000000, returns_cents: 0, loyalty_redemption_cents: 0 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { rep_id: $.data.id } }
            - { call: "POST /licensing/sales-reports/${rep_id}/finalize", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "GET /licensing/license-agreements/${agr_id}", payload: {}, as: BrandProgramAdmin, captures: { agr_v: $.data.version } }
          trigger:
            - { call: "POST /licensing/license-agreements/${agr_id}/royalty-statements", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", expected_agreement_version: "${agr_v}" }, as: BrandProgramAdmin, captures: { stmt_id: $.data.id } }
          assert:
            - "RoyaltyStatement.${stmt_id}.recognized_sales_cents == 60000000"
            - "RoyaltyStatement.${stmt_id}.royalty_amount_cents == 18500000 / 100 == 1850000 (tier1 50000000*300/10000=1500000 plus tier2 10000000*350/10000=350000)"

      - name: supply_order_line_rounding_order
        grounds:
          - calculations.supply_order_pricing
          - entities.SupplyOrderLine.fields.line_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned round-per-line-then-sum; three lines of
          150 x 333 cents at 500bps discount give 47453 per line and 142359 total, whereas the
          forbidden sum-then-round order would give 142358 — one cent of observable divergence.
        test_recipe:
          setup:
            - "OPERATING store with three assorted FOOD products, each unit_cost_cents 333, case_pack_units 1"
            - "Approved distributor"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-4" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-1", name: "P1", category: "FOOD", proprietary: false, venue_type_restrictions: [], unit_cost_cents: 333, case_pack_units: 1, footprint_units: 0 }, as: BrandProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-2", name: "P2", category: "FOOD", proprietary: false, venue_type_restrictions: [], unit_cost_cents: 333, case_pack_units: 1, footprint_units: 0 }, as: BrandProgramAdmin, captures: { p2: $.data.id } }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-3", name: "P3", category: "FOOD", proprietary: false, venue_type_restrictions: [], unit_cost_cents: 333, case_pack_units: 1, footprint_units: 0 }, as: BrandProgramAdmin, captures: { p3: $.data.id } }
            - { call: "POST /licensing/stores/${store_id}/assortment-items", payload: { product_item_id: "${p1}", par_level: 100 }, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/assortment-items", payload: { product_item_id: "${p2}", par_level: 100 }, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/assortment-items", payload: { product_item_id: "${p3}", par_level: 100 }, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/distributors", payload: { name: "D1", lead_time_days: 2 }, as: BrandProgramAdmin, captures: { dist_id: $.data.id } }
            - { call: "PATCH /licensing/distributors/${dist_id}", payload: { approved: true }, as: BrandProgramAdmin }
          trigger:
            - { call: "POST /licensing/stores/${store_id}/supply-orders", payload: { distributor_id: "${dist_id}", auto_replenish: false, lines: [ { product_item_id: "${p1}", quantity: 150 }, { product_item_id: "${p2}", quantity: 150 }, { product_item_id: "${p3}", quantity: 150 } ] }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { order_id: $.data.id } }
          assert:
            - "SupplyOrder.${order_id}.total_cost_cents == 142359 (3 x round_half_up(150*333*9500/10000) = 3 x 47453)"
            - "GET /licensing/supply-order-lines?supply_order_id=${order_id}: every element has discount_bps == 500 and line_cost_cents == 47453"
            - "total_cost_cents != 142358 (the sum-then-round alternative is rejected by the pinned rounding order)"

      - name: promotion_price_preview_pinned_order
        grounds:
          - calculations.promotion_price_preview
          - entities.PromotionCampaign.fields.floor_price_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to discount -> floor-clamp -> redemption-cap;
          base 1000 with 30% off raws to 700, clamps UP to the 800 floor, and the 10-point member
          redemption (1000 cents nominal) is capped at 50% of the CLAMPED price (400), giving an
          effective price of 400 — any other evaluation order yields a different number.
        test_recipe:
          setup:
            - "OPERATING store; PLANNED campaign discount_pct 30, floor_price_cents 800"
            - "Loyalty member with points_balance == 10 from a 2000-cent LICENSED earn"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-5" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
