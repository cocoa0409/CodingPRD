  - rule_id: compensating_invariant
    instances:
      - name: rescind_restores_member_org_pledge_capacity_to_its_annual_cap_exactly
        grounds:
          - "state_machines.FundingCommitment.transitions.CONFIRMED_to_RESCINDED"
          - "endpoints[POST /funding-commitments/{id}/rescind]"
          - "entities.MemberOrganization.fields.remaining_pledge_capacity_cents"
          - "entities.MemberOrganization.fields.status"
          - "entities.RecoveryCase.fields.total_committed_cents"
        distinguishing_aspect: "The invariant `committed_cents + remaining_pledge_capacity_cents == annual_pledge_cap_cents` and the status derivation must both come back to their pre-pledge values after a rescission, including flipping CAPPED back to ACTIVE. The presentation's award must be recomputed downward to the bridge-only figure, and the case ledger must follow. An implementation that only marks the row RESCINDED leaves M2 CAPPED with 1500000 permanently consumed, blocking the org from every future table; one that zeroes committed_cents without recomputing remaining_pledge_capacity_cents leaves the invariant broken at 0 + 0 != 1500000."
        test_recipe:
          setup:
            - "Case C22: STRUCTURE verified 3000000 -> unmet 3000000."
            - "M2 has annual_pledge_cap_cents 1500000 and pledges all of it, which flips its status to CAPPED with remaining 0."
            - "An UNRESTRICTED FundingSource of 2000000 is present, so the AWARD assembles TIER_C with bridge_cap 450000, gap 1500000, bridge_authorized_cents 450000 and awarded_cents 1950000; the commitment moves PLEDGED -> CONFIRMED and the case shows total_committed_cents 1950000 / PARTIALLY_COMMITTED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Yamamoto Household", primary_contact_phone: "555-0122", household_size: 3, income_band: "VLI", head_of_household_age: 59, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
