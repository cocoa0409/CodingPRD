  - name: a_neurologist_cannot_act_on_a_consult_assigned_to_a_peer
    claim_type: peer_roles
    grounds:
    - roles.Neurologist identity_rules
    - errors.ERR_NOT_CONSULT_OWNER
    - validations.priority 8
    excluded_because:
      difficulty_instance: consult_decline_loops_assigned_back_to_requested_then_escalates
      rationale: The §1.8 decline-loop instance already drives two credentialed neurologists through accept, decline and re-route on the same consult, where the exclusion list makes the ownership comparison the only thing that can refuse the peer; repeating it as an RBAC instance would re-test the same priority-8 comparison.
- section: cross_cutting_complexity_layers
  instances:
  - name: the_consult_request_rejects_a_case_version_the_requester_itself_invalidated
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules.consult-request-stale-case
    - errors.ERR_STALE_CASE_VERSION (412)
    - validations.priority 22
    - endpoints.POST /stroke-network/consults expected_case_version
    distinguishing_aspect: 'Every version used here is CAPTURED, never guessed, and the interesting one is the version returned by the create itself: imaging-complete advances the case, so the create''s version is already stale by the time the consult is requested. The second half is the trap — a SUCCESSFUL consult request cascades a case version bump, so the value that just worked is immediately stale, and a client that caches it must be refused. The failed 412 must also leave the version untouched, otherwise retry loops never converge.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, ACTIVE agreement and one board-certified ON_CALL Neurologist.
      - One CodeStrokeCase OC at the spoke created at 08:00 (its create response carries version ${oc_v0}), then imaging-complete at 08:10, which increments the case version.
      - No consult exists on the case yet.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
