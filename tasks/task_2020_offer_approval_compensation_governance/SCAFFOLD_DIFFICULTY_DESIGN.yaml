          Entity pair Offer -> ClearanceCheck (different pair from
          Offer->Requisition): with one of two checks still INITIATED, clearing
          the other leaves the offer ACCEPTED; only the second check's CLEARED
          transition (a mutation on a different entity) flips the offer HIRED.
        test_recipe:
          setup:
            - "Offer base 20000000 pct 0 on OPEN requisition (standard peers, headcount 1) fully approved, lettered, extended, ACCEPTED"
            - "BACKGROUND and REFERENCE checks both exist (INITIATED)"
