        distinguishing_aspect: "A LOOKBACK_LIMITED disclosure asking for 5 lookback years exceeds VDA_MAX_LOOKBACK_YEARS 4 and answers HTTP 422 ERR_VDA_EXPOSURE_MISMATCH; no VDAAgreement row is written."
        test_recipe:
