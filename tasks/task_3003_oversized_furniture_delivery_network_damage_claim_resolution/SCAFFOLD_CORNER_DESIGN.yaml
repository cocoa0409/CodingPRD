  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role is rejected 401 ERR_UNAUTHENTICATED before any role or existence check runs — even for a read-only GET."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /oversize-freight/items"
              payload: {}
              as: UnauthenticatedCaller
              captures: { err_auth: "$.data.error_id" }
          assert:
            - "the response status is 401 and err_auth == ERR_UNAUTHENTICATED"

      - name: room_of_choice_on_ineligible_item_returns_service_level_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors.ERR_SERVICE_LEVEL_NOT_AVAILABLE
        distinguishing_aspect: "ROOM_OF_CHOICE on an item with white_glove_eligible false fails 422 ERR_SERVICE_LEVEL_NOT_AVAILABLE before routing — even though a white-glove-capable hub and lane exist for the zone."
        test_recipe:
          setup:
            - "Base chain entities; the 40x40x20 item has white_glove_eligible false in this variant."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-NWG", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 30, declared_value_cents: 80000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_nwg: "$.data.id" }
            - *k_cust
            - *k_linehaul
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_nwg}", service_level: "ROOM_OF_CHOICE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_svc: "$.data.error_id" }
          assert:
            - "the response status is 422 and err_svc == ERR_SERVICE_LEVEL_NOT_AVAILABLE"
            - "GET /oversize-freight/shipments returns 0 rows"

      - name: order_to_zone_without_hub_returns_no_route
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_NO_ROUTE
        distinguishing_aspect: "An LTL-class item ordered to a zone served by no ACTIVE hub (and with drop-ship disabled on the supplier) fails 422 ERR_NO_ROUTE at the routing stage."
        test_recipe:
          setup:
            - "Supplier SUP-A (drop-ship off); item-lg LISTED; customer C9 in ZONE_NOWHERE; no hub serves ZONE_NOWHERE."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_item
            - call: "POST /oversize-freight/customers"
              payload: { email: "c9@example.com", full_name: "Customer Nine", destination_zone: "ZONE_NOWHERE" }
              as: NetworkAdmin
              captures: { cust9_id: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust9_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust9_id}"
              captures: { err_route: "$.data.error_id" }
          assert:
            - "the response status is 422 and err_route == ERR_NO_ROUTE"
            - "GET /oversize-freight/shipments returns 0 rows"

      - name: order_on_delisted_item_returns_item_not_listed
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors.ERR_ITEM_NOT_LISTED
        distinguishing_aspect: "Ordering a DELISTED item fails 409 ERR_ITEM_NOT_LISTED at the referential check — the item exists (so it is not ERR_NOT_FOUND) but is no longer sellable."
        test_recipe:
          setup:
            - "Base chain; item-lg delisted while it has no open shipments."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - call: "POST /oversize-freight/items/${item_id}/delist"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_delist: "$.data.error_id" }
          assert:
            - "the response status is 409 and err_delist == ERR_ITEM_NOT_LISTED"

      - name: claim_settle_blocked_while_chargeback_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors.ERR_CHARGEBACK_OPEN
        distinguishing_aspect: "A determined SUPPLIER-liable claim cannot settle while its Chargeback is PENDING: settle fails 409 ERR_CHARGEBACK_OPEN; only after the chargeback settles does the claim settle succeed."
        test_recipe:
          setup:
            - "Delivered network order; claim inspected and determined SUPPLIER-liable; Chargeback PENDING."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - *k_complete
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_o: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_o}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${claim_o}/determine"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /oversize-freight/chargebacks"
              payload: { damage_claim_id: "${claim_o}" }
              as: NetworkAdmin
              captures: { cb_o: "$.data[0].id" }
          trigger:
            - call: "POST /oversize-freight/damage-claims/${claim_o}/settle"
              payload: {}
              as: ClaimsAdjuster
              captures: { err_open: "$.data.error_id" }
            - call: "POST /oversize-freight/chargebacks/${cb_o}/settle"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/damage-claims/${claim_o}/settle"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "the first claim settle returns 409 and err_open == ERR_CHARGEBACK_OPEN"
            - "after the chargeback settles, the claim settle succeeds and DamageClaim.${claim_o}.status == SETTLED"

      - name: return_approve_after_45_days_returns_window_closed
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors.ERR_RETURN_WINDOW_CLOSED
        distinguishing_aspect: "Approval at exactly delivered_at + 45 days succeeds, but one day later (day 46) fails 422 ERR_RETURN_WINDOW_CLOSED — the temporal window is inclusive at 45 days."
        test_recipe:
          setup:
            - "Delivered network order completed at 2026-09-12 (logical clock); two return authorizations requested."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T11:00:00Z" }
              as: NetworkAdmin
            - *k_complete
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${order_id}", reason: "BUYERS_REMORSE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ra_d45: "$.data.id" }
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${order_id}", reason: "BUYERS_REMORSE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ra_d46: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-10-27T11:00:00Z" }
              as: NetworkAdmin
            - call: "POST /oversize-freight/return-authorizations/${ra_d45}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-10-28T11:00:01Z" }
              as: NetworkAdmin
            - call: "POST /oversize-freight/return-authorizations/${ra_d46}/approve"
              payload: {}
              as: NetworkAdmin
              captures: { err_win: "$.data.error_id" }
          assert:
            - "the day-45 approve succeeds and ReturnAuthorization.${ra_d45}.status == APPROVED"
            - "the day-46 approve returns 422 and err_win == ERR_RETURN_WINDOW_CLOSED"
            - "ReturnAuthorization.${ra_d46}.status remains REQUESTED"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: shipment_deliver_rejected_for_owned_final_mile
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/oversize-freight/shipments/{shipmentId}/deliver
          - state_machines.Order.IN_TRANSIT_to_DELIVERED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The direct-deliver endpoint is reserved for PARCEL and DROP_SHIP: calling it on an OWNED_FINAL_MILE shipment in IN_TRANSIT fails 409 ERR_INVALID_STATE — hub shipments must deliver through an appointment."
        test_recipe:
          setup:
            - "Base network order departed (Shipment IN_TRANSIT, fulfillment_mode OWNED_FINAL_MILE)."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
          trigger:
            - call: "POST /oversize-freight/shipments/${ship_id}/deliver"
              payload: {}
              as: CarrierRep
              captures: { err_del: "$.data.error_id" }
          assert:
            - "the response status is 409 and err_del == ERR_INVALID_STATE"
            - "Shipment.${ship_id}.current_state remains IN_TRANSIT"

      - name: scorecard_defaults_to_rolling_window_when_param_omitted
        claim_type: computed_read
        grounds:
          - endpoints.GET_/oversize-freight/suppliers/{supplierId}/scorecard
          - calculations.supplier_compliance_score
        distinguishing_aspect: "Omitting ?window returns the rolling variant (window field echoes \"rolling\") and matches the Supplier's stored compliance_score exactly."
        test_recipe:
          setup:
            - "Supplier SUP-A with no shipments (fresh metrics)."
          setup_api_calls:
            - *k_clock
            - *k_sup
          trigger:
            - call: "GET /oversize-freight/suppliers/${sup_id}/scorecard"
              payload: {}
              as: NetworkAdmin
              captures: { sc_window: "$.data.window", sc_score: "$.data.compliance_score" }
          assert:
            - "sc_window == \"rolling\""
            - "sc_score == 100.00 (empty window reads 100.00 on-time, 0.00 chargeback rate)"
            - "sc_score == Supplier.${sup_id}.compliance_score"

      - name: shipments_list_filters_by_state_and_hub
        claim_type: computed_read
        grounds:
          - endpoints.GET_/oversize-freight/shipments
        distinguishing_aspect: "Filtered list queries compose: current_state=DELIVERED returns only delivered rows, hub_id scopes to a hub, and order_id returns the single shipment of an order."
        test_recipe:
          setup:
            - "Base network order delivered; a second drop-ship order in TENDERED."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - *k_complete
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_t: "$.data.id" }
          trigger:
            - call: "GET /oversize-freight/shipments"
              payload: { current_state: "DELIVERED" }
              as: NetworkAdmin
            - call: "GET /oversize-freight/shipments"
              payload: { hub_id: "${hub_id}" }
              as: NetworkAdmin
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${order_t}" }
              as: NetworkAdmin
              captures: { ship_t_state: "$.data[0].current_state" }
          assert:
            - "current_state=DELIVERED returns exactly 1 row (the completed shipment)"
            - "hub_id=${hub_id} returns 1 row (only the first shipment is hub-bound)"
            - "order_id=${order_t} returns exactly 1 row with ship_t_state == TENDERED"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_envelope_carries_typed_error_id_and_message
        claim_type: violation_to_error
        grounds:
          - response_envelope
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Every failure response uses the fixed envelope: response_type == \"error\", data.error_id is a declared catalog id, data.message is a non-empty string, and meta carries api_request_id and api_request_timestamp."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /oversize-freight/hubs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err_env: "$.data.error_id" }
          assert:
            - "response_type == \"error\" and err_env == ERR_NOT_FOUND"
            - "data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: stale_shipment_version_on_booking_returns_412
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[appointment-book-stale-shipment]
          - errors.ERR_STALE_VERSION
          - validations[priority=17]
        distinguishing_aspect: "OCC: after a first booking succeeds and is then cancelled (two version bumps, shipment back AT_HUB), replaying the ORIGINAL expected_shipment_version fails 412 ERR_STALE_VERSION — while the fresh version succeeds."
        test_recipe:
          setup:
            - "Base network order with shipment AT_HUB; version sv0 captured; appt1 booked (v+1) then cancelled (v+2, shipment returns AT_HUB)."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - call: "POST /oversize-freight/appointments/${appt_id}/cancel"
              payload: {}
              as: HubOperator
            - call: "GET /oversize-freight/shipments/${ship_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ship_v2: "$.data.version" }
          trigger:
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-14T09:00:00Z", window_end: "2026-09-14T12:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${ship_v0}" }
              as: HubOperator
              captures: { err_occ: "$.data.error_id" }
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-14T09:00:00Z", window_end: "2026-09-14T12:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${ship_v2}" }
              as: HubOperator
              captures: { appt_fresh: "$.data.id" }
          assert:
            - "the stale-version booking returns 412 and err_occ == ERR_STALE_VERSION"
            - "ship_v2 == ship_v0 + 2 (one bump per write: book, then cancel)"
            - "the fresh-version booking succeeds (201) and DeliveryAppointment.${appt_fresh}.status == BOOKED"

  # ===========================================================================
  - section: rbac
    instances:

      - name: customer_cannot_create_items_or_lanes
        claim_type: rbac_denial
        grounds:
          - roles.Customer
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Customer is outside the NetworkAdmin-only reference-data surface: POST /items and POST /freight-lanes as Customer fail 403 ERR_FORBIDDEN even with a well-formed payload."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A and customer C1 exist."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_cust
          trigger:
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-DENY", dim_length_in: 10, dim_width_in: 10, dim_height_in: 10, weight_lb: 5, declared_value_cents: 1000, white_glove_eligible: false }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_rbac1: "$.data.error_id" }
            - call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "LTL", dest_zone: "ZONE_NE", base_rate_cents: 1000, per_lb_rate_cents: 10, transit_days: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_rbac2: "$.data.error_id" }
          assert:
            - "err_rbac1 == ERR_FORBIDDEN (403) and err_rbac2 == ERR_FORBIDDEN (403)"
            - "GET /oversize-freight/items returns 0 rows and GET /oversize-freight/freight-lanes returns 0 rows"

      - name: hub_operator_cannot_determine_or_settle_claims
        claim_type: rbac_denial
        grounds:
          - roles.HubOperator
          - roles.ClaimsAdjuster
        distinguishing_aspect: "The claims pipeline is segregated: HubOperator inspects but cannot determine or settle (ClaimsAdjuster exclusives) — both attempts fail 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Delivered network order; claim opened and inspected."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - *k_complete
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_rbac: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_rbac}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
          trigger:
            - call: "POST /oversize-freight/damage-claims/${claim_rbac}/determine"
              payload: {}
              as: HubOperator
              captures: { err_det: "$.data.error_id" }
            - call: "POST /oversize-freight/damage-claims/${claim_rbac}/settle"
              payload: {}
              as: HubOperator
              captures: { err_set: "$.data.error_id" }
          assert:
            - "err_det == ERR_FORBIDDEN (403) and err_set == ERR_FORBIDDEN (403)"
            - "DamageClaim.${claim_rbac}.status remains INSPECTION"

      - name: supplier_rep_cannot_dispute_another_suppliers_chargeback
        claim_type: rbac_denial
        grounds:
          - roles.SupplierRep
          - validations[priority=16]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "SupplierRep identity is entity-backed: disputing a chargeback whose supplier_id differs from X-User-ID fails 403 ERR_FORBIDDEN even though SupplierRep is the correct ROLE for the endpoint."
        test_recipe:
          setup:
            - "Delivered network order for item-lg (supplier SUP-A) with a determined SUPPLIER-liable claim and PENDING chargeback; a second unrelated supplier SUP-Z exists."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - call: "POST /oversize-freight/suppliers"
              payload: { supplier_code: "SUP-Z", legal_name: "Unrelated Supplier", drop_ship_enabled: false }
              as: NetworkAdmin
              captures: { sup_z: "$.data.id" }
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - *k_complete
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_z: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_z}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${claim_z}/determine"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /oversize-freight/chargebacks"
              payload: { damage_claim_id: "${claim_z}" }
              as: NetworkAdmin
              captures: { cb_z: "$.data[0].id" }
          trigger:
            - call: "POST /oversize-freight/chargebacks/${cb_z}/dispute"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_z}"
              captures: { err_supz: "$.data.error_id" }
            - call: "POST /oversize-freight/chargebacks/${cb_z}/dispute"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_id}"
          assert:
            - "the foreign-supplier dispute returns 403 and err_supz == ERR_FORBIDDEN"
            - "the owning-supplier dispute succeeds and Chargeback.${cb_z}.status == DISPUTED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: return_authorization_expires_30_days_after_approval
        claim_type: scheduled_actions
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_EXPIRED
          - entities.ReturnAuthorization.fields.approved_at
        distinguishing_aspect: "The scheduled expiry fires on the logical clock: an APPROVED return reads APPROVED at approved_at + 29 days and EXPIRED at approved_at + 31 days; an EXPIRED return can no longer be completed."
        test_recipe:
          setup:
            - "Delivered network order (delivered 2026-09-12); RA approved the same day."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T11:00:00Z" }
              as: NetworkAdmin
            - *k_complete
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${order_id}", reason: "DAMAGE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ra_exp: "$.data.id" }
            - call: "POST /oversize-freight/return-authorizations/${ra_exp}/approve"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-10-11T11:00:00Z" }
              as: NetworkAdmin
            - call: "GET /oversize-freight/return-authorizations/${ra_exp}"
              payload: {}
              as: NetworkAdmin
              captures: { ra_d29: "$.data.status" }
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-10-13T11:00:01Z" }
              as: NetworkAdmin
            - call: "GET /oversize-freight/return-authorizations/${ra_exp}"
              payload: {}
              as: NetworkAdmin
              captures: { ra_d31: "$.data.status" }
            - call: "POST /oversize-freight/return-authorizations/${ra_exp}/complete"
              payload: {}
              as: HubOperator
              captures: { err_exp: "$.data.error_id" }
          assert:
            - "ra_d29 == APPROVED (within the 30-day completion window)"
            - "ra_d31 == EXPIRED (clock passed approved_at + 30 days)"
            - "the complete attempt returns 409 and err_exp == ERR_INVALID_STATE"

      - name: hub_selector_ranks_transit_then_earliest_created
        claim_type: selector_policy
        grounds:
          - calculations.routing_decision
          - entities.Hub.fields.created_at
        distinguishing_aspect: "Two ACTIVE hubs both serving ZONE_SW with equal lane transit days: routing deterministically picks the EARLIER-created hub (created_at ASC tie-break) — never a random or id-based pick."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A; item-lg; LTL lane ZONE_SW transit 3. HUB-X created first, HUB-Y second, both serve ZONE_SW. Customer C5 in ZONE_SW. PLANNED linehauls into both hubs."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "LTL", dest_zone: "ZONE_SW", base_rate_cents: 40000, per_lb_rate_cents: 50, transit_days: 3 }
              as: NetworkAdmin
            - call: "POST /oversize-freight/hubs"
              payload: { hub_code: "HUB-X", name: "First Hub", serves_zones: ["ZONE_SW"], white_glove_capable: false, daily_capacity: 5 }
              as: NetworkAdmin
              captures: { hub_x: "$.data.id" }
            - call: "POST /oversize-freight/hubs"
              payload: { hub_code: "HUB-Y", name: "Second Hub", serves_zones: ["ZONE_SW"], white_glove_capable: false, daily_capacity: 5 }
              as: NetworkAdmin
              captures: { hub_y: "$.data.id" }
            - *k_item
            - call: "POST /oversize-freight/customers"
              payload: { email: "c5@example.com", full_name: "Customer Five", destination_zone: "ZONE_SW" }
              as: NetworkAdmin
              captures: { cust5_id: "$.data.id" }
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hub_x}", planned_arrival_date: "2026-09-10", origin_ship_date: "2026-09-07", capacity: 10 }
              as: NetworkAdmin
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hub_y}", planned_arrival_date: "2026-09-10", origin_ship_date: "2026-09-07", capacity: 10 }
              as: NetworkAdmin
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust5_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust5_id}"
              captures: { order_sel: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${order_sel}" }
              as: NetworkAdmin
              captures: { ship_sel_hub: "$.data[0].hub_id" }
          assert:
            - "ship_sel_hub == ${hub_x} (created_at ASC tie-break selects the earlier-created hub)"
            - "ship_sel_hub != ${hub_y}"

      - name: supplier_metrics_reconcile_on_settle_and_reverse
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Supplier.fields.chargeback_rate
          - calculations.supplier_compliance_score
        excluded_because:
          difficulty_instance: chargeback_dispute_reverse_conserves_supplier_ledger
          rationale: "Derived-field reconciliation across settle/reverse is asserted as the conserved-quantity invariant of the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: order_create_response_is_immediately_consistent
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/oversize-freight/orders
        distinguishing_aspect: "Immediate consistency: the POST /orders 201 response already carries the computed pricing fields and ROUTED state, and the cascade-created Shipment is readable in the very next GET with matching promised_date — no async settling window."
        test_recipe:
          setup:
            - "Base chain entities (supplier, hub, lane, item, customer, linehaul)."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_ic: "$.data.id", ic_state: "$.data.order_state", ic_total: "$.data.order_total_cents" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${order_ic}" }
              as: NetworkAdmin
              captures: { ic_ship: "$.data[0].id", ic_prom: "$.data[0].promised_date" }
          assert:
            - "ic_state == ROUTED in the creation response itself (PENDING → ROUTED is atomic)"
            - "ic_total == 121500 (80000 + 41500 for the 30lb item at 40000 + 50*30)"
            - "the immediate GET returns Shipment.${ic_ship} with ic_prom == \"2026-09-11\""
            - "Order.${order_ic}.oversized_surcharge_cents == 6075 and handling_fee_cents == 9234"
