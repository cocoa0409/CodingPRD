            - "LiftScan.denial_reason == NOT_ACTIVE"

  # ------------------------------------------------------------------------
  - section: validations
    instances:
      - name: create_pass_missing_holder_name_returns_validation
        claim_type: required_field
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints.POST_/passes
        distinguishing_aspect: "POST /passes without holder_name fails ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "One PassProduct."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}" }
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"
            - "http_status == 422"

      - name: duplicate_pass_product_tier_returns_duplicate_tier
        claim_type: uniqueness
        grounds:
          - validations[priority=5]
          - errors[ERR_DUPLICATE_TIER]
          - entities.PassProduct.fields.tier
        distinguishing_aspect: "Creating a second PassProduct with an existing tier (LOCAL) fails ERR_DUPLICATE_TIER (409)."
        test_recipe:
          setup:
            - "A PassProduct tier=LOCAL exists."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 5000, ikon_interchange_enabled: false }
              as: NetworkAdmin
          trigger:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 6000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DUPLICATE_TIER"
            - "http_status == 409"

      - name: scan_token_mismatch_returns_token_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_TOKEN_MISMATCH]
          - entities.LiftScan.fields.denial_reason
        distinguishing_aspect: "Scanning with a wrong presented_token records a DENIED LiftScan with denial_reason=TOKEN_MISMATCH and returns ERR_TOKEN_MISMATCH (409)."
        test_recipe:
          setup:
            - "FULL_EPIC ACTIVE pass at an EPIC resort."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pass-products"
              payload: { tier: "FULL_EPIC", price_cents: 8000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Tok Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Tok Holder" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
          trigger:
            - call: "POST /passes/${pass_id}/scan"
              payload: { resort_id: "${resort_id}", presented_token: "BOGUS" }
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_TOKEN_MISMATCH"
            - "http_status == 409"

      - name: buddy_reserve_exhausted_allotment_returns_exhausted
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_BUDDY_ALLOTMENT_EXHAUSTED]
          - calculations.buddy_tickets_remaining
        distinguishing_aspect: "Reserving a buddy ticket when Pass.buddy_tickets_remaining < 1 (allotment=1, already one reserved) fails ERR_BUDDY_ALLOTMENT_EXHAUSTED (409)."
        test_recipe:
          setup:
            - "ACTIVE pass allotment=1 with one RESERVED buddy ticket (remaining=0)."
          setup_api_calls:
            - call: "POST /pass-products"
              payload: { tier: "LOCAL", price_cents: 4000, buddy_ticket_allotment: 1, buddy_ticket_price_cents: 2000, ikon_interchange_enabled: false }
              as: NetworkAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /resorts"
              payload: { name: "Exhaust Mtn", home_network: "EPIC" }
              as: NetworkAdmin
              captures: { resort_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${prod_id}", holder_name: "Exhaust Host" }
              as: ResortOps
              captures: { pass_id: $.data.id }
            - call: "POST /passes/${pass_id}/activate"
              payload: {}
              as: ResortOps
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G1", valid_date: "2026-02-09" }
              as: ResortOps
          trigger:
            - call: "POST /buddy-tickets"
              payload: { pass_id: "${pass_id}", resort_id: "${resort_id}", guest_name: "G2", valid_date: "2026-02-10" }
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_BUDDY_ALLOTMENT_EXHAUSTED"
            - "http_status == 409"

      - name: refund_approve_too_many_scans_returns_ineligible
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_REFUND_INELIGIBLE]
        excluded_because:
          difficulty_instance: boundary_precision_check / refund_scan_count_le_max_boundary
          rationale: "The scan_count > MAX_SCANS_FOR_REFUND ineligibility (failing side of the <=10 boundary) is exercised by the named §1.8 boundary instance."

      - name: anti_passback_within_window_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_ANTI_PASSBACK]
        excluded_because:
          difficulty_instance: boundary_precision_check / anti_passback_halfopen_window_boundary
          rationale: "The within-window ANTI_PASSBACK denial is exercised by the named §1.8 boundary instance."

      - name: interchange_denied_no_remaining_days
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_INTERCHANGE_DENIED]
        excluded_because:
          difficulty_instance: combinatorial_formula / scan_decision_nonlinear_branch_ordering
          rationale: "IKON interchange denial (NO_INTERCHANGE due to distinct-day cap) is exercised by the named §1.8 combinatorial instance."

  # ------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: get_unknown_pass_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/passes/{id}
        distinguishing_aspect: "GET /passes/{id} with a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /passes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ResortOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: scan_unknown_resort_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - entities.LiftScan.fields.resort_id
