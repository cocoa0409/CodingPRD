# =============================================================================
# task_0555_styling_box — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# Reusable bootstrap pattern per instance (each test starts from empty DB):
#   create products -> create stylist -> register client -> complete profile (ACTIVE)
#   -> GET client version -> schedule fix (OCC) -> assign -> add items -> preview
#   -> ship -> mark-delivered -> checkout.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fix_charge_provisional_vs_final_diverge
        grounds:
          - calculations.fix_charge
          - state_machines.Fix.SHIPPED_to_DELIVERED
          - state_machines.Fix.DELIVERED_to_CHECKED_OUT
          - entities.Fix.fields.estimated_charge_cents
          - entities.Fix.fields.charge_cents
        distinguishing_aspect: "On the SAME 5-item fix (subtotal 20000, CA), the provisional variant at DELIVERED yields estimated_charge_cents==13943 (keep-all) while the final variant at checkout keeping only 2 items yields charge_cents==5143 — cost accounting on Fix."
        test_recipe:
          setup:
            - "CA client ACTIVE with a fix of 5 SELECTED items priced [3200,4500,2800,6000,3500], marked DELIVERED (estimated_charge_cents computed)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "T1", name: "Top1", category: "TOP", size: 8, price_cents: 3200, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "T2", name: "Top2", category: "TOP", size: 10, price_cents: 4500, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "B1", name: "Bot1", category: "BOTTOM", size: 8, price_cents: 2800, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /products", payload: { sku: "S1", name: "Shoe1", category: "SHOE", size: 9, price_cents: 6000, total_stock: 5 }, as: OpsAdmin, captures: { p4: $.data.id } }
            - { call: "POST /products", payload: { sku: "T3", name: "Top3", category: "TOP", size: 8, price_cents: 3500, total_stock: 5 }, as: OpsAdmin, captures: { p5: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA", cadence: "MONTHLY" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}", captures: { i1: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}", captures: { i2: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}", captures: { i3: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p4}" }, as: Stylist, as_user_id: "${st}", captures: { i4: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p5}" }, as: Stylist, as_user_id: "${st}", captures: { i5: $.data.id } }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/mark-delivered", payload: {}, as: OpsAdmin, captures: { est: $.data.estimated_charge_cents } }
          trigger:
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: ["${i1}", "${i3}"] }, as: Client, as_user_id: "${c}", captures: { fin: $.data.charge_cents } }
          assert:
            - "Fix.${fix}.estimated_charge_cents == 13943 (provisional, keep-all)"
            - "Fix.${fix}.charge_cents == 5143 (final, kept i1+i3)"
            - "Fix.${fix}.estimated_charge_cents != Fix.${fix}.charge_cents"

      - name: learned_sizing_weighted_vs_latest_diverge
        grounds:
          - calculations.learned_sizing
          - entities.StyleProfile.fields.learned_top_size
          - state_machines.Fix.DELIVERED_to_CHECKED_OUT
        distinguishing_aspect: "With two TOP feedbacks (older size12 PERFECT, newer size8 TOO_SMALL) the weighted variant sets learned_top_size==10, whereas the latest-only variant would give 9 — risk/fit scoring on StyleProfile (different entity domain than Fix cost)."
        test_recipe:
          setup:
            - "CA client ACTIVE; fix#1 delivered 2026-05-01 with TOP item size12 kept + PERFECT feedback; clock advanced to 2026-05-15; fix#2 delivered with TOP item size8 kept + TOO_SMALL feedback."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "TA", name: "TopA", category: "TOP", size: 12, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { pa: $.data.id } }
            - { call: "POST /products", payload: { sku: "TB", name: "TopB", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { pb: $.data.id } }
            - { call: "POST /products", payload: { sku: "FL", name: "Filler", category: "ACCESSORY", size: 1, price_cents: 1000, total_stock: 20 }, as: OpsAdmin, captures: { pf: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 6, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv1: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv1}" }, as: Client, as_user_id: "${c}", captures: { f1: $.data.id } }
            - { call: "POST /fixes/${f1}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${f1}/items", payload: { product_id: "${pa}" }, as: Stylist, as_user_id: "${st}", captures: { f1a: $.data.id } }
            - { call: "POST /fixes/${f1}/items", payload: { product_id: "${pf}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${f1}/items", payload: { product_id: "${pf}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${f1}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${f1}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${f1}/mark-delivered", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${f1}/checkout", payload: { kept_item_ids: ["${f1a}"], item_feedback: [ { fix_item_id: "${f1a}", rating: "PERFECT" } ] }, as: Client, as_user_id: "${c}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: OpsAdmin }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv2: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv2}" }, as: Client, as_user_id: "${c}", captures: { f2: $.data.id } }
            - { call: "POST /fixes/${f2}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${f2}/items", payload: { product_id: "${pb}" }, as: Stylist, as_user_id: "${st}", captures: { f2b: $.data.id } }
            - { call: "POST /fixes/${f2}/items", payload: { product_id: "${pf}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${f2}/items", payload: { product_id: "${pf}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${f2}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${f2}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${f2}/mark-delivered", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${f2}/checkout", payload: { kept_item_ids: ["${f2b}"], item_feedback: [ { fix_item_id: "${f2b}", rating: "TOO_SMALL" } ] }, as: Client, as_user_id: "${c}" }
          assert:
            - "StyleProfile of client ${c}: learned_top_size == 10 (weighted variant over both TOP feedbacks)"
            - "StyleProfile of client ${c}: feedback_count == 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fix_charge_keepall_buy_the_look_mode_a
        grounds:
          - calculations.fix_charge
          - entities.Fix.fields.buy_the_look_applied
          - entities.Fix.fields.charge_cents
        distinguishing_aspect: "Mode (a) nested conditionals with >=3 inputs: keep-all on a 20000 subtotal triggers buy_the_look_applied=true, 25% discount (5000), styling-fee credit (2000), free shipping (net 13000>=7500), then tax on the aggregate net -> charge_cents==13943."
        test_recipe:
          setup:
            - "CA client ACTIVE with a 5-item fix (subtotal 20000) DELIVERED."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "T1", name: "T1", category: "TOP", size: 8, price_cents: 3200, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "T2", name: "T2", category: "TOP", size: 10, price_cents: 4500, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "B1", name: "B1", category: "BOTTOM", size: 8, price_cents: 2800, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /products", payload: { sku: "S1", name: "S1", category: "SHOE", size: 9, price_cents: 6000, total_stock: 5 }, as: OpsAdmin, captures: { p4: $.data.id } }
            - { call: "POST /products", payload: { sku: "T3", name: "T3", category: "TOP", size: 8, price_cents: 3500, total_stock: 5 }, as: OpsAdmin, captures: { p5: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}", captures: { i1: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}", captures: { i2: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}", captures: { i3: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p4}" }, as: Stylist, as_user_id: "${st}", captures: { i4: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p5}" }, as: Stylist, as_user_id: "${st}", captures: { i5: $.data.id } }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/mark-delivered", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: ["${i1}", "${i2}", "${i3}", "${i4}", "${i5}"] }, as: Client, as_user_id: "${c}" }
          assert:
            - "Fix.${fix}.buy_the_look_applied == true"
            - "Fix.${fix}.shipping_fee_cents == 0"
            - "Fix.${fix}.tax_cents == 943"
            - "Fix.${fix}.charge_cents == 13943"

      - name: shipping_fee_free_ship_tier_mode_c
        grounds:
          - calculations.shipping_fee
          - calculations.fix_charge
          - entities.Fix.fields.shipping_fee_cents
        distinguishing_aspect: "Mode (c) circular-looking dependency: shipping is part of the charge yet free-ship is a tier keyed on the total; the pinned order tests the waiver on net-after-credit (7500) not on a shipping-inclusive total, so keeping [5000,4500] gives net 7500>=7500 -> shipping_fee_cents==0, charge_cents==8044."
        test_recipe:
          setup:
            - "CA client ACTIVE with a 3-item fix priced [5000,4500,2000] DELIVERED."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 5000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 4500, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 2000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}", captures: { i1: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}", captures: { i2: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}", captures: { i3: $.data.id } }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/mark-delivered", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: ["${i1}", "${i2}"] }, as: Client, as_user_id: "${c}" }
          assert:
            - "Fix.${fix}.shipping_fee_cents == 0 (net 7500 >= 7500)"
            - "Fix.${fix}.buy_the_look_applied == false"
            - "Fix.${fix}.charge_cents == 8044"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fix_preview_revision_cycle
        grounds:
          - state_machines.Fix.STYLING_to_PREVIEW
          - state_machines.Fix.PREVIEW_to_STYLING
        distinguishing_aspect: "Fix cycles STYLING->PREVIEW->STYLING via request-changes then can re-advance to PREVIEW — a non-linear revision loop on the Fix entity."
        test_recipe:
          setup:
            - "CA client ACTIVE with a fix in PREVIEW (3 items)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
          trigger:
            - { call: "POST /fixes/${fix}/request-changes", payload: {}, as: Client, as_user_id: "${c}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
          assert:
            - "After request-changes Fix.${fix}.status was STYLING, then after re-submit Fix.${fix}.status == PREVIEW (cycle completed)"

      - name: client_pause_resume_cycle
        grounds:
          - state_machines.Client.ACTIVE_to_PAUSED
          - state_machines.Client.PAUSED_to_ACTIVE
        distinguishing_aspect: "Client cycles ACTIVE->PAUSED->ACTIVE via pause then resume — a non-linear cycle on the Client entity (different entity than Fix)."
        test_recipe:
          setup:
            - "Client ACTIVE with no fixes."
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "POST /clients/${c}/pause", payload: {}, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /clients/${c}/resume", payload: {}, as: Client, as_user_id: "${c}" }
          assert:
            - "After pause Client.${c}.status was PAUSED, then after resume Client.${c}.status == ACTIVE (cycle completed)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: client_cancel_releases_items_restocks_products
        grounds:
          - state_machines.Client.ACTIVE_to_CANCELLED
          - state_machines.Fix.STYLING_to_CANCELLED
          - state_machines.FixItem.SELECTED_to_RELEASED
          - calculations.inventory_counts
          - entities.Product.fields.available_count
        distinguishing_aspect: "Depth-4 chain: cancel (Client->CANCELLED) causes Fix(STYLING)->CANCELLED, which causes its FixItem->RELEASED, which causes Product restock (reserved 1->0, available 4->5) — each hop caused by the previous."
        test_recipe:
          setup:
            - "CA client ACTIVE with a STYLING fix holding one SELECTED item of a total_stock=5 product (available 4, reserved 1)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}", captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /clients/${c}/cancel", payload: {}, as: Client, as_user_id: "${c}" }
          assert:
            - "Client.${c}.status == CANCELLED"
            - "Fix.${fix}.status == CANCELLED"
            - "FixItem.${i1}.status == RELEASED"
            - "Product.${p1}.available_count == 5 and reserved_count == 0"

      - name: checkout_feedback_updates_style_profile
        grounds:
          - state_machines.Fix.DELIVERED_to_CHECKED_OUT
          - calculations.learned_sizing
          - entities.FeedbackEntry.fields.rating
          - entities.StyleProfile.fields.learned_top_size
        distinguishing_aspect: "Depth-3 chain from a different trigger (checkout): checkout creates a FeedbackEntry (TOP size8 TOO_SMALL), which causes StyleProfile.learned_top_size to recompute from 8 (quiz) to 9 — each hop caused by the previous."
        test_recipe:
          setup:
            - "CA client ACTIVE with a 3-item fix DELIVERED; TOP item size8 to be kept with TOO_SMALL feedback."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
