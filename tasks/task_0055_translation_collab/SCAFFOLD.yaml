scenario: |
  Online translation collaboration platform: project creation with project profile
  (source-language/target-language/domain/word-count/deadline), client information,
  pricing and quotation, project-template reference, and project-stage configuration;
  document splitting with file-format parsing (Word/PDF/PPT/Excel/SRT), segment splitting
  by sentence/paragraph, splitting-package size configuration, repeated-segment recognition,
  and translation-memory leverage; translator matching and assignment with translator
  profile (language-pair/domain/grade), translator availability and workload, project-domain
  matching, test-translation gating, dispatch acceptance window, and reassignment on
  rejection; translation/review/final-review three-stage workflow with translator submission,
  reviewer modification with track changes, final reviewer confirmation, rejection-and-rework
  rules, and stage-time-limit monitoring; terminology library management with project
  terminology base, client-level terminology base, multi-language alignment, terminology
  consistency check, and conflict-and-update workflow; quality scoring with error-category
  classification (mistranslation/omission/grammar/style/terminology), error-severity rating,
  error-density calculation, scoring rubric, and translator-rating impact; payment
  calculation with unit price by word/segment/file, repetition-rate-based pricing tiers,
  urgency surcharge, deduction by quality score, payment cycle, and tax handling;
  event-driven synchronization with payment, IM, and storage systems; audit logging
  for stage transitions and quality scoring.

domain_name: translation-collab
api_prefix: /projects

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Client organization legal name.
        constraints: "Required, 1..200 chars."
      - name: contact_email
        type: string
        source: input
        description: Primary contact email for the client.
        constraints: "Required, RFC 5322 syntactic check."
      - name: tax_rate_bps
        type: integer
        source: input
        description: "Tax rate in basis points (e.g. 1300 == 13%) applied to all payments invoiced to this client."
        constraints: "0..3000, integer."
      - name: payment_cycle_days
        type: integer
        source: input
        description: Number of days from project finalization until translator payout becomes payable.
        constraints: "Allowed values: {0, 7, 15, 30, 45}."
      - name: status
        type: enum
        source: system
        description: Client lifecycle status.
        default: ACTIVE
        constraints: "Values: {ACTIVE, ARCHIVED}."

  - name: Translator
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Public name shown on assignments.
        constraints: "Required, 1..100 chars."
      - name: language_pairs
        type: array
        source: input
        description: "Array of objects {source_lang, target_lang} (ISO 639-1 codes) the translator can work on."
        constraints: "Non-empty; each pair source != target."
      - name: domains
        type: array
        source: input
        description: List of domain enum values the translator is qualified in.
        constraints: "Subset of {LEGAL, MEDICAL, TECH, MARKETING, MEDIA, FINANCE, GENERAL}; non-empty."
      - name: grade
        type: enum
        source: input
        description: Translator grade tier; affects unit price multipliers.
        default: JUNIOR
        constraints: "Values: {JUNIOR, INTERMEDIATE, SENIOR, EXPERT}."
      - name: test_translation_passed
        type: boolean
        source: system
        description: True once translator has cleared the platform test-translation gate.
        default: false
      - name: availability_status
        type: enum
        source: system
        description: Current availability for new dispatches.
        default: AVAILABLE
        constraints: "Values: {AVAILABLE, BUSY, OFFLINE, SUSPENDED}."
      - name: workload_segments_open
        type: integer
        source: computed
        description: Number of Segments currently held by this translator in non-terminal states.
        default: 0
        constraints: "Recomputed on every Assignment accept/reject and Segment terminal transition."
      - name: rolling_quality_score
        type: number
        source: computed
        description: 0..100 rolling-window quality score per quality calculation rule rolling_translator_rating.
        default: 100.00
        constraints: "Two decimal places; updated when a QualityScore is finalized."
      - name: latest_quality_score
        type: number
        source: computed
        description: 0..100 latest finalized QualityScore for the translator (variant feed).
        default: 100.00
        constraints: "Two decimal places."

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK to Client.id who owns this project.
      - name: name
        type: string
        source: input
        description: Project display name.
        constraints: "1..200 chars."
      - name: source_lang
        type: string
        source: input
        description: ISO 639-1 source language code.
      - name: target_lang
        type: string
        source: input
        description: ISO 639-1 target language code.
        constraints: "Must differ from source_lang."
      - name: domain
        type: enum
        source: input
        description: Project domain category.
        constraints: "Values: {LEGAL, MEDICAL, TECH, MARKETING, MEDIA, FINANCE, GENERAL}."
      - name: word_count
        type: integer
        source: computed
        description: Sum of Segment.word_count for all Segments of this Project at any moment.
        default: 0
        constraints: "Recomputed on every Document split / segment delete."
      - name: deadline_at
        type: datetime
        source: input
        description: Hard deadline by which the project must reach STATE PUBLISHED.
        constraints: "Must be > created_at."
      - name: urgency_tier
        type: enum
        source: computed
        description: Computed from deadline horizon vs platform clock at creation.
        default: STANDARD
        constraints: "Values: {STANDARD, RUSH, CRITICAL}; per calculation rule urgency_tier_assignment."
      - name: unit_pricing_mode
        type: enum
        source: input
        description: Pricing unit selected at project creation.
        constraints: "Values: {PER_WORD, PER_SEGMENT, PER_FILE}."
      - name: base_unit_price_cents
        type: integer
        source: input
        description: Integer cents per pricing unit before any multipliers.
        constraints: ">= 1."
      - name: package_size_segments
        type: integer
        source: input
        description: Number of segments grouped into a single split package.
        default: 50
        constraints: "1..500."
      - name: template_id
        type: string
        source: input
        description: Optional FK to a ProjectTemplate used to seed config; null when ad-hoc.
        default: null
      - name: state
        type: enum
        source: system
        description: Project lifecycle state.
        default: DRAFT
        constraints: "Values: {DRAFT, QUOTED, ACTIVE, ALL_TRANSLATED, ALL_REVIEWED, PUBLISHED, CANCELLED}."
      - name: quoted_total_cents
        type: integer
        source: computed
        description: Forward-looking quotation amount, computed by calculation project_quote on QUOTE transition.
        default: null
      - name: final_payout_cents
        type: integer
        source: computed
        description: Chronological final translator payout, computed by calculation final_payout on PUBLISH.
        default: null
      - name: tax_amount_cents
        type: integer
        source: computed
        description: Tax computed against final_payout_cents using Client.tax_rate_bps at publish time.
        default: null
      - name: payable_at
        type: datetime
        source: computed
        description: Timestamp at which final_payout_cents becomes payable; PUBLISH_AT + Client.payment_cycle_days.
        default: null

  - name: ProjectTemplate
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: Template name.
      - name: default_domain
        type: enum
        source: input
        description: Default project domain seeded from this template.
      - name: default_unit_pricing_mode
        type: enum
        source: input
        description: Default pricing mode.
      - name: default_base_unit_price_cents
        type: integer
        source: input
        description: Default base unit price in cents.
      - name: default_package_size_segments
        type: integer
        source: input
        description: Default package size.

  - name: Document
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to parent Project.
      - name: filename
        type: string
        source: input
        description: Original uploaded filename.
      - name: file_format
        type: enum
        source: input
        description: Parsed file format.
        constraints: "Values: {DOCX, PDF, PPTX, XLSX, SRT}."
      - name: split_mode
        type: enum
        source: input
        description: Segmentation rule applied at split time.
        constraints: "Values: {SENTENCE, PARAGRAPH}."
      - name: word_count
        type: integer
        source: computed
        description: Sum of Segment.word_count for Segments under this Document.
        default: 0
      - name: state
        type: enum
        source: system
        description: Document parsing/splitting state.
        default: UPLOADED
        constraints: "Values: {UPLOADED, SPLIT, ARCHIVED}."

  - name: Segment
    parent: Document
    common_fields: true
    fields:
      - name: document_id
        type: string
        source: input
        description: FK to parent Document.
      - name: project_id
        type: string
        source: system
        description: Denormalized FK to Project for query convenience; written on creation, never updated.
      - name: ordinal
        type: integer
        source: input
        description: 1-based position inside the Document.
        constraints: ">= 1; unique per document_id."
      - name: source_text
        type: string
        source: input
        description: Verbatim source-language text of the segment.
      - name: word_count
        type: integer
        source: input
        description: Word count of source_text computed by the platform parser at split time.
        constraints: ">= 1."
      - name: repetition_class
        type: enum
        source: computed
        description: Result of repeated-segment recognition.
        default: NEW
        constraints: "Values: {NEW, FUZZY, EXACT_REPEAT, TM_LEVERAGE}; assigned by repetition_detection calculation."
      - name: tm_leverage_pct
        type: integer
        source: computed
        description: Translation-memory leverage percentage; 0..100 integer.
        default: 0
      - name: translated_text
        type: string
        source: input
        description: Translator's submission; null until first submission.
        default: null
      - name: reviewed_text
        type: string
        source: input
        description: Reviewer's tracked-change output; null until reviewed.
        default: null
      - name: state
        type: enum
        source: system
        description: Segment workflow state.
        default: NEW
        constraints: "Values: {NEW, ASSIGNED, TRANSLATED, REVIEWED, FINAL_APPROVED, REJECTED, REASSIGNED}."
      - name: assignment_id
        type: string
        source: system
        description: Current Assignment.id holding this Segment; null when unassigned.
        default: null

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.
      - name: translator_id
        type: string
        source: input
        description: FK to Translator dispatched for this assignment.
      - name: role
        type: enum
        source: input
        description: Pipeline role for this assignment.
        constraints: "Values: {TRANSLATOR, REVIEWER, FINAL_REVIEWER}."
      - name: segment_ids
        type: array
        source: input
        description: Ordered list of Segment.id covered by this assignment (a split package).
        constraints: "Non-empty; size <= Project.package_size_segments."
      - name: dispatched_at
        type: datetime
        source: system
        description: Timestamp Assignment was created and dispatched.
      - name: accept_deadline_at
        type: datetime
        source: system
        description: dispatched_at + ACCEPT_WINDOW_HOURS; expiry triggers auto-reassignment.
      - name: stage_deadline_at
        type: datetime
        source: system
        description: Stage time-limit deadline computed at acceptance.
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Timestamp of acceptance.
        default: null
      - name: state
        type: enum
        source: system
        description: Assignment lifecycle.
        default: PENDING
        constraints: "Values: {PENDING, ACCEPTED, COMPLETED, REJECTED, EXPIRED, REASSIGNED}."

  - name: TerminologyEntry
    parent: null
    common_fields: true
    fields:
      - name: scope_type
        type: enum
        source: input
        description: Whether this entry belongs to a Project terminology base or a Client terminology base.
        constraints: "Values: {PROJECT, CLIENT}."
      - name: scope_id
        type: string
        source: input
        description: Project.id when scope_type=PROJECT, Client.id when scope_type=CLIENT.
      - name: source_lang
        type: string
        source: input
        description: ISO 639-1 code of the source term language.
      - name: target_lang
        type: string
        source: input
        description: ISO 639-1 code of the target term language.
      - name: source_term
        type: string
        source: input
        description: Source-language term.
        constraints: "1..200 chars; case-sensitive."
      - name: target_term
        type: string
        source: input
        description: Target-language term.
        constraints: "1..200 chars."
      - name: state
        type: enum
        source: system
        description: Terminology lifecycle.
        default: PROPOSED
        constraints: "Values: {PROPOSED, APPROVED, CONFLICT, ARCHIVED}."

  - name: QualityScore
    parent: Segment
    common_fields: true
    fields:
      - name: segment_id
        type: string
        source: input
        description: FK to the Segment being scored.
      - name: translator_id
        type: string
        source: system
        description: Denormalized FK to the Translator credited with the Segment translation.
      - name: errors
        type: array
        source: input
        description: "List of {category, severity, count} objects."
        constraints: "category in {MISTRANSLATION, OMISSION, GRAMMAR, STYLE, TERMINOLOGY}; severity in {MINOR, MAJOR, CRITICAL}; count >= 1."
      - name: error_density
        type: number
        source: computed
        description: Weighted errors per 1000 words; calculated by error_density rule.
        default: 0.00
      - name: score
        type: number
        source: computed
        description: 0..100 score derived from error_density via scoring_rubric.
        default: 100.00
      - name: state
        type: enum
        source: system
        description: Score lifecycle.
        default: DRAFT
        constraints: "Values: {DRAFT, FINALIZED, VOIDED}."

  - name: AuditEntry
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: Subject entity type.
        constraints: "Values: {Segment, Assignment, Project, QualityScore}."
      - name: subject_id
        type: string
        source: system
        description: Subject entity id.
      - name: event
        type: enum
        source: system
        description: Audit event class.
        constraints: "Values: {STATE_TRANSITION, QUALITY_SCORED, REASSIGNED, EXTERNAL_SYNC}."
      - name: from_state
        type: string
        source: system
        description: Pre-transition state (null when not applicable).
        default: null
      - name: to_state
        type: string
        source: system
        description: Post-transition state (null when not applicable).
        default: null
      - name: actor_role
        type: string
        source: system
        description: Role of acting principal.
      - name: actor_id
        type: string
        source: system
        description: Acting principal id (Translator.id or opaque admin id).
      - name: payload
        type: object
        source: system
        description: Free-form structured payload (e.g. score, error counts, external sync target).

  - name: ExternalSyncRecord
    parent: null
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: system
        description: FK to Project.
      - name: target_system
        type: enum
        source: system
        description: Downstream system the event is fanned out to.
        constraints: "Values: {PAYMENT, IM, STORAGE}."
      - name: trigger_event
        type: enum
        source: system
        description: Event class that produced this sync record.
        constraints: "Values: {PROJECT_PUBLISHED, PAYMENT_PAYABLE, ASSIGNMENT_DISPATCHED, ASSIGNMENT_REJECTED, STAGE_DEADLINE_BREACHED}."
      - name: payload
        type: object
        source: system
        description: JSON payload pushed to the downstream system at sync time.

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [PUBLISHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /projects/{id}/quote"
        actor: ProjectManager
        preconditions:
          - "All Documents under the project are in state SPLIT."
          - "Project.word_count > 0."
        side_effects:
          - "Run calculation project_quote; write quoted_total_cents."
          - "Run calculation urgency_tier_assignment; write urgency_tier."
          - "Emit AuditEntry STATE_TRANSITION."
      - from: QUOTED
        to: ACTIVE
        trigger: "POST /projects/{id}/activate"
        actor: ProjectManager
        preconditions:
          - "quoted_total_cents is not null."
          - "At least one TRANSLATOR Assignment exists for the project."
        side_effects:
          - "Lock unit_pricing_mode and base_unit_price_cents (immutable thereafter)."
          - "Emit AuditEntry STATE_TRANSITION."
      - from: ACTIVE
        to: ALL_TRANSLATED
        trigger: "system: when every Segment under project reaches state in {TRANSLATED, REVIEWED, FINAL_APPROVED}"
        actor: system
        preconditions:
          - "For every Segment s under project: s.state in {TRANSLATED, REVIEWED, FINAL_APPROVED}."
        side_effects:
          - "Emit AuditEntry STATE_TRANSITION."
      - from: ALL_TRANSLATED
        to: ALL_REVIEWED
        trigger: "system: when every Segment under project reaches state in {REVIEWED, FINAL_APPROVED}"
        actor: system
        preconditions:
          - "For every Segment s under project: s.state in {REVIEWED, FINAL_APPROVED}."
        side_effects:
          - "Emit AuditEntry STATE_TRANSITION."
      - from: ALL_TRANSLATED
        to: ACTIVE
        trigger: "system: when any Segment regresses out of {TRANSLATED, REVIEWED, FINAL_APPROVED} due to rejection"
        actor: system
        preconditions:
          - "Some Segment under project re-entered NEW or ASSIGNED state via rework cascade."
        side_effects:
          - "Emit AuditEntry STATE_TRANSITION."
        note: "Compound-state regression: parent demotes when a child regresses."
      - from: ALL_REVIEWED
        to: ALL_TRANSLATED
        trigger: "system: when a FINAL_REVIEWER rejects a Segment back to TRANSLATED"
        actor: system
        preconditions:
          - "Some Segment under project regressed from FINAL_APPROVED-eligible back to TRANSLATED."
        side_effects:
          - "Emit AuditEntry STATE_TRANSITION."
      - from: ALL_REVIEWED
        to: PUBLISHED
        trigger: "POST /projects/{id}/publish"
        actor: ProjectManager
        preconditions:
          - "Every Segment under project is in FINAL_APPROVED."
          - "Every project-scoped TerminologyEntry is in APPROVED or ARCHIVED (no CONFLICT)."
        side_effects:
          - "Run calculation final_payout; write final_payout_cents."
          - "Run calculation tax_on_payout; write tax_amount_cents."
          - "Compute payable_at = now() + Client.payment_cycle_days * 24h."
          - "For every Translator who produced a TRANSLATOR Assignment in the project, refresh rolling_quality_score and latest_quality_score per rolling_translator_rating and latest_translator_rating."
          - "Create ExternalSyncRecord(target=PAYMENT, trigger=PROJECT_PUBLISHED)."
          - "Create ExternalSyncRecord(target=STORAGE, trigger=PROJECT_PUBLISHED)."
          - "Create ExternalSyncRecord(target=IM, trigger=PROJECT_PUBLISHED)."
          - "Emit AuditEntry STATE_TRANSITION."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "No Assignment exists in state ACCEPTED."
        side_effects:
          - "Set every Segment.state under project to REJECTED (terminal)."
          - "Set every PENDING Assignment.state to REJECTED."
          - "Emit AuditEntry STATE_TRANSITION."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "No Assignment under project is in state ACCEPTED."
        side_effects:
          - "Set every non-terminal Segment.state to REJECTED."
          - "Emit AuditEntry STATE_TRANSITION."

  - entity: Document
    initial_state: UPLOADED
    terminal_states: [ARCHIVED]
    transitions:
      - from: UPLOADED
        to: SPLIT
        trigger: "POST /documents/{id}/split"
        actor: ProjectManager
        preconditions:
          - "Parent Project.state == DRAFT."
          - "Document has at least one Segment-eligible chunk parseable by file_format."
        side_effects:
          - "Create one Segment row per parsed unit (sentence or paragraph per split_mode)."
          - "Run repetition_detection calculation across new Segments."
          - "Recompute Document.word_count and Project.word_count."
      - from: SPLIT
        to: ARCHIVED
        trigger: "DELETE /documents/{id}"
        actor: ProjectManager
        preconditions:
          - "Parent Project.state in {DRAFT, CANCELLED}."
        side_effects:
          - "Set every child Segment to REJECTED."
          - "Recompute Document.word_count and Project.word_count."

  - entity: Segment
    initial_state: NEW
    terminal_states: [FINAL_APPROVED, REJECTED]
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "system: included in TRANSLATOR Assignment that transitions to ACCEPTED"
        actor: system
        preconditions:
          - "Assignment.role == TRANSLATOR and Assignment.state == ACCEPTED."
        side_effects:
          - "Set Segment.assignment_id to the accepting Assignment.id."
          - "Recompute Translator.workload_segments_open."
      - from: ASSIGNED
        to: TRANSLATED
        trigger: "POST /segments/{id}/submit-translation"
        actor: Translator
        preconditions:
          - "Acting translator is the assignee of the current Assignment with role TRANSLATOR."
          - "translated_text in request is non-empty."
        side_effects:
          - "Run terminology_consistency_check; create TerminologyEntry CONFLICT rows if any mismatch."
          - "Recompute Translator.workload_segments_open."
          - "Bubble up: re-evaluate Project state for ACTIVE → ALL_TRANSLATED."
      - from: TRANSLATED
        to: REVIEWED
        trigger: "POST /segments/{id}/submit-review"
        actor: Reviewer
        preconditions:
          - "Acting translator is the assignee of an Assignment with role REVIEWER covering this segment."
          - "reviewed_text in request is non-empty."
        side_effects:
          - "Bubble up: re-evaluate Project state for ALL_TRANSLATED → ALL_REVIEWED."
      - from: REVIEWED
        to: FINAL_APPROVED
        trigger: "POST /segments/{id}/final-approve"
        actor: FinalReviewer
        preconditions:
          - "Acting translator is the assignee of an Assignment with role FINAL_REVIEWER covering this segment."
          - "Every project-scoped TerminologyEntry in CONFLICT has been resolved."
        side_effects:
          - "Bubble up: re-evaluate Project state for ALL_REVIEWED → PUBLISHED eligibility."
      - from: TRANSLATED
        to: NEW
        trigger: "POST /segments/{id}/reject (by Reviewer)"
        actor: Reviewer
        preconditions:
          - "Acting Reviewer holds an Assignment covering the segment."
          - "Reject reason supplied."
        side_effects:
          - "Set Segment.assignment_id to null."
          - "Recompute Translator.workload_segments_open for the original translator."
          - "Bubble up: if Project was ALL_TRANSLATED, regress to ACTIVE."
        note: "Cycle: REVIEWED rejection sends segment back to NEW (rework loop)."
      - from: REVIEWED
        to: TRANSLATED
        trigger: "POST /segments/{id}/reject (by FinalReviewer)"
        actor: FinalReviewer
        preconditions:
          - "Acting FinalReviewer holds an Assignment covering the segment."
        side_effects:
          - "Bubble up: if Project was ALL_REVIEWED, regress to ALL_TRANSLATED."
          - "Append a QualityScore DRAFT recording the FinalReviewer's reported errors when the reject body includes errors[]."
        note: "Cycle: FINAL_REVIEWER rejection sends segment back to TRANSLATED."

  - entity: Assignment
    initial_state: PENDING
    terminal_states: [COMPLETED, REJECTED, EXPIRED, REASSIGNED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: Translator
        preconditions:
          - "now() < accept_deadline_at."
          - "Acting translator is Assignment.translator_id."
          - "Translator.test_translation_passed is true."
          - "Translator.availability_status in {AVAILABLE, BUSY}."
        side_effects:
          - "Set accepted_at = now()."
          - "Set stage_deadline_at = accepted_at + STAGE_LIMIT_HOURS[role]."
          - "For TRANSLATOR role: transition every covered Segment.state NEW → ASSIGNED."
          - "Recompute Translator.workload_segments_open."
      - from: PENDING
        to: REJECTED
        trigger: "POST /assignments/{id}/reject"
        actor: Translator
        preconditions:
          - "Acting translator is Assignment.translator_id."
          - "now() < accept_deadline_at."
        side_effects:
          - "Emit ExternalSyncRecord(target=IM, trigger=ASSIGNMENT_REJECTED)."
          - "Mark this Assignment terminal but spawn a successor Assignment (state PENDING) to a different translator selected per selector_translator_match; old segments remain NEW."
        note: "Branching with divergent side effects vs ACCEPTED."
      - from: PENDING
        to: EXPIRED
        trigger: "system: when now() >= accept_deadline_at"
        actor: system
        preconditions:
          - "Assignment still in PENDING."
        side_effects:
          - "Spawn successor Assignment (state PENDING) to a different translator; old segments remain NEW."
          - "Emit ExternalSyncRecord(target=IM, trigger=ASSIGNMENT_REJECTED)."
      - from: ACCEPTED
        to: COMPLETED
        trigger: "system: when every covered Segment reaches the next-stage state matching this Assignment.role"
        actor: system
        preconditions:
          - "Assignment.role==TRANSLATOR and every covered Segment.state in {TRANSLATED, REVIEWED, FINAL_APPROVED}, OR"
          - "Assignment.role==REVIEWER and every covered Segment.state in {REVIEWED, FINAL_APPROVED}, OR"
          - "Assignment.role==FINAL_REVIEWER and every covered Segment.state == FINAL_APPROVED."
        side_effects:
          - "Recompute Translator.workload_segments_open."
      - from: ACCEPTED
        to: REASSIGNED
        trigger: "POST /assignments/{id}/reassign"
        actor: ProjectManager
        preconditions:
          - "Assignment.state == ACCEPTED."
          - "now() > stage_deadline_at, OR ProjectManager-supplied reason='STALE'."
        side_effects:
          - "For Assignment.role==TRANSLATOR: regress every covered Segment back to NEW."
          - "Spawn successor Assignment to a different translator."
          - "Emit ExternalSyncRecord(target=IM, trigger=STAGE_DEADLINE_BREACHED)."

  - entity: TerminologyEntry
    initial_state: PROPOSED
    terminal_states: [ARCHIVED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /terminology/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "No existing APPROVED entry exists for the same {scope_type, scope_id, source_lang, target_lang, source_term} tuple."
        side_effects:
          - "Re-run terminology_consistency_check across project Segments referencing the term."
      - from: PROPOSED
        to: CONFLICT
        trigger: "system: discovered duplicate source_term with different target_term in same scope"
        actor: system
        preconditions:
          - "Another TerminologyEntry with same {scope_type, scope_id, source_lang, target_lang, source_term} but different target_term exists in PROPOSED or APPROVED."
        side_effects:
          - "Emit AuditEntry STATE_TRANSITION."
      - from: CONFLICT
        to: APPROVED
        trigger: "POST /terminology/{id}/resolve"
        actor: ProjectManager
        preconditions:
          - "The other conflicting entry is set to ARCHIVED in the same request body."
        side_effects:
          - "Archive the loser; re-run terminology_consistency_check."
      - from: PROPOSED
        to: ARCHIVED
        trigger: "DELETE /terminology/{id}"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ARCHIVED
        trigger: "DELETE /terminology/{id}"
        actor: ProjectManager
        preconditions:
          - "Parent Project.state != PUBLISHED."
        side_effects: []

  - entity: QualityScore
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /quality-scores/{id}/finalize"
        actor: FinalReviewer
        preconditions:
          - "Underlying Segment.state == FINAL_APPROVED."
          - "errors[] is non-empty OR caller explicitly sets zero-error flag."
        side_effects:
          - "Compute error_density via error_density rule."
          - "Compute score via scoring_rubric."
          - "Recompute Translator.rolling_quality_score and latest_quality_score for the credited translator."
          - "Emit AuditEntry QUALITY_SCORED."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /quality-scores/{id}/void"
        actor: ProjectManager
        preconditions:
          - "QualityScore.state == DRAFT."
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two Translators simultaneously accept the same PENDING Assignment."
    guarantee: "At most one acceptance succeeds; the loser receives ERR_ASSIGNMENT_ALREADY_TAKEN."
    error_id: ERR_ASSIGNMENT_ALREADY_TAKEN
    http_status: 409
    serialization: "First-writer-wins on Assignment.state transition PENDING -> ACCEPTED."

  - scenario: "Reviewer submits review for a Segment while a parallel FinalReviewer rejects it back to TRANSLATED."
    guarantee: "Exactly one operation persists; loser receives ERR_INVALID_SEGMENT_STATE."
    error_id: ERR_INVALID_SEGMENT_STATE
    http_status: 409
    serialization: "First-writer-wins on Segment.state."

  - scenario: "ProjectManager publishes a Project while a concurrent FinalReviewer rejects one of its Segments."
    guarantee: "Exactly one wins; if reject persisted first, publish receives ERR_PROJECT_NOT_READY; if publish persisted first, reject receives ERR_INVALID_SEGMENT_STATE."
    error_id: ERR_PROJECT_NOT_READY
    http_status: 409
    serialization: "First-writer-wins on Project.state."

  - scenario: "Two TerminologyEntry rows proposed in the same scope with identical source_term but different target_term within the same instant."
    guarantee: "Both rows persist but each is marked CONFLICT; subsequent approvals must resolve."
    error_id: ERR_TERMINOLOGY_CONFLICT
    http_status: 409
    serialization: "Detector runs after insert; both losers."

  - scenario: "Two QualityScore.finalize calls land for the same Segment."
    guarantee: "Only one FINALIZED per Segment; second receives ERR_QUALITY_SCORE_ALREADY_FINALIZED."
    error_id: ERR_QUALITY_SCORE_ALREADY_FINALIZED
    http_status: 409
    serialization: "First-writer-wins on QualityScore.state."

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: repetition_detection
    trigger: "Side effect of Document.UPLOADED -> SPLIT transition (POST /documents/{id}/split)."
    algorithm: aggregation
    formula: |
      # For each newly created Segment s under document d:
      #   normalized = lowercase(strip_punct(s.source_text))
      #   match_count = number of pre-existing Segments p in Project p.project_id == d.project_id
      #                 whose normalized(source_text) == normalized
      #                 AND p.id != s.id
      #                 AND p.repetition_class != ARCHIVED
      #   tm_match_pct = max(fuzzy_similarity(s, p) over the same set; integer 0..100)
      #
      #   if match_count >= 1 and tm_match_pct == 100:
      #     s.repetition_class = EXACT_REPEAT;  s.tm_leverage_pct = 100
      #   elif tm_match_pct >= TM_LEVERAGE_PCT_THRESHOLD:
      #     s.repetition_class = TM_LEVERAGE;   s.tm_leverage_pct = tm_match_pct
      #   elif tm_match_pct >= FUZZY_PCT_THRESHOLD:
      #     s.repetition_class = FUZZY;         s.tm_leverage_pct = tm_match_pct
      #   else:
      #     s.repetition_class = NEW;           s.tm_leverage_pct = 0
      #
      # Ordering: process Segments in ascending (document_id, ordinal). Earliest segment
      # in the project for a given normalized text remains NEW; subsequent matches classify
      # against it. Tie-break for equal tm_match_pct: prefer the earliest matched p (lowest
      # (document_id, ordinal)).
    input_set: "All Segments under the same Project, including those created in earlier splits; excludes Segments whose Document.state == ARCHIVED."
    constants:
      TM_LEVERAGE_PCT_THRESHOLD: 95
      FUZZY_PCT_THRESHOLD: 75
    precision: "tm_leverage_pct is integer; repetition_class enum."
    variants: []

  - name: urgency_tier_assignment
    trigger: "Side effect of Project.DRAFT -> QUOTED transition."
    algorithm: threshold
    formula: |
      hours_to_deadline = (deadline_at - now()) / 1h
      if hours_to_deadline < CRITICAL_HOURS:        urgency_tier = CRITICAL
      elif hours_to_deadline < RUSH_HOURS:          urgency_tier = RUSH
      else:                                          urgency_tier = STANDARD
      # Boundary precision: strict less-than. exactly hours_to_deadline == CRITICAL_HOURS => RUSH.
    input_set: "Project itself; clock value at moment of transition."
    constants:
      CRITICAL_HOURS: 48
      RUSH_HOURS: 168
    precision: "integer hours."
    variants: []

  - name: project_quote
    trigger: "Side effect of Project.DRAFT -> QUOTED transition."
    algorithm: forward_looking
    formula: |
      # Forward-looking estimate. Iterates Segments in order (document_id, ordinal).
      # per-segment computation depends on Project.unit_pricing_mode:
      #   PER_WORD:    unit_qty = Segment.word_count
      #   PER_SEGMENT: unit_qty = 1
      #   PER_FILE:    unit_qty = (1 if Segment is first ordinal=1 of its Document else 0)
      #
      # rep_multiplier_bps = REP_TIER[Segment.repetition_class]
      # grade_mult_bps     = 10000  # forward-looking quote ASSUMES SENIOR grade; actual translator unknown
      # base_cents         = base_unit_price_cents * unit_qty
      # rep_adjusted_cents = round_half_up(base_cents * rep_multiplier_bps / 10000)
      # graded_cents       = round_half_up(rep_adjusted_cents * grade_mult_bps / 10000)
      # per_segment_cents  = graded_cents
      #
      # subtotal_cents = sum(per_segment_cents over all Segments)
      # urgency_mult_bps = URGENCY_MULT[urgency_tier]
      # quoted_total_cents = round_half_up(subtotal_cents * urgency_mult_bps / 10000)
      #
      # Rounding order is fixed: round per-segment first, sum, then round once when applying urgency.
    input_set: "All Segments under the project whose Document.state == SPLIT."
    constants:
      REP_TIER:
        NEW: 10000
        FUZZY: 6000
        TM_LEVERAGE: 3000
        EXACT_REPEAT: 1500
      URGENCY_MULT:
        STANDARD: 10000
        RUSH: 12500
        CRITICAL: 15000
    precision: "integer cents; round_half_up at each pinned step."
    variants:
      - name: final_payout
        when: "Project.ALL_REVIEWED -> PUBLISHED transition (chronological, post-quality)."
        difference: |
          Same per-segment formula scaffold but:
            (1) grade_mult_bps = GRADE_MULT[Translator.grade] where Translator is the actual
                TRANSLATOR-role assignee credited with Segment.translated_text;
            (2) after the urgency multiplication, subtract quality_deduction_cents computed
                by quality_deduction calculation;
            (3) the result is the chronological final_payout_cents which usually differs from
                quoted_total_cents for the same word_count because grade differs from the SENIOR
                assumption AND quality deductions apply.

  - name: final_payout
    trigger: "Side effect of Project.ALL_REVIEWED -> PUBLISHED transition."
    algorithm: chronological
    formula: |
      # Per Segment, in order (document_id, ordinal):
      #   unit_qty = (PER_WORD: Segment.word_count; PER_SEGMENT: 1; PER_FILE: 1 iff ordinal==1)
      #   rep_multiplier_bps = REP_TIER[Segment.repetition_class]
      #   translator         = Translator credited with submitting Segment.translated_text
      #                         (i.e. assignee of the most recently COMPLETED TRANSLATOR-role
      #                          Assignment that covered the segment in its terminal lineage)
      #   grade_mult_bps     = GRADE_MULT[translator.grade]
      #   base_cents         = base_unit_price_cents * unit_qty
      #   rep_adjusted_cents = round_half_up(base_cents * rep_multiplier_bps / 10000)
      #   graded_cents       = round_half_up(rep_adjusted_cents * grade_mult_bps / 10000)
      #
      # subtotal_cents     = sum(graded_cents)
      # urgency_mult_bps   = URGENCY_MULT[urgency_tier]
      # urgency_cents      = round_half_up(subtotal_cents * urgency_mult_bps / 10000)
      # quality_ded_cents  = quality_deduction(project)   # see calculation quality_deduction
      # final_payout_cents = max(0, urgency_cents - quality_ded_cents)
      #
      # Rounding order: per-segment first, then sum, then urgency, then quality deduction subtraction.
    input_set: "All Segments under the project whose state == FINAL_APPROVED at publish time."
    constants:
      REP_TIER:
        NEW: 10000
        FUZZY: 6000
        TM_LEVERAGE: 3000
        EXACT_REPEAT: 1500
      URGENCY_MULT:
        STANDARD: 10000
        RUSH: 12500
        CRITICAL: 15000
      GRADE_MULT:
        JUNIOR: 8000
        INTERMEDIATE: 10000
        SENIOR: 12000
        EXPERT: 14000
    precision: "integer cents; round_half_up."
    variants: []

  - name: quality_deduction
    trigger: "Invoked by final_payout."
    algorithm: weighted_scoring
    formula: |
      # For every FINALIZED QualityScore q tied to a FINAL_APPROVED Segment in the project:
      #   q.score is 0..100
      #   deduction_pct_bps = max(0, (QUALITY_BAR - q.score) * QUALITY_DEDUCTION_PER_POINT_BPS)
      #   segment_cents      = the segment's `graded_cents` from final_payout (NOT the urgency-multiplied value)
      #   segment_deduction  = round_half_up(segment_cents * deduction_pct_bps / 10000)
      # quality_deduction_cents = sum(segment_deduction)
      # If a FINAL_APPROVED segment has no FINALIZED QualityScore: segment_deduction = 0.
    input_set: "QualityScore rows in state FINALIZED whose Segment is FINAL_APPROVED in the project."
    constants:
      QUALITY_BAR: 90
      QUALITY_DEDUCTION_PER_POINT_BPS: 50
    precision: "integer cents."
    variants: []

  - name: tax_on_payout
    trigger: "Side effect of Project.ALL_REVIEWED -> PUBLISHED transition (after final_payout)."
    algorithm: aggregation
    formula: |
      tax_amount_cents = round_half_up(final_payout_cents * Client.tax_rate_bps / 10000)
    input_set: "Project.final_payout_cents and Client.tax_rate_bps."
    constants: {}
    precision: "integer cents."
    variants: []

  - name: error_density
    trigger: "Side effect of QualityScore.DRAFT -> FINALIZED transition."
    algorithm: weighted_scoring
    formula: |
      # weighted_errors = sum over errors[] of SEVERITY_WEIGHT[error.severity] * error.count
      # words = max(1, Segment.word_count)
      # error_density = round_half_up(weighted_errors * 1000 / words, 2 decimal places)
    input_set: "QualityScore.errors[] and its parent Segment.word_count."
    constants:
      SEVERITY_WEIGHT:
        MINOR: 1
        MAJOR: 3
        CRITICAL: 9
    precision: "2 decimal places, round_half_up."
    variants: []

  - name: scoring_rubric
    trigger: "Side effect of QualityScore.DRAFT -> FINALIZED transition (after error_density)."
    algorithm: threshold
    formula: |
      # score = clamp(100 - error_density * PENALTY_PER_DENSITY_UNIT, 0, 100)
      # Score is rounded to 2 decimal places, round_half_up.
      # Boundary: score >= 90 means "passing"; score < 90 contributes to quality_deduction.
    input_set: "QualityScore.error_density."
    constants:
      PENALTY_PER_DENSITY_UNIT: 2.5
    precision: "2 decimal places."
    variants: []

  - name: rolling_translator_rating
    trigger: "Side effect of QualityScore.DRAFT -> FINALIZED transition AND Project.ALL_REVIEWED -> PUBLISHED transition."
    algorithm: aggregation
    formula: |
      # For Translator t, gather every FINALIZED QualityScore q whose translator_id == t.id
      # AND whose finalized_at lies within the last ROLLING_WINDOW_DAYS at the moment of computation.
      # rolling_quality_score = round_half_up(arithmetic mean of q.score over that window, 2 decimals)
      # If the window is empty: rolling_quality_score = 100.00 (default, not zero).
      # Tie-break for ordering: not applicable (arithmetic mean is order-independent).
    input_set: "QualityScore rows in state FINALIZED, filtered to translator_id, within the rolling window."
    constants:
      ROLLING_WINDOW_DAYS: 90
    precision: "2 decimal places."
    variants:
      - name: latest_translator_rating
        when: "Same triggers, but writes Translator.latest_quality_score instead."
        difference: |
          Variant takes only the SINGLE most recent FINALIZED QualityScore (by finalized_at
          descending; tie-break: by QualityScore.id ascending). If none exist, returns 100.00.
          The rolling variant averages across a window; the latest variant snapshots one row.
          Same underlying entity (Translator), different aggregation semantics produce
          different numbers when the window holds two or more disagreeing scores.

  - name: selector_translator_match
    trigger: "Invoked when creating a successor Assignment after PENDING -> REJECTED or PENDING -> EXPIRED or ACCEPTED -> REASSIGNED transitions."
    algorithm: topological
    formula: |
      # Candidate set: Translators t where:
      #   t.test_translation_passed == true
      #   t.availability_status == AVAILABLE
      #   Project.{source_lang, target_lang} is in t.language_pairs (exact match)
      #   Project.domain is in t.domains
      #   t.workload_segments_open + len(Assignment.segment_ids) <= MAX_WORKLOAD_SEGMENTS
      #   t.id is NOT in EXCLUDED_TRANSLATOR_IDS (previous rejecter/expirer chain)
      # Ranking expression:
      #   1) higher t.rolling_quality_score wins
      #   2) lower t.workload_segments_open wins
      #   3) lower t.id (lexicographic) wins (deterministic tie-break)
      # Empty pool: do NOT create successor; raise ERR_NO_ELIGIBLE_TRANSLATOR (409).
    input_set: "All Translators, with the candidate filter above."
    constants:
      MAX_WORKLOAD_SEGMENTS: 200
    precision: "n/a."
    variants: []

# =============================================================================
# §1.4 Validation Rules (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is authorized for endpoint per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every referenced resource id in path resolves left-to-right; e.g. /projects/{p}/documents/{d} validates p then d."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this operation per the relevant state machine."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-changing endpoints"

  - priority: 5
    category: state
    check: "Segment-specific state precondition for translation/review/final-review submissions and rejections."
    error_id: ERR_INVALID_SEGMENT_STATE
    http_status: 409
    applies_to: "/segments/{id}/submit-translation, /segments/{id}/submit-review, /segments/{id}/final-approve, /segments/{id}/reject"

  - priority: 6
    category: state
    check: "Assignment must be in PENDING to accept/reject; must be ACCEPTED to reassign; covered Segments must be in the role's pre-state when accepting."
    error_id: ERR_INVALID_ASSIGNMENT_STATE
    http_status: 409
    applies_to: "/assignments/{id}/accept, /assignments/{id}/reject, /assignments/{id}/reassign"

  - priority: 7
    category: business_safety
    check: "Translator.test_translation_passed must be true at Assignment acceptance time."
    error_id: ERR_TEST_TRANSLATION_REQUIRED
    http_status: 422
    applies_to: "/assignments/{id}/accept"

  - priority: 8
    category: business_referential
    check: "Project source_lang/target_lang pair must appear in Translator.language_pairs for any Assignment to that Translator; Project.domain must appear in Translator.domains."
    error_id: ERR_TRANSLATOR_PROFILE_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/assignments, /assignments/{id}/accept"

  - priority: 9
    category: business_temporal
    check: "now() < Assignment.accept_deadline_at when accepting/rejecting."
    error_id: ERR_ACCEPT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "/assignments/{id}/accept, /assignments/{id}/reject"

  - priority: 10
    category: business_constraint
    check: "Segments included in an Assignment must all belong to Project, must be in the role's pre-state at dispatch, and must not be in another Assignment that is still ACCEPTED or PENDING for the same role."
    error_id: ERR_SEGMENT_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /projects/{id}/assignments"

  - priority: 11
    category: business_constraint
    check: "Assignment.segment_ids size <= Project.package_size_segments."
    error_id: ERR_PACKAGE_SIZE_EXCEEDED
    http_status: 422
    applies_to: "POST /projects/{id}/assignments"

  - priority: 12
    category: business_constraint
    check: "Translator.workload_segments_open + new package size <= MAX_WORKLOAD_SEGMENTS (200)."
    error_id: ERR_TRANSLATOR_OVERLOADED
    http_status: 422
    applies_to: "POST /projects/{id}/assignments, /assignments/{id}/accept"

  - priority: 13
    category: business_constraint
    check: "Terminology consistency: when publishing, no project-scoped TerminologyEntry is in CONFLICT."
    error_id: ERR_TERMINOLOGY_CONFLICT
    http_status: 409
    applies_to: "POST /projects/{id}/publish"

  - priority: 14
    category: business_constraint
    check: "Repetition rate gate: if (sum of word_count over EXACT_REPEAT Segments) / Project.word_count >= REPETITION_HIGH_THRESHOLD, base_unit_price_cents in request body for /projects must be >= MIN_HIGH_REPETITION_PRICE_CENTS; boundary >= 75% triggers."
    error_id: ERR_REPETITION_PRICE_TOO_LOW
    http_status: 422
    applies_to: "POST /projects, PUT /projects/{id}"
    description: "Boundary precision: 75.00% triggers, 74.99% does not."

  - priority: 15
    category: business_fiscal
    check: "Project.base_unit_price_cents >= 1 (no zero-priced unit)."
    error_id: ERR_INVALID_PRICE
    http_status: 422
    applies_to: "POST /projects, PUT /projects/{id}"

  - priority: 16
    category: business_temporal
    check: "Project.deadline_at must be strictly greater than created_at (>, not >=)."
    error_id: ERR_DEADLINE_NOT_IN_FUTURE
    http_status: 422
    applies_to: "POST /projects, PUT /projects/{id}"

  - priority: 17
    category: business_constraint
    check: "Project source_lang != target_lang."
    error_id: ERR_SAME_SOURCE_TARGET
    http_status: 422
    applies_to: "POST /projects, PUT /projects/{id}"

  - priority: 18
    category: business_constraint
    check: "Publish gate: no Segments may be empty-collection (Project must have word_count > 0)."
    error_id: ERR_EMPTY_PROJECT
    http_status: 422
    applies_to: "POST /projects/{id}/quote, POST /projects/{id}/publish"

  - priority: 19
    category: business_constraint
    check: "OCC: when If-Match version supplied, must equal current entity.version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PUT /projects/{id}, PUT /clients/{id}, PUT /terminology/{id}"

  - priority: 20
    category: business_constraint
    check: "Request body schema (types, enum membership, required fields)."
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: "all mutating endpoints"

# =============================================================================
# §1.5 Endpoints
# =============================================================================
endpoints:
  # ----- Client -----
  - method: POST
    path: "/clients"
    description: "Create a Client."
    roles: [ProjectManager]
    code: 201
    input: [name, contact_email, tax_rate_bps, payment_cycle_days]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Get a Client by id."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List Clients (paginated)."
    roles: [ProjectManager]
    code: 200
    input: [limit?, offset?, status?]
    output: "Client[]"
    side_effects: []

  # ----- Translator -----
  - method: POST
    path: "/translators"
    description: "Create a Translator."
    roles: [ProjectManager]
    code: 201
    input: [display_name, language_pairs, domains, grade]
    output: Translator
    side_effects: []

  - method: POST
    path: "/translators/{id}/pass-test"
    description: "Mark Translator.test_translation_passed = true."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Translator
    side_effects: ["Set test_translation_passed=true."]

  - method: GET
    path: "/translators/{id}"
    description: "Get a Translator by id."
    roles: [ProjectManager, Translator]
    code: 200
    input: []
    output: Translator
    side_effects: []

  - method: GET
    path: "/translators"
    description: "List Translators (filter by availability_status, domain)."
    roles: [ProjectManager]
    code: 200
    input: [limit?, offset?, availability_status?, domain?]
    output: "Translator[]"
    side_effects: []

  # ----- Project -----
  - method: POST
    path: "/projects"
    description: "Create a Project."
    roles: [ProjectManager]
    code: 201
    input: [client_id, name, source_lang, target_lang, domain, deadline_at, unit_pricing_mode, base_unit_price_cents, package_size_segments?, template_id?]
    output: Project
    side_effects: []

  - method: GET
    path: "/projects/{id}"
    description: "Get a Project by id (includes computed totals when present)."
    roles: [ProjectManager, Translator]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: PUT
    path: "/projects/{id}"
    description: "Update a DRAFT project's profile."
    roles: [ProjectManager]
    code: 200
    input: [name?, deadline_at?, base_unit_price_cents?, package_size_segments?, version?]
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{id}/quote"
    description: "Compute quote and transition DRAFT -> QUOTED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Run project_quote, urgency_tier_assignment."]

  - method: POST
    path: "/projects/{id}/activate"
    description: "Transition QUOTED -> ACTIVE."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Lock pricing."]

  - method: POST
    path: "/projects/{id}/publish"
    description: "Transition ALL_REVIEWED -> PUBLISHED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Run final_payout, tax_on_payout, rolling_translator_rating, latest_translator_rating; emit ExternalSyncRecord rows."]

  - method: POST
    path: "/projects/{id}/cancel"
    description: "Transition DRAFT|ACTIVE -> CANCELLED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["Reject all non-terminal Segments and PENDING Assignments."]

  - method: GET
    path: "/projects"
    description: "List Projects (filter by state, client_id)."
    roles: [ProjectManager]
    code: 200
    input: [limit?, offset?, state?, client_id?]
    output: "Project[]"
    side_effects: []

  # ----- ProjectTemplate -----
  - method: POST
    path: "/project-templates"
    description: "Create a ProjectTemplate."
    roles: [ProjectManager]
    code: 201
    input: [name, default_domain, default_unit_pricing_mode, default_base_unit_price_cents, default_package_size_segments]
    output: ProjectTemplate
    side_effects: []

  - method: GET
    path: "/project-templates/{id}"
    description: "Get a ProjectTemplate."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProjectTemplate
    side_effects: []

  # ----- Document & Segment -----
  - method: POST
    path: "/projects/{id}/documents"
    description: "Upload a Document under a Project."
    roles: [ProjectManager]
    code: 201
    input: [filename, file_format, split_mode, raw_text]
    output: Document
    side_effects: []

  - method: POST
    path: "/documents/{id}/split"
    description: "Split a Document into Segments."
    roles: [ProjectManager]
    code: 200
    input: []
    output: Document
    side_effects: ["Create Segments; run repetition_detection; recompute word_counts."]

  - method: DELETE
    path: "/documents/{id}"
    description: "Archive a Document (only allowed when parent Project is DRAFT or CANCELLED)."
    roles: [ProjectManager]
    code: 204
    input: []
    output: null
    side_effects: ["Reject child Segments; recompute Project.word_count."]

  - method: GET
    path: "/segments/{id}"
    description: "Get a Segment by id."
    roles: [ProjectManager, Translator]
    code: 200
    input: []
    output: Segment
    side_effects: []

  - method: POST
    path: "/segments/{id}/submit-translation"
    description: "Translator submits translated_text. Transition ASSIGNED -> TRANSLATED."
    roles: [Translator]
    code: 200
    input: [translated_text]
    output: Segment
    side_effects: ["Run terminology_consistency_check; bubble up to Project state."]

  - method: POST
    path: "/segments/{id}/submit-review"
    description: "Reviewer submits reviewed_text. Transition TRANSLATED -> REVIEWED."
    roles: [Translator]
    code: 200
    input: [reviewed_text]
    output: Segment
    side_effects: ["Bubble up to Project state."]

  - method: POST
    path: "/segments/{id}/final-approve"
    description: "FinalReviewer confirms. Transition REVIEWED -> FINAL_APPROVED."
    roles: [Translator]
    code: 200
    input: []
    output: Segment
    side_effects: ["Bubble up to Project state; mark eligible for QualityScore finalization."]

  - method: POST
    path: "/segments/{id}/reject"
    description: "Reject a Segment back to its previous workflow state; cycle."
    roles: [Translator]
    code: 200
    input: [reason, errors?]
    output: Segment
    side_effects: ["Regress Segment; bubble up to demote Project; optionally create DRAFT QualityScore when errors[] present."]

  # ----- Assignment -----
  - method: POST
    path: "/projects/{id}/assignments"
    description: "Dispatch an Assignment to a Translator."
    roles: [ProjectManager]
    code: 201
    input: [translator_id, role, segment_ids]
    output: Assignment
    side_effects: ["Set accept_deadline_at = now() + ACCEPT_WINDOW_HOURS; emit ExternalSyncRecord IM ASSIGNMENT_DISPATCHED."]

  - method: GET
    path: "/assignments/{id}"
    description: "Get an Assignment."
    roles: [ProjectManager, Translator]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/assignments/{id}/accept"
    description: "Translator accepts an Assignment."
    roles: [Translator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Transition Segments NEW->ASSIGNED (TRANSLATOR role); set stage_deadline_at."]

  - method: POST
    path: "/assignments/{id}/reject"
    description: "Translator rejects an Assignment."
    roles: [Translator]
    code: 200
    input: [reason]
    output: Assignment
    side_effects: ["Spawn successor Assignment via selector_translator_match; emit ExternalSyncRecord IM."]

  - method: POST
    path: "/assignments/{id}/reassign"
    description: "ProjectManager forces reassignment of an ACCEPTED Assignment."
    roles: [ProjectManager]
    code: 200
    input: [reason]
    output: Assignment
    side_effects: ["Regress covered Segments (TRANSLATOR role); spawn successor; emit STAGE_DEADLINE_BREACHED sync."]

  # ----- Terminology -----
  - method: POST
    path: "/terminology"
    description: "Create a TerminologyEntry."
    roles: [ProjectManager, Translator]
    code: 201
    input: [scope_type, scope_id, source_lang, target_lang, source_term, target_term]
    output: TerminologyEntry
    side_effects: ["Run conflict detector; may transition to CONFLICT."]

  - method: POST
    path: "/terminology/{id}/approve"
    description: "Approve a TerminologyEntry."
    roles: [ProjectManager]
    code: 200
    input: []
    output: TerminologyEntry
    side_effects: ["Re-run terminology_consistency_check."]

  - method: POST
    path: "/terminology/{id}/resolve"
    description: "Resolve a CONFLICT terminology pair by archiving the loser id."
    roles: [ProjectManager]
    code: 200
    input: [loser_id]
    output: TerminologyEntry
    side_effects: ["Archive loser; re-run consistency check."]

  - method: DELETE
    path: "/terminology/{id}"
    description: "Archive a TerminologyEntry."
    roles: [ProjectManager]
    code: 204
    input: []
    output: null
    side_effects: []

  - method: GET
    path: "/terminology"
    description: "List TerminologyEntry rows."
    roles: [ProjectManager, Translator]
    code: 200
    input: [scope_type?, scope_id?, state?, limit?, offset?]
    output: "TerminologyEntry[]"
    side_effects: []

  # ----- QualityScore -----
  - method: POST
    path: "/quality-scores"
    description: "Create a DRAFT QualityScore for a Segment."
    roles: [Translator, ProjectManager]
    code: 201
    input: [segment_id, errors]
    output: QualityScore
    side_effects: []

  - method: POST
    path: "/quality-scores/{id}/finalize"
    description: "Finalize a QualityScore. Compute error_density and score; cascade to Translator rating."
    roles: [Translator]
    code: 200
    input: []
    output: QualityScore
    side_effects: ["Run error_density, scoring_rubric, rolling_translator_rating, latest_translator_rating."]

  - method: POST
    path: "/quality-scores/{id}/void"
    description: "Void a DRAFT QualityScore."
    roles: [ProjectManager]
    code: 200
    input: []
    output: QualityScore
    side_effects: []

  # ----- Audit & Sync -----
  - method: GET
    path: "/audit-entries"
    description: "List audit entries (filter by subject)."
    roles: [ProjectManager]
    code: 200
    input: [subject_type?, subject_id?, limit?, offset?]
    output: "AuditEntry[]"
    side_effects: []

  - method: GET
    path: "/external-sync-records"
    description: "List ExternalSyncRecord rows."
    roles: [ProjectManager]
    code: 200
    input: [project_id?, target_system?, limit?, offset?]
    output: "ExternalSyncRecord[]"
    side_effects: []

  # ----- Test-driving endpoints -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the platform clock by a positive number of seconds (test harness). Required to reach time-gated states (Assignment.EXPIRED, stage_deadline_at breach, payable_at)."
    roles: [ProjectManager]
    code: 200
    input: [seconds]
    output: "{ now: datetime }"
    side_effects: ["Re-evaluate any time-gated state machines: PENDING Assignments past accept_deadline_at -> EXPIRED with successor spawn; ACCEPTED past stage_deadline_at remain ACCEPTED but become reassign-eligible."]

  - method: POST
    path: "/_sweep/run"
    description: "Run system sweeps explicitly: time-gated Assignment expiry, Project state bubble-up recomputation."
    roles: [ProjectManager]
    code: 200
    input: []
    output: "{ swept_count: integer }"
    side_effects: ["Idempotent re-evaluation of system-trigger transitions; emits ExternalSyncRecord IM for any expirations."]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for endpoint per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource id in path does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource state does not permit operation."
  - id: ERR_INVALID_SEGMENT_STATE
    http: 409
    condition: "Segment state does not permit the requested submit/review/approve/reject."
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "Assignment state does not permit the requested transition."
  - id: ERR_ASSIGNMENT_ALREADY_TAKEN
    http: 409
    condition: "Two translators race to accept the same PENDING assignment; loser sees this."
  - id: ERR_PROJECT_NOT_READY
    http: 409
    condition: "Project.publish called while at least one Segment is not FINAL_APPROVED."
  - id: ERR_TEST_TRANSLATION_REQUIRED
    http: 422
    condition: "Translator.test_translation_passed is false at acceptance."
  - id: ERR_TRANSLATOR_PROFILE_MISMATCH
    http: 422
    condition: "Translator language_pairs/domains do not cover Project (source_lang, target_lang) / domain."
  - id: ERR_ACCEPT_WINDOW_EXPIRED
    http: 409
    condition: "now() >= Assignment.accept_deadline_at when accepting/rejecting."
  - id: ERR_SEGMENT_ALREADY_ASSIGNED
    http: 409
    condition: "Segment is currently bound to another non-terminal Assignment with the same role."
  - id: ERR_PACKAGE_SIZE_EXCEEDED
    http: 422
    condition: "Assignment.segment_ids size exceeds Project.package_size_segments."
  - id: ERR_TRANSLATOR_OVERLOADED
    http: 422
    condition: "Translator workload would exceed MAX_WORKLOAD_SEGMENTS."
  - id: ERR_TERMINOLOGY_CONFLICT
    http: 409
    condition: "Project-scoped TerminologyEntry remains in CONFLICT state."
  - id: ERR_REPETITION_PRICE_TOO_LOW
    http: 422
    condition: "Project repetition rate >= 75% yet base_unit_price_cents < MIN_HIGH_REPETITION_PRICE_CENTS."
  - id: ERR_INVALID_PRICE
    http: 422
    condition: "Project.base_unit_price_cents < 1."
  - id: ERR_DEADLINE_NOT_IN_FUTURE
    http: 422
    condition: "deadline_at <= created_at."
  - id: ERR_SAME_SOURCE_TARGET
    http: 422
    condition: "Project.source_lang == target_lang."
  - id: ERR_EMPTY_PROJECT
    http: 422
    condition: "Project.word_count == 0 at quote/publish."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match version does not equal current entity.version."
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Request body schema/types/enums violation."
  - id: ERR_NO_ELIGIBLE_TRANSLATOR
    http: 409
    condition: "Successor Assignment spawn finds no eligible candidate."
  - id: ERR_QUALITY_SCORE_ALREADY_FINALIZED
    http: 409
    condition: "Concurrent finalize on the same QualityScore; loser sees this."
  - id: ERR_TERMINOLOGY_RESOLVE_REQUIRES_LOSER
    http: 422
    condition: "/terminology/{id}/resolve body must include loser_id that is the other CONFLICT entry."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProjectManager
    description: "Platform-side operator who creates clients, projects, dispatches assignments, manages terminology, and publishes projects."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients, PUT /clients/{id}, GET /clients (full CRUD)"
      - "POST /translators, POST /translators/{id}/pass-test"
      - "POST /projects, PUT /projects/{id}, POST /projects/{id}/quote, POST /projects/{id}/activate, POST /projects/{id}/publish, POST /projects/{id}/cancel"
      - "POST /project-templates"
      - "POST /projects/{id}/documents, POST /documents/{id}/split, DELETE /documents/{id}"
      - "POST /projects/{id}/assignments, POST /assignments/{id}/reassign"
      - "POST /terminology/{id}/approve, POST /terminology/{id}/resolve, DELETE /terminology/{id}"
      - "POST /quality-scores/{id}/void"
      - "GET /audit-entries, GET /external-sync-records"
      - "POST /_clock/advance, POST /_sweep/run"
    shared_operations:
      - "GET /projects/{id}, GET /translators/{id}, GET /segments/{id}, GET /assignments/{id}, GET /terminology"
      - "POST /terminology (also Translator)"
      - "POST /quality-scores (also Translator)"

  - name: Translator
    description: "Authenticated translator/reviewer/final-reviewer who acts on assigned segments."
    identity: "entity_backed:Translator"
    exclusive_operations:
      - "POST /assignments/{id}/accept, POST /assignments/{id}/reject"
      - "POST /segments/{id}/submit-translation, POST /segments/{id}/submit-review, POST /segments/{id}/final-approve, POST /segments/{id}/reject"
      - "POST /quality-scores/{id}/finalize"
    shared_operations:
      - "GET /projects/{id}, GET /translators/{id}, GET /segments/{id}, GET /assignments/{id}, GET /terminology"
      - "POST /terminology (proposing only; approval restricted to ProjectManager)"
      - "POST /quality-scores (creating DRAFT QualityScore; finalization Translator only)"
