    description: "Create a cell project under a site"
    roles: [ProjectEngineer]
    code: 201
    input: [project_code, contracted_cycle_time_s, contract_value_cents, guaranteed_oee_pct, "guarantee_window_days?"]
    output: CellProject
    side_effects: ["initializes retention_balance_cents = round_half_up(contract_value_cents * org.retention_rate_bps / 10000, 0) and posts the WITHHOLD RetentionLedgerEntry"]
  - method: GET
    path: "/robotics/customer-sites/{id}/cell-projects"
    description: "List projects of a site"
    roles: [FinanceAdmin, ProjectEngineer, SafetyLead, SiteSupervisor, ServiceManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CellProject[]
    side_effects: []
  - method: GET
    path: "/robotics/cell-projects/{id}"
    description: "Fetch one project"
    roles: [FinanceAdmin, ProjectEngineer, SafetyLead, ControlsProgrammer, SiteSupervisor, Trainer, ServiceManager]
    code: 200
    input: []
    output: CellProject
    side_effects: []
  - method: POST
    path: "/robotics/cell-projects/{id}/advance"
    description: "Advance project to next stage (OCC-guarded)"
    roles: [ProjectEngineer, SiteSupervisor]
    code: 200
    input: [expected_project_version]
    output: CellProject
    side_effects: ["per state machine: gate checks, retention RELEASE postings on FAT->SHIP and SAT->TRAINING, ThroughputGuarantee initialization on SAT->TRAINING", "increments CellProject.version by 1"]
  - method: POST
    path: "/robotics/cell-projects/{id}/hold"
    description: "Put project ON_HOLD"
    roles: [ProjectEngineer]
    code: 200
    input: [hold_reason]
    output: CellProject
    side_effects: ["increments CellProject.version by 1"]
  - method: POST
    path: "/robotics/cell-projects/{id}/resume"
    description: "Resume from ON_HOLD to prior status"
    roles: [ProjectEngineer]
    code: 200
    input: []
    output: CellProject
    side_effects: ["increments CellProject.version by 1"]
  - method: POST
    path: "/robotics/cell-projects/{id}/terminate"
    description: "Terminate a project (FinanceAdmin), cascading children to terminal states"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: CellProject
    side_effects: ["cascade children", "increments CellProject.version by 1"]

