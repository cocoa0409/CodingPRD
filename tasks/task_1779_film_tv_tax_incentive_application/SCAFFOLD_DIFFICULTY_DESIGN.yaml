            - "app2 one second later: error_id == ERR_APPLICATION_DEADLINE_PASSED (http 409), status stays DRAFT"

      - name: issue_credit_exact_cap_fit
        grounds:
          - state_machines.IncentiveApplication.APPROVED_to_CREDIT_ISSUED
          - errors[ERR_PROGRAM_CAP_EXHAUSTED]
          - entities.JurisdictionProgram.fields.remaining_cap_cents
        distinguishing_aspect: |
          Metric: cents of program cap, endpoint: issue-credit. Final credit
          EXACTLY EQUAL to remaining_cap_cents (37500000 == 37500000)
          succeeds (rejection requires strictly greater) and drives
          remaining_cap_cents to exactly 0; a follow-up issuance of any
          positive credit on a second application then fails
          ERR_PROGRAM_CAP_EXHAUSTED.
        test_recipe:
          setup:
            - "NM-variant program: annual_cap 37500000, elevated threshold 50000000, OPEN"
            - "Application A APPROVED, audit ACCEPTED with attested 20000000 / 105000000 -> capped 125000000 @ 0.30 -> final credit EXACTLY 37500000"
            - "Application B (second production) APPROVED, audit ACCEPTED with attested 0 / 20000000 -> final credit 5000000"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "NM", program_name: "NM Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 37500000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 50000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
