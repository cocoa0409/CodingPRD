          assert:
            - "the call returns error_id == 'ERR_PERISHABLE_SAFETY_VIOLATION' with http_status 422, NOT 'ERR_BRANDING_PROFILE_NOT_APPROVED' (SKU created at clock default 2026-03-01T00:00:00Z with shelf_life_days=5 expires 2026-03-06, before the requested scheduled_date of 2026-03-20; branding is also unapproved, but priority 16 precedes priority 18)"

