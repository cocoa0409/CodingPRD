            - "PickupRoute.${route_id}.booked_units == 0 and available_units == 6 and version == ${route_v_draft} after trigger call 1"
            - "ReturnCase.${rc_id}.logistics_status == REQUESTED after trigger call 1"
            - "PickupRoute.${route_id}.status == PUBLISHED after trigger call 2"
            - "trigger call 3 (identical payload except the bumped version) -> 201"
