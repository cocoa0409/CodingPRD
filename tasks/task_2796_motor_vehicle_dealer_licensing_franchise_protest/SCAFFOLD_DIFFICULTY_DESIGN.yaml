  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_room_buffered_overlap_rejects_adjacent_session
        grounds:
          - calculations.hearing_room_slot_ledger
          - validations.priority_60_ERR_HEARING_ROOM_CONFLICT
          - entities.HearingRoom.fields.buffer_minutes
          - entities.HearingRoom.fields.booked_hearing_count
        distinguishing_aspect: |
          Resource: HearingRoom. Interval semantics: half-open [start, end) intervals padded by a
          60-minute changeover buffer on both sides with strict inequality, so a 30-minute gap
          collides while a gap of exactly 60 minutes is permitted. Overlap is forbidden and
          adjacency-plus-buffer is required.
        test_recipe:
          setup:
            - "Room HR-1 with default buffer_minutes 60 and max_hearings_per_day 2."
            - "Licensed, franchised incumbent Lakeside Aurora at site (0, 0)."
            - "Two ADDITIONAL_POINT filings noticed 2026-09-10: F1 at (9, 12) (15.00 km away) and F2 at (14.4, 19.2) (24.00 km away, exactly on the relevant-market radius)."
            - "The incumbent protests both filings on 2026-09-15; the statutory hearing window is [2026-10-15, 2027-03-14]."
            - "Protest 1 is docketed 2026-11-02T10:00:00Z to 13:00:00Z."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
