              captures: { com2: $.data.committed_kg, done2: $.data.completed_kg, rem2: $.data.remaining_kg }
          assert:
            - "snapshot: ${id} == 12.5 (certified weight at assignment creation)"
            - "after accept (${id} == ACCEPTED): committed ${id} == 12.5, completed ${id} == 0, remaining ${id} == 987.5; 12.5+0+987.5 == 1000"
            - "after complete (${id} == COMPLETED): committed ${id} == 0, completed ${id} == 12.5, remaining ${id} == 987.5; 0+12.5+987.5 == 1000"
            - "remaining_kg identical before and after the pair — partition invariant conserved, no capacity drift"
