# =====================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2667 — Fair Trade Certification & Producer Premium Administration
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Deleting this file
# leaves the declared behaviour identical.
# Logical clock default: 2026-08-01T00:00:00Z (SCAFFOLD.yaml §1.5 clock endpoint).
# =====================================================================
scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: premium_basis_physical_versus_mass_balance_diverges_on_identical_shipment
        grounds:
          - calculations.community_development_premium
          - entities.SupplyChainNode.fields.traceability_mode
          - entities.TradeTransaction.fields.premium_basis
          - entities.TradeTransaction.fields.premium_cents
        distinguishing_aspect: |
          The variant is selected structurally by the SELLER node's traceability_mode, and two
          shipments identical in product, organic flag, grade and volume produce premium_cents
          1200000 (PHYSICAL_TRACEABILITY, one final rounding) versus 1167000 (MASS_BALANCE,
          per-lot attribution at 0.9725) — a 33000 cent divergence on the TradeTransaction domain.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED, owning one PHYSICAL COOPERATIVE node and one MASS_BALANCE COOPERATIVE node, each with certified_input_kg 50000 and available_credit_kg 50000"
            - "BRAND holder CERTIFIED, owning one PHYSICAL BRAND_NODE whose upstream is the PHYSICAL cooperative and one MASS_BALANCE BRAND_NODE whose upstream is the MASS_BALANCE cooperative"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { phys_sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "MASS_BALANCE" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { mb_sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${phys_sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { phys_buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "MASS_BALANCE", upstream_node_id: "${mb_sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { mb_buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${phys_sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "POST /fairtrade/supply-chain-nodes/${mb_sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "GET /fairtrade/supply-chain-nodes/${phys_sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { phys_node_v: $.data.version }
            - call: "GET /fairtrade/supply-chain-nodes/${mb_sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { mb_node_v: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${phys_sell_node_id}", buyer_node_id: "${phys_buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "SPECIALTY", is_organic: true, volume_kg: 12000, declared_unit_price_cents_per_kg: 300, contract_date: "2026-08-01", expected_seller_node_version: "${phys_node_v}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t_phys_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${mb_sell_node_id}", buyer_node_id: "${mb_buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "SPECIALTY", is_organic: true, volume_kg: 12000, declared_unit_price_cents_per_kg: 300, contract_date: "2026-08-01", expected_seller_node_version: "${mb_node_v}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t_mb_id: $.data.id }
          assert:
            - "TradeTransaction.${t_phys_id}.premium_basis == PHYSICAL_TRACEABILITY"
            - "TradeTransaction.${t_phys_id}.premium_cents == 1200000"
            - "TradeTransaction.${t_mb_id}.premium_basis == MASS_BALANCE"
            - "TradeTransaction.${t_mb_id}.premium_cents == 1167000"
            - "TradeTransaction.${t_phys_id}.premium_cents - TradeTransaction.${t_mb_id}.premium_cents == 33000"
            - "TradeTransaction.${t_phys_id}.premium_volume_kg == 12000.000 AND TradeTransaction.${t_mb_id}.premium_volume_kg == 12000.000"
            - "TradeTransaction.${t_phys_id}.applied_floor_cents_per_kg == 440 AND TradeTransaction.${t_mb_id}.applied_floor_cents_per_kg == 440"
            - "TradeTransaction.${t_phys_id}.gross_value_cents == 5280000 AND TradeTransaction.${t_mb_id}.gross_value_cents == 5280000"

      - name: volume_report_seller_basis_matches_while_buyer_basis_flags_variance
        grounds:
          - calculations.volume_reconciliation_variance
          - entities.VolumeReport.fields.basis
          - entities.VolumeReport.fields.reconciliation_status
          - state_machines.CertificateHolder.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: |
          The variant is selected by the reconcile request body on the VolumeReport domain — a
          different entity domain from the TradeTransaction premium variant — and the same
          underlying volume structure yields variance_pct 2.00 / MATCHED under SELLER_BASIS but
          -5.85 / VARIANCE_FLAGGED under BUYER_BASIS, which additionally suspends the holder.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED with one PHYSICAL cooperative node holding certified_input_kg 50000"
            - "BRAND holder CERTIFIED with one PHYSICAL BRAND_NODE whose upstream is that cooperative"
            - "August window: one 12000 kg trade VERIFIED and SETTLED, one 1000 kg trade DISPUTED"
            - "September window: one 12000 kg trade VERIFIED and SETTLED, one 1000 kg trade DISPUTED"
            - "two submitted VolumeReports for the same holder pair over the non-overlapping half-open windows [2026-08-01, 2026-09-01) and [2026-09-01, 2026-10-01), each declaring 12240 kg"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v1: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 12000, declared_unit_price_cents_per_kg: 400, contract_date: "2026-08-05", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/trade-transactions/${t1_id}/settle"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v2: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 1000, declared_unit_price_cents_per_kg: 400, contract_date: "2026-08-06", expected_seller_node_version: "${node_v2}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t2_id}/verify"
              payload: { outcome: "DISPUTED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v3: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 12000, declared_unit_price_cents_per_kg: 400, contract_date: "2026-09-05", expected_seller_node_version: "${node_v3}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t3_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t3_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/trade-transactions/${t3_id}/settle"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v4: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 1000, declared_unit_price_cents_per_kg: 400, contract_date: "2026-09-06", expected_seller_node_version: "${node_v4}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t4_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t4_id}/verify"
              payload: { outcome: "DISPUTED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/volume-reports"
              payload: { holder_id: "${prod_id}", counterparty_holder_id: "${brand_id}", period_start: "2026-08-01", period_end: "2026-09-01", declared_volume_kg: 12240 }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { r_aug_id: $.data.id }
            - call: "POST /fairtrade/volume-reports"
              payload: { holder_id: "${prod_id}", counterparty_holder_id: "${brand_id}", period_start: "2026-09-01", period_end: "2026-10-01", declared_volume_kg: 12240 }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { r_sep_id: $.data.id }
          trigger:
            - call: "POST /fairtrade/volume-reports/${r_aug_id}/reconcile"
              payload: { basis: "SELLER_BASIS" }
              as: CertificationOfficer
            - call: "POST /fairtrade/volume-reports/${r_sep_id}/reconcile"
              payload: { basis: "BUYER_BASIS" }
              as: CertificationOfficer
          assert:
            - "VolumeReport.${r_aug_id}.counterparty_volume_kg == 12000.000"
            - "VolumeReport.${r_aug_id}.variance_pct == 2.00"
            - "VolumeReport.${r_aug_id}.reconciliation_status == MATCHED"
            - "VolumeReport.${r_sep_id}.counterparty_volume_kg == 13000.000"
            - "VolumeReport.${r_sep_id}.variance_pct == -5.85"
            - "VolumeReport.${r_sep_id}.reconciliation_status == VARIANCE_FLAGGED"
            - "CertificateHolder.${prod_id}.certificate_status == SUSPENDED"
            - "CertificateHolder.${prod_id}.suspension_reason == VOLUME_VARIANCE"
            - "SupplyChainNode.${sell_node_id}.status == SUSPENDED"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: floor_price_combines_product_organic_and_grade_differentials_mode_a
        grounds:
          - calculations.minimum_price_floor
          - entities.TradeTransaction.fields.applied_floor_cents_per_kg
          - entities.TradeTransaction.fields.floor_topup_cents
          - entities.TradeTransaction.fields.settled_unit_price_cents_per_kg
        distinguishing_aspect: |
          Mode (a): applied_floor_cents_per_kg combines three inputs (product table, conditional
          organic differential, grade table) and then interacts non-linearly through
          max(declared, floor) — 320+80+40=440 lifts a declared 300 to 440 with topup 1120000,
          while a declared 500 on a 320 floor keeps 500 and produces topup 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED with one PHYSICAL cooperative node holding certified_input_kg 50000"
            - "BRAND holder CERTIFIED with one PHYSICAL BRAND_NODE whose upstream is that cooperative"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v1: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "SPECIALTY", is_organic: true, volume_kg: 8000, declared_unit_price_cents_per_kg: 300, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t_low_id: $.data.id }
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v3: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 1000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v3}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t_high_id: $.data.id }
          assert:
            - "TradeTransaction.${t_low_id}.applied_floor_cents_per_kg == 440"
            - "TradeTransaction.${t_low_id}.settled_unit_price_cents_per_kg == 440"
            - "TradeTransaction.${t_low_id}.floor_topup_cents == 1120000"
            - "TradeTransaction.${t_low_id}.gross_value_cents == 3520000"
            - "TradeTransaction.${t_low_id}.premium_cents == 800000"
            - "TradeTransaction.${t_high_id}.applied_floor_cents_per_kg == 320"
            - "TradeTransaction.${t_high_id}.settled_unit_price_cents_per_kg == 500"
            - "TradeTransaction.${t_high_id}.floor_topup_cents == 0"
            - "TradeTransaction.${t_high_id}.gross_value_cents == 500000"
            - "TradeTransaction.${t_high_id}.premium_cents == 80000"

      - name: mass_balance_premium_rounds_per_lot_before_summing_mode_b
        grounds:
          - calculations.community_development_premium
          - entities.TradeTransaction.fields.premium_cents
          - entities.SupplyChainNode.fields.available_credit_kg
        distinguishing_aspect: |
          Mode (b): the pinned rounding order decides the cents — rounding each 1000 kg lot
          (75 * 1000 * 0.9725 = 72937.5 -> 72938) before summing three lots and adding the
          separately rounded 500 kg remainder (36469) gives premium_cents 255283, whereas
          summing exactly and rounding once (255281.25 -> 255281) gives 255281.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG cocoa holder CERTIFIED with one MASS_BALANCE cooperative node holding certified_input_kg 5000"
            - "BRAND cocoa holder CERTIFIED with one MASS_BALANCE BRAND_NODE whose upstream is that cooperative"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Cocoa Union", holder_type: "PRODUCER_ORG", country_code: "GH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Alpine Chocolate", holder_type: "BRAND", country_code: "CH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "MASS_BALANCE" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "MASS_BALANCE", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 5000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COCOA", quality_grade: "STANDARD", is_organic: true, volume_kg: 3500, declared_unit_price_cents_per_kg: 400, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t_mb_id: $.data.id }
          assert:
            - "TradeTransaction.${t_mb_id}.premium_basis == MASS_BALANCE"
            - "TradeTransaction.${t_mb_id}.premium_cents == 255283"
            - "TradeTransaction.${t_mb_id}.premium_cents != 255281"
            - "TradeTransaction.${t_mb_id}.applied_floor_cents_per_kg == 340"
            - "TradeTransaction.${t_mb_id}.settled_unit_price_cents_per_kg == 400"
            - "TradeTransaction.${t_mb_id}.floor_topup_cents == 0"
            - "TradeTransaction.${t_mb_id}.gross_value_cents == 1400000"
            - "SupplyChainNode.${sell_node_id}.reserved_output_kg == 3500.000"
            - "SupplyChainNode.${sell_node_id}.available_credit_kg == 1500.000"

      - name: nonconformity_deadline_derived_from_pre_insert_compliance_score_mode_c
        grounds:
          - calculations.holder_compliance_score_and_deadline
          - entities.Nonconformity.fields.compliance_score_at_raise
          - entities.Nonconformity.fields.deadline_at
          - entities.Nonconformity.fields.escalation_grace_days
          - entities.CertificateHolder.fields.compliance_score
        distinguishing_aspect: |
          Mode (c): the score feeds the deadline while the finding feeds the score, so the pinned
          evaluation order (score BEFORE insert, aggregates AFTER insert) is the only well-defined
          reading — two CRITICAL findings raised at the same clock instant get different deadlines,
