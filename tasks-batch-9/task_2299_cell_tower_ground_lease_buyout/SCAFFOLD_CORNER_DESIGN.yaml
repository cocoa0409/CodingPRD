        claim_type: exclusive_operations
        grounds:
          - rbac.roles[ServicingAgent].exclusive_operations
          - rbac.roles[PlatformAdmin].exclusive_operations
          - errors[ERR_ACTION_ROLE_MISMATCH]
          - validations[priority=8]
          - endpoints[POST /lease-buyouts/disputes/{id}/transitions]
        distinguishing_aspect: |
          This is the case that separates priority 2 from priority 8. ServicingAgent *is* in the
          allowed-roles list for the dispute transitions endpoint (it owns START_CURE), so the role
          gate passes; what it may not do is send the adjudication verb UPHOLD, which is reserved to
          PlatformAdmin. The correct code is therefore 403 ERR_ACTION_ROLE_MISMATCH, not
          ERR_UNAUTHORIZED - and the same verb from PlatformAdmin on the same dispute must then
          succeed, which rules out an implementation that simply forbids UPHOLD everywhere.
        test_recipe:
          setup:
            - "an OPEN access dispute raised by the landowner on an acquired-side lease stream"
          setup_api_calls:
