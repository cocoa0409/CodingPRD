    side_effects: ["status -> FILED"]
  - method: POST
    path: "/mv/disputes/{disputeId}/resolve"
    description: "Resolve (UNDER_REVIEW -> RESOLVED_UPHELD|RESOLVED_DENIED); UPHELD cascades eligibility restoration"
    roles: [StateCoordinator]
    code: 200
    input: [outcome]
    output: Dispute
    side_effects: ["status/outcome set", "if UPHELD: Student.eligibility_status -> ELIGIBLE and BenefitLink created"]

  # ---- TutoringReferral ----
  - method: POST
    path: "/mv/tutoring-referrals"
    description: "Create a tutoring referral (OPEN)"
    roles: [Liaison, StateCoordinator]
    code: 201
    input: [student_id, subject]
    output: TutoringReferral
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/mv/tutoring-referrals/{referralId}"
    description: "Get a referral"
    roles: [StateCoordinator, TransportCoordinator, Liaison, Registrar]
    code: 200
    input: []
    output: TutoringReferral
    side_effects: []
  - method: GET
    path: "/mv/tutoring-referrals"
    description: "List referrals (reverse-reachability for student_id)"
    roles: [StateCoordinator, TransportCoordinator, Liaison, Registrar]
    code: 200
    input: ["student_id?", "limit?", "offset?"]
    output: TutoringReferral[]
    side_effects: []
  - method: POST
    path: "/mv/tutoring-referrals/{referralId}/close"
    description: "Close a referral (OPEN -> CLOSED)"
    roles: [Liaison, StateCoordinator]
    code: 200
    input: []
    output: TutoringReferral
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/mv/tutoring-referrals/{referralId}/cancel"
    description: "Cancel a referral (OPEN -> CANCELED)"
    roles: [Liaison, StateCoordinator]
    code: 200
    input: []
    output: TutoringReferral
    side_effects: ["status -> CANCELED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive quantity, or scheduled_end <= scheduled_start" }
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "District id does not resolve" }
  - { id: ERR_LIAISON_NOT_FOUND, http: 404, condition: "Liaison id does not resolve" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not resolve" }
  - { id: ERR_DETERMINATION_NOT_FOUND, http: 404, condition: "EligibilityDetermination id does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "TransportationPlan id does not resolve" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id does not resolve" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "TripAssignment id does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "CostShareAgreement id does not resolve" }
  - { id: ERR_BENEFIT_LINK_NOT_FOUND, http: 404, condition: "BenefitLink id does not resolve" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not resolve" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "TutoringReferral id does not resolve" }
  - { id: ERR_LEDGER_ENTRY_NOT_FOUND, http: 404, condition: "CostLedgerEntry id does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STUDENT_WITHDRAWN, http: 409, condition: "Operation not allowed on a WITHDRAWN student" }
  - { id: ERR_STUDENT_NOT_ELIGIBLE, http: 409, condition: "Plan approve requires Student.eligibility_status == ELIGIBLE" }
  - { id: ERR_VEHICLE_NOT_IN_SERVICE, http: 409, condition: "Trip create requires the vehicle to be IN_SERVICE" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Trip create requires the plan to be ACTIVE" }
  - { id: ERR_NO_COST_SHARE, http: 409, condition: "Plan activation requires an existing CostShareAgreement" }
  - { id: ERR_LIAISON_CASELOAD_FULL, http: 409, condition: "Liaison assignment would exceed max_caseload" }
  - { id: ERR_VEHICLE_TIME_CONFLICT, http: 409, condition: "Trip overlaps another trip on the same vehicle within VEHICLE_BUFFER_MINUTES" }
  - { id: ERR_DISTRICT_CAPACITY, http: 409, condition: "Trip would exceed DISTRICT_CONCURRENT_TRIP_CAP overlapping trips for the serving district" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "Plan activation would push serving district committed cost over its transport budget" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateCoordinator
    description: "State-level McKinney-Vento coordinator; oversight, reporting, dispute adjudication, and administrative setup. Hierarchical superset for most operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /mv/districts"
      - "POST /mv/liaisons"
      - "POST /mv/disputes/{disputeId}/begin-review"
      - "POST /mv/disputes/{disputeId}/request-info"
      - "POST /mv/disputes/{disputeId}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"
      - "Student intake/enroll/withdraw/assign-liaison (with Registrar/Liaison)"
      - "Eligibility determinations and finalize (with Liaison)"
      - "Plan/vehicle/trip/cost-share operations (with TransportCoordinator)"
      - "Dispute filing, resubmit, tutoring referrals, benefit revoke (with Liaison)"

  - name: Liaison
    description: "District McKinney-Vento liaison; manages caseload, eligibility determinations, service, disputes, tutoring referrals, and benefit revocation."
    identity: "entity_backed:Liaison"
    exclusive_operations: []
    shared_operations:
      - "POST /mv/students/{studentId}/assign-liaison"
      - "POST /mv/students/{studentId}/eligibility-determinations"
      - "POST /mv/eligibility-determinations/{determinationId}/finalize"
      - "POST /mv/disputes  (file)"
      - "POST /mv/disputes/{disputeId}/resubmit"
      - "POST /mv/tutoring-referrals and /close and /cancel"
      - "POST /mv/benefit-links/{benefitLinkId}/revoke"
      - "All GET reads"

  - name: TransportCoordinator
    description: "District transportation office; owns plans, vehicles, trips, and cost-share agreements. X-User-ID is a District id."
    identity: "entity_backed:District"
    exclusive_operations: []
    shared_operations:
      - "POST /mv/transportation-plans and all plan transitions"
      - "POST /mv/vehicles and /set-status"
      - "POST /mv/trip-assignments and /complete /cancel /void"
      - "POST /mv/cost-share-agreements"
      - "All GET reads"

  - name: Registrar
    description: "District enrollment office; handles student intake, immediate enrollment, records, and withdrawal. X-User-ID is a District id."
    identity: "entity_backed:District"
    exclusive_operations: []
    shared_operations:
      - "POST /mv/students  (intake)"
      - "POST /mv/students/{studentId}/enroll"
      - "POST /mv/students/{studentId}/withdraw"
      - "All GET reads"
