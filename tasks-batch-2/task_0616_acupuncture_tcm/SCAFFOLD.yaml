  - method: GET
    path: "/intakes"
    description: "List intakes; filter by patient_id (reverse-reachability for Intake.patient_id)"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "Intake[]"
    side_effects: []

  - method: GET
    path: "/intakes/{id}"
    description: "Get an intake"
