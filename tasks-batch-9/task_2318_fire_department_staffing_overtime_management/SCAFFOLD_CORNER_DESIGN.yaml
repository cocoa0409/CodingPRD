              as: StaffingOfficer
              captures: { ff101c: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st101}", full_name: "Q Quinn", rank: "FIREFIGHTER", platoon: "D", seniority_rank: 5, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff101d: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st101}", roster_type: "CALLBACK", certification_scope: "NONE" }
              as: StaffingOfficer
              captures: { r101cb: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st101}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
              captures: { r101vo: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st101}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh101: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh101}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh101}", status: "OPEN" }
