              as: AR_MANAGER
              as_user_id: "manager-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SOD_VIOLATION"

      - name: auditor_readonly_cannot_create_customer
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "AUDITOR (read-only) calling POST /ar/customers returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ar/customers"
              payload: { name: "AudCo", credit_limit_cents: 1000 }
              as: AUDITOR
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_customer_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Customer.fields.version, endpoints]
        distinguishing_aspect: "Customer.version increments by exactly 1 on each direct customer mutation (hold then release-hold: 1 -> 2 -> 3)."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "VC", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id, v1: $.data.version }
            - call: "POST /ar/customers/${c_id}/hold"
              payload: {}
              as: AR_MANAGER
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /ar/customers/${c_id}/release-hold"
              payload: {}
              as: AR_MANAGER
              captures: { v3: $.data.version }
          assert:
            - "captured versions: v1 == 1, v2 == 2, v3 == 3"

      - name: stale_version_on_promise_create_already_covered
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[promise-create-stale-customer]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / promise_coverage_window_half_open_overlap_rejected
          rationale: >-
            The OCC stale-version trigger on POST /ar/promises is exercised directly
            by the §1.9 errors instance error_stale_version_on_promise_create; this
            stub records that the layer claim is covered without duplicating it.

      - name: cascade_writeoff_three_field_chain_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Invoice.OPEN_to_WRITTEN_OFF]
        excluded_because:
          difficulty_instance: transitive_cascade / writeoff_approval_cascades_invoice_writtenoff_then_baddebt_then_stage
          rationale: "The write-off cascade chain (invoice -> bad_debt_total -> collection_stage) is the named §1.8 transitive_cascade instance."

      - name: dual_variant_forecast_already_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.cash_forecast]
        excluded_because:
          difficulty_instance: dual_variant_calc / cash_forecast_expected_vs_conservative_diverge
          rationale: "Both forecast variants and their divergence are asserted by the named §1.8 dual_variant_calc instance."

      - name: rate_threshold_credit_hold_boundary_already_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.credit_status_eval]
        excluded_because:
          difficulty_instance: boundary_precision_check / credit_status_exposure_equals_limit_triggers_hold
          rationale: "The exposure>=limit HOLD breakpoint is the named §1.8 boundary_precision_check instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_cascade_visible_in_same_response
        claim_type: immediate
        grounds: [entities.Customer.fields.exposure_cents, state_machines.Invoice.OPEN_to_PARTIAL]
        distinguishing_aspect: "After applying a payment, the GET on the customer in the same test shows the recomputed exposure immediately (no lag): exposure drops from 30000 to 18000 after a 12000 application."
        test_recipe:
          setup: ["customer with one OPEN invoice 30000"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "IM", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 30000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 12000, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_id}", applied_cents: 12000 }
              as: AR_CLERK
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { exp: $.data.exposure_cents }
          assert:
            - "Customer.${c_id}.exposure_cents == 18000"
