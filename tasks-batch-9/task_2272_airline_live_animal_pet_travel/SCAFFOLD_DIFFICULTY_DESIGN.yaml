  - rule_id: boundary_precision_check
    instances:
      - name: embargo_fires_at_forecast_exactly_equal_to_high_limit
        grounds:
          - calculations.embargo_determination
          - entities.TemperatureEmbargoRule.fields.forecast_high_limit_c
          - entities.FlightLeg.fields.posture
        distinguishing_aspect: |
          Boundary on a DECIMAL TEMPERATURE comparison with >=: 29.4 leaves the leg OPEN with a null
          governing rule and 29.5 - exactly the limit - flips it to EMBARGOED. The tested metric is a
          one-tenth-of-a-degree forecast value, not a count, a duration or an empty set.
        test_recipe:
          setup:
            - "Stations HKG (HK) and LAX (US); a TemperatureEmbargoRule on HKG with direction ORIGIN, season 06-01 to 09-30, forecast_high_limit_c 29.5, forecast_low_limit_c -5.0, applies_to_routings [CHECKED, CARGO]"
            - "AN101 HKG->LAX departing 2026-09-10T02:00Z, which is inside the season window, created with forecast 25/15 so posture is OPEN and governing_embargo_rule_id is null"
            - "The forecast is first moved to 29.4/10.0, one tenth of a degree below the limit, and the leg stays OPEN with governing_embargo_rule_id still null"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /temperature-embargo-rules", payload: { station_id: "${st_hkg}", direction: "ORIGIN", season_start_month_day: "06-01", season_end_month_day: "09-30", forecast_high_limit_c: 29.5, forecast_low_limit_c: -5.0, applies_to_routings: ["CHECKED", "CARGO"] }, as: ProgramAdmin, as_user_id: "admin-01", captures: { emb1: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "PUT /flight-legs/${leg1}/forecast", payload: { forecast_high_c: 29.4, forecast_low_c: 10.0 }, as: ProgramAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "PUT /flight-legs/${leg1}/forecast", payload: { forecast_high_c: 29.5, forecast_low_c: 10.0 }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "FlightLeg.${leg1}.governing_embargo_rule_id == ${emb1}"
            - "FlightLeg.${leg1}.posture == EMBARGOED"
            - "FlightLeg.${leg1}.forecast_high_c == 29.5"
            - "the setup response for forecast 29.4 had posture OPEN and governing_embargo_rule_id null"

      - name: empty_mandatory_requirement_set_verifies_compliance_vacuously
        grounds:
          - state_machines.Reservation.IN_REVIEW_to_VERIFIED
          - validations.priority_33
          - entities.DestinationRequirement.fields.destination_country_code
        distinguishing_aspect: |
          Boundary on an EMPTY SET rather than a numeric edge: the itinerary ends in SG and no ACTIVE mandatory
          DestinationRequirement matches SG, so the universally quantified document check is vacuously true and
          compliance_status becomes VERIFIED even though the only submitted document is still UNDER_REVIEW.
        test_recipe:
          setup:
            - "A mandatory DestinationRequirement exists for DOG into US, so the requirement table is not globally empty"
            - "AN301 HKG->SIN with SIN in country SG; a CHECKED reservation whose single animal holds one RESERVED segment into SIN"
            - "One IMPORT_PERMIT document is submitted and moved UNDER_REVIEW, which pulls compliance_status from UNVERIFIED to IN_REVIEW; it is never verified"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "SIN", country_code: "SG", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_sin: $.data.id } }
            - { call: "POST /destination-requirements", payload: { species_profile_id: "${sp_dog}", destination_country_code: "US", document_type: "HEALTH_CERTIFICATE", max_age_days_at_arrival: 60, mandatory: true }, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "POST /flight-legs", payload: { flight_number: "AN301", origin_station_id: "${st_hkg}", destination_station_id: "${st_sin}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T06:00:00Z", forecast_high_c: 27, forecast_low_c: 24, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Tan", contact_email: "tan@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "POST /health-documents", payload: { animal_record_id: "${an1}", document_type: "IMPORT_PERMIT", issuing_country_code: "HK", issued_at: "2026-07-20T00:00:00Z", expires_at: "2026-10-01T00:00:00Z" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { doc1: $.data.id } }
            - { call: "POST /health-documents/${doc1}/start-review", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
          trigger:
            - { call: "POST /reservations/${res1}/verify-compliance", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
          assert:
            - "Reservation.${res1}.compliance_status == VERIFIED"
            - "Reservation.${res1}.booking_status == PENDING"
            - "HealthDocument.${doc1}.status == UNDER_REVIEW"
            - "no HealthDocument of AnimalRecord.${an1} is in status VERIFIED"

      - name: cargo_connection_exactly_at_routing_minimum_accepted
        grounds:
          - calculations.connection_welfare_window
          - validations.priority_47
          - entities.SegmentAssignment.fields.required_welfare_check_count
