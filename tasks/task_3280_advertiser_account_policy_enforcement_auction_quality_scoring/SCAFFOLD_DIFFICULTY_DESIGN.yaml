            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Fisc Corp LLC", registration_number: "RN-16", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CF", daily_budget_cents: 100000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "GW" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { gw: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "GR" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { gr: $.data.id }
            - call: "POST /ad-groups/${gw}/ads"
              payload: { headline: "Gizmo W", final_url: "https://f.example/w", category: "GENERAL", quality_ectr_score: 10, quality_relevance_score: 10, quality_lp_score: 10 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_w: $.data.id }
            - call: "POST /ad-groups/${gr}/ads"
              payload: { headline: "Gizmo R", final_url: "https://f.example/r", category: "GENERAL", quality_ectr_score: 10, quality_relevance_score: 10, quality_lp_score: 10 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_r: $.data.id }
            - call: "POST /ad-groups/${gw}/keywords"
              payload: { text: "gizmo", match_type: "EXACT", max_cpc_cents: 5000 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ad-groups/${gr}/keywords"
              payload: { text: "gizmo", match_type: "EXACT", max_cpc_cents: 499 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_w}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_r}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /auctions"
              payload: { query_text: "gizmo", clicked: true }
              as: PlatformAdmin
              captures: { ev: $.data.id, chg: $.data.charged_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /billing-profiles/${bp}/close-month"
              payload: { month: "2026-09" }
              as: BillingAdmin
              captures: { inv: $.data.invoice_id }
            - call: "GET /billing-profiles/${bp}"
              payload: {}
              as: BillingAdmin
              captures: { unb1: $.data.unbilled_cost_cents, pend1: $.data.pending_credit_cents }
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { served1: $.data.lifetime_valid_served_cents, billed1: $.data.lifetime_billed_cents, over1: $.data.lifetime_overdelivery_credit_cents }
          trigger:
            - call: "POST /auction-events/${ev}/flag-invalid"
              payload: {}
              as: BillingAdmin
            - call: "GET /billing-profiles/${bp}/invoices"
              payload: {}
              as: BillingAdmin
              captures: { inv_amt: "$.data[0].amount_cents", inv_icc: "$.data[0].invalid_click_credit_cents" }
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { served2: $.data.lifetime_valid_served_cents, billed2: $.data.lifetime_billed_cents, icc2: $.data.lifetime_invalid_click_credit_cents }
          assert:
            - "chg == 500 (floor(499*1000/1000)+1)"
            - "before flag: served1 == 500, billed1 == 500, unb1 == 0, pend1 == 0, over1 == 0 -> 500 + 0 - 0 == 500 - 0"
            - "after flag: inv_amt == 0 and inv_icc == 500 (credit applied to the unpaid invoice, never below paid_cents 0)"
            - "after flag: served2 == 0, billed2 == 0, icc2 == 500 -> 0 + 0 - 0 == 0 - 0 (invariant holds through the compensation)"

      - name: campaign_daily_spend_reconciliation_after_click_and_flag
        grounds:
          - calculations.invalid_click_credit
          - entities.Campaign.fields.served_lifetime_cents
          - entities.Campaign.fields.click_count_lifetime
          - entities.DailySpendRecord.fields.served_cents
        distinguishing_aspect: |
          Different conserved quantity (campaign ledger integrity, not account
          fiscal balance): served_lifetime_cents == sum of DailySpendRecord
          served_cents and click_count_lifetime == sum of click_count must hold
          after the forward action (two clicks) AND after the compensating
