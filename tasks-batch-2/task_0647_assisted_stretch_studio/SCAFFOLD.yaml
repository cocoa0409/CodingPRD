    path: "/services/{id}/retire"
    description: "Retire a service (cannot be booked)."
    roles: [StudioManager]
    code: 200
    input: []
    output: Service
    side_effects: ["status ACTIVE -> RETIRED"]

  # ---- Member ----------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Register a member."
    roles: [StudioManager, FrontDesk]
    code: 201
    input: [home_location_id, full_name, email]
    output: Member
    side_effects: ["status=ACTIVE, intro_completed=false, mobility_tier=null, strike_score=0"]
  - method: GET
    path: "/members"
    description: "List/filter members (filtered-list reverse-reachability for Member.home_location_id)."
    roles: [StudioManager, FrontDesk]
    code: 200
    input: ["home_location_id?", "status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/members/{id}"
    description: "Get a member (computed strike_score, intro_completed, mobility_tier, status)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{id}/reinstate"
    description: "Manually reinstate a SUSPENDED member (StudioManager override after strike score reviewed)."
    roles: [StudioManager]
    code: 200
    input: []
    output: Member
    side_effects: ["status SUSPENDED -> ACTIVE (does not erase NoShowEvents; strike_score recomputed on next event/sweep)"]

  # ---- Membership (FK member_id / location_id reverse-reachability) ----------
  - method: POST
    path: "/memberships"
    description: "Purchase a membership (requires member.intro_completed)."
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [member_id, location_id, tier, monthly_fee_cents, included_credits, "rollover_cap?"]
    output: Membership
    side_effects: ["status=ACTIVE; granted_credits=included_credits; held/consumed=0; cycle_anchor_utc=clock; version=1"]
  - method: GET
    path: "/memberships"
    description: "List/filter memberships (filtered-list reverse-reachability for Membership.member_id and Membership.location_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["member_id?", "location_id?", "status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: GET
    path: "/memberships/{id}"
    description: "Get a membership (computed wallet fields + version)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/memberships/{id}/freeze"
    description: "Freeze a membership for a date span; cascades to cancel covered bookings."
    roles: [StudioManager, Member]
    code: 200
    input: [freeze_start_utc, freeze_end_utc, expected_membership_version]
    output: Membership
    side_effects:
      - "status ACTIVE -> FROZEN"
      - "increments Membership.version by 1"
      - "freeze_credit_cents += membership_freeze_proration (CALENDAR_30)"
      - "cascade: covered CONFIRMED/REQUESTED bookings -> CANCELLED, credit RELEASED, addons voided, wallet recomputed"
  - method: POST
    path: "/memberships/{id}/unfreeze"
    description: "Unfreeze a frozen membership."
    roles: [StudioManager, Member]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects: ["status FROZEN -> ACTIVE", "increments Membership.version by 1"]
  - method: POST
    path: "/memberships/{id}/cancel"
    description: "Cancel a membership."
    roles: [StudioManager, Member]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects: ["status -> CANCELLED", "increments Membership.version by 1", "cascade: HELD bookings -> CANCELLED + credit RELEASED + addons voided"]
  - method: POST
    path: "/memberships/{id}/renew"
    description: "Advance the membership to its next cycle (grants included_credits + capped rollover)."
    roles: [StudioManager]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "carried = min(available_credits, rollover_cap); granted_credits = included_credits + carried"
      - "consumed_credits reset to 0; held_credits unchanged (open holds persist)"
      - "cycle_anchor_utc advanced by 30 days; freeze_credit_cents reset to 0; increments Membership.version by 1"

  # ---- CreditPack (FK member_id / location_id reverse-reachability) ----------
  - method: POST
    path: "/credit-packs"
    description: "Purchase a credit pack (price computed via tiered discount)."
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [member_id, location_id, pack_credits, base_unit_price_cents, expires_utc]
    output: CreditPack
    side_effects: ["status=ACTIVE; price_cents = credit_pack_price; held/consumed=0; available_credits=pack_credits"]
  - method: GET
    path: "/credit-packs"
    description: "List/filter credit packs (filtered-list reverse-reachability for CreditPack.member_id and CreditPack.location_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["member_id?", "location_id?", "status?", "limit?", "offset?"]
    output: CreditPack[]
    side_effects: []
  - method: GET
    path: "/credit-packs/{id}"
    description: "Get a credit pack (computed wallet fields)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: CreditPack
    side_effects: []

  # ---- Booking ---------------------------------------------------------------
  - method: POST
    path: "/bookings"
    description: "Create a booking (HELD/REQUESTED); runs all overlap, intro-gating, and credit checks."
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [member_id, location_id, service_id, flexologist_id, table_id, session_start_utc, funding_source, funding_id]
    output: Booking
    side_effects:
      - "schedule_status=REQUESTED, credit_status=HELD"
      - "session_end_utc = session_start_utc + Service.duration_minutes; credit_cost/list_price_cents snapshotted; is_intro set"
      - "holds Service.credit_cost from funding wallet (calc credit_wallet_balance)"
  - method: GET
    path: "/bookings"
    description: "List/filter bookings (filtered-list reverse-reachability for member_id, location_id, service_id, flexologist_id, table_id, series_id, rescheduled_from_booking_id)."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: ["member_id?", "location_id?", "service_id?", "flexologist_id?", "table_id?", "series_id?", "rescheduled_from_booking_id?", "funding_id?", "schedule_status?", "credit_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking (both status dimensions, fee_charged_cents)."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Confirm a requested booking."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: Booking
    side_effects: ["schedule_status REQUESTED -> CONFIRMED"]
  - method: POST
    path: "/bookings/{id}/complete"
    description: "Mark a confirmed booking complete (consumes credit; INTRO completion posts assessment scores)."
    roles: [StudioManager, Flexologist]
    code: 200
    input: ["assessment_shoulder?", "assessment_hip?", "assessment_spine?", "assessment_ankle?"]
    output: Booking
    side_effects:
      - "schedule_status CONFIRMED -> COMPLETED; credit_status HELD -> CONSUMED (wallet recompute)"
      - "if INTRO: Member.intro_completed=true, mobility_tier from intro_assessment_score"
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking; resolves to free CANCELLED or LATE_CANCELLED by clock vs cancel window."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "outside window: schedule_status -> CANCELLED, credit RELEASED, fee 0"
      - "inside window: schedule_status -> LATE_CANCELLED, credit FORFEITED, fee_charged_cents=no_show_fee(LATE_CANCEL), NoShowEvent(points=1), strike recompute, possible Member SUSPENDED"
      - "addons voided"
  - method: POST
    path: "/bookings/{id}/reschedule"
    description: "Reschedule a non-terminal booking: cancel-and-recreate to a new slot/resource, linking the replacement to its predecessor."
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [session_start_utc, "flexologist_id?", "table_id?"]
    output: Booking
    side_effects:
      - "predecessor schedule_status -> CANCELLED (free), credit RELEASED, addons voided"
      - "new Booking created (REQUESTED/HELD) with rescheduled_from_booking_id = predecessor.id; re-runs overlap + credit checks; re-holds credit"
  - method: POST
    path: "/bookings/{id}/add-ons"
    description: "Attach a compression/percussion add-on to a booking."
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [kind, price_cents]
    output: AddOn
    side_effects: ["AddOn created (voided=false) when booking schedule_status IN {REQUESTED, CONFIRMED}"]
  - method: GET
    path: "/bookings/{id}/add-ons"
    description: "List add-ons on a booking (sub-resource reverse-reachability for AddOn.booking_id)."
    roles: [StudioManager, FrontDesk, Member, Flexologist]
    code: 200
    input: ["limit?", "offset?"]
    output: AddOn[]
    side_effects: []
  - method: GET
    path: "/members/{id}/no-show-events"
    description: "List a member's no-show/late-cancel events (sub-resource reverse-reachability for NoShowEvent.member_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: NoShowEvent[]
    side_effects: []
  - method: GET
    path: "/bookings/{id}/no-show-events"
    description: "List the no-show/late-cancel events tied to a booking (sub-resource reverse-reachability for NoShowEvent.booking_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: NoShowEvent[]
    side_effects: []

  # ---- RecurringSeries (FK member/location/service/flexologist/table) --------
  - method: POST
    path: "/recurring-series"
    description: "Create a recurring series draft."
    roles: [StudioManager, FrontDesk, Member]
    code: 201
    input: [member_id, location_id, service_id, flexologist_id, table_id, funding_source, funding_id, first_start_utc, interval_days, occurrence_count]
    output: RecurringSeries
    side_effects: ["status=DRAFT, generated_count=0, skipped_count=0"]
  - method: GET
    path: "/recurring-series"
    description: "List/filter recurring series (filtered-list reverse-reachability for member_id, location_id, service_id, flexologist_id, table_id)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: ["member_id?", "location_id?", "service_id?", "flexologist_id?", "table_id?", "funding_id?", "status?", "limit?", "offset?"]
    output: RecurringSeries[]
    side_effects: []
  - method: GET
    path: "/recurring-series/{id}"
    description: "Get a recurring series (generated/skipped counts)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: []
  - method: POST
    path: "/recurring-series/{id}/activate"
    description: "Materialize the series into bookings (waterfall over occurrences)."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: ["status DRAFT -> ACTIVE", "materializes bookings (calc series_materialization); sets generated_count/skipped_count"]
  - method: POST
    path: "/recurring-series/{id}/cancel"
    description: "End a series and cancel its future bookings."
    roles: [StudioManager, FrontDesk, Member]
    code: 200
    input: []
    output: RecurringSeries
    side_effects: ["status ACTIVE -> ENDED", "cascade: future HELD series bookings -> CANCELLED + credit RELEASED + addons voided"]

  # ---- Ops / test-driving ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-04-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [StudioManager]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects: ["ClockState.current_utc = to_iso8601 (no automatic sweeps; sweeps are explicit)"]
  - method: POST
    path: "/_ops/no_show_sweep"
    description: "Sweep: CONFIRMED bookings past session_end_utc -> NO_SHOW; CreditPacks past expires_utc -> EXPIRED; recompute strike scores and member suspension."
    roles: [StudioManager]
    code: 200
    input: ["location_id?"]
    output: null
    side_effects:
      - "for each CONFIRMED booking with clock >= session_end_utc: -> NO_SHOW, credit FORFEITED, fee_charged_cents=no_show_fee(NO_SHOW), NoShowEvent(points=2), strike recompute, possible Member SUSPENDED, addons voided"
      - "for each ACTIVE/DEPLETED CreditPack with clock >= expires_utc: -> EXPIRED"
      - "Member.strike_score recomputed with rolling-window decay; status flips SUSPENDED/ACTIVE at threshold"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID." }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity_backed actor is not the owner of the target resource." }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or referenced FK does not resolve to an existing resource." }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, invalid enum, or bad pagination params." }
  - { id: ERR_LOCATION_MISMATCH, http: 422, condition: "Booking/series references a service, flexologist, table, or funding wallet that belongs to a different location, or funding_id type disagrees with funding_source." }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a valid state for the requested transition (schedule/credit/membership/pack/series)." }
  - { id: ERR_STALE_MEMBERSHIP_VERSION, http: 412, condition: "expected_membership_version does not match Membership.version (OCC)." }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Member.status is SUSPENDED; new bookings/series/confirms are blocked." }
  - { id: ERR_INTRO_REQUIRED, http: 409, condition: "Member.intro_completed is false and the requested service is not an INTRO." }
  - { id: ERR_OUTSIDE_BUSINESS_HOURS, http: 422, condition: "session_start_utc is in the past, outside the location's open/close minutes, or references a RETIRED/INACTIVE/OUT_OF_SERVICE catalog item." }
  - { id: ERR_TABLE_UNAVAILABLE, http: 409, condition: "Requested table_id overlaps an existing non-terminal booking on the half-open [start,end) interval." }
  - { id: ERR_FLEXOLOGIST_UNAVAILABLE, http: 409, condition: "Requested flexologist_id session falls within the buffer of an existing non-terminal session (gap < flexologist_buffer_minutes)." }
  - { id: ERR_FLEXOLOGIST_NOT_CERTIFIED, http: 422, condition: "INTRO booking assigned to a flexologist whose certified_intro is false." }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 409, condition: "Funding wallet available_credits < Service.credit_cost, or the credit pack is EXPIRED / session_start at-or-after pack.expires_utc." }
  - { id: ERR_MEMBERSHIP_NOT_ALLOWED, http: 409, condition: "Membership purchase without completed intro, or a second ACTIVE/FROZEN membership for the same (member, location)." }
  - { id: ERR_ADDON_NOT_ALLOWED, http: 409, condition: "Add-on attach attempted on a booking not in {REQUESTED, CONFIRMED}." }
  - { id: ERR_LOCATION_CLOSED, http: 409, condition: "Booking creation/confirmation at a Location whose status is CLOSED." }
  - { id: ERR_SERIES_OCCURRENCE_LIMIT, http: 422, condition: "occurrence_count outside 1..26, or interval_days <= 0." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A studio member acting on their own memberships, packs, bookings, and series."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET /locations, GET /locations/{id}, GET /flexologists, GET /flexologists/{id}, GET /tables, GET /services"
      - "POST /memberships (own member_id), GET /memberships, GET /memberships/{id}"
      - "POST /memberships/{id}/freeze|unfreeze|cancel (own membership)"
      - "POST /credit-packs (own), GET /credit-packs, GET /credit-packs/{id}"
      - "POST /bookings (own), GET /bookings, GET /bookings/{id}, POST /bookings/{id}/confirm|cancel|reschedule (own), POST /bookings/{id}/add-ons (own)"
      - "GET /bookings/{id}/add-ons, GET /members/{id}/no-show-events (own), GET /bookings/{id}/no-show-events (own), GET /members/{id} (own)"
      - "POST /recurring-series (own), GET /recurring-series, GET /recurring-series/{id}, POST /recurring-series/{id}/activate|cancel (own)"

  - name: Flexologist
    description: "A provider who completes sessions assigned to them and reads their own calendar."
    identity: "entity_backed:Flexologist"
    exclusive_operations: []
    shared_operations:
      - "GET /bookings (filtered to flexologist_id self), GET /bookings/{id}, GET /bookings/{id}/add-ons"
      - "POST /bookings/{id}/complete (booking assigned to self)"
      - "GET /flexologists/{id} (self), GET /locations, GET /locations/{id}"

  - name: FrontDesk
    description: "Front-desk operator booking/cancelling on behalf of members at the desk's location. Opaque operator identity."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /members, GET /members/{id}"
      - "POST /bookings, POST /bookings/{id}/confirm|cancel|reschedule, POST /bookings/{id}/add-ons, GET /bookings, GET /bookings/{id}, GET /bookings/{id}/add-ons"
      - "POST /memberships, GET /memberships, GET /memberships/{id}, POST /credit-packs, GET /credit-packs, GET /credit-packs/{id}"
      - "POST /recurring-series, POST /recurring-series/{id}/activate|cancel, GET /recurring-series, GET /recurring-series/{id}"
      - "GET /members/{id}/no-show-events, GET /bookings/{id}/no-show-events, catalog GETs"

  - name: StudioManager
    description: "Studio operator: manages catalog (locations/flexologists/tables/services), runs ops/no-show sweep, sets the clock, reinstates members. Opaque operator identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /locations, POST /locations/{id}/close"
      - "POST /flexologists, POST /flexologists/{id}/deactivate, POST /tables, POST /tables/{id}/take-out-of-service, POST /services, POST /services/{id}/retire"
      - "POST /members/{id}/reinstate, POST /memberships/{id}/renew"
      - "POST /_clock/set_current_utc, POST /_ops/no_show_sweep"
    shared_operations:
      - "All Member/FrontDesk booking, membership, pack, series, and read operations (manager superset for operational support)."
