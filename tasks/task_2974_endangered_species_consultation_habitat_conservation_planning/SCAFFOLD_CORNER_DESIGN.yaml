          assert:
            - "HTTP 201 with data.primary_species_scientific_name == 'Rana muscosa' — equal rank, so the smaller recovery_unit_population wins"
            - "data.exposed_acres == 12.50, not 22.50: only the primary species' determinations are summed"
            - "data.take_unit == 'INDIVIDUALS' and data.authorized_take_units == 5.00 (12.50 x 0.40)"
