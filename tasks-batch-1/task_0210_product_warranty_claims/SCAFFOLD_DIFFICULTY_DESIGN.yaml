              as: WarrantyAdmin
              captures: { gold_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1g@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
