            - { call: "POST /health-documents/${doc1}/start-review", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
            - { call: "POST /health-documents/${doc1}/reject", payload: { rejection_reason: "rabies section illegible" }, as: VeterinaryReviewer, as_user_id: "vet-01" }
            - { call: "POST /health-documents/${doc1}/resubmit", payload: { issued_at: "2026-07-22T00:00:00Z", expires_at: "2026-10-01T00:00:00Z" }, as: ReservationsAgent, as_user_id: "agent-01" }
            - { call: "POST /health-documents/${doc1}/start-review", payload: {}, as: VeterinaryReviewer, as_user_id: "vet-01" }
