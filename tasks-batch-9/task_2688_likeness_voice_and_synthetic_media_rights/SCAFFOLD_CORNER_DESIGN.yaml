      - name: consent_term_shorter_than_the_minimum_is_refused_at_the_day_boundary
        claim_type: temporal_validation
        grounds: [validations.priority_74, constants.MIN_CONSENT_TERM_DAYS]
        distinguishing_aspect: >-
          Three terms are drafted from the same effective_from: 29 days (refused), exactly 30 days
          (accepted, since the bound is inclusive) and a zero-length term where effective_from equals
          effective_until (refused). The talent's version must not advance on the refused drafts, which
          also proves the OCC bump is applied only on success.
        test_recipe:
          setup:
            - "CA profile, SAG_AFTRA/ADVERTISING union row, one CA/SAG talent at version 1"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-07-01T00:00:00Z", minimum_initial_cents: 300000, minimum_per_use_cents: 150000 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA", union_code: "SAG_AFTRA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
          trigger:
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "29 day term", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-30T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "zero length term", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "30 day term", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-31T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
          assert:
            - "trigger call 1 -> 422 with data.error_id == \"ERR_CONSENT_TERM_INVALID\" (29 < MIN_CONSENT_TERM_DAYS 30)"
            - "trigger call 2 -> 422 with the same error_id (effective_from is not strictly before effective_until)"
            - "trigger call 3 -> 201: exactly 30 days is accepted, so the minimum is inclusive"
            - "Talent.${t_id}.version is still the captured t_v immediately before trigger call 3, so the same expected_talent_version could be replayed after the two refusals; after trigger call 3 it has advanced by 1"
            - "GET /consent-grants?talent_id=${t_id} returns exactly 1 row — the refused drafts left nothing behind"

      - name: disclosure_and_surcharge_apply_only_where_the_state_requires_labelling
        claim_type: conditional_validation
        grounds: [entities.UsageLicense.disclosure_required, calculations.license_total_cost]
        distinguishing_aspect: >-
          disclosure_required is a per-state, per-channel flag, and it gates two things at once: the
          initial compliance_status and the surcharge rate. Two structurally identical ENTERTAINMENT
          licenses are issued, one for a TX talent (labelling not required) and one for a CA talent
          (required), so the same 370500 subtotal yields a 0 surcharge with an immediately VERIFIED
          license in one state and a 4632 surcharge with PENDING_LABEL in the other.
        test_recipe:
          setup:
            - "TX profile with disclosure_required_entertainment false; CA profile with it true"
            - "One non-union talent in each state, each with an ACTIVE FEATURE_FILM grant, an approved replica and an APPROVED performance at 12,000,000 projected impressions"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "TX", postmortem_rights_years: 0, postmortem_requires_registration: false, biometric_retention_max_days: 3650, deletion_grace_days: 10, removal_window_days: 21, disclosure_required_advertising: false, disclosure_required_entertainment: false, min_disclosure_rank_advertising: 1, min_disclosure_rank_entertainment: 1 }
