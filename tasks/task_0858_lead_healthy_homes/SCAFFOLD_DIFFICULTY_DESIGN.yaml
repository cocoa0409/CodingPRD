      - name: hazard_count_conservation_on_clearance_then_void
        grounds:
          - state_machines.HazardControlOrder.CLEARED_to_VOID
          - state_machines.HazardControlOrder.CLEARANCE_PENDING_to_CLEARED
          - calculations.hazard_count_ledger
          - entities.Case.fields.total_hazard_count
        distinguishing_aspect: |
          Conserved quantity = COUNT (total_hazard_count): a clearance PASS moves
          2 hazards OPEN->CONTROLLED (open 2->0, controlled 0->2) and a later
          administrative order VOID reverts them CONTROLLED->OPEN (open 0->2,
          controlled 2->0); total_hazard_count stays 2 throughout (no drift).
