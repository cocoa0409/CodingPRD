  - section: errors
    instances:
      - name: err_uniqueness_family_four_distinct_duplicate_keys
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_RIGHT_NUMBER]
          - errors[ERR_DUPLICATE_DOCKET_NUMBER]
          - errors[ERR_DUPLICATE_USE_YEAR]
          - errors[ERR_DUPLICATE_CLAIM]
          - validations[priority=11]
        distinguishing_aspect: >-
          Four different uniqueness keys with four different scopes fire four
          different 409s on the same fixture: two global keys (right_number,
          docket_number) and two composite keys ((water_right_id, use_year) and
          (decree_docket_id, water_right_id)). The composite keys are proven
          scoped, not global: the same use_year on a DIFFERENT right is accepted.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A holds rights WR-2198-001 (with a 2025 METER record) and WR-2198-002; docket SNK-ADJ-08 (deadline 2026-04-01T00:00:00Z) already carries a claim on WR-2198-001."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr1: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr2: "$.data.id"}}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-08", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr1}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {cm: "$.data.id"}}
          trigger:
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1902-06-01T00:00:00Z", source_stream_code: "SNK-15", purpose_of_use: MUNICIPAL, place_of_use_acres: 40.00, authorized_diversion_af: 100.00, authorized_rate_cfs: 2.000}, as: WaterRightsAnalyst, captures: {err_right: "$.data.error_id"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-08", claim_filing_deadline: "2026-05-01T00:00:00Z"}, as: BasinAdjudicator, captures: {err_docket: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr1}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 250.000, irrigated_acres: 90.00, verification_source: AERIAL_IMAGERY}, as: WaterRightsAnalyst, captures: {err_year: "$.data.error_id"}}
            - {call: "POST /water-rights/${wr2}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 250.000, irrigated_acres: 90.00, verification_source: AERIAL_IMAGERY}, as: WaterRightsAnalyst}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr1}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 50.00}, as: BasinAdjudicator, captures: {err_claim: "$.data.error_id"}}
          assert:
            - "Duplicate right_number: HTTP 409 with error_id ERR_DUPLICATE_RIGHT_NUMBER, even though every other field differs and the claimant is valid."
            - "Duplicate docket_number: HTTP 409 with error_id ERR_DUPLICATE_DOCKET_NUMBER, even with a different filing deadline."
            - "Duplicate (water_right_id, use_year): HTTP 409 with error_id ERR_DUPLICATE_USE_YEAR; the stored 2025 record keeps its original 300.000 AF and METER source — the rejected call does not overwrite."
            - "The SAME use_year 2025 on WR-2198-002: HTTP 201 — the key is composite, not global."
            - "Duplicate (decree_docket_id, water_right_id): HTTP 409 with error_id ERR_DUPLICATE_CLAIM; DecreeDocket.claim_count stays 1."
            - "No entity's version moved on any of the four rejected calls."

      - name: err_self_protest_forbidden_owner_cannot_protest_own_application
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SELF_PROTEST_FORBIDDEN]
          - validations[priority=38]
          - validations[priority=5]
        distinguishing_aspect: >-
          The holder filing against their own transfer passes the ownership check
          at priority 5 (the protestant id IS the caller) and is stopped instead by
          the self-dealing rule at priority 38, so the two identity rules must be
          separate implementations rather than one.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's right certified at 195.00 AF with a published application for 100.00 AF (protest_deadline 2026-03-31T00:00:00Z); claimant B is an unrelated potential protestant."
