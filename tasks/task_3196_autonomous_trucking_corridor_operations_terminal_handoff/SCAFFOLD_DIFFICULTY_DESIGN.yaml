              as: PlatformAdmin
              captures: { ck_id: $.data.id }
            - call: "POST /api/ledger-checkpoints/${ck_id}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_id: $.data.id }
            - call: "POST /api/carriers/${car_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/shipper-commitments"
              payload: { shipper_name: "Rio Grande Distribution", shipper_floor_per_mile_cents: 100, reserved_window_start_epoch_day: 0, reserved_window_end_epoch_day: 30, committed_slots: 5 }
              as: ShipperPartnershipManager
              captures: { com_id: $.data.id }
            - call: "POST /api/shipper-commitments/${com_id}/confirm"
              payload: {}
              as: ShipperPartnershipManager
            - call: "POST /api/driver-prospects"
              payload: { prospect_name: "Dana Whitfield", home_terminal_id: "${t_phx}", pathway: "FIRST_LAST_MILE" }
              as: DriverOutreachCoordinator
              captures: { pro_id: $.data.id }
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 120, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "HIGH_WIND", weather_risk_score: 55 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
          trigger:
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_id}", window_start_epoch_day: 4, window_end_epoch_day: 6, trailer_count: 2, posted_per_mile_cents: 225, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: true }
              as: CarrierDispatcher
              captures: { rp_id: $.data.id }
          assert:
            - "RunPlan.${rp_id}.run_plan_exposure_cents == 762.28 under the pinned per_line_rounded order"
            - "the unrounded terms are applicable 310, late 10.2375 and weather 442.035; summing then rounding once gives 762.27 instead"
            - "RunPlan.${rp_id}.committed_rate_cents == 250 and RunPlan.${rp_id}.per_mile_rate_cents == 260"
