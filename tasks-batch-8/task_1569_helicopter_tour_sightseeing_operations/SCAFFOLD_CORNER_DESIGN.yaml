              captures: { rot3: $.data.rotation_seq }
          assert:
            - "trigger captures (rot1, rot2, rot3) == (1, 2, 3) by scheduled_departure_utc ASC — creation order (f3 first) is irrelevant"
            - "rotation_seq is per (aircraft_id, UTC date): all three share N1 on 2026-08-03"

      - name: weather_posture_latest_observation_wins
        claim_type: correct_result
        grounds:
          - calculations.weather_posture
          - entities.Base.fields.posture
          - state_machines.Base.WEATHER_HOLD_to_NORMAL
        distinguishing_aspect: |
          Posture projects from the latest observation by observed_at: an adverse
          11:30 observation holds the base at 12:00, a newer non-adverse 11:45
          observation restores NORMAL even though the adverse one is still
          inside its validity window.
        test_recipe:
          setup: ["Base default limits; clock 2026-08-03T12:00:00Z; no flights (cascade has no targets)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /weather-observations"
              payload: { base_id: "${base_id}", observed_at: "2026-08-03T11:30:00Z", ceiling_ft: 800, visibility_sm: 5, wind_kt: 10 }
              as: Dispatcher
              captures: { o1_adv: $.data.adverse }
            - call: "GET /bases/${base_id}"
              as: Dispatcher
              captures: { posture_hold: $.data.posture }
            - call: "POST /weather-observations"
              payload: { base_id: "${base_id}", observed_at: "2026-08-03T11:45:00Z", ceiling_ft: 5000, visibility_sm: 10, wind_kt: 8 }
              as: Dispatcher
              captures: { o2_adv: $.data.adverse }
            - call: "GET /bases/${base_id}"
              as: Dispatcher
              captures: { posture_after: $.data.posture }
          assert:
            - "trigger capture o1_adv == true and posture_hold == WEATHER_HOLD (adverse, 12:00 < validity 12:30)"
            - "trigger capture o2_adv == false and posture_after == NORMAL (the 11:45 observation supersedes the still-valid 11:30 one by observed_at ordering)"

  # ===========================================================================
  # Section 4 — Validations (Table 4 claims)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 2 beats everything else: a request with no X-User-Role /
          X-User-ID headers gets 401 ERR_UNAUTHENTICATED even for a well-formed
          GET, and an unrecognized role value gets the same 401 (not 403).
        test_recipe:
          setup: ["Base exists"]
          setup_api_calls:
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "GET /bases/${base_id}"
              captures: { err1: $.data.error_id }
            - call: "GET /bases/${base_id}"
              as: Wizard
              captures: { err2: $.data.error_id }
          assert:
            - "trigger capture err1 == ERR_UNAUTHENTICATED (request sent with NO X-User-Role / X-User-ID headers; 401)"
            - "trigger capture err2 == ERR_UNAUTHENTICATED (role value 'Wizard' is not a recognized role; 401, not 403)"

      - name: not_found_beats_state_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Existence (priority 4) precedes state (priority 6): a transition event
          against a non-existent flight or complaint id returns 404
          ERR_NOT_FOUND, never ERR_INVALID_STATE.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /flights/00000000-0000-4000-8000-000000000000/events"
              payload: { event_type: "OPEN_BOARDING" }
              as: Dispatcher
              captures: { err1: $.data.error_id }
            - call: "POST /complaints/00000000-0000-4000-8000-000000000000/events"
              payload: { event_type: "REVIEW" }
              as: ComplianceOfficer
              captures: { err2: $.data.error_id }
          assert:
            - "trigger capture err1 == ERR_NOT_FOUND (not ERR_INVALID_STATE — the missing resource is detected first)"
            - "trigger capture err2 == ERR_NOT_FOUND"

      - name: departure_in_past_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_DEPARTURE_IN_PAST]
          - state_machines.Flight.SCHEDULED_to_DELAYED
        distinguishing_aspect: |
          The future-departure rule is strict: creating at now or in the past
          fails on POST /flights, and DELAY to a past instant fails on the
          event endpoint — all three surface ERR_DEPARTURE_IN_PAST (409).
        test_recipe:
          setup: ["Full fixture; F1 dep 2026-08-03T14:00:00Z; clock 2026-08-03T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T11:59:00Z" }
              as: Dispatcher
              captures: { err1: $.data.error_id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T12:00:00Z" }
              as: Dispatcher
              captures: { err2: $.data.error_id }
            - call: "POST /flights/${f1}/events"
              payload: { event_type: "DELAY", new_departure_utc: "2026-08-03T12:30:00Z" }
              as: Dispatcher
              captures: { err3: $.data.error_id }
          assert:
            - "trigger capture err1 == ERR_DEPARTURE_IN_PAST (11:59 < now)"
            - "trigger capture err2 == ERR_DEPARTURE_IN_PAST (12:00 == now is not strictly future)"
            - "trigger capture err3 == ERR_DEPARTURE_IN_PAST (DELAY re-checks new_departure_utc > now)"
            - "Flight.${f1}.scheduled_departure_utc still == 2026-08-03T14:00:00Z (failed DELAY mutates nothing)"

      - name: quiet_hours_violation_and_boundary
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_QUIET_HOURS_VIOLATION]
          - entities.Base.fields.quiet_hours_start_min_utc
        distinguishing_aspect: |
          The quiet window [60, 780) binds only noise-sensitive routes flown by
          non-QUIET aircraft: a STANDARD aircraft at minute 90 is rejected, a
          QUIET aircraft at minute 90 is exempt, and the STANDARD aircraft at
          exactly minute 780 (exclusive end) and at minute 59 both pass.
        test_recipe:
          setup:
            - "Base quiet hours [60, 780) (01:00-13:00 UTC); route NS noise_sensitive=true, zones [VILLAGE], min class ANY; aircraft AQ QUIET and AS STANDARD; pilot P; clock 2026-08-03T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "NS", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: true, noise_zones: ["VILLAGE"], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "NQ", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { aq: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "NS1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "STANDARD" }
              as: OpsAdmin
              captures: { as_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${as_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T01:30:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${aq}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T01:30:00Z" }
              as: Dispatcher
              captures: { f_quiet: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${as_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T13:00:00Z" }
              as: Dispatcher
              captures: { f_end: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${as_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-04T00:59:00Z" }
              as: Dispatcher
              captures: { f_before: $.data.id }
          assert:
            - "trigger capture err == ERR_QUIET_HOURS_VIOLATION (STANDARD aircraft, minute 90 in [60, 780), noise-sensitive route)"
            - "QUIET aircraft at the same minute succeeded — captured f_quiet is a UUID (noise class exempts the window)"
            - "STANDARD at exactly 13:00 (minute 780) succeeded — captured f_end is a UUID (end bound exclusive)"
            - "STANDARD at 00:59 next day (minute 59 < 60) succeeded — captured f_before is a UUID (before window start)"

