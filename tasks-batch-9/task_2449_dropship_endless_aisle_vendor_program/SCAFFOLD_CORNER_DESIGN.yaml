# SCAFFOLD_CORNER_DESIGN.yaml - task_2449_dropship_endless_aisle_vendor_program
# Section 1.9 of the scaffold: the breadth probe. One instance per applicable row of the
# claim-extraction guide, walked against this scaffold's sections 1.1-1.7. Rows already
# proven by a section 1.8 instance are carried as excluded_because stubs that name it.
# Every arithmetic assertion is a pre-computed literal and the logical clock starts at its
# mandatory default of 2026-08-01T00:00:00Z in every recipe.
scaffold_corner_design:
- section: entities
  instances:
  - name: corner_vendor_create_returns_201_with_every_declared_field
    claim_type: creation
    grounds:
    - entities.Vendor
    - endpoints[POST /dropship/vendors]
    distinguishing_aspect: POST /dropship/vendors with every required field returns 201 and the response data carries
      all declared Vendor fields, including the computed onboarding_status DRAFT and the system id / created_at
      / version triple.
    test_recipe:
      setup:
      - The logical clock is at the mandatory default 2026-08-01T00:00:00Z and no vendor exists.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-CREATE
          legal_name: Create Co LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
          inventory_refresh_cadence_minutes: 60
          safety_buffer_units: 5
          oversell_grace_units: 0
          default_lead_time_days: 3
          ack_sla_hours: 24
          ship_sla_grace_hours: 12
        as: PlatformAdmin
        captures:
          vcr_id: $.data.id
      assert:
      - the response status is 201 and response_type is "object"
      - Vendor.${vcr_id}.vendor_code == "V-CREATE"
      - Vendor.${vcr_id}.cost_model == COMMISSION and commission_rate_bps == 1500
      - Vendor.${vcr_id}.onboarding_status == DRAFT
      - Vendor.${vcr_id}.integration_round == 1
      - Vendor.${vcr_id}.performance_tier == UNRATED
      - Vendor.${vcr_id}.settlement_balance_cents == 0 and chargeback_balance_cents == 0
      - Vendor.${vcr_id}.version == 1 and id, created_at, updated_at are all present
  - name: corner_vendor_get_returns_the_stored_row
    claim_type: retrieval
    grounds:
    - entities.Vendor
    - endpoints[GET /dropship/vendors/{id}]
    distinguishing_aspect: GET /dropship/vendors/{id} echoes exactly what POST persisted - no field is dropped and
      no field is recomputed differently on read.
    test_recipe:
      setup:
      - Vendor V1 has been created with commission_rate_bps 1500 and cadence 60 minutes and has not been touched
        since.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-READ
          legal_name: Readback Co LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
          inventory_refresh_cadence_minutes: 60
          safety_buffer_units: 5
          default_lead_time_days: 3
        as: PlatformAdmin
        captures:
          vrd_id: $.data.id
      trigger:
      - call: GET /dropship/vendors/${vrd_id}
        payload: {}
        as: PlatformAdmin
      assert:
      - the response status is 200
      - Vendor.${vrd_id}.vendor_code == "V-READ"
      - Vendor.${vrd_id}.inventory_refresh_cadence_minutes == 60
      - Vendor.${vrd_id}.safety_buffer_units == 5
      - Vendor.${vrd_id}.default_lead_time_days == 3
      - Vendor.${vrd_id}.version == 1 (a read does not bump the version)
  - name: corner_item_list_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - endpoints[GET /dropship/items]
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: 'GET /dropship/items honours limit and offset and reports total_count over the whole
      filtered set, not over the returned page: with three offers on V1 and limit 2, the first page carries 2 rows
      with total_count 3 and has_more true, and offset 2 carries 1 row with has_more false.'
    test_recipe:
      setup:
      - Vendor V1 is ACTIVE.
      - Three DRAFT offers exist on V1 with skus SKU-P-1, SKU-P-2 and SKU-P-3, created in that order, and no offers
        exist on any other vendor.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V1
          legal_name: Northwind Dropship LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
          inventory_refresh_cadence_minutes: 60
          safety_buffer_units: 5
          oversell_grace_units: 0
          default_lead_time_days: 3
          ack_sla_hours: 24
          ship_sla_grace_hours: 12
        as: PlatformAdmin
        captures:
          v1_id: $.data.id
      - call: POST /dropship/vendors/${v1_id}/begin-integration
        payload: {}
        as: VendorOpsAnalyst
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: CATALOG
          sample_payload_digest: sha256-V1-catalog
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_catalog: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: INVENTORY
          sample_payload_digest: sha256-V1-inventory
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_inventory: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: ORDER
          sample_payload_digest: sha256-V1-order
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_order: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: SHIP_CONFIRM
          sample_payload_digest: sha256-V1-ship_confirm
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_ship_confirm: $.data.id
      - call: POST /dropship/integration-tests/${v1_t_catalog}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_inventory}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_order}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_ship_confirm}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/vendors/${v1_id}/serviceability-rules
        payload:
          zone_code: US-WEST
          ship_method: GROUND
          transit_days: 4
          cutoff_hour_utc: 18
          surcharge_cents: 0
        as: MerchandiseManager
        captures:
          v1_r1_id: $.data.id
      - call: POST /dropship/vendors/${v1_id}/certify
        payload: {}
        as: VendorOpsAnalyst
        as_user_id: ops-cert-V1
      - call: POST /dropship/vendors/${v1_id}/activate
        payload: {}
        as: MerchandiseManager
        as_user_id: mm-activator-V1
        captures:
          v1_ver: $.data.version
      - call: POST /dropship/items
        payload:
          vendor_id: ${v1_id}
          sku: SKU-P-1
          unit_retail_cents: 1000
          ship_method: GROUND
          lead_time_days: 3
        as: MerchandiseManager
        captures:
          ip1_id: $.data.id
      - call: POST /dropship/items
        payload:
          vendor_id: ${v1_id}
          sku: SKU-P-2
          unit_retail_cents: 2000
          ship_method: GROUND
          lead_time_days: 3
        as: MerchandiseManager
        captures:
          ip2_id: $.data.id
      - call: POST /dropship/items
        payload:
          vendor_id: ${v1_id}
          sku: SKU-P-3
          unit_retail_cents: 3000
          ship_method: GROUND
          lead_time_days: 3
        as: MerchandiseManager
        captures:
          ip3_id: $.data.id
      trigger:
      - call: GET /dropship/items
        payload:
          vendor_id: ${v1_id}
          limit: 2
          offset: 0
        as: PlatformAdmin
      - call: GET /dropship/items
        payload:
          vendor_id: ${v1_id}
          limit: 2
          offset: 2
        as: PlatformAdmin
      assert:
      - trigger step 1 returns response_type "array" with exactly 2 rows
      - trigger step 1 reports total_count == 3, limit == 2, offset == 0 and has_more == true
      - trigger step 2 returns exactly 1 row
      - trigger step 2 reports total_count == 3, offset == 2 and has_more == false
      - the row in trigger step 2 has sku == "SKU-P-3" (created_at ASC ordering)
  - name: corner_vendor_get_with_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - validations[priority=3]
    - errors[ERR_VENDOR_NOT_FOUND]
    - endpoints[GET /dropship/vendors/{id}]
    distinguishing_aspect: A syntactically valid but unknown vendor id resolves to 404 ERR_VENDOR_NOT_FOUND, not
      to 200 with an empty body and not to 400.
    test_recipe:
      setup:
      - The database contains no vendor with id 00000000-0000-4000-8000-000000000099.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /dropship/vendors/00000000-0000-4000-8000-000000000099
        payload: {}
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404
      - the response error_id == ERR_VENDOR_NOT_FOUND
      - response_type is "error"
