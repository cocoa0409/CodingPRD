            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { p1: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 2, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { p2: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 3, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { p3: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-T1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { ct1: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-T2", pricing_tier: "T2", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { ct2: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-T3", pricing_tier: "T3", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { ct3: "$.data.id" } }
            - { call: "POST /contracts/${ct1}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /contracts/${ct2}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /contracts/${ct3}/activate", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${p1}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${ct1}", max_gallons: 50.0 }, as: Cashier, as_user_id: "cash-1", captures: { q1: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${p2}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${ct2}", max_gallons: 50.0 }, as: Cashier, as_user_id: "cash-1", captures: { q2: "$.data.authorized_quote_cents_per_gallon" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${p3}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${ct3}", max_gallons: 50.0 }, as: Cashier, as_user_id: "cash-1", captures: { q3: "$.data.authorized_quote_cents_per_gallon" } }
          assert:
            - "T1 quote == 283 (2.8300 x 100), T2 == 280 (2.8000), T3 == 276 (2.7600)"
            - "tier discounts applied as flat $/gal off (0.02 / 0.05 / 0.09), not percentages"

      - name: calc_parking_amount_grace_ceil_oversize_points
        claim_type: correct_result
        grounds:
          - "calculations.parking_paid_amount"
        distinguishing_aspect: "Three pricing features of parking_paid_amount in one fixture: 15-minute grace subtraction, ceil of fractional billed hours (495 paid minutes -> 9 hours), oversize flat fee (+800), and points deduction (100 points -> -50 cents)."
        test_recipe:
          setup: ["Site parking_paid_capacity 10; member with 500 points and plates STD-1 / OVR-2; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site C4", parking_total_spaces: 20, parking_paid_capacity: 10, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 500, reason: "seed" }, as: GeneralManager }
            - { call: "POST /loyalty-members/${m_id}/vehicles", payload: { plate: "STD-1", vehicle_type: "TRACTOR" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /loyalty-members/${m_id}/vehicles", payload: { plate: "OVR-2", vehicle_type: "RV" }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m_id}", vehicle_plate: "STD-1", space_type: "STANDARD", reserved_from: "2026-08-12T22:15:00Z", reserved_to: "2026-08-13T06:45:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r1_amt: "$.data.amount_cents", r1_hours: "$.data.billed_hours" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m_id}", vehicle_plate: "OVR-2", space_type: "OVERSIZED", reserved_from: "2026-08-12T22:15:00Z", reserved_to: "2026-08-13T06:45:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r2_amt: "$.data.amount_cents", r2_over: "$.data.oversize_fee_cents" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m_id}", vehicle_plate: "STD-1", space_type: "STANDARD", reserved_from: "2026-08-13T22:15:00Z", reserved_to: "2026-08-14T06:45:00Z", requested_redeem_points: 100 }, as: Cashier, as_user_id: "cash-1", captures: { r3_amt: "$.data.amount_cents", r3_pts: "$.data.points_discount_cents" } }
          assert:
            - "R1: billed_hours == 9 (510 total - 15 grace = 495 paid minutes, ceil(495/60)), amount_cents == 2700"
            - "R2: oversize_fee_cents == 800, amount_cents == 3500"
            - "R3: points_discount_cents == 50, amount_cents == 2650"
            - "member points_balance == 400 after R3 (500 - 100 burned at creation)"

      - name: calc_fleet_tier_boundary_4999_vs_5000
        claim_type: boundary_edge
        grounds:
          - "calculations.fleet_tier_recompute"
        distinguishing_aspect: "Inclusive breakpoint: rolling 4999.999 gal keeps the fleet at T1 while exactly 5000.000 flips it to T2 (>= comparison, gallons at 3-decimal precision)."
        test_recipe:
          setup: ["Site with diesel tank (rack 2.7000), two pumps, register, OPEN shift; fleets F1/F2 each with an ACTIVE T1 contract; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site C5", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { p1: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 2, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { p2: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet One", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f1: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f1}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c1: "$.data.id" } }
            - { call: "POST /contracts/${c1}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet Two", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f2: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f2}/contracts", payload: { contract_code: "C-2", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c2: "$.data.id" } }
            - { call: "POST /contracts/${c2}/activate", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${p1}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f1}", contract_id: "${c1}", max_gallons: 4999.999 }, as: Cashier, as_user_id: "cash-1", captures: { s1: "$.data.id" } }
            - { call: "POST /fuel-sales/${s1}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s1}/dispensing-complete", payload: { dispensed_gallons: 4999.999 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s1}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${p2}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f2}", contract_id: "${c2}", max_gallons: 5000.0 }, as: Cashier, as_user_id: "cash-1", captures: { s2: "$.data.id" } }
            - { call: "POST /fuel-sales/${s2}/dispensing-start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s2}/dispensing-complete", payload: { dispensed_gallons: 5000.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /fuel-sales/${s2}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "GET /fleet-accounts/${f1}", payload: {}, as: GeneralManager, captures: { f1_tier: "$.data.pricing_tier", f1_roll: "$.data.rolling_30d_gallons" } }
            - { call: "GET /fleet-accounts/${f2}", payload: {}, as: GeneralManager, captures: { f2_tier: "$.data.pricing_tier", f2_roll: "$.data.rolling_30d_gallons" } }
          assert:
            - "F1: rolling == 4999.999, pricing_tier == T1 (just below the inclusive breakpoint)"
            - "F2: rolling == 5000.0, pricing_tier == T2 (>= 5000 triggers)"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: validation_missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or state evaluation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sites", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_UNAUTHENTICATED with HTTP 401"

      - name: validation_wrong_role_and_missing_site_returns_forbidden
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=5]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Authorization (priority 2) beats existence (priority 5): Cashier posting a price to a NON-EXISTENT site gets ERR_FORBIDDEN (403), not ERR_NOT_FOUND."
        test_recipe:
          setup: ["One real site exists (only to source a well-formed OCC version value)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V3", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_v: "$.data.version" } }
          trigger:
            - { call: "POST /sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN (role check fires before the site's existence is even consulted)"

      - name: validation_unknown_site_returns_not_found
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Path identifiers validate left to right: a nested call under a non-existent site 404s on the site regardless of whether the child id exists."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/pumps", payload: {}, as: GeneralManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND (site segment resolves first)"

      - name: validation_parking_window_shape_errors
        claim_type: violation_to_error
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_INVALID_WINDOW]"
        distinguishing_aspect: "Three window-shape violations share ERR_INVALID_WINDOW: reserved_from in the past, reserved_to <= reserved_from, and a window longer than 336 hours."
        test_recipe:
          setup: ["Site parking_paid_capacity 2; member with plate AAA111; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V4", parking_total_spaces: 10, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/vehicles", payload: { plate: "AAA111", vehicle_type: "TRACTOR" }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m_id}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T09:00:00Z", reserved_to: "2026-08-12T17:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { err1: "$.data.error_id" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m_id}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-12T21:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { err2: "$.data.error_id" } }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m_id}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-27T22:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { err3: "$.data.error_id" } }
          assert:
            - "past start -> ERR_INVALID_WINDOW"
            - "inverted window -> ERR_INVALID_WINDOW"
            - "360-hour window (> 336) -> ERR_INVALID_WINDOW"

      - name: validation_duplicate_price_window_start_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=20]"
          - "errors[ERR_OVERLAPPING_PRICE_WINDOW]"
        distinguishing_aspect: "A new DIESEL price whose effective_from exactly equals the existing ACTIVE price's effective_from is rejected ERR_OVERLAPPING_PRICE_WINDOW; a strictly later start is accepted and truncates the older price instead."
        test_recipe:
          setup: ["Site with ACTIVE diesel price 385 effective 2026-08-01 (open-ended); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V5", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead, captures: { price_a: "$.data.id" } }
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { site_v2: "$.data.version" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 390, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v2}" }, as: FuelDeskLead, captures: { err: "$.data.error_id" } }
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { site_v3: "$.data.version" } }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 390, effective_from: "2026-08-20T00:00:00Z", expected_site_version: "${site_v3}" }, as: FuelDeskLead, captures: { price_b: "$.data.id" } }
            - { call: "GET /fuel-prices/${price_a}", payload: {}, as: FuelDeskLead, captures: { a_to: "$.data.effective_to", a_status: "$.data.status" } }
          assert:
            - "duplicate start 2026-08-01 -> ERR_OVERLAPPING_PRICE_WINDOW"
            - "later start 2026-08-20 accepted; older price truncated: effective_to == 2026-08-20T00:00:00Z, status stays ACTIVE"

      - name: validation_credit_limit_projected_over
        claim_type: aggregate_validation
        grounds:
          - "validations[priority=35]"
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
        distinguishing_aspect: "Aggregate fiscal check: the provisional total of the new sale (283 x 120.250 = 34028 cents) plus the fleet's outstanding balance (0) exceeds the 30000-cent credit limit -> ERR_CREDIT_LIMIT_EXCEEDED at authorize."
        test_recipe:
          setup: ["Site with diesel tank (rack 2.7000), pump, register, OPEN shift; fleet (credit_limit 30000) with ACTIVE T1 contract discount 0.00; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V6", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet Tight", credit_limit_cents: 30000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c_id}", max_gallons: 120.25 }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CREDIT_LIMIT_EXCEEDED (projected 34028 > 30000)"

      - name: validation_drop_denominations_mismatch
        claim_type: violation_to_error
        grounds:
          - "validations[priority=36]"
          - "errors[ERR_DROP_MISMATCH]"
          - "calculations.cash_drop_target"
        distinguishing_aspect: "Drop whose denominations sum (2x2000 + 1x100 = 4100) differs from declared amount_cents 4000 is rejected ERR_DROP_MISMATCH; expected cash unchanged."
        test_recipe:
          setup: ["Site, register float 20000, OPEN shift with expected 20000; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V7", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/drops", payload: { amount_cents: 4000, denominations: { "2000": 2, "100": 1 } }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected: "$.data.expected_cash_cents" } }
          assert:
            - "err == ERR_DROP_MISMATCH (4100 != 4000)"
            - "shift expected_cash_cents unchanged at 20000"

      - name: validation_drop_exceeds_above_float
        claim_type: boundary_edge
        grounds:
          - "validations[priority=37]"
          - "errors[ERR_DROP_EXCEEDS_EXPECTED]"
        distinguishing_aspect: "With expected exactly equal to float (20000), even a 1-cent drop exceeds the keep-float rule: amount 1 > expected - float = 0 -> ERR_DROP_EXCEEDS_EXPECTED (zero-amount headroom boundary)."
        test_recipe:
          setup: ["Site, register float 20000, OPEN shift with no sales (expected == 20000); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V8", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/drops", payload: { amount_cents: 1, denominations: { "1": 1 } }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DROP_EXCEEDS_EXPECTED (drawer must keep at least the float)"

      - name: validation_payout_exceeds_expected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=38]"
          - "errors[ERR_PAYOUT_EXCEEDS_EXPECTED]"
        distinguishing_aspect: "Payout of 20001 cents against expected 20000 fails ERR_PAYOUT_EXCEEDS_EXPECTED; a 20000 payout succeeds and leaves expected at exactly 0."
        test_recipe:
          setup: ["Site, register float 20000, OPEN shift (expected 20000); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V9", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/payouts", payload: { amount_cents: 20001, reason: "too much" }, as: ShiftManager, as_user_id: "sm-2", captures: { err: "$.data.error_id" } }
            - { call: "POST /shifts/${shift_id}/payouts", payload: { amount_cents: 20000, reason: "exact" }, as: ShiftManager, as_user_id: "sm-2", captures: { expected_after: "$.data.expected_cash_cents" } }
          assert:
            - "err == ERR_PAYOUT_EXCEEDS_EXPECTED"
            - "exact-amount payout succeeds: expected_cash_cents == 0"

      - name: validation_close_variance_unapproved_then_approved
        claim_type: conditional_validation
        grounds:
          - "validations[priority=40]"
          - "errors[ERR_COUNT_SHORTAGE_UNAPPROVED]"
          - "state_machines.Shift.OPEN_to_CLOSED"
        distinguishing_aspect: "Close with variance -700 (beyond the 500-cent tolerance) is rejected without approve_variance; repeating with approve_variance: true closes the shift and records resolution SHORTAGE."
        test_recipe:
          setup: ["Site, register float 20000, OPEN shift (expected 20000, opened by sm-1); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V10", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/close", payload: { counted_cash_cents: 19300 }, as: ShiftManager, as_user_id: "sm-2", captures: { err: "$.data.error_id" } }
            - { call: "POST /shifts/${shift_id}/close", payload: { counted_cash_cents: 19300, approve_variance: true }, as: ShiftManager, as_user_id: "sm-2", captures: { st: "$.data.status" } }
            - { call: "GET /shifts/${shift_id}/reconciliations", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { variance: "$.data[0].variance_cents", resolution: "$.data[0].resolution" } }
          assert:
            - "first close -> ERR_COUNT_SHORTAGE_UNAPPROVED"
            - "second close -> CLOSED; reconciliation variance_cents == -700, resolution == SHORTAGE"

      - name: validation_water_bottom_over_limit_delivery_and_stick
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_WATER_BOTTOM_EXCEEDED]"
        distinguishing_aspect: "Fuel-quality safety check precedes constraint checks: a delivery reporting 1.5 inches of water bottom is rejected ERR_WATER_BOTTOM_EXCEEDED and tank inventory is unchanged; a stick reading at 1.2 inches is likewise rejected."
        test_recipe:
          setup: ["Site with DEF tote (cap 550, current 320); clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site V11", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DEF", capacity_gallons: 550, reorder_threshold_gallons: 150, safety_stock_gallons: 60, daily_usage_gallons: 18, lead_time_days: 2, initial_gallons: 320 }, as: GeneralManager, captures: { tank_id: "$.data.id" } }
          trigger:
            - { call: "POST /bulk-tanks/${tank_id}/deliveries", payload: { gallons_delivered: 100.0, water_bottom_inches: 1.5 }, as: FuelDeskLead, captures: { err1: "$.data.error_id" } }
            - { call: "POST /bulk-tanks/${tank_id}/stick-reading", payload: { reading_gallons: 300.0, water_bottom_inches: 1.2 }, as: FuelDeskLead, captures: { err2: "$.data.error_id" } }
            - { call: "GET /bulk-tanks/${tank_id}", payload: {}, as: FuelDeskLead, captures: { cur: "$.data.current_gallons" } }
          assert:
            - "both err1 and err2 == ERR_WATER_BOTTOM_EXCEEDED (> 1.0 inch limit)"
