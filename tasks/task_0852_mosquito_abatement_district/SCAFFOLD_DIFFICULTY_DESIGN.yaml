  - rule_id: non_linear_state_machine
    instances:
      - name: lab_pool_invalid_retest_cycle_capped_at_two_retests
        grounds:
          - state_machines.LabPool.INVALID_to_IN_TESTING
          - state_machines.LabPool.IN_TESTING_to_INVALID
          - entities.LabPool.fields.retest_count
          - errors[ERR_RETEST_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Non-linear shape #1 is a CYCLE on LabPool: IN_TESTING -> INVALID -> IN_TESTING
          can be traversed exactly twice (retest_count 1 then 2) and the third re-entry
          is refused with ERR_RETEST_LIMIT_EXCEEDED while the pool stays INVALID.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with one trap site and one SUBMITTED collection."
            - "One LabPool of 25 mosquitoes on that collection, already advanced to IN_TESTING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-areas/${area_id}/trap-sites"
              payload: { site_code: "T-001", trap_type: "GRAVID", habitat: "URBAN", x_m: 0, y_m: 0 }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /trap-sites/${site_id}/collections"
              payload: { collection_date: "2026-05-28", trap_nights: 1, female_count: 25, species: "CULEX_PIPIENS" }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { coll_id: $.data.id }
            - call: "POST /trap-collections/${coll_id}/transitions"
              payload: { action: "SUBMIT" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /trap-collections/${coll_id}/lab-pools"
              payload: { pool_size: 25, assay: "RT_PCR" }
              as: LabAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
          trigger:
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "RESULT", result: "INVALID" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
              captures: { rc_after_first_retest: $.data.retest_count }
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "RESULT", result: "INVALID" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
              captures: { rc_after_second_retest: $.data.retest_count }
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "RESULT", result: "INVALID" }
              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "START_TEST" }
              as: LabAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "${rc_after_first_retest} == 1"
            - "${rc_after_second_retest} == 2"
            - "${err_id} == ERR_RETEST_LIMIT_EXCEEDED"
            - "LabPool.${pool_id}.status == INVALID"
            - "LabPool.${pool_id}.retest_count == 2"
            - "TrapCollection.${coll_id}.pooled_mosquito_count == 25"

      - name: service_request_two_axes_evolve_independently_across_reopen
        grounds:
          - state_machines.ServiceRequest.RESOLVED_to_TRIAGED
          - state_machines.ServiceRequest.ASSIGNED_to_INSPECTED
          - entities.ServiceRequest.fields.handling_status
          - entities.ServiceRequest.fields.verification_status
        distinguishing_aspect: |
          Non-linear shape #2 lives on a DIFFERENT entity (ServiceRequest) and is a pair
          of PARALLEL dimensions plus a reopen cycle: handling_status walks
          RECEIVED->TRIAGED->ASSIGNED->INSPECTED->RESOLVED->TRIAGED->ASSIGNED->INSPECTED
          while verification_status independently goes UNVERIFIED->FIELD_CONFIRMED, is
          reset to UNVERIFIED by REOPEN, and then flips to UNFOUNDED on re-inspection.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 with risk_posture NORMAL and one ACTIVE applicator."
            - "One ServiceRequest filed by a Resident, triaged ROUTINE, assigned, inspected FIELD_CONFIRMED, and RESOLVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
            - call: "POST /service-areas"
              payload: { name: "Northwest Zone", code: "NW1", season_start_date: "2026-05-01", population: 50000 }
              as: DistrictAdmin
              captures: { area_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Tess Vega", license_no: "L-1001", license_category: "AERIAL", license_expires_on: "2027-12-31" }
              as: DistrictAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /service-requests"
              payload: { service_area_id: "${area_id}", reporter_contact: "res1@example.com", category: "STANDING_WATER", description: "Ditch full of larvae behind the school", x_m: 500, y_m: 500 }
              as: Resident
              as_user_id: "u-res-1"
              captures: { req_id: $.data.id }
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "TRIAGE", priority: "ROUTINE" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "ASSIGN", assigned_applicator_id: "${tech_id}" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "INSPECT", verification_status: "FIELD_CONFIRMED" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "RESOLVE", resolution_note: "Catch basin treated" }
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "REOPEN" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
              captures: { vs_after_reopen: $.data.verification_status, hs_after_reopen: $.data.handling_status }
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "ASSIGN", assigned_applicator_id: "${tech_id}" }
              as: AbatementManager
              as_user_id: "u-mgr-1"
            - call: "POST /service-requests/${req_id}/transitions"
              payload: { action: "INSPECT", verification_status: "UNFOUNDED" }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "${hs_after_reopen} == TRIAGED"
            - "${vs_after_reopen} == UNVERIFIED"
            - "ServiceRequest.${req_id}.handling_status == INSPECTED"
            - "ServiceRequest.${req_id}.verification_status == UNFOUNDED"
            - "ServiceRequest.${req_id}.reopen_count == 1"
            - "ServiceRequest.${req_id}.priority == ROUTINE"
            - "ServiceRequest.${req_id}.triaged_at == 2026-06-01T00:00:00.000Z"
            - "ServiceRequest.${req_id}.due_at == 2026-06-06T00:00:00.000Z"

      - name: aerial_plan_return_revise_cycle_clears_partial_quorum
        grounds:
          - state_machines.TreatmentPlan.SUBMITTED_to_RETURNED
          - state_machines.TreatmentPlan.RETURNED_to_DRAFT
          - state_machines.TreatmentPlan.SUBMITTED_to_SUBMITTED
          - entities.TreatmentPlan.fields.approver_user_ids
          - entities.TreatmentPlan.fields.revision_count
        distinguishing_aspect: |
          Non-linear shape #3 is on a THIRD entity (TreatmentPlan) and is a branching
          machine with a revision cycle: the AERIAL branch needs two distinct approvers,
          the self-loop SUBMITTED -> SUBMITTED records the first of them, and traversing
