          ERR_POI_LIMIT_EXCEEDED has two independent triggers - the raw MW limit and the derived
          apparent-MVA limit - and the MVA branch is only reachable with an MW value that is itself
          legal, so an implementation that stops at the MW comparison never sees it. The reactive
          code sits one priority lower and must only fire once both POI comparisons pass, which
          forces a measurement whose apparent power is comfortably inside the MVA limit. All three
          comparisons are inclusive, so the limit values themselves must be accepted.
