  - section: cross_cutting_complexity_layers
    instances:

      - name: a_draft_version_observed_before_the_ballot_close_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[public-review-supersede-stale-draft]
          - validations[priority=80]
          - errors[ERR_STALE_DRAFT_VERSION]
        distinguishing_aspect: "Draft.version is bumped by writes the announcer never issued: the version read while the ballot was still open is stale the moment the close cascade touches the draft, so the announcement is refused with 412 ERR_STALE_DRAFT_VERSION and creates no PublicReview row, while the re-read version succeeds on the identical body."
