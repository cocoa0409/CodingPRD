              payload: { credit_rating: "BB", review_note: "Downgrade after covenant breach." }
              as: TreasuryRiskManager
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/counterparties/${cp_a_id}/credit-review"
              payload: { credit_rating: "A", review_note: "Covenant cured; reinstated." }
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
          assert:
            - "Counterparty.${cp_a_id}.status == SUSPENDED after the BB review"
            - "the first execute returns 409 with error_id ERR_COUNTERPARTY_NOT_APPROVED"
            - "HedgeInstrument.${inst_id}.trade_status == PROPOSED and HedgeProgram.${prog_id}.status == ACTIVE after the rejection: neither path row was at fault"
            - "Counterparty.${cp_a_id}.status == APPROVED after the A review and last_review_note == \"Covenant cured; reinstated.\""
            - "the second execute returns 200: HedgeInstrument.${inst_id}.trade_status == EXECUTED and margin_requirement_usd == 120000.00"
            - "HedgeProgram.${prog_id}.coverage_pct_delta == 18.18 and Counterparty.${cp_a_id}.utilization_pct == 12.00"

      - name: directive_approve_blocked_by_short_origin_station
        grounds:
          - validations[priority=25]
          - calculations.station_supply_posture
          - entities.Station.fields.supply_posture
          - errors.ERR_STATION_INVENTORY_SHORT
        distinguishing_aspect: |
          The directive is PROPOSED, its uplift of 3000 gallons is inside the 10600.00 cap
          and its economics are positive, yet approval fails because the origin Station -
          a row reached only through the FlightLeg - has days_cover 2.50 and
          supply_posture SHORT. A single inventory adjustment on that third row, with no
          change to the directive, makes the same approval succeed and pins the prices.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z."
            - "Station ORD with into_plane_fee 0.0450, avg_daily_liftings_gallons 100000, one ACTIVE contract at 2.4000 + 0.0250, and only 250000 gallons of stock (days_cover 2.50, SHORT)."
            - "Station DFW with into_plane_fee 0.0800 and one ACTIVE contract at 2.9000 + 0.1200."
            - "One NARROWBODY FlightLeg ORD-DFW with uplift_cap_gallons 10600.00 and a PROPOSED directive for 3000 gallons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CE2", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { dfw_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${dfw_id}/supply-contracts"
              payload: { contract_ref: "DFW-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 250000, reason: "Thin opening stock" }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "UA500", departure_date: "2027-02-18", origin_station_id: "${ord_id}", destination_station_id: "${dfw_id}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 14500, tank_capacity_gallons: 26000, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 128000, max_landing_weight_lbs: 200000 }
              as: FuelOpsController
              captures: { leg_id: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_id}/tankering-directives"
              payload: { requested_uplift_gallons: 3000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_id: $.data.id }
          trigger:
            - call: "POST /fuel/tankering-directives/${dir_id}/approve"
              payload: {}
              as: FuelOpsController
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 250000, reason: "Resupply barge received" }
              as: FuelOpsController
            - call: "POST /fuel/tankering-directives/${dir_id}/approve"
              payload: {}
              as: FuelOpsController
          assert:
            - "before the trigger: Station.${ord_id}.days_cover == 2.50 and supply_posture == SHORT, while TankeringDirective.${dir_id}.planned_net_savings_usd == 978.82 is positive and 3000 is under the 10600.00 cap"
