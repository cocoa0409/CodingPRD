# =============================================================================
# SCAFFOLD — task_2454_managed_document_review_staffing
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2454. Managed Document Review Staffing (managed review services provider): matter intake with document volume, timeline and review complexity assessment, reviewer sourcing with bar admission requirements, subject matter and language skills, conflicts screening and confidentiality agreement execution for every reviewer, review protocol development with issue coding, privilege criteria and quality control sampling plans, batch assignment, pace and accuracy metrics with reviewer scorecards and removal thresholds, quality control layers including second-level review, privilege log preparation and sampling validation, secure review environment with access controls and remote work restrictions, budget tracking against per-document and hourly pricing

domain_name: managed-document-review-staffing
api_prefix: ""           # peer top-level collections: /matters, /reviewers, /batches, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: ConflictsScreening / ConfidentialityAgreement / SecureEnvironmentSession /
  # Assignment are junction entities over (Reviewer × Matter) and (Reviewer × Batch);
  # Assignment.reassigned_from_assignment_id is self-referential. No nesting in URL
  # paths beyond one level; every entity is addressable as a peer collection.

  state_machine_shape: parallel
  # Reviewer carries two INDEPENDENT state axes (credential_status × engagement_status).
  # Additionally: ReviewProtocol is cyclic (DRAFT -> CLIENT_REVIEW -> DRAFT),
  # Assignment is cyclic (SUBMITTED -> REOPENED -> IN_PROGRESS -> SUBMITTED),
  # Batch forks on protocol.second_level_required with divergent side-effect sets,
  # Matter is compound (status derives from batch/staffing aggregates).

  relationship_patterns:
    - one_to_many          # Matter -> Batch, Batch -> Assignment, Batch -> PrivilegeLogEntry
    - many_to_many         # Reviewer <-> Matter via ConflictsScreening / ConfidentialityAgreement / SecureEnvironmentSession
    - self_referential     # Assignment.reassigned_from_assignment_id -> Assignment.id
    - cross_aggregate      # QCSample.validated_by_reviewer_id crosses the Batch aggregate into Reviewer

  role_model: segregation_of_duties
  # A reviewer may never second-level-review or QC-validate a batch they coded;
  # protocol approval and conflicts waivers belong exclusively to the client side;
  # sampling/validation belongs exclusively to QCLead.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered name of the client organisation instructing the review
        constraints: 1..200 chars, non-blank
      - name: primary_state
        type: string
        source: input
        description: two-letter US state code of the client's principal office
        constraints: exactly 2 uppercase letters
      - name: matter_count
        type: integer
        source: computed
        description: count of Matter rows whose client_id equals this Client.id (all statuses)
        default: 0

  - name: Matter
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the instructing client; a ClientCounsel caller's X-User-ID MUST equal this value
      - name: name
        type: string
        source: input
        description: matter caption used on invoices and privilege logs
        constraints: 1..200 chars, non-blank
      - name: document_count
        type: integer
        source: input
        description: total documents in the collection to be reviewed
        constraints: integer >= 1
      - name: unbatched_document_count
        type: integer
        source: computed
        description: document_count minus the sum of Batch.document_count over Batch rows of this matter whose status != DISSOLVED
      - name: deadline_utc
        type: datetime
        source: input
        description: contractual completion instant for the whole review (ISO 8601 UTC)
      - name: complexity_tier
        type: enum
        source: input
        description: review complexity assessed at intake; drives the per-document tier multiplier
        constraints: one of SIMPLE, STANDARD, COMPLEX
      - name: required_languages
        type: array
        source: input
        description: language codes a first-pass reviewer must cover; every reviewer's languages must be a superset
        constraints: non-empty array of 2-letter uppercase codes, MUST contain "EN", no duplicates
      - name: required_bar_states
        type: array
        source: input
        description: state bar admissions every assigned reviewer must hold
        constraints: array of exactly-2-uppercase-letter codes, no duplicates, may be empty
      - name: subject_matter_tags
        type: array
        source: input
        description: subject-matter competencies desired for this matter; feeds the selector's subject_match_ratio
        constraints: array of UPPER_SNAKE tags, no duplicates, may be empty
      - name: pricing_model
        type: enum
        source: input
        description: billing basis for reviewer time on this matter
        constraints: one of PER_DOCUMENT, HOURLY
      - name: per_document_rate_cents
        type: integer
        source: input
        description: contracted base rate per document in cents; REQUIRED when pricing_model == PER_DOCUMENT, MUST be omitted or null otherwise
        constraints: integer >= 1 when present
      - name: hourly_rate_cents
        type: integer
        source: input
        description: contracted hourly rate in cents; REQUIRED when pricing_model == HOURLY, MUST be omitted or null otherwise
        constraints: integer >= 1 when present
      - name: budget_cap_cents
        type: integer
        source: input
        description: hard budget ceiling; new commitments may reach it exactly but never exceed it
        constraints: integer >= 1
      - name: min_staffed_reviewers
        type: integer
        source: input
        description: minimum count of cleared-and-covered reviewers required before batch assignment may begin
        default: 2
        constraints: integer >= 1
      - name: onsite_seat_count
        type: integer
        source: input
        description: number of ONSITE_SECURE workstations the provider holds for this matter (aggregate seat capacity)
        default: 1
        constraints: integer >= 0
      - name: remote_work_permitted
        type: boolean
        source: input
        description: whether the client permits REMOTE_VDI sessions at all on this matter
        default: false
      - name: status
        type: enum
        source: system
        description: matter lifecycle state
        default: INTAKE
        constraints: one of INTAKE, PROTOCOL_PENDING, STAFFING, IN_REVIEW, QC_CLOSEOUT, CLOSED, SUSPENDED
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded by the last suspension; null when the matter has never been suspended
        default: null
      - name: staffed_reviewer_count
        type: integer
        source: computed
        description: count of DISTINCT Reviewer rows that have (a) a ConflictsScreening on this matter with status == CLEARED, (b) a ConfidentialityAgreement on this matter with status == EXECUTED, (c) credential_status == VERIFIED, and (d) engagement_status != REMOVED
      - name: committed_spend_cents
        type: integer
        source: computed
        description: LEDGER_REPLAY_BASIS total — running sum of BudgetLedgerEntry.amount_cents for this matter in created_at ASC order
      - name: required_pace_dph
        type: number
        source: computed
        description: documents-per-hour the remaining collection needs to hit deadline_utc; see calculations.matter_required_pace_dph

  - name: ReviewProtocol
    parent: Matter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: FK -> Matter.id; the matter this protocol revision governs
      - name: revision_number
        type: integer
        source: system
        description: 1-based revision index within the matter, assigned in created_at ASC order
        default: 1
      - name: issue_codes
        type: array
        source: input
        description: issue-coding vocabulary reviewers must apply
        constraints: non-empty array of UPPER_SNAKE tags, no duplicates
      - name: privilege_criteria
        type: array
        source: input
        description: privilege bases in scope for this matter; PrivilegeLogEntry.privilege_basis MUST be a member
        constraints: non-empty subset of {ATTORNEY_CLIENT, WORK_PRODUCT, COMMON_INTEREST}, no duplicates
      - name: qc_sample_pct
        type: number
        source: input
        description: fraction of each batch drawn into the QC sample
        constraints: number in [0.01, 1.00], at most 4 decimals
      - name: privilege_sample_pct
        type: number
        source: input
        description: fraction of a batch's privilege log entries that must be QC-validated before release
        constraints: number in [0.01, 1.00], at most 4 decimals
      - name: max_discrepancy_pct
        type: number
        source: input
        description: QC sample discrepancy rate at or above which the sample FAILS (inclusive threshold)
        constraints: number in [0.001, 0.500], at most 4 decimals
      - name: min_pace_dph
        type: integer
        source: input
        description: minimum acceptable documents-per-hour for a first-pass assignment; strictly-lower pace scores a PACE_SHORTFALL strike
        constraints: integer >= 1
      - name: second_level_required
        type: boolean
        source: input
        description: whether every batch must pass second-level review before QC sampling
        default: true
      - name: status
        type: enum
        source: system
        description: protocol revision state
        default: DRAFT
        constraints: one of DRAFT, CLIENT_REVIEW, APPROVED, SUPERSEDED
      - name: change_notes
        type: string
        source: system
        description: note supplied with the most recent client REQUEST_CHANGES decision; null until one occurs
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of client approval; null until APPROVED
        default: null

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: reviewer's name as it appears on the confidentiality agreement
        constraints: 1..120 chars, non-blank
      - name: bar_admissions
        type: array
        source: input
        description: state bar codes the reviewer is admitted in, as attested at sourcing and re-attested on credential verification
        constraints: array of exactly-2-uppercase-letter codes, no duplicates, may be empty
      - name: languages
        type: array
        source: input
        description: language codes the reviewer can code documents in
        constraints: non-empty array of 2-letter uppercase codes, MUST contain "EN", no duplicates
      - name: subject_matter_tags
        type: array
        source: input
        description: subject-matter competencies claimed by the reviewer; feeds the selector's subject_match_ratio
        constraints: array of UPPER_SNAKE tags, no duplicates, may be empty
      - name: tier
        type: enum
        source: input
        description: review layer the reviewer is qualified for; pass_type of an Assignment must match
        constraints: one of FIRST_PASS, SECOND_LEVEL
      - name: hourly_cost_cents
        type: integer
        source: input
        description: provider's cost per hour for this reviewer; third tie-break of the selector (ASC)
        constraints: integer >= 1
      - name: max_concurrent_batches
        type: integer
        source: input
        description: maximum count of Assignment rows in {ASSIGNED, IN_PROGRESS, REOPENED} this reviewer may hold at once
        default: 2
        constraints: integer >= 1
      - name: remote_work_authorized
        type: boolean
        source: input
        description: whether this reviewer's home setup has passed the provider's remote-work inspection
        default: false
      - name: credential_status
        type: enum
        source: system
        description: FIRST state axis — bar/credential standing; evolves independently of engagement_status
        default: UNVERIFIED
        constraints: one of UNVERIFIED, VERIFIED, LAPSED
      - name: engagement_status
        type: enum
        source: system
        description: SECOND state axis — staffing standing; evolves independently of credential_status
        default: SOURCED
        constraints: one of SOURCED, CLEARED, ENGAGED, REMOVED
      - name: scorecard_strikes
        type: integer
        source: computed
        description: floor-at-zero running sum of ScorecardEvent.strike_delta for this reviewer in created_at ASC order
        default: 0
      - name: accuracy_score
        type: number
        source: computed
        description: SAMPLE_WEIGHTED accuracy variant (4 decimals); 1.0000 when the reviewer has no QC-sampled documents
        default: 1.0
      - name: pace_dph
        type: number
        source: computed
        description: documents per hour across this reviewer's Assignment rows in {SUBMITTED, COMPLETED} (2 decimals); 0.00 when none
        default: 0
      - name: active_assignment_count
        type: integer
        source: computed
        description: count of Assignment rows for this reviewer with status in {ASSIGNED, IN_PROGRESS, REOPENED}
        default: 0
      - name: removed_at
        type: datetime
        source: system
        description: logical-clock instant engagement_status became REMOVED; null otherwise
        default: null

  - name: ConflictsScreening
    parent: null
    common_fields: true
    fields:
      - name: reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; the reviewer being screened
      - name: matter_id
        type: string
        source: input
        description: FK -> Matter.id; the matter screened against
      - name: declared_adverse_parties
        type: array
        source: input
        description: adverse parties the reviewer disclosed at screening intake
        constraints: array of 1..200-char strings, no duplicates, may be empty
      - name: status
        type: enum
        source: system
        description: screening outcome state
        default: PENDING
        constraints: one of PENDING, CLEARED, WAIVER_REQUIRED, BLOCKED
      - name: decision_note
        type: string
        source: system
        description: note recorded with the most recent decision or waiver ruling
        default: null
      - name: screened_at
        type: datetime
        source: system
        description: logical-clock instant of the first non-PENDING decision
        default: null
      - name: waiver_granted
        type: boolean
        source: system
        description: true only when a ClientCounsel waiver moved this row WAIVER_REQUIRED -> CLEARED
        default: false

  - name: ConfidentialityAgreement
    parent: null
    common_fields: true
    fields:
      - name: reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; the signing reviewer
      - name: matter_id
        type: string
        source: input
        description: FK -> Matter.id; the matter whose confidential material the agreement covers
      - name: coverage_start_utc
        type: datetime
        source: input
        description: first instant of the CLOSED coverage interval [coverage_start_utc, coverage_end_utc]
      - name: coverage_end_utc
        type: datetime
        source: input
        description: last instant of the CLOSED coverage interval; MUST be strictly after coverage_start_utc
      - name: remote_work_addendum
        type: boolean
        source: input
        description: whether the executed paper includes the remote-work addendum required for REMOTE_VDI sessions
        default: false
      - name: status
        type: enum
        source: system
        description: agreement state
        default: PENDING
        constraints: one of PENDING, EXECUTED, REVOKED, EXPIRED
      - name: executed_at
        type: datetime
        source: system
        description: logical-clock instant the reviewer signed; null until EXECUTED
        default: null
      - name: signature_name
        type: string
        source: system
        description: name typed by the reviewer at execution
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: reason recorded when the agreement was REVOKED
        default: null

  - name: SecureEnvironmentSession
    parent: null
    common_fields: true
    fields:
      - name: reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; the reviewer granted environment access
      - name: matter_id
        type: string
        source: input
        description: FK -> Matter.id; the matter whose review environment is being accessed
      - name: workstation_class
        type: enum
        source: input
        description: access channel; REMOTE_VDI is gated by three independent remote-work flags
        constraints: one of ONSITE_SECURE, REMOTE_VDI
      - name: starts_at_utc
        type: datetime
        source: input
        description: first instant of the HALF-OPEN occupancy interval [starts_at_utc, ends_at_utc)
      - name: ends_at_utc
        type: datetime
        source: input
        description: exclusive end of the HALF-OPEN occupancy interval; MUST be strictly after starts_at_utc
      - name: status
        type: enum
        source: system
        description: session state
        default: SCHEDULED
        constraints: one of SCHEDULED, ACTIVE, CLOSED, REVOKED
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of activation; null until ACTIVE
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant of close or revocation
        default: null

  - name: Batch
    parent: Matter
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: FK -> Matter.id; the matter the documents belong to
      - name: batch_number
        type: integer
        source: system
        description: 1-based index within the matter, assigned in Batch.created_at ASC order (DISSOLVED rows keep their number)
      - name: document_count
        type: integer
        source: input
        description: documents carved out of the matter's unbatched pool into this batch
        constraints: integer >= 1
      - name: priority_rank
        type: integer
        source: input
        description: operator-declared urgency, 1 = most urgent; ties broken by batch_number ASC
        default: 5
        constraints: integer in [1, 9]
      - name: status
        type: enum
        source: system
        description: batch lifecycle state
        default: CREATED
        constraints: one of CREATED, ASSIGNED, IN_PROGRESS, SECOND_LEVEL, QC_SAMPLING, QC_PASSED, QC_FAILED, RELEASED, DISSOLVED
      - name: privilege_entry_count
        type: integer
        source: computed
        description: count of ALL PrivilegeLogEntry rows whose batch_id equals this Batch.id, regardless of status
        default: 0
      - name: qc_sample_target_size
        type: integer
        source: computed
        description: max(QC_MIN_SAMPLE_DOCS, ceil(document_count * protocol.qc_sample_pct)) using the matter's APPROVED protocol; see calculations.qc_sample_evaluation
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the batch reached RELEASED
        default: null

  - name: Assignment
    parent: Batch
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: FK -> Batch.id; the batch of documents to be coded
      - name: reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; the reviewer performing this pass
      - name: reassigned_from_assignment_id
        type: string
        source: system
        description: FK -> Assignment.id; set by the server to the id of the active same-pass Assignment this row superseded; null when nothing was superseded
        default: null
      - name: pass_type
        type: enum
        source: input
        description: review layer this assignment covers; MUST equal the reviewer's tier
        constraints: one of FIRST_PASS, SECOND_LEVEL
      - name: status
        type: enum
        source: system
        description: assignment state; SUBMITTED -> REOPENED -> IN_PROGRESS -> SUBMITTED is a legal cycle
        default: ASSIGNED
        constraints: one of ASSIGNED, IN_PROGRESS, SUBMITTED, REOPENED, COMPLETED, VOIDED
      - name: documents_coded
        type: integer
        source: system
        description: cumulative documents coded, advanced only by POST /assignments/{id}/progress
        default: 0
      - name: minutes_logged
        type: integer
        source: system
        description: cumulative minutes logged, advanced only by POST /assignments/{id}/progress
        default: 0
      - name: privilege_hits_logged
        type: integer
        source: system
        description: cumulative privilege hits declared through progress calls; must equal the reviewer's PrivilegeLogEntry count on this batch at submit
        default: 0
      - name: billable_minutes
        type: integer
        source: computed
        description: minutes_logged rounded UP to the next whole HOURLY_INCREMENT_MINUTES block at submit; equals minutes_logged when it is already a multiple of the increment; 0 before the first submit and 0 when matter.pricing_model == PER_DOCUMENT
        default: 0
      - name: effective_per_document_cents
        type: integer
        source: computed
        description: whole-cent per-document rate pinned at creation from matter/reviewer/pass_type; 0 when matter.pricing_model == HOURLY
      - name: committed_amount_cents
        type: integer
        source: computed
        description: amount of the COMMITMENT BudgetLedgerEntry written at creation; see calculations.assignment_commitment_amount
      - name: billable_amount_cents
        type: integer
        source: computed
        description: amount of the ACTUAL_* BudgetLedgerEntry written at first submit; 0 before the first submit; never re-billed on a REOPENED cycle
        default: 0
      - name: pace_dph
        type: number
        source: computed
        description: round_half_up(documents_coded / (minutes_logged / 60), 2); 0.00 when minutes_logged == 0
        default: 0
      - name: accuracy_pct
        type: number
        source: computed
        description: 4-decimal accuracy from this assignment's batch QCSample rows with outcome in {PASSED, FAILED}; 1.0000 when none exist
        default: 1.0
      - name: started_at
        type: datetime
        source: system
        description: logical-clock instant of the first ASSIGNED/REOPENED -> IN_PROGRESS transition
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submit
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant the row became VOIDED
        default: null
      - name: void_reason
        type: string
        source: system
        description: reason recorded on void (operator reason, SUPERSEDED_BY_REASSIGNMENT, REVIEWER_REMOVED or CONFLICTS_BLOCKED)
        default: null

  - name: QCSample
    parent: Batch
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: FK -> Batch.id; the batch sampled
      - name: validated_by_reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; the reviewer who performed the sampling read; MUST NOT hold any non-VOIDED Assignment on this batch
      - name: sampled_document_count
        type: integer
        source: computed
        description: frozen copy of Batch.qc_sample_target_size at draw time
      - name: coding_error_count
        type: integer
        source: system
        description: issue-coding discrepancies found in the sample, recorded at validation
        default: 0
      - name: privilege_error_count
        type: integer
        source: system
        description: privilege-call discrepancies found in the sample, recorded at validation
        default: 0
      - name: discrepancy_rate
        type: number
        source: computed
        description: round_half_up((coding_error_count + privilege_error_count) / sampled_document_count, 4); 0.0000 while PENDING
        default: 0
      - name: outcome
        type: enum
        source: system
        description: sample verdict
        default: PENDING
        constraints: one of PENDING, PASSED, FAILED
      - name: validated_at
        type: datetime
        source: system
        description: logical-clock instant of validation; null while PENDING
        default: null

  - name: PrivilegeLogEntry
    parent: Batch
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: FK -> Matter.id; denormalised matter reference for client-facing log export
      - name: batch_id
        type: string
        source: input
        description: FK -> Batch.id; the batch the withheld/redacted document came from
      - name: authored_by_reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; the reviewer who logged the privilege call
      - name: document_ref
        type: string
        source: input
        description: control number of the withheld or redacted document; unique within the batch
        constraints: 1..64 chars, non-blank
      - name: privilege_basis
        type: enum
        source: input
        description: asserted basis; MUST be a member of the matter's APPROVED protocol.privilege_criteria
        constraints: one of ATTORNEY_CLIENT, WORK_PRODUCT, COMMON_INTEREST
      - name: disposition
        type: enum
        source: input
        description: how the document leaves the production
        constraints: one of WITHHELD, REDACTED
      - name: status
        type: enum
        source: system
        description: entry state; CHALLENGED -> DRAFT (amend) is a legal cycle
        default: DRAFT
        constraints: one of DRAFT, VALIDATED, CHALLENGED, FINAL
      - name: challenge_note
        type: string
        source: system
        description: QC note recorded when the entry was CHALLENGED
        default: null
      - name: validated_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent VALIDATED decision
        default: null

  - name: ScorecardEvent
    parent: Reviewer
    common_fields: false
    fields:
      - name: reviewer_id
        type: string
        source: input
        description: FK -> Reviewer.id; the reviewer the event scores
      - name: event_type
        type: enum
        source: system
        description: what the system observed
        constraints: one of PACE_SHORTFALL, ACCURACY_MISS, PRIVILEGE_MISS, QC_FAILURE, REMOVAL, CLEARED_STRIKE
      - name: strike_delta
        type: integer
        source: system
        description: signed strike movement — +1 for PACE_SHORTFALL / ACCURACY_MISS / PRIVILEGE_MISS / QC_FAILURE, -1 for CLEARED_STRIKE, 0 for REMOVAL
      - name: note
        type: string
        source: system
        description: human-readable cause, always naming the triggering Batch.batch_number or Assignment
      - name: source_batch_number
        type: integer
        source: system
        description: batch_number of the Batch whose event this was; null for REMOVAL events
        default: null

  - name: BudgetLedgerEntry
    parent: Matter
    common_fields: false
    fields:
      - name: matter_id
        type: string
        source: input
        description: FK -> Matter.id; the matter whose budget this row moves
      - name: assignment_id
        type: string
        source: input
        description: FK -> Assignment.id; the assignment that caused the movement
      - name: entry_type
        type: enum
        source: system
        description: movement kind
        constraints: one of COMMITMENT, REVERSAL, ACTUAL_PER_DOCUMENT, ACTUAL_HOURLY
      - name: amount_cents
        type: integer
        source: system
        description: signed cents; REVERSAL rows are strictly negative, all other kinds strictly positive
      - name: description
        type: string
        source: system
        description: audit text naming the entry kind and the assignment's batch_number
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Matter
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: PROTOCOL_PENDING
        trigger: "POST /matters/{id}/protocols (revision 1)"
        actor: EngagementManager
        preconditions:
          - "matter.status == INTAKE"
          - "expected_matter_version == matter.version"
        side_effects:
          - "creates ReviewProtocol revision_number 1 in DRAFT"
          - "increments Matter.version by 1"

      - from: STAFFING
        to: PROTOCOL_PENDING
        trigger: "POST /matters/{id}/protocols (revision >= 2, supersede)"
        actor: EngagementManager
        preconditions:
          - "matter.status in {STAFFING, IN_REVIEW}"
          - "expected_matter_version == matter.version"
        side_effects:
          - "the current APPROVED ReviewProtocol becomes SUPERSEDED"
          - "creates ReviewProtocol revision_number = prior max + 1 in DRAFT"
          - "increments Matter.version by 1"
        note: "IN_REVIEW -> PROTOCOL_PENDING is the same transition with from: IN_REVIEW; existing Assignment rows are untouched but no NEW assignment may be created until a protocol is APPROVED again."

      - from: IN_REVIEW
        to: PROTOCOL_PENDING
        trigger: "POST /matters/{id}/protocols (revision >= 2, supersede)"
        actor: EngagementManager
        preconditions:
          - "matter.status == IN_REVIEW"
          - "expected_matter_version == matter.version"
        side_effects:
          - "the current APPROVED ReviewProtocol becomes SUPERSEDED"
          - "creates ReviewProtocol revision_number = prior max + 1 in DRAFT"
          - "increments Matter.version by 1"

      - from: PROTOCOL_PENDING
        to: STAFFING
        trigger: "POST /protocols/{id}/client-decision with decision == APPROVE (system cascade)"
        actor: system
        preconditions:
          - "the decided protocol belongs to this matter and reaches APPROVED"
        side_effects:
          - "recomputes Matter.staffed_reviewer_count"
          - "when staffed_reviewer_count >= min_staffed_reviewers, continues immediately to IN_REVIEW (see next transition)"
          - "increments Matter.version by 1"

      - from: STAFFING
        to: IN_REVIEW
        trigger: "system — recomputation of staffed_reviewer_count after POST /confidentiality-agreements/{id}/execute, POST /conflicts-screenings/{id}/decision, POST /conflicts-screenings/{id}/waiver, POST /reviewers/{id}/credential-status or protocol approval"
        actor: system
        preconditions:
          - "matter has exactly one ReviewProtocol with status == APPROVED"
          - "staffed_reviewer_count >= min_staffed_reviewers"
        side_effects:
          - "increments Matter.version by 1"
        note: "This is the only gate that opens batch assignment; while STAFFING, POST /batches/{id}/assignments fails with ERR_MIN_STAFFING_UNMET."

      - from: IN_REVIEW
        to: STAFFING
        trigger: "system — recomputation of staffed_reviewer_count after a screening BLOCK, agreement revocation/expiry or credential lapse"
        actor: system
        preconditions:
          - "staffed_reviewer_count < min_staffed_reviewers"
        side_effects:
          - "increments Matter.version by 1"
        note: "Cyclic: STAFFING <-> IN_REVIEW may repeat any number of times."

      - from: IN_REVIEW
        to: QC_CLOSEOUT
        trigger: "POST /batches/{id}/release (system cascade)"
        actor: system
        preconditions:
          - "every Batch of the matter has status in {RELEASED, DISSOLVED}"
          - "matter.unbatched_document_count == 0"
        side_effects:
          - "increments Matter.version by 1"

      - from: QC_CLOSEOUT
        to: IN_REVIEW
        trigger: "POST /matters/{id}/batches (a new batch is carved after closeout began)"
        actor: EngagementManager
        preconditions:
          - "matter.status == QC_CLOSEOUT"
          - "matter.unbatched_document_count >= requested document_count"
        side_effects:
          - "creates the Batch in CREATED"
          - "decrements Matter.unbatched_document_count by the batch's document_count"
          - "increments Matter.version by 1"

      - from: QC_CLOSEOUT
        to: CLOSED
        trigger: "POST /matters/{id}/close"
        actor: EngagementManager
        preconditions:
          - "matter.status == QC_CLOSEOUT"
          - "every Batch has status in {RELEASED, DISSOLVED}"
          - "matter.unbatched_document_count == 0"
          - "no PrivilegeLogEntry of the matter has status in {DRAFT, CHALLENGED, VALIDATED} (all are FINAL)"
        side_effects:
          - "all Assignment rows of the matter in status SUBMITTED become COMPLETED"
          - "increments Matter.version by 1"

      - from: STAFFING
        to: SUSPENDED
        trigger: "POST /matters/{id}/suspension with suspended == true"
        actor: EngagementManager
        preconditions:
          - "matter.status in {STAFFING, IN_REVIEW, QC_CLOSEOUT}"
        side_effects:
          - "records suspension_reason"
          - "every SecureEnvironmentSession of the matter with status in {SCHEDULED, ACTIVE} becomes REVOKED (closed_at stamped)"
          - "increments Matter.version by 1"
        note: "IN_REVIEW -> SUSPENDED and QC_CLOSEOUT -> SUSPENDED are the same transition from those states."

      - from: IN_REVIEW
        to: SUSPENDED
        trigger: "POST /matters/{id}/suspension with suspended == true"
        actor: EngagementManager
        preconditions:
          - "matter.status == IN_REVIEW"
        side_effects:
          - "records suspension_reason"
          - "every SecureEnvironmentSession of the matter with status in {SCHEDULED, ACTIVE} becomes REVOKED (closed_at stamped)"
          - "increments Matter.version by 1"

      - from: SUSPENDED
        to: STAFFING
        trigger: "POST /matters/{id}/suspension with suspended == false"
        actor: EngagementManager
        preconditions:
          - "matter.status == SUSPENDED"
        side_effects:
          - "clears suspension_reason to null"
          - "recomputes staffed_reviewer_count; when >= min_staffed_reviewers the matter continues immediately to IN_REVIEW"
          - "increments Matter.version by 1"
        note: "Revoked sessions are NOT restored; the reviewer must schedule a new session."

  # ---------------------------------------------------------------------------
  - entity: ReviewProtocol
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CLIENT_REVIEW
        trigger: "POST /protocols/{id}/submit"
        actor: EngagementManager
        preconditions:
          - "protocol.status == DRAFT"
          - "matter.status != SUSPENDED"
        side_effects:
          - "increments ReviewProtocol.version by 1"

      - from: CLIENT_REVIEW
        to: DRAFT
        trigger: "POST /protocols/{id}/client-decision with decision == REQUEST_CHANGES"
        actor: ClientCounsel
        preconditions:
          - "protocol.status == CLIENT_REVIEW"
          - "X-User-ID == matter.client_id"
          - "change_notes supplied and non-blank"
        side_effects:
          - "stores change_notes"
          - "increments ReviewProtocol.version by 1"
        note: "CYCLE — DRAFT -> CLIENT_REVIEW -> DRAFT may repeat without bound; revision_number does NOT change (only a new POST /matters/{id}/protocols mints a revision)."

      - from: CLIENT_REVIEW
        to: APPROVED
        trigger: "POST /protocols/{id}/client-decision with decision == APPROVE"
        actor: ClientCounsel
        preconditions:
          - "protocol.status == CLIENT_REVIEW"
          - "X-User-ID == matter.client_id"
        side_effects:
          - "stamps approved_at from the logical clock"
          - "Matter PROTOCOL_PENDING -> STAFFING (and onward to IN_REVIEW when staffed_reviewer_count >= min_staffed_reviewers)"
          - "increments ReviewProtocol.version by 1"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /matters/{id}/protocols (a later revision is minted)"
        actor: system
        preconditions:
          - "protocol.status == APPROVED"
        side_effects:
          - "increments ReviewProtocol.version by 1"

      - from: CLIENT_REVIEW
        to: SUPERSEDED
        trigger: "POST /matters/{id}/protocols (a later revision is minted)"
        actor: system
        preconditions:
          - "protocol.status == CLIENT_REVIEW"
        side_effects:
          - "increments ReviewProtocol.version by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /matters/{id}/protocols (a later revision is minted)"
        actor: system
        preconditions:
          - "protocol.status == DRAFT"
        side_effects:
          - "increments ReviewProtocol.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Reviewer
    initial_state: UNVERIFIED
    terminal_states: [REMOVED]
    transitions:
      # ---- AXIS 1: credential_status (UNVERIFIED / VERIFIED / LAPSED) --------
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /reviewers/{id}/credential-status with to_status == VERIFIED"
        actor: StaffingCoordinator
        preconditions:
          - "reviewer.credential_status in {UNVERIFIED, LAPSED}"
          - "reviewer.engagement_status != REMOVED"
        side_effects:
          - "replaces bar_admissions when the payload supplies it"
          - "recomputes Matter.staffed_reviewer_count for every matter where this reviewer has a CLEARED ConflictsScreening; a matter in STAFFING that reaches min_staffed_reviewers advances to IN_REVIEW"
          - "increments Reviewer.version by 1"
        note: "AXIS 1 ONLY — engagement_status is never touched by this transition."

      - from: VERIFIED
        to: LAPSED
        trigger: "POST /reviewers/{id}/credential-status with to_status == LAPSED"
        actor: StaffingCoordinator
        preconditions:
          - "reviewer.credential_status == VERIFIED"
        side_effects:
          - "recomputes Matter.staffed_reviewer_count for every matter where this reviewer has a CLEARED ConflictsScreening; a matter in IN_REVIEW that falls below min_staffed_reviewers reverts to STAFFING"
          - "increments Reviewer.version by 1"
        note: "AXIS 1 ONLY — existing Assignment rows keep their status and engagement_status is unchanged; only NEW assignments are blocked (ERR_CREDENTIAL_NOT_VERIFIED)."

      - from: LAPSED
        to: VERIFIED
        trigger: "POST /reviewers/{id}/credential-status with to_status == VERIFIED"
        actor: StaffingCoordinator
        preconditions:
          - "reviewer.credential_status == LAPSED"
          - "reviewer.engagement_status != REMOVED"
        side_effects:
          - "recomputes Matter.staffed_reviewer_count as above"
          - "increments Reviewer.version by 1"
        note: "CYCLE on axis 1: VERIFIED -> LAPSED -> VERIFIED may repeat."

      # ---- AXIS 2: engagement_status (SOURCED / CLEARED / ENGAGED / REMOVED)
      - from: SOURCED
        to: CLEARED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == CLEARED, or POST /conflicts-screenings/{id}/waiver with granted == true (system cascade)"
        actor: system
        preconditions:
          - "reviewer.engagement_status == SOURCED"
          - "the screening reaches CLEARED"
        side_effects:
          - "increments Reviewer.version by 1"
        note: "AXIS 2 ONLY — credential_status is untouched, so a CLEARED reviewer may still be UNVERIFIED."

      - from: CLEARED
        to: ENGAGED
        trigger: "POST /batches/{id}/assignments or POST /batches/{id}/auto-assign (system cascade)"
        actor: system
        preconditions:
          - "reviewer.engagement_status == CLEARED"
          - "an Assignment row for this reviewer is created"
        side_effects:
          - "increments Reviewer.version by 1"

      - from: ENGAGED
        to: SOURCED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == BLOCKED (system cascade)"
        actor: system
        preconditions:
          - "after the cascade the reviewer has ZERO (ConflictsScreening.status == CLEARED AND ConfidentialityAgreement.status == EXECUTED) matter pairs"
        side_effects:
          - "increments Reviewer.version by 1"
        note: "CYCLE on axis 2: SOURCED -> CLEARED -> ENGAGED -> SOURCED. CLEARED -> SOURCED is the same transition from CLEARED."

      - from: CLEARED
        to: SOURCED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == BLOCKED (system cascade)"
        actor: system
        preconditions:
          - "after the cascade the reviewer has ZERO (CLEARED screening AND EXECUTED agreement) matter pairs"
        side_effects:
          - "increments Reviewer.version by 1"

      - from: ENGAGED
        to: REMOVED
        trigger: "system — removal evaluation after any ScorecardEvent is appended (see calculations.reviewer_scorecard_strikes)"
        actor: system
        preconditions:
          - "scorecard_strikes >= REMOVAL_STRIKE_THRESHOLD (3) OR (accuracy_score < 0.9000 AND total QC-sampled documents >= 50)"
        side_effects:
          - "appends ScorecardEvent(event_type REMOVAL, strike_delta 0)"
          - "stamps removed_at from the logical clock"
          - "CASCADE LINK: every Assignment of this reviewer with status in {ASSIGNED, IN_PROGRESS, REOPENED} becomes VOIDED (void_reason REVIEWER_REMOVED) in Assignment.created_at ASC order"
          - "CASCADE LINK: each voided Assignment appends a REVERSAL BudgetLedgerEntry of -committed_amount_cents (appended only for an assignment whose billable_amount_cents == 0; a billed assignment keeps its ACTUAL_* row and is not reversed twice) and each Batch whose status is ASSIGNED or IN_PROGRESS returns to CREATED"
          - "CASCADE LINK: Matter.committed_spend_cents and Matter.staffed_reviewer_count are recomputed for every affected matter; a matter in IN_REVIEW that falls below min_staffed_reviewers reverts to STAFFING"
          - "increments Reviewer.version by 1"
        note: "AXIS 2 terminal. CLEARED -> REMOVED is the same transition from CLEARED."

      - from: CLEARED
        to: REMOVED
        trigger: "system — removal evaluation after any ScorecardEvent is appended"
        actor: system
        preconditions:
          - "scorecard_strikes >= 3 OR (accuracy_score < 0.9000 AND total QC-sampled documents >= 50)"
        side_effects:
          - "same cascade as ENGAGED -> REMOVED"
          - "increments Reviewer.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ConflictsScreening
    initial_state: PENDING
    terminal_states: [BLOCKED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == CLEARED"
        actor: StaffingCoordinator
        preconditions:
          - "screening.status == PENDING"
          - "matter.status != SUSPENDED"
          - "declared_adverse_parties shares no element with the matter's Client.legal_name"
        side_effects:
          - "stamps screened_at, stores decision_note"
          - "Reviewer SOURCED -> CLEARED (axis 2)"
          - "recomputes Matter.staffed_reviewer_count (STAFFING -> IN_REVIEW when the minimum is reached)"
          - "increments ConflictsScreening.version by 1"

      - from: PENDING
        to: WAIVER_REQUIRED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == WAIVER_REQUIRED"
        actor: StaffingCoordinator
        preconditions:
          - "screening.status == PENDING"
          - "matter.status != SUSPENDED"
        side_effects:
          - "stamps screened_at, stores decision_note"
          - "increments ConflictsScreening.version by 1"
        note: "BRANCH — this arm produces no Reviewer axis-2 movement and no staffing recomputation, unlike the CLEARED arm."

      - from: PENDING
        to: BLOCKED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == BLOCKED"
        actor: StaffingCoordinator
        preconditions:
          - "screening.status == PENDING"
          - "matter.status != SUSPENDED"
        side_effects:
          - "stamps screened_at, stores decision_note"
          - "increments ConflictsScreening.version by 1"

      - from: WAIVER_REQUIRED
        to: CLEARED
        trigger: "POST /conflicts-screenings/{id}/waiver with granted == true"
        actor: ClientCounsel
        preconditions:
          - "screening.status == WAIVER_REQUIRED"
          - "X-User-ID == matter.client_id"
        side_effects:
          - "sets waiver_granted true, stores decision_note"
          - "Reviewer SOURCED -> CLEARED (axis 2)"
          - "recomputes Matter.staffed_reviewer_count (STAFFING -> IN_REVIEW when the minimum is reached)"
          - "increments ConflictsScreening.version by 1"

      - from: WAIVER_REQUIRED
        to: BLOCKED
        trigger: "POST /conflicts-screenings/{id}/waiver with granted == false"
        actor: ClientCounsel
        preconditions:
          - "screening.status == WAIVER_REQUIRED"
          - "X-User-ID == matter.client_id"
        side_effects:
          - "stores decision_note"
          - "increments ConflictsScreening.version by 1"

      - from: CLEARED
        to: BLOCKED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == BLOCKED (re-screening hit)"
        actor: StaffingCoordinator
        preconditions:
          - "screening.status == CLEARED"
          - "matter.status != SUSPENDED"
        side_effects:
          - "stamps screened_at, stores decision_note"
          - "CASCADE LINK 2: every ConfidentialityAgreement for (reviewer_id, matter_id) with status in {PENDING, EXECUTED} becomes REVOKED with revocation_reason CONFLICTS_BLOCKED"
          - "CASCADE LINK 3 (caused by link 2): every SecureEnvironmentSession for (reviewer_id, matter_id) with status in {SCHEDULED, ACTIVE} becomes REVOKED and closed_at is stamped"
          - "CASCADE LINK 3 (caused by link 2): Matter.staffed_reviewer_count is recomputed; IN_REVIEW -> STAFFING when it falls below min_staffed_reviewers"
          - "CASCADE LINK 4 (caused by link 2): every Assignment of this reviewer on this matter's batches with status in {ASSIGNED, IN_PROGRESS, REOPENED} becomes VOIDED (void_reason CONFLICTS_BLOCKED) in Assignment.created_at ASC order, each appending a REVERSAL BudgetLedgerEntry of -committed_amount_cents (appended only for an assignment whose billable_amount_cents == 0; a billed assignment keeps its ACTUAL_* row and is not reversed twice); each such Batch in {ASSIGNED, IN_PROGRESS} returns to CREATED"
          - "CASCADE LINK 4 (caused by link 2): Matter.committed_spend_cents is recomputed, and Reviewer engagement_status falls to SOURCED when no (CLEARED screening AND EXECUTED agreement) pair remains"
          - "increments ConflictsScreening.version by 1"
        note: "Depth-4 transitive cascade B. Each link is caused by the preceding link, not by the original request."

  # ---------------------------------------------------------------------------
  - entity: ConfidentialityAgreement
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /confidentiality-agreements/{id}/execute"
        actor: Reviewer
        preconditions:
          - "agreement.status == PENDING"
          - "X-User-ID == agreement.reviewer_id"
          - "matter.status != SUSPENDED"
          - "clock <= agreement.coverage_end_utc"
        side_effects:
          - "stamps executed_at from the logical clock and stores signature_name"
          - "recomputes Matter.staffed_reviewer_count; STAFFING -> IN_REVIEW when the minimum is reached"
          - "increments ConfidentialityAgreement.version by 1"

      - from: PENDING
        to: REVOKED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == BLOCKED (system cascade)"
        actor: system
        preconditions:
          - "agreement.status == PENDING"
        side_effects:
          - "stores revocation_reason CONFLICTS_BLOCKED"
          - "increments ConfidentialityAgreement.version by 1"

      - from: EXECUTED
        to: REVOKED
        trigger: "POST /conflicts-screenings/{id}/decision with outcome == BLOCKED (system cascade)"
        actor: system
        preconditions:
          - "agreement.status == EXECUTED"
        side_effects:
          - "stores revocation_reason CONFLICTS_BLOCKED"
          - "cascades to sessions, assignments, ledger and matter staffing per ConflictsScreening CLEARED -> BLOCKED links 3 and 4"
          - "increments ConfidentialityAgreement.version by 1"

      - from: EXECUTED
        to: EXPIRED
        trigger: "system — lazy expiry evaluated at the start of every request that reads or uses this agreement (any GET of the agreement, or any endpoint whose validations consult it)"
        actor: system
        preconditions:
          - "agreement.status == EXECUTED"
          - "logical clock > agreement.coverage_end_utc"
        side_effects:
          - "recomputes Matter.staffed_reviewer_count; IN_REVIEW -> STAFFING when it falls below min_staffed_reviewers"
          - "increments ConfidentialityAgreement.version by 1"
        note: "Existing Assignment rows are NOT voided by expiry; they simply cannot be started or progressed (ERR_CONFIDENTIALITY_NOT_EXECUTED)."

  # ---------------------------------------------------------------------------
  - entity: SecureEnvironmentSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED, REVOKED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /sessions/{id}/lifecycle with to_status == ACTIVE"
        actor: Reviewer
        preconditions:
          - "session.status == SCHEDULED"
          - "X-User-ID == session.reviewer_id"
          - "matter.status != SUSPENDED"
          - "the (reviewer, matter) ConfidentialityAgreement is EXECUTED and clock is inside its closed coverage interval"
          - "starts_at_utc <= clock < ends_at_utc"
        side_effects:
          - "stamps activated_at"
          - "increments SecureEnvironmentSession.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /sessions/{id}/lifecycle with to_status == CLOSED"
        actor: Reviewer
        preconditions:
          - "session.status == ACTIVE"
          - "X-User-ID == session.reviewer_id"
        side_effects:
          - "stamps closed_at; the occupied ONSITE_SECURE seat is released for later windows"
          - "increments SecureEnvironmentSession.version by 1"

      - from: SCHEDULED
        to: REVOKED
        trigger: "system — matter suspension, or agreement revocation cascaded from a BLOCKED screening"
        actor: system
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "stamps closed_at"
          - "increments SecureEnvironmentSession.version by 1"

      - from: ACTIVE
        to: REVOKED
        trigger: "system — matter suspension, or agreement revocation cascaded from a BLOCKED screening"
        actor: system
        preconditions:
          - "session.status == ACTIVE"
        side_effects:
          - "stamps closed_at"
          - "increments SecureEnvironmentSession.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Batch
    initial_state: CREATED
    terminal_states: [RELEASED, DISSOLVED]
    transitions:
      - from: CREATED
        to: ASSIGNED
        trigger: "POST /batches/{id}/assignments or POST /batches/{id}/auto-assign with pass_type == FIRST_PASS"
        actor: StaffingCoordinator
        preconditions:
          - "batch.status == CREATED"
          - "expected_batch_version == batch.version"
          - "matter.status == IN_REVIEW"
          - "the matter has a ReviewProtocol with status == APPROVED"
        side_effects:
          - "creates the Assignment in ASSIGNED and pins effective_per_document_cents and committed_amount_cents"
          - "appends a COMMITMENT BudgetLedgerEntry and recomputes Matter.committed_spend_cents"
          - "Reviewer CLEARED -> ENGAGED when applicable"
          - "increments Batch.version by 1"

      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /batches/{id}/assignments with pass_type == FIRST_PASS (reassignment / supersede)"
        actor: StaffingCoordinator
        preconditions:
          - "batch.status in {ASSIGNED, IN_PROGRESS}"
          - "expected_batch_version == batch.version"
          - "an Assignment with the same pass_type and status in {ASSIGNED, IN_PROGRESS, REOPENED} exists on this batch"
        side_effects:
          - "the existing same-pass Assignment becomes VOIDED with void_reason SUPERSEDED_BY_REASSIGNMENT and a REVERSAL BudgetLedgerEntry of -committed_amount_cents is appended (only when its billable_amount_cents == 0; a billed assignment keeps its ACTUAL_* row and is not reversed twice)"
          - "the new Assignment records reassigned_from_assignment_id = superseded assignment id and appends its own COMMITMENT entry"
          - "batch returns to ASSIGNED even when it was IN_PROGRESS"
          - "Matter.committed_spend_cents is recomputed"
          - "increments Batch.version by 1"

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /assignments/{id}/start"
        actor: Reviewer
        preconditions:
          - "batch.status in {ASSIGNED, QC_FAILED}"
          - "the started Assignment belongs to this batch"
        side_effects:
          - "Assignment ASSIGNED|REOPENED -> IN_PROGRESS, started_at stamped"
          - "increments Batch.version by 1"

      - from: IN_PROGRESS
        to: SECOND_LEVEL
        trigger: "POST /assignments/{id}/submit for the FIRST_PASS assignment (branch A)"
        actor: Reviewer
        preconditions:
          - "batch.status == IN_PROGRESS"
          - "the matter's APPROVED protocol has second_level_required == true"
          - "assignment.documents_coded == batch.document_count"
        side_effects:
          - "BRANCH A side-effect set: the batch now REQUIRES a SECOND_LEVEL assignment; POST /batches/{id}/qc-samples is rejected with ERR_INVALID_STATE while in SECOND_LEVEL"
          - "no QCSample may be drawn and qc_sample_target_size is not yet frozen"
          - "increments Batch.version by 1"

      - from: IN_PROGRESS
        to: QC_SAMPLING
        trigger: "POST /assignments/{id}/submit for the FIRST_PASS assignment (branch B)"
        actor: Reviewer
        preconditions:
          - "batch.status == IN_PROGRESS"
          - "the matter's APPROVED protocol has second_level_required == false"
          - "assignment.documents_coded == batch.document_count"
        side_effects:
          - "BRANCH B side-effect set: second-level review is skipped entirely and a SECOND_LEVEL assignment can never be created for this batch (ERR_INVALID_STATE)"
          - "increments Batch.version by 1"
        note: "The two branches diverge in their side-effect sets, not merely in the next state."

      - from: SECOND_LEVEL
        to: QC_SAMPLING
        trigger: "POST /assignments/{id}/submit for the SECOND_LEVEL assignment (join)"
        actor: Reviewer
        preconditions:
          - "batch.status == SECOND_LEVEL"
          - "the submitting assignment has pass_type == SECOND_LEVEL and documents_coded == batch.document_count"
        side_effects:
          - "increments Batch.version by 1"

      - from: QC_SAMPLING
        to: QC_PASSED
        trigger: "POST /qc-samples/{id}/validate producing outcome PASSED (system cascade)"
        actor: system
        preconditions:
          - "batch.status == QC_SAMPLING"
          - "the sample's discrepancy_rate < protocol.max_discrepancy_pct"
        side_effects:
          - "when coding_error_count + privilege_error_count == 0, appends ScorecardEvent(CLEARED_STRIKE, -1) for the batch's FIRST_PASS reviewer"
          - "increments Batch.version by 1"

      - from: QC_SAMPLING
        to: QC_FAILED
        trigger: "POST /qc-samples/{id}/validate producing outcome FAILED (system cascade)"
        actor: system
        preconditions:
          - "batch.status == QC_SAMPLING"
          - "the sample's discrepancy_rate >= protocol.max_discrepancy_pct"
        side_effects:
          - "CASCADE LINK 2 (caused by the batch reaching QC_FAILED): the batch's FIRST_PASS Assignment in status SUBMITTED becomes REOPENED and ScorecardEvent(QC_FAILURE, +1) is appended for its reviewer"
          - "CASCADE LINK 2b: when privilege_error_count > 0 a further ScorecardEvent(PRIVILEGE_MISS, +1) is appended for the same reviewer"
          - "CASCADE LINK 3 (caused by the strike total): the removal evaluation runs; Reviewer -> REMOVED when scorecard_strikes >= 3 or the accuracy floor is breached"
          - "CASCADE LINK 4 (caused by removal): the removed reviewer's other {ASSIGNED, IN_PROGRESS, REOPENED} assignments are VOIDED in created_at ASC order with REVERSAL ledger entries, their {ASSIGNED, IN_PROGRESS} batches return to CREATED, and Matter.committed_spend_cents / staffed_reviewer_count are recomputed (IN_REVIEW -> STAFFING when short-staffed)"
          - "increments Batch.version by 1"
        note: "Depth-4 transitive cascade A. Batches already in {SECOND_LEVEL, QC_SAMPLING, QC_FAILED} do NOT return to CREATED when their assignment is voided."

      - from: QC_FAILED
        to: IN_PROGRESS
        trigger: "POST /assignments/{id}/start for the REOPENED assignment"
        actor: Reviewer
        preconditions:
          - "batch.status == QC_FAILED"
          - "the assignment status is REOPENED and belongs to this batch"
        side_effects:
          - "Assignment REOPENED -> IN_PROGRESS"
          - "increments Batch.version by 1"
        note: "CYCLE — QC_FAILED -> IN_PROGRESS -> QC_SAMPLING -> QC_FAILED may repeat without bound."

      - from: IN_PROGRESS
        to: QC_SAMPLING
        trigger: "POST /assignments/{id}/submit for a REOPENED-then-resubmitted assignment (rework join)"
        actor: Reviewer
        preconditions:
          - "batch.status == IN_PROGRESS"
          - "the submitting assignment has billable_amount_cents > 0 (it was already billed once)"
        side_effects:
          - "NO new ACTUAL_* BudgetLedgerEntry is appended — rework is non-billable"
          - "second-level review is NOT repeated on a rework cycle"
          - "increments Batch.version by 1"

      - from: QC_PASSED
        to: RELEASED
        trigger: "POST /batches/{id}/release"
        actor: QCLead
        preconditions:
          - "batch.status == QC_PASSED"
          - "count of VALIDATED PrivilegeLogEntry rows >= privilege_validation_quota"
          - "no PrivilegeLogEntry of the batch is CHALLENGED"
        side_effects:
          - "every PrivilegeLogEntry of the batch (DRAFT or VALIDATED) becomes FINAL"
          - "every Assignment of the batch in SUBMITTED becomes COMPLETED"
          - "stamps released_at"
          - "Matter IN_REVIEW -> QC_CLOSEOUT when every batch is RELEASED/DISSOLVED and unbatched_document_count == 0"
          - "increments Batch.version by 1"

      - from: CREATED
        to: DISSOLVED
        trigger: "POST /batches/{id}/dissolve"
        actor: EngagementManager
        preconditions:
          - "batch.status == CREATED"
          - "the batch has no Assignment row with status != VOIDED"
        side_effects:
          - "returns document_count to Matter.unbatched_document_count"
          - "increments Batch.version by 1 and Matter.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /assignments/{id}/start"
        actor: Reviewer
        preconditions:
          - "assignment.status in {ASSIGNED, REOPENED}"
          - "X-User-ID == assignment.reviewer_id"
          - "matter.status != SUSPENDED"
          - "the (reviewer, matter) ConfidentialityAgreement is EXECUTED and the clock lies inside its closed coverage interval"
        side_effects:
          - "stamps started_at on the first start only"
          - "Batch ASSIGNED -> IN_PROGRESS, or QC_FAILED -> IN_PROGRESS on a rework cycle"
          - "increments Assignment.version by 1"

      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /assignments/{id}/submit"
        actor: Reviewer
        preconditions:
          - "assignment.status == IN_PROGRESS"
          - "X-User-ID == assignment.reviewer_id"
          - "assignment.documents_coded == batch.document_count"
          - "count of PrivilegeLogEntry rows on this batch authored by this reviewer == assignment.privilege_hits_logged"
        side_effects:
          - "stamps submitted_at and freezes pace_dph"
          - "when billable_amount_cents == 0: appends the ACTUAL_PER_DOCUMENT (or ACTUAL_HOURLY) BudgetLedgerEntry, appends the matching REVERSAL of the COMMITMENT entry, sets billable_amount_cents, and recomputes Matter.committed_spend_cents"
          - "when billable_amount_cents > 0 (rework resubmission): no ledger movement at all"
          - "when pace_dph < protocol.min_pace_dph: appends ScorecardEvent(PACE_SHORTFALL, +1) and runs the removal evaluation"
          - "Batch IN_PROGRESS -> SECOND_LEVEL or -> QC_SAMPLING per the fork, or SECOND_LEVEL -> QC_SAMPLING on a second-level submit"
          - "increments Assignment.version by 1"

      - from: SUBMITTED
        to: REOPENED
        trigger: "POST /qc-samples/{id}/validate producing outcome FAILED (system cascade)"
        actor: system
        preconditions:
          - "assignment.status == SUBMITTED"
          - "assignment.pass_type == FIRST_PASS"
        side_effects:
          - "appends ScorecardEvent(QC_FAILURE, +1) for assignment.reviewer_id and runs the removal evaluation"
          - "increments Assignment.version by 1"
        note: "CYCLE — SUBMITTED -> REOPENED -> IN_PROGRESS -> SUBMITTED may repeat without bound; only the first submit ever bills."

      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /assignments/{id}/start"
        actor: Reviewer
        preconditions:
          - "assignment.status == REOPENED"
          - "X-User-ID == assignment.reviewer_id"
          - "the (reviewer, matter) ConfidentialityAgreement is EXECUTED and covers the clock"
        side_effects:
          - "Batch QC_FAILED -> IN_PROGRESS"
          - "increments Assignment.version by 1"

      - from: SUBMITTED
        to: COMPLETED
        trigger: "POST /batches/{id}/release or POST /matters/{id}/close (system cascade)"
        actor: system
        preconditions:
          - "assignment.status == SUBMITTED"
        side_effects:
          - "increments Assignment.version by 1"

      - from: ASSIGNED
        to: VOIDED
        trigger: "POST /assignments/{id}/void, reassignment supersede, reviewer removal, or a BLOCKED re-screening (system cascade)"
        actor: StaffingCoordinator
        preconditions:
          - "assignment.status in {ASSIGNED, IN_PROGRESS, REOPENED}"
        side_effects:
          - "stamps voided_at and void_reason"
          - "appends a REVERSAL BudgetLedgerEntry of -committed_amount_cents ONLY when billable_amount_cents == 0, i.e. the commitment is still outstanding; a billed assignment keeps its ACTUAL_* row and receives NO second reversal, which is what keeps the money invariant from double-reversing on a rework void; Matter.committed_spend_cents is recomputed either way"
          - "Batch ASSIGNED|IN_PROGRESS -> CREATED when no non-VOIDED assignment of the same pass remains; batches in {SECOND_LEVEL, QC_SAMPLING, QC_FAILED} keep their status"
          - "Reviewer engagement_status is recomputed (ENGAGED -> SOURCED only when no CLEARED+EXECUTED pair remains)"
          - "increments Assignment.version by 1"

      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /assignments/{id}/void, reviewer removal, or a BLOCKED re-screening (system cascade)"
        actor: StaffingCoordinator
        preconditions:
          - "assignment.status == IN_PROGRESS"
        side_effects:
          - "same as ASSIGNED -> VOIDED"
          - "increments Assignment.version by 1"

      - from: REOPENED
        to: VOIDED
        trigger: "POST /assignments/{id}/void, reviewer removal, or a BLOCKED re-screening (system cascade)"
        actor: StaffingCoordinator
        preconditions:
          - "assignment.status == REOPENED"
        side_effects:
          - "same as ASSIGNED -> VOIDED, except the batch keeps its QC_FAILED status"
          - "increments Assignment.version by 1"

  # ---------------------------------------------------------------------------
  - entity: QCSample
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /qc-samples/{id}/validate with discrepancy_rate < protocol.max_discrepancy_pct"
        actor: QCLead
        preconditions:
          - "sample.outcome == PENDING"
          - "coding_error_count + privilege_error_count <= sampled_document_count"
        side_effects:
          - "stores the two error counts, computes discrepancy_rate, stamps validated_at"
          - "Batch QC_SAMPLING -> QC_PASSED"
          - "ScorecardEvent(CLEARED_STRIKE, -1) for the FIRST_PASS reviewer when both error counts are zero"
          - "increments QCSample.version by 1"

      - from: PENDING
        to: FAILED
        trigger: "POST /qc-samples/{id}/validate with discrepancy_rate >= protocol.max_discrepancy_pct"
        actor: QCLead
        preconditions:
          - "sample.outcome == PENDING"
          - "coding_error_count + privilege_error_count <= sampled_document_count"
        side_effects:
          - "stores the two error counts, computes discrepancy_rate, stamps validated_at"
          - "Batch QC_SAMPLING -> QC_FAILED, which opens transitive cascade A"
          - "increments QCSample.version by 1"

  # ---------------------------------------------------------------------------
  - entity: PrivilegeLogEntry
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /privilege-log-entries/{id}/validate with accepted == true"
        actor: QCLead
        preconditions:
          - "entry.status in {DRAFT}"
          - "the entry's batch has status in {SECOND_LEVEL, QC_SAMPLING, QC_PASSED, QC_FAILED}"
        side_effects:
          - "stamps validated_at"
          - "increments PrivilegeLogEntry.version by 1"

      - from: DRAFT
        to: CHALLENGED
        trigger: "POST /privilege-log-entries/{id}/validate with accepted == false"
        actor: QCLead
        preconditions:
          - "entry.status == DRAFT"
          - "challenge_note supplied and non-blank"
        side_effects:
          - "stores challenge_note"
          - "increments PrivilegeLogEntry.version by 1"

      - from: CHALLENGED
        to: DRAFT
        trigger: "POST /privilege-log-entries/{id}/amend"
        actor: Reviewer
        preconditions:
          - "entry.status == CHALLENGED"
          - "X-User-ID == entry.authored_by_reviewer_id"
        side_effects:
          - "replaces privilege_basis and disposition, clears challenge_note to null"
          - "increments PrivilegeLogEntry.version by 1"
        note: "CYCLE — DRAFT -> CHALLENGED -> DRAFT may repeat without bound."

      - from: VALIDATED
        to: FINAL
        trigger: "POST /batches/{id}/release (system cascade)"
        actor: system
        preconditions:
          - "the entry's batch reaches RELEASED"
        side_effects:
          - "increments PrivilegeLogEntry.version by 1"

      - from: DRAFT
        to: FINAL
        trigger: "POST /batches/{id}/release (system cascade)"
        actor: system
        preconditions:
          - "the entry's batch reaches RELEASED"
          - "the entry was never CHALLENGED and simply fell outside the validation sample"
        side_effects:
          - "increments PrivilegeLogEntry.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: protocol-revision-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /matters/{id}/protocols"
    occ_field: "expected_matter_version"
    description: |
      Minting a ReviewProtocol revision against a Matter whose version has
      advanced since the client last read it is rejected. A new revision
      legitimately supersedes the prior APPROVED protocol and pushes the matter
      back to PROTOCOL_PENDING, so a writer holding a stale view of the matter
      would be superseding a protocol it never saw.
    error_id: ERR_STALE_MATTER_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-batch
    parent_entity: Batch
    write_endpoint: "POST /batches/{id}/assignments"
    occ_field: "expected_batch_version"
    description: |
      Creating an Assignment against a Batch whose version has advanced since
      the client last read it is rejected. A same-pass create legitimately
      supersedes the active assignment (voiding it and reversing its
      commitment), so a stale-version writer would silently displace a reviewer
      whose engagement it never observed.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

  - rule_id: auto-assign-stale-batch
    parent_entity: Batch
    write_endpoint: "POST /batches/{id}/auto-assign"
    occ_field: "expected_batch_version"
    description: |
      Running the selector against a Batch whose version has advanced since the
      client last read it is rejected, because the selector's own eligibility
      filter and supersede behaviour depend on the batch's current assignment
      set.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - rule_id: assignment_billable_amount
    name: "Assignment billable amount (per-document tiered rate vs hourly increments)"
    applies_to: "Assignment.billable_amount_cents, Assignment.effective_per_document_cents"
    algorithm_type: tiered_pricing
    trigger: "computed and frozen on the FIRST POST /assignments/{id}/submit only; a rework resubmission never recomputes or re-bills"
    formula: |
      Branch selected by matter.pricing_model.

      PER_DOCUMENT branch — the rounding order is PINNED and MUST NOT be
      rearranged:
        step 1  tier_multiplier   = COMPLEXITY_TIER_MULTIPLIER[matter.complexity_tier]
        step 2  premium_languages = (reviewer.languages INTERSECT matter.required_languages) MINUS {"EN"}
        step 3  language_factor   = 1 + (LANGUAGE_PREMIUM_PER_LANGUAGE * count(premium_languages))
        step 4  pass_multiplier   = PASS_TYPE_MULTIPLIER[assignment.pass_type]
        step 5  raw_rate          = matter.per_document_rate_cents
                                    * tier_multiplier
                                    * language_factor
                                    * pass_multiplier
        step 6  effective_per_document_cents = round_half_up(raw_rate, 0)   # ROUND FIRST
        step 7  billable_amount_cents = effective_per_document_cents
                                    * assignment.documents_coded            # MULTIPLY SECOND
      Rounding the product instead of the rate (i.e. swapping steps 6 and 7)
      produces a different total and is WRONG.

      HOURLY branch:
        step 1  billable_minutes = ceil(assignment.minutes_logged / HOURLY_INCREMENT_MINUTES)
                                    * HOURLY_INCREMENT_MINUTES
        step 2  billable_amount_cents = round_half_up(
                    matter.hourly_rate_cents * billable_minutes / 60, 0)
        step 3  effective_per_document_cents = 0
      Partial increments always round UP to the next 6-minute increment, even
      by one minute.
    input_set: "the single Assignment being submitted, its Batch, the Batch's Matter, and the assigned Reviewer"
    constants:
      COMPLEXITY_TIER_MULTIPLIER: "{SIMPLE: 1.00, STANDARD: 1.15, COMPLEX: 1.35}"
      LANGUAGE_PREMIUM_PER_LANGUAGE: 0.05
      PASS_TYPE_MULTIPLIER: "{FIRST_PASS: 1.00, SECOND_LEVEL: 0.60}"
      HOURLY_INCREMENT_MINUTES: 6
    precision: "integer cents; round_half_up at step 6 (per-document) or step 2 (hourly)"
    worked_example: |
      PER_DOCUMENT, COMPLEX matter, per_document_rate_cents 150, required_languages
      ["EN","JA"], reviewer languages ["EN","JA"], FIRST_PASS, documents_coded 300:
        raw_rate = 150 * 1.35 * (1 + 0.05*1) * 1.00 = 202.5 * 1.05 = 212.625
        effective_per_document_cents = round_half_up(212.625) = 213
        billable_amount_cents = 213 * 300 = 63900
      The wrong order (round the product) yields round_half_up(212.625*300)
      = round_half_up(63787.5) = 63788 — a 112-cent divergence.

      Same reviewer, SECOND_LEVEL pass, documents_coded 300:
        raw_rate = 212.625 * 0.60 = 127.575 -> 128 c/doc -> 128 * 300 = 38400

      HOURLY matter, hourly_rate_cents 6500, minutes_logged 187:
        billable_minutes = ceil(187/6) * 6 = 32 * 6 = 192
        billable_amount_cents = round_half_up(6500 * 192 / 60) = 20800

  - rule_id: assignment_commitment_amount
    name: "Assignment budget commitment at creation"
    applies_to: "Assignment.committed_amount_cents"
    algorithm_type: aggregation
    trigger: "POST /batches/{id}/assignments and POST /batches/{id}/auto-assign; frozen at creation and never recomputed"
    formula: |
      PER_DOCUMENT branch:
        committed_amount_cents = effective_per_document_cents(as computed by
            assignment_billable_amount steps 1-6 for this reviewer and pass)
          * batch.document_count
      HOURLY branch:
        projected_minutes = batch.document_count / protocol.min_pace_dph * 60
        committed_amount_cents = round_half_up(
            matter.hourly_rate_cents * projected_minutes / 60, 0)
          = round_half_up(matter.hourly_rate_cents
                          * batch.document_count / protocol.min_pace_dph, 0)
      The commitment uses the batch's FULL document_count, whereas the actual
      uses documents_coded, so the two diverge whenever a batch is reworked or
      the reviewer's effective rate changes between passes.
    input_set: "the Batch being assigned, its Matter, the matter's APPROVED ReviewProtocol, and the selected Reviewer"
    constants:
      COMPLEXITY_TIER_MULTIPLIER: "{SIMPLE: 1.00, STANDARD: 1.15, COMPLEX: 1.35}"
      LANGUAGE_PREMIUM_PER_LANGUAGE: 0.05
      PASS_TYPE_MULTIPLIER: "{FIRST_PASS: 1.00, SECOND_LEVEL: 0.60}"
    precision: "integer cents; round_half_up"
    worked_example: |
      COMPLEX per-document matter (rate 150), reviewer with one premium language,
      FIRST_PASS, batch.document_count 400:
        effective rate 213 -> committed_amount_cents = 213 * 400 = 85200
      Same batch on an HOURLY matter, hourly_rate_cents 6500, min_pace_dph 55:
        round_half_up(6500 * 400 / 55) = round_half_up(47272.727...) = 47273

  - rule_id: matter_invoice_total
    name: "Matter invoice total (gross -> QC surcharge -> volume discount band)"
    applies_to: "GET /matters/{id}/spend-projection -> invoice_total_cents"
    algorithm_type: waterfall_allocation
    trigger: "GET /matters/{id}/spend-projection"
    formula: |
      The four steps are PINNED IN ORDER; each consumes the previous step's
      output and the band is selected EXACTLY ONCE.
        step 1  gross_billable_cents = SUM(assignment.billable_amount_cents)
                  over every Assignment of the matter whose status is in
                  {SUBMITTED, COMPLETED}   (VOIDED and REOPENED excluded)
        step 2  qc_surcharge_cents = round_half_up(
                    gross_billable_cents * protocol.qc_sample_pct
                    * QC_SURCHARGE_FACTOR, 0)
        step 3  provisional_total_cents = gross_billable_cents + qc_surcharge_cents
        step 4  volume_discount_pct is selected from VOLUME_DISCOUNT_BANDS using
                provisional_total_cents, then
                volume_discount_cents = round_half_up(
                    provisional_total_cents * volume_discount_pct, 0)
                invoice_total_cents = provisional_total_cents
                                    - volume_discount_cents
      The band is NEVER re-selected against invoice_total_cents. Re-banding
      after the discount (a fixed-point loop) is WRONG, and so is selecting the
      band from gross_billable_cents before the surcharge is added.
    input_set: "every Assignment of the matter in status SUBMITTED or COMPLETED, plus the matter's APPROVED ReviewProtocol"
    constants:
      QC_SURCHARGE_FACTOR: 0.20
      VOLUME_DISCOUNT_BANDS: "provisional_total_cents < 100000 -> 0.00; 100000 <= x <= 249999 -> 0.03; x >= 250000 -> 0.06"
    precision: "integer cents; round_half_up at steps 2 and 4"
    worked_example: |
      Two submitted assignments on a COMPLEX matter with qc_sample_pct 0.10:
      FIRST_PASS 290 docs at 213 = 61770, SECOND_LEVEL 290 docs at 128 = 37120.
        gross_billable_cents   = 61770 + 37120 = 98890
        qc_surcharge_cents     = round_half_up(98890 * 0.10 * 0.20)
                               = round_half_up(1977.8) = 1978
        provisional_total_cents = 98890 + 1978 = 100868
        band(100868) -> 0.03
        volume_discount_cents  = round_half_up(100868 * 0.03)
                               = round_half_up(3026.04) = 3026
        invoice_total_cents    = 100868 - 3026 = 97842
      Selecting the band from gross (98890 < 100000 -> 0%) would return 100868;
      re-banding 97842 (< 100000 -> 0%) would also return 100868. Both are wrong.

  - rule_id: reviewer_selection_rank
    name: "Auto-assign reviewer selection score and tie-break chain"
    applies_to: "POST /batches/{id}/auto-assign -> the chosen Reviewer"
    algorithm_type: weighted_scoring
    trigger: "POST /batches/{id}/auto-assign"
    formula: |
      Eligibility filter (a reviewer failing ANY clause is excluded from the
      pool entirely rather than scored low):
        - engagement_status in {CLEARED, ENGAGED} and credential_status == VERIFIED
        - a ConflictsScreening for (reviewer, matter) with status CLEARED exists
        - a ConfidentialityAgreement for (reviewer, matter) with status EXECUTED
          exists and the logical clock lies inside its closed coverage interval
        - reviewer.tier == requested pass_type
        - matter.required_bar_states is a SUBSET of reviewer.bar_admissions
        - matter.required_languages is a SUBSET of reviewer.languages
        - active_assignment_count < reviewer.max_concurrent_batches
        - the reviewer does not already hold a non-terminal Assignment of the
          OTHER pass_type on this same batch
      Scoring over the surviving pool:
        normalized_accuracy   = reviewer.accuracy_score                       # 0..1
        normalized_pace       = min(reviewer.pace_dph / protocol.min_pace_dph, 1.5)
        language_match_ratio  = count(reviewer.languages INTERSECT
                                      matter.required_languages)
                                / count(matter.required_languages)
        subject_match_ratio   = count(reviewer.subject_matter_tags INTERSECT
                                      matter.subject_matter_tags)
                                / count(matter.subject_matter_tags)
        strike_penalty        = STRIKE_PENALTY_WEIGHT * min(reviewer.scorecard_strikes,
                                                            STRIKE_PENALTY_CAP)
        score = round_half_up(
                    ACCURACY_WEIGHT * normalized_accuracy
                  + PACE_WEIGHT     * (normalized_pace / 1.5)
                  + LANGUAGE_WEIGHT * language_match_ratio
                  + SUBJECT_WEIGHT  * subject_match_ratio
                  - strike_penalty, 4)
      Ordering: score DESC, then capacity_headroom DESC (max_concurrent_batches
      - active_assignment_count), then hourly_cost_cents ASC, then
      Reviewer.created_at ASC. An empty pool returns ERR_NO_ELIGIBLE_REVIEWER.
    input_set: "every Reviewer surviving the eligibility filter for this batch's matter and the requested pass_type"
    constants:
      ACCURACY_WEIGHT: 0.45
      PACE_WEIGHT: 0.30
      LANGUAGE_WEIGHT: 0.15
      SUBJECT_WEIGHT: 0.10
      STRIKE_PENALTY_WEIGHT: 0.05
      STRIKE_PENALTY_CAP: 2
    precision: "score to 4 decimal places, round_half_up; ratios computed in full precision before weighting"
    worked_example: |
      Fresh reviewer (accuracy_score 1.0000, pace_dph 0.0 -> normalized_pace 0,
      languages ["EN","JA"] against required ["EN","JA"], 0 strikes):
        matching subject tag  -> 0.45*1 + 0.30*0 + 0.15*1 + 0.10*1 - 0 = 0.7000
        non-matching tag      -> 0.45*1 + 0.30*0 + 0.15*1 + 0.10*0 - 0 = 0.6000
        matching tag, 2 strikes -> 0.7000 - 0.05*2 = 0.6000
      The strike penalty caps at 2, so a 3-strike reviewer would score the same
      0.6000 — except that a 3-strike reviewer is REMOVED and therefore never
      enters the pool at all.

  - rule_id: matter_spend_projection
    name: "Matter spend projection — dual variant"
    applies_to: "GET /matters/{id}/spend-projection -> remaining_work_basis_cents, ledger_replay_basis_cents, variance_cents"
    algorithm_type: projection
    trigger: "GET /matters/{id}/spend-projection"
    variants:
      - variant_id: REMAINING_WORK_BASIS
        description: |
          Forward-looking. Prices the documents that still have to be coded at
          the CONTRACT rate, deliberately EXCLUDING any reviewer-specific
          language premium because the future reviewer is unknown:
            contract_rate_cents = round_half_up(
                matter.per_document_rate_cents
                * COMPLEXITY_TIER_MULTIPLIER[matter.complexity_tier], 0)
            uncoded_in_flight = SUM over Assignment rows with pass_type
                FIRST_PASS and status in {ASSIGNED, IN_PROGRESS, REOPENED} of
                (batch.document_count - assignment.documents_coded)
            unassigned_batched = SUM of batch.document_count over batches whose
                status is CREATED
            remaining_work_basis_cents = contract_rate_cents
                * (uncoded_in_flight + unassigned_batched
                   + matter.unbatched_document_count)
          Applied when the caller passes basis=REMAINING_WORK_BASIS (the
          default for a matter whose status is in {INTAKE, PROTOCOL_PENDING,
          STAFFING, IN_REVIEW}).
      - variant_id: LEDGER_REPLAY_BASIS
        description: |
          Backward-looking. Replays the BudgetLedgerEntry stream at each
          reviewer's own EFFECTIVE rate (language premium included):
            ledger_replay_basis_cents = SUM(entry.amount_cents) over every
            BudgetLedgerEntry of the matter, in created_at ASC order, with
            COMMITMENT and ACTUAL_* entries positive and REVERSAL entries
            negative.
          Applied when the caller passes basis=LEDGER_REPLAY_BASIS (the default
          for a matter whose status is in {QC_CLOSEOUT, CLOSED, SUSPENDED}).
    selection_rule: "explicit `basis` query parameter wins; otherwise the matter's status picks the default as described above; `basis_applied` in the response always names the variant that was used"
    formula: |
      Both variants are ALWAYS computed and returned; variance_cents =
      remaining_work_basis_cents - ledger_replay_basis_cents. budget_headroom_cents
      = matter.budget_cap_cents - the basis_applied value.
    input_set: "every Batch, Assignment and BudgetLedgerEntry of the matter"
    constants:
      COMPLEXITY_TIER_MULTIPLIER: "{SIMPLE: 1.00, STANDARD: 1.15, COMPLEX: 1.35}"
    precision: "integer cents; round_half_up on contract_rate_cents only"
    worked_example: |
      COMPLEX matter, per_document_rate_cents 150 -> contract_rate_cents =
      round_half_up(202.5) = 203. Batch 1 (400 docs) assigned to a reviewer with
      one premium language and 250 documents coded so far; batch 2 (200 docs) is
      still CREATED; unbatched_document_count 0.
        REMAINING_WORK_BASIS = 203 * ((400-250) + 200 + 0)
                             = 203 * 350 = 71050
        LEDGER_REPLAY_BASIS  = the single COMMITMENT entry = 213 * 400 = 85200
        variance_cents       = 71050 - 85200 = -14150
      The divergence is structural: one basis uses the contract rate over
      remaining work, the other the reviewer's premium rate over committed work.

  - rule_id: reviewer_accuracy_score
    name: "Reviewer accuracy score — dual variant"
    applies_to: "Reviewer.accuracy_score, GET /reviewers/{id}/scorecard -> accuracy_score"
    algorithm_type: weighted_scoring
    trigger: "recomputed after every POST /qc-samples/{id}/validate; read via GET /reviewers/{id} or GET /reviewers/{id}/scorecard"
    variants:
      - variant_id: SAMPLE_WEIGHTED
        description: |
          Pools every document ever sampled for this reviewer, so a large batch
          dominates a small one:
            total_sampled = SUM(sample.sampled_document_count)
            total_errors  = SUM(sample.coding_error_count
                                + sample.privilege_error_count)
            accuracy = round_half_up(1 - total_errors / total_sampled, 4)
          Over samples whose outcome is PASSED or FAILED, where the sample's
          batch has a FIRST_PASS Assignment (in any status except VOIDED)
          belonging to this reviewer. No samples at all -> 1.0000.
      - variant_id: ASSIGNMENT_MEAN
        description: |
          Unweighted mean of the per-sample accuracies, so every batch counts
          equally regardless of size:
            per_sample = 1 - (coding_error_count + privilege_error_count)
                             / sampled_document_count
            accuracy   = round_half_up(mean(per_sample over the same sample
                                            set), 4)
          No samples at all -> 1.0000.
    selection_rule: "Reviewer.accuracy_score and the auto-assign selector always use SAMPLE_WEIGHTED; GET /reviewers/{id}/scorecard?weighting=ASSIGNMENT_MEAN returns the alternative and the response's weighting_applied field names which was used (default SAMPLE_WEIGHTED)"
    formula: "see the two variants; both are rounded to 4 decimal places with round_half_up"
    input_set: "every QCSample whose outcome is PASSED or FAILED and whose batch carries a non-VOIDED FIRST_PASS Assignment for this reviewer"
    constants:
      DEFAULT_ACCURACY_NO_SAMPLES: 1.0000
      ACCURACY_FLOOR_FOR_REMOVAL: 0.9000
      ACCURACY_FLOOR_MIN_SAMPLED_DOCS: 50
    precision: "4 decimal places, round_half_up"
    worked_example: |
      Sample 1: batch of 400 docs, qc_sample_pct 0.10 -> sampled 40, 1 error
        -> per_sample = 1 - 1/40 = 0.9750
      Sample 2: batch of 200 docs -> sampled 20, 0 errors
        -> per_sample = 1.0000
        SAMPLE_WEIGHTED = round_half_up(1 - 1/60, 4)
                        = round_half_up(0.98333..., 4) = 0.9833
        ASSIGNMENT_MEAN = round_half_up((0.9750 + 1.0000)/2, 4) = 0.9875
      The two differ by 42 ten-thousandths on identical data.

  - rule_id: matter_required_pace_dph
    name: "Matter required pace (documents per reviewer-hour to hit the deadline)"
    applies_to: "Matter.required_pace_dph"
    algorithm_type: forward_looking
    trigger: "recomputed on every read of the Matter and after any change to document_count, batch composition, staffing or the logical clock"
    formula: |
      remaining_documents = matter.unbatched_document_count
        + SUM over batches whose status is in {CREATED, ASSIGNED, IN_PROGRESS,
          SECOND_LEVEL, QC_FAILED} of batch.document_count
      remaining_hours = (matter.deadline_utc - clock) in whole seconds / 3600,
        floored at 0
      effective_reviewers = max(matter.staffed_reviewer_count, 1)
      required_pace_dph = when remaining_documents == 0 -> 0.00
                          when remaining_hours == 0     -> null
                          otherwise round_half_up(
                              remaining_documents
                              / (remaining_hours * effective_reviewers), 2)
      Batches in {QC_SAMPLING, QC_PASSED, RELEASED, DISSOLVED} are excluded —
      their documents are no longer first-pass work.
    input_set: "the Matter, every non-terminal Batch of the matter, and the logical clock"
    constants:
      MIN_EFFECTIVE_REVIEWERS: 1
    precision: "2 decimal places, round_half_up"
    worked_example: |
      clock 2026-08-01T00:00:00Z, deadline 2026-09-30T00:00:00Z -> 60 days ->
      1440 hours. remaining_documents 2000, staffed_reviewer_count 2:
        round_half_up(2000 / (1440 * 2), 2) = round_half_up(0.6944, 2) = 0.69

  - rule_id: qc_sample_evaluation
    name: "QC sample size, discrepancy rate and pass/fail threshold"
    applies_to: "Batch.qc_sample_target_size, QCSample.sampled_document_count, QCSample.discrepancy_rate, QCSample.outcome"
    algorithm_type: threshold
    trigger: "sample size frozen at POST /batches/{id}/qc-samples; discrepancy_rate and outcome computed at POST /qc-samples/{id}/validate"
    formula: |
      qc_sample_target_size = max(QC_MIN_SAMPLE_DOCS,
                                  ceil(batch.document_count
                                       * protocol.qc_sample_pct))
      sampled_document_count = min(qc_sample_target_size, batch.document_count)
      discrepancy_rate = round_half_up(
          (coding_error_count + privilege_error_count)
          / sampled_document_count, 4)
      outcome = FAILED when discrepancy_rate >= protocol.max_discrepancy_pct
                PASSED otherwise
      The comparison is INCLUSIVE at the threshold: a discrepancy_rate exactly
      equal to max_discrepancy_pct FAILS.
    input_set: "the Batch, its Matter's APPROVED ReviewProtocol, and the error counts supplied at validation"
    constants:
      QC_MIN_SAMPLE_DOCS: 10
    precision: "sampled_document_count integer (ceil then floor-at-minimum); discrepancy_rate 4 decimal places, round_half_up"
    worked_example: |
      batch.document_count 400, qc_sample_pct 0.10 ->
        target = max(10, ceil(40.0)) = 40
        2 coding errors -> 2/40 = 0.0500; max_discrepancy_pct 0.05 -> 0.05 >= 0.05
          -> FAILED (the boundary itself fails)
        1 coding error  -> 1/40 = 0.0250 -> PASSED
      batch.document_count 50, qc_sample_pct 0.10 ->
        target = max(10, ceil(5.0)) = 10  (the floor dominates)

  - rule_id: reviewer_scorecard_strikes
    name: "Reviewer strike total and removal threshold"
    applies_to: "Reviewer.scorecard_strikes, Reviewer.engagement_status"
    algorithm_type: aggregation
    trigger: "recomputed immediately after any ScorecardEvent is appended (pace shortfall on submit, QC failure or privilege miss on sample validation, clean-sample credit)"
    formula: |
      running = 0
      for each ScorecardEvent of the reviewer in created_at ASC order:
          running = max(0, running + event.strike_delta)
      scorecard_strikes = running

      Removal evaluation, run immediately after each append:
        remove when scorecard_strikes >= REMOVAL_STRIKE_THRESHOLD
                 OR (accuracy_score < ACCURACY_FLOOR_FOR_REMOVAL
                     AND total sampled documents >= ACCURACY_FLOOR_MIN_SAMPLED_DOCS)
      The floor-at-zero is applied AT EVERY STEP, not once at the end: the
      sequence (+1, -1, -1, +1, +1) yields 2, not 1, because the third event
      cannot push the running total below zero.
    input_set: "every ScorecardEvent of the reviewer, plus the reviewer's SAMPLE_WEIGHTED accuracy_score"
    constants:
      REMOVAL_STRIKE_THRESHOLD: 3
      ACCURACY_FLOOR_FOR_REMOVAL: 0.9000
      ACCURACY_FLOOR_MIN_SAMPLED_DOCS: 50
      CLEAN_SAMPLE_CREDIT: -1
    precision: "integer, never negative"
    worked_example: |
      Events (+1 PACE_SHORTFALL, -1 CLEARED_STRIKE, -1 CLEARED_STRIKE,
      +1 QC_FAILURE, +1 QC_FAILURE):
        step-wise: 1, 0, max(0,-1)=0, 1, 2  -> scorecard_strikes = 2, no removal
        naive sum: 1 - 1 - 1 + 1 + 1 = 1    -> WRONG
      A third QC_FAILURE takes the running total to 3 -> the reviewer is REMOVED.

  - rule_id: onsite_seat_occupancy
    name: "Onsite secure-seat occupancy over a half-open window"
    applies_to: "POST /sessions (ERR_ONSITE_SEATS_EXHAUSTED)"
    algorithm_type: interval_merge
    trigger: "POST /sessions with workstation_class == ONSITE_SECURE"
    formula: |
      For the requested window [starts_at_utc, ends_at_utc):
        occupancy = count of SecureEnvironmentSession rows where
            session.matter_id == the requested matter_id
            AND session.workstation_class == ONSITE_SECURE
            AND session.status in {SCHEDULED, ACTIVE}
            AND session.starts_at_utc < requested.ends_at_utc
            AND session.ends_at_utc  > requested.starts_at_utc
        reject with ERR_ONSITE_SEATS_EXHAUSTED when
            occupancy + 1 > matter.onsite_seat_count
      The interval is HALF-OPEN: a session ending exactly when another begins
      does NOT count as overlapping, so back-to-back windows share one seat.
      REVOKED and CLOSED sessions never occupy a seat.

      Contrast with confidentiality coverage, which is CLOSED on both ends:
        overlap when existing.coverage_start_utc <= requested.coverage_end_utc
                AND existing.coverage_end_utc   >= requested.coverage_start_utc
      so two coverage intervals that merely TOUCH at an endpoint DO collide
      (ERR_CA_COVERAGE_OVERLAP). The two entities deliberately use different
      endpoint semantics.
    input_set: "every SecureEnvironmentSession of the matter with status SCHEDULED or ACTIVE and workstation_class ONSITE_SECURE"
    constants:
      SEAT_COUNT_SOURCE: "Matter.onsite_seat_count"
    precision: "integer count; UTC instants compared to whole seconds"
    worked_example: |
      matter.onsite_seat_count 2. Existing SCHEDULED sessions
      [08-01T00:00Z, 08-05T00:00Z) and [08-03T00:00Z, 08-07T00:00Z).
        request [08-04T00:00Z, 08-06T00:00Z) -> overlaps both -> occupancy 2,
          2 + 1 > 2 -> ERR_ONSITE_SEATS_EXHAUSTED
        request [08-05T00:00Z, 08-09T00:00Z) -> the first session ends exactly
          at 08-05T00:00Z so it does NOT overlap; occupancy 1, 1 + 1 <= 2 -> 201
# =============================================================================
# §1.4 Validation Rules — evaluated in strict ascending `priority` order.
# The FIRST rule whose condition is violated returns its error and stops.
# Priorities are globally unique.
# =============================================================================
validations:

  # ---- auth / authz (1-3) ---------------------------------------------------
  - priority: 1
    category: auth
    rule: "X-Role and X-User-ID request headers must both be present and non-blank on every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_MISSING_AUTH_HEADERS
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    rule: "X-Role must name one of the five declared roles (EngagementManager, StaffingCoordinator, QCLead, Reviewer, ClientCounsel)"
    error_id: ERR_UNKNOWN_ROLE
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 3
    category: authz
    rule: "X-Role must appear in the target endpoint's `roles` list"
    error_id: ERR_ROLE_NOT_PERMITTED
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  # ---- existence (4-5) -----------------------------------------------------
  - priority: 4
    category: existence
    rule: "every {id} path segment must resolve to a stored row of the declared entity"
    error_id: "ERR_MATTER_NOT_FOUND | ERR_CLIENT_NOT_FOUND | ERR_PROTOCOL_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_QC_SAMPLE_NOT_FOUND | ERR_PRIVILEGE_ENTRY_NOT_FOUND"
    applies_to: "every path carrying an {id}"

  - priority: 5
    category: existence
    rule: "every foreign key supplied in a request BODY must resolve to a stored row (matter_id, reviewer_id, batch_id, validated_by_reviewer_id, client_id)"
    error_id: "ERR_MATTER_NOT_FOUND | ERR_CLIENT_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_BATCH_NOT_FOUND"
    applies_to: "POST /matters, POST /conflicts-screenings, POST /confidentiality-agreements, POST /sessions, POST /batches/{id}/assignments, POST /batches/{id}/qc-samples, POST /batches/{id}/privilege-log-entries"

  # ---- ownership (6-7) -----------------------------------------------------
  - priority: 6
    category: authz
    rule: "when X-Role is Reviewer, X-User-ID must equal the Reviewer id that owns the target row (agreement.reviewer_id, session.reviewer_id, assignment.reviewer_id, entry.authored_by_reviewer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    applies_to: "POST /confidentiality-agreements/{id}/execute, POST /sessions, POST /sessions/{id}/lifecycle, POST /assignments/{id}/start, POST /assignments/{id}/progress, POST /assignments/{id}/submit, POST /batches/{id}/privilege-log-entries, POST /privilege-log-entries/{id}/amend"

  - priority: 7
    category: authz
    rule: "when X-Role is ClientCounsel, X-User-ID must equal the Client id of the matter the target row belongs to"
    error_id: ERR_NOT_MATTER_CLIENT
    applies_to: "POST /protocols/{id}/client-decision, POST /conflicts-screenings/{id}/waiver, GET /matters/{id}, GET /matters/{id}/spend-projection"

  # ---- request shape (8-9) -------------------------------------------------
  - priority: 8
    category: request_shape
    rule: "every required input field must be present, of the declared type, within its declared enum, and numerically non-negative where the field is a count, amount or percentage; unknown fields are ignored"
    error_id: ERR_INVALID_REQUEST
    applies_to: "all write endpoints"
    http_status: 422

  - priority: 9
    category: request_shape
    rule: "for any pair of instants in one payload the start must be strictly before the end (session starts_at_utc < ends_at_utc; agreement coverage_start_utc < coverage_end_utc)"
    error_id: ERR_INVALID_TIME_WINDOW
    applies_to: "POST /sessions, POST /confidentiality-agreements"
    http_status: 422

  # ---- optimistic concurrency (10-11) -------------------------------------
  - priority: 10
    category: occ
    rule: "expected_matter_version must equal the Matter's current version"
    error_id: ERR_STALE_MATTER_VERSION
    applies_to: "POST /matters/{id}/protocols"
    http_status: 412

  - priority: 11
    category: occ
    rule: "expected_batch_version must equal the Batch's current version"
    error_id: ERR_STALE_BATCH_VERSION
    applies_to: "POST /batches/{id}/assignments, POST /batches/{id}/auto-assign"
    http_status: 412

  # ---- state (12-16) -------------------------------------------------------
  - priority: 12
    category: state
    rule: "the target row's current status must permit the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    applies_to: "all transition endpoints"
    http_status: 409

  - priority: 13
    category: state
    rule: "the governing Matter must not be SUSPENDED"
    error_id: ERR_MATTER_SUSPENDED
    applies_to: "POST /protocols/{id}/submit, POST /protocols/{id}/client-decision, POST /conflicts-screenings, POST /conflicts-screenings/{id}/decision, POST /confidentiality-agreements/{id}/execute, POST /sessions, POST /sessions/{id}/lifecycle, POST /matters/{id}/batches, POST /batches/{id}/assignments, POST /batches/{id}/auto-assign, POST /assignments/{id}/start, POST /assignments/{id}/progress, POST /assignments/{id}/submit, POST /batches/{id}/qc-samples, POST /qc-samples/{id}/validate, POST /batches/{id}/release"
    http_status: 409

  - priority: 14
    category: state
    rule: "the referenced Reviewer must not have engagement_status REMOVED"
    error_id: ERR_REVIEWER_REMOVED
    applies_to: "POST /conflicts-screenings, POST /confidentiality-agreements, POST /sessions, POST /batches/{id}/assignments, POST /reviewers/{id}/credential-status"
    http_status: 409

  - priority: 15
    category: state
    rule: "the Matter must have exactly one ReviewProtocol whose status is APPROVED"
    error_id: ERR_PROTOCOL_NOT_APPROVED
    applies_to: "POST /matters/{id}/batches, POST /batches/{id}/assignments, POST /batches/{id}/auto-assign, POST /batches/{id}/qc-samples, POST /batches/{id}/release"
    http_status: 409

  - priority: 16
    category: state
    rule: "the Matter status must be IN_REVIEW, i.e. staffed_reviewer_count >= min_staffed_reviewers"
    error_id: ERR_MIN_STAFFING_UNMET
    applies_to: "POST /batches/{id}/assignments, POST /batches/{id}/auto-assign"
    http_status: 409

  # ---- business_safety (17-25) --------------------------------------------
  - priority: 17
    category: business_safety
    rule: "a ConflictsScreening for (reviewer_id, matter_id) with status CLEARED must exist"
    error_id: ERR_CONFLICTS_NOT_CLEARED
    applies_to: "POST /confidentiality-agreements, POST /batches/{id}/assignments"
    http_status: 409

  - priority: 18
    category: business_safety
    rule: "a ConfidentialityAgreement for (reviewer_id, matter_id) with status EXECUTED must exist and the logical clock must lie inside its closed coverage interval"
    error_id: ERR_CONFIDENTIALITY_NOT_EXECUTED
    applies_to: "POST /sessions, POST /batches/{id}/assignments, POST /assignments/{id}/start, POST /assignments/{id}/progress, POST /assignments/{id}/submit"
    http_status: 409

  - priority: 19
    category: business_safety
    rule: "the Reviewer's credential_status must be VERIFIED"
    error_id: ERR_CREDENTIAL_NOT_VERIFIED
    applies_to: "POST /batches/{id}/assignments, POST /assignments/{id}/start"
    http_status: 409

  - priority: 20
    category: business_safety
    rule: "the SECOND_LEVEL assignment of a batch must name a different reviewer than that batch's FIRST_PASS assignment"
    error_id: ERR_SECOND_LEVEL_SAME_REVIEWER
    applies_to: "POST /batches/{id}/assignments, POST /batches/{id}/auto-assign"
    http_status: 409

  - priority: 21
    category: business_safety
    rule: "validated_by_reviewer_id must not hold any non-VOIDED Assignment on the batch being sampled"
    error_id: ERR_QC_VALIDATOR_CONFLICT
    applies_to: "POST /batches/{id}/qc-samples"
    http_status: 409

  - priority: 22
    category: business_safety
    rule: "a REMOTE_VDI session requires both matter.remote_work_permitted and reviewer.remote_work_authorized to be true"
    error_id: ERR_REMOTE_WORK_NOT_AUTHORIZED
    applies_to: "POST /sessions"
    http_status: 403

  - priority: 23
    category: business_safety
    rule: "the reviewer must hold a SecureEnvironmentSession on this matter with status ACTIVE whose half-open window contains the logical clock"
    error_id: ERR_NO_ACTIVE_SESSION
    applies_to: "POST /assignments/{id}/progress, POST /assignments/{id}/submit, POST /batches/{id}/privilege-log-entries, POST /privilege-log-entries/{id}/amend"
    http_status: 409

  - priority: 24
    category: business_safety
    rule: "at release, the count of VALIDATED PrivilegeLogEntry rows on the batch must be at least privilege_validation_quota = max(PRIVILEGE_VALIDATION_FLOOR 2, ceil(total entries * protocol.privilege_sample_pct)), and no entry may be CHALLENGED"
    error_id: ERR_PRIVILEGE_LOG_INCOMPLETE
    applies_to: "POST /batches/{id}/release"
    http_status: 409

  - priority: 25
    category: business_safety
    rule: "at submit, assignment.documents_coded must equal batch.document_count and assignment.privilege_hits_logged must equal the number of PrivilegeLogEntry rows this reviewer authored on the batch"
    error_id: ERR_ASSIGNMENT_INCOMPLETE
    applies_to: "POST /assignments/{id}/submit"
    http_status: 409

  # ---- business_referential (26-27) ---------------------------------------
  - priority: 26
    category: business_referential
    rule: "at most one ConflictsScreening per (reviewer_id, matter_id) may be in a non-terminal status (PENDING, WAIVER_REQUIRED, CLEARED)"
    error_id: ERR_SCREENING_ALREADY_OPEN
    applies_to: "POST /conflicts-screenings"
    http_status: 409

  - priority: 27
    category: business_referential
    rule: "coverage intervals of ConfidentialityAgreement rows for the same (reviewer_id, matter_id) whose status is in {PENDING, EXECUTED} must not overlap, where the interval is CLOSED on both ends so touching endpoints DO collide"
    error_id: ERR_CA_COVERAGE_OVERLAP
    applies_to: "POST /confidentiality-agreements"
    http_status: 409

  # ---- business_temporal (28-31) ------------------------------------------
  - priority: 28
    category: business_temporal
    rule: "the logical clock must be strictly before matter.deadline_utc"
    error_id: ERR_MATTER_DEADLINE_PASSED
    applies_to: "POST /matters/{id}/batches, POST /batches/{id}/assignments, POST /batches/{id}/auto-assign"
    http_status: 409

  - priority: 29
    category: business_temporal
    rule: "the requested session window must lie entirely inside the reviewer's EXECUTED ConfidentialityAgreement coverage interval for the matter (coverage_start_utc <= starts_at_utc and ends_at_utc <= coverage_end_utc)"
    error_id: ERR_SESSION_OUTSIDE_COVERAGE
    applies_to: "POST /sessions"
    http_status: 422

  - priority: 30
    category: business_temporal
    rule: "one reviewer may not hold two SecureEnvironmentSession rows in status {SCHEDULED, ACTIVE} whose HALF-OPEN windows overlap, across all matters"
    error_id: ERR_SESSION_WINDOW_OVERLAP
    applies_to: "POST /sessions"
    http_status: 409

  - priority: 31
    category: business_temporal
    rule: "the number of ONSITE_SECURE sessions of the matter in status {SCHEDULED, ACTIVE} whose HALF-OPEN windows overlap the request, plus one, must not exceed matter.onsite_seat_count"
    error_id: ERR_ONSITE_SEATS_EXHAUSTED
    applies_to: "POST /sessions"
    http_status: 409

  # ---- business_constraint (32-42) ----------------------------------------
  - priority: 32
    category: business_constraint
    rule: "matter.required_bar_states must be a subset of reviewer.bar_admissions"
    error_id: ERR_BAR_ADMISSION_MISSING
    applies_to: "POST /batches/{id}/assignments"
    http_status: 422

  - priority: 33
    category: business_constraint
    rule: "reviewer.active_assignment_count (assignments in ASSIGNED, IN_PROGRESS or REOPENED) must be strictly less than reviewer.max_concurrent_batches"
    error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    applies_to: "POST /batches/{id}/assignments"
    http_status: 409

  - priority: 34
    category: business_constraint
    rule: "matter.required_languages must be a subset of reviewer.languages"
    error_id: ERR_LANGUAGE_REQUIREMENT_UNMET
    applies_to: "POST /batches/{id}/assignments"
    http_status: 422

  - priority: 35
    category: business_constraint
    rule: "reviewer.tier must equal the requested pass_type"
    error_id: ERR_TIER_MISMATCH
    applies_to: "POST /batches/{id}/assignments"
    http_status: 422

  - priority: 36
    category: business_constraint
    rule: "the auto-assign eligibility pool must contain at least one Reviewer"
    error_id: ERR_NO_ELIGIBLE_REVIEWER
    applies_to: "POST /batches/{id}/auto-assign"
    http_status: 409

  - priority: 37
    category: business_constraint
    rule: "batch document_count must be at least 1"
    error_id: ERR_ZERO_DOCUMENT_BATCH
    applies_to: "POST /matters/{id}/batches"
    http_status: 422

  - priority: 38
    category: business_constraint
    rule: "batch document_count must not exceed matter.unbatched_document_count"
    error_id: ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS
    applies_to: "POST /matters/{id}/batches"
    http_status: 422

  - priority: 39
    category: business_constraint
    rule: "assignment documents_coded must never decrease and must never exceed batch.document_count; minutes_logged and privilege_hits_logged must never decrease (an unchanged value is accepted)"
    error_id: ERR_DOCUMENT_COUNT_EXCEEDED
    applies_to: "POST /assignments/{id}/progress"
    http_status: 422

  - priority: 40
    category: business_constraint
    rule: "coding_error_count + privilege_error_count must not exceed sample.sampled_document_count"
    error_id: ERR_ERROR_COUNT_EXCEEDS_SAMPLE
    applies_to: "POST /qc-samples/{id}/validate"
    http_status: 422

  - priority: 41
    category: business_constraint
    rule: "a batch may only be dissolved while CREATED and while it carries no Assignment row whose status is not VOIDED"
    error_id: ERR_BATCH_NOT_DISSOLVABLE
    applies_to: "POST /batches/{id}/dissolve"
    http_status: 409

  - priority: 42
    category: business_constraint
    rule: "a matter may only close when every Batch is RELEASED or DISSOLVED, unbatched_document_count == 0, and every PrivilegeLogEntry of the matter is FINAL"
    error_id: ERR_MATTER_NOT_CLOSEABLE
    applies_to: "POST /matters/{id}/close"
    http_status: 409

  # ---- business_fiscal (43) -----------------------------------------------
  - priority: 43
    category: business_fiscal
    rule: "matter.committed_spend_cents + the new assignment's committed_amount_cents must not exceed matter.budget_cap_cents; equality is permitted"
    error_id: ERR_BUDGET_WOULD_EXCEED
    applies_to: "POST /batches/{id}/assignments, POST /batches/{id}/auto-assign"
    http_status: 402
# =============================================================================
# §1.5 API Endpoint Table — api_prefix is "" so every path below is absolute.
# =============================================================================
endpoints:

  # ---- test-driving clock --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, coverage-interval, session-window and expiry rule reads. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time. Auth headers are not required."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer, ClientCounsel]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "re-evaluates lazy ConfidentialityAgreement expiry on the next request that touches an agreement"
      - "changes Matter.required_pace_dph on the next read"

  # ---- Client / Matter ----------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Registers an instructing client. The returned id is the X-User-ID a ClientCounsel caller must present."
    roles: [EngagementManager]
    code: 201
    input: [legal_name, primary_state]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Reads one client with its computed matter_count."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/matters"
    description: "Opens a review matter in INTAKE with its document volume, deadline, complexity tier, staffing requirements and pricing terms."
    roles: [EngagementManager]
    code: 201
    input: [client_id, name, document_count, deadline_utc, complexity_tier, required_languages, required_bar_states, subject_matter_tags, pricing_model, "per_document_rate_cents?", "hourly_rate_cents?", budget_cap_cents, "min_staffed_reviewers?", "onsite_seat_count?", "remote_work_permitted?"]
    output: Matter
    side_effects:
      - "unbatched_document_count is initialised to document_count"
      - "computes required_pace_dph from the deadline and the logical clock"

  - method: GET
    path: "/matters/{id}"
    description: "Reads one matter with staffed_reviewer_count, committed_spend_cents, unbatched_document_count and required_pace_dph recomputed. A ClientCounsel caller must own the matter."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel]
    code: 200
    input: []
    output: Matter
    side_effects:
      - "applies lazy ConfidentialityAgreement expiry, which can move the matter IN_REVIEW -> STAFFING"

  - method: GET
    path: "/matters"
    description: "Lists matters, optionally filtered by instructing client or status."
    roles: [EngagementManager, StaffingCoordinator, QCLead]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Matter[]
    side_effects: []

  - method: POST
    path: "/matters/{id}/suspension"
    description: "Suspends or resumes a matter. Suspension revokes every SCHEDULED or ACTIVE secure-environment session of the matter."
    roles: [EngagementManager]
    code: 200
    input: [suspended, "suspension_reason?"]
    output: Matter
    side_effects:
      - "on suspend: sessions in {SCHEDULED, ACTIVE} -> REVOKED with closed_at stamped"
      - "on resume: recomputes staffed_reviewer_count and may continue STAFFING -> IN_REVIEW"

  - method: POST
    path: "/matters/{id}/close"
    description: "Closes a matter once every batch is released or dissolved, no documents remain unbatched and every privilege log entry is FINAL."
    roles: [EngagementManager]
    code: 200
    input: []
    output: Matter
    side_effects:
      - "Assignment rows in SUBMITTED -> COMPLETED"

  - method: GET
    path: "/matters/{id}/spend-projection"
    description: "Computed read. Returns BOTH spend bases (remaining-work and ledger-replay), their variance, and the pinned invoice waterfall (gross -> QC surcharge -> volume-discount band). `basis` overrides the status-derived default."
    roles: [EngagementManager, ClientCounsel]
    code: 200
    input: ["basis?"]
    output:
      matter_id: string
      basis_applied: string
      remaining_work_basis_cents: integer
      ledger_replay_basis_cents: integer
      variance_cents: integer
      gross_billable_cents: integer
      qc_surcharge_cents: integer
      provisional_total_cents: integer
      volume_discount_pct: number
      volume_discount_cents: integer
      invoice_total_cents: integer
      budget_cap_cents: integer
      budget_headroom_cents: integer
    side_effects: []

  - method: GET
    path: "/matters/{id}/budget-ledger"
    description: "Lists the matter's immutable budget ledger in created_at ASC order — the only discovery channel for cascade-created COMMITMENT, REVERSAL and ACTUAL_* rows."
    roles: [EngagementManager, ClientCounsel]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: BudgetLedgerEntry[]
    side_effects: []

  # ---- ReviewProtocol -----------------------------------------------------
  - method: POST
    path: "/matters/{id}/protocols"
    description: "Mints the next ReviewProtocol revision in DRAFT and supersedes any earlier revision. Guarded by expected_matter_version because a revision pushes the matter back to PROTOCOL_PENDING."
    roles: [EngagementManager]
    code: 201
    input: [expected_matter_version, issue_codes, privilege_criteria, qc_sample_pct, privilege_sample_pct, max_discrepancy_pct, min_pace_dph, second_level_required]
    output: ReviewProtocol
    side_effects:
      - "any prior ReviewProtocol in DRAFT, CLIENT_REVIEW or APPROVED -> SUPERSEDED"
      - "Matter INTAKE|STAFFING|IN_REVIEW -> PROTOCOL_PENDING and Matter.version increments"

  - method: GET
    path: "/protocols/{id}"
    description: "Reads one protocol revision."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel, Reviewer]
    code: 200
    input: []
    output: ReviewProtocol
    side_effects: []

  - method: GET
    path: "/protocols"
    description: "Lists protocol revisions, optionally filtered by matter or status."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel, Reviewer]
    code: 200
    input: ["matter_id?", "status?", "limit?", "offset?"]
    output: ReviewProtocol[]
    side_effects: []

  - method: POST
    path: "/protocols/{id}/submit"
    description: "Sends a DRAFT protocol to the client for review."
    roles: [EngagementManager]
    code: 200
    input: []
    output: ReviewProtocol
    side_effects: []

  - method: POST
    path: "/protocols/{id}/client-decision"
    description: "Client approves the protocol or returns it to DRAFT with change notes. Approval opens staffing on the matter."
    roles: [ClientCounsel]
    code: 200
    input: [decision, "change_notes?"]
    output: ReviewProtocol
    side_effects:
      - "APPROVE: stamps approved_at; Matter PROTOCOL_PENDING -> STAFFING and onward to IN_REVIEW when staffed_reviewer_count >= min_staffed_reviewers"
      - "REQUEST_CHANGES: stores change_notes and returns the protocol to DRAFT with no matter movement"

  # ---- Reviewer -----------------------------------------------------------
  - method: POST
    path: "/reviewers"
    description: "Sources a contract reviewer with bar admissions, languages, subject-matter tags, pass tier and cost. Starts UNVERIFIED / SOURCED. The returned id is the X-User-ID a Reviewer caller must present."
    roles: [StaffingCoordinator]
    code: 201
    input: [full_name, bar_admissions, languages, subject_matter_tags, tier, hourly_cost_cents, "max_concurrent_batches?", "remote_work_authorized?"]
    output: Reviewer
    side_effects: []

  - method: GET
    path: "/reviewers/{id}"
    description: "Reads one reviewer with scorecard_strikes, accuracy_score (SAMPLE_WEIGHTED), pace_dph and active_assignment_count recomputed."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: []
    output: Reviewer
    side_effects: []

  - method: GET
    path: "/reviewers"
    description: "Lists reviewers, optionally filtered by engagement status, credential status or tier."
    roles: [EngagementManager, StaffingCoordinator, QCLead]
    code: 200
    input: ["engagement_status?", "credential_status?", "tier?", "limit?", "offset?"]
    output: Reviewer[]
    side_effects: []

  - method: POST
    path: "/reviewers/{id}/credential-status"
    description: "Moves the reviewer's credential axis (UNVERIFIED/LAPSED -> VERIFIED, VERIFIED -> LAPSED) and may replace bar_admissions. The engagement axis is untouched."
    roles: [StaffingCoordinator]
    code: 200
    input: [to_status, "bar_admissions?"]
    output: Reviewer
    side_effects:
      - "recomputes staffed_reviewer_count on every matter where this reviewer holds a CLEARED screening; a matter may move STAFFING -> IN_REVIEW or IN_REVIEW -> STAFFING"

  - method: GET
    path: "/reviewers/{id}/scorecard-events"
    description: "Lists the reviewer's immutable scorecard event stream in created_at ASC order — the only discovery channel for cascade-appended PACE_SHORTFALL, QC_FAILURE, PRIVILEGE_MISS, CLEARED_STRIKE and REMOVAL rows."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: ScorecardEvent[]
    side_effects: []

  - method: GET
    path: "/reviewers/{id}/scorecard"
    description: "Computed read. Returns the reviewer's strike total and accuracy under the requested weighting (default SAMPLE_WEIGHTED; ASSIGNMENT_MEAN gives every sampled batch equal weight)."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: ["weighting?"]
    output:
      reviewer_id: string
      weighting_applied: string
      accuracy_score: number
      sampled_document_count: integer
      total_error_count: integer
      scorecard_strikes: integer
      pace_dph: number
      engagement_status: string
      removal_threshold: integer
      removal_recommended: boolean
    side_effects: []

  # ---- ConflictsScreening -------------------------------------------------
  - method: POST
    path: "/conflicts-screenings"
    description: "Opens a conflicts screening of one reviewer against one matter, recording the adverse parties the reviewer declared."
    roles: [StaffingCoordinator]
    code: 201
    input: [reviewer_id, matter_id, declared_adverse_parties]
    output: ConflictsScreening
    side_effects: []

  - method: GET
    path: "/conflicts-screenings/{id}"
    description: "Reads one conflicts screening."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel]
    code: 200
    input: []
    output: ConflictsScreening
    side_effects: []

  - method: GET
    path: "/conflicts-screenings"
    description: "Lists conflicts screenings, optionally filtered by reviewer, matter or status."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel]
    code: 200
    input: ["reviewer_id?", "matter_id?", "status?", "limit?", "offset?"]
    output: ConflictsScreening[]
    side_effects: []

  - method: POST
    path: "/conflicts-screenings/{id}/decision"
    description: "Records the screening outcome (CLEARED, WAIVER_REQUIRED or BLOCKED). Re-screening a CLEARED row to BLOCKED opens the four-link revocation cascade."
    roles: [StaffingCoordinator]
    code: 200
    input: [outcome, "decision_note?"]
    output: ConflictsScreening
    side_effects:
      - "CLEARED: Reviewer SOURCED -> CLEARED; recomputes Matter.staffed_reviewer_count"
      - "BLOCKED from CLEARED: agreements {PENDING, EXECUTED} -> REVOKED; then sessions {SCHEDULED, ACTIVE} -> REVOKED and staffed_reviewer_count recomputed; then the reviewer's non-terminal assignments on that matter -> VOIDED in created_at ASC order with REVERSAL ledger rows and their {ASSIGNED, IN_PROGRESS} batches -> CREATED; then committed_spend_cents recomputed and Reviewer may fall to SOURCED"
      - "WAIVER_REQUIRED: no reviewer or staffing movement at all"

  - method: POST
    path: "/conflicts-screenings/{id}/waiver"
    description: "Client grants or refuses a conflicts waiver on a WAIVER_REQUIRED screening."
    roles: [ClientCounsel]
    code: 200
    input: [granted, "decision_note?"]
    output: ConflictsScreening
    side_effects:
      - "granted: screening -> CLEARED, Reviewer SOURCED -> CLEARED, staffed_reviewer_count recomputed"
      - "refused: screening -> BLOCKED"

  # ---- ConfidentialityAgreement ------------------------------------------
  - method: POST
    path: "/confidentiality-agreements"
    description: "Issues a confidentiality agreement covering one reviewer on one matter over a CLOSED coverage interval. Requires a CLEARED screening and forbids overlapping coverage, where touching endpoints count as overlapping."
    roles: [StaffingCoordinator]
    code: 201
    input: [reviewer_id, matter_id, coverage_start_utc, coverage_end_utc, "remote_work_addendum?"]
    output: ConfidentialityAgreement
    side_effects: []

  - method: GET
    path: "/confidentiality-agreements/{id}"
    description: "Reads one confidentiality agreement, applying lazy expiry against the logical clock first."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: []
    output: ConfidentialityAgreement
    side_effects:
      - "an EXECUTED agreement whose coverage_end_utc is before the clock becomes EXPIRED and the matter's staffed_reviewer_count is recomputed"

  - method: GET
    path: "/confidentiality-agreements"
    description: "Lists confidentiality agreements, optionally filtered by reviewer, matter or status."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: ["reviewer_id?", "matter_id?", "status?", "limit?", "offset?"]
    output: ConfidentialityAgreement[]
    side_effects:
      - "applies lazy expiry to every listed agreement"

  - method: POST
    path: "/confidentiality-agreements/{id}/execute"
    description: "The reviewer signs their own agreement. This is the gate that makes a reviewer count toward staffing, so it can carry the matter STAFFING -> IN_REVIEW."
    roles: [Reviewer]
    code: 200
    input: [signature_name]
    output: ConfidentialityAgreement
    side_effects:
      - "stamps executed_at from the logical clock"
      - "recomputes Matter.staffed_reviewer_count; STAFFING -> IN_REVIEW when min_staffed_reviewers is reached"

  # ---- SecureEnvironmentSession ------------------------------------------
  - method: POST
    path: "/sessions"
    description: "Schedules a secure review-environment window for a reviewer on a matter. ONSITE_SECURE windows consume one of the matter's onsite seats over a HALF-OPEN interval; REMOTE_VDI requires both matter and reviewer remote-work authorisation."
    roles: [Reviewer, StaffingCoordinator]
    code: 201
    input: [reviewer_id, matter_id, workstation_class, starts_at_utc, ends_at_utc]
    output: SecureEnvironmentSession
    side_effects: []

  - method: GET
    path: "/sessions/{id}"
    description: "Reads one secure-environment session."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: []
    output: SecureEnvironmentSession
    side_effects: []

  - method: GET
    path: "/sessions"
    description: "Lists secure-environment sessions, optionally filtered by reviewer, matter or status."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: ["reviewer_id?", "matter_id?", "status?", "limit?", "offset?"]
    output: SecureEnvironmentSession[]
    side_effects: []

  - method: POST
    path: "/sessions/{id}/lifecycle"
    description: "The reviewer activates their scheduled window or closes an active one. Coding, privilege logging and submission all require an ACTIVE window containing the clock."
    roles: [Reviewer]
    code: 200
    input: [to_status]
    output: SecureEnvironmentSession
    side_effects:
      - "ACTIVE: stamps activated_at"
      - "CLOSED: stamps closed_at and releases the onsite seat for later windows"

  # ---- Batch --------------------------------------------------------------
  - method: POST
    path: "/matters/{id}/batches"
    description: "Carves a batch of documents out of the matter's unbatched pool. Requires an APPROVED protocol and a deadline still in the future."
    roles: [EngagementManager]
    code: 201
    input: [document_count, "priority_rank?"]
    output: Batch
    side_effects:
      - "decrements Matter.unbatched_document_count by document_count"
      - "assigns batch_number = prior max for the matter + 1"
      - "freezes qc_sample_target_size from the APPROVED protocol's qc_sample_pct"
      - "Matter QC_CLOSEOUT -> IN_REVIEW when closeout had already begun"

  - method: GET
    path: "/batches/{id}"
    description: "Reads one batch with privilege_entry_count and qc_sample_target_size recomputed."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer, ClientCounsel]
    code: 200
    input: []
    output: Batch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "Lists batches, optionally filtered by matter or status."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer, ClientCounsel]
    code: 200
    input: ["matter_id?", "status?", "limit?", "offset?"]
    output: Batch[]
    side_effects: []

  - method: POST
    path: "/batches/{id}/dissolve"
    description: "Dissolves an unstarted CREATED batch and returns its documents to the matter's unbatched pool."
    roles: [EngagementManager]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "increments Matter.unbatched_document_count by document_count, restoring the document-conservation invariant"

  - method: POST
    path: "/batches/{id}/release"
    description: "Releases a QC-passed batch to the client. Requires the privilege validation quota to be met with no challenged entries."
    roles: [QCLead]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "every PrivilegeLogEntry of the batch (DRAFT or VALIDATED) -> FINAL"
      - "every Assignment of the batch in SUBMITTED -> COMPLETED"
      - "stamps released_at; Matter IN_REVIEW -> QC_CLOSEOUT when every batch is terminal and unbatched_document_count == 0"

  # ---- Assignment ---------------------------------------------------------
  - method: POST
    path: "/batches/{id}/assignments"
    description: "Assigns a named reviewer to a batch for the requested pass, pinning the effective per-document rate and the budget commitment. A second create for the same pass supersedes the active assignment. Guarded by expected_batch_version."
    roles: [StaffingCoordinator]
    code: 201
    input: [expected_batch_version, reviewer_id, pass_type]
    output: Assignment
    side_effects:
      - "pins effective_per_document_cents and committed_amount_cents, appends a COMMITMENT BudgetLedgerEntry and recomputes Matter.committed_spend_cents"
      - "Batch CREATED -> ASSIGNED; Reviewer CLEARED -> ENGAGED"
      - "on supersede: the prior same-pass assignment -> VOIDED with a REVERSAL ledger row, the new row records reassigned_from_assignment_id, and the batch returns to ASSIGNED"

  - method: POST
    path: "/batches/{id}/auto-assign"
    description: "Selects the best eligible reviewer for the requested pass by weighted score with a pinned tie-break chain, then creates the Assignment exactly as the named-reviewer endpoint would. Guarded by expected_batch_version."
    roles: [StaffingCoordinator]
    code: 201
    input: [expected_batch_version, pass_type]
    output: Assignment
    side_effects:
      - "same commitment, ledger, batch and reviewer side effects as POST /batches/{id}/assignments"
      - "an empty eligibility pool returns ERR_NO_ELIGIBLE_REVIEWER and writes nothing"

  - method: GET
    path: "/assignments/{id}"
    description: "Reads one assignment with effective_per_document_cents, committed_amount_cents, billable_amount_cents, pace_dph and accuracy_pct."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "Lists assignments, optionally filtered by batch, reviewer, supersede ancestor or status."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer]
    code: 200
    input: ["batch_id?", "reviewer_id?", "reassigned_from_assignment_id?", "status?", "pass_type?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/assignments/{id}/budget-ledger"
    description: "Lists the ledger rows this assignment caused, in created_at ASC order — the COMMITMENT, its REVERSAL and any ACTUAL_* row."
    roles: [EngagementManager, StaffingCoordinator, ClientCounsel]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: BudgetLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/assignments/{id}/start"
    description: "The assigned reviewer begins (or resumes after a QC failure) coding the batch. Requires a VERIFIED credential and live confidentiality coverage."
    roles: [Reviewer]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "stamps started_at on the first start only"
      - "Batch ASSIGNED -> IN_PROGRESS, or QC_FAILED -> IN_PROGRESS on a rework cycle"

  - method: POST
    path: "/assignments/{id}/progress"
    description: "Records monotonically increasing coded-document, logged-minute and privilege-hit counters. Requires an ACTIVE secure session containing the clock."
    roles: [Reviewer]
    code: 200
    input: [documents_coded, minutes_logged, "privilege_hits_logged?"]
    output: Assignment
    side_effects:
      - "recomputes pace_dph and the matter's required_pace_dph"
      - "counters may never decrease and documents_coded may never exceed batch.document_count"

  - method: POST
    path: "/assignments/{id}/submit"
    description: "Submits the completed pass. The first submit freezes and bills the assignment; a rework resubmission is deliberately non-billable."
    roles: [Reviewer]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "first submit only: appends the ACTUAL_PER_DOCUMENT or ACTUAL_HOURLY BudgetLedgerEntry plus the REVERSAL of the COMMITMENT, sets billable_amount_cents and recomputes Matter.committed_spend_cents"
      - "pace_dph below protocol.min_pace_dph appends ScorecardEvent(PACE_SHORTFALL, +1) and runs the removal evaluation"
      - "Batch IN_PROGRESS -> SECOND_LEVEL or -> QC_SAMPLING per protocol.second_level_required; SECOND_LEVEL -> QC_SAMPLING on the second-level submit"

  - method: POST
    path: "/assignments/{id}/void"
    description: "Voids a non-terminal assignment and reverses its budget commitment."
    roles: [StaffingCoordinator]
    code: 200
    input: [void_reason]
    output: Assignment
    side_effects:
      - "appends a REVERSAL BudgetLedgerEntry of -committed_amount_cents (appended only for an assignment whose billable_amount_cents == 0; a billed assignment keeps its ACTUAL_* row and is not reversed twice) and recomputes Matter.committed_spend_cents"
      - "Batch ASSIGNED|IN_PROGRESS -> CREATED when no non-VOIDED assignment of that pass remains"
      - "Reviewer engagement_status recomputed; matter may fall IN_REVIEW -> STAFFING"

  # ---- QCSample -----------------------------------------------------------
  - method: POST
    path: "/batches/{id}/qc-samples"
    description: "Draws the second-level QC sample for a batch in QC_SAMPLING, freezing sampled_document_count from the protocol's sampling plan. The validating reviewer must hold no assignment on the batch."
    roles: [QCLead]
    code: 201
    input: [validated_by_reviewer_id]
    output: QCSample
    side_effects:
      - "freezes sampled_document_count = min(max(10, ceil(document_count * qc_sample_pct)), document_count)"

  - method: GET
    path: "/qc-samples/{id}"
    description: "Reads one QC sample with its discrepancy_rate."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel]
    code: 200
    input: []
    output: QCSample
    side_effects: []

  - method: GET
    path: "/qc-samples"
    description: "Lists QC samples, optionally filtered by batch, validating reviewer or outcome."
    roles: [EngagementManager, StaffingCoordinator, QCLead, ClientCounsel]
    code: 200
    input: ["batch_id?", "validated_by_reviewer_id?", "outcome?", "limit?", "offset?"]
    output: QCSample[]
    side_effects: []

  - method: POST
    path: "/qc-samples/{id}/validate"
    description: "Records the sample's coding and privilege error counts, computes the discrepancy rate and passes or fails the batch. Failure at or above the protocol threshold opens the four-link rework/removal cascade."
    roles: [QCLead]
    code: 200
    input: [coding_error_count, privilege_error_count]
    output: QCSample
    side_effects:
      - "PASSED: Batch QC_SAMPLING -> QC_PASSED; a zero-error sample appends ScorecardEvent(CLEARED_STRIKE, -1)"
      - "FAILED: Batch -> QC_FAILED; then the FIRST_PASS assignment -> REOPENED with ScorecardEvent(QC_FAILURE, +1) and a further PRIVILEGE_MISS strike when privilege_error_count > 0; then the removal evaluation may set Reviewer -> REMOVED; then the removed reviewer's other non-terminal assignments -> VOIDED with REVERSAL rows, their batches -> CREATED, and matter staffing and committed spend are recomputed"
      - "recomputes Reviewer.accuracy_score under SAMPLE_WEIGHTED"

  # ---- PrivilegeLogEntry --------------------------------------------------
  - method: POST
    path: "/batches/{id}/privilege-log-entries"
    description: "The coding reviewer logs a withheld or redacted document. authored_by_reviewer_id is taken from X-User-ID and matter_id is denormalised from the batch."
    roles: [Reviewer]
    code: 201
    input: [document_ref, privilege_basis, disposition]
    output: PrivilegeLogEntry
    side_effects:
      - "increments Batch.privilege_entry_count and raises the batch's privilege_validation_quota"

  - method: GET
    path: "/privilege-log-entries/{id}"
    description: "Reads one privilege log entry."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer, ClientCounsel]
    code: 200
    input: []
    output: PrivilegeLogEntry
    side_effects: []

  - method: GET
    path: "/privilege-log-entries"
    description: "Lists privilege log entries, optionally filtered by matter, batch, author or status — the client-facing privilege log export."
    roles: [EngagementManager, StaffingCoordinator, QCLead, Reviewer, ClientCounsel]
    code: 200
    input: ["matter_id?", "batch_id?", "authored_by_reviewer_id?", "status?", "limit?", "offset?"]
    output: PrivilegeLogEntry[]
    side_effects: []

  - method: POST
    path: "/privilege-log-entries/{id}/validate"
    description: "QC accepts an entry into the validated sample or challenges it back to the authoring reviewer."
    roles: [QCLead]
    code: 200
    input: [accepted, "challenge_note?"]
    output: PrivilegeLogEntry
    side_effects:
      - "accepted: stamps validated_at and counts toward the release quota"
      - "challenged: stores challenge_note and blocks release until amended"

  - method: POST
    path: "/privilege-log-entries/{id}/amend"
    description: "The authoring reviewer amends a challenged entry, returning it to DRAFT for re-validation."
    roles: [Reviewer]
    code: 200
    input: [privilege_basis, disposition]
    output: PrivilegeLogEntry
    side_effects:
      - "clears challenge_note to null"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth / authz -------------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-Role or X-User-ID header absent or blank"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Reviewer caller's X-User-ID is not the reviewer that owns the target agreement, session, assignment or privilege log entry"
  - id: ERR_NOT_MATTER_CLIENT
    http: 403
    condition: "a ClientCounsel caller's X-User-ID is not the Client of the matter the target row belongs to"

  # ---- not found ----------------------------------------------------------
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "no Client with the supplied id"
  - id: ERR_MATTER_NOT_FOUND
    http: 404
    condition: "no Matter with the supplied id"
  - id: ERR_PROTOCOL_NOT_FOUND
    http: 404
    condition: "no ReviewProtocol with the supplied id"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "no Reviewer with the supplied id"
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "no ConflictsScreening with the supplied id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no ConfidentialityAgreement with the supplied id"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "no SecureEnvironmentSession with the supplied id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no Batch with the supplied id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no Assignment with the supplied id"
  - id: ERR_QC_SAMPLE_NOT_FOUND
    http: 404
    condition: "no QCSample with the supplied id"
  - id: ERR_PRIVILEGE_ENTRY_NOT_FOUND
    http: 404
    condition: "no PrivilegeLogEntry with the supplied id"

  # ---- request shape / OCC ------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required field is missing, mistyped, outside its enum, or a count/amount/percentage is negative"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "a window's start instant is not strictly before its end instant"
  - id: ERR_STALE_MATTER_VERSION
    http: 412
    condition: "expected_matter_version does not equal the Matter's current version"
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_batch_version does not equal the Batch's current version"

  # ---- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row's current status does not permit the requested transition"
  - id: ERR_MATTER_SUSPENDED
    http: 409
    condition: "the governing Matter is SUSPENDED"
  - id: ERR_REVIEWER_REMOVED
    http: 409
    condition: "the referenced Reviewer has engagement_status REMOVED"
  - id: ERR_PROTOCOL_NOT_APPROVED
    http: 409
    condition: "the Matter has no ReviewProtocol in status APPROVED"
  - id: ERR_MIN_STAFFING_UNMET
    http: 409
    condition: "the Matter is not IN_REVIEW because staffed_reviewer_count is below min_staffed_reviewers"

  # ---- business safety ----------------------------------------------------
  - id: ERR_CONFLICTS_NOT_CLEARED
    http: 409
    condition: "no CLEARED ConflictsScreening exists for the (reviewer, matter) pair"
  - id: ERR_CONFIDENTIALITY_NOT_EXECUTED
    http: 409
    condition: "no EXECUTED ConfidentialityAgreement covers the (reviewer, matter) pair at the logical clock"
  - id: ERR_CREDENTIAL_NOT_VERIFIED
    http: 409
    condition: "the Reviewer's credential_status is UNVERIFIED or LAPSED"
  - id: ERR_SECOND_LEVEL_SAME_REVIEWER
    http: 409
    condition: "the second-level reviewer is the same person who performed the first pass on that batch"
  - id: ERR_QC_VALIDATOR_CONFLICT
    http: 409
    condition: "the nominated QC validator holds a non-VOIDED Assignment on the batch being sampled"
  - id: ERR_REMOTE_WORK_NOT_AUTHORIZED
    http: 403
    condition: "a REMOTE_VDI session was requested but the matter forbids remote work or the reviewer is not remote-authorised"
  - id: ERR_NO_ACTIVE_SESSION
    http: 409
    condition: "the reviewer has no ACTIVE secure-environment session on the matter whose half-open window contains the logical clock"
  - id: ERR_PRIVILEGE_LOG_INCOMPLETE
    http: 409
    condition: "the batch has fewer VALIDATED privilege log entries than its validation quota, or at least one entry is still CHALLENGED"
  - id: ERR_ASSIGNMENT_INCOMPLETE
    http: 409
    condition: "documents_coded does not equal batch.document_count, or privilege_hits_logged does not match the entries the reviewer actually authored"

  # ---- business referential ----------------------------------------------
  - id: ERR_SCREENING_ALREADY_OPEN
    http: 409
    condition: "a non-terminal ConflictsScreening already exists for the (reviewer, matter) pair"
  - id: ERR_CA_COVERAGE_OVERLAP
    http: 409
    condition: "the requested closed coverage interval overlaps or touches an existing PENDING/EXECUTED agreement for the same (reviewer, matter) pair"

  # ---- business temporal --------------------------------------------------
  - id: ERR_MATTER_DEADLINE_PASSED
    http: 409
    condition: "the logical clock is at or after matter.deadline_utc"
  - id: ERR_SESSION_OUTSIDE_COVERAGE
    http: 422
    condition: "the requested session window is not entirely inside the reviewer's executed confidentiality coverage for the matter"
  - id: ERR_SESSION_WINDOW_OVERLAP
    http: 409
    condition: "the reviewer already holds a SCHEDULED or ACTIVE session whose half-open window overlaps the request"
  - id: ERR_ONSITE_SEATS_EXHAUSTED
    http: 409
    condition: "every onsite secure seat of the matter is already occupied for part of the requested half-open window"

  # ---- business constraint ------------------------------------------------
  - id: ERR_BAR_ADMISSION_MISSING
    http: 422
    condition: "the reviewer lacks one of the matter's required bar admissions"
  - id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http: 409
    condition: "the reviewer already holds max_concurrent_batches non-terminal assignments"
  - id: ERR_LANGUAGE_REQUIREMENT_UNMET
    http: 422
    condition: "the reviewer lacks one of the matter's required languages"
  - id: ERR_TIER_MISMATCH
    http: 422
    condition: "the reviewer's tier does not equal the requested pass_type"
  - id: ERR_NO_ELIGIBLE_REVIEWER
    http: 409
    condition: "the auto-assign eligibility pool is empty"
  - id: ERR_ZERO_DOCUMENT_BATCH
    http: 422
    condition: "a batch was requested with document_count below 1"
  - id: ERR_INSUFFICIENT_UNBATCHED_DOCUMENTS
    http: 422
    condition: "the requested batch document_count exceeds the matter's unbatched_document_count"
  - id: ERR_DOCUMENT_COUNT_EXCEEDED
    http: 422
    condition: "documents_coded exceeds batch.document_count, or a progress counter would decrease"
  - id: ERR_ERROR_COUNT_EXCEEDS_SAMPLE
    http: 422
    condition: "coding_error_count + privilege_error_count exceeds the sample's sampled_document_count"
  - id: ERR_BATCH_NOT_DISSOLVABLE
    http: 409
    condition: "the batch is not CREATED or still carries a non-VOIDED assignment"
  - id: ERR_MATTER_NOT_CLOSEABLE
    http: 409
    condition: "a batch is still open, documents remain unbatched, or a privilege log entry is not FINAL"

  # ---- business fiscal ----------------------------------------------------
  - id: ERR_BUDGET_WOULD_EXCEED
    http: 402
    condition: "committed_spend_cents plus the new commitment would exceed matter.budget_cap_cents; equality is permitted"

