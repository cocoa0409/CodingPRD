  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_occupancy_half_open_overlap
        grounds:
          - validations[priority=8]
          - state_machines.Bay.OPEN_to_OCCUPIED
          - errors[ERR_BAY_NOT_OPEN]
        distinguishing_aspect: |
          Bay interval semantics: a bay holds at most one active occupancy at a time (half-open
          [start,end)). Creating a second WorkOrder against a bay already OCCUPIED is rejected
          because the live occupancy interval has not ended — ERR_BAY_NOT_OPEN on POST /work-orders.
        test_recipe:
          setup:
            - "One bay; WO_A created (bay OCCUPIED). Second create targets the same bay."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINOVA001", plate: "OVA1", make: "Honda", model: "Fit", odometer: 2000 }
              as: ServiceAdvisor
              captures: { veh_a: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINOVA002", plate: "OVA2", make: "Honda", model: "Jazz", odometer: 3000 }
              as: ServiceAdvisor
              captures: { veh_b: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_a}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 2000 }
              as: ServiceAdvisor
              captures: { wo_a: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_b}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 3000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "second POST /work-orders returns HTTP 409 with error_id == ERR_BAY_NOT_OPEN (bay still OCCUPIED, interval not ended)"

      - name: technician_buffered_double_booking
        grounds:
          - validations[priority=8]
          - entities.Technician.fields.cleanup_buffer_seconds
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Different resource (Technician) and different interval semantics (buffered/closed): a
          technician may not be claimed on a second active order while already on a live order;
          the cleanup_buffer extends the busy interval so even back-to-back claims collide. The
          second claim returns ERR_TECHNICIAN_DOUBLE_BOOKED — distinct from the bay half-open rule.
        test_recipe:
          setup:
            - "Two bays; one technician already claimed on WO_A (in service). A second order WO_B exists and is claimed by the same technician."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_a: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 2" }
              as: ShopManager
              captures: { bay_b: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess", cleanup_buffer_seconds: 300 }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINTDB001", plate: "TDB1", make: "Honda", model: "Fit", odometer: 2000 }
              as: ServiceAdvisor
              captures: { veh_a: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VINTDB002", plate: "TDB2", make: "Honda", model: "Jazz", odometer: 3000 }
              as: ServiceAdvisor
              captures: { veh_b: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_a}", bay_id: "${bay_a}", package_id: "${pkg_id}", odometer_in: 2000 }
              as: ServiceAdvisor
              captures: { wo_a: $.data.id }
            - call: "POST /work-orders/${wo_a}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_b}", bay_id: "${bay_b}", package_id: "${pkg_id}", odometer_in: 3000 }
              as: ServiceAdvisor
              captures: { wo_b: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_b}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second claim returns HTTP 409 with error_id == ERR_TECHNICIAN_DOUBLE_BOOKED (technician already on a live order within buffer window)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_bay_count_conserved_under_create_then_cancel
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_CANCELLED
          - state_machines.Bay.OCCUPIED_to_OPEN
          - entities.Shop.fields.open_bay_count
        distinguishing_aspect: |
          Conserved quantity: Shop.open_bay_count. Creating a WorkOrder (bay OPEN->OCCUPIED,
          open_bay_count 1->0) then cancelling it (bay OCCUPIED->OPEN, 0->1) leaves
          open_bay_count == its pre-action value (1). Invariant pinned as count of OPEN bays.
        test_recipe:
          setup:
            - "Shop with one OPEN bay; open_bay_count starts at 1."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopManager
              captures: { obc_before: $.data.open_bay_count }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", vin: "VININV001", plate: "INV1", make: "Honda", model: "Fit", odometer: 2000 }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 2000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopManager
              captures: { obc_occupied: $.data.open_bay_count }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ServiceAdvisor
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopManager
              captures: { obc_after: $.data.open_bay_count }
          assert:
            - "Shop.${shop_id}.open_bay_count == 1 before create and == 0 while occupied"
            - "Shop.${shop_id}.open_bay_count == 1 after cancel (conserved; equals the pre-create value)"

      - name: fleet_reserved_credit_conserved_under_authorize_then_void
        grounds:
          - state_machines.WorkOrder.UNPAID_to_AUTHORIZED
          - state_machines.WorkOrder.AUTHORIZED_to_VOIDED
          - entities.FleetAccount.fields.reserved_credit_cents
        distinguishing_aspect: |
          Different conserved quantity: FleetAccount.reserved_credit_cents. Authorizing a
          FLEET_ACCOUNT order (reserved 0->6814) then voiding the payment (reserved 6814->0)
          leaves reserved_credit_cents == its pre-authorize value (0). Pinned as sum of
          total_cents over AUTHORIZED+PAID orders.
        test_recipe:
          setup:
            - "Fleet account credit_limit 100000, reserved starts 0; one READY fleet order total 6814."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { shop_id: "${shop_id}", oil_grade: "CONVENTIONAL", name: "Basic", base_price_cents: 6995, included_quarts: 5, labor_minutes: 20, interval_miles: 5000, interval_days: 180 }
              as: ShopManager
              captures: { pkg_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { shop_id: "${shop_id}", company_name: "Acme", discount_pct: 0.10, credit_limit_cents: 100000 }
              as: ShopManager
              captures: { fleet_id: $.data.id }
            - call: "POST /bays"
              payload: { shop_id: "${shop_id}", label: "Bay 1" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /technicians"
              payload: { shop_id: "${shop_id}", full_name: "Tess" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /vehicles"
              payload: { shop_id: "${shop_id}", fleet_account_id: "${fleet_id}", vin: "VININV002", plate: "INV2", make: "Ford", model: "F150", odometer: 6000 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 6000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/authorize"
              payload: { payment_method: "FLEET_ACCOUNT" }
              as: ServiceAdvisor
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: ShopManager
              captures: { reserved_mid: $.data.reserved_credit_cents }
          trigger:
            - call: "POST /work-orders/${wo_id}/void-payment"
              payload: {}
              as: ServiceAdvisor
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: ShopManager
              captures: { reserved_after: $.data.reserved_credit_cents }
          assert:
            - "FleetAccount.${fleet_id}.reserved_credit_cents == 6814 after authorize"
            - "FleetAccount.${fleet_id}.reserved_credit_cents == 0 after void (conserved; equals the pre-authorize value)"
