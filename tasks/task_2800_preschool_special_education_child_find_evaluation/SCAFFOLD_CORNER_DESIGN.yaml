        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /child-find/providers/{id}]
          - calculations.provider_service_capacity_posture
        distinguishing_aspect: |
          The only update endpoint in the API changes a CEILING, not a load, and
          the posture must follow: 160 assigned minutes are OPEN against a 400
          ceiling, NEAR_CAPACITY against 200 (utilization exactly 0.80) and
          AT_CAPACITY against 160, with the assigned figure never moving. The
          PATCH also bumps the provider's version, which is observable because a
          staffing call still holding the pre-PATCH version is rejected with 412
          even though the provider is by then ON_LEAVE - the OCC check at
          priority 10 answers before the ACTIVE check at priority 18.
