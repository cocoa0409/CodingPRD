# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3235_youth_league_charter_boundary_waivers_tournament_advancement
#
# 9 Difficulty Rules x 2 instances = 18 instances.
#
# Shared fixture conventions (fully inlined per instance below):
#  - CHARTER PREFIX: clock 2026-10-15 -> create league season 2027 (divisions
#    auto-created in order [TEE_BALL, MINOR, MAJOR, JUNIOR, SENIOR], list index
#    2 == MAJOR) -> insurance 2027-01-01..2027-12-31 -> renewal submit ->
#    decide APPROVE -> league CHARTERED. League version is then 2
#    (1 at create, +1 at approval).
#  - ELIGIBLE PLAYER PREFIX (per player): clock 2027-02-01 (registration
#    window open) -> POST players -> POST documents (BIRTH_CERTIFICATE +
#    RESIDENCE_PROOF issued 2027-01-15) -> verify-eligibility.
#  - Player birth dates: "2015-03-10" -> league_age 12 (MAJOR).
#  - TOURNAMENT PREFIX: 3 eligible players -> roster (MAJOR) -> 3 selections
#    -> submit -> entry DISTRICT -> game.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: charter_fee_provisional_vs_final_diverge_when_team_counts_move
        grounds:
          - calculations.charter_renewal_fee
          - entities.CharterRenewal.fields.provisional_fee_cents
          - entities.CharterRenewal.fields.final_fee_cents
        distinguishing_aspect: |
          Dual-variant calculation on the CharterRenewal domain: provisional
          fee snapshots team_counts at submission (3 teams -> 72500 cents),
          final fee recomputes at approval (4 teams -> 80000 cents); identical
          formula, different input snapshots, different results.
        test_recipe:
          setup:
            - "Clock 2026-10-15 (ON_TIME window for season 2027)."
            - "League season 2027 with MINOR.team_count 2, MAJOR.team_count 1 (3 teams) at renewal submission; TEE_BALL.team_count patched to 1 between submission and approval."
            - "Insurance covering the season window exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Twin Rivers LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: DistrictAdministrator
              captures: { tee: "$.data[0].id", min: "$.data[1].id", maj: "$.data[2].id" }
            - call: "PATCH /leagues/${lg}/divisions/${min}"
              payload: { team_count: 2 }
              as: LeagueAdministrator
            - call: "PATCH /leagues/${lg}/divisions/${maj}"
              payload: { team_count: 1 }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id, prov: $.data.provisional_fee_cents }
            - call: "PATCH /leagues/${lg}/divisions/${tee}"
              payload: { team_count: 1 }
              as: LeagueAdministrator
          trigger:
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
              captures: { fin: $.data.final_fee_cents }
          assert:
            - "CharterRenewal.${ren}.provisional_fee_cents == 72500"
            - "CharterRenewal.${ren}.final_fee_cents == 80000"
            - "captured ${prov} == 72500 and ${fin} == 80000 (delta 7500)"
            - "League.${lg}.charter_status == CHARTERED"

      - name: pitch_rest_provisional_vs_official_after_scorebook_correction
        grounds:
          - calculations.pitch_rest_requirement
          - entities.PitchingAppearance.fields.official_pitches
          - entities.PitchingAppearance.fields.eligible_again_on
        distinguishing_aspect: |
          Dual-variant calculation on the PitchingAppearance domain (distinct
          from CharterRenewal): provisional rest uses reported pitches_thrown
          (60 -> 3 days), official rest uses the scorebook-corrected
          official_pitches (70 -> 4 days) — the same appearance yields two
          different eligible_again_on dates.
        test_recipe:
          setup:
            - "League CHARTERED (prefix); players P1..P3 ELIGIBLE in MAJOR (participation 60.00 each); roster R SUBMITTED with P1..P3; entry E DISTRICT; game G created."
            - "Clock advanced to 2027-06-01 before the game."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Rest Valley LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { maj: "$.data[2].id" }
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "One", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-03-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "Two", birth_date: "2015-04-11", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p2: $.data.id }
            - call: "POST /leagues/${lg}/players/${p2}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-04-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p2}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p2}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "Three", birth_date: "2015-05-12", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p3: $.data.id }
            - call: "POST /leagues/${lg}/players/${p3}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-05-13" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p3}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p3}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters"
              payload: { division_id: "${maj}" }
              as: LeagueAdministrator
              captures: { ros: $.data.id }
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/selections"
              payload: { player_id: "${p1}" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/selections"
              payload: { player_id: "${p2}" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/selections"
              payload: { player_id: "${p3}" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/submit"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/tournament-entries"
              payload: { roster_id: "${ros}", level: "DISTRICT" }
              as: TournamentDirector
              captures: { ent: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /tournament-entries/${ent}/games"
              payload: {}
              as: TournamentDirector
              captures: { g: $.data.id, gv: $.data.version }
          trigger:
            - call: "POST /tournament-entries/${ent}/games/${g}/pitching-appearances"
              payload: { player_id: "${p1}", pitches_thrown: 60 }
              as: OfficialScorer
              captures: { app: $.data.id, prov_elig: $.data.eligible_again_on, prov_rest: $.data.rest_days_required }
            - call: "POST /tournament-entries/${ent}/games/${g}/finalize"
              payload: { our_score: 5, opponent_score: 3, expected_game_version: "${gv} + 1", scorebook_corrections: [{ appearance_id: "${app}", official_pitches: 70 }] }
              as: TournamentDirector
          assert:
            - "captured provisional: ${prov_rest} == 3 and ${prov_elig} == \"2027-06-04\" (60 pitches -> tier 51..65 -> 3 days from 2027-06-01)"
            - "PitchingAppearance.${app}.official_pitches == 70 after finalize"
            - "PitchingAppearance.${app}.rest_days_required == 4 after finalize (70 pitches -> tier 66..85 -> 4 days)"
            - "PitchingAppearance.${app}.eligible_again_on == \"2027-06-05\" after finalize"
            - "provisional eligible_again_on (\"2027-06-04\") != official eligible_again_on (\"2027-06-05\") for the same appearance"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: pitch_rest_tiered_gate_three_input_interaction
        grounds:
          - calculations.pitch_rest_requirement
          - validations[priority=6]
        distinguishing_aspect: |
          Mode (a) combinatorial: pitch_rest_requirement combines >= 3 inputs
          (division pitch cap per division_code, tiered rest selection over
          closed intervals, and the latest-appearance eligible_again_on gate)
          with non-linear interaction — a 70-pitch outing on 2027-06-01 blocks
          an appearance on 2027-06-04 (rest gate) and permits exactly 85 (==
          MAJOR cap) on 2027-06-05.
        test_recipe:
          setup:
            - "League CHARTERED; players P1..P3 ELIGIBLE in MAJOR; roster R SUBMITTED; entry E DISTRICT; games G1 (played 2027-06-01, P1 throws 70) and G2 (scheduled)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Tier Gate LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { maj: "$.data[2].id" }
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "One", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-03-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "Two", birth_date: "2015-04-11", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p2: $.data.id }
            - call: "POST /leagues/${lg}/players/${p2}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-04-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p2}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p2}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "P", last_name: "Three", birth_date: "2015-05-12", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p3: $.data.id }
            - call: "POST /leagues/${lg}/players/${p3}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-05-13" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p3}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p3}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters"
              payload: { division_id: "${maj}" }
              as: LeagueAdministrator
              captures: { ros: $.data.id }
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/selections"
              payload: { player_id: "${p1}" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/selections"
              payload: { player_id: "${p2}" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/selections"
              payload: { player_id: "${p3}" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters/${ros}/submit"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/tournament-entries"
              payload: { roster_id: "${ros}", level: "DISTRICT" }
              as: TournamentDirector
              captures: { ent: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /tournament-entries/${ent}/games"
              payload: {}
              as: TournamentDirector
              captures: { g1: $.data.id }
            - call: "POST /tournament-entries/${ent}/games/${g1}/pitching-appearances"
              payload: { player_id: "${p1}", pitches_thrown: 70 }
              as: OfficialScorer
              captures: { a1: $.data.id }
            - call: "POST /tournament-entries/${ent}/games"
              payload: {}
              as: TournamentDirector
              captures: { g2: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-04T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /tournament-entries/${ent}/games/${g2}/pitching-appearances"
              payload: { player_id: "${p1}", pitches_thrown: 10 }
              as: OfficialScorer
              captures: { err1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-05T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /tournament-entries/${ent}/games/${g2}/pitching-appearances"
              payload: { player_id: "${p1}", pitches_thrown: 85 }
              as: OfficialScorer
              captures: { a2: $.data.id, a2_rest: $.data.rest_days_required }
          assert:
            - "first appearance on 2027-06-04 rejected: ${err1} == ERR_REST_REQUIREMENT_VIOLATION (70 pitches on 06-01 -> eligible_again_on 2027-06-05; 06-04 < 06-05)"
            - "on 2027-06-05 the appearance succeeds with pitches_thrown == 85 == PITCH_MAX_MAJOR (cap is inclusive)"
            - "PitchingAppearance.${a2}.rest_days_required == 4 (85 pitches -> tier 66..85)"
            - "PitchingAppearance.${a2}.eligible_again_on == \"2027-06-09\""
            - "TournamentGame.${g2}.recorded_pitch_total == 85"

      - name: late_renewal_fee_per_line_rounding_beats_total_rounding
        grounds:
          - calculations.charter_renewal_fee
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (b) combinatorial (distinct from mode (a)): nested rounding
          order is pinned — multiply each fee line by LATE_MULTIPLIER 1.175 and
          round to integer cents FIRST, then sum. With team_counts 1 and 1,
          per-line rounding yields 8813 + 8813 + 58750 = 76376, whereas
          rounding the total would yield round(65000 * 1.175) = 76375.
        test_recipe:
          setup:
            - "Clock 2027-02-01 (LATE window for season 2027)."
            - "League season 2027, PROVISIONAL; TEE_BALL.team_count 1, MINOR.team_count 1, others 0; insurance covers the season window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Late Fee LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { tee: "$.data[0].id", min: "$.data[1].id" }
            - call: "PATCH /leagues/${lg}/divisions/${tee}"
              payload: { team_count: 1 }
              as: LeagueAdministrator
            - call: "PATCH /leagues/${lg}/divisions/${min}"
              payload: { team_count: 1 }
              as: LeagueAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id, prov: $.data.provisional_fee_cents, cls: $.data.window_classification }
          trigger:
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: true }
              as: DistrictAdministrator
              captures: { fin: $.data.final_fee_cents }
          assert:
            - "captured ${cls} == LATE"
            - "CharterRenewal.${ren}.provisional_fee_cents == 76376 (per-line rounding: 58750 + 8813 + 8813)"
            - "CharterRenewal.${ren}.final_fee_cents == 76376 (team_counts unchanged between submit and approve)"
            - "the rejected alternative total-first rounding would be 76375 — the scaffold pins 76376"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: player_eligibility_revoke_reverify_cycle
        grounds:
          - state_machines.Player.INELIGIBLE_to_ELIGIBLE
          - state_machines.Player.ELIGIBLE_to_INELIGIBLE
        distinguishing_aspect: |
          Cyclic machine on Player: PENDING -> ELIGIBLE -> INELIGIBLE ->
          ELIGIBLE is a legal loop (revocation followed by re-verification),
          not a one-way pipeline.
        test_recipe:
          setup:
            - "League CHARTERED (prefix); clock 2027-02-01; player P1 registered with fresh documents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Cycle LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Cy", last_name: "Cle", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-03-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
          trigger:
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/revoke-eligibility"
              payload: { reason: "boundary audit" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
              captures: { st: $.data.eligibility_status }
          assert:
            - "Player.${p1}.eligibility_status == ELIGIBLE after the first verify"
            - "Player.${p1}.eligibility_status == INELIGIBLE after revoke"
            - "Player.${p1}.eligibility_status == ELIGIBLE after the second verify (captured ${st}) — the cycle completed"
            - "Player.${p1}.version == 4 (create + verify + revoke + verify)"

      - name: protest_uphold_reopens_final_game_and_reverses_elimination
        grounds:
          - state_machines.TournamentGame.FINAL_to_IN_PROGRESS
          - state_machines.TournamentEntry.ELIMINATED_to_ACTIVE
