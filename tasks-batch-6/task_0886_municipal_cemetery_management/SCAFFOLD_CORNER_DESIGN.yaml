        claim_type: cascading_side_effects
        grounds: [state_machines.MarkerPermit.INSTALLED_to_DECOMMISSIONED, state_machines.Interment.COMPLETED_to_DISINTERRED]
        excluded_because:
          difficulty_instance: disinterment_relocation_vs_removal_settlement
          rationale: "The execute cascade (Interment->DISINTERRED and dependent side effects) is driven by the named §1.8 dual-variant settlement instance."
