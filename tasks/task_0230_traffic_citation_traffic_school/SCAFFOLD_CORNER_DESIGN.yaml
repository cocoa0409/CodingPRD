              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "CM1LIC", full_name: "Cm One" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "CM-1", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /citations/${cid}/payments"
              payload: { amount_cents: 9000, method: "CASH" }
              as: Driver
              as_user_id: "${d}"
            - call: "GET /citations/${cid}"
              payload: {}
              as: Driver
              as_user_id: "${d}"
          assert:
            - "Citation.${cid}.amount_paid_cents == 9000"
            - "Citation.${cid}.balance_cents == 20000"
            - "Citation.${cid}.financial_status == PARTIALLY_PAID"
