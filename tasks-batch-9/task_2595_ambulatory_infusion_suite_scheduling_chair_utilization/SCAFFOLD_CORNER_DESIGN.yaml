      - name: same_day_class_rules_switch_on_the_clock_and_urgent_alone_is_exempt_from_the_cutoff
        claim_type: conditional
        grounds:
          - validations[priority 91]
          - validations[priority 92]
          - validations[priority 93]
          - errors[ERR_SAME_DAY_REQUIRES_ADDON]
          - errors[ERR_ADDON_DATE_MISMATCH]
          - errors[ERR_ADDON_CUTOFF_PASSED]
        distinguishing_aspect: |
          Three mutually conditional rules are exercised against one moving clock. All three
          conditions are read from the logical clock, never from wall time, and rule 93's
          exemption is class-specific: at minute 930, past the cutoff of 900, SAME_DAY_ADDON
          is refused while URGENT with the same service_date is accepted. Rules 91 and 92
          are exact mirror images — one refuses ROUTINE on today, the other refuses
          add-on/urgent on any day but today.
        test_recipe:
          setup:
            - "One center (open 480, close 1140, addon_cutoff_minute 900, urgent_reserve_chair_count 1); chair A1 ordinary and chair A2 with reserved_for_urgent true; one nurse on 480-1140 with acuity_capacity_points 12."
            - "The standing drug, a MID template and three 70 kg patients ROUTINE, ADDON and URGENT, each with an ACTIVE 6-cycle plan."
            - "The clock starts at 2026-08-01T10:00:00Z (minute 600)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A2", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: true }
              as: Scheduler
              captures: { ch2: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 12, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-RTN", full_name: "Pat Routine", weight_kg: 70 }
              as: Scheduler
              captures: { pt_r: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-ADD", full_name: "Pat Addon", weight_kg: 70 }
              as: Scheduler
              captures: { pt_a: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-URG", full_name: "Pat Urgent", weight_kg: 70 }
              as: Scheduler
              captures: { pt_u: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_r}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl_r: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_a}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl_a: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_u}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl_u: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_r}", treatment_plan_id: "${pl_r}", template_id: "${tp1}", service_date: "2026-08-01", requested_start_minute: 660, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { err_routine_today: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_a}", treatment_plan_id: "${pl_a}", template_id: "${tp1}", service_date: "2026-08-05", requested_start_minute: 660, cycle_number: 1, booking_class: "SAME_DAY_ADDON" }
              as: Scheduler
              captures: { err_addon_future: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt_a}", treatment_plan_id: "${pl_a}", template_id: "${tp1}", service_date: "2026-08-01", requested_start_minute: 660, cycle_number: 1, booking_class: "SAME_DAY_ADDON" }
