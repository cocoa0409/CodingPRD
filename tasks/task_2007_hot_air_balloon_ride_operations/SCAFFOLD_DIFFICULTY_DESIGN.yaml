              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 2, declared_weight_lbs: 360, photo_package_tier: "NONE" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CONFIRM", paid_cents: 59800 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CANCEL" }
              as: Customer
              as_user_id: "${c1}"
            - call: "GET /v1/flights/${f1}"
              payload: {}
              as: OperationsManager
          assert:
            - "Flight.${f1}.seats_sold == 0 (returned to pre-booking value)"
            - "Flight.${f1}.seats_available == 6"
            - "invariant: seats_sold + seats_available == Balloon.${b1}.basket_capacity_passengers"

      - name: payment_conserved_across_partial_refund
        grounds:
          - calculations.refund_amount
          - entities.Reservation.fields.paid_cents
          - entities.Reservation.fields.refunded_cents
          - entities.Reservation.fields.retained_revenue_cents
