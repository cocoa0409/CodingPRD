            - { call: "POST /bookstore/sections", payload: { term_id: "${t2}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec2: $.data.id } }
