      - name: facility_access_mode_action_returns_the_facility_and_bumps_version
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/demurrage/facilities/{id}/access-mode
        distinguishing_aspect: |
          An action endpoint returns 200 with the mutated resource, not 201 and
          not an empty body, and it is the only way to move access_mode: there
          is no PATCH on Facility. Two successive calls walk OPEN ->
          GATE_CONTROLLED -> EMBARGOED and increment the version each time.
        test_recipe:
          setup:
            - "one facility created with the default access mode"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9P3-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
          trigger:
            - call: "POST /demurrage/facilities/${fac_id}/access-mode"
              payload: { access_mode: "GATE_CONTROLLED", reason: "Night gate staffing only." }
              as: RailroadAgent
            - call: "POST /demurrage/facilities/${fac_id}/access-mode"
              payload: { access_mode: "EMBARGOED", reason: "Derailment on the lead." }
              as: RailroadAgent
          assert:
            - "the facility was created with access_mode OPEN and version 1"
            - "the first action returned 200 with access_mode GATE_CONTROLLED and version 2"
            - "the second action returned 200 with access_mode EMBARGOED and version 3"
            - "both responses carry the full Facility body, including the unchanged gate_close_hour 16 and car_spot_capacity 3"

      - name: cycle_notifications_subresource_lists_only_that_cycles_notices
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/demurrage/placement-cycles/{id}/notifications
        distinguishing_aspect: |
          The subresource is scoped by the path id, so a second cycle's notice
