scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: program_create_defaults_and_retrieval
        claim_type: creation
        grounds: [entities.Program]
        distinguishing_aspect: "POST /programs with only name+code returns 201 with status DRAFT, current_consent_form_version 1, current_logic_model_id null, version 1; a subsequent GET returns the same stored values."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Afterschool", code: "AFS" }
              as: ProgramDirector
              captures: { prog: $.data.id, p_status: $.data.status, p_cfv: $.data.current_consent_form_version, p_v: $.data.version }
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { g_status: $.data.status }
          assert:
            - "create response: status == DRAFT, current_consent_form_version == 1, current_logic_model_id == null, version == 1, id is a server-minted UUID"
            - "GET returns status == DRAFT and identical id"

      - name: program_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Program, "validations[priority=6]"]
        distinguishing_aspect: "Client-supplied id/status/version/current_consent_form_version in the create body are ignored per the priority-6 rule; the server still mints its own values."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Rigged", code: "RIG", id: "00000000-0000-0000-0000-000000000000", status: "ACTIVE", version: 99, current_consent_form_version: 42 }
              as: ProgramDirector
              captures: { prog: $.data.id, p_status: $.data.status, p_v: $.data.version, p_cfv: $.data.current_consent_form_version }
          assert:
            - "HTTP 201; status == DRAFT (not ACTIVE), version == 1 (not 99), current_consent_form_version == 1 (not 42), id != 00000000-0000-0000-0000-000000000000"

      - name: program_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Program, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent program id returns 404 with error_id ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /programs/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND"

      - name: program_missing_required_code_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Program.fields.code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field code yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "NoCode" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"

      - name: program_list_pagination_defaults_and_offsets
        claim_type: listing
        grounds: [entities.Program, response_envelope]
        distinguishing_aspect: "With 11 programs, the default page returns exactly 10 items with total_count 11 and has_more true; limit=11 returns all with has_more false; limit=5&offset=10 returns the final 1 item."
        test_recipe:
          setup: ["eleven programs P01..P11 created"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P01", code: "P01" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P02", code: "P02" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P03", code: "P03" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P04", code: "P04" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P05", code: "P05" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P06", code: "P06" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P07", code: "P07" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P08", code: "P08" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P09", code: "P09" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P10", code: "P10" }
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "P11", code: "P11" }
              as: ProgramDirector
          trigger:
            - call: "GET /programs"
              payload: {}
              as: ProgramDirector
            - call: "GET /programs"
              payload: { limit: 11, offset: 0 }
              as: ProgramDirector
            - call: "GET /programs"
              payload: { limit: 5, offset: 10 }
              as: ProgramDirector
          assert:
            - "default page: 10 items, total_count == 11, has_more == true (pagination defaults limit 10, offset 0)"
            - "limit=11: 11 items, total_count == 11, has_more == false"
            - "limit=5&offset=10: 1 item, total_count == 11, has_more == false"

      - name: indicator_code_uniqueness_scoped_to_model
        claim_type: type_constraints
        grounds: [entities.Indicator.fields.code, "validations[priority=18]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "indicator.code is unique within a logic model but reusable across models of the same program."
        test_recipe:
          setup: ["program with DRAFT model M1 holding indicator code DUP, and DRAFT model M2"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Uniq", code: "UNQ" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "M1" }
              as: EvaluationLead
              captures: { m1: $.data.id }
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "M2" }
              as: EvaluationLead
              captures: { m2: $.data.id }
            - call: "POST /logic-models/${m1}/indicators"
              payload: { code: "DUP", level: "OUTPUT", unit: "COUNT", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 10, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
          trigger:
            - call: "POST /logic-models/${m1}/indicators"
              payload: { code: "DUP", level: "OUTCOME", unit: "COUNT", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 20, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { err: $.data.error_id }
            - call: "POST /logic-models/${m2}/indicators"
              payload: { code: "DUP", level: "OUTCOME", unit: "COUNT", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 20, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { ind_ok: $.data.id }
          assert:
            - "duplicate code within M1: HTTP 409, error_id == ERR_DUPLICATE_CODE"
            - "same code in M2: HTTP 201"

      - name: participant_external_ref_uniqueness_scoped_to_cycle
        claim_type: type_constraints
        grounds: [entities.Participant.fields.external_ref, "validations[priority=18]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "external_ref is unique within a cycle but reusable across cycles of the same program."
        test_recipe:
          setup: ["program ACTIVE with cycles C1 and C2 both ENROLLING; participant P-1 enrolled in C1"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Refs", code: "REF" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { c1: $.data.id }
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C2", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-10-01T00:00:00Z", cycle_end: "2026-10-31T23:59:59Z", reporting_due_date: "2026-11-15T00:00:00Z" }
              as: ProgramDirector
              captures: { c2: $.data.id }
            - call: "POST /cycles/${c1}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${c2}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${c1}/participants"
              payload: { external_ref: "P-1" }
              as: ProgramDirector
          trigger:
            - call: "POST /cycles/${c1}/participants"
              payload: { external_ref: "P-1" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "POST /cycles/${c2}/participants"
              payload: { external_ref: "P-1" }
              as: ProgramDirector
              captures: { p_ok: $.data.id }
          assert:
            - "duplicate external_ref in C1: HTTP 409, error_id == ERR_DUPLICATE_CODE"
            - "same external_ref in C2: HTTP 201"

      - name: cycle_create_window_order_validated
        claim_type: type_constraints
        grounds: ["validations[priority=16]", "errors[ERR_CYCLE_WINDOW_OVERLAP]"]
        distinguishing_aspect: "cycle_start after cycle_end (and enrollment_start after enrollment_end) is rejected with ERR_CYCLE_WINDOW_OVERLAP before any sibling-overlap analysis."
        test_recipe:
          setup: ["program ACTIVE"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Order", code: "ORD" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "BAD", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-10-01T00:00:00Z", cycle_end: "2026-09-01T00:00:00Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_CYCLE_WINDOW_OVERLAP"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: initial_state_defaults_on_create
        claim_type: initial_state
        grounds: [state_machines.ProgramCycle, state_machines.Participant, state_machines.Instrument, entities.ProgramCycle.fields.pinned_logic_model_id]
        distinguishing_aspect: "New entities start in their declared initial states with computed fields at declared defaults: cycle SETUP with pinned_logic_model_id null and counters 0/null; participant ENROLLED with consent_status NONE; instrument DRAFT with instrument_version 1."
        test_recipe:
          setup: ["program ACTIVE; cycle created and ENROLLING; one participant; one instrument"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Init", code: "INI" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id, cyc_status: $.data.status, cyc_pin: $.data.pinned_logic_model_id, cyc_apc: $.data.active_participant_count, cyc_comp: $.data.data_completeness_pct, cyc_dq: $.data.latest_dq_score }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id, p_status: $.data.status, p_consent: $.data.consent_status }
            - call: "POST /programs/${prog}/instruments"
              payload: { code: "SURV", title: "Survey" }
              as: EvaluationLead
              captures: { instr: $.data.id, i_status: $.data.status, i_ver: $.data.instrument_version }
          trigger: []
          assert:
            - "cycle create response: status == SETUP, pinned_logic_model_id == null, active_participant_count == 0, data_completeness_pct == null, latest_dq_score == null"
            - "participant create response: status == ENROLLED, consent_status == NONE"
            - "instrument create response: status == DRAFT, instrument_version == 1"

      - name: close_data_from_setup_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ProgramCycle, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "close-data is defined only from ACTIVE; from SETUP it is rejected with ERR_INVALID_STATE and the cycle stays SETUP."
        test_recipe:
          setup: ["program ACTIVE; cycle in SETUP"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "States", code: "STT" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /cycles/${cyc}/close-data"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramDirector
              captures: { cyc_status: $.data.status }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"
            - "cycle.status still == SETUP"

      - name: withdrawn_participant_terminal_exit_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Participant, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: POST /participants/{id}/exit on a withdrawn participant fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["cycle ACTIVE; participant withdrawn via consent revoke"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Term", code: "TRM" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
              captures: { cons1: $.data.id }
            - call: "POST /consents/${cons1}/revoke"
              payload: {}
              as: PrivacyOfficer
          trigger:
            - call: "POST /participants/${p1}/exit"
              payload: { reason: "no longer interested" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (WITHDRAWN is terminal)"

      - name: consent_grant_on_withdrawn_participant_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Participant, state_machines.ConsentRecord, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Consent creation is a child-mutation not defined for a WITHDRAWN participant; the grant is rejected with ERR_INVALID_STATE even with the current form_version."
        test_recipe:
          setup: ["cycle ACTIVE; participant withdrawn via consent revoke"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Regrant", code: "RGN" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
              captures: { cons1: $.data.id }
            - call: "POST /consents/${cons1}/revoke"
              payload: {}
              as: PrivacyOfficer
          trigger:
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2028-01-01T00:00:00Z" }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (no consent path out of WITHDRAWN)"

      - name: close_and_reopen_data_compensates_participants
        claim_type: side_effect_execution
        grounds: [state_machines.ProgramCycle.ACTIVE_to_DATA_CLOSED, state_machines.ProgramCycle.DATA_CLOSED_to_ACTIVE, state_machines.Participant.COMPLETED_to_ACTIVE]
        distinguishing_aspect: "close-data flips ACTIVE participants to COMPLETED and reopen-data flips them back to ACTIVE — the compensation restores active_participant_count exactly (2 -> 0 -> 2)."
        test_recipe:
          setup: ["cycle ACTIVE with two consented ACTIVE participants"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Comp", code: "CMP" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-002" }
              as: ProgramDirector
              captures: { p2: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /participants/${p2}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
          trigger:
            - call: "POST /cycles/${cyc}/close-data"
              payload: {}
              as: ProgramDirector
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramDirector
              captures: { cnt_closed: $.data.active_participant_count }
            - call: "GET /participants/${p1}"
              payload: {}
              as: ProgramDirector
              captures: { p1_closed: $.data.status }
            - call: "POST /cycles/${cyc}/reopen-data"
              payload: {}
              as: ProgramDirector
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramDirector
              captures: { cnt_reopen: $.data.active_participant_count, cyc_status: $.data.status }
            - call: "GET /participants/${p1}"
              payload: {}
              as: ProgramDirector
              captures: { p1_reopen: $.data.status }
          assert:
            - "after close-data: participant P-001 status == COMPLETED and active_participant_count == 0"
            - "after reopen-data: cycle.status == ACTIVE, participant P-001 status == ACTIVE again, active_participant_count == 2"

      - name: observation_flag_then_validate_branch
        claim_type: valid_transition
        grounds: [state_machines.Observation.PENDING_to_FLAGGED, state_machines.Observation.FLAGGED_to_VALIDATED]
        distinguishing_aspect: "The FLAGGED branch is not a dead end: PENDING -> FLAGGED -> VALIDATED succeeds and validated_observation_count increments only on the final hop."
        test_recipe:
          setup: ["cycle ACTIVE; participant ACTIVE with consent; instrument published; collector certified; one PENDING observation"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Branch", code: "BRN" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTCOME", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { ind1: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
