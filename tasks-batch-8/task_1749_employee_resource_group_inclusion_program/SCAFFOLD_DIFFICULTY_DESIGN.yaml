            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_g09" }, as: DeiAdmin }
            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_g10" }, as: DeiAdmin }
          trigger:
            - { call: "GET /v1/groups/${g}", payload: {}, as: DeiAdmin, captures: { prov: $.data.provisional_standing_score, cert: $.data.certified_standing_score, alloc: $.data.allocated_cents, mc: $.data.active_member_count } }
          assert:
            - "ErgGroup.${g}.active_member_count == 20"
            - "ErgGroup.${g}.certified_standing_score == 0.00 (frozen at lock: growth 0, no COMPLETED events)"
            - "ErgGroup.${g}.provisional_standing_score == 50.00 (0.5*0 + 0.5*min(100, 100*(20-10)/10))"
            - "ErgGroup.${g}.allocated_cents == 100000 (single eligible group receives the whole pool)"

  - rule_id: combinatorial_formula
    instances:
      - name: allocation_waterfall_largest_remainder
        grounds:
          - calculations.group_allocation_waterfall
          - entities.ErgGroup.fields.allocated_cents
          - entities.InclusionProgram.fields.unallocated_pool_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-group floor FIRST, then 1-cent remainder
          distribution by descending fractional part (G3 .4286 beats G2 .3117 beats G1
          .2597) — sum-then-round would give different cents; pool 1000000 with weights
          100/120/165 yields exactly 259740/311688/428572.
        test_recipe:
          setup:
            - "Program 2027 pool 1000000 OPEN; one sponsor (max_groups 3)"
            - "G1 'Alpha Alliance' AFFINITY ACTIVE with 10 members; G2 'Beta Builders' PROFESSIONAL ACTIVE with 10 members; G3 'Gamma Outreach' COMMUNITY_OUTREACH ACTIVE with 11 members"
