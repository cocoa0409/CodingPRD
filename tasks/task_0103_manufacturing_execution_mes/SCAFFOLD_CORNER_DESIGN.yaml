              as: MachineOperator
          trigger:
            - call: "POST /machines/${m_id}/recompute-oee"
              payload: {}
              as: ManufacturingEngineer
              captures: { q: $.data.oee_quality, oee: $.data.oee_overall }
          assert:
            - "Machine.${m_id}.oee_quality == 0.0000"
            - "Machine.${m_id}.oee_overall == 0.0000"

      - name: labor_completion_cost_round_per_op_then_sum
        claim_type: Correct Result
        grounds: [calculations.labor_completion_cost, endpoints]
        distinguishing_aspect: "Two completed ops (ideal 12.25 and 18.75, good_qty 1 each) at LABOR_RATE 2 c/s -> per-op 25 + 38 = 63 (round-per-op-then-sum), differs from sum-then-round 62."
        test_recipe:
          setup: ["Two-op single-unit WO (no BOM); both ops signed PASS, started, completed; WO COMPLETED."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-LC", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
