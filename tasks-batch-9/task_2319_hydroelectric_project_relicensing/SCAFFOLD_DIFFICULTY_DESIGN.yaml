              payload: { project_id: "${proj}", site_code: "S1", river_mile: 6.0, min_rest_buffer_days: 0, cultural_sensitivity: "NONE" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State DEQ Reviewer", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { party_a: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "WATER_QUALITY", study_title: "Dissolved oxygen profile", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "START" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "COMPLETE" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "round 1 report" }
              as: Licensee
              as_user_id: "u_lic_report"
          trigger:
            - call: "POST /relicensing/studies/${study}/review-decision"
              payload: { decision: "REQUIRE_ADDITIONAL", review_note: "add a second season" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { fw_after_1: $.data.fieldwork_status, rv_after_1: $.data.review_status, rounds_after_1: $.data.additional_round_count }
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "COMPLETE" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "round 2 report" }
              as: Licensee
              as_user_id: "u_lic_report"
            - call: "POST /relicensing/studies/${study}/review-decision"
              payload: { decision: "REQUIRE_ADDITIONAL", review_note: "one more season" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { rounds_after_2: $.data.additional_round_count }
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "COMPLETE" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "round 3 report" }
