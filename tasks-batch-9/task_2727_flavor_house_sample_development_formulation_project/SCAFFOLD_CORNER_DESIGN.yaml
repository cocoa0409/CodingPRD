          - entities.Formula.fields.firm_cost_in_use_cents_per_tonne
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_in_use_bench_vs_firm_variant_divergence
          rationale: "That instance costs one formula and asserts both variants as different literals (74425 bench vs 73275 firm) from the same inputs."

      - name: forecast_variant_selection_flips_on_close_won
        claim_type: variant_selection
        grounds:
          - calculations.forecast_value
          - entities.CommercializationForecast.fields.variant_applied
        excluded_because:
          difficulty_instance: dual_variant_calc / forecast_risk_weighted_vs_committed_variant_divergence
          rationale: "That instance publishes the forecast under RISK_WEIGHTED and then closes the brief WON, asserting the COMMITTED variant and its full gross value."

