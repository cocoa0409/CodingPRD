              captures: { ch_payable: $.data.balance_payable_cents }
            - call: "GET /api/revenue-events"
              payload: { kind: "CHARGEBACK" }
              as: PlatformAdmin
          assert:
            - "SponsorshipDeal.${d_id}.miss_count == 3 (link 1: three MISSED transitions each incremented)"
            - "SponsorshipDeal.${d_id}.deal_status == BREACHED (link 2: miss_count threshold transition)"
            - "Exactly one CHARGEBACK RevenueEvent exists with gross_cents == -6000000 and recognition_status == CLEARED (link 3)"
            - "Channel.${ch_id}.balance_payable_cents == -5400000 (link 4: clawback net -6000000*0.9 applied to payable)"

      - name: tax_form_expiry_payout_hold_cascade
        grounds: [state_machines.TaxForm.VERIFIED_to_EXPIRED, state_machines.Channel.RESTRICTED_to_STANDARD, state_machines.Payout.SCHEDULED_to_HELD]
        distinguishing_aspect: |
          Depth-2 chain from the tax-expiry trigger (different trigger than the deliverable-miss
          cascade): TaxForm VERIFIED->EXPIRED at ops run drops Channel posture to RESTRICTED [1];
          the posture transition cascades the SCHEDULED payout to HELD with hold_reason=TAX_FORM [2].
