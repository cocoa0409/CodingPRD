scenario: "158. State Business Entity Formation & Annual Report: LLC/Corp/LP, Operating Agreement templates, EIN application, registered agent, annual report/Franchise Tax, Foreign Qualification (out-of-state), BOI disclosure"
domain_name: "state-business-entity-formation"
api_prefix: "/business-registry"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys: BusinessEntity, RegisteredAgent,
  # OperatingAgreement, EINApplication, AnnualReport, FranchiseTaxAssessment,
  # ForeignQualification, BOIReport, BeneficialOwner, ComplianceEvent.
  # No deep nesting in URL paths; most endpoints address resources by id.

  state_machine_shape: branching
  # BusinessEntity: PENDING_FORMATION → ACTIVE → (GOOD_STANDING ↔ NOT_IN_GOOD_STANDING)
  #   → DELINQUENT → ADMINISTRATIVELY_DISSOLVED  +  ACTIVE → DISSOLVED (voluntary)
  # AnnualReport: DRAFT → SUBMITTED → ACCEPTED, with REJECTED → DRAFT revision cycle.
  # FranchiseTaxAssessment: ASSESSED → (PAID | OVERDUE → DELINQUENT).
  # ForeignQualification: PENDING → QUALIFIED → (WITHDRAWN | REVOKED), with cycle PENDING→REJECTED→PENDING.
  # BOIReport: DRAFT → FILED → (CURRENT ↔ STALE) → CORRECTED.

  relationship_patterns:
    - one_to_many        # BusinessEntity → AnnualReport, FranchiseTaxAssessment, BOIReport
    - many_to_many       # BeneficialOwner ↔ BusinessEntity via BOIOwnership (junction)
    - cross_aggregate    # RegisteredAgent referenced by BusinessEntity and ForeignQualification

  role_model: segregation_of_duties
  # Filer (the entity itself acts), RegisteredAgentService, StateRegistrar (registrar),
  # TaxOfficer (assesses/accepts tax), ComplianceOfficer (reviews BOI/dissolution).
  # The same X-User-ID acting as Filer cannot also accept their own AnnualReport
  # or accept their own FranchiseTaxAssessment.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 ENTITIES
# =============================================================================
entities:
  - name: BusinessEntity
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the entity, unique within the state
        constraints: "Length 1..200; case-insensitive uniqueness across BusinessEntity.legal_name where compliance_status != DISSOLVED and compliance_status != ADMINISTRATIVELY_DISSOLVED"
      - name: entity_type
        type: enum
        source: input
        description: Legal form of the business
        constraints: "One of {LLC, CORP, LP}"
      - name: home_state
        type: string
        source: input
        description: Two-letter US state code where the entity is domestically formed
        constraints: "Exactly two upper-case letters matching ^[A-Z]{2}$"
      - name: formation_date
        type: datetime
        source: system
        description: Server-recorded clock time when entity transitioned to ACTIVE
        default: null
      - name: registered_agent_id
        type: string
        source: input
        description: FK to RegisteredAgent; required at formation
      - name: authorized_shares
        type: integer
        source: input
        description: Authorized share count (CORP only; null for LLC/LP)
        constraints: "Required when entity_type=CORP and >= 1; null otherwise"
      - name: total_gross_assets_cents
        type: integer
        source: input
        description: Most recently reported total gross assets in cents (CORP only; used for assumed-par-value franchise tax variant)
        default: 0
      - name: total_issued_shares
        type: integer
        source: input
        description: Most recent issued share count (CORP only; used for assumed-par-value franchise tax variant)
        default: 0
      - name: formation_status
        type: enum
        source: computed
        description: Lifecycle of formation paperwork
        constraints: "One of {PENDING_FORMATION, ACTIVE, DISSOLVED, ADMINISTRATIVELY_DISSOLVED}"
        default: PENDING_FORMATION
      - name: compliance_status
        type: enum
        source: computed
        description: Derived posture reflecting current standing
        constraints: "One of {GOOD_STANDING, NOT_IN_GOOD_STANDING, DELINQUENT}; null while formation_status=PENDING_FORMATION; null after formation_status=DISSOLVED or ADMINISTRATIVELY_DISSOLVED"
        default: null
      - name: next_annual_report_due_date
        type: datetime
        source: computed
        description: ISO8601 anniversary deadline; recomputed when an AnnualReport is ACCEPTED
        default: null
      - name: ein
        type: string
        source: computed
        description: Server-issued EIN once an EINApplication is APPROVED for this entity
        constraints: "Format ^[0-9]{2}-[0-9]{7}$ when set; otherwise null"
        default: null
      - name: dissolution_date
        type: datetime
        source: system
        description: Clock time when entity entered DISSOLVED or ADMINISTRATIVELY_DISSOLVED
        default: null
      - name: credit_balance_cents
        type: integer
        source: system
        description: Pre-paid credit balance in cents; debited by total_due_with_credit_application on /pay and reverted by refund cascades. Conserved global quantity for compensating-invariant tests.
        default: 0

  - name: RegisteredAgent
    parent: null
    common_fields: true
    fields:
      - name: agent_name
        type: string
        source: input
        description: Legal name of the registered agent (individual or service company)
      - name: physical_address
        type: string
        source: input
        description: Street address (no P.O. boxes) where service of process may be made
        constraints: "Must not match the regex ^P\\.?O\\.? Box; length 1..300"
      - name: service_state
        type: string
        source: input
        description: Two-letter US state code where this agent is authorized to accept service
        constraints: "^[A-Z]{2}$"
      - name: status
        type: enum
        source: computed
        description: Operational status of the agent
        constraints: "One of {ACTIVE, RESIGNED}"
        default: ACTIVE
      - name: resignation_effective_at
        type: datetime
        source: system
        description: Clock time the agent resignation takes effect
        default: null

  - name: OperatingAgreement
    parent: null
    common_fields: false
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity
      - name: template_code
        type: enum
        source: input
        description: Template chosen from the state library
        constraints: "Member-managed LLC {LLC_MM, LLC_MGR}; corporate {CORP_BYLAWS}; limited partnership {LP_AGREEMENT}. Template must match BusinessEntity.entity_type per §1.4."
      - name: template_version
        type: string
        source: input
        description: Semver of the chosen template (immutable once attached)
      - name: locked_template_hash
        type: string
        source: system
        description: SHA-256 hash of the rendered template recorded at attachment time; immutable
      - name: attached_at
        type: datetime
        source: system
        description: Clock time of attachment

  - name: EINApplication
    parent: null
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity; at most one non-REJECTED EINApplication per entity
      - name: responsible_party_name
        type: string
        source: input
        description: Name of the natural-person responsible party
      - name: responsible_party_ssn_last4
        type: string
        source: input
        description: Last four digits of the responsible party's SSN/ITIN
        constraints: "Exactly four digits matching ^[0-9]{4}$"
      - name: status
        type: enum
        source: computed
        description: EIN application lifecycle
        constraints: "One of {DRAFT, SUBMITTED, APPROVED, REJECTED}"
        default: DRAFT
      - name: assigned_ein
        type: string
        source: system
        description: EIN minted on APPROVE; format XX-XXXXXXX
        constraints: "^[0-9]{2}-[0-9]{7}$ when set; null otherwise"
        default: null

  - name: AnnualReport
    parent: null
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity
      - name: report_year
        type: integer
        source: input
        description: Calendar year the report covers
        constraints: ">= formation_year and <= current_year(clock)"
      - name: principal_office_address
        type: string
        source: input
        description: Principal office street address as of report date
      - name: officer_director_count
        type: integer
        source: input
        description: Number of officers/directors disclosed (CORP) or members/managers (LLC); >= 1
      - name: status
        type: enum
        source: computed
        description: Filing lifecycle
        constraints: "One of {DRAFT, SUBMITTED, ACCEPTED, REJECTED}"
        default: DRAFT
      - name: submitted_at
        type: datetime
        source: system
        description: Clock time when report transitioned DRAFT→SUBMITTED
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Clock time when report transitioned SUBMITTED→ACCEPTED
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: Free-text reason supplied by TaxOfficer on REJECTED; cleared on next SUBMITTED
        default: null

  - name: FranchiseTaxAssessment
    parent: null
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity
      - name: tax_year
        type: integer
        source: input
        description: Calendar year the assessment covers; unique with business_entity_id
      - name: calculation_method
        type: enum
        source: input
        description: Method used to compute base tax (CORP only); LLC/LP use FLAT
        constraints: "One of {FLAT, AUTHORIZED_SHARES, ASSUMED_PAR_VALUE}; FLAT only when BusinessEntity.entity_type IN {LLC, LP}; AUTHORIZED_SHARES or ASSUMED_PAR_VALUE only when entity_type=CORP"
      - name: base_tax_cents
        type: integer
        source: computed
        description: Base tax in cents per franchise_tax_base calculation
      - name: late_fee_cents
        type: integer
        source: computed
        description: Late penalty in cents per franchise_tax_late_fee calculation; 0 while not OVERDUE
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: base_tax_cents + late_fee_cents; recomputed on every status transition and on every clock advance that increases months_late
      - name: due_date
        type: datetime
        source: system
        description: Statutory due date for tax_year (set on ASSESSED)
      - name: paid_at
        type: datetime
        source: system
        description: Clock time of PAID transition
        default: null
      - name: status
        type: enum
        source: computed
        description: Assessment lifecycle
        constraints: "One of {ASSESSED, PAID, OVERDUE, DELINQUENT}"
        default: ASSESSED

  - name: ForeignQualification
    parent: null
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity (the domestic entity seeking out-of-state qualification)
      - name: foreign_state
        type: string
        source: input
        description: Two-letter US state code in which to qualify
        constraints: "^[A-Z]{2}$ AND != BusinessEntity.home_state; unique with business_entity_id where status != WITHDRAWN and status != REVOKED"
      - name: foreign_registered_agent_id
        type: string
        source: input
        description: FK to RegisteredAgent whose service_state must equal foreign_state
      - name: certificate_of_good_standing_date
        type: datetime
        source: input
        description: Issuance date of the home-state COGS; must be within 60 days of submission
      - name: status
        type: enum
        source: computed
        description: Qualification lifecycle
        constraints: "One of {PENDING, REJECTED, QUALIFIED, WITHDRAWN, REVOKED}"
        default: PENDING
      - name: qualified_at
        type: datetime
        source: system
        description: Clock time of PENDING→QUALIFIED transition
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: Clock time of QUALIFIED→REVOKED transition
        default: null

  - name: BOIReport
    parent: null
    common_fields: true
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity
      - name: filing_type
        type: enum
        source: input
        description: Whether this is the initial filing, an update, or a correction
        constraints: "One of {INITIAL, UPDATE, CORRECTION}; INITIAL allowed only when no prior BOIReport with status IN {FILED, CURRENT, STALE, CORRECTED} exists for this business_entity_id"
      - name: status
        type: enum
        source: computed
        description: Filing lifecycle
        constraints: "One of {DRAFT, FILED, CURRENT, STALE, CORRECTED}"
        default: DRAFT
      - name: filed_at
        type: datetime
        source: system
        description: Clock time of DRAFT→FILED transition
        default: null
      - name: stale_at
        type: datetime
        source: system
        description: Clock time of CURRENT→STALE transition (when a BOIOwnership change is committed without an UPDATE within 30 days)
        default: null
      - name: penalty_cents
        type: integer
        source: computed
        description: Late-disclosure penalty in cents per boi_penalty calculation; accrues only while status=STALE
        default: 0
      - name: days_stale_at_filing
        type: integer
        source: system
        description: Snapshot of days between stale_at and filing of the corrective BOIReport (captured on CORRECTED transition)
        default: 0

  - name: BeneficialOwner
    parent: null
    common_fields: true
    fields:
      - name: full_legal_name
        type: string
        source: input
        description: Natural-person full legal name
      - name: date_of_birth
        type: datetime
        source: input
        description: Date of birth (date-only semantics; must be >= 18 years before clock now)
      - name: residential_address
        type: string
        source: input
        description: Residential street address
      - name: identifying_document_type
        type: enum
        source: input
        description: Government ID used to identify the owner
        constraints: "One of {US_PASSPORT, STATE_DRIVERS_LICENSE, STATE_ID, FOREIGN_PASSPORT}"
      - name: identifying_document_number
        type: string
        source: input
        description: Document number (length 1..50)

  - name: BOIOwnership
    parent: null
    common_fields: false
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity
      - name: beneficial_owner_id
        type: string
        source: input
        description: FK to BeneficialOwner
      - name: ownership_percent_basis_points
        type: integer
        source: input
        description: Ownership stake in basis points (0..10000 = 0%..100%)
        constraints: "Integer in [0, 10000]; sum of active BOIOwnership.ownership_percent_basis_points for a given business_entity_id MUST be exactly 10000 at the moment any BOIReport transitions DRAFT→FILED"
      - name: effective_at
        type: datetime
        source: system
        description: Clock time when this ownership row was added
      - name: terminated_at
        type: datetime
        source: system
        description: Clock time when this ownership row was removed (soft-delete); null means active
        default: null

  - name: ComplianceEvent
    parent: null
    common_fields: false
    fields:
      - name: business_entity_id
        type: string
        source: input
        description: FK to BusinessEntity
      - name: event_type
        type: enum
        source: system
        description: What happened
        constraints: "One of {FORMED, ANNUAL_REPORT_ACCEPTED, ANNUAL_REPORT_REJECTED, TAX_ASSESSED, TAX_PAID, TAX_OVERDUE, TAX_DELINQUENT, BOI_FILED, BOI_STALE, BOI_CORRECTED, FOREIGN_QUALIFIED, FOREIGN_REVOKED, ADMIN_DISSOLVED, VOLUNTARILY_DISSOLVED, AGENT_RESIGNED, COMPLIANCE_STATUS_CHANGED}"
      - name: payload
        type: object
        source: system
        description: Snapshot of the relevant entity fields at event time (e.g., previous and new compliance_status)
      - name: occurred_at
        type: datetime
        source: system
        description: Clock time when the event was emitted

# =============================================================================
# §1.2 STATE MACHINES
# =============================================================================
state_machines:
  - entity: BusinessEntity
    initial_state: PENDING_FORMATION
    terminal_states: [DISSOLVED, ADMINISTRATIVELY_DISSOLVED]
    # NOTE: formation_status governs the lifecycle states below; compliance_status is a
    # parallel posture dimension whose transitions live in §1.2 under the same entity.
    transitions:
      - from: PENDING_FORMATION
        to: ACTIVE
        trigger: "POST /business-registry/entities/{id}/form"
        actor: StateRegistrar
        preconditions:
          - "registered_agent_id resolves to a RegisteredAgent with status=ACTIVE"
          - "RegisteredAgent.service_state == BusinessEntity.home_state"
          - "If entity_type=CORP, authorized_shares is set and >= 1"
        side_effects:
          - "Set formation_date = clock.now()"
          - "Set compliance_status = GOOD_STANDING"
          - "Set next_annual_report_due_date = formation_date + 1 year (anniversary rule)"
          - "Emit ComplianceEvent{event_type=FORMED}"
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /business-registry/entities/{id}/dissolve (voluntary)"
        actor: Filer
        preconditions:
          - "No FranchiseTaxAssessment with status IN {OVERDUE, DELINQUENT} for this entity"
          - "No BOIReport with status=STALE for this entity"
          - "No ForeignQualification with status=QUALIFIED for this entity (must withdraw first)"
        side_effects:
          - "Set formation_status=DISSOLVED, dissolution_date=clock.now(), compliance_status=null"
          - "Cascade: every ForeignQualification with status=QUALIFIED → WITHDRAWN (depth-2 hop into ForeignQualification SM)"
          - "Emit ComplianceEvent{event_type=VOLUNTARILY_DISSOLVED}"
      - from: ACTIVE
        to: ADMINISTRATIVELY_DISSOLVED
        trigger: "POST /business-registry/entities/{id}/administratively-dissolve"
        actor: ComplianceOfficer
        preconditions:
          - "compliance_status = DELINQUENT for >= 60 days (measured against the day compliance_status flipped to DELINQUENT)"
        side_effects:
          - "Set formation_status=ADMINISTRATIVELY_DISSOLVED, dissolution_date=clock.now(), compliance_status=null"
          - "Cascade: every ForeignQualification with status=QUALIFIED → REVOKED (depth-2 hop)"
          - "Cascade: every BOIReport with status IN {CURRENT, STALE} → CORRECTED is NOT triggered (BOI penalty continues to accrue until owner files corrective report)"
          - "Emit ComplianceEvent{event_type=ADMIN_DISSOLVED}"
      # ----- compliance_status sub-machine (parallel posture dimension) -----
      - from: "compliance_status=GOOD_STANDING"
        to: "compliance_status=NOT_IN_GOOD_STANDING"
        trigger: "system: any FranchiseTaxAssessment for this entity transitions to OVERDUE, OR any AnnualReport.due_date passed without ACCEPTED report, OR any BOIReport transitions to STALE"
        actor: system
        preconditions:
          - "formation_status=ACTIVE"
        side_effects:
          - "Emit ComplianceEvent{event_type=COMPLIANCE_STATUS_CHANGED, payload={from: GOOD_STANDING, to: NOT_IN_GOOD_STANDING}}"
      - from: "compliance_status=NOT_IN_GOOD_STANDING"
        to: "compliance_status=DELINQUENT"
        trigger: "system: any FranchiseTaxAssessment.status transitions OVERDUE→DELINQUENT (depth-3 cascade chain origin)"
        actor: system
        preconditions:
          - "formation_status=ACTIVE"
        side_effects:
          - "Emit ComplianceEvent{event_type=COMPLIANCE_STATUS_CHANGED, payload={from: NOT_IN_GOOD_STANDING, to: DELINQUENT}}"
      - from: "compliance_status=NOT_IN_GOOD_STANDING"
        to: "compliance_status=GOOD_STANDING"
        trigger: "system: last open delinquency closes (all FranchiseTaxAssessment.status IN {ASSESSED, PAID} AND all AnnualReport for due years are ACCEPTED AND all BOIReport.status != STALE)"
        actor: system
        preconditions:
          - "formation_status=ACTIVE"
        side_effects:
          - "Emit ComplianceEvent{event_type=COMPLIANCE_STATUS_CHANGED, payload={from: NOT_IN_GOOD_STANDING, to: GOOD_STANDING}}"

  - entity: AnnualReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    # Branching with revert: DRAFT → SUBMITTED → {ACCEPTED | REJECTED}; REJECTED → DRAFT (revision loop).
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /business-registry/annual-reports/{id}/submit"
        actor: Filer
        preconditions:
          - "BusinessEntity.formation_status = ACTIVE"
          - "report_year not already covered by a SUBMITTED or ACCEPTED AnnualReport for same business_entity_id"
          - "officer_director_count >= 1"
        side_effects:
          - "Set submitted_at = clock.now()"
          - "rejection_reason cleared to null"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /business-registry/annual-reports/{id}/accept"
        actor: TaxOfficer
        preconditions:
          - "Acceptor X-User-ID != BusinessEntity.id (segregation of duties — the Filer that submitted cannot also accept)"
          - "BusinessEntity.formation_status = ACTIVE"
        side_effects:
          - "Set accepted_at = clock.now()"
          - "BusinessEntity.next_annual_report_due_date = (formation_date anniversary in report_year+1)"
          - "Recompute BusinessEntity.compliance_status: if no other open delinquency, transition NOT_IN_GOOD_STANDING → GOOD_STANDING"
          - "Emit ComplianceEvent{event_type=ANNUAL_REPORT_ACCEPTED}"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /business-registry/annual-reports/{id}/reject"
        actor: TaxOfficer
        preconditions:
          - "rejection_reason provided (non-empty string)"
        side_effects:
          - "Emit ComplianceEvent{event_type=ANNUAL_REPORT_REJECTED}"
      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /business-registry/annual-reports/{id} (revision)"
        actor: Filer
        preconditions: []
        side_effects:
          - "rejection_reason cleared to null on next SUBMITTED"
        note: "Cyclic loop REJECTED→DRAFT→SUBMITTED→… enables an unbounded revision cycle."

  - entity: FranchiseTaxAssessment
    initial_state: ASSESSED
    terminal_states: [PAID]
    # Cycle: ASSESSED → OVERDUE (clock advance past due_date) → DELINQUENT (clock advance past due_date+90 days)
    # Payment is allowed from ASSESSED, OVERDUE, or DELINQUENT. PAID is terminal.
    transitions:
      - from: ASSESSED
        to: OVERDUE
        trigger: "system: clock.now() > due_date (detected by sweep on POST /_clock/advance)"
        actor: system
        preconditions:
          - "status = ASSESSED"
        side_effects:
          - "Recompute late_fee_cents and total_due_cents per franchise_tax_late_fee"
          - "Drive BusinessEntity.compliance_status GOOD_STANDING → NOT_IN_GOOD_STANDING (depth-2 cascade)"
          - "Emit ComplianceEvent{event_type=TAX_OVERDUE}"
      - from: OVERDUE
        to: DELINQUENT
        trigger: "system: clock.now() > due_date + 90 days (sweep)"
        actor: system
        preconditions:
          - "status = OVERDUE"
        side_effects:
          - "Recompute late_fee_cents and total_due_cents"
          - "Drive BusinessEntity.compliance_status NOT_IN_GOOD_STANDING → DELINQUENT (depth-3 cascade)"
          - "Emit ComplianceEvent{event_type=TAX_DELINQUENT}"
      - from: ASSESSED
        to: PAID
        trigger: "POST /business-registry/tax-assessments/{id}/pay"
        actor: Filer
        preconditions:
          - "Payor X-User-ID != accepting TaxOfficer of any AnnualReport for this entity in tax_year (segregation of duties)"
        side_effects:
          - "Set paid_at = clock.now()"
          - "Emit ComplianceEvent{event_type=TAX_PAID}"
      - from: OVERDUE
        to: PAID
        trigger: "POST /business-registry/tax-assessments/{id}/pay"
        actor: Filer
        preconditions: []
        side_effects:
          - "Recompute final late_fee_cents = months_late_at(clock.now()) * 0.015 * base_tax_cents + 20000"
          - "Set paid_at, recompute total_due_cents"
          - "Recompute BusinessEntity.compliance_status (may revert to GOOD_STANDING)"
          - "Emit ComplianceEvent{event_type=TAX_PAID}"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /business-registry/tax-assessments/{id}/pay"
        actor: Filer
        preconditions: []
        side_effects:
          - "Recompute final late_fee_cents = months_late_at(clock.now()) * 0.015 * base_tax_cents + 20000 (months capped at 18)"
          - "Set paid_at, recompute total_due_cents"
          - "Recompute BusinessEntity.compliance_status (may revert to NOT_IN_GOOD_STANDING or GOOD_STANDING depending on other open items)"
          - "Emit ComplianceEvent{event_type=TAX_PAID}"

  - entity: ForeignQualification
    initial_state: PENDING
    terminal_states: [WITHDRAWN, REVOKED]
    # Cyclic shape: PENDING → REJECTED → PENDING allows resubmission with new COGS.
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /business-registry/foreign-qualifications/{id}/approve"
        actor: StateRegistrar
        preconditions:
          - "BusinessEntity.compliance_status = GOOD_STANDING"
          - "(clock.now() - certificate_of_good_standing_date) <= 60 days"
          - "foreign_registered_agent_id resolves to RegisteredAgent.status=ACTIVE AND RegisteredAgent.service_state == ForeignQualification.foreign_state"
        side_effects:
          - "Set qualified_at = clock.now()"
          - "Emit ComplianceEvent{event_type=FOREIGN_QUALIFIED}"
      - from: PENDING
        to: REJECTED
        trigger: "POST /business-registry/foreign-qualifications/{id}/reject"
        actor: StateRegistrar
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: PENDING
        trigger: "PATCH /business-registry/foreign-qualifications/{id} (resubmit)"
        actor: Filer
        preconditions:
          - "certificate_of_good_standing_date supplied is within 60 days of clock.now()"
        side_effects: []
        note: "Cyclic loop for resubmission after rejection."
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "POST /business-registry/foreign-qualifications/{id}/withdraw OR cascade from BusinessEntity DISSOLVED"
        actor: Filer | system
        preconditions: []
        side_effects:
          - "Emit ComplianceEvent{event_type=FOREIGN_REVOKED, payload={cause: WITHDRAWN}}"
      - from: QUALIFIED
        to: REVOKED
        trigger: "system: cascade from BusinessEntity ADMINISTRATIVELY_DISSOLVED"
        actor: system
        preconditions: []
        side_effects:
          - "Set revoked_at = clock.now()"
          - "Emit ComplianceEvent{event_type=FOREIGN_REVOKED, payload={cause: ADMIN_DISSOLVED}}"

  - entity: BOIReport
    initial_state: DRAFT
    terminal_states: [CORRECTED]
    # CYCLE: CURRENT ↔ STALE. STALE → CORRECTED (new corrective filing replaces stale snapshot).
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /business-registry/boi-reports/{id}/file"
        actor: Filer
        preconditions:
          - "BusinessEntity.formation_status = ACTIVE"
          - "Sum of ownership_percent_basis_points for active BOIOwnership rows of business_entity_id == 10000"
          - "Every active BeneficialOwner has DOB <= clock.now() - 18 years"
        side_effects:
          - "Set filed_at = clock.now()"
          - "Immediately auto-advance to CURRENT"
          - "Emit ComplianceEvent{event_type=BOI_FILED}"
      - from: FILED
        to: CURRENT
        trigger: "system: immediate auto-transition on FILED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURRENT
        to: STALE
        trigger: "system: a BOIOwnership row is added or terminated AND no new BOIReport(filing_type IN {UPDATE, CORRECTION}) is filed within 30 days"
        actor: system
        preconditions: []
        side_effects:
          - "Set stale_at = clock.now()"
          - "Drive BusinessEntity.compliance_status GOOD_STANDING → NOT_IN_GOOD_STANDING (depth-2 cascade)"
          - "Begin accruing penalty_cents per boi_penalty calculation"
          - "Emit ComplianceEvent{event_type=BOI_STALE}"
      - from: STALE
        to: CORRECTED
        trigger: "POST /business-registry/boi-reports/{id}/correct (the corrective BOIReport with filing_type=CORRECTION transitions to FILED, which marks the previous STALE report CORRECTED)"
        actor: Filer
        preconditions:
          - "Corrective BOIReport is in DRAFT and references same business_entity_id"
        side_effects:
          - "Snapshot days_stale_at_filing = floor((clock.now() - stale_at) / 1 day)"
          - "Finalize penalty_cents = min(days_stale_at_filing * 59100, 1000000)"
          - "Emit ComplianceEvent{event_type=BOI_CORRECTED}"
      - from: STALE
        to: CURRENT
        trigger: "system: an UPDATE BOIReport completes (filing_type=UPDATE transitions DRAFT→FILED→CURRENT) — and the prior STALE report is CORRECTED in the same operation"
        actor: system
        preconditions: []
        side_effects:
          - "Emit ComplianceEvent{event_type=BOI_CORRECTED}"
        note: "Cycle: CURRENT → STALE → CURRENT via timely UPDATE."

  - entity: EINApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /business-registry/ein-applications/{id}/submit"
        actor: Filer
        preconditions:
          - "BusinessEntity.formation_status = ACTIVE"
          - "responsible_party_ssn_last4 matches ^[0-9]{4}$"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /business-registry/ein-applications/{id}/approve"
        actor: TaxOfficer
        preconditions:
          - "Approver X-User-ID != BusinessEntity.id (segregation of duties)"
        side_effects:
          - "Mint assigned_ein = next available ^[0-9]{2}-[0-9]{7}$"
          - "Set BusinessEntity.ein = assigned_ein (derived field reconciliation)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /business-registry/ein-applications/{id}/reject"
        actor: TaxOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 CONCURRENCY RULES
# =============================================================================
concurrency_rules:
  - scenario: "Two clients submit different AnnualReports for the same business_entity_id and report_year simultaneously"
    guarantee: "At most one SUBMITTED or ACCEPTED AnnualReport per (business_entity_id, report_year)"
    error_id: ERR_DUPLICATE_ANNUAL_REPORT
    http_status: 409
    serialization: "First-writer-wins on AnnualReport.submitted_at; the loser's submit returns ERR_DUPLICATE_ANNUAL_REPORT"

  - scenario: "Two clients pay the same FranchiseTaxAssessment simultaneously"
    guarantee: "Exactly one /pay call succeeds; the second returns ERR_INVALID_STATE because status already advanced to PAID"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on FranchiseTaxAssessment.status; assessment row is row-locked during status transition"

  - scenario: "Two clients approve the same EINApplication concurrently, racing for the next available EIN"
    guarantee: "At most one EINApplication acquires a given EIN; second approve returns ERR_INVALID_STATE since the first transitioned SUBMITTED→APPROVED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on EINApplication.status; EIN minting is atomic with status transition"

  - scenario: "Two ForeignQualification filings race for the same (business_entity_id, foreign_state) where only one non-terminal row is allowed"
    guarantee: "At most one non-terminal (status NOT IN {WITHDRAWN, REVOKED}) ForeignQualification per (business_entity_id, foreign_state)"
    error_id: ERR_DUPLICATE_FOREIGN_QUALIFICATION
    http_status: 409
    serialization: "First-writer-wins on ForeignQualification creation"

  - scenario: "Two clients attempt to dissolve the same BusinessEntity simultaneously while a third client files an AnnualReport"
    guarantee: "At most one dissolution path completes; the second dissolve receives ERR_INVALID_STATE because formation_status already DISSOLVED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on BusinessEntity.formation_status transition"

  - scenario: "Voluntary dissolution races with creation of a new FranchiseTaxAssessment for the same entity"
    guarantee: "Either the dissolve succeeds and the assessment creation is rejected with ERR_INVALID_STATE, or the assessment is created first and the dissolve is rejected with ERR_HAS_DEPENDENCIES if it would leave the assessment OVERDUE/DELINQUENT"
    error_id: ERR_HAS_DEPENDENCIES
    http_status: 409
    serialization: "First-writer-wins on BusinessEntity.formation_status; dependency check is re-evaluated under the lock"

# =============================================================================
# §1.3 CALCULATIONS
# =============================================================================
calculations:
  # ---- Variant pair 1 (CORP entity domain): franchise tax base by two valid methods
  - name: franchise_tax_base
    trigger: "Computed on POST /business-registry/tax-assessments (create) and recomputed whenever BusinessEntity.authorized_shares, total_gross_assets_cents, or total_issued_shares is updated before the assessment is PAID"
    algorithm: tiered_pricing
    formula: |
      # All amounts in cents (integer).
      # FLAT method (LLC/LP):
      base_tax_cents = LLC_LP_FLAT_TAX_CENTS  # 30000 (= $300.00)

      # AUTHORIZED_SHARES method (CORP variant A):
      def authorized_shares_method(authorized_shares):
          if authorized_shares <= 5000:
              return 17500       # $175.00
          if authorized_shares <= 10000:
              return 25000       # $250.00
          extra = authorized_shares - 10000
          blocks = ceil(extra / 10000)
          return 25000 + blocks * 8500   # +$85.00 per additional 10,000 shares

      # ASSUMED_PAR_VALUE method (CORP variant B):
      def assumed_par_value_method(total_gross_assets_cents, total_issued_shares, authorized_shares):
          if total_issued_shares == 0:
              raise ERR_INVALID_INPUT
          assumed_par_cents = total_gross_assets_cents / total_issued_shares  # rational, no rounding yet
          apvc_cents = assumed_par_cents * authorized_shares                  # rational
          # Round assumed_par_value_capital UP to the next $1,000,000 (= 100_000_000 cents)
          # Tax = millions * $400 = millions * 40000 cents
          millions = ceil(apvc_cents / 100_000_000)
          return millions * 40000
    input_set: "FLAT for entity_type IN {LLC, LP}; for CORP, the Filer chooses calculation_method between AUTHORIZED_SHARES and ASSUMED_PAR_VALUE; the server computes both and rejects the chosen method only if the resulting tax differs from the OTHER method by > 50% (sanity check, ERR_TAX_METHOD_MISMATCH). When both methods compute legally, the lower of the two is the legally minimum tax owed; the Filer MAY choose either."
    constants:
      LLC_LP_FLAT_TAX_CENTS: 30000
      CORP_TIER1_MAX_SHARES: 5000
      CORP_TIER1_TAX_CENTS: 17500
      CORP_TIER2_MAX_SHARES: 10000
      CORP_TIER2_TAX_CENTS: 25000
      CORP_TIER3_BLOCK_SHARES: 10000
      CORP_TIER3_BLOCK_TAX_CENTS: 8500
      ASSUMED_PAR_MILLION_CENTS: 100000000
      ASSUMED_PAR_PER_MILLION_TAX_CENTS: 40000
    precision: "Integer cents; rounding only happens in the ceil() steps as pinned above. No round_half_up here."
    variants:
      - name: authorized_shares
        when: "calculation_method = AUTHORIZED_SHARES (CORP only)"
        difference: "Base tax derived solely from authorized_shares field via the tiered ladder. Independent of asset/issued counts."
      - name: assumed_par_value
        when: "calculation_method = ASSUMED_PAR_VALUE (CORP only)"
        difference: "Base tax derived from total_gross_assets_cents and total_issued_shares; for the same CORP, identical input record produces DIFFERENT base_tax_cents than the authorized_shares method (e.g., 12,000 authorized shares + $1,000,000 assets + 8,000 issued = $800 par-value tax vs $335 shares-method tax)."

  # ---- Variant pair 2 (BeneficialOwner / BOIReport domain): exposure score with reset
  - name: beneficial_owner_exposure_score
    trigger: "Computed on demand via GET /business-registry/entities/{id}/exposure-summary and recomputed whenever BOIReport transitions to CORRECTED or STALE"
    algorithm: weighted_scoring
    formula: |
      # All percentages in basis points (10000 = 100%). Score has two valid variants.

      # PROVISIONAL variant: includes BOIOwnership rows that are active AT clock.now()
      # regardless of whether the latest BOIReport is STALE. This counts every owner currently
      # on-file even if not yet disclosed.
      provisional_score(entity) =
          sum( bps_to_unit(o.ownership_percent_basis_points) * owner_risk(o)
               for o in active_BOIOwnership(entity_id=entity.id, at=clock.now()) )

      # FINALIZED variant: includes ONLY BOIOwnership rows that were active as of the latest
      # BOIReport with status IN {CURRENT, CORRECTED}.snapshot_at (i.e., what regulators see).
      # If the latest BOIReport is STALE or DRAFT, finalized_score uses the prior CURRENT snapshot.
      finalized_score(entity) =
          sum( bps_to_unit(o.ownership_percent_basis_points) * owner_risk(o)
               for o in BOIOwnership snapshot_at(latest_CURRENT_or_CORRECTED_BOIReport.filed_at) )

      def owner_risk(o):
          # Three valid risk tiers based on identifying_document_type
          if o.beneficial_owner.identifying_document_type == FOREIGN_PASSPORT: return 3
          if o.beneficial_owner.identifying_document_type == STATE_ID:         return 2
          return 1   # US_PASSPORT or STATE_DRIVERS_LICENSE
    input_set: "PROVISIONAL pulls BOIOwnership rows where terminated_at IS NULL OR terminated_at > clock.now(); FINALIZED pulls the snapshot frozen at the most recent BOIReport.filed_at whose status IN {CURRENT, CORRECTED}."
    constants:
      RISK_FOREIGN_PASSPORT: 3
      RISK_STATE_ID: 2
      RISK_DEFAULT: 1
    precision: "2 decimal places, round_half_up on the final sum"
    variants:
      - name: provisional
        when: "Triggered by GET .../exposure-summary?view=provisional"
        difference: "Uses live ownership rows; reflects pending undisclosed changes"
      - name: finalized
        when: "Triggered by GET .../exposure-summary?view=finalized or by the server when emitting a BOIReport snapshot"
        difference: "Uses the last regulator-visible snapshot; identical inputs to provisional only when the latest BOIReport is CURRENT and no ownership change has happened since."

  # ---- Combinatorial mode (a): late fee with multi-input non-linear formula
  - name: franchise_tax_late_fee
    trigger: "Recomputed on FranchiseTaxAssessment.status transition ASSESSED→OVERDUE, OVERDUE→DELINQUENT, and on every pay attempt; also on every POST /_clock/advance that crosses a month boundary while status IN {OVERDUE, DELINQUENT}"
    algorithm: threshold
    formula: |
      # Inputs: base_tax_cents (int), due_date (datetime), now (datetime)
      # Output: late_fee_cents (int)
      if status == ASSESSED and now <= due_date:
          return 0
      months_late = ceil( (now - due_date) / 30 days )   # integer; partial month counts as full month
      months_late = min(months_late, LATE_FEE_MONTH_CAP)  # cap at 18
      monthly_interest_cents = round_half_up( base_tax_cents * MONTHLY_INTEREST_RATE )  # 0.015 per month
      return LATE_FEE_FLAT_CENTS + monthly_interest_cents * months_late
    input_set: "Only FranchiseTaxAssessments with status IN {OVERDUE, DELINQUENT}; ASSESSED and PAID assessments always have late_fee_cents = 0"
    constants:
      LATE_FEE_FLAT_CENTS: 20000          # $200.00 base late fee
      MONTHLY_INTEREST_RATE: 0.015        # 1.5% of base_tax_cents per month
      LATE_FEE_MONTH_CAP: 18
    precision: "Integer cents; monthly_interest_cents is round_half_up(base_tax_cents * 0.015) BEFORE multiplying by months_late (per-line rounding mode pinned)"

  # ---- Combinatorial mode (b): BOI penalty with nested rounding order pinned
  - name: boi_penalty
    trigger: "Recomputed every POST /_clock/advance while BOIReport.status = STALE, and finalized on STALE→CORRECTED transition"
    algorithm: threshold
    formula: |
      # Inputs: stale_at (datetime), now (datetime)
      # Output: penalty_cents (int)
      # Daily count uses floor of whole-day elapsed since stale_at:
      raw_days = floor( (now - stale_at) / 1 day )
      # PINNED ORDER: cap daily_count to PENALTY_CAP_CENTS / DAILY_PENALTY_CENTS FIRST,
      # then multiply by DAILY_PENALTY_CENTS. Reversing (multiply then cap) yields the same final
      # cap but produces different audit reporting of "days counted"; cap-first is normative here.
      cap_days = floor(PENALTY_CAP_CENTS / DAILY_PENALTY_CENTS)   # 1000000 / 59100 = 16
      effective_days = min(raw_days, cap_days)
      penalty_cents = effective_days * DAILY_PENALTY_CENTS
      return penalty_cents
    input_set: "Only BOIReports whose status = STALE (or was STALE at CORRECTED.snapshot)"
    constants:
      DAILY_PENALTY_CENTS: 59100          # $591/day
      PENALTY_CAP_CENTS: 1000000          # $10,000 cap
    precision: "Integer cents; floor on day count, no rounding on multiplication"

  # ---- Combinatorial mode (c): pinned evaluation order (circular-looking dependency)
  - name: total_due_with_credit_application
    trigger: "Computed on FranchiseTaxAssessment payment and on GET /business-registry/tax-assessments/{id}"
    algorithm: constraint_propagation
    formula: |
      # Looks circular because:
      #   total_due_cents = base_tax_cents + late_fee_cents - credit_applied_cents
      #   credit_applied_cents = min(BusinessEntity.credit_balance_cents, base_tax_cents + late_fee_cents)
      #   late_fee_cents (months capped at 18) depends on whether status is OVERDUE/DELINQUENT,
      #   which itself depends on whether prior assessments were PAID
      # PINNED EVALUATION ORDER:
      #   1) Compute late_fee_cents from franchise_tax_late_fee FIRST (uses current status).
      #   2) Compute pre_credit_due = base_tax_cents + late_fee_cents.
      #   3) Compute credit_applied_cents = min(BusinessEntity.credit_balance_cents at time of pay,
      #      pre_credit_due). credit_balance_cents is sourced from the ENTITY's running balance,
      #      NOT recomputed here.
      #   4) total_due_cents = pre_credit_due - credit_applied_cents.
      #   5) On PAY: decrement BusinessEntity.credit_balance_cents by credit_applied_cents
      #      (atomic with status transition). Late_fee_cents is NOT recomputed after step 4.
      pass
    input_set: "Only FranchiseTaxAssessments with status IN {ASSESSED, OVERDUE, DELINQUENT}; PAID assessments are immutable."
    constants: {}
    precision: "Integer cents; no rounding (all intermediate values are integer cents already)"

  # ---- Aggregation: compliance_status derived field
  - name: derived_compliance_status
    trigger: "Recomputed whenever any of {FranchiseTaxAssessment.status, AnnualReport.status, BOIReport.status} changes for an entity, and on every POST /_clock/advance"
    algorithm: aggregation
    formula: |
      # Output: BusinessEntity.compliance_status ∈ {GOOD_STANDING, NOT_IN_GOOD_STANDING, DELINQUENT}
      open_tax_overdue = any FranchiseTaxAssessment for entity with status IN {OVERDUE}
      open_tax_delinquent = any FranchiseTaxAssessment for entity with status = DELINQUENT
      missing_report = ( now > BusinessEntity.next_annual_report_due_date
                         AND no AnnualReport for entity with report_year >= year(next_annual_report_due_date)
                                 and status = ACCEPTED )
      boi_stale = any BOIReport for entity with status = STALE

      if open_tax_delinquent:
          return DELINQUENT
      if open_tax_overdue or missing_report or boi_stale:
          return NOT_IN_GOOD_STANDING
      return GOOD_STANDING
    input_set: "All FranchiseTaxAssessment / AnnualReport / BOIReport rows for the entity at current clock"
    constants: {}
    precision: "Discrete enum; no rounding"

# =============================================================================
# §1.4 VALIDATIONS (priority ordered)
# =============================================================================
validations:
  # 1-3: Auth / authorization / existence
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role IN {Filer, StateRegistrar, TaxOfficer, ComplianceOfficer, RegisteredAgentService}"
    error_id: ERR_INVALID_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC Matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path resources resolved left-to-right; resource(s) named in the URL exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints addressing a resource by id"
  - priority: 5
    category: existence
    check: "Body-referenced foreign keys resolve (e.g., registered_agent_id, business_entity_id, beneficial_owner_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PATCH endpoints carrying FK fields"
  # 6-7: State preconditions
  - priority: 6
    category: state
    check: "Target resource is in a state that permits this operation per §1.2 state machines (e.g., AnnualReport.status=SUBMITTED required for /accept)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-mutating endpoint"
  - priority: 7
    category: state
    check: "Parent BusinessEntity.formation_status = ACTIVE for any child-mutating endpoint"
    error_id: ERR_ENTITY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST/PATCH on AnnualReport, FranchiseTaxAssessment, BOIReport, ForeignQualification, EINApplication"
  # 8-12: Business safety / compliance (segregation of duties + statutory rules)
  - priority: 8
    category: business_safety
    check: "Segregation of duties: the acting Filer (X-User-ID = BusinessEntity.id) MUST NOT be the actor of /accept on the same AnnualReport, nor /approve on the same EINApplication, nor /pay on a FranchiseTaxAssessment that they /accepted as TaxOfficer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "/business-registry/annual-reports/{id}/accept, /business-registry/ein-applications/{id}/approve, /business-registry/tax-assessments/{id}/pay"
  - priority: 9
    category: business_safety
    check: "RegisteredAgent.physical_address must NOT match the P.O. Box pattern"
    error_id: ERR_INVALID_AGENT_ADDRESS
    http_status: 422
    applies_to: "POST /business-registry/registered-agents, PATCH /business-registry/registered-agents/{id}"
  - priority: 10
    category: business_safety
    check: "BeneficialOwner age >= 18 years at clock.now() when adding ownership to a BOIReport that is about to FILE"
    error_id: ERR_OWNER_UNDERAGE
    http_status: 422
    applies_to: "POST /business-registry/boi-reports/{id}/file"
  - priority: 11
    category: business_safety
    check: "Certificate of Good Standing date is within 60 days of clock.now() at the moment the ForeignQualification transitions PENDING→QUALIFIED"
    error_id: ERR_STALE_COGS
    http_status: 422
    applies_to: "POST /business-registry/foreign-qualifications/{id}/approve"
  - priority: 12
    category: business_safety
    check: "ForeignQualification.foreign_registered_agent_id resolves to a RegisteredAgent whose service_state EQUALS the ForeignQualification.foreign_state"
    error_id: ERR_AGENT_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /business-registry/foreign-qualifications, POST .../foreign-qualifications/{id}/approve"
  # 13-16: Referential / temporal / constraint
  - priority: 13
    category: business_referential
    check: "OperatingAgreement.template_code must match BusinessEntity.entity_type: LLC → {LLC_MM, LLC_MGR}; CORP → {CORP_BYLAWS}; LP → {LP_AGREEMENT}"
    error_id: ERR_TEMPLATE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /business-registry/operating-agreements"
  - priority: 14
    category: business_temporal
    check: "AnnualReport.report_year > formation_year(BusinessEntity.formation_date) AND <= year(clock.now()) AND not already covered by SUBMITTED or ACCEPTED report"
    error_id: ERR_DUPLICATE_ANNUAL_REPORT
    http_status: 409
    applies_to: "POST /business-registry/annual-reports"
  - priority: 15
    category: business_referential
    check: "Sum of active BOIOwnership.ownership_percent_basis_points for a business_entity_id MUST equal exactly 10000 at the moment a BOIReport transitions DRAFT→FILED"
    error_id: ERR_OWNERSHIP_NOT_100
    http_status: 422
    applies_to: "POST /business-registry/boi-reports/{id}/file"
  - priority: 16
    category: business_referential
    check: "ForeignQualification.foreign_state MUST NOT equal BusinessEntity.home_state"
    error_id: ERR_FOREIGN_STATE_IS_HOME
    http_status: 422
    applies_to: "POST /business-registry/foreign-qualifications"
  # 17-19: Business constraint / uniqueness
  - priority: 17
    category: business_constraint
    check: "BusinessEntity.legal_name must be unique (case-insensitive) among entities with formation_status NOT IN {DISSOLVED, ADMINISTRATIVELY_DISSOLVED}"
    error_id: ERR_DUPLICATE_LEGAL_NAME
    http_status: 409
    applies_to: "POST /business-registry/entities, PATCH /business-registry/entities/{id}"
  - priority: 18
    category: business_constraint
    check: "At most one non-terminal (status NOT IN {WITHDRAWN, REVOKED}) ForeignQualification per (business_entity_id, foreign_state)"
    error_id: ERR_DUPLICATE_FOREIGN_QUALIFICATION
    http_status: 409
    applies_to: "POST /business-registry/foreign-qualifications"
  - priority: 19
    category: business_constraint
    check: "BusinessEntity may not voluntarily DISSOLVE while any FranchiseTaxAssessment.status IN {OVERDUE, DELINQUENT} or any BOIReport.status = STALE or any ForeignQualification.status = QUALIFIED"
    error_id: ERR_HAS_DEPENDENCIES
    http_status: 409
    applies_to: "POST /business-registry/entities/{id}/dissolve"
  # 20-22: Business fiscal
  - priority: 20
    category: business_fiscal
    check: "If entity_type=CORP at /tax-assessments creation, calculation_method MUST be AUTHORIZED_SHARES or ASSUMED_PAR_VALUE (not FLAT); if entity_type IN {LLC, LP}, calculation_method MUST be FLAT"
    error_id: ERR_INVALID_TAX_METHOD
    http_status: 422
    applies_to: "POST /business-registry/tax-assessments"
  - priority: 21
    category: business_fiscal
    check: "For CORP with both methods computable, the chosen method MUST NOT exceed the OTHER method's result by more than 50% (sanity rail to prevent inadvertent over-payment selection)"
    error_id: ERR_TAX_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /business-registry/tax-assessments"
  - priority: 22
    category: business_fiscal
    check: "FranchiseTaxAssessment.tax_year must be unique per BusinessEntity"
    error_id: ERR_DUPLICATE_TAX_YEAR
    http_status: 409
    applies_to: "POST /business-registry/tax-assessments"

# =============================================================================
# §1.5 ENDPOINTS
# =============================================================================
endpoints:
  # ---- BusinessEntity
  - method: POST
    path: "/business-registry/entities"
    description: "Create a new BusinessEntity in PENDING_FORMATION"
    roles: [Filer]
    code: 201
    input: [legal_name, entity_type, home_state, registered_agent_id, "authorized_shares?", "total_gross_assets_cents?", "total_issued_shares?"]
    output: BusinessEntity
    side_effects: []
  - method: GET
    path: "/business-registry/entities/{id}"
    description: "Read a BusinessEntity including derived compliance_status, next_annual_report_due_date, ein"
    roles: [Filer, StateRegistrar, TaxOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: BusinessEntity
    side_effects: []
  - method: GET
    path: "/business-registry/entities"
    description: "List entities; filter by entity_type, formation_status, compliance_status; paginated"
    roles: [Filer, StateRegistrar, TaxOfficer, ComplianceOfficer]
    code: 200
    input: ["entity_type?", "formation_status?", "compliance_status?", "limit?", "offset?"]
    output: "BusinessEntity[]"
    side_effects: []
  - method: POST
    path: "/business-registry/entities/{id}/form"
    description: "Transition PENDING_FORMATION → ACTIVE; mints formation_date and starts compliance clock"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: BusinessEntity
    side_effects: ["set formation_date", "set compliance_status=GOOD_STANDING", "set next_annual_report_due_date", "emit ComplianceEvent FORMED"]
  - method: POST
    path: "/business-registry/entities/{id}/dissolve"
    description: "Voluntary dissolution"
    roles: [Filer]
    code: 200
    input: []
    output: BusinessEntity
    side_effects: ["cascade WITHDRAW all QUALIFIED ForeignQualifications", "emit ComplianceEvent VOLUNTARILY_DISSOLVED"]
  - method: POST
    path: "/business-registry/entities/{id}/administratively-dissolve"
    description: "Compliance-driven dissolution after >=60 days DELINQUENT"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BusinessEntity
    side_effects: ["cascade REVOKE all QUALIFIED ForeignQualifications", "emit ComplianceEvent ADMIN_DISSOLVED"]
  - method: GET
    path: "/business-registry/entities/{id}/exposure-summary"
    description: "Computed read: BeneficialOwner exposure score (provisional vs finalized)"
    roles: [Filer, ComplianceOfficer]
    code: 200
    input: ["view?"]      # view IN {provisional, finalized}; default finalized
    output: "object"      # {provisional_score, finalized_score, view}
    side_effects: []

  # ---- RegisteredAgent
  - method: POST
    path: "/business-registry/registered-agents"
    description: "Create a registered agent"
    roles: [RegisteredAgentService, StateRegistrar]
    code: 201
    input: [agent_name, physical_address, service_state]
    output: RegisteredAgent
    side_effects: []
  - method: PATCH
    path: "/business-registry/registered-agents/{id}"
    description: "Update agent fields including physical_address; OCC"
    roles: [RegisteredAgentService, StateRegistrar]
    code: 200
    input: ["agent_name?", "physical_address?", "version?"]
    output: RegisteredAgent
    side_effects: []
  - method: POST
    path: "/business-registry/registered-agents/{id}/resign"
    description: "Agent resigns; marks status=RESIGNED; entities with this agent must replace within 30 days"
    roles: [RegisteredAgentService]
    code: 200
    input: []
    output: RegisteredAgent
    side_effects: ["set status=RESIGNED, resignation_effective_at=clock.now()"]

  # ---- OperatingAgreement
  - method: POST
    path: "/business-registry/operating-agreements"
    description: "Attach an operating agreement template to a BusinessEntity"
    roles: [Filer]
    code: 201
    input: [business_entity_id, template_code, template_version]
    output: OperatingAgreement
    side_effects: ["compute locked_template_hash"]

  # ---- EINApplication
  - method: POST
    path: "/business-registry/ein-applications"
    description: "Create EIN application in DRAFT"
    roles: [Filer]
    code: 201
    input: [business_entity_id, responsible_party_name, responsible_party_ssn_last4]
    output: EINApplication
    side_effects: []
  - method: POST
    path: "/business-registry/ein-applications/{id}/submit"
    description: "DRAFT → SUBMITTED"
    roles: [Filer]
    code: 200
    input: []
    output: EINApplication
    side_effects: []
  - method: POST
    path: "/business-registry/ein-applications/{id}/approve"
    description: "SUBMITTED → APPROVED; mints EIN and updates BusinessEntity.ein"
    roles: [TaxOfficer]
    code: 200
    input: []
    output: EINApplication
    side_effects: ["mint assigned_ein", "set BusinessEntity.ein"]
  - method: POST
    path: "/business-registry/ein-applications/{id}/reject"
    description: "SUBMITTED → REJECTED"
    roles: [TaxOfficer]
    code: 200
    input: []
    output: EINApplication
    side_effects: []

  # ---- AnnualReport
  - method: POST
    path: "/business-registry/annual-reports"
    description: "Create AnnualReport in DRAFT"
    roles: [Filer]
    code: 201
    input: [business_entity_id, report_year, principal_office_address, officer_director_count]
    output: AnnualReport
    side_effects: []
  - method: PATCH
    path: "/business-registry/annual-reports/{id}"
    description: "Revise a DRAFT or REJECTED AnnualReport (cyclic revert loop)"
    roles: [Filer]
    code: 200
    input: ["principal_office_address?", "officer_director_count?", "version?"]
    output: AnnualReport
    side_effects: ["if status=REJECTED, transition to DRAFT and clear rejection_reason"]
  - method: POST
    path: "/business-registry/annual-reports/{id}/submit"
    description: "DRAFT → SUBMITTED"
    roles: [Filer]
    code: 200
    input: []
    output: AnnualReport
    side_effects: []
  - method: POST
    path: "/business-registry/annual-reports/{id}/accept"
    description: "SUBMITTED → ACCEPTED; advances next_annual_report_due_date"
    roles: [TaxOfficer]
    code: 200
    input: []
    output: AnnualReport
    side_effects: ["advance BusinessEntity.next_annual_report_due_date", "recompute compliance_status"]
  - method: POST
    path: "/business-registry/annual-reports/{id}/reject"
    description: "SUBMITTED → REJECTED"
    roles: [TaxOfficer]
    code: 200
    input: [rejection_reason]
    output: AnnualReport
    side_effects: []

  # ---- FranchiseTaxAssessment
  - method: POST
    path: "/business-registry/tax-assessments"
    description: "Create a franchise tax assessment for (business_entity_id, tax_year); computes base_tax_cents per chosen method"
    roles: [TaxOfficer]
    code: 201
    input: [business_entity_id, tax_year, calculation_method]
    output: FranchiseTaxAssessment
    side_effects: ["compute base_tax_cents", "set due_date = March 1 of (tax_year+1)"]
  - method: GET
    path: "/business-registry/tax-assessments/{id}"
    description: "Read assessment with live total_due_with_credit_application result"
    roles: [Filer, TaxOfficer]
    code: 200
    input: []
    output: FranchiseTaxAssessment
    side_effects: []
  - method: POST
    path: "/business-registry/tax-assessments/{id}/pay"
    description: "Pay assessment from any non-PAID state; applies credit_balance per pinned evaluation order"
    roles: [Filer]
    code: 200
    input: []
    output: FranchiseTaxAssessment
    side_effects: ["set paid_at", "recompute late_fee_cents and total_due_cents", "decrement BusinessEntity.credit_balance_cents by credit_applied_cents", "recompute compliance_status"]
  - method: POST
    path: "/business-registry/tax-assessments/{id}/refund"
    description: "Compensating action that reverses a PAID assessment back to ASSESSED/OVERDUE/DELINQUENT (whichever the clock dictates), restoring BusinessEntity.credit_balance_cents by exactly credit_applied_cents so that the global credit invariant is preserved"
    roles: [TaxOfficer]
    code: 200
    input: []
    output: FranchiseTaxAssessment
    side_effects: ["clear paid_at", "restore BusinessEntity.credit_balance_cents by credit_applied_cents (compensating invariant)", "recompute status from clock vs due_date", "recompute compliance_status"]
  - method: POST
    path: "/business-registry/entities/{id}/credit-deposit"
    description: "Deposit pre-paid credit cents onto a BusinessEntity (admin-only top-up)"
    roles: [TaxOfficer]
    code: 200
    input: [amount_cents]
    output: BusinessEntity
    side_effects: ["BusinessEntity.credit_balance_cents += amount_cents"]

  # ---- ForeignQualification
  - method: POST
    path: "/business-registry/foreign-qualifications"
    description: "File for foreign qualification in another state"
    roles: [Filer]
    code: 201
    input: [business_entity_id, foreign_state, foreign_registered_agent_id, certificate_of_good_standing_date]
    output: ForeignQualification
    side_effects: []
  - method: PATCH
    path: "/business-registry/foreign-qualifications/{id}"
    description: "Resubmit a REJECTED foreign qualification (cyclic REJECTED → PENDING)"
    roles: [Filer]
    code: 200
    input: ["certificate_of_good_standing_date?", "foreign_registered_agent_id?", "version?"]
    output: ForeignQualification
    side_effects: []
  - method: POST
    path: "/business-registry/foreign-qualifications/{id}/approve"
    description: "PENDING → QUALIFIED"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: ["set qualified_at"]
  - method: POST
    path: "/business-registry/foreign-qualifications/{id}/reject"
    description: "PENDING → REJECTED"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: []
  - method: POST
    path: "/business-registry/foreign-qualifications/{id}/withdraw"
    description: "QUALIFIED → WITHDRAWN (voluntary)"
    roles: [Filer]
    code: 200
    input: []
    output: ForeignQualification
    side_effects: []

  # ---- BOIReport / BeneficialOwner / BOIOwnership
  - method: POST
    path: "/business-registry/boi-reports"
    description: "Create a BOI report in DRAFT (filing_type: INITIAL | UPDATE | CORRECTION)"
    roles: [Filer]
    code: 201
    input: [business_entity_id, filing_type]
    output: BOIReport
    side_effects: []
  - method: POST
    path: "/business-registry/boi-reports/{id}/file"
    description: "DRAFT → FILED → (auto) CURRENT; validates ownership sum and owner age"
    roles: [Filer]
    code: 200
    input: []
    output: BOIReport
    side_effects: ["set filed_at", "if filing_type IN {UPDATE, CORRECTION} and previous STALE report exists, mark it CORRECTED and finalize its penalty_cents"]
  - method: POST
    path: "/business-registry/beneficial-owners"
    description: "Create a BeneficialOwner record"
    roles: [Filer]
    code: 201
    input: [full_legal_name, date_of_birth, residential_address, identifying_document_type, identifying_document_number]
    output: BeneficialOwner
    side_effects: []
  - method: POST
    path: "/business-registry/entities/{id}/boi-ownership"
    description: "Add an active BOIOwnership row for a business entity; if a CURRENT BOIReport exists, schedules 30-day STALE timer"
    roles: [Filer]
    code: 201
    input: [beneficial_owner_id, ownership_percent_basis_points]
    output: BOIOwnership
    side_effects: ["set effective_at=clock.now()", "schedule STALE check at clock.now()+30 days"]
  - method: DELETE
    path: "/business-registry/entities/{id}/boi-ownership/{ownership_id}"
    description: "Terminate (soft-delete) a BOIOwnership row; schedules 30-day STALE timer if CURRENT BOIReport exists"
    roles: [Filer]
    code: 204
    input: []
    output: null
    side_effects: ["set terminated_at=clock.now()", "schedule STALE check"]

  # ---- ComplianceEvent (read-only audit)
  - method: GET
    path: "/business-registry/entities/{id}/compliance-events"
    description: "List ComplianceEvent rows for an entity ordered by occurred_at ASC; paginated"
    roles: [Filer, StateRegistrar, TaxOfficer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "event_type?"]
    output: "ComplianceEvent[]"
    side_effects: []

  # ---- Test-driving system endpoints (mandatory per §1.5 testability-completeness)
  - method: POST
    path: "/business-registry/_clock/advance"
    description: "Advance the server clock by a given duration; triggers sweep of OVERDUE/DELINQUENT tax, STALE BOI, missed AnnualReport, and ADMIN_DISSOLVED eligibility"
    roles: [TestHarness]
    code: 200
    input: [duration_iso8601]
    output: "object"      # {now, transitions_applied}
    side_effects: ["recompute derived_compliance_status for every entity", "advance FranchiseTaxAssessment status as appropriate", "transition BOIReport CURRENT→STALE when due", "transition QUALIFIED→REVOKED on cascade"]
  - method: POST
    path: "/business-registry/_sweep/run"
    description: "Manually trigger the daily compliance sweep without advancing the clock (idempotent)"
    roles: [TestHarness, ComplianceOfficer]
    code: 200
    input: []
    output: "object"
    side_effects: ["same as _clock/advance with duration=0"]

# =============================================================================
# §1.6 ERROR CATALOG
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "Required auth headers missing on any endpoint"
  - id: ERR_INVALID_ROLE
    http: 403
    condition: "X-User-Role is not one of the recognized roles"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint per §1.7"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID attempts two segregated operations (e.g., filed AND accepted same AnnualReport)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits this operation"
  - id: ERR_ENTITY_NOT_ACTIVE
    http: 409
    condition: "Parent BusinessEntity.formation_status != ACTIVE for a child-mutating endpoint"
  - id: ERR_HAS_DEPENDENCIES
    http: 409
    condition: "BusinessEntity cannot be voluntarily DISSOLVED because dependent obligations remain (open tax, STALE BOI, QUALIFIED foreign)"
  - id: ERR_DUPLICATE_LEGAL_NAME
    http: 409
    condition: "Another non-dissolved BusinessEntity already uses this legal_name (case-insensitive)"
  - id: ERR_DUPLICATE_ANNUAL_REPORT
    http: 409
    condition: "An AnnualReport for the same (business_entity_id, report_year) already exists with status IN {SUBMITTED, ACCEPTED}"
  - id: ERR_DUPLICATE_FOREIGN_QUALIFICATION
    http: 409
    condition: "A non-terminal ForeignQualification already exists for (business_entity_id, foreign_state)"
  - id: ERR_DUPLICATE_TAX_YEAR
    http: 409
    condition: "A FranchiseTaxAssessment for the same (business_entity_id, tax_year) already exists"
  - id: ERR_INVALID_AGENT_ADDRESS
    http: 422
    condition: "RegisteredAgent.physical_address matches the P.O. Box pattern"
  - id: ERR_OWNER_UNDERAGE
    http: 422
    condition: "A BeneficialOwner aged < 18 years at clock.now() is included on a BOIReport being filed"
  - id: ERR_STALE_COGS
    http: 422
    condition: "Certificate of Good Standing date is older than 60 days at approval time"
  - id: ERR_AGENT_STATE_MISMATCH
    http: 422
    condition: "ForeignQualification's foreign_registered_agent_id.service_state != foreign_state"
  - id: ERR_TEMPLATE_TYPE_MISMATCH
    http: 422
    condition: "OperatingAgreement.template_code is incompatible with BusinessEntity.entity_type"
  - id: ERR_OWNERSHIP_NOT_100
    http: 422
    condition: "Sum of active BOIOwnership.ownership_percent_basis_points != 10000 at the moment of /file"
  - id: ERR_FOREIGN_STATE_IS_HOME
    http: 422
    condition: "ForeignQualification.foreign_state equals BusinessEntity.home_state"
  - id: ERR_INVALID_TAX_METHOD
    http: 422
    condition: "calculation_method incompatible with BusinessEntity.entity_type (FLAT only for LLC/LP; AUTHORIZED_SHARES/ASSUMED_PAR_VALUE only for CORP)"
  - id: ERR_TAX_METHOD_MISMATCH
    http: 422
    condition: "Selected CORP tax method exceeds the alternative method's result by > 50%"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH"
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Body field fails type/format/range validation (e.g., authorized_shares < 1 for CORP, ssn_last4 not 4 digits, home_state regex)"

# =============================================================================
# §1.7 RBAC MATRIX
# =============================================================================
roles:
  - name: Filer
    description: "Person/agent acting on behalf of the business entity itself"
    identity: "entity_backed:BusinessEntity"
    exclusive_operations:
      - "POST /business-registry/entities"
      - "POST /business-registry/entities/{id}/dissolve"
      - "POST /business-registry/operating-agreements"
      - "POST /business-registry/ein-applications and /submit"
      - "POST /business-registry/annual-reports and /submit"
      - "PATCH /business-registry/annual-reports/{id}"
      - "POST /business-registry/tax-assessments/{id}/pay"
      - "POST /business-registry/foreign-qualifications and /withdraw"
      - "PATCH /business-registry/foreign-qualifications/{id}"
      - "POST /business-registry/boi-reports and /file"
      - "POST /business-registry/beneficial-owners"
      - "POST/DELETE /business-registry/entities/{id}/boi-ownership"
    shared_operations:
      - "GET /business-registry/entities/{id}"
      - "GET /business-registry/entities (list)"
      - "GET /business-registry/entities/{id}/exposure-summary"
      - "GET /business-registry/entities/{id}/compliance-events"

  - name: StateRegistrar
    description: "State registry official who forms entities and approves foreign qualifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /business-registry/entities/{id}/form"
      - "POST /business-registry/foreign-qualifications/{id}/approve"
      - "POST /business-registry/foreign-qualifications/{id}/reject"
    shared_operations:
      - "POST /business-registry/registered-agents"
      - "PATCH /business-registry/registered-agents/{id}"
      - "GET /business-registry/entities"
      - "GET /business-registry/entities/{id}"

  - name: TaxOfficer
    description: "State revenue official who assesses, accepts annual reports, approves EINs"
    identity: "opaque"
    exclusive_operations:
      - "POST /business-registry/tax-assessments"
      - "POST /business-registry/annual-reports/{id}/accept"
      - "POST /business-registry/annual-reports/{id}/reject"
      - "POST /business-registry/ein-applications/{id}/approve"
      - "POST /business-registry/ein-applications/{id}/reject"
    shared_operations:
      - "GET /business-registry/entities"
      - "GET /business-registry/entities/{id}"
      - "GET /business-registry/tax-assessments/{id}"

  - name: ComplianceOfficer
    description: "Compliance officer who reviews BOI, administratively dissolves entities, runs sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /business-registry/entities/{id}/administratively-dissolve"
      - "POST /business-registry/_sweep/run"
    shared_operations:
      - "GET /business-registry/entities/{id}/exposure-summary"
      - "GET /business-registry/entities/{id}/compliance-events"
      - "GET /business-registry/entities"

  - name: RegisteredAgentService
    description: "A registered-agent service company maintaining its own agent records"
    identity: "entity_backed:RegisteredAgent"
    exclusive_operations:
      - "POST /business-registry/registered-agents/{id}/resign"
    shared_operations:
      - "POST /business-registry/registered-agents"
      - "PATCH /business-registry/registered-agents/{id}"

  - name: TestHarness
    description: "Test-only role for time-driving endpoints; not exposed in production deployments"
    identity: "opaque"
    exclusive_operations:
      - "POST /business-registry/_clock/advance"
    shared_operations:
      - "POST /business-registry/_sweep/run"
