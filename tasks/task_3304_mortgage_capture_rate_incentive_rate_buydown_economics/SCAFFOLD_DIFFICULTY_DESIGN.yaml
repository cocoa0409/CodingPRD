        grounds:
          - state_machines.HomeSaleContract.APPROVED_to_CLOSED
          - state_machines.HomeSite.UNDER_CONTRACT_to_SOLD
          - state_machines.RateLock.ACTIVE_to_CONSUMED
          - state_machines.ForwardCommitment.OPEN_to_EXHAUSTED
