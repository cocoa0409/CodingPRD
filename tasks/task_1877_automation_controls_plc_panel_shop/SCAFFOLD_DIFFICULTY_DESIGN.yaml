# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1877: Automation Controls & PLC Panel Shop (UL 508A)
# 9 rules × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: warranty_liability_provisional_vs_final_late_claim
        grounds:
          - calculations.warranty_liability
          - state_machines.WarrantyClaim.FILED_to_TRIAGED
          - state_machines.WarrantyClaim.TRIAGED_to_ACCEPTED
        distinguishing_aspect: |
          Same WarrantyClaim inputs (20h REGIONAL, filed 226 days after commissioning
          under a 12-month warranty) produce provisional_liability_cents == 315000 at
          TRIAGED (no age decay, no deductible) but final_liability_cents == 160000 at
          ACCEPTED (labor halved to 145000 by the >half-term decay, parts 25000,
          deductible 10000 subtracted); entity domain is WarrantyClaim, distinct from
          the SubstitutionRequest domain of the sibling instance.
        test_recipe:
          setup:
            - "Commissioned job J for customer C (TIER_REGIONAL, 12-month warranty) with one panel commissioned at logical clock 2026-10-01T09:00:00Z"
            - "Logical clock then advanced to 2027-05-15T00:00:00Z (226 days later; months_in_service == 7, so 7*2=14 > 12 triggers final-variant labor halving)"
            - "BOM used a current-limiting branch protective device (sccr 100) so the panel clears the SCCR >= 5 review gate"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Acme Foods", site_state_code: "OR", warranty_labor_tier: "TIER_REGIONAL" }
              as: ProjectManager
              captures: { cust_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust_id}", job_number: "J-1001", quoted_price_cents: 1000000, warranty_months: 12 }
              as: ProjectManager
              captures: { job_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job_id}/panels"
              payload: { panel_tag: "MCC-01", enclosure_rating: "NEMA_12", design_engineer_id: "de-001" }
              as: DesignEngineer
              captures: { panel_id: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "BPD-CL100", component_class: "BRANCH_PROTECTIVE", unit_cost_cents: 50000, lead_time_days: 21, sccr_ka: 100, heat_dissipation_w: 15 }
              as: QAManager
              captures: { comp_bpd: "$.data.id" }
            - call: "POST /panel-shop/panels/${panel_id}/components"
              payload: { component_id: "${comp_bpd}", quantity: 1 }
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_id}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${panel_id}/approve-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-900"
            - call: "POST /panel-shop/panels/${panel_id}/release-procurement"
              payload: {}
              as: ProjectManager
            - call: "GET /panel-shop/panels/${panel_id}/components"
              payload: {}
              as: DesignEngineer
              captures: { line_id: "$.data[0].id" }
            - call: "POST /panel-shop/panel-components/${line_id}/receive"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${panel_id}/start-wiring"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${panel_id}/test-points"
              payload: { point_label: "TB1-1 to PLC-I0.0", expected_signal: "CONTINUITY", sequence_no: 1 }
              as: DesignEngineer
              captures: { tp_id: "$.data.id" }
            - call: "POST /panel-shop/panels/${panel_id}/begin-test"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${panel_id}/test-sessions"
