      - name: artifact_horizon_inherits_the_clamped_consent_window
        claim_type: Precision
        grounds:
          - calculations.retention_horizon
          - entities.ResearchArtifact.fields.retention_until
        distinguishing_aspect: "retention_days is clamped by the tightest scope on the consent record, and an artifact inherits that clamped instant rather than its own type cap: a RECORDING under a consent that also covers PII_QUOTE expires after 90 days, not 180."
