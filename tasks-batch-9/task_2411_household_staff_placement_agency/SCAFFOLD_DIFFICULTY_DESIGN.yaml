    mechanism: Reference intervals are closed month ranges. 2023-01..2023-12 and 2024-01..2024-04 have a zero-month
      gap, so they merge into one 16-month run rather than counting as two separate spans; a third row starting 2024-04
      would share a single month with the merged run and is refused.
