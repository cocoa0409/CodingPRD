# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3031_personal_sales_engineer_assignment_post_sale_support
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: engineer_create_returns_declared_defaults_and_tier_1
        claim_type: creation
        grounds:
          - entities.Engineer
          - entities.Engineer.fields.seniority_tier
          - calculations.engineer_seniority_tier
          - endpoints.POST_/engineers
        distinguishing_aspect: "An Engineer created with only full_name, email and region comes back 201 with status ACTIVE, seniority_tier TIER_1, commission_cap_bps 5000, active_book_size 0 and certified_family_count 0 — none of these are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_eng
              call: "POST /engineers"
              payload: { full_name: "Dana Riggs", email: "dana.riggs@sweetwater.example", region: "MIDWEST" }
              as: PlatformAdmin
              captures: { eng_a_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Engineer.${eng_a_id}.status == ACTIVE and region == MIDWEST"
            - "Engineer.${eng_a_id}.seniority_tier == TIER_1 and commission_cap_bps == 5000"
            - "Engineer.${eng_a_id}.active_book_size == 0 and certified_family_count == 0"
            - "Engineer.${eng_a_id}.version == 1 and neither created_at nor updated_at is null"

      - name: customer_create_defaults_to_standard_pending_and_no_entitlement
        claim_type: defaults
        grounds:
          - entities.Customer
          - entities.Customer.fields.account_tier
          - entities.Customer.fields.tech_support_entitlement
          - endpoints.POST_/customers
        distinguishing_aspect: "A Customer registered without account_tier defaults to STANDARD and starts PENDING with a null assigned_engineer_id, zero purchased_instrument_count, zero lifetime_gear_credit_cents and tech_support_entitlement NONE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - &c_cust
              call: "POST /customers"
              payload: { full_name: "Riley Chance", email: "riley.chance@example.com", home_state: "IN" }
              as: Anonymous
              captures: { cust_a_id: $.data.id, cust_a_v: $.data.version }
          assert:
            - "the response status is 201"
            - "Customer.${cust_a_id}.account_tier == STANDARD and status == PENDING"
            - "Customer.${cust_a_id}.assigned_engineer_id is null"
            - "Customer.${cust_a_id}.purchased_instrument_count == 0 and lifetime_gear_credit_cents == 0"
            - "Customer.${cust_a_id}.tech_support_entitlement == NONE"

      - name: quote_line_get_returns_resolved_price_and_family_fields
        claim_type: computed_fields
        grounds:
          - entities.QuoteLine
          - entities.QuoteLine.fields.product_family
          - entities.QuoteLine.fields.unit_price_cents
          - endpoints.GET_/quote-lines/{id}
        distinguishing_aspect: "A QuoteLine created from only a product_code and quantity exposes the server-resolved product_family, unit_price_cents, bundle_discount_bps and line_total_cents on a subsequent GET, so the client never supplies a price."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An assigned customer with a SYSTEM_PACKAGE quote and one guitar line."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - &c_asg
              call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { asg_a_id: $.data.id }
            - &c_accept
              call: "POST /assignments/${asg_a_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - &c_guitar
              call: "POST /products"
              payload: { product_code: "SW-GTR-100", display_name: "Studio Guitar 100", product_family: "GUITAR", unit_price_cents: 120000 }
              as: PlatformAdmin
            - &c_amp
              call: "POST /products"
              payload: { product_code: "SW-AMP-050", display_name: "Combo Amp 50", product_family: "AMPLIFIER", unit_price_cents: 90000, required_family: "GUITAR" }
              as: PlatformAdmin
            - &c_quote
              call: "POST /quotes"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", package_type: "SYSTEM_PACKAGE" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { quote_a_id: $.data.id, quote_a_v0: $.data.version }
            - &c_lgtr
              call: "POST /quotes/${quote_a_id}/lines"
              payload: { product_code: "SW-GTR-100", quantity: 1, is_anchor: true }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_gtr_id: $.data.id }
          trigger:
            - call: "GET /quote-lines/${qline_gtr_id}"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
          assert:
            - "the response status is 200"
            - "QuoteLine.${qline_gtr_id}.product_family == GUITAR and quantity == 1 and is_anchor == true"
            - "QuoteLine.${qline_gtr_id}.unit_price_cents == 120000 and bundle_discount_bps == 6667"
            - "QuoteLine.${qline_gtr_id}.line_total_cents == 39996 (round_half_up(120000 * 3333 / 10000) == 39996, times quantity 1)"
            - "QuoteLine.${qline_gtr_id}.quote_id == ${quote_a_id}"

      - name: quote_get_with_unknown_id_returns_quote_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/quotes/{id}
          - errors[ERR_QUOTE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_QUOTE_NOT_FOUND rather than a 400 or a generic not-found."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No quote has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /quotes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesEngineerOps
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "the response status is 404 and response_type is error"
            - "data.error_id == ERR_QUOTE_NOT_FOUND"
            - "no entity body is returned under data beyond error_id and message"

      - name: backorders_list_filters_by_engineer_and_reports_pagination
        claim_type: listing
        grounds:
          - endpoints.GET_/backorders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.Backorder.fields.engineer_id
        distinguishing_aspect: "With two backorders on one engineer's book and one on another's, the filtered list returns only that engineer's rows while total_count counts the filtered set, and pages split cleanly with has_more."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two engineers, a reserved quote with a guitar line and an amp line, three backorders across the two books."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - &c_lamp
              call: "POST /quotes/${quote_a_id}/lines"
              payload: { product_code: "SW-AMP-050", quantity: 1, requires_line_id: "${qline_gtr_id}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_amp_id: $.data.id }
            - &c_submit
              call: "POST /quotes/${quote_a_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - &c_reserve
              call: "POST /quotes/${quote_a_id}/reserve"
              payload: { expected_quote_version: "${quote_a_v0}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /engineers"
              payload: { full_name: "Priya Nair", email: "priya.nair@sweetwater.example", region: "EAST" }
              as: PlatformAdmin
              captures: { eng_b_id: $.data.id }
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_gtr_id}", engineer_id: "${eng_a_id}", units_requested: 2, preorder_open_at: "2026-09-01T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_one_id: $.data.id }
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_amp_id}", engineer_id: "${eng_a_id}", units_requested: 1, preorder_open_at: "2026-09-02T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_two_id: $.data.id }
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_amp_id}", engineer_id: "${eng_b_id}", units_requested: 1, preorder_open_at: "2026-09-03T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_three_id: $.data.id }
          trigger:
            - call: "GET /backorders"
              payload: { engineer_id: "${eng_a_id}", limit: 1, offset: 0 }
              as: SalesEngineerOps
            - call: "GET /backorders"
              payload: { engineer_id: "${eng_a_id}", limit: 1, offset: 1 }
              as: SalesEngineerOps
          assert:
            - "GET /backorders?engineer_id=${eng_a_id}&limit=1&offset=0 returns exactly 1 row with total_count == 2 and has_more == true"
            - "GET /backorders?engineer_id=${eng_a_id}&limit=1&offset=1 returns exactly 1 row with total_count == 2 and has_more == false"
            - "GET /backorders?engineer_id=${eng_b_id} returns exactly 1 row, the third backorder"
            - "GET /backorders with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"
            - "each returned row carries alloc_sequence and eta_deadline"

      - name: quote_create_missing_package_type_returns_missing_required_field
        claim_type: required_fields
        grounds:
          - endpoints.POST_/quotes
          - errors[ERR_MISSING_REQUIRED_FIELD]
          - validations[priority=1]
        distinguishing_aspect: "Omitting the required package_type on POST /quotes returns 400 ERR_MISSING_REQUIRED_FIELD and creates no Quote row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An assigned customer with an engineer whose book is active."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
          trigger:
            - call: "POST /quotes"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and data.error_id == ERR_MISSING_REQUIRED_FIELD"
            - "the message names package_type"
            - "GET /quotes?customer_id=${cust_a_id} returns 0 rows, so the rejected create left no residue"

      - name: warranty_plan_create_term_default_and_type_constraint
        claim_type: type_constraints
        grounds:
          - entities.WarrantyPlan.fields.term_months
          - endpoints.POST_/warranty-plans
          - errors[ERR_INVALID_FIELD_VALUE]
        distinguishing_aspect: "term_months defaults to 24 when omitted but is constrained to the closed set {12, 24, 36}, so a 18-month request returns ERR_INVALID_FIELD_VALUE rather than being coerced."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A shipped instrument with a reserved-quote origin."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - &c_unit
              call: "POST /instrument-units"
              payload: { quote_line_id: "${qline_gtr_id}", serial_number: "SN-GTR-5521", model_code: "SW-GTR-100" }
              as: SetupTechnician
              captures: { unit_a_id: $.data.id }
            - &c_setup
              call: "POST /instrument-units/${unit_a_id}/start-setup"
              payload: {}
              as: SetupTechnician
            - &c_csetup
              call: "POST /instrument-units/${unit_a_id}/complete-setup"
              payload: { action_height_mm: 1.50, relief_mm: 0.10, intonation_offset_cents: 2 }
              as: SetupTechnician
            - &c_inspect
              call: "POST /instrument-units/${unit_a_id}/record-inspection"
              payload: {}
              as: SetupTechnician
            - &c_ship
              call: "POST /instrument-units/${unit_a_id}/ship"
              payload: {}
              as: SetupTechnician
          trigger:
            - call: "POST /warranty-plans"
              payload: { customer_id: "${cust_a_id}", instrument_unit_id: "${unit_a_id}" }
              as: SalesEngineerOps
              captures: { plan_default_id: $.data.id }
            - call: "POST /warranty-plans"
              payload: { customer_id: "${cust_a_id}", instrument_unit_id: "${unit_a_id}", term_months: 18 }
              as: SalesEngineerOps
              captures: { err: $.data.error_id }
          assert:
            - "the first plan is created 201 with WarrantyPlan.${plan_default_id}.term_months == 24 and status PENDING"
            - "WarrantyPlan.${plan_default_id}.remaining_repair_rounds == 3 and repair_rounds_used == 0"
            - "the second request returns 400 with data.error_id == ERR_INVALID_FIELD_VALUE"
            - "exactly one WarrantyPlan row exists for InstrumentUnit.${unit_a_id}"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: assignment_starts_pending_and_second_accept_is_rejected
        claim_type: initial_state
        grounds:
          - entities.Assignment.fields.status
          - entities.Assignment.fields.assigned_at
          - state_machines.Assignment.PENDING_ACCEPT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A freshly created Assignment is PENDING_ACCEPT with a null assigned_at, and a second accept on the already-ACTIVE row is rejected with ERR_INVALID_STATE while the book count stays at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. One engineer and one customer with a PENDING_ACCEPT assignment."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
          trigger:
            - call: "POST /assignments/${asg_a_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { status_first: $.data.status, assigned_at_first: $.data.assigned_at }
            - call: "POST /assignments/${asg_a_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Assignment.${asg_a_id}.status == PENDING_ACCEPT and assigned_at is null before the first accept"
            - "the first accept returns status ACTIVE with assigned_at == 2026-09-02T00:00:00Z"
            - "the second accept returns 409 with data.error_id == ERR_INVALID_STATE"
            - "Engineer.${eng_a_id}.active_book_size == 1 after both calls, so the rejected accept did not double-count the book"

      - name: shipped_instrument_is_terminal_and_cannot_ship_again
        claim_type: terminal_state_lockdown
        grounds:
          - entities.InstrumentUnit.fields.setup_status
          - entities.InstrumentUnit.fields.shipped_at
          - state_machines.InstrumentUnit.INSPECTED_to_SHIPPED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "SHIPPED is a terminal state on InstrumentUnit, so any further action on the row is rejected with ERR_ALREADY_TERMINAL and no side effect re-fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. A reserved quote with one guitar line and one serialized unit already shipped."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - *c_unit
            - *c_setup
            - *c_csetup
            - *c_inspect
            - *c_ship
          trigger:
            - call: "POST /instrument-units/${unit_a_id}/ship"
              payload: {}
              as: SetupTechnician
              captures: { err: $.data.error_id }
          assert:
            - "the second ship returns 409 with data.error_id == ERR_ALREADY_TERMINAL"
            - "InstrumentUnit.${unit_a_id}.setup_status is still SHIPPED and shipped_at is unchanged at 2026-09-02T00:00:00Z"
            - "Customer.purchased_instrument_count for ${cust_a_id} is still 1, so the rejected call did not re-recompute the counter"

      - name: record_inspection_from_pending_setup_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.InstrumentUnit.SETUP_COMPLETE_to_INSPECTED
          - errors[ERR_INVALID_STATE]
          - validations[priority=5]
        distinguishing_aspect: "record-inspection is declared only from SETUP_COMPLETE, so invoking it on a PENDING_SETUP unit returns ERR_INVALID_STATE and leaves the row at its initial state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. A reserved quote with one guitar line and one registered unit still PENDING_SETUP."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - *c_unit
          trigger:
            - call: "POST /instrument-units/${unit_a_id}/record-inspection"
              payload: {}
              as: SetupTechnician
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "InstrumentUnit.${unit_a_id}.setup_status == PENDING_SETUP"
            - "InstrumentUnit.${unit_a_id}.modified_since_setup == false and inspection_overall == PASS (baseline untouched)"

      - name: quote_reject_clears_bundle_ready_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.Quote.SUBMITTED_to_REJECTED
          - entities.Quote.fields.bundle_ready
          - endpoints.POST_/quotes/{id}/reject
        distinguishing_aspect: "Rejecting a submitted quote applies the declared side effect: status moves to REJECTED and bundle_ready is recomputed to false even though the dependency graph still resolves."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. A submitted bundle-ready SYSTEM_PACKAGE quote."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_lamp
            - *c_submit
          trigger:
            - call: "POST /quotes/${quote_a_id}/reject"
              payload: {}
              as: SalesEngineerOps
              captures: { status_after: $.data.status, ready_after: $.data.bundle_ready }
          assert:
            - "Quote.${quote_a_id}.bundle_ready == true before the reject (the amp line's required family GUITAR is covered by the anchor)"
            - "Quote.${quote_a_id}.status == REJECTED after the reject"
            - "Quote.${quote_a_id}.bundle_ready == false after the reject"
            - "the quote's lines are untouched: GET /quotes/${quote_a_id}/lines still returns 2 rows"

      - name: escalation_requires_extended_entitlement_precondition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SupportTicket.IN_TRIAGE_to_ESCALATED
          - errors[ERR_ESCALATION_NOT_PERMITTED]
          - entities.SupportTicket.fields.required_entitlement
        distinguishing_aspect: "The IN_TRIAGE -> ESCALATED preconditions require required_entitlement EXTENDED, so a ticket whose customer holds no warranty plan cannot escalate and stays in triage."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. A customer with an ACTIVE assignment but no warranty plan, an open service center, and one triaged ticket."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - &c_center
              call: "POST /service-centers"
              payload: { name: "Indianapolis Bench", region: "MIDWEST", capacity_slots: 2, accepted_families: ["GUITAR", "AMPLIFIER"] }
              as: PlatformAdmin
              captures: { center_id: $.data.id }
            - call: "POST /support-tickets"
              payload: { customer_id: "${cust_a_id}", subject: "Amp hum at high gain", channel: "PHONE", service_center_id: "${center_id}" }
              as: SupportAgent
              captures: { ticket_id: $.data.id }
            - call: "POST /support-tickets/${ticket_id}/triage"
              payload: {}
              as: SupportAgent
              captures: { required_ent: $.data.required_entitlement }
          trigger:
            - call: "POST /support-tickets/${ticket_id}/escalate"
              payload: {}
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "SupportTicket.${ticket_id}.required_entitlement == BASIC after triage (no warranty plan in force)"
            - "the escalate call returns 422 with data.error_id == ERR_ESCALATION_NOT_PERMITTED"
            - "SupportTicket.${ticket_id}.status == IN_TRIAGE and escalated_at is null"
            - "ServiceCenter.${center_id}.open_ticket_count == 0 and GET /escalation-ledger?support_ticket_id=${ticket_id} returns 0 rows"

      - name: assignment_decline_after_active_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Assignment.PENDING_ACCEPT_to_ENDED
          - errors[ERR_INVALID_STATE]
          - entities.Assignment.fields.status
        distinguishing_aspect: "decline is declared only from PENDING_ACCEPT, so declining an already-ACTIVE assignment returns ERR_INVALID_STATE and the customer keeps its engineer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. One engineer holding an ACTIVE assignment for one customer."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
          trigger:
            - call: "POST /assignments/${asg_a_id}/decline"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "Assignment.${asg_a_id}.status is still ACTIVE"
            - "Customer.${cust_a_id}.assigned_engineer_id == ${eng_a_id} and Engineer.${eng_a_id}.active_book_size == 1"

      - name: end_then_reopen_book_restoration_compensates
        claim_type: compensation
        grounds:
          - state_machines.Assignment.ACTIVE_to_ENDED
          - state_machines.Assignment.ENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: assignment_cyclic_reopen_returns_ended_book_to_active
          rationale: "The end-then-reopen compensation and the restored active_book_size are asserted end-to-end by the named §1.8 instance."

      - name: ticket_escalation_through_service_desk_ledger
        claim_type: cross_entity
        grounds:
          - state_machines.SupportTicket.IN_TRIAGE_to_ESCALATED
          - entities.EscalationLedger
          - entities.ServiceCenter.fields.open_ticket_count
        excluded_because:
          difficulty_instance: assignment_end_escalates_tickets_to_service_desk
          rationale: "The escalation ledger append and the service center counter bump are asserted as hops 3 and 4 of the named §1.8 cascade instance."

  # ===========================================================================
  - section: calculations
    instances:

      - name: dependency_closure_excludes_unrelated_lines_from_anchor
        claim_type: input_set_filtering
        grounds:
          - calculations.quote_dependency_closure_size
          - entities.Quote.fields.dependency_closure_size
          - entities.Quote.fields.bundle_ready
        distinguishing_aspect: "With an anchor guitar line, an amp line depending on it, and a standalone accessory line depending on nothing, the anchored closure size is 2 rather than 3, so an unanchored line is quoted but excluded from the closure."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T00:00:00Z. A SYSTEM_PACKAGE quote with an anchor guitar line and a dependent amp line."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_amp
            - *c_quote
            - *c_lgtr
            - *c_lamp
            - call: "POST /products"
              payload: { product_code: "SW-ACC-010", display_name: "Woven Instrument Cable", product_family: "ACCESSORY", unit_price_cents: 1500 }
              as: PlatformAdmin
          trigger:
            - call: "POST /quotes/${quote_a_id}/lines"
              payload: { product_code: "SW-ACC-010", quantity: 2 }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { qline_acc_id: $.data.id }
            - call: "GET /quotes/${quote_a_id}/summary"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { closure_size: $.data.dependency_closure_size, bundle_ready_flag: $.data.bundle_ready }
          assert:
            - "the accessory line's requires_line_id is null and it is not an anchor, so Quote.${quote_a_id}.dependency_closure_size == 2"
            - "the closure contains exactly the guitar anchor and the amp line, excluding QuoteLine.${qline_acc_id}"
            - "Quote.${quote_a_id}.bundle_ready == true because the amp's required family GUITAR is covered inside the closure"
            - "GET /quote-lines?requires_line_id=${qline_gtr_id} returns exactly 1 row, the amp line"

      - name: commission_share_capped_by_engineer_cap_bps
        claim_type: constants_applied
        grounds:
          - calculations.engineer_commission_cents
          - entities.Assignment.fields.commission_share_bps
          - entities.Engineer.fields.commission_cap_bps
          - errors[ERR_COMMISSION_CAP_EXCEEDED]
        distinguishing_aspect: "An assignment requesting 6000 bps against a TIER_1 engineer whose cap is 5000 bps is accepted at the boundary only up to the cap: a 5000 bps request succeeds, a 5001 bps request is rejected, and a 5000 bps share computes the commission at 5000 bps rather than 6000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T00:00:00Z. One TIER_1 engineer capping at 5000 bps, one customer, a submitted SYSTEM_PACKAGE quote totalling 60000 cents."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", commission_share_bps: 6000, expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { err_cap: $.data.error_id }
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", commission_share_bps: 5001, expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { err_cap1: $.data.error_id }
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
          trigger:
            - call: "POST /quotes/${quote_a_id}/lines"
              payload: { product_code: "SW-GTR-100", quantity: 1 }
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /quotes/${quote_a_id}/submit"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "GET /assignments/${asg_a_id}"
              payload: {}
              as: SalesEngineerOps
              captures: { share_bps_effective: $.data.commission_share_bps }
          assert:
            - "the 6000 bps request returns 422 with data.error_id == ERR_COMMISSION_CAP_EXCEEDED"
            - "the 5001 bps request also returns 422 with data.error_id == ERR_COMMISSION_CAP_EXCEEDED"
            - "Assignment.${asg_a_id}.commission_share_bps == 5000 (default) and Engineer.${eng_a_id}.commission_cap_bps == 5000"
            - "Quote.${quote_a_id}.gross_subtotal_cents == 39996 and the provisional commission is 1600 (pool round_half_up(39996 * 800 / 10000) == 3200, then 3200 * 5000 / 10000 == 1600)"

      - name: seniority_tier_threshold_boundary_at_two_and_four
        claim_type: correct_result
        grounds:
          - calculations.engineer_seniority_tier
          - entities.Engineer.fields.seniority_tier
          - entities.Engineer.fields.certified_family_count
          - endpoints.POST_/certification-attempts/{id}/grade
        distinguishing_aspect: "The tier escalates at exactly 2 certified families and again at exactly 4, so a >= comparison admits the boundary value and the cap moves from 5000 to 6500 at count 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-04T00:00:00Z. One engineer with three graded certification attempts: two passing and one failing."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - call: "POST /certification-attempts"
              payload: { engineer_id: "${eng_a_id}", product_family: "GUITAR", score_pct: 85 }
              as: SalesEngineerOps
              captures: { cert_gtr_id: $.data.id }
            - call: "POST /certification-attempts/${cert_gtr_id}/grade"
              payload: {}
              as: SalesEngineerOps
            - call: "POST /certification-attempts"
              payload: { engineer_id: "${eng_a_id}", product_family: "AMPLIFIER", score_pct: 80 }
              as: SalesEngineerOps
              captures: { cert_amp_id: $.data.id }
            - call: "POST /certification-attempts/${cert_amp_id}/grade"
              payload: {}
              as: SalesEngineerOps
              captures: { tier_at_two: $.data.status }
            - call: "POST /certification-attempts"
              payload: { engineer_id: "${eng_a_id}", product_family: "MICROPHONE", score_pct: 79 }
              as: SalesEngineerOps
              captures: { cert_mic_id: $.data.id }
          trigger:
            - call: "GET /engineers/${eng_a_id}"
              payload: {}
              as: SalesEngineerOps
              captures: { tier_after_pass: $.data.seniority_tier, cap_after_pass: $.data.commission_cap_bps, certified_after_pass: $.data.certified_family_count }
            - call: "POST /certification-attempts/${cert_mic_id}/grade"
              payload: {}
              as: SalesEngineerOps
            - call: "GET /engineers/${eng_a_id}"
              payload: {}
              as: SalesEngineerOps
              captures: { tier_after_fail: $.data.seniority_tier, certified_after_fail: $.data.certified_family_count }
          assert:
            - "after two passing grades at scores 85 and 80, Engineer.${eng_a_id}.certified_family_count == 2 and seniority_tier == TIER_2 and commission_cap_bps == 6500"
            - "the boundary is inclusive: a second passing family at exactly the TIER_2_MIN of 2 promotes the tier"
            - "after grading the 79 score, Engineer.${eng_a_id}.certified_family_count is still 2 and seniority_tier remains TIER_2"
            - "CertificationAttempt.${cert_mic_id}.status == FAILED and certified == false while attempt_index == 1"

      - name: warranty_service_fee_dual_variant_on_close
        claim_type: variant_selection
        grounds:
          - calculations.warranty_service_fee_cents
          - state_machines.WarrantyPlan.REPAIR_IN_PROGRESS_to_ACTIVE
          - entities.WarrantyPlan.fields.remaining_repair_rounds
        distinguishing_aspect: "On a 36-month plan the routed claim stores the 2500-cent per-round provisional fee while the close stores the 3750-cent term-scaled final fee, so the two variants differ by exactly 1250 cents on identical plan data."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. A shipped instrument with an ACTIVE 36-month plan and an open service center."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_center
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - *c_unit
            - *c_setup
            - *c_csetup
            - *c_inspect
            - *c_ship
            - call: "POST /warranty-plans"
              payload: { customer_id: "${cust_a_id}", instrument_unit_id: "${unit_a_id}", term_months: 36 }
              as: SalesEngineerOps
              captures: { plan_long_id: $.data.id }
            - call: "POST /warranty-plans/${plan_long_id}/activate"
              payload: { starts_on: "2026-09-05T00:00:00Z" }
              as: SalesEngineerOps
              captures: { plan_long_expires: $.data.expires_on }
            - call: "POST /warranty-claims"
              payload: { warranty_plan_id: "${plan_long_id}", reported_fault: "Fret buzz on the low E", service_center_id: "${center_id}" }
              as: SupportAgent
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/route"
              payload: {}
              as: SupportAgent
            - call: "POST /warranty-claims/${claim_id}/close"
              payload: {}
              as: SupportAgent
              captures: { claim_status: $.data.status }
            - call: "GET /warranty-plans/${plan_long_id}"
              payload: {}
              as: SupportAgent
              captures: { plan_rounds: $.data.repair_rounds_used, plan_remaining: $.data.remaining_repair_rounds, plan_status_after: $.data.status }
          assert:
            - "WarrantyPlan.${plan_long_id}.expires_on == 2029-09-05T00:00:00Z"
            - "the routed claim's provisional service fee is 2500 cents (BASE_ROUND_FEE_CENTS * (0 + 1))"
            - "the closed claim's final service fee is 3750 cents (round_half_up(2500 * 36 / 24))"
            - "WarrantyClaim.${claim_id}.status == CLOSED and WarrantyPlan.${plan_long_id}.repair_rounds_used == 1 and remaining_repair_rounds == 2"
            - "WarrantyPlan.${plan_long_id}.status == ACTIVE again after the close"

      - name: inspection_verdict_conditional_when_only_relief_fails
        claim_type: variant_selection
        grounds:
          - calculations.instrument_inspection_verdict
          - entities.InstrumentUnit.fields.inspection_overall
          - endpoints.POST_/instrument-units/{id}/record-inspection
        distinguishing_aspect: "When two of three checks pass and intonation is one of the passers, both the preliminary and final variants return CONDITIONAL, so this corner pins the branch where the variants agree and the instrument may still ship under the priority-6 precondition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-06T00:00:00Z. A reserved quote with one guitar line and a serialized unit in IN_SETUP."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - *c_unit
            - *c_setup
          trigger:
            - call: "POST /instrument-units/${unit_a_id}/complete-setup"
              payload: { action_height_mm: 3.10, relief_mm: 0.20, intonation_offset_cents: 1 }
              as: SetupTechnician
              captures: { verdict_prelim: $.data.inspection_overall }
            - call: "POST /instrument-units/${unit_a_id}/record-inspection"
              payload: {}
              as: SetupTechnician
              captures: { verdict_final: $.data.inspection_overall }
            - call: "POST /instrument-units/${unit_a_id}/ship"
              payload: {}
              as: SetupTechnician
              captures: { ship_status: $.data.setup_status }
          assert:
            - "action height 3.10 mm fails its range check, so two of three checks pass"
            - "InstrumentUnit.${unit_a_id}.inspection_overall == CONDITIONAL after both complete-setup and record-inspection (intonation is one of the passing checks)"
            - "the CONDITIONAL verdict does not block shipment: setup_status == SHIPPED after the ship call"
            - "InstrumentUnit.${unit_a_id}.modified_since_setup == false at ship time"

      - name: backorder_final_allocation_conserves_pool_across_two_claims
        claim_type: correct_result
        grounds:
          - calculations.backorder_allocation_units
          - entities.Backorder.fields.units_filled
          - state_machines.Backorder.ALLOCATION_SWEEP_to_BOARD_FILLED
        distinguishing_aspect: "Two claims requesting 2 and 2 units against a pool of 3 receive 2 and 1 across the ordered sweep, so the final variant never over-allocates even though each preliminary estimate independently equals its full request."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-07T00:00:00Z. A reserved quote with one guitar line and two backorders opened at different instants."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_gtr_id}", engineer_id: "${eng_a_id}", units_requested: 2, preorder_open_at: "2026-09-07T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_early_id: $.data.id, bo_early_seq: $.data.alloc_sequence }
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_gtr_id}", engineer_id: "${eng_a_id}", units_requested: 2, preorder_open_at: "2026-09-08T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_late_id: $.data.id, bo_late_seq: $.data.alloc_sequence }
          trigger:
            - call: "POST /backorders/${bo_early_id}/start-sweep"
              payload: { pool_units: 3 }
              as: SalesEngineerOps
            - call: "POST /backorders/${bo_early_id}/finalize-allocation"
              payload: { pool_units: 3 }
              as: SalesEngineerOps
              captures: { early_filled: $.data.units_filled, early_status: $.data.status }
            - call: "POST /backorders/${bo_late_id}/start-sweep"
              payload: { pool_units: 3 }
              as: SalesEngineerOps
            - call: "POST /backorders/${bo_late_id}/finalize-allocation"
              payload: { pool_units: 3 }
              as: SalesEngineerOps
              captures: { late_filled: $.data.units_filled, late_status: $.data.status }
          assert:
            - "Backorder.${bo_early_id}.alloc_sequence < Backorder.${bo_late_id}.alloc_sequence, so the early claim walks the pool first"
            - "Backorder.${bo_early_id}.units_filled == 2 and status == BOARD_FILLED"
            - "Backorder.${bo_late_id}.units_filled == 1 and status == PARTIALLY_FILLED"
            - "units_filled summed across both claims == 3, exactly the pool, so the final variant conserves units while each preliminary estimate was 2"
            - "Backorder.${bo_early_id}.eta_deadline == 2026-10-07T00:00:00Z (preorder_open_at + 30 days)"

      - name: entitlement_requires_assignment_and_purchase_for_basic
        claim_type: correct_result
        grounds:
          - calculations.customer_tech_support_entitlement
          - entities.Customer.fields.tech_support_entitlement
          - entities.Customer.fields.purchased_instrument_count
        distinguishing_aspect: "An ACTIVE assignment alone leaves the entitlement NONE until at least one instrument has shipped, at which point it becomes BASIC, so the assignment-backed variant requires both facts rather than either one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-08T00:00:00Z. An assigned customer whose quote is reserved but whose instrument has not shipped."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - *c_unit
            - *c_setup
            - *c_csetup
            - *c_inspect
          trigger:
            - call: "GET /customers/${cust_a_id}"
              payload: {}
              as: SupportAgent
              captures: { ent_before_ship: $.data.tech_support_entitlement, purchases_before: $.data.purchased_instrument_count }
            - call: "POST /instrument-units/${unit_a_id}/ship"
              payload: {}
              as: SetupTechnician
            - call: "GET /customers/${cust_a_id}"
              payload: {}
              as: SupportAgent
              captures: { ent_after_ship: $.data.tech_support_entitlement, purchases_after: $.data.purchased_instrument_count }
          assert:
            - "Customer.${cust_a_id}.tech_support_entitlement == NONE while purchased_instrument_count == 0 despite the ACTIVE assignment"
            - "after shipping, purchased_instrument_count == 1 and tech_support_entitlement == BASIC"
            - "ending the assignment drops the entitlement back to NONE because no warranty plan is in force"
            - "GET /support-tickets for this customer still lists the row after the entitlement change"

  # ===========================================================================
  - section: validations
    instances:

      - name: unknown_service_center_on_claim_create_returns_referenced_resource_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
          - endpoints.POST_/warranty-claims
        distinguishing_aspect: "A body-referenced service_center_id that resolves to no ServiceCenter raises the existence error ERR_REFERENCED_RESOURCE_NOT_FOUND rather than a state or business error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T00:00:00Z. A shipped instrument with an ACTIVE plan and no service centers registered."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - *c_unit
            - *c_setup
            - *c_csetup
            - *c_inspect
            - *c_ship
            - call: "POST /warranty-plans"
              payload: { customer_id: "${cust_a_id}", instrument_unit_id: "${unit_a_id}" }
              as: SalesEngineerOps
              captures: { plan_id: $.data.id }
            - call: "POST /warranty-plans/${plan_id}/activate"
              payload: { starts_on: "2026-09-09T00:00:00Z" }
              as: SalesEngineerOps
          trigger:
            - call: "POST /warranty-claims"
              payload: { warranty_plan_id: "${plan_id}", reported_fault: "Output jack crackle", service_center_id: "00000000-0000-4000-8000-000000000000" }
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and data.error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"
            - "WarrantyPlan.${plan_id}.status is still ACTIVE, not CLAIM_OPEN"
            - "GET /warranty-claims?warranty_plan_id=${plan_id} returns 0 rows"

      - name: temporary_coverage_requires_effective_until_pairing
        claim_type: conditional_validation
        grounds:
          - errors[ERR_TEMPORARY_COVERAGE_UNTIL_REQUIRED]
          - entities.Assignment.fields.effective_until
          - endpoints.POST_/assignments
        distinguishing_aspect: "The effective_until requirement is conditional on reason_code: TEMPORARY_COVERAGE demands it while a permanent reason carrying one is rejected, so one endpoint enforces two polarities of the same conditional rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T00:00:00Z. One engineer and one customer with no assignment."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
          trigger:
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "TEMPORARY_COVERAGE", expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { err_missing_until: $.data.error_id }
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "NEW_ACCOUNT", effective_until: "2026-10-09T00:00:00Z", expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { err_unexpected_until: $.data.error_id }
            - call: "POST /assignments"
              payload: { customer_id: "${cust_a_id}", engineer_id: "${eng_a_id}", reason_code: "TEMPORARY_COVERAGE", effective_until: "2026-10-09T00:00:00Z", expected_customer_version: "${cust_a_v}" }
              as: SalesEngineerOps
              captures: { asg_temp_id: $.data.id }
          assert:
            - "TEMPORARY_COVERAGE with no effective_until returns 422 with data.error_id == ERR_TEMPORARY_COVERAGE_UNTIL_REQUIRED"
            - "NEW_ACCOUNT carrying effective_until returns 422 with data.error_id == ERR_TEMPORARY_COVERAGE_UNTIL_REQUIRED"
            - "TEMPORARY_COVERAGE with effective_until 2026-10-09T00:00:00Z returns 201 and Assignment.${asg_temp_id}.status == PENDING_ACCEPT"
            - "GET /assignments?customer_id=${cust_a_id} returns exactly 1 row, so both rejected calls left no residue"

      - name: zero_unit_backorder_is_rejected_before_any_sweep
        claim_type: aggregate_validation
        grounds:
          - validations[priority=14]
          - errors[ERR_ZERO_ALLOCATION_REQUEST]
          - entities.Backorder.fields.units_requested
        distinguishing_aspect: "units_requested == 0 defines an empty candidate set and is rejected at creation with ERR_ZERO_ALLOCATION_REQUEST rather than being admitted and later returning a zero allocation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T00:00:00Z. A reserved quote with one guitar line."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
          trigger:
