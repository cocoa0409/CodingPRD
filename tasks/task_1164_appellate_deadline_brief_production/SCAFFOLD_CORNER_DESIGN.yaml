  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_vacate_stale_case_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[schedule-vacate-stale-case]
        distinguishing_aspect: "Vacate with expected_case_version N-1 (stale) returns 412."
        test_recipe:
          setup: ["Case with version V known; brief created (bumps case.version via efile side effect in this scenario, but we test simpler: read V, mutate something else on case that bumps version, then vacate with stale V)"]
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
