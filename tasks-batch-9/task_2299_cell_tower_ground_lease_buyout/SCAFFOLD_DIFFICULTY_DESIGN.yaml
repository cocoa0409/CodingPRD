  - rule_id: boundary_precision_check
    instances:
      - name: discount_tier_boundary_score_60_versus_59
        grounds:
          - calculations.tenancy_quality_score
          - calculations.stream_valuation_value
          - entities.CarrierTenancy.fields.quality_points
          - entities.StreamValuation.fields.discount_rate_bps
        distinguishing_aspect: |
          The boundary is the >= 60 discount-tier cut in stream_valuation_value, probed one point on each
          side through the weighted score rather than through money: a score of exactly 60 selects the 850
          bps tier and values the stream at 52919246, while 59 selects the 1000 bps tier and values the
          identical rent stream at 44627011, an 8292235 cent step for a single quality point.
        test_recipe:
          setup:
            - "Two lease streams with identical economics: annual rent 3600000 cents, FIXED_PCT 300 bps, 180 remaining months."
            - "Stream S60 carries one ACTIVE INVESTMENT_GRADE ANCHOR (40) plus two ACTIVE SPECULATIVE ANCHOR tenancies (10 each), scoring exactly 60."
            - "Stream S59 carries one ACTIVE INVESTMENT_GRADE ANCHOR (40) plus one INVESTMENT_GRADE COLOCATION moved to HOLDOVER (40 x 0.60 = 24.00, less the 5 point holdover penalty = 19), scoring 59."
            - "No valuations exist yet on either stream."
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: false, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
