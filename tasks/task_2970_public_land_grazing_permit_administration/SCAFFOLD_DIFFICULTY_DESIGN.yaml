  - rule_id: resource_temporal_overlap
    instances:
      - name: pasture_half_open_interval_capacity_aggregate
        grounds:
          - validations.priority_29
          - calculations.use_record_aums
          - errors.ERR_PASTURE_CAPACITY_EXCEEDED
          - entities.Pasture.fields.pasture_aum_capacity
        distinguishing_aspect: |
          The contended resource is a PASTURE and the interval semantics are HALF-OPEN
          [planned_entry_date, planned_exit_date): only records whose half-open intervals
          genuinely intersect are aggregated against pasture_aum_capacity. A second record
          overlapping the first by 18 days pushes the intersecting sum to 206.67 + 103.33 =
          310.00 AUMs against a 300-AUM pasture and must be rejected, while a record that starts
          exactly on the first record's exit date (2026-05-02) does NOT intersect it and is
          accepted at 200.00 AUMs even though the pasture's yearly total then reaches 406.67 —
          capacity is a temporal constraint, never an annual sum.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and one pasture of exactly 300 AUM capacity, rotation requirement 1"
            - "A permittee with a 600-AUM LAND base property and an ISSUED 500-AUM permit"
            - "A DRAFT 2026 AOI for 500 authorized AUMs holding one use record: 200 head over 2026-04-01..2026-05-02 (31 days, planned_aums 206.67)"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Overlap Pasture Allotment", admin_unit_code: "NV-057", acres: 24000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a17_id: "$.data.id" }
            - call: "POST /allotments/${a17_id}/pastures"
              payload: { name: "Contended Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p21_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Overlap Cattle", contact_email: "overlap@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m21_id: "$.data.id" }
            - call: "POST /permittees/${m21_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T45N R72E Sec 18 SE", carrying_capacity_aums: 600, controlled_since_date: "2005-01-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp21_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a17_id}", permittee_id: "${m21_id}", base_property_id: "${bp21_id}", requested_aums: 500, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g20_id: "$.data.id" }
            - call: "POST /grazing-permits/${g20_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${g20_id}", grazing_year: 2026, authorized_aums: 500, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { aoi17_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi17_id}/use-records"
              payload: { pasture_id: "${p21_id}", planned_entry_date: "2026-04-01", planned_exit_date: "2026-05-02", planned_head_count: 200, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur17_id: "$.data.id" }
          trigger:
            - call: "POST /annual-operating-instructions/${aoi17_id}/use-records"
              payload: { pasture_id: "${p21_id}", planned_entry_date: "2026-04-15", planned_exit_date: "2026-05-16", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { rto1_error_id: "$.data.error_id" }
          assert:
            - "PastureUseRecord.${ur17_id}.planned_aums == 206.67"
            - "the trigger returns HTTP 422 with error_id ERR_PASTURE_CAPACITY_EXCEEDED (206.67 + 103.33 == 310.00 > 300)"
            - "no second PastureUseRecord was created: AnnualOperatingInstruction.${aoi17_id}.planned_aums_total == 206.67"
            - "control (touching, not intersecting): the same request with planned_entry_date 2026-05-02, planned_exit_date 2026-06-01 and planned_head_count 200 returns 201 with planned_aums 200.00, because [2026-05-02, 2026-06-01) does not intersect [2026-04-01, 2026-05-02)"
            - "after that control the pasture's yearly total is 406.67 AUMs on a 300-AUM pasture and this is CORRECT: AnnualOperatingInstruction.${aoi17_id}.planned_aums_total == 406.67"
            - "control (one day earlier is an intersection): planned_entry_date 2026-05-01, planned_exit_date 2026-05-31 with 200 head returns 422 ERR_PASTURE_CAPACITY_EXCEEDED"

      - name: closure_order_closed_interval_with_forward_buffer
        grounds:
          - validations.priority_26
          - domain_constants.CLOSURE_BUFFER_DAYS
          - errors.ERR_CLOSURE_ORDER_OVERLAP
          - calculations.emergency_reduction_reallocation
        distinguishing_aspect: |
          A different contended resource (the ALLOTMENT itself, held by ClosureOrders) under
          different interval semantics: the interval is CLOSED at BOTH ends and is extended by a
          one-sided forward buffer of CLOSURE_BUFFER_DAYS = 7. Against an ACTIVE order running
          2026-08-05..2026-08-31, a new order starting exactly on 2026-08-31 collides (closed
          ends touch, unlike the pasture rule where touching is fine), a new order starting
          2026-09-07 still collides because 2026-09-07 <= 2026-08-31 + 7 days, and only
          2026-09-08 is accepted. Reusing the pasture rule's half-open logic accepts the
          2026-08-31 order and fails.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and one pasture"
            - "An ACTIVE DROUGHT_REDUCTION order with reduction_pct 0.30 running 2026-08-05..2026-08-31, so the allotment is RESTRICTED with effective_capacity_aums 840"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Buffer Window Allotment", admin_unit_code: "NV-058", acres: 24000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a18_id: "$.data.id" }
            - call: "POST /allotments/${a18_id}/pastures"
              payload: { name: "Buffer Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p22_id: "$.data.id" }
            - call: "POST /closure-orders"
              payload: { allotment_id: "${a18_id}", order_type: "DROUGHT_REDUCTION", reduction_pct: 0.30, effective_start_date: "2026-08-05", effective_end_date: "2026-08-31", justification: "Thirty percent drought reduction for the late summer period." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { co18_id: "$.data.id" }
          trigger:
            - call: "POST /closure-orders"
              payload: { allotment_id: "${a18_id}", order_type: "DROUGHT_REDUCTION", reduction_pct: 0.20, effective_start_date: "2026-09-07", effective_end_date: "2026-10-31", justification: "Extended reduction while forage recovers." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { rto2_error_id: "$.data.error_id" }
          assert:
            - "ClosureOrder.${co18_id}.order_status == ACTIVE and Allotment.${a18_id}.effective_capacity_aums == 840"
            - "the trigger returns HTTP 409 with error_id ERR_CLOSURE_ORDER_OVERLAP (2026-09-07 <= 2026-08-31 + 7 days)"
            - "Allotment.${a18_id}.stocking_adjustment_pct is still 0.3000 — the rejected order ran no cascade"
            - "control at the closed-end touch: the same body with effective_start_date 2026-08-31 returns 409 ERR_CLOSURE_ORDER_OVERLAP"
            - "control inside the existing interval: effective_start_date 2026-08-20 returns 409 ERR_CLOSURE_ORDER_OVERLAP"
            - "control one day past the buffer: effective_start_date 2026-09-08, effective_end_date 2026-10-31 returns 201 with order_status ACTIVE"
            - "after that accepted order, Allotment.${a18_id}.stocking_adjustment_pct == 0.3000 and effective_capacity_aums == 840 — the strongest ACTIVE source (0.30) wins over the newer 0.20 and the two are never summed to 0.50"
            - "control after lifting the first order: POST /closure-orders/${co18_id}/lift then a new order starting 2026-08-31 returns 201, because a LIFTED order no longer blocks the window"

  - rule_id: compensating_invariant
    instances:
      - name: aum_conservation_on_aoi_issue_then_void
        grounds:
          - calculations.aum_conservation_invariant
          - calculations.aum_allocation_ledger
          - state_machines.AnnualOperatingInstruction.ISSUED_to_VOIDED
          - validations.priority_17
        distinguishing_aspect: |
          The conserved quantity is AUMS OF ALLOTMENT CAPACITY. Issuing the AOI is the forward
          action (allocated_aums 0 -> 300, open_aums 1200 -> 900) and POST
          /annual-operating-instructions/{aoiId}/void is the compensating action, which must
          return allocated_aums to exactly 0 and open_aums to exactly 1200 —
          open_aums + allocated_aums == effective_capacity_aums both before and after, with no
          residue of the 300 AUMs anywhere. The void also frees the (permit, grazing_year) slot,
          so a replacement AOI for 2026 can be created and issued and the ledger lands on the
          same figures again rather than double-counting.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs, one 300-AUM pasture and rotation requirement 1"
            - "A permittee with a 400-AUM LAND base property and an ISSUED 300-AUM permit"
            - "A DRAFT 2026 AOI for 300 authorized AUMs with one 103.33-AUM planned use record"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "AUM Conservation Allotment", admin_unit_code: "NV-059", acres: 24000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a19_id: "$.data.id" }
            - call: "POST /allotments/${a19_id}/pastures"
              payload: { name: "Conservation Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p23_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Ledger Test Ranch", contact_email: "ledger@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m22_id: "$.data.id" }
            - call: "POST /permittees/${m22_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T47N R74E Sec 26 NW", carrying_capacity_aums: 400, controlled_since_date: "2004-01-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp22_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a19_id}", permittee_id: "${m22_id}", base_property_id: "${bp22_id}", requested_aums: 300, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g21_id: "$.data.id" }
            - call: "POST /grazing-permits/${g21_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${g21_id}", grazing_year: 2026, authorized_aums: 300, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { aoi19_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi19_id}/use-records"
              payload: { pasture_id: "${p23_id}", planned_entry_date: "2026-04-01", planned_exit_date: "2026-05-02", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur19_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi19_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { aoi_id: "${aoi19_id}", bill_type: "PRELIMINARY_USE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bill19_id: "$.data.items[0].id" }
          trigger:
            - call: "POST /annual-operating-instructions/${aoi19_id}/void"
              payload: { void_reason: "Permittee withdrew the grazing application for the year." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "before the void: Allotment.${a19_id}.allocated_aums == 300, open_aums == 900, effective_capacity_aums == 1200"
            - "before the void: Permittee.${m22_id}.outstanding_balance_cents == 54100"
            - "AnnualOperatingInstruction.${aoi19_id}.aoi_status == VOIDED"
            - "Allotment.${a19_id}.allocated_aums == 0 (exactly the pre-issue value, no residue)"
            - "Allotment.${a19_id}.open_aums == 1200"
            - "Allotment.${a19_id}.open_aums + Allotment.${a19_id}.allocated_aums == Allotment.${a19_id}.effective_capacity_aums == 1200"
            - "GrazingBill.${bill19_id}.bill_status == VOIDED"
            - "Permittee.${m22_id}.outstanding_balance_cents == 0"
            - "GrazingPermit.${g21_id}.account_status == CURRENT and permit_status == ISSUED"
            - "control (slot freed, no double count): creating a replacement 2026 AOI for ${g21_id} with authorized_aums 300 returns 201 (not ERR_DUPLICATE_AOI_FOR_YEAR), and after adding one 103.33-AUM record and issuing it, allocated_aums == 300 and open_aums == 900 again"

      - name: cents_conservation_on_trespass_bill_void
        grounds:
          - calculations.money_conservation_invariant
          - calculations.unauthorized_use_charge
          - state_machines.TrespassIncident.BILLED_to_DETECTED
          - entities.Permittee.fields.billed_trespass_incident_count
        distinguishing_aspect: |
          A different conserved quantity — CENTS OF PERMITTEE DEBT — reversed through a different
          endpoint pair. Billing the trespass incident is the forward action (balance 0 -> 84240,
          billed_trespass_incident_count 0 -> 1, incident DETECTED -> BILLED) and POST
          /grazing-bills/{billId}/void is the compensation, which must restore the balance to
          exactly 0, walk the incident back to DETECTED and recompute
          billed_trespass_incident_count to 0 because the count is derived from incident_status
          IN {BILLED, RESOLVED}. Re-billing the same incident afterwards must reproduce 84240
          exactly — a repeat factor that crept to 1.25 or a balance of 168480 both prove the
          compensation leaked.
        test_recipe:
          setup:
            - "An allotment with 1200 permitted AUMs and one pasture"
            - "A permittee with no bills at all (outstanding_balance_cents 0, billed_trespass_incident_count 0)"
            - "A DETECTED trespass incident: 47 head of cattle for 11 unauthorized days, willfulness WILLFUL, so unauthorized_aums 17.23, billed_aums ceil(17.23) = 18 and prior_billed_incident_count 0"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Cents Conservation Allotment", admin_unit_code: "NV-080", acres: 24000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { a20_id: "$.data.id" }
            - call: "POST /allotments/${a20_id}/pastures"
              payload: { name: "Trespass Pasture", pasture_aum_capacity: 300, sequence_order: 1, rest_required: false }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { p24_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Willful Trespass Cattle", contact_email: "willful@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m23_id: "$.data.id" }
            - call: "POST /trespass-incidents"
              payload: { allotment_id: "${a20_id}", permittee_id: "${m23_id}", detected_at: "2026-07-15T14:30:00Z", head_count: 47, livestock_kind: "CATTLE", unauthorized_days: 11, willfulness: "WILLFUL" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ti20_id: "$.data.id" }
            - call: "POST /trespass-incidents/${ti20_id}/bill"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { trespass_incident_id: "${ti20_id}", bill_type: "UNAUTHORIZED_USE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { tbill20_id: "$.data.items[0].id" }
          trigger:
            - call: "POST /grazing-bills/${tbill20_id}/void"
              payload: { void_reason: "Incident report withdrawn: the livestock were later shown to be authorized." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "before the void: TrespassIncident.${ti20_id}.unauthorized_aums == 17.23 and billed_aums == 18"
            - "before the void: GrazingBill.${tbill20_id}.base_amount_cents == 42120, penalty_amount_cents == 42120, total_amount_cents == 84240"
            - "before the void: Permittee.${m23_id}.outstanding_balance_cents == 84240 and billed_trespass_incident_count == 1"
            - "GrazingBill.${tbill20_id}.bill_status == VOIDED"
            - "Permittee.${m23_id}.outstanding_balance_cents == 0 (exactly the pre-bill value, no residue)"
            - "Permittee.${m23_id}.billed_trespass_incident_count == 0 (recomputed from incident_status, which is no longer BILLED)"
            - "Permittee.${m23_id}.permittee_status == IN_GOOD_STANDING"
            - "TrespassIncident.${ti20_id}.incident_status == DETECTED"
            - "TrespassIncident.${ti20_id}.prior_billed_incident_count == 0 (the detection-time snapshot is immutable)"
            - "control (no drift on replay): POST /trespass-incidents/${ti20_id}/bill again issues a NEW UNAUTHORIZED_USE bill with total_amount_cents == 84240 (repeat_factor still 1.0) and Permittee.${m23_id}.outstanding_balance_cents == 84240, never 168480"
            - "control: the voided bill cannot be paid — POST /grazing-bills/${tbill20_id}/payments returns 409 ERR_BILL_STATE_INVALID"
