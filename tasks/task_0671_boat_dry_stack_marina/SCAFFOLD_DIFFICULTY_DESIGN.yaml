          - state_machines.LaunchRequest.REQUESTED_to_SCHEDULED
          - entities.Vessel.fields.location_status
        distinguishing_aspect: "Different entity pair LaunchRequest -> Vessel(.location_status): scheduling a launch for a vessel whose location_status is OFF_SITE (no active agreement, never racked) is rejected because LaunchRequest's REQUESTED->SCHEDULED precondition requires Vessel.location_status == RACKED."
        test_recipe:
          setup:
            - "A forklift exists; an OFF_SITE vessel with no storage agreement; a REQUESTED launch request for it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/forklifts"
              payload: { marina_id: "${marina_id}", label: "FL-1", max_lift_weight_lbs: 15000 }
              as: DockMaster
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Beached", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vessel_id}", requested_window_start: "2026-04-02T10:00:00Z" }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { launch_id: $.data.id }
          trigger:
            - call: "POST /marina/launch-requests/${launch_id}/schedule"
              payload: {}
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (precondition Vessel.location_status == RACKED not met)"
            - "LaunchRequest.${launch_id}.status == REQUESTED unchanged"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: forklift_slot_overlap_with_buffer
        grounds:
          - validations[priority=12]
          - entities.ForkliftSlot.fields.busy_until
          - state_machines.LaunchRequest.REQUESTED_to_SCHEDULED
        distinguishing_aspect: "Forklift resource, buffered interval semantics: a slot's busy interval is [window_start, window_start+service+buffer); a second launch at 10:44 (inside the 10:00-slot's busy_until of 10:45) is rejected with ERR_FORKLIFT_SLOT_CONFLICT — the buffer extends the occupied window beyond the 30-min service."
        test_recipe:
          setup:
            - "One forklift; a SCHEDULED launch for vessel A at window 10:00 (service 30 + buffer 15 => busy_until 10:45); a second racked vessel B requesting 10:44."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront", forklift_service_minutes: 30, forklift_buffer_minutes: 15 }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/forklifts"
              payload: { marina_id: "${marina_id}", label: "FL-1", max_lift_weight_lbs: 15000 }
              as: DockMaster
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rackA: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-2", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rackB: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "A", loa_ft: 24.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vA: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "B", loa_ft: 24.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vB: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vA}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { polA: $.data.id }
            - call: "POST /marina/insurance-policies/${polA}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vB}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { polB: $.data.id }
            - call: "POST /marina/insurance-policies/${polB}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vA}", rack_id: "${rackA}" }
              as: DockMaster
              captures: { agrA: $.data.id }
            - call: "GET /marina/racks/${rackA}"
              payload: {}
              as: DockMaster
              captures: { rvA: $.data.version }
            - call: "POST /marina/storage-agreements/${agrA}/activate"
              payload: { expected_rack_version: "${rvA}" }
              as: DockMaster
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vB}", rack_id: "${rackB}" }
              as: DockMaster
              captures: { agrB: $.data.id }
            - call: "GET /marina/racks/${rackB}"
              payload: {}
              as: DockMaster
              captures: { rvB: $.data.version }
            - call: "POST /marina/storage-agreements/${agrB}/activate"
              payload: { expected_rack_version: "${rvB}" }
              as: DockMaster
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vA}", requested_window_start: "2026-04-02T10:00:00Z" }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { launchA: $.data.id }
            - call: "POST /marina/launch-requests/${launchA}/schedule"
              payload: {}
              as: DockMaster
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vB}", requested_window_start: "2026-04-02T10:44:00Z" }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { launchB: $.data.id }
          trigger:
            - call: "POST /marina/launch-requests/${launchB}/schedule"
              payload: {}
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORKLIFT_SLOT_CONFLICT (10:44 falls inside the 10:00 slot's busy_until 10:45)"

      - name: rack_occupancy_overlap_half_open_no_buffer
        grounds:
          - validations[priority=13]
          - entities.StorageAgreement.fields.activated_at
          - entities.StorageAgreement.fields.terminated_at
          - state_machines.StorageAgreement.PENDING_COI_to_ACTIVE
        distinguishing_aspect: "Rack resource, UNbuffered half-open interval semantics (distinct from the forklift's buffered slot): rack occupancy [activated_at, terminated_at) admits adjacency (a new agreement activated at exactly the prior one's terminated_at succeeds) but rejects a true overlap with ERR_RACK_OCCUPANCY_CONFLICT — no buffer is added, unlike the forklift slot rule."
        test_recipe:
          setup:
            - "A rack occupied by agreement X (ACTIVE) at clock 2026-04-01; vessel Y fits the same rack and has VERIFIED COI; an attempt to activate a SECOND agreement onto the still-OCCUPIED rack."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "X", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vX: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Y", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vY: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vX}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { polX: $.data.id }
            - call: "POST /marina/insurance-policies/${polX}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vY}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { polY: $.data.id }
            - call: "POST /marina/insurance-policies/${polY}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vX}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agrX: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rv1: $.data.version }
            - call: "POST /marina/storage-agreements/${agrX}/activate"
              payload: { expected_rack_version: "${rv1}" }
              as: DockMaster
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vY}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agrY: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rv2: $.data.version }
          trigger:
            - call: "POST /marina/storage-agreements/${agrY}/activate"
              payload: { expected_rack_version: "${rv2}" }
              as: DockMaster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RACK_NOT_AVAILABLE or ERR_RACK_OCCUPANCY_CONFLICT (rack still OCCUPIED by agreement X)"
            - "StorageAgreement.${agrY}.status == PENDING_COI unchanged"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: launch_cancel_conserves_forklift_free_slot_count
        grounds:
          - state_machines.LaunchRequest.REQUESTED_to_SCHEDULED
          - state_machines.LaunchRequest.SCHEDULED_to_CANCELLED
          - entities.ForkliftSlot.fields.status
        distinguishing_aspect: "Conserved quantity = count of non-RELEASED ForkliftSlots on the forklift (forklift capacity availability). Schedule books one slot (+1 active); cancel releases it (-1 active); the count of non-RELEASED slots returns to its pre-schedule value of 0 with no drift."
        test_recipe:
          setup:
            - "A forklift with zero active slots; a RACKED vessel; a REQUESTED launch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/forklifts"
              payload: { marina_id: "${marina_id}", label: "FL-1", max_lift_weight_lbs: 15000 }
              as: DockMaster
              captures: { fl_id: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Cn", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vessel_id}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { policy_id: $.data.id }
            - call: "POST /marina/insurance-policies/${policy_id}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vessel_id}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agr_id: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rack_v: $.data.version }
            - call: "POST /marina/storage-agreements/${agr_id}/activate"
              payload: { expected_rack_version: "${rack_v}" }
              as: DockMaster
            - call: "POST /marina/launch-requests"
              payload: { vessel_id: "${vessel_id}", requested_window_start: "2026-04-02T10:00:00Z" }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { launch_id: $.data.id }
            - call: "POST /marina/launch-requests/${launch_id}/schedule"
              payload: {}
              as: DockMaster
              captures: { slot_id: $.data.forklift_slot_id }
          trigger:
            - call: "POST /marina/launch-requests/${launch_id}/cancel"
              payload: {}
              as: BoatOwner
              as_user_id: "${owner_id}"
          assert:
            - "GET /marina/forklift-slots?forklift_id=${fl_id}&status=BOOKED returns total_count == 0 after cancel (equal to the pre-schedule count)"
            - "ForkliftSlot.${slot_id}.status == RELEASED"

      - name: agreement_terminate_conserves_available_rack_count
        grounds:
          - state_machines.StorageAgreement.PENDING_COI_to_ACTIVE
          - state_machines.StorageAgreement.ACTIVE_to_TERMINATED
          - entities.Rack.fields.status
        distinguishing_aspect: "Different conserved quantity (count of AVAILABLE Racks in the marina, vs forklift slot availability in the other instance). Activate decrements it (rack -> OCCUPIED, count 1->0); terminate, the compensating action, restores it (rack -> AVAILABLE, count 0->1) with no drift."
        test_recipe:
          setup:
            - "A marina with exactly one rack; a VERIFIED-COI vessel; an ACTIVE agreement occupying that rack (AVAILABLE rack count = 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: DockMaster
            - call: "POST /marina/marinas"
              payload: { name: "Bayfront" }
              as: DockMaster
              captures: { marina_id: $.data.id }
            - call: "POST /marina/racks"
              payload: { marina_id: "${marina_id}", bay_label: "M-1", size_class: "MEDIUM", max_loa_ft: 30.00, max_beam_ft: 11.00, max_weight_lbs: 10000 }
              as: DockMaster
              captures: { rack_id: $.data.id }
            - call: "POST /marina/owners"
              payload: { marina_id: "${marina_id}", full_name: "Otto", email: "o@x.com" }
              as: DockMaster
              captures: { owner_id: $.data.id }
            - call: "POST /marina/vessels"
              payload: { marina_id: "${marina_id}", owner_id: "${owner_id}", name: "Tm", loa_ft: 25.00, beam_ft: 9.00, dry_weight_lbs: 5000 }
              as: BoatOwner
              as_user_id: "${owner_id}"
              captures: { vessel_id: $.data.id }
            - call: "POST /marina/insurance-policies"
              payload: { vessel_id: "${vessel_id}", carrier_name: "Acme", liability_limit_cents: 50000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { policy_id: $.data.id }
            - call: "POST /marina/insurance-policies/${policy_id}/verify"
              payload: {}
              as: BillingClerk
            - call: "POST /marina/storage-agreements"
              payload: { vessel_id: "${vessel_id}", rack_id: "${rack_id}" }
              as: DockMaster
              captures: { agr_id: $.data.id }
            - call: "GET /marina/racks/${rack_id}"
              payload: {}
              as: DockMaster
              captures: { rack_v: $.data.version }
            - call: "POST /marina/storage-agreements/${agr_id}/activate"
              payload: { expected_rack_version: "${rack_v}" }
              as: DockMaster
          trigger:
            - call: "POST /marina/storage-agreements/${agr_id}/terminate"
              payload: {}
              as: DockMaster
          assert:
            - "GET /marina/racks?marina_id=${marina_id}&status=AVAILABLE returns total_count == 1 after terminate (restored to the pre-activate count)"
            - "Rack.${rack_id}.status == AVAILABLE after terminate"
