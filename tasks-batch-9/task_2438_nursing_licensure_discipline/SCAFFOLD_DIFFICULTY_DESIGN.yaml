          - entities.EducationProgram.fields.approval_status
          - entities.LicenseApplication.fields.screening_status
        distinguishing_aspect: |
          The LicenseApplication is itself in a perfectly legal state (SUBMITTED) and its own
          fields are all valid; the operation is refused purely because a DIFFERENT entity, the
          referenced EducationProgram, has moved to approval_status WITHDRAWN after the
          application was filed. The same call succeeded before the PATCH, so nothing about the
          application changed — only the state of its neighbour.
