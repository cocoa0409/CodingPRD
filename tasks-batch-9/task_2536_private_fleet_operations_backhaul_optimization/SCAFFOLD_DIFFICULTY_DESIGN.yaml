              as: FleetPlanner
              captures: { dom_lax_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-A", mileage_cents_per_mile: 78, stop_cents_per_stop: 2200, drop_hook_cents: 1500, hourly_cents_per_minute: 42, minimum_daily_cents: 24000, backhaul_bonus_pct: 0.05 }
