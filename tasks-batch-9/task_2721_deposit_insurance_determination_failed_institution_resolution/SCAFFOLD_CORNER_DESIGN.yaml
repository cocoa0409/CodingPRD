        distinguishing_aspect: "The path-id lookup precedes every body check, and an unresolvable FK inside the body is reported with the referenced entity's own NOT_FOUND code rather than as ERR_INVALID_REQUEST — POST /deposit-accounts with a bogus institution_id yields ERR_INSTITUTION_NOT_FOUND while the same call with a bogus primary_depositor_id yields ERR_DEPOSITOR_NOT_FOUND."
