          - calculations.return_refund_settlement
          - state_machines.CreditGrant.PARTIALLY_REDEEMED_to_ISSUED
          - entities.CreditLedgerEntry.fields.balance_after_minor
          - entities.Customer.fields.credit_balance_minor
