              as: SaleAdministrator
              captures: { sale_id: $.data.id }
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "FLOOR" }
              as: SaleAdministrator
              captures: { paddle1_id: $.data.id }
          trigger:
            - call: "POST /paddle-registrations"
              payload: { auction_sale_id: "${sale_id}", bidder_id: "${bidder_id}", registration_type: "PHONE" }
              as: SaleAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_DUPLICATE (bidder already registered for this sale)"

