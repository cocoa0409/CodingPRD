          assert:
            - "begin_nav_per_share == 10.0000, end_nav_per_share == 10.1000, ${dps} == 0.0051"
            - "${pr} == 1.0051 and ${ex} == 0.0051 (round4 against benchmark 1.0)"

      - name: trial_balance_aggregates_final_records
        claim_type: correct_result
        grounds: [calculations.trial_balance_composition, "errors[ERR_NO_FINAL_NAV_IN_PERIOD]"]
        distinguishing_aspect: "Trial balance reads only FINAL records at/before as_of_date and errors when none exist in range."
        test_recipe:
          setup: ["Base kit; 2026-08-04 record FINAL (GAV 100000.00, accruals 0.27, TNA 99999.73)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
          trigger:
            - { call: "GET /funds/${fund_id}/trial-balance", payload: { as_of_date: "2026-08-04" }, as: FundController, captures: { tb_mv: "$.data.total_market_value", tb_accr: "$.data.total_accrued_expenses", tb_tna: "$.data.total_net_assets" } }
            - { call: "GET /funds/${fund_id}/trial-balance", payload: { as_of_date: "2026-08-03" }, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "as_of 2026-08-04: ${tb_mv} == 100000.00, ${tb_accr} == 0.27, ${tb_tna} == 99999.73"
            - "as_of 2026-08-03 (before any FINAL record): ${err} == ERR_NO_FINAL_NAV_IN_PERIOD (http 422)"

      - name: variant_provisional_vs_final
        claim_type: variant_divergence
        grounds: [calculations.security_price_selection]
        excluded_because:
          difficulty_instance: nav_provisional_vs_final_pricing_variant
          rationale: "Both variants' outputs are asserted there on identical data."
      - name: variant_day_count
        claim_type: variant_divergence
        grounds: [calculations.expense_accrual_daily]
        excluded_because:
          difficulty_instance: expense_accrual_day_count_divergence
          rationale: "ACT_365 vs ACT_360 divergence asserted there."
      - name: fee_tier_straddle
        claim_type: correct_result
        grounds: [calculations.adviser_fee_tiered]
        excluded_because:
          difficulty_instance: adviser_fee_tiered_marginal_straddle
          rationale: "Tier-straddling gross fee asserted with exact literals there."
      - name: distribution_rounding_order
        claim_type: precision
        grounds: [calculations.distribution_per_share]
        excluded_because:
          difficulty_instance: distribution_per_share_rounding_order
          rationale: "Pinned per-share-first rounding asserted there."
      - name: cap_ratio_exact_boundary
        claim_type: correct_result
        grounds: [calculations.expense_cap_test_and_waiver]
        excluded_because:
          difficulty_instance: expense_cap_exact_equality_no_waiver
          rationale: "The == cap non-breach boundary is asserted there; the > cap breach with waiver in expense_cap_circular_evaluation_order."
      - name: recoupment_waterfall_boundary
        claim_type: correct_result
        grounds: [calculations.recoupment_waterfall]
        excluded_because:
          difficulty_instance: recoup_window_last_day_inclusive
          rationale: "Inclusive expires_at boundary and draw-down are asserted there."

  # ------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: create_fund_missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without the X-User-Role/X-User-ID headers is rejected 401 before any other check (the trigger row's `as` is nominal; the generated test omits the auth headers)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (http 401)"

      - name: duplicate_fund_ticker_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_TICKER_ALREADY_EXISTS]"]
        distinguishing_aspect: "Fund ticker is globally unique: the second create with ALPHX fails 409."
        test_recipe:
          setup: ["Fund ALPHX exists"]
          setup_api_calls:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController }
          trigger:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund II", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_TICKER_ALREADY_EXISTS (http 409)"

      - name: price_future_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PRICE_DATE_FUTURE]"]
        distinguishing_aspect: "A price dated after the logical clock date (2026-08-05 vs clock 2026-08-04) is rejected; same-day prices are allowed."
        test_recipe:
          setup: ["Security exists; clock at 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
          trigger:
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-05", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { err: "$.data.error_id" } }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { ok_id: "$.data.id" } }
          assert:
            - "Future date: ${err} == ERR_PRICE_DATE_FUTURE (http 422)"
            - "Same-day date: created (${ok_id} present) — boundary is inclusive of the clock date"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "The logical clock is strictly monotonic: setting it backwards (or to the identical instant) fails."
        test_recipe:
          setup: ["Clock at 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CLOCK_REGRESSION (http 422)"

      - name: redemption_beyond_shares_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_REDEMPTION_EXCEEDS_SHARES]"]
        distinguishing_aspect: "Boundary on share count via capital-activity: redeeming 10001 of 10000 fails; redeeming exactly 10000 succeeds and leaves 0 shares."
        test_recipe:
          setup: ["Fund + class with 10000 shares"]
          setup_api_calls:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
          trigger:
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "REDEMPTION", activity_date: "2026-08-04", shares: 10001 }, as: FundAccountant, captures: { err: "$.data.error_id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "REDEMPTION", activity_date: "2026-08-04", shares: 10000 }, as: FundAccountant, captures: { shares_left: "$.data.shares_outstanding" } }
          assert:
            - "Redeem 10001: ${err} == ERR_REDEMPTION_EXCEEDS_SHARES (http 422)"
            - "Redeem exactly 10000: allowed, ${shares_left} == 0 (boundary is inclusive)"

      - name: duplicate_nav_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NAV_DATE_NOT_SEQUENTIAL]"]
        distinguishing_aspect: "NavRecord dates are strictly increasing per class: re-creating 2026-08-04 fails even though it is 'equal', not just 'earlier'."
        test_recipe:
          setup: ["Base kit with NavRecord 2026-08-04 ESTIMATED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1" }
          trigger:
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NAV_DATE_NOT_SEQUENTIAL (http 409)"

      - name: duplicate_price_source_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_PRICE_SOURCE]"]
        distinguishing_aspect: "At most one non-OVERRIDDEN observation per (security, date, source): the second EXCHANGE_CLOSE for the same date fails while a different source would pass."
        test_recipe:
          setup: ["Security with one SUBMITTED EXCHANGE_CLOSE observation on 2026-08-04"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
          trigger:
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.50, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { err: "$.data.error_id" } }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.50, source: "BROKER_QUOTE", pricing_level: "LEVEL_2" }, as: FundAccountant, captures: { ok_id: "$.data.id" } }
          assert:
            - "Same source: ${err} == ERR_DUPLICATE_PRICE_SOURCE (http 409)"
            - "Different source (BROKER_QUOTE): created (${ok_id} present)"

      - name: override_source_reserved_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_OVERRIDE_SOURCE_RESERVED]"]
        distinguishing_aspect: "FAIR_VALUE_COMMITTEE is a valid enum member (passes body validation at priority 4) but is reserved to the override endpoint (priority 9)."
        test_recipe:
          setup: ["Security exists; clock 2026-08-04"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
          trigger:
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "FAIR_VALUE_COMMITTEE", pricing_level: "LEVEL_3" }, as: FundAccountant, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_OVERRIDE_SOURCE_RESERVED (http 422)"

      - name: nav_create_missing_price_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_MISSING_PRICE]"]
        distinguishing_aspect: "Every OPEN position's security must have at least one observation (any status) on the accounting date; a bare security fails."
        test_recipe:
          setup: ["Fund, class with 10000 shares, position qty 1000, NO price observation on 2026-08-04"]
          setup_api_calls:
