        grounds:
          - validations[priority=16]
          - errors[ERR_CREW_SCHEDULE_CONFLICT]
          - entities.CrewAssignment.fields.start_hour
        distinguishing_aspect: |
          Half-open pairwise semantics on the Agent resource: [8,12) then [12,16) on the same agent-date are
