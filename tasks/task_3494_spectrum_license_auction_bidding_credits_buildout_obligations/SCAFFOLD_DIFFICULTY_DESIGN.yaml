          Depth-3 cascade triggered by the DISQUALIFY admin action (different trigger from the
          clock sweep): Applicant QUALIFIED -> DISQUALIFIED (hop 0->1) voids the applicant's
          SUBMITTED bids in the OPEN round (hop 1->2), and each voiding itself live-recomputes
