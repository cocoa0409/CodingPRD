# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1176 bicycle-theft-recovery. 9 rules x >=2 instances (19 total).
# Difficulty parameter honored: "harder than expert level" — every rule carries
# instances whose setup chains compose 8-17 calls across 4+ aggregates.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: match_score_screening_vs_forensic_divergence
        grounds:
          - calculations.match_score
          - entities.MatchCandidate.fields.screening_score
          - entities.MatchCandidate.fields.forensic_score
        distinguishing_aspect: |
          Dual-variant logic on the MatchCandidate entity domain (match scoring): identical
          intake/report inputs yield screening_score 8500 (photo ignored, serial-heavy) but
          forensic_score 6000 (photo_pts=0 weighted 0.30); status NOTIFIED is driven by the
          screening variant only. The sibling instance lives on the Auction domain, so the
          two dual-variant calculations operate on different entity domains.
        test_recipe:
          setup:
            - "Owner o1 with Bicycle b1 (serial ABC123, Trek/FX3, Black, declared 150000, photo_hash aaaaaaaabbbbcccc)"
            - "TheftReport r1 on b1 (occurred 2026-05-10), FLAGGED by Registrar; b1 registry_status STOLEN"
            - "ACTIVE LAW_ENFORCEMENT PartnerOrg org; RecoveryIntake i1 (serial ABC123, mfr Trek, color Blue, found 2026-05-15, appraised 80000, no photo_hash)"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "ABC123", manufacturer: "Trek", model: "FX3", primary_color: "Black", declared_value_cents: 150000, photo_url: "https://x/p.jpg", photo_hash: "aaaaaaaabbbbcccc" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-10T00:00:00Z", theft_location: "Downtown rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "ABC123", primary_color: "Blue", found_at: "2026-05-15T00:00:00Z", found_location: "Impound lot", appraised_value_cents: 80000, manufacturer: "Trek" }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/recovery-intakes/${i1_id}/scan", payload: {}, as: Partner, as_user_id: "${org_id}" }
            - { call: "GET /registry/matches?recovery_intake_id=${i1_id}", as: Registrar, captures: { m_screen: "$.data[0].screening_score", m_forensic: "$.data[0].forensic_score", m_status: "$.data[0].status" } }
          assert:
            - "MatchCandidate.screening_score == 8500 (observed ${m_screen})"
            - "MatchCandidate.forensic_score == 6000 (observed ${m_forensic})"
            - "MatchCandidate.status == NOTIFIED (observed ${m_status}) — driven by screening variant alone"
            - "8500 != 6000: identical inputs, two valid algorithms, different results"

      - name: auction_estimate_vs_final_settlement_late_close
        grounds:
          - calculations.auction_settlement_waterfall
          - calculations.storage_fee_accrual
          - entities.Auction.fields.estimated_partner_payout_cents
          - entities.Auction.fields.final_partner_payout_cents
        distinguishing_aspect: |
          Dual-variant logic on the Auction entity domain (settlement accounting): the estimate
          variant (reserve 20000 as gross, storage projected to scheduled ends_at day-40) yields
          estimated_partner_payout_cents 13275, while the final variant (actual winning bid 30000,
          actual close day-43) yields final_partner_payout_cents 21870 — different numbers for the
          same auction. Sibling instance lives on the MatchCandidate domain.
        test_recipe:
          setup:
            - "ACTIVE PartnerOrg org; RecoveryIntake i1 created at 2026-05-01T00:00:00Z, appraised 100000"
            - "i1 marked UNCLAIMED at 2026-06-01 (31 days elapsed >= 30)"
            - "Auction a1 created: starts 2026-06-05, ends 2026-06-10; reserve 20000; estimate fields stored"
            - "Owner o1 registered; auction OPENed at 2026-06-05; bid 30000 accepted"
            - "Clock advanced to 2026-06-13T00:00:00Z; auction closed 3 days late"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "ZZZ999", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { a1_ver: $.data.version } }
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 30000, expected_auction_version: "${a1_ver}" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/close", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/settle", payload: {}, as: Registrar }
            - { call: "GET /registry/auctions/${a1_id}", as: Registrar, captures: { est_payout: $.data.estimated_partner_payout_cents, fin_storage: $.data.final_storage_fee_cents, fin_comm: $.data.final_program_commission_cents, fin_payout: $.data.final_partner_payout_cents } }
          assert:
            - "Auction.estimated_partner_payout_cents == 13275 (observed ${est_payout})"
            - "Auction.final_storage_fee_cents == 5700 (observed ${fin_storage})"
            - "Auction.final_program_commission_cents == 2430 (observed ${fin_comm})"
            - "Auction.final_partner_payout_cents == 21870 (observed ${fin_payout})"
            - "13275 != 21870: estimate and final variants diverge on identical auction row"

  - rule_id: combinatorial_formula
    instances:
      - name: match_score_multi_input_conditional_weights
        grounds:
          - calculations.match_score
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — partial-serial Levenshtein branch
          (serial_pts 5/6), conditional photo branch (photo_pts 1.0 when both hashes present),
          temporal branch (full credit inside 30 days), and tiered weight selection across the
          two variants; screening 9167 vs forensic 9417 on the same inputs. Distinct mode from
          the rounding-order and evaluation-order instances.
        test_recipe:
          setup:
            - "Owner o1, Bicycle b1 serial ABC123 Trek/FX3 Black declared 150000 photo_hash 1111222233334444; TheftReport r1 occurred 2026-05-10 FLAGGED"
            - "ACTIVE PartnerOrg org; RecoveryIntake i1 serial_raw ABC12 (one char short), mfr Trek, color Black, photo_hash 1111222233334444, found 2026-05-20, appraised 50000"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "ABC123", manufacturer: "Trek", model: "FX3", primary_color: "Black", declared_value_cents: 150000, photo_url: "https://x/p.jpg", photo_hash: "1111222233334444" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-10T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "ABC12", primary_color: "Black", found_at: "2026-05-20T00:00:00Z", found_location: "Lot", appraised_value_cents: 50000, manufacturer: "Trek", photo_hash: "1111222233334444" }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/recovery-intakes/${i1_id}/scan", payload: {}, as: Partner, as_user_id: "${org_id}" }
            - { call: "GET /registry/matches?recovery_intake_id=${i1_id}", as: Registrar, captures: { m_screen: "$.data[0].screening_score", m_forensic: "$.data[0].forensic_score", m_status: "$.data[0].status" } }
          assert:
            - "serial_pts == 1 - 1/6 (ABC12 vs ABC123); screening_score == round_half_up(10000*(0.5*5/6 + 0.2 + 0.15 + 0.15)) == 9167 (observed ${m_screen})"
            - "forensic_score == round_half_up(10000*(0.35*5/6 + 0.30*1 + 0.15 + 0.10 + 0.10)) == 9417 (observed ${m_forensic})"
            - "MatchCandidate.status == NOTIFIED (observed ${m_status})"

      - name: registration_fee_per_component_rounding_order
        grounds:
          - calculations.registration_fee
          - entities.Bicycle.fields.registration_fee_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins per-component
          round_half_up THEN sum (base 1000, insurance round(0.08*12345)=988, engraving 1500,
          processing round(0.03*3488)=105 -> 3593); the forbidden sum-then-round order would
          give 3592. Distinct mode from the multi-input and evaluation-order instances.
        test_recipe:
          setup:
            - "Owner o1 registered; clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/bicycles", payload: { serial_number: "FEE123", manufacturer: "M", model: "Z", primary_color: "Green", declared_value_cents: 12345, photo_url: "https://x/f.jpg", engraving_opt_in: true, insurance_opt_in: true }, as: Owner, as_user_id: "${o1_id}", captures: { fee: $.data.registration_fee_cents } }
          assert:
            - "Bicycle.registration_fee_cents == 3593 (observed ${fee}) — 1000 + 988 + 1500 + 105, per-component rounding pinned"
            - "Sum-then-round would produce 3592; any implementation returning 3592 violates the pinned order"

      - name: auction_settlement_pinned_evaluation_order
        grounds:
          - calculations.auction_settlement_waterfall
          - calculations.storage_fee_accrual
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — storage cap
          references gross (0.30 * winning bid), commission base references storage
          (gross - storage), payout references both; evaluated storage -> commission -> payout
          yields 4950 / 4505 / 40545. Distinct mode from (a) and (b).
        test_recipe:
          setup:
            - "ACTIVE PartnerOrg org; RecoveryIntake i1 created 2026-05-01T00:00:00Z appraised 200000; UNCLAIMED at 2026-06-01"
            - "Auction a1 reserve 40000, starts 2026-06-05, ends 2026-06-08; Owner o1 bid 50000 accepted at open; closed exactly at ends_at 2026-06-08T00:00:00Z (closed day index 38)"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "ORD777", primary_color: "White", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 200000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-08T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { a1_ver: $.data.version } }
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 50000, expected_auction_version: "${a1_ver}" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/close", payload: {}, as: Registrar }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/settle", payload: {}, as: Registrar }
            - { call: "GET /registry/auctions/${a1_id}", as: Registrar, captures: { fin_storage: $.data.final_storage_fee_cents, fin_comm: $.data.final_program_commission_cents, fin_payout: $.data.final_partner_payout_cents } }
          assert:
            - "storage == min(floor(38-5)*150=4950, round(0.30*50000)=15000) == 4950 (observed ${fin_storage})"
            - "commission == round(0.10*min(45050,50000)) + round(0.15*max(0,45050-50000)) == 4505 (observed ${fin_comm})"
            - "payout == 50000 - 4950 - 4505 == 40545 (observed ${fin_payout}); 4950 + 4505 + 40545 == 50000 (waterfall conservation)"

  - rule_id: non_linear_state_machine
    instances:
      - name: theft_report_review_info_cycle
        grounds:
          - state_machines.TheftReport.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.TheftReport.NEEDS_INFO_to_UNDER_REVIEW
          - state_machines.TheftReport.UNDER_REVIEW_to_FLAGGED
        distinguishing_aspect: |
          Cyclic machine on TheftReport: the UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW loop is
          traversed TWICE before FLAGGED, proving the cycle is unbounded and non-linear; the
          sibling instance exercises parallel dimensions on Bicycle (a different entity).
        test_recipe:
          setup:
            - "Owner o1 with Bicycle b1; TheftReport r1 created (UNDER_REVIEW)"
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "CYC100", manufacturer: "Trek", model: "FX", primary_color: "Black", declared_value_cents: 90000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/theft-reports/${r1_id}/request-info", payload: { info_request_text: "need receipt" }, as: Registrar }
            - { call: "POST /registry/theft-reports/${r1_id}/respond", payload: { response_text: "receipt attached" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/theft-reports/${r1_id}/request-info", payload: { info_request_text: "need better photo" }, as: Registrar }
            - { call: "POST /registry/theft-reports/${r1_id}/respond", payload: { response_text: "photo attached" }, as: Owner, as_user_id: "${o1_id}" }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar, captures: { r_status: $.data.status, r_ver: $.data.version } }
          assert:
            - "TheftReport.status == FLAGGED after two full NEEDS_INFO loops (observed ${r_status})"
            - "TheftReport.version == 6 (observed ${r_ver}): create=1 + 5 transitions, one increment each"
            - "Bicycle.${b1_id}.registry_status == STOLEN after the flag cascade"

      - name: bicycle_parallel_dimensions_independent
        grounds:
          - state_machines.Bicycle.registry_status
          - state_machines.Bicycle.integrity_status
          - calculations.duplicate_confidence
        distinguishing_aspect: |
          Parallel state dimensions on Bicycle: registry_status (REGISTERED->STOLEN) and
          integrity_status (CLEAR->DUPLICATE_SUSPECT->CLEAR) evolve independently — the bike is
          STOLEN and DUPLICATE_SUSPECT held on one row, then dismissing the duplicate flag flips
          integrity back to CLEAR while registry_status stays STOLEN. Sibling instance is a
          cycle on TheftReport (different entity, different non-linear shape).
        test_recipe:
          setup:
            - "Owner o1 with Bicycle bA (serial DUP100, Trek/X, Black) and Bicycle bB (serial DUP101, Trek/X, Black) — bB creation auto-flags the pair (confidence 9000 >= 8500), both DUPLICATE_SUSPECT"
            - "TheftReport rA on bA, FLAGGED by Registrar -> bA registry_status STOLEN while integrity DUPLICATE_SUSPECT"
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "DUP100", manufacturer: "Trek", model: "X", primary_color: "Black", declared_value_cents: 100000, photo_url: "https://x/a.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "DUP101", manufacturer: "Trek", model: "X", primary_color: "Black", declared_value_cents: 90000, photo_url: "https://x/b.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { bb_id: $.data.id, bb_integ: $.data.integrity_status } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${ba_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { ra_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${ra_id}/flag", payload: {}, as: Registrar }
            - { call: "GET /registry/bicycles/${ba_id}", as: Registrar, captures: { ba_reg_pre: $.data.registry_status, ba_integ_pre: $.data.integrity_status } }
            - { call: "GET /registry/duplicate-flags?bicycle_a_id=${ba_id}", as: Registrar, captures: { df_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /registry/duplicate-flags/${df_id}/dismiss", payload: {}, as: Registrar }
            - { call: "GET /registry/bicycles/${ba_id}", as: Registrar, captures: { ba_reg_post: $.data.registry_status, ba_integ_post: $.data.integrity_status } }
          assert:
            - "bB auto-flagged at creation: integrity_status == DUPLICATE_SUSPECT (observed ${bb_integ}); confidence == round_half_up(10000*(0.6*(1-1/6)+0.25+0.15)) == 9000 >= 8500"
            - "Pre-dismiss: bA registry_status == STOLEN AND integrity_status == DUPLICATE_SUSPECT on the same read (observed ${ba_reg_pre} / ${ba_integ_pre})"
            - "Post-dismiss: bA integrity_status == CLEAR (observed ${ba_integ_post}) while registry_status stays STOLEN (observed ${ba_reg_post}) — dimensions independent"

  - rule_id: transitive_cascade
    instances:
      - name: flag_cascade_report_bicycle_transfer_notification
        grounds:
          - state_machines.TheftReport.UNDER_REVIEW_to_FLAGGED
          - state_machines.Bicycle.registry_status
          - state_machines.OwnershipTransfer.transitions
        distinguishing_aspect: |
          Depth-3 cascade originating from the report-flag trigger: flag -> Bicycle STOLEN ->
          pending OwnershipTransfer CANCELLED -> Notification(TRANSFER_CANCELLED_STOLEN) created
          for the buyer. Each link is caused by the previous link, not by the flag call directly.
          Sibling cascade originates from the claim-approve trigger (different trigger, different
          propagation pattern).
        test_recipe:
          setup:
            - "Owner o1 with Bicycle b1 (serial CSC100, declared 80000); Owner o2"
            - "OwnershipTransfer t1: o1 -> o2 on b1, PENDING_ACCEPTANCE"
            - "TheftReport r1 on b1, UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o2@x.com", password: "pw", full_name: "O Two" }, as: Anonymous, captures: { o2_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "CSC100", manufacturer: "Giant", model: "Escape", primary_color: "Red", declared_value_cents: 80000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/transfers", payload: { bicycle_id: "${b1_id}", to_owner_email: "o2@x.com", sale_price_cents: 50000 }, as: Owner, as_user_id: "${o1_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar, captures: { r_status: $.data.status } }
            - { call: "GET /registry/bicycles/${b1_id}", as: Registrar, captures: { b_reg: $.data.registry_status } }
            - { call: "GET /registry/transfers/${t1_id}", as: Registrar, captures: { t_status: $.data.status } }
            - { call: "GET /registry/notifications?owner_id=${o2_id}", as: Registrar, captures: { n_kind: "$.data[0].kind" } }
          assert:
            - "TheftReport.status == FLAGGED (observed ${r_status})"
            - "Bicycle.registry_status == STOLEN (observed ${b_reg}) — link 1"
            - "OwnershipTransfer.status == CANCELLED (observed ${t_status}) — link 2, caused by the bicycle flip"
            - "Notification to o2 kind == TRANSFER_CANCELLED_STOLEN (observed ${n_kind}) — link 3, caused by the transfer cancellation"

      - name: claim_approval_cascade_match_intake_bicycle_report
        grounds:
          - state_machines.OwnerClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.MatchCandidate.NOTIFIED_to_CONFIRMED
          - state_machines.RecoveryIntake.transitions
        distinguishing_aspect: |
          Depth-3 cascade originating from the claim-approve trigger: approve -> MatchCandidate
          CONFIRMED -> RecoveryIntake CLAIM_PENDING -> Bicycle RECOVERED + TheftReport
          CLOSED_RECOVERED (intake flip itself triggers the bike and report flips). Different
          triggering transition from the flag cascade instance.
        test_recipe:
          setup:
            - "Owner o1 with Bicycle b1 (serial CSC200, Giant/Defy, Red, declared 120000, photo_hash 1111222233334444)"
            - "TheftReport r1 occurred 2026-05-10, FLAGGED"
            - "ACTIVE PartnerOrg org; RecoveryIntake i1 (serial CSC200, mfr Giant, color Red, photo_hash 1111222233334444, found 2026-05-12, appraised 60000); scan produced a NOTIFIED match m1 (screening 10000)"
            - "OwnerClaim c1 by o1 referencing m1 (UNDER_REVIEW)"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "CSC200", manufacturer: "Giant", model: "Defy", primary_color: "Red", declared_value_cents: 120000, photo_url: "https://x/p.jpg", photo_hash: "1111222233334444" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-10T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /registry/theft-reports/${r1_id}/flag", payload: {}, as: Registrar }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "CSC200", primary_color: "Red", found_at: "2026-05-12T00:00:00Z", found_location: "Lot", appraised_value_cents: 60000, manufacturer: "Giant", photo_hash: "1111222233334444" }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/recovery-intakes/${i1_id}/scan", payload: {}, as: Partner, as_user_id: "${org_id}" }
            - { call: "GET /registry/matches?recovery_intake_id=${i1_id}", as: Registrar, captures: { m1_id: "$.data[0].id" } }
            - { call: "POST /registry/claims", payload: { recovery_intake_id: "${i1_id}", match_id: "${m1_id}", proof_text: "receipt + frame mark" }, as: Owner, as_user_id: "${o1_id}", captures: { c1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/claims/${c1_id}/approve", payload: {}, as: Registrar, captures: { c_status: $.data.status } }
            - { call: "GET /registry/matches/${m1_id}", as: Registrar, captures: { m_status: $.data.status } }
            - { call: "GET /registry/recovery-intakes/${i1_id}", as: Registrar, captures: { i_status: $.data.status } }
            - { call: "GET /registry/bicycles/${b1_id}", as: Registrar, captures: { b_reg: $.data.registry_status } }
            - { call: "GET /registry/theft-reports/${r1_id}", as: Registrar, captures: { r_status: $.data.status } }
          assert:
            - "OwnerClaim.status == APPROVED (observed ${c_status})"
            - "MatchCandidate.status == CONFIRMED (observed ${m_status}) — link 1"
            - "RecoveryIntake.status == CLAIM_PENDING (observed ${i_status}) — link 2, caused by the match confirmation"
            - "Bicycle.registry_status == RECOVERED (observed ${b_reg}) — link 3, caused by the intake flip"
            - "TheftReport.status == CLOSED_RECOVERED (observed ${r_status}) — link 3 sibling effect"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: duplicate_hold_beats_self_transfer
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_DUPLICATE_HOLD]
          - errors[ERR_SELF_TRANSFER]
        distinguishing_aspect: |
          Error-category pair business_safety (p11 ERR_DUPLICATE_HOLD) vs business_constraint
          (p12 ERR_SELF_TRANSFER): a transfer that violates BOTH rules in one request (self-transfer AND
          DUPLICATE_SUSPECT bicycle) must surface ERR_DUPLICATE_HOLD. Sibling instance exercises
          business_temporal vs business_fiscal — a different category pair.
        test_recipe:
          setup:
            - "Owner o1 with Bicycle bA (serial DUP100) and Bicycle bB (serial DUP101), same mfr/model/color — auto-flagged pair, both integrity_status DUPLICATE_SUSPECT"
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "DUP100", manufacturer: "Trek", model: "X", primary_color: "Black", declared_value_cents: 100000, photo_url: "https://x/a.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "DUP101", manufacturer: "Trek", model: "X", primary_color: "Black", declared_value_cents: 90000, photo_url: "https://x/b.jpg" }, as: Owner, as_user_id: "${o1_id}" }
          trigger:
            - { call: "POST /registry/transfers", payload: { bicycle_id: "${ba_id}", to_owner_email: "o1@x.com", sale_price_cents: 100 }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_HOLD (observed ${err}) — business_safety (p11) beats business_constraint (p12 ERR_SELF_TRANSFER) despite both being violated"

      - name: auction_window_expired_beats_bid_below_minimum
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - errors[ERR_AUCTION_WINDOW_EXPIRED]
          - errors[ERR_BID_BELOW_MINIMUM]
        distinguishing_aspect: |
          Error-category pair business_temporal (p14 ERR_AUCTION_WINDOW_EXPIRED) vs
          business_fiscal (p15 ERR_BID_BELOW_MINIMUM): a bid that violates BOTH rules in one request (past the
          auction window AND below the reserve) must surface ERR_AUCTION_WINDOW_EXPIRED.
          Different category pair from the safety-vs-constraint instance.
        test_recipe:
          setup:
            - "ACTIVE PartnerOrg org; RecoveryIntake i1 created 2026-05-01 appraised 100000; UNCLAIMED 2026-06-01"
            - "Auction a1 reserve 20000, starts 2026-06-05, ends 2026-06-10, OPENed at 2026-06-05"
            - "Owner o1; clock advanced to 2026-06-11T00:00:00Z (past ends_at; auction still OPEN because close is manual)"
          setup_api_calls:
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/partner-orgs", payload: { name: "City PD", org_type: "LAW_ENFORCEMENT", jurisdiction_code: "CPD-1", contact_email: "pd@x.gov" }, as: Admin, captures: { org_id: $.data.id } }
            - { call: "POST /registry/partner-orgs/${org_id}/activate", payload: {}, as: Admin }
            - { call: "POST /registry/recovery-intakes", payload: { serial_number_raw: "ZZZ888", primary_color: "Red", found_at: "2026-04-30T00:00:00Z", found_location: "Yard", appraised_value_cents: 100000 }, as: Partner, as_user_id: "${org_id}", captures: { i1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/recovery-intakes/${i1_id}/mark-unclaimed", payload: {}, as: Registrar }
            - { call: "POST /registry/auctions", payload: { recovery_intake_id: "${i1_id}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }, as: Registrar, captures: { a1_id: $.data.id } }
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: Admin }
            - { call: "POST /registry/auctions/${a1_id}/open", payload: {}, as: Registrar, captures: { a1_ver: $.data.version } }
            - { call: "POST /registry/_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /registry/auctions/${a1_id}/bids", payload: { amount_cents: 15000, expected_auction_version: "${a1_ver}" }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AUCTION_WINDOW_EXPIRED (observed ${err}) — business_temporal (p14) beats business_fiscal (p15 ERR_BID_BELOW_MINIMUM, 15000 < reserve 20000) despite both being violated"

