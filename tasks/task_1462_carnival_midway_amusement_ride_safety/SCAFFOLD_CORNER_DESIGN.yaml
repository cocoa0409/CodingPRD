            - { call: "POST /midway/operating-days/${day_id}/begin-checklists", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/daily-checklists", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}", items_total: 3 }, as: RideOperator, as_user_id: "${op_id}", captures: { chk_id: "$.data.id" } }
            - { call: "POST /midway/daily-checklists/${chk_id}/submit", payload: { items_passed: 3 }, as: RideOperator, as_user_id: "${op_id}", captures: { chk_v: "$.data.version" } }
            - { call: "POST /midway/daily-checklists/${chk_id}/countersign", payload: { expected_checklist_version: "${chk_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/operating-days/${day_id}/open-gates", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/ticket-products", payload: { fair_id: "${fair_id}", name: "Credits", kind: "CREDIT_BUNDLE", base_price_cents: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { prod_id: "$.data.id" } }
            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_id}", operating_day_id: "${day_id}", quantity: 1, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /midway/ride-cycles", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { cyc1: "$.data.id" } }
            - { call: "POST /midway/ride-cycles", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { err_busy: "$.data.error_id" } }
            - { call: "POST /midway/ride-cycles/${cyc1}/dispatch", payload: {}, as: RideOperator, as_user_id: "${op_id}", captures: { err_empty: "$.data.error_id" } }
            - { call: "POST /midway/ride-cycles/${cyc1}/load", payload: {}, as: RideOperator, as_user_id: "${op_id}" }
            - { call: "POST /midway/ticket-sales/${sale_id}/void", payload: {}, as: TicketClerk, as_user_id: "${clerk_id}", captures: { err_void: "$.data.error_id" } }
          assert:
            - "second cycle while first is LOADING -> err_busy == ERR_CYCLE_IN_PROGRESS with http 409"
            - "dispatch with rider_count 0 -> err_empty == ERR_CYCLE_EMPTY with http 422"
            - "after load boards the redemption, voiding the sale -> err_void == ERR_SALE_HAS_REDEMPTIONS with http 422"
            - "TicketSale.${sale_id}.status == ACTIVE and RideCycle.${cyc1}.status == LOADING (all rejections side-effect free)"

      - name: cross_fair_redemption_rejected
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_CROSS_FAIR_REFERENCE]'
          - 'validations[priority=13]'
        distinguishing_aspect: "A wristband sold on fair A's operating day cannot be redeemed at fair B's ride even when both fairs are fully OPEN on the same date — the referential fair-match check (priority 13) fires after all state and safety gates pass."
        test_recipe:
          setup: ["Fair A and fair B each fully permitted with a licensed THRILL ride OPEN on their own 2026-08-03 operating day; wristband sold on fair A's day"]
