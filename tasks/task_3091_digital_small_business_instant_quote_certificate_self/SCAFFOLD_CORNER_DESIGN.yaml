              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 422 with error_id ERR_CHANNEL_MISMATCH"

      - name: evidence_future_exif_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVIDENCE_FUTURE]", "validations[priority=6]"]
        distinguishing_aspect: "EXIF taken after the intake clock instant is rejected — photo evidence cannot postdate the claim report."
