# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3280_advertiser_account_policy_enforcement_auction_quality_scoring
# Breadth probe over §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Shared fixture chains are anchored once
# with YAML anchors and reused via aliases.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - &anchor_account_create_note
        name: account_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.AdvertiserAccount
          - endpoints.POST_/advertiser-accounts
        distinguishing_aspect: "A new account with only business_name and country_code returns 201 with status PENDING_VERIFICATION, version 1, null verified_business_name/disclosure_text/suspension_reason_code, zero lifetime counters, and a system-generated UUID id with created_at equal to the default logical clock 2026-09-01T00:00:00.000Z (no clock call made)."
        test_recipe:
          setup: ["Empty database; logical clock unset (default 2026-09-01T00:00:00Z)."]
          setup_api_calls: []
          trigger:
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Default Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, st: $.data.status, ver: $.data.version, ca: $.data.created_at, vb: $.data.verified_business_name, served: $.data.lifetime_valid_served_cents }
          assert:
            - "st == PENDING_VERIFICATION and ver == 1"
            - "ca == 2026-09-01T00:00:00.000Z (default logical clock, not wall clock)"
            - "vb is null"
            - "served == 0"
            - "acct is a server-minted UUID without type prefix"

      - name: campaign_create_applies_defaults_and_date_roundtrip
        claim_type: Defaults
        grounds:
          - entities.Campaign
          - endpoints.POST_/campaigns
        distinguishing_aspect: "Created campaign starts DRAFT with pause_origin NONE, eligible_ad_count 0, served_lifetime_cents 0, monthly_cap_provisional_cents = daily_budget*304//10 (1000 -> 30400), last_closed_month_* null."
        test_recipe:
          setup: ["Clock 2026-09-01. Fresh account."]
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &acct0
              call: "POST /advertiser-accounts"
              payload: { business_name: "Def Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CD", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id, st: $.data.status, po: $.data.pause_origin, cap: $.data.monthly_cap_provisional_cents, capfin: $.data.last_closed_month_cap_cents }
          assert:
            - "st == DRAFT and po == NONE"
            - "cap == 30400 (1000 * 304 // 10)"
            - "capfin is null"

      - name: get_campaign_returns_not_found_for_unknown_id
        claim_type: Not Found
        grounds:
          - endpoints.GET_/campaigns/{campaign_id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND wrapped in the error envelope with meta fields present."
        test_recipe:
          setup: ["Clock 2026-09-01. One account exists."]
          setup_api_calls:
            - *clock0
            - *acct0
          trigger:
            - call: "GET /campaigns/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: campaigns_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/campaigns
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three campaigns under one account: limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with three DRAFT campaigns."]
          setup_api_calls:
            - *clock0
            - *acct0
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "P1", daily_budget_cents: 100, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "P2", daily_budget_cents: 100, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "P3", daily_budget_cents: 100, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "GET /campaigns"
              payload: { account_id: "${acct}", limit: 2, offset: 0 }
              as: Advertiser
              as_user_id: "${acct}"
          assert:
            - "first page: 2 items, total_count == 3, has_more == true"
            - "second request with offset=2: 1 item, total_count == 3, has_more == false"

      - name: keyword_normalized_text_is_computed_input_ignored_for_snapshot
        claim_type: Computed Fields
        grounds:
          - entities.Keyword.fields.normalized_text
          - calculations.ad_rank_and_placement
        distinguishing_aspect: "Creating a keyword with text '  Shoes   MEN ' stores normalized_text 'shoes men' (lowercase, trimmed, collapsed whitespace); the raw text is preserved as entered."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with campaign and ad group."]
          setup_api_calls:
            - *clock0
            - *acct0
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CK", daily_budget_cents: 100, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "AG" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "  Shoes   MEN ", match_type: "EXACT", max_cpc_cents: 150 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { kw: $.data.id, raw: $.data.text, norm: $.data.normalized_text }
          assert:
            - "norm == 'shoes men'"
            - "raw == '  Shoes   MEN '"

      - name: keyword_invalid_match_type_enum_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.Keyword.fields.match_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "match_type 'FUZZY' is not in {EXACT, PHRASE, BROAD} and is rejected with ERR_VALIDATION before any business rule runs."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with campaign and ad group."]
          setup_api_calls:
            - *clock0
            - *acct0
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CK2", daily_budget_cents: 100, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "AG2" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "shoes", match_type: "FUZZY", max_cpc_cents: 100 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION with http 400"

      - name: billing_profile_one_per_account
        claim_type: Parent Relationships
        grounds:
          - entities.BillingProfile
          - errors[ERR_BILLING_PROFILE_EXISTS]
        distinguishing_aspect: "The second POST /advertiser-accounts/{id}/billing-profile for the same account returns 409 ERR_BILLING_PROFILE_EXISTS; GET .../billing-profile returns an array of length 1."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with one CARD billing profile."]
          setup_api_calls:
            - *clock0
            - *acct0
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "CARD" }
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "INVOICING" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "GET /advertiser-accounts/${acct}/billing-profile"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
          assert:
            - "err == ERR_BILLING_PROFILE_EXISTS"
            - "GET returns array of length 1 with payment_method_type CARD"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: campaign_pause_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Campaign
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST pause on a DRAFT campaign is not in the transition table (pause is ACTIVE->PAUSED only) and returns 409 ERR_INVALID_STATE with status unchanged."
        test_recipe:
          setup: ["Clock 2026-09-01. Verified ACTIVE account with a DRAFT campaign."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "SM Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "SM Corp LLC", registration_number: "RN-C1", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "DR", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp}/pause"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET shows status still DRAFT"

      - name: terminal_invoice_rejects_further_payment
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Invoice
          - errors[ERR_INVOICE_NOT_PAYABLE]
        distinguishing_aspect: "After a payment covering the full amount flips the invoice to PAID, any further payment returns ERR_INVOICE_NOT_PAYABLE (409) even for 1 cent."
        test_recipe:
          setup: ["Clock 2026-09-01. Verified ACTIVE account, campaign budget 100000, winner q1000 bid 5000 + runner q1000 bid 499 (charge 500); one clicked auction; month closed; invoice 500 fully paid."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Term Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/billing-profile"
              payload: { payment_method_type: "INVOICING" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { bp: $.data.id }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Term Corp LLC", registration_number: "RN-C2", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "CT", daily_budget_cents: 100000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "GW" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { gw: $.data.id }
            - call: "POST /campaigns/${camp}/ad-groups"
              payload: { name: "GR" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { gr: $.data.id }
            - call: "POST /ad-groups/${gw}/ads"
              payload: { headline: "T W", final_url: "https://t.example/w", category: "GENERAL", quality_ectr_score: 10, quality_relevance_score: 10, quality_lp_score: 10 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_w: $.data.id }
            - call: "POST /ad-groups/${gr}/ads"
              payload: { headline: "T R", final_url: "https://t.example/r", category: "GENERAL", quality_ectr_score: 10, quality_relevance_score: 10, quality_lp_score: 10 }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ad_r: $.data.id }
            - call: "POST /ad-groups/${gw}/keywords"
              payload: { text: "term", match_type: "EXACT", max_cpc_cents: 5000 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ad-groups/${gr}/keywords"
              payload: { text: "term", match_type: "EXACT", max_cpc_cents: 499 }
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_w}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /ads/${ad_r}/submit-review"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
            - call: "POST /auctions"
              payload: { query_text: "term", clicked: true }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /billing-profiles/${bp}/close-month"
              payload: { month: "2026-09" }
              as: BillingAdmin
              captures: { inv: $.data.invoice_id }
            - call: "POST /invoices/${inv}/payments"
              payload: { amount_cents: 500 }
              as: BillingAdmin
              captures: { pst: $.data.status }
          trigger:
            - call: "POST /invoices/${inv}/payments"
              payload: { amount_cents: 1 }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "pst == PAID"
            - "err == ERR_INVOICE_NOT_PAYABLE"

      - name: verification_decide_on_terminal_record_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.IdentityVerification
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second decide on an APPROVED verification (terminal) returns ERR_INVALID_STATE; the account is untouched."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with one APPROVED verification."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Dec Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Dec Corp LLC", registration_number: "RN-C3", document_type: "GOVERNMENT_ID", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "REJECTED", rejection_reason: "late doubt" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: disclosure_text_set_on_verification_approval
        claim_type: side_effect_execution
        grounds:
          - state_machines.AdvertiserAccount.PENDING_VERIFICATION_to_ACTIVE
          - entities.AdvertiserAccount.fields.disclosure_text
        distinguishing_aspect: "Approval side effects land on the account: status ACTIVE, verified_business_name from the verification's legal name, disclosure_text 'Ads by Cap Corp LLC'."
        test_recipe:
          setup: ["Clock 2026-09-01. Account with SUBMITTED verification legal name 'Cap Corp LLC'."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Cap", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Cap Corp LLC", registration_number: "RN-C4", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
          trigger:
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "GET /advertiser-accounts/${acct}"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status, vb: $.data.verified_business_name, dt: $.data.disclosure_text }
          assert:
            - "st == ACTIVE"
            - "vb == 'Cap Corp LLC'"
            - "dt == 'Ads by Cap Corp LLC'"

      - name: campaign_pause_activate_roundtrip_valid
        claim_type: valid_transition
        grounds:
          - state_machines.Campaign.ACTIVE_to_PAUSED
          - state_machines.Campaign.PAUSED_to_ACTIVE
        distinguishing_aspect: "ACTIVE -> PAUSED (pause_origin ADVERTISER) -> ACTIVE (pause_origin NONE) via advertiser endpoints round-trips cleanly when the account stays ACTIVE."
        test_recipe:
          setup: ["Clock 2026-09-01. Verified ACTIVE account with ACTIVE campaign."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "RT Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "RT Corp LLC", registration_number: "RN-C5", document_type: "TAX_CERTIFICATE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "RT", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { camp: $.data.id }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "POST /campaigns/${camp}/pause"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { st1: $.data.status, po1: $.data.pause_origin }
            - call: "POST /campaigns/${camp}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { st2: $.data.status, po2: $.data.pause_origin }
          assert:
            - "st1 == PAUSED and po1 == ADVERTISER"
            - "st2 == ACTIVE and po2 == NONE"

      - name: suspend_cascades_pause_to_active_campaigns_only
        claim_type: conditional_cascade
        grounds:
          - state_machines.AdvertiserAccount.ACTIVE_to_SUSPENDED
          - state_machines.Campaign.ACTIVE_to_PAUSED
        distinguishing_aspect: "Suspension flips only ACTIVE campaigns to PAUSED with pause_origin SUSPENSION; a DRAFT campaign of the same account is untouched."
        test_recipe:
          setup: ["Clock 2026-09-01. Verified ACTIVE account; campaign A1 ACTIVE; campaign A2 DRAFT."]
          setup_api_calls:
            - *clock0
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Casc Corp", country_code: "US" }
              as: Anonymous
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /advertiser-accounts/${acct}/identity-verifications"
              payload: { legal_business_name: "Casc Corp LLC", registration_number: "RN-C6", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${acct_v}" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { ver: $.data.id }
            - call: "POST /identity-verifications/${ver}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "A1", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", name: "A2", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { c2: $.data.id }
            - call: "POST /campaigns/${c1}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
          trigger:
            - call: "POST /advertiser-accounts/${acct}/suspend"
              payload: { reason_code: "BILLING_DELINQUENCY" }
              as: PlatformAdmin
            - call: "GET /campaigns/${c1}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { s1: $.data.status, p1: $.data.pause_origin }
            - call: "GET /campaigns/${c2}"
              payload: {}
              as: Advertiser
              as_user_id: "${acct}"
              captures: { s2: $.data.status, p2: $.data.pause_origin }
          assert:
            - "s1 == PAUSED and p1 == SUSPENSION"
            - "s2 == DRAFT and p2 == NONE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: billing_threshold_inclusive_crossing_and_ladder_escalation
        claim_type: boundary_edge
        grounds:
          - calculations.billing_threshold_charge
          - entities.BillingProfile.fields.billing_threshold_cents
        distinguishing_aspect: "unbilled reaching exactly the threshold (9 x 5000 = 45000 no invoice; 10th click = 50000 >= 50000 INCLUSIVE triggers) issues a THRESHOLD invoice for 50000; fully paying it escalates the ladder 50000 -> 150000."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Verified ACTIVE account; ACTIVE campaign budget 100000. Winner q1000 bid 10000, runner q1000 bid 4999 (charge 5000 per click), keyword 'ladder' EXACT. 9 clicks recorded."
          setup_api_calls:
