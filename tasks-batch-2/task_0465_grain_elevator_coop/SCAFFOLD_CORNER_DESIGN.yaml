# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index) — Expert band
# Grain Elevator & Marketing (Co-op) — breadth probe across the nine
# claim-extraction-guide sections. Every grounds[] ref resolves to SCAFFOLD.yaml
# §1.1–§1.7; setup chains drive empty-DB -> precondition using only §1.5
# endpoints. excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_commodity_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Commodity, endpoints.POST_/commodities]
        distinguishing_aspect: "POST /commodities with all required fields returns 201 and echoes symbol/test_weight/base_moisture plus a server-minted id and version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
          assert:
            - "Response status == 201"
            - "Commodity.${cid}.symbol == CORN, test_weight_lbs_per_bushel == 56, base_moisture_pct == 15.0"
            - "Commodity.${cid}.version == 1 and id is a UUID without a type prefix"

      - name: get_member_returns_stored_ledger_fields
        claim_type: Retrieval
        grounds: [entities.Member, "endpoints.GET_/commodities/members/{id}"]
        distinguishing_aspect: "GET /commodities/members/{id} returns the member with default ledger fields equity_credit_dollars=0, cash_paid_dollars=0, net_priced_bushels=0."
        test_recipe:
          setup: ["One member created, no settlements."]
          setup_api_calls:
            - call: "POST /commodities/members"
              payload: { name: "Pat Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
          trigger:
            - call: "GET /commodities/members/${mid}"
              payload: {}
              as: Merchandiser
          assert:
            - "Response status == 200"
            - "Member.${mid}.equity_credit_dollars == 0, cash_paid_dollars == 0, net_priced_bushels == 0"

      - name: list_price_boards_paginated_envelope
        claim_type: Listing
        grounds: [entities.PriceBoard, endpoints.GET_/commodities/price-boards]
        distinguishing_aspect: "GET /commodities/price-boards returns response_type array with pagination fields limit/offset/total_count/has_more present."
        test_recipe:
          setup: ["One commodity with two posted boards."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.50, cash_basis: -0.30 }
              as: Merchandiser
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
          trigger:
            - call: "GET /commodities/price-boards"
              payload: { commodity_id: "${cid}", limit: 10, offset: 0 }
              as: Merchandiser
          assert:
            - "Response status == 200 and response_type == array"
            - "meta pagination: total_count == 2, has_more == false, limit == 10, offset == 0"

      - name: get_commodity_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Commodity, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /commodities/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /commodities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: scale_ticket_missing_required_moisture_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.ScaleTicket, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /commodities/scale-tickets omitting required moisture_pct returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One commodity and one member."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Q Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 58000, tare_weight_lbs: 18000, deposit_account_type: "DELAYED_PRICE" }
              as: GradeClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: scale_ticket_dockage_default_zero_applied
        claim_type: Defaults
        grounds: [entities.ScaleTicket.fields.dockage_pct, endpoints.POST_/commodities/scale-tickets]
        distinguishing_aspect: "Omitting dockage_pct on POST /commodities/scale-tickets applies the default 0 so clean_weight equals net_weight after grade."
        test_recipe:
          setup: ["CORN commodity and a member."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "R Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE" }
              as: GradeClerk
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
          assert:
            - "ScaleTicket.${tk}.dockage_pct == 0 (default applied)"
            - "ScaleTicket.${tk}.clean_weight_lbs == 56000.0 (== net_weight_lbs, no dockage removed)"

      - name: price_board_cash_price_computed_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.PriceBoard.fields.cash_price, entities.PriceBoard.fields.is_current]
        distinguishing_aspect: "PriceBoard.cash_price is computed as futures_price + cash_basis (4.80 + -0.10 = 4.70); is_current is true for the latest board."
        test_recipe:
          setup: ["One commodity."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
              captures: { pb: $.data.id }
          assert:
            - "PriceBoard.${pb}.cash_price == 4.70"
            - "PriceBoard.${pb}.is_current == true"

      - name: scale_ticket_system_status_field_input_ignored
        claim_type: System Fields
        grounds: [entities.ScaleTicket.fields.status, endpoints.POST_/commodities/scale-tickets]
        distinguishing_aspect: "ScaleTicket.status is system-managed: a newly created ticket is WEIGHED regardless of any client-supplied status."
        test_recipe:
          setup: ["CORN commodity and a member."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "S Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 58000, tare_weight_lbs: 18000, moisture_pct: 18.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 1.5 }
              as: GradeClerk
              captures: { tk: $.data.id }
          assert:
            - "ScaleTicket.${tk}.status == WEIGHED (system-assigned)"
            - "ScaleTicket.${tk}.storage_position_id == null and net_dry_bushels is null/unset until graded"

      - name: scale_ticket_gross_not_greater_than_tare_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", entities.ScaleTicket.fields.gross_weight_lbs]
        distinguishing_aspect: "POST /commodities/scale-tickets with gross_weight_lbs <= tare_weight_lbs returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["CORN commodity and a member."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "T Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 18000, tare_weight_lbs: 18000, moisture_pct: 16.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: patronage_allocation_is_immutable_append_only
        claim_type: Immutability
        grounds: [entities.PatronageAllocation, entities.PatronageAllocation.common_fields]
        distinguishing_aspect: "PatronageAllocation has common_fields:false — it carries only id + created_at, no version/update endpoint; allocations are append-only records readable via the member/period allocations lists."
        test_recipe:
          setup: ["One member with net_priced_bushels 1000 via a SETTLED settlement; an OPEN patronage period closed."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "U Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { con: $.data.id }
            - call: "POST /commodities/contracts/${con}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${con}", storage_position_id: "${pos}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { st: $.data.id }
            - call: "GET /commodities/storage-positions/${pos}"
              payload: {}
              as: SettlementOfficer
              captures: { pv: $.data.version }
            - call: "POST /commodities/settlements/${st}/post"
              payload: { expected_storage_position_version: "${pv}" }
              as: SettlementOfficer
            - call: "POST /commodities/patronage-periods"
              payload: { label: "FY2026", pool_dollars: 50000, qualified_cash_pct: 0.20 }
              as: Merchandiser
              captures: { pp: $.data.id }
            - call: "POST /commodities/patronage-periods/${pp}/close"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "GET /commodities/members/${mid}/allocations"
              payload: {}
              as: Merchandiser
          assert:
            - "Response status == 200, response_type == array, total_count == 1"
            - "The allocation carries id and created_at but no version field (common_fields:false)"

      - name: fk_storage_position_member_reverse_reachable_via_filter
        claim_type: Parent Relationships
        grounds: [entities.StoragePosition.fields.member_id, endpoints.GET_/commodities/storage-positions]
        distinguishing_aspect: "The StoragePosition.member_id FK is reverse-reachable via GET /commodities/storage-positions?member_id=, returning the member's positions as an array."
        test_recipe:
          setup: ["One member with one graded position."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "V Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos: $.data.storage_position_id }
          trigger:
            - call: "GET /commodities/storage-positions"
              payload: { member_id: "${mid}" }
              as: Merchandiser
          assert:
            - "Response status == 200, response_type == array, total_count == 1"
            - "The returned position has member_id == ${mid} and id == ${pos}"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: grade_weighed_ticket_transitions_to_graded_and_creates_position
        claim_type: Valid Transition
        grounds: [state_machines.ScaleTicket.WEIGHED_to_GRADED, entities.StoragePosition]
        distinguishing_aspect: "POST grade on a WEIGHED ticket moves it to GRADED and creates a STORED StoragePosition referenced by storage_position_id."
        test_recipe:
          setup: ["CORN commodity, member, one WEIGHED clean ticket."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "W Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos: $.data.storage_position_id }
          assert:
            - "ScaleTicket.${tk}.status == GRADED and storage_position_id == ${pos}"
            - "StoragePosition.${pos}.status == STORED, program == DELAYED_PRICE, bushels == 1000.0000, bushels_available == 1000.0000"

      - name: grade_already_graded_ticket_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ScaleTicket.WEIGHED_to_GRADED, "validations[priority=5]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Grading a ticket that is already GRADED (not WEIGHED) is rejected with ERR_INVALID_STATE; no second position is created."
        test_recipe:
          setup: ["A ticket already GRADED."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "X Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
          trigger:
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: void_graded_ticket_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.ScaleTicket.WEIGHED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a GRADED ticket is rejected with ERR_INVALID_STATE because a position already exists (only WEIGHED tickets may be voided)."
        test_recipe:
          setup: ["A ticket already GRADED."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Y Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
          trigger:
            - call: "POST /commodities/scale-tickets/${tk}/void"
              payload: {}
              as: GradeClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: contract_starts_in_open_initial_state
        claim_type: Initial State
        grounds: [state_machines.Contract, entities.Contract.fields.status]
        distinguishing_aspect: "A newly created CASH contract starts in OPEN with futures_leg/basis_leg null until fixed."
        test_recipe:
          setup: ["CORN commodity and a member."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Z Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /commodities/contracts"
              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { con: $.data.id }
          assert:
            - "Response status == 201"
            - "Contract.${con}.status == OPEN, futures_leg == null, basis_leg == null, priced_bushels == 0"

      - name: cancel_settled_contract_from_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Contract, "errors[ERR_INVALID_STATE]", state_machines.Contract.OPEN_to_CANCELLED]
        distinguishing_aspect: "A Contract in terminal SETTLED state rejects cancel with ERR_INVALID_STATE (no transition from SETTLED is defined)."
        test_recipe:
          setup: ["A CASH contract for 1000 bushels fully SETTLED by a 1000-bushel settlement."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "AA Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { con: $.data.id }
            - call: "POST /commodities/contracts/${con}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${con}", storage_position_id: "${pos}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { st: $.data.id }
            - call: "GET /commodities/storage-positions/${pos}"
              payload: {}
              as: SettlementOfficer
              captures: { pv: $.data.version }
            - call: "POST /commodities/settlements/${st}/post"
              payload: { expected_storage_position_version: "${pv}" }
              as: SettlementOfficer
          trigger:
            - call: "POST /commodities/contracts/${con}/cancel"
              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
