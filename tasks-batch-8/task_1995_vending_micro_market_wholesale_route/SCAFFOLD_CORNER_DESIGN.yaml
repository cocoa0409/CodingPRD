            - { call: "POST /wholesale/locations", payload: { operator_id: "${op}", name: "L-AC", location_type: "OFFICE", route_id: "${rt}" }, as: WholesaleAdmin, captures: { loc: $.data.id, loc_v: $.data.version } }
            - { call: "POST /wholesale/planograms", payload: { location_id: "${loc}", name: "PG-AC", slots: [{ slot_code: "A1", product_id: "${pr}", par_level_units: 30, vend_price_cents: 180 }] }, as: OperatorManager, as_user_id: "${op}", captures: { pg: $.data.id } }
            - { call: "POST /wholesale/planograms/${pg}/activate", payload: { expected_location_version: "${loc_v}" }, as: OperatorManager, as_user_id: "${op}" }
