  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_submit_requires_finalized_evaluation
        grounds:
          - validations[priority=6]
          - state_machines.TreatmentPlan.DRAFT_to_SUBMITTED
          - errors[ERR_EVALUATION_NOT_FINALIZED]
          - entities.DiagnosticEvaluation.fields.status
        distinguishing_aspect: |
          Entity pair TreatmentPlan -> DiagnosticEvaluation: a plan's DRAFT->SUBMITTED
