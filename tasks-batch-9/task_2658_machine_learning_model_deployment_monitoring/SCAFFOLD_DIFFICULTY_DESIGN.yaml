          - calculations.retraining_urgency
          - state_machines.DriftReport.COMPUTED_to_BREACHED
          - state_machines.RetrainingTrigger
          - state_machines.Deployment_health_state.HEALTHY_to_CRITICAL
          - state_machines.Deployment_rollout_state.RAMPING_to_HELD
          - state_machines.PredictionIncident
          - validations.priority_32
        distinguishing_aspect: |
          TRIGGER 2 of 2 — a METRIC THRESHOLD crossing, not a governance action, and it fans out
          FIVE hops across five DIFFERENT entities (DriftReport -> RetrainingTrigger ->
          Deployment.health_state -> Deployment.rollout_state -> PredictionIncident). Unlike the
          revoke cascade, hop 4 and hop 5 fire only for CRITICAL severity, so the identical
          endpoint call with a WARN distribution stops after hop 3 — the depth itself is
          data-dependent.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default, moved to 2026-08-03T00:00:00Z before the window close"
            - "one APPROVED ModelVersion approved at 2026-08-01T00:00:00Z whose TrainingDataset baseline_bin_proportions is [0.20,0.20,0.20,0.20,0.20]"
            - "one REALTIME Deployment ramped twice: rollout_state RAMPING, traffic_pct 15.00, ramp_step_index 2, health_state HEALTHY, fallback_strategy PREVIOUS_CHAMPION"
            - "one CLOSED DISTRIBUTION MonitoringWindow with observed_bin_proportions [0.05,0.10,0.15,0.25,0.45] — heavily right-shifted"
            - "no SkewCheck exists for that deployment, so the trigger's skew component is exactly 0"
