      - name: accreditation_expiry_cascade_cancels_future_days
        grounds:
          - state_machines.AccreditationRecord.EXPIRING_SOON_to_EXPIRED
          - state_machines.SiteDayAssignment.transitions
          - calculations.accreditation_status_derivation
        distinguishing_aspect: |
          Depth-3 cascade from POST /api/_clock/set_current_utc: accreditation flips to EXPIRED
          (hop 1); the unit's future SCHEDULED day is force-cancelled with reason
          ACCREDITATION_EXPIRED (hop 2, caused by the accreditation flip); its REQUESTED
          appointment is cancelled DAY_CANCELLED and a zero-amount statement is created (hop 3,
