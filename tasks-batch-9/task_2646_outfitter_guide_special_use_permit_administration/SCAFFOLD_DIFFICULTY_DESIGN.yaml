  - rule_id: non_linear_state_machine
    instances:

      - name: permit_compliance_cycle_probation_and_back
        grounds:
          - state_machines.Permit.compliance_status
          - calculations.permit_compliance_derivation
          - calculations.noncompliance_point_accumulation
          - entities.Permit.fields.compliance_status
          - entities.NoncomplianceAction.fields.status
        distinguishing_aspect: |
          CYCLIC. The compliance dimension is re-entrant in both directions: COMPLIANT -> PROBATION
          -> COMPLIANT -> PROBATION -> NONCOMPLIANT -> PROBATION is a single continuous run on one
          permit, driven only by system re-derivations. No endpoint sets compliance_status, the
          entity has no terminal compliance state, and the downward hops are not the mirror image of
          the upward ones — NONCOMPLIANT -> PROBATION deliberately leaves administrative_status
          untouched, so the loop cannot be modelled as a monotone ladder.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01 with a PUBLISHED 2027 needs assessment"
            - "Outfitter Alpine holding one ISSUED permit with authorized_service_days 200, compliance_status COMPLIANT, no noncompliance actions"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Alpine 2027 float operation" }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MODERATE", action_type: "WARNING", cited_provision: "operating plan clause 4 - stock containment", cure_deadline_date: "2027-06-30" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /osup/noncompliance-actions/${a1_id}/cure"
              payload: { corrective_summary: "Highline relocated 200 feet from water" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MODERATE", action_type: "WARNING", cited_provision: "operating plan clause 7 - greywater", cure_deadline_date: "2027-06-30" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
              captures: { a2_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MODERATE", action_type: "WARNING", cited_provision: "operating plan clause 9 - campsite nights", cure_deadline_date: "2027-06-30" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
              captures: { a3_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MINOR", action_type: "WARNING", cited_provision: "operating plan clause 2 - signage", cure_deadline_date: "2027-06-30" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
              captures: { a4_id: "$.data.id" }
          trigger:
            - call: "POST /osup/noncompliance-actions/${a4_id}/cure"
              payload: { corrective_summary: "Trailhead signage installed" }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
              captures: { cured_status: "$.data.status" }
          assert:
            - "after ${a1_id} was issued, Permit.${p_id}.open_noncompliance_points == 5 and compliance_status == PROBATION (first COMPLIANT -> PROBATION hop)"
            - "after ${a1_id} was cured, open_noncompliance_points == 0 and compliance_status == COMPLIANT (PROBATION -> COMPLIANT hop, closing the first loop)"
            - "after ${a2_id} and ${a3_id}, open_noncompliance_points == 10 and compliance_status == PROBATION (the state was re-entered from COMPLIANT a second time)"
            - "after ${a4_id}, open_noncompliance_points == 12 and compliance_status == NONCOMPLIANT (PROBATION -> NONCOMPLIANT at the >= 12 threshold)"
            - "${cured_status} == CURED and NoncomplianceAction.${a4_id} is terminal"
            - "after the trigger, Permit.${p_id}.open_noncompliance_points == 10 and compliance_status == PROBATION — NONCOMPLIANT -> PROBATION, so the machine descends the same edge it climbed"
            - "Permit.${p_id}.administrative_status == ISSUED for the entire run: the permit was never ACTIVE, so the NONCOMPLIANT cascade had nothing to suspend, and the PROBATION descent never touches the administrative dimension"
            - "NoncomplianceAction.${a2_id}.status == ISSUED and NoncomplianceAction.${a3_id}.status == ISSUED — only the cured rows stopped contributing points"

      - name: operating_plan_revision_loop_bounded_at_two
        grounds:
          - state_machines.OperatingPlan
          - state_machines.OperatingPlan.UNDER_REVIEW_to_REVISION_REQUESTED
          - entities.OperatingPlan.fields.revision_round
          - entities.OperatingPlan.fields.deficiency_sections
          - entities.OperatingPlan.fields.reviewed_by_user_id
          - errors.ERR_REVISION_LIMIT_EXCEEDED
        distinguishing_aspect: |
          CYCLIC WITH A BOUNDED LOOP COUNTER. SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED ->
          SUBMITTED is a genuine cycle, but revision_round accumulates across laps and is never
          reset by the return hop, so the third request-revision from an otherwise legal
          UNDER_REVIEW state is refused. The loop also mutates custody on the way round:
          reviewed_by_user_id is cleared on the REVISION_REQUESTED -> SUBMITTED hop, which forces a
          different reviewer each lap and keeps the segregation-of-duties check meaningful.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01 with a PUBLISHED 2027 needs assessment"
            - "Outfitter Alpine holding one ISSUED permit for term_start_date 2027-01-01"
            - "an OperatingPlan for plan_year 2027 with all four sections complete, so completeness_score is 100.0"
            - "the plan has already gone twice round the revision loop and is UNDER_REVIEW with revision_round 2, reviewed_by_user_id reviewer-3"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
