  - section: cross_cutting_layers
    instances:
      - name: occ_stale_design_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[design-create-supersede-item]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Item.version observed at 1; first design create advances it to 2; a second create replaying expected_item_version 1 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["customer + job + item; one design already created (item version now 2)"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "OCC Co", site_code: "OCC-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Block", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 1000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design1_id: $.data.id } }
          trigger:
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION; http 412"
            - "design1 remains DRAFT (no supersede happened)"
      - name: occ_stale_job_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[job-patch-stale-terms]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the pre-mutation version: first PATCH (incoterm DDP) bumps job to version 2; replaying expected_packing_job_version 1 -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["QUOTED job; job_v captured at creation (1); one successful PATCH applied"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "OCC Job Co", site_code: "OCJ-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id, job_v: $.data.version } }
            - { call: "PATCH /crating/packing-jobs/${job_id}", payload: { expected_packing_job_version: "${job_v}", incoterm: DDP }, as: SalesRep, captures: { job_v2: $.data.version } }
          trigger:
            - { call: "PATCH /crating/packing-jobs/${job_id}", payload: { expected_packing_job_version: "${job_v}", incoterm: EXW }, as: SalesRep, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_STALE_VERSION; http 412; job incoterm remains DDP"]
      - name: job_version_increments_on_patch
        claim_type: optimistic_concurrency
        grounds: [entities.PackingJob.fields.version, "concurrency_rules[job-patch-stale-terms]"]
        distinguishing_aspect: "A successful PATCH increments version exactly by 1 (1 -> 2) and refreshes updated_at."
        test_recipe:
          setup: ["QUOTED job, version 1"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Ver Co", site_code: "VER-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id, job_v: $.data.version } }
          trigger:
            - { call: "PATCH /crating/packing-jobs/${job_id}", payload: { expected_packing_job_version: "${job_v}", incoterm: DDP }, as: SalesRep, captures: { v_after: $.data.version } }
          assert: ["version == 2 (increment by exactly 1); incoterm == DDP"]
      - name: design_supersede_success
        claim_type: cascading_side_effects
        grounds: [state_machines.CrateDesign.DRAFT_to_SUPERSEDED, "concurrency_rules[design-create-supersede-item]"]
        distinguishing_aspect: "Create-with-supersede happy path: with the fresh item version, a second design create supersedes the first (DRAFT -> SUPERSEDED) and the new design gets revision 2."
        test_recipe:
          setup: ["customer + job + item; design1 DRAFT revision 1; fresh item version captured"]
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Supersede Co", site_code: "SUP-01", credit_limit_cents: 500000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Block", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 1000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design1_id: $.data.id } }
            - { call: "GET /crating/items/${item_id}", payload: {}, as: CratingDesigner, captures: { item_v2: $.data.version } }
          trigger:
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v2}" }, as: CratingDesigner, captures: { design2_id: $.data.id, rev2: $.data.revision } }
            - { call: "GET /crating/designs/${design1_id}", payload: {}, as: CratingDesigner, captures: { d1_state: $.data.status } }
          assert:
            - "new design revision == 2, status DRAFT"
            - "design1 status == SUPERSEDED"

