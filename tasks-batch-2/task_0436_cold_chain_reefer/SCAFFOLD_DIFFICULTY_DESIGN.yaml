              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-12", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-12"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-12"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-12"
              captures: { comp_id: $.data.id }
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-12"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-12"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-op-12"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-12"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-12"
            - call: "POST /compartments/${comp_id}/readings"
