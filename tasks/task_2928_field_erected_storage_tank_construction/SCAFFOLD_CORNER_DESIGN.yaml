              as: CivilContractor
              captures: { sv25: $.data.id }
            - call: "POST /hydrotest-plans/${plan_id}/fill-advance"
              payload: { target_fill_percent: 25, settlement_survey_id: "${sv25}" }
              as: ErectionSuperintendent
          trigger:
            - call: "POST /hydrotest-plans/${plan_id}/fill-advance"
              payload: { target_fill_percent: 25, settlement_survey_id: "${sv25}" }
              as: ErectionSuperintendent
            - call: "POST /hydrotest-plans/${plan_id}/fill-advance"
              payload: { target_fill_percent: 10, settlement_survey_id: "${sv25}" }
              as: ErectionSuperintendent
            - call: "POST /hydrotest-plans/${plan_id}/fill-advance"
              payload: { target_fill_percent: 50, settlement_survey_id: "${sv25}" }
              as: ErectionSuperintendent
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", hydrotest_plan_id: "${plan_id}", fill_percent: 50, point_readings: [ { point_index: 1, elevation_in: 98.000 }, { point_index: 2, elevation_in: 98.000 }, { point_index: 3, elevation_in: 98.000 }, { point_index: 4, elevation_in: 98.000 }, { point_index: 5, elevation_in: 98.000 }, { point_index: 6, elevation_in: 98.000 }, { point_index: 7, elevation_in: 98.000 }, { point_index: 8, elevation_in: 98.000 } ] }
              as: CivilContractor
              captures: { sv50: $.data.id }
            - call: "POST /hydrotest-plans/${plan_id}/fill-advance"
              payload: { target_fill_percent: 50, settlement_survey_id: "${sv50}" }
              as: ErectionSuperintendent
          assert:
            - "before the triggers HydrotestPlan.${plan_id}.status == 'FILLING' with fill_percent_current == 25.0 and settlement_survey_count == 1"
            - "re-declaring 25 returns HTTP 409 ERR_FILL_PERCENT_NOT_ADVANCING - equal is not strictly greater - and draining to 10 returns the same id"
            - "advancing to 50 while citing the 25 percent survey returns HTTP 409 ERR_SETTLEMENT_HOLD_POINT_MISSING: the survey resolves and belongs to the right foundation package, but its fill_percent is 25, not 50"
            - "fill_percent_current is still 25.0 and settlement_survey_count is still 1 after all three refusals"
            - "the new 50 percent survey returns HTTP 201 with verdict == 'WITHIN_TOLERANCE' (a uniform 2.000 in settlement scores 0.000 on both differential metrics)"
            - "the advance citing it returns HTTP 200 with fill_percent_current == 50.0 and settlement_survey_count == 2; the plan is still FILLING because hold_started_at_utc is only stamped at 100 percent"

      - name: frozen_tank_refuses_every_production_write
        claim_type: posture_gate_rejection
        grounds:
          - validations.priority_23_ERR_TANK_POSTURE_FROZEN
          - state_machines.Tank.quality_posture.RESTRICTED_to_FROZEN
          - calculations.tank_quality_posture
        distinguishing_aspect: |
          Freezing is a tank-wide stop-work order that is never requested: it is recomputed
          from the third open nonconformance and then blocks unrelated children - a course on
          the other side of the tank, a steel allocation, a coating step - while deliberately
          leaving open exactly the operations that can clear it. Voiding one report thaws the
          tank to RESTRICTED and the identical blocked call then succeeds.
        test_recipe:
          setup:
            - "Tank TK-101 with an accepted foundation; course 1 FITTED and carrying three independent seams V1, V2 and V3, all welded; a second SPECIFIED course; a RECEIVED plate lot; and an EXTERNAL_COATING application at SPEC_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
