scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 - dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: capacity_variant_state_loading_vs_district_policy
        grounds:
          calculations: [program_capacity_seats, utilization_and_portable_need]
          entities: [CapacityStudy, School, Room, ProgramSetAside, ClassSizePolicy, EnrollmentProjection]
          endpoints: ["POST /facilities/capacity-studies/{id}/submit", "GET /facilities/capacity-studies/{id}/capacity-breakdown"]
        variant_a: STATE_LOADING_STANDARD
        variant_b: DISTRICT_POLICY
        distinguishing_aspect: >
          On one identical building program the state loading standard yields 124
          seats and district policy yields 106, because district policy loads by
          assignable area against the class-size policy (the 720 sqft room caps at
          24 rather than 25, the science lab pays the 20 sqft lab premium and caps
          at 20 rather than 24, and the art/music room loads at 50 percent giving
          14 rather than 25) and because every set-aside deducts under district
          policy while only SPED_SELF_CONTAINED deducts under the state standard
          (20 seats versus 12). The projection input set also diverges: the state
          standard drops the DEVELOPER_YIELD row for grade 6 and falls back to the
          COHORT_SURVIVAL value 44, giving 126 projected pupils rather than 134. An
          implementation that shares one loading table, or one projection filter,
          across both methods cannot produce both column pairs.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/class-size-policies"
            payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { policy_id: id }
          - call: "POST /facilities/schools"
            payload: { name: "Ridgeview Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { school_id: id, school_version_1: version }
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R102", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R103", room_type: "STANDARD_CLASSROOM", area_sqft: 720 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "L201", room_type: "SCIENCE_LAB", area_sqft: 1000 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "S301", room_type: "SPED_RESOURCE", area_sqft: 650 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "A401", room_type: "ART_MUSIC", area_sqft: 840 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "G001", room_type: "GYM", area_sqft: 5000 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/program-set-asides"
            payload: { school_id: "${school_id}", program_type: "SPED_SELF_CONTAINED", reserved_room_type: "SPED_RESOURCE", reserved_room_count: 1, seats_excluded_per_room: 12 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/program-set-asides"
            payload: { school_id: "${school_id}", program_type: "CTE_LAB", reserved_room_type: "SCIENCE_LAB", reserved_room_count: 1, seats_excluded_per_room: 8 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 6, projected_students: 44, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 6, projected_students: 52, source: "DEVELOPER_YIELD", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 7, projected_students: 42, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 8, projected_students: 40, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/capacity-studies"
            payload: { school_id: "${school_id}", class_size_policy_id: "${policy_id}", school_year: "2027-28", method: "DISTRICT_POLICY", expected_school_version: "${school_version_1}" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
            captures: { district_study_id: id }
          - call: "POST /facilities/capacity-studies/${district_study_id}/submit"
            payload: {}
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "GET /facilities/schools/${school_id}"
            payload: {}
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { school_version_2: version }
          - call: "POST /facilities/capacity-studies"
            payload: { school_id: "${school_id}", class_size_policy_id: "${policy_id}", school_year: "2027-28", method: "STATE_LOADING_STANDARD", expected_school_version: "${school_version_2}" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
            captures: { state_study_id: id }
          - call: "POST /facilities/capacity-studies/${state_study_id}/submit"
            payload: {}
            as: FacilitiesPlanner
            as_user_id: "planner-1"
        trigger:
          call: "GET /facilities/capacity-studies/${state_study_id}/capacity-breakdown"
          payload: {}
          as: FacilitiesPlanner
          as_user_id: "planner-1"
        asserts:
          - "response status is 200"
          - "data.method == \"STATE_LOADING_STANDARD\""
          - "data.state_standard_seats == 124"
          - "data.district_policy_seats == 106"
          - "data.program_capacity_seats == 124"
          - "data.set_aside_deduction_seats == 12"
          - "data.gross_room_seats == 136"
          - "data.state_projected_total == 126"
          - "data.district_projected_total == 134"
          - "data.projected_enrollment_total == 126"
          - "data.utilization_pct == 101.6"
          - "data.portable_trigger_met == true"
          - "data.seat_deficit == 9"
          - "data.required_portable_count == 1"
          - "GET /facilities/capacity-studies/${district_study_id} returns data.program_capacity_seats == 106, data.set_aside_deduction_seats == 20, data.gross_room_seats == 126, data.projected_enrollment_total == 134, data.utilization_pct == 126.4, data.seat_deficit == 34 and data.required_portable_count == 2"
          - "GET /facilities/capacity-studies/${district_study_id} returns data.status == \"SUPERSEDED\" because a newer study for the same school_year was created"

      - name: salvage_variant_straight_line_vs_condition_adjusted
        grounds:
          calculations: [unit_salvage_value]
          entities: [PortableUnit, DisposalRecord]
          endpoints: ["POST /facilities/disposal-records"]
        variant_a: STRAIGHT_LINE
        variant_b: CONDITION_ADJUSTED
        distinguishing_aspect: >
          Four units carry byte-identical acquisition cost, in-service year and
          condition grade. On the straight-line basis the salvage value is
          1,920,000 cents; on the condition-adjusted basis the rounded
          straight-line figure is multiplied by the grade C multiplier 0.55 and
          re-floored, giving 1,056,000 cents. The divergence is not cosmetic: a
          sale at 800,000 cents clears the 70 percent recovery gate under
          CONDITION_ADJUSTED (739,200 required) and is rejected with
          ERR_DISPOSAL_UNDERVALUED under STRAIGHT_LINE (1,344,000 required). An
          implementation that applies the condition multiplier before rounding, or
          that shares one salvage figure across both bases, cannot produce both the
          864,000 cent gap and the opposite sale verdicts.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-15T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-1001", size_class: "SINGLE_24x40", condition_grade: "C", ada_ramp_installed: false, acquisition_cost_cents: 9600000, in_service_year: 2011 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { unit_sl_id: id }
          - call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-1002", size_class: "SINGLE_24x40", condition_grade: "C", ada_ramp_installed: false, acquisition_cost_cents: 9600000, in_service_year: 2011 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { unit_ca_id: id }
          - call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-1003", size_class: "SINGLE_24x40", condition_grade: "C", ada_ramp_installed: false, acquisition_cost_cents: 9600000, in_service_year: 2011 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { unit_sale_sl_id: id }
          - call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-1004", size_class: "SINGLE_24x40", condition_grade: "C", ada_ramp_installed: false, acquisition_cost_cents: 9600000, in_service_year: 2011 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { unit_sale_ca_id: id }
          - call: "POST /facilities/portable-units/${unit_sl_id}/condition"
            payload: { condition_status: "UNSAFE", condition_grade: "C" }
            as: AssetManager
            as_user_id: "assets-3"
          - call: "POST /facilities/portable-units/${unit_ca_id}/condition"
            payload: { condition_status: "UNSAFE", condition_grade: "C" }
            as: AssetManager
            as_user_id: "assets-3"
          - call: "POST /facilities/portable-units/${unit_sale_sl_id}/condition"
            payload: { condition_status: "UNSAFE", condition_grade: "C" }
            as: AssetManager
            as_user_id: "assets-3"
          - call: "POST /facilities/portable-units/${unit_sale_ca_id}/condition"
            payload: { condition_status: "UNSAFE", condition_grade: "C" }
            as: AssetManager
            as_user_id: "assets-3"
          - call: "POST /facilities/disposal-records"
            payload: { portable_unit_id: "${unit_sl_id}", method: "SCRAP", valuation_basis: "STRAIGHT_LINE", proceeds_cents: 0 }
            as: AssetManager
            as_user_id: "assets-3"
        trigger:
          call: "POST /facilities/disposal-records"
          payload: { portable_unit_id: "${unit_ca_id}", method: "SCRAP", valuation_basis: "CONDITION_ADJUSTED", proceeds_cents: 0 }
          as: AssetManager
          as_user_id: "assets-3"
        asserts:
          - "response status is 201"
          - "data.salvage_value_cents == 1056000"
          - "data.net_disposal_result_cents == -1056000"
          - "the earlier STRAIGHT_LINE record for ${unit_sl_id} has data.salvage_value_cents == 1920000 and data.net_disposal_result_cents == -1920000"
          - "POST /facilities/disposal-records with portable_unit_id ${unit_sale_sl_id}, method SALE, valuation_basis STRAIGHT_LINE and proceeds_cents 800000 returns 422 with data.error_id == \"ERR_DISPOSAL_UNDERVALUED\" because 800000 is below the required 1344000"
          - "POST /facilities/disposal-records with portable_unit_id ${unit_sale_ca_id}, method SALE, valuation_basis CONDITION_ADJUSTED and proceeds_cents 800000 returns 201 with data.salvage_value_cents == 1056000 and data.net_disposal_result_cents == -256000 because 800000 clears the required 739200"

      - name: cost_basis_variant_lifecycle_vs_immediate_capital
        grounds:
          calculations: [alternative_cost_comparison, relocation_cost_estimate]
          entities: [PlacementRequest, CapacityStudy, School, PortableUnit, PlacementSite]
          endpoints: ["GET /facilities/placement-requests/{id}/cost-model"]
        variant_a: LIFECYCLE_20YR
        variant_b: IMMEDIATE_CAPITAL
        distinguishing_aspect: >
          The same placement request, the same 34 seat deficit and the same two
          required units yield opposite capital recommendations depending only on
          the basis query parameter. Under LIFECYCLE_20YR relocation carries 20
          years of operations at 1,150,000 cents a year plus the eventual removal
          cost, pushing relocation direct cost to 68,826,880 cents, which crosses
          the 50,000,000 cent soft-cost tier break into 13 percent and totals
          77,774,374 cents, so BOUNDARY_CHANGE at 22,366,800 wins. Under
          IMMEDIATE_CAPITAL relocation direct cost is only 19,626,880 cents, stays
          in the 9 percent tier and totals 21,393,299 cents, so RELOCATE wins by
          973,501 cents. An implementation that computes one comparison and reuses
          it for both bases cannot flip the recommendation.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/class-size-policies"
            payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { policy_id: id }
          - call: "POST /facilities/schools"
            payload: { name: "Ridgeview Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { school_id: id, school_version_1: version }
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R102", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R103", room_type: "STANDARD_CLASSROOM", area_sqft: 720 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "L201", room_type: "SCIENCE_LAB", area_sqft: 1000 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "S301", room_type: "SPED_RESOURCE", area_sqft: 650 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "A401", room_type: "ART_MUSIC", area_sqft: 840 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "G001", room_type: "GYM", area_sqft: 5000 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/program-set-asides"
            payload: { school_id: "${school_id}", program_type: "SPED_SELF_CONTAINED", reserved_room_type: "SPED_RESOURCE", reserved_room_count: 1, seats_excluded_per_room: 12 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/program-set-asides"
            payload: { school_id: "${school_id}", program_type: "CTE_LAB", reserved_room_type: "SCIENCE_LAB", reserved_room_count: 1, seats_excluded_per_room: 8 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 6, projected_students: 44, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 6, projected_students: 52, source: "DEVELOPER_YIELD", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 7, projected_students: 42, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/enrollment-projections"
            payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 8, projected_students: 40, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          - call: "POST /facilities/capital-budgets"
            payload: { fiscal_year: "2027-28", authorized_cents: 500000000 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { budget_id: id }
          - call: "POST /facilities/placement-sites"
            payload: { school_id: "${school_id}", pad_code: "PAD-A", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 40, electrical_drop_available_kw: 8, sewer_connection_available: false, ada_path_of_travel_compliant: true }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { site_id: id }
          - call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-2001", size_class: "SINGLE_24x40", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2019 }
            as: AssetManager
            as_user_id: "assets-3"
            captures: { unit_id: id }
          - call: "POST /facilities/capacity-studies"
            payload: { school_id: "${school_id}", class_size_policy_id: "${policy_id}", school_year: "2027-28", method: "DISTRICT_POLICY", expected_school_version: "${school_version_1}" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
            captures: { study_id: id }
          - call: "POST /facilities/capacity-studies/${study_id}/submit"
            payload: {}
            as: FacilitiesPlanner
            as_user_id: "planner-1"
            captures: { study_version: version }
          - call: "POST /facilities/placement-requests"
            payload: { capacity_study_id: "${study_id}", placement_site_id: "${site_id}", capital_budget_id: "${budget_id}", requested_window_start: "2027-06-15", requested_window_end: "2027-06-25", haul_miles: 14, portable_unit_id: "${unit_id}", expected_study_version: "${study_version}" }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
            captures: { request_id: id }
        trigger:
          call: "GET /facilities/placement-requests/${request_id}/cost-model?basis=IMMEDIATE_CAPITAL"
          payload: { basis: "IMMEDIATE_CAPITAL" }
          as: FacilitiesPlanner
          as_user_id: "planner-1"
        asserts:
          - "response status is 200"
          - "data.basis == \"IMMEDIATE_CAPITAL\""
          - "data.mobilisation_cents == 5032000"
          - "data.site_work_cents == 1850000"
          - "data.rehab_cents == 1250000"
          - "data.permit_fee_cents == 630000"
          - "data.direct_cost_cents == 8762000"
          - "data.contingency_cents == 1051440"
          - "data.estimated_relocation_cost_cents == 9813440"
          - "data.relocation_direct_cents == 19626880"
          - "data.relocation_soft_cost_cents == 1766419"
          - "data.relocation_total_program_cost_cents == 21393299"
          - "data.boundary_change_total_program_cost_cents == 22366800"
          - "data.cost_recommendation == \"RELOCATE\""
          - "GET /facilities/placement-requests/${request_id}/cost-model with basis LIFECYCLE_20YR returns data.relocation_direct_cents == 68826880, data.relocation_soft_cost_cents == 8947494, data.relocation_total_program_cost_cents == 77774374 and data.cost_recommendation == \"BOUNDARY_CHANGE\""
          - "GET /facilities/placement-requests/${request_id} returns data.cost_recommendation == \"BOUNDARY_CHANGE\" because the stored value uses the default LIFECYCLE_20YR basis"

  # =========================================================================
  # RULE 2 - combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: contingency_nested_clamp_floor_and_cap_arms
        grounds:
          calculations: [relocation_cost_estimate]
          entities: [PlacementRequest, PortableUnit, PlacementSite]
          endpoints: ["GET /facilities/placement-requests/{id}/cost-model"]
        mode: a
        formula_shape: "contingency_cents = max(700000, min(1500000, round_half_up(0.12 * direct_cost_cents))) where direct_cost_cents is itself a sum of four conditionally-computed components"
        distinguishing_aspect: >
          Two requests in one district exercise opposite arms of the same nested
          clamp. A grade A single-wide hauled zero miles onto a fully serviced pad
          has direct cost 5,130,000 cents, so 12 percent is 615,600 and the outer
          max lifts the contingency to the 700,000 floor. A grade C triple-wide
          hauled 30 miles onto a pad needing an electrical upgrade, a sewer hookup
          and an accessible path retrofit has direct cost 23,990,000 cents, so 12
          percent is 2,878,800 and the inner min pins the contingency at the
          1,500,000 cap. An implementation that only multiplies by 12 percent, that
          swaps max for min, or that clamps before summing the four components,
          fails one arm or the other.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/class-size-policies"
            payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { policy_id: id }
          - call: "POST /facilities/schools"
            payload: { name: "Cypress Middle", grade_configuration: "MIDDLE_68", site_acreage: 14.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 1, consecutive_reliance_years: 0 }
            as: DistrictAdmin
            as_user_id: "admin-1"
            captures: { school_id: id, school_version_1: version }
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R102", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
