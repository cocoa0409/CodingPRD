scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_vs_adjudicated_member_cost_on_claim
        grounds:
          - calculations.estimated_member_cost
          - calculations.adjudicated_member_cost
          - entities.Claim.fields.estimated_member_cost_cents
          - entities.Claim.fields.adjudicated_member_cost_cents
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: |
          Same Claim, same Drug, same Plan: the forward-looking estimate at submission time uses Member YTD=0;
          the chronological adjudicated cost uses Member YTD at adjudication time. The entity domain is Claim
          (a pharmacy transaction) — pricing on a financial-transaction object.
        test_recipe:
          setup:
            - "Plan(deductible_cents=50000, oop_max_cents=200000, coinsurance_rate=0.20, mail_order_discount_rate=0.90)"
            - "Drug D_A(unit_allowed_cents=10000, is_specialty=false, requires_prior_auth=false, status=ACTIVE)"
            - "Drug D_B(unit_allowed_cents=4000, is_specialty=false, requires_prior_auth=false, status=ACTIVE)"
            - "FormularyEntry FE_A(plan=Plan, drug=D_A, tier=3, copay_cents=0, status=ACTIVE)"
            - "FormularyEntry FE_B(plan=Plan, drug=D_B, tier=3, copay_cents=0, status=ACTIVE)"
            - "Member M(plan_id=Plan.id, enrollment_status=ACTIVE, ytd_deductible_paid_cents=0, ytd_oop_paid_cents=0)"
          trigger:
            - "POST /pbm/claims body={member_id:M.id, drug_id:D_A.id, channel:RETAIL_30, days_supply:30, quantity:30}  # claim_A"
            - "POST /pbm/claims body={member_id:M.id, drug_id:D_B.id, channel:RETAIL_30, days_supply:30, quantity:10}  # claim_B"
            - "POST /pbm/claims/{claim_B.id}/adjudicate  # advances Member YTD by 40000c deductible"
            - "POST /_clock/advance body={seconds:60}    # supply windows do not overlap (different drugs)"
            - "POST /pbm/claims/{claim_A.id}/adjudicate"
          assert:
            - "claim_A.estimated_member_cost_cents == 100000"
            - "claim_A.adjudicated_member_cost_cents == 68000"
            - "claim_A.estimated_member_cost_cents != claim_A.adjudicated_member_cost_cents"

      - name: provisional_rebate_vs_final_after_clawback
        grounds:
          - calculations.rebate_accrual
          - calculations.rebate_final_after_clawback
          - entities.LedgerEntry.fields.entry_type
          - entities.LedgerEntry.fields.amount_cents
          - state_machines.Claim.PAID_to_REVERSED
        distinguishing_aspect: |
          Same accrued LedgerEntry; the provisional (aggregation) variant computes the +rebate_rate accrual at
          PAY time, while the final (chronological) variant nets the accrual with a clawback when REVERSE
          fires inside the window. The entity domain is RebateAgreement / LedgerEntry — accounting / ledger
          state — which is structurally different from Claim pricing in instance 1.
        test_recipe:
          setup:
            - "Plan(deductible_cents=0, oop_max_cents=200000, coinsurance_rate=0.20, mail_order_discount_rate=0.90)"
            - "Drug D(unit_allowed_cents=5000, is_specialty=false, requires_prior_auth=false, status=ACTIVE)"
            - "FormularyEntry FE(plan=Plan, drug=D, tier=1, copay_cents=1000, status=ACTIVE)"
            - "Member M(plan_id=Plan.id, enrollment_status=ACTIVE, ytd_deductible_paid_cents=0, ytd_oop_paid_cents=0)"
            - "RebateAgreement RA(drug_id=D.id, manufacturer_name='M', rebate_rate=0.15, clawback_window_days=90, status=ACTIVE)"
          trigger:
            - "POST /pbm/claims body={member_id:M.id, drug_id:D.id, channel:MAIL_ORDER_90, days_supply:90, quantity:10}"
            - "POST /pbm/claims/{claim.id}/adjudicate"
            - "POST /pbm/claims/{claim.id}/pay"
            - "POST /pbm/claims/{claim.id}/reverse  # within 90-day window"
          assert:
            - "LedgerEntry rows for claim.id include exactly one with entry_type=REBATE_ACCRUED and amount_cents == 6600"
            - "LedgerEntry rows for claim.id include exactly one with entry_type=REBATE_CLAWBACK and amount_cents == -6600"
            - "sum(LedgerEntry.amount_cents WHERE claim_id == claim.id) == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_copay_plus_oop_cap_plus_card_three_input_formula
        grounds:
          - calculations.adjudicated_member_cost
          - entities.FormularyEntry.fields.tier
          - entities.FormularyEntry.fields.copay_cents
          - entities.Plan.fields.coinsurance_rate
          - entities.Plan.fields.oop_max_cents
          - entities.CopayCard.fields.per_claim_cap_cents
        distinguishing_aspect: |
          MODE (a) — formula with >=3 inputs and non-linear interaction. The four inputs (tier branch,
          deductible remainder, OOP cap remainder, copay-card cap) compose via nested min/max; the tier
          BRANCH changes the algebra (flat copay vs coinsurance), the OOP cap clamps the result, and the
          card cap further reduces it. Not reducible to a single linear weighted sum.
        test_recipe:
          setup:
            - "Plan(deductible_cents=5000, oop_max_cents=10000, coinsurance_rate=0.20)"
            - "Drug D(unit_allowed_cents=2000, is_specialty=false, requires_prior_auth=false)"
            - "FormularyEntry FE(plan=Plan, drug=D, tier=3, copay_cents=0, status=ACTIVE)"
            - "Member M(plan_id=Plan.id, ytd_deductible_paid_cents=5000, ytd_oop_paid_cents=8000, enrollment_status=ACTIVE)"
            - "CopayCard C(member_id=M.id, drug_id=D.id, max_benefit_cents=500, per_claim_cap_cents=500, used_cents=0, status=ACTIVE)"
          trigger:
            - "POST /pbm/claims body={member_id:M.id, drug_id:D.id, channel:RETAIL_30, days_supply:10, quantity:10, copay_card_id:C.id}"
            - "POST /pbm/claims/{claim.id}/adjudicate"
          assert:
            - "claim.adjudicated_allowed_cents == 20000"
            - "claim.adjudicated_member_cost_cents == 1500  # post_ded=20000, coins=4000, oop_remaining=2000, member_pre_card=2000, card=500, final=1500"
            - "claim.copay_card_paid_cents == 500"

      - name: side_effect_ordering_deductible_then_oop_then_card
        grounds:
          - calculations.adjudicated_member_cost
          - calculations.adjudicated_member_cost.constants.SIDE_EFFECT_ORDER
          - entities.Member.fields.ytd_deductible_paid_cents
          - entities.Member.fields.ytd_oop_paid_cents
          - entities.CopayCard.fields.used_cents
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency pinned by evaluation order. The card_payable depends on
          member_pre_card, but member_pre_card depends on oop_remaining, which depends on ytd_oop. The
          scaffold pins the write order: deductible -> oop -> card, and pins that OOP counts
          member_pre_card (BEFORE card offset) rather than adjudicated_member_cost_cents (AFTER card
          offset). Reversing this order produces different OOP balances.
        test_recipe:
          setup:
            - "Plan(deductible_cents=0, oop_max_cents=100000, coinsurance_rate=0.20)"
            - "Drug D(unit_allowed_cents=1000)"
            - "FormularyEntry FE(plan=Plan, drug=D, tier=3, copay_cents=0, status=ACTIVE)"
            - "Member M(plan_id=Plan.id, enrollment_status=ACTIVE, ytd_deductible_paid_cents=0, ytd_oop_paid_cents=0)"
            - "CopayCard C(member_id=M.id, drug_id=D.id, max_benefit_cents=1000, per_claim_cap_cents=1000, status=ACTIVE)"
          trigger:
            - "POST /pbm/claims body={member_id:M.id, drug_id:D.id, channel:RETAIL_30, days_supply:30, quantity:30, copay_card_id:C.id}"
            - "POST /pbm/claims/{claim.id}/adjudicate"
          assert:
            - "claim.adjudicated_member_cost_cents == 5000  # 30000*0.20=6000 pre-card; minus card 1000 = 5000"
            - "claim.copay_card_paid_cents == 1000"
            - "Member.ytd_oop_paid_cents == 6000  # OOP counts member_pre_card (6000) — NOT the post-card 5000"
            - "CopayCard.used_cents == 1000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: prior_auth_cyclic_submitted_info_requested
        grounds:
          - state_machines.PriorAuthorization
          - state_machines.PriorAuthorization.SUBMITTED_to_INFO_REQUESTED
          - state_machines.PriorAuthorization.INFO_REQUESTED_to_SUBMITTED
          - entities.PriorAuthorization.fields.revision_count
        distinguishing_aspect: |
          Cycle SUBMITTED <-> INFO_REQUESTED on PriorAuthorization, bounded by revision_count < 3. The state
          can re-enter SUBMITTED while accumulating revision_count, which is structurally different from a
          linear pipeline. Entity domain: PriorAuthorization.
        test_recipe:
          setup:
            - "PriorAuthorization PA in status SUBMITTED, revision_count=0"
          trigger:
            - "POST /pbm/prior-authorizations/{PA.id}/request-info  # SUBMITTED -> INFO_REQUESTED"
            - "POST /pbm/prior-authorizations/{PA.id}/resubmit       # INFO_REQUESTED -> SUBMITTED, revision_count=1"
            - "POST /pbm/prior-authorizations/{PA.id}/request-info  # SUBMITTED -> INFO_REQUESTED"
            - "POST /pbm/prior-authorizations/{PA.id}/resubmit       # INFO_REQUESTED -> SUBMITTED, revision_count=2"
          assert:
            - "PA.status == SUBMITTED after the second resubmit"
            - "PA.revision_count == 2"
            - "the next POST /pbm/prior-authorizations/{PA.id}/resubmit (after another request-info) MUST be rejected with ERR_PA_REVISION_LIMIT (HTTP 422)"

      - name: claim_parallel_status_axes
        grounds:
          - state_machines.Claim
          - entities.Claim.fields.status
          - entities.Claim.fields.payment_status
          - state_machines.Claim.ADJUDICATED_to_PAID
          - state_machines.Claim.PAID_to_REVERSED
        distinguishing_aspect: |
          Parallel state dimensions on a single Claim entity: adjudication axis (SUBMITTED -> ADJUDICATED ->
          PAID -> REVERSED) and payment_status axis (UNPAID -> PAID -> REFUNDED) evolve along the same hop
          but are observable independently. Entity domain: Claim — different from PriorAuthorization in
          instance 1.
        test_recipe:
          setup:
            - "Claim claim in ADJUDICATED with payment_status=UNPAID"
          trigger:
            - "POST /pbm/claims/{claim.id}/pay     # status->PAID, payment_status->PAID"
            - "POST /pbm/claims/{claim.id}/reverse # status->REVERSED, payment_status->REFUNDED"
          assert:
            - "after pay: claim.status == PAID AND claim.payment_status == PAID"
            - "after reverse: claim.status == REVERSED AND claim.payment_status == REFUNDED"
            - "the two axes report distinct enum values (REVERSED vs REFUNDED) on the same row"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reverse_claim_depth_three_cascade_through_member_ytd
        grounds:
          - state_machines.Claim.PAID_to_REVERSED
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - calculations.adjudicated_member_cost
          - entities.Member.fields.ytd_deductible_paid_cents
          - entities.Member.fields.ytd_oop_paid_cents
        distinguishing_aspect: |
          Depth-3 cascade: REVERSE on claim_A (link 1) mutates Member.ytd_deductible_paid_cents (link 2);
          that YTD change CAUSES the next ADJUDICATE on claim_B (same member, different drug) to compute a
          larger deductible_portion (link 3). Each link is caused by the previous link, not by REVERSE
          directly: REVERSE does not adjudicate claim_B; the changed YTD does.
        test_recipe:
          setup:
            - "Plan(deductible_cents=50000, oop_max_cents=200000, coinsurance_rate=0.20)"
            - "Drug D_A(unit_allowed_cents=10000)"
            - "Drug D_B(unit_allowed_cents=10000)"
            - "FormularyEntry FE_A(plan=Plan, drug=D_A, tier=3, copay_cents=0, status=ACTIVE)"
            - "FormularyEntry FE_B(plan=Plan, drug=D_B, tier=3, copay_cents=0, status=ACTIVE)"
            - "Member M(plan_id=Plan.id, ytd_deductible_paid_cents=0, ytd_oop_paid_cents=0)"
            - "claim_A: pay claim for D_A so that Member.ytd_deductible_paid_cents == 50000 (allowed=300000, ded_portion=50000)"
          trigger:
            - "POST /pbm/claims body={member_id:M.id, drug_id:D_B.id, channel:RETAIL_30, days_supply:30, quantity:1}  # claim_B"
            - "POST /pbm/claims/{claim_A.id}/reverse                                                                   # link 1+2: Member.ytd_ded decrements"
            - "POST /pbm/claims/{claim_B.id}/adjudicate                                                                # link 3: now uses lower ytd_ded"
          assert:
            - "before reverse: Member.ytd_deductible_paid_cents == 50000"
            - "after reverse:  Member.ytd_deductible_paid_cents == 0"
            - "after claim_B adjudicate: claim_B.adjudicated_member_cost_cents == 10000  # all 10000 in deductible since deductible is empty"
            - "Member.ytd_deductible_paid_cents == 10000 after claim_B adjudicate"

      - name: revoke_pa_depth_two_cascade_into_pending_claim
        grounds:
          - state_machines.PriorAuthorization.APPROVED_to_REVOKED
          - state_machines.Claim.SUBMITTED_to_REJECTED
          - calculations.pa_effective_window_check
        distinguishing_aspect: |
          Depth-2 cascade: REVOKE on PA (link 1) flips PA.status to REVOKED (link 1 mutation); the next
          ADJUDICATE on a SUBMITTED claim referencing that PA reads the new status and fails its precondition
          (link 2, caused by link 1's status change, not by REVOKE directly). Triggering action (REVOKE PA)
          differs from instance 1's triggering action (REVERSE claim).
        test_recipe:
          setup:
            - "Drug D(requires_prior_auth=true)"
            - "Member M, FormularyEntry FE for D"
            - "PriorAuthorization PA in status APPROVED, effective_start=now, effective_end=now+180d, member_id=M.id, drug_id=D.id"
            - "Claim C in status SUBMITTED, prior_auth_id=PA.id, member_id=M.id, drug_id=D.id, channel=RETAIL_30, days_supply=30, quantity=1"
          trigger:
            - "POST /pbm/prior-authorizations/{PA.id}/revoke   # link 1: PA APPROVED->REVOKED"
            - "POST /pbm/claims/{C.id}/adjudicate              # link 2: REJECTED because PA.status == REVOKED"
          assert:
            - "after revoke: PA.status == REVOKED"
            - "after adjudicate: C.status == REJECTED"
            - "C.reject_reason references PA being REVOKED (error_id surfaced is ERR_PA_REVOKED)"
            - "Member.ytd_deductible_paid_cents unchanged"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_pa_revoked_vs_specialty
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SPECIALTY_CHANNEL_REQUIRED
        distinguishing_aspect: |
          Category pair: STATE (priority 4) vs BUSINESS_SAFETY (priority 6). Claim is not in SUBMITTED
          (already ADJUDICATED) AND drug is specialty with wrong channel. STATE check fires first.
        test_recipe:
          setup:
            - "Drug D(is_specialty=true)"
            - "Member M, Plan, FormularyEntry FE for D"
            - "Claim C in status ADJUDICATED, channel=RETAIL_30 (wrong channel), drug_id=D.id"
          trigger:
            - "POST /pbm/claims/{C.id}/adjudicate   # would fail BOTH state and specialty checks"
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "NOT response.data.error_id == 'ERR_SPECIALTY_CHANNEL_REQUIRED'"

      - name: business_safety_beats_business_referential_pa_required_vs_card_mismatch
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors.ERR_PA_REQUIRED
          - errors.ERR_COPAY_CARD_MISMATCH
        distinguishing_aspect: |
          Category pair: BUSINESS_SAFETY (priority 7, PA required) vs BUSINESS_REFERENTIAL (priority 12,
          copay-card mismatch). Same claim violates both. SAFETY fires first. Different category pair from
          instance 1.
        test_recipe:
          setup:
            - "Drug D(requires_prior_auth=true)"
            - "Member M, Plan, FormularyEntry FE for D"
            - "CopayCard C(member_id=M.id, drug_id=DIFFERENT_DRUG_ID, status=ACTIVE)  # wrong drug"
            - "Claim cl in status SUBMITTED, drug_id=D.id, copay_card_id=C.id, prior_auth_id=null, channel=RETAIL_30"
          trigger:
            - "POST /pbm/claims/{cl.id}/adjudicate"
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == 'ERR_PA_REQUIRED'"
            - "NOT response.data.error_id == 'ERR_COPAY_CARD_MISMATCH'"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: pa_effective_window_exact_end_boundary
        grounds:
          - calculations.pa_effective_window_check
          - calculations.pa_effective_window_check.constants.INTERVAL_SEMANTICS
          - state_machines.PriorAuthorization.APPROVED_to_EXPIRED
        distinguishing_aspect: |
          Numeric (time) boundary on PA window: closed-left, open-right. clock_now() == effective_end
          REJECTS (PA just EXPIRED), clock_now() == effective_end - 1s ACCEPTS. Tested through
          POST /pbm/claims/{id}/adjudicate.
        test_recipe:
          setup:
            - "Drug D(requires_prior_auth=true)"
            - "PriorAuthorization PA in APPROVED, effective_start=now, effective_end=now+180d (15552000s)"
            - "Member M, Plan, FormularyEntry FE for D"
            - "Claim C1 in SUBMITTED, prior_auth_id=PA.id, drug_id=D.id, channel=RETAIL_30, days_supply=30, quantity=1"
            - "Claim C2 in SUBMITTED, prior_auth_id=PA.id, drug_id=D.id, channel=RETAIL_30, days_supply=30, quantity=1"
          trigger:
            - "POST /_clock/advance body={seconds:15551999}  # 1 second before effective_end"
            - "POST /pbm/claims/{C1.id}/adjudicate           # accepted"
            - "POST /_clock/advance body={seconds:1}         # now exactly at effective_end"
            - "POST /pbm/claims/{C2.id}/adjudicate           # rejected"
          assert:
            - "C1.status == ADJUDICATED"
            - "C2.status == REJECTED"
            - "C2 error_id surfaced == 'ERR_PA_EXPIRED'"

      - name: empty_step_therapy_predecessor_history_on_claim_endpoint
        grounds:
          - validations[priority=8]
          - errors.ERR_STEP_THERAPY_NOT_SATISFIED
          - entities.Drug.fields.step_therapy_predecessor_ndc
        distinguishing_aspect: |
          Empty-set boundary (zero PAID claims for predecessor drug). Tested through
          POST /pbm/claims/{id}/adjudicate — a DIFFERENT endpoint and a DIFFERENT metric (set cardinality)
          from the numeric-time boundary in instance 1.
        test_recipe:
          setup:
            - "Drug D_pred(ndc='00000000001')"
            - "Drug D_step(step_therapy_predecessor_ndc='00000000001', requires_prior_auth=false)"
            - "Member M with NO claims for D_pred"
            - "FormularyEntry FE for D_step"
            - "Claim C in SUBMITTED, drug_id=D_step.id, channel=RETAIL_30, days_supply=30, quantity=1"
          trigger:
            - "POST /pbm/claims/{C.id}/adjudicate"
          assert:
            - "C.status == REJECTED"
            - "error_id surfaced == 'ERR_STEP_THERAPY_NOT_SATISFIED'"
            - "HTTP status == 422"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_adjudicate_blocked_by_member_status
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - validations[priority=5]
          - errors.ERR_MEMBER_NOT_ACTIVE
          - entities.Member.fields.enrollment_status
        distinguishing_aspect: |
          Entity pair: Claim <- Member. Claim.SUBMITTED -> ADJUDICATED requires Member.enrollment_status ==
          ACTIVE. Mutating Member to SUSPENDED blocks the transition on the Claim.
        test_recipe:
          setup:
            - "Member M in enrollment_status=ACTIVE, ytd_*=0"
            - "Drug D, Plan, FormularyEntry FE for D"
            - "Claim C in SUBMITTED for (M, D)"
          trigger:
            - "POST /pbm/members/{M.id}/suspend  # Member -> SUSPENDED"
            - "POST /pbm/claims/{C.id}/adjudicate"
          assert:
            - "Member.enrollment_status == SUSPENDED"
            - "C.status == REJECTED"
            - "error_id surfaced == 'ERR_MEMBER_NOT_ACTIVE'"

      - name: claim_adjudicate_blocked_by_prior_auth_state
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - state_machines.PriorAuthorization.SUBMITTED_to_DENIED
          - validations[priority=7]
          - errors.ERR_PA_DENIED
        distinguishing_aspect: |
          Entity pair: Claim <- PriorAuthorization (different from Claim <- Member in instance 1). Claim
          transition depends on referenced PA being APPROVED; if PA is DENIED, claim is REJECTED.
        test_recipe:
          setup:
            - "Drug D(requires_prior_auth=true)"
            - "PriorAuthorization PA in SUBMITTED"
            - "Claim C in SUBMITTED referencing PA"
          trigger:
            - "POST /pbm/prior-authorizations/{PA.id}/deny  # PA -> DENIED"
            - "POST /pbm/claims/{C.id}/adjudicate"
          assert:
            - "PA.status == DENIED"
            - "C.status == REJECTED"
            - "error_id surfaced == 'ERR_PA_DENIED'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: refill_too_soon_half_open_day_granularity_on_member_drug_pair
        grounds:
          - calculations.refill_too_soon_check
          - calculations.refill_too_soon_check.constants.INTERVAL_SEMANTICS
          - errors.ERR_REFILL_TOO_SOON
        distinguishing_aspect: |
          Resource: (Member, Drug) supply window. Interval semantics: HALF-OPEN [start, start+days_supply)
          at DAY granularity. Adjacency at exact day boundary (start_c == end_x) is allowed.
        test_recipe:
          setup:
            - "Member M, Drug D, Plan, FormularyEntry FE for D"
            - "Claim C1 in ADJUDICATED for (M, D) at clock T=0, days_supply=30"
            - "Claim C2 in SUBMITTED for (M, D), days_supply=30"
            - "Claim C3 in SUBMITTED for (M, D), days_supply=30"
          trigger:
            - "POST /_clock/advance body={seconds:29*24*3600}  # T=29d, overlaps [0,30) at instant 29..30"
            - "POST /pbm/claims/{C2.id}/adjudicate              # REJECTED (overlap)"
            - "POST /_clock/advance body={seconds:1*24*3600}    # T=30d, [30,60) is adjacent — NO overlap"
            - "POST /pbm/claims/{C3.id}/adjudicate              # ACCEPTED"
          assert:
            - "C2.status == REJECTED"
            - "C2 error_id surfaced == 'ERR_REFILL_TOO_SOON'"
            - "C3.status == ADJUDICATED  # adjacency boundary allowed"

      - name: pa_effective_window_closed_open_second_granularity_on_pa_resource
        grounds:
          - calculations.pa_effective_window_check
          - calculations.pa_effective_window_check.constants.INTERVAL_SEMANTICS
          - errors.ERR_PA_EXPIRED
        distinguishing_aspect: |
          Resource: PriorAuthorization effective window (DIFFERENT from Member-Drug supply window).
          Interval semantics: closed-left, OPEN-right point-in-interval at SECOND granularity. The
          arithmetic is "point inside interval", structurally different from instance 1's "interval-vs-
          interval overlap" arithmetic.
        test_recipe:
          setup:
            - "Drug D(requires_prior_auth=true)"
            - "PriorAuthorization PA in APPROVED, effective_start=now, effective_end=now+180d"
            - "Claim Cstart in SUBMITTED referencing PA"
            - "Claim Cend   in SUBMITTED referencing PA"
          trigger:
            - "POST /pbm/claims/{Cstart.id}/adjudicate    # at clock_now == effective_start — ACCEPTED (closed-left)"
            - "POST /_clock/advance body={seconds:15552000}  # exactly effective_end"
            - "POST /pbm/claims/{Cend.id}/adjudicate       # at clock_now == effective_end — REJECTED (open-right)"
          assert:
            - "Cstart.status == ADJUDICATED"
            - "Cend.status == REJECTED"
            - "Cend error_id surfaced == 'ERR_PA_EXPIRED'"
            - "PA.status == EXPIRED after the second clock advance"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rebate_ledger_zero_sum_after_clawback_within_window
        grounds:
          - state_machines.Claim.ADJUDICATED_to_PAID
          - state_machines.Claim.PAID_to_REVERSED
          - calculations.rebate_accrual
          - calculations.rebate_final_after_clawback
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: cumulative ledger amount per claim, i.e.,
          sum(LedgerEntry.amount_cents WHERE claim_id == X) MUST equal 0 after a PAY/REVERSE round-trip
          inside the clawback window. Quantity type: rebate-dollars in the PBM ledger.
        test_recipe:
          setup:
            - "Plan(deductible_cents=0, oop_max_cents=200000, coinsurance_rate=0.20)"
            - "Drug D(unit_allowed_cents=5000)"
            - "FormularyEntry FE(plan=Plan, drug=D, tier=1, copay_cents=1000, status=ACTIVE)"
            - "Member M, RebateAgreement RA(drug_id=D.id, rebate_rate=0.15, clawback_window_days=90, status=ACTIVE)"
          trigger:
            - "POST /pbm/claims body={member_id:M.id, drug_id:D.id, channel:MAIL_ORDER_90, days_supply:90, quantity:10}"
            - "POST /pbm/claims/{claim.id}/adjudicate"
            - "POST /pbm/claims/{claim.id}/pay"
            - "POST /pbm/claims/{claim.id}/reverse"
          assert:
            - "LedgerEntry rows for claim.id contain exactly one REBATE_ACCRUED with amount_cents == 6600"
            - "LedgerEntry rows for claim.id contain exactly one REBATE_CLAWBACK with amount_cents == -6600"
            - "sum(LedgerEntry.amount_cents WHERE claim_id == claim.id) == 0"

      - name: member_ytd_zero_drift_after_adjudicate_reverse_round_trip
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - state_machines.Claim.PAID_to_REVERSED
          - entities.Member.fields.ytd_deductible_paid_cents
          - entities.Member.fields.ytd_oop_paid_cents
        distinguishing_aspect: |
          Conserved quantity: Member YTD counters. A full ADJUDICATE -> PAY -> REVERSE round-trip on a
          single claim MUST leave Member.ytd_deductible_paid_cents and Member.ytd_oop_paid_cents unchanged
          from their pre-ADJUDICATE values. DIFFERENT type of conserved quantity (member-account counters)
          from instance 1's ledger-rebate quantity.
        test_recipe:
          setup:
            - "Plan(deductible_cents=50000, oop_max_cents=200000, coinsurance_rate=0.20)"
            - "Drug D(unit_allowed_cents=10000)"
            - "FormularyEntry FE(plan=Plan, drug=D, tier=3, copay_cents=0, status=ACTIVE)"
            - "Member M(plan_id=Plan.id, ytd_deductible_paid_cents=0, ytd_oop_paid_cents=0, enrollment_status=ACTIVE)"
          trigger:
            - "POST /pbm/claims body={member_id:M.id, drug_id:D.id, channel:RETAIL_30, days_supply:30, quantity:30}"
            - "POST /pbm/claims/{claim.id}/adjudicate  # ytd_ded -> 50000, ytd_oop -> 100000"
            - "POST /pbm/claims/{claim.id}/pay"
            - "POST /pbm/claims/{claim.id}/reverse     # ytd_ded -> 0,    ytd_oop -> 0"
          assert:
            - "after adjudicate: Member.ytd_deductible_paid_cents == 50000"
            - "after adjudicate: Member.ytd_oop_paid_cents == 100000"
            - "after reverse:    Member.ytd_deductible_paid_cents == 0"
            - "after reverse:    Member.ytd_oop_paid_cents == 0"
