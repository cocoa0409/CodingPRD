            - "GET /ria/asset-transfers/${tx_id}/lots returns TransferLot.${lot_id} with basis_confidence_grade HIGH"
            - "TransferLot.${lot_id}.basis_appraisal_cents == 90000000"
            - "TransferLot.${lot_id}.suspected_double_basis == false"
            - "AssetTransfer.${tx_id}.cost_basis_complete == true"

      - name: asset_transfer_reject_discards_lots_and_rebases_household
        claim_type: Compensation
        grounds:
          - state_machines.AssetTransfer.BASIS_REVIEW_to_REJECTED
          - state_machines.TransferLot.STAMPED_to_DISCARDED
          - calculations.household_fee_basis
        distinguishing_aspect: "Rejecting an incomplete basis package compensates the earlier market-value credit: the lots are discarded, basis_appraisal_cents returns to null and the household fee basis falls back to its pre-transfer value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with executed agreement, granted TRADING_AUTHORIZATION, one OPEN account in BASIS_REVIEW state with two lots, one of which has no sent basis."
