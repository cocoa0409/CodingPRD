        grounds: [entities.BudgetLine.fields.forecast_variant, calculations.calc_budget_forecast]
        distinguishing_aspect: "Ops sweep at a clock beyond FY end flips forecast_variant PROVISIONAL->FINAL and recomputes forecast_cents under the final variant."
        test_recipe:
          setup: ["Budget line FY2026 (Jul 2025-Jun 2026); clock at 2026-07-15 (past FY end)"]
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2025-08-01T00:00:00Z" }
              as: ProgramAdmin
