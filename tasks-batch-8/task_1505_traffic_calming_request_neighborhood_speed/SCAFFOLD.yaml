# =============================================================================
# SCAFFOLD.yaml — Traffic Calming Request & Neighborhood Speed Study
# City traffic engineering division program management.
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Traffic Calming Request & Neighborhood Speed Study (city traffic engineering division): resident petition & threshold for study initiation, speed/volume data collection & criteria scoring, ranking against citywide list & budget cycle, treatment selection (speed hump/chicane/signage) & engineering approval, neighborhood balloting/consent requirement, installation scheduling & emergency-response review, post-installation effectiveness study, removal request process

domain_name: traffic-calming
api_prefix: /api

# Step 0: Complexity Profile
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StreetSegment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Street segment display name, e.g. 'Maple Ave between 3rd and 5th'" }
      - { name: speed_limit_mph, type: integer, source: input, description: "Posted speed limit in mph; must be >= 15" }
      - { name: household_count, type: integer, source: input, description: "Number of households fronting the segment; must be >= 1" }
      - { name: functional_class, type: enum, source: input, description: "Functional classification", constraints: "LOCAL | COLLECTOR | ARTERIAL" }
      - { name: emergency_route, type: boolean, source: input, default: false, description: "True when the segment is a designated emergency response route" }
      - { name: crash_count_3yr, type: integer, source: input, default: 0, description: "Reported crashes on the segment in the trailing 3 years; >= 0" }
      - { name: pedestrian_generator_count, type: integer, source: input, default: 0, description: "Count of pedestrian generators (schools, parks, transit stops) adjacent to the segment; >= 0" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Resident email; unique across all residents" }
      - { name: street_segment_id, type: string, source: input, description: "FK -> StreetSegment.id; the segment where the resident's household fronts" }
      - { name: household_ref, type: string, source: input, description: "Household identifier (e.g. street address) used to enforce one-signature-per-household; unique within the resident's segment" }

  - name: TrafficCalmingRequest
    parent: null
    common_fields: true
    fields:
      - { name: street_segment_id, type: string, source: input, description: "FK -> StreetSegment.id; segment the request concerns" }
      - { name: created_by_resident_id, type: string, source: system, description: "FK -> Resident.id; taken from X-User-ID at creation" }
      - { name: title, type: string, source: input, description: "Short request title" }
      - { name: requested_budget_cents, type: integer, source: input, description: "Planning-level budget ask in integer cents; > 0; used for provisional allocation until an approved plan re-baselines it" }
      - { name: status, type: enum, source: system, description: "Workflow stage", constraints: "SUBMITTED | PETITION_OPEN | PETITION_MET | PETITION_FAILED | STUDY_IN_PROGRESS | RANKING_ELIGIBLE | SCORE_INELIGIBLE | FUNDED | WAITLISTED | DESIGN_IN_PROGRESS | BALLOT_READY | BALLOT_OPEN | CONSENT_GRANTED | CONSENT_DENIED | INSTALLATION_PLANNED | INSTALLED | POST_STUDY_IN_PROGRESS | EFFECTIVENESS_CERTIFIED | REMOVAL_REVIEW | REMOVED" }
      - { name: petition_opened_at, type: datetime, source: system, description: "Logical-clock timestamp when the petition was opened; null until opened" }
      - { name: petition_deadline_at, type: datetime, source: system, description: "= petition_opened_at + 90 days; signatures accepted only while now <= petition_deadline_at" }
      - { name: required_signatures, type: integer, source: computed, description: "= ceil(segment.household_count * 0.60), snapshotted when the petition is opened" }
      - { name: signature_count, type: integer, source: computed, description: "Count of live (non-retracted) PetitionSignature rows for this request" }
      - { name: certified_score, type: integer, source: computed, description: "Criteria score snapshotted from the CERTIFIED initial SpeedStudy; null until certified" }
      - { name: funding_cycle_id, type: string, source: system, description: "FK -> FundingCycle.id; set when the request is FUNDED by a cycle publication; null otherwise; cleared back to null if consent is denied" }
      - { name: citywide_rank, type: integer, source: computed, description: "Rank assigned at ranking publication; 1-based; null until published" }
      - { name: allocated_cents, type: integer, source: computed, description: "Provisional allocation at publication (= requested_budget_cents + contingency), re-baselined to the approved plan's final allocation at plan approval; 0 when not funded" }
      - { name: installed_at, type: datetime, source: system, description: "Logical-clock timestamp stamped when the installation work order is marked installed; null until then" }

  - name: PetitionSignature
    parent: null
    common_fields: false
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> TrafficCalmingRequest.id; from the creation path" }
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id; taken from X-User-ID" }
      - { name: household_ref, type: string, source: system, description: "Copied from the signing resident's profile at creation" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of signature creation" }

  - name: SpeedStudy
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> TrafficCalmingRequest.id; from the creation path" }
      - { name: study_type, type: enum, source: input, description: "INITIAL (pre-treatment eligibility study) | POST_INSTALLATION (effectiveness study)", constraints: "INITIAL | POST_INSTALLATION" }
      - { name: window_start_date, type: string, source: input, description: "First collection date, ISO date YYYY-MM-DD" }
      - { name: window_end_date, type: string, source: input, description: "Last collection date, ISO date YYYY-MM-DD; must be >= window_start_date" }
      - { name: status, type: enum, source: system, description: "Study lifecycle", constraints: "COLLECTING | ANALYZED | CERTIFIED" }
      - { name: observation_count, type: integer, source: computed, description: "Count of all StudyObservation rows for this study" }
      - { name: valid_observation_count, type: integer, source: computed, description: "Count of StudyObservation rows with is_valid == true" }
      - { name: provisional_p85_mph, type: number, source: computed, description: "round_half_up(mean of p85_speed_mph over ALL observations, 1 dp); computed at analyze; null before" }
      - { name: provisional_mean_speed_mph, type: number, source: computed, description: "round_half_up(mean of mean_speed_mph over ALL observations, 1 dp); null before analyze" }
      - { name: provisional_avg_daily_volume, type: integer, source: computed, description: "round_half_up(mean of vehicle_count over ALL observations, 0 dp); null before analyze" }
      - { name: provisional_score, type: integer, source: computed, description: "criteria_score computed from provisional aggregates (ALL observations); null before analyze; recomputed on every analyze" }
      - { name: certified_p85_mph, type: number, source: computed, description: "round_half_up(mean of p85_speed_mph over observations with is_valid == true, 1 dp); set at certify" }
      - { name: certified_mean_speed_mph, type: number, source: computed, description: "round_half_up(mean of mean_speed_mph over valid observations, 1 dp); set at certify" }
      - { name: certified_avg_daily_volume, type: integer, source: computed, description: "round_half_up(mean of vehicle_count over valid observations, 0 dp); set at certify" }
      - { name: certified_score, type: integer, source: computed, description: "criteria_score computed from certified aggregates (valid observations only); set at certify" }
      - { name: baseline_p85_mph, type: number, source: system, description: "POST_INSTALLATION only: certified_p85_mph of the request's CERTIFIED INITIAL study, snapshotted at creation; null for INITIAL" }
      - { name: baseline_mean_speed_mph, type: number, source: system, description: "POST_INSTALLATION only: certified_mean_speed_mph of the CERTIFIED INITIAL study; null for INITIAL" }
      - { name: p85_reduction_mph, type: number, source: computed, description: "POST_INSTALLATION only: round_half_up(baseline_p85_mph - certified_p85_mph, 1 dp) at certify; null otherwise" }
      - { name: mean_reduction_mph, type: number, source: computed, description: "POST_INSTALLATION only: round_half_up(baseline_mean_speed_mph - certified_mean_speed_mph, 1 dp) at certify; null otherwise" }
      - { name: meets_effectiveness_target, type: boolean, source: computed, description: "POST_INSTALLATION only, official verdict: p85_reduction_mph >= 3.0; null otherwise" }
      - { name: meets_target_mean_variant, type: boolean, source: computed, description: "POST_INSTALLATION only, advisory variant verdict: mean_reduction_mph >= 2.0; null otherwise" }

  - name: StudyObservation
    parent: null
    common_fields: false
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> SpeedStudy.id; from the creation path" }
      - { name: observation_date, type: string, source: input, description: "ISO date of the observation; unique within the study; must lie inside [window_start_date, window_end_date] inclusive" }
      - { name: vehicle_count, type: integer, source: input, description: "Vehicles counted that day; >= 0" }
      - { name: p85_speed_mph, type: number, source: input, description: "85th-percentile speed that day in mph; > 0" }
      - { name: mean_speed_mph, type: number, source: input, description: "Mean speed that day in mph; > 0" }
      - { name: is_valid, type: boolean, source: input, default: true, description: "False marks the day as an excluded outlier (holiday, road works); excluded from certified aggregates" }

  - name: FundingCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_year, type: integer, source: input, description: "Budget cycle year; unique across all cycles" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total program budget for the cycle in integer cents; > 0" }
      - { name: budget_committed_cents, type: integer, source: computed, description: "Sum of allocated_cents over all requests currently FUNDED under this cycle; starts 0" }
      - { name: budget_available_cents, type: integer, source: computed, description: "= budget_total_cents - budget_committed_cents (invariant)" }
      - { name: status, type: enum, source: system, description: "Cycle lifecycle", constraints: "OPEN | RANKING_PUBLISHED | CLOSED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent ranking publication; null until first publish" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> TrafficCalmingRequest.id; from the creation path" }
      - { name: treatment_type, type: enum, source: input, description: "Selected treatment", constraints: "SPEED_HUMP | CHICANE | SIGNAGE" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Engineer's cost estimate in integer cents; > 0" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the TrafficEngineer who created the plan; used for segregation-of-duties at approval" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", constraints: "DRAFT | SUBMITTED_FOR_REVIEW | REVISION_REQUESTED | APPROVED | LOCKED | WITHDRAWN" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving CityEngineer; null until approved" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent submit-for-review; null until submitted" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of approval; null until approved" }

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> TrafficCalmingRequest.id; from the creation path" }
      - { name: treatment_plan_id, type: string, source: system, description: "FK -> TreatmentPlan.id; the request's APPROVED plan at ballot creation (exactly one APPROVED plan can exist per request)" }
      - { name: close_date, type: string, source: input, description: "ISO datetime; votes accepted only while logical now <= close_date; the clock sweep tallies the ballot once now > close_date" }
      - { name: eligible_households, type: integer, source: system, description: "Snapshot of segment.household_count at ballot creation" }
      - { name: quorum_required, type: integer, source: computed, description: "= ceil(eligible_households * 0.25)" }
      - { name: votes_received, type: integer, source: computed, description: "Count of BallotVote rows for this ballot" }
      - { name: votes_for, type: integer, source: computed, description: "Count of BallotVote rows with choice == FOR" }
      - { name: votes_against, type: integer, source: computed, description: "Count of BallotVote rows with choice == AGAINST" }
      - { name: status, type: enum, source: system, description: "Ballot lifecycle", constraints: "OPEN | TALLIED" }
      - { name: outcome, type: enum, source: computed, description: "Null until tallied; then CONSENT_GRANTED | CONSENT_DENIED", constraints: "CONSENT_GRANTED | CONSENT_DENIED | null" }

  - name: BallotVote
    parent: null
    common_fields: false
    fields:
      - { name: ballot_id, type: string, source: system, description: "FK -> Ballot.id; from the creation path" }
      - { name: resident_id, type: string, source: system, description: "FK -> Resident.id; taken from X-User-ID" }
      - { name: household_ref, type: string, source: system, description: "Copied from the voting resident's profile at creation" }
      - { name: choice, type: enum, source: input, description: "Vote choice", constraints: "FOR | AGAINST" }
      - { name: cast_at, type: datetime, source: system, description: "Logical-clock timestamp of the vote" }

  - name: InstallationWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> TrafficCalmingRequest.id; from the creation path" }
      - { name: crew_ref, type: string, source: input, description: "Identifier of the installation crew; crew-level schedule conflicts are enforced on this value" }
      - { name: scheduled_date, type: string, source: system, description: "ISO date set by the schedule action; null until scheduled" }
      - { name: duration_days, type: integer, source: system, description: "Installation duration in whole days set by the schedule action; >= 1; null until scheduled" }
      - { name: schedule_status, type: enum, source: system, description: "Parallel dimension 1: UNSCHEDULED | SCHEDULED | INSTALLED", constraints: "UNSCHEDULED | SCHEDULED | INSTALLED" }
      - { name: emergency_review_status, type: enum, source: system, description: "Parallel dimension 2: PENDING_REVIEW | CLEARED | BLOCKED", constraints: "PENDING_REVIEW | CLEARED | BLOCKED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the EmergencyReviewer who last recorded a decision; null until first decision" }
      - { name: installed_at, type: datetime, source: system, description: "Logical-clock timestamp stamped by mark-installed; null until installed" }

  - name: RemovalRequest
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> TrafficCalmingRequest.id; from the creation path" }
      - { name: created_by_resident_id, type: string, source: system, description: "FK -> Resident.id; taken from X-User-ID at creation" }
      - { name: reason, type: string, source: input, description: "Free-text reason for the removal request" }
      - { name: status, type: enum, source: system, description: "Removal lifecycle", constraints: "PENDING_REVIEW | REMOVAL_GRANTED | REMOVAL_DENIED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding CityEngineer; null until decided" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrafficCalmingRequest
    initial_state: SUBMITTED
    terminal_states: [PETITION_FAILED, SCORE_INELIGIBLE, CONSENT_DENIED, REMOVED]
    transitions:
      - from: SUBMITTED
        to: PETITION_OPEN
        trigger: POST /api/requests/{reqId}/open-petition
        actor: TrafficEngineer
        preconditions:
          - "request.status == SUBMITTED (else ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "petition_opened_at := logical now; petition_deadline_at := now + 90 days"
          - "required_signatures := ceil(segment.household_count * 0.60) (snapshot)"
          - "signature_count := 0"
      - from: PETITION_OPEN
        to: PETITION_MET
        trigger: "system (automatic on POST /api/requests/{reqId}/petition-signatures when signature_count reaches required_signatures)"
        actor: system
        preconditions:
          - "signature_count >= required_signatures after the new signature is counted"
        side_effects: []
      - from: PETITION_OPEN
        to: PETITION_FAILED
        trigger: "system (automatic sweep inside POST /_clock/set_current_utc when logical now advances past petition_deadline_at and threshold unmet)"
        actor: system
        preconditions:
          - "logical now > petition_deadline_at AND signature_count < required_signatures"
        side_effects: []
      - from: PETITION_MET
        to: STUDY_IN_PROGRESS
        trigger: POST /api/requests/{reqId}/speed-studies with study_type = INITIAL
        actor: TrafficEngineer
        preconditions:
          - "request.status == PETITION_MET (else ERR_REQUEST_INVALID_STATE)"
          - "study window does not violate the 7-day buffered window rule against other studies on the same segment (else ERR_STUDY_WINDOW_CONFLICT)"
        side_effects:
          - "SpeedStudy created in COLLECTING"
      - from: STUDY_IN_PROGRESS
        to: RANKING_ELIGIBLE
        trigger: "system (automatic on initial SpeedStudy certification when certified_score >= 60)"
        actor: system
        preconditions: []
        side_effects:
          - "request.certified_score := study.certified_score"
      - from: STUDY_IN_PROGRESS
        to: SCORE_INELIGIBLE
        trigger: "system (automatic on initial SpeedStudy certification when certified_score < 60)"
        actor: system
        preconditions: []
        side_effects:
          - "request.certified_score := study.certified_score"
      - from: RANKING_ELIGIBLE
        to: FUNDED
        trigger: "system (during POST /api/funding-cycles/{cycleId}/publish-ranking waterfall when the request's rank fits the remaining budget)"
        actor: system
        preconditions:
          - "cycle.budget_available_cents >= allocated_cents for this request at its rank"
        side_effects:
          - "request.funding_cycle_id := cycle.id; citywide_rank assigned; allocated_cents := requested_budget_cents + round_half_up(requested_budget_cents * 0.075)"
          - "cycle.budget_committed_cents += allocated_cents; cycle.budget_available_cents -= allocated_cents"
      - from: RANKING_ELIGIBLE
        to: WAITLISTED
        trigger: "system (during publish-ranking waterfall when the request's rank does not fit, or a higher-ranked request already failed to fit — strict stop rule)"
        actor: system
        preconditions: []
        side_effects:
          - "citywide_rank assigned; allocated_cents := 0; funding_cycle_id stays null"
      - from: WAITLISTED
        to: RANKING_ELIGIBLE
        trigger: "system (automatic on POST /api/funding-cycles/{cycleId}/close)"
        actor: system
        preconditions: []
        side_effects:
          - "citywide_rank := null"
      - from: FUNDED
        to: DESIGN_IN_PROGRESS
        trigger: POST /api/requests/{reqId}/treatment-plans
        actor: TrafficEngineer
        preconditions:
          - "request.status in {FUNDED, DESIGN_IN_PROGRESS} (else ERR_REQUEST_INVALID_STATE)"
          - "expected_request_version == request.version (else ERR_STALE_VERSION)"
          - "treatment is permitted on the segment (else ERR_TREATMENT_PROHIBITED_ON_EMERGENCY_ROUTE)"
        side_effects:
          - "TreatmentPlan created in DRAFT; any existing DRAFT/SUBMITTED_FOR_REVIEW/REVISION_REQUESTED plan for the request -> WITHDRAWN (supersede)"
          - "request.version incremented by 1"
      - from: DESIGN_IN_PROGRESS
        to: DESIGN_IN_PROGRESS
        trigger: POST /api/requests/{reqId}/treatment-plans (subsequent plan; supersedes the existing draft-stage plan)
        actor: TrafficEngineer
        preconditions:
          - "request.status in {FUNDED, DESIGN_IN_PROGRESS} (else ERR_REQUEST_INVALID_STATE)"
          - "expected_request_version == request.version (else ERR_STALE_VERSION)"
          - "treatment is permitted on the segment (else ERR_TREATMENT_PROHIBITED_ON_EMERGENCY_ROUTE)"
        side_effects:
          - "TreatmentPlan created in DRAFT; the previous DRAFT/SUBMITTED_FOR_REVIEW/REVISION_REQUESTED plan -> WITHDRAWN"
          - "request.version incremented by 1"
      - from: DESIGN_IN_PROGRESS
        to: BALLOT_READY
        trigger: "system (automatic on POST /api/treatment-plans/{planId}/approve)"
        actor: system
        preconditions: []
        side_effects:
          - "FundingCycle re-baseline: final_alloc := plan.estimated_cost_cents + round_half_up(plan.estimated_cost_cents * 0.075); delta := final_alloc - request.allocated_cents; cycle.budget_committed_cents += delta; cycle.budget_available_cents -= delta; request.allocated_cents := final_alloc"
      - from: BALLOT_READY
        to: BALLOT_OPEN
        trigger: POST /api/requests/{reqId}/ballots
        actor: TrafficEngineer
        preconditions:
          - "request.status == BALLOT_READY (else ERR_REQUEST_INVALID_STATE; request leaves BALLOT_READY exactly once, so a second ballot is impossible)"
        side_effects:
          - "Ballot created in OPEN with treatment_plan_id := the request's APPROVED plan, eligible_households := segment.household_count, quorum_required := ceil(eligible_households * 0.25)"
          - "the APPROVED TreatmentPlan -> LOCKED"
      - from: BALLOT_OPEN
        to: CONSENT_GRANTED
        trigger: "system (automatic on POST /_clock/set_current_utc sweep when now > ballot.close_date and tally outcome is CONSENT_GRANTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BALLOT_OPEN
        to: CONSENT_DENIED
        trigger: "system (automatic on POST /_clock/set_current_utc sweep when now > ballot.close_date and tally outcome is CONSENT_DENIED)"
        actor: system
        preconditions: []
        side_effects:
          - "allocation released back to the cycle: cycle.budget_committed_cents -= request.allocated_cents; cycle.budget_available_cents += request.allocated_cents; request.allocated_cents := 0; request.funding_cycle_id := null; request.citywide_rank := null (compensating action for the FUNDED allocation)"
      - from: CONSENT_GRANTED
        to: INSTALLATION_PLANNED
        trigger: POST /api/requests/{reqId}/installation-work-orders
        actor: TrafficEngineer
        preconditions:
          - "request.status == CONSENT_GRANTED (else ERR_REQUEST_INVALID_STATE; request leaves CONSENT_GRANTED exactly once, so a second work order is impossible)"
        side_effects:
          - "InstallationWorkOrder created with schedule_status UNSCHEDULED, emergency_review_status PENDING_REVIEW"
      - from: INSTALLATION_PLANNED
        to: INSTALLED
        trigger: "system (automatic on POST /api/installation-work-orders/{woId}/mark-installed)"
        actor: system
        preconditions: []
        side_effects:
          - "request.installed_at := work order's installed_at"
      - from: INSTALLED
        to: POST_STUDY_IN_PROGRESS
        trigger: POST /api/requests/{reqId}/speed-studies with study_type = POST_INSTALLATION
        actor: TrafficEngineer
        preconditions:
          - "request.status == INSTALLED (else ERR_REQUEST_INVALID_STATE; request reaches INSTALLED only via mark-installed, so the work order's INSTALLED state is implied)"
          - "logical now >= installed_at + 30 days (else ERR_POST_STUDY_TOO_EARLY)"
        side_effects:
          - "SpeedStudy created in COLLECTING with baseline_p85_mph / baseline_mean_speed_mph snapshotted from the CERTIFIED INITIAL study"
      - from: POST_STUDY_IN_PROGRESS
        to: EFFECTIVENESS_CERTIFIED
        trigger: "system (automatic on POST_INSTALLATION SpeedStudy certification)"
        actor: system
        preconditions: []
        side_effects:
          - "effectiveness fields (p85_reduction_mph, mean_reduction_mph, meets_effectiveness_target, meets_target_mean_variant) computed on the study"
      - from: EFFECTIVENESS_CERTIFIED
        to: REMOVAL_REVIEW
        trigger: POST /api/requests/{reqId}/removal-requests
        actor: Resident
        preconditions:
          - "request.status == EFFECTIVENESS_CERTIFIED (else ERR_REQUEST_INVALID_STATE; request leaves REMOVAL_REVIEW only by decision, so a second removal filing while one is pending is rejected by this state gate)"
          - "logical now >= installed_at + 365 days (else ERR_REMOVAL_MIN_AGE_NOT_MET)"
        side_effects:
          - "RemovalRequest created in PENDING_REVIEW"
      - from: REMOVAL_REVIEW
        to: REMOVED
        trigger: "system (automatic on POST /api/removal-requests/{remId}/approve)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REMOVAL_REVIEW
        to: EFFECTIVENESS_CERTIFIED
        trigger: "system (automatic on POST /api/removal-requests/{remId}/reject)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SpeedStudy
    initial_state: COLLECTING
    terminal_states: [CERTIFIED]
    transitions:
      - from: COLLECTING
        to: ANALYZED
        trigger: POST /api/speed-studies/{studyId}/analyze
        actor: TrafficEngineer
        preconditions:
          - "study.status == COLLECTING (else ERR_STUDY_INVALID_STATE)"
          - "observation_count >= 3 (else ERR_INSUFFICIENT_OBSERVATION_DAYS)"
        side_effects:
          - "provisional aggregates (provisional_p85_mph, provisional_mean_speed_mph, provisional_avg_daily_volume) recomputed over ALL observations"
          - "provisional_score := criteria_score(provisional aggregates, segment)"
      - from: ANALYZED
        to: COLLECTING
        trigger: POST /api/speed-studies/{studyId}/return-for-recollection
        actor: TrafficEngineer
        preconditions:
          - "study.status == ANALYZED (else ERR_STUDY_INVALID_STATE)"
        side_effects:
          - "further observations may be added; a later analyze recomputes provisional aggregates"
      - from: ANALYZED
        to: CERTIFIED
        trigger: POST /api/speed-studies/{studyId}/certify
        actor: TrafficEngineer
        preconditions:
          - "study.status == ANALYZED (else ERR_STUDY_INVALID_STATE)"
          - "valid_observation_count >= 3 (else ERR_INSUFFICIENT_OBSERVATION_DAYS)"
        side_effects:
          - "certified aggregates computed over valid observations only; certified_score := criteria_score(certified aggregates, segment)"
          - "INITIAL study: request STUDY_IN_PROGRESS -> RANKING_ELIGIBLE (certified_score >= 60) or -> SCORE_INELIGIBLE (< 60); request.certified_score := certified_score"
          - "POST_INSTALLATION study: effectiveness fields computed; request POST_STUDY_IN_PROGRESS -> EFFECTIVENESS_CERTIFIED"

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [LOCKED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED_FOR_REVIEW
        trigger: POST /api/treatment-plans/{planId}/submit-for-review
        actor: TrafficEngineer
        preconditions:
          - "plan.status == DRAFT (else ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "submitted_at := logical now"
      - from: SUBMITTED_FOR_REVIEW
        to: APPROVED
        trigger: POST /api/treatment-plans/{planId}/approve
        actor: CityEngineer
        preconditions:
          - "plan.status == SUBMITTED_FOR_REVIEW (else ERR_PLAN_INVALID_STATE)"
          - "approver X-User-ID != plan.created_by_user_id (segregation of duties; else ERR_APPROVER_IS_PLAN_AUTHOR)"
          - "budget re-baseline must fit: cycle.budget_available_cents >= final_alloc - request.allocated_cents (else ERR_REBASELINE_EXCEEDS_BUDGET)"
        side_effects:
          - "approved_at := logical now; approved_by_user_id := X-User-ID"
          - "request DESIGN_IN_PROGRESS -> BALLOT_READY (link 2 of the approval cascade)"
          - "request reaching BALLOT_READY triggers the FundingCycle re-baseline (link 3): delta := final_alloc - allocated_cents; cycle.budget_committed_cents += delta; cycle.budget_available_cents -= delta; request.allocated_cents := final_alloc"
      - from: SUBMITTED_FOR_REVIEW
        to: REVISION_REQUESTED
        trigger: POST /api/treatment-plans/{planId}/request-revision
        actor: CityEngineer
        preconditions:
          - "plan.status == SUBMITTED_FOR_REVIEW (else ERR_PLAN_INVALID_STATE)"
          - "reviewer X-User-ID != plan.created_by_user_id (segregation of duties; else ERR_APPROVER_IS_PLAN_AUTHOR)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "system (automatic immediately after request-revision; the plan returns to DRAFT for editing, forming the revision cycle)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: LOCKED
        trigger: "system (automatic on POST /api/requests/{reqId}/ballots creation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (superseded by POST /api/requests/{reqId}/treatment-plans creating a newer plan)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED_FOR_REVIEW
        to: WITHDRAWN
        trigger: "system (superseded by a newer plan creation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "system (superseded by a newer plan creation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Ballot
    initial_state: OPEN
    terminal_states: [TALLIED]
    transitions:
      - from: OPEN
        to: TALLIED
        trigger: "system (automatic sweep inside POST /_clock/set_current_utc once logical now > close_date)"
        actor: system
        preconditions:
          - "logical now > close_date"
        side_effects:
          - "tally: votes_received / votes_for / votes_against computed from BallotVote rows"
          - "outcome := CONSENT_GRANTED iff votes_received >= quorum_required AND 100 * votes_for >= 60 * votes_received; else CONSENT_DENIED"
          - "outcome CONSENT_GRANTED -> request BALLOT_OPEN -> CONSENT_GRANTED (branch A)"
          - "outcome CONSENT_DENIED -> request BALLOT_OPEN -> CONSENT_DENIED with allocation released back to the FundingCycle (branch B, compensation)"

  - entity: InstallationWorkOrder
    initial_state: UNSCHEDULED (schedule_status) / PENDING_REVIEW (emergency_review_status)
    terminal_states: [INSTALLED (schedule_status)]
    transitions:
      - from: UNSCHEDULED
        to: SCHEDULED
        trigger: POST /api/installation-work-orders/{woId}/schedule
        actor: TrafficEngineer
        preconditions:
          - "schedule_status == UNSCHEDULED (else ERR_WORK_ORDER_INVALID_STATE)"
          - "emergency_review_status != BLOCKED (else ERR_EMERGENCY_REVIEW_BLOCKED)"
          - "scheduled_date >= logical today (else ERR_SCHEDULE_DATE_IN_PAST)"
          - "no other SCHEDULED work order for the same crew_ref overlaps the half-open interval [scheduled_date, scheduled_date + duration_days) (else ERR_CREW_SCHEDULE_CONFLICT)"
        side_effects:
          - "scheduled_date and duration_days stamped"
      - from: PENDING_REVIEW
        to: CLEARED
        trigger: POST /api/installation-work-orders/{woId}/emergency-review with decision = CLEARED
        actor: EmergencyReviewer
        preconditions:
          - "emergency_review_status in {PENDING_REVIEW, BLOCKED} (else ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: PENDING_REVIEW
        to: BLOCKED
        trigger: POST /api/installation-work-orders/{woId}/emergency-review with decision = BLOCKED
        actor: EmergencyReviewer
        preconditions:
          - "emergency_review_status in {PENDING_REVIEW, BLOCKED} (else ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "if schedule_status == SCHEDULED: schedule_status -> UNSCHEDULED and scheduled_date/duration_days cleared (blocked installations are pulled from the schedule)"
      - from: BLOCKED
        to: CLEARED
        trigger: POST /api/installation-work-orders/{woId}/emergency-review with decision = CLEARED (re-review)
        actor: EmergencyReviewer
        preconditions:
          - "emergency_review_status in {PENDING_REVIEW, BLOCKED} (else ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: SCHEDULED
        to: INSTALLED
        trigger: POST /api/installation-work-orders/{woId}/mark-installed
        actor: TrafficEngineer
        preconditions:
          - "schedule_status == SCHEDULED (else ERR_WORK_ORDER_INVALID_STATE)"
          - "emergency_review_status == CLEARED (else ERR_EMERGENCY_REVIEW_NOT_CLEARED)"
          - "logical now >= scheduled_date 00:00:00Z (else ERR_INSTALLATION_DATE_NOT_REACHED)"
        side_effects:
          - "installed_at := logical now (link 1 of the installation cascade)"
          - "request INSTALLATION_PLANNED -> INSTALLED with request.installed_at := installed_at (link 2, bubble-up)"

  - entity: FundingCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RANKING_PUBLISHED
        trigger: POST /api/funding-cycles/{cycleId}/publish-ranking
        actor: CityAdmin
        preconditions:
          - "cycle.status in {OPEN, RANKING_PUBLISHED} (else ERR_CYCLE_INVALID_STATE)"
          - "expected_funding_cycle_version == cycle.version (else ERR_STALE_VERSION)"
          - "at least one request in RANKING_ELIGIBLE exists citywide (else ERR_NO_ELIGIBLE_REQUESTS)"
        side_effects:
          - "recompute the full citywide ranking: eligible set = all requests with status == RANKING_ELIGIBLE; sort certified_score DESC, tie-break segment.crash_count_3yr DESC, then request.created_at ASC; assign citywide_rank 1..N"
          - "strict-stop waterfall: walk ranks ascending; allocated := requested_budget_cents + round_half_up(requested_budget_cents * 0.075); if budget_available_cents >= allocated -> FUNDED (committed += allocated, available -= allocated, funding_cycle_id := cycle.id); else this request and ALL lower ranks -> WAITLISTED (allocated_cents 0, funding_cycle_id null)"
          - "published_at := logical now; cycle.version incremented by 1"
      - from: RANKING_PUBLISHED
        to: RANKING_PUBLISHED
        trigger: POST /api/funding-cycles/{cycleId}/publish-ranking (re-publication supersedes the prior ranking)
        actor: CityAdmin
        preconditions:
          - "cycle.status in {OPEN, RANKING_PUBLISHED} (else ERR_CYCLE_INVALID_STATE)"
          - "expected_funding_cycle_version == cycle.version (else ERR_STALE_VERSION)"
          - "the re-ranking pool is non-empty: requests in RANKING_ELIGIBLE citywide PLUS this cycle's WAITLISTED requests (else ERR_NO_ELIGIBLE_REQUESTS)"
        side_effects:
          - "previously WAITLISTED requests of this cycle return to the pool for re-ranking; previously FUNDED requests keep their allocation and are excluded from re-ranking"
          - "same ranking + waterfall side effects as OPEN -> RANKING_PUBLISHED"
          - "cycle.version incremented by 1"
      - from: RANKING_PUBLISHED
        to: CLOSED
        trigger: POST /api/funding-cycles/{cycleId}/close
        actor: CityAdmin
        preconditions:
          - "cycle.status == RANKING_PUBLISHED (else ERR_CYCLE_INVALID_STATE)"
        side_effects:
          - "all WAITLISTED requests -> RANKING_ELIGIBLE with citywide_rank cleared (cycle-back loop)"
          - "FUNDED requests keep their allocation"

  - entity: RemovalRequest
    initial_state: PENDING_REVIEW
    terminal_states: [REMOVAL_GRANTED, REMOVAL_DENIED]
    transitions:
      - from: PENDING_REVIEW
        to: REMOVAL_GRANTED
        trigger: POST /api/removal-requests/{remId}/approve
        actor: CityEngineer
        preconditions:
          - "removal.status == PENDING_REVIEW (else ERR_REMOVAL_INVALID_STATE)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
          - "request REMOVAL_REVIEW -> REMOVED"
      - from: PENDING_REVIEW
        to: REMOVAL_DENIED
        trigger: POST /api/removal-requests/{remId}/reject
        actor: CityEngineer
        preconditions:
          - "removal.status == PENDING_REVIEW (else ERR_REMOVAL_INVALID_STATE)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
          - "request REMOVAL_REVIEW -> EFFECTIVENESS_CERTIFIED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-request
    parent_entity: TrafficCalmingRequest
    write_endpoint: "POST /api/requests/{reqId}/treatment-plans"
    occ_field: expected_request_version
    description: |
      Creating a TreatmentPlan against a TrafficCalmingRequest whose version has
      advanced since the client last observed it is rejected. A successful plan
      creation legitimately supersedes any existing draft-stage plan (WITHDRAWN)
      and bumps the request version, so a second creation carrying a stale
      observed version is working from an outdated view of the request.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ranking-publish-stale-cycle
    parent_entity: FundingCycle
    write_endpoint: "POST /api/funding-cycles/{cycleId}/publish-ranking"
    occ_field: expected_funding_cycle_version
    description: |
      Publishing (or re-publishing) a FundingCycle ranking against a cycle whose
      version has advanced since the client last observed it is rejected. A
      successful publication re-ranks the citywide list, re-runs the allocation
      waterfall, and bumps the cycle version, so a stale-version publication is
      working from an outdated view of the cycle.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: petition_threshold
    trigger: "request open-petition (snapshot) and every petition-signature creation (evaluation)"
    algorithm: threshold
    formula: |
      required_signatures = ceil(segment.household_count * PETITION_RATIO)
      threshold met iff signature_count >= required_signatures
    input_set: "segment = the request's StreetSegment; signature_count = live PetitionSignature rows for the request"
    constants:
      PETITION_RATIO: 0.60
    precision: "integer; ceil applied to the exact product"
    variants:
      - name: exact_boundary_inclusive
        when: "signature_count == required_signatures"
        difference: "boundary is inclusive: count exactly equal to required_signatures flips the request to PETITION_MET"

  - name: study_aggregation
    trigger: "analyze (provisional) and certify (certified)"
    algorithm: aggregation
    formula: |
      over the input set S of observations:
        p85  = round_half_up(sum(o.p85_speed_mph  for o in S) / |S|, 1)
        mean = round_half_up(sum(o.mean_speed_mph for o in S) / |S|, 1)
        adv  = round_half_up(sum(o.vehicle_count  for o in S) / |S|, 0)   # integer
    input_set: "provisional variant: ALL StudyObservation rows of the study; certified variant: only rows with is_valid == true"
    precision: "1 decimal place for speeds, 0 for volume; round_half_up"
    variants:
      - name: provisional
        when: "computed by POST /api/speed-studies/{studyId}/analyze"
        difference: "input set includes invalid (outlier) observations, so provisional aggregates and provisional_score can diverge from certified values for identical submitted data"
      - name: certified
        when: "computed by POST /api/speed-studies/{studyId}/certify"
        difference: "input set excludes is_valid == false rows"

  - name: criteria_score
    trigger: "analyze (provisional_score) and certify (certified_score)"
    algorithm: weighted_scoring
    formula: |
      speed_excess = max(0, p85 - segment.speed_limit_mph)
      speed_points:  excess >= 10 -> 40 | >= 7 -> 30 | >= 4 -> 20 | >= 1 -> 10 | else 0
      volume_points: adv >= 3000 -> 20 | >= 2000 -> 15 | >= 1000 -> 10 | else 0
      crash_points = min(3, segment.crash_count_3yr) * 5
      pedestrian_points = min(2, segment.pedestrian_generator_count) * 10
      total_score = min(100, speed_points + volume_points + crash_points + pedestrian_points)
    input_set: "p85/adv from the active study_aggregation variant; crash_count_3yr and pedestrian_generator_count from the request's StreetSegment"
    constants:
      SCORE_ELIGIBILITY_THRESHOLD: 60
      SCORE_CAP: 100
    precision: "integer points"
    variants:
      - name: provisional
        when: "analyze"
        difference: "uses provisional_p85_mph / provisional_avg_daily_volume (all observations)"
      - name: certified
        when: "certify"
        difference: "uses certified_p85_mph / certified_avg_daily_volume (valid observations only); drives the RANKING_ELIGIBLE vs SCORE_INELIGIBLE fork at the 60-point inclusive boundary (>= 60 eligible)"

  - name: citywide_ranking_waterfall
    trigger: "POST /api/funding-cycles/{cycleId}/publish-ranking"
    algorithm: waterfall_allocation
    formula: |
      eligible = [r for r in TrafficCalmingRequest if r.status == RANKING_ELIGIBLE]
      sort eligible by: certified_score DESC, segment.crash_count_3yr DESC, r.created_at ASC
      assign citywide_rank = 1..N in sorted order
      for each request in rank order:
        contingency_cents = round_half_up(request.requested_budget_cents * CONTINGENCY_RATE)   # per-request integer cents, rounded BEFORE summing (pinned order)
        allocated = request.requested_budget_cents + contingency_cents
        if cycle.budget_available_cents >= allocated:   # exact fit is FUNDED (>= boundary)
          FUND the request: committed += allocated; available -= allocated
          request.allocated_cents = allocated; request.funding_cycle_id = cycle.id
        else:
          STOP: this request and every lower-ranked request -> WAITLISTED (allocated_cents 0)
    input_set: "all TrafficCalmingRequest rows with status == RANKING_ELIGIBLE at publication time"
    constants:
      CONTINGENCY_RATE: 0.075
    precision: "integer cents; contingency rounded per request (round_half_up to whole cents) and THEN summed into committed — the alternative order (sum raw contingencies, round once) is explicitly rejected"
    variants:
      - name: provisional_allocation
        when: "at publish-ranking"
        difference: "allocation derives from request.requested_budget_cents (planning estimate)"
      - name: final_allocation
        when: "at treatment-plan approval (plan_approval_rebaseline)"
        difference: "allocation re-derived from plan.estimated_cost_cents; identical inputs to a request produce different allocated_cents whenever the plan estimate differs from the planning estimate"

  - name: plan_approval_rebaseline
    trigger: "POST /api/treatment-plans/{planId}/approve"
    algorithm: aggregation
    formula: |
      final_alloc = plan.estimated_cost_cents + round_half_up(plan.estimated_cost_cents * CONTINGENCY_RATE)
      delta = final_alloc - request.allocated_cents
      require cycle.budget_available_cents >= delta  (else ERR_REBASELINE_EXCEEDS_BUDGET)
      cycle.budget_committed_cents += delta
      cycle.budget_available_cents -= delta
      request.allocated_cents = final_alloc
    input_set: "the plan being approved, its request, and the request's funding cycle"
    constants:
      CONTINGENCY_RATE: 0.075
    precision: "integer cents, round_half_up"

  - name: ballot_tally
    trigger: "logical-clock sweep (POST /_clock/set_current_utc) once now > ballot.close_date"
    algorithm: threshold
    formula: |
      votes_received = count(BallotVote rows for ballot)
      votes_for      = count(rows with choice == FOR)
      votes_against  = count(rows with choice == AGAINST)
      quorum_required = ceil(eligible_households * QUORUM_RATIO)   # snapshot at creation
      consent_granted iff votes_received >= quorum_required AND 100 * votes_for >= 60 * votes_received
      (integer cross-multiplication — no floating point; exact 60% passes)
      votes_received == 0 -> CONSENT_DENIED
    input_set: "all BallotVote rows for the ballot (votes are immutable; no exclusion set)"
    constants:
      QUORUM_RATIO: 0.25
      APPROVAL_RATIO_PERCENT: 60
    precision: "integer counts and integer comparison"

  - name: crew_schedule_conflict
    trigger: "POST /api/installation-work-orders/{woId}/schedule"
    algorithm: interval_overlap
    formula: |
      new interval = [scheduled_date, scheduled_date + duration_days)   # half-open
      for each other InstallationWorkOrder w with w.crew_ref == crew_ref
        and w.schedule_status == SCHEDULED:
          conflict iff new.start < w.end AND w.start < new.end
      adjacency is ALLOWED: new.start == w.end or new.end == w.start does not conflict
    input_set: "all SCHEDULED InstallationWorkOrder rows with the same crew_ref (any request)"

  - name: study_window_conflict
    trigger: "POST /api/requests/{reqId}/speed-studies"
    algorithm: interval_overlap
    formula: |
      buffered windows on the same StreetSegment:
      for each SpeedStudy s (any request on this segment) with s.status in {COLLECTING, ANALYZED, CERTIFIED}:
        conflict iff new.window_start_date <= s.window_end_date + STUDY_GAP_DAYS
                 AND s.window_start_date - STUDY_GAP_DAYS <= new.window_end_date
      a gap of exactly STUDY_GAP_DAYS days between windows is a CONFLICT (buffer is inclusive);
      the first non-conflicting day for a new start is s.window_end_date + STUDY_GAP_DAYS + 1
    input_set: "all SpeedStudy rows on the same segment in {COLLECTING, ANALYZED, CERTIFIED}"
    constants:
      STUDY_GAP_DAYS: 7

  - name: effectiveness_evaluation
    trigger: "POST /api/speed-studies/{studyId}/certify for a POST_INSTALLATION study"
    algorithm: threshold
    formula: |
      p85_reduction_mph  = round_half_up(baseline_p85_mph  - certified_p85_mph, 1)
      mean_reduction_mph = round_half_up(baseline_mean_speed_mph - certified_mean_speed_mph, 1)
      meets_effectiveness_target   = (p85_reduction_mph  >= P85_REDUCTION_TARGET)    # official verdict
      meets_target_mean_variant    = (mean_reduction_mph >= MEAN_REDUCTION_TARGET)   # advisory variant
    input_set: "the post-installation study's certified aggregates and the snapshotted baseline fields from the CERTIFIED INITIAL study"
    constants:
      P85_REDUCTION_TARGET: 3.0
      MEAN_REDUCTION_TARGET: 2.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: p85_based_official
        when: "always computed; drives meets_effectiveness_target"
        difference: "verdict from 85th-percentile reduction"
      - name: mean_based_advisory
        when: "always computed; drives meets_target_mean_variant"
        difference: "verdict from mean-speed reduction; identical observations can pass one variant and fail the other"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must be present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role must be one of the endpoint's permitted roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path identifiers must exist, validated left-to-right (request before study, ballot before vote, etc.); body FK references (e.g. street_segment_id at creation) must exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: concurrency
    check: "OCC: expected_<parent>_version must equal the parent entity's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/requests/{reqId}/treatment-plans; POST /api/funding-cycles/{cycleId}/publish-ranking"
  - priority: 5
    category: state
    check: "Target resource must be in the required state for the operation (request stage, study status, plan status, ballot OPEN, cycle status, work-order dimensions, removal status)"
    error_id: "ERR_REQUEST_INVALID_STATE | ERR_STUDY_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_BALLOT_INVALID_STATE | ERR_CYCLE_INVALID_STATE | ERR_WORK_ORDER_INVALID_STATE | ERR_REMOVAL_INVALID_STATE"
    http_status: 409
    applies_to: "all action/creation endpoints with a state precondition"
  - priority: 6
    category: business_safety
    check: "Safety/compliance gates: treatment type permitted on the segment (no SPEED_HUMP or CHICANE on emergency_route segments); scheduling a work order whose emergency review is BLOCKED; segregation of duties at plan approval/revision (approver != plan author)"
    error_id: "ERR_TREATMENT_PROHIBITED_ON_EMERGENCY_ROUTE | ERR_EMERGENCY_REVIEW_BLOCKED | ERR_APPROVER_IS_PLAN_AUTHOR"
    http_status: "422 | 409 | 403"
    applies_to: "POST /api/requests/{reqId}/treatment-plans; POST /api/installation-work-orders/{woId}/schedule; POST /api/treatment-plans/{planId}/approve and /request-revision"
  - priority: 7
    category: business_temporal
    check: "Time-window gates against the logical clock: observation_date inside the study window; scheduled_date not in the past; mark-installed not before scheduled_date; post-installation study not before installed_at + 30 days; removal not before installed_at + 365 days"
    error_id: "ERR_OBSERVATION_OUTSIDE_WINDOW | ERR_SCHEDULE_DATE_IN_PAST | ERR_INSTALLATION_DATE_NOT_REACHED | ERR_POST_STUDY_TOO_EARLY | ERR_REMOVAL_MIN_AGE_NOT_MET"
    http_status: 409
    applies_to: "observation creation; schedule; mark-installed; POST_INSTALLATION study creation; removal-request creation"
  - priority: 8
    category: business_constraint
    check: "Uniqueness, capacity and structural constraints: segment program eligibility (no ARTERIAL); one non-terminal request per segment; resident email unique; household_ref unique per segment; one signature per household per request; one vote per household per ballot; duplicate observation date; minimum observation days; cycle_year unique; crew half-open overlap; study buffered-window conflict; voter/signer household must front the request's segment; positive amounts (requested_budget_cents, estimated_cost_cents, budget_total_cents > 0)"
    error_id: "ERR_SEGMENT_NOT_ELIGIBLE | ERR_ACTIVE_REQUEST_EXISTS | ERR_DUPLICATE_RESIDENT_EMAIL | ERR_DUPLICATE_HOUSEHOLD | ERR_DUPLICATE_HOUSEHOLD_SIGNATURE | ERR_DUPLICATE_BALLOT_VOTE | ERR_DUPLICATE_OBSERVATION_DATE | ERR_INSUFFICIENT_OBSERVATION_DAYS | ERR_DUPLICATE_CYCLE_YEAR | ERR_CREW_SCHEDULE_CONFLICT | ERR_STUDY_WINDOW_CONFLICT | ERR_HOUSEHOLD_NOT_ON_SEGMENT | ERR_INVALID_REQUEST"
    http_status: "409 (409 for conflicts; 400 for ERR_INVALID_REQUEST)"
    applies_to: "creation and scheduling endpoints"
  - priority: 9
    category: business_fiscal
    check: "Budget gates: ranking publication requires a non-empty eligible pool; plan-approval re-baseline must fit remaining cycle budget"
    error_id: "ERR_NO_ELIGIBLE_REQUESTS | ERR_REBASELINE_EXCEEDS_BUDGET"
    http_status: "409 | 402"
    applies_to: "POST /api/funding-cycles/{cycleId}/publish-ranking; POST /api/treatment-plans/{planId}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; business-critical sweep) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z before any set_current_utc call; the logical clock NEVER falls back to wall-clock time. Sweep side effects: (1) PETITION_OPEN requests with now > petition_deadline_at and signature_count < required_signatures -> PETITION_FAILED; (2) OPEN ballots with now > close_date -> TALLIED per ballot_tally, cascading the request fork (CONSENT_GRANTED or CONSENT_DENIED with allocation release)."
    roles: [CityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["petition deadline sweep", "ballot tally sweep with request fork cascade"]

  # --- StreetSegment ---
  - method: POST
    path: "/api/segments"
    description: "Register a street segment"
    roles: [CityAdmin]
    code: 201
    input: [name, speed_limit_mph, household_count, functional_class, "emergency_route?", "crash_count_3yr?", "pedestrian_generator_count?"]
    output: StreetSegment
    side_effects: []
  - method: GET
    path: "/api/segments/{segmentId}"
    description: "Get a street segment"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: StreetSegment
    side_effects: []

  # --- Resident ---
  - method: POST
    path: "/api/residents"
    description: "Register a resident (email unique citywide; household_ref unique within the segment)"
    roles: [CityAdmin]
    code: 201
    input: [full_name, email, street_segment_id, household_ref]
    output: Resident
    side_effects: []
  - method: GET
    path: "/api/residents/{residentId}"
    description: "Get a resident"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: GET
    path: "/api/residents"
    description: "List residents, optionally filtered by segment"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["street_segment_id?", "limit?", "offset?"]
    output: "Resident[]"
    side_effects: []

  # --- TrafficCalmingRequest ---
  - method: POST
    path: "/api/requests"
    description: "Resident files a traffic calming request for their own segment"
    roles: [Resident]
    code: 201
    input: [street_segment_id, title, requested_budget_cents]
    output: TrafficCalmingRequest
    side_effects: ["created_by_resident_id := X-User-ID", "status := SUBMITTED"]
  - method: GET
    path: "/api/requests/{reqId}"
    description: "Get a request"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: TrafficCalmingRequest
    side_effects: []
  - method: GET
    path: "/api/requests"
    description: "List requests with filters"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["street_segment_id?", "created_by_resident_id?", "status?", "funding_cycle_id?", "limit?", "offset?"]
    output: "TrafficCalmingRequest[]"
    side_effects: []
  - method: POST
    path: "/api/requests/{reqId}/open-petition"
    description: "Open the petition window (snapshots required_signatures and the 90-day deadline)"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: TrafficCalmingRequest
    side_effects: ["status SUBMITTED -> PETITION_OPEN", "petition_opened_at/deadline/required_signatures stamped"]
  - method: POST
    path: "/api/requests/{id}/petition-signatures"
    description: "Resident signs the petition (one live signature per household per request)"
    roles: [Resident]
    code: 201
    input: []
    output: PetitionSignature
    side_effects: ["request.signature_count recomputed", "if signature_count >= required_signatures: request PETITION_OPEN -> PETITION_MET"]
  - method: GET
    path: "/api/requests/{id}/petition-signatures"
    description: "List live signatures for a request"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: "PetitionSignature[]"
    side_effects: []
  - method: GET
    path: "/api/residents/{id}/petition-signatures"
    description: "List signatures cast by a resident"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: "PetitionSignature[]"
    side_effects: []
  - method: DELETE
    path: "/api/petition-signatures/{sigId}"
    description: "Retract a live signature (signing resident themself, or a TrafficEngineer)"
    roles: [Resident, TrafficEngineer]
    code: 204
    input: []
    output: null
    side_effects: ["request.signature_count recomputed (decremented); note: a request already PETITION_MET does not revert"]

  # --- SpeedStudy & StudyObservation ---
  - method: POST
    path: "/api/requests/{reqId}/speed-studies"
    description: "Commission a speed study (INITIAL requires PETITION_MET; POST_INSTALLATION requires INSTALLED + 30 days + work order INSTALLED)"
    roles: [TrafficEngineer]
    code: 201
    input: [study_type, window_start_date, window_end_date]
    output: SpeedStudy
    side_effects: ["INITIAL: request PETITION_MET -> STUDY_IN_PROGRESS", "POST_INSTALLATION: baseline snapshot from CERTIFIED INITIAL study; request INSTALLED -> POST_STUDY_IN_PROGRESS", "buffered window conflict check on the segment"]
  - method: GET
    path: "/api/speed-studies/{studyId}"
    description: "Get a speed study"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: SpeedStudy
    side_effects: []
  - method: GET
    path: "/api/speed-studies"
    description: "List speed studies with filters"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["request_id?", "study_type?", "status?", "limit?", "offset?"]
    output: "SpeedStudy[]"
    side_effects: []
  - method: POST
    path: "/api/speed-studies/{studyId}/observations"
    description: "Record a daily observation (study must be COLLECTING; date inside window; unique per study)"
    roles: [TrafficEngineer]
    code: 201
    input: [observation_date, vehicle_count, p85_speed_mph, mean_speed_mph, "is_valid?"]
    output: StudyObservation
    side_effects: ["study.observation_count / valid_observation_count recomputed"]
  - method: GET
    path: "/api/speed-studies/{id}/observations"
    description: "List observations for a study"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: "StudyObservation[]"
    side_effects: []
  - method: POST
    path: "/api/speed-studies/{studyId}/analyze"
    description: "Compute provisional aggregates and provisional_score over ALL observations (requires >= 3 observations)"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: SpeedStudy
    side_effects: ["status COLLECTING -> ANALYZED", "provisional_* fields recomputed"]
  - method: POST
    path: "/api/speed-studies/{studyId}/return-for-recollection"
    description: "Send an ANALYZED study back to COLLECTING (revision cycle)"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: SpeedStudy
    side_effects: ["status ANALYZED -> COLLECTING"]
  - method: POST
    path: "/api/speed-studies/{studyId}/certify"
    description: "Certify an ANALYZED study: certified aggregates over valid observations only, certified_score, and the request-stage cascade"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: SpeedStudy
    side_effects: ["status ANALYZED -> CERTIFIED", "certified_* fields computed", "INITIAL: request -> RANKING_ELIGIBLE (score >= 60) or SCORE_INELIGIBLE (< 60)", "POST_INSTALLATION: effectiveness fields computed; request -> EFFECTIVENESS_CERTIFIED"]

  # --- TreatmentPlan ---
  - method: POST
    path: "/api/requests/{reqId}/treatment-plans"
    description: "Create a treatment plan draft (request must be FUNDED or DESIGN_IN_PROGRESS; OCC on request version; supersedes any existing draft-stage plan)"
    roles: [TrafficEngineer]
    code: 201
    input: [treatment_type, estimated_cost_cents, expected_request_version]
    output: TreatmentPlan
    side_effects: ["request FUNDED -> DESIGN_IN_PROGRESS", "existing DRAFT/SUBMITTED_FOR_REVIEW/REVISION_REQUESTED plan -> WITHDRAWN", "increments TrafficCalmingRequest.version by 1", "created_by_user_id := X-User-ID"]
  - method: GET
    path: "/api/treatment-plans/{planId}"
    description: "Get a treatment plan"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []
  - method: GET
    path: "/api/treatment-plans"
    description: "List treatment plans with filters"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["request_id?", "status?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []
  - method: POST
    path: "/api/treatment-plans/{planId}/submit-for-review"
    description: "Submit a DRAFT plan for engineering review"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status DRAFT -> SUBMITTED_FOR_REVIEW", "submitted_at stamped"]
  - method: POST
    path: "/api/treatment-plans/{planId}/approve"
    description: "CityEngineer approves a submitted plan (segregation of duties: approver != plan author; budget re-baseline must fit)"
    roles: [CityEngineer]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status SUBMITTED_FOR_REVIEW -> APPROVED", "request DESIGN_IN_PROGRESS -> BALLOT_READY", "FundingCycle re-baseline (plan_approval_rebaseline)"]
  - method: POST
    path: "/api/treatment-plans/{planId}/request-revision"
    description: "CityEngineer sends a submitted plan back for revision (revision cycle: SUBMITTED_FOR_REVIEW -> REVISION_REQUESTED -> DRAFT)"
    roles: [CityEngineer]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status SUBMITTED_FOR_REVIEW -> REVISION_REQUESTED -> DRAFT (automatic)"]

  # --- FundingCycle ---
  - method: POST
    path: "/api/funding-cycles"
    description: "Create a budget cycle (cycle_year unique)"
    roles: [CityAdmin]
    code: 201
    input: [cycle_year, budget_total_cents]
    output: FundingCycle
    side_effects: ["status := OPEN", "budget_committed_cents := 0", "budget_available_cents := budget_total_cents"]
  - method: GET
    path: "/api/funding-cycles/{cycleId}"
    description: "Get a funding cycle"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: FundingCycle
    side_effects: []
  - method: GET
    path: "/api/funding-cycles/{cycleId}/ranking"
    description: "Computed read: requests considered in the latest publication for this cycle, sorted by citywide_rank ASC (FUNDED and WAITLISTED rows)"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrafficCalmingRequest[]"
    side_effects: []
  - method: POST
    path: "/api/funding-cycles/{cycleId}/publish-ranking"
    description: "Rank all RANKING_ELIGIBLE requests citywide and run the strict-stop allocation waterfall (OCC on cycle version; re-publication supersedes)"
    roles: [CityAdmin]
    code: 200
    input: [expected_funding_cycle_version]
    output: FundingCycle
    side_effects: ["citywide_rank assigned per citywide_ranking_waterfall", "FUNDED/WAITLISTED forks with budget debit", "published_at stamped", "increments FundingCycle.version by 1"]
  - method: POST
    path: "/api/funding-cycles/{cycleId}/close"
    description: "Close a published cycle; WAITLISTED requests cycle back to RANKING_ELIGIBLE"
    roles: [CityAdmin]
    code: 200
    input: []
    output: FundingCycle
    side_effects: ["status RANKING_PUBLISHED -> CLOSED", "WAITLISTED requests -> RANKING_ELIGIBLE with citywide_rank cleared"]

  # --- Ballot & BallotVote ---
  - method: POST
    path: "/api/requests/{reqId}/ballots"
    description: "Open the neighborhood consent ballot (requires BALLOT_READY; locks the approved plan; snapshots eligible_households and quorum)"
    roles: [TrafficEngineer]
    code: 201
    input: [close_date]
    output: Ballot
    side_effects: ["request BALLOT_READY -> BALLOT_OPEN", "APPROVED plan -> LOCKED", "quorum_required computed"]
  - method: GET
    path: "/api/ballots/{ballotId}"
    description: "Get a ballot"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: Ballot
    side_effects: []
  - method: GET
    path: "/api/ballots"
    description: "List ballots with filters"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["request_id?", "treatment_plan_id?", "status?", "limit?", "offset?"]
    output: "Ballot[]"
    side_effects: []
  - method: POST
    path: "/api/ballots/{id}/votes"
    description: "Resident casts a vote (one per household; ballot must still be OPEN — the clock sweep tallies it atomically once now > close_date; household must front the ballot's segment)"
    roles: [Resident]
    code: 201
    input: [choice]
    output: BallotVote
    side_effects: ["ballot.votes_received / votes_for / votes_against recomputed"]
  - method: GET
    path: "/api/ballots/{id}/votes"
    description: "List votes for a ballot"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: "BallotVote[]"
    side_effects: []
  - method: GET
    path: "/api/residents/{id}/ballot-votes"
    description: "List votes cast by a resident"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: "BallotVote[]"
    side_effects: []

  # --- InstallationWorkOrder ---
  - method: POST
    path: "/api/requests/{reqId}/installation-work-orders"
    description: "Create the installation work order (requires CONSENT_GRANTED; one per request)"
    roles: [TrafficEngineer]
    code: 201
    input: [crew_ref]
    output: InstallationWorkOrder
    side_effects: ["request CONSENT_GRANTED -> INSTALLATION_PLANNED", "schedule_status := UNSCHEDULED", "emergency_review_status := PENDING_REVIEW"]
  - method: GET
    path: "/api/installation-work-orders/{woId}"
    description: "Get an installation work order"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: InstallationWorkOrder
    side_effects: []
  - method: GET
    path: "/api/installation-work-orders"
    description: "List installation work orders with filters"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["request_id?", "crew_ref?", "schedule_status?", "limit?", "offset?"]
    output: "InstallationWorkOrder[]"
    side_effects: []
  - method: POST
    path: "/api/installation-work-orders/{woId}/schedule"
    description: "Schedule the work order (half-open crew conflict; not in the past; not while review BLOCKED)"
    roles: [TrafficEngineer]
    code: 200
    input: [scheduled_date, duration_days]
    output: InstallationWorkOrder
    side_effects: ["schedule_status UNSCHEDULED -> SCHEDULED", "scheduled_date/duration_days stamped"]
  - method: POST
    path: "/api/installation-work-orders/{woId}/emergency-review"
    description: "Emergency-response review decision; BLOCKED pulls a SCHEDULED order back to UNSCHEDULED; re-review from BLOCKED allowed"
    roles: [EmergencyReviewer]
    code: 200
    input: [decision]
    output: InstallationWorkOrder
    side_effects: ["emergency_review_status -> decision (CLEARED | BLOCKED)", "BLOCKED while SCHEDULED -> schedule_status UNSCHEDULED, dates cleared", "reviewed_by_user_id := X-User-ID"]
  - method: POST
    path: "/api/installation-work-orders/{woId}/mark-installed"
    description: "Mark the treatment installed (requires SCHEDULED + CLEARED + now >= scheduled_date); bubbles the request to INSTALLED"
    roles: [TrafficEngineer]
    code: 200
    input: []
    output: InstallationWorkOrder
    side_effects: ["schedule_status SCHEDULED -> INSTALLED", "installed_at stamped", "request INSTALLATION_PLANNED -> INSTALLED with installed_at stamped"]

  # --- RemovalRequest ---
  - method: POST
    path: "/api/requests/{reqId}/removal-requests"
    description: "Resident files a removal request (requires EFFECTIVENESS_CERTIFIED + installed >= 365 days ago)"
    roles: [Resident]
    code: 201
    input: [reason]
    output: RemovalRequest
    side_effects: ["request EFFECTIVENESS_CERTIFIED -> REMOVAL_REVIEW", "created_by_resident_id := X-User-ID"]
  - method: GET
    path: "/api/removal-requests/{remId}"
    description: "Get a removal request"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: []
    output: RemovalRequest
    side_effects: []
  - method: GET
    path: "/api/removal-requests"
    description: "List removal requests with filters"
    roles: [CityAdmin, TrafficEngineer, CityEngineer, EmergencyReviewer, Resident]
    code: 200
    input: ["request_id?", "created_by_resident_id?", "status?", "limit?", "offset?"]
    output: "RemovalRequest[]"
    side_effects: []
  - method: POST
    path: "/api/removal-requests/{remId}/approve"
    description: "CityEngineer grants removal; the request becomes REMOVED"
    roles: [CityEngineer]
    code: 200
    input: []
    output: RemovalRequest
    side_effects: ["status PENDING_REVIEW -> REMOVAL_GRANTED", "request REMOVAL_REVIEW -> REMOVED"]
  - method: POST
    path: "/api/removal-requests/{remId}/reject"
    description: "CityEngineer denies removal; the request returns to EFFECTIVENESS_CERTIFIED"
    roles: [CityEngineer]
    code: 200
    input: []
    output: RemovalRequest
    side_effects: ["status PENDING_REVIEW -> REMOVAL_DENIED", "request REMOVAL_REVIEW -> EFFECTIVENESS_CERTIFIED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing/empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, wrong type, invalid enum value, non-positive amount, end date before start date" }
  - { id: ERR_SEGMENT_NOT_FOUND, http: 404, condition: "street_segment_id / segmentId does not exist" }
  - { id: ERR_RESIDENT_NOT_FOUND, http: 404, condition: "residentId (or X-User-ID for a Resident call) does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "reqId does not exist" }
  - { id: ERR_SIGNATURE_NOT_FOUND, http: 404, condition: "sigId does not exist (or already retracted)" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "studyId does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "planId does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "cycleId does not exist" }
  - { id: ERR_BALLOT_NOT_FOUND, http: 404, condition: "ballotId does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "woId does not exist" }
  - { id: ERR_REMOVAL_REQUEST_NOT_FOUND, http: 404, condition: "remId does not exist" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "TrafficCalmingRequest is not in the stage required for this operation" }
  - { id: ERR_STUDY_INVALID_STATE, http: 409, condition: "SpeedStudy is not in the status required for this operation" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "TreatmentPlan is not in the status required for this operation" }
  - { id: ERR_BALLOT_INVALID_STATE, http: 409, condition: "Ballot is not OPEN (vote or tally attempted after TALLIED)" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "FundingCycle is not in the status required for this operation (e.g. publish/close on CLOSED)" }
  - { id: ERR_WORK_ORDER_INVALID_STATE, http: 409, condition: "InstallationWorkOrder dimension(s) not in the required state for this operation" }
  - { id: ERR_REMOVAL_INVALID_STATE, http: 409, condition: "RemovalRequest is not PENDING_REVIEW" }
  - { id: ERR_SEGMENT_NOT_ELIGIBLE, http: 422, condition: "Traffic calming requests are not accepted for ARTERIAL segments" }
  - { id: ERR_ACTIVE_REQUEST_EXISTS, http: 409, condition: "Another non-terminal request already exists for this segment" }
  - { id: ERR_DUPLICATE_RESIDENT_EMAIL, http: 409, condition: "email already registered" }
  - { id: ERR_DUPLICATE_HOUSEHOLD, http: 409, condition: "household_ref already registered on this segment" }
  - { id: ERR_HOUSEHOLD_NOT_ON_SEGMENT, http: 422, condition: "The acting resident's household does not front the segment of the target request/ballot" }
  - { id: ERR_DUPLICATE_HOUSEHOLD_SIGNATURE, http: 409, condition: "A live signature for this household already exists on this request" }
  - { id: ERR_DUPLICATE_BALLOT_VOTE, http: 409, condition: "A vote for this household already exists on this ballot" }
  - { id: ERR_STUDY_WINDOW_CONFLICT, http: 409, condition: "Study window violates the 7-day inclusive buffer against another study on the same segment" }
  - { id: ERR_DUPLICATE_OBSERVATION_DATE, http: 409, condition: "An observation for this date already exists in the study" }
  - { id: ERR_OBSERVATION_OUTSIDE_WINDOW, http: 409, condition: "observation_date is outside [window_start_date, window_end_date]" }
  - { id: ERR_INSUFFICIENT_OBSERVATION_DAYS, http: 409, condition: "Fewer than 3 observations (analyze) or fewer than 3 valid observations (certify)" }
  - { id: ERR_POST_STUDY_TOO_EARLY, http: 409, condition: "POST_INSTALLATION study attempted before installed_at + 30 days" }
  - { id: ERR_TREATMENT_PROHIBITED_ON_EMERGENCY_ROUTE, http: 422, condition: "SPEED_HUMP or CHICANE selected on a segment with emergency_route == true (only SIGNAGE permitted)" }
  - { id: ERR_APPROVER_IS_PLAN_AUTHOR, http: 403, condition: "Segregation of duties: the approving/revision-requesting CityEngineer is the plan's author" }
  - { id: ERR_REBASELINE_EXCEEDS_BUDGET, http: 402, condition: "Plan approval re-baseline delta exceeds the cycle's remaining budget" }
  - { id: ERR_NO_ELIGIBLE_REQUESTS, http: 409, condition: "publish-ranking with zero requests in RANKING_ELIGIBLE" }
  - { id: ERR_DUPLICATE_CYCLE_YEAR, http: 409, condition: "A funding cycle with this cycle_year already exists" }
  - { id: ERR_CREW_SCHEDULE_CONFLICT, http: 409, condition: "Half-open interval [scheduled_date, scheduled_date + duration_days) overlaps another SCHEDULED work order for the same crew_ref" }
  - { id: ERR_SCHEDULE_DATE_IN_PAST, http: 409, condition: "scheduled_date is before the logical current date" }
  - { id: ERR_EMERGENCY_REVIEW_BLOCKED, http: 409, condition: "Scheduling attempted while emergency_review_status == BLOCKED" }
  - { id: ERR_EMERGENCY_REVIEW_NOT_CLEARED, http: 409, condition: "mark-installed attempted while emergency_review_status != CLEARED" }
  - { id: ERR_INSTALLATION_DATE_NOT_REACHED, http: 409, condition: "mark-installed attempted before scheduled_date" }
  - { id: ERR_REMOVAL_MIN_AGE_NOT_MET, http: 409, condition: "Removal requested before installed_at + 365 days" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Resident
    description: "A registered resident; files requests, signs petitions, votes in ballots, files removal requests — always against their own segment/household"
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /api/requests — file a request (created_by_resident_id := X-User-ID; household must front the segment)"
      - "POST /api/requests/{reqId}/petition-signatures — sign a petition"
      - "POST /api/ballots/{ballotId}/votes — cast a ballot vote"
      - "POST /api/requests/{reqId}/removal-requests — file a removal request"
    shared_operations:
      - "GET read endpoints (segments, residents, requests, signatures, studies, observations, plans, cycles, rankings, ballots, votes, work orders, removal requests)"
      - "DELETE /api/petition-signatures/{sigId} — retract own signature (shared with TrafficEngineer)"
  - name: TrafficEngineer
    description: "City traffic engineering staff; runs petitions, studies, plans (as author), ballots, and installation scheduling"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/requests/{reqId}/open-petition"
      - "POST /api/requests/{reqId}/speed-studies"
      - "POST /api/speed-studies/{studyId}/observations"
      - "POST /api/speed-studies/{studyId}/analyze | /return-for-recollection | /certify"
      - "POST /api/requests/{reqId}/treatment-plans"
      - "POST /api/treatment-plans/{planId}/submit-for-review"
      - "POST /api/requests/{reqId}/ballots"
      - "POST /api/requests/{reqId}/installation-work-orders"
      - "POST /api/installation-work-orders/{woId}/schedule | /mark-installed"
    shared_operations:
      - "GET read endpoints"
      - "DELETE /api/petition-signatures/{sigId} — staff retraction (shared with Resident)"
  - name: CityEngineer
    description: "Reviewing/approving engineer; segregation of duties: cannot approve or send back a plan they authored"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/treatment-plans/{planId}/approve"
      - "POST /api/treatment-plans/{planId}/request-revision"
      - "POST /api/removal-requests/{remId}/approve | /reject"
    shared_operations:
      - "GET read endpoints"
  - name: EmergencyReviewer
    description: "Emergency-response services reviewer; gates installation scheduling via the parallel review dimension"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/installation-work-orders/{woId}/emergency-review"
    shared_operations:
      - "GET read endpoints"
  - name: CityAdmin
    description: "Program administrator; registers segments and residents, manages funding cycles and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/segments"
      - "POST /api/residents"
      - "POST /api/funding-cycles"
      - "POST /api/funding-cycles/{cycleId}/publish-ranking | /close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints"
