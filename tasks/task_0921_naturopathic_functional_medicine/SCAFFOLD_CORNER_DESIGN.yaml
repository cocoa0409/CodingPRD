  - section: validations
    instances:

      - name: request_without_role_header_is_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 fires before role checking, existence and everything else: a GET with no X-User-Role header returns 401 ERR_UNAUTHENTICATED even though the target id also does not exist."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MISSING_HEADER
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "error_id != ERR_PATIENT_NOT_FOUND"

