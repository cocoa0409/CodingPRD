            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - call: "POST /oven-stations"
              payload: { station_code: "OVN-CD-2", arm_count: 2, max_size_class: "COMPACT", changeover_buffer_min: 15, energy_cents_per_min: 90 }
