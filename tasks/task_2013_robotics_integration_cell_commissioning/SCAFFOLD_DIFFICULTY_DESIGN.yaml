          assert:
            - "edge_status == ACTIVE: first_due_at_hours == current (0 >= 0) is accepted (>= boundary)"
            - "after_read_hud == 1900 (next due rolls to 4000: 2000 + 1*2000 - 2100)"
            - "after_read2_hud == 1 (4000 - 3999)"

  - rule_id: compensating_invariant
    instances:
      - name: retention_ledger_conservation_across_milestones
        grounds:
          - calculations.retention_release_schedule
          - entities.RetentionLedgerEntry
          - entities.CellProject.fields.retention_balance_cents
          - validations[priority=15]
        distinguishing_aspect: |
          Conserved quantity: retention money. Invariant — at any time,
          retention_balance_cents == WITHHOLD_total + sum(RELEASE/PENALTY/
          ADJUST signed amounts), and the sum of the three milestone releases
          on the happy path equals the original WITHHOLD exactly (30k + 40k +
          30k = 100k for contract 1,000,000 at 1000 bps). A manual ADJUST
          paired with its reversing ADJUST leaves the balance unchanged.
        test_recipe:
          setup:
            - "Project created with contract 1000000 at 1000 bps (WITHHOLD 100000 posted, balance 100000)"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "IntegCo", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant Q", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-CI1", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id, v0: $.data.version, bal0: $.data.retention_balance_cents }
            - call: "POST /robotics/cell-projects/${proj_id}/retention-ledger-entries"
              payload: { expected_project_version: "${v0}", entry_type: "ADJUST", amount_cents: -5000, milestone_ref: "MANUAL" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { v1: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/retention-ledger-entries"
              payload: { expected_project_version: "${v1}", entry_type: "ADJUST", amount_cents: 5000, milestone_ref: "MANUAL" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
          trigger:
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { final_bal: $.data.retention_balance_cents }
            - call: "GET /robotics/cell-projects/${proj_id}/retention-ledger-entries"
              payload: {}
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
          assert:
            - "bal0 == 100000"
            - "final_bal == 100000 (paired ADJUST -5000 / +5000 conserves the balance)"
            - "Ledger contains exactly 3 entries: WITHHOLD 100000, ADJUST -5000, ADJUST +5000"
            - "An attempt to post ADJUST -100001 would fail ERR_RETENTION_OVERRELEASE"

      - name: rework_cycle_preserves_release_revision_monotonicity
        grounds:
          - state_machines.RobotProgram
          - state_machines.CellProject.FAT_to_DESIGN
          - entities.RobotProgram.fields.release_revision
          - entities.CellProject.fields.rework_count
        distinguishing_aspect: |
          Different conserved quantity: release accounting monotonicity. A
          forward pass (CODED->PEER_REVIEWED->RELEASED, release_revision
          becomes 1) followed by its compensating rework (RELEASED->REWORK via
          FAT fail) and a second forward pass MUST leave
          release_revision == 2 and rework_count == 1 — the counters never
          decrease, so forward+compensate+forward conserves cumulative counts
          rather than reverting them.
        test_recipe:
          setup:
            - "Project driven to FAT; program MAIN released once (release_revision=1); FAT failed (program REWORK); program re-coded, re-reviewed, re-released"
          setup_api_calls:
