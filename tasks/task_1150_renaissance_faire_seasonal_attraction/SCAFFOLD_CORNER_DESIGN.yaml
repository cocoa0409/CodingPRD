            - "Page 2 (offset 10): data has 2 items, total_count == 12, has_more == false"

      - name: settle_and_release_state_gates
        claim_type: conditional_action
        grounds: ["errors[ERR_SEASON_INVALID_STATE]", "errors[ERR_BOOTH_NOT_SETTLEABLE]", "errors[ERR_BOOTH_NOT_RELEASEABLE]", state_machines.BoothAssignment]
        distinguishing_aspect: "settle on a CONFIRMED booth while the season is merely OPEN fails on the season gate; after STRIKE the same settle succeeds (MEADOW 64sqft: final 6400 == provisional, delta 0); settle on a RESERVED booth fails on the booth gate; release on a CONFIRMED booth fails."
        test_recipe:
          setup: ["Season OPEN (volunteer_min_hours 0); day 06-06 OPEN_FOR_SALES; artisans A (booth S-01 CONFIRMED) and B (booth S-02 RESERVED)"]
          setup_api_calls:
