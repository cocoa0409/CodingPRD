          setup:
            - "One program with a TRAINEE abstractor whose productivity_target_cases_per_day is 0.2, giving capacity_cap == 2."
            - "Cases G1 and G2 are ASSIGNED to that trainee, so assigned_open_case_count == 2 and the cap is already met."
            - "Case G3 is IDENTIFIED and unassigned; open_backlog_count == 3, below POSTURE_RESTRICTED_BACKLOG_MIN (4)."
            - "A CRITICAL deficiency cited on 2026-08-01 has forced registry_posture to FROZEN."
