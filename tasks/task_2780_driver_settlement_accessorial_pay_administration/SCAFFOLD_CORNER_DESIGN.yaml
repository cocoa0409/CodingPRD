          rationale: "That instance already freezes the movement axis at DELIVERED while walking the pay axis ACCRUED to SETTLED to ADJUSTED, which is the parallel-axis claim for Load."
      - name: driver_escrow_axis_loops_funded_to_collecting_and_back
        claim_type: cyclic
        grounds:
          - state_machines.Driver.FUNDED_to_COLLECTING
          - state_machines.Driver.COLLECTING_to_FUNDED
        excluded_because:
          difficulty_instance: compensating_invariant / escrow_principal_ledger_invariant_after_reversal
          rationale: "That instance drives the FUNDED to COLLECTING to FUNDED loop with a deduction and its reversal and asserts the balance and status at each hop."
