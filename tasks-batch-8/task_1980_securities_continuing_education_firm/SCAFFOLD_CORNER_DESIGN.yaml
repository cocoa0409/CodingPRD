          trigger:
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "ta-sod", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SOD_AUTHOR_CANNOT_APPROVE (${err}); http 403; content remains PENDING_APPROVAL"

      - name: c_rep_cannot_complete_others_enrollment
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5.1]"
          - "errors[ERR_OWNERSHIP_REQUIRED]"
          - "roles.RegisteredRep"
        distinguishing_aspect: "entity_backed ownership: a RegisteredRep whose X-User-ID differs from the enrollment's rep_id cannot complete it."
