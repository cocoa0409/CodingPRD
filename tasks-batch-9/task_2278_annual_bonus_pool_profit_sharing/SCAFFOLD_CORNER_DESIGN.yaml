      - name: top_tier_concentration_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - validations.priority_113
          - errors.ERR_TOP_TIER_CONCENTRATION
          - entities.BusinessUnitPool.fields.top_tier_award_count
          - entities.BusinessUnitPool.fields.max_top_tier_count
          - endpoints."POST /bu-pools/{poolId}/submit-calibration"
        distinguishing_aspect: |
          The concentration cap is a rate threshold with two boundaries in one
          fixture. First the counting boundary: an allocation_ratio of exactly
          1.5000 counts as top tier because the rule is >= 1.50, so both awards
          count and top_tier_award_count is 2. Then the cap boundary: 25% of an
          eligible headcount of 2 floors to 0 and the declared minimum of 1 lifts
          it, so max_top_tier_count is 1 and 2 > 1 fails. Dropping one award to
          1,490,000 makes its ratio 1.4900, resets the counter to 1, and the same
          submission passes — with allocated 2,990,000 still only 5,000 above the
          utilization floor of 2,985,000, so the reset cannot be confused with an
          under-utilization failure.
        test_recipe:
          setup:
            - "Plan FUNDED with two full-year L3 participants (target 1,000,000 each): company achievement 110.00, BU 150.00, blended 120.00, multiplier 1.5000, pool funded 3,000,000, max_top_tier_count 1; both awards PROPOSED at 1,500,000."
