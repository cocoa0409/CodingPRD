            - { call: "POST /fluid-power/cylinders", payload: { customer_id: "${cust_a}", serial_number: "CYL-R02", bore_mm: 80, stroke_mm: 500, rod_diameter_mm: 45, pressure_class: "CLASS_3000", fluid_type: "MINERAL_OIL", seal_kit_id: "${kit_id}" }, as: ServiceAdvisor, captures: { cyl_id: "$.data.id" } }
            - { call: "POST /fluid-power/technicians", payload: { full_name: "Tech One", skills: ["CYLINDER_REPAIR"] }, as: ShopAdmin, captures: { tech1_id: "$.data.id" } }
