            - call: "POST /ad-placements"
              payload: { campaign_id: "${cR1}", episode_id: "${epR}", position: "PRE_ROLL", ad_duration_ms: 30000, forecast_impressions: 5, expected_campaign_version: "${cR1v}" }
              as: Advertiser
