# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Tenant Rights Hotline & Housing Counseling
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: caller_creation_defaults
        claim_type: creation
        grounds: [entities.Caller, "endpoints[POST /hotline/callers]"]
        distinguishing_aspect: "Creating a caller with all required fields returns 201 with server-stamped fields and system defaults applied."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id, cver: $.data.version, cat: $.data.created_at } }
          assert:
            - "201; response id is a server-minted UUID; created_at == 2026-08-01T00:00:00Z (logical clock, not wall clock); version == 1"
            - "pii_purged == false, do_not_aggregate == false, accessibility_needs == [] (defaults applied)"

      - name: caller_anonymous_phone_rejected
        claim_type: type_constraints
        grounds: [entities.Caller.fields.phone, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Anonymous callers must not carry a phone number: is_anonymous=true with non-null phone is a schema violation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hotline/callers", payload: { alias: "anon-1", phone: "+15550009", preferred_language: "en", channel: "PHONE", is_anonymous: true }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST (anonymous + non-null phone)"

      - name: jurisdiction_level_chain_valid
        claim_type: parent_relationships
        grounds: [entities.Jurisdiction.fields.parent_jurisdiction_id, entities.Jurisdiction.fields.level]
        distinguishing_aspect: "STATE -> COUNTY -> CITY nesting accepts correctly-leveled parents and each child is discoverable via the parent filter."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { st: $.data.id } }
            - { call: "POST /hotline/jurisdictions", payload: { parent_jurisdiction_id: "${st}", code: "CA-LA", name: "Los Angeles County", level: "COUNTY", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { co: $.data.id } }
            - { call: "POST /hotline/jurisdictions", payload: { parent_jurisdiction_id: "${co}", code: "CA-LA-001", name: "Los Angeles", level: "CITY", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { ci: $.data.id } }
          trigger:
            - { call: "GET /hotline/jurisdictions?parent_jurisdiction_id=${st}", as: AgencyAdmin }
          assert:
            - "All three creates succeed (201); the parent-filtered list on the STATE returns exactly [${co}] (self-referential FK reverse reachability)"

      - name: jurisdiction_wrong_level_parent_rejected
        claim_type: type_constraints
        grounds: [entities.Jurisdiction.fields.level, "errors[ERR_JURISDICTION_LEVEL_MISMATCH]"]
        distinguishing_aspect: "A CITY whose parent is a STATE (level skipped) is rejected with the domain 422, not a generic 400."
        test_recipe:
          setup: ["STATE CA exists"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /hotline/jurisdictions", payload: { parent_jurisdiction_id: "${st}", code: "CA-001", name: "Direct City", level: "CITY", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "422 with error_id == ERR_JURISDICTION_LEVEL_MISMATCH"

      - name: script_author_stamped
        claim_type: system_fields
        grounds: [entities.RightsScript.fields.author_counselor_id, entities.RightsScript.fields.status]
        distinguishing_aspect: "author_counselor_id is taken from X-User-ID (client cannot forge authorship) and the new script starts in DRAFT."
        test_recipe:
          setup: ["Jurisdiction CA; counselor author exists"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
          trigger:
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr: $.data.id } }
          assert:
            - "Script.${scr}.author_counselor_id == ${auth} and status == DRAFT (initial state); reviewer_counselor_id is null"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields 404 ERR_NOT_FOUND through the standard error envelope."
        test_recipe:
          setup: ["Empty DB (no fixtures needed)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /hotline/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: HotlineSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND; envelope response_type == error"

      - name: case_create_extra_field_rejected
        claim_type: computed_fields
        grounds: ["validations[priority=5]", entities.Case.fields.priority_score]
        distinguishing_aspect: "Computed fields are server-owned: a create payload smuggling priority_score=999 is rejected as an unknown field; the client cannot write computed state."
        test_recipe:
          setup: ["Base chain: CA, EVICTION script published, trained counselor, caller, ACTIVE session"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
          trigger:
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "EVICTION", priority_score: 999 }, as: Counselor, as_user_id: "${wk}", captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST (unknown payload field priority_score; computed fields are never client-writable)"

      - name: listing_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /hotline/scripts]"]
        distinguishing_aspect: "List responses carry the fixed pagination envelope: limit/offset/total_count/has_more with defaults limit=10, and has_more flips correctly at the boundary."
        test_recipe:
          setup: ["Jurisdiction CA; author counselor; three DRAFT scripts in the same pair (multiple DRAFTs are allowed)"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "d1" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "d2" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "d3" }, as: Counselor, as_user_id: "${auth}" }
          trigger:
            - { call: "GET /hotline/scripts?jurisdiction_id=${jur}&limit=2&offset=0", as: Counselor, as_user_id: "${auth}" }
            - { call: "GET /hotline/scripts?jurisdiction_id=${jur}&limit=2&offset=2", as: Counselor, as_user_id: "${auth}" }
          assert:
            - "Page 1: exactly 2 data rows, total_count == 3, has_more == true"
            - "Page 2: exactly 1 data row, total_count == 3, has_more == false"

      - name: case_note_immutable
        claim_type: immutability
        grounds: [entities.CaseNote, state_machines.CaseNote]
        distinguishing_aspect: "CaseNote is common_fields:false — notes expose id/created_at but no version or updated_at, and the surface declares no update/delete endpoint for them."
        test_recipe:
          setup: ["Base chain: CA, EVICTION script published, trained counselor, caller, ACTIVE session, case IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor }
            - { call: "POST /hotline/callers", payload: { alias: "caller-1", phone: "+15550001", preferred_language: "en", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess: $.data.id } }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ASSIGNED", counselor_id: "${wk}" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/sessions/${sess}/state", payload: { to_status: "ACTIVE" }, as: Counselor, as_user_id: "${wk}" }
            - { call: "POST /hotline/cases", payload: { caller_id: "${cal}", opened_from_session_id: "${sess}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Counselor, as_user_id: "${wk}", captures: { case: $.data.id } }
            - { call: "POST /hotline/cases/${case}/state", payload: { to_status: "IN_PROGRESS" }, as: Counselor, as_user_id: "${wk}", captures: { case_v: $.data.version } }
            - { call: "POST /hotline/cases/${case}/notes", payload: { body: "intake summary", is_confidential: false, expected_case_version: "${case_v}" }, as: Counselor, as_user_id: "${wk}", captures: { note: $.data.id } }
          trigger:
            - { call: "GET /hotline/cases/${case}/notes", as: Counselor, as_user_id: "${wk}" }
          assert:
            - "The note ${note} is readable via the case's notes list with keys {id, created_at, case_id, counselor_id, body, is_confidential, system_generated}"
            - "The note object has NO version or updated_at field (append-only entity); counselor_id == ${wk}; system_generated == false"

      - name: counselor_training_append_threshold
        claim_type: computed_fields
        grounds: [entities.Counselor.fields.trained_script_ids, "endpoints[POST /hotline/counselors/{id}/training-certifications]"]
        distinguishing_aspect: "trained_script_ids is system-maintained: a score of 70 (< 80) does not append; a score of 90 (>= 80) appends the script id exactly once."
        test_recipe:
          setup: ["CA; author+reviewer; script published; subject counselor"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}" }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}" }
            - { call: "POST /hotline/counselors", payload: { display_name: "Worker W", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { wk: $.data.id } }
          trigger:
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 70 }, as: HotlineSupervisor, captures: { trained_fail: $.data.trained_script_ids } }
            - { call: "POST /hotline/counselors/${wk}/training-certifications", payload: { script_id: "${scr1}", score: 90 }, as: HotlineSupervisor, captures: { trained_pass: $.data.trained_script_ids } }
          assert:
            - "After score 70: trained_script_ids == [] (below PASS threshold 80)"
            - "After score 90: trained_script_ids == [${scr1}] (appended once)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: script_publish_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.RightsScript.IN_REVIEW_to_PUBLISHED]
        distinguishing_aspect: "The happy-path DRAFT -> IN_REVIEW -> PUBLISHED walk stamps reviewer_counselor_id from the publisher's X-User-ID and stores effective_from verbatim."
        test_recipe:
          setup: ["CA; author counselor; reviewer counselor"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
          trigger:
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "IN_REVIEW" }, as: Counselor, as_user_id: "${auth}", captures: { st1: $.data.status } }
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}", captures: { st2: $.data.status, eff: $.data.effective_from, rev_by: $.data.reviewer_counselor_id } }
          assert:
            - "Submit: status == IN_REVIEW; publish: status == PUBLISHED, effective_from == 2026-08-01T00:00:00Z, reviewer_counselor_id == ${rev}"

      - name: script_draft_to_published_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RightsScript, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT -> PUBLISHED is not an edge: skipping review is rejected even by a qualified reviewer who is not the author."
        test_recipe:
          setup: ["CA; author; reviewer; script in DRAFT"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { scr1: $.data.id } }
          trigger:
            - { call: "POST /hotline/scripts/${scr1}/state", payload: { to_status: "PUBLISHED", effective_from: "2026-08-01T00:00:00Z" }, as: Counselor, as_user_id: "${rev}", captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_INVALID_STATE (DRAFT has no PUBLISHED edge); Script.${scr1}.status remains DRAFT"

      - name: script_superseded_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RightsScript]
        distinguishing_aspect: "SUPERSEDED is terminal: any further state call (here RETIRED by the supervisor) on a superseded script is rejected."
        test_recipe:
          setup: ["CA; author; reviewer; v1 published then superseded by v2 (clock advanced so v2 effective_from > v1's)"]
          setup_api_calls:
            - { call: "POST /hotline/jurisdictions", payload: { code: "CA", name: "California", level: "STATE", eviction_notice_days: 3, habitability_repair_days: 14, deposit_cap_months: 1.0, deposit_interest_required: false, deposit_interest_rate_pct: 0.0 }, as: AgencyAdmin, captures: { jur: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Author A", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: false }, as: AgencyAdmin, captures: { auth: $.data.id } }
            - { call: "POST /hotline/counselors", payload: { display_name: "Reviewer R", languages: ["en"], certified_jurisdiction_codes: ["CA"], certified_categories: ["EVICTION"], certification_expires_at: "2027-01-01T00:00:00Z", is_script_reviewer: true }, as: AgencyAdmin, captures: { rev: $.data.id } }
            - { call: "POST /hotline/scripts", payload: { jurisdiction_id: "${jur}", issue_category: "EVICTION", version_no: 1, body: "script v1" }, as: Counselor, as_user_id: "${auth}", captures: { s1: $.data.id } }
