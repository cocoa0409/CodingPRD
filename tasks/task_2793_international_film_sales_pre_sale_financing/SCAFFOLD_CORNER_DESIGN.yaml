  # role_model: segregation_of_duties. Every one of the seven roles appears as
  # both an allow and a deny, the entity_backed Buyer scope is pinned, and both
  # §1.7 segregation-of-duties rules are reached.
  # ===========================================================================
  - section: rbac
    instances:

      - name: platform_admin_cannot_publish_execute_or_post_receipts_despite_owning_reference_data
        claim_type: per_role_deny
        grounds:
          - roles.PlatformAdmin
          - validations[priority=20]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          PlatformAdmin is an operational superuser for reference data and the clock but holds no
          deal-making authority, so it is refused on publish, execute and receipt while still being the
          only role that can register a market or patch a buyer. Treating "admin" as god-mode is
          detectable on the first of those three calls.
