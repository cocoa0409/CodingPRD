            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_a: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_TRIP_VERSION"

