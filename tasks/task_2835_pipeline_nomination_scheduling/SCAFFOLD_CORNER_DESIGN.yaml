              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/maintenance-events"
              payload: { segment_id: "${seg_id}", kind: "VALVE_REPAIR", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-04T00:00:00Z", capacity_derate_pct: 0.50 }
