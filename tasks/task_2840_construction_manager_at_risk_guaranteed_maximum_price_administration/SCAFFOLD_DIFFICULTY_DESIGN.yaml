      - name: milestone_variance_at_exact_threshold_and_at_the_half_up_rounding_boundary
        grounds:
          - calculations.estimate_milestone_variance
          - global_constants.MILESTONE_VARIANCE_THRESHOLD_PCT
          - global_constants.RATIO_PRECISION
          - validations.priority_110_ERR_VARIANCE_JUSTIFICATION_REQUIRED
          - state_machines.ProgressiveEstimate.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          variance_pct is quantised to four decimals with ROUND_HALF_UP BEFORE the strict
          comparison against MILESTONE_VARIANCE_THRESHOLD_PCT 0.0500. Three submissions off
          the same 38000000.00 reconciled basis separate the two behaviours that a naive
          implementation conflates: 39900000.00 is exactly 0.0500 and passes ungated,
          39901899.00 is 0.0500499737 which rounds DOWN to 0.0500 and still passes, and
          39901900.00 is exactly 0.05005 which rounds HALF UP to 0.0501 and is gated. An
          implementation comparing the unrounded ratio gates the middle case; one using
          ROUND_HALF_EVEN or truncation lets the third case through.
        test_recipe:
          setup:
            - "one CmarProject 'Eastbank Water Treatment Expansion' in gmp_status PRECONSTRUCTION"
            - "one RECONCILED ProgressiveEstimate at milestone SD with submitted_cost_of_work 38000000.00"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Eastbank Water Treatment Expansion", owner_org: "Eastbank Water Authority", cm_fee_pct: 0.04, insurance_rate: 0.01, precon_fee_amount: 180000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 38000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est_sd: $.data.id }
            - call: "POST /estimates/${est_sd}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est_sd}/reconcile"
              payload: { decision: "ACCEPT", reconciliation_note: "SD basis locked" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
          trigger:
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 39900000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { est_at: $.data.id, at_variance: $.data.variance_pct, at_basis: $.data.variance_basis }
            - call: "POST /estimates/${est_at}/submit"
              payload: {}
              as: ConstructionManager
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv3: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 39901899.00, expected_project_version: "${projv3}" }
              as: ConstructionManager
              captures: { est_down: $.data.id, down_variance: $.data.variance_pct }
            - call: "POST /estimates/${est_down}/submit"
              payload: {}
              as: ConstructionManager
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv4: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 39901900.00, expected_project_version: "${projv4}" }
              as: ConstructionManager
              captures: { est_up: $.data.id, up_variance: $.data.variance_pct }
            - call: "POST /estimates/${est_up}/submit"
              payload: {}
              as: ConstructionManager
          assert:
            - "${at_variance} == 0.0500 (1900000 / 38000000 == 0.05 exactly) and ${at_basis} == HIGHEST_RECONCILED_MILESTONE"
            - "ProgressiveEstimate.${est_at}.variance_basis_estimate_id == ${est_sd} and milestone_rank == 4"
            - "the second trigger call returns 200 and ProgressiveEstimate.${est_at}.status == SUBMITTED with justification_note == null, because 0.0500 > 0.0500 is False"
            - "${down_variance} == 0.0500 (1901899 / 38000000 == 0.0500499737 which ROUND_HALF_UP to four places is 0.0500)"
            - "the fifth trigger call returns 200 and ProgressiveEstimate.${est_down}.status == SUBMITTED"
            - "ProgressiveEstimate.${est_at}.status == SUPERSEDED and superseded_by_estimate_id == ${est_down}"
            - "${up_variance} == 0.0501 (1901900 / 38000000 == 0.05005 exactly, which ROUND_HALF_UP to four places is 0.0501)"
            - "the eighth trigger call returns 422 with error.code == ERR_VARIANCE_JUSTIFICATION_REQUIRED and ProgressiveEstimate.${est_up}.status == DRAFT"
            - "continuation - POST /estimates/${est_up}/submit with justification_note 'membrane system upgraded after the CD_100 pricing set' returns 200 and ProgressiveEstimate.${est_up}.status == SUBMITTED"
            - "ProgressiveEstimate.${est_sd}.status == RECONCILED and superseded_by_estimate_id == null (a RECONCILED estimate is never superseded)"

