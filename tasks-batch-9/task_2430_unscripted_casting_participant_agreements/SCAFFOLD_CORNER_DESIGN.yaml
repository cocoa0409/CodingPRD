      - name: welfare_surcharge_rounds_half_up_at_exactly_half_a_cent
        claim_type: precision
        grounds:
          - calculations.welfare_commitment_rollup
          - calculations.welfare_commitment_rollup.precision
          - entities.Production.fields.welfare_committed_cents
        distinguishing_aspect: |
          Precision claim on the exact .5 case. On an ENHANCED production the effective
          rate is 0.04 * 1.5 = 0.06, so a 25-cent subtotal yields 1.5 -> 2 and a
          75-cent subtotal yields 4.5 -> 5 under round_half_up. Banker's rounding sends
          4.5 to 4 and truncation sends both down, so welfare_committed_cents of 27
          and then 80 separates round_half_up from every other tie-breaking rule at
          the one input where they disagree. Sub-cent costs also confirm the surcharge
          is stored as whole cents rather than carried as a fraction into the total.
        test_recipe:
          setup:
            - "One COMPETITION_HIGH_STRESS production (duty_of_care_tier ENHANCED) with no protocols."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S2", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 2, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id, tier0: $.data.duty_of_care_tier, committed0: $.data.welfare_committed_cents }
          trigger:
            - call: "POST /casting/productions/${prod_id}/welfare-protocols"
