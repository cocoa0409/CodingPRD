            - call: "POST /v1/employment-certifications"
              payload: { borrower_id: "${brw_id}", employer_ein: "987654321", employer_type: "GOVERNMENT_FEDERAL", period_start_on: "2026-01-01", period_end_on: "2099-12-31", weekly_hours: 40 }
              as: LoanServicer
              as_user_id: "svc-1"
