          The cascade terminates in a third entity type: apply-to-record removes the violation
          (removal_reason ADJUDICATION_DISMISSED, time_weighted_severity 0.0), which drops the driver's
          adjudicated_attribution_score to 0.00 below COACHING_TRIGGER 12.0, which in turn waives the
