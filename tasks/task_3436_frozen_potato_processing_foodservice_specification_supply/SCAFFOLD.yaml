# =============================================================================
# SCAFFOLD — Frozen Potato Processing & Foodservice Specification Supply
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Frozen Potato Processing & Foodservice Specification Supply (J.R. Simplot):
  potato contracting with growers specifying variety, acreage and delivery
  windows with quality-based payment schedules, raw potato storage in
  controlled facilities to extend the processing season with sprout and
  disease management, processing line operations across cutting, blanching,
  coating and freezing with cut specification changes for different customers,
  foodservice customer specifications including cut size, coating and cook
  performance with sensory validation, capacity allocation among large chain
  customers with contracted volumes and shortage protocols, byproduct
  utilization for cattle feed and starch recovery, freight and cold chain
  distribution to distributors and restaurant operators, crop shortfall
  response with import sourcing or customer allocation.

domain_name: frozen-potato-processing
api_prefix: /potato-ops

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # plant weekly case capacity allocated among chain customers; shortage waterfall
  secondary_archetype: posture_driven_gating # storage facility posture (NORMAL/WATCH/QUARANTINED) gates all lot movement
  complexity_layers:
    - dual_variant_calculation               # provisional vs storage-adjusted final settlement; pro-rata vs waterfall shortage allocation
    - cascading_side_effects                 # credit-hold cascade: chain -> agreements -> runs -> lots (depth 4)
    - derived_field_reconciliation           # current_stock_cwt, released_unshipped_cases, fill_rate_pct stay in sync with sources
    - version_pinning_on_approval            # agreements pin spec version at activation; spec revision flags agreements stale
  entity_topology: flat                      # peer entities joined by FK references; no nested URL hierarchy
  state_machine_shape: cyclic                # contract amendment loop, spec revision loop, run rework loop
  relationship_patterns:
    - cross_aggregate                        # every link is a cross-aggregate FK (lot->contract, run->line/spec/agreement, ...)
  role_model: peer_roles                     # disjoint operational ownership per role
  consistency_model: immediate               # all mutations + cascades visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all links are FK references)
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: grower_code, type: string, source: input, description: "Unique grower code, e.g. GR-100" }
      - { name: legal_name, type: string, source: input, description: "Grower legal name" }
      - { name: region, type: enum, source: input, description: "COLUMBIA_BASIN | SNAKE_RIVER_VALLEY | RED_RIVER_VALLEY | MAINE_AROOSTOOK" }

  - name: CropContract
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; immutable after creation" }
      - { name: variety, type: enum, source: input, description: "RUSSET_BURBANK | RANGER_RUSSET | UMATILLA_RUSSET | CLEARWATER_RUSSET" }
      - { name: contracted_acres, type: number, source: input, description: "Contracted acres, must be > 0" }
      - { name: expected_yield_cwt_per_acre, type: number, source: input, description: "Expected yield in cwt per acre, must be > 0" }
      - { name: contracted_volume_cwt, type: number, source: computed, description: "Read-only = round_half_up(contracted_acres * expected_yield_cwt_per_acre, 1); recomputed when an amendment is accepted" }
      - { name: base_price_per_cwt_cents, type: integer, source: input, description: "Base price per cwt in cents, must be > 0" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Start of contracted delivery window (inclusive)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "End of contracted delivery window (inclusive); must be strictly after start" }
      - { name: pending_amendment, type: object, source: system, default: null, description: "Proposed replacement terms {contracted_acres, expected_yield_cwt_per_acre, base_price_per_cwt_cents, delivery_window_start, delivery_window_end} while status == AMENDMENT_PENDING; null otherwise" }
      - { name: delivered_volume_cwt, type: number, source: computed, description: "Read-only = sum of net_weight_cwt over the contract's PotatoLots with origin CONTRACTED (any status); disposal does not un-deliver" }
      - { name: settlement_amount_cents, type: integer, source: computed, default: null, description: "Read-only final settlement, computed once when the contract reaches FULFILLED or SHORTFALL_DECLARED; null before" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> AMENDMENT_PENDING -> ACTIVE (cycle) -> FULFILLED | SHORTFALL_DECLARED" }

  - name: PotatoLot
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> CropContract.id; required (and shortage_event_id forbidden) when delivering against a contract" }
      - { name: shortage_event_id, type: string, source: input, description: "FK -> ShortageEvent.id; required (and contract_id forbidden) for IMPORT sourcing lots" }
      - { name: facility_id, type: string, source: input, description: "FK -> StorageFacility.id; storage cell the lot is received into; immutable after creation" }
      - { name: origin, type: enum, source: system, description: "CONTRACTED when contract_id is given, IMPORT when shortage_event_id is given" }
      - { name: variety, type: enum, source: input, description: "RUSSET_BURBANK | RANGER_RUSSET | UMATILLA_RUSSET | CLEARWATER_RUSSET; must equal the contract's variety for CONTRACTED lots" }
      - { name: gross_weight_cwt, type: number, source: input, description: "Gross delivered weight in cwt, must be > 0" }
      - { name: tare_weight_cwt, type: number, source: input, description: "Tare weight in cwt, must be >= 0 and < gross_weight_cwt" }
      - { name: net_weight_cwt, type: number, source: computed, description: "Read-only = round_half_up(gross_weight_cwt - tare_weight_cwt, 2)" }
      - { name: defect_pct, type: number, source: input, description: "Measured defect percentage 0..100 at receiving" }
      - { name: specific_gravity, type: number, source: input, description: "Measured specific gravity at receiving, e.g. 1.085" }
      - { name: sugar_end_rating, type: number, source: input, description: "Fry-color sugar end rating 1.0..5.0 at receiving; lower is better" }
      - { name: grade, type: enum, source: computed, description: "Read-only A | B | C | REJECT per lot_quality_grade; REJECT lots are still persisted" }
      - { name: provisional_payment_cents, type: integer, source: computed, description: "Read-only payment estimate at receiving per lot_provisional_payment; null for IMPORT lots" }
      - { name: final_payment_cents, type: integer, source: computed, default: null, description: "Read-only final payment per contract_final_settlement; null until the contract settles; always null for IMPORT lots" }
      - { name: status, type: enum, source: system, description: "IN_STORAGE -> ALLOCATED -> CONSUMED; IN_STORAGE -> DISPOSED; ALLOCATED -> IN_STORAGE on run cancellation cascade" }
      - { name: disposition, type: enum, source: system, default: null, description: "CONDEMNED_WASTE | CATTLE_FEED | STARCH_RECOVERY; set when status becomes DISPOSED, else null" }

  - name: StorageFacility
    parent: null
    common_fields: true
    fields:
      - { name: facility_code, type: string, source: input, description: "Unique facility code, e.g. CELL-1" }
      - { name: capacity_cwt, type: integer, source: input, description: "Maximum stored cwt, must be > 0" }
      - { name: target_temp_f, type: number, source: input, description: "Target storage temperature Fahrenheit" }
      - { name: target_co2_pct, type: number, source: input, description: "Target CO2 percent" }
      - { name: current_stock_cwt, type: number, source: computed, description: "Read-only = sum of net_weight_cwt over lots with status IN_STORAGE in this facility; lots leave the sum when they become ALLOCATED or DISPOSED" }
      - { name: posture, type: enum, source: system, description: "NORMAL | WATCH | QUARANTINED, derived from the latest StorageReading per facility_posture; initial NORMAL" }
      - { name: recent_readings, type: array, source: system, description: "Append-only array of the 10 most recent reading objects {recorded_at, temperature_f, humidity_pct, co2_pct, sprout_index, disease_incidence_pct}; readings are immutable once recorded" }

  - name: ProcessingLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code, e.g. LINE-1" }
      - { name: supported_cut_families, type: array, source: input, description: "Non-empty array of STRAIGHT | CRINKLE | WEDGE | SHOESTRING the line can cut" }
      - { name: rated_throughput_cases_per_hour, type: integer, source: input, description: "Rated output in cases per hour, must be > 0" }

  - name: CutSpecification
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerChain.id; the chain customer that owns this specification" }
      - { name: spec_code, type: string, source: input, description: "Customer-unique specification code, e.g. SP-3814" }
      - { name: cut_family, type: enum, source: input, description: "STRAIGHT | CRINKLE | WEDGE | SHOESTRING" }
      - { name: cut_size_mm, type: number, source: input, description: "Cut cross-section in millimeters, must be > 0" }
      - { name: coating_type, type: enum, source: input, description: "NONE | CLEAR | SEASONED | BATTER" }
      - { name: target_color_units, type: number, source: input, description: "Target post-cook fry color on the 0..4 unit scale" }
      - { name: max_cook_time_sec, type: integer, source: input, description: "Maximum cook time in seconds, must be > 0" }
      - { name: sensory_panel_required, type: boolean, source: input, default: true, description: "Whether a sensory panel score is mandatory before validation; when false, validate still requires a panel_score input but any score >= 0 passes" }
      - { name: panel_score, type: number, source: system, default: null, description: "Most recent sensory panel score recorded by validate; null until first validation" }
      - { name: ever_locked, type: boolean, source: system, default: false, description: "Set true the first time the spec reaches LOCKED; never cleared" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VALIDATED -> LOCKED -> REVISION_REQUESTED -> (LOCKED if ever_locked else VALIDATED); VALIDATED -> REVISION_REQUESTED" }

  - name: CustomerChain
    parent: null
    common_fields: true
    fields:
      - { name: chain_code, type: string, source: input, description: "Unique chain code, e.g. CH-BURGER" }
      - { name: legal_name, type: string, source: input, description: "Chain legal name" }
      - { name: priority_tier, type: enum, source: input, description: "TIER_1_STRATEGIC | TIER_2_PREFERRED | TIER_3_STANDARD; drives shortage waterfall order" }
      - { name: credit_status, type: enum, source: system, description: "GOOD_STANDING | ON_HOLD; initial GOOD_STANDING; drives the agreement suspension cascade" }
      - { name: fill_rate_pct, type: number, source: system, default: null, description: "Read-only = round_half_up(100 * delivered_cases / (delivered_cases + rejected_cases), 1) across all of the chain's terminal shipments; null until the first DELIVERED or REJECTED_ON_ARRIVAL shipment" }

  - name: SupplyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerChain.id" }
      - { name: spec_id, type: string, source: input, description: "FK -> CutSpecification.id; the locked cut specification this agreement buys against" }
      - { name: weekly_contracted_cases, type: integer, source: input, description: "Contracted cases per week, must be >= 1" }
      - { name: price_per_case_cents, type: integer, source: input, description: "Sell price per case in cents, must be > 0" }
      - { name: term_start, type: datetime, source: input, description: "Agreement term start (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "Agreement term end (inclusive); must be strictly after term_start" }
      - { name: pinned_spec_version, type: integer, source: system, default: null, description: "CutSpecification.version captured at activation (and re-captured on re-ack); null while DRAFT" }
      - { name: spec_stale, type: boolean, source: system, default: false, description: "Set true when the pinned spec enters REVISION_REQUESTED; cleared by re-ack via activate" }
      - { name: under_sla_review, type: boolean, source: system, default: false, description: "Set true when the chain's fill_rate_pct drops below FILL_RATE_FLOOR_PCT; cleared when a later delivery lifts fill_rate_pct back to >= the floor" }
      - { name: current_week_allocation_cases, type: integer, source: system, description: "Cases this agreement may ship in the current week; initialized to weekly_contracted_cases at activation; overwritten by shortage execute-allocation" }
      - { name: lifetime_released_cases, type: integer, source: computed, description: "Read-only = sum of actual_cases over RELEASED ProductionRuns of this agreement" }
      - { name: lifetime_shipped_cases, type: integer, source: computed, description: "Read-only = sum of cases_shipped over this agreement's shipments with status IN_TRANSIT or DELIVERED; REJECTED_ON_ARRIVAL cases are NOT returned to inventory" }
      - { name: released_unshipped_cases, type: integer, source: computed, description: "Read-only = lifetime_released_cases - lifetime_shipped_cases" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUSPENDED -> ACTIVE (credit cascade); ACTIVE -> ACTIVE self-loop re-ack when spec_stale; ACTIVE -> COMPLETED by clock sweep at term_end" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProcessingLine.id" }
      - { name: spec_id, type: string, source: input, description: "FK -> CutSpecification.id; must be LOCKED at creation" }
      - { name: agreement_id, type: string, source: input, description: "FK -> SupplyAgreement.id; must be ACTIVE, not spec_stale, and its customer must be in GOOD_STANDING" }
      - { name: input_lot_ids, type: array, source: input, description: "Non-empty array of PotatoLot ids to consume whole; each lot must be IN_STORAGE in a non-QUARANTINED facility" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned run start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned run end (exclusive); must be strictly after scheduled_start" }
      - { name: cut_family, type: enum, source: system, description: "Copied from the spec at creation; drives yield and changeover rules" }
      - { name: total_input_cwt, type: number, source: computed, description: "Read-only = sum of net_weight_cwt over input_lot_ids" }
      - { name: actual_cases, type: integer, source: computed, default: null, description: "Read-only; computed on each entry into QA_HOLD per run_actual_cases; null before first QA_HOLD" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of QA_HOLD -> REWORK cycles this run has taken" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CUTTING -> BLANCHING -> COATING -> FREEZING -> QA_HOLD -> RELEASED | REJECTED; QA_HOLD -> REWORK -> COATING (cycle); SCHEDULED -> CANCELLED (credit-hold cascade only)" }

  - name: ByproductBatch
    parent: null
    common_fields: false
    fields:
      - { name: source_lot_id, type: string, source: system, description: "FK -> PotatoLot.id; set when the batch comes from a disposed lot, else null" }
      - { name: source_run_id, type: string, source: system, description: "FK -> ProductionRun.id; set when the batch comes from a rejected run, else null" }
      - { name: stream, type: enum, source: system, description: "WHOLE_LOT (lot disposal) | REJECTED_PRODUCT (run rejection)" }
      - { name: routing, type: enum, source: system, description: "CONDEMNED_WASTE | CATTLE_FEED | STARCH_RECOVERY; copied from the triggering disposition" }
      - { name: weight_cwt, type: number, source: system, description: "Batch weight: the disposed lot's net_weight_cwt, or the rejected run's total_input_cwt" }
      - { name: unit_revenue_cents_per_cwt, type: integer, source: system, description: "Tariff by routing: CATTLE_FEED 900, STARCH_RECOVERY 1400, CONDEMNED_WASTE 0" }
      - { name: total_revenue_cents, type: integer, source: computed, description: "Read-only = round_half_up(weight_cwt * unit_revenue_cents_per_cwt, 0)" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> SupplyAgreement.id; must be ACTIVE and not under_sla_review" }
      - { name: carrier_name, type: string, source: input, description: "Carrier legal name" }
      - { name: trailer_setpoint_f, type: number, source: input, description: "Trailer temperature setpoint Fahrenheit; must be <= 0.0 (frozen cold chain)" }
      - { name: route_type, type: enum, source: input, description: "DIRECT_CHAIN | DISTRIBUTOR" }
      - { name: lines, type: array, source: input, description: "Non-empty array of {run_id, cases}; every run must be RELEASED and belong to this agreement; total cases must be <= agreement.released_unshipped_cases" }
      - { name: cases_shipped, type: integer, source: computed, description: "Read-only = sum of lines[].cases" }
      - { name: max_transit_temp_f, type: number, source: system, default: null, description: "Highest transit temperature recorded at delivery; null until DELIVERED" }
      - { name: minutes_above_setpoint, type: integer, source: system, default: null, description: "Minutes the trailer spent above its setpoint; null until DELIVERED" }
      - { name: excursion_flag, type: boolean, source: system, default: false, description: "Set at delivery when minutes_above_setpoint > EXCURSION_LIMIT_MINUTES (30)" }
      - { name: invoice_cents, type: integer, source: computed, default: null, description: "Read-only; computed at DELIVERED per shipment_invoice_and_credit; null while IN_TRANSIT or when REJECTED_ON_ARRIVAL" }
      - { name: credit_memo_cents, type: integer, source: computed, default: null, description: "Read-only; computed at REJECTED_ON_ARRIVAL per shipment_invoice_and_credit; null otherwise" }
      - { name: status, type: enum, source: system, description: "IN_TRANSIT (at creation) -> DELIVERED | REJECTED_ON_ARRIVAL" }

  - name: ShortageEvent
    parent: null
    common_fields: true
    fields:
      - { name: scope_variety, type: enum, source: input, description: "RUSSET_BURBANK | RANGER_RUSSET | UMATILLA_RUSSET | CLEARWATER_RUSSET the shortfall applies to" }
      - { name: declared_deficit_cwt, type: number, source: input, description: "Estimated raw-potato deficit in cwt, must be > 0" }
      - { name: available_week_cases, type: integer, source: input, description: "Finished-case pool available for allocation this week, 1..100000" }
      - { name: response_mode, type: enum, source: input, description: "PRO_RATA | PRIORITY_WATERFALL; selects the shortage_allocation variant" }
      - { name: status, type: enum, source: system, description: "OPEN -> EXECUTED (via execute-allocation); IMPORT lots may be created only while OPEN" }
      - { name: allocation_results, type: array, source: system, default: null, description: "Per-agreement [{agreement_id, allocated_cases}] written by execute-allocation; null while OPEN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CropContract
    initial_state: DRAFT
    terminal_states: [FULFILLED, SHORTFALL_DECLARED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /potato-ops/crop-contracts/{id}/activate"
        actor: GrowerRelationsManager
        preconditions:
          - "Contract must be DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "Grower referenced by grower_id must exist (ERR_GROWER_NOT_FOUND)"
        side_effects:
          - "status -> ACTIVE; increments CropContract.version by 1"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /potato-ops/crop-contracts/{id}/propose-amendment"
        actor: GrowerRelationsManager
        preconditions:
          - "Contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "pending_amendment <- request terms; status -> AMENDMENT_PENDING; increments version by 1"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /potato-ops/crop-contracts/{id}/accept-amendment"
        actor: GrowerRelationsManager
        preconditions:
          - "Contract must be AMENDMENT_PENDING (ERR_CONTRACT_NOT_IN_AMENDMENT)"
          - "expected_crop_contract_version must equal current version (ERR_STALE_VERSION, 412)"
          - "Amended delivery window must not overlap a sibling contract window per delivery_window_overlap (ERR_DELIVERY_WINDOW_OVERLAP)"
        side_effects:
          - "Apply pending_amendment fields onto the contract; pending_amendment <- null"
          - "Recompute contracted_volume_cwt from amended acres x yield"
          - "status -> ACTIVE; increments version by 1"
      - from: ACTIVE
        to: SHORTFALL_DECLARED
        trigger: "POST /potato-ops/crop-contracts/{id}/declare-shortfall"
        actor: GrowerRelationsManager
        preconditions:
          - "Contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "status -> SHORTFALL_DECLARED; increments version by 1"
          - "Run contract_final_settlement: write final_payment_cents on every non-DISPOSED CONTRACTED lot and settlement_amount_cents on the contract"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (automatic on PotatoLot creation when delivered_volume_cwt reaches >= 98% of contracted_volume_cwt)"
        actor: system
        preconditions:
          - "delivered_volume_cwt >= round_half_up(0.98 * contracted_volume_cwt, 1) immediately after the new lot is counted"
        side_effects:
          - "status -> FULFILLED; increments version by 1"
          - "Run contract_final_settlement exactly as for SHORTFALL_DECLARED"

  - entity: PotatoLot
    initial_state: IN_STORAGE
    terminal_states: [CONSUMED, DISPOSED]
    transitions:
      - from: IN_STORAGE
        to: ALLOCATED
        trigger: "system (when the lot is listed in POST /potato-ops/production-runs input_lot_ids)"
        actor: system
        preconditions:
          - "Lot status IN_STORAGE (ERR_LOT_NOT_AVAILABLE)"
          - "Lot's facility posture != QUARANTINED (ERR_FACILITY_QUARANTINED)"
        side_effects:
          - "status -> ALLOCATED; facility.current_stock_cwt decreases by lot.net_weight_cwt; increments version by 1"
      - from: ALLOCATED
        to: CONSUMED
        trigger: "system (when the consuming run reaches RELEASED or REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CONSUMED; increments version by 1"
      - from: ALLOCATED
        to: IN_STORAGE
        trigger: "system (credit-hold cascade: consuming run is CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> IN_STORAGE; facility.current_stock_cwt increases by lot.net_weight_cwt; increments version by 1"
      - from: IN_STORAGE
        to: DISPOSED
        trigger: "POST /potato-ops/potato-lots/{id}/dispose"
        actor: QualityAssuranceLead
        preconditions:
          - "Lot status IN_STORAGE (ERR_LOT_NOT_AVAILABLE)"
          - "disposition in {CONDEMNED_WASTE, CATTLE_FEED, STARCH_RECOVERY} (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> DISPOSED; disposition <- request value; increments version by 1"
          - "facility.current_stock_cwt decreases by lot.net_weight_cwt"
          - "Create ByproductBatch {stream: WHOLE_LOT, routing <- disposition, weight_cwt <- lot.net_weight_cwt, source_lot_id <- lot.id}"

  - entity: StorageFacility
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: WATCH
        trigger: "system (on POST .../readings when latest reading crosses a WATCH threshold)"
        actor: system
        preconditions: ["facility_posture(latest reading) == WATCH"]
        side_effects: ["posture -> WATCH; increments version by 1"]
      - from: NORMAL
        to: QUARANTINED
        trigger: "system (on POST .../readings when latest reading crosses a QUARANTINE threshold)"
        actor: system
        preconditions: ["facility_posture(latest reading) == QUARANTINED"]
        side_effects: ["posture -> QUARANTINED; increments version by 1"]
      - from: WATCH
        to: NORMAL
        trigger: "system (on POST .../readings when latest reading clears all thresholds)"
        actor: system
        preconditions: ["facility_posture(latest reading) == NORMAL"]
        side_effects: ["posture -> NORMAL; increments version by 1"]
      - from: WATCH
        to: QUARANTINED
        trigger: "system (on POST .../readings)"
        actor: system
        preconditions: ["facility_posture(latest reading) == QUARANTINED"]
        side_effects: ["posture -> QUARANTINED; increments version by 1"]
      - from: QUARANTINED
        to: WATCH
        trigger: "system (on POST .../readings)"
        actor: system
        preconditions: ["facility_posture(latest reading) == WATCH"]
        side_effects: ["posture -> WATCH; increments version by 1"]
      - from: QUARANTINED
        to: NORMAL
        trigger: "system (on POST .../readings)"
        actor: system
        preconditions: ["facility_posture(latest reading) == NORMAL"]
        side_effects: ["posture -> NORMAL; increments version by 1"]

  - entity: CutSpecification
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /potato-ops/cut-specifications/{id}/validate"
        actor: QualityAssuranceLead
        preconditions:
          - "Spec status SUBMITTED or REVISION_REQUESTED (ERR_SPEC_NOT_AWAITING_VALIDATION)"
          - "panel_score >= 7.0 when sensory_panel_required is true (ERR_PANEL_SCORE_BELOW_STANDARD)"
        side_effects:
          - "panel_score <- request value; status -> VALIDATED; increments version by 1"
      - from: REVISION_REQUESTED
        to: VALIDATED
        trigger: "POST /potato-ops/cut-specifications/{id}/validate (spec never previously locked)"
        actor: QualityAssuranceLead
        preconditions:
          - "Spec status SUBMITTED or REVISION_REQUESTED (ERR_SPEC_NOT_AWAITING_VALIDATION)"
          - "panel_score >= 7.0 when sensory_panel_required is true (ERR_PANEL_SCORE_BELOW_STANDARD)"
          - "ever_locked == false for this branch"
        side_effects:
          - "panel_score <- request value; status -> VALIDATED; increments version by 1"
      - from: REVISION_REQUESTED
        to: LOCKED
        trigger: "POST /potato-ops/cut-specifications/{id}/validate (spec previously locked)"
        actor: QualityAssuranceLead
        preconditions:
          - "Spec status REVISION_REQUESTED (ERR_SPEC_NOT_AWAITING_VALIDATION)"
          - "panel_score >= 7.0 when sensory_panel_required is true (ERR_PANEL_SCORE_BELOW_STANDARD)"
          - "ever_locked == true for this branch"
        side_effects:
          - "panel_score <- request value; status -> LOCKED; increments version by 1"
          - "Agreements pinned to this spec keep spec_stale == true until re-acked"
      - from: VALIDATED
        to: LOCKED
        trigger: "system (when the first SupplyAgreement referencing this spec is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> LOCKED; ever_locked <- true; increments version by 1"
      - from: VALIDATED
        to: REVISION_REQUESTED
        trigger: "POST /potato-ops/cut-specifications/{id}/request-revision"
        actor: ChainCustomer
        preconditions:
          - "Spec status VALIDATED or LOCKED (ERR_SPEC_NOT_REVISIONABLE)"
          - "X-User-ID must equal spec.customer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "status -> REVISION_REQUESTED; increments version by 1"
      - from: LOCKED
        to: REVISION_REQUESTED
        trigger: "POST /potato-ops/cut-specifications/{id}/request-revision"
        actor: ChainCustomer
        preconditions:
          - "Spec status VALIDATED or LOCKED (ERR_SPEC_NOT_REVISIONABLE)"
          - "X-User-ID must equal spec.customer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "status -> REVISION_REQUESTED; increments version by 1"
          - "Every SupplyAgreement with pinned_spec_version == this spec's pre-revision version and status ACTIVE gets spec_stale <- true"

  - entity: CustomerChain
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: ON_HOLD
        trigger: "POST /potato-ops/customer-chains/{id}/set-credit-status {credit_status: ON_HOLD}"
        actor: AccountManager
        preconditions:
          - "credit_status must differ from current value (ERR_INVALID_STATE)"
        side_effects:
          - "credit_status -> ON_HOLD; increments version by 1"
          - "CASCADE link 1: every SupplyAgreement of this chain with status ACTIVE -> SUSPENDED (its reserved weekly cases are released back to the plant pool)"
          - "CASCADE link 2 (per suspended agreement): every ProductionRun of that agreement with status SCHEDULED -> CANCELLED"
          - "CASCADE link 3 (per cancelled run): every input PotatoLot ALLOCATED -> IN_STORAGE and its facility.current_stock_cwt increases by lot.net_weight_cwt"
      - from: ON_HOLD
        to: GOOD_STANDING
        trigger: "POST /potato-ops/customer-chains/{id}/set-credit-status {credit_status: GOOD_STANDING}"
        actor: AccountManager
        preconditions:
          - "credit_status must differ from current value (ERR_INVALID_STATE)"
        side_effects:
          - "credit_status -> GOOD_STANDING; increments version by 1"
          - "Every SUSPENDED SupplyAgreement of this chain -> ACTIVE (reserving its weekly_contracted_cases again; ERR_WEEK_CAPACITY_EXCEEDED if the pool cannot refit all of them, in which case the whole set-credit-status fails and nothing changes)"
          - "Cancelled runs and deallocated lots are NOT resurrected"

  - entity: SupplyAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /potato-ops/supply-agreements/{id}/activate"
        actor: AccountManager
        preconditions:
          - "Agreement DRAFT, or ACTIVE with spec_stale == true (ERR_AGREEMENT_NOT_ACTIVABLE)"
          - "CustomerChain.credit_status == GOOD_STANDING (ERR_CREDIT_HOLD_ACTIVE)"
          - "Spec status VALIDATED or LOCKED (ERR_SPEC_NOT_VALIDATED)"
          - "Plant weekly pool can absorb weekly_contracted_cases (ERR_WEEK_CAPACITY_EXCEEDED)"
        side_effects:
          - "status -> ACTIVE; pinned_spec_version <- spec.version; spec_stale <- false"
          - "current_week_allocation_cases <- weekly_contracted_cases"
          - "Reserve weekly_contracted_cases from the plant weekly pool"
          - "If spec was VALIDATED: spec -> LOCKED, ever_locked <- true"
          - "increments version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /potato-ops/supply-agreements/{id}/activate (re-ack of a stale spec pin)"
        actor: AccountManager
        preconditions:
          - "Agreement ACTIVE and spec_stale == true (ERR_AGREEMENT_NOT_ACTIVABLE)"
          - "Spec status LOCKED (ERR_SPEC_NOT_LOCKED)"
        side_effects:
          - "pinned_spec_version <- spec.version; spec_stale <- false; increments version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (credit-hold cascade from CustomerChain.set-credit-status ON_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUSPENDED; increments version by 1"
          - "Release weekly_contracted_cases back to the plant weekly pool"
          - "Cascade: SCHEDULED runs of this agreement -> CANCELLED (which deallocates their lots)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (credit-release cascade from CustomerChain.set-credit-status GOOD_STANDING)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ACTIVE; increments version by 1"
          - "Reserve weekly_contracted_cases from the plant weekly pool"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (clock sweep: POST /_clock/set_current_utc advances the logical clock past term_end)"
        actor: system
        preconditions: ["logical clock >= term_end"]
        side_effects:
          - "status -> COMPLETED; increments version by 1"
          - "Release weekly_contracted_cases back to the plant weekly pool"

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [RELEASED, REJECTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CUTTING
        trigger: "POST /potato-ops/production-runs/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["status in {SCHEDULED, CUTTING, BLANCHING, COATING, FREEZING, REWORK} (ERR_RUN_INVALID_STAGE)"]
        side_effects: ["status -> CUTTING; increments version by 1"]
      - from: CUTTING
        to: BLANCHING
        trigger: "POST /potato-ops/production-runs/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["status in {SCHEDULED, CUTTING, BLANCHING, COATING, FREEZING, REWORK} (ERR_RUN_INVALID_STAGE)"]
        side_effects: ["status -> BLANCHING; increments version by 1"]
      - from: BLANCHING
        to: COATING
        trigger: "POST /potato-ops/production-runs/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["status in {SCHEDULED, CUTTING, BLANCHING, COATING, FREEZING, REWORK} (ERR_RUN_INVALID_STAGE)"]
        side_effects: ["status -> COATING; increments version by 1"]
      - from: COATING
        to: FREEZING
        trigger: "POST /potato-ops/production-runs/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["status in {SCHEDULED, CUTTING, BLANCHING, COATING, FREEZING, REWORK} (ERR_RUN_INVALID_STAGE)"]
        side_effects: ["status -> FREEZING; increments version by 1"]
      - from: FREEZING
        to: QA_HOLD
        trigger: "POST /potato-ops/production-runs/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["status in {SCHEDULED, CUTTING, BLANCHING, COATING, FREEZING, REWORK} (ERR_RUN_INVALID_STAGE)"]
        side_effects:
          - "status -> QA_HOLD; increments version by 1"
          - "Compute actual_cases per run_actual_cases"
      - from: REWORK
        to: COATING
        trigger: "POST /potato-ops/production-runs/{id}/advance"
        actor: ProductionPlanner
        preconditions: ["status in {SCHEDULED, CUTTING, BLANCHING, COATING, FREEZING, REWORK} (ERR_RUN_INVALID_STAGE)"]
        side_effects: ["status -> COATING; increments version by 1"]
      - from: QA_HOLD
        to: REWORK
        trigger: "POST /potato-ops/production-runs/{id}/rework"
        actor: QualityAssuranceLead
        preconditions: ["status == QA_HOLD (ERR_RUN_INVALID_STAGE)"]
        side_effects:
          - "status -> REWORK; rework_count += 1; increments version by 1"
      - from: QA_HOLD
        to: RELEASED
        trigger: "POST /potato-ops/production-runs/{id}/qa-release"
        actor: QualityAssuranceLead
        preconditions:
          - "status == QA_HOLD (ERR_RUN_INVALID_STAGE)"
          - "abs(measured_color_units - spec.target_color_units) <= 0.5 (ERR_COLOR_OUT_OF_TOLERANCE)"
        side_effects:
          - "status -> RELEASED; increments version by 1"
          - "All input lots ALLOCATED -> CONSUMED"
          - "agreement.lifetime_released_cases increases by actual_cases"
      - from: QA_HOLD
        to: REJECTED
        trigger: "POST /potato-ops/production-runs/{id}/reject"
        actor: QualityAssuranceLead
        preconditions:
          - "status == QA_HOLD (ERR_RUN_INVALID_STAGE)"
          - "disposition in {CONDEMNED_WASTE, CATTLE_FEED} (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> REJECTED; increments version by 1"
          - "All input lots ALLOCATED -> CONSUMED"
          - "Create ByproductBatch {stream: REJECTED_PRODUCT, routing <- disposition, weight_cwt <- run.total_input_cwt, source_run_id <- run.id}"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (credit-hold cascade: the run's agreement is SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CANCELLED; increments version by 1"
          - "All input lots ALLOCATED -> IN_STORAGE; each lot's facility.current_stock_cwt increases by lot.net_weight_cwt"

  - entity: Shipment
    initial_state: IN_TRANSIT
    terminal_states: [DELIVERED, REJECTED_ON_ARRIVAL]
    transitions:
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /potato-ops/shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions: ["status == IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"]
        side_effects:
          - "status -> DELIVERED; max_transit_temp_f / minutes_above_setpoint recorded; increments version by 1"
          - "excursion_flag <- (minutes_above_setpoint > 30)"
          - "Compute invoice_cents per shipment_invoice_and_credit"
          - "Recompute chain.fill_rate_pct; if it is now >= 85.0, clear under_sla_review on all of the chain's agreements"
      - from: IN_TRANSIT
        to: REJECTED_ON_ARRIVAL
        trigger: "POST /potato-ops/shipments/{id}/reject-on-arrival"
        actor: LogisticsCoordinator
        preconditions: ["status == IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"]
        side_effects:
          - "status -> REJECTED_ON_ARRIVAL; increments version by 1"
          - "Compute credit_memo_cents per shipment_invoice_and_credit (cases are NOT returned to released_unshipped_cases)"
          - "Recompute chain.fill_rate_pct; if it is now < 85.0, set under_sla_review <- true on every ACTIVE agreement of the chain"

  - entity: ShortageEvent
    initial_state: OPEN
    terminal_states: [EXECUTED]
    transitions:
      - from: OPEN
        to: EXECUTED
        trigger: "POST /potato-ops/shortage-events/{id}/execute-allocation"
        actor: GrowerRelationsManager
        preconditions: ["status == OPEN (ERR_SHORTAGE_EVENT_NOT_OPEN)"]
        side_effects:
          - "Run shortage_allocation with the event's response_mode over all ACTIVE SupplyAgreements"
          - "Write each agreement.current_week_allocation_cases; write allocation_results; status -> EXECUTED; increments version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on the parent version)
# =============================================================================
concurrency_rules:
  - rule_id: contract-amend-accept-stale
    parent_entity: CropContract
    write_endpoint: "POST /potato-ops/crop-contracts/{id}/accept-amendment"
    occ_field: expected_crop_contract_version
    description: |
      Accepting a pending amendment against a CropContract whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has modified the contract (e.g. a lot delivery
      flipped it to FULFILLED, or a prior accept already applied) and the
      current writer's view of the contract is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contracted_volume_cwt
    trigger: "CropContract creation and accept-amendment"
    algorithm: aggregation
    formula: |
      contracted_volume_cwt = round_half_up(contracted_acres * expected_yield_cwt_per_acre, 1)
    input_set: "The contract's own current acres/yield fields"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: lot_quality_grade
    trigger: "PotatoLot creation"
    algorithm: threshold
    formula: |
      1. REJECT override: if defect_pct >= REJECT_DEFECT_PCT (8.0) -> REJECT,
         regardless of the other metrics.
      2. Per-metric tiers (>= / <= boundaries exactly as written):
         defect tier:  A if defect_pct < 3.0; B if defect_pct < 5.0; else C
         gravity tier: A if specific_gravity >= 1.080; B if >= 1.070; C if >= 1.060; else REJECT
         sugar tier:   A if sugar_end_rating <= 2.0; B if <= 3.0; C if <= 4.0; else REJECT
      3. grade = worst of the three tiers (ordering A > B > C > REJECT);
         any REJECT tier makes the lot REJECT.
    input_set: "The new lot's defect_pct, specific_gravity, sugar_end_rating"
    constants:
      REJECT_DEFECT_PCT: 8.0
      DEFECT_A_MAX: 3.0
      DEFECT_B_MAX: 5.0
      GRAVITY_A_MIN: 1.080
      GRAVITY_B_MIN: 1.070
      GRAVITY_C_MIN: 1.060
      SUGAR_A_MAX: 2.0
      SUGAR_B_MAX: 3.0
      SUGAR_C_MAX: 4.0
    precision: "inputs compared as given; no rounding"

  - name: lot_provisional_payment
    trigger: "PotatoLot creation (CONTRACTED origin only; IMPORT lots get null)"
    algorithm: aggregation
    formula: |
      provisional_payment_cents = round_half_up(net_weight_cwt * base_price_per_cwt_cents * GRADE_MULT[grade], 0)
      GRADE_MULT: A 1.08, B 1.03, C 0.88, REJECT 0.00
      Rounding order is pinned: multiply exactly, then round the single per-lot
      product to whole cents. Contract-level totals always sum these
      already-rounded per-lot values; never round a second time.
    input_set: "The new lot (net_weight_cwt, grade) and its contract's base_price_per_cwt_cents"
    constants:
      GRADE_A_MULT: 1.08
      GRADE_B_MULT: 1.03
      GRADE_C_MULT: 0.88
      GRADE_REJECT_MULT: 0.0
    precision: "0 decimal places (whole cents), round_half_up, per lot"

  - name: storage_loss_pct
    trigger: "contract_final_settlement (per lot)"
    algorithm: decay_function
    formula: |
      days_in_storage = floor((settlement_clock - lot.created_at) / 86400 seconds), minimum 0
      raw_loss_pct = days_in_storage * DAILY_LOSS_PCT * POSTURE_FACTOR[facility.posture at settlement time]
      storage_loss_pct = min(raw_loss_pct, MAX_LOSS_PCT)
      POSTURE_FACTOR: NORMAL 1.0, WATCH 1.5, QUARANTINED 3.0
    input_set: "The lot's created_at, the facility's posture at settlement time, the logical clock"
    constants:
      DAILY_LOSS_PCT: 0.02
      POSTURE_FACTOR_NORMAL: 1.0
      POSTURE_FACTOR_WATCH: 1.5
      POSTURE_FACTOR_QUARANTINED: 3.0
      MAX_LOSS_PCT: 15.0
    precision: "2 decimal places on storage_loss_pct, round_half_up"

  - name: contract_final_settlement
    trigger: "CropContract entering FULFILLED or SHORTFALL_DECLARED"
    algorithm: chronological
    formula: |
      Evaluation order is PINNED to break the grade<->shrinkage circle:
      1. For each lot of the contract with origin CONTRACTED and status != DISPOSED,
         in lot.created_at ASC order:
         a. storage_loss_pct <- storage_loss_pct(lot)   [computed FIRST, from raw values]
         b. shrinkage_cwt = round_half_up(lot.net_weight_cwt * storage_loss_pct / 100, 2)
         c. final_net_cwt = lot.net_weight_cwt - shrinkage_cwt
         d. final_grade = lot.grade; if storage_loss_pct > DOWNGRADE_LOSS_PCT (10.0)
            downgrade one tier (A->B, B->C, C->C; REJECT stays REJECT)
         e. lot.final_payment_cents = round_half_up(final_net_cwt * base_price_per_cwt_cents * GRADE_MULT[final_grade], 0)
      2. Lots with status DISPOSED get final_payment_cents = 0.
      3. settlement_amount_cents = sum of per-lot final_payment_cents (already rounded;
         no second rounding).
    input_set: "All PotatoLots of the contract with origin CONTRACTED (any status)"
    constants:
      DOWNGRADE_LOSS_PCT: 10.0
    precision: "per-lot whole cents, round_half_up; settlement is the unrounded sum of rounded lots"
    variants:
      - name: provisional
        when: "At lot receiving (lot_provisional_payment)"
        difference: "Uses receiving-time grade and full net_weight_cwt; no storage shrinkage, no downgrade"
      - name: final
        when: "At contract settlement (this calculation)"
        difference: "Uses storage-adjusted final_net_cwt and a possibly downgraded final_grade; diverges from provisional whenever storage_loss_pct > 0"

  - name: facility_posture
    trigger: "POST /potato-ops/storage-facilities/{id}/readings"
    algorithm: threshold
    formula: |
      latest = the reading with the greatest recorded_at in recent_readings
      (tie-break: greatest created_at order of recording, i.e. last appended wins)
      if latest.disease_incidence_pct >= QUARANTINE_DISEASE_PCT (6.0)
         or latest.sprout_index >= QUARANTINE_SPROUT (4.0) -> QUARANTINED
      elif latest.disease_incidence_pct >= WATCH_DISEASE_PCT (3.0)
         or latest.sprout_index >= WATCH_SPROUT (2.0) -> WATCH
      else -> NORMAL
      Boundaries are inclusive: sprout_index == 2.0 exactly is WATCH.
    input_set: "The facility's recent_readings array"
    constants:
      QUARANTINE_DISEASE_PCT: 6.0
      QUARANTINE_SPROUT: 4.0
      WATCH_DISEASE_PCT: 3.0
      WATCH_SPROUT: 2.0
    precision: "inputs compared as given"

  - name: run_actual_cases
    trigger: "ProductionRun entering QA_HOLD (first pass and every rework pass)"
    algorithm: threshold
    formula: |
      if rework_count == 0 (first QA_HOLD entry):
        actual_cases = floor(total_input_cwt * YIELD_CASES_PER_CWT[cut_family])
      else (re-entry after a rework cycle):
        actual_cases = floor(previous_actual_cases * (1 - REWORK_LOSS_PCT))
      YIELD_CASES_PER_CWT: STRAIGHT 0.62, CRINKLE 0.58, WEDGE 0.66, SHOESTRING 0.55
    input_set: "The run's total_input_cwt, cut_family, rework_count, previous actual_cases"
    constants:
      YIELD_STRAIGHT: 0.62
      YIELD_CRINKLE: 0.58
      YIELD_WEDGE: 0.66
      YIELD_SHOESTRING: 0.55
      REWORK_LOSS_PCT: 0.04
    precision: "floor to whole cases at each pass"

  - name: weekly_capacity_reservation
    trigger: "SupplyAgreement activate / system suspend-resume / clock-sweep completion"
    algorithm: aggregation
    formula: |
      PLANT_WEEK_CAPACITY_CASES = 100000 (plant-wide constant)
      reserved_cases = sum of weekly_contracted_cases over SupplyAgreements with status == ACTIVE
      pool_remaining = PLANT_WEEK_CAPACITY_CASES - reserved_cases
      Activation requires pool_remaining >= the agreement's weekly_contracted_cases
      (boundary: reserving the pool down to exactly 0 succeeds).
    input_set: "All SupplyAgreements with status == ACTIVE"
    constants:
      PLANT_WEEK_CAPACITY_CASES: 100000
    precision: "whole cases; integers"

  - name: shortage_allocation
    trigger: "ShortageEvent execute-allocation"
    algorithm: waterfall_allocation
    formula: |
      Participants: SupplyAgreements with status == ACTIVE at execution time
      (SUSPENDED and COMPLETED are excluded). D = event.available_week_cases.
      variant PRO_RATA:
        total_weekly = sum of participants' weekly_contracted_cases
        each participant gets min(weekly_contracted_cases,
        floor(D * weekly_contracted_cases / total_weekly)) — the cap keeps a
        thin participant set from over-allocating past contract;
        the leftover (D - sum of allocations) stays unallocated in the pool.
      variant PRIORITY_WATERFALL:
        order participants by customer priority_tier ASC (TIER_1_STRATEGIC first,
        then TIER_2_PREFERRED, then TIER_3_STANDARD); ties by agreement.created_at ASC;
        fill each in turn with min(weekly_contracted_cases, remaining); stop when
        remaining == 0 or participants are exhausted.
      Both variants write agreement.current_week_allocation_cases and the event's
      allocation_results in the same per-participant order they were computed.
      Empty participant set (no ACTIVE agreements): allocation_results is [],
      no agreement is touched, and the event still transitions to EXECUTED.
    input_set: "SupplyAgreements with status ACTIVE; the event's available_week_cases"
    constants: {}
    precision: "whole cases; floor for pro-rata"
    variants:
      - name: pro_rata
        when: "response_mode == PRO_RATA"
        difference: "Every participant shares the deficit proportionally; tier is ignored"
      - name: priority_waterfall
        when: "response_mode == PRIORITY_WATERFALL"
        difference: "Higher tiers are filled to contract before lower tiers receive anything; for the same participants and pool the two variants produce different allocations"

  - name: shipment_invoice_and_credit
    trigger: "Shipment DELIVERED (invoice) or REJECTED_ON_ARRIVAL (credit memo)"
    algorithm: aggregation
    formula: |
      Per-line rounding order is PINNED: compute each line's cents and round it,
      THEN sum the rounded lines. Never sum raw products and round once.
      invoice_cents (DELIVERED):
        if excursion_flag: line_cents = round_half_up(line.cases * agreement.price_per_case_cents * 0.90, 0)
        else:              line_cents = round_half_up(line.cases * agreement.price_per_case_cents, 0)
        invoice_cents = sum of line_cents over shipment.lines
      credit_memo_cents (REJECTED_ON_ARRIVAL):
        line_credit = round_half_up(line.cases * agreement.price_per_case_cents * 0.85, 0)
        credit_memo_cents = sum of line_credit over shipment.lines
      (Per-line rounding then summing diverges from sum-then-round, e.g. lines
      3 and 2 cases at 305 cents: 778 + 519 = 1297 vs round(1296.25) = 1296.)
    input_set: "The shipment's lines and the agreement's price_per_case_cents"
    constants:
      EXCURSION_DISCOUNT_MULT: 0.90
      SALVAGE_CREDIT_MULT: 0.85
    precision: "0 decimal places per line, round_half_up, then integer sum"

  - name: fill_rate_pct
    trigger: "Shipment DELIVERED or REJECTED_ON_ARRIVAL"
    algorithm: aggregation
    formula: |
      delivered = sum of cases_shipped over the chain's shipments with status DELIVERED
      rejected  = sum of cases_shipped over the chain's shipments with status REJECTED_ON_ARRIVAL
      fill_rate_pct = round_half_up(100.0 * delivered / (delivered + rejected), 1)
      Only terminal shipments count; IN_TRANSIT is excluded. Null when the
      denominator is 0. If the new value < FILL_RATE_FLOOR_PCT (85.0), set
      under_sla_review on every ACTIVE agreement of the chain; if >= the floor,
      clear it everywhere on the chain.
    input_set: "All shipments of all agreements belonging to the chain, statuses DELIVERED / REJECTED_ON_ARRIVAL"
    constants:
      FILL_RATE_FLOOR_PCT: 85.0
    precision: "1 decimal place, round_half_up"

  - name: delivery_window_overlap
    trigger: "CropContract creation and accept-amendment"
    algorithm: interval_merge
    formula: |
      For the same grower_id AND same variety, consider the candidate window
      W = [delivery_window_start, delivery_window_end) against every other
      contract of that grower+variety whose status is in {DRAFT, ACTIVE,
      AMENDMENT_PENDING} (terminal FULFILLED / SHORTFALL_DECLARED windows no
      longer block):
      overlap iff existing.start < W.end AND W.start < existing.end.
      Adjacency is NOT overlap: W.start == existing.end or W.end == existing.start
      is allowed (half-open intervals; back-to-back seasons merge cleanly).
    input_set: "Contracts sharing grower_id and variety in non-terminal states"
    constants: {}
    precision: "instant comparison; half-open [start, end)"

  - name: line_schedule_conflict
    trigger: "ProductionRun creation"
    algorithm: interval_merge
    formula: |
      For candidate run R = [scheduled_start, scheduled_end) on line L, consider
      every existing run E on L with status in {SCHEDULED, CUTTING, BLANCHING,
      COATING, FREEZING, QA_HOLD, REWORK} (terminal runs do not block):
      - strict overlap: E.start < R.end AND R.start < E.end
        -> always ERR_LINE_SCHEDULE_CONFLICT
      - otherwise (disjoint or touching): if R.cut_family != E.cut_family the
        gap between the intervals must be >= CHANGEOVER_MINUTES (60), where
        gap = R.start - E.end when R follows E, or E.start - R.end when R
        precedes E; a smaller gap (including exact adjacency, gap == 0)
        -> ERR_LINE_SCHEDULE_CONFLICT. Same cut_family: any gap >= 0 is
        allowed, including exact adjacency.
    input_set: "Non-terminal ProductionRuns on the same ProcessingLine"
    constants:
      CHANGEOVER_MINUTES: 60
    precision: "minute granularity; half-open intervals with family-dependent buffer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed identity: Grower may create a lot only against a contract whose grower_id == X-User-ID; ChainCustomer may create a spec or request a revision only where customer_id == X-User-ID; IMPORT-mode lot creation (shortage_event_id) requires role GrowerRelationsManager"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /potato-ops/potato-lots; POST /potato-ops/cut-specifications; POST /potato-ops/cut-specifications/{id}/request-revision"
  - priority: 4
    category: existence
    check: "Request shape: required fields present, enum members valid, numeric bounds (weights > 0, tare < gross, window start < end, trailer_setpoint_f <= 0.0, exactly one of contract_id / shortage_event_id on lot creation)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: existence
    check: "Path ids first (left to right), then body FK ids in the endpoint's declared input order; each must resolve to an existing entity"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_GROWER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_FACILITY_NOT_FOUND, ERR_LINE_NOT_FOUND, ERR_SPEC_NOT_FOUND, ERR_CHAIN_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_SHORTAGE_EVENT_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path or body ids"
  - priority: 6
    category: state
    check: "Target resource state precondition for the operation (contract DRAFT/ACTIVE/AMENDMENT_PENDING per transition; contract must be ACTIVE for a CONTRACTED lot delivery; agreement activatable; spec awaiting validation or revisionable; run stage order; lot IN_STORAGE; shipment IN_TRANSIT; shortage event OPEN)"
    error_id: "ERR_CONTRACT_NOT_DRAFT | ERR_CONTRACT_NOT_ACTIVE | ERR_CONTRACT_NOT_IN_AMENDMENT | ERR_AGREEMENT_NOT_ACTIVABLE | ERR_AGREEMENT_NOT_ACTIVE | ERR_SPEC_NOT_AWAITING_VALIDATION | ERR_SPEC_NOT_REVISIONABLE | ERR_SPEC_NOT_VALIDATED | ERR_SPEC_NOT_LOCKED | ERR_RUN_INVALID_STAGE | ERR_LOT_NOT_AVAILABLE | ERR_SHIPMENT_NOT_IN_TRANSIT | ERR_SHORTAGE_EVENT_NOT_OPEN | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints and state-gated creations"
  - priority: 7
    category: business_safety
    check: "Quarantine: lot creation into a QUARANTINED facility, or run creation consuming a lot whose facility is QUARANTINED, is forbidden (food-safety isolation)"
    error_id: ERR_FACILITY_QUARANTINED
    http_status: 409
    applies_to: "POST /potato-ops/potato-lots; POST /potato-ops/production-runs"
  - priority: 8
    category: business_constraint
    check: "Structural constraints: delivery-window overlap for same grower+variety; line schedule conflict with changeover buffer; spec cut_family must be in line.supported_cut_families; agreement spec_stale must be false at run creation"
    error_id: "ERR_DELIVERY_WINDOW_OVERLAP | ERR_LINE_SCHEDULE_CONFLICT | ERR_CUT_FAMILY_UNSUPPORTED | ERR_SPEC_REVISION_STALE"
    http_status: 409
    applies_to: "POST /potato-ops/crop-contracts; POST .../accept-amendment; POST /potato-ops/production-runs"
  - priority: 9
    category: business_temporal
    check: "Delivery-time rules: CONTRACTED lot creation requires the logical clock inside [contract.delivery_window_start, contract.delivery_window_end] inclusive; lot variety must equal the contract's variety"
    error_id: "ERR_OUTSIDE_DELIVERY_WINDOW | ERR_VARIETY_MISMATCH"
    http_status: 422
    applies_to: "POST /potato-ops/potato-lots (CONTRACTED mode)"
  - priority: 10
    category: business_fiscal
    check: "Capacity and inventory: facility free capacity >= lot net weight; plant weekly pool >= weekly_contracted_cases at activation; shipment total cases <= agreement.released_unshipped_cases; panel score >= 7.0 for sensory-gated validation; measured color within target +/- 0.5"
    error_id: "ERR_FACILITY_CAPACITY_EXCEEDED | ERR_WEEK_CAPACITY_EXCEEDED | ERR_UNRELEASED_CASES_EXCEEDED | ERR_PANEL_SCORE_BELOW_STANDARD | ERR_COLOR_OUT_OF_TOLERANCE"
    http_status: 422
    applies_to: "POST /potato-ops/potato-lots; POST /potato-ops/supply-agreements/{id}/activate; POST /potato-ops/shipments; POST /potato-ops/cut-specifications/{id}/validate; POST /potato-ops/production-runs/{id}/qa-release"
  - priority: 11
    category: business_fiscal
    check: "Credit gate: agreement activation requires the chain in GOOD_STANDING; shipment creation requires the agreement not under_sla_review"
    error_id: "ERR_CREDIT_HOLD_ACTIVE | ERR_AGREEMENT_UNDER_SLA_REVIEW"
    http_status: 409
    applies_to: "POST /potato-ops/supply-agreements/{id}/activate; POST /potato-ops/shipments"
  - priority: 12
    category: business_fiscal
    check: "OCC: accept-amendment requires expected_crop_contract_version == current CropContract.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /potato-ops/crop-contracts/{id}/accept-amendment"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock (unprefixed; outside the business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Side effect: the clock sweep completes agreements whose term_end has passed."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "Set logical clock to current_utc"
      - "Clock sweep: every SupplyAgreement with status ACTIVE and term_end <= current_utc -> COMPLETED (releasing its reserved weekly cases to the plant pool)"

  # --- Grower ---
  - method: POST
    path: "/potato-ops/growers"
    description: "Register a grower"
    roles: [GrowerRelationsManager]
    code: 201
    input: [grower_code, legal_name, region]
    output: Grower
    side_effects: []
  - method: GET
    path: "/potato-ops/growers/{id}"
    description: "Get a grower by id"
    roles: &all_roles [PlatformAdmin, GrowerRelationsManager, Grower, StorageOperator, QualityAssuranceLead, ProductionPlanner, AccountManager, ChainCustomer, LogisticsCoordinator]
    code: 200
    input: []
    output: Grower
    side_effects: []

  # --- CropContract ---
  - method: POST
    path: "/potato-ops/crop-contracts"
    description: "Create a crop contract in DRAFT; checks delivery-window overlap against the grower's other non-terminal contracts of the same variety"
    roles: [GrowerRelationsManager]
    code: 201
    input: [grower_id, variety, contracted_acres, expected_yield_cwt_per_acre, base_price_per_cwt_cents, delivery_window_start, delivery_window_end]
    output: CropContract
    side_effects:
      - "contracted_volume_cwt computed; status DRAFT"
      - "delivery_window_overlap check (ERR_DELIVERY_WINDOW_OVERLAP)"
  - method: GET
    path: "/potato-ops/crop-contracts"
    description: "List crop contracts with optional filters"
    roles: *all_roles
    code: 200
    input: ["grower_id?", "status?", "variety?", "limit?", "offset?"]
    output: "CropContract[]"
    side_effects: []
  - method: POST
    path: "/potato-ops/crop-contracts/{id}/activate"
    description: "Activate a DRAFT contract"
    roles: [GrowerRelationsManager]
    code: 200
    input: []
    output: CropContract
    side_effects: ["status -> ACTIVE; increments CropContract.version by 1"]
  - method: POST
    path: "/potato-ops/crop-contracts/{id}/propose-amendment"
    description: "Propose replacement commercial terms; moves ACTIVE contract to AMENDMENT_PENDING"
    roles: [GrowerRelationsManager]
    code: 200
    input: [contracted_acres, expected_yield_cwt_per_acre, base_price_per_cwt_cents, delivery_window_start, delivery_window_end]
    output: CropContract
    side_effects: ["pending_amendment stored; status -> AMENDMENT_PENDING; increments version by 1"]
  - method: POST
    path: "/potato-ops/crop-contracts/{id}/accept-amendment"
    description: "Accept the pending amendment (OCC-guarded); applies terms and returns the contract to ACTIVE"
    roles: [GrowerRelationsManager]
    code: 200
    input: [expected_crop_contract_version]
    output: CropContract
    side_effects:
      - "OCC check expected_crop_contract_version == version (ERR_STALE_VERSION 412)"
      - "Apply pending_amendment; recompute contracted_volume_cwt; delivery_window_overlap re-check"
      - "status -> ACTIVE; increments CropContract.version by 1"
  - method: POST
    path: "/potato-ops/crop-contracts/{id}/declare-shortfall"
    description: "Declare a crop shortfall on an ACTIVE contract; settles the contract"
    roles: [GrowerRelationsManager]
    code: 200
    input: []
    output: CropContract
    side_effects:
      - "status -> SHORTFALL_DECLARED; increments version by 1"
      - "contract_final_settlement runs: final_payment_cents per lot, settlement_amount_cents on the contract"

  # --- PotatoLot ---
  - method: POST
    path: "/potato-ops/potato-lots"
    description: "Receive a potato lot. Two modes: CONTRACTED (contract_id given; Grower role as the contract's grower; delivery window + variety enforced) or IMPORT (shortage_event_id given; GrowerRelationsManager; event must be OPEN)."
    roles: [Grower, GrowerRelationsManager]
    code: 201
    input: ["contract_id?", "shortage_event_id?", facility_id, variety, gross_weight_cwt, tare_weight_cwt, defect_pct, specific_gravity, sugar_end_rating]
    output: PotatoLot
    side_effects:
      - "Exactly one of contract_id / shortage_event_id required (ERR_LOT_SOURCE_MODE_INVALID)"
      - "CONTRACTED mode: contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE); X-User-ID must equal contract.grower_id; clock within delivery window (ERR_OUTSIDE_DELIVERY_WINDOW); variety must match (ERR_VARIETY_MISMATCH)"
      - "IMPORT mode: shortage event must be OPEN (ERR_SHORTAGE_EVENT_NOT_OPEN); role must be GrowerRelationsManager"
      - "net_weight_cwt, grade computed; provisional_payment_cents for CONTRACTED lots"
      - "Facility posture must not be QUARANTINED (ERR_FACILITY_QUARANTINED); current_stock_cwt += net_weight_cwt; capacity check (ERR_FACILITY_CAPACITY_EXCEEDED)"
      - "Contract delivered_volume_cwt updated; auto-transition to FULFILLED at >= 98% with settlement cascade"
  - method: GET
    path: "/potato-ops/potato-lots"
    description: "List potato lots with optional filters"
    roles: *all_roles
    code: 200
    input: ["contract_id?", "facility_id?", "shortage_event_id?", "status?", "limit?", "offset?"]
    output: "PotatoLot[]"
    side_effects: []
  - method: POST
    path: "/potato-ops/potato-lots/{id}/dispose"
    description: "Dispose of an IN_STORAGE lot (condemn to waste or divert to cattle feed / starch recovery); creates a ByproductBatch"
    roles: [QualityAssuranceLead]
    code: 200
    input: [disposition]
    output: PotatoLot
    side_effects:
      - "status -> DISPOSED with disposition; facility.current_stock_cwt -= net_weight_cwt; increments version by 1"
      - "Create ByproductBatch {stream: WHOLE_LOT, routing <- disposition, weight_cwt <- net_weight_cwt}"

  # --- StorageFacility ---
  - method: POST
    path: "/potato-ops/storage-facilities"
    description: "Create a storage facility (posture starts NORMAL)"
    roles: [PlatformAdmin]
    code: 201
    input: [facility_code, capacity_cwt, target_temp_f, target_co2_pct]
    output: StorageFacility
    side_effects: ["posture NORMAL; current_stock_cwt 0"]
  - method: GET
    path: "/potato-ops/storage-facilities/{id}"
    description: "Get a storage facility (posture, stock, recent readings)"
    roles: *all_roles
    code: 200
    input: []
    output: StorageFacility
    side_effects: []
  - method: POST
    path: "/potato-ops/storage-facilities/{id}/readings"
    description: "Record an atmospheric/sprout/disease reading; recomputes posture from the latest reading"
    roles: [StorageOperator]
    code: 201
    input: [recorded_at, temperature_f, humidity_pct, co2_pct, sprout_index, disease_incidence_pct]
    output: StorageFacility
    side_effects:
      - "Append reading to recent_readings (keep most recent 10); readings immutable"
      - "facility_posture recompute; posture transition if crossed; increments StorageFacility.version by 1"

  # --- ProcessingLine ---
  - method: POST
    path: "/potato-ops/processing-lines"
    description: "Create a processing line"
    roles: [PlatformAdmin]
    code: 201
    input: [line_code, supported_cut_families, rated_throughput_cases_per_hour]
    output: ProcessingLine
    side_effects: []

  # --- CutSpecification ---
  - method: POST
    path: "/potato-ops/cut-specifications"
    description: "Create a customer cut specification (starts SUBMITTED); customer_id must equal X-User-ID"
    roles: [ChainCustomer]
    code: 201
    input: [customer_id, spec_code, cut_family, cut_size_mm, coating_type, target_color_units, max_cook_time_sec, "sensory_panel_required?"]
    output: CutSpecification
    side_effects: ["status SUBMITTED; ever_locked false"]
  - method: GET
    path: "/potato-ops/cut-specifications"
    description: "List cut specifications with optional filters"
    roles: *all_roles
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "CutSpecification[]"
    side_effects: []
  - method: POST
    path: "/potato-ops/cut-specifications/{id}/validate"
    description: "Record the sensory panel outcome; SUBMITTED/REVISION_REQUESTED -> VALIDATED, or -> LOCKED when ever_locked"
    roles: [QualityAssuranceLead]
    code: 200
    input: [panel_score]
    output: CutSpecification
    side_effects: ["panel_score stored; status per transition branch; increments version by 1"]
  - method: POST
    path: "/potato-ops/cut-specifications/{id}/request-revision"
    description: "Customer requests a spec revision; from LOCKED it also flags every ACTIVE pinned agreement spec_stale"
    roles: [ChainCustomer]
    code: 200
    input: []
    output: CutSpecification
    side_effects: ["status -> REVISION_REQUESTED; increments version by 1; from LOCKED: dependent ACTIVE agreements get spec_stale <- true"]

  # --- CustomerChain ---
  - method: POST
    path: "/potato-ops/customer-chains"
    description: "Register a chain customer"
    roles: [AccountManager]
    code: 201
    input: [chain_code, legal_name, priority_tier]
    output: CustomerChain
    side_effects: ["credit_status GOOD_STANDING; fill_rate_pct null"]
  - method: GET
    path: "/potato-ops/customer-chains/{id}"
    description: "Get a chain customer"
    roles: *all_roles
    code: 200
    input: []
    output: CustomerChain
    side_effects: []
  - method: POST
    path: "/potato-ops/customer-chains/{id}/set-credit-status"
    description: "Set the chain's credit status; ON_HOLD cascades to agreements, runs, and lots; GOOD_STANDING resumes agreements"
    roles: [AccountManager]
    code: 200
    input: [credit_status]
    output: CustomerChain
    side_effects:
      - "ON_HOLD: agreements ACTIVE -> SUSPENDED; their SCHEDULED runs -> CANCELLED; those runs' lots ALLOCATED -> IN_STORAGE (stock restored)"
      - "GOOD_STANDING: SUSPENDED agreements -> ACTIVE with capacity re-reserved (whole call fails with ERR_WEEK_CAPACITY_EXCEEDED if the pool cannot refit them)"

  # --- SupplyAgreement ---
  - method: POST
    path: "/potato-ops/supply-agreements"
    description: "Create a supply agreement in DRAFT against a customer and a cut spec"
    roles: [AccountManager]
    code: 201
    input: [customer_id, spec_id, weekly_contracted_cases, price_per_case_cents, term_start, term_end]
    output: SupplyAgreement
    side_effects: []
  - method: GET
    path: "/potato-ops/supply-agreements"
    description: "List supply agreements with optional filters"
    roles: *all_roles
    code: 200
    input: ["customer_id?", "spec_id?", "status?", "limit?", "offset?"]
    output: "SupplyAgreement[]"
    side_effects: []
  - method: POST
    path: "/potato-ops/supply-agreements/{id}/activate"
    description: "Activate a DRAFT agreement (reserves weekly capacity, pins and locks the spec) or re-ack a spec_stale ACTIVE agreement"
    roles: [AccountManager]
    code: 200
    input: []
    output: SupplyAgreement
    side_effects:
      - "From DRAFT: capacity reservation (ERR_WEEK_CAPACITY_EXCEEDED), credit gate (ERR_CREDIT_HOLD_ACTIVE), spec must be VALIDATED or LOCKED (ERR_SPEC_NOT_VALIDATED); VALIDATED spec -> LOCKED with ever_locked <- true"
      - "From ACTIVE with spec_stale: re-pin pinned_spec_version <- spec.version, spec_stale <- false (spec must be LOCKED)"
      - "current_week_allocation_cases <- weekly_contracted_cases; increments version by 1"

  # --- ProductionRun ---
  - method: POST
    path: "/potato-ops/production-runs"
    description: "Schedule a production run consuming whole lots; enforces spec lock, agreement health, lot availability, quarantine, line capability, and the line schedule with changeover buffer"
    roles: [ProductionPlanner]
    code: 201
    input: [line_id, spec_id, agreement_id, input_lot_ids, scheduled_start, scheduled_end]
    output: ProductionRun
    side_effects:
      - "spec must be LOCKED (ERR_SPEC_NOT_LOCKED); spec.cut_family must be in line.supported_cut_families (ERR_CUT_FAMILY_UNSUPPORTED)"
      - "agreement must be ACTIVE (ERR_AGREEMENT_NOT_ACTIVE), spec_stale false (ERR_SPEC_REVISION_STALE)"
      - "every lot IN_STORAGE (ERR_LOT_NOT_AVAILABLE) in a non-QUARANTINED facility (ERR_FACILITY_QUARANTINED)"
      - "line_schedule_conflict check (ERR_LINE_SCHEDULE_CONFLICT)"
      - "cut_family copied from spec; total_input_cwt computed; input lots -> ALLOCATED; facility stock decreased"
  - method: GET
    path: "/potato-ops/production-runs"
    description: "List production runs with optional filters"
    roles: *all_roles
    code: 200
    input: ["line_id?", "spec_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []
  - method: POST
    path: "/potato-ops/production-runs/{id}/advance"
    description: "Advance one pipeline stage: SCHEDULED->CUTTING->BLANCHING->COATING->FREEZING->QA_HOLD, or REWORK->COATING"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["On entry into QA_HOLD: actual_cases computed per run_actual_cases; increments version by 1"]
  - method: POST
    path: "/potato-ops/production-runs/{id}/qa-release"
    description: "Release a QA_HOLD run after cook validation against the spec's target color"
    roles: [QualityAssuranceLead]
    code: 200
    input: [measured_color_units]
    output: ProductionRun
    side_effects: ["status -> RELEASED; input lots -> CONSUMED; agreement.lifetime_released_cases += actual_cases; increments version by 1"]
  - method: POST
    path: "/potato-ops/production-runs/{id}/rework"
    description: "Send a QA_HOLD run back through coating (rework loop); rework_count += 1"
    roles: [QualityAssuranceLead]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> REWORK; rework_count += 1; increments version by 1"]
  - method: POST
    path: "/potato-ops/production-runs/{id}/reject"
    description: "Reject a QA_HOLD run; output is diverted to a byproduct batch (feed or waste)"
    roles: [QualityAssuranceLead]
    code: 200
    input: [disposition]
    output: ProductionRun
    side_effects:
      - "status -> REJECTED; input lots -> CONSUMED; increments version by 1"
      - "Create ByproductBatch {stream: REJECTED_PRODUCT, routing <- disposition, weight_cwt <- total_input_cwt}"

  # --- ByproductBatch (system-created; read-only surface) ---
  - method: GET
    path: "/potato-ops/byproduct-batches"
    description: "List byproduct batches with optional filters"
    roles: *all_roles
    code: 200
    input: ["source_run_id?", "source_lot_id?", "routing?", "limit?", "offset?"]
    output: "ByproductBatch[]"
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/potato-ops/shipments"
    description: "Create a shipment (starts IN_TRANSIT) consolidating released cases by run line; enforces cold-chain setpoint and released-inventory limits"
    roles: [LogisticsCoordinator]
    code: 201
    input: [agreement_id, carrier_name, trailer_setpoint_f, route_type, lines]
    output: Shipment
    side_effects:
      - "agreement must be ACTIVE (ERR_AGREEMENT_NOT_ACTIVE) and not under_sla_review (ERR_AGREEMENT_UNDER_SLA_REVIEW)"
      - "every lines[].run_id must exist (ERR_RUN_NOT_FOUND), be RELEASED, and belong to the agreement (ERR_INVALID_REQUEST)"
      - "sum of lines[].cases <= agreement.released_unshipped_cases (ERR_UNRELEASED_CASES_EXCEEDED)"
      - "cases_shipped computed; increments version by 1"
  - method: GET
    path: "/potato-ops/shipments"
    description: "List shipments with optional filters"
    roles: *all_roles
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []
  - method: POST
    path: "/potato-ops/shipments/{id}/deliver"
    description: "Record delivery with cold-chain transit data; computes excursion flag, invoice, and fill-rate/SLA updates"
    roles: [LogisticsCoordinator]
    code: 200
    input: [max_transit_temp_f, minutes_above_setpoint]
    output: Shipment
    side_effects:
      - "status -> DELIVERED; excursion_flag <- minutes_above_setpoint > 30; invoice_cents computed"
      - "chain fill_rate_pct recomputed; under_sla_review cleared chain-wide if fill_rate >= 85.0; increments version by 1"
  - method: POST
    path: "/potato-ops/shipments/{id}/reject-on-arrival"
    description: "Customer refuses the shipment; computes the credit memo and the fill-rate/SLA cascade"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "status -> REJECTED_ON_ARRIVAL; credit_memo_cents computed; cases NOT returned to inventory"
      - "chain fill_rate_pct recomputed; if < 85.0 every ACTIVE agreement of the chain gets under_sla_review <- true; increments version by 1"

  # --- ShortageEvent ---
  - method: POST
    path: "/potato-ops/shortage-events"
    description: "Declare a crop shortfall event with its available case pool and allocation mode"
    roles: [GrowerRelationsManager]
    code: 201
    input: [scope_variety, declared_deficit_cwt, available_week_cases, response_mode]
    output: ShortageEvent
    side_effects: ["status OPEN"]
  - method: POST
    path: "/potato-ops/shortage-events/{id}/execute-allocation"
    description: "Run the shortage allocation over all ACTIVE agreements and write per-agreement weekly allocations"
    roles: [GrowerRelationsManager]
    code: 200
    input: []
    output: ShortageEvent
    side_effects:
      - "shortage_allocation per response_mode; each participant's current_week_allocation_cases overwritten"
      - "allocation_results recorded; status -> EXECUTED; increments version by 1"

  # --- Single-resource GETs (FK reverse-reachability anchors + read-back) ---
  - method: GET
    path: "/potato-ops/crop-contracts/{id}"
    description: "Get a crop contract by id"
    roles: *all_roles
    code: 200
    input: []
    output: CropContract
    side_effects: []
  - method: GET
    path: "/potato-ops/potato-lots/{id}"
    description: "Get a potato lot by id"
    roles: *all_roles
    code: 200
    input: []
    output: PotatoLot
    side_effects: []
  - method: GET
    path: "/potato-ops/cut-specifications/{id}"
    description: "Get a cut specification by id"
    roles: *all_roles
    code: 200
    input: []
    output: CutSpecification
    side_effects: []
  - method: GET
    path: "/potato-ops/supply-agreements/{id}"
    description: "Get a supply agreement by id"
    roles: *all_roles
    code: 200
    input: []
    output: SupplyAgreement
    side_effects: []
  - method: GET
    path: "/potato-ops/production-runs/{id}"
    description: "Get a production run by id"
    roles: *all_roles
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/potato-ops/shipments/{id}"
    description: "Get a shipment by id"
    roles: *all_roles
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/potato-ops/byproduct-batches/{id}"
    description: "Get a byproduct batch by id"
    roles: *all_roles
    code: 200
    input: []
    output: ByproductBatch
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller does not own the referenced resource (Grower vs contract grower; ChainCustomer vs spec customer)" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, weight/window/setpoint bounds violated, or run lines reference a run of another agreement or a non-RELEASED run" }
  - { id: ERR_LOT_SOURCE_MODE_INVALID, http: 400, condition: "Potato lot creation must carry exactly one of contract_id (CONTRACTED) or shortage_event_id (IMPORT)" }

  # --- Not found ---
  - { id: ERR_GROWER_NOT_FOUND, http: 404, condition: "grower_id does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot id does not resolve" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "facility id does not resolve" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "line id does not resolve" }
  - { id: ERR_SPEC_NOT_FOUND, http: 404, condition: "cut specification id does not resolve" }
  - { id: ERR_CHAIN_NOT_FOUND, http: 404, condition: "customer chain id does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "supply agreement id does not resolve" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "production run id does not resolve" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id does not resolve" }
  - { id: ERR_SHORTAGE_EVENT_NOT_FOUND, http: 404, condition: "shortage event id does not resolve" }

  # --- State ---
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "activate requires the contract in DRAFT" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "propose-amendment / declare-shortfall / contracted lot delivery require the contract ACTIVE" }
  - { id: ERR_CONTRACT_NOT_IN_AMENDMENT, http: 409, condition: "accept-amendment requires the contract in AMENDMENT_PENDING" }
  - { id: ERR_AGREEMENT_NOT_ACTIVABLE, http: 409, condition: "activate requires the agreement DRAFT, or ACTIVE with spec_stale == true" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "run or shipment creation requires the agreement ACTIVE" }
  - { id: ERR_SPEC_NOT_AWAITING_VALIDATION, http: 409, condition: "validate requires the spec in SUBMITTED or REVISION_REQUESTED" }
  - { id: ERR_SPEC_NOT_REVISIONABLE, http: 409, condition: "request-revision requires the spec in VALIDATED or LOCKED" }
  - { id: ERR_SPEC_NOT_VALIDATED, http: 409, condition: "agreement activation requires the spec VALIDATED or LOCKED" }
  - { id: ERR_SPEC_NOT_LOCKED, http: 409, condition: "run creation requires the spec LOCKED; agreement re-ack requires the spec LOCKED" }
  - { id: ERR_RUN_INVALID_STAGE, http: 409, condition: "advance/rework/qa-release/reject called from a stage where it is not defined, or from a terminal stage" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "lot must be IN_STORAGE for allocation or disposal" }
  - { id: ERR_SHIPMENT_NOT_IN_TRANSIT, http: 409, condition: "deliver / reject-on-arrival require the shipment IN_TRANSIT" }
  - { id: ERR_SHORTAGE_EVENT_NOT_OPEN, http: 409, condition: "execute-allocation or IMPORT lot creation requires the shortage event OPEN" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "set-credit-status with the chain already in the requested status" }

  # --- Business safety ---
  - { id: ERR_FACILITY_QUARANTINED, http: 409, condition: "Lot intake into, or run consumption from, a QUARANTINED facility" }

  # --- Business constraint ---
  - { id: ERR_DELIVERY_WINDOW_OVERLAP, http: 409, condition: "Contract delivery window overlaps a sibling non-terminal contract of the same grower and variety (adjacency allowed)" }
  - { id: ERR_LINE_SCHEDULE_CONFLICT, http: 409, condition: "Run window overlaps a non-terminal run on the same line, or a cut-family change lacks the 60-minute changeover buffer" }
  - { id: ERR_CUT_FAMILY_UNSUPPORTED, http: 409, condition: "The line does not support the spec's cut_family" }
  - { id: ERR_SPEC_REVISION_STALE, http: 409, condition: "Run creation with an agreement whose pinned spec is under revision" }

  # --- Business temporal ---
  - { id: ERR_OUTSIDE_DELIVERY_WINDOW, http: 422, condition: "Contracted lot delivered outside the contract delivery window" }
  - { id: ERR_VARIETY_MISMATCH, http: 422, condition: "Contracted lot variety differs from the contract variety" }

  # --- Business fiscal ---
  - { id: ERR_FACILITY_CAPACITY_EXCEEDED, http: 422, condition: "Lot intake would exceed the facility's capacity_cwt" }
  - { id: ERR_WEEK_CAPACITY_EXCEEDED, http: 422, condition: "Agreement activation would push reserved weekly cases past the 100000-case plant pool" }
  - { id: ERR_UNRELEASED_CASES_EXCEEDED, http: 422, condition: "Shipment cases exceed the agreement's released_unshipped_cases" }
  - { id: ERR_PANEL_SCORE_BELOW_STANDARD, http: 422, condition: "Sensory panel score below 7.0 on a spec requiring a panel" }
  - { id: ERR_COLOR_OUT_OF_TOLERANCE, http: 422, condition: "Measured cook color outside target_color_units +/- 0.5 at qa-release" }
  - { id: ERR_CREDIT_HOLD_ACTIVE, http: 409, condition: "Agreement activation while the chain is ON_HOLD" }
  - { id: ERR_AGREEMENT_UNDER_SLA_REVIEW, http: 409, condition: "Shipment creation while the agreement is under SLA review (fill rate below 85.0)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_crop_contract_version does not match the contract's current version" }

# =============================================================================
# §1.7 RBAC Matrix (peer roles; each owns a disjoint operational surface)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Plant administration: logical clock, storage facilities, processing lines"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /potato-ops/storage-facilities"
      - "POST /potato-ops/processing-lines"
    shared_operations: ["All GET endpoints"]
  - name: GrowerRelationsManager
    description: "Procurement: grower registry, crop contracts and amendments, shortfall declaration and shortage response"
    identity: opaque
    exclusive_operations:
      - "POST /potato-ops/growers"
      - "POST /potato-ops/crop-contracts and its activate/propose-amendment/accept-amendment/declare-shortfall actions"
      - "POST /potato-ops/shortage-events and execute-allocation"
      - "POST /potato-ops/potato-lots in IMPORT mode (shortage_event_id)"
    shared_operations: ["All GET endpoints"]
  - name: Grower
    description: "A contracted grower delivering raw potato lots against its own contracts"
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /potato-ops/potato-lots in CONTRACTED mode (contract_id), only where the contract's grower_id == X-User-ID"
    shared_operations: ["All GET endpoints"]
  - name: StorageOperator
    description: "Controlled-atmosphere storage operator recording facility readings"
    identity: opaque
    exclusive_operations:
      - "POST /potato-ops/storage-facilities/{id}/readings"
    shared_operations: ["All GET endpoints"]
  - name: QualityAssuranceLead
    description: "QA: sensory validation of specs, lot disposal, run QA release/rework/reject"
    identity: opaque
    exclusive_operations:
      - "POST /potato-ops/cut-specifications/{id}/validate"
      - "POST /potato-ops/potato-lots/{id}/dispose"
      - "POST /potato-ops/production-runs/{id}/qa-release, rework, reject"
    shared_operations: ["All GET endpoints"]
  - name: ProductionPlanner
    description: "Plans and advances processing-line production runs"
    identity: opaque
    exclusive_operations:
      - "POST /potato-ops/production-runs"
      - "POST /potato-ops/production-runs/{id}/advance"
    shared_operations: ["All GET endpoints"]
  - name: AccountManager
    description: "Owns chain customers, credit posture, and supply agreements"
    identity: opaque
    exclusive_operations:
      - "POST /potato-ops/customer-chains and set-credit-status"
      - "POST /potato-ops/supply-agreements and activate"
    shared_operations: ["All GET endpoints"]
  - name: ChainCustomer
    description: "The chain customer's own portal identity: authors and revises its cut specifications"
    identity: "entity_backed:CustomerChain"
    exclusive_operations:
      - "POST /potato-ops/cut-specifications (customer_id must equal X-User-ID)"
      - "POST /potato-ops/cut-specifications/{id}/request-revision (own specs only)"
    shared_operations: ["All GET endpoints"]
  - name: LogisticsCoordinator
    description: "Cold-chain freight: creates shipments and records delivery or arrival rejection"
    identity: opaque
    exclusive_operations:
      - "POST /potato-ops/shipments"
      - "POST /potato-ops/shipments/{id}/deliver, reject-on-arrival"
    shared_operations: ["All GET endpoints"]
