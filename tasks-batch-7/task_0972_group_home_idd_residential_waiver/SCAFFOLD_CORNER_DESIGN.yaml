          trigger:
            - { call: "POST /isps/${isp_id}/amend", payload: { expected_isp_version: "${isp_v3}", goals_summary: "Stale amendment attempt" }, as: CaseManager, as_user_id: "${cm_id}", captures: { err: $.data.error_id } }
            - { call: "POST /isps/${isp_id}/amend", payload: { expected_isp_version: "${isp_v4}", goals_summary: "Fresh amendment attempt" }, as: CaseManager, as_user_id: "${cm_id}", captures: { st: $.data.status, ac: $.data.amendment_count, v5: $.data.version } }
          assert:
            - "stale amend (expected 3 vs current 4) -> ERR_STALE_VERSION, http 412"
            - "fresh amend -> status AMENDMENT_DRAFT, amendment_count == 1, version == 5"

      - name: incident_close_releases_held_claims
        claim_type: cascading_side_effects
