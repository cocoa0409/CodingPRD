    path: "/preservation/recurring-plans"
    description: "Create a recurring grass-cut/snow-removal plan (starts ACTIVE)"
    roles: [VendorAdmin]
    code: 201
    input: ["property_id", "service_type", "season_start_md", "season_end_md", "interval_days", "max_per_season"]
    output: RecurringServicePlan
    side_effects: []

  - method: GET
    path: "/preservation/recurring-plans/{planId}"
    description: "Get a plan"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
    output: RecurringServicePlan
    side_effects: []

  - method: GET
    path: "/preservation/recurring-plans"
    description: "List plans with filters and pagination"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: RecurringServicePlan[]
    side_effects: []

  - method: POST
    path: "/preservation/recurring-plans/{planId}/suspend"
