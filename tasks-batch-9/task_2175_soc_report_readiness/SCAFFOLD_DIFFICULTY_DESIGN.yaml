              captures: { ss_b: $.data.id }
            - call: "POST /soc/subservice-organizations"
              payload: { engagement_id: "${eng}", name: "SS-C", services_provided: "Archive hosting", coverage_start: "2026-10-02T00:00:00.000Z", coverage_end: "2026-10-31T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { ss_c: $.data.id }
          trigger:
            - call: "POST /soc/subservice-organizations/${ss_a}/set-method"
