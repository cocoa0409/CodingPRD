      - name: idling_a_plant_cascades_four_levels_and_is_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[Plant].transitions[ACTIVE->IDLED]
        excluded_because:
          difficulty_instance: plant_idle_cascades_four_hops_to_pit_formulation_run_and_clay_ledger
          rationale: "That instance walks the whole four-hop chain end to end - plant to clay pits to formulations to in-flight production runs to the clay ledger - asserts the ordering sensitivity, and confirms that already-terminal children are left alone. A second cascade instance here would only restate it, and the order-cancel cascade in order_cancel_cascades_four_hops_to_blend_components_and_lot_inventory covers the compensating direction."

      - name: the_two_dual_variant_calculations_are_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[green_yield].variants
          - calculations[order_freight_cost].variants
        excluded_because:
          difficulty_instance: green_yield_projected_versus_actual_on_close_green
          rationale: "Both variant pairs in the scaffold already have dedicated projected-versus-actual instances: green_yield_projected_versus_actual_on_close_green pins the PROJECTED write at run creation, the ACTUAL rewrite at close-green and the signed variance, while order_freight_estimated_versus_final_on_package does the same for the ESTIMATED quote at assignment against the FINAL weighed cost at packaging, including the tier re-keying on the new base. Nothing about variant divergence, selection context or reconciliation is left over."

      - name: the_selector_rejects_four_plants_for_four_different_reasons_and_the_cheapest_haul_beats_the_nearest
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers[selector_policy]
          - calculations[plant_assignment_selector]
          - endpoints[POST /orders/{id}/assign-plant]
        distinguishing_aspect: "Six candidate plants are arranged so that each of the four eligibility filters is the sole reason one plant drops out, and the survivor set is ordered so that the nearest eligible plant (10 miles, rate 300) is beaten on the real ranking key by a plant six times further away (60 miles, rate 42). The rejected equipment plant is placed at the same distance and rate as the winner, so it would produce an identical quote and win the created_at tie-break if the equipment filter were skipped - the winner's identity alone proves the filter ran."
