- rule_id: transitive_cascade
  instances:
  - name: producer_suspension_five_hop_delist_reverse_reprice_detach_cascade
    grounds:
    - state_machines.Producer.ACTIVE_to_SUSPENDED
    - state_machines.Product.LISTED_to_DELISTED
    - state_machines.Allocation.RESERVED_to_REVERSED
    - state_machines.OrderLine.ALLOCATED_to_PENDING
    - state_machines.BuyerOrder.AGGREGATED_to_DRAFT
    - calculations.order_pricing_rollup
    distinguishing_aspect: 'Five-hop transitive chain triggered by POST /producers/{id}/review decision=SUSPEND: suspending P1 delists PR1 (hop 2), the delisting reverses Allocation A1 (hop 3), that reversal
      empties OrderLine L1 (hop 4), and the empty line drives Order O1 back to DRAFT and off route R1 (hop 5). Every link is caused by the previous link, not by the original review call.'
