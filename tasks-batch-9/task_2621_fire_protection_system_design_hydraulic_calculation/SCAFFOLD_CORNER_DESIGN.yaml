scaffold_corner_design:

  # =====================================================================
  # 1 - ENTITIES  (claim-extraction-guide, "From Table 1 (Entities)")
  # =====================================================================
  - section: entities
    instances:

      - name: project_creation_seeds_the_whole_demand_ledger_at_zero
        claim_type: creation
        grounds:
          - endpoints.POST_/projects
          - entities.Project.fields.status
          - entities.Project.fields.design_posture
          - entities.Project.fields.total_system_demand_gpm
          - entities.Project.fields.review_fee_balance_usd
        distinguishing_aspect: |
          POST /projects with every required input returns 201 and the response already carries the
          complete computed seed - status DESIGN, design_posture OPEN, governing calculation null,
          all four demand figures 0.0, all three counters 0, fee balance 0.00, pump flag false.
          A server that leaves any of these null instead of seeding them fails the claim.
        test_recipe:
          setup:
            - "Engineer Dana Ruiz licensed ACTIVE in TX and AHJ reviewer Marisol Vega of TX-AUS exist"
            - "No project exists yet"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
          assert:
            - "HTTP 201"
            - "Project.${p1}.status == DESIGN"
            - "Project.${p1}.design_posture == OPEN"
            - "Project.${p1}.governing_hydraulic_calculation_id == null"
            - "Project.${p1}.governing_demand_gpm == 0.0"
            - "Project.${p1}.auxiliary_demand_gpm == 0.0"
            - "Project.${p1}.total_system_demand_gpm == 0.0"
            - "Project.${p1}.sealed_calculation_count == 0"
            - "Project.${p1}.open_major_comment_count == 0"
            - "Project.${p1}.submittal_cycle_count == 0"
            - "Project.${p1}.review_fee_balance_usd == 0.00"
            - "Project.${p1}.pump_required_flag == false"
            - "Project.${p1}.underground_lead_in_loss_psi == 5.0"

      - name: hazard_area_read_returns_the_stored_inputs_and_the_derived_classification
        claim_type: retrieval
        grounds:
          - endpoints.GET_/hazard-areas/{id}
          - calculations.hazard_classification
          - entities.HazardArea.fields.effective_hazard_class
          - entities.HazardArea.fields.design_density
        distinguishing_aspect: |
          GET /hazard-areas/{id} returns exactly what POST stored: the CLASS_IV commodity at 18.0 ft
          escalated ORDINARY_2 to EXTRA_1, the 36.0 ft ceiling added one 0.02 density step to 0.320,
          and the 2500 sqft EXTRA_1 design area survives the 24000 sqft gross cap.
        test_recipe:
          setup:
            - "Project FP-2601 in TX-AUS with lead engineer Dana Ruiz"
            - "Hazard area Rack Storage Bay A: ORDINARY_2 / CLASS_IV, storage 18.0 ft, ceiling 36.0 ft, gross 24000 sqft, WET, slope 4.0 pct"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
          trigger:
            - call: "GET /hazard-areas/${ha1}"
              as: QcReviewer
              as_user_id: "${e1}"
          assert:
            - "HTTP 200"
            - "HazardArea.${ha1}.label == 'Rack Storage Bay A'"
            - "HazardArea.${ha1}.hazard_class == ORDINARY_2"
            - "HazardArea.${ha1}.effective_hazard_class == EXTRA_1"
            - "HazardArea.${ha1}.design_density == 0.320"
            - "HazardArea.${ha1}.design_area_sqft == 2500"
            - "HazardArea.${ha1}.hose_allowance_gpm == 500.0"
            - "HazardArea.${ha1}.reclassification_count == 0"
            - "HazardArea.${ha1}.room_area_sqft == null"

      - name: auxiliary_system_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/auxiliary-systems
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three auxiliary systems on one project: limit=2&offset=0 returns 2 rows with total_count 3
          and has_more true, and limit=2&offset=2 returns 1 row with total_count 3 and has_more false.
          A server that omits total_count, or reports has_more from the page size instead of the
          remaining rows, fails the claim.
        test_recipe:
          setup:
            - "Project FP-2601 with three auxiliary systems: two standpipe risers, a cooking hood, a Class II hose station"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "COOKING", label: "Kitchen hood line", appliance_count: 4, water_wash_enabled: true, agent_type: "WET_CHEMICAL" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux2: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_II", label: "Hose station riser", riser_count: 1 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux3: $.data.id }
          trigger:
            - call: "GET /auxiliary-systems?project_id=${p1}&limit=2&offset=0"
              as: Contractor
            - call: "GET /auxiliary-systems?project_id=${p1}&limit=2&offset=2"
              as: Contractor
          assert:
            - "HTTP 200 on both reads"
            - "first read: data length == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second read: data length == 1, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "the union of the two pages is exactly {${aux1}, ${aux2}, ${aux3}} with no row repeated"

      - name: fire_pump_read_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/fire-pumps/{id}
          - validations[priority=4]
          - errors.ERR_FIRE_PUMP_NOT_FOUND
        distinguishing_aspect: |
          A well-formed but unassigned UUID in the {id} path segment of GET /fire-pumps/{id} returns
          404 ERR_FIRE_PUMP_NOT_FOUND, not 200 with a null body and not 422.
        test_recipe:
          setup:
            - "The database contains one engineer and one reviewer and no FirePump rows at all"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
          trigger:
            - call: "GET /fire-pumps/00000000-0000-4000-8000-0000000000ff"
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_FIRE_PUMP_NOT_FOUND"

      - name: flow_test_creation_missing_required_tested_at_is_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/flow-tests
          - entities.FlowTest.fields.tested_at
          - validations[priority=9]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          tested_at carries source input with no default, so omitting it is a 422 ERR_INVALID_REQUEST -
          the server must not substitute the logical clock for the witnessed test instant.
        test_recipe:
          setup:
            - "Project FP-2601 exists with lead engineer Dana Ruiz"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-14", static_psi: 80.0, residual_psi: 64.0, flow_gpm: 2250.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /projects/${p1}/flow-tests returns total_count == 0"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Engineer.fields.license_status
          - entities.Engineer.fields.discipline
          - entities.AhjReviewer.fields.discipline
          - entities.Project.fields.underground_lead_in_loss_psi
          - entities.HazardArea.fields.ceiling_slope_pct
        distinguishing_aspect: |
          Four declared defaults are applied when their inputs are absent: Engineer.license_status
          ACTIVE, Engineer.discipline FIRE_PROTECTION, AhjReviewer.discipline FIRE,
          Project.underground_lead_in_loss_psi 0.0 and HazardArea.ceiling_slope_pct 0.0 - and the
          0.0 lead-in default is observable because it leaves required_psi_at_demand equal to the
          calculation's own required_psi_at_base_of_riser.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /engineers"
              payload: { full_name: "Owen Petrov", license_state: "TX", license_number: "PE-91004" }
              as: FirmAdmin
              captures: { e_def: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Nadia Frost", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r_def: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2604", building_name: "Default Fixture Building", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "MERCANTILE", building_height_ft: 20.0, lead_engineer_id: "${e_def}", ahj_reviewer_id: "${r_def}" }
              as: FirmAdmin
              captures: { p_def: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p_def}", label: "Sales Floor", hazard_class: "ORDINARY_1", commodity_class: "CLASS_III", storage_height_ft: 8.0, ceiling_height_ft: 12.0, area_sqft: 1800.0, sprinkler_system_type: "WET" }
              as: DesignEngineer
              as_user_id: "${e_def}"
              captures: { ha_def: $.data.id }
          assert:
            - "Engineer.${e_def}.license_status == ACTIVE"
            - "Engineer.${e_def}.discipline == FIRE_PROTECTION"
            - "AhjReviewer.${r_def}.discipline == FIRE"
            - "Project.${p_def}.underground_lead_in_loss_psi == 0.0"
            - "HazardArea.${ha_def}.ceiling_slope_pct == 0.0"
            - "HazardArea.${ha_def}.room_has_unprotected_opening == false"
            - "HazardArea.${ha_def}.design_density == 0.150"
            - "HazardArea.${ha_def}.design_area_sqft == 1500"

      - name: hydraulic_calculation_demand_snapshot_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - endpoints.POST_/hydraulic-calculations
          - calculations.hazard_design_demand
          - entities.HydraulicCalculation.fields.design_flow_gpm
          - entities.HydraulicCalculation.fields.hazard_total_demand_gpm
          - entities.HydraulicCalculation.fields.authored_by_engineer_id
        distinguishing_aspect: |
          POST /hydraulic-calculations accepts only project_id, hazard_area_id, method and k_factor;
          every demand figure on the row is derived - 0.320 x 2500 x 1.10 = 880.0 design flow, 500.0
          hose allowance carried from the hazard area, 0.0 room penalty for AREA_DENSITY and 1380.0
          hazard total - and authored_by_engineer_id is taken from the acting X-User-ID, not the body.
        test_recipe:
          setup:
            - "Project FP-2601 with hazard area Rack Storage Bay A: EXTRA_1 after escalation, density 0.320, design area 2500 sqft, hose 500.0 gpm"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
          trigger:
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "AREA_DENSITY", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { hc1: $.data.id }
          assert:
            - "HTTP 201"
            - "HydraulicCalculation.${hc1}.design_flow_gpm == 880.0"
            - "HydraulicCalculation.${hc1}.hose_allowance_gpm == 500.0"
            - "HydraulicCalculation.${hc1}.room_design_penalty_gpm == 0.0"
            - "HydraulicCalculation.${hc1}.hazard_total_demand_gpm == 1380.0"
            - "HydraulicCalculation.${hc1}.authored_by_engineer_id == ${e1}"
            - "HydraulicCalculation.${hc1}.state == DRAFT"
            - "HydraulicCalculation.${hc1}.chain_start_index == 1"
            - "HydraulicCalculation.${hc1}.iteration_count == 0"
            - "HydraulicCalculation.${hc1}.end_head_psi == 0.0"
            - "HydraulicCalculation.${hc1}.required_psi_at_base_of_riser == 0.0"
            - "Project.${p1}.governing_hydraulic_calculation_id == null because a DRAFT calculation is not eligible"

      - name: project_system_fields_are_server_minted_and_version_moves_on_every_write
        claim_type: system_fields
        grounds:
          - entities.Project
          - endpoints.POST_/auxiliary-systems
          - endpoints.GET_/projects/{id}
        distinguishing_aspect: |
          Project carries common_fields, so id, created_at, updated_at and version are minted by the
          server: the id is a UUID unrelated to the supplied project_number FP-2601, and the version
          returned after the auxiliary-system write is exactly one greater than the version captured
          from the create response, because POST /auxiliary-systems increments Project.version by 1.
        test_recipe:
          setup:
            - "Engineer and reviewer registered; no project exists"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stair 1 and 2 standpipes", riser_count: 2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux1: $.data.id }
            - call: "GET /projects/${p1}"
              as: FirmAdmin
              captures: { pv1: $.data.version }
          assert:
            - "Project.${p1}.id is a server-minted UUID and is not the string 'FP-2601'"
            - "Project.${p1}.created_at and Project.${p1}.updated_at are ISO-8601 instants"
            - "${pv1} == ${pv0} + 1 - exactly one version step for the one auxiliary write"
            - "Project.${p1}.auxiliary_demand_gpm == 750.0"
            - "AuxiliarySystem.${aux1}.id is a server-minted UUID distinct from ${p1}"

      - name: enum_and_numeric_range_violations_are_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=9]
          - entities.Project.fields.occupancy_type
          - entities.FlowTest.fields.residual_psi
          - entities.HydraulicCalculation.fields.method
          - entities.AuxiliarySystem.fields.riser_count
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Four distinct shape violations all land on 422 ERR_INVALID_REQUEST: an occupancy_type
          outside the five-member enum, a flow test whose residual_psi equals its static_psi
          (the constraint is strictly less than), a hydraulic method outside {AREA_DENSITY,
          ROOM_DESIGN} and a riser_count of 0 against the ">= 1 when present" constraint.
        test_recipe:
          setup:
            - "Project FP-2601 exists with lead engineer Dana Ruiz and hazard area Rack Storage Bay A"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { project_number: "FP-2699", building_name: "Bad Occupancy", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "WAREHOUSE", building_height_ft: 30.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /flow-tests"
              payload: { project_id: "${p1}", hydrant_tag: "H-99", static_psi: 80.0, residual_psi: 80.0, flow_gpm: 1200.0, tested_at: "2026-06-01T12:00:00Z" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err_residual: $.data.error_id }
            - call: "POST /hydraulic-calculations"
              payload: { project_id: "${p1}", hazard_area_id: "${ha1}", method: "PIPE_SCHEDULE", k_factor: 25.2 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err_method: $.data.error_id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Zero risers", riser_count: 0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err_riser: $.data.error_id }
          assert:
            - "all four triggers return HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /projects?status=DESIGN returns total_count == 1 - the bad project was never created"
            - "GET /projects/${p1}/flow-tests returns total_count == 0"
            - "GET /hydraulic-calculations?project_id=${p1} returns total_count == 0"
            - "GET /auxiliary-systems?project_id=${p1} returns total_count == 0"

      - name: immutable_rows_carry_no_version_and_no_mutating_endpoint
        claim_type: immutability
        grounds:
          - entities.FlowTest
          - entities.Engineer
          - entities.AhjReviewer
          - entities.PipeSizingIteration
          - endpoints.GET_/projects/{id}/flow-tests
        distinguishing_aspect: |
          Engineer, AhjReviewer, FlowTest and PipeSizingIteration are declared common_fields false:
          their responses carry no version field, §1.5 declares no PUT / PATCH / DELETE for them, and
          the witnessed flow test read back after two later project writes is byte-identical to the
          values posted - 80.0 / 64.0 / 2250.0 at 2026-05-14T15:00:00Z.
        test_recipe:
          setup:
