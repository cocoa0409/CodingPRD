              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
          trigger:
