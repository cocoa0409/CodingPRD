            - "Interior-overlapping year rejected with ERR_PERIOD_OVERLAP"

      - name: eligibility_span_closed_interval_touching_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_SPAN_OVERLAP]
          - entities.EligibilitySpan.fields.end_date
        distinguishing_aspect: |
          Resource EligibilitySpan with CLOSED interval semantics (different
          from the year's half-open windows): a span starting on the exact
          end_date of an existing span SHARES that date and is rejected with
          ERR_SPAN_OVERLAP; only a span starting the day after is accepted.
        test_recipe:
          setup:
            - "Program, member M-001 with span [2026-01-01, 2026-06-30] (closed)"
          setup_api_calls:
            - { call: "POST /vbc/programs", payload: { program_name: "MA Value", line_of_business: MEDICARE_ADVANTAGE }, as: PayerAdmin, captures: { pg: $.data.id } }
            - { call: "POST /vbc/members", payload: { program_id: "${pg}", member_ref: "M-001", birth_year: 1980 }, as: PayerAdmin, captures: { m1: $.data.id } }
            - { call: "POST /vbc/eligibility-spans", payload: { member_id: "${m1}", start_date: "2026-01-01", end_date: "2026-06-30" }, as: PayerAdmin, captures: { sp1: $.data.id } }
          trigger:
            - { call: "POST /vbc/eligibility-spans", payload: { member_id: "${m1}", start_date: "2026-06-30", end_date: "2026-12-31" }, as: PayerAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /vbc/eligibility-spans", payload: { member_id: "${m1}", start_date: "2026-07-01", end_date: "2026-12-31" }, as: PayerAdmin, captures: { sp2: $.data.id } }
          assert:
            - "Touching span (start 2026-06-30 == existing end) rejected with ERR_SPAN_OVERLAP (closed intervals share that date)"
            - "Span starting 2026-07-01 accepted (disjoint)"

  - rule_id: compensating_invariant
    instances:
      - name: attribution_exclude_reinstate_member_months_conserved
        grounds:
          - state_machines.AttributionRecord.CONFIRMED_to_EXCLUDED
          - state_machines.AttributionRecord.EXCLUDED_to_CONFIRMED
          - calculations.attribution_rollup
        distinguishing_aspect: |
          Conserved quantity: member-months (a count, not money). Excluding
          M1's record drops total_member_months 18 -> 6 and benchmark
          1,800,000 -> 600,000; reinstating restores exactly 18 / 1,800,000 —
          the forward+compensating pair leaves the conserved quantity identical.
