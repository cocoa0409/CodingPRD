            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob M", patient_dob: "1980-02-20", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: false }, as: GeneticCounselor, as_user_id: "${cid}", captures: { mem_id: $.data.id } }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /cascade-invitations", payload: { family_id: "${fid}", proband_case_id: "${case_id}", pedigree_member_id: "${mem_id}", relative_name: "Rel M", relationship: "SIBLING", degree: 1, contact_method: "PHONE", expires_at: "2026-07-01T00:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { inv_id: $.data.id } }
          trigger:
