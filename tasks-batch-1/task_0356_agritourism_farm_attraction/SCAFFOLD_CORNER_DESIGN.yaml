              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 5 }
              as: FarmManager
              captures: { window_id: $.data.id }
            - call: "POST /farms/${farm_id}/weather-events"
              payload: { kind: "CLOSURE", affected_span_start: "2026-10-11T00:00:00Z", affected_span_end: "2026-10-12T00:00:00Z", note: "closure cancels window" }
              as: FarmManager
            - call: "POST /farms/${farm_id}/weather-events"
              payload: { kind: "CLEARED", note: "reopened" }
              as: FarmManager
            - call: "POST /visitors"
              payload: { email: "cw2@x.com", full_name: "Cal Window" }
              as: FarmManager
              captures: { visitor_id: $.data.id }
            - call: "GET /admission-windows/${window_id}"
              payload: {}
              as: FarmManager
              captures: { win_v_now: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${visitor_id}", adult_count: 1, child_count: 0, expected_window_version: "${win_v_now}" }
              as: Visitor
              as_user_id: "${visitor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "AdmissionWindow.${window_id}.status == CANCELLED"
            - "Farm.${farm_id}.operational_status == OPEN"
            - "response.data.error_id == ERR_WINDOW_CANCELLED"

