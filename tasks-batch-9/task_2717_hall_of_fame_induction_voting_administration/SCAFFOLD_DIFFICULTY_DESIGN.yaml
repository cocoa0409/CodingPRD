              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /candidates"
              payload: { full_name: "Banned Great", category: "PLAYER", retirement_year: 2018, career_seasons: 18, career_metric_value: 3600, is_deceased: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cand_bad: "$.data.id" }
            - call: "POST /candidates"
              payload: { full_name: "Clean Journeyman", category: "PLAYER", retirement_year: 2017, career_seasons: 11, career_metric_value: 2050, is_deceased: false }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cand_ok: "$.data.id" }
            - call: "POST /candidates/${cand_bad}/permanent-ineligibility"
              payload: { permanently_ineligible_reason: "Lifetime ban from the sport" }
              as: ElectionAdministrator
              as_user_id: "admin-1"
            - call: "POST /induction-cycles"
              payload: { cycle_year: 2026, sport_code: "BASEBALL", max_inductees: 5, travel_budget_cents: 1000000, escort_pool_size: 1 }
              as: ElectionAdministrator
              as_user_id: "admin-1"
              captures: { cyc: "$.data.id" }
            - call: "POST /induction-cycles/${cyc}/open-nominations"
              payload: {}
              as: ElectionAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /candidacies"
              payload: { cycle_id: "${cyc}", candidate_id: "${cand_bad}", nominated_by_elector_id: "${e1}", pathway: "MODERN" }
              as: Elector
              as_user_id: "${e1}"
              captures: { err_inelig: "$.data.error_id" }
            - call: "POST /candidacies"
              payload: { cycle_id: "${cyc}", candidate_id: "${cand_ok}", nominated_by_elector_id: "${e1}", pathway: "MODERN" }
              as: Elector
              as_user_id: "${e1}"
              captures: { c_ok: "$.data.id" }
          assert:
            - "the banned candidate's nomination returns HTTP 422 and ${err_inelig} == ERR_CANDIDATE_INELIGIBLE"
            - "Candidate.${cand_bad}.hof_status == PERMANENTLY_INELIGIBLE"
            - "the clean candidate's nomination returns HTTP 201"
            - "Candidacy.${c_ok}.status == SUBMITTED"
            - "Candidacy.${c_ok}.candidate_id == ${cand_ok}"
            - "Candidacy.${c_ok}.eligible_from_year == 2022"
            - "InductionCycle.${cyc}.nomination_count == 1"
      - name: vote_submission_blocked_by_elector_suspension
        grounds:
          - validations[priority=43]
          - state_machines.Elector.CREDENTIALED_to_SUSPENDED
          - state_machines.Elector.SUSPENDED_to_CREDENTIALED
          - entities.Elector.fields.status
          - endpoints[POST /vote-submissions]
        distinguishing_aspect: |
          A different entity pair from nomination_blocked_by_candidate_hof_status: VoteSubmission ->
          Elector. The identical request body - same ballot, same slot, same
          expected_ballot_version - is rejected with ERR_ELECTOR_NOT_CREDENTIALED (403) while the
