  # -------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: rbac_posclerk_create_site_forbidden
        claim_type: peer_roles
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POSClerk calling POST /nutrition/sites (a PlatformAdmin-exclusive op) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /nutrition/sites", payload: { name: "X", site_code: "X-1" }, as: POSClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: rbac_missing_role_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no recognized X-User-Role returns ERR_UNAUTHENTICATED (401) before any authorization check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /nutrition/sites", payload: { name: "X", site_code: "X-2" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: segregation_menu_approver_equals_submitter_rejected
        claim_type: Segregation of duties
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.MenuCycle.fields.submitted_by_user_id"]
        distinguishing_aspect: "When the same X-User-ID that submitted a menu attempts to approve it, ERR_SEGREGATION_OF_DUTIES (409) is returned."
        test_recipe:
          setup: ["A compliant menu submitted for review by user 'same_person'."]
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "SoD", site_code: "SOD-1" }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Ent", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Grn", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Fru", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "same_person" }
          trigger:
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "same_person", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 409"

  # ------------------------------------------------ cross-cutting complexity
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_claim_version_conflict
