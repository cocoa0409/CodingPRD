  # ===========================================================================
  - section: errors
    instances:

      - name: stale_store_version_on_campaign_activation
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[campaign-activate-stale-store]
          - errors.ERR_STALE_STORE_VERSION
        distinguishing_aspect: "A client holding Store.version 1 activates a READY campaign successfully (version advances to 2); a second activation attempt of another READY campaign still carrying version 1 is rejected ERR_STALE_STORE_VERSION 412 — two strictly sequential requests, deterministic."
        test_recipe:
          setup:
            - "Store; TWO campaigns both driven to READY (fall-v1 and winter-v1); clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *k_clock_sep10
            - *k_store_create
            - call: "POST /season-campaigns"
              payload: { store_id: "${c_store_id}", season: "FALL_FEED", planogram_map: "fall-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { occ_camp1: $.data.id }
            - call: "POST /season-campaigns/${occ_camp1}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${occ_camp1}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${occ_camp1}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns"
              payload: { store_id: "${c_store_id}", season: "WINTER_HEATING", planogram_map: "winter-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { occ_camp2: $.data.id }
            - call: "POST /season-campaigns/${occ_camp2}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${occ_camp2}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${occ_camp2}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
          trigger:
            - call: "POST /season-campaigns/${occ_camp1}/activate"
              payload: { expected_store_version: "${c_store_v0}" }
              as: RegionalAdmin
              captures: { occ_ok: $.data.status }
            - call: "POST /season-campaigns/${occ_camp2}/activate"
              payload: { expected_store_version: "${c_store_v0} - 1" }
              as: RegionalAdmin
              captures: { occ_err: $.data.error_id }
          assert:
            - "occ_ok == ACTIVE and Store.version is now 2"
            - "occ_err == ERR_STALE_STORE_VERSION (412) — the second activation observed version 1 minus nothing... it carries a stale view"
            - "SeasonCampaign.${occ_camp2}.status == READY (unchanged by the rejected call)"

      - name: stale_lot_version_on_chick_order_create
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[chick-order-create-stale-lot]
          - errors.ERR_STALE_LOT_VERSION
        distinguishing_aspect: "After a first reservation bumps the lot version, a second reservation carrying the pre-reservation version is rejected ERR_STALE_LOT_VERSION 412 even though plenty of birds remain — OCC guards the reservation view, not capacity."
        test_recipe:
          setup:
            - "Spring store; lot 100 ON_SALE (version captured after open-sale); account; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *k_clock_mar10
            - *k_spring_store
            - *k_spring_campaign
            - *k_spring_teardown
            - *k_spring_reset
            - *k_spring_verify
            - *k_spring_activate
            - *k_spring_schedule
            - *k_spring_publish
            - *k_spring_lot
            - *k_spring_open_sale
            - *k_spring_account
          trigger:
            - call: "POST /chick-orders"
              payload: { store_id: "${k_store_id}", livestock_lot_id: "${k_lot_id}", loyalty_account_id: "${k_acct_id}", quantity: 6, pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${k_lot_v}" }
              as: Customer
              as_user_id: "${k_acct_id}"
              captures: { occ_ord1: $.data.id }
            - call: "POST /chick-orders"
              payload: { store_id: "${k_store_id}", livestock_lot_id: "${k_lot_id}", loyalty_account_id: "${k_acct_id}", quantity: 6, pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${k_lot_v} - 1" }
              as: Customer
              as_user_id: "${k_acct_id}"
              captures: { occ_lot_err: $.data.error_id }
          assert:
            - "ChickOrder.${occ_ord1}.status == RESERVED (first reservation bumped lot version)"
            - "occ_lot_err == ERR_STALE_LOT_VERSION (412) despite 94 birds remaining"

      - name: brooder_check_failure_blocks_verification
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BROODER_CHECK_FAILED
        distinguishing_aspect: "verify-brooder with thermometer_ok false fails ERR_BROODER_CHECK_FAILED and the order stays RESERVED with brooder_verified_at still null."
        test_recipe:
