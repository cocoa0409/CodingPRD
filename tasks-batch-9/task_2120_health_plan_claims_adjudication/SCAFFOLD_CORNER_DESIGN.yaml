              payload: { claim_number: "CLM-RB-4", member_id: "${mem_id}", provider_id: "${prov_b}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /adjudication/claims/${c_id}"
              payload: {}
              as: ProviderRep
              as_user_id: "${prov_a}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PROVIDER_SCOPE_VIOLATION"
            - "HTTP status is 403"
            - "The same GET as ProviderRep with X-User-ID == ${prov_b} returns HTTP 200"

      - name: provider_rep_may_submit_a_claim_for_its_own_provider_id
        claim_type: exclusive_operations_allowed
        grounds: ["roles.ProviderRep", "endpoints[POST /adjudication/claims]"]
        distinguishing_aspect: "POST /adjudication/claims is shared between ClaimsIntake and ProviderRep; a rep whose X-User-ID equals the body's provider_id creates the claim with HTTP 201 and the claim lands in RECEIVED."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan RB-5, IN_NETWORK provider RB5 Clinic, fee schedule rate 73721 = 40000, member M-RB-5 with an open-ended PRIMARY coverage from 2026-01-01."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "RB-5", name: "RBAC Plan Five", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "5000000006", name: "RB5 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-RB-5", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-RB-5", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { c_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP status is 201"
            - "${st} == RECEIVED"
            - "Claim.${c_id}.provider_id == ${prov_id}"

      - name: medical_director_with_a_different_user_id_releases_a_pended_claim
        claim_type: segregation_of_duties
        grounds: ["roles.MedicalDirector", "validations[priority=40]", "state_machines.Claim.status.PENDED_to_ADJUDICATED"]
        distinguishing_aspect: "The segregation-of-duties check passes when the overriding MedicalDirector's X-User-ID (u-md-6) differs from Claim.last_adjudicated_by_user_id (u-examiner-6), so the override succeeds and the claim reaches ADJUDICATED with total_allowed_cents 40000."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan RB-6 (deductible 0, coinsurance 0), IN_NETWORK provider, fee schedule rate 73721 = 40000, one AUTH_REQUIRED EditRule on 73721 (severity PEND, precedence_rank 30)."
            - "Member M-RB-6 has one open-ended PRIMARY coverage segment from 2026-01-01 and NO authorizations."
            - "Claim CLM-RB-6 (one 73721 line, 1 unit, billed 60000) was adjudicated by X-User-ID u-examiner-6, so it is PENDED with PEND_AUTH_MISSING."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "RB-6", name: "RBAC Plan Six", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "5000000007", name: "RB6 Imaging", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/edit-rules"
              payload: { rule_code: "MP-73721-AUTH-RB6", edit_type: "AUTH_REQUIRED", primary_code: "73721", severity: "PEND", precedence_rank: 30, reason_code: "PEND_AUTH_MISSING" }
              as: PlanAdmin
            - call: "POST /adjudication/members"
              payload: { member_number: "M-RB-6", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-RB-6", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "u-examiner-6"
              captures: { st_pend: $.data.status, reason_pend: $.data.pend_reason_code }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/override"
              payload: { decision: "APPROVE" }
              as: MedicalDirector
              as_user_id: "u-md-6"
              captures: { st_after: $.data.status, allowed_after: $.data.total_allowed_cents, pend_after: $.data.pend_reason_code }
          assert:
            - "${st_pend} == PENDED and ${reason_pend} == PEND_AUTH_MISSING"
            - "${st_after} == ADJUDICATED and ${pend_after} == null"
            - "${allowed_after} == 40000"
            - "GET /adjudication/claim-lines?claim_id=${c_id} returns one line with line_status == PRICED and authorization_id == null"
            - "GET /adjudication/claims/${c_id}/events contains an OVERRIDE row with actor_user_id == u-md-6"

      - name: error_segregation_of_duties_denial
        claim_type: segregation_of_duties
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=40]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / override_state_error_outranks_segregation_of_duties_error
          rationale: "The segregation-of-duties rule and its interaction with the higher-priority state check are exercised by the named §1.8 instance; the positive path is covered by medical_director_with_a_different_user_id_releases_a_pended_claim."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_claim_version_on_cob_posting_returns_stale_claim_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cob-posting-stale-claim]", "errors[ERR_STALE_CLAIM_VERSION]", "validations[priority=35]"]
        distinguishing_aspect: "Two strictly sequential COB postings that both carry the version observed at intake: the first succeeds and advances Claim.version, the second is rejected with ERR_STALE_CLAIM_VERSION (412) and leaves other_payer_paid_cents at the first posting's value."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan CC-1 (deductible 0, coinsurance 0), IN_NETWORK provider, fee schedule rate 73721 = 40000."
            - "Member M-CC-1 has one open-ended SECONDARY coverage segment from 2026-01-01, so the claim's cob_role is SECONDARY."
            - "Claim CLM-CC-1 is in RECEIVED with version 1 and other_payer_paid_cents null."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "CC-1", name: "Cross Cutting Plan One", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "6000000001", name: "CC1 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-CC-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "SECONDARY", other_payer_name: "Other Health" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-CC-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id, c_v0: $.data.version }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/other-payer-payment"
              payload: { other_payer_paid_cents: 12000, expected_claim_version: "${c_v0}" }
              as: ClaimsIntake
              captures: { c_v1: $.data.version, paid1: $.data.other_payer_paid_cents }
            - call: "POST /adjudication/claims/${c_id}/other-payer-payment"
              payload: { other_payer_paid_cents: 19000, expected_claim_version: "${c_v0}" }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${paid1} == 12000 and the first posting returns HTTP 200"
            - "${c_v1} == ${c_v0} + 1"
            - "${err_id} == ERR_STALE_CLAIM_VERSION and HTTP status is 412"
            - "Claim.${c_id}.other_payer_paid_cents == 12000 (the stale posting changed nothing)"
            - "A third posting carrying ${c_v1} succeeds"

      - name: stale_expected_accumulator_version_on_adjustment_returns_stale_accumulator_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[accumulator-adjustment-stale-accumulator]", "errors[ERR_STALE_ACCUMULATOR_VERSION]", "entities.BenefitAccumulator.fields.oop_applied_cents"]
        distinguishing_aspect: "A repeatable delta posting is guarded only by OCC: the first adjustment at the observed version succeeds and moves oop_applied_cents to 5000, the second carrying the same version is rejected with ERR_STALE_ACCUMULATOR_VERSION (412) and the balance stays 5000."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan CC-2 and member M-CC-2 exist, so the plan_year 2026 accumulator sits at 0 / 0."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "CC-2", name: "Cross Cutting Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-CC-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "GET /adjudication/members/${mem_id}/accumulators"
              payload: {}
              as: PlanAdmin
              captures: { acc_id: "$.data[0].id", acc_v0: "$.data[0].version" }
          trigger:
            - call: "POST /adjudication/accumulators/${acc_id}/adjustments"
              payload: { expected_accumulator_version: "${acc_v0}", deductible_delta_cents: 0, oop_delta_cents: 5000 }
              as: PlanAdmin
              captures: { acc_v1: $.data.version, oop1: $.data.oop_applied_cents }
            - call: "POST /adjudication/accumulators/${acc_id}/adjustments"
              payload: { expected_accumulator_version: "${acc_v0}", deductible_delta_cents: 0, oop_delta_cents: 5000 }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${oop1} == 5000 and the first adjustment returns HTTP 200"
            - "${acc_v1} == ${acc_v0} + 1"
            - "${err_id} == ERR_STALE_ACCUMULATOR_VERSION and HTTP status is 412"
            - "GET /adjudication/members/${mem_id}/accumulators still shows oop_applied_cents == 5000"
            - "Re-sending the same delta with ${acc_v1} succeeds and moves oop_applied_cents to 10000"

      - name: error_cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: ["state_machines.Claim.status.FINALIZED_to_VOIDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / void_cascade_reverses_remittance_accumulator_lines_and_auth_units
          rationale: "The N-level cascade, its ordering and its end-to-end effects are asserted hop by hop by the named §1.8 instance."

      - name: error_rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds: ["calculations.oop_cap_reconciliation"]
        excluded_because:
          difficulty_instance: combinatorial_formula / oop_cap_uses_pass_start_accumulator_snapshot_not_midclaim_reread
          rationale: "The cumulative out-of-pocket threshold and its exact boundary behaviour are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: finalize_response_and_immediate_reads_reflect_the_posted_accumulator
        claim_type: immediate
        grounds: ["state_machines.Claim.status.ADJUDICATED_to_FINALIZED", "entities.BenefitAccumulator.fields.remitted_claim_count", "entities.RemittanceAdvice.fields.remit_number"]
        distinguishing_aspect: "The consistency model is immediate: the finalize response already carries payment_status REMITTED, and reads issued straight afterwards already show the remittance RA-CLM-CM-1-1 and accumulator 40000 / 42000 with remitted_claim_count 1 — no second call or delay is needed."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan CM-1 with deductible 40000, oop_max 300000 and coinsurance 0.20."
            - "IN_NETWORK provider CM1 Clinic, no contract; fee schedule rate 73721 = 50000 effective 2026-01-01."
            - "Member M-CM-1 has one open-ended PRIMARY coverage segment from 2026-01-01 and a zeroed plan_year 2026 accumulator."
            - "Claim CLM-CM-1 (one 73721 line, 1 unit, billed 60000, service 2026-02-10) has been adjudicated to allowed 50000, deductible 40000, coinsurance 2000, member 42000, plan 8000."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "CM-1", name: "Consistency Plan One", deductible_individual_cents: 40000, oop_max_individual_cents: 300000, coinsurance_member_pct: 0.20 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "7000000001", name: "CM1 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 50000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-CM-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-CM-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { member_adj: $.data.total_member_liability_cents, plan_adj: $.data.total_plan_paid_cents, ded_adj: $.data.total_deductible_applied_cents }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/finalize"
              payload: {}
              as: ClaimsExaminer
              captures: { st: $.data.status, pay: $.data.payment_status }
            - call: "GET /adjudication/claims/${c_id}/remittances"
              payload: {}
              as: ClaimsExaminer
              captures: { remit_no: "$.data[0].remit_number", remit_plan_paid: "$.data[0].total_plan_paid_cents", remit_status: "$.data[0].status" }
            - call: "GET /adjudication/members/${mem_id}/accumulators"
              payload: {}
              as: PlanAdmin
              captures: { acc_ded: "$.data[0].deductible_applied_cents", acc_oop: "$.data[0].oop_applied_cents", acc_cnt: "$.data[0].remitted_claim_count" }
          assert:
            - "${ded_adj} == 40000, ${member_adj} == 42000 and ${plan_adj} == 8000"
            - "${remit_no} == RA-CLM-CM-1-1, ${remit_status} == ISSUED and ${remit_plan_paid} == 8000"
            - "${acc_ded} == 40000, ${acc_oop} == 42000 and ${acc_cnt} == 1"
            - "${st} == FINALIZED and ${pay} == REMITTED in the finalize response itself"
            - "GET /adjudication/claims/${c_id}/remittances immediately returns total_count == 1 with remit_number == RA-CLM-CM-1-1, status == ISSUED, total_plan_paid_cents == 8000 and total_member_liability_cents == 42000"
            - "GET /adjudication/members/${mem_id}/accumulators immediately returns deductible_applied_cents == 40000, oop_applied_cents == 42000 and remitted_claim_count == 1"
            - "GET /adjudication/claim-lines?claim_id=${c_id} immediately returns one line with line_status == PAID"
