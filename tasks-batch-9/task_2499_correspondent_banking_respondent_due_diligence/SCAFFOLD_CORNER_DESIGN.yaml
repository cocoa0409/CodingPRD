          - endpoints[POST /correspondent-banking/closure-plans/{closurePlanId}/settlement-allocation]
        distinguishing_aspect: "REVERSE of the exact last_allocated_cents is the precise inverse of the 34/33/33 allocation: settled_cents returns to 0, outstanding returns to the original 1000, allocation_round decrements to 0 and - because it reached 0 - allocation_lines is cleared and last_allocated_cents is reset to 0, so a second REVERSE would be refused."
        test_recipe:
