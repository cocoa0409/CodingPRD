      - name: batch_format_must_match_its_campaign_format
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_21
          - errors[ERR_FORMAT_MISMATCH]
          - calculations.viewability_and_coverage
        distinguishing_aspect: |
          Both halves of the rule are pinned in one fixture: a DISPLAY batch
          submitted against a VIDEO campaign is refused with
          ERR_FORMAT_MISMATCH, and the matching VIDEO batch is accepted AND
          scored against the VIDEO thresholds (2.0 seconds, 0.5 pixel), not the
          display ones - so an implementation that lets the mismatch through
          would also silently apply the wrong viewability standard.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; VIDEO campaign; VIEWABILITY methodology with video_in_view_seconds 2.0 and video_pixel_pct 0.5; one classified page."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
