              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Agent One Group", license_code: "AGT-PA-1" }
              as: ElitesDirector
              captures: { agt1_id: "$.data.id" }
            - call: POST /rep-agents
              payload: { agency_name: "Agent Two Group", license_code: "AGT-PA-2" }
              as: ElitesDirector
              captures: { agt2_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Peer Pete", country_code: USA, gender: MALE, birth_date: "1997-07-01" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual PA", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-PA-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt1_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id" }
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 400000, air_class: ECONOMY, hotel_nights: 2, ground_transport: false }
              as: ElitesDirector
              captures: { inv_v: "$.data.version" }
          trigger:
            - call: POST /invitations/${inv_id}/respond
              payload: { decision: ACCEPT }
              as: AthleteAgent
              as_user_id: "${agt2_id}"
              captures: { err1: "$.data.error_id" }
            - call: POST /invitations/${inv_id}/negotiation-rounds
              payload: { appearance_fee_cents: 900000, air_class: BUSINESS, hotel_nights: 4, ground_transport: true, expected_invitation_version: "${inv_v}" }
              as: AthleteAgent
              as_user_id: "${agt2_id}"
              captures: { err2: "$.data.error_id" }
            - call: GET /invitations/${inv_id}
              as: ElitesDirector
            - call: POST /invitations/${inv_id}/negotiation-rounds
              payload: { appearance_fee_cents: 900000, air_class: BUSINESS, hotel_nights: 4, ground_transport: true, expected_invitation_version: "${inv_v}" }
              as: AthleteAgent
              as_user_id: "${agt1_id}"
            - call: GET /invitations/${inv_id}/negotiation-rounds
              payload: { side: AGENT }
              as: FinanceOfficer
          assert:
            - "trigger call 1 returns HTTP 403 with error_id == ERR_NOT_INVITATION_AGENT — the role is right, the identity is not"
            - "trigger call 2 returns HTTP 403 with error_id == ERR_NOT_INVITATION_AGENT — the identity check runs before the version check, so the correct expected_invitation_version does not help"
            - "trigger call 3 shows the invitation untouched: status still OFFERED, round_count == 0 and version still the value captured after the offer"
            - "trigger call 4 returns HTTP 201 from the rightful agent with round_number == 1, side == AGENT and the invitation now COUNTERED"
            - "trigger call 5 returns total_count == 1 — agent two's two attempts created no NegotiationRound rows"

      - name: corner_rbac_segregation_of_duties_between_approver_and_payer
        claim_type: segregation_of_duties
        grounds:
          - roles.FinanceOfficer
          - validations[priority=11]
