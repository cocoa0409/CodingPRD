            - "Response error_id == ERR_UNAUTHORIZED"

  # =====================================================================
  # Section 8: Cross-cutting complexity layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_assessment_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payment-create-stale-assessment]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two SEQUENTIAL POST /payments. First with expected_assessment_version=1 succeeds, advances Assessment.version to 2. Second with stale expected_assessment_version=1 → 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Assessment exists with principal=20000, version=1"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "OCC1", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "occ1@x.com", full_name: "OCC1" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "OCC1-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 20000, due_date: "2027-06-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, a_v_initial: $.data.version }
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 5000, expected_assessment_version: "${a_v_initial}" }
              as: Treasurer
          trigger:
            - call: "POST /hoa/payments"
              payload: { assessment_id: "${a_id}", amount_cents: 5000, expected_assessment_version: "${a_v_initial}" }
              as: Treasurer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412"
            - "Response error_id == ERR_STALE_VERSION"

      - name: occ_stale_community_version_rejects_election_open
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[election-open-stale-community]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /elections/{id}/open with expected_community_version that mismatches actual Community.version → 412 ERR_STALE_VERSION. Trigger: an unrelated mutation bumped Community.version after caller's last read. We simulate by calling open with `${c_v} - 1` (an arithmetic stale form)."
        test_recipe:
          setup:
            - "Community + Owner + Property + Election DRAFT exist; Community.version captured at creation"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "OCC2", fiscal_year_start_month: 1, regular_assessment_cents: 30000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "occ2@x.com", full_name: "OCC2" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "OCC2-1" }
              as: PlatformAdmin
            - call: "POST /hoa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/elections"
              payload: { community_id: "${c_id}", cycle_label: "OCC2-FY", opens_at: "2026-02-01T00:00:00Z", closes_at: "2026-02-16T00:00:00Z" }
              as: BoardSecretary
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hoa/elections/${e_id}/open"
              payload: { expected_community_version: "${c_v} - 1" }
              as: BoardSecretary
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412"
            - "Response error_id == ERR_STALE_VERSION"

      - name: derived_field_account_balance_reflects_payment_and_reverse
        claim_type: derived_field_reconciliation
        grounds: [entities.Property.fields.account_balance_cents]
        distinguishing_aspect: "Property.account_balance_cents is a derived/computed field reconciled on every payment AND every payment reversal. (Sibling of §1.8 Rule-9 instance 1 but emphasizing the read-side observation, not the conservation invariant.)"
        excluded_because:
          difficulty_instance: compensating_invariant / payment_reverse_preserves_property_account_balance
          rationale: "The same scenario is asserted as the conservation invariant in §1.8 Rule 9 instance 1; covered there."

  # =====================================================================
  # Section 9: Consistency Model — immediate
  # =====================================================================
  - section: consistency_model
    instances:

      - name: assessment_creation_visible_in_immediate_get_response
        claim_type: immediate
        grounds: [response_envelope]
        distinguishing_aspect: "Per complexity_profile.consistency_model: immediate — POST /hoa/assessments returns the just-created Assessment in the same response envelope (no eventual-consistency delay)."
        test_recipe:
          setup:
            - "Community + Owner + Property exist"
          setup_api_calls:
            - call: "POST /hoa/communities"
              payload: { name: "Imm", fiscal_year_start_month: 1, regular_assessment_cents: 10000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hoa/owners"
              payload: { community_id: "${c_id}", email: "im2@x.com", full_name: "IM2" }
              as: PlatformAdmin
              captures: { o_id: $.data.id }
            - call: "POST /hoa/properties"
              payload: { community_id: "${c_id}", owner_id: "${o_id}", unit_label: "IM2-1" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /hoa/assessments"
              payload: { property_id: "${p_id}", kind: "REGULAR", principal_cents: 10000, due_date: "2027-06-01T00:00:00Z" }
              as: Treasurer
              captures: { a_id: $.data.id, a_status: $.data.status }
            - call: "GET /hoa/assessments/${a_id}"
              payload: {}
              as: Treasurer
              captures: { got_status: $.data.status }
          assert:
            - "POST response data.status == DUE (initial state visible in create response)"
            - "Immediately-following GET returns the same Assessment with status == DUE"

