  # --- ShadowPayrollRecord ---
  - method: POST
    path: "/mobility/shadow-payroll-records"
    description: "Create a DRAFT shadow payroll record; server computes split, allowances, hypothetical tax, employer taxes from the ACTIVE split and the assignment's policy"
    roles: [PayrollSpecialist]
    code: 201
    input: [assignment_id, tax_year, period_month, total_gross_cents, per_diem_days, housing_receipts_cents]
    output: ShadowPayrollRecord
    side_effects: ["status=DRAFT; computes home_gross_cents, host_gross_cents, per_diem_cents, housing_cents, hypothetical_tax_cents, employer_host_tax_cents, employer_socsec_cents; ERR_SPLIT_NOT_ACTIVE unless split ACTIVE; ERR_PERIOD_OUTSIDE_ASSIGNMENT; ERR_DUPLICATE_PAYROLL_PERIOD; ERR_PER_DIEM_DAYS_INVALID"]
  - method: GET
