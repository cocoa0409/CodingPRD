# =============================================================================
# Task 1252 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 claims NOT covered by SCAFFOLD_DIFFICULTY_DESIGN.
# All chains replayable from empty DB. Clock default: 2026-05-01T00:00:00Z.
# Shared fixtures: PN-100 rev A (area 2.0, plies 200+300 g/m2, fv 0.5 ->
# target_part_weight_g 2000.0, tolerance 0.05); T0 = 2026-06-01T10:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: ply_book_created_with_defaults_and_draft_status
        claim_type: creation
        grounds: [entities.PlyBook]
        distinguishing_aspect: "Omitting tolerance_pct and max_repair_attempts applies the declared defaults 0.05 and 2; new book starts DRAFT with version 1."
        test_recipe:
          setup: ["Tooling engineer creates a ply book with only required fields"]
          setup_api_calls:
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id, pb_status: $.data.status, pb_tol: $.data.tolerance_pct, pb_maxrep: $.data.max_repair_attempts, pb_v: $.data.version } }
          trigger: []
          assert:
            - "pb_status == DRAFT and pb_v == 1"
            - "pb_tol == 0.05 and pb_maxrep == 2 (defaults applied)"

      - name: mold_created_with_default_prototype_phase
        claim_type: defaults
        grounds: [entities.Mold.fields.tooling_phase]
        distinguishing_aspect: "Omitting tooling_phase at mold creation yields PROTOTYPE with status ACTIVE and zeroed counters."
        test_recipe:
          setup: ["Tooling engineer creates a mold without tooling_phase"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-D1", maintenance_interval_cycles: 10, prototype_parts_required: 1 }, as: ToolingEngineer, captures: { m_phase: $.data.tooling_phase, m_status: $.data.status, m_cycles: $.data.cycles_since_maintenance, m_val: $.data.prototype_parts_validated } }
          trigger: []
          assert:
            - "m_phase == PROTOTYPE and m_status == ACTIVE"
            - "m_cycles == 0 and m_val == 0"

      - name: workorder_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.WorkOrder, "validations[priority=4]"]
        distinguishing_aspect: "POST /work-orders without quantity is rejected at the schema tier before any business check."
        test_recipe:
          setup: ["An approved ply book and a production mold exist"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-D2", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
          trigger:
            - { call: "POST /work-orders", payload: { work_order_no: "WO-D2", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (missing required quantity)"

      - name: get_workorder_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns the error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "GET /work-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: ShopManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: permit_create_computed_styrene_used_input_ignored
        claim_type: computed_fields
        grounds: [entities.EmissionPermit.fields.styrene_used_kg]
        distinguishing_aspect: "A client-supplied styrene_used_kg on creation is ignored; the computed field initializes to 0.0."
        test_recipe:
          setup: ["EHS officer creates a permit passing a forged styrene_used_kg"]
          setup_api_calls:
            - { call: "POST /emission-permits", payload: { permit_code: "PER-D3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0, styrene_used_kg: 99.0 }, as: EHSOfficer, captures: { per_used: $.data.styrene_used_kg, per_status: $.data.status } }
          trigger: []
          assert:
            - "per_used == 0.0 (computed field ignores client input) and per_status == ACTIVE"

      - name: resin_batch_rejected_at_creation_on_ratio
        claim_type: initial_state
        grounds: [state_machines.ResinBatch.MIXED_to_REJECTED]
        distinguishing_aspect: "A batch mixed 10% catalyst against a 2.0 +/- 1.0 target is born REJECTED at creation (201 with terminal status) and can never be consumed."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO in LAYUP_IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-D4", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-D4", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
          trigger:
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-D4", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 100, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 60 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id, b_status: $.data.status, b_ratio: $.data.actual_ratio_pct } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 100 }, as: Laminator, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
          assert:
            - "b_status == REJECTED and b_ratio == 10.0"
            - "err == ERR_RESIN_BATCH_NOT_USABLE"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: plybook_patch_after_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PlyBook, "errors[ERR_PLY_BOOK_NOT_DRAFT]"]
        distinguishing_aspect: "PATCH on an APPROVED book fails with ERR_PLY_BOOK_NOT_DRAFT even when the OCC version matches (state gate, not a stale write)."
        test_recipe:
          setup: ["Ply book created and approved; its current version captured"]
          setup_api_calls:
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer, captures: { pb_v: $.data.version } }
          trigger:
            - { call: "PATCH /ply-books/${pb_id}", payload: { expected_ply_book_version: "${pb_v}", tolerance_pct: 0.06 }, as: ToolingEngineer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PLY_BOOK_NOT_DRAFT"

      - name: plybook_approve_supersedes_previous_revision
        claim_type: side_effect_execution
        grounds: [state_machines.PlyBook.DRAFT_to_APPROVED, state_machines.PlyBook.APPROVED_to_SUPERSEDED]
        distinguishing_aspect: "Approving revision B of PN-100 automatically moves the previously APPROVED revision A to SUPERSEDED while B becomes APPROVED."
        test_recipe:
          setup: ["Revision A approved; revision B drafted for the same part_number"]
          setup_api_calls:
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_a: $.data.id } }
            - { call: "POST /ply-books/${pb_a}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "B", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_b: $.data.id } }
          trigger:
            - { call: "POST /ply-books/${pb_b}/approve", payload: {}, as: ToolingEngineer, captures: { b_status: $.data.status } }
            - { call: "GET /ply-books/${pb_a}", payload: {}, as: ToolingEngineer, captures: { a_status: $.data.status } }
          assert:
            - "b_status == APPROVED"
            - "a_status == SUPERSEDED (supersede cascade fired)"

      - name: scrapped_workorder_rejects_start_layup
        claim_type: terminal_lockdown
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SCRAPPED is terminal: start-layup on a scrapped order returns ERR_INVALID_STATE and no timestamp is written."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO scrapped while RELEASED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-SC1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-SC1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/scrap", payload: {}, as: ShopManager, captures: { wo_scrap: $.data.status, wo_reason: $.data.scrap_reason } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
          assert:
            - "wo_scrap == SCRAPPED and wo_reason == MANUAL"
            - "err == ERR_INVALID_STATE"

      - name: curecycle_abort_reverts_workorder_without_mold_wear
        claim_type: side_effect_execution
        grounds: [state_machines.CureCycle.RUNNING_to_ABORTED, state_machines.WorkOrder.IN_CURE_to_AWAITING_CURE]
        distinguishing_aspect: "Aborting a RUNNING cycle returns the work order to AWAITING_CURE and does NOT increment mold cycles_since_maintenance (aborted runs cause no wear)."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold interval 10; WO at IN_CURE with a running cycle"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-AB1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "OVEN-1", kind: "OVEN", max_parts_per_cycle: 10, turnaround_minutes: 0, max_temperature_c: 200, max_pressure_bar: 0 }, as: ShopManager, captures: { oven_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-AB1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-AB1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 200 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_id}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_id}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc_id: $.data.id } }
            - { call: "POST /cure-cycles/${cc_id}/start", payload: {}, as: CureTechnician }
          trigger:
            - { call: "POST /cure-cycles/${cc_id}/abort", payload: {}, as: CureTechnician, captures: { cc_status: $.data.status } }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: CureTechnician, captures: { wo_status: $.data.status } }
            - { call: "GET /molds/${mold_id}", payload: {}, as: ToolingEngineer, captures: { m_cycles: $.data.cycles_since_maintenance, m_status: $.data.status } }
          assert:
            - "cc_status == ABORTED and wo_status == AWAITING_CURE"
            - "m_cycles == 0 and m_status == ACTIVE (no wear from an aborted run)"

      - name: inspection_on_cured_workorder_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder, entities.Inspection]
        distinguishing_aspect: "An inspection posted while the work order is CURED (not yet demolded) is rejected; only IN_INSPECTION admits inspections."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO fully cured, standing at CURED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-IC1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "OVEN-1", kind: "OVEN", max_parts_per_cycle: 10, turnaround_minutes: 0, max_temperature_c: 200, max_pressure_bar: 0 }, as: ShopManager, captures: { oven_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-IC1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-IC1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 200 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_id}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_id}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc_id: $.data.id } }
            - { call: "POST /cure-cycles/${cc_id}/start", payload: {}, as: CureTechnician }
            - { call: "POST /cure-cycles/${cc_id}/complete", payload: { recorded_min_temp_c: 178, recorded_max_temp_c: 181, recorded_soak_minutes: 120, recorded_ramp_rate_c_per_min: 3.0 }, as: CureTechnician }
          trigger:
            - { call: "POST /inspections", payload: { work_order_id: "${wo_id}", method: "VISUAL", void_content_pct: 1.0, delamination_area_cm2: 0.0 }, as: QualityInspector, as_user_id: "op-qi-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (CURED is not IN_INSPECTION; demold must come first)"

      - name: retired_mold_rejects_transition_phase
        claim_type: terminal_lockdown
        grounds: [state_machines.Mold, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal for both mold dimensions: transition-phase on a retired mold returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An unoccupied mold retired from ACTIVE"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-RT1", maintenance_interval_cycles: 10, prototype_parts_required: 1 }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /molds/${mold_id}/retire", payload: {}, as: ToolingEngineer, captures: { m_status: $.data.status } }
          trigger:
            - { call: "POST /molds/${mold_id}/transition-phase", payload: { target_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { err: $.data.error_id } }
          assert:
            - "m_status == RETIRED"
            - "err == ERR_INVALID_STATE"

      - name: second_repair_beyond_limit_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkOrder.IN_INSPECTION_to_REPAIR, "errors[ERR_REPAIR_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "With max_repair_attempts 1, a second REPAIR_REQUIRED disposition is rejected with ERR_REPAIR_LIMIT_EXCEEDED and the work order stays IN_INSPECTION until scrapped."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100 with max_repair_attempts 1; production mold; WO repaired once and re-inspected at IN_INSPECTION after a successful re-cure"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-RL1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5, max_repair_attempts: 1 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
