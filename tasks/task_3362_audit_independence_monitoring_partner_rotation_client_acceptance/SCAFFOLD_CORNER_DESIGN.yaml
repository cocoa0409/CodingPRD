            - call: "GET /audit/client-acceptances/${acc_dg}"
              payload: {}
              as: ClientAcceptanceCommittee
          assert:
            - "at the first read ClientAcceptance.${acc_dg}.integrity_score == 80 (age 12 months falls in the <= 12 tier, factor 1.0)"
            - "at the second read ClientAcceptance.${acc_dg}.integrity_score == 90 (age 13 months falls in the 12 < age <= 24 tier, factor 0.5)"
            - "the stored risk_score moves by exactly 10 points across the same clock change, because penalty feeds client_risk_score"

      - name: materiality_is_inclusive_and_two_tiered_by_instrument
        claim_type: Constants Applied
        grounds:
          - calculations.financial_interest_materiality
          - entities.IndependenceThreat.fields.is_material
        distinguishing_aspect: "The threshold is inclusive and instrument-sensitive: a DIRECTOR's 200000-cent MUTUAL_FUND holding is material at exactly the doubled threshold while 199999 is not, and a 199999-cent direct EQUITY holding is material at the single threshold."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One non-PIE client with one engagement, and one DIRECTOR professional."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
