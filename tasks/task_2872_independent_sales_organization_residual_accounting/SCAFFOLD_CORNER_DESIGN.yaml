          setup: ["Program P1 with minimum_billing_mode SHORTFALL_BILLED; agent A1 split 0.50; merchants M1 (min 5000, fee 10, 100 txns) and M2 (min 5000, fee 10, 200 txns), both ACTIVE when the 2026-07 batch is posted, after which M2 attrites."]
