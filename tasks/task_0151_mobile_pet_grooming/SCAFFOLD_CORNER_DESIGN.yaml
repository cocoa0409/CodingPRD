              payload: { email: "ce20@x.com", full_name: "CE Twenty", service_zip: "10024" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pets"
              payload: { customer_id: "${cust_id}", breed_id: "${breed_id}", name: "Sal", weight_lbs: 30 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /route-days"
              payload: { van_id: "${van_id}", service_date: "2026-07-11T00:00:00Z", window_start: "2026-07-11T09:00:00Z", window_end: "2026-07-11T17:00:00Z", coverage_zip: "10024" }
