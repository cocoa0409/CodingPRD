              as: MechanicalContractor
              captures: { cu1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 150.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /containment-zones/${zone1_id}/leakage-test"
              payload: { measured_leakage_pct: 5.00, measured_static_pressure_pa: 20.00 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/commission"
              payload: { measured_airflow_cfm: 40000 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/place-in-service"
              payload: {}
              as: MechanicalContractor
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "PATCH /pdus/${pdu_b_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "POST /busways/${bw_a_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /busways/${bw_b_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 75.00, breaker_amps: 400 }
              as: ElectricalContractor
              captures: { feed_a_id: $.data.id }
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_b_id}", feed_side: "B", requested_kw: 75.00, breaker_amps: 400 }
              as: ElectricalContractor
              captures: { feed_b_id: $.data.id }
            - call: "POST /racks/${rack1_id}/install"
              payload: { asset_tag: "AT-0001" }
              as: FacilityPlanner
            - call: "POST /racks/${rack1_id}/power-on"
              payload: {}
              as: ElectricalContractor
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "COMMISSIONING" }
              as: FacilityPlanner
            - call: "GET /halls/${hall_id}"
              payload: {}
              as: CommissioningAgent
              captures: { hall_v1: $.data.version }
            - call: "POST /commissioning-packages"
              payload: { hall_id: "${hall_id}", level: "L1", title: "L1 pre-load documentation", target_load_kw: 10.00, expected_hall_version: "${hall_v1}" }
              as: CommissioningAgent
              captures: { pkg_l1_id: $.data.id }
            - call: "POST /commissioning-packages/${pkg_l1_id}/approve-script"
              payload: { script_revision: 1 }
              as: CommissioningAgent
              as_user_id: "u-ca-1"
            - call: "POST /load-bank-tests"
              payload: { package_id: "${pkg_l1_id}", target_kw: 20.00, window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T04:00:00Z", step_pct_sequence: [25, 50, 75, 100] }
              as: CommissioningAgent
              captures: { lb_a_id: $.data.id }
            - call: "POST /load-bank-tests"
              payload: { package_id: "${pkg_l1_id}", target_kw: 20.00, window_start: "2026-08-10T03:00:00Z", window_end: "2026-08-10T05:00:00Z", step_pct_sequence: [25, 50, 75, 100] }
              as: CommissioningAgent
              captures: { lb_b_id: $.data.id }
          trigger:
            - call: "POST /load-bank-tests"
              payload: { package_id: "${pkg_l1_id}", target_kw: 5.00, window_start: "2026-08-10T04:00:00Z", window_end: "2026-08-10T06:00:00Z", step_pct_sequence: [50, 100] }
              as: CommissioningAgent
            - call: "POST /load-bank-tests"
              payload: { package_id: "${pkg_l1_id}", target_kw: 15.00, window_start: "2026-08-10T04:30:00Z", window_end: "2026-08-10T06:00:00Z", step_pct_sequence: [50, 100] }
              as: CommissioningAgent
              captures: { lb_d_id: $.data.id }
            - call: "POST /load-bank-tests"
              payload: { package_id: "${pkg_l1_id}", target_kw: 36.00, window_start: "2026-08-10T05:30:00Z", window_end: "2026-08-10T07:00:00Z", step_pct_sequence: [50, 100] }
              as: CommissioningAgent
            - call: "POST /load-bank-tests"
              payload: { package_id: "${pkg_l1_id}", target_kw: 35.00, window_start: "2026-08-10T05:30:00Z", window_end: "2026-08-10T07:00:00Z", step_pct_sequence: [50, 100] }
              as: CommissioningAgent
              captures: { lb_f_id: $.data.id }
          assert:
            - "trigger call 1 returns 409 with error.code == ERR_LOADBANK_CONCURRENCY_EXCEEDED — its window touches run A at exactly 04:00 and overlaps run B, so concurrent_count would be 3 > 2 (closed intervals collide at their endpoints)"
            - "trigger call 1 is refused on the count ceiling, not on the reserve: 20.00 + 20.00 + 5.00 == 45.00 would have fitted inside the 50.00 kW reserve"
            - "trigger call 2 returns 201 — run D at 04:30 misses run A entirely (04:00 < 04:30), overlaps only run B, so concurrent_count == 2 and reserve_demand_kw == 35.00"
            - "trigger call 3 returns 422 with error.code == ERR_COMMISSIONING_RESERVE_EXCEEDED — run D 15.00 + 36.00 == 51.00 > 50.00, while concurrent_count == 2 is legal"
            - "trigger call 4 returns 201 — 15.00 + 35.00 == 50.00 exactly, and the reserve gate is inclusive"
            - "LoadBankTest.${lb_a_id}.status == SCHEDULED, LoadBankTest.${lb_b_id}.status == SCHEDULED, LoadBankTest.${lb_d_id}.status == SCHEDULED and LoadBankTest.${lb_f_id}.status == SCHEDULED"
            - "GET /load-bank-tests?package_id=${pkg_l1_id} returns total_count == 4 (the two rejected runs left no rows)"
            - "Hall.${hall_id}.commissioning_reserve_kw == 50.00 and Hall.${hall_id}.committed_kw == 150.00 — load bank scheduling never writes the power ledger"

  - rule_id: compensating_invariant
    instances:

      - name: feed_reserve_then_delete_conserves_hall_power_ledger
        grounds:
          - state_machines.RackFeed.RESERVED_to_RELEASED
          - calculations.hall_power_ledger
          - entities.RackFeed.fields.released_at
          - entities.Busway.fields.committed_kw
        distinguishing_aspect: |
          Releasing the 5.00 kW feed must undo every consequence of reserving it, including the tier jump
          it caused: committed_kw returns from 105.00 to 100.00, commissioning_reserve_kw from 50.00 back
          to 25.00 and spare_kw from 245.00 back to 275.00, so the invariant
          committed + reserve + spare == design_kw_capacity holds before and after with no drift. The
          released row survives as an auditable RELEASED RackFeed that is excluded from the ledger's input
          set and from the default list, which is what distinguishes compensation from deletion.
        test_recipe:
          setup:
            - "Hall HS1 (design_kw_capacity 400.00) is in FIT_OUT with PDU-A1 -> BW-A1 and PDU-B1 -> BW-B1 (both usable_kw 196.66) and containment zone CA-1."
            - "Rack R-1-1 (design_kw 100.00, required_feed_count 2) holds a 50.00 kW RESERVED feed on each busway."
            - "Rack R-1-2 (design_kw 5.00, required_feed_count 1) holds a 5.00 kW RESERVED feed on BW-A1."
            - "Hall.committed_kw == 105.00, Hall.commissioning_reserve_kw == 50.00, Hall.spare_kw == 245.00; Busway BW-A1 committed_kw == 55.000 with feed_count 2."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall S", code: "HS1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 12 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
