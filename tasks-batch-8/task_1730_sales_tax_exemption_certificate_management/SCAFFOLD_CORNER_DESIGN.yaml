              captures: { cid: $.data.id }
            - call: "POST /tenants/${tid}/customers/${cid}/complete_onboarding"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /tenants/${tid}/customers/${cid}/orders"
              payload: { order_ref: "O1", ship_to_state: "CA", exemption_reason_code: "RES" }
              as: OrderClerk
              captures: { oid: $.data.id }
            - call: "POST /tenants/${tid}/orders/${oid}/lines"
              payload: { sku: "ABC", quantity: 1, unit_price_cents: 100, is_exempt_claimed: true }
              as: OrderClerk
            - call: "POST /tenants/${tid}/orders/${oid}/submit"
              payload: {}
              as: OrderClerk
          trigger:
            - call: "POST /tenants/${tid}/orders/${oid}/ship"
              payload: {}
              as: FulfillmentClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: drop_ship_verify_with_unapproved_cert
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESALE_CERT_NOT_APPROVED]"]
        distinguishing_aspect: "DropShipLink verify against a DRAFT cert -> ERR_RESALE_CERT_NOT_APPROVED"
        test_recipe:
          setup: ["tenant with CA + TX rules, customer with DRAFT cert"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
