          assert:
            - "${open0} == 0 and ${units0} == 40 before the order; ${pub_ver} == 1 (the bundle_version stamped at PUBLISH) and ${cached_ver} == 1"
            - "the creation response is complete on its own: ${num} == S001-0001, ${sub} == 1118 (2 x 559), ${disc} == 0, ${tax} == 98 (1118 x 875 / 10000 = 97.825 rounded half up), ${tot} == 1216, ${pay} == AUTHORIZED, ${hand} == QUEUED_TO_KITCHEN, ${dp} == LUNCH, ${pinned} == 1 and ${receipt} is non-null"
            - "priced_lines in that same body holds one entry with unit_price_cents 559 and line_total_cents 1118 — the board price is resolved inside the request, not backfilled"
            - "${reserved_after} == 2, ${units_after} == 38 and ${state_after} == AVAILABLE on the next call — 38 is above the low-stock threshold 4, so no supply banding changed"
            - "${open_after} == 1 and ${seq_after} == 1 immediately, with no intervening write to Store"
            - "the re-read is identical, not merely eventually consistent: ${reread_tot} == 1216, ${reread_num} == S001-0001 and ${reread_hand} == QUEUED_TO_KITCHEN"
            - "${ack_hand} == ACCEPTED and ${ack_pay} == CAPTURED in the KITCHEN_ACK response itself — both parallel dimensions move within the one request"
