              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m6@x.com", full_name: "M Six", plan_tier: "PLUS", home_state_code: "CA" }
              as: Anonymous
              captures: { m6: $.data.id }
            - call: "POST /api/members/${m6}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m6}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "CA" }
              as: Member
