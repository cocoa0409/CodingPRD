        distinguishing_aspect: "VERIFY must freeze both variants side by side and leave qualifies driven by the banded authoritative score only: APY 1450000000 with snap 0.72 (band 1.00) plus 20 honors gives claim_score 1470.00 while the raw-snap advisory is 1064.00, and it is 1470.00 that sets qualifies true."
        test_recipe:
          setup:
            - "DraftCycle 2027 in COMBINE_WEEK with clubs ELM and HAR; prospect Avery Lane is DECLARED and ELIGIBLE"
            - "ELM has submitted a DEPARTURE claim for Dane Whitlock (APY 1450000000, snap 0.72, ALL_CONFERENCE) while the cycle is in COMBINE_WEEK"
