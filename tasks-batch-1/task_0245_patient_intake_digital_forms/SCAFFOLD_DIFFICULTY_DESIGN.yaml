  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_halfopen_buffer_overlap
        grounds:
          - calculations.provider_busy_interval
          - validations[priority=9]
          - entities.Provider.fields.cleanup_buffer_minutes
        distinguishing_aspect: |
          Provider resource, HALF-OPEN intervals with a 10-min buffer: existing appt 10:00-10:30
          occupies [10:00,10:40); a new 10:35-11:05 appointment strictly overlaps and is rejected
          with ERR_PROVIDER_DOUBLE_BOOKED (buffer-extended half-open semantics).
        test_recipe:
          setup:
            - "Clinic; provider cleanup_buffer_minutes 10; patient; one existing appointment 10:00-10:30."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C15" }
              as: ClinicAdmin
              captures: { c15: $.data.id }
            - call: "POST /providers"
              payload: { clinic_id: "${c15}", full_name: "Dr O", cleanup_buffer_minutes: 10, required_consent_codes: [], questionnaire_required_sections: [] }
              as: ClinicAdmin
              captures: { provO: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${c15}", legal_name: "Pat O", date_of_birth: "1952-03-15", phone: "555-1500" }
              as: FrontDeskStaff
              captures: { patO: $.data.id }
            - call: "POST /appointments"
              payload: { clinic_id: "${c15}", provider_id: "${provO}", patient_id: "${patO}", start_utc: "2026-06-24T10:00:00.000Z", end_utc: "2026-06-24T10:30:00.000Z" }
              as: FrontDeskStaff
              captures: { apptO1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { clinic_id: "${c15}", provider_id: "${provO}", patient_id: "${patO}", start_utc: "2026-06-24T10:35:00.000Z", end_utc: "2026-06-24T11:05:00.000Z" }
              as: FrontDeskStaff
              captures: { errp: $.data.error_id }
          assert:
            - "response error_id == ERR_PROVIDER_DOUBLE_BOOKED"
            - "A new appointment starting at 10:40 (exactly buffer end) would instead SUCCEED (half-open adjacency)"

