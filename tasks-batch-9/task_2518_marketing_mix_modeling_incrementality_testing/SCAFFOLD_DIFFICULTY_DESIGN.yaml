  - rule_id: priority_pair_validation_conflict
    note: >-
      Two dual-failure conflicts across DIFFERENT error-category pairs: state (45) versus
      business_fiscal (72) on budget-scenario create, and business_safety (52) versus
      business_constraint (60) on experiment lock-design. Each instance also proves the
      LOSING rule is independently reachable, so the ordering claim is falsifiable rather
      than vacuous.
    instances:
      - name: state_beats_fiscal_on_budget_scenario_create
        grounds:
          - "validations[priority=45]"
          - "validations[priority=72]"
          - "errors.ERR_MODEL_RUN_NOT_PUBLISHED"
          - "errors.ERR_BUDGET_CEILING_EXCEEDED"
          - "entities.Market.fields.annual_budget_ceiling_cents"
        distinguishing_aspect: |
          A single POST /mmm/budget-scenarios violates BOTH the state rule at priority 45 (the
          referenced run is UNPUBLISHED) AND the business_fiscal rule at priority 72
          (total_budget_cents 6000000000 exceeds annual_budget_ceiling_cents 5000000000), and the
          response is 409 ERR_MODEL_RUN_NOT_PUBLISHED - the state category wins - while the very
          same over-ceiling payload returns 422 ERR_BUDGET_CEILING_EXCEEDED once the run is
          published, proving priority 72 was reachable all along.
        test_recipe:
          setup:
            - "Fixture F1 fitted in EFFECT_PERIOD mode but NOT validated and NOT published: run1 is (FITTED, UNVALIDATED, NOT_REQUIRED, UNPUBLISHED)."
            - "Market US_CORE has annual_budget_ceiling_cents 5000000000."
            - "No BudgetScenario exists yet."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
