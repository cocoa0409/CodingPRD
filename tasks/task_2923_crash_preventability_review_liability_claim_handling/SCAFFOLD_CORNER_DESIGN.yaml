      - name: complete_retraining_is_allowed_only_after_the_window_elapses
        claim_type: conditional_action
        grounds:
          - endpoints[POST /disciplinary-actions/{id}/complete-retraining]
          - validations[priority=40]
        distinguishing_aspect: "The same completion call is refused while a SUSPENSION window is still running and accepted once it has elapsed, which is the only condition separating the two outcomes."
        excluded_because:
          difficulty_instance: employment_continue_blocked_by_incomplete_retraining
          rationale: "That §1.8 instance calls complete-retraining before suspension_end_at for ERR_SUSPENSION_NOT_ELAPSED, then again after the clock passes it for the success, and threads the CONTINUE decision through both, which is the whole conditional-action claim for this endpoint."

