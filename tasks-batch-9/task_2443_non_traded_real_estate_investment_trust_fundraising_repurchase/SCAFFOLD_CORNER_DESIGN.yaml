              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Jo Petrosyan", email: "jo.petrosyan@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-JO-2026-08" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /share-classes/${sc_i_id}/status"
              payload: { to_status: "CLOSED_TO_NEW" }
              as: SponsorOperator
              captures: { class_i_status: $.data.status }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_i_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 300000 }
              as: SponsorOperator
              captures: { closed_class_error: $.error.error_id }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_t_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 300000 }
              as: SponsorOperator
              captures: { sub_t_id: $.data.id, sub_t_shares: $.data.shares_issued_e4 }
          assert:
            - "class_i_status == \"CLOSED_TO_NEW\""
            - "closed_class_error == \"ERR_SHARE_CLASS_CLOSED\" with response http status == 409"
            - "ShareClass.${sc_t_id}.status == \"ACTIVE\" (the sibling class was untouched)"
            - "Subscription.${sub_t_id}.status == \"PENDING\" and sub_t_shares == 3000000"
            - "Offering.${off_id}.registration_status == \"EFFECTIVE\""
            - "GET /subscriptions returns total_count == 1"

      - name: tendered_shares_net_against_other_queued_requests_of_the_period
        claim_type: aggregate_validation
        grounds:
          - validations[priority=11].error_id
          - errors[ERR_INSUFFICIENT_SHARES]
          - entities.RepurchaseRequest.fields.shares_requested_e4
          - endpoints[POST /repurchase-requests]
        distinguishing_aspect: |
          Each individual tender is smaller than the investor's 300000000 e4
          position, but the sufficiency test must run against the position net of
          shares already tendered in other QUEUED requests of the same period, so
          the second 150000000 e4 request fails while a 100000000 e4 request then
          succeeds and one further e4 unit fails.
        test_recipe:
          setup:
            - "Offering 'Ambleside Core REIT' at 1000 cents per share, zero-load class I, minimum offering 30000000 cents."
            - "One documented investor subscribes 30000000 cents; breaking escrow mints a single 300000000 e4 OPEN lot."
            - "An August period is open from 2026-08-01T00:00:00Z with cutoff 2026-08-26T00:00:00Z and settlement 2026-08-30; the clock stays at 2026-08-01T00:00:00Z so every tender is inside the window."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Ambleside Core REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Ambleside Placement", crd_number: "CRD-320003" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Kai Broadbent", email: "kai.broadbent@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-KAI-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 30000000 }
              as: SponsorOperator
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_id}", period_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", request_cutoff_at: "2026-08-26T00:00:00Z", settlement_date: "2026-08-30" }
              as: TransferAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${rp_id}", share_class_id: "${sc_id}", shares_requested_e4: 200000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { req_a_id: $.data.id, req_a_status: $.data.status }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${rp_id}", share_class_id: "${sc_id}", shares_requested_e4: 150000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { over_error: $.error.error_id }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${rp_id}", share_class_id: "${sc_id}", shares_requested_e4: 100000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { req_b_id: $.data.id, req_b_status: $.data.status }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${rp_id}", share_class_id: "${sc_id}", shares_requested_e4: 1 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { exhausted_error: $.error.error_id }
          assert:
            - "Investor.${inv_id}.total_shares_e4 == 300000000"
            - "req_a_status == \"QUEUED\""
            - "over_error == \"ERR_INSUFFICIENT_SHARES\" with response http status == 422 (200000000 + 150000000 > 300000000)"
            - "req_b_status == \"QUEUED\" (200000000 + 100000000 == 300000000 exactly)"
            - "exhausted_error == \"ERR_INSUFFICIENT_SHARES\" with response http status == 422"
            - "GET /repurchase-requests?repurchase_period_id=${rp_id} returns total_count == 2"
            - "RepurchasePeriod.${rp_id}.status == \"OPEN\" and settled_amount_cents == 0"

      - name: suitability_gate_fires_only_under_agreements_that_require_documentation
        claim_type: conditional_validation
        grounds:
          - validations[priority=10].error_id
          - errors[ERR_SUITABILITY_NOT_DOCUMENTED]
          - entities.SellingAgreement.fields.suitability_documentation_required
          - entities.Investor.fields.suitability_status
        distinguishing_aspect: |
          The identical INCOMPLETE investor must be rejected under an agreement
          whose suitability_documentation_required is true and accepted under a
          sibling agreement where the flag is false, proving the gate is
          agreement-configuration driven rather than unconditional.
        test_recipe:
          setup:
            - "Offering 'Thornbury Income REIT' at 1000 cents per share, EFFECTIVE, zero-load class I."
            - "One broker-dealer holds two ACTIVE agreements on the offering: SA-strict with suitability_documentation_required true and SA-open with the flag false."
            - "One investor is left at the declared INCOMPLETE default with no documentation reference."
            - "The clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Thornbury Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Thornbury Placement", crd_number: "CRD-320004" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100, suitability_documentation_required: true }
              as: ComplianceOfficer
              captures: { sa_strict_id: $.data.id, sa_strict_flag: $.data.suitability_documentation_required }
            - call: "POST /selling-agreements/${sa_strict_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100, suitability_documentation_required: false }
              as: ComplianceOfficer
              captures: { sa_open_id: $.data.id, sa_open_flag: $.data.suitability_documentation_required }
            - call: "POST /selling-agreements/${sa_open_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Lio Nakamura", email: "lio.nakamura@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id, inv_suitability: $.data.suitability_status }
          trigger:
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_strict_id}", gross_investment_cents: 250000 }
              as: SponsorOperator
              captures: { strict_error: $.error.error_id }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_open_id}", gross_investment_cents: 250000 }
              as: SponsorOperator
              captures: { sub_open_id: $.data.id, sub_open_status: $.data.status }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-LIO-2026-08" }
              as: ComplianceOfficer
              captures: { inv_documented: $.data.suitability_status }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_strict_id}", gross_investment_cents: 250000 }
              as: SponsorOperator
              captures: { sub_strict_id: $.data.id, sub_strict_status: $.data.status }
          assert:
            - "sa_strict_flag == true and sa_open_flag == false"
            - "inv_suitability == \"INCOMPLETE\""
            - "strict_error == \"ERR_SUITABILITY_NOT_DOCUMENTED\" with response http status == 422"
            - "sub_open_status == \"PENDING\" (the same INCOMPLETE investor passes under the permissive agreement)"
            - "inv_documented == \"DOCUMENTED\""
            - "sub_strict_status == \"PENDING\""
            - "GET /subscriptions returns total_count == 2"
            - "Subscription.${sub_open_id}.selling_agreement_id == \"${sa_open_id}\" and Subscription.${sub_strict_id}.selling_agreement_id == \"${sa_strict_id}\""

      - name: nav_review_blocked_until_the_valuation_period_has_elapsed
        claim_type: temporal_validation
        grounds:
          - validations[priority=9].error_id
          - errors[ERR_NAV_PERIOD_NOT_ELAPSED]
          - state_machines.NavRecord.DRAFT_to_ADVISOR_REVIEW
          - calculations.nav_per_share
        distinguishing_aspect: |
          A record for an unfinished August period may be created but not
          submitted for advisor review; the same submission must succeed once the
          clock passes period_end_date, so the temporal gate lives on the
          transition rather than on creation.
        test_recipe:
          setup:
            - "Offering 'Quarrybrook REIT' at 1000 cents per share with one class I and no subscriptions, so shares_outstanding_e4 is 0."
            - "The clock sits at its declared 2026-08-01T00:00:00Z default when the August record is cut."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Quarrybrook REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id, sc_v: $.data.version }
          trigger:
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gross_asset_value_cents: 5000000, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id, nav_status: $.data.status, nav_price: $.data.nav_per_share_cents, nav_snapshot: $.data.shares_outstanding_e4_snapshot, nav_var: $.data.variance_bps }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
              captures: { early_error: $.error.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SponsorOperator
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
              captures: { late_status: $.data.status, late_version: $.data.version }
          assert:
            - "nav_status == \"DRAFT\" and nav_snapshot == 0"
            - "nav_price == 1000 (zero shares outstanding falls back to initial_offering_price_cents)"
            - "nav_var == 0"
            - "early_error == \"ERR_NAV_PERIOD_NOT_ELAPSED\" with response http status == 409"
            - "NavRecord.${nav_id}.status == \"DRAFT\" and NavRecord.${nav_id}.version == 1 immediately after the rejected submission"
            - "late_status == \"ADVISOR_REVIEW\" and late_version == 2"

