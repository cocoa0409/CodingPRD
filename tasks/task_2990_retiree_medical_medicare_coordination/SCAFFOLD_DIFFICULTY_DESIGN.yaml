              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Priya Raghunathan", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 143 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r3_id: $.data.id, r3_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r3_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r3_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det3_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det3_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "POST /retiree-benefits/eligibility-determinations/${det3_id}/appeal"
              payload: { appeal_reason: "Two additional years of leased-employee service were omitted from the credited service record." }
              as: Retiree
              as_user_id: "${r3_id}"
            - call: "POST /retiree-benefits/eligibility-determinations/${det3_id}/appeal-decision"
              payload: { decision: "REVERSE" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /retiree-benefits/eligibility-determinations/${det3_id}/appeal"
              payload: { appeal_reason: "Plan sponsor requests a second-level review of the reversal." }
              as: EnrollmentCounselor
              as_user_id: "counselor-01"
            - call: "POST /retiree-benefits/eligibility-determinations/${det3_id}/appeal-decision"
              payload: { decision: "UPHOLD" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
          assert:
            - "After setup EligibilityDetermination.${det3_id}.points == 74 and outcome == INELIGIBLE and status == CERTIFIED"
            - "After the first appeal EligibilityDetermination.${det3_id}.status == UNDER_APPEAL"
            - "After the first appeal Retiree.${r3_id}.eligibility_status == UNDETERMINED"
            - "After the REVERSE decision EligibilityDetermination.${det3_id}.status == CERTIFIED"
            - "After the REVERSE decision EligibilityDetermination.${det3_id}.outcome == ELIGIBLE"
            - "After the REVERSE decision EligibilityDetermination.${det3_id}.appeal_decision == REVERSE"
            - "After the REVERSE decision Retiree.${r3_id}.eligibility_status == ELIGIBLE"
            - "After the second appeal EligibilityDetermination.${det3_id}.status == UNDER_APPEAL again, proving the cycle is repeatable"
            - "After the UPHOLD decision EligibilityDetermination.${det3_id}.status == CERTIFIED"
            - "After the UPHOLD decision EligibilityDetermination.${det3_id}.outcome is still ELIGIBLE"
            - "After the UPHOLD decision EligibilityDetermination.${det3_id}.appeal_decision == UPHOLD"
            - "EligibilityDetermination.${det3_id}.points is still 74 after both cycles, because an appeal decision never re-runs eligibility_rule_evaluation"

