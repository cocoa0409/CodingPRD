  # ===========================================================================
  # Section 3 — Calculations (Table 3 claims)
  # ===========================================================================
  - section: calculations
    instances:
      - name: seat_price_load_tiers_applied
        claim_type: correct_result
        grounds:
          - calculations.seat_price_quote
          - entities.Flight.fields.seats_booked
        distinguishing_aspect: |
          The load tier is computed from seats_booked BEFORE the new booking:
          on a 5-seat aircraft the four bookings see load_pct 0, 20, 60, 80 and
          quote 20000, 20000, 22000, 25000 respectively — the 80% crossing flips
          the 12500 bps tier on exactly at floor(4*100/5) == 80.
        test_recipe:
          setup: ["Route RX base 20000 (no season); 5-seat aircraft; flight dep Monday 2026-08-03T14:00:00Z; declared weights 100 keep the estimate gate green"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RX", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 20000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 5, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { q1: $.data.quoted_per_seat_cents }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "B", contact_email: "b@x.com", passengers: [ { full_name: "P1", declared_weight_lb: 100 }, { full_name: "P2", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { q2: $.data.quoted_per_seat_cents }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "C", contact_email: "c@x.com", passengers: [ { full_name: "P3", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { q3: $.data.quoted_per_seat_cents }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "D", contact_email: "d@x.com", passengers: [ { full_name: "P4", declared_weight_lb: 100 } ] }
              as: BookingAgent
              captures: { q4: $.data.quoted_per_seat_cents }
          assert:
            - "trigger capture q1 == 20000 (load 0% -> 10000 bps)"
            - "trigger capture q2 == 20000 (load floor(1*100/5) == 20% -> still base tier)"
            - "trigger capture q3 == 22000 (load floor(3*100/5) == 60% -> 11000 bps)"
            - "trigger capture q4 == 25000 (load floor(4*100/5) == 80% -> 12500 bps; tier flips exactly at the 80 boundary)"

      - name: cg_inclusive_envelope_boundary
        claim_type: precision
        grounds:
          - calculations.manifest_final_wb
          - validations[priority=16]
          - errors[ERR_CG_OUT_OF_ENVELOPE]
          - entities.Flight.fields.actual_cg_in
        distinguishing_aspect: |
          The CG envelope compare is inclusive on a value rounded to 0.01 first:
          an aircraft whose aft limit equals the computed 54.25 accepts the
          manifest, while an identical aircraft limited at 54.24 rejects the
          identical load with ERR_CG_OUT_OF_ENVELOPE.
        test_recipe:
          setup:
            - "A1 limits [52, 54.25]; A2 limits [52, 54.24]; both 4 seats arms [40,40,80,80], empty 1500/moment 82500, MTOW 2600, fuel arm 60, QUIET"
            - "F1 (A1) dep 2026-08-03T14:00, F2 (A2) dep 2026-08-04T14:00; each has 1 passenger checked in at actual 200 lb seat 0 (moment 108500, gross 2000, CG exactly 54.25)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
