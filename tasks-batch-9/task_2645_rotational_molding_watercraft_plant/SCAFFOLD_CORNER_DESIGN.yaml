      - name: ep_product_model_list_pagination_defaults_and_offset_window
        claim_type: Standard CRUD
        grounds:
          - "endpoints.GET_/product-models"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - "validations[priority=22]"
        distinguishing_aspect: |
          With exactly three rows the offset window is observable end to end:
          limit=2&offset=0 yields 2 rows with has_more true, offset=2 yields the
          last row with has_more false, an omitted limit falls back to 10 (not
          to "all"), and limit outside the declared 1..100 band is refused with
          ERR_INVALID_QUANTITY rather than being silently clamped.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z."
            - "Exactly three ProductModel rows: PM-CD-KM (KAYAK/MID/PADDLE), PM-CD-K2 (KAYAK/COMPACT/PADDLE) and PM-CD-T3 (PONTOON/TANDEM/DECK)."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - &cd2_pm2
              call: "POST /product-models"
              payload: { model_code: "PM-CD-K2", hull_type: "KAYAK", size_class: "COMPACT", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 9.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 25, target_wall_thickness_mm: 5.00, wall_thickness_min_mm: 4.00, wall_cv_max_pct: 12.00, impact_test_min_joules: 80.00, gross_cube_m3: 1.5000, nest_factor: 0.5000, unit_weight_kg: 18.000, msrp_cents: 120000, warranty_basis: "FLAT_SCHEDULE", initial_warranty_reserve_cents: 300000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm2: $.data.id }
            - &cd2_pm3
              call: "POST /product-models"
              payload: { model_code: "PM-CD-T3", hull_type: "PONTOON", size_class: "TANDEM", resin_grade: "HDPE_CROSSLINK", master_color_code: "GRAPHITE", max_color_delta_e: 2.00, required_additive_package_code: "UV20", max_regrind_pct: 20.00, min_melt_index_g10min: 3.00, max_melt_index_g10min: 7.00, nominal_charge_kg: 30.000, charge_tolerance_pct: 4.00, min_cooling_minutes: 45, target_wall_thickness_mm: 8.00, wall_thickness_min_mm: 6.50, wall_cv_max_pct: 10.00, impact_test_min_joules: 140.00, gross_cube_m3: 6.0000, nest_factor: 0.7000, unit_weight_kg: 90.000, msrp_cents: 640000, warranty_basis: "FLAT_SCHEDULE", initial_warranty_reserve_cents: 900000, seasonal_family: "DECK" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm3: $.data.id }
          trigger:
            - call: "GET /product-models?limit=2&offset=0"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=2&offset=2"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=101"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models?limit=0"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "GET /product-models?limit=2&offset=0 returns status 200, response_type array, exactly 2 rows, limit 2, offset 0, total_count 3 and has_more true"
            - "GET /product-models?limit=2&offset=2 returns exactly 1 row, limit 2, offset 2, total_count 3 and has_more false"
            - "GET /product-models with no query parameters returns limit 10, offset 0, exactly 3 rows, total_count 3 and has_more false"
            - "GET /product-models?limit=101 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY'"
            - "GET /product-models?limit=0 returns status 422 with data.error_id 'ERR_INVALID_QUANTITY'"

      - name: ep_product_model_list_filters_compose_and_can_narrow_to_zero_rows
        claim_type: Standard CRUD
        grounds:
          - "endpoints.GET_/product-models"
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Two declared filters supplied together are ANDed, not ORed:
          hull_type=KAYAK alone matches two rows, size_class=COMPACT alone
          matches one, the pair matches exactly one, and a pair that is
          individually satisfiable but jointly empty (KAYAK + TANDEM) returns an
          empty array with total_count 0 and has_more false rather than a 404.
        test_recipe:
          setup:
            - "The same three ProductModel rows as the pagination instance: PM-CD-KM (KAYAK/MID/PADDLE/PRO_RATA_AGE), PM-CD-K2 (KAYAK/COMPACT/PADDLE/FLAT_SCHEDULE), PM-CD-T3 (PONTOON/TANDEM/DECK/FLAT_SCHEDULE)."
