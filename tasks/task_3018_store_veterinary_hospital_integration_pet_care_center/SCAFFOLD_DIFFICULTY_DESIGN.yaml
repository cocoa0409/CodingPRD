              payload: { member_id: "${member_i_id}", name: "Nala", species: "CANINE", breed: "Beagle", weight_kg: 10.0 }
              as: GroomingStaff
              captures: { pet_i1_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/pets"
              payload: { member_id: "${member_i_id}", name: "Bruno", species: "CANINE", breed: "Dogo Argentino", weight_kg: 42.0 }
              as: GroomingStaff
              captures: { pet_i2_id: $.data.id , pet_v: $.data.version }
            - call: "POST /stores/${store_i_id}/service-bays"
