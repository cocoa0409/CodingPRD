            - call: "POST /competitive-exceptions"
              payload: { quote_id: "${q_id}", competitor_name: "Helios Cloud", competitor_quoted_total_cents: 290000, evidence_reference: "EV-2026-0801-D", justification: "Filed defensively with no margin pressure" }
              as: SalesRep
