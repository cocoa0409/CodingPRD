  - section: calculations
    instances:
      - name: capacity_rating_multipliers_and_band_boundaries
        claim_type: correct_result
        grounds: [calculations.capacity_affinity_rating]
        distinguishing_aspect: "Evidence multiplier and band boundaries verified with literals: PUBLIC_RECORD 30000000 -> adjusted 24000000 band D; VERIFIED 100000000 -> band B (inclusive boundary); VERIFIED 99999999 -> band C; affinity 80/70/60 -> 73."
        test_recipe:
          setup: ["three prospects each with one approved assessment"]
          setup_api_calls:
            - call: "POST /advancement/prospects"
              payload: { full_name: "P1", prospect_type: "INDIVIDUAL", contact_email: "p1@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p1_id: $.data.id }
