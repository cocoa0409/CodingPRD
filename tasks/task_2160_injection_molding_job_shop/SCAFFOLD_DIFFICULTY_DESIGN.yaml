      - name: ppap_customer_approval_gated_on_mold_status
        grounds:
          - state_machines.PPAPSubmission.UNDER_REVIEW_to_APPROVED
          - state_machines.Mold.SAMPLING_to_QUARANTINED
          - state_machines.Mold.QUARANTINED_to_SAMPLING
          - errors[ERR_MOLD_QUARANTINED]
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair two, different from the first: PPAPSubmission -> Mold. An UNDER_REVIEW
          package cannot be approved while its Mold is QUARANTINED (ERR_MOLD_QUARANTINED), and
          the identical approval succeeds once the tool is released back to SAMPLING.
        test_recipe:
          setup:
            - "Quote ACCEPTED so mold M-1 is SAMPLING; PPAP package filed by qe-alice and endorsed by qe-bob, so it is UNDER_REVIEW."
            - "M-1 has then been quarantined from SAMPLING, so approved_max_regrind_bp is still null."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
