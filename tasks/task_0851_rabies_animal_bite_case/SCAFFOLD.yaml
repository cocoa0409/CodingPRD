scenario: "851. Rabies & Animal-Bite Case Management (health dept): bite report intake & animal identification, victim risk & PEP recommendation, animal quarantine (10-day) & confinement order, specimen submission & lab result, owner compliance & citation, animal-control linkage, wildlife-exposure surveillance, reporting"
domain_name: "rabies-animal-bite-case"
api_prefix: "/api/v1"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by explicit foreign keys (owner_id, animal_id, case_id,
  # facility_id, specimen_id, region_id). No deep URL nesting except thin
  # sub-resource creation/reverse-reachability GETs; every child carries its
  # parent ids in the body.
  state_machine_shape: branching
  # BiteCase forks OPEN -> {OBSERVATION_PENDING, LAB_PENDING} with divergent
  # side-effect sets; QuarantineOrder, PEPRecommendation and Citation each fork
  # with divergent terminal outcomes.
  relationship_patterns:
    - one_to_many          # Owner->Animal, BiteCase->QuarantineOrder/Specimen/PEPRecommendation, SurveillanceRegion->WildlifeExposureReport
    - cross_aggregate      # QuarantineOrder references BiteCase + Animal + QuarantineFacility across aggregates
  role_model: peer_roles
  # IntakeOfficer / Epidemiologist / Veterinarian / AnimalControlOfficer own
  # distinct resource types; Owner (entity_backed) acts only on its own
  # citations; HealthDeptAdmin is an operational superset. A segregation note
  # keeps citation issuance (AnimalControlOfficer) and hearing resolution
  # (Epidemiologist) in different hands.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the animal owner / responsible party."
      - name: phone
        type: string
        source: input
        description: "Contact phone number."
      - name: address
        type: string
        source: input
        description: "Mailing address for confinement orders and citations."
        default: null
      - name: license_number
        type: string
        source: input
        description: "Animal-license number; null when unlicensed."
        default: null
      - name: outstanding_fines_cents
        type: integer
        source: computed
        description: "Sum of total_fine_cents over this owner's Citations whose status IN {ISSUED, CONTESTED, UPHELD}. Recomputed on every citation issuance, dismissal, and payment. Starts at 0."
        default: 0
      - name: compliance_status
        type: enum
        source: computed
        description: "DELINQUENT when outstanding_fines_cents > 0 OR any owned Citation.status IN {ISSUED, CONTESTED, UPHELD}; otherwise COMPLIANT."
        constraints: "one of COMPLIANT, DELINQUENT"
        default: COMPLIANT

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; null for stray / unidentified animals."
        default: null
      - name: species
        type: enum
        source: input
        description: "Animal species."
        constraints: "one of DOG, CAT, FERRET, BAT, RACCOON, SKUNK, FOX, COYOTE, LIVESTOCK, OTHER"
      - name: animal_class
        type: enum
        source: input
        description: "Reservoir class used in risk scoring."
        constraints: "one of DOMESTIC, WILD, STRAY"
      - name: identified
        type: boolean
        source: input
        description: "True when the specific biting animal is positively identified and available; false for at-large/unknown animals."
        default: true
      - name: vaccination_status
        type: enum
        source: input
        description: "Rabies vaccination status at time of intake."
        constraints: "one of CURRENT, EXPIRED, UNKNOWN, NONE"
        default: UNKNOWN
      - name: rabies_vaccine_expiry
        type: datetime
        source: input
        description: "Expiry date of the current rabies vaccination; null when unknown/none."
        default: null
      - name: status
        type: enum
        source: system
        description: "State-machine status (see §1.2)."
        constraints: "one of REPORTED, AT_LARGE, CAPTURED, UNDER_OBSERVATION, RELEASED, DECEASED, EUTHANIZED"
        default: REPORTED
      - name: disposition
        type: enum
        source: system
        description: "Final disposition recorded via POST /animals/{id}/disposition or observation outcome; NONE until decided."
        constraints: "one of NONE, RELEASED, DECEASED, EUTHANIZED"
        default: NONE
      - name: control_status
        type: enum
        source: system
        description: "Animal-control linkage flag. Set to DISPATCH_REQUESTED by the quarantine-breach cascade; CAPTURED after POST /animals/{id}/capture."
        constraints: "one of NONE, DISPATCH_REQUESTED, CAPTURED"
        default: NONE

  - name: BiteCase
    parent: null
    common_fields: true
    fields:
      - name: case_number
        type: string
        source: system
        description: "Human-readable case number minted at intake (e.g. RB-000001)."
      - name: region_code
        type: string
        source: input
        description: "Surveillance region code of the incident; matched by natural key to SurveillanceRegion.region_code for positive-case counting."
      - name: incident_datetime
        type: datetime
        source: input
        description: "When the exposure occurred (ISO 8601 UTC)."
      - name: exposure_type
        type: enum
        source: input
        description: "Kind of exposure."
        constraints: "one of BITE, SCRATCH, SALIVA_MUCOSAL"
      - name: body_site
        type: enum
        source: input
        description: "Anatomical site of the exposure."
        constraints: "one of HEAD_NECK, HAND, ARM, TORSO, LEG, FOOT"
      - name: wound_category
        type: enum
        source: input
        description: "WHO exposure category (I: touching/feeding intact skin; II: minor scratches/abrasions no bleeding; III: transdermal bite/scratch or mucosal contact)."
        constraints: "one of CATEGORY_I, CATEGORY_II, CATEGORY_III"
      - name: victim_name
        type: string
        source: input
        description: "Name of the bitten person."
      - name: victim_age
        type: integer
        source: input
        description: "Age in years of the victim."
        constraints: "integer >= 0"
      - name: victim_prior_vaccinated
        type: boolean
        source: input
        description: "True if the victim previously completed pre-exposure rabies vaccination."
        default: false
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; null when the biting animal is unidentified / not yet captured."
        default: null
      - name: status
        type: enum
        source: system
        description: "State-machine status (see §1.2)."
        constraints: "one of OPEN, OBSERVATION_PENDING, LAB_PENDING, CONFIRMED_RABID, CLEARED, CLOSED"
        default: OPEN
      - name: risk_level
        type: enum
        source: computed
        description: "Rabies-exposure risk computed at intake by the risk_level calculation (§1.3)."
        constraints: "one of NONE, LOW, MODERATE, HIGH"
      - name: pep_indication
        type: enum
        source: computed
        description: "PEP recommendation derived from risk_level by the risk_level calculation (§1.3): NONE->NOT_INDICATED, LOW->DEFER, MODERATE->INITIATE, HIGH->INITIATE."
        constraints: "one of NOT_INDICATED, DEFER, INITIATE"

  - name: QuarantineFacility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Facility name."
      - name: facility_type
        type: enum
        source: input
        description: "Kind of confinement facility."
        constraints: "one of SHELTER, VET_CLINIC"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of animals in overlapping active quarantine at this facility."
        constraints: "integer >= 1"
      - name: daily_boarding_cents
        type: integer
        source: input
        description: "Boarding cost per whole day of confinement, in cents."
        constraints: "integer >= 0"
      - name: current_occupancy
        type: integer
        source: computed
        description: "Count of QuarantineOrder rows with facility_id == this.id AND status == ACTIVE. Recomputed on order activation and on every terminal transition (COMPLETED/BREACHED/CONVERTED_TO_SPECIMEN). Starts at 0."
        default: 0

  - name: QuarantineOrder
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> BiteCase.id; the case this confinement order serves."
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the confined animal."
      - name: facility_id
        type: string
        source: input
        description: "FK -> QuarantineFacility.id; null for HOME_CONFINEMENT orders."
        default: null
      - name: order_type
        type: enum
        source: input
        description: "Confinement location type."
        constraints: "one of HOME_CONFINEMENT, FACILITY"
      - name: start_date
        type: datetime
        source: input
        description: "Confinement start instant (ISO 8601 UTC). Defaults to the logical clock's current value when omitted."
      - name: scheduled_end_date
        type: datetime
        source: computed
        description: "start_date + QUARANTINE_DAYS (10) days. The 10-day observation window is the half-open interval [start_date, scheduled_end_date)."
      - name: actual_release_date
        type: datetime
        source: system
        description: "Instant the order left ACTIVE (completion, breach, or conversion); null while ACTIVE."
        default: null
      - name: observation_outcome
        type: enum
        source: system
        description: "Vet's observation result recorded at completion/conversion."
        constraints: "one of PENDING, HEALTHY, SYMPTOMATIC, DECEASED"
        default: PENDING
      - name: status
        type: enum
        source: system
        description: "State-machine status (see §1.2)."
        constraints: "one of ACTIVE, COMPLETED, BREACHED, CONVERTED_TO_SPECIMEN"
        default: ACTIVE
      - name: boarding_cost_cents
        type: integer
        source: computed
        description: "Boarding cost owed by the owner; dual-variant per quarantine_boarding_cost (§1.3). ESTIMATED (full 10-day) while ACTIVE for FACILITY orders; ACTUAL (whole days confined) once terminal. 0 for HOME_CONFINEMENT."
        default: 0

  - name: Specimen
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> BiteCase.id; the case this specimen belongs to."
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal the brain specimen was collected from."
      - name: collected_datetime
        type: datetime
        source: input
        description: "When the specimen was collected (ISO 8601 UTC)."
      - name: condition
        type: enum
        source: input
        description: "Specimen condition on receipt. AUTOLYZED / UNSATISFACTORY specimens are auto-REJECTED at creation and cannot be tested."
        constraints: "one of SATISFACTORY, AUTOLYZED, UNSATISFACTORY"
      - name: test_method
        type: enum
        source: system
        description: "Lab method used; null until a result is reported."
        constraints: "one of DFA, RT_PCR"
        default: null
      - name: result
        type: enum
        source: system
        description: "Lab result; PENDING until POST /specimens/{id}/report-result."
        constraints: "one of PENDING, POSITIVE, NEGATIVE, INDETERMINATE"
        default: PENDING
      - name: reported_datetime
        type: datetime
        source: system
        description: "When the lab result was reported; null while PENDING."
        default: null
      - name: status
        type: enum
        source: system
        description: "State-machine status (see §1.2)."
        constraints: "one of SUBMITTED, RESULTED, REJECTED"
        default: SUBMITTED

  - name: PEPRecommendation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> BiteCase.id; the case whose victim this PEP record concerns."
      - name: indication
        type: enum
        source: computed
        description: "Copied from the parent BiteCase.pep_indication at creation; forced to INITIATE by the confirmed-rabid cascade (§1.2)."
        constraints: "one of NOT_INDICATED, DEFER, INITIATE"
      - name: rig_indicated
        type: boolean
        source: computed
        description: "True when indication == INITIATE AND BiteCase.wound_category == CATEGORY_III (rabies immune globulin indicated). Computed by pep_dose_projection (§1.3)."
        default: false
      - name: projected_doses
        type: integer
        source: computed
        description: "Provisional dose count from pep_dose_projection (§1.3): 4 when indication==INITIATE else 0."
        default: 0
      - name: projected_cost_cents
        type: integer
        source: computed
        description: "Provisional PEP cost from pep_dose_projection (§1.3), fixed at creation."
        default: 0
      - name: doses_administered
        type: integer
        source: system
        description: "Count of administered doses, incremented by POST /pep-recommendations/{id}/administer-dose. Starts at 0."
        default: 0
      - name: final_cost_cents
        type: integer
        source: computed
        description: "Actual PEP cost from pep_dose_projection final variant (§1.3), recomputed on each dose administration and on discontinuation."
        default: 0
      - name: status
        type: enum
        source: system
        description: "State-machine status (see §1.2)."
        constraints: "one of NOT_INDICATED, RECOMMENDED, INITIATED, COMPLETED, DISCONTINUED, SUPERSEDED"
        default: RECOMMENDED

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the cited owner."
      - name: case_id
        type: string
        source: input
        description: "FK -> BiteCase.id; the case the violation arose from."
      - name: violations
        type: array
        source: input
        description: "Non-empty list of violation codes bundled on this citation. Each contributes a base fine (see citation_fine_total constants, §1.3)."
        constraints: "each one of QUARANTINE_BREACH, NO_CURRENT_VACCINATION, FAILURE_TO_SURRENDER, UNLICENSED_ANIMAL"
      - name: base_fine_cents
        type: integer
        source: computed
        description: "Sum of per-violation base fines (before surcharge). Computed by citation_fine_total (§1.3)."
      - name: total_fine_cents
        type: integer
        source: computed
        description: "Per-violation surcharged fine, rounded then summed, per citation_fine_total (§1.3). This is the amount owed."
      - name: issued_date
        type: datetime
        source: system
        description: "Logical-clock instant the citation was issued."
      - name: due_date
        type: datetime
        source: computed
        description: "issued_date + CITATION_DUE_DAYS (30) days."
      - name: status
        type: enum
        source: system
        description: "State-machine status (see §1.2)."
        constraints: "one of ISSUED, CONTESTED, UPHELD, DISMISSED, PAID"
        default: ISSUED

  - name: SurveillanceRegion
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Unique region code; matched by natural key against BiteCase.region_code."
        constraints: "unique across SurveillanceRegion"
      - name: positive_threshold
        type: integer
        source: input
        description: "Confirmed-positive count at or above which alert_status becomes OUTBREAK."
        constraints: "integer >= 1"
        default: 3
      - name: confirmed_positive_count
        type: integer
        source: computed
        description: "Count of BiteCase rows with this region_code that have reached status CONFIRMED_RABID. Incremented by the lab-positive cascade (§1.2). Starts at 0."
        default: 0
      - name: wildlife_exposure_count
        type: integer
        source: computed
        description: "Count of WildlifeExposureReport rows filed under this region. Starts at 0."
        default: 0
      - name: alert_status
        type: enum
        source: computed
        description: "NORMAL when confirmed_positive_count == 0; ELEVATED when 0 < confirmed_positive_count < positive_threshold; OUTBREAK when confirmed_positive_count >= positive_threshold. Recomputed on every positive-case increment."
        constraints: "one of NORMAL, ELEVATED, OUTBREAK"
        default: NORMAL

  - name: WildlifeExposureReport
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> SurveillanceRegion.id; the region the wildlife exposure is surveilled under."
      - name: species
        type: enum
        source: input
        description: "Species involved in the wildlife exposure."
        constraints: "one of BAT, RACCOON, SKUNK, FOX, COYOTE, OTHER"
      - name: exposure_datetime
        type: datetime
        source: input
        description: "When the wildlife exposure occurred (ISO 8601 UTC)."
      - name: exposure_type
        type: enum
        source: input
        description: "Nature of the wildlife exposure."
        constraints: "one of DIRECT_CONTACT, BITE, INDOOR_FOUND_BAT"
      - name: disposition
        type: enum
        source: input
        description: "What became of the wild animal."
        constraints: "one of RELEASED, EUTHANIZED, ESCAPED, TESTED"
        default: ESCAPED

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BiteCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OBSERVATION_PENDING
        trigger: "POST /api/v1/bite-cases/{id}/quarantine-orders"
        actor: Veterinarian
        preconditions:
          - "case.status == OPEN"
          - "expected_bite_case_version matches case.version (OCC)"
          - "referenced animal exists and is not DECEASED/EUTHANIZED"
        side_effects:
          - "creates a QuarantineOrder in ACTIVE"
          - "referenced Animal moves REPORTED|CAPTURED -> UNDER_OBSERVATION"
          - "increments BiteCase.version by 1"
      - from: OPEN
        to: LAB_PENDING
        trigger: "POST /api/v1/bite-cases/{id}/specimens"
        actor: Veterinarian
        preconditions:
          - "case.status == OPEN"
          - "referenced Animal.status IN {DECEASED, EUTHANIZED}"
          - "specimen.condition == SATISFACTORY"
        side_effects:
          - "creates a Specimen in SUBMITTED"
      - from: OBSERVATION_PENDING
        to: LAB_PENDING
        trigger: "POST /api/v1/quarantine-orders/{id}/convert-to-specimen"
        actor: Veterinarian
        preconditions:
          - "the case's QuarantineOrder.status == ACTIVE"
          - "observation showed the animal became SYMPTOMATIC or DECEASED"
        side_effects:
          - "QuarantineOrder moves ACTIVE -> CONVERTED_TO_SPECIMEN"
          - "creates a Specimen in SUBMITTED for the same animal"
          - "Animal moves UNDER_OBSERVATION -> DECEASED"
          - "facility.current_occupancy decremented if facility order"
      - from: OBSERVATION_PENDING
        to: CLEARED
        trigger: "POST /api/v1/quarantine-orders/{id}/complete"
        actor: Veterinarian
        preconditions:
          - "the case's QuarantineOrder.status == ACTIVE (cross-entity, §1.4 priority 30)"
          - "clock >= QuarantineOrder.scheduled_end_date (10 days elapsed)"
          - "observation_outcome == HEALTHY (not SYMPTOMATIC/DECEASED)"
        side_effects:
          - "QuarantineOrder moves ACTIVE -> COMPLETED"
          - "Animal moves UNDER_OBSERVATION -> RELEASED"
          - "facility.current_occupancy decremented if facility order"
          - "any DEFER/RECOMMENDED PEPRecommendation on this case remains eligible for discontinuation"
      - from: LAB_PENDING
        to: CONFIRMED_RABID
        trigger: "POST /api/v1/specimens/{id}/report-result (result == POSITIVE)"
        actor: Veterinarian
        preconditions:
          - "Specimen.status == SUBMITTED"
        side_effects:
          - "Specimen moves SUBMITTED -> RESULTED with result POSITIVE (cascade link 1)"
          - "any non-terminal PEPRecommendation on this case has indication forced to INITIATE and status set to RECOMMENDED if still NOT_INDICATED/DEFER (cascade link 3a)"
          - "SurveillanceRegion whose region_code == case.region_code has confirmed_positive_count incremented by 1 (cascade link 3b)"
          - "that SurveillanceRegion.alert_status recomputed; becomes OUTBREAK when count >= positive_threshold (cascade link 4)"
      - from: LAB_PENDING
        to: CLEARED
        trigger: "POST /api/v1/specimens/{id}/report-result (result == NEGATIVE)"
        actor: Veterinarian
        preconditions:
          - "Specimen.status == SUBMITTED"
        side_effects:
          - "Specimen moves SUBMITTED -> RESULTED with result NEGATIVE"
          - "case's active INITIATED PEPRecommendation becomes eligible for discontinuation (animal cleared)"
      - from: CONFIRMED_RABID
        to: CLOSED
        trigger: "POST /api/v1/bite-cases/{id}/close"
        actor: Epidemiologist
        preconditions:
          - "case.status IN {CONFIRMED_RABID, CLEARED}"
        side_effects:
          - "no further transitions permitted"
      - from: CLEARED
        to: CLOSED
        trigger: "POST /api/v1/bite-cases/{id}/close"
        actor: Epidemiologist
        preconditions:
          - "case.status IN {CONFIRMED_RABID, CLEARED}"
        side_effects:
          - "no further transitions permitted"

  - entity: Animal
    initial_state: REPORTED
    terminal_states: [RELEASED, DECEASED, EUTHANIZED]
    transitions:
      - from: REPORTED
        to: AT_LARGE
        trigger: "POST /api/v1/animals/{id}/disposition (disposition body omitted, escaped=true) — recorded when animal not available"
        actor: AnimalControlOfficer
        preconditions:
          - "animal.status == REPORTED"
          - "animal.identified == false"
        side_effects:
          - "animal.control_status left NONE until a dispatch is requested"
      - from: AT_LARGE
        to: CAPTURED
        trigger: "POST /api/v1/animals/{id}/capture"
        actor: AnimalControlOfficer
        preconditions:
          - "animal.status == AT_LARGE"
        side_effects:
          - "animal.control_status -> CAPTURED"
      - from: REPORTED
        to: UNDER_OBSERVATION
        trigger: "POST /api/v1/bite-cases/{id}/quarantine-orders"
        actor: Veterinarian
        preconditions:
          - "animal.status IN {REPORTED, CAPTURED}"
        side_effects:
          - "confinement begins"
      - from: CAPTURED
        to: UNDER_OBSERVATION
        trigger: "POST /api/v1/bite-cases/{id}/quarantine-orders"
        actor: Veterinarian
        preconditions:
          - "animal.status IN {REPORTED, CAPTURED}"
        side_effects:
          - "confinement begins"
      - from: UNDER_OBSERVATION
        to: RELEASED
        trigger: "POST /api/v1/quarantine-orders/{id}/complete"
        actor: Veterinarian
        preconditions:
          - "quarantine completed HEALTHY after 10 days"
        side_effects:
          - "animal.disposition -> RELEASED"
      - from: UNDER_OBSERVATION
        to: DECEASED
        trigger: "POST /api/v1/quarantine-orders/{id}/convert-to-specimen"
        actor: Veterinarian
        preconditions:
          - "animal became SYMPTOMATIC or DECEASED during observation"
        side_effects:
          - "animal.disposition -> DECEASED; a Specimen is created"
      - from: REPORTED
        to: EUTHANIZED
        trigger: "POST /api/v1/animals/{id}/disposition (disposition == EUTHANIZED)"
        actor: AnimalControlOfficer
        preconditions:
          - "animal.status IN {REPORTED, CAPTURED}"
        side_effects:
          - "animal.disposition -> EUTHANIZED; animal becomes eligible for specimen submission"
      - from: CAPTURED
        to: EUTHANIZED
        trigger: "POST /api/v1/animals/{id}/disposition (disposition == EUTHANIZED)"
        actor: AnimalControlOfficer
        preconditions:
          - "animal.status IN {REPORTED, CAPTURED}"
        side_effects:
          - "animal.disposition -> EUTHANIZED; animal becomes eligible for specimen submission"
      - from: REPORTED
        to: DECEASED
        trigger: "POST /api/v1/animals/{id}/disposition (disposition == DECEASED)"
        actor: AnimalControlOfficer
        preconditions:
          - "animal.status IN {REPORTED, CAPTURED}"
        side_effects:
          - "animal.disposition -> DECEASED; animal becomes eligible for specimen submission"

  - entity: QuarantineOrder
    initial_state: ACTIVE
    terminal_states: [COMPLETED, BREACHED, CONVERTED_TO_SPECIMEN]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/v1/quarantine-orders/{id}/complete"
        actor: Veterinarian
        preconditions:
          - "order.status == ACTIVE"
          - "clock >= order.scheduled_end_date (§1.4 priority 40, boundary >=)"
          - "observation_outcome != SYMPTOMATIC and != DECEASED (§1.4 priority 20 safety)"
        side_effects:
          - "order.actual_release_date = clock now"
          - "boarding_cost_cents recomputed to ACTUAL variant (whole days confined)"
          - "Animal -> RELEASED; BiteCase OBSERVATION_PENDING -> CLEARED"
          - "facility.current_occupancy -= 1 if facility order (Rule 9 occupancy invariant)"
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /api/v1/quarantine-orders/{id}/breach"
        actor: AnimalControlOfficer
        preconditions:
          - "order.status == ACTIVE"
        side_effects:
          - "order.actual_release_date = clock now; boarding_cost_cents recomputed to ACTUAL"
          - "auto-issues a Citation (violations=[QUARANTINE_BREACH]) to the order's owner (cascade link 1)"
          - "Owner.outstanding_fines_cents increased and compliance_status -> DELINQUENT (cascade link 2)"
          - "Animal.control_status -> DISPATCH_REQUESTED (animal-control seizure linkage, cascade link 3)"
          - "facility.current_occupancy -= 1 if facility order"
      - from: ACTIVE
        to: CONVERTED_TO_SPECIMEN
        trigger: "POST /api/v1/quarantine-orders/{id}/convert-to-specimen"
        actor: Veterinarian
        preconditions:
          - "order.status == ACTIVE"
        side_effects:
          - "order.actual_release_date = clock now; boarding_cost_cents recomputed to ACTUAL"
          - "Animal UNDER_OBSERVATION -> DECEASED; BiteCase OBSERVATION_PENDING -> LAB_PENDING"
          - "creates a Specimen in SUBMITTED"
          - "facility.current_occupancy -= 1 if facility order"

  - entity: Specimen
    initial_state: SUBMITTED
    terminal_states: [RESULTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: RESULTED
        trigger: "POST /api/v1/specimens/{id}/report-result"
        actor: Veterinarian
        preconditions:
          - "specimen.status == SUBMITTED"
        side_effects:
          - "sets result, test_method, reported_datetime"
          - "drives BiteCase LAB_PENDING -> CONFIRMED_RABID (POSITIVE) or -> CLEARED (NEGATIVE); INDETERMINATE leaves case in LAB_PENDING"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: specimen created with condition AUTOLYZED or UNSATISFACTORY"
        actor: system
        preconditions:
          - "condition != SATISFACTORY at creation"
        side_effects:
          - "specimen persisted directly in REJECTED; no result can be reported; case stays LAB_PENDING (a fresh specimen must be submitted)"
        note: "REJECTED is reached only at creation time; a SUBMITTED specimen is never rejected afterwards."

  - entity: PEPRecommendation
    initial_state: RECOMMENDED
    terminal_states: [COMPLETED, DISCONTINUED, SUPERSEDED, NOT_INDICATED]
    transitions:
      - from: RECOMMENDED
        to: NOT_INDICATED
        trigger: "system: created for a case whose pep_indication == NOT_INDICATED"
        actor: system
        preconditions:
          - "parent BiteCase.pep_indication == NOT_INDICATED"
        side_effects:
          - "record persisted directly in terminal NOT_INDICATED; projected_doses = 0"
      - from: RECOMMENDED
        to: INITIATED
        trigger: "POST /api/v1/pep-recommendations/{id}/administer-dose"
        actor: Epidemiologist
        preconditions:
          - "pep.status == RECOMMENDED"
          - "pep.indication IN {INITIATE, DEFER}"
        side_effects:
          - "doses_administered = 1; final_cost_cents recomputed"
      - from: INITIATED
        to: INITIATED
        trigger: "POST /api/v1/pep-recommendations/{id}/administer-dose"
        actor: Epidemiologist
        preconditions:
          - "pep.status == INITIATED"
          - "doses_administered < projected_doses"
        side_effects:
          - "doses_administered += 1; final_cost_cents recomputed"
        note: "Self-loop for doses 2..projected_doses."
      - from: INITIATED
        to: COMPLETED
        trigger: "POST /api/v1/pep-recommendations/{id}/administer-dose (final dose)"
        actor: Epidemiologist
        preconditions:
          - "pep.status == INITIATED"
          - "doses_administered + 1 == projected_doses"
        side_effects:
          - "doses_administered = projected_doses; status -> COMPLETED"
      - from: INITIATED
        to: DISCONTINUED
        trigger: "POST /api/v1/pep-recommendations/{id}/discontinue"
        actor: Epidemiologist
        preconditions:
          - "pep.status == INITIATED"
          - "cross-entity: the case's Animal.status == RELEASED OR the case has a Specimen with result == NEGATIVE (§1.4 priority 25)"
        side_effects:
          - "final_cost_cents fixed at doses_administered actual cost (dual-variant final)"
      - from: RECOMMENDED
        to: SUPERSEDED
        trigger: "POST /api/v1/bite-cases/{id}/pep-recommendations (a newer recommendation supersedes the prior open one)"
        actor: Epidemiologist
        preconditions:
          - "a prior PEPRecommendation on this case is in RECOMMENDED"
          - "expected_bite_case_version matches case.version (OCC)"
        side_effects:
          - "prior recommendation -> SUPERSEDED; new recommendation created in RECOMMENDED"
          - "increments BiteCase.version by 1"

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [DISMISSED, PAID]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /api/v1/citations/{id}/contest"
        actor: Owner
        preconditions:
          - "citation.status == ISSUED"
          - "acting Owner owns this citation"
        side_effects:
          - "citation still counts toward owner.outstanding_fines_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /api/v1/citations/{id}/pay"
        actor: Owner
        preconditions:
          - "citation.status IN {ISSUED, UPHELD}"
          - "acting Owner owns this citation (§1.4 priority 60 referential)"
          - "payment_amount_cents == total_fine_cents (§1.4 priority 70 fiscal)"
        side_effects:
          - "citation -> PAID; Owner.outstanding_fines_cents decreased; compliance_status recomputed"
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /api/v1/citations/{id}/resolve (resolution == UPHELD)"
        actor: Epidemiologist
        preconditions:
          - "citation.status == CONTESTED"
        side_effects:
          - "citation upheld; still owed"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /api/v1/citations/{id}/resolve (resolution == DISMISSED)"
        actor: Epidemiologist
        preconditions:
          - "citation.status == CONTESTED"
        side_effects:
          - "compensation: Owner.outstanding_fines_cents reduced by total_fine_cents; compliance_status recomputed (Rule 9 fine invariant)"
      - from: UPHELD
        to: PAID
        trigger: "POST /api/v1/citations/{id}/pay"
        actor: Owner
        preconditions:
          - "citation.status IN {ISSUED, UPHELD}"
          - "acting Owner owns this citation"
          - "payment_amount_cents == total_fine_cents"
        side_effects:
          - "citation -> PAID; Owner.outstanding_fines_cents decreased; compliance_status recomputed"

concurrency_rules:
  - rule_id: pep-recommendation-supersede-stale-case
    parent_entity: BiteCase
    write_endpoint: "POST /api/v1/bite-cases/{id}/pep-recommendations"
    occ_field: "expected_bite_case_version"
    description: |
      Creating a PEPRecommendation supersedes any prior RECOMMENDED
      recommendation on the same case (recommendations are revised as new
      exposure facts arrive). A create whose expected_bite_case_version no
      longer matches the case's current version is rejected: the case has
      advanced since the client last observed it (e.g. a lab-positive cascade
      forced the prior recommendation, or another revision already superseded
      it), so this writer's view is stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: quarantine-order-reissue-stale-case
    parent_entity: BiteCase
    write_endpoint: "POST /api/v1/bite-cases/{id}/quarantine-orders"
    occ_field: "expected_bite_case_version"
    description: |
      Issuing a QuarantineOrder against a case whose version has advanced since
      the client last read it is rejected. This captures re-issuing an order
      after an at-large animal is captured: the intervening capture/identification
      bumped the case's version, so an issue carrying the pre-capture version is
      stale and must be retried against the fresh version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_level
    trigger: "POST /api/v1/bite-cases (computed at intake, stored on BiteCase.risk_level and pep_indication)"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear, state-conditional branching (mode a).
      # Evaluate in this exact order; first matching clause wins.
      if wound_category == 'CATEGORY_I':
          risk = 'NONE'
      elif (animal_id is null) or (animal.identified == false) or (animal.status == 'AT_LARGE'):
          risk = 'HIGH'                       # unavailable animal cannot be observed
      elif animal.animal_class == 'WILD' and animal.species in HIGH_RISK_WILDLIFE:
          risk = 'HIGH'
      elif animal.species in DOMESTIC_OBSERVABLE:
          if animal.vaccination_status == 'CURRENT':
              risk = 'LOW'
          else:
              risk = 'MODERATE'
      else:
          risk = 'MODERATE'
      # derived recommendation
      pep_indication = {'NONE':'NOT_INDICATED','LOW':'DEFER',
                        'MODERATE':'INITIATE','HIGH':'INITIATE'}[risk]
    input_set: "single BiteCase plus its referenced Animal (if animal_id set)."
    constants:
      HIGH_RISK_WILDLIFE: [BAT, RACCOON, SKUNK, FOX, COYOTE]
      DOMESTIC_OBSERVABLE: [DOG, CAT, FERRET]
    precision: "categorical; no rounding"

  - name: pep_dose_projection
    trigger: "POST /api/v1/bite-cases/{id}/pep-recommendations (provisional at creation); recomputed on administer-dose and discontinue (final)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL (fixed at recommendation creation): assumes the full regimen.
      rig_indicated = (indication == 'INITIATE') and (case.wound_category == 'CATEGORY_III')
      projected_doses = 4 if indication == 'INITIATE' else 0
      projected_cost_cents = projected_doses * DOSE_COST_CENTS \
                             + (RIG_COST_CENTS if rig_indicated else 0)
      # FINAL (recomputed as doses are given / on discontinuation): counts ACTUAL doses.
      final_cost_cents = doses_administered * DOSE_COST_CENTS \
                         + (RIG_COST_CENTS if (rig_indicated and doses_administered >= 1) else 0)
    input_set: "one PEPRecommendation and its parent BiteCase."
    constants:
      DOSE_COST_CENTS: 30000
      RIG_COST_CENTS: 120000
      STANDARD_DOSES: 4
    precision: "integer cents; no rounding needed"
    variants:
      - name: provisional
        when: "at recommendation creation, before any dose is administered"
        difference: "assumes the full 4-dose regimen (+RIG if CATEGORY_III); stored in projected_cost_cents"
      - name: final
        when: "after doses administered or on discontinuation when the animal is proven healthy"
        difference: "counts only doses_administered; final_cost_cents diverges from projected_cost_cents when PEP is discontinued early"

  - name: quarantine_boarding_cost
    trigger: "POST /api/v1/bite-cases/{id}/quarantine-orders (ESTIMATED at issue); recomputed on complete/breach/convert (ACTUAL)"
    algorithm: threshold
    formula: |
      # HOME_CONFINEMENT: always 0.
      if order_type == 'HOME_CONFINEMENT':
          boarding_cost_cents = 0
      else:
          # ESTIMATED (while ACTIVE): full 10-day window.
          # ACTUAL (once terminal): whole days actually confined, minimum 1.
          if status == 'ACTIVE':
              billable_days = QUARANTINE_DAYS
          else:
              elapsed = actual_release_date - start_date
              billable_days = max(1, floor(elapsed / 1 day))
          boarding_cost_cents = billable_days * facility.daily_boarding_cents
    input_set: "one QuarantineOrder and its QuarantineFacility (facility orders only)."
    constants:
      QUARANTINE_DAYS: 10
    precision: "integer cents; billable_days via floor of whole 24h days, min 1"
    variants:
      - name: estimated
        when: "order is ACTIVE (at issue), projecting a full 10-day stay"
        difference: "billable_days fixed at 10"
      - name: actual
        when: "order terminal (COMPLETED/BREACHED/CONVERTED_TO_SPECIMEN)"
        difference: "billable_days = whole days from start_date to actual_release_date (min 1); diverges from estimated on early breach/conversion"

  - name: citation_fine_total
    trigger: "POST /api/v1/citations and the quarantine-breach cascade (computed at issuance, immutable thereafter)"
    algorithm: aggregation
    formula: |
      # mode (b): per-line rounding order is pinned. Round each surcharged line
      # to whole cents with round_half_up, THEN sum. (sum-then-round is WRONG.)
      base_fine_cents = sum(BASE_FINES[v] for v in violations)
      total_fine_cents = sum(round_half_up(BASE_FINES[v] * (1 + SURCHARGE_PCT))
                             for v in violations)
    input_set: "the violations[] array on a single Citation."
    constants:
      SURCHARGE_PCT: 0.085
      BASE_FINES:
        QUARANTINE_BREACH: 50000
        FAILURE_TO_SURRENDER: 75000
        NO_CURRENT_VACCINATION: 25025
        UNLICENSED_ANIMAL: 15075
    precision: "round_half_up to whole cents, PER VIOLATION LINE, then sum"

  - name: surveillance_positive_rollup
    trigger: "BiteCase LAB_PENDING -> CONFIRMED_RABID cascade (§1.2)"
    algorithm: threshold
    formula: |
      # Runs when a case in region R is confirmed rabid.
      region = SurveillanceRegion where region_code == case.region_code   # natural-key selector
      region.confirmed_positive_count += 1
      if region.confirmed_positive_count == 0:
          region.alert_status = 'NORMAL'
      elif region.confirmed_positive_count < region.positive_threshold:
          region.alert_status = 'ELEVATED'
      else:                                   # >= threshold (boundary, inclusive)
          region.alert_status = 'OUTBREAK'
    input_set: "the single SurveillanceRegion whose region_code equals the confirmed case's region_code; no-op if none exists."
    constants: {}
    precision: "integer count; threshold comparison is >= (inclusive)"
    variants:
      - name: elevated
        when: "0 < confirmed_positive_count < positive_threshold"
        difference: "alert_status ELEVATED"
      - name: outbreak
        when: "confirmed_positive_count >= positive_threshold"
        difference: "alert_status OUTBREAK"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 5
    category: existence
    check: "all path-referenced resources exist, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 8
    category: existence
    check: "body foreign keys (owner_id, animal_id, case_id, facility_id, region_id) reference existing rows"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all creation endpoints with FK body fields"
  - priority: 10
    category: business_constraint
    check: "required body fields present and all enum values legal; victim_age >= 0; violations[] non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 12
    category: business_constraint
    check: "region_code unique on SurveillanceRegion creation"
    error_id: ERR_DUPLICATE_REGION_CODE
    http_status: 409
    applies_to: "POST /api/v1/surveillance-regions"
  - priority: 13
    category: business_constraint
    check: "FACILITY order_type requires facility_id; HOME_CONFINEMENT forbids facility_id"
    error_id: ERR_FACILITY_REQUIRED
    http_status: 422
    applies_to: "POST /api/v1/bite-cases/{id}/quarantine-orders"
    note: "checked before OCC so a malformed body never masks a version conflict test"
  - priority: 15
    category: state
    check: "OCC: expected_bite_case_version equals BiteCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /api/v1/bite-cases/{id}/quarantine-orders, POST /api/v1/bite-cases/{id}/pep-recommendations"
  - priority: 20
    category: business_safety
    check: "cannot COMPLETE (release) a quarantine when observation_outcome is SYMPTOMATIC or DECEASED — must convert to specimen"
    error_id: ERR_ANIMAL_SYMPTOMATIC
    http_status: 409
    applies_to: "POST /api/v1/quarantine-orders/{id}/complete"
  - priority: 22
    category: business_safety
    check: "Specimen creation requires the referenced Animal.status IN {DECEASED, EUTHANIZED}"
    error_id: ERR_ANIMAL_NOT_DECEASED
    http_status: 409
    applies_to: "POST /api/v1/bite-cases/{id}/specimens"
  - priority: 25
    category: business_referential
    check: "PEP discontinuation requires cross-entity clearance: the case's Animal.status == RELEASED OR the case has a Specimen with result == NEGATIVE"
    error_id: ERR_ANIMAL_NOT_CLEARED
    http_status: 409
    applies_to: "POST /api/v1/pep-recommendations/{id}/discontinue"
  - priority: 30
    category: state
    check: "target resource is in a state that permits the requested transition (e.g. quarantine complete/breach/convert require ACTIVE; specimen report-result requires SUBMITTED; case close requires CONFIRMED_RABID or CLEARED; pep administer requires RECOMMENDED/INITIATED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 40
    category: business_temporal
    check: "quarantine COMPLETE requires clock >= scheduled_end_date (10-day window elapsed; boundary inclusive)"
    error_id: ERR_QUARANTINE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /api/v1/quarantine-orders/{id}/complete"
  - priority: 45
    category: business_temporal
    check: "new QuarantineOrder for an animal must not have its [start_date, scheduled_end_date) window overlap an existing ACTIVE order for the same animal (adjacency where new.start == old.end is allowed)"
    error_id: ERR_ANIMAL_QUARANTINE_OVERLAP
    http_status: 409
    applies_to: "POST /api/v1/bite-cases/{id}/quarantine-orders"
  - priority: 50
    category: business_constraint
    check: "facility capacity: at every instant of the new order's [start_date, scheduled_end_date) window, the count of ACTIVE facility orders whose windows include that instant must remain <= facility.capacity"
    error_id: ERR_FACILITY_AT_CAPACITY
    http_status: 409
    applies_to: "POST /api/v1/bite-cases/{id}/quarantine-orders (FACILITY orders)"
  - priority: 60
    category: business_referential
    check: "acting Owner must own the citation being contested / paid"
    error_id: ERR_NOT_CITATION_OWNER
    http_status: 403
    applies_to: "POST /api/v1/citations/{id}/contest, POST /api/v1/citations/{id}/pay"
  - priority: 70
    category: business_fiscal
    check: "citation payment_amount_cents must equal total_fine_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /api/v1/citations/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Owners ----
  - method: POST
    path: "/api/v1/owners"
    description: "Register an animal owner."
    roles: [IntakeOfficer, HealthDeptAdmin]
    code: 201
    input: [full_name, phone, "address?", "license_number?"]
    output: Owner
    side_effects: ["Owner created COMPLIANT with outstanding_fines_cents=0"]
  - method: GET
    path: "/api/v1/owners/{id}"
    description: "Fetch an owner including computed compliance_status and outstanding_fines_cents."
    roles: [IntakeOfficer, Epidemiologist, Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # ---- Animals ----
  - method: POST
    path: "/api/v1/animals"
    description: "Record/identify an animal involved in a bite."
    roles: [IntakeOfficer, AnimalControlOfficer, HealthDeptAdmin]
    code: 201
    input: [species, animal_class, "owner_id?", "identified?", "vaccination_status?", "rabies_vaccine_expiry?"]
    output: Animal
    side_effects: ["Animal created in REPORTED"]
  - method: GET
    path: "/api/v1/animals/{id}"
    description: "Fetch an animal."
    roles: [IntakeOfficer, Epidemiologist, Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: []
    output: Animal
    side_effects: []
  - method: GET
    path: "/api/v1/animals"
    description: "List animals; filter by owner (FK reverse-reachability) or status."
    roles: [IntakeOfficer, Epidemiologist, Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: ["owner_id?", "status?", "limit?", "offset?"]
    output: Animal[]
    side_effects: []
  - method: POST
    path: "/api/v1/animals/{id}/capture"
    description: "Record an animal-control capture of an at-large animal."
    roles: [AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: []
    output: Animal
    side_effects: ["Animal AT_LARGE -> CAPTURED; control_status -> CAPTURED"]
  - method: POST
    path: "/api/v1/animals/{id}/disposition"
    description: "Record an animal disposition (EUTHANIZED/DECEASED) or mark an unidentified animal at large (escaped)."
    roles: [AnimalControlOfficer, Veterinarian, HealthDeptAdmin]
    code: 200
    input: ["disposition?", "escaped?"]
    output: Animal
    side_effects: ["Animal transitions per §1.2; disposition set; may become specimen-eligible"]

  # ---- Bite cases ----
  - method: POST
    path: "/api/v1/bite-cases"
    description: "Intake a bite report; computes risk_level and pep_indication immediately (§1.3 risk_level)."
    roles: [IntakeOfficer, HealthDeptAdmin]
    code: 201
    input: [region_code, incident_datetime, exposure_type, body_site, wound_category, victim_name, victim_age, "victim_prior_vaccinated?", "animal_id?"]
    output: BiteCase
    side_effects: ["BiteCase created in OPEN with computed risk_level/pep_indication; case_number minted"]
  - method: GET
    path: "/api/v1/bite-cases/{id}"
    description: "Fetch a bite case (includes version for OCC)."
    roles: [IntakeOfficer, Epidemiologist, Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: []
    output: BiteCase
    side_effects: []
  - method: GET
    path: "/api/v1/bite-cases"
    description: "List bite cases; filter by animal (FK reverse-reachability), status, or region_code."
    roles: [IntakeOfficer, Epidemiologist, Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: ["animal_id?", "status?", "region_code?", "limit?", "offset?"]
    output: BiteCase[]
    side_effects: []
  - method: POST
    path: "/api/v1/bite-cases/{id}/close"
    description: "Close a case that has been resolved (CONFIRMED_RABID or CLEARED)."
    roles: [Epidemiologist, HealthDeptAdmin]
    code: 200
    input: []
    output: BiteCase
    side_effects: ["BiteCase -> CLOSED"]

  # ---- Quarantine facilities ----
  - method: POST
    path: "/api/v1/quarantine-facilities"
    description: "Create a confinement facility with capacity and daily boarding rate."
    roles: [HealthDeptAdmin]
    code: 201
    input: [name, facility_type, capacity, daily_boarding_cents]
    output: QuarantineFacility
    side_effects: ["Facility created with current_occupancy=0"]
  - method: GET
    path: "/api/v1/quarantine-facilities/{id}"
    description: "Fetch a facility including computed current_occupancy."
    roles: [Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: []
    output: QuarantineFacility
    side_effects: []

  # ---- Quarantine orders ----
  - method: POST
    path: "/api/v1/bite-cases/{id}/quarantine-orders"
    description: "Issue a 10-day confinement order (OCC on the case; supersede-reissue). scheduled_end_date computed as start_date + 10 days."
    roles: [Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 201
    input: [expected_bite_case_version, animal_id, order_type, "facility_id?", "start_date?"]
    output: QuarantineOrder
    side_effects: ["QuarantineOrder ACTIVE created; Animal -> UNDER_OBSERVATION; BiteCase OPEN -> OBSERVATION_PENDING; facility.current_occupancy += 1 (facility); estimated boarding_cost_cents; increments BiteCase.version by 1"]
  - method: GET
    path: "/api/v1/quarantine-orders/{id}"
    description: "Fetch a quarantine order (includes computed boarding_cost_cents, scheduled_end_date)."
    roles: [Veterinarian, AnimalControlOfficer, Epidemiologist, HealthDeptAdmin]
    code: 200
    input: []
    output: QuarantineOrder
    side_effects: []
  - method: GET
    path: "/api/v1/quarantine-orders"
    description: "List quarantine orders; filter by case, animal, or facility (FK reverse-reachability), and status."
    roles: [Veterinarian, AnimalControlOfficer, Epidemiologist, HealthDeptAdmin]
    code: 200
    input: ["case_id?", "animal_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: QuarantineOrder[]
    side_effects: []
  - method: POST
    path: "/api/v1/quarantine-orders/{id}/complete"
    description: "Complete a 10-day quarantine (release healthy animal). Enforces safety (priority 20), state (30), temporal boundary (40)."
    roles: [Veterinarian, HealthDeptAdmin]
    code: 200
    input: ["observation_outcome?"]
    output: QuarantineOrder
    side_effects: ["order -> COMPLETED; ACTUAL boarding_cost_cents; Animal -> RELEASED; BiteCase -> CLEARED; facility.current_occupancy -= 1"]
  - method: POST
    path: "/api/v1/quarantine-orders/{id}/breach"
    description: "Record a confinement breach; triggers the citation/owner/animal-control cascade."
    roles: [AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: []
    output: QuarantineOrder
    side_effects: ["order -> BREACHED; ACTUAL boarding_cost_cents; auto-Citation issued; Owner delinquent; Animal.control_status -> DISPATCH_REQUESTED; facility.current_occupancy -= 1"]
  - method: POST
    path: "/api/v1/quarantine-orders/{id}/convert-to-specimen"
    description: "Convert a live quarantine to specimen submission when the animal became symptomatic/deceased."
    roles: [Veterinarian, HealthDeptAdmin]
    code: 200
    input: [collected_datetime, condition]
    output: QuarantineOrder
    side_effects: ["order -> CONVERTED_TO_SPECIMEN; ACTUAL boarding_cost_cents; Animal -> DECEASED; BiteCase -> LAB_PENDING; Specimen created SUBMITTED; facility.current_occupancy -= 1"]

  # ---- Specimens & lab results ----
  - method: POST
    path: "/api/v1/bite-cases/{id}/specimens"
    description: "Submit a brain specimen for a deceased/euthanized animal. SATISFACTORY -> SUBMITTED; AUTOLYZED/UNSATISFACTORY -> auto REJECTED."
    roles: [Veterinarian, HealthDeptAdmin]
    code: 201
    input: [animal_id, collected_datetime, condition]
    output: Specimen
    side_effects: ["Specimen created; SATISFACTORY drives BiteCase OPEN -> LAB_PENDING"]
  - method: GET
    path: "/api/v1/specimens/{id}"
    description: "Fetch a specimen and its result fields."
    roles: [Veterinarian, Epidemiologist, HealthDeptAdmin]
    code: 200
    input: []
    output: Specimen
    side_effects: []
  - method: GET
    path: "/api/v1/specimens"
    description: "List specimens; filter by case or animal (FK reverse-reachability)."
    roles: [Veterinarian, Epidemiologist, HealthDeptAdmin]
    code: 200
    input: ["case_id?", "animal_id?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []
  - method: POST
    path: "/api/v1/specimens/{id}/report-result"
    description: "Report a DFA/RT-PCR lab result; POSITIVE drives the confirmed-rabid cascade (§1.2)."
    roles: [Veterinarian, HealthDeptAdmin]
    code: 200
    input: [test_method, result]
    output: Specimen
    side_effects: ["Specimen -> RESULTED; case -> CONFIRMED_RABID (POSITIVE) or CLEARED (NEGATIVE); surveillance rollup on POSITIVE"]

  # ---- PEP recommendations ----
  - method: POST
    path: "/api/v1/bite-cases/{id}/pep-recommendations"
    description: "Create/supersede the victim PEP recommendation (OCC on case). indication copied from BiteCase.pep_indication."
    roles: [Epidemiologist, HealthDeptAdmin]
    code: 201
    input: [expected_bite_case_version]
    output: PEPRecommendation
    side_effects: ["prior RECOMMENDED recommendation -> SUPERSEDED; new record created (RECOMMENDED, or terminal NOT_INDICATED); projected_doses/cost computed; increments BiteCase.version by 1"]
  - method: GET
    path: "/api/v1/bite-cases/{id}/pep-recommendations"
    description: "List PEP recommendations for a case (FK reverse-reachability for PEPRecommendation.case_id)."
    roles: [Epidemiologist, Veterinarian, HealthDeptAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PEPRecommendation[]
    side_effects: []
  - method: POST
    path: "/api/v1/pep-recommendations/{id}/administer-dose"
    description: "Record one administered PEP dose (RECOMMENDED -> INITIATED -> ... -> COMPLETED)."
    roles: [Epidemiologist, HealthDeptAdmin]
    code: 200
    input: []
    output: PEPRecommendation
    side_effects: ["doses_administered += 1; final_cost_cents recomputed; status advances"]
  - method: POST
    path: "/api/v1/pep-recommendations/{id}/discontinue"
    description: "Discontinue PEP once the animal is cleared (cross-entity precondition, §1.4 priority 25)."
    roles: [Epidemiologist, HealthDeptAdmin]
    code: 200
    input: []
    output: PEPRecommendation
    side_effects: ["status -> DISCONTINUED; final_cost_cents fixed at actual doses"]

  # ---- Citations ----
  - method: POST
    path: "/api/v1/citations"
    description: "Issue a citation (manual, e.g. NO_CURRENT_VACCINATION / UNLICENSED_ANIMAL). total_fine_cents computed (§1.3)."
    roles: [AnimalControlOfficer, HealthDeptAdmin]
    code: 201
    input: [owner_id, case_id, violations]
    output: Citation
    side_effects: ["Citation ISSUED; Owner.outstanding_fines_cents increased; compliance_status -> DELINQUENT; due_date computed"]
  - method: GET
    path: "/api/v1/citations/{id}"
    description: "Fetch a citation."
    roles: [Owner, AnimalControlOfficer, Epidemiologist, HealthDeptAdmin]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: GET
    path: "/api/v1/citations"
    description: "List citations; filter by owner or case (FK reverse-reachability)."
    roles: [Owner, AnimalControlOfficer, Epidemiologist, HealthDeptAdmin]
    code: 200
    input: ["owner_id?", "case_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []
  - method: POST
    path: "/api/v1/citations/{id}/contest"
    description: "Owner contests a citation (ISSUED -> CONTESTED)."
    roles: [Owner, HealthDeptAdmin]
    code: 200
    input: ["reason?"]
    output: Citation
    side_effects: ["Citation -> CONTESTED"]
  - method: POST
    path: "/api/v1/citations/{id}/resolve"
    description: "Hearing resolution (CONTESTED -> UPHELD/DISMISSED). Resolved by Epidemiologist (segregated from issuing AnimalControlOfficer)."
    roles: [Epidemiologist, HealthDeptAdmin]
    code: 200
    input: [resolution]
    output: Citation
    side_effects: ["DISMISSED compensates Owner.outstanding_fines_cents by total_fine_cents (Rule 9); UPHELD leaves it owed"]
  - method: POST
    path: "/api/v1/citations/{id}/pay"
    description: "Owner pays a citation (ISSUED/UPHELD -> PAID). Enforces referential (priority 60) then fiscal (priority 70)."
    roles: [Owner, HealthDeptAdmin]
    code: 200
    input: [payment_amount_cents]
    output: Citation
    side_effects: ["Citation -> PAID; Owner.outstanding_fines_cents decreased; compliance_status recomputed"]

  # ---- Surveillance & wildlife ----
  - method: POST
    path: "/api/v1/surveillance-regions"
    description: "Create a surveillance region with an outbreak threshold."
    roles: [HealthDeptAdmin]
    code: 201
    input: [region_code, "positive_threshold?"]
    output: SurveillanceRegion
    side_effects: ["Region created NORMAL with counts=0"]
  - method: GET
    path: "/api/v1/surveillance-regions/{id}"
    description: "Fetch a region including confirmed_positive_count, wildlife_exposure_count, alert_status (reporting)."
    roles: [IntakeOfficer, Epidemiologist, Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: []
    output: SurveillanceRegion
    side_effects: []
  - method: POST
    path: "/api/v1/surveillance-regions/{id}/wildlife-exposure-reports"
    description: "File a wildlife-exposure surveillance report under a region."
    roles: [IntakeOfficer, Epidemiologist, HealthDeptAdmin]
    code: 201
    input: [species, exposure_datetime, exposure_type, "disposition?"]
    output: WildlifeExposureReport
    side_effects: ["report created; region.wildlife_exposure_count += 1"]
  - method: GET
    path: "/api/v1/surveillance-regions/{id}/wildlife-exposure-reports"
    description: "List wildlife reports for a region (FK reverse-reachability for WildlifeExposureReport.region_id)."
    roles: [IntakeOfficer, Epidemiologist, Veterinarian, AnimalControlOfficer, HealthDeptAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: WildlifeExposureReport[]
    side_effects: []

  # ---- Test-driving ----
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving). Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/window rules read this clock."
    roles: [HealthDeptAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, illegal enum, negative age, or empty violations[]"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "owner id (path or owner_id body FK) does not exist"
  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "animal id (path or animal_id body FK) does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "bite-case id (path or case_id body FK) does not exist"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "facility id (path or facility_id body FK) does not exist"
  - id: ERR_QUARANTINE_ORDER_NOT_FOUND
    http: 404
    condition: "quarantine-order id in path does not exist"
  - id: ERR_SPECIMEN_NOT_FOUND
    http: 404
    condition: "specimen id in path does not exist"
  - id: ERR_PEP_NOT_FOUND
    http: 404
    condition: "pep-recommendation id in path does not exist"
  - id: ERR_CITATION_NOT_FOUND
    http: 404
    condition: "citation id in path does not exist"
  - id: ERR_REGION_NOT_FOUND
    http: 404
    condition: "surveillance-region id (path or region_id body FK) does not exist"
  - id: ERR_DUPLICATE_REGION_CODE
    http: 409
    condition: "region_code already used by another SurveillanceRegion"
  - id: ERR_FACILITY_REQUIRED
    http: 422
    condition: "FACILITY order_type missing facility_id, or HOME_CONFINEMENT supplied a facility_id"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_bite_case_version does not match BiteCase.version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state permitting the requested transition"
  - id: ERR_ANIMAL_SYMPTOMATIC
    http: 409
    condition: "attempted to complete/release a quarantine whose observation_outcome is SYMPTOMATIC or DECEASED"
  - id: ERR_ANIMAL_NOT_DECEASED
    http: 409
    condition: "specimen submission attempted for an animal not DECEASED/EUTHANIZED"
  - id: ERR_ANIMAL_NOT_CLEARED
    http: 409
    condition: "PEP discontinuation attempted before the animal is cleared (not RELEASED and no NEGATIVE specimen)"
  - id: ERR_QUARANTINE_NOT_ELAPSED
    http: 409
    condition: "quarantine completion attempted before scheduled_end_date (10-day window not elapsed)"
  - id: ERR_ANIMAL_QUARANTINE_OVERLAP
    http: 409
    condition: "new quarantine window overlaps an existing ACTIVE order for the same animal"
  - id: ERR_FACILITY_AT_CAPACITY
    http: 409
    condition: "facility would exceed capacity at some instant of the new order's window"
  - id: ERR_NOT_CITATION_OWNER
    http: 403
    condition: "acting Owner does not own the citation being contested/paid"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "citation payment_amount_cents != total_fine_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeOfficer
    description: "Intakes bite reports, registers owners and animals, files wildlife-exposure reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/bite-cases"
      - "POST /api/v1/owners"
    shared_operations:
      - "POST /api/v1/animals"
      - "POST /api/v1/surveillance-regions/{id}/wildlife-exposure-reports"
      - "all GET reads"
  - name: Epidemiologist
    description: "Owns victim risk follow-up: PEP recommendations, dose administration, case closure, and citation-hearing resolution (segregated from issuance)."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/bite-cases/{id}/pep-recommendations"
      - "POST /api/v1/pep-recommendations/{id}/administer-dose"
      - "POST /api/v1/pep-recommendations/{id}/discontinue"
      - "POST /api/v1/bite-cases/{id}/close"
      - "POST /api/v1/citations/{id}/resolve"
    shared_operations:
      - "all GET reads"
  - name: Veterinarian
    description: "Owns quarantine and laboratory workflow: issue/complete/convert orders, submit specimens, report results."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/quarantine-orders/{id}/complete"
      - "POST /api/v1/quarantine-orders/{id}/convert-to-specimen"
      - "POST /api/v1/bite-cases/{id}/specimens"
      - "POST /api/v1/specimens/{id}/report-result"
    shared_operations:
      - "POST /api/v1/bite-cases/{id}/quarantine-orders"
      - "POST /api/v1/animals/{id}/disposition"
      - "all GET reads"
  - name: AnimalControlOfficer
    description: "Field enforcement: capture at-large animals, record breaches, issue citations, set dispositions."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/animals/{id}/capture"
      - "POST /api/v1/quarantine-orders/{id}/breach"
      - "POST /api/v1/citations"
    shared_operations:
      - "POST /api/v1/bite-cases/{id}/quarantine-orders"
      - "POST /api/v1/animals"
      - "POST /api/v1/animals/{id}/disposition"
      - "all GET reads"
  - name: Owner
    description: "An animal owner acting on their own citations only."
    identity: "entity_backed:Owner"
    exclusive_operations: []
    shared_operations:
      - "POST /api/v1/citations/{id}/contest (own citations)"
      - "POST /api/v1/citations/{id}/pay (own citations)"
      - "GET /api/v1/citations, GET /api/v1/citations/{id} (own citations)"
  - name: HealthDeptAdmin
    description: "Operational superset able to perform every operation, plus facility/region setup and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/quarantine-facilities"
      - "POST /api/v1/surveillance-regions"
      - "POST /api/v1/_clock/set_current_utc"
    shared_operations:
      - "every business endpoint above"
