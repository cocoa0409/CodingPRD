              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /quality-claims"
              payload: { order_id: "${order_id}", claim_type: "COMPRESSION_RECOVERY", photo_evidence_count: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /quality-claims?order_id=${order_id}"
              payload: {}
              as: TrialSupportAgent
          assert:
            - "response code == 422 with data.error_id == ERR_RECOVERY_WINDOW_NOT_ELAPSED"
            - "GET /quality-claims?order_id=${order_id} returns total_count == 0"
            - "TrialOrder.${order_id}.fulfillment_status == DELIVERED"

      - name: compression_complaint_on_the_third_night_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=19]
          - state_machines.TrialOrder.fulfillment_status.DELIVERED_to_DAMAGED_REPORTED
        distinguishing_aspect: "The same request one day later satisfies the wait inclusively: floor((2026-08-04 - 2026-08-01)/86400) == 3 >= 3, so the claim is created in SUBMITTED and the order moves DELIVERED -> DAMAGED_REPORTED with a version bump."
        test_recipe:
          setup:
            - "Identical to the refused case, except the clock is 2026-08-04 (3 nights)."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-V3", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "v3@example.com", full_name: "Van Three", household_hash: "HH-V3" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
              captures: { order_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /quality-claims"
              payload: { order_id: "${order_id}", claim_type: "COMPRESSION_RECOVERY", photo_evidence_count: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "response code == 201"
            - "QualityClaim.${claim_id}.status == SUBMITTED and reported_at == 2026-08-04T00:00:00Z and evidence_round_count == 0"
            - "TrialOrder.${order_id}.fulfillment_status == DAMAGED_REPORTED and trial_status == BREAK_IN"
            - "TrialOrder.${order_id}.version == ${order_v} + 1"

      - name: shipping_damage_reported_on_the_eighth_night_returns_damage_report_window_closed
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - errors.ERR_DAMAGE_REPORT_WINDOW_CLOSED
        distinguishing_aspect: "DAMAGE_REPORT_WINDOW_NIGHTS is 7 and the comparison is <=, so 2026-08-09 (8 nights after a 2026-08-01 delivery) is the first refused day - the opposite direction to the compression wait, which has a lower bound instead of an upper one."
        test_recipe:
          setup:
            - "One QUEEN MattressModel, one Customer with a DTC order delivered 2026-08-01."
