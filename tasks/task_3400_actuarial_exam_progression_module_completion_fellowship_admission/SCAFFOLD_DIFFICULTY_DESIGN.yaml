              payload: {}
              as: Registrar
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_fm_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_WINDOW_NOT_OPEN (state category, priority 8, wins over the unmet-prerequisite constraint at priority 10)"
      - name: module_attempt_safety_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_CANDIDATE_NOT_ACTIVE]
          - errors[ERR_MODULE_COOLDOWN_ACTIVE]
        distinguishing_aspect: |
          Category pair {business_safety, business_temporal} (disjoint from the
          sibling instance's {state, business_constraint}): the candidate is
          SUSPENDED (safety) AND inside the 14-day retake cooldown (temporal);
          priority 9 beats priority 11, so the error must be ERR_CANDIDATE_NOT_ACTIVE,
