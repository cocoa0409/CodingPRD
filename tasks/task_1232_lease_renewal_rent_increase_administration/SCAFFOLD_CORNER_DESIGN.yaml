              captures: { u2: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "F3", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u3: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Fo Recast", email: "fo.recast@x.com" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Fo Recast2", email: "fo.recast2@x.com" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Fo Recast3", email: "fo.recast3@x.com" }
              as: PlatformAdmin
              captures: { r3: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${u1}", resident_id: "${r1}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { ls: $.data.id, ls_v: $.data.version }
            - call: "POST /leases"
              payload: { unit_id: "${u2}", resident_id: "${r2}", term_start_date: "2026-06-01", term_months: 36, monthly_rent_cents: 200000 }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${u3}", resident_id: "${r3}", term_start_date: "2026-06-01", term_months: 30, monthly_rent_cents: 200000 }
              as: PropertyManager
            - call: "POST /leases/${ls}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${ls_v}" }
              as: LeasingAgent
          trigger:
            - call: "GET /properties/${prop}/expiration-forecast"
              payload: { months_ahead: 48 }
              as: PropertyManager
              captures: { window_start: $.data.window_start, months: $.data.months }
          assert:
            - "window_start == 2026-05 (current clock month)"
            - "months contains committed 1 at 2027-06 (subject lease), 1 at 2028-12 (30-month blocker), 1 at 2029-06 (36-month blocker)"
            - "months contains projected 1 at 2029-05 (the DRAFT offer's term-23 projection from 2027-06-01)"
            - "all other months report committed 0 and projected 0"

      - name: proposed_rent_round_half_up
        claim_type: precision
        grounds: [calculations.proposed_rent_cents]
        distinguishing_aspect: "round_half_up at the stored-cent step: rent 199998 at 25 bps gives 199998*1.0025 = 200497.995 -> 200498; a floor/truncating implementation answers 200497 and fails."
        test_recipe:
          setup: ["policy CA-OAK; property band [12,12]; unit market 200498 (gap rounds to exactly 25 bps); lease rent 199998"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Half Up Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "H1", bedrooms: 1, current_market_rent_cents: 200498 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Hal Fup", email: "hal.fup@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 199998 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "AGGRESSIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { proposed: $.data.proposed_rent_cents, incr: $.data.proposed_increase_bps }
          assert:
            - "incr == 25 (round_half_up(500/199998*10000) = round_half_up(25.00025))"
            - "proposed == 200498 (round_half_up(200497.995), not 200497)"

      - name: retention_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.retention_rate_bps]
        distinguishing_aspect: "Only leases anchored to the cohort window count: a lease ending 2027-07-15 is excluded from the June window; cohort_size == 1 and retention_rate_bps == 0 (not null — non-empty cohort with zero retained)."
        test_recipe:
          setup: ["policy CA-OAK; property band [12,12]; two units; L1 2026-06-15 + 12mo -> end 2027-06-15 (in window); L2 2026-07-01 + 12mo -> end 2027-07-01 (outside); no offers or notices"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Filter Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "W1", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "W2", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { w2: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Win Dow1", email: "win.dow1@x.com" }
              as: PlatformAdmin
              captures: { rw1: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Win Dow2", email: "win.dow2@x.com" }
              as: PlatformAdmin
              captures: { rw2: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${w1}", resident_id: "${rw1}", term_start_date: "2026-06-15", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${w2}", resident_id: "${rw2}", term_start_date: "2026-07-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
          trigger:
            - call: "GET /properties/${prop}/retention-metrics"
              payload: { cohort_start: "2027-06-01", cohort_end: "2027-06-30", variant: "TRAILING" }
              as: PropertyManager
              captures: { size: $.data.cohort_size, rate: $.data.retention_rate_bps, lost: $.data.lost_count, pending: $.data.pending_count }
          assert:
            - "size == 1 (the July lease is excluded from the June window)"
            - "rate == 0 (non-empty cohort, nothing retained) — distinct from the null empty-cohort case"

      - name: provisional_vs_executed_variant_selection
        claim_type: variant_selection
        grounds: [calculations.proposed_rent_cents]
        excluded_because:
          difficulty_instance: provisional_vs_executed_rent_policy_drift
          rationale: "Both variants and the drift delta are asserted with literals in the named difficulty instance."

      - name: retention_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.retention_rate_bps]
        excluded_because:
          difficulty_instance: retention_trailing_vs_pipeline_cohort
          rationale: "TRAILING 5000 vs PIPELINE 7500 on the same cohort is asserted in the named difficulty instance."

      - name: mtm_nested_rounding_precision
        claim_type: precision
        grounds: [calculations.mtm_rent_cents]
        excluded_because:
          difficulty_instance: mtm_rent_nested_rounding_order
          rationale: "The 242637 vs 242638 one-cent rounding-order divergence is asserted in the named difficulty instance."

      - name: notice_tier_threshold_boundary
        claim_type: correct_result
        grounds: [calculations.notice_days_required]
        excluded_because:
          difficulty_instance: increase_exactly_at_high_threshold_gets_low_notice
          rationale: "The exactly-500-bps -> 60-day boundary is asserted in the named difficulty instance."

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role / X-User-ID headers -> 401 ERR_UNAUTHENTICATED before any role, existence, or business check (the endpoint exists and the body is otherwise valid)."
        test_recipe:
          setup: ["empty DB; request is sent WITHOUT the X-User-Role and X-User-ID headers (the as: value below is documentation of intent only — the test harness strips auth headers for this trigger)"]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "No Auth", rent_cap_policy_id: "00000000-0000-4000-8000-0000000000d1", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401) — auth precedes even the body-FK existence check"

      - name: notice_lead_59_days_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_NOTICE_LEAD]"]
        distinguishing_aspect: "Boundary on statutory lead: serving at effective_date - 59 days (2027-04-03 for effective 2027-06-01) fails; serving at exactly -60 days (2027-04-02) would pass (satisfaction path exercised by every other serve fixture with 61+ days of lead)."
        test_recipe:
          setup: ["lease end 2027-06-01; notice REPEATED_LATE_PAYMENT effective 2027-06-01 created by user_la_1; clock advanced to 2027-04-03"]
