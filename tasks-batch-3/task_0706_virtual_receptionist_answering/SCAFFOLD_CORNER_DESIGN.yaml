        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - endpoints.POST_/va/appointments
        distinguishing_aspect: "Booking a non-overlapping interval into an OPEN slot with available_count > 0 succeeds with 201 and REQUESTED status."
