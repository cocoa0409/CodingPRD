- rule_id: resource_temporal_overlap
  instances:
  - name: operating_room_buffered_half_open_turnover_boundary
    grounds:
    - validations.priority_18.ERR_OR_SLOT_CONFLICT
    - entities.OperatingRoom.fields.turnover_buffer_minutes
    - entities.OperatingRoom.fields.reserved_minutes_total
    - entities.ProcedureBooking.fields.duration_minutes
    - calculations.chain_commitment_conservation
    distinguishing_aspect: 'Resource = OperatingRoom, interval semantics = HALF-OPEN windows inflated
      by the room''s turnover_buffer_minutes: the test is rejected when new.start_at < existing.end_at
      + 45min, so a booking starting exactly 45 minutes after the previous one ends is accepted. The buffer
      is a property of the room row, so the boundary moves with configuration.'
    test_recipe:
      setup:
      - OR-1 with turnover_buffer_minutes 45 and OR-2 with turnover_buffer_minutes 45, both reserved_minutes_total
        0 initially
      - Two SURGEON staff members, so the surgeon rule at priority 19 can be kept out of the way entirely
      - One ACTIVE DONOR_RECOVERY booking in OR-1 on 2026-08-09T06:00:00Z-10:00:00Z with duration_minutes
        240, so OR-1 reserved_minutes_total is 240 and the room is effectively blocked until 10:45
      - A DRAFT chain with a single PLANNED segment to hang the bookings on; booking creation is not gated
        on chain state
      - The logical clock is at its default 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Surgeon One
          staff_role: SURGEON
          npi: '1000000006'
        as: ProgramAdmin
        captures:
          surg_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Surgeon Two
          staff_role: SURGEON
          npi: '1000000007'
        as: ProgramAdmin
        captures:
          surg2_id: $.data.id
      - call: POST /operating-rooms
        payload:
          program_id: ${prog_id}
          room_code: OR-1
          turnover_buffer_minutes: 45
        as: ProgramAdmin
        captures:
          room1_id: $.data.id
      - call: POST /operating-rooms
        payload:
          program_id: ${prog_id}
          room_code: OR-2
          turnover_buffer_minutes: 45
        as: ProgramAdmin
        captures:
          room2_id: $.data.id
      - call: POST /recipient-candidates
        payload:
          program_id: ${prog_id}
          mrn: R-001
          abo_blood_type: A
          age_years: 44
          cpra: 0.85
          dialysis_years: 3.0
          medical_urgency_points: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          rec1_id: $.data.id
      - call: POST /donor-candidates
        payload:
          program_id: ${prog_id}
          mrn: D-001
          abo_blood_type: O
          age_years: 41
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          d1_id: $.data.id
      - call: POST /exchange-chains
        payload:
          program_id: ${prog_id}
          chain_type: PAIRED_LOOP
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          chain_id: $.data.id
          chain_v0: $.data.version
      - call: POST /exchange-chains/${chain_id}/segments
        payload:
          expected_chain_version: ${chain_v0}
          position: 1
          donor_candidate_id: ${d1_id}
          recipient_candidate_id: ${rec1_id}
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          seg1_id: $.data.id
      - call: POST /procedure-bookings
        payload:
          operating_room_id: ${room1_id}
          chain_segment_id: ${seg1_id}
          surgeon_staff_id: ${surg_id}
          booking_role: DONOR_RECOVERY
          start_at: '2026-08-09T06:00:00Z'
          end_at: '2026-08-09T10:00:00Z'
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          book_a_id: $.data.id
      trigger:
      - call: POST /procedure-bookings
        payload:
          operating_room_id: ${room1_id}
          chain_segment_id: ${seg1_id}
          surgeon_staff_id: ${surg2_id}
          booking_role: RECIPIENT_IMPLANT
          start_at: '2026-08-09T10:30:00Z'
          end_at: '2026-08-09T12:00:00Z'
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          err_id: $.data.error_id
      - call: POST /procedure-bookings
        payload:
          operating_room_id: ${room1_id}
          chain_segment_id: ${seg1_id}
          surgeon_staff_id: ${surg2_id}
          booking_role: RECIPIENT_IMPLANT
          start_at: '2026-08-09T10:45:00Z'
          end_at: '2026-08-09T12:00:00Z'
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          book_b_id: $.data.id
      assert:
      - the 10:30 attempt returns HTTP 409 with error_id == ERR_OR_SLOT_CONFLICT (10:30 < 10:00 + 45min
        buffer), and no ProcedureBooking row is created
      - the 10:45 attempt returns HTTP 201 (10:45 is exactly end_at + buffer, and the rule is strict <)
      - ProcedureBooking.${book_b_id}.duration_minutes == 75 and status == ACTIVE
      - OperatingRoom.${room1_id}.reserved_minutes_total == 315 (240 + 75, incremented exactly once)
      - OperatingRoom.${room2_id}.reserved_minutes_total == 0 (the conflict was room-scoped, never program-scoped)
      - ProcedureBooking.${book_a_id}.status == ACTIVE and duration_minutes == 240 (untouched by the rejected
        attempt)
  - name: surgeon_closed_interval_touching_endpoint_collision
