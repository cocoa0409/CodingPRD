        grounds:
          - validations[priority=9]
          - calculations.limb_volume_ml
        distinguishing_aspect: "POST /evaluations with a single circumference point (len 1 < 2) hits the empty/insufficient-collection edge and returns ERR_INSUFFICIENT_MEASUREMENT — a collection-size boundary on a different endpoint than the numeric visit-cap edge."
