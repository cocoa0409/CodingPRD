  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rate_sheet_review_cycle_loop
        grounds:
          - state_machines.RateSheet.COMMITTEE_REVIEW_to_DRAFT
          - state_machines.RateSheet.APPROVED_to_COMMITTEE_REVIEW
          - state_machines.RateSheet.SCHEDULED_to_APPROVED
        distinguishing_aspect: |
          RateSheet is cyclic: DRAFT -> COMMITTEE_REVIEW -> DRAFT (return), then APPROVED ->
          COMMITTEE_REVIEW (recall), then SCHEDULED -> APPROVED (recall with deployment/notice
          cleanup); the entity loops back three times before terminal commitment.
        test_recipe:
          setup:
            - "P-RLP (SAVINGS, term 0, WHOLE_BALANCE, cap 500) exists; one sheet created in US-WEST (effective 2026-08-01, lead 7, floor 0, single tier [0,unbounded)@100)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "RLP", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_rlp: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_rlp}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 100, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_rlp: $.data.id } }
            - { call: "POST /rate-sheets/${s_rlp}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_rlp}/review-decision", payload: { decision: "RETURN", reason: "rework tiers" }, as: PricingCommittee, captures: { v_back_draft: $.data.version, st_back_draft: $.data.status } }
            - { call: "POST /rate-sheets/${s_rlp}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_rlp}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_rlp}/review-decision", payload: { decision: "RETURN", reason: "recall" }, as: PricingCommittee, captures: { v_back_review: $.data.version, st_back_review: $.data.status } }
            - { call: "POST /rate-sheets/${s_rlp}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_rlp}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_rlp}/review-decision", payload: { decision: "RETURN", reason: "pull from calendar" }, as: PricingCommittee, captures: { v_back_appr: $.data.version, st_back_appr: $.data.status } }
          trigger:
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_rlp}" }, as: ChannelOperator, captures: { dep_count_probe: $.data } }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_rlp}" }, as: ComplianceOfficer }
          assert:
            - "after first RETURN: status == DRAFT, version == 3"
            - "after second RETURN (recall from APPROVED): status == COMMITTEE_REVIEW, version == 6"
            - "after third RETURN (pull from SCHEDULED): status == APPROVED, version == 9"
            - "RETURN from SCHEDULED cleaned up: 0 RateDeployment rows and 0 DisclosureNotice rows remain for the sheet"

      - name: exception_return_resubmit_cycle
        grounds:
          - state_machines.ExceptionPricingRequest.UNDER_REVIEW_to_RETURNED
          - state_machines.ExceptionPricingRequest.RETURNED_to_UNDER_REVIEW
        distinguishing_aspect: |
          ExceptionPricingRequest is cyclic on a different entity: UNDER_REVIEW -> RETURNED ->
          UNDER_REVIEW via resubmit, with the baseline re-snapshotted and delta recomputed on each
          loop; segregation of duties still applies on every decision.
        test_recipe:
          setup:
            - "P-CD8 (CD, term 12, WHOLE_BALANCE, cap 900) with EFFECTIVE sheet in US-WEST, tiers [0,500000)@350, [500000,5000000)@425, [5000000,unbounded)@480 (effective 2026-08-15, lead 7, floor 0)"
            - "Account A8 with 5,000,000 cents (baseline snapshot = 480 bp)"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "CD8", product_class: "CD", term_months: 12, tier_application: "WHOLE_BALANCE", rate_cap_bp: 900, allows_promos: false, allows_exceptions: true }, as: OperationsAdmin, captures: { p_cd: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cd}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 500000, rate_bp: 350, projected_balance_cents: 1000000 }, { tier_index: 1, lower_bound_cents: 500000, upper_bound_cents: 5000000, rate_bp: 425, projected_balance_cents: 1000000 }, { tier_index: 2, lower_bound_cents: 5000000, upper_bound_cents: -1, rate_bp: 480, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_cd: $.data.id } }
            - { call: "POST /rate-sheets/${s_cd}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_cd}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_cd}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_cd}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_cd}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_cd}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "C8", product_id: "${p_cd}", market_code: "US-WEST", opening_balance_cents: 5000000, channel: "BRANCH" }, as: BranchBanker, captures: { a8: $.data.id } }
            - { call: "POST /exception-pricing-requests", payload: { account_id: "${a8}", sheet_id: "${s_cd}", requested_rate_bp: 500, term_days: 90 }, as: BranchBanker, as_user_id: "banker-1", captures: { x8: $.data.id, x8_delta: $.data.delta_bp, x8_tier: $.data.authority_tier } }
            - { call: "POST /exception-pricing-requests/${x8}/decision", payload: { decision: "RETURN" }, as: PricingCommittee, as_user_id: "committee-1" }
          trigger:
            - { call: "POST /exception-pricing-requests/${x8}/resubmit", payload: { requested_rate_bp: 505 }, as: BranchBanker, as_user_id: "banker-1", captures: { x8_delta2: $.data.delta_bp, x8_st: $.data.status } }
            - { call: "POST /exception-pricing-requests/${x8}/decision", payload: { decision: "APPROVE" }, as: BranchBanker, as_user_id: "banker-2", captures: { x8_final: $.data.status } }
          assert:
            - "create: baseline_rate_bp == 480 (balance exactly at 5,000,000 falls in tier 3), delta_bp == 20, authority_tier == BRANCH, status == UNDER_REVIEW"
            - "RETURN -> status RETURNED; resubmit -> status UNDER_REVIEW with delta_bp recomputed to 25 (505 - 480)"
            - "APPROVE by a different banker (banker-2 != submitter banker-1) -> APPROVED"
            - "the RETURNED -> UNDER_REVIEW loop is reachable repeatedly (cycle), unlike a linear approve/decline pipeline"

      - name: account_parallel_dimensions_independent
        grounds:
          - state_machines.DepositAccount
          - entities.DepositAccount.fields.lifecycle
          - entities.DepositAccount.fields.rate_source
        distinguishing_aspect: |
          DepositAccount carries two parallel dimensions: lifecycle (OPEN/FROZEN/CLOSED) and
          rate_source (SHEET/PROMO/EXCEPTION/GRANDFATHERED) evolve independently — freezing does
          not block the clock-driven PROMO -> SHEET rollover, and the account ends FROZEN + SHEET.
        test_recipe:
          setup:
            - "P-MMAP (MONEY_MARKET, term 0, MARGINAL, cap 600, allows_promos) with EFFECTIVE single-tier sheet [0,unbounded)@150 in US-WEST (effective 2026-08-15, lead 7, floor 0)"
            - "Offer PR1: rate 500, term 30 days, window [2026-08-15, 2026-09-30], ROLL_TO_SHEET, min 0 — published at 2026-08-15 and flipped ACTIVE by the 2026-08-16 clock sweep"
            - "Account AP with 1,000,000 cents enrolled into PR1 (PROMO), then FROZEN"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "MMAP", product_class: "MONEY_MARKET", term_months: 0, tier_application: "MARGINAL", rate_cap_bp: 600, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_mp: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_mp}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 150, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_mp: $.data.id } }
            - { call: "POST /rate-sheets/${s_mp}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_mp}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_mp}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_mp}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_mp}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_mp}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /promotional-offers", payload: { product_id: "${p_mp}", market_code: "US-WEST", promo_rate_bp: 500, promo_term_days: 30, enrollment_start: "2026-08-15", enrollment_end: "2026-09-30", min_opening_balance_cents: 0, rollover_treatment: "ROLL_TO_SHEET" }, as: PricingAnalyst, captures: { pr1: $.data.id } }
            - { call: "POST /promotional-offers/${pr1}/publish", payload: {}, as: PricingAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CP", product_id: "${p_mp}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "ONLINE" }, as: BranchBanker, captures: { ap: $.data.id } }
            - { call: "POST /deposit-accounts/${ap}/actions", payload: { action: "ENROLL_PROMO", promo_offer_id: "${pr1}" }, as: BranchBanker, captures: { ap_rs: $.data.rate_source } }
            - { call: "POST /deposit-accounts/${ap}/actions", payload: { action: "FREEZE" }, as: BranchBanker, captures: { ap_lc: $.data.lifecycle } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: OperationsAdmin }
            - { call: "GET /deposit-accounts/${ap}", payload: {}, as: BranchBanker, captures: { ap_lc2: $.data.lifecycle, ap_rs2: $.data.rate_source, ap_rate: $.data.current_rate_bp } }
          assert:
            - "after ENROLL_PROMO: rate_source == PROMO, current_rate_bp == 500"
