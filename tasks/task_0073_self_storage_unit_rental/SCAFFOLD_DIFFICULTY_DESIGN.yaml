              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { lease_id: "${lease_id}", coverage_tier: "BASIC", coverage_start: "2026-04-01T00:00:00Z" }
              as: FacilityManager
              captures: { p1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: FacilityManager
            - call: "DELETE /insurance-policies/${p1}"
              payload: {}
              as: FacilityManager
            - call: "POST /insurance-policies"
              payload: { lease_id: "${lease_id}", coverage_tier: "STANDARD", coverage_start: "2026-07-01T00:00:00Z" }
              as: FacilityManager
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /insurance-policies"
              payload: { lease_id: "${lease_id}", coverage_tier: "PREMIUM", coverage_start: "2026-06-15T00:00:00Z" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "P2 starting exactly at P1.coverage_end (2026-07-01) was accepted (half-open adjacency allowed)"
            - "The interior-overlapping policy create error_id == ERR_COVERAGE_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invariant_payment_reversal_conserves_lease_balance
        grounds:
          - state_machines.Invoice.OPEN_to_PAID
          - endpoints["POST /payments"]
          - endpoints["POST /payments/{payment_id}/reverse"]
          - entities.Lease.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = money (Lease.balance_cents). Forward PAYMENT then its compensating REVERSAL
          MUST restore balance to the exact pre-payment value: balance_after_reverse == balance_before_payment
          == 12000, with a PAYMENT then a REVERSAL LedgerEntry summing to net zero.
        test_recipe:
          setup:
            - "Climate lease activated 2026-04-01 with one invoice 12000 (balance 12000). Tenant pays 12000 (balance 0)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F17", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "A-17", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { unit_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t17@x.com", full_name: "T 17", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
            - call: "POST /payments"
              payload: { lease_id: "${lease_id}", amount_cents: 12000 }
              as: Tenant
              as_user_id: "${ten_id}"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: FacilityManager
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { bal_after: $.data.balance_cents }
            - call: "GET /leases/${lease_id}/ledger-balance"
              payload: {}
              as: FacilityManager
              captures: { replay_after: $.data.balance_cents }
          assert:
            - "Lease.${lease_id}.balance_cents == 12000 after reversal (restored to pre-payment value)"
            - "ledger replay == 12000 (CHARGE +12000, PAYMENT -12000, REVERSAL +12000)"
            - "Payment.${pay_id}.status == REVERSED"

      - name: invariant_transfer_conserves_occupied_unit_count
        grounds:
          - calculations.transfer_proration_adjustment
          - state_machines.TransferOrder.REQUESTED_to_COMPLETED
          - calculations.facility_occupied_unit_count
          - entities.Facility.fields.occupied_unit_count
        distinguishing_aspect: |
          Different conserved quantity = occupancy COUNT (Facility.occupied_unit_count), not money. A
          completed transfer vacates the old unit and occupies the new one, so occupied_unit_count is
          UNCHANGED (1 before, 1 after) even though unit_id and rate change.
        test_recipe:
          setup:
            - "ACTIVE lease on U1; U2 AVAILABLE in same facility; occupied_unit_count == 1; transfer order L1->U2 REQUESTED."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F18", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "U1", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: false }
              as: FacilityManager
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fac_id}", unit_number: "U2", size_class: "SIZE_10X20", monthly_rate_cents: 18000, climate_controlled: false }
              as: FacilityManager
              captures: { u2: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t18@x.com", full_name: "T 18", state_code: "TX" }
              as: FacilityManager
              captures: { ten_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u1}", tenant_id: "${ten_id}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { l1: $.data.id }
            - call: "POST /leases/${l1}/activate"
              payload: {}
              as: FacilityManager
              captures: { l1_v: $.data.version }
            - call: "POST /transfer-orders"
              payload: { lease_id: "${l1}", to_unit_id: "${u2}", expected_lease_version: "${l1_v}" }
              as: FacilityManager
              captures: { to_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-16T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /transfer-orders/${to_id}/complete"
              payload: {}
              as: FacilityManager
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: FacilityManager
              captures: { occ_after: $.data.occupied_unit_count }
            - call: "GET /units/${u1}"
              payload: {}
              as: FacilityManager
              captures: { u1_st: $.data.status }
            - call: "GET /units/${u2}"
              payload: {}
              as: FacilityManager
              captures: { u2_st: $.data.status }
          assert:
            - "Facility.${fac_id}.occupied_unit_count == 1 after the transfer (conserved; was 1 before)"
            - "Unit.${u1}.status == AVAILABLE and Unit.${u2}.status == OCCUPIED"
            - "Lease.${l1}.unit_id == ${u2} and monthly_rate_cents == 18000 (re-snapshotted)"
