              payload: { code: "HSA-GHOST", name: "Unauthenticated Area" }
              as: ProgramAdmin
              as_user_id: ""
              captures: { auth_error: $.data.error_id }
          assert:
            - "${auth_error} == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"
            - "the error_id is NOT ERR_INVALID_REQUEST even though population_projection is missing"
            - "no HealthServiceArea row exists: a later GET /batching-cycles by admin-1 shows an untouched empty database"

