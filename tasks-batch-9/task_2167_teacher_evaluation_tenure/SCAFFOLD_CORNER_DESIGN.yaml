      - name: cascading_side_effect_chain_depth_and_ordering
        claim_type: cascading_side_effects
        grounds: ["state_machines.Appeal.UNDER_REVIEW_to_REMANDED", "state_machines.Evaluator.CERTIFIED_to_SUSPENDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_remand_reverts_cycle_voids_plan_and_releases_tenure_hold
          rationale: "The depth-4 appeal chain and the depth-3 calibration chain are both asserted hop by hop in the two transitive_cascade instances."

      - name: dual_variant_calculation_layer_coverage
        claim_type: dual_variant_calculation
        grounds: ["calculations.cycle_composite_score", "calculations.evaluator_calibration_drift"]
        excluded_because:
          difficulty_instance: dual_variant_calc / composite_provisional_vs_final_diverge_on_same_cycle
          rationale: "Both declared dual-variant calculations are asserted with divergent literal outputs in the two dual_variant_calc instances."

