            - call: "POST /ig/jurisdictions"
              payload: { program_id: "${p}", code: "US-FED", name: "Federal" }
              as: PlatformAdmin
              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-INC", retention_months: 84, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
