      - name: income_pct_ami_is_rounded_before_the_low_income_threshold_comparison
        claim_type: precision
        grounds:
          - calculations.target_market_attribution.precision
          - calculations.target_market_attribution.formula
          - entities.Borrower.fields.income_pct_ami
        distinguishing_aspect: |
          The LOW_INCOME predicate compares the ROUNDED income_pct_ami against
          ami_threshold_pct, so 4,000,200 / 5,000,000 = 80.004% rounds to 80.00 and MATCHES a
          threshold of 80.00, while 4,000,500 / 5,000,000 = 80.01% does not. An implementation
          that compares the unrounded ratio rejects the first borrower.
