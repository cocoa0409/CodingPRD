            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${mm}" }
              as: StoreClerk
              captures: { s_m: $.data.id }
            - call: "POST /sales/${s_m}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
              captures: { ml: $.data.id }
            - call: "POST /sales/${s_m}/complete"
              payload: {}
              as: StoreClerk
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${nm}" }
              as: StoreClerk
              captures: { s_nm: $.data.id }
            - call: "POST /sales/${s_nm}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
              captures: { nml: $.data.id }
            - call: "POST /sales/${s_nm}/complete"
              payload: {}
              as: StoreClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
