  # ===========================================================================
  # No bulk endpoints are declared in §1.5, so the guide's `bulk_action` row has
  # no applicable instance for this scaffold.
  - section: endpoints
    instances:
      - name: belay_equipment_create_then_read_returns_the_same_row
        claim_type: standard_crud
        grounds:
          - endpoints["POST /challenge-course/belay-equipment"]
          - endpoints["GET /challenge-course/belay-equipment/{equipment_id}"]
        distinguishing_aspect: "The write and the read agree field for field: the GET returns the same serial number, kind, rigged element and IN_SERVICE status that the POST minted, with version still 1 because no second write occurred."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; one HIGH_ELEMENT to rig against."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Pamper Pole", element_type: "HIGH_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 27.0, max_participant_weight_kg: 113.0 }
              as: ProgramDirector
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/belay-equipment"
              payload: { course_id: "${course_id}", equipment_kind: "HARNESS", serial_number: "HN-001", manufactured_on: "2022-06-01", max_cycles: 30000, assigned_element_id: "${h_id}", first_use_on: "2024-08-10" }
              as: ProgramDirector
              captures: { eq_id: $.data.id }
            - call: "GET /challenge-course/belay-equipment/${eq_id}"
              payload: {}
              as: ProgramDirector
              captures: { read_serial: $.data.serial_number, read_status: $.data.status, read_version: $.data.version }
          assert:
            - "http_status == 200"
            - "${read_serial} == HN-001"
            - "${read_status} == IN_SERVICE"
            - "${read_version} == 1"
            - "BelayEquipment.${eq_id}.equipment_kind == HARNESS"
            - "BelayEquipment.${eq_id}.assigned_element_id == ${h_id}"
            - "BelayEquipment.${eq_id}.service_life_forecast_date == 2031-08-10"
            - "BelayEquipment.${eq_id}.retirement_forecast_date == 2031-08-10"
            - "Element.${h_id}.required_belay_set_count == 2"
            - "Element.${h_id}.belay_ready == false"

      - name: log_usage_stamps_first_use_and_increments_usage_cycles
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /challenge-course/belay-equipment/{equipment_id}/log-usage"]
          - calculations.equipment_retirement_forecast
        distinguishing_aspect: "Logging 100 cycles on stock created without a first_use_on stamps first_use_on to the clock date 2026-08-10, which pulls the forecast from the 2032-06-01 shelf date to the 2031-08-10 service date and flips retirement_basis from MANUFACTURE to SERVICE."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; one LEVEL_3 safety officer; one unused ROPE manufactured 2022-06-01 with no first_use_on."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Dana Reyes", staff_type: "SAFETY_OFFICER", certification_level: "LEVEL_3", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { so_id: $.data.id }
            - call: "POST /challenge-course/belay-equipment"
              payload: { course_id: "${course_id}", equipment_kind: "ROPE", serial_number: "RP-001", manufactured_on: "2022-06-01", max_cycles: 40000 }
              as: ProgramDirector
              captures: { eq_id: $.data.id, basis_before: $.data.retirement_basis }
          trigger:
            - call: "POST /challenge-course/belay-equipment/${eq_id}/log-usage"
              payload: { cycles: 100 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { basis_after: $.data.retirement_basis, cycles_after: $.data.usage_cycles }
          assert:
            - "http_status == 200"
            - "${basis_before} == MANUFACTURE"
            - "${basis_after} == SERVICE"
            - "${cycles_after} == 100"
            - "BelayEquipment.${eq_id}.first_use_on == 2026-08-10"
            - "BelayEquipment.${eq_id}.service_life_forecast_date == 2031-08-10"
            - "BelayEquipment.${eq_id}.mfg_life_forecast_date == 2032-06-01"
            - "BelayEquipment.${eq_id}.retirement_forecast_date == 2031-08-10"
            - "BelayEquipment.${eq_id}.status == IN_SERVICE"

      - name: block_assignment_links_facilitator_and_program_block
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /challenge-course/program-blocks/{program_block_id}/block-assignments"]
          - endpoints["GET /challenge-course/facilitators/{facilitator_id}/block-assignments"]
          - entities.BlockAssignment
        distinguishing_aspect: "The junction row is readable from the facilitator side as well as the block side, and it freezes rescue_current_at_assignment true at the moment of assignment while bumping the block's assigned_facilitator_count to 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; one ACTIVE staff facilitator; a PARTNER client; a DRAFT booking for 2026-09-15 with one icebreaker block."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Kim Alvarez", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { f1_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { b_id: $.data.id }
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 1, phase: "ICEBREAKER", planned_start_at: "2026-09-15T09:00:00Z", planned_end_at: "2026-09-15T09:45:00Z" }
              as: ProgramDirector
              captures: { blk1_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/program-blocks/${blk1_id}/block-assignments"
              payload: { facilitator_id: "${f1_id}", assignment_role: "LEAD" }
              as: ProgramDirector
              captures: { asg_id: $.data.id }
            - call: "GET /challenge-course/facilitators/${f1_id}/block-assignments"
              payload: { limit: 10, offset: 0 }
              as: ProgramDirector
          assert:
            - "http_status == 200"
            - "len(response.data) == 1"
            - "response.total_count == 1"
            - "BlockAssignment.${asg_id}.program_block_id == ${blk1_id}"
            - "BlockAssignment.${asg_id}.facilitator_id == ${f1_id}"
            - "BlockAssignment.${asg_id}.assignment_role == LEAD"
            - "BlockAssignment.${asg_id}.rescue_current_at_assignment == true"
            - "ProgramBlock.${blk1_id}.assigned_facilitator_count == 1"
            - "ProgramBlock.${blk1_id}.required_facilitator_count == 1"

      - name: facilitator_list_filtered_by_computed_cert_status_returns_only_active
        claim_type: computed_read
        grounds:
          - endpoints["GET /challenge-course/courses/{course_id}/facilitators"]
          - calculations.facilitator_cert_status
        distinguishing_aspect: "The cert_status filter is applied to the freshly derived value, not to a stored column: of two identically-configured facilitators, only the one holding a current rescue drill and 8 refresher hours is returned."
        test_recipe:
          setup:
