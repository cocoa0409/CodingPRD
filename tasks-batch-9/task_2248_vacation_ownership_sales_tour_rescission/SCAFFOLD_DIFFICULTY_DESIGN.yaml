              as: MarketingManager
              captures: { p1: $.data.id }
            - call: "GET /sales-representatives/${r1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { r1_v: $.data.version }
            - call: "POST /retraining-assignments"
              payload: { rep_id: "${r1}", trigger_reason: "DISCLOSURE_GAP", required_module_count: 2, expected_representative_version: "${r1_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { ra1: $.data.id }
          trigger:
            - call: "POST /retraining-assignments/${ra1}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
            - call: "POST /sales-galleries/${g1}/set-status"
              payload: { status: "CLOSED" }
              as: GalleryManager
            - call: "POST /sales-galleries/${g1}/set-status"
              payload: { status: "OPEN" }
              as: GalleryManager
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Marco Iyer", license_number: "FL-SL-410078", rotation_position: 2 }
              as: GalleryManager
              captures: { r2: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /retraining-assignments/${ra1}/close"
              payload: { outcome: "COMPLETE", modules_completed: 2 }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
          assert:
            - "before trigger 1: SalesGallery.${g1}.available_rep_count == 1 and status == OPEN"
            - "after trigger 1: ComplianceRetrainingAssignment.${ra1}.status == IN_PROGRESS and SalesRepresentative.${r1}.status == RETRAINING"
            - "after trigger 1: SalesGallery.${g1}.available_rep_count == 0 and status == RESTRICTED"
            - "trigger 2 returns 409 with error_id ERR_GALLERY_NOT_OPEN"
            - "after trigger 3: SalesGallery.${g1}.status == CLOSED"
            - "after trigger 4: SalesGallery.${g1}.status == RESTRICTED (NOT OPEN, because available_rep_count is still 0)"
            - "after trigger 5: SalesGallery.${g1}.available_rep_count == 1 and status == OPEN"
            - "trigger 6 returns 201 and TourBooking.${b1}.qualification_score == 80"
