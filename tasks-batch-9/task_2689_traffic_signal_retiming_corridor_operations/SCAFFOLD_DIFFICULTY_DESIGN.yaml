  # RULE 3 — non_linear_state_machine
  # =============================================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: timing_plan_ped_axis_waiver_advances_while_status_axis_stands_still
        grounds:
          - state_machines.TimingPlan.DRAFT_to_COORDINATED
          - state_machines.TimingPlan.COORDINATED_to_SUBMITTED
          - state_machines.TimingPlan.SUBMITTED_to_CERTIFIED
          - state_machines.PedestrianComplianceCheck.FAIL_to_WAIVED
          - entities.TimingPlan.fields.ped_compliance_state
          - entities.TimingPlan.fields.status
        distinguishing_aspect: |
          TimingPlan carries two orthogonal axes on one row: axis A `status` and axis B
          `ped_compliance_state`. The waiver moves axis B NON_COMPLIANT -> WAIVED while axis A stays
          frozen at COORDINATED, and the subsequent submit and certify move axis A twice while axis B
          stays frozen at WAIVED — neither axis is derivable from the other.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL, volume 20.0) SELECTED with the single READY member i1 (STD_3_5_FPS, aps_installed false, max_cycle_length_sec 150)."
            - "Project p1 in PLAN_DEVELOPMENT with a BEFORE count {1:350, 2:500, 4:250, 6:180} and one BEFORE travel-time run."
            - "Plan pl1 authored by eng-1, drafted cycle 90, splits {1:21 minG 10, 2:21 minG 15, 4:22 minG 12, 6:22 minG 10}; phase 4 is the pedestrian phase with crosswalk 62.0 ft and ped_clear_sec 17.7 (one tenth BELOW the required 17.8)."
            - "Coordinate has already run, so pl1 is COORDINATED with ped_compliance_state NON_COMPLIANT and one FAIL PedestrianComplianceCheck on phase 4."
