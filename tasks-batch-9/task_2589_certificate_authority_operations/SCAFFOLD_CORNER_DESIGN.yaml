      - name: csr_key_minimum_is_read_from_the_profile_validation_type
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=79]
          - errors[ERR_CSR_KEY_TOO_WEAK]
          - entities.CertificateRequest.fields.csr_key_bits
          - calculations.issuance_charge_settlement.constants.VALIDATION_MULTIPLIER
        distinguishing_aspect: "2048 is a legal csr_key_bits enum member and is accepted on DV/OV profiles, but on an EV profile it violates the 3072 minimum and returns HTTP 422 ERR_CSR_KEY_TOO_WEAK, while the sibling 3072 request on the same EV profile clears and is priced at 45000 (EV multiplier 2.5 on base 20000, then the 0.10 volume band)."
        test_recipe:
          setup:
            - "One ACTIVE EV profile, one subscriber with an APPROVED EV vetting, one validated authorization and two SUBMITTED requests differing only in csr_key_bits (2048 and 3072)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
