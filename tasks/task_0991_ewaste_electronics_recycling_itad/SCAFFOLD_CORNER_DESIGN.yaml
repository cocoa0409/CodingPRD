# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: account_create_defaults
        claim_type: defaults
        grounds: [entities.BusinessAccount.fields.tier, entities.BusinessAccount.fields.status]
        distinguishing_aspect: "Omitting tier at account creation applies default STANDARD; status initializes ACTIVE; computed balances start at zero."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Default Co", contact_email: "d@default.example" }, as: PlatformAdmin, captures: { acct: $.data.id, a_tier: $.data.tier, a_status: $.data.status, a_bal: $.data.credit_balance_cents, a_div: $.data.lifetime_diverted_kg } }
          trigger: []
          assert:
            - "a_tier == STANDARD (default applied)"
            - "a_status == ACTIVE and a_bal == 0 and a_div == 0.0"

      - name: account_create_missing_required_company_name
        claim_type: required_fields
        grounds: [entities.BusinessAccount.fields.company_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /itad/accounts without company_name is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /itad/accounts", payload: { contact_email: "no-name@x.example" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status 400"

      - name: not_found_sweep
        claim_type: not_found
        grounds: ["errors[ERR_ACCOUNT_NOT_FOUND]", "errors[ERR_RECYCLER_NOT_FOUND]", "errors[ERR_MANIFEST_NOT_FOUND]", "errors[ERR_ITEM_NOT_FOUND]", "errors[ERR_BATCH_NOT_FOUND]", "errors[ERR_SETTLEMENT_NOT_FOUND]", "errors[ERR_LISTING_NOT_FOUND]", "errors[ERR_SANITIZATION_NOT_FOUND]", "errors[ERR_CERTIFICATE_NOT_FOUND]"]
        distinguishing_aspect: "Every resource family returns its domain-specific 404 error for a non-existent UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /itad/accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /itad/recyclers/00000000-0000-0000-0000-000000000000", payload: {}, as: ComplianceOfficer, captures: { e2: $.data.error_id } }
            - { call: "GET /itad/manifests/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /itad/items/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e4: $.data.error_id } }
            - { call: "GET /itad/recycle-batches/00000000-0000-0000-0000-000000000000", payload: {}, as: LogisticsCoordinator, captures: { e5: $.data.error_id } }
            - { call: "GET /itad/settlements/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { e6: $.data.error_id } }
            - { call: "POST /itad/listings/00000000-0000-0000-0000-000000000000/sell", payload: { sale_price_cents: 100 }, as: IntakeOperator, captures: { e7: $.data.error_id } }
            - { call: "POST /itad/sanitizations/00000000-0000-0000-0000-000000000000/verify", payload: { verdict: "APPROVE" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { e8: $.data.error_id } }
            - { call: "POST /itad/certificates/00000000-0000-0000-0000-000000000000/void", payload: {}, as: ComplianceOfficer, captures: { e9: $.data.error_id } }
          assert:
            - "e1 == ERR_ACCOUNT_NOT_FOUND, e2 == ERR_RECYCLER_NOT_FOUND, e3 == ERR_MANIFEST_NOT_FOUND"
            - "e4 == ERR_ITEM_NOT_FOUND, e5 == ERR_BATCH_NOT_FOUND, e6 == ERR_SETTLEMENT_NOT_FOUND"
            - "e7 == ERR_LISTING_NOT_FOUND, e8 == ERR_SANITIZATION_NOT_FOUND, e9 == ERR_CERTIFICATE_NOT_FOUND; all HTTP 404"

      - name: item_create_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds: [entities.Item.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An item with category WIDGET (not one of the 8 declared categories) is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["account; clock 2026-05-01; manifest SCHEDULED then RECEIVED (declared 1)"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Enum Co", contact_email: "e@enum.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
          trigger:
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-E1", category: "WIDGET", weight_kg: 1.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (invalid enum member)"

      - name: item_weight_must_be_positive_rejected
        claim_type: type_constraints
        grounds: [entities.Item.fields.weight_kg, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "weight_kg == 0 violates the > 0 constraint and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["account; manifest RECEIVED (declared 1)"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "W0 Co", contact_email: "w0@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
          trigger:
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-W0", category: "PHONE", weight_kg: 0, data_bearing: false, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (weight_kg must be > 0)"

      - name: account_create_extra_id_input_ignored
        claim_type: system_fields
        grounds: [entities.BusinessAccount]
        distinguishing_aspect: "A client-supplied id field is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Id Co", contact_email: "id@x.example", id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" }, as: PlatformAdmin, captures: { srv_id: $.data.id } }
          trigger: []
          assert:
            - "response id is a server-minted UUID and != 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa' (client id input ignored)"

      - name: duplicate_serial_within_manifest_rejected
        claim_type: type_constraints
        grounds: [entities.Item.fields.serial_number, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "serial_number is unique within a manifest; a second item with the same serial in the same manifest is rejected."
        test_recipe:
          setup: ["account; clock 2026-05-01; manifest RECEIVED (declared 2) with one item SN-DUP already scanned"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Dup Co", contact_email: "dup@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 2 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-DUP", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator }
          trigger:
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-DUP", category: "PHONE", weight_kg: 0.3, data_bearing: false, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (serial_number unique within manifest)"

      - name: manifest_counts_computed
        claim_type: computed_fields
        grounds: [entities.Manifest.fields.received_item_count, entities.Manifest.fields.discrepancy_flag]
        distinguishing_aspect: "received_item_count and discrepancy_flag are server-computed; after scanning 2 items into a declared-2 manifest they read 2 and false."
        test_recipe:
          setup: ["account; clock 2026-05-01; manifest RECEIVED (declared 2); two items scanned"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Cnt Co", contact_email: "cnt@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 2 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-N1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-N2", category: "PHONE", weight_kg: 0.3, data_bearing: false, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator }
          trigger:
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_cnt: $.data.received_item_count, m_disc: $.data.discrepancy_flag } }
          assert:
            - "Manifest.${m}.received_item_count == 2 and discrepancy_flag == false"

  - section: state_machines
    instances:
      - name: manifest_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Manifest]
        distinguishing_aspect: "A newly created manifest starts in DRAFT with received_item_count 0."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Init Co", contact_email: "init@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m_status: $.data.status, m_cnt: $.data.received_item_count } }
          trigger: []
          assert:
            - "new manifest status == DRAFT and received_item_count == 0"

      - name: manifest_happy_path_draft_to_closed
        claim_type: valid_transition
        grounds: [state_machines.Manifest, state_machines.Settlement]
        distinguishing_aspect: "The full lifecycle DRAFT -> SCHEDULED -> RECEIVED -> RECONCILED -> CLOSED is reachable, with the settlement PAID before close."
        test_recipe:
          setup: ["account; clock 2026-05-01; DROPOFF manifest declared 1; one non-data LAPTOP grade A sold at 60000; reconciled; quote; finalized; paid"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Happy Co", contact_email: "h@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-H1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 60000, floor_price_cents: 50000, channel: "RETAIL" }, as: IntakeOperator, captures: { l1: $.data.id } }
            - { call: "POST /itad/listings/${l1}/sell", payload: { sale_price_cents: 60000 }, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/reconcile", payload: {}, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { s: $.data.id } }
            - { call: "POST /itad/settlements/${s}/finalize", payload: {}, as: PlatformAdmin }
            - { call: "POST /itad/settlements/${s}/pay", payload: {}, as: PlatformAdmin, captures: { s_status: $.data.status } }
          trigger:
            - { call: "POST /itad/manifests/${m}/close", payload: {}, as: AccountManager, as_user_id: "${acct}", captures: { m_status: $.data.status } }
          assert:
            - "settlement reached PAID and manifest close succeeds: Manifest.${m}.status == CLOSED"
            - "Item.${i1}.processing_status == COMPLETE (SOLD -> COMPLETE at finalize)"

      - name: cancel_closed_manifest_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Manifest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: cancel on a CLOSED manifest is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["full happy path completed: manifest CLOSED (same chain as manifest_happy_path_draft_to_closed)"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Lock Co", contact_email: "lock@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-LK1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 60000, floor_price_cents: 50000, channel: "RETAIL" }, as: IntakeOperator, captures: { l1: $.data.id } }
            - { call: "POST /itad/listings/${l1}/sell", payload: { sale_price_cents: 60000 }, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/reconcile", payload: {}, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { s: $.data.id } }
            - { call: "POST /itad/settlements/${s}/finalize", payload: {}, as: PlatformAdmin }
            - { call: "POST /itad/settlements/${s}/pay", payload: {}, as: PlatformAdmin }
            - { call: "POST /itad/manifests/${m}/close", payload: {}, as: AccountManager, as_user_id: "${acct}" }
          trigger:
            - { call: "POST /itad/manifests/${m}/cancel", payload: {}, as: AccountManager, as_user_id: "${acct}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (terminal lockdown on CLOSED)"

      - name: ship_processed_batch_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RecycleBatch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PROCESSED is terminal for a batch: a second ship attempt is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["account; clock 2026-05-01; recycler; manifest RECEIVED with one RECYCLE item; batch containing it already shipped, delivered, and PROCESSED"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Term Co", contact_email: "t@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/recyclers", payload: { name: "RecT", certification_standard: "R2", certification_expires_at: "2027-05-01T00:00:00Z", accepted_categories: ["OTHER"], daily_intake_capacity_kg: 1000, violation_count: 0 }, as: ComplianceOfficer, captures: { rec: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-T1", category: "OTHER", weight_kg: 3.0, data_bearing: false, hazmat_flag: false, declared_grade: "D" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RECYCLE" }, as: IntakeOperator }
            - { call: "POST /itad/recycle-batches", payload: { recycler_id: "${rec}", scheduled_delivery_date: "2026-06-10T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /itad/recycle-batches/${b1}/items", payload: { item_id: "${i1}" }, as: LogisticsCoordinator }
            - { call: "POST /itad/recycle-batches/${b1}/ship", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/recycle-batches/${b1}/deliver", payload: {}, as: ComplianceOfficer }
            - { call: "POST /itad/recycle-batches/${b1}/process", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /itad/recycle-batches/${b1}/ship", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (PROCESSED is terminal)"

      - name: verify_already_verified_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.DataSanitization, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A VERIFIED sanitization record is terminal: a second verify is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["policy ACTIVE; manifest RECEIVED; data-bearing item triaged REFURB; sanitization logged PASS and already VERIFIED"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Ver Co", contact_email: "v@ver.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["CRYPTO_ERASE", "NIST_CLEAR", "NIST_PURGE", "PHYSICAL_DESTROY"], export_allowed: true, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-VV1", category: "LAPTOP", weight_kg: 2.0, data_bearing: true, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "REFURB" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i1}/sanitizations", payload: { method: "NIST_CLEAR", outcome: "PASS" }, as: DestructionTechnician, as_user_id: "tech-1", captures: { s1: $.data.id } }
            - { call: "POST /itad/sanitizations/${s1}/verify", payload: { verdict: "APPROVE" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /itad/sanitizations/${s1}/verify", payload: { verdict: "APPROVE" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (VERIFIED is terminal for the record)"

      - name: sanitize_fail_keeps_data_pending
        claim_type: side_effect_execution
        grounds: [state_machines.Item, entities.Item.fields.data_status]
        distinguishing_aspect: "Logging an attempt with outcome FAIL creates a LOGGED record but leaves Item.data_status == PENDING (no SANITIZED on failure)."
        test_recipe:
          setup: ["policy ACTIVE; manifest RECEIVED; data-bearing item triaged REFURB"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Fail Co", contact_email: "f@fail.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
