scaffold_corner_design:
- section: entities
  instances:
  - name: cdi_program_creation_stores_all_input_fields
    claim_type: creation
    grounds:
    - entities.CDIProgram
    - endpoints[POST /api/cdi-programs]
    distinguishing_aspect: POST with all required fields returns 201 and the response body contains the supplied facility_name, program_code, baseline_cmi.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: Metro
          program_code: M1
          baseline_cmi: 1.2345
        as: CDIManager
        captures:
          prog: $.data.id
      trigger:
      - call: GET /api/cdi-programs/${prog}
        payload: {}
        as: CDIManager
      assert:
      - CDIProgram.${prog}.facility_name == 'Metro'
      - CDIProgram.${prog}.program_code == 'M1'
      - CDIProgram.${prog}.baseline_cmi == 1.2345
      - CDIProgram.${prog}.status == ACTIVE
      - CDIProgram.${prog}.current_period_index == 0
  - name: patient_case_creation_applies_system_defaults
    claim_type: defaults
    grounds:
    - entities.PatientCase.fields.working_soi
    - entities.PatientCase.fields.working_rom
    - entities.PatientCase.fields.status
    distinguishing_aspect: New case starts with working_soi=1, working_rom=1, working_drg_* mirrored from initial_*, status=OPEN, reconciliation_status=NOT_REQUIRED.
    test_recipe:
      setup:
      - program, provider
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      trigger:
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: DRG-A
          initial_drg_weight: 1.2345
        as: HIMCoder
        captures:
          case: $.data.id
      assert:
      - PatientCase.${case}.working_soi == 1
      - PatientCase.${case}.working_rom == 1
      - PatientCase.${case}.working_drg_code == 'DRG-A'
      - PatientCase.${case}.working_drg_weight == 1.2345
      - PatientCase.${case}.status == OPEN
      - PatientCase.${case}.reconciliation_status == NOT_REQUIRED
  - name: provider_education_score_is_computed_not_input
    claim_type: computed_field
    grounds:
    - entities.Provider.fields.education_score
    distinguishing_aspect: education_score is computed (starts 100); any client-supplied value is ignored.
    test_recipe:
      setup:
      - program
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      trigger:
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      assert:
      - Provider.${prov}.education_score == 100
      - Provider.${prov}.education_flag == NONE
  - name: patient_case_get_not_found
    claim_type: not_found
    grounds:
    - endpoints[GET /api/cdi-programs/{programId}/patient-cases/{caseId}]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET on a non-existent case id returns ERR_NOT_FOUND 404.
    test_recipe:
      setup:
      - program
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      trigger:
      - call: GET /api/patient-cases/00000000-0000-0000-0000-000000000000
        payload: {}
        as: CDIManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND
  - name: patient_case_missing_mrn_returns_invalid_request
    claim_type: required_field
    grounds:
    - entities.PatientCase.fields.mrn
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /patient-cases missing required mrn is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - program, provider
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      trigger:
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST
  - name: denial_target_invalid_window_returns_invalid_request
    claim_type: type_constraint
    grounds:
    - entities.DenialRiskTarget.fields.active_to_period
    - validations[priority=17]
    distinguishing_aspect: active_to_period < active_from_period is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - program
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      trigger:
      - call: POST /api/denial-risk-targets
        payload:
          cdi_program_id: ${prog}
          drg_code: A
          required_evidence_tags:
          - t
          severity_floor: 1
          active_from_period: 5
          active_to_period: 4
        as: CDIManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST
- section: state_machines
  instances:
  - name: cdi_program_close_from_closed_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.CDIProgram
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: CLOSED is terminal; POST /close on CLOSED program is rejected.
    test_recipe:
      setup:
      - program with no cases, closed
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/cdi-programs/${prog}/close
        payload: {}
        as: CDIManager
      trigger:
      - call: POST /api/cdi-programs/${prog}/close
        payload: {}
        as: CDIManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE
  - name: cdi_program_suspend_blocks_patient_case_create
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=4]
    - errors[ERR_PROGRAM_NOT_ACTIVE]
    distinguishing_aspect: While SUSPENDED, writes under the program are rejected with ERR_PROGRAM_NOT_ACTIVE.
    test_recipe:
      setup:
      - program suspended; provider registered
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/cdi-programs/${prog}/suspend
        payload: {}
        as: CDIManager
      trigger:
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_PROGRAM_NOT_ACTIVE
  - name: cdi_program_close_blocked_by_open_case
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=16]
    - errors[ERR_OPEN_CASES_REMAIN]
    distinguishing_aspect: Program close with any case in OPEN/UNDER_REVIEW/RECONCILED is rejected.
    test_recipe:
      setup:
      - program with one OPEN case
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
      trigger:
      - call: POST /api/cdi-programs/${prog}/close
        payload: {}
        as: CDIManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_OPEN_CASES_REMAIN
  - name: cdi_review_close_blocked_by_draft_query
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=9]
    - errors[ERR_UNRESOLVED_QUERY_EXISTS]
    distinguishing_aspect: Review cannot close while a query is in DRAFT.
    test_recipe:
      setup:
      - ACTIVE review with DRAFT query
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 1
          escalation_stage_periods: 1
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
          rev_v: $.data.version
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
          proposed_drg_weight: 2.0
          proposed_soi: 2
          proposed_rom: 2
        as: CDISpecialist
      - call: GET /api/cdi-reviews/${rev}
        payload: {}
        as: CDISpecialist
        captures:
          rev_v_now: $.data.version
      trigger:
      - call: POST /api/cdi-reviews/${rev}/close
        payload:
          closed_reason: NO_OPPORTUNITY
          expected_review_version: ${rev_v_now}
        as: CDISpecialist
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNRESOLVED_QUERY_EXISTS
  - name: cdi_query_response_on_responded_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.CDIQuery
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Query in RESPONDED terminal state rejects a second response.
    test_recipe:
      setup:
      - SENT query, one AGREE response recorded
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 5
          escalation_stage_periods: 5
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 10
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
          proposed_drg_weight: 2.0
          proposed_soi: 2
          proposed_rom: 2
        as: CDISpecialist
        captures:
          q: $.data.id
          q_ver: $.data.version
      - call: POST /api/cdi-queries/${q}/send
        payload:
          expected_query_version: ${q_ver}
        as: CDISpecialist
      - call: POST /api/cdi-queries/${q}/responses
        payload:
          response_type: AGREE
          response_text: ok
        as: Provider
        as_user_id: ${prov}
      trigger:
      - call: POST /api/cdi-queries/${q}/responses
        payload:
          response_type: DISAGREE
          response_text: second
        as: Provider
        as_user_id: ${prov}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE
  - name: patient_case_finalize_blocked_while_review_open
    claim_type: precondition_enforcement
    grounds:
    - errors[ERR_OPEN_REVIEW_EXISTS]
    - state_machines.PatientCase.OPEN_to_FINAL_CODED
    distinguishing_aspect: Cannot finalize a case while any review is in {DRAFT, ACTIVE, ON_HOLD}.
    test_recipe:
      setup:
      - case past discharge, ACTIVE review
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 2
        as: CDIManager
      - call: GET /api/patient-cases/${case}
        payload: {}
        as: HIMCoder
        captures:
          cv: $.data.version
      trigger:
      - call: POST /api/patient-cases/${case}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 1.0
          expected_case_version: ${cv}
        as: HIMCoder
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_OPEN_REVIEW_EXISTS
  - name: patient_case_finalize_before_discharge_returns_case_not_discharged
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=10]
    - errors[ERR_CASE_NOT_DISCHARGED]
    distinguishing_aspect: current_period_index < discharge_period -> ERR_CASE_NOT_DISCHARGED.
    test_recipe:
      setup:
      - case with discharge=10, clock still at 0
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 10
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
          cv: $.data.version
      trigger:
      - call: POST /api/patient-cases/${case}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 1.0
          expected_case_version: ${cv}
        as: HIMCoder
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_CASE_NOT_DISCHARGED
- section: calculations
  instances:
  - name: non_leading_lint_catches_answer_in_question
    claim_type: correct_result
    grounds:
    - calculations.non_leading_lint
    distinguishing_aspect: Query containing the proposed DRG code as a literal token fails lint with ANSWER_IN_QUESTION finding and the transition is rejected with ERR_LEADING_LANGUAGE.
    test_recipe:
      setup:
      - ACTIVE review, DRAFT query whose text contains the proposed_drg_code literal
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 1
          escalation_stage_periods: 1
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 5
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
