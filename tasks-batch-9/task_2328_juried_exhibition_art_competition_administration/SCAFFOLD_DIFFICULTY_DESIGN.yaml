          Entity pair Artwork -> Exhibition: two WAITLISTED artworks in identical state get opposite
          outcomes purely from the parent Exhibition's status — promotion succeeds while the
          exhibition is RESULTS_PUBLISHED and is refused with ERR_EXHIBITION_PHASE_INVALID once the
          exhibition reaches ON_VIEW, with acceptance capacity deliberately left unfilled (3 of 5) so
