            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cbn_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cbn_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${cbn_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin, captures: { cert_v: $.data.version } }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /program/certifications/${cert_id}/renew", payload: { expected_certification_version: "${cert_v}" }, as: Contractor, as_user_id: "${cbn_id}", captures: { vu: $.data.valid_until, st: $.data.status } }
          assert:
            - "renew succeeds (200): credits still count on the inclusive boundary date"
            - "valid_until == 2030-09-01 (prior valid_until 2028-09-01 + 24 months)"

