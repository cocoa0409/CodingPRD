              captures: { tier_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              captures: { eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              as_user_id: "user-dual-1"
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { counter_fee_cents: 400000, counter_artist_share_pct: 0.15 }
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ProgrammingDirector
              as_user_id: "user-dual-1"
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              captures: { eng_v1: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              as_user_id: "user-dual-1"
              payload: { expected_engagement_version: "${eng_v1}" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
            - call: "POST /engagements/${engagement_id}/confirm"
              as: ProgrammingDirector
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-10-12T00:00:00Z" }
            - call: "POST /engagements/${engagement_id}/settlements"
              as: FinanceController
              as_user_id: "user-fc-2"
              captures: { settlement_id: "$.data.id" }
            - call: "POST /settlements/${settlement_id}/reconcile-expenses"
              as: FinanceController
              as_user_id: "user-fc-2"
              payload: { actual_marketing_cents: 0 }
          trigger:
            - call: "POST /settlements/${settlement_id}/finalize"
              as: FinanceController
              as_user_id: "user-dual-1"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /settlements/${settlement_id}/finalize"
              as: FinanceController
              as_user_id: "user-fc-2"
            - call: "GET /artists/${artist_id}"
              as: FinanceController
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
          assert:
            - "Finalize by 'user-dual-1', the same identity that accepted the counter: 403 ERR_SEGREGATION_OF_DUTIES, even though the role is FinanceController and the settlement is EXPENSES_RECONCILED."
            - "The refused attempt changed nothing: the settlement is still 'EXPENSES_RECONCILED' with finalized_by_user_id null, and the engagement is still 'PERFORMED'."
            - "Finalize by 'user-fc-2': 200 with status 'FINALIZED', finalized_by_user_id 'user-fc-2', and engagement.lifecycle_status 'SETTLED'."
            - "Artist.lifetime_guarantee_paid_cents == 400000 - the guarantee reached the artist ledger exactly once, on the successful finalization."
            - "engagement.realized_margin_cents == -400000 (0 realized gross minus the 400000 guarantee, with zero share, labor, equipment and marketing) - the loss is booked rather than clamped."
            - "Reading the same identity in the opposite direction is allowed: 'user-dual-1' assessed the risk earlier in the chain without objection, so the block is specific to the accept/finalize pair named in priority 28."

  # ===========================================================================
  # CROSS-CUTTING LAYERS (§1.0 complexity_layers + §1.2.1 concurrency rules)
  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: opening_a_negotiation_round_with_a_stale_engagement_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - "§1.2.1 rule negotiation-round-open-stale-engagement: write_endpoint POST /engagements/{id}/fee-negotiations, occ_field expected_engagement_version, error ERR_STALE_ENGAGEMENT_VERSION, 412."
          - "§1.5 POST /engagements/{id}/assess-risk increments Engagement.version by 1."
        distinguishing_aspect: >-
          The engagement's version is advanced by a DIFFERENT actor's write (a
          risk assessment) between the client's read and its write, which is the
          exact race the rule exists for: a new round supersedes the standing one,
          so a stale writer would silently discard a round it never saw. Retrying
          with the fresh version then succeeds, proving the 412 is about staleness
          rather than a permanently rejected payload.
        test_recipe:
          setup:
            - "Grand Hall, artist 'Cadence Quartet' (guarantee_floor_cents 200000) and a DRAFT PRESENTED engagement (performance 2026-10-11) exist; the client read the engagement at version 1."
            - "A FinanceController then assessed risk with the correct expected_engagement_version, which advanced the engagement to version 2 (no tiers exist, so projected_gross is 0, exposure 0, lead 71 days -> 0.0816667, sell-through -> 0.02, score round_half_up(10.17) = 10 -> LOW -> CLEARED)."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v0}" }
              captures: { eng_v1: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v1}" }
              captures: { neg_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
            - call: "GET /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { limit: 10, offset: 0 }
          assert:
            - "Write with the pre-assessment version ${eng_v0}: 412 ERR_STALE_ENGAGEMENT_VERSION, and negotiation_round_count is still 0."
            - "Retry with ${eng_v1} (= ${eng_v0} + 1): 201 with round_index 1 and status 'OFFERED'."
            - "The engagement's version is now ${eng_v1} + 1: the successful round incremented it, the rejected one did not."
            - "The negotiation listing reports meta.total_count == 1 - a 412 must not leave a phantom round behind."
            - "financial_clearance is still 'CLEARED' with risk_score 10: the 412 path performed no partial work."

      - name: reassessing_risk_with_a_stale_engagement_version_is_rejected_with_412
        claim_type: optimistic_concurrency
        grounds:
          - "§1.2.1 rule risk-assessment-stale-engagement: write_endpoint POST /engagements/{id}/assess-risk, occ_field expected_engagement_version, error ERR_STALE_ENGAGEMENT_VERSION, 412."
          - "§1.5 POST /engagements/{id}/fee-negotiations increments Engagement.version by 1."
        distinguishing_aspect: >-
          The mirror image of the first rule, and the more consequential one: a
          stale reassessment would overwrite a clearance decision derived from
          inputs the writer never observed. The interleaving write is a new fee
          offer, which is exactly the input the score depends on, so a
          version-blind implementation would compute the clearance from the fee it
          remembers instead of the fee on the record.
        test_recipe:
          setup:
            - "Grand Hall, artist 'Cadence Quartet' (guarantee_floor_cents 200000) and a DRAFT PRESENTED engagement (performance 2026-10-11) exist; the FinanceController read it at version 1."
            - "A ProgrammingDirector then opened round 1 at 300000 / 0.10 with the correct expected_engagement_version, advancing the engagement to version 2 while the controller still holds version 1."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              captures: { eng_v1: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v0}" }
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v1}" }
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
          assert:
            - "Assessment with the pre-negotiation version ${eng_v0}: 412 ERR_STALE_ENGAGEMENT_VERSION, and financial_clearance is still 'UNASSESSED' with risk_score null."
            - "Retry with ${eng_v1}: 200 with risk_score 55, risk_tier 'HIGH' and financial_clearance 'ESCALATED'. The standing 300000 offer of the OFFERED round is the fee basis and projected_gross_cents is 0 (no tiers), so exposure = min(1, 300000/max(1, 0)) = 1 -> 0.45, plus routing slack 0, lead 0.0816667 and sell-through 0.02, giving round_half_up(55.17) = 55."
            - "The score is the discriminator: an implementation that had let the stale request through would have scored the engagement with no offer on the record at all (10 -> LOW -> CLEARED), so the clearance decision would have been the opposite one."
            - "The engagement's version is ${eng_v1} + 1 after the successful assessment and was NOT touched by the rejected one."

      - name: cancellation_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: engagement_cancel_reverse_cascade_to_deposit_and_client_balance
          rationale: >-
            §1.8's transitive_cascade instance already walks all ten numbered
            CANCEL CASCADE steps in order and asserts the reverse effects
            (labor calls cancelled, equipment released, tickets refunded,
            subsidies refunded, tiers closed, deposit and client balance
            adjusted), including that terminal children are left alone.

      - name: finalization_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: settlement_finalize_forward_cascade_into_reserve_and_artist_ledger
          rationale: >-
            The forward chain settlement -> engagement -> labor calls -> reserve
            ledger -> artist or client ledger, with its ordering sensitivity, is
            the explicit subject of that §1.8 instance.

      - name: both_calculation_variants_are_exercised
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: labor_call_estimate_vs_actual_meal_penalty_divergence
          rationale: >-
            The dual_variant_calculation layer is carried by the two §1.8
            dual_variant_calc instances (labor ESTIMATE vs ACTUAL and engagement
            margin PROJECTED vs REALIZED), each of which asserts both variants and
            the delta between them.

      - name: rate_and_threshold_triggers_fire_at_their_boundaries
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: dynamic_ticket_price_at_exact_mid_band_ratio
          rationale: >-
            The instantaneous sell-through threshold is asserted there and the
            high band plus ceiling clamp is asserted in the §1.9 calculations
            instance dynamic_ticket_price_in_the_high_band_is_clamped_by_the_tier_ceiling,
            so a separate layer-level instance would only duplicate them.

  # ===========================================================================
  # CONSISTENCY MODEL (§1.0 consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_visible_in_the_same_response_that_changed_it
        claim_type: immediate
        grounds:
          - "§1.0 consistency_model: immediate - all changes are visible in the same request's response."
          - "§1.5 POST /engagements/{id}/assess-risk returns the Engagement with risk_score, risk_tier, projected_gross_cents, projected_margin_cents, financial_clearance and the incremented version."
        distinguishing_aspect: >-
          A single write whose response carries five derived fields at once is
          compared field-by-field with an immediately following read, so an
          implementation that recomputes derived values lazily on read (or returns
          the pre-write snapshot) diverges on the write response rather than on the
          read. The tier added just before the assessment guarantees the projected
          figures are non-trivial.
        test_recipe:
          setup:
            - "Grand Hall, artist 'Cadence Quartet' (historical_sell_through_pct 0.8) and a DRAFT PRESENTED engagement (performance 2026-10-11) exist."
            - "One ACTIVE tier ORCH (100 seats at 10000, dynamic pricing disabled) was added, which advanced ticketing_status to TIERS_DRAFT without touching Engagement.version."
            - "Round 1 was opened at 300000 / 0.10 and accepted by the artist's representative, so negotiated_fee_cents is 300000."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 100, base_price_cents: 10000, price_ceiling_cents: 12000, dynamic_pricing_enabled: false, subscription_eligible: false }
              captures: { tier_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              captures: { eng_v1: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v1}" }
              captures: { score_in_write: "$.data.risk_score", clearance_in_write: "$.data.financial_clearance", version_in_write: "$.data.version" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
            - call: "GET /price-tiers/${tier_id}"
              as: BoxOfficeManager
          assert:
            - "The assess-risk RESPONSE itself already carries risk_score 27, risk_tier 'LOW', financial_clearance 'CLEARED', projected_gross_cents 800000 and projected_margin_cents 250000 - nothing is deferred to a later read."
            - "version_in_write == ${eng_v1} + 1: the increment is visible in the same response that caused it."
            - "The immediately following GET returns byte-identical values for all five derived fields and the same version - no lag, no re-derivation drift."
            - "The tier read shows the sell-through inputs unchanged (seats_allocated 100, sold_qty 0, available_qty 100): the projection consumed them without mutating them."
            - "The accept step earlier in the chain behaved the same way: its response carried the engagement's new negotiated_fee_cents, which is why the assessment can be issued without an intervening read."
