              captures: { d1_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Ewan Tolbert", hourly_rate_cents: 2300, max_weekly_events: 5 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { d2_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 2, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e1_id: "$.data.id" }
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${e1_id}/transitions"
