      - name: wellness_duplicate_year_blocked_but_denied_resubmission_allowed
        claim_type: violation_to_error
        grounds: [state_machines.WellnessBenefit.SUBMITTED_to_APPROVED, "errors[ERR_WELLNESS_DUPLICATE_YEAR]"]
        distinguishing_aspect: "Two SUBMITTED wellness benefits for the same policy+calendar_year: the first approves; the second fails ERR_WELLNESS_DUPLICATE_YEAR. But a DENIED wellness row does NOT block: deny the second, resubmit for the same year, and the third row still fails because the APPROVED one blocks — only when no SUBMITTED/APPROVED/PAID row exists can a new one approve."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GK2 ACTIVE; counselor CK2; series SK2 ACTIVE with PUBLISHED schedule (event K2 amount 100, max 1, lifetime 1000; premium 100; wellness_benefit_cents 2500; wellness_waiting_months 0; preexisting 0); campaign CK2-CAM OPEN guaranteed_issue; employee EK2; policy PK2 ISSUED."
