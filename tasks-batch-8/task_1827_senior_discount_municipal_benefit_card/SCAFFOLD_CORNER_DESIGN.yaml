            - { call: "POST /senior-benefits/reimbursement-claims/${cl1}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { fin1: $.data.final_amount_cents } }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramAdministrator }
