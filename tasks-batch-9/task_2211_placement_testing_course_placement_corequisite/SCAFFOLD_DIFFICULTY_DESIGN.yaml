# =============================================================================
# task_2211 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty
# Rules. 9 rule_ids / 25 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml; every `setup_api_calls` chain is replayable from an empty DB
# using only §1.5 endpoints; every `${var}` is bound by an earlier `captures:`.
#
# Fixed actor identifiers used throughout (opaque roles):
#   admin-1 (SystemAdmin) · director-1 (AssessmentDirector) ·
#   staff-1 / staff-2 (AssessmentStaff) · proctor-1 / proctor-2 (Proctor) ·
#   instructor-1 (Instructor) · registrar-1 / registrar-2 (Registrar)
# Student is entity_backed:Student, so as_user_id is always a captured id.
#
# The logical clock's startup default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: validation_study_strict_vs_inclusive_cohort_divergence
        grounds:
          - calculations.cut_score_validation_outcome
          - entities.CutScoreValidationStudy.fields.strict_success_rate
          - entities.CutScoreValidationStudy.fields.inclusive_success_rate
          - state_machines.CutScoreValidationStudy.COMPLETED_to_APPROVED
          - validations[priority=27]
          - errors.ERR_VALIDATION_RATE_TOO_LOW
        distinguishing_aspect: |
          The two variants of calculations.cut_score_validation_outcome are
          distinguished by COHORT MEMBERSHIP, not by rounding: strict_cohort
          drops final_grade == W rows and keeps only students whose governing
          determination used measure_type_used == TEST_SCORE, while
          inclusive_cohort keeps both. On the same three graded registrations
          this produces 1.0000 versus 0.6667, and the COMPLETED -> APPROVED gate
          reads ONLY strict_success_rate — so the study is APPROVED even though
          inclusive_success_rate (0.6667) sits below VALIDATION_MIN_SUCCESS_RATE
          (0.7000). An implementation that filters the cohort once and reuses it
          for both fields, or that gates on the inclusive rate, fails here.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z."
            - "Course MATH-100 (transfer-level MATH, level_rank 100, units 4.0, is_support_course false)."
            - "ACTIVE PlacementRule TEST_SCORE -> MATH-100 (min_score 500, version_label V1) and ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-100 (min_hs_gpa 3.0, version_label V1)."
            - "DRAFT PlacementRule TEST_SCORE -> MATH-100 (min_score 560, version_label V2) — the study's candidate rule; never activated before the decision."
            - "One OPEN Section of MATH-100 (seat_capacity 10, meets 2026-01-08T17:00:00Z-18:00:00Z) and one OPEN TestAdministration for MATH (seat_capacity 10)."
            - "Student S1: no transcript on file (hs_transcript_status NONE), SCORED MATH attempt raw_score 100 -> scaled_score 625, therefore placed by TEST_SCORE; final_grade B."
            - "Student S2: identical profile to S1, therefore placed by TEST_SCORE; final_grade W."
            - "Student S3: hs_gpa 3.50 VERIFIED and no test attempt, therefore placed by TRANSCRIPT_GPA; final_grade A."
            - "All three registrations reach COMPLETED with graded_at 2026-01-20T00:00:00Z, inside the study window [2026-01-01T00:00:00Z, 2026-02-01T00:00:00Z)."
            - "Clock advanced to 2026-03-01T00:00:00Z so window_end_at <= clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_math100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TEST_SCORE", target_course_id: "${c_math100}", priority_rank: 10, min_score: 500, effective_from: "2026-01-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { r_test_v1: $.data.id }
            - call: "POST /placement-rules/${r_test_v1}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_math100}", priority_rank: 20, min_hs_gpa: 3.0, effective_from: "2026-01-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { r_gpa_v1: $.data.id }
            - call: "POST /placement-rules/${r_gpa_v1}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TEST_SCORE", target_course_id: "${c_math100}", priority_rank: 5, min_score: 560, effective_from: "2026-01-01T00:00:00Z", version_label: "V2" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { r_candidate_v2: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_math100}", term_code: "2026SP", room_code: "R101", meets_start_at: "2026-01-08T17:00:00Z", meets_end_at: "2026-01-08T18:00:00Z", seat_capacity: 10 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_math: $.data.id }
            - call: "POST /sections/${sec_math}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /test-administrations"
              payload: { room_code: "T01", subject_area: "MATH", proctor_user_id: "proctor-1", starts_at: "2026-01-05T00:00:00Z", ends_at: "2026-01-05T02:00:00Z", seat_capacity: 10 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { adm_math: $.data.id }
            - call: "POST /test-administrations/${adm_math}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /students"
              payload: { student_number: "S1", full_name: "Student One", race_ethnicity_code: "BLACK", hs_transcript_status: "NONE" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { s1_id: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${s1_id}", administration_id: "${adm_math}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a1_id: $.data.id }
            - call: "POST /test-attempts/${a1_id}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /test-attempts/${a1_id}/score"
              payload: { raw_score: 100 }
              as: Proctor
              as_user_id: "proctor-1"
            - call: "GET /students/${s1_id}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { s1_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${s1_id}", subject_area: "MATH", expected_student_version: "${s1_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d1_id: $.data.id, d1_measure: $.data.measure_type_used }
            - call: "GET /sections/${sec_math}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_v1: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${s1_id}", section_id: "${sec_math}", expected_section_version: "${sec_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_id: $.data.id }
            - call: "POST /registrations/${reg1_id}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /students"
              payload: { student_number: "S2", full_name: "Student Two", race_ethnicity_code: "HISPANIC", hs_transcript_status: "NONE" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { s2_id: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${s2_id}", administration_id: "${adm_math}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a2_id: $.data.id }
            - call: "POST /test-attempts/${a2_id}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /test-attempts/${a2_id}/score"
              payload: { raw_score: 100 }
              as: Proctor
              as_user_id: "proctor-1"
            - call: "GET /students/${s2_id}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { s2_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${s2_id}", subject_area: "MATH", expected_student_version: "${s2_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d2_id: $.data.id }
            - call: "GET /sections/${sec_math}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_v2: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${s2_id}", section_id: "${sec_math}", expected_section_version: "${sec_v2}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2_id: $.data.id }
            - call: "POST /registrations/${reg2_id}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /students"
              payload: { student_number: "S3", full_name: "Student Three", race_ethnicity_code: "WHITE", hs_gpa: 3.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { s3_id: $.data.id, s3_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${s3_id}", subject_area: "MATH", expected_student_version: "${s3_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d3_id: $.data.id, d3_measure: $.data.measure_type_used }
            - call: "GET /sections/${sec_math}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_v3: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${s3_id}", section_id: "${sec_math}", expected_section_version: "${sec_v3}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg3_id: $.data.id }
            - call: "POST /registrations/${reg3_id}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /sections/${sec_math}/status"
              payload: { target_status: "CLOSED" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /registrations/${reg1_id}/grade"
              payload: { final_grade: "B" }
              as: Instructor
              as_user_id: "instructor-1"
            - call: "POST /registrations/${reg2_id}/grade"
              payload: { final_grade: "W" }
              as: Instructor
              as_user_id: "instructor-1"
            - call: "POST /registrations/${reg3_id}/grade"
              payload: { final_grade: "A" }
              as: Instructor
              as_user_id: "instructor-1"
            - call: "POST /validation-studies"
              payload: { subject_area: "MATH", candidate_rule_id: "${r_candidate_v2}", window_start_at: "2026-01-01T00:00:00Z", window_end_at: "2026-02-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { study_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /validation-studies/${study_id}/run"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { strict_n: $.data.strict_cohort_size, strict_rate: $.data.strict_success_rate, incl_n: $.data.inclusive_cohort_size, incl_rate: $.data.inclusive_success_rate, di: $.data.disproportionate_impact_index }
            - call: "POST /validation-studies/${study_id}/decide"
              payload: { decision: "APPROVE", decision_note: "strict cohort clears the cut score" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { study_state: $.data.state }
          assert:
            - "${d1_measure} == \"TEST_SCORE\" and ${d3_measure} == \"TRANSCRIPT_GPA\""
            - "${strict_n} == 1 and CutScoreValidationStudy.${study_id}.strict_success_count == 1 and ${strict_rate} == 1.0000"
            - "${incl_n} == 3 and CutScoreValidationStudy.${study_id}.inclusive_success_count == 2 and ${incl_rate} == 0.6667"
            - "${strict_rate} != ${incl_rate} — the two variants diverge on identical stored data"
            - "${di} == 1.0000 and CutScoreValidationStudy.${study_id}.reference_group_key == null (no group reaches MIN_SUBGROUP_N = 10)"
            - "CutScoreValidationStudy.${study_id}.run_count == 1"
            - "${study_state} == \"APPROVED\" — APPROVE succeeds because 1.0000 >= 0.7000 even though the inclusive rate 0.6667 < 0.7000"
            - "PlacementRule.${r_candidate_v2}.status == \"ACTIVE\" and PlacementRule.${r_candidate_v2}.activated_at == \"2026-03-01T00:00:00Z\" (approval HOP 1)"
            - "PlacementRule.${r_test_v1}.status == \"SUPERSEDED\" — approval HOP 2 supersedes the ACTIVE rule sharing (MATH, TEST_SCORE, MATH-100)"
            - "PlacementRule.${r_gpa_v1}.status == \"ACTIVE\" — a different measure_type is outside the supersession key"
            - "PlacementDetermination.${d1_id}.applied_rule_id == \"${r_test_v1}\" still — historical placements are never re-derived when their rule is superseded"

      - name: section_seats_committed_only_vs_paired_conservative_divergence
        grounds:
          - calculations.section_available_seats
          - entities.Section.fields.available_seats
          - entities.Section.fields.seats_held
          - state_machines.Section.UNPAIRED_to_PAIRED
          - state_machines.Section.PAIRED_to_UNPAIRED
          - entities.CourseRequisite.fields.requisite_type
        distinguishing_aspect: |
          The two variants of calculations.section_available_seats differ in TWO
          structural ways at once: committed_only ignores PENDING holds and looks
          only at this section, while paired_conservative subtracts seats_held on
          BOTH halves and takes the min against the partner's supply. Dissolving
          the pair therefore changes available_seats from 2 to 3 with ZERO
          Registration rows changing state — the delta comes purely from the
          variant switch driven by pairing_state. An implementation with one
          seat formula cannot produce both numbers.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "Courses MATH-100 (units 4.0, is_support_course false) and MATH-100S (units 2.0, is_support_course true, level_rank 90)."
            - "ACTIVE COREQUISITE CourseRequisite edge MATH-100 -> MATH-100S so pairing is legal."
            - "Section sec_p for MATH-100, seat_capacity 3, meets 2026-09-01T17:00:00Z-18:00:00Z, seat_capacity 3."
            - "Section sec_s for MATH-100S, seat_capacity 2, meets 2026-09-01T18:00:00Z-19:00:00Z (exact adjacency, so pairing will not trip ERR_COREQ_TIME_CONFLICT)."
            - "The two sections are PAIRED while both are still PLANNED (pairing requires status == PLANNED), then both are moved to OPEN."
            - "Exactly one PENDING Registration on sec_p: seats_taken 0, seats_held 1, waitlist_count 0. A PENDING row never creates a companion row on the SUPPORT half, so the unpair guard is satisfied."
            - "No ACTIVE PlacementRule with coreq_required exists, so opening sec_p does not re-require pairing after the unpair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_p: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100S", title: "Algebra Support", subject_area: "MATH", level_rank: 90, units: 2.0, is_support_course: true, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_s: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_p}", requisite_course_id: "${c_s}", requisite_type: "COREQUISITE", enforcement: "WARNING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req_coreq: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_p}", term_code: "2026FA", room_code: "R201", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 3 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_p: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${c_s}", term_code: "2026FA", room_code: "R202", meets_start_at: "2026-09-01T18:00:00Z", meets_end_at: "2026-09-01T19:00:00Z", seat_capacity: 2 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_s: $.data.id }
            - call: "POST /sections/${sec_p}/pair"
              payload: { support_section_id: "${sec_s}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { pair_state: $.data.pairing_state, role_p: $.data.role_in_pair }
            - call: "POST /sections/${sec_p}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /sections/${sec_s}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /students"
              payload: { student_number: "S10", full_name: "Student Ten", race_ethnicity_code: "ASIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { st1_id: $.data.id }
            - call: "GET /sections/${sec_p}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_p_v0: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${st1_id}", section_id: "${sec_p}", expected_section_version: "${sec_p_v0}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg_hold: $.data.id, reg_state: $.data.state }
          trigger:
            - call: "GET /sections/${sec_p}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { av_paired: $.data.available_seats, held_before: $.data.seats_held, taken_before: $.data.seats_taken }
            - call: "GET /sections/${sec_s}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { av_support_paired: $.data.available_seats }
            - call: "POST /sections/${sec_p}/unpair"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { pair_state_after: $.data.pairing_state }
            - call: "GET /sections/${sec_p}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { av_unpaired: $.data.available_seats, held_after: $.data.seats_held, taken_after: $.data.seats_taken }
            - call: "GET /sections/${sec_s}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { av_support_unpaired: $.data.available_seats }
          assert:
            - "${pair_state} == \"PAIRED\" and ${role_p} == \"PRIMARY\" and Section.${sec_s}.role_in_pair == \"SUPPORT\""
            - "${reg_state} == \"PENDING\" and ${held_before} == 1 and ${taken_before} == 0"
            - "${av_paired} == 2 — paired_conservative computes max(0, min(3 - 0 - 1, 2 - 0 - 0)) = min(2, 2)"
            - "${av_support_paired} == 2 — the SUPPORT half reports the same conservative minimum"
            - "${pair_state_after} == \"UNPAIRED\" and Section.${sec_p}.linked_section_id == null and Section.${sec_p}.role_in_pair == \"NONE\""
            - "${av_unpaired} == 3 — committed_only computes max(0, 3 - 0) and IGNORES the single PENDING hold"
            - "${held_after} == 1 and ${taken_after} == 0 — no Registration changed, so the 2 -> 3 delta is entirely the variant switch"
            - "${av_support_unpaired} == 2 — max(0, 2 - 0); the SUPPORT half no longer consults the partner"
            - "Registration.${reg_hold}.state == \"PENDING\" throughout"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: base_confidence_round_per_weighted_term_then_sum
        grounds:
          - calculations.placement_base_confidence_score
          - calculations.attempt_scaled_score
          - entities.PlacementDetermination.fields.base_confidence_score
          - entities.PlacementDetermination.fields.confidence_score
          - entities.Student.fields.self_guided_pathway
        distinguishing_aspect: |
          Mode (b): the SAME three weighted components admit two evaluation
          orders that disagree. calculations.placement_base_confidence_score
          mandates round-each-weighted-term-to-2dp-THEN-sum-THEN-round-to-1dp.
          With hs_gpa 3.97 and raw_score 155 the pinned order yields 92.6
          (49.63 + 33.92 + 9.00 = 92.55 -> 92.6) while the forbidden
          sum-unrounded-then-round-once order yields 92.5 (49.625 + 33.915 +
          9.000 = 92.540 -> 92.5). The instance is falsifiable precisely because
          the two orders differ by 0.1 on this input.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "Course MATH-100 (level_rank 100, units 4.0)."
            - "Exactly one ACTIVE PlacementRule: TRANSCRIPT_GPA -> MATH-100, min_hs_gpa 3.0, version_label V1."
            - "OPEN TestAdministration for MATH."
            - "Student SB: hs_gpa 3.97, hs_transcript_status VERIFIED, transcript_recorded_at 2026-06-01T00:00:00Z, self_guided_pathway STEM."
            - "SB has one SCORED MATH attempt with raw_score 155, so scaled_score = round(155 * 6.25, 0) = 969."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
