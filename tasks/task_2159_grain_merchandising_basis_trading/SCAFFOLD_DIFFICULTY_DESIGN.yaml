          - calculations.margin_call_amount
          - entities.HedgePosition.fields.posted_margin_usd
        distinguishing_aspect: |
          Non-linearity here is a CYCLE on the HedgePosition entity — a third distinct entity —
          traversed twice: OPEN -> MARGIN_CALL -> OPEN -> MARGIN_CALL, with the second call
          amount (4000.00) differing from the first (10400.00) because the cure raised
          posted_margin_usd from 6600.00 to 17000.00.
        test_recipe:
          setup:
            - "One desk with a 5,000,000 USD credit line so posture stays NORMAL throughout."
