# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1644_office_sublease_assignment_administration
# =============================================================================
# Calendar anchors used across recipes (logical clock default 2026-08-01T00:00:00.000Z, a Saturday):
#   Submit at 2026-08-10T09:00:00.000Z (Monday), consent_window_business_days=5
#     -> consent_deadline = 2026-08-17T17:00:00.000Z (Monday)
#     -> deemed_approval_instant = 2026-08-19T17:00:00.000Z (Wednesday, deadline + 2 business days)
# Standard fixture lease: base_rent 5200 c/RSF/yr, leased_rsf 10000, window 5bd,
#   deemed_approval_enabled true, tier1 5000bps to 10,000,000c, tier2 7500bps.
# Standard building: total_rentable_sf 200000, loss_factor_bps 1200.
# Standard measurement: METHOD_A, usable_sf 8000 -> rentable_sf 8960, prorata 448bps, partial_floor true.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two calculations, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: measurement_standard_a_vs_b_divergent_rsf
        grounds:
          - calculations.space_measurement
          - entities.DemisedArea.fields.rentable_sf
          - entities.DemisedArea.fields.measurement_standard
        distinguishing_aspect: |
          Same usable_sf (8000) against the same building produces different certified rentable_sf under the two
          measurement standards: METHOD_A certifies 8960 RSF while METHOD_B certifies 8680 RSF — a dual-variant
          calculation on the DemisedArea domain where neither variant is an estimate-vs-final pair.
        test_recipe:
          setup:
            - "Building B1 total_rentable_sf=200000 loss_factor_bps=1200"
            - "Parties: landlord PL, tenant PT, subtenant PS1, subtenant PS2 (credit 7000 each)"
            - "Two leases L-A and L-B under B1/PT/PL with standard fixture economics (one-open-transfer gate forces one lease per transfer)"
            - "DRAFT transfer T-A on L-A (counterparty PS1) and DRAFT transfer T-B on L-B (counterparty PS2), both created by broker-1 at clock 2026-08-03T09:00:00.000Z"
            - "DemisedArea on T-A with measurement_standard=METHOD_A usable_sf=8000; DemisedArea on T-B with METHOD_B usable_sf=8000"
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps1_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubTwo Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps2_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
              payload: { counterparty_id: "${ps1_id}", transfer_type: "SUBLEASE", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_a: $.data.id, lease_v1: $.data.version }
            - call: "POST /sublease-admin/transfer-requests/${tr_a}/demised-areas"
              payload: { measurement_standard: "METHOD_A", usable_sf: 8000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { da_a: $.data.id }
            - call: "POST /sublease-admin/demised-areas/${da_a}/certify"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_b_id: $.data.id, lease_b_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_b_id}/transfer-requests"
              payload: { counterparty_id: "${ps2_id}", transfer_type: "SUBLEASE", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_b_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_b: $.data.id }
            - call: "POST /sublease-admin/transfer-requests/${tr_b}/demised-areas"
              payload: { measurement_standard: "METHOD_B", usable_sf: 8000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { da_b: $.data.id }
            - call: "POST /sublease-admin/demised-areas/${da_b}/certify"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
          trigger:
            - call: "GET /sublease-admin/demised-areas/${da_a}"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { rsf_a: $.data.rentable_sf }
            - call: "GET /sublease-admin/demised-areas/${da_b}"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { rsf_b: $.data.rentable_sf }
          assert:
            - "DemisedArea.${da_a}.rentable_sf == 8960"
            - "DemisedArea.${da_a}.prorata_share_bps == 448"
            - "DemisedArea.${da_b}.rentable_sf == 8680"
            - "DemisedArea.${da_b}.prorata_share_bps == 434"
            - "DemisedArea.${da_a}.rentable_sf != DemisedArea.${da_b}.rentable_sf"

      - name: settlement_provisional_vs_final_ledger_divergence
        grounds:
          - calculations.settlement_profit_share
          - state_machines.Settlement.DRAFT_to_FINALIZED
          - entities.Lease.fields.cumulative_profit_share_cents
        distinguishing_aspect: |
          Identical settlement inputs produce identical computed fields, but the provisional (DRAFT) variant leaves
          Lease.cumulative_profit_share_cents at 0 while the final (FINALIZED) variant debits 1,319,824 cents —
          a provisional-vs-final dual variant on the Settlement/Lease ledger domain, structurally distinct from the
          DemisedArea measurement variant pair.
        test_recipe:
          setup:
            - "Standard fixture: building, parties (PL landlord, PT tenant, PS subtenant), lease L1"
            - "Transfer T1 fully driven to EFFECTIVE via express GRANTED consent, documentation, and dual-signature recognition"
            - "Measurement METHOD_A usable 8000 certified (full-floor avoided by leased_rsf 8000 for this lease so is_partial_floor=false)"
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 8000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
              payload: { counterparty_id: "${ps_id}", transfer_type: "SUBLEASE", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_id: $.data.id }
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/demised-areas"
              payload: { measurement_standard: "METHOD_A", usable_sf: 8000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { da_id: $.data.id }
            - call: "POST /sublease-admin/demised-areas/${da_id}/certify"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/submit"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/consent-review"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { cr_id: "$.data[0].id", cr_v0: "$.data[0].version" }
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/credit-review"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { kr_id: "$.data[0].id" }
            - call: "POST /sublease-admin/credit-reviews/${kr_id}/attest"
              payload: { reviewed_credit_rating_bps: 7000 }
              as: TenantRepBroker
              as_user_id: "broker-2"
            - call: "POST /sublease-admin/consent-reviews/${cr_id}/decide"
              payload: { decision: "GRANTED", expected_consent_review_version: "${cr_v0}" }
              as: Landlord
              as_user_id: "${pl_id}"
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/document"
              payload: { executed_rent_per_rsf_annual_cents: 6400 }
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/recognition-agreement"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { ra_id: "$.data[0].id" }
            - call: "POST /sublease-admin/recognition-agreements/${ra_id}/sign"
              payload: { signatory: "LANDLORD" }
              as: Landlord
              as_user_id: "${pl_id}"
            - call: "POST /sublease-admin/recognition-agreements/${ra_id}/sign"
              payload: { signatory: "COUNTERPARTY" }
              as: Subtenant
              as_user_id: "${ps_id}"
            - call: "POST /sublease-admin/settlements"
              payload: { lease_id: "${lease_id}", transfer_request_id: "${tr_id}", period_start: "2026-10-01T00:00:00.000Z", period_end: "2026-11-01T00:00:00.000Z", subrent_collected_cents: 6000000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { st_id: $.data.id }
            - call: "GET /sublease-admin/leases/${lease_id}"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { cum_pre: $.data.cumulative_profit_share_cents }
          trigger:
            - call: "POST /sublease-admin/settlements/${st_id}/finalize"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "GET /sublease-admin/leases/${lease_id}"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
          assert:
            - "pre-finalize Lease.${lease_id}.cumulative_profit_share_cents == 0 (provisional variant does not touch the ledger)"
            - "Settlement.${st_id}.passthrough_rent_cents == 3957129"
            - "Settlement.${st_id}.net_profit_cents == 2042871"
            - "Settlement.${st_id}.landlord_share_cents == 1319824"
            - "post-finalize Lease.${lease_id}.cumulative_profit_share_cents == 1319824 (final variant debits the ledger exactly once)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (two instances in DIFFERENT modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_partial_floor_nested_rounding_mode_b
        grounds:
          - calculations.settlement_profit_share
          - entities.Settlement.fields.passthrough_rent_cents
          - entities.DemisedArea.fields.is_partial_floor
        distinguishing_aspect: |
          Mode (b) nested rounding: the partial-floor branch rounds base_passthrough (3,957,129) then applies the 1500bps
          gross-up and rounds again to 4,550,698 — summing the unrounded value or rounding in the opposite order yields a
          different passthrough; the partial-floor fixture produces landlord_share 874,648 vs the full-floor 1,319,824 on
          identical collected rent, proving the nested-rounding branch is order-sensitive and state-conditional.
        test_recipe:
          setup:
            - "Standard building; lease L1 with leased_rsf=10000 so METHOD_A usable 8000 (RSF 8960) is a PARTIAL floor"
            - "Transfer T1 SUBLEASE driven to EFFECTIVE (express GRANTED, documented, dual-signed recognition)"
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
