  - section: endpoints
    instances:
      - name: entitlement_rule_surface_is_create_read_list_and_retire_only
        claim_type: standard_crud
        grounds:
          - endpoints[POST /hhi/entitlement-rules]
          - endpoints[GET /hhi/entitlement-rules/{id}]
          - endpoints[GET /hhi/entitlement-rules]
          - endpoints[POST /hhi/entitlement-rules/{id}/retire]
        distinguishing_aspect: |
          The rule catalogue has no PUT, PATCH or DELETE: the write surface is a 201 create, two 200
          reads and a retire verb, and the list read supports grade_band, delivery_mode and status
          filters plus limit/offset pagination with total_count and has_more.
        test_recipe:
          setup:
            - "Empty database at logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_home_id: $.data.id }
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "HIGH", delivery_mode: "VIRTUAL_SYNC", base_weekly_minutes: 300, cap_weekly_minutes: 420, min_session_minutes: 20, max_session_minutes: 90, max_daily_minutes: 180, min_gap_minutes: 0, travel_buffer_minutes: 0, status: "PUBLISHED" }
              as: ProgramAdministrator
              captures: { rule_virtual_id: $.data.id }
            - call: "GET /hhi/entitlement-rules/${rule_home_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /hhi/entitlement-rules?status=PUBLISHED"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /hhi/entitlement-rules?grade_band=HIGH&delivery_mode=VIRTUAL_SYNC"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /hhi/entitlement-rules?limit=1&offset=1"
              payload: {}
