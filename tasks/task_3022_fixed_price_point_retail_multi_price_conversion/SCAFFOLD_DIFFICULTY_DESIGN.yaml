  - rule_id: cross_entity_state_dependency
    instances:

      - name: release_gated_on_container_receive_state
        grounds:
          - state_machines.AllocationLine.ALLOCATED_to_RELEASED
          - state_machines.Container.AT_PORT_to_RECEIVED
          - entities.AllocationLine.fields.remaining_units
          - entities.Store.fields.conversion_price_point_id
          - entities.ConversionProject.fields.coverage_delta_pct
