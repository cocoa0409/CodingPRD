  # ======================================================== calculations ====
  - section: calculations
    instances:
      - name: calc_bom_merges_shared_parts_and_sorts
        claim_type: correct_result
        grounds:
          - "calculations.bom_expansion"
          - "endpoints.\"GET /configurations/{configurationId}/bom\""
        distinguishing_aspect: "PN-PNL-FAB appears in two module types (2/unit in 6X6, 4/unit in PRIVATE_OFFICE); the BOM merges to one line qty 8, extended 76800, lines sorted by part_number ascending (first line PN-DOOR), parts_total 352411 (2x85837 + 180737)."
        test_recipe:
          setup: ["SYSTEMS family; dealer; configuration 2 x WORKSTATION_6X6 A + 1 x PRIVATE_OFFICE A"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SYS-7500", name: "Systems 7500", category: "SYSTEMS", base_lead_time_days: 42 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /configurations", payload: { name: "Merge me", modules: [{ module_type: "WORKSTATION_6X6", fabric_grade: "A", qty: 2 }, { module_type: "PRIVATE_OFFICE", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" } }
          trigger:
            - { call: "GET /configurations/${cfg_id}/bom", as: DealerRep, as_user_id: "${dlr_id}", captures: { ptotal: "$.data.parts_total_cents", tunits: "$.data.total_units" } }
          assert:
            - "parts_total_cents == 352411 and total_units == 3"
            - "lines contain exactly one PN-PNL-FAB entry with total_qty == 8 and extended_cents == 76800"
            - "lines are sorted by part_number ascending; first line part_number == PN-DOOR"

      - name: calc_queue_tier_boundary_49_vs_50_units
        claim_type: constants_applied
        grounds:
          - "calculations.configuration_lead_time"
        distinguishing_aspect: "queue tier boundary is inclusive on the upper edge of the lower tier: 49 units -> 3 queue days (lead 28+0+3=31), 50 units -> 7 (lead 35)."
        test_recipe:
          setup: ["SEATING family base 28; dealer; two configurations of 49 and 50 TASK_CHAIR_SET grade A"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
