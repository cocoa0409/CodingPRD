  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:

      - name: corner_clock_reads_the_declared_default_before_any_set_call
        claim_type: Computed read
        grounds: [endpoints, "constants.DEFAULT_CLOCK_UTC"]
        distinguishing_aspect: "A server that has never received POST /_clock/set_current_utc must behave as if the instant were exactly 2026-05-01T00:00:00Z, never real wall-clock time; a warranty check against a 2026-05-01 completion is therefore day 0."
        test_recipe:
          setup: ["A freshly started server with no clock call yet."]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the response's current_utc == \"2026-05-01T00:00:00Z\""
            - "setting the clock to the default instant is a no-op — expired_prescription_ids and restanding_client_ids are both empty on an empty database"

      - name: corner_reorder_swaps_the_two_sequence_indices
        claim_type: Action endpoint
        grounds: [endpoints, entities.RouteStop.fields.sequence_index]
        distinguishing_aspect: "POST /route-stops/{id}/reorder with direction EARLIER exchanges this stop's sequence_index with its predecessor's and re-plans its start minute; the route still holds exactly two stops with indices 1 and 2."
        test_recipe:
          setup: ["A DRAFT route with two zone A stops at indices 1 (start 480) and 2 (start 700), no appointments attached."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 1, planned_start_minute: 480 }
              as: Dispatcher
              captures: { st1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 2, planned_start_minute: 700 }
              as: Dispatcher
              captures: { st2: "$.data.id" }
          trigger:
            - call: "POST /route-stops/${st2}/reorder"
              payload: { direction: "EARLIER", planned_start_minute: 480 }
              as: Dispatcher
          assert:
            - "RouteStop.${st2}.sequence_index == 1 and planned_start_minute == 480"
            - "RouteStop.${st1}.sequence_index == 2"
            - "Route.${rt1}.stop_count == 2 and Route.${rt1}.committed_minutes == 30"

