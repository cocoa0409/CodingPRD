# ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥ 2 instances, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: auth_versus_state_pair_on_dual_failure_decide
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_SOD_CONFLICT]
          - errors[ERR_INVALID_STATE]
          - state_machines.Preauthorization."CLINICAL_REVIEW / UNCONSUMED"_to_"APPROVED / UNCONSUMED"
        distinguishing_aspect: "This instance pits the category-auth-blast segregation-of-duties identity check at priority 4 against the category-state-blast review_status precondition at priority 5: when BOTH fail on the same request the answer is ERR_SOD_CONFLICT, so an implementation that checks state before identity returns ERR_INVALID_STATE and fails."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E9, bundle B9, advocate A9, member M13 CARE_ACTIVE, clinic C9 CONTRACTED at 1450000."
