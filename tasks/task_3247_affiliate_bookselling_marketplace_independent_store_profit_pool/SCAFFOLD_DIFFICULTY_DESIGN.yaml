            - call: "POST /bookshop/stores/${store_early}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Edge Books", slug: "edge-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_edge: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Late Books", slug: "late-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_late: $.data.id }
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_edge}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_late}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", pool_cents: 30000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { share_lines: $.data.share_lines, eligible_count: $.data.eligible_store_count }
          assert:
            - "response eligible_store_count == 2"
            - "store EARLY eligible == true with share_cents == 15000"
            - "store EDGE eligible == true with share_cents == 15000 (exactly 14 days >= 14)"
            - "store LATE appears with eligible == false and share_cents == 0 (13 days < 14)"
            - "response remainder_cents == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_place_blocked_by_suspended_partner
        grounds:
          - state_machines.BookOrder.DRAFT_to_PLACED
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair BookOrder -> AffiliatePartner: an order attributed to a
          partner cannot leave DRAFT while the partner is SUSPENDED; flipping
          the partner back to ACTIVE unblocks the very same order.
        test_recipe:
          setup:
            - "Partner approved and activated, then suspended. DRAFT order attributed to that partner (ebook 20000, rev share 0.25)."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Digital Press", discount_pct: 0.0, returns_allowed: false, return_window_days: 0, return_credit_pct: 0.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000060", title: "Gate Book", format: "EBOOK", list_price_cents: 20000, ebook_partner_rev_share_pct: 0.25 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/partners"
              payload: { display_name: "Gate Author", partner_kind: "AUTHOR", commission_pct: 0.10 }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "approve" }
              as: PlatformAdmin
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-10"
                attributed_partner_id: "${partner_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-10"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "suspend" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-10"
            - call: "POST /bookshop/partners/${partner_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-10"
          assert:
            - "first place rejected: 422 ERR_AFFILIATE_NOT_ACTIVE; order stays DRAFT and payment_status PENDING"
            - "after partner reactivation the same order places successfully: fulfillment PLACED, payment PAID"
            - "second-place response commission_cents == 1500 (floor((20000-5000)*0.10))"

      - name: return_creation_blocked_until_order_delivered
        grounds:
          - state_machines.ReturnRequest
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair ReturnRequest -> BookOrder (different pair from
          BookOrder -> AffiliatePartner): return creation is gated on the
          ORDER's fulfillment state — SHIPPED rejects with 409
          ERR_INVALID_STATE, and only the DELIVERED transition (a different
          entity's machine) unlocks it.
        test_recipe:
          setup:
            - "Order placed, dispatched, shipped — but not delivered. Customer attempts a return."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000061", title: "Gate Return", format: "PRINT", list_price_cents: 20000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Gate Books", slug: "gate-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-11"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-11"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-11"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
          trigger:
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-11"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-11"
              captures: { return_id: $.data.id }
          assert:
            - "first return attempt rejected: 409 ERR_INVALID_STATE (order SHIPPED, not DELIVERED)"
            - "after deliver, the identical return request succeeds: 201, ReturnRequest.${return_id}.status == REQUESTED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: promotion_closed_interval_plus_buffer_conflict
        grounds:
          - validations[priority=13]
          - errors.ERR_PROMOTION_WINDOW_CONFLICT
        distinguishing_aspect: |
          Interval semantics: closed intervals PLUS a mandatory 1-day buffer
          on the Book resource. A promotion Sep 1..Sep 10 blocks a new one
          starting Sep 11 (gap 0 < 1 day) and also Sep 10 (overlap); Sep 12
          is allowed (gap exactly 1 day).
        test_recipe:
          setup:
            - "One LISTED book with ISBN 9780000000070. Existing promotion Sep 1..Sep 10."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Promo Press", discount_pct: 0.40, returns_allowed: false, return_window_days: 0, return_credit_pct: 0.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000070", title: "Promo Book", format: "PRINT", list_price_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /bookshop/promotions"
              payload: { book_isbn: "9780000000070", discount_pct: 0.10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/promotions"
              payload: { book_isbn: "9780000000070", discount_pct: 0.10, window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/promotions"
              payload: { book_isbn: "9780000000070", discount_pct: 0.10, window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { promo_ok: $.data.id }
          assert:
            - "window starting 2026-09-11 rejected: 409 ERR_PROMOTION_WINDOW_CONFLICT (gap to Sep-10 inclusive end is 0 days < 1-day buffer)"
            - "window starting 2026-09-12 accepted: 201, Promotion.${promo_ok} created (gap exactly 1 day satisfies the buffer)"

      - name: pool_period_half_open_overlap_vs_back_to_back
        grounds:
          - validations[priority=14]
          - errors.ERR_POOL_PERIOD_OVERLAP
        distinguishing_aspect: |
          Different interval semantics on a different resource: pool periods
          use half-open [start, end) intersection on the global distribution
          calendar — a new period Aug 15..Sep 15 overlaps Aug 1..Sep 1 and is
          rejected, but a period starting exactly at Sep 1 (the existing
          period's exclusive end) is back-to-back and allowed; and voiding
          the first distribution frees its period.
        test_recipe:
          setup:
            - "Existing non-VOID distribution for Aug 1..Sep 1."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_ok: $.data.id }
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "void" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", pool_cents: 10000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_after_void: $.data.id }
          assert:
            - "overlapping period Aug 15..Sep 15 rejected while dist_id is non-VOID: 409 ERR_POOL_PERIOD_OVERLAP"
            - "back-to-back period starting exactly 2026-09-01 accepted: 201 (half-open end is exclusive)"
            - "after voiding dist_id, the Aug 15..Sep 15 create succeeds: 201 (VOID releases the period)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancel_placed_order_conserves_zero_net_ledger
        grounds:
          - state_machines.BookOrder.PLACED_to_CANCELLED
          - entities.BookOrder.fields.refunded_cents
        distinguishing_aspect: |
          Conserved quantity: affiliate accrued balance. Forward action
          (place, +13800 ORDER_ACCRUAL) paired with its compensating action
          (cancel, reversal of the provisional entry plus -13800
          COMMISSION_REVERSAL) returns the balance to exactly 0 and the order
          invariant gross == refunded + retained holds at 100000 == 100000 + 0.
        test_recipe:
          setup:
            - "ACTIVE store (commission 0.30, threshold 20000 so no payout fires). Print book 100000 cents at 46% publisher discount. Order placed then cancelled before dispatch."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000080", title: "Cancel Book", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Cancel Books", slug: "cancel-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-12"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-12"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-12"
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "cancel" }
              as: Customer
              as_user_id: "cust-12"
            - call: "GET /bookshop/ledger-entries"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "cancel response: payment_status == REFUNDED_FULL and fulfillment_status == CANCELLED"
            - "cancel response: refunded_cents == 100000 and retained_cents == 0 (gross == refunded + retained)"
            - "the provisional ORDER_ACCRUAL entry of 13800 has reversed == true"
            - "a COMMISSION_REVERSAL entry of -13800 exists"
            - "AffiliateStore.${store_id}.accrued_balance_cents == 0 (forward + compensating actions conserve the zero baseline)"
            - "no Payout exists for the store (place-time balance 13800 < 20000 threshold), so the balance invariant is tested in isolation"

      - name: payout_mark_paid_conserves_ledger_minus_paid_identity
        grounds:
          - state_machines.Payout.PROCESSING_to_PAID
          - entities.AffiliateStore.fields.accrued_balance_cents
        distinguishing_aspect: |
          Conserved quantity of a different type: the ledger identity
          sum(non-reversed entries) - sum(PAID payout amounts) ==
          accrued_balance_cents. A failed-then-retried payout leaves the
          identity untouched at 13800 == 13800 - 0; the compensating
          mark-paid then settles it at 0 == 13800 - 13800 — and the payout
          lifecycle itself never writes ledger entries.
        test_recipe:
          setup:
            - "ACTIVE store with accrued 13800 from one placed print order; payout sweep opened Payout PENDING 13800 at place time."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000081", title: "Identity Book", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Identity Books", slug: "identity-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-13"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-13"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-13"
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: FinanceOps
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "fail", failure_reason: "bank_reject" }
              as: FinanceOps
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "retry" }
              as: FinanceOps
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: FinanceOps
          trigger:
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: FinanceOps
              captures: { balance_before: $.data.accrued_balance_cents }
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "mark-paid" }
              as: FinanceOps
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: FinanceOps
            - call: "GET /bookshop/ledger-entries"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
          assert:
            - "before mark-paid (after the fail+retry cycle): balance_before == 13800 == sum(non-reversed entries 13800) - sum(PAID payouts 0)"
            - "after mark-paid: accrued_balance_cents == 0 == 13800 - 13800"
            - "Payout.${payout_id}.amount_cents == 13800 remained frozen through the FAILED -> PENDING cycle"
            - "ledger still contains exactly one entry (the 13800 ORDER_ACCRUAL): process/fail/retry/mark-paid never write ledger entries"
