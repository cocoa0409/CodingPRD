scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: indenture_creation_defaults_and_computed_initialization
        claim_type: creation
        grounds: ["entities.Indenture", "endpoints.POST /indentures"]
        distinguishing_aspect: "201 creation initializes status DRAFT, outstanding_principal_cents 0, covenant_posture CURRENT, active_default_count 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
          trigger:
            - { call: "GET /indentures/${ind}", payload: {}, as: PlatformAdmin }
          assert:
            - "Indenture.${ind}.status == DRAFT; outstanding_principal_cents == 0; covenant_posture == CURRENT; active_default_count == 0; version == 1"

      - name: field_defaults_applied_when_omitted
        claim_type: defaults
        grounds: ["entities.Tranche.fields.notice_period_days", "entities.CovenantObligation.fields.grace_period_days"]
        distinguishing_aspect: "Omitting notice_period_days yields 30 on the tranche; omitting grace_period_days yields 10 on the obligation."
        test_recipe:
          setup: ["active indenture with one tranche"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /covenant-obligations", payload: { indenture_id: "${ind}", covenant_type: "FINANCIAL_REPORT", frequency: "QUARTERLY", period_anchor_date: "2026-06-30" }, as: TrustOfficer, captures: { ob: $.data.id } }
          assert:
            - "Tranche.${t1}.notice_period_days == 30 (default)"
            - "CovenantObligation.${ob}.grace_period_days == 10 (default)"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Indenture.fields.annual_admin_fee_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /indentures without annual_admin_fee_cents fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_nonexistent_tranche_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET /tranches/{id}"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tranches/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Indenture.fields.status", "entities.Indenture.fields.outstanding_principal_cents"]
        distinguishing_aspect: "Client-supplied status/outstanding_principal_cents on create are ignored; server-computed values govern."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
          assert:
            - "Indenture.${ind}.status == DRAFT and outstanding_principal_cents == 0 regardless of any client-supplied status/outstanding fields"
            - "id is a server-minted UUID without type prefix; created_at has millisecond precision"

      - name: invalid_enum_value_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Tranche.fields.day_count_convention", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "day_count_convention ACT_ACT is not in {ACT_360, ACT_365, THIRTY_360} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["indenture exists"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
          trigger:
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_ACT", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: noteholder_account_list_pagination
        claim_type: listing
        grounds: ["endpoints.GET /noteholder-accounts", "response_envelope"]
        distinguishing_aspect: "12 accounts: limit=10 -> total_count 12, has_more true, 10 items; offset=10 -> 2 items, has_more false."
        test_recipe:
          setup: ["twelve noteholder accounts H-01..H-12"]
          setup_api_calls:
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-01", legal_name: "H1", contact_email: "h1@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-02", legal_name: "H2", contact_email: "h2@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-03", legal_name: "H3", contact_email: "h3@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-04", legal_name: "H4", contact_email: "h4@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-05", legal_name: "H5", contact_email: "h5@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-06", legal_name: "H6", contact_email: "h6@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-07", legal_name: "H7", contact_email: "h7@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-08", legal_name: "H8", contact_email: "h8@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-09", legal_name: "H9", contact_email: "h9@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-10", legal_name: "H10", contact_email: "h10@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-11", legal_name: "H11", contact_email: "h11@x.com" }, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-12", legal_name: "H12", contact_email: "h12@x.com" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /noteholder-accounts?limit=10&offset=0", payload: {}, as: PlatformAdmin }
            - { call: "GET /noteholder-accounts?limit=10&offset=10", payload: {}, as: PlatformAdmin }
          assert:
            - "page 1: total_count == 12, has_more == true, exactly 10 items"
            - "page 2: has_more == false, exactly 2 items"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: ["state_machines.Indenture", "state_machines.CovenantObligation", "state_machines.PaymentRun", "state_machines.DefaultCase", "state_machines.FeeInvoice", "state_machines.TrusteeAppointment"]
        distinguishing_aspect: "Each entity starts in its declared initial state (DRAFT / OPEN / SCHEDULED+UNFUNDED / ALLEGED / DRAFT / PROPOSED)."
        test_recipe:
          setup: ["active indenture with tranche and one position"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /covenant-obligations", payload: { indenture_id: "${ind}", covenant_type: "FINANCIAL_REPORT", frequency: "QUARTERLY", period_anchor_date: "2026-06-30" }, as: TrustOfficer, captures: { ob: $.data.id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "ANNUAL_ADMIN", service_period_start: "2026-01-01", service_period_end: "2026-12-31", description: "annual" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv: $.data.id } }
            - { call: "GET /indentures/${ind}", payload: {}, as: PlatformAdmin, captures: { ind_v: $.data.version } }
            - { call: "POST /trustee-appointments", payload: { indenture_id: "${ind}", incoming_trustee_ref: "trustee-beta", reason: "RESIGNATION", proposed_effective_date: "2026-09-01", expected_indenture_version: "${ind_v}" }, as: PlatformAdmin, captures: { appt: $.data.id } }
          trigger:
            - { call: "GET /trustee-appointments/${appt}", payload: {}, as: PlatformAdmin }
          assert:
            - "CovenantObligation.${ob}.status == OPEN"
            - "PaymentRun.${run}: funding_status == UNFUNDED and distribution_status == SCHEDULED"
            - "DefaultCase.${dc}.status == ALLEGED"
            - "FeeInvoice.${inv}.status == DRAFT and amount_cents == 2500000 (ANNUAL_ADMIN)"
            - "TrusteeAppointment.${appt}.status == PROPOSED and outgoing_trustee_ref == trustee-alpha"

      - name: cure_from_alleged_rejected_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.DefaultCase", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CURE is only valid from CONFIRMED; curing an ALLEGED case fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["active indenture with tranche; ALLEGED default case"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
          trigger:
            - { call: "POST /default-cases/${dc}/cure", payload: {}, as: TrustManager, as_user_id: "manager-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "DefaultCase.${dc}.status == ALLEGED (unchanged)"

      - name: execute_circulating_direction_rejected_threshold_not_met
        claim_type: invalid_transition
        grounds: ["state_machines.NoteholderDirection", "errors[ERR_THRESHOLD_NOT_MET]"]
        distinguishing_aspect: "Execute requires EFFECTIVE; a CIRCULATING direction below threshold fails with ERR_THRESHOLD_NOT_MET."
        test_recipe:
          setup: ["active indenture, tranche, position A 400000000; CONFIRMED default; ACCELERATE direction with no endorsements"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "ACCELERATE", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { dir: $.data.id } }
          trigger:
            - { call: "POST /directions/${dir}/execute", payload: {}, as: TrustManager, as_user_id: "manager-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_THRESHOLD_NOT_MET"
            - "NoteholderDirection.${dir}.status == CIRCULATING (unchanged)"

      - name: dispute_paid_invoice_rejected_already_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.FeeInvoice", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "PAID is terminal; disputing a PAID invoice fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["ANNUAL_ADMIN invoice issued and paid"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "ANNUAL_ADMIN", service_period_start: "2026-01-01", service_period_end: "2026-12-31", description: "annual" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv: $.data.id } }
            - { call: "POST /fee-invoices/${inv}/issue", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /fee-invoices/${inv}/pay", payload: {}, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /fee-invoices/${inv}/dispute", payload: {}, as: Issuer, as_user_id: "issuer-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "FeeInvoice.${inv}.status == PAID (unchanged)"

      - name: substitution_effect_creates_substitute_item
        claim_type: side_effect_execution
        grounds: ["state_machines.CollateralItem", "endpoints.POST /collateral-release-requests/{id}/effect"]
        distinguishing_aspect: "Effecting an APPROVED SUBSTITUTION marks the old item SUBSTITUTED and auto-creates a new PLEDGED CollateralItem with substituted_from_item_id set — discoverable only via the list GET."
        test_recipe:
          setup: ["active indenture, position 1000000000; C1 SECURITIES 800000000, C2 REAL_ESTATE 500000000; APPROVED substitution of C2 -> SECURITIES 470000000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1000000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C1", collateral_type: "SECURITIES", appraised_value_cents: 800000000, valuation_date: "2026-04-01" }, as: TrustOfficer }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2", collateral_type: "REAL_ESTATE", appraised_value_cents: 500000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "SUBSTITUTION", substitute_description: "sub securities", substitute_collateral_type: "SECURITIES", substitute_appraised_value_cents: 470000000, substitute_valuation_date: "2026-04-15", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr: $.data.id } }
            - { call: "POST /collateral-release-requests/${rr}/verify", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
            - { call: "POST /collateral-release-requests/${rr}/decide", payload: { decision: "APPROVE" }, as: TrustManager, as_user_id: "manager-1" }
          trigger:
            - { call: "POST /collateral-release-requests/${rr}/effect", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
            - { call: "GET /collateral-items?indenture_id=${ind}", payload: {}, as: TrustOfficer }
          assert:
            - "CollateralItem.${c2}.status == SUBSTITUTED"
            - "CollateralReleaseRequest.${rr}.status == EFFECTED"
            - "a new CollateralItem exists with status PLEDGED, appraised_value_cents == 470000000, substituted_from_item_id == ${c2}"

      - name: cure_resumes_suspended_run_and_execute_succeeds
        claim_type: side_effect_execution
        grounds: ["state_machines.Indenture.DEFAULTED_to_ACTIVE", "state_machines.PaymentRun"]
        distinguishing_aspect: "Compensation pattern: confirming a default SUSPENDS a scheduled run; curing the last active default resumes it to SCHEDULED and a subsequent execute succeeds."
        test_recipe:
          setup: ["active indenture, tranche, position A 400000000; INTEREST run funded 10166667; default confirmed (run SUSPENDED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 10166667 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
          trigger:
            - { call: "POST /default-cases/${dc}/cure", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer }
          assert:
            - "after cure: Indenture.${ind}.status == ACTIVE (last active default cleared)"
            - "PaymentRun.${run}.distribution_status transitioned SUSPENDED -> SCHEDULED, then execute succeeds -> DISTRIBUTED"
            - "one DistributionRecord for position A with allocated_cents == 10166667, status PENDING"

