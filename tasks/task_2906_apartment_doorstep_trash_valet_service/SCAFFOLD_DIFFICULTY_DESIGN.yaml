              captures: { rtc_id: $.data.id }
          assert:
            - "the night B route POST returns HTTP 409 with error_id == 'ERR_CONTRACTOR_WINDOW_CONFLICT' — 02:00 lies strictly inside [18:00, 04:00)"
            - "ServiceNight.${nb_id}.assigned_unit_coverage_count == 0 and version == ${nb_v} after the rejection"
            - "the night C route POST returns HTTP 201 with RouteAssignment.${rtc_id}.status == 'ASSIGNED' — 04:00 is the excluded upper endpoint, so touching is not overlapping"
            - "GET /valet/route-assignments?contractor_id=${ct_id} returns exactly 2 routes, ${rta_id} and ${rtc_id}"
            - "ServiceNight.${nc_id}.assigned_unit_coverage_count == 4"

      - name: contract_effective_intervals_are_closed_so_shared_endpoint_date_collides
        grounds:
          - validations[priority=14]
          - errors[ERR_CONTRACT_PERIOD_OVERLAP]
          - entities.ServiceContract.fields.effective_from
          - entities.ServiceContract.fields.effective_to
          - state_machines.ServiceContract.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          The shared resource is the property's billing calendar and the interval semantics are the
          OPPOSITE of the valet-window rule: effective_from..effective_to is CLOSED on both ends, so
          a successor contract that starts on the incumbent's own final day collides, and only a
          start one day later is accepted. Same rule family, inverted endpoint convention — an
          implementation that reuses one comparison for both will fail exactly one of these two
          instances.
        test_recipe:
          setup:
            - "Property 'Sequoia Place' unit_count 4"
            - "Contract 1 effective 2026-09-01..2027-08-31, ACTIVE"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Sequoia Place", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { c1_id: $.data.id }
            - call: "POST /valet/contracts/${c1_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3695, property_revenue_share_bps: 1600, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2027-08-31", effective_to: "2028-08-30", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3695, property_revenue_share_bps: 1600, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2027-09-01", effective_to: "2028-08-30", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { c3_id: $.data.id }
          assert:
            - "the 2027-08-31 start returns HTTP 409 with error_id == 'ERR_CONTRACT_PERIOD_OVERLAP' — the single shared day is an overlap because both endpoints are inclusive"
            - "the 2027-09-01 start returns HTTP 201 with ServiceContract.${c3_id}.status == 'DRAFT', effective_from == '2027-09-01', effective_to == '2028-08-30'"
            - "GET /valet/contracts?property_id=${prop_id} returns exactly 2 contracts, ${c1_id} ACTIVE and ${c3_id} DRAFT"
            - "ServiceContract.${c1_id}.effective_to is still '2027-08-31' and its version is unchanged by the rejected create"

  - rule_id: compensating_invariant
    instances:

      - name: void_tag_unwinds_fine_ledger_without_restoring_monthly_cap_headroom
        grounds:
          - state_machines.ServiceScan.FINED_to_VOIDED
          - state_machines.ResidentFine.ASSESSED_to_VOIDED
          - calculations.resident_delinquency_rollup
          - entities.Resident.fields.fines_outstanding_cents
          - entities.Resident.fields.fines_assessed_this_period_cents
          - entities.Property.fields.pending_fine_revenue_cents
        distinguishing_aspect: |
          ASYMMETRIC compensation: voiding the tag must reverse every collectable consequence of the
          fine (outstanding balance, collections_status, the property's delinquent_resident_count and
          pending_fine_revenue_cents) while deliberately NOT restoring cap headroom —
          fines_assessed_this_period_cents is a period-scoped audit total, so it stays at 10000. An
          implementation that unwinds "everything" lets the property re-fine past the monthly cap.
