  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: v_missing_context_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - "errors[ERR_MISSING_CONTEXT_HEADER]"
        distinguishing_aspect: "Priority 1: a request without X-User-Role/X-User-ID is 401 before any role or existence check."
        test_recipe:
          setup: ["One program exists."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "AUTH", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
          trigger:
            - call: "GET /programs/${prog}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_CONTEXT_HEADER with HTTP 401"

      - name: v_body_fk_invalid_reference_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - "errors[ERR_INVALID_REFERENCE]"
        distinguishing_aspect: "A body foreign key that does not resolve is 422 ERR_INVALID_REFERENCE, distinct from path-id 404."
        test_recipe:
          setup: ["Program and a customer exist; the referenced service account id does not."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "FK", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "FK Cust", email: "fk@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /applications", payload: { service_account_id: "00000000-0000-0000-0000-000000000000", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REFERENCE with HTTP 422"

