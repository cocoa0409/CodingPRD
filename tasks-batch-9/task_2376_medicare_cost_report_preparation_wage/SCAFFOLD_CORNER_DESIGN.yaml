              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
