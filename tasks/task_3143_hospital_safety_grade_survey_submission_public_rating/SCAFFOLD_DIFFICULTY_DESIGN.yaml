          assert:
            - "Survey.${s5_id}.sample_rate == 0.3000 and Survey.${s5_id}.reliability_weight == 0.5400"
            - "ScoreRun.${run5_id}.composite_score == 100.00 and ScoreRun.${run5_id}.base_grade_letter == A"
            - "Grade.letter_grade == A, because 0.6000 >= 0.6000 keeps the base letter"
            - "the same sample rate with 500 started responses lifts the coverage multiplier to 1.00, so reliability_weight is exactly 0.6000 and grade_cap_applied is false"
            - "0.5400 and 0.6000 straddle the 0.60 cap threshold, so 0.6000 >= 0.6000 keeps the base letter while 0.5400 downgrades it"

      - name: empty_accepted_correction_set_edge
        grounds:
          - validations[priority=15]
          - errors.ERR_CORRECTIONS_PENDING
          - state_machines.ReleaseCycle.OPEN_REVIEW_to_CORRECTION_CLOSED
          - entities.ReleaseCycle.fields.correction_request_count
        distinguishing_aspect: |
          The empty-collection edge: a cycle with zero CorrectionRequest rows
          AND zero still-PENDING reviews closes immediately, whereas a cycle
          holding exactly one PENDING correction is refused — an empty-set
          boundary, a different metric and a different endpoint from the
          numeric 0.60 threshold crossing the first instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Cycle C_B0 is OPEN_REVIEW with one P0 grade whose review was accepted and zero correction rows; cycle C_MG is OPEN_REVIEW with a correction still open."
