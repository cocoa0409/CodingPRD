            - "TankeringDirective.${dir_id}.pinned_origin_price_usd_per_gal == 2.4700 and pinned_destination_price_usd_per_gal == 3.1000"

      - name: collateral_post_blocked_by_terminated_parent_trade
        grounds:
          - validations[priority=7]
          - state_machines.CollateralPosting.REQUIRED_to_POSTED
          - entities.HedgeInstrument.fields.trade_status
          - errors.ERR_INSTRUMENT_INVALID_TRADE_STATE
        distinguishing_aspect: |
          The posting itself is in REQUIRED, the only state from which POSTED is reachable,
          and the amount offered is short of required_amount_usd; the call still fails on
