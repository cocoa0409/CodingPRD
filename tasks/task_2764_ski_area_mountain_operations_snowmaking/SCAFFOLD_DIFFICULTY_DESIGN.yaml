  - rule_id: non_linear_state_machine
    instances:

      - name: snowmaking_session_running_paused_cycle_accumulates_minutes
        grounds:
          - state_machines.SnowmakingSession.RUNNING_to_PAUSED
          - state_machines.SnowmakingSession.PAUSED_to_RUNNING
          - state_machines.SnowmakingSession.PAUSED_to_COMPLETED
          - entities.SnowmakingSession.fields.accumulated_run_minutes
          - entities.SnowmakingSession.fields.started_at
          - entities.SnowmakingSession.fields.last_running_since
          - entities.PumpHouse.fields.active_session_count
        distinguishing_aspect: |
          The non-linearity is a true cycle on SnowmakingSession.state: RUNNING -> PAUSED -> RUNNING can be
          traversed an unbounded number of times, and each traversal must add only the minutes of the segment
          it closes. The row is cycled twice before the final run, so state alone carries no information -
          the same state RUNNING is reached three times - and the machine's memory lives in
          accumulated_run_minutes (60 + 60 + 240 = 360). started_at must stay pinned to the FIRST entry into
          RUNNING (05:00) while last_running_since tracks the LATEST entry and is nulled on every pause, so an
          implementation that overwrites started_at on resume, or that recomputes minutes from
          started_at to ended_at (480), diverges immediately.
        test_recipe:
          setup:
            - "Open-mountain bootstrap with pump house PH1 ONLINE (max_gpm 2400) and wet_bulb_f 22.0 on the published day plan."
            - "One session on T1/PH1 over [2026-08-01T05:00:00Z, 2026-08-01T12:00:00Z) at 1200 gpm."
            - "The clock walks the cycle twice: RUNNING 05:00, PAUSED 06:00, RUNNING 07:00, PAUSED 08:00, RUNNING 09:00, and the trigger completes it at 13:00."
            - "Closed segments are 05:00-06:00 (60 min), 07:00-08:00 (60 min) and 09:00-13:00 (240 min)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
