            - "ImbalanceSettlement.${set2_id}.imbalance_bbl == -610.00, imbalance_pct == 0.020333 and imbalance_tier == PENALTY"
            - "ImbalanceSettlement.${set2_id}.imbalance_charge_usd == 686.25 and ImbalanceSettlement.${set2_id}.tariff_charge_usd == 50109.95"
            - "ImbalanceSettlement.${set2_id}.alt_basis_charge_usd == 51150.00, basis_delta_usd == 1040.05 and total_billed_usd == 50796.20"

      - name: maintenance_notification_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.MaintenanceEvent
          - calculations.effective_capacity
        excluded_because:
          difficulty_instance: transitive_cascade / maintenance_notification_cascades_five_hops_into_resequencing
          rationale: "The full five-hop cascade from the maintenance notification through derate, resequencing and reallocation is asserted by the named §1.8 instance."

      - name: proration_policy_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - calculations.capacity_proration.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / proration_policy_history_vs_volume_divergence
          rationale: "The divergent allocations produced by HISTORY_WEIGHTED versus VOLUME_WEIGHTED on identical nominations are asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: cycle_totals_are_visible_immediately_after_the_nomination_is_accepted
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /pipeline/nominations]
        distinguishing_aspect: |
          There is no settling period anywhere in this API: the very next read after a 201 already
          shows nominated_total_bbl 30000 and version 2 on the cycle, and the nomination is present in
          its listing. A client can therefore chain a read-modify-write immediately, which is exactly
          why the OCC token on the next submission must be the one this read returns.
        test_recipe:
          setup:
            - "Cycle 2026-09 is OPEN at version 1 with no nominations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "HOU", name: "Houston Origin", role_kind: "ORIGIN", shell_capacity_bbl: 500000, min_operating_inventory_bbl: 10000, injection_bays: 2 }
              as: TariffAdministrator
              captures: { org_id: "$.data.id", org_v0: "$.data.version" }
            - call: "POST /pipeline/terminals"
              payload: { terminal_code: "NAS", name: "Nashville Delivery", role_kind: "DESTINATION", shell_capacity_bbl: 400000, min_operating_inventory_bbl: 5000 }
              as: TariffAdministrator
              captures: { dst_id: "$.data.id" }
            - call: "POST /pipeline/product-grades"
              payload: { grade_code: "ULSD", name: "Ultra Low Sulfur Diesel", sequence_rank: 3, max_sulfur_ppm: 15, max_rvp_psi: 12 }
              as: TariffAdministrator
              captures: { ulsd_id: "$.data.id" }
            - call: "POST /pipeline/segments"
              payload: { segment_code: "HOU-NAS", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", linefill_grade_id: "${ulsd_id}", capacity_bbl_per_cycle: 101000, transmix_reserve_bbl: 1000, transmix_cut_bbl: 250, min_tender_bbl: 6000, linefill_requirement_bbl: 20000, proration_policy: "HISTORY_WEIGHTED" }
              as: TariffAdministrator
              captures: { seg_id: "$.data.id" }
            - call: "POST /pipeline/terminals/${org_id}/inventory-adjustments"
              payload: { expected_terminal_version: "${org_v0}", adjustment_kind: "LINEFILL", adjustment_bbl: 20000, reason: "initial linefill of HOU-NAS", segment_id: "${seg_id}" }
              as: TerminalOperator
              captures: { org_v1: "$.data.version" }
            - call: "POST /pipeline/shippers"
              payload: { shipper_code: "ALPHA", name: "Alpha Trading", credit_limit_usd: 250000 }
              as: TariffAdministrator
              captures: { alpha_id: "$.data.id" }
            - call: "POST /pipeline/tariffs"
              payload: { segment_id: "${seg_id}", grade_id: "${ulsd_id}", base_rate_usd_per_bbl: 1.855, tier1_min_bbl: 25000, tier1_rate_usd_per_bbl: 1.705, tier2_min_bbl: 45000, tier2_rate_usd_per_bbl: 1.555, tender_minimum_bbl: 6000, imbalance_penalty_rate_usd_per_bbl: 0.45, effective_from: "2026-07-01T00:00:00Z" }
              as: TariffAdministrator
              captures: { tar_ulsd_id: "$.data.id" }
            - call: "POST /pipeline/tariffs/${tar_ulsd_id}/activate"
              payload: {}
              as: TariffAdministrator
            - call: "POST /pipeline/cycles"
              payload: { cycle_code: "2026-09", segment_id: "${seg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-08-20T00:00:00Z", ship_start_at: "2026-09-01T00:00:00Z", ship_end_at: "2026-09-30T00:00:00Z" }
              as: PipelineScheduler
              captures: { cyc_id: "$.data.id", cyc_v0: "$.data.version" }
          trigger:
            - call: "POST /pipeline/nominations"
              payload: { cycle_id: "${cyc_id}", shipper_id: "${alpha_id}", grade_id: "${ulsd_id}", origin_terminal_id: "${org_id}", destination_terminal_id: "${dst_id}", nominated_bbl: 30000, expected_cycle_version: "${cyc_v0}" }
              as: Shipper
              as_user_id: "${alpha_id}"
              captures: { nom_id: "$.data.id" }
            - call: "GET /pipeline/cycles/${cyc_id}"
              payload: {}
              as: Shipper
              as_user_id: "${alpha_id}"
              captures: { total: "$.data.nominated_total_bbl", ver: "$.data.version" }
            - call: "GET /pipeline/nominations"
              payload: { cycle_id: "${cyc_id}", limit: 10 }
              as: PipelineScheduler
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "HTTP 201 then HTTP 200 twice, with no retry or polling between them"
            - "the immediate cycle read shows nominated_total_bbl == 30000 and version == 2"
            - "the immediate listing shows total_count == 1 with data[0].id == ${nom_id}"
            - "NominationCycle.${cyc_id}.status == OPEN and NominationCycle.${cyc_id}.allocated_total_bbl == 0"
