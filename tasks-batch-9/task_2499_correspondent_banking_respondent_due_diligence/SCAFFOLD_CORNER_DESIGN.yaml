      - name: respondent_contact_writes_are_confined_to_its_own_respondent
        claim_type: role_denied
        grounds:
          - roles[RespondentContact].identity
          - validations[priority=3]
          - errors[ERR_RESPONDENT_SCOPE_VIOLATION]
        distinguishing_aspect: "The entity-backed identity is enforced on writes, not only on reads, across three different addressing shapes: a respondent-scoped path, and an unknown respondent id where the scope check at priority 3 fires BEFORE path-id resolution at priority 4, so the caller gets 403 rather than 404 and cannot probe which respondent ids exist. The same three payloads succeed against its own file."
