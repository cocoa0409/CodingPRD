# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Shelf-Life & Sensory Panel Testing
# Sections/claim_types follow references/claim-extraction-guide.md.
# Instances already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# excluded_because stubs without test_recipe.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: client_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.ClientAccount, "endpoints[POST /sensory-lab/clients]"]
        distinguishing_aspect: "Creating a client with only required fields yields tier STANDARD (default), retainer_hours_balance 0, active_study_count 0, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/clients", payload: { name: "Plain Co", contact_email: "plain@acme.com" }, as: LabDirector, captures: { cid: $.data.id } }
          assert:
            - "201; ClientAccount.${cid}.tier == STANDARD (default applied)"
            - "ClientAccount.${cid}.retainer_hours_balance == 0 and active_study_count == 0 and version == 1"
            - "id is a server-minted UUID; created_at/updated_at are ISO8601 with 3 fractional digits"

      - name: client_email_uniqueness_rejected
        claim_type: type_constraints
        grounds: [entities.ClientAccount.fields.contact_email, "errors[ERR_EMAIL_NOT_UNIQUE]"]
        distinguishing_aspect: "Second client reusing an existing contact_email is rejected with ERR_EMAIL_NOT_UNIQUE (409)."
        test_recipe:
          setup: ["one client exists with contact_email dup@acme.com"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "First", contact_email: "dup@acme.com" }, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/clients", payload: { name: "Second", contact_email: "dup@acme.com" }, as: LabDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EMAIL_NOT_UNIQUE (http 409); only one client exists (GET /sensory-lab/clients total_count == 1)"

      - name: study_get_and_not_found
        claim_type: not_found
        grounds: [entities.Study, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND; GET with a real id returns the stored entity."
        test_recipe:
          setup: ["one study exists"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "NF Co", contact_email: "nf@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Puffs", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
          trigger:
            - { call: "GET /sensory-lab/studies/11111111-2222-4333-8444-555555555555", payload: {}, as: SensoryScientist, captures: { err: $.data.error_id } }
            - { call: "GET /sensory-lab/studies/${study_id}", payload: {}, as: SensoryScientist, captures: { name_got: $.data.product_name } }
          assert:
            - "unknown id: error_id == ERR_NOT_FOUND (http 404)"
            - "known id: 200 and product_name == Puffs"

      - name: accelerated_study_requires_q10_and_elevated_temp
        claim_type: type_constraints
        grounds: [entities.Study.fields.q10_factor, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ACCELERATED with q10_factor 0.5 (not > 1.0) or storage_temp_c 15 (<= reference 20) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one client exists"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "Q10 Co", contact_email: "q10@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Bad A", study_type: "ACCELERATED", storage_temp_c: 40, reference_temp_c: 20, q10_factor: 0.5, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { err1: $.data.error_id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Bad B", study_type: "ACCELERATED", storage_temp_c: 15, reference_temp_c: 20, q10_factor: 2.0, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { err2: $.data.error_id } }
          assert:
            - "both attempts rejected with ERR_INVALID_REQUEST (http 400)"
            - "GET /sensory-lab/studies total_count == 0 (nothing persisted)"

      - name: study_creation_system_owned_fields
        claim_type: system_fields
        grounds: [entities.Study]
        distinguishing_aspect: "System fields on creation: status DRAFT, actual_start_utc null, reserved_hours_escrow 0, consumed_hours 0, earliest_failure_day_equiv null, version 1."
        test_recipe:
          setup: ["one client exists"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "Sys Co", contact_email: "sys@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Wraps", study_type: "REAL_TIME", storage_temp_c: 4, target_shelf_life_days: 21, sensory_fail_threshold: 5.5, min_detectable_difference: 2.5, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id, st: $.data.status } }
          assert:
            - "status == DRAFT (initial state), version == 1"
            - "actual_start_utc is null; reserved_hours_escrow == 0; consumed_hours == 0; earliest_failure_day_equiv is null"
            - "reference_temp_c == 20 and q10_factor == 2.0 (defaults applied)"

      - name: panelist_creation_initial_state_and_email_unique
        claim_type: initial_state
        grounds: [entities.Panelist, "errors[ERR_EMAIL_NOT_UNIQUE]"]
        distinguishing_aspect: "New panelist starts APPLIED with zeroed counters; duplicate email rejected."
        test_recipe:
          setup: []
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "New Person", email: "new@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { pid: $.data.id } }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "Dupe", email: "new@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Panelist.${pid}.status == APPLIED; training_sessions_completed == 0; consecutive_no_shows == 0; consistency indexes null"
            - "duplicate email rejected with ERR_EMAIL_NOT_UNIQUE"

      - name: attribute_score_immutability_and_duplicate
        claim_type: immutability
        grounds: [entities.AttributeScore, "errors[ERR_SCORE_ALREADY_SUBMITTED]"]
        distinguishing_aspect: "AttributeScore rows carry only id + created_at (no version/updated_at, no update endpoint); a second POST for the same (assignment_id, attribute) fails with ERR_SCORE_ALREADY_SUBMITTED."
        test_recipe:
          setup:
            - "Study IN_PROGRESS (1 control arm, tp0, chamber 20C); session S (tp0, arm, 10:00-11:00) OPEN at clock 2026-08-01T10:00:00Z; panelist P QUALIFIED and ASSIGNED"
            - "One score (OVERALL, 9) already recorded for the assignment"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Imm Co", contact_email: "imm@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Waffles", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp_id: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-IM", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp_id}", arm_id: "${arm_id}", scheduled_start_utc: "2026-08-01T10:00:00Z", scheduled_end_utc: "2026-08-01T11:00:00Z" }, as: PanelCoordinator, captures: { sess_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "Imm Pan", email: "im@lab.com", qualified_attributes: ["APPEARANCE", "AROMA", "FLAVOR", "TEXTURE", "OFF_FLAVOR", "OVERALL"] }, as: PanelCoordinator, captures: { p: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${sess_id}", panelist_id: "${p}" }, as: PanelCoordinator, captures: { a: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions/${sess_id}/open", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a}", attribute: "OVERALL", score: 9 }, as: Panelist, as_user_id: "${p}", captures: { score_id: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a}", attribute: "OVERALL", score: 7 }, as: Panelist, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "duplicate (assignment_id, attribute) rejected: error_id == ERR_SCORE_ALREADY_SUBMITTED (http 409)"
            - "AttributeScore.${score_id} still holds score == 9 (immutable event; unchanged by the rejected write)"
            - "AttributeScore.${score_id} has no version field (common_fields false)"
            - "PanelAssignment.${a}.status == ASSIGNED (SUBMITTED only at the 6th distinct attribute)"

      - name: clients_list_pagination
        claim_type: listing
        grounds: ["endpoints[GET /sensory-lab/clients]", response_envelope]
        distinguishing_aspect: "limit=2 over 3 clients returns total_count 3, has_more true, 2 rows; offset=2 returns the last row with has_more false; default sort created_at ASC."
        test_recipe:
          setup: ["three clients created in order cA, cB, cC"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "C A", contact_email: "ca@acme.com" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "C B", contact_email: "cb@acme.com" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "C C", contact_email: "cc@acme.com" }, as: LabDirector }
          trigger:
            - { call: "GET /sensory-lab/clients", payload: { limit: 2, offset: 0 }, as: LabDirector, captures: { first_name: "$.data[0].name" } }
            - { call: "GET /sensory-lab/clients", payload: { limit: 2, offset: 2 }, as: LabDirector, captures: { last_name: "$.data[0].name" } }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true, first row name == 'C A' (created_at ASC)"
            - "page 2: 1 row, has_more == false, row name == 'C C'"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: study_terminal_aborted_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Study, "errors[ERR_INVALID_STUDY_STATE]"]
        distinguishing_aspect: "From terminal ABORTED no further transition is possible: submit-design on an aborted study returns ERR_INVALID_STUDY_STATE and nothing changes."
        test_recipe:
          setup: ["study with 1 control arm + tp0, aborted from DRAFT"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "Term Co", contact_email: "term@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Bars", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/abort", payload: {}, as: LabDirector }
          trigger:
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STUDY_STATE (http 409); Study.${study_id}.status remains ABORTED"

      - name: session_lock_from_planned_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EvaluationSession, "errors[ERR_INVALID_SESSION_STATE]"]
        distinguishing_aspect: "LOCK requires OPEN: locking a PLANNED session is rejected; lock is also rejected from CANCELLED."
        test_recipe:
          setup: ["study SCHEDULED with 1 control arm, tp0; session S (tp0, arm, 2026-08-02 10:00-11:00) PLANNED; second session S2 (tp1, arm) CANCELLED"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "Lock Co", contact_email: "lock@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Bagels", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 1 }, as: SensoryScientist, captures: { tp1: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp0}", arm_id: "${arm_id}", scheduled_start_utc: "2026-08-02T10:00:00Z", scheduled_end_utc: "2026-08-02T11:00:00Z" }, as: PanelCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp1}", arm_id: "${arm_id}", scheduled_start_utc: "2026-08-02T12:00:00Z", scheduled_end_utc: "2026-08-02T13:00:00Z" }, as: PanelCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /sensory-lab/evaluation-sessions/${s2}/cancel", payload: {}, as: PanelCoordinator }
          trigger:
            - { call: "POST /sensory-lab/evaluation-sessions/${s1}/lock", payload: {}, as: PanelCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /sensory-lab/evaluation-sessions/${s2}/lock", payload: {}, as: PanelCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "lock from PLANNED rejected: ERR_INVALID_SESSION_STATE"
            - "lock from CANCELLED (terminal) rejected: ERR_INVALID_SESSION_STATE"
            - "both sessions' statuses unchanged (PLANNED / CANCELLED)"

      - name: time_point_close_from_pending_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SamplingTimePoint, "errors[ERR_INVALID_TIME_POINT_STATE]"]
        distinguishing_aspect: "close requires EVALUATED: closing a PENDING time point returns ERR_INVALID_TIME_POINT_STATE."
        test_recipe:
          setup: ["study DRAFT with 1 control arm and tp0 PENDING"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "TP Co", contact_email: "tp@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Tortillas", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 30, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp0: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/sampling-time-points/${tp0}/close", payload: {}, as: SensoryScientist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TIME_POINT_STATE (http 409); status remains PENDING"

      - name: panelist_screening_threshold_boundary
        claim_type: valid_transition
        grounds: [state_machines.Panelist.APPLIED_to_TRAINING, state_machines.Panelist.APPLIED_to_SCREENED_OUT]
        distinguishing_aspect: "Branching on the inclusive boundary: acuity 80 -> TRAINING, acuity 79 -> SCREENED_OUT; SCREENED_OUT is terminal (further screening attempt rejected)."
        test_recipe:
          setup: ["two APPLIED panelists"]
          setup_api_calls:
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "Edge Pass", email: "edge1@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "Edge Fail", email: "edge2@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /sensory-lab/panelists/${p1}/record-screening", payload: { acuity_score: 80 }, as: PanelCoordinator, captures: { st1: $.data.status } }
            - { call: "POST /sensory-lab/panelists/${p2}/record-screening", payload: { acuity_score: 79 }, as: PanelCoordinator, captures: { st2: $.data.status } }
            - { call: "POST /sensory-lab/panelists/${p2}/record-screening", payload: { acuity_score: 95 }, as: PanelCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "acuity 80 (inclusive): Panelist.${p1}.status == TRAINING and screening_acuity_score == 80"
            - "acuity 79: Panelist.${p2}.status == SCREENED_OUT"
            - "SCREENED_OUT is terminal: second record-screening rejected with ERR_INVALID_PANELIST_STATE"

      - name: panelist_deactivate_reactivate_cycle
        claim_type: valid_transition
        grounds: [state_machines.Panelist.QUALIFIED_to_INACTIVE, state_machines.Panelist.INACTIVE_to_QUALIFIED]
        distinguishing_aspect: "Cyclic QUALIFIED -> INACTIVE -> QUALIFIED; reactivation with consistency_index_final null takes the direct (non-remedial) branch."
        test_recipe:
          setup: ["panelist QUALIFIED (screening 90, 3 trainings)"]
          setup_api_calls:
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "Cyc Pan", email: "cyc@lab.com", qualified_attributes: ["OVERALL"] }, as: PanelCoordinator, captures: { p: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p}/record-training", payload: {}, as: PanelCoordinator, captures: { st_q: $.data.status } }
          trigger:
            - { call: "POST /sensory-lab/panelists/${p}/deactivate", payload: {}, as: PanelCoordinator, captures: { st_i: $.data.status } }
            - { call: "POST /sensory-lab/panelists/${p}/reactivate", payload: {}, as: PanelCoordinator, captures: { st_q2: $.data.status } }
          assert:
            - "3rd record-training flips TRAINING -> QUALIFIED (counter reaches 3)"
            - "deactivate: status == INACTIVE"
            - "reactivate with null consistency_index_final: status == QUALIFIED (remedial branch NOT taken)"

      - name: makeup_session_links_cancelled_source
        claim_type: side_effect_execution
        grounds: [state_machines.EvaluationSession.CANCELLED_to_PLANNED, entities.EvaluationSession.fields.makeup_of_id]
        distinguishing_aspect: "schedule-makeup on a CANCELLED session creates a NEW PLANNED session with makeup_of_id == source id; the CANCELLED source does not block re-creation for the same (time_point, arm) — self-referential linkage verifiable via GET filter."
        test_recipe:
          setup: ["study SCHEDULED, 1 control arm, tp0; session S (tp0, arm) CANCELLED"]
          setup_api_calls:
            - { call: "POST /sensory-lab/clients", payload: { name: "MU Co", contact_email: "mu@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
