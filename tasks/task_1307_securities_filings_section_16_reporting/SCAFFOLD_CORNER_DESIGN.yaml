      - name: body_reference_missing_person_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A body-referenced reporting_person_id that does not exist is rejected with ERR_INVALID_REQUEST (400), distinct from path-id 404 handling."
