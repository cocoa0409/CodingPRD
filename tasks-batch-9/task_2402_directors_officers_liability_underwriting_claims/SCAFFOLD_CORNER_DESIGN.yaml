        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[insured-control-update-stale]
          - concurrency_rules[quote-create-stale-submission]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Both §1.2.1 rules whose parent is written by an ordinary operator action are covered here.
          The token is the PARENT's version, and it advances on every write to that parent — including
          the scoring run, which is why a quote issued from a pre-score read of the submission is
          refused. A refused write must be a complete no-op: the field the caller tried to change is
          unchanged and the version has not moved, so re-reading and retrying succeeds.
        test_recipe:
          setup:
            - "One insured (version captured at creation) with one disclosure package, and one submission that is created and then scored, so its version has advanced past the value a caller read at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
