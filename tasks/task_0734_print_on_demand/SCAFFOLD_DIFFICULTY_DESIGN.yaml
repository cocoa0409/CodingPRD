      - name: route_refund_conserves_partner_backlog_hours
        grounds:
          - state_machines.Order.PENDING_to_ROUTED
          - state_machines.Order.CAPTURED_to_REFUND_FULL
          - entities.FulfillmentPartner.fields.current_backlog_hours
        distinguishing_aspect: |
          Conserved quantity: FulfillmentPartner.current_backlog_hours. Formula:
          route(item_count=2) increments backlog by 1; refund_full while ROUTED decrements
          backlog by 1. Hence backlog_pre_route == backlog_post_refund. Different quantity
          than instance A (hours vs cents, and different entity: FulfillmentPartner vs Creator).
        test_recipe:
          setup:
            - "One US FulfillmentPartner starting with current_backlog_hours == 0."
            - "One VERIFIED Creator, PUBLISHED Listing, and an order created/authorized/captured (item_count=2). backlog becomes 1 post-capture."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pod/fulfillment-partners"
              payload: { name: "US Print R", country_code: "US", cost_multiplier_bps: 10000, max_backlog_hours: 168 }
              as: PlatformAdmin
              captures: { fp_a_id: $.data.id }
            - call: "GET /pod/fulfillment-partners/${fp_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { backlog_pre_route: $.data.current_backlog_hours }
            - call: "POST /pod/products"
              payload: { sku: "T-R", category: "APPAREL", base_cost_cents: 2000, dimensions_json: { width_px: 3000, height_px: 3600, dpi: 300 } }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /pod/products/${prod_id}/variants"
              payload: { color: "BLACK", size: "M" }
              as: PlatformAdmin
              captures: { var_id: $.data.id }
            - call: "POST /pod/creators/register"
              payload: { email: "r@example.com", display_name: "R", payout_country_code: "US" }
              as: Anonymous
              captures: { creator_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /pod/storefronts"
              payload: { creator_id: "${creator_id}", slug: "r-sf", integration_channel: "NATIVE", markup_bps: 5000 }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sf_id: $.data.id }
            - call: "POST /pod/creators/${creator_id}/designs"
              payload: { file_hash: "hash_r_1" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { design_id: $.data.id }
            - call: "POST /pod/designs/${design_id}/mockup"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /pod/designs/${design_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/listings"
              payload: { storefront_id: "${sf_id}", design_id: "${design_id}", variant_id: "${var_id}", title: "R Tee" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /pod/listings/${listing_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
            - call: "POST /pod/orders"
              payload: { storefront_id: "${sf_id}", listing_id: "${listing_id}", buyer_email: "buy@x.com", ship_country_code: "US", item_count: 2, is_sample: false }
              as: Anonymous
              captures: { order_id: $.data.id, order_gross: $.data.gross_amount_cents }
            - call: "POST /pod/orders/${order_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/orders/${order_id}/capture"
              payload: {}
              as: PlatformAdmin
            - call: "GET /pod/fulfillment-partners/${fp_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { backlog_post_route: $.data.current_backlog_hours }
          trigger:
            - call: "POST /pod/orders/${order_id}/refund"
              payload: { refund_amount_cents: "${order_gross}" }
              as: PlatformAdmin
            - call: "GET /pod/fulfillment-partners/${fp_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { backlog_post_refund: $.data.current_backlog_hours }
          assert:
            - "backlog_pre_route == 0"
            - "backlog_post_route == 1"
            - "backlog_post_refund == 0"
            - "backlog_pre_route == backlog_post_refund"
