              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Cleo Hart", email: "cleo.hart@example.com", mobile_number: "+15550100003" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_h}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643803" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "GET /device-units"
              payload: { loan_id: "${loan}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { dev: "$.data[0].id" }
            - call: "POST /customers/${cust}/carrier-accounts"
              payload: { carrier_code: "ATT", account_number: "ACC-2810-0003" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { carr: "$.data.id" }
            - call: "POST /device-units/${dev}/activation"
              payload: { carrier_account_id: "${carr}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 29688 }
