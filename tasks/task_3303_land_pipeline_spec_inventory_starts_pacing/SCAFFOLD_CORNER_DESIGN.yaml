scaffold_corner_design:

  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: create_community_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.Community]
        distinguishing_aspect: "POST /communities with required inputs returns 201 with phase PLANNING, standing_spec_count 0, starts_this_period 0, lifetime_closed_sales 0, posture STARVED (0/1.0 = 0.0 < 1.5), starts_halted false, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id, ph: $.data.phase, ssc: $.data.standing_spec_count, v: $.data.version} }
          trigger: []
          assert:
            - "Community.${com}.phase == PLANNING"
            - "Community.${com}.standing_spec_count == 0 and version == 1"

      - name: home_computed_fields_at_creation
        claim_type: computed_fields
        grounds: [entities.Home.fields.gross_price_cents, entities.Home.fields.adjusted_price_cents]
        distinguishing_aspect: "On creation with no ACTIVE incentives: gross 40,000,100, adjusted 40,000,100 (PERMITTED multiplier 1.00), stacked 0, net 40,000,100; client-supplied computed fields would be ignored."
        test_recipe:
          setup: ["standard open community with lots, plan, capacity"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
          trigger:
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000, lot_premium_cents: 100}, as: COMMUNITY_MANAGER, captures: {g: $.data.gross_price_cents, adj: $.data.adjusted_price_cents, net: $.data.net_effective_price_cents, stk: $.data.stacked_incentive_cents} }
          assert:
            - "gross_price_cents == 40000100; adjusted_price_cents == 40000100; stacked_incentive_cents == 0; net_effective_price_cents == 40000100"

      - name: get_home_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /homes/{random-uuid} returns 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /homes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: COMMUNITY_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "response HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: trade_partner_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.TradePartner.fields.trade, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /trade-partners with trade 'PAINTING' (not in enum) returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trade-partners", payload: {name: "PaintCo", trade: "PAINTING"}, as: DIVISION_PRESIDENT, captures: {err: $.data.error_id} }
          assert:
            - "response HTTP 400 with error_id == ERR_VALIDATION"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: home_initial_state_and_lot_consumption
        claim_type: initial_state_and_side_effect
        grounds: [state_machines.Home, state_machines.Lot]
        distinguishing_aspect: "A started home begins PERMITTED/UNSOLD; its lot flips BANKED -> CONSUMED in the same request."
        test_recipe:
          setup: ["standard open community with lots, plan, capacity"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id", lot1st: "$.data[0].state"} }
          trigger:
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id, bs: $.data.build_stage, ss: $.data.sales_status} }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1st_after: "$.data[0].state"} }
          assert:
            - "Lot state before start == BANKED; after == CONSUMED"
            - "Home created with build_stage == PERMITTED and sales_status == UNSOLD"

      - name: advance_stage_from_complete_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Home, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "advance-stage on a COMPLETE home (no further build transition) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["home H1 driven to COMPLETE"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "response HTTP 409 with error_id == ERR_INVALID_STATE"

      - name: terminate_closed_contract_returns_not_terminable
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SalesContract, "errors[ERR_SALES_CONTRACT_NOT_TERMINABLE]"]
        distinguishing_aspect: "Terminate on a CLOSED contract returns 409 ERR_SALES_CONTRACT_NOT_TERMINABLE; no home side effects fire."
        test_recipe:
          setup: ["home built COMPLETE, contract approved and CLOSED"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts", payload: {home_id: "${h1}", buyer_name: "Buyer A", contract_price_cents: 41200000}, as: SALES_AGENT, captures: {sc1: $.data.id} }
            - { call: "POST /sales-contracts/${sc1}/approve", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts/${sc1}/close", payload: {}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /sales-contracts/${sc1}/terminate", payload: {}, as: SALES_AGENT, captures: {err: $.data.error_id} }
          assert:
            - "response HTTP 409 with error_id == ERR_SALES_CONTRACT_NOT_TERMINABLE"
            - "Home.${h1}.sales_status remains CLOSED_SALE"

      - name: takedown_auto_default_and_contract_cure_cycle
        claim_type: auto_transition_and_cycle
        grounds: [state_machines.Takedown.SCHEDULED_to_DEFAULTED, state_machines.OptionContract.DEFAULTED_to_ACTIVE]
        distinguishing_aspect: "Clock advance past window_end auto-defaults the takedown and its contract; cure returns the contract to ACTIVE and charges cure_fee_cents == 50,000 (round_half_up(500,000 * 0.10))."
        test_recipe:
          setup: ["contract ACTIVE with one SCHEDULED takedown; clock moved past window_end"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-09-11T00:00:00Z"}, as: DIVISION_PRESIDENT }
            - { call: "GET /option-contracts/${c1}/takedowns", as: LAND_MANAGER, captures: {t1st: "$.data[0].state"} }
            - { call: "GET /option-contracts/${c1}", as: LAND_MANAGER, captures: {cst: $.data.state} }
          trigger:
            - { call: "POST /option-contracts/${c1}/cure", payload: {}, as: LAND_MANAGER, captures: {cst2: $.data.state, fee: $.data.cure_fee_cents} }
          assert:
            - "Takedown.${t1}.state == DEFAULTED and contract state == DEFAULTED after clock passes window_end"
            - "after cure: contract state == ACTIVE and cure_fee_cents == 50000"

      - name: close_requires_home_complete
        claim_type: precondition_enforcement
        grounds: [state_machines.SalesContract.APPROVED_to_CLOSED, "errors[ERR_HOME_NOT_COMPLETE]"]
        distinguishing_aspect: "Close on an APPROVED contract whose home is still FRAME returns 409 ERR_HOME_NOT_COMPLETE; the contract stays APPROVED."
        test_recipe:
          setup: ["home H1 at FRAME with APPROVED contract"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {h1: $.data.id} }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /homes/${h1}/advance-stage", payload: {}, as: COMMUNITY_MANAGER }
            - { call: "POST /sales-contracts", payload: {home_id: "${h1}", buyer_name: "Buyer A", contract_price_cents: 40400000}, as: SALES_AGENT, captures: {sc1: $.data.id} }
            - { call: "POST /sales-contracts/${sc1}/approve", payload: {}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /sales-contracts/${sc1}/close", payload: {}, as: COMMUNITY_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "response HTTP 409 with error_id == ERR_HOME_NOT_COMPLETE"
            - "SalesContract.${sc1}.state remains APPROVED"

      - name: sales_contract_create_on_sold_home_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Home.UNSOLD_to_RESERVED, "errors[ERR_HOME_NOT_UNSOLD]"]
        distinguishing_aspect: "Creating a second contract on a home already RESERVED returns 409 ERR_HOME_NOT_UNSOLD."
        test_recipe:
          setup: ["home H1 with PENDING contract SC1 (home RESERVED)"]
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
