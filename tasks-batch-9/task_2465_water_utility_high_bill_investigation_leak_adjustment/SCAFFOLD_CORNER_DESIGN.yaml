      - name: corner_entity_type_constraints_bad_enum_and_out_of_range_numbers_rejected
        claim_type: type_constraints
        grounds:
          - validations[ERR_INVALID_REQUEST]
          - entities.BillingPeriod.fields.season
          - entities.Meter.fields.size_inches
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Priority 3 covers three distinct schema failures on bodies that are otherwise complete:
          an out-of-set enum (season AUTUMN), a numeric range violation (size_inches 0 against
          the declared > 0), and a pagination bound (limit 101 against the declared max 100).
          All three return 400 ERR_INVALID_REQUEST, and the well-formed control call succeeds, so
          the check cannot be passing by rejecting everything.
        test_recipe:
          setup:
            - "RS-STD-2026 and ServiceAccount ACC-2007 exist; no BillingPeriod and no Meter exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
