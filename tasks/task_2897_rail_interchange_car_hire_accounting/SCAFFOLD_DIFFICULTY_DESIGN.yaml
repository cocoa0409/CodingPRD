          - entities.Car.fields.routing_status
          - endpoints.POST_car-hire_cars_id_bad-order-report
          - endpoints.POST_car-hire_cars_id_release-to-service
          - endpoints.POST_car-hire_cars_id_empty-routing-obligation
        distinguishing_aspect: |
          Car carries THREE orthogonal state dimensions. Issuing an empty-routing
          obligation while the car is BAD_ORDER must move routing_status
          NO_OBLIGATION -> OBLIGATION_ACTIVE and leave mechanical_status BAD_ORDER
          untouched; releasing to service must then move mechanical_status back to
          SERVICEABLE while leaving routing_status OBLIGATION_ACTIVE and
          custody_status ON_FOREIGN_ROAD untouched. A single collapsed `status` field
          cannot represent the intermediate combination
          (ON_FOREIGN_ROAD, BAD_ORDER, OBLIGATION_ACTIVE), which is asserted explicitly.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI."
            - "CX-owned car CX 100005 starts ON_HOME_ROAD / SERVICEABLE / NO_OBLIGATION, then is delivered to BN at 2026-08-26T00:00:00Z."
