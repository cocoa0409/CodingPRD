            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000608", model_line: "LX500" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "UNDERBODY", severity_points: 35, repair_estimate_cents: 90000 }] }
              as: DamageSurveyor
              as_user_id: "u-ds-1"
              captures: { survey_id: $.data.id, stale_sv: $.data.version, sev: $.data.severity_index }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
