          assert:
            - "the first plan read shows guaranteed_seat_total 5, required_seat_total 4, seat_shortfall 0, committed_seat_total 0, open_student_count 1, at_risk_student_count 0, substituted_guarantee_count 0 and waived_guarantee_count 0 — the aggregates are right immediately after the sources were created"
