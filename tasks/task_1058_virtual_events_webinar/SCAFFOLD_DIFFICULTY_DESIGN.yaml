            - "SessionSpeaker.${ss_id}.invite_round == 2"
            - "Speaker.${spk_id}.accepted_session_count == 1"
            - "Speaker.${spk_id}.engagement_status == ENGAGED"
            - "Session.${ses_id}.accepted_speaker_count == 1"

  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_chains_session_to_broadcast_to_recording
        grounds:
          - state_machines.Event.PUBLISHED_to_CANCELLED
          - state_machines.Session.DRAFT_SCHEDULED_LIVE_to_CANCELLED
          - state_machines.Broadcast.SCHEDULED_PREVIEW_LIVE_to_ABORTED
          - state_machines.Recording.PENDING_PROCESSING_READY_PUBLISHED_to_RETRACTED
        distinguishing_aspect: |
          DEPTH-3 chain triggered by event cancellation: cancelling the Event cancels the Session
          (link 1); because the Session became CANCELLED its LIVE Broadcast is ABORTED (link 2);
          because the Broadcast became ABORTED its PENDING Recording is RETRACTED (link 3). The
          Recording is never touched by the original cancel call.
        test_recipe:
          setup:
            - "Event 'Summit G' LIVE, one track, one SCHEDULED session with one ACCEPTED speaker."
            - "That session's broadcast is LIVE (session LIVE), so exactly one Recording exists in state PENDING."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit G", timezone: "UTC", starts_at: "2026-09-16T09:00:00Z", ends_at: "2026-09-16T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "Keynote", starts_at: "2026-09-16T10:00:00Z", ends_at: "2026-09-16T11:00:00Z", session_type: "LIVE", capacity: 500 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ses_id: $.data.id }
            - call: "POST /api/events/${ev_id}/speakers"
              payload: { full_name: "Mia Chen", email: "mia@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { spk_id: $.data.id }
            - call: "POST /api/session-speakers"
              payload: { session_id: "${ses_id}", speaker_id: "${spk_id}", speaking_role: "HOST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { ss_id: $.data.id }
            - call: "POST /api/session-speakers/${ss_id}/accept"
              payload: {}
              as: SpeakerUser
              as_user_id: "${spk_id}"
            - call: "POST /api/sessions/${ses_id}/schedule"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/broadcasts"
              payload: { session_id: "${ses_id}", ingest_region: "EU_WEST" }
              as: Organizer
              as_user_id: "org-1"
              captures: { bc_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/start"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/broadcasts/${bc_id}/preview"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/broadcasts/${bc_id}/go-live"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "GET /api/recordings"
              payload: { broadcast_id: "${bc_id}" }
              as: Organizer
              as_user_id: "org-1"
              captures: { rec_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/events/${ev_id}/cancel"
              payload: { reason: "venue platform outage" }
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "Event.${ev_id}.state == CANCELLED"
            - "Session.${ses_id}.state == CANCELLED"
            - "Broadcast.${bc_id}.state == ABORTED"
            - "Recording.${rec_id}.state == RETRACTED"
            - "SessionSpeaker.${ss_id}.state == RELEASED"
            - "Speaker.${spk_id}.accepted_session_count == 0"
            - "Speaker.${spk_id}.engagement_status == UNASSIGNED"
            - "Event.${ev_id}.published_recording_count == 0"

      - name: refund_chains_seat_release_to_availability_flip_to_waitlist_promotion
        grounds:
          - state_machines.Registration.payment_status_PAID_to_REFUNDED
          - calculations.ticket_availability
          - state_machines.Registration.attendance_status_WAITLISTED_to_REGISTERED
          - entities.TicketType.fields.availability_status
        distinguishing_aspect: |
          DEPTH-3 chain from a DIFFERENT trigger (registration refund, not event cancellation):
          the refund releases the seat and decrements sold_count (link 1); because sold_count fell
          below quota, ticket_availability flips availability_status SOLD_OUT -> AVAILABLE (link 2);
          because availability_status became AVAILABLE, the earliest-created WAITLISTED registration
          is promoted to REGISTERED and priced (link 3), which pushes sold_count back to 1 and
          availability_status back to SOLD_OUT.
        test_recipe:
          setup:
            - "Event 'Summit H' PUBLISHED with a GENERAL ticket type at 20000 cents and quota 1, early_bird_ends_at in the past."
            - "Registration A holds the single seat and is PAID at 20600 cents, so the ticket type is SOLD_OUT and Event.gross_collected_cents is 20600."
            - "Registration B was created with waitlist_if_full true and is therefore WAITLISTED with amount_due_cents 0."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit H", timezone: "UTC", starts_at: "2026-09-17T09:00:00Z", ends_at: "2026-09-17T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 50 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 1, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "a@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_a: $.data.id }
            - call: "POST /api/registrations/${reg_a}/pay"
              payload: { amount_cents: 20600 }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "b@example.com", waitlist_if_full: true }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_b: $.data.id, b_status_before: $.data.attendance_status }
          trigger:
            - call: "POST /api/registrations/${reg_a}/refund"
              payload: { reason: "attendee cancelled" }
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "${b_status_before} == WAITLISTED"
            - "Registration.${reg_a}.payment_status == REFUNDED"
            - "Registration.${reg_a}.attendance_status == WITHDRAWN"
            - "Registration.${reg_a}.amount_paid_cents == 0"
            - "Registration.${reg_b}.attendance_status == REGISTERED"
            - "Registration.${reg_b}.amount_due_cents == 20600"
            - "TicketType.${tt_id}.sold_count == 1"
            - "TicketType.${tt_id}.availability_status == SOLD_OUT"
            - "Event.${ev_id}.gross_collected_cents == 0"
            - "Event.${ev_id}.registered_count == 1"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: registration_on_live_event_reports_event_not_open_over_sold_out
        grounds:
          - "validations[priority=30]"
          - "validations[priority=70]"
          - "errors[ERR_EVENT_NOT_OPEN]"
          - "errors[ERR_TICKET_SOLD_OUT]"
        distinguishing_aspect: |
          Error-category pair STATE (priority 30, ERR_EVENT_NOT_OPEN) vs BUSINESS_FISCAL
          (priority 70, ERR_TICKET_SOLD_OUT): the request violates both, and the lower-priority
          number wins, so the response carries ERR_EVENT_NOT_OPEN with HTTP 409.
        test_recipe:
          setup:
            - "Event 'Summit I' advanced to LIVE, so registration is closed by the state gate."
            - "Its only ticket type has quota 1 and sold_count 1, so it is also SOLD_OUT."
          setup_api_calls:
