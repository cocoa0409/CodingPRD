          assert:
            - "IPSAmendment.${am}.status == APPROVED and finalized_by_user_id == 'chair-1'"
            - "hop 1: InvestmentPolicyStatement.${i}.review_cadence_months == 6 and next_review_due == 2027-02-01T00:00:00Z (month_add of finalize clock 2026-08-01)"
            - "hop 2: RebalanceProposal.${prop}.status == EXPIRED (pinned_ips_version stale after IPS version bump)"
            - "hop 3: the proposal's SELL trade is CANCELLED (GET trade-instructions?proposal_id&status=CANCELLED total_count == 1)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (3 instances, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_frozen_with_restricted_trade_state_beats_safety
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PORTFOLIO_NOT_ACTIVE]
          - errors[ERR_SECURITY_RESTRICTED]
        distinguishing_aspect: |
          Category pair (state, business_safety): execute on a FROZEN portfolio whose proposal
          contains a trade that became restricted after approval fails with the state error
          ERR_PORTFOLIO_NOT_ACTIVE (priority 7), never the safety error ERR_SECURITY_RESTRICTED
          (priority 9), although both conditions hold.
        test_recipe:
          setup:
            - "60/40 fixture; portfolio BREACHED after reprice EQA 1500; proposal generated and APPROVED while unrestricted (no trades BLOCKED)"
            - "then: NO_TRADE restriction on EQA with ACTIVE window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z); portfolio FROZEN"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Prio Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 400000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 600, opening_cost_basis_cents: 480000 }, as: Advisor }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1500 }, as: ComplianceOfficer }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { prop: $.data.id } }
            - { call: "POST /advisory/rebalance-proposals/${prop}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_TRADE, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", reason: "investigation" }, as: ComplianceOfficer }
            - { call: "POST /advisory/portfolios/${p}/freeze", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/rebalance-proposals/${prop}/execute", as: Advisor, captures: { err: $.data.error_id } }
          assert:
            - "execute returns http 409 with error_id ERR_PORTFOLIO_NOT_ACTIVE (state, priority 7) — NOT ERR_SECURITY_RESTRICTED (safety, priority 9), though the EQA trade is restricted"
            - "RebalanceProposal.${prop}.status remains APPROVED; no trade executed; portfolio cash unchanged at 400000"

      - name: finalize_draft_minute_missing_ref_safety_beats_referential
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_AMENDMENT_MINUTE_NOT_RATIFIED]
          - errors[ERR_AMENDMENT_NOT_IN_MINUTE]
        distinguishing_aspect: |
          Category pair (business_safety, business_referential): finalize citing a DRAFT minute
          that also lacks the amendment in amendment_refs fails with the fiduciary-gate safety
          error ERR_AMENDMENT_MINUTE_NOT_RATIFIED (priority 9), not the referential error
          ERR_AMENDMENT_NOT_IN_MINUTE (priority 10), although both hold.
        test_recipe:
          setup:
            - "60/40 fixture with ACTIVE IPS"
            - "amendment A2 (proposed_objective_text only) SUBMITTED, 3 APPROVE votes -> QUORUM_REACHED"
            - "minute M0 recorded by cm-1 with amendment_refs == [] (does NOT reference A2), left DRAFT"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Gate Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}", proposed_objective_text: "Capital preservation first" }, as: Advisor, as_user_id: "adv-1", captures: { am: $.data.id } }
            - { call: "POST /advisory/ips-amendments/${am}/submit", as: Advisor, as_user_id: "adv-1" }
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-3" }
            - { call: "POST /advisory/committee-minutes", payload: { meeting_date: "2026-08-01", amendment_refs: [], decisions_text: "No decisions" }, as: CommitteeMember, as_user_id: "cm-1", captures: { min: $.data.id } }
            - { call: "GET /advisory/ips-policies/${i}", as: Advisor, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /advisory/ips-amendments/${am}/finalize", payload: { ratified_minute_id: "${min}", expected_ips_version: "${iv}" }, as: CommitteeChair, as_user_id: "chair-1", captures: { err: $.data.error_id } }
          assert:
            - "finalize returns http 422 with error_id ERR_AMENDMENT_MINUTE_NOT_RATIFIED — NOT ERR_AMENDMENT_NOT_IN_MINUTE, though the minute also lacks the amendment ref"
            - "IPSAmendment.${am}.status remains QUORUM_REACHED; IPS unchanged (review_cadence_months still 12)"

      - name: settle_wrong_state_and_overdrawn_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_WITHDRAWAL_INVALID_STATE]
          - errors[ERR_WITHDRAWAL_EXCEEDS_VALUE]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): settle on a withdrawal that was reverted to
          SUBMITTED AND whose amount (300000) now exceeds total_value (220000) fails with
          ERR_WITHDRAWAL_INVALID_STATE (priority 7), not ERR_WITHDRAWAL_EXCEEDS_VALUE
          (priority 13), although both hold.
        test_recipe:
          setup:
            - "P3 fixture (cash 100000, three lots, total 400000); W amount 300000 TAX_AWARE created and MODELED"
            - "manual WITHDRAWAL cash movement of 100000 (cash -> 0, allowed at equality) reverts W to SUBMITTED"
            - "reprice EQA 1000 -> 200 drops LOT1 MV to 20000: total_value 220000 < amount 300000"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Settle Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 20.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 20.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqa: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQB", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqb: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqa}", quantity: 100, opening_cost_basis_cents: 90000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqb}", quantity: 100, opening_cost_basis_cents: 40000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eib}", quantity: 200, opening_cost_basis_cents: 110000 }, as: Advisor }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 300000, funding_mode: TAX_AWARE }, as: Advisor, captures: { w: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests/${w}/model-impact", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: WITHDRAWAL, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities/${s_eqa}/reprice", payload: { new_price_cents: 200 }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/withdrawal-requests/${w}/settle", as: Advisor, captures: { err: $.data.error_id } }
          assert:
            - "settle returns http 409 with error_id ERR_WITHDRAWAL_INVALID_STATE — NOT ERR_WITHDRAWAL_EXCEEDS_VALUE, though amount 300000 > total_value 220000 also holds"
            - "WithdrawalRequest.${w}.status remains SUBMITTED; no CashFlowEvents appended by the failed settle"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (4 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: drift_band_equality_is_not_a_breach
        grounds:
          - calculations.drift_assessment
          - entities.Portfolio.fields.drift_status
        distinguishing_aspect: |
          Metric: basis-point drift. Endpoint: POST /advisory/securities/{id}/reprice.
          Breach requires drift_bps STRICTLY greater than band_bps: at exactly 500 == 500 the
          portfolio stays WITHIN_BANDS; one cent more (drift 502) flips it to BREACHED.
        test_recipe:
          setup:
            - "ACTIVE client, ACTIVE IPS targets US_EQUITY 60.00/5.00 + CASH_EQUIVALENT 40.00/5.00"
            - "portfolio ACTIVE: cash 350000; EQA 650 @ 1000 basis 520000 -> total 1000000, US exactly 65.00% (6500 bps), drift exactly 500 == band -> WITHIN_BANDS"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Boundary Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 350000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 650, opening_cost_basis_cents: 520000 }, as: Advisor }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { drift_at_band: $.data.drift_status } }
          trigger:
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1001 }, as: ComplianceOfficer }
          assert:
            - "at price 1000 (drift exactly 500bps == band 500bps): Portfolio.${p}.drift_status == WITHIN_BANDS (strict > semantics: equality is NOT a breach)"
            - "after reprice to 1001 (US 6502bps, drift 502 > 500): drift_status == BREACHED"

      - name: withdrawal_amount_equals_total_value_boundary
        grounds:
          - validations[priority=13]
          - errors[ERR_WITHDRAWAL_EXCEEDS_VALUE]
          - calculations.withdrawal_impact_model
        distinguishing_aspect: |
          Metric: cents of withdrawal amount vs total_value. Endpoint: POST
          /advisory/withdrawal-requests/{id}/model-impact. amount == total_value (400000) is
          allowed (full liquidation, <= semantics); amount == total + 1 (400001) is rejected
          ERR_WITHDRAWAL_EXCEEDS_VALUE.
        test_recipe:
          setup:
            - "P3 fixture: cash 100000; three lots totalling 300000; total_value 400000"
            - "W_eq amount 400000 TAX_AWARE; W_over amount 400001 TAX_AWARE"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "FullExit Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 20.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 20.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqa: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQB", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqb: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqa}", quantity: 100, opening_cost_basis_cents: 90000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqb}", quantity: 100, opening_cost_basis_cents: 40000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eib}", quantity: 200, opening_cost_basis_cents: 110000 }, as: Advisor }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 400000, funding_mode: TAX_AWARE }, as: Advisor, captures: { w_eq: $.data.id } }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 400001, funding_mode: TAX_AWARE }, as: Advisor, captures: { w_over: $.data.id } }
          trigger:
            - { call: "POST /advisory/withdrawal-requests/${w_eq}/model-impact", as: Advisor }
            - { call: "POST /advisory/withdrawal-requests/${w_over}/model-impact", as: Advisor, captures: { err: $.data.error_id } }
          assert:
            - "WithdrawalRequest.${w_eq}.status == MODELED (equality allowed): full liquidation plan, modeled_cash_used_cents == 100000, modeled_proceeds_cents == 300000"
            - "WithdrawalRequest.${w_eq}.post_withdrawal_drift_status == WITHIN_BANDS (projected total 0 -> vacuous)"
            - "model-impact on ${w_over} returns http 422 ERR_WITHDRAWAL_EXCEEDS_VALUE (400001 > 400000 by one cent)"

      - name: quorum_exactly_third_vote_flips_status
        grounds:
          - state_machines.IPSAmendment.SUBMITTED_to_QUORUM_REACHED
          - calculations.portfolio_valuation
        distinguishing_aspect: |
          Metric: distinct-vote count. Endpoint: POST /advisory/ips-amendments/{id}/vote.
          The amendment stays SUBMITTED at 2 approvals and auto-transitions at exactly the
          3rd (>= AMENDMENT_QUORUM); symmetrically the 3rd REJECT transitions to REJECTED.
        test_recipe:
          setup:
            - "ACTIVE IPS (60/40 fixture); amendment A_ok SUBMITTED; amendment A_no SUBMITTED"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Quorum Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}", proposed_review_cadence_months: 6 }, as: Advisor, as_user_id: "adv-1", captures: { am_ok: $.data.id } }
            - { call: "POST /advisory/ips-amendments/${am_ok}/submit", as: Advisor, as_user_id: "adv-1" }
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}", proposed_risk_tolerance_score: 45 }, as: Advisor, as_user_id: "adv-1", captures: { am_no: $.data.id } }
            - { call: "POST /advisory/ips-amendments/${am_no}/submit", as: Advisor, as_user_id: "adv-1" }
          trigger:
            - { call: "POST /advisory/ips-amendments/${am_ok}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-1", captures: { v1: $.data.approve_votes, s1: $.data.status } }
            - { call: "POST /advisory/ips-amendments/${am_ok}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-2", captures: { v2: $.data.approve_votes, s2: $.data.status } }
            - { call: "POST /advisory/ips-amendments/${am_ok}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-3", captures: { v3: $.data.approve_votes, s3: $.data.status } }
            - { call: "POST /advisory/ips-amendments/${am_no}/vote", payload: { decision: REJECT }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /advisory/ips-amendments/${am_no}/vote", payload: { decision: REJECT }, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "POST /advisory/ips-amendments/${am_no}/vote", payload: { decision: REJECT }, as: CommitteeMember, as_user_id: "cm-3", captures: { s_no: $.data.status } }
            - { call: "POST /advisory/ips-amendments/${am_ok}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-4", captures: { err4: $.data.error_id } }
          assert:
            - "after vote 1: approve_votes == 1 and status == SUBMITTED; after vote 2: approve_votes == 2 and status == SUBMITTED"
            - "after exactly the 3rd APPROVE: approve_votes == 3 and status == QUORUM_REACHED (threshold is cumulative and inclusive at 3)"
            - "A_no after 3rd REJECT: status == REJECTED (reject quorum mirrors approve quorum)"
            - "a 4th vote on ${am_ok} is rejected ERR_AMENDMENT_INVALID_STATE (QUORUM_REACHED no longer accepts votes)"

      - name: review_overdue_strictly_after_due_instant
        grounds:
          - calculations.ips_review_schedule
          - entities.InvestmentPolicyStatement.fields.review_overdue
        distinguishing_aspect: |
          Metric: timestamp comparison. Endpoints: POST /advisory/_clock/set_current_utc +
          GET /advisory/ips-policies/{id}. review_overdue requires now STRICTLY greater than
          next_review_due: at exactly 2027-08-01T00:00:00Z it is false; one second later true.
        test_recipe:
          setup:
            - "ACTIVE IPS activated at clock default 2026-08-01T00:00:00Z with cadence 12 -> next_review_due 2027-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Cadence Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /advisory/ips-policies/${i}", as: Advisor, captures: { od_eq: $.data.review_overdue } }
          trigger:
            - { call: "POST /advisory/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:01Z" }, as: PlatformAdmin }
            - { call: "GET /advisory/ips-policies/${i}", as: Advisor, captures: { od_gt: $.data.review_overdue } }
          assert:
            - "InvestmentPolicyStatement.${i}.next_review_due == 2027-08-01T00:00:00Z"
            - "at clock == next_review_due exactly: review_overdue == false (strict >)"
            - "at clock == next_review_due + 1s: review_overdue == true"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: amendment_finalize_gated_by_ratified_minute
        grounds:
          - state_machines.IPSAmendment.QUORUM_REACHED_to_APPROVED
          - state_machines.CommitteeMinute.DRAFT_to_RATIFIED
        distinguishing_aspect: |
          Pair IPSAmendment -> CommitteeMinute: finalize is rejected while the cited minute is
          DRAFT and succeeds only after that minute is RATIFIED by a different user
          (segregation of duties) — the amendment's valid transition depends on the minute's state.
        test_recipe:
          setup:
            - "ACTIVE IPS (60/40 fixture); amendment SUBMITTED + QUORUM_REACHED; minute M references the amendment, DRAFT"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Fiduciary Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}", proposed_objective_text: "Income oriented" }, as: Advisor, as_user_id: "adv-1", captures: { am: $.data.id } }
            - { call: "POST /advisory/ips-amendments/${am}/submit", as: Advisor, as_user_id: "adv-1" }
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-3" }
            - { call: "POST /advisory/committee-minutes", payload: { meeting_date: "2026-08-01", amendment_refs: [ "${am}" ], decisions_text: "Approved objective change" }, as: CommitteeMember, as_user_id: "cm-1", captures: { min: $.data.id } }
            - { call: "GET /advisory/ips-policies/${i}", as: Advisor, captures: { iv: $.data.version } }
          trigger:
            - { call: "POST /advisory/ips-amendments/${am}/finalize", payload: { ratified_minute_id: "${min}", expected_ips_version: "${iv}" }, as: CommitteeChair, as_user_id: "chair-1", captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/committee-minutes/${min}/ratify", as: CommitteeChair, as_user_id: "chair-1" }
            - { call: "POST /advisory/ips-amendments/${am}/finalize", payload: { ratified_minute_id: "${min}", expected_ips_version: "${iv}" }, as: CommitteeChair, as_user_id: "chair-1" }
          assert:
            - "first finalize: http 422 ERR_AMENDMENT_MINUTE_NOT_RATIFIED (minute DRAFT blocks the amendment transition)"
            - "after ratify (chair-1 != recorder cm-1): minute status RATIFIED"
            - "second finalize succeeds: amendment APPROVED; IPS objective_text == 'Income oriented'; ratified_minute_id == ${min}"

      - name: report_finalize_gated_by_benchmark_active
        grounds:
          - state_machines.PerformanceReport.DRAFT_to_FINALIZED
          - state_machines.Benchmark.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          Pair PerformanceReport -> Benchmark: finalizing a report whose benchmark has been
          RETIRED is rejected ERR_BENCHMARK_NOT_ACTIVE; the same finalize succeeds while the
          benchmark is ACTIVE. Different entity pair than amendment/minute.
        test_recipe:
          setup:
            - "client + portfolio exist; benchmark B2 created and RETIRED (no ACTIVE IPS references it); report R2 references B2"
            - "benchmark B3 ACTIVE; report R3 references B3 (same portfolio, disjoint period)"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Report Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Rep", tax_status: TAX_EXEMPT }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/benchmarks", payload: { name: "Retiring Bench", description: "old" }, as: ComplianceOfficer, captures: { b2: $.data.id } }
            - { call: "POST /advisory/benchmarks", payload: { name: "Live Bench", description: "current" }, as: ComplianceOfficer, captures: { b3: $.data.id } }
            - { call: "POST /advisory/benchmarks/${b2}/retire", as: ComplianceOfficer }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p}", benchmark_id: "${b2}", period_start: "2026-08-01", period_end: "2026-08-31", calculation_method: TIME_WEIGHTED, beginning_value_cents: 100000, ending_value_cents: 110000, benchmark_return_bps: 0 }, as: Advisor, captures: { r2: $.data.id } }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p}", benchmark_id: "${b3}", period_start: "2026-09-01", period_end: "2026-09-30", calculation_method: TIME_WEIGHTED, beginning_value_cents: 110000, ending_value_cents: 110000, benchmark_return_bps: 0 }, as: Advisor, captures: { r3: $.data.id } }
          trigger:
            - { call: "POST /advisory/performance-reports/${r2}/finalize", as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/performance-reports/${r3}/finalize", as: ComplianceOfficer }
          assert:
            - "finalize of ${r2}: http 422 ERR_BENCHMARK_NOT_ACTIVE (benchmark RETIRED)"
            - "finalize of ${r3} succeeds: status FINALIZED, portfolio_return_bps == 0, excess_return_bps == 0"
            - "PerformanceReport.${r2}.status remains DRAFT"

      - name: portfolio_activation_gated_by_active_ips
        grounds:
          - state_machines.Portfolio.OPEN_to_ACTIVE
          - state_machines.InvestmentPolicyStatement.PENDING_CLIENT_to_ACTIVE
          - errors[ERR_NO_ACTIVE_IPS]
        distinguishing_aspect: |
          Pair Portfolio -> InvestmentPolicyStatement: portfolio activation is rejected
          ERR_NO_ACTIVE_IPS while the client has no ACTIVE IPS, and succeeds (with drift
          assessed) once the IPS completes client-sign. Different pair than the other two instances.
        test_recipe:
          setup:
            - "ACTIVE client; portfolio P created (OPEN) BEFORE any IPS exists; then IPS built to ACTIVE"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Gate2 Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Early", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
          assert:
            - "first activate: http 409 ERR_NO_ACTIVE_IPS (IPS only PENDING_CLIENT at that point)"
            - "after client-sign: second activate succeeds; lifecycle_status == ACTIVE and drift_status == WITHIN_BANDS (total 0, vacuous)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: restriction_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=11]
          - errors[ERR_RESTRICTION_WINDOW_OVERLAP]
          - entities.RestrictedListEntry.fields.effective_from
        distinguishing_aspect: |
          Resource: Security restriction windows. Semantics: HALF-OPEN [from, to) — an entry
          whose effective_from equals another's effective_to is ADJACENT and allowed, while any
          positive-measure intersection is rejected. (Contrast with closed report periods.)
        test_recipe:
          setup:
            - "security EQR exists; clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /advisory/securities", payload: { ticker: "EQR", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
          trigger:
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_BUY, effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }, as: ComplianceOfficer, captures: { ra: $.data.id } }
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_TRADE, effective_from: "2026-08-20T00:00:00Z", effective_to: "2026-08-25T00:00:00Z" }, as: ComplianceOfficer, captures: { rb: $.data.id } }
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_BUY, effective_from: "2026-08-19T00:00:00Z", effective_to: "2026-08-21T00:00:00Z" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_TRADE, effective_from: "2026-08-09T00:00:00Z", effective_to: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, captures: { rd: $.data.id } }
          assert:
            - "entry A [08-10, 08-20) created (201); entry B [08-20, 08-25) created (201): B.effective_from == A.effective_to is adjacency, allowed under half-open semantics"
            - "entry C [08-19, 08-21) rejected http 422 ERR_RESTRICTION_WINDOW_OVERLAP (overlaps both A and B)"
            - "entry D [08-09, 08-10) created (201): adjacency on the other side also allowed"
            - "overlap detection applies regardless of restriction_level (B is NO_TRADE, A NO_BUY)"

      - name: report_periods_closed_interval_touching_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - state_machines.PerformanceReport.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Resource: Portfolio report periods. Semantics: CLOSED [start, end] — a period starting
          on the previous period's end date SHARES that date and is rejected; only a gap of at
          least one day is allowed. Opposite adjacency treatment from restriction windows.
        test_recipe:
          setup:
            - "client + portfolio P; ACTIVE benchmark B; R1 [2026-08-01, 2026-08-31] FINALIZED (portfolio_return 1000 bps)"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Periods Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Rep", tax_status: TAX_EXEMPT }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p}", benchmark_id: "${b}", period_start: "2026-08-01", period_end: "2026-08-31", calculation_method: TIME_WEIGHTED, beginning_value_cents: 100000, ending_value_cents: 110000, benchmark_return_bps: 0 }, as: Advisor, captures: { r1: $.data.id } }
            - { call: "POST /advisory/performance-reports/${r1}/finalize", as: ComplianceOfficer }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p}", benchmark_id: "${b}", period_start: "2026-08-31", period_end: "2026-09-30", calculation_method: TIME_WEIGHTED, beginning_value_cents: 110000, ending_value_cents: 110000, benchmark_return_bps: 0 }, as: Advisor, captures: { r2: $.data.id } }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p}", benchmark_id: "${b}", period_start: "2026-09-01", period_end: "2026-09-30", calculation_method: TIME_WEIGHTED, beginning_value_cents: 110000, ending_value_cents: 110000, benchmark_return_bps: 0 }, as: Advisor, captures: { r3: $.data.id } }
          trigger:
            - { call: "POST /advisory/performance-reports/${r2}/finalize", as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/performance-reports/${r3}/finalize", as: ComplianceOfficer }
          assert:
            - "R1 FINALIZED with portfolio_return_bps == 1000 (110000/100000 - 1, no flows in window)"
            - "R2 [08-31, 09-30] finalize: http 422 ERR_REPORT_PERIOD_OVERLAP — closed intervals share 2026-08-31 (touching counts as overlap, unlike half-open restriction windows)"
            - "R3 [09-01, 09-30] finalize succeeds: disjoint by one day is sufficient under closed semantics"
            - "R2 remains DRAFT (failed finalize leaves state unchanged)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: sell_buy_pair_execution_conserves_total_value
        grounds:
          - calculations.tax_lot_relief
          - calculations.portfolio_valuation
          - state_machines.RebalanceProposal.APPROVED_to_EXECUTED
          - entities.Portfolio.fields.total_value_cents
        distinguishing_aspect: |
          Conserved quantity: Portfolio.total_value_cents. Executing the SELL 60 EQA + BUY 180
          EIB pair at current prices moves 60000 cash -> positions -> cash but leaves
          total_value_cents exactly 900000 before and after (formula: post.cash + post.sum(mv)
          == pre.total when fills settle at current prices).
        test_recipe:
          setup:
            - "TAX_DEFERRED portfolio; targets US_EQUITY 60.00/5.00, INTL_EQUITY 10.00/5.00, CASH_EQUIVALENT 30.00/5.00"
            - "cash 300000; EQA 600 @ 1000 basis 480000 (US 66.67% -> BREACHED); EIB @ 500 registered, not held; total 900000"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Conserve Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Global", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 10.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 30.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAX_DEFERRED }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 300000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqa: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s_eqa}", quantity: 600, opening_cost_basis_cents: 480000 }, as: Advisor, captures: { pos: $.data.id } }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version, total_pre: $.data.total_value_cents } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { prop: $.data.id } }
            - { call: "POST /advisory/rebalance-proposals/${prop}/approve", as: ComplianceOfficer }
          trigger:
            - { call: "POST /advisory/rebalance-proposals/${prop}/execute", as: Advisor }
          assert:
            - "Portfolio.${p}.total_value_cents == 900000 after execution — identical to pre-execution (conserved across the sell/buy pair)"
            - "cash_balance_cents == 270000 (300000 + 60000 sell - 90000 buy)"
            - "Position.${pos}: quantity == 540, cost_basis_cents == 432000 (relief 48000), lifetime_realized_gains_cents == 12000"
            - "new EIB position: quantity == 180, cost_basis_cents == 90000"
            - "drift_status == WITHIN_BANDS (US 540000/900000 = 6000bps, INTL 1000bps, CASH 3000bps — exactly on targets)"
            - "exactly 2 TRADE_EXECUTION CashFlowEvents exist for the portfolio (+60000 SELL first, then -90000 BUY; pinned execution order)"

      - name: execute_then_void_restores_quantity_basis_cash
        grounds:
          - state_machines.TradeInstruction.EXECUTED_to_VOIDED
          - calculations.tax_lot_relief
          - entities.Position.fields.cost_basis_cents
        distinguishing_aspect: |
          Conserved quantities: the (Position.quantity, Position.cost_basis_cents,
          Portfolio.cash_balance_cents) triple and lifetime_realized_gains_cents. Executing a
          SELL then voiding it same-day restores all four exactly (600/480000/400000/0) — a
          different conserved quantity family than total market value.
        test_recipe:
          setup:
            - "TAXABLE 60/40 fixture: cash 400000; EQA 600 @ 1000 basis 480000; reprice 1500 -> BREACHED"
            - "proposal -> SELL 80 EQA; APPROVED; EXECUTED at 1500 (qty 520, basis 416000, cash 520000, gains +56000)"
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Void Client", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench", description: "blend" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "Growth", risk_tolerance_score: 50, review_cadence_months: 12 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 40.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 400000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 600, opening_cost_basis_cents: 480000 }, as: Advisor, captures: { pos: $.data.id } }
            - { call: "POST /advisory/securities/${s}/reprice", payload: { new_price_cents: 1500 }, as: ComplianceOfficer }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { prop: $.data.id } }
            - { call: "POST /advisory/rebalance-proposals/${prop}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/rebalance-proposals/${prop}/execute", as: Advisor }
            - { call: "GET /advisory/trade-instructions", payload: { proposal_id: "${prop}", security_id: "${s}" }, as: Advisor, captures: { tr: "$.data[0].id" } }
          trigger:
            - { call: "POST /advisory/trade-instructions/${tr}/void", as: ComplianceOfficer }
          assert:
            - "Position.${pos}.quantity == 600 and cost_basis_cents == 480000 (relief 64000 returned exactly)"
            - "Portfolio.${p}.cash_balance_cents == 400000 (TRADE_VOID event of -120000 reverses the +120000 execution event)"
            - "Portfolio.${p}.lifetime_realized_gains_cents == 0 (the +56000 accrual is reversed)"
            - "TradeInstruction.${tr}.status == VOIDED with voided_at set; RebalanceProposal.${prop}.status remains EXECUTED"
