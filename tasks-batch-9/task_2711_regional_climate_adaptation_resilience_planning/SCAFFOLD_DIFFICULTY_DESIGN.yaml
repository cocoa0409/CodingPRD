            - "Each project carries exactly one ProjectAssetLink, with avoided_loss_annual_cents 2118960, 2118855 and 2118854 respectively."
            - "Each project has one DRAFT BenefitCostAnalysis with method ANNUALIZED_EQUIVALENT and discount_rate_bps 700."
