              as: PolicyAdmin
            - call: "GET /ad-policy/reviewers/${rev_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}/violation-ledger-entries"
              payload: {}
              as: PolicyAdmin
          assert:
            - "Before the trigger: DisapprovalNotice on cr1 has assessed_points == 27.75 with assessment_lines[0] == { policy_rule_code: ALC_SPIRITS, reason_code: MANUAL_REVIEW, line_points: 9.00 } and assessment_lines[1] == { policy_rule_code: null, reason_code: DESTINATION_MISMATCH, line_points: 18.75 }"
            - "Before the trigger: Advertiser.${adv_id}.violation_points_raw == 27.75, severity_index == 31.25, account_status == RESTRICTED, and Reviewer.${rev_id}.claimed_task_count == 2"
            - "Hop 1: ReviewTask.${task2_id}.status == RESOLVED with resolution DISAPPROVE and AdCreative.${cr2_id}.review_status == DISAPPROVED"
            - "Hop 1: the new DisapprovalNotice on cr2 has assessed_points == 9.00, reason_codes == [MANUAL_REVIEW], decided_by_reviewer_id == ${rev_id}"
            - "Hop 2: a ViolationLedgerEntry with reason DISAPPROVAL_ASSESSED, delta_points == 9.00, balance_after == 36.75 and entry_index == 2 exists"
            - "Hop 3: Advertiser.${adv_id}.violation_points_raw == 36.75 and violation_points_decayed == 36.75"
            - "Hop 4: Advertiser.${adv_id}.severity_index == 45.75 (base 36.75 with zero closed actions, plus the 9.00 tier chosen from 36.75)"
            - "Hop 4: a new EnforcementAction exists with action_type == SUSPENSION, origin == SYSTEM_CASCADE, status == ACTIVE, severity_index_at_issue == 45.75, effective_until == 2027-01-28T00:00:00Z and prior_action_id pointing at the RESTRICTION"
            - "Hop 4: the earlier RESTRICTION row now has status == SUPERSEDED"
            - "Hop 5: Advertiser.${adv_id}.account_status == SUSPENDED"
