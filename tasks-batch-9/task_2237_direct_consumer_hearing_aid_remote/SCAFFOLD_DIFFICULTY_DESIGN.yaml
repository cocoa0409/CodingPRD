            captures: { scr: "$.data.id" }
          - { call: "PATCH /screening-sessions/${scr}", payload: { pure_tone_avg_db: 45.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["VERTIGO"] }, as: Patient, as_user_id: "${pat}" }
          - { call: "POST /screening-sessions/${scr}/submit", payload: {}, as: Patient, as_user_id: "${pat}" }
          - call: "GET /provider-referrals"
            payload: { patient_id: "${pat}" }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { ref: "$.data[0].id" }
          - call: "POST /remote-fitting-sessions"
            payload: { patient_id: "${pat}", session_type: "REFERRAL_EVALUATION", scheduled_start_utc: "2026-08-05T10:00:00Z", scheduled_end_utc: "2026-08-05T11:00:00Z", provider_id: "${aud}", provider_referral_id: "${ref}" }
            as: Patient
            as_user_id: "${pat}"
            captures: { sess1: "$.data.id" }
          - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T11:00:00Z" }, as: PlatformAdmin, as_user_id: "admin_1" }
          - { call: "POST /remote-fitting-sessions/${sess1}/no-show", payload: {}, as: LicensedAudiologist, as_user_id: "${aud}" }
          - call: "POST /remote-fitting-sessions"
            payload: { patient_id: "${pat}", session_type: "REFERRAL_EVALUATION", scheduled_start_utc: "2026-08-06T10:00:00Z", scheduled_end_utc: "2026-08-06T11:00:00Z", provider_id: "${aud}", provider_referral_id: "${ref}" }
            as: Patient
