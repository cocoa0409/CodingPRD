            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-05T00:00:00Z"
                window_end_at: "2026-08-05T02:00:00Z"
                expected_segment_version: "${seg_v}"
              as: SegmentAnalyst
