              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", requested_seats: 4 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id }
            - call: "POST /exam-sessions/${sess}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_v1: $.data.version }
          trigger:
            - call: "POST /exam-registrations"
              payload: { student_id: "${s}", exam_session_id: "${sess}", expected_exam_session_version: "${sess_v1}" }
              as: Registrar
              captures: { reg: $.data.id }
            - call: "POST /exam-registrations/${reg}/cancel"
              payload: {}
              as: Registrar
            - call: "POST /exam-registrations/${reg}/cancel"
              payload: {}
              as: Registrar
            - call: "GET /exam-sessions/${sess}"
              payload: {}
