      - name: bonus_multiplier_reads_two_different_tiers_at_posting_and_adjustment
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: stay_bonus_provisional_tier_at_checkin_vs_final_tier_at_adjustment
          rationale: |
            The two declared variants of stay_elite_bonus_points - tier_at_checkin at posting versus
            the live Member.elite_tier at adjustment, and the delta-only EARN_BONUS entry - are the
            entire subject of that §1.8 instance, including the case where the two readings differ.

      - name: reimbursement_uses_live_hotel_figures_at_accrual_and_snapshots_at_release
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: owner_reimbursement_accrual_estimate_vs_settlement_actual
          rationale: |
            That §1.8 instance already drives a performance refresh between accrual and release so
            the estimate and the settlement land on different occupancy bands, and asserts both
            figures plus the batch snapshot fields occupancy_pct_at_release and adr_cents_at_release.

      - name: peak_award_price_applies_discount_then_surcharge_then_floor
        claim_type: correct_result
        excluded_because:
          difficulty_instance: peak_award_price_evaluation_order_capped_discount_then_surcharge_then_floor
          rationale: |
            The pinned four-step evaluation order of redemption_points_price - capped tier discount,
            conditional free night, market-keyed ceil surcharge, then the per-chargeable-night floor -
            is asserted there against the specific alternative orders that would produce other totals.

      - name: batch_offset_waterfall_keys_its_tier_on_the_pre_surcharge_net
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: batch_surcharge_tier_keyed_on_net_before_surcharge_not_on_final_net
          rationale: |
            The six-step batch_net_payable waterfall and the apparent circularity of the surcharge
            tier are that §1.8 instance's subject; it pins the tier on the step-3 figure and shows
            the wrong answer produced by keying it on step 6.

      - name: elite_tier_thresholds_are_inclusive_at_fifty_nights
        claim_type: threshold
        excluded_because:
          difficulty_instance: fiftieth_qualifying_night_flips_platinum_while_the_same_post_floors_1234_and_pays_a_gold_bonus
          rationale: |
            The >= boundary between GOLD at 49 nights and PLATINUM at 50, and the fact that the
            posting which crosses it still pays the pre-crossing GOLD multiplier, are asserted there
            together with the floor(12345 * 10 / 100) = 1234 precision case.

      - name: blackout_windows_are_closed_intervals_separated_by_clear_days
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: blackout_windows_need_seven_clear_days_so_a_six_day_gap_is_refused
          rationale: |
