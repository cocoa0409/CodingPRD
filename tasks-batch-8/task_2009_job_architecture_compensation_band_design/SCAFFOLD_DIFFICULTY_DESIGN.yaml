          trigger:
            - { call: "POST /comp/exception-requests/${xr}/rescind", payload: {}, as: CompManager, as_user_id: "cm-2", captures: { rst: $.data.status } }
          assert:
            - "after comp-pass: status APPROVED; Employee.base_salary_cents == 15697500; applied_delta_cents == 1697500; Department.committed_pool_cents == 1697500"
            - "rescind (same logical day, within 30-day window) -> status RESCINDED"
            - "INVARIANT: Department.committed_pool_cents == 0 again (exactly the pre-approve value — no drift from the 1697500 round trip)"
            - "INVARIANT: Employee.base_salary_cents == 14000000 (pre_exception_salary_cents restored) and compa_ratio back to 1.0769"

