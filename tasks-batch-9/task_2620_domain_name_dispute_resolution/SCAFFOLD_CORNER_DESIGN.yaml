            - "A fabricated notification id under case A returns HTTP 404 with data.error_id == 'ERR_RESOURCE_NOT_FOUND', reported at priority 35 ahead of any state gate on case A"
            - "A fabricated court-challenge id on resolve returns HTTP 404 with data.error_id == 'ERR_RESOURCE_NOT_FOUND'"
            - "A fabricated CASE id combined with the real ${ver_b} returns HTTP 404 with data.error_id == 'ERR_CASE_NOT_FOUND', because priority 30 is checked before priority 35"
            - "Case A's verification is still REQUESTED with lock_applied false and DomainName.${dom_a}.lock_status is still UNLOCKED - none of the refusals touched the wrong case"
            - "The correctly paired call on case B succeeds with the verification RESPONDED"

      - name: every_refusal_uses_the_same_error_envelope_and_writes_nothing
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
          - validations[priority=38].ERR_INVALID_REQUEST
          - validations[priority=20].ERR_UNAUTHORIZED
          - validations[priority=30].ERR_CASE_NOT_FOUND
        distinguishing_aspect: "Four refusals across four status codes - 400, 403, 404 and 409 - must all come back with response_type 'error' and a data object holding only error_id and message, with the meta envelope still present and no entity fields leaking into data."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9035; domain envelope.example already registered on it."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
