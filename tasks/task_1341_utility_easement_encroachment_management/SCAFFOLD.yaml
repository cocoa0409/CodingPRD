  - method: POST
    path: "/easement-cases/{caseId}/title-searches"
    description: "Order a title search"
    roles: [TitleExaminer]
    code: 201
    input: [search_scope]
    output: TitleSearchTask
    side_effects: ["status=ORDERED"]

  - method: GET
    path: "/easement-cases/{caseId}/title-searches"
    description: "List title searches for a case"
    roles: [TitleExaminer, RightOfWayAgent, DepartmentDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TitleSearchTask[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/{caseId}/title-searches/{taskId}"
    description: "Get one title search"
    roles: [TitleExaminer, RightOfWayAgent, DepartmentDirector]
    code: 200
    input: []
    output: TitleSearchTask
    side_effects: []

  - method: POST
    path: "/easement-cases/{caseId}/title-searches/{taskId}/begin"
    description: "Begin title search"
    roles: [TitleExaminer]
    code: 200
