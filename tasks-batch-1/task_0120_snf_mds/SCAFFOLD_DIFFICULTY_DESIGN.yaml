scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_estimated_vs_final_diverge_on_unpaid_bedhold
        grounds:
          - calculations.claim_total
          - state_machines.Claim.ESTIMATED_to_FINALIZED
          - entities.Claim.fields.estimated_amount_cents
          - entities.Claim.fields.final_amount_cents
          - entities.Claim.fields.variance_cents
        distinguishing_aspect: |
          claim_total is cost accounting on a Claim: the estimated (forward-looking, all
          days projected covered) variant yields 452442 cents but the final (chronological,
          unpaid Medicare bed-hold day 5 removed) variant yields 397275 cents — same Claim,
          two algorithms, variance_cents == -55167.
        test_recipe:
          setup:
            - "Facility with 5 certified beds; PdpmRate rows for PT(TB),OT(TB),SLP(SB),NTA(NB),NURSING(NURS)"
            - "Medicare-A resident with a qualifying 4-midnight stay, PASRR CLEARED, admission ACTIVE admit_at 2026-02-01"
            - "SUBMITTED 5-day MDS assessment with pt_function_score 7 (TB), slp_components_count 1 (SB), nta_comorbidity_points 10 (NB)"
            - "A bed-hold over day 5 (2026-02-05 to 2026-02-06), closed RETURNED, unpaid under Medicare (paid_cap 0)"
            - "Claim for period 2026-02-01..2026-02-06 estimated then finalized"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "Maple SNF", cms_certification_number: "CCN-DV1", certified_bed_count: 5, health_inspection_rating: 4, staffing_rating: 4 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/pdpm-rates"
              payload: { component: "PT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 7000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "OT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 6000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "SLP", case_mix_group: "SB", case_mix_index: 1.46, base_rate_cents: 2025, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NTA", case_mix_group: "NB", case_mix_index: 2.53, base_rate_cents: 8000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NURSING", case_mix_group: "NURS", case_mix_index: 1.00, base_rate_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/residents"
              payload: { full_name: "Ada Resident", medical_record_number: "MRN-DV1", date_of_birth: "1940-03-02T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { mds_id: $.data.id }
            - call: "POST /snf/assessments/${mds_id}/start"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/complete"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/submit"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/admissions/${adm_id}/bed-holds"
              payload: { leave_reason: "HOSPITAL", leave_start_at: "2026-02-05T00:00:00Z", expected_return_at: "2026-02-06T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { bh_id: $.data.id }
            - call: "POST /snf/bed-holds/${bh_id}/close"
              payload: { return_outcome: "RETURNED", actual_return_at: "2026-02-06T00:00:00Z" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/claims"
              payload: { driving_assessment_id: "${mds_id}", period_start_at: "2026-02-01T00:00:00Z", period_end_at: "2026-02-06T00:00:00Z" }
              as: BillingAnalyst
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /snf/claims/${claim_id}/estimate"
              payload: {}
              as: BillingAnalyst
              captures: { est_amt: $.data.estimated_amount_cents }
            - call: "POST /snf/claims/${claim_id}/finalize"
              payload: {}
              as: BillingAnalyst
              captures: { fin_amt: $.data.final_amount_cents, var_amt: $.data.variance_cents }
          assert:
            - "Claim.${claim_id}.estimated_amount_cents == 452442"
            - "Claim.${claim_id}.final_amount_cents == 397275"
            - "Claim.${claim_id}.variance_cents == -55167"

      - name: five_star_full_measures_vs_missing_baseline
        grounds:
          - calculations.five_star_quality_score
          - entities.Facility.fields.quality_measure_rating
          - entities.QualityMeasure.fields.measure_points
        distinguishing_aspect: |
          five_star_quality_score is quality/risk scoring on a Facility (a different entity
          domain than the Claim cost calc): a facility with all four measures entered scores
          qm_total 400 (quality_measure_rating 5), while a facility with only one measure
          entered substitutes the 50-point baseline for the three missing measures, scoring
          qm_total 250 (quality_measure_rating 3).
        test_recipe:
          setup:
            - "Facility A with all four quality measures at low adverse rates"
            - "Facility B with only FALLS_WITH_INJURY entered"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "Full QM SNF", cms_certification_number: "CCN-QM-A", certified_bed_count: 10, health_inspection_rating: 4, staffing_rating: 4 }
              as: Administrator
              captures: { fac_a: $.data.id }
            - call: "POST /snf/facilities/${fac_a}/quality-measures"
              payload: { measure_code: "FALLS_WITH_INJURY", numerator: 1, denominator: 200, reporting_period: "2026Q1" }
              as: Administrator
            - call: "POST /snf/facilities/${fac_a}/quality-measures"
              payload: { measure_code: "PRESSURE_ULCER", numerator: 2, denominator: 200, reporting_period: "2026Q1" }
              as: Administrator
            - call: "POST /snf/facilities/${fac_a}/quality-measures"
              payload: { measure_code: "ANTIPSYCHOTIC_USE", numerator: 10, denominator: 200, reporting_period: "2026Q1" }
              as: Administrator
            - call: "POST /snf/facilities/${fac_a}/quality-measures"
              payload: { measure_code: "REHOSPITALIZATION", numerator: 20, denominator: 200, reporting_period: "2026Q1" }
              as: Administrator
            - call: "POST /snf/facilities"
              payload: { name: "Sparse QM SNF", cms_certification_number: "CCN-QM-B", certified_bed_count: 10, health_inspection_rating: 4, staffing_rating: 4 }
              as: Administrator
              captures: { fac_b: $.data.id }
            - call: "POST /snf/facilities/${fac_b}/quality-measures"
              payload: { measure_code: "FALLS_WITH_INJURY", numerator: 1, denominator: 200, reporting_period: "2026Q1" }
              as: Administrator
          trigger:
            - call: "GET /snf/facilities/${fac_a}/star-summary"
              payload: {}
              as: Administrator
              captures: { qm_a: $.data.quality_measure_rating }
            - call: "GET /snf/facilities/${fac_b}/star-summary"
              payload: {}
              as: Administrator
              captures: { qm_b: $.data.quality_measure_rating }
          assert:
            - "Facility.${fac_a}.quality_measure_rating == 5"
            - "Facility.${fac_b}.quality_measure_rating == 3"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pdpm_classification_nonlinear_three_input_branch
        grounds:
          - calculations.pdpm_component_classification
          - state_machines.MdsAssessment.IN_PROGRESS_to_COMPLETED
          - entities.MdsAssessment.fields.pt_ot_case_mix_group
          - entities.MdsAssessment.fields.slp_case_mix_group
          - entities.MdsAssessment.fields.nta_case_mix_group
        distinguishing_aspect: |
          MODE (a): pdpm_component_classification resolves three case-mix groups from three
          independent inputs via non-linear band selection — pt_function_score 7 -> TB,
          slp_components_count 1 -> SB, nta_comorbidity_points 10 -> NB — each selected from a
          different branching ladder, none a simple linear scaling.
        test_recipe:
          setup:
            - "Facility, Medicare resident admitted ACTIVE, a SCHEDULED 5-day assessment"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "Cls SNF", cms_certification_number: "CCN-CLS1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "Cls Res", medical_record_number: "MRN-CLS1", date_of_birth: "1942-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { mds_id: $.data.id }
            - call: "POST /snf/assessments/${mds_id}/start"
              payload: {}
              as: MdsCoordinator
          trigger:
            - call: "POST /snf/assessments/${mds_id}/complete"
              payload: {}
              as: MdsCoordinator
              captures: { pt_g: $.data.pt_ot_case_mix_group, slp_g: $.data.slp_case_mix_group, nta_g: $.data.nta_case_mix_group }
          assert:
            - "MdsAssessment.${mds_id}.pt_ot_case_mix_group == 'TB'"
            - "MdsAssessment.${mds_id}.slp_case_mix_group == 'SB'"
            - "MdsAssessment.${mds_id}.nta_case_mix_group == 'NB'"

      - name: claim_rounding_per_day_then_sum_not_sum_then_round
        grounds:
          - calculations.claim_total
          - calculations.pdpm_per_diem_amount
          - state_machines.Claim.DRAFT_to_ESTIMATED
          - entities.Claim.fields.estimated_amount_cents
        distinguishing_aspect: |
          MODE (b): claim_total pins per-day-then-sum rounding. Each of the 6 days rounds
          95646.5 / 55166.5 half-up to 95647 / 55167 before summing -> 452442 cents; the
          forbidden sum-then-round order would yield 452439. The 3-cent gap is the observable
          proof the pinned order is honored.
        test_recipe:
          setup:
            - "Same priced Medicare admission + SUBMITTED TB/SB/NB assessment as the dual-variant instance, no bed-hold"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "Round SNF", cms_certification_number: "CCN-RND1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/pdpm-rates"
              payload: { component: "PT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 7000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "OT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 6000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "SLP", case_mix_group: "SB", case_mix_index: 1.46, base_rate_cents: 2025, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NTA", case_mix_group: "NB", case_mix_index: 2.53, base_rate_cents: 8000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NURSING", case_mix_group: "NURS", case_mix_index: 1.00, base_rate_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/residents"
              payload: { full_name: "Round Res", medical_record_number: "MRN-RND1", date_of_birth: "1941-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { mds_id: $.data.id }
            - call: "POST /snf/assessments/${mds_id}/start"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/complete"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${mds_id}/submit"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/admissions/${adm_id}/claims"
              payload: { driving_assessment_id: "${mds_id}", period_start_at: "2026-02-01T00:00:00Z", period_end_at: "2026-02-06T00:00:00Z" }
              as: BillingAnalyst
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /snf/claims/${claim_id}/estimate"
              payload: {}
              as: BillingAnalyst
              captures: { est_amt: $.data.estimated_amount_cents }
          assert:
            - "Claim.${claim_id}.estimated_amount_cents == 452442"
            - "Claim.${claim_id}.billed_day_count == 6"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: careplan_active_under_review_cycle
        grounds:
          - state_machines.CarePlan.ACTIVE_to_UNDER_REVIEW
          - state_machines.CarePlan.UNDER_REVIEW_to_ACTIVE
          - entities.CarePlan.fields.status
          - entities.CarePlan.fields.last_reviewed_at
        distinguishing_aspect: |
          CarePlan is cyclic: ACTIVE -> UNDER_REVIEW -> ACTIVE returns the plan to ACTIVE
          (not a forward-only pipeline), and the second ACTIVE entry refreshes
          last_reviewed_at, proving the loop re-executes its side-effect.
        test_recipe:
          setup:
            - "Admission ACTIVE with a DRAFT care plan holding one OPEN goal, activated to ACTIVE"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "CP SNF", cms_certification_number: "CCN-CP1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "CP Res", medical_record_number: "MRN-CP1", date_of_birth: "1943-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "PRIVATE", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/care-plans"
              payload: { review_interval_days: 90 }
              as: Physician
              captures: { cp_id: $.data.id }
            - call: "POST /snf/care-plans/${cp_id}/goals"
              payload: { description: "Restore mobility", target_date: "2026-03-01T00:00:00Z" }
              as: Physician
            - call: "POST /snf/care-plans/${cp_id}/activate"
              payload: {}
              as: Physician
          trigger:
            - call: "POST /snf/care-plans/${cp_id}/begin-review"
              payload: {}
              as: Physician
              captures: { st_mid: $.data.status }
            - call: "POST /snf/care-plans/${cp_id}/complete-review"
              payload: {}
              as: Physician
              captures: { st_back: $.data.status }
          assert:
            - "CarePlan.${cp_id}.status == 'UNDER_REVIEW' after begin-review"
            - "CarePlan.${cp_id}.status == 'ACTIVE' after complete-review"

      - name: claim_adjudicate_branch_fork_paid_vs_rejected
        grounds:
          - state_machines.Claim.SUBMITTED_to_PAID
          - state_machines.Claim.SUBMITTED_to_REJECTED
          - entities.Admission.fields.covered_day_count
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Claim forks at SUBMITTED into {PAID, REJECTED} with DIVERGENT side-effects on a
          different entity than CarePlan: adjudicate decision==PAID adds billed_day_count (6)
          to Admission.covered_day_count, while decision==REJECTED leaves covered_day_count
          unchanged.
        test_recipe:
          setup:
            - "Two priced Medicare admissions each with a SUBMITTED claim (billed_day_count 6) on distinct residents/facilities"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "Adj SNF", cms_certification_number: "CCN-ADJ1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/pdpm-rates"
              payload: { component: "PT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 7000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "OT", case_mix_group: "TB", case_mix_index: 1.69, base_rate_cents: 6000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "SLP", case_mix_group: "SB", case_mix_index: 1.46, base_rate_cents: 2025, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NTA", case_mix_group: "NB", case_mix_index: 2.53, base_rate_cents: 8000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/pdpm-rates"
              payload: { component: "NURSING", case_mix_group: "NURS", case_mix_index: 1.00, base_rate_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /snf/residents"
              payload: { full_name: "Adj Paid", medical_record_number: "MRN-ADJ-P", date_of_birth: "1944-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { resp_id: $.data.id }
            - call: "POST /snf/residents/${resp_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qsp_id: $.data.id }
            - call: "POST /snf/residents/${resp_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrrp_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrrp_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
