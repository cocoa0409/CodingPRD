      - name: mutm_fmr_floor_is_inclusive_at_the_published_fmr_and_refuses_one_cent_above
        claim_type: threshold
        grounds:
          - calculations.restructuring_eligibility
          - state_machines.RestructuringDetermination.DRAFT_to_MUTM_ELIGIBLE
          - state_machines.RestructuringDetermination.MUTM_ELIGIBLE_to_APPROVED
          - entities.Property.fields.published_fmr_cents
        distinguishing_aspect: "MUTM_FMR_FLOOR_PCT is 1.0 and the comparison is INCLUSIVE, so the three-point probe holds the market rent at 130200 and moves the FMR: 130199 and 130200 both qualify while 130201 reports MARKET_BELOW_FMR_FLOOR. The at-the-floor case is then approved to prove the MUTM branch stamps the market rent unchanged (130200), which is the opposite stamping rule from the M2M branch."
        test_recipe:
          setup:
            - "One owner and three properties differing only in published_fmr_cents: 130199, 130200 and 130201; each carries one NEW_CONSTRUCTION contract at 118000."
            - "Clock 2026-12-01; each contract has an OPTION_1_MARK_UP_TO_MARKET / OCAF case with an ACCEPTED single-comparable study fixing comparable_market_rent_cents at 130200; each case has a DRAFT determination."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
