      - name: deductible_rate_is_keyed_on_the_pre_deductible_eligible_amount
        claim_type: correct_result
        grounds:
          - calculations.claim_payout_waterfall
          - endpoints[POST /damage-claims/{id}/attach-verification]
        distinguishing_aspect: >-
          DEDUCTIBLE_TIER1_LIMIT is 2000.00 and the comparison is a STRICT less-than, so an
          eligible amount of exactly 2000.00 falls in tier 2 at 7% (140.00) while 1999.99 — one
          cent lower — falls in tier 1 at 10% and rounds UP to 200.00. The higher claim therefore
          carries the smaller deductible, which no post-deductible or post-cap re-keying can
          reproduce.
        test_recipe:
          setup:
            - "P1 with an ACTIVE REPAIR_AND_RETREAT bond (cap 11664.00) and a GRAPHED verifying graph holding one 5000.00 DAMAGE cell, severity 3, pre_existing false."
