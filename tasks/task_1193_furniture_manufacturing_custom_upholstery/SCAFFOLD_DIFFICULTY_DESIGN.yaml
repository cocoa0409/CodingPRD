            - call: "POST /mill/material-lots/${lot_a}/receive"
              payload: { received_yards: 10.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_a}/inspect"
              payload: { result: "PASS", usable_yards: 10.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot_b: $.data.id }
            - call: "POST /mill/material-lots/${lot_b}/receive"
              payload: { received_yards: 10.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_b}/inspect"
              payload: { result: "PASS", usable_yards: 10.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-RC", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CUT", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: ProductionPlanner
              captures: { c_cut: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cut}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-02T08:00:00Z", end_at: "2026-06-02T10:00:00Z" }
              as: ProductionPlanner
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /mill/material-lots/${lot_a}/reject-lot"
              payload: {}
              as: QualityInspector
