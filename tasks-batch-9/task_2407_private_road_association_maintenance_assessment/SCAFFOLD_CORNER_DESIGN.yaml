          trigger:
            - call: "PATCH /parcels/${pb_id}"
              payload: { expected_parcel_version: "${pb_v2}", trips_per_day: 3 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err_locked_subdivided: $.data.error_id }
            - call: "PATCH /parcels/${pa_id}"
              payload: { expected_parcel_version: "${pa_v}", usage_class: "COMMERCIAL", trips_per_day: 10 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err_locked_active: $.data.error_id }
            - call: "POST /assessment-rolls/${roll_id}/recall"
