# =============================================================================
# 1.9 SCAFFOLD CORNER DESIGN (Coverage Index for Non-Difficulty Tests)
#   Task 2928 - Field-Erected Storage Tank Construction
#
#   Breadth probe over the nine sections of references/claim-extraction-guide.md,
#   walked row by row against SCAFFOLD.yaml §1.1-§1.7. Corners already asserted
#   by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub instead
#   of a test_recipe.
#
#   Rows deliberately skipped as non-applicable to this scaffold:
#     - Entities / Immutability: every §1.1 entity declares common_fields: true,
#       so there is no immutable entity to probe.
#     - State machine shapes `linear` and `branching`: this scaffold declares
#       `parallel` (Tank) plus `compound` (ShellCourse) and `cyclic` (WeldSeam,
#       CoatingApplication, CommissioningPackage).
#     - Calculation algorithms `forward_looking`, `chronological`, `topological`,
#       `projection`, `waterfall_allocation`: no §1.3 rule uses them.
#     - Layers `soft_delete`, `idempotency`, `pagination_with_filtering`,
#       `bulk_operations`, `scheduled_actions`, `multi_tenancy`,
#       `conditional_feature_flags`: not in §1.0 complexity_layers.
#     - Endpoints / Bulk action: no bulk endpoint is declared.
#
#   Fixture vocabulary is the same as §1.8 (TK-101 100 ft x 40 ft, G 0.85,
#   E 1.00, CA 0.0625, bottom 0.25/0.10 at 0.01 ipy; course 1 plate 0.4375 with
#   Sd 23200 / St 24900; foundation 8 points, ratio 0.005, uniform 6.0; welder
#   W-07 SMAW 0.75/0.75 qualified 2026-06-01; water source 2000000 gal at
#   900 gpm, 3.33 / 2.10 usd per kgal, permit to 2027-06-30).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: tank_creation_returns_full_entity_in_success_envelope
        claim_type: creation
        grounds:
          - endpoints.POST_tanks
          - entities.Tank
          - response_envelope.success
        distinguishing_aspect: |
          POST /tanks with every required §1.5 input returns HTTP 201 and the complete
          Tank row inside the declared envelope: meta.api_request_id, meta
          api_request_timestamp, response_type 'object', and data carrying all input
          fields verbatim plus the four common fields and every computed field.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
          trigger:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", design_standard: "API_650_BASIC", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, roof_type: "CONE_SUPPORTED", bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == 'object' and meta.api_request_id and meta.api_request_timestamp both present"
            - "data echoes every input field: tank_tag == 'TK-101', diameter_ft == 100, shell_height_ft == 40, design_liquid_level_ft == 40, product_specific_gravity == 0.85, joint_efficiency == 1.00, corrosion_allowance_in == 0.0625, bottom_thickness_in == 0.25, bottom_minimum_thickness_in == 0.10, assumed_corrosion_rate_ipy == 0.01"
            - "data.id is a bare UUID with no type prefix; data.version == 1; data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"
            - "computed fields are present on the create response: min_nominal_thickness_in == 0.250, construction_phase == 'DESIGN_REGISTERED', quality_posture == 'OPEN', open_nonconformance_count == 0, weld_reject_rate == 0.0, required_examination_pct == 10.0, steel_received_lb == 0.0, steel_allocated_lb == 0.0, active_hydrotest_plan_id == null"

      - name: water_source_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_water_sources_water_source_id
          - entities.WaterSource
        distinguishing_aspect: |
          GET /water-sources/{id} returns the same row that POST returned, including the
          three computed ledger fields at their initial values, and does not mutate
          version.
        test_recipe:
          setup:
            - "One water source created."
          setup_api_calls:
            - call: "POST /water-sources"
              payload: { source_name: "Municipal Hydrant 12", source_type: "MUNICIPAL", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
          trigger:
            - call: "GET /water-sources/${ws_id}"
              as: AuthorizedInspector
          assert:
            - "HTTP 200, response_type == 'object', data.id == ${ws_id}"
            - "data.source_name == 'Municipal Hydrant 12', permitted_volume_gal == 2000000, max_concurrent_rate_gpm == 900, water_cost_usd_per_kgal == 3.33, disposal_cost_usd_per_kgal == 2.10, permit_expiry_utc == '2027-06-30T00:00:00Z'"
            - "data.reserved_volume_gal == 0.00, consumed_volume_gal == 0.00, available_volume_gal == 2000000.00"
            - "data.version == 1 - a read never bumps version, and a second identical GET returns byte-identical data"

      - name: weld_seam_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_weld_seams
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /weld-seams returns response_type 'array' with the four declared pagination
          fields, applies the declared default limit of 10 when none is supplied, and
          combines the shell_course_id filter with limit/offset so has_more flips
          correctly on the last page.
        test_recipe:
          setup:
            - "One tank, one FITTED course carrying twelve declared seams V01..V12."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V01", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V02", length_in: 96, sequence_index: 2 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V03", length_in: 96, sequence_index: 3 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V04", length_in: 96, sequence_index: 4 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V05", length_in: 96, sequence_index: 5 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V06", length_in: 96, sequence_index: 6 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V07", length_in: 96, sequence_index: 7 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V08", length_in: 96, sequence_index: 8 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V09", length_in: 96, sequence_index: 9 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V10", length_in: 96, sequence_index: 10 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V11", length_in: 96, sequence_index: 11 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V12", length_in: 96, sequence_index: 12 }
              as: ErectionSuperintendent
          trigger:
            - call: "GET /weld-seams"
              as: QcInspector
            - call: "GET /weld-seams"
              payload: { shell_course_id: "${course_id}", limit: 5, offset: 10 }
              as: QcInspector
          assert:
            - "the unfiltered call returns HTTP 200 with response_type == 'array', total_count == 12, limit == 10 (the declared default), offset == 0, has_more == true, and exactly 10 rows in data"
            - "the second call returns limit == 5, offset == 10, total_count == 12, has_more == false and exactly 2 rows"
            - "every returned row has status == 'FIT_READY', repair_cycle_count == 0, welder_id == null and shell_course_id == ${course_id}"

      - name: get_tank_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_tanks_tank_id
          - validations.priority_4_ERR_TANK_NOT_FOUND
          - errors.ERR_TANK_NOT_FOUND
        distinguishing_aspect: |
          A well-formed UUID that matches no row yields ERR_TANK_NOT_FOUND (404) in the
          error envelope, not an empty 200 and not a 400.
        test_recipe:
          setup:
            - "One unrelated tank exists, so the store is non-empty."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
          trigger:
            - call: "GET /tanks/00000000-0000-4000-8000-000000000000"
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == 'error' and data.error_id == 'ERR_TANK_NOT_FOUND'"
            - "data.message is a non-empty string and no Tank row is created"

      - name: tank_creation_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_tanks
          - validations.priority_5_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Each §1.5 input field without a declared default is required: omitting
          assumed_corrosion_rate_ipy (needed later by the inspection-interval decay
          calculation) is rejected with ERR_INVALID_REQUEST 400 even though every other
          field is present and valid.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10 }
              as: ProjectEngineer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /tanks returns total_count == 0 - the partial create is not persisted"

      - name: tank_and_welder_creation_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Tank.fields.design_standard
          - entities.Tank.fields.corrosion_allowance_in
          - entities.Tank.fields.roof_type
          - entities.Welder.fields.continuity_limit_days
          - entities.FoundationPackage.fields.ringwall_top_elevation_ft
        distinguishing_aspect: |
          Omitting every optional input applies the §1.1 defaults rather than null:
          design_standard API_650_BASIC, corrosion_allowance_in 0.0625, roof_type
          CONE_SUPPORTED, Welder.continuity_limit_days 180 and
          FoundationPackage.ringwall_top_elevation_ft 0.0 - and the defaulted corrosion
          allowance then shows up inside the required-thickness result.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
          trigger:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
          assert:
            - "Tank.${tank_id}: design_standard == 'API_650_BASIC', corrosion_allowance_in == 0.0625, roof_type == 'CONE_SUPPORTED'"
            - "Welder.${w1_id}: continuity_limit_days == 180 and continuity_expires_at_utc == '2026-11-28T00:00:00Z' (qualification_date_utc + 180 days)"
            - "FoundationPackage.${fp_id}.ringwall_top_elevation_ft == 0.0"
            - "ShellCourse.${course_id}.required_thickness_design_in == 0.434 - the defaulted 0.0625 corrosion allowance is inside the DESIGN case, proving the default was applied and not treated as 0"

      - name: foundation_package_computes_spacing_and_allowable_differential
        claim_type: computed_fields
        grounds:
          - calculations.settlement_tolerance_envelope
          - entities.FoundationPackage.fields.point_spacing_in
          - entities.FoundationPackage.fields.allowable_differential_in
        distinguishing_aspect: |
          point_spacing_in and allowable_differential_in are declared source: computed and
          are not endpoint inputs at all: the create request carries only the seven
          declared fields, yet the stored row comes back with 471.2389 and 2.356 derived
          from the parent tank's diameter and the supplied differential ratio.
        test_recipe:
          setup:
            - "One tank of 100 ft diameter."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "ADJACENT_PAIR", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
          assert:
            - "FoundationPackage.${fp_id}.point_spacing_in == 471.2389 (PI * 100 * 12 / 8, four decimals, round_half_up)"
            - "FoundationPackage.${fp_id}.allowable_differential_in == 2.356 (0.005 * 471.2389, three decimals)"
            - "FoundationPackage.${fp_id}.status == 'PLANNED' and baseline_survey_id == null on create"
            - "GET /foundation-packages?tank_id=${tank_id} returns exactly this row, so the FK is reverse-reachable"

      - name: tank_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Tank
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted: a create request that
          supplies them is not rejected for shape, but the stored row carries the
          server's own values (version 1, a fresh UUID), so client input for system
          fields is ignored rather than honoured.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01, id: "11111111-1111-4111-8111-111111111111", version: 99, construction_phase: "COMMISSIONED", quality_posture: "FROZEN", min_nominal_thickness_in: 9.999 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
          assert:
            - "HTTP 201 and data.id != '11111111-1111-4111-8111-111111111111'"
            - "data.version == 1, not 99"
            - "data.construction_phase == 'DESIGN_REGISTERED' and quality_posture == 'OPEN' - computed state fields cannot be seeded from the request"
            - "data.min_nominal_thickness_in == 0.250, not 9.999"
            - "GET /tanks/11111111-1111-4111-8111-111111111111 returns 404 ERR_TANK_NOT_FOUND"

      - name: undeclared_enum_and_out_of_range_numbers_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_5_ERR_INVALID_REQUEST
          - entities.Tank.fields.roof_type
          - entities.SettlementSurvey.fields.fill_percent
          - entities.NdeReport.fields.coverage_pct
        distinguishing_aspect: |
          Three distinct shape failures all land on ERR_INVALID_REQUEST 400: an
          undeclared enum value for roof_type, a fill_percent outside [0, 100], and a
          coverage_pct of 0 which is excluded by the half-open range (0, 100].
        test_recipe:
          setup:
            - "One tank with a BASELINE_SET foundation package and one welded seam, so the survey and NDE endpoints are otherwise reachable."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { s1: $.data.id }
            - call: "POST /weld-seams/${s1}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
          trigger:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-999", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, roof_type: "FLOATING_ALUMINIUM_DOME", bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 120, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 0, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
          assert:
            - "all three trigger calls return HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /tanks?tank_tag=TK-999 returns total_count == 0"
            - "GET /settlement-surveys?foundation_package_id=${fp_id} still returns total_count == 1 (only the baseline)"
            - "GET /nde-reports?weld_seam_id=${s1} returns total_count == 0 and WeldSeam.${s1}.status is still 'WELDED'"

      - name: weld_seam_requires_an_existing_parent_shell_course
        claim_type: parent_relationships
        grounds:
          - entities.WeldSeam.fields.shell_course_id
          - validations.priority_6_ERR_SHELL_COURSE_NOT_FOUND
          - errors.ERR_SHELL_COURSE_NOT_FOUND
        distinguishing_aspect: |
          The body foreign key is resolved before any state rule runs: a seam whose
          shell_course_id names no row is refused with ERR_SHELL_COURSE_NOT_FOUND (404),
          and the same request with the real parent succeeds, so the 404 is attributable
          to the parent link alone.
        test_recipe:
          setup:
            - "One tank with one SPECIFIED course."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /weld-seams"
              payload: { shell_course_id: "00000000-0000-4000-8000-000000000000", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { s1: $.data.id }
          assert:
            - "the first call returns HTTP 404 with data.error_id == 'ERR_SHELL_COURSE_NOT_FOUND'"
            - "the second call returns HTTP 201 with WeldSeam.${s1}.shell_course_id == ${course_id} and status == 'FIT_READY'"
            - "GET /weld-seams?shell_course_id=${course_id} returns exactly one row"

      - name: appurtenance_host_course_must_belong_to_the_same_tank
        claim_type: foreign_key_validation
        grounds:
          - validations.priority_32_ERR_CROSS_TANK_REFERENCE
          - errors.ERR_CROSS_TANK_REFERENCE
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Flat topology means cross-reference integrity is a validation, not a URL shape:
          both ids resolve, so no 404 fires, but the appurtenance's tank_id and its
          host_shell_course_id belong to different tanks and the create is refused with
          ERR_CROSS_TANK_REFERENCE (409) at priority 32.
        test_recipe:
          setup:
            - "Two tanks, each with one SPECIFIED course."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /tanks"
              payload: { tank_tag: "TK-102", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank2_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank2_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course2_id: $.data.id }
          trigger:
            - call: "POST /appurtenances"
              payload: { tank_id: "${tank_id}", host_shell_course_id: "${course2_id}", appurtenance_type: "NOZZLE", nominal_size_in: 6, elevation_ft: 4.0, azimuth_deg: 0.0 }
              as: ProjectEngineer
          assert:
            - "HTTP 409 with data.error_id == 'ERR_CROSS_TANK_REFERENCE'"
            - "GET /appurtenances?tank_id=${tank_id} returns total_count == 0 and GET /appurtenances?host_shell_course_id=${course2_id} returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: plate_lot_starts_in_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.PlateLot.initial_state
          - entities.PlateLot.fields.status
        distinguishing_aspect: |
          A freshly created PlateLot sits in ORDERED with an empty weight ledger and no
          material report, so none of the RECEIVED side effects have run yet.
        test_recipe:
          setup:
            - "One tank."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Gary Works", heat_number: "H-4471", thickness_in: 0.4375, plate_count: 10, plate_weight_lb: 1250.5, unit_cost_usd_per_lb: 0.62 }
              as: ErectionSuperintendent
              captures: { lot_id: $.data.id }
          assert:
            - "HTTP 201 and PlateLot.${lot_id}.status == 'ORDERED'"
            - "received_weight_lb == 0.00, allocated_weight_lb == 0.00, remaining_weight_lb == 0.00 and mtr_number == null"
            - "Tank.${tank_id}.steel_received_lb == 0.0 - ordering plate does not credit the steel ledger"

      - name: plate_lot_rolled_transition_moves_status_forward
        claim_type: valid_transition
        grounds:
          - state_machines.PlateLot.transitions.ORDERED_to_ROLLED
          - endpoints.POST_plate_lots_plate_lot_id_status_transitions
        distinguishing_aspect: |
          The declared trigger with target_status ROLLED moves ORDERED -> ROLLED, bumps
          version and leaves the weight ledger untouched, since only RECEIVED carries the
          weight side effects.
        test_recipe:
          setup:
            - "One tank with one ORDERED plate lot."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Gary Works", heat_number: "H-4471", thickness_in: 0.4375, plate_count: 10, plate_weight_lb: 1250.5, unit_cost_usd_per_lb: 0.62 }
              as: ErectionSuperintendent
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /plate-lots/${lot_id}/status-transitions"
              payload: { target_status: "ROLLED" }
              as: ErectionSuperintendent
          assert:
            - "HTTP 200 with data.status == 'ROLLED' and data.version == 2"
            - "received_weight_lb is still 0.00 and remaining_weight_lb is still 0.00"
            - "GET /plate-lots?status=ROLLED returns total_count == 1"

      - name: fitup_precondition_blocks_thickness_deficient_course
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ShellCourse.transitions.SPECIFIED_to_FITTED.preconditions
          - validations.priority_54_ERR_COURSE_THICKNESS_DEFICIENT
          - errors.ERR_COURSE_THICKNESS_DEFICIENT
        distinguishing_aspect: |
          The fitup transition's thickness precondition is enforced on its own: the tank is
          in FOUNDATION_ACCEPTED with an OPEN posture and the course is SPECIFIED, so the
          only unmet precondition is thickness_verdict == ADEQUATE, and the response is
          ERR_COURSE_THICKNESS_DEFICIENT rather than a generic state error.
        test_recipe:
          setup:
            - "Tank TK-101 with an ACCEPTED foundation and one 0.3125 in course, which is thinner than the 0.434 in required design thickness."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.3125, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
          assert:
            - "ShellCourse.${course_id}.thickness_verdict == 'DEFICIENT' at creation, with required_thickness_design_in == 0.434 and required_thickness_test_in == 0.407"
            - "the fitup returns HTTP 409 with data.error_id == 'ERR_COURSE_THICKNESS_DEFICIENT'"
            - "ShellCourse.${course_id}.status is still 'SPECIFIED' with fitup_at_utc == null"
            - "Tank.${tank_id}.construction_phase is still 'FOUNDATION_ACCEPTED' - the failed fitup does not advance the tank"

      - name: repeat_fitup_on_a_fitted_course_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ShellCourse.transitions.SPECIFIED_to_FITTED
          - validations.priority_13_ERR_COURSE_STATE_INVALID
          - errors.ERR_COURSE_STATE_INVALID
        distinguishing_aspect: |
          The fitup action is not idempotent: replaying it on a course that is already
          FITTED yields ERR_COURSE_STATE_INVALID (409) and leaves fitup_at_utc at the
          value stamped by the first call, so no second timestamp is written.
        test_recipe:
          setup:
            - "Tank TK-101 with an ACCEPTED foundation and one ADEQUATE 0.4375 in course, already fitted at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ErectionSuperintendent
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ErectionSuperintendent
          trigger:
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
          assert:
            - "HTTP 409 with data.error_id == 'ERR_COURSE_STATE_INVALID'"
            - "GET /shell-courses/${course_id} shows status == 'FITTED' and fitup_at_utc == '2026-08-10T00:00:00.000Z' - not the advanced clock value"
            - "Tank.${tank_id}.construction_phase is 'ERECTION_IN_PROGRESS', set by the first fitup and not double-applied"

      - name: repair_start_from_fit_ready_is_an_undeclared_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.WeldSeam.transitions.RT_REJECTED_to_REPAIR_IN_PROGRESS
          - validations.priority_15_ERR_SEAM_STATE_INVALID
          - errors.ERR_SEAM_STATE_INVALID
        distinguishing_aspect: |
          repair-start is declared only from RT_REJECTED. Firing it on a brand-new
          FIT_READY seam - a state from which the only declared trigger is weld-log -
          returns ERR_SEAM_STATE_INVALID (409) and does not touch repair_cycle_count.
        test_recipe:
          setup:
            - "Tank TK-101 with an ACCEPTED foundation, one FITTED course and one FIT_READY seam."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /weld-seams/${s1}/repair-start"
              payload: { defect_disposition: "EXCAVATE_AND_REWELD" }
              as: ErectionSuperintendent
          assert:
            - "HTTP 409 with data.error_id == 'ERR_SEAM_STATE_INVALID'"
            - "WeldSeam.${s1}.status is still 'FIT_READY' and repair_cycle_count == 0"
            - "ShellCourse.${course_id}.status is still 'FITTED'"

      - name: dft_readings_before_surface_prep_is_an_undeclared_step
        claim_type: invalid_transitions
        grounds:
          - state_machines.CoatingApplication.transitions.PREP_ACCEPTED_to_DFT_RECORDED
          - validations.priority_20_ERR_COATING_STEP_INVALID
          - errors.ERR_COATING_STEP_INVALID
        distinguishing_aspect: |
          The coating chain is ordered: DFT readings are declared only from PREP_ACCEPTED,
          so submitting them while the application is still SPEC_ISSUED returns
          ERR_COATING_STEP_INVALID (409) and no DFT aggregate is computed even though the
          spot payload is perfectly well formed.
        test_recipe:
          setup:
            - "Tank TK-101 with one SPEC_ISSUED external coating application."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "EXTERNAL_COATING", surface_area_sqft: 12500, specified_prep_standard: "SSPC_SP6", specified_min_dft_mils: 8.0, dft_acceptance_method: "SSPC_PA2_80_120", coating_system: "Epoxy / Urethane 2-coat" }
              as: ProjectEngineer
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /coating-applications/${ca_id}/dft-readings"
              payload: { spot_readings: [ [ 8.0, 8.5, 9.0 ], [ 8.2, 8.4, 8.6 ] ] }
              as: QcInspector
              as_user_id: "qc-1"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_COATING_STEP_INVALID'"
            - "CoatingApplication.${ca_id}.status is still 'SPEC_ISSUED', spot_count == 0, dft_verdict == 'NOT_EVALUATED' and computed_overall_average_mils == 0.0"

      - name: package_review_from_draft_is_an_undeclared_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.CommissioningPackage.transitions.SUBMITTED_to_ACCEPTED
          - validations.priority_22_ERR_PACKAGE_STATE_INVALID
          - errors.ERR_PACKAGE_STATE_INVALID
        distinguishing_aspect: |
          Review is declared only from SUBMITTED. Reviewing a package that is still DRAFT
          is refused with ERR_PACKAGE_STATE_INVALID (409) before any of the review's own
          gates (segregation of duties, tank posture) are consulted, and no inspection
          schedule is computed.
        test_recipe:
          setup:
            - "Tank TK-101 with one DRAFT commissioning package."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /commissioning-packages"
              payload: { tank_id: "${tank_id}" }
              as: ProjectEngineer
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /commissioning-packages/${cp_id}/review"
              payload: { decision: "ACCEPT" }
              as: AuthorizedInspector
              as_user_id: "ai-9"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_PACKAGE_STATE_INVALID'"
            - "CommissioningPackage.${cp_id}.status is still 'DRAFT', reviewed_by_user_id == null, accepted_at_utc == null"
            - "internal_inspection_interval_years == null and next_internal_due_utc == null - the schedule calculation did not run"
            - "Tank.${tank_id}.construction_phase is still 'DESIGN_REGISTERED'"

      - name: revoked_welder_cannot_be_renewed_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Welder.terminal_states
          - validations.priority_17_ERR_WELDER_STATE_INVALID
          - errors.ERR_WELDER_STATE_INVALID
        distinguishing_aspect: |
          REVOKED is terminal for a Welder: after a REVOKE, both RENEW and a second REVOKE
          are refused with ERR_WELDER_STATE_INVALID, and revoked_at_utc keeps the instant
          of the first revocation even though the logical clock has since advanced.
        test_recipe:
          setup:
            - "Welder W-07 qualified, then revoked at 2026-08-10T00:00:00Z; the clock is then moved to 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /welders/${w1_id}/qualification-actions"
              payload: { action: "REVOKE", remarks: "falsified continuity log" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
          trigger:
            - call: "POST /welders/${w1_id}/qualification-actions"
              payload: { action: "RENEW" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
            - call: "POST /welders/${w1_id}/qualification-actions"
              payload: { action: "REVOKE" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
          assert:
            - "both trigger calls return HTTP 409 with data.error_id == 'ERR_WELDER_STATE_INVALID'"
            - "Welder.${w1_id}.qualification_status is still 'REVOKED' and revoked_at_utc == '2026-08-10T00:00:00.000Z'"
            - "Welder.${w1_id}.qualification_date_utc is still '2026-06-01T00:00:00Z' - no action rewrote the performance-test date"

      - name: plate_lot_received_applies_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.PlateLot.transitions.SHIPPED_to_RECEIVED.side_effects
          - calculations.plate_steel_ledger
          - entities.Tank.fields.steel_received_lb
        distinguishing_aspect: |
          The RECEIVED transition carries four side effects and all four are asserted in
          one shot: mtr_number stored, received_weight_lb = plate_count x plate_weight_lb,
          remaining_weight_lb seeded to the same figure while allocated stays 0.0, and the
          parent Tank.steel_received_lb re-summed across both received lots.
        test_recipe:
          setup:
            - "Tank TK-101 with two lots walked ORDERED -> ROLLED -> SHIPPED: lot A is 10 x 1250.5 lb and lot B is 4 x 900.25 lb."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Gary Works", heat_number: "H-4471", thickness_in: 0.4375, plate_count: 10, plate_weight_lb: 1250.5, unit_cost_usd_per_lb: 0.62 }
              as: ErectionSuperintendent
              captures: { lot_a: $.data.id }
            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Gary Works", heat_number: "H-4472", thickness_in: 0.3125, plate_count: 4, plate_weight_lb: 900.25, unit_cost_usd_per_lb: 0.60 }
              as: ErectionSuperintendent
              captures: { lot_b: $.data.id }
            - call: "POST /plate-lots/${lot_a}/status-transitions"
              payload: { target_status: "ROLLED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lot_a}/status-transitions"
              payload: { target_status: "SHIPPED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lot_b}/status-transitions"
              payload: { target_status: "ROLLED" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lot_b}/status-transitions"
              payload: { target_status: "SHIPPED" }
              as: ErectionSuperintendent
          trigger:
            - call: "POST /plate-lots/${lot_a}/status-transitions"
              payload: { target_status: "RECEIVED", mtr_number: "MTR-4471-A" }
              as: ErectionSuperintendent
            - call: "POST /plate-lots/${lot_b}/status-transitions"
              payload: { target_status: "RECEIVED", mtr_number: "MTR-4472-B" }
              as: ErectionSuperintendent
          assert:
            - "after the first trigger: PlateLot.${lot_a}.status == 'RECEIVED', mtr_number == 'MTR-4471-A', received_weight_lb == 12505.00, allocated_weight_lb == 0.00, remaining_weight_lb == 12505.00; Tank.${tank_id}.steel_received_lb == 12505.00"
            - "after the second trigger: PlateLot.${lot_b}.received_weight_lb == 3601.00 and remaining_weight_lb == 3601.00"
            - "Tank.${tank_id}.steel_received_lb == 16106.00 (12505.00 + 3601.00) and steel_allocated_lb == 0.00"

      - name: course_status_bubbles_up_only_when_every_seam_is_welded
        claim_type: bubble_up
        grounds:
          - state_machines.ShellCourse.transitions.FITTED_to_WELDED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The compound parent state is re-derived after every child write, not on the first
          one: with two seams on the course, welding seam V1 leaves the course FITTED
          because V2 is still FIT_READY, and only the second weld-log flips the course to
          WELDED.
        test_recipe:
          setup:
            - "Tank TK-101 with an ACCEPTED foundation, one FITTED 0.4375 in course carrying seams V1 and V2, and QUALIFIED welder W-07."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ErectionSuperintendent
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { s1: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V2", length_in: 96, sequence_index: 2 }
              as: ErectionSuperintendent
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /weld-seams/${s1}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /weld-seams/${s2}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
          assert:
            - "after the first weld-log: WeldSeam.${s1}.status == 'WELDED' with welded_at_utc == '2026-08-10T00:00:00.000Z', while GET /shell-courses/${course_id} still reports status == 'FITTED'"
            - "after the second weld-log: WeldSeam.${s2}.status == 'WELDED' and ShellCourse.${course_id}.status == 'WELDED'"
            - "Tank.${tank_id}.construction_phase is 'ERECTION_IN_PROGRESS' throughout - the shell is not complete until RT accepts every seam"
            - "Welder.${w1_id}.last_weld_date_utc == '2026-08-10T00:00:00.000Z' and continuity_expires_at_utc == '2027-02-06T00:00:00Z' (last weld + 180 days), so production welding refreshed continuity"

      - name: foundation_rejection_clears_the_baseline_pointer_cross_entity
        claim_type: cross_entity
        grounds:
          - state_machines.FoundationPackage.transitions.BASELINE_SET_to_REJECTED.side_effects
          - state_machines.FoundationPackage.transitions.REJECTED_to_BASELINE_SET
          - entities.FoundationPackage.fields.baseline_survey_id
        distinguishing_aspect: |
          A REJECT decision reaches sideways into the survey linkage rather than the tank:
          baseline_survey_id is cleared to null so a fresh zero-fill survey can re-arm the
          package, while Tank.construction_phase stays DESIGN_REGISTERED - and the first
          survey row itself is left intact with survey_role BASELINE.
        test_recipe:
          setup:
            - "Tank TK-101 with a foundation package whose baseline survey has been shot (status BASELINE_SET)."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
              captures: { survey1: $.data.id }
          trigger:
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "REJECT", decision_remarks: "ringwall out of level, regrade required" }
              as: ProjectEngineer
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 99.500 }, { point_index: 2, elevation_in: 99.500 }, { point_index: 3, elevation_in: 99.500 }, { point_index: 4, elevation_in: 99.500 }, { point_index: 5, elevation_in: 99.500 }, { point_index: 6, elevation_in: 99.500 }, { point_index: 7, elevation_in: 99.500 }, { point_index: 8, elevation_in: 99.500 } ] }
              as: CivilContractor
              captures: { survey2: $.data.id }
          assert:
            - "after the REJECT: FoundationPackage.${fp_id}.status == 'REJECTED', decision_remarks stored, decided_at_utc and decided_by_user_id stamped, and baseline_survey_id == null"
            - "Tank.${tank_id}.construction_phase is still 'DESIGN_REGISTERED'"
            - "SettlementSurvey.${survey1} is unchanged: survey_role == 'BASELINE', verdict == 'BASELINE', nonconformance_state == 'NOT_APPLICABLE'"
            - "after the re-shot baseline: FoundationPackage.${fp_id}.status == 'BASELINE_SET' and baseline_survey_id == ${survey2}"
            - "SettlementSurvey.${survey2}.survey_role == 'BASELINE' and GET /settlement-surveys?foundation_package_id=${fp_id} returns total_count == 2"

      - name: cyclic_shape_loop_and_termination
        claim_type: cyclic
        excluded_because:
          difficulty_instance: coating_rework_loop_resets_and_is_uncapped
          rationale: |
            §1.8 already walks a CoatingApplication twice around the
            DFT_RECORDED -> REWORK_REQUIRED -> PREP_ACCEPTED loop, asserting that
            rework_cycle_count climbs while no cap ever fires, and pairs it with
            weld_seam_repair_cycle_terminates_at_cap for the bounded loop.

      - name: parallel_dimensions_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: tank_phase_and_posture_move_independently
          rationale: |
            §1.8 drives Tank.construction_phase and Tank.quality_posture through
            interleaved writes and asserts each of the four combined states, which is
            exactly the `parallel` shape claim.

      - name: guarded_transition_cross_entity_precondition
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: weld_log_gate_reads_welder_qualification_status
          rationale: |
            The weld-log transition's guard on Welder.qualification_status is asserted in
            §1.8 in both directions (QUALIFIED passes, LAPSED yields
            ERR_WELDER_NOT_QUALIFIED) with the seam otherwise unchanged.

      - name: cascade_down_parent_change_reaches_children
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: nde_rejection_five_hop_posture_suspension_water_release
          rationale: |
            The deepest cascade in the scaffold - report -> seam -> posture -> plan
            suspension -> withdrawal cancellation -> water-source release - is asserted hop
            by hop in §1.8, including the rule that only non-terminal children move.

      - name: ledger_sync_updates_ancestor_derived_field
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: steel_mass_conserved_across_allocation_and_release
          rationale: |
            §1.8 reconciles PlateLot.allocated_weight_lb / remaining_weight_lb against the
            ancestor Tank.steel_allocated_lb before and after both an allocation and a
            release, which is the ledger-sync claim.

      - name: compensation_reverses_original_side_effects
        claim_type: compensation
        excluded_because:
          difficulty_instance: nonconformance_count_and_reject_rate_reversed_by_nde_void
          rationale: |
            The void path is the scaffold's only undo transition, and §1.8 asserts that
            every quantity it touched (posture, open_nonconformance_count,
            weld_reject_rate, required_examination_pct, plan status, water ledger) returns
            to its pre-rejection value with no drift.

      - name: conditional_cascade_fires_only_for_children_in_one_state
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: coating_holiday_four_hop_returns_submitted_commissioning_package
          rationale: |
            §1.8 shows the holiday-test cascade returning a SUBMITTED commissioning
            package while leaving a DRAFT package of the same tank untouched, which is the
            conditional-cascade claim.

  # ===========================================================================
  - section: calculations
    instances:
      - name: uniform_settlement_scores_zero_on_both_metrics
        claim_type: correct_result
        grounds:
          - calculations.differential_settlement_evaluation
          - entities.SettlementSurvey.fields.governing_metric_in
          - entities.SettlementSurvey.fields.verdict
        distinguishing_aspect: |
          A rigid-body sinking of exactly 2 in at all eight points is the case where the two
          variants agree: uniform_settlement_in is 2.000 while both max_out_of_plane_in and
          max_adjacent_differential_in are 0.000, so the verdict is WITHIN_TOLERANCE and no
          nonconformance opens. This is the reference result the §1.8 divergence pair is
          measured against.
        test_recipe:
          setup:
            - "Tank TK-101 with a COSINE_BEST_FIT foundation package whose baseline survey reads 100.000 in at all eight points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CivilContractor
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 50, point_readings: [ { point_index: 1, elevation_in: 98.000 }, { point_index: 2, elevation_in: 98.000 }, { point_index: 3, elevation_in: 98.000 }, { point_index: 4, elevation_in: 98.000 }, { point_index: 5, elevation_in: 98.000 }, { point_index: 6, elevation_in: 98.000 }, { point_index: 7, elevation_in: 98.000 }, { point_index: 8, elevation_in: 98.000 } ] }
              as: CivilContractor
              captures: { mon_id: $.data.id }
          assert:
            - "SettlementSurvey.${base_id}: survey_role == 'BASELINE', verdict == 'BASELINE', uniform_settlement_in == 0.000, governing_metric_in == 0.000"
            - "SettlementSurvey.${mon_id}: survey_role == 'MONITORING' (fill_percent > 0), measured_at_utc == '2026-08-10T00:00:00.000Z' from the logical clock default"
            - "SettlementSurvey.${mon_id}: uniform_settlement_in == 2.000, max_out_of_plane_in == 0.000, max_adjacent_differential_in == 0.000, governing_metric_in == 0.000"
            - "SettlementSurvey.${mon_id}: verdict == 'WITHIN_TOLERANCE' (0.000 <= allowable 2.356 and uniform 2.000 <= permitted 6.0) and nonconformance_state == 'NOT_APPLICABLE'"
            - "Tank.${tank_id}.open_nonconformance_count == 0 and quality_posture == 'OPEN'"

      - name: required_thickness_rounds_each_case_to_three_decimals
        claim_type: precision
        grounds:
          - calculations.shell_course_required_thickness.precision
          - entities.ShellCourse.fields.required_thickness_in
          - entities.ShellCourse.fields.governing_case
        distinguishing_aspect: |
          Rounding happens per case and BEFORE the three-way MAX. Course 2 sits 8 ft up, so
          H is 32 ft and the raw design figure is 0.3577155..., which round_half_up at three
          decimals turns into 0.358 - the value that must appear in required_thickness_in.
          Rounding after the MAX, or carrying full precision into the comparison, gives a
          different stored figure.
        test_recipe:
          setup:
            - "Tank TK-101 with course 1 already specified at 8 ft wide, so course 2's bottom elevation is 8 ft."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 2, course_width_ft: 8, plate_thickness_in: 0.375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c2: $.data.id }
          assert:
            - "ShellCourse.${c2}.course_bottom_elevation_ft == 8.0 and design_liquid_height_ft == 32.0"
            - "ShellCourse.${c2}.required_thickness_design_in == 0.358 (2.6 * 31 * 100 * 0.85 / 23200 = 0.2952155, + 0.0625 = 0.3577155, rounded half-up at three decimals)"
            - "ShellCourse.${c2}.required_thickness_test_in == 0.324 (2.6 * 31 * 100 / 24900 = 0.3236948; the corrosion allowance is NOT added here)"
            - "the floor candidate is Tank.${tank_id}.min_nominal_thickness_in == 0.250, so ShellCourse.${c2}.required_thickness_in == 0.358 with governing_case == 'DESIGN'"
            - "ShellCourse.${c2}.thickness_verdict == 'ADEQUATE' because the 0.375 in plate clears 0.358"
            - "ShellCourse.${c1} is untouched: course_bottom_elevation_ft == 0.0 and required_thickness_design_in == 0.434"

      - name: elevation_stack_excludes_courses_of_other_tanks
        claim_type: input_set_filtering
        grounds:
          - calculations.shell_course_required_thickness.input_set
          - entities.ShellCourse.fields.course_bottom_elevation_ft
        distinguishing_aspect: |
          The elevation stack sums only same-tank courses with a lower course_number. Tank
          TK-102 gets a course 1 that is 20 ft wide, and TK-101's course 2 must still sit at
          8 ft - proving the sum is scoped by tank_id, not by course_number alone.
        test_recipe:
          setup:
            - "Two tanks: TK-101 with an 8 ft course 1, TK-102 with a 20 ft course 1."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /tanks"
              payload: { tank_tag: "TK-102", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank2_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { a1: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank2_id}", course_number: 1, course_width_ft: 20, plate_thickness_in: 0.5, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 2, course_width_ft: 8, plate_thickness_in: 0.375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { a2: $.data.id }
          assert:
            - "ShellCourse.${a2}.course_bottom_elevation_ft == 8.0, not 28.0 - TK-102's 20 ft course 1 contributes nothing"
            - "ShellCourse.${a2}.required_thickness_in == 0.358 with governing_case == 'DESIGN'"
            - "ShellCourse.${b1}.course_bottom_elevation_ft == 0.0 and its required thickness is unchanged by the new TK-101 course"
            - "GET /shell-courses?tank_id=${tank_id} returns total_count == 2 and GET /shell-courses?tank_id=${tank2_id} returns total_count == 1"

      - name: clearance_envelope_applies_each_declared_type_constant
        claim_type: constants_applied
        grounds:
          - calculations.appurtenance_clearance_envelope.constants
          - entities.Appurtenance.fields.required_clearance_deg
        distinguishing_aspect: |
          required_clearance_deg is set from the type table at creation, and all four
          branches are exercised in one instance: STAIRWAY takes the flat 30.0, MIXER 20.0,
          ROOF_VENT 5.0, while a 6 in NOZZLE takes MAX(8.0, 6 * 1.5) == 9.0 and a 4 in
          NOZZLE takes MAX(8.0, 4 * 1.5 == 6.0) == 8.0, where the floor rather than the
          factor governs.
        test_recipe:
          setup:
            - "Tank TK-101 with one specified course to host the appurtenances."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /appurtenances"
              payload: { tank_id: "${tank_id}", host_shell_course_id: "${course_id}", appurtenance_type: "NOZZLE", nominal_size_in: 6, elevation_ft: 4.0, azimuth_deg: 0.0 }
              as: ProjectEngineer
              captures: { n6: $.data.id }
            - call: "POST /appurtenances"
              payload: { tank_id: "${tank_id}", host_shell_course_id: "${course_id}", appurtenance_type: "NOZZLE", nominal_size_in: 4, elevation_ft: 4.0, azimuth_deg: 40.0 }
              as: ProjectEngineer
              captures: { n4: $.data.id }
            - call: "POST /appurtenances"
              payload: { tank_id: "${tank_id}", host_shell_course_id: "${course_id}", appurtenance_type: "STAIRWAY", nominal_size_in: 36, elevation_ft: 0.0, azimuth_deg: 90.0 }
              as: ProjectEngineer
              captures: { st: $.data.id }
            - call: "POST /appurtenances"
              payload: { tank_id: "${tank_id}", host_shell_course_id: "${course_id}", appurtenance_type: "MIXER", nominal_size_in: 18, elevation_ft: 3.0, azimuth_deg: 180.0 }
              as: ProjectEngineer
              captures: { mx: $.data.id }
            - call: "POST /appurtenances"
              payload: { tank_id: "${tank_id}", host_shell_course_id: "${course_id}", appurtenance_type: "ROOF_VENT", nominal_size_in: 8, elevation_ft: 40.0, azimuth_deg: 270.0 }
              as: ProjectEngineer
              captures: { rv: $.data.id }
          assert:
            - "Appurtenance.${n6}.required_clearance_deg == 9.0 (MAX(8.0, 6 * 1.5))"
            - "Appurtenance.${n4}.required_clearance_deg == 8.0 (MAX(8.0, 4 * 1.5) - the NOZZLE_MIN_CLEARANCE_DEG floor governs)"
            - "Appurtenance.${st}.required_clearance_deg == 30.0, Appurtenance.${mx}.required_clearance_deg == 20.0, Appurtenance.${rv}.required_clearance_deg == 5.0"
            - "all five rows are created with status == 'DESIGNED' and installed_at_utc == null, so no clash check has run yet"

      - name: document_completeness_aggregates_distinct_types_in_declared_order
        claim_type: aggregation
        grounds:
          - calculations.commissioning_document_completeness
          - entities.CommissioningPackage.fields.missing_document_types
          - entities.CommissioningPackage.fields.submitted_document_types
        distinguishing_aspect: |
          The aggregate is order-normalised and duplicate-tolerant: documents are recorded
          out of order and one type twice, yet submitted_document_types comes back in
          REQUIRED_DOCUMENT_TYPES order with the optional type appended last,
          missing_document_types preserves the required order, and document_count counts
          the duplicate while the distinct arrays do not.
        test_recipe:
          setup:
            - "Tank TK-101 with a DRAFT commissioning package holding no documents."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /commissioning-packages"
              payload: { tank_id: "${tank_id}" }
              as: ProjectEngineer
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /commissioning-packages/${cp_id}/documents"
              payload: { document_type: "HYDROTEST_RECORD", reference_number: "HT-1" }
              as: ProjectEngineer
            - call: "POST /commissioning-packages/${cp_id}/documents"
              payload: { document_type: "COATING_REPORT", reference_number: "CR-1" }
              as: ProjectEngineer
            - call: "POST /commissioning-packages/${cp_id}/documents"
              payload: { document_type: "MILL_TEST_REPORTS", reference_number: "MTR-1" }
              as: ProjectEngineer
            - call: "POST /commissioning-packages/${cp_id}/documents"
              payload: { document_type: "HYDROTEST_RECORD", reference_number: "HT-1-REV-B" }
              as: ProjectEngineer
          assert:
            - "at creation: submitted_document_types == [] , missing_document_types == ['MILL_TEST_REPORTS', 'RT_FILM_LOG', 'HYDROTEST_RECORD', 'AS_BUILT_DRAWING'], document_count == 0"
            - "after all four triggers: document_count == 4"
            - "submitted_document_types == ['MILL_TEST_REPORTS', 'HYDROTEST_RECORD', 'COATING_REPORT'] - required types first in their declared order, then the optional type"
            - "missing_document_types == ['RT_FILM_LOG', 'AS_BUILT_DRAWING'] in REQUIRED_DOCUMENT_TYPES order"
            - "the duplicate HYDROTEST_RECORD raised document_count but did not duplicate the entry in submitted_document_types"
            - "CommissioningPackage.${cp_id}.status is still 'DRAFT' - recording documents is not a submission"

      - name: inspection_intervals_decay_from_bottom_plate_life
        claim_type: decay_function
        grounds:
          - calculations.in_service_inspection_schedule
          - state_machines.CommissioningPackage.transitions.SUBMITTED_to_ACCEPTED.side_effects
          - state_machines.Tank.construction_phase.COATED_to_COMMISSIONED
        distinguishing_aspect: |
          The whole in-service schedule is produced by one event - the ACCEPT review - and
          the decay curve is driven by bottom-plate corrosion, not by the calendar: a
          0.15 in corrosion allowance at 0.01 ipy gives 15.00 years of remaining life,
          FLOOR(15.00 / 2) = 7 years internal (well under the 20-year cap), and the
          external interval takes the COATED branch of 5 years because an EXTERNAL_COATING
          application is ACCEPTED. Both due dates anchor on accepted_at_utc.
        test_recipe:
          setup:
            - "Tank TK-101 driven to COATED with both coatings accepted, one installed nozzle, a PASSED hydrotest, and a commissioning package holding all four required documents, submitted by pe-1."
