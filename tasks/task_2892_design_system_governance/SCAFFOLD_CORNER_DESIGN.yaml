  - section: errors
    instances:
      - name: every_not_found_id_answers_with_its_own_entity_specific_error
        claim_type: triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_TEAM_NOT_FOUND]
          - errors[ERR_COMPONENT_NOT_FOUND]
          - errors[ERR_COMPONENT_DEPENDENCY_NOT_FOUND]
          - errors[ERR_PLATFORM_IMPLEMENTATION_NOT_FOUND]
          - errors[ERR_TOKEN_SET_NOT_FOUND]
          - errors[ERR_TOKEN_NOT_FOUND]
          - errors[ERR_PROPOSAL_NOT_FOUND]
          - errors[ERR_RELEASE_NOT_FOUND]
          - errors[ERR_DEPRECATION_PLAN_NOT_FOUND]
          - errors[ERR_EXCEPTION_GRANT_NOT_FOUND]
        distinguishing_aspect: |
          The catalog declares ten distinct 404 ids, one per entity, so a shared generic
          NOT_FOUND is not acceptable: ten unresolvable path ids on ten different routes must
          each answer with that route's own entity id at 404. The sweep also covers the
          action-route case (publish, advance, re-pin), where an implementation that resolved the
          body before the path would answer with the wrong id or a 400.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "an empty domain: no row of any entity exists, so 00000000-0000-4000-8000-00000000beef resolves to nothing anywhere"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /design-system/teams/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: SystemAdmin
              captures: { e_team: $.data.error_id }
            - call: "GET /design-system/components/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: DesignSystemLead
              captures: { e_component: $.data.error_id }
            - call: "PUT /design-system/component-dependencies/00000000-0000-4000-8000-00000000beef"
              payload: { pinned_provider_major: 1 }
              as: DesignSystemLead
              captures: { e_dependency: $.data.error_id }
            - call: "GET /design-system/platform-implementations/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: DesignSystemLead
              captures: { e_impl: $.data.error_id }
            - call: "GET /design-system/token-sets/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: DesignSystemLead
              captures: { e_token_set: $.data.error_id }
            - call: "GET /design-system/tokens/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: DesignSystemLead
              captures: { e_token: $.data.error_id }
            - call: "GET /design-system/contribution-proposals/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: DesignSystemLead
              captures: { e_proposal: $.data.error_id }
            - call: "POST /design-system/releases/00000000-0000-4000-8000-00000000beef/publish"
              payload: {}
              as: SystemAdmin
              captures: { e_release: $.data.error_id }
            - call: "POST /design-system/deprecation-plans/00000000-0000-4000-8000-00000000beef/advance"
              payload: {}
              as: DesignSystemLead
              captures: { e_plan: $.data.error_id }
            - call: "GET /design-system/exception-grants/00000000-0000-4000-8000-00000000beef"
              payload: {}
              as: DesignSystemLead
              captures: { e_grant: $.data.error_id }
          assert:
            - "${e_team} == ERR_TEAM_NOT_FOUND"
            - "${e_component} == ERR_COMPONENT_NOT_FOUND"
            - "${e_dependency} == ERR_COMPONENT_DEPENDENCY_NOT_FOUND"
            - "${e_impl} == ERR_PLATFORM_IMPLEMENTATION_NOT_FOUND"
            - "${e_token_set} == ERR_TOKEN_SET_NOT_FOUND"
            - "${e_token} == ERR_TOKEN_NOT_FOUND"
            - "${e_proposal} == ERR_PROPOSAL_NOT_FOUND"
            - "${e_release} == ERR_RELEASE_NOT_FOUND"
            - "${e_plan} == ERR_DEPRECATION_PLAN_NOT_FOUND"
            - "${e_grant} == ERR_EXCEPTION_GRANT_NOT_FOUND"
            - "every one of the ten responses carries HTTP status 404 and the §1.0 error envelope (response_type error, data.error_id, data.message)"

      - name: slug_and_component_platform_pair_uniqueness_both_answer_with_one_id
        claim_type: triggerable
        grounds:
          - validations[priority=19]
          - errors[ERR_UNIQUENESS_CONFLICT]
          - entities.Component.fields.slug
          - entities.PlatformImplementation.fields.platform
        distinguishing_aspect: |
          Priority 19 folds two structurally different uniqueness rules onto one error id: a
          repeated global Component.slug and a repeated (component_id, platform) implementation
          pair must both answer ERR_UNIQUENESS_CONFLICT at 409, while the same platform under a
          different component must succeed - proving the second key is scoped per component and
          not global.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns Component `badge` (with a WEB implementation) and Component `chip`"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
