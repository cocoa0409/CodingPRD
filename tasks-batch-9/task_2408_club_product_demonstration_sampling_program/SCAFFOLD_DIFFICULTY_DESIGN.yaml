  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: booking_and_staffing_dimensions_advance_independently_through_a_staffing_cycle
        grounds:
          - state_machines.DemoEvent.transitions.UNSTAFFED_to_PARTIALLY_STAFFED
          - state_machines.DemoEvent.transitions.PARTIALLY_STAFFED_to_FULLY_STAFFED
          - state_machines.DemoEvent.transitions.FULLY_STAFFED_to_PARTIALLY_STAFFED
          - state_machines.EventAssignment.transitions.ASSIGNED_to_NO_SHOW
          - calculations.staffing_coverage
          - entities.DemoEvent.fields.no_show_recovery_open
          - entities.EventAssignment.fields.replaces_assignment_id
        distinguishing_aspect: |
          DemoEvent carries two independent state dimensions. Across the whole
          trigger sequence booking_status never leaves CONFIRMED, while
          staffing_status walks UNSTAFFED -> PARTIALLY_STAFFED ->
          FULLY_STAFFED -> PARTIALLY_STAFFED -> FULLY_STAFFED, re-entering
          FULLY_STAFFED a second time via a replacement assignment. The
          backward hop is not a revert of the forward hop: it flips
          no_show_recovery_open to true and mints a 33810-cent
          DEMONSTRATOR_NO_SHOW credit, and the second forward hop clears
          no_show_recovery_open without touching that credit.
        test_recipe:
          setup:
            - "Manufacturer M (STANDARD, limit 5000000), club C (STANDARD, daily_event_capacity 4, food_station_count 3), FOOD product P (samples_per_case 60, weekly_sample_case_pool 40, unit_cost_cents 210)."
            - "Three demonstrators homed at C, each holding a valid FOOD_HANDLER certification: L (lead), S1 (first support), S2 (replacement support)."
            - "DemoEvent E on 2026-09-14 MIDDAY with requested_sample_cases 6, driven to CONFIRMED so allocated_sample_cases is 6 and required_support_count is 1 (SUPPORT_REQUIRED_CASE_THRESHOLD 6)."
            - "Logical clock moved to 2026-09-14T11:35:00Z, which is past scheduled_start_utc 11:15Z plus NO_SHOW_GRACE_MINUTES 15, so NO_SHOW is declarable."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Ashgrove Dairy Partners", billing_email: "ap@ashgrove.example", program_tier: "STANDARD", credit_limit_cents: 5000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
