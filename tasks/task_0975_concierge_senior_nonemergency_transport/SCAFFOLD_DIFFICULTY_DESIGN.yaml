      - name: cancellation_notice_exact_boundaries
        grounds:
          - calculations.cancellation_fee
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Metric = notice_minutes on POST /rides/{id}/cancel: exactly 1440 is free
          (>=), exactly 240 takes the 50% tier (>=), and 239 takes the 100% tier —
          off-by-one minute crosses each fee tier.
        test_recipe:
          setup:
            - "ACTIVE STANDARD card (minimum 2501); ACTIVE client; three SCHEDULED rides"
