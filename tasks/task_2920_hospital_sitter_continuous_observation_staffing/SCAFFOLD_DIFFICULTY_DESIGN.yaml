              captures: { p17: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_o}", full_name: "Observer Oh", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s_o: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p17}", ordering_provider_user_id: "prov-1", risk_categories: ["ELOPEMENT"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Exit-seeking, remote observation approved" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o17: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${s_o}", station_label: "CONSOLE-O1", declared_max_span: 2 }
              as: StaffingCoordinator
              captures: { st_o: $.data.id }
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st_o}", order_id: "${o17}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T12:00:00Z" }
              as: RemoteObserver
              as_user_id: "${s_o}"
              captures: { f_o: $.data.id }
          trigger:
            - call: "POST /observation/monitoring-stations/${st_o}/offline"
              payload: {}
              as: RemoteObserver
              as_user_id: "${s_o}"
            - call: "POST /observation/video-feeds/${f_o}/release"
              payload: {}
              as: RemoteObserver
              as_user_id: "${s_o}"
            - call: "POST /observation/monitoring-stations/${st_o}/offline"
              payload: {}
              as: RemoteObserver
              as_user_id: "${s_o}"
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st_o}", order_id: "${o17}", monitor_start_at: "2026-08-01T13:00:00Z", monitor_end_at: "2026-08-01T15:00:00Z" }
              as: RemoteObserver
              as_user_id: "${s_o}"
          assert:
            - "BLOCKED: the first offline returns HTTP 409 with error.code == ERR_STATION_HAS_ACTIVE_FEEDS"
            - "After the blocked call MonitoringStation.${st_o}.status is still ACTIVE_MONITORING with active_feed_count 1, active_acuity_weight 2.0, effective_span_limit 2, offlined_at == null"
            - "The release leaves MonitoringStation.${st_o}.status == IDLE, active_feed_count 0, active_acuity_weight 0.0, effective_span_limit 2, and Staff.${s_o}.status == AVAILABLE"
            - "ALLOWED: the second offline returns HTTP 200 with MonitoringStation.${st_o}.status == OFFLINE and offlined_at == 2026-08-01T00:00:00Z"
            - "REVERSE DIRECTION: the final feed create returns HTTP 409 with error.code == ERR_INVALID_STATION_STATE and GET /observation/monitoring-stations/${st_o}/video-feeds still returns exactly 1 row (the RELEASED ${f_o})"
            - "Staff.${s_o}.status is still AVAILABLE after the station goes OFFLINE (offlining does not suspend the observer)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: staff_pairwise_half_open_overlap_then_exact_480_minute_rest_buffer
        resource_entity: Staff
        interval_semantics: "pairwise half-open [start, end) comparison against every peer shift of the same staff member, followed by a minimum-gap (rest buffer) rule on the non-overlapping pairs"
        grounds:
          - calculations.staff_shift_conflict_check
          - validations.priority_17
          - validations.priority_18
        distinguishing_aspect: |
          Pairwise semantics on a human resource: each candidate window is compared to each peer window
          one at a time, and the two temporal rules are separated by their priorities. All three
          candidates are created against a SECOND order whose version is never bumped by a rejected
          request, so the same expected_order_version literal can be replayed and the OCC rule at
          priority 7 never masks the temporal outcome. Three probes pin the semantics exactly:
          touching-at-16:00 does NOT overlap (half-open) but violates the 480-minute buffer;
          starting one minute earlier DOES overlap and the higher-priority overlap error wins; and a
          gap of exactly 480 minutes is accepted (>= not >).
        test_recipe:
          setup:
            - "Unit UNIT-P budget 500000, video disabled; two admitted patients age 60, each with an ACTIVE FALL-only order."
            - "One INTERNAL_FLOAT sitter S_P at 2000 cents/hour, ADVANCED, homed on UNIT-P."
