            - "After the sample the request read grading_status == SAMPLED and weighing_status == WEIGHED — sampling did not disturb weighing"
            - "201 on the trigger; GET /grain-inspection/inspection-requests/${req} -> grading_status == GRADED, weighing_status == WEIGHED, certified_quantity_bushels == 3609.27 (weighing owns the official quantity)"
            - "Issuing a COMBINED certificate then moves BOTH dimensions: grading_status == GRADE_CERTIFIED and weighing_status == WEIGHT_CERTIFIED in one call"

      - name: inspector_suspension_aborts_their_scheduled_watches
        claim_type: cross_entity
        grounds:
          - "state_machines.VesselWatch.status.SCHEDULED_to_ABORTED"
          - "state_machines.Inspector.license_status.ACTIVE_to_SUSPENDED"
          - "entities.ServiceArea.fields.open_watch_count"
        distinguishing_aspect: "Suspending a supervisor is a licence-level event that must reach into the VesselWatch collection: every non-terminal watch they hold is ABORTED and the area's open_watch_count is decremented, freeing the window for another supervisor."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00Z."
            - "A DESIGNATED area with concurrent_watch_capacity 1, one ACTIVE supervisor and two export requests with EXPORT_SUPERVISION requested."
            - "One SCHEDULED watch for that supervisor covering 08:00Z to 12:00Z; open_watch_count is 1."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T07:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED", concurrent_watch_capacity: 1 }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Ocean Grain Traders", account_code: "OGT-101", contact_email: "export@ocean.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1208", full_name: "S. Suspendable", endorsements: ["SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${insp}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-SUSP", declared_quantity_bushels: 5000, requested_services: ["GRADING", "EXPORT_SUPERVISION"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/vessel-watches
              as: SupervisingInspector
              payload: { inspection_request_id: "${req}", supervisor_inspector_id: "${insp}", vessel_name: "MV Suspended", window_start_at: "2026-08-03T08:00:00Z", window_end_at: "2026-08-03T12:00:00Z", holds_declared: 2 }
              captures: { vw: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/inspectors/${insp}/suspend
              as: ServiceAdmin
              payload: { suspension_reason: "Under investigation" }
          assert:
            - "200; license_status == SUSPENDED with suspension_reason == \"Under investigation\""
            - "GET /grain-inspection/vessel-watches/${vw} -> status == ABORTED (the cascade reached the watch)"
            - "GET /grain-inspection/service-areas/${area} -> open_watch_count == 0, so a watch for a different supervisor over the same 08:00Z to 12:00Z window is now accepted despite concurrent_watch_capacity 1"
            - "POST /grain-inspection/vessel-watches/${vw}/start -> 409 ERR_INVALID_STATE_TRANSITION (ABORTED is terminal)"
            - "Reinstating the inspector to ACTIVE does NOT resurrect the watch: GET /grain-inspection/vessel-watches/${vw} -> still ABORTED"

      - name: weighing_countersignature_requires_an_active_supervisor_licence
        claim_type: guarded_transitions
        grounds:
          - "state_machines.InspectionRequest.weighing_status.WEIGHED_to_SUPERVISED"
          - "errors[ERR_INSPECTOR_LICENSE_INVALID]"
          - "entities.Inspector.fields.license_status"
          - "validations[priority=9]"
        distinguishing_aspect: "The WEIGHED to SUPERVISED transition is guarded by state on a DIFFERENT entity: weighing itself is open to a PROBATIONARY inspector, but countersigning demands license_status == ACTIVE, so the same person becomes eligible only after training and activation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DESIGNATED area with supervision_required true and a certified SCALE (capacity 400000, tolerance 20.0)."
            - "A PROBATIONARY weigher holding WEIGHING and a separate PROBATIONARY inspector holding WEIGHING and SUPERVISION with no training hours."
            - "A CORN request with GRADING and WEIGHING requested whose weighing record is in WEIGHED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
