scenario: |
  Generate task harder than expert level!

  2512. Life Science Building Conversion & Tenant Fit-Out (life science landlord): base building
  suitability assessment for floor-to-floor height, structural loading, vibration and utility
  capacity, conversion scope for lab exhaust, emergency power, chemical storage and waste handling,
  tenant improvement allowance negotiation with lab-specific cost premiums, hazardous material use
  permitting and control area limits per floor, shared amenity and equipment programming across
  tenants, phased delivery in a partially occupied building with vibration and shutdown
  coordination, tenant-specific validation and commissioning requirements, restoration obligations
  at lease expiration

domain_name: life-science-conversion
api_prefix: "/"   # flat topology: peer collections live at the URL root (/buildings, /leases, /fit-out-projects, ...)

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  difficulty_level: expert_plus   # §0.4 Expert band, deliberately pushed above it per the scenario request

  entity_topology: flat
  # 14 peer collections at the URL root joined by explicit FK fields in request bodies; the only
  # nested paths are creation/reverse-reachability sub-resources (e.g. POST /buildings/{id}/floors).

  state_machine_shape: cyclic
  # Lease alternates NEGOTIATING <-> COUNTER_PENDING for up to 6 turn-taking negotiation rounds;
  # Building re-enters ASSESSING from any ASSESSED_* state; PhasePackage cycles
  # SCHEDULED -> VIBRATION_HOLD -> SCHEDULED. FitOutProject additionally carries two INDEPENDENT
  # state dimensions on one row (permit_status x construction_status).

  relationship_patterns:
    - one_to_many          # Building -> Floor, Lease -> TIProposal, FitOutProject -> PhasePackage
    - many_to_many         # SharedAmenity <-> FitOutProject via AmenityAllocation
    - self_referential     # PhasePackage.predecessor_phase_id -> PhasePackage.id (transitive block cascade)
    - cross_aggregate      # HazmatUsePermit spans FitOutProject (tenant aggregate) and Floor (base-building aggregate)

  role_model: segregation_of_duties
  # The landlord operator who authored/accepted the winning TIProposal may not execute the lease;
  # the commissioning technician who executed a script may not witness its result.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Building
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Base building marketing name
      - name: address_city
        type: string
        source: input
        description: City of record for the base building
      - name: occupancy_status
        type: enum
        source: input
        description: Occupancy posture that governs phased-delivery coordination
        constraints: "one of {VACANT, PARTIALLY_OCCUPIED, FULLY_OCCUPIED}"
      - name: published_floor_to_floor_ft
        type: number
        source: input
        description: Nameplate floor-to-floor height from the base-building drawing set; SCREENING assessments fall back to this
        constraints: "> 0; 2 decimal places"
      - name: published_live_load_psf
        type: number
        source: input
        description: Nameplate structural live-load capacity in lb/sf; SCREENING assessments fall back to this
        constraints: "> 0"
      - name: published_vibration_class
        type: enum
        source: input
        description: Nameplate ambient vibration criterion curve; SCREENING assessments fall back to this
        constraints: "one of {VC_A, VC_B, VC_C, VC_D, VC_E}"
      - name: exhaust_riser_capacity_cfm
        type: number
        source: input
        description: Base-building lab exhaust riser capacity in CFM before any conversion scope is completed
        constraints: ">= 0"
      - name: emergency_power_capacity_kw
        type: number
        source: input
        description: Base-building emergency generator capacity in kW before any conversion scope is completed
        constraints: ">= 0"
      - name: chilled_water_capacity_tons
        type: number
        source: input
        description: Base-building chilled water capacity in tons (reported only, not pooled)
        constraints: ">= 0"
      - name: suitability_state
        type: enum
        source: system
        description: Conversion lifecycle state of the base building
        default: DRAFT
        constraints: "one of {DRAFT, ASSESSING, ASSESSED_SUITABLE, ASSESSED_CONDITIONAL, ASSESSED_UNSUITABLE, CONVERSION_APPROVED, CONVERSION_COMPLETE}"
      - name: latest_assessment_verdict
        type: enum
        source: computed
        description: verdict of the most recently ACCEPTED SuitabilityAssessment on this building; null before the first acceptance
        default: null
        constraints: "one of {SUITABLE, SUITABLE_WITH_CONVERSION, UNSUITABLE} or null"
      - name: exhaust_capacity_total_cfm
        type: number
        source: computed
        description: "exhaust_riser_capacity_cfm + sum(ConversionScopeItem.capacity_delta_cfm WHERE building_id = this AND discipline = LAB_EXHAUST AND status = COMPLETE)"
        constraints: "2 decimal places"
      - name: exhaust_reserved_cfm
        type: number
        source: computed
        description: "sum(CapacityReservation.exhaust_cfm WHERE building_id = this AND status = RESERVED)"
        default: 0
      - name: exhaust_committed_cfm
        type: number
        source: computed
        description: "sum(CapacityReservation.exhaust_cfm WHERE building_id = this AND status = COMMITTED)"
        default: 0
      - name: exhaust_available_cfm
        type: number
        source: computed
        description: "exhaust_capacity_total_cfm - exhaust_reserved_cfm - exhaust_committed_cfm"
      - name: power_capacity_total_kw
        type: number
        source: computed
        description: "emergency_power_capacity_kw + sum(ConversionScopeItem.capacity_delta_kw WHERE building_id = this AND discipline = EMERGENCY_POWER AND status = COMPLETE)"
      - name: power_reserved_kw
        type: number
        source: computed
        description: "sum(CapacityReservation.power_kw WHERE building_id = this AND status = RESERVED)"
        default: 0
      - name: power_committed_kw
        type: number
        source: computed
        description: "sum(CapacityReservation.power_kw WHERE building_id = this AND status = COMMITTED)"
        default: 0
      - name: power_available_kw
        type: number
        source: computed
        description: "power_capacity_total_kw - power_reserved_kw - power_committed_kw"
      - name: scope_disciplines_covered
        type: array
        source: computed
        description: sorted list of distinct ConversionScopeItem.discipline values declared on this building
      - name: scope_disciplines_complete
        type: array
        source: computed
        description: sorted list of distinct ConversionScopeItem.discipline values whose item status is COMPLETE

  - name: Floor
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; base building that owns this floor plate"
      - name: floor_number
        type: integer
        source: input
        description: Above-grade floor number used by the control-area code table
        constraints: ">= 1; unique per building_id"
      - name: floor_to_floor_ft
        type: number
        source: input
        description: As-built floor-to-floor height of this plate in feet
        constraints: "> 0"
      - name: live_load_psf
        type: number
        source: input
        description: As-built structural live-load capacity of this plate in lb/sf
        constraints: "> 0"
      - name: vibration_class
        type: enum
        source: input
        description: Measured ambient vibration criterion curve of this plate
        constraints: "one of {VC_A, VC_B, VC_C, VC_D, VC_E}"
      - name: sprinklered
        type: boolean
        source: input
        description: Whether the plate is fully sprinklered (doubles the hazardous-material MAQ)
        default: true
      - name: control_areas_allowed
        type: integer
        source: computed
        description: "CONTROL_AREA_TABLE[floor_number].control_areas (see calculations.floor_control_area_allowance)"
      - name: percent_maq
        type: number
        source: computed
        description: "CONTROL_AREA_TABLE[floor_number].percent_maq (see calculations.floor_control_area_allowance)"

  - name: SuitabilityAssessment
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; base building under assessment"
      - name: assessment_basis
        type: enum
        source: input
        description: Which scoring variant applies; SCREENING falls back to published nameplate values, INVESTIGATION scores missing field measurements as zero credit
        constraints: "one of {SCREENING, INVESTIGATION}"
      - name: measured_floor_to_floor_ft
        type: number
        source: input
        description: Field-measured floor-to-floor height; null when not measured
        default: null
      - name: measured_live_load_psf
        type: number
        source: input
        description: Field-verified structural live-load capacity; null when not measured
        default: null
      - name: measured_vibration_class
        type: enum
        source: input
        description: Field-measured ambient vibration criterion curve; null when not measured
        default: null
        constraints: "one of {VC_A, VC_B, VC_C, VC_D, VC_E} or null"
      - name: required_vibration_class
        type: enum
        source: input
        description: Vibration criterion curve the intended lab program requires
        constraints: "one of {VC_A, VC_B, VC_C, VC_D, VC_E}"
      - name: required_exhaust_cfm
        type: number
        source: input
        description: Lab exhaust demand in CFM the intended program requires
        constraints: "> 0"
      - name: required_power_kw
        type: number
        source: input
        description: Emergency power demand in kW the intended program requires
        constraints: "> 0"
      - name: height_credit
        type: integer
        source: computed
        description: Dimension credit for floor-to-floor height (100/60/0)
        default: 0
      - name: structural_credit
        type: integer
        source: computed
        description: Dimension credit for structural live load (100/60/0)
        default: 0
      - name: vibration_credit
        type: integer
        source: computed
        description: Dimension credit for ambient vibration (100/60/0)
        default: 0
      - name: utility_credit
        type: integer
        source: computed
        description: Dimension credit for utility headroom (100/60/0)
        default: 0
      - name: utility_headroom_ratio
        type: number
        source: computed
        description: "min(building.exhaust_riser_capacity_cfm / required_exhaust_cfm, building.emergency_power_capacity_kw / required_power_kw), 4 decimal places"
        default: 0
      - name: suitability_score
        type: number
        source: computed
        description: Weighted suitability score, one decimal place (see calculations.suitability_score)
        default: 0
      - name: hard_fail_capped
        type: boolean
        source: computed
        description: True when at least one dimension credit is 0 and the score was therefore capped at 49.0
        default: false
      - name: verdict
        type: enum
        source: computed
        description: Threshold verdict derived from suitability_score; null while status = DRAFT
        default: null
        constraints: "one of {SUITABLE, SUITABLE_WITH_CONVERSION, UNSUITABLE} or null"
      - name: status
        type: enum
        source: system
        description: Assessment review lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED, ACCEPTED}"
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the LandlordAssetManager who last recorded a decision; null before the first decision
        default: null
      - name: return_note
        type: string
        source: system
        description: Reviewer note captured when the assessment was RETURNED; null otherwise
        default: null

  - name: ConversionScopeItem
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; base building whose conversion scope this item belongs to"
      - name: discipline
        type: enum
        source: input
        description: Conversion discipline; at most one item per (building_id, discipline)
        constraints: "one of {LAB_EXHAUST, EMERGENCY_POWER, CHEMICAL_STORAGE, WASTE_HANDLING}; unique per building_id"
      - name: description
        type: string
        source: input
        description: Scope narrative for the discipline
      - name: capacity_delta_cfm
        type: number
        source: input
        description: Lab exhaust CFM this item adds to the building pool once COMPLETE
        default: 0
        constraints: ">= 0"
      - name: capacity_delta_kw
        type: number
        source: input
        description: Emergency power kW this item adds to the building pool once COMPLETE
        default: 0
        constraints: ">= 0"
      - name: budget_usd
        type: number
        source: input
        description: Landlord base-building budget for this item
        constraints: ">= 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: Delivery state of the scope item
        default: PLANNED
        constraints: "one of {PLANNED, COMPLETE}"
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the item was completed; null while PLANNED
        default: null

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Tenant entity legal name
      - name: research_type
        type: enum
        source: input
        description: Research program type; drives the lab premium table and the required commissioning script set
        constraints: "one of {BSL2_BIOLOGY, CHEMISTRY_SYNTHESIS, VIVARIUM, ANALYTICAL_QC}"
      - name: credit_tier
        type: enum
        source: input
        description: Credit posture recorded for underwriting (reported only)
        constraints: "one of {INVESTMENT_GRADE, VENTURE_BACKED, EARLY_STAGE}"
      - name: lab_premium_psf
        type: number
        source: computed
        description: "LAB_PREMIUM_BY_RESEARCH_TYPE[research_type] (see calculations.ti_final_allowance)"
      - name: required_commissioning_scripts
        type: array
        source: computed
        description: "REQUIRED_SCRIPTS_BY_RESEARCH_TYPE[research_type], sorted ascending by script_type name"
        constraints: |
          REQUIRED_SCRIPTS_BY_RESEARCH_TYPE (normative constant table, values already sorted ascending):
            BSL2_BIOLOGY       -> [CONTAINMENT_VERIFICATION, EXHAUST_AIRFLOW, IQ, OQ]        (4 scripts)
            CHEMISTRY_SYNTHESIS-> [EPSS_LOAD_TEST, EXHAUST_AIRFLOW, IQ, OQ]                  (4 scripts)
            VIVARIUM           -> [CONTAINMENT_VERIFICATION, EPSS_LOAD_TEST, EXHAUST_AIRFLOW, IQ, OQ, PQ] (6 scripts)
            ANALYTICAL_QC      -> [IQ, OQ]                                                   (2 scripts)

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: tenant_id
        type: string
        source: input
        description: "FK -> Tenant.id; tenant party to this lease"
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; building containing the premises"
      - name: premises_floor_id
        type: string
        source: input
        description: "FK -> Floor.id; demised floor plate; must belong to building_id"
      - name: rentable_sf
        type: integer
        source: input
        description: Rentable square feet of the premises
        constraints: "> 0"
      - name: term_months
        type: integer
        source: input
        description: Lease term in months
        constraints: ">= 12"
      - name: base_rent_psf
        type: number
        source: input
        description: Base rent per rentable square foot per year (reported only)
        constraints: "> 0"
      - name: delivery_deadline
        type: datetime
        source: input
        description: Outside date by which all fit-out phase windows must end
      - name: status
        type: enum
        source: system
        description: Lease lifecycle state
        default: LOI
        constraints: "one of {LOI, NEGOTIATING, COUNTER_PENDING, TERMS_ACCEPTED, EXECUTED, ACTIVE, EXPIRING, SURRENDERED}"
      - name: negotiation_round_count
        type: integer
        source: computed
        description: count of TIProposal rows whose lease_id = this lease
        default: 0
      - name: accepted_proposal_round
        type: integer
        source: system
        description: round_number of the ACCEPTED TIProposal; null before acceptance
        default: null
      - name: accepted_allowance_psf
        type: number
        source: computed
        description: proposed_allowance_psf of the ACCEPTED TIProposal; null before acceptance
        default: null
      - name: lab_premium_psf_applied
        type: number
        source: computed
        description: Lab premium per sf applied at acceptance, including the high-floor stack uplift
        default: null
      - name: provisional_authorized_ti_usd
        type: number
        source: computed
        description: Pre-credit authorization used to pick the volume-credit tier (see calculations.ti_final_allowance)
        default: null
      - name: volume_credit_psf
        type: number
        source: computed
        description: Volume credit per sf selected from the provisional authorization tier
        default: null
      - name: final_allowance_psf
        type: number
        source: computed
        description: "accepted_allowance_psf + lab_premium_psf_applied - volume_credit_psf"
        default: null
      - name: ti_authorized_usd
        type: number
        source: computed
        description: "round_half_up(final_allowance_psf * rentable_sf, 2); set once at proposal acceptance"
        default: 0
      - name: ti_uncommitted_usd
        type: number
        source: computed
        description: TI allowance bucket not yet committed to a completed phase
        default: 0
      - name: ti_committed_usd
        type: number
        source: computed
        description: TI allowance bucket committed to COMPLETE phases but not yet drawn
        default: 0
      - name: ti_disbursed_usd
        type: number
        source: computed
        description: TI allowance bucket already paid out through draws
        default: 0
      - name: ti_forfeited_usd
        type: number
        source: computed
        description: TI allowance bucket forfeited at restoration settlement (clawback plus lapsed commitment)
        default: 0
      - name: last_disbursement_usd
        type: number
        source: computed
        description: Amount of the most recent successful draw; the exact amount reversed by a commissioning-failure clawback
        default: 0
      - name: restoration_escrow_required_usd
        type: number
        source: computed
        description: "min(round_half_up(0.10 * ti_authorized_usd, 2), 250000.00); computed at proposal acceptance"
        default: 0
      - name: restoration_escrow_held_usd
        type: number
        source: computed
        description: Cash escrow currently held by the landlord against restoration obligations
        default: 0
      - name: restoration_liability_usd
        type: number
        source: computed
        description: Restoration obligation valued at settlement (see calculations.restoration_liability)
        default: 0
      - name: restoration_cash_due_usd
        type: number
        source: computed
        description: Residual restoration cash owed by the tenant after escrow and TI clawback
        default: 0
      - name: restoration_escrow_refunded_usd
        type: number
        source: computed
        description: "restoration_escrow_held_usd - escrow_applied at settlement; the cash returned to the tenant"
        default: 0
      - name: terms_accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the party who accepted the winning TIProposal; null before acceptance
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the LandlordAssetManager who executed the lease; null before execution
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant of execution; the earliest permissible phase window_start
        default: null
      - name: expiration_date
        type: datetime
        source: system
        description: Expiration date recorded by the expiration notice; null before notice
        default: null

  - name: TIProposal
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease under negotiation"
      - name: round_number
        type: integer
        source: computed
        description: "1 + count(TIProposal WHERE lease_id = this lease at creation time)"
      - name: proposed_by
        type: enum
        source: computed
        description: Party that authored the round, derived from the acting role (LandlordAssetManager -> LANDLORD, Tenant -> TENANT)
        constraints: "one of {LANDLORD, TENANT}"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the author; the segregation-of-duties comparison value at lease execution
      - name: proposed_allowance_psf
        type: number
        source: input
        description: Proposed tenant improvement allowance per rentable square foot
        constraints: ">= 0; 2 decimal places"
      - name: note
        type: string
        source: input
        description: Optional negotiation note
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + PROPOSAL_TTL_DAYS (10) days on the logical clock"
      - name: status
        type: enum
        source: system
        description: Proposal round state
        default: OPEN
        constraints: "one of {OPEN, COUNTERED, ACCEPTED, EXPIRED}"
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the accepting counterparty; null unless status = ACCEPTED
        default: null

  - name: FitOutProject
    parent: Lease
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; lease funding this fit-out"
      - name: floor_id
        type: string
        source: input
        description: "FK -> Floor.id; floor plate being built out; must equal the lease's premises_floor_id"
      - name: design_exhaust_cfm
        type: number
        source: input
        description: Designed lab exhaust demand in CFM
        constraints: "> 0"
      - name: design_power_kw
        type: number
        source: input
        description: Designed emergency power demand in kW
        constraints: "> 0"
      - name: scope_summary
        type: string
        source: input
        description: Fit-out scope narrative
      - name: permit_status
        type: enum
        source: system
        description: Permitting dimension; evolves independently of construction_status
        default: P_UNPERMITTED
        constraints: "one of {P_UNPERMITTED, P_APPLIED, P_ISSUED}"
      - name: construction_status
        type: enum
        source: system
        description: Construction dimension; evolves independently of permit_status
        default: C_NOT_STARTED
        constraints: "one of {C_NOT_STARTED, C_IN_PROGRESS, C_SUSPENDED, C_SUBSTANTIAL_COMPLETION, C_ACCEPTED}"
      - name: delivery_risk
        type: enum
        source: computed
        description: AT_RISK while any PhasePackage of this project is in {VIBRATION_HOLD, BLOCKED}; ON_TRACK otherwise
        default: ON_TRACK
        constraints: "one of {ON_TRACK, AT_RISK}"
      - name: required_commissioning_scripts
        type: array
        source: computed
        description: "REQUIRED_SCRIPTS_BY_RESEARCH_TYPE of the tenant reached through lease_id -> Lease.tenant_id"
      - name: passed_script_count
        type: integer
        source: computed
        description: count of distinct script_type values in required_commissioning_scripts having a CommissioningRecord with status = PASSED on this project
        default: 0
      - name: permit_applied_at
        type: datetime
        source: system
        description: Logical-clock instant of permit application; null before application
        default: null
      - name: permit_issued_at
        type: datetime
        source: system
        description: Logical-clock instant of permit issuance; null before issuance
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant construction_status became C_ACCEPTED; null before acceptance
        default: null

  - name: PhasePackage
    parent: FitOutProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> FitOutProject.id; fit-out project this phase belongs to"
      - name: predecessor_phase_id
        type: string
        source: input
        description: "FK -> PhasePackage.id; phase that must be COMPLETE before this phase may start, and whose hold cascades onto this phase; null for the first phase"
        default: null
      - name: affected_amenity_id
        type: string
        source: input
        description: "FK -> SharedAmenity.id; shared amenity taken out of service by this phase's utility shutdown; null when the phase needs no shutdown"
        default: null
      - name: sequence_no
        type: integer
        source: input
        description: Author-assigned ordinal within the project
        constraints: ">= 1; unique per project_id"
      - name: premium_class
        type: enum
        source: input
        description: Lab cost-premium class driving the TI eligible share and multiplier
        constraints: "one of {SHELL, LAB_MEP, VIVARIUM, CLEANROOM}"
      - name: work_class
        type: enum
        source: input
        description: Coordination class for phased delivery in an occupied building
        constraints: "one of {QUIET, VIBRATION_GENERATING, SHUTDOWN_REQUIRED}"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the delivery window; null until first scheduled
        default: null
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the delivery window; null until first scheduled
        default: null
      - name: hard_cost_usd
        type: number
        source: input
        description: Hard construction cost of the phase
        constraints: "> 0; 2 decimal places"
      - name: restoration_cost_usd
        type: number
        source: input
        description: Estimated cost to restore this phase's work at lease expiration
        constraints: ">= 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: Phase delivery state
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, VIBRATION_HOLD, BLOCKED, IN_PROGRESS, COMPLETE}"
      - name: prior_status
        type: enum
        source: system
        description: Status held immediately before a predecessor-driven cascade set this phase to BLOCKED; restored verbatim when the hold is released; null when never blocked
        default: null
        constraints: "one of {DRAFT, SCHEDULED} or null"
      - name: hold_reason
        type: string
        source: system
        description: Reason recorded when the phase entered VIBRATION_HOLD; null otherwise
        default: null
      - name: ti_eligible_usd
        type: number
        source: computed
        description: "round_half_up(hard_cost_usd * TI_ELIGIBLE_SHARE[premium_class] * TI_PREMIUM_MULTIPLIER[premium_class], 2); set at COMPLETE"
        default: 0
      - name: ti_committed_usd
        type: number
        source: computed
        description: "min(ti_eligible_usd, lease.ti_uncommitted_usd at the instant this phase reached COMPLETE)"
        default: 0
      - name: ti_disbursed_usd
        type: number
        source: computed
        description: Cumulative draw allocated to this phase
        default: 0

  - name: CapacityReservation
    parent: FitOutProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> FitOutProject.id; project drawing on the base-building pools"
      - name: building_id
        type: string
        source: computed
        description: "FK -> Building.id; denormalized at creation from project_id -> FitOutProject.floor_id -> Floor.building_id"
      - name: exhaust_cfm
        type: number
        source: input
        description: Lab exhaust CFM drawn from the building pool
        constraints: "> 0; 2 decimal places"
      - name: power_kw
        type: number
        source: input
        description: Emergency power kW drawn from the building pool
        constraints: "> 0; 2 decimal places"
      - name: status
        type: enum
        source: system
        description: Reservation state
        default: RESERVED
        constraints: "one of {RESERVED, COMMITTED, CANCELLED, RELEASED}"

  - name: HazmatUsePermit
    parent: FitOutProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> FitOutProject.id; applicant project"
      - name: floor_id
        type: string
        source: input
        description: "FK -> Floor.id; floor plate where the material is used or stored"
      - name: hazard_class
        type: enum
        source: input
        description: Hazardous material class governing the maximum allowable quantity
        constraints: "one of {FLAMMABLE_IB, FLAMMABLE_II, CORROSIVE, OXIDIZER_2}"
      - name: use_condition
        type: enum
        source: input
        description: Use condition governing the MAQ use factor
        constraints: "one of {STORAGE_CABINET, CLOSED_SYSTEM_USE, OPEN_SYSTEM_USE}"
      - name: quantity_gal
        type: number
        source: input
        description: Quantity in gallons requested for this control area
        constraints: "> 0; 2 decimal places"
      - name: control_area_index
        type: integer
        source: input
        description: Control area on the floor into which this quantity is placed
        constraints: ">= 1 and <= floor.control_areas_allowed"
      - name: allowance_per_control_area_gal
        type: number
        source: computed
        description: "MAQ allowance for (hazard_class, floor, use_condition) per control area (see calculations.floor_control_area_allowance)"
        default: 0
      - name: status
        type: enum
        source: system
        description: Permit state
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, ACTIVE, DENIED, REVOKED, SURRENDERED}"
      - name: decision_reason
        type: string
        source: system
        description: Reason recorded by the permitting authority on DENY or REVOKE; null otherwise
        default: null

  - name: SharedAmenity
    parent: Building
    common_fields: true
    fields:
      - name: building_id
        type: string
        source: input
        description: "FK -> Building.id; building that programs this shared amenity"
      - name: name
        type: string
        source: input
        description: Amenity display name
      - name: amenity_type
        type: enum
        source: input
        description: Shared amenity or equipment type
        constraints: "one of {GLASSWASH, AUTOCLAVE, NMR_SUITE, CONFERENCE, LOADING_DOCK}"
      - name: serving_floor_number
        type: integer
        source: input
        description: Floor number the amenity physically occupies; resolves to the Floor whose (building_id, floor_number) equals (this.building_id, this.serving_floor_number)
        constraints: ">= 1"
      - name: concurrent_capacity
        type: integer
        source: input
        description: Maximum number of allocations in {REQUESTED, CONFIRMED} whose half-open windows may overlap at any instant
        constraints: ">= 1"
      - name: vibration_sensitive
        type: boolean
        source: input
        description: When true, allocations may not overlap a VIBRATION_GENERATING phase window on the amenity's serving floor
        default: false
      - name: utility_draw_kw
        type: number
        source: input
        description: Emergency power draw of the amenity (reported only)
        default: 0

  - name: AmenityAllocation
    parent: SharedAmenity
    common_fields: true
    fields:
      - name: amenity_id
        type: string
        source: input
        description: "FK -> SharedAmenity.id; amenity being programmed"
      - name: project_id
        type: string
        source: input
        description: "FK -> FitOutProject.id; requesting tenant's fit-out project"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the half-open allocation window [window_start, window_end)
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the half-open allocation window [window_start, window_end)
      - name: headcount
        type: integer
        source: input
        description: Number of tenant staff in the allocation
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Allocation state
        default: REQUESTED
        constraints: "one of {REQUESTED, CONFIRMED, CANCELLED, PREEMPTED}"

  - name: CommissioningRecord
    parent: FitOutProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> FitOutProject.id; project being validated"
      - name: script_type
        type: enum
        source: input
        description: Validation or commissioning script executed
        constraints: "one of {IQ, OQ, PQ, EXHAUST_AIRFLOW, EPSS_LOAD_TEST, CONTAINMENT_VERIFICATION}"
      - name: scheduled_for
        type: datetime
        source: input
        description: Logical-clock instant the script is scheduled to run
      - name: executed_by_user_id
        type: string
        source: input
        description: Opaque operator id of the technician executing the script; compared against witnessed_by_user_id for segregation of duties
      - name: witnessed_by_user_id
        type: string
        source: system
        description: Opaque operator id of the witness recorded with the result; null before the result
        default: null
      - name: measured_value
        type: number
        source: system
        description: Measured value recorded with the result; null when not supplied
        default: null
      - name: result
        type: enum
        source: system
        description: Recorded outcome; null while SCHEDULED
        default: null
        constraints: "one of {PASS, FAIL} or null"
      - name: status
        type: enum
        source: system
        description: Record state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PASSED, FAILED}"

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Building
    field: suitability_state
    states: [DRAFT, ASSESSING, ASSESSED_SUITABLE, ASSESSED_CONDITIONAL, ASSESSED_UNSUITABLE, CONVERSION_APPROVED, CONVERSION_COMPLETE]
    initial_state: DRAFT
    terminal_states: [CONVERSION_COMPLETE]
    transitions:
      - from: DRAFT
        to: ASSESSING
        trigger: "POST /buildings/{buildingId}/suitability-assessments"
        preconditions: ["building exists"]
        side_effects:
          - "SuitabilityAssessment created with status = DRAFT"
          - "Building.version += 1"
      - from: ASSESSING
        to: ASSESSED_SUITABLE
        trigger: "POST /suitability-assessments/{assessmentId}/decision with decision = ACCEPT and assessment.verdict = SUITABLE"
        preconditions: ["assessment.status = SUBMITTED", "actor role = LandlordAssetManager"]
        side_effects:
          - "assessment.status = ACCEPTED; assessment.decided_by_user_id = X-User-ID"
          - "Building.latest_assessment_verdict = SUITABLE"
          - "Building.version += 1"
      - from: ASSESSING
        to: ASSESSED_CONDITIONAL
        trigger: "POST /suitability-assessments/{assessmentId}/decision with decision = ACCEPT and assessment.verdict = SUITABLE_WITH_CONVERSION"
        preconditions: ["assessment.status = SUBMITTED", "actor role = LandlordAssetManager"]
        side_effects:
          - "assessment.status = ACCEPTED; assessment.decided_by_user_id = X-User-ID"
          - "Building.latest_assessment_verdict = SUITABLE_WITH_CONVERSION"
          - "Building.version += 1"
      - from: ASSESSING
        to: ASSESSED_UNSUITABLE
        trigger: "POST /suitability-assessments/{assessmentId}/decision with decision = ACCEPT and assessment.verdict = UNSUITABLE"
        preconditions: ["assessment.status = SUBMITTED", "actor role = LandlordAssetManager"]
        side_effects:
          - "assessment.status = ACCEPTED; assessment.decided_by_user_id = X-User-ID"
          - "Building.latest_assessment_verdict = UNSUITABLE"
          - "Building.version += 1"
      - from: ASSESSED_SUITABLE
        to: ASSESSING
        trigger: "POST /buildings/{buildingId}/suitability-assessments (re-assessment)"
        preconditions: ["no SuitabilityAssessment on this building is in status DRAFT or SUBMITTED"]
        side_effects: ["new SuitabilityAssessment created with status = DRAFT", "Building.version += 1"]
      - from: ASSESSED_CONDITIONAL
        to: ASSESSING
        trigger: "POST /buildings/{buildingId}/suitability-assessments (re-assessment)"
        preconditions: ["no SuitabilityAssessment on this building is in status DRAFT or SUBMITTED"]
        side_effects: ["new SuitabilityAssessment created with status = DRAFT", "Building.version += 1"]
      - from: ASSESSED_UNSUITABLE
        to: ASSESSING
        trigger: "POST /buildings/{buildingId}/suitability-assessments (re-assessment)"
        preconditions: ["no SuitabilityAssessment on this building is in status DRAFT or SUBMITTED"]
        side_effects: ["new SuitabilityAssessment created with status = DRAFT", "Building.version += 1"]
      - from: ASSESSED_SUITABLE
        to: CONVERSION_APPROVED
        trigger: "POST /buildings/{buildingId}/conversion-approval"
        preconditions:
          - "latest_assessment_verdict in {SUITABLE, SUITABLE_WITH_CONVERSION}"
          - "at least one ConversionScopeItem exists with discipline = LAB_EXHAUST"
          - "actor role = LandlordAssetManager"
        side_effects: ["Building.version += 1"]
      - from: ASSESSED_CONDITIONAL
        to: CONVERSION_APPROVED
        trigger: "POST /buildings/{buildingId}/conversion-approval"
        preconditions:
          - "latest_assessment_verdict in {SUITABLE, SUITABLE_WITH_CONVERSION}"
          - "at least one ConversionScopeItem exists with discipline = LAB_EXHAUST"
          - "actor role = LandlordAssetManager"
        side_effects: ["Building.version += 1"]
      - from: CONVERSION_APPROVED
        to: CONVERSION_COMPLETE
        trigger: "POST /conversion-scope-items/{itemId}/complete (bubble-up when the last discipline completes)"
        preconditions:
          - "after this item reaches COMPLETE, scope_disciplines_complete equals scope_disciplines_covered AND covers all four disciplines {LAB_EXHAUST, EMERGENCY_POWER, CHEMICAL_STORAGE, WASTE_HANDLING}"
        side_effects:
          - "Building capacity pools recomputed (see calculations.building_capacity_pools)"
          - "Building.version += 1"

  - entity: SuitabilityAssessment
    field: status
    states: [DRAFT, SUBMITTED, RETURNED, ACCEPTED]
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /suitability-assessments/{assessmentId}/submit"
        preconditions: ["actor role = BaseBuildingEngineer", "building.suitability_state = ASSESSING"]
        side_effects:
          - "credits, utility_headroom_ratio, suitability_score, hard_fail_capped and verdict computed and frozen (see calculations.suitability_score)"
          - "version += 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /suitability-assessments/{assessmentId}/decision with decision = ACCEPT"
        preconditions: ["actor role = LandlordAssetManager"]
        side_effects: ["decided_by_user_id set", "Building.suitability_state -> ASSESSED_* per verdict", "version += 1"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /suitability-assessments/{assessmentId}/decision with decision = RETURN"
        preconditions: ["actor role = LandlordAssetManager", "return_note supplied"]
        side_effects: ["return_note stored", "decided_by_user_id set", "Building.suitability_state unchanged (stays ASSESSING)", "version += 1"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /suitability-assessments/{assessmentId}/submit (resubmission after rework)"
        preconditions: ["actor role = BaseBuildingEngineer"]
        side_effects: ["score and verdict recomputed from the current field values", "return_note cleared to null", "version += 1"]

  - entity: ConversionScopeItem
    field: status
    states: [PLANNED, COMPLETE]
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: COMPLETE
        trigger: "POST /conversion-scope-items/{itemId}/complete"
        preconditions: ["actor role = BaseBuildingEngineer", "building.suitability_state in {CONVERSION_APPROVED}"]
        side_effects:
          - "completed_at = current logical clock"
          - "Building.exhaust_capacity_total_cfm and Building.power_capacity_total_kw recomputed to include this item's deltas"
          - "Building.suitability_state -> CONVERSION_COMPLETE when all four disciplines are COMPLETE"
          - "Building.version += 1; version += 1"

  - entity: Lease
    field: status
    states: [LOI, NEGOTIATING, COUNTER_PENDING, TERMS_ACCEPTED, EXECUTED, ACTIVE, EXPIRING, SURRENDERED]
    initial_state: LOI
    terminal_states: [SURRENDERED]
    transitions:
      - from: LOI
        to: NEGOTIATING
        trigger: "POST /leases/{leaseId}/ti-proposals as LandlordAssetManager (round 1)"
        preconditions: ["expected_lease_version matches Lease.version", "building.suitability_state in {CONVERSION_APPROVED, CONVERSION_COMPLETE}"]
        side_effects: ["TIProposal created with status = OPEN, round_number = 1, proposed_by = LANDLORD", "Lease.version += 1"]
      - from: NEGOTIATING
        to: COUNTER_PENDING
        trigger: "POST /leases/{leaseId}/ti-proposals as Tenant (counter round)"
        preconditions:
          - "expected_lease_version matches Lease.version"
          - "the current OPEN proposal was authored by LANDLORD (turn-taking)"
          - "negotiation_round_count < NEGOTIATION_ROUND_LIMIT (6)"
        side_effects: ["prior OPEN proposal -> COUNTERED (or -> EXPIRED when its expires_at < now)", "new TIProposal created with status = OPEN, proposed_by = TENANT", "Lease.version += 1"]
      - from: COUNTER_PENDING
        to: NEGOTIATING
        trigger: "POST /leases/{leaseId}/ti-proposals as LandlordAssetManager (counter round)"
        preconditions:
          - "expected_lease_version matches Lease.version"
          - "the current OPEN proposal was authored by TENANT (turn-taking)"
          - "negotiation_round_count < NEGOTIATION_ROUND_LIMIT (6)"
        side_effects: ["prior OPEN proposal -> COUNTERED (or -> EXPIRED when its expires_at < now)", "new TIProposal created with status = OPEN, proposed_by = LANDLORD", "Lease.version += 1"]
      - from: NEGOTIATING
        to: TERMS_ACCEPTED
        trigger: "POST /ti-proposals/{proposalId}/accept by the counterparty of the proposal's author"
        preconditions: ["proposal.status = OPEN", "proposal.expires_at >= now", "accepting X-User-ID != proposal.authored_by_user_id"]
        side_effects:
          - "proposal.status = ACCEPTED; accepted_by_user_id set"
          - "Lease TI economics computed and frozen (see calculations.ti_final_allowance)"
          - "ti_authorized_usd set; ti_uncommitted_usd = ti_authorized_usd; committed/disbursed/forfeited = 0"
          - "restoration_escrow_required_usd computed"
          - "terms_accepted_by_user_id = accepting X-User-ID; accepted_proposal_round set"
          - "Lease.version += 1"
      - from: COUNTER_PENDING
        to: TERMS_ACCEPTED
        trigger: "POST /ti-proposals/{proposalId}/accept by the counterparty of the proposal's author"
        preconditions: ["proposal.status = OPEN", "proposal.expires_at >= now", "accepting X-User-ID != proposal.authored_by_user_id"]
        side_effects:
          - "same side effects as the NEGOTIATING -> TERMS_ACCEPTED transition"
          - "Lease.version += 1"
      - from: TERMS_ACCEPTED
        to: EXECUTED
        trigger: "POST /leases/{leaseId}/execute"
        preconditions:
          - "actor role = LandlordAssetManager"
          - "restoration_escrow_held_usd >= restoration_escrow_required_usd"
          - "executing X-User-ID != accepted proposal.authored_by_user_id AND != terms_accepted_by_user_id (segregation of duties)"
        side_effects: ["executed_by_user_id set; executed_at = current logical clock", "Lease.version += 1"]
      - from: EXECUTED
        to: ACTIVE
        trigger: "POST /commissioning-records/{recordId}/result with result = PASS completing the last required script (cascade)"
        preconditions: ["project.construction_status becomes C_ACCEPTED in the same cascade"]
        side_effects: ["Lease.version += 1"]
      - from: ACTIVE
        to: EXPIRING
        trigger: "POST /leases/{leaseId}/expiration-notice"
        preconditions: ["actor role = LandlordAssetManager", "expiration_date >= now"]
        side_effects: ["expiration_date stored", "restoration_liability_usd computed (see calculations.restoration_liability)", "Lease.version += 1"]
      - from: EXPIRING
        to: SURRENDERED
        trigger: "POST /leases/{leaseId}/restoration-settlement"
        preconditions: ["actor role = LandlordAssetManager", "all PhasePackage rows of every project on this lease are in {DRAFT, COMPLETE}"]
        side_effects:
          - "restoration liability, escrow application, TI clawback and cash due computed (see calculations.restoration_liability)"
          - "ti_uncommitted_usd and remaining ti_committed_usd move into ti_forfeited_usd"
          - "all HazmatUsePermit rows of this lease's projects in {APPROVED, ACTIVE} -> SURRENDERED"
          - "all CapacityReservation rows of this lease's projects in {RESERVED, COMMITTED} -> RELEASED (building pools freed)"
          - "Lease.version += 1"

  - entity: TIProposal
    field: status
    states: [OPEN, COUNTERED, ACCEPTED, EXPIRED]
    initial_state: OPEN
    terminal_states: [COUNTERED, ACCEPTED, EXPIRED]
    transitions:
      - from: OPEN
        to: COUNTERED
        trigger: "POST /leases/{leaseId}/ti-proposals creating the next round while this proposal is still within its TTL"
        preconditions: ["this proposal is the lease's only OPEN proposal", "expires_at >= now"]
        side_effects: ["version += 1"]
      - from: OPEN
        to: EXPIRED
        trigger: "POST /leases/{leaseId}/ti-proposals creating the next round after this proposal's TTL has elapsed"
        preconditions: ["this proposal is the lease's only OPEN proposal", "expires_at < now"]
        side_effects: ["version += 1"]
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /ti-proposals/{proposalId}/accept"
        preconditions: ["expires_at >= now", "accepting X-User-ID != authored_by_user_id"]
        side_effects: ["accepted_by_user_id set", "Lease -> TERMS_ACCEPTED with frozen TI economics", "version += 1"]

  - entity: FitOutProject
    field: permit_status
    dimension_note: "Independent of construction_status; the two dimensions advance on disjoint triggers and are never derived from each other."
    states: [P_UNPERMITTED, P_APPLIED, P_ISSUED]
    initial_state: P_UNPERMITTED
    terminal_states: [P_ISSUED]
    transitions:
      - from: P_UNPERMITTED
        to: P_APPLIED
        trigger: "POST /fit-out-projects/{projectId}/permit-application"
        preconditions:
          - "actor role = LandlordAssetManager"
          - "lease.status in {EXECUTED, ACTIVE}"
          - "building.suitability_state in {CONVERSION_APPROVED, CONVERSION_COMPLETE}"
          - "the building's LAB_EXHAUST ConversionScopeItem exists and is COMPLETE"
        side_effects: ["permit_applied_at = current logical clock", "version += 1"]
      - from: P_APPLIED
        to: P_ISSUED
        trigger: "POST /fit-out-projects/{projectId}/permit-decision with decision = ISSUE"
        preconditions: ["actor role = AHJPermitOfficer"]
        side_effects: ["permit_issued_at = current logical clock", "version += 1"]

  - entity: FitOutProject
    field: construction_status
    dimension_note: "Independent of permit_status; a project may be C_IN_PROGRESS while still P_APPLIED only through phases that were scheduled before issuance is required — see validations."
    states: [C_NOT_STARTED, C_IN_PROGRESS, C_SUSPENDED, C_SUBSTANTIAL_COMPLETION, C_ACCEPTED]
    initial_state: C_NOT_STARTED
    terminal_states: [C_ACCEPTED]
    transitions:
      - from: C_NOT_STARTED
        to: C_IN_PROGRESS
        trigger: "POST /phase-packages/{phaseId}/progress with target_status = IN_PROGRESS (first phase to start)"
        preconditions: ["permit_status = P_ISSUED"]
        side_effects: ["version += 1"]
      - from: C_IN_PROGRESS
        to: C_SUSPENDED
        trigger: "POST /phase-packages/{phaseId}/hold (cascade when a phase enters VIBRATION_HOLD)"
        preconditions: ["the held phase belongs to this project"]
        side_effects:
          - "delivery_risk = AT_RISK"
          - "every AmenityAllocation of this project in {REQUESTED, CONFIRMED} whose window_start >= now -> PREEMPTED"
          - "version += 1"
      - from: C_SUSPENDED
        to: C_IN_PROGRESS
        trigger: "POST /phase-packages/{phaseId}/schedule releasing the last VIBRATION_HOLD on this project"
        preconditions: ["no PhasePackage of this project remains in {VIBRATION_HOLD, BLOCKED}"]
        side_effects: ["delivery_risk = ON_TRACK", "version += 1"]
      - from: C_IN_PROGRESS
        to: C_SUBSTANTIAL_COMPLETION
        trigger: "POST /fit-out-projects/{projectId}/construction-milestone with milestone = SUBSTANTIAL_COMPLETION"
        preconditions: ["actor role = LandlordAssetManager", "every PhasePackage of this project is in {DRAFT, COMPLETE}", "at least one PhasePackage is COMPLETE"]
        side_effects: ["version += 1"]
      - from: C_SUBSTANTIAL_COMPLETION
        to: C_ACCEPTED
        trigger: "POST /commissioning-records/{recordId}/result with result = PASS completing the last required script"
        preconditions: ["passed_script_count reaches len(required_commissioning_scripts) after this result"]
        side_effects:
          - "accepted_at = current logical clock"
          - "every CapacityReservation of this project in RESERVED -> COMMITTED"
          - "every HazmatUsePermit of this project in APPROVED -> ACTIVE"
          - "Building pool fields recomputed (reserved -> committed)"
          - "lease.status EXECUTED -> ACTIVE"
          - "version += 1"

  - entity: PhasePackage
    field: status
    states: [DRAFT, SCHEDULED, VIBRATION_HOLD, BLOCKED, IN_PROGRESS, COMPLETE]
    initial_state: DRAFT
    terminal_states: [COMPLETE]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /phase-packages/{phaseId}/schedule"
        preconditions:
          - "actor role = LandlordAssetManager"
          - "window_start >= lease.executed_at and window_end <= lease.delivery_deadline"
          - "no vibration conflict on the same floor (see validations.phase_vibration_conflict)"
          - "no CONFIRMED AmenityAllocation overlaps a SHUTDOWN_REQUIRED phase's affected amenity"
        side_effects: ["window_start and window_end stored", "version += 1"]
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /phase-packages/{phaseId}/schedule (reschedule to a new window)"
        preconditions: ["same preconditions as DRAFT -> SCHEDULED; the phase's own current window is excluded from the conflict scan"]
        side_effects: ["window_start and window_end replaced", "version += 1"]
      - from: SCHEDULED
        to: VIBRATION_HOLD
        trigger: "POST /phase-packages/{phaseId}/hold"
        preconditions: ["actor role = BaseBuildingEngineer", "hold_reason supplied"]
        side_effects:
          - "hold_reason stored"
          - "every phase transitively reachable through predecessor_phase_id from this phase and currently in {DRAFT, SCHEDULED} -> BLOCKED with prior_status recorded"
          - "project.construction_status C_IN_PROGRESS -> C_SUSPENDED; project.delivery_risk = AT_RISK"
          - "project's future AmenityAllocation rows -> PREEMPTED"
          - "version += 1"
      - from: VIBRATION_HOLD
        to: SCHEDULED
        trigger: "POST /phase-packages/{phaseId}/schedule (rescheduled out of the hold)"
        preconditions: ["actor role = LandlordAssetManager", "new window passes every scheduling validation"]
        side_effects:
          - "hold_reason cleared to null"
          - "every transitively BLOCKED successor is restored to its recorded prior_status; prior_status cleared to null"
          - "project.construction_status C_SUSPENDED -> C_IN_PROGRESS once no phase remains in {VIBRATION_HOLD, BLOCKED}"
          - "version += 1"
      - from: DRAFT
        to: BLOCKED
        trigger: "predecessor-hold cascade from POST /phase-packages/{phaseId}/hold"
        preconditions: ["this phase is transitively downstream of the held phase via predecessor_phase_id"]
        side_effects: ["prior_status = DRAFT", "version += 1"]
      - from: SCHEDULED
        to: BLOCKED
        trigger: "predecessor-hold cascade from POST /phase-packages/{phaseId}/hold"
        preconditions: ["this phase is transitively downstream of the held phase via predecessor_phase_id"]
        side_effects: ["prior_status = SCHEDULED; window_start and window_end retained", "version += 1"]
      - from: BLOCKED
        to: SCHEDULED
        trigger: "predecessor-release cascade from POST /phase-packages/{phaseId}/schedule"
        preconditions: ["prior_status = SCHEDULED"]
        side_effects: ["prior_status cleared to null", "version += 1"]
      - from: BLOCKED
        to: DRAFT
        trigger: "predecessor-release cascade from POST /phase-packages/{phaseId}/schedule"
        preconditions: ["prior_status = DRAFT"]
        side_effects: ["prior_status cleared to null", "version += 1"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /phase-packages/{phaseId}/progress with target_status = IN_PROGRESS"
        preconditions:
          - "actor role = LandlordAssetManager"
          - "project.permit_status = P_ISSUED"
          - "predecessor_phase_id is null OR the predecessor is COMPLETE"
        side_effects: ["project.construction_status C_NOT_STARTED -> C_IN_PROGRESS", "version += 1"]
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /phase-packages/{phaseId}/progress with target_status = COMPLETE"
        preconditions: ["actor role = LandlordAssetManager"]
        side_effects:
          - "ti_eligible_usd computed (see calculations.phase_ti_commitment)"
          - "ti_committed_usd = min(ti_eligible_usd, lease.ti_uncommitted_usd)"
          - "lease.ti_uncommitted_usd -= ti_committed_usd; lease.ti_committed_usd += ti_committed_usd"
          - "lease.version += 1; version += 1"

  - entity: CapacityReservation
    field: status
    states: [RESERVED, COMMITTED, CANCELLED, RELEASED]
    initial_state: RESERVED
    terminal_states: [CANCELLED, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /commissioning-records/{recordId}/result cascade taking the project to C_ACCEPTED"
        preconditions: ["reservation belongs to the accepted project"]
        side_effects: ["Building.exhaust_reserved_cfm -= exhaust_cfm; Building.exhaust_committed_cfm += exhaust_cfm (same for power)", "Building.version += 1", "version += 1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /capacity-reservations/{reservationId}/cancel"
        preconditions: ["actor role = LandlordAssetManager"]
        side_effects: ["Building.exhaust_reserved_cfm -= exhaust_cfm; Building.power_reserved_kw -= power_kw (pool availability restored exactly)", "Building.version += 1", "version += 1"]
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /leases/{leaseId}/restoration-settlement cascade"
        preconditions: ["reservation belongs to a project of the surrendering lease"]
        side_effects: ["Building.exhaust_committed_cfm -= exhaust_cfm; Building.power_committed_kw -= power_kw", "Building.version += 1", "version += 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /leases/{leaseId}/restoration-settlement cascade"
        preconditions: ["reservation belongs to a project of the surrendering lease"]
        side_effects: ["Building.exhaust_reserved_cfm -= exhaust_cfm; Building.power_reserved_kw -= power_kw", "Building.version += 1", "version += 1"]

  - entity: HazmatUsePermit
    field: status
    states: [REQUESTED, APPROVED, ACTIVE, DENIED, REVOKED, SURRENDERED]
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, SURRENDERED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /hazmat-permits/{permitId}/decision with decision = APPROVE"
        preconditions:
          - "actor role = AHJPermitOfficer"
          - "project.permit_status = P_ISSUED"
          - "floor-wide cross-tenant PER_CONTROL_AREA utilization including this quantity does not exceed the allowance (see validations.hazmat_floor_wide_maq)"
        side_effects: ["version += 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /hazmat-permits/{permitId}/decision with decision = DENY"
        preconditions: ["actor role = AHJPermitOfficer", "decision_reason supplied"]
        side_effects: ["decision_reason stored", "version += 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /commissioning-records/{recordId}/result cascade taking the project to C_ACCEPTED"
        preconditions: ["permit belongs to the accepted project"]
        side_effects: ["version += 1"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /hazmat-permits/{permitId}/decision with decision = REVOKE"
        preconditions: ["actor role = AHJPermitOfficer", "decision_reason supplied"]
        side_effects: ["decision_reason stored", "version += 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /hazmat-permits/{permitId}/decision with decision = REVOKE"
        preconditions: ["actor role = AHJPermitOfficer", "decision_reason supplied"]
        side_effects: ["decision_reason stored", "version += 1"]
      - from: APPROVED
        to: SURRENDERED
        trigger: "POST /leases/{leaseId}/restoration-settlement cascade"
        preconditions: ["permit belongs to a project of the surrendering lease"]
        side_effects: ["version += 1"]
      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /leases/{leaseId}/restoration-settlement cascade"
        preconditions: ["permit belongs to a project of the surrendering lease"]
        side_effects: ["version += 1"]

  - entity: AmenityAllocation
    field: status
    states: [REQUESTED, CONFIRMED, CANCELLED, PREEMPTED]
    initial_state: REQUESTED
    terminal_states: [CANCELLED, PREEMPTED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /amenity-allocations/{allocationId}/confirm"
        preconditions: ["actor role = LandlordAssetManager", "the aggregate concurrent-capacity check still holds at confirmation time"]
        side_effects: ["version += 1"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /amenity-allocations/{allocationId}/cancel"
        preconditions: ["actor role in {Tenant, LandlordAssetManager}", "for Tenant, the allocation's project belongs to a lease of the calling tenant"]
        side_effects: ["version += 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /amenity-allocations/{allocationId}/cancel"
        preconditions: ["actor role in {Tenant, LandlordAssetManager}", "window_start > now"]
        side_effects: ["version += 1"]
      - from: REQUESTED
        to: PREEMPTED
        trigger: "POST /phase-packages/{phaseId}/hold cascade suspending the allocation's project"
        preconditions: ["window_start >= now"]
        side_effects: ["version += 1"]
      - from: CONFIRMED
        to: PREEMPTED
        trigger: "POST /phase-packages/{phaseId}/hold cascade suspending the allocation's project"
        preconditions: ["window_start >= now"]
        side_effects: ["version += 1"]

  - entity: CommissioningRecord
    field: status
    states: [SCHEDULED, PASSED, FAILED]
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /commissioning-records/{recordId}/result with result = PASS"
        preconditions:
          - "actor role = CommissioningAgent"
          - "project.construction_status = C_SUBSTANTIAL_COMPLETION"
          - "witnessed_by_user_id != executed_by_user_id (segregation of duties)"
        side_effects:
          - "result = PASS; witnessed_by_user_id and measured_value stored"
          - "project.passed_script_count += 1"
          - "when passed_script_count reaches the required set size: project -> C_ACCEPTED and the four-hop acceptance cascade fires"
          - "version += 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /commissioning-records/{recordId}/result with result = FAIL"
        preconditions:
          - "actor role = CommissioningAgent"
          - "project.construction_status = C_SUBSTANTIAL_COMPLETION"
          - "witnessed_by_user_id != executed_by_user_id (segregation of duties)"
        side_effects:
          - "result = FAIL; witnessed_by_user_id and measured_value stored"
          - "lease.ti_disbursed_usd -= lease.last_disbursement_usd; lease.ti_committed_usd += lease.last_disbursement_usd (draw clawback reversing the last draw exactly)"
          - "each PhasePackage.ti_disbursed_usd of this project reduced by the amount that draw allocated to it"
          - "lease.last_disbursement_usd = 0"
          - "lease.version += 1; version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC only; every rule is a genuine create-with-supersede race)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-building
    parent_entity: Building
    parent_version_field: version
    child_entity: CapacityReservation
    write_endpoint: "POST /capacity-reservations"
    occ_field: expected_building_version
    error_id: ERR_STALE_BUILDING_VERSION
    http_status: 412
    contended_invariant: "Building.exhaust_available_cfm and Building.power_available_kw must never go negative across concurrent reservation creates."
    race_narrative: >
      Two fit-out projects in the same building each read the building's capacity pools, see enough
      headroom, and then create a reservation. The second create must not be evaluated against the
      pool snapshot the caller read, because the first create already consumed part of the pool and
      bumped Building.version. The second caller therefore sends a version that no longer describes
      the pool it reasoned about and is rejected with 412 rather than silently overdrawing the riser.
    serial_observability: >
      Serially observable: read Building.version as v; another actor creates a reservation (or
      cancels one, or completes a LAB_EXHAUST scope item), which bumps Building.version to v+1;
      the first actor then POSTs with expected_building_version = v and receives 412. No
      interleaving, no wall-clock timing and no parallel client is required - the sequence is three
      ordinary sequential requests.
    forbidden_vocabulary_check: "No lock, no mutex, no simultaneous/at-the-same-time/parallel-request wording; the rule is expressed purely as a stale-precondition comparison."

  - rule_id: ti-proposal-create-stale-lease
    parent_entity: Lease
    parent_version_field: version
    child_entity: TIProposal
    write_endpoint: "POST /leases/{leaseId}/ti-proposals"
    occ_field: expected_lease_version
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    contended_invariant: "Exactly one TIProposal per lease may be OPEN, and each new round must supersede the round its author actually read."
    race_narrative: >
      The landlord drafts a counter against round 3. Before the counter lands, the tenant has already
      accepted (or countered) round 3, which changed the lease and bumped Lease.version. Creating the
      landlord's round against the superseded state would either produce a second OPEN proposal or
      counter an already-accepted deal, so the stale expected_lease_version is rejected with 412.
    serial_observability: >
      Serially observable: read Lease.version as v; the counterparty posts its own round (bumping
      Lease.version to v+1); then post a round with expected_lease_version = v and receive 412.
      Three sequential requests, no concurrency primitives.
    forbidden_vocabulary_check: "No lock/mutex/simultaneous vocabulary; expressed as a stale-precondition comparison only."

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - rule_id: floor_control_area_allowance
    name: Control-area count and per-control-area MAQ allowance
    algorithm: threshold
    applies_to: [Floor, HazmatUsePermit]
    constants:
      CONTROL_AREA_TABLE:
        - { floor_number_min: 1, floor_number_max: 1, control_areas: 4, percent_maq: 1.00 }
        - { floor_number_min: 2, floor_number_max: 3, control_areas: 3, percent_maq: 0.75 }
        - { floor_number_min: 4, floor_number_max: 6, control_areas: 2, percent_maq: 0.50 }
        - { floor_number_min: 7, floor_number_max: null, control_areas: 2, percent_maq: 0.25 }
      MAQ_BASE_GAL: { FLAMMABLE_IB: 120, FLAMMABLE_II: 240, CORROSIVE: 500, OXIDIZER_2: 250 }
      SPRINKLER_MULTIPLIER: { true: 2.0, false: 1.0 }
      USE_FACTOR: { STORAGE_CABINET: 2.0, CLOSED_SYSTEM_USE: 1.0, OPEN_SYSTEM_USE: 0.5 }
    formula: |
      row = the single CONTROL_AREA_TABLE row whose [floor_number_min, floor_number_max] contains
            floor.floor_number (floor_number_max = null means unbounded above)
      floor.control_areas_allowed = row.control_areas
      floor.percent_maq          = row.percent_maq
      allowance_per_control_area_gal =
          round_half_up(MAQ_BASE_GAL[hazard_class]
                        * row.percent_maq
                        * SPRINKLER_MULTIPLIER[floor.sprinklered]
                        * USE_FACTOR[use_condition], 2)
      aggregate_allowance_gal = round_half_up(allowance_per_control_area_gal * row.control_areas, 2)
    precision: "2 decimal places, round_half_up"
    worked_example: |
      Floor 2, sprinklered, FLAMMABLE_IB, CLOSED_SYSTEM_USE
        -> control_areas_allowed = 3, percent_maq = 0.75
        -> allowance_per_control_area_gal = 120 * 0.75 * 2.0 * 1.0 = 180.00
        -> aggregate_allowance_gal = 540.00
      Floor 5, sprinklered, FLAMMABLE_IB, CLOSED_SYSTEM_USE
        -> control_areas_allowed = 2, percent_maq = 0.50
        -> allowance_per_control_area_gal = 120.00, aggregate_allowance_gal = 240.00
      Floor 2, sprinklered, CORROSIVE, CLOSED_SYSTEM_USE -> 500 * 0.75 * 2.0 * 1.0 = 750.00

  - rule_id: suitability_score
    name: Base-building suitability score and verdict
    algorithm: weighted_scoring
    applies_to: [SuitabilityAssessment]
    variants:
      SCREENING:
        description: "Desktop screening. A missing field measurement falls back to the building's published nameplate value and is scored normally."
        selected_when: "assessment_basis = SCREENING"
      INVESTIGATION:
        description: "Invasive investigation. A missing field measurement scores credit 0 and triggers the hard-fail cap; nameplate values are never substituted."
        selected_when: "assessment_basis = INVESTIGATION"
    constants:
      WEIGHTS: { height: 0.25, structural: 0.25, vibration: 0.20, utility: 0.30 }
      CREDIT_PASS: 100
      CREDIT_MARGINAL: 60
      CREDIT_FAIL: 0
      HEIGHT_PASS_FT: 14.0
      HEIGHT_MARGINAL_FT: 12.5
      LIVE_LOAD_PASS_PSF: 100
      LIVE_LOAD_MARGINAL_PSF: 80
      VIBRATION_RANK: { VC_E: 1, VC_D: 2, VC_C: 3, VC_B: 4, VC_A: 5 }
      UTILITY_PASS_RATIO: 1.25
      UTILITY_MARGINAL_RATIO: 1.00
      HARD_FAIL_SCORE_CAP: 49.0
      VERDICT_SUITABLE_MIN: 75.0
      VERDICT_CONDITIONAL_MIN: 50.0
    formula: |
      # Step 1 - resolve each dimension's effective value (this is the only variant-dependent step)
      h  = measured_floor_to_floor_ft ; if null: SCREENING -> building.published_floor_to_floor_ft, INVESTIGATION -> MISSING
      s  = measured_live_load_psf     ; if null: SCREENING -> building.published_live_load_psf,     INVESTIGATION -> MISSING
      v  = measured_vibration_class   ; if null: SCREENING -> building.published_vibration_class,   INVESTIGATION -> MISSING

      # Step 2 - credits (MISSING always scores CREDIT_FAIL)
      height_credit     = 100 if h >= 14.0 else 60 if h >= 12.5 else 0        (MISSING -> 0)
      structural_credit = 100 if s >= 100  else 60 if s >= 80   else 0        (MISSING -> 0)
      vibration_credit  = 100 if VIBRATION_RANK[v] >= VIBRATION_RANK[required_vibration_class]
                          else 60 if VIBRATION_RANK[v] == VIBRATION_RANK[required_vibration_class] - 1
                          else 0                                             (MISSING -> 0)
      utility_headroom_ratio = round_half_up(min(building.exhaust_riser_capacity_cfm / required_exhaust_cfm,
                                                 building.emergency_power_capacity_kw / required_power_kw), 4)
      utility_credit    = 100 if utility_headroom_ratio >= 1.25 else 60 if utility_headroom_ratio >= 1.00 else 0

      # Step 3 - weighted sum, rounded ONCE at the end (never per-term)
      raw_score = round_half_up(0.25*height_credit + 0.25*structural_credit
                                + 0.20*vibration_credit + 0.30*utility_credit, 1)

      # Step 4 - hard-fail cap
      hard_fail_capped = (min(height_credit, structural_credit, vibration_credit, utility_credit) == 0
                          AND raw_score > 49.0)
      suitability_score = 49.0 if hard_fail_capped else raw_score

      # Step 5 - verdict
      verdict = SUITABLE                if suitability_score >= 75.0
                SUITABLE_WITH_CONVERSION if suitability_score >= 50.0
                UNSUITABLE               otherwise
    precision: "credits are integers; utility_headroom_ratio 4 dp; suitability_score 1 dp; round_half_up"
    worked_example: |
      Building B1: published 14.0 ft / 95 psf / VC_C, riser 60000 CFM, emergency 800 kW.
      Assessment inputs: measured height null, measured live load 88, measured vibration null,
                         required VC_C, required_exhaust 50000, required_power 700.
        utility_headroom_ratio = min(60000/50000, 800/700) = min(1.2, 1.142857) = 1.1429 -> credit 60
        SCREENING     : height 100 (14.0 nameplate), structural 60, vibration 100 (VC_C nameplate), utility 60
                        raw = 25.0 + 15.0 + 20.0 + 18.0 = 78.0, no zero credit -> score 78.0 -> SUITABLE
        INVESTIGATION : height 0 (missing), structural 60, vibration 0 (missing), utility 60
                        raw = 0 + 15.0 + 0 + 18.0 = 33.0; a zero credit exists but raw <= 49.0,
                        so hard_fail_capped = false and score = 33.0 -> UNSUITABLE
        Divergence on identical inputs: 78.0 / SUITABLE vs 33.0 / UNSUITABLE.
      Cap-bites example (INVESTIGATION, height null, live load 120, vibration null, ratio 1.30):
        raw = 0 + 25.0 + 0 + 30.0 = 55.0 > 49.0 -> hard_fail_capped = true, score = 49.0 -> UNSUITABLE.
      Height boundary (INVESTIGATION, live load 95, vibration VC_C, ratio 1.1429):
        h = 12.50 -> credit 60 -> 15.0 + 15.0 + 20.0 + 18.0 = 68.0 -> SUITABLE_WITH_CONVERSION
        h = 12.49 -> credit 0  -> raw 53.0 -> capped 49.0 -> UNSUITABLE

  - rule_id: floor_hazmat_utilization
    name: Floor hazardous-material utilization on two bases
    algorithm: aggregation
    applies_to: [Floor, HazmatUsePermit]
    variants:
      PER_CONTROL_AREA:
        description: "Per-control-area basis. Counts permits in {REQUESTED, APPROVED, ACTIVE} - pending applications occupy allowance - and compares against allowance_per_control_area_gal for one control_area_index."
        selected_when: "reading per_control_area_basis_gal, and when the AHJ evaluates an approval"
      AGGREGATE_FLOOR:
        description: "Whole-floor basis. Counts only permits in {APPROVED, ACTIVE} - pending applications are ignored - and compares against allowance_per_control_area_gal * control_areas_allowed."
        selected_when: "reading aggregate_basis_gal for floor-level code reporting"
    constants:
      PER_CONTROL_AREA_STATUSES: [REQUESTED, APPROVED, ACTIVE]
      AGGREGATE_FLOOR_STATUSES: [APPROVED, ACTIVE]
    formula: |
      allowance_per_control_area_gal = calculations.floor_control_area_allowance(floor, hazard_class, use_condition)
      # NOTE: for reporting, use_condition is fixed to CLOSED_SYSTEM_USE (factor 1.0) so the report is
      # a pure function of (floor, hazard_class); each permit's own allowance uses its own use_condition.
      per_control_area_basis_gal = sum(p.quantity_gal
                                       for p in HazmatUsePermit
                                       where p.floor_id = floor.id
                                         and p.hazard_class = hazard_class
                                         and p.control_area_index = control_area_index
                                         and p.status in PER_CONTROL_AREA_STATUSES)
      aggregate_basis_gal       = sum(p.quantity_gal
                                       for p in HazmatUsePermit
                                       where p.floor_id = floor.id
                                         and p.hazard_class = hazard_class
                                         and p.status in AGGREGATE_FLOOR_STATUSES)
      aggregate_allowance_gal   = round_half_up(allowance_per_control_area_gal * floor.control_areas_allowed, 2)
      per_control_area_utilization_pct = round_half_up(100 * per_control_area_basis_gal / allowance_per_control_area_gal, 2)
      aggregate_utilization_pct       = round_half_up(100 * aggregate_basis_gal / aggregate_allowance_gal, 2)
    precision: "gallons 2 dp; percentages 2 dp; round_half_up"
    worked_example: |
      Floor 2 (sprinklered, allowance 180.00 gal/CA for FLAMMABLE_IB CLOSED_SYSTEM_USE, 3 control areas,
      aggregate allowance 540.00): permits on control area 1 = 150.00 ACTIVE + 20.00 REQUESTED.
        PER_CONTROL_AREA (CA 1): 170.00 of 180.00 -> 94.44 %
        AGGREGATE_FLOOR        : 150.00 of 540.00 -> 27.78 %
      Same underlying rows, different basis - the REQUESTED 20.00 gal is inside one number and outside
      the other, and the denominators differ by the control-area count.

  - rule_id: ti_final_allowance
    name: Final TI allowance per sf and authorized TI dollars
    algorithm: tiered_pricing
    applies_to: [Lease, Tenant]
    constants:
      LAB_PREMIUM_BY_RESEARCH_TYPE: { BSL2_BIOLOGY: 45.00, CHEMISTRY_SYNTHESIS: 62.50, VIVARIUM: 88.00, ANALYTICAL_QC: 30.00 }
      HIGH_FLOOR_UPLIFT_PSF: 5.00
      HIGH_FLOOR_MIN_FLOOR_NUMBER: 4
      VOLUME_CREDIT_TIERS:
        - { provisional_min_usd: 5000000.00, credit_psf: 3.00 }
        - { provisional_min_usd: 2000000.00, credit_psf: 1.50 }
        - { provisional_min_usd: 0.00,       credit_psf: 0.00 }
      RESTORATION_ESCROW_PCT: 0.10
      RESTORATION_ESCROW_CAP_USD: 250000.00
    formula: |
      # The volume credit depends on the authorization, and the authorization depends on the credit.
      # The order below is NORMATIVE and resolves the apparent circularity: the tier is selected from
      # the PRE-credit (provisional) authorization and never re-selected afterwards.
      # Step 1
      lab_premium_psf_applied = LAB_PREMIUM_BY_RESEARCH_TYPE[tenant.research_type]
                                + (5.00 if premises_floor.floor_number >= 4 else 0.00)
      # Step 2
      subtotal_psf = accepted_allowance_psf + lab_premium_psf_applied
      # Step 3
      provisional_authorized_ti_usd = round_half_up(subtotal_psf * rentable_sf, 2)
      # Step 4 - highest tier whose provisional_min_usd <= provisional_authorized_ti_usd
      volume_credit_psf = VOLUME_CREDIT_TIERS lookup on provisional_authorized_ti_usd
      # Step 5
      final_allowance_psf = round_half_up(subtotal_psf - volume_credit_psf, 2)
      # Step 6
      ti_authorized_usd = round_half_up(final_allowance_psf * rentable_sf, 2)
      # Step 7
      restoration_escrow_required_usd = min(round_half_up(0.10 * ti_authorized_usd, 2), 250000.00)
    precision: "psf 2 dp; dollars 2 dp; round_half_up"
    worked_example: |
      L1: tenant CHEMISTRY_SYNTHESIS, premises floor 5, rentable_sf 24200, accepted_allowance_psf 140.00
        premium = 62.50 + 5.00 = 67.50 ; subtotal = 207.50
        provisional = 207.50 * 24200 = 5,021,500.00 -> tier >= 5,000,000 -> credit 3.00
        final_allowance_psf = 204.50 ; ti_authorized_usd = 4,948,900.00
        restoration_escrow_required_usd = min(494,890.00, 250,000.00) = 250,000.00
        Falsifiable ordering: re-selecting the tier from the POST-credit authorization would see
        4,948,900.00 < 5,000,000.00, drop to the 1.50 tier and yield 206.00 psf / 4,985,200.00 -
        both wrong under this rule.
      L4: tenant BSL2_BIOLOGY, premises floor 2, rentable_sf 4000, accepted_allowance_psf 80.00
        premium 45.00 ; subtotal 125.00 ; provisional 500,000.00 -> credit 0.00
        final 125.00 psf ; ti_authorized_usd 500,000.00 ; escrow required 50,000.00
      Tier boundary (exact): tenant VIVARIUM (88.00), premises floor 2, rentable_sf 20000,
      accepted_allowance_psf 162.00
        subtotal = 250.00 ; provisional = 5,000,000.00 exactly -> the >= 5,000,000.00 tier applies
        (boundary is inclusive) -> credit 3.00 -> final 247.00 -> ti_authorized 4,940,000.00
        escrow required = min(494,000.00, 250,000.00) = 250,000.00
      One cent below the boundary (rentable_sf 20000, accepted_allowance_psf 161.99):
        subtotal 249.99 -> provisional 4,999,800.00 -> credit 1.50 -> final 248.49
        -> ti_authorized 4,969,800.00

  - rule_id: phase_ti_commitment
    name: Phase TI eligibility and chronological commitment waterfall
    algorithm: waterfall_allocation
    applies_to: [PhasePackage, Lease]
    constants:
      TI_ELIGIBLE_SHARE: { SHELL: 0.60, LAB_MEP: 0.85, VIVARIUM: 0.90, CLEANROOM: 0.88 }
      TI_PREMIUM_MULTIPLIER: { SHELL: 1.00, LAB_MEP: 1.18, VIVARIUM: 1.275, CLEANROOM: 1.22 }
    formula: |
      ti_eligible_usd = round_half_up(hard_cost_usd
                                      * TI_ELIGIBLE_SHARE[premium_class]
                                      * TI_PREMIUM_MULTIPLIER[premium_class], 2)
      # Commitment happens exactly once, at the instant the phase reaches COMPLETE. Phases are
      # processed in the chronological order in which they reach COMPLETE (never by sequence_no);
      # each phase can only take what the lease's uncommitted bucket still holds.
      ti_committed_usd        = min(ti_eligible_usd, lease.ti_uncommitted_usd)
      lease.ti_uncommitted_usd -= ti_committed_usd
      lease.ti_committed_usd   += ti_committed_usd
      # Ledger identity, checked after every mutation:
      #   ti_authorized_usd == ti_uncommitted_usd + ti_committed_usd + ti_disbursed_usd + ti_forfeited_usd
    precision: "2 decimal places, round_half_up"
    worked_example: |
      L2 (ti_authorized 200,000.00). Completion order P1 -> P2 -> P3:
        P1 SHELL    hard 100,000.00 -> eligible  60,000.00 -> committed  60,000.00 (uncommitted 140,000.00)
        P2 VIVARIUM hard 250,000.00 -> eligible 286,875.00 -> committed 140,000.00 (uncommitted 0.00, truncated)
        P3 LAB_MEP  hard  80,000.00 -> eligible  80,240.00 -> committed      0.00 (nothing left)
        lease: uncommitted 0.00, committed 200,000.00, disbursed 0.00, forfeited 0.00 -> identity holds.
      L4 (ti_authorized 500,000.00). Completion order PH_A -> PH_B -> PH_C:
        PH_A VIVARIUM hard 100,000.00 -> eligible 114,750.00 -> committed 114,750.00
        PH_B LAB_MEP  hard  20,000.00 -> eligible  20,060.00 -> committed  20,060.00
        PH_C SHELL    hard  60,000.00 -> eligible  36,000.00 -> committed  36,000.00
        lease: committed 170,810.00, uncommitted 329,190.00.

  - rule_id: ti_draw_allocation
    name: TI draw cap and pro-rata allocation across committed phases
    algorithm: waterfall_allocation
    applies_to: [Lease, PhasePackage]
    constants:
      DRAW_CAP_PCT: 0.30
    formula: |
      draw_cap_usd = round_half_up(DRAW_CAP_PCT * lease.ti_authorized_usd, 2)
      disbursed_usd = min(requested_usd, draw_cap_usd, lease.ti_committed_usd)
      # Eligible phases: PhasePackage rows of this lease's projects with status = COMPLETE and
      # ti_committed_usd > ti_disbursed_usd, ordered by created_at ASC.
      # NORMATIVE ORDER (per-line rounding, then residual):
      #   1. share_i    = disbursed_usd * phase_i.ti_committed_usd / sum(ti_committed_usd over eligible phases)
      #   2. alloc_i    = round_half_up(share_i, 2)          # round EACH line first
      #   3. residual   = disbursed_usd - sum(alloc_i)       # signed, |residual| <= 0.01 * line_count
      #   4. residual is added to the single eligible phase with the LARGEST ti_committed_usd;
      #      ties broken by created_at ASC.
      # Then: lease.ti_committed_usd -= disbursed_usd ; lease.ti_disbursed_usd += disbursed_usd
      #       lease.last_disbursement_usd = disbursed_usd ; phase_i.ti_disbursed_usd += alloc_i
    precision: "2 decimal places, round_half_up; residual assigned, never dropped"
    worked_example: |
      L4: ti_authorized 500,000.00, committed 170,810.00 across PH_A 114,750.00 / PH_B 20,060.00 /
      PH_C 36,000.00. Request 400,000.00.
        draw_cap = 0.30 * 500,000.00 = 150,000.00 -> disbursed = 150,000.00
        shares : PH_A 100,769.8613..., PH_B 17,616.0646..., PH_C 31,614.0741...
        rounded: 100,769.86 + 17,616.06 + 31,614.07 = 149,999.99 -> residual +0.01
        residual to PH_A (largest ti_committed_usd) -> PH_A 100,769.87
        lease: disbursed 150,000.00, committed 20,810.00, uncommitted 329,190.00, forfeited 0.00
        Falsifiable ordering: assigning the residual to the last line instead would give
        PH_C 31,614.08, and rounding only the final total would give PH_A 100,769.86.
      L2: ti_authorized 200,000.00, committed 200,000.00 across P1 60,000.00 / P2 140,000.00 / P3 0.00.
        draw_cap = 60,000.00 ; shares 18,000.00 / 42,000.00 / (P3 not eligible, ti_committed 0)
        rounded sum = 60,000.00 exactly -> residual 0.00, no adjustment.

  - rule_id: building_capacity_pools
    name: Base-building exhaust and emergency-power pool conservation
    algorithm: aggregation
    applies_to: [Building, ConversionScopeItem, CapacityReservation]
    constants: {}
    formula: |
      exhaust_capacity_total_cfm = exhaust_riser_capacity_cfm
                                   + sum(item.capacity_delta_cfm for item in ConversionScopeItem
                                         where item.building_id = building.id
                                           and item.discipline = LAB_EXHAUST
                                           and item.status = COMPLETE)
      exhaust_reserved_cfm  = sum(r.exhaust_cfm for r in CapacityReservation where r.building_id = building.id and r.status = RESERVED)
      exhaust_committed_cfm = sum(r.exhaust_cfm for r in CapacityReservation where r.building_id = building.id and r.status = COMMITTED)
      exhaust_available_cfm = exhaust_capacity_total_cfm - exhaust_reserved_cfm - exhaust_committed_cfm
      # Identical structure for power, with discipline = EMERGENCY_POWER and capacity_delta_kw.
      # Conservation identity, checked after every reservation mutation:
      #   exhaust_capacity_total_cfm == exhaust_available_cfm + exhaust_reserved_cfm + exhaust_committed_cfm
      #   power_capacity_total_kw    == power_available_kw    + power_reserved_kw    + power_committed_kw
      # CANCELLED and RELEASED reservations contribute to neither bucket, so cancelling restores the
      # pool to exactly its pre-reservation value (no drift).
    precision: "2 decimal places, round_half_up"
    worked_example: |
      B1: riser 60,000 CFM, emergency 800 kW. LAB_EXHAUST scope item delta 20,000 CFM and
      EMERGENCY_POWER scope item delta 400 kW, both COMPLETE:
        exhaust_capacity_total_cfm = 80,000.00 ; power_capacity_total_kw = 1,200.00
      Reserve 18,000.00 CFM / 250.00 kW:
        available 62,000.00 CFM and 950.00 kW ; reserved 18,000.00 / 250.00
      Cancel that reservation:
        available back to 80,000.00 / 1,200.00, reserved 0.00 / 0.00 - exact restoration.

  - rule_id: restoration_liability
    name: Restoration liability valuation and settlement waterfall
    algorithm: waterfall_allocation
    applies_to: [Lease, PhasePackage, HazmatUsePermit]
    constants:
      RESTORATION_EXEMPT_PREMIUM_CLASSES: [SHELL]
      PERMIT_DECOMMISSION_FEE_USD: 250.00
      PERMIT_DECOMMISSION_PER_GALLON_USD: 3.00
      PERMIT_DECOMMISSION_STATUSES: [APPROVED, ACTIVE]
    formula: |
      # Step 1 - liability valuation (empty sets contribute 0.00, they are not an error)
      phase_liability = sum(p.restoration_cost_usd
                            for p in PhasePackage of this lease's projects
                            where p.status = COMPLETE and p.premium_class not in {SHELL})
      permit_liability = sum(250.00 + 3.00 * h.quantity_gal
                             for h in HazmatUsePermit of this lease's projects
                             where h.status in {APPROVED, ACTIVE})
      restoration_liability_usd = round_half_up(phase_liability + permit_liability, 2)

      # Step 2 - settlement waterfall, in this NORMATIVE order
      escrow_applied            = min(restoration_escrow_held_usd, restoration_liability_usd)
      restoration_escrow_refunded_usd = restoration_escrow_held_usd - escrow_applied
      restoration_escrow_held_usd     = 0.00
      remaining                 = restoration_liability_usd - escrow_applied
      ti_clawback               = min(remaining, ti_uncommitted_usd)   # clawback BEFORE the lapse step
      ti_uncommitted_usd       -= ti_clawback
      restoration_cash_due_usd  = round_half_up(remaining - ti_clawback, 2)

      # Step 3 - lapse: whatever allowance was never drawn is forfeited
      ti_forfeited_usd += ti_clawback + ti_uncommitted_usd + ti_committed_usd
      ti_uncommitted_usd = 0.00 ; ti_committed_usd = 0.00
      # Identity still holds:
      #   ti_authorized_usd == 0 + 0 + ti_disbursed_usd + ti_forfeited_usd
    precision: "2 decimal places, round_half_up"
    worked_example: |
      L4 at settlement: authorized 500,000.00, uncommitted 329,190.00, committed 20,810.00,
      disbursed 150,000.00, escrow held 50,000.00.
      COMPLETE phases: PH_A VIVARIUM restoration 420,000.00, PH_B LAB_MEP restoration 180,000.00,
      PH_C SHELL restoration 90,000.00 (exempt). Permits: 150.00 gal ACTIVE, 200.00 gal APPROVED.
        phase_liability  = 600,000.00
        permit_liability = (250.00 + 450.00) + (250.00 + 600.00) = 1,550.00
        restoration_liability_usd = 601,550.00
        escrow_applied 50,000.00 -> refunded 0.00 -> remaining 551,550.00
        ti_clawback = min(551,550.00, 329,190.00) = 329,190.00 -> cash due 222,360.00
        forfeited = 329,190.00 + 0.00 + 20,810.00 = 350,000.00
        identity: 500,000.00 == 0 + 0 + 150,000.00 + 350,000.00
      L3 empty-set case: authorized 40,000.00, uncommitted 40,000.00, escrow held 4,000.00,
      no COMPLETE phases and no permits:
        liability 0.00 -> escrow_applied 0.00, refunded 4,000.00, clawback 0.00, cash due 0.00,
        forfeited 40,000.00 - and the lease still reaches SURRENDERED.

# =============================================================================
# CONSTANTS: logical clock
# =============================================================================
logical_clock:
  default_now: "2026-08-01T00:00:00Z"
  set_endpoint: "POST /_clock/set_current_utc"
  note: "Every temporal rule (proposal TTL, delivery windows, vibration buffer, amenity windows, expiration) is evaluated against this logical clock. No test ever waits on wall-clock time."
  constants:
    PROPOSAL_TTL_DAYS: 10
    NEGOTIATION_ROUND_LIMIT: 6
    VIBRATION_BUFFER_HOURS: 24

# =============================================================================
# §1.4 Validation Rules (ordered; lower priority number is evaluated first)
# =============================================================================
# Global precedence, applied before any rule below on every endpoint:
#   1. malformed body / unknown enum / missing required input  -> ERR_VALIDATION (422)
#   2. unknown or missing role header                          -> ERR_UNAUTHORIZED (403)
#   3. path-parameter entity does not exist                    -> ERR_<ENTITY>_NOT_FOUND (404)
#   4. body foreign key does not exist                         -> ERR_<ENTITY>_NOT_FOUND (404)
# The `priority` values below order the domain rules that remain after those four steps.
validations:
  # ---- suitability assessment ----
  - rule_id: assessment_open_draft_unique
    applies_to: "POST /buildings/{buildingId}/suitability-assessments"
    category: state
    priority: 10
    condition: "a SuitabilityAssessment for this building already has status in {DRAFT, SUBMITTED}"
    error_id: ERR_ASSESSMENT_ALREADY_OPEN
  - rule_id: assessment_building_not_terminal
    applies_to: "POST /buildings/{buildingId}/suitability-assessments"
    category: state
    priority: 20
    condition: "building.suitability_state in {CONVERSION_APPROVED, CONVERSION_COMPLETE}"
    error_id: ERR_INVALID_BUILDING_STATE
  - rule_id: assessment_submit_state
    applies_to: "POST /suitability-assessments/{assessmentId}/submit"
    category: state
    priority: 10
    condition: "assessment.status not in {DRAFT, RETURNED}"
    error_id: ERR_INVALID_ASSESSMENT_STATE
  - rule_id: assessment_decision_state
    applies_to: "POST /suitability-assessments/{assessmentId}/decision"
    category: state
    priority: 10
    condition: "assessment.status != SUBMITTED"
    error_id: ERR_INVALID_ASSESSMENT_STATE
  - rule_id: assessment_return_note_required
    applies_to: "POST /suitability-assessments/{assessmentId}/decision"
    category: business_documentation
    priority: 20
    condition: "decision = RETURN and return_note is null or blank"
    error_id: ERR_RETURN_NOTE_REQUIRED

  # ---- conversion approval and scope ----
  - rule_id: conversion_approval_verdict
    applies_to: "POST /buildings/{buildingId}/conversion-approval"
    category: state
    priority: 10
    condition: "building.suitability_state not in {ASSESSED_SUITABLE, ASSESSED_CONDITIONAL}"
    error_id: ERR_INVALID_BUILDING_STATE
  - rule_id: conversion_approval_requires_exhaust_scope
    applies_to: "POST /buildings/{buildingId}/conversion-approval"
    category: business_completeness
    priority: 20
    condition: "no ConversionScopeItem with discipline = LAB_EXHAUST exists on this building"
    error_id: ERR_CONVERSION_SCOPE_INCOMPLETE
  - rule_id: scope_item_discipline_unique
    applies_to: "POST /buildings/{buildingId}/conversion-scope-items"
    category: business_uniqueness
    priority: 10
    condition: "a ConversionScopeItem with the same discipline already exists on this building"
    error_id: ERR_DUPLICATE_SCOPE_DISCIPLINE
  - rule_id: scope_complete_requires_approval
    applies_to: "POST /conversion-scope-items/{itemId}/complete"
    category: state
    priority: 10
    condition: "building.suitability_state != CONVERSION_APPROVED"
    error_id: ERR_BUILDING_NOT_CONVERSION_APPROVED
  - rule_id: scope_complete_idempotency
    applies_to: "POST /conversion-scope-items/{itemId}/complete"
    category: state
    priority: 20
    condition: "item.status = COMPLETE already"
    error_id: ERR_INVALID_SCOPE_ITEM_STATE

  # ---- floors and amenities ----
  - rule_id: floor_number_unique
    applies_to: "POST /buildings/{buildingId}/floors"
    category: business_uniqueness
    priority: 10
    condition: "a Floor with the same floor_number already exists in this building"
    error_id: ERR_DUPLICATE_FLOOR_NUMBER
  - rule_id: amenity_serving_floor_exists
    applies_to: "POST /buildings/{buildingId}/shared-amenities"
    category: referential
    priority: 10
    condition: "no Floor in this building has floor_number = serving_floor_number"
    error_id: ERR_FLOOR_NOT_FOUND

  # ---- lease creation and negotiation ----
  - rule_id: lease_floor_in_building
    applies_to: "POST /leases"
    category: referential
    priority: 10
    condition: "premises_floor.building_id != building_id"
    error_id: ERR_FLOOR_NOT_IN_PREMISES
  - rule_id: proposal_stale_lease_version
    applies_to: "POST /leases/{leaseId}/ti-proposals"
    category: concurrency
    priority: 10
    condition: "expected_lease_version != lease.version"
    error_id: ERR_STALE_LEASE_VERSION
  - rule_id: proposal_lease_state
    applies_to: "POST /leases/{leaseId}/ti-proposals"
    category: state
    priority: 20
    condition: "lease.status not in {LOI, NEGOTIATING, COUNTER_PENDING}"
    error_id: ERR_INVALID_LEASE_STATE
  - rule_id: proposal_building_conversion_approved
    applies_to: "POST /leases/{leaseId}/ti-proposals"
    category: business_safety
    priority: 30
    condition: "building.suitability_state not in {CONVERSION_APPROVED, CONVERSION_COMPLETE}"
    error_id: ERR_BUILDING_NOT_CONVERSION_APPROVED
  - rule_id: proposal_turn_taking
    applies_to: "POST /leases/{leaseId}/ti-proposals"
    category: authorization
    priority: 40
    condition: "an OPEN proposal exists on this lease and its proposed_by equals the party derived from the caller's role"
    error_id: ERR_NOT_YOUR_TURN
  - rule_id: proposal_round_limit
    applies_to: "POST /leases/{leaseId}/ti-proposals"
    category: business_fiscal
    priority: 50
    condition: "lease.negotiation_round_count >= NEGOTIATION_ROUND_LIMIT (6)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
  - rule_id: accept_proposal_state
    applies_to: "POST /ti-proposals/{proposalId}/accept"
    category: state
    priority: 10
    condition: "proposal.status != OPEN"
    error_id: ERR_INVALID_PROPOSAL_STATE
  - rule_id: accept_self_forbidden
    applies_to: "POST /ti-proposals/{proposalId}/accept"
    category: authorization
    priority: 20
    condition: "X-User-ID = proposal.authored_by_user_id, or the caller's party equals proposal.proposed_by"
    error_id: ERR_SELF_ACCEPT_FORBIDDEN
  - rule_id: accept_proposal_expired
    applies_to: "POST /ti-proposals/{proposalId}/accept"
    category: business_temporal
    priority: 30
    condition: "proposal.expires_at < current logical clock"
    error_id: ERR_PROPOSAL_EXPIRED

  # ---- execution and TI money ----
  - rule_id: execute_lease_state
    applies_to: "POST /leases/{leaseId}/execute"
    category: state
    priority: 10
    condition: "lease.status != TERMS_ACCEPTED"
    error_id: ERR_INVALID_LEASE_STATE
  - rule_id: execute_escrow_funded
    applies_to: "POST /leases/{leaseId}/execute"
    category: business_fiscal
    priority: 20
    condition: "restoration_escrow_held_usd < restoration_escrow_required_usd"
    error_id: ERR_ESCROW_DEPOSIT_INSUFFICIENT
  - rule_id: execute_segregation_of_duties
    applies_to: "POST /leases/{leaseId}/execute"
    category: authorization
    priority: 30
    condition: "X-User-ID equals the accepted proposal's authored_by_user_id or equals lease.terms_accepted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule_id: disbursement_lease_state
    applies_to: "POST /leases/{leaseId}/ti-disbursements"
    category: state
    priority: 10
    condition: "lease.status not in {EXECUTED, ACTIVE}"
    error_id: ERR_INVALID_LEASE_STATE
  - rule_id: disbursement_committed_available
    applies_to: "POST /leases/{leaseId}/ti-disbursements"
    category: business_fiscal
    priority: 20
    condition: "lease.ti_committed_usd = 0"
    error_id: ERR_TI_ALLOWANCE_EXHAUSTED
  - rule_id: settlement_lease_state
    applies_to: "POST /leases/{leaseId}/restoration-settlement"
    category: state
    priority: 10
    condition: "lease.status != EXPIRING"
    error_id: ERR_RESTORATION_ALREADY_SETTLED
  - rule_id: settlement_phases_quiesced
    applies_to: "POST /leases/{leaseId}/restoration-settlement"
    category: business_completeness
    priority: 20
    condition: "any PhasePackage of this lease's projects is in {SCHEDULED, VIBRATION_HOLD, BLOCKED, IN_PROGRESS}"
    error_id: ERR_PHASES_NOT_QUIESCED

  # ---- fit-out project and permitting ----
  - rule_id: project_floor_matches_premises
    applies_to: "POST /fit-out-projects"
    category: referential
    priority: 10
    condition: "floor_id != lease.premises_floor_id"
    error_id: ERR_FLOOR_NOT_IN_PREMISES
  - rule_id: project_lease_executed
    applies_to: "POST /fit-out-projects"
    category: state
    priority: 20
    condition: "lease.status not in {TERMS_ACCEPTED, EXECUTED, ACTIVE}"
    error_id: ERR_INVALID_LEASE_STATE
  - rule_id: permit_application_project_state
    applies_to: "POST /fit-out-projects/{projectId}/permit-application"
    category: state
    priority: 10
    condition: "project.permit_status != P_UNPERMITTED"
    error_id: ERR_INVALID_PERMIT_STATE
  - rule_id: permit_application_lease_executed
    applies_to: "POST /fit-out-projects/{projectId}/permit-application"
    category: state
    priority: 20
    condition: "lease.status not in {EXECUTED, ACTIVE}"
    error_id: ERR_INVALID_LEASE_STATE
  - rule_id: permit_application_building_approved
    applies_to: "POST /fit-out-projects/{projectId}/permit-application"
    category: business_safety
    priority: 30
    condition: "building.suitability_state not in {CONVERSION_APPROVED, CONVERSION_COMPLETE}"
    error_id: ERR_BUILDING_NOT_CONVERSION_APPROVED
  - rule_id: permit_application_exhaust_scope_complete
    applies_to: "POST /fit-out-projects/{projectId}/permit-application"
    category: business_safety
    priority: 40
    condition: "the building's LAB_EXHAUST ConversionScopeItem is missing or its status != COMPLETE"
    error_id: ERR_EXHAUST_SCOPE_INCOMPLETE
  - rule_id: permit_decision_state
    applies_to: "POST /fit-out-projects/{projectId}/permit-decision"
    category: state
    priority: 10
    condition: "project.permit_status != P_APPLIED"
    error_id: ERR_INVALID_PERMIT_STATE
  - rule_id: milestone_phases_complete
    applies_to: "POST /fit-out-projects/{projectId}/construction-milestone"
    category: business_completeness
    priority: 20
    condition: "any PhasePackage of this project is in {SCHEDULED, VIBRATION_HOLD, BLOCKED, IN_PROGRESS} or no PhasePackage is COMPLETE"
    error_id: ERR_PHASES_NOT_QUIESCED

  # ---- capacity reservations ----
  - rule_id: reservation_stale_building_version
    applies_to: "POST /capacity-reservations"
    category: concurrency
    priority: 10
    condition: "expected_building_version != building.version"
    error_id: ERR_STALE_BUILDING_VERSION
  - rule_id: reservation_project_permitted
    applies_to: "POST /capacity-reservations"
    category: state
    priority: 20
    condition: "project.permit_status != P_ISSUED"
    error_id: ERR_PROJECT_NOT_PERMITTED
  - rule_id: reservation_exhaust_pool
    applies_to: "POST /capacity-reservations"
    category: business_fiscal
    priority: 30
    condition: "exhaust_cfm > building.exhaust_available_cfm"
    error_id: ERR_EXHAUST_CAPACITY_EXCEEDED
  - rule_id: reservation_power_pool
    applies_to: "POST /capacity-reservations"
    category: business_fiscal
    priority: 40
    condition: "power_kw > building.power_available_kw"
    error_id: ERR_POWER_CAPACITY_EXCEEDED
  - rule_id: reservation_cancel_state
    applies_to: "POST /capacity-reservations/{reservationId}/cancel"
    category: state
    priority: 10
    condition: "reservation.status != RESERVED"
    error_id: ERR_INVALID_RESERVATION_STATE

  # ---- hazardous materials ----
  - rule_id: hazmat_control_area_in_range
    applies_to: "POST /hazmat-permits"
    category: business_safety
    priority: 10
    condition: "control_area_index < 1 or control_area_index > floor.control_areas_allowed"
    error_id: ERR_CONTROL_AREA_OUT_OF_RANGE
  - rule_id: hazmat_floor_matches_project
    applies_to: "POST /hazmat-permits"
    category: referential
    priority: 20
    condition: "floor_id != project.floor_id"
    error_id: ERR_FLOOR_NOT_IN_PREMISES
  - rule_id: hazmat_project_maq
    applies_to: "POST /hazmat-permits"
    category: business_safety
    priority: 30
    condition: >
      the PER_CONTROL_AREA basis restricted to permits of THIS project
      (statuses REQUESTED, APPROVED, ACTIVE, same floor, same hazard_class, same control_area_index)
      plus quantity_gal exceeds allowance_per_control_area_gal for this permit's use_condition
    error_id: ERR_CONTROL_AREA_MAQ_EXCEEDED
  - rule_id: hazmat_decision_state
    applies_to: "POST /hazmat-permits/{permitId}/decision"
    category: state
    priority: 10
    condition: "decision = APPROVE and permit.status != REQUESTED, or decision = DENY and permit.status != REQUESTED, or decision = REVOKE and permit.status not in {APPROVED, ACTIVE}"
    error_id: ERR_INVALID_PERMIT_DECISION
  - rule_id: hazmat_decision_project_permitted
    applies_to: "POST /hazmat-permits/{permitId}/decision"
    category: state
    priority: 20
    condition: "decision = APPROVE and project.permit_status != P_ISSUED"
    error_id: ERR_PROJECT_NOT_PERMITTED
  - rule_id: hazmat_floor_wide_maq
    applies_to: "POST /hazmat-permits/{permitId}/decision"
    category: business_safety
    priority: 30
    condition: >
      decision = APPROVE and the floor-wide cross-tenant PER_CONTROL_AREA basis
      (statuses APPROVED, ACTIVE, all projects, same floor, same hazard_class, same control_area_index)
      plus this permit's quantity_gal exceeds allowance_per_control_area_gal
    error_id: ERR_CONTROL_AREA_MAQ_EXCEEDED
  - rule_id: hazmat_decision_reason_required
    applies_to: "POST /hazmat-permits/{permitId}/decision"
    category: business_documentation
    priority: 40
    condition: "decision in {DENY, REVOKE} and decision_reason is null or blank"
    error_id: ERR_DECISION_REASON_REQUIRED

  # ---- phase scheduling and delivery ----
  - rule_id: phase_predecessor_same_project
    applies_to: "POST /fit-out-projects/{projectId}/phase-packages"
    category: referential
    priority: 10
    condition: "predecessor_phase_id is not null and the predecessor's project_id != projectId"
    error_id: ERR_PREDECESSOR_NOT_IN_PROJECT
  - rule_id: phase_sequence_unique
    applies_to: "POST /fit-out-projects/{projectId}/phase-packages"
    category: business_uniqueness
    priority: 20
    condition: "a PhasePackage with the same sequence_no already exists on this project"
    error_id: ERR_DUPLICATE_PHASE_SEQUENCE
  - rule_id: phase_shutdown_requires_amenity
    applies_to: "POST /fit-out-projects/{projectId}/phase-packages"
    category: business_completeness
    priority: 30
    condition: "work_class = SHUTDOWN_REQUIRED and affected_amenity_id is null"
    error_id: ERR_SHUTDOWN_AMENITY_REQUIRED
  - rule_id: phase_schedule_state
    applies_to: "POST /phase-packages/{phaseId}/schedule"
    category: state
    priority: 10
    condition: "phase.status not in {DRAFT, SCHEDULED, VIBRATION_HOLD}"
    error_id: ERR_INVALID_PHASE_STATE
  - rule_id: phase_window_ordering
    applies_to: "POST /phase-packages/{phaseId}/schedule"
    category: business_temporal
    priority: 20
    condition: "window_start >= window_end"
    error_id: ERR_INVALID_WINDOW
  - rule_id: phase_vibration_conflict
    applies_to: "POST /phase-packages/{phaseId}/schedule"
    category: business_safety
    priority: 30
    condition: >
      another PhasePackage on the SAME Floor (reached via project.floor_id), in status
      {SCHEDULED, VIBRATION_HOLD, BLOCKED, IN_PROGRESS}, excluding this phase itself, where at least
      one of the two phases has work_class = VIBRATION_GENERATING, satisfies the buffered CLOSED
      interval test: new.window_start <= other.window_end + 24h AND other.window_start <= new.window_end + 24h
    error_id: ERR_VIBRATION_WINDOW_CONFLICT
  - rule_id: phase_window_within_term
    applies_to: "POST /phase-packages/{phaseId}/schedule"
    category: business_temporal
    priority: 40
    condition: "window_start < lease.executed_at or window_end > lease.delivery_deadline"
    error_id: ERR_WINDOW_OUTSIDE_DELIVERY_TERM
  - rule_id: phase_shutdown_amenity_conflict
    applies_to: "POST /phase-packages/{phaseId}/schedule"
    category: business_safety
    priority: 50
    condition: >
      phase.work_class = SHUTDOWN_REQUIRED and some AmenityAllocation on phase.affected_amenity_id in
      status CONFIRMED overlaps the phase window under the half-open test
      alloc.window_start < phase.window_end AND phase.window_start < alloc.window_end
    error_id: ERR_SHUTDOWN_CONFLICTS_AMENITY
  - rule_id: phase_hold_state
    applies_to: "POST /phase-packages/{phaseId}/hold"
    category: state
    priority: 10
    condition: "phase.status != SCHEDULED"
    error_id: ERR_INVALID_PHASE_STATE
  - rule_id: phase_hold_reason_required
    applies_to: "POST /phase-packages/{phaseId}/hold"
    category: business_documentation
    priority: 20
    condition: "hold_reason is null or blank"
    error_id: ERR_HOLD_REASON_REQUIRED
  - rule_id: phase_progress_state
    applies_to: "POST /phase-packages/{phaseId}/progress"
    category: state
    priority: 10
    condition: "target_status = IN_PROGRESS and phase.status != SCHEDULED, or target_status = COMPLETE and phase.status != IN_PROGRESS"
    error_id: ERR_INVALID_PHASE_STATE
  - rule_id: phase_progress_requires_permit
    applies_to: "POST /phase-packages/{phaseId}/progress"
    category: business_safety
    priority: 20
    condition: "target_status = IN_PROGRESS and project.permit_status != P_ISSUED"
    error_id: ERR_PROJECT_NOT_PERMITTED
  - rule_id: phase_progress_predecessor_complete
    applies_to: "POST /phase-packages/{phaseId}/progress"
    category: business_completeness
    priority: 30
    condition: "target_status = IN_PROGRESS and predecessor_phase_id is not null and the predecessor's status != COMPLETE"
    error_id: ERR_PREDECESSOR_NOT_COMPLETE

  # ---- shared amenity programming ----
  - rule_id: allocation_window_ordering
    applies_to: "POST /amenity-allocations"
    category: business_temporal
    priority: 10
    condition: "window_start >= window_end"
    error_id: ERR_INVALID_WINDOW
  - rule_id: allocation_amenity_same_building
    applies_to: "POST /amenity-allocations"
    category: referential
    priority: 20
    condition: "amenity.building_id != the building reached through project.floor_id -> Floor.building_id"
    error_id: ERR_AMENITY_NOT_IN_BUILDING
  - rule_id: allocation_project_state
    applies_to: "POST /amenity-allocations"
    category: state
    priority: 30
    condition: "project.construction_status in {C_SUSPENDED, C_ACCEPTED}"
    error_id: ERR_INVALID_PROJECT_STATE
  - rule_id: allocation_concurrent_capacity
    applies_to: "POST /amenity-allocations"
    category: business_capacity
    priority: 40
    condition: >
      at some candidate instant t in {new.window_start} union {a.window_start of every existing
      allocation a on this amenity in status {REQUESTED, CONFIRMED} with new.window_start <= a.window_start
      < new.window_end}, the count of allocations in {REQUESTED, CONFIRMED} whose half-open window
      [window_start, window_end) contains t, plus the new allocation, exceeds amenity.concurrent_capacity
    error_id: ERR_AMENITY_CAPACITY_EXCEEDED
  - rule_id: allocation_vibration_sensitive
    applies_to: "POST /amenity-allocations"
    category: business_safety
    priority: 50
    condition: >
      amenity.vibration_sensitive = true and some PhasePackage with work_class = VIBRATION_GENERATING,
      status in {SCHEDULED, IN_PROGRESS}, whose project.floor_id resolves to the Floor with
      floor_number = amenity.serving_floor_number in amenity.building_id, overlaps the requested window
      under the half-open test
    error_id: ERR_VIBRATION_WINDOW_CONFLICT
  - rule_id: allocation_confirm_state
    applies_to: "POST /amenity-allocations/{allocationId}/confirm"
    category: state
    priority: 10
    condition: "allocation.status != REQUESTED"
    error_id: ERR_INVALID_ALLOCATION_STATE
  - rule_id: allocation_cancel_state
    applies_to: "POST /amenity-allocations/{allocationId}/cancel"
    category: state
    priority: 10
    condition: "allocation.status not in {REQUESTED, CONFIRMED}"
    error_id: ERR_INVALID_ALLOCATION_STATE
  - rule_id: allocation_cancel_tenant_scope
    applies_to: "POST /amenity-allocations/{allocationId}/cancel"
    category: authorization
    priority: 20
    condition: "caller role = Tenant and the allocation's project belongs to a lease whose tenant_id != the caller's tenant"
    error_id: ERR_UNAUTHORIZED

  # ---- commissioning ----
  - rule_id: commissioning_script_required_for_tenant
    applies_to: "POST /fit-out-projects/{projectId}/commissioning-records"
    category: business_completeness
    priority: 10
    condition: "script_type not in project.required_commissioning_scripts"
    error_id: ERR_SCRIPT_NOT_REQUIRED
  - rule_id: commissioning_script_unique_open
    applies_to: "POST /fit-out-projects/{projectId}/commissioning-records"
    category: business_uniqueness
    priority: 20
    condition: "a CommissioningRecord for this project and script_type exists with status in {SCHEDULED, PASSED}"
    error_id: ERR_DUPLICATE_COMMISSIONING_SCRIPT
  - rule_id: commissioning_result_state
    applies_to: "POST /commissioning-records/{recordId}/result"
    category: state
    priority: 10
    condition: "record.status != SCHEDULED"
    error_id: ERR_INVALID_COMMISSIONING_STATE
  - rule_id: commissioning_project_substantial_completion
    applies_to: "POST /commissioning-records/{recordId}/result"
    category: state
    priority: 20
    condition: "project.construction_status != C_SUBSTANTIAL_COMPLETION"
    error_id: ERR_COMMISSIONING_INCOMPLETE
  - rule_id: commissioning_witness_conflict
    applies_to: "POST /commissioning-records/{recordId}/result"
    category: authorization
    priority: 30
    condition: "witnessed_by_user_id = record.executed_by_user_id"
    error_id: ERR_WITNESS_CONFLICT

# =============================================================================
# §1.5 API Endpoints  (all paths are root-level; api_prefix is "/")
# =============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; every subsequent temporal evaluation uses this instant"]
    errors: [ERR_VALIDATION]

  # ---- Building ----
  - method: POST
    path: /buildings
    roles: [LandlordAssetManager]
    input: [name, address_city, occupancy_status, published_floor_to_floor_ft, published_live_load_psf, published_vibration_class, exhaust_riser_capacity_cfm, emergency_power_capacity_kw, chilled_water_capacity_tons]
    output: Building
    side_effects: ["Building created with suitability_state = DRAFT, version = 1, pools initialised from the riser and generator capacities"]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /buildings/{buildingId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: []
    output: Building
    side_effects: []
    errors: [ERR_BUILDING_NOT_FOUND]
  - method: POST
    path: /buildings/{buildingId}/conversion-approval
    roles: [LandlordAssetManager]
    input: []
    output: Building
    side_effects: ["suitability_state -> CONVERSION_APPROVED", "version += 1"]
    errors: [ERR_BUILDING_NOT_FOUND, ERR_INVALID_BUILDING_STATE, ERR_CONVERSION_SCOPE_INCOMPLETE, ERR_UNAUTHORIZED]

  # ---- Floor ----
  - method: POST
    path: /buildings/{buildingId}/floors
    roles: [BaseBuildingEngineer]
    input: [floor_number, floor_to_floor_ft, live_load_psf, vibration_class, "sprinklered?"]
    output: Floor
    side_effects: ["Floor created; control_areas_allowed and percent_maq derived from floor_number"]
    errors: [ERR_BUILDING_NOT_FOUND, ERR_DUPLICATE_FLOOR_NUMBER, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /buildings/{buildingId}/floors
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: ["limit?", "offset?"]
    output: "Floor[]"
    side_effects: []
    errors: [ERR_BUILDING_NOT_FOUND]
  - method: GET
    path: /floors/{floorId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: []
    output: Floor
    side_effects: []
    errors: [ERR_FLOOR_NOT_FOUND]
  - method: GET
    path: /floors
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: ["building_id?", "vibration_class?", "limit?", "offset?"]
    output: "Floor[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: GET
    path: /floors/{floorId}/hazmat-utilization
    roles: [LandlordAssetManager, BaseBuildingEngineer, AHJPermitOfficer]
    input: [hazard_class, "control_area_index?"]
    output: "{ floor_id: string, hazard_class: string, control_area_index: integer, control_areas_allowed: integer, allowance_per_control_area_gal: decimal, aggregate_allowance_gal: decimal, per_control_area_basis_gal: decimal, aggregate_basis_gal: decimal, per_control_area_utilization_pct: decimal, aggregate_utilization_pct: decimal }"
    side_effects: []
    errors: [ERR_FLOOR_NOT_FOUND, ERR_VALIDATION, ERR_CONTROL_AREA_OUT_OF_RANGE]

  # ---- SuitabilityAssessment ----
  - method: POST
    path: /buildings/{buildingId}/suitability-assessments
    roles: [BaseBuildingEngineer]
    input: [assessment_basis, required_vibration_class, required_exhaust_cfm, required_power_kw, "measured_floor_to_floor_ft?", "measured_live_load_psf?", "measured_vibration_class?"]
    output: SuitabilityAssessment
    side_effects: ["assessment created with status = DRAFT", "Building.suitability_state -> ASSESSING", "Building.version += 1"]
    errors: [ERR_BUILDING_NOT_FOUND, ERR_ASSESSMENT_ALREADY_OPEN, ERR_INVALID_BUILDING_STATE, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /buildings/{buildingId}/suitability-assessments
    roles: [LandlordAssetManager, BaseBuildingEngineer, AHJPermitOfficer]
    input: ["status?", "limit?", "offset?"]
    output: "SuitabilityAssessment[]"
    side_effects: []
    errors: [ERR_BUILDING_NOT_FOUND]
  - method: GET
    path: /suitability-assessments/{assessmentId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, AHJPermitOfficer]
    input: []
    output: SuitabilityAssessment
    side_effects: []
    errors: [ERR_ASSESSMENT_NOT_FOUND]
  - method: GET
    path: /suitability-assessments
    roles: [LandlordAssetManager, BaseBuildingEngineer, AHJPermitOfficer]
    input: ["building_id?", "assessment_basis?", "status?", "verdict?", "limit?", "offset?"]
    output: "SuitabilityAssessment[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /suitability-assessments/{assessmentId}/submit
    roles: [BaseBuildingEngineer]
    input: []
    output: SuitabilityAssessment
    side_effects: ["credits, utility_headroom_ratio, suitability_score, hard_fail_capped and verdict computed", "status -> SUBMITTED", "return_note cleared", "version += 1"]
    errors: [ERR_ASSESSMENT_NOT_FOUND, ERR_INVALID_ASSESSMENT_STATE, ERR_UNAUTHORIZED]
  - method: POST
    path: /suitability-assessments/{assessmentId}/decision
    roles: [LandlordAssetManager]
    input: [decision, "return_note?"]
    output: SuitabilityAssessment
    side_effects: ["status -> ACCEPTED or RETURNED", "decided_by_user_id set", "on ACCEPT: Building.latest_assessment_verdict and Building.suitability_state updated, Building.version += 1", "version += 1"]
    errors: [ERR_ASSESSMENT_NOT_FOUND, ERR_INVALID_ASSESSMENT_STATE, ERR_RETURN_NOTE_REQUIRED, ERR_VALIDATION, ERR_UNAUTHORIZED]

  # ---- ConversionScopeItem ----
  - method: POST
    path: /buildings/{buildingId}/conversion-scope-items
    roles: [LandlordAssetManager]
    input: [discipline, description, budget_usd, "capacity_delta_cfm?", "capacity_delta_kw?"]
    output: ConversionScopeItem
    side_effects: ["item created with status = PLANNED", "Building.scope_disciplines_covered recomputed", "Building.version += 1"]
    errors: [ERR_BUILDING_NOT_FOUND, ERR_DUPLICATE_SCOPE_DISCIPLINE, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /buildings/{buildingId}/conversion-scope-items
    roles: [LandlordAssetManager, BaseBuildingEngineer, AHJPermitOfficer]
    input: ["status?", "limit?", "offset?"]
    output: "ConversionScopeItem[]"
    side_effects: []
    errors: [ERR_BUILDING_NOT_FOUND]
  - method: GET
    path: /conversion-scope-items/{itemId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, AHJPermitOfficer]
    input: []
    output: ConversionScopeItem
    side_effects: []
    errors: [ERR_SCOPE_ITEM_NOT_FOUND]
  - method: GET
    path: /conversion-scope-items
    roles: [LandlordAssetManager, BaseBuildingEngineer, AHJPermitOfficer]
    input: ["building_id?", "discipline?", "status?", "limit?", "offset?"]
    output: "ConversionScopeItem[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /conversion-scope-items/{itemId}/complete
    roles: [BaseBuildingEngineer]
    input: []
    output: ConversionScopeItem
    side_effects: ["status -> COMPLETE; completed_at set", "Building capacity pools recomputed", "Building.suitability_state -> CONVERSION_COMPLETE when all four disciplines are COMPLETE", "Building.version += 1", "version += 1"]
    errors: [ERR_SCOPE_ITEM_NOT_FOUND, ERR_BUILDING_NOT_CONVERSION_APPROVED, ERR_INVALID_SCOPE_ITEM_STATE, ERR_UNAUTHORIZED]

  # ---- SharedAmenity ----
  - method: POST
    path: /buildings/{buildingId}/shared-amenities
    roles: [LandlordAssetManager]
    input: [name, amenity_type, serving_floor_number, concurrent_capacity, "vibration_sensitive?", "utility_draw_kw?"]
    output: SharedAmenity
    side_effects: ["amenity created"]
    errors: [ERR_BUILDING_NOT_FOUND, ERR_FLOOR_NOT_FOUND, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /buildings/{buildingId}/shared-amenities
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: ["amenity_type?", "limit?", "offset?"]
    output: "SharedAmenity[]"
    side_effects: []
    errors: [ERR_BUILDING_NOT_FOUND]
  - method: GET
    path: /shared-amenities/{amenityId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: []
    output: SharedAmenity
    side_effects: []
    errors: [ERR_AMENITY_NOT_FOUND]
  - method: GET
    path: /shared-amenities
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: ["building_id?", "amenity_type?", "limit?", "offset?"]
    output: "SharedAmenity[]"
    side_effects: []
    errors: [ERR_VALIDATION]

  # ---- Tenant ----
  - method: POST
    path: /tenants
    roles: [LandlordAssetManager]
    input: [legal_name, research_type, credit_tier]
    output: Tenant
    side_effects: ["Tenant created; lab_premium_psf and required_commissioning_scripts derived from research_type"]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /tenants/{tenantId}
    roles: [LandlordAssetManager, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: []
    output: Tenant
    side_effects: []
    errors: [ERR_TENANT_NOT_FOUND]

  # ---- Lease ----
  - method: POST
    path: /leases
    roles: [LandlordAssetManager]
    input: [tenant_id, building_id, premises_floor_id, rentable_sf, term_months, base_rent_psf, delivery_deadline]
    output: Lease
    side_effects: ["Lease created with status = LOI and a zeroed TI ledger"]
    errors: [ERR_TENANT_NOT_FOUND, ERR_BUILDING_NOT_FOUND, ERR_FLOOR_NOT_FOUND, ERR_FLOOR_NOT_IN_PREMISES, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /leases/{leaseId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: []
    output: Lease
    side_effects: []
    errors: [ERR_LEASE_NOT_FOUND]
  - method: GET
    path: /leases
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: ["tenant_id?", "building_id?", "premises_floor_id?", "status?", "limit?", "offset?"]
    output: "Lease[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /leases/{leaseId}/ti-proposals
    roles: [LandlordAssetManager, Tenant]
    input: [expected_lease_version, proposed_allowance_psf, "note?"]
    output: TIProposal
    side_effects:
      - "prior OPEN proposal -> COUNTERED, or -> EXPIRED when its expires_at < now"
      - "new TIProposal created with status = OPEN, round_number = negotiation_round_count + 1, expires_at = now + 10 days"
      - "Lease.status LOI -> NEGOTIATING, or alternates NEGOTIATING <-> COUNTER_PENDING"
      - "Lease.version += 1"
    errors: [ERR_LEASE_NOT_FOUND, ERR_STALE_LEASE_VERSION, ERR_INVALID_LEASE_STATE, ERR_BUILDING_NOT_CONVERSION_APPROVED, ERR_NOT_YOUR_TURN, ERR_NEGOTIATION_ROUND_LIMIT, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /leases/{leaseId}/ti-proposals
    roles: [LandlordAssetManager, Tenant]
    input: ["status?", "limit?", "offset?"]
    output: "TIProposal[]"
    side_effects: []
    errors: [ERR_LEASE_NOT_FOUND]
  - method: GET
    path: /ti-proposals/{proposalId}
    roles: [LandlordAssetManager, Tenant]
    input: []
    output: TIProposal
    side_effects: []
    errors: [ERR_PROPOSAL_NOT_FOUND]
  - method: GET
    path: /ti-proposals
    roles: [LandlordAssetManager, Tenant]
    input: ["lease_id?", "proposed_by?", "status?", "limit?", "offset?"]
    output: "TIProposal[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /ti-proposals/{proposalId}/accept
    roles: [LandlordAssetManager, Tenant]
    input: []
    output: Lease
    side_effects:
      - "proposal.status -> ACCEPTED; accepted_by_user_id set"
      - "Lease.status -> TERMS_ACCEPTED"
      - "TI economics frozen: lab_premium_psf_applied, provisional_authorized_ti_usd, volume_credit_psf, final_allowance_psf, ti_authorized_usd, ti_uncommitted_usd, restoration_escrow_required_usd"
      - "terms_accepted_by_user_id and accepted_proposal_round set"
      - "Lease.version += 1"
    errors: [ERR_PROPOSAL_NOT_FOUND, ERR_INVALID_PROPOSAL_STATE, ERR_SELF_ACCEPT_FORBIDDEN, ERR_PROPOSAL_EXPIRED, ERR_UNAUTHORIZED]
  - method: POST
    path: /leases/{leaseId}/escrow-deposits
    roles: [Tenant, LandlordAssetManager]
    input: [amount_usd]
    output: Lease
    side_effects: ["restoration_escrow_held_usd += amount_usd", "Lease.version += 1"]
    errors: [ERR_LEASE_NOT_FOUND, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /leases/{leaseId}/execute
    roles: [LandlordAssetManager]
    input: []
    output: Lease
    side_effects: ["status -> EXECUTED", "executed_by_user_id and executed_at set", "Lease.version += 1"]
    errors: [ERR_LEASE_NOT_FOUND, ERR_INVALID_LEASE_STATE, ERR_ESCROW_DEPOSIT_INSUFFICIENT, ERR_SEGREGATION_OF_DUTIES, ERR_UNAUTHORIZED]
  - method: POST
    path: /leases/{leaseId}/ti-disbursements
    roles: [LandlordAssetManager]
    input: [requested_usd]
    output: Lease
    side_effects:
      - "disbursed amount = min(requested_usd, draw cap, ti_committed_usd)"
      - "per-phase pro-rata allocation written to PhasePackage.ti_disbursed_usd with the residual assigned to the largest committed phase"
      - "ti_committed_usd decreased and ti_disbursed_usd increased by the disbursed amount; last_disbursement_usd set"
      - "Lease.version += 1"
    errors: [ERR_LEASE_NOT_FOUND, ERR_INVALID_LEASE_STATE, ERR_TI_ALLOWANCE_EXHAUSTED, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /leases/{leaseId}/expiration-notice
    roles: [LandlordAssetManager]
    input: [expiration_date]
    output: Lease
    side_effects: ["status ACTIVE -> EXPIRING", "expiration_date stored", "restoration_liability_usd computed", "Lease.version += 1"]
    errors: [ERR_LEASE_NOT_FOUND, ERR_INVALID_LEASE_STATE, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /leases/{leaseId}/restoration-settlement
    roles: [LandlordAssetManager]
    input: []
    output: Lease
    side_effects:
      - "restoration_liability_usd recomputed; escrow applied and refunded; TI clawback taken from ti_uncommitted_usd; restoration_cash_due_usd set"
      - "remaining uncommitted and committed TI moved into ti_forfeited_usd"
      - "APPROVED and ACTIVE HazmatUsePermit rows of this lease's projects -> SURRENDERED"
      - "RESERVED and COMMITTED CapacityReservation rows of this lease's projects -> RELEASED and the building pools freed"
      - "status EXPIRING -> SURRENDERED"
      - "Lease.version += 1"
    errors: [ERR_LEASE_NOT_FOUND, ERR_RESTORATION_ALREADY_SETTLED, ERR_PHASES_NOT_QUIESCED, ERR_UNAUTHORIZED]

  # ---- FitOutProject ----
  - method: POST
    path: /fit-out-projects
    roles: [LandlordAssetManager]
    input: [lease_id, floor_id, design_exhaust_cfm, design_power_kw, scope_summary]
    output: FitOutProject
    side_effects: ["project created with permit_status = P_UNPERMITTED and construction_status = C_NOT_STARTED", "required_commissioning_scripts derived from the tenant's research_type"]
    errors: [ERR_LEASE_NOT_FOUND, ERR_FLOOR_NOT_FOUND, ERR_FLOOR_NOT_IN_PREMISES, ERR_INVALID_LEASE_STATE, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /fit-out-projects/{projectId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: []
    output: FitOutProject
    side_effects: []
    errors: [ERR_PROJECT_NOT_FOUND]
  - method: GET
    path: /fit-out-projects
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer, CommissioningAgent]
    input: ["lease_id?", "floor_id?", "permit_status?", "construction_status?", "limit?", "offset?"]
    output: "FitOutProject[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /fit-out-projects/{projectId}/permit-application
    roles: [LandlordAssetManager]
    input: []
    output: FitOutProject
    side_effects: ["permit_status -> P_APPLIED; permit_applied_at set", "version += 1"]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_INVALID_PERMIT_STATE, ERR_INVALID_LEASE_STATE, ERR_BUILDING_NOT_CONVERSION_APPROVED, ERR_EXHAUST_SCOPE_INCOMPLETE, ERR_UNAUTHORIZED]
  - method: POST
    path: /fit-out-projects/{projectId}/permit-decision
    roles: [AHJPermitOfficer]
    input: [decision, "decision_note?"]
    output: FitOutProject
    side_effects: ["permit_status -> P_ISSUED on decision = ISSUE; permit_issued_at set", "version += 1"]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_INVALID_PERMIT_STATE, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /fit-out-projects/{projectId}/construction-milestone
    roles: [LandlordAssetManager]
    input: [milestone]
    output: FitOutProject
    side_effects: ["construction_status C_IN_PROGRESS -> C_SUBSTANTIAL_COMPLETION", "version += 1"]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_INVALID_PROJECT_STATE, ERR_PHASES_NOT_QUIESCED, ERR_VALIDATION, ERR_UNAUTHORIZED]

  # ---- PhasePackage ----
  - method: POST
    path: /fit-out-projects/{projectId}/phase-packages
    roles: [LandlordAssetManager]
    input: [sequence_no, premium_class, work_class, hard_cost_usd, restoration_cost_usd, "predecessor_phase_id?", "affected_amenity_id?"]
    output: PhasePackage
    side_effects: ["phase created with status = DRAFT and null window"]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_PHASE_NOT_FOUND, ERR_AMENITY_NOT_FOUND, ERR_PREDECESSOR_NOT_IN_PROJECT, ERR_DUPLICATE_PHASE_SEQUENCE, ERR_SHUTDOWN_AMENITY_REQUIRED, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /phase-packages/{phaseId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, CommissioningAgent]
    input: []
    output: PhasePackage
    side_effects: []
    errors: [ERR_PHASE_NOT_FOUND]
  - method: GET
    path: /phase-packages
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, CommissioningAgent]
    input: ["project_id?", "predecessor_phase_id?", "affected_amenity_id?", "status?", "limit?", "offset?"]
    output: "PhasePackage[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /phase-packages/{phaseId}/schedule
    roles: [LandlordAssetManager]
    input: [window_start, window_end]
    output: PhasePackage
    side_effects:
      - "window stored; status -> SCHEDULED (from DRAFT, SCHEDULED or VIBRATION_HOLD); hold_reason cleared"
      - "transitively BLOCKED successors restored to their recorded prior_status"
      - "project.construction_status C_SUSPENDED -> C_IN_PROGRESS and delivery_risk -> ON_TRACK once no phase remains in {VIBRATION_HOLD, BLOCKED}"
      - "version += 1"
    errors: [ERR_PHASE_NOT_FOUND, ERR_INVALID_PHASE_STATE, ERR_INVALID_WINDOW, ERR_VIBRATION_WINDOW_CONFLICT, ERR_WINDOW_OUTSIDE_DELIVERY_TERM, ERR_SHUTDOWN_CONFLICTS_AMENITY, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /phase-packages/{phaseId}/hold
    roles: [BaseBuildingEngineer]
    input: [hold_reason]
    output: PhasePackage
    side_effects:
      - "status -> VIBRATION_HOLD; hold_reason stored"
      - "every transitively downstream phase in {DRAFT, SCHEDULED} -> BLOCKED with prior_status recorded"
      - "project.construction_status C_IN_PROGRESS -> C_SUSPENDED; delivery_risk -> AT_RISK"
      - "project's REQUESTED and CONFIRMED AmenityAllocation rows with window_start >= now -> PREEMPTED"
      - "version += 1"
    errors: [ERR_PHASE_NOT_FOUND, ERR_INVALID_PHASE_STATE, ERR_HOLD_REASON_REQUIRED, ERR_UNAUTHORIZED]
  - method: POST
    path: /phase-packages/{phaseId}/progress
    roles: [LandlordAssetManager]
    input: [target_status]
    output: PhasePackage
    side_effects:
      - "status SCHEDULED -> IN_PROGRESS or IN_PROGRESS -> COMPLETE"
      - "on the first IN_PROGRESS: project.construction_status C_NOT_STARTED -> C_IN_PROGRESS"
      - "on COMPLETE: ti_eligible_usd and ti_committed_usd computed and the lease TI ledger updated"
      - "version += 1"
    errors: [ERR_PHASE_NOT_FOUND, ERR_INVALID_PHASE_STATE, ERR_PROJECT_NOT_PERMITTED, ERR_PREDECESSOR_NOT_COMPLETE, ERR_VALIDATION, ERR_UNAUTHORIZED]

  # ---- CapacityReservation ----
  - method: POST
    path: /capacity-reservations
    roles: [LandlordAssetManager]
    input: [project_id, exhaust_cfm, power_kw, expected_building_version]
    output: CapacityReservation
    side_effects: ["reservation created with status = RESERVED and building_id denormalized", "Building.exhaust_reserved_cfm and power_reserved_kw increased", "increments Building.version by 1"]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_STALE_BUILDING_VERSION, ERR_PROJECT_NOT_PERMITTED, ERR_EXHAUST_CAPACITY_EXCEEDED, ERR_POWER_CAPACITY_EXCEEDED, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /capacity-reservations/{reservationId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: []
    output: CapacityReservation
    side_effects: []
    errors: [ERR_RESERVATION_NOT_FOUND]
  - method: GET
    path: /capacity-reservations
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: ["project_id?", "building_id?", "status?", "limit?", "offset?"]
    output: "CapacityReservation[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /capacity-reservations/{reservationId}/cancel
    roles: [LandlordAssetManager]
    input: []
    output: CapacityReservation
    side_effects: ["status -> CANCELLED", "Building reserved buckets reduced by exactly this reservation's amounts", "increments Building.version by 1", "version += 1"]
    errors: [ERR_RESERVATION_NOT_FOUND, ERR_INVALID_RESERVATION_STATE, ERR_UNAUTHORIZED]

  # ---- HazmatUsePermit ----
  - method: POST
    path: /hazmat-permits
    roles: [LandlordAssetManager, Tenant]
    input: [project_id, floor_id, hazard_class, use_condition, quantity_gal, control_area_index]
    output: HazmatUsePermit
    side_effects: ["permit created with status = REQUESTED", "allowance_per_control_area_gal computed"]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_FLOOR_NOT_FOUND, ERR_CONTROL_AREA_OUT_OF_RANGE, ERR_FLOOR_NOT_IN_PREMISES, ERR_CONTROL_AREA_MAQ_EXCEEDED, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /hazmat-permits/{permitId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer]
    input: []
    output: HazmatUsePermit
    side_effects: []
    errors: [ERR_PERMIT_NOT_FOUND]
  - method: GET
    path: /hazmat-permits
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant, AHJPermitOfficer]
    input: ["project_id?", "floor_id?", "hazard_class?", "control_area_index?", "status?", "limit?", "offset?"]
    output: "HazmatUsePermit[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /hazmat-permits/{permitId}/decision
    roles: [AHJPermitOfficer]
    input: [decision, "decision_reason?"]
    output: HazmatUsePermit
    side_effects: ["status -> APPROVED, DENIED or REVOKED", "decision_reason stored on DENY and REVOKE", "version += 1"]
    errors: [ERR_PERMIT_NOT_FOUND, ERR_INVALID_PERMIT_DECISION, ERR_PROJECT_NOT_PERMITTED, ERR_CONTROL_AREA_MAQ_EXCEEDED, ERR_DECISION_REASON_REQUIRED, ERR_VALIDATION, ERR_UNAUTHORIZED]

  # ---- AmenityAllocation ----
  - method: POST
    path: /amenity-allocations
    roles: [Tenant, LandlordAssetManager]
    input: [amenity_id, project_id, window_start, window_end, headcount]
    output: AmenityAllocation
    side_effects: ["allocation created with status = REQUESTED"]
    errors: [ERR_AMENITY_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_INVALID_WINDOW, ERR_AMENITY_NOT_IN_BUILDING, ERR_INVALID_PROJECT_STATE, ERR_AMENITY_CAPACITY_EXCEEDED, ERR_VIBRATION_WINDOW_CONFLICT, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /amenity-allocations/{allocationId}
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: []
    output: AmenityAllocation
    side_effects: []
    errors: [ERR_ALLOCATION_NOT_FOUND]
  - method: GET
    path: /amenity-allocations
    roles: [LandlordAssetManager, BaseBuildingEngineer, Tenant]
    input: ["amenity_id?", "project_id?", "status?", "limit?", "offset?"]
    output: "AmenityAllocation[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /amenity-allocations/{allocationId}/confirm
    roles: [LandlordAssetManager]
    input: []
    output: AmenityAllocation
    side_effects: ["status -> CONFIRMED", "version += 1"]
    errors: [ERR_ALLOCATION_NOT_FOUND, ERR_INVALID_ALLOCATION_STATE, ERR_AMENITY_CAPACITY_EXCEEDED, ERR_UNAUTHORIZED]
  - method: POST
    path: /amenity-allocations/{allocationId}/cancel
    roles: [Tenant, LandlordAssetManager]
    input: []
    output: AmenityAllocation
    side_effects: ["status -> CANCELLED", "version += 1"]
    errors: [ERR_ALLOCATION_NOT_FOUND, ERR_INVALID_ALLOCATION_STATE, ERR_UNAUTHORIZED]

  # ---- CommissioningRecord ----
  - method: POST
    path: /fit-out-projects/{projectId}/commissioning-records
    roles: [CommissioningAgent]
    input: [script_type, scheduled_for, executed_by_user_id]
    output: CommissioningRecord
    side_effects: ["record created with status = SCHEDULED"]
    errors: [ERR_PROJECT_NOT_FOUND, ERR_SCRIPT_NOT_REQUIRED, ERR_DUPLICATE_COMMISSIONING_SCRIPT, ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /fit-out-projects/{projectId}/commissioning-records
    roles: [LandlordAssetManager, Tenant, CommissioningAgent, AHJPermitOfficer]
    input: ["status?", "limit?", "offset?"]
    output: "CommissioningRecord[]"
    side_effects: []
    errors: [ERR_PROJECT_NOT_FOUND]
  - method: GET
    path: /commissioning-records/{recordId}
    roles: [LandlordAssetManager, Tenant, CommissioningAgent, AHJPermitOfficer]
    input: []
    output: CommissioningRecord
    side_effects: []
    errors: [ERR_COMMISSIONING_RECORD_NOT_FOUND]
  - method: GET
    path: /commissioning-records
    roles: [LandlordAssetManager, Tenant, CommissioningAgent, AHJPermitOfficer]
    input: ["project_id?", "script_type?", "result?", "status?", "limit?", "offset?"]
    output: "CommissioningRecord[]"
    side_effects: []
    errors: [ERR_VALIDATION]
  - method: POST
    path: /commissioning-records/{recordId}/result
    roles: [CommissioningAgent]
    input: [result, witnessed_by_user_id, "measured_value?"]
    output: CommissioningRecord
    side_effects:
      - "status -> PASSED or FAILED; result, witnessed_by_user_id and measured_value stored"
      - "on PASS completing the required set: project -> C_ACCEPTED, RESERVED reservations -> COMMITTED, APPROVED permits -> ACTIVE, Building pool buckets shifted, lease EXECUTED -> ACTIVE"
      - "on FAIL: the last TI draw is reversed exactly (lease and per-phase disbursed amounts restored)"
      - "version += 1"
    errors: [ERR_COMMISSIONING_RECORD_NOT_FOUND, ERR_INVALID_COMMISSIONING_STATE, ERR_COMMISSIONING_INCOMPLETE, ERR_WITNESS_CONFLICT, ERR_VALIDATION, ERR_UNAUTHORIZED]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - { error_id: ERR_VALIDATION, http_status: 422, message: "Request body or query parameters are malformed, missing a required field, or carry an unknown enum value" }
  - { error_id: ERR_UNAUTHORIZED, http_status: 403, message: "The calling role may not perform this operation" }
  - { error_id: ERR_BUILDING_NOT_FOUND, http_status: 404, message: "Building does not exist" }
  - { error_id: ERR_FLOOR_NOT_FOUND, http_status: 404, message: "Floor does not exist" }
  - { error_id: ERR_ASSESSMENT_NOT_FOUND, http_status: 404, message: "Suitability assessment does not exist" }
  - { error_id: ERR_SCOPE_ITEM_NOT_FOUND, http_status: 404, message: "Conversion scope item does not exist" }
  - { error_id: ERR_TENANT_NOT_FOUND, http_status: 404, message: "Tenant does not exist" }
  - { error_id: ERR_LEASE_NOT_FOUND, http_status: 404, message: "Lease does not exist" }
  - { error_id: ERR_PROPOSAL_NOT_FOUND, http_status: 404, message: "TI proposal does not exist" }
  - { error_id: ERR_PROJECT_NOT_FOUND, http_status: 404, message: "Fit-out project does not exist" }
  - { error_id: ERR_PHASE_NOT_FOUND, http_status: 404, message: "Phase package does not exist" }
  - { error_id: ERR_RESERVATION_NOT_FOUND, http_status: 404, message: "Capacity reservation does not exist" }
  - { error_id: ERR_PERMIT_NOT_FOUND, http_status: 404, message: "Hazardous material use permit does not exist" }
  - { error_id: ERR_AMENITY_NOT_FOUND, http_status: 404, message: "Shared amenity does not exist" }
  - { error_id: ERR_ALLOCATION_NOT_FOUND, http_status: 404, message: "Amenity allocation does not exist" }
  - { error_id: ERR_COMMISSIONING_RECORD_NOT_FOUND, http_status: 404, message: "Commissioning record does not exist" }
  - { error_id: ERR_STALE_BUILDING_VERSION, http_status: 412, message: "expected_building_version does not match the building's current version" }
  - { error_id: ERR_STALE_LEASE_VERSION, http_status: 412, message: "expected_lease_version does not match the lease's current version" }
  - { error_id: ERR_INVALID_BUILDING_STATE, http_status: 409, message: "The building's suitability_state does not permit this operation" }
  - { error_id: ERR_INVALID_ASSESSMENT_STATE, http_status: 409, message: "The assessment's status does not permit this operation" }
  - { error_id: ERR_ASSESSMENT_ALREADY_OPEN, http_status: 409, message: "An assessment for this building is already in progress" }
  - { error_id: ERR_RETURN_NOTE_REQUIRED, http_status: 422, message: "A return_note is required when returning an assessment" }
  - { error_id: ERR_INVALID_SCOPE_ITEM_STATE, http_status: 409, message: "The conversion scope item is already complete" }
  - { error_id: ERR_DUPLICATE_SCOPE_DISCIPLINE, http_status: 409, message: "A conversion scope item already exists for this discipline" }
