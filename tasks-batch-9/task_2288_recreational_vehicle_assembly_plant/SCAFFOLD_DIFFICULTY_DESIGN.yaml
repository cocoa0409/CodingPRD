  - rule_id: cross_entity_state_dependency
    instances:

      - name: release_to_line_depends_on_dealer_status_not_on_order_state
        grounds:
          - state_machines.UnitOrder.SLOTTED_to_IN_PRODUCTION
          - entities.Dealer.fields.status
          - endpoints["POST /dealers/{id}/status"]
          - errors.ERR_DEALER_SUSPENDED
          - validations[priority 7]
        distinguishing_aspect: |
          The entity pair is UnitOrder depending on Dealer: the order is perfectly
          SLOTTED with a MATCHED chassis and a RESERVED slot, and the only thing
          that changes between the rejection and the success is the Dealer row's
          status field.
