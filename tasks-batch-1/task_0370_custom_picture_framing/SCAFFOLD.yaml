# =============================================================================
# Custom Picture Framing — benchmark seed tables (SCAFFOLD.yaml, §1.0–§1.7)
# Expert difficulty.
# =============================================================================

scenario: |
  Custom Picture Framing: artwork intake & measure, mat/glass/molding selection & price,
  conservation/mounting option, order & turnaround, deposit, ready notification, reorder,
  fragile handling

domain_name: custom-picture-framing
api_prefix: ""

# =============================================================================
# Complexity profile (§0.1–§0.4) — Expert tier
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # quote estimate (nominal/sum-then-round) vs final invoice (measured/round-per-line)
    - cascading_side_effects          # deposit -> order status -> production schedule -> notification
    - derived_field_reconciliation    # order balance_due / amount_paid ledger; customer risk scores
    - optimistic_concurrency          # FrameLine add against FramingOrder.version (CREATE-with-supersede)

  entity_topology: flat
  # flat: peer entities linked by foreign keys; FramingOrder is the hub, FrameLine/Payment/
  # ProductionTask/Notification reference it by FK; Customer is an independent peer.

  state_machine_shape: parallel
  # FramingOrder carries two independent dimensions: production_status (intake pipeline,
  # branching with revert + reorder cycle) and payment_status (deposit/ledger). ProductionTask
  # adds a third linear machine. FrameLine adds a branching measurement machine.

  relationship_patterns:
    - one_to_many        # FramingOrder -> FrameLine, Payment, ProductionTask, Notification
    - cross_aggregate    # ProductionTask references Workbench (a shared scheduling resource)

  role_model: peer_roles
  # FrameDesigner owns intake/measure/quote, FrameProductionTech owns production scheduling,
  # FrontDeskClerk owns deposits/notification/pickup, Customer is entity-backed (own orders).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation", default: 1 }
      - { name: full_name, type: string, source: input, description: "Customer display name" }
      - { name: email, type: string, source: input, description: "Contact email; used for ready notification" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: loyalty_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | PREFERRED | TRADE; drives loyalty_discount_pct", constraints: "one of STANDARD, PREFERRED, TRADE" }
      - { name: loyalty_discount_pct, type: number, source: computed, description: "Derived from loyalty_tier: STANDARD->0.00, PREFERRED->0.10, TRADE->0.15" }
      - { name: open_order_count, type: integer, source: computed, description: "Count of this customer's FramingOrders whose production_status NOT IN {PICKED_UP, CANCELLED}", default: 0 }
      - { name: no_show_risk_score, type: integer, source: computed, description: "Forward-looking projected risk over open orders (calc forward_no_show_risk), 0..100", default: 0 }
      - { name: settled_reputation_score, type: integer, source: computed, description: "Chronological replay over completed-order history (calc settled_reputation), 0..100", default: 50 }

  # ---------------------------------------------------------------------------
  - name: Workbench
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation", default: 1 }
      - { name: bench_name, type: string, source: input, description: "Workbench label" }
      - { name: bench_type, type: enum, source: input, description: "ASSEMBLY | GLASS_CUTTING; GLASS_CUTTING benches enforce a clean-handling buffer", constraints: "one of ASSEMBLY, GLASS_CUTTING" }
      - { name: clean_buffer_minutes, type: integer, source: input, default: 0, description: "Required idle buffer before/after a job on this bench; for GLASS_CUTTING the buffer is enforced (fragile/glass handling)" }

  # ---------------------------------------------------------------------------
  - name: FramingOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; tie-break key for chronological calcs" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation; OCC parent for FrameLine add", default: 1 }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owning customer" }
      - { name: reorder_of_order_id, type: string, source: input, default: null, description: "FK -> FramingOrder.id; set when this order was cloned from a prior PICKED_UP order via reorder, else null" }
      - { name: rush_requested, type: boolean, source: input, default: false, description: "If true a rush surcharge is applied to estimate and final invoice" }
      - { name: deposit_pct, type: number, source: input, default: 0.30, description: "Requested deposit fraction of estimate_total; floored upward for fragile orders (see deposit calc)", constraints: "0.10 <= deposit_pct <= 1.00" }
      - { name: production_status, type: enum, source: system, description: "INTAKE | QUOTED | IN_PRODUCTION | READY | PICKED_UP | CANCELLED; production dimension", constraints: "one of INTAKE, QUOTED, IN_PRODUCTION, READY, PICKED_UP, CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "UNBILLED | DEPOSIT_DUE | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED; payment dimension, independent of production_status", constraints: "one of UNBILLED, DEPOSIT_DUE, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED" }
      - { name: has_fragile_line, type: boolean, source: computed, description: "True iff any non-VOID FrameLine has glass_type==MUSEUM OR is_fragile==true; drives deposit floor and glass-cutting bench requirement", default: false }
      - { name: estimate_total, type: number, source: computed, description: "Quote estimate over nominal intake dims (calc quote_estimate_total); set/refreshed by QUOTE; 2 dp", default: 0 }
      - { name: deposit_required, type: number, source: computed, description: "Deposit amount due (calc deposit_required); 2 dp", default: 0 }
      - { name: final_invoice_total, type: number, source: computed, description: "Final price over measured dims with round-per-line discount allocation (calc final_invoice_total); set when READY; 2 dp", default: 0 }
      - { name: amount_paid, type: number, source: computed, description: "Sum of Payment.amount for APPLIED payments minus APPLIED refunds; 2 dp", default: 0 }
      - { name: balance_due, type: number, source: computed, description: "final_invoice_total - amount_paid when set, else estimate_total - amount_paid; 2 dp", default: 0 }
      - { name: turnaround_days, type: integer, source: computed, description: "Promised turnaround: BASE_TURNAROUND_DAYS, halved (ceil) if rush_requested, +extra if has_fragile_line (calc turnaround_days)", default: 0 }

  # ---------------------------------------------------------------------------
  - name: FrameLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; allocation/processing order for the order's lines" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation", default: 1 }
      - { name: order_id, type: string, source: input, description: "FK -> FramingOrder.id; owning order" }
      - { name: artwork_label, type: string, source: input, description: "Short description of the artwork piece" }
      - { name: nominal_width_in, type: number, source: input, description: "Customer-stated artwork width at intake (inches); used for estimate", constraints: "> 0" }
      - { name: nominal_height_in, type: number, source: input, description: "Customer-stated artwork height at intake (inches); used for estimate", constraints: "> 0" }
      - { name: measured_width_in, type: number, source: input, default: null, description: "Bench-measured width (inches); set by MEASURE; used for final invoice", constraints: "> 0 when set" }
      - { name: measured_height_in, type: number, source: input, default: null, description: "Bench-measured height (inches); set by MEASURE; used for final invoice", constraints: "> 0 when set" }
      - { name: mat_border_in, type: number, source: input, default: 2, description: "Mat reveal added to each side of artwork (inches)", constraints: ">= 0" }
      - { name: mat_layers, type: integer, source: input, default: 1, description: "Number of stacked mat boards", constraints: ">= 1" }
      - { name: glass_type, type: enum, source: input, default: "REGULAR", description: "REGULAR | CONSERVATION | MUSEUM; MUSEUM marks the line fragile", constraints: "one of REGULAR, CONSERVATION, MUSEUM" }
      - { name: molding_rate_per_ui, type: number, source: input, description: "Molding price per united inch (dollars)", constraints: ">= 0" }
      - { name: mounting_type, type: enum, source: input, default: "NONE", description: "NONE | PLAIN | DRY_MOUNT | CONSERVATION_HINGE; adds a flat mounting upcharge", constraints: "one of NONE, PLAIN, DRY_MOUNT, CONSERVATION_HINGE" }
      - { name: conservation_package, type: boolean, source: input, default: false, description: "If true applies CONSERVATION_MULT to materials (mat+glass)" }
      - { name: is_fragile, type: boolean, source: input, default: false, description: "Explicit fragile flag (e.g. antique/glass art); MUSEUM glass also implies fragile" }
      - { name: line_status, type: enum, source: system, description: "DRAFT | MEASURED | VOID; measurement dimension", constraints: "one of DRAFT, MEASURED, VOID" }
      - { name: estimate_subtotal, type: number, source: computed, description: "Per-line estimate cost over nominal dims (calc line_cost variant=NOMINAL); 2 dp", default: 0 }
      - { name: final_subtotal, type: number, source: computed, description: "Per-line final cost over measured dims (calc line_cost variant=MEASURED); set by MEASURE; 2 dp", default: 0 }

  # ---------------------------------------------------------------------------
  - name: ProductionTask
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation", default: 1 }
      - { name: order_id, type: string, source: input, description: "FK -> FramingOrder.id; the order this task builds" }
      - { name: workbench_id, type: string, source: input, description: "FK -> Workbench.id; the bench reserved for this task" }
      - { name: start_minute, type: integer, source: input, description: "Reservation start as absolute minute offset (integer)", constraints: ">= 0" }
      - { name: end_minute, type: integer, source: input, description: "Reservation end as absolute minute offset; half-open interval [start_minute, end_minute)", constraints: "> start_minute" }
      - { name: task_status, type: enum, source: system, description: "SCHEDULED | COMPLETED | RELEASED; RELEASED frees the interval", constraints: "one of SCHEDULED, COMPLETED, RELEASED" }

  # ---------------------------------------------------------------------------
  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; ledger replay order" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation", default: 1 }
      - { name: order_id, type: string, source: input, description: "FK -> FramingOrder.id; the order this payment applies to" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | BALANCE | REFUND; REFUND reverses prior APPLIED payments", constraints: "one of DEPOSIT, BALANCE, REFUND" }
      - { name: amount, type: number, source: input, description: "Positive dollar amount (refunds also positive; sign handled by kind)", constraints: "> 0, 2 dp" }
      - { name: payment_status, type: enum, source: system, description: "APPLIED | VOID; VOID excluded from ledger", constraints: "one of APPLIED, VOID" }

  # ---------------------------------------------------------------------------
  - name: Notification
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; append-only" }
      - { name: order_id, type: string, source: input, description: "FK -> FramingOrder.id; the order the notification concerns" }
      - { name: channel, type: enum, source: system, description: "EMAIL | SMS; chosen from customer contact at send time", constraints: "one of EMAIL, SMS" }
      - { name: kind, type: enum, source: system, description: "READY | DEPOSIT_RECEIPT; READY emitted on transition to READY, DEPOSIT_RECEIPT on deposit application", constraints: "one of READY, DEPOSIT_RECEIPT" }
      - { name: sent_to, type: string, source: system, description: "Email or phone copied from Customer at emission time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- FramingOrder production dimension (branching + revert + reorder cycle) ----
  - entity: FramingOrder
    field: production_status
    initial_state: INTAKE
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: INTAKE
        to: QUOTED
        trigger: "POST /framing-orders/{orderId}/quote"
        actor: FrameDesigner
        preconditions:
          - "Order has >= 1 FrameLine that is not VOID (ERR_NO_LINES)"
        side_effects:
          - "Run calc quote_estimate_total -> set FramingOrder.estimate_total"
          - "Run calc deposit_required -> set FramingOrder.deposit_required"
          - "Run calc turnaround_days -> set FramingOrder.turnaround_days"
          - "Recompute has_fragile_line"
          - "Recompute balance_due (= estimate_total - amount_paid)"
          - "If payment_status == UNBILLED -> payment_status = DEPOSIT_DUE"
          - "increments FramingOrder.version by 1"

      - from: QUOTED
        to: INTAKE
        trigger: "POST /framing-orders/{orderId}/reopen-intake"
        actor: FrameDesigner
        preconditions:
          - "payment_status IN {UNBILLED, DEPOSIT_DUE} — no deposit has been paid (ERR_DEPOSIT_ALREADY_PAID)"
        side_effects:
          - "Allows further FrameLine add/measure edits (revision loop)"
          - "increments FramingOrder.version by 1"
        note: "Revision loop INTAKE<->QUOTED; revert blocked once deposit paid."

      - from: QUOTED
        to: IN_PRODUCTION
        trigger: "POST /framing-orders/{orderId}/start-production"
        actor: FrameProductionTech
        preconditions:
          - "payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} — deposit (or full) collected (ERR_DEPOSIT_NOT_PAID)"
          - "Every non-VOID FrameLine.line_status == MEASURED (ERR_LINES_NOT_MEASURED)"
        side_effects:
          - "increments FramingOrder.version by 1"

      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /framing-orders/{orderId}/mark-ready"
        actor: FrameProductionTech
        preconditions:
          - "Every ProductionTask for this order has task_status == COMPLETED (ERR_TASKS_INCOMPLETE)"
        side_effects:
          - "Run calc final_invoice_total -> set FramingOrder.final_invoice_total"
          - "Recompute balance_due (= final_invoice_total - amount_paid)"
          - "If payment_status == DEPOSIT_PAID -> payment_status = DEPOSIT_PAID (unchanged); balance now owed"
          - "Emit Notification kind=READY to customer (cross-entity append)"
          - "increments FramingOrder.version by 1"

      - from: READY
        to: PICKED_UP
        trigger: "POST /framing-orders/{orderId}/pickup"
        actor: FrontDeskClerk
        preconditions:
          - "payment_status == PAID_IN_FULL — balance fully collected (ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "Recompute owning Customer.open_order_count (this order leaves the open set)"
          - "Recompute owning Customer.no_show_risk_score (forward set shrinks)"
          - "Append ONTIME outcome to Customer settled history -> recompute Customer.settled_reputation_score"
          - "increments FramingOrder.version by 1"
        note: "Cascade origin A: pickup -> Customer.open_order_count -> Customer.no_show_risk_score (depth 3 via chained recompute)."

      - from: [INTAKE, QUOTED, IN_PRODUCTION, READY]
        to: CANCELLED
        trigger: "POST /framing-orders/{orderId}/cancel"
        actor: FrontDeskClerk
        preconditions: []
        side_effects:
          - "All SCHEDULED/COMPLETED ProductionTasks for this order -> RELEASED (frees workbench intervals)"
          - "If amount_paid > 0: create system Payment kind=REFUND amount=amount_paid status=APPLIED -> recompute amount_paid -> recompute balance_due; payment_status = REFUNDED"
          - "Recompute owning Customer.open_order_count (order leaves open set)"
          - "Recompute owning Customer.no_show_risk_score"
          - "Append ABANDON outcome to Customer settled history -> recompute Customer.settled_reputation_score"
          - "increments FramingOrder.version by 1"
        note: "Cascade origin B: cancel -> Payment(refund) -> order.amount_paid -> order.balance_due (depth 3 via chained ledger recompute)."

  # ---- FramingOrder payment dimension (parallel, independent of production_status) ----
  - entity: FramingOrder
    field: payment_status
    initial_state: UNBILLED
    terminal_states: [REFUNDED]
    transitions:
      - from: UNBILLED
        to: DEPOSIT_DUE
        trigger: "system (set by QUOTE side-effect when payment_status==UNBILLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEPOSIT_DUE
        to: DEPOSIT_PAID
        trigger: "POST /framing-orders/{orderId}/payments (kind=DEPOSIT)"
        actor: FrontDeskClerk
        preconditions:
          - "Payment.amount >= FramingOrder.deposit_required (ERR_DEPOSIT_TOO_LOW)"
          - "production_status IN {QUOTED} — order has an active quote (ERR_NOT_QUOTED)"
        side_effects:
          - "Recompute FramingOrder.amount_paid and balance_due"
          - "Emit Notification kind=DEPOSIT_RECEIPT to customer"

      - from: [DEPOSIT_PAID, DEPOSIT_DUE]
        to: PAID_IN_FULL
        trigger: "POST /framing-orders/{orderId}/payments (kind=BALANCE)"
        actor: FrontDeskClerk
        preconditions:
          - "After applying this payment, amount_paid >= effective_total (final_invoice_total if set else estimate_total) (ERR_PAYMENT_INSUFFICIENT)"
        side_effects:
          - "Recompute FramingOrder.amount_paid and balance_due"
        note: "BALANCE may be paid before READY only if it covers estimate_total; otherwise pay after final_invoice_total is set."

      - from: [DEPOSIT_PAID, PAID_IN_FULL, DEPOSIT_DUE]
        to: REFUNDED
        trigger: "system (set by order CANCEL side-effect when amount_paid>0)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- FrameLine measurement dimension (branching: DRAFT->MEASURED, DRAFT->VOID) ----
  - entity: FrameLine
    field: line_status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /frame-lines/{lineId}/measure"
        actor: FrameDesigner
        preconditions:
          - "Owning FramingOrder.production_status IN {INTAKE, QUOTED} (ERR_ORDER_NOT_EDITABLE)"
          - "measured_width_in > 0 AND measured_height_in > 0 (ERR_INVALID_DIMENSIONS)"
        side_effects:
          - "Set measured_width_in, measured_height_in"
          - "Run calc line_cost variant=MEASURED -> set final_subtotal"
          - "increments FrameLine.version by 1"

      - from: DRAFT
        to: VOID
        trigger: "POST /frame-lines/{lineId}/void"
        actor: FrameDesigner
        preconditions:
          - "Owning FramingOrder.production_status IN {INTAKE, QUOTED} (ERR_ORDER_NOT_EDITABLE)"
        side_effects:
          - "Recompute owning order has_fragile_line"
          - "increments FrameLine.version by 1"

  # ---- ProductionTask (linear) ----
  - entity: ProductionTask
    field: task_status
    initial_state: SCHEDULED
    terminal_states: [RELEASED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /production-tasks/{taskId}/complete"
        actor: FrameProductionTech
        preconditions:
          - "Owning FramingOrder.production_status == IN_PRODUCTION (ERR_ORDER_NOT_IN_PRODUCTION)"
        side_effects: []

      - from: [SCHEDULED, COMPLETED]
        to: RELEASED
        trigger: "system (order cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Frees the [start_minute, end_minute) interval on the workbench"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: frame-line-add-stale-order
    parent_entity: FramingOrder
    write_endpoint: "POST /framing-orders/{orderId}/frame-lines"
    occ_field: "expected_order_version"
    description: |
      Adding a FrameLine to a FramingOrder whose version has advanced since the
      client last observed it is rejected on stale version. A line add legitimately
      supersedes the prior quote snapshot (it changes the line set the estimate is
      computed from), so a writer holding a stale view of the order must re-read
      before adding; the stale add is rejected with a precondition-failed status.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_cost
    trigger: "FrameLine create (variant=NOMINAL -> estimate_subtotal); MEASURE transition (variant=MEASURED -> final_subtotal); QUOTE recomputes NOMINAL for all non-VOID lines"
    algorithm: tiered_pricing
    formula: |
      Inputs per line: (w, h) = the variant's dimensions, mat_border_in, mat_layers,
        glass_type, molding_rate_per_ui, mounting_type, conservation_package.
      outer_w = w + 2*mat_border_in
      outer_h = h + 2*mat_border_in
      united_inches (ui) = outer_w + outer_h
      area_sqft = (outer_w * outer_h) / 144.0
      molding_cost = round2( ui * molding_rate_per_ui )
      mat_cost     = round2( area_sqft * MAT_RATE_PER_SQFT * mat_layers )
      glass_cost   = round2( area_sqft * GLASS_RATE[glass_type] )
      # oversize surcharge: tiered on ui, only the highest crossed tier applies (not additive)
      if ui >= UI_TIER2: oversize = OVERSIZE_TIER2
      elif ui >= UI_TIER1: oversize = OVERSIZE_TIER1
      else: oversize = 0.00
      mount_cost = MOUNT_UPCHARGE[mounting_type]
      materials = mat_cost + glass_cost
      if conservation_package: materials = round2( materials * CONSERVATION_MULT )
      line_subtotal = round2( molding_cost + materials + oversize + mount_cost + LABOR_PER_LINE )
    input_set: "A single FrameLine; NOMINAL variant uses nominal_*; MEASURED variant uses measured_* (must be set)."
    constants:
      MAT_RATE_PER_SQFT: 6.00
      GLASS_RATE: { REGULAR: 4.00, CONSERVATION: 9.00, MUSEUM: 18.00 }
      UI_TIER1: 80
      OVERSIZE_TIER1: 40.00
      UI_TIER2: 120
      OVERSIZE_TIER2: 95.00
      MOUNT_UPCHARGE: { NONE: 0.00, PLAIN: 15.00, DRY_MOUNT: 35.00, CONSERVATION_HINGE: 55.00 }
      CONSERVATION_MULT: 1.20
      LABOR_PER_LINE: 45.00
    precision: "2 decimal places, round_half_up; oversize tiers are non-additive (highest crossed only)"
    variants:
      - name: NOMINAL
        when: "estimate_subtotal on line create and on QUOTE"
        difference: "uses nominal_width_in / nominal_height_in"
      - name: MEASURED
        when: "final_subtotal on MEASURE; feeds final_invoice_total"
        difference: "uses measured_width_in / measured_height_in (differs from nominal -> different cost)"

  - name: quote_estimate_total
    trigger: "QUOTE transition (INTAKE->QUOTED)"
    algorithm: aggregation
    formula: |
      lines = FrameLines of this order with line_status != VOID, ordered by created_at ASC
      raw = sum( line.estimate_subtotal for line in lines )      # NOMINAL variant
      if rush_requested: rushed = raw * (1 + RUSH_PCT) else rushed = raw
      disc = customer.loyalty_discount_pct
      # ESTIMATE pins SUM-THEN-ROUND: apply discount to the summed total, round once at the end
      estimate_total = round2( rushed * (1 - disc) )
    input_set: "Non-VOID FrameLines of the order; loyalty_discount_pct from the owning Customer."
    constants:
      RUSH_PCT: 0.15
    precision: "2 decimal places, round_half_up; SUM-THEN-ROUND (single final rounding after discount)"

  - name: final_invoice_total
    trigger: "MARK_READY transition (IN_PRODUCTION->READY)"
    algorithm: aggregation
    formula: |
      lines = FrameLines of this order with line_status == MEASURED, ordered by created_at ASC
      disc = customer.loyalty_discount_pct
      # FINAL pins ROUND-PER-LINE-THEN-SUM: apply discount to each line's final_subtotal,
      # round each discounted line to cents, THEN sum; rush surcharge applied to the rounded sum, rounded once.
      discounted_sum = sum( round2( line.final_subtotal * (1 - disc) ) for line in lines )
      if rush_requested: final_invoice_total = round2( discounted_sum * (1 + RUSH_PCT) )
      else: final_invoice_total = round2( discounted_sum )
    input_set: "MEASURED FrameLines of the order; loyalty_discount_pct from the owning Customer."
    constants:
      RUSH_PCT: 0.15
    precision: "2 decimal places, round_half_up; ROUND-PER-LINE-THEN-SUM (per-line discount rounding before summation)"
    variants:
      - name: vs_estimate
        when: "compared against quote_estimate_total for the same order"
        difference: "uses measured dims (vs nominal) AND round-per-line discount allocation (vs sum-then-round); the two totals differ for identical line configs even before measurement drift"

  - name: deposit_required
    trigger: "QUOTE transition (INTAKE->QUOTED)"
    algorithm: threshold
    formula: |
      pct = deposit_pct
      if has_fragile_line and pct < FRAGILE_DEPOSIT_FLOOR_PCT:
        pct = FRAGILE_DEPOSIT_FLOOR_PCT
      raw = round2( estimate_total * pct )
      deposit_required = max( MIN_DEPOSIT, raw )
    input_set: "This order's estimate_total, deposit_pct, has_fragile_line."
    constants:
      FRAGILE_DEPOSIT_FLOOR_PCT: 0.50
      MIN_DEPOSIT: 25.00
    precision: "2 decimal places, round_half_up; floor is a max() against MIN_DEPOSIT (>=, MIN_DEPOSIT itself is acceptable)"

  - name: turnaround_days
    trigger: "QUOTE transition (INTAKE->QUOTED)"
    algorithm: threshold
    formula: |
      base = BASE_TURNAROUND_DAYS
      if rush_requested: base = ceil(base / 2)
      if has_fragile_line: base = base + FRAGILE_EXTRA_DAYS
      turnaround_days = base
    input_set: "This order's rush_requested, has_fragile_line."
    constants:
      BASE_TURNAROUND_DAYS: 14
      FRAGILE_EXTRA_DAYS: 5
    precision: "integer days; rush halving uses ceil so 14->7"

  - name: forward_no_show_risk
    trigger: "Customer create; recomputed on order create/quote/pickup/cancel (forward-looking projection)"
    algorithm: forward_looking
    formula: |
      open_orders  = this customer's FramingOrders with production_status NOT IN {PICKED_UP, CANCELLED}
      ready_unpaid = subset of open_orders with production_status == READY AND payment_status != PAID_IN_FULL
      score = len(open_orders) * OPEN_WEIGHT + len(ready_unpaid) * READY_UNPAID_WEIGHT
      no_show_risk_score = min(RISK_CEILING, score)
    input_set: "All non-terminal orders of the customer (projected; includes READY-but-unpaid as elevated risk)."
    constants:
      OPEN_WEIGHT: 5
      READY_UNPAID_WEIGHT: 15
      RISK_CEILING: 100
    precision: "integer; ceiling clamp at 100"

  - name: settled_reputation
    trigger: "Customer create (=SEED_BASE); recomputed on order pickup (ONTIME) and order cancel (ABANDON)"
    algorithm: chronological
    formula: |
      score = SEED_BASE
      history = settled outcomes for this customer, ordered by the order's terminal-transition created_at ASC
        (each PICKED_UP appends ONTIME; each CANCELLED appends ABANDON)
      for outcome in history (in chronological order):
        if outcome == ONTIME:  score = score - ONTIME_DELTA
        if outcome == ABANDON: score = score + ABANDON_DELTA
        score = clamp(score, FLOOR, CEILING)   # clamp AFTER EACH step (order-sensitive)
      settled_reputation_score = score
    input_set: "Terminal-order outcomes of the customer in chronological order; clamp applied per step so order matters at the floor/ceiling."
    constants:
      SEED_BASE: 50
      ONTIME_DELTA: 10
      ABANDON_DELTA: 20
      FLOOR: 0
      CEILING: 100
    precision: "integer; per-step clamp to [0,100] (chronological replay; out-of-order would mis-clamp)"

  - name: order_ledger
    trigger: "any Payment apply/void/refund; QUOTE; MARK_READY"
    algorithm: aggregation
    formula: |
      applied = Payments of this order with payment_status == APPLIED
      amount_paid = round2( sum(p.amount for p in applied if p.kind in {DEPOSIT, BALANCE})
                            - sum(p.amount for p in applied if p.kind == REFUND) )
      effective_total = final_invoice_total if final_invoice_total > 0 else estimate_total
      balance_due = round2( effective_total - amount_paid )
    input_set: "APPLIED Payments of the order; effective_total switches from estimate to final at MARK_READY."
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per RBAC; for entity-backed Customer, X-User-ID must own the addressed order"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right (orderId, then lineId/taskId/paymentId; customer_id, workbench_id in body)"
    error_id: "ERR_ORDER_NOT_FOUND / ERR_LINE_NOT_FOUND / ERR_TASK_NOT_FOUND / ERR_PAYMENT_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_WORKBENCH_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body ids

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric dims > 0, deposit_pct in [0.10,1.00]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/measure endpoints

  - priority: 5
    category: state
    check: "OCC: expected_order_version equals current FramingOrder.version on FrameLine add"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /framing-orders/{orderId}/frame-lines"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (production_status / payment_status / line_status / task_status preconditions)"
    error_id: "ERR_INVALID_STATE / ERR_ORDER_NOT_EDITABLE / ERR_NOT_QUOTED / ERR_ORDER_NOT_IN_PRODUCTION / ERR_DEPOSIT_ALREADY_PAID"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-entity preconditions: start-production requires every non-VOID line MEASURED; mark-ready requires every ProductionTask COMPLETED; quote requires >=1 non-VOID line"
    error_id: "ERR_LINES_NOT_MEASURED / ERR_TASKS_INCOMPLETE / ERR_NO_LINES"
    http_status: 409
    applies_to: "start-production, mark-ready, quote"

  - priority: 8
    category: business_safety
    check: "Fragile/glass handling: a ProductionTask whose order has_fragile_line MUST reserve a GLASS_CUTTING workbench"
    error_id: ERR_FRAGILE_REQUIRES_GLASS_BENCH
    http_status: 409
    applies_to: "POST /production-tasks"

  - priority: 9
    category: business_temporal
    check: "Workbench interval availability. ASSEMBLY bench: half-open [start,end) overlap with any SCHEDULED/COMPLETED task on the same bench. GLASS_CUTTING bench: buffer-padded overlap — gap to any neighboring task must be >= clean_buffer_minutes"
    error_id: ERR_WORKBENCH_CONFLICT
    http_status: 409
    applies_to: "POST /production-tasks"

  - priority: 10
    category: business_fiscal
    check: "Deposit payment amount >= deposit_required; balance payment must bring amount_paid >= effective_total"
    error_id: "ERR_DEPOSIT_TOO_LOW / ERR_PAYMENT_INSUFFICIENT"
    http_status: 402
    applies_to: "POST /framing-orders/{orderId}/payments"

  - priority: 11
    category: business_fiscal
    check: "Pickup requires payment_status == PAID_IN_FULL (no outstanding balance)"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /framing-orders/{orderId}/pickup"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [FrontDeskClerk, FrameDesigner]
    code: 201
    input: [full_name, email, phone, "loyalty_tier?"]
    output: Customer
    side_effects: ["loyalty_discount_pct derived from loyalty_tier; scores seeded (no_show=0, settled=50)"]

  - method: GET
    path: "/customers"
    description: "List Customers"
    roles: [FrontDeskClerk, FrameDesigner, FrameProductionTech]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a Customer (with recomputed scores)"
    roles: [FrontDeskClerk, FrameDesigner, FrameProductionTech, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/framing-orders"
    description: "List a customer's FramingOrders (FK reverse-reachability for FramingOrder.customer_id)"
    roles: [FrontDeskClerk, FrameDesigner, FrameProductionTech, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FramingOrder[]"
    side_effects: []

  # ---- Workbench ----
  - method: POST
    path: "/workbenches"
    description: "Create a Workbench"
    roles: [FrameProductionTech]
    code: 201
    input: [bench_name, bench_type, "clean_buffer_minutes?"]
    output: Workbench
    side_effects: []

  - method: GET
    path: "/workbenches"
    description: "List Workbenches"
    roles: [FrameProductionTech, FrameDesigner, FrontDeskClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Workbench[]"
    side_effects: []

  - method: GET
    path: "/workbenches/{workbenchId}"
    description: "Get a Workbench"
    roles: [FrameProductionTech, FrameDesigner, FrontDeskClerk]
    code: 200
    input: []
    output: Workbench
    side_effects: []

  - method: GET
    path: "/workbenches/{id}/production-tasks"
    description: "List a workbench's ProductionTasks (FK reverse-reachability for ProductionTask.workbench_id)"
    roles: [FrameProductionTech, FrameDesigner, FrontDeskClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductionTask[]"
    side_effects: []

  # ---- FramingOrder ----
  - method: POST
    path: "/framing-orders"
    description: "Create a FramingOrder (intake) for a customer"
    roles: [FrameDesigner, FrontDeskClerk]
    code: 201
    input: [customer_id, "rush_requested?", "deposit_pct?"]
    output: FramingOrder
    side_effects: ["production_status=INTAKE, payment_status=UNBILLED; recompute Customer.open_order_count and no_show_risk_score"]

  - method: GET
    path: "/framing-orders"
    description: "List FramingOrders, optionally filtered by customer_id (FK reverse-reachability)"
    roles: [FrameDesigner, FrontDeskClerk, FrameProductionTech]
    code: 200
    input: ["customer_id?", "reorder_of_order_id?", "limit?", "offset?"]
    output: "FramingOrder[]"
    side_effects: []

  - method: GET
    path: "/framing-orders/{orderId}"
    description: "Get a FramingOrder (with recomputed derived fields)"
    roles: [FrameDesigner, FrontDeskClerk, FrameProductionTech, Customer]
    code: 200
    input: []
    output: FramingOrder
    side_effects: []

  - method: POST
    path: "/framing-orders/{orderId}/quote"
    description: "Quote the order: INTAKE->QUOTED, compute estimate/deposit/turnaround"
    roles: [FrameDesigner]
    code: 200
    input: []
    output: FramingOrder
    side_effects: ["estimate_total, deposit_required, turnaround_days, has_fragile_line set; payment_status UNBILLED->DEPOSIT_DUE; version+1"]

  - method: POST
    path: "/framing-orders/{orderId}/reopen-intake"
    description: "Revert QUOTED->INTAKE for revision (blocked once deposit paid)"
    roles: [FrameDesigner]
    code: 200
    input: []
    output: FramingOrder
    side_effects: ["production_status QUOTED->INTAKE; version+1"]

  - method: POST
    path: "/framing-orders/{orderId}/start-production"
    description: "QUOTED->IN_PRODUCTION (requires deposit paid and all lines measured)"
    roles: [FrameProductionTech]
    code: 200
    input: []
    output: FramingOrder
    side_effects: ["production_status QUOTED->IN_PRODUCTION; version+1"]

  - method: POST
    path: "/framing-orders/{orderId}/mark-ready"
    description: "IN_PRODUCTION->READY; compute final_invoice_total; emit READY notification"
    roles: [FrameProductionTech]
    code: 200
    input: []
    output: FramingOrder
    side_effects: ["final_invoice_total set; balance_due recomputed; Notification kind=READY emitted; version+1"]

  - method: POST
    path: "/framing-orders/{orderId}/pickup"
    description: "READY->PICKED_UP (requires PAID_IN_FULL)"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: FramingOrder
    side_effects: ["Customer.open_order_count/no_show_risk_score recomputed; ONTIME appended -> settled_reputation_score recomputed; version+1"]

  - method: POST
    path: "/framing-orders/{orderId}/cancel"
    description: "Cancel order from any non-terminal state; release tasks; refund if paid"
    roles: [FrontDeskClerk]
    code: 200
    input: []
    output: FramingOrder
    side_effects: ["ProductionTasks RELEASED; refund Payment created if amount_paid>0; payment_status->REFUNDED; Customer scores recomputed; ABANDON appended; version+1"]

  - method: POST
    path: "/framing-orders/{orderId}/reorder"
    description: "Clone a PICKED_UP order into a new INTAKE order (reorder); copies non-VOID lines as fresh DRAFT lines"
    roles: [FrameDesigner, FrontDeskClerk]
    code: 201
    input: ["rush_requested?", "deposit_pct?"]
    output: FramingOrder
    side_effects: ["new FramingOrder with reorder_of_order_id=source, production_status=INTAKE, copied DRAFT FrameLines; recompute Customer.open_order_count and no_show_risk_score"]

  # ---- FrameLine ----
  - method: POST
    path: "/framing-orders/{orderId}/frame-lines"
    description: "Add a FrameLine to an order (OCC-guarded on order version)"
    roles: [FrameDesigner]
    code: 201
    input: [expected_order_version, artwork_label, nominal_width_in, nominal_height_in, molding_rate_per_ui, "mat_border_in?", "mat_layers?", "glass_type?", "mounting_type?", "conservation_package?", "is_fragile?"]
    output: FrameLine
    side_effects: ["line_status=DRAFT; estimate_subtotal computed (NOMINAL); order has_fragile_line recomputed; increments FramingOrder.version by 1"]

  - method: GET
    path: "/framing-orders/{id}/frame-lines"
    description: "List an order's FrameLines (FK reverse-reachability for FrameLine.order_id)"
    roles: [FrameDesigner, FrontDeskClerk, FrameProductionTech, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FrameLine[]"
    side_effects: []

  - method: GET
    path: "/frame-lines/{lineId}"
    description: "Get a FrameLine"
    roles: [FrameDesigner, FrontDeskClerk, FrameProductionTech, Customer]
    code: 200
    input: []
    output: FrameLine
    side_effects: []

  - method: POST
    path: "/frame-lines/{lineId}/measure"
    description: "Record measured dims: DRAFT->MEASURED; compute final_subtotal"
    roles: [FrameDesigner]
    code: 200
    input: [measured_width_in, measured_height_in]
    output: FrameLine
    side_effects: ["final_subtotal computed (MEASURED); line_status->MEASURED; version+1"]

  - method: POST
    path: "/frame-lines/{lineId}/void"
    description: "Void a DRAFT line: DRAFT->VOID"
    roles: [FrameDesigner]
    code: 200
    input: []
    output: FrameLine
    side_effects: ["line_status->VOID; order has_fragile_line recomputed; version+1"]

  # ---- ProductionTask ----
  - method: POST
    path: "/production-tasks"
    description: "Schedule a ProductionTask reserving a workbench interval for an order"
    roles: [FrameProductionTech]
    code: 201
    input: [order_id, workbench_id, start_minute, end_minute]
    output: ProductionTask
    side_effects: ["task_status=SCHEDULED after fragile-bench and overlap checks"]

  - method: GET
    path: "/framing-orders/{id}/production-tasks"
    description: "List an order's ProductionTasks (FK reverse-reachability for ProductionTask.order_id)"
    roles: [FrameProductionTech, FrameDesigner, FrontDeskClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductionTask[]"
    side_effects: []

  - method: GET
    path: "/production-tasks/{taskId}"
    description: "Get a ProductionTask"
    roles: [FrameProductionTech, FrameDesigner, FrontDeskClerk]
    code: 200
    input: []
    output: ProductionTask
    side_effects: []

  - method: POST
    path: "/production-tasks/{taskId}/complete"
    description: "Mark a ProductionTask COMPLETED"
    roles: [FrameProductionTech]
    code: 200
    input: []
    output: ProductionTask
    side_effects: ["task_status SCHEDULED->COMPLETED"]

  # ---- Payment ----
  - method: POST
    path: "/framing-orders/{orderId}/payments"
    description: "Apply a Payment (DEPOSIT or BALANCE) to an order; drives payment_status"
    roles: [FrontDeskClerk]
    code: 201
    input: [kind, amount]
    output: Payment
    side_effects: ["payment_status APPLIED; order amount_paid/balance_due recomputed; payment_status transition; DEPOSIT emits DEPOSIT_RECEIPT notification"]

  - method: GET
    path: "/framing-orders/{id}/payments"
    description: "List an order's Payments (FK reverse-reachability for Payment.order_id)"
    roles: [FrontDeskClerk, FrameDesigner, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a Payment"
    roles: [FrontDeskClerk, FrameDesigner, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ---- Notification ----
  - method: GET
    path: "/framing-orders/{id}/notifications"
    description: "List an order's Notifications (FK reverse-reachability for Notification.order_id)"
    roles: [FrontDeskClerk, FrameDesigner, FrameProductionTech, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Notification[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for operation, or Customer acting on an order it does not own" }
  # --- Not found ---
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "FramingOrder id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "FrameLine id does not exist" }
  - { id: ERR_TASK_NOT_FOUND, http: 404, condition: "ProductionTask id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id (path or body customer_id) does not exist" }
  - { id: ERR_WORKBENCH_NOT_FOUND, http: 404, condition: "Workbench id (path or body workbench_id) does not exist" }
  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, non-positive dimension, or deposit_pct outside [0.10,1.00]" }
  - { id: ERR_INVALID_DIMENSIONS, http: 400, condition: "measured_width_in or measured_height_in not > 0 on MEASURE" }
  # --- OCC ---
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version != current FramingOrder.version on FrameLine add" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_ORDER_NOT_EDITABLE, http: 409, condition: "FrameLine measure/void or add requires order production_status IN {INTAKE, QUOTED}" }
  - { id: ERR_NOT_QUOTED, http: 409, condition: "Deposit payment requires order production_status == QUOTED" }
  - { id: ERR_ORDER_NOT_IN_PRODUCTION, http: 409, condition: "Task complete requires order production_status == IN_PRODUCTION" }
  - { id: ERR_DEPOSIT_ALREADY_PAID, http: 409, condition: "reopen-intake blocked because a deposit has already been paid (payment_status NOT IN {UNBILLED, DEPOSIT_DUE})" }
  - { id: ERR_DEPOSIT_NOT_PAID, http: 409, condition: "start-production requires payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}" }
  - { id: ERR_NOT_PICKED_UP, http: 409, condition: "reorder source order is not in PICKED_UP state" }
  # --- Cross-entity referential ---
  - { id: ERR_NO_LINES, http: 409, condition: "quote requires at least one non-VOID FrameLine" }
  - { id: ERR_LINES_NOT_MEASURED, http: 409, condition: "start-production requires every non-VOID FrameLine to be MEASURED" }
  - { id: ERR_TASKS_INCOMPLETE, http: 409, condition: "mark-ready requires every ProductionTask of the order to be COMPLETED" }
  # --- Safety / fragile ---
  - { id: ERR_FRAGILE_REQUIRES_GLASS_BENCH, http: 409, condition: "Order has_fragile_line but the chosen workbench bench_type != GLASS_CUTTING" }
  # --- Temporal ---
  - { id: ERR_WORKBENCH_CONFLICT, http: 409, condition: "Requested interval overlaps an existing SCHEDULED/COMPLETED task on the workbench (buffer-padded for GLASS_CUTTING)" }
  # --- Fiscal ---
  - { id: ERR_DEPOSIT_TOO_LOW, http: 402, condition: "Deposit payment amount < deposit_required" }
  - { id: ERR_PAYMENT_INSUFFICIENT, http: 402, condition: "Balance payment does not bring amount_paid up to effective_total" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 402, condition: "pickup attempted while payment_status != PAID_IN_FULL" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FrameDesigner
    description: "Handles artwork intake, line add/measure/void, quoting, reorder cloning"
    identity: "opaque"
    exclusive_operations:
      - "POST /framing-orders/{orderId}/quote — Quote order"
      - "POST /framing-orders/{orderId}/reopen-intake — Revert to intake"
      - "POST /framing-orders/{orderId}/frame-lines — Add line (OCC)"
      - "POST /frame-lines/{lineId}/measure — Measure line"
      - "POST /frame-lines/{lineId}/void — Void line"
    shared_operations:
      - "POST /customers — Create customer (with FrontDeskClerk)"
      - "POST /framing-orders — Create order (with FrontDeskClerk)"
      - "POST /framing-orders/{orderId}/reorder — Reorder (with FrontDeskClerk)"
      - "GET endpoints — read orders, lines, customers, workbenches, tasks, payments, notifications"

  - name: FrameProductionTech
    description: "Schedules and completes production tasks, manages workbenches, drives production lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /workbenches — Create workbench"
      - "POST /production-tasks — Schedule task"
      - "POST /production-tasks/{taskId}/complete — Complete task"
      - "POST /framing-orders/{orderId}/start-production — Start production"
      - "POST /framing-orders/{orderId}/mark-ready — Mark ready"
    shared_operations:
      - "GET endpoints — read orders, lines, workbenches, tasks, notifications"

  - name: FrontDeskClerk
    description: "Handles deposits/payments, pickup, cancellation, ready/receipt notifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /framing-orders/{orderId}/payments — Apply payment"
      - "POST /framing-orders/{orderId}/pickup — Pickup"
