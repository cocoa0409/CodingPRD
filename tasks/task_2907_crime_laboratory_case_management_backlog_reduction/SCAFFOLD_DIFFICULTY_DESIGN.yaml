            - call: "POST /lab/cases"
              payload: { agency_case_number: "H-2026-0809", submitting_agency: "METRO PD", offense_category: "HOMICIDE", suspect_in_custody: true, statutory_deadline_utc: "2026-08-20T00:00:00Z" }
              as: EvidenceTechnician
              captures: { cp1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${cp1}", item_number: "1", item_description: "Sealed residue swab", item_type: "CHEMICAL", seal_intact: true }
