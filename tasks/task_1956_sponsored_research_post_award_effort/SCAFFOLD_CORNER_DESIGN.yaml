          trigger:
            - { call: "POST /api/effort-statements/${st}/certify", payload: { certified_effort_pct: 10.0, expected_effort_statement_version: "${stv}" }, as: PrincipalInvestigator, as_user_id: "${pa}", captures: { err: $.data.error_id } }
            - { call: "GET /api/effort-statements/${st}", as: GrantsAccountant, captures: { stv2: $.data.version } }
            - { call: "POST /api/effort-statements/${st}/certify", payload: { certified_effort_pct: 10.0, expected_effort_statement_version: "${stv2}", payroll_adjustment_note: "payroll reallocation journal pending" }, as: PrincipalInvestigator, as_user_id: "${pa}", captures: { okst: $.data.status, varp: $.data.variance_pp, keyflag: $.data.key_reduction_flag } }
          assert:
            - "err == ERR_VARIANCE_NOTE_REQUIRED  (|10.00 - 3.47| = 6.53 > 5.00)"
            - "okst == CERTIFIED and varp == 6.53"
