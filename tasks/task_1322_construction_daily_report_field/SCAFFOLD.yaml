        side_effects: ["increments DeliveryZone.version by 1"]

  - entity: DailyReport
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /daily-reports/{id}/submit"
        actor: Superintendent
        preconditions:
          - "status == DRAFT (ERR_REPORT_INVALID_TRANSITION)"
          - "Project.status == ACTIVE (ERR_PROJECT_NOT_ACTIVE)"
          - "report_date is not after the logical clock's current date (ERR_REPORT_DATE_FUTURE)"
          - "at least one WeatherObservation exists on the report (ERR_WEATHER_MISSING)"
          - "exactly one of: >= 1 ACTIVE CrewEntry, or no_work_performed == true (ERR_NO_WORK_RECORDED / ERR_WORK_ENTRIES_CONFLICT)"
          - "all MaterialDelivery rows on report have status == INSPECTED (ERR_DELIVERY_NOT_INSPECTED)"
          - "no DelayEvent on report has status == RECORDED (ERR_DELAY_EVENT_UNCLASSIFIED)"
        side_effects:
          - "submitted_by_user_id = X-User-ID; submitted_at = logical now"
          - "content_posture recomputes to SEALED"
          - "increments DailyReport.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /daily-reports/{id}/start-review"
        actor: ProjectManager
        preconditions: ["status == SUBMITTED (ERR_REPORT_INVALID_TRANSITION)"]
        side_effects: ["increments DailyReport.version by 1"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /daily-reports/{id}/recall"
        actor: Superintendent
        preconditions:
          - "status == SUBMITTED (ERR_REPORT_INVALID_TRANSITION)"
          - "X-User-ID == submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["content_posture recomputes to EDITABLE", "increments DailyReport.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /daily-reports/{id}/approve"
        actor: ProjectManager
        preconditions:
          - "status == UNDER_REVIEW (ERR_REPORT_INVALID_TRANSITION)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "CASCADE L1: for each WorkItem referenced by ACTIVE QuantityEntry rows on this report, WorkItem.installed_to_date += entry.rounded_quantity (calc_work_item_rollup)"
          - "CASCADE L2: each mutated WorkItem recomputes status (NOT_STARTED | IN_PROGRESS | COMPLETE)"
          - "CASCADE L3: Project.percent_complete_units and percent_complete_cost recompute (calc_progress_percent)"
          - "content_posture recomputes to SEALED"
          - "increments DailyReport.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /daily-reports/{id}/request-revision"
        actor: ProjectManager
        preconditions: ["status == UNDER_REVIEW (ERR_REPORT_INVALID_TRANSITION)"]
        side_effects: ["revision_count += 1", "content_posture recomputes to EDITABLE", "increments DailyReport.version by 1"]
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /daily-reports/{id}/return-to-draft"
        actor: Superintendent
        preconditions: ["status == REVISION_REQUESTED (ERR_REPORT_INVALID_TRANSITION)"]
        side_effects: ["increments DailyReport.version by 1"]
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /daily-reports/{id}/reopen"
        actor: ProjectManager
        preconditions: ["status == APPROVED (ERR_REPORT_INVALID_TRANSITION)"]
        side_effects:
          - "COMPENSATION L1: for each WorkItem referenced by ACTIVE QuantityEntry rows on this report, WorkItem.installed_to_date -= entry.rounded_quantity (undoes approve rollup exactly)"
          - "COMPENSATION L2: each mutated WorkItem recomputes status"
          - "COMPENSATION L3: Project percent fields recompute"
          - "increments DailyReport.version by 1"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /daily-reports/{id}/lock"
        actor: SystemAdmin
        preconditions: ["status == APPROVED (ERR_REPORT_INVALID_TRANSITION)"]
        side_effects: ["retention_release_date finalized per calc_retention_release", "increments DailyReport.version by 1"]

