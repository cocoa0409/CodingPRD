  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pasrr_referential_beats_qualifying_safety_on_activate
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_PASRR_NOT_CLEARED]
          - errors[ERR_QUALIFYING_STAY_NOT_MET]
        distinguishing_aspect: |
          Category pair business_referential (priority 6, ERR_PASRR_NOT_CLEARED) vs
          business_safety (priority 7, ERR_QUALIFYING_STAY_NOT_MET): an activate that violates
          BOTH (PASRR still PENDING AND no qualifying stay) must return the priority-6
          ERR_PASRR_NOT_CLEARED, not the priority-7 safety error.
        test_recipe:
          setup:
            - "Medicare admission whose PASRR is still PENDING and which has no qualifying stay linked"
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "PVQ SNF", cms_certification_number: "CCN-PVQ1", certified_bed_count: 5 }
