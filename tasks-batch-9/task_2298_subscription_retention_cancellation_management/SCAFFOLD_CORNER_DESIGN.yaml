      - name: retry_schedule_clamps_to_grace_end_and_marks_the_attempt_final
        claim_type: threshold
        grounds:
          - calculations.dunning_retry_schedule
          - entities.DunningAttempt.fields.backoff_days_applied
          - entities.DunningAttempt.fields.grace_clamped
          - entities.DunningAttempt.fields.is_final
        distinguishing_aspect: |
          With INSUFFICIENT_FUNDS backoffs [1, 3, 5, 7] and a 3-day M0_1 grace window closing
          2026-01-13, attempt 2's raw date 2026-01-11 sits inside the window (scheduled 2026-01-11,
          grace_clamped false) while attempt 3's raw date 2026-01-16 sits strictly after it, so it is
          clamped back to 2026-01-13 and is_final flips true - the threshold is crossed between two
          adjacent attempts of the same invoice.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100); subscriber A subscribed, so tenure bucket M0_1 gives a 3-day base grace."
            - "Attempt 1 was soft-declined with INSUFFICIENT_FUNDS on 2026-01-10, setting first_failed_at 2026-01-10 and grace_end_at 2026-01-13."
            - "Attempt 2 was created, then soft-declined with INSUFFICIENT_FUNDS after the clock moved to 2026-01-11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att1_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SOFT_DECLINE", decline_code: "INSUFFICIENT_FUNDS" }
              as: BillingOperator
          trigger:
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SOFT_DECLINE", decline_code: "INSUFFICIENT_FUNDS" }
              as: BillingOperator
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att3_id: $.data.id }
          assert:
            - "All three write responses have status 201 or 200 as declared"
            - "Subscription.${s_a_id}.first_failed_at == 2026-01-10T00:00:00Z"
            - "Subscription.${s_a_id}.grace_end_at == 2026-01-13T00:00:00Z"
            - "DunningAttempt.${att2_id}.attempt_number == 2"
            - "DunningAttempt.${att2_id}.previous_attempt_id == ${att1_id}"
            - "DunningAttempt.${att2_id}.backoff_days_applied == 1"
            - "DunningAttempt.${att2_id}.scheduled_at == 2026-01-11T00:00:00Z"
            - "DunningAttempt.${att2_id}.grace_clamped == false"
            - "DunningAttempt.${att2_id}.is_final == false"
            - "DunningAttempt.${att3_id}.attempt_number == 3"
            - "DunningAttempt.${att3_id}.backoff_days_applied == 5"
            - "DunningAttempt.${att3_id}.scheduled_at == 2026-01-13T00:00:00Z"
            - "DunningAttempt.${att3_id}.grace_clamped == true"
            - "DunningAttempt.${att3_id}.is_final == true"
            - "Invoice.${inv0_id}.attempt_count == 3"
            - "Subscription.${s_a_id}.consecutive_failed_attempts == 2"

      - name: realized_ltv_ignores_open_invoices_while_projection_still_counts_them
        claim_type: forward_looking
        grounds:
          - calculations.subscriber_lifetime_value
          - entities.Subscriber.fields.realized_ltv_cents
          - entities.Subscriber.fields.projected_ltv_cents
        distinguishing_aspect: |
          While the only invoice is OPEN, realized LTV is exactly 0 but the projection already
          counts that cycle's 2899-cent margin over 13 expected cycles (ORGANIC 0.05 x M0_1 1.6 =
          0.08 -> 12.5 -> 13) for 37687; settling the same invoice moves realized to 2899 and the
          projection to 40586, so the two variants differ by the identical projection term before
          and after payment.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE (4999 / 2100); subscriber A on ORGANIC subscribed, signup invoice OPEN, one PENDING attempt created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
          trigger:
            - call: "GET /subscribers/${sub_a_id}"
              payload: {}
              as: RetentionSpecialist
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SUCCEEDED" }
              as: BillingOperator
            - call: "GET /subscribers/${sub_a_id}"
              payload: {}
              as: RetentionSpecialist
          assert:
            - "Before settlement: Subscriber.${sub_a_id}.realized_ltv_cents == 0"
            - "Before settlement: Subscriber.${sub_a_id}.projected_ltv_cents == 37687"
            - "After settlement: Invoice.${inv0_id}.status == PAID"
            - "After settlement: Subscriber.${sub_a_id}.realized_ltv_cents == 2899"
            - "After settlement: Subscriber.${sub_a_id}.projected_ltv_cents == 40586"
            - "Subscriber.${sub_a_id}.churn_type == NONE"
            - "Subscription.${s_a_id}.billing_state == CURRENT"

      - name: retention_rate_rounds_two_thirds_half_up_to_four_decimals
        claim_type: precision
        grounds:
          - calculations.cohort_retention_metrics
          - entities.RetentionCohortSnapshot.fields.retention_rate
          - entities.RetentionCohortSnapshot.fields.churned_voluntary_count
        distinguishing_aspect: |
          Three members with two retained gives 0.666666..., which must be stored as exactly 0.6667
          (ROUND_HALF_UP at 4 decimals, not truncated to 0.6666), and the one CANCELLED member must
          land in churned_voluntary_count rather than in retained_count.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan BOUND (5000 / 2500, cadence [4], not a negative-option plan)."
            - "Subscribers A, B and C each subscribed to BOUND on 2026-01-10; all three invoices stay OPEN."
            - "C completed a cancellation session (reason PRICE), and the 2026-02-07 renewal run finalised C to CANCELLED with churn VOLUNTARY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "BOUND", name: "Bounded Box", monthly_price_cents: 5000, unit_cogs_cents: 2500, margin_floor_pct: 0.4048, allowed_frequency_weeks: [4], is_negative_option: false }
              as: PlatformAdmin
              captures: { bound_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "b@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_b_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_b_id}", card_last4: "4243", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_b_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_b_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_b_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_b_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_c_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_c_id}", card_last4: "4244", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_c_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_c_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_c_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_c_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_c_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_c_id}"
              captures: { sess_c_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_c_id}/reason"
