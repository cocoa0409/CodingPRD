      - name: inspection_windows_are_closed_and_buffered_so_a_fourteen_day_gap_still_conflicts
        grounds:
          - validations[priority=101]
          - validations[priority=102]
          - errors[ERR_INSPECTION_WINDOW_CONFLICT]
          - state_machines.Project.PLACED_IN_SERVICE_to_STABILIZED
          - endpoints[POST /physical-inspections]
        distinguishing_aspect: |
          DIFFERENT interval semantics from the draw instance: PhysicalInspection
          windows are CLOSED [window_start, window_end] and the new window is
          expanded by INSPECTION_BUFFER_DAYS = 14 on EACH side before being
          compared against the unexpanded existing window. So where draws accept
          touching endpoints, inspections reject a clean 14-day gap in either
          direction - a window starting 2027-06-19 after one ending 2027-06-05
          conflicts because the expansion lands exactly on 2027-06-05, and a
          window ending 2027-05-18 before one starting 2027-06-01 conflicts for
