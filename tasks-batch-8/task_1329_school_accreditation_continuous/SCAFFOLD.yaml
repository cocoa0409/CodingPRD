# =============================================================================
# Scaffold: School Accreditation & Continuous Improvement (Cognia-style)
# Task: task_1329_school_accreditation_continuous
# =============================================================================

scenario: |
  School Accreditation & Continuous Improvement (Cognia style accreditor): standards self-study & evidence collection, stakeholder survey administration, improvement plan goals & progress indicators, visiting team scheduling & report findings, required action items & follow-up timeline, accreditation term & interim reporting, multi-campus/system accreditation scope, fees & renewal cycle

domain_name: school-accreditation
api_prefix: /accreditation

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: InstitutionSystem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the school system / district / network" }
      - { name: system_type, type: enum, source: input, description: "DISTRICT | NETWORK | SINGLE_SCHOOL", constraints: "SINGLE_SCHOOL systems may not create additional Campuses" }
      - { name: accreditation_status, type: enum, source: system, description: "CANDIDATE | ACCREDITED | ON_PROBATION | ACCREDITATION_WITHDRAWN", default: "CANDIDATE" }
      - { name: current_term_id, type: string, source: computed, description: "FK -> AccreditationTerm.id; the AccreditationTerm whose status is ACTIVE; null when no ACTIVE term" }
      - { name: fee_credit_cents, type: integer, source: computed, description: "Ledger of prepaid credits in cents; starts 0; debited by invoice issuance, credited by payments" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Campus
    parent: InstitutionSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> InstitutionSystem.id" }
      - { name: name, type: string, source: input, description: "Campus name" }
      - { name: enrollment, type: integer, source: input, description: "Student enrollment headcount used for fee tiering", constraints: ">= 1" }
      - { name: campus_status, type: enum, source: system, description: "IN_SCOPE | OUT_OF_SCOPE | WITHDRAWN", default: "IN_SCOPE" }
      - { name: composite_index_pct, type: number, source: computed, description: "Weighted mean of campus-level standard ratings, 0.00–100.00, recomputed on any rating change" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Standard
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Public standard code, e.g. 'L1', 'T3'; unique" }
      - { name: title, type: string, source: input, description: "Standard title" }
      - { name: domain, type: enum, source: input, description: "LEADERSHIP | LEARNING | RESOURCES" }
      - { name: weight_pct, type: integer, source: input, description: "Integer percentage weight 1..100 used in composite index; all standards of one domain need not sum to 100 — weights are normalized" }
      - { name: evidence_min_items, type: integer, source: input, description: "Minimum APPROVED evidence items required before a self-study rating can be finalized", constraints: ">= 0" }

  - name: AccreditationTerm
    parent: InstitutionSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> InstitutionSystem.id" }
      - { name: term_start, type: datetime, source: input, description: "Inclusive ISO date of term start" }
      - { name: term_length_years, type: integer, source: input, description: "5 | 6 — Cognia-style 5-year default with 6-year extended option", constraints: "enum {5,6}" }
      - { name: term_end, type: datetime, source: computed, description: "= term_start + term_length_years years, exclusive" }
      - { name: status, type: enum, source: system, description: "PREPARATION | SELF_STUDY | REVIEW | DECISION | TERM_ACTIVE | INTERIM_MONITORING | RENEWAL | CLOSED", default: "PREPARATION" }
      - { name: decision_outcome, type: enum, source: system, description: "NONE | ACCREDITED | ACCREDITED_WITH_STIPULATIONS | DENIED", default: "NONE" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: SelfStudyRating
    parent: AccreditationTerm
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> AccreditationTerm.id" }
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id; scope of this rating" }
      - { name: standard_id, type: string, source: system, description: "FK -> Standard.id" }
      - { name: rating, type: integer, source: input, description: "1..4 rubric score", constraints: "1..4" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FINALIZED | REOPENED", default: "DRAFT" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp when rating became FINALIZED; null otherwise" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: EvidenceItem
    parent: SelfStudyRating
    common_fields: true
    fields:
      - { name: rating_id, type: string, source: system, description: "FK -> SelfStudyRating.id" }
      - { name: title, type: string, source: input, description: "Evidence title" }
      - { name: artifact_uri, type: string, source: input, description: "URI of the stored artifact" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque id of the SchoolLeader who submitted" }
      - { name: review_status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", default: "PENDING" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: SurveyInstrument
    parent: null
    common_fields: true
    fields:
      - { name: stakeholder_group, type: enum, source: input, description: "STUDENTS | PARENTS | STAFF | BOARD" }
      - { name: title, type: string, source: input, description: "Instrument title" }
      - { name: min_participation_pct, type: integer, source: input, description: "Integer 1..100; response-rate threshold for survey validity", constraints: "1..100" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: SurveyWindow
    parent: AccreditationTerm
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> AccreditationTerm.id" }
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id" }
      - { name: instrument_id, type: string, source: system, description: "FK -> SurveyInstrument.id" }
      - { name: opens_at, type: datetime, source: input, description: "Window open instant, inclusive" }
      - { name: closes_at, type: datetime, source: input, description: "Window close instant, exclusive; must be > opens_at" }
      - { name: eligible_count, type: integer, source: input, description: "Population size for participation-rate denominator", constraints: ">= 1" }
      - { name: response_count, type: integer, source: computed, description: "Number of submitted responses in window", default: "0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | INVALIDATED", default: "SCHEDULED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: SurveyResponse
    parent: SurveyWindow
    common_fields: false
    fields:
      - { name: window_id, type: string, source: system, description: "FK -> SurveyWindow.id" }
      - { name: respondent_token, type: string, source: input, description: "Anonymous one-time token; unique per window" }
      - { name: submitted_at, type: datetime, source: system, description: "Server timestamp of submission" }

  - name: ImprovementGoal
    parent: AccreditationTerm
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> AccreditationTerm.id" }
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id; null means system-level goal" }
      - { name: standard_id, type: string, source: system, description: "FK -> Standard.id the goal addresses" }
      - { name: title, type: string, source: input, description: "Goal title" }
      - { name: baseline_value, type: number, source: input, description: "Numeric baseline for the goal metric" }
      - { name: target_value, type: number, source: input, description: "Numeric target for the goal metric" }
      - { name: direction, type: enum, source: input, description: "INCREASE | DECREASE — whether progress means going up or down" }
      - { name: current_value, type: number, source: computed, description: "Latest progress-indicator value; initialized to baseline_value" }
      - { name: attainment_pct, type: number, source: computed, description: "Progress toward target as percentage per direction-aware formula" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ADOPTED | MONITORING | ACHIEVED | ABANDONED", default: "PROPOSED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ProgressIndicator
    parent: ImprovementGoal
    common_fields: true
    fields:
      - { name: goal_id, type: string, source: system, description: "FK -> ImprovementGoal.id" }
      - { name: measured_at, type: datetime, source: input, description: "ISO date of measurement" }
      - { name: value, type: number, source: input, description: "Measured value" }
      - { name: note, type: string, source: input, description: "Free-text annotation", default: "" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: VisitEvent
    parent: AccreditationTerm
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> AccreditationTerm.id" }
      - { name: campus_id, type: string, source: system, description: "FK -> Campus.id being visited; null for system-level visit" }
      - { name: lead_reviewer_id, type: string, source: system, description: "FK -> Reviewer.id designated as chair" }
      - { name: starts_on, type: datetime, source: input, description: "Inclusive visit start date" }
      - { name: ends_on, type: datetime, source: input, description: "Exclusive visit end date; must be > starts_on" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | IN_FIELD | REPORT_DRAFT | REPORT_ISSUED | CANCELLED", default: "REQUESTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Reviewer name" }
      - { name: email, type: string, source: input, description: "Reviewer email; unique" }
      - { name: reviewer_status, type: enum, source: system, description: "AVAILABLE | ON_ASSIGNMENT | INACTIVE", default: "AVAILABLE" }
      - { name: conflict_system_ids, type: array, source: input, description: "List of InstitutionSystem ids this reviewer is conflicted for", default: "[]" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: VisitAssignment
    parent: VisitEvent
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> VisitEvent.id" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Reviewer.id" }
      - { name: role_on_team, type: enum, source: input, description: "CHAIR | MEMBER | OBSERVER" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: VisitFinding
    parent: VisitEvent
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> VisitEvent.id" }
      - { name: standard_id, type: string, source: system, description: "FK -> Standard.id" }
      - { name: severity, type: enum, source: input, description: "COMMENDATION | RECOMMENDATION | REQUIRED_ACTION" }
      - { name: follow_up_months, type: integer, source: input, description: "Required when severity == REQUIRED_ACTION; months allowed from visit end for the resulting action item; 6 | 12 | 18", constraints: "enum {6,12,18}; required iff severity == REQUIRED_ACTION" }
      - { name: narrative, type: string, source: input, description: "Finding narrative" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | SUPERSEDED", default: "DRAFT" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: RequiredActionItem
    parent: VisitFinding
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: system, description: "FK -> VisitFinding.id" }
      - { name: description, type: string, source: input, description: "What must be done" }
      - { name: due_date, type: datetime, source: computed, description: "= parent VisitEvent.ends_on + follow_up_months months, per term policy" }
      - { name: follow_up_months, type: integer, source: system, description: "Months allowed from visit end; copied from the parent VisitFinding.follow_up_months at cascade creation; 6 | 12 | 18", constraints: "enum {6,12,18}" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED | VERIFIED | OVERDUE | WAIVED", default: "OPEN" }
      - { name: verified_by_user_id, type: string, source: system, description: "Reviewer user id who verified; null until VERIFIED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: InterimReport
    parent: AccreditationTerm
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> AccreditationTerm.id" }
      - { name: report_year, type: integer, source: input, description: "1..(term_length_years-1); which interim year this report covers" }
      - { name: due_date, type: datetime, source: computed, description: "= term_start + report_year years - 60 days; submission window closes at due_date" }
      - { name: narrative, type: string, source: input, description: "Report narrative body" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of submission; null until SUBMITTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | RETURNED | LATE", default: "DRAFT" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FeeSchedule
    parent: null
    common_fields: false
    fields:
      - { name: effective_from, type: datetime, source: input, description: "Inclusive date the schedule takes effect; unique" }
      - { name: base_system_fee_cents, type: integer, source: input, description: "Annual per-system base fee in cents" }
      - { name: per_campus_fee_cents, type: integer, source: input, description: "Annual per-campus fee in cents for campuses with enrollment below LARGE_CAMPUS_THRESHOLD" }
      - { name: large_campus_fee_cents, type: integer, source: input, description: "Annual per-campus fee in cents for campuses with enrollment >= LARGE_CAMPUS_THRESHOLD" }
      - { name: large_campus_threshold, type: integer, source: input, description: "Enrollment at which a campus is billed the large rate" }
      - { name: visit_day_rate_cents, type: integer, source: input, description: "Per-visit-day surcharge in cents" }

  - name: Invoice
    parent: InstitutionSystem
    common_fields: true
    fields:
      - { name: system_id, type: string, source: system, description: "FK -> InstitutionSystem.id" }
      - { name: billing_year, type: integer, source: input, description: "Calendar year billed" }
      - { name: invoice_type, type: enum, source: input, description: "ANNUAL_FEE | VISIT_FEE | RENEWAL_FEE" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed at issuance per fee schedule in effect on issuance date" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | VOID", default: "ISSUED" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of issuance" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Payment
    parent: Invoice
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; > 0" }
      - { name: paid_at, type: datetime, source: input, description: "Client-supplied payment timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AccreditationTerm
    initial_state: PREPARATION
    terminal_states: [CLOSED]
    transitions:
      - from: PREPARATION
        to: SELF_STUDY
        trigger: "POST /accreditation/terms/{id}/advance"
        actor: AccreditationOfficer
        preconditions:
          - "Every Campus with campus_status == IN_SCOPE of the owning system has at least one SelfStudyRating row (any status) for every Standard"
          - "No other AccreditationTerm of the same system is in {SELF_STUDY, REVIEW, DECISION, TERM_ACTIVE, INTERIM_MONITORING, RENEWAL}"
        side_effects:
          - "Sets system.current_term_id = this term"
          - "Increments AccreditationTerm.version by 1"
          - "Increments InstitutionSystem.version by 1"

      - from: SELF_STUDY
        to: REVIEW
        trigger: "POST /accreditation/terms/{id}/advance"
        actor: AccreditationOfficer
        preconditions:
          - "Every SelfStudyRating under this term has status == FINALIZED"
          - "For every SurveyWindow under this term: status in {CLOSED, INVALIDATED}"
        side_effects:
          - "Increments AccreditationTerm.version by 1"

      - from: REVIEW
        to: DECISION
        trigger: "POST /accreditation/terms/{id}/advance"
        actor: AccreditationOfficer
        preconditions:
          - "At least one VisitEvent under this term has status == REPORT_ISSUED"
          - "No VisitEvent under this term has status in {REQUESTED, CONFIRMED, IN_FIELD, REPORT_DRAFT}"
        side_effects:
          - "Increments AccreditationTerm.version by 1"

      - from: DECISION
        to: TERM_ACTIVE
        trigger: "POST /accreditation/terms/{id}/decide"
        actor: AccreditationCommission
        preconditions:
          - "decision payload outcome in {ACCREDITED, ACCREDITED_WITH_STIPULATIONS}"
          - "If outcome == ACCREDITED_WITH_STIPULATIONS: at least one VisitFinding with severity == REQUIRED_ACTION exists under the term's visits"
        side_effects:
          - "decision_outcome := payload outcome"
          - "system.accreditation_status := ACCREDITED if outcome == ACCREDITED else ON_PROBATION"
          - "Increments AccreditationTerm.version by 1"
          - "Increments InstitutionSystem.version by 1"

      - from: DECISION
        to: CLOSED
        trigger: "POST /accreditation/terms/{id}/decide"
        actor: AccreditationCommission
        preconditions:
          - "decision payload outcome == DENIED"
        side_effects:
          - "decision_outcome := DENIED"
          - "system.accreditation_status := ACCREDITATION_WITHDRAWN"
          - "system.current_term_id := null"
          - "Increments AccreditationTerm.version by 1"
          - "Increments InstitutionSystem.version by 1"

      - from: TERM_ACTIVE
        to: INTERIM_MONITORING
        trigger: "POST /accreditation/terms/{id}/advance"
        actor: AccreditationOfficer
        preconditions:
          - "Every RequiredActionItem under findings of this term's visits has status in {VERIFIED, WAIVED}"
          - "At least one InterimReport exists with status == ACCEPTED"
        side_effects:
          - "Increments AccreditationTerm.version by 1"

      - from: INTERIM_MONITORING
        to: RENEWAL
        trigger: "system clock event: current time >= term_end - 180 days"
        actor: system
        preconditions: []
        side_effects:
          - "Increments AccreditationTerm.version by 1"
          - "Issues a RENEWAL_FEE Invoice for the owning system via fee calculation"

      - from: RENEWAL
        to: CLOSED
        trigger: "POST /accreditation/terms/{id}/close"
        actor: AccreditationOfficer
        preconditions:
          - "The RENEWAL_FEE invoice issued on entering RENEWAL has status == PAID"
        side_effects:
          - "system.current_term_id := null"
          - "Increments AccreditationTerm.version by 1"
          - "Increments InstitutionSystem.version by 1"

  - entity: SelfStudyRating
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/ratings/{id}/submit"
        actor: SchoolLeader
        preconditions:
          - "rating in 1..4"
          - "Owning AccreditationTerm.status == SELF_STUDY"
          - "Campus.campus_status == IN_SCOPE"
        side_effects:
          - "Increments SelfStudyRating.version by 1"

      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /accreditation/ratings/{id}/finalize"
        actor: AccreditationOfficer
        preconditions:
          - "Count of EvidenceItem with review_status == APPROVED under this rating >= Standard.evidence_min_items"
        side_effects:
          - "finalized_at := now"
          - "Recompute Campus.composite_index_pct for the rating's campus"
          - "Increments SelfStudyRating.version by 1"
          - "Increments Campus.version by 1"

      - from: FINALIZED
        to: REOPENED
        trigger: "POST /accreditation/ratings/{id}/reopen"
        actor: AccreditationOfficer
        preconditions:
          - "Owning AccreditationTerm.status == SELF_STUDY"
        side_effects:
          - "finalized_at := null"
          - "Recompute Campus.composite_index_pct (this rating now excluded)"
          - "Increments SelfStudyRating.version by 1"
          - "Increments Campus.version by 1"

      - from: REOPENED
        to: SUBMITTED
        trigger: "POST /accreditation/ratings/{id}/submit"
        actor: SchoolLeader
        preconditions:
          - "rating in 1..4"
          - "Owning AccreditationTerm.status == SELF_STUDY"
        side_effects:
          - "Increments SelfStudyRating.version by 1"

  - entity: EvidenceItem
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /accreditation/evidence/{id}/review"
        actor: AccreditationOfficer
        preconditions:
          - "Parent SelfStudyRating.status in {SUBMITTED, FINALIZED}"
          - "Segregation of duties: reviewing officer's user id != submitted_by_user_id"
        side_effects:
          - "Increments EvidenceItem.version by 1"

      - from: PENDING
        to: REJECTED
        trigger: "POST /accreditation/evidence/{id}/review"
        actor: AccreditationOfficer
        preconditions:
          - "Parent SelfStudyRating.status in {SUBMITTED, FINALIZED}"
          - "Segregation of duties: reviewing officer's user id != submitted_by_user_id"
        side_effects:
          - "Increments EvidenceItem.version by 1"

      - from: REJECTED
        to: PENDING
        trigger: "POST /accreditation/evidence/{id}/resubmit"
        actor: SchoolLeader
        preconditions:
          - "Parent SelfStudyRating.status in {SUBMITTED, REOPENED}"
        side_effects:
          - "Increments EvidenceItem.version by 1"

  - entity: SurveyWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED, INVALIDATED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system clock event: current time >= opens_at and current time < closes_at"
        actor: system
        preconditions: []
        side_effects:
          - "Increments SurveyWindow.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "system clock event: current time >= closes_at"
        actor: system
        preconditions: []
        side_effects:
          - "Increments SurveyWindow.version by 1"
          - "If response_count * 100 < min_participation_pct * eligible_count (strict less-than fails threshold): status := INVALIDATED instead of CLOSED"

      - from: OPEN
        to: CLOSED
        trigger: "POST /accreditation/survey-windows/{id}/close"
        actor: AccreditationOfficer
        preconditions:
          - "current time >= opens_at"
        side_effects:
          - "Increments SurveyWindow.version by 1"
          - "Same participation threshold check as auto-close: below threshold forces INVALIDATED"

      - from: SCHEDULED
        to: INVALIDATED
        trigger: "POST /accreditation/survey-windows/{id}/invalidate"
        actor: AccreditationOfficer
        preconditions: []
        side_effects:
          - "Increments SurveyWindow.version by 1"

  - entity: ImprovementGoal
    initial_state: PROPOSED
    terminal_states: [ACHIEVED, ABANDONED]
    transitions:
      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /accreditation/goals/{id}/adopt"
        actor: AccreditationOfficer
        preconditions:
          - "Owning AccreditationTerm.status in {TERM_ACTIVE, INTERIM_MONITORING}"
          - "target_value != baseline_value"
          - "direction consistent with target vs baseline: INCREASE requires target_value > baseline_value; DECREASE requires target_value < baseline_value"
        side_effects:
          - "current_value := baseline_value; attainment_pct := 0.00"
          - "Increments ImprovementGoal.version by 1"

      - from: ADOPTED
        to: MONITORING
        trigger: "POST /accreditation/goals/{id}/indicators (first ProgressIndicator creation)"
        actor: SchoolLeader
        preconditions:
          - "Goal status == ADOPTED"
        side_effects:
          - "Increments ImprovementGoal.version by 1"

      - from: MONITORING
        to: ACHIEVED
        trigger: "POST /accreditation/goals/{id}/mark-achieved"
        actor: AccreditationOfficer
        preconditions:
          - "attainment_pct >= 100.00"
        side_effects:
          - "Increments ImprovementGoal.version by 1"

      - from: ADOPTED
        to: ABANDONED
        trigger: "POST /accreditation/goals/{id}/abandon"
        actor: AccreditationOfficer
        preconditions: []
        side_effects:
          - "Increments ImprovementGoal.version by 1"

      - from: MONITORING
        to: ABANDONED
        trigger: "POST /accreditation/goals/{id}/abandon"
        actor: AccreditationOfficer
        preconditions: []
        side_effects:
          - "Increments ImprovementGoal.version by 1"

  - entity: VisitEvent
    initial_state: REQUESTED
    terminal_states: [REPORT_ISSUED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /accreditation/visits/{id}/confirm"
        actor: AccreditationOfficer
        preconditions:
          - "Owning AccreditationTerm.status == REVIEW"
          - "At least one VisitAssignment with role_on_team == CHAIR exists for this visit"
          - "Lead reviewer (lead_reviewer_id) has reviewer_status == AVAILABLE"
          - "No other VisitEvent for the same campus overlaps [starts_on, ends_on) with status in {CONFIRMED, IN_FIELD}"
          - "No Reviewer assigned to this visit is assigned to another VisitEvent whose [starts_on, ends_on) overlaps, with that visit's status in {CONFIRMED, IN_FIELD}"
        side_effects:
          - "For every VisitAssignment of this visit: reviewer.reviewer_status := ON_ASSIGNMENT"
          - "Increments VisitEvent.version by 1"
          - "Increments Reviewer.version by 1 for each assigned reviewer"

      - from: CONFIRMED
        to: IN_FIELD
        trigger: "system clock event: current time >= starts_on"
        actor: system
        preconditions: []
        side_effects:
          - "Increments VisitEvent.version by 1"

      - from: IN_FIELD
        to: REPORT_DRAFT
        trigger: "system clock event: current time >= ends_on"
        actor: system
        preconditions: []
        side_effects:
          - "Increments VisitEvent.version by 1"

      - from: REPORT_DRAFT
        to: REPORT_ISSUED
        trigger: "POST /accreditation/visits/{id}/issue-report"
        actor: Reviewer
        preconditions:
          - "Acting reviewer is the visit's lead_reviewer_id"
          - "Every VisitFinding under this visit has status == ISSUED"
          - "At least one VisitFinding exists"
        side_effects:
          - "For every VisitAssignment of this visit: reviewer.reviewer_status := AVAILABLE"
          - "For every VisitFinding with severity == REQUIRED_ACTION: create RequiredActionItem in OPEN status with due_date computed per term policy"
          - "Increments VisitEvent.version by 1"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /accreditation/visits/{id}/cancel"
        actor: AccreditationOfficer
        preconditions: []
        side_effects:
          - "Increments VisitEvent.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /accreditation/visits/{id}/cancel"
        actor: AccreditationOfficer
        preconditions:
          - "current time < starts_on"
        side_effects:
          - "For every VisitAssignment of this visit: reviewer.reviewer_status := AVAILABLE"
          - "Increments VisitEvent.version by 1"

  - entity: VisitFinding
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /accreditation/findings/{id}/issue"
        actor: Reviewer
        preconditions:
          - "Acting reviewer is lead_reviewer_id of parent VisitEvent"
          - "Parent VisitEvent.status in {IN_FIELD, REPORT_DRAFT}"
        side_effects:
          - "Increments VisitFinding.version by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /accreditation/findings/{id}/supersede"
        actor: Reviewer
        preconditions:
          - "Acting reviewer is lead_reviewer_id of parent VisitEvent"
          - "Parent VisitEvent.status == REPORT_DRAFT"
        side_effects:
          - "Increments VisitFinding.version by 1"

  - entity: RequiredActionItem
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /accreditation/action-items/{id}/submit-evidence"
        actor: SchoolLeader
        preconditions: []
        side_effects:
          - "Increments RequiredActionItem.version by 1"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /accreditation/action-items/{id}/verify"
        actor: Reviewer
        preconditions:
          - "current time <= due_date (on-time verification)"
        side_effects:
          - "verified_by_user_id := acting reviewer id"
          - "Increments RequiredActionItem.version by 1"

      - from: SUBMITTED
        to: OPEN
        trigger: "POST /accreditation/action-items/{id}/return"
        actor: Reviewer
        preconditions: []
        side_effects:
          - "Increments RequiredActionItem.version by 1"

      - from: OPEN
        to: OVERDUE
        trigger: "system clock event: current time > due_date"
        actor: system
        preconditions: []
        side_effects:
          - "Increments RequiredActionItem.version by 1"

      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /accreditation/action-items/{id}/submit-evidence"
        actor: SchoolLeader
        preconditions: []
        side_effects:
          - "Increments RequiredActionItem.version by 1"

      - from: OVERDUE
        to: VERIFIED
        trigger: "POST /accreditation/action-items/{id}/verify"
        actor: Reviewer
        preconditions:
          - "Item currently has an evidence submission pending (i.e., reached OVERDUE via SUBMITTED path is not required; verification of OVERDUE requires a preceding submit-evidence from OVERDUE)"
        side_effects:
          - "verified_by_user_id := acting reviewer id"
          - "system.accreditation_status := ON_PROBATION if not already"
          - "Increments RequiredActionItem.version by 1"
          - "Increments InstitutionSystem.version by 1"

      - from: OPEN
        to: WAIVED
        trigger: "POST /accreditation/action-items/{id}/waive"
        actor: AccreditationCommission
        preconditions:
          - "current time <= due_date"
        side_effects:
          - "Increments RequiredActionItem.version by 1"

  - entity: InterimReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /accreditation/interim-reports/{id}/submit"
        actor: SchoolLeader
        preconditions:
          - "Owning AccreditationTerm.status in {TERM_ACTIVE, INTERIM_MONITORING}"
        side_effects:
          - "submitted_at := now"
          - "If now > due_date: status := LATE instead of SUBMITTED"
          - "Increments InterimReport.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /accreditation/interim-reports/{id}/accept"
        actor: AccreditationOfficer
        preconditions: []
        side_effects:
          - "Increments InterimReport.version by 1"

      - from: LATE
        to: ACCEPTED
        trigger: "POST /accreditation/interim-reports/{id}/accept"
        actor: AccreditationOfficer
        preconditions: []
        side_effects:
          - "system.fee_credit_cents debited by LATE_REPORT_PENALTY_CENTS (can go negative)"
          - "Increments InterimReport.version by 1"
          - "Increments InstitutionSystem.version by 1"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /accreditation/interim-reports/{id}/return"
        actor: AccreditationOfficer
        preconditions: []
        side_effects:
          - "Increments InterimReport.version by 1"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /accreditation/interim-reports/{id}/submit"
        actor: SchoolLeader
        preconditions:
          - "Owning AccreditationTerm.status in {TERM_ACTIVE, INTERIM_MONITORING}"
        side_effects:
          - "submitted_at := now"
          - "If now > due_date: status := LATE instead of SUBMITTED"
          - "Increments InterimReport.version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /accreditation/invoices/{id}/payments (payment < amount_cents)"
        actor: SystemBursar
        preconditions: []
        side_effects:
          - "system.fee_credit_cents unchanged (payments settle the invoice, not the credit ledger)"
          - "Increments Invoice.version by 1"

      - from: ISSUED
        to: PAID
        trigger: "POST /accreditation/invoices/{id}/payments (cumulative payments == amount_cents)"
        actor: SystemBursar
        preconditions: []
        side_effects:
          - "Increments Invoice.version by 1"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /accreditation/invoices/{id}/payments (cumulative payments reach amount_cents)"
        actor: SystemBursar
        preconditions: []
        side_effects:
          - "Increments Invoice.version by 1"

      - from: ISSUED
        to: VOID
        trigger: "POST /accreditation/invoices/{id}/void"
        actor: SystemBursar
        preconditions:
          - "No Payment rows exist for this invoice"
        side_effects:
          - "Increments Invoice.version by 1"

  - entity: Reviewer
    initial_state: AVAILABLE
    terminal_states: [INACTIVE]
    transitions:
      - from: AVAILABLE
        to: ON_ASSIGNMENT
        trigger: "side effect of VisitEvent confirm (see VisitEvent machine)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_ASSIGNMENT
        to: AVAILABLE
        trigger: "side effect of VisitEvent issue-report or cancel (see VisitEvent machine)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: INACTIVE
        trigger: "POST /accreditation/reviewers/{id}/deactivate"
        actor: AccreditationOfficer
        preconditions:
          - "Reviewer is not assigned to any VisitEvent with status in {REQUESTED, CONFIRMED, IN_FIELD, REPORT_DRAFT}"
        side_effects:
          - "Increments Reviewer.version by 1"

  - entity: Campus
    initial_state: IN_SCOPE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: IN_SCOPE
        to: OUT_OF_SCOPE
        trigger: "POST /accreditation/campuses/{id}/scope-out"
        actor: AccreditationOfficer
        preconditions:
          - "No SelfStudyRating for this campus under the system's current term has status == FINALIZED"
        side_effects:
          - "composite_index_pct := null"
          - "Increments Campus.version by 1"

      - from: OUT_OF_SCOPE
        to: IN_SCOPE
        trigger: "POST /accreditation/campuses/{id}/scope-in"
        actor: AccreditationOfficer
        preconditions:
          - "Owning InstitutionSystem.current_term_id is not null and that term's status in {PREPARATION, SELF_STUDY}"
        side_effects:
          - "Increments Campus.version by 1"

      - from: IN_SCOPE
        to: WITHDRAWN
        trigger: "POST /accreditation/campuses/{id}/withdraw"
        actor: AccreditationOfficer
        preconditions:
          - "Owning AccreditationTerm.status in {PREPARATION, CLOSED} or current_term_id is null"
        side_effects:
          - "All SelfStudyRating rows for this campus under any non-closed term are deleted"
          - "Increments Campus.version by 1"

  - entity: InstitutionSystem
    initial_state: CANDIDATE
    terminal_states: []
    transitions:
      - from: CANDIDATE
        to: ACCREDITED
        trigger: "side effect of AccreditationTerm decide (ACCREDITED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CANDIDATE
        to: ON_PROBATION
        trigger: "side effect of AccreditationTerm decide (ACCREDITED_WITH_STIPULATIONS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCREDITED
        to: ON_PROBATION
        trigger: "side effect of RequiredActionItem late verification (OVERDUE -> VERIFIED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCREDITED
        to: ACCREDITATION_WITHDRAWN
        trigger: "side effect of AccreditationTerm decide (DENIED) on a renewal decision"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_PROBATION
        to: ACCREDITED
        trigger: "side effect of AccreditationTerm decide (ACCREDITED) after probation"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: rating-create-stale-term
    parent_entity: AccreditationTerm
    write_endpoint: "POST /accreditation/ratings"
    occ_field: "expected_term_version"
    description: |
      Creating a SelfStudyRating against an AccreditationTerm whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just advanced the term (e.g., PREPARATION ->
      SELF_STUDY changed the preconditions for rating creation) and the current
      writer's view of the term is therefore stale.
    error_id: ERR_STALE_TERM_VERSION
    http_status: 412

  - rule_id: goal-indicator-stale-goal
    parent_entity: ImprovementGoal
    write_endpoint: "POST /accreditation/goals/{id}/indicators"
    occ_field: "expected_goal_version"
    description: |
      Posting a ProgressIndicator against an ImprovementGoal whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just posted an indicator (which mutates
      current_value and attainment_pct) and the current writer's computed
      view of the goal is therefore stale.
    error_id: ERR_STALE_GOAL_VERSION
    http_status: 412

  - rule_id: invoice-payment-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /accreditation/invoices/{id}/payments"
    occ_field: "expected_invoice_version"
    description: |
      Posting a Payment against an Invoice whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just posted a payment that changed the invoice's outstanding
      balance and status, so the current writer's amount calculation is stale.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: campus_composite_index
    trigger: "SelfStudyRating finalize or reopen"
    algorithm: weighted_scoring
    formula: |
      Let R = set of SelfStudyRating rows for this campus under the system's
      current term with status == FINALIZED.
      If R is empty: composite_index_pct := null.
      Else:
        numerator   = sum over r in R of (r.rating * Standard(r.standard_id).weight_pct)
        denominator = sum over r in R of Standard(r.standard_id).weight_pct
        raw_pct     = (numerator / denominator) * (100 / 4)
        composite_index_pct := round_half_up(raw_pct, 2)
    input_set: "SelfStudyRating rows where campus_id == this campus AND term_id == system.current_term_id AND status == FINALIZED"
    constants:
      RUBRIC_MAX: 4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: campus_scoped
        when: "Recomputing for one campus after one of its ratings changes"
        difference: "Input set restricted to that campus_id"
      - name: system_scoped_projection
        when: "Read of InstitutionSystem dashboard aggregates all campuses"
        difference: "Input set spans every campus with campus_status == IN_SCOPE; produces a system-level projected index on read, not persisted"

  - name: survey_participation_rate
    trigger: "SurveyWindow close (manual or auto)"
    algorithm: threshold
    formula: |
      rate_pct_times_100 = response_count * 100
      threshold_times_100 = min_participation_pct * eligible_count
      If rate_pct_times_100 >= threshold_times_100: window passes -> CLOSED
      Else: window fails -> INVALIDATED
      (Comparison performed in integer space; no floating point rounding.)
    input_set: "SurveyResponse rows with window_id == this window; response_count maintained as counter"
    constants: {}
    precision: "integer comparison; no rounding"

  - name: goal_attainment
    trigger: "ProgressIndicator creation (post-commit)"
    algorithm: threshold
    formula: |
      If direction == INCREASE:
        progress = (current_value - baseline_value) / (target_value - baseline_value)
      Else (DECREASE):
        progress = (baseline_value - current_value) / (baseline_value - target_value)
      attainment_pct := round_half_up(clamp(progress, 0, 1) * 100, 2)
      current_value := value of the latest ProgressIndicator by measured_at;
        tie on measured_at broken by created_at ASC (earliest-created wins).
    input_set: "ProgressIndicator rows with goal_id == this goal"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: action_item_due_date
    trigger: "RequiredActionItem creation (on VisitEvent issue-report)"
    algorithm: forward_looking
    formula: |
      due_date = add_months(visit.ends_on, follow_up_months)
      add_months: calendar-month addition preserving day-of-month where possible;
      if the target month has fewer days, clamp to the last day of that month
      (e.g., 2026-01-31 + 1 month -> 2026-02-28).
    input_set: "Parent VisitEvent.ends_on and RequiredActionItem.follow_up_months"
    constants:
      ALLOWED_FOLLOW_UP_MONTHS: "6,12,18"
    precision: "date arithmetic; day-precision"

  - name: annual_fee_invoice_amount
    trigger: "Invoice issuance with invoice_type == ANNUAL_FEE"
    algorithm: tiered_pricing
    formula: |
      schedule = FeeSchedule row with the greatest effective_from <= issuance date
        (tie on effective_from broken by created_at ASC; if none exists -> ERR_FEE_SCHEDULE_MISSING)
      campus_count_billable = count of Campus rows with system_id == this system
        AND campus_status == IN_SCOPE
      large_count = count of those campuses with enrollment >= schedule.large_campus_threshold
      small_count = campus_count_billable - large_count
      amount_cents = schedule.base_system_fee_cents
                   + small_count * schedule.per_campus_fee_cents
                   + large_count * schedule.large_campus_fee_cents
      If system.fee_credit_cents > 0:
        applied_credit = min(fee_credit_cents, amount_cents)
        amount_cents -= applied_credit
        fee_credit_cents -= applied_credit
      Else if system.fee_credit_cents < 0:
        # negative balance (e.g., late-report penalty) is added to the invoice
        amount_cents += (-fee_credit_cents)
        fee_credit_cents = 0
    input_set: "Campus rows of the system with campus_status == IN_SCOPE; FeeSchedule selected by effective_from <= issued_at"
    constants: {}
    precision: "integer cents; no rounding"

  - name: visit_fee_invoice_amount
    trigger: "Invoice issuance with invoice_type == VISIT_FEE"
    algorithm: aggregation
    formula: |
      schedule = FeeSchedule row with greatest effective_from <= issuance date
      visit_days = sum over VisitEvent rows of this term with status in
        {CONFIRMED, IN_FIELD, REPORT_DRAFT, REPORT_ISSUED} of
        (ends_on - starts_on) in whole days (exclusive end minus inclusive start)
      amount_cents = visit_days * schedule.visit_day_rate_cents
    input_set: "VisitEvent rows under the term with status in {CONFIRMED, IN_FIELD, REPORT_DRAFT, REPORT_ISSUED}"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: provisional_at_confirm
        when: "Read-only projection when a visit is CONFIRMED but report not yet issued"
        difference: "Counts only visits in {CONFIRMED, IN_FIELD, REPORT_DRAFT}; REPORT_ISSUED excluded because a final invoice is issued separately at report issuance"
      - name: final_at_report_issued
        when: "Actual invoice issuance after REPORT_ISSUED"
        difference: "Counts visits in {REPORT_ISSUED} only for the final settlement; earlier provisional projection is discarded"

  - name: interim_report_due_date
    trigger: "InterimReport creation"
    algorithm: forward_looking
    formula: |
      due_date = add_years(term.term_start, report_year) - 60 days
      add_years: calendar-year addition; Feb 29 clamps to Feb 28 in non-leap years.
    input_set: "AccreditationTerm.term_start and InterimReport.report_year"
    constants:
      ADVANCE_NOTICE_DAYS: 60
    precision: "date arithmetic; day-precision"

  - name: late_report_penalty
    trigger: "InterimReport accept when status == LATE"
    algorithm: threshold
    formula: |
      If report.status == LATE at accept time:
        system.fee_credit_cents -= LATE_REPORT_PENALTY_CENTS
      (fee_credit_cents may go negative; a negative balance is added to the
      next ANNUAL_FEE invoice via annual_fee_invoice_amount's credit logic
      operating in reverse — i.e., negative credit increases amount_cents.)
    input_set: "The InterimReport being accepted"
    constants:
      LATE_REPORT_PENALTY_CENTS: 25000
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role value is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template resource ids exist, validated left-to-right (system, then campus/term, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: actor may not review their own submission (EvidenceItem review), may not verify an action item whose evidence they submitted, lead reviewer conflict-of-interest (conflict_system_ids contains the system) blocks assignment"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /accreditation/evidence/{id}/review, POST /accreditation/action-items/{id}/verify, POST /accreditation/visits/{id}/assignments"

  - priority: 6
    category: business_temporal
    check: "Temporal window rules: survey response only while window OPEN; visit confirm only when no date-overlap conflicts; action-item verify/waive on-time check against due_date; interim report submit before/after due_date flips LATE"
    error_id: ERR_TEMPORAL_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /accreditation/survey-windows/{id}/responses, POST /accreditation/visits/{id}/confirm, POST /accreditation/action-items/{id}/verify, POST /accreditation/action-items/{id}/waive"

  - priority: 7
    category: business_referential
    check: "Cross-entity referential integrity: campus belongs to system, standard exists, reviewer exists and AVAILABLE, goal's campus belongs to same system as term"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST /accreditation/ratings, POST /accreditation/goals, POST /accreditation/visits, POST /accreditation/visits/{id}/assignments, POST /accreditation/survey-windows"

  - priority: 8
    category: business_constraint
    check: "Aggregate and uniqueness constraints: one ACTIVE-term per system, one rating per (term, campus, standard), one survey window per (term, campus, instrument), one interim report per (term, report_year), respondent_token unique per window"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /accreditation/terms, POST /accreditation/ratings, POST /accreditation/survey-windows, POST /accreditation/survey-windows/{id}/responses, POST /accreditation/interim-reports"

  - priority: 9
    category: business_constraint
    check: "Threshold and quorum constraints: evidence quorum for finalize, participation threshold for survey close, attainment >= 100 for mark-achieved, direction-consistency for adopt"
    error_id: ERR_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /accreditation/ratings/{id}/finalize, POST /accreditation/survey-windows/{id}/close, POST /accreditation/goals/{id}/mark-achieved, POST /accreditation/goals/{id}/adopt"

  - priority: 10
    category: business_fiscal
    check: "Fiscal constraints: renewal close requires RENEWAL_FEE invoice PAID; payment amount positive and does not exceed outstanding balance; fee schedule exists for issuance date"
    error_id: ERR_FISCAL_VIOLATION
    http_status: 422
    applies_to: "POST /accreditation/terms/{id}/close, POST /accreditation/invoices/{id}/payments, POST /accreditation/systems/{id}/invoices"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/accreditation/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-08-01T00:00:00Z; before any set call the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [AccreditationOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Re-evaluates every clock-driven transition: SurveyWindow SCHEDULED->OPEN / OPEN->CLOSED-or-INVALIDATED, VisitEvent CONFIRMED->IN_FIELD / IN_FIELD->REPORT_DRAFT, RequiredActionItem OPEN->OVERDUE, AccreditationTerm INTERIM_MONITORING->RENEWAL"

  # --- InstitutionSystem ---
  - method: POST
    path: "/accreditation/systems"
    description: "Create an InstitutionSystem"
    roles: [AccreditationOfficer]
