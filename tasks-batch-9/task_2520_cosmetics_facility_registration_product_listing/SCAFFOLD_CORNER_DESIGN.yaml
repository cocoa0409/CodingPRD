              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_pro_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_consumer_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings/${lst_pro_id}/ingredients"
              payload: { inci_name: "LINALOOL", function_code: "FRAGRANCE", concentration_pct: 0.5000, is_fragrance_allergen: true, label_disclosed: false }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { req_pro: $.data.disclosure_required }
            - call: "POST /cosmetics/listings/${lst_consumer_id}/ingredients"
              payload: { inci_name: "LINALOOL", function_code: "FRAGRANCE", concentration_pct: 0.5000, is_fragrance_allergen: true, label_disclosed: false }
              as: ResponsiblePersonAgent
