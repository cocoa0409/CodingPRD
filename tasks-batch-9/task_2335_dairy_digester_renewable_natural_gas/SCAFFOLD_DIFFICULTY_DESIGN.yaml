      - name: ppv_business_safety_facility_upset_wins_over_business_fiscal_hydraulic_capacity
        grounds:
          - "validations[priority=130]"
          - "validations[priority=200]"
          - errors.ERR_FACILITY_UPSET
          - errors.ERR_HYDRAULIC_CAPACITY_EXCEEDED
          - state_machines.DigesterFacility.UPSET_to_RESTRICTED
        distinguishing_aspect: |
          A different category pair on the same endpoint: the business_safety check at
          priority 130 (digester in biological upset) must pre-empt the business_fiscal
          check at priority 200 (900.000 t against a 500.000 t/day hydraulic limit), and
          because the load is booked against the NON-curtailable agreement that survived the
          upset cascade, the priority-100 state check cannot mask the comparison; releasing
          the upset with a posture override then surfaces the fiscal error for the identical
          payload.
        test_recipe:
          setup:
            - "One facility with hydraulic_capacity_tonnes_per_day 500.000, one curtailable agreement for dairy1 and one non-curtailable agreement for dairy2, both ACTIVE."
            - "Operations day 2026-08-03 is closed with volatile fatty acids 3600.0 against alkalinity 8000.0 on a 400.000 t load, giving stress_points 4, stability_status INHIBITED and ops_posture UPSET."
            - "Operations day 2026-08-04 is created before the close and stays OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dairies"
