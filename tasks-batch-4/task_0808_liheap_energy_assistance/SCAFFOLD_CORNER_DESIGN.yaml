        distinguishing_aspect: "A referral with referral_reason=TIER_1_AUTO computes priority == HIGH regardless of household flags."
        test_recipe:
          setup: ["a household exists"]
          setup_api_calls:
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Wp Yoon", household_size: 4, annual_income_cents: 1500000, state_code: "CA", county: "Butte", has_elderly_or_disabled: false, has_child_under_6: false, heating_source: "ELECTRICITY" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/weatherization-referrals"
              payload: { household_id: "${hh_id}", referral_reason: "TIER_1_AUTO" }
              as: Caseworker
              captures: { prio: "$.data.priority" }
          assert:
            - "captured prio == HIGH"
            - "WeatherizationReferral of ${hh_id} has priority == HIGH and status == REFERRED"

