      - name: delivery_index_variant_divergence_on_one_report_set
        claim_type: Variant Divergence
        grounds:
          - calculations.post_buy_delivery_index
          - entities.Buy.fields.provisional_delivery_index
          - entities.Buy.fields.final_delivery_index
        excluded_because:
          difficulty_instance: provisional_vs_final_delivery_index_diverge_on_same_reports
          rationale: |
            That instance already pins both variants on one buy over the identical two
            reports - provisional 1.0250 against final 0.4500 - and asserts the exact delta,
            covering the status-set difference and the gross-versus-demo column difference in
            one pass.

      - name: dedup_variant_switch_reconciles_on_the_same_delivery
        claim_type: Reconciliation
        grounds:
          - calculations.campaign_unduplicated_reach
          - entities.ReconciliationRun.fields.dedup_method
        excluded_because:
          difficulty_instance: sequential_vs_aggregate_dedup_diverge_on_same_delivery
          rationale: |
            Two runs over one unchanged set of ACCEPTED reports are compared there, so the
            ignored-input behaviour of each dedup method and the resulting
            unduplicated_reach_pct and implied_frequency deltas are already asserted as
            literals.

      - name: sequential_liability_waterfall_caps_the_remittance
        claim_type: Correct Result
        grounds:
          - calculations.sequential_liability_release
          - entities.Invoice.fields.max_remittable_cents
        excluded_because:
          difficulty_instance: sequential_liability_cap_floors_the_pro_rata_share
          rationale: |
            The floored pro-rata cap, its recomputation after each client payment and the
            rejection of the cent above it are all asserted there with pre-computed
            literals, including the boundary where the cap equals seller_payable_cents.

  - section: validations
    instances:
      - name: an_allocation_that_pushes_the_plan_above_one_hundred_percent_is_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority 27]
          - errors.ERR_ALLOCATION_PCT_SUM_INVALID
          - calculations.allocation_budget_split
        distinguishing_aspect: |
          The 100.00 percent ceiling is checked against the running sum over allocations in
          status DRAFT or LOCKED, so a second line of only 0.01 percent on a plan that
          already sums to 100.00 is refused with 422 ERR_ALLOCATION_PCT_SUM_INVALID and the
          campaign's allocated_budget_cents stays 10,000,000.
        test_recipe:
          setup:
            - "one advertiser and one DRAFT campaign carrying a single 100.00 percent LINEAR_TV allocation"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 2000, planned_market: "UPFRONT", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
          trigger:
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "CTV", allocation_pct: 0.01, planned_cpm_cents: 1500, planned_market: "UPFRONT", primary_daypart: "DIGITAL_ANY" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == 'ERR_ALLOCATION_PCT_SUM_INVALID'"
            - "GET /upfront/channel-allocations?campaign_id=${c_id} returns total_count == 1"
            - "Campaign.${c_id}.allocated_budget_cents == 10000000 and Campaign.${c_id}.version == 2"

      - name: a_new_allocation_on_an_approved_plan_is_rejected_as_locked
        claim_type: Violation -> Error
        grounds:
          - validations[priority 16]
          - errors.ERR_ALLOCATION_LOCKED
          - state_machines.ChannelAllocation.DRAFT_to_LOCKED
        distinguishing_aspect: |
          Once the client approves, the single allocation is LOCKED, and the lock check at
          §1.4 priority 16 outranks the percentage-sum check at priority 27 - so a 5.00
          percent addition that would also break the 100.00 percent sum must report
          ERR_ALLOCATION_LOCKED, not ERR_ALLOCATION_PCT_SUM_INVALID.
        test_recipe:
          setup:
            - "one advertiser and one campaign whose single 100.00 percent allocation is LOCKED by client approval"
          setup_api_calls:
