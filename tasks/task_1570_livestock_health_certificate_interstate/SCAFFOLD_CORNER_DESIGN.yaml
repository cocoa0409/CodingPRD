              as: ProgramAdmin
              captures: { req_ver: $.data.version }
          trigger:
            - call: "POST /api/veterinarians/00000000-0000-0000-0000-000000000004/suspend"
              as: StateVetOfficer
              captures: { err_v: $.data.error_id }
            - call: "POST /api/test-records/00000000-0000-0000-0000-000000000005/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
              captures: { err_t: $.data.error_id }
            - call: "POST /api/movement-records/00000000-0000-0000-0000-000000000006/depart"
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err_m: $.data.error_id }
            - call: "POST /api/outbreak-zones/00000000-0000-0000-0000-000000000007/escalate"
              as: StateVetOfficer
              captures: { err_z: $.data.error_id }
            - call: "POST /api/quarantine-orders/00000000-0000-0000-0000-000000000008/lift"
              as: StateVetOfficer
              as_user_id: "officer-b"
              captures: { err_q: $.data.error_id }
            - call: "POST /api/transmission-audits/00000000-0000-0000-0000-000000000009/acknowledge"
              as: StateVetOfficer
              captures: { err_a: $.data.error_id }
            - call: "PATCH /api/entry-requirements/00000000-0000-0000-0000-00000000000a"
              payload: { expected_requirement_version: "${req_ver}", test_validity_days: 45 }
              as: ProgramAdmin
              captures: { err_r: $.data.error_id }
          assert:
            - "suspend unknown vet -> error_id == 'ERR_VETERINARIAN_NOT_FOUND' (404)"
            - "result unknown test record -> error_id == 'ERR_TEST_RECORD_NOT_FOUND' (404)"
            - "depart unknown movement record -> error_id == 'ERR_MOVEMENT_RECORD_NOT_FOUND' (404)"
            - "escalate unknown zone -> error_id == 'ERR_OUTBREAK_ZONE_NOT_FOUND' (404)"
            - "lift unknown quarantine order -> error_id == 'ERR_QUARANTINE_ORDER_NOT_FOUND' (404)"
            - "acknowledge unknown transmission audit -> error_id == 'ERR_TRANSMISSION_AUDIT_NOT_FOUND' (404)"
            - "PATCH unknown entry requirement -> error_id == 'ERR_ENTRY_REQUIREMENT_NOT_FOUND' (404; existence precedes OCC)"

      - name: certificate_list_filters_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Certificate.fields.status
        distinguishing_aspect: |
          GET /api/certificates honors the fixed envelope (meta.api_request_id,
          response_type 'array', total_count, has_more) and composes equality
          filters (origin_premises_id, destination_state_code, vet_id) with
          limit/offset pagination over two DRAFT certificates.
        test_recipe:
          setup:
            - "Premises P; vet V; two DRAFT certificates (dest KS and TX); clock at default so inspection 2026-08-01 is legal"
          setup_api_calls:
