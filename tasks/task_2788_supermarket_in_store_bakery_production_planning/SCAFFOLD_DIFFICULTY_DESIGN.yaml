  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: oven_deck_rejects_run_inside_the_changeover_buffer
        grounds:
          - calculations.oven_deck_occupation_conflict
          - validations.priority_34
          - entities.Oven.fields.changeover_buffer_minutes
          - entities.ProductionRun.fields.deck_index
          - errors.ERR_OVEN_SLOT_CONFLICT
        distinguishing_aspect: |
          Resource: an OVEN DECK, contended by ProductionRuns. Interval semantics:
          BUFFERED half-open occupation [bake_start_utc, bake_end_utc + buffer), so a
          run starting exactly at the previous run's bake_end (05:20) still collides
          and only 05:40, past the 20-minute changeover, is free.
        test_recipe:
          setup:
            - "Deck Oven A: deck_count 2, rack_capacity_per_deck 4, changeover_buffer_minutes 20."
            - "An existing SCHEDULED PAR-CROIS run of 4 racks holds deck 0 from 05:00Z, bake_minutes 20, so its buffered occupation is [05:00Z, 05:40Z)."
            - "PLANNED BakeDay with labor_budget_minutes 600."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "THAW-FIL", name: "Thaw Filler Danish", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 100, shelf_life_hours: 24 }
              as: RegionalAdmin
              captures: { fil_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 4, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T05:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { holder_run_id: $.data.id }
          trigger:
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 4, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T05:20:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { buffer_error: $.data.error_id }
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 4, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T05:40:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { after_buffer_run_id: $.data.id }
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 4, oven_id: "${oven_a_id}", deck_index: 1, bake_start_utc: "2026-08-12T05:20:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { other_deck_run_id: $.data.id }
            - call: "GET /bakery/production-runs?bake_day_id=${bd_id}&oven_id=${oven_a_id}"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
          assert:
            - "${buffer_error} == ERR_OVEN_SLOT_CONFLICT with HTTP 409 — 05:20 is the predecessor's bake_end but still inside its buffered occupation"
            - "ProductionRun.${after_buffer_run_id} was created with 201 at bake_start_utc 2026-08-12T05:40:00Z, exactly at the release instant of the half-open interval"
            - "ProductionRun.${other_deck_run_id} was created with 201 — deck_index 1 is a different resource, so 05:20 is free there"
            - "ProductionRun.${holder_run_id}.bake_end_utc == 2026-08-12T05:20:00Z"
            - "3 runs plus the filler run exist for ${bd_id}; the rejected request created nothing"
            - "BakeDay.${bd_id}.planned_labor_minutes == 117.00 (three 4-rack PAR-CROIS runs at 39.00 each, filler 0.00)"

      - name: pickup_slots_may_abut_but_not_overlap
        grounds:
          - calculations.pickup_slot_overlap
          - validations.priority_35
          - entities.PickupSlot.fields.slot_start_utc
          - entities.PickupSlot.fields.slot_end_utc
          - errors.ERR_PICKUP_SLOT_OVERLAP
        distinguishing_aspect: |
          A DIFFERENT resource entity — the DECORATOR's pickup timeline, contended by
          PickupSlots of one BakeDay — with DIFFERENT interval semantics: an UNBUFFERED
          half-open [start, end) interval, so unlike the oven deck a slot starting
          exactly at 16:00 against a 14:00-16:00 slot is accepted, while a partial
          straddle 15:00-17:00 is rejected.
        test_recipe:
          setup:
            - "One BakeDay on 2026-08-12 with an existing OPEN pickup slot 14:00Z-16:00Z, decorator_capacity_units 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T14:00:00Z", slot_end_utc: "2026-08-12T16:00:00Z", decorator_capacity_units: 30 }
              as: CakeDesk
              captures: { first_slot_id: $.data.id }
          trigger:
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T16:00:00Z", slot_end_utc: "2026-08-12T18:00:00Z", decorator_capacity_units: 30 }
              as: CakeDesk
              captures: { abutting_slot_id: $.data.id }
            - call: "POST /bakery/pickup-slots"
              payload: { bake_day_id: "${bd_id}", slot_start_utc: "2026-08-12T15:00:00Z", slot_end_utc: "2026-08-12T17:00:00Z", decorator_capacity_units: 30 }
              as: CakeDesk
              captures: { overlap_error: $.data.error_id }
          assert:
            - "the abutting slot returns 201: PickupSlot.${abutting_slot_id}.slot_start_utc == 2026-08-12T16:00:00Z, slot_status == OPEN, reserved_decoration_units == 0"
            - "${overlap_error} == ERR_PICKUP_SLOT_OVERLAP with HTTP 409 — 15:00-17:00 straddles both existing slots"
            - "exactly 2 PickupSlot rows exist for ${bd_id}"
            - "PickupSlot.${first_slot_id} is unchanged by the rejected request"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: voiding_waste_restores_run_unit_conservation
        grounds:
          - state_machines.WasteRecord.record_status
          - state_machines.ProductionRun.disposition_status
          - state_machines.BakeDay.markdown_authorization
          - calculations.shrink_rate
          - endpoints.POST_/bakery/waste-records/{wasteRecordId}/void
        distinguishing_aspect: |
          Conserved quantity: UNITS OF BAKED PRODUCT on a run — the invariant
          actual_units == on_shelf_units + wasted_units_total must hold both before and
          after the void, and every downstream figure derived from those units (day
          shrink, markdown authorization, disposition) must return to its pre-waste
          value with no drift.
        test_recipe:
          setup:
            - "Department shrink_budget_pct 0.03."
            - "One COMPLETED SCR-ROLL run: 4 racks, ingredient_cost 1000, actual_units 100, unit_cost_basis_cents 10, disposition ON_SHELF, on_shelf_units 100."
            - "baker-02 then attests the entire batch as waste (100 units), which clears the run and locks markdown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "THAW-FIL", name: "Thaw Filler Danish", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 100, shelf_life_hours: 24 }
              as: RegionalAdmin
              captures: { fil_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "SCR-ROLL", name: "Scratch Dinner Roll", production_method: "SCRATCH", units_per_rack: 25, proof_minutes: 45, bake_minutes: 30, cool_minutes: 20, base_labor_minutes_per_rack: 12, setup_labor_minutes: 20, unit_retail_cents: 199, shelf_life_hours: 12, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 25 }] }
              as: RegionalAdmin
              captures: { roll_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${roll_id}", rack_count: 4, oven_id: "${oven_a_id}", deck_index: 0, proof_start_utc: "2026-08-12T04:15:00Z", bake_start_utc: "2026-08-12T05:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_id: $.data.id }
            - call: "POST /bakery/production-runs/${run_id}/start-proof"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_id}/complete"
              payload: { actual_units: 100 }
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/waste-records"
              payload: { production_run_id: "${run_id}", disposition_reason: "BURNT", units: 100 }
              as: Baker
              as_user_id: "baker-02"
              captures: { waste_id: $.data.id }
          trigger:
            - call: "POST /bakery/waste-records/${waste_id}/void"
              payload: { void_reason: "miscounted rack; product was sold" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
          assert:
            - "before the void: WasteRecord.${waste_id}.waste_cost_cents == 1000, run wasted_units_total == 100, on_shelf_units == 0, disposition_status == CLEARED"
            - "before the void: BakeDay.${bd_id}.shrink_cost_basis_pct == 1.0000, shrink_unit_basis_pct == 1.0000, markdown_authorization == MANAGER_ONLY"
            - "after the void: WasteRecord.${waste_id}.record_status == VOIDED, void_reason stored, voided_by_user_id == ${dept_id}"
            - "after the void: ProductionRun.${run_id}.wasted_units_total == 0, on_shelf_units == 100, disposition_status back to ON_SHELF"
            - "after the void: BakeDay.${bd_id}.waste_units_total == 0, shrink_cost_cents == 0, shrink_cost_basis_pct == 0.0000, shrink_unit_basis_pct == 0.0000"
            - "after the void: markdown_authorization == AUTO (the compensating MANAGER_ONLY -> AUTO transition fired because 0.0000 <= 0.03)"
            - "invariant actual_units == on_shelf_units + wasted_units_total holds at both ends: 100 == 0 + 100 before, 100 == 100 + 0 after"
            - "ProductionRun.${run_id}.actual_units, ingredient_cost_cents (1000) and unit_cost_basis_cents (10) are untouched by the void — no drift"
            - "Ingredient.${flour_id}.on_hand_units is still 1900: voiding waste does not un-consume ingredients"

      - name: cancelling_an_ingredient_order_releases_the_purchase_commitment
        grounds:
          - state_machines.IngredientOrder.order_status
          - calculations.department_commitment
          - entities.BakeryDepartment.fields.open_purchase_commitment_cents
          - entities.Ingredient.fields.replenishment_state
          - endpoints.POST_/bakery/ingredient-orders/{ingredientOrderId}/cancel
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: MONEY — the department's
          open_purchase_commitment_cents, which must return to exactly its pre-order
          value (0) after cancellation, while each line's ingredient unwinds
          ON_ORDER back to OK. Nothing about units of product is involved.
        test_recipe:
          setup:
            - "Department freight_surcharge_pct 0.05, open_purchase_commitment_cents 0."
            - "FLOUR on_hand 2000 (reorder_point 120) and SUGAR on_hand 500 (reorder_point 60), both OK."
            - "One MANUAL order for 100 flour and 75 sugar units, total 2836 cents, then SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Baker Sugar", case_pack_units: 30, unit_cost_cents: 15, shelf_life_days: 10, daily_usage_units: 20, reorder_point_units: 60, on_hand_units: 500 }
              as: RegionalAdmin
              captures: { sugar_id: $.data.id }
            - call: "GET /bakery/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { dept_v: $.data.version }
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_id}", expected_department_version: "${dept_v}", lines: [{ ingredient_id: "${flour_id}", required_units: 100 }, { ingredient_id: "${sugar_id}", required_units: 75 }] }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery/ingredient-orders/${order_id}/submit"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
          trigger:
            - call: "POST /bakery/ingredient-orders/${order_id}/cancel"
              payload: { cancel_reason: "supplier could not deliver before the bake day" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
          assert:
            - "commitment trace: 0 before the order, 2836 while DRAFT, still 2836 while SUBMITTED, back to 0 after the cancel"
            - "IngredientOrder.${order_id}.order_status == CANCELLED with cancel_reason stored, order_total_cents still 2836 (the order row keeps its money, the department does not)"
            - "Ingredient.${flour_id}.replenishment_state == ON_ORDER after submit and OK after the cancel (on_hand 2000 >= reorder_point 120)"
            - "Ingredient.${sugar_id}.replenishment_state == ON_ORDER after submit and OK after the cancel (on_hand 500 >= reorder_point 60)"
            - "Ingredient on_hand_units are untouched throughout: 2000 and 500 — cancelling never moves stock"
            - "BakeryDepartment.${dept_id}.version incremented once more than ${dept_v} for the create and once for the cancel"
