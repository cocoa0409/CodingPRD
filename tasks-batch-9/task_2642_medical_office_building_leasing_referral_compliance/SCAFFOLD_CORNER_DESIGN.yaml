            - call: "POST /leases/${m12_l_id}/certify-fmv"
              payload: { certification_note: "Inside the clamped band" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-16T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /_ops/run-daily-close"
