        grounds:
          - calculations.turn_service_charge
          - entities.TurnResource.fields.status
          - entities.Agent.fields.employment_type
        distinguishing_aspect: "The subcontract factor reads only occupations in status RESERVED, COMMITTED or RELEASED. Once the subcontracted agent's only occupation has been CANCELLED by the subcontractor termination cascade, the turn has no qualifying subcontracted agent, so the PROVISIONAL charge is the undiluted 18000 cents and never the diluted 17370."
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER; Subcontractor 'Alpine Ramp AG' was APPROVED, hired agent E010, then was SUSPENDED and TERMINATED."
            - "That termination cancelled E010's only occupation on Turn LX318 (TOWING_ONLY, scheduled 06:00-06:20), so the turn carries no live subcontracted agent."
            - "BillingPeriod 2026-04 is OPEN and has no lines yet."
          setup_api_calls:
