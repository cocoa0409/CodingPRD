            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_a}", nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_a}", nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_a}", nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h1_id: "$.data[0].id", q2_v2: "$.data[0].quarterly_report_version_after" }
          trigger:
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v2}", hour_begin_utc: "2026-04-01T03:00:00Z", op_time_fraction: 1.0, heat_input_method: "APPENDIX_D_FUEL", fuel_flow_lbs: 45000.0, fuel_sample_id: "${fs_b}", nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { pending_error_id: $.data.error_id }
            - call: "POST /emissions/fuel-samples/${fs_a}/analysis"
              payload: { outcome: "INVALIDATE", invalidation_reason: "chain of custody broken; laboratory duplicate outside repeatability" }
              as: QAAnalyst
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
