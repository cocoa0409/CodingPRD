scenario: "1033. Fishing, Tackle & Bait Shop: SKU & state fishing-license sales, live-bait inventory & tank, charter/guide booking linkage, tournament & weigh-in, rod/reel service & spooling, loyalty, seasonal, special order"
domain_name: "fishing-tackle-bait-shop"
api_prefix: "/api"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  notes: |
    Flat peer entities linked by FKs (no nested URL ownership). Two non-linear
    state machines on different entities: CharterBooking runs two independent
    dimensions (booking_status x payment_status); ServiceOrder is cyclic
    (INTAKE<->DIAGNOSED<->IN_PROGRESS->READY). Temporal windowing dominates
    (charter guide schedules with turnaround buffer, angler double-booking,
    license validity/season windows, tournament windows) layered over seat
    quota allocation with a waitlist. A logical clock makes every window rule
    deterministic.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Angler / shopper display name"
      - name: email
        type: string
        source: input
        description: "Unique contact email; used as natural key for dedup"
        constraints: "unique across Customers"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD); drives license age-tier and age-requirement checks"
      - name: residency_state
        type: string
        source: input
        description: "Two-letter US state code of residency (e.g. CA)"
      - name: loyalty_points_balance
        type: integer
        source: computed
        description: "Spendable loyalty points; earned on license issue, reversed on void, or adjusted by manager"
        default: 0
      - name: lifetime_points_earned
        type: integer
        source: computed
        description: "Cumulative points ever earned (drives tier); never decreases except on compensating reversal of the very transaction that earned them"
        default: 0
      - name: loyalty_tier
        type: enum
        source: computed
        description: "Derived membership tier"
        default: BRONZE
        constraints: "one of {BRONZE, SILVER, GOLD}"
      - name: status
        type: enum
        source: system
        description: "Account lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Stock keeping unit code"
        constraints: "unique across Products"
      - name: name
        type: string
        source: input
        description: "Product display name"
      - name: category
        type: enum
        source: input
        description: "Merchandise class"
        constraints: "one of {TACKLE, ROD, REEL, LINE, LIVE_BAIT, MISC}"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Retail price per unit in cents"
        constraints: ">= 0"
      - name: stock_qty
        type: integer
        source: input
        description: "On-hand units; decremented when consumed by a ServiceOrder reaching READY, restored on that order's cancellation, and increased by restock"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Catalog lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCONTINUED}"

  - name: LicenseType
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "License product code (e.g. CA-ANNUAL-RES)"
      - name: state_code
        type: string
        source: input
        description: "Issuing state two-letter code"
      - name: license_class
        type: enum
        source: input
        description: "Residency class"
        constraints: "one of {RESIDENT, NONRESIDENT}"
      - name: base_price_cents
        type: integer
        source: input
        description: "Adult (non youth/senior) base price in cents"
        constraints: ">= 0"
      - name: youth_max_age
        type: integer
        source: input
        description: "Inclusive maximum age to qualify for youth price; null means no youth tier"
        default: null
      - name: youth_price_cents
        type: integer
        source: input
        description: "Price in cents when age <= youth_max_age; null when no youth tier"
        default: null
      - name: senior_min_age
        type: integer
        source: input
        description: "Inclusive minimum age to qualify for senior price; null means no senior tier"
        default: null
      - name: senior_price_cents
        type: integer
        source: input
        description: "Price in cents when age >= senior_min_age; null when no senior tier"
        default: null
      - name: peak_surcharge_cents
        type: integer
        source: input
        description: "Flat surcharge added when valid_from month is within the peak window"
        default: 0
      - name: peak_start_month
        type: integer
        source: input
        description: "First calendar month (1-12) of peak window inclusive; null means no peak surcharge"
        default: null
      - name: peak_end_month
        type: integer
        source: input
        description: "Last calendar month (1-12) of peak window inclusive; null means no peak surcharge"
        default: null
      - name: min_age
        type: integer
        source: input
        description: "Minimum customer age required to be issued this license (age-requirement / safety check)"
        default: 0
      - name: season_start_date
        type: string
        source: input
        description: "ISO date; sales of this license are only permitted when clock date is within [season_start_date, season_end_date]"
      - name: season_end_date
        type: string
        source: input
        description: "ISO date; inclusive end of the sellable season window"
      - name: validity_days
        type: integer
        source: input
        description: "Number of days a sold license remains valid from valid_from (inclusive)"
        constraints: "> 0"

  - name: LicenseSale
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the angler the license is issued to"
      - name: license_type_id
        type: string
        source: input
        description: "FK -> LicenseType.id; the license product sold"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at issue"
      - name: valid_from
        type: string
        source: computed
        description: "ISO date the license becomes valid; equals the logical-clock date at issue"
      - name: valid_until
        type: string
        source: computed
        description: "ISO date the license expires (inclusive); valid_from + (validity_days - 1) days"
      - name: price_paid_cents
        type: integer
        source: computed
        description: "Result of the license_price calculation at issue"
      - name: points_earned
        type: integer
        source: computed
        description: "Loyalty points credited to the customer at issue (license_points_earned)"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Refund produced by license_void_refund; null until voided"
        default: null
      - name: status
        type: enum
        source: system
        description: "Sale lifecycle"
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Guide display name"
      - name: license_no
        type: string
        source: input
        description: "Guide's captain/operator license number"
      - name: status
        type: enum
        source: system
        description: "Guide availability lifecycle"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, SUSPENDED}"

  - name: Charter
    parent: null
    common_fields: true
    fields:
      - name: guide_id
        type: string
        source: input
        description: "FK -> Guide.id; the guide running this trip"
      - name: title
        type: string
        source: input
        description: "Charter trip title"
      - name: start_at
        type: datetime
        source: input
        description: "Trip start (ISO 8601 UTC)"
      - name: end_at
        type: datetime
        source: input
        description: "Trip end (ISO 8601 UTC); must be after start_at"
      - name: capacity
        type: integer
        source: input
        description: "Maximum total booked seats"
        constraints: "> 0"
      - name: booked_seats
        type: integer
        source: computed
        description: "Sum of seats over CharterBookings on this charter in booking_status IN {RESERVED, CHECKED_IN, COMPLETED}"
        default: 0
      - name: price_per_seat_cents
        type: integer
        source: input
        description: "Per-seat base fare in cents"
        constraints: ">= 0"
      - name: fuel_surcharge_cents
        type: integer
        source: input
        description: "Per-seat fuel surcharge in cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Charter lifecycle; OPEN<->FULL auto-derived from booked_seats vs capacity"
        default: OPEN
        constraints: "one of {OPEN, FULL, CANCELLED}"

  - name: CharterBooking
    parent: null
    common_fields: true
    fields:
      - name: charter_id
        type: string
        source: input
        description: "FK -> Charter.id; the trip being booked"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the angler booking"
      - name: seats
        type: integer
        source: input
        description: "Seats requested on this booking"
        constraints: "> 0"
      - name: waitlist_requested
        type: boolean
        source: input
        description: "When true and the charter has insufficient seats, the booking is created WAITLISTED instead of being rejected"
        default: false
      - name: booking_status
        type: enum
        source: system
        description: "Attendance dimension (independent of payment_status)"
        default: RESERVED
        constraints: "one of {RESERVED, WAITLISTED, CHECKED_IN, COMPLETED, CANCELLED}"
      - name: payment_status
        type: enum
        source: system
        description: "Payment dimension (independent of booking_status)"
        default: UNPAID
        constraints: "one of {UNPAID, PAID, REFUNDED}"
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "charter_settlement provisional variant, pinned at booking create"
      - name: final_total_cents
        type: integer
        source: computed
        description: "charter_settlement final variant, pinned at complete; null until COMPLETED"
        default: null
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Amount actually paid (equals provisional_total_cents when payment_status becomes PAID, else 0)"
        default: 0
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "charter_cancellation_refund result; null until refunded"
        default: null

  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Tournament name"
      - name: species
        type: string
        source: input
        description: "Target species counted for weigh-ins"
      - name: start_at
        type: datetime
        source: input
        description: "Fishing window start (ISO 8601 UTC)"
      - name: end_at
        type: datetime
        source: input
        description: "Fishing window end (ISO 8601 UTC)"
      - name: entry_fee_cents
        type: integer
        source: input
        description: "Entry fee in cents"
        default: 0
      - name: min_qualifying_weight_grams
        type: integer
        source: input
        description: "A weigh-in must be >= this weight to qualify for ranking"
        constraints: ">= 0"
      - name: prize_points
        type: integer
        source: input
        description: "Loyalty points awarded to the winning entry's customer at finalize"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Tournament lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OPEN, IN_PROGRESS, FINALIZED, CANCELLED}"

  - name: TournamentEntry
    parent: null
    common_fields: true
    fields:
      - name: tournament_id
        type: string
        source: input
        description: "FK -> Tournament.id"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: status
        type: enum
        source: system
        description: "Entry lifecycle"
        default: REGISTERED
        constraints: "one of {REGISTERED, CHECKED_IN, WEIGHED, WINNER, WITHDRAWN}"
      - name: weigh_ins
        type: array
        source: system
        description: "Append-only list of {species, weight_grams, recorded_at} objects recorded during the tournament window"
        default: []
      - name: best_weight_grams
        type: integer
        source: computed
        description: "Maximum qualifying weigh-in weight for this entry (0 when none qualify)"
        default: 0
      - name: final_rank
        type: integer
        source: computed
        description: "1-based rank assigned at finalize among qualifying entries; null until FINALIZED"
        default: null

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owner of the rod/reel"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the spool-line Product consumed for a SPOOLING job; null for pure labor jobs"
        default: null
      - name: service_type
        type: enum
        source: input
        description: "Job class"
        constraints: "one of {REEL_REPAIR, ROD_REPAIR, SPOOLING}"
      - name: base_service_cents
        type: integer
        source: input
        description: "Flat labor base in cents"
        constraints: ">= 0"
      - name: line_price_cents_per_meter
        type: integer
        source: input
        description: "Spooling line charge per meter in cents"
        default: 0
      - name: estimated_line_meters
        type: integer
        source: input
        description: "Meters of line estimated at diagnosis (drives the quote)"
        default: 0
      - name: actual_line_meters
        type: integer
        source: input
        description: "Meters actually spooled, supplied when moving to READY (drives the final charge)"
        default: 0
      - name: line_units
        type: integer
        source: input
        description: "Whole spool units consumed from product_id's stock_qty when the job reaches READY"
        default: 0
      - name: parts_cents
        type: integer
        source: input
        description: "Additional parts cost added to the final charge, supplied at READY"
        default: 0
      - name: quoted_cents
        type: integer
        source: computed
        description: "service_order_charge quoted variant, pinned at DIAGNOSED; null before diagnosis"
        default: null
      - name: final_subtotal_cents
        type: integer
        source: computed
        description: "service_order_charge final variant (pre discount/tax), pinned at READY; null before READY"
        default: null
      - name: grand_total_cents
        type: integer
        source: computed
        description: "service_order_grand_total (tier discount then tax), pinned at PICKED_UP; null before pickup"
        default: null
      - name: points_earned
        type: integer
        source: computed
        description: "Loyalty points credited at PICKED_UP"
        default: 0
      - name: stock_consumed
        type: boolean
        source: computed
        description: "True once line_units were deducted from product stock (at READY); gates the restore-on-cancel compensation"
        default: false
      - name: status
        type: enum
        source: system
        description: "Cyclic service workflow"
        default: INTAKE
        constraints: "one of {INTAKE, DIAGNOSED, IN_PROGRESS, READY, PICKED_UP, CANCELLED}"

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/customers/{id}/status {status: SUSPENDED}"
        actor: ShopManager
        preconditions: ["customer.status == ACTIVE"]
        side_effects:
          - "For every CharterBooking of this customer with booking_status IN {RESERVED, WAITLISTED}: transition that booking to CANCELLED (this itself cascades seat release / waitlist promotion on the booking's Charter -- see CharterBooking CANCELLED transition)"
        note: "Depth-3 cascade root: customer -> booking -> charter(FULL->OPEN) -> waitlist promotion"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/customers/{id}/status {status: ACTIVE}"
        actor: ShopManager
        preconditions: ["customer.status == SUSPENDED"]
        side_effects: []

  - entity: Guide
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "POST /api/guides/{id}/status {status: SUSPENDED}"
        actor: ShopManager
        preconditions: ["guide.status == AVAILABLE"]
        side_effects:
          - "For every Charter of this guide with status IN {OPEN, FULL}: transition that Charter to CANCELLED (which itself cascades booking cancellation + refund -- see Charter CANCELLED transition)"
        note: "Depth-2 cascade root: guide -> charter -> booking(+refund)"
      - from: SUSPENDED
        to: AVAILABLE
        trigger: "POST /api/guides/{id}/status {status: AVAILABLE}"
        actor: ShopManager
        preconditions: ["guide.status == SUSPENDED"]
        side_effects: []

  - entity: LicenseSale
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /api/license-sales/{id}/void"
        actor: ShopClerk
        preconditions: ["license_sale.status == ACTIVE"]
        side_effects:
          - "compute refund_amount_cents via license_void_refund"
          - "reverse loyalty: Customer.loyalty_points_balance -= points_earned; Customer.lifetime_points_earned -= points_earned; recompute Customer.loyalty_tier"
        note: "Compensating action for the issue that earned points_earned"

  - entity: Charter
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: booked_seats reaches capacity after a booking create or waitlist promotion"
        actor: system
        preconditions: ["charter.booked_seats == charter.capacity"]
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system: booked_seats drops below capacity after a booking cancellation"
        actor: system
        preconditions: ["charter.booked_seats < charter.capacity"]
        side_effects:
          - "promote the earliest (created_at ASC) CharterBooking on this charter with booking_status == WAITLISTED whose seats <= remaining capacity: transition it WAITLISTED -> RESERVED (which re-increments booked_seats and may re-trigger OPEN->FULL)"
        note: "Hop 3 of the customer-suspend cascade"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/charters/{id}/cancel  OR  guide suspension cascade"
        actor: Guide
        preconditions: ["charter.status == OPEN"]
        side_effects:
          - "For every CharterBooking on this charter with booking_status IN {RESERVED, WAITLISTED, CHECKED_IN}: transition to CANCELLED (which itself issues a full refund when payment_status == PAID -- see CharterBooking CANCELLED transition)"
      - from: FULL
        to: CANCELLED
        trigger: "POST /api/charters/{id}/cancel  OR  guide suspension cascade"
        actor: Guide
        preconditions: ["charter.status == FULL"]
        side_effects:
          - "For every CharterBooking on this charter with booking_status IN {RESERVED, WAITLISTED, CHECKED_IN}: transition to CANCELLED (issuing full refund when payment_status == PAID)"

  - entity: CharterBooking
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /api/charter-bookings/{id}/check-in"
        actor: ShopClerk
        preconditions:
          - "booking.booking_status == RESERVED"
          - "booking.payment_status == PAID  (cross-dimension: attendance advance requires the payment dimension to be PAID)"
          - "charter.status IN {OPEN, FULL}  (cross-entity: charter not CANCELLED)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /api/charter-bookings/{id}/complete"
        actor: Guide
        preconditions: ["booking.booking_status == CHECKED_IN"]
        side_effects:
          - "compute final_total_cents via charter_settlement final variant (applies the customer's loyalty_tier discount)"
      - from: WAITLISTED
        to: RESERVED
        trigger: "system: charter FULL->OPEN promotion (earliest created_at first)"
        actor: system
        preconditions:
          - "booking.booking_status == WAITLISTED"
          - "booking.seats <= (charter.capacity - charter.booked_seats)"
        side_effects:
          - "increment charter.booked_seats by booking.seats"
          - "recompute provisional_total_cents"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/charter-bookings/{id}/cancel  OR  customer-suspend / charter-cancel cascade"
        actor: Customer
        preconditions: ["booking.booking_status == RESERVED"]
        side_effects:
          - "decrement charter.booked_seats by booking.seats; if charter.status == FULL and booked_seats < capacity, transition charter FULL->OPEN (which promotes the earliest WAITLISTED booking)"
          - "if booking.payment_status == PAID: compute refund via charter_cancellation_refund, set refund_amount_cents, transition payment_status PAID->REFUNDED"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /api/charter-bookings/{id}/cancel  OR  customer-suspend / charter-cancel cascade"
        actor: Customer
        preconditions: ["booking.booking_status == WAITLISTED"]
        side_effects:
          - "if booking.payment_status == PAID: compute refund via charter_cancellation_refund, set refund_amount_cents, transition payment_status PAID->REFUNDED"
        note: "A WAITLISTED booking never held a seat, so no booked_seats change"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /api/charters/{id}/cancel cascade (guide/charter cancellation)"
        actor: system
        preconditions: ["booking.booking_status == CHECKED_IN"]
        side_effects:
          - "decrement charter.booked_seats by booking.seats"
          - "if booking.payment_status == PAID: full refund (charter_cancellation_refund guide-initiated path), set refund_amount_cents, payment_status PAID->REFUNDED"

  - entity: CharterBooking_payment
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /api/charter-bookings/{id}/pay"
        actor: Customer
        preconditions:
          - "booking.payment_status == UNPAID"
          - "booking.booking_status IN {RESERVED, CHECKED_IN}  (cannot pay a CANCELLED/COMPLETED booking)"
        side_effects:
          - "set amount_paid_cents = provisional_total_cents"
        note: "Payment dimension evolves independently of booking_status"
      - from: PAID
        to: REFUNDED
        trigger: "system: booking cancellation while PAID"
        actor: system
        preconditions: ["booking.payment_status == PAID"]
        side_effects:
          - "set refund_amount_cents via charter_cancellation_refund"

  - entity: Tournament
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /api/tournaments/{id}/status {status: OPEN}"
        actor: ShopManager
        preconditions: ["tournament.status == SCHEDULED"]
        side_effects: []
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /api/tournaments/{id}/status {status: IN_PROGRESS}"
        actor: ShopManager
        preconditions: ["tournament.status == OPEN"]
        side_effects: []
      - from: IN_PROGRESS
        to: FINALIZED
        trigger: "POST /api/tournaments/{id}/status {status: FINALIZED}"
        actor: ShopManager
        preconditions:
          - "tournament.status == IN_PROGRESS"
          - "at least one TournamentEntry qualifies (best_weight_grams >= tournament.min_qualifying_weight_grams for entries in status IN {CHECKED_IN, WEIGHED})"
        side_effects:
          - "run tournament_ranking; assign final_rank to every qualifying entry"
          - "transition the rank-1 entry to WINNER and credit its Customer loyalty_points_balance += prize_points and lifetime_points_earned += prize_points; recompute that Customer's loyalty_tier"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/tournaments/{id}/status {status: CANCELLED}"
        actor: ShopManager
        preconditions: ["tournament.status == SCHEDULED"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/tournaments/{id}/status {status: CANCELLED}"
        actor: ShopManager
        preconditions: ["tournament.status == OPEN"]
        side_effects:
          - "For every TournamentEntry in status IN {REGISTERED, CHECKED_IN, WEIGHED}: transition to WITHDRAWN"

  - entity: TournamentEntry
    initial_state: REGISTERED
    terminal_states: [WINNER, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /api/tournament-entries/{id}/status {status: CHECKED_IN}"
        actor: ShopClerk
        preconditions:
          - "entry.status == REGISTERED"
          - "tournament.status == IN_PROGRESS  (cross-entity dependency)"
        side_effects: []
      - from: CHECKED_IN
        to: WEIGHED
        trigger: "system: first qualifying weigh-in recorded via POST /api/tournament-entries/{id}/weigh-in"
        actor: system
        preconditions: ["entry.status == CHECKED_IN"]
        side_effects:
          - "recompute best_weight_grams"
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /api/tournament-entries/{id}/status {status: WITHDRAWN}  OR  tournament OPEN->CANCELLED cascade"
        actor: Customer
        preconditions: ["entry.status == REGISTERED"]
        side_effects: []
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /api/tournament-entries/{id}/status {status: WITHDRAWN}"
        actor: Customer
        preconditions: ["entry.status == CHECKED_IN"]
        side_effects: []
      - from: WEIGHED
        to: WINNER
        trigger: "system: tournament finalize assigns rank 1"
        actor: system
        preconditions: ["entry.status == WEIGHED", "entry.final_rank == 1"]
        side_effects: []

  - entity: ServiceOrder
    initial_state: INTAKE
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: INTAKE
        to: DIAGNOSED
        trigger: "POST /api/service-orders/{id}/transition {to_status: DIAGNOSED}"
        actor: ShopClerk
        preconditions: ["service_order.status == INTAKE"]
        side_effects:
          - "compute quoted_cents via service_order_charge quoted variant"
      - from: DIAGNOSED
        to: IN_PROGRESS
        trigger: "POST /api/service-orders/{id}/transition {to_status: IN_PROGRESS}"
        actor: ShopClerk
        preconditions: ["service_order.status == DIAGNOSED"]
        side_effects: []
      - from: IN_PROGRESS
        to: DIAGNOSED
        trigger: "POST /api/service-orders/{id}/transition {to_status: DIAGNOSED}"
        actor: ShopClerk
        preconditions: ["service_order.status == IN_PROGRESS"]
        side_effects:
          - "recompute quoted_cents via service_order_charge quoted variant (re-quote after scope change)"
        note: "Cycle edge: IN_PROGRESS -> DIAGNOSED (re-diagnosis)"
      - from: DIAGNOSED
        to: INTAKE
        trigger: "POST /api/service-orders/{id}/transition {to_status: INTAKE}"
        actor: ShopClerk
        preconditions: ["service_order.status == DIAGNOSED"]
        side_effects:
          - "clear quoted_cents to null"
        note: "Cycle edge: DIAGNOSED -> INTAKE (return for more info)"
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /api/service-orders/{id}/transition {to_status: READY, actual_line_meters, parts_cents, line_units}"
        actor: ShopClerk
        preconditions:
          - "service_order.status == IN_PROGRESS"
          - "if line_units > 0: product_id refers to a Product with stock_qty >= line_units"
        side_effects:
          - "compute final_subtotal_cents via service_order_charge final variant"
          - "if line_units > 0: decrement Product(product_id).stock_qty by line_units; set stock_consumed = true"
      - from: READY
        to: PICKED_UP
        trigger: "POST /api/service-orders/{id}/transition {to_status: PICKED_UP}"
        actor: ShopClerk
        preconditions: ["service_order.status == READY"]
        side_effects:
          - "compute grand_total_cents via service_order_grand_total"
          - "points_earned = floor(grand_total_cents / 100); credit Customer.loyalty_points_balance and lifetime_points_earned; recompute Customer.loyalty_tier"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /api/service-orders/{id}/transition {to_status: CANCELLED}"
        actor: ShopClerk
        preconditions: ["service_order.status == INTAKE"]
        side_effects: []
      - from: DIAGNOSED
        to: CANCELLED
        trigger: "POST /api/service-orders/{id}/transition {to_status: CANCELLED}"
        actor: ShopClerk
        preconditions: ["service_order.status == DIAGNOSED"]
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/service-orders/{id}/transition {to_status: CANCELLED}"
        actor: ShopClerk
        preconditions: ["service_order.status == IN_PROGRESS"]
        side_effects: []
      - from: READY
        to: CANCELLED
        trigger: "POST /api/service-orders/{id}/transition {to_status: CANCELLED}"
        actor: ShopClerk
        preconditions: ["service_order.status == READY"]
        side_effects:
          - "if stock_consumed == true: increment Product(product_id).stock_qty by line_units; set stock_consumed = false (compensating restore)"

  # ---- 1.2.1 Concurrency Rules ----
  # See concurrency_rules block below.

concurrency_rules:
  - rule_id: charter-reschedule-stale
    parent_entity: Charter
    write_endpoint: "PUT /api/charters/{id}"
    occ_field: "expected_charter_version"
    description: |
      Rescheduling a Charter (changing start_at/end_at) carries the version the
      client last observed on that Charter. If the Charter's version has advanced
      since the client read it, the reschedule is rejected as stale. Rescheduling
      has no state precondition that a strictly-later request would trip (a
      Charter may be rescheduled from OPEN or FULL to any non-overlapping window),
      so two sequential reschedules that both observed the same original version
      would each otherwise succeed and silently clobber each other -- OCC on the
      parent version is the only mechanism that deterministically rejects the
      second, stale attempt.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: license_price
    trigger: "POST /api/license-sales (at issue)"
    algorithm: tiered_pricing
    formula: |
      age = whole years from customer.date_of_birth to valid_from (the clock date at issue)
      # tiered age selection (non-linear branch across 3 config-driven tiers):
      if lt.youth_max_age is not null and age <= lt.youth_max_age:
          tier_price = lt.youth_price_cents
      elif lt.senior_min_age is not null and age >= lt.senior_min_age:
          tier_price = lt.senior_price_cents
      else:
          tier_price = lt.base_price_cents
      # seasonal surcharge (peak window is a closed month range):
      if lt.peak_start_month is not null and lt.peak_end_month is not null
         and lt.peak_start_month <= month(valid_from) <= lt.peak_end_month:
          surcharge = lt.peak_surcharge_cents
      else:
          surcharge = 0
      price_paid_cents = tier_price + surcharge
    input_set: "single LicenseType (license_type_id) and single Customer (customer_id); no aggregation"
    constants: {}
    precision: "integer cents; no rounding needed (all inputs are integer cents)"
    variants: []

  - name: license_points_earned
    trigger: "POST /api/license-sales (at issue)"
    algorithm: aggregation
    formula: |
      points_earned = floor(price_paid_cents / 100) * POINTS_PER_DOLLAR
      Customer.loyalty_points_balance += points_earned
      Customer.lifetime_points_earned += points_earned
    input_set: "the single LicenseSale just priced"
    constants:
      POINTS_PER_DOLLAR: 1
    precision: "integer points (floor)"
    variants: []

  - name: license_void_refund
    trigger: "POST /api/license-sales/{id}/void"
    algorithm: threshold
    formula: |
      elapsed_days = floor((clock_now_date - valid_from) in days)   # >= 0
      if elapsed_days <= LICENSE_VOID_GRACE_DAYS:
          refund_amount_cents = price_paid_cents            # FULL variant
      else:
          remaining_days = max(0, validity_days - elapsed_days)
          refund_amount_cents = round_half_up(price_paid_cents * remaining_days / validity_days)  # PRORATED variant
    input_set: "single LicenseSale"
    constants:
      LICENSE_VOID_GRACE_DAYS: 7
    precision: "2-step: divide then round_half_up to integer cents"
    variants:
      - name: full
        when: "voided within LICENSE_VOID_GRACE_DAYS of valid_from"
        difference: "returns the entire price_paid_cents regardless of days remaining"
      - name: prorated
        when: "voided after the grace window"
        difference: "returns price_paid_cents * remaining_days / validity_days, rounded"

  - name: loyalty_tier
    trigger: "any change to Customer.lifetime_points_earned (license issue/void, service pickup, tournament win, manual adjustment)"
    algorithm: threshold
    formula: |
      if lifetime_points_earned >= GOLD_THRESHOLD:   loyalty_tier = GOLD
      elif lifetime_points_earned >= SILVER_THRESHOLD: loyalty_tier = SILVER
      else: loyalty_tier = BRONZE
    input_set: "single Customer"
    constants:
      SILVER_THRESHOLD: 500
      GOLD_THRESHOLD: 2000
    precision: "exact integer comparison; boundary is inclusive (exactly 500 -> SILVER, exactly 2000 -> GOLD)"
    variants: []

  - name: charter_settlement
    trigger: "provisional at POST /api/charter-bookings (create/promotion); final at POST /api/charter-bookings/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      gross = seats * charter.price_per_seat_cents + seats * charter.fuel_surcharge_cents
      # provisional variant (at RESERVED / promotion): no discount
      provisional_total_cents = gross
      # final variant (at COMPLETED): apply the customer's tier discount
      disc = TIER_DISCOUNT_PCT[customer.loyalty_tier]
      final_total_cents = round_half_up(gross * (1 - disc))
    input_set: "single CharterBooking joined to its Charter and Customer"
    constants:
      TIER_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
    precision: "round_half_up to integer cents on the final variant"
    variants:
      - name: provisional
        when: "at booking create or waitlist promotion"
        difference: "no loyalty discount; equals gross seat+fuel charge"
      - name: final
        when: "at complete (CHECKED_IN -> COMPLETED)"
        difference: "multiplies gross by (1 - tier discount) then rounds; diverges from provisional whenever tier != BRONZE"

  - name: charter_cancellation_refund
    trigger: "any CharterBooking cancellation while payment_status == PAID"
    algorithm: threshold
    formula: |
      if cancellation is guide-initiated (charter cancel / guide suspend cascade):
          refund = amount_paid_cents                          # always full for shop-side cancellation
      else:  # customer-initiated
          hours_before = (charter.start_at - clock_now) / 3600
          if hours_before >= CANCEL_FULL_REFUND_HOURS:
              refund = amount_paid_cents
          elif hours_before > 0:
              refund = round_half_up(amount_paid_cents * CANCEL_PARTIAL_REFUND_PCT)
          else:
              refund = 0
      refund_amount_cents = refund
    input_set: "single CharterBooking joined to its Charter; clock time"
    constants:
      CANCEL_FULL_REFUND_HOURS: 48
      CANCEL_PARTIAL_REFUND_PCT: 0.50
    precision: "round_half_up to integer cents"
    variants:
      - name: guide_initiated_full
        when: "charter/guide cancellation"
        difference: "always full refund of amount_paid_cents"
      - name: customer_initiated_threshold
        when: "customer cancels their own booking"
        difference: "full if >= 48h before start, half if within 48h, zero if at/after start"

  - name: service_order_charge
    trigger: "quoted at DIAGNOSED; final_subtotal at READY"
    algorithm: forward_looking
    formula: |
      # quoted variant (at DIAGNOSED): uses ESTIMATED meters, no parts
      quoted_cents = base_service_cents + estimated_line_meters * line_price_cents_per_meter
      # final variant (at READY): uses ACTUAL meters plus parts
      final_subtotal_cents = base_service_cents + actual_line_meters * line_price_cents_per_meter + parts_cents
    input_set: "single ServiceOrder"
    constants: {}
    precision: "integer cents"
    variants:
      - name: quoted
        when: "INTAKE -> DIAGNOSED"
        difference: "estimated meters, excludes parts"
      - name: final
        when: "IN_PROGRESS -> READY"
        difference: "actual meters plus parts_cents; diverges from quoted when actual != estimated or parts_cents > 0"

  - name: service_order_grand_total
    trigger: "READY -> PICKED_UP"
    algorithm: tiered_pricing
    formula: |
      # PINNED evaluation order (mode c): subtotal -> tier discount keyed on subtotal tier -> tax on the discounted amount -> total.
      subtotal = final_subtotal_cents
      disc = TIER_DISCOUNT_PCT[customer.loyalty_tier]
      discount_cents = round_half_up(subtotal * disc)
      discounted = subtotal - discount_cents
      tax_cents = round_half_up(discounted * TAX_RATE)
      grand_total_cents = discounted + tax_cents
    input_set: "single ServiceOrder joined to its Customer"
    constants:
      TAX_RATE: 0.08
      TIER_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
    precision: "round_half_up at each of the two rounding steps (discount, then tax); order is fixed and observable"
    variants: []

  - name: tournament_ranking
    trigger: "IN_PROGRESS -> FINALIZED"
    algorithm: aggregation
    formula: |
      qualifying = entries with status IN {CHECKED_IN, WEIGHED} AND best_weight_grams >= tournament.min_qualifying_weight_grams
      best_weight_grams(entry) = max(w.weight_grams for w in entry.weigh_ins
                                     if w.species == tournament.species
                                     and w.weight_grams >= tournament.min_qualifying_weight_grams
                                     and tournament.start_at <= w.recorded_at <= tournament.end_at)  (0 if none)
      rank qualifying entries by best_weight_grams DESC,
           tie-break by earliest qualifying weigh-in recorded_at ASC,
           final tie-break by entry.created_at ASC
      assign final_rank = 1..N; rank-1 entry -> WINNER
    input_set: "all TournamentEntry rows of the tournament and their embedded weigh_ins"
    constants: {}
    precision: "integer grams; deterministic ordering with created_at ASC as ultimate tie-break (never id)"
    variants: []

# =====================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /api/customers (Anonymous self-register)"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per the RBAC matrix; entity_backed roles may only mutate resources they own"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, integers non-negative where constrained, end_at > start_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 4
    category: existence
    check: "every path id and every FK in the body resolves to an existing resource (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
    note: "concrete error_id is the resource-specific ERR_*_NOT_FOUND"
  - priority: 5
    category: state
    check: "target resource is in a valid state for the requested transition (includes charter OPEN/FULL for booking, PAID for check-in, license ACTIVE for void, tournament IN_PROGRESS for entry check-in, service_order status gate, customer not SUSPENDED for booking/purchase)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
    note: "specific error_ids: ERR_CHARTER_NOT_OPEN, ERR_PAYMENT_REQUIRED, ERR_ALREADY_VOIDED, ERR_TOURNAMENT_NOT_IN_PROGRESS, ERR_CUSTOMER_SUSPENDED, ERR_INVALID_STATE"
  - priority: 6
    category: state
    check: "OCC: expected_charter_version equals the Charter's current version on reschedule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /api/charters/{id}"
  - priority: 7
    category: business_safety
    check: "customer age at valid_from >= LicenseType.min_age"
    error_id: ERR_AGE_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /api/license-sales"
  - priority: 8
    category: business_temporal
    check: "clock date is within [LicenseType.season_start_date, LicenseType.season_end_date]"
    error_id: ERR_LICENSE_OUT_OF_SEASON
    http_status: 422
    applies_to: "POST /api/license-sales"
  - priority: 9
    category: business_temporal
    check: "new Charter window (+/- TURNAROUND_BUFFER_MINUTES, where TURNAROUND_BUFFER_MINUTES = 60) does not collide with another non-CANCELLED Charter of the same guide; reject when the gap between the two windows is strictly less than 60 minutes (a gap of exactly 60 minutes is allowed)"
    error_id: ERR_GUIDE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /api/charters, PUT /api/charters/{id}"
  - priority: 10
    category: business_temporal
    check: "the booking's charter window [start_at, end_at) does not overlap the window of any other active CharterBooking of the same customer"
    error_id: ERR_ANGLER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /api/charter-bookings"
  - priority: 11
    category: business_referential
    check: "the customer holds a LicenseSale with status ACTIVE whose [valid_from, valid_until] covers the charter's start_at date"
    error_id: ERR_LICENSE_REQUIRED
    http_status: 422
    applies_to: "POST /api/charter-bookings"
  - priority: 12
    category: business_constraint
    check: "requested seats <= remaining capacity (capacity - booked_seats); bypassed into WAITLISTED only when waitlist_requested is true"
    error_id: ERR_INSUFFICIENT_SEATS
    http_status: 409
    applies_to: "POST /api/charter-bookings"
  - priority: 13
    category: business_constraint
    check: "product stock_qty >= line_units when a ServiceOrder moves to READY"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /api/service-orders/{id}/transition"
  - priority: 14
    category: business_constraint
    check: "customer is not already entered (status IN {REGISTERED, CHECKED_IN, WEIGHED, WINNER}) in this tournament"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /api/tournament-entries"
  - priority: 15
    category: business_constraint
    check: "at least one entry qualifies before a tournament may be FINALIZED"
    error_id: ERR_NO_QUALIFIED_ENTRIES
    http_status: 409
    applies_to: "POST /api/tournaments/{id}/status (FINALIZED)"
  - priority: 16
    category: business_fiscal
    check: "a manual loyalty adjustment must not drive loyalty_points_balance below 0"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    applies_to: "POST /api/customers/{id}/loyalty-adjustments"

# =====================================================================
# 1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time. All window/expiry/age rules read this clock."
    roles: [ShopManager, ShopClerk]
    code: 200
    input: ["to_iso8601"]
    output: "null"
    side_effects: ["advances the logical clock to to_iso8601"]

  # ---- Customer ----
  - method: POST
    path: "/api/customers"
    description: "Register a customer"
    roles: [Anonymous, ShopClerk, ShopManager]
    code: 201
    input: ["full_name", "email", "date_of_birth", "residency_state"]
    output: Customer
    side_effects: ["loyalty_points_balance=0, lifetime_points_earned=0, loyalty_tier=BRONZE, status=ACTIVE"]
  - method: GET
    path: "/api/customers/{id}"
    description: "Fetch a customer"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/api/customers/{id}/status"
    description: "Suspend or reactivate a customer; SUSPENDED cascades cancellation of the customer's active bookings"
    roles: [ShopManager]
    code: 200
    input: ["status"]
    output: Customer
    side_effects: ["on SUSPENDED: cancel RESERVED/WAITLISTED bookings -> seat release -> waitlist promotion (depth-3 cascade)"]
  - method: POST
    path: "/api/customers/{id}/loyalty-adjustments"
    description: "Manager manual loyalty grant/deduction"
    roles: [ShopManager]
    code: 200
    input: ["points_delta", "reason"]
    output: Customer
    side_effects: ["loyalty_points_balance += points_delta; if points_delta > 0 also lifetime_points_earned += points_delta; recompute loyalty_tier"]

  # ---- Product ----
  - method: POST
    path: "/api/products"
    description: "Create a product SKU"
    roles: [ShopManager, ShopClerk]
    code: 201
    input: ["sku", "name", "category", "unit_price_cents", "stock_qty"]
    output: Product
    side_effects: []
  - method: GET
    path: "/api/products/{id}"
    description: "Fetch a product"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/api/products/{id}/restock"
    description: "Increase on-hand stock"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: ["add_qty"]
    output: Product
    side_effects: ["stock_qty += add_qty"]

  # ---- LicenseType ----
  - method: POST
    path: "/api/license-types"
    description: "Create a license configuration"
    roles: [ShopManager]
    code: 201
    input: ["code", "state_code", "license_class", "base_price_cents", "min_age", "season_start_date", "season_end_date", "validity_days", "youth_max_age?", "youth_price_cents?", "senior_min_age?", "senior_price_cents?", "peak_surcharge_cents?", "peak_start_month?", "peak_end_month?"]
    output: LicenseType
    side_effects: []
  - method: GET
    path: "/api/license-types/{id}"
    description: "Fetch a license type"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: LicenseType
    side_effects: []

  # ---- LicenseSale ----
  - method: POST
    path: "/api/license-sales"
    description: "Issue (sell) a fishing license; prices via license_price and earns loyalty"
    roles: [Customer, ShopClerk, ShopManager]
    code: 201
    input: ["customer_id", "license_type_id"]
    output: LicenseSale
    side_effects: ["price_paid_cents=license_price; points_earned=license_points_earned; credit customer loyalty; valid_from=clock date; valid_until=valid_from+validity_days-1"]
  - method: GET
    path: "/api/license-sales/{id}"
    description: "Fetch a license sale"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: LicenseSale
    side_effects: []
  - method: GET
    path: "/api/license-sales"
    description: "List license sales, filterable by customer or license type (reverse-reachability for both FKs)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["customer_id?", "license_type_id?", "limit?", "offset?"]
    output: LicenseSale[]
    side_effects: []
  - method: POST
    path: "/api/license-sales/{id}/void"
    description: "Void a license; refunds via license_void_refund and reverses earned loyalty"
    roles: [ShopClerk, ShopManager]
    code: 200
    input: []
    output: LicenseSale
    side_effects: ["refund_amount_cents=license_void_refund; reverse points_earned from customer; recompute tier; status=VOIDED"]

  # ---- Guide ----
  - method: POST
    path: "/api/guides"
    description: "Create a guide"
    roles: [ShopManager]
    code: 201
    input: ["name", "license_no"]
    output: Guide
    side_effects: []
  - method: GET
    path: "/api/guides/{id}"
    description: "Fetch a guide"
    roles: [Guide, ShopClerk, ShopManager]
    code: 200
    input: []
    output: Guide
    side_effects: []
  - method: POST
    path: "/api/guides/{id}/status"
    description: "Suspend or reactivate a guide; SUSPENDED cascades charter cancellation"
    roles: [ShopManager]
    code: 200
    input: ["status"]
    output: Guide
    side_effects: ["on SUSPENDED: cancel this guide's OPEN/FULL charters -> cascade booking cancellation + refund (depth-2 cascade)"]

  # ---- Charter ----
  - method: POST
    path: "/api/charters"
    description: "Create a charter trip (guide schedule overlap + buffer checked)"
    roles: [Guide, ShopManager]
    code: 201
    input: ["guide_id", "title", "start_at", "end_at", "capacity", "price_per_seat_cents", "fuel_surcharge_cents?"]
    output: Charter
    side_effects: ["status=OPEN; booked_seats=0"]
  - method: GET
    path: "/api/charters/{id}"
    description: "Fetch a charter"
    roles: [Customer, Guide, ShopClerk, ShopManager]
    code: 200
    input: []
    output: Charter
    side_effects: []
  - method: GET
    path: "/api/charters"
    description: "List charters, filterable by guide (reverse-reachability for guide_id)"
    roles: [Customer, Guide, ShopClerk, ShopManager]
    code: 200
    input: ["guide_id?", "limit?", "offset?"]
    output: Charter[]
    side_effects: []
  - method: PUT
    path: "/api/charters/{id}"
    description: "Reschedule a charter (OCC on version); re-checks guide overlap"
    roles: [Guide, ShopManager]
    code: 200
    input: ["expected_charter_version", "start_at?", "end_at?", "capacity?", "price_per_seat_cents?", "fuel_surcharge_cents?"]
    output: Charter
    side_effects: ["updates window/fields; increments Charter.version by 1"]
  - method: POST
    path: "/api/charters/{id}/cancel"
    description: "Cancel a charter; cascades booking cancellation + refunds"
    roles: [Guide, ShopManager]
    code: 200
    input: []
    output: Charter
    side_effects: ["status=CANCELLED; cancel active bookings, full refund to PAID bookings"]

  # ---- CharterBooking ----
  - method: POST
    path: "/api/charter-bookings"
    description: "Book seats on a charter"
    roles: [Customer, ShopClerk]
    code: 201
    input: ["charter_id", "customer_id", "seats", "waitlist_requested?"]
    output: CharterBooking
    side_effects: ["booking_status=RESERVED (or WAITLISTED when full and waitlist_requested); provisional_total_cents=charter_settlement provisional; on RESERVED increment charter.booked_seats and maybe OPEN->FULL"]
  - method: GET
    path: "/api/charter-bookings/{id}"
    description: "Fetch a booking"
    roles: [Customer, ShopClerk, Guide, ShopManager]
    code: 200
    input: []
    output: CharterBooking
    side_effects: []
  - method: GET
    path: "/api/charter-bookings"
    description: "List bookings, filterable by charter or customer (reverse-reachability for both FKs)"
    roles: [Customer, ShopClerk, Guide, ShopManager]
    code: 200
    input: ["charter_id?", "customer_id?", "limit?", "offset?"]
    output: CharterBooking[]
    side_effects: []
  - method: POST
    path: "/api/charter-bookings/{id}/pay"
    description: "Pay for a booking (payment dimension UNPAID->PAID)"
    roles: [Customer, ShopClerk]
    code: 200
    input: []
    output: CharterBooking
    side_effects: ["payment_status=PAID; amount_paid_cents=provisional_total_cents"]
  - method: POST
    path: "/api/charter-bookings/{id}/check-in"
    description: "Check a booking in (attendance dimension RESERVED->CHECKED_IN); requires PAID and non-cancelled charter"
    roles: [ShopClerk, Guide]
    code: 200
    input: []
    output: CharterBooking
    side_effects: []
  - method: POST
    path: "/api/charter-bookings/{id}/complete"
    description: "Complete a checked-in booking; computes final settlement"
    roles: [Guide, ShopClerk]
    code: 200
    input: []
    output: CharterBooking
    side_effects: ["booking_status=COMPLETED; final_total_cents=charter_settlement final"]
  - method: POST
    path: "/api/charter-bookings/{id}/cancel"
    description: "Cancel a booking; releases seats, promotes waitlist, refunds if PAID"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: CharterBooking
    side_effects: ["booking_status=CANCELLED; seat release + waitlist promotion; refund via charter_cancellation_refund when PAID"]

  # ---- Tournament ----
  - method: POST
    path: "/api/tournaments"
    description: "Create a tournament"
    roles: [ShopManager, ShopClerk]
    code: 201
    input: ["name", "species", "start_at", "end_at", "min_qualifying_weight_grams", "entry_fee_cents?", "prize_points?"]
    output: Tournament
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/api/tournaments/{id}"
    description: "Fetch a tournament"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: Tournament
    side_effects: []
  - method: POST
    path: "/api/tournaments/{id}/status"
    description: "Advance tournament lifecycle; FINALIZED runs ranking and awards the winner"
    roles: [ShopManager, ShopClerk]
    code: 200
    input: ["status"]
    output: Tournament
    side_effects: ["on FINALIZED: tournament_ranking, assign final_rank, winner->WINNER + prize_points; on CANCELLED(from OPEN): withdraw entries"]

  # ---- TournamentEntry ----
  - method: POST
    path: "/api/tournament-entries"
    description: "Register a customer for a tournament (must be OPEN, no duplicate)"
    roles: [Customer, ShopClerk]
    code: 201
    input: ["tournament_id", "customer_id"]
    output: TournamentEntry
    side_effects: ["status=REGISTERED"]
  - method: GET
    path: "/api/tournament-entries/{id}"
    description: "Fetch an entry"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: TournamentEntry
    side_effects: []
  - method: GET
    path: "/api/tournament-entries"
    description: "List entries, filterable by tournament or customer (reverse-reachability for both FKs)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["tournament_id?", "customer_id?", "limit?", "offset?"]
    output: TournamentEntry[]
    side_effects: []
  - method: POST
    path: "/api/tournament-entries/{id}/status"
    description: "Check in (requires tournament IN_PROGRESS) or withdraw an entry"
    roles: [Customer, ShopClerk]
    code: 200
    input: ["status"]
    output: TournamentEntry
    side_effects: ["CHECKED_IN requires tournament IN_PROGRESS; WITHDRAWN from REGISTERED/CHECKED_IN"]
  - method: POST
    path: "/api/tournament-entries/{id}/weigh-in"
    description: "Record a weigh-in (append to weigh_ins); requires CHECKED_IN and tournament IN_PROGRESS"
    roles: [ShopClerk]
    code: 200
    input: ["species", "weight_grams"]
    output: TournamentEntry
    side_effects: ["append {species, weight_grams, recorded_at=clock}; if qualifying, status CHECKED_IN->WEIGHED and recompute best_weight_grams"]

  # ---- ServiceOrder ----
  - method: POST
    path: "/api/service-orders"
    description: "Open a rod/reel service or spooling job"
    roles: [Customer, ShopClerk]
    code: 201
    input: ["customer_id", "service_type", "base_service_cents", "product_id?", "line_price_cents_per_meter?", "estimated_line_meters?"]
    output: ServiceOrder
    side_effects: ["status=INTAKE"]
  - method: GET
    path: "/api/service-orders/{id}"
    description: "Fetch a service order"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []
  - method: GET
    path: "/api/service-orders"
    description: "List service orders, filterable by customer or product (reverse-reachability for both FKs)"
    roles: [Customer, ShopClerk, ShopManager]
    code: 200
    input: ["customer_id?", "product_id?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []
  - method: POST
    path: "/api/service-orders/{id}/transition"
    description: "Drive the cyclic service workflow (INTAKE<->DIAGNOSED<->IN_PROGRESS->READY->PICKED_UP, or CANCELLED)"
    roles: [ShopClerk]
    code: 200
    input: ["to_status", "actual_line_meters?", "parts_cents?", "line_units?"]
    output: ServiceOrder
    side_effects: ["per-transition side effects: quote at DIAGNOSED, stock consume at READY, grand_total + loyalty at PICKED_UP, stock restore on cancel from READY"]

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or entity_backed role acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, bad enum, negative constrained integer, end_at <= start_at"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id / path customer does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id / path product does not exist"
  - id: ERR_LICENSE_TYPE_NOT_FOUND
    http: 404
    condition: "license_type_id does not exist"
  - id: ERR_LICENSE_SALE_NOT_FOUND
    http: 404
    condition: "license sale id does not exist"
  - id: ERR_GUIDE_NOT_FOUND
    http: 404
    condition: "guide_id / path guide does not exist"
  - id: ERR_CHARTER_NOT_FOUND
    http: 404
    condition: "charter_id / path charter does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "booking id does not exist"
  - id: ERR_TOURNAMENT_NOT_FOUND
    http: 404
    condition: "tournament_id / path tournament does not exist"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "tournament entry id does not exist"
  - id: ERR_SERVICE_ORDER_NOT_FOUND
    http: 404
    condition: "service order id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not allowed from the resource's current state"
  - id: ERR_CHARTER_NOT_OPEN
    http: 409
    condition: "booking attempted against a charter not in OPEN/FULL (e.g. CANCELLED)"
  - id: ERR_PAYMENT_REQUIRED
    http: 409
    condition: "check-in attempted while booking payment_status != PAID"
  - id: ERR_ALREADY_VOIDED
    http: 409
    condition: "void attempted on a license already VOIDED"
  - id: ERR_TOURNAMENT_NOT_IN_PROGRESS
    http: 409
    condition: "entry check-in or weigh-in attempted while the tournament is not IN_PROGRESS"
  - id: ERR_CUSTOMER_SUSPENDED
    http: 409
    condition: "booking / purchase attempted by a SUSPENDED customer"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_charter_version does not match the charter's current version on reschedule"
  - id: ERR_AGE_REQUIREMENT_NOT_MET
    http: 422
    condition: "customer age at valid_from below LicenseType.min_age"
  - id: ERR_LICENSE_OUT_OF_SEASON
    http: 422
    condition: "license sale attempted outside the license type's sellable season window"
  - id: ERR_GUIDE_SCHEDULE_CONFLICT
    http: 409
    condition: "charter window gap to another non-cancelled charter of the same guide is strictly less than TURNAROUND_BUFFER_MINUTES (=60)"
  - id: ERR_ANGLER_SCHEDULE_CONFLICT
    http: 409
    condition: "booking's charter window overlaps another active booking window of the same customer"
  - id: ERR_LICENSE_REQUIRED
    http: 422
    condition: "customer holds no ACTIVE license covering the charter date"
  - id: ERR_INSUFFICIENT_SEATS
    http: 409
    condition: "requested seats exceed remaining capacity and waitlist not requested"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "line_units exceed the product's stock_qty at READY"
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "customer already has an active entry in this tournament"
  - id: ERR_NO_QUALIFIED_ENTRIES
    http: 409
    condition: "finalize attempted with zero qualifying entries"
  - id: ERR_INSUFFICIENT_POINTS
    http: 402
    condition: "loyalty adjustment would drive loyalty_points_balance below zero"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["POST /api/customers"]
  - name: Customer
    description: "Angler / shopper acting on their own resources"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /api/license-sales (own)"
      - "POST /api/charter-bookings (own)"
      - "POST /api/charter-bookings/{id}/pay (own)"
      - "POST /api/charter-bookings/{id}/cancel (own)"
      - "POST /api/tournament-entries (own)"
      - "POST /api/tournament-entries/{id}/status (own withdraw)"
      - "POST /api/service-orders (own)"
      - "GET own Customer/LicenseSale/CharterBooking/TournamentEntry/ServiceOrder and public catalog"
  - name: ShopClerk
    description: "Front-desk staff running day-to-day counter operations"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/charter-bookings/{id}/check-in"
      - "POST /api/tournament-entries/{id}/weigh-in"
      - "POST /api/service-orders/{id}/transition"
      - "POST /api/products/{id}/restock"
      - "POST /api/license-sales/{id}/void"
    shared_operations:
      - "POST /api/customers"
      - "POST /api/products"
      - "POST /api/license-sales"
      - "POST /api/charter-bookings"
      - "POST /api/charter-bookings/{id}/complete"
      - "POST /api/tournaments"
      - "POST /api/tournaments/{id}/status"
      - "POST /api/tournament-entries"
      - "POST /api/tournament-entries/{id}/status"
      - "POST /api/_clock/set_current_utc"
      - "GET endpoints"
  - name: Guide
    description: "Charter captain managing their own trips"
    identity: "entity_backed:Guide"
    exclusive_operations: []
    shared_operations:
      - "POST /api/charters (own)"
      - "PUT /api/charters/{id} (own)"
      - "POST /api/charters/{id}/cancel (own)"
      - "POST /api/charter-bookings/{id}/check-in (on own charters)"
      - "POST /api/charter-bookings/{id}/complete (on own charters)"
      - "GET charters/bookings/guides"
  - name: ShopManager
    description: "Store manager; hierarchical superset with override and admin powers"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/customers/{id}/status"
      - "POST /api/customers/{id}/loyalty-adjustments"
      - "POST /api/guides"
      - "POST /api/guides/{id}/status"
      - "POST /api/license-types"
    shared_operations:
      - "all ShopClerk operations"
      - "POST /api/charters, PUT /api/charters/{id}, POST /api/charters/{id}/cancel"
      - "POST /api/_clock/set_current_utc"
      - "all GET endpoints"
