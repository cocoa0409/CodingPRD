  - rule_id: compensating_invariant
    instances:
      - name: recognition_points_ledger_conserved_after_retraction
        grounds:
          - calculations.recognition_points_award
          - entities.RecognitionAward.fields.points_awarded
          - entities.Volunteer.fields.lifetime_points
          - state_machines.Observation.ACCEPTED_to_RETRACTED
        distinguishing_aspect: |
          Conserved quantity #1 is reputation points: the invariant
          `Volunteer.lifetime_points == SUM(RecognitionAward.points_awarded WHERE volunteer_id = V)`
          holds before AND after the compensating retraction, which appends a REVERSAL of exactly
          -52 (the sum of the awards carrying observation_id == o1) and deliberately leaves the
          MILESTONE row of 25 - whose observation_id is null - untouched.
        test_recipe:
          setup:
            - "Campaign Autumn Count OPEN with target_observations_per_site 1 and one site S-ONE at priority_weight 1.2"
            - "Observation o1 is ACCEPTED with final_quality_points 52.80 after two confidence-5 votes"
            - "Vera was BRONZE (lifetime_quality_score 0.5) at award time, so points = floor(52.80 * 1.00) = 52; the acceptance then lifted lifetime_quality_score to 1.0000 and PLATINUM, adding a MILESTONE award of 25; lifetime_points is 77"
          setup_api_calls:
