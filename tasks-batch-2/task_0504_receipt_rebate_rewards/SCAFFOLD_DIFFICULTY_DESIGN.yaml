              payload: { member_id: "${ml_id}", method: "PAYPAL", requested_amount_cents: 500, expected_member_version: "${ml_ver}" }
              as: Member
              as_user_id: "${ml_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_BALANCE"
            - "response.status == 422"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cashout_process_requires_member_verified
        grounds:
          - state_machines.CashOut.REQUESTED_to_PROCESSING
          - entities.Member.fields.verification_status
          - validations[priority=12]
        distinguishing_aspect: "CashOut REQUESTED->PROCESSING depends on the Member entity's verification_status==VERIFIED; an UNVERIFIED member's cash-out cannot be processed (ERR_MEMBER_NOT_VERIFIED). Entity pair CashOut->Member."
        test_recipe:
          setup:
            - "UNVERIFIED member with a 1000-cent AVAILABLE claim and a REQUESTED cash-out of 1000."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mm@x.com" }
              as: PlatformAdmin
              captures: { mm_id: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${mm_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mm_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mm_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mm_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${mm_id}"
              payload: {}
              as: Member
              as_user_id: "${mm_id}"
              captures: { mm_ver: $.data.version }
            - call: "POST /cashouts"
              payload: { member_id: "${mm_id}", method: "PAYPAL", requested_amount_cents: 1000, expected_member_version: "${mm_ver}" }
              as: Member
              as_user_id: "${mm_id}"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /cashouts/${co_id}/process"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_NOT_VERIFIED"
            - "response.status == 409"

      - name: receipt_review_start_requires_offer_active
        grounds:
          - state_machines.ReceiptScan.SUBMITTED_to_IN_REVIEW
          - entities.Offer.fields.status
          - validations[priority=8]
        distinguishing_aspect: "ReceiptScan SUBMITTED->IN_REVIEW depends on the Offer entity's status: an EXPIRED offer (clock advanced past expires_at) blocks start-review with ERR_OFFER_INACTIVE. Different entity pair (ReceiptScan->Offer) than CashOut->Member."
        test_recipe:
          setup:
            - "Receipt scan SUBMITTED under an offer that expires 2026-03-01; clock advanced to 2026-04-01 so the offer is EXPIRED."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mn@x.com" }
              as: PlatformAdmin
              captures: { mn_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${mn_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 8000, purchased_at: "2026-02-01T06:00:00Z" }
              as: Member
              as_user_id: "${mn_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FinanceAdmin
          trigger:
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OFFER_INACTIVE"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: online_attribution_window_inclusive_boundary
        grounds:
          - validations[priority=10]
          - entities.Merchant.fields.attribution_window_hours
          - entities.ClickThrough.fields.clicked_at
        distinguishing_aspect: "Interval semantics A (point-in-window, inclusive trailing edge): an online claim is attributable iff now is within [clicked_at, clicked_at + attribution_window_hours]; a click exactly attribution_window_hours=168h before claim time is still IN-window and succeeds. Resource: ClickThrough."
        test_recipe:
          setup:
            - "Merchant attribution_window_hours=168; click at 2026-01-01T00:00:00Z; claim created exactly 168h later at 2026-01-08T00:00:00Z (inclusive edge)."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, attribution_window_hours: 168, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mo@x.com" }
              as: PlatformAdmin
              captures: { mo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${mo_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mo_id}"
              captures: { click_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reward-claims"
              payload: { member_id: "${mo_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mo_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "RewardClaim.${claim_id}.status == PENDING"
            - "RewardClaim.${claim_id}.amount_cents == 1000"

      - name: double_dip_window_24h_buffer_blocks_complementary_reward
        grounds:
          - validations[priority=9]
          - entities.Merchant.fields.double_dip_allowed
          - state_machines.ReceiptScan.IN_REVIEW_to_APPROVED
        distinguishing_aspect: "Interval semantics B (symmetric +/-24h buffer around purchase instant, NOT a trailing window): with double_dip_allowed=false, an in-store receipt approve is rejected because an ONLINE click reward for the same member+merchant falls inside the +/-DOUBLE_DIP_WINDOW_HOURS=24h buffer of the receipt purchase. Resource: ReceiptScan/Merchant, different interval arithmetic (buffer vs trailing window) than the attribution window."
        test_recipe:
          setup:
            - "Merchant double_dip_allowed=false; an ONLINE click reward exists; an in-store receipt for the same merchant within 24h, in IN_REVIEW."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, double_dip_allowed: false, attribution_window_hours: 168, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mp@x.com" }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${mp_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mp_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mp_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mp_id}"
              captures: { online_claim_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${mp_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 8000, purchased_at: "2026-01-02T06:00:00Z" }
              as: Member
              as_user_id: "${mp_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
          trigger:
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "dup" }
              as: ReviewAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DOUBLE_DIP_BLOCKED"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: full_return_clawback_zeroes_reward_credit
        grounds:
          - calculations.clawback_amount
          - state_machines.RewardClaim.AVAILABLE_to_CLAWED_BACK
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = member NET wallet credit from this claim. Forward CLAIM_MATURED (+460) paired with full-return CLAIM_CLAWBACK (-460) leaves the claim's net wallet contribution at exactly 0 and available_balance_cents back to its pre-claim value."
        test_recipe:
          setup:
            - "Member with one matured AVAILABLE in-store claim of 460 (purchase 8000); then a full return of 8000."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mq@x.com" }
              as: PlatformAdmin
              captures: { mq_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${mq_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 8000, purchased_at: "2026-01-01T06:00:00Z" }
              as: Member
              as_user_id: "${mq_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "ok" }
              as: ReviewAgent
              captures: { claim_id: $.data.reward_claim_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
          trigger:
            - call: "POST /return-events"
              payload: { reward_claim_id: "${claim_id}", returned_amount_cents: 8000 }
              as: FinanceAdmin
              captures: { re_id: $.data.id, claw: $.data.clawback_cents }
          assert:
            - "ReturnEvent.${re_id}.clawback_cents == 460"
            - "RewardClaim.${claim_id}.status == CLAWED_BACK"
            - "Member.${mq_id}.available_balance_cents == 0"
            - "Member.${mq_id}.pending_balance_cents == 0"

      - name: failed_cashout_reversal_conserves_available_balance
        grounds:
          - state_machines.CashOut.PROCESSING_to_FAILED
          - state_machines.RewardClaim.RESERVED_to_AVAILABLE
          - entities.Member.fields.available_balance_cents
          - entities.Member.fields.reserved_balance_cents
        distinguishing_aspect: "Conserved quantity = member AVAILABLE balance (different from instance 1's net-claim-credit). Forward reservation (AVAILABLE->RESERVED on cash-out create) paired with the FAILED settlement compensation (RESERVED->AVAILABLE) restores available_balance_cents to its pre-cashout value and reserved_balance_cents to 0."
        test_recipe:
          setup:
            - "Member VERIFIED with a 1000-cent AVAILABLE claim; a PAYPAL cash-out of 1000 created (reserves it) and moved to PROCESSING."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mr@x.com" }
              as: PlatformAdmin
              captures: { mr_id: $.data.id }
            - call: "POST /members/${mr_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${mr_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mr_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mr_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mr_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${mr_id}"
              payload: {}
              as: Member
              as_user_id: "${mr_id}"
              captures: { mr_ver: $.data.version }
            - call: "POST /cashouts"
              payload: { member_id: "${mr_id}", method: "PAYPAL", requested_amount_cents: 1000, expected_member_version: "${mr_ver}" }
              as: Member
              as_user_id: "${mr_id}"
              captures: { co_id: $.data.id }
            - call: "POST /cashouts/${co_id}/process"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /cashouts/${co_id}/settle"
              payload: { outcome: "FAILED" }
              as: FinanceAdmin
          assert:
            - "CashOut.${co_id}.status == FAILED"
            - "RewardClaim.${claim_id}.status == AVAILABLE"
            - "Member.${mr_id}.available_balance_cents == 1000"
            - "Member.${mr_id}.reserved_balance_cents == 0"
