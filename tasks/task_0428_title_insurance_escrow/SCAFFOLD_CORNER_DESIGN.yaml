              captures: { d_id: $.data.id }
            - call: "POST /title/deposits/${d_id}/transitions"
              payload: { to_status: "POSTED" }
              as: Underwriter
            - call: "GET /title/orders/${o_id}"
              as: Underwriter
              captures: { o_v_pre_disb: $.data.version }
            - call: "POST /title/orders/${o_id}/disbursements"
              payload: { payee: "Seller", amount_cents: 300000, purpose: "SELLER_PROCEEDS", wire_window_start: "2026-01-20T09:00:00Z", wire_window_end: "2026-01-20T10:00:00Z", expected_order_version: "${o_v_pre_disb}" }
              as: Underwriter
