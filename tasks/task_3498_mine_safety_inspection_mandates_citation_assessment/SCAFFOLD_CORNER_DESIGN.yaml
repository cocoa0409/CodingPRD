# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3498_mine_safety_inspection_mandates_citation_assessment
#
# Breadth probe over every testable claim in SCAFFOLD.yaml §1.1–§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# covers appear as excluded_because stubs. Every recipe replays from empty-DB
# through §1.5 endpoints only; anchored call fragments are defined on first
# use and reused within this file.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: operator_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Operator
          - endpoints.POST_/msha/operators
        distinguishing_aspect: "A minimal operator POST returns 201 with the input fields round-tripped, version 1, and server-minted id/created_at/updated_at; none of id/version may come from the payload."
        test_recipe:
          setup:
            - "Empty database; logical clock explicitly unset for this instance only — see clock_default instance for the startup default claim; here the clock is pinned."
          setup_api_calls:
            - &clk_feb10_0800
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T08:00:00Z" }
              as: MSHAAdmin
          trigger:
            - &mk_operator
              call: "POST /msha/operators"
              payload: { legal_name: "Canyon Coal Co", annual_tonnage_tons: 1000, home_district: "D-11" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Operator.${op_id}.legal_name == \"Canyon Coal Co\" and annual_tonnage_tons == 1000 and home_district == \"D-11\""
            - "Operator.${op_id}.version == 1 and id is a dashed UUID and created_at == updated_at == 2026-02-10T08:00:00.000Z (three fractional digits)"

      - name: mine_create_derives_posture_defaults
        claim_type: Defaults
        grounds:
          - entities.Mine.fields.status
          - entities.Mine.fields.production_status
          - entities.Mine.fields.pov_status
        distinguishing_aspect: "Mine creation never takes status fields from the client: a new mine starts status=ACTIVE, production_status=NORMAL, pov_status=NONE, and owns zero cycles until one is explicitly opened."
        test_recipe:
          setup:
            - "One operator exists."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
          trigger:
            - &mk_mine_ug
              call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Canyon No 1", mine_type: "UNDERGROUND", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { m_id: $.data.id }
            - call: "GET /msha/mines/${m_id}/inspection-cycles"
              payload: {}
              as: DistrictManager
          assert:
            - "Mine.${m_id}.status == ACTIVE and production_status == NORMAL and pov_status == NONE"
            - "Mine.${m_id}.version == 1"
            - "the cycles list is empty (total_count == 0) until POST inspection-cycles opens one"

      - name: mine_create_missing_mine_type_rejected
        claim_type: Required Fields
        grounds:
          - entities.Mine.fields.mine_type
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "mine_type is required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the request-shape check that runs before any existence or business rule."
        test_recipe:
          setup:
            - "One operator exists."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
          trigger:
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Nameless Type Mine", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_INVALID_REQUEST"
            - "no Mine resource is created (the operator's mines list stays empty)"

      - name: mine_create_invalid_mine_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Mine.fields.mine_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "An enum value outside {UNDERGROUND, SURFACE} is rejected 400 even though every other field is valid — enum closure is enforced at the shape check, not mapped to a default."
        test_recipe:
          setup:
            - "One operator exists."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
          trigger:
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Open Pit Mine", mine_type: "OPEN_PIT", activation_date: "2026-01-01" }
              as: MSHAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_INVALID_REQUEST"

      - name: mine_create_undeclared_status_field_rejected
        claim_type: System Fields
        grounds:
          - entities.Mine.fields.status
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "status is source system; a client that smuggles status into the create payload gets 400 ERR_INVALID_REQUEST for an undeclared field — system fields cannot be seeded at creation."
        test_recipe:
          setup:
            - "One operator exists."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
          trigger:
            - call: "POST /msha/mines"
              payload: { operator_id: "${op_id}", mine_name: "Pre-idled Mine", mine_type: "SURFACE", activation_date: "2026-01-01", status: "IDLED" }
              as: MSHAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_INVALID_REQUEST"

      - name: citation_get_round_trips_computed_fields
        claim_type: Retrieval
        grounds:
          - entities.Citation
          - endpoints.GET_/msha/citations/{citationId}
        distinguishing_aspect: "GET returns the stored citation with the computed abatement fields derived at issuance: NO_INJURY severity gives abatement_base_days 30 and abatement_deadline exactly issued_at + 30 days."
        test_recipe:
          setup:
            - "Operator, UNDERGROUND mine, one inspector, SPOT inspection IN_PROGRESS; citation issued at 2026-02-10T09:00:00Z with severity NO_INJURY."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - &mk_insp1
              call: "POST /msha/inspectors"
              payload: { full_name: "R. Alvarez", badge_number: "INSP-100", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i1: $.data.id }
            - &mk_spot_feb10
              call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-02-10T08:00:00Z", planned_end_at: "2026-02-10T17:00:00Z" }
              as: DistrictManager
              captures: { insp1: $.data.id }
            - &mk_review1
              call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - &mk_start1
              call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - &clk_feb10_0900
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-10T09:00:00Z" }
              as: MSHAAdmin
            - &mk_citation_low
              call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", negligence: "LOW", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
          trigger:
            - call: "GET /msha/citations/${cit1}"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
          assert:
            - "the response is 200 and Citation.${cit1}.issued_at == 2026-02-10T09:00:00Z"
            - "Citation.${cit1}.abatement_base_days == 30 and abatement_deadline == 2026-03-12T09:00:00Z"
            - "Citation.${cit1}.abatement_status == OPEN and contest_status == UNCONTESTED and abatement_extended == false"
            - "Citation.${cit1}.issued_by_inspector_id == ${i1} and system_issued == false"

      - name: citations_list_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/msha/citations
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three citations at one mine, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "One SPOT inspection IN_PROGRESS; three citations issued on it at 2026-02-10T09:00:00Z."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
            - *mk_citation_low
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.380", kind: "CITATION", negligence: "LOW", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.400", kind: "CITATION", negligence: "MODERATE", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
          trigger:
            - call: "GET /msha/citations"
              payload: { mine_id: "${m_id}", limit: 2, offset: 0 }
              as: DistrictManager
          assert:
            - "the response is 200 with response_type array and exactly 2 rows, total_count == 3, has_more == true"
            - "GET with limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET with mine_id=${m_id} and significant_and_substantial=false returns all 3 rows; abatement_status=OPEN returns all 3"

      - name: citation_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/msha/citations/{citationId}
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID answers 404 ERR_NOT_FOUND with the error envelope, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database except the pinned clock."
          setup_api_calls:
            - *clk_feb10_0800
          trigger:
            - call: "GET /msha/citations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistrictManager
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with error_id ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: inspection_create_with_unknown_mine_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Inspection.fields.mine_id
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A body FK that does not resolve (mine_id never registered) is rejected 404 ERR_NOT_FOUND at the existence check even though the inspector id is valid."
        test_recipe:
          setup:
            - "One inspector exists; no mines."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_insp1
          trigger:
            - call: "POST /msha/inspections"
              payload: { mine_id: "00000000-0000-4000-8000-000000000000", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-02-10T08:00:00Z", planned_end_at: "2026-02-10T17:00:00Z" }
              as: DistrictManager
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with error_id ERR_NOT_FOUND"

      - name: clock_default_at_startup_is_fixed_epoch
        claim_type: Defaults
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z — proven by creating an operator with no clock call first and observing created_at."
        test_recipe:
          setup:
            - "Empty database; the clock has never been set."
          setup_api_calls: []
          trigger:
            - call: "POST /msha/operators"
              payload: { legal_name: "Epoch Probe Co", annual_tonnage_tons: 1000, home_district: "D-00" }
              as: MSHAAdmin
              captures: { op_id: $.data.id }
          assert:
            - "Operator.${op_id}.created_at == 2026-09-01T00:00:00.000Z (the pinned startup default, not wall-clock time)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: inspection_starts_in_assigned_with_null_review
        claim_type: Initial State
        grounds:
          - state_machines.Inspection
          - entities.Inspection.fields.status
        distinguishing_aspect: "A newly assigned inspection is ASSIGNED with file_reviewed_at, actual_entry_at, completed_at all null — entry work is impossible before the review transition fires."
        test_recipe:
          setup:
            - "Operator, mine, inspector."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
          trigger:
            - *mk_spot_feb10
          assert:
            - "Inspection.${insp1}.status == ASSIGNED"
            - "Inspection.${insp1}.file_reviewed_at is null and actual_entry_at is null and completed_at is null"
            - "Inspection.${insp1}.version == 1"

      - name: inspection_complete_from_assigned_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Inspection
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "complete is only listed from IN_PROGRESS; from ASSIGNED it must fail ERR_INVALID_STATE and leave no completed_at or cycle credit behind."
        test_recipe:
          setup:
            - "SPOT inspection created, never reviewed or started."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
          trigger:
            - call: "POST /msha/inspections/${insp1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_INVALID_STATE"
            - "Inspection.${insp1}.status remains ASSIGNED and completed_at is null"

      - name: cancelled_inspection_rejects_all_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Inspection.ASSIGNED_to_CANCELLED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is terminal: file-review, start, complete and reassign on a cancelled inspection all fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "SPOT inspection created then cancelled by the district manager."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - call: "POST /msha/inspections/${insp1}/cancel"
              payload: {}
              as: DistrictManager
          trigger:
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { err_review: $.data.error_id }
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
              captures: { err_start: $.data.error_id }
          assert:
            - "both calls answer 409 ERR_INVALID_STATE"
            - "Inspection.${insp1}.status remains CANCELLED"

      - name: ido_terminated_locks_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ImminentDangerOrder
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "TERMINATED is terminal for an imminent-danger order: a second confirm-withdrawal against it fails ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "IDO fully processed to TERMINATED (issued 2026-03-01T10:00, withdrawal confirmed 11:00, verified 2026-03-03 by inspector 2, terminated 2026-03-05T15:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T09:00:00Z" }
              as: MSHAAdmin
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - &mk_insp2
              call: "POST /msha/inspectors"
              payload: { full_name: "T. Okafor", badge_number: "INSP-200", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i2: $.data.id }
            - &clk_mar01_1000
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T10:00:00Z" }
              as: MSHAAdmin
            - &mk_ido1
              call: "POST /msha/imminent-danger-orders"
              payload: { mine_id: "${m_id}", hazard_description: "roof sag over the belt line" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { ido1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T11:00:00Z" }
              as: MSHAAdmin
            - &mk_ido1_confirm
              call: "POST /msha/imminent-danger-orders/${ido1}/confirm-withdrawal"
              payload: { miners_withdrawn_count: 12 }
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-03T09:00:00Z" }
              as: MSHAAdmin
            - &mk_ido1_verify
              call: "POST /msha/imminent-danger-orders/${ido1}/verify-abatement"
              payload: { abatement_note: "roof bolted and monitored" }
              as: Inspector
              as_user_id: "${i2}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-05T15:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/imminent-danger-orders/${ido1}/terminate"
              payload: {}
              as: DistrictManager
          trigger:
            - call: "POST /msha/imminent-danger-orders/${ido1}/confirm-withdrawal"
              payload: { miners_withdrawn_count: 12 }
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_INVALID_STATE"
            - "ImminentDangerOrder.${ido1}.status remains TERMINATED"

      - name: contest_decided_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Contest
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "After DECIDED the contest machine accepts no further transitions: a second decide answers ERR_INVALID_STATE and the citation's outcome is unchanged."
        test_recipe:
          setup:
            - "Citation contested, docketed, and decided AFFIRMED at 2026-02-20."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
            - &mk_citation_low_v
              call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", negligence: "LOW", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id, cv1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-12T10:00:00Z" }
              as: MSHAAdmin
            - &mk_contest1
              call: "POST /msha/contests"
              payload: { citation_id: "${cit1}", expected_citation_version: "${cv1}", grounds: "amount disputed" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { con1: $.data.id }
            - call: "POST /msha/contests/${con1}/docket"
              payload: {}
              as: CommissionJudge
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-20T10:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/contests/${con1}/decide"
              payload: { outcome: "AFFIRMED" }
              as: CommissionJudge
          trigger:
            - call: "POST /msha/contests/${con1}/decide"
              payload: { outcome: "VACATED" }
              as: CommissionJudge
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_INVALID_STATE"
            - "Contest.${con1}.status remains DECIDED with outcome AFFIRMED"
            - "Citation.${cit1}.contest_status remains AFFIRMED"

      - name: ido_termination_resumes_mine_and_inspection
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ImminentDangerOrder.ABATEMENT_VERIFIED_to_TERMINATED
          - state_machines.Inspection.SUSPENDED_to_IN_PROGRESS
        distinguishing_aspect: "Terminating the last active order is the compensating half of the halt cascade: mine production returns to NORMAL and the SUSPENDED inspection resumes IN_PROGRESS, both observable in the same read-back."
        test_recipe:
          setup:
            - "Mine with SPOT inspection IN_PROGRESS; IDO issued at 2026-03-01T10:00 referencing the inspection (mine HALTED, inspection SUSPENDED); withdrawal confirmed; verified by inspector 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T08:00:00Z" }
              as: MSHAAdmin
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_insp2
            - call: "POST /msha/inspections"
              payload: { mine_id: "${m_id}", inspector_id: "${i1}", kind: "SPOT", planned_start_at: "2026-03-01T08:00:00Z", planned_end_at: "2026-03-01T17:00:00Z" }
              as: DistrictManager
              captures: { insp1: $.data.id }
            - call: "POST /msha/inspections/${insp1}/file-review"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/inspections/${insp1}/start"
              payload: {}
              as: Inspector
              as_user_id: "${i1}"
            - *clk_mar01_1000
            - call: "POST /msha/imminent-danger-orders"
              payload: { mine_id: "${m_id}", hazard_description: "methane pocket", inspection_id: "${insp1}" }
              as: Inspector
              as_user_id: "${i1}"
              captures: { ido1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T11:00:00Z" }
              as: MSHAAdmin
            - *mk_ido1_confirm
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-03T09:00:00Z" }
              as: MSHAAdmin
            - *mk_ido1_verify
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-05T15:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/imminent-danger-orders/${ido1}/terminate"
              payload: {}
              as: DistrictManager
          assert:
            - "ImminentDangerOrder.${ido1}.status == TERMINATED and terminated_at == 2026-03-05T15:00:00Z"
            - "Mine.${m_id}.production_status == NORMAL again"
            - "Inspection.${insp1}.status == IN_PROGRESS again (resume cascade)"

      - name: reassign_to_conflicted_inspector_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Inspection.FILE_REVIEWED_to_ASSIGNED
          - errors.ERR_INSPECTOR_CONFLICT
        distinguishing_aspect: "Conflict avoidance is re-checked on reassignment: an inspector whose conflicted_operator_ids contains the mine's operator cannot take the inspection over, and the original assignment survives."
        test_recipe:
          setup:
            - "Inspector 1 assigned; inspector 2 is conflicted against the operator (prior employment)."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - call: "POST /msha/inspectors"
              payload: { full_name: "P. Reyes", badge_number: "INSP-300", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: [] }
              as: MSHAAdmin
              captures: { i3: $.data.id }
            - *mk_spot_feb10
          trigger:
            - call: "POST /msha/inspectors"
              payload: { full_name: "S. Conflict", badge_number: "INSP-400", district_code: "D-11", certification: "BOTH", conflicted_operator_ids: ["${op_id}"] }
              as: MSHAAdmin
              captures: { i4: $.data.id }
            - call: "POST /msha/inspections/${insp1}/reassign"
