  # ==========================================================================
  - section: errors
    instances:
      - name: reconcile_delta_over_tolerance_without_override
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RECONCILE_DELTA_EXCEEDS_TOLERANCE]"
        distinguishing_aspect: "Partner reconcile with delta > 500 and no override returns ERR_RECONCILE_DELTA_EXCEEDS_TOLERANCE."
        test_recipe:
          setup: ["PartnerBillingRecord RECEIVED with delta=600"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/accounts"
              payload: { email: "pb@x.com", full_name: "PB", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/partner-billing-records"
              payload: { partner_code: "APPLE", account_id: "${acc_id}", partner_subscription_ref: "ref", expected_amount_cents: 10000, period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-08-31T00:00:00Z" }
              as: PartnerBillingOps
              captures: { pbr_id: $.data.partner_billing_record_id }
            - call: "POST /v1/partner-billing-records/${pbr_id}/report-receipt"
              payload: { received_amount_cents: 10600 }
              as: PartnerBillingOps
            - call: "GET /v1/partner-billing-records/${pbr_id}"
              payload: {}
              as: PartnerBillingOps
              captures: { pbr_v: $.data.version }
          trigger:
            - call: "POST /v1/partner-billing-records/${pbr_id}/reconcile"
              payload: { expected_partner_billing_record_version: "${pbr_v}" }
              as: PartnerBillingOps
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_RECONCILE_DELTA_EXCEEDS_TOLERANCE"

      - name: stale_version_on_change_plan_returns_412
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STALE_VERSION]"
          - "concurrency_rules[subscription-plan-change-occ]"
        distinguishing_aspect: "change-plan with stale expected_subscription_version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Subscription ACTIVE at version=1; client captured version=1; subscription mutated (cancel then re-created scenario avoided — use a save-offer accept to bump version)"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/plans"
              payload: { plan_code: "PREMIUM", display_name: "Premium", tier: "PREMIUM", monthly_price_cents: 6000, trial_days: 0, max_profiles: 5, max_households: 2 }
              as: PlatformAdmin
              captures: { plan_prem_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "occ@x.com", full_name: "OCC", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id, sub_v_initial: $.data.version }
            - call: "POST /v1/subscriptions/${sub_id}/pause"
              payload: { duration_months: 1 }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/change-plan"
              payload: { target_plan_id: "${plan_prem_id}", expected_subscription_version: "${sub_v_initial}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_STALE_VERSION (initial version is stale because pause bumped it)"

