      - name: appointment_buffered_interval_semantics
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_APPOINTMENT_CONFLICT]"
        distinguishing_aspect: |
          Interval semantics: continuous half-open [start_at, end_at) with a
