              captures: { ci2_st_status: $.data.status, ci2_st_net: $.data.net_cents }
          assert:
            - "post-finalize wallet (${ci2_bal_post_finalize}) == 98000"
            - "after dispute wallet (${ci2_bal_disputed}) == 100000 (full net 2000 credited back)"
            - "after resolve-dispute with adjustment 0 wallet (${ci2_bal_resolved}) == 98000 — exactly the post-finalize value, zero drift"
            - "BillingStatement.${ci2_st}.status == FINALIZED and net_cents == 2000"
