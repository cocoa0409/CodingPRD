# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2191_retail_media_network_campaign_operations
#
# Nine rule_id blocks in canonical §0.5 order. Generated as three concurrent
# shards (rules 1-3 / 4-6 / 7-9) and merged here by the orchestrator; the shard
# boundaries carry no semantics.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_geo_vs_user_holdout_lift_divergence
        grounds:
          - calculations.incremental_sales_lift
          - state_machines.IncrementalityStudy.DESIGNED_to_RUNNING
          - state_machines.IncrementalityStudy.RUNNING_to_MEASURING
          - entities.IncrementalityStudy.fields.design_method
          - entities.IncrementalityStudy.fields.lift_pct
          - entities.IncrementalityStudy.fields.incremental_sales_cents
          - entities.IncrementalityStudy.fields.significance_score
          - validations[priority=52]
          - validations[priority=50]
          - concurrency_rules[study-create-stale-campaign]
        distinguishing_aspect: |
          This dual-variant calculation lives on the IncrementalityStudy measurement domain: two studies fed byte-identical cohort counters return incremental_sales_cents == 16000480 under GEO_HOLDOUT (rate-ratio basis) and 12500000 under USER_HOLDOUT (scaled-control-difference basis), a 3500480-cent divergence caused solely by design_method.
        test_recipe:
          setup:
            - "Advertiser ACME-GLOBAL exists with onboarding_status == ACTIVE and service_model == MANAGED (study start requires an ACTIVE advertiser)."
            - "One APPROVED BudgetPlan for fiscal_period_code 2026-Q3 spanning [2026-08-01, 2026-10-01) with committed_total_cents == 40000000 and trade_fund_share_cents == 0 funds both campaigns."
            - "Two campaigns are in delivery_status SCHEDULED — CAMP-GEO and CAMP-USER — each with flight [2026-08-01, 2026-08-11) inside the plan window, because IncrementalityStudy DESIGNED -> RUNNING requires the campaign to be SCHEDULED or DELIVERING."
            - "Each campaign carries exactly one PENDING_ELIGIBILITY line item on a shared ONSITE slot with max_concurrent_line_items == 3, the minimum needed for Campaign DRAFT -> PENDING_REVIEW; no auction is ever run, so delivered_spend_cents stays 0 on both campaigns."
            - "Each campaign carries exactly one DESIGNED IncrementalityStudy over the identical window [2026-08-01, 2026-08-11); the studies sit on different campaigns so study_window_washout cannot collide."
            - "Both studies are RUNNING with exposed_group_size == 50000 and control_group_size == 20000."
            - "Logical clock is advanced to 2026-08-11T00:00:00Z so clock_now >= window_end_at and measurement is permitted."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Acme Global Brands LLC", brand_code: "ACMEGLB", service_model: "MANAGED", credit_limit_cents: 100000000, account_manager_user_id: "am-7", managed_service_fee_pct: 0.05 }
              as: NetworkAdmin
              as_user_id: "adm-1"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 3 }
              as: AccountManager
              as_user_id: "am-7"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE", decision_note: "KYC cleared" }
              as: CreditAnalyst
              as_user_id: "ca-3"
              captures: { adv_v_active: $.data.version }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 40000000, trade_fund_share_cents: 0, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${adv_v_active}" }
              as: AccountManager
              as_user_id: "am-7"
              captures: { plan_id: $.data.id }
            - call: "POST /rmn/budget-plans/${plan_id}/submit"
              payload: { submission_note: "2026-Q3 measurement fixture plan" }
              as: AccountManager
              as_user_id: "am-7"
            - call: "POST /rmn/budget-plans/${plan_id}/approve"
              payload: { approval_note: "credit headroom confirmed" }
              as: CreditAnalyst
              as_user_id: "ca-3"
            - call: "POST /rmn/placement-slots"
              payload: { slot_code: "INC-SLOT-1", channel: "ONSITE", page_type: "SEARCH_RESULTS", position_index: 1, max_concurrent_line_items: 3, floor_cpc_cents: 1250, relevance_weight: 1.0, buffer_minutes: 0 }
              as: NetworkAdmin
              as_user_id: "adm-1"
              captures: { slot_id: $.data.id }
            - call: "POST /rmn/catalog-products"
              payload: { sku: "SKU-INC-COFFEE-01", category_code: "GROCERY", title: "Cold Brew Coffee Concentrate 1L", price_cents: 1499, in_stock_units: 500, margin_pct: 0.40, min_stock_units_for_serving: 3 }
