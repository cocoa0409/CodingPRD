        distinguishing_aspect: "The 2x posture multiplier applies only when earn_context == FEED AND posture == FALL_FEED: the same 10000-cent purchase earns 200 points as FEED in FALL_FEED, 100 as OTHER in FALL_FEED, and 100 as FEED under WINTER_HEATING."
