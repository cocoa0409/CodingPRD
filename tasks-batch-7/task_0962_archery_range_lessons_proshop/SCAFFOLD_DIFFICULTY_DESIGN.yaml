              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-02T10:30:00Z", end_at: "2026-05-02T11:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WAIVER_EXPIRED with http 422 (priority 6 safety beats priority 7 constraint)"
            - "no new session created on lane ${lane_id}"
  - rule_id: boundary_precision_check
    instances:
      - name: punch_exhaustion_at_exact_last_punch
        grounds:
          - state_machines.PunchCard.ACTIVE_to_EXHAUSTED
