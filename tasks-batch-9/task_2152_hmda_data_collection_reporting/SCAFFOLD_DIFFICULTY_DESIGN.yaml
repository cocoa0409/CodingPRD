              as: LoanOfficer
            - call: "POST /hmda/applications/${w1_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
            - call: "POST /hmda/applications/${w1_id}/action-taken"
              payload: { action_taken: "ORIGINATED", action_taken_date: "2026-03-10T00:00:00Z", rate_spread: 1.10, purchaser_type: "NOT_APPLICABLE" }
              as: LoanOfficer
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000012", application_date: "2026-02-01T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 30000000, income_thousands: 90 }
              as: LoanOfficer
              captures: { w2_id: $.data.id }
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${w2_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "FEMALE" }
