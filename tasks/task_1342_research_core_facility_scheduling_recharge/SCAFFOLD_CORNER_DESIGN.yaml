            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:00:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { err: $.data.error_id } }
