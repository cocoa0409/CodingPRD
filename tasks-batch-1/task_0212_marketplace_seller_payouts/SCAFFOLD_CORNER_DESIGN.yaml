scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_seller_returns_201_with_onboarding_defaults
        claim_type: Creation
        grounds: [entities.Seller, endpoints]
        distinguishing_aspect: "POST /sellers with all required fields returns 201, kyc_status PENDING, w9_status NOT_SUBMITTED, account_status ONBOARDING, risk_tier STANDARD."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Aardvark LLC", email: "aard@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1000" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
          assert:
            - "response code == 201"
            - "Seller.${seller_id}.kyc_status == PENDING"
            - "Seller.${seller_id}.w9_status == NOT_SUBMITTED"
            - "Seller.${seller_id}.account_status == ONBOARDING"
            - "Seller.${seller_id}.risk_tier == STANDARD"
            - "Seller.${seller_id}.version == 1"

      - name: get_seller_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Seller, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /sellers/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sellers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformReviewer
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_seller_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Seller, "validations[priority=17]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /sellers missing legal_name returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sellers"
              payload: { email: "noname@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1001" }
              as: PlatformReviewer
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_seller_invalid_country_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Seller.fields.country_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /sellers with country_code not in {US,CA,GB,DE,AU} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sellers"
              payload: { legal_name: "Bad Country", email: "bc@x.com", country_code: "FR", tax_classification: "LLC", tin_last4: "1002" }
              as: PlatformReviewer
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: order_computed_fees_ignore_client_supplied_values
        claim_type: Computed Fields
        grounds: [entities.Order.fields.commission_cents, entities.Order.fields.net_earnings_cents, calculations.order_net_earnings]
        distinguishing_aspect: "POST /orders prices commission_cents/net_earnings_cents from the schedule; only seller_id, category, gross_amount_cents are inputs, so server-computed fees are authoritative (commission 1500 for gross 10000)."
        test_recipe:
          setup: ["ELECTRONICS schedule active; seller exists"]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Comp Co", email: "comp@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1003" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.commission_cents == 1500"
            - "Order.${order_id}.net_earnings_cents == 8130"
            - "Order.${order_id}.settlement_status == PENDING"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields:false — it is append-only, carries only id+created_at, has no update endpoint and no version field."
        test_recipe:
          setup: ["Seller with one order so an ORDER_PROCEEDS ledger entry exists"]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Imm Co", email: "imm@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1004" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
          trigger:
            - call: "GET /sellers/${seller_id}/ledger-entries"
              payload: {}
              as: PlatformFinance
          assert:
            - "ledger entries list contains exactly one ORDER_PROCEEDS entry with amount_cents 8130 and hold_state PENDING"
            - "no PUT/PATCH endpoint exists for ledger entries"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: kyc_decision_from_pending_without_in_review_returns_invalid_state
        claim_type: Invalid Transition
        grounds: [state_machines.Seller.ONBOARDING_to_ONBOARDING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "kyc/decision requires kyc_status IN_REVIEW; calling it while still PENDING (no kyc/submit) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Seller freshly created (kyc_status PENDING)"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "Inv Co", email: "inv@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1005" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /sellers/${seller_id}/kyc/decision"
              payload: { decision: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Seller.${seller_id}.kyc_status == PENDING"

      - name: closed_seller_terminal_lockdown_reinstate_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Seller.ACTIVE_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal CLOSED, reinstate (or any seller transition) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Seller created then CLOSED while still ONBOARDING-eligible-to-close (no open orders)"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "Term Co", email: "term@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1006" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /sellers/${seller_id}/kyc/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/kyc/decision"
              payload: { decision: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /sellers/${seller_id}/w9/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /payout-methods"
              payload: { seller_id: "${seller_id}", method_type: "ACH", account_last4: "5678", currency: "USD" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { pm_id: $.data.id, mdc: $.data.micro_deposit_code }
            - call: "POST /payout-methods/${pm_id}/verify"
              payload: { micro_deposit_code: "${mdc}" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/w9/approve"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /sellers/${seller_id}/close"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /sellers/${seller_id}/reinstate"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Seller.${seller_id}.account_status == CLOSED"

      - name: refund_apply_twice_idempotency_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Refund.REQUESTED_to_APPLIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Applying the same refund twice: the second apply observes refund_status APPLIED and is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order gross 10000; refund 2000 APPLIED once"]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Idem Co", email: "idem@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1007" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /refunds"
              payload: { order_id: "${order_id}", refund_amount_cents: 2000, reason: "DAMAGED" }
              as: PlatformFinance
              captures: { refund_id: $.data.id }
            - call: "POST /refunds/${refund_id}/apply"
              payload: {}
              as: PlatformFinance
          trigger:
            - call: "POST /refunds/${refund_id}/apply"
              payload: {}
              as: PlatformFinance
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Refund.${refund_id}.refund_status == APPLIED"

      - name: payout_method_verify_third_wrong_code_moves_to_failed
        claim_type: Valid Transition
        grounds: [state_machines.PayoutMethod.UNVERIFIED_to_FAILED, "errors[ERR_BAD_MICRO_DEPOSIT_CODE]"]
        distinguishing_aspect: "Two wrong codes return ERR_BAD_MICRO_DEPOSIT_CODE while staying UNVERIFIED; the third wrong attempt flips verification_status to FAILED."
        test_recipe:
          setup: ["Seller with an UNVERIFIED payout method"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "Fail PM", email: "failpm@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1008" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /payout-methods"
              payload: { seller_id: "${seller_id}", method_type: "ACH", account_last4: "5678", currency: "USD" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /payout-methods/${pm_id}/verify"
              payload: { micro_deposit_code: "WRONG1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /payout-methods/${pm_id}/verify"
              payload: { micro_deposit_code: "WRONG2" }
              as: Seller
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /payout-methods/${pm_id}/verify"
              payload: { micro_deposit_code: "WRONG3" }
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "PayoutMethod.${pm_id}.verification_status == FAILED"

      - name: dispute_open_review_after_three_rounds_returns_round_exhausted
        claim_type: cyclic
        grounds: [state_machines.Dispute.SELLER_RESPONDED_to_UNDER_REVIEW, "validations[priority=13]", "errors[ERR_DISPUTE_ROUND_EXHAUSTED]"]
        distinguishing_aspect: "After response_round reaches 3, open-review is rejected with ERR_DISPUTE_ROUND_EXHAUSTED, terminating the cycle."
        test_recipe:
          setup: ["Dispute driven through three respond rounds (response_round == 3, status SELLER_RESPONDED)"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "Cyc Co", email: "cyc@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1009" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { category: "MEDIA", commission_bps: 1200, fixed_fee_cents: 40, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "MEDIA", gross_amount_cents: 9000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /disputes"
              payload: { order_id: "${order_id}", claim_type: "ITEM_NOT_RECEIVED" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
              captures: { dispute_id: $.data.id }
            - call: "POST /disputes/${dispute_id}/open-review"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /disputes/${dispute_id}/respond"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /disputes/${dispute_id}/open-review"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /disputes/${dispute_id}/respond"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /disputes/${dispute_id}/open-review"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /disputes/${dispute_id}/respond"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /disputes/${dispute_id}/open-review"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response code == 422"
            - "response error_id == ERR_DISPUTE_ROUND_EXHAUSTED"
            - "Dispute.${dispute_id}.response_round == 3"

      - name: dispute_granted_cascades_clawback_and_balance
        claim_type: Cross-entity
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_GRANTED, state_machines.Order_clawback.NONE_to_REFUND_CLAWED, entities.Order.fields.clawback_status]
        distinguishing_aspect: "A GRANTED A-to-Z claim debits the seller full gross via a REFUND_CLAWBACK ledger entry and flips the order to REFUND_CLAWED."
        test_recipe:
          setup: ["Order gross 9000; dispute FILED then UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { legal_name: "Grant Co", email: "grant@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1010" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { category: "MEDIA", commission_bps: 1200, fixed_fee_cents: 40, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "MEDIA", gross_amount_cents: 9000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /disputes"
              payload: { order_id: "${order_id}", claim_type: "ITEM_NOT_RECEIVED" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
              captures: { dispute_id: $.data.id }
            - call: "POST /disputes/${dispute_id}/open-review"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /disputes/${dispute_id}/decision"
              payload: { outcome: "GRANTED" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Dispute.${dispute_id}.dispute_status == GRANTED"
            - "Dispute.${dispute_id}.granted_amount_cents == 9000"
            - "Order.${order_id}.clawback_status == REFUND_CLAWED"

      - name: order_maturation_to_available_excluded_difficulty_overlap
        claim_type: Side Effect Execution
        grounds: [state_machines.Order.PENDING_to_AVAILABLE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / order_maturation_window_half_open_lower_bound_inclusive
          rationale: "Maturation PENDING→AVAILABLE side effect (ledger flip, matured_at, balance reconcile) is asserted by the named §1.8 instance."

      - name: payout_release_cascade_excluded_difficulty_overlap
        claim_type: Cascade down
        grounds: [state_machines.Payout.SCHEDULED_to_RELEASED]
        excluded_because:
          difficulty_instance: transitive_cascade / payout_release_cascade_order_paid_then_ledger_then_balance_depth3
          rationale: "Release→Order PAID→balance cascade is the depth-3 chain of the named §1.8 instance."

      - name: payout_reverse_compensation_excluded_difficulty_overlap
        claim_type: Compensation
        grounds: [state_machines.Payout.RELEASED_to_REVERSED]
        excluded_because:
          difficulty_instance: compensating_invariant / payout_release_then_reverse_leaves_available_balance_unchanged
          rationale: "Reverse compensation (no balance drift) is the conserved-quantity invariant of the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: refund_clawback_returns_proportional_commission
        claim_type: Correct Result
        grounds: [calculations.refund_clawback, entities.Refund.fields.commission_returned_cents, entities.Refund.fields.clawback_cents]
        distinguishing_aspect: "Refund 4000 on commission_bps 1500: commission_returned = round(4000*0.15) = 600; clawback = 4000 - 600 = 3400."
        test_recipe:
          setup: ["Order gross 10000 (ELECTRONICS); refund 4000 REQUESTED"]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Claw Co", email: "claw@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1011" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /refunds"
              payload: { order_id: "${order_id}", refund_amount_cents: 4000, reason: "DAMAGED" }
              as: PlatformFinance
              captures: { refund_id: $.data.id }
          trigger:
            - call: "POST /refunds/${refund_id}/apply"
              payload: {}
              as: PlatformFinance
          assert:
            - "Refund.${refund_id}.commission_returned_cents == 600"
            - "Refund.${refund_id}.clawback_cents == 3400"

      - name: chargeback_lost_claws_full_gross_plus_flat_fee
        claim_type: Correct Result
        grounds: [calculations.chargeback_clawback, entities.Chargeback.fields.dispute_fee_cents, entities.Chargeback.fields.clawback_cents]
        distinguishing_aspect: "Chargeback on gross 20000: dispute_fee_cents == 1500 (flat, on receipt); LOST claws full gross clawback_cents == 20000 with NO commission proportionality."
        test_recipe:
          setup: ["Order gross 20000; chargeback RECEIVED then REPRESENTED"]
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "CB Co", email: "cb@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1012" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 20000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { order_id: "${order_id}" }
              as: PlatformFinance
              captures: { cb_id: $.data.id }
            - call: "POST /chargebacks/${cb_id}/represent"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /chargebacks/${cb_id}/decision"
              payload: { outcome: "LOST" }
              as: PlatformFinance
              as_user_id: "finance-2"
          assert:
            - "Chargeback.${cb_id}.dispute_fee_cents == 1500"
            - "Chargeback.${cb_id}.clawback_cents == 20000"
            - "Chargeback.${cb_id}.chargeback_status == LOST"

      - name: form_1099k_below_threshold_basis_none
        claim_type: Constants Applied
        grounds: [calculations.form_1099k_gross, entities.TaxForm.fields.threshold_basis, "validations[priority=9]", "errors[ERR_BELOW_1099K_THRESHOLD]"]
        distinguishing_aspect: "Settled gross 499900 (< 500000 federal threshold, < legacy) yields threshold_basis NONE; issue without force returns ERR_BELOW_1099K_THRESHOLD (422)."
        test_recipe:
          setup: ["Seller with one settled order gross 499900 in tax year 2026"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Tax Co", email: "tax@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1013" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 499900 }
              as: PlatformFinance
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
