              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-N9" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs/${leg1_id}/booking-snapshot"
              payload: { booked_first: 3, booked_business: 7, booked_economy: 41 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          trigger:
            - call: "POST /notification-obligations"
              payload: { flight_leg_id: "${leg1_id}", trigger_kind: "RETIME", change_magnitude_minutes: 45 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
              captures: { pno_id: "$.data.id" }
            - call: "POST /notification-obligations/${pno_id}/dispatch"
              payload: { channel: "EMAIL" }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
          assert:
            - "before the trigger, FlightLeg.${leg1_id}.open_obligation_count == 0 and booked_total == 51"
            - "after trigger call 1, FlightLeg.${leg1_id}.open_obligation_count == 1 and PassengerNotificationObligation.${pno_id}.status == PENDING"
            - "PassengerNotificationObligation.${pno_id}.obligation_tier == \"ADVISORY\" (change_magnitude_minutes 45 is >= MIN_MAGNITUDE_MINUTES 30 but < TIER_THRESHOLD_MINUTES 120), compensation_cents == 561132, booked_total == 51, notify_deadline_utc == \"2026-08-04T00:00:00Z\" and late_dispatch == false"
            - "PassengerNotificationObligation.${pno_id}.booked_first == 3, booked_business == 7, booked_economy == 41 — the cabin counts are frozen onto the obligation at creation"
            - "after trigger call 2, FlightLeg.${leg1_id}.open_obligation_count == 0 exactly — zero drift"
            - "after trigger call 2, PassengerNotificationObligation.${pno_id}.status == DISPATCHED, dispatched_channel == \"EMAIL\", late_dispatch == false, and compensation_cents is STILL 561132 (dispatch never recomputes the amount)"
            - "GET /notification-obligations?flight_leg_id=${leg1_id} returns total_count == 1, proving the row was transitioned rather than deleted"
