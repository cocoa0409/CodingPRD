              captures: { item_v: $.data.version }
          trigger:
            - call: "POST /submission-items/${item_id}/regrade-requests"
              payload: { prior_slab_id: "${slab_id}", expected_item_version: "${item_v} - 1", reason: "stale" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_ITEM_VERSION"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:

      - name: customer_cannot_create_service_level
        claim_type: RBAC denial
        grounds:
          - roles.Customer
          - roles.LabAdmin
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Customer calling POST /service-levels (LabAdmin-exclusive) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e22@x.com", full_name: "E TwentyTwo" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /service-levels"
              payload: { code: "SNEAK", turnaround_business_days: 2, base_fee_cents: 1, max_declared_value_cents: 1, insurance_rate_bps: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: grader_cannot_encapsulate
        claim_type: RBAC denial
        grounds:
          - roles.Grader
          - roles.Authenticator
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Grader calling POST /submission-items/{id}/encapsulate (Authenticator-exclusive) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["item AUTHENTICATED GENUINE, ready to encapsulate"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e23@x.com", full_name: "E TwentyThree" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "AG", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
          trigger:
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga_id}" }
              as: Grader
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_not_owner_cannot_submit_others_submission
        claim_type: RBAC denial
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_OWNER]
          - roles.Customer
        distinguishing_aspect: "A second customer (not the owner) calling POST /submissions/{id}/submit on another's submission returns ERR_NOT_OWNER (403)."
        test_recipe:
          setup: ["customer A owns a DRAFT submission with one item; customer B is a different customer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "owner@x.com", full_name: "Owner A" }
              as: Anonymous
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { email: "intruder@x.com", full_name: "Intruder B" }
              as: Anonymous
              captures: { cust_b: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_a}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "AH", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_a}"
          trigger:
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: RBAC denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A protected GET /submissions called without X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /submissions"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_correct_version_regrade_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[regrade-create-stale-item]
          - state_machines.SubmissionItem.ENCAPSULATED_to_CRACK_PENDING
          - entities.SubmissionItem.fields.version
        distinguishing_aspect: "A regrade request with the CURRENT expected_item_version succeeds (201) and SubmissionItem.version increments by 1."
        test_recipe:
          setup: ["item ENCAPSULATED with active slab; client holds the current version"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e24@x.com", full_name: "E TwentyFour" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "AI", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga_id}" }
              as: Authenticator
              captures: { slab_id: $.data.id }
            - call: "GET /submission-items/${item_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_v: $.data.version }
          trigger:
            - call: "POST /submission-items/${item_id}/regrade-requests"
              payload: { prior_slab_id: "${slab_id}", expected_item_version: "${item_v}", reason: "ok" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rr_id: $.data.id }
          assert:
            - "response.code == 201"
            - "SubmissionItem.${item_id}.status == CRACK_PENDING"

      - name: stale_version_regrade_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[regrade-create-stale-item]
        excluded_because:
          difficulty_instance: non_linear_state_machine / submission_item_cyclic_crack_and_regrade_loop
          rationale: "OCC version-bump on crack is exercised by the cyclic regrade §1.8 instance; the stale-version failure path is also in §1.9 errors/stale_item_version_on_regrade_returns_412."

      - name: regrade_population_decrement_cascade_stub
        claim_type: cascading_side_effects
        grounds:
          - calculations.population_decrement
        excluded_because:
          difficulty_instance: transitive_cascade / crack_cascade_slab_assessment_population_version
          rationale: "The crack-driven population decrement cascade is the asserted outcome of the named §1.8 cascade instance."

