      - name: corner_error_envelope_carries_response_type_error_with_id_and_message
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - response_envelope.success
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          The failure and success envelopes differ only in response_type and the shape of data:
          an out-of-enum dry_status returns response_type "error" with data.error_id
          ERR_VALIDATION and a non-empty data.message, while the corrected call returns
          response_type "object" with the created row and no error_id key at all — both carry meta.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "SOGGY", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "POST /jurisdictions"
              payload: { code: "US-NY", name: "New York", dry_status: "WET", utc_offset_minutes: -240 }
              as: PlatformAdmin
              captures: { j_ny: $.data.id }
          assert:
            - 'first response: HTTP status 400, response_type == "error", data.error_id == "ERR_VALIDATION", data.message is a non-empty string'
            - "first response: meta.api_request_id and meta.api_request_timestamp are present"
            - "first response: data has no id key and GET /jurisdictions returns total_count == 0 at that point"
            - 'second response: HTTP status 201, response_type == "object", data.id == ${j_ny}, no data.error_id key'
            - "Jurisdiction.${j_ny}.dry_status == WET and version == 1"

