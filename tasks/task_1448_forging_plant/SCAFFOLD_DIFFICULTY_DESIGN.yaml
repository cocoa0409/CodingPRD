          assert:
            - "trim ticket was FLAGGED then ACCEPTED via deviation (tt_status == FLAGGED at record time)"
            - "billable_tons == 3.000 -> tier_rate_cents_per_ton == 1800000 (tier 2, average rate over the whole tonnage)"
            - "base_amount_cents == 5400000; alloy_surcharge_cents == 750000; energy_surcharge_cents == 615000"
            - "scrap_credit_cents == 270000 (cap binds: min(1801.00*150 = 270150, 5% * 5400000 = 270000) = 270000)"
            - "total_cents == 6495000"

      - name: per_part_net_weight_residual_allocation
        grounds:
          - calculations.per_part_net_allocation
          - entities.PartSerial.fields.net_weight_lbs
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters —
          100.05 lbs over 4 parts rounds per-part to 25.01 (round_half_up of
          25.0125 at 2dp) leaving a +0.01 residual assigned to the part with
          the LARGEST serial_seq; sum-then-round would give a different
          part-level assignment (25.0125 unroundable / parts not summing to
          the ticket net).
        test_recipe:
          setup:
            - "Alloy AISI-4140; heat H-1301 CERT_VERIFIED; 4 billets (12.0 in -> 30.00 lbs)"
            - "WO-4: qty 4, part_net 25.00, billet 30.00 (>= 28.00 floor); 4 parts forged in one heat"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-1301", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 12.0, quantity: 4 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-13", part_family: "SML-1", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician }
            - { call: "POST /work-orders", payload: { order_number: "WO-4", customer_name: "TinyParts", alloy_spec_id: "${alloy_id}", part_number: "PN-025", ordered_qty: 4, part_net_weight_lbs: 25.00, billet_weight_lbs: 30.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id" } }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}"], parts_good: 4, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/finish-forging", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/trim-tickets", payload: {}, as: ForgeOperator, captures: { tt_id: "$.data.id" } }
          trigger:
            - { call: "POST /trim-tickets/${tt_id}/record", payload: { gross_as_forged_lbs: 110.00, net_trimmed_lbs: 100.05, pierce_loss_lbs: 2.00 }, as: ForgeOperator, captures: { tt_status: "$.data.status" } }
            - { call: "GET /work-orders/${wo_id}/part-serials", payload: {}, as: QualityEngineer, captures: { s1: "$.data[0].serial_seq", n1: "$.data[0].net_weight_lbs", s2: "$.data[1].serial_seq", n2: "$.data[1].net_weight_lbs", s3: "$.data[2].serial_seq", n3: "$.data[2].net_weight_lbs", s4: "$.data[3].serial_seq", n4: "$.data[3].net_weight_lbs" } }
          assert:
            - "TrimTicket.${tt_id}.status == ACCEPTED (flash 7.95 lbs -> 7.23% <= 12.0%)"
            - "per-part net: round_half_up(100.05/4, 2) = 25.01 assigned to serial_seq 1..3"
            - "residual +0.01 assigned to the part with the largest serial_seq (4): net_weight_lbs == 25.02"
            - "captured tuple check: (n1,n2,n3) == 25.01 each and n4 == 25.02 with s4 == 4"
            - "sum of part net weights == 100.05 == ticket net_trimmed_lbs exactly (no drift)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: die_set_wear_resink_cycle
        grounds:
          - state_machines.DieSet.AVAILABLE_to_INSTALLED
          - state_machines.DieSet.INSTALLED_to_WORN
          - state_machines.DieSet.WORN_to_RESINKING
          - state_machines.DieSet.RESINKING_to_AVAILABLE
        distinguishing_aspect: |
          Cyclic machine on DieSet: AVAILABLE -> INSTALLED -> WORN ->
          RESINKING -> AVAILABLE -> INSTALLED, with resink_count incremented
          and cumulative_hits reset on the loop. Non-linear shape lives on a
          DIFFERENT entity than the ForgeRun reopen cycle below.
        test_recipe:
          setup:
            - "Alloy AISI-4140; heat H-2001 CERT_VERIFIED; 10 billets (20.0 in)"
            - "DIE-W30 wear_limit_hits 30, max_resinks 1; WC-1 PRESS 500t; die installed"
            - "WO-5 (qty 10) run R started; two READY charges: 9 billets + 1 billet"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-2001", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 10 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id", b5: "$.data[4].id", b6: "$.data[5].id", b7: "$.data[6].id", b8: "$.data[7].id", b9: "$.data[8].id", b10: "$.data[9].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}", "${b5}", "${b6}", "${b7}", "${b8}", "${b9}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T11:00:00Z" }, as: FurnaceOperator, captures: { chg1_id: "$.data.id" } }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b10}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T12:00:00Z", planned_unload: "2026-08-02T15:00:00Z" }, as: FurnaceOperator, captures: { chg2_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg1_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${chg2_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg1_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${chg2_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-W30", part_family: "FLG-4", wear_limit_hits: 30, max_resinks: 1 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician }
            - { call: "POST /work-orders", payload: { order_number: "WO-5", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 10, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 10, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id" } }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg1_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}", "${b5}", "${b6}", "${b7}", "${b8}", "${b9}"], parts_good: 9, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1", captures: { hits1: "$.data.hits_added" } }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg2_id}", billet_ids: ["${b10}"], parts_good: 1, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /die-sets/${die_id}/start-resink", payload: {}, as: DieShopTechnician, captures: { st_resink: "$.data.status" } }
            - { call: "POST /die-sets/${die_id}/complete-resink", payload: {}, as: DieShopTechnician, captures: { st_avail: "$.data.status", hits_after: "$.data.cumulative_hits", resinks: "$.data.resink_count" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician, captures: { st_reinstall: "$.data.status" } }
          assert:
            - "first heat added 27 hits (9 parts * 3 strokes); after it the die was still INSTALLED"
            - "second heat pushed cumulative_hits to 30 == wear_limit_hits -> die became WORN and installed_work_center_id was nulled (auto-uninstall)"
            - "st_resink == RESINKING"
            - "after complete-resink: status == AVAILABLE, cumulative_hits == 0, resink_count == 1 (cycle completed)"
            - "st_reinstall == INSTALLED (die usable again after the loop)"

      - name: forge_run_reopen_reheat_cycle
        grounds:
          - state_machines.ForgeRun.IN_PROGRESS_to_FORGED
          - state_machines.ForgeRun.FORGED_to_IN_PROGRESS
        distinguishing_aspect: |
          Cyclic machine on ForgeRun: IN_PROGRESS -> FORGED -> IN_PROGRESS ->
          FORGED (reheat / re-strike loop), with part totals accumulating
          across cycles. Different entity than DieSet above.
