  - method: GET
    path: /licensing/club-distributions/{distributionId}
    description: Retrieve one club distribution row.
    roles: [LeagueLicensingManager, FinanceController, RoyaltyAuditor, ClubRepresentative]
    code: 200
    input: []
    output: ClubDistribution
    side_effects: []

  # ------------------------------------------------------- Operations
  - method: POST
    path: /licensing/ops/quarter-close
    description: Close a quarter — expire due agreements, assess interim MG shortfalls and refresh every risk index and posture.
    roles: [LeagueLicensingManager, FinanceController]
    code: 200
    input: ["as_of_quarter"]
    output: { as_of_quarter: string, agreements_expired: integer, shortfalls_assessed: integer, risk_indexes_recomputed: integer, postures_changed: integer, submissions_held: integer, submissions_released: integer }
    side_effects:
      - "in this exact order: (1) SM2 ->EXPIRED for every agreement whose term_end_date is past, (2) calculations.mg_shortfall_assessment INTERIM_PRO_RATA for every remaining ACTIVE/SUSPENDED agreement, (3) calculations.compliance_risk_index ROLLING_MONITOR for every ACTIVE licensee, (4) the SM3 posture transition implied by each new band, (5) the review_hold updates implied by those posture moves"
      - "rejects a quarter that has already been closed (§1.4 priority 42)"

  - method: POST
    path: /licensing/_clock/set_current_utc
    description: Set the deterministic logical clock used by every date-dependent rule.
    roles: [LeagueLicensingManager, MarkComplianceOfficer, FinanceController, RoyaltyAuditor, Licensee, ClubRepresentative, PlayerAgent]
    code: 200
    input: ["current_utc"]
    output: { current_utc: string }
    side_effects:
      - "MANDATORY default when never set: 2026-08-01T00:00:00Z"
      - "the clock only moves forward; an equal value is accepted (§1.4 priority 42)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "X-Role missing/unknown, or the role is not in the endpoint's `roles` list"
    applies_to: [all]
  - id: ERR_MISSING_USER_ID
    http_status: 400
    condition: "a non-GET request omits X-User-ID or sends it empty"
    applies_to: ["every POST", "every PATCH"]
  - id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    condition: "an entity-backed role (Licensee, ClubRepresentative, PlayerAgent) targets a resource it does not own"
    applies_to: ["every endpoint whose roles include an entity-backed role"]
  - id: ERR_VALIDATION
    http_status: 422
    condition: "missing required field, wrong type, bad enum value, malformed quarter/date/datetime, negative cents, out-of-range pagination"
    applies_to: [all]
  - id: ERR_LICENSEE_NOT_FOUND
    http_status: 404
    condition: "licenseeId path parameter or licensee_id / suspected_licensee_id body field does not resolve"
    applies_to: ["/licensing/licensees/{licenseeId}...", "POST /licensing/agreements", "POST /licensing/enforcement-actions"]
  - id: ERR_CATEGORY_NOT_FOUND
    http_status: 404
    condition: "categoryId path parameter or category_id body field does not resolve"
    applies_to: ["/licensing/product-categories/{categoryId}", "POST /licensing/agreements", "POST /licensing/players/{playerId}/individual-grants"]
  - id: ERR_CLUB_NOT_FOUND
    http_status: 404
    condition: "clubId path parameter or club_id body field does not resolve"
    applies_to: ["/licensing/clubs/{clubId}...", "POST /licensing/mark-rights"]
  - id: ERR_PLAYER_NOT_FOUND
    http_status: 404
    condition: "playerId path parameter or player_id body field does not resolve"
    applies_to: ["/licensing/players/{playerId}...", "POST /licensing/mark-rights"]
  - id: ERR_MARK_NOT_FOUND
    http_status: 404
    condition: "markId path parameter or an entry of mark_ids does not resolve"
    applies_to: ["/licensing/mark-rights/{markId}...", "POST /licensing/agreements/{agreementId}/product-submissions", "PATCH /licensing/product-submissions/{submissionId}"]
  - id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    condition: "agreementId path parameter or agreement_id body field does not resolve"
    applies_to: ["/licensing/agreements/{agreementId}...", "POST /licensing/royalty-reports", "POST /licensing/audit-engagements"]
  - id: ERR_GRANT_NOT_FOUND
    http_status: 404
    condition: "grantId path parameter does not resolve"
    applies_to: ["/licensing/territory-grants/{grantId}..."]
  - id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    condition: "submissionId path parameter does not resolve"
    applies_to: ["/licensing/product-submissions/{submissionId}..."]
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    condition: "authorizationId path parameter or a channel_line.retailer_authorization_id does not resolve"
    applies_to: ["/licensing/retailer-authorizations/{authorizationId}...", "POST /licensing/royalty-reports"]
  - id: ERR_REPORT_NOT_FOUND
    http_status: 404
    condition: "reportId path parameter does not resolve"
    applies_to: ["/licensing/royalty-reports/{reportId}..."]
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    condition: "engagementId path parameter does not resolve"
    applies_to: ["/licensing/audit-engagements/{engagementId}..."]
  - id: ERR_ENFORCEMENT_NOT_FOUND
    http_status: 404
    condition: "actionId path parameter does not resolve"
    applies_to: ["/licensing/enforcement-actions/{actionId}..."]
  - id: ERR_RUN_NOT_FOUND
    http_status: 404
    condition: "runId path parameter does not resolve"
    applies_to: ["/licensing/distribution-runs/{runId}..."]
  - id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    condition: "expected_agreement_version != LicenseAgreement.version"
    applies_to: ["POST /licensing/royalty-reports"]
  - id: ERR_STALE_LICENSEE_VERSION
    http_status: 412
    condition: "expected_licensee_version != Licensee.version"
    applies_to: ["POST /licensing/licensees/{licenseeId}/retailer-authorizations"]
  - id: ERR_STALE_DISTRIBUTION_VERSION
    http_status: 412
    condition: "expected_run_version != DistributionRun.version"
    applies_to: ["POST /licensing/distribution-runs/{runId}/lock", "POST /licensing/distribution-runs/{runId}/distribute"]
  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "the entity's current state (or state pair) does not admit the requested transition, including any repeat of a completed transition and any attempt from a terminal state"
    applies_to: ["every transition endpoint", "PATCH /licensing/agreements/{agreementId}", "PATCH /licensing/product-submissions/{submissionId}", "PATCH /licensing/royalty-reports/{reportId}"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "the settling user issued the findings, or the opening auditor accepted an in-scope report"
    applies_to: ["POST /licensing/audit-engagements", "POST /licensing/audit-engagements/{engagementId}/settle"]
  - id: ERR_REVIEW_ON_HOLD
    http_status: 409
    condition: "submission.review_hold == true"
    applies_to: ["POST /licensing/product-submissions/{submissionId}/submit", "POST /licensing/product-submissions/{submissionId}/review-decisions", "POST /licensing/product-submissions/{submissionId}/sample-reviews"]
  - id: ERR_POSTURE_FROZEN
    http_status: 409
    condition: "the governing agreement's compliance_posture == FROZEN"
    applies_to: ["POST /licensing/agreements/{agreementId}/product-submissions", "POST /licensing/product-submissions/{submissionId}/submit", "POST /licensing/product-submissions/{submissionId}/review-decisions", "POST /licensing/agreements/{agreementId}/territory-grants", "POST /licensing/retailer-authorizations/{authorizationId}/status", "POST /licensing/royalty-reports/{reportId}/review-decisions"]
  - id: ERR_LICENSEE_NOT_ACTIVE
    http_status: 409
    condition: "the governing Licensee.status != ACTIVE on an endpoint that grants new commercial rights"
    applies_to: ["POST /licensing/agreements", "POST /licensing/agreements/{agreementId}/contract-status", "POST /licensing/licensees/{licenseeId}/retailer-authorizations", "POST /licensing/retailer-authorizations/{authorizationId}/status"]
  - id: ERR_EXCLUSIVITY_NOT_PERMITTED
    http_status: 422
    condition: "exclusivity_mode != NON_EXCLUSIVE while category.exclusivity_allowed == false"
    applies_to: ["POST /licensing/agreements", "PATCH /licensing/agreements/{agreementId}"]
  - id: ERR_MARK_CLASS_NOT_PERMITTED
    http_status: 422
    condition: "a mark's owner_type is outside the set allowed by category.mark_usage_class"
    applies_to: ["POST /licensing/agreements/{agreementId}/product-submissions", "PATCH /licensing/product-submissions/{submissionId}"]
  - id: ERR_MARK_NOT_ACTIVE
    http_status: 409
    condition: "a referenced MarkRight has status RESTRICTED or WITHDRAWN"
    applies_to: ["POST /licensing/agreements/{agreementId}/product-submissions", "POST /licensing/product-submissions/{submissionId}/submit", "POST /licensing/product-submissions/{submissionId}/review-decisions"]
  - id: ERR_PLAYER_GROUP_OPT_OUT
    http_status: 409
    condition: "a PLAYER_GROUP mark's player has group_licensing_opt_in == false"
    applies_to: ["POST /licensing/agreements/{agreementId}/product-submissions", "POST /licensing/product-submissions/{submissionId}/submit", "POST /licensing/product-submissions/{submissionId}/review-decisions"]
  - id: ERR_PLAYER_INDIVIDUAL_GRANT_MISSING
    http_status: 409
    condition: "a PLAYER_INDIVIDUAL mark's player has not granted the agreement's category_id"
    applies_to: ["POST /licensing/agreements/{agreementId}/product-submissions", "POST /licensing/product-submissions/{submissionId}/submit", "POST /licensing/product-submissions/{submissionId}/review-decisions"]
  - id: ERR_MARK_RIGHTS_CONFLICT
    http_status: 409
    condition: "mark_ids carry both a PLAYER_GROUP and a PLAYER_INDIVIDUAL mark for the same player_id"
    applies_to: ["POST /licensing/agreements/{agreementId}/product-submissions", "PATCH /licensing/product-submissions/{submissionId}"]
  - id: ERR_CHANNEL_LINE_RETAILER_MISMATCH
    http_status: 422
    condition: "a channel line references a RetailerAuthorization of another licensee, or its channel_class does not match the authorization's channel_class"
    applies_to: ["POST /licensing/royalty-reports", "PATCH /licensing/royalty-reports/{reportId}"]
  - id: ERR_CHANNEL_NOT_AUTHORIZED
    http_status: 409
    condition: "a channel line's authorization is not AUTHORIZED, or its closed window does not contain the quarter-end date"
    applies_to: ["POST /licensing/royalty-reports", "POST /licensing/royalty-reports/{reportId}/file"]
  - id: ERR_PERIOD_OUTSIDE_TERM
    http_status: 422
    condition: "period_quarter lies outside the agreement's term quarters"
    applies_to: ["POST /licensing/royalty-reports"]
  - id: ERR_MG_BELOW_FLOOR
    http_status: 422
    condition: "minimum_guarantee_cents < category.minimum_guarantee_floor_cents"
    applies_to: ["POST /licensing/agreements", "PATCH /licensing/agreements/{agreementId}", "POST /licensing/agreements/{agreementId}/contract-status"]
  - id: ERR_ADVANCE_BELOW_FLOOR
    http_status: 422
    condition: "required_advance_cents < floor(minimum_guarantee_cents * category.advance_floor_bps_of_mg / 10000)"
    applies_to: ["POST /licensing/agreements", "PATCH /licensing/agreements/{agreementId}"]
  - id: ERR_ADVANCE_OVERPAYMENT
    http_status: 422
    condition: "advance_paid_cents + amount_cents > required_advance_cents"
    applies_to: ["POST /licensing/agreements/{agreementId}/advance-payments"]
  - id: ERR_DEDUCTION_LIMIT_EXCEEDED
    http_status: 422
    condition: "a channel line's deductions_cents exceeds the category's deduction hard limit"
    applies_to: ["POST /licensing/royalty-reports", "PATCH /licensing/royalty-reports/{reportId}"]
  - id: ERR_CLOSEOUT_LIMIT_EXCEEDED
    http_status: 422
    condition: "a channel line's closeout_sales_cents exceeds gross_sales_cents or the category's closeout hard limit"
    applies_to: ["POST /licensing/royalty-reports", "PATCH /licensing/royalty-reports/{reportId}"]
  - id: ERR_CLOSEOUT_NOT_PERMITTED
    http_status: 409
    condition: "closeout volume is reported through an authorization with closeout_allowed == false, or an OFF_PRICE line carries no closeout volume"
    applies_to: ["POST /licensing/royalty-reports", "PATCH /licensing/royalty-reports/{reportId}"]
  - id: ERR_SETTLEMENT_OUT_OF_RANGE
    http_status: 422
    condition: "negotiated_cents is absent for NEGOTIATED, present for FINDINGS, or outside 0..recovery_assessed_cents"
    applies_to: ["POST /licensing/audit-engagements/{engagementId}/settle"]
  - id: ERR_DUPLICATE_REPORT_PERIOD
    http_status: 409
    condition: "a report for the same (agreement_id, period_quarter) already exists in a status other than RETURNED"
    applies_to: ["POST /licensing/royalty-reports"]
  - id: ERR_DUPLICATE_AGREEMENT
    http_status: 409
    condition: "a live agreement for the same (licensee_id, category_id) already overlaps the requested term"
    applies_to: ["POST /licensing/agreements"]
  - id: ERR_TERRITORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    condition: "an exclusive territory/channel window half-open-overlaps a GRANTED grant on another agreement in the same category"
    applies_to: ["POST /licensing/agreements/{agreementId}/territory-grants", "POST /licensing/territory-grants/{grantId}/status"]
  - id: ERR_OFF_PRICE_CAPACITY_EXCEEDED
    http_status: 409
    condition: "more than MAX_CONCURRENT_OFF_PRICE (2) off-price authorizations of one licensee would hold overlapping windows"
    applies_to: ["POST /licensing/licensees/{licenseeId}/retailer-authorizations", "POST /licensing/retailer-authorizations/{authorizationId}/status"]
  - id: ERR_DISTRIBUTION_ALREADY_CLOSED
    http_status: 409
    condition: "the quarter's DistributionRun is already DISTRIBUTED when a report acceptance would pool into it"
    applies_to: ["POST /licensing/royalty-reports/{reportId}/review-decisions"]
  - id: ERR_PENDING_REPORTS_BLOCK_DISTRIBUTION
    http_status: 409
    condition: "a central agreement still has a FILED or RETURNED report for the run's quarter"
    applies_to: ["POST /licensing/distribution-runs/{runId}/lock", "POST /licensing/distribution-runs/{runId}/distribute"]
  - id: ERR_EMPTY_DISTRIBUTION_POOL
    http_status: 409
    condition: "no eligible report exists for the run's quarter, or no Club has status == ACTIVE"
    applies_to: ["POST /licensing/distribution-runs/{runId}/distribute"]
  - id: ERR_AUDIT_SCOPE_NOT_ACCEPTED
    http_status: 409
    condition: "a quarter in scope_quarters has no report in the required status (ACCEPTED at begin-fieldwork, UNDER_AUDIT or ADJUSTED at issue-findings), or audited_quarters does not cover scope_quarters exactly"
    applies_to: ["POST /licensing/audit-engagements/{engagementId}/begin-fieldwork", "POST /licensing/audit-engagements/{engagementId}/issue-findings"]
  - id: ERR_RETAILER_WINDOW_CONFLICT
    http_status: 409
    condition: "authorized_from > authorized_to, or the window is within 30 days of another live authorization for the same retailer and channel"
    applies_to: ["POST /licensing/licensees/{licenseeId}/retailer-authorizations", "POST /licensing/retailer-authorizations/{authorizationId}/status"]
  - id: ERR_GRANT_WINDOW_INVALID
    http_status: 422
    condition: "effective_from >= effective_to, or the half-open window escapes the agreement term"
    applies_to: ["POST /licensing/agreements/{agreementId}/territory-grants"]
  - id: ERR_PERIOD_NOT_ENDED
    http_status: 422
    condition: "the clock's UTC date precedes QUARTER_END_DATE(report.period_quarter)"
    applies_to: ["POST /licensing/royalty-reports/{reportId}/file"]
  - id: ERR_AUDIT_WINDOW_EXPIRED
    http_status: 422
    condition: "a scope quarter is more than AUDIT_LOOKBACK_QUARTERS (8) quarters old, or lies in the future"
    applies_to: ["POST /licensing/audit-engagements"]
  - id: ERR_QUARTER_ALREADY_CLOSED
    http_status: 409
    condition: "quarter-close is run twice for the same as_of_quarter, or as_of_quarter != QUARTER_OF(clock)"
    applies_to: ["POST /licensing/ops/quarter-close"]
  - id: ERR_CLOCK_BACKWARD
    http_status: 422
    condition: "current_utc precedes the current clock value"
    applies_to: ["POST /licensing/_clock/set_current_utc"]

# =============================================================================
# §1.7 RBAC Permission Matrix — role_model: segregation_of_duties
# =============================================================================
roles:
  - name: LeagueLicensingManager
    description: Owns licensee onboarding, agreement drafting and activation, territory grants, retailer approvals and design approval.
    identity: opaque
    exclusive_operations:
      - "POST /licensing/product-categories"
      - "PATCH /licensing/product-categories/{categoryId}"
      - "POST /licensing/clubs"
      - "PATCH /licensing/clubs/{clubId}"
      - "POST /licensing/clubs/{clubId}/players"
      - "POST /licensing/mark-rights"
      - "POST /licensing/licensees"
      - "POST /licensing/agreements"
      - "PATCH /licensing/agreements/{agreementId}"
      - "POST /licensing/agreements/{agreementId}/territory-grants"
      - "POST /licensing/territory-grants/{grantId}/status"
      - "POST /licensing/product-submissions/{submissionId}/review-decisions"
    shared_operations:
      - "POST /licensing/licensees/{licenseeId}/status  (with MarkComplianceOfficer)"
      - "POST /licensing/agreements/{agreementId}/contract-status  (with MarkComplianceOfficer)"
      - "POST /licensing/licensees/{licenseeId}/retailer-authorizations  (with Licensee)"
      - "POST /licensing/retailer-authorizations/{authorizationId}/status  (with MarkComplianceOfficer)"
      - "POST /licensing/agreements/{agreementId}/product-submissions  (with Licensee)"
      - "POST /licensing/players/{playerId}/group-licensing  (with PlayerAgent)"
      - "POST /licensing/players/{playerId}/individual-grants  (with PlayerAgent)"
      - "POST /licensing/ops/quarter-close  (with FinanceController)"
      - "every GET listed in §1.5"

  - name: MarkComplianceOfficer
    description: Owns mark-usage compliance, sample inspection, mark status and counterfeit enforcement.
    identity: opaque
    exclusive_operations:
      - "POST /licensing/product-submissions/{submissionId}/sample-reviews"
      - "POST /licensing/enforcement-actions/{actionId}/status"
    shared_operations:
      - "POST /licensing/mark-rights/{markId}/status  (with ClubRepresentative, scoped)"
      - "POST /licensing/licensees/{licenseeId}/status  (with LeagueLicensingManager)"
      - "POST /licensing/agreements/{agreementId}/contract-status  (with LeagueLicensingManager)"
      - "POST /licensing/retailer-authorizations/{authorizationId}/status  (with LeagueLicensingManager)"
      - "POST /licensing/enforcement-actions  (with ClubRepresentative)"
      - "read access to licensees, agreements, submissions, reports and engagements"

  - name: FinanceController
    description: Owns report acceptance, the advance ledger, audit settlement and central pool distribution.
    identity: opaque
    exclusive_operations:
      - "POST /licensing/royalty-reports/{reportId}/review-decisions"
      - "POST /licensing/audit-engagements/{engagementId}/settle"
      - "POST /licensing/distribution-runs"
      - "POST /licensing/distribution-runs/{runId}/lock"
      - "POST /licensing/distribution-runs/{runId}/unlock"
      - "POST /licensing/distribution-runs/{runId}/distribute"
    shared_operations:
      - "POST /licensing/royalty-reports  (with Licensee)"
      - "POST /licensing/agreements/{agreementId}/advance-payments  (with Licensee)"
      - "POST /licensing/agreements/{agreementId}/annual-true-up  (with RoyaltyAuditor)"
      - "POST /licensing/ops/quarter-close  (with LeagueLicensingManager)"
      - "read access to every collection"
    segregation_of_duties:
      - "the FinanceController user who accepted a report cannot open an audit engagement covering that quarter (§1.4 priority 14)"
      - "the user who issued audit findings cannot settle them (§1.4 priority 13)"

  - name: RoyaltyAuditor
    description: Owns audit engagements, restatement of reported sales and the recovery assessment.
    identity: opaque
    exclusive_operations:
      - "POST /licensing/audit-engagements"
      - "POST /licensing/audit-engagements/{engagementId}/begin-fieldwork"
      - "POST /licensing/audit-engagements/{engagementId}/issue-findings"
      - "POST /licensing/audit-engagements/{engagementId}/close"
    shared_operations:
      - "POST /licensing/agreements/{agreementId}/annual-true-up  (with FinanceController)"
      - "read access to every collection"

  - name: Licensee
    description: The licensed company; files reports, submits designs, requests retailer authorizations and disputes findings.
    identity: "entity_backed:Licensee"
    exclusive_operations:
      - "POST /licensing/product-submissions/{submissionId}/submit"
      - "PATCH /licensing/product-submissions/{submissionId}"
      - "PATCH /licensing/royalty-reports/{reportId}"
      - "POST /licensing/royalty-reports/{reportId}/file"
      - "POST /licensing/audit-engagements/{engagementId}/dispute"
    shared_operations:
      - "POST /licensing/royalty-reports  (with FinanceController)"
      - "POST /licensing/licensees/{licenseeId}/retailer-authorizations  (with LeagueLicensingManager)"
      - "POST /licensing/agreements/{agreementId}/product-submissions  (with LeagueLicensingManager)"
      - "POST /licensing/agreements/{agreementId}/advance-payments  (with FinanceController)"
      - "read access restricted to its own licensee row, agreements, grants, submissions, sample reviews, authorizations, reports and engagements (§1.4 priority 4)"

  - name: ClubRepresentative
    description: Speaks for one member club; manages that club's marks, reports counterfeits and reads its distributions.
    identity: "entity_backed:Club"
    exclusive_operations: []
    shared_operations:
      - "POST /licensing/mark-rights/{markId}/status  (with MarkComplianceOfficer; only marks with owner_type == CLUB and club_id == X-User-ID)"
      - "POST /licensing/enforcement-actions  (with MarkComplianceOfficer)"
      - "read access to clubs, players, mark rights, distribution runs and its own club-distributions"

  - name: PlayerAgent
    description: Speaks for one player; controls that player's group-licensing opt-in and individual category grants.
    identity: "entity_backed:Player"
    exclusive_operations: []
    shared_operations:
      - "POST /licensing/players/{playerId}/group-licensing  (with LeagueLicensingManager; only player_id == X-User-ID)"
      - "POST /licensing/players/{playerId}/individual-grants  (with LeagueLicensingManager; only player_id == X-User-ID)"
      - "read access to players, clubs, mark rights and product categories"




