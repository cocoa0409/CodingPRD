            - { call: "POST /api/members", payload: { name: "M2", member_code: "M-1002", haul_distance_miles: 12.0 }, as: COOP_ADMIN, captures: { m2_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m2_id}", captures: { b2_id: $.data.id } }
            - { call: "POST /api/bookings/${b2_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { qs1_id: $.data.id } }
            - { call: "POST /api/samples/${qs1_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.50 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { ls1_id: $.data.id } }
            - { call: "POST /api/samples/${ls1_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${ls1_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t1_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T10:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b2_id}" }, as: STATION_OPERATOR, captures: { t2_id: $.data.id } }
            - { call: "POST /api/tickets/${t2_id}/weigh", payload: { gross_weight_lbs: 64000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t2_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { ls2_id: $.data.id } }
            - { call: "POST /api/samples/${ls2_id}/record-result", payload: { sugar_pct: 17.20, trash_pct: 2.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${ls2_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t2_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "GET /api/pile-allocations?ticket_id=${t1_id}", as: POOL_ACCOUNTANT, captures: { a1_id: "$.data[0].id" } }
            - { call: "GET /api/pile-allocations?ticket_id=${t2_id}", as: POOL_ACCOUNTANT, captures: { a2_id: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T09:00:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/piles/${pile_id}/seal", as: STATION_OPERATOR }
            - { call: "POST /api/loss-events", payload: { pile_id: "${pile_id}", method: "TABLE_RATE", survey_at: "2026-10-15T09:00:00Z", window_start: "2026-10-15T08:00:00Z", window_end: "2026-10-15T10:00:00Z" }, as: STATION_OPERATOR, captures: { le_id: $.data.id } }
            - { call: "POST /api/loss-events/${le_id}/confirm", as: STATION_OPERATOR, captures: { le_loss: $.data.loss_lbs } }
          trigger:
            - { call: "POST /api/loss-events/${le_id}/allocate", as: POOL_ACCOUNTANT, captures: { le_status: $.data.status, le_unalloc: $.data.unallocated_lbs } }
            - { call: "GET /api/pile-allocations/${a1_id}", as: POOL_ACCOUNTANT, captures: { a1_rem: $.data.remaining_lbs } }
            - { call: "GET /api/pile-allocations/${a2_id}", as: POOL_ACCOUNTANT, captures: { a2_rem: $.data.remaining_lbs } }
            - { call: "GET /api/piles/${pile_id}", as: POOL_ACCOUNTANT, captures: { pile_stored: $.data.stored_lbs } }
            - { call: "GET /api/stations/${st_id}", as: POOL_ACCOUNTANT, captures: { st_stored: $.data.stored_tons } }
            - { call: "GET /api/members/${m1_id}", as: POOL_ACCOUNTANT, captures: { m1_loss: $.data.deterioration_loss_lbs } }
            - { call: "GET /api/members/${m2_id}", as: POOL_ACCOUNTANT, captures: { m2_loss: $.data.deterioration_loss_lbs } }
          assert:
            - "le_loss == 634.62 (79328 x 0.0008 x 10)"
            - "link 1: a1_rem == 46948.38 (47328 - 379.62: floor(634.62 x 47328/79328) = 378, plus 1.62 remainder to largest allocation) and a2_rem == 31745.00 (32000 - 255.00)"
            - "link 2: pile_stored == 78693.38 (46948.38 + 31745.00)"
            - "link 3: st_stored == 39.3467 (78693.38 / 2000, round_half_up 4dp)"
            - "m1_loss == 379.62 and m2_loss == 255.00; le_status == ALLOCATED and le_unalloc == 0"

      - name: booking_cancel_releases_capacity_promotes_waitlist
        grounds:
          - state_machines.HarvestBooking.CONFIRMED_to_CANCELLED
          - state_machines.HarvestBooking.WAITLISTED_to_CONFIRMED
          - calculations.waitlist_promotion
          - entities.ReceivingStation.fields.booked_tons
        distinguishing_aspect: |
          Different trigger (booking cancel, not loss allocate) and depth-2+ chain: cancelling a
          CONFIRMED booking releases station booked_tons (link 1); the release triggers the waitlist
          promotion scan which confirms the earliest-created fitting WAITLISTED booking (link 2);
          the promotion re-increments booked_tons (link 3), restoring the aggregate.
        test_recipe:
          setup:
            - "Campaign, members M1/M2/M3, station cap 60 tons"
            - "BA (M1, 08:00-10:00, 30 t) CONFIRMED; BB (M2, 10:00-12:00, 30 t) CONFIRMED (booked_tons 60)"
            - "BC (M3, 12:00-14:00, 30 t) confirm attempt routes to WAITLISTED (capacity full)"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-8", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M2", member_code: "M-1002", haul_distance_miles: 12.0 }, as: COOP_ADMIN, captures: { m2_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M3", member_code: "M-1003", haul_distance_miles: 85.0 }, as: COOP_ADMIN, captures: { m3_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 60 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /api/bookings/${ba_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m2_id}", captures: { bb_id: $.data.id } }
            - { call: "POST /api/bookings/${bb_id}/confirm", as: SCHEDULER, captures: { bb_status: $.data.status } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T12:00:00Z", slot_end: "2026-10-01T14:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m3_id}", captures: { bc_id: $.data.id } }
            - { call: "POST /api/bookings/${bc_id}/confirm", as: SCHEDULER, captures: { bc_status_pre: $.data.status } }
            - { call: "GET /api/stations/${st_id}", as: SCHEDULER, captures: { booked_pre: $.data.booked_tons } }
          trigger:
            - { call: "POST /api/bookings/${bb_id}/cancel", as: SCHEDULER }
            - { call: "GET /api/bookings/${bc_id}", as: SCHEDULER, captures: { bc_status_post: $.data.status } }
            - { call: "GET /api/stations/${st_id}", as: SCHEDULER, captures: { booked_post: $.data.booked_tons } }
          assert:
            - "bb_status == CONFIRMED and bc_status_pre == WAITLISTED and booked_pre == 60.0"
            - "bc_status_post == CONFIRMED — promoted by the capacity BB's cancellation released (link 2)"
            - "booked_post == 60.0 — release (60 -> 30) then promotion re-booking (30 -> 60) restores the aggregate (link 3)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state x business_fiscal; business_safety x business_temporal)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: credit_state_precondition_beats_pool_cap_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.LoadTicket.ACCEPTED_to_CREDITED
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the ticket is SAMPLED (not ACCEPTED ->
          ERR_TICKET_NOT_CREDITABLE, priority 5) and the pool's 110% accrual cap would also be
          exceeded (provisional value 132620 > 1100 cap -> ERR_POOL_ACCRUAL_CAP_EXCEEDED,
          priority 10). The state error must win.
        test_recipe:
          setup:
            - "Campaign, member M1, station, pile; booking CONFIRMED; ticket weighed 80000/32000 and quick-sampled 16.50/4.50 (SAMPLED, provisional_value_cents 132620)"
            - "Pool open-accrual with estimated_pool_value_cents 1000 (accrual cap 1100)"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-9", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { qs_id: $.data.id } }
            - { call: "POST /api/samples/${qs_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.50 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "GET /api/campaigns/${camp_id}/pools", as: POOL_ACCOUNTANT, captures: { pool_id: "$.data[0].id" } }
            - { call: "POST /api/pools/${pool_id}/open-accrual", payload: { estimated_pool_value_cents: 1000 }, as: POOL_ACCOUNTANT }
          trigger:
            - { call: "POST /api/tickets/${t1_id}/credit", as: POOL_ACCOUNTANT, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TICKET_NOT_CREDITABLE (state, priority 5) — NOT ERR_POOL_ACCRUAL_CAP_EXCEEDED (business_fiscal, priority 10), though both conditions hold"

      - name: booking_suspended_member_beats_slot_window
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Different error-category pair — business_safety vs business_temporal: the member is
          SUSPENDED (ERR_MEMBER_SUSPENDED, priority 7) and the requested slot lies outside the
          campaign window (ERR_SLOT_OUTSIDE_WINDOW, priority 8). The safety error must win.
        test_recipe:
          setup:
            - "Campaign with window 2026-09-15T00:00:00Z..2026-11-20T00:00:00Z; member M1 created then suspended; station created"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-10", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/members/${m1_id}/suspend", as: COOP_ADMIN }
          trigger:
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2027-01-10T08:00:00Z", slot_end: "2027-01-10T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MEMBER_SUSPENDED (business_safety, priority 7) — NOT ERR_SLOT_OUTSIDE_WINDOW (business_temporal, priority 8), though both conditions hold"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (trash percent on accept vs tonnage on confirm)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: trash_accept_boundary_exactly_20_00
        grounds:
          - state_machines.LoadTicket.SAMPLED_to_ACCEPTED
          - calculations.net_weight_and_trash_deduction
          - errors[ERR_TRASH_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric trash_pct on the accept endpoint: final_trash_pct exactly 20.00 is ACCEPTED
          (deducted 20.00% -> adjusted 16.0000 t on a 40000-lb load); 20.01 is rejected with
          ERR_TRASH_LIMIT_EXCEEDED. The boundary is inclusive of 20.00 (<= vs <).
        test_recipe:
          setup:
            - "Campaign, member M1, station, pile (cap 200); bookings BA (08:00-10:00) and BB (10:00-12:00) CONFIRMED"
            - "TA weighed 72000/32000, LAB sample sugar 16.00 trash 20.00 verified; TB weighed 72000/32000, LAB sample sugar 16.00 trash 20.01 verified"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-11", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /api/bookings/${ba_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 25 }, as: MEMBER, as_user_id: "${m1_id}", captures: { bb_id: $.data.id } }
            - { call: "POST /api/bookings/${bb_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${ba_id}" }, as: STATION_OPERATOR, captures: { ta_id: $.data.id } }
            - { call: "POST /api/tickets/${ta_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${ta_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { sa_id: $.data.id } }
            - { call: "POST /api/samples/${sa_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 20.00 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${sa_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T10:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${bb_id}" }, as: STATION_OPERATOR, captures: { tb_id: $.data.id } }
            - { call: "POST /api/tickets/${tb_id}/weigh", payload: { gross_weight_lbs: 72000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${tb_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { sb_id: $.data.id } }
            - { call: "POST /api/samples/${sb_id}/record-result", payload: { sugar_pct: 16.00, trash_pct: 20.01 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${sb_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
          trigger:
            - { call: "POST /api/tickets/${ta_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR, captures: { ta_status: $.data.status, ta_adj: $.data.adjusted_net_tons_final } }
            - { call: "POST /api/tickets/${tb_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR, captures: { tb_err: $.data.error_id } }
          assert:
            - "ta_status == ACCEPTED and ta_adj == 16.0000 (trash exactly 20.00 -> deducted min(17.00 x 1.5, 20.00) = 20.00%; 20.0 t x 0.80)"
            - "tb_err == ERR_TRASH_LIMIT_EXCEEDED (trash 20.01 > 20.00); TB remains SAMPLED"

      - name: station_capacity_exactly_full_boundary
        grounds:
          - state_machines.HarvestBooking.REQUESTED_to_CONFIRMED
          - state_machines.HarvestBooking.REQUESTED_to_WAITLISTED
          - entities.ReceivingStation.fields.booked_tons
        distinguishing_aspect: |
          Different metric (booked tonnage) and different endpoint (booking confirm): booking that
          fills the station to exactly its 100-t capacity confirms (equality allowed); the next
          0.01-t booking routes to WAITLISTED. Exact-equality vs 0.01-over on the capacity edge.
        test_recipe:
          setup:
            - "Campaign, member M1, station cap 100 tons"
            - "BA 30 t CONFIRMED (08:00-10:00); BB 20 t CONFIRMED (10:00-12:00); booked_tons == 50"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-12", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 100 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /api/bookings/${ba_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { bb_id: $.data.id } }
            - { call: "POST /api/bookings/${bb_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T12:00:00Z", slot_end: "2026-10-01T14:00:00Z", estimated_tons: 50 }, as: MEMBER, as_user_id: "${m1_id}", captures: { bc_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T14:00:00Z", slot_end: "2026-10-01T16:00:00Z", estimated_tons: 0.01 }, as: MEMBER, as_user_id: "${m1_id}", captures: { bd_id: $.data.id } }
          trigger:
            - { call: "POST /api/bookings/${bc_id}/confirm", as: SCHEDULER, captures: { bc_status: $.data.status } }
            - { call: "POST /api/bookings/${bd_id}/confirm", as: SCHEDULER, captures: { bd_status: $.data.status } }
            - { call: "GET /api/stations/${st_id}", as: SCHEDULER, captures: { booked: $.data.booked_tons } }
          assert:
            - "bc_status == CONFIRMED (50 + 50 == 100, equality allowed) and booked == 100.0"
            - "bd_status == WAITLISTED (100 + 0.01 > 100 by exactly one hundredth of a ton)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Ticket x PaymentPool; Ticket x HarvestBooking)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_credit_requires_pool_accruing
        grounds:
          - state_machines.LoadTicket.ACCEPTED_to_CREDITED
          - state_machines.PaymentPool.OPEN_to_ACCRUING
          - errors[ERR_POOL_NOT_ACCRUING]
        distinguishing_aspect: |
          Entity pair LoadTicket x PaymentPool: credit on an ACCEPTED ticket fails while the pool
          is OPEN (ERR_POOL_NOT_ACCRUING); after open-accrual moves the pool to ACCRUING, the same
          call succeeds and accrues 132620 provisional cents onto the pool.
        test_recipe:
          setup:
            - "Campaign, member M1, station, pile; booking CONFIRMED; ticket weighed 80000/32000, LAB sample 16.10/4.40 recorded first and verified, accepted (provisional basis = first-recorded sample = the lab sample: adjusted 23.6640 t, factor 1.0040, provisional value 130673)"
            - "Pool still OPEN (open-accrual not yet called)"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-13", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { ls_id: $.data.id } }
            - { call: "POST /api/samples/${ls_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${ls_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t1_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "GET /api/campaigns/${camp_id}/pools", as: POOL_ACCOUNTANT, captures: { pool_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/tickets/${t1_id}/credit", as: POOL_ACCOUNTANT, captures: { err: $.data.error_id } }
            - { call: "POST /api/pools/${pool_id}/open-accrual", payload: { estimated_pool_value_cents: 700000 }, as: POOL_ACCOUNTANT }
            - { call: "POST /api/tickets/${t1_id}/credit", as: POOL_ACCOUNTANT, captures: { t_status: $.data.status } }
            - { call: "GET /api/pools/${pool_id}", as: POOL_ACCOUNTANT, captures: { pool_accrued: $.data.accrued_provisional_cents } }
          assert:
            - "err == ERR_POOL_NOT_ACCRUING while pool is OPEN"
            - "after open-accrual: t_status == CREDITED"
            - "pool_accrued == 130673 (provisional from first-recorded lab sample: round_half_up(23.6640 x 5500 x 1.0040, 0))"

      - name: ticket_create_requires_booking_confirmed_or_in_use
        grounds:
          - state_machines.HarvestBooking
          - errors[ERR_BOOKING_NOT_CONFIRMED]
          - validations[priority=5]
        distinguishing_aspect: |
          Different entity pair — LoadTicket x HarvestBooking: ticket create against a REQUESTED
          booking fails with ERR_BOOKING_NOT_CONFIRMED, and against a CANCELLED booking fails the
          same way; only CONFIRMED/IN_USE bookings admit tickets.
        test_recipe:
          setup:
            - "Campaign, member M1, station; booking B1 left REQUESTED; booking B2 CONFIRMED then cancelled"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-14", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T12:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b2_id: $.data.id } }
            - { call: "POST /api/bookings/${b2_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings/${b2_id}/cancel", as: SCHEDULER }
          trigger:
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { err1: $.data.error_id } }
            - { call: "POST /api/tickets", payload: { booking_id: "${b2_id}" }, as: STATION_OPERATOR, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_BOOKING_NOT_CONFIRMED (booking REQUESTED)"
            - "err2 == ERR_BOOKING_NOT_CONFIRMED (booking CANCELLED)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (half-open station slots vs inclusive pile blackout)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_slot_half_open_adjacency_vs_overlap
        grounds:
          - state_machines.HarvestBooking.REQUESTED_to_CONFIRMED
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on ReceivingStation — a slot overlapping a
          CONFIRMED slot (09:30-10:30 vs 08:00-10:00) is rejected with ERR_SLOT_OVERLAP, while a
          slot merely touching it (start 10:00 == other end 10:00) confirms cleanly.
        test_recipe:
          setup:
            - "Campaign, member M1, station cap 1000; BA 08:00-10:00 CONFIRMED"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-15", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /api/bookings/${ba_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T09:30:00Z", slot_end: "2026-10-01T10:30:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { bb_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T10:00:00Z", slot_end: "2026-10-01T11:00:00Z", estimated_tons: 20 }, as: MEMBER, as_user_id: "${m1_id}", captures: { bc_id: $.data.id } }
          trigger:
            - { call: "POST /api/bookings/${bb_id}/confirm", as: SCHEDULER, captures: { bb_err: $.data.error_id } }
            - { call: "POST /api/bookings/${bc_id}/confirm", as: SCHEDULER, captures: { bc_status: $.data.status } }
          assert:
            - "bb_err == ERR_SLOT_OVERLAP (09:30 < 10:00 and 08:00 < 10:30 — interiors intersect)"
            - "bc_status == CONFIRMED (slot_start 10:00 == BA slot_end 10:00 is adjacency, not overlap)"

      - name: pile_survey_blackout_inclusive_bounds
        grounds:
          - state_machines.StoragePile.SEALED_to_RECLAIMING
          - errors[ERR_SURVEY_BLACKOUT]
        distinguishing_aspect: |
          Different interval semantics on a different resource (StoragePile): the survey blackout
          window is INCLUSIVE at both ends — begin-reclaim at clock exactly == window_end is still
          blocked (ERR_SURVEY_BLACKOUT); one second later it succeeds. Contrast with the half-open
          station slots where touching endpoints are allowed.
        test_recipe:
          setup:
            - "Station, pile sealed at default clock 2026-05-01T00:00:00Z"
            - "DRAFT loss event with blackout window 2026-10-10T10:00:00Z .. 2026-10-10T12:00:00Z"
          setup_api_calls:
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/piles/${pile_id}/seal", as: STATION_OPERATOR }
            - { call: "POST /api/loss-events", payload: { pile_id: "${pile_id}", method: "TABLE_RATE", survey_at: "2026-10-10T11:00:00Z", window_start: "2026-10-10T10:00:00Z", window_end: "2026-10-10T12:00:00Z" }, as: STATION_OPERATOR, captures: { le_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-10T12:00:00Z" }, as: COOP_ADMIN }
          trigger:
            - { call: "POST /api/piles/${pile_id}/begin-reclaim", as: STATION_OPERATOR, captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-10T12:00:01Z" }, as: COOP_ADMIN }
            - { call: "POST /api/piles/${pile_id}/begin-reclaim", as: STATION_OPERATOR, captures: { fill: $.data.fill_status } }
          assert:
            - "err == ERR_SURVEY_BLACKOUT at clock exactly 12:00:00Z (window_end is inclusive)"
            - "fill == RECLAIMING at clock 12:00:01Z (one second past the inclusive bound releases the block)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (ledger cents vs bookable tons)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ledger_advance_post_then_reverse_conserves_net
        grounds:
          - calculations.installment_waterfall
          - state_machines.PoolInstallment.SCHEDULED_to_ISSUED
          - entities.Member.fields.net_ledger_cents
          - errors[ERR_REVERSAL_NOT_ALLOWED]
        distinguishing_aspect: |
          Conserved quantity: member ledger cents. Posting the single member's ADVANCE_CREDIT of
          132620 (target 210000 capped at entitlement 132620) raises net_ledger_cents to 132620;
          the compensating REVERSAL entry of -132620 returns it to exactly 0. A second reversal of
          the same entry is refused (ERR_REVERSAL_NOT_ALLOWED).
        test_recipe:
          setup:
            - "Campaign (base 5500), member M1, station, pile; booking CONFIRMED; ticket weighed 80000/32000; STATION_QUICK sample 16.50/4.50 recorded first (provisional basis -> value 132620), then LAB sample 16.10/4.40 verified; accepted and credited"
            - "Pool open-accrual 700000; installment pct 30 created (target 210000) and issued -> single ADVANCE_CREDIT min(210000, 132620) = 132620"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-17", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 1000 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/piles", payload: { station_id: "${st_id}", capacity_tons: 200 }, as: STATION_OPERATOR, captures: { pile_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 30 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T08:30:00Z" }, as: COOP_ADMIN }
            - { call: "POST /api/tickets", payload: { booking_id: "${b1_id}" }, as: STATION_OPERATOR, captures: { t1_id: $.data.id } }
            - { call: "POST /api/tickets/${t1_id}/weigh", payload: { gross_weight_lbs: 80000, tare_weight_lbs: 32000 }, as: STATION_OPERATOR }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "STATION_QUICK" }, as: QUALITY_TECH, captures: { qs_id: $.data.id } }
            - { call: "POST /api/samples/${qs_id}/record-result", payload: { sugar_pct: 16.50, trash_pct: 4.50 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples", payload: { ticket_id: "${t1_id}", sample_type: "LAB_VERIFY" }, as: QUALITY_TECH, captures: { ls_id: $.data.id } }
            - { call: "POST /api/samples/${ls_id}/record-result", payload: { sugar_pct: 16.10, trash_pct: 4.40 }, as: QUALITY_TECH, as_user_id: "qt-alice" }
            - { call: "POST /api/samples/${ls_id}/verify", as: QUALITY_TECH, as_user_id: "qt-bob" }
            - { call: "POST /api/tickets/${t1_id}/accept", payload: { pile_id: "${pile_id}" }, as: STATION_OPERATOR }
            - { call: "GET /api/campaigns/${camp_id}/pools", as: POOL_ACCOUNTANT, captures: { pool_id: "$.data[0].id" } }
            - { call: "POST /api/pools/${pool_id}/open-accrual", payload: { estimated_pool_value_cents: 700000 }, as: POOL_ACCOUNTANT }
            - { call: "POST /api/tickets/${t1_id}/credit", as: POOL_ACCOUNTANT }
            - { call: "GET /api/pools/${pool_id}", as: POOL_ACCOUNTANT, captures: { pool_v: $.data.version } }
            - { call: "POST /api/pools/${pool_id}/installments", payload: { pct_of_estimated: 30, expected_pool_version: "${pool_v}" }, as: POOL_ACCOUNTANT, captures: { inst_id: $.data.id, inst_target: $.data.target_amount_cents } }
            - { call: "POST /api/installments/${inst_id}/issue", as: POOL_ACCOUNTANT, captures: { inst_distributed: $.data.distributed_amount_cents } }
            - { call: "GET /api/ledger-entries?installment_id=${inst_id}", as: POOL_ACCOUNTANT, captures: { adv_id: "$.data[0].id", adv_amount: "$.data[0].amount_cents" } }
            - { call: "GET /api/members/${m1_id}", as: POOL_ACCOUNTANT, captures: { net_after_issue: $.data.net_ledger_cents } }
          trigger:
            - { call: "POST /api/ledger-entries/${adv_id}/reverse", as: POOL_ACCOUNTANT, captures: { rev_kind: $.data.kind, rev_amount: $.data.amount_cents, rev_of: $.data.reversal_of_id } }
            - { call: "GET /api/members/${m1_id}", as: POOL_ACCOUNTANT, captures: { net_after_reverse: $.data.net_ledger_cents } }
            - { call: "POST /api/ledger-entries/${adv_id}/reverse", as: POOL_ACCOUNTANT, captures: { err2: $.data.error_id } }
          assert:
            - "inst_target == 210000 and adv_amount == 132620 (advance capped at the member's provisional entitlement E1 = round(23.6400 x 5500 x 1.0200) = 132620)"
            - "net_after_issue == 132620"
            - "rev_kind == REVERSAL, rev_amount == -132620, rev_of == adv_id"
            - "net_after_reverse == 0 — forward post plus compensating reversal leaves member ledger cents unchanged"
            - "err2 == ERR_REVERSAL_NOT_ALLOWED (entry already reversed)"

      - name: booking_confirm_then_cancel_conserves_bookable_tons
        grounds:
          - state_machines.HarvestBooking.REQUESTED_to_CONFIRMED
          - state_machines.HarvestBooking.CONFIRMED_to_CANCELLED
          - entities.ReceivingStation.fields.booked_tons
        distinguishing_aspect: |
          Different conserved quantity — station bookable tonnage (capacity dimension, not money):
          confirming a 40-t booking moves booked_tons 0 -> 40; the compensating cancel returns it
          to exactly 0, restoring booking_capacity_tons - booked_tons to its pre-confirm value.
        test_recipe:
          setup:
            - "Campaign, member M1, station cap 100 tons"
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C-18", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
            - { call: "POST /api/members", payload: { name: "M1", member_code: "M-1001", haul_distance_miles: 22.5 }, as: COOP_ADMIN, captures: { m1_id: $.data.id } }
            - { call: "POST /api/stations", payload: { name: "ST", booking_capacity_tons: 100 }, as: COOP_ADMIN, captures: { st_id: $.data.id } }
            - { call: "POST /api/bookings", payload: { campaign_id: "${camp_id}", station_id: "${st_id}", slot_start: "2026-10-01T08:00:00Z", slot_end: "2026-10-01T10:00:00Z", estimated_tons: 40 }, as: MEMBER, as_user_id: "${m1_id}", captures: { b1_id: $.data.id } }
          trigger:
            - { call: "POST /api/bookings/${b1_id}/confirm", as: SCHEDULER, captures: { st1: $.data.status } }
            - { call: "GET /api/stations/${st_id}", as: SCHEDULER, captures: { booked_after_confirm: $.data.booked_tons } }
            - { call: "POST /api/bookings/${b1_id}/cancel", as: SCHEDULER, captures: { st2: $.data.status } }
            - { call: "GET /api/stations/${st_id}", as: SCHEDULER, captures: { booked_after_cancel: $.data.booked_tons } }
          assert:
            - "st1 == CONFIRMED and booked_after_confirm == 40.0"
            - "st2 == CANCELLED and booked_after_cancel == 0.0 — confirm plus its compensating cancel leaves station booked tonnage unchanged"
