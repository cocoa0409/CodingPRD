# =============================================================================
# SCAFFOLD.yaml — Task 1276: Subcontractor Buyout & Contract Award
# GC project buyout team: scope gap analysis after bid leveling, contract value
# negotiation & allowance/alternate resolution, subcontract issuance with
# flow-down terms & insurance requirements, bonding/subguard decision by trade
# risk, schedule-of-values & payment terms, change order authority limits,
# default/replacement provision, buyout savings tracking against estimate.
#
# Difficulty target: harder-than-expert (dense coupling, dual-variant
# calculations, cyclic state machines, transitive cascades, OCC).
# =============================================================================

scenario: "generate task hard than expert level! 1276. Subcontractor Buyout & Contract Award (GC project buyout team): scope gap analysis after bid leveling, contract value negotiation & allowance/alternate resolution, subcontract issuance with flow-down terms & insurance requirements, bonding/subguard decision by trade risk, schedule-of-values & payment terms, change order authority limits, default/replacement provision, buyout savings tracking against estimate"

domain_name: subcontractor-buyout-contract-award
api_prefix: ""                    # URL space is multi-rooted (/projects, /trade-packages, /subcontracts, ...); empty prefix = server root

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party negotiation
  secondary_archetype: compliance / audit
  complexity_layers:
    - dual_variant_calculation        # provisional vs final buyout savings; FULL vs GAP_ANALYSIS insurance verdicts
    - cascading_side_effects          # default -> package -> project recompute chains
    - rate_threshold_triggers         # change-order authority % and $ tiers; negotiation round cap
    - optimistic_concurrency          # OCC on Project.version for trade-package creation
  entity_topology: hierarchical       # Project -> TradePackage -> {Bid, ScopeGap, Subcontract -> ...}
  state_machine_shape: cyclic         # negotiation loops on Subcontract; REVISED loop on ScheduleOfValues; compound bubble-ups on TradePackage/Project
  relationship_patterns:
    - one_to_many
    - cross_aggregate                 # ChangeOrder/BondDecision/SOV -> Subcontract; replacement spawn links
    - self_referential                # Subcontract.replaces_subcontract_id (replacement chain)
  role_model: hierarchical_override   # BuyoutLead < ProjectManager < ProjectExecutive < OperationsManager; VicePresident waiver override; GCAdmin superuser
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: project_number, type: string, source: input, description: "Unique project number" }
      - { name: estimated_budget_cents, type: integer, source: input, description: "Total estimated construction budget in cents" }
      - { name: buyout_target_savings_pct, type: number, source: input, description: "Target buyout savings as a fraction of estimated_budget_cents (e.g., 0.05)" }
      - { name: status, type: enum, source: system, description: "SETUP | BUYOUT_OPEN | BUYOUT_COMPLETE" }
      - { name: current_time_utc, type: datetime, source: system, description: "Project logical clock; defaults to 2026-05-01T00:00:00Z at creation; advanced only via POST /projects/{id}/clock" }

  - name: TradePackage
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: trade_code, type: string, source: input, description: "Unique per project trade code, e.g. '05-Steel'" }
      - { name: title, type: string, source: input, description: "Human title" }
      - { name: estimated_budget_cents, type: integer, source: input, description: "Estimated line budget for this trade" }
      - { name: budgeted_contingency_cents, type: integer, source: input, description: "Negotiation allowance pool for this trade; consumed by CONTINGENCY_DRAW gap resolutions" }
      - { name: spec_section, type: string, source: input, description: "MasterFormat section reference" }
      - { name: bid_due_at, type: datetime, source: input, description: "Bid deadline; bids with bid_received_at strictly after this instant are rejected" }
      - { name: bonding_policy, type: enum, source: input, description: "REQUIRED | PER_TRADE_RISK | WAIVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | UNDER_LEVELING | BUYOUT_IN_PROGRESS | AWARDED" }
      - { name: awarded_value_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL basis: sum of contract_value_cents over EXECUTED subcontracts" }
      - { name: buyout_savings_cents, type: integer, source: computed, description: "estimated_budget_cents - awarded_value_cents - consumed_contingency_cents (basis-dependent)" }
      - { name: buyout_posture, type: enum, source: computed, description: "FAVORABLE | NEUTRAL | UNFAVORABLE (see buyout_savings_vs_estimate)" }

  - name: Bid
    parent: TradePackage
    common_fields: true
    fields:
      - { name: trade_package_id, type: string, source: system, description: "FK -> TradePackage.id" }
      - { name: bidder_name, type: string, source: input, description: "Subcontractor firm name" }
      - { name: contact_email, type: string, source: input, description: "Bidder contact" }
      - { name: base_bid_cents, type: integer, source: input, description: "Base bid in cents" }
      - { name: alternates, type: array, source: input, description: "List of {alternate_id, price_delta_cents}" }
      - { name: allowances, type: array, source: input, description: "List of {allowance_id, amount_cents}" }
      - { name: bid_received_at, type: datetime, source: input, description: "Timestamp the bid was received; must be <= trade package bid_due_at" }
      - { name: leveled_value_cents, type: integer, source: computed, description: "base_bid + selected alternates + allowance adjustments (leveled_value)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PLACED | WITHDRAWN | AWARDED" }

  - name: ScopeGap
    parent: TradePackage
    common_fields: true
    fields:
      - { name: trade_package_id, type: string, source: system, description: "FK -> TradePackage.id" }
      - { name: category, type: enum, source: input, description: "SCOPE | ALLOWANCE | ALTERNATE | INSURANCE_EXCLUSION | LIFE_SAFETY" }
      - { name: description, type: string, source: input, description: "Free text" }
      - { name: estimated_impact_cents, type: integer, source: input, description: "Estimator's cost impact" }
      - { name: resolution_kind, type: enum, source: system, description: "ALLOWANCE_WITH_QUALIFICATION | ALTERNATE_ACCEPT | CONTINGENCY_DRAW | BID_CLARIFICATION" }
      - { name: priced_amount_cents, type: integer, source: system, description: "Agreed priced impact at resolution" }
      - { name: waived_by_role, type: string, source: system, description: "Role that waived qualification, if any" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | DEFERRED" }

  - name: Subcontract
    parent: TradePackage
    common_fields: true
    fields:
      - { name: trade_package_id, type: string, source: system, description: "FK -> TradePackage.id" }
      - { name: subcontractor_name, type: string, source: input, description: "Firm name" }
      - { name: source_bid_id, type: string, source: input, description: "FK -> Bid.id; the leveled bid this subcontract stems from" }
      - { name: replaces_subcontract_id, type: string, source: system, description: "FK -> Subcontract.id; set only on replacement spawns (self-referential)" }
      - { name: replacement_subcontract_id, type: string, source: system, description: "id of the replacement Subcontract spawned by replace; system-set on the REPLACED subcontract; null otherwise" }
      - { name: flow_down_terms, type: string, source: input, description: "Flow-down clause text from the prime contract" }
      - { name: insurance_requirements_snapshot, type: object, source: input, description: "Pinned requirements: {gl_occurrence_cents, gl_aggregate_cents, auto_cents, umbrella_cents, workers_comp, ai_required, wos_required, ptd_required, pollution_required}; defaults applied when omitted" }
      - { name: payment_terms, type: object, source: input, description: "{retainage_pct, pay_if_paid}" }
      - { name: change_authority_limits, type: array, source: input, description: "Ordered tiers [{max_value_cents, max_cumulative_pct, roles[]}]" }
      - { name: contract_value_cents, type: integer, source: system, description: "Negotiated contract value (0 while DRAFT; pinned at recommend-award; grows by approved change orders)" }
      - { name: cumulative_co_cents, type: integer, source: computed, default: 0, description: "Sum of APPROVED change order amounts" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Number of PENDING_AWARD->DRAFT loops taken" }
      - { name: insurance_status, type: enum, source: computed, description: "MISSING | COMPLIANT | NON_COMPLIANT | EXPIRED_CERT_ONLY" }
      - { name: bonding_requirement, type: enum, source: computed, description: "NOT_REQUIRED | SURETY_BOND | SUBGUARD | PENDING_DECISION" }
      - { name: sov_status, type: enum, source: computed, description: "DRAFT | BALANCED | APPROVED | REJECTED" }
      - { name: default_flag, type: boolean, source: system, default: false, description: "True once declare-default or replace has fired" }
      - { name: default_recorded_at, type: datetime, source: system, description: "Logical-clock timestamp of default declaration" }
      - { name: estimated_replacement_cost_cents, type: integer, source: system, description: "Replacement cost estimate captured at declare-default / replace; feeds replacement_cost_exposure" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_AWARD | AWARDED | ISSUED | EXECUTED | DEFAULTED | REPLACED | TERMINATED" }

  - name: NegotiationRound
    parent: Subcontract
    common_fields: false
    fields:
      - { name: subcontract_id, type: string, source: system, description: "FK -> Subcontract.id" }
      - { name: round_index, type: integer, source: system, description: "1-based negotiation round number" }
      - { name: proposed_value_cents, type: integer, source: input, description: "Value proposed this round" }
      - { name: allowance_dispositions, type: array, source: input, description: "[{allowance_id, action: ACCEPT|REJECT|REPRICE, priced_cents}]" }
      - { name: alternate_selections, type: array, source: input, description: "[{alternate_id, selected: boolean}]" }
      - { name: note, type: string, source: input, description: "Negotiator note" }
      - { name: recorded_at, type: datetime, source: system, description: "Project logical clock time at record" }

  - name: InsuranceCertificate
    parent: Subcontract
    common_fields: true
    fields:
      - { name: subcontract_id, type: string, source: system, description: "FK -> Subcontract.id" }
      - { name: certificate_number, type: string, source: input, description: "Unique per subcontract" }
      - { name: gl_occurrence_cents, type: integer, source: input, description: "GL per-occurrence limit" }
      - { name: gl_aggregate_cents, type: integer, source: input, description: "GL aggregate limit" }
      - { name: auto_cents, type: integer, source: input, description: "Auto liability limit" }
      - { name: umbrella_cents, type: integer, source: input, description: "Umbrella limit" }
      - { name: workers_comp, type: enum, source: input, description: "STATUTORY | EXCESS_LIMIT" }
      - { name: ai_endorsed, type: boolean, source: input, description: "Additional-insured endorsement present" }
      - { name: wos_endorsed, type: boolean, source: input, description: "Waiver-of-subrogation endorsement present" }
      - { name: ptd_endorsed, type: boolean, source: input, description: "Primary-and-noncontributory endorsement present" }
      - { name: pollution_cents, type: integer, source: input, description: "Pollution limit (0 when none)" }
      - { name: expires_on, type: string, source: input, description: "Coverage expiry date (YYYY-MM-DD); must be strictly after the project logical clock date at evaluation" }
      - { name: evaluation_basis, type: enum, source: input, default: "FULL_ENDORSEMENTS", description: "FULL_ENDORSEMENTS | GAP_ANALYSIS — selects the compliance variant" }
      - { name: compliance_verdict, type: enum, source: computed, description: "COMPLIANT | NON_COMPLIANT | COMPLIANT_BY_GAP_ANALYSIS" }
      - { name: status, type: enum, source: system, description: "ISSUED | EXPIRED | SUPERSEDED" }

  - name: BondDecision
    parent: Subcontract
    common_fields: true
    fields:
      - { name: subcontract_id, type: string, source: system, description: "FK -> Subcontract.id" }
      - { name: trade_risk_score, type: integer, source: computed, description: "0..100 composite risk score (trade_risk_score)" }
      - { name: trade_history, type: enum, source: input, description: "CLEAN | CLAIMS — subcontractor loss history declared at decision time" }
      - { name: decision, type: enum, source: computed, description: "SURETY_BOND | SUBGUARD | NOT_REQUIRED" }
      - { name: premium_cents, type: integer, source: computed, description: "Quoted bond/subguard premium (bond_premium_quote)" }
      - { name: decided_by_user_id, type: string, source: system, description: "OperationsManager X-User-ID who recorded the decision" }
      - { name: decision_rationale, type: string, source: system, description: "Free-text rationale captured from input" }

  - name: ScheduleOfValues
    parent: Subcontract
    common_fields: true
    fields:
      - { name: subcontract_id, type: string, source: system, description: "FK -> Subcontract.id" }
      - { name: revision_number, type: integer, source: system, default: 0, description: "Increments on every revise" }
      - { name: lines, type: array, source: input, description: "[{wbs_code, description, weight_numerator}] — integer weights; allocated_amount_cents per line computed by sov_line_allocation and returned on reads" }
      - { name: status, type: enum, source: system, description: "DRAFT | BALANCED | REJECTED | REVISED | APPROVED" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of approval" }

  - name: ChangeOrder
    parent: Subcontract
    common_fields: true
    fields:
      - { name: subcontract_id, type: string, source: system, description: "FK -> Subcontract.id" }
      - { name: description, type: string, source: input, description: "Scope change description" }
      - { name: amount_cents, type: integer, source: input, description: "Positive = additive change" }
      - { name: initiating_role, type: string, source: input, description: "Role that initiated the change" }
      - { name: approval_roles_received, type: array, source: system, description: "Ordered list of roles that approved" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: SETUP
    terminal_states: []
    transitions:
      - from: SETUP
        to: BUYOUT_OPEN
        trigger: "POST /projects/{id}/open"
        actor: GCAdmin
        preconditions:
          - "Project is SETUP (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Project.version by 1"
      - from: BUYOUT_OPEN
        to: BUYOUT_COMPLETE
        trigger: "system (automatic when at least one TradePackage exists and every TradePackage is AWARDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BUYOUT_COMPLETE
        to: BUYOUT_OPEN
        trigger: "system (automatic when any TradePackage leaves AWARDED via recompute after default/replacement)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Project has no terminal state; child mutations require BUYOUT_OPEN or BUYOUT_COMPLETE (SETUP blocks with ERR_PACKAGE_NOT_OPEN)."

  - entity: TradePackage
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /trade-packages/{id}/publish"
        actor: BuyoutLead
        preconditions:
          - "Project is BUYOUT_OPEN (else ERR_PACKAGE_NOT_OPEN)"
          - "bid_due_at is strictly after project current_time_utc (else ERR_BID_WINDOW_INVALID)"
        side_effects:
          - "status -> PUBLISHED"
      - from: PUBLISHED
        to: UNDER_LEVELING
        trigger: "POST /trade-packages/{id}/close-bidding"
        actor: BuyoutLead
        preconditions:
          - "at least one Bid with status PLACED exists (else ERR_NO_BIDS_RECEIVED)"
        side_effects:
          - "status -> UNDER_LEVELING"
      - from: UNDER_LEVELING
        to: BUYOUT_IN_PROGRESS
        trigger: "POST /subcontracts/{id}/issue (first issuance on the package)"
        actor: BuyoutLead
        preconditions: []
        side_effects: []
      - from: BUYOUT_IN_PROGRESS
        to: AWARDED
        trigger: "system (automatic when exactly one subcontract is EXECUTED and every sibling Subcontract is in {EXECUTED, REPLACED, DEFAULTED, TERMINATED})"
        actor: system
        preconditions: []
        side_effects:
          - "awarded_value_cents / buyout_savings_cents / buyout_posture recomputed (PROVISIONAL basis)"
          - "if all project packages AWARDED -> Project BUYOUT_OPEN -> BUYOUT_COMPLETE (chain link 2)"
      - from: AWARDED
        to: BUYOUT_IN_PROGRESS
        trigger: "system (recompute when the EXECUTED subcontract is DEFAULTED / REPLACED / TERMINATED and no EXECUTED subcontract remains)"
        actor: system
        preconditions: []
        side_effects:
          - "awarded_value_cents / buyout_savings_cents / buyout_posture recomputed (PROVISIONAL basis)"
          - "Project BUYOUT_COMPLETE -> BUYOUT_OPEN when this package leaves AWARDED (chain link 3)"
    note: "AWARDED is a compound/bubble-up state derived from child subcontract states; packages are never hard-deleted."

  - entity: Bid
    initial_state: RECEIVED
    terminal_states: [AWARDED]
    transitions:
      - from: RECEIVED
        to: PLACED
        trigger: "system (on successful creation via POST /trade-packages/{id}/bids)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLACED
        to: WITHDRAWN
        trigger: "POST /trade-packages/{id}/bids/{id}/withdraw"
        actor: BuyoutLead | OperationsManager
        preconditions:
          - "Bid is PLACED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: PLACED
        to: AWARDED
        trigger: "POST /trade-packages/{id}/bids/{id}/award"
        actor: BuyoutLead
        preconditions:
          - "TradePackage UNDER_LEVELING (else ERR_INVALID_STATE_TRANSITION)"
          - "at least one bid on the package is PLACED or AWARDED (else ERR_NO_AWARDABLE_BID — this empty-set check is evaluated BEFORE the target-bid status check)"
          - "this Bid is PLACED (else ERR_BID_NOT_AWARDABLE)"
          - "no OPEN ScopeGap with category LIFE_SAFETY on the package (else ERR_UNRESOLVED_LIFE_SAFETY_GAP)"
        side_effects: []
      - from: AWARDED
        to: PLACED
        trigger: "POST /bids/{id}/un-award"
        actor: BuyoutLead | OperationsManager
        preconditions:
          - "linked Subcontract still PENDING_AWARD (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "linked Subcontract PENDING_AWARD -> DRAFT with contract_value_cents reset to 0"
    note: "WITHDRAWN is not terminal for reads: withdrawn bids remain queryable but are ineligible for award, subcontract creation, and block SOV creation."

  - entity: ScopeGap
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /gaps/{id}/resolve"
        actor: BuyoutLead | OperationsManager | VicePresident
        preconditions:
          - "resolution_kind == ALLOWANCE_WITH_QUALIFICATION implies waived_by_role present and in {OperationsManager, VicePresident}"
          - "resolution_kind == CONTINGENCY_DRAW implies priced_amount_cents present"
        side_effects:
          - "CONTINGENCY_DRAW consumes priced_amount_cents from the TradePackage contingency pool"
      - from: OPEN
        to: DEFERRED
        trigger: "POST /gaps/{id}/defer"
        actor: BuyoutLead
        preconditions:
          - "category != LIFE_SAFETY (else ERR_UNRESOLVED_LIFE_SAFETY_GAP)"
        side_effects: []
      - from: DEFERRED
        to: OPEN
        trigger: "POST /gaps/{id}/reopen"
        actor: BuyoutLead
        preconditions: []
        side_effects: []
    note: "OPEN gaps block subcontract award/issue only when category == LIFE_SAFETY; other categories are advisory at award but their allowance/alternate kinds gate negotiation completeness at recommend-award."

  - entity: Subcontract
    initial_state: DRAFT
    terminal_states: [EXECUTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_AWARD
        trigger: "POST /subcontracts/{id}/recommend-award"
        actor: BuyoutLead | OperationsManager
        preconditions:
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (2) (else ERR_NEGOTIATION_ROUND_EXCEEDED)"
          - "payment_terms.retainage_pct within [0.05, 0.10] (else ERR_RETAINAGE_OUT_OF_BAND)"
          - "projected package awarded_value_cents + contract_value_cents + pending value of other PENDING_AWARD subcontracts <= estimated_budget_cents + (budgeted_contingency_cents - consumed contingency) (else ERR_CONTINGENCY_EXCEEDED)"
          - "every allowance/alternate on the source bid has a disposition/selection in this round (else ERR_ALLOWANCE_UNRESOLVED / ERR_ALTERNATE_UNRESOLVED)"
        side_effects:
          - "creates a NegotiationRound row (round_index = negotiation_round + 1)"
          - "pins contract_value_cents on the subcontract"
      - from: PENDING_AWARD
        to: DRAFT
        trigger: "POST /subcontracts/{id}/renegotiate"
        actor: BuyoutLead
        preconditions: []
        side_effects:
          - "negotiation_round += 1"
          - "contract_value_cents reset to 0"
      - from: PENDING_AWARD
        to: AWARDED
        trigger: "POST /subcontracts/{id}/award"
        actor: OperationsManager
        preconditions:
          - "no OPEN ScopeGap with category LIFE_SAFETY on the trade package (else ERR_UNRESOLVED_LIFE_SAFETY_GAP)"
          - "projected package awarded_value_cents + contract_value_cents + pending value of other PENDING_AWARD subcontracts <= estimated_budget_cents + (budgeted_contingency_cents - consumed contingency) (else ERR_CONTINGENCY_EXCEEDED)"
        side_effects:
          - "bonding_requirement -> PENDING_DECISION when trade package bonding_policy != WAIVED"
      - from: AWARDED
        to: ISSUED
        trigger: "POST /subcontracts/{id}/issue"
        actor: BuyoutLead
        preconditions:
          - "insurance_status == COMPLIANT (error mapping: MISSING -> ERR_INSURANCE_MISSING; NON_COMPLIANT -> ERR_INSURANCE_NON_COMPLIANT; EXPIRED_CERT_ONLY -> ERR_INSURANCE_CERT_EXPIRED)"
          - "bonding_requirement in {NOT_REQUIRED, SURETY_BOND, SUBGUARD} with a recorded BondDecision when policy != WAIVED (else ERR_BONDING_NOT_SATISFIED)"
          - "no OPEN LIFE_SAFETY gap on the trade package (else ERR_UNRESOLVED_LIFE_SAFETY_GAP)"
        side_effects:
          - "TradePackage UNDER_LEVELING -> BUYOUT_IN_PROGRESS (if still UNDER_LEVELING)"
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /subcontracts/{id}/execute"
        actor: BuyoutLead
        preconditions:
          - "insurance_status == COMPLIANT (same error mapping as issue)"
        side_effects:
          - "package awarded_value_cents recomputed (buyout_savings_vs_estimate PROVISIONAL)"
          - "if exactly one EXECUTED subcontract exists and all siblings terminal -> package BUYOUT_IN_PROGRESS -> AWARDED"
          - "if all project packages AWARDED -> Project BUYOUT_OPEN -> BUYOUT_COMPLETE"
      - from: EXECUTED
        to: DEFAULTED
        trigger: "POST /subcontracts/{id}/declare-default"
        actor: OperationsManager
        preconditions:
          - "no APPROVED ScheduleOfValues on this subcontract (else ERR_INVALID_STATE_TRANSITION — cure via replacement path)"
        side_effects:
          - "default_flag = true; default_recorded_at = project clock"
          - "package awarded_value_cents recomputed (DEFAULTED subcontracts no longer count)"
          - "if no EXECUTED subcontract remains on the package -> TradePackage AWARDED -> BUYOUT_IN_PROGRESS"
          - "if Project was BUYOUT_COMPLETE and a package left AWARDED -> Project BUYOUT_COMPLETE -> BUYOUT_OPEN"
          - "if replacement_subcontract_id supplied -> that subcontract must be DRAFT on the same package (else ERR_REPLACEMENT_LINK_INVALID); its replaces_subcontract_id is set to this id"
      - from: EXECUTED
        to: REPLACED
        trigger: "POST /subcontracts/{id}/replace"
        actor: OperationsManager
        preconditions:
          - "trade package in {UNDER_LEVELING, BUYOUT_IN_PROGRESS} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "default_flag = true; default_recorded_at = project clock"
          - "creates replacement Subcontract (status DRAFT, replaces_subcontract_id = this id, negotiation_round = 0, insurance_status = MISSING, contract_value_cents = 0)"
          - "this subcontract's InsuranceCertificates -> SUPERSEDED"
          - "package awarded_value_cents recomputed (REPLACED no longer counts)"
          - "response exposes replacement_subcontract_id"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /subcontracts/{id}/terminate"
        actor: OperationsManager
        preconditions: []
        side_effects: []
    note: "Cycle DRAFT<->PENDING_AWARD is bounded by MAX_NEGOTIATION_ROUNDS=2; EXECUTED is a quasi-terminal state exited only by default/replacement."

  - entity: ScheduleOfValues
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: BALANCED
        trigger: "system (on POST /subcontracts/{id}/schedule-of-values when sov_line_allocation balances)"
        actor: system
        preconditions: []
        side_effects:
          - "Subcontract.sov_status -> BALANCED"
      - from: BALANCED
        to: REJECTED
        trigger: "POST /schedule-of-values/{id}/reject"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "Subcontract.sov_status -> REJECTED"
      - from: REJECTED
        to: REVISED
        trigger: "POST /schedule-of-values/{id}/revise"
        actor: BuyoutLead
        preconditions: []
        side_effects:
          - "revision_number += 1"
      - from: REVISED
        to: BALANCED
        trigger: "system (automatic re-evaluation of sov_line_allocation on revise)"
        actor: system
        preconditions: []
        side_effects:
          - "Subcontract.sov_status -> BALANCED"
      - from: BALANCED
        to: APPROVED
        trigger: "POST /schedule-of-values/{id}/approve"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "approved_at = project clock"
          - "Subcontract.sov_status -> APPROVED"
    note: "BALANCED->REJECTED->REVISED->BALANCED is the revision cycle; only APPROVED SOVs gate change-order creation and block declare-default."

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /change-orders/{id}/submit"
        actor: BuyoutLead
        preconditions: []
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: ProjectManager | ProjectExecutive | OperationsManager
        preconditions:
          - "approver's X-User-ID != created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "change_authority_check passes for the approver's role (else ERR_CO_AUTHORITY_EXCEEDED / ERR_CO_CUMULATIVE_LIMIT)"
        side_effects:
          - "approving role appended to approval_roles_received"
          - "Subcontract.cumulative_co_cents += amount_cents"
          - "Subcontract.contract_value_cents += amount_cents"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: ProjectManager | ProjectExecutive | OperationsManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "POST /change-orders/{id}/void"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "Subcontract.cumulative_co_cents -= amount_cents"
          - "Subcontract.contract_value_cents -= amount_cents"

  - entity: InsuranceCertificate
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: EXPIRED
        trigger: "system (when evaluated against a project clock whose date is >= expires_on)"
        actor: system
        preconditions: []
        side_effects:
          - "compliance_verdict set NON_COMPLIANT"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (when the parent subcontract is REPLACED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: package-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/trade-packages"
    occ_field: "expected_project_version"
    description: |
      Creating a TradePackage against a Project whose version has advanced
      since the client last observed it (e.g., opening the project or creating
      another package each increment Project.version) is rejected with
      ERR_STALE_PACKAGE_VERSION. The client's view of the project is stale;
      the create must be retried against a fresh read.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: leveled_value
    trigger: "on bid creation (no dispositions yet -> equals base_bid_cents) and on every recommend-award (applies that round's dispositions)"
    algorithm: aggregation
    formula: |
      R = latest NegotiationRound on the subcontract sourced from this bid (none at creation)
      leveled_value_cents = base_bid_cents
        + sum(price_delta_cents for alternates with selected == true in R.alternate_selections)
        + sum((priced_cents - amount_cents) for allowances with action == REPRICE in R.allowance_dispositions)
        - sum(amount_cents for allowances with action == REJECT in R.allowance_dispositions)
      allowances with action == ACCEPT contribute 0; undispositioned allowances/alternates contribute 0
    input_set: "one Bid; the latest NegotiationRound dispositions/selections on the subcontract sourced from that bid"
    precision: "integer cents, no rounding"
    variants: []

  - name: bid_leveling_selection
    trigger: "POST /trade-packages/{id}/bids/{id}/award"
    algorithm: selector
    formula: |
      candidate set = bids on the trade package with status in {PLACED, AWARDED}
      if candidate set empty -> ERR_NO_AWARDABLE_BID (evaluated BEFORE target-bid status)
      eligibility ranking (for "apparent low bidder" assertions): leveled_value_cents ASC;
        ties broken by bid_received_at ASC, then Bid.created_at ASC
      the endpoint awards the caller-named bidId only — it never auto-picks
    input_set: "bids of the parent TradePackage"
    precision: "integer cents"
    variants: []

  - name: buyout_savings_vs_estimate
    trigger: "on subcontract execute / declare-default / replace, and on every TradePackage GET"
    algorithm: aggregation
    formula: |
      consumed_contingency_cents = sum(priced_amount_cents of RESOLVED ScopeGaps
        with resolution_kind == CONTINGENCY_DRAW on this package)
      PROVISIONAL basis:
        awarded_value_cents = sum(contract_value_cents of Subcontracts with status == EXECUTED)
      FINAL basis:
        awarded_value_cents = sum(contract_value_cents of Subcontracts with status in {EXECUTED, PENDING_AWARD})
      buyout_savings_cents = estimated_budget_cents - awarded_value_cents - consumed_contingency_cents
      target_cents = round_half_up(Project.buyout_target_savings_pct * TradePackage.estimated_budget_cents)
      buyout_posture:
        FAVORABLE   if buyout_savings_cents >= target_cents
        NEUTRAL     if 0 <= buyout_savings_cents < target_cents
        UNFAVORABLE if buyout_savings_cents < 0
    input_set: "subcontracts of the package (state-filtered per variant); resolved CONTINGENCY_DRAW gaps; project target pct"
    constants:
      TARGET_DEFAULT_PCT: 0.05
    precision: "integer cents; target rounds round_half_up"
    variants:
      - name: PROVISIONAL
        when: "default read basis; drives posture flips after execute/default"
        difference: "counts only EXECUTED subcontracts as awarded anchors"
      - name: FINAL
        when: "requested with basis=FINAL; used for buyout close-out reporting"
        difference: "counts EXECUTED plus PENDING_AWARD subcontracts as awarded anchors"

  - name: trade_risk_score
    trigger: "POST /subcontracts/{id}/bond-decision"
    algorithm: weighted_scoring
    formula: |
      value_score: contract_value_cents < 5000000 -> 10
                   5000000 <= contract_value_cents <= 10000000 -> 20
                   contract_value_cents > 10000000 -> 35
      ratio = Subcontract.contract_value_cents / TradePackage.estimated_budget_cents
      size_score: ratio <= 0.25 -> 0; else -> 25
      history_score: trade_history CLEAN -> 10; CLAIMS -> 25
      score = clamp(value_score + size_score + history_score, 0, 100)
      decision (policy PER_TRADE_RISK):
        score <= 40 -> NOT_REQUIRED
        41..60      -> SURETY_BOND
        61..85      -> SUBGUARD
      decision (policy REQUIRED) -> SURETY_BOND regardless of score
      decision (policy WAIVED)   -> NOT_REQUIRED regardless of score
    input_set: "subcontract contract value, parent trade package bonding_policy and estimated_budget_cents, trade_history input"
    constants:
      VALUE_TIER1_MAX_CENTS: 4999999
      VALUE_TIER2_MAX_CENTS: 10000000
      VALUE_LOW_PTS: 10
      VALUE_MID_PTS: 20
      VALUE_HIGH_PTS: 35
      SIZE_RATIO_THRESHOLD: 0.25
      SIZE_SCORE_PTS: 25
      HISTORY_CLEAN_PTS: 10
      HISTORY_CLAIMS_PTS: 25
      TIER1_MAX: 40
      TIER2_MAX: 60
      TIER3_MAX: 85
    precision: "score integer (sum of integer point values; no rounding needed)"
    variants: []

  - name: bond_premium_quote
    trigger: "POST /subcontracts/{id}/bond-decision (after trade_risk_score decision)"
    algorithm: tiered_pricing
    formula: |
      if decision == NOT_REQUIRED -> premium_cents = 0
      if decision == SURETY_BOND  -> rate = 0.015
      if decision == SUBGUARD     -> rate = 0.010
      premium_cents = round_half_up(contract_value_cents * rate)
    input_set: "subcontract contract value at decision time"
    constants:
      SURETY_RATE: 0.015
      SUBGUARD_RATE: 0.010
    precision: "integer cents, round_half_up"
    variants: []

  - name: insurance_compliance_check
    trigger: "POST /subcontracts/{id}/insurance-certificates; re-evaluated on issue/execute"
    algorithm: policy_check
    formula: |
      R = subcontract.insurance_requirements_snapshot
      C = certificate under evaluation
      numeric failures = each of {gl_occurrence, gl_aggregate, auto, umbrella}
        where C.limit < R.limit  (workers_comp must be STATUTORY)
      endorsement failures = {ai: R.ai_required && !C.ai_endorsed,
                              wos: R.wos_required && !C.wos_endorsed,
                              ptd: R.ptd_required && !C.ptd_endorsed,
                              pollution: R.pollution_required && C.pollution_cents == 0}
      expiry failure = C.expires_on <= project.current_time_utc date (strictly-after rule)
      FULL_ENDORSEMENTS basis:
        verdict = COMPLIANT iff no numeric failures AND no endorsement failures AND no expiry failure
        else NON_COMPLIANT (certificate status -> EXPIRED when expiry failed)
      GAP_ANALYSIS basis:
        endorsement failures are excused when a ScopeGap with category INSURANCE_EXCLUSION
        exists on the package in state RESOLVED whose waived_by_role == VicePresident;
        verdict = COMPLIANT_BY_GAP_ANALYSIS when only excused endorsement failures remain
        (numeric and expiry failures are never excused)
      subcontract insurance_status recompute (evaluated in this order):
        COMPLIANT if any cert verdict in {COMPLIANT, COMPLIANT_BY_GAP_ANALYSIS}
        else EXPIRED_CERT_ONLY if at least one cert exists and every cert has status EXPIRED
        else NON_COMPLIANT if any cert evaluated NON_COMPLIANT
        else MISSING
    input_set: "subcontract requirements snapshot, certificate fields, package INSURANCE_EXCLUSION gaps, project clock"
    precision: "boolean set logic; no arithmetic rounding"
    variants:
      - name: FULL_ENDORSEMENTS
        when: "default basis"
        difference: "all endorsement requirements enforced literally"
      - name: GAP_ANALYSIS
        when: "certificate submitted with evaluation_basis=GAP_ANALYSIS"
        difference: "VP-waived INSURANCE_EXCLUSION gaps excuse missing endorsements"

  - name: sov_line_allocation
    trigger: "POST /subcontracts/{id}/schedule-of-values and POST /schedule-of-values/{id}/revise"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: cumulative-difference per line, last line absorbs remainder.
      # Given lines in submission order with integer weights w_i, W = sum(w_i):
      #   cum_round_0 = 0
      #   for i in 1..N-1:
      #     cum_round_i = round_half_up(contract_value_cents * cumw_i / W)   where cumw_i = w_1+...+w_i
      #     allocated_i = cum_round_i - cum_round_{i-1}
      #   allocated_N = contract_value_cents - cum_round_{N-1}
      # The FORBIDDEN alternative (round each w_i-share independently, then sum)
      # drifts below contract_value_cents on indivisible cent counts.
      # Reject submission with ERR_SOV_IMBALANCE when W <= 0 or any w_i < 1.
      pass
    input_set: "lines array of the SOV submission; subcontract contract_value_cents"
    precision: "integer cents; round_half_up per cumulative line then remainder on last line (pinned order)"
    variants: []

  - name: change_authority_check
    trigger: "POST /change-orders/{id}/approve"
    algorithm: threshold
    formula: |
      tiers = subcontract.change_authority_limits (ordered; max_value_cents == -1 means unlimited;
        max_cumulative_pct == -1 means unlimited)
      approver_tiers = [t for t in tiers if approver_role in t.roles]
      if approver_tiers empty -> ERR_CO_AUTHORITY_EXCEEDED
      best = the approver_tier with the largest max_value_cents (-1 sorts as +infinity)
      per-CO check: best.max_value_cents != -1 and amount_cents > best.max_value_cents
        -> ERR_CO_AUTHORITY_EXCEEDED
      cumulative_ratio = (subcontract.cumulative_co_cents + amount_cents) / subcontract.contract_value_cents
      cumulative check: best.max_cumulative_pct != -1 and cumulative_ratio > best.max_cumulative_pct
        -> ERR_CO_CUMULATIVE_LIMIT
      on pass: status APPROVED; approval_roles_received += [approver_role];
        cumulative_co_cents += amount_cents; contract_value_cents += amount_cents
    input_set: "change order, subcontract authority tiers and cumulative_co_cents"
    precision: "ratio compared in exact rational arithmetic; boundary inclusive (<= passes)"
    variants: []

  - name: replacement_cost_exposure
    trigger: "GET /trade-packages/{id}/replacement-analysis"
    algorithm: aggregation
    formula: |
      For each subcontract on the package with default_flag == true:
        subguard_claim_estimate_cents = round_half_up(original contract_value_cents * 0.20)
          when bonding_requirement == SUBGUARD else 0
        exposure_cents = max(0, estimated_replacement_cost_cents - contract_value_cents_at_default)
          + subguard_claim_estimate_cents
      Reported as items[] per defaulted/replaced subcontract.
    input_set: "subcontracts of the package where default_flag == true"
    constants:
      SUBGUARD_CLAIM_PCT: 0.20
    precision: "integer cents, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-resolved resources exist (project, package, bid, gap, subcontract, certificate, bond, SOV, change order), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_temporal
    check: "OCC: expected_project_version on trade-package creation must equal Project.version"
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412
    applies_to: "POST /projects/{id}/trade-packages"

  - priority: 5
    category: state
    check: "Resource from-state valid for the requested transition; derived-field gates: project BUYOUT_OPEN for child mutations (ERR_PACKAGE_NOT_OPEN), package accepting bids (ERR_TRADE_PACKAGE_NOT_ACCEPTING_BIDS), negotiation round cap (ERR_NEGOTIATION_ROUND_EXCEEDED), subcontract non-terminal (ERR_SUBCONTRACT_TERMINAL), SOV approved before CO creation (ERR_SOV_NOT_APPROVED), insurance_status gate at issue/execute (MISSING -> ERR_INSURANCE_MISSING; NON_COMPLIANT -> ERR_INSURANCE_NON_COMPLIANT; EXPIRED_CERT_ONLY -> ERR_INSURANCE_CERT_EXPIRED), BondDecision recorded before issue (ERR_BONDING_NOT_SATISFIED), WITHDRAWN source bid blocks SOV creation (ERR_BID_WITHDRAWN_SOV_BLOCKED), generic ERR_INVALID_STATE_TRANSITION otherwise"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Bid award: at least one bid on the package is PLACED or AWARDED (empty eligible candidate set) — evaluated BEFORE the target-bid status check"
    error_id: ERR_NO_AWARDABLE_BID
    http_status: 409
    applies_to: "POST /trade-packages/{id}/bids/{id}/award"

  - priority: 7
    category: state
    check: "Bid award: the targeted bid itself is PLACED"
    error_id: ERR_BID_NOT_AWARDABLE
    http_status: 409
    applies_to: "POST /trade-packages/{id}/bids/{id}/award"

  - priority: 8
    category: business_safety
    check: "No OPEN ScopeGap with category == LIFE_SAFETY on the trade package; LIFE_SAFETY gaps may not be DEFERRED"
    error_id: ERR_UNRESOLVED_LIFE_SAFETY_GAP
    http_status: 409
    applies_to: "subcontract award, subcontract issue, bid award, gap defer"

  - priority: 9
    category: business_fiscal
    check: "Fiscal headroom: projected awarded_value_cents + this contract_value_cents + pending value of other PENDING_AWARD subcontracts <= estimated_budget_cents + (budgeted_contingency_cents - consumed contingency). At award, the headline check (this contract_value_cents alone > estimated_budget_cents + remaining contingency -> ERR_AWARD_EXCEEDS_BUDGET) is evaluated BEFORE the projected-total check (ERR_CONTINGENCY_EXCEEDED)"
    error_id: "ERR_AWARD_EXCEEDS_BUDGET | ERR_CONTINGENCY_EXCEEDED"
    http_status: 409
    applies_to: "recommend-award, award"

  - priority: 10
    category: business_fiscal
    check: "Change-order authority: per-CO amount within best approver tier max_value_cents; cumulative ratio <= best approver tier max_cumulative_pct"
    error_id: "ERR_CO_AUTHORITY_EXCEEDED | ERR_CO_CUMULATIVE_LIMIT"
    http_status: 409
    applies_to: "POST /change-orders/{id}/approve"

  - priority: 11
    category: business_fiscal
    check: "Retainage within [0.05, 0.10] at subcontract creation and recommend-award"
    error_id: ERR_RETAINAGE_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /trade-packages/{id}/subcontracts, POST /subcontracts/{id}/recommend-award"

  - priority: 12
    category: business_constraint
    check: "Negotiation completeness at recommend-award, evaluated in this order: (a) source bid has allowances/alternates but the payload omits the dispositions/selections arrays entirely -> ERR_NEGOTIATION_TERMS_INCOMPLETE; (b) an allowance lacks a disposition -> ERR_ALLOWANCE_UNRESOLVED; (c) an alternate lacks a selection -> ERR_ALTERNATE_UNRESOLVED"
    error_id: "ERR_NEGOTIATION_TERMS_INCOMPLETE | ERR_ALLOWANCE_UNRESOLVED | ERR_ALTERNATE_UNRESOLVED"
    http_status: 409
    applies_to: "recommend-award"

  - priority: 13
    category: business_constraint
    check: "Duplicate bidder on the same package (active PLACED/AWARDED bid with same bidder_name)"
    error_id: ERR_DUPLICATE_BIDDER
    http_status: 409
    applies_to: "POST /trade-packages/{id}/bids"

  - priority: 14
    category: business_temporal
    check: "Bid window: bid_received_at <= trade package bid_due_at (inclusive boundary); publish requires bid_due_at strictly after project clock"
    error_id: "ERR_BID_AFTER_DEADLINE | ERR_BID_WINDOW_INVALID"
    http_status: 409
    applies_to: "POST /trade-packages/{id}/bids, POST /trade-packages/{id}/publish"

  - priority: 15
    category: business_referential
    check: "SOV allocation balances to contract_value_cents (sov_line_allocation; ERR_SOV_IMBALANCE); replacement link validity: replacement subcontract exists, is DRAFT, on the same package (ERR_REPLACEMENT_LINK_INVALID)"
    error_id: "ERR_SOV_IMBALANCE | ERR_REPLACEMENT_LINK_INVALID"
    http_status: 409
    applies_to: "SOV submit/revise, declare-default"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/projects"
    description: "Create a project (status SETUP; clock defaults to 2026-05-01T00:00:00Z)"
    roles: [GCAdmin]
    code: 201
    input: [name, project_number, estimated_budget_cents, buyout_target_savings_pct]
    output: Project
    side_effects: ["status=SETUP", "current_time_utc=2026-05-01T00:00:00Z"]

  - method: GET
    path: "/projects/{id}"
    description: "Get a project"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/projects/{id}/open"
    description: "Open the project for buyout"
    roles: [GCAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["SETUP -> BUYOUT_OPEN", "increments Project.version by 1"]

  - method: POST
    path: "/projects/{id}/clock"
    description: "Advance the project logical clock (time-gated rules key off this clock); increments Project.version by 1"
    roles: [GCAdmin]
    code: 200
    input: [to_iso8601]
    output: Project
    side_effects: ["current_time_utc = to_iso8601", "increments Project.version by 1", "re-evaluates certificate expiry"]

  - method: GET
    path: "/projects/{id}/buyout-summary"
    description: "Computed read: per-package awarded/savings/posture roll-up; optional basis=PROVISIONAL|FINAL (default PROVISIONAL)"
    roles: [GCAdmin, OperationsManager, VicePresident, BuyoutLead]
    code: 200
    input: ["basis?"]
    output: "{ total_estimated_cents: integer, total_awarded_cents: integer, total_savings_cents: integer, packages: array }"
    side_effects: []

  # --- TradePackage ---
  - method: POST
    path: "/projects/{id}/trade-packages"
    description: "Create a trade package (OCC-guarded on Project.version)"
    roles: [BuyoutLead, GCAdmin]
    code: 201
    input: [trade_code, title, estimated_budget_cents, budgeted_contingency_cents, "spec_section?", "bid_due_at?", bonding_policy, expected_project_version]
    output: TradePackage
    side_effects: ["status=DRAFT", "increments Project.version by 1", "ERR_STALE_PACKAGE_VERSION (412) when expected_project_version != Project.version"]

  - method: GET
    path: "/trade-packages/{id}"
    description: "Get a trade package with computed buyout fields; optional basis=PROVISIONAL|FINAL (default PROVISIONAL)"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["basis?"]
    output: TradePackage
    side_effects: []

  - method: GET
    path: "/projects/{id}/trade-packages"
    description: "List trade packages of a project (paginated)"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TradePackage[]
    side_effects: []

  - method: POST
    path: "/trade-packages/{id}/publish"
    description: "Publish the package for bidding"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: TradePackage
    side_effects: ["DRAFT -> PUBLISHED", "ERR_BID_WINDOW_INVALID when bid_due_at <= project clock", "ERR_PACKAGE_NOT_OPEN when project not BUYOUT_OPEN"]

  - method: POST
    path: "/trade-packages/{id}/close-bidding"
    description: "Close bidding; package enters leveling"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: TradePackage
    side_effects: ["PUBLISHED -> UNDER_LEVELING", "ERR_NO_BIDS_RECEIVED unless at least one bid PLACED"]

  - method: GET
    path: "/trade-packages/{id}/replacement-analysis"
    description: "Computed read: replacement_cost_exposure for defaulted/replaced subcontracts on this package"
    roles: [GCAdmin, OperationsManager, VicePresident, BuyoutLead]
    code: 200
    input: []
    output: "{ items: array }"
    side_effects: []

  # --- Bid ---
  - method: POST
    path: "/trade-packages/{id}/bids"
    description: "Record a bid on a package"
    roles: [BuyoutLead, Estimator]
    code: 201
    input: [bidder_name, contact_email, base_bid_cents, "alternates?", "allowances?", bid_received_at]
    output: Bid
    side_effects: ["status=PLACED (RECEIVED is transitional)", "ERR_BID_AFTER_DEADLINE when bid_received_at > package.bid_due_at", "ERR_DUPLICATE_BIDDER for same bidder_name with PLACED/AWARDED bid", "ERR_TRADE_PACKAGE_NOT_ACCEPTING_BIDS unless package in {PUBLISHED, UNDER_LEVELING}"]

  - method: GET
    path: "/trade-packages/{id}/bids"
    description: "List bids for a package (includes WITHDRAWN; filterable)"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: GET
    path: "/bids/{id}"
    description: "Get a bid"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: POST
    path: "/trade-packages/{id}/bids/{id}/withdraw"
    description: "Withdraw a bid"
    roles: [BuyoutLead, OperationsManager]
    code: 200
    input: []
    output: Bid
    side_effects: ["PLACED -> WITHDRAWN"]

  - method: POST
    path: "/trade-packages/{id}/bids/{id}/award"
    description: "Award the package to a bid (leveling selection)"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: Bid
    side_effects: ["PLACED -> AWARDED", "ERR_NO_AWARDABLE_BID when no bid PLACED/AWARDED (checked BEFORE target-bid status)", "ERR_BID_NOT_AWARDABLE when this bid not PLACED"]

  - method: POST
    path: "/bids/{id}/un-award"
    description: "Compensating action: retract an award before subcontract award"
    roles: [BuyoutLead, OperationsManager]
    code: 200
    input: []
    output: Bid
    side_effects: ["AWARDED -> PLACED", "linked Subcontract PENDING_AWARD -> DRAFT (value reset to 0)"]

  # --- ScopeGap ---
  - method: POST
    path: "/trade-packages/{id}/gaps"
    description: "Log a scope gap discovered during leveling"
    roles: [BuyoutLead, OperationsManager]
    code: 201
    input: [category, description, "estimated_impact_cents?"]
    output: ScopeGap
    side_effects: ["status=OPEN", "package must be in {PUBLISHED, UNDER_LEVELING} else ERR_INVALID_STATE_TRANSITION"]

  - method: GET
    path: "/trade-packages/{id}/gaps"
    description: "List gaps on a package"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: ScopeGap[]
    side_effects: []

  - method: GET
    path: "/gaps/{id}"
    description: "Get a scope gap"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: []
    output: ScopeGap
    side_effects: []

  - method: POST
    path: "/gaps/{id}/resolve"
    description: "Resolve a gap with a priced disposition"
    roles: [BuyoutLead, OperationsManager, VicePresident]
    code: 200
    input: [resolution_kind, "priced_amount_cents?", "note?", "waived_by_role?"]
    output: ScopeGap
    side_effects: ["OPEN -> RESOLVED", "CONTINGENCY_DRAW consumes package contingency pool", "ALLOWANCE_WITH_QUALIFICATION requires waived_by_role in {OperationsManager, VicePresident}"]

  - method: POST
    path: "/gaps/{id}/defer"
    description: "Defer a gap (not allowed for LIFE_SAFETY)"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: ScopeGap
    side_effects: ["OPEN -> DEFERRED", "ERR_UNRESOLVED_LIFE_SAFETY_GAP when category == LIFE_SAFETY"]

  - method: POST
    path: "/gaps/{id}/reopen"
    description: "Reopen a deferred gap"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: ScopeGap
    side_effects: ["DEFERRED -> OPEN"]

  # --- Subcontract ---
  - method: POST
    path: "/trade-packages/{id}/subcontracts"
    description: "Create a subcontract draft from a leveled bid"
    roles: [BuyoutLead]
    code: 201
    input: [subcontractor_name, source_bid_id, flow_down_terms, "insurance_requirements_snapshot?", payment_terms, change_authority_limits]
    output: Subcontract
    side_effects: ["status=DRAFT, contract_value_cents=0, negotiation_round=0, insurance_status=MISSING, bonding_requirement=PENDING_DECISION (or NOT_REQUIRED when policy WAIVED)", "package must be UNDER_LEVELING with >= 2 bids and >= 1 WITHDRAWN bid else ERR_TRADE_PACKAGE_NOT_ACCEPTING_BIDS", "ERR_BID_NOT_AWARDABLE if source_bid not PLACED/AWARDED or already referenced by a non-terminal subcontract"]

  - method: GET
    path: "/subcontracts/{id}"
    description: "Get a subcontract"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: []
    output: Subcontract
    side_effects: []

  - method: GET
    path: "/trade-packages/{id}/subcontracts"
    description: "List subcontracts on a package"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Subcontract[]
    side_effects: []

  - method: POST
    path: "/subcontracts/{id}/recommend-award"
    description: "Recommend award with negotiated value (creates NegotiationRound)"
    roles: [BuyoutLead, OperationsManager]
    code: 200
    input: [contract_value_cents, "allowance_dispositions?", "alternate_selections?"]
    output: Subcontract
    side_effects: ["DRAFT -> PENDING_AWARD", "creates NegotiationRound", "pins contract_value_cents", "recomputes source bid leveled_value_cents from this round's dispositions (leveled_value)", "ERR_NEGOTIATION_ROUND_EXCEEDED at MAX_NEGOTIATION_ROUNDS=2", "ERR_CONTINGENCY_EXCEEDED fiscal check", "ERR_ALLOWANCE_UNRESOLVED / ERR_ALTERNATE_UNRESOLVED on incomplete dispositions"]

  - method: POST
    path: "/subcontracts/{id}/renegotiate"
    description: "Send a pending award back to draft (negotiation loop)"
    roles: [BuyoutLead]
    code: 200
    input: ["reason?"]
    output: Subcontract
    side_effects: ["PENDING_AWARD -> DRAFT", "negotiation_round += 1", "contract_value_cents reset to 0"]

  - method: POST
    path: "/subcontracts/{id}/award"
    description: "Formally award the subcontract"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Subcontract
    side_effects: ["PENDING_AWARD -> AWARDED", "ERR_UNRESOLVED_LIFE_SAFETY_GAP on blocking gaps", "ERR_CONTINGENCY_EXCEEDED fiscal check"]

  - method: POST
    path: "/subcontracts/{id}/issue"
    description: "Issue the subcontract for signature (gates on insurance + bond)"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: Subcontract
    side_effects: ["AWARDED -> ISSUED", "insurance gate: ERR_INSURANCE_MISSING / ERR_INSURANCE_NON_COMPLIANT / ERR_INSURANCE_CERT_EXPIRED", "ERR_BONDING_NOT_SATISFIED", "package UNDER_LEVELING -> BUYOUT_IN_PROGRESS"]

  - method: POST
    path: "/subcontracts/{id}/execute"
    description: "Record executed (signed) subcontract"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: Subcontract
    side_effects: ["ISSUED -> EXECUTED", "package awarded_value_cents recomputed", "package bubble-up to AWARDED when sole EXECUTED and siblings terminal", "project bubble-up to BUYOUT_COMPLETE"]

  - method: POST
    path: "/subcontracts/{id}/declare-default"
    description: "Declare subcontractor default"
    roles: [OperationsManager]
    code: 200
    input: [reason, estimated_replacement_cost_cents, "replacement_subcontract_id?"]
    output: Subcontract
    side_effects: ["EXECUTED -> DEFAULTED", "default_flag=true, default_recorded_at=clock, estimated_replacement_cost_cents stored", "package recompute; package AWARDED -> BUYOUT_IN_PROGRESS when no EXECUTED remains", "project BUYOUT_COMPLETE -> BUYOUT_OPEN when a package leaves AWARDED", "ERR_REPLACEMENT_LINK_INVALID for bad replacement link", "ERR_INVALID_STATE_TRANSITION when APPROVED SOV exists"]

  - method: POST
    path: "/subcontracts/{id}/replace"
    description: "Replace an executed subcontract: spawns a fresh DRAFT replacement"
    roles: [OperationsManager]
    code: 200
    input: [reason, estimated_replacement_cost_cents]
    output: Subcontract
    side_effects: ["EXECUTED -> REPLACED", "default_flag=true, default_recorded_at=clock, estimated_replacement_cost_cents stored", "creates replacement Subcontract DRAFT with replaces_subcontract_id set, negotiation_round=0, insurance_status=MISSING, contract_value_cents=0", "old certificates -> SUPERSEDED", "package recompute", "response exposes replacement_subcontract_id"]

  - method: POST
    path: "/subcontracts/{id}/terminate"
    description: "Terminate a draft subcontract"
    roles: [OperationsManager]
    code: 200
    input: ["reason?"]
    output: Subcontract
    side_effects: ["DRAFT -> TERMINATED"]

  - method: GET
    path: "/subcontracts/{id}/negotiation-rounds"
    description: "List negotiation rounds for a subcontract"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident]
    code: 200
    input: ["limit?", "offset?"]
    output: NegotiationRound[]
    side_effects: []

  - method: GET
    path: "/subcontracts/{id}/schedule-of-values"
    description: "List schedules of values for a subcontract (0..1 active)"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["limit?", "offset?"]
    output: ScheduleOfValues[]
    side_effects: []

  - method: GET
    path: "/subcontracts/{id}/replacements"
    description: "List replacement subcontracts spawned from this subcontract (replaces_subcontract_id == id)"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["limit?", "offset?"]
    output: Subcontract[]
    side_effects: []

  - method: GET
    path: "/bids/{id}/subcontracts"
    description: "List subcontracts sourced from this bid (source_bid_id == id)"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: ["limit?", "offset?"]
    output: Subcontract[]
    side_effects: []

  # --- InsuranceCertificate ---
  - method: POST
    path: "/subcontracts/{id}/insurance-certificates"
    description: "Register and evaluate a certificate of insurance"
    roles: [BuyoutLead]
    code: 201
    input: [certificate_number, gl_occurrence_cents, gl_aggregate_cents, auto_cents, umbrella_cents, workers_comp, ai_endorsed, wos_endorsed, ptd_endorsed, "pollution_cents?", expires_on, "evaluation_basis?"]
    output: InsuranceCertificate
    side_effects: ["runs insurance_compliance_check; sets compliance_verdict", "subcontract insurance_status recomputed per insurance_compliance_check", "subcontract in {AWARDED, ISSUED, EXECUTED} else ERR_INVALID_STATE_TRANSITION"]

  - method: GET
    path: "/subcontracts/{id}/insurance-certificates"
    description: "List certificates for a subcontract"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  # --- BondDecision ---
  - method: POST
    path: "/subcontracts/{id}/bond-decision"
    description: "Record the bonding/subguard decision for an awarded subcontract"
    roles: [OperationsManager]
    code: 201
    input: [trade_history, "decision_rationale?"]
    output: BondDecision
    side_effects: ["runs trade_risk_score then bond_premium_quote; sets decision + premium_cents", "subcontract bonding_requirement set to decision", "increments Subcontract.version by 1", "subcontract AWARDED else ERR_INVALID_STATE_TRANSITION; exactly one active BondDecision per subcontract else ERR_BOND_DECISION_LOCKED"]

  - method: GET
    path: "/subcontracts/{id}/bond-decisions"
    description: "List bond decisions for a subcontract"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident]
    code: 200
    input: ["limit?", "offset?"]
    output: BondDecision[]
    side_effects: []

  # --- ScheduleOfValues ---
  - method: POST
    path: "/subcontracts/{id}/schedule-of-values"
    description: "Submit a schedule of values (allocation evaluated immediately; lands BALANCED when it balances)"
    roles: [BuyoutLead]
    code: 201
    input: [lines]
    output: ScheduleOfValues
    side_effects: ["runs sov_line_allocation; balanced -> BALANCED", "ERR_SOV_IMBALANCE on non-positive total weight or weight < 1", "subcontract ISSUED/EXECUTED else ERR_INVALID_STATE_TRANSITION", "one active (non-REJECTED) SOV per subcontract else ERR_INVALID_STATE_TRANSITION", "ERR_BID_WITHDRAWN_SOV_BLOCKED when the source bid is WITHDRAWN"]

  - method: GET
    path: "/schedule-of-values/{id}"
    description: "Get an SOV (lines include computed allocated_amount_cents)"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, Estimator, SupplierDiversity]
    code: 200
    input: []
    output: ScheduleOfValues
    side_effects: []

  - method: POST
    path: "/schedule-of-values/{id}/reject"
    description: "Reject a balanced SOV"
    roles: [OperationsManager]
    code: 200
    input: [reason]
    output: ScheduleOfValues
    side_effects: ["BALANCED -> REJECTED", "subcontract sov_status -> REJECTED"]

  - method: POST
    path: "/schedule-of-values/{id}/revise"
    description: "Submit a revision to a rejected SOV (re-runs allocation; increments revision_number)"
    roles: [BuyoutLead]
    code: 200
    input: [lines]
    output: ScheduleOfValues
    side_effects: ["REJECTED -> REVISED -> (recompute) -> BALANCED", "revision_number += 1"]

  - method: POST
    path: "/schedule-of-values/{id}/approve"
    description: "Approve a balanced SOV"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ScheduleOfValues
    side_effects: ["BALANCED -> APPROVED", "approved_at = project clock", "subcontract sov_status -> APPROVED"]

  # --- ChangeOrder ---
  - method: POST
    path: "/subcontracts/{id}/change-orders"
    description: "Create a change order on an executed subcontract"
    roles: [BuyoutLead, ProjectManager, SupplierDiversity]
    code: 201
    input: [description, amount_cents, "initiating_role?"]
    output: ChangeOrder
    side_effects: ["creates ChangeOrder DRAFT", "subcontract EXECUTED else ERR_INVALID_STATE_TRANSITION", "ERR_SOV_NOT_APPROVED unless subcontract sov_status == APPROVED", "records created_by_user_id"]

  - method: GET
    path: "/subcontracts/{id}/change-orders"
    description: "List change orders for a subcontract"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, SupplierDiversity]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: GET
    path: "/change-orders/{id}"
    description: "Get a change order"
    roles: [GCAdmin, BuyoutLead, OperationsManager, ProjectExecutive, ProjectManager, VicePresident, SupplierDiversity]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/change-orders/{id}/submit"
    description: "Submit a change order for approval"
    roles: [BuyoutLead]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["DRAFT -> PENDING_APPROVAL"]

  - method: POST
    path: "/change-orders/{id}/approve"
    description: "Approve a change order (authority-tier checked per change_authority_check)"
    roles: [ProjectManager, ProjectExecutive, OperationsManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["PENDING_APPROVAL -> APPROVED when the approver's best authority tier covers amount and cumulative ratio", "ERR_CO_AUTHORITY_EXCEEDED / ERR_CO_CUMULATIVE_LIMIT otherwise", "ERR_SEGREGATION_OF_DUTIES when approver == created_by_user_id", "on APPROVED: subcontract contract_value_cents += amount; cumulative_co_cents += amount"]

  - method: POST
    path: "/change-orders/{id}/reject"
    description: "Reject a pending change order"
    roles: [ProjectManager, ProjectExecutive, OperationsManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["PENDING_APPROVAL -> REJECTED"]

  - method: POST
    path: "/change-orders/{id}/void"
    description: "Void an approved change order (compensating action)"
    roles: [OperationsManager]
    code: 200
    input: ["reason?"]
    output: ChangeOrder
    side_effects: ["APPROVED -> VOIDED", "subcontract contract_value_cents -= amount; cumulative_co_cents -= amount"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "Missing or invalid X-User-ID / X-User-Role headers"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist within its parent scope"
  - id: ERR_STALE_PACKAGE_VERSION
    http: 412
    condition: "expected_project_version does not match current Project.version (OCC)"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Resource not in a valid from-state for the requested transition"
  - id: ERR_PACKAGE_NOT_OPEN
    http: 409
    condition: "Project not in BUYOUT_OPEN for child mutations (e.g., still SETUP)"
  - id: ERR_BID_WINDOW_INVALID
    http: 409
    condition: "bid_due_at must be strictly after the project clock at publish"
  - id: ERR_BID_AFTER_DEADLINE
    http: 409
    condition: "bid_received_at strictly after package bid_due_at"
  - id: ERR_NO_BIDS_RECEIVED
    http: 409
    condition: "close-bidding requires at least one PLACED bid"
  - id: ERR_DUPLICATE_BIDDER
    http: 409
    condition: "Another PLACED/AWARDED bid with the same bidder_name exists on the package"
  - id: ERR_TRADE_PACKAGE_NOT_ACCEPTING_BIDS
    http: 409
    condition: "Package not in a state that accepts bids or subcontract drafts"
  - id: ERR_BID_NOT_AWARDABLE
    http: 409
    condition: "Target bid not PLACED (e.g., WITHDRAWN), or already referenced by a non-terminal subcontract"
  - id: ERR_NO_AWARDABLE_BID
    http: 409
    condition: "No bid on the package is PLACED or AWARDED (empty leveling candidate set)"
  - id: ERR_UNRESOLVED_LIFE_SAFETY_GAP
    http: 409
    condition: "OPEN LIFE_SAFETY ScopeGap blocks award/issue; LIFE_SAFETY gaps cannot be deferred"
  - id: ERR_ALLOWANCE_UNRESOLVED
    http: 409
    condition: "Outstanding allowance on the source bid lacks a disposition at recommend-award"
  - id: ERR_ALTERNATE_UNRESOLVED
    http: 409
    condition: "Outstanding alternate on the source bid lacks a selection at recommend-award"
  - id: ERR_NEGOTIATION_TERMS_INCOMPLETE
    http: 409
    condition: "Negotiation terms payload incomplete for the bid's allowances/alternates"
  - id: ERR_NEGOTIATION_ROUND_EXCEEDED
    http: 409
    condition: "negotiation_round would exceed MAX_NEGOTIATION_ROUNDS (2)"
  - id: ERR_CONTINGENCY_EXCEEDED
    http: 409
    condition: "Projected awarded value exceeds estimated budget plus remaining contingency pool"
  - id: ERR_AWARD_EXCEEDS_BUDGET
    http: 409
    condition: "Final award value exceeds package cap at award time"
  - id: ERR_INSURANCE_MISSING
    http: 409
    condition: "No insurance certificate on file at issue/execute"
  - id: ERR_INSURANCE_NON_COMPLIANT
    http: 409
    condition: "Certificates on file all evaluated NON_COMPLIANT (limit or endorsement shortfall)"
  - id: ERR_INSURANCE_CERT_EXPIRED
    http: 409
    condition: "All certificates expired relative to the project clock at issue/execute"
  - id: ERR_BONDING_NOT_SATISFIED
    http: 409
    condition: "Required BondDecision missing at issue (policy != WAIVED)"
  - id: ERR_BOND_DECISION_LOCKED
    http: 409
    condition: "An active BondDecision already exists for this subcontract"
  - id: ERR_SOV_IMBALANCE
    http: 409
    condition: "SOV allocation does not balance to contract value (or weights non-positive)"
  - id: ERR_SOV_NOT_APPROVED
    http: 409
    condition: "Change-order creation requires an APPROVED schedule of values"
  - id: ERR_BID_WITHDRAWN_SOV_BLOCKED
    http: 409
    condition: "SOV creation blocked because the source bid is WITHDRAWN"
  - id: ERR_CO_AUTHORITY_EXCEEDED
    http: 409
    condition: "Change-order amount exceeds every authority tier available to the approver"
  - id: ERR_CO_CUMULATIVE_LIMIT
    http: 409
    condition: "Cumulative approved change orders would exceed the approver tier's max_cumulative_pct"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Change-order approver must differ from its creator"
  - id: ERR_SUBCONTRACT_TERMINAL
    http: 409
    condition: "Operation invalid on DEFAULTED / REPLACED / TERMINATED subcontract"
  - id: ERR_REPLACEMENT_LINK_INVALID
    http: 409
    condition: "replacement_subcontract_id does not reference a DRAFT subcontract on the same package"
  - id: ERR_RETAINAGE_OUT_OF_BAND
    http: 422
    condition: "retainage_pct outside [0.05, 0.10]"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic field-level validation failure (types, enum membership, required fields)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GCAdmin
    description: "GC platform administrator: owns project lifecycle and logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /projects — create project"
      - "POST /projects/{id}/open — open buyout"
      - "POST /projects/{id}/clock — advance logical clock"
    shared_operations:
      - "POST /projects/{id}/trade-packages — create package (shared with BuyoutLead)"
      - "All GET endpoints"

  - name: BuyoutLead
    description: "Buyout lead: levels bids, negotiates, recommends award, issues and executes subcontracts, manages gaps and SOVs"
    identity: opaque
    exclusive_operations:
      - "POST /trade-packages/{id}/publish — publish"
      - "POST /trade-packages/{id}/close-bidding — close bidding"
      - "POST /trade-packages/{id}/bids/{id}/award — award bid"
      - "POST /subcontracts/{id}/renegotiate — negotiation loop"
      - "POST /subcontracts/{id}/issue — issue subcontract"
      - "POST /subcontracts/{id}/execute — record execution"
      - "POST /subcontracts/{id}/insurance-certificates — register certificate"
      - "POST /subcontracts/{id}/schedule-of-values — submit SOV"
      - "POST /schedule-of-values/{id}/revise — revise SOV"
      - "POST /gaps/{id}/defer — defer gap"
      - "POST /gaps/{id}/reopen — reopen gap"
      - "POST /change-orders/{id}/submit — submit change order"
      - "POST /trade-packages/{id}/subcontracts — create subcontract draft"
    shared_operations:
      - "POST /trade-packages/{id}/bids — record bid (shared with Estimator)"
      - "POST /trade-packages/{id}/gaps — log gap (shared with OperationsManager)"
      - "POST /trade-packages/{id}/bids/{id}/withdraw — withdraw bid (shared with OperationsManager)"
      - "POST /bids/{id}/un-award — un-award (shared with OperationsManager)"
      - "POST /subcontracts/{id}/recommend-award — recommend (shared with OperationsManager)"
      - "POST /gaps/{id}/resolve — resolve gap (shared with OperationsManager, VicePresident)"
      - "POST /subcontracts/{id}/change-orders — create change order (shared with ProjectManager, SupplierDiversity)"
      - "GET endpoints"

  - name: OperationsManager
    description: "Operations manager: awards subcontracts, decides bonding, declares default/replacement, approves SOVs and voids change orders"
    identity: opaque
    exclusive_operations:
      - "POST /subcontracts/{id}/award — award subcontract"
      - "POST /subcontracts/{id}/bond-decision — bond/subguard decision"
      - "POST /subcontracts/{id}/declare-default — declare default"
      - "POST /subcontracts/{id}/replace — replace subcontractor"
      - "POST /subcontracts/{id}/terminate — terminate draft"
      - "POST /schedule-of-values/{id}/reject — reject SOV"
      - "POST /schedule-of-values/{id}/approve — approve SOV"
      - "POST /change-orders/{id}/void — void change order"
    shared_operations:
      - "POST /gaps/{id}/resolve — resolve gap"
      - "POST /change-orders/{id}/approve — approve change order (shared with ProjectManager, ProjectExecutive)"
      - "POST /change-orders/{id}/reject — reject change order (shared with ProjectManager, ProjectExecutive)"
      - "GET endpoints incl. buyout-summary and replacement-analysis"

  - name: ProjectExecutive
    description: "Project executive: change-order approval at elevated authority tier; read access everywhere"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /change-orders/{id}/approve — approve change order"
      - "POST /change-orders/{id}/reject — reject change order"
      - "GET endpoints"

  - name: ProjectManager
    description: "Project manager: initiates and approves change orders at mid authority tier"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /subcontracts/{id}/change-orders — create change order"
      - "POST /change-orders/{id}/approve — approve change order"
      - "POST /change-orders/{id}/reject — reject change order"
      - "GET endpoints"

  - name: VicePresident
