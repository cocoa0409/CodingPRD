scenario: |
  2759. Content Moderation Operations (online platform trust and safety): policy taxonomy development with violation categories, severity tiers and enforcement actions, automated detection with classifier confidence thresholds routing to auto-action or human review, reviewer workforce management across languages, time zones and specialty queues with wellness protections, review quality assurance with audit sampling, accuracy measurement and reviewer calibration, appeals process with independent review and reinstatement, escalation paths for imminent harm, legal requests and high-profile accounts, transparency reporting on enforcement volumes, appeal outcomes and government requests, policy change management with reviewer retraining and back-testing on prior decisions
domain_name: content-moderation-operations
api_prefix: "/moderation"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy
    - version_pinning_on_approval
    - conditional_feature_flags
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic_origin
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Density comes from four interlocking gates, not from table size:
    (1) a detection signal's routing disposition is a function of classifier
    confidence, the author account's tier and its accumulated strike points,
    and the ACTIVE PolicyVersion's two thresholds — the case's policy version
    is PINNED at creation and never floats;
    (2) reviewer eligibility is a five-predicate selector (certification on the
    pinned version, language, specialty, shift window in reviewer-local time,
    wellness exposure budget, concurrency cap) with an explicit ranking and
    tie-break;
    (3) accuracy is measured by two divergent algorithms over the same audit and
    appeal data, and the gate that demotes a reviewer picks between them;
    (4) every enforcement action is reversible, and each reversal must restore
    two independently conserved quantities (account strike ledger, appeal-credit
    quota) exactly.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  TIER_CONFIDENCE_MULTIPLIER: { STANDARD: 1.00, HIGH_PROFILE: 0.85, GOVERNMENT: 0.80 }
  REPEAT_BONUS_PER_POINT: 0.01
  REPEAT_BONUS_CAP_POINTS: 10
  SEVERITY_POINTS: { T1: 8, T2: 4, T3: 2, T4: 1 }
  ACTION_WEIGHT: { REMOVE: 1.0, AGE_GATE: 0.75, WARN: 0.25, NO_ACTION: 0.0 }
  REPEAT_MULTIPLIER_STEP: 0.25
  REPEAT_MULTIPLIER_CAP_REMOVALS: 4
  STANDING_LIMITED_AT: 3
  STANDING_SUSPENDED_AT: 6
  STANDING_BANNED_AT: 10
  SEVERITY_SLA_DIVISOR: { T1: 4, T2: 2, T3: 1, T4: 1 }
  CONGESTION_MULTIPLIER: { "open<=5": 1.0, "6<=open<=15": 1.5, "open>=16": 2.0 }
  ESCALATION_SLA_MINUTES: 30
  LEGAL_SLA_MINUTES: 1440
  MEDIA_EXPOSURE_MULTIPLIER: { TEXT: 1, IMAGE: 2, VIDEO: 3 }
  RETRAIN_FLOOR: 0.8500
  SUSPEND_FLOOR: 0.6000
  MIN_GATE_SAMPLE: 2
  MAX_BACKTEST_DIVERGENCE: 0.2500
  DEFAULT_APPEAL_CREDITS: 3

entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: external_handle
        type: string
        source: input
        description: platform handle of the content author; unique across accounts
        constraints: "1..64 chars; unique (ERR_DUPLICATE_HANDLE)"
      - name: region_code
        type: string
        source: input
        description: ISO-3166 alpha-2 region the account is registered in
        constraints: "exactly 2 uppercase letters"
      - name: tier
        type: enum
        source: input
        description: enforcement-sensitivity tier of the account
        default: STANDARD
        constraints: "one of {STANDARD, HIGH_PROFILE, GOVERNMENT}"
      - name: appeal_credits_remaining
        type: integer
        source: input
        description: remaining appeals this account may file; decremented on filing, refunded only on OVERTURNED
        default: 3
        constraints: ">= 0; settable at creation by TrustSafetyAdmin, otherwise DEFAULT_APPEAL_CREDITS"
      - name: strike_points
        type: integer
        source: computed
        description: penalty ledger, recomputed by calculations.account_strike_ledger over this account's non-overturned DECIDED cases
        default: 0
        constraints: ">= 0"
      - name: lifetime_removed_count
        type: integer
        source: computed
        description: count of non-overturned DECIDED cases on this account's content whose decision_outcome == REMOVE; feeds the repeat multiplier
        default: 0
      - name: standing
        type: enum
        source: computed
        description: posture derived from strike_points by calculations.account_standing_posture
        default: GOOD_STANDING
        constraints: "one of {GOOD_STANDING, LIMITED, SUSPENDED, BANNED}"

  - name: ContentItem
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the author of this content"
      - name: language
        type: enum
        source: input
        description: content language, matched against ReviewQueue.language
        constraints: "one of {EN, ES, DE, AR, HI}"
      - name: media_kind
        type: enum
        source: input
        description: media type, selects MEDIA_EXPOSURE_MULTIPLIER for reviewer wellness accounting
        constraints: "one of {TEXT, IMAGE, VIDEO}"
      - name: graphic_weight
        type: integer
        source: input
        description: graphic-intensity base points of this content
        default: 0
        constraints: "0..10"
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant at which the item was ingested (ISO 8601 UTC, three fractional digits)
      - name: visibility_status
        type: enum
        source: computed
        description: first parallel state dimension — what the public sees
        default: LIVE
        constraints: "one of {LIVE, AGE_GATED, REMOVED, REINSTATED}"
      - name: review_status
        type: enum
        source: computed
        description: second parallel state dimension — where the item sits in the moderation pipeline; evolves independently of visibility_status
        default: CLEAR
        constraints: "one of {CLEAR, UNDER_REVIEW, ACTIONED, APPEALED}"
      - name: open_case_count
        type: integer
        source: computed
        description: count of ModerationCase rows on this item whose status is in {PENDING_ASSIGNMENT, ASSIGNED, ESCALATED}
        default: 0
      - name: reinstated_at
        type: datetime
        source: computed
        description: logical-clock instant at which an appeal reinstated this item; null while never reinstated

  - name: PolicyCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: stable taxonomy code cited by classifiers (natural key)
        constraints: "^[A-Z][A-Z_]{2,39}$; unique (ERR_DUPLICATE_CATEGORY_CODE)"
      - name: name
        type: string
        source: input
        description: human-readable taxonomy label
        constraints: "1..120 chars"
      - name: parent_category_id
        type: string
        source: input
        description: "FK -> PolicyCategory.id; parent taxonomy node; null for a root category"
      - name: severity_tier
        type: enum
        source: input
        description: severity tier, T1 most severe; a child may not be more severe than its parent
        constraints: "one of {T1, T2, T3, T4}; ordinal(T1)=1 .. ordinal(T4)=4; ordinal(self) >= ordinal(parent) when parent_category_id is set"
      - name: specialty
        type: enum
        source: input
        description: reviewer specialty required to work this category
        constraints: "one of {VIOLENCE, CSAM_ADJACENT, HATE, SPAM, MISINFO, SELF_HARM}"
      - name: status
        type: enum
        source: computed
        description: compound state bubbled up from child PolicyVersion rows — ACTIVE once any of its versions reaches ACTIVE
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE}"
      - name: active_version_id
        type: string
        source: computed
        description: back-reference to the id of this category's ACTIVE PolicyVersion (not an FK declaration; the owning FK is PolicyVersion.policy_category_id); null while no version is ACTIVE

  - name: PolicyVersion
    parent: PolicyCategory
    common_fields: true
    fields:
      - name: policy_category_id
        type: string
        source: input
        description: "FK -> PolicyCategory.id; the category this version governs"
      - name: supersedes_version_id
        type: string
        source: computed
        description: "FK -> PolicyVersion.id; the version that was ACTIVE for this category at activation time; null when this is the category's first ACTIVE version"
      - name: version_label
        type: string
        source: input
        description: operator-facing label such as "v3"
        constraints: "1..16 chars"
      - name: auto_action_threshold
        type: number
        source: input
        description: effective_confidence at or above which a signal is auto-actioned (>= comparison)
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: review_floor
        type: number
        source: input
        description: effective_confidence strictly below which a signal is DISCARDED (< comparison)
        constraints: "0.0000..1.0000, 4 decimal places; review_floor <= auto_action_threshold (ERR_THRESHOLD_ORDER_INVALID)"
      - name: enforcement_action
        type: enum
        source: input
        description: outcome applied when the routing disposition is AUTO_ACTION
        constraints: "one of {REMOVE, AGE_GATE, WARN}"
      - name: appeal_window_hours
        type: integer
        source: input
        description: hours after decided_at during which an appeal may be filed
        default: 72
        constraints: "1..8760"
      - name: review_sla_minutes
        type: integer
        source: input
        description: base human-review SLA before congestion and severity adjustment
        default: 240
        constraints: "5..10080"
      - name: requires_recertification
        type: boolean
        source: input
        description: conditional flag — when true, activating this version revokes reviewer certifications held on the version it supersedes
        default: true
      - name: backtest_sample_size
        type: integer
        source: computed
        description: number of prior decided cases replayed by the most recent back-test
        default: 0
      - name: backtest_divergence_rate
        type: number
        source: computed
        description: fraction of replayed cases whose predicted routing class differs from the historical one, 4 decimal places; null before the first back-test
      - name: backtest_completed_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent back-test completion; null before the first back-test
      - name: authored_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the PolicyManager that created this version
      - name: activated_by_user_id
        type: string
        source: computed
        description: opaque X-User-ID of the PolicyManager that activated this version; MUST differ from authored_by_user_id
      - name: activated_at
        type: datetime
        source: computed
        description: logical-clock instant of activation; null until ACTIVE
      - name: status
        type: enum
        source: computed
        description: lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, BACKTESTING, ACTIVE, SUPERSEDED}"

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: reviewer display name
        constraints: "1..80 chars"
      - name: languages
        type: array
        source: input
        description: languages this reviewer can work, each from {EN, ES, DE, AR, HI}
        constraints: "non-empty, no duplicates"
      - name: specialties
        type: array
        source: input
        description: specialties this reviewer is trained on, each from PolicyCategory.specialty's enum
        constraints: "non-empty, no duplicates"
      - name: utc_offset_minutes
        type: integer
        source: input
        description: fixed offset from UTC used to convert the logical clock into reviewer-local time for the shift check
        constraints: "-720..840"
      - name: shift_start_local_hour
        type: integer
        source: input
        description: inclusive start hour of the reviewer's shift in reviewer-local time
        constraints: "0..23"
      - name: shift_end_local_hour
        type: integer
        source: input
        description: exclusive end hour of the reviewer's shift in reviewer-local time; when shift_end_local_hour <= shift_start_local_hour the window wraps midnight
        constraints: "1..24"
      - name: role_class
        type: enum
        source: input
        description: workforce class — FRONTLINE takes ordinary cases, SENIOR may take ESCALATED cases and appeals, QA performs audit sampling
        constraints: "one of {FRONTLINE, SENIOR, QA}"
      - name: max_concurrent_cases
        type: integer
        source: input
        description: concurrency cap on ASSIGNED cases
        default: 3
        constraints: "1..20"
      - name: daily_exposure_cap_points
        type: integer
        source: input
        description: wellness budget — maximum exposure points this reviewer may hold at once
        default: 20
        constraints: "1..200"
      - name: certified_policy_version_ids
        type: array
        source: computed
        description: ids of PolicyVersion rows this reviewer is currently certified on; a case may only be decided when its pinned policy_version_id is in this array
        default: []
      - name: pending_retraining_version_ids
        type: array
        source: computed
        description: ids of PolicyVersion rows this reviewer must be retrained on after a policy activation revoked an earlier certification
        default: []
      - name: open_case_count
        type: integer
        source: computed
        description: count of ModerationCase rows with assigned_reviewer_id == this reviewer and status == ASSIGNED
        default: 0
      - name: exposure_points_today
        type: integer
        source: computed
        description: sum of exposure_points_charged over the reviewer's currently held (ASSIGNED) cases plus all cases this reviewer has decided since the last wellness break
        default: 0
      - name: audited_count
        type: integer
        source: computed
        description: number of AuditSample rows with status AUDITED and counts_toward_accuracy true on cases this reviewer decided
        default: 0
      - name: agree_count
        type: integer
        source: computed
        description: subset of audited_count whose verdict == AGREE
        default: 0
      - name: appealed_count
        type: integer
        source: computed
        description: number of Appeal rows in a terminal status ({UPHELD, OVERTURNED}) on cases this reviewer decided
        default: 0
      - name: upheld_appeal_count
        type: integer
        source: computed
        description: subset of appealed_count whose status == UPHELD
        default: 0
      - name: accuracy_score_audit_only
        type: number
        source: computed
        description: variant A of calculations.reviewer_accuracy_score, 4 decimal places; null while audited_count == 0
      - name: accuracy_score_blended
        type: number
        source: computed
        description: variant B of calculations.reviewer_accuracy_score, 4 decimal places; null while audited_count + appealed_count == 0
      - name: wellness_break_start
        type: datetime
        source: computed
        description: start instant of the most recently booked wellness break; null until the first break
      - name: wellness_break_end
        type: datetime
        source: computed
        description: exclusive end instant of the most recently booked wellness break (start + break_minutes); retained after return-to-duty as the protected window
      - name: wellness_breaks_taken
        type: integer
        source: computed
        description: number of wellness breaks booked
        default: 0
      - name: status
        type: enum
        source: computed
        description: workforce state
        default: ACTIVE
        constraints: "one of {ACTIVE, ON_WELLNESS_BREAK, PENDING_RETRAINING, SUSPENDED}"

  - name: ReviewQueue
    parent: PolicyCategory
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: queue label
        constraints: "1..80 chars"
      - name: policy_category_id
        type: string
        source: input
        description: "FK -> PolicyCategory.id; the single category this specialty queue serves"
      - name: language
        type: enum
        source: input
        description: language this queue serves; must equal ContentItem.language for a case to route here
        constraints: "one of {EN, ES, DE, AR, HI}"
      - name: specialty
        type: enum
        source: input
        description: specialty of the queue; must equal the category's specialty (ERR_QUEUE_SPECIALTY_MISMATCH)
        constraints: "one of {VIOLENCE, CSAM_ADJACENT, HATE, SPAM, MISINFO, SELF_HARM}"
      - name: open_case_count
        type: integer
        source: computed
        description: count of ModerationCase rows with queue_id == this queue and status in {PENDING_ASSIGNMENT, ASSIGNED, ESCALATED}
        default: 0
      - name: unassigned_case_count
        type: integer
        source: computed
        description: count of ModerationCase rows with queue_id == this queue and status == PENDING_ASSIGNMENT
        default: 0

  - name: DetectionSignal
    parent: ContentItem
    common_fields: false
    fields:
      - name: content_item_id
        type: string
        source: input
        description: "FK -> ContentItem.id; the scanned item"
      - name: policy_category_code
        type: string
        source: input
        description: natural-key reference to PolicyCategory.code emitted by the classifier; resolved to the category row at ingest (ERR_CATEGORY_NOT_FOUND when unknown)
      - name: classifier_id
        type: string
        source: input
        description: identifier of the model that produced the signal
        constraints: "1..40 chars"
      - name: classifier_confidence
        type: number
        source: input
        description: raw model confidence
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: effective_confidence
        type: number
        source: computed
        description: output of calculations.effective_confidence, 4 decimal places
      - name: disposition
        type: enum
        source: computed
        description: output of calculations.routing_disposition
        constraints: "one of {DISCARDED, AUTO_ACTION, HUMAN_REVIEW}"
      - name: resulting_case_id
        type: string
        source: computed
        description: back-reference to the id of the ModerationCase minted by routing (not an FK declaration; the owning FK is ModerationCase.detection_signal_id); null when disposition == DISCARDED
      - name: pinned_policy_version_label
        type: string
        source: computed
        description: version_label of the PolicyVersion pinned onto the resulting case, echoed for audit; null when disposition == DISCARDED

  - name: ModerationCase
    parent: ContentItem
    common_fields: true
    fields:
      - name: content_item_id
        type: string
        source: input
        description: "FK -> ContentItem.id; the item under review"
      - name: detection_signal_id
        type: string
        source: computed
        description: "FK -> DetectionSignal.id; the signal that minted this case; null for LEGAL_REQUEST and MANUAL_REPORT origins"
      - name: policy_version_id
        type: string
        source: computed
        description: "FK -> PolicyVersion.id; the version PINNED at creation — thresholds, SLA and appeal window are read from this row forever, never from the category's current ACTIVE version"
      - name: queue_id
        type: string
        source: computed
        description: "FK -> ReviewQueue.id; the queue selected by calculations.queue_selection; null when disposition == AUTO_ACTION"
      - name: assigned_reviewer_id
        type: string
        source: computed
        description: "FK -> Reviewer.id; currently holding reviewer; null while PENDING_ASSIGNMENT, ESCALATED or auto-decided"
      - name: decided_by_reviewer_id
        type: string
        source: computed
        description: "FK -> Reviewer.id; reviewer that recorded the decision; null for AUTO and LEGAL decision sources"
      - name: origin
        type: enum
        source: input
        description: how the case entered the system
        constraints: "one of {CLASSIFIER, LEGAL_REQUEST, MANUAL_REPORT}"
      - name: escalation_reason
        type: enum
        source: computed
        description: why the case was escalated; null when never escalated
        constraints: "one of {IMMINENT_HARM, LEGAL_REQUEST, HIGH_PROFILE, CALIBRATION}"
      - name: escalation_tier
        type: integer
        source: computed
        description: 0 ordinary, 1 mandatory-human-review at routing time, 2 escalated to senior/legal handling
        default: 0
        constraints: "0..2"
      - name: legal_jurisdiction
        type: string
        source: input
        description: requesting jurisdiction, required when origin == LEGAL_REQUEST (ERR_LEGAL_CASE_REQUIRES_JURISDICTION); null otherwise
        constraints: "exactly 2 uppercase letters when present"
      - name: legal_reference
        type: string
        source: input
        description: government or court reference string for the request; optional
      - name: sla_due_at
        type: datetime
        source: computed
        description: deadline from calculations.review_sla_due_at; recomputed on escalation
      - name: sla_breached
        type: boolean
        source: computed
        description: true when decided_at > sla_due_at, evaluated once at decision time
        default: false
      - name: decision_outcome
        type: enum
        source: computed
        description: recorded outcome; null until DECIDED
        constraints: "one of {REMOVE, AGE_GATE, WARN, NO_ACTION}"
      - name: decision_source
        type: enum
        source: computed
        description: who produced the decision; null until DECIDED
        constraints: "one of {AUTO, HUMAN, LEGAL}"
      - name: decided_at
        type: datetime
        source: computed
        description: logical-clock instant of the decision; null until DECIDED
      - name: strike_points_applied
        type: integer
        source: computed
        description: output of calculations.strike_points_applied at decision time; frozen thereafter
        default: 0
      - name: is_overturned
        type: boolean
        source: computed
        description: set true when an appeal on this case resolves OVERTURNED; excludes the case from the strike ledger and from RESTATED transparency volumes
        default: false
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: decided_at + PolicyVersion.appeal_window_hours (from the PINNED version); null until DECIDED
      - name: exposure_points_charged
        type: integer
        source: computed
        description: ContentItem.graphic_weight * MEDIA_EXPOSURE_MULTIPLIER[media_kind], charged to the holding reviewer at assignment
        default: 0
      - name: requires_recertified_review
        type: boolean
        source: computed
        description: set true when the pinned policy version is superseded by an activation that requires recertification, or when the holding reviewer is demoted to PENDING_RETRAINING
        default: false
      - name: reassignment_count
        type: integer
        source: computed
        description: number of assignments after the first
        default: 0

  - name: Appeal
    parent: ModerationCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ModerationCase.id; the decided case being appealed"
      - name: account_id
        type: string
        source: computed
        description: "FK -> Account.id; appellant, copied from the case's ContentItem.account_id"
      - name: independent_reviewer_id
        type: string
        source: computed
        description: "FK -> Reviewer.id; independent reviewer, never the reviewer that decided the case; null until assigned"
      - name: grounds_text
        type: string
        source: input
        description: appellant's stated grounds
        constraints: "1..500 chars"
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant the appeal was filed
      - name: resolved_at
        type: datetime
        source: computed
        description: logical-clock instant of resolution; null until terminal
      - name: resolution_note
        type: string
        source: computed
        description: independent reviewer's note; null until resolved
      - name: reinstated_content
        type: boolean
        source: computed
        description: true when resolution OVERTURNED restored a previously AGE_GATED or REMOVED item
        default: false
      - name: status
        type: enum
        source: computed
        description: appeal lifecycle
        default: SUBMITTED
        constraints: "one of {SUBMITTED, INDEPENDENT_REVIEW, UPHELD, OVERTURNED}"

  - name: AuditSample
    parent: ModerationCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ModerationCase.id; the decided case pulled into QA"
      - name: auditor_reviewer_id
        type: string
        source: computed
        description: "FK -> Reviewer.id; the QA auditor, taken from X-User-ID; never the case's decided_by_reviewer_id"
      - name: sampling_reason
        type: enum
        source: input
        description: why the case was sampled
        constraints: "one of {RANDOM, TARGETED_LOW_ACCURACY, POST_POLICY_CHANGE}"
      - name: verdict
        type: enum
        source: computed
        description: auditor's verdict; null until AUDITED
        constraints: "one of {AGREE, DISAGREE_MINOR, DISAGREE_MATERIAL}"
      - name: correct_outcome
        type: enum
        source: computed
        description: outcome the auditor considers correct; null unless verdict is a disagreement
        constraints: "one of {REMOVE, AGE_GATE, WARN, NO_ACTION}"
      - name: audited_at
        type: datetime
        source: computed
        description: logical-clock instant of the (latest) audit
      - name: dispute_note
        type: string
        source: computed
        description: deciding reviewer's calibration dispute note; null unless disputed at least once
      - name: disputed_at
        type: datetime
        source: computed
        description: logical-clock instant of the latest dispute
      - name: counts_toward_accuracy
        type: boolean
        source: computed
        description: false while status == DISPUTED (the sample leaves the accuracy denominator), true again once re-audited
        default: true
      - name: status
        type: enum
        source: computed
        description: QA lifecycle
        default: SAMPLED
        constraints: "one of {SAMPLED, AUDITED, DISPUTED}"

  - name: TransparencyReport
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the reporting period (closed interval)
      - name: period_end
        type: datetime
        source: input
        description: inclusive end of the reporting period (closed interval); must be strictly after period_start
      - name: variant
        type: enum
        source: computed
        description: which algorithm produced the current figures; null until first computed
        constraints: "one of {PROVISIONAL, RESTATED}"
      - name: enforcement_volume
        type: integer
        source: computed
        description: total decided cases counted under the current variant
        default: 0
      - name: removal_volume
        type: integer
        source: computed
        description: subset of enforcement_volume with decision_outcome == REMOVE
        default: 0
      - name: age_gate_volume
        type: integer
        source: computed
        description: subset of enforcement_volume with decision_outcome == AGE_GATE
        default: 0
      - name: warn_volume
        type: integer
        source: computed
        description: subset of enforcement_volume with decision_outcome == WARN
        default: 0
      - name: overturn_adjusted_volume
        type: integer
        source: computed
        description: decided cases in period with is_overturned == false; equals enforcement_volume under the RESTATED variant
        default: 0
      - name: appeal_count
        type: integer
        source: computed
        description: appeals counted under the current variant
        default: 0
      - name: appeal_overturn_rate
        type: number
        source: computed
        description: round-then-average per-category overturn rate, 4 decimal places
        default: 0.0000
      - name: category_rate_breakdown
        type: array
        source: computed
        description: per-category objects { category_code, appealed, overturned, rate } sorted by category_code ASC, each rate already rounded to 4 decimal places
        default: []
      - name: legal_request_count
        type: integer
        source: computed
        description: decided cases in period with origin == LEGAL_REQUEST
        default: 0
      - name: legal_grant_rate
        type: number
        source: computed
        description: fraction of legal-origin decided cases in period whose decision_outcome == REMOVE, 4 decimal places; 0.0000 when legal_request_count == 0
        default: 0.0000
      - name: computed_at
        type: datetime
        source: computed
        description: logical-clock instant of the latest computation
      - name: published_at
        type: datetime
        source: computed
        description: logical-clock instant of publication; null until PUBLISHED
      - name: status
        type: enum
        source: computed
        description: report lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, COMPUTED, PUBLISHED}"

state_machines:
  - entity: ModerationCase
    initial_state: PENDING_ASSIGNMENT
    terminal_states: [DECIDED]
    note: |
      Branching-with-cycle shape. Auto-actioned cases are minted directly in
      DECIDED; LEGAL_REQUEST-origin cases are minted directly in ESCALATED;
      CLASSIFIER human-review and MANUAL_REPORT cases start in
      PENDING_ASSIGNMENT. ASSIGNED forks into {DECIDED, ESCALATED} with
      disjoint side-effect sets, and ESCALATED loops back to ASSIGNED or
      PENDING_ASSIGNMENT.
    transitions:
      - from: null
        to: PENDING_ASSIGNMENT
        trigger: "POST /moderation/detection-signals with disposition == HUMAN_REVIEW, or POST /moderation/moderation-cases with origin == MANUAL_REPORT"
        actor: TrustSafetyAdmin
        preconditions:
          - "the resolved PolicyCategory has status == ACTIVE and a non-null active_version_id (else ERR_NO_ACTIVE_POLICY_VERSION)"
          - "ContentItem.visibility_status != REMOVED (else ERR_CONTENT_NOT_LIVE)"
          - "calculations.queue_selection yields exactly one queue (else ERR_NO_ELIGIBLE_QUEUE and nothing is persisted)"
        side_effects:
          - "policy_version_id is PINNED to the category's active_version_id"
          - "queue_id set from calculations.queue_selection"
          - "ReviewQueue.open_case_count += 1 and ReviewQueue.unassigned_case_count += 1 (applied BEFORE the SLA congestion read)"
          - "sla_due_at set from calculations.review_sla_due_at"
          - "ContentItem.review_status := UNDER_REVIEW and ContentItem.open_case_count += 1"
          - "escalation_tier := 1 and escalation_reason := IMMINENT_HARM when category.severity_tier == T1, or HIGH_PROFILE when Account.tier in {HIGH_PROFILE, GOVERNMENT} and severity_tier != T1; otherwise 0 / null"
      - from: null
        to: DECIDED
        trigger: "POST /moderation/detection-signals with disposition == AUTO_ACTION"
        actor: system
        preconditions:
          - "effective_confidence >= PolicyVersion.auto_action_threshold"
          - "Account.tier == STANDARD and category.severity_tier != T1"
        side_effects:
          - "decision_source := AUTO, decided_by_reviewer_id := null, queue_id := null, decision_outcome := PolicyVersion.enforcement_action, decided_at := clock now"
          - "strike_points_applied set from calculations.strike_points_applied"
          - "appeal_deadline_at := decided_at + pinned PolicyVersion.appeal_window_hours"
          - "ContentItem.visibility_status := REMOVED when outcome REMOVE, AGE_GATED when AGE_GATE, unchanged when WARN; ContentItem.review_status := ACTIONED"
          - "Account.lifetime_removed_count += 1 when outcome == REMOVE; then Account.strike_points recomputed; then Account.standing recomputed"
      - from: null
        to: ESCALATED
        trigger: "POST /moderation/moderation-cases with origin == LEGAL_REQUEST"
        actor: LegalCounsel
        preconditions:
          - "legal_jurisdiction present (else ERR_LEGAL_CASE_REQUIRES_JURISDICTION)"
          - "the resolved PolicyCategory has a non-null active_version_id"
        side_effects:
          - "escalation_reason := LEGAL_REQUEST, escalation_tier := 2"
          - "queue_id set from calculations.queue_selection; ReviewQueue.open_case_count += 1 (unassigned_case_count NOT incremented — the case is not queue-assignable while ESCALATED)"
          - "sla_due_at := clock now + LEGAL_SLA_MINUTES"
          - "ContentItem.review_status := UNDER_REVIEW and ContentItem.open_case_count += 1"
      - from: PENDING_ASSIGNMENT
        to: ASSIGNED
        trigger: "POST /moderation/moderation-cases/{id}/assign"
        actor: TrustSafetyAdmin | QAAuditor
        preconditions:
          - "expected_case_version equals ModerationCase.version (else ERR_STALE_CASE_VERSION)"
          - "when target_reviewer_id is supplied, that reviewer satisfies every eligibility predicate of calculations.reviewer_selection individually; otherwise the selector's candidate pool is non-empty (else ERR_NO_ELIGIBLE_REVIEWER)"
        side_effects:
          - "assigned_reviewer_id := selected reviewer; Reviewer.open_case_count += 1"
          - "exposure_points_charged := ContentItem.graphic_weight * MEDIA_EXPOSURE_MULTIPLIER[media_kind]; Reviewer.exposure_points_today += exposure_points_charged"
          - "ReviewQueue.unassigned_case_count -= 1 (open_case_count unchanged)"
          - "ModerationCase.version += 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /moderation/moderation-cases/{id}/assign (reassignment — legitimately supersedes the prior assignment)"
        actor: TrustSafetyAdmin | QAAuditor
        preconditions:
          - "expected_case_version equals ModerationCase.version (else ERR_STALE_CASE_VERSION)"
          - "the currently assigned reviewer is excluded from the candidate pool and from target_reviewer_id"
        side_effects:
          - "previous reviewer: open_case_count -= 1 and exposure_points_today -= exposure_points_charged"
          - "new reviewer: open_case_count += 1 and exposure_points_today += exposure_points_charged"
          - "reassignment_count += 1; ModerationCase.version += 1"
      - from: ESCALATED
        to: ASSIGNED
        trigger: "POST /moderation/moderation-cases/{id}/assign"
        actor: TrustSafetyAdmin | QAAuditor
        preconditions:
          - "expected_case_version equals ModerationCase.version (else ERR_STALE_CASE_VERSION)"
          - "the selected reviewer has role_class in {SENIOR, QA} (escalated cases are senior-only; a FRONTLINE target yields ERR_REVIEWER_NOT_ELIGIBLE_FOR_ESCALATION)"
        side_effects:
          - "assigned_reviewer_id := selected reviewer; Reviewer.open_case_count += 1; Reviewer.exposure_points_today += exposure_points_charged"
          - "reassignment_count += 1; ModerationCase.version += 1"
        note: "closes the ESCALATED -> ASSIGNED -> ESCALATED cycle"
      - from: ASSIGNED
        to: ESCALATED
        trigger: "POST /moderation/moderation-cases/{id}/escalate"
        actor: Reviewer | QAAuditor
        preconditions:
          - "acting Reviewer's X-User-ID == assigned_reviewer_id (else ERR_NOT_CASE_OWNER)"
          - "Reviewer.status == ACTIVE (else ERR_REVIEWER_NOT_ACTIVE)"
        side_effects:
          - "escalation_reason := request's escalation_reason; escalation_tier := 2"
          - "assigned_reviewer_id := null; prior reviewer's open_case_count -= 1 and exposure_points_today -= exposure_points_charged (workload and exposure conserved)"
          - "ReviewQueue.unassigned_case_count unchanged (an ESCALATED case is not queue-assignable)"
          - "sla_due_at := clock now + ESCALATION_SLA_MINUTES (congestion multiplier NOT applied on this branch)"
      - from: ESCALATED
        to: PENDING_ASSIGNMENT
        trigger: "POST /moderation/moderation-cases/{id}/return-to-queue"
        actor: QAAuditor | TrustSafetyAdmin
        preconditions:
          - "status == ESCALATED (else ERR_INVALID_CASE_TRANSITION)"
        side_effects:
          - "escalation_tier := 1 (de-escalated but flagged), escalation_reason retained"
          - "ReviewQueue.unassigned_case_count += 1"
          - "sla_due_at recomputed from calculations.review_sla_due_at using the queue's post-state open_case_count"
      - from: ASSIGNED
        to: DECIDED
        trigger: "POST /moderation/moderation-cases/{id}/decide"
        actor: Reviewer
        preconditions:
          - "X-User-ID == assigned_reviewer_id (else ERR_NOT_CASE_OWNER)"
          - "Reviewer.status == ACTIVE (else ERR_REVIEWER_NOT_ACTIVE)"
          - "the certification target required by validations[priority=50] is present in Reviewer.certified_policy_version_ids -- the case's pinned policy_version_id normally, or the category's CURRENT active_version_id when requires_recertified_review is true (else ERR_REVIEWER_NOT_CERTIFIED)"
        side_effects:
          - "decision_source := HUMAN; decided_by_reviewer_id := X-User-ID; decided_at := clock now; sla_breached := decided_at > sla_due_at"
          - "strike_points_applied from calculations.strike_points_applied; appeal_deadline_at := decided_at + pinned appeal_window_hours"
          - "Reviewer.open_case_count -= 1 (exposure_points_today NOT refunded — the reviewer was exposed)"
          - "ReviewQueue.open_case_count -= 1"
          - "ContentItem.visibility_status := REMOVED | AGE_GATED | unchanged (WARN, NO_ACTION); ContentItem.review_status := ACTIONED when outcome in {REMOVE, AGE_GATE, WARN}, CLEAR when NO_ACTION; ContentItem.open_case_count -= 1"
          - "Account.lifetime_removed_count += 1 when outcome == REMOVE; then Account.strike_points recomputed; then Account.standing recomputed"
      - from: ESCALATED
        to: DECIDED
        trigger: "POST /moderation/moderation-cases/{id}/decide by LegalCounsel"
        actor: LegalCounsel
        preconditions:
          - "escalation_reason == LEGAL_REQUEST (else ERR_UNAUTHORIZED)"
        side_effects:
          - "decision_source := LEGAL; decided_by_reviewer_id := null; decided_at := clock now; sla_breached := decided_at > sla_due_at"
          - "same content, strike-ledger and standing cascade as the ASSIGNED -> DECIDED branch"
          - "ReviewQueue.open_case_count -= 1; ContentItem.open_case_count -= 1"

  - entity: ContentItem
    initial_state: "LIVE x CLEAR"
    terminal_states: []
    note: |
      Parallel state dimensions: visibility_status and review_status advance on
      independent axes. A WARN decision moves review_status to ACTIONED while
      visibility_status stays LIVE; an OVERTURNED appeal on a WARN case returns
      review_status to CLEAR while visibility_status is still LIVE.
    transitions:
      - from: "visibility LIVE"
        to: "visibility REMOVED | AGE_GATED"
        trigger: "ModerationCase -> DECIDED with decision_outcome in {REMOVE, AGE_GATE}"
        actor: system
        preconditions: ["the case's content_item_id == this item"]
        side_effects: ["visibility_status set; review_status advanced independently to ACTIONED"]
      - from: "visibility REMOVED | AGE_GATED"
        to: "visibility REINSTATED"
        trigger: "Appeal -> OVERTURNED"
        actor: system
        preconditions: ["visibility_status in {REMOVED, AGE_GATED} (a WARN/NO_ACTION case leaves visibility LIVE and no reinstatement occurs)"]
        side_effects: ["reinstated_at := clock now; Appeal.reinstated_content := true"]
      - from: "review CLEAR"
        to: "review UNDER_REVIEW"
        trigger: "ModerationCase created in PENDING_ASSIGNMENT or ESCALATED"
        actor: system
        preconditions: []
        side_effects: ["open_case_count += 1"]
      - from: "review UNDER_REVIEW"
        to: "review ACTIONED | CLEAR"
        trigger: "ModerationCase -> DECIDED"
        actor: system
        preconditions: []
        side_effects: ["ACTIONED for outcomes {REMOVE, AGE_GATE, WARN}; CLEAR for NO_ACTION; open_case_count -= 1"]
      - from: "review ACTIONED"
        to: "review APPEALED"
        trigger: "POST /moderation/appeals"
        actor: AccountHolder
        preconditions: ["the appealed case is DECIDED on this item"]
        side_effects: ["visibility_status unchanged on this transition"]
      - from: "review APPEALED"
        to: "review CLEAR | ACTIONED"
        trigger: "POST /moderation/appeals/{id}/resolve"
        actor: Reviewer
        preconditions: []
        side_effects: ["CLEAR when OVERTURNED, back to ACTIONED when UPHELD"]

  - entity: PolicyVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cyclic: DRAFT -> BACKTESTING -> DRAFT (revision loop) -> BACKTESTING -> ACTIVE -> SUPERSEDED."
    transitions:
      - from: DRAFT
        to: BACKTESTING
        trigger: "POST /moderation/policy-versions/{id}/back-test"
        actor: PolicyManager
        preconditions:
          - "status == DRAFT (else ERR_POLICY_VERSION_NOT_DRAFT)"
        side_effects:
          - "backtest_sample_size, backtest_divergence_rate set from calculations.backtest_divergence_rate"
          - "backtest_completed_at := clock now"
      - from: BACKTESTING
        to: DRAFT
        trigger: "POST /moderation/policy-versions/{id}/revise"
        actor: PolicyManager
        preconditions:
          - "status == BACKTESTING (else ERR_POLICY_VERSION_NOT_DRAFT)"
        side_effects:
          - "supplied threshold / SLA / appeal-window / requires_recertification fields overwritten"
          - "backtest_divergence_rate := null, backtest_sample_size := 0, backtest_completed_at := null (a revised draft must be re-back-tested)"
      - from: BACKTESTING
        to: ACTIVE
        trigger: "POST /moderation/policy-versions/{id}/activate"
        actor: PolicyManager
        preconditions:
          - "status == BACKTESTING (else ERR_POLICY_VERSION_NOT_BACKTESTED)"
          - "X-User-ID != authored_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "backtest_divergence_rate <= MAX_BACKTEST_DIVERGENCE (else ERR_BACKTEST_DIVERGENCE_EXCEEDED)"
        side_effects:
          - "activated_by_user_id := X-User-ID; activated_at := clock now"
          - "supersedes_version_id := the category's prior active_version_id (null when none)"
          - "CASCADE step 1: the prior ACTIVE version of this category transitions ACTIVE -> SUPERSEDED"
          - "CASCADE step 2 (caused by step 1, only when this version's requires_recertification == true): every Reviewer whose certified_policy_version_ids contains the superseded id drops it and appends this version's id to pending_retraining_version_ids; Reviewer.status is NOT touched by an activation — only the accuracy gate in calculations.reviewer_accuracy_score and the two wellness endpoints move Reviewer.status"
          - "CASCADE step 3 (caused by step 2, and therefore also only when this version's requires_recertification == true): every ASSIGNED ModerationCase held by those reviewers, and every ASSIGNED or PENDING_ASSIGNMENT case whose pinned policy_version_id is the superseded id, gets requires_recertified_review := true (cases are NOT unassigned — the block is enforced at decide time). When requires_recertification is false the activation touches no certification and no case flag."
          - "PolicyCategory.active_version_id := this version's id; PolicyCategory.status := ACTIVE when it was DRAFT (bubble-up)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "activation of a newer version of the same PolicyCategory (system, cascade step 1)"
        actor: system
        preconditions: ["a newer version of the same category reaches ACTIVE"]
        side_effects:
          - "cases already pinned to this version keep it forever (version pinning); only requires_recertified_review is flipped"

  - entity: PolicyCategory
    initial_state: DRAFT
    terminal_states: []
    note: "Compound: status is derived from child PolicyVersion states."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "first child PolicyVersion reaches ACTIVE (bubble-up)"
        actor: system
        preconditions: ["exists a PolicyVersion of this category with status == ACTIVE"]
        side_effects: ["active_version_id := that version's id; detection signals citing this code stop failing with ERR_NO_ACTIVE_POLICY_VERSION"]

  - entity: Reviewer
    initial_state: ACTIVE
    terminal_states: []
    note: |
      Two independent cycles: ACTIVE <-> ON_WELLNESS_BREAK and
      ACTIVE -> PENDING_RETRAINING | SUSPENDED -> ACTIVE. Demotion by the
      accuracy gate keeps the reviewer's cases assigned but flagged; a wellness
      break returns them to the queue.
    transitions:
      - from: ACTIVE
        to: ON_WELLNESS_BREAK
        trigger: "POST /moderation/reviewers/{id}/wellness-break"
        actor: TrustSafetyAdmin
        preconditions:
          - "status == ACTIVE (else ERR_REVIEWER_NOT_ACTIVE)"
          - "the requested half-open window [clock now, clock now + break_minutes) does not overlap [wellness_break_start, wellness_break_end) (else ERR_WELLNESS_BREAK_OVERLAP)"
        side_effects:
          - "wellness_break_start := clock now; wellness_break_end := clock now + break_minutes; wellness_breaks_taken += 1"
          - "CASCADE: every ASSIGNED case held by this reviewer transitions ASSIGNED -> PENDING_ASSIGNMENT with assigned_reviewer_id := null"
          - "CASCADE (caused by the case returns): open_case_count := 0, exposure_points_today := 0, and each affected ReviewQueue.unassigned_case_count += 1; ReviewQueue.open_case_count and each case's sla_due_at are NOT recomputed (calculations.review_sla_due_at re-runs only for the return-to-queue endpoint)"
      - from: ON_WELLNESS_BREAK
        to: ACTIVE
        trigger: "POST /moderation/reviewers/{id}/return-to-duty"
        actor: TrustSafetyAdmin
        preconditions:
          - "status == ON_WELLNESS_BREAK (else ERR_REVIEWER_NOT_ON_BREAK)"
        side_effects:
          - "wellness_break_start / wellness_break_end are RETAINED unchanged as the protected window"
      - from: ACTIVE
        to: PENDING_RETRAINING
        trigger: "accuracy gate inside calculations.reviewer_accuracy_score (system, after an audit or an appeal resolution)"
        actor: system
        preconditions:
          - "audited_count + appealed_count >= MIN_GATE_SAMPLE"
          - "gate_score < RETRAIN_FLOOR and gate_score >= SUSPEND_FLOOR"
        side_effects:
          - "CASCADE: every ASSIGNED case held by this reviewer gets requires_recertified_review := true (cases stay assigned; decide is blocked by ERR_REVIEWER_NOT_ACTIVE)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "accuracy gate inside calculations.reviewer_accuracy_score (system)"
        actor: system
        preconditions:
          - "audited_count + appealed_count >= MIN_GATE_SAMPLE and gate_score < SUSPEND_FLOOR"
        side_effects:
          - "CASCADE: every ASSIGNED case held by this reviewer transitions ASSIGNED -> PENDING_ASSIGNMENT; open_case_count := 0; exposure_points_today := 0; affected ReviewQueue.unassigned_case_count += 1 each; ReviewQueue.open_case_count and each case's sla_due_at are NOT recomputed"
      - from: PENDING_RETRAINING
        to: ACTIVE
        trigger: "POST /moderation/reviewers/{id}/certifications"
        actor: PolicyManager
        preconditions:
          - "expected_reviewer_version equals Reviewer.version (else ERR_STALE_REVIEWER_VERSION)"
          - "the granted policy_version_id is in pending_retraining_version_ids, or the reviewer holds no certification for that category yet, or pending_retraining_version_ids is already empty (an accuracy-gate demotion adds nothing to that list, so a retraining grant that merely re-affirms an existing certification is accepted and is the only way back to ACTIVE)"
        side_effects:
          - "certified_policy_version_ids gains the granted id; pending_retraining_version_ids loses it"
          - "status := ACTIVE once pending_retraining_version_ids is empty; Reviewer.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /moderation/reviewers/{id}/certifications (recalibration grant)"
        actor: PolicyManager
        preconditions:
          - "expected_reviewer_version equals Reviewer.version (else ERR_STALE_REVIEWER_VERSION)"
        side_effects:
          - "certified_policy_version_ids gains the granted id; status := ACTIVE; Reviewer.version += 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /moderation/reviewers/{id}/certifications (ordinary grant)"
        actor: PolicyManager
        preconditions:
          - "expected_reviewer_version equals Reviewer.version (else ERR_STALE_REVIEWER_VERSION)"
          - "the granted PolicyVersion.status is in {BACKTESTING, ACTIVE} (a reviewer cannot be certified on a DRAFT or SUPERSEDED version — ERR_POLICY_VERSION_NOT_CERTIFIABLE)"
        side_effects:
          - "certified_policy_version_ids gains the granted id (idempotent set semantics); Reviewer.version += 1"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERTURNED]
    note: "Branching fork with disjoint side-effect sets on the UPHELD and OVERTURNED arms."
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /moderation/appeals"
        actor: AccountHolder
        preconditions:
          - "X-User-ID == the case's ContentItem.account_id (else ERR_APPEAL_NOT_OWNED)"
          - "case.status == DECIDED (else ERR_CASE_NOT_DECIDED)"
          - "no Appeal already exists on this case_id (else ERR_APPEAL_ALREADY_EXISTS)"
          - "clock now <= case.appeal_deadline_at (else ERR_APPEAL_WINDOW_CLOSED)"
          - "Account.appeal_credits_remaining >= 1 (else ERR_APPEAL_CREDITS_EXHAUSTED)"
        side_effects:
          - "account_id copied from the case's ContentItem.account_id; filed_at := clock now"
          - "Account.appeal_credits_remaining -= 1"
          - "ContentItem.review_status := APPEALED (visibility_status untouched)"
      - from: SUBMITTED
        to: INDEPENDENT_REVIEW
        trigger: "POST /moderation/appeals/{id}/assign-reviewer"
        actor: QAAuditor
        preconditions:
          - "status == SUBMITTED (else ERR_APPEAL_NOT_UNDER_REVIEW)"
          - "the selected reviewer has role_class in {SENIOR, QA}, status == ACTIVE, and id != case.decided_by_reviewer_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "the selected reviewer is certified on the case's pinned policy_version_id (else ERR_REVIEWER_NOT_CERTIFIED)"
        side_effects:
          - "independent_reviewer_id := selected reviewer (no workload or exposure charge — appeal review is off-queue work)"
      - from: INDEPENDENT_REVIEW
        to: UPHELD
        trigger: "POST /moderation/appeals/{id}/resolve with resolution == UPHELD"
        actor: Reviewer
        preconditions:
          - "X-User-ID == independent_reviewer_id (else ERR_NOT_APPEAL_REVIEWER)"
        side_effects:
          - "resolved_at := clock now; resolution_note stored; reinstated_content := false"
          - "ContentItem.review_status := ACTIONED (visibility_status unchanged); Account.appeal_credits_remaining NOT refunded"
          - "the deciding reviewer's appealed_count += 1 and upheld_appeal_count += 1; then accuracy_score_blended recomputed; then the accuracy gate runs"
      - from: INDEPENDENT_REVIEW
        to: OVERTURNED
        trigger: "POST /moderation/appeals/{id}/resolve with resolution == OVERTURNED"
        actor: Reviewer
        preconditions:
          - "X-User-ID == independent_reviewer_id (else ERR_NOT_APPEAL_REVIEWER)"
        side_effects:
          - "resolved_at := clock now; CASCADE step 1: ModerationCase.is_overturned := true"
          - "CASCADE step 2 (caused by step 1): ContentItem.visibility_status := REINSTATED and reinstated_at := clock now when it was REMOVED or AGE_GATED (Appeal.reinstated_content := true); ContentItem.review_status := CLEAR"
          - "CASCADE step 3 (caused by step 1): Account.lifetime_removed_count -= 1 when the case's outcome was REMOVE; Account.strike_points recomputed by calculations.account_strike_ledger; Account.appeal_credits_remaining += 1 (refund)"
          - "CASCADE step 4 (caused by step 3): Account.standing recomputed by calculations.account_standing_posture"
          - "CASCADE step 5 (caused by step 1): the deciding reviewer's appealed_count += 1 (upheld_appeal_count unchanged); both accuracy variants recomputed; the accuracy gate may transition the reviewer ACTIVE -> PENDING_RETRAINING or ACTIVE -> SUSPENDED"
          - "CASCADE step 6 (caused by step 5): on the PENDING_RETRAINING arm every ASSIGNED case still held by that reviewer gets requires_recertified_review := true and stays assigned; on the SUSPENDED arm those cases instead return to PENDING_ASSIGNMENT with assigned_reviewer_id := null, the reviewer's open_case_count := 0 and exposure_points_today := 0, and each affected ReviewQueue.unassigned_case_count += 1"

  - entity: AuditSample
    initial_state: SAMPLED
    terminal_states: []
    note: "Cyclic calibration loop: SAMPLED -> AUDITED -> DISPUTED -> AUDITED."
    transitions:
      - from: null
        to: SAMPLED
        trigger: "POST /moderation/audit-samples"
        actor: QAAuditor
        preconditions:
          - "case.status == DECIDED (else ERR_CASE_NOT_DECIDED)"
          - "X-User-ID != case.decided_by_reviewer_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "the acting reviewer's role_class == QA (else ERR_UNAUTHORIZED)"
        side_effects:
          - "auditor_reviewer_id := X-User-ID; counts_toward_accuracy := true but no accuracy movement until a verdict exists"
      - from: SAMPLED
        to: AUDITED
        trigger: "POST /moderation/audit-samples/{id}/audit"
        actor: QAAuditor
        preconditions:
          - "status in {SAMPLED, DISPUTED} (else ERR_AUDIT_NOT_AUDITABLE)"
          - "correct_outcome present when verdict != AGREE (else ERR_INVALID_REQUEST)"
        side_effects:
          - "verdict, correct_outcome, audited_at stored; counts_toward_accuracy := true"
          - "the deciding reviewer's audited_count and agree_count recomputed; accuracy_score_audit_only and accuracy_score_blended recomputed; the accuracy gate runs"
      - from: AUDITED
        to: DISPUTED
        trigger: "POST /moderation/audit-samples/{id}/dispute"
        actor: Reviewer
        preconditions:
          - "status == AUDITED (else ERR_AUDIT_NOT_DISPUTABLE)"
          - "X-User-ID == case.decided_by_reviewer_id (else ERR_NOT_CASE_OWNER)"
        side_effects:
          - "dispute_note, disputed_at stored; counts_toward_accuracy := false"
          - "the deciding reviewer's audited_count and agree_count recomputed (the sample leaves both numerator and denominator); accuracy scores recomputed; a reviewer sitting in PENDING_RETRAINING whose recomputed gate_score is now >= RETRAIN_FLOOR is NOT auto-restored — restoration requires a certification grant"
      - from: DISPUTED
        to: AUDITED
        trigger: "POST /moderation/audit-samples/{id}/audit (re-audit closing the calibration loop)"
        actor: QAAuditor
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "verdict overwritten with the calibrated verdict; counts_toward_accuracy := true; accuracy scores recomputed"

  - entity: Account
    initial_state: GOOD_STANDING
    terminal_states: []
    note: "Compound posture, recomputed from strike_points in both directions; enforcement and reinstatement move it up and down."
    transitions:
      - from: GOOD_STANDING
        to: "LIMITED | SUSPENDED | BANNED"
        trigger: "ModerationCase -> DECIDED raising strike_points (system)"
        actor: system
        preconditions: ["strike_points crossed a STANDING_* threshold"]
        side_effects: ["standing := LIMITED at >= 3, SUSPENDED at >= 6, BANNED at >= 10"]
      - from: "LIMITED | SUSPENDED | BANNED"
        to: "GOOD_STANDING | LIMITED | SUSPENDED"
        trigger: "Appeal -> OVERTURNED lowering strike_points (system)"
        actor: system
        preconditions: ["strike_points recomputed below the current band's floor"]
        side_effects: ["standing recomputed by the same thresholds; POST /moderation/content-items unblocks once standing != BANNED"]

  - entity: TransparencyReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /moderation/transparency-reports/{id}/compute"
        actor: TrustSafetyAdmin
        preconditions:
          - "status in {DRAFT, COMPUTED} (else ERR_REPORT_ALREADY_PUBLISHED)"
        side_effects:
          - "all volume, appeal and legal figures set by calculations.transparency_enforcement_volumes for the requested variant; variant and computed_at stored"
      - from: COMPUTED
        to: COMPUTED
        trigger: "POST /moderation/transparency-reports/{id}/compute with the other variant (recompute)"
        actor: TrustSafetyAdmin
        preconditions:
          - "status == COMPUTED"
        side_effects: ["every figure overwritten under the new variant; variant switched"]
      - from: COMPUTED
        to: PUBLISHED
        trigger: "POST /moderation/transparency-reports/{id}/publish"
        actor: TrustSafetyAdmin | LegalCounsel
        preconditions:
          - "status == COMPUTED (else ERR_REPORT_NOT_COMPUTED)"
          - "variant == RESTATED (a provisional report may not be published — ERR_REPORT_NOT_RESTATED)"
          - "no Appeal with status in {SUBMITTED, INDEPENDENT_REVIEW} exists on a case decided inside [period_start, period_end] (else ERR_OPEN_APPEALS_IN_PERIOD)"
        side_effects: ["published_at := clock now; figures frozen"]

concurrency_rules:
  - rule_id: case-assign-stale-case-version
    parent_entity: ModerationCase
    write_endpoint: "POST /moderation/moderation-cases/{id}/assign"
    occ_field: "expected_case_version"
    description: |
      Assigning a case whose version has advanced since the client last read it
      is rejected. Reassignment is a legitimate product operation — a second
      assign against an already ASSIGNED case supersedes the prior assignment
      and would otherwise succeed on its own merits — so the stale view of the
      case must be detected by version rather than by state.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: certification-grant-stale-reviewer-version
    parent_entity: Reviewer
    write_endpoint: "POST /moderation/reviewers/{id}/certifications"
    occ_field: "expected_reviewer_version"
    description: |
      Granting a certification against a Reviewer whose version has advanced
      since the client last read it is rejected. A grant legitimately adds to
      certified_policy_version_ids and may clear PENDING_RETRAINING, so a second
      grant carrying an older observed version would otherwise be accepted while
      acting on a reviewer profile that a policy activation cascade has already
      rewritten.
    error_id: ERR_STALE_REVIEWER_VERSION
    http_status: 412

calculations:
  - name: effective_confidence
    trigger: "POST /moderation/detection-signals, before routing"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is PINNED: multiply, then add the repeat bonus, then
      # clamp at 1.0, then round ONCE to 4 decimals (round_half_up).
      tier_mult   = TIER_CONFIDENCE_MULTIPLIER[account.tier]
      repeat_bonus = REPEAT_BONUS_PER_POINT * min(account.strike_points, REPEAT_BONUS_CAP_POINTS)
      raw          = classifier_confidence * tier_mult + repeat_bonus
      effective_confidence = round_half_up(min(1.0, raw), 4)
    input_set: "the signal's classifier_confidence, plus the ContentItem's Account row (tier and the CURRENT strike_points, i.e. after all previously decided non-overturned cases)"
    constants:
      TIER_CONFIDENCE_MULTIPLIER: { STANDARD: 1.00, HIGH_PROFILE: 0.85, GOVERNMENT: 0.80 }
      REPEAT_BONUS_PER_POINT: 0.01
      REPEAT_BONUS_CAP_POINTS: 10
    precision: "4 decimal places, round_half_up; clamping happens BEFORE rounding"
    variants: []
  - name: routing_disposition
    trigger: "POST /moderation/detection-signals, immediately after effective_confidence"
    algorithm: threshold
    formula: |
      v = the PolicyVersion whose id == category.active_version_id   # PINNED onto the case
      if effective_confidence < v.review_floor:                 -> DISCARDED      (no case row)
      elif category.severity_tier == 'T1':                      -> HUMAN_REVIEW, escalation_tier 1, reason IMMINENT_HARM
      elif account.tier in {HIGH_PROFILE, GOVERNMENT}:          -> HUMAN_REVIEW, escalation_tier 1, reason HIGH_PROFILE
      elif effective_confidence >= v.auto_action_threshold:      -> AUTO_ACTION    (case minted DECIDED)
      else:                                                     -> HUMAN_REVIEW, escalation_tier 0, reason null
    input_set: "exactly one ACTIVE PolicyVersion per category; a category with status DRAFT or active_version_id == null rejects the signal with ERR_NO_ACTIVE_POLICY_VERSION"
    constants: {}
    precision: "comparisons on 4-decimal values; review_floor uses strict <, auto_action_threshold uses >="
    variants: []
  - name: queue_selection
    trigger: "creation of any ModerationCase that is not AUTO_ACTION (CLASSIFIER human-review, MANUAL_REPORT, LEGAL_REQUEST)"
    algorithm: constraint_propagation
    formula: |
      eligibility filter: ReviewQueue.policy_category_id == case.policy_category_id
                          AND ReviewQueue.language == content_item.language
      ranking:            unassigned_case_count ASC
      tie_break:          created_at ASC          # never id
      empty_pool:         reject the whole request with ERR_NO_ELIGIBLE_QUEUE (422); nothing is persisted, not even the DetectionSignal row
    input_set: "all ReviewQueue rows (queues have no lifecycle state)"
    constants: {}
    precision: "integer comparison; created_at compared at millisecond precision"
    variants: []
  - name: review_sla_due_at
    trigger: "creation of a queued ModerationCase, and re-entry into PENDING_ASSIGNMENT via return-to-queue"
    algorithm: threshold
    formula: |
      # Circular-looking dependency, order PINNED: the queue counters are
      # incremented for THIS case FIRST, and the congestion tier is then read
      # from the POST-increment open_case_count (which therefore includes this
      # very case). Reading the pre-increment count is a different, wrong answer.
      step 1: queue.open_case_count += 1 ; queue.unassigned_case_count += 1
      step 2: n = queue.open_case_count            # post-increment
      step 3: congestion = 1.0 if n <= 5 else (1.5 if n <= 15 else 2.0)
      step 4: minutes = ceil(pinned_version.review_sla_minutes * congestion / SEVERITY_SLA_DIVISOR[category.severity_tier])
      step 5: sla_due_at = clock_now + minutes
      # A case BORN with escalation_tier >= 1 (T1 severity or a non-STANDARD account per
      # calculations.routing_disposition, or LEGAL_REQUEST origin) still performs step 1 --
      # open_case_count always accounts for it -- but skips steps 2-4: sla_due_at = clock_now + ESCALATION_SLA_MINUTES, or
      # clock_now + LEGAL_SLA_MINUTES for LEGAL_REQUEST origin.
      # RE-ENTRY via POST /moderation-cases/{id}/return-to-queue increments ONLY
      # unassigned_case_count (the escalation left the case open but not queue-assignable);
      # open_case_count is NOT touched, because the case has been counted as open since
      # creation. Steps 2-5 then run against the CURRENT open_case_count. Incrementing
      # open_case_count again would double-count one case and is wrong.
    input_set: "the case's own queue after the increment; review_sla_minutes read from the PINNED PolicyVersion, never from the category's current ACTIVE version"
    constants:
      SEVERITY_SLA_DIVISOR: { T1: 4, T2: 2, T3: 1, T4: 1 }
      CONGESTION_BREAKPOINTS: "n<=5 -> 1.0 ; 6<=n<=15 -> 1.5 ; n>=16 -> 2.0"
      ESCALATION_SLA_MINUTES: 30
      LEGAL_SLA_MINUTES: 1440
    precision: "ceil to whole minutes after the single multiply-divide; minute arithmetic on the logical clock"
    variants: []
  - name: reviewer_selection
    trigger: "POST /moderation/moderation-cases/{id}/assign when target_reviewer_id is omitted"
    algorithm: waterfall_allocation
    formula: |
      local_hour(r) = ((clock_now_utc_minutes + r.utc_offset_minutes) // 60) mod 24
      in_shift(r)   = (r.shift_start_local_hour <= local_hour < r.shift_end_local_hour)
                      if r.shift_end_local_hour > r.shift_start_local_hour
                      else (local_hour >= r.shift_start_local_hour or local_hour < r.shift_end_local_hour)   # wraps midnight
      charge        = content_item.graphic_weight * MEDIA_EXPOSURE_MULTIPLIER[content_item.media_kind]
      eligibility filter (ALL must hold):
        r.status == ACTIVE
        case.policy_version_id in r.certified_policy_version_ids
        queue.language in r.languages
        queue.specialty in r.specialties
        r.open_case_count < r.max_concurrent_cases
        r.exposure_points_today + charge <= r.daily_exposure_cap_points
        in_shift(r) is true
        r.id not in request.exclude_reviewer_ids and r.id != case.assigned_reviewer_id
        r.role_class in {SENIOR, QA}          # ONLY when case.status == ESCALATED
      ranking:    open_case_count ASC, then accuracy_score_blended DESC treating null as 1.0000
      tie_break:  created_at ASC              # never id
      empty_pool: ERR_NO_ELIGIBLE_REVIEWER (409); the case keeps status PENDING_ASSIGNMENT and its version is NOT incremented
      # When target_reviewer_id IS supplied the pool is that single reviewer and each
      # predicate is checked in the §1.4 priority order, yielding a specific error.
    input_set: "all Reviewer rows; wellness and shift predicates read the logical clock"
    constants:
      MEDIA_EXPOSURE_MULTIPLIER: { TEXT: 1, IMAGE: 2, VIDEO: 3 }
    precision: "integer comparisons; exposure uses <= (an assignment that lands exactly on the cap is allowed)"
    variants: []
  - name: strike_points_applied
    trigger: "any ModerationCase transition into DECIDED (AUTO, HUMAN or LEGAL)"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is PINNED: multiply all three factors, then ceil ONCE.
      # Rounding per factor (ceil(base*weight) first, then multiplying) produces a
      # different integer and is WRONG (e.g. base 2, weight 0.75, mult 1.25 ->
      # pinned ceil(1.875) = 2, per-factor ceil(1.5)=2 -> 2*1.25 = 2.5 -> 3).
      base   = SEVERITY_POINTS[category.severity_tier]
      weight = ACTION_WEIGHT[decision_outcome]
      mult   = 1 + REPEAT_MULTIPLIER_STEP * min(account.lifetime_removed_count, REPEAT_MULTIPLIER_CAP_REMOVALS)
      strike_points_applied = ceil(base * weight * mult)
      # account.lifetime_removed_count is read BEFORE this decision's own
      # increment; a REMOVE decision never inflates its own multiplier.
    input_set: "the case's pinned category severity, the recorded decision_outcome, and the author Account's lifetime_removed_count as of the instant before this decision"
    constants:
      SEVERITY_POINTS: { T1: 8, T2: 4, T3: 2, T4: 1 }
      ACTION_WEIGHT: { REMOVE: 1.0, AGE_GATE: 0.75, WARN: 0.25, NO_ACTION: 0.0 }
      REPEAT_MULTIPLIER_STEP: 0.25
      REPEAT_MULTIPLIER_CAP_REMOVALS: 4
    precision: "single ceil to an integer after the full product; NO_ACTION always yields 0"
    variants: []
  - name: account_strike_ledger
    trigger: "any ModerationCase transition into DECIDED, and any Appeal transition into OVERTURNED"
    algorithm: aggregation
    formula: |
      strike_points = SUM(mc.strike_points_applied)
        over ModerationCase mc
        where mc.content_item_id IN (SELECT id FROM ContentItem WHERE account_id == a.id)
          AND mc.status == 'DECIDED'
          AND mc.is_overturned == false
      # Full recompute, never an incremental delta: this is the invariant the
      # compensating action must restore exactly.
    input_set: "all DECIDED, non-overturned cases on the account's content, with no time window (lifetime ledger)"
    constants: {}
    precision: "integer sum; the empty set yields 0"
    variants: []
  - name: account_standing_posture
    trigger: "immediately after every account_strike_ledger recompute"
    algorithm: threshold
    formula: |
      sp = account.strike_points
      standing = 'BANNED'        if sp >= 10
                 'SUSPENDED'     if 6 <= sp <= 9
                 'LIMITED'       if 3 <= sp <= 5
                 'GOOD_STANDING' if sp <= 2
    input_set: "the freshly recomputed strike_points only"
    constants:
      STANDING_LIMITED_AT: 3
      STANDING_SUSPENDED_AT: 6
      STANDING_BANNED_AT: 10
    precision: "inclusive >= at each breakpoint: exactly 6 points is SUSPENDED, exactly 5 is LIMITED"
    variants: []
  - name: reviewer_accuracy_score
    trigger: "POST /moderation/audit-samples/{id}/audit, POST /moderation/audit-samples/{id}/dispute, POST /moderation/appeals/{id}/resolve — recomputed for the case's decided_by_reviewer_id"
    algorithm: aggregation
    formula: |
      audited  = COUNT(AuditSample s WHERE s.case_id IN cases_decided_by(r)
                       AND s.status == 'AUDITED' AND s.counts_toward_accuracy == true)
      agree    = same set, additionally s.verdict == 'AGREE'
      appeals  = COUNT(Appeal p WHERE p.case_id IN cases_decided_by(r)
                       AND p.status IN {'UPHELD','OVERTURNED'})
      upheld   = same set, additionally p.status == 'UPHELD'
      # cases_decided_by(r) = ModerationCase with decided_by_reviewer_id == r.id
      # (AUTO and LEGAL decisions have a null decided_by_reviewer_id and are attributed to nobody)
      accuracy_score_audit_only = round_half_up(agree / audited, 4)                    if audited  >= 1 else null
      accuracy_score_blended    = round_half_up((agree + upheld) / (audited + appeals), 4) if (audited + appeals) >= 1 else null
      # ---- gate (runs after both variants are stored) ----
      gate_score = accuracy_score_blended if appeals >= 1 else accuracy_score_audit_only
      if (audited + appeals) >= MIN_GATE_SAMPLE:
          if gate_score < SUSPEND_FLOOR: r.status = 'SUSPENDED'      # cases returned to queue
          elif gate_score < RETRAIN_FLOOR: r.status = 'PENDING_RETRAINING'   # cases flagged, kept
      # A gate_score exactly equal to RETRAIN_FLOOR does NOT demote (strict <).
    input_set: "AUDITED samples with counts_toward_accuracy true (DISPUTED samples leave BOTH numerator and denominator) and appeals in a terminal status; no time window"
    constants:
      RETRAIN_FLOOR: 0.8500
      SUSPEND_FLOOR: 0.6000
      MIN_GATE_SAMPLE: 2
    precision: "4 decimal places, round_half_up; division guarded by the >= 1 denominators above"
    variants:
      - name: audit_only
        when: "QA calibration reporting and the gate for reviewers with zero terminal appeals"
        difference: "denominator is audited samples only; appeal outcomes are ignored entirely, so a reviewer whose only audit AGREEd scores 1.0000"
      - name: blended_final
        when: "the gate for any reviewer with at least one terminal appeal, and all workforce reporting"
        difference: "appeal outcomes join both numerator (UPHELD) and denominator (all terminal appeals), so the same audit data plus one OVERTURNED appeal scores 0.5000 instead of 1.0000"
  - name: backtest_divergence_rate
    trigger: "POST /moderation/policy-versions/{id}/back-test"
    algorithm: projection
    formula: |
      active = the candidate's category.active_version_id   # may be null
      sample = ModerationCase mc
               WHERE mc.policy_version_id == active
                 AND mc.status == 'DECIDED'
                 AND mc.detection_signal_id IS NOT NULL      # legal/manual cases carry no confidence and are EXCLUDED
               ORDER BY mc.created_at ASC                    # pinned; result is order-independent
      historical_class(mc) = 'AUTO_ACTION' if mc.decision_source == 'AUTO' else 'HUMAN_REVIEW'
      predicted_class(mc):
         ec = mc's DetectionSignal.effective_confidence          # replayed as stored, NOT recomputed
         if ec < candidate.review_floor:                    'DISCARDED'
         elif category.severity_tier == 'T1':               'HUMAN_REVIEW'
         elif account.tier != 'STANDARD':                   'HUMAN_REVIEW'
         elif ec >= candidate.auto_action_threshold:        'AUTO_ACTION'
         else:                                              'HUMAN_REVIEW'
      backtest_sample_size    = |sample|
      divergent               = COUNT(mc in sample WHERE predicted_class(mc) != historical_class(mc))
      backtest_divergence_rate = round_half_up(divergent / backtest_sample_size, 4) if backtest_sample_size >= 1 else 0.0000
      # An empty sample (a category with no ACTIVE version yet, or no classifier-origin
      # decided cases) yields exactly 0.0000, which passes the activation gate.
    input_set: "decided classifier-origin cases pinned to the category's CURRENT ACTIVE version; account tier and severity read as of replay time"
    constants:
      MAX_BACKTEST_DIVERGENCE: 0.2500
    precision: "4 decimal places, round_half_up; activation rejects strictly greater than MAX_BACKTEST_DIVERGENCE, so exactly 0.2500 activates"
    variants: []
  - name: transparency_enforcement_volumes
    trigger: "POST /moderation/transparency-reports/{id}/compute"
    algorithm: aggregation
    formula: |
      window = ModerationCase mc WHERE mc.status == 'DECIDED'
               AND period_start <= mc.decided_at <= period_end       # CLOSED interval, both ends inclusive
      # ---- volumes (variant-dependent) ----
      PROVISIONAL: base = window                                     # counts cases later overturned
      RESTATED:    base = window WHERE mc.is_overturned == false
      enforcement_volume = |base|
      removal_volume     = |base WHERE decision_outcome == 'REMOVE'|
      age_gate_volume    = |base WHERE decision_outcome == 'AGE_GATE'|
      warn_volume        = |base WHERE decision_outcome == 'WARN'|
      overturn_adjusted_volume = |window WHERE is_overturned == false|   # same under both variants
      # ---- appeals: ROUND-THEN-AVERAGE, order pinned ----
      appealed(c)   = appeals on window cases of category c with status IN {'UPHELD','OVERTURNED'}
                      (PROVISIONAL additionally counts appeals still in {'SUBMITTED','INDEPENDENT_REVIEW'}
                       in appeal_count, but NEVER in any rate numerator or denominator)
      for each PolicyCategory c (by category of the case's pinned version) with appealed(c) >= 1,
          in ORDER BY c.code ASC:
              rate_c = round_half_up(overturned(c) / appealed(c), 4)     # per-category rounding FIRST
      appeal_overturn_rate = round_half_up(mean(rate_c over those categories), 4)
      # Summing all appeals platform-wide and dividing once (average-then-round) is a
      # DIFFERENT number and is wrong; the per-category rounded rates are the inputs.
      category_rate_breakdown = [{category_code, appealed, overturned, rate_c}] in the same order
      appeal_count = |appeals counted for the variant as described above|
      # ---- legal / government requests ----
      legal_request_count = |window WHERE origin == 'LEGAL_REQUEST'|
      legal_grant_rate    = round_half_up(|window WHERE origin=='LEGAL_REQUEST' AND decision_outcome=='REMOVE'| / legal_request_count, 4)
                            if legal_request_count >= 1 else 0.0000
    input_set: "DECIDED cases whose decided_at falls inside the closed reporting period; appeals joined through case_id; categories resolved through each case's pinned PolicyVersion"
    constants: {}
    precision: "4 decimal places, round_half_up, applied per category BEFORE the mean and once more after it"
    variants:
      - name: PROVISIONAL
        when: "the first computation after the period closes, before appeals have run out"
        difference: "enforcement and outcome volumes include cases later overturned, and appeal_count includes still-open appeals"
      - name: RESTATED
        when: "the publishable figures; publication requires this variant"
        difference: "overturned cases are removed from every volume, and only terminal appeals are counted, so enforcement_volume is <= the PROVISIONAL figure for identical data"
  - name: reviewer_exposure_accounting
    trigger: "assignment, reassignment, escalation, wellness break and reviewer suspension"
    algorithm: aggregation
    formula: |
      charge(case) = content_item.graphic_weight * MEDIA_EXPOSURE_MULTIPLIER[content_item.media_kind]
      invariant: reviewer.exposure_points_today ==
                 SUM(charge(c)) over cases c currently ASSIGNED to the reviewer
               + SUM(charge(c)) over cases c the reviewer has DECIDED since wellness_break_start
      # Cases that LEAVE a reviewer without a decision (reassignment, escalation,
      # wellness break, suspension cascade) refund their charge in full; a DECIDED
      # case never refunds. A wellness break AND the SUSPENDED accuracy-gate cascade both
      # reset exposure_points_today to exactly 0, discarding even decided-case exposure.
    input_set: "cases currently held plus cases decided since the most recent wellness break"
    constants:
      MEDIA_EXPOSURE_MULTIPLIER: { TEXT: 1, IMAGE: 2, VIDEO: 3 }
    precision: "integer arithmetic; no rounding"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list; additionally POST /moderation/moderation-cases restricts origin == LEGAL_REQUEST to LegalCounsel and origin == MANUAL_REPORT to TrustSafetyAdmin, POST /moderation/moderation-cases/{id}/decide restricts LegalCounsel to cases whose escalation_reason == LEGAL_REQUEST, and POST /moderation/audit-samples requires the acting reviewer's role_class == QA"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body well-formedness: every required input present, types correct, enum members valid, numeric ranges respected, arrays non-empty where required, confidence and threshold values within 0.0000..1.0000, and correct_outcome present whenever an audit verdict is a disagreement"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 10
    category: existence
    check: "path-segment ids resolve, validated left to right"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints (per-entity error ids: ERR_ACCOUNT_NOT_FOUND, ERR_CONTENT_NOT_FOUND, ERR_CATEGORY_NOT_FOUND, ERR_POLICY_VERSION_NOT_FOUND, ERR_REVIEWER_NOT_FOUND, ERR_QUEUE_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_APPEAL_NOT_FOUND, ERR_AUDIT_SAMPLE_NOT_FOUND, ERR_REPORT_NOT_FOUND)"
  - priority: 11
    category: existence
    check: "body-referenced ids and natural keys resolve, validated in the order the endpoint's input list declares them (account_id, content_item_id, policy_category_id, policy_category_code, policy_version_id, case_id, target_reviewer_id, exclude_reviewer_ids)"
    error_id: ERR_CONTENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /moderation/content-items, POST /moderation/policy-categories, POST /moderation/policy-versions, POST /moderation/review-queues, POST /moderation/reviewers/{id}/certifications, POST /moderation/detection-signals, POST /moderation/moderation-cases, POST /moderation/moderation-cases/{id}/assign, POST /moderation/appeals, POST /moderation/appeals/{id}/assign-reviewer, POST /moderation/audit-samples"
  - priority: 20
    category: auth
    check: "ownership — a Reviewer acting on a case must be its assigned_reviewer_id (decide, escalate) or its decided_by_reviewer_id (dispute)"
    error_id: ERR_NOT_CASE_OWNER
    http_status: 403
    applies_to: "POST /moderation/moderation-cases/{id}/decide, POST /moderation/moderation-cases/{id}/escalate, POST /moderation/audit-samples/{id}/dispute"
  - priority: 20
    category: auth
    check: "ownership — the acting Reviewer must be the appeal's independent_reviewer_id"
    error_id: ERR_NOT_APPEAL_REVIEWER
    http_status: 403
    applies_to: "POST /moderation/appeals/{id}/resolve"
  - priority: 21
    category: auth
    check: "ownership — an AccountHolder may only file an appeal for content authored by their own account, and may only read appeals whose account_id equals X-User-ID"
    error_id: ERR_APPEAL_NOT_OWNED
    http_status: 403
    applies_to: "POST /moderation/appeals, GET /moderation/appeals/{id}, GET /moderation/appeals"
  - priority: 22
    category: auth
    check: "segregation of duties — the activating PolicyManager's X-User-ID must differ from authored_by_user_id; a QA auditor may not audit a case they decided; an appeal's independent reviewer may not be the case's decided_by_reviewer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /moderation/policy-versions/{id}/activate, POST /moderation/audit-samples, POST /moderation/appeals/{id}/assign-reviewer"
  - priority: 30
    category: state
    check: "the target case is not already DECIDED"
    error_id: ERR_CASE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /moderation/moderation-cases/{id}/assign, POST /moderation/moderation-cases/{id}/decide, POST /moderation/moderation-cases/{id}/escalate, POST /moderation/moderation-cases/{id}/return-to-queue"
  - priority: 31
    category: state
    check: "decide requires status == ASSIGNED (HUMAN source) or status == ESCALATED with escalation_reason == LEGAL_REQUEST (LEGAL source)"
    error_id: ERR_CASE_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /moderation/moderation-cases/{id}/decide"
  - priority: 32
    category: state
    check: "escalate requires status == ASSIGNED; return-to-queue requires status == ESCALATED"
    error_id: ERR_INVALID_CASE_TRANSITION
    http_status: 409
    applies_to: "POST /moderation/moderation-cases/{id}/escalate, POST /moderation/moderation-cases/{id}/return-to-queue"
  - priority: 33
    category: state
    check: "back-test requires status == DRAFT; revise requires status == BACKTESTING"
    error_id: ERR_POLICY_VERSION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /moderation/policy-versions/{id}/back-test, POST /moderation/policy-versions/{id}/revise"
  - priority: 34
    category: state
    check: "activate requires status == BACKTESTING with a non-null backtest_divergence_rate"
    error_id: ERR_POLICY_VERSION_NOT_BACKTESTED
    http_status: 409
    applies_to: "POST /moderation/policy-versions/{id}/activate"
  - priority: 35
    category: state
    check: "the referenced case must be DECIDED before it can be appealed or sampled for QA"
    error_id: ERR_CASE_NOT_DECIDED
    http_status: 409
    applies_to: "POST /moderation/appeals, POST /moderation/audit-samples"
  - priority: 36
    category: state
    check: "assign-reviewer requires appeal status == SUBMITTED; resolve requires appeal status == INDEPENDENT_REVIEW"
    error_id: ERR_APPEAL_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /moderation/appeals/{id}/assign-reviewer, POST /moderation/appeals/{id}/resolve"
  - priority: 37
    category: state
    check: "audit requires sample status in {SAMPLED, DISPUTED}"
    error_id: ERR_AUDIT_NOT_AUDITABLE
    http_status: 409
    applies_to: "POST /moderation/audit-samples/{id}/audit"
  - priority: 37
    category: state
    check: "dispute requires sample status == AUDITED"
    error_id: ERR_AUDIT_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /moderation/audit-samples/{id}/dispute"
  - priority: 38
    category: state
    check: "publish requires report status == COMPUTED"
    error_id: ERR_REPORT_NOT_COMPUTED
    http_status: 409
    applies_to: "POST /moderation/transparency-reports/{id}/publish"
  - priority: 39
    category: state
    check: "a PUBLISHED report can neither be recomputed nor republished"
    error_id: ERR_REPORT_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /moderation/transparency-reports/{id}/compute, POST /moderation/transparency-reports/{id}/publish"
  - priority: 40
    category: state
    check: "the reviewer involved must be ACTIVE — the target of a directed assignment, the reviewer deciding or escalating a case, the independent reviewer being assigned to an appeal, and the subject of a wellness break"
    error_id: ERR_REVIEWER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /moderation/moderation-cases/{id}/assign, POST /moderation/moderation-cases/{id}/decide, POST /moderation/moderation-cases/{id}/escalate, POST /moderation/appeals/{id}/assign-reviewer, POST /moderation/reviewers/{id}/wellness-break"
  - priority: 40
    category: state
    check: "return-to-duty requires status == ON_WELLNESS_BREAK"
    error_id: ERR_REVIEWER_NOT_ON_BREAK
    http_status: 409
    applies_to: "POST /moderation/reviewers/{id}/return-to-duty"
  - priority: 41
    category: state
    check: "a signal or manual case may not be raised on content whose visibility_status == REMOVED"
    error_id: ERR_CONTENT_NOT_LIVE
    http_status: 409
    applies_to: "POST /moderation/detection-signals, POST /moderation/moderation-cases"
  - priority: 42
    category: state
    check: "the resolved PolicyCategory must have status == ACTIVE and a non-null active_version_id"
    error_id: ERR_NO_ACTIVE_POLICY_VERSION
    http_status: 409
    applies_to: "POST /moderation/detection-signals, POST /moderation/moderation-cases"
  - priority: 43
    category: state
    check: "content may not be ingested for an account whose standing == BANNED"
    error_id: ERR_ACCOUNT_BANNED
    http_status: 403
    applies_to: "POST /moderation/content-items"
  - priority: 44
    category: state
    check: "a certification may only be granted on a PolicyVersion whose status is in {BACKTESTING, ACTIVE}"
    error_id: ERR_POLICY_VERSION_NOT_CERTIFIABLE
    http_status: 409
    applies_to: "POST /moderation/reviewers/{id}/certifications"
  - priority: 50
    category: business_safety
    check: "certification target is conditional on the case flag: when requires_recertified_review is false the deciding, targeted or independent reviewer must hold the case's PINNED policy_version_id in certified_policy_version_ids; when the flag is true (the pinned version was superseded by an activation that required recertification) they must instead hold the category's CURRENT active_version_id"
    error_id: ERR_REVIEWER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /moderation/moderation-cases/{id}/assign, POST /moderation/moderation-cases/{id}/decide, POST /moderation/appeals/{id}/assign-reviewer"
  - priority: 51
    category: business_safety
    check: "a directed assignment target must serve the queue's language and specialty"
    error_id: ERR_REVIEWER_LANGUAGE_MISMATCH
    http_status: 422
    applies_to: "POST /moderation/moderation-cases/{id}/assign"
  - priority: 52
    category: business_safety
    check: "wellness — exposure_points_today + the case's exposure charge must be <= daily_exposure_cap_points for a directed assignment target"
    error_id: ERR_EXPOSURE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /moderation/moderation-cases/{id}/assign"
  - priority: 53
    category: business_temporal
    check: "the logical clock converted into the directed target's local time must fall inside the half-open shift window [shift_start_local_hour, shift_end_local_hour)"
    error_id: ERR_REVIEWER_OFF_SHIFT
    http_status: 422
    applies_to: "POST /moderation/moderation-cases/{id}/assign"
  - priority: 54
    category: business_constraint
    check: "a directed assignment target must have open_case_count < max_concurrent_cases, and must have role_class in {SENIOR, QA} when the case is ESCALATED (ERR_REVIEWER_NOT_ELIGIBLE_FOR_ESCALATION)"
    error_id: ERR_REVIEWER_AT_CAPACITY
    http_status: 422
    applies_to: "POST /moderation/moderation-cases/{id}/assign"
  - priority: 55
    category: business_constraint
    check: "with target_reviewer_id omitted, calculations.reviewer_selection must yield a non-empty candidate pool"
    error_id: ERR_NO_ELIGIBLE_REVIEWER
    http_status: 409
    applies_to: "POST /moderation/moderation-cases/{id}/assign"
  - priority: 56
    category: business_referential
    check: "calculations.queue_selection must find a queue matching the category and the content language"
    error_id: ERR_NO_ELIGIBLE_QUEUE
    http_status: 422
    applies_to: "POST /moderation/detection-signals, POST /moderation/moderation-cases"
  - priority: 57
    category: business_referential
    check: "at most one Appeal per case_id"
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /moderation/appeals"
  - priority: 58
    category: business_temporal
    check: "clock now must be <= case.appeal_deadline_at (decided_at plus the PINNED version's appeal_window_hours)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /moderation/appeals"
  - priority: 59
    category: business_fiscal
    check: "the appellant Account must have appeal_credits_remaining >= 1"
    error_id: ERR_APPEAL_CREDITS_EXHAUSTED
    http_status: 402
    applies_to: "POST /moderation/appeals"
  - priority: 60
    category: business_temporal
    check: "the requested half-open break window [now, now + break_minutes) must not overlap the reviewer's retained [wellness_break_start, wellness_break_end) window; a request starting exactly at the retained end is accepted"
    error_id: ERR_WELLNESS_BREAK_OVERLAP
    http_status: 409
    applies_to: "POST /moderation/reviewers/{id}/wellness-break"
  - priority: 61
    category: business_constraint
    check: "period_end must be strictly after period_start"
    error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /moderation/transparency-reports"
  - priority: 62
    category: business_temporal
    check: "the requested CLOSED period [period_start, period_end] must not intersect any existing report's closed period — sharing a single endpoint instant is an intersection"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /moderation/transparency-reports"
  - priority: 63
    category: business_constraint
    check: "publication requires variant == RESTATED"
    error_id: ERR_REPORT_NOT_RESTATED
    http_status: 422
    applies_to: "POST /moderation/transparency-reports/{id}/publish"
  - priority: 64
    category: business_constraint
    check: "publication requires that no appeal on a case decided inside the period is still in {SUBMITTED, INDEPENDENT_REVIEW}"
    error_id: ERR_OPEN_APPEALS_IN_PERIOD
    http_status: 422
    applies_to: "POST /moderation/transparency-reports/{id}/publish"
  - priority: 65
    category: business_safety
    check: "activation requires backtest_divergence_rate <= MAX_BACKTEST_DIVERGENCE (0.2500)"
    error_id: ERR_BACKTEST_DIVERGENCE_EXCEEDED
    http_status: 422
    applies_to: "POST /moderation/policy-versions/{id}/activate"
  - priority: 66
    category: business_constraint
    check: "review_floor <= auto_action_threshold on create and on revise"
    error_id: ERR_THRESHOLD_ORDER_INVALID
    http_status: 422
    applies_to: "POST /moderation/policy-versions, POST /moderation/policy-versions/{id}/revise"
  - priority: 67
    category: business_safety
    check: "a child category may not be more severe than its parent: ordinal(child.severity_tier) >= ordinal(parent.severity_tier)"
    error_id: ERR_CHILD_SEVERITY_EXCEEDS_PARENT
    http_status: 422
    applies_to: "POST /moderation/policy-categories"
  - priority: 68
    category: business_referential
    check: "a queue's specialty must equal its category's specialty"
    error_id: ERR_QUEUE_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: "POST /moderation/review-queues"
  - priority: 69
    category: business_referential
    check: "uniqueness — PolicyCategory.code and Account.external_handle are unique"
    error_id: ERR_DUPLICATE_CATEGORY_CODE
    http_status: 409
    applies_to: "POST /moderation/policy-categories (ERR_DUPLICATE_CATEGORY_CODE), POST /moderation/accounts (ERR_DUPLICATE_HANDLE)"
  - priority: 69
    category: business_temporal
    check: "the logical clock may only move forward or stay put: to_iso8601 >= current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /moderation/_clock/set_current_utc"
  - priority: 70
    category: state
    check: "optimistic concurrency — expected_case_version must equal ModerationCase.version, expected_reviewer_version must equal Reviewer.version; checked LAST so every state and business error above wins over a stale version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /moderation/moderation-cases/{id}/assign (ERR_STALE_CASE_VERSION), POST /moderation/reviewers/{id}/certifications (ERR_STALE_REVIEWER_VERSION)"

endpoints:
  # ---- Accounts and content ----
  - method: POST
    path: "/moderation/accounts"
    description: "Register a platform account under trust-and-safety supervision. appeal_credits_remaining defaults to DEFAULT_APPEAL_CREDITS = 3 when omitted; strike_points starts at 0 and standing at GOOD_STANDING."
    roles: [TrustSafetyAdmin]
    code: 201
    input: [external_handle, region_code, "tier?", "appeal_credits_remaining?"]
    output: Account
    side_effects: ["strike_points = 0", "lifetime_removed_count = 0", "standing = GOOD_STANDING", "appeal_credits_remaining = the supplied value or 3"]
  - method: GET
    path: "/moderation/accounts/{id}"
    description: "Fetch one account with its derived strike ledger and standing."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/moderation/content-items"
    description: "Ingest a piece of user content. posted_at is stamped from the logical clock; graphic_weight feeds reviewer exposure accounting."
    roles: [TrustSafetyAdmin]
    code: 201
    input: [account_id, language, media_kind, "graphic_weight?"]
    output: ContentItem
    side_effects: ["posted_at = logical clock now", "visibility_status = LIVE", "review_status = CLEAR", "open_case_count = 0"]
  - method: GET
    path: "/moderation/content-items/{id}"
    description: "Fetch one content item with both its visibility and review dimensions."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel, AccountHolder]
    code: 200
    input: []
    output: ContentItem
    side_effects: []
  - method: GET
    path: "/moderation/content-items"
    description: "List content items, optionally filtered by authoring account or by either status dimension."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: ["account_id?", "visibility_status?", "review_status?", "limit?", "offset?"]
    output: ContentItem[]
    side_effects: []
  - method: GET
    path: "/moderation/content-items/{id}/detection-signals"
    description: "List every classifier signal raised against one content item, newest last (created_at ASC)."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: DetectionSignal[]
    side_effects: []
  # ---- Policy taxonomy ----
  - method: POST
    path: "/moderation/policy-categories"
    description: "Create a DRAFT policy category. Omit parent_category_id for a taxonomy root; a child may not be more severe than its parent."
    roles: [PolicyManager]
    code: 201
    input: [code, name, severity_tier, specialty, "parent_category_id?"]
    output: PolicyCategory
    side_effects: ["status = DRAFT", "active_version_id = null"]
  - method: GET
    path: "/moderation/policy-categories/{id}"
    description: "Fetch one policy category with its computed active_version_id back-reference."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: []
    output: PolicyCategory
    side_effects: []
  - method: GET
    path: "/moderation/policy-categories"
    description: "List policy categories; parent_category_id resolves the self-referential taxonomy tree one level at a time."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: ["parent_category_id?", "status?", "specialty?", "limit?", "offset?"]
    output: PolicyCategory[]
    side_effects: []
  - method: POST
    path: "/moderation/policy-versions"
    description: "Draft a new enforcement version of a category. review_floor must be <= auto_action_threshold. authored_by_user_id is captured from X-User-ID for later segregation-of-duties checks."
    roles: [PolicyManager]
    code: 201
    input: [policy_category_id, version_label, auto_action_threshold, review_floor, enforcement_action, "appeal_window_hours?", "review_sla_minutes?", "requires_recertification?"]
    output: PolicyVersion
    side_effects: ["status = DRAFT", "authored_by_user_id = X-User-ID", "supersedes_version_id = null", "backtest fields null"]
  - method: POST
    path: "/moderation/policy-versions/{id}/back-test"
    description: "Replay the draft's thresholds over the decided classifier-origin cases pinned to the category's current ACTIVE version and store the divergence rate, moving the draft to BACKTESTING."
    roles: [PolicyManager]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: ["status = BACKTESTING", "backtest_sample_size and backtest_divergence_rate written per calculations.backtest_divergence_rate", "backtest_completed_at = clock now"]
  - method: POST
    path: "/moderation/policy-versions/{id}/revise"
    description: "Amend a BACKTESTING draft's thresholds, returning it to DRAFT and voiding its stale back-test result so it must be re-tested before activation."
    roles: [PolicyManager]
    code: 200
    input: ["auto_action_threshold?", "review_floor?", "review_sla_minutes?", "appeal_window_hours?", "requires_recertification?"]
    output: PolicyVersion
    side_effects: ["status = DRAFT", "backtest_sample_size = null", "backtest_divergence_rate = null", "backtest_completed_at = null"]
  - method: POST
    path: "/moderation/policy-versions/{id}/activate"
    description: "Promote a back-tested draft to ACTIVE. Must be performed by a PolicyManager other than the author. Supersedes the prior ACTIVE version, activates the category, and (when requires_recertification) decertifies every reviewer certified on the superseded version."
    roles: [PolicyManager]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: ["status = ACTIVE", "activated_by_user_id = X-User-ID", "activated_at = clock now", "supersedes_version_id = prior ACTIVE version id", "prior ACTIVE version status = SUPERSEDED", "category status = ACTIVE and active_version_id = this id", "when requires_recertification is true, every reviewer holding the superseded version loses that entry from certified_policy_version_ids and gains THIS newly activated version id in pending_retraining_version_ids (status is untouched: only the accuracy gate and the wellness endpoints move Reviewer.status)", "only when requires_recertification is true, every ASSIGNED or PENDING_ASSIGNMENT case pinned to the superseded version gets requires_recertified_review = true; when it is false neither certifications nor case flags are touched"]
  - method: GET
    path: "/moderation/policy-versions/{id}"
    description: "Fetch one policy version including its back-test outcome and supersession chain."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: []
    output: PolicyVersion
    side_effects: []
  - method: GET
    path: "/moderation/policy-versions"
    description: "List policy versions; supersedes_version_id walks the self-referential supersession chain."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: ["policy_category_id?", "supersedes_version_id?", "status?", "limit?", "offset?"]
    output: PolicyVersion[]
    side_effects: []
  # ---- Queues and reviewer workforce ----
  - method: POST
    path: "/moderation/review-queues"
    description: "Create a specialty queue for one policy category in one language. The queue's specialty must equal the category's specialty."
    roles: [TrustSafetyAdmin]
    code: 201
    input: [name, policy_category_id, language, specialty]
    output: ReviewQueue
    side_effects: ["open_case_count = 0", "unassigned_case_count = 0"]
  - method: GET
    path: "/moderation/review-queues/{id}"
    description: "Fetch one queue with its live depth counters, which drive the SLA congestion multiplier."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer]
    code: 200
    input: []
    output: ReviewQueue
    side_effects: []
  - method: GET
    path: "/moderation/review-queues"
    description: "List review queues, optionally narrowed to one category or language."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer]
    code: 200
    input: ["policy_category_id?", "language?", "limit?", "offset?"]
    output: ReviewQueue[]
    side_effects: []
  - method: POST
    path: "/moderation/reviewers"
    description: "Onboard a reviewer with their language set, specialties, local shift window [shift_start_local_hour, shift_end_local_hour) and wellness caps. A new reviewer holds no certifications and therefore cannot yet decide any case."
    roles: [TrustSafetyAdmin]
    code: 201
    input: [display_name, languages, specialties, utc_offset_minutes, shift_start_local_hour, shift_end_local_hour, role_class, "max_concurrent_cases?", "daily_exposure_cap_points?"]
    output: Reviewer
    side_effects: ["status = ACTIVE", "certified_policy_version_ids = []", "pending_retraining_version_ids = []", "open_case_count = 0", "exposure_points_today = 0", "audited_count = agree_count = appealed_count = upheld_appeal_count = 0", "accuracy scores null", "wellness_breaks_taken = 0"]
  - method: POST
    path: "/moderation/reviewers/{id}/certifications"
    description: "Grant a reviewer certification on one BACKTESTING or ACTIVE policy version. Supersedes any pending retraining entry for that version and, when it clears the last pending entry, returns a PENDING_RETRAINING or SUSPENDED reviewer to ACTIVE. Guarded by expected_reviewer_version."
    roles: [PolicyManager]
    code: 200
    input: [policy_version_id, expected_reviewer_version]
    output: Reviewer
    side_effects: ["policy_version_id appended to certified_policy_version_ids (idempotent set semantics)", "policy_version_id removed from pending_retraining_version_ids", "status returns to ACTIVE when pending_retraining_version_ids becomes empty and the reviewer was PENDING_RETRAINING or SUSPENDED", "version increments"]
  - method: POST
    path: "/moderation/reviewers/{id}/wellness-break"
    description: "Place an ACTIVE reviewer on a protective break of break_minutes over the half-open window [clock now, clock now + break_minutes). Returns every open case to its queue and zeroes today's exposure charge."
    roles: [TrustSafetyAdmin]
    code: 200
    input: [break_minutes, "reason?"]
    output: Reviewer
    side_effects: ["status = ON_WELLNESS_BREAK", "wellness_break_start = clock now", "wellness_break_end = clock now + break_minutes", "wellness_breaks_taken increments", "every ASSIGNED case of this reviewer returns to PENDING_ASSIGNMENT with assigned_reviewer_id cleared and its queue's unassigned_case_count incremented", "open_case_count = 0", "exposure_points_today = 0"]
  - method: POST
    path: "/moderation/reviewers/{id}/return-to-duty"
    description: "End a wellness break. The retained [wellness_break_start, wellness_break_end) window stays on the reviewer so future break requests can be tested for overlap."
    roles: [TrustSafetyAdmin]
    code: 200
    input: []
    output: Reviewer
    side_effects: ["status = ACTIVE", "wellness_break_start and wellness_break_end retained as the last break window"]
  - method: GET
    path: "/moderation/reviewers/{id}"
    description: "Fetch one reviewer with both accuracy variants, exposure counters and certification lists."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: []
    output: Reviewer
    side_effects: []
  - method: GET
    path: "/moderation/reviewers"
    description: "List reviewers, optionally narrowed by status, served language, specialty or role class."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer]
    code: 200
    input: ["status?", "language?", "specialty?", "role_class?", "limit?", "offset?"]
    output: Reviewer[]
    side_effects: []
  # ---- Automated detection ----
  - method: POST
    path: "/moderation/detection-signals"
    description: "Submit a classifier hit against live content under a policy category code. The server computes effective_confidence, routes the signal to DISCARDED, AUTO_ACTION or HUMAN_REVIEW, and for the two non-discard dispositions creates the resulting ModerationCase pinned to the category's ACTIVE policy version."
    roles: [TrustSafetyAdmin]
    code: 201
    input: [content_item_id, policy_category_code, classifier_id, classifier_confidence]
    output: DetectionSignal
    side_effects: ["effective_confidence per calculations.effective_confidence", "disposition per calculations.routing_disposition", "pinned_policy_version_label copied from the ACTIVE version", "DISCARDED: no case created, content untouched", "AUTO_ACTION: a DECIDED case is created with decision_source = AUTO, the enforcement action is applied to the content, and the account strike ledger is updated", "HUMAN_REVIEW: a case is created in PENDING_ASSIGNMENT (or ESCALATED at escalation_tier 1 for T1 or non-STANDARD accounts) and enqueued via calculations.queue_selection with sla_due_at per calculations.review_sla_due_at", "resulting_case_id back-reference written for both non-discard dispositions"]
  - method: GET
    path: "/moderation/detection-signals/{id}"
    description: "Fetch one immutable classifier signal with its computed routing outcome."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer]
    code: 200
    input: []
    output: DetectionSignal
    side_effects: []
  # ---- Case lifecycle ----
  - method: POST
    path: "/moderation/moderation-cases"
    description: "Open a case without a classifier signal: origin LEGAL_REQUEST (LegalCounsel only; requires legal_jurisdiction and legal_reference and opens directly in ESCALATED at escalation_tier 2) or origin MANUAL_REPORT (TrustSafetyAdmin only; opens in PENDING_ASSIGNMENT)."
    roles: [LegalCounsel, TrustSafetyAdmin]
    code: 201
    input: [content_item_id, policy_category_code, origin, "legal_jurisdiction?", "legal_reference?"]
    output: ModerationCase
    side_effects: ["policy_version_id pinned to the category's ACTIVE version", "queue_id per calculations.queue_selection", "sla_due_at per calculations.review_sla_due_at (LEGAL_REQUEST uses ESCALATION/LEGAL SLA minutes)", "content review_status = UNDER_REVIEW and open_case_count increments", "queue open_case_count increments; unassigned_case_count increments for MANUAL_REPORT only (a LEGAL_REQUEST case opens ESCALATED and is not queue-assignable)"]
  - method: POST
    path: "/moderation/moderation-cases/{id}/assign"
    description: "Assign or reassign a case to a reviewer. With target_reviewer_id the named reviewer is vetted against every eligibility predicate individually; without it the server selects one per calculations.reviewer_selection, honouring exclude_reviewer_ids. Guarded by expected_case_version so a reassignment always supersedes the version the caller read."
    roles: [TrustSafetyAdmin, QAAuditor]
    code: 200
    input: [expected_case_version, "target_reviewer_id?", "exclude_reviewer_ids?"]
    output: ModerationCase
    side_effects: ["status = ASSIGNED and assigned_reviewer_id set", "reassignment_count increments when the case was already ASSIGNED", "queue unassigned_case_count decrements on the first assignment only", "new reviewer open_case_count increments and exposure_points_today increases by the case exposure charge", "previous reviewer (on reassignment) has open_case_count decremented and exposure charge released", "exposure_points_charged recorded on the case", "version increments"]
  - method: POST
    path: "/moderation/moderation-cases/{id}/decide"
    description: "Record the enforcement decision. A Reviewer must be the assigned reviewer and must satisfy the conditional certification check in validations[priority=50] (the case's PINNED version normally, the category's CURRENT active version once requires_recertified_review is true); LegalCounsel may decide a case escalated for LEGAL_REQUEST with decision_source = LEGAL."
    roles: [Reviewer, LegalCounsel]
    code: 200
    input: [outcome, "rationale?"]
    output: ModerationCase
    side_effects: ["status = DECIDED, decided_at = clock now, decided_by_reviewer_id set for HUMAN decisions", "decision_source = HUMAN or LEGAL", "strike_points_applied per calculations.strike_points_applied", "content visibility_status set from the outcome (REMOVE -> REMOVED, AGE_GATE -> AGE_GATED, WARN/NO_ACTION -> unchanged) and review_status = ACTIONED", "content open_case_count decrements", "account strike ledger and standing recomputed; lifetime_removed_count increments on REMOVE", "appeal_deadline_at = decided_at + pinned appeal_window_hours", "sla_breached = clock now > sla_due_at", "queue open_case_count decrements", "reviewer open_case_count decrements; exposure charge is retained, never refunded", "version increments"]
  - method: POST
    path: "/moderation/moderation-cases/{id}/escalate"
    description: "Escalate an assigned case for imminent harm, a legal request, a high-profile account or calibration. Raises escalation_tier, shortens the SLA and releases the reviewer."
    roles: [Reviewer, QAAuditor]
    code: 200
    input: [escalation_reason]
    output: ModerationCase
    side_effects: ["status = ESCALATED", "escalation_reason recorded and escalation_tier = 2", "sla_due_at = clock now + ESCALATION_SLA_MINUTES (30); the congestion multiplier is NOT applied on this branch", "assigned_reviewer_id cleared, that reviewer's open_case_count decrements and the case exposure charge is refunded in full (the case leaves undecided)", "queue open_case_count and unassigned_case_count both unchanged (an ESCALATED case stays open but is not queue-assignable)", "version increments"]
  - method: POST
    path: "/moderation/moderation-cases/{id}/return-to-queue"
    description: "Send an escalated case back to its specialty queue for ordinary review without deciding it, resetting the SLA from the case's pinned review_sla_minutes."
    roles: [QAAuditor, TrustSafetyAdmin]
    code: 200
    input: ["reason?"]
    output: ModerationCase
    side_effects: ["status = PENDING_ASSIGNMENT", "escalation_tier = 1 (de-escalated but flagged) and escalation_reason retained as history", "queue unassigned_case_count increments; open_case_count unchanged", "sla_due_at recomputed per calculations.review_sla_due_at from the queue's current open_case_count", "version increments"]
  - method: GET
    path: "/moderation/moderation-cases/{id}"
    description: "Fetch one case with its pinned policy version, SLA, escalation posture and decision record."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: []
    output: ModerationCase
    side_effects: []
  - method: GET
    path: "/moderation/moderation-cases"
    description: "List cases by any of their references or by lifecycle facets; this is the reverse-reachability channel for cases created as a side effect of detection."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel]
    code: 200
    input: ["content_item_id?", "detection_signal_id?", "policy_version_id?", "queue_id?", "assigned_reviewer_id?", "decided_by_reviewer_id?", "status?", "origin?", "limit?", "offset?"]
    output: ModerationCase[]
    side_effects: []
  # ---- Appeals ----
  - method: POST
    path: "/moderation/appeals"
    description: "File an appeal against a decided case. The acting AccountHolder must own the appealed content, the appeal window must still be open, and the account must hold at least one appeal credit."
    roles: [AccountHolder]
    code: 201
    input: [case_id, grounds_text]
    output: Appeal
    side_effects: ["status = SUBMITTED", "filed_at = clock now", "account_id copied from the content's author", "account appeal_credits_remaining decrements by 1", "content review_status = APPEALED (visibility_status untouched)", "no reviewer counter moves yet: appealed_count and both accuracy variants only change when the appeal reaches UPHELD or OVERTURNED"]
  - method: POST
    path: "/moderation/appeals/{id}/assign-reviewer"
    description: "Route a submitted appeal to an independent reviewer. The reviewer may not be the original decider and must be certified on the case's pinned policy version; omit target_reviewer_id to let the server select per calculations.reviewer_selection with the original decider excluded."
    roles: [QAAuditor]
    code: 200
    input: ["target_reviewer_id?"]
    output: Appeal
    side_effects: ["status = INDEPENDENT_REVIEW", "independent_reviewer_id set"]
  - method: POST
    path: "/moderation/appeals/{id}/resolve"
    description: "The independent reviewer upholds or overturns the original decision. An overturn reinstates the content, reverses the strike points, refunds the appeal credit and drives reviewer accuracy and retraining."
    roles: [Reviewer]
    code: 200
    input: [resolution, "resolution_note?"]
    output: Appeal
    side_effects: ["status = UPHELD or OVERTURNED", "resolved_at = clock now", "UPHELD: original decider upheld_appeal_count increments; nothing is reversed", "OVERTURNED: case is_overturned = true; content visibility_status = REINSTATED and reinstated_at = clock now; the case's strike_points_applied is subtracted from the account and standing is recomputed; lifetime_removed_count decrements when the reversed outcome was REMOVE; the account's appeal credit is refunded; the original decider's accuracy variants are recomputed and the reviewer is demoted to PENDING_RETRAINING or SUSPENDED when the gate score falls below its floor", "reinstated_content = true on an overturn"]
  - method: GET
    path: "/moderation/appeals/{id}"
    description: "Fetch one appeal; an AccountHolder may only read their own."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel, AccountHolder]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/moderation/appeals"
    description: "List appeals by case, appellant account, independent reviewer or status."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer, LegalCounsel, AccountHolder]
    code: 200
    input: ["case_id?", "account_id?", "independent_reviewer_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  # ---- Quality assurance ----
  - method: POST
    path: "/moderation/audit-samples"
    description: "Draw a decided case into the QA sample. The acting reviewer must have role_class QA and may not audit a case they decided."
    roles: [QAAuditor]
    code: 201
    input: [case_id, sampling_reason]
    output: AuditSample
    side_effects: ["status = SAMPLED", "auditor_reviewer_id = X-User-ID", "counts_toward_accuracy = true", "verdict null until audited"]
  - method: POST
    path: "/moderation/audit-samples/{id}/audit"
    description: "Record the QA verdict. correct_outcome is required whenever the verdict is a disagreement. Re-auditing a disputed sample overwrites the prior verdict and re-derives the reviewer's accuracy."
    roles: [QAAuditor]
    code: 200
    input: [verdict, "correct_outcome?"]
    output: AuditSample
    side_effects: ["status = AUDITED", "audited_at = clock now", "the decided reviewer's audited_count and agree_count are re-derived from all AUDITED samples that count toward accuracy", "both accuracy variants recomputed", "the reviewer is demoted to PENDING_RETRAINING or SUSPENDED when the gate score falls below its floor and the sample gate is met"]
  - method: POST
    path: "/moderation/audit-samples/{id}/dispute"
    description: "The audited reviewer contests a verdict, suspending the sample's contribution to accuracy until it is re-audited."
    roles: [Reviewer]
    code: 200
    input: [dispute_note]
    output: AuditSample
    side_effects: ["status = DISPUTED", "disputed_at = clock now", "counts_toward_accuracy = false", "the reviewer's audited_count, agree_count and both accuracy variants are re-derived without this sample"]
  - method: GET
    path: "/moderation/audit-samples/{id}"
    description: "Fetch one audit sample with its verdict and dispute history."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer]
    code: 200
    input: []
    output: AuditSample
    side_effects: []
  - method: GET
    path: "/moderation/audit-samples"
    description: "List audit samples by case, auditor, status or verdict."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, Reviewer]
    code: 200
    input: ["case_id?", "auditor_reviewer_id?", "status?", "verdict?", "limit?", "offset?"]
    output: AuditSample[]
    side_effects: []
  # ---- Transparency reporting ----
  - method: POST
    path: "/moderation/transparency-reports"
    description: "Open a DRAFT transparency report over the CLOSED period [period_start, period_end]. Periods may not intersect an existing report, and sharing a single endpoint instant counts as an intersection."
    roles: [TrustSafetyAdmin]
    code: 201
    input: [period_start, period_end]
    output: TransparencyReport
    side_effects: ["status = DRAFT", "all volume, rate and breakdown fields start at their zero defaults", "variant stays null until the report is computed"]
  - method: POST
    path: "/moderation/transparency-reports/{id}/compute"
    description: "Compute the report under one of two variants: PROVISIONAL counts every decision as recorded, RESTATED discounts overturned decisions. Recomputation with a different variant is permitted until publication."
    roles: [TrustSafetyAdmin]
    code: 200
    input: [variant]
    output: TransparencyReport
    side_effects: ["status = COMPUTED", "variant recorded", "all volume, rate and breakdown fields written per calculations.transparency_enforcement_volumes", "computed_at = clock now"]
  - method: POST
    path: "/moderation/transparency-reports/{id}/publish"
    description: "Publish a computed report. Only the RESTATED variant may be published, and no appeal on a case decided inside the period may still be open."
    roles: [TrustSafetyAdmin, LegalCounsel]
    code: 200
    input: []
    output: TransparencyReport
    side_effects: ["status = PUBLISHED", "published_at = clock now", "the report becomes immutable"]
  - method: GET
    path: "/moderation/transparency-reports/{id}"
    description: "Fetch one transparency report with its variant-dependent volumes and per-category breakdown."
    roles: [TrustSafetyAdmin, PolicyManager, QAAuditor, LegalCounsel]
    code: 200
    input: []
    output: TransparencyReport
    side_effects: []
  # ---- Test-driving surface ----
  - method: POST
    path: "/moderation/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which stamps every posted_at, sla_due_at, decided_at, appeal deadline and report period comparison. Before any call to this endpoint the logical clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock may only move forward or stay put."
    roles: [TrustSafetyAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: datetime
    side_effects: ["the logical clock is set to to_iso8601", "no entity is modified"]

errors:
  # -- authentication / authorization --
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted on this endpoint, or an origin/decision path reserved for LegalCounsel or TrustSafetyAdmin is attempted by another role, or a non-QA reviewer tries to draw an audit sample"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, confidence or threshold outside 0.0000..1.0000, non-positive break_minutes, empty languages or specialties array, or a disagreement verdict without correct_outcome"
  # -- existence --
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "the referenced account id does not exist"
  - id: ERR_CONTENT_NOT_FOUND
    http: 404
    condition: "the referenced content item id does not exist"
  - id: ERR_CATEGORY_NOT_FOUND
    http: 404
    condition: "the referenced policy category id or policy_category_code does not exist"
  - id: ERR_POLICY_VERSION_NOT_FOUND
    http: 404
    condition: "the referenced policy version id does not exist"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "the referenced reviewer id (path, target_reviewer_id or an exclude_reviewer_ids member) does not exist"
  - id: ERR_QUEUE_NOT_FOUND
    http: 404
    condition: "the referenced review queue id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "the referenced moderation case id does not exist"
  - id: ERR_DETECTION_SIGNAL_NOT_FOUND
    http: 404
    condition: "the referenced detection signal id does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "the referenced appeal id does not exist"
  - id: ERR_AUDIT_SAMPLE_NOT_FOUND
    http: 404
    condition: "the referenced audit sample id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "the referenced transparency report id does not exist"
  # -- ownership and duty separation --
  - id: ERR_NOT_CASE_OWNER
    http: 403
    condition: "the acting Reviewer is neither the case's assigned_reviewer_id (decide, escalate) nor its decided_by_reviewer_id (dispute)"
  - id: ERR_NOT_APPEAL_REVIEWER
    http: 403
    condition: "the acting Reviewer is not the appeal's independent_reviewer_id"
  - id: ERR_APPEAL_NOT_OWNED
    http: 403
    condition: "an AccountHolder appeals or reads an appeal belonging to another account"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID would both author and activate a policy version, both decide and audit a case, or both decide a case and act as its independent appeal reviewer"
  - id: ERR_ACCOUNT_BANNED
    http: 403
    condition: "content ingestion attempted for an account whose standing is BANNED"
  # -- lifecycle state --
  - id: ERR_CASE_ALREADY_DECIDED
    http: 409
    condition: "any case mutation attempted on a case already in DECIDED"
  - id: ERR_CASE_NOT_ASSIGNED
    http: 409
    condition: "decide attempted on a case that is neither ASSIGNED nor ESCALATED for LEGAL_REQUEST"
  - id: ERR_INVALID_CASE_TRANSITION
    http: 409
    condition: "escalate attempted on a case that is not ASSIGNED, or return-to-queue attempted on a case that is not ESCALATED"
  - id: ERR_POLICY_VERSION_NOT_DRAFT
    http: 409
    condition: "back-test attempted on a version that is not DRAFT, or revise attempted on a version that is not BACKTESTING"
  - id: ERR_POLICY_VERSION_NOT_BACKTESTED
    http: 409
    condition: "activate attempted on a version that is not BACKTESTING or whose backtest_divergence_rate is null"
  - id: ERR_POLICY_VERSION_NOT_CERTIFIABLE
    http: 409
    condition: "certification requested on a policy version whose status is neither BACKTESTING nor ACTIVE"
  - id: ERR_CASE_NOT_DECIDED
    http: 409
    condition: "appeal or audit sampling attempted on a case that is not DECIDED"
  - id: ERR_APPEAL_NOT_UNDER_REVIEW
    http: 409
    condition: "assign-reviewer attempted on an appeal that is not SUBMITTED, or resolve attempted on an appeal that is not INDEPENDENT_REVIEW"
  - id: ERR_AUDIT_NOT_AUDITABLE
    http: 409
    condition: "audit attempted on a sample that is neither SAMPLED nor DISPUTED"
  - id: ERR_AUDIT_NOT_DISPUTABLE
    http: 409
    condition: "dispute attempted on a sample that is not AUDITED"
  - id: ERR_REPORT_NOT_COMPUTED
    http: 409
    condition: "publish attempted on a report that is not COMPUTED"
  - id: ERR_REPORT_ALREADY_PUBLISHED
    http: 409
    condition: "compute or publish attempted on a PUBLISHED report"
  - id: ERR_REVIEWER_NOT_ACTIVE
    http: 409
    condition: "the reviewer to be assigned, deciding, escalating, routed an appeal or sent on a wellness break is not ACTIVE"
  - id: ERR_REVIEWER_NOT_ON_BREAK
    http: 409
    condition: "return-to-duty attempted on a reviewer who is not ON_WELLNESS_BREAK"
  - id: ERR_CONTENT_NOT_LIVE
    http: 409
    condition: "a signal or manual case is raised against content whose visibility_status is REMOVED"
  - id: ERR_NO_ACTIVE_POLICY_VERSION
    http: 409
    condition: "the resolved policy category is still DRAFT or has no ACTIVE version to pin"
  # -- workforce eligibility (safety and temporal) --
  - id: ERR_REVIEWER_NOT_CERTIFIED
    http: 422
    condition: "the reviewer does not hold the case's PINNED policy version in certified_policy_version_ids"
  - id: ERR_REVIEWER_LANGUAGE_MISMATCH
    http: 422
    condition: "the directed reviewer does not serve the queue's language or its specialty"
  - id: ERR_EXPOSURE_CAP_EXCEEDED
    http: 422
    condition: "exposure_points_today plus the case's exposure charge would exceed the reviewer's daily_exposure_cap_points"
  - id: ERR_REVIEWER_OFF_SHIFT
    http: 422
    condition: "the logical clock in the reviewer's local time falls outside [shift_start_local_hour, shift_end_local_hour)"
  - id: ERR_REVIEWER_AT_CAPACITY
    http: 422
    condition: "the reviewer's open_case_count already equals max_concurrent_cases"
  - id: ERR_REVIEWER_NOT_ELIGIBLE_FOR_ESCALATION
    http: 422
    condition: "an ESCALATED case is directed at a reviewer whose role_class is FRONTLINE"
  - id: ERR_NO_ELIGIBLE_REVIEWER
    http: 409
    condition: "automatic selection finds no reviewer satisfying every eligibility predicate"
  - id: ERR_NO_ELIGIBLE_QUEUE
    http: 422
    condition: "no review queue matches the pinned category and the content's language"
  # -- appeals --
  - id: ERR_APPEAL_ALREADY_EXISTS
    http: 409
    condition: "an appeal already exists for this case"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is past the case's appeal_deadline_at"
  - id: ERR_APPEAL_CREDITS_EXHAUSTED
    http: 402
    condition: "the appellant account has appeal_credits_remaining equal to 0"
  # -- wellness and reporting windows --
  - id: ERR_WELLNESS_BREAK_OVERLAP
    http: 409
    condition: "the requested half-open break window overlaps the reviewer's retained break window"
  - id: ERR_REPORT_PERIOD_INVALID
    http: 422
    condition: "period_end is not strictly after period_start"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "the requested closed period intersects an existing report's closed period, including sharing a single endpoint instant"
  - id: ERR_REPORT_NOT_RESTATED
    http: 422
    condition: "publication attempted on a report whose variant is PROVISIONAL"
  - id: ERR_OPEN_APPEALS_IN_PERIOD
    http: 422
    condition: "an appeal on a case decided inside the report period is still SUBMITTED or INDEPENDENT_REVIEW"
  # -- policy governance --
  - id: ERR_BACKTEST_DIVERGENCE_EXCEEDED
    http: 422
    condition: "the draft's backtest_divergence_rate is strictly greater than MAX_BACKTEST_DIVERGENCE (0.2500)"
  - id: ERR_THRESHOLD_ORDER_INVALID
    http: 422
    condition: "review_floor exceeds auto_action_threshold on create or after revision"
  - id: ERR_CHILD_SEVERITY_EXCEEDS_PARENT
    http: 422
    condition: "the child category's severity tier is more severe than its parent's"
  - id: ERR_QUEUE_SPECIALTY_MISMATCH
    http: 422
    condition: "the queue's specialty differs from its policy category's specialty"
  - id: ERR_DUPLICATE_CATEGORY_CODE
    http: 409
    condition: "a policy category with this code already exists"
  - id: ERR_DUPLICATE_HANDLE
    http: 409
    condition: "an account with this external_handle already exists"
  - id: ERR_LEGAL_CASE_REQUIRES_JURISDICTION
    http: 422
    condition: "origin LEGAL_REQUEST submitted without legal_jurisdiction or legal_reference"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock"
  # -- optimistic concurrency --
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not match the case's current version"
  - id: ERR_STALE_REVIEWER_VERSION
    http: 412
    condition: "expected_reviewer_version does not match the reviewer's current version"

roles:
  - name: TrustSafetyAdmin
    description: "Operations owner of the moderation pipeline: onboards accounts, content, queues and reviewers, drives assignment and workforce wellness, and opens/computes transparency reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /moderation/accounts"
      - "POST /moderation/content-items"
      - "POST /moderation/review-queues"
      - "POST /moderation/reviewers"
      - "POST /moderation/reviewers/{id}/wellness-break"
      - "POST /moderation/reviewers/{id}/return-to-duty"
      - "POST /moderation/detection-signals"
      - "POST /moderation/transparency-reports"
      - "POST /moderation/transparency-reports/{id}/compute"
      - "POST /moderation/_clock/set_current_utc"
    shared_operations:
      - "POST /moderation/moderation-cases (origin MANUAL_REPORT only)"
      - "POST /moderation/moderation-cases/{id}/assign"
      - "POST /moderation/moderation-cases/{id}/return-to-queue"
      - "POST /moderation/transparency-reports/{id}/publish"
      - "all GET endpoints except GET /moderation/transparency-reports/{id} restrictions"
  - name: PolicyManager
    description: "Owns the policy taxonomy and its versioned enforcement rules, including back-testing, activation under segregation of duties, and reviewer certification."
    identity: "opaque"
    exclusive_operations:
      - "POST /moderation/policy-categories"
      - "POST /moderation/policy-versions"
      - "POST /moderation/policy-versions/{id}/back-test"
      - "POST /moderation/policy-versions/{id}/revise"
      - "POST /moderation/policy-versions/{id}/activate"
      - "POST /moderation/reviewers/{id}/certifications"
    shared_operations:
      - "GET endpoints across accounts, content, taxonomy, queues, reviewers, cases, appeals, audit samples and reports"
  - name: Reviewer
    description: "Frontline or senior human reviewer. Decides and escalates the cases assigned to them, resolves appeals they are the independent reviewer for, and may dispute a QA verdict on their own decision."
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /moderation/appeals/{id}/resolve"
      - "POST /moderation/audit-samples/{id}/dispute"
    shared_operations:
      - "POST /moderation/moderation-cases/{id}/decide"
      - "POST /moderation/moderation-cases/{id}/escalate"
      - "GET endpoints across content, taxonomy, queues, reviewers, cases, appeals and audit samples"
  - name: QAAuditor
    description: "Reviewer with role_class QA. Samples and audits decided cases, calibrates the workforce, routes appeals to independent reviewers, and reassigns or returns escalated cases."
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /moderation/audit-samples"
      - "POST /moderation/audit-samples/{id}/audit"
      - "POST /moderation/appeals/{id}/assign-reviewer"
    shared_operations:
      - "POST /moderation/moderation-cases/{id}/assign"
      - "POST /moderation/moderation-cases/{id}/escalate"
      - "POST /moderation/moderation-cases/{id}/return-to-queue"
      - "GET endpoints across content, taxonomy, queues, reviewers, cases, appeals, audit samples and reports"
  - name: LegalCounsel
    description: "Handles legal removal requests and government demands: opens jurisdiction-bearing cases, decides them without frontline certification, and co-signs published transparency reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /moderation/moderation-cases (origin LEGAL_REQUEST only)"
    shared_operations:
      - "POST /moderation/moderation-cases/{id}/decide (only cases escalated for LEGAL_REQUEST)"
      - "POST /moderation/transparency-reports/{id}/publish"
      - "GET endpoints across accounts, content, taxonomy, reviewers, cases, appeals and reports"
  - name: AccountHolder
    description: "The platform user whose content was enforced against. May file one appeal per decided case on their own content and read their own appeals."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /moderation/appeals"
    shared_operations:
      - "GET /moderation/content-items/{id}"
      - "GET /moderation/appeals/{id}"
      - "GET /moderation/appeals"
