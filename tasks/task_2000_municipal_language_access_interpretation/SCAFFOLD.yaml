# =============================================================================
# Task 2000: Municipal Language Access & Interpretation Coordination
# Seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2000. Municipal Language Access & Interpretation Coordination (city language access office): language need assessment by service area, vital document translation queue & quality review, on-demand interpreter request routing (phone/video/in-person), interpreter qualification & confidentiality requirements, department compliance monitoring & complaint intake, cost allocation & vendor contract, signage & notice of free language services, annual language access plan update

domain_name: municipal-language-access
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - selector_policy            # dispatch picks one interpreter from an eligible pool
    - cascading_side_effects     # complaint → rating → suspension → cancellation → release
    - rate_threshold_triggers    # 5% safe-harbor share, 90% contract exhaustion, <600 rating suspension
    - optimistic_concurrency     # OCC on Department.version for profile/budget updates
  entity_topology: flat          # peer entities joined by FK references; no nested URLs
  state_machine_shape: cyclic    # TranslationJob QA revision loop; Interpreter suspension loop; others branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential           # TranslationJob.superseded_by_job_id
  role_model: segregation_of_duties   # translator != reviewer; complaint recorder != adjudicator
  consistency_model: immediate
  difficulty_target: expert      # 9 entities / 40 endpoints / 30 errors / 3 dual-variant calcs / 7 state machines

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Department display name" }
      - { name: service_area_code, type: string, source: input, description: "Service area code this department operates in" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Annual language-services budget in cents; must be >= spent_cents on update (ERR_VALIDATION)" }
      - { name: signage_status, type: enum, source: input, default: CURRENT, description: "Free-language-services signage & notice status: CURRENT | DEFICIENT | MISSING" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Sum of final_cost_cents of its COMPLETED InterpretationRequests plus final_cost_cents of APPROVED TranslationJobs on its documents, minus REFUND clawbacks" }
      - { name: remaining_cents, type: integer, source: computed, description: "Read-only = annual_budget_cents - spent_cents" }
      - { name: compliance_score, type: integer, source: computed, default: 1000, description: "Read-only score per calculations.department_compliance_score (0..1000)" }
      - { name: posture, type: enum, source: computed, description: "Derived from compliance_score: >=800 GOOD_STANDING | 600..799 WATCH | <600 NONCOMPLIANT" }

  - name: LanguageAssessment
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning department (caller liaison must match)" }
      - { name: language_code, type: string, source: input, description: "ISO 639 language code assessed, e.g. 'es'" }
      - { name: plan_year, type: integer, source: input, description: "Plan cycle year this assessment feeds (value-matched to LanguageAccessPlan.plan_year; not a record reference)" }
      - { name: period_start, type: datetime, source: input, description: "Assessment coverage window start (ISO8601); must be < period_end" }
      - { name: period_end, type: datetime, source: input, description: "Assessment coverage window end (half-open [period_start, period_end))" }
      - { name: lep_speaker_count, type: integer, source: input, description: "Limited-English-proficient speakers in the service area (>= 0)" }
      - { name: service_area_population, type: integer, source: input, description: "Total service area population (> 0)" }
      - { name: encounter_count, type: integer, source: input, description: "Department encounters in this language during the window (>= 0)" }
      - { name: total_encounters, type: integer, source: input, description: "Total department encounters across all languages during the window (> 0)" }
      - { name: lep_share, type: number, source: computed, description: "Read-only = lep_speaker_count / service_area_population, 4 decimal places round_half_up" }
      - { name: encounter_share, type: number, source: computed, description: "Read-only = encounter_count / total_encounters, 4 decimal places round_half_up" }
      - { name: threshold_language_safe, type: boolean, source: computed, description: "Safe-harbor variant: lep_share >= 0.05 OR lep_speaker_count >= 1000" }
      - { name: priority_language, type: boolean, source: computed, description: "Encounter-priority variant: encounter_share >= 0.05" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CERTIFIED | REJECTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator (opaque audit stamp)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing ComplianceOfficer" }
      - { name: rejection_note, type: string, source: system, description: "Required when reviewed with decision REJECT; null otherwise" }

  - name: VitalDocument
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; department that owns the document" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: document_type, type: enum, source: input, description: "FORM | NOTICE | GUIDE | POLICY" }
      - { name: base_language, type: string, source: input, default: "en", description: "Source language of the document" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RETIRED" }
      - { name: translated_language_codes, type: array, source: computed, default: [], description: "Sorted unique target_language_code list of this document's TranslationJobs with status APPROVED (SUPERSEDED jobs excluded)" }

  - name: TranslationJob
    parent: null
    common_fields: true
    fields:
      - { name: document_id, type: string, source: input, description: "FK -> VitalDocument.id; document being translated" }
      - { name: vendor_contract_id, type: string, source: input, description: "FK -> VendorContract.id; contract the job bills against" }
      - { name: target_language_code, type: string, source: input, description: "Language to translate into" }
      - { name: word_count, type: integer, source: input, description: "Estimated word count (> 0); basis of provisional cost" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush flag; final cost multiplied by 1.25 when true" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Read-only = word_count * contract.translation_per_word_cents; committed at creation" }
      - { name: translator_id, type: string, source: system, description: "FK -> Interpreter.id; assigned translator (nullable until assign)" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Interpreter.id; quality reviewer (nullable until review); MUST differ from translator_id" }
      - { name: submitted_word_count, type: integer, source: system, description: "Actual translated words declared at submit-translation (> 0)" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of REQUEST_REVISION cycles so far" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Read-only; computed at APPROVE per calculations.translation_cost; null until approved" }
      - { name: superseded_by_job_id, type: string, source: system, description: "FK -> TranslationJob.id; set when a later job for the same (document_id, target_language_code) is APPROVED; null otherwise" }
      - { name: status, type: enum, source: system, description: "QUEUED -> IN_TRANSLATION -> QUALITY_REVIEW -> APPROVED | (QUALITY_REVIEW -> IN_TRANSLATION revision loop) | CANCELLED | SUPERSEDED" }

  - name: Interpreter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Interpreter full name (final dispatch tie-break, ascending)" }
      - { name: language_codes, type: array, source: input, description: "Languages the interpreter covers, e.g. ['es','fr']" }
      - { name: modalities, type: array, source: input, description: "Subset of PHONE | VIDEO | IN_PERSON" }
      - { name: tier, type: enum, source: input, description: "PROVISIONAL | REGISTERED | CERTIFIED" }
      - { name: vendor_contract_id, type: string, source: input, description: "FK -> VendorContract.id; contract this interpreter's work bills against" }
      - { name: confidentiality_signed_at, type: datetime, source: system, description: "Set to current logical time when PATCHed with confidentiality_signed=true; null until signed. Current iff signed_at >= now - 365 days" }
      - { name: quality_rating, type: integer, source: computed, default: 1000, description: "Read-only per calculations.interpreter_quality_rating (0..1000); auto-suspends below 600" }
      - { name: minutes_current_month, type: integer, source: computed, default: 0, description: "Sum of actual_minutes of this interpreter's COMPLETED, non-clawed-back requests whose completed_at falls in the calendar month (UTC) of the current logical clock" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> SUSPENDED (cyclic)" }

  - name: InterpretationRequest
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; requesting department (caller liaison must match)" }
      - { name: language_code, type: string, source: input, description: "Requested language" }
      - { name: modality, type: enum, source: input, description: "PHONE | VIDEO | IN_PERSON" }
      - { name: encounter_setting, type: enum, source: input, description: "GENERAL | MEDICAL | COURT; COURT requires modality IN_PERSON (ERR_SETTING_REQUIRES_IN_PERSON) and CERTIFIED tier at dispatch" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start (ISO8601). Optional for PHONE/VIDEO (defaults to current logical time); required for IN_PERSON. Must not be in the past (ERR_SCHEDULE_IN_PAST); IN_PERSON requires >= 2h lead time (ERR_LEAD_TIME_INSUFFICIENT)" }
      - { name: scheduled_duration_minutes, type: integer, source: input, description: "Planned duration (> 0); basis of estimated cost and overlap window" }
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; interpreter chosen by the dispatch selector; null when UNFULFILLED" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Read-only; estimated variant of calculations.interpretation_cost using scheduled_duration_minutes; committed to the chosen interpreter's contract at dispatch; null when UNFULFILLED" }
      - { name: actual_minutes, type: integer, source: system, description: "Actual session length declared at completion (> 0)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Read-only; final variant of calculations.interpretation_cost using actual_minutes; null until COMPLETED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical timestamp of completion; null until COMPLETED" }
      - { name: refund_clawed_back, type: boolean, source: system, default: false, description: "Set true when a SUBSTANTIATED complaint with remedy REFUND claws this request's cost and minutes back" }
      - { name: status, type: enum, source: system, description: "NEW (transient at creation) -> ASSIGNED | UNFULFILLED; ASSIGNED -> COMPLETED | CANCELLED" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; department complained about" }
      - { name: interpretation_request_id, type: string, source: input, description: "FK -> InterpretationRequest.id; optional linked request (drives interpreter rating penalty and REFUND remedy)" }
      - { name: category, type: enum, source: input, description: "NO_INTERPRETER_AVAILABLE | POOR_QUALITY | CONFIDENTIALITY_BREACH | NOTICE_MISSING | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text complaint narrative" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the intake caller; adjudicator must differ (ERR_SEGREGATION_OF_DUTIES_VIOLATION)" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> SUBSTANTIATED -> RESOLVED | RECEIVED -> DISMISSED" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of adjudicating ComplianceOfficer" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical timestamp of adjudication" }
      - { name: remedy, type: enum, source: system, description: "NONE | REFUND from adjudication input; REFUND requires a linked COMPLETED request" }
      - { name: remediation_due_at, type: datetime, source: computed, description: "SUBSTANTIATED only: adjudicated_at + 30 days; on-time close restores +100 compliance" }
      - { name: resolution_note, type: string, source: system, description: "Required at close" }
      - { name: closed_at, type: datetime, source: system, description: "Logical timestamp of close; null until RESOLVED" }

  - name: VendorContract
    parent: null
    common_fields: true
    fields:
      - { name: vendor_name, type: string, source: input, description: "Language-services vendor name" }
      - { name: ceiling_cents, type: integer, source: input, description: "Contract ceiling (> 0); committed + spent must never exceed it" }
      - { name: phone_per_minute_cents, type: integer, source: input, description: "Rate card: cents per billed minute, PHONE (>= 0)" }
      - { name: video_per_minute_cents, type: integer, source: input, description: "Rate card: cents per billed minute, VIDEO (>= 0)" }
      - { name: in_person_per_minute_cents, type: integer, source: input, description: "Rate card: cents per billed minute, IN_PERSON (>= 0)" }
      - { name: translation_per_word_cents, type: integer, source: input, description: "Rate card: cents per word for translation jobs (>= 0)" }
      - { name: in_person_travel_flat_cents, type: integer, source: input, description: "Rate card: flat travel fee added to IN_PERSON sessions (>= 0)" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_cost_cents of its jobs in {QUEUED, IN_TRANSLATION, QUALITY_REVIEW} plus estimated_cost_cents of ASSIGNED requests whose interpreter belongs to this contract" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Sum of final_cost_cents of its APPROVED jobs plus final_cost_cents of COMPLETED requests billed to it, minus REFUND clawbacks" }
      - { name: available_cents, type: integer, source: computed, description: "Read-only = ceiling_cents - spent_cents - committed_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> EXHAUSTED (auto when spent_cents >= 90% of ceiling_cents)" }

  - name: LanguageAccessPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_year, type: integer, source: input, description: "Calendar plan year; unique among plans with status DRAFT or PUBLISHED (ERR_PLAN_YEAR_CONFLICT)" }
      - { name: summary, type: string, source: input, description: "Optional plan summary" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> SUPERSEDED (when a later plan publishes)" }
      - { name: published_at, type: datetime, source: system, description: "Logical timestamp of publication; null until PUBLISHED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Department
    initial_state: null
    terminal_states: []
    transitions: []
    note: "No lifecycle state machine. posture is a computed field (GOOD_STANDING | WATCH | NONCOMPLIANT derived from compliance_score) that gates child operations; signage_status is an input enum mutated via PATCH or by complaint cascade."

  - entity: LanguageAssessment
    initial_state: DRAFT
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /language-assessments/{id}/review with decision=CERTIFY"
        actor: ComplianceOfficer
        preconditions:
          - "Assessment status == DRAFT (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "reviewed_by_user_id := caller X-User-ID"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /language-assessments/{id}/review with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "Assessment status == DRAFT (else ERR_INVALID_TRANSITION)"
          - "rejection_note present in payload (else ERR_VALIDATION)"
        side_effects:
          - "reviewed_by_user_id := caller X-User-ID; rejection_note recorded"

  - entity: VitalDocument
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /vital-documents/{id}/retire"
        actor: LanguageAccessCoordinator
        preconditions:
          - "Document status == ACTIVE (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "Cascade: every TranslationJob of this document in {QUEUED, IN_TRANSLATION, QUALITY_REVIEW} -> CANCELLED (link 1)"
          - "Each cascaded cancellation releases its provisional commitment: vendor_contract.committed_cents -= job.provisional_cost_cents (link 2)"

  - entity: TranslationJob
    initial_state: QUEUED
    terminal_states: [APPROVED, CANCELLED, SUPERSEDED]
    transitions:
      - from: QUEUED
        to: IN_TRANSLATION
        trigger: "POST /translation-jobs/{id}/assign"
        actor: LanguageAccessCoordinator
        preconditions:
          - "Job status == QUEUED (else ERR_INVALID_TRANSITION)"
          - "translator_id references an existing Interpreter (else ERR_INTERPRETER_NOT_FOUND)"
          - "Interpreter status == ACTIVE (else ERR_INTERPRETER_SUSPENDED)"
          - "Interpreter confidentiality current: confidentiality_signed_at >= now - 365 days (else ERR_CONFIDENTIALITY_NOT_CURRENT)"
          - "target_language_code in interpreter.language_codes (else ERR_VALIDATION)"
          - "Interpreter tier in {REGISTERED, CERTIFIED} (else ERR_TRANSLATOR_TIER_INSUFFICIENT)"
        side_effects:
          - "translator_id := payload translator_id"
      - from: IN_TRANSLATION
        to: QUALITY_REVIEW
        trigger: "POST /translation-jobs/{id}/submit-translation"
        actor: Interpreter
        preconditions:
          - "Job status == IN_TRANSLATION (else ERR_INVALID_TRANSITION)"
          - "Caller X-User-ID == job.translator_id (else ERR_FORBIDDEN_ROLE)"
          - "submitted_word_count > 0 (else ERR_VALIDATION)"
        side_effects:
          - "submitted_word_count recorded"
      - from: QUALITY_REVIEW
        to: APPROVED
        trigger: "POST /translation-jobs/{id}/review with decision=APPROVE"
        actor: QualityReviewer
        preconditions:
          - "Job status == QUALITY_REVIEW (else ERR_INVALID_TRANSITION)"
          - "Caller X-User-ID resolves to an existing Interpreter (else ERR_INTERPRETER_NOT_FOUND) with tier == CERTIFIED (else ERR_REVIEWER_TIER_INSUFFICIENT)"
          - "Caller interpreter id != job.translator_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "reviewer_id := caller; final_cost_cents := calculations.translation_cost final variant (submitted_word_count, revision_count, rush, contract.translation_per_word_cents)"
          - "Ledger: vendor_contract.committed_cents -= provisional_cost_cents; vendor_contract.spent_cents += final_cost_cents (link 1)"
          - "If vendor_contract.spent_cents >= 0.9 * ceiling_cents: vendor_contract.status ACTIVE -> EXHAUSTED (link 2)"
          - "EXHAUSTED cascade: every QUEUED TranslationJob on that contract -> CANCELLED (link 3); each releases its provisional commitment: committed_cents -= provisional_cost_cents (link 4)"
          - "Prior APPROVED TranslationJob for same (document_id, target_language_code), if any -> SUPERSEDED with superseded_by_job_id := this job"
          - "document.translated_language_codes recomputed; document.department spent_cents += final_cost_cents (cost allocation)"
      - from: QUALITY_REVIEW
        to: IN_TRANSLATION
        trigger: "POST /translation-jobs/{id}/review with decision=REQUEST_REVISION"
        actor: QualityReviewer
        preconditions:
          - "Same reviewer preconditions as APPROVE"
        side_effects:
          - "revision_count += 1; translator_id unchanged (revision loop)"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /translation-jobs/{id}/cancel, or system cascade (document retire, contract exhaustion)"
        actor: LanguageAccessCoordinator | system
        preconditions:
          - "Job status in {QUEUED, IN_TRANSLATION, QUALITY_REVIEW} (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "vendor_contract.committed_cents -= provisional_cost_cents"
      - from: IN_TRANSLATION
        to: CANCELLED
        trigger: "POST /translation-jobs/{id}/cancel, or system cascade"
        actor: LanguageAccessCoordinator | system
        preconditions: ["Job status in {QUEUED, IN_TRANSLATION, QUALITY_REVIEW}"]
        side_effects: ["vendor_contract.committed_cents -= provisional_cost_cents"]
      - from: QUALITY_REVIEW
        to: CANCELLED
        trigger: "POST /translation-jobs/{id}/cancel, or system cascade"
        actor: LanguageAccessCoordinator | system
        preconditions: ["Job status in {QUEUED, IN_TRANSLATION, QUALITY_REVIEW}"]
        side_effects: ["vendor_contract.committed_cents -= provisional_cost_cents"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (when a later job for the same (document_id, target_language_code) is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_job_id := newly approved job id"
          - "document.translated_language_codes recomputed (superseded jobs excluded)"

  - entity: Interpreter
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /interpreters/{id} with status=SUSPENDED, or system auto-suspension when quality_rating recomputes below 600"
        actor: ComplianceOfficer | system
        preconditions:
          - "Interpreter status == ACTIVE (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "Cascade (system path only): every InterpretationRequest with interpreter_id == this interpreter and status == ASSIGNED -> CANCELLED; each cancellation releases its commitment: vendor_contract.committed_cents -= request.estimated_cost_cents"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /interpreters/{id} with status=ACTIVE"
        actor: ComplianceOfficer
        preconditions:
          - "Interpreter status == SUSPENDED (else ERR_INVALID_TRANSITION)"
        side_effects:
          - "quality_rating := 600 (probationary floor reset)"

  - entity: InterpretationRequest
    initial_state: NEW
    terminal_states: [UNFULFILLED, COMPLETED, CANCELLED]
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "POST /interpretation-requests (creation synchronously runs the dispatch selector; non-empty eligible pool)"
        actor: DepartmentLiaison
        preconditions:
          - "Department posture != NONCOMPLIANT (else ERR_DEPARTMENT_NONCOMPLIANT)"
          - "COURT encounter_setting requires modality == IN_PERSON (else ERR_SETTING_REQUIRES_IN_PERSON)"
          - "scheduled_start >= now (else ERR_SCHEDULE_IN_PAST); IN_PERSON requires scheduled_start >= now + 2h (else ERR_LEAD_TIME_INSUFFICIENT)"
          - "Dispatch selector (calculations.interpreter_dispatch_selection) returns a candidate; department.remaining_cents >= estimated_cost_cents (else ERR_DEPARTMENT_BUDGET_EXCEEDED)"
        side_effects:
          - "interpreter_id := selected interpreter; estimated_cost_cents computed (estimated variant)"
          - "vendor_contract.committed_cents += estimated_cost_cents (interpreter's contract)"
      - from: NEW
        to: UNFULFILLED
        trigger: "POST /interpretation-requests (creation; dispatch selector returns empty pool)"
        actor: DepartmentLiaison
        preconditions:
          - "All NEW preconditions except dispatch feasibility; pool empty"
        side_effects:
          - "interpreter_id := null; estimated_cost_cents := null"
          - "department.compliance_score recompute adds -50 event (unfulfilled service, event_at = request.created_at)"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /interpretation-requests/{id}/complete"
        actor: Interpreter
        preconditions:
          - "Request status == ASSIGNED (else ERR_INVALID_TRANSITION)"
          - "Caller X-User-ID == request.interpreter_id (else ERR_FORBIDDEN_ROLE)"
          - "actual_minutes > 0 (else ERR_VALIDATION)"
        side_effects:
          - "final_cost_cents := calculations.interpretation_cost final variant (actual_minutes)"
          - "vendor_contract.committed_cents -= estimated_cost_cents; vendor_contract.spent_cents += final_cost_cents"
          - "department.spent_cents += final_cost_cents"
          - "interpreter quality event +5 at completed_at (clamped at 1000); minutes_current_month derivation picks up actual_minutes"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /interpretation-requests/{id}/cancel, or system cascade from interpreter suspension"
        actor: DepartmentLiaison | LanguageAccessCoordinator | system
        preconditions:
          - "Request status == ASSIGNED (else ERR_INVALID_TRANSITION)"
          - "DepartmentLiaison caller must own request.department_id (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "vendor_contract.committed_cents -= estimated_cost_cents"

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: RECEIVED
        to: SUBSTANTIATED
        trigger: "POST /complaints/{id}/adjudicate with outcome=SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint status == RECEIVED (else ERR_INVALID_TRANSITION)"
          - "Caller X-User-ID != complaint.recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "remedy=REFUND requires interpretation_request_id set and that request status == COMPLETED (else ERR_VALIDATION)"
        side_effects:
          - "adjudicated_by_user_id := caller; adjudicated_at := now; remediation_due_at := now + 30 days; remedy recorded"
          - "department.compliance_score recompute adds -150 event at adjudicated_at (link 1a)"
          - "If category == NOTICE_MISSING: department.signage_status := DEFICIENT (link 1b)"
          - "If interpretation_request_id set: linked interpreter quality_rating recompute adds -200 event at adjudicated_at (link 1c)"
          - "Rating mutation: if recomputed quality_rating < 600 and interpreter status == ACTIVE -> interpreter -> SUSPENDED (link 2)"
          - "Suspension cascade: that interpreter's ASSIGNED requests -> CANCELLED (link 3); each cancellation releases estimated_cost_cents from the interpreter's vendor_contract.committed_cents (link 4)"
          - "If remedy == REFUND: department.spent_cents -= request.final_cost_cents; vendor_contract.spent_cents -= request.final_cost_cents; request.refund_clawed_back := true (minutes_current_month derivation drops its actual_minutes)"
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /complaints/{id}/adjudicate with outcome=DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint status == RECEIVED (else ERR_INVALID_TRANSITION)"
          - "Caller X-User-ID != complaint.recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "adjudicated_by_user_id := caller; adjudicated_at := now"
      - from: SUBSTANTIATED
        to: RESOLVED
        trigger: "POST /complaints/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Complaint status == SUBSTANTIATED (else ERR_INVALID_TRANSITION)"
          - "resolution_note present (else ERR_VALIDATION)"
        side_effects:
          - "closed_at := now; if closed_at <= remediation_due_at: department.compliance_score recompute adds +100 event at closed_at; late close restores nothing"

  - entity: VendorContract
    initial_state: DRAFT
    terminal_states: [EXHAUSTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /vendor-contracts/{id}/activate"
        actor: LanguageAccessCoordinator
        preconditions:
          - "Contract status == DRAFT (else ERR_INVALID_TRANSITION)"
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (whenever spent_cents recomputes to >= 90% of ceiling_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: every QUEUED TranslationJob on this contract -> CANCELLED; each releases provisional_cost_cents from committed_cents"
        note: "EXHAUSTED blocks NEW commitments (job creation, dispatch eligibility) but in-flight IN_TRANSLATION/QUALITY_REVIEW jobs and ASSIGNED requests still complete and add to spent_cents."

  - entity: LanguageAccessPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /language-access-plans/{id}/publish"
        actor: LanguageAccessCoordinator
        preconditions:
          - "Plan status == DRAFT (else ERR_INVALID_TRANSITION)"
          - "Every Department has at least one LanguageAssessment with plan_year == plan.plan_year and status == CERTIFIED (else ERR_MISSING_CERTIFIED_ASSESSMENTS)"
        side_effects:
          - "published_at := now"
          - "The previously PUBLISHED plan (if any) -> SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (when another plan is published)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: department-patch-stale-version
    parent_entity: Department
    write_endpoint: "PATCH /departments/{id}"
    occ_field: expected_department_version
    description: |
      Updating a Department whose version has advanced since the client last
      observed it is rejected. A client's view goes stale whenever any accepted
      write (another PATCH, or a cascaded mutation such as spent_cents /
      compliance_score / signage_status changes) has bumped the department's
      version in between; the stale write carries an expected_department_version
      that no longer matches and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: threshold_language_classification
    trigger: "LanguageAssessment creation (both variants computed and stored on the record)"
    algorithm: threshold
    formula: |
      lep_share = round_half_up(lep_speaker_count / service_area_population, 4)
      encounter_share = round_half_up(encounter_count / total_encounters, 4)
      safe-harbor variant:   threshold_language_safe = (lep_share >= 0.05) OR (lep_speaker_count >= 1000)
      encounter variant:     priority_language       = (encounter_share >= 0.05)
      Both booleans are computed from the SAME assessment record and MAY differ.
      threshold_language_safe drives the vital-document translation mandate;
      priority_language drives plan prioritization.
    input_set: "The single LanguageAssessment record being created"
    constants:
      SAFE_HARBOR_SHARE: 0.05
      SAFE_HARBOR_COUNT: 1000
    precision: "shares at 4 decimal places, round_half_up; comparisons use the rounded share"
    variants:
      - name: safe_harbor
        when: "Always computed; drives vital-document mandate and plan certification coverage"
        difference: "Uses lep_share against population with an absolute-count override (>= 1000 speakers)"
      - name: encounter_priority
        when: "Always computed; drives prioritization in the annual plan"
        difference: "Uses encounter_share against total encounters; can be false while safe_harbor is true for identical input data"

  - name: interpretation_cost
    trigger: "estimated variant: at dispatch (status NEW -> ASSIGNED); final variant: at completion (ASSIGNED -> COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      Constants: BILLING_INCREMENT_MIN = 6; MIN_MINUTES = {PHONE: 15, VIDEO: 15, IN_PERSON: 60};
      TIER_MULT = {PROVISIONAL: 0.85, REGISTERED: 1.0, CERTIFIED: 1.15}; AFTER_HOURS_MULT = 1.5.
      Rates come from the SELECTED interpreter's VendorContract rate card.
      After-hours := scheduled_start's UTC hour < 8 or >= 18 (same basis for both variants).
      Pinned rounding order (order matters; do NOT multiply on raw minutes):
        1. billable_minutes = max(MIN_MINUTES[modality], ceil(minutes / 6) * 6)
        2. base = billable_minutes * rate_per_minute[modality]
        3. tiered = round_half_up(base * TIER_MULT[tier])          # round AFTER tier step
        4. timed = round_half_up(tiered * AFTER_HOURS_MULT) if after_hours else tiered
        5. total = timed + (in_person_travel_flat_cents if modality == IN_PERSON else 0)
      estimated variant uses minutes = scheduled_duration_minutes;
      final variant uses minutes = actual_minutes. Identical scheduled inputs
      therefore produce different estimated vs final costs whenever actual_minutes
      differs from scheduled_duration_minutes.
    input_set: "The InterpretationRequest + selected Interpreter.tier + interpreter's VendorContract rate card"
    constants:
      BILLING_INCREMENT_MIN: 6
      AFTER_HOURS_MULT: 1.5
      BUSINESS_HOURS_UTC: "08:00 <= hour < 18"
    precision: "integer cents; round_half_up after the tier step and after the after-hours step"
    variants:
      - name: estimated
        when: "Dispatch (NEW -> ASSIGNED); committed to the contract"
        difference: "Uses scheduled_duration_minutes"
      - name: final
        when: "Completion (ASSIGNED -> COMPLETED); moves commitment into spent"
        difference: "Uses actual_minutes; replaces the estimate in the ledger (committed -= estimated, spent += final)"

  - name: translation_cost
    trigger: "provisional variant: job creation; final variant: review APPROVE (QUALITY_REVIEW -> APPROVED)"
    algorithm: tiered_pricing
    formula: |
      rate = vendor_contract.translation_per_word_cents
      provisional variant: provisional_cost_cents = word_count * rate
      final variant (inputs: submitted_word_count, revision_count, rush, rate — 4 inputs with non-linear interaction):
        1. base = submitted_word_count * rate
        2. revision_pct = min(revision_count * 0.10, 0.30)     # cap at 30%
        3. surcharged = base + round_half_up(base * revision_pct)
        4. final_cost_cents = round_half_up(surcharged * 1.25) if rush else surcharged
    input_set: "The TranslationJob + its VendorContract rate card"
    constants:
      REVISION_PCT_PER_CYCLE: 0.10
      REVISION_PCT_CAP: 0.30
      RUSH_MULT: 1.25
    precision: "integer cents; round_half_up after the surcharge step and after the rush step"
    variants:
      - name: provisional
        when: "Creation; committed against the contract ceiling"
        difference: "Flat estimate: word_count * rate, no revision or rush factors"
      - name: final
        when: "Approval; moves committed into spent"
        difference: "Uses submitted_word_count with capped revision surcharge and rush multiplier — diverges from provisional whenever submitted_word_count != word_count or revision_count > 0 or rush"

  - name: department_compliance_score
    trigger: "On every complaint adjudication, complaint close, and UNFULFILLED request creation affecting the department; recomputed in full (chronological replay)"
    algorithm: chronological
    formula: |
      Events for department D:
        - SUBSTANTIATED adjudication: -150, event_at = complaint.adjudicated_at
        - UNFULFILLED request:        -50,  event_at = request.created_at
        - RESOLVED close with closed_at <= remediation_due_at: +100, event_at = complaint.closed_at
      Pinned evaluation order (order matters because of stepwise clamping):
        sort events by event_at ASC; ties broken by the source record's created_at ASC.
        score = 1000; for each event in order: score = clamp(score + delta, 0, 1000).
      posture derivation (from the FINAL score):
        >= 800 GOOD_STANDING; 600..799 WATCH; < 600 NONCOMPLIANT.
    input_set: "All Complaints of D with status in {SUBSTANTIATED, RESOLVED} (by adjudicated_at) plus all InterpretationRequests of D with status UNFULFILLED (by created_at) plus close events of RESOLVED complaints"
    constants:
      SUBSTANTIATED_PENALTY: 150
      UNFULFILLED_PENALTY: 50
      ON_TIME_RESOLUTION_BONUS: 100
      WATCH_FLOOR: 600
      GOOD_STANDING_FLOOR: 800
    precision: "integer points"

  - name: interpreter_quality_rating
    trigger: "On every request completion and every SUBSTANTIATED adjudication linked to one of the interpreter's requests; recomputed in full (chronological replay); recomputation below 600 auto-suspends an ACTIVE interpreter"
    algorithm: aggregation
    formula: |
      Events for interpreter I:
        - request completion: +5, event_at = request.completed_at
        - SUBSTANTIATED complaint linked to one of I's requests: -200, event_at = complaint.adjudicated_at
      sort by event_at ASC, ties by source record created_at ASC.
      rating = 1000; for each event: rating = clamp(rating + delta, 0, 1000).
      After each recomputation: if rating < 600 and I.status == ACTIVE -> I.status := SUSPENDED (system transition with its cancellation cascade).
      Reinstatement (SUSPENDED -> ACTIVE) sets rating := 600 (probationary floor reset).
    input_set: "All COMPLETED requests of I (by completed_at) and all SUBSTANTIATED/RESOLVED complaints whose interpretation_request_id resolves to a request with interpreter_id == I"
    constants:
      COMPLETION_BONUS: 5
      SUBSTANTIATED_LINKED_PENALTY: 200
      SUSPENSION_THRESHOLD: 600
    precision: "integer points"

  - name: interpreter_dispatch_selection
    trigger: "InterpretationRequest creation (NEW -> ASSIGNED | UNFULFILLED)"
    algorithm: constraint_propagation
    formula: |
      Candidate pool = interpreters I where ALL of:
        (a) I.status == ACTIVE
        (b) I.confidentiality_signed_at != null AND I.confidentiality_signed_at >= now - 365 days
        (c) request.language_code in I.language_codes
        (d) request.modality in I.modalities
        (e) tier rule: encounter_setting in {COURT, MEDICAL} -> I.tier == CERTIFIED; GENERAL -> any tier
        (f) if modality == IN_PERSON: no buffered overlap — for every ASSIGNED IN_PERSON request S of I,
            NOT (new_start < S.end + 30 min AND S.start - 30 min < new_end)
            where S.start/S.end come from S.scheduled_start + S.scheduled_duration_minutes
        (g) I.vendor_contract.status == ACTIVE AND contract.available_cents >= estimated cost computed
            against I's contract rate card (estimated variant of interpretation_cost)
      Ranking: minutes_current_month ASC, then I.created_at ASC, then full_name ASC.
      Empty pool -> request lands UNFULFILLED (no error; 201 with status UNFULFILLED).
    input_set: "All Interpreter records; per-candidate contract state"
    constants:
      IN_PERSON_BUFFER_MIN: 30
      CONFIDENTIALITY_TTL_DAYS: 365
    precision: "n/a (selection)"

  - name: vendor_contract_commitment
    trigger: "Any job/request lifecycle event touching the contract (create, approve, cancel, dispatch, complete, refund, exhaustion cascade)"
    algorithm: aggregation
    formula: |
      committed_cents = SUM(provisional_cost_cents of TranslationJobs on contract with status in {QUEUED, IN_TRANSLATION, QUALITY_REVIEW})
                      + SUM(estimated_cost_cents of InterpretationRequests with status ASSIGNED whose interpreter.vendor_contract_id == contract)
      spent_cents     = SUM(final_cost_cents of APPROVED jobs) + SUM(final_cost_cents of COMPLETED requests with refund_clawed_back == false)
      available_cents = ceiling_cents - spent_cents - committed_cents
      Hard gate at commitment time (job creation; dispatch eligibility (g)): committed + spent + new_commitment <= ceiling_cents,
      equality allowed (else ERR_CONTRACT_CEILING_EXCEEDED for jobs; candidate excluded at dispatch for requests).
    input_set: "All TranslationJobs and InterpretationRequests billed to the contract in the states listed"
    constants:
      EXHAUSTION_PCT: 0.9
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for the operation; ownership scope: DepartmentLiaison's X-User-ID must equal the department_id being acted on; Interpreter may complete/submit only own assignments; PATCH /interpreters status field restricted to ComplianceOfficer"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request shape: required fields present, types match, enum values valid, numeric ranges valid (counts >= 0, population/encounters/word_count/minutes > 0, period_start < period_end), no computed/system fields accepted as input"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Referenced resources exist: path ids left-to-right, then body FK ids (department_id, document_id, vendor_contract_id, translator_id, interpretation_request_id); entity_backed role callers (Interpreter, QualityReviewer) must resolve their X-User-ID to an Interpreter"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_DEPARTMENT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_JOB_NOT_FOUND, ERR_INTERPRETER_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_PLAN_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: state
    check: "Target entity in a valid from-state for the transition; document must be ACTIVE for new jobs (ERR_DOCUMENT_RETIRED); contract must be ACTIVE for new jobs (ERR_CONTRACT_NOT_ACTIVE)"
    error_id: "ERR_INVALID_TRANSITION | ERR_DOCUMENT_RETIRED | ERR_CONTRACT_NOT_ACTIVE"
    http_status: 409
    applies_to: "state transition endpoints; POST /translation-jobs"
  - priority: 6
    category: business_safety
    check: "Compliance gates in order: department posture != NONCOMPLIANT for new jobs/requests (ERR_DEPARTMENT_NONCOMPLIANT); interpreter ACTIVE for assign (ERR_INTERPRETER_SUSPENDED); confidentiality current (ERR_CONFIDENTIALITY_NOT_CURRENT); translator tier REGISTERED+ (ERR_TRANSLATOR_TIER_INSUFFICIENT) / reviewer tier CERTIFIED (ERR_REVIEWER_TIER_INSUFFICIENT); segregation of duties (ERR_SEGREGATION_OF_DUTIES_VIOLATION); COURT requires IN_PERSON (ERR_SETTING_REQUIRES_IN_PERSON); plan publish coverage (ERR_MISSING_CERTIFIED_ASSESSMENTS)"
    error_id: "ERR_DEPARTMENT_NONCOMPLIANT | ERR_INTERPRETER_SUSPENDED | ERR_CONFIDENTIALITY_NOT_CURRENT | ERR_TRANSLATOR_TIER_INSUFFICIENT | ERR_REVIEWER_TIER_INSUFFICIENT | ERR_SEGREGATION_OF_DUTIES_VIOLATION | ERR_SETTING_REQUIRES_IN_PERSON | ERR_MISSING_CERTIFIED_ASSESSMENTS"
    http_status: 409
    applies_to: "POST /translation-jobs, POST /translation-jobs/{id}/assign, POST /translation-jobs/{id}/review, POST /interpretation-requests, POST /complaints/{id}/adjudicate, POST /language-access-plans/{id}/publish"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: scheduled_start not in the past (ERR_SCHEDULE_IN_PAST); IN_PERSON lead time >= 2h (ERR_LEAD_TIME_INSUFFICIENT); assessment coverage window for same (department_id, language_code) must not overlap an existing window — half-open [period_start, period_end), adjacency allowed (ERR_ASSESSMENT_PERIOD_OVERLAP)"
    error_id: "ERR_SCHEDULE_IN_PAST | ERR_LEAD_TIME_INSUFFICIENT | ERR_ASSESSMENT_PERIOD_OVERLAP"
    http_status: 422
    applies_to: "POST /interpretation-requests, POST /language-assessments"
  - priority: 8
    category: business_constraint
    check: "Uniqueness: at most one LanguageAccessPlan per plan_year among status DRAFT/PUBLISHED"
    error_id: ERR_PLAN_YEAR_CONFLICT
    http_status: 409
    applies_to: "POST /language-access-plans"
  - priority: 9
    category: business_fiscal
    check: "Fiscal gates (checked last): contract ceiling room for new job provisional (ERR_CONTRACT_CEILING_EXCEEDED, equality allowed); department remaining_cents >= estimated request cost (ERR_DEPARTMENT_BUDGET_EXCEEDED, equality allowed); PATCH annual_budget_cents >= spent_cents (ERR_VALIDATION)"
    error_id: "ERR_CONTRACT_CEILING_EXCEEDED | ERR_DEPARTMENT_BUDGET_EXCEEDED | ERR_VALIDATION"
    http_status: 402
    applies_to: "POST /translation-jobs, POST /interpretation-requests, PATCH /departments/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601). Startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. All time-dependent rules (confidentiality TTL, lead time, past-start, remediation windows, monthly minutes) read this clock."
    roles: [LanguageAccessCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Department ---
  - method: POST
    path: "/departments"
    description: "Create a department"
    roles: [LanguageAccessCoordinator]
    code: 201
    input: [name, service_area_code, annual_budget_cents, "signage_status?"]
    output: Department
    side_effects: ["spent_cents=0, compliance_score=1000, posture=GOOD_STANDING, signage_status defaults CURRENT"]

  - method: GET
    path: "/departments"
    description: "List departments (paginated)"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Department[]"
    side_effects: []

  - method: GET
    path: "/departments/{id}"
    description: "Get one department"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Department
    side_effects: []

  - method: PATCH
    path: "/departments/{id}"
    description: "Update department profile/budget/signage; OCC-guarded"
    roles: [LanguageAccessCoordinator]
    code: 200
    input: ["name?", "service_area_code?", "annual_budget_cents?", "signage_status?", expected_department_version]
    output: Department
    side_effects:
      - "Reject with ERR_STALE_VERSION (412) when expected_department_version != department.version"
      - "increments Department.version by 1"
      - "annual_budget_cents must be >= spent_cents (ERR_VALIDATION)"

  # --- LanguageAssessment ---
  - method: POST
    path: "/language-assessments"
    description: "Create a language need assessment (both threshold variants computed)"
    roles: [DepartmentLiaison]
    code: 201
    input: [department_id, language_code, plan_year, period_start, period_end, lep_speaker_count, service_area_population, encounter_count, total_encounters]
    output: LanguageAssessment
    side_effects: ["status=DRAFT; lep_share/encounter_share/threshold_language_safe/priority_language computed; created_by_user_id stamped; overlap window check (ERR_ASSESSMENT_PERIOD_OVERLAP)"]

  - method: GET
    path: "/language-assessments"
    description: "List assessments with filters"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: ["department_id?", "plan_year?", "status?", "limit?", "offset?"]
    output: "LanguageAssessment[]"
    side_effects: []

  - method: GET
    path: "/language-assessments/{id}"
    description: "Get one assessment"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: LanguageAssessment
    side_effects: []

  - method: POST
    path: "/language-assessments/{id}/review"
    description: "Certify or reject a DRAFT assessment"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "rejection_note?"]
    output: LanguageAssessment
    side_effects: ["decision=CERTIFY -> CERTIFIED; decision=REJECT requires rejection_note -> REJECTED; reviewed_by_user_id stamped"]

  # --- VitalDocument ---
  - method: POST
    path: "/vital-documents"
    description: "Register a vital document"
    roles: [LanguageAccessCoordinator]
    code: 201
    input: [department_id, title, document_type, "base_language?"]
    output: VitalDocument
    side_effects: ["status=ACTIVE; translated_language_codes=[]"]

  - method: GET
    path: "/vital-documents"
    description: "List vital documents"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: ["department_id?", "status?", "limit?", "offset?"]
    output: "VitalDocument[]"
    side_effects: []

  - method: GET
    path: "/vital-documents/{id}"
    description: "Get one vital document"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: VitalDocument
    side_effects: []

  - method: POST
    path: "/vital-documents/{id}/retire"
    description: "Retire a document; cancels its non-terminal jobs and releases their commitments"
    roles: [LanguageAccessCoordinator]
    code: 200
    input: []
    output: VitalDocument
    side_effects: ["status -> RETIRED; jobs in {QUEUED, IN_TRANSLATION, QUALITY_REVIEW} -> CANCELLED with committed_cents release"]

  # --- TranslationJob ---
  - method: POST
    path: "/translation-jobs"
    description: "Queue a translation job; computes and commits provisional cost"
    roles: [LanguageAccessCoordinator]
    code: 201
    input: [document_id, vendor_contract_id, target_language_code, word_count, "rush?"]
    output: TranslationJob
    side_effects: ["status=QUEUED; provisional_cost_cents = word_count * contract.translation_per_word_cents; vendor_contract.committed_cents += provisional_cost_cents"]

  - method: GET
    path: "/translation-jobs"
    description: "List translation jobs with filters"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: ["document_id?", "vendor_contract_id?", "translator_id?", "reviewer_id?", "superseded_by_job_id?", "status?", "limit?", "offset?"]
    output: "TranslationJob[]"
    side_effects: []

  - method: GET
    path: "/translation-jobs/{id}"
    description: "Get one translation job"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: TranslationJob
    side_effects: []

  - method: POST
    path: "/translation-jobs/{id}/assign"
    description: "Assign a translator (QUEUED -> IN_TRANSLATION)"
    roles: [LanguageAccessCoordinator]
    code: 200
    input: [translator_id]
    output: TranslationJob
    side_effects: ["translator_id set; status -> IN_TRANSLATION"]

  - method: POST
    path: "/translation-jobs/{id}/submit-translation"
    description: "Translator submits work (IN_TRANSLATION -> QUALITY_REVIEW)"
    roles: [Interpreter]
    code: 200
    input: [submitted_word_count]
    output: TranslationJob
    side_effects: ["status -> QUALITY_REVIEW; submitted_word_count recorded"]

  - method: POST
    path: "/translation-jobs/{id}/review"
    description: "Quality review: APPROVE computes final cost and settles ledgers; REQUEST_REVISION loops back to IN_TRANSLATION"
    roles: [QualityReviewer]
    code: 200
    input: [decision]
    output: TranslationJob
    side_effects: ["APPROVE: final_cost_cents computed; committed -= provisional, spent += final; supersede prior APPROVED job for same (document, language); department.spent_cents += final; possible contract EXHAUSTED cascade", "REQUEST_REVISION: revision_count += 1; status -> IN_TRANSLATION"]

  - method: POST
    path: "/translation-jobs/{id}/cancel"
    description: "Cancel a non-terminal job; releases provisional commitment"
    roles: [LanguageAccessCoordinator]
    code: 200
    input: []
    output: TranslationJob
    side_effects: ["status -> CANCELLED; vendor_contract.committed_cents -= provisional_cost_cents"]

  # --- Interpreter ---
  - method: POST
    path: "/interpreters"
    description: "Add an interpreter to the roster"
    roles: [LanguageAccessCoordinator]
    code: 201
    input: [full_name, language_codes, modalities, tier, vendor_contract_id]
    output: Interpreter
    side_effects: ["status=ACTIVE; quality_rating=1000; confidentiality_signed_at=null"]

  - method: GET
    path: "/interpreters"
    description: "List interpreters with filters"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: ["vendor_contract_id?", "language_code?", "modality?", "tier?", "status?", "limit?", "offset?"]
    output: "Interpreter[]"
    side_effects: []

  - method: GET
    path: "/interpreters/{id}"
    description: "Get one interpreter"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Interpreter
    side_effects: []

  - method: PATCH
    path: "/interpreters/{id}"
    description: "Update qualifications (Coordinator) or status (ComplianceOfficer); confidentiality_signed=true stamps signed_at=now"
    roles: [LanguageAccessCoordinator, ComplianceOfficer]
    code: 200
    input: ["full_name?", "language_codes?", "modalities?", "tier?", "confidentiality_signed?", "status?"]
    output: Interpreter
    side_effects: ["confidentiality_signed=true -> confidentiality_signed_at := now (only true accepted, else ERR_VALIDATION)", "status transitions follow the Interpreter state machine (ACTIVE<->SUSPENDED); reinstatement sets quality_rating := 600"]

  # --- InterpretationRequest ---
  - method: POST
    path: "/interpretation-requests"
    description: "Create an on-demand request; synchronously runs the dispatch selector"
    roles: [DepartmentLiaison]
    code: 201
    input: [department_id, language_code, modality, encounter_setting, "scheduled_start?", scheduled_duration_minutes]
    output: InterpretationRequest
    side_effects: ["Eligible pool non-empty -> ASSIGNED: interpreter_id set, estimated_cost_cents computed and committed to the interpreter's contract", "Empty pool -> UNFULFILLED and department compliance -50 event"]

  - method: GET
    path: "/interpretation-requests"
    description: "List requests with filters"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: ["department_id?", "interpreter_id?", "status?", "limit?", "offset?"]
    output: "InterpretationRequest[]"
    side_effects: []

  - method: GET
    path: "/interpretation-requests/{id}"
    description: "Get one request"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: InterpretationRequest
    side_effects: []

  - method: POST
    path: "/interpretation-requests/{id}/complete"
    description: "Assigned interpreter completes the session with actual minutes; settles final cost"
    roles: [Interpreter]
    code: 200
    input: [actual_minutes]
    output: InterpretationRequest
    side_effects: ["status -> COMPLETED; final_cost_cents computed; committed -= estimated, spent += final; department.spent_cents += final; interpreter quality +5"]

  - method: POST
    path: "/interpretation-requests/{id}/cancel"
    description: "Cancel an ASSIGNED request; releases the commitment"
    roles: [DepartmentLiaison, LanguageAccessCoordinator]
    code: 200
    input: []
    output: InterpretationRequest
    side_effects: ["status -> CANCELLED; vendor_contract.committed_cents -= estimated_cost_cents"]

  # --- Complaint ---
  - method: POST
    path: "/complaints"
    description: "Intake a language-access complaint"
    roles: [DepartmentLiaison, ComplianceOfficer]
    code: 201
    input: [department_id, "interpretation_request_id?", category, description]
    output: Complaint
    side_effects: ["status=RECEIVED; recorded_by_user_id stamped from caller"]

  - method: GET
    path: "/complaints"
    description: "List complaints with filters"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: ["department_id?", "interpretation_request_id?", "status?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/complaints/{id}"
    description: "Get one complaint"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{id}/adjudicate"
    description: "Substantiate or dismiss a RECEIVED complaint; substantiation cascades into scores, ratings, suspensions, signage and optional REFUND"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "remedy?"]
    output: Complaint
    side_effects: ["SUBSTANTIATED: -150 dept compliance, signage DEFICIENT when NOTICE_MISSING, -200 linked interpreter rating (possible auto-suspension cascade), remedy REFUND claws back request cost/minutes; remediation_due_at = now + 30 days", "DISMISSED: terminal, no side effects"]

  - method: POST
    path: "/complaints/{id}/close"
    description: "Close a SUBSTANTIATED complaint; on-time close restores +100 compliance"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: Complaint
    side_effects: ["status -> RESOLVED; closed_at := now; +100 compliance event when closed_at <= remediation_due_at"]

  # --- VendorContract ---
  - method: POST
    path: "/vendor-contracts"
    description: "Create a vendor contract with rate card"
    roles: [LanguageAccessCoordinator]
    code: 201
    input: [vendor_name, ceiling_cents, phone_per_minute_cents, video_per_minute_cents, in_person_per_minute_cents, translation_per_word_cents, in_person_travel_flat_cents]
    output: VendorContract
    side_effects: ["status=DRAFT; committed_cents=0; spent_cents=0"]

  - method: GET
    path: "/vendor-contracts/{id}"
    description: "Get one vendor contract"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: VendorContract
    side_effects: []

  - method: POST
    path: "/vendor-contracts/{id}/activate"
    description: "Activate a DRAFT contract"
    roles: [LanguageAccessCoordinator]
    code: 200
    input: []
    output: VendorContract
    side_effects: ["status -> ACTIVE"]

  # --- LanguageAccessPlan ---
  - method: POST
    path: "/language-access-plans"
    description: "Create a draft annual language access plan"
    roles: [LanguageAccessCoordinator]
    code: 201
    input: [plan_year, "summary?"]
    output: LanguageAccessPlan
    side_effects: ["status=DRAFT; plan_year uniqueness among DRAFT/PUBLISHED enforced (ERR_PLAN_YEAR_CONFLICT)"]

  - method: GET
    path: "/language-access-plans/{id}"
    description: "Get one plan"
    roles: [LanguageAccessCoordinator, DepartmentLiaison, Interpreter, QualityReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: LanguageAccessPlan
    side_effects: []

  - method: POST
    path: "/language-access-plans/{id}/publish"
    description: "Publish a plan; requires certified assessments for every department for the plan year; supersedes the previously published plan"
    roles: [LanguageAccessCoordinator]
    code: 200
    input: []
    output: LanguageAccessPlan
    side_effects: ["status -> PUBLISHED; published_at := now; prior PUBLISHED plan -> SUPERSEDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation, or entity-backed ownership check failed (liaison acting on another department; interpreter acting on another's assignment; coordinator passing interpreter status)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid type/enum/range, computed or system field supplied as input, REJECT without rejection_note, REFUND without a linked COMPLETED request, confidentiality_signed=false, PATCH budget below spent" }
  - { id: ERR_DEPARTMENT_NOT_FOUND, http: 404, condition: "Department id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "LanguageAssessment id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "VitalDocument id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "TranslationJob id does not exist" }
  - { id: ERR_INTERPRETER_NOT_FOUND, http: 404, condition: "Interpreter id does not exist (including entity-backed caller resolution)" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "InterpretationRequest id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "VendorContract id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Complaint id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "LanguageAccessPlan id does not exist" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Target entity not in a valid from-state for the requested transition (terminal states reject everything)" }
  - { id: ERR_DOCUMENT_RETIRED, http: 409, condition: "POST /translation-jobs against a RETIRED document" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "POST /translation-jobs against a contract not in ACTIVE status" }
  - { id: ERR_DEPARTMENT_NONCOMPLIANT, http: 409, condition: "Department posture == NONCOMPLIANT blocks new translation jobs and interpretation requests" }
  - { id: ERR_PLAN_YEAR_CONFLICT, http: 409, condition: "A DRAFT or PUBLISHED plan already exists for this plan_year" }
  - { id: ERR_MISSING_CERTIFIED_ASSESSMENTS, http: 409, condition: "Publish requires every department to have >= 1 CERTIFIED assessment for the plan year" }
  - { id: ERR_INTERPRETER_SUSPENDED, http: 409, condition: "Assign requires an ACTIVE interpreter" }
  - { id: ERR_ASSESSMENT_PERIOD_OVERLAP, http: 409, condition: "Assessment coverage window overlaps an existing window for the same (department_id, language_code); half-open adjacency allowed" }
  - { id: ERR_CONFIDENTIALITY_NOT_CURRENT, http: 409, condition: "Interpreter confidentiality agreement unsigned or signed more than 365 days ago" }
  - { id: ERR_SETTING_REQUIRES_IN_PERSON, http: 422, condition: "COURT encounter_setting requires modality IN_PERSON" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Reviewer is the job's translator, or adjudicator is the complaint's recorder" }
  - { id: ERR_TRANSLATOR_TIER_INSUFFICIENT, http: 422, condition: "Translation assign requires tier REGISTERED or CERTIFIED" }
  - { id: ERR_REVIEWER_TIER_INSUFFICIENT, http: 422, condition: "Quality review requires a CERTIFIED reviewer" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "scheduled_start before current logical time" }
  - { id: ERR_LEAD_TIME_INSUFFICIENT, http: 422, condition: "IN_PERSON request scheduled less than 2 hours ahead" }
  - { id: ERR_CONTRACT_CEILING_EXCEEDED, http: 402, condition: "New provisional commitment would push committed + spent above ceiling_cents (equality allowed)" }
  - { id: ERR_DEPARTMENT_BUDGET_EXCEEDED, http: 402, condition: "Estimated request cost exceeds department remaining_cents (equality allowed)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_department_version does not match the department's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LanguageAccessCoordinator
    description: "City language access office operator: departments, documents, translation queue, interpreter roster, vendor contracts, annual plans, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /departments, PATCH /departments/{id}"
      - "POST /vital-documents, POST /vital-documents/{id}/retire"
      - "POST /translation-jobs, POST /translation-jobs/{id}/assign, POST /translation-jobs/{id}/cancel"
      - "POST /interpreters"
      - "POST /vendor-contracts, POST /vendor-contracts/{id}/activate"
      - "POST /language-access-plans, POST /language-access-plans/{id}/publish"
    shared_operations:
      - "PATCH /interpreters/{id} (qualification fields only; status is ComplianceOfficer-only)"
      - "POST /interpretation-requests/{id}/cancel (with DepartmentLiaison)"
      - "All GET endpoints"

  - name: DepartmentLiaison
    description: "Department-side requester; X-User-ID equals the Department id they represent"
    identity: "entity_backed:Department"
    exclusive_operations:
      - "POST /language-assessments (own department)"
      - "POST /interpretation-requests (own department)"
    shared_operations:
      - "POST /complaints (with ComplianceOfficer; own department for liaison)"
      - "POST /interpretation-requests/{id}/cancel (own department)"
      - "All GET endpoints"

  - name: Interpreter
    description: "Rostered interpreter performing translation and interpretation work; X-User-ID equals the Interpreter id"
    identity: "entity_backed:Interpreter"
    exclusive_operations:
      - "POST /translation-jobs/{id}/submit-translation (must be the assigned translator)"
      - "POST /interpretation-requests/{id}/complete (must be the assigned interpreter)"
    shared_operations:
      - "All GET endpoints"

  - name: QualityReviewer
    description: "CERTIFIED interpreter performing translation QA; X-User-ID equals the Interpreter id; must not review own translations"
    identity: "entity_backed:Interpreter"
    exclusive_operations:
      - "POST /translation-jobs/{id}/review"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Oversight role: certifies assessments, adjudicates and closes complaints, suspends/reinstates interpreters; may also intake complaints (intake desk) but cannot adjudicate complaints it recorded"
    identity: opaque
    exclusive_operations:
      - "POST /language-assessments/{id}/review"
      - "POST /complaints/{id}/adjudicate"
      - "POST /complaints/{id}/close"
    shared_operations:
      - "PATCH /interpreters/{id} (including status transitions)"
      - "POST /complaints (intake desk)"
      - "All GET endpoints"
