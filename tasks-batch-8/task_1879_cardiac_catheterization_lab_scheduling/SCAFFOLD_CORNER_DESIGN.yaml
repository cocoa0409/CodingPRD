              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
          trigger:
            - call: "PATCH /cath-lab/rooms/${room1_id}"
              payload: { status: OUT_OF_SERVICE }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
            - call: "POST /cath-lab/cases/${case_id}/cancel"
              as: CathLabScheduler
            - call: "PATCH /cath-lab/rooms/${room1_id}"
              payload: { status: OUT_OF_SERVICE }
              as: CathLabScheduler
              captures: { st: $.data.status }
          assert:
            - "While case SCHEDULED: HTTP 409 ERR_RESOURCE_IN_USE"
            - "After cancel: PATCH succeeds with status == OUT_OF_SERVICE"

      - name: reserved_bed_cannot_go_out_of_service
        claim_type: precondition_enforcement
        grounds: ["state_machines.RecoveryBed", "errors[ERR_RESOURCE_IN_USE]"]
        distinguishing_aspect: "A RESERVED bed (holding a scheduled case) rejects PATCH to OUT_OF_SERVICE with ERR_RESOURCE_IN_USE."
