  - rule_id: resource_temporal_overlap
    instances:
      - name: forming_machine_half_open_windows_plus_changeover_buffer
        grounds:
          - validations.priority_35
          - errors.ERR_MACHINE_WINDOW_CONFLICT
          - entities.FormingMachine.fields.changeover_buffer_minutes
          - entities.ProductionJob.fields.window_start_at
        distinguishing_aspect: |
          The forming machine is the contended resource and its job windows are HALF-OPEN [start,end)
          extended by changeover_buffer_minutes on the earlier job's end. A job starting exactly at
