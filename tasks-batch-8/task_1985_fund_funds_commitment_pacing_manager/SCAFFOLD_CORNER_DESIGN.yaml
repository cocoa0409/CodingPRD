scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_returns_201_with_computed_defaults
        claim_type: creation
        grounds: [entities.FoFProgram, "endpoints: POST /fof/programs"]
        distinguishing_aspect: "Create returns 201; aggregates start at 0; status DRAFT; posture computed (RESTRICTED because cash 0 < 1.10 * buffer)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fof/programs"
              payload: { program_name: "PC", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id, st: $.data.status, posture: $.data.posture, cash: $.data.unrestricted_cash, ver: $.data.version }
          assert:
            - "st == DRAFT"
            - "cash == 0"
            - "posture == RESTRICTED (0 < 1.10 * 1000000)"
            - "ver == 1"
            - "committed_total, deployed_total, returned_total, unfunded_total all == 0"

      - name: program_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.FoFProgram, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting total_nav_budget -> ERR_INVALID_REQUEST (400); same for invalid base_currency enum."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fof/programs"
              payload: { program_name: "PC2", base_currency: "USD", strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: manager_legal_name_globally_unique
        claim_type: type_constraints
        grounds: [entities.Manager.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Second manager with the same legal_name is rejected; different name succeeds."
        test_recipe:
          setup: ["one manager 'DupCap' exists"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ana C1", staff_role: "ANALYST", email: "anac1@x.com" }
              as: CIO
              captures: { ana: $.data.id }
            - call: "POST /fof/managers"
              payload: { legal_name: "DupCap", domicile_country: "US", relationship_since_year: 2010 }
              as: Analyst
              as_user_id: "${ana}"
          trigger:
            - call: "POST /fof/managers"
              payload: { legal_name: "DupCap", domicile_country: "GB", relationship_since_year: 2012 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID -> ERR_NOT_FOUND (404), applied to a nested path and a flat path."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /fof/programs"
              payload: { program_name: "PNF", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /fof/programs/${prog}/commitments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CIO
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: immutable_ledger_entry_has_no_update_or_version
        claim_type: immutability
        grounds: [entities.CashLedgerEntry]
        distinguishing_aspect: "CashLedgerEntry is append-only (common_fields: false): no PUT/PATCH/DELETE endpoint exists for it and the row exposes id + created_at only (no version)."
        test_recipe:
          setup: ["one program with one CONTRIBUTION entry"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops C2", staff_role: "OPS_ANALYST", email: "opsc2@x.com" }
              as: CIO
              captures: { ops: $.data.id }
            - call: "POST /fof/programs"
              payload: { program_name: "PIM", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id }
            - call: "POST /fof/programs/${prog}/ledger-entries"
              payload: { entry_kind: "CONTRIBUTION", amount: 5000000 }
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { entry: $.data.id }
          trigger:
            - call: "GET /fof/programs/${prog}/ledger-entries"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
          assert:
            - "entry row has no version field"
            - "entry row has balance_after == 5000000.00"
            - "entry row has entry_kind == CONTRIBUTION and ref_id == null"

      - name: system_fields_client_input_ignored
        claim_type: system_fields
        grounds: [entities.FoFProgram]
        distinguishing_aspect: "Client-supplied unrestricted_cash / posture / status in the create body are ignored (system/computed fields); server values win."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /fof/programs"
              payload: { program_name: "PSF", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10, unrestricted_cash: 999999999, posture: "NORMAL", status: "OPEN" }
              as: CIO
              captures: { cash: $.data.unrestricted_cash, st: $.data.status }
          assert:
            - "cash == 0 (client input ignored)"
            - "st == DRAFT (client input ignored)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_terminal_close_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.FoFProgram, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From CLOSED no further transitions: suspend/resume/open all fail with ERR_INVALID_STATE or ERR_POSTURE_GATED (posture FROZEN gates first at priority 8 -> ERR_POSTURE_GATED for mutating program writes; lifecycle actions are state transitions -> ERR_INVALID_STATE at priority 7 vs posture at 8 — state precondition priority 7 wins for status-transition endpoints)."
        test_recipe:
          setup: ["Program created, contributed, opened, then closed (no live commitments/calls/bids)"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops C3", staff_role: "OPS_ANALYST", email: "opsc3@x.com" }
              as: CIO
              captures: { ops: $.data.id }
            - call: "POST /fof/programs"
              payload: { program_name: "PCL", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id }
            - call: "POST /fof/programs/${prog}/ledger-entries"
              payload: { entry_kind: "CONTRIBUTION", amount: 5000000 }
              as: OperationsAnalyst
              as_user_id: "${ops}"
            - call: "POST /fof/programs/${prog}/open"
              payload: {}
              as: CIO
            - call: "POST /fof/programs/${prog}/close"
              payload: {}
              as: CIO
          trigger:
            - call: "POST /fof/programs/${prog}/resume"
              payload: {}
              as: CIO
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (CLOSED is terminal; resume is not a declared transition from CLOSED)"
            - "FoFProgram.${prog}.status == CLOSED and posture == FROZEN"

      - name: dd_review_invalid_from_withdrawn
        claim_type: invalid_transition
        grounds: [state_machines.DueDiligenceReview, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A WITHDRAWN review rejects submit/complete/request-info — terminal lockdown on the review machine."
        test_recipe:
          setup: ["Vehicle IN_DILIGENCE with review R withdrawn"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ana C4", staff_role: "ANALYST", email: "anac4@x.com" }
              as: CIO
              captures: { ana: $.data.id }
            - call: "POST /fof/managers"
              payload: { legal_name: "TauCap", domicile_country: "US", relationship_since_year: 2016 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { mgr: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles"
              payload: { fund_name: "Tau I", strategy: "GROWTH", vintage_year: 2026, fund_size_target: 200000000, mgmt_fee_rate_early: 0.02, mgmt_fee_rate_late: 0.01, investment_period_years: 5, carry_rate: 0.20, hurdle_rate: 0.08 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { veh: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles/${veh}/begin-diligence"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
            - call: "GET /fof/vehicles/${veh}/dd-reviews"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
              captures: { rev: "$.data[0].id" }
            - call: "POST /fof/vehicles/${veh}/dd-reviews/${rev}/withdraw"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
          trigger:
            - call: "POST /fof/vehicles/${veh}/dd-reviews/${rev}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "DueDiligenceReview.${rev}.status == WITHDRAWN"

      - name: call_cancel_after_due_date_rejected
        claim_type: violation_to_error
        grounds: [state_machines.CapitalCall.ISSUED_to_CANCELLED, "validations[priority=23]", "errors[ERR_CALL_OVERDUE]"]
        distinguishing_aspect: "Cancel at or before due_date succeeds; after due_date -> ERR_CALL_OVERDUE (boundary: exactly at due_date is allowed)."
        test_recipe:
          setup: ["Program open; EXECUTED commitment with ISSUED call due 2026-08-10; clock advanced to 2026-08-11"]
