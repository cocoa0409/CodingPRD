  # ===========================================================================
  # Validations (guide Table 4)
  # ===========================================================================
  - section: validations
    instances:

      - name: violation_to_error_membership_admission_gate_rejects_four_distinct_ways
        claim_type: violation_to_error
        grounds:
          - validations[priority=68]
          - validations[priority=71]
          - validations[priority=72]
          - validations[priority=65]
          - validations[priority=66]
          - endpoints[POST /swim-club/memberships]
        distinguishing_aspect: |
          POST /swim-club/memberships is guarded by four business rules that a single "is this
          household allowed in" check would collapse into one, and each of the four is triggered here
          with the other three satisfied. The category-mismatch case is the subtle one: it can only
          be reached by asking for a WAITLIST-OPTIONAL category while holding an ACCEPTED entry for a
          different one, because a waitlist-required target would be caught by priority 71 first.
        test_recipe:
          setup:
            - "Two categories: FAMILY (waitlist_required true, max_household_size 6, bond 120000) and COUPLE (waitlist_required false, max_household_size 4, bond 0)."
            - "One OPEN 2027 season."
            - "Household BIG has member_count 8, above both category limits. Household A has member_count 4, inside both."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: true, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { fam_id: $.data.id }
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cou_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Oversized Household", address_line: "171 Cedar Court", residency: "IN_DISTRICT", member_count: 8, prior_member: false }
              as: MembershipChair
              captures: { h_big_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Admissible Household", address_line: "172 Cedar Court", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
          trigger:
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_big_id}", membership_category_id: "${fam_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { err_size_membership: $.data.error_id }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_big_id}", membership_category_id: "${fam_id}", priority_tier: "STANDARD" }
              as: MembershipChair
              captures: { err_size_waitlist: $.data.error_id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${fam_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { err_no_offer: $.data.error_id }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_a_id}", membership_category_id: "${fam_id}", priority_tier: "STANDARD" }
              as: MembershipChair
              captures: { e_a_id: $.data.id, e_a_status_0: $.data.status }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_a_id}", membership_category_id: "${fam_id}", priority_tier: "LEGACY" }
              as: MembershipChair
              captures: { err_dup_entry_waiting: $.data.error_id }
            - call: "POST /swim-club/waitlist-entries/next-offer"
              payload: { membership_category_id: "${fam_id}" }
              as: MembershipChair
              captures: { offered_id: $.data.id, e_a_status_1: $.data.status }
            - call: "POST /swim-club/waitlist-entries/${e_a_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Member
              as_user_id: "${h_a_id}"
              captures: { e_a_status_2: $.data.status }
            - call: "POST /swim-club/waitlist-entries"
              payload: { household_id: "${h_a_id}", membership_category_id: "${fam_id}", priority_tier: "STANDARD" }
              as: MembershipChair
              captures: { err_dup_entry_accepted: $.data.error_id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cou_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { err_category_mismatch: $.data.error_id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${fam_id}", season_id: "${s27_id}", join_date: "2027-06-01", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_a_id: $.data.id, m_a_dues: $.data.dues_status, m_a_access: $.data.access_status }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${fam_id}", season_id: "${s27_id}", join_date: "2027-06-02", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { err_dup_membership: $.data.error_id }
            - call: "GET /swim-club/memberships"
              payload: { household_id: "${h_a_id}", season_id: "${s27_id}" }
              as: MembershipChair
              captures: { m_list: $.data }
          assert:
            - "${err_size_membership} == ERR_HOUSEHOLD_SIZE_EXCEEDED with HTTP 422: 8 > 6, and this outranks priority 71 even though household BIG holds no offer either"
            - "${err_size_waitlist} == ERR_HOUSEHOLD_SIZE_EXCEEDED: the same rule guards the waitlist endpoint, so an inadmissible household cannot even queue"
            - "${err_no_offer} == ERR_WAITLIST_OFFER_REQUIRED with HTTP 409: household A fits the category but holds no ACCEPTED entry for it"
            - "${e_a_status_0} == WAITING and ${err_dup_entry_waiting} == ERR_DUPLICATE_WAITLIST_ENTRY: a second entry is refused while the first is WAITING, and the differing priority_tier does not make it a distinct entry"
            - "${offered_id} == ${e_a_id} with ${e_a_status_1} == OFFERED, then ${e_a_status_2} == ACCEPTED"
            - "${err_dup_entry_accepted} == ERR_DUPLICATE_WAITLIST_ENTRY: ACCEPTED also blocks a new entry, so the guarded set is {WAITING, OFFERED, ACCEPTED}"
            - "${err_category_mismatch} == ERR_CATEGORY_MISMATCH with HTTP 422: COUPLE is waitlist-optional so priority 71 is silent, but the household is holding an ACCEPTED FAMILY entry and the request names a different category"
            - "the COUPLE attempt is NOT ERR_HOUSEHOLD_SIZE_EXCEEDED: member_count 4 == max_household_size 4 and the comparison is <=, so the size rule passes at its boundary"
            - "the FAMILY membership is created HTTP 201 with ${m_a_dues} == UNBILLED and ${m_a_access} == PENDING, proving the accepted offer discharged priority 71"
            - "${err_dup_membership} == ERR_DUPLICATE_MEMBERSHIP with HTTP 409: the household already holds a 2027 membership whose access_status is outside {LAPSED, TERMINATED}"
            - "${m_list} contains exactly one membership, so none of the four refusals created a row"

      - name: violation_to_error_the_selector_skips_a_suspended_household_and_finds_nothing
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
          - validations[priority=45]
          - calculations.waitlist_offer_selection.input_set
          - endpoints[POST /swim-club/waitlist-entries/next-offer]
        distinguishing_aspect: |
          ERR_WAITLIST_EMPTY is not the same as "no rows exist": the queue holds exactly one WAITING
          entry, and the selector must still report emptiness because the entry's household is no
          longer in GOOD_STANDING. The suspension arrives AFTER the entry was legally created, so the
          filter has to be applied at selection time rather than at insertion time. The same
          suspension then blocks a fresh entry with a different code, which fixes the boundary
          between the two rules.
        test_recipe:
          setup:
            - "One FAMILY category (waitlist_required true) and one household S with a legally created WAITING entry."
            - "The household is then suspended by a SEVERE conduct case sanctioned as SUSPENSION, reported by pm-001 and decided by bp-001."
            - "No other household holds an entry in this category, so the queue's only candidate is the suspended one."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
