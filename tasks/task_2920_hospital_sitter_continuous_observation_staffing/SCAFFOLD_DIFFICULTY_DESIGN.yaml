            - call: "POST /observation/orders"
              payload: { patient_id: "${q3}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "ELOPEMENT"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Remote combined watch three" }
              as: AttendingProvider
