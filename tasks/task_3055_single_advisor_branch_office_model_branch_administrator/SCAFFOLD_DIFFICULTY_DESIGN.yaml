            - "MilestoneEvaluation B outcome == FAIL (production 9999 < goal 10000)"
      - name: service_tier_score_boundary_900_vs_901
        grounds:
          - calculations.service_tier_assignment
          - entities.Branch.fields.service_tier
        distinguishing_aspect: |
          Metric: tier_score vs TIER_2 inclusive ceiling 900. Distinct
          endpoint: PATCH branches. score == 900 keeps TIER_2; score == 901
          flips to TIER_3 — a one-dollar AUM difference across the floor-
          division boundary decides the tier.
        test_recipe:
          setup:
            - "Branch with household_count 80 and assets_under_care_dollars 10000000 (score 800 + 100 = 900 -> TIER_2), version observed"
          setup_api_calls:
            - call: "POST /branch-office/territories"
              payload: { community_name: "Bound Town", household_capacity: 500 }
              as: HomeOfficeAdmin
