      - name: corner_rbac_missing_auth_header_or_unknown_role_rejected_before_everything
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_UNKNOWN_ROLE
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_PLAN_PROVIDER_NOT_FOUND
        distinguishing_aspect: "Authentication is the outermost layer, so a request with no usable identity cannot be told apart by its target: the same missing-header 401 comes back from a role-mismatched endpoint, from an unresolvable path id and from a structurally invalid body. The empty string counts as absent, which is a distinct case from the header being omitted entirely, and the role name is matched exactly, so a lower-cased spelling of a real role is an unknown role rather than that role."
        test_recipe:
          setup:
            - "Empty database. The path id below is a syntactically valid UUID that resolves to nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /pep/plan-providers/11111111-1111-4111-8111-111111111111"
              as: ""
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_MISSING_AUTH_HEADERS
            - call: "GET /pep/plan-providers/11111111-1111-4111-8111-111111111111"
              as: RegulatorOps
              as_user_id: ""
              expect_error: ERR_MISSING_AUTH_HEADERS
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: ""
              as_user_id: ""
              expect_error: ERR_MISSING_AUTH_HEADERS
            - call: "POST /pep/payroll-batches"
              payload: { adopting_employer_id: "22222222-2222-4222-8222-222222222222", pay_period_start: "not-a-date", pay_period_end: "2026-07-31", pay_date: "2026-08-03", withholding_date: "2026-08-03", payroll_provider_reference: "PAL-2026-15", total_eligible_compensation_cents: -1, total_deferral_cents: 4500000, total_match_cents: 3750000, total_loan_repayment_cents: 250000, participant_line_count: 13 }
              as: ""
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_MISSING_AUTH_HEADERS
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: "PlanAuditor"
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_UNKNOWN_ROLE
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: "regulatorops"
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_UNKNOWN_ROLE
            - call: "POST /pep/plan-filings/77777777-7777-4777-8777-777777777777/file"
              as: "PlanAuditor"
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_UNKNOWN_ROLE
            - call: "GET /pep/plan-providers/11111111-1111-4111-8111-111111111111"
              as: RegulatorOps
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_PLAN_PROVIDER_NOT_FOUND
          assert:
            - "an empty X-User-Role and an empty X-User-ID each return 401 ERR_MISSING_AUTH_HEADERS: the empty string is treated as absent, not as a role or an id"
            - "the batch request whose body carries a non-date pay_period_start and a negative compensation still returns 401 ERR_MISSING_AUTH_HEADERS, not 422 ERR_VALIDATION: the body is never parsed for meaning before the caller is identified"
            - "PlanAuditor returns 401 ERR_UNKNOWN_ROLE, and lower-cased regulatorops does too: role matching is exact and case-sensitive"
            - "PlanAuditor on the RegulatorOps-only file endpoint returns 401 ERR_UNKNOWN_ROLE and not 403 ERR_UNAUTHORIZED — an unrecognised role is rejected before the endpoint's role list is consulted, and not 404 either although the filing id resolves to nothing"
            - "the same GET with both headers well formed finally reaches the lookup and returns 404 ERR_PLAN_PROVIDER_NOT_FOUND, which proves the earlier 401s were caused by the headers and not by the missing row"
            - "every 401 body carries the standard envelope: response_type error, data.error_id and data.message present, no data payload fields"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_layer_occ_stale_employer_version_rejected_and_token_lifetime
        claim_type: error_triggerable
        grounds:
          - concurrency_rules.design-election-create-stale-employer
          - validations[priority=8]
          - errors.ERR_STALE_EMPLOYER_VERSION
        distinguishing_aspect: "The optimistic-concurrency token is the parent employer's version, not the election's, so the interesting question is exactly which events invalidate it. A submit invalidates it because the employer transitions; a replacement create invalidates it because the employer is reset to APPLIED; but superseding a DRAFT election does not, because no employer-level transition fires — so the same token is refused in one place and accepted twice in another, which no blanket bump-on-every-write implementation can reproduce."
        test_recipe:
          setup:
            - "Plan 001 ACTIVE and Palisade freshly admitted in APPLIED with version 1; no batches, no exits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: RegulatorOps
              captures: { ppp_id: $.data.id }
            - call: "POST /pep/plan-providers/${ppp_id}/register"
              payload: { registration_effective_date: "2026-08-03" }
              as: RegulatorOps
            - call: "POST /pep/plan-documents"
              payload: { pooled_plan_provider_id: "${ppp_id}", plan_name: "Meridian PEP", plan_number: "001", plan_year_end_date: "2026-12-31", base_eligibility_min_age: 21, base_eligibility_service_months: 12, base_vesting_schedule: "IMMEDIATE", base_match_formula_code: "SAFE_HARBOR_BASIC" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
