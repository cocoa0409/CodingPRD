# =============================================================================
# PRD Benchmark Scaffold — Animal Identification & Traceability Program
# Difficulty band: above Expert (§0.4) — 12 entities, 54 endpoints, 38 errors,
# 9 calculations (2 dual-variant on different domains, 3 combinatorial modes),
# 6 state machines (2 parallel-dimension, 3 cyclic, 1 branching).
# =============================================================================

scenario: |
  Animal Identification & Traceability Program (USDA animal disease traceability):
  tag issuance & premises registration, tag application event & animal-to-premises
  association, movement event capture & sighting history, disease traceback query &
  48-hour trace goal, tag retirement at harvest & reconciliation, device supplier
  approval & tag inventory, producer privacy & data access rules, program enrollment
  incentive

domain_name: animal-id-traceability
# All resource collections are top-level; `/` is the API root prefix.
api_prefix: "/"

complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Animals, premises and movement events form a directed multigraph: a
  # MovementEvent is an edge between two Premises nodes carrying an Animal, and
  # Sighting rows are the append-only event log the graph is replayed from.
  # Tag.replaces_tag_id is self-referential (replacement chains).

  state_machine_shape: parallel
  # Premises carries registration_status x health_status; Animal carries
  # lifecycle_status x trace_status; both dimensions evolve independently on the
  # same row. MovementEvent (REPORTED<->DISPUTED), HoldOrder (ACTIVE<->UNDER_APPEAL)
  # and DeviceSupplier (APPROVED<->SUSPENDED) are cyclic; ReconciliationRun branches
  # SUBMITTED -> {APPROVED, VARIANCE_FLAGGED}.

  relationship_patterns:
    - one_to_many          # Producer -> Premises, TagLot -> Tag, Animal -> Sighting
    - many_to_many         # Animal <-> Premises via Sighting / MovementEvent edges
    - self_referential     # Tag.replaces_tag_id -> Tag.id (replacement chain)
    - cross_aggregate      # HoldOrder -> TraceRequest, ReconciliationRun -> TagLot

  role_model: segregation_of_duties
  # The ProgramAdmin who registers a DeviceSupplier may not approve it; the
  # FederalTraceAnalyst who opens a TraceRequest may not close it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the producer/operator."
      - name: contact_email
        type: string
        source: input
        description: "Contact email; must contain '@'."
      - name: state_code
        type: string
        source: input
        description: "Two-letter USPS state code of the producer's home state."
        constraints: "^[A-Z]{2}$"
      - name: privacy_level
        type: enum
        source: input
        default: STANDARD
        description: "Producer data-sharing posture; drives the §1.4 privacy gate."
        constraints: "STANDARD | RESTRICTED"
      - name: enrollment_status
        type: enum
        source: system
        default: NOT_ENROLLED
        description: "Program enrollment state; gates IncentiveAward accrual."
        constraints: "NOT_ENROLLED | ENROLLED | LAPSED"
      - name: enrolled_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which enrollment succeeded; null while NOT_ENROLLED."
      - name: enrolled_head_count
        type: integer
        source: computed
        default: 0
        description: "Sum of Premises.animal_count over this producer's premises with registration_status == ACTIVE."
      - name: incentive_tier
        type: enum
        source: computed
        default: TIER_0
        description: "Derived from enrolled_head_count by calculations.incentive_award_amount tier table."
        constraints: "TIER_0 | TIER_1 | TIER_2 | TIER_3"
      - name: on_time_movement_pct
        type: number
        source: computed
        default: 100.00
        description: "Percent of this producer's non-VOIDED movement events reported on time; see calculations.movement_reporting_timeliness."
      - name: incentive_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of awarded_cents of PAID awards minus sum of clawback_cents of CLAWED_BACK awards."
      - name: lifetime_clawback_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative clawed-back cents; never decreases."

  - name: Premises
    parent: null
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the producer that owns and operates this premises."
      - name: pin
        type: string
        source: input
        description: "Premises Identification Number; globally unique."
        constraints: "^[0-9A-Z]{7}$"
      - name: operation_type
        type: enum
        source: input
        description: "Operation class; selects the reconciliation basis variant."
        constraints: "COW_CALF | FEEDLOT | MARKET | HARVEST_FACILITY"
      - name: state_code
        type: string
        source: input
        description: "Two-letter USPS state code where the premises is located; drives interstate detection."
        constraints: "^[A-Z]{2}$"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of ACTIVE animals that may be resident at this premises."
        constraints: ">= 1"
      - name: registration_status
        type: enum
        source: system
        default: PENDING_REVIEW
        description: "Registration dimension of the parallel state machine."
        constraints: "PENDING_REVIEW | ACTIVE | SUSPENDED"
      - name: health_status
        type: enum
        source: system
        default: CLEAR
        description: "Health dimension of the parallel state machine; evolves independently of registration_status."
        constraints: "CLEAR | UNDER_INVESTIGATION | QUARANTINED"
      - name: animal_count
        type: integer
        source: computed
        default: 0
        description: "Count of Animal rows with current_premises_id == this.id AND lifecycle_status == ACTIVE."
      - name: pending_hold_count
        type: integer
        source: computed
        default: 0
        description: "Count of HoldOrder rows on this premises with status IN {PROPOSED, ACTIVE, UNDER_APPEAL}."
      - name: last_hold_released_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent hold release; anchors the 72-hour cooldown buffer."
      - name: last_reconciliation_run_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the most recent ReconciliationRun was created for this premises."

  - name: DeviceSupplier
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Legal name of the approved tag-device manufacturer."
      - name: supplier_code
        type: string
        source: input
        description: "Program-assigned supplier code; globally unique."
        constraints: "^[A-Z0-9]{4}$"
      - name: aid_prefix
        type: string
        source: input
        default: "840"
        description: "Animal Identification Number country prefix used by this supplier's devices."
        constraints: "exactly three digits"
      - name: status
        type: enum
        source: system
        default: PENDING_REVIEW
        description: "Approval lifecycle; gates tag issuance and tag application."
        constraints: "PENDING_REVIEW | APPROVED | SUSPENDED | REVOKED"
      - name: registered_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramAdmin that created the record; the segregation-of-duties subject."
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ProgramAdmin that approved the record; must differ from registered_by_user_id."
      - name: defect_report_count
        type: integer
        source: system
        default: 0
        description: "Cumulative count of reported device defects across all lots."
      - name: issued_tag_count
        type: integer
        source: computed
        default: 0
        description: "Sum of TagLot.quantity over this supplier's lots with status IN {ISSUED, ACTIVE, DEPLETED, RECALLED}."
      - name: retired_tag_count
        type: integer
        source: computed
        default: 0
        description: "Count of this supplier's tags with device_status == RETIRED."
      - name: retired_returned_count
        type: integer
        source: computed
        default: 0
        description: "Count of this supplier's RETIRED tags whose tag_returned == true."
      - name: conformance_score
        type: number
        source: computed
        default: 100.00
        description: "Device conformance score; see calculations.supplier_conformance_score."
      - name: probation
        type: boolean
        source: computed
        default: false
        description: "True when conformance_score < 85.00; adds the issuance-fee surcharge."
      - name: issuance_cap
        type: integer
        source: computed
        default: 10000
        description: "Maximum quantity permitted on a single new TagLot, derived from conformance_score tiers."

  - name: TagLot
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> DeviceSupplier.id; the manufacturer that produced this serial range."
      - name: premises_id
        type: string
        source: input
        description: "FK -> Premises.id; the premises the lot was issued to."
      - name: serial_start
        type: integer
        source: input
        description: "First 12-digit AIN serial in the lot (inclusive)."
        constraints: "100000000000 <= serial_start <= 999999999999"
      - name: serial_end
        type: integer
        source: input
        description: "Last 12-digit AIN serial in the lot (inclusive); >= serial_start."
      - name: quantity
        type: integer
        source: computed
        description: "serial_end - serial_start + 1."
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "Lot lifecycle."
        constraints: "ISSUED | ACTIVE | DEPLETED | RECALLED | VOIDED"
      - name: applied_count
        type: integer
        source: computed
        default: 0
        description: "Count of this lot's tags with device_status == APPLIED."
      - name: retired_count
        type: integer
        source: computed
        default: 0
        description: "Count of this lot's tags with device_status == RETIRED."
      - name: replaced_count
        type: integer
        source: computed
        default: 0
        description: "Count of this lot's tags with device_status == REPLACED."
      - name: voided_count
        type: integer
        source: computed
        default: 0
        description: "Count of this lot's tags with device_status == VOIDED."
      - name: unapplied_count
        type: integer
        source: computed
        description: "quantity - applied_count - retired_count - replaced_count - voided_count; the never-materialised remainder."
      - name: fee_cents
        type: integer
        source: computed
        description: "Issuance fee charged at create; see calculations.tag_lot_issuance_fee."
      - name: discount_pct_applied
        type: number
        source: computed
        description: "Volume-discount percentage selected from the pre-surcharge subtotal tier table."
      - name: surcharge_cents
        type: integer
        source: computed
        default: 0
        description: "Probation surcharge component of fee_cents."

  - name: Tag
    parent: null
    common_fields: true
    fields:
      - name: tag_lot_id
        type: string
        source: input
        description: "FK -> TagLot.id; the lot this device's serial belongs to."
      - name: ain
        type: string
        source: input
        description: "15-character Animal Identification Number (aid_prefix + 12-digit serial); globally unique."
        constraints: "^[0-9]{15}$"
      - name: animal_id
        type: string
        source: system
        default: null
        description: "FK -> Animal.id; the animal this device identifies. Set at application, retained after retirement."
      - name: replaces_tag_id
        type: string
        source: input
        default: null
        description: "FK -> Tag.id; the prior device this tag replaces (self-referential replacement chain)."
      - name: device_status
        type: enum
        source: system
        default: APPLIED
        description: "Device lifecycle. A Tag row is materialised only at application, so APPLIED is the initial state."
        constraints: "APPLIED | RETIRED | REPLACED | VOIDED"
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant of tag application."
      - name: retired_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of retirement at harvest."
      - name: tag_returned
        type: boolean
        source: input
        default: null
        description: "Whether the physical device was recovered at harvest; feeds supplier retention_rate."
      - name: carcass_ref
        type: string
        source: input
        default: null
        description: "Harvest facility carcass reference recorded at retirement."

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - name: ain
        type: string
        source: computed
        description: "Denormalised AIN of the animal's current APPLIED tag; re-derived on replacement."
      - name: species
        type: enum
        source: input
        description: "Species of the identified animal."
        constraints: "BOVINE | OVINE | CAPRINE | CERVID"
      - name: birth_date
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD."
      - name: birth_premises_id
        type: string
        source: input
        description: "FK -> Premises.id; premises at which the tag was applied."
      - name: current_premises_id
        type: string
        source: computed
        default: null
        description: "FK -> Premises.id; premises of the latest non-reversed sighting per calculations.animal_location_projection. Null while IN_TRANSIT."
      - name: lifecycle_status
        type: enum
        source: computed
        default: ACTIVE
        description: "Location/physical dimension of the parallel state machine."
        constraints: "ACTIVE | IN_TRANSIT | HARVESTED | VOIDED"
      - name: trace_status
        type: enum
        source: system
        default: NORMAL
        description: "Epidemiological dimension of the parallel state machine; evolves independently of lifecycle_status."
        constraints: "NORMAL | TRACE_HIT | CLEARED"
      - name: sighting_count
        type: integer
        source: computed
        default: 1
        description: "Count of this animal's Sighting rows with reversed == false."
      - name: last_sequence_no
        type: integer
        source: computed
        default: 1
        description: "Highest sequence_no appended for this animal, including reversed rows."

  - name: Sighting
    parent: null
    common_fields: false
    fields:
      - name: animal_id
        type: string
        source: system
        description: "FK -> Animal.id; the observed animal."
      - name: premises_id
        type: string
        source: system
        description: "FK -> Premises.id; where the observation occurred."
      - name: source_movement_id
        type: string
        source: system
        default: null
        description: "FK -> MovementEvent.id; the movement that produced this sighting, when applicable."
      - name: sighting_type
        type: enum
        source: system
        description: "Kind of observation appended to the animal's event log."
        constraints: "TAG_APPLIED | DEPARTURE | ARRIVAL | HARVEST"
      - name: observed_at
        type: datetime
        source: system
        description: "Business instant of the observation (departed_at / arrived_at / harvested_at / clock at application)."
      - name: sequence_no
        type: integer
        source: system
        description: "Per-animal append order, starting at 1 and incrementing by 1 on every append including reversals' originals."
      - name: reversed
        type: boolean
        source: system
        default: false
        description: "True when a compensating action retracted this observation; reversed rows are excluded from projections but never deleted."

  - name: MovementEvent
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal being moved."
      - name: origin_premises_id
        type: string
        source: input
        description: "FK -> Premises.id; departure premises."
      - name: destination_premises_id
        type: string
        source: input
        description: "FK -> Premises.id; arrival premises."
      - name: departed_at
        type: datetime
        source: input
        description: "Business instant of departure."
      - name: arrived_at
        type: datetime
        source: input
        default: null
        description: "Business instant of arrival, supplied at receive."
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the movement was reported; frozen at create and never changed by corrections."
      - name: icvi_number
        type: string
        source: input
        default: null
        description: "Interstate Certificate of Veterinary Inspection number; required when interstate == true."
      - name: interstate
        type: boolean
        source: computed
        description: "True when origin_premises.state_code != destination_premises.state_code."
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: "Movement lifecycle; REPORTED <-> DISPUTED is a correction cycle."
        constraints: "REPORTED | RECEIVED | DISPUTED | VOIDED"
      - name: reporting_lag_hours
        type: number
        source: computed
        description: "Hours between departed_at and reported_at, 2dp; see calculations.movement_reporting_timeliness."
      - name: on_time
        type: boolean
        source: computed
        description: "True when reporting_lag_hours <= 72.00."
      - name: correction_count
        type: integer
        source: computed
        default: 0
        description: "Number of DISPUTED -> REPORTED corrections applied; capped at 3."

  - name: TraceRequest
    parent: null
    common_fields: true
    fields:
      - name: index_animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the index case the traceback starts from."
      - name: pathogen_class
        type: enum
        source: input
        description: "Selects the contact-scope variant in calculations.trace_scope_projection."
        constraints: "DIRECT_CONTACT | ENVIRONMENTAL"
      - name: direction
        type: enum
        source: input
        description: "Traversal direction over the sighting graph."
        constraints: "BACKWARD | FORWARD | BOTH"
      - name: lookback_days
        type: integer
        source: input
        description: "Sighting inclusion window measured back from the run instant."
        constraints: "1 <= lookback_days <= 365"
      - name: max_hops
        type: integer
        source: input
        description: "Maximum hop depth explored from the index animal."
        constraints: "1 <= max_hops <= 5"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Trace lifecycle."
        constraints: "SUBMITTED | RUNNING | COMPLETED | CANCELLED"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FederalTraceAnalyst that created the request; the segregation-of-duties subject."
      - name: closed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the analyst that closed the request; must differ from opened_by_user_id."
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant at create; start of the 48-hour trace goal window."
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at close."
      - name: variant_applied
        type: enum
        source: computed
        default: null
        description: "Scope variant selected at run time from pathogen_class."
        constraints: "STRICT_INTERVAL | PREMISES_WINDOW"
      - name: hits
        type: array
        source: computed
        default: []
        description: "Trace result rows appended at run: objects { animal_id, premises_id, hop_depth, first_contact_at, responded, resolved }, ordered by hop_depth ASC then first_contact_at ASC then Animal.created_at ASC."
      - name: hit_count
        type: integer
        source: computed
        default: 0
        description: "Length of hits; excludes the index animal."
      - name: premises_touched_count
        type: integer
        source: computed
        default: 0
        description: "Count of distinct premises_id values across hits plus the index animal's own visited premises."
      - name: hops_total
        type: integer
        source: computed
        default: 0
        description: "Count of distinct MovementEvent rows traversed during the run."
      - name: hops_unreachable
        type: integer
        source: computed
        default: 0
        description: "Count of traversed MovementEvent rows whose status IS IN {DISPUTED, VOIDED} at close time."
      - name: elapsed_hours
        type: number
        source: computed
        default: null
        description: "Hours between opened_at and closed_at, 2dp."
      - name: completeness_score
        type: number
        source: computed
        default: null
        description: "See calculations.trace_completeness_score."
      - name: trace_goal_met
        type: boolean
        source: computed
        default: null
        description: "True when elapsed_hours <= 48.00 AND completeness_score >= 80.00."

  - name: HoldOrder
    parent: null
    common_fields: true
    fields:
      - name: premises_id
        type: string
        source: input
        description: "FK -> Premises.id; the quarantined premises."
      - name: trace_request_id
        type: string
        source: input
        default: null
        description: "FK -> TraceRequest.id; the investigation the hold was issued under, when any."
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the hold window."
      - name: effective_until
        type: datetime
        source: input
        description: "Exclusive end of the hold window; must be strictly after effective_from."
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Hold lifecycle; ACTIVE <-> UNDER_APPEAL is an appeal cycle."
        constraints: "PROPOSED | ACTIVE | UNDER_APPEAL | RELEASED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the issuing StateAnimalHealthOfficial."
      - name: appeal_count
        type: integer
        source: computed
        default: 0
        description: "Number of appeals raised on this hold; capped at 2."
      - name: released_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of release; anchors the premises cooldown buffer."

  - name: ReconciliationRun
    parent: null
    common_fields: true
    fields:
      - name: premises_id
        type: string
        source: input
        description: "FK -> Premises.id; the premises whose tag inventory is being reconciled."
      - name: period_start
        type: string
        source: input
        description: "Inclusive first date of the reconciliation period, YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Inclusive last date of the reconciliation period, YYYY-MM-DD; must be >= period_start."
      - name: physical_unapplied_count
        type: integer
        source: input
        default: null
        description: "Counted physical unapplied devices on hand, supplied at submit."
        constraints: ">= 0"
      - name: basis
        type: enum
        source: computed
        default: null
        description: "Book-balance variant selected from the premises operation_type at submit."
        constraints: "AS_ISSUED | AS_SIGHTED"
      - name: book_unapplied_count
        type: integer
        source: computed
        default: null
        description: "See calculations.premises_tag_book_balance."
      - name: variance_count
        type: integer
        source: computed
        default: null
        description: "physical_unapplied_count - book_unapplied_count (signed)."
      - name: variance_pct
        type: number
        source: computed
        default: null
        description: "See calculations.reconciliation_variance."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Run lifecycle; SUBMITTED branches to APPROVED or VARIANCE_FLAGGED."
        constraints: "DRAFT | SUBMITTED | APPROVED | VARIANCE_FLAGGED | SUPERSEDED"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the producer that submitted the physical count."
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the StateAnimalHealthOfficial that adjudicated the run."

  - name: IncentiveAward
    parent: null
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: "FK -> Producer.id; the enrolled producer being paid."
      - name: period_start
        type: string
        source: input
        description: "Inclusive first date of the incentive period, YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Inclusive last date of the incentive period, YYYY-MM-DD; must be >= period_start."
      - name: head_count_snapshot
        type: integer
        source: computed
        description: "Producer.enrolled_head_count frozen at accrual."
      - name: tier_factor
        type: number
        source: computed
        description: "Tier multiplier frozen at accrual from Producer.incentive_tier."
      - name: compliance_multiplier
        type: number
        source: computed
        description: "Timeliness multiplier frozen at accrual from Producer.on_time_movement_pct."
      - name: line_items
        type: array
        source: computed
        description: "Per-premises award lines: objects { premises_id, animal_count, line_cents }, ordered by Premises.created_at ASC."
      - name: awarded_cents
        type: integer
        source: computed
        description: "Sum of line_items[].line_cents; see calculations.incentive_award_amount."
      - name: clawback_cents
        type: integer
        source: computed
        default: 0
        description: "Cents reversed by a clawback; equals awarded_cents once CLAWED_BACK."
      - name: status
        type: enum
        source: system
        default: ACCRUED
        description: "Award lifecycle."
        constraints: "ACCRUED | PAID | CLAWED_BACK"

# =============================================================================
# 1.2 State Machine Table
# Parallel-dimension entities (Premises, Animal) declare one block per dimension;
# the two dimensions on the same row advance independently.
# =============================================================================
state_machines:

  - entity: Producer
    dimension: enrollment_status
    initial_state: NOT_ENROLLED
    terminal_states: []
    transitions:
      - from: NOT_ENROLLED
        to: ENROLLED
        trigger: "POST /producers/{id}/enroll"
        actor: Producer
        preconditions:
          - "acting X-User-ID == Producer.id (self-enrollment only)"
          - "at least one Premises with producer_id == Producer.id AND registration_status == ACTIVE exists, else ERR_NO_ACTIVE_PREMISES"
        side_effects:
          - "sets enrolled_at = logical clock now"
          - "recomputes enrolled_head_count and incentive_tier per calculations.incentive_award_amount tier table"
      - from: ENROLLED
        to: LAPSED
        trigger: "system: cascade step 3 of POST /reconciliation-runs/{id}/approve when the branch is VARIANCE_FLAGGED"
        actor: system
        preconditions:
          - "the suspension cascade left this producer with zero Premises in registration_status == ACTIVE"
        side_effects:
          - "recomputes enrolled_head_count to 0 and incentive_tier to TIER_0"
          - "blocks further IncentiveAward accrual (ERR_PRODUCER_NOT_ENROLLED)"
        note: "Third hop of CASCADE-D; caused by the Premises suspension, not directly by the approve call."
      - from: LAPSED
        to: ENROLLED
        trigger: "POST /producers/{id}/enroll"
        actor: Producer
        preconditions:
          - "at least one Premises with producer_id == Producer.id AND registration_status == ACTIVE exists, else ERR_NO_ACTIVE_PREMISES"
        side_effects:
          - "sets enrolled_at = logical clock now (re-enrollment overwrites the prior instant)"
          - "recomputes enrolled_head_count and incentive_tier"

  - entity: Premises
    dimension: registration_status
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /premises/{id}/approve"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "registration_status == PENDING_REVIEW"
        side_effects:
          - "recomputes owning Producer.enrolled_head_count and incentive_tier"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade step 2 of POST /reconciliation-runs/{id}/approve when the branch is VARIANCE_FLAGGED"
        actor: system
        preconditions:
          - "the reconciliation run that just flipped to VARIANCE_FLAGGED targets this premises"
        side_effects:
          - "recomputes owning Producer.enrolled_head_count (this premises no longer contributes) and incentive_tier"
          - "if the producer now has zero ACTIVE premises, cascades Producer ENROLLED -> LAPSED (CASCADE-D hop 3)"
          - "blocks tag application, movement reporting and lot issuance at this premises (ERR_PREMISES_NOT_ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: cascade of POST /reconciliation-runs/{id}/approve when the branch is APPROVED"
        actor: system
        preconditions:
          - "the approved run targets this premises AND registration_status == SUSPENDED"
        side_effects:
          - "recomputes owning Producer.enrolled_head_count and incentive_tier"
        note: "Registration dimension is cyclic: a clean reconciliation reinstates a suspended premises."

  - entity: Premises
    dimension: health_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: QUARANTINED
        trigger: "POST /hold-orders/{id}/activate"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "the activating HoldOrder targets this premises"
        side_effects:
          - "CASCADE-C hop 2: every MovementEvent with origin_premises_id == this.id AND status == REPORTED transitions REPORTED -> DISPUTED"
      - from: UNDER_INVESTIGATION
        to: QUARANTINED
        trigger: "POST /hold-orders/{id}/activate"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "the activating HoldOrder targets this premises"
        side_effects:
          - "CASCADE-C hop 2: every MovementEvent with origin_premises_id == this.id AND status == REPORTED transitions REPORTED -> DISPUTED"
      - from: CLEAR
        to: UNDER_INVESTIGATION
        trigger: "system: CASCADE-C hop 3 — a MovementEvent whose destination_premises_id == this.id was disputed by hop 2"
        actor: system
        preconditions:
          - "health_status == CLEAR"
        side_effects:
          - "premises remains operable; only lot issuance fee posture is unaffected, but a subsequent hold activation moves it to QUARANTINED"
      - from: QUARANTINED
        to: CLEAR
        trigger: "POST /hold-orders/{id}/release"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "no other HoldOrder on this premises has status IN {ACTIVE, UNDER_APPEAL}"
        side_effects:
          - "sets last_hold_released_at = logical clock now, arming the 72-hour cooldown buffer"
          - "every Animal with current_premises_id == this.id AND trace_status == TRACE_HIT transitions TRACE_HIT -> CLEARED"
        note: "DISPUTED movement events are NOT auto-restored by release; they must be corrected explicitly."

  - entity: DeviceSupplier
    initial_state: PENDING_REVIEW
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /device-suppliers/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "status == PENDING_REVIEW"
          - "acting X-User-ID != registered_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets approved_by_user_id = acting X-User-ID"
          - "recomputes conformance_score, probation and issuance_cap"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system: POST /device-suppliers/{id}/defect-reports drives conformance_score below 70.00"
        actor: system
        preconditions:
          - "recomputed conformance_score < 70.00"
        side_effects:
          - "every TagLot of this supplier with status IN {ISSUED, ACTIVE} transitions to RECALLED"
          - "blocks new lot issuance and tag application from this supplier's lots (ERR_SUPPLIER_NOT_APPROVED)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /device-suppliers/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "status == SUSPENDED"
          - "conformance_score >= 70.00 after the corrective defect_report_count reduction supplied in the request"
        side_effects:
          - "reduces defect_report_count by the request's forgiven_defects and recomputes conformance_score, probation, issuance_cap"
          - "RECALLED lots are NOT restored; they stay RECALLED"
        note: "Supplier approval dimension is cyclic (APPROVED <-> SUSPENDED)."
      - from: SUSPENDED
        to: REVOKED
        trigger: "system: POST /device-suppliers/{id}/defect-reports drives conformance_score below 40.00"
        actor: system
        preconditions:
          - "status == SUSPENDED AND recomputed conformance_score < 40.00"
        side_effects:
          - "every TagLot of this supplier with status IN {ISSUED, ACTIVE} transitions to RECALLED"
          - "terminal: no further transitions are permitted"

  - entity: TagLot
    initial_state: ISSUED
    terminal_states: [VOIDED, RECALLED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /tag-lots/{id}/apply-tag (first successful application against this lot)"
        actor: Producer
        preconditions:
          - "applied_count transitions from 0 to 1 as part of this request"
        side_effects:
          - "recomputes applied_count and unapplied_count"
      - from: ACTIVE
        to: DEPLETED
        trigger: "system: any application, retirement, replacement or void that drives unapplied_count to 0"
        actor: system
        preconditions:
          - "unapplied_count == 0 after the triggering mutation"
        side_effects:
          - "further applications against this lot are rejected with ERR_LOT_EXHAUSTED"
      - from: ISSUED
        to: RECALLED
        trigger: "system: owning DeviceSupplier transitions APPROVED -> SUSPENDED or SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "status IN {ISSUED, ACTIVE}"
        side_effects:
          - "already-applied tags keep device_status APPLIED; only unapplied serials become unusable"
      - from: ACTIVE
        to: RECALLED
        trigger: "system: owning DeviceSupplier transitions APPROVED -> SUSPENDED or SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "status IN {ISSUED, ACTIVE}"
        side_effects:
          - "already-applied tags keep device_status APPLIED; only unapplied serials become unusable"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /tag-lots/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "status == ISSUED (no tag has ever been applied from this lot)"
        side_effects:
          - "removes quantity from DeviceSupplier.issued_tag_count and recomputes conformance_score, probation and issuance_cap"
          - "removes the lot from every AS_ISSUED and AS_SIGHTED book balance at its premises"

  - entity: Tag
    initial_state: APPLIED
    terminal_states: [RETIRED, REPLACED, VOIDED]
    transitions:
      - from: APPLIED
        to: RETIRED
        trigger: "POST /tags/{id}/retire"
        actor: HarvestFacilityOperator
        preconditions:
          - "device_status == APPLIED"
          - "the tagged Animal has lifecycle_status == ACTIVE AND current_premises_id == the request's harvest_premises_id, else ERR_ANIMAL_NOT_AT_PREMISES"
          - "harvest premises operation_type == HARVEST_FACILITY, registration_status == ACTIVE and health_status != QUARANTINED"
          - "harvested_at >= observed_at of the animal's highest non-reversed sequence_no sighting, else ERR_BACKDATED_EVENT"
        side_effects:
          - "CASCADE-B hop 1: sets retired_at, tag_returned, carcass_ref; device_status APPLIED -> RETIRED"
          - "CASCADE-B hop 2: because the device retired, TagLot.applied_count decreases by 1 and TagLot.retired_count increases by 1; if unapplied_count is now 0 the lot transitions ACTIVE -> DEPLETED"
          - "CASCADE-B hop 3: because the lot counters changed, DeviceSupplier.retired_tag_count (and retired_returned_count when tag_returned == true) are recomputed, which re-derives conformance_score, probation and issuance_cap; a score below 70.00 drives APPROVED -> SUSPENDED (hop 4)"
          - "appends Sighting(sighting_type=HARVEST, observed_at=harvested_at, premises_id=harvest_premises_id), which re-projects the Animal to lifecycle_status HARVESTED and decrements Premises.animal_count"
      - from: APPLIED
        to: REPLACED
        trigger: "POST /tags/{id}/replace"
        actor: Producer
        preconditions:
          - "device_status == APPLIED"
          - "the tagged Animal has lifecycle_status == ACTIVE"
        side_effects:
          - "materialises a new Tag with device_status APPLIED, animal_id unchanged, replaces_tag_id = this tag's id"
          - "old lot: applied_count decreases by 1, replaced_count increases by 1; new lot: applied_count increases by 1"
          - "Animal.ain is re-derived from the replacement device (derived-field reconciliation)"
      - from: APPLIED
        to: VOIDED
        trigger: "POST /tags/{id}/void-application"
        actor: ProgramAdmin
        preconditions:
          - "device_status == APPLIED"
          - "the tagged Animal has lifecycle_status == ACTIVE (a harvested or in-transit animal cannot have its application voided, ERR_INVALID_STATE)"
        side_effects:
          - "compensation: TagLot.applied_count decreases by 1 and TagLot.voided_count increases by 1, leaving quantity == unapplied_count + applied_count + retired_count + replaced_count + voided_count invariant"
          - "the animal's TAG_APPLIED sighting is marked reversed = true and the Animal transitions lifecycle_status ACTIVE -> VOIDED"
          - "Premises.animal_count at the animal's current premises decreases by 1 and the owning Producer.enrolled_head_count / incentive_tier are recomputed"

  - entity: Animal
    dimension: lifecycle_status
    initial_state: ACTIVE
    terminal_states: [HARVESTED, VOIDED]
    transitions:
      - from: ACTIVE
        to: IN_TRANSIT
        trigger: "POST /movement-events"
        actor: Producer
        preconditions:
          - "lifecycle_status == ACTIVE AND current_premises_id == origin_premises_id"
        side_effects:
          - "appends Sighting(DEPARTURE, observed_at=departed_at); current_premises_id becomes null"
          - "origin Premises.animal_count decreases by 1 and the origin producer's enrolled_head_count / incentive_tier are recomputed"
      - from: IN_TRANSIT
        to: ACTIVE
        trigger: "POST /movement-events/{id}/receive"
        actor: Producer
        preconditions:
          - "the receiving movement is the animal's open REPORTED movement"
        side_effects:
          - "CASCADE-A hop 2: appends Sighting(ARRIVAL, observed_at=arrived_at)"
          - "CASCADE-A hop 3: the new sighting re-projects current_premises_id to destination_premises_id"
          - "CASCADE-A hop 4: because the animal is now resident, destination Premises.animal_count increases by 1"
          - "CASCADE-A hop 5: because the destination premises head count changed, the destination Producer.enrolled_head_count is recomputed, which re-derives incentive_tier"
      - from: IN_TRANSIT
        to: ACTIVE
        trigger: "POST /movement-events/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "the voided movement is the animal's most recent non-reversed DEPARTURE source"
        side_effects:
          - "compensation: the DEPARTURE sighting is marked reversed = true, re-projecting current_premises_id back to origin_premises_id"
          - "origin Premises.animal_count increases by 1, restoring origin.animal_count + destination.animal_count to its pre-departure value"
      - from: ACTIVE
        to: IN_TRANSIT
        trigger: "POST /movement-events/{id}/dispute (from status RECEIVED)"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "the disputed movement had status RECEIVED"
        side_effects:
          - "conditional cascade: the ARRIVAL sighting is marked reversed = true, so the animal re-projects to IN_TRANSIT and destination Premises.animal_count decreases by 1"
        note: "Disputing a REPORTED (not yet received) movement leaves lifecycle_status untouched."
      - from: ACTIVE
        to: HARVESTED
        trigger: "POST /tags/{id}/retire"
        actor: HarvestFacilityOperator
        preconditions:
          - "lifecycle_status == ACTIVE"
        side_effects:
          - "current_premises_id stays at the harvest premises but the animal stops counting toward Premises.animal_count"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /tags/{id}/void-application"
        actor: ProgramAdmin
        preconditions:
          - "lifecycle_status == ACTIVE"
        side_effects:
          - "all of this animal's sightings are marked reversed = true; sighting_count becomes 0"

  - entity: Animal
    dimension: trace_status
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: TRACE_HIT
        trigger: "POST /trace-requests/{id}/run"
        actor: FederalTraceAnalyst
        preconditions:
          - "the animal appears in the run's computed hits"
        side_effects:
          - "the animal becomes readable by FederalTraceAnalyst and by StateAnimalHealthOfficial even when the owning producer's privacy_level == RESTRICTED"
      - from: NORMAL
        to: TRACE_HIT
        trigger: "system: CASCADE-C hop 2b — the animal's outbound REPORTED movement was disputed by a hold activation"
        actor: system
        preconditions:
          - "the animal is the subject of a movement event disputed by the quarantine cascade"
        side_effects:
          - "trace_status advances independently of lifecycle_status, which stays IN_TRANSIT"
      - from: TRACE_HIT
        to: CLEARED
        trigger: "POST /hold-orders/{id}/release"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "current_premises_id == the released hold's premises_id"
        side_effects:
          - "privacy exposure granted by TRACE_HIT is retained: CLEARED animals stay readable by StateAnimalHealthOfficial"

  - entity: MovementEvent
    initial_state: REPORTED
    terminal_states: [VOIDED]
    transitions:
      - from: REPORTED
        to: RECEIVED
        trigger: "POST /movement-events/{id}/receive"
        actor: Producer
        preconditions:
          - "status == REPORTED"
          - "arrived_at >= departed_at, else ERR_INVALID_WINDOW"
          - "destination Premises.registration_status == ACTIVE and health_status != QUARANTINED"
          - "destination Premises.animal_count + 1 <= destination Premises.capacity, else ERR_PREMISES_AT_CAPACITY"
        side_effects:
          - "runs CASCADE-A hops 2-5 (Sighting -> Animal -> Premises -> Producer)"
      - from: REPORTED
        to: DISPUTED
        trigger: "POST /movement-events/{id}/dispute"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status IN {REPORTED, RECEIVED}"
        side_effects:
          - "no sighting is reversed when the prior status was REPORTED"
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /movement-events/{id}/dispute"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status IN {REPORTED, RECEIVED}"
        side_effects:
          - "conditional cascade: reverses the ARRIVAL sighting, reverts the Animal to IN_TRANSIT and decrements destination Premises.animal_count"
      - from: REPORTED
        to: DISPUTED
        trigger: "system: CASCADE-C hop 2 — origin premises health_status became QUARANTINED"
        actor: system
        preconditions:
          - "status == REPORTED AND origin_premises_id == the newly quarantined premises"
        side_effects:
          - "CASCADE-C hop 3: because this movement is disputed, its destination Premises transitions health_status CLEAR -> UNDER_INVESTIGATION"
          - "CASCADE-C hop 2b: the moved Animal transitions trace_status NORMAL -> TRACE_HIT"
      - from: DISPUTED
        to: REPORTED
        trigger: "POST /movement-events/{id}/correct"
        actor: Producer
        preconditions:
          - "status == DISPUTED"
          - "correction_count < 3, else ERR_CORRECTION_LIMIT_EXCEEDED"
          - "origin Premises.health_status != QUARANTINED, else ERR_PREMISES_UNDER_HOLD"
        side_effects:
          - "increments correction_count by 1 and overwrites departed_at / icvi_number with the corrected values"
          - "reporting_lag_hours and on_time are recomputed as (frozen reported_at - corrected departed_at), so moving departed_at forward CAN flip a late movement to on_time; reported_at itself is never re-stamped"
          - "the origin producer's on_time_movement_pct is recomputed"
        note: "REPORTED <-> DISPUTED is the correction cycle, bounded at 3 corrections."
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /movement-events/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "compensation: every Sighting with source_movement_id == this.id is marked reversed = true"
          - "the Animal is re-projected from its remaining sightings, returning it to origin_premises_id with lifecycle_status ACTIVE and restoring origin Premises.animal_count"
          - "the movement leaves the origin producer's on_time_movement_pct denominator"

  - entity: TraceRequest
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: RUNNING
        trigger: "POST /trace-requests/{id}/run"
        actor: FederalTraceAnalyst
        preconditions:
          - "status == SUBMITTED"
          - "the index Animal has lifecycle_status != VOIDED, else ERR_INVALID_STATE"
        side_effects:
          - "selects variant_applied from pathogen_class and computes hits, hit_count, premises_touched_count, hops_total per calculations.trace_scope_projection"
          - "every hit animal transitions trace_status NORMAL -> TRACE_HIT"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /trace-requests/{id}/close"
        actor: FederalTraceAnalyst
        preconditions:
          - "status == RUNNING"
          - "acting X-User-ID != opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "no HoldOrder with trace_request_id == this.id has status IN {PROPOSED, UNDER_APPEAL}, else ERR_HOLD_PENDING"
        side_effects:
          - "sets closed_at and closed_by_user_id; recomputes hops_unreachable from the current status of every traversed movement"
          - "computes elapsed_hours, completeness_score and trace_goal_met per calculations.trace_completeness_score and calculations.trace_goal_evaluation"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /trace-requests/{id}/cancel"
        actor: FederalTraceAnalyst
        preconditions:
          - "status IN {SUBMITTED, RUNNING}"
        side_effects:
          - "no hits are computed; completeness_score and trace_goal_met stay null"
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /trace-requests/{id}/cancel"
        actor: FederalTraceAnalyst
        preconditions:
          - "status IN {SUBMITTED, RUNNING}"
          - "no HoldOrder with trace_request_id == this.id has status IN {ACTIVE, UNDER_APPEAL}, else ERR_TRACE_STILL_OPEN"
        side_effects:
          - "hit animals keep trace_status TRACE_HIT; cancellation does not clear them"

  - entity: HoldOrder
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /hold-orders/{id}/activate"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status == PROPOSED"
          - "the target Premises.registration_status != PENDING_REVIEW, else ERR_PREMISES_NOT_ACTIVE"
        side_effects:
          - "CASCADE-C hop 1: target Premises.health_status becomes QUARANTINED"
          - "CASCADE-C hops 2/2b/3 follow from the quarantine (movements disputed, animals TRACE_HIT, destinations UNDER_INVESTIGATION)"
      - from: ACTIVE
        to: UNDER_APPEAL
        trigger: "POST /hold-orders/{id}/appeal"
        actor: Producer
        preconditions:
          - "status == ACTIVE"
          - "acting X-User-ID == the owning Producer of the held premises, else ERR_NOT_RESOURCE_OWNER"
          - "appeal_count < 2, else ERR_APPEAL_LIMIT_EXCEEDED"
        side_effects:
          - "increments appeal_count by 1; Premises.health_status stays QUARANTINED during the appeal"
      - from: UNDER_APPEAL
        to: ACTIVE
        trigger: "POST /hold-orders/{id}/deny-appeal"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status == UNDER_APPEAL"
        side_effects:
          - "no counter changes; the hold resumes its ACTIVE posture"
        note: "ACTIVE <-> UNDER_APPEAL is the appeal cycle, bounded at 2 appeals."
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /hold-orders/{id}/release"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status IN {ACTIVE, UNDER_APPEAL}"
          - "the linked TraceRequest (when trace_request_id is not null) has status != RUNNING, else ERR_TRACE_STILL_OPEN"
        side_effects:
          - "sets released_at; decrements Premises.pending_hold_count"
          - "Premises.health_status QUARANTINED -> CLEAR and last_hold_released_at is stamped, arming the 72-hour cooldown"
          - "animals at the premises transition trace_status TRACE_HIT -> CLEARED"
      - from: UNDER_APPEAL
        to: RELEASED
        trigger: "POST /hold-orders/{id}/release"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status IN {ACTIVE, UNDER_APPEAL}"
          - "the linked TraceRequest (when trace_request_id is not null) has status != RUNNING, else ERR_TRACE_STILL_OPEN"
        side_effects:
          - "identical to the ACTIVE -> RELEASED side effects; an appeal in flight is abandoned"

  - entity: ReconciliationRun
    initial_state: DRAFT
    terminal_states: [APPROVED, VARIANCE_FLAGGED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reconciliation-runs/{id}/submit"
        actor: Producer
        preconditions:
          - "status == DRAFT"
          - "acting X-User-ID == the owning Producer of the premises, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "stores physical_unapplied_count and submitted_by_user_id"
          - "selects basis from Premises.operation_type and computes book_unapplied_count, variance_count and variance_pct"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /reconciliation-runs creates a newer run whose period overlaps this one on the same premises"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "terminal: a superseded run can no longer be submitted (ERR_INVALID_STATE)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /reconciliation-runs/{id}/approve"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status == SUBMITTED"
          - "variance_pct <= 0.50"
        side_effects:
          - "sets approved_by_user_id"
          - "if the premises registration_status == SUSPENDED it is reinstated to ACTIVE, recomputing the owning Producer.enrolled_head_count and incentive_tier"
      - from: SUBMITTED
        to: VARIANCE_FLAGGED
        trigger: "POST /reconciliation-runs/{id}/approve"
        actor: StateAnimalHealthOfficial
        preconditions:
          - "status == SUBMITTED"
          - "variance_pct > 0.50"
        side_effects:
          - "CASCADE-D hop 1: sets approved_by_user_id and flags the run"
          - "CASCADE-D hop 2: because the run is flagged, the target Premises transitions registration_status ACTIVE -> SUSPENDED"
          - "CASCADE-D hop 3: because the premises left ACTIVE, the owning Producer's enrolled_head_count is recomputed and, if no ACTIVE premises remain, enrollment_status ENROLLED -> LAPSED"
        note: "Branching: the same endpoint reaches two different terminal states with disjoint side-effect sets, selected by the variance_pct boundary."

  - entity: IncentiveAward
    initial_state: ACCRUED
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: ACCRUED
        to: PAID
        trigger: "POST /incentive-awards/{id}/pay"
        actor: ProgramAdmin
        preconditions:
          - "status == ACCRUED"
          - "the owning Producer.enrollment_status == ENROLLED, else ERR_PRODUCER_NOT_ENROLLED"
        side_effects:
          - "Producer.incentive_balance_cents increases by awarded_cents"
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /incentive-awards/{id}/clawback"
        actor: ProgramAdmin
        preconditions:
          - "status == PAID"
        side_effects:
          - "compensation: sets clawback_cents = awarded_cents, decreases Producer.incentive_balance_cents by awarded_cents and increases Producer.lifetime_clawback_cents by the same amount, restoring incentive_balance_cents to its pre-payment value"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: tag-lot-create-stale-supplier
    parent_entity: DeviceSupplier
    write_endpoint: "POST /tag-lots"
    occ_field: "expected_supplier_version"
    description: |
      Issuing a TagLot against a DeviceSupplier whose version has advanced since
      the client last observed it is rejected. Every issued lot consumes part of
      the supplier's serial space and re-derives issued_tag_count, conformance_score
      and issuance_cap, so a writer holding a stale supplier version is deciding
      against an obsolete cap.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reconciliation-run-create-stale-premises
    parent_entity: Premises
    write_endpoint: "POST /reconciliation-runs"
    occ_field: "expected_premises_version"
    description: |
      Creating a ReconciliationRun for a premises whose version has advanced is
      rejected. A newer run legitimately supersedes any DRAFT run covering an
      overlapping period, so a writer holding a stale premises version would
      silently discard a count it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hold-order-create-stale-premises
    parent_entity: Premises
    write_endpoint: "POST /hold-orders"
    occ_field: "expected_premises_version"
    description: |
      Proposing a HoldOrder against a premises whose version has advanced is
      rejected, because the cooldown anchor last_hold_released_at and the
      pending_hold_count the overlap check reads may both have moved since the
      issuing official last observed the premises.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# All money is integer cents. All rounding is round_half_up unless stated.
# No random field (id) participates in any ordering, selection or tie-break;
# `created_at ASC` is the only permitted common-field fallback.
# =============================================================================
calculations:

  - name: tag_lot_issuance_fee
    trigger: "POST /tag-lots — computed once at create and frozen on TagLot.fee_cents"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. The prose "the volume discount is keyed on the
      # lot total, and the probation surcharge is a percentage of that total"
      # is circular; the program resolves it by keying the discount tier on the
      # PRE-SURCHARGE subtotal and applying the surcharge afterwards.
      # step 1
      quantity            = serial_end - serial_start + 1
      # step 2
      subtotal_cents      = BASE_FEE_CENTS + PER_TAG_CENTS * quantity
      # step 3 - tier lookup reads subtotal_cents, NEVER the post-surcharge total
      discount_pct        = 0.00  if subtotal_cents < 50000
                          = 0.05  if 50000  <= subtotal_cents < 150000
                          = 0.12  if 150000 <= subtotal_cents < 400000
                          = 0.18  if subtotal_cents >= 400000
      # step 4
      discount_cents      = round_half_up(subtotal_cents * discount_pct)
      # step 5
      discounted_cents    = subtotal_cents - discount_cents
      # step 6 - surcharge is a pct of the DISCOUNTED total, not of the subtotal
      surcharge_cents     = round_half_up(discounted_cents * PROBATION_SURCHARGE_PCT)
                            if supplier.probation == true else 0
      # step 7
      fee_cents           = discounted_cents + surcharge_cents
      discount_pct_applied = discount_pct
    input_set: "The requesting DeviceSupplier's probation flag as it stands BEFORE this lot is counted into issued_tag_count; the lot's own serial range."
    constants:
      BASE_FEE_CENTS: 25000
      PER_TAG_CENTS: 42
      PROBATION_SURCHARGE_PCT: 0.04
    precision: "integer cents; round_half_up at step 4 and step 6 only"
    variants: []
    note: "The issuance_cap check in validations (priority 15) also reads the pre-request supplier state, so a lot can never widen the cap that admits it."

  - name: supplier_conformance_score
    trigger: "POST /device-suppliers/{id}/approve, POST /device-suppliers/{id}/defect-reports, POST /device-suppliers/{id}/reinstate, POST /tag-lots/{id}/void, and CASCADE-B hop 3 of POST /tags/{id}/retire"
    algorithm: weighted_scoring
    formula: |
      defects_per_thousand = defect_report_count / max(1.0, issued_tag_count / 1000.0)
      retention_rate       = 1.0000 if retired_tag_count == 0
                             else round_half_up(retired_returned_count / retired_tag_count, 4)
      conformance_score    = round_half_up(
                               max(0.00,
                                   min(100.00,
                                       100.00
                                       - DEFECT_WEIGHT  * defects_per_thousand
                                       - RETENTION_WEIGHT * (1.0000 - retention_rate))), 2)
      probation            = conformance_score < 85.00
      issuance_cap         = 10000 if conformance_score >= 95.00
                           =  5000 if 85.00 <= conformance_score < 95.00
                           =  2000 if 70.00 <= conformance_score < 85.00
                           =     0 if conformance_score < 70.00
      # automatic status transitions, evaluated after the score is stored:
      #   status == APPROVED  AND conformance_score < 70.00 -> SUSPENDED
      #   status == SUSPENDED AND conformance_score < 40.00 -> REVOKED
    input_set: "issued_tag_count sums TagLot.quantity over lots with status IN {ISSUED, ACTIVE, DEPLETED, RECALLED}; VOIDED lots are excluded. retired_tag_count and retired_returned_count count Tag rows with device_status == RETIRED across those same lots."
    constants:
      DEFECT_WEIGHT: 12.0
      RETENTION_WEIGHT: 20.0
      PROBATION_THRESHOLD: 85.00
      SUSPEND_THRESHOLD: 70.00
      REVOKE_THRESHOLD: 40.00
    precision: "2 decimal places, round_half_up; retention_rate at 4 decimal places"
    variants: []
    note: "A supplier with zero retirements gets full retention credit (1.0000) rather than a 0/0 penalty; this guard is what keeps a brand-new APPROVED supplier at 100.00."

  - name: movement_reporting_timeliness
    trigger: "POST /movement-events (initial computation) and POST /movement-events/{id}/correct (recomputation against the frozen reported_at)"
    algorithm: threshold
    formula: |
      reporting_lag_hours = round_half_up((reported_at - departed_at) total_seconds / 3600.0, 2)
      on_time             = reporting_lag_hours <= ON_TIME_MAX_HOURS      # 72.00 is ON TIME
      # producer roll-up, recomputed on every movement create/correct/void:
      denominator = count(MovementEvent m where m.status IN {REPORTED, RECEIVED, DISPUTED}
                          AND m.origin_premises.producer_id == producer.id)
      numerator   = count of those m with m.on_time == true
      on_time_movement_pct = 100.00 if denominator == 0
                             else round_half_up(100.0 * numerator / denominator, 2)
    input_set: "VOIDED movements leave both numerator and denominator. A producer with no movements scores 100.00 (full credit, not 0/0)."
    constants:
      ON_TIME_MAX_HOURS: 72.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: premises_tag_book_balance
    trigger: "POST /reconciliation-runs/{id}/submit"
    algorithm: aggregation
    formula: |
      # basis is selected from the premises operation_type, NOT from the request
      basis = AS_ISSUED  if premises.operation_type IN {COW_CALF, FEEDLOT}
            = AS_SIGHTED if premises.operation_type IN {MARKET, HARVEST_FACILITY}

      lots  = TagLot rows with premises_id == premises.id
              AND status IN {ISSUED, ACTIVE, DEPLETED}          # RECALLED and VOIDED excluded

      if basis == AS_ISSUED:
          book_unapplied_count = sum over lots of
              (L.quantity - L.applied_count - L.retired_count - L.replaced_count - L.voided_count)

      if basis == AS_SIGHTED:
          applied_here = count(Sighting s where s.sighting_type == TAG_APPLIED
                               AND s.premises_id == premises.id
                               AND s.reversed == false
                               AND s.observed_at >= period_start T00:00:00.000Z
                               AND s.observed_at <= period_end   T23:59:59.999Z)
          book_unapplied_count = (sum over lots of L.quantity) - applied_here
    input_set: "AS_ISSUED follows the devices (a tag issued to P but applied at a sister premises still leaves P's book). AS_SIGHTED follows the events (only applications physically observed at P reduce P's book, whichever lot they came from). The two bases return different integers for the same underlying data whenever a tag crosses premises inside one producer's operation."
    constants: {}
    precision: "integer count"
    variants:
      - name: AS_ISSUED
        when: "premises.operation_type IN {COW_CALF, FEEDLOT}"
        difference: "Decrements the book by the lot's own applied/retired/replaced/voided counters regardless of where the application was observed."
      - name: AS_SIGHTED
        when: "premises.operation_type IN {MARKET, HARVEST_FACILITY}"
        difference: "Decrements the book by TAG_APPLIED sightings observed at this premises within the period, regardless of which lot supplied the serial; ignores the lot counters entirely."

  - name: reconciliation_variance
    trigger: "POST /reconciliation-runs/{id}/submit, immediately after premises_tag_book_balance"
    algorithm: threshold
    formula: |
      variance_count = physical_unapplied_count - book_unapplied_count        # signed
      variance_pct   = round_half_up(100.0 * abs(variance_count) / max(1, book_unapplied_count), 2)
      # adjudication branch at POST /reconciliation-runs/{id}/approve:
      #   variance_pct <= VARIANCE_TOLERANCE_PCT -> APPROVED
      #   variance_pct >  VARIANCE_TOLERANCE_PCT -> VARIANCE_FLAGGED (CASCADE-D)
    input_set: "Only the submitted run's own physical_unapplied_count and book_unapplied_count; prior runs are never netted in."
    constants:
      VARIANCE_TOLERANCE_PCT: 0.50
    precision: "2 decimal places, round_half_up; a variance of exactly 0.50 is inside tolerance"
    variants: []

  - name: animal_location_projection
    trigger: "Every Sighting append and every Sighting reversal (tag application, movement departure/receive/dispute/void, tag retirement, application void)"
    algorithm: projection
    formula: |
      # Replay the animal's sightings with reversed == false in ASCENDING
      # sequence_no order. sequence_no is APPEND order, not observation order:
      # a back-dated observed_at never reorders the replay.
      current = null; lifecycle = VOIDED_IF_NO_ROWS
      for s in sightings(animal) where reversed == false order by sequence_no ASC:
          if s.sighting_type == TAG_APPLIED: current = s.premises_id; lifecycle = ACTIVE
          if s.sighting_type == DEPARTURE:   current = null;          lifecycle = IN_TRANSIT
          if s.sighting_type == ARRIVAL:     current = s.premises_id; lifecycle = ACTIVE
          if s.sighting_type == HARVEST:     current = s.premises_id; lifecycle = HARVESTED
      animal.current_premises_id = current
      animal.lifecycle_status    = lifecycle          # VOIDED when zero non-reversed rows remain
      animal.sighting_count      = count(non-reversed rows)
      animal.last_sequence_no    = max(sequence_no over ALL rows, reversed included)
      # Premises roll-up, recomputed for every premises whose membership changed:
      premises.animal_count = count(Animal a where a.current_premises_id == premises.id
                                    AND a.lifecycle_status == ACTIVE)
    input_set: "Reversed sightings are retained in storage and returned by GET /sightings, but are excluded from the replay, from sighting_count and from every book-balance and trace computation. Sequence numbers are never reused."
    constants: {}
    precision: "exact"
    variants: []
    note: "Two different orderings coexist deliberately: this projection replays by sequence_no ASC (append order), while trace_scope_projection builds residency intervals by observed_at ASC with sequence_no ASC as tie-break."

  - name: trace_scope_projection
    trigger: "POST /trace-requests/{id}/run"
    algorithm: topological
    formula: |
      run_at   = logical clock now
      cutoff   = run_at - lookback_days days
      variant_applied = STRICT_INTERVAL  if pathogen_class == DIRECT_CONTACT
                      = PREMISES_WINDOW  if pathogen_class == ENVIRONMENTAL

      # residency intervals are half-open [start, end)
      def residencies(animal):
          rows = sightings(animal) where reversed == false
                 order by observed_at ASC, sequence_no ASC
          for each row that sets a location (TAG_APPLIED, ARRIVAL):
              start = row.observed_at
              end   = observed_at of the next DEPARTURE or HARVEST row, else +infinity
              emit (row.premises_id, start, end)

      def contacts(index_interval, candidate_interval):
          if variant_applied == STRICT_INTERVAL:
              return overlap_seconds(index_interval, candidate_interval) > 0
          if variant_applied == PREMISES_WINDOW:
              widened = [index_interval.start - ENV_WINDOW_DAYS days,
                         index_interval.end   + ENV_WINDOW_DAYS days)
              return overlap_seconds(widened, candidate_interval) > 0

      frontier = [index_animal]; depth = 0; hits = []
      while depth < max_hops and frontier not empty:
          depth += 1
          next_frontier = []
          for each residency R of each animal in frontier with R.end > cutoff:
              # candidate animals: any animal other than the index with a residency
              # at R.premises_id satisfying contacts(R, candidate_residency)
              for each candidate ordered by candidate_residency.start ASC,
                                            then Animal.created_at ASC:
                  if candidate already in hits: skip
                  hits.append({ animal_id, premises_id: R.premises_id, hop_depth: depth,
                                first_contact_at: max(R.start, candidate_residency.start),
                                responded: false, resolved: false })
                  next_frontier.append(candidate)
          frontier = next_frontier
      hit_count              = len(hits)
      premises_touched_count = count of distinct premises_id over hits UNION the index animal's residency premises
      hops_total             = count of distinct MovementEvent rows that produced any traversed ARRIVAL/DEPARTURE sighting
      direction filter: BACKWARD keeps residencies with R.start <= index first residency start;
                        FORWARD keeps residencies with R.start >= it; BOTH keeps all.
    input_set: "Only non-reversed sightings with the residency end after the cutoff. The index animal is never its own hit. An animal already recorded at a shallower hop_depth is never re-added at a deeper one."
    constants:
      ENV_WINDOW_DAYS: 14
    precision: "exact; intervals half-open [start, end), overlap must be strictly positive"
    variants:
      - name: STRICT_INTERVAL
        when: "pathogen_class == DIRECT_CONTACT"
        difference: "A candidate is a hit only when its residency overlaps the index residency itself with strictly positive duration; animals present at the same premises days apart are NOT hits."
      - name: PREMISES_WINDOW
        when: "pathogen_class == ENVIRONMENTAL"
        difference: "The index residency is widened by 14 days on both sides before intersecting, so animals that occupied the premises up to 14 days before the index arrived or 14 days after it left ARE hits."

  - name: trace_completeness_score
    trigger: "POST /trace-requests/{id}/close"
    algorithm: weighted_scoring
    formula: |
      # EMPTY-SET GUARD, evaluated first and short-circuiting the weighted formula:
      if hit_count == 0:
          completeness_score = 100.00        # nothing to trace is fully traced
      else:
          responded_ratio = count(hits where responded == true) / hit_count
          resolved_ratio  = count(hits where resolved  == true) / hit_count
          reach_ratio     = 1.0 - min(1.0, hops_unreachable / max(1, hops_total))
          raw             = W_RESPONDED * min(1.0, responded_ratio)
                          + W_RESOLVED  * min(1.0, resolved_ratio)
                          + W_REACH     * reach_ratio
          stale_premises  = 1 if any hit premises has registration_status != ACTIVE else 0
          disputed_hops   = count of traversed MovementEvent rows with status == DISPUTED at close
          penalty         = STALE_PREMISES_PENALTY * stale_premises
                          + min(DISPUTE_PENALTY_CAP, DISPUTE_PENALTY_EACH * disputed_hops)
          completeness_score = round_half_up(max(0.00, min(100.00, raw - penalty)), 2)
    input_set: "hits as frozen by the run, with responded/resolved flags as they stand at close. hops_unreachable counts traversed movements in status DISPUTED or VOIDED; disputed_hops counts only DISPUTED, so a voided hop lowers reach_ratio without adding the dispute penalty."
    constants:
      W_RESPONDED: 40.0
      W_RESOLVED: 35.0
      W_REACH: 25.0
      STALE_PREMISES_PENALTY: 10.0
      DISPUTE_PENALTY_EACH: 5.0
      DISPUTE_PENALTY_CAP: 15.0
    precision: "2 decimal places, round_half_up"
    variants: []
    note: "Without the guard an empty hit set would score 25.00 through the weighted formula (0 + 0 + 25 * 1.0); the guard is what makes an uneventful trace meet the program goal."

  - name: trace_goal_evaluation
    trigger: "POST /trace-requests/{id}/close, immediately after trace_completeness_score"
    algorithm: threshold
    formula: |
      elapsed_hours  = round_half_up((closed_at - opened_at) total_seconds / 3600.0, 2)
      trace_goal_met = (elapsed_hours <= TRACE_GOAL_HOURS)
                       AND (completeness_score >= MIN_COMPLETENESS)
    input_set: "opened_at is the logical clock at create; closed_at is the logical clock at close. Both boundaries are inclusive: exactly 48.00 hours and exactly 80.00 points still meet the goal."
    constants:
      TRACE_GOAL_HOURS: 48.00
      MIN_COMPLETENESS: 80.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: incentive_award_amount
    trigger: "POST /incentive-awards"
    algorithm: waterfall_allocation
    formula: |
      tier_factor = 0.00 if enrolled_head_count == 0                  # TIER_0
                  = 1.00 if 1   <= enrolled_head_count <= 99          # TIER_1
                  = 1.15 if 100 <= enrolled_head_count <= 499         # TIER_2
                  = 1.30 if enrolled_head_count >= 500                # TIER_3

      compliance_multiplier = 1.25 if on_time_movement_pct >= 95.00
                            = 1.00 if 80.00 <= on_time_movement_pct < 95.00
                            = 0.60 if 50.00 <= on_time_movement_pct < 80.00
                            = 0.00 if on_time_movement_pct < 50.00

      # PINNED ROUNDING ORDER: round EACH premises line to whole cents, THEN sum.
      # Summing the unrounded products and rounding once at the end is WRONG and
      # yields a different integer whenever the fractional parts accumulate.
      lines = []
      for p in premises(producer) where registration_status == ACTIVE
              order by p.created_at ASC:
          line_cents = round_half_up(BASE_RATE_CENTS_PER_HEAD * p.animal_count
                                     * tier_factor * compliance_multiplier)
          lines.append({ premises_id: p.id, animal_count: p.animal_count, line_cents: line_cents })
      awarded_cents = sum(l.line_cents for l in lines)
      head_count_snapshot = producer.enrolled_head_count
    input_set: "Only premises with registration_status == ACTIVE at the accrual instant; SUSPENDED and PENDING_REVIEW premises contribute no line at all (not a zero line). animal_count is the live ACTIVE-animal count, so IN_TRANSIT, HARVESTED and VOIDED animals are excluded."
    constants:
      BASE_RATE_CENTS_PER_HEAD: 137
    precision: "integer cents; round_half_up per line, never on the sum"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority; the
# first failing rule decides the response and no side effect is applied)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Per-field request shape only: every required body field present; scalar types correct; enum members recognised; pin matches ^[0-9A-Z]{7}$; supplier_code matches ^[A-Z0-9]{4}$; ain matches ^[0-9]{15}$; capacity >= 1; defect_count >= 1; forgiven_defects >= 0; physical_unapplied_count >= 0; lookback_days in [1,365]; max_hops in [1,5]; serial_start and serial_end in [100000000000, 999999999999]; limit in [1,100]; offset >= 0. Cross-field comparisons are NOT checked here."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path-segment resource resolves, validated left to right (e.g. trace request before hit animal)"
    error_id: "ERR_PRODUCER_NOT_FOUND | ERR_PREMISES_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_TAG_LOT_NOT_FOUND | ERR_TAG_NOT_FOUND | ERR_ANIMAL_NOT_FOUND | ERR_SIGHTING_NOT_FOUND | ERR_MOVEMENT_NOT_FOUND | ERR_TRACE_REQUEST_NOT_FOUND | ERR_HOLD_ORDER_NOT_FOUND | ERR_RECONCILIATION_RUN_NOT_FOUND | ERR_AWARD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves; for POST /trace-requests/{id}/hits/{animalId}/respond the animal must additionally appear in the run's hits, else ERR_TRACE_HIT_NOT_FOUND"
    error_id: "ERR_PRODUCER_NOT_FOUND | ERR_PREMISES_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_ANIMAL_NOT_FOUND | ERR_TAG_LOT_NOT_FOUND | ERR_TRACE_REQUEST_NOT_FOUND | ERR_TRACE_HIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with foreign keys in the body"

  - priority: 6
    category: auth
    check: "Ownership for entity-backed roles: Producer acts only on premises/animals/lots/runs/holds whose owning Producer.id == X-User-ID; DeviceSupplierRep only on supplier_id == X-User-ID; HarvestFacilityOperator only on harvest_premises_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /premises, POST /producers/{id}/enroll, POST /tag-lots, POST /tag-lots/{id}/apply-tag, POST /tags/{id}/replace, POST /tags/{id}/retire, POST /movement-events, POST /movement-events/{id}/receive, POST /movement-events/{id}/correct, POST /hold-orders/{id}/appeal, POST /reconciliation-runs, POST /reconciliation-runs/{id}/submit"

  - priority: 7
    category: auth
    check: "Producer privacy gate on animal and sighting reads. Producer: only animals whose birth_premises or current_premises belongs to X-User-ID. HarvestFacilityOperator: only animals with current_premises_id == X-User-ID. StateAnimalHealthOfficial: any animal whose owning producer privacy_level == STANDARD, but a RESTRICTED producer's animal only when its trace_status IN {TRACE_HIT, CLEARED}. FederalTraceAnalyst: only animals that are the index_animal of some TraceRequest or appear in some TraceRequest.hits, regardless of privacy_level. ProgramAdmin: unrestricted. List endpoints silently drop unreadable rows instead of erroring."
    error_id: ERR_DATA_ACCESS_DENIED
    http_status: 403
    applies_to: "GET /animals/{id}, GET /sightings/{id}"

  - priority: 8
    category: auth
    check: "Segregation of duties: the ProgramAdmin approving a DeviceSupplier must differ from registered_by_user_id; the FederalTraceAnalyst closing a TraceRequest must differ from opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /device-suppliers/{id}/approve, POST /trace-requests/{id}/close"

  - priority: 9
    category: state
    check: "Optimistic concurrency: expected_supplier_version equals DeviceSupplier.version (POST /tag-lots); expected_premises_version equals Premises.version (POST /reconciliation-runs, POST /hold-orders)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tag-lots, POST /reconciliation-runs, POST /hold-orders"

  - priority: 10
    category: state
    check: "The target resource is in a state the requested transition declares as a valid `from` state in section 1.2. A TagLot whose status was forced by an external event - RECALLED or VOIDED - cannot receive an application (ERR_LOT_NOT_ISSUABLE); a DEPLETED lot is instead a capacity failure handled at priority 16; every other invalid transition returns ERR_INVALID_STATE"
    error_id: "ERR_INVALID_STATE | ERR_LOT_NOT_ISSUABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 11
    category: state
    check: "Cross-entity state gates: the lot's DeviceSupplier.status must be APPROVED to issue a lot or apply/replace a tag (ERR_SUPPLIER_NOT_APPROVED); the premises registration_status must be ACTIVE to apply tags, report movements, receive movements, retire tags or be issued a lot (ERR_PREMISES_NOT_ACTIVE); the premises health_status must not be QUARANTINED to apply tags, depart, receive, correct or retire (ERR_PREMISES_UNDER_HOLD); a hold cannot be released or its trace cancelled while the linked TraceRequest.status == RUNNING (ERR_TRACE_STILL_OPEN); a trace cannot be closed while a linked HoldOrder is PROPOSED or UNDER_APPEAL (ERR_HOLD_PENDING); an award cannot be accrued or paid unless Producer.enrollment_status == ENROLLED (ERR_PRODUCER_NOT_ENROLLED); enrollment requires at least one ACTIVE premises (ERR_NO_ACTIVE_PREMISES)"
    error_id: "ERR_SUPPLIER_NOT_APPROVED | ERR_PREMISES_NOT_ACTIVE | ERR_PREMISES_UNDER_HOLD | ERR_TRACE_STILL_OPEN | ERR_HOLD_PENDING | ERR_PRODUCER_NOT_ENROLLED | ERR_NO_ACTIVE_PREMISES"
    http_status: 409
    applies_to: "POST /tag-lots, POST /tag-lots/{id}/apply-tag, POST /tags/{id}/replace, POST /tags/{id}/retire, POST /movement-events, POST /movement-events/{id}/receive, POST /movement-events/{id}/correct, POST /hold-orders/{id}/release, POST /trace-requests/{id}/close, POST /trace-requests/{id}/cancel, POST /incentive-awards, POST /incentive-awards/{id}/pay, POST /producers/{id}/enroll"

  - priority: 12
    category: business_safety
    check: "Regulatory interval safety. A movement whose origin and destination state_code differ requires a non-null icvi_number (ERR_ICVI_REQUIRED). A new HoldOrder whose effective_from is earlier than premises.last_hold_released_at + 72 hours is refused (ERR_HOLD_COOLDOWN_ACTIVE). A new HoldOrder whose half-open window [effective_from, effective_until) intersects the window of any existing hold on the same premises with status IN {PROPOSED, ACTIVE, UNDER_APPEAL} is refused (ERR_HOLD_WINDOW_OVERLAP); windows that merely touch (previous.effective_until == new.effective_from) do NOT intersect."
    error_id: "ERR_ICVI_REQUIRED | ERR_HOLD_COOLDOWN_ACTIVE | ERR_HOLD_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /movement-events, POST /movement-events/{id}/correct, POST /hold-orders"

  - priority: 13
    category: business_temporal
    check: "Cross-field temporal checks. effective_until > effective_from and period_end >= period_start (ERR_INVALID_WINDOW); arrived_at >= departed_at (ERR_INVALID_WINDOW); departed_at, arrived_at and harvested_at may not exceed the logical clock now (ERR_FUTURE_TIMESTAMP); departed_at and harvested_at must be >= the observed_at of the animal's highest non-reversed sequence_no sighting (ERR_BACKDATED_EVENT)"
    error_id: "ERR_INVALID_WINDOW | ERR_FUTURE_TIMESTAMP | ERR_BACKDATED_EVENT"
    http_status: 422
    applies_to: "POST /movement-events, POST /movement-events/{id}/receive, POST /movement-events/{id}/correct, POST /tags/{id}/retire, POST /hold-orders, POST /reconciliation-runs, POST /incentive-awards"

  - priority: 14
    category: business_referential
    check: "Referential coherence. The ain's trailing 12 digits must be a serial inside [serial_start, serial_end] of the addressed lot and its leading 3 digits must equal the supplier's aid_prefix (ERR_AIN_OUT_OF_LOT_RANGE). The lot's premises and the target premises must belong to the same Producer (ERR_LOT_PREMISES_MISMATCH). The animal being retired must have current_premises_id == harvest_premises_id (ERR_ANIMAL_NOT_AT_PREMISES) at a premises whose operation_type == HARVEST_FACILITY (ERR_NOT_HARVEST_FACILITY). A movement's origin_premises_id must equal the animal's current_premises_id (ERR_ANIMAL_NOT_AT_PREMISES) and must differ from destination_premises_id (ERR_SAME_PREMISES_MOVE)."
    error_id: "ERR_AIN_OUT_OF_LOT_RANGE | ERR_LOT_PREMISES_MISMATCH | ERR_ANIMAL_NOT_AT_PREMISES | ERR_NOT_HARVEST_FACILITY | ERR_SAME_PREMISES_MOVE"
    http_status: 422
    applies_to: "POST /tag-lots/{id}/apply-tag, POST /tags/{id}/replace, POST /tags/{id}/retire, POST /movement-events"

  - priority: 15
    category: business_constraint
    check: "Uniqueness and bounded-repetition constraints. pin, supplier_code and ain are globally unique (ERR_DUPLICATE_PIN, ERR_DUPLICATE_SUPPLIER_CODE, ERR_DUPLICATE_AIN). A new lot's closed serial interval [serial_start, serial_end] must not intersect any existing lot of the same supplier with status != VOIDED; abutting intervals (previous.serial_end + 1 == new.serial_start) are allowed (ERR_SERIAL_RANGE_OVERLAP). correction_count < 3 (ERR_CORRECTION_LIMIT_EXCEEDED); appeal_count < 2 (ERR_APPEAL_LIMIT_EXCEEDED). A corrected departed_at may not be later than the movement's already recorded arrived_at, which would leave the animal resident at the origin after it had already arrived at the destination (ERR_RESIDENCY_OVERLAP). At most one IncentiveAward per (producer_id, period_start, period_end) in status IN {ACCRUED, PAID} (ERR_AWARD_PERIOD_DUPLICATE)."
    error_id: "ERR_DUPLICATE_PIN | ERR_DUPLICATE_SUPPLIER_CODE | ERR_DUPLICATE_AIN | ERR_SERIAL_RANGE_OVERLAP | ERR_CORRECTION_LIMIT_EXCEEDED | ERR_APPEAL_LIMIT_EXCEEDED | ERR_RESIDENCY_OVERLAP | ERR_AWARD_PERIOD_DUPLICATE"
    http_status: 409
    applies_to: "POST /premises, POST /device-suppliers, POST /tag-lots, POST /tag-lots/{id}/apply-tag, POST /tags/{id}/replace, POST /movement-events, POST /movement-events/{id}/correct, POST /hold-orders/{id}/appeal, POST /incentive-awards"

  - priority: 16
    category: business_fiscal
    check: "Capacity and quota, evaluated last against pre-request state. A new lot's quantity must be <= the supplier's current issuance_cap (ERR_ISSUANCE_CAP_EXCEEDED). A lot with unapplied_count == 0, i.e. status DEPLETED, cannot supply another application (ERR_LOT_EXHAUSTED). destination/birth Premises.animal_count + 1 must be <= capacity (ERR_PREMISES_AT_CAPACITY)."
    error_id: "ERR_ISSUANCE_CAP_EXCEEDED | ERR_LOT_EXHAUSTED | ERR_PREMISES_AT_CAPACITY"
    http_status: 409
    applies_to: "POST /tag-lots, POST /tag-lots/{id}/apply-tag, POST /tags/{id}/replace, POST /movement-events/{id}/receive"

# =============================================================================
# 1.5 API Endpoint Table
# All collections are top-level. Fields suffixed with `?` are optional.
# List endpoints additionally accept `limit?` and `offset?` per the envelope.
# =============================================================================
endpoints:

  # --- Producer -------------------------------------------------------------
  - method: POST
    path: "/producers"
    description: "Register a producer/operator in the traceability program."
    roles: [ProgramAdmin]
    code: 201
    input: ["legal_name", "contact_email", "state_code", "privacy_level?"]
    output: Producer
    side_effects: ["enrollment_status initialised to NOT_ENROLLED", "incentive_tier initialised to TIER_0", "on_time_movement_pct initialised to 100.00"]

  - method: GET
    path: "/producers/{id}"
    description: "Read one producer."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst]
    code: 200
    input: []
    output: Producer
    side_effects: []

  - method: POST
    path: "/producers/{id}/enroll"
    description: "Enroll (or re-enroll) the producer in the incentive program."
    roles: [Producer]
    code: 200
    input: []
    output: Producer
    side_effects: ["enrollment_status NOT_ENROLLED|LAPSED -> ENROLLED", "stamps enrolled_at from the logical clock", "recomputes enrolled_head_count and incentive_tier"]

  - method: GET
    path: "/producers/{id}/incentive-awards"
    description: "List the incentive awards accrued for this producer (FK reverse lookup for IncentiveAward.producer_id)."
    roles: [Producer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IncentiveAward[]
    side_effects: []

  # --- Premises -------------------------------------------------------------
  - method: POST
    path: "/premises"
    description: "Register a premises; starts PENDING_REVIEW / CLEAR."
    roles: [Producer]
    code: 201
    input: ["producer_id", "pin", "operation_type", "state_code", "capacity"]
    output: Premises
    side_effects: ["registration_status = PENDING_REVIEW", "health_status = CLEAR", "animal_count = 0"]

  - method: GET
    path: "/premises/{id}"
    description: "Read one premises."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst, HarvestFacilityOperator, DeviceSupplierRep]
    code: 200
    input: []
    output: Premises
    side_effects: []

  - method: GET
    path: "/premises"
    description: "List premises (FK reverse lookup for Premises.producer_id)."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial]
    code: 200
    input: ["producer_id?", "state_code?", "operation_type?", "registration_status?", "health_status?", "limit?", "offset?"]
    output: Premises[]
    side_effects: []

  - method: POST
    path: "/premises/{id}/approve"
    description: "Approve a pending premises registration."
    roles: [StateAnimalHealthOfficial]
    code: 200
    input: []
    output: Premises
    side_effects: ["registration_status PENDING_REVIEW -> ACTIVE", "recomputes owning Producer.enrolled_head_count and incentive_tier"]

  - method: GET
    path: "/premises/{id}/reconciliation-runs"
    description: "List reconciliation runs for a premises (FK reverse lookup for ReconciliationRun.premises_id)."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []

  # --- DeviceSupplier -------------------------------------------------------
  - method: POST
    path: "/device-suppliers"
    description: "Register a tag device supplier for review."
    roles: [ProgramAdmin]
    code: 201
    input: ["company_name", "supplier_code", "aid_prefix?"]
    output: DeviceSupplier
    side_effects: ["status = PENDING_REVIEW", "registered_by_user_id = acting X-User-ID", "conformance_score = 100.00, probation = false, issuance_cap = 10000"]

  - method: GET
    path: "/device-suppliers/{id}"
    description: "Read one device supplier."
    roles: [ProgramAdmin, DeviceSupplierRep]
    code: 200
    input: []
    output: DeviceSupplier
    side_effects: []

  - method: POST
    path: "/device-suppliers/{id}/approve"
    description: "Approve a supplier for device issuance. The approving admin must differ from the registering admin."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: DeviceSupplier
    side_effects: ["status PENDING_REVIEW -> APPROVED", "sets approved_by_user_id", "recomputes conformance_score, probation, issuance_cap"]

  - method: POST
    path: "/device-suppliers/{id}/defect-reports"
    description: "Record device defect reports against a supplier; may auto-suspend or auto-revoke."
    roles: [StateAnimalHealthOfficial, ProgramAdmin]
    code: 200
    input: ["defect_count", "note?"]
    output: DeviceSupplier
    side_effects: ["defect_report_count increases by defect_count", "recomputes conformance_score, probation, issuance_cap", "APPROVED -> SUSPENDED when score < 70.00; SUSPENDED -> REVOKED when score < 40.00", "on suspension or revocation, every ISSUED/ACTIVE TagLot of this supplier transitions to RECALLED"]

  - method: POST
    path: "/device-suppliers/{id}/reinstate"
    description: "Reinstate a suspended supplier after corrective action forgives part of its defect history."
    roles: [ProgramAdmin]
    code: 200
    input: ["forgiven_defects"]
    output: DeviceSupplier
    side_effects: ["defect_report_count decreases by forgiven_defects (floored at 0)", "recomputes conformance_score, probation, issuance_cap", "status SUSPENDED -> APPROVED when the recomputed score >= 70.00", "RECALLED lots are not restored"]

  # --- TagLot ---------------------------------------------------------------
  - method: POST
    path: "/tag-lots"
    description: "Issue a serial range of AIN devices from an approved supplier to a premises. OCC-guarded on the supplier."
    roles: [DeviceSupplierRep]
    code: 201
    input: ["supplier_id", "premises_id", "serial_start", "serial_end", "expected_supplier_version"]
    output: TagLot
    side_effects: ["computes quantity, fee_cents, discount_pct_applied and surcharge_cents per calculations.tag_lot_issuance_fee", "increments DeviceSupplier.version by 1", "recomputes DeviceSupplier.issued_tag_count, conformance_score, probation and issuance_cap"]

  - method: GET
    path: "/tag-lots/{id}"
    description: "Read one tag lot."
    roles: [DeviceSupplierRep, Producer, ProgramAdmin, StateAnimalHealthOfficial]
    code: 200
    input: []
    output: TagLot
    side_effects: []

  - method: GET
    path: "/tag-lots"
    description: "List tag lots (FK reverse lookup for TagLot.supplier_id and TagLot.premises_id)."
    roles: [DeviceSupplierRep, Producer, ProgramAdmin, StateAnimalHealthOfficial]
    code: 200
    input: ["supplier_id?", "premises_id?", "status?", "limit?", "offset?"]
    output: TagLot[]
    side_effects: []

  - method: POST
    path: "/tag-lots/{id}/void"
    description: "Void an untouched lot."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: TagLot
    side_effects: ["status ISSUED -> VOIDED", "recomputes DeviceSupplier.issued_tag_count, conformance_score, probation and issuance_cap", "increments DeviceSupplier.version by 1"]

  - method: POST
    path: "/tag-lots/{id}/apply-tag"
    description: "Apply one device from this lot to a newly identified animal. Materialises the Tag, the Animal and the TAG_APPLIED sighting in one request."
    roles: [Producer]
    code: 201
    input: ["ain", "species", "birth_date", "birth_premises_id"]
    output: Animal
    side_effects: ["materialises Tag(device_status=APPLIED, applied_at=clock now)", "creates Animal(lifecycle_status=ACTIVE, trace_status=NORMAL, current_premises_id=birth_premises_id, ain)", "appends Sighting(TAG_APPLIED, sequence_no=1, observed_at=clock now)", "TagLot.applied_count +1, unapplied_count -1, status ISSUED -> ACTIVE on the first application and ACTIVE -> DEPLETED when unapplied_count reaches 0", "Premises.animal_count +1", "recomputes Producer.enrolled_head_count and incentive_tier"]

  # --- Tag ------------------------------------------------------------------
  - method: GET
    path: "/tags/{id}"
    description: "Read one tag device."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, HarvestFacilityOperator, DeviceSupplierRep]
    code: 200
    input: []
    output: Tag
    side_effects: []

  - method: GET
    path: "/tags"
    description: "List tag devices (FK reverse lookup for Tag.tag_lot_id, Tag.animal_id and Tag.replaces_tag_id)."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, HarvestFacilityOperator, DeviceSupplierRep]
    code: 200
    input: ["tag_lot_id?", "animal_id?", "replaces_tag_id?", "device_status?", "ain?", "limit?", "offset?"]
    output: Tag[]
    side_effects: []

  - method: POST
    path: "/tags/{id}/replace"
    description: "Replace a lost or unreadable device with a new AIN on the same animal."
    roles: [Producer]
    code: 201
    input: ["replacement_ain", "tag_lot_id"]
    output: Tag
    side_effects: ["old tag device_status APPLIED -> REPLACED", "new Tag created with replaces_tag_id = old tag id, device_status = APPLIED", "old lot applied_count -1 / replaced_count +1; new lot applied_count +1 / unapplied_count -1 and ISSUED -> ACTIVE or ACTIVE -> DEPLETED as applicable", "Animal.ain re-derived from the replacement device", "no sighting is appended"]

  - method: POST
    path: "/tags/{id}/retire"
    description: "Retire the device at harvest and close out the animal."
    roles: [HarvestFacilityOperator]
    code: 200
    input: ["harvest_premises_id", "harvested_at", "carcass_ref", "tag_returned"]
    output: Tag
    side_effects: ["CASCADE-B: device_status APPLIED -> RETIRED (hop 1) -> TagLot.applied_count -1 / retired_count +1 and ACTIVE -> DEPLETED when unapplied_count is 0 (hop 2) -> DeviceSupplier.retired_tag_count / retired_returned_count / conformance_score / probation / issuance_cap recomputed (hop 3) -> APPROVED -> SUSPENDED when the score falls below 70.00 (hop 4)", "appends Sighting(HARVEST, observed_at=harvested_at)", "Animal.lifecycle_status ACTIVE -> HARVESTED", "Premises.animal_count -1 and owning Producer.enrolled_head_count / incentive_tier recomputed"]

  - method: POST
    path: "/tags/{id}/void-application"
    description: "Compensating action: void an erroneous tag application, returning the device count to the lot."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Tag
    side_effects: ["device_status APPLIED -> VOIDED", "TagLot.applied_count -1 / voided_count +1, preserving quantity == unapplied_count + applied_count + retired_count + replaced_count + voided_count", "all of the animal's sightings marked reversed = true", "Animal.lifecycle_status -> VOIDED, sighting_count -> 0", "Premises.animal_count -1 and owning Producer.enrolled_head_count / incentive_tier recomputed"]

  # --- Animal & Sighting ----------------------------------------------------
  - method: GET
    path: "/animals/{id}"
    description: "Read one animal, subject to the producer privacy gate."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst, HarvestFacilityOperator]
    code: 200
    input: []
    output: Animal
    side_effects: []

  - method: GET
    path: "/animals"
    description: "List animals (FK reverse lookup for Animal.birth_premises_id and Animal.current_premises_id). Rows the caller may not read are omitted."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst, HarvestFacilityOperator]
    code: 200
    input: ["birth_premises_id?", "current_premises_id?", "species?", "lifecycle_status?", "trace_status?", "ain?", "limit?", "offset?"]
    output: Animal[]
    side_effects: []

  - method: GET
    path: "/sightings/{id}"
    description: "Read one sighting, subject to the producer privacy gate on its animal."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst, HarvestFacilityOperator]
    code: 200
    input: []
    output: Sighting
    side_effects: []

  - method: GET
    path: "/sightings"
    description: "Sighting history (FK reverse lookup for Sighting.animal_id, Sighting.premises_id and Sighting.source_movement_id). Reversed rows are excluded unless include_reversed is true; rows are ordered by sequence_no ASC."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst, HarvestFacilityOperator]
    code: 200
    input: ["animal_id?", "premises_id?", "source_movement_id?", "sighting_type?", "include_reversed?", "limit?", "offset?"]
    output: Sighting[]
    side_effects: []

  # --- MovementEvent --------------------------------------------------------
  - method: POST
    path: "/movement-events"
    description: "Report a departure; opens an in-transit movement."
    roles: [Producer]
    code: 201
    input: ["animal_id", "origin_premises_id", "destination_premises_id", "departed_at", "icvi_number?"]
    output: MovementEvent
    side_effects: ["status = REPORTED, reported_at = clock now (frozen)", "computes interstate, reporting_lag_hours and on_time per calculations.movement_reporting_timeliness", "appends Sighting(DEPARTURE, observed_at=departed_at)", "Animal ACTIVE -> IN_TRANSIT, current_premises_id -> null", "origin Premises.animal_count -1", "recomputes the origin producer's on_time_movement_pct, enrolled_head_count and incentive_tier"]

  - method: GET
    path: "/movement-events/{id}"
    description: "Read one movement event."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst]
    code: 200
    input: []
    output: MovementEvent
    side_effects: []

  - method: GET
    path: "/movement-events"
    description: "List movement events (FK reverse lookup for MovementEvent.animal_id, origin_premises_id and destination_premises_id)."
    roles: [Producer, ProgramAdmin, StateAnimalHealthOfficial, FederalTraceAnalyst]
    code: 200
    input: ["animal_id?", "origin_premises_id?", "destination_premises_id?", "status?", "on_time?", "limit?", "offset?"]
    output: MovementEvent[]
    side_effects: []

  - method: POST
    path: "/movement-events/{id}/receive"
    description: "Confirm arrival at the destination premises."
    roles: [Producer]
    code: 200
    input: ["arrived_at"]
    output: MovementEvent
    side_effects: ["CASCADE-A: status REPORTED -> RECEIVED (hop 1) -> Sighting(ARRIVAL, observed_at=arrived_at) appended (hop 2) -> Animal re-projected to lifecycle_status ACTIVE with current_premises_id = destination (hop 3) -> destination Premises.animal_count +1 (hop 4) -> destination Producer.enrolled_head_count and incentive_tier recomputed (hop 5)"]

  - method: POST
    path: "/movement-events/{id}/dispute"
    description: "Dispute a reported or received movement."
    roles: [StateAnimalHealthOfficial]
    code: 200
    input: ["reason?"]
    output: MovementEvent
    side_effects: ["status REPORTED|RECEIVED -> DISPUTED", "conditional cascade when the prior status was RECEIVED: the ARRIVAL sighting is reversed, the Animal returns to IN_TRANSIT and destination Premises.animal_count -1"]

  - method: POST
    path: "/movement-events/{id}/correct"
    description: "Correct and re-report a disputed movement (bounded correction cycle)."
    roles: [Producer]
    code: 200
    input: ["departed_at", "icvi_number?"]
    output: MovementEvent
    side_effects: ["status DISPUTED -> REPORTED, correction_count +1", "rewrites departed_at and the DEPARTURE sighting's observed_at", "recomputes reporting_lag_hours = (frozen reported_at - corrected departed_at) and on_time, then the origin producer's on_time_movement_pct"]

  - method: POST
    path: "/movement-events/{id}/void"
    description: "Compensating action: void a disputed movement and unwind its sightings."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MovementEvent
    side_effects: ["status DISPUTED -> VOIDED", "every Sighting with source_movement_id == this movement is marked reversed = true", "the Animal is re-projected back to origin_premises_id with lifecycle_status ACTIVE and origin Premises.animal_count +1, restoring origin.animal_count + destination.animal_count", "recomputes the origin producer's on_time_movement_pct with this movement removed from the denominator"]

  # --- TraceRequest ---------------------------------------------------------
  - method: POST
    path: "/trace-requests"
    description: "Open a disease traceback; starts the 48-hour trace goal clock."
    roles: [FederalTraceAnalyst]
    code: 201
    input: ["index_animal_id", "pathogen_class", "direction", "lookback_days", "max_hops"]
    output: TraceRequest
    side_effects: ["status = SUBMITTED", "opened_at = clock now, opened_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/trace-requests/{id}"
    description: "Read one trace request including its hits array."
    roles: [FederalTraceAnalyst, StateAnimalHealthOfficial, ProgramAdmin]
    code: 200
    input: []
    output: TraceRequest
    side_effects: []

  - method: GET
    path: "/trace-requests"
    description: "List trace requests (FK reverse lookup for TraceRequest.index_animal_id)."
    roles: [FederalTraceAnalyst, StateAnimalHealthOfficial, ProgramAdmin]
    code: 200
    input: ["index_animal_id?", "status?", "trace_goal_met?", "limit?", "offset?"]
    output: TraceRequest[]
    side_effects: []

  - method: POST
    path: "/trace-requests/{id}/run"
    description: "Execute the traceback over the sighting graph and freeze the hit set."
    roles: [FederalTraceAnalyst]
    code: 200
    input: []
    output: TraceRequest
    side_effects: ["status SUBMITTED -> RUNNING", "selects variant_applied and computes hits, hit_count, premises_touched_count and hops_total per calculations.trace_scope_projection", "every hit animal transitions trace_status NORMAL -> TRACE_HIT"]

  - method: POST
    path: "/trace-requests/{id}/hits/{animalId}/respond"
    description: "State official records a response for one hit animal."
    roles: [StateAnimalHealthOfficial]
    code: 200
    input: ["resolved"]
    output: TraceRequest
    side_effects: ["sets hits[animal_id].responded = true and hits[animal_id].resolved = the supplied flag"]

  - method: POST
    path: "/trace-requests/{id}/close"
    description: "Close the traceback and score it against the 48-hour program goal. The closing analyst must differ from the opening analyst."
    roles: [FederalTraceAnalyst]
    code: 200
    input: []
    output: TraceRequest
    side_effects: ["status RUNNING -> COMPLETED", "sets closed_at and closed_by_user_id", "recomputes hops_unreachable, then completeness_score and trace_goal_met per calculations.trace_completeness_score and calculations.trace_goal_evaluation"]

  - method: POST
    path: "/trace-requests/{id}/cancel"
    description: "Abandon a traceback."
    roles: [FederalTraceAnalyst]
    code: 200
    input: []
    output: TraceRequest
    side_effects: ["status SUBMITTED|RUNNING -> CANCELLED", "completeness_score and trace_goal_met stay null; hit animals keep trace_status TRACE_HIT"]

  # --- HoldOrder ------------------------------------------------------------
  - method: POST
    path: "/hold-orders"
    description: "Propose a quarantine hold on a premises. OCC-guarded on the premises."
    roles: [StateAnimalHealthOfficial]
    code: 201
    input: ["premises_id", "effective_from", "effective_until", "expected_premises_version", "trace_request_id?"]
    output: HoldOrder
    side_effects: ["status = PROPOSED, issued_by_user_id = acting X-User-ID", "Premises.pending_hold_count +1 and Premises.version +1"]

  - method: GET
    path: "/hold-orders/{id}"
    description: "Read one hold order."
    roles: [StateAnimalHealthOfficial, Producer, ProgramAdmin]
    code: 200
    input: []
    output: HoldOrder
    side_effects: []

  - method: GET
    path: "/hold-orders"
    description: "List hold orders (FK reverse lookup for HoldOrder.premises_id and HoldOrder.trace_request_id)."
    roles: [StateAnimalHealthOfficial, Producer, ProgramAdmin]
    code: 200
    input: ["premises_id?", "trace_request_id?", "status?", "limit?", "offset?"]
    output: HoldOrder[]
    side_effects: []

  - method: POST
    path: "/hold-orders/{id}/activate"
    description: "Activate a proposed hold and quarantine the premises."
    roles: [StateAnimalHealthOfficial]
    code: 200
    input: []
    output: HoldOrder
    side_effects: ["CASCADE-C: status PROPOSED -> ACTIVE (hop 1) -> Premises.health_status -> QUARANTINED (hop 1) -> every REPORTED movement departing that premises becomes DISPUTED (hop 2), each disputed movement's animal becomes TRACE_HIT (hop 2b) -> each disputed movement's destination premises moves CLEAR -> UNDER_INVESTIGATION (hop 3)"]

  - method: POST
    path: "/hold-orders/{id}/appeal"
    description: "Producer appeals an active hold (bounded at 2 appeals)."
    roles: [Producer]
    code: 200
    input: ["grounds?"]
    output: HoldOrder
    side_effects: ["status ACTIVE -> UNDER_APPEAL, appeal_count +1", "Premises.health_status stays QUARANTINED"]

  - method: POST
    path: "/hold-orders/{id}/deny-appeal"
    description: "Deny an appeal and restore the hold to ACTIVE."
    roles: [StateAnimalHealthOfficial]
    code: 200
    input: []
    output: HoldOrder
    side_effects: ["status UNDER_APPEAL -> ACTIVE"]

  - method: POST
    path: "/hold-orders/{id}/release"
    description: "Release the hold and lift the quarantine, arming the 72-hour cooldown."
    roles: [StateAnimalHealthOfficial]
    code: 200
    input: []
    output: HoldOrder
    side_effects: ["status ACTIVE|UNDER_APPEAL -> RELEASED, released_at = clock now", "Premises.pending_hold_count -1, health_status QUARANTINED -> CLEAR, last_hold_released_at = clock now", "animals resident at the premises transition trace_status TRACE_HIT -> CLEARED"]

  # --- ReconciliationRun ----------------------------------------------------
  - method: POST
    path: "/reconciliation-runs"
    description: "Open a tag-inventory reconciliation for a premises period. OCC-guarded on the premises; supersedes any overlapping DRAFT run."
    roles: [Producer]
    code: 201
    input: ["premises_id", "period_start", "period_end", "expected_premises_version"]
    output: ReconciliationRun
    side_effects: ["status = DRAFT", "any DRAFT run on the same premises whose period overlaps transitions to SUPERSEDED", "Premises.last_reconciliation_run_at = clock now and Premises.version +1"]

  - method: POST
    path: "/reconciliation-runs/{id}/submit"
    description: "Submit the physical unapplied-device count and compute the book balance and variance."
    roles: [Producer]
    code: 200
    input: ["physical_unapplied_count"]
    output: ReconciliationRun
    side_effects: ["status DRAFT -> SUBMITTED, submitted_by_user_id set", "selects basis and computes book_unapplied_count, variance_count and variance_pct per calculations.premises_tag_book_balance and calculations.reconciliation_variance"]

  - method: POST
    path: "/reconciliation-runs/{id}/approve"
    description: "Adjudicate a submitted run; branches on the variance tolerance boundary."
    roles: [StateAnimalHealthOfficial]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: ["variance_pct <= 0.50: status -> APPROVED and a SUSPENDED premises is reinstated to ACTIVE", "variance_pct > 0.50: CASCADE-D — status -> VARIANCE_FLAGGED (hop 1) -> Premises.registration_status ACTIVE -> SUSPENDED (hop 2) -> owning Producer.enrolled_head_count recomputed and enrollment_status ENROLLED -> LAPSED when no ACTIVE premises remain (hop 3)", "sets approved_by_user_id"]

  # --- IncentiveAward -------------------------------------------------------
  - method: POST
    path: "/incentive-awards"
    description: "Accrue the enrollment incentive for one producer period."
    roles: [ProgramAdmin]
    code: 201
    input: ["producer_id", "period_start", "period_end"]
    output: IncentiveAward
    side_effects: ["status = ACCRUED", "freezes head_count_snapshot, tier_factor and compliance_multiplier, then computes line_items and awarded_cents per calculations.incentive_award_amount"]

  - method: POST
    path: "/incentive-awards/{id}/pay"
    description: "Pay an accrued award into the producer's incentive balance."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["status ACCRUED -> PAID", "Producer.incentive_balance_cents increases by awarded_cents"]

  - method: POST
    path: "/incentive-awards/{id}/clawback"
    description: "Compensating action: reverse a paid award."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["status PAID -> CLAWED_BACK, clawback_cents = awarded_cents", "Producer.incentive_balance_cents decreases by awarded_cents and lifetime_clawback_cents increases by the same amount, restoring the pre-payment balance"]

  # --- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["all subsequent reported_at / observed_at / opened_at / closed_at / released_at / applied_at / retired_at stamps read from the new logical clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / shape ---------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource owned by a different entity instance"
  - id: ERR_DATA_ACCESS_DENIED
    http: 403
    condition: "The producer privacy gate denies the caller access to this animal or sighting"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the same user that performed the incompatible prior step (supplier registration, or trace opening)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, has the wrong scalar type, fails its format regex, is outside its numeric bound, or names an unrecognised enum member"

  # --- existence ------------------------------------------------------------
  - id: ERR_PRODUCER_NOT_FOUND
    http: 404
    condition: "producer_id in the path or body does not resolve"
  - id: ERR_PREMISES_NOT_FOUND
    http: 404
    condition: "premises_id, birth_premises_id, origin_premises_id, destination_premises_id or harvest_premises_id does not resolve"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "supplier_id in the path or body does not resolve"
  - id: ERR_TAG_LOT_NOT_FOUND
    http: 404
    condition: "tag_lot_id in the path or body does not resolve"
  - id: ERR_TAG_NOT_FOUND
    http: 404
    condition: "The tag id in the path does not resolve"
  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "animal_id or index_animal_id does not resolve"
  - id: ERR_SIGHTING_NOT_FOUND
    http: 404
    condition: "The sighting id in the path does not resolve"
  - id: ERR_MOVEMENT_NOT_FOUND
    http: 404
    condition: "The movement event id in the path does not resolve"
  - id: ERR_TRACE_REQUEST_NOT_FOUND
    http: 404
    condition: "trace_request_id in the path or body does not resolve"
  - id: ERR_TRACE_HIT_NOT_FOUND
    http: 404
    condition: "The animalId in a respond path is not present in that trace request's hits array"
  - id: ERR_HOLD_ORDER_NOT_FOUND
    http: 404
    condition: "The hold order id in the path does not resolve"
  - id: ERR_RECONCILIATION_RUN_NOT_FOUND
    http: 404
    condition: "The reconciliation run id in the path does not resolve"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "The incentive award id in the path does not resolve"

  # --- concurrency ----------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_supplier_version or expected_premises_version does not equal the parent entity's current version"

  # --- state ----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource's current state is not a declared `from` state for the requested transition"
  - id: ERR_LOT_NOT_ISSUABLE
    http: 409
    condition: "The addressed TagLot has status RECALLED or VOIDED and cannot supply an application"

  # --- cross-entity state gates --------------------------------------------
  - id: ERR_SUPPLIER_NOT_APPROVED
    http: 409
    condition: "The lot's DeviceSupplier.status is not APPROVED when issuing a lot or applying/replacing a tag"
  - id: ERR_PREMISES_NOT_ACTIVE
    http: 409
    condition: "A premises involved in the operation has registration_status != ACTIVE"
  - id: ERR_PREMISES_UNDER_HOLD
    http: 409
    condition: "A premises involved in the operation has health_status == QUARANTINED"
  - id: ERR_TRACE_STILL_OPEN
    http: 409
    condition: "A hold release or trace cancellation is attempted while the linked TraceRequest.status == RUNNING"
  - id: ERR_HOLD_PENDING
    http: 409
    condition: "A trace close is attempted while a hold order linked to it is PROPOSED or UNDER_APPEAL"
  - id: ERR_PRODUCER_NOT_ENROLLED
    http: 409
    condition: "An incentive award is accrued or paid for a producer whose enrollment_status != ENROLLED"
  - id: ERR_NO_ACTIVE_PREMISES
    http: 409
    condition: "Enrollment is attempted while the producer has no premises in registration_status ACTIVE"

  # --- safety / regulatory --------------------------------------------------
  - id: ERR_ICVI_REQUIRED
    http: 409
    condition: "An interstate movement is reported or corrected without an icvi_number"
  - id: ERR_HOLD_COOLDOWN_ACTIVE
    http: 409
    condition: "A hold's effective_from falls inside the 72-hour cooldown following the premises' last_hold_released_at"
  - id: ERR_HOLD_WINDOW_OVERLAP
    http: 409
    condition: "A hold's half-open window intersects an existing PROPOSED/ACTIVE/UNDER_APPEAL hold window on the same premises"

  # --- temporal -------------------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "effective_until <= effective_from, period_end < period_start, or arrived_at < departed_at"
  - id: ERR_FUTURE_TIMESTAMP
    http: 422
    condition: "A supplied business instant is later than the logical clock now"
  - id: ERR_BACKDATED_EVENT
    http: 422
    condition: "departed_at or harvested_at precedes the observed_at of the animal's latest non-reversed sighting"

  # --- referential ----------------------------------------------------------
  - id: ERR_AIN_OUT_OF_LOT_RANGE
    http: 422
    condition: "The AIN's 3-digit prefix does not match the supplier's aid_prefix, or its 12-digit serial falls outside the lot's inclusive range"
  - id: ERR_LOT_PREMISES_MISMATCH
    http: 422
    condition: "The lot's premises and the target premises belong to different producers"
  - id: ERR_ANIMAL_NOT_AT_PREMISES
    http: 422
    condition: "The animal's current_premises_id does not equal the origin or harvest premises supplied"
  - id: ERR_NOT_HARVEST_FACILITY
    http: 422
    condition: "Tag retirement is attempted at a premises whose operation_type != HARVEST_FACILITY"
  - id: ERR_SAME_PREMISES_MOVE
    http: 422
    condition: "origin_premises_id equals destination_premises_id on a movement event"

  # --- constraint -----------------------------------------------------------
  - id: ERR_DUPLICATE_PIN
    http: 409
    condition: "Another premises already uses this pin"
  - id: ERR_DUPLICATE_SUPPLIER_CODE
    http: 409
    condition: "Another device supplier already uses this supplier_code"
  - id: ERR_DUPLICATE_AIN
    http: 409
    condition: "Another tag already carries this ain"
  - id: ERR_SERIAL_RANGE_OVERLAP
    http: 409
    condition: "The new lot's closed serial interval intersects a non-VOIDED lot of the same supplier; abutting ranges are permitted"
  - id: ERR_CORRECTION_LIMIT_EXCEEDED
    http: 409
    condition: "A fourth correction is attempted on a movement event whose correction_count is already 3"
  - id: ERR_APPEAL_LIMIT_EXCEEDED
    http: 409
    condition: "A third appeal is attempted on a hold order whose appeal_count is already 2"
  - id: ERR_RESIDENCY_OVERLAP
    http: 409
    condition: "A correction sets departed_at later than the movement's recorded arrived_at, so the animal's timeline would carry two overlapping residencies"
  - id: ERR_AWARD_PERIOD_DUPLICATE
    http: 409
    condition: "An IncentiveAward with status ACCRUED or PAID already covers this producer and period"

  # --- fiscal / capacity ----------------------------------------------------
  - id: ERR_ISSUANCE_CAP_EXCEEDED
    http: 409
    condition: "The requested lot quantity exceeds the supplier's current issuance_cap"
  - id: ERR_LOT_EXHAUSTED
    http: 409
    condition: "The addressed lot has unapplied_count == 0 (status DEPLETED), so no serial remains to apply"
  - id: ERR_PREMISES_AT_CAPACITY
    http: 409
    condition: "Admitting one more ACTIVE animal would exceed the premises capacity"

