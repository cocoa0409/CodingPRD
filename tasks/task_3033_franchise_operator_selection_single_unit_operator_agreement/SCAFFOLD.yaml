# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id does not exist or is out of scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "required field missing or malformed in the request body" }
  - { id: ERR_DUPLICATE_WEEK, http: 409, condition: "an OperatingWeek already exists for this restaurant with the same week_start_on" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource is in a state that forbids the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the current resource version" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "candidate already has a non-terminal application" }
  - { id: ERR_SCREENING_BELOW_THRESHOLD, http: 422, condition: "advance from SUBMITTED refused: screening_score < SCREENING_PASS_SCORE" }
  - { id: ERR_INTERVIEW_GATE, http: 422, condition: "advance from INTERVIEWS refused: too few rounds, unscored rounds present, or average below INTERVIEW_PASS_SCORE" }
  - { id: ERR_STAGE_MISMATCH, http: 409, condition: "operation requires the application to be in a different pipeline stage" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "interview score outside 0-100 inclusive" }
  - { id: ERR_NO_OPERATING_DAYS, http: 422, condition: "experience block contains no non-Sunday operating day" }
  - { id: ERR_SHIFT_SHORTFALL, http: 409, condition: "experience complete refused: completed_shift_count < required_shift_count" }
  - { id: ERR_WEEK_NOT_ELAPSED, http: 409, condition: "week close refused before week_start_on + 6 days on the logical clock" }
  - { id: ERR_MISSING_ACTUALS, http: 400, condition: "week close without actual_revenue_cents" }
  - { id: ERR_DUPLICATE_STATEMENT, http: 409, condition: "a statement already exists for this operator and operating week" }
  - { id: ERR_STATEMENT_NOT_VOIDABLE, http: 409, condition: "FINAL statements cannot be voided" }
  - { id: ERR_OPERATOR_NOT_SCORABLE, http: 409, condition: "scorecard publish refused: operator not in ACTIVE or SUSPENDED" }
  - { id: ERR_SCORECARD_OVERLAP, http: 409, condition: "scorecard period overlaps an existing PUBLISHED/DISPUTED/FINAL scorecard for the operator" }
  - { id: ERR_FINALIZE_TOO_EARLY, http: 409, condition: "scorecard finalize refused before period_end_on + grace days" }
  - { id: ERR_SINGLE_UNIT_VIOLATION, http: 422, condition: "operation would leave the operator bound to more than one restaurant (or a second location where forbidden)" }
  - { id: ERR_AGREEMENT_IMMUTABLE, http: 422, condition: "attempt to set transferable=true or a non-zero equity_stake_bps" }
  - { id: ERR_RESTAURANT_NOT_AVAILABLE, http: 409, condition: "target restaurant is not AVAILABLE for assignment" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "relocation decide refused: votes_for < COMMITTEE_QUORUM for approval and votes_against < COMMITTEE_QUORUM for denial" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "committee member has already voted on this request" }
  - { id: ERR_NOTICE_TOO_SHORT, http: 422, condition: "exit effective_on earlier than notice date + MIN_NOTICE_DAYS" }
  - { id: ERR_SUCCESSOR_INELIGIBLE, http: 422, condition: "proposed successor is not a SELECTED candidate for this restaurant's market" }
  - { id: ERR_EXIT_ALREADY_OPEN, http: 409, condition: "operator already has a non-terminal exit case" }
  - { id: ERR_EXIT_NOT_COMPLETABLE, http: 409, condition: "exit completion refused: before effective_on or no FINAL statement on file" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; seeds candidates, restaurants, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /franchise/_clock/set_current_utc"
      - "POST /franchise/candidates"
      - "POST /franchise/restaurants"
      - "POST /franchise/restaurants/{restaurantId}/make-available"
    shared_operations:
      - "GET endpoints across all resources"

  - name: Candidate
    description: "An applicant person; acts on own applications, assessments, and withdrawals"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /franchise/candidates/{candidateId}/applications (as self)"
      - "POST /franchise/candidates/{candidateId}/withdraw (as self)"
      - "POST /franchise/applications/{applicationId}/assessment (as owning candidate)"
      - "POST /franchise/applications/{applicationId}/assessment/submit (as owning candidate)"
      - "POST /franchise/applications/{applicationId}/withdraw (as owning candidate)"
    shared_operations:
      - "GET own candidate, application, interview, assessment, experience records"

  - name: FieldConsultant
    description: "Franchisor field staff; shepherds applications, experiences, weeks, scorecards"
    identity: opaque
    exclusive_operations:
      - "POST /franchise/applications/{applicationId}/advance"
      - "POST /franchise/applications/{applicationId}/reject"
      - "POST /franchise/candidates/{candidateId}/disqualify"
      - "interview schedule/score/cancel"
      - "assessment evaluate"
      - "experience schedule/signoff/complete/cancel"
      - "week plan/close"
      - "scorecard draft/publish/republish/finalize"
      - "operator activate/suspend/reinstate"
      - "exit propose-successor / complete"
    shared_operations:
      - "GET endpoints across all resources"

  - name: SelectionCommittee
    description: "Committee approving applications, agreements, exceptions, and successors"
    identity: opaque
    exclusive_operations:
      - "POST /franchise/applications/{applicationId}/committee-decision"
      - "POST /franchise/operators"
      - "POST /franchise/operators/{operatorId}/agreement/execute"
      - "relocation open-review / votes / decide"
      - "exit approve-successor / reject-successor"
    shared_operations:
      - "GET endpoints across all resources"

  - name: Operator
    description: "A selected franchise operator; acts on own attestation, relocation, exit"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /franchise/operators/{operatorId}/attest (as self)"
      - "POST /franchise/operators/{operatorId}/relocation-requests (as self)"
      - "POST /franchise/operators/{operatorId}/relocation-requests/{requestId}/withdraw (as self)"
      - "POST /franchise/operators/{operatorId}/exits (as self)"
      - "POST /franchise/operators/{operatorId}/exits/{exitId}/cancel (as self)"
      - "POST /franchise/operators/{operatorId}/scorecards/{scorecardId}/dispute (as self)"
    shared_operations:
      - "GET own operator, agreement, weeks, scorecards, statements"

  - name: FinanceAdmin
    description: "Finance operator; settles, voids, and finalizes revenue share statements"
    identity: opaque
    exclusive_operations:
      - "POST /franchise/statements/{statementId}/settle"
      - "POST /franchise/statements/{statementId}/void"
      - "POST /franchise/statements/{statementId}/finalize"
    shared_operations:
      - "GET statements"
