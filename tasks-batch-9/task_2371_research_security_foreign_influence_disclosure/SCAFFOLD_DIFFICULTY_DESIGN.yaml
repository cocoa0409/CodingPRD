  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_state_check_outranks_restricted_entity_check_on_mitigation
        grounds:
          - validations.priority_7_state
          - validations.priority_12_restricted_entity
          - state_machines.Subaward.BLOCKED_to_MITIGATED
          - errors.ERR_INVALID_SUBAWARD_TRANSITION
          - errors.ERR_RESTRICTED_ENTITY_BLOCKED
        distinguishing_aspect: |
          The identical mitigation request is answered by two different validations depending only
          on the row's state: while the subaward is BLOCKED the declared BLOCKED -> MITIGATED edge
          exists so the state check passes and priority 12 rejects an SDN counterparty; once the
          subaward is TERMINATED the edge no longer exists and priority 7 must answer first, even
          though the SDN condition is still true. Checking business safety before state produces
          ERR_RESTRICTED_ENTITY_BLOCKED for a terminal row.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "ORG_SDN with own_designation SDN."
            - "Project P (STANDARD) with subaward S to ORG_SDN, screened DIRECT_MATCH so S is BLOCKED with screening_designation SDN and 90 risk points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Sanctioned Instruments Co", country_code: "RU", org_type: "COMPANY", own_designation: "SDN", designated_on: "2025-06-15T00:00:00Z" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Cryogenic Detector Array", agency_code: "NASA", sensitivity_level: "STANDARD", award_amount_cents: 75000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subawards"
              payload: { project_id: "${p_id}", organization_id: "${org_id}", scope: "Detector housing machining.", amount_cents: 4500000 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { sub_id: $.data.id }
            - call: "POST /subawards/${sub_id}/screen"
              payload: { variant: "DIRECT_MATCH" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          trigger:
            - call: "POST /subawards/${sub_id}/status"
              payload: { to_status: "MITIGATED", mitigation_justification: "Scope narrowed to commercially available parts." }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /subawards/${sub_id}/status"
              payload: { to_status: "TERMINATED" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /subawards/${sub_id}/status"
              payload: { to_status: "MITIGATED", mitigation_justification: "Scope narrowed to commercially available parts." }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "Subaward.${sub_id}.status == BLOCKED, screening_designation == SDN, screening_risk_points == 90 after setup"
            - "trigger call 1 returns 409 ERR_RESTRICTED_ENTITY_BLOCKED (priority 12 answers because the state check passed)"
            - "trigger call 2 returns 200 and Subaward.${sub_id}.status == TERMINATED with terminated_at == 2026-08-01T00:00:00Z"
            - "trigger call 3 returns 409 ERR_INVALID_SUBAWARD_TRANSITION, never ERR_RESTRICTED_ENTITY_BLOCKED"
            - "Subaward.${sub_id}.mitigation_justification is still null after all three calls"

