            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { receiving_branch_id: "${br2_id}", destination_altitude_feet: 500, depart_utc: "2026-08-05T12:00:00Z", return_utc: "2026-08-06T12:00:00Z", expected_contract_version: "${c_ver}" }
