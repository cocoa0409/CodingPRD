          pre_recoupment_pool_pct: 0.35
          post_recoupment_pool_pct: 0.4
          subsidiary_rights_investor_share_pct: 0.4
          closing_notice_min_days: 14
        as: GeneralManager
        captures:
          pr: $.data.id
      - call: POST /productions/${pr}/open-offering
        payload: {}
        as: SyndicationCounsel
      - call: POST /offering-documents
        payload:
          production_id: ${pr}
          doc_type: LP_AGREEMENT
          offering_amount_cents: 120000000
          unit_price_cents: 60000000
          max_investors: 5
          effective_date: '2026-08-01'
          expiration_date: '2026-12-31'
        as: SyndicationCounsel
        captures:
          od: $.data.id
      - call: POST /offering-documents/${od}/make-effective
        payload: {}
        as: SyndicationCounsel
      - call: POST /investors
        payload:
          legal_name: Iris Ivanov
          jurisdiction: NY
          contact_email: iris@example.com
        as: SyndicationCounsel
        captures:
          iv1: $.data.id
      - call: POST /investors/${iv1}/accredit
        payload:
          accreditation_status: ACCREDITED
        as: SyndicationCounsel
      - call: POST /investors
        payload:
          legal_name: Jonah Ju
          jurisdiction: NJ
          contact_email: jonah@example.com
        as: SyndicationCounsel
        captures:
          iv2: $.data.id
      - call: POST /investors/${iv2}/accredit
        payload:
          accreditation_status: ACCREDITED
        as: SyndicationCounsel
      - call: POST /investors
        payload:
