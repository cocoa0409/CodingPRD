            - "DistributionLine(run=${run_t_id}, member=${m_w_id}).remainder_cent_awarded == 0 and .gross_share_cents == 90776699"
            - "the sum of the four gross_share_cents equals 467500000 exactly"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: membership_action_amend_cycle_then_reject_branch
        grounds:
          - state_machines.MembershipAction.VOTING_to_PROPOSED
          - state_machines.MembershipAction.VOTING_to_REJECTED
          - state_machines.Ballot.CAST_to_VOIDED
          - entities.MembershipAction.fields.amend_count
          - calculations.vote_tally
          - validations[priority=31]
        distinguishing_aspect: |
          MembershipAction is not a DAG: VOTING re-enters PROPOSED through amend, which
          voids every ballot already cast, and the second pass through VOTING then forks
          to REJECTED rather than APPROVED - so the same state is occupied twice with a
          different ballot population and a different outcome, and amend_count records
          the loop count that AMEND_LIMIT later caps.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "Four charter members are FULL_SHARE at 10000 bps; a fifth institution, Central, has petitioned and sits in PETITIONED with 0 voting weight."
            - "An ADMIT membership action for Central proposed by user u_com_1 is in VOTING with FOR ballots already cast by North and South."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - &k_mc
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Central Plains University", institution_code: "CEN", admission_path: "PETITIONED", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2034, entry_fee_cents: 0 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_c_id: $.data.id }
            - &k_ma_admit
              call: "POST /membership-actions"
              payload: { conference_id: "${conf_id}", member_id: "${m_c_id}", action_type: "ADMIT", effective_fiscal_year: 2028, entry_fee_cents: 0, rationale: "Footprint expansion" }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ma_id: $.data.id }
            - &k_ma_open
              call: "POST /membership-actions/${ma_id}/open-voting"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - &k_ma_read
              call: "GET /membership-actions/${ma_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ma_v: $.data.version }
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_s_id}", choice: "FOR", expected_action_version: "${ma_v} + 1" }
              as: MemberRepresentative
              as_user_id: "${m_s_id}"
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /membership-actions/${ma_id}/amend"
              payload: { entry_fee_cents: 0, rationale: "Revised entry terms" }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /membership-actions/${ma_id}/open-voting"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "GET /membership-actions/${ma_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ma_v2: $.data.version }
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v2}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_s_id}", choice: "FOR", expected_action_version: "${ma_v2} + 1" }
              as: MemberRepresentative
              as_user_id: "${m_s_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_e_id}", choice: "AGAINST", expected_action_version: "${ma_v2} + 2" }
              as: MemberRepresentative
              as_user_id: "${m_e_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_w_id}", choice: "ABSTAIN", expected_action_version: "${ma_v2} + 3" }
              as: MemberRepresentative
              as_user_id: "${m_w_id}"
            - call: "POST /membership-actions/${ma_id}/close-voting"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          assert:
            - "MembershipAction.${ma_id}.amend_count == 1"
            - "Ballot.${b1_id}.status == VOIDED and Ballot.${b2_id}.status == VOIDED"
            - "MembershipAction.${ma_id}.eligible_weight_bps == 40000 and .cast_weight_bps == 40000 and .quorum_met == true"
            - "MembershipAction.${ma_id}.for_weight_bps == 20000 and .against_weight_bps == 10000"
            - "MembershipAction.${ma_id}.approval_ratio_bps == 6666 (the ABSTAIN weight is excluded from the denominator)"
            - "MembershipAction.${ma_id}.required_approval_bps == 7500 and MembershipAction.${ma_id}.status == REJECTED"
            - "Member.${m_c_id}.status == PETITIONED and Member.${m_c_id}.distribution_phase_bps == 0"
            - "the action occupied VOTING twice: once with 2 ballots and once with 4"

      - name: bowl_appearance_revision_loop_changes_reimbursement
        grounds:
          - state_machines.BowlAppearance.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.BowlAppearance.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.BowlAppearance.fields.revision_round
          - calculations.bowl_expense_reimbursement
        distinguishing_aspect: |
          BowlAppearance re-enters UNDER_REVIEW from REVISION_REQUESTED, and the second
          visit carries different data: the restated 4200000 cent claim and 900 miles
          drop the reimbursement from the 5100000 the original 9500000 cent / 30000 mile
          claim would have produced to 4285500, so the cycle is observable in money and
          in revision_round rather than being a cosmetic re-entry.
        test_recipe:
          setup:
            - "The conference exists with current_fiscal_year 2027 and member North seated as a charter member."
            - "North has a FY2027 BOWL appearance with payout 6000000 cents, an original claim of 9500000 expense cents and 30000 travel miles, currently in REVISION_REQUESTED after one review round."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_mn
            - call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Harvest Bowl", event_tier: "BOWL", payout_cents: 6000000, submitted_expense_cents: 9500000, travel_miles: 30000, units_claimed: 1 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_r_id: $.data.id }
            - call: "POST /bowl-appearances/${ba_r_id}/begin-review"
