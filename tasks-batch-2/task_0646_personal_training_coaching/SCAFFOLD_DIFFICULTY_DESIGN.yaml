              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c18@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 5, price_cents: 50000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /engagements/${e_id}/end"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          assert:
            - "Engagement.${e_id}.wallet_credit_cents == 50000"
            - "SessionPack.${p_id}.status == REFUNDED"
            - "Engagement.${e_id}.status == ENDED"
