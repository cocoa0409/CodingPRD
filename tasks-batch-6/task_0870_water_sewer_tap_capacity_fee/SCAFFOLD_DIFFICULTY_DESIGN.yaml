scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: capacity_fee_new_vs_redevelopment
        grounds:
          - calculations.capacity_fee
          - entities.ConnectionApplication.fields.assessment_basis
          - entities.ConnectionApplication.fields.capacity_fee_cents
          - state_machines.ConnectionApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: >
          Two ConnectionApplications with identical meter_size=ONE, service_type=BOTH,
          use_type=RESIDENTIAL differ only by assessment_basis: NEW charges full ERU (2,250,000c)
          while REDEVELOPMENT nets prior_credit_eru=1.0 (1,350,000c) — the dual variant is on the
          ConnectionApplication cost-accounting domain.
        test_recipe:
          setup:
            - "MeterSizeSchedule ONE (eru 2.5, tap 250000) and a governing FeeSchedule exist."
            - "App-A: BOTH/ONE/RESIDENTIAL, assessment_basis NEW; App-B: identical but REDEVELOPMENT, prior_credit_eru 1.0."
            - "Both apps carried through submit -> start-review -> availability(available) -> approve."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-A", service_type: "BOTH", meter_size: "ONE", use_type: "RESIDENTIAL", assessment_basis: "NEW" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_a: "$.data.id" }
            - call: "POST /connection-applications/${app_a}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${app_a}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_a}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /connection-applications/${app_a}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { cap_a: "$.data.capacity_fee_cents" }
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-B", service_type: "BOTH", meter_size: "ONE", use_type: "RESIDENTIAL", assessment_basis: "REDEVELOPMENT", prior_credit_eru: 1.0 }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_b: "$.data.id" }
            - call: "POST /connection-applications/${app_b}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${app_b}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_b}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${app_b}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { cap_b: "$.data.capacity_fee_cents" }
          assert:
            - "ConnectionApplication.${app_a}.capacity_fee_cents == 2250000"
            - "ConnectionApplication.${app_b}.capacity_fee_cents == 1350000"

      - name: latecomer_front_footage_vs_area
        grounds:
          - calculations.latecomer_reimbursement_assessment
          - entities.LatecomerReimbursement.fields.method
          - entities.LatecomerReimbursement.fields.amount_cents
        distinguishing_aspect: >
          Against one ACCEPTED MainExtensionProject (principal 5,000,000c; total front 500ft, total area
          100000sqft), a FRONT_FOOTAGE claim on a 50ft/8000sqft parcel yields 500,000c while an AREA claim
          yields 400,000c — the dual variant is on the LatecomerReimbursement recovery domain, distinct
          from capacity-fee cost accounting.
        test_recipe:
          setup:
            - "A MainExtensionProject is driven to ACCEPTED with actual cost 5,000,000c (<= cap 6,000,000c)."
            - "Two benefiting applications exist to receive the two latecomer assessments."
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-EXT", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_ext: "$.data.id" }
            - call: "POST /main-extension-projects"
              payload: { application_id: "${app_ext}", developer_user_id: "dev-1", length_ft: 500, estimated_cost_cents: 4000000, total_assessable_front_ft: 500, total_assessable_area_sqft: 100000, reimbursement_cap_cents: 6000000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { proj: "$.data.id" }
            - call: "POST /developer-agreements"
              payload: { main_extension_project_id: "${proj}", developer_user_id: "dev-1" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr: "$.data.id" }
            - call: "POST /developer-agreements/${agr}/offer"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_v_offer: "$.data.version" }
            - call: "POST /developer-agreements/${agr}/escrow-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 4000000, expected_developer_agreement_version: "${agr_v_offer}" }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /developer-agreements/${agr}/execute"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /main-extension-projects/${proj}/start-construction"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /inspectors"
              payload: { name: "Insp One" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp: "$.data.id" }
            - call: "POST /main-extension-projects/${proj}/record-inspection"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp}"
            - call: "POST /main-extension-projects/${proj}/accept"
              payload: { actual_construction_cost_cents: 5000000 }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { proj_v_accept: "$.data.version" }
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-BEN1", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-2"
              captures: { ben1: "$.data.id" }
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-BEN2", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-3"
              captures: { ben2: "$.data.id" }
          trigger:
            - call: "POST /latecomer-reimbursements"
              payload: { main_extension_project_id: "${proj}", benefiting_application_id: "${ben1}", method: "FRONT_FOOTAGE", parcel_front_ft: 50, parcel_area_sqft: 8000, expected_main_extension_project_version: "${proj_v_accept}" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { lc_front: "$.data.amount_cents" }
            - call: "GET /main-extension-projects/${proj}"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { proj_v2: "$.data.version" }
            - call: "POST /latecomer-reimbursements"
              payload: { main_extension_project_id: "${proj}", benefiting_application_id: "${ben2}", method: "AREA", parcel_front_ft: 50, parcel_area_sqft: 8000, expected_main_extension_project_version: "${proj_v2}" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { lc_area: "$.data.amount_cents" }
          assert:
            - "the FRONT_FOOTAGE LatecomerReimbursement.amount_cents == 500000"
            - "the AREA LatecomerReimbursement.amount_cents == 400000"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: capacity_fee_tiered_multi_input_mode_a
        grounds:
          - calculations.capacity_fee
          - entities.ConnectionApplication.fields.use_type
          - entities.ConnectionApplication.fields.service_type
          - entities.MeterSizeSchedule.fields.eru_factor
        distinguishing_aspect: >
          MODE (a): capacity_fee combines >=3 inputs with non-linear interaction — eru_factor (2.5),
          a service-type branch selecting water+sewer components, and a use_type multiplier branch
          (COMMERCIAL=1.15): (400000+500000)*2.5*1.15 = 2,587,500c, not a linear per-input sum.
        test_recipe:
          setup:
            - "MeterSizeSchedule ONE and governing FeeSchedule exist."
            - "App: BOTH/ONE/COMMERCIAL, NEW; carried to approve."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-C", service_type: "BOTH", meter_size: "ONE", use_type: "COMMERCIAL", assessment_basis: "NEW" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_c: "$.data.id" }
            - call: "POST /connection-applications/${app_c}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${app_c}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_c}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${app_c}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { cap_c: "$.data.capacity_fee_cents" }
          assert:
            - "ConnectionApplication.${app_c}.capacity_fee_cents == 2587500"

      - name: total_fees_due_order_dependent_mode_c
        grounds:
          - calculations.total_fees_due
          - entities.ConnectionApplication.fields.total_fees_due_cents
          - entities.FeeSchedule.fields.volume_discount_threshold_cents
        distinguishing_aspect: >
          MODE (c): total_fees_due has a circular-looking dependency — the volume discount is keyed on
          gross, but gross depends on admin_fee, which depends on subtotal; evaluation order is pinned.
          For subtotal 2,500,000c: admin=min(75000,50000)=50000 -> gross 2,550,000 -> gross>=2,000,000 so
          discount=round(2,550,000*0.05)=127,500 -> total 2,422,500c.
        test_recipe:
          setup:
            - "MeterSizeSchedule ONE and governing FeeSchedule exist."
            - "App: BOTH/ONE/RESIDENTIAL, NEW; carried to approve (subtotal = 2,250,000 + 250,000)."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
              payload: { is_active: true, water_capacity_fee_per_eru_cents: 400000, sewer_capacity_fee_per_eru_cents: 500000, use_multipliers: { RESIDENTIAL: 1.00, COMMERCIAL: 1.15, IRRIGATION: 1.30 }, admin_fee_pct: 0.03, admin_fee_cap_cents: 50000, volume_discount_threshold_cents: 2000000, volume_discount_pct: 0.05, pavement_cut_surcharge_cents: 80000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-D", service_type: "BOTH", meter_size: "ONE", use_type: "RESIDENTIAL", assessment_basis: "NEW" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_d: "$.data.id" }
            - call: "POST /connection-applications/${app_d}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${app_d}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_d}", distance_to_main_ft: 120 }
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${app_d}/approve"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-2"
              captures: { total_d: "$.data.total_fees_due_cents" }
          assert:
            - "ConnectionApplication.${app_d}.capacity_fee_cents == 2250000"
            - "ConnectionApplication.${app_d}.tap_fee_cents == 250000"
            - "ConnectionApplication.${app_d}.total_fees_due_cents == 2422500"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle
        grounds:
          - state_machines.ConnectionApplication.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.ConnectionApplication.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.ConnectionApplication.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: >
          ConnectionApplication is cyclic: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW,
          returning to a previously-visited state, not a forward-only pipeline.
        test_recipe:
          setup:
            - "App exists, submitted, under review."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-R", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_r: "$.data.id" }
            - call: "POST /connection-applications/${app_r}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${app_r}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /connection-applications/${app_r}/request-revision"
              payload: { reason: "need site plan" }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { st1: "$.data.status" }
            - call: "POST /connection-applications/${app_r}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
              captures: { st2: "$.data.status" }
            - call: "POST /connection-applications/${app_r}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { st3: "$.data.status" }
          assert:
            - "status after request-revision == REVISION_REQUESTED"
            - "status after re-submit == SUBMITTED"
            - "status after second start-review == UNDER_REVIEW (state revisited)"

      - name: inspection_reinspection_cycle
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
          - state_machines.Inspection.FAILED_to_SCHEDULED
          - state_machines.Inspection.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: >
          Inspection is cyclic on a different entity: IN_PROGRESS -> FAILED -> SCHEDULED -> IN_PROGRESS
          (reinspection loop), re-entering SCHEDULED after a failure.
        test_recipe:
          setup:
            - "An inspector and one REQUESTED TAP inspection exist."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-I", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_i: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Insp Cyc" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp_i: "$.data.id" }
            - call: "POST /inspections"
              payload: { application_id: "${app_i}", inspector_id: "${insp_i}", inspection_type: "TAP", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: FieldInspector
              as_user_id: "${insp_i}"
              captures: { insp_row: "$.data.id" }
            - call: "POST /inspections/${insp_row}/schedule"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_i}"
            - call: "POST /inspections/${insp_row}/start"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_i}"
            - call: "POST /inspections/${insp_row}/fail"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_i}"
          trigger:
            - call: "POST /inspections/${insp_row}/schedule"
              payload: { scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: FieldInspector
              as_user_id: "${insp_i}"
              captures: { rst1: "$.data.status" }
            - call: "POST /inspections/${insp_row}/start"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_i}"
              captures: { rst2: "$.data.status" }
          assert:
            - "status after reschedule from FAILED == SCHEDULED (state revisited)"
            - "status after second start == IN_PROGRESS"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_extension_depth3_cascade
        grounds:
          - state_machines.MainExtensionProject.INSPECTED_to_ACCEPTED
          - state_machines.DeveloperAgreement.EXECUTED_to_COMPLETION_PENDING
          - entities.AvailabilityDetermination.fields.water_main_available
        distinguishing_aspect: >
          Depth-3 chain from POST /main-extension-projects/{id}/accept: (1) project -> ACCEPTED causes
          (2) its DeveloperAgreement EXECUTED -> COMPLETION_PENDING, which causes (3) the application's
          AvailabilityDetermination water/sewer_main_available flip to true — each hop caused by the prior.
        test_recipe:
          setup:
            - "App-E is unavailable (distance 300); a MainExtensionProject+DeveloperAgreement drive to EXECUTED and the project reaches INSPECTED."
          setup_api_calls:
            - call: "POST /connection-applications"
              payload: { parcel_id: "APN-E", service_type: "WATER", meter_size: "ONE", use_type: "RESIDENTIAL" }
              as: Applicant
              as_user_id: "appl-1"
              captures: { app_e: "$.data.id" }
            - call: "POST /connection-applications/${app_e}/submit"
              payload: {}
              as: Applicant
              as_user_id: "appl-1"
            - call: "POST /connection-applications/${app_e}/start-review"
              payload: {}
              as: UtilityReviewer
              as_user_id: "rev-1"
            - call: "POST /availability-determinations"
              payload: { application_id: "${app_e}", distance_to_main_ft: 300 }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { avail_e: "$.data.id" }
            - call: "POST /main-extension-projects"
              payload: { application_id: "${app_e}", developer_user_id: "dev-1", length_ft: 300, estimated_cost_cents: 3000000, total_assessable_front_ft: 300, total_assessable_area_sqft: 60000, reimbursement_cap_cents: 4000000 }
              as: Developer
              as_user_id: "dev-1"
              captures: { proj_e: "$.data.id" }
            - call: "POST /developer-agreements"
              payload: { main_extension_project_id: "${proj_e}", developer_user_id: "dev-1" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_e: "$.data.id" }
            - call: "POST /developer-agreements/${agr_e}/offer"
              payload: {}
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { agr_e_v: "$.data.version" }
            - call: "POST /developer-agreements/${agr_e}/escrow-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 3000000, expected_developer_agreement_version: "${agr_e_v}" }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /developer-agreements/${agr_e}/execute"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /main-extension-projects/${proj_e}/start-construction"
              payload: {}
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /inspectors"
              payload: { name: "Insp E" }
              as: UtilityAdmin
              as_user_id: "admin-1"
              captures: { insp_e: "$.data.id" }
            - call: "POST /main-extension-projects/${proj_e}/record-inspection"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_e}"
          trigger:
            - call: "POST /main-extension-projects/${proj_e}/accept"
              payload: { actual_construction_cost_cents: 2800000 }
              as: UtilityReviewer
              as_user_id: "rev-1"
              captures: { proj_e_status: "$.data.status" }
          assert:
            - "MainExtensionProject.${proj_e}.status == ACCEPTED"
            - "DeveloperAgreement.${agr_e}.status == COMPLETION_PENDING"
            - "AvailabilityDetermination.${avail_e}.water_main_available == true"
            - "AvailabilityDetermination.${avail_e}.extension_required == false"

      - name: meterset_pass_depth2_cascade
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_PASSED
          - state_machines.MeterSet.SET_to_INSTALLED
          - state_machines.ConnectionApplication.APPROVED_to_READY_FOR_ACTIVATION
        distinguishing_aspect: >
          Depth-2 chain from a different trigger POST /inspections/{id}/pass (METER_SET): (1) MeterSet SET
          -> INSTALLED causes (2) its ConnectionApplication APPROVED -> READY_FOR_ACTIVATION.
        test_recipe:
          setup:
            - "App-F approved (RESIDENTIAL, no backflow), tap inspection passed, meter-set SET, meter-set inspection IN_PROGRESS."
          setup_api_calls:
            - call: "POST /meter-size-schedules"
              payload: { meter_size: "ONE", eru_factor: 2.5, tap_install_fee_cents: 250000 }
              as: UtilityAdmin
              as_user_id: "admin-1"
            - call: "POST /fee-schedules"
