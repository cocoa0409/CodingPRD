              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 30 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Quin", phone: "+15551110017" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /private-dining-events"
              payload: { restaurant_id: "${rid}", dining_area_id: "${area}", customer_id: "${cust}", party_size: 12, event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T22:00:00Z", food_minimum_cents: 200000, deposit_pct: 0.25 }
              as: Manager
              captures: { pde: $.data.id }
            - call: "POST /private-dining-events/${pde}/propose"
              payload: {}
              as: Manager
            - call: "POST /private-dining-events/${pde}/confirm"
