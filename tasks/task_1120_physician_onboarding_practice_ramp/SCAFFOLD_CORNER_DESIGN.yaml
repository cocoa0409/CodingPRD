            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D30", sentiment: "POSITIVE" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D90", sentiment: "NEUTRAL" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
          trigger:
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/complete", payload: {}, as: OnboardingDirector, captures: { err: "$.data.error_id" } }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D180", sentiment: "NEUTRAL" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D270", sentiment: "POSITIVE" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
            - { call: "POST /onboarding/mentorship-assignments/${ma_id}/check-ins", payload: { day_marker: "D365", sentiment: "POSITIVE" }, as: MentorPhysician, as_user_id: "${mentor_id}" }
