            - "no pagination arguments: HTTP 200, response_type == \"array\", limit == 10, offset == 0, total_count == 12, has_more == true, and exactly 10 rows starting at ${s1}"
            - "limit 5 offset 10: total_count == 12, has_more == false, exactly 2 rows, the last of which is ${s12}"
            - "source_system IMAGING_PACS with limit 3: total_count == 4 (the FILTERED count, not 12), has_more == true, 3 rows beginning at ${s9}"
            - "offset 12: HTTP 200 with an empty data array, total_count == 12, has_more == false — running off the end is not a 404"
            - "limit 0: HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\" — the declared minimum is 1"
            - "limit 101: HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\" — the declared maximum is 100"
            - "limit 100: HTTP 200 with all 12 rows, has_more == false — 100 is inside the bound"
            - "sensitivity_status AUTHORIZED_INCLUDE: HTTP 200, total_count == 0 — every segment is still PENDING and therefore UNCLASSIFIED, so a filter on a legal enum value that nothing matches is an empty page, not an error"

