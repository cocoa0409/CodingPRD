            - { call: "POST /homeownership/households/${hh_id}/return-to-screening", payload: { reason: "Attempting a loop-back from a state that has no loop" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { e_ret: $.data.error_id } }
