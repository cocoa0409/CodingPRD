        distinguishing_aspect: "Two declared domain constraints on POST /pools are enforced at priority 4: freeze_threshold_pct 30 with restrict_threshold_pct 25 violates freeze < restrict, and size_liters 40 is outside the enum {20, 30, 50, 58} — both 400 ERR_INVALID_REQUEST."
        test_recipe:
