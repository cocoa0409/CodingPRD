            - "HedgePosition.${hp1_id}.lots_committed == 0"

      - name: ticket_apply_gated_by_unconfirmed_freight_booking
        grounds:
          - validations[priority=13]
          - state_machines.FreightBooking.REQUESTED_to_CONFIRMED
          - errors[ERR_FREIGHT_BOOKING_NOT_CONFIRMED]
          - entities.DeliveryTicket.fields.freight_booking_id
        distinguishing_aspect: |
          Entity pair (DeliveryTicket, FreightBooking) — a different pair from
          (PurchaseContract, Bid): the ticket's own apply transition is blocked because the
          rail booking it names is still REQUESTED, and the very same apply succeeds once the
          booking is confirmed, which in turn drives the booking to COMPLETED.
        test_recipe:
          setup:
            - "Desk, rail-served elevator, ACTIVE CORN discount schedule, SHORT 2026-12 hedge with 10 lots at 448 and an ACTIVE basis -32 bid."
            - "One FULLY_PRICED 20,000-bushel CASH contract and a 60-car rail fleet homed at that elevator."
            - "One REQUESTED freight booking for that contract, and one GRADED 5,000-bushel ticket naming that booking."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD18", name: "Rail Gate Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
