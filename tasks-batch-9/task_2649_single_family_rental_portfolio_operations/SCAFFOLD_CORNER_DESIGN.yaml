            - call: "POST /scope-templates"
              payload: { code: "PAINT_INT", name: "Full interior repaint", certification_code: "GEN", unit: "HOME", benchmark_unit_cost_cents: 285050, default_crew_size: 3, default_crew_days: 3, safety_critical: false }
              as: PortfolioAdmin
