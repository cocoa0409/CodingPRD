            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_r_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-08T17:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${loc_r_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_a_id: $.data.id }
