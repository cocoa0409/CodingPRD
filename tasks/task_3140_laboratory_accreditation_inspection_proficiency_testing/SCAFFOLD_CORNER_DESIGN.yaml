        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.PTShipment.OPEN_to_CLOSED
        distinguishing_aspect: "The clock endpoint both reports the new time and fires deadline transitions: advancing past a shipment's due_at closes it with closure_reason DEADLINE_ELAPSED and (independently) any further result submission is rejected."
        test_recipe:
          setup: ["Lab with ACTIVE CHEMISTRY enrollment; subscription; shipment S1 created at 2026-09-01 (due 2026-09-11T00:00:00Z)."]
          setup_api_calls:
            - call: "POST /laboratories"
