        distinguishing_aspect: "Review is FunderAuditor-exclusive (CenterAdmin gets ERR_FORBIDDEN); conversely auditors cannot create clients (ERR_FORBIDDEN) — approval-chain split between submitter and reviewer roles."
        test_recipe:
          setup: ["DRAFT report submitted (status SUBMITTED)"]
          setup_api_calls:
            - call: "POST /funder-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", funding_streams: [ { stream_name: "City", share_pct: 100 } ] }
              as: CenterAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /funder-reports/${rep_id}/submit"
              as: CenterAdmin
          trigger:
            - call: "POST /funder-reports/${rep_id}/review"
              payload: { decision: "ACCEPTED" }
              as: CenterAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /clients"
              payload: { full_name: "Vida Client", preferred_language: "tw", date_of_birth: "1997-07-07" }
              as: FunderAuditor
              captures: { err2: $.data.error_id }
            - call: "POST /funder-reports/${rep_id}/review"
              payload: { decision: "ACCEPTED" }
              as: FunderAuditor
              captures: { rep_stat: $.data.status }
          assert:
            - "CenterAdmin review: ERR_FORBIDDEN"
            - "FunderAuditor client creation: ERR_FORBIDDEN"
            - "FunderAuditor review succeeds: status == ACCEPTED"

      - name: note_read_clearance_and_authorship
        claim_type: conditional_validation
        grounds: ["entities.CaseNote.fields.sensitivity", "errors[ERR_FORBIDDEN]", "errors[ERR_CLEARANCE_INSUFFICIENT]"]
        distinguishing_aspect: "SEALED note: unreadable by a clearance-2 manager who is not the author (ERR_FORBIDDEN), readable by its author regardless of clearance, and an Intake (clearance 1) author cannot even create it (ERR_CLEARANCE_INSUFFICIENT)."
        test_recipe:
          setup: ["admin (clearance 3) authors a SEALED note; mgr2 (clearance 2, non-author) attempts read; intake (clearance 1) attempts to create a SEALED note"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Admin A", role_level: "ADMIN", clearance_level: 3, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { admin_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Intake I", role_level: "INTAKE", clearance_level: 1, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { int_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Winta Client", preferred_language: "ti", date_of_birth: "1995-05-05" }
              as: IntakeSpecialist
              as_user_id: "${int_id}"
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${admin_id}" }
              as: CenterAdmin
              as_user_id: "${admin_id}"
              captures: { case_id: $.data.id }
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", body: "sealed fact", sensitivity: "SEALED" }
              as: CenterAdmin
              as_user_id: "${admin_id}"
              captures: { note_id: $.data.id }
          trigger:
            - call: "GET /case-notes/${note_id}"
              as: CaseManager
              as_user_id: "${mgr2_id}"
              captures: { err1: $.data.error_id }
            - call: "GET /case-notes/${note_id}"
              as: CenterAdmin
              as_user_id: "${admin_id}"
              captures: { note_body: $.data.body }
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", body: "too sensitive for me", sensitivity: "SEALED" }
              as: IntakeSpecialist
              as_user_id: "${int_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "Non-author clearance 2 read of SEALED note: ERR_FORBIDDEN"
            - "Author (clearance 3) read succeeds, body == 'sealed fact'"
            - "Clearance 1 creating SEALED note: ERR_CLEARANCE_INSUFFICIENT (403)"

  - section: cross_cutting_layers
    instances:
      - name: plan_create_occ_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "OCC: creating plan A with the observed case version succeeds and bumps Case.version; a second create replaying the same expected_case_version is rejected 412 ERR_STALE_CASE_VERSION, and plan A is SUPERSEDED only by a create carrying the fresh version."
        test_recipe:
          setup: ["case in PLANNING with version observed after the PLANNING transition"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Xala Client", preferred_language: "wo", date_of_birth: "1990-12-12" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /assessments"
              payload: { case_id: "${case_id}", housing_score: 1, employment_score: 1, education_score: 1, language_score: 1, health_score: 1 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/submit"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /assessments/${asmt_id}/verify"
              as: CaseManager
              as_user_id: "${mgr2_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ASSESSED" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "PLANNING" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/plans"
              payload: { title: "Plan A", budgeted_hours: 5, expected_case_version: "${case_v}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { plana_id: $.data.id }
            - call: "POST /cases/${case_id}/plans"
              payload: { title: "Plan B", budgeted_hours: 6, expected_case_version: "${case_v}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { err: $.data.error_id }
            - call: "GET /cases/${case_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_v_now: $.data.version }
            - call: "POST /cases/${case_id}/plans"
              payload: { title: "Plan B", budgeted_hours: 6, expected_case_version: "${case_v_now}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { planb_id: $.data.id }
            - call: "GET /plans/${plana_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { plana_stat: $.data.status }
          assert:
            - "Second create with the stale version: 412 ERR_STALE_CASE_VERSION"
            - "Case.version advanced by exactly 1 after the successful create"
            - "Create with the fresh version succeeds and Plan A is SUPERSEDED by Plan B (DRAFT)"

      - name: consent_revocation_cascade_to_referral_and_appointment
        claim_type: cascading_side_effects
        grounds: ["state_machines.Consent.GRANTED_to_REVOKED", "state_machines.Referral.SENT_to_SUSPENDED"]
        distinguishing_aspect: "Revoking REFERRAL_SHARE consent suspends the client's SENT referral (reason CONSENT_REVOKED), which itself releases the org slot and system-cancels the linked CONFIRMED accompaniment appointment — m2/m3a/m3b verified end-to-end; a fresh consent plus resume restores SENT."
        test_recipe:
          setup: ["client with REFERRAL_SHARE + ACCOMPANIMENT consents; case; org capacity 5; referral SENT (slot used); CONFIRMED ACCOMPANIMENT appointment linked to the referral"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Yodit Client", preferred_language: "am", date_of_birth: "1992-02-02" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "REFERRAL_SHARE" }
              as: CenterAdmin
              captures: { con_id: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "ACCOMPANIMENT" }
              as: CenterAdmin
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /organizations"
              payload: { name: "Org V", service_categories: ["LEGAL"], referral_capacity: 5, contact_email: "v@org.test" }
              as: CenterAdmin
              captures: { org_id: $.data.id }
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", organization_id: "${org_id}", service_category: "LEGAL" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/send"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr1_id}", kind: "ACCOMPANIMENT", starts_at: "2026-08-12T10:00:00Z", ends_at: "2026-08-12T11:00:00Z", referral_id: "${ref_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/confirm"
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /consents/${con_id}/revoke"
              payload: { revoked_reason: "client withdrew sharing consent" }
              as: Client
              as_user_id: "${cli_id}"
            - call: "GET /referrals/${ref_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_stat: $.data.status, ref_reason: $.data.suspension_reason }
            - call: "GET /appointments/${appt_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt_stat: $.data.status, appt_sys: $.data.cancelled_by_system }
            - call: "GET /organizations/${org_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { org_used: $.data.referral_slots_used }
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "REFERRAL_SHARE" }
              as: CenterAdmin
            - call: "POST /referrals/${ref_id}/resume"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { ref_stat2: $.data.status }
          assert:
            - "Client revoking own consent succeeds (Client role, own id)"
            - "Referral -> SUSPENDED with suspension_reason == CONSENT_REVOKED (m2)"
            - "Appointment -> CANCELLED with cancelled_by_system == true (m3b)"
            - "Organization.referral_slots_used == 0 (m3a)"
            - "After a fresh consent: resume returns the referral to SENT (slots_used back to 1)"

      - name: derived_reportable_flag_reconciles_on_consent_changes
        claim_type: derived_field_reconciliation
        grounds: ["entities.Client.fields.reportable"]
        distinguishing_aspect: "Client.reportable is derived: false at creation, true after DATA_REPORTING consent grant, false again after revoke — reconciled on every source mutation and observable immediately."
        test_recipe:
          setup: ["client registered (reportable false)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Zala Client", preferred_language: "ps", date_of_birth: "1994-04-04" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id, rep0: $.data.reportable }
          trigger:
            - call: "POST /consents"
              payload: { client_id: "${cli_id}", scope: "DATA_REPORTING" }
              as: CenterAdmin
              captures: { con_id: $.data.id }
            - call: "GET /clients/${cli_id}"
              as: CaseManager
              captures: { rep1: $.data.reportable }
            - call: "POST /consents/${con_id}/revoke"
              as: CenterAdmin
            - call: "GET /clients/${cli_id}"
              as: CaseManager
              captures: { rep2: $.data.reportable }
          assert:
            - "reportable: false at creation, true after grant, false after revoke"

      - name: sweep_marks_no_show_and_held_then_reconciles
        claim_type: scheduled_actions
        grounds: ["state_machines.Appointment.CONFIRMED_to_NO_SHOW", "state_machines.WorkshopSession"]
        distinguishing_aspect: "Ops-run checkpoint semantics: sweep marks CONFIRMED appointments past end as NO_SHOW and SCHEDULED sessions past end as HELD (REQUESTED appointments are untouched); once every ENROLLED enrollment is marked, the next sweep reconciles the session to RECONCILED."
        test_recipe:
          setup: ["CONFIRMED appointment 2026-08-05 09:00-09:30; REQUESTED appointment 2026-08-05 09:00-09:30 (different advocate); session 2026-08-05 10:00-11:00 with one ENROLLED enrollment"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /staff"
              payload: { full_name: "Mgr Two", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr2_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Abel Client", preferred_language: "ti", date_of_birth: "1991-01-01" }
              as: IntakeSpecialist
              captures: { cli_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cli_id}", assigned_manager_id: "${mgr1_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr1_id}", kind: "DOCUMENT_ID", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T09:30:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/confirm"
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /appointments"
              payload: { case_id: "${case_id}", advocate_id: "${mgr2_id}", kind: "ORIENTATION", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T09:30:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt2_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room N", capacity: 20 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "NS Session", capacity: 5, starts_at: "2026-08-05T10:00:00Z", ends_at: "2026-08-05T11:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /workshop-enrollments"
              payload: { session_id: "${sess_id}", case_id: "${case_id}" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { wke_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /_sweeps/run"
              as: CenterAdmin
              captures: { noshow_n: $.data.appointments_marked_no_show, held_n: $.data.sessions_marked_held }
            - call: "GET /appointments/${appt1_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { a1_stat: $.data.status }
            - call: "GET /appointments/${appt2_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { a2_stat: $.data.status }
            - call: "GET /workshop-sessions/${sess_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess_stat: $.data.status }
            - call: "POST /workshop-enrollments/${wke_id}/mark-attendance"
              payload: { attended: false }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /_sweeps/run"
              as: CenterAdmin
              captures: { rec_n: $.data.sessions_reconciled }
            - call: "GET /workshop-sessions/${sess_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess_stat2: $.data.status }
          assert:
            - "First sweep: appointments_marked_no_show == 1 (only CONFIRMED), sessions_marked_held == 1"
            - "CONFIRMED appointment -> NO_SHOW; REQUESTED appointment stays REQUESTED"
            - "Session -> HELD; after marking the only enrollment NO_SHOW, next sweep reconciles session -> RECONCILED (sessions_reconciled == 1)"

  - section: consistency_model
