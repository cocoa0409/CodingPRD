            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
            - call: "POST /material-lots"
              payload: { material_spec: "SS_304", heat_number: "H-SS", qty_received: 4, unit_cost_cents: 2000, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 4, qty_started: 4 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_5AX", machine_code: "5AX-01", routing_op_id: "${op1_id}", start_min: 0, end_min: 100 }
              as: Scheduler
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ShopAdmin
            - call: "GET /material-lots/${lot_id}"
              payload: {}
              as: MaterialController
              captures: { rem: $.data.qty_remaining, lot_status: $.data.status }
            - call: "GET /machine-slots/${slot_id}"
              payload: {}
