              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_v3b}/accept"
              payload: { expected_merchant_version: "${m_v3b_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_v3b}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
