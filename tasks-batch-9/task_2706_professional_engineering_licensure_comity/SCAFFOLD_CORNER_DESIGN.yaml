              as: BoardInvestigator
              as_user_id: "INV-1"
              captures: { case_dell_ver: $.data.version }
            - call: "POST /consent-orders"
              payload: { case_id: "${case_dell}", sanction_type: "REPRIMAND", expected_case_version: "${case_dell_ver}" }
              as: BoardInvestigator
              as_user_id: "INV-1"
              captures: { co_dell: $.data.id }
          trigger:
            - call: "POST /cases/${case_dell}/close"
              payload: {}
              as: BoardInvestigator
              as_user_id: "INV-1"
          assert:
            - "trigger[0] http_status == 409"
            - "trigger[0] response.data.error_id == \"ERR_OPEN_SANCTION_BLOCKS_CLOSE\""
            - "Case.${case_dell}.investigation_status == \"PROBABLE_CAUSE\""
            - "Case.${case_dell}.sanction_status == \"PROPOSED\""
            - "Case.${case_dell}.assessed_penalty_cents == 298000"
            - "ConsentOrder.${co_dell}.status == \"PROPOSED\""

