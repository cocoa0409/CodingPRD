          - state_machines.ParticipantAgreement.PENDING_to_FORFEITED
        distinguishing_aspect: "uncollected_amount_cents tracks PENDING+DISPUTED agreements only: after forfeit it drops from 6000 to 0 while the balance gains the 6000 forfeiture charge."
        test_recipe:
