  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Any endpoint called with X-User-ID / X-User-Role headers stripped is rejected at priority 1 before role, existence, or business checks."
        test_recipe:
          setup: ["Empty DB (clock default)"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 1000 }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400; test harness strips both headers for this call)"

      - name: forbidden_role_districtbuyer_cannot_create_crew
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", roles]
        distinguishing_aspect: "POST /v1/crews lists only ContractorAdmin; a DistrictBuyer caller is rejected with ERR_FORBIDDEN_FOR_ROLE even for a well-formed body."
        test_recipe:
          setup: ["District D1 exists"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /v1/crews", payload: { name: "Crew Rogue" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (http 403)"

      - name: districtbuyer_cannot_publish_other_districts_spec
        claim_type: cross_entity_scope
        grounds: ["validations[priority=3]", "errors[ERR_SCOPE_VIOLATION]", roles.DistrictBuyer]
        distinguishing_aspect: "DistrictBuyer identity is entity-backed: the buyer of district D1 invoking publish on district D2's spec fails the ownership-scope check with ERR_SCOPE_VIOLATION even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["Districts D1 and D2; D2 has a spec with one line in DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/districts", payload: { name: "District D2", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d2: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d2}", title: "Spec of D2", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d2}", captures: { spec2: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${spec2}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d2}" }
          trigger:
            - { call: "POST /v1/bid-specs/${spec2}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SCOPE_VIOLATION (http 403; D1's buyer cannot mutate D2's spec)"

      - name: duplicate_po_number_same_district_year_rejected
        claim_type: aggregate_uniqueness
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_PO_NUMBER]", entities.PurchaseOrder.fields.po_number]
        distinguishing_aspect: "po_number uniqueness is scoped to (district, fiscal_year) over non-CANCELLED POs: the same number in the same year is rejected, while the same number in a different fiscal_year is accepted."
        test_recipe:
          setup: ["District D1; flat award accepted; PO-1 (po_number PO-1, fy 2026) exists"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
          trigger:
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2027 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po_next: $.data.id, po_next_status: $.data.status } }
          assert:
            - "err == ERR_DUPLICATE_PO_NUMBER (same district, same fiscal_year 2026)"
            - "po_next_status == RECEIVED (same number in fiscal_year 2027 accepted)"

      - name: substitution_at_delivery_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SUBSTITUTION_NOT_ALLOWED]"]
        distinguishing_aspect: "No-substitution compliance: a delivery entry naming manufacturer 'AcmeClone' against a spec line pinned to manufacturer 'Acme' is rejected, and no delivered_qty accrues."
        test_recipe:
          setup: ["District D1; flat award; PO line qty 10 ORDERED; shipment of 10 scheduled to site"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
