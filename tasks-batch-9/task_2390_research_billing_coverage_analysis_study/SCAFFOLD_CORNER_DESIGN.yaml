        distinguishing_aspect: "The one-open-revision rule counts DRAFT, UNDER_REVIEW and RETURNED alike: a second POST /coverage-analyses is refused 409 while the first is still DRAFT, and the OCC version it carried is not consumed - the study stays at version 2."
        test_recipe:
