      - name: the_review_panel_composition_rule_rejects_four_distinct_malformations
        claim_type: violation_to_error
        grounds:
          - validations.priority_56
          - errors.ERR_INVALID_PANEL_COMPOSITION
          - entities.ReviewRound.fields.required_vote_count
        distinguishing_aspect: |
          One error id guards four independent clauses - size band, no duplicates,
          membership in the eligible role set, and mandatory inclusion of both veto
          holders - and each probe violates exactly one of them while satisfying the
          other three. The membership probe is the sharpest: MuseumOperations is a
          real role of this API and is even allowed to raise punch items, yet it is
          NOT panel-eligible, so an implementation that validates against the global
          role list instead of the panel list accepts it. Note also that the upper
          bound of 5 is exactly the size of the eligible set, so the only way to send
          6 entries is to duplicate one - the size clause and the duplicate clause
          overlap by construction, and the maximal legal panel is the full eligible
          set with quorum ceil(5 * 2 / 3) == 4.
        test_recipe:
          setup:
            - "project in SCHEMATIC with one DRAFT design package; the logical clock is 2026-08-01T00:00:00Z so the deadline 2026-08-20 is comfortably in the future"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
