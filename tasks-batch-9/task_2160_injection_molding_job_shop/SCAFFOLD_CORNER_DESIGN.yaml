  - section: cross_cutting_layers
    instances:

      - name: stale_press_version_on_schedule_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[job-schedule-stale-press]", "errors[ERR_STALE_PRESS_VERSION]", "validations[priority=8]", "entities.Press.fields.committed_minutes_scheduled"]
        distinguishing_aspect: "Scheduling job A advances Press.version, so a strictly later schedule of job B still carrying the pre-A version is rejected with 412 ERR_STALE_PRESS_VERSION; re-reading the press and retrying succeeds."
        test_recipe:
          setup:
            - "Standard approval chain; two DRAFT jobs on P-150 for 2026-09-10T08:00Z-16:00Z and 2026-09-12T08:00Z-16:00Z, so their windows never collide."
            - "The client read Press.version once, before either job was scheduled."
