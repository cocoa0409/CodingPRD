              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            # --- three applicants ---
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "M Melt", email: "m@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_m: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "K Keep", email: "k@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_k: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "W Wait", email: "w@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_w: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_m}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 70, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_m: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_k}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_k: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_w}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 60, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_w: $.data.id }
            # --- M: review path to ADMITTED ---
            - { call: "POST /enrollment/applications/${app_m}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_m}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rm1: $.data.id }
            - { call: "POST /enrollment/reviews/${rm1}/submit", payload: { score_academic: 70, score_fit: 70, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_m}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rm2: $.data.id }
            - { call: "POST /enrollment/reviews/${rm2}/submit", payload: { score_academic: 70, score_fit: 70, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_m}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_m}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            # --- K: review path to ADMITTED ---
            - { call: "POST /enrollment/applications/${app_k}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_k}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rk1: $.data.id }
            - { call: "POST /enrollment/reviews/${rk1}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_k}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rk2: $.data.id }
            - { call: "POST /enrollment/reviews/${rk2}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_k}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_k}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            # --- W: review path to WAITLISTED (entry created) ---
            - { call: "POST /enrollment/applications/${app_w}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_w}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rw1: $.data.id }
            - { call: "POST /enrollment/reviews/${rw1}/submit", payload: { score_academic: 60, score_fit: 60, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_w}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rw2: $.data.id }
            - { call: "POST /enrollment/reviews/${rw2}/submit", payload: { score_academic: 60, score_fit: 60, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_w}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_w}/transition", payload: { to_status: "WAITLISTED" }, as: AdmissionsOfficer }
            # --- cycle to DECISIONS_RELEASED, deposits, enroll K ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "REVIEW_CLOSED" }, as: EnrollmentManager }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "DECISIONS_RELEASED" }, as: EnrollmentManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/deposits"
              payload: { application_id: "${app_m}", amount_cents: 50000 }
              as: Applicant
              as_user_id: "${ap_m}"
              captures: { dep_m: $.data.id }
            - { call: "POST /enrollment/deposits", payload: { application_id: "${app_k}", amount_cents: 50000 }, as: Applicant, as_user_id: "${ap_k}" }
            - { call: "POST /enrollment/applications/${app_k}/transition", payload: { to_status: "ENROLLED" }, as: EnrollmentManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "ENROLLMENT_TRACKING" }, as: EnrollmentManager }
          trigger:
            - call: "POST /enrollment/cycles/${c_id}/melt-sweep"
              payload: {}
              as: EnrollmentManager
              captures: { melted_n: $.data.melted_count }
          assert:
            - "melt-sweep returns melted_count == 1 and melted_application_ids == [${app_m}] (K is ENROLLED, not swept)"
            - "Application ${app_m}.status == MELTED; Deposit ${dep_m}.status == FORFEITED with refund_amount_cents == 0"
            - "Program ${p_id}: deposited_count == 0, enrolled_count == 1, seats_open == 2, intake_posture == OPEN after recompute"
            - "W's WaitlistEntry status == ACTIVATED (auto-activation fired only after the posture flip) and activated_entry_ids contains it"
            - "Application ${app_w}.status == ADMITTED and program admitted_count == 1"
            - "W's WaitlistEntry rank_score == 76.0 (0.6*60 + 0.4*100)"

      - name: aid_revoke_cascade_recomputes_melt_risk
        grounds:
          - state_machines.AidOffer.ACCEPTED_to_REVOKED
          - calculations.melt_risk_score
          - calculations.aid_package_total
          - entities.Program.fields.scholarship_committed_cents
        distinguishing_aspect: |
          Depth-3 chain from the aid-revoke trigger (distinct from melt-sweep):
          ACCEPTED -> REVOKED (link 1) -> program scholarship ledger recompute
          (link 2) -> application aid_accepted_cents/aid_gap_cents and
          melt_risk_score recompute, crossing the 0.70 threshold and auto-
          creating a SCHEDULED intervention (link 3).
        test_recipe:
          setup:
            - "Program budget 3000000, tuition 5000000, capacity 3, target 2, deposit 50000; cycle in DECISIONS_RELEASED, clock 2027-04-01"
            - "Application (score 96, NATIONAL) ADMITTED with ACCEPTED MERIT offer 2500000, then DEPOSITED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "ENG", capacity_seats: 3, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 3000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
