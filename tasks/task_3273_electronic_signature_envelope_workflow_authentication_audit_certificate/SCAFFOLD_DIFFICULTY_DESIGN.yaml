  - rule_id: boundary_precision_check
    instances:
      - name: quote_discount_activates_at_exactly_hundred_pages
        grounds:
          - calculations.envelope_fee_quote
          - entities.EnvelopeDocument.fields.page_count
          - entities.Account.fields.page_allowance
          - validations[priority=34]
        distinguishing_aspect: |
          Two distinct metrics cross a boundary in opposite directions at adjacent points: at
          exactly 100 total pages the 2% discount switches on (>= 100, not > 100) while at 99
          pages it stays off, and the discount base is the subtotal formed after the page
          component, so the two quotes differ by the discount alone.
        test_recipe:
          setup:
            - "one STANDARD account with page_allowance 25"
            - "one envelope holding a single 100-page document"
            - "one further envelope holding a single 99-page document"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Std Co", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Boundary 100", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_100: $.data.id }
            - call: "POST /esign/envelopes/${env_100}/documents"
              payload: { name: "Hundred.pdf", page_count: 100 }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Boundary 99", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_99: $.data.id }
            - call: "POST /esign/envelopes/${env_99}/documents"
              payload: { name: "NinetyNine.pdf", page_count: 99 }
              as: Account
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /esign/envelopes/${env_100}/quote"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { q100_total: $.data.total_fee, q100_disc: $.data.discount }
          assert:
            - "Envelope.${env_100} quote.total_pages == 100"
            - "Envelope.${env_100} quote.page_component == 98.68  (ceil(100/10)=10 blocks minus floor(25/10)=2 free blocks = 8 chargeable blocks x 12.335 = 98.68)"
            - "Envelope.${env_100} quote.discount == 31.97  (2% of subtotal 1598.68, rounded half-up)"
            - "Envelope.${env_100} quote.total_fee == 1566.71"
            - "a 99-page envelope's quote.discount == 0.00, proving the boundary is inclusive at 100"
      - name: kba_third_failure_rejected_at_boundary
        grounds:
          - validations[priority=18]
          - errors[ERR_AUTH_MAX_ATTEMPTS]
          - entities.Recipient.fields.kba_fail_count
          - calculations.authentication_risk_score
        distinguishing_aspect: |
          The knowledge-based-question failure boundary sits on a different metric and endpoint
          from the page-count boundary: a recipient with exactly 2 recorded failures may attempt
          authentication again while the 3rd failed attempt is rejected with
          ERR_AUTH_MAX_ATTEMPTS, so the threshold is < 3, not <= 3.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one SEQUENTIAL envelope with a KBA SIGNER, already sent"
            - "the recipient has failed KBA authentication twice so kba_fail_count is 2"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "KBA boundary envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "KBA.pdf", page_count: 3 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "kba.boundary@example.com", routing_order: 1, auth_level: "KBA", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "KBA" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/recipients/${rec_id}/authenticate"
              payload: { method: "KBA", kba_answers_correct: false }
              as: Recipient
              as_user_id: "${rec_id}"
            - call: "POST /esign/recipients/${rec_id}/authenticate"
              payload: { method: "KBA", kba_answers_correct: false }
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { fails_after_second: $.data.kba_fail_count }
          trigger:
            - call: "POST /esign/recipients/${rec_id}/authenticate"
              payload: { method: "KBA", kba_answers_correct: false }
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { fails_after_third: $.data.kba_fail_count }
            - call: "POST /esign/recipients/${rec_id}/authenticate"
              payload: { method: "KBA", kba_answers_correct: false }
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "Recipient.${rec_id}.kba_fail_count == 3 after the third failed attempt  (an attempt at fail_count 2 is still processed, since the rule is kba_fail_count < 3)"
            - "response error_id of the fourth attempt == \"ERR_AUTH_MAX_ATTEMPTS\"  (at fail_count 3 the check kba_fail_count < 3 now fails)"
            - "http status == 422"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: recipient_sign_requires_envelope_in_flight
        grounds:
          - state_machines.Recipient.SIGNING_to_SIGNED
          - state_machines.Envelope.SENT_to_VOIDED
          - validations[priority=13]
          - errors[ERR_INVALID_ENVELOPE_STATE]
        distinguishing_aspect: |
          The Recipient-to-Envelope pair: a signer that is otherwise fully ready (authenticated,
          consented, fields filled, routing released) is still rejected once the owning Envelope
          is terminal, so the recipient's legal transition set is gated by the envelope's state
          and the failure surfaces as an envelope-level state error.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one SEQUENTIAL envelope with one authenticated, consented SIGNER holding a filled SIGNATURE field and an OPEN session"
            - "the envelope is then voided by the sender"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Guard envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Guard.pdf", page_count: 5 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "guarded@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Guarded" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v: $.data.version }
            - call: "POST /esign/recipients/${rec_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${rec_id}"
            - call: "POST /esign/envelopes/${env_id}/void"
              payload: { expected_envelope_version: "${env_v}", void_reason: "sender withdrew", refund_credit: false }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v_void: $.data.version }
          trigger:
            - call: "POST /esign/recipients/${rec_id}/sign"
              payload: {}
              as: Recipient
              as_user_id: "${rec_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "Envelope.${env_id}.status == \"VOIDED\" before the trigger"
            - "response error_id == \"ERR_INVALID_ENVELOPE_STATE\""
            - "Recipient.${rec_id}.status != \"SIGNED\"  (the recipient was VOIDED by the cascade and cannot sign)"
            - "http status == 409"
      - name: envelope_complete_requires_all_recipients_terminal
        grounds:
          - state_machines.Envelope.DELIVERED_to_COMPLETED
          - state_machines.Recipient.SIGNING_to_SIGNED
          - validations[priority=13]
          - entities.FieldPlacement.fields.required
        distinguishing_aspect: |
          The Envelope-to-Recipient pair: the seal request is gated by the aggregate state of
          child recipients, so an envelope whose signer list is only partly terminal rejects the
          transition with ERR_INVALID_ENVELOPE_STATE even though its own status is DELIVERED and
          every field is filled.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one PARALLEL envelope with two SIGNER recipients, one of whom has signed and one who is still SIGNING"
            - "both hold filled SIGNATURE fields"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Standard Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Aggregate gate envelope", routing_mode: "PARALLEL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Aggregate.pdf", page_count: 7 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "done@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { done_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "pending@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { pending_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${done_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Done" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${pending_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 2, value: "Pending" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/feed"
              payload: { feed_event: "DELIVERED" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v_delivered: $.data.version }
            - call: "POST /esign/recipients/${done_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${done_id}"
            - call: "POST /esign/recipients/${done_id}/sign"
              payload: {}
              as: Recipient
              as_user_id: "${done_id}"
            - call: "GET /esign/envelopes/${env_id}"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v_after_sign: $.data.version }
            - call: "POST /esign/recipients/${pending_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${pending_id}"
          trigger:
            - call: "POST /esign/envelopes/${env_id}/complete"
              payload: { expected_envelope_version: "${env_v_after_sign}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "Recipient.${done_id}.status == \"SIGNED\" and Recipient.${pending_id}.status == \"SIGNING\" before the trigger"
            - "response error_id == \"ERR_INVALID_ENVELOPE_STATE\"  (the join is not satisfiable while a signer is non-terminal)"
            - "Envelope.${env_id}.status == \"DELIVERED\"  (the envelope did not advance)"
            - "Envelope.${env_id}.is_sealed == false"
  - rule_id: resource_temporal_overlap
    instances:
      - name: purge_blocked_when_legal_hold_window_overlaps_retention_window
        grounds:
          - calculations.retention_expiry
          - entities.Envelope.fields.legal_hold_started_at
          - entities.Envelope.fields.legal_hold_until
          - validations[priority=23]
          - errors[ERR_RETENTION_NOT_EXPIRED]
        distinguishing_aspect: |
          This overlap rule uses closed-open interval overlap arithmetic on one envelope: the
          retention window [anchor, purge_eligible_at) is closed at the low end and open at the
          high end, so a legal hold whose start instant equals purge_eligible_at does NOT block
          the purge while a hold starting one second earlier DOES — a half-open boundary rule,
          not a simple containment test.
        test_recipe:
          setup:
            - "one STANDARD account in state CA with a GLOBAL retention policy of 3 years and purge_grace_days 0"
            - "one envelope sent on 2026-09-01 and completed so its sent_at anchors the retention window"
            - "retention window resolves to [2026-09-01T00:00:00Z, 2029-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Acme Signing", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Global Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/accounts/${acct_id}/credit-adjustments"
              payload: { delta_units: 10000, reason: "seed for tests" }
              as: PlatformAdmin
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Overlap envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Overlap.pdf", page_count: 5 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "overlap@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Overlap" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/feed"
              payload: { feed_event: "DELIVERED" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/recipients/${rec_id}/sessions"
              payload: { consent_to_electronic_records: true }
              as: Recipient
              as_user_id: "${rec_id}"
            - call: "POST /esign/recipients/${rec_id}/sign"
              payload: {}
              as: Recipient
              as_user_id: "${rec_id}"
            - call: "POST /esign/envelopes/${env_id}/legal-hold"
              payload: { legal_hold: true, hold_until: "2029-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { env_v_purge: $.data.version }
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-31T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /esign/envelopes/${env_id}/purge"
              payload: { expected_envelope_version: "${env_v_purge}" }
              as: PlatformAdmin
              captures: { err_code: $.data.error_id }
          assert:
            - "response error_id == \"ERR_LEGAL_HOLD_FROZEN\"  (the hold window [start, 2029-09-01T00:00:00Z) covers the clock 2029-08-31T23:59:59Z, one second short of the open high end)"
            - "Envelope.${env_id}.purged_at == null"
      - name: reminder_cooldown_rejects_within_24h_buffer
        grounds:
          - entities.Recipient.fields.last_reminder_at
          - validations[priority=35]
          - errors[ERR_REMINDER_COOLDOWN]
          - endpoints.POST_/esign/envelopes/{id}/reminders
        distinguishing_aspect: |
          This overlap rule sits on a different resource and uses a fixed-buffer interval: a
          Recipient's reminder cooldown window [last_reminder_at, last_reminder_at + 24h) is
          closed-open, so a reminder sent exactly 24 hours after the previous one is accepted
          while one sent 23 hours and 59 minutes after is rejected — a buffer semantics distinct
          from the unbuffered retention/hold overlap.
        test_recipe:
          setup:
            - "one STANDARD account seeded to credit_balance 11000"
            - "one SEQUENTIAL envelope with a single SIGNER, already sent, whose first reminder was sent at 2026-09-02T00:00:00Z"
            - "the logical clock is advanced to 2026-09-02T23:59:00Z, inside the 24-hour cooldown"
