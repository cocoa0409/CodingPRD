              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { du_agr1: $.data.id }
            - call: "POST /agreements/${du_agr1}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${du_aff}"
          trigger:
            - call: "POST /signing-pools"
              payload: { season_year: 2026, base_pool_cents: 6000000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { du_err1: $.data.error_id }
            - call: "POST /affiliates/${du_aff}/agreements"
              payload: { term_start_date: "2027-01-01", term_end_date: "2027-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { du_agr2: $.data.id }
            - call: "POST /agreements/${du_agr2}/disposition"
