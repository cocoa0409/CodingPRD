          A different metric — the two aggregate DENOMINATORS claimed_units and supported_units —
          read through a different endpoint, GET /incentives/programs/{id}/spend-summary. The
          program has a claim, but its only claim was REJECTED, so both input sets are empty and
          both quotients must be exactly 0 rather than null, an error, or a division by zero.
