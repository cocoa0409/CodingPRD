  - id: ERR_ASSIGNMENT_NOT_IN_PROGRESS
    http: 409
    condition: "Assignment not in IN_PROGRESS state"

  - id: ERR_ASSIGNMENT_NOT_CANCELLABLE
    http: 409
    condition: "Assignment cannot be cancelled in current state"

  - id: ERR_ASSIGNMENT_NOT_COMPLETED
    http: 409
    condition: "Assignment not in COMPLETED state"

  - id: ERR_WORKER_AT_CAPACITY
    http: 409
    condition: "Worker at max active assignments"

  - id: ERR_ORDER_ALREADY_HAS_ACTIVE_ASSIGNMENT
    http: 409
