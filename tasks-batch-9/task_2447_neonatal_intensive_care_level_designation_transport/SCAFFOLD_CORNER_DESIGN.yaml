            - call: "POST /surveillance-reports"
              payload: { unit_id: "${unit_a}", period_start: "2026-08-31T00:00:00Z", period_end: "2026-08-01T00:00:00Z", reported_patient_days: 10, reported_central_line_days: 4 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { e_period_schema: $.data.error_id }
            - call: "POST /surveillance-reports"
              payload: { unit_id: "${unit_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", reported_patient_days: 10, reported_central_line_days: 4 }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { rep_ok: $.data.id }
          assert:
