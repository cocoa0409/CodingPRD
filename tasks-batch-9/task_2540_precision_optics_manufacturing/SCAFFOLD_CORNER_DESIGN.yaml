              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/metrology-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MetrologyTechnician
              as_user_id: "mt-001"
            - call: "GET /optics/coating-chambers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "GET /optics/coating-runs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/assemblies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/assembly-components/00000000-0000-0000-0000-000000000000"
              payload: {}
