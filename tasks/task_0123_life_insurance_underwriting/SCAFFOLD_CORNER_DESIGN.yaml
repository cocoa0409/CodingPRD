scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_applicant_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.Applicant
          - endpoints["POST /applicants"]
        distinguishing_aspect: "POST /applicants with all required fields returns 201 and echoes full_name, date_of_birth, sex, tobacco_use, email plus server id/created_at."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "New Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "new@x.com" }
              as: Underwriter
              as_user_id: "any-underwriter-uuid-not-checked-on-create"
              captures: { appl_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Applicant.${appl_id}.full_name == New Person"
            - "Applicant.${appl_id}.sex == MALE"
            - "Applicant.${appl_id}.tobacco_use == false"
            - "response data.id is a UUID with no type prefix"

      - name: get_nonexistent_applicant_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Applicant
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /applicants/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /applicants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_application_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Application.fields.requested_face_amount_cents
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applications omitting requested_face_amount_cents (required, source input, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "A Product and an Applicant exist."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-REQ", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Req Test", date_of_birth: "1990-01-01", sex: "FEMALE", tobacco_use: false, email: "req@x.com" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { appl_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: product_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Product.fields.contestability_months
          - entities.Product.fields.grace_period_days
          - entities.Product.fields.max_loan_to_cash_value_pct
          - entities.Product.fields.exam_validity_days
        distinguishing_aspect: "POST /products omitting contestability_months/grace_period_days/max_loan_to_cash_value_pct/exam_validity_days applies defaults 24 / 31 / 90 / 180."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { code: "C-DEF", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
          assert:
            - "Product.${prod_id}.contestability_months == 24"
            - "Product.${prod_id}.grace_period_days == 31"
            - "Product.${prod_id}.max_loan_to_cash_value_pct == 90"
            - "Product.${prod_id}.exam_validity_days == 180"

      - name: mib_check_result_computed_clear_when_no_hit
        claim_type: Computed Fields
        grounds:
          - entities.MIBCheck.fields.result
          - endpoints["POST /applications/{id}/mib-checks"]
        distinguishing_aspect: "MIBCheck.result is computed: mib_hit=false and rx_flag_count=0 -> CLEAR (any client-supplied result is ignored / not accepted)."
        test_recipe:
          setup:
            - "An Application exists (DRAFT is fine; mib-checks attach by FK)."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-MIB", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Mib Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "mibp@x.com" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { mib_result: $.data.result }
          assert:
            - "MIBCheck just created has result == CLEAR"

      - name: mib_check_result_computed_flagged_when_rx_flagged
        claim_type: Computed Fields
        grounds:
          - entities.MIBCheck.fields.result
          - entities.MIBCheck.fields.rx_flag_count
        distinguishing_aspect: "MIBCheck.result FLAGGED when rx_flag_count > 0 even though mib_hit is false (Rx branch of the OR)."
        test_recipe:
          setup:
            - "An Application exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-MIB2", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Rx Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "rxp@x.com" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 2 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { mib_result: $.data.result }
          assert:
            - "MIBCheck just created has result == FLAGGED"

      - name: applicant_invalid_sex_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.sex
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applicants with sex outside {MALE, FEMALE} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Bad Sex", date_of_birth: "1990-01-01", sex: "OTHER", tobacco_use: false, email: "bad@x.com" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: mib_check_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.MIBCheck
        distinguishing_aspect: "MIBCheck has common_fields:false -> only id and created_at; no version field and no update endpoint exists for it."
        test_recipe:
          setup:
            - "An Application with one MIBCheck exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-IMM", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Imm Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "imm@x.com" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { mib_app: $.data.application_id }
          assert:
            - "the created MIBCheck response carries id and created_at but no version key"

      - name: create_application_wrong_product_reference_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Application.fields.product_id
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "POST /applications with a product_id that does not exist returns ERR_REFERENCE_NOT_FOUND (404) — body FK integrity."
        test_recipe:
          setup:
            - "An Applicant exists; no Product with the cited id."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Ref Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "ref@x.com" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { appl_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "11111111-1111-4111-8111-111111111111", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_REFERENCE_NOT_FOUND"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: application_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - entities.Application.fields.status
          - endpoints["POST /applications"]
        distinguishing_aspect: "A newly created Application starts in status DRAFT with provisional/final premiums null."
        test_recipe:
          setup:
            - "A Product and Applicant exist."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-INIT", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Init Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "init@x.com" }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { appl_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "u-uuid"
              captures: { app_id: $.data.id, st: $.data.status }
          assert:
            - "Application.${app_id}.status == DRAFT"
            - "Application.${app_id}.provisional_annual_premium_cents == null"
            - "Application.${app_id}.version == 1"

      - name: approve_from_draft_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling approve on a DRAFT application (approve only defined from UNDER_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A DRAFT Application exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-INV", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U", license_id: "LIC-INV" }
              as: Admin
              captures: { u_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Inv Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "invp@x.com" }
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { app_id: $.data.id, ver: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { expected_application_version: "${ver}" }
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: declined_application_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Application
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal DECLINED, any further transition (e.g. begin-review) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "An Application DECLINED from SUBMITTED."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-TERM", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U", license_id: "LIC-TERM" }
              as: Admin
              captures: { u_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Term Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "termp@x.com" }
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u_id}"
            - call: "POST /applications/${app_id}/decline"
              payload: {}
              as: Underwriter
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"
            - "Application.${app_id}.status == DECLINED (unchanged)"

      - name: submit_twice_idempotency_second_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting an already-SUBMITTED application a second time is rejected ERR_INVALID_STATE (submit defined only from DRAFT)."
        test_recipe:
          setup:
            - "A SUBMITTED Application exists."
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "C-IDEM", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U", license_id: "LIC-IDEM" }
              as: Admin
              captures: { u_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Idem Person", date_of_birth: "1990-01-01", sex: "MALE", tobacco_use: false, email: "idemp@x.com" }
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: contestability_flips_incontestable_after_window
        claim_type: cyclic
        grounds:
          - state_machines.Policy.CONTESTABLE_to_INCONTESTABLE
          - entities.Policy.fields.contestability_status
        distinguishing_aspect: "After the clock passes issue_date + contestability_months (2026-06-01 + 24mo = 2028-06-01), reading the policy shows contestability_status INCONTESTABLE while lifecycle stays IN_FORCE (premium kept current)."
        test_recipe:
          setup:
            - "An ISSUED Policy at issue_date 2026-06-01 with on-cycle premiums paid through 2028-06-01 so lifecycle stays IN_FORCE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /products"
              payload: { code: "C-CON", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1", license_id: "LIC-CON1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2", license_id: "LIC-CON2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Con Owner", date_of_birth: "1986-06-06", sex: "MALE", tobacco_use: false, email: "con@x.com" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { appl_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_id: "${prod_id}", requested_face_amount_cents: 50000000 }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/order-exam"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/paramed-exams"
              payload: { height_inches: 70, weight_pounds: 160, systolic_bp: 120, exam_date: "2026-05-01" }
              as: Underwriter
              as_user_id: "${u1_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /paramed-exams/${exam_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/mib-checks"
              payload: { mib_hit: false, rx_flag_count: 0 }
              as: Underwriter
              as_user_id: "${u1_id}"
            - call: "POST /applications/${app_id}/begin-review"
              payload: {}
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_review: $.data.version }
            - call: "POST /applications/${app_id}/approve"
              payload: { expected_application_version: "${ver_review}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { ver_offer: $.data.version }
            - call: "POST /applications/${app_id}/issue"
              payload: { expected_application_version: "${ver_offer}" }
              as: Underwriter
              as_user_id: "${u2_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /policies/${policy_id}/premium-payments"
              payload: { amount_cents: 125000 }
              as: PolicyOwner
              as_user_id: "${appl_id}"
            - call: "POST /policies/${policy_id}/premium-payments"
              payload: { amount_cents: 125000 }
              as: PolicyOwner
              as_user_id: "${appl_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-06-01T00:00:00Z" }
              as: Admin
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: PolicyOwner
              as_user_id: "${appl_id}"
              captures: { life: $.data.lifecycle_status, contest: $.data.contestability_status }
          assert:
            - "Policy.${policy_id}.contestability_status == INCONTESTABLE"
            - "Policy.${policy_id}.lifecycle_status == IN_FORCE"

      - name: lapsed_policy_reinstated_resets_contestability
        claim_type: cyclic
        grounds:
          - state_machines.Policy.LAPSED_to_REINSTATED
          - entities.Policy.fields.contestability_status
          - endpoints["POST /policies/{id}/reinstate"]
        distinguishing_aspect: "A LAPSED policy reinstated within the 3-year window returns lifecycle REINSTATED and contestability reset to CONTESTABLE (fresh window from reinstatement)."
        test_recipe:
          setup:
            - "An ISSUED Policy that LAPSED (clock 2027-08-01) and is reinstated within the window with back premiums for the missed year."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /products"
              payload: { code: "C-REIN", base_annual_rate_per_thousand_cents: 250, max_face_amount_cents: 100000000, cash_value_accrual_rate_bps: 300, contestability_months: 24, grace_period_days: 31, max_loan_to_cash_value_pct: 90, exam_validity_days: 180 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U1", license_id: "LIC-REIN1" }
              as: Admin
              captures: { u1_id: $.data.id }
            - call: "POST /underwriters"
              payload: { name: "U2", license_id: "LIC-REIN2" }
              as: Admin
              captures: { u2_id: $.data.id }
            - call: "POST /applicants"
