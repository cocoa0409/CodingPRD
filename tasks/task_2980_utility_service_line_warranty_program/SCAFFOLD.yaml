# =============================================================================
# SCAFFOLD.yaml — task_2980_utility_service_line_warranty_program
# §1.0–§1.7. Difficulty design (§1.8) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design (§1.9) lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2980. Utility Service Line Warranty Program (HomeServe USA): utility brand-partner marketing approval and mailing list suppression rules, product eligibility by service line ownership at the curb stop or meter, waiting period and pre-existing-condition exclusions, benefit cap per occurrence and per year with reset rules, contractor network dispatch, response SLA and permit/restoration scope, claim denial appeal and regulator complaint response, bill-inserted billing vs direct billing and cancellation refund proration, renewal price change notice requirements

domain_name: utility-service-line-warranty-program

# Flat topology: every collection is a peer at the API root and children carry
# foreign keys in the request body rather than in the URL path.
api_prefix: "/"

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: cyclic

  relationship_patterns:
    - one_to_many          # UtilityPartner -> ServiceLineProduct / Premises / MarketingCampaign
    - self_referential     # Claim.recurrence_of_claim_id -> Claim.id; Dispatch.supersedes_dispatch_id -> Dispatch.id
    - cross_aggregate      # Dispatch (network aggregate) mutates Enrollment (policy aggregate) benefit ledger
    - polymorphic_optional # RegulatorComplaint may point at a Claim, an Enrollment, both, or neither

  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Compliance/audit is the spine: nothing may be mailed without brand-partner
    approval, nothing may be paid past a filed cap, and nothing may be repriced
    without a notice whose required lead time is itself derived from the size of
    the increase. Quota/allocation is layered on top as the per-occurrence and
    per-year benefit caps, which are consumed by a pinned-order waterfall and
    reset only by a compliant renewal. Two independent cycles (campaign
    reject -> resubmit, complaint close -> escalate -> re-respond) plus three
    parallel state dimensions on Enrollment (coverage x billing x cap) supply the
    non-linear shape; the benefit ledger and the contractor capacity counter
    supply two independently conserved quantities.

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: UtilityPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the utility brand partner whose logo appears on the mail piece.
        constraints: 1..120 chars, non-blank
      - name: utility_type
        type: enum
        source: input
        description: Kind of utility the partner operates.
        constraints: "one of {WATER, WASTEWATER, ELECTRIC, COMBINATION}"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code whose regulator has jurisdiction over this partner.
        constraints: exactly 2 uppercase A-Z characters
      - name: status
        type: enum
        source: system
        description: Partnership lifecycle state; gates marketing and new enrollments.
        default: ONBOARDING
        constraints: "one of {ONBOARDING, ACTIVE, SUSPENDED, TERMINATED}"
      - name: brand_approval_required
        type: boolean
        source: input
        description: When true a campaign may only be mailed after an explicit PartnerBrandReviewer approval.
        default: true
      - name: min_days_between_drops
        type: integer
        source: input
        description: Minimum whole-day separation required between two of this partner's mail drops (closed interval - see calculations.campaign_drop_window_conflict).
        default: 21
        constraints: 0..180
      - name: max_mailings_per_year
        type: integer
        source: input
        description: Contact-frequency cap; a premises mailed this many times in the current calendar year is suppressed.
        default: 2
        constraints: 1..12
      - name: rate_filing_required
        type: boolean
        source: input
        description: When true a renewal increase above RATE_FILING_PCT_THRESHOLD may not be noticed at all (state filing not modelled).
        default: false
      - name: bill_insert_supported
        type: boolean
        source: input
        description: When false an Enrollment on this partner's products may not use billing_mode BILL_INSERT.
        default: true
      - name: suspension_reason
        type: string
        source: system
        description: Free-text reason recorded on the most recent transition into SUSPENDED or TERMINATED; null while ONBOARDING/ACTIVE.
        default: null
      - name: enrolled_premises_count
        type: integer
        source: computed
        description: "Cross-entity count: number of distinct Premises with partner_id == this partner that have at least one Enrollment whose coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY}."

  - name: ServiceLineProduct
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: FK -> UtilityPartner.id; the brand partner that sponsors this product.
      - name: name
        type: string
        source: input
        description: Marketed product name.
        constraints: 1..120 chars, non-blank
      - name: line_type
        type: enum
        source: input
        description: Service line this product repairs; a Claim's line_type must equal it.
        constraints: "one of {WATER_SERVICE_LINE, SEWER_LATERAL, INTERIOR_PLUMBING, EXTERIOR_ELECTRIC}"
      - name: ownership_boundary
        type: enum
        source: input
        description: Point at which homeowner ownership begins; drives COVERED_DEFECT_LOCATIONS in calculations.claim_eligibility_assessment.
        constraints: "one of {CURB_STOP, METER, PROPERTY_LINE, INSIDE}"
      - name: required_owned_segment
        type: enum
        source: input
        description: Segment a Premises must list in owned_segments to be eligible to enrol in this product.
        constraints: "one of {WATER_CURB_STOP_TO_HOME, WATER_METER_TO_HOME, SEWER_PROPERTY_LINE_TO_MAIN, INTERIOR_PLUMBING_SYSTEM, EXTERIOR_ELECTRIC_MAST}"
      - name: monthly_price_cents
        type: integer
        source: input
        description: List price per month in cents; pinned onto Enrollment.monthly_price_cents at enrollment time.
        constraints: 100..20000
      - name: waiting_period_days
        type: integer
        source: input
        description: Whole days after enrollment_date before coverage becomes effective.
        constraints: 0..90
      - name: per_occurrence_cap_cents
        type: integer
        source: input
        description: Maximum benefit payable across a single occurrence group (a claim plus its recurrences).
        constraints: 10000..2000000
      - name: annual_cap_cents
        type: integer
        source: input
        description: Maximum benefit payable within one cap year on an Enrollment of this product.
        constraints: 10000..5000000
      - name: permit_covered
        type: boolean
        source: input
        description: When false the PERMIT waterfall bucket contributes 0 covered cents and the permit fee falls to the customer.
      - name: restoration_covered_scope
        type: enum
        source: input
        description: Restoration allowance tier; maps to RESTORATION_ALLOWANCE_CENTS in calculations.dispatch_benefit_settlement.
        constraints: "one of {NONE, BASIC_BACKFILL, FULL_HARDSCAPE}"
      - name: cap_reset_basis
        type: enum
        source: input
        description: Whether the annual cap window starts on the enrollment anniversary or on 1 January.
        constraints: "one of {ENROLLMENT_ANNIVERSARY, CALENDAR_YEAR}"
      - name: status
        type: enum
        source: system
        description: AVAILABLE for new enrollments; set to WITHDRAWN when the sponsoring partner transitions to TERMINATED.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, WITHDRAWN}"

  - name: Premises
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: FK -> UtilityPartner.id; the utility whose service territory contains this address.
      - name: last_mailed_campaign_id
        type: string
        source: system
        description: FK -> MarketingCampaign.id; the most recent campaign whose mail drop decided MAILED for this premises. Null until first mailed.
        default: null
      - name: street_address
        type: string
        source: input
        description: Single-line service address, unique per partner.
        constraints: 1..200 chars, non-blank; unique per (partner_id, street_address)
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the address.
        constraints: exactly 2 uppercase A-Z characters
      - name: owned_segments
        type: array
        source: input
        description: Service-line segments the homeowner owns at this address; compared against ServiceLineProduct.required_owned_segment.
        constraints: "non-empty array of distinct values from {WATER_CURB_STOP_TO_HOME, WATER_METER_TO_HOME, SEWER_PROPERTY_LINE_TO_MAIN, INTERIOR_PLUMBING_SYSTEM, EXTERIOR_ELECTRIC_MAST}"
      - name: do_not_mail
        type: boolean
        source: input
        description: Homeowner opt-out flag; highest-precedence mailing suppression reason.
        default: false
      - name: address_status
        type: enum
        source: input
        description: Deliverability of the address.
        default: GOOD
        constraints: "one of {GOOD, BAD}"
      - name: known_defect_reported_at
        type: datetime
        source: input
        description: Instant at which a defect on this address was first reported to the utility; a defect known strictly before coverage_effective_at makes any claim PRE_EXISTING. Null when no defect is on record.
        default: null
        constraints: ISO 8601 UTC instant with exactly three fractional-second digits (e.g. 2026-08-02T00:00:00.000Z)
      - name: regulator_hold
        type: boolean
        source: system
        description: Set true while at least one RegulatorComplaint on this premises' enrollments is in a non-closed status.
        default: false
      - name: mail_count_current_year
        type: integer
        source: computed
        description: Number of mail drops that decided MAILED for this premises with drop_date in the current calendar year of the logical clock.
      - name: suppression_reason
        type: enum
        source: computed
        description: "Highest-precedence partner-level (campaign-independent) suppression reason, evaluated in the SUPPRESSION_PRECEDENCE order of calculations.mail_drop_suppression_allocation with the two campaign-scoped reasons ACTIVE_ENROLLMENT and OWNERSHIP_INELIGIBLE skipped, because both depend on the campaign's product_id. NONE when no partner-level reason matches."
        constraints: "one of {NONE, DNM_REQUEST, BAD_ADDRESS, REGULATOR_COMPLAINT_OPEN, OPEN_APPEAL, CONTACT_FREQUENCY_CAP}"
      - name: suppressed
        type: boolean
        source: computed
        description: True exactly when suppression_reason != NONE.
      - name: last_mail_decision
        type: enum
        source: system
        description: Outcome of the most recent mail drop that evaluated this premises.
        default: NOT_EVALUATED
        constraints: "one of {NOT_EVALUATED, MAILED, SUPPRESSED}"
      - name: last_mail_suppression_reason
        type: enum
        source: system
        description: Reason recorded by the most recent mail drop when last_mail_decision == SUPPRESSED; includes the campaign-scoped reasons that never appear in suppression_reason. Null otherwise.
        default: null
        constraints: "one of {DNM_REQUEST, BAD_ADDRESS, REGULATOR_COMPLAINT_OPEN, OPEN_APPEAL, CONTACT_FREQUENCY_CAP, ACTIVE_ENROLLMENT, OWNERSHIP_INELIGIBLE, QUANTITY_CAP}"

  - name: MarketingCampaign
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: FK -> UtilityPartner.id; brand partner whose approval the campaign needs.
      - name: product_id
        type: string
        source: input
        description: FK -> ServiceLineProduct.id; the single product this campaign markets. Must belong to partner_id.
      - name: name
        type: string
        source: input
        description: Internal campaign name.
        constraints: 1..120 chars, non-blank
      - name: piece_type
        type: enum
        source: input
        description: Physical/electronic form of the marketing piece.
        constraints: "one of {BILL_INSERT, DIRECT_MAIL_LETTER, POSTCARD, EMAIL}"
      - name: drop_date
        type: string
        source: input
        description: Calendar date on which the piece enters the mail stream; used by the drop-window conflict rule.
        constraints: calendar date YYYY-MM-DD with no time component
      - name: requested_quantity
        type: integer
        source: input
        description: Quantity of pieces marketing asks the partner to approve.
        constraints: 0..1000000
      - name: approved_quantity
        type: integer
        source: system
        description: Quantity the PartnerBrandReviewer authorised; defaults to requested_quantity when the decision omits it. Null until an APPROVE decision is recorded.
        default: null
      - name: status
        type: enum
        source: system
        description: Campaign approval lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, PARTNER_REVIEW, APPROVED, REJECTED, MAILED, WITHDRAWN}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the MarketingOps operator who most recently submitted the campaign for review; null while DRAFT.
        default: null
      - name: decision_by_user_id
        type: string
        source: system
        description: X-User-ID of the PartnerBrandReviewer who recorded the most recent decision; null before the first decision.
        default: null
      - name: decision_note
        type: string
        source: system
        description: Free text supplied with the most recent APPROVE/REJECT decision.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent decision.
        default: null
      - name: revision_count
        type: integer
        source: system
        description: Number of times the campaign has been re-submitted after a REJECTED decision; capped by MAX_CAMPAIGN_REVISIONS.
        default: 0
      - name: mailed_count
        type: integer
        source: system
        description: Number of Premises the mail drop decided MAILED.
        default: 0
      - name: suppressed_count
        type: integer
        source: system
        description: Number of Premises the mail drop decided SUPPRESSED.
        default: 0
      - name: mail_dropped_at
        type: datetime
        source: system
        description: Logical-clock instant at which the mail drop executed; null until MAILED.
        default: null

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: premises_id
        type: string
        source: input
        description: FK -> Premises.id; the covered address.
      - name: product_id
        type: string
        source: input
        description: FK -> ServiceLineProduct.id; the enrolled product.
      - name: source_campaign_id
        type: string
        source: input
        description: FK -> MarketingCampaign.id; marketing attribution. Null for a direct/inbound enrollment that no campaign produced.
        default: null
      - name: billing_mode
        type: enum
        source: input
        description: BILL_INSERT collects premium on the utility bill (monthly, no prepayment); DIRECT_BILL collects a 12-month prepayment up front.
        constraints: "one of {BILL_INSERT, DIRECT_BILL}"
      - name: enrollment_date
        type: datetime
        source: system
        description: Logical-clock instant at which the enrollment was created.
      - name: term_start
        type: string
        source: system
        description: Calendar date component of enrollment_date; inclusive start of the coverage term.
        constraints: calendar date YYYY-MM-DD
      - name: term_end
        type: string
        source: system
        description: Exclusive end of the coverage term; term_start plus 12 calendar months, advanced by 12 months on each renewal.
        constraints: calendar date YYYY-MM-DD
      - name: coverage_effective_at
        type: datetime
        source: computed
        description: "term_start plus ServiceLineProduct.waiting_period_days whole days at 00:00:00.000Z; a claim reported at exactly this instant is inside coverage (>=)."
      - name: coverage_status
        type: enum
        source: system
        description: "Coverage dimension of the parallel state machine."
        default: PENDING_WAITING_PERIOD
        constraints: "one of {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY, CANCELLED, LAPSED}"
      - name: billing_status
        type: enum
        source: system
        description: "Billing dimension of the parallel state machine; evolves independently of coverage_status."
        default: CURRENT
        constraints: "one of {CURRENT, PAST_DUE, WRITTEN_OFF, REFUND_ISSUED, CREDIT_ISSUED}"
      - name: cap_status
        type: enum
        source: system
        description: "Benefit-cap dimension of the parallel state machine; flips to ANNUAL_CAP_EXHAUSTED when annual_benefit_used_cents >= product.annual_cap_cents and back to WITHIN_CAP on a cap-year reset."
        default: WITHIN_CAP
        constraints: "one of {WITHIN_CAP, ANNUAL_CAP_EXHAUSTED}"
      - name: monthly_price_cents
        type: integer
        source: system
        description: Price pinned from ServiceLineProduct.monthly_price_cents at creation; later product price edits never reprice an existing enrollment.
      - name: prepaid_amount_cents
        type: integer
        source: system
        description: "monthly_price_cents * 12 when billing_mode == DIRECT_BILL; 0 when BILL_INSERT."
      - name: premium_collected_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents for this enrollment where ledger_kind == CASH and entry_type IN {PREMIUM_PAYMENT, INSERT_REMITTANCE, CANCELLATION_FEE, REFUND_CLAWBACK}."
      - name: premium_refunded_cents
        type: integer
        source: computed
        description: "Absolute value of the sum of LedgerEntry.amount_cents for this enrollment where ledger_kind == CASH and entry_type IN {PRORATION_REFUND, PRORATION_CREDIT, WRITE_OFF}."
      - name: cap_year_start
        type: string
        source: system
        description: Inclusive start date of the current cap year; term_start when cap_reset_basis == ENROLLMENT_ANNIVERSARY, 1 January of term_start's year when CALENDAR_YEAR. Advanced by 12 months on renewal.
        constraints: calendar date YYYY-MM-DD
      - name: annual_benefit_used_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents for this enrollment where ledger_kind == BENEFIT and entry_type IN {BENEFIT_CHARGE, BENEFIT_REVERSAL} and cap_year_start == Enrollment.cap_year_start."
      - name: annual_benefit_reserved_cents
        type: integer
        source: computed
        description: "Sum of Dispatch.estimated_benefit_cents over dispatches of this enrollment's claims whose status IN {ASSIGNED, ACCEPTED, ON_SITE}; a forward-looking hold that reduces the annual pool before any invoice exists."
      - name: past_due_since
        type: string
        source: system
        description: Calendar date on which billing_status last became PAST_DUE; null while CURRENT.
        default: null
        constraints: calendar date YYYY-MM-DD
      - name: retention_hold
        type: boolean
        source: system
        description: True while at least one Claim on this enrollment is in status APPEAL_OPEN; blocks cancellation.
        default: false
      - name: renewal_price_cents
        type: integer
        source: system
        description: Price quoted on the most recent renewal notice; null when no notice is outstanding.
        default: null
      - name: renewal_notice_sent_at
        type: datetime
        source: system
        description: Logical-clock instant at which the most recent renewal notice was sent.
        default: null
      - name: renewal_effective_date
        type: string
        source: system
        description: Date on which the noticed price is to take effect; must equal term_end for the notice to be applied by the renewal run.
        default: null
        constraints: calendar date YYYY-MM-DD
      - name: renewal_notice_status
        type: enum
        source: system
        description: Disposition of the most recent renewal notice.
        default: NONE
        constraints: "one of {NONE, SENT, VOIDED, APPLIED, NOT_APPLIED_NO_COMPLIANT_NOTICE}"
      - name: renewal_count
        type: integer
        source: system
        description: Number of completed renewal-run renewals on this enrollment.
        default: 0
      - name: cancellation_effective_date
        type: string
        source: system
        description: Exclusive end of earned coverage used by the proration calculation; null until cancelled.
        default: null
        constraints: calendar date YYYY-MM-DD
      - name: cancellation_reason
        type: enum
        source: system
        description: Reason recorded on cancellation.
        default: null
        constraints: "one of {CUSTOMER_REQUEST, MOVED, NONPAYMENT, REGULATOR_REMEDY}"
      - name: refund_cents
        type: integer
        source: system
        description: Cash refunded to the customer on cancellation (DIRECT_BILL only); null until cancelled, 0 when the mode issues a credit instead.
        default: null
      - name: credit_cents
        type: integer
        source: system
        description: Bill credit granted on cancellation (BILL_INSERT only); null until cancelled, 0 when the mode issues a cash refund instead.
        default: null
      - name: cancellation_fee_cents
        type: integer
        source: system
        description: Administrative fee withheld from a DIRECT_BILL refund outside the free-look window; null until cancelled.
        default: null

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the policy the claim is made against.
      - name: recurrence_of_claim_id
        type: string
        source: input
        description: FK -> Claim.id; prior claim whose occurrence group this claim joins. Null when this claim opens a new occurrence group; never inferred by the server (see the recurrence_rule of calculations.claim_eligibility_assessment).
        default: null
      - name: occurrence_root_claim_id
        type: string
        source: computed
        description: Identifier of the first claim of this occurrence group; equals this claim's own id when recurrence_of_claim_id is null, otherwise the referenced claim's occurrence_root_claim_id.
      - name: line_type
        type: enum
        source: input
        description: Service line the defect is on; must equal the enrolled product's line_type.
        constraints: "one of {WATER_SERVICE_LINE, SEWER_LATERAL, INTERIOR_PLUMBING, EXTERIOR_ELECTRIC}"
      - name: defect_location
        type: enum
        source: input
        description: Physical segment where the failure occurred; checked against COVERED_DEFECT_LOCATIONS for the product's ownership_boundary.
        constraints: "one of {CURB_STOP_TO_METER, METER_TO_HOME, INSIDE_HOME, PROPERTY_LINE_TO_MAIN}"
      - name: urgency
        type: enum
        source: input
        description: Drives the response SLA hours applied to the claim's first dispatch.
        constraints: "one of {EMERGENCY, URGENT, ROUTINE}"
      - name: incident_description
        type: string
        source: input
        description: Homeowner's description of the failure.
        constraints: 1..500 chars, non-blank
      - name: reported_at
        type: datetime
        source: system
        description: Logical-clock instant at which the claim was filed; compared with Enrollment.coverage_effective_at.
      - name: status
        type: enum
        source: system
        description: Claim lifecycle including the denial/appeal cycle.
        default: TRIAGE
        constraints: "one of {TRIAGE, APPROVED, DISPATCHED, WORK_COMPLETE, PAID, DENIED, APPEAL_OPEN, APPEAL_UPHELD_DENIAL, CLOSED}"
      - name: eligibility_assessment
        type: enum
        source: computed
        description: System coverage verdict computed at claim creation from the enrollment, premises and product; constrains which denial_reason an adjuster may record.
        constraints: "one of {ELIGIBLE, COVERAGE_INACTIVE, OWNERSHIP_INELIGIBLE, PRE_EXISTING, WAITING_PERIOD, CAP_EXHAUSTED}"
      - name: denial_reason
        type: enum
        source: system
        description: Reason recorded on the most recent denial; null while the claim has never been denied.
        default: null
        constraints: "one of {COVERAGE_INACTIVE, OWNERSHIP_INELIGIBLE, PRE_EXISTING, WAITING_PERIOD, CAP_EXHAUSTED, NOT_COVERED_SEGMENT}"
      - name: triage_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAdjuster who recorded the most recent triage decision; compared against the appeal decider for segregation of duties.
        default: null
      - name: triage_decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent triage decision.
        default: null
      - name: denied_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent transition into DENIED; starts the appeal window.
        default: null
      - name: appeal_opened_at
        type: datetime
        source: system
        description: Logical-clock instant at which the current appeal was opened.
        default: null
      - name: appeal_source
        type: enum
        source: system
        description: Who opened the current appeal.
        default: null
        constraints: "one of {POLICYHOLDER, REGULATOR}"
      - name: appeal_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the AppealsOfficer who decided the most recent appeal.
        default: null
      - name: appeal_count
        type: integer
        source: system
        description: Number of appeals opened on this claim; capped by MAX_CLAIM_APPEALS.
        default: 0
      - name: sla_deadline_at
        type: datetime
        source: computed
        description: Response deadline stamped when the claim's FIRST dispatch is assigned; inherited unchanged by every superseding dispatch. Null until first dispatch.
      - name: benefit_paid_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents where claim_id == this claim and ledger_kind == BENEFIT (BENEFIT_REVERSAL rows are negative, so reversals reduce it)."
      - name: occurrence_used_cents
        type: integer
        source: computed
        description: "Sum of LedgerEntry.amount_cents where ledger_kind == BENEFIT over every claim sharing this claim's occurrence_root_claim_id; the quantity the per-occurrence cap is measured against."

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Network contractor's business name.
        constraints: 1..120 chars, non-blank
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code the contractor is licensed in; must equal the claim's premises state_code to be eligible.
        constraints: exactly 2 uppercase A-Z characters
      - name: license_number
        type: string
        source: input
        description: State trade licence number.
        constraints: 1..40 chars, non-blank
      - name: license_expires_on
        type: string
        source: input
        description: Licence expiry date; a contractor whose licence expires on or before the logical clock's date is not dispatchable.
        constraints: calendar date YYYY-MM-DD
      - name: line_types_certified
        type: array
        source: input
        description: Service lines this contractor may work on.
        constraints: "non-empty array of distinct values from {WATER_SERVICE_LINE, SEWER_LATERAL, INTERIOR_PLUMBING, EXTERIOR_ELECTRIC}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Labour rate used by the provisional estimate and by the rate component of the selection score.
        constraints: 1000..40000
      - name: sla_compliance_pct
        type: integer
        source: input
        description: Historical on-time response percentage; heaviest weight in the selection score.
        constraints: 0..100
      - name: max_open_dispatches
        type: integer
        source: input
        description: Capacity ceiling; a contractor at this many open dispatches is ineligible.
        constraints: 1..50
      - name: permit_pull_authorized
        type: boolean
        source: input
        description: Whether the contractor may pull municipal permits; required when the claim's product has permit_covered == true.
      - name: status
        type: enum
        source: system
        description: Network standing; only ACTIVE contractors are dispatchable.
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION, SUSPENDED}"
      - name: sla_breach_count
        type: integer
        source: system
        description: Running count of SLA-breached dispatches; at SLA_BREACH_PROBATION_THRESHOLD the contractor is placed on PROBATION.
        default: 0
      - name: open_dispatch_count
        type: integer
        source: computed
        description: "Count of Dispatch rows with contractor_id == this contractor and status IN {ASSIGNED, ACCEPTED, ON_SITE}; the conserved capacity quantity."

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the approved claim being worked.
      - name: contractor_id
        type: string
        source: input
        description: FK -> Contractor.id; explicitly supplied for a MANUAL dispatch, otherwise chosen by the selector in calculations.contractor_selection_score.
      - name: supersedes_dispatch_id
        type: string
        source: input
        description: FK -> Dispatch.id; the dispatch this one replaces. Null for the first dispatch of a claim.
        default: null
      - name: assigned_at
        type: datetime
        source: system
        description: Logical-clock instant at which the dispatch was created.
      - name: window_start
        type: datetime
        source: input
        description: Start of the promised appointment window.
        constraints: ISO 8601 UTC instant with exactly three fractional-second digits
      - name: window_end
        type: datetime
        source: computed
        description: "window_start plus VISIT_MINUTES_BY_LINE[claim.line_type] minutes; the window is the half-open interval [window_start, window_end)."
      - name: sla_deadline_at
        type: datetime
        source: computed
        description: Copied from Claim.sla_deadline_at, which is stamped once from the claim's first dispatch and never reset by a supersede.
      - name: selection_mode
        type: enum
        source: system
        description: MANUAL when the request named contractor_id, AUTOMATIC when the selector chose it.
        constraints: "one of {MANUAL, AUTOMATIC}"
      - name: selection_score
        type: number
        source: system
        description: Score of the assigned contractor, rounded HALF_UP to 2 decimals. Populated for AUTOMATIC selections and also for MANUAL ones, where it records the score the named contractor would have received.
        default: null
      - name: estimated_benefit_cents
        type: integer
        source: computed
        description: Provisional variant of the benefit settlement, computed at assignment from the contractor's rate and the line-type estimate constants; held as a reservation against the annual pool.
      - name: status
        type: enum
        source: system
        description: Dispatch lifecycle.
        default: ASSIGNED
        constraints: "one of {ASSIGNED, ACCEPTED, ON_SITE, COMPLETED, CANCELLED, SLA_BREACHED, SUPERSEDED}"
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant at which the contractor accepted; null until then.
        default: null
      - name: response_minutes
        type: integer
        source: computed
        description: Whole minutes between assigned_at and responded_at; null until accepted.
      - name: labor_cents
        type: integer
        source: system
        description: Labour line of the completion invoice; null until COMPLETED.
        default: null
      - name: materials_cents
        type: integer
        source: system
        description: Materials line of the completion invoice; null until COMPLETED.
        default: null
      - name: permit_number
        type: string
        source: system
        description: Municipal permit number recorded at completion; null when no permit was pulled.
        default: null
      - name: permit_fee_cents
        type: integer
        source: system
        description: Permit fee line of the completion invoice; null until COMPLETED.
        default: null
      - name: restoration_cents
        type: integer
        source: system
        description: Restoration line of the completion invoice; null until COMPLETED.
        default: null
      - name: restoration_scope
        type: enum
        source: system
        description: Scope of restoration actually performed; must not exceed the product's restoration_covered_scope.
        default: null
        constraints: "one of {NONE, BASIC_BACKFILL, FULL_HARDSCAPE}"
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "labor_cents + materials_cents + permit_fee_cents + restoration_cents; null until COMPLETED."
      - name: benefit_paid_cents
        type: integer
        source: computed
        description: Final-settlement benefit allocated by the waterfall at completion; null until COMPLETED.
      - name: customer_responsibility_cents
        type: integer
        source: computed
        description: "invoice_total_cents - benefit_paid_cents; null until COMPLETED."
      - name: cancellation_reason
        type: enum
        source: system
        description: Why the dispatch left the open set without completing.
        default: null
        constraints: "one of {CONTRACTOR_PROBATION, SUPERSEDED_BY_REDISPATCH, CLAIM_DENIED}"

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the policy whose balances this row moves.
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the claim that consumed or released benefit. Null on every CASH-kind row.
        default: null
      - name: ledger_kind
        type: enum
        source: system
        description: BENEFIT rows move the benefit caps; CASH rows move collected/refunded premium. The two kinds are independently conserved.
        constraints: "one of {BENEFIT, CASH}"
      - name: entry_type
        type: enum
        source: input
        description: Business reason for the movement; determines ledger_kind and the sign convention.
        constraints: "one of {BENEFIT_CHARGE, BENEFIT_REVERSAL, PREMIUM_PAYMENT, INSERT_REMITTANCE, PRORATION_REFUND, PRORATION_CREDIT, WRITE_OFF, REFUND_CLAWBACK, CANCELLATION_FEE}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed movement in cents. Positive for BENEFIT_CHARGE, PREMIUM_PAYMENT, INSERT_REMITTANCE, CANCELLATION_FEE, REFUND_CLAWBACK; negative for BENEFIT_REVERSAL, PRORATION_REFUND, PRORATION_CREDIT, WRITE_OFF."
      - name: effective_date
        type: string
        source: input
        description: Calendar date the movement is booked on; decides which cap year a BENEFIT row falls in.
        constraints: calendar date YYYY-MM-DD
      - name: cap_year_start
        type: string
        source: system
        description: Copy of the enrollment's cap_year_start at booking time; null on CASH rows. Frozen so a later cap-year reset cannot retroactively move the row.
        default: null
        constraints: calendar date YYYY-MM-DD
      - name: memo
        type: string
        source: input
        description: Free-text audit note.
        default: null

  - name: RegulatorComplaint
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: FK -> UtilityPartner.id; the partner whose regulator received the complaint.
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the disputed claim. Null when the complaint is not about a specific claim.
        default: null
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the policy complained about. Null when the complaint names no policy.
        default: null
      - name: regulator
        type: enum
        source: input
        description: Body that forwarded the complaint; sets the base response window.
        constraints: "one of {PUC, AG, BBB}"
      - name: allegation
        type: string
        source: input
        description: Substance of the complaint as forwarded by the regulator.
        constraints: 1..1000 chars, non-blank
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant at intake; start of the response window.
      - name: response_due_at
        type: datetime
        source: computed
        description: Deadline computed by calculations.regulator_response_due_at from the regulator's base days and the disputed claim's status.
      - name: status
        type: enum
        source: system
        description: Complaint lifecycle including the close/escalate/re-respond cycle.
        default: OPEN
        constraints: "one of {OPEN, OVERDUE, ESCALATED, CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED}"
      - name: days_overdue
        type: integer
        source: computed
        description: Whole days between response_due_at and the logical clock, floored at 0; 0 once responded.
      - name: response_summary
        type: string
        source: system
        description: Narrative filed with the regulator on the most recent response; null before the first response.
        default: null
      - name: disposition
        type: enum
        source: system
        description: Finding recorded with the most recent response.
        default: null
        constraints: "one of {SUBSTANTIATED, UNSUBSTANTIATED}"
      - name: remedy_type
        type: enum
        source: system
        description: Remedy granted with the most recent response; drives the compensating ledger and reinstatement side effects.
        default: null
        constraints: "one of {NONE, BENEFIT_REVERSAL, PREMIUM_REFUND, REINSTATEMENT, APOLOGY_ONLY}"
      - name: remedy_amount_cents
        type: integer
        source: system
        description: Magnitude of a BENEFIT_REVERSAL or PREMIUM_REFUND remedy in cents; null for other remedy types.
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent response.
        default: null
      - name: escalation_count
        type: integer
        source: system
        description: Number of times the regulator has escalated this complaint after a response.
        default: 0

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: UtilityPartner
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /partners/{partnerId}/status-changes with target_status=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "UtilityPartner.status == ONBOARDING"
          - "expected_partner_version == UtilityPartner.version"
          - "at least one ServiceLineProduct exists with partner_id == UtilityPartner.id and status == AVAILABLE"
        side_effects:
          - "sets UtilityPartner.suspension_reason = null"
          - "increments UtilityPartner.version by 1"
        note: "A partner with no filed product may not be activated (ERR_NO_FILED_PRODUCT)."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /partners/{partnerId}/status-changes with target_status=SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "UtilityPartner.status == ACTIVE"
          - "expected_partner_version == UtilityPartner.version"
        side_effects:
          - "sets UtilityPartner.suspension_reason = request.reason"
          - "CASCADE hop 1: every MarketingCampaign with partner_id == this partner and status IN {DRAFT, PARTNER_REVIEW, APPROVED} transitions to WITHDRAWN (processed in created_at ASC order); each such campaign's version increments by 1"
          - "increments UtilityPartner.version by 1"
        note: "In-force coverage is deliberately untouched — suspension stops marketing and new enrollments only."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /partners/{partnerId}/status-changes with target_status=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "UtilityPartner.status == SUSPENDED"
          - "expected_partner_version == UtilityPartner.version"
        side_effects:
          - "sets UtilityPartner.suspension_reason = null"
          - "increments UtilityPartner.version by 1"
        note: "Reinstatement is a cycle (ACTIVE -> SUSPENDED -> ACTIVE). Campaigns withdrawn by the suspension are NOT revived."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /partners/{partnerId}/status-changes with target_status=TERMINATED"
        actor: PlatformAdmin
        preconditions:
          - "UtilityPartner.status IN {ACTIVE, SUSPENDED}"
          - "expected_partner_version == UtilityPartner.version"
        side_effects:
          - "sets UtilityPartner.suspension_reason = request.reason"
          - "every ServiceLineProduct with partner_id == this partner transitions to WITHDRAWN (created_at ASC)"
          - "every MarketingCampaign with partner_id == this partner and status IN {DRAFT, PARTNER_REVIEW, APPROVED} transitions to WITHDRAWN (created_at ASC)"
          - "increments UtilityPartner.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /partners/{partnerId}/status-changes with target_status=TERMINATED"
        actor: PlatformAdmin
        preconditions:
          - "UtilityPartner.status IN {ACTIVE, SUSPENDED}"
          - "expected_partner_version == UtilityPartner.version"
        side_effects:
          - "same side effects as ACTIVE -> TERMINATED"
          - "increments UtilityPartner.version by 1"

  - entity: MarketingCampaign
    initial_state: DRAFT
    terminal_states: [MAILED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PARTNER_REVIEW
        trigger: "POST /campaigns/{campaignId}/submission"
        actor: MarketingOps
        preconditions:
          - "MarketingCampaign.status == DRAFT"
          - "UtilityPartner.status == ACTIVE for the campaign's partner_id"
          - "no drop-window conflict per calculations.campaign_drop_window_conflict"
        side_effects:
          - "sets MarketingCampaign.submitted_by_user_id = X-User-ID"
          - "increments MarketingCampaign.version by 1"
      - from: PARTNER_REVIEW
        to: APPROVED
        trigger: "POST /campaigns/{campaignId}/decision with decision=APPROVE"
        actor: PartnerBrandReviewer
        preconditions:
          - "MarketingCampaign.status == PARTNER_REVIEW"
          - "X-User-ID == MarketingCampaign.partner_id"
          - "request.approved_quantity, when supplied, is <= MarketingCampaign.requested_quantity"
        side_effects:
          - "sets MarketingCampaign.approved_quantity = request.approved_quantity when supplied, else requested_quantity"
          - "sets decision_by_user_id, decision_note, decided_at"
          - "increments MarketingCampaign.version by 1"
      - from: PARTNER_REVIEW
        to: REJECTED
        trigger: "POST /campaigns/{campaignId}/decision with decision=REJECT"
        actor: PartnerBrandReviewer
        preconditions:
          - "MarketingCampaign.status == PARTNER_REVIEW"
          - "X-User-ID == MarketingCampaign.partner_id"
        side_effects:
          - "leaves MarketingCampaign.approved_quantity unchanged (null on a first-pass rejection)"
          - "sets decision_by_user_id, decision_note, decided_at"
          - "increments MarketingCampaign.version by 1"
      - from: REJECTED
        to: PARTNER_REVIEW
        trigger: "POST /campaigns/{campaignId}/submission (resubmission after rejection)"
        actor: MarketingOps
        preconditions:
          - "MarketingCampaign.status == REJECTED"
          - "MarketingCampaign.revision_count < MAX_CAMPAIGN_REVISIONS"
          - "UtilityPartner.status == ACTIVE for the campaign's partner_id"
          - "no drop-window conflict per calculations.campaign_drop_window_conflict"
        side_effects:
          - "increments MarketingCampaign.revision_count by 1"
          - "sets MarketingCampaign.submitted_by_user_id = X-User-ID"
          - "increments MarketingCampaign.version by 1"
        note: "The revision cycle terminates at MAX_CAMPAIGN_REVISIONS resubmissions (ERR_REVISION_LIMIT_REACHED)."
      - from: APPROVED
        to: MAILED
        trigger: "POST /campaigns/{campaignId}/mail-drop"
        actor: MarketingOps
        preconditions:
          - "MarketingCampaign.status == APPROVED"
          - "MarketingCampaign.approved_quantity != null"
          - "UtilityPartner.status == ACTIVE for the campaign's partner_id"
          - "MarketingCampaign.drop_date <= the logical clock's calendar date"
        side_effects:
          - "runs calculations.mail_drop_suppression_allocation over every Premises with partner_id == campaign.partner_id in created_at ASC order"
          - "for each MAILED premises: sets Premises.last_mailed_campaign_id = campaign.id, Premises.last_mail_decision = MAILED, Premises.last_mail_suppression_reason = null, recomputes Premises.mail_count_current_year, increments that Premises.version by 1"
          - "for each SUPPRESSED premises: sets Premises.last_mail_decision = SUPPRESSED and Premises.last_mail_suppression_reason to the winning reason, increments that Premises.version by 1"
          - "sets MarketingCampaign.mailed_count, suppressed_count and mail_dropped_at"
          - "increments MarketingCampaign.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: cascade hop 1 of UtilityPartner ACTIVE -> SUSPENDED or -> TERMINATED"
        actor: system
        preconditions:
          - "MarketingCampaign.status IN {DRAFT, PARTNER_REVIEW, APPROVED}"
        side_effects:
          - "increments MarketingCampaign.version by 1"
      - from: PARTNER_REVIEW
        to: WITHDRAWN
        trigger: "system: cascade hop 1 of UtilityPartner ACTIVE -> SUSPENDED or -> TERMINATED"
        actor: system
        preconditions:
          - "MarketingCampaign.status IN {DRAFT, PARTNER_REVIEW, APPROVED}"
        side_effects:
          - "increments MarketingCampaign.version by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "system: cascade hop 1 of UtilityPartner ACTIVE -> SUSPENDED or -> TERMINATED"
        actor: system
        preconditions:
          - "MarketingCampaign.status IN {DRAFT, PARTNER_REVIEW, APPROVED}"
        side_effects:
          - "increments MarketingCampaign.version by 1"
          - "leaves approved_quantity intact for audit"

  - entity: Enrollment
    initial_state: PENDING_WAITING_PERIOD
    terminal_states: [LAPSED]
    shape: parallel
    parallel_dimensions:
      coverage: "coverage_status: PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY, CANCELLED, LAPSED"
      billing: "billing_status: CURRENT, PAST_DUE, WRITTEN_OFF, REFUND_ISSUED, CREDIT_ISSUED"
      cap: "cap_status: WITHIN_CAP, ANNUAL_CAP_EXHAUSTED"
    note: "The three dimensions advance independently on the same row; only the pairs named in preconditions couple them."
    transitions:
      - from: PENDING_WAITING_PERIOD
        to: ACTIVE
        dimension: coverage
        trigger: "POST /operations/nightly-run phase 4"
        actor: system
        preconditions:
          - "Enrollment.coverage_status == PENDING_WAITING_PERIOD"
          - "logical clock >= Enrollment.coverage_effective_at"
        side_effects:
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: SUSPENDED_NONPAY
        dimension: coverage
        trigger: "POST /operations/nightly-run phase 4"
        actor: system
        preconditions:
          - "Enrollment.coverage_status == ACTIVE"
          - "Enrollment.billing_status == PAST_DUE"
          - "Enrollment.past_due_since + NONPAY_SUSPENSION_DAYS <= the logical clock's calendar date"
        side_effects:
          - "increments Enrollment.version by 1"
        note: "Cross-dimension coupling: the coverage dimension reads the billing dimension."
      - from: SUSPENDED_NONPAY
        to: ACTIVE
        dimension: coverage
        trigger: "POST /enrollments/{enrollmentId}/billing-events with event_type IN {PREMIUM_PAYMENT, INSERT_REMITTANCE} that clears the arrears"
        actor: BillingOps
        preconditions:
          - "Enrollment.coverage_status == SUSPENDED_NONPAY"
          - "the payment brings Enrollment.billing_status back to CURRENT (request.amount_cents >= Enrollment.monthly_price_cents)"
        side_effects:
          - "sets Enrollment.past_due_since = null"
          - "increments Enrollment.version by 1"
        note: "Reinstatement cycle ACTIVE -> SUSPENDED_NONPAY -> ACTIVE."
      - from: SUSPENDED_NONPAY
        to: LAPSED
        dimension: coverage
        trigger: "POST /operations/nightly-run phase 4"
        actor: system
        preconditions:
          - "Enrollment.coverage_status == SUSPENDED_NONPAY"
          - "Enrollment.past_due_since + NONPAY_LAPSE_DAYS <= the logical clock's calendar date"
        side_effects:
          - "sets Enrollment.retention_hold = false"
          - "increments Enrollment.version by 1"
      - from: PENDING_WAITING_PERIOD
        to: CANCELLED
        dimension: coverage
        trigger: "POST /enrollments/{enrollmentId}/cancellation"
        actor: CustomerServiceRep
        preconditions:
          - "Enrollment.coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY}"
          - "Enrollment.retention_hold == false"
          - "request.requested_effective_date >= Enrollment.term_start and <= Enrollment.term_end"
        side_effects:
          - "runs calculations.cancellation_refund_proration and stores refund_cents, credit_cents, cancellation_fee_cents, cancellation_effective_date, cancellation_reason"
          - "appends one LedgerEntry (ledger_kind CASH) per non-zero money movement: PRORATION_REFUND (negative) or PRORATION_CREDIT (negative), plus CANCELLATION_FEE (positive) when the fee is non-zero"
          - "moves the billing dimension to REFUND_ISSUED (DIRECT_BILL) or CREDIT_ISSUED (BILL_INSERT)"
          - "cancels every Dispatch of this enrollment's claims whose status IN {ASSIGNED, ACCEPTED, ON_SITE} with cancellation_reason CLAIM_DENIED and recomputes each affected Contractor.open_dispatch_count"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: CANCELLED
        dimension: coverage
        trigger: "POST /enrollments/{enrollmentId}/cancellation"
        actor: CustomerServiceRep
        preconditions:
          - "Enrollment.coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY}"
          - "Enrollment.retention_hold == false"
          - "request.requested_effective_date >= Enrollment.term_start and <= Enrollment.term_end"
        side_effects:
          - "identical to PENDING_WAITING_PERIOD -> CANCELLED"
          - "increments Enrollment.version by 1"
      - from: SUSPENDED_NONPAY
        to: CANCELLED
        dimension: coverage
        trigger: "POST /enrollments/{enrollmentId}/cancellation"
        actor: CustomerServiceRep
        preconditions:
          - "Enrollment.coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY}"
          - "Enrollment.retention_hold == false"
        side_effects:
          - "identical to PENDING_WAITING_PERIOD -> CANCELLED"
          - "increments Enrollment.version by 1"
      - from: CANCELLED
        to: ACTIVE
        dimension: coverage
        trigger: "POST /regulator-complaints/{complaintId}/response with remedy_type=REINSTATEMENT"
        actor: RegulatoryAffairs
        preconditions:
          - "Enrollment.coverage_status == CANCELLED"
          - "the complaint's enrollment_id names this enrollment"
        side_effects:
          - "appends one LedgerEntry (CASH, REFUND_CLAWBACK, amount_cents = +abs(Enrollment.refund_cents or Enrollment.credit_cents)) reversing the cancellation payout"
          - "clears cancellation_effective_date, cancellation_reason, refund_cents, credit_cents and cancellation_fee_cents back to null"
          - "moves the billing dimension back to CURRENT"
          - "restores Enrollment.term_end to the value it held before cancellation (12 calendar months after term_start plus 12 months per renewal_count)"
          - "increments Enrollment.version by 1"
        note: "Compensating action for the cancellation payout; the net-cash invariant must return to its pre-cancellation value."
      - from: CURRENT
        to: PAST_DUE
        dimension: billing
        trigger: "POST /enrollments/{enrollmentId}/billing-events with event_type=MISSED_PAYMENT"
        actor: BillingOps
        preconditions:
          - "Enrollment.billing_status == CURRENT"
          - "Enrollment.coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE}"
        side_effects:
          - "sets Enrollment.past_due_since = request.effective_date"
          - "increments Enrollment.version by 1"
        note: "No LedgerEntry is written — a missed payment moves no money."
      - from: PAST_DUE
        to: CURRENT
        dimension: billing
        trigger: "POST /enrollments/{enrollmentId}/billing-events with event_type IN {PREMIUM_PAYMENT, INSERT_REMITTANCE} and amount_cents >= Enrollment.monthly_price_cents"
        actor: BillingOps
        preconditions:
          - "Enrollment.billing_status == PAST_DUE"
        side_effects:
          - "appends one LedgerEntry (CASH, PREMIUM_PAYMENT or INSERT_REMITTANCE, positive amount_cents)"
          - "sets Enrollment.past_due_since = null"
          - "increments Enrollment.version by 1"
      - from: PAST_DUE
        to: WRITTEN_OFF
        dimension: billing
        trigger: "POST /enrollments/{enrollmentId}/billing-events with event_type=WRITE_OFF"
        actor: BillingOps
        preconditions:
          - "Enrollment.billing_status == PAST_DUE"
        side_effects:
          - "appends one LedgerEntry (CASH, WRITE_OFF, negative amount_cents)"
          - "increments Enrollment.version by 1"
      - from: CURRENT
        to: REFUND_ISSUED
        dimension: billing
        trigger: "POST /enrollments/{enrollmentId}/cancellation on a DIRECT_BILL enrollment"
        actor: CustomerServiceRep
        preconditions:
          - "Enrollment.billing_mode == DIRECT_BILL"
        side_effects:
          - "see the coverage -> CANCELLED side effects"
      - from: CURRENT
        to: CREDIT_ISSUED
        dimension: billing
        trigger: "POST /enrollments/{enrollmentId}/cancellation on a BILL_INSERT enrollment"
        actor: CustomerServiceRep
        preconditions:
          - "Enrollment.billing_mode == BILL_INSERT"
        side_effects:
          - "see the coverage -> CANCELLED side effects"
      - from: REFUND_ISSUED
        to: CURRENT
        dimension: billing
        trigger: "POST /regulator-complaints/{complaintId}/response with remedy_type=REINSTATEMENT"
        actor: RegulatoryAffairs
        preconditions:
          - "Enrollment.billing_status IN {REFUND_ISSUED, CREDIT_ISSUED}"
        side_effects:
          - "see the CANCELLED -> ACTIVE side effects"
      - from: WITHIN_CAP
        to: ANNUAL_CAP_EXHAUSTED
        dimension: cap
        trigger: "system: cascade hop 3 of Dispatch ACCEPTED/ON_SITE -> COMPLETED"
        actor: system
        preconditions:
          - "Enrollment.annual_benefit_used_cents >= ServiceLineProduct.annual_cap_cents after the BENEFIT_CHARGE row posts"
        side_effects:
          - "CASCADE hop 4: every other Claim of this enrollment with status == TRIAGE transitions to DENIED with denial_reason CAP_EXHAUSTED (created_at ASC order), each incrementing its own version"
          - "increments Enrollment.version by 1"
      - from: ANNUAL_CAP_EXHAUSTED
        to: WITHIN_CAP
        dimension: cap
        trigger: "POST /operations/nightly-run phase 6 (cap-year reset on renewal) or POST /regulator-complaints/{complaintId}/response with remedy_type=BENEFIT_REVERSAL"
        actor: system
        preconditions:
          - "after the reset or reversal, Enrollment.annual_benefit_used_cents < ServiceLineProduct.annual_cap_cents"
        side_effects:
          - "increments Enrollment.version by 1"
        note: "Cap dimension is cyclic: exhaustion is undone either by a new cap year or by a compensating BENEFIT_REVERSAL."

  - entity: Claim
    initial_state: TRIAGE
    terminal_states: [PAID, APPEAL_UPHELD_DENIAL, CLOSED]
    shape: cyclic
    transitions:
      - from: TRIAGE
        to: APPROVED
        trigger: "POST /claims/{claimId}/triage-decision with decision=APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == TRIAGE"
          - "Enrollment.coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE} for Claim.enrollment_id"
          - "Enrollment.cap_status == WITHIN_CAP"
          - "Claim.eligibility_assessment == ELIGIBLE"
        side_effects:
          - "sets Claim.triage_decided_by_user_id = X-User-ID and Claim.triage_decided_at = the logical clock"
          - "increments Claim.version by 1"
      - from: TRIAGE
        to: DENIED
        trigger: "POST /claims/{claimId}/triage-decision with decision=DENY"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == TRIAGE"
          - "request.denial_reason is supplied and matches Claim.eligibility_assessment when eligibility_assessment != ELIGIBLE"
        side_effects:
          - "sets Claim.denial_reason = request.denial_reason and Claim.denied_at = the logical clock"
          - "sets Claim.triage_decided_by_user_id = X-User-ID and Claim.triage_decided_at = the logical clock"
          - "increments Claim.version by 1"
        note: "denied_at anchors the APPEAL_WINDOW_DAYS clock; a REMAND re-denial refreshes it."
      - from: APPROVED
        to: DISPATCHED
        trigger: "POST /claims/{claimId}/dispatches"
        actor: OperationsAdmin
        preconditions:
          - "Claim.status == APPROVED"
          - "expected_claim_version == Claim.version"
          - "a Contractor satisfies calculations.contractor_selection_score's eligibility filter"
        side_effects:
          - "creates one Dispatch in ASSIGNED"
          - "sets Claim.sla_deadline_at from calculations.dispatch_response_sla when it is still null; leaves it unchanged on any later re-dispatch"
          - "increments Contractor.open_dispatch_count for the selected contractor"
          - "increases Enrollment.annual_benefit_reserved_cents by Dispatch.estimated_benefit_cents"
          - "increments Claim.version by 1"
      - from: DISPATCHED
        to: APPROVED
        trigger: "system: cascade hop 4 of Dispatch ASSIGNED -> SLA_BREACHED (contractor probation)"
        actor: system
        preconditions:
          - "Claim.status == DISPATCHED"
          - "the claim has no Dispatch left in status IN {ASSIGNED, ACCEPTED, ON_SITE}"
        side_effects:
          - "decreases Enrollment.annual_benefit_reserved_cents by the cancelled Dispatch.estimated_benefit_cents"
          - "increments Claim.version by 1"
        note: "Revert edge: a claim whose contractor was put on probation returns to the dispatchable state."
      - from: DISPATCHED
        to: DISPATCHED
        trigger: "POST /claims/{claimId}/dispatches with supersedes_dispatch_id naming an open dispatch of this claim"
        actor: OperationsAdmin
        preconditions:
          - "Claim.status == DISPATCHED"
          - "expected_claim_version == Claim.version"
          - "supersedes_dispatch_id names a Dispatch of this claim whose status IN {ASSIGNED, ACCEPTED, SLA_BREACHED}"
        side_effects:
          - "creates the replacement Dispatch in ASSIGNED and transitions the superseded one to SUPERSEDED"
          - "moves the reservation and the open-dispatch slot from the old contractor to the new one"
          - "leaves Claim.sla_deadline_at untouched"
          - "increments Claim.version by 1"
        note: "Self-loop: re-dispatching keeps the claim in DISPATCHED. A dispatch request without supersedes_dispatch_id is still refused from DISPATCHED."
      - from: DISPATCHED
        to: WORK_COMPLETE
        trigger: "system: cascade hop 2 of Dispatch ACCEPTED/ON_SITE -> COMPLETED"
        actor: system
        preconditions:
          - "Claim.status == DISPATCHED"
        side_effects:
          - "appends one LedgerEntry (ledger_kind BENEFIT, entry_type BENEFIT_CHARGE, amount_cents = +Dispatch.benefit_paid_cents, cap_year_start = Enrollment.cap_year_start)"
          - "recomputes Enrollment.annual_benefit_used_cents and releases the reservation"
          - "sets Claim.benefit_paid_cents and Claim.occurrence_used_cents"
          - "increments Claim.version by 1"
      - from: WORK_COMPLETE
        to: PAID
        trigger: "system: cascade hop 3 of Dispatch ACCEPTED/ON_SITE -> COMPLETED, in the same request, after the BENEFIT_CHARGE row posts"
        actor: system
        preconditions:
          - "Claim.status == WORK_COMPLETE"
          - "the BENEFIT_CHARGE LedgerEntry for this claim exists"
        side_effects:
          - "increments Claim.version by 1"
        note: "WORK_COMPLETE is transient within one request: a completing dispatch always leaves the claim in PAID."
      - from: TRIAGE
        to: DENIED
        trigger: "system: cascade hop 4 of Enrollment WITHIN_CAP -> ANNUAL_CAP_EXHAUSTED"
        actor: system
        preconditions:
          - "Claim.status == TRIAGE"
          - "Enrollment.cap_status == ANNUAL_CAP_EXHAUSTED"
        side_effects:
          - "sets Claim.denial_reason = CAP_EXHAUSTED and Claim.denied_at = the logical clock"
          - "leaves Claim.triage_decided_by_user_id null (no human decided it)"
          - "increments Claim.version by 1"
      - from: DENIED
        to: APPEAL_OPEN
        trigger: "POST /claims/{claimId}/appeals"
        actor: Policyholder
        preconditions:
          - "Claim.status == DENIED"
          - "Claim.appeal_count < MAX_CLAIM_APPEALS"
          - "the logical clock <= Claim.denied_at + APPEAL_WINDOW_DAYS"
          - "X-User-ID == Premises.id reached through Claim.enrollment_id -> Enrollment.premises_id"
        side_effects:
          - "sets Claim.appeal_opened_at, Claim.appeal_source = POLICYHOLDER, increments Claim.appeal_count by 1"
          - "CASCADE hop 2: sets Enrollment.retention_hold = true and increments that Enrollment.version by 1"
          - "CASCADE hop 3: recomputes Premises.suppression_reason and Premises.suppressed for the enrollment's premises and increments that Premises.version by 1"
          - "increments Claim.version by 1"
      - from: DENIED
        to: APPEAL_OPEN
        trigger: "system: cascade hop 1 of POST /regulator-complaints when claim_id names a claim in status IN {DENIED, APPEAL_UPHELD_DENIAL}"
        actor: system
        preconditions:
          - "Claim.status IN {DENIED, APPEAL_UPHELD_DENIAL}"
        side_effects:
          - "sets Claim.appeal_source = REGULATOR, sets Claim.appeal_opened_at, increments Claim.appeal_count by 1"
          - "CASCADE hop 2: sets Enrollment.retention_hold = true"
          - "CASCADE hop 3: recomputes Premises.suppression_reason and Premises.suppressed"
          - "increments Claim.version by 1"
        note: "A regulator complaint reopens an appeal even past APPEAL_WINDOW_DAYS and even from the otherwise terminal APPEAL_UPHELD_DENIAL."
      - from: APPEAL_UPHELD_DENIAL
        to: APPEAL_OPEN
        trigger: "system: cascade hop 1 of POST /regulator-complaints when claim_id names a claim in status IN {DENIED, APPEAL_UPHELD_DENIAL}"
        actor: system
        preconditions:
          - "Claim.status IN {DENIED, APPEAL_UPHELD_DENIAL}"
        side_effects:
          - "same as DENIED -> APPEAL_OPEN by regulator complaint"
          - "increments Claim.version by 1"
      - from: APPEAL_OPEN
        to: APPROVED
        trigger: "POST /claims/{claimId}/appeal-decision with decision=OVERTURN"
        actor: AppealsOfficer
        preconditions:
          - "Claim.status == APPEAL_OPEN"
          - "X-User-ID != Claim.triage_decided_by_user_id (segregation of duties)"
        side_effects:
          - "sets Claim.appeal_decided_by_user_id = X-User-ID, clears Claim.denial_reason and Claim.denied_at"
          - "recomputes Enrollment.retention_hold (false when this enrollment has no other claim in APPEAL_OPEN)"
          - "recomputes Premises.suppression_reason and Premises.suppressed"
          - "increments Claim.version by 1"
      - from: APPEAL_OPEN
        to: DENIED
        trigger: "POST /claims/{claimId}/appeal-decision with decision=REMAND"
        actor: AppealsOfficer
        preconditions:
          - "Claim.status == APPEAL_OPEN"
          - "X-User-ID != Claim.triage_decided_by_user_id (segregation of duties)"
        side_effects:
          - "sets Claim.appeal_decided_by_user_id = X-User-ID and refreshes Claim.denied_at to the logical clock, restarting the appeal window"
          - "recomputes Enrollment.retention_hold and the premises suppression"
          - "increments Claim.version by 1"
        note: "Cycle DENIED -> APPEAL_OPEN -> DENIED, bounded by MAX_CLAIM_APPEALS."
      - from: APPEAL_OPEN
        to: APPEAL_UPHELD_DENIAL
        trigger: "POST /claims/{claimId}/appeal-decision with decision=UPHOLD"
        actor: AppealsOfficer
        preconditions:
          - "Claim.status == APPEAL_OPEN"
          - "X-User-ID != Claim.triage_decided_by_user_id (segregation of duties)"
        side_effects:
          - "sets Claim.appeal_decided_by_user_id = X-User-ID"
          - "recomputes Enrollment.retention_hold and the premises suppression"
          - "increments Claim.version by 1"
      - from: DENIED
        to: CLOSED
        trigger: "POST /operations/nightly-run phase 5"
        actor: system
        preconditions:
          - "Claim.status == DENIED"
          - "Claim.denied_at + APPEAL_WINDOW_DAYS < the logical clock"
        side_effects:
          - "increments Claim.version by 1"
        note: "Terminal lockdown: once CLOSED, POST /claims/{claimId}/appeals returns ERR_INVALID_CLAIM_STATE."

  - entity: Dispatch
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED, SUPERSEDED]
    shape: branching
    transitions:
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /dispatches/{dispatchId}/events with event_type=ACCEPT"
        actor: NetworkContractor
        preconditions:
          - "Dispatch.status == ASSIGNED"
          - "X-User-ID == Dispatch.contractor_id"
        side_effects:
          - "sets Dispatch.responded_at = the logical clock and computes Dispatch.response_minutes"
          - "increments Dispatch.version by 1"
      - from: ACCEPTED
        to: ON_SITE
        trigger: "POST /dispatches/{dispatchId}/events with event_type=ARRIVE"
        actor: NetworkContractor
        preconditions:
          - "Dispatch.status == ACCEPTED"
          - "X-User-ID == Dispatch.contractor_id"
        side_effects:
          - "increments Dispatch.version by 1"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /dispatches/{dispatchId}/events with event_type=COMPLETE"
        actor: NetworkContractor
        preconditions:
          - "Dispatch.status IN {ACCEPTED, ON_SITE}"
          - "X-User-ID == Dispatch.contractor_id"
          - "request.permit_number is supplied when ServiceLineProduct.permit_covered == true and request.permit_fee_cents > 0"
          - "request.restoration_scope is not richer than ServiceLineProduct.restoration_covered_scope"
        side_effects:
          - "runs calculations.dispatch_benefit_settlement in its final_settlement variant and stores invoice_total_cents, benefit_paid_cents and customer_responsibility_cents"
          - "decrements Contractor.open_dispatch_count and releases the enrollment reservation"
          - "CASCADE hops 2-4: Claim DISPATCHED -> WORK_COMPLETE -> PAID, then Enrollment WITHIN_CAP -> ANNUAL_CAP_EXHAUSTED when the annual cap is reached, then every sibling Claim in TRIAGE -> DENIED(CAP_EXHAUSTED)"
          - "increments Dispatch.version by 1"
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /dispatches/{dispatchId}/events with event_type=COMPLETE"
        actor: NetworkContractor
        preconditions:
          - "Dispatch.status IN {ACCEPTED, ON_SITE}"
          - "X-User-ID == Dispatch.contractor_id"
        side_effects:
          - "identical to ACCEPTED -> COMPLETED"
          - "increments Dispatch.version by 1"
      - from: ASSIGNED
        to: SLA_BREACHED
        trigger: "POST /operations/nightly-run phase 1"
        actor: system
        preconditions:
          - "Dispatch.status == ASSIGNED"
          - "Dispatch.sla_deadline_at <= the logical clock"
        side_effects:
          - "CASCADE hop 2: increments Contractor.sla_breach_count by 1"
          - "CASCADE hop 3: when Contractor.sla_breach_count >= SLA_BREACH_PROBATION_THRESHOLD and Contractor.status == ACTIVE, that Contractor transitions to PROBATION"
          - "CASCADE hop 4: every other Dispatch of that contractor with status == ASSIGNED transitions to CANCELLED with cancellation_reason CONTRACTOR_PROBATION (created_at ASC), and each such Dispatch's Claim reverts DISPATCHED -> APPROVED"
          - "increments Dispatch.version by 1"
        note: "Breached dispatches are NOT cancelled — the obligation survives so the work can still be completed or superseded."
      - from: ASSIGNED
        to: SUPERSEDED
        trigger: "POST /claims/{claimId}/dispatches with supersedes_dispatch_id naming this dispatch"
        actor: OperationsAdmin
        preconditions:
          - "Dispatch.status IN {ASSIGNED, ACCEPTED, SLA_BREACHED}"
          - "the superseding request targets the same claim_id"
        side_effects:
          - "sets Dispatch.cancellation_reason = SUPERSEDED_BY_REDISPATCH"
          - "decrements the old Contractor.open_dispatch_count and releases its share of Enrollment.annual_benefit_reserved_cents"
          - "increments Dispatch.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "POST /claims/{claimId}/dispatches with supersedes_dispatch_id naming this dispatch"
        actor: OperationsAdmin
        preconditions:
          - "Dispatch.status IN {ASSIGNED, ACCEPTED, SLA_BREACHED}"
        side_effects:
          - "identical to ASSIGNED -> SUPERSEDED"
          - "increments Dispatch.version by 1"
      - from: SLA_BREACHED
        to: SUPERSEDED
        trigger: "POST /claims/{claimId}/dispatches with supersedes_dispatch_id naming this dispatch"
        actor: OperationsAdmin
        preconditions:
          - "Dispatch.status IN {ASSIGNED, ACCEPTED, SLA_BREACHED}"
        side_effects:
          - "identical to ASSIGNED -> SUPERSEDED"
          - "increments Dispatch.version by 1"
        note: "The superseding dispatch inherits Claim.sla_deadline_at — the clock is not restarted."
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system: cascade hop 4 of Dispatch ASSIGNED -> SLA_BREACHED (contractor probation), or the Enrollment cancellation side effect"
        actor: system
        preconditions:
          - "Dispatch.status IN {ASSIGNED, ACCEPTED, ON_SITE}"
        side_effects:
          - "sets Dispatch.cancellation_reason = CONTRACTOR_PROBATION or CLAIM_DENIED"
          - "decrements Contractor.open_dispatch_count and releases the reservation"
          - "increments Dispatch.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system: the Enrollment cancellation side effect"
        actor: system
        preconditions:
          - "Dispatch.status IN {ASSIGNED, ACCEPTED, ON_SITE}"
        side_effects:
          - "identical to ASSIGNED -> CANCELLED"
          - "increments Dispatch.version by 1"
      - from: ON_SITE
        to: CANCELLED
        trigger: "system: the Enrollment cancellation side effect"
        actor: system
        preconditions:
          - "Dispatch.status IN {ASSIGNED, ACCEPTED, ON_SITE}"
        side_effects:
          - "identical to ASSIGNED -> CANCELLED"
          - "increments Dispatch.version by 1"

  - entity: RegulatorComplaint
    initial_state: OPEN
    terminal_states: [CLOSED_SUBSTANTIATED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "POST /operations/nightly-run phase 3"
        actor: system
        preconditions:
          - "RegulatorComplaint.status == OPEN"
          - "RegulatorComplaint.response_due_at <= the logical clock"
        side_effects:
          - "recomputes RegulatorComplaint.days_overdue"
          - "increments RegulatorComplaint.version by 1"
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /operations/nightly-run phase 3"
        actor: system
        preconditions:
          - "RegulatorComplaint.status == OVERDUE"
          - "RegulatorComplaint.days_overdue >= ESCALATION_GRACE_DAYS"
        side_effects:
          - "increments RegulatorComplaint.escalation_count by 1"
          - "increments RegulatorComplaint.version by 1"
      - from: OPEN
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /regulator-complaints/{complaintId}/response with disposition=SUBSTANTIATED"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatorComplaint.status IN {OPEN, OVERDUE, ESCALATED}"
          - "expected_complaint_version == RegulatorComplaint.version"
          - "request.remedy_amount_cents is supplied when request.remedy_type IN {BENEFIT_REVERSAL, PREMIUM_REFUND}"
          - "RegulatorComplaint.enrollment_id != null when request.remedy_type IN {PREMIUM_REFUND, REINSTATEMENT}"
          - "RegulatorComplaint.claim_id != null when request.remedy_type == BENEFIT_REVERSAL"
        side_effects:
          - "sets RegulatorComplaint.responded_at, response_summary, disposition, remedy_type and remedy_amount_cents"
          - "BENEFIT_REVERSAL: appends one LedgerEntry (BENEFIT, BENEFIT_REVERSAL, amount_cents = -remedy_amount_cents, cap_year_start = Enrollment.cap_year_start), recomputes Enrollment.annual_benefit_used_cents and may move the cap dimension ANNUAL_CAP_EXHAUSTED -> WITHIN_CAP"
          - "PREMIUM_REFUND: appends one LedgerEntry (CASH, PRORATION_REFUND, amount_cents = -remedy_amount_cents) and moves the billing dimension to REFUND_ISSUED"
          - "REINSTATEMENT: drives the Enrollment CANCELLED -> ACTIVE transition and its REFUND_CLAWBACK ledger row"
          - "recomputes Premises.regulator_hold (false when the premises has no other RegulatorComplaint outside {CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED}) and re-derives Premises.suppression_reason"
          - "increments RegulatorComplaint.version by 1"
      - from: OVERDUE
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /regulator-complaints/{complaintId}/response with disposition=SUBSTANTIATED"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatorComplaint.status IN {OPEN, OVERDUE, ESCALATED}"
          - "expected_complaint_version == RegulatorComplaint.version"
        side_effects:
          - "identical to OPEN -> CLOSED_SUBSTANTIATED"
          - "increments RegulatorComplaint.version by 1"
      - from: ESCALATED
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /regulator-complaints/{complaintId}/response with disposition=SUBSTANTIATED"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatorComplaint.status IN {OPEN, OVERDUE, ESCALATED}"
          - "expected_complaint_version == RegulatorComplaint.version"
        side_effects:
          - "identical to OPEN -> CLOSED_SUBSTANTIATED"
          - "increments RegulatorComplaint.version by 1"
      - from: OPEN
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /regulator-complaints/{complaintId}/response with disposition=UNSUBSTANTIATED"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatorComplaint.status IN {OPEN, OVERDUE, ESCALATED}"
          - "expected_complaint_version == RegulatorComplaint.version"
          - "request.remedy_type IN {NONE, APOLOGY_ONLY} (an unsubstantiated complaint may not move money)"
        side_effects:
          - "sets responded_at, response_summary, disposition and remedy_type"
          - "recomputes Premises.regulator_hold and Premises.suppression_reason"
          - "increments RegulatorComplaint.version by 1"
      - from: OVERDUE
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /regulator-complaints/{complaintId}/response with disposition=UNSUBSTANTIATED"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatorComplaint.status IN {OPEN, OVERDUE, ESCALATED}"
          - "expected_complaint_version == RegulatorComplaint.version"
        side_effects:
          - "identical to OPEN -> CLOSED_UNSUBSTANTIATED"
          - "increments RegulatorComplaint.version by 1"
      - from: ESCALATED
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /regulator-complaints/{complaintId}/response with disposition=UNSUBSTANTIATED"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatorComplaint.status IN {OPEN, OVERDUE, ESCALATED}"
          - "expected_complaint_version == RegulatorComplaint.version"
        side_effects:
          - "identical to OPEN -> CLOSED_UNSUBSTANTIATED"
          - "increments RegulatorComplaint.version by 1"
      - from: CLOSED_UNSUBSTANTIATED
        to: ESCALATED
        trigger: "POST /regulator-complaints/{complaintId}/escalation"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatorComplaint.status == CLOSED_UNSUBSTANTIATED"
        side_effects:
          - "increments RegulatorComplaint.escalation_count by 1"
          - "clears responded_at, response_summary, disposition, remedy_type and remedy_amount_cents back to null"
          - "sets Premises.regulator_hold = true again for the complaint's enrollment when enrollment_id != null"
          - "increments RegulatorComplaint.version by 1"
        note: "Cycle OPEN -> CLOSED_UNSUBSTANTIATED -> ESCALATED -> CLOSED_*; a substantiated closure is the only terminal state."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (optimistic_concurrency layer)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: dispatch-create-stale-claim
    parent_entity: Claim
    child_entity: Dispatch
    write_endpoint: "POST /claims/{claimId}/dispatches"
    occ_field: expected_claim_version
    error_id: ERR_STALE_CLAIM_VERSION
    status: 412
    contention_window: "A dispatch creation is admitted only when the caller's expected_claim_version equals the claim's current version. Any earlier accepted write on that claim (a triage decision, a prior dispatch, a supersede) bumps Claim.version, so an operator holding the pre-write snapshot is refused."
    serial_observability: "Request 1 (POST /claims/{claimId}/dispatches with the fresh version) succeeds and bumps Claim.version to 3. Request 2, sent afterwards with the stale expected_claim_version 2, is refused with ERR_STALE_CLAIM_VERSION even though the claim is still dispatchable and a second dispatch with expected_claim_version 3 would have been accepted as a supersede."
  - rule_id: enrollment-create-stale-premises
    parent_entity: Premises
    child_entity: Enrollment
    write_endpoint: "POST /enrollments"
    occ_field: expected_premises_version
    error_id: ERR_STALE_PREMISES_VERSION
    status: 412
    contention_window: "Enrollment admission is decided from the premises snapshot the agent read: its owned_segments, suppression state and last_mail_decision. A mail drop, a suppression recompute driven by an appeal, or an earlier enrollment all bump Premises.version and invalidate that snapshot."
    serial_observability: "Request 1 (POST /campaigns/{campaignId}/mail-drop) succeeds and bumps Premises.version from 1 to 2 while marking the premises MAILED. Request 2, the enrollment carrying expected_premises_version 1, is refused with ERR_STALE_PREMISES_VERSION even though the very same body with expected_premises_version 2 is accepted and creates the enrollment."
  - rule_id: renewal-notice-stale-enrollment
    parent_entity: Enrollment
    child_entity: Enrollment
    write_endpoint: "POST /enrollments/{enrollmentId}/renewal-notices"
    occ_field: expected_enrollment_version
    error_id: ERR_STALE_ENROLLMENT_VERSION
    status: 412
    contention_window: "Renewal pricing is computed from the enrollment snapshot the retention analyst read. Any billing event, cancellation, cap movement or earlier renewal notice bumps Enrollment.version, invalidating that snapshot's price basis."
    serial_observability: "Request 1 (POST /enrollments/{enrollmentId}/billing-events) succeeds and bumps Enrollment.version to 4. Request 2, the renewal notice carrying expected_enrollment_version 3, is refused with ERR_STALE_ENROLLMENT_VERSION even though the same notice with expected_enrollment_version 4 is accepted."
  - rule_id: partner-status-change-stale-partner
    parent_entity: UtilityPartner
    child_entity: UtilityPartner
    write_endpoint: "POST /partners/{partnerId}/status-changes"
    occ_field: expected_partner_version
    error_id: ERR_STALE_PARTNER_VERSION
    status: 412
    contention_window: "A status change cascades campaign withdrawals, so it must be applied against the partner snapshot the admin evaluated. Any product filing or earlier status change bumps UtilityPartner.version."
    serial_observability: "Request 1 (POST /partners/{partnerId}/status-changes to SUSPENDED with the fresh version) succeeds and bumps UtilityPartner.version to 3. Request 2, the reinstatement to ACTIVE carrying the stale expected_partner_version 2, is refused with ERR_STALE_PARTNER_VERSION even though SUSPENDED -> ACTIVE is a legal transition and the same request with version 3 succeeds."
  - rule_id: complaint-response-stale-complaint
    parent_entity: RegulatorComplaint
    child_entity: RegulatorComplaint
    write_endpoint: "POST /regulator-complaints/{complaintId}/response"
    occ_field: expected_complaint_version
    error_id: ERR_STALE_COMPLAINT_VERSION
    status: 412
    contention_window: "A response moves money (benefit reversal, premium refund, reinstatement) based on the complaint record the analyst read. The nightly overdue/escalation sweep and any escalation bump RegulatorComplaint.version, so a response drafted against the pre-sweep snapshot is refused."
    serial_observability: "Request 1 (POST /operations/nightly-run) moves the complaint OPEN -> OVERDUE and bumps RegulatorComplaint.version to 2. Request 2, the response carrying expected_complaint_version 1, is refused with ERR_STALE_COMPLAINT_VERSION even though responding from OVERDUE is legal and the same body with version 2 is accepted."

# -----------------------------------------------------------------------------
# §1.3 Calculation Table
# -----------------------------------------------------------------------------
calculations:

  - rule_id: contractor_selection_score
    name: "Contractor network dispatch selection score"
    algorithm_type: weighted_scoring
    trigger_endpoints:
      - "POST /claims/{claimId}/dispatches"
    inputs:
      - "Contractor.sla_compliance_pct (0-100 integer)"
      - "Contractor.open_dispatch_count and Contractor.max_open_dispatches"
      - "Contractor.hourly_rate_cents"
      - "Claim.urgency, Claim.line_type"
      - "Premises.state_code reached through Claim.enrollment_id -> Enrollment.premises_id"
      - "ServiceLineProduct.permit_covered"
    constants:
      SCORE_WEIGHTS_STANDARD: "{sla_compliance_pct: 0.45, capacity_headroom_pct: 0.35, rate_score: 0.20}"
      SCORE_WEIGHTS_EMERGENCY: "{sla_compliance_pct: 0.70, capacity_headroom_pct: 0.25, rate_score: 0.05}"
      RATE_SCORE_DIVISOR_CENTS: 200
    input_set_filter: >-
      A Contractor is eligible only when ALL of: status == ACTIVE (PROBATION and SUSPENDED are excluded);
      license_expires_on > the logical clock's calendar date; Claim.line_type IN Contractor.line_types_certified;
      Contractor.state_code == the premises' state_code; Contractor.open_dispatch_count < Contractor.max_open_dispatches;
      and, when ServiceLineProduct.permit_covered == true, Contractor.permit_pull_authorized == true. The candidate
      list is enumerated in created_at ASC order before scoring.
    formula: >-
      capacity_headroom_pct = floor(100 * (max_open_dispatches - open_dispatch_count) / max_open_dispatches);
      rate_score = max(0, 100 - floor(hourly_rate_cents / RATE_SCORE_DIVISOR_CENTS));
      selection_score = round_half_up(w.sla_compliance_pct * sla_compliance_pct
      + w.capacity_headroom_pct * capacity_headroom_pct + w.rate_score * rate_score, 2)
      where w is SCORE_WEIGHTS_EMERGENCY when Claim.urgency == EMERGENCY and SCORE_WEIGHTS_STANDARD otherwise.
    ranking: "selection_score DESC, then hourly_rate_cents ASC, then created_at ASC"
    variants:
      standard_scheduled:
        applies_when: "Claim.urgency IN {URGENT, ROUTINE}"
        weights: SCORE_WEIGHTS_STANDARD
        description: "Cost and capacity dominate: a cheap, idle contractor with mediocre SLA history wins."
      same_day_emergency:
        applies_when: "Claim.urgency == EMERGENCY"
        weights: SCORE_WEIGHTS_EMERGENCY
        description: "Reliability dominates: the expensive contractor with the best SLA history wins the same dataset."
    worked_example: >-
      Contractor A (sla_compliance_pct 92, hourly_rate_cents 18000, max_open_dispatches 5, open_dispatch_count 0)
      has capacity_headroom_pct 100 and rate_score 10, scoring 78.4 standard and 89.9 emergency.
      Contractor B (sla_compliance_pct 76, hourly_rate_cents 6000, max_open_dispatches 4, open_dispatch_count 0)
      has capacity_headroom_pct 100 and rate_score 70, scoring 83.2 standard and 81.7 emergency.
      A ROUTINE claim therefore selects B; an EMERGENCY claim over the identical contractor pool selects A.
    precision: "selection_score is a decimal rounded HALF_UP to exactly 2 fractional digits; capacity_headroom_pct and rate_score are integers (floor)."
    empty_input_behavior: "No eligible contractor -> ERR_NO_ELIGIBLE_CONTRACTOR (422). The selection never falls back to an ineligible contractor."
    manual_override: >-
      When request.contractor_id is supplied the scoring pass is skipped, selection_mode is MANUAL and
      selection_score is the score that contractor would have received; the eligibility filter is still
      enforced field by field, surfacing ERR_CONTRACTOR_LICENSE_EXPIRED, ERR_CONTRACTOR_NOT_CERTIFIED,
      ERR_CONTRACTOR_CAPACITY_EXCEEDED or ERR_PERMIT_REQUIRED.

  - rule_id: dispatch_benefit_settlement
    name: "Benefit cap waterfall allocation across invoice buckets"
    algorithm_type: waterfall_allocation
    trigger_endpoints:
      - "POST /claims/{claimId}/dispatches"
      - "POST /dispatches/{dispatchId}/events"
    inputs:
      - "Dispatch.labor_cents, materials_cents, permit_fee_cents, restoration_cents, restoration_scope"
      - "ServiceLineProduct.per_occurrence_cap_cents, annual_cap_cents, permit_covered, restoration_covered_scope"
      - "Enrollment.annual_benefit_used_cents (BENEFIT ledger sum for the current cap year)"
      - "Claim.occurrence_root_claim_id (occurrence usage is pooled across recurrences)"
    constants:
      BUCKET_ORDER: "[LABOR, MATERIALS, PERMIT, RESTORATION]"
      RESTORATION_ALLOWANCE_CENTS: "{NONE: 0, BASIC_BACKFILL: 50000, FULL_HARDSCAPE: 250000}"
      ESTIMATED_HOURS_BY_LINE: "{WATER_SERVICE_LINE: 6, SEWER_LATERAL: 8, INTERIOR_PLUMBING: 3, EXTERIOR_ELECTRIC: 4}"
      ESTIMATED_MATERIALS_CENTS: "{WATER_SERVICE_LINE: 120000, SEWER_LATERAL: 200000, INTERIOR_PLUMBING: 45000, EXTERIOR_ELECTRIC: 80000}"
    formula: >-
      covered_restoration = min(restoration_cents, RESTORATION_ALLOWANCE_CENTS[ServiceLineProduct.restoration_covered_scope]);
      covered_permit = permit_fee_cents when ServiceLineProduct.permit_covered else 0;
      occurrence_pool = per_occurrence_cap_cents - (sum of benefit_paid_cents already posted against the same occurrence_root_claim_id);
      annual_pool = annual_cap_cents - Enrollment.annual_benefit_used_cents;
      pool = min(occurrence_pool, annual_pool);
      buckets are then filled strictly in BUCKET_ORDER, each bucket receiving min(bucket_request, pool_remaining):
      LABOR = labor_cents, MATERIALS = materials_cents, PERMIT = covered_permit, RESTORATION = covered_restoration;
      benefit_paid_cents = sum of the allocations;
      invoice_total_cents = labor_cents + materials_cents + permit_fee_cents + restoration_cents;
      customer_responsibility_cents = invoice_total_cents - benefit_paid_cents.
    variants:
      provisional_estimate:
        applies_when: "at dispatch creation (POST /claims/{claimId}/dispatches), before any invoice exists"
        formula: "estimated_benefit_cents = min(pool, ESTIMATED_HOURS_BY_LINE[Claim.line_type] * Contractor.hourly_rate_cents + ESTIMATED_MATERIALS_CENTS[Claim.line_type])"
        description: "Reserves against the pool using the assigned contractor's own rate card; no permit or restoration component."
      final_settlement:
        applies_when: "at dispatch completion (POST /dispatches/{dispatchId}/events with event_type=COMPLETE)"
        formula: "the full four-bucket waterfall above, run against the pool after the provisional reservation is released"
        description: "Uses actual invoice lines and applies both caps and the restoration allowance."
    reconciliation: >-
      Completion first releases the provisional reservation (annual_benefit_reserved_cents decreases by
      Dispatch.estimated_benefit_cents) and then posts the BENEFIT_CHARGE row for the final benefit_paid_cents,
      so the delta between variants never leaks into annual_benefit_used_cents.
    worked_example: >-
      Product per_occurrence_cap_cents 800000, annual_cap_cents 1000000, permit_covered true,
      restoration_covered_scope BASIC_BACKFILL. Dispatch 1 invoice labor 260000, materials 175000,
      permit_fee 42000, restoration 90000 -> covered_restoration 50000, pool 800000,
      allocations {LABOR 260000, MATERIALS 175000, PERMIT 42000, RESTORATION 50000},
      benefit_paid_cents 527000, invoice_total_cents 567000, customer_responsibility_cents 40000.
      Its provisional estimate under contractor A (hourly_rate_cents 18000, WATER_SERVICE_LINE) was
      6 * 18000 + 120000 = 228000, and under contractor B (6000) would have been 156000 - both diverge
      from the 527000 final settlement.
    precision: "integer cents throughout; no rounding is performed because every input is already an integer."

  - rule_id: cancellation_refund_proration
    name: "Cancellation refund / credit proration"
    algorithm_type: proration
    trigger_endpoints:
      - "POST /enrollments/{enrollmentId}/cancellation"
    inputs:
      - "Enrollment.monthly_price_cents, term_start, term_end, billing_mode, prepaid_amount_cents"
      - "request.requested_effective_date"
    constants:
      CANCELLATION_FEE_CENTS: 2500
      FREE_LOOK_DAYS: 30
    formula: >-
      cancellation_effective_date = request.requested_effective_date;
      the covered span is the HALF-OPEN interval [term_start, cancellation_effective_date) - the effective date itself
      is not earned - split at calendar-month boundaries, and
      earned_premium_cents = SUM over each overlapped calendar month of
      round_half_up(monthly_price_cents * days_covered_in_that_month / days_in_that_month)
      - each month is rounded to whole cents BEFORE the sum, never after;
      cancellation_fee_cents = 0 when (cancellation_effective_date - term_start) < FREE_LOOK_DAYS, else CANCELLATION_FEE_CENTS.
    pinned_order: "round per month, then sum. Summing the exact fractional monthly parts and rounding once at the end is explicitly WRONG and yields a different cent total."
    variants:
      direct_bill_cash_refund:
        applies_when: "Enrollment.billing_mode == DIRECT_BILL"
        formula: "refund_cents = prepaid_amount_cents - earned_premium_cents - cancellation_fee_cents; credit_cents = 0; a PRORATION_REFUND LedgerEntry is written for -refund_cents"
        description: "The policyholder paid the annual premium up front, so unearned premium is returned as cash net of the fee."
      bill_insert_credit:
        applies_when: "Enrollment.billing_mode == BILL_INSERT"
        formula: "days_remaining = days_in_month(cancellation_effective_date) - day_of_month(cancellation_effective_date) + 1; credit_cents = round_half_up(monthly_price_cents * days_remaining / days_in_month(cancellation_effective_date)); refund_cents = 0; a PRORATION_CREDIT LedgerEntry is written for -credit_cents"
        description: "Premium rides on the utility bill month by month, so only the unused remainder of the final billed month is credited - prepaid_amount_cents is irrelevant."
    worked_example: >-
      monthly_price_cents 2499, term_start 2026-08-05, requested_effective_date 2026-11-18.
      Per-month parts: Aug 27/31 -> 2177, Sep 30/30 -> 2499, Oct 31/31 -> 2499, Nov 17/30 -> 1416;
      earned_premium_cents = 8591 (summing first and rounding once would give 8627).
      Elapsed 105 days > FREE_LOOK_DAYS so cancellation_fee_cents = 2500.
      DIRECT_BILL with prepaid_amount_cents 29988 -> refund_cents = 29988 - 8591 - 2500 = 18897.
      BILL_INSERT over the same dates -> days_remaining = 30 - 18 + 1 = 13, credit_cents = round_half_up(2499 * 13 / 30) = 1083.
    precision: "integer cents; round_half_up on each per-month part and on the bill-insert credit."

  - rule_id: renewal_price_change_notice
    name: "Renewal price change notice sufficiency"
    algorithm_type: threshold
    trigger_endpoints:
      - "POST /enrollments/{enrollmentId}/renewal-notices"
      - "POST /operations/nightly-run"
    inputs:
      - "Enrollment.monthly_price_cents (the in-force price)"
      - "request.new_price_cents, request.renewal_effective_date"
      - "the logical clock at the moment the notice is sent"
      - "UtilityPartner.rate_filing_required"
    constants:
      NOTICE_DAYS_BY_TIER: "[{max_pct: 0, days: 15}, {max_pct: 10, days: 30}, {max_pct: 25, days: 45}, {max_pct: null, days: 60}]"
      RATE_FILING_PCT_THRESHOLD: 25
    formula: >-
      price_change_pct = round_half_up(100 * (new_price_cents - monthly_price_cents) / monthly_price_cents, 2);
      required_notice_days = the days value of the FIRST tier in NOTICE_DAYS_BY_TIER whose max_pct is null
      or price_change_pct <= max_pct (tiers are evaluated in the listed order, so the boundary belongs to the lower tier);
      notice_lead_days = renewal_effective_date - the logical clock's calendar date;
      the notice is compliant when notice_lead_days >= required_notice_days.
    pinned_order: >-
      Evaluation order is fixed: (1) the notice-days tier, then (2) the rate-filing gate. A change above
      RATE_FILING_PCT_THRESHOLD on a partner with rate_filing_required == true is rejected with
      ERR_RATE_FILING_REQUIRED even when the lead time would have satisfied the 60-day tier.
    boundary_note: "price_change_pct exactly 10.00 falls in the 30-day tier, not the 45-day tier. A lead time exactly equal to required_notice_days is compliant."
    worked_example: >-
      monthly_price_cents 1000, new_price_cents 1100 -> price_change_pct exactly 10.00 -> required_notice_days 30.
      With renewal_effective_date 2027-08-05, a notice sent while the clock reads 2027-07-06 has
      notice_lead_days 30 and is compliant (renewal_notice_status SENT); the same notice sent on 2027-07-07
      has notice_lead_days 29 and is rejected with ERR_INSUFFICIENT_RENEWAL_NOTICE.
    precision: "price_change_pct is a decimal rounded HALF_UP to 2 fractional digits; day counts are whole days."

  - rule_id: annual_and_occurrence_cap_usage
    name: "Benefit cap usage aggregation and cap-year reset"
    algorithm_type: aggregation
    trigger_endpoints:
      - "GET /enrollments/{enrollmentId}"
      - "POST /dispatches/{dispatchId}/events"
      - "POST /regulator-complaints/{complaintId}/response"
      - "POST /operations/nightly-run"
    inputs:
      - "LedgerEntry rows with ledger_kind == BENEFIT for the enrollment"
      - "Enrollment.cap_year_start, ServiceLineProduct.cap_reset_basis, annual_cap_cents, per_occurrence_cap_cents"
    input_set_filter: >-
      Only LedgerEntry rows with ledger_kind == BENEFIT and cap_year_start == Enrollment.cap_year_start
      participate. The cap year is the half-open interval [cap_year_start, cap_year_start + 1 year):
      an entry whose effective_date equals the next cap_year_start belongs to the NEXT year.
      Rows from other cap years, and every ledger_kind == CASH row, are excluded.
    formula: >-
      annual_benefit_used_cents = SUM(amount_cents) over the filtered rows (BENEFIT_REVERSAL rows are negative
      and therefore reduce the total); occurrence_used_cents for a claim = SUM(amount_cents) over the filtered
      rows whose claim_id belongs to the same occurrence_root_claim_id group;
      cap_status = ANNUAL_CAP_EXHAUSTED when annual_benefit_used_cents >= annual_cap_cents, else WITHIN_CAP.
    reset_rule: >-
      cap_year_start is set at enrollment to term_start when cap_reset_basis == ENROLLMENT_ANNIVERSARY and to
      January 1 of term_start's year when cap_reset_basis == CALENDAR_YEAR. The nightly renewal phase advances
      cap_year_start by exactly one year when the logical clock reaches the next anniversary (or January 1),
      which drops every prior row out of the filter and returns cap_status to WITHIN_CAP.
    boundary_note: "The comparison is >= : usage landing exactly on annual_cap_cents exhausts the cap. One cent less leaves cap_status WITHIN_CAP."
    worked_example: >-
      annual_cap_cents 1000000. Dispatch 1 posts BENEFIT_CHARGE 527000 -> annual_benefit_used_cents 527000,
      cap_status WITHIN_CAP. Dispatch 2 requests labor 400000 + materials 73000 against annual_pool 473000,
      so it pays exactly 473000 -> annual_benefit_used_cents 1000000 == annual_cap_cents -> cap_status
      ANNUAL_CAP_EXHAUSTED. A later BENEFIT_REVERSAL of -100000 returns usage to 900000 and cap_status to WITHIN_CAP.
    precision: "integer cents; the sum is exact."

  - rule_id: dispatch_response_sla
    name: "Contractor response SLA deadline"
    algorithm_type: chronological
    trigger_endpoints:
      - "POST /claims/{claimId}/dispatches"
      - "POST /dispatches/{dispatchId}/events"
      - "POST /operations/nightly-run"
    inputs:
      - "Claim.urgency, Claim.reported_at, Claim.sla_deadline_at"
      - "Dispatch.assigned_at"
    constants:
      SLA_HOURS: "{EMERGENCY: 4, URGENT: 24, ROUTINE: 72}"
      SLA_BREACH_PROBATION_THRESHOLD: 2
    formula: >-
      On the claim's FIRST dispatch, Claim.sla_deadline_at = Claim.reported_at + SLA_HOURS[Claim.urgency] hours
      and Dispatch.sla_deadline_at is stamped with the same instant. Every later dispatch on the same claim
      (including one created with supersedes_dispatch_id) INHERITS Claim.sla_deadline_at unchanged - re-dispatching
      never buys more time. response_minutes = floor((Dispatch.responded_at - Dispatch.assigned_at) / 60 seconds).
    boundary_note: "The sweep breaches when sla_deadline_at <= the logical clock; a nightly run at exactly sla_deadline_at breaches, one second earlier does not."
    worked_example: >-
      An EMERGENCY claim reported at 2026-09-10T08:00:00.000Z has sla_deadline_at 2026-09-10T12:00:00.000Z.
      A supersede created at 2026-09-10T11:30:00.000Z carries the same 12:00:00.000Z deadline, so a nightly run
      at 2026-09-10T12:00:00.000Z breaches it.
    precision: "instants are ISO-8601 UTC with exactly 3 fractional-second digits; response_minutes is a floored integer."

  - rule_id: mail_drop_suppression_allocation
    name: "Mailing list suppression precedence and quantity allocation"
    algorithm_type: priority_precedence
    trigger_endpoints:
      - "POST /campaigns/{campaignId}/mail-drop"
    inputs:
      - "every Premises with partner_id == MarketingCampaign.partner_id"
      - "Premises.do_not_mail, address_status, regulator_hold, owned_segments, mail_count_current_year"
      - "Enrollment rows for the premises and the campaign's product_id"
      - "Claim rows in APPEAL_OPEN reached through those enrollments"
      - "UtilityPartner.max_mailings_per_year, MarketingCampaign.approved_quantity"
      - "ServiceLineProduct.required_owned_segment"
    constants:
      SUPPRESSION_PRECEDENCE: "[DNM_REQUEST, BAD_ADDRESS, REGULATOR_COMPLAINT_OPEN, ACTIVE_ENROLLMENT, OPEN_APPEAL, CONTACT_FREQUENCY_CAP, OWNERSHIP_INELIGIBLE]"
    formula: >-
      Premises are enumerated in created_at ASC order. For each, the FIRST matching reason in
      SUPPRESSION_PRECEDENCE wins and is recorded as last_mail_suppression_reason:
      DNM_REQUEST when do_not_mail == true; BAD_ADDRESS when address_status == BAD;
      REGULATOR_COMPLAINT_OPEN when regulator_hold == true; ACTIVE_ENROLLMENT when an Enrollment on the
      campaign's product_id has coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY};
      OPEN_APPEAL when any Enrollment of the premises has retention_hold == true;
      CONTACT_FREQUENCY_CAP when mail_count_current_year >= UtilityPartner.max_mailings_per_year;
      OWNERSHIP_INELIGIBLE when ServiceLineProduct.required_owned_segment is NOT IN Premises.owned_segments.
      Survivors are then mailed in the same created_at ASC order until approved_quantity is filled; every
      remaining survivor is suppressed with QUANTITY_CAP, which sits OUTSIDE the precedence list because it
      is a capacity outcome rather than a rule violation.
    pinned_order: "precedence first (one reason per premises, the highest-ranked match), quantity allocation second."
    worked_example: >-
      A premises that is both do_not_mail == true AND has address_status == BAD reports DNM_REQUEST, not
      BAD_ADDRESS. A premises that is both regulator_hold == true AND already enrolled reports
      REGULATOR_COMPLAINT_OPEN. With approved_quantity 2 and three eligible survivors, the third (latest
      created_at) is suppressed with QUANTITY_CAP.
    precision: "counts are integers; the response's suppressed_by_reason map omits reasons with a zero count."
    empty_input_behavior: "approved_quantity 0 mails nobody: every eligible survivor is suppressed with QUANTITY_CAP and the campaign still transitions to MAILED with mailed_count 0."

  - rule_id: regulator_response_due_at
    name: "Regulator complaint response deadline"
    algorithm_type: threshold
    trigger_endpoints:
      - "POST /regulator-complaints"
      - "POST /operations/nightly-run"
    inputs:
      - "RegulatorComplaint.regulator, received_at"
      - "the cited Claim.status when claim_id != null"
    constants:
      RESPONSE_DAYS: "{PUC: 10, AG: 15, BBB: 21}"
      EXPEDITED_RESPONSE_DAYS: 5
      ESCALATION_GRACE_DAYS: 5
    formula: >-
      base_days = RESPONSE_DAYS[regulator];
      effective_days = min(base_days, EXPEDITED_RESPONSE_DAYS) when claim_id != null and the cited claim's
      status IN {DENIED, APPEAL_UPHELD_DENIAL}, else base_days;
      response_due_at = received_at + effective_days days;
      days_overdue = max(0, floor((the logical clock - response_due_at) / 86400 seconds)).
    worked_example: >-
      A PUC complaint received at 2026-09-20T00:00:00.000Z with no claim cited is due 2026-09-30T00:00:00.000Z.
      The same complaint citing a DENIED claim takes min(10, 5) = 5 days and is due 2026-09-25T00:00:00.000Z.
      A BBB complaint citing a DENIED claim also collapses to 5 days, so the expedited path is a floor,
      not a per-regulator subtraction.
    precision: "instants are ISO-8601 UTC with exactly 3 fractional-second digits; days_overdue is a floored integer."

  - rule_id: campaign_drop_window_conflict
    name: "Partner mailing drop-window spacing"
    algorithm_type: interval_merge
    trigger_endpoints:
      - "POST /campaigns/{campaignId}/submission"
    inputs:
      - "MarketingCampaign.drop_date of the submitted campaign"
      - "drop_date of every sibling MarketingCampaign with the same partner_id and status IN {PARTNER_REVIEW, APPROVED, MAILED}"
      - "UtilityPartner.min_days_between_drops"
    formula: >-
      For each sibling, gap_days = abs(candidate.drop_date - sibling.drop_date) measured in whole calendar days.
      A conflict exists when gap_days < UtilityPartner.min_days_between_drops. Siblings in DRAFT, REJECTED or
      WITHDRAWN are excluded, so withdrawing a campaign frees its window.
    boundary_note: >-
      The comparison is strict on whole days: gap_days < min_days_between_drops conflicts, gap_days exactly
      equal to min_days_between_drops is permitted. With min_days_between_drops 21 and a sibling dropping
      2026-08-05, 2026-08-25 (gap_days 20) conflicts and 2026-08-26 (gap_days 21) is the first permitted date.
    worked_example: >-
      Sibling in APPROVED with drop_date 2026-08-05 and min_days_between_drops 21: a candidate with drop_date
      2026-08-25 has gap_days 20 and is rejected with ERR_DROP_WINDOW_CONFLICT; a candidate with drop_date
      2026-08-26 has gap_days 21 and is admitted.
    precision: "whole calendar days; drop_date is date-only so no time component participates."

  - rule_id: contractor_visit_window_conflict
    name: "Contractor on-site window overlap with travel buffer"
    algorithm_type: interval_merge
    trigger_endpoints:
      - "POST /claims/{claimId}/dispatches"
    inputs:
      - "request.window_start and Claim.line_type of the new dispatch"
      - "window_start and window_end of every existing Dispatch of the same contractor with status IN {ASSIGNED, ACCEPTED, ON_SITE}"
    constants:
      VISIT_MINUTES_BY_LINE: "{WATER_SERVICE_LINE: 240, SEWER_LATERAL: 300, INTERIOR_PLUMBING: 120, EXTERIOR_ELECTRIC: 180}"
      TRAVEL_BUFFER_MINUTES: 45
    formula: >-
      window_end = window_start + VISIT_MINUTES_BY_LINE[Claim.line_type] minutes. Two dispatches conflict when
      the half-open interval [window_start, window_end) of the candidate, expanded symmetrically by
      TRAVEL_BUFFER_MINUTES on BOTH ends, intersects the existing half-open interval. Equivalently:
      candidate.window_start < existing.window_end + buffer AND existing.window_start < candidate.window_end + buffer.
      A dispatch in COMPLETED, CANCELLED, SLA_BREACHED or SUPERSEDED never blocks a window.
    boundary_note: >-
      Half-open plus buffer: back-to-back windows touching exactly at window_end do conflict because the buffer
      has not elapsed; the first non-conflicting start is exactly window_end + TRAVEL_BUFFER_MINUTES.
    worked_example: >-
      An existing WATER_SERVICE_LINE dispatch with window_start 2026-09-10T09:00:00.000Z has window_end
      2026-09-10T13:00:00.000Z. A second dispatch for the same contractor starting 2026-09-10T13:44:00.000Z
      conflicts (ERR_CONTRACTOR_WINDOW_CONFLICT); starting 2026-09-10T13:45:00.000Z it is admitted.
    precision: "minute arithmetic on ISO-8601 UTC instants rendered with exactly 3 fractional-second digits."

  - rule_id: claim_eligibility_assessment
    name: "Claim coverage eligibility assessment"
    algorithm_type: constraint_propagation
    trigger_endpoints:
      - "POST /claims"
      - "GET /claims/{claimId}"
      - "POST /claims/{claimId}/triage-decision"
    inputs:
      - "Claim.defect_location, line_type, reported_at, recurrence_of_claim_id"
      - "Enrollment.coverage_effective_at, coverage_status, cap_status"
      - "ServiceLineProduct.ownership_boundary, required_owned_segment, waiting_period_days, per_occurrence_cap_cents"
      - "Premises.owned_segments, known_defect_reported_at"
    constants:
      COVERED_DEFECT_LOCATIONS: "{CURB_STOP: [CURB_STOP_TO_METER, METER_TO_HOME], METER: [METER_TO_HOME], PROPERTY_LINE: [PROPERTY_LINE_TO_MAIN], INSIDE: [INSIDE_HOME]}"
      RECURRENCE_WINDOW_DAYS: 30
      APPEAL_WINDOW_DAYS: 30
      MAX_CLAIM_APPEALS: 2
      MAX_CAMPAIGN_REVISIONS: 2
      NONPAY_SUSPENSION_DAYS: 30
      NONPAY_LAPSE_DAYS: 60
    formula: >-
      eligibility_assessment is the FIRST failing check, evaluated in this pinned order:
      (1) COVERAGE_INACTIVE when Enrollment.coverage_status IN {SUSPENDED_NONPAY, CANCELLED, LAPSED};
      (2) OWNERSHIP_INELIGIBLE when Claim.defect_location is NOT IN
      COVERED_DEFECT_LOCATIONS[ServiceLineProduct.ownership_boundary] or
      ServiceLineProduct.required_owned_segment is NOT IN Premises.owned_segments;
      (3) PRE_EXISTING when Premises.known_defect_reported_at != null and
      Premises.known_defect_reported_at < Enrollment.enrollment_date;
      (4) WAITING_PERIOD when Claim.reported_at < Enrollment.coverage_effective_at;
      (5) CAP_EXHAUSTED when Enrollment.cap_status == ANNUAL_CAP_EXHAUSTED;
      otherwise ELIGIBLE.
    recurrence_rule: >-
      occurrence_root_claim_id = the transitive root of the recurrence_of_claim_id chain, or the claim's own id
      when recurrence_of_claim_id is null. A recurrence link is valid only when the referenced claim belongs to
      the same enrollment_id, has the same line_type, and this claim's reported_at is within
      RECURRENCE_WINDOW_DAYS of the referenced claim's reported_at; otherwise ERR_INVALID_RECURRENCE_LINK.
      Pooling recurrences means the per-occurrence cap is shared across the chain.
    boundary_note: >-
      The waiting-period comparison is strict: reported_at exactly equal to coverage_effective_at is ELIGIBLE,
      one millisecond earlier is WAITING_PERIOD.
    worked_example: >-
      Enrollment on 2026-08-05 with waiting_period_days 30 has coverage_effective_at 2026-09-04T00:00:00.000Z.
      A claim reported at 2026-09-04T00:00:00.000Z is ELIGIBLE; a claim reported at 2026-09-03T23:59:59.999Z
      is WAITING_PERIOD.
    precision: "coverage_effective_at = enrollment_date at 00:00:00.000Z plus waiting_period_days whole days, rendered with exactly 3 fractional-second digits."

# -----------------------------------------------------------------------------
# §1.4 Validation Table  (evaluated in strict ascending `priority` order; the
# FIRST violated rule is the response and no later rule is evaluated)
# -----------------------------------------------------------------------------
validations:

  - rule_id: authentication-required
    priority: 1
    category: auth
    condition: "X-User-ID header absent or empty"
    error_id: ERR_UNAUTHENTICATED
    status: 401
    applies_to: "every endpoint"
  - rule_id: role-permitted
    priority: 2
    category: rbac
    condition: "the caller's role is not listed in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    status: 403
    applies_to: "every endpoint"
  - rule_id: request-body-schema
    priority: 3
    category: schema
    condition: "a required input field is missing, has the wrong JSON type, carries an unknown enum member, or violates a declared length/range constraint (including negative amount_cents, requested_quantity < 1, an empty owned_segments array, or a non-UUID id)"
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: "every POST endpoint"
  - rule_id: conditional-amount-required
    priority: 3
    category: schema
    condition: "amount_cents is absent on POST /enrollments/{enrollmentId}/billing-events when event_type IN {PREMIUM_PAYMENT, INSERT_REMITTANCE, WRITE_OFF}, or remedy_amount_cents is absent on POST /regulator-complaints/{complaintId}/response when remedy_type IN {BENEFIT_REVERSAL, PREMIUM_REFUND}"
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: "POST /enrollments/{enrollmentId}/billing-events, POST /regulator-complaints/{complaintId}/response"
    note: "Conditional validation: the same payload shape is valid for one event_type and invalid for another."
  - rule_id: pagination-bounds
    priority: 4
    category: pagination
    condition: "limit < 1, limit > 100, offset < 0, or either value is not an integer"
    error_id: ERR_INVALID_PAGINATION
    status: 400
    applies_to: "every list endpoint"
  - rule_id: path-resource-exists
    priority: 5
    category: existence
    condition: "the UUID in the path segment matches no row of the addressed entity"
    error_id: "ERR_PARTNER_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_PREMISES_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    status: 404
    applies_to: "every endpoint with a path parameter"
  - rule_id: body-foreign-key-exists
    priority: 6
    category: existence
    condition: "a foreign key carried in the request body (partner_id, product_id, premises_id, source_campaign_id, contractor_id, supersedes_dispatch_id, recurrence_of_claim_id, claim_id, enrollment_id) matches no row"
    error_id: "the matching ERR_*_NOT_FOUND for the referenced entity"
    status: 404
    applies_to: "POST /service-line-products, POST /premises, POST /campaigns, POST /enrollments, POST /claims, POST /claims/{claimId}/dispatches, POST /regulator-complaints"
    note: "Body-FK existence is checked AFTER path existence, so a bad path id wins over a bad body id."
  - rule_id: resource-ownership
    priority: 7
    category: ownership
    condition: "an entity_backed caller acts on a resource it does not own: PartnerBrandReviewer whose X-User-ID != MarketingCampaign.partner_id, Policyholder whose X-User-ID != the premises reached through Claim.enrollment_id, or NetworkContractor whose X-User-ID != Dispatch.contractor_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    status: 403
    applies_to: "POST /campaigns/{campaignId}/decision, POST /claims/{claimId}/appeals, POST /dispatches/{dispatchId}/events"
  - rule_id: appeal-segregation-of-duties
    priority: 8
    category: ownership
    condition: "X-User-ID on POST /claims/{claimId}/appeal-decision equals Claim.triage_decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    applies_to: "POST /claims/{claimId}/appeal-decision"
    note: "The adjuster who denied a claim may not decide its appeal, even though AppealsOfficer is an allowed role for both users."
  - rule_id: campaign-decision-segregation-of-duties
    priority: 8
    category: ownership
    condition: "X-User-ID on POST /campaigns/{campaignId}/decision equals MarketingCampaign.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    applies_to: "POST /campaigns/{campaignId}/decision"
  - rule_id: occ-claim-version
    priority: 10
    category: concurrency
    condition: "expected_claim_version != Claim.version"
    error_id: ERR_STALE_CLAIM_VERSION
    status: 412
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: occ-enrollment-version
    priority: 10
    category: concurrency
    condition: "expected_enrollment_version != Enrollment.version"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    status: 412
    applies_to: "POST /enrollments/{enrollmentId}/renewal-notices"
  - rule_id: occ-premises-version
    priority: 10
    category: concurrency
    condition: "expected_premises_version != Premises.version"
    error_id: ERR_STALE_PREMISES_VERSION
    status: 412
    applies_to: "POST /enrollments"
  - rule_id: occ-partner-version
    priority: 10
    category: concurrency
    condition: "expected_partner_version != UtilityPartner.version"
    error_id: ERR_STALE_PARTNER_VERSION
    status: 412
    applies_to: "POST /partners/{partnerId}/status-changes"
  - rule_id: occ-complaint-version
    priority: 10
    category: concurrency
    condition: "expected_complaint_version != RegulatorComplaint.version"
    error_id: ERR_STALE_COMPLAINT_VERSION
    status: 412
    applies_to: "POST /regulator-complaints/{complaintId}/response"
  - rule_id: campaign-state-precondition
    priority: 20
    category: state
    condition: "the campaign is not in a state from which the requested transition is defined (submission needs DRAFT or REJECTED, decision needs PARTNER_REVIEW, mail-drop needs APPROVED)"
    error_id: ERR_INVALID_CAMPAIGN_STATE
    status: 409
    applies_to: "POST /campaigns/{campaignId}/submission, POST /campaigns/{campaignId}/decision, POST /campaigns/{campaignId}/mail-drop"
  - rule_id: claim-state-precondition
    priority: 20
    category: state
    condition: "the claim is not in a state from which the requested transition is defined (triage-decision needs TRIAGE; dispatches needs APPROVED, or DISPATCHED when supersedes_dispatch_id names an open dispatch of the same claim; appeals needs DENIED; appeal-decision needs APPEAL_OPEN)"
    error_id: ERR_INVALID_CLAIM_STATE
    status: 409
    applies_to: "POST /claims/{claimId}/triage-decision, POST /claims/{claimId}/dispatches, POST /claims/{claimId}/appeals, POST /claims/{claimId}/appeal-decision"
  - rule_id: dispatch-state-precondition
    priority: 20
    category: state
    condition: "the dispatch is not in a state from which the requested event is defined (ACCEPT needs ASSIGNED, ARRIVE needs ACCEPTED, COMPLETE needs ACCEPTED or ON_SITE)"
    error_id: ERR_INVALID_DISPATCH_STATE
    status: 409
    applies_to: "POST /dispatches/{dispatchId}/events"
  - rule_id: complaint-state-precondition
    priority: 20
    category: state
    condition: "the complaint is not in a state from which the requested transition is defined (response needs OPEN, OVERDUE or ESCALATED; escalation needs CLOSED_UNSUBSTANTIATED)"
    error_id: ERR_INVALID_COMPLAINT_STATE
    status: 409
    applies_to: "POST /regulator-complaints/{complaintId}/response, POST /regulator-complaints/{complaintId}/escalation"
  - rule_id: partner-status-transition-defined
    priority: 20
    category: state
    condition: "the requested target_status is not reachable from UtilityPartner.status (nothing leaves TERMINATED; ONBOARDING reaches only ACTIVE)"
    error_id: ERR_INVALID_PARTNER_STATE
    status: 409
    applies_to: "POST /partners/{partnerId}/status-changes"
  - rule_id: enrollment-terminal
    priority: 20
    category: state
    condition: "the enrollment's coverage_status IN {CANCELLED, LAPSED} on an operation that requires a live policy (cancellation, renewal-notices, billing-events, POST /claims)"
    error_id: ERR_ENROLLMENT_TERMINAL
    status: 409
    applies_to: "POST /enrollments/{enrollmentId}/cancellation, POST /enrollments/{enrollmentId}/renewal-notices, POST /enrollments/{enrollmentId}/billing-events, POST /claims"
  - rule_id: supersede-dispatch-open
    priority: 20
    category: state
    condition: "supersedes_dispatch_id names a dispatch whose status IN {COMPLETED, CANCELLED, SUPERSEDED} or whose claim_id differs from the path claimId"
    error_id: ERR_INVALID_DISPATCH_STATE
    status: 409
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: revision-limit
    priority: 20
    category: state
    condition: "MarketingCampaign.revision_count >= MAX_CAMPAIGN_REVISIONS on a resubmission from REJECTED"
    error_id: ERR_REVISION_LIMIT_REACHED
    status: 409
    applies_to: "POST /campaigns/{campaignId}/submission"
  - rule_id: appeal-limit
    priority: 20
    category: state
    condition: "Claim.appeal_count >= MAX_CLAIM_APPEALS"
    error_id: ERR_APPEAL_LIMIT_REACHED
    status: 409
    applies_to: "POST /claims/{claimId}/appeals"
  - rule_id: partner-must-be-active
    priority: 30
    category: cross_entity_state
    condition: "the owning UtilityPartner.status != ACTIVE when filing a product, creating or submitting a campaign, dropping mail, or enrolling a premises"
    error_id: ERR_PARTNER_NOT_ACTIVE
    status: 409
    applies_to: "POST /service-line-products, POST /campaigns, POST /campaigns/{campaignId}/submission, POST /campaigns/{campaignId}/mail-drop, POST /enrollments"
  - rule_id: partner-has-filed-product
    priority: 30
    category: cross_entity_state
    condition: "no ServiceLineProduct with status == AVAILABLE exists for the partner being activated"
    error_id: ERR_NO_FILED_PRODUCT
    status: 409
    applies_to: "POST /partners/{partnerId}/status-changes"
  - rule_id: product-must-be-available
    priority: 30
    category: cross_entity_state
    condition: "ServiceLineProduct.status == WITHDRAWN on enrollment or campaign creation"
    error_id: ERR_PRODUCT_WITHDRAWN
    status: 409
    applies_to: "POST /campaigns, POST /enrollments"
  - rule_id: campaign-must-be-mailed
    priority: 30
    category: cross_entity_state
    condition: "source_campaign_id is supplied on POST /enrollments and that campaign's status != MAILED"
    error_id: ERR_CAMPAIGN_NOT_MAILED
    status: 409
    applies_to: "POST /enrollments"
    note: "Campaign-sourced enrollment requires a completed drop; a direct inbound enrollment omits source_campaign_id and skips this gate."
  - rule_id: mailing-must-not-be-suppressed
    priority: 30
    category: cross_entity_state
    condition: "source_campaign_id is supplied and the premises was SUPPRESSED in that campaign's drop (Premises.last_mailed_campaign_id != source_campaign_id or Premises.last_mail_decision == SUPPRESSED)"
    error_id: ERR_MAILING_SUPPRESSED
    status: 409
    applies_to: "POST /enrollments"
  - rule_id: enrollment-must-be-live-for-triage-approval
    priority: 30
    category: cross_entity_state
    condition: "Enrollment.coverage_status IN {SUSPENDED_NONPAY, CANCELLED, LAPSED} when approving a claim in triage"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    status: 409
    applies_to: "POST /claims/{claimId}/triage-decision"
    note: "Priority-pair anchor: this state gate outranks the business_fiscal cap check at priority 70."
  - rule_id: contractor-must-be-active
    priority: 30
    category: cross_entity_state
    condition: "the named Contractor.status != ACTIVE on a manual dispatch"
    error_id: ERR_CONTRACTOR_NOT_ACTIVE
    status: 409
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: contractor-license-current
    priority: 40
    category: business_safety
    condition: "Contractor.license_expires_on <= the logical clock's calendar date on a manual dispatch"
    error_id: ERR_CONTRACTOR_LICENSE_EXPIRED
    status: 422
    applies_to: "POST /claims/{claimId}/dispatches"
    note: "Priority-pair anchor: an expired licence outranks the certification check at priority 50 - unlicensed work is a safety failure regardless of trade certification."
  - rule_id: permit-authority-required
    priority: 40
    category: business_safety
    condition: "ServiceLineProduct.permit_covered == true and the selected Contractor.permit_pull_authorized == false"
    error_id: ERR_PERMIT_REQUIRED
    status: 422
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: completion-permit-number-required
    priority: 40
    category: business_safety
    condition: "event_type == COMPLETE with permit_fee_cents > 0 and no permit_number supplied"
    error_id: ERR_PERMIT_REQUIRED
    status: 422
    applies_to: "POST /dispatches/{dispatchId}/events"
  - rule_id: contractor-line-certified
    priority: 50
    category: business_referential
    condition: "Claim.line_type is NOT IN Contractor.line_types_certified on a manual dispatch"
    error_id: ERR_CONTRACTOR_NOT_CERTIFIED
    status: 422
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: recurrence-link-valid
    priority: 50
    category: business_referential
    condition: "recurrence_of_claim_id names a claim on a different enrollment_id, with a different line_type, or reported more than RECURRENCE_WINDOW_DAYS before this claim's reported_at"
    error_id: ERR_INVALID_RECURRENCE_LINK
    status: 422
    applies_to: "POST /claims"
  - rule_id: complaint-remedy-target-required
    priority: 50
    category: business_referential
    condition: "remedy_type == BENEFIT_REVERSAL with claim_id null, or remedy_type IN {PREMIUM_REFUND, REINSTATEMENT} with enrollment_id null"
    error_id: ERR_REMEDY_TARGET_MISSING
    status: 422
    applies_to: "POST /regulator-complaints/{complaintId}/response"
  - rule_id: unsubstantiated-remedy-forbidden
    priority: 50
    category: business_referential
    condition: "disposition == UNSUBSTANTIATED with remedy_type NOT IN {NONE, APOLOGY_ONLY}"
    error_id: ERR_REMEDY_NOT_PERMITTED
    status: 422
    applies_to: "POST /regulator-complaints/{complaintId}/response"
  - rule_id: bill-insert-supported
    priority: 50
    category: business_referential
    condition: "billing_mode == BILL_INSERT while UtilityPartner.bill_insert_supported == false"
    error_id: ERR_BILL_INSERT_NOT_SUPPORTED
    status: 422
    applies_to: "POST /enrollments"
  - rule_id: restoration-scope-covered
    priority: 50
    category: business_referential
    condition: "the reported restoration_scope is richer than ServiceLineProduct.restoration_covered_scope in the ordering NONE < BASIC_BACKFILL < FULL_HARDSCAPE"
    error_id: ERR_RESTORATION_SCOPE_NOT_COVERED
    status: 422
    applies_to: "POST /dispatches/{dispatchId}/events"
  - rule_id: denial-reason-supported
    priority: 50
    category: business_referential
    condition: "decision == DENY with a denial_reason that contradicts Claim.eligibility_assessment (for example denial_reason PRE_EXISTING on a claim whose eligibility_assessment is WAITING_PERIOD, or any denial_reason other than NOT_COVERED_SEGMENT on a claim whose eligibility_assessment is ELIGIBLE)"
    error_id: ERR_DENIAL_REASON_UNSUPPORTED
    status: 422
    applies_to: "POST /claims/{claimId}/triage-decision"
  - rule_id: drop-window-spacing
    priority: 55
    category: business_temporal
    condition: "calculations.campaign_drop_window_conflict reports a conflict against a sibling campaign in PARTNER_REVIEW, APPROVED or MAILED"
    error_id: ERR_DROP_WINDOW_CONFLICT
    status: 422
    applies_to: "POST /campaigns/{campaignId}/submission"
  - rule_id: contractor-window-spacing
    priority: 55
    category: business_temporal
    condition: "calculations.contractor_visit_window_conflict reports an overlap with an open dispatch of the same contractor once the travel buffer is applied"
    error_id: ERR_CONTRACTOR_WINDOW_CONFLICT
    status: 422
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: drop-date-not-future
    priority: 55
    category: business_temporal
    condition: "MarketingCampaign.drop_date > the logical clock's calendar date at mail-drop time"
    error_id: ERR_DROP_DATE_IN_FUTURE
    status: 422
    applies_to: "POST /campaigns/{campaignId}/mail-drop"
  - rule_id: waiting-period-elapsed
    priority: 55
    category: business_temporal
    condition: "Claim.reported_at < Enrollment.coverage_effective_at (eligibility_assessment == WAITING_PERIOD) on a triage approval"
    error_id: ERR_WAITING_PERIOD_NOT_ELAPSED
    status: 422
    applies_to: "POST /claims/{claimId}/triage-decision"
  - rule_id: appeal-window-open
    priority: 55
    category: business_temporal
    condition: "the logical clock > Claim.denied_at + APPEAL_WINDOW_DAYS"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    status: 422
    applies_to: "POST /claims/{claimId}/appeals"
  - rule_id: renewal-notice-sufficient
    priority: 55
    category: business_temporal
    condition: "notice_lead_days < required_notice_days per calculations.renewal_price_change_notice"
    error_id: ERR_INSUFFICIENT_RENEWAL_NOTICE
    status: 422
    applies_to: "POST /enrollments/{enrollmentId}/renewal-notices"
  - rule_id: cancellation-date-in-term
    priority: 55
    category: business_temporal
    condition: "requested_effective_date < Enrollment.term_start or > Enrollment.term_end"
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: "POST /enrollments/{enrollmentId}/cancellation"
  - rule_id: ownership-boundary-eligible
    priority: 60
    category: business_constraint
    condition: "ServiceLineProduct.required_owned_segment is NOT IN Premises.owned_segments at enrollment, or Claim.defect_location is outside COVERED_DEFECT_LOCATIONS[ownership_boundary] on a triage approval"
    error_id: ERR_OWNERSHIP_NOT_ELIGIBLE
    status: 422
    applies_to: "POST /enrollments, POST /claims/{claimId}/triage-decision"
  - rule_id: no-duplicate-active-enrollment
    priority: 60
    category: business_constraint
    condition: "the premises already has an Enrollment on the same product_id whose coverage_status IN {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY}"
    error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    status: 422
    applies_to: "POST /enrollments"
  - rule_id: pre-existing-condition
    priority: 60
    category: business_constraint
    condition: "Premises.known_defect_reported_at < Enrollment.enrollment_date (eligibility_assessment == PRE_EXISTING) on a triage approval"
    error_id: ERR_PRE_EXISTING_CONDITION
    status: 422
    applies_to: "POST /claims/{claimId}/triage-decision"
  - rule_id: cancellation-blocked-by-appeal
    priority: 60
    category: business_constraint
    condition: "Enrollment.retention_hold == true"
    error_id: ERR_CANCELLATION_BLOCKED_APPEAL
    status: 422
    applies_to: "POST /enrollments/{enrollmentId}/cancellation"
  - rule_id: approved-quantity-within-request
    priority: 60
    category: business_constraint
    condition: "approved_quantity > MarketingCampaign.requested_quantity"
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: "POST /campaigns/{campaignId}/decision"
  - rule_id: contractor-capacity
    priority: 60
    category: business_constraint
    condition: "Contractor.open_dispatch_count >= Contractor.max_open_dispatches on a manual dispatch"
    error_id: ERR_CONTRACTOR_CAPACITY_EXCEEDED
    status: 422
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: rate-filing-required
    priority: 60
    category: business_constraint
    condition: "price_change_pct > RATE_FILING_PCT_THRESHOLD while UtilityPartner.rate_filing_required == true"
    error_id: ERR_RATE_FILING_REQUIRED
    status: 422
    applies_to: "POST /enrollments/{enrollmentId}/renewal-notices"
    note: "Evaluated after the notice-days tier, so a 60-day-compliant notice on an unfiled rate still fails here."
  - rule_id: annual-cap-available
    priority: 70
    category: business_fiscal
    condition: "Enrollment.cap_status == ANNUAL_CAP_EXHAUSTED (eligibility_assessment == CAP_EXHAUSTED) on a triage approval"
    error_id: ERR_ANNUAL_CAP_EXHAUSTED
    status: 422
    applies_to: "POST /claims/{claimId}/triage-decision"
    note: "Priority-pair anchor: outranked by enrollment-must-be-live-for-triage-approval at priority 30."
  - rule_id: occurrence-cap-available
    priority: 70
    category: business_fiscal
    condition: "the occurrence pool for Claim.occurrence_root_claim_id is already 0 at dispatch creation"
    error_id: ERR_PER_OCCURRENCE_CAP_EXHAUSTED
    status: 422
    applies_to: "POST /claims/{claimId}/dispatches"
  - rule_id: refund-available
    priority: 70
    category: business_fiscal
    condition: "the computed refund_cents is negative on a DIRECT_BILL cancellation (earned premium plus fee exceeds prepaid_amount_cents)"
    error_id: ERR_REFUND_NOT_AVAILABLE
    status: 422
    applies_to: "POST /enrollments/{enrollmentId}/cancellation"
  - rule_id: reversal-within-posted-benefit
    priority: 70
    category: business_fiscal
    condition: "remedy_type == BENEFIT_REVERSAL with remedy_amount_cents greater than the cited claim's benefit_paid_cents"
    error_id: ERR_REVERSAL_EXCEEDS_BENEFIT
    status: 422
    applies_to: "POST /regulator-complaints/{complaintId}/response"

