      - name: fraud_hold_window_lapse_auto_confirms_and_freezes
        claim_type: side_effect_execution
        grounds: ["state_machines.FraudHold.OPEN_to_CONFIRMED_FRAUD", "state_machines.Customer.ACTIVE_to_FROZEN", "entities.FraudHold.fields.expires_at"]
        distinguishing_aspect: "When the 24h confirmation window lapses the hold auto-resolves as CONFIRMED_FRAUD with resolution AUTO_LAPSED on the next access, the wire is CANCELLED, and the ordering customer is FROZEN — all without any explicit decision call."
        test_recipe:
          setup:
            - "Customer CS7 (MEDIUM), Account AS7 (limit 250000000), Beneficiary BS7, BusinessDate 2026-08-31 OPEN"
            - "Wire WS7 (100000) APPROVED; fraud hold placed at the default clock 2026-08-01T00:00:00Z (expires 2026-08-02T00:00:00Z)"
