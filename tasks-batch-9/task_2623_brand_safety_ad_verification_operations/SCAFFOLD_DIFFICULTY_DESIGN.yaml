              as: DisputeOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { decision_note: "Both windows below coverage floor" }
              as: DisputeOfficer
              as_user_id: "officer-1"
          assert:
            - "MeasurementBatch.${batch1_id}.coverage_rate == 0.5003 and MeasurementBatch.${batch2_id}.coverage_rate == 0.5006"
            - "RefundClaim.${claim_id}.claimed_impressions == 8000 and provisional_credit_cents == 7000"
            - "RefundClaim.${claim_id}.credited_impressions == 4004"
            - "RefundClaim.${claim_id}.gross_credit_cents == 3503 (per-batch 1313 + 2190), NOT 3504"
            - "RefundClaim.${claim_id}.admin_fee_rate == 0.15 and admin_fee_cents == 525 and net_credit_cents == 2978"
            - "Publisher.${pub_id}.credit_issued_cents_total == 2978"

      - name: admin_fee_tier_keyed_on_gross_credit_not_net_credit
        grounds:
          - calculations.claim_net_credit_cents
          - calculations.claim_gross_credit_cents
          - calculations.claim_impression_basis
          - entities.RefundClaim.fields.admin_fee_rate
        distinguishing_aspect: |
          Mode (c) - circular-looking with pinned evaluation order. The admin
          fee tier reads like it depends on the value it produces: this claim
          has gross_credit_cents 555000, which sits above
          ADMIN_FEE_TIER_BREAK_CENTS 500000 and so takes rate 0.10 -> fee 55500
          -> net 499500. Because 499500 is BELOW the break, any implementation
          that keys the tier on the net figure (or iterates to a fixed point)
          would charge 0.15 and settle at 471750. The declared evaluation order
          - gross first, tier from gross, fee, then net - is the only order that
          reproduces 499500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z; advertiser credit_cap_cents 1000000."
            - "Campaign cpm_cents 1000, format DISPLAY, min_suitability_tier MEDIUM_RISK; page classified GENERAL (SAFE)."
            - "One batch: measured 800000, measurable 555000, in_view 555000, avg_in_view_seconds 0.5 -> qualified_in_view 0, coverage_rate 0.6938, certify -> QUARANTINED, creditable 555000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
