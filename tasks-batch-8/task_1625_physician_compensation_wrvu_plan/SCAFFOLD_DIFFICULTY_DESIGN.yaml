            - { call: "POST /comp/comp-plans", payload: { name: "DC Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${sup1}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_sup: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_sup}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_sup}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_sup}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${app1}", plan_id: "${plan}", base_salary_cents: 12000000, period_draw_cents: 500000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_app: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_app}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_app}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 40 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_app}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/supervision-assignments", payload: { supervisor_physician_id: "${sup1}", app_physician_id: "${app1}", start_date: "2026-01-01", end_date: "2026-12-31", credit_pct: 0.5, supervised_fte: 0.5 }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_app}/production-captures", payload: { cpt_code: "99213", units: 10, service_date: "2026-02-10", posting_date: "2026-02-10" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_app}/comp-statements", payload: { period_year: 2026, period_month: 2 }, as: CompAnalyst, as_user_id: an_1, captures: { stmt_app: $.data.id } }
