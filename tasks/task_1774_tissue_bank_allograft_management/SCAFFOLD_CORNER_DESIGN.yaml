        distinguishing_aspect: "Unit release is exclusive to QualityManager; ImplantingSurgeon gets 403 (role check precedes existence, so even a random unit id 403s)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tissue-bank/tissue-units/11111111-2222-4333-8444-555555555555/release", as: ImplantingSurgeon, as_user_id: "surg-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (not 404: priority 2 beats priority 3)"

      - name: rbac_admin_cannot_approve_supplier
        claim_type: violation_to_error
        grounds: ["roles[ComplianceOfficer]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Supplier approval is exclusive to ComplianceOfficer; SupplyChainAdmin gets 403."
        test_recipe:
          setup: ["one supplier in PENDING_QUALIFICATION"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS"
            - "Supplier.${sup}.status == PENDING_QUALIFICATION"

      - name: rbac_quality_cannot_finalize_disposition
        claim_type: violation_to_error
        grounds: ["roles[ComplianceOfficer]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Disposition finalization is exclusive to ComplianceOfficer; QualityManager gets 403."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tissue-bank/disposition-records/11111111-2222-4333-8444-555555555555/finalize", as: QualityManager, as_user_id: "qm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS"

  - section: complexity_layers
    instances:
      - name: freezer_occupancy_reconciles_across_issue_and_return
        claim_type: derived_field_reconciliation
        grounds: [entities.Freezer.occupied_count, "state_machines.TissueUnit.AVAILABLE_to_ISSUED", "state_machines.TissueUnit.ISSUED_to_AVAILABLE"]
        distinguishing_aspect: "occupied_count is a derived field that must reconcile on every unit mutation: 1 after receipt, 0 after issue, 1 again after return-to-stock — no drift across the round trip."
        test_recipe:
          setup: ["qualified supplier; freezer; 1 unit ACCEPTED (occupied 1) + released AVAILABLE"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ1: $.data.occupied_count } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/issue", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ2: $.data.occupied_count } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/return-to-stock", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ3: $.data.occupied_count } }
          assert:
            - "occ1 == 1 (QUARANTINED/AVAILABLE both occupy)"
            - "occ2 == 0 (ISSUED leaves the freezer)"
            - "occ3 == 1 (return-to-stock restores occupancy; effective_capacity re-admitted the unit)"

      - name: cascading_side_effects_layer_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: excursion_reading_cascade_releases_reservation_and_recomputes_par
          rationale: "The 4-level excursion cascade (reading -> excursion/freezer -> units -> reservation -> par recompute) is asserted end-to-end by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_consistency_read_your_writes
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.POST /tissue-bank/freezers/{id}/readings"]
        distinguishing_aspect: "Immediate consistency: the out-of-range reading's own response already carries the opened excursion_id, and the very next GETs show the freezer EXCURSION_ACTIVE and its units QUARANTINED — no asynchronous lag anywhere."
        test_recipe:
          setup: ["qualified supplier; freezer; 1 unit ACCEPTED + released AVAILABLE"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "POST /tissue-bank/freezers/${fz}/readings", payload: { temp_celsius: -50.0 }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { ex: $.data.excursion_id, inr: $.data.in_range } }
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fst: $.data.status, fex: $.data.current_excursion_id } }
            - { call: "GET /tissue-bank/tissue-units/${u1}", as: QualityManager, as_user_id: "qm-1", captures: { ust: $.data.status, uhr: $.data.hold_reason } }
          assert:
            - "inr == false and ex != null (excursion opened within the same request)"
            - "fst == EXCURSION_ACTIVE and fex == ${ex}"
            - "ust == QUARANTINED and uhr == EXCURSION"
