              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id, ro_status: $.data.status }
          assert:
            - "RebalanceOrder.${ro_id}.status == PROPOSED before approve (proposed on a FROZEN account)"
            - "POST approve returns HTTP 409 data.error_id == ERR_CROSS_ENTITY_PRECONDITION (linked Account.status == FROZEN, not ACTIVE)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fee_run_finalize_period_range_overlap
        grounds:
          - state_machines.FeeRun.CALCULATED_to_FINALIZED
          - validations[priority=9]
          - entities.FeeRun.fields.period_start
          - entities.FeeRun.fields.period_end
        distinguishing_aspect: |
          Finalizing a second FeeRun for the same household whose inclusive [period_start, period_end] day-range
          overlaps an already-FINALIZED run (2026-01-01..2026-06-30 vs 2026-04-01..2026-09-30, sharing
          April-June) is rejected with ERR_BILLING_PERIOD_OVERLAP (409). Interval semantics = inclusive
          closed-range overlap on FeeRun; resource = Household billing calendar.
        test_recipe:
          setup:
            - "A household with one FINALIZED fee run for 2026-01-01..2026-06-30 and a second CALCULATED run for 2026-04-01..2026-09-30 (overlapping April-June)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 100000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-06-30", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { r1_id: $.data.id }
            - call: "POST /fee-runs/${r1_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
              as_user_id: "billing-1"
            - call: "POST /fee-runs/${r1_id}/state"
              payload: { action: "FINALIZE" }
              as: BillingAdmin
              as_user_id: "billing-2"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: BillingAdmin
              captures: { hh_v1: $.data.version }
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-04-01", period_end: "2026-09-30", expected_household_version: "${hh_v1}" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { r2_id: $.data.id }
            - call: "POST /fee-runs/${r2_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
          trigger:
            - call: "POST /fee-runs/${r2_id}/state"
              payload: { action: "FINALIZE" }
              as: BillingAdmin
              as_user_id: "billing-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_BILLING_PERIOD_OVERLAP (inclusive range overlap on the household billing calendar)"

      - name: review_same_date_point_collision
        grounds:
          - validations[priority=10]
          - entities.Review.fields.scheduled_for
          - state_machines.Review.SCHEDULED_to_MISSED
        distinguishing_aspect: |
          Scheduling a second SCHEDULED review for the same household on the exact same scheduled_for date is
          rejected with ERR_REVIEW_DATE_COLLISION (409). Interval semantics = zero-duration POINT equality on a
          single date (not a closed-range overlap) — a different geometric treatment from the FeeRun range
          overlap; resource = Review calendar.
        test_recipe:
          setup:
            - "A household with one SCHEDULED review on 2026-09-01."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /reviews"
              payload: { household_id: "${hh_id}", scheduled_for: "2026-09-01", cadence_days: 365 }
              as: Advisor
              captures: { rev1_id: $.data.id }
          trigger:
            - call: "POST /reviews"
              payload: { household_id: "${hh_id}", scheduled_for: "2026-09-01", cadence_days: 365 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_REVIEW_DATE_COLLISION (two SCHEDULED reviews share scheduled_for 2026-09-01)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: freeze_unfreeze_conserves_household_billable_aum
        grounds:
          - state_machines.Account.ACTIVE_to_FROZEN
          - state_machines.Account.FROZEN_to_ACTIVE
          - entities.Household.fields.billable_aum_cents
          - calculations.householding_breakpoint_tier
        distinguishing_aspect: |
          Conserved quantity = Household.billable_aum_cents (a CENTS SUM). FREEZE removes the account from the
          billable sum and UNFREEZE restores it, so billable_aum_cents returns to its exact pre-freeze value
          (200,000,000c): forward+compensating leaves the sum invariant, pinned as
          billable_aum_cents == sum of ACTIVE billable non-held-away member account market_value_cents.
        test_recipe:
          setup:
            - "A household with one ACTIVE billable account valued 200,000,000c; billable_aum_cents == 200,000,000."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 200000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Advisor
              captures: { billable_before: $.data.billable_aum_cents }
          trigger:
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "FREEZE" }
              as: Advisor
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Advisor
              captures: { billable_frozen: $.data.billable_aum_cents }
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "UNFREEZE" }
              as: Advisor
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Advisor
              captures: { billable_after: $.data.billable_aum_cents }
          assert:
            - "During FREEZE, Household.${hh_id}.billable_aum_cents == 0 (account excluded)"
            - "After UNFREEZE, Household.${hh_id}.billable_aum_cents == 200000000 (restored to exact pre-freeze value; no drift)"

      - name: ips_approve_supersede_conserves_approved_ips_count
        grounds:
          - state_machines.InvestmentPolicyStatement.PROPOSED_to_APPROVED
          - state_machines.InvestmentPolicyStatement.APPROVED_to_SUPERSEDED
          - entities.InvestmentPolicyStatement.fields.status
        distinguishing_aspect: |
          Conserved quantity = COUNT of APPROVED IPS for a client (a CARDINALITY, distinct from the cents-sum
          invariant above). Approving a second IPS (forward) supersedes the first (compensating), so the count
          of status==APPROVED IPS for the client stays exactly 1 before and after — pinned as
          count(IPS where client_id==c AND status==APPROVED) == 1.
        test_recipe:
          setup:
            - "A client with exactly one APPROVED IPS (count of APPROVED == 1) and a second IPS in PROPOSED."
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Bal", model_equity_pct: 60, target_weights: [ {sleeve: "EQ", target_pct: 60}, {sleeve: "FI", target_pct: 40} ] }
              as: Advisor
              captures: { pf_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/publish"
              payload: {}
              as: Advisor
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /investment-policy-statements"
              payload: { client_id: "${c_id}", target_portfolio_id: "${pf_id}", max_equity_pct: 80, drift_tolerance_bps: 500 }
              as: Advisor
              captures: { ips1_id: $.data.id }
            - call: "POST /investment-policy-statements/${ips1_id}/state"
              payload: { action: "PROPOSE" }
              as: Advisor
              as_user_id: "adv-1"
            - call: "POST /investment-policy-statements/${ips1_id}/state"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investment-policy-statements"
              payload: { client_id: "${c_id}", target_portfolio_id: "${pf_id}", max_equity_pct: 70, drift_tolerance_bps: 400 }
              as: Advisor
              captures: { ips2_id: $.data.id }
            - call: "POST /investment-policy-statements/${ips2_id}/state"
              payload: { action: "PROPOSE" }
              as: Advisor
              as_user_id: "adv-1"
          trigger:
            - call: "POST /investment-policy-statements/${ips2_id}/state"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /investment-policy-statements?client_id=${c_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "InvestmentPolicyStatement.${ips1_id}.status == SUPERSEDED and InvestmentPolicyStatement.${ips2_id}.status == APPROVED"
            - "count of IPS for client ${c_id} with status==APPROVED == 1 both before and after the second approve (cardinality conserved)"
