        distinguishing_aspect: "ACCEPT is restricted to the AE named in handoff_ae_user_id: SalesAccountExecutive ae-9 gets 403 ERR_NOT_HANDOFF_OWNER on an opportunity handed to ae-7, and ae-7's identical call succeeds."
