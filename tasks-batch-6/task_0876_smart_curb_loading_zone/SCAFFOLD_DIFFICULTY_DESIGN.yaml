# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >= 2 instances. Every grounds ref resolves into SCAFFOLD.yaml
# §1.1-§1.7. Every setup_api_calls / trigger call resolves to a §1.5 endpoint.
# All formula-derived asserts are literals computed against §1.3 constants.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_estimate_vs_settled
        grounds:
          - calculations.reservation_price
          - state_machines.Reservation.CONFIRMED_to_FULFILLED
          - entities.Reservation.fields.estimated_price_cents
          - entities.Reservation.fields.settled_price_cents
        distinguishing_aspect: "Same reservation: ESTIMATE at CONFIRM (booked 45 min -> 3 slots -> 900) diverges from SETTLED at FULFILL (observed 62 min -> 5 slots -> 1500); this is cost accounting on the Reservation domain."
        test_recipe:
          setup:
            - "Policy P1 (base 200/15min, peak 07-10 @1.5x); zone Z1 cap 5 ACTIVE; permittee owns an ACTIVE permit authorizing Z1"
            - "Reservation R [2026-06-01T08:00Z, 08:45Z) CONFIRMED (estimate 900, surge 1.0x, tou peak 1.5x, 3 slots)"
            - "A CLOSED OccupancySession matched to R with actual_minutes 62 (entered 08:00Z, exited 09:02Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { est: $.data.estimated_price_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_sensor/occupancy-enter", payload: { zone_id: "${z1}", reservation_id: "${res_id}" }, as: PlatformAdmin, captures: { sess_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:02:00Z" }, as: PlatformAdmin }
            - { call: "POST /_sensor/occupancy-exit", payload: { session_id: "${sess_id}" }, as: PlatformAdmin, captures: { actual: $.data.actual_minutes } }
          trigger:
            - { call: "POST /curb/reservations/${res_id}/fulfill", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { settled: $.data.settled_price_cents } }
          assert:
            - "Reservation.${res_id}.estimated_price_cents == 900"
            - "OccupancySession.${sess_id}.actual_minutes == 62"
            - "Reservation.${res_id}.settled_price_cents == 1500"
            - "Reservation.${res_id}.booking_status == FULFILLED"
            - "A LedgerEntry ADJUSTMENT with reservation_id == ${res_id} and amount_cents == 600 exists"

      - name: citation_issue_vs_upheld_late
        grounds:
          - calculations.citation_fine
          - state_machines.Citation.DISPUTED_to_UPHELD
          - entities.Citation.fields.fine_due_cents
        distinguishing_aspect: "Same citation: fine_due_cents is 7500 at ISSUE (OVERSTAY base) but 9375 after adjudication UPHELD past due_at (+25% late penalty); this is receivable scoring on the Citation domain, a different entity than the reservation cost variant."
        test_recipe:
          setup:
            - "Zone Z1 ACTIVE; permittee PM; officer issues an OVERSTAY citation at 2026-05-20 (due_at 2026-06-03)"
            - "Citation disputed, then adjudicated UPHELD at 2026-06-20 (strictly after due_at)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/citations", payload: { zone_id: "${z1}", permittee_id: "${pm_id}", violation_type: "OVERSTAY" }, as: EnforcementOfficer, as_user_id: "officer1", captures: { cit_id: $.data.id, base_fine: $.data.fine_due_cents } }
            - { call: "POST /curb/citations/${cit_id}/dispute", payload: { reason: "not us" }, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /curb/citations/${cit_id}/adjudicate", payload: { decision: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer1", captures: { upheld_fine: $.data.fine_due_cents } }
          assert:
            - "Citation.${cit_id}.fine_due_cents == 7500 immediately after issue"
            - "Citation.${cit_id}.status == UPHELD after adjudication"
            - "Citation.${cit_id}.fine_due_cents == 9375 after UPHELD past due_at"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: reservation_price_tiered_tou_surge_mode_a
        grounds:
          - calculations.reservation_price
          - entities.CurbZone.fields.capacity_slots
          - entities.Reservation.fields.estimated_price_cents
        distinguishing_aspect: "Mode (a): estimate combines >=3 interacting inputs non-linearly - slots(3) x time-of-use peak(1.5x) x tiered surge(tier2 1.5x at ratio 0.80) = 1350; changing any one factor changes the result."
        test_recipe:
          setup:
            - "Policy P1; zone Z1 cap 5; ACTIVE permit; 4 CONFIRMED reservations sharing window [08:00Z,08:45Z) so a 5th confirm sees overlap 4 (ratio 0.80 -> tier2) and peak hour 08"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { r1: $.data.id } }
            - { call: "POST /curb/reservations/${r1}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { r2: $.data.id } }
            - { call: "POST /curb/reservations/${r2}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { r3: $.data.id } }
            - { call: "POST /curb/reservations/${r3}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { r4: $.data.id } }
            - { call: "POST /curb/reservations/${r4}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { r5: $.data.id } }
          trigger:
            - { call: "POST /curb/reservations/${r5}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { est5: $.data.estimated_price_cents } }
          assert:
            - "Reservation.${r5}.surge_ratio_bps == 8000"
            - "Reservation.${r5}.estimated_price_cents == 1350"
            - "Reservation.${r4}.estimated_price_cents == 1125"

      - name: event_refund_round_each_then_sum_mode_b
        grounds:
          - calculations.event_refund_settlement
          - state_machines.CurbEvent.PLANNED_to_ACTIVE
          - entities.CurbEvent.fields.total_refund_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned round-per-reservation-then-sum; two 100-cent reservations at 1/3 remaining give round(33.33)+round(33.33)=66, NOT round(66.67)=67."
        test_recipe:
          setup:
            - "Policy P2 (base 100/15min); zone Z2 cap 3 ACTIVE; ACTIVE permit; two reservations R1,R2 [12:00Z,12:15Z) CONFIRMED (estimate 100 each)"
            - "Event E over Z2, window [12:00Z,13:00Z); clock advanced to 12:10Z so each reservation is in progress with 5 of 15 minutes remaining"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P2", base_rate_cents_per_15min: 100, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z2", block_face: "OAK-200", length_meters: 20, designation: "LOADING", capacity_slots: 3, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z2: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z2}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z2}", start_utc: "2026-06-01T12:00:00Z", end_utc: "2026-06-01T12:15:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { r1: $.data.id } }
            - { call: "POST /curb/reservations/${r1}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z2}", start_utc: "2026-06-01T12:00:00Z", end_utc: "2026-06-01T12:15:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { r2: $.data.id } }
            - { call: "POST /curb/reservations/${r2}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/events", payload: { name: "Street Fair", start_utc: "2026-06-01T12:00:00Z", end_utc: "2026-06-01T13:00:00Z", zone_ids: ["${z2}"] }, as: CurbPlanner, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T12:10:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /curb/events/${ev_id}/activate", payload: {}, as: CurbPlanner, captures: { total: $.data.total_refund_cents } }
          assert:
            - "CurbEvent.${ev_id}.total_refund_cents == 66"
            - "A LedgerEntry REFUND with reservation_id == ${r1} and amount_cents == -33 exists"
            - "A LedgerEntry REFUND with reservation_id == ${r2} and amount_cents == -33 exists"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_revision_cycle
        grounds:
          - state_machines.CurbPermit.UNDER_REVIEW_to_DRAFT
          - state_machines.CurbPermit.DRAFT_to_SUBMITTED
          - state_machines.CurbPermit.UNDER_REVIEW_to_ACTIVE
        distinguishing_aspect: "CurbPermit is cyclic: DRAFT->SUBMITTED->UNDER_REVIEW->DRAFT (request-changes) then forward again to UNDER_REVIEW->ACTIVE; the permit re-enters DRAFT, a state it already left."
        test_recipe:
          setup:
            - "Permit created, submitted, reviewed, sent back with request-changes (back to DRAFT), resubmitted, reviewed again"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/request-changes", payload: { note: "add insurance" }, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
          trigger:
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1", captures: { st: $.data.status } }
          assert:
            - "CurbPermit.${permit_id}.status == ACTIVE"
            - "CurbPermit.${permit_id}.last_change_note == 'add insurance'"
            - "CurbPermit.${permit_id}.version == 7"

      - name: reservation_parallel_booking_payment
        grounds:
          - entities.Reservation.fields.booking_status
          - entities.Reservation.fields.payment_status
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Reservation carries two independent state axes: booking_status (PENDING->CONFIRMED->CANCELLED) and payment_status (UNPAID->CAPTURED->REFUNDED) evolve on the same row on separate enums."
        test_recipe:
          setup:
            - "Reservation R [2026-06-01T08:00Z,08:45Z) CONFIRMED (booking CONFIRMED, payment CAPTURED, estimate 900); clock 2026-05-20 (before start)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /curb/pricing-policies", payload: { name: "P1", base_rate_cents_per_15min: 200, peak_multiplier_bps: 15000, peak_start_hour: 7, peak_end_hour: 10, surge_tier1_ratio_bps: 5000, surge_tier1_mult_bps: 12500, surge_tier2_ratio_bps: 8000, surge_tier2_mult_bps: 15000 }, as: CurbPlanner, captures: { pol_id: $.data.id } }
            - { call: "POST /curb/zones", payload: { name: "Z1", block_face: "MAIN-100", length_meters: 12, designation: "LOADING", capacity_slots: 5, pricing_policy_id: "${pol_id}" }, as: CurbPlanner, captures: { z1: $.data.id } }
            - { call: "POST /curb/permittees", payload: { legal_name: "Acme", contact_email: "a@x.com", permittee_type: "CARRIER" }, as: PlatformAdmin, captures: { pm_id: $.data.id } }
            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/permits/${permit_id}/review", payload: {}, as: CurbPlanner, as_user_id: "planner1" }
            - { call: "POST /curb/permits/${permit_id}/approve", payload: {}, as: PermitApprover, as_user_id: "approver1" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { b1: $.data.booking_status, p1: $.data.payment_status } }
          trigger:
            - { call: "POST /curb/reservations/${res_id}/cancel", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { b2: $.data.booking_status, p2: $.data.payment_status } }
          assert:
            - "After confirm: Reservation.${res_id}.booking_status == CONFIRMED and payment_status == CAPTURED"
            - "After cancel: Reservation.${res_id}.booking_status == CANCELLED and payment_status == REFUNDED"
            - "Reservation.${res_id}.estimated_price_cents == 900 (stamped at confirm, unchanged by cancel)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: event_activate_zone_reservation_ledger_depth3
        grounds:
          - state_machines.CurbEvent.PLANNED_to_ACTIVE
          - state_machines.CurbZone.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED_BY_EVENT
        distinguishing_aspect: "Depth-3 chain from event activation: activate -> zone SUSPENDED (link1) -> that suspension cancels the overlapping CONFIRMED reservation to CANCELLED_BY_EVENT + REFUNDED (link2) -> that cancellation appends a LedgerEntry REFUND (link3)."
        test_recipe:
          setup:
            - "Zone Z1 ACTIVE; ACTIVE permit; reservation R [08:00Z,08:45Z) CONFIRMED (estimate 900); event E over Z1 window [08:00Z,09:00Z); clock 2026-05-25 (before start -> full refund)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: PlatformAdmin }
