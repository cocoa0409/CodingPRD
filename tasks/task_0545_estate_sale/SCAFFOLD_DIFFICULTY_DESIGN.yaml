      - name: sale_close_marks_unsold_and_releases_crew
        grounds:
          - state_machines.SaleEvent.OPEN_to_CLOSED
          - state_machines.Lot.LISTED_to_UNSOLD
          - calculations.crew_booked_minutes
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: close SaleEvent (A) -> its project's LISTED lot -> UNSOLD
          (B, caused by A) -> Project.unsold_lot_count recomputed to 1 and Crew.booked_minutes released to 0
          (C). Distinct propagation from the project-cancel cascade.
        test_recipe:
          setup:
            - "Project SALE_LIVE with one LISTED (unsold) lot; sale event OPEN, crew booked 480 minutes"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
