        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[goodwill-counter-offer-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Counter-offer with stale expected_transfer_version (observed before the other party's counter) -> ERR_STALE_VERSION (412); replay with fresh version succeeds."
        test_recipe:
          setup: ["OFFERED transfer; successor counters (version advances); retiring advisor replays with the pre-counter version."]
          setup_api_calls:
            - call: "POST /branch-office/_clock/set_current_utc"
