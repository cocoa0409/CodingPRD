  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: core_loss_input_set_only_core_loss_records_count
        claim_type: input_set_filtering
        grounds: [calculations.failure_risk_pct, calculations.core_loss_verdict]
        distinguishing_aspect: "failure_risk_pct inspects only CORE_LOSS TestRecords for the current work order; INCOMING/FINAL records never influence risk_pct, and a CORE_LOSS record from a different work order is out of the input set."
        test_recipe:
          setup: ["two work orders W1 (core loss FAIL) and W2 (no core loss) for identical motors; quotes issued for both"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-C1", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { m1: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-C2", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { m2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${m1}", priority: "STANDARD" }
              as: Technician
              captures: { w1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${m2}", priority: "STANDARD" }
              as: Technician
              captures: { w2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${w1}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${w1}/tests"
              payload: { kind: "CORE_LOSS", measured_watts: 3800 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${w1}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 12, materials_cents: 38000, replacement_cost_cents: 260000 }
              as: Technician
            - call: "POST /shops/${shop_id}/work-orders/${w2}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${w2}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 12, materials_cents: 38000, replacement_cost_cents: 260000 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${w1}"
              as: Estimator
              captures: { w1v: $.data.version }
            - call: "GET /shops/${shop_id}/work-orders/${w2}"
              as: Estimator
              captures: { w2v: $.data.version }
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${w1}/quotes"
              payload: { expected_work_order_version: "${w1v}" }
              as: Estimator
              captures: { q1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${w2}/quotes"
              payload: { expected_work_order_version: "${w2v}" }
              as: Estimator
              captures: { q2: $.data.id }
          assert:
            - "Quote.${q1}.risk_pct == 0.35   # W1 has a CORE_LOSS FAIL"
            - "Quote.${q2}.risk_pct == 0.08   # W2 has no core-loss record; age = 2026 - 2020 = 6 < 8 -> base tier"
            - "Quote.${q1}.recommendation == REPLACE and Quote.${q2}.recommendation == REWIND   # identical winding inputs; only the input-set membership of the CORE_LOSS FAIL differs"

      - name: vibration_frame_tier_boundaries
        claim_type: correct_result
        grounds: [calculations.vibration_verdict]
        distinguishing_aspect: "Frame 315 sits at the top of the small tier (limit 2.8): measured 2.8 -> PASS (== limit passes) and the same work order, after the automatic rework loop, measured 2.81 -> FAIL (strictly greater fails). The frame-tier boundary 315/316 switches the limit from 2.8 to 3.5."
        test_recipe:
          setup: ["one work order in BALANCING for a motor with frame_mm 315 (small-tier edge; limit 2.8)"]
          setup_api_calls:
            - call: "POST /shops"
