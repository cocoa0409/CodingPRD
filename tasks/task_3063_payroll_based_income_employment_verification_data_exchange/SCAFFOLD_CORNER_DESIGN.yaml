              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/verification-products"
              payload: { product_code: "MORTGAGE-I12", tier: "EMPLOYMENT_INCOME", requesting_class: "MORTGAGE", base_fee_cents: 1500, history_months_included: 12, includes_employment_status: true }
              as: PlatformAdmin
              captures: { prd_id: $.data.id }
            - call: "POST /work-number/verifiers"
              payload: { legal_name: "Meridian Home Lending", verifier_class: "MORTGAGE_LENDER", permitted_purpose: "MORTGAGE_CREDIT_DECISION", escrow_balance_cents: 6000 }
              as: PlatformAdmin
              captures: { vfr_id: $.data.id }
            - call: "POST /work-number/verifiers/${vfr_id}/accredit"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/verifiers/${vfr_id}/authorize"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-08-31T00:00:00Z", record_count: 900 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_id}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2023-01-15T00:00:00Z", separation_date: null, pay_rate_cents: 520000, pay_rate_basis: "MONTHLY", standard_hours_per_week: 40, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/consumer-authorizations"
              payload: { covered_worker_id: "${wk_id}", verifier_id: "${vfr_id}", permitted_purpose: "MORTGAGE_CREDIT_DECISION", expected_covered_worker_version: "${wk_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { aut_id: $.data.id }
            - call: "POST /work-number/verification-requests"
              payload: { verifier_id: "${vfr_id}", covered_worker_id: "${wk_id}", product_id: "${prd_id}", permissible_purpose_asserted: "MORTGAGE_CREDIT_DECISION" }
              as: Verifier
              as_user_id: "${vfr_id}"
              captures: { req_id: $.data.id }
            - call: "POST /work-number/verification-requests/${req_id}/permit"
              payload: { consumer_authorization_id: "${aut_id}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
            - call: "POST /work-number/verification-responses"
              payload: { verification_request_id: "${req_id}" }
              as: Verifier
              as_user_id: "${vfr_id}"
          trigger:
            - call: "POST /work-number/verification-requests/${req_id}/reverse"
              payload: {}
              as: PlatformAdmin
              captures: { req_id_c: $.data.id, tier_after: $.data.resolved_product_tier }
            - call: "GET /work-number/verification-requests/${req_id}"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "GET /work-number/verification-responses"
              payload: { verification_request_id: "${req_id}" }
              as: Verifier
              as_user_id: "${vfr_id}"
          assert:
            - "the reversal response itself already reports verification_request_id == ${req_id} and resolved_product_tier null, so the clear is immediate rather than eventual"
            - "the follow-up request read reports request_state == REVERSED_RECONSENT_REQUIRED, current_employment_status null and rendered_field_set == []"
            - "the filtered response list for ${req_id} is empty, because the response row was deleted by the reversal"
            - "Verifier.${vfr_id}.negative_escalation_count == 30 after the reversal, per REVERSAL_PENALTY"