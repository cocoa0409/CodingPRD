      - name: laydown_capacity_boundary
        claim_type: violation_to_error
        grounds: ["errors[ERR_LAYDOWN_CAPACITY_EXCEEDED]", calculations.laydown_occupancy]
        distinguishing_aspect: "Aggregate-capacity boundary is inclusive: occupied 450 + 60 > 500 fails, while occupied 450 + 50 == 500 is admitted (<= capacity)."
        test_recipe:
          setup: ["turnaround SCOPE_FROZEN; area capacity 500 with one 450-sqm reservation (area version advanced to 2)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-LCB", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/laydown-areas", payload: { name: "North Laydown", capacity_sqm: 500 }, as: TurnaroundManager, captures: { a_id: "$.data.id", a_v1: "$.data.version" } }
            - { call: "POST /laydown-areas/${a_id}/reservations", payload: { material_description: "Big skid", area_sqm: 450, window_from: "2026-06-10T00:00:00Z", window_until: "2026-06-20T00:00:00Z", expected_laydown_area_version: "${a_v1}" }, as: Planner }
            - { call: "GET /laydown-areas/${a_id}", payload: {}, as: Planner, captures: { a_v2: "$.data.version" } }
          trigger:
            - { call: "POST /laydown-areas/${a_id}/reservations", payload: { material_description: "Too big", area_sqm: 60, window_from: "2026-06-10T00:00:00Z", window_until: "2026-06-20T00:00:00Z", expected_laydown_area_version: "${a_v2}" }, as: Planner, captures: { err: "$.data.error_id" } }
            - { call: "POST /laydown-areas/${a_id}/reservations", payload: { material_description: "Exact fit", area_sqm: 50, window_from: "2026-06-10T00:00:00Z", window_until: "2026-06-20T00:00:00Z", expected_laydown_area_version: "${a_v2}" }, as: Planner, captures: { r_ok: "$.data.id" } }
            - { call: "GET /laydown-areas/${a_id}", payload: {}, as: Planner, captures: { occ: "$.data.occupied_sqm", a_v3: "$.data.version" } }
          assert:
            - "450 + 60 -> ERR_LAYDOWN_CAPACITY_EXCEEDED (409)"
            - "450 + 50 -> 201 (equality admitted); the failed attempt did not consume the version, so the same expected version still works"
            - "LayDownArea.occupied_sqm == 500 and version == 3"

