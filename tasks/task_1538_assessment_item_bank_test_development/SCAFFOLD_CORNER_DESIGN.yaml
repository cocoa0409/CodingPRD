      - name: validation_auth_missing_header
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Request without X-User-ID or X-User-Role header is rejected 400"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/assessment-programs"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400) when headers are absent"

      - name: validation_role_mismatch_returns_403
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "ItemWriter attempting ProgramDirector-exclusive POST /api/assessment-programs is rejected 403"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-X", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ItemWriter
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSUFFICIENT_PERMISSIONS (HTTP 403)"

      - name: validation_duplicate_item_code_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_DUPLICATE_CODE]"
        distinguishing_aspect: "Second item with same item_code in same program is rejected"
        test_recipe:
          setup: ["Program + standard + one item with item_code='I-DUP'"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-DUP", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-DUP", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
          trigger:
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-DUP", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>y</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_CODE (HTTP 409)"

      - name: validation_window_time_invalid_when_start_after_end
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_WINDOW_TIME_INVALID]"
        distinguishing_aspect: "Window with start_utc > end_utc is rejected at create time"
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-T", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /api/field-test-windows"
              payload: { program_id: "${prog}", window_label: "BAD", start_utc: "2026-08-31T00:00:00Z", end_utc: "2026-08-01T00:00:00Z", target_sample_size: 50 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_WINDOW_TIME_INVALID (HTTP 422)"

      - name: validation_variant_kind_mismatch_returns_422
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_VARIANT_KIND_MISMATCH]"
        distinguishing_aspect: "TRANSLATION variant without language_code is rejected"
        test_recipe:
          setup: ["Program + standard + item exist"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-V", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-V", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id }
          trigger:
            - call: "POST /api/item-variants"
              payload: { item_id: "${item}", variant_kind: "TRANSLATION", stimulus_html: "<p>y</p>", options_json: {} }
              as: TranslationSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VARIANT_KIND_MISMATCH (HTTP 422)"

      - name: validation_rationale_required_on_reject
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_RATIONALE_REQUIRED]"
        distinguishing_aspect: "REJECT verdict without rationale (or rationale < 20 chars) is rejected"
        test_recipe:
          setup: ["Open CONTENT session with item on agenda"]
          setup_api_calls:
            - call: "POST /api/assessment-programs"
              payload: { program_code: "P-R", subject: "MATH", grade_level: 3, admin_year: 2026 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /api/content-standards"
              payload: { program_id: "${prog}", standard_code: "CS", strand: "S", description: "D", depth_of_knowledge: 1 }
              as: ProgramDirector
              captures: { cs: $.data.id }
            - call: "POST /api/items"
              payload: { program_id: "${prog}", item_code: "I-R", primary_standard_id: "${cs}", item_type: "MC", stimulus_html: "<p>x</p>", options_json: {}, max_score_points: 1 }
              as: ItemWriter
              captures: { item: $.data.id, item_v: $.data.version }
            - call: "POST /api/items/${item}/submit"
              payload: { expected_item_version: "${item_v}" }
              as: ItemWriter
            - call: "POST /api/review-committees"
              payload: { program_id: "${prog}", committee_kind: "CONTENT", name: "C", quorum_size: 2 }
              as: ProgramDirector
              captures: { cc: $.data.id }
            - call: "POST /api/review-sessions"
              payload: { committee_id: "${cc}", scheduled_at: "2026-08-01T00:00:00Z", agenda_item_ids: ["${item}"] }
              as: ProgramDirector
              captures: { sess: $.data.id }
            - call: "POST /api/review-sessions/${sess}/open"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /api/review-sessions/${sess}/verdicts"
              payload: { item_id: "${item}", verdict: "REJECT", rationale: "short" }
              as: ContentReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RATIONALE_REQUIRED (HTTP 400)"

      - name: validation_dossier_content_min_200_chars
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_DOSSIER_INVALID]"
        distinguishing_aspect: "content_md shorter than 200 chars is rejected"
        test_recipe:
          setup: ["Program + blueprint + form"]
          setup_api_calls:
