scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_berth_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - "entities.Berth"
          - "endpoints"
        distinguishing_aspect: "POST /berths with code/length_m/draft_m -> 201, response carries id, code, length_m, draft_m, status=AVAILABLE, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /berths"
              payload: { code: "B-100", length_m: 350, draft_m: 15.5 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
          assert:
            - "response status == 201"
            - "Berth.code == B-100"
            - "Berth.status == AVAILABLE"
            - "Berth.version == 1"

      - name: get_vessel_returns_stored_data
        claim_type: Retrieval
        grounds:
          - "entities.Vessel"
          - "endpoints"
        distinguishing_aspect: "GET /vessels/{id} returns the same imo_number/name/loa_m/free_time_days stored at create."
        test_recipe:
          setup: ["One vessel created."]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "2000001", name: "Get Me", loa_m: 280, draft_m: 13.0, free_time_days: 7 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "GET /vessels/${vessel_id}"
              payload: {}
              as: TerminalAdmin
          assert:
            - "Vessel.imo_number == 2000001"
            - "Vessel.free_time_days == 7"

      - name: list_berths_paginated_envelope
        claim_type: Listing
        grounds:
          - "entities.Berth"
          - "endpoints"
        distinguishing_aspect: "GET /berths returns array envelope with total_count and has_more after two berths created."
        test_recipe:
          setup: ["Two berths created."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-201", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-202", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
          trigger:
            - call: "GET /berths"
              payload: { limit: 1, offset: 0 }
              as: TerminalAdmin
          assert:
            - "response_type == array"
            - "meta total_count == 2"
            - "has_more == true"

      - name: get_container_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Container"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /containers/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /containers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TerminalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_container_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Container"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=5]"
        distinguishing_aspect: "POST /containers omitting container_number -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A berthed window so vessel_id/berth_window_id FKs resolve."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-210", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000010", name: "Req V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id }
          trigger:
            - call: "POST /containers"
              payload: { vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: container_default_is_reefer_false_and_pending_pending
        claim_type: Defaults
        grounds:
          - "entities.Container.fields.is_reefer"
          - "entities.Container.fields.customs_status"
          - "entities.Container.fields.handling_status"
        distinguishing_aspect: "Omitting is_reefer defaults to false; customs_status defaults PENDING and handling_status ON_VESSEL at create."
        test_recipe:
          setup: ["A berthed window."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-220", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000020", name: "Def V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id }
          trigger:
            - call: "POST /containers"
              payload: { container_number: "DEFL220220", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
          assert:
            - "Container.is_reefer == false"
            - "Container.customs_status == PENDING"
            - "Container.handling_status == ON_VESSEL"

      - name: container_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - "entities.Container.fields.handling_status"
          - "entities.Container.fields.yard_slot_id"
        distinguishing_aspect: "Client-supplied handling_status/yard_slot_id in the create body are ignored; server forces ON_VESSEL and null."
        test_recipe:
          setup: ["A berthed window."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-230", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000030", name: "Sys V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id }
          trigger:
            - call: "POST /containers"
              payload: { container_number: "SYSF230230", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
          assert:
            - "Container.handling_status == ON_VESSEL"
            - "Container.yard_slot_id == null"

      - name: vessel_invalid_imo_number_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Vessel.fields.imo_number"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /vessels with a 6-digit imo_number -> ERR_INVALID_REQUEST (422); must be exactly 7 digits."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vessels"
              payload: { imo_number: "123456", name: "Bad IMO", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: reefer_setpoint_required_when_is_reefer_true
        claim_type: Type Constraints
        grounds:
          - "entities.Container.fields.setpoint_c"
          - "entities.Container.fields.is_reefer"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "is_reefer=true with no setpoint_c -> ERR_INVALID_REQUEST (422); setpoint is conditionally required."
        test_recipe:
          setup: ["A berthed window."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-240", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000040", name: "Rfr V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id }
          trigger:
            - call: "POST /containers"
              payload: { container_number: "RFRQ240240", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}", is_reefer: true }
              as: YardPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: gate_appointment_window_not_60_min_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.GateAppointment.fields.window_end"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "window_end != window_start + 60min -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A grounded, cleared container."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-250", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000050", name: "Win V", loa_m: 280, draft_m: 13.0, free_time_days: 60 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "WINW250250", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /containers/${cont_id}/customs-clear"
              payload: { expected_container_version: "${cont_v}" }
              as: CustomsOfficer
          trigger:
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-250", window_start: "2026-03-01T10:00:00.000Z", window_end: "2026-03-01T11:30:00.000Z" }
              as: GateOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: reefer_reading_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.ReeferReading"
        distinguishing_aspect: "ReeferReading is common_fields:false (append-only): its create response carries id + created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["A reefer container under a berthed window."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-260", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000060", name: "Imm V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "IMMR260260", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}", is_reefer: true, setpoint_c: -18.0 }
              as: YardPlanner
              captures: { cont_id: $.data.id }
          trigger:
            - call: "POST /containers/${cont_id}/reefer-readings"
              payload: { recorded_at: "2026-02-01T01:00:00.000Z", temperature_c: -18.0 }
              as: ReeferTechnician
              captures: { reading_id: $.data.id }
          assert:
            - "ReeferReading.id is present"
            - "ReeferReading response has no version field"

      - name: container_fk_vessel_not_found
        claim_type: Parent Relationships
        grounds:
          - "entities.Container.fields.vessel_id"
          - "errors[ERR_FK_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /containers with a non-existent vessel_id -> ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["A berthed window (valid berth_window_id) but a bogus vessel_id."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-270", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000070", name: "FK V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id }
          trigger:
            - call: "POST /containers"
              payload: { container_number: "FKNF270270", vessel_id: "00000000-0000-4000-8000-000000000099", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_FK_NOT_FOUND"

      - name: flat_topology_yard_slot_below_fk_validated
        claim_type: flat
        grounds:
          - "entities.YardSlot.fields.below_slot_id"
          - "errors[ERR_FK_NOT_FOUND]"
        distinguishing_aspect: "Flat-topology FK integrity: POST /yard-slots with a bogus below_slot_id -> ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard-slots"
              payload: { block: "Z", bay: 1, row: 1, tier: 2, below_slot_id: "00000000-0000-4000-8000-0000000000aa" }
              as: YardPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_FK_NOT_FOUND"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: berth_window_initial_state_scheduled
        claim_type: Initial State
        grounds:
          - "state_machines.BerthWindow"
          - "entities.BerthWindow.fields.status"
        distinguishing_aspect: "A freshly created berth window starts in SCHEDULED with actual_berth_at null."
        test_recipe:
          setup: ["A berth and vessel."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-300", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000100", name: "Init V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
          trigger:
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id }
          assert:
            - "BerthWindow.status == SCHEDULED"
            - "BerthWindow.actual_berth_at == null"

      - name: depart_from_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.BerthWindow"
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=7]"
        distinguishing_aspect: "POST /berth-windows/{id}/depart on a SCHEDULED window (depart requires BERTHED) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED berth window."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-310", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000110", name: "Dep V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id }
          trigger:
            - call: "POST /berth-windows/${bw_id}/depart"
              payload: {}
              as: BerthPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: terminal_departed_window_cannot_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.BerthWindow"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A DEPARTED window (terminal) rejects cancel with ERR_INVALID_STATE (409); terminal states accept no transitions."
        test_recipe:
          setup: ["A window berthed then departed."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-320", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000120", name: "Term V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /berth-windows/${bw_id}/depart"
              payload: {}
              as: BerthPlanner
          trigger:
            - call: "POST /berth-windows/${bw_id}/cancel"
              payload: {}
              as: BerthPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: customs_release_idempotency_second_release_fails
        claim_type: Idempotency
        grounds:
          - "state_machines.Container.HELD_to_CLEARED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Releasing an already-RELEASED CustomsHold a second time -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A held container whose hold is already released once."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-330", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000130", name: "Idem V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "IDEM330330", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /customs-holds"
              payload: { container_id: "${cont_id}", reason: "INSPECTION" }
              as: CustomsOfficer
              captures: { hold_id: $.data.id }
            - call: "POST /customs-holds/${hold_id}/release"
              payload: {}
              as: CustomsOfficer
          trigger:
            - call: "POST /customs-holds/${hold_id}/release"
              payload: {}
              as: CustomsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: unberth_blocked_when_cargo_worked
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.BerthWindow.BERTHED_to_SCHEDULED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Unberthing a window whose container is already GROUNDED -> ERR_INVALID_STATE (409); cannot rewind a worked window."
        test_recipe:
          setup: ["A berthed window with one grounded container."]
          setup_api_calls:
            - call: "POST /berths"
              payload: { code: "B-340", length_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "2000140", name: "Wrk V", loa_m: 280, draft_m: 13.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "WRKD340340", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
