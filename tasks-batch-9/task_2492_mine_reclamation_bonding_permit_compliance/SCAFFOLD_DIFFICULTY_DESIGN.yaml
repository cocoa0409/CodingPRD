              as: Operator
              as_user_id: "${op13_id}"
              captures: { est13_id: $.data.id }
          trigger:
            - call: "POST /mining/permits/${permit13_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
              captures: { xe1_err: $.data.error_id }
            - call: "GET /mining/permits/${permit13_id}"
              as: PermitReviewer
              captures: { p13v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${est13_id}/accept"
              payload: { expected_permit_version: "${p13v1}" }
