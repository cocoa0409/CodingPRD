            - "ShootDay.${day1}.status == CANCELLED and ShootDay.${day2}.status == PLANNED"
            - "Project.${proj}.status is still IN_PRODUCTION-eligible: it stays SCOPED here because the budget was never approved, and one non-terminal shoot day remains"

