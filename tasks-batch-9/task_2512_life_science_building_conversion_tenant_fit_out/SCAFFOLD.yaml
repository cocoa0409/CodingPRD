  - { error_id: ERR_BUILDING_NOT_CONVERSION_APPROVED, http_status: 409, message: "The building has not been approved for lab conversion" }
  - { error_id: ERR_EXHAUST_SCOPE_INCOMPLETE, http_status: 409, message: "The building's lab exhaust conversion scope is not complete" }
  - { error_id: ERR_DUPLICATE_FLOOR_NUMBER, http_status: 409, message: "A floor with this number already exists in the building" }
  - { error_id: ERR_FLOOR_NOT_IN_PREMISES, http_status: 422, message: "The floor does not belong to the referenced building or premises" }
  - { error_id: ERR_INVALID_LEASE_STATE, http_status: 409, message: "The lease's status does not permit this operation" }
  - { error_id: ERR_INVALID_PROPOSAL_STATE, http_status: 409, message: "The proposal is no longer open" }
  - { error_id: ERR_NOT_YOUR_TURN, http_status: 409, message: "The other party holds the open negotiation round" }
  - { error_id: ERR_SELF_ACCEPT_FORBIDDEN, http_status: 403, message: "A proposal cannot be accepted by its own author or party" }
  - { error_id: ERR_PROPOSAL_EXPIRED, http_status: 409, message: "The proposal's acceptance window has elapsed" }
  - { error_id: ERR_NEGOTIATION_ROUND_LIMIT, http_status: 409, message: "The negotiation round limit has been reached" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, message: "The user who negotiated or accepted the terms may not execute the lease" }
  - { error_id: ERR_ESCROW_DEPOSIT_INSUFFICIENT, http_status: 422, message: "The restoration escrow held is below the required amount" }
  - { error_id: ERR_TI_ALLOWANCE_EXHAUSTED, http_status: 409, message: "No committed tenant improvement allowance is available to draw" }
  - { error_id: ERR_RESTORATION_ALREADY_SETTLED, http_status: 409, message: "The lease is not awaiting restoration settlement" }
  - { error_id: ERR_PHASES_NOT_QUIESCED, http_status: 409, message: "Phase packages are still scheduled, held, blocked or in progress" }
  - { error_id: ERR_INVALID_PERMIT_STATE, http_status: 409, message: "The project's permit_status does not permit this operation" }
  - { error_id: ERR_INVALID_PROJECT_STATE, http_status: 409, message: "The project's construction_status does not permit this operation" }
  - { error_id: ERR_PROJECT_NOT_PERMITTED, http_status: 409, message: "The fit-out project's construction permit has not been issued" }
  - { error_id: ERR_PREDECESSOR_NOT_IN_PROJECT, http_status: 422, message: "The predecessor phase belongs to a different project" }
  - { error_id: ERR_PREDECESSOR_NOT_COMPLETE, http_status: 409, message: "The predecessor phase is not complete" }
  - { error_id: ERR_DUPLICATE_PHASE_SEQUENCE, http_status: 409, message: "A phase with this sequence number already exists on the project" }
  - { error_id: ERR_SHUTDOWN_AMENITY_REQUIRED, http_status: 422, message: "A shutdown phase must name the affected shared amenity" }
  - { error_id: ERR_INVALID_PHASE_STATE, http_status: 409, message: "The phase's status does not permit this operation" }
  - { error_id: ERR_INVALID_WINDOW, http_status: 422, message: "window_start must be strictly before window_end" }
  - { error_id: ERR_VIBRATION_WINDOW_CONFLICT, http_status: 409, message: "The window conflicts with vibration-generating work on the same floor" }
