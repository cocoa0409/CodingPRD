  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_reservation_windows_allow_adjacency_and_capacity_preempts_only_arbitrage
        grounds:
          - calculations.soc_reservation_availability
          - entities.SocReservation.fields.window_start
          - entities.SocReservation.fields.priority_rank
          - state_machines.SocReservation.HELD_to_RELEASED
          - endpoints[POST /soc-reservations]
        distinguishing_aspect: |
          Resource: the StorageAsset's dispatchable energy envelope. Interval semantics: HALF-OPEN
          [window_start, window_end), so a reservation starting exactly when another ends does NOT
          overlap and both may hold 40.0 MWh each against a 70.0 MWh envelope. A window that
          straddles the seam by one minute sees BOTH holdings and is refused, and a CAPACITY
          request preempts only the overlapping ENERGY_ARBITRAGE holding while the adjacent
          ANCILLARY one is untouched.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered and commissioned, envelope 70.0 MWh (usable 80.0 minus floor 10.0)"
            - "R1 ENERGY_ARBITRAGE 40.0 MWh, window 2026-08-10T00:00:00Z .. 04:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T04:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id, r1_rank: $.data.priority_rank }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 40.0, window_start: "2026-08-10T04:00:00Z", window_end: "2026-08-10T08:00:00Z", expected_asset_version: "${v2}" }
              as: MarketTrader
              captures: { r2: $.data.id, r2_status: $.data.status, r2_rank: $.data.priority_rank }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v3: $.data.version, reserved_after_two: $.data.reserved_mwh_total, free_after_two: $.data.free_dispatchable_mwh }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 5.0, window_start: "2026-08-10T03:59:00Z", window_end: "2026-08-10T04:01:00Z", expected_asset_version: "${v3}" }
              as: MarketTrader
              captures: { err_straddle: $.data.error_id }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "CAPACITY", reserved_mwh: 40.0, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T04:00:00Z", expected_asset_version: "${v3}" }
              as: MarketTrader
              captures: { r4: $.data.id, r4_status: $.data.status, r4_rank: $.data.priority_rank }
            - call: "GET /soc-reservations/${r1}"
              payload: {}
              as: MarketTrader
              captures: { r1_status_after: $.data.status, r1_reason_after: $.data.released_reason }
            - call: "GET /soc-reservations/${r2}"
              payload: {}
              as: MarketTrader
              captures: { r2_status_after: $.data.status }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { reserved_final: $.data.reserved_mwh_total, free_final: $.data.free_dispatchable_mwh }
          assert:
            - "adjacency is NOT overlap under half-open semantics: ${r2_status} == HELD even though 40.0 + 40.0 == 80.0 exceeds the 70.0 MWh envelope, because reserved_overlap_mwh for [04:00, 08:00) is 0.0"
            - "${reserved_after_two} == 80.0 and ${free_after_two} == 0.0 == max(0, round(80.0 - 10.0 - 80.0, 3)) — the aggregate ledger is windowless and floors at zero"
            - "one minute of straddle sees both holdings: ${err_straddle} == ERR_SOC_INSUFFICIENT with HTTP 422, because [03:59, 04:01) overlaps R1 (03:59 < 04:00) and R2 (04:01 > 04:00) for a reserved_overlap_mwh of 80.0"
            - "the preemption ladder is purpose-scoped: ${r4_status} == HELD, ${r1_status_after} == RELEASED with ${r1_reason_after} == CAPACITY_PREEMPTION, and ${r2_status_after} == HELD — the ANCILLARY holding is never a candidate"
            - "priority ranks: ${r1_rank} == 1, ${r2_rank} == 2, ${r4_rank} == 3"
            - "${reserved_final} == 80.0 and ${free_final} == 0.0 — R4's 40.0 MWh exactly replaces the preempted R1"

      - name: remedy_outage_window_is_closed_inclusive_with_trailing_buffer_against_capacity_tests
        grounds:
          - validations[priority=22]
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - calculations.soh_degradation_model
          - errors[ERR_REMEDY_OUTAGE_CONFLICT]
          - endpoints[POST /capacity-tests]
        distinguishing_aspect: |
          A different resource (the augmentation outage of the plant itself, owned by a
          WarrantyClaim) with the opposite interval semantics: the outage is the CLOSED INCLUSIVE
          interval [remedy_install_date, remedy_install_date + remedy_outage_days +
          REMEDY_OUTAGE_BUFFER_DAYS], single-occupancy against CapacityTest scheduling. With
          install 2026-09-01 and 3 outage days the blocked span runs through 2026-09-06 inclusive
          and clears on 2026-09-07.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A3 registered and commissioned with initial_cumulative_throughput_mwh 19.8"
            - "CapacityTest T1 scheduled 2026-08-01, started and completed at 90.0 MWh -> deficit 2.10, warranty_claim_triggered true"
            - "WarrantyClaim W1 filed by am_filer, submitted by am_reviewer, then APPROVED with remedy_install_date 2026-09-01 and remedy_outage_days 3, so the outage window is [2026-09-01, 2026-09-06] inclusive"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 3", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, initial_cumulative_throughput_mwh: 19.8, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a3: $.data.id }
            - call: "POST /storage-assets/${a3}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a3}", scheduled_date: "2026-08-01T00:00:00Z" }
              as: AssetManager
              captures: { t1: $.data.id }
            - call: "POST /capacity-tests/${t1}/start"
              payload: {}
              as: SiteController
              as_user_id: "${a3}"
            - call: "POST /capacity-tests/${t1}/complete"
              payload: { measured_capacity_mwh: 90.0 }
              as: SiteController
              as_user_id: "${a3}"
              captures: { t1_trigger: $.data.warranty_claim_triggered }
            - call: "POST /warranty-claims"
              payload: { asset_id: "${a3}", capacity_test_id: "${t1}", claim_type: "CAPACITY_SHORTFALL" }
              as: AssetManager
              as_user_id: "am_filer"
              captures: { w1: $.data.id }
            - call: "POST /warranty-claims/${w1}/submit"
              payload: {}
              as: AssetManager
              as_user_id: "am_reviewer"
            - call: "POST /warranty-claims/${w1}/adjudicate"
              payload: { decision: "APPROVE", remedy_install_date: "2026-09-01T00:00:00Z", remedy_outage_days: 3 }
              as: PlatformAdmin
              as_user_id: "provider_adjudicator"
              captures: { w1_status: $.data.status, w1_install: $.data.remedy_install_date, w1_days: $.data.remedy_outage_days }
          trigger:
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a3}", scheduled_date: "2026-09-01T00:00:00Z" }
              as: AssetManager
              captures: { err_start_edge: $.data.error_id }
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a3}", scheduled_date: "2026-09-06T00:00:00Z" }
              as: AssetManager
              captures: { err_buffer_edge: $.data.error_id }
            - call: "POST /capacity-tests"
              payload: { asset_id: "${a3}", scheduled_date: "2026-09-07T00:00:00Z" }
              as: AssetManager
              captures: { t_clear: $.data.id, t_clear_status: $.data.status, t_clear_date: $.data.scheduled_date }
          assert:
            - "the outage exists: ${t1_trigger} == true, ${w1_status} == APPROVED, ${w1_install} == 2026-09-01T00:00:00Z, ${w1_days} == 3"
            - "the opening instant is blocked: ${err_start_edge} == ERR_REMEDY_OUTAGE_CONFLICT with HTTP 409"
            - "the trailing buffer's last day is blocked too: ${err_buffer_edge} == ERR_REMEDY_OUTAGE_CONFLICT — 2026-09-01 + 3 days + REMEDY_OUTAGE_BUFFER_DAYS 2 lands on 2026-09-06 and the interval is closed inclusive"
            - "one day past the buffer is free: ${t_clear_status} == SCHEDULED with ${t_clear_date} == 2026-09-07T00:00:00Z"
            - "GET /capacity-tests?asset_id=${a3} returns total_count 2 — the two rejected schedulings created nothing"

  - rule_id: compensating_invariant
    instances:
      - name: reservation_pool_conservation_across_release
        grounds:
          - calculations.soc_reservation_availability
          - entities.StorageAsset.fields.reserved_mwh_total
          - entities.StorageAsset.fields.free_dispatchable_mwh
          - state_machines.SocReservation.HELD_to_RELEASED
          - endpoints[POST /soc-reservations/{id}/release]
        distinguishing_aspect: |
          Conserved quantity: the asset's reservation pool, reserved_mwh_total +
          free_dispatchable_mwh == 70.0 at every observation point. Two holds take the pool to
          70.0 / 0.0; releasing them one at a time must walk it back through 30.0 / 40.0 and land
          on exactly 0.0 / 70.0 — the original figure to the last decimal, with no drift from the
          intermediate recomputes.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered and commissioned, pool 0.0 reserved / 70.0 free"
            - "SocReservation R1 ENERGY_ARBITRAGE 40.0 MWh and R2 ANCILLARY 30.0 MWh, both for window 2026-08-10T12:00:00Z .. 20:00:00Z, both HELD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version, reserved0: $.data.reserved_mwh_total, free0: $.data.free_dispatchable_mwh }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v2: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 30.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v2}" }
              as: MarketTrader
              captures: { r2: $.data.id }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { reserved_held: $.data.reserved_mwh_total, free_held: $.data.free_dispatchable_mwh }
          trigger:
            - call: "POST /soc-reservations/${r1}/release"
              payload: {}
              as: MarketTrader
              captures: { r1_status: $.data.status, r1_reason: $.data.released_reason }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { reserved_mid: $.data.reserved_mwh_total, free_mid: $.data.free_dispatchable_mwh }
            - call: "POST /soc-reservations/${r2}/release"
              payload: {}
              as: MarketTrader
              captures: { r2_status: $.data.status, r2_reason: $.data.released_reason }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { reserved_end: $.data.reserved_mwh_total, free_end: $.data.free_dispatchable_mwh }
          assert:
            - "before: ${reserved0} == 0.0 and ${free0} == 70.0, so the conserved pool is 70.0"
            - "fully held: ${reserved_held} == 70.0 and ${free_held} == 0.0 — sum still 70.0"
            - "after the first release: ${r1_status} == RELEASED with ${r1_reason} == OPERATOR_RELEASE, ${reserved_mid} == 30.0 and ${free_mid} == 40.0 — sum still 70.0"
            - "after the second release: ${r2_status} == RELEASED with ${r2_reason} == OPERATOR_RELEASE, ${reserved_end} == 0.0 and ${free_end} == 70.0 — byte-identical to the pre-reservation figure, no drift"
            - "GET /soc-reservations?asset_id=${a1}&status=HELD returns total_count 0 while GET /soc-reservations?asset_id=${a1} still returns total_count 2 — release is a state change, not a delete"

      - name: throughput_and_soc_conservation_across_dispatch_compensation
        grounds:
          - calculations.throughput_and_soc_ledger
          - state_machines.DispatchInstruction.COMPLETED_to_FAILED
          - state_machines.DispatchInstruction.scoring_status.PROVISIONAL_to_NOT_SCORED
          - state_machines.SocReservation.CONSUMED_to_RELEASED
          - endpoints[POST /dispatch-instructions/{id}/fail]
        distinguishing_aspect: |
          A different conserved quantity on a different compensation path: the energy ledger
          soc_mwh and cumulative_throughput_mwh. Completion moves soc 80.0 -> 60.2 and throughput
          0.0 -> 19.8; the compensating COMPLETED -> FAILED transition must restore exactly 80.0
          and 0.0 by replaying the stored signed soc_delta_mwh, void the scores, and return the
          reservation from CONSUMED to RELEASED — the same undo the reservation-pool instance does
          for a different quantity.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 registered and commissioned: soc 80.0, cumulative_throughput 0.0, available 100.0, efc 0.0"
            - "SocReservation R1 ENERGY_ARBITRAGE 40.0 MWh, window 2026-08-10T12:00:00Z .. 20:00:00Z"
            - "MarketBid B1 DAY_AHEAD ENERGY DISCHARGE 20.0 MW, delivery 12:00:00Z .. 16:00:00Z, CLEARED at 45.00 for 20.0 MW"
            - "DispatchInstruction D1 20.0 MW, setpoint 14:00:00Z .. 15:00:00Z, EXECUTING, four samples 19.6/20.4/19.2/20.0 MW, then COMPLETED so scoring_status is PROVISIONAL"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id, soc0: $.data.soc_mwh, cum0: $.data.cumulative_throughput_mwh, efc0: $.data.equivalent_full_cycles_ytd }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 20.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 19.6, measured_mvar: 0.0, soc_mwh_reading: 75.1, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T14:30:00Z", measured_mw: 20.4, measured_mvar: 0.0, soc_mwh_reading: 70.0, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 3, sampled_at: "2026-08-10T14:45:00Z", measured_mw: 19.2, measured_mvar: 0.0, soc_mwh_reading: 65.2, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 4, sampled_at: "2026-08-10T15:00:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 60.2, max_cell_temp_c: 30.0 }
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /dispatch-instructions/${d1}/complete"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
              captures: { d1_delivered: $.data.delivered_mwh, d1_delta: $.data.soc_delta_mwh, d1_composite: $.data.composite_score, d1_scoring: $.data.scoring_status }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { soc_mid: $.data.soc_mwh, cum_mid: $.data.cumulative_throughput_mwh, efc_mid: $.data.equivalent_full_cycles_ytd }
            - call: "GET /soc-reservations/${r1}"
              payload: {}
              as: MarketTrader
              captures: { r1_status_mid: $.data.status, r1_consumed_mid: $.data.consumed_mwh }
          trigger:
            - call: "POST /dispatch-instructions/${d1}/fail"
              payload: { failure_reason: "DELIVERY_VOIDED" }
              as: ControlRoomOperator
              captures: { d1_exec_after: $.data.execution_status, d1_reason_after: $.data.failure_reason, d1_delivered_after: $.data.delivered_mwh, d1_delta_after: $.data.soc_delta_mwh, d1_composite_after: $.data.composite_score, d1_accuracy_after: $.data.accuracy_score, d1_charge_after: $.data.non_performance_charge_usd, d1_scoring_after: $.data.scoring_status }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { soc_end: $.data.soc_mwh, cum_end: $.data.cumulative_throughput_mwh, efc_end: $.data.equivalent_full_cycles_ytd, reserved_end: $.data.reserved_mwh_total, free_end: $.data.free_dispatchable_mwh }
            - call: "GET /soc-reservations/${r1}"
              payload: {}
              as: MarketTrader
              captures: { r1_status_after: $.data.status, r1_consumed_after: $.data.consumed_mwh, r1_reason_after: $.data.released_reason }
          assert:
            - "before: ${soc0} == 80.0, ${cum0} == 0.0, ${efc0} == 0.0"
            - "forward ledger: ${d1_delivered} == 19.8 == round((19.6 + 20.4 + 19.2 + 20.0) * 0.25, 3), ${d1_delta} == -19.8, ${soc_mid} == 60.2, ${cum_mid} == 19.8, ${efc_mid} == 0.099 == round(19.8 / (2 * 100.0), 4), ${d1_scoring} == PROVISIONAL with ${d1_composite} == 91.10"
            - "forward reservation: ${r1_status_mid} == CONSUMED with ${r1_consumed_mid} == 19.8"
            - "compensation restores the conserved quantities exactly: ${soc_end} == 80.0 and ${cum_end} == 0.0 and ${efc_end} == 0.0 — replaying the stored ${d1_delta} guarantees the restoration even though 19.8 was rounded"
            - "compensation voids the instruction: ${d1_exec_after} == FAILED, ${d1_reason_after} == DELIVERY_VOIDED, ${d1_delivered_after} == 0.0, ${d1_delta_after} == 0.0, ${d1_accuracy_after} == null, ${d1_composite_after} == null, ${d1_charge_after} == 0.0, ${d1_scoring_after} == NOT_SCORED"
            - "compensation returns the reservation: ${r1_status_after} == RELEASED with ${r1_consumed_after} == 0.0 and ${r1_reason_after} == DISPATCH_COMPENSATION, so ${reserved_end} == 0.0 and ${free_end} == 70.0"
            - "the invariant of calculations.throughput_and_soc_ledger holds at both observation points: cumulative_throughput_mwh equals initial 0.0 plus the delivered energy of COMPLETED instructions only"
