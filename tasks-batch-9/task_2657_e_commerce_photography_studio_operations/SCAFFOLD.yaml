scenario: |
  Generate task harder than expert level!

  2657. E-Commerce Photography Studio Operations (retailer content studio): sample intake, tracking and return with style number matching and vendor coordination, shoot scheduling across model, mannequin and still-life stations with capacity planning, shot list definition by category with required angles, detail shots and video assets, model, stylist and photographer booking with usage rights and release documentation, post-production retouching queue with quality standards and turnaround service levels, asset naming, metadata tagging and delivery into the content management system, on-model color accuracy and consistency controls across sessions, cost per style tracking and outsourced studio comparison

domain_name: ecommerce-photo-studio-ops
api_prefix: "/studio"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Peer entities linked by foreign keys with many-to-many junctions
  # (TalentBooking joins ShootSession x TalentProfile; ShotListItem joins Style x
  # ShootSession) plus one self-referential edge (Style.base_style_id -> Style.id
  # for colorway variants). No URL nesting: every resource is addressed flatly and
  # discovered through FK-filtered list endpoints.

  state_machine_shape: parallel
  # Sample carries two independent state axes (custody_state x match_state) that
  # advance without each other; RetouchTask is cyclic
  # (SUBMITTED -> REWORK -> SUBMITTED); ShootSession is branching-with-revert
  # (LOCKED -> BOOKED unlock plus a CANCELLED fork); Style.content_state is
  # compound (derived from Sample / ShotListItem / Asset children).

  relationship_patterns:
    - one_to_many          # Vendor -> Sample, Style -> ShotListItem, Asset -> RetouchTask
    - many_to_many         # TalentBooking (Session x Talent), ShotListItem (Style x Session)
    - self_referential     # Style.base_style_id -> Style.id (colorway parent, depth 1 only)
    - cross_aggregate      # Asset ingest reads Station calibration; lock reads Sample custody

  role_model: segregation_of_duties
  # Seven roles own disjoint slices of the pipeline. Two hard segregation gates:
  # (1) the QCReviewer approving a RetouchTask MUST NOT be the retoucher assigned
  # to it; (2) only the Photographer holding a CONFIRMED PHOTOGRAPHER booking on a
  # session may start / wrap / measure color / ingest assets for it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

constants_global:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  OVERTIME_MULTIPLIER: 1.5
  MAX_REWORK: 2
  RUSH_SLA_FACTOR: 0.5
  COLOR_CONSISTENCY_DRIFT_MAX: 0.75
  VENDOR_HOLD_STRIKES: 3
  AT_RISK_SLA_FRACTION: 0.8

entities:
  - name: Vendor
    parent: null
    common_fields: true
    description: "Merchandise vendor that ships physical samples to the content studio."
    fields:
      - name: name
        type: string
        source: input
        description: "Vendor legal name."
        constraints: "1..120 chars, non-empty after trim"
      - name: vendor_code
        type: string
        source: input
        description: "Short operator-facing code."
        constraints: "unique across Vendor; uppercase A-Z0-9, 2..12 chars"
      - name: sample_sla_days
        type: integer
        source: input
        default: 14
        description: "Days after receipt by which a sample must be returned to this vendor."
        constraints: ">= 1 and <= 120"
      - name: contact_email
        type: string
        source: input
        default: null
        description: "Coordination mailbox for sample chase-ups."
      - name: outstanding_sample_count
        type: integer
        source: computed
        default: 0
        description: "Count of this vendor's Samples currently held by the studio (see calculations.custody_ledger_counters)."
      - name: late_return_count
        type: integer
        source: computed
        default: 0
        description: "Strike counter: +1 on each Sample returned after due_return_at and +1 on each Sample reported lost."
      - name: coordination_hold
        type: boolean
        source: computed
        default: false
        description: "true once late_return_count >= VENDOR_HOLD_STRIKES (3); blocks further sample receipts."

  - name: AssetProfile
    parent: null
    common_fields: false
    description: "Immutable per-category content requirement template: which angles, detail shots, on-model shots and video a style of that category owes, plus the file naming pattern and metadata contract."
    fields:
      - name: category
        type: enum
        source: input
        description: "Merchandise category this profile governs."
        constraints: "one of APPAREL_TOP, APPAREL_BOTTOM, FOOTWEAR, ACCESSORY, HOME; unique across AssetProfile"
      - name: required_angles
        type: array
        source: input
        description: "Angle codes that must exist as required ShotListItems for a style of this category."
        constraints: "non-empty array; each element one of FRONT, BACK, SIDE, FLAT, DETAIL, VIDEO_360"
      - name: required_detail_shots
        type: integer
        source: input
        description: "Minimum count of DETAIL asset_kind items expected for the category."
        constraints: ">= 0"
      - name: min_on_model_shots
        type: integer
        source: input
        description: "Minimum count of ON_MODEL asset_kind items expected for the category."
        constraints: ">= 0"
      - name: video_required
        type: boolean
        source: input
        description: "Whether a VIDEO asset_kind item is expected for the category."
      - name: naming_pattern
        type: string
        source: input
        description: "Asset file-name template. Expansion is exactly {style_number}_{angle_code}_{seq} where {seq} is sequence_number zero-padded to 3 digits."
        constraints: "must contain the tokens {style_number}, {angle_code} and {seq}"
      - name: required_metadata_keys
        type: array
        source: input
        description: "Metadata keys every ingested Asset of this category must carry with a non-empty string value."
        constraints: "non-empty array of strings"

  - name: StudioProvider
    parent: null
    common_fields: true
    description: "A production source: the in-house studio or an outsourced studio/retouch house. Supplies the hourly station rate used for session costing, the retouch SLA, and the per-style quote used for outsourced comparison."
    fields:
      - name: provider_code
        type: string
        source: input
        description: "Operator-facing code."
        constraints: "unique across StudioProvider; uppercase A-Z0-9, 2..12 chars"
      - name: provider_kind
        type: enum
        source: input
        description: "Production source kind."
        constraints: "one of IN_HOUSE, OUTSOURCED"
      - name: station_hour_rate_cents
        type: integer
        source: input
        description: "Fully-loaded studio floor rate per hour, used by calculations.session_cost_allocation."
        constraints: ">= 0"
      - name: retouch_rate_cents_per_asset
        type: integer
        source: input
        description: "Flat retouch price per asset charged by this provider."
        constraints: ">= 0"
      - name: sla_hours
        type: integer
        source: input
        description: "Base post-production turnaround service level in hours."
        constraints: ">= 1"
      - name: quality_score
        type: number
        source: input
        description: "Audited retouch quality score, 0..100; second sort key of the outsourced-provider selector."
        constraints: ">= 0 and <= 100, two decimals"
      - name: style_quote_cents
        type: integer
        source: input
        default: 0
        description: "All-in quote per style for an OUTSOURCED provider; MUST be 0 when provider_kind == IN_HOUSE."
        constraints: ">= 0"
      - name: capacity_assets_per_day
        type: integer
        source: input
        default: 40
        description: "Daily retouch throughput ceiling; providers at or above this count are excluded from claim-next eligibility."
        constraints: ">= 1"
      - name: assigned_asset_count
        type: integer
        source: computed
        default: 0
        description: "Count of this provider's RetouchTasks in task_state IN {QUEUED, IN_PROGRESS, SUBMITTED, REWORK}."

  - name: Station
    parent: null
    common_fields: true
    description: "A physical capture position. Its geometry of occupation differs by type: MODEL and MANNEQUIN stations are exclusive with a teardown buffer, STILL_LIFE stations admit max_concurrent_sessions simultaneous tabletop setups."
    fields:
      - name: station_code
        type: string
        source: input
        description: "Operator-facing code."
        constraints: "unique across Station; uppercase A-Z0-9 and '-', 2..16 chars"
      - name: station_type
        type: enum
        source: input
        description: "Capture position type; gates which asset_kind may be assigned and which color weighting applies."
        constraints: "one of MODEL, MANNEQUIN, STILL_LIFE"
      - name: daily_capacity_minutes
        type: integer
        source: input
        description: "Bookable minutes per UTC calendar day on this station."
        constraints: ">= 1 and <= 1440"
      - name: buffer_minutes
        type: integer
        source: input
        default: 0
        description: "Mandatory teardown gap enforced AFTER each session's scheduled_end on this station."
        constraints: ">= 0 and <= 240"
      - name: max_concurrent_sessions
        type: integer
        source: input
        default: 1
        description: "How many sessions may occupy overlapping intervals on this station."
        constraints: ">= 1 and <= 8"
      - name: calibrated_until
        type: datetime
        source: input
        default: null
        description: "Instant at which the station's color calibration lapses; null means never calibrated."
      - name: committed_minutes_today
        type: integer
        source: computed
        default: 0
        description: "Sum of planned_minutes of this station's sessions dated on the current logical clock's UTC date (see calculations.capacity_ledger_counters)."

  - name: TalentProfile
    parent: null
    common_fields: true
    description: "A bookable person: model, stylist, photographer or retoucher. Photographer and Retoucher roles authenticate as this entity."
    fields:
      - name: full_name
        type: string
        source: input
        description: "Display name."
        constraints: "1..120 chars"
      - name: talent_type
        type: enum
        source: input
        description: "What this person does on or off set."
        constraints: "one of MODEL, STYLIST, PHOTOGRAPHER, RETOUCHER"
      - name: agency_name
        type: string
        source: input
        default: null
        description: "Booking agency, null for freelancers."
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Regular hourly rate in cents."
        constraints: ">= 0"
      - name: day_rate_cents
        type: integer
        source: input
        description: "Standard-day cap in cents; see calculations.talent_booking_charge for the pinned cap semantics."
        constraints: ">= 0"
      - name: minimum_call_hours
        type: integer
        source: input
        default: 4
        description: "Minimum billable hours per booking regardless of actual window length."
        constraints: ">= 0 and <= 12"
      - name: max_daily_minutes
        type: integer
        source: input
        default: 480
        description: "Minutes per calendar date billable at the regular rate; beyond this, OVERTIME_MULTIPLIER applies."
        constraints: ">= 60 and <= 1440"
      - name: booked_minutes_today
        type: integer
        source: computed
        default: 0
        description: "Sum of booked_minutes over this talent's bookings in booking_state IN {HELD, CONFIRMED} whose call_time falls on the current logical clock's UTC date."
      - name: requires_release
        type: boolean
        source: computed
        description: "true exactly when talent_type == MODEL; drives the release-documentation gate at booking confirmation."

  - name: Style
    parent: null
    common_fields: true
    description: "A merchandise style (or a colorway of one) that owes e-commerce content. content_state is a compound state derived from its Samples, ShotListItems and Assets."
    fields:
      - name: style_number
        type: string
        source: input
        description: "Retailer style number used for physical sample matching."
        constraints: "unique across Style; uppercase A-Z0-9, 4..16 chars"
      - name: category
        type: enum
        source: input
        description: "Merchandise category; must equal the referenced AssetProfile.category."
        constraints: "one of APPAREL_TOP, APPAREL_BOTTOM, FOOTWEAR, ACCESSORY, HOME"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor that supplies samples of this style."
      - name: asset_profile_id
        type: string
        source: input
        description: "FK -> AssetProfile.id; the content requirement template applied to this style."
      - name: base_style_id
        type: string
        source: input
        default: null
        description: "FK -> Style.id; self-referential colorway parent. null for a base style. The referenced Style MUST itself have base_style_id == null (depth 1 only)."
      - name: colorway_code
        type: string
        source: input
        default: null
        description: "Colorway suffix; MUST be present exactly when base_style_id is present."
        constraints: "uppercase A-Z0-9, 2..8 chars; unique per (base_style_id, colorway_code)"
      - name: priority_tier
        type: enum
        source: input
        default: "C"
        description: "Merchandising priority; A styles get a rushed retouch SLA and the top priority weight."
        constraints: "one of A, B, C"
      - name: content_state
        type: enum
        source: system
        default: "NOT_STARTED"
        description: "Compound content lifecycle state; see state_machines[entity=Style]."
        constraints: "one of NOT_STARTED, SAMPLE_READY, SCHEDULED, SHOT, IN_POST, DELIVERED, BLOCKED"
      - name: required_item_count
        type: integer
        source: computed
        default: 0
        description: "Count of this style's ShotListItems with required == true and item_state != WAIVED."
      - name: allocated_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Persisted in-house cost ledger: running sum of per-item allocations posted by calculations.session_cost_allocation at each session wrap."
      - name: delivered_asset_count
        type: integer
        source: computed
        default: 0
        description: "Count of this style's Assets in asset_state == DELIVERED."

  - name: Sample
    parent: null
    common_fields: true
    description: "A physical garment/product sample in studio custody. Two independent state axes: custody_state (where the box is) and match_state (whether it has been reconciled to a style number)."
    fields:
      - name: barcode
        type: string
        source: input
        description: "Studio intake barcode."
        constraints: "unique across Sample; uppercase A-Z0-9 and '-', 4..24 chars"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the shipping vendor."
      - name: declared_style_number
        type: string
        source: input
        description: "Style number printed on the vendor's packing slip; compared against Style.style_number at match time."
        constraints: "uppercase A-Z0-9, 4..16 chars"
      - name: matched_style_id
        type: string
        source: computed
        default: null
        description: "FK -> Style.id; set by the match action, null while match_state != MATCHED."
      - name: custody_state
        type: enum
        source: system
        default: "EXPECTED"
        description: "Physical custody axis; see state_machines[entity=Sample, state_field=custody_state]."
        constraints: "one of EXPECTED, RECEIVED, IN_STUDIO, ON_SET, RETURN_PENDING, RETURNED, LOST"
      - name: match_state
        type: enum
        source: system
        default: "UNMATCHED"
        description: "Style-number reconciliation axis; see state_machines[entity=Sample, state_field=match_state]."
        constraints: "one of UNMATCHED, MATCHED, MISMATCH_HOLD"
      - name: received_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the receive action."
      - name: due_return_at
        type: datetime
        source: computed
        default: null
        description: "received_at + Vendor.sample_sla_days days; see calculations.sample_return_lateness."
      - name: returned_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the return action."
      - name: return_days_late
        type: integer
        source: computed
        default: 0
        description: "Whole days late at return; 0 when returned at or before due_return_at."
      - name: condition_note
        type: string
        source: input
        default: null
        description: "Free-text condition remark captured at return."

  - name: ReleaseDocument
    parent: null
    common_fields: true
    description: "Signed usage-rights release for a talent. Its scope and validity window gate booking confirmation."
    fields:
      - name: talent_id
        type: string
        source: input
        description: "FK -> TalentProfile.id; the person granting rights."
      - name: scope
        type: enum
        source: input
        description: "Granted usage breadth. Ordered ECOM_ONLY < ECOM_PLUS_SOCIAL < FULL_BUYOUT; a release covers a session when its scope rank >= the session's required_usage_scope rank."
        constraints: "one of ECOM_ONLY, ECOM_PLUS_SOCIAL, FULL_BUYOUT"
      - name: territory
        type: enum
        source: input
        description: "Territorial grant."
        constraints: "one of US, GLOBAL"
      - name: valid_from
        type: datetime
        source: input
        description: "Inclusive start of the grant window."
      - name: valid_until
        type: datetime
        source: input
        description: "Exclusive end of the grant window; MUST be strictly after valid_from."
      - name: doc_state
        type: enum
        source: system
        default: "PENDING"
        description: "Signature lifecycle; see state_machines[entity=ReleaseDocument]."
        constraints: "one of PENDING, SIGNED, EXPIRED"
      - name: signed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the sign action."

  - name: ShootSession
    parent: null
    common_fields: true
    description: "A booked interval of occupation on one Station, produced by one StudioProvider. Carries the on-set color-accuracy control for the session."
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the occupied capture position."
      - name: provider_id
        type: string
        source: input
        description: "FK -> StudioProvider.id; who runs the floor (supplies station_hour_rate_cents)."
      - name: session_label
        type: string
        source: input
        default: null
        description: "Human label for the call sheet."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Inclusive start of the occupied interval."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Exclusive end of the occupied interval; MUST be strictly after scheduled_start and on the same UTC date."
      - name: planned_minutes
        type: integer
        source: computed
        description: "Whole minutes of (scheduled_end - scheduled_start)."
      - name: required_usage_scope
        type: enum
        source: input
        description: "Minimum usage-rights breadth every MODEL booked on this session must hold."
        constraints: "one of ECOM_ONLY, ECOM_PLUS_SOCIAL, FULL_BUYOUT"
      - name: budget_cap_cents
        type: integer
        source: input
        description: "Ceiling on committed_talent_cost_cents, enforced at booking confirmation."
        constraints: ">= 0"
      - name: session_state
        type: enum
        source: system
        default: "BOOKED"
        description: "Session lifecycle; see state_machines[entity=ShootSession]."
        constraints: "one of BOOKED, LOCKED, SHOOTING, WRAPPED, CANCELLED"
      - name: committed_talent_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of charge_cents over this session's bookings in booking_state IN {CONFIRMED, RELEASED}."
      - name: started_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the start action."
      - name: wrapped_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the wrap action."
      - name: actual_minutes
        type: integer
        source: computed
        default: null
        description: "Whole minutes of (wrapped_at - started_at); null until wrap."
      - name: color_chart_code
        type: string
        source: input
        default: "XRITE_CC24"
        description: "Reference chart used for the on-set color check."
      - name: color_tolerance_delta_e
        type: number
        source: input
        default: 2.00
        description: "Maximum acceptable composite delta-E for this session (inclusive)."
        constraints: ">= 0.10 and <= 10.00, two decimals"
      - name: color_patch_deltas
        type: array
        source: computed
        default: []
        description: "Per-patch delta-E readings submitted by the photographer."
      - name: color_composite_delta_e
        type: number
        source: computed
        default: null
        description: "Weighted composite reading; see calculations.color_composite_delta_e."
      - name: color_check_state
        type: enum
        source: computed
        default: "NOT_MEASURED"
        description: "Outcome of the on-set color check; FAIL blocks asset ingest."
        constraints: "one of NOT_MEASURED, PASS, FAIL"
      - name: color_measured_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the color measurement."
      - name: color_measured_by_talent_id
        type: string
        source: computed
        default: null
        description: "FK -> TalentProfile.id; the photographer who submitted the measurement."

  - name: TalentBooking
    parent: null
    common_fields: true
    description: "Junction between a ShootSession and a TalentProfile for one on-set role, carrying the charge, the overtime split and the usage-rights provenance."
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ShootSession.id; the session being crewed."
      - name: talent_id
        type: string
        source: input
        description: "FK -> TalentProfile.id; the booked person."
      - name: role_on_set
        type: enum
        source: input
        description: "On-set role; MUST equal the talent's talent_type."
        constraints: "one of MODEL, STYLIST, PHOTOGRAPHER"
      - name: call_time
        type: datetime
        source: input
        description: "Inclusive start of the talent's occupied interval; MUST be >= session.scheduled_start."
      - name: wrap_time
        type: datetime
        source: input
        description: "Exclusive end of the talent's occupied interval; MUST be > call_time and <= session.scheduled_end."
      - name: booked_minutes
        type: integer
        source: computed
        description: "Whole minutes of (wrap_time - call_time)."
      - name: regular_minutes
        type: integer
        source: computed
        default: 0
        description: "Billable minutes charged at the regular rate; see calculations.talent_booking_charge."
      - name: overtime_minutes
        type: integer
        source: computed
        default: 0
        description: "Billable minutes charged at OVERTIME_MULTIPLIER."
      - name: charge_cents
        type: integer
        source: computed
        default: 0
        description: "Total booking charge in cents; see calculations.talent_booking_charge."
      - name: booking_state
        type: enum
        source: system
        default: "HELD"
        description: "Booking lifecycle; see state_machines[entity=TalentBooking]."
        constraints: "one of HELD, CONFIRMED, RELEASED, CANCELLED"
      - name: usage_rights_scope
        type: enum
        source: computed
        default: null
        description: "Scope copied from the covering ReleaseDocument at confirmation; null for non-MODEL roles."
        constraints: "one of ECOM_ONLY, ECOM_PLUS_SOCIAL, FULL_BUYOUT, or null"
      - name: release_document_id
        type: string
        source: computed
        default: null
        description: "FK -> ReleaseDocument.id; the release pinned at confirmation, null for non-MODEL roles."

  - name: ShotListItem
    parent: null
    common_fields: true
    description: "One required or optional shot a Style owes, optionally assigned to a session. Junction between Style and ShootSession, and the unit of cost allocation."
    fields:
      - name: style_id
        type: string
        source: input
        description: "FK -> Style.id; the style being shot."
      - name: session_id
        type: string
        source: computed
        default: null
        description: "FK -> ShootSession.id; set by the assign action, cleared when the session is cancelled."
      - name: asset_kind
        type: enum
        source: input
        description: "What kind of capture this item is."
        constraints: "one of STILL_ANGLE, DETAIL, ON_MODEL, VIDEO"
      - name: angle_code
        type: enum
        source: input
        description: "Camera angle / framing code."
        constraints: "one of FRONT, BACK, SIDE, FLAT, DETAIL, VIDEO_360"
      - name: required
        type: boolean
        source: input
        default: true
        description: "Whether the style's content is incomplete without this item."
      - name: estimated_minutes
        type: integer
        source: input
        description: "Planning estimate used for shoot-day capacity planning."
        constraints: ">= 1 and <= 480"
      - name: item_state
        type: enum
        source: system
        default: "PLANNED"
        description: "Item lifecycle; see state_machines[entity=ShotListItem]."
        constraints: "one of PLANNED, ASSIGNED, CAPTURED, BLOCKED, WAIVED"
      - name: live_asset_count
        type: integer
        source: computed
        default: 0
        description: "Count of this item's Assets in asset_state != REJECTED."
      - name: allocated_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Per-item share of wrapped session cost posted by calculations.session_cost_allocation."

  - name: Asset
    parent: null
    common_fields: true
    description: "A captured digital asset: file name, metadata tags, retouch/QC state and CMS delivery key."
    fields:
      - name: shot_list_item_id
        type: string
        source: input
        description: "FK -> ShotListItem.id; the shot this file satisfies."
      - name: session_id
        type: string
        source: computed
        description: "FK -> ShootSession.id; copied from the item's session_id at ingest."
      - name: file_name
        type: string
        source: input
        description: "Delivered file name; MUST equal the expansion of the style's AssetProfile.naming_pattern."
        constraints: "unique across Asset"
      - name: sequence_number
        type: integer
        source: input
        description: "Frame sequence within the shot, expanded zero-padded to 3 digits in file_name."
        constraints: ">= 1 and <= 999"
      - name: metadata_tags
        type: object
        source: input
        description: "Key/value metadata; MUST contain every key in the AssetProfile.required_metadata_keys with a non-empty string value."
      - name: captured_by_talent_id
        type: string
        source: computed
        description: "FK -> TalentProfile.id; the acting photographer at ingest."
      - name: asset_state
        type: enum
        source: system
        default: "INGESTED"
        description: "Asset lifecycle; see state_machines[entity=Asset]."
        constraints: "one of INGESTED, IN_RETOUCH, QC_PENDING, APPROVED, REJECTED, DELIVERED"
      - name: cms_asset_key
        type: string
        source: computed
        default: null
        description: "CMS path minted at delivery as {category}/{style_number}/{file_name}."
      - name: delivered_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the deliver action."

  - name: RetouchTask
    parent: null
    common_fields: true
    description: "One unit of post-production work on one Asset, queued to a StudioProvider, claimed by a retoucher, reviewed by QC, and measured against a turnaround service level."
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the file being retouched."
      - name: provider_id
        type: string
        source: input
        description: "FK -> StudioProvider.id; who does the retouching (supplies sla_hours and capacity)."
      - name: assigned_retoucher_id
        type: string
        source: computed
        default: null
        description: "FK -> TalentProfile.id; set by claim-next, null while QUEUED."
      - name: task_state
        type: enum
        source: system
        default: "QUEUED"
        description: "Task lifecycle; see state_machines[entity=RetouchTask]."
        constraints: "one of QUEUED, IN_PROGRESS, SUBMITTED, REWORK, APPROVED, ABANDONED"
      - name: priority_score
        type: number
        source: computed
        description: "Queue ranking score; see calculations.retouch_priority_score. Recomputed on every read of the claim-next candidate pool."
      - name: sla_hours
        type: integer
        source: computed
        description: "Effective turnaround service level in hours, pinned at task creation; see calculations.retouch_turnaround_hours."
      - name: due_at
        type: datetime
        source: computed
        description: "Asset.created_at + sla_hours hours; second sort key of the claim-next selector."
      - name: rework_count
        type: integer
        source: computed
        default: 0
        description: "Number of QC rejections so far; at MAX_REWORK (2) a further rejection abandons the task."
      - name: rework_started_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant the task last entered REWORK; null when never reworked or already resubmitted."
      - name: rework_hours_total
        type: number
        source: computed
        default: 0.00
        description: "Accumulated hours the task spent in REWORK, two decimals; the deduction used by the net turnaround variant."
      - name: claimed_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the first claim."
      - name: submitted_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of the latest submit."
      - name: approved_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant of QC approval."
      - name: turnaround_hours_gross
        type: number
        source: computed
        default: null
        description: "Gross variant of turnaround; see calculations.retouch_turnaround_hours."
      - name: turnaround_hours_net
        type: number
        source: computed
        default: null
        description: "Net variant of turnaround (gross minus rework_hours_total)."
      - name: sla_state
        type: enum
        source: computed
        default: "IN_SLA"
        description: "Service-level verdict derived from the GROSS variant only."
        constraints: "one of IN_SLA, AT_RISK, BREACHED"

state_machines:
  # ---------------------------------------------------------------- Sample axis 1
  - entity: Sample
    state_field: custody_state
    initial_state: EXPECTED
    terminal_states: [RETURNED, LOST]
    note: "Physical custody axis. Advances independently of match_state except where a precondition explicitly names it."
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /studio/samples/{sample_id}/receive"
        actor: SampleCoordinator
        preconditions:
          - "custody_state == EXPECTED"
          - "Vendor.coordination_hold == false for Sample.vendor_id"
        side_effects:
          - "set received_at = current logical clock"
          - "set due_return_at = received_at + Vendor.sample_sla_days days (calculations.sample_return_lateness)"
          - "Vendor.outstanding_sample_count += 1 (calculations.custody_ledger_counters)"
          - "increments Vendor.version by 1"
      - from: RECEIVED
        to: IN_STUDIO
        trigger: "POST /studio/samples/{sample_id}/custody-move with to_state=IN_STUDIO"
        actor: SampleCoordinator
        preconditions:
          - "custody_state == RECEIVED"
          - "match_state == MATCHED"
        side_effects:
          - "if the matched Style.content_state IN {NOT_STARTED, BLOCKED} then Style.content_state -> SAMPLE_READY and increments Style.version by 1"
      - from: IN_STUDIO
        to: ON_SET
        trigger: "POST /studio/samples/{sample_id}/custody-move with to_state=ON_SET"
        actor: SampleCoordinator
        preconditions:
          - "custody_state == IN_STUDIO"
          - "match_state == MATCHED"
        side_effects: ["none beyond updated_at / version bump on Sample"]
      - from: ON_SET
        to: IN_STUDIO
        trigger: "POST /studio/samples/{sample_id}/custody-move with to_state=IN_STUDIO"
        actor: SampleCoordinator
        preconditions:
          - "custody_state == ON_SET"
        side_effects: ["none beyond updated_at / version bump on Sample"]
        note: "Return-to-rack loop; the custody axis is cyclic between IN_STUDIO and ON_SET."
      - from: RECEIVED
        to: RETURN_PENDING
        trigger: "POST /studio/samples/{sample_id}/custody-move with to_state=RETURN_PENDING"
        actor: SampleCoordinator
        preconditions: ["custody_state == RECEIVED"]
        side_effects: ["none beyond updated_at / version bump on Sample"]
      - from: IN_STUDIO
        to: RETURN_PENDING
        trigger: "POST /studio/samples/{sample_id}/custody-move with to_state=RETURN_PENDING, or system cascade when the matched Style reaches DELIVERED"
        actor: SampleCoordinator | system
        preconditions: ["custody_state == IN_STUDIO"]
        side_effects: ["none beyond updated_at / version bump on Sample"]
      - from: ON_SET
        to: RETURN_PENDING
        trigger: "POST /studio/samples/{sample_id}/custody-move with to_state=RETURN_PENDING, or system cascade when the matched Style reaches DELIVERED"
        actor: SampleCoordinator | system
        preconditions: ["custody_state == ON_SET"]
        side_effects: ["none beyond updated_at / version bump on Sample"]
      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /studio/samples/{sample_id}/return"
        actor: SampleCoordinator
        preconditions: ["custody_state == RETURN_PENDING"]
        side_effects:
          - "set returned_at = current logical clock"
          - "set return_days_late per calculations.sample_return_lateness"
          - "Vendor.outstanding_sample_count -= 1"
          - "if return_days_late > 0 then Vendor.late_return_count += 1; and if Vendor.late_return_count >= 3 then Vendor.coordination_hold = true"
          - "increments Vendor.version by 1"
      - from: RECEIVED
        to: LOST
        trigger: "POST /studio/samples/{sample_id}/report-lost"
        actor: SampleCoordinator
        preconditions: ["custody_state IN {RECEIVED, IN_STUDIO, ON_SET, RETURN_PENDING}"]
        side_effects:
          - "Vendor.outstanding_sample_count -= 1; Vendor.late_return_count += 1; if Vendor.late_return_count >= 3 then Vendor.coordination_hold = true; increments Vendor.version by 1"
      - from: IN_STUDIO
        to: LOST
        trigger: "POST /studio/samples/{sample_id}/report-lost"
        actor: SampleCoordinator
        preconditions: ["custody_state IN {RECEIVED, IN_STUDIO, ON_SET, RETURN_PENDING}"]
        side_effects:
          - "L1 Vendor.outstanding_sample_count -= 1; Vendor.late_return_count += 1; increments Vendor.version by 1"
          - "L2 CASCADE (caused by L1's custody change): if no Sample remains with matched_style_id == this.matched_style_id, match_state == MATCHED and custody_state IN {IN_STUDIO, ON_SET}, then Style.content_state -> BLOCKED (from NOT_STARTED, SAMPLE_READY or SCHEDULED) and increments Style.version by 1"
          - "L3 CASCADE (caused by L2's Style.content_state -> BLOCKED): every ShotListItem of that Style with item_state IN {PLANNED, ASSIGNED} -> BLOCKED"
          - "L4 CASCADE (caused by L3): for every ShootSession that held one of those items, if no ShotListItem with required == true assigned to it remains in item_state IN {ASSIGNED, CAPTURED}, then that session LOCKED -> BOOKED (auto-unlock) and increments ShootSession.version by 1"
        note: "Rule 4 cascade of depth 4. match_state is deliberately untouched - the axes are independent."
      - from: ON_SET
        to: LOST
        trigger: "POST /studio/samples/{sample_id}/report-lost"
        actor: SampleCoordinator
        preconditions: ["custody_state IN {RECEIVED, IN_STUDIO, ON_SET, RETURN_PENDING}"]
        side_effects: ["same L1..L4 chain as IN_STUDIO -> LOST"]
      - from: RETURN_PENDING
        to: LOST
        trigger: "POST /studio/samples/{sample_id}/report-lost"
        actor: SampleCoordinator
        preconditions: ["custody_state IN {RECEIVED, IN_STUDIO, ON_SET, RETURN_PENDING}"]
        side_effects: ["same L1..L4 chain as IN_STUDIO -> LOST"]

  # ---------------------------------------------------------------- Sample axis 2
  - entity: Sample
    state_field: match_state
    initial_state: UNMATCHED
    terminal_states: []
    note: "Style-number reconciliation axis. Advances with no reference to custody_state, so a sample can be RECEIVED while still UNMATCHED and can be reconciled while sitting on the rack."
    transitions:
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /studio/samples/{sample_id}/match where Style.style_number == Sample.declared_style_number"
        actor: SampleCoordinator
        preconditions:
          - "custody_state NOT IN {RETURNED, LOST}"
          - "Style.style_number == Sample.declared_style_number"
        side_effects:
          - "set matched_style_id = style_id"
      - from: UNMATCHED
        to: MISMATCH_HOLD
        trigger: "POST /studio/samples/{sample_id}/match with mismatch_resolution=HOLD where Style.style_number != Sample.declared_style_number"
        actor: SampleCoordinator
        preconditions:
          - "custody_state NOT IN {RETURNED, LOST}"
          - "Style.style_number != Sample.declared_style_number"
          - "mismatch_resolution == HOLD"
        side_effects:
          - "matched_style_id stays null (the box is quarantined pending vendor coordination)"
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /studio/samples/{sample_id}/match with mismatch_resolution=ACCEPT_SUBSTITUTE"
        actor: SampleCoordinator
        preconditions:
          - "custody_state NOT IN {RETURNED, LOST}"
          - "mismatch_resolution == ACCEPT_SUBSTITUTE"
        side_effects:
          - "set matched_style_id = style_id (vendor-coordinated substitution accepted)"
        note: "Same target state as the clean match but reached through the substitution branch."
      - from: MISMATCH_HOLD
        to: MATCHED
        trigger: "POST /studio/samples/{sample_id}/match (clean number match, or mismatch_resolution=ACCEPT_SUBSTITUTE)"
        actor: SampleCoordinator
        preconditions:
          - "custody_state NOT IN {RETURNED, LOST}"
          - "Style.style_number == Sample.declared_style_number OR mismatch_resolution == ACCEPT_SUBSTITUTE"
        side_effects:
          - "set matched_style_id = style_id"
        note: "Hold is resolvable, so the match axis is cyclic-capable: UNMATCHED -> MISMATCH_HOLD -> MATCHED."

  # ------------------------------------------------------------------ ShootSession
  - entity: ShootSession
    state_field: session_state
    initial_state: BOOKED
    terminal_states: [WRAPPED, CANCELLED]
    note: "Branching-with-revert: LOCKED -> BOOKED is a real revert loop, and CANCELLED forks off both non-terminal states."
    transitions:
      - from: BOOKED
        to: LOCKED
        trigger: "POST /studio/shoot-sessions/{session_id}/lock"
        actor: Producer
        preconditions:
          - "session_state == BOOKED"
          - "at least one ShotListItem with required == true and item_state == ASSIGNED references this session"
          - "for every Style referenced by those assigned items, some Sample exists with matched_style_id == Style.id, match_state == MATCHED and custody_state IN {IN_STUDIO, ON_SET}"
        side_effects:
          - "call sheet frozen: further shot-list assignment to this session is rejected"
      - from: LOCKED
        to: BOOKED
        trigger: "POST /studio/shoot-sessions/{session_id}/unlock, or system cascade L4 of Sample -> LOST"
        actor: Producer | system
        preconditions: ["session_state == LOCKED"]
        side_effects:
          - "call sheet reopened: shot-list assignment permitted again"
      - from: LOCKED
        to: SHOOTING
        trigger: "POST /studio/shoot-sessions/{session_id}/start"
        actor: Photographer
        preconditions:
          - "session_state == LOCKED"
          - "the acting Photographer (X-User-ID) holds a TalentBooking on this session with role_on_set == PHOTOGRAPHER and booking_state == CONFIRMED"
        side_effects:
          - "set started_at = current logical clock"
      - from: SHOOTING
        to: WRAPPED
        trigger: "POST /studio/shoot-sessions/{session_id}/wrap"
        actor: Photographer
        preconditions:
          - "session_state == SHOOTING"
          - "the acting Photographer (X-User-ID) holds a TalentBooking on this session with role_on_set == PHOTOGRAPHER and booking_state == CONFIRMED"
        side_effects:
          - "set wrapped_at = current logical clock; set actual_minutes = whole minutes (wrapped_at - started_at)"
          - "every TalentBooking on this session with booking_state == CONFIRMED -> RELEASED"
          - "run calculations.session_cost_allocation: post ShotListItem.allocated_cost_cents for every CAPTURED item on this session and add each item's share to its Style.allocated_cost_cents; increments Style.version by 1 for each credited style"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /studio/shoot-sessions/{session_id}/cancel"
        actor: Producer
        preconditions: ["session_state IN {BOOKED, LOCKED}"]
        side_effects:
          - "L1 station capacity released: this session stops counting toward Station.committed_minutes_today"
          - "L2 CASCADE (caused by L1's session cancellation): every TalentBooking on this session with booking_state IN {HELD, CONFIRMED} -> CANCELLED; ShootSession.committed_talent_cost_cents -> 0"
          - "L3 CASCADE (caused by L2's booking cancellations): each affected TalentProfile.booked_minutes_today -= that booking's booked_minutes"
          - "every ShotListItem with session_id == this session and item_state == ASSIGNED -> PLANNED with session_id cleared"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /studio/shoot-sessions/{session_id}/cancel"
        actor: Producer
        preconditions: ["session_state IN {BOOKED, LOCKED}"]
        side_effects: ["same L1..L3 chain as BOOKED -> CANCELLED"]

  # ----------------------------------------------------------------- TalentBooking
  - entity: TalentBooking
    state_field: booking_state
    initial_state: HELD
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /studio/talent-bookings/{booking_id}/confirm"
        actor: Producer
        preconditions:
          - "booking_state == HELD"
          - "session_state IN {BOOKED, LOCKED}"
          - "if TalentProfile.requires_release == true: a ReleaseDocument exists with talent_id == this.talent_id, doc_state == SIGNED, valid_from <= call_time and valid_until > wrap_time"
          - "that ReleaseDocument.scope rank >= session.required_usage_scope rank"
          - "ShootSession.committed_talent_cost_cents + charge_cents <= ShootSession.budget_cap_cents"
        side_effects:
          - "for MODEL bookings: set release_document_id and usage_rights_scope from the selected release (selector pinned in validations[priority=47])"
          - "ShootSession.committed_talent_cost_cents += charge_cents; increments ShootSession.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system cascade on ShootSession SHOOTING -> WRAPPED"
        actor: system
        preconditions: ["booking_state == CONFIRMED", "session_state == SHOOTING at the moment of wrap"]
        side_effects:
          - "usage rights are now exercised; the booking keeps counting toward committed_talent_cost_cents"
      - from: HELD
        to: CANCELLED
        trigger: "POST /studio/talent-bookings/{booking_id}/cancel, or system cascade on ShootSession -> CANCELLED"
        actor: Producer | system
        preconditions: ["booking_state IN {HELD, CONFIRMED}"]
        side_effects:
          - "TalentProfile.booked_minutes_today -= booked_minutes (compensating invariant compensating_invariant/talent_minutes)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /studio/talent-bookings/{booking_id}/cancel, or system cascade on ShootSession -> CANCELLED"
        actor: Producer | system
        preconditions: ["booking_state IN {HELD, CONFIRMED}"]
        side_effects:
          - "TalentProfile.booked_minutes_today -= booked_minutes"
          - "ShootSession.committed_talent_cost_cents -= charge_cents; increments ShootSession.version by 1"

  # ----------------------------------------------------------------- ShotListItem
  - entity: ShotListItem
    state_field: item_state
    initial_state: PLANNED
    terminal_states: [WAIVED]
    transitions:
      - from: PLANNED
        to: ASSIGNED
        trigger: "POST /studio/shot-list-items/{item_id}/assign"
        actor: Producer
        preconditions:
          - "item_state == PLANNED"
          - "session_state == BOOKED (a LOCKED session's call sheet is frozen)"
          - "Station.station_type of the session admits this asset_kind per validations[priority=43]"
        side_effects:
          - "set session_id"
          - "if required == true and Style.content_state IN {SAMPLE_READY} then Style.content_state -> SCHEDULED and increments Style.version by 1"
      - from: ASSIGNED
        to: PLANNED
        trigger: "system cascade on ShootSession -> CANCELLED"
        actor: system
        preconditions: ["item_state == ASSIGNED"]
        side_effects: ["clear session_id"]
      - from: ASSIGNED
        to: CAPTURED
        trigger: "system cascade on POST /studio/assets (first non-rejected Asset ingested for this item)"
        actor: system
        preconditions: ["item_state == ASSIGNED", "live_asset_count transitions 0 -> 1"]
        side_effects:
          - "if every ShotListItem of the Style with required == true and item_state != WAIVED is now CAPTURED then Style.content_state -> SHOT and increments Style.version by 1"
      - from: CAPTURED
        to: ASSIGNED
        trigger: "system cascade on QC rejection that abandons the task (Asset -> REJECTED) leaving live_asset_count == 0"
        actor: system
        preconditions: ["item_state == CAPTURED", "live_asset_count transitions 1 -> 0"]
        side_effects: ["Style.content_state -> SCHEDULED if it was SHOT"]
        note: "Capture is revocable, so the item axis is cyclic: ASSIGNED -> CAPTURED -> ASSIGNED."
      - from: PLANNED
        to: BLOCKED
        trigger: "system cascade L3 of Sample -> LOST"
        actor: system
        preconditions: ["item_state IN {PLANNED, ASSIGNED}", "Style.content_state == BLOCKED"]
        side_effects: ["none"]
      - from: ASSIGNED
        to: BLOCKED
        trigger: "system cascade L3 of Sample -> LOST"
        actor: system
        preconditions: ["item_state IN {PLANNED, ASSIGNED}", "Style.content_state == BLOCKED"]
        side_effects:
          - "the holding session may auto-unlock per cascade L4"
      - from: PLANNED
        to: WAIVED
        trigger: "POST /studio/shot-list-items/{item_id}/waive"
        actor: Producer
        preconditions: ["item_state IN {PLANNED, BLOCKED}"]
        side_effects:
          - "Style.required_item_count -= 1 when required == true; increments Style.version by 1"
      - from: BLOCKED
        to: WAIVED
        trigger: "POST /studio/shot-list-items/{item_id}/waive"
        actor: Producer
        preconditions: ["item_state IN {PLANNED, BLOCKED}"]
        side_effects:
          - "Style.required_item_count -= 1 when required == true; increments Style.version by 1"

  # ------------------------------------------------------------------------ Asset
  - entity: Asset
    state_field: asset_state
    initial_state: INGESTED
    terminal_states: [DELIVERED, REJECTED]
    note: "Cyclic through QC_PENDING -> IN_RETOUCH on rejection, with a threshold fork to REJECTED once rework_count has reached MAX_REWORK."
    transitions:
      - from: INGESTED
        to: IN_RETOUCH
        trigger: "POST /studio/retouch-tasks"
        actor: ContentOps
        preconditions: ["asset_state == INGESTED"]
        side_effects: ["StudioProvider.assigned_asset_count += 1"]
      - from: IN_RETOUCH
        to: QC_PENDING
        trigger: "POST /studio/retouch-tasks/{task_id}/submit"
        actor: Retoucher
        preconditions: ["asset_state == IN_RETOUCH"]
        side_effects: ["none"]
      - from: QC_PENDING
        to: APPROVED
        trigger: "POST /studio/retouch-tasks/{task_id}/qc-decision with decision=APPROVE"
        actor: QCReviewer
        preconditions: ["asset_state == QC_PENDING"]
        side_effects: ["StudioProvider.assigned_asset_count -= 1"]
      - from: QC_PENDING
        to: IN_RETOUCH
        trigger: "POST /studio/retouch-tasks/{task_id}/qc-decision with decision=REJECT while RetouchTask.rework_count < 2"
        actor: QCReviewer
        preconditions: ["asset_state == QC_PENDING", "RetouchTask.rework_count < MAX_REWORK"]
        side_effects: ["none"]
      - from: QC_PENDING
        to: REJECTED
        trigger: "POST /studio/retouch-tasks/{task_id}/qc-decision with decision=REJECT while RetouchTask.rework_count >= 2"
        actor: QCReviewer
        preconditions: ["asset_state == QC_PENDING", "RetouchTask.rework_count >= MAX_REWORK"]
        side_effects:
          - "StudioProvider.assigned_asset_count -= 1"
          - "ShotListItem.live_asset_count -= 1; if it reaches 0 then that item CAPTURED -> ASSIGNED and the Style reverts SHOT -> SCHEDULED"
      - from: APPROVED
        to: DELIVERED
        trigger: "POST /studio/assets/{asset_id}/deliver"
        actor: ContentOps
        preconditions: ["asset_state == APPROVED"]
        side_effects:
          - "L1 set delivered_at = current logical clock; set cms_asset_key = {Style.category}/{Style.style_number}/{file_name}"
          - "L2 CASCADE (caused by L1's DELIVERED state): Style.delivered_asset_count += 1; increments Style.version by 1"
          - "L3 CASCADE (caused by L2 covering the last outstanding item): if every ShotListItem of the Style with required == true and item_state != WAIVED now owns at least one Asset in asset_state == DELIVERED, then Style.content_state IN_POST -> DELIVERED"
          - "L4 CASCADE (caused by L3's Style.content_state -> DELIVERED): every Sample with matched_style_id == that Style and custody_state IN {IN_STUDIO, ON_SET} -> RETURN_PENDING"
        note: "Rule 4 cascade of depth 4, triggered from a different transition than the Sample -> LOST chain."

  # ------------------------------------------------------------------ RetouchTask
  - entity: RetouchTask
    state_field: task_state
    initial_state: QUEUED
    terminal_states: [APPROVED, ABANDONED]
    note: "Cyclic: SUBMITTED -> REWORK -> SUBMITTED, bounded by MAX_REWORK, with a threshold fork to ABANDONED."
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /studio/retouch-tasks/claim-next (server selects the task, see calculations.retouch_priority_score)"
        actor: Retoucher
        preconditions:
          - "task_state == QUEUED"
          - "the acting TalentProfile.talent_type == RETOUCHER"
          - "StudioProvider.assigned_asset_count <= StudioProvider.capacity_assets_per_day for the task's provider"
        side_effects:
          - "set assigned_retoucher_id = X-User-ID; set claimed_at = current logical clock"
          - "if the Asset's Style.content_state == SHOT then Style.content_state -> IN_POST and increments Style.version by 1"
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /studio/retouch-tasks/{task_id}/submit"
        actor: Retoucher
        preconditions:
          - "task_state IN {IN_PROGRESS, REWORK}"
          - "X-User-ID == assigned_retoucher_id"
        side_effects:
          - "set submitted_at = current logical clock"
          - "Asset IN_RETOUCH -> QC_PENDING"
      - from: REWORK
        to: SUBMITTED
        trigger: "POST /studio/retouch-tasks/{task_id}/submit"
        actor: Retoucher
        preconditions:
          - "task_state IN {IN_PROGRESS, REWORK}"
          - "X-User-ID == assigned_retoucher_id"
        side_effects:
          - "rework_hours_total += whole-hours-with-two-decimals (current clock - rework_started_at); clear rework_started_at"
          - "set submitted_at = current logical clock"
          - "Asset IN_RETOUCH -> QC_PENDING"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /studio/retouch-tasks/{task_id}/qc-decision with decision=APPROVE"
        actor: QCReviewer
        preconditions:
          - "task_state == SUBMITTED"
          - "X-User-ID != assigned_retoucher_id (segregation of duties)"
        side_effects:
          - "set approved_at = current logical clock"
          - "run calculations.retouch_turnaround_hours: set turnaround_hours_gross, turnaround_hours_net and sla_state"
          - "Asset QC_PENDING -> APPROVED; StudioProvider.assigned_asset_count -= 1"
      - from: SUBMITTED
        to: REWORK
        trigger: "POST /studio/retouch-tasks/{task_id}/qc-decision with decision=REJECT while rework_count < 2"
        actor: QCReviewer
        preconditions:
          - "task_state == SUBMITTED"
          - "X-User-ID != assigned_retoucher_id"
          - "rework_count < MAX_REWORK"
        side_effects:
          - "rework_count += 1; set rework_started_at = current logical clock"
          - "Asset QC_PENDING -> IN_RETOUCH"
      - from: SUBMITTED
        to: ABANDONED
        trigger: "POST /studio/retouch-tasks/{task_id}/qc-decision with decision=REJECT while rework_count >= 2"
        actor: QCReviewer
        preconditions:
          - "task_state == SUBMITTED"
          - "X-User-ID != assigned_retoucher_id"
          - "rework_count >= MAX_REWORK"
        side_effects:
          - "Asset QC_PENDING -> REJECTED (and its downstream item/style reverts)"
          - "StudioProvider.assigned_asset_count -= 1"

  # ------------------------------------------------------------------------ Style
  - entity: Style
    state_field: content_state
    initial_state: NOT_STARTED
    terminal_states: [DELIVERED]
    note: "Compound: every transition is a system consequence of a Sample, ShotListItem, RetouchTask or Asset change."
    transitions:
      - from: NOT_STARTED
        to: SAMPLE_READY
        trigger: "system cascade on Sample custody RECEIVED -> IN_STUDIO with match_state == MATCHED"
        actor: system
        preconditions: ["content_state IN {NOT_STARTED, BLOCKED}"]
        side_effects: ["none"]
      - from: BLOCKED
        to: SAMPLE_READY
        trigger: "system cascade on a replacement Sample reaching custody IN_STUDIO with match_state == MATCHED"
        actor: system
        preconditions: ["content_state IN {NOT_STARTED, BLOCKED}"]
        side_effects: ["BLOCKED ShotListItems are NOT auto-restored; the producer must re-create or waive them"]
      - from: SAMPLE_READY
        to: SCHEDULED
        trigger: "system cascade on ShotListItem PLANNED -> ASSIGNED where required == true"
        actor: system
        preconditions: ["content_state == SAMPLE_READY"]
        side_effects: ["none"]
      - from: SCHEDULED
        to: SHOT
        trigger: "system cascade on ShotListItem ASSIGNED -> CAPTURED completing the required set"
        actor: system
        preconditions:
          - "content_state == SCHEDULED"
          - "every ShotListItem with required == true and item_state != WAIVED is CAPTURED"
        side_effects: ["none"]
      - from: SHOT
        to: SCHEDULED
        trigger: "system cascade on ShotListItem CAPTURED -> ASSIGNED (last live asset REJECTED)"
        actor: system
        preconditions: ["content_state == SHOT"]
        side_effects: ["none"]
        note: "Revert edge; the Style content axis is cyclic between SCHEDULED and SHOT."
      - from: SHOT
        to: IN_POST
        trigger: "system cascade on the first RetouchTask for one of this style's Assets moving QUEUED -> IN_PROGRESS"
        actor: system
        preconditions: ["content_state == SHOT"]
        side_effects: ["none"]
      - from: IN_POST
        to: DELIVERED
        trigger: "system cascade L3 of POST /studio/assets/{asset_id}/deliver"
        actor: system
        preconditions:
          - "content_state == IN_POST"
          - "every ShotListItem with required == true and item_state != WAIVED owns at least one Asset in asset_state == DELIVERED"
        side_effects:
          - "L4: matched Samples in custody_state IN {IN_STUDIO, ON_SET} -> RETURN_PENDING"
      - from: NOT_STARTED
        to: BLOCKED
        trigger: "system cascade L2 of Sample -> LOST"
        actor: system
        preconditions: ["content_state IN {NOT_STARTED, SAMPLE_READY, SCHEDULED}", "no Sample remains matched to this Style with custody_state IN {IN_STUDIO, ON_SET}"]
        side_effects: ["L3: PLANNED/ASSIGNED ShotListItems -> BLOCKED"]
      - from: SAMPLE_READY
        to: BLOCKED
        trigger: "system cascade L2 of Sample -> LOST"
        actor: system
        preconditions: ["content_state IN {NOT_STARTED, SAMPLE_READY, SCHEDULED}", "no Sample remains matched to this Style with custody_state IN {IN_STUDIO, ON_SET}"]
        side_effects: ["L3: PLANNED/ASSIGNED ShotListItems -> BLOCKED"]
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system cascade L2 of Sample -> LOST"
        actor: system
        preconditions: ["content_state IN {NOT_STARTED, SAMPLE_READY, SCHEDULED}", "no Sample remains matched to this Style with custody_state IN {IN_STUDIO, ON_SET}"]
        side_effects: ["L3: PLANNED/ASSIGNED ShotListItems -> BLOCKED; L4: holding sessions auto-unlock"]

  # -------------------------------------------------------------- ReleaseDocument
  - entity: ReleaseDocument
    state_field: doc_state
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: SIGNED
        trigger: "POST /studio/release-documents/{release_id}/sign"
        actor: StudioAdmin
        preconditions:
          - "doc_state == PENDING"
          - "current logical clock < valid_until"
        side_effects: ["set signed_at = current logical clock"]
      - from: PENDING
        to: EXPIRED
        trigger: "system lazy evaluation whenever the document is read or evaluated and current logical clock >= valid_until"
        actor: system
        preconditions: ["doc_state IN {PENDING, SIGNED}", "current logical clock >= valid_until"]
        side_effects: ["none"]
      - from: SIGNED
        to: EXPIRED
        trigger: "system lazy evaluation whenever the document is read or evaluated and current logical clock >= valid_until"
        actor: system
        preconditions: ["doc_state IN {PENDING, SIGNED}", "current logical clock >= valid_until"]
        side_effects: ["the release stops covering any booking confirmation from that instant"]

concurrency_rules:
  - rule_id: booking-create-stale-session
    parent_entity: ShootSession
    write_endpoint: "POST /studio/talent-bookings"
    occ_field: "expected_session_version"
    description: |
      Creating a TalentBooking against a ShootSession whose version has advanced
      since the client last observed it is rejected. A session legitimately accepts
      many bookings, so the second create is not blocked by any state precondition;
      what makes it unsafe is that the crew composition, the talent-minute ledger and
      committed_talent_cost_cents the producer was reasoning about have already moved.
      The OCC check reduces this to a stale-version comparison on ShootSession.version.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: shot-item-create-stale-style
    parent_entity: Style
    write_endpoint: "POST /studio/shot-list-items"
    occ_field: "expected_style_version"
    description: |
      Adding a ShotListItem to a Style whose version has advanced since the client
      last observed it is rejected. A style legitimately accumulates many shot-list
      items, so a second create is not blocked by any state precondition; the hazard
      is that required_item_count, content_state and the angle coverage the producer
      was working from are stale. Resolved purely as a Style.version comparison.
    error_id: ERR_STALE_STYLE_VERSION
    http_status: 412

calculations:
  - name: talent_booking_charge
    trigger: "On POST /studio/talent-bookings (booking creation), before any fiscal check; the result is frozen on the row and never recomputed."
    algorithm: tiered_pricing
    formula: |
      # STEP ORDER IS NORMATIVE. The day-rate cap looks circular (it appears to
      # bound the same total that the overtime split produces) but is pinned to
      # run last and to NOT feed back into the split.
      booked_minutes   = whole_minutes(wrap_time - call_time)
      billable_minutes = max(booked_minutes, talent.minimum_call_hours * 60)

      # prior_minutes counts only OTHER bookings of the same talent whose
      # call_time falls on the same UTC calendar date as this booking's call_time
      # and whose booking_state IN {HELD, CONFIRMED}. CANCELLED and RELEASED
      # bookings are excluded. This booking itself is excluded.
      prior_minutes     = sum(other.booked_minutes for those bookings)
      remaining_regular = max(0, talent.max_daily_minutes - prior_minutes)

      regular_minutes  = min(billable_minutes, remaining_regular)
      overtime_minutes = billable_minutes - regular_minutes

      # Round EACH leg to whole cents, THEN add. Never sum the two products first.
      base_cents = round_half_up(talent.hourly_rate_cents * regular_minutes / 60)
      ot_cents   = round_half_up(talent.hourly_rate_cents * OVERTIME_MULTIPLIER * overtime_minutes / 60)
      uncapped   = base_cents + ot_cents

      # STEP 4 (last): the standard-day cap applies ONLY to a booking with no
      # overtime. Once any overtime minute exists the cap is void and the
      # uncapped figure stands.
      charge_cents = min(uncapped, talent.day_rate_cents) if overtime_minutes == 0 else uncapped
    input_set: "Only the talent's own bookings in booking_state IN {HELD, CONFIRMED} on the same UTC date as call_time contribute prior_minutes; bookings on other dates and CANCELLED/RELEASED bookings are excluded."
    constants:
      OVERTIME_MULTIPLIER: 1.5
    precision: "charge_cents, base_cents, ot_cents are whole cents, round_half_up per leg; minutes are whole minutes"
    variants: []

  - name: session_cost_allocation
    trigger: "On ShootSession SHOOTING -> WRAPPED (POST /studio/shoot-sessions/{session_id}/wrap)."
    algorithm: waterfall_allocation
    formula: |
      station_cost_cents = round_half_up(provider.station_hour_rate_cents * session.actual_minutes / 60)
      talent_cost_cents  = sum(b.charge_cents for b in session bookings
                               where b.booking_state IN {CONFIRMED, RELEASED})
      session_total_cents = station_cost_cents + talent_cost_cents

      items = [ShotListItem where session_id == session.id and item_state == CAPTURED]
      items sorted by created_at ASC   # NEVER by id
      n = count(items)
      if n == 0:
          # nothing is posted; session_total_cents is absorbed as studio overhead
          return
      per_item_cents = floor(session_total_cents / n)
      remainder      = session_total_cents - per_item_cents * n     # 0 <= remainder < n

      # ROUNDING ORDER IS NORMATIVE: allocate per item first, then add each item's
      # own allocation into its Style. Never compute a per-style share by rounding
      # (session_total * style_item_count / n) - that yields different cents.
      for i, item in enumerate(items):          # i is the created_at ASC index
          item.allocated_cost_cents = per_item_cents + (1 if i < remainder else 0)
          item.style.allocated_cost_cents += item.allocated_cost_cents
    input_set: "Only CAPTURED ShotListItems of the wrapping session receive an allocation; ASSIGNED, BLOCKED and WAIVED items receive nothing. Only CONFIRMED/RELEASED bookings contribute talent cost."
    constants: {}
    precision: "whole cents; floor for the even share, one-cent remainder units distributed to the earliest-created items (created_at ASC, no id fallback)"
    variants: []

  - name: cost_per_style
    trigger: "On demand via GET /studio/styles/{style_id}/cost-summary; both variants are evaluated against the same database snapshot."
    algorithm: forward_looking
    formula: |
      # ---- variant PROVISIONAL (forward-looking projection) -------------------
      provisional_cost_cents = 0
      for S in sessions that hold at least one ShotListItem of this style
              and S.session_state != CANCELLED:
          proj_total = round_half_up(S.provider.station_hour_rate_cents * S.planned_minutes / 60)
                     + sum(b.charge_cents for b in S bookings
                           where b.booking_state IN {HELD, CONFIRMED, RELEASED})
          denom_items = [ShotListItem where session_id == S.id
                         and item_state IN {ASSIGNED, CAPTURED}]      sorted created_at ASC
          if count(denom_items) == 0: continue
          per_item = floor(proj_total / count(denom_items))
          rem      = proj_total - per_item * count(denom_items)
          for i, it in enumerate(denom_items):
              share = per_item + (1 if i < rem else 0)
              if it.style_id == this style: provisional_cost_cents += share

      # ---- variant FINAL (persisted chronological ledger) --------------------
      final_cost_cents = Style.allocated_cost_cents
      # i.e. exactly the sum of the per-item allocations already posted by
      # session_cost_allocation at each wrap: actual_minutes instead of
      # planned_minutes, {CONFIRMED, RELEASED} bookings instead of
      # {HELD, CONFIRMED, RELEASED}, CAPTURED items only in the denominator.

      asset_denominator_prov  = count(ShotListItem of style where item_state IN {ASSIGNED, CAPTURED})
      asset_denominator_final = count(ShotListItem of style where item_state == CAPTURED)
      provisional_cost_per_asset_cents = round_half_up(provisional_cost_cents / max(1, asset_denominator_prov))
      final_cost_per_asset_cents       = round_half_up(final_cost_cents / max(1, asset_denominator_final))

      # ---- outsourced comparison --------------------------------------------
      # Eligibility: StudioProvider.provider_kind == OUTSOURCED
      #              AND capacity_assets_per_day >= Style.required_item_count
      # Ranking:     style_quote_cents ASC, then quality_score DESC, then created_at ASC
      # Empty pool:  outsourced_quote_cents = null, recommended_source = "IN_HOUSE"
      best = first provider under that ranking
      outsourced_quote_cents = best.style_quote_cents (or null)
      variance_cents = final_cost_cents - outsourced_quote_cents      (null when no quote)
      recommended_source = "IN_HOUSE" if outsourced_quote_cents is null
                                        or final_cost_cents <= outsourced_quote_cents
                           else "OUTSOURCED"
    input_set: "PROVISIONAL scans every non-CANCELLED session touching the style, using planned minutes and held-or-better bookings, allocating over ASSIGNED+CAPTURED items. FINAL reads only the persisted ledger, which only wrapped sessions ever wrote, using actual minutes, confirmed-or-better bookings, and CAPTURED items only."
    constants: {}
    precision: "whole cents; per-asset figures round_half_up to whole cents"
    variants:
      - name: provisional
        when: "Producer-facing projection for a style whose sessions may still be BOOKED, LOCKED, SHOOTING or already WRAPPED."
        difference: "Uses planned_minutes, includes HELD bookings, and divides across ASSIGNED+CAPTURED items - so it charges a style for shots that were planned but never captured."
      - name: final
        when: "Finance-facing actual, readable at the same instant as the provisional figure."
        difference: "Uses actual_minutes, drops HELD bookings, and divides across CAPTURED items only - a style that captured fewer shots than planned absorbs a LARGER share of a SMALLER session total, so the two variants diverge in both directions."

  - name: retouch_turnaround_hours
    trigger: "On RetouchTask SUBMITTED -> APPROVED (POST /studio/retouch-tasks/{task_id}/qc-decision with decision=APPROVE)."
    algorithm: chronological
    formula: |
      # sla_hours is pinned at task creation:
      #   base = provider.sla_hours
      #   sla_hours = ceil(base * RUSH_SLA_FACTOR) when the Asset's Style.priority_tier == 'A'
      #               else base
      #   due_at = Asset.created_at + sla_hours hours
      turnaround_hours_gross = round_half_up((approved_at - asset.created_at) in hours, 2)
      turnaround_hours_net   = round_half_up(turnaround_hours_gross - rework_hours_total, 2)

      # sla_state is derived from the GROSS variant ONLY (normative):
      if turnaround_hours_gross > sla_hours:                       sla_state = BREACHED
      elif turnaround_hours_gross > AT_RISK_SLA_FRACTION * sla_hours: sla_state = AT_RISK
      else:                                                        sla_state = IN_SLA
    input_set: "Gross spans asset ingest to QC approval inclusive of every rework loop. Net subtracts rework_hours_total, the accumulated time the task sat in REWORK (producer-side wait), and nothing else."
    constants:
      RUSH_SLA_FACTOR: 0.5
      AT_RISK_SLA_FRACTION: 0.8
    precision: "hours to 2 decimals, round_half_up; sla_hours is a whole number of hours (ceil after the rush factor)"
    variants:
      - name: gross_elapsed
        when: "Vendor-facing SLA scorecard: the retailer's clock never stops."
        difference: "Counts every hour from ingest to approval, including hours the file waited in REWORK."
      - name: net_worked
        when: "Provider-facing SLA scorecard used in the outsourced-studio comparison."
        difference: "Deducts rework_hours_total, so the same task can be BREACHED on gross and comfortably inside the service level on net."

  - name: retouch_priority_score
    trigger: "Recomputed for every candidate task on each POST /studio/retouch-tasks/claim-next call."
    algorithm: weighted_scoring
    formula: |
      tier_weight    = {A: 100, B: 60, C: 30}[asset.shot_list_item.style.priority_tier]
      age_hours      = (current logical clock - task.created_at) in hours
      urgency        = min(50.00, round_half_up(age_hours * 2, 2))          # capped
      rework_penalty = 15 * min(task.rework_count, MAX_REWORK)
      scope_bonus    = 20 if asset.shot_list_item.asset_kind == 'ON_MODEL' else 0
      priority_score = round_half_up(tier_weight + urgency - rework_penalty + scope_bonus, 2)

      # SELECTOR (claim-next)
      # eligibility: task_state == QUEUED
      #              AND provider.assigned_asset_count <= provider.capacity_assets_per_day
      # ranking:     priority_score DESC, then due_at ASC, then created_at ASC
      # tie-break:   created_at ASC is final; task.id NEVER participates
      # empty pool:  ERR_NO_CLAIMABLE_TASK (409)
    input_set: "Only RetouchTasks in task_state == QUEUED whose provider still has headroom are candidates; IN_PROGRESS, SUBMITTED, REWORK, APPROVED and ABANDONED tasks are excluded."
    constants:
      TIER_WEIGHT_A: 100
      TIER_WEIGHT_B: 60
      TIER_WEIGHT_C: 30
      URGENCY_PER_HOUR: 2
      URGENCY_CAP: 50.00
      REWORK_PENALTY_PER_LOOP: 15
      ON_MODEL_BONUS: 20
      MAX_REWORK: 2
    precision: "score to 2 decimals, round_half_up"
    variants: []

  - name: color_composite_delta_e
    trigger: "On POST /studio/shoot-sessions/{session_id}/color-measurement."
    algorithm: weighted_scoring
    formula: |
      mean_d = sum(patch_deltas) / count(patch_deltas)
      max_d  = max(patch_deltas)
      # Conditional branch on the STATION's type: on-model skin-tone accuracy
      # weights the worst patch far more heavily than the average patch.
      if station.station_type == 'MODEL':
          composite = round_half_up(0.30 * mean_d + 0.70 * max_d, 2)
      else:
          composite = round_half_up(0.50 * mean_d + 0.50 * max_d, 2)

      color_check_state = PASS if composite <= session.color_tolerance_delta_e else FAIL
      #                          ^^ INCLUSIVE: composite exactly equal to the
      #                          tolerance PASSES.

      # CROSS-SESSION CONSISTENCY CONTROL (rejects the measurement outright):
      # prev = the ShootSession with the same station_id, color_check_state == PASS,
      #        and scheduled_start < this.scheduled_start,
      #        ranked scheduled_start DESC then created_at ASC, first row.
      # if prev exists and abs(composite - prev.color_composite_delta_e)
      #                    > COLOR_CONSISTENCY_DRIFT_MAX:
      #        reject with ERR_COLOR_CONSISTENCY_DRIFT and persist nothing.
    input_set: "All submitted patch_deltas participate; the array must be non-empty. The consistency baseline considers only same-station sessions that already recorded a PASS and started strictly earlier."
    constants:
      MODEL_MEAN_WEIGHT: 0.30
      MODEL_MAX_WEIGHT: 0.70
      OTHER_MEAN_WEIGHT: 0.50
      OTHER_MAX_WEIGHT: 0.50
      COLOR_CONSISTENCY_DRIFT_MAX: 0.75
    precision: "composite to 2 decimals, round_half_up; comparison against tolerance is inclusive (<=), against the drift ceiling is exclusive (>)"
    variants: []

  - name: sample_return_lateness
    trigger: "due_return_at on Sample receive; return_days_late and the vendor strike on Sample return."
    algorithm: threshold
    formula: |
      due_return_at   = received_at + vendor.sample_sla_days days      (exact instant arithmetic)
      overdue_seconds = (returned_at - due_return_at) in whole seconds
      return_days_late = 0 if overdue_seconds <= 0
                         else ceil(overdue_seconds / 86400)
      # BOUNDARY: returning at exactly due_return_at yields 0 (uses <= 0, not < 0);
      # one second later yields 1 whole day late.
      if return_days_late > 0: vendor.late_return_count += 1
      if vendor.late_return_count >= VENDOR_HOLD_STRIKES: vendor.coordination_hold = true
    input_set: "Only the sample's own received_at / returned_at instants and its vendor's sample_sla_days; nothing else participates."
    constants:
      SECONDS_PER_DAY: 86400
      VENDOR_HOLD_STRIKES: 3
    precision: "whole days, ceiling; the hold threshold is >= (the third strike sets the hold)"
    variants: []

  - name: custody_ledger_counters
    trigger: "On every Sample custody transition (receive, custody-move, return, report-lost)."
    algorithm: aggregation
    formula: |
      Vendor.outstanding_sample_count =
          count(Sample where vendor_id == V.id
                and custody_state IN {RECEIVED, IN_STUDIO, ON_SET, RETURN_PENDING})
      Style.delivered_asset_count =
          count(Asset a where a.shot_list_item.style_id == Style.id
                and a.asset_state == DELIVERED)
      Style.required_item_count =
          count(ShotListItem where style_id == Style.id
                and required == true and item_state != WAIVED)
      ShotListItem.live_asset_count =
          count(Asset where shot_list_item_id == item.id and asset_state != REJECTED)
      StudioProvider.assigned_asset_count =
          count(RetouchTask where provider_id == P.id
                and task_state IN {QUEUED, IN_PROGRESS, SUBMITTED, REWORK})
    input_set: "Each counter names its own source entity and explicit status filter; EXPECTED, RETURNED and LOST samples never count as outstanding."
    constants: {}
    precision: "integers; incremental update must agree with a full recount at all times"
    variants: []

  - name: capacity_ledger_counters
    trigger: "On session create/cancel and on booking create/confirm/cancel/release."
    algorithm: aggregation
    formula: |
      # Window: the UTC calendar date of the CURRENT LOGICAL CLOCK.
      Station.committed_minutes_today =
          sum(ShootSession.planned_minutes
              where station_id == St.id
                and session_state IN {BOOKED, LOCKED, SHOOTING, WRAPPED}
                and date(scheduled_start) == date(current logical clock))
      TalentProfile.booked_minutes_today =
          sum(TalentBooking.booked_minutes
              where talent_id == T.id
                and booking_state IN {HELD, CONFIRMED}
                and date(call_time) == date(current logical clock))
      ShootSession.committed_talent_cost_cents =
          sum(TalentBooking.charge_cents
              where session_id == S.id and booking_state IN {CONFIRMED, RELEASED})
      # NOTE: the station CAPACITY VALIDATION uses the date of the CANDIDATE
      # session's scheduled_start (not the clock date), so a session can be
      # scheduled for any date; only the denormalised counter is clock-dated.
    input_set: "CANCELLED sessions and CANCELLED/RELEASED bookings are excluded from the minute counters; RELEASED bookings remain in committed_talent_cost_cents."
    constants: {}
    precision: "whole minutes / whole cents; boundaries inclusive of the day's first instant and exclusive of the next day's"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The role is listed in the endpoint's roles."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body carries every required field with the declared type; enum fields hold a declared member; arrays declared non-empty are non-empty; numeric fields respect their constraints. Includes the presence of expected_session_version / expected_style_version on the two OCC endpoints."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 5
    category: business_constraint
    check: "Pagination: limit is an integer in [1,100] and offset an integer >= 0; filter values that are enum-typed hold a declared member."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list GET endpoints"
  - priority: 6
    category: existence
    check: "Every path id resolves, validated left-to-right."
    error_id: "ERR_STYLE_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_SHOT_ITEM_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_RETOUCH_TASK_NOT_FOUND | ERR_REFERENCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 7
    category: existence
    check: "Every foreign key in the request body resolves. Vendor, Station, TalentProfile, StudioProvider, AssetProfile and ReleaseDocument misses all raise ERR_REFERENCE_NOT_FOUND; Style, ShootSession, ShotListItem and Asset misses raise their own code."
    error_id: "ERR_REFERENCE_NOT_FOUND | ERR_STYLE_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_SHOT_ITEM_NOT_FOUND | ERR_ASSET_NOT_FOUND"
    http_status: 404
    applies_to: "POST /studio/styles, /studio/samples, /studio/samples/{sample_id}/match, /studio/shoot-sessions, /studio/talent-bookings, /studio/shot-list-items, /studio/shot-list-items/{item_id}/assign, /studio/release-documents, /studio/assets, /studio/retouch-tasks"
  - priority: 8
    category: auth
    check: "Photographer identity gate: the acting X-User-ID must be a TalentProfile holding a TalentBooking on the target session with role_on_set == PHOTOGRAPHER and booking_state == CONFIRMED."
    error_id: ERR_NOT_BOOKED_ON_SESSION
    http_status: 403
    applies_to: "POST /studio/shoot-sessions/{session_id}/start, /studio/shoot-sessions/{session_id}/wrap, /studio/shoot-sessions/{session_id}/color-measurement, /studio/assets"
  - priority: 9
    category: auth
    check: "Retoucher ownership gate: X-User-ID equals RetouchTask.assigned_retoucher_id."
    error_id: ERR_TASK_NOT_ASSIGNED_TO_ACTOR
    http_status: 403
    applies_to: "POST /studio/retouch-tasks/{task_id}/submit"
  - priority: 10
    category: auth
    check: "Segregation of duties: the QC reviewer's X-User-ID must differ from RetouchTask.assigned_retoucher_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /studio/retouch-tasks/{task_id}/qc-decision"
  - priority: 11
    category: business_referential
    check: "The claiming actor's TalentProfile exists and has talent_type == RETOUCHER."
    error_id: ERR_TALENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /studio/retouch-tasks/claim-next"
  - priority: 12
    category: state
    check: "Sample custody transition is declared for the current custody_state (including: not already RETURNED or LOST)."
    error_id: ERR_SAMPLE_INVALID_CUSTODY
    http_status: 409
    applies_to: "POST /studio/samples/{sample_id}/receive, /studio/samples/{sample_id}/custody-move, /studio/samples/{sample_id}/return, /studio/samples/{sample_id}/report-lost, /studio/samples/{sample_id}/match"
  - priority: 13
    category: state
    check: "session_state == BOOKED."
    error_id: ERR_SESSION_NOT_BOOKED
    http_status: 409
    applies_to: "POST /studio/shoot-sessions/{session_id}/lock, POST /studio/talent-bookings (target session), POST /studio/shot-list-items/{item_id}/assign (target session)"
  - priority: 14
    category: state
    check: "session_state == LOCKED."
    error_id: ERR_SESSION_NOT_LOCKED
    http_status: 409
    applies_to: "POST /studio/shoot-sessions/{session_id}/unlock, POST /studio/shoot-sessions/{session_id}/start"
  - priority: 15
    category: state
    check: "session_state == SHOOTING."
    error_id: ERR_SESSION_NOT_SHOOTING
    http_status: 409
    applies_to: "POST /studio/shoot-sessions/{session_id}/wrap, POST /studio/shoot-sessions/{session_id}/color-measurement, POST /studio/assets (the item's session)"
  - priority: 16
    category: state
    check: "session_state IN {BOOKED, LOCKED} (a WRAPPED or CANCELLED session cannot be cancelled again)."
    error_id: ERR_SESSION_TERMINAL
    http_status: 409
    applies_to: "POST /studio/shoot-sessions/{session_id}/cancel"
  - priority: 17
    category: state
    check: "booking_state == HELD for confirm; booking_state IN {HELD, CONFIRMED} for cancel."
    error_id: ERR_BOOKING_INVALID_STATE
    http_status: 409
    applies_to: "POST /studio/talent-bookings/{booking_id}/confirm, POST /studio/talent-bookings/{booking_id}/cancel"
  - priority: 18
    category: state
    check: "item_state == PLANNED for assign; item_state IN {PLANNED, BLOCKED} for waive."
    error_id: ERR_SHOT_ITEM_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "POST /studio/shot-list-items/{item_id}/assign, POST /studio/shot-list-items/{item_id}/waive"
  - priority: 19
    category: state
    check: "task_state IN {IN_PROGRESS, REWORK} for submit; task_state == SUBMITTED for qc-decision."
    error_id: ERR_RETOUCH_TASK_INVALID_STATE
    http_status: 409
    applies_to: "POST /studio/retouch-tasks/{task_id}/submit, POST /studio/retouch-tasks/{task_id}/qc-decision"
  - priority: 20
    category: state
    check: "asset_state == INGESTED for retouch-task creation; asset_state == APPROVED for delivery."
    error_id: "ERR_ASSET_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /studio/assets/{asset_id}/deliver, POST /studio/retouch-tasks"
  - priority: 21
    category: state
    check: "doc_state == PENDING and current logical clock < valid_until."
    error_id: ERR_RELEASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /studio/release-documents/{release_id}/sign"
  - priority: 22
    category: state
    check: "color_check_state == NOT_MEASURED (a session records exactly one color reading)."
    error_id: ERR_COLOR_ALREADY_MEASURED
    http_status: 409
    applies_to: "POST /studio/shoot-sessions/{session_id}/color-measurement"
  - priority: 23
    category: state
    check: "OCC: expected_session_version equals the target ShootSession.version."
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /studio/talent-bookings"
  - priority: 24
    category: state
    check: "OCC: expected_style_version equals the target Style.version."
    error_id: ERR_STALE_STYLE_VERSION
    http_status: 412
    applies_to: "POST /studio/shot-list-items"
  - priority: 30
    category: business_safety
    check: "The session's Station has calibrated_until != null AND calibrated_until > current logical clock at the moment of ingest."
    error_id: ERR_STATION_CALIBRATION_EXPIRED
    http_status: 409
    applies_to: "POST /studio/assets"
  - priority: 31
    category: business_safety
    check: "The session's color_check_state != FAIL."
    error_id: ERR_COLOR_CHECK_FAILED
    http_status: 409
    applies_to: "POST /studio/assets"
  - priority: 32
    category: business_safety
    check: "Cross-session consistency: abs(new composite - previous same-station PASS composite) <= COLOR_CONSISTENCY_DRIFT_MAX (0.75). Baseline selector: same station_id, color_check_state == PASS, scheduled_start < this session's scheduled_start, ranked scheduled_start DESC then created_at ASC, first row; no baseline means the check passes."
    error_id: ERR_COLOR_CONSISTENCY_DRIFT
    http_status: 422
    applies_to: "POST /studio/shoot-sessions/{session_id}/color-measurement"
  - priority: 33
    category: business_safety
    check: "The sample's Vendor.coordination_hold == false."
    error_id: ERR_VENDOR_COORDINATION_HOLD
    http_status: 409
    applies_to: "POST /studio/samples/{sample_id}/receive"
  - priority: 34
    category: business_constraint
    check: "style_number is unique across Style (case-sensitive, post-trim)."
    error_id: ERR_DUPLICATE_STYLE_NUMBER
    http_status: 409
    applies_to: "POST /studio/styles"
  - priority: 35
    category: business_constraint
    check: "Code uniqueness: Vendor.vendor_code, Station.station_code, StudioProvider.provider_code, Sample.barcode, AssetProfile.category and Asset.file_name are each unique within their entity."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /studio/vendors, /studio/stations, /studio/studio-providers, /studio/samples, /studio/asset-profiles, /studio/assets"
  - priority: 36
    category: business_constraint
    check: "(style_id, asset_kind, angle_code) is unique across ShotListItem rows whose item_state != WAIVED."
    error_id: ERR_DUPLICATE_SHOT_ITEM
    http_status: 409
    applies_to: "POST /studio/shot-list-items"
  - priority: 37
    category: business_constraint
    check: "Style.category equals AssetProfile.category of the referenced asset_profile_id."
    error_id: ERR_CATEGORY_PROFILE_MISMATCH
    http_status: 422
    applies_to: "POST /studio/styles"
  - priority: 38
    category: business_constraint
    check: "base_style_id integrity: colorway_code is present exactly when base_style_id is present; the referenced base Style has base_style_id == null; (base_style_id, colorway_code) is unique."
    error_id: ERR_INVALID_BASE_STYLE
    http_status: 422
    applies_to: "POST /studio/styles"
  - priority: 39
    category: business_temporal
    check: "Interval sanity: ShootSession.scheduled_end > scheduled_start and both fall on the same UTC date; ReleaseDocument.valid_until > valid_from; TalentBooking wrap_time > call_time with call_time >= session.scheduled_start and wrap_time <= session.scheduled_end."
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /studio/shoot-sessions, POST /studio/release-documents, POST /studio/talent-bookings"
  - priority: 40
    category: business_temporal
    check: "Station occupation geometry. Let B = Station.buffer_minutes and K = Station.max_concurrent_sessions. Existing sessions in session_state IN {BOOKED, LOCKED, SHOOTING, WRAPPED} on the same station occupy the BUFFER-EXTENDED half-open interval [scheduled_start, scheduled_end + B). The candidate is rejected when the number of existing occupations its own buffer-extended interval intersects is >= K."
    error_id: ERR_STATION_OVERLAP
    http_status: 409
    applies_to: "POST /studio/shoot-sessions"
  - priority: 41
    category: business_temporal
    check: "Talent occupation geometry (NO buffer, plain half-open): the candidate booking is rejected when an existing booking of the same talent in booking_state IN {HELD, CONFIRMED} satisfies new.call_time < existing.wrap_time AND existing.call_time < new.wrap_time. Exact adjacency (new.call_time == existing.wrap_time) is permitted."
    error_id: ERR_TALENT_OVERLAP
    http_status: 409
    applies_to: "POST /studio/talent-bookings"
  - priority: 42
    category: business_referential
    check: "role_on_set equals the referenced TalentProfile.talent_type."
    error_id: ERR_TALENT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /studio/talent-bookings"
  - priority: 43
    category: business_referential
    check: "Station type admits the item's asset_kind: ON_MODEL requires station_type == MODEL; STILL_ANGLE and DETAIL require station_type IN {MANNEQUIN, STILL_LIFE}; VIDEO requires station_type IN {MODEL, STILL_LIFE}."
    error_id: ERR_STATION_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /studio/shot-list-items/{item_id}/assign"
  - priority: 44
    category: business_referential
    check: "Style.style_number equals Sample.declared_style_number, unless mismatch_resolution is supplied."
    error_id: ERR_STYLE_NUMBER_MISMATCH
    http_status: 409
    applies_to: "POST /studio/samples/{sample_id}/match"
  - priority: 45
    category: business_referential
    check: "match_state == MATCHED before custody may advance to IN_STUDIO or ON_SET."
    error_id: ERR_SAMPLE_NOT_MATCHED
    http_status: 409
    applies_to: "POST /studio/samples/{sample_id}/custody-move"
  - priority: 46
    category: business_referential
    check: "For every Style referenced by a required ASSIGNED ShotListItem on the session, some Sample exists with matched_style_id == that Style, match_state == MATCHED and custody_state IN {IN_STUDIO, ON_SET}."
    error_id: ERR_SAMPLE_NOT_IN_STUDIO
    http_status: 409
    applies_to: "POST /studio/shoot-sessions/{session_id}/lock"
  - priority: 47
    category: business_referential
    check: "MODEL bookings need usage rights: a ReleaseDocument exists with talent_id == booking.talent_id, doc_state == SIGNED, valid_from <= booking.call_time and valid_until > booking.wrap_time. Selector when several qualify: scope rank DESC (FULL_BUYOUT > ECOM_PLUS_SOCIAL > ECOM_ONLY), then valid_until DESC, then created_at ASC."
    error_id: ERR_RELEASE_NOT_ON_FILE
    http_status: 422
    applies_to: "POST /studio/talent-bookings/{booking_id}/confirm"
  - priority: 48
    category: business_referential
    check: "The selected ReleaseDocument.scope rank >= ShootSession.required_usage_scope rank."
    error_id: ERR_RELEASE_SCOPE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /studio/talent-bookings/{booking_id}/confirm"
  - priority: 49
    category: business_referential
    check: "file_name equals the expansion of the style's AssetProfile.naming_pattern: {style_number}_{angle_code}_{seq} with seq = sequence_number zero-padded to 3 digits."
    error_id: ERR_ASSET_NAMING_VIOLATION
    http_status: 422
    applies_to: "POST /studio/assets"
  - priority: 50
    category: business_referential
    check: "metadata_tags contains every key in the style's AssetProfile.required_metadata_keys, each mapped to a non-empty string."
    error_id: ERR_ASSET_METADATA_INCOMPLETE
    http_status: 422
    applies_to: "POST /studio/assets"
  - priority: 51
    category: business_referential
    check: "No RetouchTask already exists for the asset in task_state IN {QUEUED, IN_PROGRESS, SUBMITTED, REWORK, APPROVED}."
    error_id: ERR_RETOUCH_TASK_EXISTS
    http_status: 409
    applies_to: "POST /studio/retouch-tasks"
  - priority: 52
    category: business_constraint
    check: "At least one ShotListItem with required == true and item_state == ASSIGNED references the session."
    error_id: ERR_SHOT_LIST_EMPTY
    http_status: 409
    applies_to: "POST /studio/shoot-sessions/{session_id}/lock"
  - priority: 53
    category: business_fiscal
    check: "Station daily capacity: sum of planned_minutes of the station's non-CANCELLED sessions whose scheduled_start falls on the same UTC date as the candidate, plus the candidate's own planned_minutes, must be <= Station.daily_capacity_minutes. Exact equality is allowed; only a strictly greater total is rejected."
    error_id: ERR_STATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /studio/shoot-sessions"
  - priority: 54
    category: business_fiscal
    check: "ShootSession.committed_talent_cost_cents + booking.charge_cents <= ShootSession.budget_cap_cents."
    error_id: ERR_SESSION_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /studio/talent-bookings/{booking_id}/confirm"
  - priority: 55
    category: business_constraint
    check: "The claim-next candidate pool (task_state == QUEUED with provider headroom) is non-empty."
    error_id: ERR_NO_CLAIMABLE_TASK
    http_status: 409
    applies_to: "POST /studio/retouch-tasks/claim-next"

endpoints:
  # ============================================================== READS (22)
  - method: GET
    path: /studio/vendors/{vendor_id}
    purpose: "Read one vendor with its outstanding-sample ledger and coordination hold."
    roles: [StudioAdmin, SampleCoordinator]
    input: []
    output: Vendor
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REFERENCE_NOT_FOUND]
  - method: GET
    path: /studio/asset-profiles/{profile_id}
    purpose: "Read one immutable per-category content requirement template."
    roles: [StudioAdmin, Producer, ContentOps]
    input: []
    output: AssetProfile
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REFERENCE_NOT_FOUND]
  - method: GET
    path: /studio/stations/{station_id}
    purpose: "Read one capture station with its capacity, buffer and calibration expiry."
    roles: [StudioAdmin, Producer]
    input: []
    output: Station
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REFERENCE_NOT_FOUND]
  - method: GET
    path: /studio/talent-profiles/{talent_id}
    purpose: "Read one bookable person with rate card and today's booked minutes."
    roles: [StudioAdmin, Producer]
    input: []
    output: TalentProfile
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REFERENCE_NOT_FOUND]
  - method: GET
    path: /studio/studio-providers/{provider_id}
    purpose: "Read one production source with its rates, SLA, quote and retouch load."
    roles: [StudioAdmin, Producer, ContentOps]
    input: []
    output: StudioProvider
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REFERENCE_NOT_FOUND]
  - method: GET
    path: /studio/styles/{style_id}
    purpose: "Read one style with its compound content_state and cost ledger."
    roles: [StudioAdmin, SampleCoordinator, Producer, ContentOps]
    input: []
    output: Style
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_STYLE_NOT_FOUND]
  - method: GET
    path: /studio/styles
    purpose: "List styles, filterable by vendor, asset profile, colorway parent, category, content state and priority tier."
    roles: [StudioAdmin, SampleCoordinator, Producer, ContentOps]
    input: ["vendor_id?", "asset_profile_id?", "base_style_id?", "category?", "content_state?", "priority_tier?", "limit?", "offset?"]
    output: Style[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /studio/styles/{style_id}/cost-summary
    purpose: "Computed read: the dual-variant cost per style (provisional vs final), the best outsourced quote, the variance and the recommended source. See calculations.cost_per_style."
    roles: [StudioAdmin, ContentOps]
    input: []
    output: "{ style_id: string, provisional_cost_cents: integer, final_cost_cents: integer, provisional_cost_per_asset_cents: integer, final_cost_per_asset_cents: integer, outsourced_quote_cents: integer, outsourced_provider_id: string, variance_cents: integer, recommended_source: string }"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_STYLE_NOT_FOUND]
  - method: GET
    path: /studio/samples/{sample_id}
    purpose: "Read one sample with both state axes, custody timestamps and lateness."
    roles: [StudioAdmin, SampleCoordinator, Producer]
    input: []
    output: Sample
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND]
  - method: GET
    path: /studio/samples
    purpose: "List samples, filterable by vendor, matched style and either state axis."
    roles: [StudioAdmin, SampleCoordinator, Producer]
    input: ["vendor_id?", "matched_style_id?", "custody_state?", "match_state?", "limit?", "offset?"]
    output: Sample[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /studio/release-documents/{release_id}
    purpose: "Read one usage-rights release with its scope and validity window."
    roles: [StudioAdmin, Producer]
    input: []
    output: ReleaseDocument
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REFERENCE_NOT_FOUND]
  - method: GET
    path: /studio/release-documents
    purpose: "List releases, filterable by talent, signature state and scope."
    roles: [StudioAdmin, Producer]
    input: ["talent_id?", "doc_state?", "scope?", "limit?", "offset?"]
    output: ReleaseDocument[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /studio/shoot-sessions/{session_id}
    purpose: "Read one session with its interval, cost commitment and color-check result."
    roles: [StudioAdmin, Producer, Photographer]
    input: []
    output: ShootSession
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND]
  - method: GET
    path: /studio/shoot-sessions
    purpose: "List sessions, filterable by station, provider, colour-measuring photographer, state and scheduled UTC date."
    roles: [StudioAdmin, Producer, Photographer]
    input: ["station_id?", "provider_id?", "color_measured_by_talent_id?", "session_state?", "scheduled_date?", "limit?", "offset?"]
    output: ShootSession[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /studio/talent-bookings/{booking_id}
    purpose: "Read one booking with its minute split, charge and pinned usage rights."
    roles: [StudioAdmin, Producer, Photographer]
    input: []
    output: TalentBooking
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_BOOKING_NOT_FOUND]
  - method: GET
    path: /studio/talent-bookings
    purpose: "List bookings, filterable by session, talent, pinned release, state and on-set role."
    roles: [StudioAdmin, Producer, Photographer]
    input: ["session_id?", "talent_id?", "release_document_id?", "booking_state?", "role_on_set?", "limit?", "offset?"]
    output: TalentBooking[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /studio/shot-list-items/{item_id}
    purpose: "Read one shot-list item with its state, live asset count and cost share."
    roles: [StudioAdmin, Producer, Photographer]
    input: []
    output: ShotListItem
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SHOT_ITEM_NOT_FOUND]
  - method: GET
    path: /studio/shot-list-items
    purpose: "List shot-list items, filterable by style, session, state, asset kind and required flag."
    roles: [StudioAdmin, Producer, Photographer]
    input: ["style_id?", "session_id?", "item_state?", "asset_kind?", "required?", "limit?", "offset?"]
    output: ShotListItem[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /studio/assets/{asset_id}
    purpose: "Read one asset with its naming, metadata, state and CMS key."
    roles: [StudioAdmin, Producer, Photographer, Retoucher, QCReviewer, ContentOps]
    input: []
    output: Asset
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ASSET_NOT_FOUND]
  - method: GET
    path: /studio/assets
    purpose: "List assets, filterable by shot-list item, session, capturing photographer and state."
    roles: [StudioAdmin, Producer, Photographer, Retoucher, QCReviewer, ContentOps]
    input: ["shot_list_item_id?", "session_id?", "captured_by_talent_id?", "asset_state?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: /studio/retouch-tasks/{task_id}
    purpose: "Read one retouch task with its queue score, SLA verdict and both turnaround variants."
    roles: [StudioAdmin, ContentOps, Retoucher, QCReviewer]
    input: []
    output: RetouchTask
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RETOUCH_TASK_NOT_FOUND]
  - method: GET
    path: /studio/retouch-tasks
    purpose: "List retouch tasks, filterable by asset, provider, assigned retoucher, task state and SLA state."
    roles: [StudioAdmin, ContentOps, Retoucher, QCReviewer]
    input: ["asset_id?", "provider_id?", "assigned_retoucher_id?", "task_state?", "sla_state?", "limit?", "offset?"]
    output: RetouchTask[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  # ================================================= WRITES: configuration (9)
  - method: POST
    path: /studio/_clock/set_current_utc
    purpose: "Test-driving endpoint: set the server's logical clock. Every datetime side effect (received_at, started_at, signed_at, delivered_at, claimed_at, submitted_at, approved_at, rework_started_at) and every temporal validation (release validity, station calibration, lateness, turnaround) reads this clock. The default logical clock before any call is constants_global.DEFAULT_CLOCK_UTC = 2026-08-01T00:00:00Z."
    roles: [StudioAdmin]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; lazily expires every ReleaseDocument in doc_state IN {PENDING, SIGNED} whose valid_until <= the new clock to EXPIRED"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: POST
    path: /studio/vendors
    purpose: "Register a merchandise vendor."
    roles: [StudioAdmin]
    input: [name, vendor_code, "sample_sla_days?", "contact_email?"]
    output: Vendor
    side_effects:
      - "outstanding_sample_count = 0, late_return_count = 0, coordination_hold = false"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_CODE]
  - method: POST
    path: /studio/asset-profiles
    purpose: "Register the immutable content requirement template for one merchandise category."
    roles: [StudioAdmin]
    input: [category, required_angles, required_detail_shots, min_on_model_shots, video_required, naming_pattern, required_metadata_keys]
    output: AssetProfile
    side_effects:
      - "none; AssetProfile is immutable (common_fields: false, no version, no update endpoint)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_CODE]
  - method: POST
    path: /studio/stations
    purpose: "Register a capture station with its daily capacity, teardown buffer, concurrency ceiling and calibration expiry."
    roles: [StudioAdmin]
    input: [station_code, station_type, daily_capacity_minutes, "buffer_minutes?", "max_concurrent_sessions?", "calibrated_until?"]
    output: Station
    side_effects:
      - "committed_minutes_today = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_CODE]
  - method: POST
    path: /studio/talent-profiles
    purpose: "Register a bookable person. Photographer and Retoucher actors authenticate with this row's id as X-User-ID."
    roles: [StudioAdmin]
    input: [full_name, talent_type, hourly_rate_cents, day_rate_cents, "agency_name?", "minimum_call_hours?", "max_daily_minutes?"]
    output: TalentProfile
    side_effects:
      - "booked_minutes_today = 0"
      - "requires_release = (talent_type == MODEL)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: POST
    path: /studio/studio-providers
    purpose: "Register an in-house or outsourced production source."
    roles: [StudioAdmin]
    input: [provider_code, provider_kind, station_hour_rate_cents, retouch_rate_cents_per_asset, sla_hours, quality_score, "style_quote_cents?", "capacity_assets_per_day?"]
    output: StudioProvider
    side_effects:
      - "assigned_asset_count = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_CODE]
  - method: POST
    path: /studio/styles
    purpose: "Register a style (or a colorway of an existing base style) that owes e-commerce content."
    roles: [StudioAdmin]
    input: [style_number, category, vendor_id, asset_profile_id, "base_style_id?", "colorway_code?", "priority_tier?"]
    output: Style
    side_effects:
      - "content_state = NOT_STARTED; required_item_count = 0; allocated_cost_cents = 0; delivered_asset_count = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_STYLE_NOT_FOUND, ERR_DUPLICATE_STYLE_NUMBER, ERR_CATEGORY_PROFILE_MISMATCH, ERR_INVALID_BASE_STYLE]
  - method: POST
    path: /studio/release-documents
    purpose: "Record an unsigned usage-rights release for a talent."
    roles: [StudioAdmin]
    input: [talent_id, scope, territory, valid_from, valid_until]
    output: ReleaseDocument
    side_effects:
      - "doc_state = PENDING; signed_at = null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_INVALID_TIME_WINDOW]
  - method: POST
    path: /studio/release-documents/{release_id}/sign
    purpose: "Countersign a pending release so it can cover MODEL bookings."
    roles: [StudioAdmin]
    input: []
    output: ReleaseDocument
    side_effects:
      - "doc_state PENDING -> SIGNED; set signed_at = current logical clock"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REFERENCE_NOT_FOUND, ERR_RELEASE_INVALID_STATE]

  # ======================================================= WRITES: samples (6)
  - method: POST
    path: /studio/samples
    purpose: "Pre-advise an inbound sample from a vendor's packing slip."
    roles: [SampleCoordinator]
    input: [barcode, vendor_id, declared_style_number]
    output: Sample
    side_effects:
      - "custody_state = EXPECTED; match_state = UNMATCHED; matched_style_id = null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_DUPLICATE_CODE]
  - method: POST
    path: /studio/samples/{sample_id}/receive
    purpose: "Book the physical box into the studio dock."
    roles: [SampleCoordinator]
    input: []
    output: Sample
    side_effects:
      - "custody_state EXPECTED -> RECEIVED; received_at = clock; due_return_at = received_at + Vendor.sample_sla_days days"
      - "Vendor.outstanding_sample_count += 1; increments Vendor.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_SAMPLE_INVALID_CUSTODY, ERR_VENDOR_COORDINATION_HOLD]
  - method: POST
    path: /studio/samples/{sample_id}/match
    purpose: "Reconcile the box against a style number. Omit mismatch_resolution to require an exact style-number match; pass HOLD to quarantine a mismatch, or ACCEPT_SUBSTITUTE to accept a vendor-coordinated substitution."
    roles: [SampleCoordinator]
    input: [style_id, "mismatch_resolution?"]
    output: Sample
    side_effects:
      - "match_state -> MATCHED (clean match or ACCEPT_SUBSTITUTE) with matched_style_id = style_id, or -> MISMATCH_HOLD (HOLD) leaving matched_style_id null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_STYLE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SAMPLE_INVALID_CUSTODY, ERR_STYLE_NUMBER_MISMATCH]
  - method: POST
    path: /studio/samples/{sample_id}/custody-move
    purpose: "Move the box along the custody axis: onto the rack (IN_STUDIO), onto set (ON_SET), back to the rack, or into the return queue (RETURN_PENDING)."
    roles: [SampleCoordinator]
    input: [to_state]
    output: Sample
    side_effects:
      - "custody_state -> to_state when the transition is declared"
      - "on RECEIVED -> IN_STUDIO: if the matched Style.content_state IN {NOT_STARTED, BLOCKED} then Style.content_state -> SAMPLE_READY and increments Style.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SAMPLE_INVALID_CUSTODY, ERR_SAMPLE_NOT_MATCHED]
  - method: POST
    path: /studio/samples/{sample_id}/return
    purpose: "Ship the box back to the vendor and settle lateness."
    roles: [SampleCoordinator]
    input: ["condition_note?"]
    output: Sample
    side_effects:
      - "custody_state RETURN_PENDING -> RETURNED; returned_at = clock; return_days_late per calculations.sample_return_lateness"
      - "Vendor.outstanding_sample_count -= 1; on lateness Vendor.late_return_count += 1 and coordination_hold flips at VENDOR_HOLD_STRIKES; increments Vendor.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_SAMPLE_INVALID_CUSTODY]
  - method: POST
    path: /studio/samples/{sample_id}/report-lost
    purpose: "Write the box off as lost, triggering the depth-4 block cascade over the matched style, its shot list and any session holding those items."
    roles: [SampleCoordinator]
    input: ["reason?"]
    output: Sample
    side_effects:
      - "custody_state -> LOST (from RECEIVED, IN_STUDIO, ON_SET or RETURN_PENDING); match_state untouched"
      - "L1 Vendor.outstanding_sample_count -= 1; Vendor.late_return_count += 1; coordination_hold flips at VENDOR_HOLD_STRIKES; increments Vendor.version by 1"
      - "L2 if no MATCHED sample of that Style remains IN_STUDIO/ON_SET: Style.content_state -> BLOCKED; increments Style.version by 1"
      - "L3 that Style's ShotListItems in {PLANNED, ASSIGNED} -> BLOCKED"
      - "L4 any session left with no required ASSIGNED/CAPTURED item auto-unlocks LOCKED -> BOOKED; increments ShootSession.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_SAMPLE_INVALID_CUSTODY]

  # ====================================================== WRITES: sessions (7)
  - method: POST
    path: /studio/shoot-sessions
    purpose: "Book an interval of occupation on a station. Enforces interval sanity, the station's buffer-extended overlap geometry with its concurrency ceiling, and the station's daily minute capacity."
    roles: [Producer]
    input: [station_id, provider_id, scheduled_start, scheduled_end, required_usage_scope, budget_cap_cents, "session_label?", "color_chart_code?", "color_tolerance_delta_e?"]
    output: ShootSession
    side_effects:
      - "session_state = BOOKED; planned_minutes = whole minutes of the interval"
      - "committed_talent_cost_cents = 0; color_check_state = NOT_MEASURED; color_patch_deltas = []"
      - "Station.committed_minutes_today += planned_minutes when scheduled_start falls on the clock's UTC date"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_REFERENCE_NOT_FOUND, ERR_INVALID_TIME_WINDOW, ERR_STATION_OVERLAP, ERR_STATION_CAPACITY_EXCEEDED]
  - method: POST
    path: /studio/shoot-sessions/{session_id}/lock
    purpose: "Freeze the call sheet. Requires at least one required ASSIGNED item and, for every style on it, a MATCHED sample physically in the building."
    roles: [Producer]
    input: []
    output: ShootSession
    side_effects:
      - "session_state BOOKED -> LOCKED; further shot-list assignment to this session is rejected"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND, ERR_SESSION_NOT_BOOKED, ERR_SHOT_LIST_EMPTY, ERR_SAMPLE_NOT_IN_STUDIO]
  - method: POST
    path: /studio/shoot-sessions/{session_id}/unlock
    purpose: "Reopen a frozen call sheet."
    roles: [Producer]
    input: []
    output: ShootSession
    side_effects:
      - "session_state LOCKED -> BOOKED; shot-list assignment permitted again"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND, ERR_SESSION_NOT_LOCKED]
  - method: POST
    path: /studio/shoot-sessions/{session_id}/cancel
    purpose: "Cancel a booked or locked session, releasing station capacity, crew and shot-list assignments."
    roles: [Producer]
    input: ["reason?"]
    output: ShootSession
    side_effects:
      - "session_state -> CANCELLED; L1 the session stops counting toward Station.committed_minutes_today"
      - "L2 every TalentBooking in {HELD, CONFIRMED} -> CANCELLED; committed_talent_cost_cents -> 0"
      - "L3 each affected TalentProfile.booked_minutes_today -= that booking's booked_minutes"
      - "every ASSIGNED ShotListItem on the session -> PLANNED with session_id cleared"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND, ERR_SESSION_TERMINAL]
  - method: POST
    path: /studio/shoot-sessions/{session_id}/start
    purpose: "Call the session to order. Only the photographer holding a CONFIRMED PHOTOGRAPHER booking on it may act."
    roles: [Photographer]
    input: []
    output: ShootSession
    side_effects:
      - "session_state LOCKED -> SHOOTING; started_at = current logical clock"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND, ERR_NOT_BOOKED_ON_SESSION, ERR_SESSION_NOT_LOCKED]
  - method: POST
    path: /studio/shoot-sessions/{session_id}/color-measurement
    purpose: "Submit the on-set color-chart reading. The composite is weighted by station type, compared inclusively against the session tolerance, and checked for drift against the station's previous PASS session."
    roles: [Photographer]
    input: [patch_deltas]
    output: ShootSession
    side_effects:
      - "color_patch_deltas = patch_deltas; color_composite_delta_e per calculations.color_composite_delta_e"
      - "color_check_state -> PASS when composite <= color_tolerance_delta_e, else FAIL"
      - "color_measured_at = clock; color_measured_by_talent_id = X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_NOT_BOOKED_ON_SESSION, ERR_SESSION_NOT_SHOOTING, ERR_COLOR_ALREADY_MEASURED, ERR_COLOR_CONSISTENCY_DRIFT]
  - method: POST
    path: /studio/shoot-sessions/{session_id}/wrap
    purpose: "Wrap the session, release the crew and post the in-house cost allocation onto every captured item and its style."
    roles: [Photographer]
    input: []
    output: ShootSession
    side_effects:
      - "session_state SHOOTING -> WRAPPED; wrapped_at = clock; actual_minutes = whole minutes since started_at"
      - "every CONFIRMED TalentBooking -> RELEASED"
      - "calculations.session_cost_allocation posts ShotListItem.allocated_cost_cents per CAPTURED item and adds each share into Style.allocated_cost_cents; increments Style.version by 1 per credited style"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND, ERR_NOT_BOOKED_ON_SESSION, ERR_SESSION_NOT_SHOOTING]

  # ====================================================== WRITES: bookings (3)
  - method: POST
    path: /studio/talent-bookings
    purpose: "Hold a person for part of a session. Optimistic concurrency against the parent session: expected_session_version must equal ShootSession.version."
    roles: [Producer]
    input: [session_id, talent_id, role_on_set, call_time, wrap_time, expected_session_version]
    output: TalentBooking
    side_effects:
      - "booking_state = HELD; booked_minutes = whole minutes of (wrap_time - call_time)"
      - "regular_minutes, overtime_minutes and charge_cents per calculations.talent_booking_charge"
      - "TalentProfile.booked_minutes_today += booked_minutes; increments TalentProfile.version by 1"
      - "increments ShootSession.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_SESSION_NOT_FOUND, ERR_REFERENCE_NOT_FOUND, ERR_SESSION_NOT_BOOKED, ERR_STALE_SESSION_VERSION, ERR_INVALID_TIME_WINDOW, ERR_TALENT_OVERLAP, ERR_TALENT_TYPE_MISMATCH]
  - method: POST
    path: /studio/talent-bookings/{booking_id}/confirm
    purpose: "Confirm a held booking. MODEL bookings require a SIGNED release covering the whole booked window with sufficient scope; the charge must fit inside the session budget."
    roles: [Producer]
    input: []
    output: TalentBooking
    side_effects:
      - "booking_state HELD -> CONFIRMED"
      - "for MODEL bookings: release_document_id and usage_rights_scope pinned from the selected release"
      - "ShootSession.committed_talent_cost_cents += charge_cents; increments ShootSession.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_BOOKING_NOT_FOUND, ERR_BOOKING_INVALID_STATE, ERR_SESSION_TERMINAL, ERR_RELEASE_NOT_ON_FILE, ERR_RELEASE_SCOPE_INSUFFICIENT, ERR_SESSION_BUDGET_EXCEEDED]
  - method: POST
    path: /studio/talent-bookings/{booking_id}/cancel
    purpose: "Cancel a held or confirmed booking, exactly reversing the minute and money ledgers it posted."
    roles: [Producer]
    input: ["reason?"]
    output: TalentBooking
    side_effects:
      - "booking_state -> CANCELLED"
      - "TalentProfile.booked_minutes_today -= booked_minutes; increments TalentProfile.version by 1"
      - "when it was CONFIRMED: ShootSession.committed_talent_cost_cents -= charge_cents; increments ShootSession.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_BOOKING_NOT_FOUND, ERR_BOOKING_INVALID_STATE]

  # ===================================================== WRITES: shot list (3)
  - method: POST
    path: /studio/shot-list-items
    purpose: "Define one shot the style owes. Optimistic concurrency against the parent style: expected_style_version must equal Style.version."
    roles: [Producer]
    input: [style_id, asset_kind, angle_code, estimated_minutes, expected_style_version, "required?"]
    output: ShotListItem
    side_effects:
      - "item_state = PLANNED; session_id = null; live_asset_count = 0; allocated_cost_cents = 0"
      - "Style.required_item_count += 1 when required == true; increments Style.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_STYLE_NOT_FOUND, ERR_STALE_STYLE_VERSION, ERR_DUPLICATE_SHOT_ITEM]
  - method: POST
    path: /studio/shot-list-items/{item_id}/assign
    purpose: "Put a planned item on a booked session's call sheet. The station type must admit the item's asset_kind."
    roles: [Producer]
    input: [session_id]
    output: ShotListItem
    side_effects:
      - "item_state PLANNED -> ASSIGNED; session_id set"
      - "if required == true and Style.content_state == SAMPLE_READY then Style.content_state -> SCHEDULED and increments Style.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SHOT_ITEM_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SHOT_ITEM_NOT_ASSIGNABLE, ERR_SESSION_NOT_BOOKED, ERR_STATION_TYPE_MISMATCH]
  - method: POST
    path: /studio/shot-list-items/{item_id}/waive
    purpose: "Waive a planned or blocked item so it no longer holds the style's content completion."
    roles: [Producer]
    input: ["reason?"]
    output: ShotListItem
    side_effects:
      - "item_state -> WAIVED (terminal)"
      - "Style.required_item_count -= 1 when required == true; increments Style.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SHOT_ITEM_NOT_FOUND, ERR_SHOT_ITEM_NOT_ASSIGNABLE]

  # ============================================== WRITES: assets & retouch (6)
  - method: POST
    path: /studio/assets
    purpose: "Ingest a captured file against an assigned shot-list item. Enforces station calibration, the session's color verdict, the naming pattern and the metadata contract."
    roles: [Photographer]
    input: [shot_list_item_id, file_name, sequence_number, metadata_tags]
    output: Asset
    side_effects:
      - "asset_state = INGESTED; session_id copied from the item; captured_by_talent_id = X-User-ID"
      - "ShotListItem.live_asset_count += 1; on 0 -> 1 the item ASSIGNED -> CAPTURED"
      - "when every required non-waived item of the Style is CAPTURED: Style.content_state -> SHOT and increments Style.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_SHOT_ITEM_NOT_FOUND, ERR_NOT_BOOKED_ON_SESSION, ERR_SHOT_ITEM_NOT_ASSIGNABLE, ERR_SESSION_NOT_SHOOTING, ERR_STATION_CALIBRATION_EXPIRED, ERR_COLOR_CHECK_FAILED, ERR_DUPLICATE_CODE, ERR_ASSET_NAMING_VIOLATION, ERR_ASSET_METADATA_INCOMPLETE]
  - method: POST
    path: /studio/retouch-tasks
    purpose: "Queue an ingested asset for post-production with a provider, pinning the effective turnaround service level."
    roles: [ContentOps]
    input: [asset_id, provider_id]
    output: RetouchTask
    side_effects:
      - "task_state = QUEUED; rework_count = 0; rework_hours_total = 0.00; sla_state = IN_SLA"
      - "sla_hours pinned per calculations.retouch_turnaround_hours (rushed for priority_tier A); due_at = Asset.created_at + sla_hours hours"
      - "Asset INGESTED -> IN_RETOUCH; StudioProvider.assigned_asset_count += 1; increments StudioProvider.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_ASSET_NOT_FOUND, ERR_REFERENCE_NOT_FOUND, ERR_ASSET_NOT_APPROVED, ERR_RETOUCH_TASK_EXISTS]
  - method: POST
    path: /studio/retouch-tasks/claim-next
    purpose: "Claim the highest-priority queued task the acting retoucher is eligible for. The server selects it by calculations.retouch_priority_score; the caller supplies no task id."
    roles: [Retoucher]
    input: []
    output: RetouchTask
    side_effects:
      - "the selected task QUEUED -> IN_PROGRESS; assigned_retoucher_id = X-User-ID; claimed_at = clock"
      - "if the asset's Style.content_state == SHOT then Style.content_state -> IN_POST and increments Style.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_TALENT_TYPE_MISMATCH, ERR_NO_CLAIMABLE_TASK]
  - method: POST
    path: /studio/retouch-tasks/{task_id}/submit
    purpose: "Hand retouched work to QC. Only the assigned retoucher may submit."
    roles: [Retoucher]
    input: ["note?"]
    output: RetouchTask
    side_effects:
      - "task_state {IN_PROGRESS, REWORK} -> SUBMITTED; submitted_at = clock"
      - "when leaving REWORK: rework_hours_total += hours since rework_started_at (two decimals); rework_started_at cleared"
      - "Asset IN_RETOUCH -> QC_PENDING"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RETOUCH_TASK_NOT_FOUND, ERR_TASK_NOT_ASSIGNED_TO_ACTOR, ERR_RETOUCH_TASK_INVALID_STATE]
  - method: POST
    path: /studio/retouch-tasks/{task_id}/qc-decision
    purpose: "Approve or reject submitted retouch work. The reviewer must not be the assigned retoucher. Rejection recycles the task until MAX_REWORK, then abandons it."
    roles: [QCReviewer]
    input: [decision, "note?"]
    output: RetouchTask
    side_effects:
      - "APPROVE: task_state -> APPROVED; approved_at = clock; turnaround_hours_gross, turnaround_hours_net and sla_state set per calculations.retouch_turnaround_hours; Asset -> APPROVED; StudioProvider.assigned_asset_count -= 1"
      - "REJECT below MAX_REWORK: task_state -> REWORK; rework_count += 1; rework_started_at = clock; Asset -> IN_RETOUCH"
      - "REJECT at MAX_REWORK: task_state -> ABANDONED; Asset -> REJECTED; ShotListItem.live_asset_count -= 1 and on 1 -> 0 the item CAPTURED -> ASSIGNED with Style SHOT -> SCHEDULED; StudioProvider.assigned_asset_count -= 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RETOUCH_TASK_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SEGREGATION_OF_DUTIES, ERR_RETOUCH_TASK_INVALID_STATE]
  - method: POST
    path: /studio/assets/{asset_id}/deliver
    purpose: "Publish an approved asset into the content management system, triggering the depth-4 delivery cascade."
    roles: [ContentOps]
    input: ["cms_collection?"]
    output: Asset
    side_effects:
      - "L1 asset_state APPROVED -> DELIVERED; delivered_at = clock; cms_asset_key = {Style.category}/{Style.style_number}/{file_name}"
      - "L2 Style.delivered_asset_count += 1; increments Style.version by 1"
      - "L3 when every required non-waived item of the Style owns a DELIVERED asset: Style.content_state IN_POST -> DELIVERED"
      - "L4 every Sample matched to that Style in custody IN_STUDIO/ON_SET -> RETURN_PENDING"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ASSET_NOT_FOUND, ERR_ASSET_NOT_APPROVED]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers missing or role unrecognised."
    trigger: "X-User-Role or X-User-ID absent/empty, or X-User-Role not one of the seven declared roles."
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    message: "This role may not call this endpoint."
    trigger: "X-User-Role is valid but not listed in the endpoint's roles."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body or query parameters are malformed."
    trigger: "Missing required field, wrong type, undeclared enum member, empty array where non-empty is required, out-of-range number, limit outside [1,100] or negative offset."
  - error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    message: "A referenced configuration record does not exist."
    trigger: "vendor_id, asset_profile_id, station_id, provider_id, talent_id or release_id does not resolve."
  - error_id: ERR_STYLE_NOT_FOUND
    http_status: 404
    message: "Style not found."
    trigger: "style_id in the path or body (including base_style_id) does not resolve."
  - error_id: ERR_SAMPLE_NOT_FOUND
    http_status: 404
    message: "Sample not found."
    trigger: "sample_id in the path does not resolve."
  - error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    message: "Shoot session not found."
    trigger: "session_id in the path or body does not resolve."
  - error_id: ERR_BOOKING_NOT_FOUND
    http_status: 404
    message: "Talent booking not found."
    trigger: "booking_id in the path does not resolve."
  - error_id: ERR_SHOT_ITEM_NOT_FOUND
    http_status: 404
    message: "Shot list item not found."
    trigger: "item_id in the path or shot_list_item_id in the body does not resolve."
  - error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    message: "Asset not found."
    trigger: "asset_id in the path or body does not resolve."
  - error_id: ERR_RETOUCH_TASK_NOT_FOUND
    http_status: 404
    message: "Retouch task not found."
    trigger: "task_id in the path does not resolve."
  - error_id: ERR_NOT_BOOKED_ON_SESSION
    http_status: 403
    message: "The acting photographer holds no confirmed photographer booking on this session."
    trigger: "start, wrap, color-measurement or asset ingest attempted by a TalentProfile without a CONFIRMED booking with role_on_set == PHOTOGRAPHER on the target session."
  - error_id: ERR_TASK_NOT_ASSIGNED_TO_ACTOR
    http_status: 403
    message: "Only the assigned retoucher may submit this task."
    trigger: "POST submit where X-User-ID != RetouchTask.assigned_retoucher_id."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The QC reviewer may not review their own retouch work."
    trigger: "POST qc-decision where X-User-ID == RetouchTask.assigned_retoucher_id."
  - error_id: ERR_TALENT_TYPE_MISMATCH
    http_status: 422
    message: "Talent type does not admit this role."
    trigger: "role_on_set != TalentProfile.talent_type at booking creation, or claim-next attempted by a talent whose talent_type != RETOUCHER."
  - error_id: ERR_SAMPLE_INVALID_CUSTODY
    http_status: 409
    message: "The sample's custody state does not allow this action."
    trigger: "Undeclared custody transition, or any action on a RETURNED / LOST sample."
  - error_id: ERR_SESSION_NOT_BOOKED
    http_status: 409
    message: "The session must be in BOOKED state."
    trigger: "lock, booking creation or shot-list assignment against a session that is LOCKED, SHOOTING, WRAPPED or CANCELLED."
  - error_id: ERR_SESSION_NOT_LOCKED
    http_status: 409
    message: "The session must be in LOCKED state."
    trigger: "unlock or start against a session that is not LOCKED."
  - error_id: ERR_SESSION_NOT_SHOOTING
    http_status: 409
    message: "The session must be in SHOOTING state."
    trigger: "wrap, color-measurement or asset ingest against a session that is not SHOOTING."
  - error_id: ERR_SESSION_TERMINAL
    http_status: 409
    message: "The session has already reached a terminal state."
    trigger: "cancel against a WRAPPED or CANCELLED session, or confirm of a booking whose session is WRAPPED / CANCELLED."
  - error_id: ERR_BOOKING_INVALID_STATE
    http_status: 409
    message: "The booking's state does not allow this action."
    trigger: "confirm of a booking that is not HELD, or cancel of a booking that is RELEASED or CANCELLED."
  - error_id: ERR_SHOT_ITEM_NOT_ASSIGNABLE
    http_status: 409
    message: "The shot list item's state does not allow this action."
    trigger: "assign of an item that is not PLANNED, waive of an item that is not PLANNED or BLOCKED, or asset ingest against an item that is not ASSIGNED or CAPTURED."
  - error_id: ERR_RETOUCH_TASK_INVALID_STATE
    http_status: 409
    message: "The retouch task's state does not allow this action."
    trigger: "submit of a task that is not IN_PROGRESS or REWORK, or qc-decision on a task that is not SUBMITTED."
  - error_id: ERR_ASSET_NOT_APPROVED
    http_status: 409
    message: "The asset's state does not allow this action."
    trigger: "deliver of an asset that is not APPROVED, or retouch-task creation for an asset that is not INGESTED."
  - error_id: ERR_RELEASE_INVALID_STATE
    http_status: 409
    message: "The release cannot be signed in its current state."
    trigger: "sign of a release that is already SIGNED or EXPIRED, or whose valid_until is at or before the current logical clock."
  - error_id: ERR_COLOR_ALREADY_MEASURED
    http_status: 409
    message: "A colour reading has already been recorded for this session."
    trigger: "second color-measurement on a session whose color_check_state is PASS or FAIL."
  - error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    message: "expected_session_version does not match the session's current version."
    trigger: "POST /studio/talent-bookings with a stale expected_session_version."
  - error_id: ERR_STALE_STYLE_VERSION
    http_status: 412
    message: "expected_style_version does not match the style's current version."
    trigger: "POST /studio/shot-list-items with a stale expected_style_version."
  - error_id: ERR_STATION_CALIBRATION_EXPIRED
    http_status: 409
    message: "The station's colour calibration has lapsed."
    trigger: "Asset ingest when Station.calibrated_until is null or at/before the current logical clock."
  - error_id: ERR_COLOR_CHECK_FAILED
    http_status: 409
    message: "The session's on-set colour check failed; capture may not be ingested."
    trigger: "Asset ingest when the session's color_check_state == FAIL."
  - error_id: ERR_COLOR_CONSISTENCY_DRIFT
    http_status: 422
    message: "Colour reading drifts too far from this station's previous passing session."
    trigger: "color-measurement whose composite differs from the station's previous PASS composite by more than COLOR_CONSISTENCY_DRIFT_MAX."
  - error_id: ERR_VENDOR_COORDINATION_HOLD
    http_status: 409
    message: "The vendor is on coordination hold; no further sample receipts are accepted."
    trigger: "receive of a sample whose Vendor.coordination_hold == true."
  - error_id: ERR_DUPLICATE_STYLE_NUMBER
    http_status: 409
    message: "style_number already exists."
    trigger: "POST /studio/styles with an existing style_number."
  - error_id: ERR_DUPLICATE_CODE
    http_status: 409
    message: "A uniquely-constrained code already exists."
    trigger: "Duplicate vendor_code, station_code, provider_code, AssetProfile.category, Sample.barcode or Asset.file_name."
  - error_id: ERR_DUPLICATE_SHOT_ITEM
    http_status: 409
    message: "This style already owes that asset kind at that angle."
    trigger: "POST /studio/shot-list-items duplicating (style_id, asset_kind, angle_code) among non-WAIVED items."
  - error_id: ERR_CATEGORY_PROFILE_MISMATCH
    http_status: 422
    message: "The asset profile governs a different category."
    trigger: "POST /studio/styles where Style.category != AssetProfile.category."
  - error_id: ERR_INVALID_BASE_STYLE
    http_status: 422
    message: "Colorway parentage is invalid."
    trigger: "colorway_code without base_style_id (or the reverse), a base style that itself has a base_style_id, or a duplicate (base_style_id, colorway_code)."
  - error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    message: "The supplied interval is not a valid window."
    trigger: "scheduled_end <= scheduled_start or a session spanning two UTC dates; valid_until <= valid_from; wrap_time <= call_time; or a booking window outside its session's interval."
  - error_id: ERR_STATION_OVERLAP
    http_status: 409
    message: "The station is already occupied for that interval."
    trigger: "Session creation whose buffer-extended interval intersects max_concurrent_sessions existing occupations on the station."
  - error_id: ERR_TALENT_OVERLAP
    http_status: 409
    message: "The talent is already booked for an overlapping interval."
    trigger: "Booking creation strictly overlapping another HELD/CONFIRMED booking of the same talent (exact adjacency is allowed)."
  - error_id: ERR_STATION_TYPE_MISMATCH
    http_status: 422
    message: "The session's station cannot shoot that asset kind."
    trigger: "Assignment of ON_MODEL to a non-MODEL station, STILL_ANGLE/DETAIL to a MODEL station, or VIDEO to a MANNEQUIN station."
  - error_id: ERR_STYLE_NUMBER_MISMATCH
    http_status: 409
    message: "The sample's declared style number does not match the style."
    trigger: "match without mismatch_resolution where Style.style_number != Sample.declared_style_number."
  - error_id: ERR_SAMPLE_NOT_MATCHED
    http_status: 409
    message: "The sample must be matched to a style before it can move onto the rack or onto set."
    trigger: "custody-move to IN_STUDIO or ON_SET while match_state != MATCHED."
  - error_id: ERR_SAMPLE_NOT_IN_STUDIO
    http_status: 409
    message: "A matched sample for every scheduled style must be physically in the studio."
    trigger: "lock where some style on the call sheet has no MATCHED sample in custody IN_STUDIO or ON_SET."
  - error_id: ERR_RELEASE_NOT_ON_FILE
    http_status: 422
    message: "No signed release covers this model's booked window."
    trigger: "confirm of a MODEL booking with no SIGNED ReleaseDocument whose window covers [call_time, wrap_time]."
  - error_id: ERR_RELEASE_SCOPE_INSUFFICIENT
    http_status: 422
    message: "The release's usage scope is narrower than the session requires."
    trigger: "confirm where the selected release's scope rank < ShootSession.required_usage_scope rank."
  - error_id: ERR_ASSET_NAMING_VIOLATION
    http_status: 422
    message: "file_name does not match the category's naming pattern."
    trigger: "Asset ingest where file_name != {style_number}_{angle_code}_{seq zero-padded to 3}."
  - error_id: ERR_ASSET_METADATA_INCOMPLETE
    http_status: 422
    message: "Required metadata keys are missing or empty."
    trigger: "Asset ingest where metadata_tags omits a key in AssetProfile.required_metadata_keys or maps one to an empty string."
  - error_id: ERR_RETOUCH_TASK_EXISTS
    http_status: 409
    message: "This asset already has a live retouch task."
    trigger: "POST /studio/retouch-tasks for an asset with a task in QUEUED, IN_PROGRESS, SUBMITTED, REWORK or APPROVED."
  - error_id: ERR_SHOT_LIST_EMPTY
    http_status: 409
    message: "The session has no required shot assigned."
    trigger: "lock of a session with no required ASSIGNED ShotListItem."
  - error_id: ERR_STATION_CAPACITY_EXCEEDED
    http_status: 409
    message: "The station's daily minute capacity would be exceeded."
    trigger: "Session creation where same-date non-cancelled planned minutes plus the candidate's exceed Station.daily_capacity_minutes."
  - error_id: ERR_SESSION_BUDGET_EXCEEDED
    http_status: 409
    message: "Confirming this booking would exceed the session's talent budget."
    trigger: "confirm where committed_talent_cost_cents + charge_cents > budget_cap_cents."
  - error_id: ERR_NO_CLAIMABLE_TASK
    http_status: 409
    message: "No queued retouch task is currently claimable."
    trigger: "claim-next with an empty eligible candidate pool (nothing QUEUED, or every candidate's provider is at capacity)."

roles:
  - name: StudioAdmin
    identity: opaque
    description: "Configures the studio's reference data: vendors, content profiles, stations, talent, providers, styles and releases. Reads everything except the retoucher-facing queue actions."
    exclusive_operations:
      - "POST /studio/_clock/set_current_utc"
      - "POST /studio/vendors"
      - "POST /studio/asset-profiles"
      - "POST /studio/stations"
      - "POST /studio/talent-profiles"
      - "POST /studio/studio-providers"
      - "POST /studio/styles"
      - "POST /studio/release-documents"
      - "POST /studio/release-documents/{release_id}/sign"
    shared_operations:
      - "All GET endpoints"
  - name: SampleCoordinator
    identity: opaque
    description: "Owns the physical sample pipeline: intake, style-number matching and vendor coordination, custody moves, returns and loss write-offs."
    exclusive_operations:
      - "POST /studio/samples"
      - "POST /studio/samples/{sample_id}/receive"
      - "POST /studio/samples/{sample_id}/match"
      - "POST /studio/samples/{sample_id}/custody-move"
      - "POST /studio/samples/{sample_id}/return"
      - "POST /studio/samples/{sample_id}/report-lost"
    shared_operations:
      - "GET /studio/vendors/{vendor_id}"
      - "GET /studio/styles, GET /studio/styles/{style_id}"
      - "GET /studio/samples, GET /studio/samples/{sample_id}"
  - name: Producer
    identity: opaque
    description: "Plans capacity and crews the floor: books sessions, locks and unlocks call sheets, cancels, books and confirms talent, and defines and assigns the shot list."
    exclusive_operations:
      - "POST /studio/shoot-sessions"
      - "POST /studio/shoot-sessions/{session_id}/lock"
      - "POST /studio/shoot-sessions/{session_id}/unlock"
      - "POST /studio/shoot-sessions/{session_id}/cancel"
      - "POST /studio/talent-bookings"
      - "POST /studio/talent-bookings/{booking_id}/confirm"
      - "POST /studio/talent-bookings/{booking_id}/cancel"
      - "POST /studio/shot-list-items"
      - "POST /studio/shot-list-items/{item_id}/assign"
      - "POST /studio/shot-list-items/{item_id}/waive"
    shared_operations:
      - "GET /studio/asset-profiles/{profile_id}, GET /studio/stations/{station_id}, GET /studio/talent-profiles/{talent_id}, GET /studio/studio-providers/{provider_id}"
      - "GET /studio/release-documents and its detail read"
      - "GET /studio/styles, /studio/samples, /studio/shoot-sessions, /studio/talent-bookings, /studio/shot-list-items, /studio/assets and their detail reads"
  - name: Photographer
    identity: "entity_backed:TalentProfile"
    description: "The person behind the camera. X-User-ID must be the TalentProfile.id of a photographer holding a CONFIRMED PHOTOGRAPHER booking on the session being acted upon."
    exclusive_operations:
      - "POST /studio/shoot-sessions/{session_id}/start"
      - "POST /studio/shoot-sessions/{session_id}/wrap"
      - "POST /studio/shoot-sessions/{session_id}/color-measurement"
      - "POST /studio/assets"
    shared_operations:
      - "GET /studio/shoot-sessions, /studio/talent-bookings, /studio/shot-list-items, /studio/assets and their detail reads"
  - name: Retoucher
    identity: "entity_backed:TalentProfile"
    description: "Post-production operator. X-User-ID must be the TalentProfile.id of a talent whose talent_type == RETOUCHER; claims from the shared queue and may only submit tasks assigned to itself."
    exclusive_operations:
      - "POST /studio/retouch-tasks/claim-next"
      - "POST /studio/retouch-tasks/{task_id}/submit"
    shared_operations:
      - "GET /studio/retouch-tasks, GET /studio/retouch-tasks/{task_id}"
      - "GET /studio/assets, GET /studio/assets/{asset_id}"
  - name: QCReviewer
    identity: opaque
    description: "Quality gatekeeper. X-User-ID is compared against RetouchTask.assigned_retoucher_id to enforce segregation of duties, so a QCReviewer whose id equals the assigned retoucher's is rejected."
    exclusive_operations:
      - "POST /studio/retouch-tasks/{task_id}/qc-decision"
    shared_operations:
      - "GET /studio/retouch-tasks, GET /studio/retouch-tasks/{task_id}"
      - "GET /studio/assets, GET /studio/assets/{asset_id}"
  - name: ContentOps
    identity: opaque
    description: "Owns the post-production queue and CMS delivery: queues assets for retouching and publishes approved assets."
    exclusive_operations:
      - "POST /studio/retouch-tasks"
      - "POST /studio/assets/{asset_id}/deliver"
    shared_operations:
      - "GET /studio/asset-profiles/{profile_id}, GET /studio/studio-providers/{provider_id}"
      - "GET /studio/styles, GET /studio/styles/{style_id}, GET /studio/styles/{style_id}/cost-summary"
      - "GET /studio/assets, /studio/retouch-tasks and their detail reads"
