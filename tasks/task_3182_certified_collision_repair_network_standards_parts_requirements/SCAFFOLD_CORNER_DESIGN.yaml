          latitude: 34.0
          longitude: -81.03
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          v0: $.data.version
      - call: POST /network/requirements
        payload:
          requirement_code: EQ-CON-01
          category: EQUIPMENT
          description: x
          severity_if_failed: MINOR
          effective_from: '2026-08-01T00:00:00Z'
        as: NetworkAdmin
        captures:
          req_id: $.data.id
      - call: POST /network/requirements/${req_id}/publish
        payload: {}
        as: NetworkAdmin
      - call: POST /network/shops/${shop_id}/attestations
        payload:
          requirement_id: ${req_id}
          evidence_uri: s3://ev/c1.pdf
          expected_shop_version: ${v0}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          att1: $.data.id
      trigger:
      - call: GET /network/shops/${shop_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          v1: $.data.version
      - call: POST /network/shops/${shop_id}/attestations
        payload:
          requirement_id: ${req_id}
          evidence_uri: s3://ev/c2.pdf
