              captures: { order_b: $.data.id }
            - call: "POST /customer-orders/${order_b}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: $.data.id }
            - call: "GET /customer-orders/${order_b}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { vb: $.data.version }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_2}", customer_order_id: "${order_b}", units: 2, expected_order_version: "${vb}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_b: $.data.id }
            - call: "POST /slot-bookings/${booking_b}/confirm"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_1}", wave_code: "WA", cutoff_at: "2026-08-05T08:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_a: $.data.id }
            - call: "POST /delivery-waves/${wave_a}/slot-orders"
              payload: { customer_order_id: "${order_a}" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_a}/start-picking"
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves"
              payload: { route_id: "${route_id}", delivery_slot_id: "${slot_2}", wave_code: "WB", cutoff_at: "2026-08-05T12:00:00.000Z" }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { wave_b: $.data.id }
            - call: "POST /delivery-waves/${wave_b}/slot-orders"
              payload: { customer_order_id: "${order_b}" }
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "POST /delivery-waves/${wave_b}/start-picking"
              as: WavePlanner
              as_user_id: "planner-1"
