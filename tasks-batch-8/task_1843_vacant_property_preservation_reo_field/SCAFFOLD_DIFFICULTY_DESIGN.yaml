            - { call: "POST /preservation/code-violations", payload: { property_id: "${p}", citation_number: "CV-200", violation_class: "MAJOR", daily_fine_cents: 1000, fine_cap_cents: 100000, cure_deadline: "2026-08-10" }, as: VendorAdmin, captures: { cv: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "CODE_CURE", due_date: "2026-08-09", code_violation_id: "${cv}" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/code-violations/${cv}/start-cure", payload: { work_order_id: "${wo}" }, as: VendorAdmin, captures: { err: $.data.error_id } }
          assert:
