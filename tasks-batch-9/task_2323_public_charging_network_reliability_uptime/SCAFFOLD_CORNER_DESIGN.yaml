              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /uptime-reports"
              payload: { station_id: "${st1_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp_id: $.data.id }
