            - "All three installments are VOIDED; none was left SCHEDULED"
            - "RecommendationSlot slot1 status VOIDED with awarded_amount_cents 0"
            - "Application status NOT_AWARDED with notified_at re-stamped at the current clock 2026-10-16T00:00:00Z"
            - "Artist active_award_count 0 and prior_award_count 0 (a rescinded award never counts as prior)"
            - "DisciplineCategory committed_cents 0 and funded_application_count 0, while eligible_application_count stays 1"
            - "Cycle funded_total_cents 0, admin_assessment_rate 0, admin_assessment_cents 0, committed_cents 0"
            - "Cycle reserve_cents 0 (status AWARDED releases the reserve) so available_cents is the full 6000000 and posture is OPEN"

      - name: anonymity_breach_freezes_cycle_and_blocks_disbursement_until_redaction
        grounds:
          - state_machines.Application.anonymity_status.SEALED_to_BREACHED
          - state_machines.PaymentInstallment.SCHEDULED_to_RELEASED
          - calculations.cycle_budget_posture
          - validations[priority=70]
        distinguishing_aspect: |
          Flagging a work sample after the award is accepted must raise
          cycle.unresolved_breach_count, flip posture to FROZEN and make the fiscal officer's
          release fail with ERR_CYCLE_POSTURE_FROZEN even though the installment is due and
