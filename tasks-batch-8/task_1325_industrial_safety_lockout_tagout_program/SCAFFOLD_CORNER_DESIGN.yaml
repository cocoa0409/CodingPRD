              payload: { employee_no: "E-MGR-IMX", full_name: "Mgr IMX", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-IMX", full_name: "W1 IMX", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /training-records"
              payload: { employee_id: "${w1}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t1: $.data.id }
            - call: "POST /training-records/${t1}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "A-IMX-1", name: "Press", area: "Bay 45", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "240V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv: $.data.id }
            - call: "POST /energy-surveys/${sv}/submit"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /energy-surveys/${sv}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${m}", survey_id: "${sv}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { p: $.data.id }
            - call: "POST /lockout-procedures/${p}/activate"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-sessions"
              payload: { machine_id: "${m}", procedure_id: "${p}", session_type: "INDIVIDUAL" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { s: $.data.id }
            - call: "POST /employee-locks"
              payload: { session_id: "${s}", lock_no: "L-IMX-1", tag_no: "T-IMX-1" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { l1: $.data.id }
            - call: "POST /employee-locks/${l1}/apply"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
          trigger:
            - call: "POST /lockout-sessions/${s}/lock"
              payload: { zero_energy_verified: true }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { st: $.data.status, started: $.data.started_at }
          assert:
            - "Lock response itself: ${st} == LOCKED, zero_energy_verified == true, ${started} == 2026-08-01T00:00:00Z"
            - "LockoutSession.${s}.applied_lock_count == 1 in the same response"
