              captures: { mem_z: "$.data.id", mem_z_weight: "$.data.slot_weight" }
          assert:
            - "the first create response error_id == ERR_PANEL_CAPACITY_EXCEEDED with HTTP status 409"
            - "at clock 2026-06-01, GET /peds/physicians/${doc_id}/panel reports weighted_occupancy == 4.0 and available_panel_weight == 0.5"
            - "at clock 2026-07-01, GET /peds/physicians/${doc_id}/panel reports weighted_occupancy == 3.5 and available_panel_weight == 1.0"
            - "Membership.${mem_x}.slot_weight == 2.0 at clock 2026-06-01 and == 1.5 at clock 2026-07-01"
            - "Membership.${mem_y}.slot_weight == 2.0 at both clock positions"
            - "the second create response HTTP status == 201 and Membership.${mem_z}.slot_weight == 1.0"
            - "after the accepted create, GET /peds/physicians/${doc_id}/panel reports weighted_occupancy == 4.5 and available_panel_weight == 0.0"
            - "GET /peds/memberships filtered by physician_id ${doc_id} returns exactly 3 rows"

      - name: newborn_with_empty_dose_set_is_vacuously_complete_until_day_thirty
        grounds:
          - calculations.immunization_completeness_for_age
          - calculations.form_issuance_gate
          - entities.Child.fields.immunization_complete_for_age
          - entities.FormRequest.fields.blocked_reason
          - state_machines.FormRequest.PENDING_to_BLOCKED
        distinguishing_aspect: |
          Empty-collection boundary on POST /peds/form-requests - a different
          metric and a different endpoint from the panel-capacity instance. A
          child with ZERO ImmunizationDose rows has required(HEPB) == 0 and
          required(DTAP) == 0 at age_days 26, so immunization_complete_for_age is
          vacuously true and the gate passes; four days later at age_days exactly
          30 the first HEPB position becomes required (0 + 30 <= 30, inclusive),
          the same empty dose set now fails, and an identical request is created
          BLOCKED with blocked_reason IMMUNIZATION_INCOMPLETE.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T00:00:00Z after the setup chain"
            - "One PLUS plan with form_sla_hours 72, one physician with panel_slot_cap 20.0"
            - "One family, one child born 2026-05-20, an ACTIVE membership started 2026-06-01 with the June invoice of 40000 cents PAID, and ZERO immunization doses on record"
            - "The M1 well visit completed on 2026-06-15 inside its 2026-06-12 to 2026-07-03 window"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
