  - rule_id: cross_entity_state_dependency
    instances:
      - name: line_run_start_requires_shift_running
        grounds:
          - state_machines.LineRun.QUEUED_to_RUNNING
          - errors[ERR_SHIFT_NOT_RUNNING]
        distinguishing_aspect: |
          Pair LineRun -> ProductionShift: the run's QUEUED -> RUNNING transition is
          gated on the OWNING shift's status == RUNNING; starting while the shift is
          still SCHEDULED fails with ERR_SHIFT_NOT_RUNNING.
        test_recipe:
          setup:
            - "EV-1; shift created but never opened; lot FL-100 booked; run R1 QUEUED (planned 175 within base cap)"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id } }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
