    code: 200
    input: ["product_id?", "state_code?", "status?", "limit?", "offset?"]
    output: "StateRegulatoryProfile[]"
    side_effects: []

  - method: POST
    path: "/state-profiles/{profileId}/suspend"
    description: "Suspend a profile (blocks new filings)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StateRegulatoryProfile
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/state-profiles/{profileId}/reactivate"
