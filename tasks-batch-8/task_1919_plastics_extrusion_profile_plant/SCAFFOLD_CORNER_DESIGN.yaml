            - "WorkOrder.${wo}.produced_good_length_m == 4500.5 (stays IN_PRODUCTION: 4500.5 < 6000)"

  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected ERR_UNAUTHENTICATED / 401 before any role or existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED with http 401"

      - name: customer_create_forbidden_for_operator
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - "errors[ERR_UNAUTHORIZED_ROLE]"
          - roles
        distinguishing_aspect: "LineOperator lacks the customers create permission: ERR_UNAUTHORIZED_ROLE / 403."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE with http 403"

      - name: role_checked_before_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "A forbidden-role call against a nonexistent die id returns ERR_UNAUTHORIZED_ROLE (priority 2), not ERR_NOT_FOUND (priority 3)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /dies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/transition"
              payload: { to: "TRIAL" }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (role gate precedes existence)"

      - name: let_down_ratio_boundaries
        claim_type: satisfaction_and_violation
        grounds:
          - validations[priority=14]
          - "errors[ERR_LET_DOWN_RANGE]"
        distinguishing_aspect: "Inclusive range [10.0, 50.0]: 9.9 and 50.1 rejected ERR_LET_DOWN_RANGE; exactly 10.0 and exactly 50.0 accepted."
        test_recipe:
          setup: ["Customer and profile exist"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
            - call: "POST /profiles"
              payload: { customer_id: "${cust}", profile_code: "P-100", critical_dimensions: [{ name: "wall", nominal_mm: 2.0, tol_plus_mm: 0.1, tol_minus_mm: 0.1, ucl_mm: 2.05, lcl_mm: 1.95 }], spc_subgroup_size: 3, sample_every_m: 2000, resin_content_kg_per_m: 0.8, min_line_speed_mpm: 10, max_line_speed_mpm: 40 }
              as: ProcessEngineer
              captures: { prof: $.data.id }
          trigger:
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-LOW", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 9.9, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { err_lo: $.data.error_id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-MIN", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 10.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { f_min: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-MAX", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 50.0, max_regrind_pct: 40 }
              as: ProcessEngineer
              captures: { f_max: $.data.id }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-HIGH", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 50.1, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { err_hi: $.data.error_id }
          assert:
            - "err_lo == ERR_LET_DOWN_RANGE and err_hi == ERR_LET_DOWN_RANGE"
            - "Formulation.${f_min} created with let_down_ratio 10.0 and Formulation.${f_max} with 50.0 (inclusive bounds)"

