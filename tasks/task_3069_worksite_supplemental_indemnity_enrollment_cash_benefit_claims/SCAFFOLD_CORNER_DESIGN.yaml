            - { call: "POST /benefit-schedules/${schd3}/publish", payload: { expected_series_version: "${sd3_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${sd3}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gd2}", counselor_id: "${cd1}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cd_gi: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cd_gi}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${gd2}", counselor_id: "${cd2}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: false }, as: BenefitCounselor, captures: { cd_ngi: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${gd2}", employee_ref: "ED2", full_name: "Emp GD", hire_date: "2026-01-01T00:00:00Z", preexisting_diagnosis_codes: ["E11.9"] }, as: GroupAdmin, captures: { ed2: $.data.id } }
