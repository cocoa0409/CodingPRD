  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_cross_district_buffer_rejects_touching_windows
        grounds:
          - calculations.inspector_window_occupancy
          - validations[priority=66]
          - errors[ERR_INSPECTOR_WINDOW_CONFLICT]
          - entities.InspectionOrder.fields.scheduled_start_at
          - entities.Inspector.fields.active_assignment_count
        distinguishing_aspect: |
          Interval semantics here are pairwise half-open windows widened by a conditional
          TRAVEL_BUFFER_MINUTES 45 travel buffer on the Inspector resource: two windows that merely
          touch at 11:00Z are accepted inside one district (buffer 0) and refused across districts
          (buffer 45), so adjacency itself flips the verdict.
        test_recipe:
          setup:
            - "Districts T-NORTH and T-SOUTH both in state MT, one inspector homed in T-NORTH with max_daily_assignments 3."
            - "Order 1 in T-NORTH is SCHEDULED for 2026-08-10T09:00:00Z to 2026-08-10T11:00:00Z, so the inspector's version is 2."
            - "Order 2 in T-SOUTH and order 3 in T-NORTH are both REQUESTED with requested windows of 2026-08-10T08:00:00Z to 2026-08-10T17:00:00Z."
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Divide Creek Cattle", mailing_state: "MT", contact_email: "divide@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-NORTH", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_n: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-SOUTH", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_s: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "B-871", home_territory_id: "${terr_n}", certification_expires_on: "2027-12-31T00:00:00Z", max_daily_assignments: 3 }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_n}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_s}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_2: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_n}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_3: "$.data.id" }
            - call: "GET /brand-inspection/inspectors/${insp_1}"
              payload: {}
              as: BoardAdmin
              captures: { insp_1_v2: "$.data.version" }
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_2}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T11:00:00Z", scheduled_end_at: "2026-08-10T13:00:00Z", expected_inspector_version: "${insp_1_v2}" }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_3}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T11:00:00Z", scheduled_end_at: "2026-08-10T13:00:00Z", expected_inspector_version: "${insp_1_v2}" }
              as: BoardAdmin
              captures: { ord3_status: "$.data.schedule_status", ord3_start: "$.data.scheduled_start_at" }
          assert:
            - "${insp_1_v2} == 2"
            - "the cross-district call responds HTTP 409 and ${err_id} == ERR_INSPECTOR_WINDOW_CONFLICT"
            - "InspectionOrder.${ord_2}.schedule_status == REQUESTED and InspectionOrder.${ord_2}.inspector_id == null"
            - "${ord3_status} == SCHEDULED"
            - "${ord3_start} == 2026-08-10T11:00:00.000Z"
            - "Inspector.${insp_1}.version == 3"
            - "Inspector.${insp_1}.active_assignment_count == 2"

      - name: facility_aggregate_capacity_rejects_overlapping_impound
        grounds:
          - calculations.facility_occupancy_projection
          - validations[priority=71]
          - errors[ERR_FACILITY_CAPACITY_EXCEEDED]
          - entities.Territory.fields.impound_current_head
          - entities.Territory.fields.intake_status
        distinguishing_aspect: |
          Interval semantics here are aggregate-capacity-at-every-instant on the Territory impound
          facility rather than pairwise buffered windows on an Inspector: a 15-head intake overlapping
          a live 20-head occupancy is refused because 35 exceeds impound_capacity_head 30, while a
          10-head intake over the same overlap is accepted because 30 is not greater than 30.
        test_recipe:
          setup:
            - "District T-PEN with impound_capacity_head 30, travel_surcharge_cents 2500."
            - "Clock at 2026-08-05T00:00:00Z; one InspectionOrder IN_FIELD in T-PEN."
            - "A 20-head lot with no legible brand has already been given a NO_LEGIBLE_BRAND finding, so an EstrayCase occupies [2026-08-05T00:00:00Z, 2026-08-25T00:00:00Z) with 20 head and impound_current_head is 20 with intake_status OPEN."
            - "Clock advanced to 2026-08-06T00:00:00Z; a 15-head lot and a 10-head lot are recorded on the same order and are still UNCHECKED."
          setup_api_calls:
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Stillwater Feeders", mailing_state: "MT", contact_email: "still@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-PEN", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 30 }
              as: BoardAdmin
              captures: { terr_p: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "B-881", home_territory_id: "${terr_p}", certification_expires_on: "2027-12-31T00:00:00Z", max_daily_assignments: 3 }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_p}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-08-05T08:00:00Z", requested_window_end_at: "2026-08-05T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-05T09:00:00Z", scheduled_end_at: "2026-08-05T15:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 20 }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_1: "$.data.id" }
            - call: "POST /brand-inspection/animal-lots/${lot_1}/finding"
              payload: { finding: "NO_LEGIBLE_BRAND" }
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "GET /brand-inspection/territories/${terr_p}"
              payload: {}
              as: BoardAdmin
              captures: { head_after_first: "$.data.impound_current_head", intake_after_first: "$.data.intake_status" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 15 }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_2: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/lots"
              payload: { species_class: "CATTLE", head_count: 10 }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { lot_3: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/animal-lots/${lot_2}/finding"
              payload: { finding: "NO_LEGIBLE_BRAND" }
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /brand-inspection/animal-lots/${lot_3}/finding"
