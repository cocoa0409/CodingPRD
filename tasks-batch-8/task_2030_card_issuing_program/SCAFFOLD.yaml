# =============================================================================
# Task 2030 — Card Issuing & Program (BIN) Management
# PRD Benchmark scaffold (v1)
# =============================================================================

scenario: |
  2030. Card Issuing & Program (BIN) Management: BIN range allocation & product parameter
  setup, card production/personalization & fulfillment vendor, activation & PIN issuance,
  authorization rules (velocity/MCC/geography) configuration, network compliance release
  & mandate implementation, interchange qualification & program economics,
  replacement/reissue campaign for expiring or compromised cards, program termination &
  portfolio conversion.

domain_name: card-issuing-program
api_prefix: /issuing

complexity_profile:
  primary_archetype: compliance_audit          # network mandates, cooling-off, segregation of duties
  secondary_archetype: workflow_orchestration  # production batches, reissue campaigns, conversion
  complexity_layers:
    - optimistic_concurrency        # OCC on CardProgram.version, CardAccount.version
    - cascading_side_effects        # program termination cascades BINs→accounts→cards; mandate ack cascades to rules
    - dual_variant_calculation      # provisional vs final interchange; targeted vs blanket reissue fee
    - rate_threshold_triggers       # velocity rules; interchange tier thresholds
    - derived_field_reconciliation  # account.available_balance_cents, program.open_card_count
    - scheduled_actions             # mandate effective_at; reissue campaign scheduled_for; conversion execution_at
    - selector_policy               # reissue batch card selection; conversion target-program pick
    - conditional_feature_flags     # program-level flags gate authorization rule editing
    - soft_delete                   # terminated program remains queryable
  entity_topology: hybrid                     # Program→BinRange tree; CardAccount & AuthorizationRule flat with FK; ProductionBatch star
  state_machine_shape: compound               # parallel dimensions on CardAccount (lifecycle × pin_status), cycles on MandateAck, posture on CardProgram
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                # AuthorizationRule.subject_ref can target PROGRAM or ACCOUNT
  role_model: segregation_of_duties           # ProgramManager vs ComplianceOfficer vs OperationsAnalyst vs FinanceController
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CardProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code (e.g. CORPL-PREPAID-US)", constraints: "unique across all programs including TERMINATED" }
      - { name: product_class, type: enum, source: input, description: "CONSUMER_PREPAID | CORPORATE_FLEET | DEBIT_CONSUMER | COMMERCIAL_CREDIT" }
      - { name: network, type: enum, source: input, description: "VISA | MASTERCARD | STAR | PULSE" }
      - { name: currency_code, type: string, source: input, description: "ISO 4217; immutable after creation" }
      - { name: daily_spend_cap_cents, type: integer, source: input, description: "Hard ceiling for any card in this program; >0" }
      - { name: authorization_rules_locked, type: boolean, source: system, default: false, description: "Set true when MandateAck for an ACTIVE Mandate is in SUBMITTED; cleared when Ack reaches VERIFIED or Mandate becomes RETIRED" }
      - { name: open_card_count, type: integer, source: computed, default: 0, description: "Cards under this program with lifecycle_status in {ISSUED, ACTIVE, SUSPENDED}" }
      - { name: posture, type: enum, source: computed, description: "DRAFT | LIVE | SUNSETTING | TERMINATED — derived from mandatory cascade" }
      - { name: terminated_at, type: datetime, source: system, required: false, description: "Set when posture flips to TERMINATED" }
      - { name: termination_reason, type: enum, source: input, required: false, description: "VOLUNTARY | NETWORK_DIRECTIVE | PORTFOLIO_CONVERSION — required on termination" }
      - { name: version, type: integer, source: system, description: "OCC on program" }

  - name: BinRange
    parent: CardProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CardProgram.id; owning program" }
      - { name: bin_prefix, type: string, source: input, description: "6- or 8-digit numeric prefix" }
      - { name: range_size, type: integer, source: input, description: "Number of PANs in this range; must be power of 10 between 10^3 and 10^7" }
      - { name: pans_allocated, type: integer, source: computed, default: 0, description: "PANs currently issued to non-terminal cards" }
      - { name: pans_available, type: integer, source: computed, description: "= range_size - pans_allocated" }
      - { name: effective_from, type: datetime, source: input, description: "Range not usable before this UTC instant" }
      - { name: effective_until, type: datetime, source: input, description: "Range not usable on/after this UTC instant; must be strictly greater than effective_from" }
      - { name: status, type: enum, source: system, description: "PENDING_ACTIVATION | ACTIVE | DEPLETED | FROZEN | RETIRED" }
      - { name: version, type: integer, source: system, description: "OCC on BinRange" }

  - name: ProductionVendor
    parent: null
    common_fields: true
    fields:
      - { name: vendor_code, type: string, source: input, description: "Unique vendor identifier (e.g. ACME-PERSO)" }
      - { name: capability_flags, type: array, source: input, description: "Subset of [EMV_CHIP, CONTACTLESS, MAGSTRIPE, VIRTUAL, DUAL_INTERFACE]; at least one required" }
      - { name: daily_capacity_cards, type: integer, source: input, description: "Max cards vendor can personalize per UTC day; >0" }
      - { name: supported_networks, type: array, source: input, description: "Subset of [VISA, MASTERCARD, STAR, PULSE]" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive vendors cannot be selected for new batches" }
      - { name: version, type: integer, source: system, description: "OCC" }

  - name: ProductionBatch
    parent: CardProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CardProgram.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> ProductionVendor.id" }
      - { name: scheduled_for_utc_date, type: string, source: input, description: "YYYY-MM-DD UTC production date" }
      - { name: requested_card_count, type: integer, source: input, description: "Cards requested; >0" }
      - { name: fulfilled_card_count, type: integer, source: computed, default: 0, description: "Cards vendor reports produced" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Per-card personalization cost; >=0" }
      - { name: status, type: enum, source: system, description: "PLANNED | SUBMITTED | IN_PRODUCTION | SHIPPED | DELIVERED | CANCELLED | FAILED" }
      - { name: version, type: integer, source: system, description: "OCC" }

  - name: CardAccount
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CardProgram.id; owning program" }
      - { name: external_account_ref, type: string, source: input, description: "Client-supplied reference; unique within program" }
      - { name: account_class, type: enum, source: input, description: "INDIVIDUAL | BUSINESS | FLEET_POOL" }
      - { name: currency_code, type: string, source: system, description: "Inherited from CardProgram.currency_code; immutable" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Only meaningful for COMMERCIAL_CREDIT program; otherwise must equal 0" }
      - { name: available_balance_cents, type: integer, source: computed, default: 0, description: "Prepaid/credit available balance after auths & settlements" }
      - { name: lifecycle_status, type: enum, source: system, description: "ONBOARDING | OPEN | SUSPENDED | CLOSED | CONVERTED_OUT" }
      - { name: risk_tier, type: enum, source: computed, description: "STANDARD | ELEVATED | RESTRICTED — derived from velocity breaches & mandate posture" }
      - { name: daily_spend_cap_cents, type: integer, source: input, description: "Per-account override; must be <= program.daily_spend_cap_cents" }
      - { name: version, type: integer, source: system, description: "OCC on CardAccount" }

  - name: Card
    parent: CardAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CardAccount.id" }
      - { name: bin_range_id, type: string, source: system, description: "FK -> BinRange.id; PAN source" }
      - { name: pan_token, type: string, source: system, description: "Tokenized PAN handle; server-minted, never exposes real PAN" }
      - { name: last4, type: string, source: computed, description: "Last 4 digits derived from pan_token; deterministic" }
      - { name: expiry_month, type: integer, source: input, description: "1..12" }
      - { name: expiry_year, type: integer, source: input, description: "Four-digit year; must be > current clock year or == current year with month >= current month" }
      - { name: form_factor, type: enum, source: input, description: "PHYSICAL | VIRTUAL" }
      - { name: lifecycle_status, type: enum, source: system, description: "ISSUED | ACTIVE | SUSPENDED | REPLACED | EXPIRED | CANCELLED | COMPROMISED" }
      - { name: pin_status, type: enum, source: system, description: "UNSET | SET | BLOCKED | RESET_PENDING — independent parallel dimension" }
      - { name: replaced_by_card_id, type: string, source: system, required: false, description: "FK -> Card.id; set when a reissue supersedes this card" }
      - { name: replaced_from_card_id, type: string, source: system, required: false, description: "FK -> Card.id; set on the replacement card" }
      - { name: reissue_campaign_id, type: string, source: system, required: false, description: "FK -> ReissueCampaign.id; set when card was generated by a campaign" }
      - { name: version, type: integer, source: system, description: "OCC" }

  - name: ActivationToken
    parent: Card
    common_fields: true
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> Card.id" }
      - { name: token_value, type: string, source: system, description: "Server-minted one-time activation token" }
      - { name: issued_at, type: datetime, source: system, description: "Set at token mint" }
      - { name: expires_at, type: datetime, source: computed, description: "= issued_at + 72 hours" }
      - { name: consumed_at, type: datetime, source: system, required: false, description: "Set on successful activation" }
      - { name: status, type: enum, source: system, description: "PENDING | CONSUMED | EXPIRED | REVOKED" }

  - name: AuthorizationRule
    parent: null
    common_fields: true
    fields:
      - { name: subject_kind, type: enum, source: input, description: "PROGRAM | ACCOUNT — which entity this rule governs" }
      - { name: subject_ref, type: string, source: input, description: "Polymorphic id: CardProgram.id when subject_kind=PROGRAM, CardAccount.id when ACCOUNT" }
      - { name: rule_kind, type: enum, source: input, description: "VELOCITY | MCC_ALLOW | MCC_BLOCK | GEO_BLOCK" }
      - { name: window_seconds, type: integer, source: input, required: false, description: "Required iff rule_kind=VELOCITY; sliding window size; must be >0" }
      - { name: max_txn_count, type: integer, source: input, required: false, description: "Required iff rule_kind=VELOCITY; >=1" }
      - { name: max_amount_cents, type: integer, source: input, required: false, description: "Required iff rule_kind=VELOCITY; >=1" }
      - { name: mcc_list, type: array, source: input, required: false, description: "Required iff rule_kind in {MCC_ALLOW, MCC_BLOCK}; each element 4-digit string; non-empty" }
      - { name: country_code_list, type: array, source: input, required: false, description: "Required iff rule_kind=GEO_BLOCK; each element ISO 3166-1 alpha-2; non-empty" }
      - { name: priority_rank, type: integer, source: input, description: "Lower wins when multiple rules match a single authorization; ties broken by created_at ASC" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }
      - { name: version, type: integer, source: system, description: "OCC" }

  - name: Mandate
    parent: null
    common_fields: true
    fields:
      - { name: network, type: enum, source: input, description: "VISA | MASTERCARD | STAR | PULSE" }
      - { name: mandate_code, type: string, source: input, description: "Network-supplied release code; unique per (network, mandate_code)" }
      - { name: title, type: string, source: input, description: "Human-readable mandate title" }
      - { name: effective_at, type: datetime, source: input, description: "UTC instant mandate becomes binding" }
      - { name: compliance_deadline, type: datetime, source: input, description: "Programs must reach ack VERIFIED before this UTC instant; must be > effective_at" }
      - { name: severity, type: enum, source: input, description: "ADVISORY | REQUIRED | EMERGENCY" }
      - { name: status, type: enum, source: system, description: "ANNOUNCED | EFFECTIVE | RETIRED" }
      - { name: version, type: integer, source: system, description: "OCC" }

  - name: MandateAck
    parent: Mandate
    common_fields: true
    fields:
      - { name: mandate_id, type: string, source: system, description: "FK -> Mandate.id" }
      - { name: program_id, type: string, source: input, description: "FK -> CardProgram.id" }
      - { name: implementation_notes, type: string, source: input, description: "Free-form notes" }
      - { name: submitted_by_role, type: string, source: system, description: "Role that submitted; recorded for SoD check" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID at submission; segregation-of-duties input" }
      - { name: verified_by_user_id, type: string, source: system, required: false, description: "X-User-ID at verification; must differ from submitted_by_user_id" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each RETURN→SUBMITTED cycle" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | VERIFIED | REJECTED — cyclic via RETURNED→SUBMITTED" }
      - { name: version, type: integer, source: system, description: "OCC" }

  - name: AuthorizationEvent
    parent: Card
    common_fields: false          # append-only event log
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> Card.id" }
      - { name: account_id, type: string, source: system, description: "FK -> CardAccount.id; denormalized for velocity aggregation" }
      - { name: program_id, type: string, source: system, description: "FK -> CardProgram.id; denormalized" }
      - { name: amount_cents, type: integer, source: input, description: "Authorization amount; >0" }
      - { name: mcc, type: string, source: input, description: "4-digit merchant category" }
      - { name: country_code, type: string, source: input, description: "ISO alpha-2 of merchant" }
      - { name: decision, type: enum, source: computed, description: "APPROVED | DECLINED_LIMIT | DECLINED_RULE | DECLINED_STATE | DECLINED_VELOCITY" }
      - { name: decision_reason, type: string, source: computed, description: "Stable machine-readable reason code" }
      - { name: applied_rule_id, type: string, source: system, required: false, description: "FK -> AuthorizationRule.id; rule that determined decline (when applicable)" }
      - { name: authorized_at, type: datetime, source: system, description: "Server clock at authorization" }

  - name: Settlement
    parent: Card
    common_fields: false          # append-only
    fields:
      - { name: authorization_event_id, type: string, source: input, description: "FK -> AuthorizationEvent.id" }
      - { name: card_id, type: string, source: system, description: "FK -> Card.id; denormalized" }
      - { name: account_id, type: string, source: system, description: "FK -> CardAccount.id; denormalized" }
      - { name: settled_amount_cents, type: integer, source: input, description: "May differ from authorized amount (partial captures); >0" }
      - { name: interchange_cents, type: integer, source: computed, description: "Computed via interchange_qualification" }
      - { name: qualification_tier, type: enum, source: computed, description: "QUALIFIED | MID_QUALIFIED | NON_QUALIFIED" }
      - { name: settled_at, type: datetime, source: system, description: "Server clock at settlement" }

  - name: ReissueCampaign
    parent: CardProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CardProgram.id" }
      - { name: campaign_kind, type: enum, source: input, description: "EXPIRY_SWEEP | COMPROMISE_BLAST | NETWORK_MANDATE_REISSUE" }
      - { name: scheduled_for, type: datetime, source: input, description: "UTC instant when the sweep executes; must be strictly future at creation" }
      - { name: selection_filter, type: object, source: input, description: "Campaign-scoped selector: { expiry_before?: dateYYYY-MM-DD, lifecycle_in?: [..], form_factor_in?: [..] } — see reissue_batch_selection calc" }
      - { name: targeted_unit_fee_cents, type: integer, source: input, description: "Per-card fee when campaign_kind=COMPROMISE_BLAST; otherwise ignored" }
      - { name: blanket_unit_fee_cents, type: integer, source: input, description: "Per-card fee when campaign_kind=EXPIRY_SWEEP; otherwise ignored" }
      - { name: estimated_card_count, type: integer, source: computed, default: 0, description: "Cards matching selection_filter at preview time" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | EXECUTING | COMPLETED | CANCELLED | FAILED" }
      - { name: version, type: integer, source: system, description: "OCC" }

  - name: ConversionJob
    parent: CardProgram
    common_fields: true
    fields:
      - { name: source_program_id, type: string, source: system, description: "FK -> CardProgram.id; program being terminated" }
      - { name: target_program_id, type: string, source: input, description: "FK -> CardProgram.id; must be posture=LIVE, same network & currency as source" }
      - { name: execution_at, type: datetime, source: input, description: "UTC instant conversion executes; must be strictly future at scheduling" }
      - { name: accounts_planned, type: integer, source: computed, default: 0, description: "CardAccounts in source program with lifecycle_status in {OPEN, SUSPENDED}" }
      - { name: accounts_converted, type: integer, source: computed, default: 0, description: "Increments as each account moves" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EXECUTING | COMPLETED | FAILED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "OCC" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CardProgram
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /issuing/programs/{id}/publish"
        actor: ProgramManager
        preconditions:
          - "At least one BinRange under this program with status=ACTIVE (ERR_PROGRAM_NO_ACTIVE_BIN)"
          - "card_program.daily_spend_cap_cents > 0"
          - "No MandateAck for this program is in SUBMITTED against a Mandate with status=EFFECTIVE (ERR_MANDATE_ACK_IN_FLIGHT)"
        side_effects:
          - "posture ← LIVE"

      - from: LIVE
        to: SUNSETTING
        trigger: "POST /issuing/programs/{id}/sunset"
        actor: ProgramManager
        preconditions:
          - "No ProductionBatch with status in {SUBMITTED, IN_PRODUCTION} under this program (ERR_PROGRAM_BATCH_IN_FLIGHT)"
        side_effects:
          - "posture ← SUNSETTING"
          - "All BinRanges under this program with status=ACTIVE flip to FROZEN (cascade)"
          - "All CardAccounts under this program retain lifecycle_status but no new Cards may be issued"

      - from: SUNSETTING
        to: TERMINATED
        trigger: "POST /issuing/programs/{id}/terminate"
        actor: ProgramManager
        preconditions:
          - "termination_reason provided and in {VOLUNTARY, NETWORK_DIRECTIVE, PORTFOLIO_CONVERSION}"
          - "If termination_reason = PORTFOLIO_CONVERSION: a ConversionJob with source_program_id = this program and status=COMPLETED must exist (ERR_CONVERSION_NOT_COMPLETED)"
          - "If termination_reason ≠ PORTFOLIO_CONVERSION: every CardAccount under program must have lifecycle_status in {CLOSED, CONVERTED_OUT} (ERR_PROGRAM_HAS_OPEN_ACCOUNTS)"
        side_effects:
          - "posture ← TERMINATED"
          - "terminated_at ← clock"
          - "All BinRanges under program flip to RETIRED"
          - "All Cards under program flip to CANCELLED (preserves prior pin_status)"
          - "All AuthorizationRules with subject_kind=PROGRAM and subject_ref=program flip to RETIRED"

      - from: SUNSETTING
        to: LIVE
        trigger: "POST /issuing/programs/{id}/cancel_sunset"
        actor: ProgramManager
        preconditions:
          - "No ConversionJob with source_program_id=this program and status in {SCHEDULED, EXECUTING} (ERR_CONVERSION_IN_FLIGHT)"
        side_effects:
          - "posture ← LIVE"
          - "All BinRanges previously FROZEN by the SUNSET transition restore to ACTIVE"
        note: "cycle LIVE↔SUNSETTING — sunset is revocable until terminate runs"

  - entity: BinRange
    initial_state: PENDING_ACTIVATION
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "system (automatic when clock >= effective_from AND parent CardProgram.posture in {DRAFT, LIVE})"
        actor: system
        preconditions: []
        side_effects: []
        note: "fired lazily on next read/write of the range, or via /_clock/set_current_utc"

      - from: ACTIVE
        to: FROZEN
        trigger: "system (cascade from CardProgram LIVE→SUNSETTING) OR POST /issuing/bin-ranges/{id}/freeze"
        actor: system | ProgramManager
        preconditions: []
        side_effects: []

      - from: FROZEN
        to: ACTIVE
        trigger: "system (cascade from CardProgram SUNSETTING→LIVE) OR POST /issuing/bin-ranges/{id}/unfreeze"
        actor: system | ProgramManager
        preconditions:
          - "parent CardProgram.posture in {DRAFT, LIVE}"
        side_effects: []

      - from: ACTIVE
        to: DEPLETED
        trigger: "system (automatic when pans_available reaches 0 after a card issue)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /issuing/bin-ranges/{id}/retire OR cascade from program termination"
        actor: ProgramManager | system
        preconditions:
          - "pans_allocated = 0 (ERR_BIN_HAS_ALLOCATED_PANS)"
        side_effects: []

      - from: FROZEN
        to: RETIRED
        trigger: "POST /issuing/bin-ranges/{id}/retire OR cascade from program termination"
        actor: ProgramManager | system
        preconditions:
          - "pans_allocated = 0"
        side_effects: []

      - from: DEPLETED
        to: RETIRED
        trigger: "POST /issuing/bin-ranges/{id}/retire"
        actor: ProgramManager
        preconditions: []
        side_effects: []
        note: "DEPLETED has pans_allocated > 0 by definition; retire from DEPLETED requires pans_allocated to be 0 — normally unreachable unless reissue frees PANs; retained for spec symmetry"

  - entity: ProductionBatch
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED, FAILED]
    transitions:
      - from: PLANNED
        to: SUBMITTED
        trigger: "POST /issuing/production-batches/{id}/submit"
        actor: OperationsAnalyst
        preconditions:
          - "parent CardProgram.posture = LIVE (ERR_PROGRAM_NOT_LIVE)"
          - "vendor_id refers to ProductionVendor with is_active=true (ERR_VENDOR_INACTIVE)"
          - "vendor.supported_networks contains program.network (ERR_VENDOR_NETWORK_MISMATCH)"
          - "vendor.daily_capacity_cards >= requested_card_count (ERR_VENDOR_CAPACITY_EXCEEDED)"
          - "scheduled_for_utc_date is not in the past relative to server clock (ERR_BATCH_DATE_PAST)"
          - "No other ProductionBatch with same vendor_id + scheduled_for_utc_date in {SUBMITTED, IN_PRODUCTION} (ERR_VENDOR_BATCH_OVERLAP)"
        side_effects: []

      - from: SUBMITTED
        to: IN_PRODUCTION
        trigger: "POST /issuing/production-batches/{id}/start"
        actor: OperationsAnalyst
        preconditions: []
        side_effects: []

      - from: IN_PRODUCTION
        to: SHIPPED
        trigger: "POST /issuing/production-batches/{id}/mark_shipped"
        actor: OperationsAnalyst
        preconditions:
          - "fulfilled_card_count must be set via payload field fulfilled_card_count"
          - "fulfilled_card_count <= requested_card_count (ERR_FULFILLED_EXCEEDS_REQUESTED)"
        side_effects:
          - "batch cost booked = fulfilled_card_count * unit_cost_cents (see production_batch_cost)"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /issuing/production-batches/{id}/mark_delivered"
        actor: OperationsAnalyst
        preconditions: []
        side_effects: []

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /issuing/production-batches/{id}/cancel"
        actor: OperationsAnalyst
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /issuing/production-batches/{id}/cancel"
        actor: OperationsAnalyst
        preconditions: []
        side_effects: []

      - from: IN_PRODUCTION
        to: FAILED
        trigger: "POST /issuing/production-batches/{id}/mark_failed"
        actor: OperationsAnalyst
        preconditions: []
        side_effects:
          - "Cards minted against this batch but not yet ACTIVE flip to CANCELLED"

  - entity: CardAccount
    initial_state: ONBOARDING
    terminal_states: [CLOSED, CONVERTED_OUT]
    transitions:
      - from: ONBOARDING
        to: OPEN
        trigger: "POST /issuing/accounts/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "parent CardProgram.posture = LIVE (ERR_PROGRAM_NOT_LIVE)"
          - "program has at least one BinRange with status=ACTIVE and pans_available >= 1 (ERR_NO_BIN_CAPACITY)"
        side_effects:
          - "lifecycle_status ← OPEN"

      - from: OPEN
        to: SUSPENDED
        trigger: "POST /issuing/accounts/{id}/suspend"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "All Cards under account with lifecycle_status=ACTIVE flip to SUSPENDED (cascade; pin_status preserved)"

      - from: SUSPENDED
        to: OPEN
        trigger: "POST /issuing/accounts/{id}/resume"
        actor: ProgramManager
        preconditions:
          - "parent CardProgram.posture = LIVE"
        side_effects:
          - "All Cards under account with lifecycle_status=SUSPENDED flip to ACTIVE (cascade)"

      - from: OPEN
        to: CLOSED
        trigger: "POST /issuing/accounts/{id}/close"
        actor: ProgramManager
        preconditions:
          - "available_balance_cents = 0 (ERR_ACCOUNT_BALANCE_NONZERO)"
        side_effects:
          - "All Cards under account flip to CANCELLED"
          - "program.open_card_count decremented by the number of cards that flipped"

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /issuing/accounts/{id}/close"
        actor: ProgramManager
        preconditions:
          - "available_balance_cents = 0"
        side_effects:
          - "All Cards under account flip to CANCELLED"

      - from: OPEN
        to: CONVERTED_OUT
        trigger: "system (during ConversionJob execution)"
        actor: system
        preconditions:
          - "ConversionJob.status = EXECUTING AND job.source_program_id = account.program_id"
        side_effects:
          - "account.program_id ← job.target_program_id"
          - "lifecycle_status ← CONVERTED_OUT (in source program's accounting; account is now parented to target program with lifecycle_status=OPEN)"
          - "Cards under account remain ACTIVE and are re-parented by reference"
        note: "actual representation: the account row moves; this transition records the audit fact"

      - from: SUSPENDED
        to: CONVERTED_OUT
        trigger: "system (during ConversionJob execution)"
        actor: system
        preconditions: []
        side_effects:
          - "account.program_id ← job.target_program_id"
          - "in target program the account remains SUSPENDED"

  - entity: Card
    initial_state: ISSUED
    terminal_states: [CANCELLED, EXPIRED, COMPROMISED]
    transitions:
      # Lifecycle dimension
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /issuing/cards/{id}/activate"
        actor: CardholderOps
        preconditions:
          - "card.account.lifecycle_status = OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "A PENDING ActivationToken exists for this card with expires_at > clock (ERR_ACTIVATION_TOKEN_INVALID)"
          - "activation_token in payload matches a PENDING ActivationToken.token_value (ERR_ACTIVATION_TOKEN_INVALID)"
          - "card.pin_status = SET (ERR_PIN_NOT_SET)"
        side_effects:
          - "ActivationToken.status ← CONSUMED; consumed_at ← clock"
          - "program.open_card_count incremented"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /issuing/cards/{id}/suspend OR cascade from account suspend"
        actor: ProgramManager | system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /issuing/cards/{id}/resume OR cascade from account resume"
        actor: ProgramManager | system
        preconditions:
          - "card.account.lifecycle_status = OPEN"
        side_effects: []

      - from: ACTIVE
        to: REPLACED
        trigger: "system (when a reissue creates a successor card against this one)"
        actor: system
        preconditions: []
        side_effects:
          - "replaced_by_card_id ← new_card.id"
          - "bin_range.pans_allocated unchanged on the source card; new card consumes a fresh PAN (invariant: active-PAN conservation across the reissue — source PAN is retired from allocation pool, target PAN is allocated; total allocated across the program's BinRanges increases by exactly 1)"

      - from: SUSPENDED
        to: REPLACED
        trigger: "system (reissue of suspended card)"
        actor: system
        preconditions: []
        side_effects:
          - "same as ACTIVE→REPLACED"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /issuing/cards/{id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "Any PENDING ActivationToken for this card flips to REVOKED"
          - "bin_range.pans_allocated -= 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /issuing/cards/{id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "bin_range.pans_allocated -= 1"
          - "program.open_card_count -= 1"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /issuing/cards/{id}/cancel"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "bin_range.pans_allocated -= 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (when clock reaches first day of month AFTER expiry_year-expiry_month)"
        actor: system
        preconditions: []
        side_effects:
          - "bin_range.pans_allocated -= 1"
          - "program.open_card_count -= 1"

      - from: ACTIVE
        to: COMPROMISED
        trigger: "POST /issuing/cards/{id}/mark_compromised"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "bin_range.pans_allocated -= 1"
          - "program.open_card_count -= 1"
          - "If this is the >= 3rd card under the same account flipping ACTIVE→COMPROMISED within a rolling 7-day window (computed from clock at this transition): account.risk_tier ← RESTRICTED AND account.lifecycle_status OPEN → SUSPENDED"
          - "That account-level suspension then cascades: every OTHER Card under the same account with lifecycle_status=ACTIVE flips to SUSPENDED (pin_status preserved)"
        note: "depth-3 transitive cascade: card.compromise → account.suspend → other_cards.suspend"

      # PIN dimension (parallel)
      - from: UNSET
        to: SET
        trigger: "POST /issuing/cards/{id}/pin"
        actor: CardholderOps
        preconditions:
          - "card.lifecycle_status in {ISSUED, ACTIVE} (ERR_CARD_TERMINAL_STATE)"
          - "payload.new_pin matches /^[0-9]{4,12}$/ (ERR_PIN_FORMAT_INVALID)"
        side_effects: []

      - from: SET
        to: BLOCKED
        trigger: "system (after PIN_FAIL_LIMIT consecutive PIN verification failures)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BLOCKED
        to: RESET_PENDING
        trigger: "POST /issuing/cards/{id}/pin_reset_request"
        actor: CardholderOps
        preconditions: []
        side_effects: []

      - from: RESET_PENDING
        to: SET
        trigger: "POST /issuing/cards/{id}/pin (after reset)"
        actor: CardholderOps
        preconditions:
          - "payload.new_pin matches PIN format"
        side_effects: []

      - from: SET
        to: SET
        trigger: "POST /issuing/cards/{id}/pin (change)"
        actor: CardholderOps
        preconditions:
          - "payload.current_pin matches stored PIN"
          - "payload.new_pin matches PIN format"
        side_effects: []
        note: "self-loop for PIN change; version still increments"
    parallel_dimensions:
      - "lifecycle_status (ISSUED | ACTIVE | SUSPENDED | REPLACED | EXPIRED | CANCELLED | COMPROMISED)"
      - "pin_status (UNSET | SET | BLOCKED | RESET_PENDING)"

  - entity: ActivationToken
    initial_state: PENDING
    terminal_states: [CONSUMED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: CONSUMED
        trigger: "system (on successful Card.activate)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: EXPIRED
        trigger: "system (when clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: REVOKED
        trigger: "system (cascade when card cancels) OR POST /issuing/cards/{id}/activation-tokens/revoke"
        actor: system | CardholderOps
        preconditions: []
        side_effects: []

  - entity: AuthorizationRule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /issuing/authorization-rules/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "If subject_kind=PROGRAM: program.authorization_rules_locked = false (ERR_PROGRAM_RULES_LOCKED)"
          - "If subject_kind=PROGRAM: program.posture in {DRAFT, LIVE} (ERR_PROGRAM_NOT_EDITABLE)"
          - "If subject_kind=ACCOUNT: account.lifecycle_status in {OPEN, SUSPENDED} (ERR_ACCOUNT_TERMINAL_STATE)"
          - "If rule_kind=VELOCITY: window_seconds>0 AND max_txn_count>=1 AND max_amount_cents>=1"
        side_effects: []

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /issuing/authorization-rules/{id}/retire"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: RETIRED
        trigger: "POST /issuing/authorization-rules/{id}/retire"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: Mandate
    initial_state: ANNOUNCED
    terminal_states: [RETIRED]
    transitions:
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "system (when clock >= effective_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Every MandateAck for this Mandate still in DRAFT flips to RETURNED with implementation_notes appended 'AUTO-RETURNED: mandate went effective'"

      - from: EFFECTIVE
        to: RETIRED
        trigger: "POST /issuing/mandates/{id}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "No MandateAck for this Mandate with status=SUBMITTED (ERR_MANDATE_HAS_OPEN_ACKS)"
        side_effects:
          - "All MandateAcks for this Mandate in {DRAFT, RETURNED} flip to REJECTED"
          - "Each affected CardProgram has authorization_rules_locked recomputed: locked = any OTHER ACTIVE MandateAck in SUBMITTED state"

      - from: ANNOUNCED
        to: RETIRED
        trigger: "POST /issuing/mandates/{id}/retire"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "All MandateAcks in {DRAFT, RETURNED} flip to REJECTED"

  - entity: MandateAck
    initial_state: DRAFT
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /issuing/mandates/{id}/acks/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "mandate.status in {ANNOUNCED, EFFECTIVE}"
          - "program.posture in {LIVE, SUNSETTING} (ERR_PROGRAM_NOT_EDITABLE)"
          - "program.authorization_rules_locked = false OR (the rule being locked is exactly this ack)"
        side_effects:
          - "program.authorization_rules_locked ← true"
          - "submitted_by_role ← X-User-Role; submitted_by_user_id ← X-User-ID"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /issuing/mandates/{id}/acks/{id}/return"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != ack.submitted_by_user_id (ERR_SOD_SAME_USER)"
        side_effects:
          - "program.authorization_rules_locked ← false"
          - "revision_count unchanged"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /issuing/mandates/{id}/acks/{id}/submit"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "revision_count += 1"
          - "program.authorization_rules_locked ← true"
          - "submitted_by_user_id ← new X-User-ID"
        note: "cyclic — acks can iterate DRAFT→SUBMITTED→RETURNED→SUBMITTED until verified"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /issuing/mandates/{id}/acks/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != ack.submitted_by_user_id (ERR_SOD_SAME_USER)"
          - "clock < mandate.compliance_deadline (ERR_MANDATE_DEADLINE_PASSED)"
        side_effects:
          - "verified_by_user_id ← X-User-ID"
          - "program.authorization_rules_locked ← false"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /issuing/mandates/{id}/acks/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != ack.submitted_by_user_id"
        side_effects:
          - "program.authorization_rules_locked ← false"

  - entity: ReissueCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, FAILED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /issuing/reissue-campaigns/{id}/schedule"
        actor: OperationsAnalyst
        preconditions:
          - "scheduled_for > clock (ERR_CAMPAIGN_DATE_PAST)"
          - "estimated_card_count >= 1 — recompute from selection_filter at schedule time (ERR_CAMPAIGN_EMPTY_SELECTION)"
        side_effects: []

      - from: SCHEDULED
        to: EXECUTING
        trigger: "system (when clock >= scheduled_for)"
        actor: system
        preconditions: []
        side_effects:
          - "For each Card in program matching selection_filter AND card.lifecycle_status in {ISSUED, ACTIVE, SUSPENDED}: mint a successor Card (form_factor=same, expiry = now + 36 months, ISSUED, pin_status=UNSET, replaced_from_card_id=source_card.id, reissue_campaign_id=this campaign); source card lifecycle → REPLACED"

      - from: EXECUTING
        to: COMPLETED
        trigger: "system (when all successor cards are minted)"
        actor: system
        preconditions: []
        side_effects:
          - "per-card fee is booked to program ledger (see reissue_campaign_fee)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /issuing/reissue-campaigns/{id}/cancel"
        actor: OperationsAnalyst
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /issuing/reissue-campaigns/{id}/cancel"
        actor: OperationsAnalyst
        preconditions: []
        side_effects: []

  - entity: ConversionJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EXECUTING
        trigger: "system (when clock >= execution_at)"
        actor: system
        preconditions:
          - "source_program.posture = SUNSETTING (else flip to FAILED)"
        side_effects:
          - "For each CardAccount in source program with lifecycle_status in {OPEN, SUSPENDED}: account → CONVERTED_OUT (account.program_id ← target_program_id)"

      - from: EXECUTING
        to: COMPLETED
        trigger: "system (when accounts_converted = accounts_planned)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXECUTING
        to: FAILED
        trigger: "system (when target program posture leaves LIVE mid-execution, or accounts_planned becomes 0 unexpectedly)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /issuing/conversion-jobs/{id}/cancel"
        actor: ProgramManager
        preconditions:
          - "X-User-ID != job created_by user — separation of duties; enforced via stored actor"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-update-stale-version
    parent_entity: CardProgram
    write_endpoint: "PUT /issuing/programs/{id}"
    occ_field: "expected_program_version"
    description: |
      Updating a CardProgram's mutable product parameters (daily_spend_cap_cents)
      is rejected when the client's last-observed version no longer matches the
      server's version. Captures the case where another writer has modified the
      product parameters since the client read them, which would silently lose
      their update if applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: account-update-stale-version
    parent_entity: CardAccount
    write_endpoint: "PUT /issuing/accounts/{id}"
    occ_field: "expected_account_version"
    description: |
      Updating a CardAccount's daily_spend_cap_cents or credit_limit_cents is
      rejected when the client's last-observed version is stale. Prevents
      silent loss of a concurrent spend-cap change.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rule-activate-stale-version
    parent_entity: AuthorizationRule
    write_endpoint: "POST /issuing/authorization-rules/{id}/activate"
    occ_field: "expected_rule_version"
    description: |
      Activating an AuthorizationRule is rejected when the rule has been
      edited (or retired-then-edited) since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: interchange_qualification
    description: "Per-settlement interchange under the program's current qualification tier. Two variants — provisional at authorization vs final at settlement — produce different cents for the same economic event when network tier rules have changed mid-window."
    trigger: "Settlement creation (final variant); also exposed read-only as provisional at AuthorizationEvent creation"
    inputs: [settled_amount_cents, card.program.network, card.program.product_class, mcc, qualification_tier_input]
    algorithm: tiered_pricing
    formula: |
      # Inputs:
      #   amount_cents         — settled_amount_cents
      #   network              — program.network
      #   tier                 — QUALIFIED | MID_QUALIFIED | NON_QUALIFIED (computed via qualification_tier_rules below)
      #   product_class        — program.product_class
      # Constants (simplified):
      #   base_rate_bp_by_network_and_tier: see constants
      #   per_item_cents_by_network:        see constants
      #   commercial_uplift_bp:             applied when product_class in {COMMERCIAL_CREDIT, CORPORATE_FLEET}
      #
      # Step 1: pick rate_bp = base_rate_bp_by_network_and_tier[network][tier]
      # Step 2: if product_class in {COMMERCIAL_CREDIT, CORPORATE_FLEET}: rate_bp += commercial_uplift_bp
      # Step 3: per_item = per_item_cents_by_network[network]
      # Step 4: interchange_cents = floor(amount_cents * rate_bp / 10000) + per_item
      # Precision: integer cents; floor at step 4 (round_down). NO rounding at intermediate steps.
      #
      # Evaluation order (CRITICAL — pinned):
      #   (a) tier is resolved BEFORE rate_bp lookup.
      #   (b) uplift is applied to rate_bp BEFORE the multiply.
      #   (c) floor is applied AFTER adding per_item.
    constants:
      base_rate_bp_by_network_and_tier:
        VISA:       { QUALIFIED: 145, MID_QUALIFIED: 185, NON_QUALIFIED: 230 }
        MASTERCARD: { QUALIFIED: 148, MID_QUALIFIED: 188, NON_QUALIFIED: 235 }
        STAR:       { QUALIFIED: 90,  MID_QUALIFIED: 130, NON_QUALIFIED: 175 }
        PULSE:      { QUALIFIED: 85,  MID_QUALIFIED: 125, NON_QUALIFIED: 170 }
      per_item_cents_by_network: { VISA: 10, MASTERCARD: 11, STAR: 5, PULSE: 5 }
      commercial_uplift_bp: 65
    precision: "0 decimal places, round_down (floor) at final step only"
    variants:
      - name: provisional
        when: "Computed at AuthorizationEvent time, against the rules EFFECTIVE at the program at that instant. Stored as advisory only; not booked."
        difference: "Uses tier AS IF the authorization's MCC qualifies for QUALIFIED (optimistic); assumes the auth will settle within T+1."
      - name: final
        when: "Computed at Settlement time against the actual mcc, network tier table, and a qualification predicate evaluated at settlement."
        difference: "Uses the REAL qualification_tier (could be MID_ or NON_QUALIFIED); produces different cents than provisional when tier != QUALIFIED or when product_class uplift applies."

  - name: qualification_tier_rules
    description: "Assigns a Settlement a tier. (a) formula with >= 3 inputs and non-linear interaction."
    trigger: "Settlement creation"
    inputs: [mcc, authorized_at, settled_at, program.has_emv_chip_enabled, program.network]
    algorithm: threshold
    formula: |
      # Inputs (>=3):
      #   mcc                    — 4-digit string
      #   auth_to_settle_seconds — settled_at - authorized_at (seconds)
      #   has_emv_chip_enabled   — boolean derived from card form_factor + vendor capability (true if card is EMV-capable)
      #   network                — program.network
      #
      # Logic (non-linear interaction: nested conditionals):
      #   if mcc in BLOCKED_MCC_LIST[network]:            tier = NON_QUALIFIED
      #   elif auth_to_settle_seconds > 172800 (48h):     tier = NON_QUALIFIED
      #   elif not has_emv_chip_enabled:                  tier = NON_QUALIFIED
      #   elif auth_to_settle_seconds <= 86400 (24h) AND has_emv_chip_enabled:
      #       tier = QUALIFIED
      #   else:                                            tier = MID_QUALIFIED
      #
      # Boundary precision: 86400s is INCLUSIVE for QUALIFIED; 172800s is EXCLUSIVE for NON_QUALIFIED
      # (i.e. >172800 = NON; ==172800 falls through to chip check).
    constants:
      BLOCKED_MCC_LIST:
        VISA: ["7995", "6012"]
        MASTERCARD: ["7995"]
        STAR: []
        PULSE: []
      T1_SECONDS: 86400
      T2_SECONDS: 172800
    precision: "n/a — discrete tier output"

  - name: program_monthly_economics
    description: "Monthly program P&L — dual-variant across a DIFFERENT entity domain than interchange (CardProgram, not Settlement). Used for FinanceController reporting."
    trigger: "GET /issuing/programs/{id}/economics?month=YYYY-MM"
    inputs: [program_id, month]
    algorithm: aggregation
    formula: |
      # Revenue lines (computed from Settlements with settled_at in [month_start, month_end) — half-open):
      #   interchange_revenue_cents = sum(Settlement.interchange_cents) over program's settlements in window
      # Cost lines:
      #   production_cost_cents     = sum(batch.fulfilled_card_count * batch.unit_cost_cents)
      #                                 over ProductionBatches for program with status in {SHIPPED, DELIVERED}
      #                                 AND scheduled_for_utc_date in month window
      #   reissue_fee_cents         = sum(campaign per-card fee * count of successor cards minted)
      #                                 over ReissueCampaigns for program with status=COMPLETED AND
      #                                 completed_at in month window
      # Variant A (PROVISIONAL_MONTH_TO_DATE): includes settlements with settled_at <= clock,
      #   plus a FORWARD-LOOKING accrual for batches in SUBMITTED/IN_PRODUCTION as
      #   batch.requested_card_count * batch.unit_cost_cents (uses requested, not fulfilled).
      # Variant B (FINAL_MONTH_CLOSE): only includes batches in {SHIPPED, DELIVERED} (uses fulfilled);
      #   and only campaigns COMPLETED within window. No forward-looking accrual.
      #
      # net_economics_cents = interchange_revenue_cents - production_cost_cents - reissue_fee_cents
      #
      # Rounding: integer cents throughout; no rounding operations.
      # Aggregation selection precision:
      #   (a) Source entity: Settlement; status filter: settled_at ∈ [month_start, month_end) AND card.program_id = program_id
      #   (b) Window: half-open [month_start 00:00:00Z, month_end 00:00:00Z)
      #   (c) Tie-break: n/a — sum is order-invariant
    constants: {}
    precision: "0 decimal places, integer cents"
    variants:
      - name: provisional_month_to_date
        when: "Requested with variant=PROVISIONAL (default when month == current month)"
        difference: "Includes forward-looking accrual for in-flight production batches using requested_card_count"
      - name: final_month_close
        when: "Requested with variant=FINAL (default when month < current month)"
        difference: "Excludes in-flight batches; uses fulfilled_card_count only"

  - name: reissue_campaign_fee
    description: "Per-card fee booked when a reissue campaign completes. (b) Nested rounding — order matters."
    trigger: "ReissueCampaign EXECUTING → COMPLETED"
    inputs: [campaign, list of successor cards]
    algorithm: aggregation
    formula: |
      # Two fee variants pinned by campaign.campaign_kind:
      #   COMPROMISE_BLAST → use campaign.targeted_unit_fee_cents per card
      #   EXPIRY_SWEEP     → use campaign.blanket_unit_fee_cents per card, PLUS a 4% volume discount
      #                       applied to the TOTAL (NOT per-card).
      #
      # NESTED ROUNDING — order pinned:
      #   Step 1: gross_fee_cents = sum(unit_fee_cents per successor card)  (integer sum, no rounding)
      #   Step 2: if campaign_kind = EXPIRY_SWEEP:
      #              discount_cents = floor(gross_fee_cents * 4 / 100)
      #              net_fee_cents  = gross_fee_cents - discount_cents
      #           else:
      #              net_fee_cents  = gross_fee_cents
      #   Step 3: net_fee_cents is what gets booked.
      #
      # Counter-example that pins the order:
      #   blanket_unit_fee_cents = 333, count = 3
      #   Wrong (per-card rounding):  floor(333*0.96)=319; 319*3=957
      #   Right (total rounding):     gross=999; floor(999*4/100)=39; 999-39=960
      # These differ (957 vs 960). The scaffold pins the second form.
    constants:
      VOLUME_DISCOUNT_NUMERATOR: 4
      VOLUME_DISCOUNT_DENOMINATOR: 100
    precision: "integer cents; floor only at discount step"
    variants:
      - name: targeted
        when: "campaign_kind = COMPROMISE_BLAST"
        difference: "flat per-card fee, no discount"
      - name: blanket
        when: "campaign_kind = EXPIRY_SWEEP"
        difference: "4% volume discount on gross, rounded via floor at the total level"

  - name: reissue_batch_selection
    description: "Selector that picks the ordered set of Cards a reissue campaign converts. (a) selector policy with eligibility filter + ranking + tie-break + empty fallback."
    trigger: "ReissueCampaign DRAFT→SCHEDULED (to compute estimated_card_count) AND SCHEDULED→EXECUTING (to actually mint successors)"
    inputs: [program_id, campaign.selection_filter, clock]
    algorithm: constraint_propagation
    formula: |
      # Eligibility filter:
      #   card.program_id = program_id
      #   AND card.lifecycle_status IN selection_filter.lifecycle_in (default {ACTIVE, SUSPENDED, ISSUED})
      #   AND card.form_factor IN selection_filter.form_factor_in (default: all)
      #   AND if selection_filter.expiry_before is set:
      #         card.expiry_year*100 + card.expiry_month < expiry_before.yyyy*100 + expiry_before.mm
      #
      # Ranking expression: (expiry_year ASC, expiry_month ASC, card.created_at ASC)
      # Tie-break: card.created_at ASC (never card.id)
      # Empty-pool fallback: at schedule time → ERR_CAMPAIGN_EMPTY_SELECTION;
      #                       at execute time → status flips to FAILED with empty_execution_reason=NO_MATCHING_CARDS
    constants: {}
    precision: "n/a — selector"

  - name: velocity_rule_evaluation
    description: "Sliding-window velocity check for an AuthorizationEvent. (a) threshold algorithm with boundary-precision + cumulative-vs-instantaneous pin."
    trigger: "AuthorizationEvent creation when any ACTIVE VELOCITY AuthorizationRule matches the card's account or program"
    inputs: [card, amount_cents, clock]
    algorithm: threshold
    formula: |
      # For each matching ACTIVE VELOCITY rule (matching = subject_kind=ACCOUNT AND subject_ref=card.account_id
      #   OR subject_kind=PROGRAM AND subject_ref=card.program_id), ordered by priority_rank ASC, created_at ASC:
      #
      #   window_start = clock - rule.window_seconds
      #   events_in_window = AuthorizationEvents e where
      #       e.account_id = card.account_id
      #       AND e.decision = APPROVED            # only approved events consume velocity
      #       AND e.authorized_at >= window_start  # INCLUSIVE lower bound
      #       AND e.authorized_at <= clock         # INCLUSIVE upper bound
      #   sum_in_window = sum(e.amount_cents)
      #   count_in_window = count(e)
      #
      #   DECLINE if (count_in_window + 1) > rule.max_txn_count
      #           OR (sum_in_window + amount_cents) > rule.max_amount_cents
      #
      # Boundary precision:
      #   (a) Window endpoints INCLUSIVE — an event at exactly clock - window_seconds counts.
      #   (b) Exceeds means STRICTLY greater-than: hitting exactly max_amount_cents is APPROVED;
      #       exceeding by 1 cent is DECLINED_VELOCITY.
      #   (c) Only APPROVED events consume velocity — declines don't burn the limit.
      #   (d) If multiple VELOCITY rules match, the most restrictive (first to fail) wins; tie broken
      #       by priority_rank ASC then created_at ASC.
    constants: {}
    precision: "integer cents; integer counts"

  - name: production_batch_cost
    description: "Cost booked when a batch is marked SHIPPED. (c) Circular-looking dependency pinned — batch cost affects program economics, program economics is calculated from batches; evaluation order pinned so the value is well-defined."
    trigger: "ProductionBatch IN_PRODUCTION → SHIPPED"
    inputs: [batch, clock]
    algorithm: waterfall_allocation
    formula: |
      # batch_cost_cents = batch.fulfilled_card_count * batch.unit_cost_cents  (integer, no rounding)
      #
      # Circular-looking dependency:
      #   program_monthly_economics's production_cost_cents depends on batch_cost_cents
      #   batch_cost_cents is computed from fulfilled_card_count, which is set ON the SHIPPED transition.
      #   If a downstream consumer queries program economics mid-flight (e.g. a reporting view),
      #   it must see batch_cost_cents as already booked. Pinned evaluation order:
      #     1. fulfilled_card_count is written from payload
      #     2. batch_cost_cents = fulfilled_card_count * unit_cost_cents  (recomputed, not stored)
      #     3. status flips to SHIPPED
      #     4. program economics becomes queryable with the new batch included
      #   No consumer ever sees SHIPPED without batch_cost_cents being defined.
      #
      # waterfall_allocation applies when fulfilled < requested:
      #   unfulfilled_count = requested_card_count - fulfilled_card_count
      #   These unfulfilled cards are NOT re-allocated to other batches; the batch simply books less.
      #   Rounding remainder: n/a — all integer cents.
    constants: {}
    precision: "integer cents; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in declared role set"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /issuing/accounts (self-registration is not offered; all calls require a role)"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path template ids (program_id, account_id, card_id, batch_id, rule_id, mandate_id, ack_id, campaign_id, job_id, bin_range_id) resolve to existing rows; nested paths validate parents left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "expected_<parent>_version present when OCC endpoint requires it (§1.2.1)"
    error_id: ERR_MISSING_OCC_FIELD
    http_status: 400
    applies_to: "PUT /issuing/programs/{id}, PUT /issuing/accounts/{id}, POST /issuing/authorization-rules/{id}/activate"

  - priority: 5
    category: state
    check: "expected_<parent>_version matches server's current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /issuing/programs/{id}, PUT /issuing/accounts/{id}, POST /issuing/authorization-rules/{id}/activate"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation-of-duties: verifier/returner/rejecter X-User-ID MUST differ from MandateAck.submitted_by_user_id"
    error_id: ERR_SOD_SAME_USER
    http_status: 409
    applies_to: "POST /issuing/mandates/{id}/acks/{id}/return, /verify, /reject"

  - priority: 8
    category: business_safety
    check: "Mandate compliance deadline: verify must land before mandate.compliance_deadline"
    error_id: ERR_MANDATE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /issuing/mandates/{id}/acks/{id}/verify"

  - priority: 9
    category: business_constraint
    check: "Program rule lock: when CardProgram.authorization_rules_locked=true, no rule under that program may be activated"
    error_id: ERR_PROGRAM_RULES_LOCKED
    http_status: 409
    applies_to: "POST /issuing/authorization-rules/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "Program posture gating: publish requires posture=DRAFT; sunset requires LIVE; terminate requires SUNSETTING; account activation requires LIVE"
    error_id: ERR_PROGRAM_NOT_LIVE
    http_status: 409
    applies_to: "POST /issuing/programs/{id}/publish, /sunset, /terminate, POST /issuing/accounts/{id}/activate"

  - priority: 11
    category: business_constraint
    check: "Production vendor admissibility: is_active, supported_networks, daily_capacity"
    error_id: "ERR_VENDOR_INACTIVE | ERR_VENDOR_NETWORK_MISMATCH | ERR_VENDOR_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /issuing/production-batches/{id}/submit"

  - priority: 12
    category: business_temporal
    check: "Temporal windows: batch.scheduled_for_utc_date not in past; campaign.scheduled_for in future at schedule; conversion.execution_at in future at schedule"
    error_id: "ERR_BATCH_DATE_PAST | ERR_CAMPAIGN_DATE_PAST | ERR_CONVERSION_DATE_PAST"
    http_status: 409
    applies_to: "POST /issuing/production-batches/{id}/submit, POST /issuing/reissue-campaigns/{id}/schedule, POST /issuing/programs/{id}/conversion-jobs"

  - priority: 13
    category: business_temporal
    check: "Resource temporal-overlap: a vendor cannot have two batches in {SUBMITTED, IN_PRODUCTION} on the same UTC date"
    error_id: ERR_VENDOR_BATCH_OVERLAP
    http_status: 409
    applies_to: "POST /issuing/production-batches/{id}/submit"

  - priority: 14
    category: business_temporal
    check: "BinRange effective window: effective_from < effective_until; card issuance requires clock ∈ [effective_from, effective_until)"
    error_id: ERR_BIN_NOT_IN_WINDOW
    http_status: 409
    applies_to: "POST /issuing/accounts/{id}/cards (creation), POST /issuing/programs/{id}/bin-ranges (creation)"

  - priority: 15
    category: business_referential
    check: "FK integrity: program_id, account_id, bin_range_id, vendor_id, mandate_id, target_program_id must resolve to existing rows"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "all POST endpoints with FK input"

  - priority: 16
    category: business_referential
    check: "Bin capacity: issuing a card requires an ACTIVE BinRange under the program with pans_available >= 1; account activation requires >= 1 such BinRange"
    error_id: ERR_NO_BIN_CAPACITY
    http_status: 409
    applies_to: "POST /issuing/accounts/{id}/activate, POST /issuing/accounts/{id}/cards"

  - priority: 17
    category: business_fiscal
    check: "Account available_balance_cents >= amount for authorization approval"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 409
    applies_to: "POST /issuing/cards/{id}/authorizations"

  - priority: 18
    category: business_fiscal
    check: "Velocity rule check per §1.3 velocity_rule_evaluation"
    error_id: ERR_VELOCITY_EXCEEDED
    http_status: 409
    applies_to: "POST /issuing/cards/{id}/authorizations"

  - priority: 19
    category: business_fiscal
    check: "Account daily_spend_cap_cents not exceeded by cumulative approved auths in rolling 24h"
    error_id: ERR_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /issuing/cards/{id}/authorizations"

  - priority: 20
    category: business_fiscal
    check: "Account close requires available_balance_cents = 0"
    error_id: ERR_ACCOUNT_BALANCE_NONZERO
    http_status: 409
    applies_to: "POST /issuing/accounts/{id}/close"

  - priority: 21
    category: business_referential
    check: "Conversion target admissibility: target_program_id must refer to a CardProgram in posture=LIVE with same network and currency_code as source, and != source"
    error_id: ERR_CONVERSION_TARGET_INVALID
    http_status: 409
    applies_to: "POST /issuing/programs/{id}/conversion-jobs"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/issuing/_clock/set_current_utc"
    description: "Advance the server's logical clock. Server startup default is 2026-08-01T00:00:00Z; before any set_current_utc call, the logical clock reads exactly that default and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Server logical clock advances; lazy state transitions (BinRange PENDING_ACTIVATION→ACTIVE, Mandate ANNOUNCED→EFFECTIVE, ReissueCampaign SCHEDULED→EXECUTING, ConversionJob SCHEDULED→EXECUTING, Card ACTIVE→EXPIRED, ActivationToken PENDING→EXPIRED) fire on next read/write"

  # ---- CardProgram ----
  - method: POST
    path: "/issuing/programs"
    description: "Create a CardProgram (posture=DRAFT)"
    roles: [ProgramManager]
    code: 201
    input: [program_code, product_class, network, currency_code, daily_spend_cap_cents, "termination_reason?"]
    output: CardProgram
    side_effects:
      - "posture=DRAFT; authorization_rules_locked=false; open_card_count=0"

  - method: GET
    path: "/issuing/programs"
    description: "List CardPrograms; supports filter by posture, network, product_class"
    roles: [ProgramManager, ComplianceOfficer, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: ["posture?", "network?", "product_class?", "limit?", "offset?"]
    output: CardProgram[]
    side_effects: []

  - method: GET
    path: "/issuing/programs/{id}"
    description: "Get a CardProgram (terminated programs still queryable — soft-delete semantics)"
    roles: [ProgramManager, ComplianceOfficer, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: CardProgram
    side_effects: []

  - method: PUT
    path: "/issuing/programs/{id}"
    description: "Update CardProgram product parameters (OCC-guarded)"
    roles: [ProgramManager]
    code: 200
    input: [expected_program_version, "daily_spend_cap_cents?"]
    output: CardProgram
    side_effects:
      - "increments CardProgram.version by 1"
      - "If daily_spend_cap_cents lowered below some account.daily_spend_cap_cents, those accounts' cap is NOT auto-lowered; new auths on those accounts use min(account_cap, program_cap)"

  - method: POST
    path: "/issuing/programs/{id}/publish"
    description: "DRAFT→LIVE"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CardProgram
    side_effects: ["posture ← LIVE; increments version"]

  - method: POST
    path: "/issuing/programs/{id}/sunset"
    description: "LIVE→SUNSETTING"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CardProgram
    side_effects: ["posture ← SUNSETTING; increments version; cascades BinRange ACTIVE→FROZEN"]

  - method: POST
    path: "/issuing/programs/{id}/cancel_sunset"
    description: "SUNSETTING→LIVE"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CardProgram
    side_effects: ["posture ← LIVE; increments version; restores BinRange FROZEN→ACTIVE"]

  - method: POST
    path: "/issuing/programs/{id}/terminate"
    description: "SUNSETTING→TERMINATED; cascades BinRanges→RETIRED, Cards→CANCELLED, Rules→RETIRED"
    roles: [ProgramManager]
    code: 200
    input: [termination_reason]
    output: CardProgram
    side_effects: ["posture ← TERMINATED; terminated_at ← clock; increments version"]

  - method: GET
    path: "/issuing/programs/{id}/economics"
    description: "Computed monthly economics (program_monthly_economics)"
    roles: [FinanceController, PlatformAdmin]
    code: 200
    input: [month, "variant?"]
    output: { month: string, variant: string, interchange_revenue_cents: integer, production_cost_cents: integer, reissue_fee_cents: integer, net_economics_cents: integer }
    side_effects: []

  # ---- BinRange ----
  - method: POST
    path: "/issuing/programs/{id}/bin-ranges"
    description: "Create a BinRange under a program"
    roles: [ProgramManager]
    code: 201
    input: [bin_prefix, range_size, effective_from, effective_until]
    output: BinRange
    side_effects:
      - "status=PENDING_ACTIVATION; pans_allocated=0; pans_available=range_size"

  - method: GET
    path: "/issuing/programs/{id}/bin-ranges"
    description: "List BinRanges under a program"
    roles: [ProgramManager, ComplianceOfficer, OperationsAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BinRange[]
    side_effects: []

  - method: GET
    path: "/issuing/bin-ranges/{id}"
    description: "Get a BinRange"
    roles: [ProgramManager, OperationsAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: BinRange
    side_effects: []

  - method: POST
    path: "/issuing/bin-ranges/{id}/freeze"
    description: "ACTIVE→FROZEN"
    roles: [ProgramManager]
    code: 200
    input: []
    output: BinRange
    side_effects: []

  - method: POST
    path: "/issuing/bin-ranges/{id}/unfreeze"
    description: "FROZEN→ACTIVE"
    roles: [ProgramManager]
    code: 200
    input: []
    output: BinRange
    side_effects: []

  - method: POST
    path: "/issuing/bin-ranges/{id}/retire"
    description: "ACTIVE|FROZEN|DEPLETED→RETIRED"
    roles: [ProgramManager]
    code: 200
    input: []
    output: BinRange
    side_effects: []

  # ---- ProductionVendor ----
  - method: POST
    path: "/issuing/vendors"
    description: "Register a ProductionVendor"
    roles: [PlatformAdmin]
    code: 201
    input: [vendor_code, capability_flags, daily_capacity_cards, supported_networks, "is_active?"]
    output: ProductionVendor
    side_effects: []

  - method: GET
    path: "/issuing/vendors/{id}"
    description: "Get vendor"
    roles: [ProgramManager, OperationsAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: ProductionVendor
    side_effects: []

  - method: GET
    path: "/issuing/vendors/{id}/production-batches"
    description: "List batches delegated to a vendor (FK reverse-reachability for ProductionBatch.vendor_id)"
    roles: [ProgramManager, OperationsAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []

  # ---- ProductionBatch ----
  - method: POST
    path: "/issuing/programs/{id}/production-batches"
    description: "Create a ProductionBatch (PLANNED)"
    roles: [OperationsAnalyst]
    code: 201
    input: [vendor_id, scheduled_for_utc_date, requested_card_count, unit_cost_cents]
    output: ProductionBatch
    side_effects: ["status=PLANNED; fulfilled_card_count=0"]

  - method: GET
    path: "/issuing/programs/{id}/production-batches"
    description: "List batches under a program"
    roles: [ProgramManager, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: ["status?", "vendor_id?", "limit?", "offset?"]
    output: ProductionBatch[]
    side_effects: []

  - method: GET
    path: "/issuing/production-batches/{id}"
    description: "Get a batch"
    roles: [ProgramManager, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []

  - method: POST
    path: "/issuing/production-batches/{id}/submit"
    description: "PLANNED→SUBMITTED"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []

  - method: POST
    path: "/issuing/production-batches/{id}/start"
    description: "SUBMITTED→IN_PRODUCTION"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []

  - method: POST
    path: "/issuing/production-batches/{id}/mark_shipped"
    description: "IN_PRODUCTION→SHIPPED"
    roles: [OperationsAnalyst]
    code: 200
    input: [fulfilled_card_count]
    output: ProductionBatch
    side_effects: ["books batch cost (production_batch_cost)"]

  - method: POST
    path: "/issuing/production-batches/{id}/mark_delivered"
    description: "SHIPPED→DELIVERED"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []

  - method: POST
    path: "/issuing/production-batches/{id}/cancel"
    description: "PLANNED|SUBMITTED→CANCELLED"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []

  - method: POST
    path: "/issuing/production-batches/{id}/mark_failed"
    description: "IN_PRODUCTION→FAILED"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: ["cards minted against batch but not yet ACTIVE flip to CANCELLED"]

  # ---- CardAccount ----
  - method: POST
    path: "/issuing/accounts"
    description: "Create a CardAccount (ONBOARDING)"
    roles: [ProgramManager]
    code: 201
    input: [program_id, external_account_ref, account_class, "credit_limit_cents?", daily_spend_cap_cents]
    output: CardAccount
    side_effects: ["lifecycle_status=ONBOARDING; available_balance_cents=0"]

  - method: GET
    path: "/issuing/accounts/{id}"
    description: "Get CardAccount"
    roles: [ProgramManager, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: CardAccount
    side_effects: []

  - method: GET
    path: "/issuing/accounts"
    description: "List CardAccounts; filterable by program_id, lifecycle_status"
    roles: [ProgramManager, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: ["program_id?", "lifecycle_status?", "limit?", "offset?"]
    output: CardAccount[]
    side_effects: []

  - method: GET
    path: "/issuing/programs/{id}/accounts"
    description: "Sub-resource listing of accounts under a program (FK reverse-reachability for CardAccount.program_id)"
    roles: [ProgramManager, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: ["lifecycle_status?", "limit?", "offset?"]
    output: CardAccount[]
    side_effects: []

  - method: GET
    path: "/issuing/authorization-rules/{id}/authorization-events"
    description: "List AuthorizationEvents declined/approved by a specific rule (FK reverse-reachability for AuthorizationEvent.applied_rule_id)"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AuthorizationEvent[]
    side_effects: []

  - method: PUT
    path: "/issuing/accounts/{id}"
    description: "Update account parameters (OCC-guarded)"
    roles: [ProgramManager]
    code: 200
    input: [expected_account_version, "daily_spend_cap_cents?", "credit_limit_cents?"]
    output: CardAccount
    side_effects: ["increments CardAccount.version by 1"]

  - method: POST
    path: "/issuing/accounts/{id}/activate"
    description: "ONBOARDING→OPEN"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CardAccount
    side_effects: ["lifecycle_status ← OPEN"]

  - method: POST
    path: "/issuing/accounts/{id}/suspend"
    description: "OPEN→SUSPENDED; cascades Cards ACTIVE→SUSPENDED"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CardAccount
    side_effects: []

  - method: POST
    path: "/issuing/accounts/{id}/resume"
    description: "SUSPENDED→OPEN; cascades Cards SUSPENDED→ACTIVE"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CardAccount
    side_effects: []

  - method: POST
    path: "/issuing/accounts/{id}/close"
    description: "OPEN|SUSPENDED→CLOSED; requires zero balance"
    roles: [ProgramManager]
    code: 200
    input: []
    output: CardAccount
    side_effects: ["cards → CANCELLED"]

  - method: POST
    path: "/issuing/accounts/{id}/fund"
    description: "Credit available_balance_cents (top-up or initial load)"
    roles: [FinanceController, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: CardAccount
    side_effects: ["available_balance_cents += amount_cents"]

  # ---- Card ----
  - method: POST
    path: "/issuing/accounts/{id}/cards"
    description: "Issue a Card against an account (consumes a PAN from a selected ACTIVE BinRange)"
    roles: [ProgramManager]
    code: 201
    input: [expiry_month, expiry_year, form_factor, "bin_range_id?"]
    output: Card
    side_effects:
      - "If bin_range_id omitted: selector picks ACTIVE BinRange under account.program with pans_available >= 1, sorted by bin_prefix ASC, tie-break effective_from ASC, then created_at ASC"
      - "bin_range.pans_allocated += 1"
      - "lifecycle_status=ISSUED; pin_status=UNSET"
      - "mints an ActivationToken (PENDING, expires_at = clock + 72h)"

  - method: GET
    path: "/issuing/cards/{id}"
    description: "Get a Card"
    roles: [ProgramManager, OperationsAnalyst, CardholderOps, PlatformAdmin]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: GET
    path: "/issuing/accounts/{id}/cards"
    description: "List cards under an account"
    roles: [ProgramManager, OperationsAnalyst, CardholderOps, PlatformAdmin]
    code: 200
    input: ["lifecycle_status?", "pin_status?", "limit?", "offset?"]
    output: Card[]
    side_effects: []

  - method: GET
    path: "/issuing/bin-ranges/{id}/cards"
    description: "List cards issued from a BinRange (FK reverse-reachability for Card.bin_range_id)"
    roles: [ProgramManager, OperationsAnalyst, PlatformAdmin]
    code: 200
    input: ["lifecycle_status?", "limit?", "offset?"]
    output: Card[]
    side_effects: []

  - method: GET
    path: "/issuing/cards"
    description: "Flat card list with FK filters; reverse-reachability for self-FKs (replaced_by_card_id, replaced_from_card_id) and reissue_campaign_id"
    roles: [ProgramManager, OperationsAnalyst, PlatformAdmin]
    code: 200
    input: ["account_id?", "bin_range_id?", "replaced_by_card_id?", "replaced_from_card_id?", "reissue_campaign_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Card[]
    side_effects: []

  - method: GET
    path: "/issuing/programs/{id}/mandate-acks"
    description: "List MandateAcks referencing a CardProgram (FK reverse-reachability for MandateAck.program_id)"
    roles: [ComplianceOfficer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MandateAck[]
    side_effects: []

  - method: POST
    path: "/issuing/cards/{id}/activate"
    description: "ISSUED→ACTIVE; consumes ActivationToken; requires pin_status=SET"
    roles: [CardholderOps]
    code: 200
    input: [activation_token]
    output: Card
    side_effects: ["ActivationToken.status ← CONSUMED; program.open_card_count += 1"]

  - method: POST
    path: "/issuing/cards/{id}/suspend"
    description: "ACTIVE→SUSPENDED"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: POST
    path: "/issuing/cards/{id}/resume"
    description: "SUSPENDED→ACTIVE"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: POST
    path: "/issuing/cards/{id}/cancel"
    description: "ISSUED|ACTIVE|SUSPENDED→CANCELLED"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Card
    side_effects: ["bin_range.pans_allocated -= 1; revokes PENDING ActivationToken"]

  - method: POST
    path: "/issuing/cards/{id}/mark_compromised"
    description: "ACTIVE→COMPROMISED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Card
    side_effects: ["risk_tier recompute for account; pans_allocated -= 1"]

  - method: POST
    path: "/issuing/cards/{id}/pin"
    description: "Set or change PIN (pin_status transitions)"
    roles: [CardholderOps]
    code: 200
    input: [new_pin, "current_pin?"]
    output: Card
    side_effects: ["pin_status ← SET"]

  - method: POST
    path: "/issuing/cards/{id}/pin_reset_request"
    description: "BLOCKED→RESET_PENDING"
    roles: [CardholderOps]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: POST
    path: "/issuing/cards/{id}/pin_block"
    description: "SET→BLOCKED (test-driving for PIN_FAIL_LIMIT path)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: POST
    path: "/issuing/cards/{id}/authorizations"
    description: "Create an AuthorizationEvent (evaluates rules, velocity, balance, daily cap)"
    roles: [CardholderOps, PlatformAdmin]
    code: 201
    input: [amount_cents, mcc, country_code]
    output: AuthorizationEvent
    side_effects:
      - "decision computed; if APPROVED, available_balance_cents -= amount_cents"
      - "if DECLINED_*, available_balance_cents unchanged"

  - method: GET
    path: "/issuing/cards/{id}/authorizations"
    description: "List authorization events for a card"
    roles: [ProgramManager, OperationsAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: AuthorizationEvent[]
    side_effects: []

  - method: GET
    path: "/issuing/cards/{id}/activation-tokens"
    description: "List activation tokens for a card (reverse-reachability)"
    roles: [CardholderOps, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ActivationToken[]
    side_effects: []

  # ---- Settlement ----
  - method: POST
    path: "/issuing/authorization-events/{id}/settle"
    description: "Settle an APPROVED AuthorizationEvent (creates Settlement with interchange)"
    roles: [PlatformAdmin, FinanceController]
    code: 201
    input: [settled_amount_cents]
    output: Settlement
    side_effects:
      - "qualification_tier resolved via qualification_tier_rules"
      - "interchange_cents computed via interchange_qualification (FINAL variant)"
      - "If settled_amount_cents < authorized amount_cents: remainder released back to account.available_balance_cents"

  - method: GET
    path: "/issuing/settlements/{id}"
    description: "Get settlement"
    roles: [FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/issuing/cards/{id}/settlements"
    description: "List settlements for a card"
    roles: [FinanceController, PlatformAdmin]
    code: 200
    input: ["qualification_tier?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/issuing/authorization-events/{id}"
    description: "Get an AuthorizationEvent by id (FK reverse-reachability for Settlement.authorization_event_id)"
    roles: [FinanceController, PlatformAdmin, ProgramManager, ComplianceOfficer]
    code: 200
    input: []
    output: AuthorizationEvent
    side_effects: []

  - method: GET
    path: "/issuing/authorization-events/{id}/settlements"
    description: "List settlements for an authorization event (1:0-or-1 array)"
    roles: [FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/issuing/accounts/{id}/authorization-events"
    description: "List authorization events for an account (FK reverse-reachability for AuthorizationEvent.account_id)"
    roles: [ProgramManager, OperationsAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: AuthorizationEvent[]
    side_effects: []

  - method: GET
    path: "/issuing/accounts/{id}/settlements"
    description: "List settlements for an account (FK reverse-reachability for Settlement.account_id)"
    roles: [FinanceController, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/issuing/programs/{id}/authorization-events"
    description: "List authorization events under a program (FK reverse-reachability for AuthorizationEvent.program_id)"
    roles: [ProgramManager, OperationsAnalyst, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: AuthorizationEvent[]
    side_effects: []

  # ---- AuthorizationRule ----
  - method: POST
    path: "/issuing/authorization-rules"
    description: "Create an AuthorizationRule (DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [subject_kind, subject_ref, rule_kind, "window_seconds?", "max_txn_count?", "max_amount_cents?", "mcc_list?", "country_code_list?", priority_rank]
    output: AuthorizationRule
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/issuing/authorization-rules/{id}"
    description: "Get rule"
    roles: [ComplianceOfficer, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: AuthorizationRule
    side_effects: []

  - method: GET
    path: "/issuing/authorization-rules"
    description: "List rules; filter by subject_kind, subject_ref, rule_kind, status"
    roles: [ComplianceOfficer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["subject_kind?", "subject_ref?", "rule_kind?", "status?", "limit?", "offset?"]
    output: AuthorizationRule[]
    side_effects: []

  - method: PUT
    path: "/issuing/authorization-rules/{id}"
    description: "Edit DRAFT rule"
    roles: [ComplianceOfficer]
    code: 200
    input: ["window_seconds?", "max_txn_count?", "max_amount_cents?", "mcc_list?", "country_code_list?", "priority_rank?"]
    output: AuthorizationRule
    side_effects: ["increments version"]

  - method: POST
    path: "/issuing/authorization-rules/{id}/activate"
    description: "DRAFT→ACTIVE (OCC-guarded)"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_rule_version]
    output: AuthorizationRule
    side_effects: ["increments version"]

  - method: POST
    path: "/issuing/authorization-rules/{id}/retire"
    description: "DRAFT|ACTIVE→RETIRED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AuthorizationRule
    side_effects: []

  # ---- Mandate ----
  - method: POST
    path: "/issuing/mandates"
    description: "Announce a Mandate"
    roles: [ComplianceOfficer]
    code: 201
    input: [network, mandate_code, title, effective_at, compliance_deadline, severity]
    output: Mandate
    side_effects: ["status=ANNOUNCED"]

  - method: GET
    path: "/issuing/mandates/{id}"
    description: "Get mandate"
    roles: [ComplianceOfficer, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: Mandate
    side_effects: []

  - method: GET
    path: "/issuing/mandates"
    description: "List mandates"
    roles: [ComplianceOfficer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["network?", "status?", "limit?", "offset?"]
    output: Mandate[]
    side_effects: []

  - method: POST
    path: "/issuing/mandates/{id}/retire"
    description: "ANNOUNCED|EFFECTIVE→RETIRED; cascades acks"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Mandate
    side_effects: ["acks in {DRAFT, RETURNED} → REJECTED; recomputes program.authorization_rules_locked"]

  # ---- MandateAck ----
  - method: POST
    path: "/issuing/mandates/{id}/acks"
    description: "Create MandateAck (DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [program_id, implementation_notes]
    output: MandateAck
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/issuing/mandates/{id}/acks"
    description: "List acks for a mandate"
    roles: [ComplianceOfficer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["status?", "program_id?", "limit?", "offset?"]
    output: MandateAck[]
    side_effects: []

  - method: GET
    path: "/issuing/mandates/{id}/acks/{id}"
    description: "Get ack"
    roles: [ComplianceOfficer, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: MandateAck
    side_effects: []

  - method: POST
    path: "/issuing/mandates/{id}/acks/{id}/submit"
    description: "DRAFT|RETURNED→SUBMITTED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MandateAck
    side_effects: ["program.authorization_rules_locked ← true; increments revision_count on RETURNED→SUBMITTED"]

  - method: POST
    path: "/issuing/mandates/{id}/acks/{id}/return"
    description: "SUBMITTED→RETURNED; SoD enforced"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MandateAck
    side_effects: ["program.authorization_rules_locked ← false"]

  - method: POST
    path: "/issuing/mandates/{id}/acks/{id}/verify"
    description: "SUBMITTED→VERIFIED; SoD enforced; deadline enforced"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MandateAck
    side_effects: ["program.authorization_rules_locked ← false; verified_by_user_id recorded"]

  - method: POST
    path: "/issuing/mandates/{id}/acks/{id}/reject"
    description: "SUBMITTED→REJECTED; SoD enforced"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MandateAck
    side_effects: ["program.authorization_rules_locked ← false"]

  # ---- ReissueCampaign ----
  - method: POST
    path: "/issuing/programs/{id}/reissue-campaigns"
    description: "Create a ReissueCampaign (DRAFT)"
    roles: [OperationsAnalyst]
    code: 201
    input: [campaign_kind, scheduled_for, selection_filter, "targeted_unit_fee_cents?", "blanket_unit_fee_cents?"]
    output: ReissueCampaign
    side_effects: ["status=DRAFT; estimated_card_count=0"]

  - method: GET
    path: "/issuing/programs/{id}/reissue-campaigns"
    description: "List campaigns for a program"
    roles: [ProgramManager, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: ["status?", "campaign_kind?", "limit?", "offset?"]
    output: ReissueCampaign[]
    side_effects: []

  - method: GET
    path: "/issuing/reissue-campaigns/{id}"
    description: "Get campaign"
    roles: [ProgramManager, OperationsAnalyst, FinanceController, PlatformAdmin]
    code: 200
    input: []
    output: ReissueCampaign
    side_effects: []

  - method: GET
    path: "/issuing/reissue-campaigns/{id}/cards"
    description: "List successor cards minted by a campaign (FK reverse-reachability for Card.reissue_campaign_id)"
    roles: [ProgramManager, OperationsAnalyst, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Card[]
    side_effects: []

  - method: POST
    path: "/issuing/reissue-campaigns/{id}/schedule"
    description: "DRAFT→SCHEDULED; computes estimated_card_count"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ReissueCampaign
    side_effects: ["estimated_card_count recomputed from selection_filter"]

  - method: POST
    path: "/issuing/reissue-campaigns/{id}/cancel"
    description: "DRAFT|SCHEDULED→CANCELLED"
    roles: [OperationsAnalyst]
    code: 200
    input: []
    output: ReissueCampaign
    side_effects: []

  # ---- ConversionJob ----
  - method: POST
    path: "/issuing/programs/{id}/conversion-jobs"
    description: "Schedule a ConversionJob (program must be SUNSETTING)"
    roles: [ProgramManager]
    code: 201
    input: [target_program_id, execution_at]
    output: ConversionJob
    side_effects: ["status=SCHEDULED; accounts_planned computed"]

  - method: GET
    path: "/issuing/programs/{id}/conversion-jobs"
    description: "List conversion jobs for a program"
    roles: [ProgramManager, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConversionJob[]
    side_effects: []

  - method: GET
    path: "/issuing/conversion-jobs/{id}"
    description: "Get conversion job"
    roles: [ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: ConversionJob
    side_effects: []

  - method: POST
    path: "/issuing/conversion-jobs/{id}/cancel"
    description: "SCHEDULED→CANCELLED"
    roles: [ProgramManager]
    code: 200
    input: []
    output: ConversionJob
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per §1.7" }

  # Existence
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "FK input does not resolve to an existing row" }

  # OCC
  - { id: ERR_MISSING_OCC_FIELD, http: 400, condition: "expected_<parent>_version missing on OCC-guarded endpoint" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version" }

  # Generic state
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource in wrong state for the requested transition" }

  # CardProgram / posture
  - { id: ERR_PROGRAM_NO_ACTIVE_BIN, http: 409, condition: "publish requires at least one ACTIVE BinRange" }
  - { id: ERR_MANDATE_ACK_IN_FLIGHT, http: 409, condition: "publish blocked: a MandateAck is SUBMITTED against an EFFECTIVE Mandate for this program" }
  - { id: ERR_PROGRAM_BATCH_IN_FLIGHT, http: 409, condition: "sunset blocked: a ProductionBatch under this program is SUBMITTED or IN_PRODUCTION" }
  - { id: ERR_PROGRAM_HAS_OPEN_ACCOUNTS, http: 409, condition: "terminate blocked: non-conversion termination requires every CardAccount in {CLOSED, CONVERTED_OUT}" }
  - { id: ERR_CONVERSION_NOT_COMPLETED, http: 409, condition: "terminate with PORTFOLIO_CONVERSION requires a COMPLETED ConversionJob for this program" }
  - { id: ERR_CONVERSION_IN_FLIGHT, http: 409, condition: "cancel_sunset blocked: a ConversionJob is SCHEDULED or EXECUTING for this program" }
  - { id: ERR_PROGRAM_NOT_LIVE, http: 409, condition: "operation requires CardProgram.posture = LIVE" }
  - { id: ERR_PROGRAM_NOT_EDITABLE, http: 409, condition: "operation requires CardProgram.posture in {DRAFT, LIVE}" }
  - { id: ERR_PROGRAM_RULES_LOCKED, http: 409, condition: "program.authorization_rules_locked = true" }

  # Bin
  - { id: ERR_BIN_HAS_ALLOCATED_PANS, http: 409, condition: "retire blocked: pans_allocated > 0" }
  - { id: ERR_NO_BIN_CAPACITY, http: 409, condition: "no ACTIVE BinRange under the program has pans_available >= 1" }
  - { id: ERR_BIN_NOT_IN_WINDOW, http: 409, condition: "BinRange effective window violated: effective_from must precede effective_until; card issuance requires clock in [effective_from, effective_until)" }

  # Vendor / batch
  - { id: ERR_VENDOR_INACTIVE, http: 409, condition: "ProductionVendor.is_active = false" }
  - { id: ERR_VENDOR_NETWORK_MISMATCH, http: 409, condition: "vendor.supported_networks does not contain program.network" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "requested_card_count > vendor.daily_capacity_cards" }
  - { id: ERR_VENDOR_BATCH_OVERLAP, http: 409, condition: "another batch for same vendor + UTC date is SUBMITTED or IN_PRODUCTION" }
  - { id: ERR_BATCH_DATE_PAST, http: 409, condition: "scheduled_for_utc_date is in the past at submit time" }
  - { id: ERR_FULFILLED_EXCEEDS_REQUESTED, http: 409, condition: "fulfilled_card_count > requested_card_count on mark_shipped" }

  # Account
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 409, condition: "Card activation requires account.lifecycle_status = OPEN" }
  - { id: ERR_ACCOUNT_TERMINAL_STATE, http: 409, condition: "Operation invalid against CLOSED or CONVERTED_OUT account" }
  - { id: ERR_ACCOUNT_BALANCE_NONZERO, http: 409, condition: "Account close requires available_balance_cents = 0" }

  # Card / PIN
  - { id: ERR_CARD_TERMINAL_STATE, http: 409, condition: "Operation invalid against CANCELLED, EXPIRED, COMPROMISED, or REPLACED card" }
  - { id: ERR_ACTIVATION_TOKEN_INVALID, http: 409, condition: "activation_token does not match a PENDING unexpired ActivationToken for this card" }
  - { id: ERR_PIN_NOT_SET, http: 409, condition: "Card activation requires pin_status = SET" }
  - { id: ERR_PIN_FORMAT_INVALID, http: 400, condition: "new_pin fails format (4-12 digits)" }

  # Authorization / fiscal
  - { id: ERR_INSUFFICIENT_FUNDS, http: 409, condition: "account.available_balance_cents < amount_cents" }
  - { id: ERR_VELOCITY_EXCEEDED, http: 409, condition: "VELOCITY AuthorizationRule limit exceeded" }
  - { id: ERR_DAILY_CAP_EXCEEDED, http: 409, condition: "cumulative approved auths in rolling 24h would exceed account.daily_spend_cap_cents" }

  # Mandate / SoD
  - { id: ERR_SOD_SAME_USER, http: 409, condition: "X-User-ID equals MandateAck.submitted_by_user_id" }
  - { id: ERR_MANDATE_DEADLINE_PASSED, http: 409, condition: "clock >= mandate.compliance_deadline at verify" }
  - { id: ERR_MANDATE_HAS_OPEN_ACKS, http: 409, condition: "retire blocked: a MandateAck is SUBMITTED for this mandate" }

  # Campaign / Conversion
  - { id: ERR_CAMPAIGN_DATE_PAST, http: 409, condition: "scheduled_for is not strictly in the future at schedule" }
  - { id: ERR_CAMPAIGN_EMPTY_SELECTION, http: 409, condition: "reissue_batch_selection at schedule yields empty set" }
  - { id: ERR_CONVERSION_DATE_PAST, http: 409, condition: "execution_at is not strictly in the future at schedule" }
  - { id: ERR_CONVERSION_TARGET_INVALID, http: 409, condition: "target_program_id fails admissibility: must be LIVE, same network, same currency, != source" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Break-glass operator. Owns test-driving clock endpoint, vendor registration, and administrative settlement endpoints."
    identity: opaque
    exclusive_operations:
      - "POST /issuing/_clock/set_current_utc"
      - "POST /issuing/vendors"
      - "POST /issuing/cards/{id}/pin_block"
    shared_operations:
      - "GET on all resources"
      - "POST /issuing/accounts/{id}/fund (shared with FinanceController)"
      - "POST /issuing/cards/{id}/authorizations (shared with CardholderOps)"
      - "POST /issuing/authorization-events/{id}/settle (shared with FinanceController)"

  - name: ProgramManager
    description: "Owns CardProgram lifecycle, BinRange management, CardAccount lifecycle, Card issuance, ConversionJob scheduling. Identity is opaque (operator id, not a persisted entity)."
    identity: opaque
    exclusive_operations:
      - "POST /issuing/programs, PUT /issuing/programs/{id}"
      - "POST /issuing/programs/{id}/publish, /sunset, /cancel_sunset, /terminate"
      - "POST /issuing/programs/{id}/bin-ranges, /bin-ranges/{id}/freeze, /unfreeze, /retire"
      - "POST /issuing/accounts, PUT /issuing/accounts/{id}"
      - "POST /issuing/accounts/{id}/activate, /suspend, /resume, /close"
      - "POST /issuing/accounts/{id}/cards (card issuance)"
      - "POST /issuing/cards/{id}/suspend, /resume, /cancel"
      - "POST /issuing/programs/{id}/conversion-jobs, POST /issuing/conversion-jobs/{id}/cancel"
    shared_operations:
      - "GET on programs, accounts, cards, authorization-rules, mandates, acks, campaigns, conversion-jobs"

  - name: ComplianceOfficer
    description: "Owns network Mandates, MandateAcks (submit/return/verify/reject with SoD), AuthorizationRules, card compromise actions."
    identity: opaque
    exclusive_operations:
      - "POST /issuing/mandates, POST /issuing/mandates/{id}/retire"
      - "POST /issuing/mandates/{id}/acks, /submit, /return, /verify, /reject"
      - "POST /issuing/authorization-rules, PUT /issuing/authorization-rules/{id}, /activate, /retire"
      - "POST /issuing/cards/{id}/mark_compromised"
    shared_operations:
      - "GET on programs, accounts, cards, authorization-rules, mandates, acks"

  - name: OperationsAnalyst
    description: "Owns ProductionBatch lifecycle and ReissueCampaign lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /issuing/programs/{id}/production-batches, /submit, /start, /mark_shipped, /mark_delivered, /cancel, /mark_failed"
      - "POST /issuing/programs/{id}/reissue-campaigns, /schedule, /cancel"
    shared_operations:
      - "GET on programs, accounts, cards, vendors, batches, campaigns"

  - name: FinanceController
    description: "Owns program economics reads, account funding, and settlement."
    identity: opaque
    exclusive_operations:
      - "GET /issuing/programs/{id}/economics"
    shared_operations:
      - "POST /issuing/accounts/{id}/fund (shared with PlatformAdmin)"
      - "POST /issuing/authorization-events/{id}/settle (shared with PlatformAdmin)"
      - "GET on programs, accounts, settlements, batches, campaigns"

  - name: CardholderOps
    description: "Performs card activation, PIN management, and initiates authorizations on behalf of the cardholder."
    identity: opaque
    exclusive_operations:
      - "POST /issuing/cards/{id}/activate"
      - "POST /issuing/cards/{id}/pin"
      - "POST /issuing/cards/{id}/pin_reset_request"
    shared_operations:
      - "GET on cards, activation-tokens"
      - "POST /issuing/cards/{id}/authorizations (shared with PlatformAdmin)"
