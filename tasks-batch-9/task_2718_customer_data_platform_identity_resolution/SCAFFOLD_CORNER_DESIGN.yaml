            - "Profile.${p1_id}.address_hash is non-null and equals Household.${hh_id}.address_hash — the survivor adopted the loser's value precisely because its own was null"
            - "Profile.${p1_id}.source_record_count == 2, lifetime_value_cents == 0 and contributing_source_system_codes == [CA_PROJ]"
