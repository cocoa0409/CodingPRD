    input: ["order_code", "product_model_id", "target_warehouse_id", "ordered_qty", "demand_bucket_id?"]
    output: ProductionOrder
    side_effects: ["status initialised to DRAFT; completed_qty and scrapped_qty to 0", "all cost fields initialised to 0 and unit_cost_cents to null", "version initialised to 1"]
  - method: GET
    path: "/production-orders"
    description: "List build orders, filterable by hull model, demand bucket, target site and status."
    roles: [PlantAdmin, LogisticsPlanner, MoldingOperator, ResinTechnician, QualityInspector]
    code: 200
    input: ["product_model_id?", "demand_bucket_id?", "target_warehouse_id?", "status?", "blocked_reason?", "limit?", "offset?"]
    output: ProductionOrder[]
    side_effects: []
  - method: GET
    path: "/production-orders/{production_order_id}"
    description: "Read one build order including its live version, completion counters and rolled-up costs."
    roles: [PlantAdmin, LogisticsPlanner, MoldingOperator, ResinTechnician, QualityInspector]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: POST
    path: "/production-orders/{production_order_id}/release"
    description: "Release a DRAFT order to the floor. The destination state depends on resin qualification and on the target site's posture."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["status DRAFT -> READY_TO_SCHEDULE when calculations.qualified_resin_lot_count >= 1 and the target site is not FROZEN", "status DRAFT -> BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT when the qualified count is 0", "status DRAFT -> BLOCKED_WAREHOUSE with blocked_reason WAREHOUSE_FROZEN when the target site posture is FROZEN (the warehouse test is evaluated first)", "increments ProductionOrder.version by 1"]
  - method: POST
    path: "/production-orders/{production_order_id}/cancel"
    description: "Cancel an order that has not completed, releasing everything it holds."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 200
    input: [cancel_reason]
    output: ProductionOrder
    side_effects: ["status DRAFT, READY_TO_SCHEDULE, BLOCKED_RESIN, BLOCKED_WAREHOUSE or IN_PRODUCTION -> CANCELLED", "SCHEDULED cycles of this order -> ABORTED with abort_reason ORDER_CANCELLED", "their RESERVED charges -> RELEASED with released_reason ORDER_CANCELLED, returning mass to their lots", "DEPLETED lots that regain mass -> AVAILABLE and unblock other BLOCKED_RESIN orders", "already-produced FinishedUnit rows are retained and keep their own states", "increments ProductionOrder.version by 1"]
  - method: GET
    path: "/production-orders/{production_order_id}/cost-summary"
    description: "Computed read: the order's material, oven-energy, overhead, total and unit costs with the overhead tier that was selected from the pre-overhead subtotal."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 200
    input: []
    # projection shape: ProductionOrderCostSummary
    output:
      production_order_id: "string — the order"
      consumed_charge_count: "integer — ResinCharge rows in status CONSUMED reached through this order's cycles"
      material_cost_cents: "integer — per-charge products rounded to whole cents, then summed"
      demolded_cycle_count: "integer — MoldingCycle rows in status DEMOLDED"
      oven_energy_cost_cents: "integer — per-cycle products rounded to whole cents, then summed"
      pre_overhead_subtotal_cents: "integer — material + oven energy; the value the overhead tier is selected from"
      overhead_rate_pct: "number(2) — the tier chosen once from pre_overhead_subtotal_cents and never re-selected"
      overhead_cents: "integer — round_half_up(pre_overhead_subtotal_cents * overhead_rate_pct / 100)"
      total_cost_cents: "integer — pre-overhead subtotal plus overhead"
      completed_qty: "integer — SELLABLE-or-shipped units for this order"
      unit_cost_cents: "integer or null — floor(total_cost_cents / completed_qty), null while completed_qty is 0"
    side_effects: []
    output_schema:
      production_order_id: "string — the order"
      consumed_charge_count: "integer — ResinCharge rows in status CONSUMED reached through this order's cycles"
      material_cost_cents: "integer — per-charge products rounded to whole cents, then summed"
      demolded_cycle_count: "integer — MoldingCycle rows in status DEMOLDED"
      oven_energy_cost_cents: "integer — per-cycle products rounded to whole cents, then summed"
      pre_overhead_subtotal_cents: "integer — material + oven energy; the value the overhead tier is selected from"
      overhead_rate_pct: "number(2) — the tier chosen once from pre_overhead_subtotal_cents and never re-selected"
      overhead_cents: "integer — round_half_up(pre_overhead_subtotal_cents * overhead_rate_pct / 100)"
      total_cost_cents: "integer — pre-overhead subtotal plus overhead"
      completed_qty: "integer — SELLABLE-or-shipped units for this order"
      unit_cost_cents: "integer or null — floor(total_cost_cents / completed_qty), null while completed_qty is 0"

  # -------------------------------- MoldingCycle --------------------------------
  - method: POST
    path: "/molding-cycles"
    description: "Schedule an oven-and-cooling cycle for an order. The server selects the Mold (calculations.mold_selection) and projects all four window timestamps. Guarded by OCC on the order (§1.2.1 cycle-create-stale-order)."
    roles: [MoldingOperator]
    code: 201
    input: ["production_order_id", "oven_station_id", "arm_index", "cooling_bay_id", "oven_start_at", "scheduled_oven_minutes", "scheduled_cooling_minutes", "oven_temp_c", "arm_rpm_major", "arm_rpm_minor", "cooling_mode", "expected_production_order_version", "exclude_mold_ids?"]
    output: MoldingCycle
    side_effects: ["mold_id set by calculations.mold_selection (ranked by cycles_since_service ASC then mold_code ASC, honouring exclude_mold_ids); the selected id is returned in the response so a test can observe the choice", "operator_technician_id set to the acting X-User-ID", "oven_end_at, cooling_window_start_at and cooling_window_end_at projected per calculations.cycle_window_projection", "the oven arm half-open buffered window and the cooling bay closed-window slot capacity are both checked before the row is written", "status initialised to SCHEDULED; charged_mass_kg to 0.000", "ProductionOrder READY_TO_SCHEDULE -> IN_PRODUCTION on the first accepted cycle", "increments ProductionOrder.version by 1"]
  - method: GET
    path: "/molding-cycles"
    description: "List cycles, filterable by order, selected mould, station, bay, operator and status."
    roles: [PlantAdmin, MoldingOperator, ResinTechnician, QualityInspector, LogisticsPlanner]
    code: 200
    input: ["production_order_id?", "mold_id?", "oven_station_id?", "cooling_bay_id?", "operator_technician_id?", "status?", "abort_reason?", "oven_start_from?", "oven_start_to?", "limit?", "offset?"]
    output: MoldingCycle[]
    side_effects: []
  - method: GET
    path: "/molding-cycles/{molding_cycle_id}"
    description: "Read one cycle including the server-selected mold_id, all projected and actual window timestamps, the charge rollups and provisional_warpage_index."
    roles: [PlantAdmin, MoldingOperator, ResinTechnician, QualityInspector, LogisticsPlanner]
    code: 200
    input: []
    output: MoldingCycle
    side_effects: []
  - method: POST
    path: "/molding-cycles/{molding_cycle_id}/start-oven"
    description: "Start the oven run. Consumes every reserved charge and locks the mould and station."
    roles: [MoldingOperator]
    code: 200
    input: [actual_oven_start_at]
    output: MoldingCycle
    side_effects: ["status SCHEDULED -> OVEN_RUNNING; actual_oven_start_at recorded", "every RESERVED ResinCharge of this cycle -> CONSUMED, moving charge_kg from ResinLot.reserved_kg to consumed_kg (irreversible)", "charge mass tolerance and the blended regrind ceiling are re-checked before the transition", "Mold status AVAILABLE -> IN_CYCLE", "increments MoldingCycle.version by 1 and Mold.version by 1"]
  - method: POST
    path: "/molding-cycles/{molding_cycle_id}/enter-cooling"
    description: "End the oven run and move the mould to its cooling bay."
    roles: [MoldingOperator]
    code: 200
    input: [actual_oven_end_at]
    output: MoldingCycle
    side_effects: ["status OVEN_RUNNING -> COOLING; actual_oven_end_at recorded and actual_oven_minutes computed by flooring whole minutes", "the arm is freed for scheduling because arm occupancy only counts SCHEDULED and OVEN_RUNNING cycles", "increments MoldingCycle.version by 1"]
  - method: POST
    path: "/molding-cycles/{molding_cycle_id}/demold"
    description: "Demould the cycle, mint one FinishedUnit per mould cavity, and advance the mould's service counter. Head of CASCADE-B."
    roles: [MoldingOperator]
    code: 200
    input: [actual_cooling_end_at]
    output: MoldingCycle
    side_effects: ["status COOLING -> DEMOLDED; actual_cooling_minutes computed by flooring whole minutes and checked against ProductModel.min_cooling_minutes", "provisional_warpage_index set from calculations.cycle_warpage_index variant PROVISIONAL", "one FinishedUnit per Mold.cavity_count is created in ascending cavity_index order with build_status DEMOLDED, logistics_status UNALLOCATED and a deterministic hull_serial; they are discoverable only through GET /finished-units?molding_cycle_id=", "CASCADE-B link 1: Mold.cycles_since_service incremented by 1", "CASCADE-B link 2: the mould -> MAINTENANCE when the counter reaches service_interval_cycles", "CASCADE-B link 3: that mould's other SCHEDULED cycles -> ABORTED with abort_reason MOLD_SERVICE_DUE", "CASCADE-B link 4: their RESERVED charges -> RELEASED, returning mass and reviving DEPLETED lots", "CASCADE-B link 5: BLOCKED_RESIN orders those lots qualify for are unblocked", "increments MoldingCycle.version by 1 and Mold.version by 1"]
  - method: POST
    path: "/molding-cycles/{molding_cycle_id}/abort"
    description: "Abort a cycle before demould. Head of CASCADE-A."
    roles: [MoldingOperator, PlantAdmin]
    code: 200
    input: [abort_reason]
    output: MoldingCycle
    side_effects: ["status SCHEDULED or OVEN_RUNNING -> ABORTED; no FinishedUnit is created", "CASCADE-A link 2: RESERVED charges of this cycle -> RELEASED with released_reason CYCLE_ABORTED, returning charge_kg to available_kg; CONSUMED charges are NOT reversed", "CASCADE-A link 3: DEPLETED lots that regain mass -> AVAILABLE", "CASCADE-A link 4: BLOCKED_RESIN orders those lots qualify for -> READY_TO_SCHEDULE, or BLOCKED_WAREHOUSE when the target site is FROZEN", "Mold IN_CYCLE -> AVAILABLE without incrementing cycles_since_service", "the oven arm window and cooling bay slot are freed", "increments MoldingCycle.version by 1"]

  # -------------------------------- FinishedUnit --------------------------------
  # No POST: units are minted by the demold cascade, so the filtered list below
  # is their only discovery channel (and the reverse-reachability GET for all
  # six of their FKs).
  - method: GET
    path: "/finished-units"
    description: "List finished hulls, filterable by producing cycle, hull model, storing site, outfitting and inspecting technician, demand bucket, and either state axis."
    roles: [PlantAdmin, AssemblyTechnician, QualityInspector, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: ["molding_cycle_id?", "product_model_id?", "warehouse_id?", "outfitted_by_technician_id?", "inspected_by_technician_id?", "demand_bucket_id?", "build_status?", "logistics_status?", "inspection_verdict?", "storage_zone_code?", "is_zone_anchor?", "limit?", "offset?"]
    output: FinishedUnit[]
    side_effects: []
  - method: GET
    path: "/finished-units/{finished_unit_id}"
    description: "Read one hull including hull_serial, both state axes, the wall-thickness statistics, final_warpage_index, storage footprint and anchor flag."
    roles: [PlantAdmin, AssemblyTechnician, QualityInspector, LogisticsPlanner, WarrantyAgent, Customer]
    code: 200
    input: []
    output: FinishedUnit
    side_effects: []
  - method: POST
    path: "/finished-units/{finished_unit_id}/trim"
    description: "Trim flash and cut openings on a demoulded or reworked hull."
    roles: [AssemblyTechnician]
    code: 200
    input: [trim_waste_kg]
    output: FinishedUnit
    side_effects: ["build_status DEMOLDED or REWORK -> TRIMMED", "on the REWORK entry the previously recorded hardware_kit_serial is cleared to null so outfitting must be redone", "increments FinishedUnit.version by 1"]
  - method: POST
    path: "/finished-units/{finished_unit_id}/outfit"
    description: "Install hardware and outfitting on a fixture. Requires the FIXTURE_ASSEMBLY certification."
    roles: [AssemblyTechnician]
    code: 200
    input: [hardware_kit_serial]
    output: FinishedUnit
    side_effects: ["build_status TRIMMED -> OUTFITTED", "outfitted_by_technician_id set to the acting X-User-ID, which permanently bars that technician from inspecting this hull", "increments FinishedUnit.version by 1"]
  - method: POST
    path: "/finished-units/{finished_unit_id}/inspect"
    description: "Record wall-thickness measurements, impact energy and cosmetic grade, then apply calculations.inspection_verdict. Also usable as a re-inspection of a SELLABLE hull that is still UNALLOCATED, which can demote it (CASCADE-D)."
    roles: [QualityInspector]
    code: 200
    input: [wall_thickness_points, impact_test_joules, cosmetic_defect_grade]
    output: FinishedUnit
    side_effects: ["mean_wall_thickness_mm, wall_sd_mm, wall_cv_pct and min_wall_thickness_mm computed per calculations.wall_thickness_distribution with its mandated rounding order", "final_warpage_index computed from calculations.cycle_warpage_index variant FINAL", "inspection_verdict set to PASS, REWORK or SCRAP; build_status -> SELLABLE, REWORK or SCRAPPED accordingly", "rework_count incremented on a REWORK verdict; a REWORK verdict at rework_count 2 is converted to SCRAP", "inspected_by_technician_id set to the acting X-User-ID", "ProductionOrder.completed_qty and scrapped_qty recomputed; the order moves IN_PRODUCTION -> COMPLETE, or COMPLETE -> IN_PRODUCTION on a demotion (CASCADE-D link 3)", "the order's cost rollups and unit_cost_cents recomputed", "increments FinishedUnit.version by 1 and ProductionOrder.version by 1"]
  - method: POST
    path: "/finished-units/{finished_unit_id}/scrap"
    description: "Scrap a hull outright without a full inspection."
    roles: [QualityInspector]
    code: 200
    input: [scrap_reason]
    output: FinishedUnit
    side_effects: ["build_status -> SCRAPPED (terminal) and inspection_verdict -> SCRAP", "ProductionOrder.scrapped_qty and completed_qty recomputed; a COMPLETE order reverts to IN_PRODUCTION when completed_qty falls below ordered_qty", "increments FinishedUnit.version by 1 and ProductionOrder.version by 1"]
  - method: POST
    path: "/finished-units/{finished_unit_id}/store"
    description: "Store a SELLABLE hull at the producing order's target site. The server selects the zone and computes the nested footprint. Guarded by OCC on the warehouse (§1.2.1 store-unit-stale-warehouse)."
    roles: [LogisticsPlanner]
    code: 200
    input: [expected_warehouse_version]
    output: FinishedUnit
    side_effects: ["logistics_status UNALLOCATED -> STORED; warehouse_id and demand_bucket_id copied from the producing order; stored_at set to the logical clock", "storage_zone_code chosen by calculations.storage_zone_selection (anchor affinity, then tightest fit, then zone_code ASC) and returned in the response", "stored_footprint_cube_m3 and is_zone_anchor set by calculations.storage_footprint", "CASCADE-H links 2-4: Warehouse.committed_cube_m3, utilization_pct and posture recomputed; a site reaching frozen_threshold_pct sends its READY_TO_SCHEDULE and IN_PRODUCTION orders to BLOCKED_WAREHOUSE", "DemandForecastBucket.build_ahead_committed_qty recomputed", "increments Warehouse.version by 1 and FinishedUnit.version by 1"]
  - method: POST
    path: "/finished-units/{finished_unit_id}/release-storage"
    description: "Pull a stored hull back out of the warehouse. Head of CASCADE-C, including anchor promotion."
    roles: [LogisticsPlanner]
    code: 200
    input: [release_reason]
    output: FinishedUnit
    side_effects: ["logistics_status STORED -> UNALLOCATED; warehouse_id, storage_zone_code, stored_at and demand_bucket_id cleared; stored_footprint_cube_m3 -> 0.0000 and is_zone_anchor -> false", "CASCADE-C link 2: when the released hull was its nest group's anchor, the earliest remaining sibling (stored_at ASC, tie-break hull_serial ASC) is promoted to anchor at full gross cube", "CASCADE-C link 3: Warehouse.committed_cube_m3, utilization_pct and posture recomputed — the promotion can leave utilisation higher than a naive subtraction predicts", "CASCADE-C link 4: a site leaving FROZEN returns its BLOCKED_WAREHOUSE orders to READY_TO_SCHEDULE", "DemandForecastBucket.build_ahead_committed_qty recomputed downward", "increments Warehouse.version by 1 and FinishedUnit.version by 1"]

  # ----------------------------------- Shipment -----------------------------------
  - method: POST
    path: "/shipments"
    description: "Plan a trailer out of one site to one freight zone with a cube capacity and payload ceiling."
    roles: [LogisticsPlanner]
    code: 201
    input: [shipment_code, origin_warehouse_id, destination_zone, carrier_code, trailer_cube_capacity_m3, trailer_max_payload_kg]
    output: Shipment
    side_effects: ["status initialised to PLANNED; all cube, weight, utilisation and freight fields to 0 or null", "refused with ERR_WAREHOUSE_POSTURE_RESTRICTED when the origin site is RESTRICTED or FROZEN and the requested trailer cube exceeds the site's remaining cube", "version initialised to 1"]
  - method: GET
    path: "/shipments"
    description: "List trailers, filterable by origin site, zone, carrier and status."
    roles: [PlantAdmin, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: ["origin_warehouse_id?", "destination_zone?", "carrier_code?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/shipments/{shipment_id}"
    description: "Read one trailer including loaded_cube_m3, nested_cube_m3, cube_utilization_pct, density_kg_per_m3 and both freight figures."
    roles: [PlantAdmin, LogisticsPlanner, WarrantyAgent, Customer]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/shipments/{shipment_id}/seal"
    description: "Seal a loaded trailer and quote the freight on the NESTED cube basis."
    roles: [LogisticsPlanner]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status LOADING -> SEALED; sealed_at set to the logical clock", "refused with ERR_TRAILER_UNDERUTILIZED unless cube_utilization_pct >= 60.00", "quoted_freight_cents set from calculations.shipment_freight variant QUOTED (per-line rounding, then the utilisation discount tier chosen from cube_utilization_pct, then the fuel surcharge on the discounted base)", "increments Shipment.version by 1"]
  - method: POST
    path: "/shipments/{shipment_id}/unseal"
    description: "Reopen a sealed trailer for reloading, invalidating its quote."
    roles: [LogisticsPlanner]
    code: 200
    input: [unseal_reason]
    output: Shipment
    side_effects: ["status SEALED -> LOADING (the documented backward edge)", "quoted_freight_cents and sealed_at cleared to null, so the next seal must recompute the quote from the then-current lines", "increments Shipment.version by 1"]
  - method: POST
    path: "/shipments/{shipment_id}/depart"
    description: "Dispatch a sealed trailer. This is the event that frees warehouse footprint, not the seal."
    roles: [LogisticsPlanner]
    code: 200
    input: [departed_at]
    output: Shipment
    side_effects: ["status SEALED -> IN_TRANSIT; departed_at recorded", "every loaded hull's logistics_status LOADED -> IN_TRANSIT, clearing its storage_zone_code, stored_at and demand_bucket_id and zeroing stored_footprint_cube_m3", "CASCADE-C links 2-4 run once per vacated nest group: anchor promotion, then the site's cube / utilisation / posture recompute, then unblocking BLOCKED_WAREHOUSE orders", "DemandForecastBucket.build_ahead_committed_qty recomputed downward", "increments Shipment.version by 1 and Warehouse.version by 1"]
  - method: POST
    path: "/shipments/{shipment_id}/deliver"
    description: "Record delivery and bill the freight on the GROSS cube basis, so the bill deliberately differs from the quote."
    roles: [LogisticsPlanner]
    code: 200
    input: [delivered_at]
    output: Shipment
    side_effects: ["status IN_TRANSIT -> DELIVERED; delivered_at recorded", "billed_freight_cents set from calculations.shipment_freight variant BILLED", "every hull on the trailer -> logistics_status DELIVERED with its own delivered_at set, which starts the warranty clock", "increments Shipment.version by 1"]
  - method: POST
    path: "/shipments/{shipment_id}/cancel"
    description: "Cancel a trailer that has not departed, returning its hulls to storage."
    roles: [LogisticsPlanner]
    code: 200
    input: [cancel_reason]
    output: Shipment
    side_effects: ["status PLANNED, LOADING or SEALED -> CANCELLED", "every LOADED ShipmentLine -> REMOVED and each hull's logistics_status LOADED -> STORED; because loaded hulls never left their zones, no warehouse footprint moves", "quoted_freight_cents and sealed_at cleared to null when the trailer was SEALED", "increments Shipment.version by 1"]
  - method: GET
    path: "/shipments/{shipment_id}/freight-summary"
    description: "Computed read: the per-line chargeable masses, the discount tier selected from cube_utilization_pct, and both the nested-basis quote and the gross-basis bill, so the quote-to-bill variance is observable in one call."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 200
    input: []
    # projection shape: ShipmentFreightSummary
    output:
      shipment_id: "string — the trailer"
      loaded_line_count: "integer — ShipmentLine rows in status LOADED"
      loaded_cube_m3: "number(4) — sum of line_gross_cube_m3"
      nested_cube_m3: "number(4) — sum of line_nested_cube_m3"
      loaded_weight_kg: "number(3) — sum of unit weights"
      cube_utilization_pct: "number(2) — nested_cube_m3 / trailer_cube_capacity_m3 * 100"
      density_kg_per_m3: "number(3) — loaded_weight_kg / nested_cube_m3"
      discount_rate_pct: "number(2) — the tier chosen once from cube_utilization_pct"
      quoted_pre_discount_cents: "integer — sum of per-line freight on the nested basis"
      quoted_freight_cents: "integer or null — the sealed quote, null while unsealed"
      billed_pre_discount_cents: "integer — sum of per-line freight on the gross basis"
      billed_freight_cents: "integer or null — the delivered bill, null before delivery"
      lines: "array of { shipment_line_id, hull_serial, nest_position, line_gross_cube_m3, line_nested_cube_m3, chargeable_kg_nested, chargeable_kg_gross, line_freight_cents }"
    side_effects: []
    output_schema:
      shipment_id: "string — the trailer"
      loaded_line_count: "integer — ShipmentLine rows in status LOADED"
      loaded_cube_m3: "number(4) — sum of line_gross_cube_m3"
      nested_cube_m3: "number(4) — sum of line_nested_cube_m3"
      loaded_weight_kg: "number(3) — sum of unit weights"
      cube_utilization_pct: "number(2) — nested_cube_m3 / trailer_cube_capacity_m3 * 100"
      density_kg_per_m3: "number(3) — loaded_weight_kg / nested_cube_m3"
      discount_rate_pct: "number(2) — the tier chosen once from cube_utilization_pct"
      quoted_pre_discount_cents: "integer — sum of per-line freight on the nested basis"
      quoted_freight_cents: "integer or null — the sealed quote, null while unsealed"
      billed_pre_discount_cents: "integer — sum of per-line freight on the gross basis"
      billed_freight_cents: "integer or null — the delivered bill, null before delivery"
      lines: "array of { shipment_line_id, hull_serial, nest_position, line_gross_cube_m3, line_nested_cube_m3, chargeable_kg_nested, chargeable_kg_gross, line_freight_cents }"

  # --------------------------------- ShipmentLine ---------------------------------
  - method: POST
    path: "/shipment-lines"
    description: "Load one stored hull onto a trailer. The server assigns nest_position and both line cubes. Guarded by OCC on the shipment (§1.2.1 line-create-stale-shipment)."
    roles: [LogisticsPlanner]
    code: 201
    input: [shipment_id, finished_unit_id, expected_shipment_version]
    output: ShipmentLine
    side_effects: ["status initialised to LOADED; nest_position, line_gross_cube_m3 and line_nested_cube_m3 set by calculations.shipment_cube_rollup", "the hull's logistics_status STORED -> LOADED while its warehouse footprint stays exactly where it was", "Shipment PLANNED -> LOADING; loaded_cube_m3, nested_cube_m3, loaded_weight_kg, cube_utilization_pct and density_kg_per_m3 recomputed", "both trailer admission tests are applied to the rounded post-add values before the row is written", "increments Shipment.version by 1 and FinishedUnit.version by 1"]
  - method: GET
    path: "/shipment-lines"
    description: "List trailer lines, filterable by trailer and by hull."
    roles: [PlantAdmin, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: ["shipment_id?", "finished_unit_id?", "status?", "limit?", "offset?"]
    output: ShipmentLine[]
    side_effects: []
  - method: GET
    path: "/shipment-lines/{shipment_line_id}"
    description: "Read one trailer line including its nest_position and the gross and nested cubes it was charged."
    roles: [PlantAdmin, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: []
    output: ShipmentLine
    side_effects: []
  - method: POST
    path: "/shipment-lines/{shipment_line_id}/remove"
    description: "Unload one hull from a trailer that has not departed."
    roles: [LogisticsPlanner]
    code: 200
    input: [remove_reason]
    output: ShipmentLine
    side_effects: ["status LOADED -> REMOVED; the hull's logistics_status LOADED -> STORED", "nest_position renumbered from 1 over the surviving LOADED lines of the same hull model (created_at ASC, tie-break hull_serial ASC), which can promote a nested follower to a full-cube position-1 line and RAISE nested_cube_m3", "the trailer's cube, weight, utilisation and density rollups recomputed; a SEALED trailer reverts to LOADING with quoted_freight_cents cleared", "Shipment LOADING -> PLANNED when the last LOADED line is removed", "increments ShipmentLine.version by 1, Shipment.version by 1 and FinishedUnit.version by 1"]

  # --------------------------------- WarrantyClaim ---------------------------------
  - method: POST
    path: "/warranty-claims"
    description: "Open a warranty claim on a delivered hull. Both state axes start at SUBMITTED and NOT_STARTED."
    roles: [WarrantyAgent, Customer]
    code: 201
    input: ["claim_code", "finished_unit_id", "customer_id", "claim_type", "reported_deformation_mm?", "storage_description?"]
    output: WarrantyClaim
    side_effects: ["claim_status initialised to SUBMITTED and storage_review_status to NOT_STARTED", "all money fields initialised to null and months_in_service to null", "a Customer caller may only open a claim whose customer_id equals its own X-User-ID", "version initialised to 1"]
  - method: GET
    path: "/warranty-claims"
    description: "List claims, filterable by hull, customer and either state axis."
    roles: [PlantAdmin, WarrantyAgent, Customer]
    code: 200
    input: ["finished_unit_id?", "customer_id?", "claim_type?", "claim_status?", "storage_review_status?", "denial_reason?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{warranty_claim_id}"
    description: "Read one claim including both state axes, months_in_service and the full money breakdown."
    roles: [PlantAdmin, WarrantyAgent, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/start-review"
    description: "Take a submitted claim into review and freeze its age in months."
    roles: [WarrantyAgent]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["claim_status SUBMITTED -> UNDER_REVIEW", "months_in_service computed as complete calendar months from the hull's delivered_at to the logical clock (floored)", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/storage-review"
    description: "Decide the independent storage-guidance axis. VERIFIED requires the customer's acknowledgement to be dated at or before the hull's delivered_at."
    roles: [WarrantyAgent]
    code: 200
    input: [outcome, storage_description]
    output: WarrantyClaim
    side_effects: ["storage_review_status NOT_STARTED -> GUIDANCE_VERIFIED when outcome is VERIFIED, or -> GUIDANCE_VIOLATED when outcome is VIOLATED", "storage_description stored", "the claim_status axis is untouched — the claim remains UNDER_REVIEW", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/waive-storage-finding"
    description: "Administratively waive a storage violation so the claim becomes approvable at a reduced value."
    roles: [PlantAdmin]
    code: 200
    input: [waiver_note]
    output: WarrantyClaim
    side_effects: ["storage_review_status GUIDANCE_VIOLATED -> WAIVED", "approval is unblocked but calculations.warranty_payout still applies the 35.00 pct storage deduction", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/approve"
    description: "Approve and price a claim, drawing the payout from the hull model's warranty reserve. Guarded by OCC on the ProductModel (§1.2.1 claim-approve-stale-product-model)."
    roles: [WarrantyAgent]
    code: 200
    input: [expected_product_model_version]
    output: WarrantyClaim
    side_effects: ["claim_status UNDER_REVIEW -> APPROVED; requires storage_review_status IN {GUIDANCE_VERIFIED, WAIVED}", "payout_basis, pre_fee_gross_cents, storage_deduction_cents, admin_fee_cents and net_payout_cents set from calculations.warranty_payout using the model's PRO_RATA_AGE or FLAT_SCHEDULE variant", "ProductModel.warranty_reserve_cents decreases and warranty_paid_cents increases by net_payout_cents, preserving reserve + paid == initial_warranty_reserve_cents", "increments ProductModel.version by 1 and WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/deny"
    description: "Deny a claim under review. A storage violation forces the denial reason."
    roles: [WarrantyAgent]
    code: 200
    input: [denial_reason]
    output: WarrantyClaim
    side_effects: ["claim_status UNDER_REVIEW -> DENIED; requires storage_review_status != NOT_STARTED", "denial_reason forced to STORAGE_GUIDANCE_VIOLATED when the storage axis reads GUIDANCE_VIOLATED, otherwise taken from the request", "all money fields set to 0 and no reserve moves", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/return-to-queue"
    description: "Send a claim back to the submitted queue, which also resets the storage-review axis."
    roles: [WarrantyAgent]
    code: 200
    input: [return_note]
    output: WarrantyClaim
    side_effects: ["claim_status UNDER_REVIEW -> SUBMITTED (the documented backward edge)", "storage_review_status GUIDANCE_VERIFIED, GUIDANCE_VIOLATED or WAIVED -> NOT_STARTED, revoking any waiver", "months_in_service and storage_description cleared to null", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/void"
    description: "Void an approved claim and return its payout to the model's reserve."
    roles: [PlantAdmin]
    code: 200
    input: [void_reason]
    output: WarrantyClaim
    side_effects: ["claim_status APPROVED -> VOIDED with denial_reason APPROVAL_VOIDED", "ProductModel.warranty_reserve_cents increases and warranty_paid_cents decreases by the claim's net_payout_cents, restoring the conserved sum; this is the only path that raises the reserve", "the claim's money fields are retained as the audit record and are NOT zeroed", "increments ProductModel.version by 1 and WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{warranty_claim_id}/withdraw"
    description: "Customer withdraws its own open claim."
    roles: [Customer]
    code: 200
    input: [withdraw_reason]
    output: WarrantyClaim
    side_effects: ["claim_status SUBMITTED or UNDER_REVIEW -> WITHDRAWN", "the acting X-User-ID must equal claim.customer_id", "no money moves", "increments WarrantyClaim.version by 1"]

  # ------------------------------ Logical clock (test-driving) ------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock to an explicit instant. The clock's startup default is exactly 2026-08-01T00:00:00Z and it MUST NOT fall back to real wall-clock time before this endpoint is called. Advancing the clock is what expires resin lots (CASCADE-G) and what ages warranty claims."
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    # projection shape: ClockState
    output:
      current_utc: "string — the logical clock after the call, ISO8601 UTC with a trailing Z"
      default_utc: "string — always 2026-08-01T00:00:00Z, the startup default"
      expired_resin_lot_count: "integer — lots moved to EXPIRED by this call"
      released_resin_charge_count: "integer — charges moved to RELEASED by the expiry cascade"
      aborted_molding_cycle_count: "integer — cycles moved to ABORTED by the expiry cascade"
      blocked_production_order_count: "integer — orders moved to BLOCKED_RESIN by the expiry cascade"
    side_effects: ["CASCADE-G link 2: every ResinLot whose expires_on is strictly before the new clock date -> EXPIRED (a lot expiring exactly on the new date is NOT expired)", "CASCADE-G link 3: RESERVED charges on those lots -> RELEASED with released_reason LOT_EXPIRED, returning charge_kg to available_kg", "CASCADE-G link 4: SCHEDULED cycles holding those charges -> ABORTED with abort_reason LOT_EXPIRED", "CASCADE-G link 5: orders left with no qualified lot -> BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT", "the clock is never rolled backward past any recorded actual timestamp"]
    output_schema:
      current_utc: "string — the logical clock after the call, ISO8601 UTC with a trailing Z"
      default_utc: "string — always 2026-08-01T00:00:00Z, the startup default"
      expired_resin_lot_count: "integer — lots moved to EXPIRED by this call"
      released_resin_charge_count: "integer — charges moved to RELEASED by the expiry cascade"
      aborted_molding_cycle_count: "integer — cycles moved to ABORTED by the expiry cascade"
      blocked_production_order_count: "integer — orders moved to BLOCKED_RESIN by the expiry cascade"
  - method: GET
    path: "/_clock/current_utc"
    description: "Read the logical clock. Before any set_current_utc call this returns exactly 2026-08-01T00:00:00Z."
    roles: [PlantAdmin, ResinTechnician, MoldingOperator, AssemblyTechnician, QualityInspector, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: []
    # projection shape: ClockState
    output:
      current_utc: "string — the logical clock, ISO8601 UTC with a trailing Z"
      default_utc: "string — always 2026-08-01T00:00:00Z"
    side_effects: []
    output_schema:
      current_utc: "string — the logical clock, ISO8601 UTC with a trailing Z"
      default_utc: "string — always 2026-08-01T00:00:00Z"

# =============================================================================
# §1.6 ERROR CODE CATALOG
# Every code below is raised by at least one §1.5 endpoint. Boundary pairs are
# kept distinct on purpose (e.g. ERR_WAREHOUSE_CUBE_EXCEEDED for the site total
# vs ERR_NO_ELIGIBLE_ZONE for the per-zone fit; ERR_OVEN_WINDOW_CONFLICT for
# exclusive arm occupancy vs ERR_COOLING_BAY_CAPACITY_EXCEEDED for aggregate
# slot capacity vs ERR_MOLD_WINDOW_CONFLICT for the tool's own span).
# =============================================================================
errors:
  # ---- authentication / authorization ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent or empty"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles"
  - id: ERR_IDENTITY_NOT_FOUND
    http: 401
    condition: "an entity_backed role's X-User-ID does not resolve to a row of its backing entity"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the endpoint's roles list does not contain X-User-Role"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "the backing Technician's role_code disagrees with the shop-floor role being asserted"
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "a Customer acts on or reads a WarrantyClaim or hull that is not its own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the inspecting technician is the cycle's operator or the hull's outfitter, or an outfitter is a prior inspector of the same hull"
  - id: ERR_TECHNICIAN_SUSPENDED
    http: 403
    condition: "the acting or targeted Technician has status SUSPENDED"
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 403
    condition: "the acting Technician lacks the certification the operation requires"
  - id: ERR_TECHNICIAN_ALREADY_ACTIVE
    http: 409
    condition: "reinstating a Technician that is already ACTIVE"

  # ---- existence ----
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path id or a body foreign key does not resolve and no entity-specific code applies"
  - id: ERR_PRODUCT_MODEL_NOT_FOUND
    http: 404
    condition: "product_model_id does not resolve"
  - id: ERR_MOLD_NOT_FOUND
    http: 404
    condition: "mold_id or replaces_mold_id does not resolve"
  - id: ERR_OVEN_STATION_NOT_FOUND
    http: 404
    condition: "oven_station_id does not resolve"
  - id: ERR_COOLING_BAY_NOT_FOUND
    http: 404
    condition: "cooling_bay_id does not resolve"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "a technician id in a path or body does not resolve"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id does not resolve"
  - id: ERR_WAREHOUSE_NOT_FOUND
    http: 404
    condition: "target_warehouse_id or origin_warehouse_id does not resolve"
  - id: ERR_DEMAND_BUCKET_NOT_FOUND
    http: 404
    condition: "demand_bucket_id does not resolve"
  - id: ERR_RESIN_LOT_NOT_FOUND
    http: 404
    condition: "resin_lot_id does not resolve"
  - id: ERR_PRODUCTION_ORDER_NOT_FOUND
    http: 404
    condition: "production_order_id does not resolve"
  - id: ERR_MOLDING_CYCLE_NOT_FOUND
    http: 404
    condition: "molding_cycle_id does not resolve"
  - id: ERR_FINISHED_UNIT_NOT_FOUND
    http: 404
    condition: "finished_unit_id does not resolve"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment_id does not resolve"

  # ---- schema / range / uniqueness ----
  - id: ERR_VALIDATION
    http: 422
    condition: "a required field is missing, has the wrong JSON type, or a timestamp or date does not parse"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed field holds a value outside its declared set"
  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "a quantity, mass, count or rate field violates its declared numeric bounds"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_start_on is later than window_end_on on a demand bucket"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "a business code that must be unique is reused (including a duplicate zone_code inside one warehouse's zones array)"
  - id: ERR_INSUFFICIENT_MEASUREMENTS
    http: 422
    condition: "wall_thickness_points holds fewer than 6 measurements"
  - id: ERR_DEFORMATION_BELOW_THRESHOLD
    http: 422
    condition: "a HULL_DEFORMATION claim reports less than 3.00 mm of deformation"

  # ---- resource state ----
  - id: ERR_OVEN_STATION_DOWN
    http: 409
    condition: "the oven station is DOWN when a cycle is scheduled or started"
  - id: ERR_OVEN_STATION_ALREADY_OPERATIONAL
    http: 409
    condition: "restoring an oven station that is already OPERATIONAL"
  - id: ERR_COOLING_BAY_DOWN
    http: 409
    condition: "the cooling bay is DOWN when a cycle is scheduled or started"
  - id: ERR_COOLING_BAY_ALREADY_OPERATIONAL
    http: 409
    condition: "restoring a cooling bay that is already OPERATIONAL"
  - id: ERR_MOLD_NOT_AVAILABLE
    http: 409
    condition: "the mould is not in the status the operation requires, or a replaces_mold_id target is not RETIRED"
  - id: ERR_MOLD_HAS_ACTIVE_CYCLES
    http: 409
    condition: "retiring a mould that still has a cycle in SCHEDULED, OVEN_RUNNING or COOLING"
  - id: ERR_RESIN_LOT_NOT_AVAILABLE
    http: 409
    condition: "the resin lot is DEPLETED, QUARANTINED or EXPIRED when a charge is reserved, or a quarantine action does not match the lot's status"
  - id: ERR_CHARGE_NOT_RELEASABLE
    http: 409
    condition: "releasing a ResinCharge that is already CONSUMED or RELEASED"
  - id: ERR_ORDER_NOT_SCHEDULABLE
    http: 409
    condition: "scheduling a cycle against an order that is not READY_TO_SCHEDULE or IN_PRODUCTION"
  - id: ERR_ORDER_ALREADY_TERMINAL
    http: 409
    condition: "cancelling an order that is already COMPLETE or CANCELLED"
  - id: ERR_CYCLE_INVALID_STATE
    http: 409
    condition: "a cycle transition is attempted from a status that does not allow it"
  - id: ERR_UNIT_INVALID_BUILD_STATE
    http: 409
    condition: "a build-axis operation is attempted from a build_status that does not allow it"
  - id: ERR_UNIT_INVALID_LOGISTICS_STATE
    http: 409
    condition: "a logistics-axis operation is attempted from a logistics_status that does not allow it, including releasing storage for a hull that is on a loaded trailer"
  - id: ERR_UNIT_NOT_REINSPECTABLE
    http: 409
    condition: "trimming, outfitting, re-inspecting or scrapping a hull whose logistics_status has left UNALLOCATED"
  - id: ERR_UNIT_NOT_DELIVERED
    http: 409
    condition: "opening or approving a warranty claim on a hull that is not DELIVERED"
  - id: ERR_WAREHOUSE_FROZEN
    http: 409
    condition: "storing into, or releasing an order toward, a site whose posture is FROZEN"
  - id: ERR_WAREHOUSE_POSTURE_RESTRICTED
    http: 409
    condition: "creating a trailer at a RESTRICTED or FROZEN site with a cube capacity larger than the site's remaining cube"
  - id: ERR_SHIPMENT_INVALID_STATE
    http: 409
    condition: "a trailer transition is attempted from a status that does not allow it, including loading a departed trailer"
  - id: ERR_SHIPMENT_LINE_ALREADY_REMOVED
    http: 409
    condition: "removing a ShipmentLine that is already REMOVED"
  - id: ERR_SHIPMENT_EMPTY
    http: 409
    condition: "sealing a trailer with no LOADED line"
  - id: ERR_FREIGHT_QUOTE_MISSING
    http: 409
    condition: "departing a sealed trailer whose quoted_freight_cents is null because it was unsealed and resealed without a quote"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "a claim transition is attempted from a claim_status that does not allow it"
  - id: ERR_STORAGE_REVIEW_INCOMPLETE
    http: 409
    condition: "approving a claim whose storage_review_status is not GUIDANCE_VERIFIED or WAIVED, or denying one that is still NOT_STARTED"
  - id: ERR_STORAGE_REVIEW_ALREADY_DONE
    http: 409
    condition: "running the storage review on a claim whose storage_review_status has already left NOT_STARTED"
  - id: ERR_STORAGE_FINDING_NOT_WAIVABLE
    http: 409
    condition: "waiving a storage finding when storage_review_status is not GUIDANCE_VIOLATED"
  - id: ERR_CUSTOMER_NOT_ACTIVE
    http: 409
    condition: "the customer on the claim is SUSPENDED"
  - id: ERR_CUSTOMER_ALREADY_ACTIVE
    http: 409
    condition: "reinstating a Customer that is already ACTIVE"

  # ---- product safety / process compliance ----
  - id: ERR_REGRIND_LIMIT_EXCEEDED
    http: 422
    condition: "the blended cycle regrind share would exceed ProductModel.max_regrind_pct (strictly greater than rejects)"
  - id: ERR_RESIN_LOT_NOT_QUALIFIED
    http: 422
    condition: "the lot's grade, additive package, colour match or melt index disqualifies it for the hull model"
  - id: ERR_MELT_INDEX_OUT_OF_RANGE
    http: 422
    condition: "the cycle's mass-weighted melt index falls outside the model's inclusive melt-index band at oven start"
  - id: ERR_CHARGE_MASS_OUT_OF_TOLERANCE
    http: 422
    condition: "charged_mass_kg falls outside nominal_charge_kg plus or minus charge_tolerance_pct at oven start"
  - id: ERR_COOLING_TIME_INSUFFICIENT
    http: 422
    condition: "floored actual cooling minutes fall below ProductModel.min_cooling_minutes at demould"
  - id: ERR_COOLING_MODE_MISMATCH
    http: 422
    condition: "the requested cooling_mode differs from the cooling bay's airflow_mode"
  - id: ERR_SIZE_CLASS_NOT_SUPPORTED
    http: 422
    condition: "the selected mould's size class exceeds the oven station's max_size_class"
  - id: ERR_MOLD_SIZE_CLASS_MISMATCH
    http: 422
    condition: "a mould's size_class differs from its hull model's size_class at registration"
  - id: ERR_INVALID_MOLD_REPLACEMENT
    http: 422
    condition: "replaces_mold_id points at the same mould, at a mould of another hull model, or at a mould that is not RETIRED"
  - id: ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED
    http: 422
    condition: "the customer never acknowledged the storage guidance, or acknowledged it after the hull's delivered_at"

  # ---- constraint / temporal ----
  - id: ERR_OVEN_WINDOW_CONFLICT
    http: 409
    condition: "the requested oven window overlaps a SCHEDULED or OVEN_RUNNING cycle on the same station arm once the symmetric changeover buffer is applied"
  - id: ERR_MOLD_WINDOW_CONFLICT
    http: 409
    condition: "every otherwise-eligible mould is already occupied over the requested half-open oven-plus-cooling span"
  - id: ERR_OVEN_START_IN_PAST
    http: 422
    condition: "oven_start_at precedes the logical clock"
  - id: ERR_WAREHOUSE_MISMATCH
    http: 422
    condition: "the loaded hull is stored at a site other than the trailer's origin"
  - id: ERR_BUILD_AHEAD_WINDOW_MISMATCH
    http: 409
    condition: "the logical-clock date falls outside the demand bucket's inclusive window at store time"
  - id: ERR_WARRANTY_TERM_EXPIRED
    http: 422
    condition: "months_in_service exceeds the 60-month warranty term"
  - id: ERR_TRAILER_UNDERUTILIZED
    http: 409
    condition: "cube_utilization_pct is below 60.00 at seal time"

  # ---- capacity / quota / money ----
  - id: ERR_NO_ELIGIBLE_MOLD
    http: 409
    condition: "no mould for the hull model is AVAILABLE and below its service interval — a capability failure, distinct from an occupancy failure"
  - id: ERR_COOLING_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of cycles intersecting the requested closed cooling window has reached the bay's concurrent_slot_capacity"
  - id: ERR_RESIN_INSUFFICIENT
    http: 409
    condition: "ResinLot.available_kg is below the requested charge_kg"
  - id: ERR_NO_ELIGIBLE_ZONE
    http: 409
    condition: "no zone at the target site has room for the hull's footprint after nesting"
  - id: ERR_WAREHOUSE_CUBE_EXCEEDED
    http: 409
    condition: "the site's committed cube after the store would exceed footprint_capacity_cube_m3"
  - id: ERR_BUILD_AHEAD_CAP_EXCEEDED
    http: 409
    condition: "the store would push build_ahead_committed_qty past build_ahead_cap_qty"
  - id: ERR_TRAILER_CUBE_EXCEEDED
    http: 409
    condition: "the new line would push nested_cube_m3 past trailer_cube_capacity_m3"
  - id: ERR_TRAILER_PAYLOAD_EXCEEDED
    http: 409
    condition: "the new line would push loaded_weight_kg past trailer_max_payload_kg"
  - id: ERR_ORDER_OVERBUILD
    http: 409
    condition: "the new cycle would push scheduled plus completed units past ordered_qty times the 1.20 overbuild factor"
  - id: ERR_WARRANTY_RESERVE_EXHAUSTED
    http: 409
    condition: "net_payout_cents exceeds the hull model's remaining warranty_reserve_cents"

  # ---- optimistic concurrency (§1.2.1) ----
  - id: ERR_STALE_PRODUCTION_ORDER_VERSION
    http: 412
    condition: "expected_production_order_version does not match ProductionOrder.version"
  - id: ERR_STALE_RESIN_LOT_VERSION
    http: 412
    condition: "expected_resin_lot_version does not match ResinLot.version"
  - id: ERR_STALE_WAREHOUSE_VERSION
    http: 412
    condition: "expected_warehouse_version does not match Warehouse.version"
  - id: ERR_STALE_SHIPMENT_VERSION
    http: 412
    condition: "expected_shipment_version does not match Shipment.version"
  - id: ERR_STALE_PRODUCT_MODEL_VERSION
    http: 412
    condition: "expected_product_model_version does not match ProductModel.version"

# =============================================================================
# §1.7 RBAC MATRIX — role_model: segregation_of_duties
#
# The four shop-floor roles are all backed by the SAME entity (Technician) and
# are distinguished by Technician.role_code, so asserting MoldingOperator with
# the id of a QUALITY_INSPECTOR technician fails with
# ERR_ROLE_IDENTITY_MISMATCH. The compliance rule the plant enforces is that
# the technician who ran the cycle or outfitted the hull may never be the
# technician who passes it.
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant operations administrator. Owns reference data (hull models, moulds, ovens, bays, technicians, sites), equipment up/down control, mould servicing, the logical clock, and the two administrative overrides (waiving a storage finding, voiding an approved claim)."
    identity: "opaque"
    exclusive_operations:
      - "POST /product-models"
      - "PATCH /product-models/{product_model_id}"
      - "POST /molds"
      - "POST /molds/{mold_id}/service-hold"
      - "POST /molds/{mold_id}/complete-service"
      - "POST /molds/{mold_id}/retire"
      - "POST /oven-stations"
      - "POST /oven-stations/{oven_station_id}/mark-down"
      - "POST /oven-stations/{oven_station_id}/restore"
      - "POST /cooling-bays"
      - "POST /cooling-bays/{cooling_bay_id}/mark-down"
      - "POST /cooling-bays/{cooling_bay_id}/restore"
      - "POST /technicians"
      - "POST /technicians/{technician_id}/suspend"
      - "POST /technicians/{technician_id}/reinstate"
      - "POST /customers/{customer_id}/suspend"
      - "POST /customers/{customer_id}/reinstate"
      - "POST /warranty-claims/{warranty_claim_id}/waive-storage-finding"
      - "POST /warranty-claims/{warranty_claim_id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /molding-cycles/{molding_cycle_id}/abort (with MoldingOperator)"
      - "POST /customers, POST /warehouses, POST /demand-forecast-buckets, POST /production-orders, POST /production-orders/{production_order_id}/release, POST /production-orders/{production_order_id}/cancel (with LogisticsPlanner)"
      - "POST /resin-lots (with ResinTechnician)"
      - "all GET endpoints except the Customer-scoped reads"

  - name: ResinTechnician
    description: "Blends and reserves resin charges. Must hold the RESIN_BLENDING certification; the blended regrind ceiling and the lot qualification rules are enforced on every charge."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /resin-charges"
      - "POST /resin-charges/{resin_charge_id}/release"
    shared_operations:
      - "POST /resin-lots (with PlantAdmin)"
      - "GET /resin-lots, GET /resin-lots/{resin_lot_id}, GET /resin-charges, GET /resin-charges/{resin_charge_id}, GET /molding-cycles, GET /molding-cycles/{molding_cycle_id}, GET /production-orders, GET /product-models, GET /_clock/current_utc"

  - name: MoldingOperator
    description: "Schedules and runs oven and cooling cycles. Becomes the cycle's operator_technician_id, which permanently bars this technician from inspecting the hulls that cycle produces."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /molding-cycles"
      - "POST /molding-cycles/{molding_cycle_id}/start-oven"
      - "POST /molding-cycles/{molding_cycle_id}/enter-cooling"
      - "POST /molding-cycles/{molding_cycle_id}/demold"
    shared_operations:
      - "POST /molding-cycles/{molding_cycle_id}/abort (with PlantAdmin)"
      - "GET /molds, GET /molds/{mold_id}, GET /oven-stations, GET /cooling-bays, GET /resin-lots, GET /resin-charges, GET /production-orders, GET /demand-forecast-buckets, GET /product-models, GET /technicians, GET /_clock/current_utc"

  - name: AssemblyTechnician
    description: "Trims hulls and installs hardware and outfitting on fixtures. Must hold FIXTURE_ASSEMBLY to outfit. Becomes the hull's outfitted_by_technician_id, which bars this technician from inspecting that hull."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /finished-units/{finished_unit_id}/trim"
      - "POST /finished-units/{finished_unit_id}/outfit"
    shared_operations:
      - "GET /finished-units, GET /finished-units/{finished_unit_id}, GET /product-models, GET /technicians, GET /_clock/current_utc"

  - name: QualityInspector
    description: "Inspects hulls for wall thickness, impact resistance and cosmetic defects, scraps rejects, and quarantines resin lots. Must hold both WALL_GAUGE and IMPACT_RIG, and must be neither the cycle's operator nor the hull's outfitter."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /finished-units/{finished_unit_id}/inspect"
      - "POST /finished-units/{finished_unit_id}/scrap"
      - "POST /resin-lots/{resin_lot_id}/quarantine"
      - "POST /resin-lots/{resin_lot_id}/release-quarantine"
    shared_operations:
      - "GET /finished-units, GET /finished-units/{finished_unit_id}, GET /molding-cycles, GET /molding-cycles/{molding_cycle_id}, GET /resin-lots, GET /resin-charges, GET /molds, GET /warehouses, GET /product-models, GET /production-orders, GET /_clock/current_utc"

  - name: LogisticsPlanner
    description: "Owns finished-goods storage, seasonal build-ahead admission, trailer loading, nesting, sealing, dispatch and delivery."
    identity: "opaque"
    exclusive_operations:
      - "POST /finished-units/{finished_unit_id}/store"
      - "POST /finished-units/{finished_unit_id}/release-storage"
      - "POST /shipments"
      - "POST /shipments/{shipment_id}/seal"
      - "POST /shipments/{shipment_id}/unseal"
      - "POST /shipments/{shipment_id}/depart"
      - "POST /shipments/{shipment_id}/deliver"
      - "POST /shipments/{shipment_id}/cancel"
      - "POST /shipment-lines"
      - "POST /shipment-lines/{shipment_line_id}/remove"
      - "GET /shipments/{shipment_id}/freight-summary"
    shared_operations:
      - "POST /customers, POST /warehouses, POST /demand-forecast-buckets, POST /production-orders, POST /production-orders/{production_order_id}/release, POST /production-orders/{production_order_id}/cancel (with PlantAdmin)"
      - "POST /customers/{customer_id}/acknowledge-storage-guidance (with PlantAdmin and Customer)"
      - "GET /warehouses/{warehouse_id}/footprint-summary, GET /production-orders/{production_order_id}/cost-summary (with PlantAdmin)"
      - "all other GET endpoints except the Customer-scoped reads"

  - name: WarrantyAgent
    description: "Handles hull-deformation and outfitting warranty claims: intake, review, the independent storage-guidance review, approval against the model's reserve, and denial. Cannot waive its own storage finding and cannot void an approval."
    identity: "opaque"
    exclusive_operations:
      - "POST /warranty-claims/{warranty_claim_id}/start-review"
      - "POST /warranty-claims/{warranty_claim_id}/storage-review"
      - "POST /warranty-claims/{warranty_claim_id}/approve"
      - "POST /warranty-claims/{warranty_claim_id}/deny"
      - "POST /warranty-claims/{warranty_claim_id}/return-to-queue"
    shared_operations:
      - "POST /warranty-claims (with Customer)"
      - "GET /warranty-claims, GET /warranty-claims/{warranty_claim_id}, GET /finished-units, GET /finished-units/{finished_unit_id}, GET /shipments, GET /shipment-lines, GET /customers, GET /product-models, GET /_clock/current_utc"

  - name: Customer
    description: "Boat dealer or end owner. X-User-ID is a Customer id, so every read and write is scoped to rows whose customer_id equals it. Acknowledges storage guidance and may withdraw its own claim, but never prices or decides one."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /warranty-claims/{warranty_claim_id}/withdraw"
    shared_operations:
      - "POST /warranty-claims (with WarrantyAgent, restricted to its own customer_id)"
      - "POST /customers/{customer_id}/acknowledge-storage-guidance (with PlantAdmin and LogisticsPlanner, restricted to itself)"
      - "GET /customers/{customer_id}, GET /warranty-claims, GET /warranty-claims/{warranty_claim_id}, GET /finished-units/{finished_unit_id}, GET /shipments/{shipment_id} — all scoped to its own rows"
