            - call: "POST /processing-runs/${run_id}/allocations"
              payload: { lot_id: "${lot_b_id}", mass_mt: 200.000, expected_run_version: "${rv2}" }
              as: FeedstockTrader
          assert:
            - "First trigger call: response.status == 412 and response.error_id == ERR_STALE_RUN_VERSION"
            - "After the refusal ProcessingRun.${run_id}.reserved_mass_mt == 200.000 and blend_ci_gco2e_per_mj == 32.50 and version == ${rv2}"
            - "FeedstockLot.${lot_b_id}.remaining_mass_mt == 200.000 after the refusal (no partial write)"
            - "Third trigger call: response.status == 201 with reserved_mass_mt 400.000 and blend_ci_gco2e_per_mj 28.70"
            - "GET /processing-runs/${run_id}/allocations returns total_count == 2, both RESERVED"

      - name: lot_version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quality-test-stale-lot]
          - entities[FeedstockLot].common_fields
          - endpoints["GET /feedstock-lots/{id}"]
        distinguishing_aspect: "The OCC token advances on every mutating child write on the lot - the quality test and the acceptance each add exactly one - while any number of interleaved GETs leave it untouched."
        test_recipe:
          setup:
            - "One freshly booked 500.000 MT UCO lot."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 500.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
          trigger:
            - call: "GET /feedstock-lots/${lot_id}"
              payload: {}
              as: QualityAnalyst
              captures: { read_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${read_v0}" }
              as: QualityAnalyst
            - call: "GET /feedstock-lots/${lot_id}"
              payload: {}
              as: QualityAnalyst
              captures: { read_v1: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/acceptances"
              payload: {}
              as: QualityAnalyst
            - call: "GET /feedstock-lots/${lot_id}"
              payload: {}
              as: QualityAnalyst
              captures: { read_v2: $.data.version }
          assert:
            - "${read_v0} == ${lot_v0} (the two GETs around no write report the same version)"
            - "${read_v1} == ${lot_v0} + 1 after the quality test"
            - "${read_v2} == ${lot_v0} + 2 after the acceptance"
            - "FeedstockLot.${lot_id}.status == ACCEPTED with created_at unchanged and updated_at advanced"
            - "A quality test replaying expected_lot_version ${read_v1} after the acceptance returns 412 ERR_STALE_LOT_VERSION"

      - name: yield_variance_beyond_tolerance_derates_the_charge
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines[CatalystCharge.status].transitions[ACTIVE -> DERATED]
          - calculations[run_yield_split].constants.YIELD_VARIANCE_TOLERANCE_PCT
