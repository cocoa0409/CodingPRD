          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "GAS provider with deposit_policy FLAT, flat_deposit_cents 9900, credit_check_required true, scheduling_lead_days 3, covering 30302."
            - "Move for 2026-08-20 verified, UTILITY_SETUP consent GRANTED, mapped to GAS (deposit_estimate_cents 14850 = 9900 * 1.50 * 1.00)."
            - "The order is scheduled for 2026-08-20T09:00:00Z..13:00:00Z FIRST, so readiness is 70 (identity 100, utility 1 of 1 scheduled, filing 0, consent 50) when the credit check freezes readiness_snapshot."
            - "Bureau answers 639, which is the SCORE_MULT_HIGH band, so deposit_amount_cents = round_half_up(9900 * 1.00 * 1.00) = 9900."
            - "Clock advanced to 2026-08-20T09:00:00Z so ERR_ACTIVATION_TOO_EARLY is not in play."
