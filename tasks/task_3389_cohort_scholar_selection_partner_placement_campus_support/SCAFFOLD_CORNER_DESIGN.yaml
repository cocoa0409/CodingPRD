        distinguishing_aspect: "The window is inclusive at both ends: a nomination at exactly nomination_window_closes_at succeeds, and one second past it fails with ERR_NOMINATION_WINDOW_CLOSED (with quota headroom, so only the temporal rule can fire)."
        test_recipe:
          setup: ["Partner quota 5 (ample); clock moved to the exact window close instant"]
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
