      - name: programming_and_tour_readiness_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EVENT_NOT_PROGRAMMABLE]
          - errors[ERR_NO_ELIGIBLE_SOLOIST]
          - errors[ERR_TOUR_REQUIREMENTS_UNMET]
          - validations[priority 25]
          - validations[priority 55]
          - validations[priority 84]
          - calculations.tour_readiness
        distinguishing_aspect: |
          A rehearsal is never programmable, so /programming on it is 409
          ERR_EVENT_NOT_PROGRAMMABLE regardless of who is seated. On the concert, the only
          seated violinist's participation is still UNREVIEWED, so the AUTO_SELECT pool is
          empty and the answer is 422 ERR_NO_ELIGIBLE_SOLOIST - an empty pool is an error,
          not a silent null soloist. The tour endpoint then produces the SAME id from three
          independent clauses of priority 84 in turn: a 30000 fundraising shortfall, an
          unconfirmed chaperone on an event that requires one, and a participation that is
          not ELIGIBLE - and each refusal persists nothing, which is why the final call that
          satisfies all three at once is the first to reach tour_status READY.
        test_recipe:
          setup:
            - "Season in IN_SEASON; Ada Strings holds the only ACTIVE seat in the Philharmonic"
            - "VIOLIN section and her standing_status is CLEAR."
            - "Three events on that ensemble: a REHEARSAL 2026-10-05 18:00-20:00; a CONCERT"
            - "2026-11-15 with eligibility_window_start 2026-10-01 and the default"
            - "soloist_selection_mode AUTO_SELECT; and a TOUR_PERFORMANCE 2026-11-20 with the"
            - "same window, tour_cost_share_cents 50000 and chaperone_required true."
            - "Ada is rostered on all three; every participation is NOT_RECORDED / UNREVIEWED,"
            - "the tour row is tour_status PENDING with fundraising_credited_cents 0."
            - "The clock reads 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1, sibling_enrolled: false, alumni_engagement_opt_in: false }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 1", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_1: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 2", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_2: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 3", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
