# =============================================================================
# Task 0653 — Epoxy & Garage-Floor Coating
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8 Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived assert values were computed by executing the §1.3 formulas as code.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_estimate_vs_final_grand_total_diverge
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.variant
          - entities.Quote.fields.grand_total_cents
          - state_machines.InstallJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Same formula on the Quote domain produces a different grand_total_cents for the ESTIMATE variant (sqft=600 from Assessment) vs the FINAL variant (sqft=700 captured on-site at install completion): 827507 vs 969797."
        test_recipe:
          setup:
            - "PlatformAdmin created METALLIC coating system (sku=METALLIC) + a color under it + a metallic-certified crew with max_sqft_per_day=1000."
            - "Project for a customer with an APPROVED HEAVY-tier assessment (measured_sqft=600, crack_linear_ft=30); ESTIMATE quote sent, accepted, install booked, started, then completed with on-site as_measured_sqft=700, as_measured_crack_ft=40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating-systems"
              payload: { name: "Metallic Lava", family: "METALLIC", sku: "METALLIC" }
              as: PlatformAdmin
              captures: { sys_met: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_met}", name: "Copper Lava", flake_blend_code: "ML-CU" }
              as: PlatformAdmin
              captures: { color_met: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Metal A", metallic_certified: true, max_sqft_per_day: 1000 }
              as: PlatformAdmin
              captures: { crew_a: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Owner", email: "dana@x.com" }
              as: SalesRep
              captures: { cust_d: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_d}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 100, crack_density: 50, crack_linear_ft: 30, spalling: false, moisture_pct: 0 }
              as: SalesRep
              captures: { assess: $.data.id }
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_met}", color_option_id: "${color_met}", install_season: "PEAK" }
              as: SalesRep
              captures: { q1: $.data.id, q1_grand: $.data.grand_total_cents }
            - call: "POST /quotes/${q1}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj}"
              payload: {}
              as: SalesRep
              captures: { pv1: $.data.version }
            - call: "POST /quotes/${q1}/accept"
              payload: { expected_project_version: "${pv1}" }
              as: Customer
              as_user_id: "${cust_d}"
            - call: "POST /projects/${proj}/install-jobs"
              payload: { crew_id: "${crew_a}", install_date: "2026-05-10T09:00:00Z" }
              as: Scheduler
              captures: { job: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${job}/start"
              payload: {}
              as: Crew
              as_user_id: "${crew_a}"
          trigger:
            - call: "POST /install-jobs/${job}/complete"
              payload: { as_measured_sqft: 700, as_measured_crack_ft: 40 }
              as: Crew
              as_user_id: "${crew_a}"
            - call: "GET /projects/${proj}/quotes"
              payload: { variant: "FINAL" }
              as: SalesRep
              captures: { final_grand: "$.data[0].grand_total_cents" }
          assert:
            - "Quote(q1).grand_total_cents == 827507 (ESTIMATE variant, sqft 600)"
            - "final_grand == 969797 (FINAL variant, on-site sqft 700)"
            - "final_grand != Quote(q1).grand_total_cents"

      - name: warranty_peel_vs_hot_tire_payout_diverge
        grounds:
          - calculations.warranty_proration
          - entities.WarrantyClaim.fields.defect_type
          - entities.WarrantyClaim.fields.prorated_credit_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: "On the WarrantyClaim domain (a different entity than Quote), identical covered_install_price_cents=827507 and months_elapsed=60 yield 551671 for a PEEL claim (factor 1.00) but exactly half, 275836, for a HOT_TIRE claim (factor 0.50)."
        test_recipe:
          setup:
            - "Two fully completed-and-cured METALLIC projects for the SAME customer with covered_install_price_cents=827507 each (estimate==final, sqft 600, HEAVY, PEAK)."
            - "Coverage started 2026-05-14T17:00:00Z; clock advanced 60 months to 2031-05-14T17:00:00Z; one PEEL claim and one HOT_TIRE claim each approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating-systems"
              payload: { name: "Metallic Lava", family: "METALLIC", sku: "METALLIC" }
              as: PlatformAdmin
              captures: { sys_met: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_met}", name: "Copper Lava", flake_blend_code: "ML-CU" }
              as: PlatformAdmin
              captures: { color_met: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Metal A", metallic_certified: true, max_sqft_per_day: 1000 }
              as: PlatformAdmin
              captures: { crew_a: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Metal B", metallic_certified: true, max_sqft_per_day: 1000 }
              as: PlatformAdmin
              captures: { crew_b: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Owner", email: "dana@x.com" }
              as: SalesRep
              captures: { cust_d: $.data.id }
            # ----- project P (PEEL) -----
            - call: "POST /projects"
              payload: { customer_id: "${cust_d}", site_zip: "94016" }
              as: SalesRep
              captures: { projP: $.data.id }
            - call: "POST /projects/${projP}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 100, crack_density: 50, crack_linear_ft: 30, spalling: false, moisture_pct: 0 }
              as: SalesRep
              captures: { assessP: $.data.id }
            - call: "POST /projects/${projP}/quotes"
              payload: { assessment_id: "${assessP}", coating_system_id: "${sys_met}", color_option_id: "${color_met}", install_season: "PEAK" }
              as: SalesRep
              captures: { qP: $.data.id }
            - call: "POST /quotes/${qP}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${projP}"
              payload: {}
              as: SalesRep
              captures: { pvP: $.data.version }
            - call: "POST /quotes/${qP}/accept"
              payload: { expected_project_version: "${pvP}" }
              as: Customer
              as_user_id: "${cust_d}"
            - call: "POST /projects/${projP}/install-jobs"
              payload: { crew_id: "${crew_a}", install_date: "2026-05-10T09:00:00Z" }
              as: Scheduler
              captures: { jobP: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${jobP}/start"
              payload: {}
              as: Crew
              as_user_id: "${crew_a}"
            - call: "POST /install-jobs/${jobP}/complete"
              payload: { as_measured_sqft: 600, as_measured_crack_ft: 30 }
              as: Crew
              as_user_id: "${crew_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-14T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${jobP}/mark-cured"
              payload: {}
              as: Scheduler
            - call: "GET /projects/${projP}/warranties"
              payload: {}
              as: WarrantyAgent
              captures: { warP: "$.data[0].id" }
            # ----- project H (HOT_TIRE) on crew_b, install 2026-05-20 to avoid cure-window overlap with P -----
            - call: "POST /projects"
              payload: { customer_id: "${cust_d}", site_zip: "94016" }
              as: SalesRep
              captures: { projH: $.data.id }
            - call: "POST /projects/${projH}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 100, crack_density: 50, crack_linear_ft: 30, spalling: false, moisture_pct: 0 }
              as: SalesRep
              captures: { assessH: $.data.id }
            - call: "POST /projects/${projH}/quotes"
              payload: { assessment_id: "${assessH}", coating_system_id: "${sys_met}", color_option_id: "${color_met}", install_season: "PEAK" }
              as: SalesRep
              captures: { qH: $.data.id }
            - call: "POST /quotes/${qH}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${projH}"
              payload: {}
              as: SalesRep
              captures: { pvH: $.data.version }
            - call: "POST /quotes/${qH}/accept"
              payload: { expected_project_version: "${pvH}" }
              as: Customer
              as_user_id: "${cust_d}"
            - call: "POST /projects/${projH}/install-jobs"
              payload: { crew_id: "${crew_b}", install_date: "2026-05-20T09:00:00Z" }
              as: Scheduler
              captures: { jobH: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${jobH}/start"
              payload: {}
              as: Crew
              as_user_id: "${crew_b}"
            - call: "POST /install-jobs/${jobH}/complete"
              payload: { as_measured_sqft: 600, as_measured_crack_ft: 30 }
              as: Crew
              as_user_id: "${crew_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-24T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /install-jobs/${jobH}/mark-cured"
              payload: {}
              as: Scheduler
            - call: "GET /projects/${projH}/warranties"
              payload: {}
              as: WarrantyAgent
              captures: { warH: "$.data[0].id" }
            # advance clock 60 months past projP coverage_start (2026-05-14 -> 2031-05-14)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-05-14T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranties/${warP}/claims"
              payload: { defect_type: "PEEL" }
              as: Customer
              as_user_id: "${cust_d}"
              captures: { claimP: $.data.id }
            - call: "POST /warranties/${warH}/claims"
              payload: { defect_type: "HOT_TIRE" }
              as: Customer
              as_user_id: "${cust_d}"
              captures: { claimH: $.data.id }
          trigger:
            - call: "POST /claims/${claimP}/review"
              payload: { action: "APPROVE" }
              as: WarrantyAgent
              captures: { peel_credit: $.data.prorated_credit_cents }
            - call: "POST /claims/${claimH}/review"
              payload: { action: "APPROVE" }
              as: WarrantyAgent
              captures: { hot_credit: $.data.prorated_credit_cents }
          assert:
            - "peel_credit == 551671 (PEEL factor 1.00, months_elapsed 60)"
            - "hot_credit == 275836 (HOT_TIRE factor 0.50, months_elapsed 60)"
            - "hot_credit < peel_credit (HOT_TIRE pays exactly half of PEEL for identical inputs)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_metallic_mult_and_volume_tier_nonlinear
        grounds:
          - calculations.quote_pricing
          - entities.CoatingSystem.fields.family
          - entities.Quote.fields.system_material_cents
          - entities.Quote.fields.volume_discount_pct_bps
        distinguishing_aspect: "MODE (a): grand_total_cents is a non-linear function of >=3 inputs — METALLIC multiplier on material (1.20), tiered seasonal multiplier on labor (PEAK 1.15), and a volume-discount tier selected by the system+prep subtotal (>=600000 -> 10%); the branches interact to yield 827507."
        test_recipe:
          setup:
            - "METALLIC system, HEAVY assessment (sqft 600, crack 30), PEAK season ESTIMATE quote."
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Metallic Lava", family: "METALLIC", sku: "METALLIC" }
              as: PlatformAdmin
              captures: { sys_met: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_met}", name: "Copper Lava", flake_blend_code: "ML-CU" }
              as: PlatformAdmin
              captures: { color_met: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Owner", email: "dana@x.com" }
              as: SalesRep
              captures: { cust_d: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_d}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 100, crack_density: 50, crack_linear_ft: 30, spalling: false, moisture_pct: 0 }
              as: SalesRep
              captures: { assess: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_met}", color_option_id: "${color_met}", install_season: "PEAK" }
              as: SalesRep
              captures: { q: $.data.id, grand: $.data.grand_total_cents, sysm: $.data.system_material_cents, vbps: $.data.volume_discount_pct_bps }
          assert:
            - "sysm == 576000 (800*600 material * 1.20 metallic mult)"
            - "vbps == 1000 (pre_discount 891675 >= 600000 -> 10%)"
            - "grand == 827507"

      - name: quote_eval_order_discount_before_mobilization_pinned
        grounds:
          - calculations.quote_pricing
          - entities.Quote.fields.discount_cents
          - entities.Quote.fields.mobilization_cents
          - entities.Quote.fields.grand_total_cents
        distinguishing_aspect: "MODE (c): pinned evaluation order — the volume discount is keyed on (system_material+prep_labor) and applied BEFORE the flat mobilization fee is added; mobilization is never discounted. For sqft 600 FLAKE_STANDARD MODERATE crack 15 STANDARD: discount 18975 on 379500, then +25000 mobilization = grand 385525, NOT (379500+25000)*0.95."
        test_recipe:
          setup:
            - "FLAKE_STANDARD system, MODERATE assessment (sqft 600, crack 15), STANDARD season ESTIMATE quote (pre_discount 379500 -> 5% tier)."
          setup_api_calls:
            - call: "POST /coating-systems"
              payload: { name: "Flake Std", family: "FLAKE", sku: "FLAKE_STANDARD" }
              as: PlatformAdmin
              captures: { sys_fs: $.data.id }
            - call: "POST /color-options"
              payload: { coating_system_id: "${sys_fs}", name: "Slate Flake", flake_blend_code: "FS-SL" }
              as: PlatformAdmin
              captures: { color_fs: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Owner", email: "dana@x.com" }
              as: SalesRep
              captures: { cust_d: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_d}", site_zip: "94016" }
              as: SalesRep
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/assessments"
              payload: { measured_sqft: 600, oil_stain_pct: 50, crack_density: 20, crack_linear_ft: 15, spalling: true, moisture_pct: 30 }
              as: SalesRep
              captures: { assess: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quotes"
              payload: { assessment_id: "${assess}", coating_system_id: "${sys_fs}", color_option_id: "${color_fs}", install_season: "STANDARD" }
              as: SalesRep
              captures: { q: $.data.id, grand: $.data.grand_total_cents, disc: $.data.discount_cents, mob: $.data.mobilization_cents }
          assert:
            - "disc == 18975 (5% of 379500)"
            - "mob == 25000"
            - "grand == 385525 (379500 - 18975 + 25000); mobilization excluded from the discount base"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: warranty_claim_cyclic_revision_loop
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_NEEDS_INFO
          - state_machines.WarrantyClaim.NEEDS_INFO_to_SUBMITTED
          - entities.WarrantyClaim.fields.revision_rounds
        distinguishing_aspect: "CYCLE on the WarrantyClaim entity: SUBMITTED -> NEEDS_INFO -> SUBMITTED can loop; revision_rounds increments by 1 each resubmit, reaching 2 after two full loops, then APPROVE still works."
        test_recipe:
          setup:
            - "A cured FLAKE project warranty (covered 385525) with a SUBMITTED PEEL claim filed at coverage start (months_elapsed 0)."
