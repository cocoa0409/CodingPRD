              payload: { item_upc: "00000000000201", item_description: "Milk 1gal", category_code: "DAIRY", old_retail_cents: 449, new_retail_cents: 399, net_content_qty: 1, net_content_uom: "GAL" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000000202", item_description: "Yogurt 6ct", category_code: "DAIRY", old_retail_cents: 599, new_retail_cents: 549, net_content_qty: 6, net_content_uom: "CT" }
