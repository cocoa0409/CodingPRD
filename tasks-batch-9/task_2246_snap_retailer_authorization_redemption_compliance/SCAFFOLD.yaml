# =============================================================================
# SNAP Retailer Authorization & Redemption Compliance — seed tables (§1.0–§1.7)
# Task: task_2246_snap_retailer_authorization_redemption_compliance
# =============================================================================

scenario: |
  2246. SNAP Retailer Authorization & Redemption Compliance (USDA FNS retailer program): application with ownership, staple-food stock and eligibility criteria assessment, store visit verification and depth-of-stock rules, point-of-sale eligible/ineligible item flagging and split tender, redemption pattern monitoring for anomalies against store size and sales, trafficking investigation, charge letter and administrative review, permanent disqualification and civil money penalty in lieu of disqualification, reauthorization after ownership change, equipment and EBT-only terminal provisioning

domain_name: snap-retailer-authorization-redemption-compliance

# Flat/graph topology: there is no single nesting root. Owner, Store, Application,
# StoreVisit, Investigation, SanctionCase, RedemptionPeriod, EbtTerminal and
# TerminalDeployment are all peer top-level collections wired by foreign keys, so
# the API prefix is empty and every collection sits directly under "/".
api_prefix: ""

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation      # desk vs on-site staple criterion; trailing vs peak CMP basis
    - rate_threshold_triggers       # anomaly flag bands, depth-of-stock floors, CMP statutory cap
    - cascading_side_effects        # enforcement and flag escalation propagate 4 hops
    - derived_field_reconciliation  # EBT settlement import vs POS-derived redemption totals
    - optimistic_concurrency        # OCC on Store.version and SanctionCase.version

  entity_topology: graph
  # Peer collections joined by FKs, one junction entity (TerminalDeployment joins
  # Store x EbtTerminal), one self-referential FK on Store (predecessor_store_id
  # for ownership-change succession) and one on SanctionCase (predecessor_case_id
  # for the repeat-violation chain). No URL nesting except two sub-resources on
  # SanctionCase (cmp-elections, penalty-ledger).

  state_machine_shape: parallel
  # Store carries TWO independent state dimensions on the same row
  # (authorization_status x sanction_status). Application is cyclic
  # (UNDER_REVIEW/PENDING_VISIT -> PENDING_DOCUMENTS -> SUBMITTED -> PENDING_VISIT).
  # SanctionCase is branching with a remand cycle
  # (ADMIN_REVIEW_DECIDED -> REMANDED -> DETERMINED).

  relationship_patterns:
    - one_to_many        # Owner -> Store, Store -> Application/RedemptionPeriod/...
    - many_to_many       # TerminalDeployment junctions Store x EbtTerminal over time
    - self_referential   # Store.predecessor_store_id, SanctionCase.predecessor_case_id
    - cross_aggregate    # Application decision reads the predecessor Store's SanctionCase

  role_model: segregation_of_duties
  # The FNS user id that issued the charge letter or the determination may not
  # decide the administrative review; the inspector who verified a store
  # pre-authorization may not perform its REVERIFICATION visit.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities / 74 endpoints / 57 error codes / 17 calculation rules (2 dual-variant)
  # / 11 state-machine dimensions across 10 entities / 2 OCC rules / 21 ordered
  # validation priorities / 7 roles.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the applicant firm owner or ownership entity" }
      - { name: ownership_type, type: enum, source: input, description: "SOLE_PROPRIETOR | PARTNERSHIP | CORPORATION | LLC", constraints: "one of the four listed values" }
      - { name: tax_id_last4, type: string, source: input, description: "Last four characters of the EIN/SSN on file", constraints: "exactly 4 characters" }
      - { name: permanent_disqualification_count, type: integer, source: computed, default: 0, description: "Count of SanctionCase rows for stores owned by this Owner whose status IN {SANCTION_FINAL, ENFORCED} and sanction_type == PERMANENT_DISQUALIFICATION" }
      - { name: cmp_outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of PenaltyLedgerEntry.amount_cents over every SanctionCase attached to a Store whose owner_id == this Owner.id" }
      - { name: sanction_flag, type: enum, source: computed, description: "CLEAR | HAS_ACTIVE_CMP_DEBT | PERMANENTLY_DISQUALIFIED — see calculations.owner_sanction_rollup" }
      - { name: status, type: enum, source: computed, default: "ACTIVE", description: "ACTIVE | BARRED — BARRED once permanent_disqualification_count >= 2" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the firm owner that controls this retail location" }
      - { name: predecessor_store_id, type: string, source: input, description: "FK -> Store.id; set only on an ownership-change successor record, else null", default: null }
      - { name: store_name, type: string, source: input, description: "Trade name of the retail location" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the store location", constraints: "exactly 2 uppercase letters" }
      - { name: store_type, type: enum, source: input, description: "SUPERMARKET | GROCERY | CONVENIENCE | SPECIALTY | FARMERS_MARKET | MEAL_SERVICE" }
      - { name: checkout_lane_count, type: integer, source: input, description: "Staffed checkout lanes; drives the redemption size expectation", constraints: ">= 0" }
      - { name: staple_shelf_linear_feet, type: integer, source: input, description: "Self-reported linear feet of staple-food shelving", constraints: ">= 0" }
      - { name: annual_gross_sales_cents, type: integer, source: input, description: "Self-reported total annual retail sales in cents", constraints: "> 0" }
      - { name: annual_staple_sales_cents, type: integer, source: input, description: "Self-reported annual staple-food sales in cents", constraints: ">= 0 and <= annual_gross_sales_cents" }
      - { name: staple_sales_bps, type: integer, source: computed, description: "floor(annual_staple_sales_cents * 10000 / annual_gross_sales_cents) — basis points of staple share" }
      - { name: criterion_b_pass, type: boolean, source: computed, description: "true iff staple_sales_bps > 5000 (strictly more than 50.00% of sales are staple foods)" }
      - { name: max_terminal_slots, type: integer, source: input, description: "Maximum EBT terminals whose deployment intervals may overlap at this location", constraints: ">= 1" }
      - { name: tax_rate_bps, type: integer, source: input, default: 0, description: "State/local sales tax in basis points, applied only to the ineligible subtotal", constraints: ">= 0 and <= 2000" }
      - { name: hardship_designated, type: boolean, source: input, default: false, description: "true when FNS has designated this store the sole authorized retailer selling a substantial variety of staple foods in the area; gates CMP in lieu of disqualification" }
      - { name: fns_number, type: string, source: system, default: null, description: "Server-minted authorization number, format 'FNS-' + 7-digit sequence starting at 1000001, allocated in application-approval order; null until first approval" }
      - { name: authorization_status, type: enum, source: system, default: "NOT_AUTHORIZED", description: "NOT_AUTHORIZED | AUTHORIZED | SUSPENDED | DISQUALIFIED | WITHDRAWN — dimension 1 of the parallel state machine" }
      - { name: sanction_status, type: enum, source: system, default: "NONE", description: "NONE | UNDER_INVESTIGATION | CHARGED | UNDER_ADMIN_REVIEW | SANCTION_FINAL | SANCTION_REVERSED — dimension 2 of the parallel state machine" }
      - { name: authorized_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the first APPROVED application decision" }
      - { name: disqualified_until, type: datetime, source: system, default: null, description: "End of a temporary disqualification; null both before enforcement and for permanent disqualification" }
      - { name: permanently_disqualified, type: boolean, source: system, default: false, description: "Set true when a PERMANENT_DISQUALIFICATION sanction is enforced against this store" }
      - { name: redemption_flag_level, type: enum, source: computed, default: "FLAG_L0", description: "FLAG_L0 | FLAG_L1 | FLAG_L2 | FLAG_L3 — flag_level of the CLOSED RedemptionPeriod with the highest period_index for this store (tie-break: latest created_at); FLAG_L0 when none is closed" }
      - { name: active_terminal_count, type: integer, source: computed, default: 0, description: "Count of TerminalDeployment rows for this store with status == ACTIVE" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the location this application seeks to authorize" }
      - { name: application_type, type: enum, source: input, description: "INITIAL | REAUTHORIZATION_OWNERSHIP_CHANGE | RENEWAL" }
      - { name: claimed_criterion, type: enum, source: input, description: "CRITERION_A | CRITERION_B — the eligibility route the applicant claims" }
      - { name: reported_inventory_lines, type: array, source: input, description: "Self-reported staple stock; each element { category: BREAD_CEREAL|DAIRY|FRUIT_VEG|MEAT_POULTRY_FISH, variety_key: string, unit_count: integer, is_perishable: boolean }" }
      - { name: reported_staple_sales_pct, type: number, source: input, default: null, description: "Applicant-stated staple share of sales as a percentage; informational only — Criterion B is decided from Store.staple_sales_bps" }
      - { name: desk_qualifying_categories, type: integer, source: computed, description: "Staple categories that qualify under the DESK_VARIETY_FIRST variant of calculations.staple_criterion_a_qualification" }
      - { name: desk_perishable_categories, type: integer, source: computed, description: "Qualifying categories that also carry a perishable variety under the DESK_VARIETY_FIRST variant" }
      - { name: desk_criterion_pass, type: boolean, source: computed, description: "true iff desk_qualifying_categories == 4 and desk_perishable_categories >= 2" }
      - { name: verified_criterion_pass, type: boolean, source: computed, default: null, description: "Mirror of the latest FINDINGS_SUBMITTED StoreVisit.verified_criterion_a_pass for this application; null until findings exist" }
      - { name: deficiency_cycle_count, type: integer, source: system, default: 0, description: "Number of times this application has been returned to PENDING_DOCUMENTS by a failed or no-access visit" }
      - { name: hold_reason_code, type: enum, source: system, default: null, description: "STAPLE_STOCK_INSUFFICIENT | DEPTH_OF_STOCK_INSUFFICIENT | SHELF_DISCREPANCY | NO_ACCESS | INVESTIGATION_HOLD — why the application sits in PENDING_DOCUMENTS" }
      - { name: decision_reason_code, type: enum, source: system, default: null, description: "APPROVED_CRITERION_A | APPROVED_CRITERION_B | STAPLE_STOCK_INSUFFICIENT | DEFICIENCY_CYCLES_EXHAUSTED | OWNER_PERMANENTLY_DISQUALIFIED | TRANSFER_CMP_OUTSTANDING | WITHDRAWN_BY_APPLICANT" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent submit" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the APPROVED/DENIED decision" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | PENDING_VISIT | PENDING_DOCUMENTS | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Name of the FNS field inspector" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code the inspector covers", constraints: "exactly 2 uppercase letters" }
      - { name: max_daily_minutes, type: integer, source: input, description: "Ceiling on committed visit minutes whose window_start falls on any one UTC calendar day", constraints: ">= 60" }
      - { name: committed_minutes, type: integer, source: computed, default: 0, description: "Sum of floor((window_end - window_start)/60s) over StoreVisit rows for this inspector with status IN {SCHEDULED, IN_PROGRESS}" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | INACTIVE — INACTIVE inspectors may not start visits" }

  - name: StoreVisit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this visit verifies" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; the assigned field inspector" }
      - { name: visit_type, type: enum, source: input, description: "PRE_AUTHORIZATION | COMPLIANCE | REVERIFICATION" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the visit window; intervals are half-open [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the visit window", constraints: "> window_start" }
      - { name: window_minutes, type: integer, source: computed, description: "floor((window_end - window_start) / 60 seconds)" }
      - { name: observed_inventory_lines, type: array, source: input, default: null, description: "On-site staple stock; same element shape as Application.reported_inventory_lines" }
      - { name: observed_staple_shelf_linear_feet, type: integer, source: input, default: null, description: "Linear feet of staple shelving measured on site" }
      - { name: verified_qualifying_categories, type: integer, source: computed, default: null, description: "Staple categories that qualify under the ONSITE_DEPTH_FIRST variant of calculations.staple_criterion_a_qualification" }
      - { name: verified_perishable_categories, type: integer, source: computed, default: null, description: "Qualifying categories that also carry a perishable variety at or above MIN_UNITS_PER_VARIETY under the ONSITE_DEPTH_FIRST variant" }
      - { name: verified_criterion_a_pass, type: boolean, source: computed, default: null, description: "true iff verified_qualifying_categories == 4 and verified_perishable_categories >= 2" }
      - { name: depth_of_stock_pass, type: boolean, source: computed, default: null, description: "true iff observed_staple_shelf_linear_feet >= the store_type floor in calculations.depth_of_stock_assessment" }
      - { name: shelf_discrepancy_bps, type: integer, source: computed, default: null, description: "floor(abs(observed_staple_shelf_linear_feet - Store.staple_shelf_linear_feet) * 10000 / max(Store.staple_shelf_linear_feet, 1))" }
      - { name: shelf_discrepancy_flag, type: boolean, source: computed, default: null, description: "true iff shelf_discrepancy_bps > 2500" }
      - { name: findings_submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant findings were recorded" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | IN_PROGRESS | FINDINGS_SUBMITTED | NO_ACCESS | CANCELLED" }

  - name: PosTransaction
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the redeeming location" }
      - { name: terminal_deployment_id, type: string, source: input, description: "FK -> TerminalDeployment.id; the terminal the sale ran on" }
      - { name: household_ebt_card_last4, type: string, source: input, description: "Last four digits of the household EBT card", constraints: "exactly 4 digits" }
      - { name: line_items, type: array, source: input, description: "Basket lines; each element { sku: string, item_class: STAPLE_FOOD|NONSTAPLE_FOOD|SEED_PLANT|HOT_PREPARED|ALCOHOL|TOBACCO|NONFOOD|ENERGY_DRINK_SUPPLEMENT|LIVE_ANIMAL, unit_price_cents: integer, qty: integer }" }
      - { name: snap_benefit_available_cents, type: integer, source: input, description: "Household EBT balance snapshot presented by the processor", constraints: ">= 0" }
      - { name: other_tender_offered_cents, type: integer, source: input, description: "Cash/card the household offers for the ineligible remainder", constraints: ">= 0" }
      - { name: eligible_subtotal_cents, type: integer, source: computed, description: "Extended total of lines whose item_class is SNAP-eligible" }
      - { name: ineligible_subtotal_cents, type: integer, source: computed, description: "Extended total of lines whose item_class is SNAP-ineligible" }
      - { name: tax_cents, type: integer, source: computed, description: "Sales tax charged on the ineligible subtotal only; sum-then-round once (see calculations.pos_eligibility_split_tender)" }
      - { name: ebt_tender_cents, type: integer, source: computed, description: "min(eligible_subtotal_cents, snap_benefit_available_cents)" }
      - { name: other_tender_cents, type: integer, source: computed, description: "ineligible_subtotal_cents + tax_cents + (eligible_subtotal_cents - ebt_tender_cents), or 0 when the sale is DECLINED" }
      - { name: split_tender_applied, type: boolean, source: computed, description: "true iff other_tender_cents > 0 on an AUTHORIZED sale" }
      - { name: flagged_line_skus, type: array, source: computed, description: "sku values of every line whose item_class is SNAP-ineligible, in request order" }
      - { name: decline_reason_code, type: enum, source: system, default: null, description: "NO_ELIGIBLE_ITEMS | INSUFFICIENT_SPLIT_TENDER — populated only on DECLINED" }
      - { name: void_reason_code, type: enum, source: input, default: null, description: "CLERK_ERROR | CUSTOMER_ABANDONED | PROCESSOR_REVERSAL — recorded on void" }
      - { name: status, type: enum, source: system, default: "AUTHORIZED", description: "AUTHORIZED | DECLINED | VOIDED" }

  - name: RedemptionPeriod
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the monitored location" }
      - { name: period_index, type: integer, source: input, description: "Monotonic monitoring-period counter, unique per store", constraints: ">= 1" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start; periods are half-open [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end", constraints: "> period_start" }
      - { name: pos_derived_total_cents, type: integer, source: computed, default: 0, description: "Sum of ebt_tender_cents over PosTransaction rows for this store with status == AUTHORIZED and period_start <= created_at < period_end" }
      - { name: pos_derived_transaction_count, type: integer, source: computed, default: 0, description: "Count of the same AUTHORIZED PosTransaction set" }
      - { name: imported_total_cents, type: integer, source: input, default: null, description: "EBT processor settlement total for the period; null until settlement-import" }
      - { name: imported_transaction_count, type: integer, source: input, default: null, description: "EBT processor settlement transaction count; null until settlement-import" }
      - { name: imported_large_transaction_cents, type: integer, source: input, default: null, description: "Settlement total restricted to transactions >= LARGE_TXN_THRESHOLD_CENTS" }
      - { name: imported_even_dollar_transaction_count, type: integer, source: input, default: null, description: "Settlement count of transactions that are a non-zero whole multiple of 1000 cents" }
      - { name: redemption_total_cents, type: integer, source: computed, description: "imported_total_cents when it is non-null, otherwise pos_derived_total_cents" }
      - { name: transaction_count, type: integer, source: computed, description: "imported_transaction_count when imported_total_cents is non-null, otherwise pos_derived_transaction_count" }
      - { name: large_transaction_cents, type: integer, source: computed, description: "imported_large_transaction_cents when imported_total_cents is non-null, otherwise the POS-derived equivalent" }
      - { name: even_dollar_transaction_count, type: integer, source: computed, description: "imported_even_dollar_transaction_count when imported_total_cents is non-null, otherwise the POS-derived equivalent" }
      - { name: reconciliation_variance_cents, type: integer, source: computed, default: null, description: "imported_total_cents - pos_derived_total_cents; null until settlement-import" }
      - { name: reconciliation_status, type: enum, source: computed, default: "NOT_IMPORTED", description: "NOT_IMPORTED | MATCHED | VARIANCE — VARIANCE iff abs(reconciliation_variance_cents) > 500" }
      - { name: size_expectation_cents, type: integer, source: computed, default: null, description: "Expected periodic redemption volume from store size and sales; null until close" }
      - { name: anomaly_score, type: integer, source: computed, default: null, description: "0..100 integer from calculations.redemption_anomaly_score; null until close" }
      - { name: flag_level, type: enum, source: computed, default: null, description: "FLAG_L0 | FLAG_L1 | FLAG_L2 | FLAG_L3; null until close" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of close" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED" }

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store under investigation" }
      - { name: trigger_period_id, type: string, source: input, default: null, description: "FK -> RedemptionPeriod.id; required when opened_reason == ANOMALY_FLAG_L3, else null" }
      - { name: opened_reason, type: enum, source: input, description: "ANOMALY_FLAG_L3 | TIP | ALE_REFERRAL" }
      - { name: evidence_items, type: array, source: input, default: null, description: "Each element { evidence_type: UNDERCOVER_BUY|INVENTORY_PURCHASE_MISMATCH|EBT_ONLY_TRANSACTION_PATTERN|INFORMANT_STATEMENT|HOUSEHOLD_INTERVIEW, observed_at: datetime, note: string? }" }
      - { name: trafficking_confidence_score, type: integer, source: computed, default: 0, description: "0..100 integer from calculations.trafficking_confidence_score" }
      - { name: substantiated_violation, type: enum, source: input, default: null, description: "TRAFFICKING | INELIGIBLE_ITEM_SALES | NONE — recorded at conclude" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the FnsAnalyst that opened the case, or the literal 'system' for auto-opened ANOMALY_FLAG_L3 cases" }
      - { name: concluded_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FnsAnalyst that concluded the case" }
      - { name: concluded_at, type: datetime, source: system, default: null, description: "Logical-clock instant of conclude" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | EVIDENCE_REVIEW | SUBSTANTIATED | UNSUBSTANTIATED" }

  - name: SanctionCase
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; copied from the originating Investigation" }
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id; must be SUBSTANTIATED" }
      - { name: predecessor_case_id, type: string, source: system, default: null, description: "FK -> SanctionCase.id; the most recent prior SANCTION_FINAL/ENFORCED case for this store, forming the repeat-violation chain" }
      - { name: violation_type, type: enum, source: input, description: "TRAFFICKING | INELIGIBLE_ITEMS_HARDSHIP | STOCK_FAILURE" }
      - { name: charge_summary, type: string, source: input, default: null, description: "Narrative recorded on the charge letter" }
      - { name: charge_letter_sent_at, type: datetime, source: system, default: null, description: "Logical-clock instant the charge letter issued" }
      - { name: charge_issued_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FnsAdmin that issued the charge letter" }
      - { name: reply_due_at, type: datetime, source: computed, default: null, description: "charge_letter_sent_at + 10 days" }
      - { name: cmp_election_due_at, type: datetime, source: computed, default: null, description: "charge_letter_sent_at + 10 days" }
      - { name: reply_text, type: string, source: input, default: null, description: "Retailer reply to the charge letter" }
      - { name: reply_received_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the retailer reply" }
      - { name: prior_final_sanction_count, type: integer, source: computed, default: 0, description: "Count of other SanctionCase rows with status IN {SANCTION_FINAL, ENFORCED} and sanction_type IN {PERMANENT_DISQUALIFICATION, TEMPORARY_DISQUALIFICATION} for this store or any other store of the same Owner" }
      - { name: sanction_type, type: enum, source: input, default: null, description: "PERMANENT_DISQUALIFICATION | TEMPORARY_DISQUALIFICATION | CMP_IN_LIEU | WARNING — supplied at determination and validated against violation_type" }
      - { name: disqualification_months, type: integer, source: computed, default: null, description: "Months of disqualification from calculations.disqualification_period_months; null for PERMANENT_DISQUALIFICATION and for WARNING" }
      - { name: cmp_basis_variant, type: enum, source: computed, default: null, description: "TRAILING_12_PERIOD_AVERAGE | PEAK_3_PERIOD_AVERAGE — which variant of calculations.civil_money_penalty_amount was applied" }
      - { name: cmp_basis_period_ids, type: array, source: computed, default: null, description: "Ids of the RedemptionPeriod rows that entered the CMP basis, in the variant's own ordering" }
      - { name: avg_monthly_redemption_cents, type: integer, source: computed, default: null, description: "round_half_up(sum of basis redemption_total_cents / basis count)" }
      - { name: monthly_penalty_cents, type: integer, source: computed, default: null, description: "round_half_up(avg_monthly_redemption_cents * 1000 / 10000) — rounded BEFORE multiplication by months" }
      - { name: cmp_amount_cents, type: integer, source: computed, default: null, description: "min(monthly_penalty_cents * cmp_month_multiplier, 6900000)" }
      - { name: cmp_capped, type: boolean, source: computed, default: null, description: "true iff monthly_penalty_cents * cmp_month_multiplier > 6900000" }
      - { name: cmp_outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of PenaltyLedgerEntry.amount_cents for this case" }
      - { name: determined_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the determination" }
      - { name: determined_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FnsAdmin that issued the determination" }
      - { name: admin_review_due_at, type: datetime, source: computed, default: null, description: "determined_at + 10 days — deadline to request administrative review" }
      - { name: admin_review_requested_at, type: datetime, source: system, default: null, description: "Logical-clock instant the retailer requested review" }
      - { name: grounds_text, type: string, source: input, default: null, description: "Retailer grounds for administrative review" }
      - { name: admin_review_outcome, type: enum, source: input, default: null, description: "SUSTAINED | REVERSED | REMANDED" }
      - { name: admin_review_decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the AdminReviewOfficer that decided the review" }
      - { name: remand_count, type: integer, source: system, default: 0, description: "Number of times the review officer has remanded this case" }
      - { name: final_decision_at, type: datetime, source: system, default: null, description: "Logical-clock instant the sanction became final" }
      - { name: effective_date, type: datetime, source: computed, default: null, description: "final_decision_at + 30 days for disqualification sanctions; null for CMP_IN_LIEU and WARNING" }
      - { name: enforced_at, type: datetime, source: system, default: null, description: "Logical-clock instant of enforcement" }
      - { name: reason_code, type: enum, source: input, default: null, description: "EVIDENCE_SUFFICIENT | EVIDENCE_INSUFFICIENT | PROCEDURAL_DEFECT | NEW_EVIDENCE — recorded with the review decision" }
      - { name: status, type: enum, source: system, default: "CHARGE_DRAFT", description: "CHARGE_DRAFT | CHARGE_ISSUED | REPLY_RECEIVED | DETERMINED | ADMIN_REVIEW_REQUESTED | REMANDED | SANCTION_FINAL | ENFORCED | SANCTION_REVERSED" }

  - name: CmpElection
    parent: null
    common_fields: true
    fields:
      - { name: sanction_case_id, type: string, source: system, description: "FK -> SanctionCase.id; the case this election attaches to" }
      - { name: hardship_ownership_change_pending, type: boolean, source: input, default: false, description: "true when the retailer is electing CMP because a sale of the firm is pending under 7 CFR 278.6(f)(2)" }
      - { name: elected_at, type: datetime, source: system, description: "Logical-clock instant of the election" }
      - { name: quoted_amount_cents, type: integer, source: computed, description: "The CMP amount calculations.civil_money_penalty_amount yields at election time, using the election-time basis" }
      - { name: quoted_basis_variant, type: enum, source: computed, description: "TRAILING_12_PERIOD_AVERAGE | PEAK_3_PERIOD_AVERAGE at election time" }
      - { name: status, type: enum, source: system, default: "ELECTED", description: "ELECTED | SUPERSEDED | APPROVED | REJECTED | PAID" }

  - name: PenaltyLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: sanction_case_id, type: string, source: system, description: "FK -> SanctionCase.id; the case whose penalty balance this entry moves" }
      - { name: entry_type, type: enum, source: system, description: "CMP_ASSESSED | CMP_PAYMENT | CMP_ABATEMENT" }
      - { name: amount_cents, type: integer, source: input, description: "Signed cents: positive for CMP_ASSESSED, negative for CMP_PAYMENT and CMP_ABATEMENT" }
      - { name: reason_code, type: enum, source: system, description: "DETERMINATION | RETAILER_REMITTANCE | REVIEW_REVERSAL" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Running sum of amount_cents over this case's entries ordered by created_at ASC, up to and including this entry" }

  - name: EquipmentDepot
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code the depot serves", constraints: "exactly 2 uppercase letters" }
      - { name: total_units_owned, type: integer, source: input, description: "Total EBT terminals the depot owns; the conserved quantity", constraints: ">= 0" }
      - { name: units_reserved, type: integer, source: computed, default: 0, description: "Count of this depot's terminals whose status == RESERVED" }
      - { name: units_deployed, type: integer, source: computed, default: 0, description: "Count of this depot's terminals whose status == DEPLOYED" }
      - { name: units_pending_return, type: integer, source: computed, default: 0, description: "Count of this depot's terminals whose status == PENDING_RETURN" }
      - { name: units_retired, type: integer, source: computed, default: 0, description: "Count of this depot's terminals whose status == RETIRED" }
      - { name: units_in_stock, type: integer, source: computed, default: 0, description: "total_units_owned - units_reserved - units_deployed - units_pending_return - units_retired" }

  - name: EbtTerminal
    parent: null
    common_fields: true
    fields:
      - { name: depot_id, type: string, source: input, description: "FK -> EquipmentDepot.id; the depot that owns this unit" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across all non-RETIRED terminals" }
      - { name: model, type: enum, source: input, description: "EBT_ONLY_WIRELESS | EBT_ONLY_DIAL | COMMERCIAL_INTEGRATED" }
      - { name: status, type: enum, source: system, default: "IN_STOCK", description: "IN_STOCK | RESERVED | DEPLOYED | PENDING_RETURN | RETIRED — RESERVED means at least one open non-active commitment exists, so a unit booked for several non-overlapping windows still counts once in the depot ledger" }

  - name: TerminalDeployment
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the location the terminal is committed to" }
      - { name: terminal_id, type: string, source: input, description: "FK -> EbtTerminal.id; the committed unit" }
      - { name: deploy_start, type: datetime, source: input, description: "Inclusive start of the commitment; deployment intervals are CLOSED [deploy_start, deploy_end]" }
      - { name: deploy_end, type: datetime, source: input, description: "Inclusive end of the commitment", constraints: ">= deploy_start" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock instant of activation" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the deployment reached RELEASED or RETURNED" }
      - { name: close_reason_code, type: enum, source: input, default: null, description: "AUTHORIZATION_LOST | INVESTIGATION_FREEZE | RETAILER_REQUEST | END_OF_TERM | DAMAGED" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | ACTIVE | RECALL_PENDING | RETURNED | RELEASED" }

  - name: EquipmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the ordering location" }
      - { name: lines, type: array, source: input, description: "Each element { item_code: EBT_ONLY_WIRELESS_TERMINAL|EBT_ONLY_DIAL_TERMINAL|COMMERCIAL_POS_INTEGRATION|MANUAL_VOUCHER_KIT|SIGNAGE_PACK|RECEIPT_PAPER_CASE, qty: integer }" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of catalog unit price * qty over all lines" }
      - { name: subsidy_cents, type: integer, source: computed, description: "USDA-borne portion covering EBT-only items when the store qualifies" }
      - { name: net_equipment_cents, type: integer, source: computed, description: "subtotal_cents - subsidy_cents; the ONLY input to the handling-fee threshold" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "0 or 1500, decided from net_equipment_cents and never from total_due_cents" }
      - { name: total_due_cents, type: integer, source: computed, description: "net_equipment_cents + handling_fee_cents" }
      - { name: placed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of placement" }
      - { name: cancel_reason_code, type: enum, source: input, default: null, description: "RETAILER_REQUEST | AUTHORIZATION_LOST | DUPLICATE_ORDER" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PLACED | FULFILLED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Application
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/submit"
        preconditions:
          - "status == DRAFT"
          - "Owner.status != BARRED for the store's owner, else ERR_OWNER_BARRED"
          - "Store.authorization_status IN {NOT_AUTHORIZED, WITHDRAWN}, else ERR_INVALID_STATE"
          - "when claimed_criterion == CRITERION_B, Store.criterion_b_pass == true, else ERR_CRITERION_B_NOT_MET"
          - "when claimed_criterion == CRITERION_A, desk_criterion_pass == true, else ERR_STAPLE_STOCK_INSUFFICIENT"
        side_effects:
          - "sets submitted_at to the current logical clock"
          - "recomputes desk_qualifying_categories, desk_perishable_categories and desk_criterion_pass"
          - "clears hold_reason_code"
      - from: SUBMITTED
        to: PENDING_VISIT
        trigger: "POST /store-visits (with application_id referencing this application)"
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "creates the StoreVisit in SCHEDULED"
          - "increases Inspector.committed_minutes by the visit window_minutes"
      - from: PENDING_VISIT
        to: UNDER_REVIEW
        trigger: "POST /store-visits/{visitId}/findings (verified staple criterion satisfied and no shelf discrepancy)"
        preconditions:
          - "the visit's status == IN_PROGRESS"
          - "verified_criterion_a_pass == true and shelf_discrepancy_flag == false"
          - "depth_of_stock_pass is NOT checked here — a depth failure still reaches UNDER_REVIEW and is refused at the decision"
        side_effects:
          - "sets verified_criterion_pass to true"
          - "clears hold_reason_code"
      - from: PENDING_VISIT
        to: PENDING_DOCUMENTS
        trigger: "POST /store-visits/{visitId}/findings (verified staple criterion failed or shelf_discrepancy_flag true) or POST /store-visits/{visitId}/no-access, while deficiency_cycle_count < 2"
        preconditions:
          - "deficiency_cycle_count < 2"
        side_effects:
          - "increments deficiency_cycle_count by 1"
          - "sets hold_reason_code to STAPLE_STOCK_INSUFFICIENT, DEPTH_OF_STOCK_INSUFFICIENT, SHELF_DISCREPANCY or NO_ACCESS according to which check failed"
          - "sets verified_criterion_pass to the failing verified_criterion_a_pass value"
      - from: PENDING_VISIT
        to: DENIED
        trigger: "POST /store-visits/{visitId}/findings (verified staple criterion failed or shelf_discrepancy_flag true) or POST /store-visits/{visitId}/no-access, when deficiency_cycle_count is already 2"
        preconditions:
          - "deficiency_cycle_count == 2 (MAX_DEFICIENCY_CYCLES exhausted)"
        side_effects:
          - "increments deficiency_cycle_count to 3"
          - "sets decision_reason_code to DEFICIENCY_CYCLES_EXHAUSTED"
          - "sets decided_at to the current logical clock"
          - "transitions every RESERVED TerminalDeployment of the store to RELEASED"
      - from: PENDING_DOCUMENTS
        to: SUBMITTED
        trigger: "POST /applications/{applicationId}/documents"
        preconditions:
          - "status == PENDING_DOCUMENTS"
          - "deficiency_cycle_count <= 2"
        side_effects:
          - "replaces reported_inventory_lines with the supplied lines"
          - "recomputes the DESK_VARIETY_FIRST staple figures"
          - "sets submitted_at to the current logical clock"
          - "clears hold_reason_code"
      - from: UNDER_REVIEW
        to: PENDING_DOCUMENTS
        trigger: "POST /investigations (opened against the store while this application is UNDER_REVIEW)"
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "sets hold_reason_code to INVESTIGATION_HOLD"
          - "increments deficiency_cycle_count by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{applicationId}/decision (outcome APPROVED)"
        preconditions:
          - "status == UNDER_REVIEW"
          - "verified_criterion_pass == true"
          - "the latest FINDINGS_SUBMITTED StoreVisit of this application has depth_of_stock_pass == true, else ERR_DEPTH_OF_STOCK_INSUFFICIENT"
          - "Owner.permanent_disqualification_count == 0, else ERR_OWNER_PERMANENTLY_DISQUALIFIED"
          - "when application_type == REAUTHORIZATION_OWNERSHIP_CHANGE, the predecessor store's Owner.cmp_outstanding_cents == 0, else ERR_TRANSFER_CMP_OUTSTANDING"
          - "when application_type == REAUTHORIZATION_OWNERSHIP_CHANGE, Store.owner_id != the predecessor store's owner_id, else ERR_OWNERSHIP_UNCHANGED"
        side_effects:
          - "sets decided_at to the current logical clock"
          - "sets decision_reason_code to APPROVED_CRITERION_A or APPROVED_CRITERION_B from claimed_criterion"
          - "mints Store.fns_number when the store has none, from the FNS-1000001 sequence"
          - "sets Store.authorization_status to AUTHORIZED and Store.authorized_at to the current logical clock"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{applicationId}/decision (outcome DENIED)"
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "sets decided_at to the current logical clock"
          - "sets decision_reason_code from the supplied reason_code"
          - "transitions every RESERVED TerminalDeployment of the store to RELEASED"
      - from: "DRAFT | SUBMITTED | PENDING_VISIT | PENDING_DOCUMENTS | UNDER_REVIEW"
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        preconditions:
          - "status NOT IN {APPROVED, DENIED, WITHDRAWN}"
        side_effects:
          - "sets decision_reason_code to WITHDRAWN_BY_APPLICANT"
          - "cancels every SCHEDULED StoreVisit of this application, releasing the inspector's committed minutes"

  - entity: Store
    dimension: authorization_status
    initial_state: NOT_AUTHORIZED
    terminal_states: [DISQUALIFIED]
    shape: parallel
    notes: "Dimension 1 of two independent Store dimensions; authorization_status governs the right to redeem, sanction_status governs the enforcement pipeline. Both move independently and the combined pair decides whether a POS sale is accepted."
    transitions:
      - from: NOT_AUTHORIZED
        to: AUTHORIZED
        trigger: "POST /applications/{applicationId}/decision (outcome APPROVED)"
        preconditions:
          - "authorization_status IN {NOT_AUTHORIZED, WITHDRAWN}"
        side_effects:
          - "sets fns_number when absent and sets authorized_at"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /sanction-cases/{caseId}/finalize"
        preconditions:
          - "the case sanction_type IN {PERMANENT_DISQUALIFICATION, TEMPORARY_DISQUALIFICATION}"
        side_effects:
          - "sets sanction_status to SANCTION_FINAL"
          - "leaves every ACTIVE TerminalDeployment untouched until the effective date"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /sanction-cases/{caseId}/enforce"
        preconditions:
          - "the current logical clock >= the case effective_date, else ERR_ENFORCEMENT_NOT_DUE"
        side_effects:
          - "sets permanently_disqualified true and leaves disqualified_until null for PERMANENT_DISQUALIFICATION"
          - "sets disqualified_until to enforced_at plus disqualification_months for TEMPORARY_DISQUALIFICATION"
          - "transitions every ACTIVE TerminalDeployment of this store to RECALL_PENDING"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /sanction-cases/{caseId}/administrative-review-decision (outcome REVERSED)"
        preconditions:
          - "authorization_status == SUSPENDED"
        side_effects:
          - "sets sanction_status to SANCTION_REVERSED"
          - "abates the whole outstanding CMP balance with a CMP_ABATEMENT ledger entry"
      - from: AUTHORIZED
        to: WITHDRAWN
        trigger: "POST /stores/{storeId}/withdraw"
        preconditions:
          - "authorization_status == AUTHORIZED"
          - "sanction_status NOT IN {CHARGED, UNDER_ADMIN_REVIEW, SANCTION_FINAL}, else ERR_INVALID_STATE"
        side_effects:
          - "transitions every ACTIVE or RESERVED TerminalDeployment of the store to RELEASED"

  - entity: Store
    dimension: sanction_status
    initial_state: NONE
    terminal_states: []
    shape: parallel
    notes: "Dimension 2 of the Store parallel machine. Moves on investigation and sanction events without ever changing authorization_status by itself."
    transitions:
      - from: NONE
        to: UNDER_INVESTIGATION
        trigger: "POST /investigations, or the automatic investigation opened by POST /redemption-periods/{periodId}/close at FLAG_L3"
        preconditions:
          - "sanction_status IN {NONE, SANCTION_REVERSED}"
        side_effects:
          - "transitions every RESERVED TerminalDeployment of the store to RELEASED"
      - from: UNDER_INVESTIGATION
        to: NONE
        trigger: "POST /investigations/{investigationId}/conclude (substantiated_violation NONE)"
        preconditions:
          - "no other Investigation of this store is OPEN or EVIDENCE_REVIEW"
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: CHARGED
        trigger: "POST /sanction-cases/{caseId}/charge-letter"
        preconditions:
          - "the case status == CHARGE_DRAFT"
        side_effects:
          - "sets the case reply_due_at and cmp_election_due_at to charge_letter_sent_at plus 10 days"
      - from: CHARGED
        to: UNDER_ADMIN_REVIEW
        trigger: "POST /sanction-cases/{caseId}/administrative-review"
        preconditions:
          - "the case status == DETERMINED"
        side_effects: []
      - from: "CHARGED | UNDER_ADMIN_REVIEW"
        to: SANCTION_FINAL
        trigger: "POST /sanction-cases/{caseId}/finalize"
        preconditions:
          - "the case status == DETERMINED and the administrative-review window has closed, or the review was SUSTAINED"
        side_effects:
          - "sets Store.authorization_status to SUSPENDED for disqualification sanctions"
      - from: UNDER_ADMIN_REVIEW
        to: SANCTION_REVERSED
        trigger: "POST /sanction-cases/{caseId}/administrative-review-decision (outcome REVERSED)"
        preconditions:
          - "the case status == ADMIN_REVIEW_REQUESTED"
        side_effects:
          - "restores Store.authorization_status to AUTHORIZED when it was SUSPENDED"

  - entity: StoreVisit
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [FINDINGS_SUBMITTED, NO_ACCESS, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /store-visits/{visitId}/start"
        preconditions:
          - "status == SCHEDULED"
          - "Inspector.status == ACTIVE, else ERR_INVALID_STATE"
          - "the current logical clock >= window_start, else ERR_VISIT_WINDOW_NOT_OPEN"
        side_effects: []
      - from: IN_PROGRESS
        to: FINDINGS_SUBMITTED
        trigger: "POST /store-visits/{visitId}/findings"
        preconditions:
          - "status == IN_PROGRESS"
          - "for visit_type == REVERIFICATION the acting inspector must differ from the inspector who submitted findings on the store's PRE_AUTHORIZATION visit, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "computes verified_qualifying_categories, verified_perishable_categories, verified_criterion_a_pass, depth_of_stock_pass, shelf_discrepancy_bps and shelf_discrepancy_flag"
          - "sets findings_submitted_at to the current logical clock"
          - "releases the visit's minutes from Inspector.committed_minutes"
          - "advances the Application to UNDER_REVIEW, PENDING_DOCUMENTS or DENIED per the Application machine"
      - from: IN_PROGRESS
        to: NO_ACCESS
        trigger: "POST /store-visits/{visitId}/no-access"
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "releases the visit's minutes from Inspector.committed_minutes"
          - "advances the Application to PENDING_DOCUMENTS or DENIED per the deficiency-cycle rule"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /store-visits/{visitId}/cancel"
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "releases the visit's minutes from Inspector.committed_minutes"

  - entity: Investigation
    dimension: status
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    shape: branching
    transitions:
      - from: OPEN
        to: EVIDENCE_REVIEW
        trigger: "POST /investigations/{investigationId}/evidence"
        preconditions:
          - "status IN {OPEN, EVIDENCE_REVIEW}"
        side_effects:
          - "appends the evidence item and recomputes trafficking_confidence_score against the current logical clock"
      - from: EVIDENCE_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /investigations/{investigationId}/conclude (substantiated_violation TRAFFICKING or INELIGIBLE_ITEM_SALES)"
        preconditions:
          - "status == EVIDENCE_REVIEW"
          - "for TRAFFICKING, trafficking_confidence_score >= 60 and at least one UNDERCOVER_BUY or INVENTORY_PURCHASE_MISMATCH item still carries a non-zero decay multiplier, else ERR_INSUFFICIENT_EVIDENCE"
          - "for INELIGIBLE_ITEM_SALES, at least one evidence item carries a non-zero decay multiplier, else ERR_INSUFFICIENT_EVIDENCE"
          - "the concluding user must differ from opened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets concluded_at and concluded_by_user_id"
      - from: "OPEN | EVIDENCE_REVIEW"
        to: UNSUBSTANTIATED
        trigger: "POST /investigations/{investigationId}/conclude (substantiated_violation NONE)"
        preconditions:
          - "status IN {OPEN, EVIDENCE_REVIEW}"
        side_effects:
          - "sets concluded_at and concluded_by_user_id"
          - "returns Store.sanction_status to NONE when no other investigation of the store is still open"

  - entity: SanctionCase
    dimension: status
    initial_state: CHARGE_DRAFT
    terminal_states: [ENFORCED, SANCTION_REVERSED]
    shape: cyclic
    transitions:
      - from: CHARGE_DRAFT
        to: CHARGE_ISSUED
        trigger: "POST /sanction-cases/{caseId}/charge-letter"
        preconditions:
          - "status == CHARGE_DRAFT"
          - "charge_summary is present"
        side_effects:
          - "sets charge_letter_sent_at to the current logical clock and charge_issued_by_user_id to the acting user"
          - "sets reply_due_at and cmp_election_due_at to charge_letter_sent_at plus 10 days"
          - "sets Store.sanction_status to CHARGED"
      - from: CHARGE_ISSUED
        to: REPLY_RECEIVED
        trigger: "POST /sanction-cases/{caseId}/reply"
        preconditions:
          - "status == CHARGE_ISSUED"
          - "the current logical clock < reply_due_at, else ERR_REPLY_WINDOW_CLOSED"
        side_effects:
          - "sets reply_text and reply_received_at"
      - from: "CHARGE_ISSUED | REPLY_RECEIVED | REMANDED"
        to: DETERMINED
        trigger: "POST /sanction-cases/{caseId}/determination"
        preconditions:
          - "status IN {CHARGE_ISSUED, REPLY_RECEIVED, REMANDED}"
          - "for CHARGE_ISSUED the reply window must already be closed, else ERR_REPLY_WINDOW_OPEN"
          - "sanction_type must be allowed for violation_type, else ERR_SANCTION_TYPE_NOT_ALLOWED"
          - "for CMP_IN_LIEU the store must be hardship_designated with a timely election on file, else ERR_CMP_NOT_AVAILABLE"
        side_effects:
          - "computes prior_final_sanction_count and disqualification_months"
          - "computes cmp_basis_variant, cmp_basis_period_ids, avg_monthly_redemption_cents, monthly_penalty_cents, cmp_amount_cents and cmp_capped for CMP_IN_LIEU"
          - "writes a CMP_ASSESSED PenaltyLedgerEntry for the full cmp_amount_cents when sanction_type == CMP_IN_LIEU"
          - "sets determined_at, determined_by_user_id and admin_review_due_at (determined_at plus 10 days)"
          - "sets the elected CmpElection to APPROVED for CMP_IN_LIEU and to REJECTED otherwise"
      - from: DETERMINED
        to: ADMIN_REVIEW_REQUESTED
        trigger: "POST /sanction-cases/{caseId}/administrative-review"
        preconditions:
          - "status == DETERMINED"
          - "the current logical clock < admin_review_due_at, else ERR_ADMIN_REVIEW_WINDOW_CLOSED"
        side_effects:
          - "sets admin_review_requested_at and grounds_text"
          - "sets Store.sanction_status to UNDER_ADMIN_REVIEW"
      - from: ADMIN_REVIEW_REQUESTED
        to: REMANDED
        trigger: "POST /sanction-cases/{caseId}/administrative-review-decision (outcome REMANDED)"
        preconditions:
          - "status == ADMIN_REVIEW_REQUESTED"
          - "remand_count < 1, else ERR_REMAND_LIMIT_REACHED"
          - "the deciding user must differ from charge_issued_by_user_id and determined_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "increments remand_count by 1"
          - "clears sanction_type, disqualification_months and every CMP figure"
          - "writes a CMP_ABATEMENT PenaltyLedgerEntry for the outstanding balance when one exists"
      - from: ADMIN_REVIEW_REQUESTED
        to: SANCTION_REVERSED
        trigger: "POST /sanction-cases/{caseId}/administrative-review-decision (outcome REVERSED)"
        preconditions:
          - "status == ADMIN_REVIEW_REQUESTED"
          - "the deciding user must differ from charge_issued_by_user_id and determined_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "writes a CMP_ABATEMENT PenaltyLedgerEntry that drives cmp_outstanding_cents to 0"
          - "sets Store.sanction_status to SANCTION_REVERSED and restores authorization_status to AUTHORIZED when it was SUSPENDED"
      - from: "DETERMINED | ADMIN_REVIEW_REQUESTED"
        to: SANCTION_FINAL
        trigger: "POST /sanction-cases/{caseId}/finalize"
        preconditions:
          - "status == DETERMINED with the administrative-review window closed, or status == ADMIN_REVIEW_REQUESTED with admin_review_outcome == SUSTAINED"
        side_effects:
          - "sets final_decision_at to the current logical clock"
          - "sets effective_date to final_decision_at plus 30 days for disqualification sanctions and leaves it null otherwise"
          - "sets Store.sanction_status to SANCTION_FINAL and authorization_status to SUSPENDED for disqualification sanctions"
      - from: SANCTION_FINAL
        to: ENFORCED
        trigger: "POST /sanction-cases/{caseId}/enforce"
        preconditions:
          - "status == SANCTION_FINAL"
          - "sanction_type IN {PERMANENT_DISQUALIFICATION, TEMPORARY_DISQUALIFICATION}, else ERR_SANCTION_TYPE_NOT_ALLOWED"
          - "the current logical clock >= effective_date, else ERR_ENFORCEMENT_NOT_DUE"
        side_effects:
          - "sets enforced_at to the current logical clock"
          - "sets Store.authorization_status to DISQUALIFIED and sets permanently_disqualified or disqualified_until"
          - "transitions every ACTIVE TerminalDeployment of the store to RECALL_PENDING, which moves each terminal DEPLOYED to PENDING_RETURN and recomputes the depot counters"
          - "increments Owner.permanent_disqualification_count for PERMANENT_DISQUALIFICATION and re-derives Owner.sanction_flag and Owner.status"
      - from: ADMIN_REVIEW_REQUESTED
        to: ADMIN_REVIEW_REQUESTED
        trigger: "POST /sanction-cases/{caseId}/administrative-review-decision (outcome SUSTAINED)"
        preconditions:
          - "status == ADMIN_REVIEW_REQUESTED"
          - "the deciding user must differ from charge_issued_by_user_id and determined_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records admin_review_outcome SUSTAINED, admin_review_decided_by_user_id and admin_review_decided_at, leaving the case eligible for finalize"

  - entity: TerminalDeployment
    dimension: status
    initial_state: RESERVED
    terminal_states: [RETURNED, RELEASED]
    shape: branching
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /terminal-deployments/{deploymentId}/activate"
        preconditions:
          - "status == RESERVED"
          - "Store.authorization_status == AUTHORIZED, else ERR_STORE_NOT_AUTHORIZED"
        side_effects:
          - "sets activated_at to the current logical clock"
          - "moves the EbtTerminal from RESERVED to DEPLOYED and recomputes the depot counters"
          - "increments Store.active_terminal_count"
      - from: ACTIVE
        to: RECALL_PENDING
        trigger: "POST /sanction-cases/{caseId}/enforce (cascade), or POST /terminal-deployments/{deploymentId}/recall"
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "moves the EbtTerminal from DEPLOYED to PENDING_RETURN and recomputes the depot counters"
          - "decrements Store.active_terminal_count"
          - "sets close_reason_code to AUTHORIZATION_LOST for the enforcement cascade"
      - from: "ACTIVE | RECALL_PENDING"
        to: RETURNED
        trigger: "POST /terminal-deployments/{deploymentId}/return"
        preconditions:
          - "status IN {ACTIVE, RECALL_PENDING}"
        side_effects:
          - "sets closed_at to the current logical clock"
          - "moves the EbtTerminal to IN_STOCK and recomputes the depot counters"
          - "decrements Store.active_terminal_count when the deployment was ACTIVE"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /terminal-deployments/{deploymentId}/release, or the cascade from application denial, store withdrawal or investigation opening"
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "sets closed_at to the current logical clock"
          - "moves the EbtTerminal from RESERVED to IN_STOCK and recomputes the depot counters"

  - entity: PosTransaction
    dimension: status
    initial_state: AUTHORIZED
    terminal_states: [DECLINED, VOIDED]
    shape: branching
    notes: "Created directly in AUTHORIZED or DECLINED by the eligibility waterfall; DECLINED is terminal on creation."
    transitions:
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /pos-transactions/{transactionId}/void"
        preconditions:
          - "status == AUTHORIZED"
          - "every RedemptionPeriod of the store whose half-open window contains created_at must be OPEN, else ERR_REDEMPTION_PERIOD_CLOSED"
        side_effects:
          - "sets void_reason_code"
          - "removes the transaction from every OPEN period's POS-derived aggregates"

  - entity: RedemptionPeriod
    dimension: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /redemption-periods/{periodId}/close"
        preconditions:
          - "status == OPEN"
          - "the current logical clock >= period_end, else ERR_PERIOD_NOT_ELAPSED"
        side_effects:
          - "freezes redemption_total_cents, transaction_count, large_transaction_cents and even_dollar_transaction_count from the imported settlement when present and from the POS aggregates otherwise"
          - "computes size_expectation_cents, anomaly_score and flag_level"
          - "sets Store.redemption_flag_level from the highest-period_index CLOSED period"
          - "opens an Investigation with opened_reason ANOMALY_FLAG_L3 and trigger_period_id set to this period when flag_level == FLAG_L3, which moves Store.sanction_status to UNDER_INVESTIGATION and releases the store's RESERVED deployments"
          - "sets closed_at to the current logical clock"

  - entity: CmpElection
    dimension: status
    initial_state: ELECTED
    terminal_states: [PAID, REJECTED, SUPERSEDED]
    shape: branching
    transitions:
      - from: ELECTED
        to: SUPERSEDED
        trigger: "POST /sanction-cases/{caseId}/cmp-elections (a later election on the same case)"
        preconditions:
          - "status == ELECTED"
        side_effects:
          - "the newly created election becomes the only ELECTED row for the case"
      - from: ELECTED
        to: APPROVED
        trigger: "POST /sanction-cases/{caseId}/determination (sanction_type CMP_IN_LIEU)"
        preconditions:
          - "status == ELECTED"
        side_effects: []
      - from: ELECTED
        to: REJECTED
        trigger: "POST /sanction-cases/{caseId}/determination (sanction_type other than CMP_IN_LIEU)"
        preconditions:
          - "status == ELECTED"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /sanction-cases/{caseId}/cmp-payments (payment that drives cmp_outstanding_cents to 0)"
        preconditions:
          - "status == APPROVED"
          - "SanctionCase.cmp_outstanding_cents reaches exactly 0"
        side_effects:
          - "re-derives Owner.cmp_outstanding_cents and Owner.sanction_flag"

  - entity: EquipmentOrder
    dimension: status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    shape: linear
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /equipment-orders/{orderId}/place"
        preconditions:
          - "status == DRAFT"
          - "Store.authorization_status == AUTHORIZED, else ERR_STORE_NOT_AUTHORIZED"
        side_effects:
          - "freezes subtotal_cents, subsidy_cents, net_equipment_cents, handling_fee_cents and total_due_cents"
          - "sets placed_at to the current logical clock"
      - from: PLACED
        to: FULFILLED
        trigger: "POST /equipment-orders/{orderId}/fulfill"
        preconditions:
          - "status == PLACED"
        side_effects: []
      - from: "DRAFT | PLACED"
        to: CANCELLED
        trigger: "POST /equipment-orders/{orderId}/cancel"
        preconditions:
          - "status IN {DRAFT, PLACED}"
        side_effects:
          - "sets cancel_reason_code"

# =============================================================================
# §1.2.1 Concurrency Rules — optimistic concurrency control (the only sanctioned
# race mechanism in this scaffold)
# =============================================================================
concurrency_rules:
  - name: application-create-stale-store
    parent_entity: Store
    child_entity: Application
    write_endpoint: "POST /applications"
    occ_field: expected_store_version
    error_id: ERR_STALE_STORE_VERSION
    status: 412
    description: |
      An application is filed against a snapshot of the store's eligibility profile
      (store_type, lane count, shelf feet, sales figures, hardship designation). Every
      PATCH /stores/{storeId} and every application creation increments Store.version, so a
      caller that read the store, then saw the profile edited, must re-read before filing.

  - name: cmp-election-stale-case
    parent_entity: SanctionCase
    child_entity: CmpElection
    write_endpoint: "POST /sanction-cases/{caseId}/cmp-elections"
    occ_field: expected_sanction_case_version
    error_id: ERR_STALE_SANCTION_CASE_VERSION
    status: 412
    description: |
      A CMP election quotes an amount derived from the case's charge date and the store's
      closed redemption history. Charge-letter issuance, replies, determinations and review
      decisions all increment SanctionCase.version, so an election filed against a stale
      snapshot of the case is rejected rather than silently re-quoted.

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: staple_criterion_a_qualification
    algorithm_type: threshold
    inputs: [inventory_lines, MIN_VARIETIES_PER_CATEGORY, MIN_UNITS_PER_VARIETY, AGGREGATE_UNITS_PER_CATEGORY, MIN_QUALIFYING_CATEGORIES, MIN_PERISHABLE_CATEGORIES]
    output_field: "Application.desk_qualifying_categories / Application.desk_criterion_pass / StoreVisit.verified_qualifying_categories / StoreVisit.verified_criterion_a_pass"
    constants:
      STAPLE_CATEGORIES: [BREAD_CEREAL, DAIRY, FRUIT_VEG, MEAT_POULTRY_FISH]
      MIN_VARIETIES_PER_CATEGORY: 3
      MIN_UNITS_PER_VARIETY: 3
      AGGREGATE_UNITS_PER_CATEGORY: 9
      MIN_QUALIFYING_CATEGORIES: 4
      MIN_PERISHABLE_CATEGORIES: 2
    formula: |
      Group the inventory lines by category. A category qualifies according to the active
      variant. Criterion A passes iff qualifying_categories == MIN_QUALIFYING_CATEGORIES (4)
      AND perishable_categories >= MIN_PERISHABLE_CATEGORIES (2), where a qualifying category
      counts as perishable when at least one of the varieties that made it qualify has
      is_perishable == true.
    variants:
      - name: DESK_VARIETY_FIRST
        applies_when: "Evaluating self-reported stock: POST /applications, POST /applications/{applicationId}/documents, POST /applications/{applicationId}/submit"
        formula: |
          distinct_varieties = count of distinct variety_key values in the category
          aggregate_units    = sum of unit_count over the category
          category qualifies iff distinct_varieties >= 3 AND aggregate_units >= 9
          (a variety contributes even when its own unit_count is 1 or 2)
      - name: ONSITE_DEPTH_FIRST
        applies_when: "Evaluating observed stock: POST /store-visits/{visitId}/findings"
        formula: |
          deep_varieties = count of distinct variety_key values in the category whose
                           unit_count >= MIN_UNITS_PER_VARIETY (3)
          category qualifies iff deep_varieties >= 3
          (the aggregate-units shortcut does NOT apply on site; three shallow varieties of
          two units each qualify at the desk and fail at the store)
    notes: "The two variants disagree on shallow-but-broad inventory. Every reconciliation between Application.desk_criterion_pass and StoreVisit.verified_criterion_a_pass exercises the divergence."

  - name: criterion_b_staple_sales_share
    algorithm_type: threshold
    inputs: [Store.annual_staple_sales_cents, Store.annual_gross_sales_cents, CRITERION_B_MIN_BPS]
    output_field: "Store.staple_sales_bps / Store.criterion_b_pass"
    constants:
      CRITERION_B_MIN_BPS: 5000
    formula: |
      staple_sales_bps = floor(annual_staple_sales_cents * 10000 / annual_gross_sales_cents)
      criterion_b_pass = staple_sales_bps > CRITERION_B_MIN_BPS      # STRICTLY greater
      Exactly 5000 bps (50.00%) FAILS. Submitting a CRITERION_B application at exactly 5000
      raises ERR_CRITERION_B_NOT_MET (422).
    notes: "Integer basis points only; no floating-point percentage is ever stored."

  - name: depth_of_stock_assessment
    algorithm_type: threshold
    inputs: [StoreVisit.observed_staple_shelf_linear_feet, Store.staple_shelf_linear_feet, Store.store_type, MIN_SHELF_LINEAR_FEET, SHELF_DISCREPANCY_FLAG_BPS]
    output_field: "StoreVisit.depth_of_stock_pass / StoreVisit.shelf_discrepancy_bps / StoreVisit.shelf_discrepancy_flag"
    constants:
      MIN_SHELF_LINEAR_FEET:
        SUPERMARKET: 120
        GROCERY: 60
        CONVENIENCE: 24
        SPECIALTY: 16
        FARMERS_MARKET: 0
        MEAL_SERVICE: 0
      SHELF_DISCREPANCY_FLAG_BPS: 2500
    formula: |
      floor_ft = MIN_SHELF_LINEAR_FEET[Store.store_type]
      depth_of_stock_pass = observed_staple_shelf_linear_feet >= floor_ft   # inclusive
      shelf_discrepancy_bps = floor(abs(observed_staple_shelf_linear_feet
                                        - Store.staple_shelf_linear_feet) * 10000
                                    / max(Store.staple_shelf_linear_feet, 1))
      shelf_discrepancy_flag = shelf_discrepancy_bps > SHELF_DISCREPANCY_FLAG_BPS
    notes: "The floor is inclusive (24 feet passes for a CONVENIENCE store, 23 fails), while the discrepancy flag is strict (2500 bps does not flag, 2501 does)."

  - name: pos_eligibility_split_tender
    algorithm_type: waterfall_allocation
    inputs: [PosTransaction.line_items, PosTransaction.snap_benefit_available_cents, PosTransaction.other_tender_offered_cents, Store.tax_rate_bps]
    output_field: "PosTransaction.eligible_subtotal_cents / ineligible_subtotal_cents / tax_cents / ebt_tender_cents / other_tender_cents / split_tender_applied"
    constants:
      ELIGIBLE_ITEM_CLASSES: [STAPLE_FOOD, NONSTAPLE_FOOD, SEED_PLANT]
      INELIGIBLE_ITEM_CLASSES: [HOT_PREPARED, ALCOHOL, TOBACCO, NONFOOD, ENERGY_DRINK_SUPPLEMENT, LIVE_ANIMAL]
    formula: |
      eligible_subtotal_cents   = sum(unit_price_cents * qty) over lines whose item_class is in
                                  ELIGIBLE_ITEM_CLASSES
      ineligible_subtotal_cents = sum(unit_price_cents * qty) over the remaining lines
      flagged_line_skus         = sku of every ineligible line, in request order

      If eligible_subtotal_cents == 0 -> status DECLINED, decline_reason_code
      NO_ELIGIBLE_ITEMS, ERR_NO_ELIGIBLE_ITEMS (422); all tender fields 0.

      tax_cents = round_half_up(ineligible_subtotal_cents * Store.tax_rate_bps / 10000)
        PINNED ORDER: the ineligible extended amounts are summed FIRST and the rate is applied
        ONCE to that sum. Applying the rate per line and summing the rounded per-line taxes is
        wrong and diverges on realistic baskets.

      ebt_tender_cents = min(eligible_subtotal_cents, snap_benefit_available_cents)
      eligible_shortfall_cents = eligible_subtotal_cents - ebt_tender_cents
      other_tender_required_cents = ineligible_subtotal_cents + tax_cents
                                    + eligible_shortfall_cents

      If other_tender_offered_cents < other_tender_required_cents -> status DECLINED,
      decline_reason_code INSUFFICIENT_SPLIT_TENDER, ERR_SPLIT_TENDER_SHORTFALL (422);
      ebt_tender_cents and other_tender_cents are recorded as 0.

      Otherwise status AUTHORIZED, other_tender_cents = other_tender_required_cents
      (the offer is NOT banked in full — only the required amount is taken), and
      split_tender_applied = other_tender_cents > 0.
    notes: "EBT benefits fill the eligible bucket first and may never touch tax or ineligible goods; the household's own tender covers the ineligible bucket plus its tax plus any eligible shortfall."

  - name: redemption_period_metrics
    algorithm_type: aggregation
    inputs: [PosTransaction rows of the store, RedemptionPeriod window, imported settlement fields]
    output_field: "RedemptionPeriod.pos_derived_total_cents / redemption_total_cents / transaction_count / large_transaction_cents / even_dollar_transaction_count / reconciliation_variance_cents / reconciliation_status"
    constants:
      LARGE_TXN_THRESHOLD_CENTS: 10000
      EVEN_DOLLAR_UNIT_CENTS: 1000
      RECON_TOLERANCE_CENTS: 500
    formula: |
      Included POS set: PosTransaction rows with store_id == this store, status == AUTHORIZED
      (DECLINED and VOIDED rows are excluded), and
      period_start <= created_at < period_end            # half-open window

      pos_derived_total_cents        = sum(ebt_tender_cents) over the included set
      pos_derived_transaction_count  = count of the included set
      POS-derived large total        = sum(ebt_tender_cents) where
                                       ebt_tender_cents >= LARGE_TXN_THRESHOLD_CENTS
      POS-derived even-dollar count  = count where ebt_tender_cents % 1000 == 0
                                       AND ebt_tender_cents > 0

      Settlement override: when imported_total_cents is non-null, redemption_total_cents,
      transaction_count, large_transaction_cents and even_dollar_transaction_count ALL come
      from the imported_* fields; otherwise all four come from the POS-derived equivalents.
      The processor is authoritative once it has reported.

      reconciliation_variance_cents = imported_total_cents - pos_derived_total_cents
      reconciliation_status = NOT_IMPORTED when imported_total_cents is null,
                              VARIANCE when abs(reconciliation_variance_cents) > 500,
                              MATCHED otherwise
    notes: "Voiding an AUTHORIZED transaction inside an OPEN period reduces the POS-derived aggregates; once the period is CLOSED the void is refused with ERR_REDEMPTION_PERIOD_CLOSED."

  - name: redemption_anomaly_score
    algorithm_type: weighted_scoring
    inputs: [RedemptionPeriod.redemption_total_cents, transaction_count, large_transaction_cents, even_dollar_transaction_count, Store.checkout_lane_count, Store.staple_shelf_linear_feet, Store.annual_gross_sales_cents, Store.store_type]
    output_field: "RedemptionPeriod.size_expectation_cents / RedemptionPeriod.anomaly_score"
    constants:
      LANE_BASE_CENTS: 400000
      SHELF_FOOT_CENTS: 15000
      MIN_EXPECTATION_CENTS: 100000
      EXCESS_SPAN_BPS: 20000
      LARGE_SHARE_CAP: 0.50
      EVEN_SHARE_CAP: 0.40
      WEIGHTS_DEFAULT: { excess: 50, large: 30, even: 20 }
      WEIGHTS_SMALL_FORMAT: { excess: 45, large: 35, even: 20 }
      WEIGHTS_FARMERS_MARKET: { excess: 20, large: 30, even: 50 }
    formula: |
      size_from_footprint_cents = Store.checkout_lane_count * 400000
                                  + Store.staple_shelf_linear_feet * 15000
      size_from_sales_cents     = floor(Store.annual_gross_sales_cents / 12)
      size_expectation_cents    = max(100000, min(size_from_footprint_cents,
                                                 size_from_sales_cents))
        (the smaller of footprint and sales expectation, floored at $1,000 so a tiny store
         cannot divide by zero)

      ratio_bps       = floor(redemption_total_cents * 10000 / size_expectation_cents)
      excess_component = min(1, max(0, ratio_bps - 10000) / 20000)
      large_share      = large_transaction_cents / max(redemption_total_cents, 1)
      large_component  = min(1, large_share / 0.50)
      even_share       = even_dollar_transaction_count / max(transaction_count, 1)
      even_component   = min(1, even_share / 0.40)

      weights = WEIGHTS_SMALL_FORMAT   when Store.store_type IN {CONVENIENCE, SPECIALTY}
                WEIGHTS_FARMERS_MARKET when Store.store_type == FARMERS_MARKET
                WEIGHTS_DEFAULT        otherwise

      anomaly_score = min(100, round_half_up(weights.excess * excess_component
                                             + weights.large * large_component
                                             + weights.even  * even_component))
        PINNED ORDER: the three components stay exact rationals and a SINGLE round_half_up is
        applied to the weighted sum. Rounding each weighted term first drifts by up to 1 point
        and flips the FLAG_L2/FLAG_L3 boundary.
    notes: "A convenience store with two lanes, 30 shelf feet and $360,000 annual sales has a size expectation of $12,500 per period, so $43,750 of redemptions is 3.5x expectation."

  - name: store_redemption_flag_level
    algorithm_type: threshold
    inputs: [RedemptionPeriod.anomaly_score, FLAG_THRESHOLDS]
    output_field: "RedemptionPeriod.flag_level / Store.redemption_flag_level"
    constants:
      FLAG_L1_MIN: 25
      FLAG_L2_MIN: 50
      FLAG_L3_MIN: 70
    formula: |
      flag_level = FLAG_L3 when anomaly_score >= 70
                   FLAG_L2 when anomaly_score >= 50
                   FLAG_L1 when anomaly_score >= 25
                   FLAG_L0 otherwise
      Store.redemption_flag_level = flag_level of the CLOSED RedemptionPeriod of that store
      with the highest period_index; ties on period_index break by created_at ASC (the older
      row wins); FLAG_L0 when the store has no CLOSED period.
      Reaching FLAG_L3 at close opens an Investigation automatically.
    notes: "All four bands are inclusive at their lower bound: 69 is FLAG_L2 and 70 is FLAG_L3."

  - name: trafficking_confidence_score
    algorithm_type: decay_function
    inputs: [Investigation.evidence_items, current logical clock, EVIDENCE_BASE_POINTS, DECAY_MULTIPLIERS]
    output_field: "Investigation.trafficking_confidence_score"
    constants:
      EVIDENCE_BASE_POINTS:
        UNDERCOVER_BUY: 40
        INVENTORY_PURCHASE_MISMATCH: 25
        EBT_ONLY_TRANSACTION_PATTERN: 20
        INFORMANT_STATEMENT: 15
        HOUSEHOLD_INTERVIEW: 10
      DECAY_MULTIPLIERS: "age_days <= 180 -> 1.00; 181..365 -> 0.75; 366..730 -> 0.50; > 730 -> 0.00"
      SUBSTANTIATION_MIN_SCORE: 60
    formula: |
      For each evidence item:
        age_days   = floor((current logical clock - observed_at) / 86400 seconds)
        multiplier = 1.00 if age_days <= 180
                     0.75 if 181 <= age_days <= 365
                     0.50 if 366 <= age_days <= 730
                     0.00 if age_days > 730
        weighted   = EVIDENCE_BASE_POINTS[evidence_type] * multiplier

      trafficking_confidence_score = min(100, round_half_up(sum of weighted))
        PINNED ORDER: the weighted contributions stay exact and a single round_half_up is
        applied to the total.

      Concluding TRAFFICKING requires score >= 60 AND at least one UNDERCOVER_BUY or
      INVENTORY_PURCHASE_MISMATCH item whose multiplier is > 0 (a corroborating direct-evidence
      anchor); otherwise ERR_INSUFFICIENT_EVIDENCE (422). Concluding INELIGIBLE_ITEM_SALES
      requires at least one item with multiplier > 0 regardless of score.
    notes: "Evidence older than two years contributes exactly nothing, so a case can hold five items and still score 0."

  - name: disqualification_period_months
    algorithm_type: threshold
    inputs: [SanctionCase.violation_type, SanctionCase.prior_final_sanction_count]
    output_field: "SanctionCase.disqualification_months / SanctionCase.sanction_type validity"
    constants:
      HARDSHIP_MONTHS_BY_PRIOR: { 0: 3, 1: 6, default: 12 }
      STOCK_FAILURE_MONTHS_BY_PRIOR: { 0: 0, default: 6 }
      TRAFFICKING_ALLOWED_SANCTIONS: [PERMANENT_DISQUALIFICATION, CMP_IN_LIEU]
      HARDSHIP_ALLOWED_SANCTIONS: [TEMPORARY_DISQUALIFICATION, CMP_IN_LIEU]
      STOCK_FAILURE_ALLOWED_SANCTIONS: [WARNING, TEMPORARY_DISQUALIFICATION]
    formula: |
      prior_final_sanction_count = count of OTHER SanctionCase rows with
        status IN {SANCTION_FINAL, ENFORCED} and
        sanction_type IN {PERMANENT_DISQUALIFICATION, TEMPORARY_DISQUALIFICATION} whose
        store_id == this store OR whose store belongs to the same Owner (repeat violations
        follow the owner across locations).

      violation_type == TRAFFICKING:
        sanction_type must be PERMANENT_DISQUALIFICATION or CMP_IN_LIEU
        disqualification_months = null for PERMANENT_DISQUALIFICATION
      violation_type == INELIGIBLE_ITEMS_HARDSHIP:
        sanction_type must be TEMPORARY_DISQUALIFICATION or CMP_IN_LIEU
        disqualification_months = 3 when prior == 0, 6 when prior == 1, else 12
      violation_type == STOCK_FAILURE:
        sanction_type must be WARNING or TEMPORARY_DISQUALIFICATION
        disqualification_months = 0 (WARNING) when prior == 0, else 6

      A sanction_type outside the allowed set for the violation_type raises
      ERR_SANCTION_TYPE_NOT_ALLOWED (422).
    notes: "Because the prior count sweeps the whole owner, a second store's history lengthens the first store's sanction."

  - name: civil_money_penalty_amount
    algorithm_type: chronological
    inputs: [closed RedemptionPeriod rows of the store, SanctionCase.charge_letter_sent_at, Store.authorized_at, SanctionCase.disqualification_months, SanctionCase.violation_type]
    output_field: "SanctionCase.cmp_basis_variant / cmp_basis_period_ids / avg_monthly_redemption_cents / monthly_penalty_cents / cmp_amount_cents / cmp_capped"
    constants:
      CMP_RATE_BPS: 1000
      CMP_CAP_CENTS: 6900000
      TRAFFICKING_CMP_MONTHS: 10
      SEASONING_DAYS: 365
      TRAILING_PERIOD_COUNT: 12
      PEAK_PERIOD_COUNT: 3
    formula: |
      Eligible basis pool = RedemptionPeriod rows of the store with status == CLOSED and
      period_end <= charge_letter_sent_at. An empty pool raises
      ERR_NO_REDEMPTION_HISTORY (422).

      cmp_month_multiplier = TRAFFICKING_CMP_MONTHS (10) when violation_type == TRAFFICKING,
                             otherwise disqualification_months from
                             calculations.disqualification_period_months

      basis_days = (charge_letter_sent_at - Store.authorized_at) in whole days

      avg_monthly_redemption_cents = round_half_up(sum(basis redemption_total_cents)
                                                   / count(basis))
      monthly_penalty_cents        = round_half_up(avg_monthly_redemption_cents
                                                   * CMP_RATE_BPS / 10000)
      cmp_amount_cents             = min(monthly_penalty_cents * cmp_month_multiplier,
                                        CMP_CAP_CENTS)
      cmp_capped                   = monthly_penalty_cents * cmp_month_multiplier
                                     > CMP_CAP_CENTS

      PINNED ORDER: the 10% monthly penalty is rounded to whole cents BEFORE the multiplication
      by the month count. Multiplying the unrounded average by the rate and the months and
      rounding once at the end differs by up to (months - 1) cents.
    variants:
      - name: TRAILING_12_PERIOD_AVERAGE
        applies_when: "basis_days >= SEASONING_DAYS (365) — a store with a full year of authorized history"
        formula: |
          basis = the most recent min(count(pool), 12) periods of the pool ordered by
                  period_index DESC
      - name: PEAK_3_PERIOD_AVERAGE
        applies_when: "basis_days < SEASONING_DAYS (365) — a newly authorized store whose short history is annualized from its busiest periods"
        formula: |
          basis = the min(count(pool), 3) periods with the highest redemption_total_cents;
                  ties break by higher period_index, then by created_at ASC
    notes: "The two variants read the same closed periods and produce different averages whenever the store's redemptions are uneven; the variant is chosen by how long the store has been authorized at the moment the charge letter issues."

  - name: cmp_in_lieu_eligibility
    algorithm_type: threshold
    inputs: [Store.hardship_designated, CmpElection.elected_at, SanctionCase.cmp_election_due_at, Owner prior trafficking sanctions]
    output_field: "CmpElection.status / SanctionCase.sanction_type validity"
    constants:
      CMP_ELECTION_WINDOW_DAYS: 10
    formula: |
      A determination of CMP_IN_LIEU is permitted only when ALL of the following hold,
      otherwise ERR_CMP_NOT_AVAILABLE (409):
        1. Store.hardship_designated == true
        2. an ELECTED CmpElection exists for the case whose elected_at < cmp_election_due_at
           (charge_letter_sent_at + 10 days)
        3. the Owner has no SanctionCase with status IN {SANCTION_FINAL, ENFORCED} whose
           violation_type == TRAFFICKING on any of its stores
      Filing the election itself after cmp_election_due_at raises
      ERR_CMP_ELECTION_WINDOW_CLOSED (409).
    notes: "Condition 3 is evaluated over the owner, so a repeat trafficker cannot buy out of a second permanent disqualification."

  - name: penalty_ledger_balance
    algorithm_type: aggregation
    inputs: [PenaltyLedgerEntry.amount_cents]
    output_field: "PenaltyLedgerEntry.balance_after_cents / SanctionCase.cmp_outstanding_cents / Owner.cmp_outstanding_cents"
    constants: {}
    formula: |
      INVARIANT (money conservation):
        SanctionCase.cmp_outstanding_cents == sum(PenaltyLedgerEntry.amount_cents) over the
                                              case's entries
        Owner.cmp_outstanding_cents        == sum of cmp_outstanding_cents over every
                                              SanctionCase attached to a Store of that Owner
        PenaltyLedgerEntry.balance_after_cents == running sum ordered by created_at ASC
      Entry signs: CMP_ASSESSED positive, CMP_PAYMENT negative, CMP_ABATEMENT negative.
      A CMP_PAYMENT whose absolute value exceeds the outstanding balance raises
      ERR_CMP_OVERPAYMENT (422) — the balance may never go negative.
      Compensating pair: determination(CMP_IN_LIEU) writes CMP_ASSESSED +X, and
      administrative-review-decision(REVERSED) writes CMP_ABATEMENT -X, restoring the balance
      to exactly 0 with both entries preserved.
    notes: "PenaltyLedgerEntry is append-only (common_fields: false) — corrections are new compensating rows, never edits."

  - name: depot_unit_ledger
    algorithm_type: aggregation
    inputs: [EbtTerminal.status rows of the depot, EquipmentDepot.total_units_owned]
    output_field: "EquipmentDepot.units_in_stock / units_reserved / units_deployed / units_pending_return / units_retired"
    constants: {}
    formula: |
      INVARIANT (physical unit conservation), for every depot at every instant:
        units_in_stock + units_reserved + units_deployed + units_pending_return
        + units_retired == total_units_owned
      Each counter is the count of the depot's EbtTerminal rows in the matching status, and
      units_in_stock is the residual. Reserving, activating, recalling, returning and releasing
      move exactly one unit between two counters and never change the sum.
      Compensating pair: reserve -> activate -> return restores units_in_stock to its original
      value with units_reserved, units_deployed and units_pending_return all back to 0.
    notes: "Terminal provisioning cannot manufacture or lose hardware; a deployment that is released before activation returns the unit to stock, not to pending-return."

  - name: inspector_committed_minutes
    algorithm_type: aggregation
    inputs: [StoreVisit.window_start, StoreVisit.window_end, StoreVisit.status, Inspector.max_daily_minutes]
    output_field: "Inspector.committed_minutes / StoreVisit.window_minutes"
    constants:
      TRAVEL_BUFFER_MINUTES: 60
    formula: |
      window_minutes    = floor((window_end - window_start) / 60 seconds)
      committed_minutes = sum(window_minutes) over StoreVisit rows of the inspector with
                          status IN {SCHEDULED, IN_PROGRESS}
      INVARIANT (time-capacity conservation): scheduling a visit raises committed_minutes by
      exactly window_minutes, and cancelling it, submitting findings or recording no-access
      lowers it by exactly the same amount, so a schedule-then-cancel round trip restores the
      prior value exactly.
      Daily cap: the sum of window_minutes over the inspector's SCHEDULED/IN_PROGRESS visits
      whose window_start falls on the same UTC calendar date as the new visit, plus the new
      visit's window_minutes, must be <= Inspector.max_daily_minutes, else
      ERR_INSPECTOR_DAILY_LIMIT_EXCEEDED (409).
    notes: "FINDINGS_SUBMITTED, NO_ACCESS and CANCELLED visits are excluded from committed_minutes but still count as history for the reverification segregation-of-duties rule."

  - name: equipment_order_totals
    algorithm_type: tiered_pricing
    inputs: [EquipmentOrder.lines, Store.authorization_status, Store.annual_gross_sales_cents]
    output_field: "EquipmentOrder.subtotal_cents / subsidy_cents / net_equipment_cents / handling_fee_cents / total_due_cents"
    constants:
      UNIT_PRICE_CENTS:
        EBT_ONLY_WIRELESS_TERMINAL: 42500
        EBT_ONLY_DIAL_TERMINAL: 31000
        COMMERCIAL_POS_INTEGRATION: 185000
        MANUAL_VOUCHER_KIT: 4500
        SIGNAGE_PACK: 2200
        RECEIPT_PAPER_CASE: 4000
      SUBSIDIZED_ITEM_CODES: [EBT_ONLY_WIRELESS_TERMINAL, EBT_ONLY_DIAL_TERMINAL, MANUAL_VOUCHER_KIT, SIGNAGE_PACK]
      SUBSIDY_SALES_CEILING_CENTS: 500000000
      FREE_HANDLING_THRESHOLD_CENTS: 25000
      HANDLING_FEE_CENTS: 1500
    formula: |
      subtotal_cents = sum(UNIT_PRICE_CENTS[item_code] * qty) over the lines

      subsidy_eligible = Store.authorization_status == AUTHORIZED
                         AND Store.annual_gross_sales_cents <= 500000000
      subsidy_cents    = sum(UNIT_PRICE_CENTS[item_code] * qty) over the lines whose item_code
                         is in SUBSIDIZED_ITEM_CODES, when subsidy_eligible, else 0
                         (USDA fully funds EBT-only hardware and signage for small retailers;
                          commercial POS integration and receipt paper are never subsidized)

      net_equipment_cents = subtotal_cents - subsidy_cents

      handling_fee_cents  = 0    when net_equipment_cents == 0
                            0    when net_equipment_cents >= 25000
                            1500 otherwise
      total_due_cents     = net_equipment_cents + handling_fee_cents

      PINNED READING: the free-handling threshold is evaluated against net_equipment_cents —
      post-subsidy and pre-fee — and NEVER against total_due_cents. An order whose net is
      24000 pays the 1500 fee for a total of 25500; reading the threshold off the total would
      waive the fee and return 24000.
    notes: "The apparent circularity (fee depends on a total that includes the fee) is resolved by pinning the threshold to the pre-fee net."

  - name: owner_sanction_rollup
    algorithm_type: aggregation
    inputs: [SanctionCase rows of the owner's stores, PenaltyLedgerEntry balances]
    output_field: "Owner.permanent_disqualification_count / Owner.cmp_outstanding_cents / Owner.sanction_flag / Owner.status"
    constants:
      BARRED_PERMANENT_DQ_COUNT: 2
    formula: |
      permanent_disqualification_count = count of SanctionCase rows across all of the owner's
        stores with status IN {SANCTION_FINAL, ENFORCED} and
        sanction_type == PERMANENT_DISQUALIFICATION
      cmp_outstanding_cents = sum of SanctionCase.cmp_outstanding_cents across those stores
      sanction_flag = PERMANENTLY_DISQUALIFIED when permanent_disqualification_count >= 1
                      HAS_ACTIVE_CMP_DEBT      when cmp_outstanding_cents > 0
                      CLEAR                    otherwise
      status        = BARRED when permanent_disqualification_count >= 2, else ACTIVE
    notes: "sanction_flag is ordered: a permanently disqualified owner reports PERMANENTLY_DISQUALIFIED even while it still owes a CMP balance."

  - name: interval_overlap_rules
    algorithm_type: interval_merge
    inputs: [StoreVisit windows, TerminalDeployment windows, RedemptionPeriod windows, Store.max_terminal_slots]
    output_field: "conflict detection for POST /store-visits, POST /terminal-deployments and POST /redemption-periods"
    constants:
      TRAVEL_BUFFER_MINUTES: 60
    formula: |
      Three interval families with DELIBERATELY DIFFERENT endpoint semantics:

      (1) Inspector visit windows — HALF-OPEN [window_start, window_end) with a 60-minute
          travel buffer added to BOTH ends of each existing window. A new visit V conflicts
          with an existing visit E of the same inspector (status IN {SCHEDULED, IN_PROGRESS})
          iff  V.window_start < E.window_end + 60min
           AND E.window_start - 60min < V.window_end
          -> ERR_INSPECTOR_WINDOW_CONFLICT (409).
          Boundary: existing 09:00-11:00, new 12:00-13:00 is ACCEPTED (12:00 is not < 12:00);
          new 11:59-12:59 is REJECTED.

      (2) Terminal deployment windows — CLOSED [deploy_start, deploy_end] on BOTH ends, so
          touching endpoints DO collide. A new deployment D conflicts with an existing
          deployment E of the same terminal (status IN {RESERVED, ACTIVE, RECALL_PENDING})
          iff  D.deploy_start <= E.deploy_end AND E.deploy_start <= D.deploy_end
          -> ERR_TERMINAL_ALREADY_COMMITTED (409).
          Boundary: existing ending 2026-09-30, new starting 2026-09-30 is REJECTED; new
          starting 2026-10-01 is ACCEPTED.

      (3) Store terminal slots — AGGREGATE capacity, not pairwise. For the new deployment's
          window, the maximum number of the store's deployments (status IN {RESERVED, ACTIVE,
          RECALL_PENDING}) whose CLOSED windows overlap any single instant, plus 1, must be
          <= Store.max_terminal_slots; equality is allowed
          -> ERR_STORE_TERMINAL_SLOTS_EXCEEDED (409).

      (4) Redemption periods — HALF-OPEN [period_start, period_end) per store, non-overlapping:
          a new period P conflicts iff P.period_start < E.period_end
                                   AND E.period_start < P.period_end
          -> ERR_REDEMPTION_PERIOD_OVERLAP (409). Abutting periods (one ending exactly where
          the next begins) are ACCEPTED, which is how consecutive monitoring periods are built.
    notes: "Two resources in the same scaffold use opposite endpoint conventions on purpose: a visit that starts the instant another ends is fine, a terminal commitment that starts the day another ends is not."

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending priority; the FIRST violated
# rule decides the response, so a request that breaks several rules always returns
# the lowest-numbered rule's error.
# =============================================================================
validations:

  - priority: 1
    category: auth
    rule: "Every endpoint except POST /owners requires the X-User-ID and X-User-Role headers"
    error_id: ERR_MISSING_USER_CONTEXT
    status: 400
    applies_to: "all endpoints except POST /owners"

  - priority: 2
    category: rbac
    rule: "The X-User-Role value must appear in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    status: 403
    applies_to: "all role-guarded endpoints"

  - priority: 3
    category: existence_path
    rule: "Every id in the path must resolve to an existing row, checked left to right"
    error_id: "ERR_OWNER_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_STORE_VISIT_NOT_FOUND | ERR_POS_TRANSACTION_NOT_FOUND | ERR_REDEMPTION_PERIOD_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND | ERR_SANCTION_CASE_NOT_FOUND | ERR_DEPOT_NOT_FOUND | ERR_TERMINAL_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_EQUIPMENT_ORDER_NOT_FOUND"
    status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence_body
    rule: "Every FK supplied in the request body must resolve to an existing row, checked in the field order declared by the endpoint"
    error_id: "ERR_OWNER_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_TERMINAL_NOT_FOUND | ERR_DEPOT_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_REDEMPTION_PERIOD_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND"
    status: 404
    applies_to: "POST /stores, POST /applications, POST /store-visits, POST /pos-transactions, POST /redemption-periods, POST /investigations, POST /sanction-cases, POST /ebt-terminals, POST /terminal-deployments, POST /equipment-orders"

  - priority: 5
    category: ownership
    rule: "A RetailerOwner acting on a store-scoped resource must be the X-User-ID matching Store.owner_id's Owner row; a StoreClerk must be scoped to the transacting store; an Inspector must be the visit's assigned inspector_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    status: 403
    applies_to: "POST /sanction-cases/{caseId}/reply, POST /sanction-cases/{caseId}/cmp-elections, POST /sanction-cases/{caseId}/administrative-review, POST /sanction-cases/{caseId}/cmp-payments, POST /pos-transactions, POST /store-visits/{visitId}/start, POST /store-visits/{visitId}/findings, POST /store-visits/{visitId}/no-access, POST /equipment-orders"

  - priority: 6
    category: segregation_of_duties
    rule: "SOD-1: the AdminReviewOfficer deciding a review must not be the user who issued the charge letter or the determination. SOD-2: the inspector submitting findings on a REVERIFICATION visit must not be the inspector who submitted findings on that store's PRE_AUTHORIZATION visit. SOD-3: the analyst concluding an investigation must not be the user who opened it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    applies_to: "POST /sanction-cases/{caseId}/administrative-review-decision, POST /store-visits/{visitId}/findings, POST /investigations/{investigationId}/conclude"

  - priority: 7
    category: schema
    rule: "Required fields present, types correct, enum values in range, numeric bounds honoured, window_end > window_start, deploy_end >= deploy_start, period_end > period_start, arrays non-empty where required"
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: "all write endpoints"

  - priority: 8
    category: concurrency
    rule: "The supplied expected_<parent>_version must equal the parent's current version"
    error_id: "ERR_STALE_STORE_VERSION | ERR_STALE_SANCTION_CASE_VERSION"
    status: 412
    applies_to: "POST /applications, PATCH /stores/{storeId}, POST /sanction-cases/{caseId}/cmp-elections"

  - priority: 9
    category: state
    rule: "The target entity must be in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_STATE | ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE"
    status: 409
    applies_to: "all action endpoints"

  - priority: 10
    category: business_safety
    rule: "A SNAP redemption or equipment order requires Store.authorization_status == AUTHORIZED. Only the authorization dimension gates trading: a store whose sanction_status is CHARGED, UNDER_ADMIN_REVIEW or SANCTION_FINAL under a CMP_IN_LIEU determination keeps redeeming."
    error_id: ERR_STORE_NOT_AUTHORIZED
    status: 403
    applies_to: "POST /pos-transactions, POST /terminal-deployments/{deploymentId}/activate, POST /equipment-orders/{orderId}/place"

  - priority: 11
    category: business_safety
    rule: "An Owner with a permanent disqualification may not be approved for a new authorization, and an Owner with two or more may not file at all"
    error_id: "ERR_OWNER_PERMANENTLY_DISQUALIFIED | ERR_OWNER_BARRED"
    status: 403
    applies_to: "POST /applications/{applicationId}/submit, POST /applications/{applicationId}/decision"

  - priority: 12
    category: business_temporal
    rule: "Deadline gates against the logical clock: replies before reply_due_at, review requests before admin_review_due_at, CMP elections before cmp_election_due_at, determinations only after the reply window closes, enforcement only at or after effective_date, visit starts only at or after window_start, period close only at or after period_end"
    error_id: "ERR_REPLY_WINDOW_CLOSED | ERR_REPLY_WINDOW_OPEN | ERR_ADMIN_REVIEW_WINDOW_CLOSED | ERR_CMP_ELECTION_WINDOW_CLOSED | ERR_ENFORCEMENT_NOT_DUE | ERR_VISIT_WINDOW_NOT_OPEN | ERR_PERIOD_NOT_ELAPSED"
    status: 409
    applies_to: "POST /sanction-cases/{caseId}/reply, POST /sanction-cases/{caseId}/determination, POST /sanction-cases/{caseId}/administrative-review, POST /sanction-cases/{caseId}/cmp-elections, POST /sanction-cases/{caseId}/enforce, POST /store-visits/{visitId}/start, POST /redemption-periods/{periodId}/close"

  - priority: 13
    category: overlap
    rule: "Interval conflicts per calculations.interval_overlap_rules: inspector windows are half-open with a 60-minute travel buffer, terminal deployments are closed on both ends, redemption periods are half-open per store"
    error_id: "ERR_INSPECTOR_WINDOW_CONFLICT | ERR_TERMINAL_ALREADY_COMMITTED | ERR_REDEMPTION_PERIOD_OVERLAP"
    status: 409
    applies_to: "POST /store-visits, POST /terminal-deployments, POST /redemption-periods"

  - priority: 14
    category: uniqueness
    rule: "EbtTerminal.serial_number is unique across non-RETIRED terminals; RedemptionPeriod.period_index is unique per store; a store may hold at most one Application in a non-terminal status"
    error_id: "ERR_DUPLICATE_TERMINAL_SERIAL | ERR_DUPLICATE_PERIOD_INDEX | ERR_APPLICATION_ALREADY_OPEN"
    status: 409
    applies_to: "POST /ebt-terminals, POST /redemption-periods, POST /applications"

  - priority: 15
    category: capacity
    rule: "Aggregate ceilings: concurrent terminal deployments per store against Store.max_terminal_slots, committed visit minutes per inspector per UTC day against Inspector.max_daily_minutes, and depot units against total_units_owned"
    error_id: "ERR_STORE_TERMINAL_SLOTS_EXCEEDED | ERR_INSPECTOR_DAILY_LIMIT_EXCEEDED | ERR_DEPOT_STOCK_EXHAUSTED"
    status: 409
    applies_to: "POST /terminal-deployments, POST /store-visits"

  - priority: 16
    category: eligibility
    rule: "Staple-stock and sales eligibility: Criterion A desk qualification at submit, Criterion B strict 50.00% share at submit, depth-of-stock floor at findings"
    error_id: "ERR_STAPLE_STOCK_INSUFFICIENT | ERR_CRITERION_B_NOT_MET | ERR_DEPTH_OF_STOCK_INSUFFICIENT"
    status: 422
    applies_to: "POST /applications/{applicationId}/submit, POST /applications/{applicationId}/decision"

  - priority: 17
    category: evidence
    rule: "Concluding an investigation as TRAFFICKING needs a decayed score of at least 60 plus a live direct-evidence anchor; INELIGIBLE_ITEM_SALES needs at least one live evidence item; a sanction case may only be opened from a SUBSTANTIATED investigation whose trigger period actually reached FLAG_L3"
    error_id: "ERR_INSUFFICIENT_EVIDENCE | ERR_TRIGGER_PERIOD_NOT_FLAGGED"
    status: 422
    applies_to: "POST /investigations, POST /investigations/{investigationId}/conclude, POST /sanction-cases"

  - priority: 18
    category: business_fiscal
    rule: "CMP gates: hardship designation plus a timely election plus no owner-level trafficking history; payments may not exceed the outstanding balance; a CMP cannot be computed without closed redemption history"
    error_id: "ERR_CMP_NOT_AVAILABLE | ERR_CMP_OVERPAYMENT | ERR_NO_REDEMPTION_HISTORY"
    status: "409 for ERR_CMP_NOT_AVAILABLE, 422 for ERR_CMP_OVERPAYMENT and ERR_NO_REDEMPTION_HISTORY"
    applies_to: "POST /sanction-cases/{caseId}/determination, POST /sanction-cases/{caseId}/cmp-payments, POST /sanction-cases/{caseId}/cmp-elections"

  - priority: 19
    category: business_fiscal
    rule: "Point-of-sale tender feasibility: the basket must contain at least one SNAP-eligible line, and the offered other tender must cover the ineligible subtotal plus its tax plus any eligible shortfall"
    error_id: "ERR_NO_ELIGIBLE_ITEMS | ERR_SPLIT_TENDER_SHORTFALL"
    status: 422
    applies_to: "POST /pos-transactions"

  - priority: 20
    category: business_integrity
    rule: "Monitoring-period immutability and ownership-transfer integrity: an AUTHORIZED transaction cannot be voided once its period is CLOSED, a settlement cannot be imported into a CLOSED period, an ownership-change reauthorization cannot be approved while the predecessor owner carries CMP debt, and the successor owner must actually differ"
    error_id: "ERR_REDEMPTION_PERIOD_CLOSED | ERR_TRANSFER_CMP_OUTSTANDING | ERR_OWNERSHIP_UNCHANGED"
    status: "409 for ERR_REDEMPTION_PERIOD_CLOSED and ERR_TRANSFER_CMP_OUTSTANDING, 422 for ERR_OWNERSHIP_UNCHANGED"
    applies_to: "POST /pos-transactions/{transactionId}/void, POST /redemption-periods/{periodId}/settlement-import, POST /applications/{applicationId}/decision"

  - priority: 21
    category: business_integrity
    rule: "A sanction case may be remanded at most once, and a determination may not be re-issued while a review is pending"
    error_id: ERR_REMAND_LIMIT_REACHED
    status: 409
    applies_to: "POST /sanction-cases/{caseId}/administrative-review-decision"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving logical clock -------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock used by every deadline, decay and interval rule. Before any call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [FnsAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock to current_utc for all subsequent requests"

  # --- Owners ---------------------------------------------------------------
  - method: POST
    path: "/owners"
    description: "Registers a firm owner. The only endpoint that does not require the X-User-ID / X-User-Role headers."
    roles: [Anonymous, FnsAdmin]
    code: 201
    input: [legal_name, ownership_type, tax_id_last4]
    output: Owner
    side_effects:
      - "initialises permanent_disqualification_count to 0, cmp_outstanding_cents to 0, sanction_flag to CLEAR and status to ACTIVE"
  - method: GET
    path: "/owners/{ownerId}"
    description: "Reads one owner with its sanction rollup."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: []
    output: Owner
    side_effects: []
  - method: GET
    path: "/owners"
    description: "Lists owners, filterable by sanction flag and status."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer]
    code: 200
    input: ["sanction_flag?", "status?", "limit?", "offset?"]
    output: Owner[]
    side_effects: []

  # --- Stores ---------------------------------------------------------------
  - method: POST
    path: "/stores"
    description: "Registers a retail location under an owner. predecessor_store_id is supplied only when this record succeeds an existing store after an ownership change."
    roles: [FnsAdmin, RetailerOwner]
    code: 201
    input: [owner_id, store_name, state_code, store_type, checkout_lane_count, staple_shelf_linear_feet, annual_gross_sales_cents, annual_staple_sales_cents, max_terminal_slots, "tax_rate_bps?", "hardship_designated?", "predecessor_store_id?"]
    output: Store
    side_effects:
      - "computes staple_sales_bps and criterion_b_pass"
      - "sets authorization_status NOT_AUTHORIZED, sanction_status NONE, redemption_flag_level FLAG_L0, active_terminal_count 0"
  - method: GET
    path: "/stores/{storeId}"
    description: "Reads one store including both state dimensions and the derived flag level."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner, StoreClerk, Inspector]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/stores"
    description: "Lists stores; owner_id resolves Owner -> Store and predecessor_store_id resolves the ownership-succession chain."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: ["owner_id?", "predecessor_store_id?", "authorization_status?", "sanction_status?", "state_code?", "store_type?", "redemption_flag_level?", "limit?", "offset?"]
    output: Store[]
    side_effects: []
  - method: PATCH
    path: "/stores/{storeId}"
    description: "Edits the store's eligibility profile. Requires the version the caller last observed."
    roles: [FnsAdmin, RetailerOwner]
    code: 200
    input: [expected_store_version, "store_name?", "checkout_lane_count?", "staple_shelf_linear_feet?", "annual_gross_sales_cents?", "annual_staple_sales_cents?", "max_terminal_slots?", "tax_rate_bps?", "hardship_designated?"]
    output: Store
    side_effects:
      - "recomputes staple_sales_bps and criterion_b_pass"
      - "increments Store.version by 1"
  - method: POST
    path: "/stores/{storeId}/withdraw"
    description: "Voluntary withdrawal from the SNAP retailer program."
    roles: [FnsAdmin, RetailerOwner]
    code: 200
    input: []
    output: Store
    side_effects:
      - "sets authorization_status to WITHDRAWN"
      - "transitions every ACTIVE or RESERVED TerminalDeployment of the store to RELEASED, moving each terminal to IN_STOCK and recomputing the depot counters"
      - "increments Store.version by 1"

  # --- Applications ---------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "Files an application against the store profile the caller last observed. Requires expected_store_version because the eligibility snapshot is part of the filing."
    roles: [FnsAdmin, RetailerOwner]
    code: 201
    input: [store_id, expected_store_version, application_type, claimed_criterion, reported_inventory_lines, "reported_staple_sales_pct?"]
    output: Application
    side_effects:
      - "computes desk_qualifying_categories, desk_perishable_categories and desk_criterion_pass with the DESK_VARIETY_FIRST variant"
      - "sets status DRAFT and deficiency_cycle_count 0"
      - "increments Store.version by 1"
  - method: GET
    path: "/applications/{applicationId}"
    description: "Reads one application with its desk and verified staple figures."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner, Inspector]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "Lists applications; store_id resolves Store -> Application."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: ["store_id?", "status?", "application_type?", "claimed_criterion?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{applicationId}/submit"
    description: "Submits the application for eligibility screening; runs the desk staple assessment or the strict Criterion B share test."
    roles: [FnsAdmin, RetailerOwner]
    code: 200
    input: []
    output: Application
    side_effects:
      - "sets submitted_at and status SUBMITTED"
      - "recomputes the DESK_VARIETY_FIRST staple figures"
      - "clears hold_reason_code"
  - method: POST
    path: "/applications/{applicationId}/documents"
    description: "Supplies corrected staple inventory after a deficiency, returning the application to SUBMITTED."
    roles: [FnsAdmin, RetailerOwner]
    code: 200
    input: [reported_inventory_lines, "reported_staple_sales_pct?"]
    output: Application
    side_effects:
      - "replaces reported_inventory_lines and recomputes the desk figures"
      - "sets status SUBMITTED and submitted_at, clears hold_reason_code"
  - method: POST
    path: "/applications/{applicationId}/decision"
    description: "Records the authorization decision. APPROVED mints the FNS number and authorizes the store; ownership-change reauthorizations are blocked while the predecessor owner owes a CMP."
    roles: [FnsAdmin]
    code: 200
    input: [outcome, "reason_code?"]
    output: Application
    side_effects:
      - "sets decided_at, decision_reason_code and status APPROVED or DENIED"
      - "on APPROVED mints Store.fns_number from the FNS-1000001 sequence when absent, sets Store.authorization_status AUTHORIZED and Store.authorized_at, and increments Store.version by 1"
      - "on DENIED transitions every RESERVED TerminalDeployment of the store to RELEASED"
  - method: POST
    path: "/applications/{applicationId}/withdraw"
    description: "Withdraws a pending application and cancels its scheduled visits."
    roles: [FnsAdmin, RetailerOwner]
    code: 200
    input: []
    output: Application
    side_effects:
      - "sets status WITHDRAWN and decision_reason_code WITHDRAWN_BY_APPLICANT"
      - "cancels every SCHEDULED StoreVisit of the application, lowering Inspector.committed_minutes"

  # --- Inspectors -----------------------------------------------------------
  - method: POST
    path: "/inspectors"
    description: "Registers an FNS field inspector with a daily minute ceiling."
    roles: [FnsAdmin]
    code: 201
    input: [full_name, state_code, max_daily_minutes, "status?"]
    output: Inspector
    side_effects:
      - "sets committed_minutes to 0"
  - method: GET
    path: "/inspectors/{inspectorId}"
    description: "Reads one inspector including committed_minutes."
    roles: [FnsAdmin, FnsAnalyst, Inspector]
    code: 200
    input: []
    output: Inspector
    side_effects: []
  - method: GET
    path: "/inspectors"
    description: "Lists inspectors."
    roles: [FnsAdmin, FnsAnalyst]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []
  - method: PATCH
    path: "/inspectors/{inspectorId}"
    description: "Adjusts an inspector's availability or daily ceiling."
    roles: [FnsAdmin]
    code: 200
    input: ["status?", "max_daily_minutes?"]
    output: Inspector
    side_effects:
      - "increments Inspector.version by 1"

  # --- Store visits ---------------------------------------------------------
  - method: POST
    path: "/store-visits"
    description: "Schedules a field visit. Windows are half-open with a 60-minute travel buffer on both ends of every existing window of the same inspector."
    roles: [FnsAdmin, FnsAnalyst]
    code: 201
    input: [application_id, inspector_id, visit_type, window_start, window_end]
    output: StoreVisit
    side_effects:
      - "computes window_minutes and raises Inspector.committed_minutes by that amount"
      - "sets status SCHEDULED"
      - "advances a SUBMITTED Application to PENDING_VISIT"
  - method: GET
    path: "/store-visits/{visitId}"
    description: "Reads one visit with its verified staple and depth-of-stock findings."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner, Inspector]
    code: 200
    input: []
    output: StoreVisit
    side_effects: []
  - method: GET
    path: "/store-visits"
    description: "Lists visits; application_id resolves Application -> StoreVisit and inspector_id resolves Inspector -> StoreVisit."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, Inspector]
    code: 200
    input: ["application_id?", "inspector_id?", "status?", "visit_type?", "limit?", "offset?"]
    output: StoreVisit[]
    side_effects: []
  - method: POST
    path: "/store-visits/{visitId}/start"
    description: "Marks the inspector on site; permitted only at or after window_start and only for an ACTIVE inspector."
    roles: [Inspector, FnsAdmin]
    code: 200
    input: []
    output: StoreVisit
    side_effects:
      - "sets status IN_PROGRESS"
  - method: POST
    path: "/store-visits/{visitId}/findings"
    description: "Records observed staple stock and shelf feet, running the ONSITE_DEPTH_FIRST variant and the depth-of-stock floor."
    roles: [Inspector, FnsAdmin]
    code: 200
    input: [observed_inventory_lines, observed_staple_shelf_linear_feet]
    output: StoreVisit
    side_effects:
      - "computes verified_qualifying_categories, verified_perishable_categories, verified_criterion_a_pass, depth_of_stock_pass, shelf_discrepancy_bps and shelf_discrepancy_flag"
      - "sets findings_submitted_at and status FINDINGS_SUBMITTED"
      - "lowers Inspector.committed_minutes by window_minutes"
      - "advances the Application to UNDER_REVIEW on success, or to PENDING_DOCUMENTS / DENIED per the deficiency-cycle rule"
  - method: POST
    path: "/store-visits/{visitId}/no-access"
    description: "Records that the inspector could not gain access, consuming a deficiency cycle."
    roles: [Inspector, FnsAdmin]
    code: 200
    input: ["note?"]
    output: StoreVisit
    side_effects:
      - "sets status NO_ACCESS"
      - "lowers Inspector.committed_minutes by window_minutes"
      - "advances the Application to PENDING_DOCUMENTS with hold_reason_code NO_ACCESS, or to DENIED when the cycles are exhausted"
  - method: POST
    path: "/store-visits/{visitId}/cancel"
    description: "Cancels a scheduled visit and returns the inspector's committed minutes."
    roles: [FnsAdmin, FnsAnalyst]
    code: 200
    input: ["note?"]
    output: StoreVisit
    side_effects:
      - "sets status CANCELLED"
      - "lowers Inspector.committed_minutes by window_minutes"

  # --- Point of sale --------------------------------------------------------
  - method: POST
    path: "/pos-transactions"
    description: "Rings up a basket at an EBT terminal, flagging ineligible lines and settling the split tender. Requires the store to be AUTHORIZED regardless of any open sanction proceeding."
    roles: [StoreClerk, FnsAdmin]
    code: 201
    input: [store_id, terminal_deployment_id, household_ebt_card_last4, line_items, snap_benefit_available_cents, other_tender_offered_cents]
    output: PosTransaction
    side_effects:
      - "computes eligible_subtotal_cents, ineligible_subtotal_cents, flagged_line_skus, tax_cents, ebt_tender_cents, other_tender_cents and split_tender_applied"
      - "sets status AUTHORIZED, or DECLINED with decline_reason_code when the basket has no eligible line or the offered tender is short"
      - "updates the POS-derived aggregates of the store's OPEN RedemptionPeriod whose half-open window contains created_at"
  - method: GET
    path: "/pos-transactions/{transactionId}"
    description: "Reads one transaction with its eligibility split."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner, StoreClerk]
    code: 200
    input: []
    output: PosTransaction
    side_effects: []
  - method: GET
    path: "/pos-transactions"
    description: "Lists transactions; store_id resolves Store -> PosTransaction and terminal_deployment_id resolves TerminalDeployment -> PosTransaction."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner, StoreClerk]
    code: 200
    input: ["store_id?", "terminal_deployment_id?", "status?", "split_tender_applied?", "limit?", "offset?"]
    output: PosTransaction[]
    side_effects: []
  - method: POST
    path: "/pos-transactions/{transactionId}/void"
    description: "Voids an authorized sale; refused once the covering monitoring period is closed."
    roles: [StoreClerk, FnsAdmin]
    code: 200
    input: [void_reason_code]
    output: PosTransaction
    side_effects:
      - "sets status VOIDED and void_reason_code"
      - "removes the transaction from the covering OPEN RedemptionPeriod's POS-derived aggregates"

  # --- Redemption monitoring ------------------------------------------------
  - method: POST
    path: "/redemption-periods"
    description: "Opens a monitoring period for a store. Windows are half-open per store and period_index is unique per store; abutting periods are allowed."
    roles: [FnsAnalyst, FnsAdmin]
    code: 201
    input: [store_id, period_index, period_start, period_end]
    output: RedemptionPeriod
    side_effects:
      - "sets status OPEN and reconciliation_status NOT_IMPORTED"
      - "computes the POS-derived aggregates from the store's existing AUTHORIZED transactions inside the window"
  - method: GET
    path: "/redemption-periods/{periodId}"
    description: "Reads one monitoring period with its aggregates, reconciliation and anomaly figures."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: []
    output: RedemptionPeriod
    side_effects: []
  - method: GET
    path: "/redemption-periods"
    description: "Lists monitoring periods; store_id resolves Store -> RedemptionPeriod."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: ["store_id?", "status?", "flag_level?", "reconciliation_status?", "limit?", "offset?"]
    output: RedemptionPeriod[]
    side_effects: []
  - method: POST
    path: "/redemption-periods/{periodId}/settlement-import"
    description: "Imports the EBT processor settlement for the period; the processor's figures override the POS-derived ones from this point on."
    roles: [FnsAnalyst, FnsAdmin]
    code: 200
    input: [imported_total_cents, imported_transaction_count, imported_large_transaction_cents, imported_even_dollar_transaction_count]
    output: RedemptionPeriod
    side_effects:
      - "stores the four imported_* fields"
      - "recomputes redemption_total_cents, transaction_count, large_transaction_cents, even_dollar_transaction_count, reconciliation_variance_cents and reconciliation_status"
  - method: POST
    path: "/redemption-periods/{periodId}/close"
    description: "Closes an elapsed period, freezing its aggregates and scoring it for anomalies. Reaching FLAG_L3 opens an investigation automatically."
    roles: [FnsAnalyst, FnsAdmin]
    code: 200
    input: []
    output: RedemptionPeriod
    side_effects:
      - "sets status CLOSED and closed_at"
      - "computes size_expectation_cents, anomaly_score and flag_level"
      - "sets Store.redemption_flag_level from the highest-period_index CLOSED period"
      - "creates an Investigation with opened_reason ANOMALY_FLAG_L3 and trigger_period_id set to this period when flag_level == FLAG_L3, sets Store.sanction_status UNDER_INVESTIGATION, and releases the store's RESERVED deployments"

  # --- Investigations -------------------------------------------------------
  - method: POST
    path: "/investigations"
    description: "Opens a compliance investigation. An ANOMALY_FLAG_L3 investigation requires a trigger period that actually closed at FLAG_L3."
    roles: [FnsAnalyst, FnsAdmin]
    code: 201
    input: [store_id, opened_reason, "trigger_period_id?", "evidence_items?"]
    output: Investigation
    side_effects:
      - "sets status OPEN, opened_by_user_id and trafficking_confidence_score 0"
      - "sets Store.sanction_status UNDER_INVESTIGATION and releases the store's RESERVED deployments"
      - "moves an UNDER_REVIEW Application of the store to PENDING_DOCUMENTS with hold_reason_code INVESTIGATION_HOLD"
  - method: GET
    path: "/investigations/{investigationId}"
    description: "Reads one investigation with its decayed confidence score."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer]
    code: 200
    input: []
    output: Investigation
    side_effects: []
  - method: GET
    path: "/investigations"
    description: "Lists investigations; store_id resolves Store -> Investigation and trigger_period_id resolves RedemptionPeriod -> Investigation."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: ["store_id?", "trigger_period_id?", "status?", "opened_reason?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []
  - method: POST
    path: "/investigations/{investigationId}/evidence"
    description: "Appends an evidence item and rescores the case with the age-decay curve against the current logical clock."
    roles: [FnsAnalyst, FnsAdmin]
    code: 200
    input: [evidence_type, observed_at, "note?"]
    output: Investigation
    side_effects:
      - "appends the item to evidence_items and sets status EVIDENCE_REVIEW"
      - "recomputes trafficking_confidence_score"
  - method: POST
    path: "/investigations/{investigationId}/conclude"
    description: "Concludes the investigation. TRAFFICKING requires a decayed score of at least 60 plus a live direct-evidence anchor, and the concluding analyst must differ from the one who opened the case."
    roles: [FnsAnalyst, FnsAdmin]
    code: 200
    input: [substantiated_violation]
    output: Investigation
    side_effects:
      - "sets status SUBSTANTIATED or UNSUBSTANTIATED, concluded_at and concluded_by_user_id"
      - "returns Store.sanction_status to NONE on UNSUBSTANTIATED when no other investigation of the store is still open"

  # --- Sanction cases -------------------------------------------------------
  - method: POST
    path: "/sanction-cases"
    description: "Opens a sanction case from a substantiated investigation, linking the store's most recent final case as predecessor."
    roles: [FnsAdmin]
    code: 201
    input: [investigation_id, violation_type]
    output: SanctionCase
    side_effects:
      - "copies store_id from the investigation and sets status CHARGE_DRAFT"
      - "sets predecessor_case_id to the store's most recent SANCTION_FINAL or ENFORCED case when one exists"
      - "computes prior_final_sanction_count"
  - method: GET
    path: "/sanction-cases/{caseId}"
    description: "Reads one sanction case with every deadline, CMP figure and review field."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: []
    output: SanctionCase
    side_effects: []
  - method: GET
    path: "/sanction-cases"
    description: "Lists sanction cases; store_id resolves Store -> SanctionCase, investigation_id resolves Investigation -> SanctionCase and predecessor_case_id resolves the repeat-violation chain."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: ["store_id?", "investigation_id?", "predecessor_case_id?", "status?", "sanction_type?", "violation_type?", "limit?", "offset?"]
    output: SanctionCase[]
    side_effects: []
  - method: POST
    path: "/sanction-cases/{caseId}/charge-letter"
    description: "Issues the charge letter, starting the 10-day reply and CMP-election windows."
    roles: [FnsAdmin]
    code: 200
    input: [charge_summary]
    output: SanctionCase
    side_effects:
      - "sets status CHARGE_ISSUED, charge_letter_sent_at, charge_issued_by_user_id, reply_due_at and cmp_election_due_at"
      - "sets Store.sanction_status CHARGED"
      - "increments SanctionCase.version by 1"
  - method: POST
    path: "/sanction-cases/{caseId}/reply"
    description: "Records the retailer's reply to the charge letter; refused after reply_due_at."
    roles: [RetailerOwner, FnsAdmin]
    code: 200
    input: [reply_text]
    output: SanctionCase
    side_effects:
      - "sets status REPLY_RECEIVED, reply_text and reply_received_at"
      - "increments SanctionCase.version by 1"
  - method: POST
    path: "/sanction-cases/{caseId}/cmp-elections"
    description: "Files an election to pay a civil money penalty in lieu of disqualification, quoting the amount from the case's charge date and the store's closed redemption history. Requires the case version the caller last observed."
    roles: [RetailerOwner, FnsAdmin]
    code: 201
    input: [expected_sanction_case_version, "hardship_ownership_change_pending?"]
    output: CmpElection
    side_effects:
      - "sets status ELECTED, elected_at, quoted_amount_cents and quoted_basis_variant"
      - "sets any previously ELECTED election on the case to SUPERSEDED"
      - "increments SanctionCase.version by 1"
  - method: GET
    path: "/sanction-cases/{id}/cmp-elections"
    description: "Lists the CMP elections filed on a case, resolving SanctionCase -> CmpElection."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CmpElection[]
    side_effects: []
  - method: POST
    path: "/sanction-cases/{caseId}/determination"
    description: "Issues the determination, sizing the disqualification or the civil money penalty and starting the 10-day administrative-review window."
    roles: [FnsAdmin]
    code: 200
    input: [sanction_type]
    output: SanctionCase
    side_effects:
      - "sets status DETERMINED, determined_at, determined_by_user_id and admin_review_due_at"
      - "computes prior_final_sanction_count and disqualification_months"
      - "computes cmp_basis_variant, cmp_basis_period_ids, avg_monthly_redemption_cents, monthly_penalty_cents, cmp_amount_cents and cmp_capped for CMP_IN_LIEU"
      - "writes a CMP_ASSESSED PenaltyLedgerEntry for cmp_amount_cents and re-derives cmp_outstanding_cents, Owner.cmp_outstanding_cents and Owner.sanction_flag for CMP_IN_LIEU"
      - "sets the ELECTED CmpElection to APPROVED for CMP_IN_LIEU and to REJECTED otherwise"
      - "increments SanctionCase.version by 1"
  - method: POST
    path: "/sanction-cases/{caseId}/administrative-review"
    description: "Requests administrative review of the determination; refused after admin_review_due_at."
    roles: [RetailerOwner, FnsAdmin]
    code: 200
    input: [grounds_text]
    output: SanctionCase
    side_effects:
      - "sets status ADMIN_REVIEW_REQUESTED, admin_review_requested_at and grounds_text"
      - "sets Store.sanction_status UNDER_ADMIN_REVIEW"
      - "increments SanctionCase.version by 1"
  - method: POST
    path: "/sanction-cases/{caseId}/administrative-review-decision"
    description: "Decides the administrative review. The deciding officer must be neither the user who issued the charge letter nor the user who issued the determination."
    roles: [AdminReviewOfficer]
    code: 200
    input: [outcome, "reason_code?"]
    output: SanctionCase
    side_effects:
      - "records admin_review_outcome, admin_review_decided_by_user_id, admin_review_decided_at and reason_code"
      - "on REVERSED sets status SANCTION_REVERSED, writes a CMP_ABATEMENT PenaltyLedgerEntry driving cmp_outstanding_cents to 0, sets Store.sanction_status SANCTION_REVERSED and restores Store.authorization_status AUTHORIZED when it was SUSPENDED"
      - "on REMANDED sets status REMANDED, increments remand_count, clears sanction_type and every CMP figure, and abates any outstanding balance"
      - "on SUSTAINED leaves the case in ADMIN_REVIEW_REQUESTED, eligible for finalize"
      - "increments SanctionCase.version by 1"
  - method: POST
    path: "/sanction-cases/{caseId}/finalize"
    description: "Makes the sanction final, setting the 30-day effective date for disqualifications and suspending the store."
    roles: [FnsAdmin]
    code: 200
    input: []
    output: SanctionCase
    side_effects:
      - "sets status SANCTION_FINAL, final_decision_at and effective_date"
      - "sets Store.sanction_status SANCTION_FINAL and Store.authorization_status SUSPENDED for disqualification sanctions"
      - "increments SanctionCase.version by 1"
  - method: POST
    path: "/sanction-cases/{caseId}/enforce"
    description: "Enforces a final disqualification on or after the effective date, cascading through the store, its deployments, its terminals, the depot counters and the owner rollup."
    roles: [FnsAdmin]
    code: 200
    input: []
    output: SanctionCase
    side_effects:
      - "sets status ENFORCED and enforced_at"
      - "sets Store.authorization_status DISQUALIFIED and sets permanently_disqualified or disqualified_until"
      - "transitions every ACTIVE TerminalDeployment of the store to RECALL_PENDING with close_reason_code AUTHORIZATION_LOST"
      - "moves every DEPLOYED terminal of those deployments to PENDING_RETURN and recomputes the depot counters"
      - "re-derives Owner.permanent_disqualification_count, Owner.sanction_flag and Owner.status"
      - "increments SanctionCase.version by 1"
  - method: GET
    path: "/sanction-cases/{id}/penalty-ledger"
    description: "Lists the append-only penalty ledger of a case, resolving SanctionCase -> PenaltyLedgerEntry."
    roles: [FnsAdmin, FnsAnalyst, AdminReviewOfficer, RetailerOwner]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: PenaltyLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/sanction-cases/{caseId}/cmp-payments"
    description: "Remits a payment against the outstanding civil money penalty; may never exceed the outstanding balance."
    roles: [RetailerOwner, FnsAdmin]
    code: 201
    input: [amount_cents]
    output: PenaltyLedgerEntry
    side_effects:
      - "appends a CMP_PAYMENT entry of -amount_cents with reason_code RETAILER_REMITTANCE and computes balance_after_cents"
      - "re-derives SanctionCase.cmp_outstanding_cents, Owner.cmp_outstanding_cents and Owner.sanction_flag"
      - "sets the APPROVED CmpElection to PAID when the balance reaches 0"

  # --- Equipment and EBT-only terminals -------------------------------------
  - method: POST
    path: "/equipment-depots"
    description: "Registers a state equipment depot holding a fixed number of EBT terminals."
    roles: [FnsAdmin]
    code: 201
    input: [state_code, total_units_owned]
    output: EquipmentDepot
    side_effects:
      - "sets units_reserved, units_deployed, units_pending_return and units_retired to 0 and units_in_stock to total_units_owned"
  - method: GET
    path: "/equipment-depots/{depotId}"
    description: "Reads one depot with its five unit counters."
    roles: [FnsAdmin, FnsAnalyst]
    code: 200
    input: []
    output: EquipmentDepot
    side_effects: []
  - method: GET
    path: "/equipment-depots"
    description: "Lists depots."
    roles: [FnsAdmin, FnsAnalyst]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: EquipmentDepot[]
    side_effects: []
  - method: POST
    path: "/ebt-terminals"
    description: "Adds an EBT-only or commercial terminal to a depot. Serial numbers are unique across non-retired units."
    roles: [FnsAdmin]
    code: 201
    input: [depot_id, serial_number, model]
    output: EbtTerminal
    side_effects:
      - "sets status IN_STOCK and recomputes the depot counters"
  - method: GET
    path: "/ebt-terminals/{terminalId}"
    description: "Reads one terminal."
    roles: [FnsAdmin, FnsAnalyst, RetailerOwner]
    code: 200
    input: []
    output: EbtTerminal
    side_effects: []
  - method: GET
    path: "/ebt-terminals"
    description: "Lists terminals; depot_id resolves EquipmentDepot -> EbtTerminal."
    roles: [FnsAdmin, FnsAnalyst, RetailerOwner]
    code: 200
    input: ["depot_id?", "status?", "model?", "serial_number?", "limit?", "offset?"]
    output: EbtTerminal[]
    side_effects: []
  - method: POST
    path: "/terminal-deployments"
    description: "Commits a terminal to a store for a closed date interval. Terminal intervals collide on touching endpoints, and the store's concurrent slots are capped."
    roles: [FnsAdmin]
    code: 201
    input: [store_id, terminal_id, deploy_start, deploy_end]
    output: TerminalDeployment
    side_effects:
      - "sets status RESERVED"
      - "moves the terminal from IN_STOCK to RESERVED when this is its first open commitment and recomputes the depot counters; a terminal already RESERVED or DEPLOYED keeps its status, so back-to-back non-overlapping bookings of the same unit never double-count it"
  - method: GET
    path: "/terminal-deployments/{deploymentId}"
    description: "Reads one deployment."
    roles: [FnsAdmin, FnsAnalyst, RetailerOwner, StoreClerk]
    code: 200
    input: []
    output: TerminalDeployment
    side_effects: []
  - method: GET
    path: "/terminal-deployments"
    description: "Lists deployments; store_id resolves Store -> TerminalDeployment and terminal_id resolves EbtTerminal -> TerminalDeployment."
    roles: [FnsAdmin, FnsAnalyst, RetailerOwner, StoreClerk]
    code: 200
    input: ["store_id?", "terminal_id?", "status?", "limit?", "offset?"]
    output: TerminalDeployment[]
    side_effects: []
  - method: POST
    path: "/terminal-deployments/{deploymentId}/activate"
    description: "Activates a reserved deployment so the store can transact; requires an AUTHORIZED store."
    roles: [FnsAdmin]
    code: 200
    input: []
    output: TerminalDeployment
    side_effects:
      - "sets status ACTIVE and activated_at"
      - "moves the terminal from RESERVED to DEPLOYED and recomputes the depot counters"
      - "increments Store.active_terminal_count"
  - method: POST
    path: "/terminal-deployments/{deploymentId}/recall"
    description: "Recalls an active terminal without waiting for enforcement, e.g. after damage or an investigation freeze."
    roles: [FnsAdmin]
    code: 200
    input: ["close_reason_code?"]
    output: TerminalDeployment
    side_effects:
      - "sets status RECALL_PENDING and close_reason_code"
      - "moves the terminal from DEPLOYED to PENDING_RETURN and recomputes the depot counters"
      - "decrements Store.active_terminal_count"
  - method: POST
    path: "/terminal-deployments/{deploymentId}/return"
    description: "Records physical return of an active or recalled terminal to the depot."
    roles: [FnsAdmin]
    code: 200
    input: ["close_reason_code?"]
    output: TerminalDeployment
    side_effects:
      - "sets status RETURNED and closed_at"
      - "moves the terminal to IN_STOCK when no other open commitment remains and recomputes the depot counters"
      - "decrements Store.active_terminal_count when the deployment was ACTIVE"
  - method: POST
    path: "/terminal-deployments/{deploymentId}/release"
    description: "Releases a reserved deployment that will never be activated, returning the unit to stock."
    roles: [FnsAdmin]
    code: 200
    input: ["close_reason_code?"]
    output: TerminalDeployment
    side_effects:
      - "sets status RELEASED and closed_at"
      - "moves the terminal from RESERVED to IN_STOCK when no other open commitment remains and recomputes the depot counters"
  - method: POST
    path: "/equipment-orders"
    description: "Drafts an equipment order and prices it: EBT-only hardware, voucher kits and signage are subsidized for small authorized retailers, and the handling fee is decided from the post-subsidy net."
    roles: [RetailerOwner, FnsAdmin]
    code: 201
    input: [store_id, lines]
    output: EquipmentOrder
    side_effects:
      - "computes subtotal_cents, subsidy_cents, net_equipment_cents, handling_fee_cents and total_due_cents"
      - "sets status DRAFT"
  - method: GET
    path: "/equipment-orders/{orderId}"
    description: "Reads one equipment order with its pricing breakdown."
    roles: [FnsAdmin, FnsAnalyst, RetailerOwner]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects: []
  - method: GET
    path: "/equipment-orders"
    description: "Lists equipment orders; store_id resolves Store -> EquipmentOrder."
    roles: [FnsAdmin, FnsAnalyst, RetailerOwner]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: EquipmentOrder[]
    side_effects: []
  - method: POST
    path: "/equipment-orders/{orderId}/place"
    description: "Places a drafted order, freezing its pricing; requires an AUTHORIZED store."
    roles: [RetailerOwner, FnsAdmin]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects:
      - "sets status PLACED and placed_at, freezing the five money fields"
  - method: POST
    path: "/equipment-orders/{orderId}/fulfill"
    description: "Marks a placed order shipped."
    roles: [FnsAdmin]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects:
      - "sets status FULFILLED"
  - method: POST
    path: "/equipment-orders/{orderId}/cancel"
    description: "Cancels a drafted or placed order."
    roles: [RetailerOwner, FnsAdmin]
    code: 200
    input: [cancel_reason_code]
    output: EquipmentOrder
    side_effects:
      - "sets status CANCELLED and cancel_reason_code"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth / rbac ---
  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-ID or X-User-Role header absent on any endpoint other than POST /owners"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A RetailerOwner acts on a store it does not own, a StoreClerk rings up a sale for another store, or an Inspector acts on a visit assigned to a different inspector"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The administrative-review officer is the user who issued the charge letter or the determination; a REVERIFICATION visit's findings are submitted by the same inspector who submitted the PRE_AUTHORIZATION findings; or an investigation is concluded by the analyst who opened it"

  # --- not found ---
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "ownerId in the path or owner_id in the body does not resolve"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "storeId in the path or store_id / predecessor_store_id in the body does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "applicationId in the path or application_id in the body does not resolve"
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "inspectorId in the path or inspector_id in the body does not resolve"
  - id: ERR_STORE_VISIT_NOT_FOUND
    http: 404
    condition: "visitId in the path does not resolve"
  - id: ERR_POS_TRANSACTION_NOT_FOUND
    http: 404
    condition: "transactionId in the path does not resolve"
  - id: ERR_REDEMPTION_PERIOD_NOT_FOUND
    http: 404
    condition: "periodId in the path or trigger_period_id in the body does not resolve"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "investigationId in the path or investigation_id in the body does not resolve"
  - id: ERR_SANCTION_CASE_NOT_FOUND
    http: 404
    condition: "caseId in the path does not resolve"
  - id: ERR_DEPOT_NOT_FOUND
    http: 404
    condition: "depotId in the path or depot_id in the body does not resolve"
  - id: ERR_TERMINAL_NOT_FOUND
    http: 404
    condition: "terminalId in the path or terminal_id in the body does not resolve"
  - id: ERR_DEPLOYMENT_NOT_FOUND
    http: 404
    condition: "deploymentId in the path or terminal_deployment_id in the body does not resolve"
  - id: ERR_EQUIPMENT_ORDER_NOT_FOUND
    http: 404
    condition: "orderId in the path does not resolve"

  # --- schema ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is missing, a type is wrong, an enum value is unknown, a numeric bound is broken, window_end <= window_start, deploy_end < deploy_start, period_end <= period_start, or a required array is empty"

  # --- optimistic concurrency ---
  - id: ERR_STALE_STORE_VERSION
    http: 412
    condition: "expected_store_version on POST /applications or PATCH /stores/{storeId} does not equal the store's current version"
  - id: ERR_STALE_SANCTION_CASE_VERSION
    http: 412
    condition: "expected_sanction_case_version on POST /sanction-cases/{caseId}/cmp-elections does not equal the case's current version"

  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The entity's current state has no declared transition for the requested trigger — for example submitting an APPROVED application, starting a FINDINGS_SUBMITTED visit, activating a RETURNED deployment, replying to a CHARGE_DRAFT case, or starting a visit with an INACTIVE inspector"
  - id: ERR_TERMINAL_DEPLOYMENT_NOT_ACTIVE
    http: 409
    condition: "POST /pos-transactions names a terminal deployment whose status is not ACTIVE"
  - id: ERR_INVESTIGATION_NOT_SUBSTANTIATED
    http: 409
    condition: "POST /sanction-cases references an investigation whose status is not SUBSTANTIATED"
  - id: ERR_REMAND_LIMIT_REACHED
    http: 409
    condition: "A second REMANDED review decision is attempted on a case whose remand_count is already 1"

  # --- business safety ---
  - id: ERR_STORE_NOT_AUTHORIZED
    http: 403
    condition: "A redemption, terminal activation or equipment placement is attempted while Store.authorization_status is not AUTHORIZED"
  - id: ERR_OWNER_PERMANENTLY_DISQUALIFIED
    http: 403
    condition: "An application decision of APPROVED is attempted for an owner whose permanent_disqualification_count is 1 or more"
  - id: ERR_OWNER_BARRED
    http: 403
    condition: "An application is submitted for an owner whose status is BARRED (two or more permanent disqualifications)"

  # --- temporal ---
  - id: ERR_REPLY_WINDOW_CLOSED
    http: 409
    condition: "A reply is filed at or after the case's reply_due_at"
  - id: ERR_REPLY_WINDOW_OPEN
    http: 409
    condition: "A determination is issued from CHARGE_ISSUED while the logical clock is still before reply_due_at"
  - id: ERR_ADMIN_REVIEW_WINDOW_CLOSED
    http: 409
    condition: "Administrative review is requested at or after the case's admin_review_due_at"
  - id: ERR_CMP_ELECTION_WINDOW_CLOSED
    http: 409
    condition: "A CMP election is filed at or after the case's cmp_election_due_at"
  - id: ERR_ENFORCEMENT_NOT_DUE
    http: 409
    condition: "Enforcement is attempted while the logical clock is before the case's effective_date"
  - id: ERR_VISIT_WINDOW_NOT_OPEN
    http: 409
    condition: "A visit is started while the logical clock is before its window_start"
  - id: ERR_PERIOD_NOT_ELAPSED
    http: 409
    condition: "A monitoring period is closed while the logical clock is before its period_end"

  # --- overlap ---
  - id: ERR_INSPECTOR_WINDOW_CONFLICT
    http: 409
    condition: "A new visit's half-open window overlaps an existing SCHEDULED or IN_PROGRESS window of the same inspector once a 60-minute travel buffer is added to both ends of the existing window"
  - id: ERR_TERMINAL_ALREADY_COMMITTED
    http: 409
    condition: "A new deployment's closed interval touches or overlaps an existing RESERVED, ACTIVE or RECALL_PENDING interval of the same terminal"
  - id: ERR_REDEMPTION_PERIOD_OVERLAP
    http: 409
    condition: "A new monitoring period's half-open window overlaps an existing period of the same store"

  # --- uniqueness ---
  - id: ERR_DUPLICATE_TERMINAL_SERIAL
    http: 409
    condition: "serial_number already exists on a non-RETIRED terminal"
  - id: ERR_DUPLICATE_PERIOD_INDEX
    http: 409
    condition: "period_index already exists for that store"
  - id: ERR_APPLICATION_ALREADY_OPEN
    http: 409
    condition: "The store already has an application in a non-terminal status"

  # --- capacity ---
  - id: ERR_STORE_TERMINAL_SLOTS_EXCEEDED
    http: 409
    condition: "The new deployment would make the store's peak concurrent committed deployments exceed Store.max_terminal_slots"
  - id: ERR_INSPECTOR_DAILY_LIMIT_EXCEEDED
    http: 409
    condition: "The new visit would push the inspector's committed minutes for that UTC calendar day above max_daily_minutes"
  - id: ERR_DEPOT_STOCK_EXHAUSTED
    http: 409
    condition: "POST /terminal-deployments names a terminal whose status is PENDING_RETURN or RETIRED, so the unit is not available to commit"

  # --- eligibility ---
  - id: ERR_STAPLE_STOCK_INSUFFICIENT
    http: 422
    condition: "A CRITERION_A application is submitted while desk_criterion_pass is false. Findings that fail the on-site variant do NOT raise this error — they return 200 and drive the application into PENDING_DOCUMENTS or DENIED via the deficiency-cycle rule"
  - id: ERR_CRITERION_B_NOT_MET
    http: 422
    condition: "A CRITERION_B application is submitted while Store.staple_sales_bps is 5000 or lower (50.00% exactly does not qualify)"
  - id: ERR_DEPTH_OF_STOCK_INSUFFICIENT
    http: 422
    condition: "An APPROVED decision is attempted while the latest FINDINGS_SUBMITTED visit has depth_of_stock_pass false (observed staple shelf feet below the store_type floor)"

  # --- evidence ---
  - id: ERR_INSUFFICIENT_EVIDENCE
    http: 422
    condition: "TRAFFICKING is concluded with a decayed confidence score below 60 or without a live UNDERCOVER_BUY / INVENTORY_PURCHASE_MISMATCH anchor, or INELIGIBLE_ITEM_SALES is concluded with every evidence item fully decayed"
  - id: ERR_TRIGGER_PERIOD_NOT_FLAGGED
    http: 422
    condition: "An ANOMALY_FLAG_L3 investigation names a trigger period that is not CLOSED at flag_level FLAG_L3, or names a period belonging to a different store"

  # --- fiscal ---
  - id: ERR_CMP_NOT_AVAILABLE
    http: 409
    condition: "A CMP_IN_LIEU determination is issued without hardship designation, without a timely ELECTED election, or for an owner with a prior final trafficking sanction"
  - id: ERR_CMP_OVERPAYMENT
    http: 422
    condition: "A CMP payment exceeds the case's outstanding balance"
  - id: ERR_NO_REDEMPTION_HISTORY
    http: 422
    condition: "A CMP amount is required but the store has no CLOSED monitoring period ending at or before the charge letter date"
  - id: ERR_NO_ELIGIBLE_ITEMS
    http: 422
    condition: "Every line in the basket is SNAP-ineligible, so the eligible subtotal is 0"
  - id: ERR_SPLIT_TENDER_SHORTFALL
    http: 422
    condition: "The offered other tender is below the ineligible subtotal plus its tax plus the eligible shortfall"
  - id: ERR_SANCTION_TYPE_NOT_ALLOWED
    http: 422
    condition: "The determination's sanction_type is not permitted for the case's violation_type, or enforcement is attempted on a WARNING or CMP_IN_LIEU case"

  # --- integrity ---
  - id: ERR_REDEMPTION_PERIOD_CLOSED
    http: 409
    condition: "A void or a settlement import targets a period that is already CLOSED"
  - id: ERR_TRANSFER_CMP_OUTSTANDING
    http: 409
    condition: "An ownership-change reauthorization is approved while the predecessor store's owner still carries cmp_outstanding_cents above 0"
  - id: ERR_OWNERSHIP_UNCHANGED
    http: 422
    condition: "An ownership-change reauthorization names a successor store whose owner_id equals the predecessor store's owner_id"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Anonymous
    description: "An unregistered caller; may only create an Owner record to start the authorization process."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /owners"

  - name: RetailerOwner
    description: "The firm owner of one or more stores. Files applications, elects and pays civil money penalties, requests administrative review, and orders equipment for its own stores only."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /sanction-cases/{caseId}/reply"
      - "POST /sanction-cases/{caseId}/administrative-review"
      - "POST /sanction-cases/{caseId}/cmp-elections"
      - "POST /sanction-cases/{caseId}/cmp-payments"
    shared_operations:
      - "POST /owners"
      - "POST /stores"
      - "PATCH /stores/{storeId}"
      - "POST /stores/{storeId}/withdraw"
      - "POST /applications"
      - "POST /applications/{applicationId}/submit"
      - "POST /applications/{applicationId}/documents"
      - "POST /applications/{applicationId}/withdraw"
      - "POST /equipment-orders"
      - "POST /equipment-orders/{orderId}/place"
      - "POST /equipment-orders/{orderId}/cancel"
      - "GET reads scoped to its own owners, stores, applications, sanction cases, elections, ledger, deployments and orders"

  - name: StoreClerk
    description: "A cashier acting for one authorized store; rings up and voids EBT sales at that store's active terminals."
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /pos-transactions"
      - "POST /pos-transactions/{transactionId}/void"
    shared_operations:
      - "GET /stores/{storeId}"
      - "GET /pos-transactions"
      - "GET /pos-transactions/{transactionId}"
      - "GET /terminal-deployments"
      - "GET /terminal-deployments/{deploymentId}"

  - name: Inspector
    description: "An FNS field inspector; starts assigned visits and records on-site staple and depth-of-stock findings."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /store-visits/{visitId}/start"
      - "POST /store-visits/{visitId}/findings"
      - "POST /store-visits/{visitId}/no-access"
    shared_operations:
      - "GET /store-visits"
      - "GET /store-visits/{visitId}"
      - "GET /applications/{applicationId}"
      - "GET /inspectors/{inspectorId}"
      - "GET /stores/{storeId}"

  - name: FnsAdmin
    description: "The FNS retailer-operations administrator; owns registration, decisions, charge letters, determinations, finalization, enforcement and all equipment provisioning. Holds the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /applications/{applicationId}/decision"
      - "POST /inspectors"
      - "PATCH /inspectors/{inspectorId}"
      - "POST /sanction-cases"
      - "POST /sanction-cases/{caseId}/charge-letter"
      - "POST /sanction-cases/{caseId}/determination"
      - "POST /sanction-cases/{caseId}/finalize"
      - "POST /sanction-cases/{caseId}/enforce"
      - "POST /equipment-depots"
      - "POST /ebt-terminals"
      - "POST /terminal-deployments"
      - "POST /terminal-deployments/{deploymentId}/activate"
      - "POST /terminal-deployments/{deploymentId}/recall"
      - "POST /terminal-deployments/{deploymentId}/return"
      - "POST /terminal-deployments/{deploymentId}/release"
      - "POST /equipment-orders/{orderId}/fulfill"
    shared_operations:
      - "every other write endpoint in §1.5 except POST /sanction-cases/{caseId}/administrative-review-decision"
      - "every GET endpoint in §1.5"

  - name: FnsAnalyst
    description: "The redemption-monitoring analyst; schedules visits, runs monitoring periods and settlement imports, and opens, evidences and concludes investigations. Cannot charge, determine, finalize or enforce."
    identity: "opaque"
    exclusive_operations:
      - "POST /redemption-periods"
      - "POST /redemption-periods/{periodId}/settlement-import"
      - "POST /redemption-periods/{periodId}/close"
      - "POST /investigations/{investigationId}/evidence"
      - "POST /investigations/{investigationId}/conclude"
    shared_operations:
      - "POST /store-visits"
      - "POST /store-visits/{visitId}/cancel"
      - "POST /investigations"
      - "every GET endpoint in §1.5 except the owner-scoped equipment-order reads"

  - name: AdminReviewOfficer
    description: "The independent administrative-review officer; decides review requests and nothing else. Must not be the user who charged or determined the case."
    identity: "opaque"
    exclusive_operations:
      - "POST /sanction-cases/{caseId}/administrative-review-decision"
    shared_operations:
      - "GET /sanction-cases"
      - "GET /sanction-cases/{caseId}"
      - "GET /sanction-cases/{id}/cmp-elections"
      - "GET /sanction-cases/{id}/penalty-ledger"
      - "GET /investigations"
      - "GET /investigations/{investigationId}"
      - "GET /redemption-periods"
      - "GET /redemption-periods/{periodId}"
      - "GET /store-visits"
      - "GET /store-visits/{visitId}"
      - "GET /stores"
      - "GET /stores/{storeId}"
      - "GET /owners"
      - "GET /owners/{ownerId}"
      - "GET /applications"
      - "GET /applications/{applicationId}"
      - "GET /pos-transactions"
      - "GET /pos-transactions/{transactionId}"
