              as_user_id: "${oid}"
              captures: { err2: $.data.error_id }
          assert:
            - "radius 10 -> HTTP 422 ERR_PLACE_CONFIG_INVALID"
            - "radius 9999 -> HTTP 422 ERR_PLACE_CONFIG_INVALID"

      - name: fix_clock_skew_beyond_300s_rejected
        claim_type: ViolationToError
        grounds:
          - validations[priority=11]
          - errors.ERR_FIX_CLOCK_SKEW
        distinguishing_aspect: "LocationFix.recorded_at more than 300 s from the server logical clock is rejected 422."
        test_recipe:
          setup: ["Circle at clock 2026-09-01T00:00:00Z."]
          setup_api_calls:
