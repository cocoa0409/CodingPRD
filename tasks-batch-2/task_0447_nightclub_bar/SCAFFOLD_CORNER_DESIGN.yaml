# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 claims NOT already covered by §1.8.
# section:/claim_type: values come from references/claim-extraction-guide.md.
# Same 7-point contract as §1.8: grounds resolve, setup_api_calls structured,
# placeholder closure, literal lock, OCC = ${var}, asserts as literals.
# `excluded_because:` stubs (no test_recipe) cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - entities.Venue
          - endpoints
        distinguishing_aspect: "POST /nightclub/venues with only required fields returns 201, server-minted id/created_at/version=1, posture OPEN, occupancy_count 0, and applies declared defaults (cover_base_cents 2000, cover_surge_pct 0.5, last_call_offset_minutes 30, max_alcohol_strikes 4)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nightclub/venues"
              payload: { name: "Club", fire_code_capacity: 50, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Venue.${v_id}.version == 1"
            - "Venue.${v_id}.posture == OPEN"
            - "Venue.${v_id}.occupancy_count == 0"
            - "Venue.${v_id}.cover_base_cents == 2000"
            - "Venue.${v_id}.last_call_offset_minutes == 30"
            - "Venue.${v_id}.max_alcohol_strikes == 4"

      - name: create_venue_missing_fire_code_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Venue.fields.fire_code_capacity
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required fire_code_capacity on venue create returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nightclub/venues"
              payload: { name: "Club", closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: get_venue_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Venue
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /nightclub/venues/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /nightclub/venues/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: list_venues_paginated_envelope_fields
        claim_type: Listing
        grounds:
          - entities.Venue
          - response_envelope
        distinguishing_aspect: "GET /nightclub/venues returns response_type array with pagination fields limit/offset/total_count/has_more present in meta/data per §1.0."
        test_recipe:
          setup: ["Two venues created."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "A", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nightclub/venues"
              payload: { name: "B", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /nightclub/venues"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response.response_type == array"
            - "response.data.total_count == 2"
            - "response.data.has_more == true"

      - name: idcheck_computed_outcome_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.IdCheck.fields.outcome
          - entities.IdCheck.fields.computed_age_years
          - calculations.id_check_outcome
        distinguishing_aspect: "IdCheck.outcome and computed_age_years are source: computed — the create payload has no outcome field; server computes them. A passing of-age check returns outcome PASS, refusal_reason null."
        test_recipe:
          setup: ["Clock 2026-03-15. Venue V."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id, out: $.data.outcome }
          assert:
            - "IdCheck.${idc}.outcome == PASS"
            - "IdCheck.${idc}.refusal_reason == null"
            - "IdCheck.${idc}.computed_age_years == 36"

      - name: tabitem_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.TabItem
        distinguishing_aspect: "TabItem has common_fields: false — it carries only id and created_at, no version field, and there is no PUT/PATCH endpoint for it; the only mutation is the void action which flips voided."
        test_recipe:
          setup: ["Venue V, tab t with one FOOD item."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 50000 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Water", category: "NA_BEVERAGE", qty: 1, unit_price_cents: 500 }
              as: Bartender
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /nightclub/tabs/${t_id}/items"
              payload: {}
              as: Bartender
          assert:
            - "response.data[0].voided == false"
            - "response.data[0].id == ${item_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: settle_already_settled_tab_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Tab.RUNNING_to_SETTLED
          - errors[ERR_INVALID_STATE]
          - validations[priority=8]
        distinguishing_aspect: "Settling a Tab already in terminal SETTLED returns ERR_INVALID_STATE (409); no double-capture of pre-auth."
        test_recipe:
          setup: ["Venue V, tab t with one FOOD item, already settled."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 50000, gratuity_pct: 0.2 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Fries", category: "FOOD", qty: 1, unit_price_cents: 1000 }
              as: Bartender
            - call: "POST /nightclub/tabs/${t_id}/settle"
              payload: {}
              as: Bartender
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/settle"
              payload: {}
              as: Bartender
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: exit_already_exited_entry_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Entry.INSIDE_to_EXITED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Exiting an Entry already in terminal EXITED returns ERR_INVALID_STATE (409); occupancy_count is not double-decremented."
        test_recipe:
          setup: ["Venue V, PASS id-check, Entry e admitted then exited."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { e_id: $.data.id }
            - call: "POST /nightclub/entries/${e_id}/exit"
              payload: {}
              as: DoorHost
          trigger:
            - call: "POST /nightclub/entries/${e_id}/exit"
              payload: {}
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"
            - "Venue.${v_id}.occupancy_count == 0"

      - name: seat_reservation_outside_window_returns_reservation_window
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Reservation.BOOKED_to_SEATED
          - validations[priority=12]
          - errors[ERR_RESERVATION_WINDOW]
        distinguishing_aspect: "Seating a BOOKED reservation when the clock is before window_start_utc returns ERR_RESERVATION_WINDOW (422); the window precondition (clock in [start,end)) is enforced distinct from posture."
        test_recipe:
          setup: ["Clock 2026-03-16T00:00:00Z. Venue V. Reservation res window [2026-03-16T03:00:00Z, 2026-03-16T05:00:00Z) BOOKED (clock before window start)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "T1", party_size: 2, window_start_utc: "2026-03-16T03:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESERVATION_WINDOW"
            - "response.http_status == 422"

      - name: void_tab_with_charges_returns_tab_not_empty
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Tab.RUNNING_to_VOIDED
          - errors[ERR_TAB_NOT_EMPTY]
        distinguishing_aspect: "Whole-tab void requires running_subtotal_cents == 0; voiding a tab carrying a non-voided charge returns ERR_TAB_NOT_EMPTY (409)."
        test_recipe:
          setup: ["Venue V, tab t RUNNING with one ALCOHOL line @2000 (subtotal 2000)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 50000 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Beer", category: "ALCOHOL", qty: 1, unit_price_cents: 2000 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/void"
              payload: {}
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TAB_NOT_EMPTY"
            - "response.http_status == 409"

      - name: venue_closed_blocks_child_mutation_returns_venue_closed
        claim_type: guarded transitions
        grounds:
          - state_machines.Venue.OPEN_to_CLOSED
          - validations[priority=7]
          - errors[ERR_VENUE_CLOSED]
        distinguishing_aspect: "After a venue is CLOSED, opening a new tab returns ERR_VENUE_CLOSED (409) — the posture gate blocks all child mutations from the terminal CLOSED state."
        test_recipe:
          setup: ["Venue V, then operator-closed (posture CLOSED)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/venues/${v_id}/close"
              payload: {}
              as: FloorManager
          trigger:
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "Late", preauth_cents: 5000 }
              as: Bartender
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VENUE_CLOSED"
            - "response.http_status == 409"

      - name: last_call_blocks_new_alcohol_item
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Venue.OPEN_to_LAST_CALL
          - validations[priority=10]
          - errors[ERR_LAST_CALL_NO_ALCOHOL]
        distinguishing_aspect: "Once the clock enters the last-call window (posture LAST_CALL), adding an ALCOHOL TabItem returns ERR_LAST_CALL_NO_ALCOHOL (422), while a NA_BEVERAGE item still succeeds."
        test_recipe:
          setup: ["Venue V closing 2026-03-16T06:00:00Z offset 30 (LAST_CALL at 05:30). Tab t open. Advance clock to 05:45."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z", last_call_offset_minutes: 30 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 50000 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T05:45:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Whiskey", category: "ALCOHOL", qty: 1, unit_price_cents: 1500 }
              as: Bartender
              captures: { err: $.data.error_id }
          assert:
            - "Venue.${v_id}.posture == LAST_CALL"
            - "response.data.error_id == ERR_LAST_CALL_NO_ALCOHOL"
            - "response.http_status == 422"

      - name: over_service_strike_cap_blocks_alcohol
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Tab.RUNNING_to_RUNNING
          - validations[priority=11]
          - errors[ERR_OVER_SERVICE_REFUSED]
          - entities.Tab.fields.bac_strikes
        distinguishing_aspect: "With venue max_alcohol_strikes 2, after two ALCOHOL items (bac_strikes 2) a third ALCOHOL item returns ERR_OVER_SERVICE_REFUSED (422) — the responsible-service over-service cap fires at bac_strikes >= cap."
        test_recipe:
          setup: ["Venue V max_alcohol_strikes 2. Tab t with two ALCOHOL items (bac_strikes 2)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z", max_alcohol_strikes: 2 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 50000 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Beer1", category: "ALCOHOL", qty: 1, unit_price_cents: 1000 }
              as: Bartender
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Beer2", category: "ALCOHOL", qty: 1, unit_price_cents: 1000 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Beer3", category: "ALCOHOL", qty: 1, unit_price_cents: 1000 }
              as: Bartender
              captures: { err: $.data.error_id }
          assert:
            - "Tab.${t_id}.bac_strikes == 2"
            - "response.data.error_id == ERR_OVER_SERVICE_REFUSED"
            - "response.http_status == 422"

      - name: reservation_no_show_forfeits_deposit
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Reservation.BOOKED_to_NO_SHOW
          - entities.Reservation.fields.deposit_cents
        distinguishing_aspect: "Marking a BOOKED reservation NO_SHOW after its window lapses forfeits deposit_cents (retained, not refunded); status becomes NO_SHOW (terminal)."
        test_recipe:
          setup: ["Clock 2026-03-16T05:30:00Z. Venue V. Reservation res window [03:00,05:00) BOOKED deposit 5000 (lapsed)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "T1", party_size: 2, window_start_utc: "2026-03-16T03:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 10000, deposit_cents: 5000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T05:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/no-show"
              payload: {}
              as: FloorManager
              captures: { st: $.data.status }
          assert:
            - "Reservation.${res_id}.status == NO_SHOW"
            - "Reservation.${res_id}.deposit_cents == 5000"

      - name: error_tab_running_to_open_revert
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Tab.RUNNING_to_OPEN
        excluded_because:
          difficulty_instance: non_linear_state_machine / tab_running_to_open_revert_on_last_void
          rationale: "The RUNNING->OPEN revert with subtotal/strike reset is asserted directly by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: cover_walk_up_full_no_discount
        claim_type: Variant Selection
        grounds:
          - calculations.cover_charge_amount
          - entities.Entry.fields.cover_paid_cents
        distinguishing_aspect: "Walk-up admission (no guest_list_entry_id) with occupancy below the surge band pays full base cover 2000 — the walk_up_full variant, no discount or comp."
        test_recipe:
          setup: ["Venue V cap 10 base 2000. PASS id-check. Occupancy 0 (below surge band)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z", cover_base_cents: 2000, cover_surge_pct: 0.5 }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { e_id: $.data.id, paid: $.data.cover_paid_cents }
          assert:
            - "Entry.${e_id}.cover_paid_cents == 2000"

      - name: cover_house_list_surge_waived
        claim_type: Variant Divergence
        grounds:
          - calculations.cover_charge_amount
          - entities.GuestListEntry.fields.promoter_id
        distinguishing_aspect: "House guest-list (promoter_id null) at occupancy 9 of cap 10 WAIVES the surge (uses base 2000, not surged 3000) and applies comp 500 -> cover 1500; diverges from walk_up_full which would surge to 3000."
        test_recipe:
          setup: ["Venue V cap 10 base 2000 surge 0.5. House GuestListEntry (no promoter) comp 500. Occupancy driven to 9."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z", cover_base_cents: 2000, cover_surge_pct: 0.5 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/guest-list"
              payload: { venue_id: "${v_id}", guest_name: "House", party_size: 1, comp_value_cents: 500 }
              as: DoorHost
              captures: { gle: $.data.id }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "House", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
            - call: "POST /_inject/occupancy"
              payload: { venue_id: "${v_id}", target_inside: 9 }
              as: PlatformAdmin
              captures: { v_after: $.data.version }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", guest_list_entry_id: "${gle}", expected_venue_version: "${v_after}" }
              as: DoorHost
              captures: { e_id: $.data.id, paid: $.data.cover_paid_cents }
          assert:
            - "Entry.${e_id}.cover_paid_cents == 1500"

      - name: reservation_minimum_met_no_topup
        claim_type: Variant Selection
        grounds:
          - calculations.reservation_minimum_shortfall
          - calculations.tab_final_total
        distinguishing_aspect: "met_minimum variant: a SEATED reservation whose linked tab grand 7200 >= spend_minimum 5000 settles with minimum_shortfall_cents 0 and no SERVICE top-up line; tab final stays 7200."
        test_recipe:
          setup: ["Venue V. Reservation res SEATED min 5000. Linked tab grat 0.2 one FOOD @6000 (grand 7200)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 5000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "VIP", preauth_cents: 100000, reservation_id: "${res_id}", gratuity_pct: 0.2 }
              as: Bartender
              captures: { rt_id: $.data.id }
            - call: "POST /nightclub/tabs/${rt_id}/items"
              payload: { name: "Platter", category: "FOOD", qty: 1, unit_price_cents: 6000 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/reservations/${res_id}/settle"
              payload: {}
              as: FloorManager
              captures: { sf: $.data.minimum_shortfall_cents }
          assert:
            - "Reservation.${res_id}.minimum_shortfall_cents == 0"

      - name: refused_underage_boundary
        claim_type: Correct Result
        grounds:
          - calculations.patron_age_years
          - calculations.id_check_outcome
        excluded_because:
          difficulty_instance: boundary_precision_check / age_exactly_21_passes_inclusive
          rationale: "The age==21 PASS / age==20 REFUSE boundary is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: comp_budget_exceeded_on_guest_list_add
        claim_type: Violation to Error
        grounds:
          - validations[priority=16]
          - errors[ERR_COMP_BUDGET_EXCEEDED]
          - entities.Promoter.fields.comp_committed_cents
        distinguishing_aspect: "A guest-list add whose comp_value_cents would push the promoter's comp_committed_cents above comp_budget_cents returns ERR_COMP_BUDGET_EXCEEDED (422); the committed total stays at the prior value."
        test_recipe:
          setup: ["Venue V. Promoter PR comp_budget 1000. One CONFIRMED GuestListEntry comp 800 (committed 800). A second add for comp 500 would reach 1300 > 1000."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/promoters"
              payload: { venue_id: "${v_id}", name: "PR", comp_budget_cents: 1000, guest_discount_pct: 0.5 }
              as: FloorManager
              captures: { pr_id: $.data.id }
            - call: "POST /nightclub/guest-list"
              payload: { venue_id: "${v_id}", guest_name: "G1", party_size: 1, promoter_id: "${pr_id}", comp_value_cents: 800 }
              as: DoorHost
          trigger:
            - call: "POST /nightclub/guest-list"
              payload: { venue_id: "${v_id}", guest_name: "G2", party_size: 1, promoter_id: "${pr_id}", comp_value_cents: 500 }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_COMP_BUDGET_EXCEEDED"
            - "response.http_status == 422"
            - "Promoter.${pr_id}.comp_committed_cents == 800"

      - name: preauth_insufficient_blocks_settle
        claim_type: Violation to Error
        grounds:
          - validations[priority=17]
          - errors[ERR_PREAUTH_INSUFFICIENT]
          - entities.Tab.fields.preauth_cents
        distinguishing_aspect: "Settling a tab (not via close cascade) whose preauth_cents 1000 < projected final_total 1200 (one FOOD @1000 + 0.2 gratuity) returns ERR_PREAUTH_INSUFFICIENT (422); the tab stays RUNNING."
        test_recipe:
          setup: ["Venue V. Tab t preauth 1000 grat 0.2 with one FOOD @1000 (final would be 1200 > 1000)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "T", preauth_cents: 1000, gratuity_pct: 0.2 }
              as: Bartender
              captures: { t_id: $.data.id }
            - call: "POST /nightclub/tabs/${t_id}/items"
              payload: { name: "Burger", category: "FOOD", qty: 1, unit_price_cents: 1000 }
              as: Bartender
          trigger:
            - call: "POST /nightclub/tabs/${t_id}/settle"
              payload: {}
              as: Bartender
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PREAUTH_INSUFFICIENT"
            - "response.http_status == 422"
            - "Tab.${t_id}.status == RUNNING"

      - name: admit_with_non_pass_idcheck_returns_id_check_not_passed
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=9]
          - errors[ERR_ID_CHECK_NOT_PASSED]
        distinguishing_aspect: "Admitting with an id_check_id whose outcome is REFUSED_UNDERAGE returns ERR_ID_CHECK_NOT_PASSED (422) even when the venue has capacity; the gate depends on the IdCheck entity's computed outcome."
        test_recipe:
          setup: ["Clock 2026-03-15. Venue V cap 10. IdCheck dob 2005-03-16 -> REFUSED_UNDERAGE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "Young", date_of_birth: "2005-03-16", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ID_CHECK_NOT_PASSED"
            - "response.http_status == 422"

      - name: fk_not_found_on_unknown_promoter_in_guest_list
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=4]
          - errors[ERR_FK_NOT_FOUND]
          - entities.GuestListEntry.fields.promoter_id
        distinguishing_aspect: "A guest-list add referencing a non-existent promoter_id returns ERR_FK_NOT_FOUND (404), distinct from a missing path resource (which is ERR_NOT_FOUND)."
        test_recipe:
          setup: ["Venue V (no promoters)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /nightclub/guest-list"
              payload: { venue_id: "${v_id}", guest_name: "G", party_size: 1, promoter_id: "00000000-0000-4000-8000-000000000000", comp_value_cents: 100 }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FK_NOT_FOUND"
            - "response.http_status == 404"

      - name: booking_window_end_before_start_returns_reservation_window
        claim_type: Temporal validation
        grounds:
          - validations[priority=12]
          - errors[ERR_RESERVATION_WINDOW]
        distinguishing_aspect: "Booking a reservation whose window_end_utc <= window_start_utc returns ERR_RESERVATION_WINDOW (422) at create time, before any double-book check."
        test_recipe:
          setup: ["Venue V."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "T1", party_size: 2, window_start_utc: "2026-03-16T05:00:00Z", window_end_utc: "2026-03-16T03:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RESERVATION_WINDOW"
            - "response.http_status == 422"

      - name: table_double_book_touching_endpoints_accepted_control
        claim_type: Temporal validation
        grounds:
          - validations[priority=13]
          - entities.Reservation.fields.window_start_utc
        distinguishing_aspect: "Half-open semantics control: a second booking on 'VIP-1' whose window_start_utc == the first booking's window_end_utc (touching, not overlapping) is ACCEPTED (201), confirming touching endpoints do not conflict."
        test_recipe:
          setup: ["Venue V. Reservation A on 'VIP-1' window [01:00, 03:00)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-03-16T01:00:00Z", window_end_utc: "2026-03-16T03:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_a: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-03-16T03:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v1}" }
              as: FloorManager
              captures: { res_b: $.data.id, st: $.data.status }
          assert:
            - "response.http_status == 201"
            - "Reservation.${res_b}.status == BOOKED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: occupancy_exit_reverts_at_capacity_to_open
        claim_type: Action endpoint
        grounds:
          - endpoints
          - state_machines.Venue.AT_CAPACITY_to_OPEN
          - entities.Venue.fields.posture
        distinguishing_aspect: "POST /nightclub/entries/{id}/exit at a full venue (cap 1, posture AT_CAPACITY) drops occupancy_count to 0 and reverts posture AT_CAPACITY->OPEN, re-enabling admits."
        test_recipe:
          setup: ["Venue V cap 1. One Entry admitted (occupancy 1, AT_CAPACITY)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 1, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /nightclub/entries/${e_id}/exit"
              payload: {}
              as: DoorHost
            - call: "GET /nightclub/venues/${v_id}"
              payload: {}
              as: DoorHost
              captures: { occ: $.data.occupancy_count, pos: $.data.posture }
          assert:
            - "Venue.${v_id}.occupancy_count == 0"
            - "Venue.${v_id}.posture == OPEN"

      - name: guest_list_redeemed_on_admission_sets_link
        claim_type: Action endpoint
        grounds:
          - endpoints
          - state_machines.Entry.INSIDE
          - entities.GuestListEntry.fields.status
          - entities.GuestListEntry.fields.redeemed_entry_id
        distinguishing_aspect: "Admitting an Entry off a CONFIRMED GuestListEntry flips that entry's status to REDEEMED and sets redeemed_entry_id to the new Entry.id (the reverse-reachability link)."
        test_recipe:
          setup: ["Venue V. CONFIRMED house GuestListEntry. PASS id-check."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/guest-list"
              payload: { venue_id: "${v_id}", guest_name: "G", party_size: 1 }
              as: DoorHost
              captures: { gle: $.data.id }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "G", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", guest_list_entry_id: "${gle}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { e_id: $.data.id }
            - call: "GET /nightclub/guest-list/${gle}"
              payload: {}
              as: DoorHost
              captures: { st: $.data.status, link: $.data.redeemed_entry_id }
          assert:
            - "GuestListEntry.${gle}.status == REDEEMED"
            - "GuestListEntry.${gle}.redeemed_entry_id == ${e_id}"

      - name: filtered_list_tabs_by_reservation_id_reverse_reachability
        claim_type: Computed read
        grounds:
          - endpoints
          - entities.Tab.fields.reservation_id
        distinguishing_aspect: "GET /nightclub/tabs?reservation_id=<id> returns only tabs linked to that reservation (the reverse-reachability channel for Tab.reservation_id FK), as a Tab[] array."
        test_recipe:
          setup: ["Venue V. Reservation res SEATED. One tab linked to res, one walk-up tab."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/reservations"
              payload: { venue_id: "${v_id}", table_label: "VIP-1", party_size: 4, window_start_utc: "2026-01-01T00:00:00Z", window_end_utc: "2026-03-16T05:00:00Z", spend_minimum_cents: 10000, expected_venue_version: "${v0}" }
              as: FloorManager
              captures: { res_id: $.data.id }
            - call: "POST /nightclub/reservations/${res_id}/seat"
              payload: {}
              as: FloorManager
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "VIP", preauth_cents: 50000, reservation_id: "${res_id}" }
              as: Bartender
              captures: { rt_id: $.data.id }
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "Walk", preauth_cents: 50000 }
              as: Bartender
          trigger:
            - call: "GET /nightclub/tabs"
              payload: { reservation_id: "${res_id}" }
              as: Bartender
          assert:
            - "response.data.total_count == 1"
            - "response.data[0].id == ${rt_id}"

  # ===========================================================================
  - section: errors
    instances:
      - name: refused_expired_id_outcome_triggerable
        claim_type: violation_to_error
        grounds:
          - calculations.id_check_outcome
          - entities.IdCheck.fields.outcome
        excluded_because:
          difficulty_instance: dual_variant_calc / id_check_outcome_pass_vs_expired_override
          rationale: "REFUSED_EXPIRED_ID is produced and asserted by the named §1.8 instance."

      - name: stale_venue_version_on_admit_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VENUE_VERSION]
          - concurrency_rules[admit-entry-stale-venue]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_state_beats_double_book_constraint
          rationale: "ERR_STALE_VENUE_VERSION (412) is triggered and asserted by the named §1.8 instance (on the reservation create endpoint); the admit-endpoint OCC happy/sad path is covered below in cross_cutting_complexity_layers."

  # ===========================================================================
  - section: rbac
    instances:
      - name: bartender_cannot_create_venue_returns_forbidden
        claim_type: role_denied
        grounds:
          - roles
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /nightclub/venues is PlatformAdmin-exclusive; a Bartender calling it returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /nightclub/venues"
              payload: { name: "X", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: Bartender
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "response.http_status == 403"

      - name: doorhost_cannot_open_tab_returns_forbidden
        claim_type: peer_roles
        grounds:
          - roles
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Opening a tab is Bartender-exclusive (peer_roles); a DoorHost calling POST /nightclub/tabs returns ERR_FORBIDDEN_ROLE (403) — door staff cannot touch the bar's resources."
        test_recipe:
          setup: ["Venue V."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /nightclub/tabs"
              payload: { venue_id: "${v_id}", patron_name: "P", preauth_cents: 5000 }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "response.http_status == 403"

      - name: missing_headers_returns_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no/invalid X-User-Role header returns ERR_UNAUTHENTICATED (401) before any authorization or existence check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /nightclub/venues"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.http_status == 401"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_admit_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[admit-entry-stale-venue]
          - entities.Venue.fields.version
          - state_machines.Entry.INSIDE
        distinguishing_aspect: "OCC happy path: admit with expected_venue_version == current Venue.version succeeds (201) and bumps Venue.version from 1 to 2; a follow-up admit reusing the now-stale version 1 is rejected ERR_STALE_VENUE_VERSION (412)."
        test_recipe:
          setup: ["Venue V (version 1). Two PASS id-checks."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_a: $.data.id }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "B", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc_b: $.data.id }
          trigger:
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_a}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { e1: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc_b}", expected_venue_version: "${v0}" }
              as: DoorHost
              captures: { err: $.data.error_id }
          assert:
            - "Venue.${v_id}.version == 2"
            - "response.data.error_id == ERR_STALE_VENUE_VERSION"
            - "response.http_status == 412"

      - name: derived_promoter_comp_committed_releases_on_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Promoter.fields.comp_committed_cents
          - state_machines.GuestListEntry
          - endpoints
        distinguishing_aspect: "Promoter.comp_committed_cents is a derived sum over CONFIRMED/REDEEMED guest-list entries; cancelling a guest-list entry (status CANCELLED) drops it out of the sum, reconciling comp_committed_cents from 800 back to 0."
        test_recipe:
          setup: ["Venue V. Promoter PR budget 5000. One CONFIRMED GuestListEntry comp 800 (committed 800)."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /nightclub/promoters"
              payload: { venue_id: "${v_id}", name: "PR", comp_budget_cents: 5000 }
              as: FloorManager
              captures: { pr_id: $.data.id }
            - call: "POST /nightclub/guest-list"
              payload: { venue_id: "${v_id}", guest_name: "G", party_size: 1, promoter_id: "${pr_id}", comp_value_cents: 800 }
              as: DoorHost
              captures: { gle: $.data.id }
          trigger:
            - call: "POST /nightclub/guest-list/${gle}/cancel"
              payload: {}
              as: DoorHost
            - call: "GET /nightclub/promoters/${pr_id}"
              payload: {}
              as: FloorManager
              captures: { committed: $.data.comp_committed_cents }
          assert:
            - "GuestListEntry.${gle}.status == CANCELLED"
            - "Promoter.${pr_id}.comp_committed_cents == 0"

      - name: clock_to_close_auto_transitions_posture_closed
        claim_type: scheduled_actions
        grounds:
          - state_machines.Venue.LAST_CALL_to_CLOSED
          - endpoints
          - entities.Venue.fields.posture
        distinguishing_aspect: "Advancing the logical clock to >= closing_time_utc auto-transitions a venue's posture to CLOSED via the clock-set recompute (no explicit close call), running the close cascade."
        test_recipe:
          setup: ["Venue V closing 2026-03-16T06:00:00Z. Advance clock to 06:00."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
            - call: "GET /nightclub/venues/${v_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pos: $.data.posture }
          assert:
            - "Venue.${v_id}.posture == CLOSED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_admit_reflects_occupancy_in_same_response
        claim_type: immediate
        grounds:
          - entities.Venue.fields.occupancy_count
          - state_machines.Entry.INSIDE
        distinguishing_aspect: "Consistency is immediate: a GET on the venue right after an admit reflects occupancy_count == 1 in the same request cycle (no eventual lag)."
        test_recipe:
          setup: ["Venue V cap 10, one PASS id-check, one admit."]
          setup_api_calls:
            - call: "POST /nightclub/venues"
              payload: { name: "V", fire_code_capacity: 10, closing_time_utc: "2026-03-16T06:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id, v0: $.data.version }
            - call: "POST /nightclub/id-checks"
              payload: { venue_id: "${v_id}", patron_name: "A", date_of_birth: "1990-01-01", id_expiry: "2030-01-01" }
              as: DoorHost
              captures: { idc: $.data.id }
            - call: "POST /nightclub/entries"
              payload: { venue_id: "${v_id}", id_check_id: "${idc}", expected_venue_version: "${v0}" }
              as: DoorHost
          trigger:
            - call: "GET /nightclub/venues/${v_id}"
              payload: {}
              as: DoorHost
              captures: { occ: $.data.occupancy_count }
          assert:
            - "Venue.${v_id}.occupancy_count == 1"
