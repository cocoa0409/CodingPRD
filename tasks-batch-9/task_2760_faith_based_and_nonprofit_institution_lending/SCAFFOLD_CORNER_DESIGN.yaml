        excluded_because:
          difficulty_instance: loan_parallel_servicing_status_and_risk_posture_evolve_independently
          rationale: "That §1.8 instance already drives servicing_status PENDING_FIRST_DRAW -> CONSTRUCTION_DRAW while risk_posture moves OPEN -> WATCH -> RESTRICTED on the same loan and asserts every cell of the resulting 2-tuple, which is exactly the parallel-dimension corner."

      - name: covenant_hard_breach_cascades_into_draw_suspension
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: covenant_second_breach_cascade_suspends_approved_draws_and_releases_reserved
          rationale: "The four-hop cascade (second FAIL -> BREACHED -> posture RESTRICTED -> APPROVED draws SUSPENDED -> reserved_draw_cents released) is asserted hop by hop there; repeating it here would only duplicate the same asserts."

      - name: application_returns_to_underwriting_after_a_revision_request
        claim_type: cyclic
        excluded_because:
          difficulty_instance: loan_application_revision_cycle_returns_to_underwriting
          rationale: "That §1.8 instance walks COMMITTEE_REVIEW -> REVISION_REQUESTED -> UNDERWRITING through the same submit-underwriting endpoint and asserts revision_count, the cleared revision_reason and the re-snapshotted giving fields."

