    roles: [DispatchCoordinator]
    code: 200
    input: ['crew_id?']
    output: RepairOrder
    side_effects: ["If crew_id omitted: run crew_dispatch_selection", "Increment RepairCrew.open_order_count", "Set RepairOrder.crew_id, dispatched_at", "Increments RepairOrder.version by 1"]

  - method: POST
    path: /repair-orders/{id}/arrive-on-site
    description: "Mark crew arrived on site"
    roles: [DispatchCoordinator]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["Trigger Leak REPAIR_SCHEDULED -> UNDER_REPAIR"]

  - method: POST
    path: /repair-orders/{id}/mark-work-complete
    description: "Mark work complete"
    roles: [DispatchCoordinator]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["Decrement RepairCrew.open_order_count", "Trigger Leak UNDER_REPAIR -> REPAIRED_PENDING_VERIFICATION", "Set completed_at"]

  - method: POST
    path: /repair-orders/{id}/cancel
    description: "Cancel a RepairOrder"
    roles: [DispatchCoordinator]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["Compensating unwind of crew count, Leak status revert to OPEN"]

  - method: POST
    path: /repair-orders/{id}/apply-permit
    description: "ComplianceOfficer applies for excavation permit on this order"
    roles: [ComplianceOfficer]
    code: 201
    input: [permit_number, jurisdiction, expires_at]
    output: ExcavationPermit
    side_effects: ["Create ExcavationPermit APPLIED", "RepairOrder.excavation_permit_status -> PERMIT_APPLIED"]

  - method: GET
    path: /excavation-permits
    description: "List ExcavationPermits"
    roles: [ComplianceOfficer, DispatchCoordinator]
    code: 200
    input: ['limit?', 'offset?', 'status?', 'repair_order_id?']
    output: ExcavationPermit[]

  - method: GET
    path: /excavation-permits/{id}
    description: "Get one ExcavationPermit"
    roles: [ComplianceOfficer, DispatchCoordinator]
    code: 200
    input: []
    output: ExcavationPermit

  - method: POST
    path: /excavation-permits/{id}/grant
    description: "ComplianceOfficer records permit granted"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExcavationPermit

  - method: POST
    path: /excavation-permits/{id}/deny
    description: "ComplianceOfficer records permit denied"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExcavationPermit

  # --- CathodicProtectionReading ---
  - method: POST
    path: /cp-readings
    description: "Record a CP reading on a PipeSegment"
    roles: [FieldTechnician]
    code: 201
    input: [segment_id, test_point_id, pipe_to_soil_potential_mv, instant_off_potential_mv]
    output: CathodicProtectionReading
    side_effects: ["Compute is_anomalous (instant_off > -850)", "If anomalous: anomaly_status=OPEN, recompute PipeSegment.posture, stale RiskModelSnapshot"]

  - method: GET
    path: /cp-readings
    description: "List CathodicProtectionReadings"
    roles: [IntegrityAnalyst, ComplianceOfficer, FieldTechnician]
    code: 200
    input: ['limit?', 'offset?', 'segment_id?', 'anomaly_status?', 'is_anomalous?']
    output: CathodicProtectionReading[]

  - method: GET
    path: /cp-readings/{id}
    description: "Get one CP reading"
    roles: [IntegrityAnalyst, ComplianceOfficer, FieldTechnician]
    code: 200
    input: []
    output: CathodicProtectionReading

  - method: POST
    path: /cp-readings/{id}/acknowledge
    description: "IntegrityAnalyst acknowledges an OPEN anomaly"
    roles: [IntegrityAnalyst]
    code: 200
    input: []
    output: CathodicProtectionReading

  - method: POST
    path: /cp-readings/{id}/resolve
    description: "IntegrityAnalyst resolves an ACKNOWLEDGED anomaly"
    roles: [IntegrityAnalyst]
    code: 200
    input: []
    output: CathodicProtectionReading

  # --- RiskModelSnapshot ---
  - method: POST
    path: /risk-model-snapshots
    description: "Generate a new RiskModelSnapshot (regenerates CURRENT; older become STALE)"
    roles: [IntegrityAnalyst]
    code: 201
    input: [snapshot_label, snapshot_kind]
    output: RiskModelSnapshot
    side_effects: ["Run risk_score for every ACTIVE PipeSegment", "Mark prior same-kind snapshots STALE", "Compute high_risk_segment_ids"]

  - method: GET
    path: /risk-model-snapshots
    description: "List RiskModelSnapshots"
    roles: [IntegrityAnalyst, ComplianceOfficer]
    code: 200
    input: ['limit?', 'offset?', 'status?', 'snapshot_kind?']
    output: RiskModelSnapshot[]

  - method: GET
    path: /risk-model-snapshots/{id}
    description: "Get one snapshot"
    roles: [IntegrityAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: RiskModelSnapshot

  # --- ComplianceReport ---
  - method: POST
    path: /compliance-reports
    description: "Create a DRAFT ComplianceReport"
    roles: [ComplianceOfficer]
    code: 201
    input: [reporting_period_start, reporting_period_end, regulator]
    output: ComplianceReport

  - method: GET
    path: /compliance-reports
    description: "List ComplianceReports"
    roles: [ComplianceOfficer, IntegrityAnalyst]
    code: 200
    input: ['limit?', 'offset?', 'status?', 'regulator?']
    output: ComplianceReport[]

  - method: GET
    path: /compliance-reports/{id}
    description: "Get one ComplianceReport"
    roles: [ComplianceOfficer, IntegrityAnalyst]
    code: 200
    input: []
    output: ComplianceReport

  - method: POST
    path: /compliance-reports/{id}/bind-snapshots
    description: "Bind RiskModelSnapshots to DRAFT report (OCC-guarded)"
    roles: [ComplianceOfficer]
    code: 200
    input: [leak_section_snapshot_id, cp_section_snapshot_id, expected_report_version]
    output: ComplianceReport
    side_effects: ["Set snapshot ids", "Increments ComplianceReport.version by 1"]

  - method: POST
    path: /compliance-reports/{id}/submit-for-review
    description: "Submit DRAFT for review (OCC-guarded); pins snapshots"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_report_version]
    output: ComplianceReport
    side_effects: ["Pin RiskModelSnapshots", "Increments ComplianceReport.version by 1"]

  - method: POST
    path: /compliance-reports/{id}/submit-to-regulator
    description: "Submit report to regulator"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["Set submitted_at = current logical clock"]

  - method: POST
    path: /compliance-reports/{id}/record-acceptance
    description: "Regulator accepted"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport

  - method: POST
    path: /compliance-reports/{id}/record-rejection
    description: "Regulator rejected"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport

  - method: POST
    path: /compliance-reports/{id}/request-resubmission
    description: "Officer requests resubmission (REJECTED_BY_REGULATOR -> RESUBMISSION_REQUIRED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport

  - method: POST
    path: /compliance-reports/{id}/reopen-draft
    description: "Reopen report as DRAFT for resubmission (RESUBMISSION_REQUIRED -> DRAFT)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: ["Pinned snapshots revert to STALE", "Clear snapshot ids"]

  # --- Test-driving endpoints (logical clock) ---
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server logical clock (test-driving endpoint). Server startup default time is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time."
    roles: [IntegrityAnalyst]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["All subsequent computed fields (anomaly expiry, overdue detection, calibration due, survey window checks) use this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced entity does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed input, missing required field, or out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in expected state for this transition" }

  # Segment
  - { id: ERR_SEGMENT_NOT_ACTIVE, http: 409, condition: "PipeSegment.status != ACTIVE" }
  - { id: ERR_SEGMENT_NOT_OUT_OF_SERVICE, http: 409, condition: "PipeSegment.status != OUT_OF_SERVICE on return-to-service/abandon" }
  - { id: ERR_OPEN_REPAIR_ORDERS_EXIST, http: 422, condition: "Cannot out-of-service while DISPATCHED/ON_SITE RepairOrders exist" }
  - { id: ERR_NO_RECENT_CLEAN_CP_READING, http: 422, condition: "Return-to-service requires a clean CP reading in last 90 days" }

  # Instrument
  - { id: ERR_INSTRUMENT_OUT_OF_CALIBRATION, http: 422, condition: "Instrument.status != IN_SERVICE at SurveyRun submit" }
  - { id: ERR_CALIBRATION_DRIFT_EXCEEDED, http: 422, condition: "Calibration drift_pct > MAX_DRIFT_PCT (5%)" }
  - { id: ERR_INSTRUMENT_IN_USE, http: 422, condition: "Instrument referenced by an active SurveyRun; cannot retire" }

  # Route / Run
  - { id: ERR_ROUTE_NOT_PLANNED, http: 409, condition: "SurveyRoute.status != PLANNED on dispatch" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "SurveyRoute.status != DISPATCHED on start" }
  - { id: ERR_ROUTE_NOT_IN_PROGRESS, http: 409, condition: "SurveyRoute.status != IN_PROGRESS on complete" }
  - { id: ERR_ROUTE_NOT_ABORTABLE, http: 409, condition: "SurveyRoute not in PLANNED or DISPATCHED on abort" }
  - { id: ERR_ROUTE_INCLUDES_INACTIVE_SEGMENT, http: 422, condition: "Route contains a segment not in ACTIVE status" }
  - { id: ERR_ROUTE_WINDOW_PASSED, http: 422, condition: "Current logical clock beyond scheduled_window_end on dispatch" }
  - { id: ERR_OUTSIDE_SCHEDULED_WINDOW, http: 422, condition: "Route start attempted outside [scheduled_window_start, scheduled_window_end)" }
  - { id: ERR_TECHNICIAN_NOT_QUALIFIED, http: 422, condition: "FieldTechnician.qualified_methods missing route's survey_method" }
  - { id: ERR_NO_ACCEPTED_RUN, http: 422, condition: "Route completion requires at least one ACCEPTED SurveyRun" }
  - { id: ERR_RUN_NOT_DRAFT, http: 409, condition: "SurveyRun.status != DRAFT on submit" }
  - { id: ERR_RUN_NOT_SUBMITTED, http: 409, condition: "SurveyRun.status != SUBMITTED on accept/reject" }
  - { id: ERR_NOT_RUN_OWNER, http: 403, condition: "X-User-ID != SurveyRun.technician_id" }
  - { id: ERR_COVERAGE_BELOW_MINIMUM, http: 422, condition: "SurveyRun coverage_pct < 95" }

  # Leak
  - { id: ERR_LEAK_NOT_OPEN, http: 409, condition: "Leak.status != OPEN on schedule-repair/regrade" }
  - { id: ERR_LEAK_NOT_PENDING_VERIFICATION, http: 409, condition: "Leak.status != REPAIRED_PENDING_VERIFICATION on verify-clear" }
  - { id: ERR_REGRADE_SAME_GRADE, http: 422, condition: "Regrade new_grade == current grade" }
  - { id: ERR_REGRADE_LIMIT_EXCEEDED, http: 422, condition: "Leak.regrade_count >= 3" }
  - { id: ERR_NO_POST_REPAIR_SURVEY, http: 422, condition: "No ACCEPTED post-repair SurveyRun exists for segment" }

  # Repair / Permit
  - { id: ERR_ORDER_NOT_PENDING_DISPATCH, http: 409, condition: "RepairOrder.dispatch_status != PENDING_DISPATCH" }
  - { id: ERR_ORDER_NOT_DISPATCHED, http: 409, condition: "RepairOrder.dispatch_status != DISPATCHED" }
  - { id: ERR_ORDER_NOT_ON_SITE, http: 409, condition: "RepairOrder.dispatch_status != ON_SITE" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "RepairOrder.dispatch_status not in {PENDING_DISPATCH, DISPATCHED}" }
  - { id: ERR_NO_ELIGIBLE_CREW, http: 422, condition: "Crew selector policy returned empty candidate set" }
  - { id: ERR_CREW_AT_CAPACITY, http: 422, condition: "RepairCrew.open_order_count >= max_concurrent_orders" }
  - { id: ERR_CREW_NOT_QUALIFIED_EXCAVATION, http: 422, condition: "RepairCrew.is_qualified_excavation == false but repair_method requires excavation" }
  - { id: ERR_CREW_OFF_DUTY, http: 422, condition: "RepairCrew.status == OFF_DUTY" }
  - { id: ERR_NO_VALID_EXCAVATION_PERMIT, http: 422, condition: "No GRANTED ExcavationPermit with expires_at > current clock for this order" }
  - { id: ERR_PERMIT_NOT_APPLIED, http: 409, condition: "ExcavationPermit.status != APPLIED on grant/deny" }
  - { id: ERR_PERMIT_NOT_REQUIRED, http: 409, condition: "RepairOrder.excavation_permit_status != PERMIT_REQUIRED on apply" }

  # CP
  - { id: ERR_ANOMALY_NOT_OPEN, http: 409, condition: "CathodicProtectionReading.anomaly_status != OPEN on acknowledge" }
  - { id: ERR_ANOMALY_NOT_ACKNOWLEDGED, http: 409, condition: "CathodicProtectionReading.anomaly_status != ACKNOWLEDGED on resolve" }
  - { id: ERR_NO_CLEANUP_READING, http: 422, condition: "No newer non-anomalous CP reading exists on this segment" }

  # Report / Snapshot
  - { id: ERR_REPORT_NOT_DRAFT, http: 409, condition: "ComplianceReport.status != DRAFT" }
  - { id: ERR_REPORT_NOT_PENDING_REVIEW, http: 409, condition: "ComplianceReport.status != PENDING_REVIEW" }
  - { id: ERR_REPORT_NOT_SUBMITTED, http: 409, condition: "ComplianceReport.status != SUBMITTED" }
  - { id: ERR_REPORT_NOT_REJECTED, http: 409, condition: "ComplianceReport.status != REJECTED_BY_REGULATOR" }
  - { id: ERR_REPORT_NOT_RESUBMISSION_REQUIRED, http: 409, condition: "ComplianceReport.status != RESUBMISSION_REQUIRED" }
  - { id: ERR_SNAPSHOT_STALE, http: 422, condition: "RiskModelSnapshot.status != CURRENT when bound or submitted" }
  - { id: ERR_OFFICER_OUT_OF_JURISDICTION, http: 422, condition: "ComplianceOfficer.jurisdiction_scope missing regulator" }
  - { id: ERR_REPORT_PAST_DUE, http: 422, condition: "Submitting after reporting_period_end + 60 days" }

  # Concurrency (OCC)
  - { id: ERR_STALE_LEAK_VERSION, http: 412, condition: "expected_leak_version mismatches Leak.version" }
  - { id: ERR_STALE_REPORT_VERSION, http: 412, condition: "expected_report_version mismatches ComplianceReport.version" }

  # RBAC
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same X-User-ID attempted forbidden paired action (e.g., survey technician approving own run)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntegrityAnalyst
    description: "Owns integrity program; manages segments, accepts survey runs, generates risk snapshots, manages org users"
    identity: "entity_backed:IntegrityAnalyst"
    exclusive_operations:
      - "POST /pipe-segments"
      - "POST /pipe-segments/{id}/out-of-service"
      - "POST /pipe-segments/{id}/return-to-service"
      - "POST /pipe-segments/{id}/abandon"
      - "POST /survey-runs/{id}/accept"
      - "POST /survey-runs/{id}/reject"
      - "POST /cp-readings/{id}/acknowledge"
      - "POST /cp-readings/{id}/resolve"
      - "POST /risk-model-snapshots"
      - "POST /field-technicians"
      - "POST /compliance-officers"
      - "POST /calibration-techs"
      - "POST /dispatch-coordinators"
      - "POST /integrity-analysts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /pipe-segments*"
      - "GET /leaks*"
      - "GET /survey-runs*"
      - "GET /survey-routes*"
      - "GET /cp-readings*"
      - "GET /repair-orders*"
      - "GET /risk-model-snapshots*"
      - "GET /compliance-reports*"
      - "GET /repair-crews*"

  - name: FieldTechnician
    description: "Performs field surveys, reports leaks, takes CP readings"
    identity: "entity_backed:FieldTechnician"
    exclusive_operations:
      - "POST /survey-routes/{id}/start"
      - "POST /survey-routes/{id}/complete"
      - "POST /survey-runs"
      - "POST /survey-runs/{id}/submit"
      - "POST /leaks"
      - "POST /leaks/{id}/regrade"
      - "POST /cp-readings"
    shared_operations:
      - "GET /pipe-segments*"
      - "GET /leaks*"
      - "GET /survey-runs*"
      - "GET /survey-routes*"
      - "GET /cp-readings*"
      - "GET /instruments*"

  - name: ComplianceOfficer
    description: "Files reports with regulators; approves leak clearance; manages excavation permits"
    identity: "entity_backed:ComplianceOfficer"
    exclusive_operations:
      - "POST /compliance-reports"
      - "POST /compliance-reports/{id}/bind-snapshots"
      - "POST /compliance-reports/{id}/submit-for-review"
      - "POST /compliance-reports/{id}/submit-to-regulator"
      - "POST /compliance-reports/{id}/record-acceptance"
      - "POST /compliance-reports/{id}/record-rejection"
      - "POST /compliance-reports/{id}/request-resubmission"
      - "POST /compliance-reports/{id}/reopen-draft"
      - "POST /leaks/{id}/verify-clear"
      - "POST /repair-orders/{id}/apply-permit"
      - "POST /excavation-permits/{id}/grant"
      - "POST /excavation-permits/{id}/deny"
    shared_operations:
      - "GET /pipe-segments*"
      - "GET /leaks*"
      - "GET /cp-readings*"
      - "GET /repair-orders*"
      - "GET /excavation-permits*"
      - "GET /risk-model-snapshots*"
      - "GET /compliance-reports*"

  - name: DispatchCoordinator
    description: "Builds and dispatches survey routes; schedules and dispatches repairs"
    identity: "entity_backed:DispatchCoordinator"
    exclusive_operations:
      - "POST /survey-routes"
      - "POST /survey-routes/{id}/route-segment-assignments"
      - "POST /survey-routes/{id}/dispatch"
      - "POST /survey-routes/{id}/abort"
      - "POST /leaks/{id}/schedule-repair"
      - "POST /repair-orders/{id}/dispatch"
      - "POST /repair-orders/{id}/arrive-on-site"
      - "POST /repair-orders/{id}/mark-work-complete"
      - "POST /repair-orders/{id}/cancel"
      - "POST /repair-crews"
      - "POST /repair-crews/{id}/set-off-duty"
      - "POST /repair-crews/{id}/set-on-duty"
    shared_operations:
      - "GET /pipe-segments*"
      - "GET /leaks*"
      - "GET /survey-runs*"
      - "GET /survey-routes*"
      - "GET /repair-orders*"
      - "GET /repair-crews*"
      - "GET /excavation-permits*"
      - "GET /field-technicians*"

  - name: CalibrationTech
    description: "Owns instrument inventory and calibration records"
    identity: "entity_backed:CalibrationTech"
    exclusive_operations:
      - "POST /instruments"
      - "POST /instruments/{id}/calibrate"
      - "POST /instruments/{id}/retire"
    shared_operations:
      - "GET /instruments*"
