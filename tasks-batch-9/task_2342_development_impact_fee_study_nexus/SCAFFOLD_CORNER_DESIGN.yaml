            - call: "POST /development-applications/${app_id}/assess"
              as: PermitOfficer
              as_user_id: "permit-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /development-applications/${app_id}/payments"
              payload: { amount_cents: 5189521, payment_reference: "WIRE-11" }
              as: PermitOfficer
              as_user_id: "permit-1"
            - call: "GET /facility-categories/${cat_parks_id}"
              as: FinanceOfficer
              as_user_id: "finance-1"
              captures: { cat_v: $.data.version }
          trigger:
            - call: "POST /facility-categories/${cat_parks_id}/expenditures"
              payload: { amount_cents: 1000000, project_name: "Greenway Phase A", expected_facility_category_version: "${cat_v}" }
              as: FinanceOfficer
              as_user_id: "finance-1"
            - call: "POST /facility-categories/${cat_parks_id}/expenditures"
              payload: { amount_cents: 1000000, project_name: "Greenway Phase B", expected_facility_category_version: "${cat_v}" }
              as: FinanceOfficer
              as_user_id: "finance-1"
            - call: "GET /facility-categories/${cat_parks_id}"
              as: FinanceOfficer
              as_user_id: "finance-1"
              captures: { cat_v2: $.data.version }
            - call: "POST /facility-categories/${cat_parks_id}/expenditures"
              payload: { amount_cents: 1000000, project_name: "Greenway Phase B", expected_facility_category_version: "${cat_v2}" }
              as: FinanceOfficer
              as_user_id: "finance-1"
            - call: "GET /facility-categories/${cat_parks_id}"
              as: FinanceOfficer
              as_user_id: "finance-1"
          assert:
            - "Call 1: HTTP 201; the category's fund_balance_cents becomes 1617930 and its version increments by one."
            - "Call 2 (same captured version): HTTP 412 with error_id ERR_STALE_CATEGORY_VERSION; fund_balance_cents is still 1617930 and no second EXPENDITURE row exists."
            - "Call 4 (fresh version): HTTP 201, so the retry is the only difference."
            - "Final read: fund_balance_cents 617930, the source COLLECTION row 'PARTIALLY_EXPENDED' with unexpended_cents 617930, fund_posture 'COMPLIANT' and exactly two EXPENDITURE rows of 1000000 each."
            - "The category version is exactly two greater than the originally captured value - the rejected call did not increment it."

      - name: multi_level_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.FeeStudy.EFFECTIVE_to_SUPERSEDED
          - entities.DevelopmentApplication.fields.reassessment_required
        excluded_because:
          difficulty_instance: activation_supersedes_prior_study_and_flags_pinned_applications
          rationale: "That instance is the deepest cascade in the scaffold (activation -> supersession -> pinned-application flagging -> payment block) and asserts every level plus the rows deliberately left alone."

      - name: both_calculation_variants_are_exercised_and_their_delta_checked
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.cost_per_demand_unit
          - calculations.credit_claim_valuation
        excluded_because:
          difficulty_instance: credit_claim_nominal_versus_present_value_valuation
          rationale: "The layer has two dual-variant calculations and both have their own difficulty instance: this one for credit valuation and cost_allocation_plan_based_versus_standard_based_on_identical_facts for the cost allocation, each asserting both variants and the delta."

      - name: derived_totals_are_recomputed_after_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - entities.FacilityCategory.fields.committed_demand_units
          - entities.DevelopmentApplication.fields.assessed_lines
        excluded_because:
          difficulty_instance: committed_demand_units_are_conserved_across_reassessment
          rationale: "That instance reconciles the derived aggregate against its source rows after creation, after reassessment changes the source lines and after a second application joins the aggregate, which is the full reconciliation claim for this layer."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: assessment_response_already_carries_every_derived_total
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.application_assessment
          - endpoints[POST /development-applications/{id}/assess]
          - entities.FacilityCategory.fields.committed_demand_units
        distinguishing_aspect: |
          The declared consistency model is immediate, so the assess response itself - not a
          later read - must already contain the final assessed_lines and the four money
          totals, and the sibling FacilityCategory aggregate must already include this
          application's demand units on the very next call. No settling period, no background
          recomputation: the follow-up reads must be byte-identical to the write response.
        test_recipe:
          setup:
            - "HARBOR program with an EFFECTIVE PLAN_BASED study pricing PARKS (fee 254168) and ROADS (fee 249669) for SINGLE_FAMILY."
            - "BP-1001 with 10 dwellings is UNASSESSED and the clock is at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "ROADS", name: "Arterial Roads", demand_unit_label: "trip", existing_los_per_demand_unit: 0.0008, planned_los_per_demand_unit: 0.0006, unit_cost_cents: 250000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_roads_id: $.data.id }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", methodology: "PLAN_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { study_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_id}", facility_category_id: "${cat_roads_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 200000, demand_units_per_dwelling: 1.0100, demand_units_per_1000_nonres_sqft: 3.7500, planned_facility_cost_cents: 900000000, planned_growth_share_bp: 6500, planned_capacity_demand_units: 2000, planned_other_funding_cents: 100000000, existing_tax_credit_per_unit_cents: 0 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_roads_id: $.data.id }
            - call: "POST /nexus-components/${comp_parks_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/allocate"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_parks_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 2.5000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /nexus-components/${comp_roads_id}/fee-schedule-items"
              payload: { land_use_category: "SINGLE_FAMILY", unit_basis: "PER_DWELLING", conversion_factor: 1.0100 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fee-studies/${study_id}/certify-nexus"
              as: NexusAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/publish-notice"
              payload: { notice_method: "NEWSPAPER", notice_days: 30 }
              as: CouncilClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-14T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/close-protest-window"
              as: CouncilClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/adopt"
              as: CouncilClerk
              as_user_id: "clerk-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-16T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-studies/${study_id}/activate"
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /development-applications"
              payload: { fee_program_id: "${prog_id}", permit_number: "BP-1001", land_use_category: "SINGLE_FAMILY", collection_trigger: "PERMIT", dwelling_units: 10, nonres_sqft: 0 }
              as: Developer
              as_user_id: "dev-1"
              captures: { app_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /development-applications/${app_id}/assess"
              as: PermitOfficer
              as_user_id: "permit-1"
            - call: "GET /development-applications/${app_id}"
              as: Developer
              as_user_id: "dev-1"
            - call: "GET /facility-categories/${cat_parks_id}"
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "The assess response (call 1) itself contains assessment_status 'ASSESSED', collection_status 'DUE', two assessed_lines ordered PARKS then ROADS, gross_assessed_cents 5038370, credit_applied_cents 0, admin_charge_cents 151151, net_due_cents 5189521, pinned_fee_study_id set to the effective study and assessed_at '2026-05-01T00:00:00Z'."
            - "Call 2 returns exactly the same values with the same version - reading again neither changes nor completes anything."
            - "Call 3 already reports committed_demand_units 25.0000 on PARKS, computed from the assessed line written by call 1."
            - "paid_cents is 0 and fund_balance_cents is 0 - assessment creates no ledger rows, so immediacy does not mean over-eager side effects."

