      - name: inspection_violation_cascade_invalidates_accepted_assessment_and_regresses_application
        grounds:
          - state_machines.Inspection.SCHEDULED_to_COMPLETED
          - state_machines.ScreeningArea.CURRENT_to_STALE
          - state_machines.CumulativeImpactAssessment.ACCEPTED_to_INVALIDATED
          - state_machines.PermitApplication.PENDING_DECISION_to_ENHANCED_REVIEW
          - calculations.governing_assessment_selector
          - entities.PermitApplication.fields.screening_stale_flag
          - entities.Facility.fields.confirmed_violation_count
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /ej/inspections/{id}/complete with
          finding VIOLATION_CONFIRMED (a different triggering transition from the
          burden-indicator cascade): facility -> VIOLATION_ON_RECORD (link 1) causes the
          area's enforcement points to rise and data_status CURRENT -> STALE (link 2),
          which causes the ACCEPTED assessment -> INVALIDATED (link 3), which causes the
          application PENDING_DECISION -> ENHANCED_REVIEW with screening_stale_flag true
          and pre_mitigation_index collapsing to 0.00 (link 4).
