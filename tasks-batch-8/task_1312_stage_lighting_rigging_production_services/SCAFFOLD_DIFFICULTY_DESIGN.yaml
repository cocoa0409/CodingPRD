            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10840, phase_l2_watts: 10830, phase_l3_watts: 10830, feeder_length_m: 0, generator_required: true }, as: ProductionManager, captures: { pp2: $.data.id } }
          trigger:
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { pp1_kva: $.data.required_kva, pp1_tier: $.data.selected_generator_tier_kva, pp1_status: $.data.status } }
            - { call: "POST /api/power-plans/${pp2}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { pp2_kva: $.data.required_kva, pp2_tier: $.data.selected_generator_tier_kva } }
          assert:
            - "PowerPlan.${pp1}: status SUBMITTED, required_kva == 45.00, selected_generator_tier_kva == 45 (loading exactly 80% passes)"
            - "PowerPlan.${pp2}: required_kva == 45.14, selected_generator_tier_kva == 60"

      - name: plot_submit_empty_rejected
        grounds:
          - validations[priority=27]
          - errors[ERR_EMPTY_PLOT]
          - state_machines.LightingPlot.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-set boundary on the point-count metric via the plot transition endpoint: a plot
          with zero points in RESERVED/UNDER_REVIEW/APPROVED cannot be submitted
          (ERR_EMPTY_PLOT); adding exactly one point flips the predicate to pass — count 0 vs 1
          is the boundary.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; plot PL1 DRAFT with no points"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Empty Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
          trigger:
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { sub_err: $.data.error_id } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { sub_ok: $.data.status } }
          assert:
            - "submit with zero points returns error_id ERR_EMPTY_PLOT (HTTP 422); plot stays DRAFT"
            - "after adding exactly one point the same submit succeeds and status == SUBMITTED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: point_review_requires_plot_submitted
        grounds:
          - state_machines.RiggingPoint.RESERVED_to_UNDER_REVIEW
          - validations[priority=28]
          - errors[ERR_PLOT_NOT_SUBMITTED]
        distinguishing_aspect: |
          Entity pair RiggingPoint -> LightingPlot: a point cannot enter UNDER_REVIEW while its
          plot is DRAFT; the identical request succeeds once the plot reaches SUBMITTED — the
          gate reads the PARENT entity's state, not the point's.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; plot PL1 DRAFT with point RP1 RESERVED (clock at default 2026-08-01, within the engineering deadline)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
          trigger:
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1, captures: { er_err: $.data.error_id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1, captures: { ok_status: $.data.status, ok_pin: $.data.plot_version_at_submission } }
          assert:
            - "first attempt returns error_id ERR_PLOT_NOT_SUBMITTED (HTTP 409) while plot is DRAFT"
            - "after plot submit, the identical point request succeeds: status == UNDER_REVIEW and plot_version_at_submission == the plot's current version"

      - name: schedule_authorization_requires_production_state
        grounds:
          - state_machines.LoadSchedule.CONFIRMED_to_AUTHORIZED
          - validations[priority=32]
          - errors[ERR_SCHEDULE_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Entity pair LoadSchedule -> Production: a CONFIRMED LOAD_IN run cannot be AUTHORIZED
          while the production is PLANNING; it authorizes once the production reaches
          READY_FOR_LOADIN, and a LOAD_OUT run stays gated until SHOW_COMPLETE — the gate reads
          the production's state keyed by the schedule's own direction.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 with full readiness chain executed up to PLANNING-complete (plot+point approved, power plan approved, entry PREPPED, crew call CONFIRMED) but NOT yet marked ready"
            - "Truck T1 with CONFIRMED LOAD_IN schedule LS1 (dock 0, window 2026-09-01T08:00..12:00)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10000, phase_l2_watts: 10000, phase_l3_watts: 10000, feeder_length_m: 0, generator_required: false }, as: ProductionManager, captures: { pp1: $.data.id } }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: APPROVED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { as1: $.data.id } }
            - { call: "POST /api/crew-assignments/${as1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/trucks", payload: { plate_no: "T-1", capacity_kg: 10000 }, as: WarehouseChief, captures: { tr1: $.data.id } }
            - { call: "POST /api/productions/${p1}/load-schedules", payload: { truck_id: "${tr1}", direction: LOAD_IN, dock_door_index: 0, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }, as: ProductionManager, captures: { ls1: $.data.id } }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
          trigger:
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: AUTHORIZED }, as: ProductionManager, captures: { auth_err: $.data.error_id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: READY_FOR_LOADIN }, as: ProductionManager }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: AUTHORIZED }, as: ProductionManager, captures: { auth_ok: $.data.status } }
          assert:
            - "first AUTHORIZE returns error_id ERR_SCHEDULE_NOT_AUTHORIZED (HTTP 409) while production is PLANNING"
            - "after the production reaches READY_FOR_LOADIN the identical AUTHORIZE succeeds: status == AUTHORIZED"

      - name: electrical_inspection_requires_approved_plan
        grounds:
          - state_machines.SafetyInspection.SCHEDULED_to_IN_PROGRESS
          - validations[priority=38]
          - errors[ERR_POWER_PLAN_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair SafetyInspection -> PowerPlan: an ELECTRICAL inspection scheduled while
          the production is still PLANNING (allowed) cannot begin until an APPROVED power plan
          exists; begin fails with ERR_POWER_PLAN_NOT_APPROVED before approval and succeeds after.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; ELECTRICAL inspection IE1 SCHEDULED; power plan PP1 exists in DRAFT (never submitted)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10000, phase_l2_watts: 10000, phase_l3_watts: 10000, feeder_length_m: 0, generator_required: false }, as: ProductionManager, captures: { pp1: $.data.id } }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: ELECTRICAL }, as: ProductionManager, captures: { ie1: $.data.id } }
          trigger:
            - { call: "POST /api/inspections/${ie1}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1, captures: { begin_err: $.data.error_id } }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: APPROVED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/inspections/${ie1}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1, captures: { begin_ok: $.data.status } }
          assert:
            - "first begin returns error_id ERR_POWER_PLAN_NOT_APPROVED (HTTP 409) while only a DRAFT plan exists"
            - "after plan approval the identical begin succeeds: status == IN_PROGRESS"

      - name: production_ready_gate_reads_children
        grounds:
          - calculations.production_readiness_posture
          - state_machines.Production.PLANNING_to_READY_FOR_LOADIN
          - validations[priority=30]
          - errors[ERR_PRODUCTION_NOT_READY]
        distinguishing_aspect: |
          Compound dependency Production -> {LightingPlot, RiggingPoint, PowerPlan,
          PullListEntry, CrewCall}: with plot+point approved, power plan approved and entry
          PREPPED, a single crew call still in PUBLISHED holds posture at PARTIAL and the
