          - state_machines.AuthorizationRequest.PENDED_to_SUBMITTED
        excluded_because:
          difficulty_instance: authorization_pend_resubmit_cycle_capped_at_two
          rationale: "That §1.8 instance walks the SUBMITTED -> PENDED -> SUBMITTED loop to the MAX_RESUBMISSIONS cap and asserts ERR_RESUBMISSION_LIMIT with resubmission_count 2."

      - name: study_start_guarded_by_shift_window
        claim_type: guarded transitions
        grounds:
          - state_machines.Study.PREPARING_to_ACQUIRING
          - validations.priority_11
        excluded_because:
          difficulty_instance: study_start_requires_shift_window_to_contain_clock
          rationale: "That §1.8 instance is exactly the cross-entity guard: the same start call fails outside the shift's half-open window and succeeds inside it."

      - name: conference_presentation_cross_entity_guard
        claim_type: Cross-entity
        grounds:
          - state_machines.SurgicalConferenceCase.DRAFT_to_PRESENTED
          - validations.priority_18
        excluded_because:
          difficulty_instance: conference_present_depends_on_export_delivery
          rationale: "That §1.8 instance asserts the conference case's dependence on the ExportPackage reaching DELIVERED, plus the state of both entities after the guard passes."

      - name: discharge_ledger_sync_to_authorization
        claim_type: Ledger sync
        grounds:
          - state_machines.Admission.ADMITTED_to_DISCHARGED
          - calculations.authorization_day_ledger
        excluded_because:
          difficulty_instance: discharge_settles_authorization_day_ledger
          rationale: "That §1.8 instance reconciles the day ledger before and after discharge and asserts the conserved sum authorized_days == days_consumed + days_reserved + days_available."

      - name: export_build_cascade_down_to_queued_siblings
        claim_type: Cascade down
        grounds:
          - state_machines.ExportPackage.QUEUED_to_BLOCKED
        excluded_because:
          difficulty_instance: export_build_cascade_storage_posture_blocks_queued
          rationale: "That §1.8 instance builds one package into the storage lock and asserts the sibling QUEUED package cascades to BLOCKED with blocked_reason 'UNIT_STORAGE_LOCKED'."

