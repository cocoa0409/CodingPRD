# =============================================================================
# Scaffold: Review Recommendation Software & Advertiser Complaint Handling
# (Yelp-style review platform)
# =============================================================================

scenario: |
  Review Recommendation Software & Advertiser Complaint Handling (Yelp): review
  submission with automated recommendation software deciding which reviews are
  displayed and which are filtered, business owner disputes over filtered or
  negative reviews with a policy that advertising does not affect recommendation,
  review solicitation prohibitions and detection of incentivized or compensated
  reviews, business page claiming, information updates and ownership transfer
  disputes, advertising products including sponsored placement and call tracking
  with attribution reporting, consumer alerts placed on pages with evidence of
  review manipulation, media and legal requests for reviewer identity with
  response policy, business closure and duplicate listing merges.

domain_name: review-recommendation-complaints
api_prefix: /platform

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique reviewer identity; unique across Users" }
      - { name: display_name, type: string, source: input, description: "Public display name" }
      - { name: home_region, type: string, source: input, description: "Region code, e.g. US-CA" }
      - { name: trust_score, type: integer, source: computed, default: 50, description: "Recommendation-software trust score in [0,100]; feeds recommendation scoring" }
      - { name: strike_count, type: integer, source: computed, default: 0, description: "Count of CONFIRMED SolicitationCases targeting this user; >= 2 escalates flagging" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | PURGED; constraints: {ACTIVE, SUSPENDED, PURGED}" }

  - name: BusinessPage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name of the business" }
      - { name: address_line, type: string, source: input, description: "Street address used in duplicate detection" }
      - { name: city, type: string, source: input, description: "City used in duplicate detection" }
      - { name: category, type: string, source: input, description: "Business category label" }
      - { name: website, type: string, source: input, description: "Business website URL" }
      - { name: claimed_by_user_id, type: string, source: system, default: null, description: "FK -> User.id; owner user id once claimed, null while unclaimed" }
      - { name: merged_into_id, type: string, source: system, default: null, description: "FK -> BusinessPage.id; self-referential pointer set when this page is merged into a survivor page" }
      - { name: displayed_review_count, type: integer, source: computed, default: 0, description: "Count of reviews on this page with recommendation_state == DISPLAYED" }
      - { name: displayed_rating_avg_x100, type: integer, source: computed, default: 0, description: "round(100 * avg(rating) over DISPLAYED reviews); 0 when no displayed reviews" }
      - { name: ad_account_id, type: string, source: system, default: null, description: "FK -> AdAccount.id; the advertiser account attached to this page, if any" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED | MERGED; constraints: {ACTIVE, CLOSED, MERGED}" }

  - name: Review
    parent: BusinessPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: input, description: "FK -> BusinessPage.id; page this review is posted on" }
      - { name: author_user_id, type: string, source: system, description: "FK -> User.id; equals X-User-ID of the submitting Reviewer" }
      - { name: rating, type: integer, source: input, description: "Star rating; integer in [1,5]" }
      - { name: text, type: string, source: input, description: "Review body, min length 20 characters" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp at submission" }
      - { name: edited_flag, type: boolean, source: system, default: false, description: "Set true on first successful edit while PENDING" }
      - { name: evidence_confirmed, type: boolean, source: system, default: false, description: "Set true when a SolicitationCase against this review is CONFIRMED; once true the review can never become DISPLAYED" }
      - { name: recommendation_state, type: enum, source: system, description: "PENDING | DISPLAYED | FILTERED | REMOVED; constraints: {PENDING, DISPLAYED, FILTERED, REMOVED}" }
      - { name: recommendation_score_x1000, type: integer, source: computed, description: "Recommendation software score in per-mille, computed at evaluation time per recommendation_scoring" }

  - name: PageClaim
    parent: BusinessPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: input, description: "FK -> BusinessPage.id; page being claimed or transferred" }
      - { name: claimant_user_id, type: string, source: system, description: "FK -> User.id; the BusinessOwner submitting the claim" }
      - { name: kind, type: enum, source: input, description: "CLAIM | TRANSFER; constraints: {CLAIM, TRANSFER}" }
      - { name: evidence_text, type: string, source: input, description: "Free-text evidence of ownership" }
      - { name: verification_code, type: string, source: system, description: "Server-minted 8-char code returned at submission; required to verify" }
      - { name: decided_by_admin_id, type: string, source: system, default: null, description: "Opaque SupportAdmin id who approved/rejected" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | APPROVED | REJECTED | EXPIRED; constraints: {SUBMITTED, VERIFIED, APPROVED, REJECTED, EXPIRED}" }

  - name: AdAccount
    parent: null
    common_fields: true
    fields:
      - { name: page_id, type: string, source: input, description: "FK -> BusinessPage.id; unique — one ad account per page" }
      - { name: owner_user_id, type: string, source: system, description: "FK -> User.id; must equal page.claimed_by_user_id at creation" }
      - { name: daily_budget_cents, type: integer, source: input, description: "Daily spend cap in cents; >= 0" }
      - { name: spent_today_cents, type: integer, source: computed, default: 0, description: "Spend accumulated in the current UTC logical day; reset to 0 by midnight rollover" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED; constraints: {ACTIVE, SUSPENDED, CLOSED}" }

  - name: AdCampaign
    parent: AdAccount
    common_fields: true
    fields:
      - { name: ad_account_id, type: string, source: system, description: "FK -> AdAccount.id; parent account" }
      - { name: kind, type: enum, source: input, description: "SPONSORED_PLACEMENT | CALL_TRACKING; constraints: {SPONSORED_PLACEMENT, CALL_TRACKING}" }
      - { name: bid_cents, type: integer, source: input, description: "Cost per impression (SPONSORED_PLACEMENT) or per attributed call (CALL_TRACKING); >= 1" }
      - { name: starts_on, type: string, source: input, description: "ISO date YYYY-MM-DD, inclusive start (logical calendar)" }
      - { name: ends_on, type: string, source: input, description: "ISO date YYYY-MM-DD, inclusive end; must be >= starts_on" }
      - { name: call_tracking_enabled, type: boolean, source: input, default: false, description: "Required true when kind == CALL_TRACKING; must be false otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | COMPLETED | CANCELLED; constraints: {DRAFT, ACTIVE, PAUSED, COMPLETED, CANCELLED}" }

  - name: AdImpressionEvent
    parent: AdAccount
    common_fields: false
    fields:
      - { name: ad_account_id, type: string, source: system, description: "FK -> AdAccount.id; charged account" }
      - { name: campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; serving campaign" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; unique per ad_account_id — replays do not double-charge" }
      - { name: cost_cents, type: integer, source: system, description: "Charge applied; equals campaign.bid_cents" }
      - { name: served_on, type: string, source: system, description: "ISO date (logical) the impression served on" }

  - name: CallTrackEvent
    parent: AdAccount
    common_fields: false
    fields:
      - { name: ad_account_id, type: string, source: system, description: "FK -> AdAccount.id; charged account" }
      - { name: campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; CALL_TRACKING campaign to attribute to" }
      - { name: caller_number, type: string, source: input, description: "E.164 caller number; attribution key" }
      - { name: called_at, type: datetime, source: input, description: "Logical timestamp of the call; must fall within campaign [starts_on, ends_on]" }
      - { name: duration_seconds, type: integer, source: input, description: "Call length; >= 0" }
      - { name: qualified, type: boolean, source: system, description: "duration_seconds >= CALL_MIN_DURATION_S (30)" }
      - { name: cost_cents, type: integer, source: system, default: 0, description: "bid_cents if qualified else 0" }
      - { name: attribution_window_days, type: integer, source: system, default: 30, description: "Attribution lookback constant ATT_WINDOW_DAYS" }

  - name: AttributionReport
    parent: AdAccount
    common_fields: false
    fields:
      - { name: ad_account_id, type: string, source: system, description: "FK -> AdAccount.id; subject account" }
      - { name: campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; campaign reported on" }
      - { name: period_start, type: string, source: input, description: "ISO date inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date inclusive; >= period_start" }
      - { name: variant, type: enum, source: input, description: "STRICT | EXTENDED; constraints: {STRICT, EXTENDED}" }
      - { name: impressions, type: integer, source: computed, description: "Count of AdImpressionEvent for campaign in window" }
      - { name: qualified_calls, type: integer, source: computed, description: "Count of qualified CallTrackEvents in window per chosen variant" }
      - { name: spend_cents, type: integer, source: computed, description: "Sum of impression cost_cents in window + qualified call cost_cents in window" }

  - name: Complaint
    parent: BusinessPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: system, description: "FK -> BusinessPage.id; page the complained review sits on" }
      - { name: review_id, type: string, source: input, description: "FK -> Review.id; subject review" }
      - { name: filer_user_id, type: string, source: system, description: "FK -> User.id; must equal page.claimed_by_user_id" }
      - { name: kind, type: enum, source: input, description: "FILTERED_DISPUTE | NEGATIVE_DISPUTE | SOLICITATION_REPORT; constraints: {FILTERED_DISPUTE, NEGATIVE_DISPUTE, SOLICITATION_REPORT}" }
      - { name: body, type: string, source: input, description: "Complaint text, min length 10" }
      - { name: escalated, type: boolean, source: system, default: false, description: "Set by escalate action" }
      - { name: decided_by_admin_id, type: string, source: system, default: null, description: "Opaque ContentModerator id who decided" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | ESCALATED | RESOLVED_UPHELD | RESOLVED_ACTIONED | REJECTED; constraints: {OPEN, UNDER_REVIEW, ESCALATED, RESOLVED_UPHELD, RESOLVED_ACTIONED, REJECTED}" }

  - name: SolicitationCase
    parent: BusinessPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: input, description: "FK -> BusinessPage.id; page whose reviews are implicated" }
      - { name: reporter_user_id, type: string, source: system, description: "FK -> User.id; submitting Reporter" }
      - { name: target_review_ids, type: array, source: input, description: "Array of Review.id on page_id, 1..10 entries, all distinct" }
      - { name: evidence_text, type: string, source: input, description: "Evidence narrative, min length 20" }
      - { name: confirmed_review_count, type: integer, source: computed, default: 0, description: "Number of target reviews marked evidence_confirmed at confirm time" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | CONFIRMED | DISMISSED; constraints: {OPEN, INVESTIGATING, CONFIRMED, DISMISSED}" }

  - name: ConsumerAlert
    parent: BusinessPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: system, description: "FK -> BusinessPage.id; page the alert is placed on" }
      - { name: kind, type: enum, source: input, description: "SOLICITATION_EVIDENCE | SUSPICIOUS_ACTIVITY | MEDIA_ATTENTION; constraints: {SOLICITATION_EVIDENCE, SUSPICIOUS_ACTIVITY, MEDIA_ATTENTION}" }
      - { name: case_id, type: string, source: input, description: "FK -> SolicitationCase.id; required when kind == SOLICITATION_EVIDENCE, must reference a CONFIRMED case" }
      - { name: evidence_text, type: string, source: input, description: "Public evidence summary" }
      - { name: review_cooldown_until, type: datetime, source: system, description: "Logical timestamp until which new reviews on the page are rejected; now + ALERT_COOLDOWN_D (30d) at placement" }
      - { name: lifted_by_admin_id, type: string, source: system, default: null, description: "Opaque SupportAdmin id who lifted the alert" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED; constraints: {ACTIVE, LIFTED}" }

  - name: IdentityRequest
    parent: User
    common_fields: true
    fields:
      - { name: subject_user_id, type: string, source: input, description: "FK -> User.id; reviewer whose identity is sought" }
      - { name: requester_label, type: string, source: input, description: "Free-text label of requesting party" }
      - { name: channel, type: enum, source: input, description: "MEDIA | LEGAL_SUBPOENA | LAW_ENFORCEMENT; constraints: {MEDIA, LEGAL_SUBPOENA, LAW_ENFORCEMENT}" }
      - { name: legal_process_ref, type: string, source: input, description: "Docket/subpoena reference; required for LEGAL_SUBPOENA and LAW_ENFORCEMENT, must be absent for MEDIA" }
      - { name: notice_sent_at, type: datetime, source: system, default: null, description: "When user notice was sent (LEGAL_SUBPOENA path)" }
      - { name: notice_deadline, type: datetime, source: system, default: null, description: "notice_sent_at + NOTICE_PERIOD_D (14d); release blocked before this" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | NOTICE_SENT | RELEASED | DECLINED | WITHDRAWN; constraints: {RECEIVED, UNDER_REVIEW, NOTICE_SENT, RELEASED, DECLINED, WITHDRAWN}" }

  - name: MergeRequest
    parent: null
    common_fields: true
    fields:
      - { name: duplicate_page_id, type: string, source: input, description: "FK -> BusinessPage.id; page that will become MERGED (the loser)" }
      - { name: survivor_page_id, type: string, source: input, description: "FK -> BusinessPage.id; page that survives" }
      - { name: reason, type: string, source: input, description: "Duplicate evidence, min length 10" }
      - { name: decided_by_admin_id, type: string, source: system, default: null, description: "Opaque SupportAdmin id who executed" }
      - { name: status, type: enum, source: system, description: "PENDING | EXECUTED | REJECTED; constraints: {PENDING, EXECUTED, REJECTED}" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Review
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: DISPLAYED
        trigger: "POST /platform/reviews/{reviewId}/evaluate (system re-evaluation) when recommendation_score_x1000 >= 700"
        actor: system
        preconditions:
          - "review.evidence_confirmed == false"
        side_effects:
          - "page.displayed_review_count += 1"
          - "page.displayed_rating_avg_x100 recomputed via displayed_rating_average"

      - from: PENDING
        to: FILTERED
        trigger: "POST /platform/reviews/{reviewId}/evaluate when recommendation_score_x1000 < 700"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPLAYED
        to: FILTERED
        trigger: "POST /platform/reviews/{reviewId}/evaluate when recommendation_score_x1000 < 700 (e.g., author trust_score decayed, author SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "page.displayed_review_count -= 1"
          - "page.displayed_rating_avg_x100 recomputed"

      - from: FILTERED
        to: DISPLAYED
        trigger: "POST /platform/reviews/{reviewId}/evaluate when recommendation_score_x1000 >= 700 (e.g., author trust_score improved)"
        actor: system
        preconditions:
          - "review.evidence_confirmed == false"
        side_effects:
          - "page.displayed_review_count += 1"
          - "page.displayed_rating_avg_x100 recomputed"

      - from: PENDING
        to: PENDING
        trigger: "PATCH /platform/reviews/{reviewId} (author edit within EDIT_WINDOW_H 72h of submitted_at)"
        actor: Reviewer
        preconditions:
          - "actor X-User-ID == review.author_user_id"
          - "logical now <= submitted_at + 72h"
        side_effects:
          - "edited_flag = true"
          - "rating and text replaced"
        note: "Editing re-queues the review; it stays PENDING until the next evaluation."

      - from: DISPLAYED
        to: REMOVED
        trigger: "POST /platform/complaints/{complaintId}/resolve with action=REMOVE_REVIEW on RESOLVED_ACTIONED, or SolicitationCase confirm (if evidence_confirmed), or author account PURGED"
        actor: ContentModerator
        preconditions: []
        side_effects:
          - "page.displayed_review_count -= 1"
          - "page.displayed_rating_avg_x100 recomputed"

      - from: FILTERED
        to: REMOVED
        trigger: "POST /platform/complaints/{complaintId}/resolve with action=REMOVE_REVIEW, or SolicitationCase confirm (if evidence_confirmed), or author PURGED"
        actor: ContentModerator
        preconditions: []
        side_effects: []

      - from: PENDING
        to: REMOVED
        trigger: "POST /platform/complaints/{complaintId}/resolve with action=REMOVE_REVIEW, or SolicitationCase confirm (if evidence_confirmed), or author PURGED"
        actor: ContentModerator
        preconditions: []
        side_effects: []

  - entity: PageClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /platform/page-claims/{claimId}/verify with matching verification_code within VERIFY_TTL_D 7 days"
        actor: BusinessOwner
        preconditions:
          - "actor X-User-ID == claim.claimant_user_id"
          - "logical now <= claim.created_at + 7d"
        side_effects: []

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (logical clock advance past created_at + VERIFY_TTL_D 7d without verification)"
        actor: system
        preconditions: []
        side_effects: []

      - from: VERIFIED
        to: APPROVED
        trigger: "POST /platform/page-claims/{claimId}/approve with expected_page_version OCC"
        actor: SupportAdmin
        preconditions:
          - "kind == CLAIM: page.claimed_by_user_id is null"
          - "kind == TRANSFER: page.claimed_by_user_id is not null and != claimant_user_id"
          - "page.status == ACTIVE"
        side_effects:
          - "page.claimed_by_user_id = claimant_user_id; page.version += 1"
          - "kind == TRANSFER and page has AdAccount: ad_account.owner_user_id = claimant_user_id, ad_account.status = SUSPENDED (new owner must reactivate)"
          - "kind == TRANSFER: every OPEN or UNDER_REVIEW Complaint filed by the previous owner on this page -> REJECTED (complaints filed by prior owner do not survive transfer)"

      - from: VERIFIED
        to: REJECTED
        trigger: "POST /platform/page-claims/{claimId}/reject"
        actor: SupportAdmin
        preconditions: []
        side_effects: []

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ACTIONED, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /platform/complaints/{complaintId}/start-review"
        actor: ContentModerator
        preconditions:
          - "moderator X-User-ID != complaint.filer_user_id (segregation of duties)"
        side_effects: []

      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /platform/complaints/{complaintId}/escalate"
        actor: ContentModerator
        preconditions: []
        side_effects:
          - "escalated = true"

      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /platform/complaints/{complaintId}/resolve with action=UPHOLD_FILTER"
        actor: ContentModerator
        preconditions:
          - "kind == FILTERED_DISPUTE requires review.recommendation_state == FILTERED at resolve time (else ERR_REVIEW_STATE_CHANGED)"
        side_effects:
          - "decided_by_admin_id = moderator id"

      - from: UNDER_REVIEW
        to: RESOLVED_ACTIONED
        trigger: "POST /platform/complaints/{complaintId}/resolve with action=RESTORE_REVIEW or action=REMOVE_REVIEW"
        actor: ContentModerator
        preconditions:
          - "action=RESTORE_REVIEW: review.recommendation_state == FILTERED and review.evidence_confirmed == false"
          - "action=REMOVE_REVIEW: review.recommendation_state != REMOVED"
        side_effects:
          - "action=RESTORE_REVIEW: review.recommendation_state -> DISPLAYED; page.displayed_review_count += 1; page.displayed_rating_avg_x100 recomputed"
          - "action=REMOVE_REVIEW: review.recommendation_state -> REMOVED; if review was DISPLAYED: page.displayed_review_count -= 1 and avg recomputed"
          - "decided_by_admin_id = moderator id"

      - from: ESCALATED
        to: RESOLVED_UPHELD
        trigger: "POST /platform/complaints/{complaintId}/resolve with action=UPHOLD_FILTER"
        actor: ContentModerator
        preconditions:
          - "kind == FILTERED_DISPUTE requires review.recommendation_state == FILTERED"
        side_effects:
          - "decided_by_admin_id = moderator id"

      - from: ESCALATED
        to: RESOLVED_ACTIONED
        trigger: "POST /platform/complaints/{complaintId}/resolve with action=RESTORE_REVIEW or action=REMOVE_REVIEW"
        actor: ContentModerator
        preconditions:
          - "action=RESTORE_REVIEW: review.recommendation_state == FILTERED and review.evidence_confirmed == false"
          - "action=REMOVE_REVIEW: review.recommendation_state != REMOVED"
        side_effects:
          - "same side effects as UNDER_REVIEW -> RESOLVED_ACTIONED"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /platform/complaints/{complaintId}/reject"
        actor: ContentModerator
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: REJECTED
        trigger: "POST /platform/complaints/{complaintId}/reject"
        actor: ContentModerator
        preconditions: []
        side_effects: []

      - from: OPEN
        to: REJECTED
        trigger: "system (PageClaim TRANSFER approval rejects prior owner's OPEN complaints; see PageClaim APPROVED side effects)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SolicitationCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /platform/solicitation-cases/{caseId}/investigate"
        actor: TrustInvestigator
        preconditions: []
        side_effects: []

      - from: INVESTIGATING
        to: CONFIRMED
        trigger: "POST /platform/solicitation-cases/{caseId}/confirm"
        actor: TrustInvestigator
        preconditions:
          - "investigator X-User-ID != case.reporter_user_id (segregation of duties)"
        side_effects:
          - "For each target review: evidence_confirmed = true; if recommendation_state == DISPLAYED: -> REMOVED and page.displayed_review_count -= 1 and avg recomputed; if FILTERED or PENDING: -> REMOVED"
          - "confirmed_review_count = number of target reviews so marked"
          - "For each distinct author of a confirmed review: author.strike_count += 1"
          - "Cascade A hop 2: any author whose strike_count crosses >= 2 has ALL their other reviews (any page) force-flagged: recommendation_state -> FILTERED unless already REMOVED (DISPLAYED ones decrement their pages' displayed_review_count and recompute avg)"
          - "Cascade A hop 3: ConsumerAlert auto-placed on page_id with kind=SOLICITATION_EVIDENCE, case_id=this case, status=ACTIVE, review_cooldown_until = now + 30d (unless an ACTIVE alert with kind=SOLICITATION_EVIDENCE already exists for this page)"

      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /platform/solicitation-cases/{caseId}/dismiss"
        actor: TrustInvestigator
        preconditions: []
        side_effects: []

  - entity: ConsumerAlert
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /platform/consumer-alerts/{alertId}/lift"
        actor: SupportAdmin
        preconditions:
          - "if alert.case_id is not null: that SolicitationCase.status must be DISMISSED"
        side_effects:
          - "lifted_by_admin_id = admin id"
          - "review_cooldown_until no longer enforced"

  - entity: AdCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /platform/ad-campaigns/{campaignId}/activate"
        actor: Advertiser
        preconditions:
          - "ad_account.status == ACTIVE"
          - "actor X-User-ID == ad_account.owner_user_id"
          - "starts_on <= logical today <= ends_on"
        side_effects: []

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /platform/ad-campaigns/{campaignId}/pause"
        actor: Advertiser
        preconditions:
          - "actor X-User-ID == ad_account.owner_user_id"
        side_effects: []

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /platform/ad-campaigns/{campaignId}/activate (resume; cyclic)"
        actor: Advertiser
        preconditions:
          - "ad_account.status == ACTIVE"
          - "logical today <= ends_on"
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (logical date advances past ends_on)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: COMPLETED
        trigger: "system (logical date advances past ends_on)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /platform/ad-campaigns/{campaignId}/cancel"
        actor: Advertiser
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /platform/ad-campaigns/{campaignId}/cancel"
        actor: Advertiser
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /platform/ad-campaigns/{campaignId}/cancel"
        actor: Advertiser
        preconditions: []
        side_effects: []

  - entity: AdAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /platform/ad-accounts/{accountId}/suspend (ops), or system on PageClaim TRANSFER approval, or system on page CLOSED"
        actor: SupportAdmin
        preconditions: []
        side_effects:
          - "All ACTIVE AdCampaigns on this account -> PAUSED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /platform/ad-accounts/{accountId}/reactivate"
        actor: Advertiser
        preconditions:
          - "actor X-User-ID == ad_account.owner_user_id"
          - "page.status == ACTIVE"
        side_effects: []
        note: "Campaigns stay PAUSED; each must be individually re-activated (cyclic transition)."

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /platform/ad-accounts/{accountId}/close"
        actor: Advertiser
        preconditions:
          - "actor X-User-ID == ad_account.owner_user_id"
        side_effects:
          - "All DRAFT/ACTIVE/PAUSED campaigns -> CANCELLED"

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /platform/ad-accounts/{accountId}/close"
        actor: Advertiser
        preconditions:
          - "actor X-User-ID == ad_account.owner_user_id"
        side_effects:
          - "All DRAFT/ACTIVE/PAUSED campaigns -> CANCELLED"

  - entity: IdentityRequest
    initial_state: RECEIVED
    terminal_states: [RELEASED, DECLINED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /platform/identity-requests/{requestId}/start-review"
        actor: LegalOps
        preconditions:
          - "channel == MEDIA: rejected at intake instead (see validations) — only LEGAL_SUBPOENA / LAW_ENFORCEMENT reach here"
        side_effects: []

      - from: UNDER_REVIEW
        to: NOTICE_SENT
        trigger: "POST /platform/identity-requests/{requestId}/send-notice (LEGAL_SUBPOENA only)"
        actor: LegalOps
        preconditions:
          - "channel == LEGAL_SUBPOENA"
        side_effects:
          - "notice_sent_at = now; notice_deadline = now + 14d"

      - from: NOTICE_SENT
        to: RELEASED
        trigger: "POST /platform/identity-requests/{requestId}/release after notice_deadline"
        actor: LegalOps
        preconditions:
          - "logical now >= notice_deadline"
        side_effects: []

      - from: UNDER_REVIEW
        to: RELEASED
        trigger: "POST /platform/identity-requests/{requestId}/release (LAW_ENFORCEMENT only — no notice required)"
        actor: LegalOps
        preconditions:
          - "channel == LAW_ENFORCEMENT"
        side_effects: []

      - from: RECEIVED
        to: DECLINED
        trigger: "POST /platform/identity-requests/{requestId}/decline"
        actor: LegalOps
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /platform/identity-requests/{requestId}/decline"
        actor: LegalOps
        preconditions: []
        side_effects: []

      - from: NOTICE_SENT
        to: DECLINED
        trigger: "POST /platform/identity-requests/{requestId}/decline (e.g., subpoena quashed during notice period)"
        actor: LegalOps
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /platform/identity-requests/{requestId}/withdraw"
        actor: LegalOps
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /platform/identity-requests/{requestId}/withdraw"
        actor: LegalOps
        preconditions: []
        side_effects: []

  - entity: BusinessPage
    initial_state: ACTIVE
    terminal_states: [CLOSED, MERGED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /platform/business-pages/{pageId}/close"
        actor: SupportAdmin
        preconditions: []
        side_effects:
          - "AdAccount (if any) -> SUSPENDED; its ACTIVE campaigns -> PAUSED"
          - "PageClaims in SUBMITTED/VERIFIED on this page -> EXPIRED"
          - "Existing reviews remain queryable; new reviews rejected (ERR_PAGE_NOT_ACTIVE)"

      - from: ACTIVE
        to: MERGED
        trigger: "POST /platform/merge-requests/{mergeRequestId}/execute where this page is duplicate_page_id"
        actor: SupportAdmin
        preconditions:
          - "duplicate_page.status == ACTIVE; survivor_page.status == ACTIVE"
          - "duplicate_page_id != survivor_page_id"
        side_effects:
          - "duplicate.merged_into_id = survivor.id"
          - "Cascade B hop 1: every review with page_id == duplicate.id is re-pointed to survivor.id preserving recommendation_state; survivor.displayed_review_count and displayed_rating_avg_x100 recomputed over union; duplicate.displayed_review_count = 0"
          - "Cascade B hop 2: duplicate's AdAccount (if any) -> CLOSED and its DRAFT/ACTIVE/PAUSED campaigns -> CANCELLED"
          - "Cascade B hop 3: duplicate's ACTIVE ConsumerAlerts -> LIFTED; duplicate's SUBMITTED/VERIFIED PageClaims -> EXPIRED; duplicate's PENDING MergeRequests (as duplicate or survivor) -> REJECTED"
          - "Reviews on survivor page authored by survivor page's owner remain governed by solicitation rules unchanged"

  - entity: MergeRequest
    initial_state: PENDING
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /platform/merge-requests/{mergeRequestId}/execute"
        actor: SupportAdmin
        preconditions:
          - "no other PENDING MergeRequest references either page"
        side_effects:
          - "drives BusinessPage ACTIVE -> MERGED cascade (see BusinessPage machine)"
          - "decided_by_admin_id = admin id"

      - from: PENDING
        to: REJECTED
        trigger: "POST /platform/merge-requests/{mergeRequestId}/reject, or system cascade when a referenced page is merged by another request"
        actor: SupportAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: claim-approve-stale-page
    parent_entity: BusinessPage
    write_endpoint: "POST /platform/page-claims/{claimId}/approve"
    occ_field: "expected_page_version"
    description: |
      Approving a verified PageClaim against a BusinessPage whose version has
      advanced since the admin last observed it is rejected. This captures the
      case where another writer has just approved a different claim (or a merge
      re-pointed the page) and the current admin's view of the page is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: info-update-stale-page
    parent_entity: BusinessPage
    write_endpoint: "PATCH /platform/business-pages/{pageId}"
    occ_field: "expected_page_version"
    description: |
      An owner info update carrying an expected_page_version that does not match
      the page's current version is rejected; the owner must re-read the page
      and retry against the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: merge-execute-stale-duplicate
    parent_entity: BusinessPage
    write_endpoint: "POST /platform/merge-requests/{mergeRequestId}/execute"
    occ_field: "expected_duplicate_page_version"
    description: |
      Executing a MergeRequest carrying an expected_duplicate_page_version that
      does not match the duplicate page's current version is rejected; the admin
      must re-read the duplicate page before executing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: recommendation_scoring
    trigger: "review submission; POST /platform/reviews/{reviewId}/evaluate; any change to author.trust_score or author.status"
    algorithm: weighted_scoring
    formula: |
      base = 300 + 4 * clamp(author.trust_score, 0, 100)          # 300..700
      if author.status == SUSPENDED: base = base - 200
      if review.edited_flag: base = base - 50
      age_days = floor((now - review.submitted_at) / 86400)
      base = base - 2 * min(age_days, 100)
      recommendation_score_x1000 = clamp(base, 0, 1000)
      decision: score >= REC_THRESHOLD (700)  -> DISPLAYED else FILTERED
      (evidence_confirmed == true forces REMOVED instead, never DISPLAYED)
    input_set: "the single Review under evaluation plus its author User; excludes all advertising state (AdAccount/AdCampaign existence MUST NOT enter the score)"
    constants:
      REC_THRESHOLD: 700
      TRUST_WEIGHT: 4
      SUSPENDED_PENALTY: 200
      EDIT_PENALTY: 50
      AGE_DECAY_PER_DAY: 2
      AGE_DECAY_CAP_DAYS: 100
    precision: "integer per-mille; no rounding"
    variants:
      - name: at_submission
        when: "computed at POST /platform/reviews using submitted_at == now (age_days = 0)"
        difference: "no age decay term"
      - name: re_evaluation
        when: "computed at POST /platform/reviews/{id}/evaluate at the current logical time"
        difference: "age decay applied; edited_flag penalty applied if the review was edited"

  - name: trust_score_update
    trigger: "SolicitationCase CONFIRMED (per confirmed review author); ContentModerator resolve with action=REMOVE_REVIEW"
    algorithm: aggregation
    formula: |
      on solicitation confirm (per distinct author of a confirmed review):
        author.trust_score = clamp(author.trust_score - 15, 0, 100)
        author.strike_count += 1
        if author.strike_count >= STRIKE_ESCALATION (2):
          force-flag cascade (see SolicitationCase CONFIRMED side effects, hop 2)
      on complaint-driven REMOVE_REVIEW:
        author.trust_score = clamp(author.trust_score - 5, 0, 100)
    input_set: "distinct authors of the affected reviews"
    constants:
      STRIKE_TRUST_PENALTY: 15
      REMOVAL_TRUST_PENALTY: 5
      STRIKE_ESCALATION: 2
    precision: "integer; clamped [0,100]"
    variants:
      - name: strike_path
        when: "trust change caused by a confirmed SolicitationCase"
        difference: "-15 per author and strike_count incremented; may trigger force-flag cascade"
      - name: removal_path
        when: "trust change caused by complaint RESOLVED_ACTIONED with REMOVE_REVIEW"
        difference: "-5 per removed review; no strike_count change; no cascade"

  - name: displayed_rating_average
    trigger: "any review enters or leaves recommendation_state == DISPLAYED on a page (evaluate, resolve RESTORE/REMOVE, merge re-pointing, force-flag cascade, solicitation confirm)"
    algorithm: aggregation
    formula: |
      displayed_review_count = count(reviews where page_id == P and recommendation_state == DISPLAYED)
      if displayed_review_count == 0:
        displayed_rating_avg_x100 = 0
      else:
        displayed_rating_avg_x100 = round_half_up(100 * sum(rating of those reviews) / displayed_review_count)
    input_set: "reviews of page P with recommendation_state == DISPLAYED only; FILTERED/PENDING/REMOVED excluded"
    precision: "integer x100; round_half_up at the final division only (sum first, then divide, then round — never round per-review)"
    variants: []

  - name: ad_spend_and_budget
    trigger: "POST /platform/ad-accounts/{accountId}/impressions; POST /platform/ad-accounts/{accountId}/call-events"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
        1. candidate_cost = campaign.bid_cents   (per impression; per qualified call)
        2. if account.spent_today_cents + candidate_cost > account.daily_budget_cents:
             reject ERR_BUDGET_EXCEEDED  (boundary: equality is ALLOWED — spend may land exactly on the cap)
        3. account.spent_today_cents += candidate_cost
      spent_today_cents resets to 0 when the logical UTC date rolls over
      (midnight rollover applied lazily on the next charge or read).
    input_set: "single charge attempt against the account's current-day accumulator"
    constants:
      CALL_MIN_DURATION_S: 30
    precision: "integer cents"
    variants:
      - name: impression_charge
        when: "kind == SPONSORED_PLACEMENT serving"
        difference: "every non-duplicate impression charges bid_cents"
      - name: call_charge
        when: "kind == CALL_TRACKING attribution"
        difference: "only qualified calls (duration_seconds >= 30) charge bid_cents; unqualified calls record cost 0 and never touch the budget"

  - name: attribution_window
    trigger: "POST /platform/ad-accounts/{accountId}/call-events; AttributionReport generation"
    algorithm: chronological
    formula: |
      A call event is attributable to a CALL_TRACKING campaign iff called_at's
      calendar date falls within [campaign.starts_on, campaign.ends_on] (inclusive
      both ends).
      Report variants:
        STRICT:   qualified_calls counts CallTrackEvents whose called_at date IN [period_start, period_end] (call-time window).
        EXTENDED: qualified_calls counts CallTrackEvents whose called_at date IN [period_start - ATT_WINDOW_D days, period_end] (lookback-extended window).
      The two variants produce different counts whenever qualified calls exist in
      [period_start - 30d, period_start - 1d].
      Ties/multiple campaigns: caller_number attribution is pinned by the request's
      campaign_id — no selector ambiguity.
    input_set: "CallTrackEvents for the given campaign_id, filtered by the variant's date window"
    constants:
      ATT_WINDOW_D: 30
    precision: "integer counts; dates compared at calendar-day granularity (logical clock)"
    variants:
      - name: strict_window
        when: "AttributionReport.variant == STRICT"
        difference: "window is [period_start, period_end]"
      - name: extended_window
        when: "AttributionReport.variant == EXTENDED"
        difference: "window is [period_start - 30d, period_end]; superset of STRICT"

  - name: merge_rating_recompute
    trigger: "MergeRequest EXECUTED"
    algorithm: aggregation
    formula: |
      After re-pointing duplicate's reviews to survivor:
        survivor.displayed_review_count = count(DISPLAYED reviews over union of both pages' reviews)
        survivor.displayed_rating_avg_x100 = round_half_up(100 * sum(rating over union DISPLAYED) / count) or 0 if count == 0
        duplicate.displayed_review_count = 0; duplicate.displayed_rating_avg_x100 = 0
      Reviews that were REMOVED stay REMOVED; evidence_confirmed flags travel with the review.
    input_set: "all reviews of both pages after re-pointing, status filter DISPLAYED"
    precision: "integer x100; round_half_up, single final rounding"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; missing or unknown role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID header present; required for all roles except PlatformOps clock/ops endpoints still require it"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path id exists (validated left-to-right); unknown id"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every body FK reference exists (page_id, campaign_id, review_id, case_id, subject_user_id, duplicate/survivor ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 6
    category: business_constraint
    check: "Malformed payload: missing required field, wrong type, enum outside declared set, text below min length, rating outside [1,5], ends_on < starts_on"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 7
    category: state
    check: "Target resource state permits the operation per §1.2 (e.g., evaluate on REMOVED review, verify on non-SUBMITTED claim, release before NOTICE_SENT, resolve on terminal complaint)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all"

  - priority: 8
    category: business_referential
    check: "Review submission: page.status == ACTIVE and no ACTIVE ConsumerAlert with review_cooldown_until > now on that page"
    error_id: ERR_PAGE_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /platform/business-pages/{pageId}/reviews"]

  - priority: 9
    category: business_referential
    check: "Review submission: author (X-User-ID user).status == ACTIVE"
    error_id: ERR_USER_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /platform/business-pages/{pageId}/reviews"]

  - priority: 10
    category: business_safety
    check: "Review submission: solicitation prohibition — author must not be the page's claimed owner, and author must not have an OPEN or INVESTIGATING SolicitationCase targeting their prior reviews on this same page"
    error_id: ERR_SOLICITATION_SUSPECT
    http_status: 422
    applies_to: ["POST /platform/business-pages/{pageId}/reviews"]

  - priority: 11
    category: business_referential
    check: "PageClaim create: kind == CLAIM requires page unclaimed; kind == TRANSFER requires page claimed by someone other than claimant; page.status == ACTIVE; no other SUBMITTED/VERIFIED claim open on the page"
    error_id: ERR_CLAIM_CONFLICT
    http_status: 409
    applies_to: ["POST /platform/business-pages/{pageId}/claims"]

  - priority: 12
    category: business_temporal
    check: "PageClaim verify within VERIFY_TTL_D 7 days of claim.created_at (logical clock)"
    error_id: ERR_VERIFICATION_EXPIRED
    http_status: 410
    applies_to: ["POST /platform/page-claims/{claimId}/verify"]

  - priority: 13
    category: business_temporal
    check: "Review edit within EDIT_WINDOW_H 72 hours of submitted_at (logical clock)"
    error_id: ERR_EDIT_WINDOW_EXPIRED
    http_status: 410
    applies_to: ["PATCH /platform/reviews/{reviewId}"]

  - priority: 14
    category: business_referential
    check: "AdAccount create: page claimed and X-User-ID == page.claimed_by_user_id; page does not already have an ad_account"
    error_id: ERR_AD_ACCOUNT_CONFLICT
    http_status: 409
    applies_to: ["POST /platform/business-pages/{pageId}/ad-account"]

  - priority: 15
    category: business_constraint
    check: "Campaign create: kind == CALL_TRACKING requires call_tracking_enabled == true; kind == SPONSORED_PLACEMENT requires call_tracking_enabled == false"
    error_id: ERR_CAMPAIGN_CONFIG
    http_status: 422
    applies_to: ["POST /platform/ad-accounts/{accountId}/campaigns"]

  - priority: 16
    category: business_temporal
    check: "Campaign activate: starts_on <= logical today <= ends_on (resume requires today <= ends_on)"
    error_id: ERR_CAMPAIGN_OUT_OF_WINDOW
    http_status: 409
    applies_to: ["POST /platform/ad-campaigns/{campaignId}/activate"]

  - priority: 17
    category: business_fiscal
    check: "Charge attempt: spent_today_cents + candidate_cost <= daily_budget_cents (equality allowed)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: ["POST /platform/ad-accounts/{accountId}/impressions", "POST /platform/ad-accounts/{accountId}/call-events"]

  - priority: 18
    category: business_constraint
    check: "Impression idempotency: idempotency_key reused within the same ad_account_id returns the original event without charging again; same key with a different campaign_id is a conflict"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: ["POST /platform/ad-accounts/{accountId}/impressions"]

  - priority: 19
    category: business_temporal
    check: "Call event: called_at date within [campaign.starts_on, campaign.ends_on] inclusive"
    error_id: ERR_ATTRIBUTION_WINDOW
    http_status: 422
    applies_to: ["POST /platform/ad-accounts/{accountId}/call-events"]

  - priority: 20
    category: business_referential
    check: "Call event: campaign.kind == CALL_TRACKING and campaign.status == ACTIVE"
    error_id: ERR_CAMPAIGN_NOT_CALL_TRACKING
    http_status: 422
    applies_to: ["POST /platform/ad-accounts/{accountId}/call-events"]

  - priority: 21
    category: business_referential
    check: "Complaint create: filer X-User-ID == page.claimed_by_user_id; review.page_id == page; kind == FILTERED_DISPUTE requires review.recommendation_state == FILTERED; no OPEN/UNDER_REVIEW/ESCALATED complaint already on the same review"
    error_id: ERR_COMPLAINT_CONFLICT
    http_status: 409
    applies_to: ["POST /platform/business-pages/{pageId}/complaints"]

  - priority: 22
    category: state
    check: "Complaint resolve with action=UPHOLD_FILTER on FILTERED_DISPUTE: review still FILTERED at resolve time"
    error_id: ERR_REVIEW_STATE_CHANGED
    http_status: 409
    applies_to: ["POST /platform/complaints/{complaintId}/resolve"]

  - priority: 23
    category: business_referential
    check: "SolicitationCase create: 1..10 distinct target reviews, all with page_id == case page, none REMOVED"
    error_id: ERR_CASE_TARGETS_INVALID
    http_status: 422
    applies_to: ["POST /platform/business-pages/{pageId}/solicitation-cases"]

  - priority: 24
    category: business_safety
    check: "Segregation of duties: ContentModerator deciding a complaint must not be its filer; TrustInvestigator confirming a case must not be its reporter"
    error_id: ERR_SELF_ACTION
    http_status: 403
    applies_to: ["POST /platform/complaints/{complaintId}/start-review", "POST /platform/solicitation-cases/{caseId}/confirm"]

  - priority: 25
    category: business_referential
    check: "ConsumerAlert place: kind == SOLICITATION_EVIDENCE requires case_id referencing a CONFIRMED case on this page; no ACTIVE alert of the same kind already on the page"
    error_id: ERR_ALERT_CONFLICT
    http_status: 409
    applies_to: ["POST /platform/business-pages/{pageId}/consumer-alerts"]

  - priority: 26
    category: business_referential
    check: "ConsumerAlert lift: if case_id set, referenced case must be DISMISSED"
    error_id: ERR_ALERT_CASE_ACTIVE
    http_status: 409
    applies_to: ["POST /platform/consumer-alerts/{alertId}/lift"]

  - priority: 27
    category: business_constraint
    check: "IdentityRequest create: channel == MEDIA is refused at intake (policy: media requests never disclose); legal_process_ref required for LEGAL_SUBPOENA and LAW_ENFORCEMENT and must be absent for MEDIA"
    error_id: ERR_MEDIA_REQUEST_REFUSED
    http_status: 422
    applies_to: ["POST /platform/identity-requests"]

  - priority: 28
    category: business_temporal
    check: "IdentityRequest release on LEGAL_SUBPOENA path: logical now >= notice_deadline"
    error_id: ERR_NOTICE_PERIOD_ACTIVE
    http_status: 409
    applies_to: ["POST /platform/identity-requests/{requestId}/release"]

  - priority: 29
    category: business_referential
    check: "MergeRequest create: both pages exist, both ACTIVE, duplicate_page_id != survivor_page_id, no PENDING merge references either page"
    error_id: ERR_MERGE_CONFLICT
    http_status: 409
    applies_to: ["POST /platform/merge-requests"]

  - priority: 30
    category: business_referential
    check: "Review immutability of evidence: any transition to DISPLAYED forbidden when evidence_confirmed == true"
    error_id: ERR_REVIEW_EVIDENCE_LOCKED
    http_status: 409
    applies_to: ["POST /platform/reviews/{reviewId}/evaluate", "POST /platform/complaints/{complaintId}/resolve"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Ops / test-driving ---
  - method: POST
    path: "/platform/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock applies lazy time-based effects: PageClaim SUBMITTED expiry past created_at+7d, AdCampaign auto-COMPLETED past ends_on, spent_today_cents reset on UTC date rollover."
    roles: [PlatformOps]
    code: 200
    input: [to_iso8601]
    output: { now: datetime }
