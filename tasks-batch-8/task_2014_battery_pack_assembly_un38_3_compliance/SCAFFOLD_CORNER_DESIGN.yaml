          trigger:
            # Construct inputs that yield exactly 85.0 in final variant:
            # T1=10*s_T1, T2=15*s_T2, T3=12*s_T3, T4=13*s_T4, T5..T8 booleans
            # Set all booleans true → 50. Need T1+T2+T3+T4 = 35.
            # Choose s_T1=1 (alt=11.6), s_T2=1 (cycles=10), s_T3=0.5 (vib=90), s_T4 = (35 - 10 - 15 - 6)/13 = 4/13 ≈ 0.3077
            # s_T4 = shock_g/150 → shock_g = 150 * 4/13 = 46.1538... — too fragile.
            # Simpler: alt=11.6 (10), cycles=10 (15), vib=90 (6), shock=150 (13) → 44 + booleans 50 = 94. Too high.
            # Try: alt=5.8 → 5; cycles=10 → 15; vib=180 → 12; shock=150 → 13 → 45 + booleans 40 (one false) — final variant zeroes on false.
            # Use TRUE booleans but smaller numeric: alt=11.6 (10), cycles=10 (15), vib=0 (0), shock=0 (0) → 25 + 50 = 75. Too low.
            # Need exactly 85: numerics sum to 35. Choose alt=5.8 (5), cycles=10 (15), vib=90 (6), shock=(35-5-15-6)*150/13 = 9*150/13 = 103.846...
            # Rounding makes exact equality fragile — assert against rounded 2-decimal value.
            # Easier: use only T2 varying. cycles=10 → 15. Set alt=11.6 (10), vib=180 (12), shock=150 (13) → 35 already from numerics 10+15+12+13=50. So 50+50=100.
            # To get 85: numerics must be 35. alt=11.6 (10) + cycles=10 (15) + vib=90 (6) + shock=0 (0) = 31 → 81. alt=11.6+cycles=10+vib=180 (12)+shock=(35-37)=negative. Let me recompute.
            # Actually w.T1+w.T2+w.T3+w.T4 = 10+15+12+13 = 50. Need numeric total=35.
            # Use alt=11.6 (10), cycles=0 (0), vib=180 (12), shock=150 (13) → 35. + 50 booleans = 85. YES.
            - call: "PUT /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}"
              payload:
                expected_pack_version: "${pack_v0} + 3"
