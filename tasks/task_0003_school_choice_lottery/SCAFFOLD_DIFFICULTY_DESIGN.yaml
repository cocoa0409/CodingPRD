              payload: {}
              as: Guardian
              as_user_id: "${fam_iv1}"
            - call: "POST /lottery/applications"
              payload: { window_id: "${w19_id}", student_id: "${stu_i3}", school_id: "${s19_id}", choice_rank: 1 }
              as: Guardian
              as_user_id: "${fam_iv1}"
              captures: { ai3: $.data.id }
            - call: "POST /lottery/applications/${ai3}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${fam_iv1}"
            - call: "POST /lottery/applications"
              payload: { window_id: "${w19_id}", student_id: "${stu_i4}", school_id: "${s19_id}", choice_rank: 1 }
              as: Guardian
