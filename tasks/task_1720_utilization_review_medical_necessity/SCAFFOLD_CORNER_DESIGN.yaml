            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-CAD", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 5, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "APPROVE", certified_day_start: 1, certified_day_count: 3 }
              as: PayerReviewer
            - call: "POST /api/authorization-requests/${auth_id}/concurrent-reviews"
              payload: { clinical_update: "Day 2 update: persistent hypoxia, continuing IV therapy.", requested_additional_day_count: 2 }
              as: URNurse
              captures: { cr1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: URDirector
            - call: "POST /api/concurrent-reviews/${cr1}/payer-decision"
              payload: { decision: "APPROVE", approved_day_count: 2, certified_day_start: 4 }
              as: PayerReviewer
          trigger:
            - call: "POST /api/authorization-requests/${auth_id}/concurrent-reviews"
              payload: { clinical_update: "Day 4 update: weaning diuresis, monitoring electrolytes.", requested_additional_day_count: 2 }
              as: URNurse
              captures: { cr2: $.data.id }
          assert:
            - "ConcurrentReview.${cr1}.review_due_at == 2026-08-04T12:00:00Z (approval anchor + 48h)"
            - "ConcurrentReview.${cr2}.review_due_at == 2026-08-05T09:00:00Z (review-1 decided_at 2026-08-03T09:00:00Z + 48h) and sequence_index == 2"

  - section: validations
