              as: SnowmakingSupervisor
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T05:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v}" }
              as: SnowmakingSupervisor
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/seasons/${season_id}"
              payload: {  }
              as: SnowmakingSupervisor
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: SnowmakingSupervisor
            - call: "POST /mountain-ops/snowmaking-sessions"
              payload: { terrain_area_id: "${area_id}", pump_house_id: "${ph1_id}", window_start: "2026-08-01T05:00:00Z", window_end: "2026-08-01T12:00:00Z", gun_count: 30, gpm: 1200, expected_terrain_area_version: "${ta_v}" }
              as: SnowmakingSupervisor
              captures: { sess_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 422 with data.error_id == 'ERR_WINDOW_INVALID' (reversed window)."
            - "Trigger 2: HTTP 422 with data.error_id == 'ERR_WINDOW_INVALID' (zero-length window; the test is strict)."
            - "Trigger 3: the season water_reserved_af == 0.000 and water_used_af == 0.000."
            - "Trigger 4: the area opening_state is still 'CLOSED' and its version is unchanged, so the same expected_terrain_area_version is still valid."
            - "Trigger 5: HTTP 201 with planned_minutes == 420 and water_af_reserved == 1.547, and the area moves CLOSED -> PREP."
            - "The pump house reports peak_committed_gpm == 1200 only after trigger 5."

      - name: energy_windows_must_tile_the_whole_day_exactly_once
        claim_type: aggregate_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_ENERGY_WINDOW_COVERAGE_GAP]
          - entities.SeasonConfig.fields.energy_windows
        distinguishing_aspect: |
          The tiling rule is an aggregate property of the submitted array - no single element is
          malformed in any of the three rejected payloads. A gap (9 to 10 uncovered), an overlap (5 to 6
          covered twice) and a set that does not start at 0 all violate the same rule and must all report
          ERR_ENERGY_WINDOW_COVERAGE_GAP rather than ERR_INVALID_REQUEST, because each element is
          individually schema-valid. Reusing one season_label across all four attempts proves no partial
          season row was persisted by the rejections.
        test_recipe:
          setup:
            - "An empty system with the logical clock set; no seasons exist."
