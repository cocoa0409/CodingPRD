              payload: {}
              as: QualityReviewer
              captures: { q0_rolling: "$.data.rolling_12_month_score", q0_life: "$.data.lifetime_score", q0_recent: "$.data.recent_points" }
            - call: "POST /complaints"
              payload: { interpreter_id: "${i1}", category: "PROFESSIONALISM", severity: "MINOR", narrative: "Late to the courtroom by fifteen minutes." }
              as: QualityReviewer
              as_user_id: "qr-001"
