scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_official_index_diverge_on_asof_date
        grounds:
          - calculations.provisional_handicap_index
          - calculations.official_handicap_index
          - entities.Golfer.fields.handicap_index
          - entities.Golfer.fields.provisional_handicap_index
        distinguishing_aspect: |
          Same five POSTED Scores on slope=113/rating=70 produce provisional_handicap_index=5.0
          (includes the future-dated 2026-04-15 score) but official_handicap_index=14.0 at a
          refresh whose effective_utc=2026-03-31 (which excludes any score with played_on after
          that date) — the two algorithms diverge on the as-of-date inclusion set, on the Golfer
          entity domain.
        test_recipe:
          setup:
            - "Course slope=113, rating=70.0 (so differential == AGS - 70)."
            - "One Golfer with four March 2026 scores (AGS 85,86,87,88 -> diffs 15,16,17,18) and one great April score (played_on 2026-04-15, AGS 75 -> diff 5)."
            - "provisional_handicap_index recomputed live on each post; no refresh yet (handicap_revision=0, handicap_index NULL)."
          setup_api_calls:
            - call: "POST /golf/courses"
              payload: { name: "Flat113", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 10000, offpeak_fee_cents: 6000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "Asof Golfer", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-03-05", adjusted_gross_score: 85 }
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-03-12", adjusted_gross_score: 86 }
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-03-19", adjusted_gross_score: 87 }
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-03-26", adjusted_gross_score: 88 }
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-04-15", adjusted_gross_score: 75 }
              as: ProShop
              captures: { great_score_id: $.data.id }
          trigger:
            - call: "POST /golf/handicap-revisions"
              payload: { effective_utc: "2026-03-31T00:00:00Z" }
              as: ProShop
              captures: { rev_id: $.data.id }
            - call: "GET /golf/golfers/${g_id}"
              payload: {}
              as: ProShop
          assert:
            - "Golfer.${g_id}.provisional_handicap_index == 5.0"
            - "Golfer.${g_id}.handicap_index == 14.0"
            - "Golfer.${g_id}.handicap_revision == 1"

      - name: green_fee_member_discount_rounding_order_divergence
        grounds:
          - calculations.booking_green_fee
          - entities.Booking.fields.green_fee_cents
          - entities.Course.fields.member_discount_pct
        distinguishing_aspect: |
          On offpeak_fee_cents=5005 with member_discount_pct=0.10, the scaffold-pinned order
          (round the 500.5-cent discount to 501 round_half_up, THEN subtract) yields green_fee_cents=4504,
          whereas the rejected order (round 5005*0.90=4504.5 to 4505) yields 4505 — a one-cent divergence
          on the Booking entity domain, distinct from the Golfer-index dual variant above.
        test_recipe:
          setup:
            - "Course with offpeak_fee_cents=5005, member_discount_pct=0.10, peak window 7..15."
            - "One MEMBER golfer; one OFF_PEAK TeeTime (local_hour=18) in the future."
            - "Clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "RoundEdge", course_rating: 71.0, slope_rating: 120, peak_fee_cents: 9000, offpeak_fee_cents: 5005, peak_start_hour: 7, peak_end_hour: 15, member_discount_pct: 0.10 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "Member One", membership_tier: "MEMBER" }
              as: ProShop
              captures: { m_id: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-02T18:00:00Z", local_hour: 18, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, tt_v: $.data.version }
          trigger:
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${m_id}", expected_tee_time_version: "${tt_v}" }
              as: Golfer
              as_user_id: "${m_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.pricing_tier == OFF_PEAK"
            - "Booking.${bk_id}.green_fee_cents == 4504"
            - "Booking.${bk_id}.status == CONFIRMED"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: official_index_soft_then_hard_cap_clamp
        grounds:
          - calculations.official_handicap_index
          - entities.Golfer.fields.low_handicap_index
          - entities.Golfer.fields.handicap_index
          - state_machines.Score.POSTED_to_VOID
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with conditional branches and nested clamp: with
          low_handicap_index=1.0 and base=18.0, soft cap maps to 1.0+3.0+(18.0-4.0)*0.5=11.0,
          then hard cap min(11.0, 1.0+5.0)=6.0; the hard ceiling binds, so official_handicap_index=6.0
          not the uncapped 18.0.
        test_recipe:
          setup:
            - "Course slope=113, rating=70.0."
            - "Golfer posts three great March scores (AGS 73,74,75 -> diffs 3,4,5); first refresh effective 2026-03-31 yields base 1.0, no anchor, so official=1.0 and low_handicap_index seeded to 1.0."
            - "All three great scores are then VOIDed; golfer posts three bad April scores (AGS 90,91,92 -> diffs 20,21,22)."
            - "A second refresh effective 2026-04-30 sees only the three bad scores (base 18.0) and applies soft then hard cap against low=1.0."
          setup_api_calls:
            - call: "POST /golf/courses"
              payload: { name: "CapCourse", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 10000, offpeak_fee_cents: 6000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "Cap Golfer", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-03-05", adjusted_gross_score: 73 }
              as: ProShop
              captures: { s1: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-03-12", adjusted_gross_score: 74 }
              as: ProShop
              captures: { s2: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-03-19", adjusted_gross_score: 75 }
              as: ProShop
              captures: { s3: $.data.id }
            - call: "POST /golf/handicap-revisions"
              payload: { effective_utc: "2026-03-31T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/scores/${s1}/void"
              payload: {}
              as: ProShop
            - call: "POST /golf/scores/${s2}/void"
              payload: {}
              as: ProShop
            - call: "POST /golf/scores/${s3}/void"
              payload: {}
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-04-05", adjusted_gross_score: 90 }
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-04-12", adjusted_gross_score: 91 }
              as: ProShop
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-04-19", adjusted_gross_score: 92 }
              as: ProShop
          trigger:
            - call: "POST /golf/handicap-revisions"
              payload: { effective_utc: "2026-04-30T00:00:00Z" }
              as: ProShop
            - call: "GET /golf/golfers/${g_id}"
              payload: {}
              as: ProShop
          assert:
            - "Golfer.${g_id}.low_handicap_index == 1.0"
            - "Golfer.${g_id}.handicap_index == 6.0"
            - "Golfer.${g_id}.handicap_revision == 2"

      - name: green_fee_rounding_order_pinned_round_then_subtract
        grounds:
          - calculations.booking_green_fee
          - entities.Booking.fields.green_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: round(5005*0.10)=501 then 5005-501=4504
          is pinned; the sum-then-round alternative round(5005*0.90)=4505 is rejected. green_fee_cents
          MUST equal 4504 (a different combinatorial mode than the cap-clamp instance above).
        test_recipe:
          setup:
            - "Course offpeak_fee_cents=5005, member_discount_pct=0.10; MEMBER golfer; OFF_PEAK slot local_hour=20."
            - "Clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "RoundEdge2", course_rating: 71.0, slope_rating: 120, peak_fee_cents: 9000, offpeak_fee_cents: 5005, member_discount_pct: 0.10 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "Member Two", membership_tier: "MEMBER" }
              as: ProShop
              captures: { m_id: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-03T20:00:00Z", local_hour: 20, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, tt_v: $.data.version }
          trigger:
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${m_id}", expected_tee_time_version: "${tt_v}" }
              as: Golfer
              as_user_id: "${m_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.green_fee_cents == 4504"
            - "Booking.${bk_id}.pricing_tier == OFF_PEAK"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: teetime_open_full_open_cycle_on_cancel_no_standby
        grounds:
          - state_machines.TeeTime.OPEN_to_FULL
          - state_machines.TeeTime.FULL_to_OPEN
          - entities.TeeTime.fields.status
          - entities.TeeTime.fields.confirmed_count
        distinguishing_aspect: |
          TeeTime exhibits a cycle OPEN->FULL->OPEN: a TWOSOME fills to capacity (FULL), and a
          single CONFIRMED cancel with no STANDBY queued returns it to OPEN — a non-linear cycle on
          the TeeTime entity (distinct from the Booking branching instance).
        test_recipe:
          setup:
            - "TWOSOME tee time (capacity 2) on a course; two CONFIRMED golfers -> FULL; no standby."
            - "Clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "CycleCourse", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-04T09:00:00Z", local_hour: 9, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id, v1: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gb}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${gb}"
              captures: { bk_b: $.data.id }
          trigger:
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${ga}"
            - call: "GET /golf/tee-times/${tt_id}"
              payload: {}
              as: ProShop
          assert:
            - "TeeTime.${tt_id}.status == OPEN"
            - "TeeTime.${tt_id}.confirmed_count == 1"

      - name: booking_branching_cancel_promote_vs_reopen
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.STANDBY_to_CONFIRMED
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Booking is branching fork-join: a CONFIRMED->CANCELLED transition forks into two divergent
          side-effect sets — (promote a queued STANDBY to CONFIRMED) vs (reopen the slot) — selected by
          whether a STANDBY exists. Here a STANDBY exists, so the promote branch fires (different entity
          than the TeeTime cycle instance).
        test_recipe:
          setup:
            - "TWOSOME slot filled by GA+GB (FULL); GC joins STANDBY (rank 1)."
            - "Clock 2026-06-01T00:00:00Z. PUBLIC golfers, OFF_PEAK slot local_hour=18 on a course with offpeak_fee_cents=5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "BranchCourse", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GC", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gc: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-05T18:00:00Z", local_hour: 18, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id, v1: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gb}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${gb}"
              captures: { bk_b: $.data.id, v2: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gc}", expected_tee_time_version: "${v2}", join_standby: true }
              as: Golfer
              as_user_id: "${gc}"
              captures: { bk_c: $.data.id }
          trigger:
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${ga}"
            - call: "GET /golf/bookings/${bk_c}"
              payload: {}
              as: ProShop
          assert:
            - "Booking.${bk_c}.status == CONFIRMED"
            - "Booking.${bk_c}.green_fee_cents == 5000"
            - "Booking.${bk_c}.standby_rank == 0"
            - "TeeTime.${tt_id}.status == FULL"
            - "TeeTime.${tt_id}.confirmed_count == 2"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_confirmed_promotes_standby_and_prices_it_depth3
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Booking.STANDBY_to_CONFIRMED
          - calculations.standby_priority
          - calculations.booking_green_fee
          - entities.TeeTime.fields.confirmed_count
        distinguishing_aspect: |
          Depth-3 cascade from Booking.cancel: cancel (A) decrements TeeTime.confirmed_count (B);
          that freed seat (B) triggers promotion of the top STANDBY booking to CONFIRMED (C); the
          promotion (C) itself computes the promoted booking's green_fee_cents and re-ranks the
          remaining queue (D). Each link is caused by the prior link, not by the cancel directly.
        test_recipe:
          setup:
            - "TWOSOME slot, GA+GB CONFIRMED (FULL). GC (MEMBER) and GD (PUBLIC) both join STANDBY; GC outranks GD by membership."
            - "PEAK slot local_hour=9 on course peak_fee_cents=8000, member_discount_pct=0.25 -> GC member peak fee = 8000-round(2000)=6000."
            - "Clock 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "CascadeCourse", course_rating: 72.0, slope_rating: 125, peak_fee_cents: 8000, offpeak_fee_cents: 5000, peak_start_hour: 7, peak_end_hour: 15, member_discount_pct: 0.25 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GC", membership_tier: "MEMBER" }
              as: ProShop
              captures: { gc: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GD", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gd: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${course_id}", start_utc: "2026-06-06T09:00:00Z", local_hour: 9, group_type: "TWOSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id, v1: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gb}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${gb}"
              captures: { bk_b: $.data.id, v2: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gd}", expected_tee_time_version: "${v2}", join_standby: true }
              as: Golfer
              as_user_id: "${gd}"
              captures: { bk_d: $.data.id, v3: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gc}", expected_tee_time_version: "${v3}", join_standby: true }
              as: Golfer
              as_user_id: "${gc}"
              captures: { bk_c: $.data.id }
          trigger:
            - call: "POST /golf/bookings/${bk_a}/cancel"
              payload: {}
              as: Golfer
              as_user_id: "${ga}"
            - call: "GET /golf/bookings/${bk_c}"
              payload: {}
              as: ProShop
            - call: "GET /golf/bookings/${bk_d}"
              payload: {}
              as: ProShop
          assert:
            - "Booking.${bk_c}.status == CONFIRMED"
            - "Booking.${bk_c}.green_fee_cents == 6000"
            - "Booking.${bk_d}.status == STANDBY"
            - "Booking.${bk_d}.standby_rank == 1"
            - "TeeTime.${tt_id}.confirmed_count == 2"

      - name: void_score_recomputes_provisional_index_depth2
        grounds:
          - state_machines.Score.POSTED_to_VOID
          - calculations.provisional_handicap_index
          - entities.Golfer.fields.provisional_handicap_index
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (Score.void): voiding a Score (A) flips its status to
          VOID which causes the holder Golfer's provisional_handicap_index recompute (B). Originating
          transition (Score.POSTED->VOID) differs from the cancel-triggered cascade above.
        test_recipe:
          setup:
            - "Course slope=113, rating=70.0. Golfer posts 3 scores AGS 73,80,90 -> diffs 3,10,20; provisional (n=3,k=1,adj=-2.0) = 3.0-2.0 = 1.0."
            - "Voiding the AGS-73 score leaves diffs 10,20 (n=2) -> insufficient data -> provisional NULL."
          setup_api_calls:
            - call: "POST /golf/courses"
              payload: { name: "VoidCourse", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 10000, offpeak_fee_cents: 6000 }
              as: ProShop
              captures: { course_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "Void Golfer", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { g_id: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-05-01", adjusted_gross_score: 73 }
              as: ProShop
              captures: { s_low: $.data.id }
            - call: "POST /golf/scores"
              payload: { golfer_id: "${g_id}", course_id: "${course_id}", played_on: "2026-05-08", adjusted_gross_score: 80 }
              as: ProShop
            - call: "POST /golf/scores"
