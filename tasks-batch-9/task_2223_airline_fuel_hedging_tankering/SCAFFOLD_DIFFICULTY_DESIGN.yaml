            - "TankeringDirective.${dir_id}.status == PROPOSED and pinned_origin_contract_ref is null after the rejection"
            - "after the adjustment: Station.${ord_id}.inventory_gallons == 500000, days_cover == 5.00, supply_posture == WATCH"
