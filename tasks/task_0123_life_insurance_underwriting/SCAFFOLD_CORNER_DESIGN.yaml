              as_user_id: "${u_id}"
              captures: { v1: $.data.version }
          assert:
            - "Application.${app_id}.version == 2 after submit (was 1 at create)"

      - name: issue_cascade_already_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Application.APPROVED_OFFER_to_ISSUED
        excluded_because:
          difficulty_instance: transitive_cascade / issue_cascade_depth3_policy_cashvalue_gross_net
          rationale: "The 3-level issue cascade (Policy -> CashValueEntry -> gross -> net) is fully asserted by the named §1.8 instance."

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_issue_response_reflects_policy_state
        claim_type: immediate
        grounds:
          - state_machines.Application.APPROVED_OFFER_to_ISSUED
          - entities.Policy.fields.gross_cash_value_cents
        excluded_because:
          difficulty_instance: transitive_cascade / issue_cascade_depth3_policy_cashvalue_gross_net
          rationale: "Immediate consistency (the issue response already carries the cascaded gross/net cash value computed in the same request) is asserted by the named §1.8 instance, which captures gross/net directly from the issue response."
