        grounds:
          - 'concurrency_rules[site-approve-stale-season]'
          - 'validations[priority=13]'
        distinguishing_aspect: "Creating a site with expected_season_version one behind the current (bumped by a prior site creation) -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Season DRAFT; version captured at creation; one site created (bumps season version)"]
          setup_api_calls:
            - call: "POST /cookie-program/seasons"
              payload: { code: "COOKIE-2901", name: "S2901", ordering_opens_at: "2027-01-01T00:00:00Z", ordering_closes_at: "2027-02-01T00:00:00Z" }
              as: CouncilAdmin
