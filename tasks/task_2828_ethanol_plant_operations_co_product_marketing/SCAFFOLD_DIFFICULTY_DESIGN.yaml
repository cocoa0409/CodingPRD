  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: track_half_open_windows_adjacent_ok_but_aggregate_capacity_overflow_rejected
        grounds:
          - calculations.track_capacity_commitment
          - validations[priority=50]
          - errors[ERR_TRACK_CAPACITY_EXCEEDED]
          - entities.UnitTrainShipment.fields.window_start
          - entities.UnitTrainShipment.fields.window_end
        distinguishing_aspect: |
          Track windows are half-open [window_start, window_end): a shipment
          starting exactly when another ends does not overlap, so the full
          spot_capacity of 110 railcars is available again at 12:00Z, while a
          one-railcar shipment whose window ends exactly at 12:00Z does overlap
          the earlier reservation and is rejected. The same 12:00:00Z instant is
          therefore free as a start and busy as an end.
        test_recipe:
          setup:
            - "Plant exists; tank T-301 is a DENATURED_E100 tank with 900000.00 gallons; track TRK-A has spot_capacity 110."
            - "The logical clock is 2026-09-05T05:00:00Z and no shipment is loaded, so only the scheduling windows matter."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T05:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 900000.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110, loading_rate_cars_per_hour: 20, is_active: true }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v0: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-A", track_id: "${trk_id}", expected_track_version: "${trk_v0}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 110, gallons_per_railcar: 2659.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { shA_id: $.data.id }
            - call: "GET /ethanol-ops/loading-tracks/${trk_id}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_v1: $.data.version }
          trigger:
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-B", track_id: "${trk_id}", expected_track_version: "${trk_v1}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 110, gallons_per_railcar: 2659.00, window_start: "2026-09-05T12:00:00Z", window_end: "2026-09-05T18:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { shB_id: $.data.id, shB_status: $.data.loading_status }
            - call: "GET /ethanol-ops/loading-tracks/${trk_id}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_v2: $.data.version, committed_after_b: $.data.committed_railcars }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-C", track_id: "${trk_id}", expected_track_version: "${trk_v2}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 1, gallons_per_railcar: 2659.00, window_start: "2026-09-05T11:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${shB_status} == SCHEDULED (window_start 12:00:00Z touches UT-A's window_end and does not overlap it)"
            - "${committed_after_b} == 220 (the running commitment total, not a per-window figure)"
            - "${err_id} == ERR_TRACK_CAPACITY_EXCEEDED with HTTP 422 (UT-C overlaps UT-A's 110 railcars in [11:00, 12:00))"
            - "LoadingTrack.${trk_id}.committed_railcars == 220 after the rejected call"
            - "LoadingTrack.${trk_id}.version == ${trk_v2} after the rejected call"
            - "GET /ethanol-ops/unit-train-shipments?track_id=${trk_id} returns exactly two rows, UT-A and UT-B"

      - name: tank_closed_interval_with_settling_buffer_rejects_touching_reservation
        grounds:
          - calculations.tank_occupancy_conflict
          - validations[priority=48]
          - errors[ERR_TANK_OCCUPANCY_CONFLICT]
          - entities.DenaturantBlend.fields.occupancy_end
          - entities.ProductTank.fields.settling_buffer_minutes
        distinguishing_aspect: |
          Tank occupancy is the opposite shape from track capacity: the interval
          is closed [window_start, occupancy_end] and occupancy_end is
          window_end pushed out by settling_buffer_minutes, so a blend whose
          window_start is exactly 2026-09-04T14:00:00Z collides with a blend
          ending at 12:00:00Z plus a 120-minute buffer, while 14:01:00Z is free.
          Touching is a conflict here and is not a conflict on the track.
        test_recipe:
          setup:
            - "Plant exists; tanks T-101 (ETHANOL_200_PROOF, 500000.00 gallons), T-201 (DENATURANT, 500000.00 gallons) and T-301 (DENATURED_E100, 0.00 gallons, settling_buffer_minutes 120) exist."
            - "The logical clock is 2026-09-04T06:00:00Z."
            - "Blend BL-1 is SCHEDULED into T-301 over 2026-09-04T08:00:00Z to 2026-09-04T12:00:00Z with 2565.00 neat and 60.00 denaturant gallons (denaturant_pct 0.022857, inside the band), and is left unexecuted."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T06:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 600000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 0.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "GET /ethanol-ops/product-tanks/${t301_id}"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_v0: $.data.version }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v0}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T08:00:00Z", window_end: "2026-09-04T12:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl1_id: $.data.id, bl1_occ_end: $.data.occupancy_end }
            - call: "GET /ethanol-ops/product-tanks/${t301_id}"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_v1: $.data.version }
          trigger:
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-2", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v1}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T14:00:00Z", window_end: "2026-09-04T16:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-3", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v1}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T14:01:00Z", window_end: "2026-09-04T16:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl3_id: $.data.id, bl3_occ_end: $.data.occupancy_end, bl3_status: $.data.status }
          assert:
            - "${bl1_occ_end} == 2026-09-04T14:00:00Z (window_end 12:00:00Z plus settling_buffer_minutes 120)"
            - "${err_id} == ERR_TANK_OCCUPANCY_CONFLICT with HTTP 422 (14:00:00Z is inside the closed interval)"
            - "GET /ethanol-ops/product-tanks/${t301_id}/denaturant-blends?status=SCHEDULED returns exactly one row, BL-1, after the rejected call"
            - "${bl3_status} == SCHEDULED and ${bl3_occ_end} == 2026-09-04T18:00:00Z (14:01:00Z clears the buffer by one minute)"
            - "DenaturantBlend.${bl1_id}.status == SCHEDULED and executed_at == null"
            - "ProductTank.${t301_id}.current_gallons == 0.00 (scheduling moves no product)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: shipment_cancel_restores_total_denatured_gallons_invariant
        grounds:
          - state_machines.UnitTrainShipment.loading_status.LOADED_to_CANCELLED
          - state_machines.UnitTrainShipment.billing_status.PENDING_BOL_to_VOIDED
          - entities.ProductTank.fields.current_gallons
          - entities.LoadingTrack.fields.committed_railcars
          - validations[priority=29]
          - errors[ERR_INVALID_SHIPMENT_LOADING_STATE]
        distinguishing_aspect: |
          Cancelling a LOADED shipment must restore T-301 to exactly its
          pre-load 400000.00 gallons and drop all 100 railcars out of the
          track's commitment - and a second cancel must be rejected rather than
          crediting the gallons twice, so the invariant survives the retry.
        test_recipe:
          setup:
            - "Plant exists; tank T-301 is a DENATURED_E100 tank opened with 400000.00 gallons; track TRK-A has spot_capacity 110."
            - "Shipment UT-C001 is SCHEDULED for 100 railcars of 2659.00 gallons (planned_gallons 265900.00) and is then LOADED, leaving T-301 at 134100.00 gallons."
            - "No bill of lading is issued, so no RIN separation is involved in this instance."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T05:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110, loading_rate_cars_per_hour: 20, is_active: true }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v0: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-C001", track_id: "${trk_id}", expected_track_version: "${trk_v0}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 100, gallons_per_railcar: 2659.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id, planned: $.data.planned_gallons }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/load"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { loaded: $.data.loaded_gallons }
            - call: "GET /ethanol-ops/product-tanks/${t301_id}"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { gallons_after_load: $.data.current_gallons }
          trigger:
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/cancel"
              payload: { cancellation_reason: "Terminal outage" }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { loading_after: $.data.loading_status, billing_after: $.data.billing_status }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/cancel"
              payload: { cancellation_reason: "Duplicate cancel" }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${planned} == 265900.00 and ${loaded} == 265900.00 and ${gallons_after_load} == 134100.00"
            - "${loading_after} == CANCELLED and ${billing_after} == VOIDED"
            - "UnitTrainShipment.${sh1_id}.loaded_gallons == null and cancelled_at == 2026-09-05T05:00:00Z"
            - "ProductTank.${t301_id}.current_gallons == 400000.00 (exactly the opening figure, no drift)"
            - "ProductTank.${t301_id}.available_gallons == 600000.00"
            - "LoadingTrack.${trk_id}.committed_railcars == 0"
            - "${err_id} == ERR_INVALID_SHIPMENT_LOADING_STATE with HTTP 409"
            - "After the rejected second cancel, ProductTank.${t301_id}.current_gallons is still 400000.00 and LoadingTrack.${trk_id}.committed_railcars is still 0"

      - name: shipment_cancel_preserves_rin_generated_count_invariant
        grounds:
          - state_machines.RinBatch.status.SEPARATED_to_GENERATED
          - entities.Plant.fields.rin_separated_count
          - entities.Plant.fields.rin_generated_count
          - calculations.rin_separation
          - state_machines.UnitTrainShipment.billing_status.BOL_ISSUED_to_VOIDED
        distinguishing_aspect: |
          Cancelling after the bill of lading must unwind only the separation
          leg: rin_separated_count returns to 0 while rin_generated_count stays
          at 2616, the RinBatch returns to GENERATED with separated_shipment_id
          cleared, and it is then separable again onto a later shipment - which
          proves the reversal restored eligibility rather than merely relabelling
          the row. This is the RIN ledger, a different invariant from the tank
          gallons instance above.
        test_recipe:
          setup:
            - "Plant exists with rin_generation_enabled true; tanks T-101 (ETHANOL_200_PROOF, 0.00), T-201 (DENATURANT, 500000.00) and T-301 (DENATURED_E100, 0.00, settling_buffer_minutes 120) exist."
            - "Contract C-1 is PRICED with one settled 940.00-bushel delivery; batch FB-8001 charges 900.00 bushels at test weight 54.0, gets a healthy reading, distills at 2.850 and completes, producing 2565.00 gallons and one RinBatch of 2616 RINs."
            - "Blend BL-1 moves 2565.00 neat plus 60.00 denaturant gallons into T-301 (2625.00 gallons)."
            - "Shipment UT-D001 on TRK-A loads that 2625.00 gallons and its bill of lading BOL-D001 separates the 2616-RIN batch."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 600000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 0.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
