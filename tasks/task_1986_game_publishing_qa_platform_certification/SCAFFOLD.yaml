  roles:
  - QALead
  code: 201
  input:
  - title_id
  - build_id
  - severity
  - category
  - found_by_vendor_id?
  - regression_of_id?
  - found_post_launch?
  output: BugReport
  side_effects:
  - status = OPEN; title.open_blocker_count recomputed; BLOCKER on a CANDIDATE build fires the demotion cascade hop 1
- method: GET
  path: /qa-cert/bugs/{bugId}
  description: Get a bug
  roles:
  - Any
  code: 200
  input: []
  output: BugReport
  side_effects: []
- method: GET
  path: /qa-cert/bugs
  description: List bugs with filters
  roles:
  - Any
  code: 200
  input:
  - title_id?
  - build_id?
  - severity?
  - status?
  - found_by_vendor_id?
  - regression_of_id?
  output: BugReport[]
  side_effects: []
- method: POST
  path: /qa-cert/bugs/{bugId}/triage
  description: 'Triage: OPEN -> TRIAGED with (possibly new) severity'
  roles:
  - QALead
  code: 200
  input:
  - severity
  - category?
  output: BugReport
  side_effects:
  - severity replaced; BLOCKER escalation fires the build demotion cascade
- method: POST
  path: /qa-cert/bugs/{bugId}/transition
  description: Bug lifecycle incl. REOPENED cycle, WONT_FIX/DUPLICATE resolution
  roles:
  - QALead
  code: 200
  input:
  - to_status
  - resolution?
  - severity?
  output: BugReport
  side_effects:
  - REOPENED increments reopened_count and may fire the blocker cascade with the effective severity
- method: POST
  path: /qa-cert/titles/{titleId}/submission-packages
  description: Assemble a certification submission package (OCC on the title; supersedes an ASSEMBLING sibling for the same platform)
  roles:
  - CertificationLead
  code: 201
  input:
  - platform_code
  - build_id
  - test_plan_id
  - expected_title_version
  - expedited?
  output: SubmissionPackage
  side_effects:
  - 'Gates: title status IN_DEVELOPMENT or CERTIFICATION (ERR_INVALID_STATE); platform_code in title.platform_codes (ERR_INVALID_REQUEST); build
    belongs to the title (ERR_BUILD_TITLE_MISMATCH) and matches platform_code (ERR_BUILD_PLATFORM_MISMATCH) and is CANDIDATE (ERR_BUILD_NOT_CANDIDATE);
    test plan matches (title, platform_code) and is APPROVED or LOCKED (ERR_INVALID_STATE)'
  - status = ASSEMBLING; round computed; ComplianceChecklist seeded from the platform TRC catalog (checklist_id)
  - Prior ASSEMBLING package for the same (title, platform) -> SUPERSEDED
  - Referenced test plan APPROVED/LOCKED -> LOCKED
  - increments GameTitle.version by 1
  - readiness_optimistic_pct / readiness_strict_pct computed
- method: GET
  path: /qa-cert/submission-packages/{packageId}
  description: Get a submission package
  roles:
  - Any
  code: 200
  input: []
  output: SubmissionPackage
  side_effects: []
- method: GET
  path: /qa-cert/submission-packages
  description: List submission packages
  roles:
  - Any
  code: 200
  input:
  - title_id?
  - platform_code?
  - build_id?
  - test_plan_id?
  - status?
  output: SubmissionPackage[]
  side_effects: []
- method: POST
  path: /qa-cert/submission-packages/{packageId}/transition
  description: submit (ASSEMBLING->SUBMITTED, CertificationLead); begin review (SUBMITTED->IN_REVIEW, PlatformReviewer); decide APPROVED/REJECTED
    (PlatformReviewer, not the submitter); withdraw (CertificationLead)
  roles:
  - CertificationLead
  - PlatformReviewer
  code: 200
  input:
  - to_status
  output: SubmissionPackage
  side_effects:
  - Full gate chain + escrow movements per SubmissionPackage machine; decide converts escrow to spent and consumes the build
- method: GET
  path: /qa-cert/compliance-checklists/{checklistId}
  description: Get a checklist with items and counters
  roles:
  - Any
  code: 200
  input: []
  output: ComplianceChecklist
  side_effects: []
- method: GET
  path: /qa-cert/compliance-checklists
  description: List checklists (find a package's checklist)
  roles:
  - Any
  code: 200
  input:
  - submission_package_id?
  output: ComplianceChecklist[]
  side_effects: []
- method: POST
  path: /qa-cert/compliance-checklists/{checklistId}/items/verify
  description: Record verification result for one TRC item
  roles:
  - ComplianceManager
  code: 200
  input:
  - requirement_code
  - result
  output: ComplianceChecklist
  side_effects:
  - Item status updated (re-verify allowed while ASSEMBLING; voids a PENDING waiver to SUPERSEDED); counters + package readiness recomputed; increments
    ComplianceChecklist.version by 1
- method: POST
  path: /qa-cert/compliance-checklists/{checklistId}/items/waive
  description: Request a waiver for a FAILED item (OCC on the checklist; supersedes a PENDING waiver on the same item)
  roles:
  - CertificationLead
  code: 200
  input:
  - requirement_code
  - justification
  - expected_checklist_version
  output: ComplianceChecklist
  side_effects:
  - Item waiver_status -> PENDING (prior PENDING -> SUPERSEDED); increments ComplianceChecklist.version by 1
- method: POST
  path: /qa-cert/compliance-checklists/{checklistId}/items/waiver-decision
  description: Approve (item -> WAIVED) or reject (item stays FAILED) a pending waiver; decider must not be the requester
  roles:
  - ComplianceManager
  code: 200
  input:
  - requirement_code
  - decision
  output: ComplianceChecklist
  side_effects:
  - Per embedded item machine; counters + readiness recomputed; increments ComplianceChecklist.version by 1
- method: POST
  path: /qa-cert/submission-packages/{packageId}/findings
  description: Platform reviewer files a certification finding on a package in IN_REVIEW or REJECTED
  roles:
  - PlatformReviewer
  code: 201
  input:
  - severity
  - requirement_code
  - description
  output: CertFinding
  side_effects:
  - status = OPEN; package must be IN_REVIEW or REJECTED (ERR_PACKAGE_NOT_REVIEWABLE)
- method: GET
  path: /qa-cert/cert-findings/{findingId}
  description: Get a finding
  roles:
  - Any
  code: 200
  input: []
  output: CertFinding
  side_effects: []
- method: GET
  path: /qa-cert/cert-findings
  description: List findings
