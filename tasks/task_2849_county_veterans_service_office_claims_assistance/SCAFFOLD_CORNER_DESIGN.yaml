      - name: corner_evidence_score_precision_and_per_item_rounding
        claim_type: precision
        grounds:
          - calculations.evidence_completeness_pct
        excluded_because:
          difficulty_instance: evidence_completeness_per_item_rounding_order_divergence
          rationale: "That instance pins a four-item set whose per-item ROUND_HALF_UP results sum to 56.49 and score 80.70, while summing at full precision first would produce 80.68, so it verifies both the 2-decimal rounding mode and the mandated rounding order in one assertion."

      - name: corner_performance_score_weighted_scoring
        claim_type: weighted_scoring
        grounds:
          - calculations.outcome_report_performance_score
        excluded_because:
          difficulty_instance: performance_score_claim_weighted_versus_veteran_weighted_divergence
          rationale: "That instance scores the same quarter under both weighting bases and asserts the 1-decimal ROUND_HALF_UP results plus their delta, which covers weight application, accumulation and re-scoring on a basis change."

      - name: corner_ledger_aggregation_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.program_pool_ledger
          - calculations.exam_slot_ledger
        excluded_because:
          difficulty_instance: clawback_returns_program_allocation_to_zero_so_the_next_approval_allocates_exactly_its_own_award
          rationale: "That instance asserts allocated_cents after the add, after the reversal and after a fresh add, which is the aggregation running-total claim for money; the discrete-slot counterpart is asserted by cancelling_an_appointment_frees_the_slot_so_the_same_window_can_be_rebooked_and_closed_out."

      - name: corner_retro_award_tiered_pricing_bands
        claim_type: tiered_pricing
        grounds:
          - calculations.claim_retro_award_cents
        excluded_because:
          difficulty_instance: retro_dependent_add_on_gated_off_below_rating_floor
          rationale: "That instance sits on the rating band boundary where the dependent add-on switches off, asserting the awarded band rate and the suppressed add-on separately, which is the cross-band straddle claim for this schedule."

      - name: corner_state_benefit_waterfall_bands
        claim_type: waterfall_allocation
        grounds:
          - calculations.state_benefit_award_cents
        excluded_because:
          difficulty_instance: state_benefit_admin_fee_band_keyed_on_gross_not_net
          rationale: "That instance drives the exemption product, the CEIL administration fee and the net charged against the pool in one chain and pins the value an implementation keying the fee band on the net award would produce instead."

      - name: corner_eligibility_constraint_propagation_to_benefit_approval
        claim_type: constraint_propagation
        grounds:
          - calculations.eligibility_category_results
          - calculations.veteran_combined_rating_pct
        excluded_because:
          difficulty_instance: benefit_approval_unblocked_only_after_a_second_decision_lifts_the_veteran_combined_rating
          rationale: "That instance follows the constraint chain from a claim decision through the veteran's combined rating to the program's min_rating_pct gate and shows the propagation reaching a fixed point where the previously refused approval succeeds unchanged."

      - name: corner_retro_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.claim_retro_award_cents.variants
        excluded_because:
          difficulty_instance: retro_award_itf_anchored_versus_filed_anchored_divergence
          rationale: "That instance builds two claims that differ only in intent_to_file_date, asserts 2884500 against 769200 and pins the 2115300 delta, which is the variant-divergence claim in full."

      - name: corner_report_variant_selection_by_weighting_basis
        claim_type: variant_selection
        grounds:
          - calculations.outcome_report_performance_score.variants
        excluded_because:
          difficulty_instance: performance_score_claim_weighted_versus_veteran_weighted_divergence
          rationale: "That instance selects each variant explicitly through the compute call's weighting_basis and asserts that the stored weighting_basis matches the figures produced, which is the variant-selection claim."

      - name: corner_rating_reduction_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.veteran_combined_rating_pct
          - calculations.program_pool_ledger
        excluded_because:
          difficulty_instance: revised_decision_cascades_rating_reduction_through_application_to_program_pool
          rationale: "That instance switches the decision behind a frozen rating_at_approval_pct and asserts that the resulting denial removes exactly the previously allocated amount from the program pool, which is the reconciliation-on-switch claim."

