        excluded_because:
          difficulty_instance: oversight_score_of_exactly_seventy_admits_activation
          rationale: "§1.8 pins ERR_OVERSIGHT_SCORE_INSUFFICIENT at 69 against success at exactly 70, so the boundary and the violation are both already covered."

