      - name: malformed_request_shapes_all_collapse_to_invalid_request
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          One error id covers four distinct shape defects: an unknown body field, an enum value outside its
          declared set, a pagination limit above the max of 100, and a datetime that is not ISO 8601 UTC. All four
