  - rule_id: resource_temporal_overlap
    instances:
      - name: nav_period_closed_interval_overlap_versus_adjacent_month
        grounds:
          - calculations.nav_period_coverage
          - errors[ERR_NAV_PERIOD_OVERLAP]
          - entities.NavRecord.fields.period_start_date
          - entities.NavRecord.fields.period_end_date
          - validations[priority=9].error_id
        distinguishing_aspect: |
          NAV valuation periods are CLOSED date intervals, so sharing a single
          endpoint is already a conflict: 2026-08-31..2026-09-30 collides with a
          PUBLISHED 2026-08-01..2026-08-31 record on exactly one calendar day,
          while 2026-09-01..2026-09-30 abuts it with a zero-day gap and is
          accepted — the opposite convention from the half-open repurchase window.
        test_recipe:
          setup:
            - "Offering 'Larkspur Core REIT' EFFECTIVE, escrow BROKEN off a single 30000000-cent class I subscription (300000000 e4 outstanding)."
            - "Clock at 2026-10-02; a NavRecord for 2026-08-01..2026-08-31 already PUBLISHED at 1000 cents per share."
            - "ShareClass.version re-read after that record's creation, since only creation bumps it."
