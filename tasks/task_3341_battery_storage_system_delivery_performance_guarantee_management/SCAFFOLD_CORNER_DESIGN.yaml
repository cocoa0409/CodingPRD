              payload: { outcome: "ACHIEVED", actual_date: "2026-09-01T00:00:00Z" }
              as: ProjectDeveloper
            - call: "POST /projects/${proj_id}/recompute-projection"
              payload: { equivalent_cycles: 0 }
              as: PerformanceEngineer
            - call: "POST /bid-sessions"
              payload: { project_id: "${proj_id}", market: "DAY_AHEAD", window_start: "2026-09-03T00:00:00Z", window_end: "2026-09-03T04:00:00Z", offer_mwh: 20, offer_price_cents_per_mwh: 9000 }
              as: MarketOperator
              captures: { bs1: $.data.id }
            - call: "POST /bid-sessions"
              payload: { project_id: "${proj_id}", market: "DAY_AHEAD", window_start: "2026-09-04T00:00:00Z", window_end: "2026-09-04T04:00:00Z", offer_mwh: 20, offer_price_cents_per_mwh: 9000 }
              as: MarketOperator
              captures: { bs2: $.data.id }
          trigger:
            - call: "POST /bid-sessions/${bs1}/record-clearing"
              payload: { clearing_price_cents_per_mwh: 8999, market_cleared_mwh: 30 }
              as: MarketOperator
            - call: "POST /bid-sessions/${bs1}/settle"
              payload: {}
              as: MarketOperator
            - call: "POST /bid-sessions/${bs2}/record-clearing"
              payload: { clearing_price_cents_per_mwh: 9000, market_cleared_mwh: 30 }
              as: MarketOperator
            - call: "POST /bid-sessions/${bs2}/settle"
              payload: {}
              as: MarketOperator
          assert:
            - "BidSession.${bs1}.cleared_mwh == 0 and revenue_cents == 0 — 8999 < floor 9000 short-circuits before the capacity cap"
            - "BidSession.${bs2}.cleared_mwh == 20 (min(offer 20, min(projected 40, market 30))) and revenue_cents == 180000 (20 * 9000) — the floor is inclusive at 9000"

  # ===========================================================================
  - section: validations
    instances:
      - name: esa_execute_rejects_stale_project_version_with_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[esa-execute-stale-project]
          - errors.ERR_STALE_PROJECT_VERSION
        distinguishing_aspect: "After a sibling mutation bumps Project.version, an execute carrying the pre-mutation version fails 412 ERR_STALE_PROJECT_VERSION; carrying the fresh version succeeds."
        test_recipe:
          setup: ["Project + 3 approved permits + DRAFT ESA. Client captured project version V before a milestone creation bumped nothing — instead a second DRAFT ESA execute bumps Project.version."]
          setup_api_calls:
            - *ck
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa1: $.data.id }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 5, contracted_energy_mwh: 5, guaranteed_capacity_mwh: 4, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 100000, ld_rate_per_day_cents: 10000, ld_cap_cents: 100000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa2: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { v_before: $.data.version }
            - call: "POST /equipment-supply-agreements/${esa2}/execute"
              payload: { expected_project_version: "${v_before}" }
              as: ProjectDeveloper
          trigger:
            - call: "POST /equipment-supply-agreements/${esa1}/execute"
              payload: { expected_project_version: "${v_before}" }
              as: ProjectDeveloper
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_PROJECT_VERSION — ${esa2}'s execute bumped Project.version past v_before"
            - "EquipmentSupplyAgreement.${esa1}.status == DRAFT (rejected, unchanged)"
            - "a retry carrying GET /projects/${proj_id}.version succeeds with 200"

      - name: spare_part_order_rejects_stale_ltsa_version_with_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[ltsa-order-stale-agreement]
          - errors.ERR_STALE_LTSA_VERSION
        distinguishing_aspect: "Order creation with expected_service_agreement_version one behind the current version (an expression over a captured version) fails 412 ERR_STALE_LTSA_VERSION before any credit-pool logic runs."
        test_recipe:
          setup: ["Project; LTSA ACTIVE (pool 600,000, covers_spare_parts)."]
          setup_api_calls:
            - *ck
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: true, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id }
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { ltsa_v: $.data.version }
          trigger:
            - call: "POST /spare-part-orders"
              payload: { service_agreement_id: "${ltsa_id}", part_description: "Contactor", part_cost_cents: 100000, expected_service_agreement_version: "${ltsa_v} - 1" }
              as: ServiceManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_LTSA_VERSION"
            - "ServiceAgreement.${ltsa_id}.credit_drawn_cents == 0 (no draw happened)"

      - name: order_creation_missing_required_field_returns_400
        claim_type: Violation → Error
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations[priority=10]
        distinguishing_aspect: "POST /spare-part-orders without part_cost_cents is 400 ERR_INVALID_REQUEST — request-shape check fires regardless of pool state."
        test_recipe:
          setup: ["Project; LTSA ACTIVE."]
          setup_api_calls:
            - *ck
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: true, start_date: "2026-08-01T00:00:00Z", end_date: "2027-08-01T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id }
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
            - call: "GET /service-agreements/${ltsa_id}"
              payload: {}
              as: ServiceManager
              captures: { ltsa_v: $.data.version }
          trigger:
            - call: "POST /spare-part-orders"
              payload: { service_agreement_id: "${ltsa_id}", part_description: "Missing cost", expected_service_agreement_version: "${ltsa_v}" }
              as: ServiceManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: ltsa_activate_outside_term_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_LTSA_NOT_IN_TERM
          - validations[priority=6]
        distinguishing_aspect: "Activating a DRAFT LTSA whose start_date is in the future relative to the logical clock is 409 ERR_LTSA_NOT_IN_TERM."
        test_recipe:
          setup: ["Project; LTSA with start_date 2027-01-01 (clock still at the 2026-09-01 default)."]
          setup_api_calls:
            - *ck
            - call: "POST /service-agreements"
              payload: { project_id: "${proj_id}", annual_fee_cents: 2000000, covers_monitoring: true, covers_maintenance: true, covers_spare_parts: true, covers_software_updates: true, start_date: "2027-01-01T00:00:00Z", end_date: "2028-01-01T00:00:00Z" }
              as: ServiceManager
              captures: { ltsa_id: $.data.id }
          trigger:
            - call: "POST /service-agreements/${ltsa_id}/activate"
              payload: {}
              as: ServiceManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_LTSA_NOT_IN_TERM"
            - "ServiceAgreement.${ltsa_id}.status == DRAFT"

