  - rule_id: transitive_cascade
    instances:
      - name: grade_shortfall_cascade_order_contract_demotion
        grounds:
          - state_machines.CropBatch.LIFTED_to_GRADED
          - state_machines.Allocation.ACTIVE_to_RELEASED
          - state_machines.SeedlingOrder.ALLOCATED_to_CONFIRMED
          - state_machines.PlantingContract.READY_TO_PLANT_to_BLOCKED
        distinguishing_aspect: |
          Depth-3 cascade triggered by grade: grade posts plantable_count 18500 below reserved 19000 ->
          the newest ACTIVE allocation is released -> the order drops ALLOCATED -> CONFIRMED -> the linked
          READY_TO_PLANT contract flips to BLOCKED. Each hop is caused by the previous mutation, not by the
          grade call directly.
        test_recipe:
          setup:
            - "Batch sown 300 g (projected 19747); order 19000 allocated against the SOWN batch (projection basis)"
            - "Contract requiring 18060 marked READY_TO_PLANT on the strength of that allocation"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-SRC", min_elevation_ft: 1000, max_elevation_ft: 2000 }, as: NurseryManager, captures: { z_src: $.data.id } }
