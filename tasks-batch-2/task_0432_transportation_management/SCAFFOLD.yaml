# =============================================================================
# Transportation Management System (TMS) — benchmark seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  432. Transportation Management System (TMS): order & shipment tendering,
  mode/carrier selection & rate shopping, load consolidation & routing,
  dock/appointment scheduling, in-transit tracking & ETA, freight audit &
  accessorial, claim & OS&D, carrier scorecard & contract rate

domain_name: transportation-management
api_prefix: /tms

# Primary archetype: Pricing engine (rate shopping over contract rates with
# tiered accessorials) blended with a secondary Workflow-orchestration spine
# (order -> shipment -> tender -> load/dock -> in-transit -> audit -> claim).
# Carrier rate-shopping is a Selector-policy layer; freight audit is a
# dual-variant (quoted vs audited) ledger reconciliation. Flat topology: all
# entities are peers linked by foreign keys, discovered via filtered-list GETs.
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # quoted (provisional) vs audited (final) freight cost
    - selector_policy                 # carrier rate-shopping picks one carrier from a candidate pool
    - cascading_side_effects          # shipment cancel -> tender/load/dock/invoice unwinds
    - temporal_windowing              # dock appointment slot overlap per door
    - derived_field_reconciliation    # carrier scorecard recomputed from delivery/claim counters
    - optimistic_concurrency          # OCC on Load.version for consolidation supersede

  entity_topology: flat
  state_machine_shape: parallel       # Shipment carries tender_status x execution_status; plus revert loops on Tender/FreightInvoice
  relationship_patterns:
    - one_to_many                     # Order -> Shipment[], Load -> Shipment[], Shipment -> Tender[]
    - cross_aggregate                 # Shipment references Carrier/ContractRate across aggregates

  role_model: peer_roles              # ShipperOps, CarrierOps, DockOps, FreightAuditor own distinct surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Carrier legal name" }
      - { name: scac, type: string, source: input, description: "Standard Carrier Alpha Code; unique across carriers" }
      - { name: mode, type: enum, source: input, description: "Transport mode this carrier serves: TL | LTL | PARCEL | INTERMODAL" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED. Only ACTIVE carriers may be selected for tender. State machine drives transitions." }
      - { name: delivered_count, type: integer, source: system, default: 0, description: "Count of shipments delivered by this carrier (incremented on each Shipment DELIVERED transition)" }
      - { name: on_time_count, type: integer, source: system, default: 0, description: "Count of shipments delivered on or before promised_eta_minute (incremented on on-time DELIVERED transition)" }
      - { name: claim_count, type: integer, source: system, default: 0, description: "Count of Claims filed against this carrier's shipments (incremented when a Claim is opened)" }
      - { name: on_time_pct, type: number, source: computed, description: "Read-only = round(on_time_count / delivered_count * 100, 2) when delivered_count > 0 else null. See calculations.carrier_scorecard." }
      - { name: scorecard_grade, type: enum, source: computed, description: "Read-only A | B | C | PROBATION derived from on_time_pct and claim ratio. See calculations.carrier_scorecard." }

  - name: ContractRate
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the carrier this contract rate belongs to" }
      - { name: mode, type: enum, source: input, description: "TL | LTL | PARCEL | INTERMODAL; must equal the carrier's mode" }
      - { name: origin_zone, type: string, source: input, description: "Origin zone code this rate covers (e.g. 'Z1')" }
      - { name: dest_zone, type: string, source: input, description: "Destination zone code this rate covers" }
      - { name: base_rate_per_mile_cents, type: integer, source: input, description: "Linehaul rate in integer cents per mile" }
      - { name: min_charge_cents, type: integer, source: input, description: "Minimum linehaul charge in integer cents; floor applied before fuel and accessorials" }
      - { name: fuel_surcharge_pct, type: number, source: input, default: 0, description: "Fuel surcharge as a fraction applied to linehaul, e.g. 0.15 = 15%" }
      - { name: effective_start_minute, type: integer, source: input, description: "CLOSED-interval effective window start as a minute offset from epoch 0; rate is biddable for tenders created at minute t where effective_start_minute <= t <= effective_end_minute" }
      - { name: effective_end_minute, type: integer, source: input, description: "CLOSED-interval effective window end as a minute offset; must be >= effective_start_minute. Window is [effective_start_minute, effective_end_minute] (both endpoints inclusive — distinct from DockAppointment's half-open semantics)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED. RETIRED rates cannot be selected for new tenders. State machine drives transitions." }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_ref, type: string, source: input, description: "External customer reference string" }
      - { name: origin_zone, type: string, source: input, description: "Pickup zone code" }
      - { name: dest_zone, type: string, source: input, description: "Delivery zone code" }
      - { name: weight_lbs, type: integer, source: input, description: "Total order weight in pounds; must be > 0" }
      - { name: declared_value_cents, type: integer, source: input, description: "Declared cargo value in integer cents; used as the claim liability ceiling" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | PLANNED | CLOSED | CANCELLED. PLANNED once a Shipment exists; CLOSED when its shipment is DELIVERED. State machine drives transitions." }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order this shipment fulfills" }
      - { name: mode, type: enum, source: input, description: "TL | LTL | PARCEL | INTERMODAL; selected transport mode" }
      - { name: distance_miles, type: integer, source: input, description: "Routed linehaul distance in miles; must be > 0" }
      - { name: weight_lbs, type: integer, source: input, description: "Shipment weight in pounds; must be > 0 and <= the order's weight_lbs" }
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; set when this shipment is consolidated onto a load, null otherwise" }
      - { name: assigned_carrier_id, type: string, source: system, description: "FK -> Carrier.id; the carrier whose tender was accepted, null before acceptance" }
      - { name: contract_rate_id, type: string, source: system, description: "FK -> ContractRate.id; the rate the accepted tender was priced from, null before acceptance" }
      - { name: quoted_cost_cents, type: integer, source: computed, description: "Provisional freight cost (linehaul + fuel + estimated accessorials) locked at tender acceptance. See calculations.freight_cost_quoted." }
      - { name: audited_cost_cents, type: integer, source: computed, description: "Final freight cost recomputed from the received invoice's actual accessorials at audit time, null before audit. See calculations.freight_cost_audited." }
      - { name: promised_eta_minute, type: integer, source: input, description: "Promised delivery deadline as an absolute minute offset from epoch 0; on-time if delivery occurs at or before this minute" }
      - { name: actual_delivery_minute, type: integer, source: system, description: "Minute offset at which DELIVERED transition fired, null before delivery; supplied as input to the deliver endpoint" }
      - { name: tender_status, type: enum, source: system, default: "UNTENDERED", description: "Parallel dimension A: UNTENDERED | TENDERED | BOOKED. Independent of execution_status. State machine drives transitions." }
      - { name: execution_status, type: enum, source: system, default: "PENDING", description: "Parallel dimension B: PENDING | IN_TRANSIT | DELIVERED | CANCELLED. Independent of tender_status until cancellation. State machine drives transitions." }

  - name: Tender
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; the shipment being offered" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; the carrier the server selected by rate-shopping" }
      - { name: contract_rate_id, type: string, source: system, description: "FK -> ContractRate.id; the rate the selected carrier was priced from" }
      - { name: offered_rate_cents, type: integer, source: computed, description: "The rate-shopped linehaul+fuel cost in cents for the selected carrier. See calculations.rate_shop_selection." }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | EXPIRED. State machine drives transitions." }

  - name: Load
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the carrier hauling this consolidated load" }
      - { name: planned_capacity_lbs, type: integer, source: input, description: "Maximum total shipment weight this load may carry in pounds; must be > 0" }
      - { name: consolidated_weight_lbs, type: integer, source: computed, default: 0, description: "Read-only sum of weight_lbs over shipments with load_id == this load and execution_status != CANCELLED. See calculations.load_consolidation." }
      - { name: status, type: enum, source: system, default: "BUILDING", description: "BUILDING | DISPATCHED | CLOSED. Shipments may only be added while BUILDING. State machine drives transitions." }

  - name: DockAppointment
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> Load.id; the load arriving for this dock appointment" }
      - { name: dock_door, type: string, source: input, description: "Dock door identifier (e.g. 'D1'); appointments on the same door may not overlap" }
      - { name: start_minute, type: integer, source: input, description: "Half-open interval start as a minute offset from epoch 0; must be >= 0" }
      - { name: end_minute, type: integer, source: input, description: "Half-open interval end as a minute offset; must be > start_minute. Interval is [start_minute, end_minute)." }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CHECKED_IN | RELEASED | CANCELLED. State machine drives transitions." }

  - name: FreightInvoice
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; the shipment this carrier invoice bills" }
      - { name: invoiced_linehaul_cents, type: integer, source: input, description: "Carrier-billed linehaul (already including fuel) in integer cents" }
      - { name: invoiced_accessorial_codes, type: array, source: input, description: "List of accessorial code strings the carrier actually billed (e.g. ['DETENTION','LIFTGATE']); priced at audit per calculations.accessorial_charge" }
      - { name: variance_cents, type: integer, source: computed, description: "Read-only = invoiced total - audited_cost_cents (signed). See calculations.freight_cost_audited." }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | AUDITED | APPROVED | DISPUTED. State machine drives transitions." }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; the shipment the loss/damage occurred on" }
      - { name: claim_type, type: enum, source: input, description: "OSD_SHORTAGE | OSD_OVERAGE | DAMAGE | LOSS (OS&D = Over, Short & Damaged)" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed in integer cents; must be > 0" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Liability-capped settlement, null before settlement. See calculations.claim_settlement." }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | APPROVED | DENIED. State machine drives transitions." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tms/carriers/{carrierId}/suspend"
        actor: CarrierOps
        preconditions:
          - "Carrier.status == ACTIVE (ERR_CARRIER_NOT_ACTIVE)"
        side_effects: []
        note: "SUSPENDED carriers are excluded from rate-shop candidate sets."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tms/carriers/{carrierId}/reinstate"
        actor: CarrierOps
        preconditions:
          - "Carrier.status == SUSPENDED (ERR_CARRIER_NOT_SUSPENDED)"
        side_effects: []

  - entity: ContractRate
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /tms/contract-rates/{rateId}/retire"
        actor: CarrierOps
        preconditions:
          - "ContractRate.status == ACTIVE (ERR_RATE_NOT_ACTIVE)"
        side_effects: []
        note: "RETIRED rates are excluded from rate-shop candidate sets but stay referenced by already-booked shipments."

  - entity: Order
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: PLANNED
        trigger: "system (automatic when first Shipment for this order is created via POST /tms/shipments)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Bubble-up: Order moves OPEN->PLANNED the moment a child Shipment exists."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /tms/orders/{orderId}/cancel"
        actor: ShipperOps
        preconditions:
          - "Order.status == OPEN (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects: []
      - from: PLANNED
        to: CLOSED
        trigger: "system (automatic when the order's Shipment transitions to DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: "tender_status=UNTENDERED, execution_status=PENDING"
    terminal_states: ["execution_status in {DELIVERED, CANCELLED}"]
    transitions:
      # --- tender_status dimension (parallel) ---
      - from: "tender_status=UNTENDERED"
        to: "tender_status=TENDERED"
        trigger: "system (automatic when a Tender is created for this shipment via POST /tms/shipments/{shipmentId}/tenders)"
        actor: system
        preconditions:
          - "execution_status == PENDING (ERR_SHIPMENT_NOT_PENDING)"
          - "tender_status == UNTENDERED (ERR_SHIPMENT_ALREADY_TENDERED)"
        side_effects: []
      - from: "tender_status=TENDERED"
        to: "tender_status=BOOKED"
        trigger: "system (automatic when the OFFERED Tender is accepted via POST /tms/tenders/{tenderId}/accept)"
        actor: system
        preconditions: []
        side_effects:
          - "Shipment.assigned_carrier_id := accepted Tender.carrier_id"
          - "Shipment.contract_rate_id := accepted Tender.contract_rate_id"
          - "Shipment.quoted_cost_cents := freight_cost_quoted(shipment, accepted rate) (calculations.freight_cost_quoted)"
      - from: "tender_status=TENDERED"
        to: "tender_status=UNTENDERED"
        trigger: "system (automatic when the OFFERED Tender is declined via POST /tms/tenders/{tenderId}/decline or expired via POST /tms/tenders/{tenderId}/expire)"
        actor: system
        preconditions: []
        side_effects:
          - "Shipment becomes re-tenderable; assigned_carrier_id and quoted_cost_cents remain null"
      # --- execution_status dimension (parallel) ---
      - from: "execution_status=PENDING"
        to: "execution_status=IN_TRANSIT"
        trigger: "POST /tms/shipments/{shipmentId}/depart"
        actor: CarrierOps
        preconditions:
          - "tender_status == BOOKED (ERR_SHIPMENT_NOT_BOOKED)"
          - "execution_status == PENDING (ERR_SHIPMENT_NOT_PENDING)"
          - "Shipment.load_id is set AND its Load.status == DISPATCHED (ERR_LOAD_NOT_DISPATCHED)"
        side_effects: []
        note: "Cross-entity guard: a shipment can only depart once its consolidating Load is DISPATCHED."
      - from: "execution_status=IN_TRANSIT"
        to: "execution_status=DELIVERED"
        trigger: "POST /tms/shipments/{shipmentId}/deliver"
        actor: CarrierOps
        preconditions:
          - "execution_status == IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"
        side_effects:
          - "Shipment.actual_delivery_minute := input delivered_minute"
          - "Carrier(assigned_carrier_id).delivered_count += 1"
          - "If delivered_minute <= promised_eta_minute: Carrier(assigned_carrier_id).on_time_count += 1 (calculations.carrier_scorecard)"
          - "Order(order_id) PLANNED -> CLOSED (bubble-up)"
          - "If this is the last non-CANCELLED shipment on its Load to reach DELIVERED, Load BUILDING/DISPATCHED stays DISPATCHED (close is manual)"
      - from: "execution_status=PENDING"
        to: "execution_status=CANCELLED"
        trigger: "POST /tms/shipments/{shipmentId}/cancel"
        actor: ShipperOps
        preconditions:
          - "execution_status == PENDING (ERR_SHIPMENT_NOT_CANCELLABLE)"
        side_effects:
          - "execution_status -> CANCELLED"
          - "Cascade hop 1: any OFFERED Tender for this shipment fires its OFFERED -> DECLINED transition"
          - "Cascade hop 2 (caused by hop 1): the Tender DECLINED transition's own side-effect reverts Shipment.tender_status TENDERED -> UNTENDERED"
          - "If tender_status == BOOKED (accepted tender, no OFFERED tender to decline): clear assigned_carrier_id/contract_rate_id/quoted_cost_cents; tender_status -> UNTENDERED directly"
          - "If load_id set: detach from Load (load_id -> null); Load.consolidated_weight_lbs recomputed (calculations.load_consolidation)"

  - entity: Tender
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /tms/tenders/{tenderId}/accept"
        actor: CarrierOps
        preconditions:
          - "Tender.status == OFFERED (ERR_TENDER_NOT_OFFERED)"
          - "Shipment.tender_status == TENDERED (ERR_SHIPMENT_NOT_TENDERED)"
        side_effects:
          - "Shipment.tender_status TENDERED -> BOOKED (sets assigned_carrier_id, contract_rate_id, quoted_cost_cents)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /tms/tenders/{tenderId}/decline"
        actor: CarrierOps
        preconditions:
          - "Tender.status == OFFERED (ERR_TENDER_NOT_OFFERED)"
        side_effects:
          - "Shipment.tender_status TENDERED -> UNTENDERED (shipment re-tenderable)"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /tms/tenders/{tenderId}/expire"
        actor: CarrierOps
        preconditions:
          - "Tender.status == OFFERED (ERR_TENDER_NOT_OFFERED)"
        side_effects:
          - "Shipment.tender_status TENDERED -> UNTENDERED (shipment re-tenderable)"

  - entity: Load
    initial_state: BUILDING
    terminal_states: [CLOSED]
    transitions:
      - from: BUILDING
        to: DISPATCHED
        trigger: "POST /tms/loads/{loadId}/dispatch"
        actor: DockOps
        preconditions:
          - "Load.status == BUILDING (ERR_LOAD_NOT_BUILDING)"
          - "consolidated_weight_lbs > 0 (ERR_EMPTY_LOAD), i.e. at least one non-CANCELLED shipment is consolidated"
          - "Load has a SCHEDULED or CHECKED_IN DockAppointment (ERR_NO_DOCK_APPOINTMENT)"
        side_effects: []
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /tms/loads/{loadId}/close"
        actor: DockOps
        preconditions:
          - "Load.status == DISPATCHED (ERR_LOAD_NOT_DISPATCHED)"
          - "Every non-CANCELLED shipment on this load has execution_status == DELIVERED (ERR_LOAD_HAS_UNDELIVERED_SHIPMENTS)"
        side_effects: []

  - entity: DockAppointment
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /tms/dock-appointments/{apptId}/check-in"
        actor: DockOps
        preconditions:
          - "DockAppointment.status == SCHEDULED (ERR_APPT_NOT_SCHEDULED)"
        side_effects: []
      - from: CHECKED_IN
        to: RELEASED
        trigger: "POST /tms/dock-appointments/{apptId}/release"
        actor: DockOps
        preconditions:
          - "DockAppointment.status == CHECKED_IN (ERR_APPT_NOT_CHECKED_IN)"
        side_effects:
          - "Frees the [start_minute, end_minute) window on dock_door for future appointments"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tms/dock-appointments/{apptId}/cancel"
        actor: DockOps
        preconditions:
          - "DockAppointment.status == SCHEDULED (ERR_APPT_NOT_SCHEDULED)"
        side_effects:
          - "Frees the [start_minute, end_minute) window on dock_door"

  - entity: FreightInvoice
    initial_state: RECEIVED
    terminal_states: [APPROVED, DISPUTED]
    transitions:
      - from: RECEIVED
        to: AUDITED
        trigger: "POST /tms/freight-invoices/{invoiceId}/audit"
        actor: FreightAuditor
        preconditions:
          - "FreightInvoice.status == RECEIVED (ERR_INVOICE_NOT_RECEIVED)"
          - "Shipment.execution_status == DELIVERED (ERR_SHIPMENT_NOT_DELIVERED)"
        side_effects:
          - "Shipment.audited_cost_cents := freight_cost_audited(shipment, invoice) (calculations.freight_cost_audited)"
          - "FreightInvoice.variance_cents := invoiced total - audited_cost_cents (calculations.freight_cost_audited)"
      - from: AUDITED
        to: APPROVED
        trigger: "POST /tms/freight-invoices/{invoiceId}/approve"
        actor: FreightAuditor
        preconditions:
          - "FreightInvoice.status == AUDITED (ERR_INVOICE_NOT_AUDITED)"
          - "abs(variance_cents) <= TOLERANCE_CENTS (ERR_VARIANCE_EXCEEDS_TOLERANCE)"
        side_effects: []
      - from: AUDITED
        to: DISPUTED
        trigger: "POST /tms/freight-invoices/{invoiceId}/dispute"
        actor: FreightAuditor
        preconditions:
          - "FreightInvoice.status == AUDITED (ERR_INVOICE_NOT_AUDITED)"
        side_effects: []

  - entity: Claim
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /tms/claims/{claimId}/approve"
        actor: FreightAuditor
        preconditions:
          - "Claim.status == OPEN (ERR_CLAIM_NOT_OPEN)"
          - "Shipment.execution_status == DELIVERED (ERR_SHIPMENT_NOT_DELIVERED)"
        side_effects:
          - "Claim.approved_amount_cents := claim_settlement(claim, order) (calculations.claim_settlement)"
      - from: OPEN
        to: DENIED
        trigger: "POST /tms/claims/{claimId}/deny"
        actor: FreightAuditor
        preconditions:
          - "Claim.status == OPEN (ERR_CLAIM_NOT_OPEN)"
        side_effects:
          - "Claim.approved_amount_cents := 0"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: load-add-stale-load
    parent_entity: Load
    write_endpoint: "POST /tms/loads/{loadId}/shipments"
    occ_field: "expected_load_version"
    description: |
      Adding a Shipment to a Load whose version has advanced since the client
      last observed it is rejected. A prior add of another shipment legitimately
      bumped Load.consolidated_weight_lbs (and Load.version); the current
      writer's view of the load — including its remaining capacity headroom — is
      therefore stale, so a capacity decision made against the old version must
      not be committed.
    error_id: ERR_STALE_LOAD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rate_shop_selection
    trigger: "POST /tms/shipments/{shipmentId}/tenders (server selects carrier and prices the tender)"
    algorithm: selector_policy
    formula: |
      Candidate set = ContractRate rows where:
        rate.status == ACTIVE
        AND rate.mode == shipment.mode
        AND rate.origin_zone == order.origin_zone (order = shipment's order)
        AND rate.dest_zone == order.dest_zone
        AND rate.effective_start_minute <= tender_minute <= rate.effective_end_minute
        AND Carrier(rate.carrier_id).status == ACTIVE
        AND Carrier(rate.carrier_id).mode == shipment.mode
      For each candidate rate compute priced cost:
        linehaul = max(rate.base_rate_per_mile_cents * shipment.distance_miles,
                       rate.min_charge_cents)
        fuel     = round_half_up(linehaul * rate.fuel_surcharge_pct)        # to whole cents
        priced_cents = linehaul + fuel
      Ranking (rate shopping): choose the candidate with the LOWEST priced_cents.
      Tie-break 1: when priced_cents ties, prefer the carrier with the HIGHER
                   on_time_pct (null on_time_pct treated as -1, i.e. ranked last).
      Tie-break 2: when still tied, the candidate ContractRate with the EARLIEST
                   created_at (ASC).
      Empty candidate set -> reject the tender create with ERR_NO_ELIGIBLE_CARRIER.
      Outputs: Tender.carrier_id, Tender.contract_rate_id, Tender.offered_rate_cents := priced_cents.
    input_set: "ACTIVE ContractRate of ACTIVE carriers matching the shipment mode and the order's origin/dest zones"
    constants: {}
    precision: "fuel surcharge rounded to whole cents, round_half_up; all monetary fields are integer cents"
    note: "Selector determinism: eligibility predicate + lowest-cost ranking + on_time_pct then created_at tie-break + empty-set error are all pinned. id is never a decision input."

  - name: freight_cost_quoted
    trigger: "Shipment tender_status TENDERED -> BOOKED (Tender accept)"
    algorithm: tiered_pricing
    formula: |
      Locked from the ACCEPTED tender's contract rate at acceptance:
        linehaul = max(rate.base_rate_per_mile_cents * shipment.distance_miles,
                       rate.min_charge_cents)
        fuel     = round_half_up(linehaul * rate.fuel_surcharge_pct)
        est_accessorials = ACCESSORIAL_ESTIMATE_CENTS   # flat provisional accessorial reserve
        quoted_cost_cents = linehaul + fuel + est_accessorials
      Order of operations is pinned: apply the min-charge floor to linehaul
      FIRST, then compute fuel on the floored linehaul, then add the flat
      accessorial estimate. (Computing fuel before the floor would diverge.)
    input_set: "the single ACCEPTED tender's ContractRate and the shipment's distance"
    constants:
      ACCESSORIAL_ESTIMATE_CENTS: 5000
    precision: "fuel round_half_up to whole cents; integer cents throughout"
    variants:
      - name: quoted_provisional
        when: "at tender acceptance (forward-looking estimate)"
        difference: "uses a flat ACCESSORIAL_ESTIMATE_CENTS reserve, not the carrier's actually-billed accessorials"

  - name: freight_cost_audited
    trigger: "FreightInvoice RECEIVED -> AUDITED (invoice audit)"
    algorithm: tiered_pricing
    formula: |
      Recompute the authoritative freight cost from the shipment's locked
      contract rate PLUS the invoice's actually-billed accessorials:
        linehaul = max(rate.base_rate_per_mile_cents * shipment.distance_miles,
                       rate.min_charge_cents)               # rate = shipment.contract_rate_id
        fuel     = round_half_up(linehaul * rate.fuel_surcharge_pct)
        accessorial_total = sum over invoice.invoiced_accessorial_codes of
                            accessorial_charge(code, shipment.weight_lbs)
                            (calculations.accessorial_charge)
        audited_cost_cents = linehaul + fuel + accessorial_total
      Then:
        variance_cents = invoice.invoiced_linehaul_cents + accessorial_total
                         - audited_cost_cents
        (note: invoice.invoiced_linehaul_cents already includes the carrier's
         own fuel; audited linehaul+fuel is the contract-correct figure, so
         variance isolates the linehaul+fuel discrepancy.)
    input_set: "shipment.contract_rate_id rate + the single FreightInvoice's accessorial codes"
    constants: {}
    precision: "fuel round_half_up to whole cents; integer cents throughout"
    variants:
      - name: audited_final
        when: "at invoice audit (actuals)"
        difference: "prices the carrier's ACTUAL accessorial codes via tiered accessorial_charge instead of the flat ACCESSORIAL_ESTIMATE_CENTS reserve used by freight_cost_quoted"

  - name: accessorial_charge
    trigger: "evaluated per accessorial code during freight_cost_audited"
    algorithm: threshold
    formula: |
      Per accessorial code, charge in cents depends on the code and on a
      weight tier with an inclusive lower boundary:
        DETENTION: flat 7500
        LIFTGATE:  flat 3500
        RESIDENTIAL: flat 2500
        REWEIGH (weight-tiered, boundary inclusive at >=):
            weight_lbs <  5000           -> 1500
            5000 <= weight_lbs < 20000   -> 4000
            weight_lbs >= 20000          -> 9000
      Unknown code -> ERR_UNKNOWN_ACCESSORIAL (rejects the audit).
      The tier boundary is inclusive on the lower edge: exactly 5000 lbs is the
      4000 tier (>=), exactly 20000 lbs is the 9000 tier.
    input_set: "one accessorial code string + the shipment weight"
    constants:
      DETENTION_CENTS: 7500
      LIFTGATE_CENTS: 3500
      RESIDENTIAL_CENTS: 2500
      REWEIGH_LIGHT_CENTS: 1500
      REWEIGH_MID_CENTS: 4000
      REWEIGH_HEAVY_CENTS: 9000
      REWEIGH_MID_LB: 5000
      REWEIGH_HEAVY_LB: 20000
    precision: "integer cents"

  - name: load_consolidation
    trigger: "shipment add to load, shipment cancel (detach), load read"
    algorithm: aggregation
    formula: |
      consolidated_weight_lbs = sum of weight_lbs over all Shipments where
        shipment.load_id == load.id AND shipment.execution_status != CANCELLED.
      Capacity guard on add (POST /tms/loads/{loadId}/shipments):
        if (consolidated_weight_lbs_before + shipment.weight_lbs)
            > load.planned_capacity_lbs:
          reject with ERR_LOAD_CAPACITY_EXCEEDED.
      Boundary: a sum exactly EQUAL to planned_capacity_lbs is allowed (the
      reject fires strictly when the new total is GREATER THAN capacity).
    input_set: "non-CANCELLED shipments consolidated on the load"
    constants: {}
    precision: "integer pounds"
    note: "Conserved quantity: total non-CANCELLED weight assigned to a load equals consolidated_weight_lbs at all times; add then cancel-detach leaves it at its pre-add value."

  - name: carrier_scorecard
    trigger: "Shipment IN_TRANSIT -> DELIVERED; Claim OPEN (claim_count); read of carrier"
    algorithm: weighted_scoring
    formula: |
      on_time_pct = round_half_up(on_time_count / delivered_count * 100, 2)
                    when delivered_count > 0, else null.
      claim_ratio = claim_count / delivered_count when delivered_count > 0, else 0.
      scorecard_grade:
        if delivered_count == 0: PROBATION
        elif on_time_pct >= 95 AND claim_ratio <= 0.02: A
        elif on_time_pct >= 90 AND claim_ratio <= 0.05: B
        elif on_time_pct >= 80: C
        else: PROBATION
      Grade boundaries are inclusive (>=). Evaluated top-down; first match wins.
    input_set: "this carrier's delivered_count, on_time_count, claim_count"
    constants:
      GRADE_A_ONTIME: 95
      GRADE_A_CLAIM_MAX: 0.02
      GRADE_B_ONTIME: 90
      GRADE_B_CLAIM_MAX: 0.05
      GRADE_C_ONTIME: 80
    precision: "on_time_pct round_half_up to 2 decimals"
    note: "Derived-field reconciliation: on_time_pct and scorecard_grade are recomputed from the counters on every relevant transition and on read."

  - name: claim_settlement
    trigger: "Claim OPEN -> APPROVED (claim approve)"
    algorithm: threshold
    formula: |
      liability_ceiling = Order(shipment.order_id).declared_value_cents.
      approved_amount_cents = min(claim.claimed_amount_cents, liability_ceiling).
      OVERAGE special case: claim_type == OSD_OVERAGE settles to 0 (overage is
      not a carrier liability) regardless of claimed_amount_cents.
      On deny: approved_amount_cents = 0.
    input_set: "the claim's claimed amount + the order's declared_value_cents"
    constants: {}
    precision: "integer cents"
    note: "Conserved invariant: a carrier's settlement exposure on an order can never exceed the order's declared_value_cents; min() caps it."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 4
    category: existence
    check: "Foreign-key ids supplied in request body reference existing resources (order_id, carrier_id, load_id, shipment_id, etc.)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by referenced type)"
    http_status: 404
    applies_to: "POST /tms/shipments, POST /tms/contract-rates, POST /tms/loads, POST /tms/dock-appointments, POST /tms/freight-invoices, POST /tms/claims, POST /tms/loads/{loadId}/shipments"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enums in allowed set; weight_lbs/distance_miles/declared_value_cents/claimed_amount_cents > 0; DockAppointment end_minute > start_minute (strict) and start_minute >= 0; ContractRate effective_end_minute >= effective_start_minute (a one-minute window is valid) and effective_start_minute >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT with a body"

  - priority: 6
    category: business_constraint
    check: "Carrier.scac is unique across carriers"
    error_id: ERR_DUPLICATE_SCAC
    http_status: 409
    applies_to: "POST /tms/carriers"

  - priority: 7
    category: business_referential
    check: "ContractRate.mode must equal Carrier(carrier_id).mode; Shipment.mode is a transport mode enum; Shipment.weight_lbs <= Order.weight_lbs"
    error_id: ERR_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /tms/contract-rates, POST /tms/shipments"

  - priority: 8
    category: state
    check: "Target resource is in the correct state for the requested transition (per §1.2 preconditions)"
    error_id: "varies (ERR_TENDER_NOT_OFFERED, ERR_SHIPMENT_NOT_PENDING, ERR_LOAD_NOT_BUILDING, ERR_INVOICE_NOT_RECEIVED, ...)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_referential
    check: "Cross-entity guard: Shipment depart requires its Load.status == DISPATCHED; Load dispatch requires a SCHEDULED/CHECKED_IN DockAppointment; Load close requires all non-CANCELLED shipments DELIVERED; invoice audit & claim approve require Shipment execution_status == DELIVERED"
    error_id: "varies (ERR_LOAD_NOT_DISPATCHED, ERR_NO_DOCK_APPOINTMENT, ERR_LOAD_HAS_UNDELIVERED_SHIPMENTS, ERR_SHIPMENT_NOT_DELIVERED)"
    http_status: 409
    applies_to: "POST /tms/shipments/{id}/depart, POST /tms/loads/{id}/dispatch, POST /tms/loads/{id}/close, POST /tms/freight-invoices/{id}/audit, POST /tms/claims/{id}/approve"

  - priority: 10
    category: business_temporal
    check: "DockAppointment [start_minute, end_minute) must not overlap an existing SCHEDULED/CHECKED_IN appointment on the same dock_door (half-open: touching at a boundary is NOT an overlap)"
    error_id: ERR_DOCK_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /tms/dock-appointments"

  - priority: 11
    category: business_constraint
    check: "Rate-shop candidate set is non-empty (an ACTIVE rate of an ACTIVE carrier matching mode + zones exists)"
    error_id: ERR_NO_ELIGIBLE_CARRIER
    http_status: 409
    applies_to: "POST /tms/shipments/{shipmentId}/tenders"

  - priority: 12
    category: business_constraint
    check: "Accessorial codes on an invoice are all known codes (DETENTION|LIFTGATE|RESIDENTIAL|REWEIGH)"
    error_id: ERR_UNKNOWN_ACCESSORIAL
    http_status: 422
    applies_to: "POST /tms/freight-invoices/{invoiceId}/audit"

  - priority: 13
    category: business_fiscal
    check: "Load consolidation capacity: consolidated_weight_lbs_before + shipment.weight_lbs must be <= planned_capacity_lbs"
    error_id: ERR_LOAD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /tms/loads/{loadId}/shipments"

  - priority: 14
    category: business_fiscal
    check: "Invoice approve requires abs(variance_cents) <= TOLERANCE_CENTS (500)"
    error_id: ERR_VARIANCE_EXCEEDS_TOLERANCE
    http_status: 409
    applies_to: "POST /tms/freight-invoices/{invoiceId}/approve"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_load_version must equal Load.version on add-shipment-to-load"
    error_id: ERR_STALE_LOAD_VERSION
    http_status: 412
    applies_to: "POST /tms/loads/{loadId}/shipments"

  - priority: 16
    category: business_temporal
    check: "A new ACTIVE ContractRate's CLOSED effective window [effective_start_minute, effective_end_minute] must not overlap an existing ACTIVE rate on the same (carrier_id, mode, origin_zone, dest_zone) lane (closed semantics: sharing an endpoint minute IS an overlap, unlike DockAppointment's half-open windows)"
    error_id: ERR_RATE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /tms/contract-rates"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; deterministic epoch-0 minute model is integer-based,
  #     but a logical UTC clock is provided for completeness/determinism) ---
  - method: POST
    path: "/tms/_clock/set_current_utc"
    description: "Set the logical server clock. Default at startup is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. (Minute-offset fields in this domain are independent absolute integers, supplied directly.)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # --- Carrier ---
  - method: POST
    path: "/tms/carriers"
    description: "Create a carrier"
    roles: [CarrierOps]
    code: 201
    input: [name, scac, mode]
    output: Carrier
    side_effects: ["status=ACTIVE; counters initialized to 0; on_time_pct=null; scorecard_grade=PROBATION"]
  - method: GET
    path: "/tms/carriers"
    description: "List carriers (paginated; optional scac filter)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["scac?", "limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []
  - method: GET
    path: "/tms/carriers/{carrierId}"
    description: "Get a carrier (recomputes on_time_pct/scorecard_grade on read)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/tms/carriers/{carrierId}/suspend"
    description: "Suspend a carrier (excludes it from rate-shop)"
    roles: [CarrierOps]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/tms/carriers/{carrierId}/reinstate"
    description: "Reinstate a suspended carrier"
    roles: [CarrierOps]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status SUSPENDED -> ACTIVE"]

  # --- ContractRate ---
  - method: POST
    path: "/tms/contract-rates"
    description: "Create a contract rate for a carrier (mode must match carrier's mode)"
    roles: [CarrierOps]
    code: 201
    input: [carrier_id, mode, origin_zone, dest_zone, base_rate_per_mile_cents, min_charge_cents, "fuel_surcharge_pct?", effective_start_minute, effective_end_minute]
    output: ContractRate
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/tms/contract-rates"
    description: "List contract rates (filterable by carrier_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["carrier_id?", "limit?", "offset?"]
    output: "ContractRate[]"
    side_effects: []
  - method: GET
    path: "/tms/contract-rates/{rateId}"
    description: "Get a contract rate"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: ContractRate
    side_effects: []
  - method: POST
    path: "/tms/contract-rates/{rateId}/retire"
    description: "Retire a contract rate (excludes from rate-shop)"
    roles: [CarrierOps]
    code: 200
    input: []
    output: ContractRate
    side_effects: ["status ACTIVE -> RETIRED"]

  # --- Order ---
  - method: POST
    path: "/tms/orders"
    description: "Create an order"
    roles: [ShipperOps]
    code: 201
    input: [customer_ref, origin_zone, dest_zone, weight_lbs, declared_value_cents]
    output: Order
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/tms/orders"
    description: "List orders (paginated)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: GET
    path: "/tms/orders/{orderId}"
    description: "Get an order"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/tms/orders/{orderId}/cancel"
    description: "Cancel an OPEN order"
    roles: [ShipperOps]
    code: 200
    input: []
    output: Order
    side_effects: ["status OPEN -> CANCELLED"]

  # --- Shipment ---
  - method: POST
    path: "/tms/shipments"
    description: "Create a shipment for an order (drives Order OPEN -> PLANNED)"
    roles: [ShipperOps]
    code: 201
    input: [order_id, mode, distance_miles, weight_lbs, promised_eta_minute]
    output: Shipment
    side_effects:
      - "tender_status=UNTENDERED, execution_status=PENDING"
      - "Order(order_id) OPEN -> PLANNED (bubble-up)"
  - method: GET
    path: "/tms/shipments"
    description: "List shipments, filterable by order_id / load_id / assigned_carrier_id / contract_rate_id"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["order_id?", "load_id?", "assigned_carrier_id?", "contract_rate_id?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/tms/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/tms/shipments/{shipmentId}/depart"
    description: "Mark shipment departed / in-transit (requires its load DISPATCHED)"
    roles: [CarrierOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["execution_status PENDING -> IN_TRANSIT"]
  - method: POST
    path: "/tms/shipments/{shipmentId}/deliver"
    description: "Mark shipment delivered at delivered_minute; updates carrier scorecard, closes order"
    roles: [CarrierOps]
    code: 200
    input: [delivered_minute]
    output: Shipment
    side_effects:
      - "execution_status IN_TRANSIT -> DELIVERED; actual_delivery_minute := delivered_minute"
      - "Carrier(assigned_carrier_id).delivered_count += 1; on_time_count += 1 if delivered_minute <= promised_eta_minute"
      - "Order(order_id) PLANNED -> CLOSED"
  - method: POST
    path: "/tms/shipments/{shipmentId}/cancel"
    description: "Cancel a PENDING shipment (cascades to tender unwind + load detach)"
    roles: [ShipperOps]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "execution_status PENDING -> CANCELLED"
      - "any OFFERED Tender -> DECLINED; if BOOKED, clear carrier/rate/quoted_cost and tender_status -> UNTENDERED"
      - "if load_id set: detach (load_id -> null); Load.consolidated_weight_lbs recomputed"

  # --- Tender (sub-resource of Shipment for creation; actions are flat) ---
  - method: POST
    path: "/tms/shipments/{shipmentId}/tenders"
    description: "Rate-shop and create a tender: server selects lowest-cost ACTIVE carrier/rate (whose effective window contains tender_minute) and prices offered_rate_cents"
    roles: [ShipperOps]
    code: 201
    input: [tender_minute]
    output: Tender
    side_effects:
      - "carrier/rate selected via calculations.rate_shop_selection; offered_rate_cents computed"
      - "Shipment.tender_status UNTENDERED -> TENDERED"
      - "status=OFFERED"
  - method: GET
    path: "/tms/shipments/{shipmentId}/tenders"
    description: "List tenders for a shipment (reverse-reachability for Tender.shipment_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Tender[]"
    side_effects: []
  - method: GET
    path: "/tms/tenders"
    description: "List tenders, filterable by carrier_id / shipment_id / contract_rate_id (reverse-reachability for Tender.carrier_id and Tender.contract_rate_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["carrier_id?", "shipment_id?", "contract_rate_id?", "limit?", "offset?"]
    output: "Tender[]"
    side_effects: []
  - method: GET
    path: "/tms/tenders/{tenderId}"
    description: "Get a tender"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: Tender
    side_effects: []
  - method: POST
    path: "/tms/tenders/{tenderId}/accept"
    description: "Carrier accepts the offered tender; books the shipment and locks quoted_cost_cents"
    roles: [CarrierOps]
    code: 200
    input: []
    output: Tender
    side_effects: ["status OFFERED -> ACCEPTED; Shipment TENDERED -> BOOKED; quoted_cost_cents locked"]
  - method: POST
    path: "/tms/tenders/{tenderId}/decline"
    description: "Carrier declines the offered tender; shipment re-tenderable"
    roles: [CarrierOps]
    code: 200
    input: []
    output: Tender
    side_effects: ["status OFFERED -> DECLINED; Shipment TENDERED -> UNTENDERED"]
  - method: POST
    path: "/tms/tenders/{tenderId}/expire"
    description: "Expire the offered tender; shipment re-tenderable"
    roles: [ShipperOps, CarrierOps]
    code: 200
    input: []
    output: Tender
    side_effects: ["status OFFERED -> EXPIRED; Shipment TENDERED -> UNTENDERED"]

  # --- Load ---
  - method: POST
    path: "/tms/loads"
    description: "Create a load (consolidation container) for a carrier"
    roles: [DockOps]
    code: 201
    input: [carrier_id, planned_capacity_lbs]
    output: Load
    side_effects: ["status=BUILDING; consolidated_weight_lbs=0"]
  - method: GET
    path: "/tms/loads"
    description: "List loads, filterable by carrier_id (reverse-reachability for Load.carrier_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["carrier_id?", "limit?", "offset?"]
    output: "Load[]"
    side_effects: []
  - method: GET
    path: "/tms/loads/{loadId}"
    description: "Get a load (recomputes consolidated_weight_lbs)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: Load
    side_effects: []
  - method: GET
    path: "/tms/loads/{loadId}/shipments"
    description: "List shipments consolidated on a load (reverse-reachability for Shipment.load_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []
  - method: POST
    path: "/tms/loads/{loadId}/shipments"
    description: "Consolidate a BOOKED shipment onto a BUILDING load (OCC on Load.version; capacity-guarded)"
    roles: [DockOps]
    code: 200
    input: [shipment_id, expected_load_version]
    output: Load
    side_effects:
      - "Shipment.load_id := loadId"
      - "Load.consolidated_weight_lbs recomputed (calculations.load_consolidation)"
      - "increments Load.version by 1"
  - method: POST
    path: "/tms/loads/{loadId}/dispatch"
    description: "Dispatch a load (requires non-empty + a dock appointment)"
    roles: [DockOps]
    code: 200
    input: []
    output: Load
    side_effects: ["status BUILDING -> DISPATCHED"]
  - method: POST
    path: "/tms/loads/{loadId}/close"
    description: "Close a dispatched load once all its non-CANCELLED shipments are DELIVERED"
    roles: [DockOps]
    code: 200
    input: []
    output: Load
    side_effects: ["status DISPATCHED -> CLOSED"]

  # --- DockAppointment ---
  - method: POST
    path: "/tms/dock-appointments"
    description: "Schedule a dock appointment for a load on a door (half-open overlap check per door)"
    roles: [DockOps]
    code: 201
    input: [load_id, dock_door, start_minute, end_minute]
    output: DockAppointment
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/tms/dock-appointments"
    description: "List dock appointments, filterable by load_id / dock_door (reverse-reachability for DockAppointment.load_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["load_id?", "dock_door?", "limit?", "offset?"]
    output: "DockAppointment[]"
    side_effects: []
  - method: GET
    path: "/tms/dock-appointments/{apptId}"
    description: "Get a dock appointment"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: DockAppointment
    side_effects: []
  - method: POST
    path: "/tms/dock-appointments/{apptId}/check-in"
    description: "Check in a scheduled appointment"
    roles: [DockOps]
    code: 200
    input: []
    output: DockAppointment
    side_effects: ["status SCHEDULED -> CHECKED_IN"]
  - method: POST
    path: "/tms/dock-appointments/{apptId}/release"
    description: "Release a checked-in appointment (frees the window)"
    roles: [DockOps]
    code: 200
    input: []
    output: DockAppointment
    side_effects: ["status CHECKED_IN -> RELEASED; window freed"]
  - method: POST
    path: "/tms/dock-appointments/{apptId}/cancel"
    description: "Cancel a scheduled appointment (frees the window)"
    roles: [DockOps]
    code: 200
    input: []
    output: DockAppointment
    side_effects: ["status SCHEDULED -> CANCELLED; window freed"]

  # --- FreightInvoice ---
  - method: POST
    path: "/tms/freight-invoices"
    description: "Record a received carrier freight invoice for a shipment"
    roles: [FreightAuditor]
    code: 201
    input: [shipment_id, invoiced_linehaul_cents, "invoiced_accessorial_codes?"]
    output: FreightInvoice
    side_effects: ["status=RECEIVED; invoiced_accessorial_codes defaults to [] when omitted"]
  - method: GET
    path: "/tms/freight-invoices"
    description: "List freight invoices, filterable by shipment_id (reverse-reachability for FreightInvoice.shipment_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["shipment_id?", "limit?", "offset?"]
    output: "FreightInvoice[]"
    side_effects: []
  - method: GET
    path: "/tms/freight-invoices/{invoiceId}"
    description: "Get a freight invoice"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: FreightInvoice
    side_effects: []
  - method: POST
    path: "/tms/freight-invoices/{invoiceId}/audit"
    description: "Audit invoice: recompute audited_cost_cents from actuals and compute variance"
    roles: [FreightAuditor]
    code: 200
    input: []
    output: FreightInvoice
    side_effects:
      - "Shipment.audited_cost_cents := freight_cost_audited(...)"
      - "FreightInvoice.variance_cents computed"
      - "status RECEIVED -> AUDITED"
  - method: POST
    path: "/tms/freight-invoices/{invoiceId}/approve"
    description: "Approve an audited invoice within tolerance"
    roles: [FreightAuditor]
    code: 200
    input: []
    output: FreightInvoice
    side_effects: ["status AUDITED -> APPROVED"]
  - method: POST
    path: "/tms/freight-invoices/{invoiceId}/dispute"
    description: "Dispute an audited invoice"
    roles: [FreightAuditor]
    code: 200
    input: []
    output: FreightInvoice
    side_effects: ["status AUDITED -> DISPUTED"]

  # --- Claim ---
  - method: POST
    path: "/tms/claims"
    description: "Open an OS&D / damage / loss claim against a shipment (increments carrier claim_count)"
    roles: [ShipperOps]
    code: 201
    input: [shipment_id, claim_type, claimed_amount_cents]
    output: Claim
    side_effects:
      - "status=OPEN"
      - "Carrier(shipment.assigned_carrier_id).claim_count += 1 (recomputes scorecard_grade)"
  - method: GET
    path: "/tms/claims"
    description: "List claims, filterable by shipment_id (reverse-reachability for Claim.shipment_id)"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: ["shipment_id?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: GET
    path: "/tms/claims/{claimId}"
    description: "Get a claim"
    roles: [ShipperOps, CarrierOps, DockOps, FreightAuditor]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/tms/claims/{claimId}/approve"
    description: "Approve a claim; settles approved_amount_cents capped at order declared value"
    roles: [FreightAuditor]
    code: 200
    input: []
    output: Claim
    side_effects: ["status OPEN -> APPROVED; approved_amount_cents := claim_settlement(...)"]
  - method: POST
    path: "/tms/claims/{claimId}/deny"
    description: "Deny a claim"
    roles: [FreightAuditor]
    code: 200
    input: []
    output: Claim
    side_effects: ["status OPEN -> DENIED; approved_amount_cents := 0"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  # --- Validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/malformed body field, bad enum, or non-positive numeric constraint (weight/distance/value/amount<=0, end_minute<=start_minute, start_minute<0)" }
  - { id: ERR_DUPLICATE_SCAC, http: 409, condition: "Carrier scac already exists" }
  - { id: ERR_MODE_MISMATCH, http: 422, condition: "ContractRate.mode != Carrier.mode, or Shipment.weight_lbs > Order.weight_lbs" }
  - { id: ERR_RATE_WINDOW_OVERLAP, http: 409, condition: "New ACTIVE ContractRate's closed effective window overlaps an existing ACTIVE rate on the same (carrier,mode,origin,dest) lane" }
  - { id: ERR_UNKNOWN_ACCESSORIAL, http: 422, condition: "Invoice carries an accessorial code outside {DETENTION,LIFTGATE,RESIDENTIAL,REWEIGH}" }
  # --- Not Found ---
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Carrier id not found" }
  - { id: ERR_RATE_NOT_FOUND, http: 404, condition: "ContractRate id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id not found" }
  - { id: ERR_TENDER_NOT_FOUND, http: 404, condition: "Tender id not found" }
  - { id: ERR_LOAD_NOT_FOUND, http: 404, condition: "Load id not found" }
  - { id: ERR_APPT_NOT_FOUND, http: 404, condition: "DockAppointment id not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "FreightInvoice id not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id not found" }
  # --- State (Carrier / Rate) ---
  - { id: ERR_CARRIER_NOT_ACTIVE, http: 409, condition: "Suspend requires carrier ACTIVE" }
  - { id: ERR_CARRIER_NOT_SUSPENDED, http: 409, condition: "Reinstate requires carrier SUSPENDED" }
  - { id: ERR_RATE_NOT_ACTIVE, http: 409, condition: "Retire requires rate ACTIVE" }
  # --- State (Order) ---
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order cancel requires status OPEN" }
  # --- State (Shipment) ---
  - { id: ERR_SHIPMENT_NOT_PENDING, http: 409, condition: "Operation requires shipment execution_status PENDING" }
  - { id: ERR_SHIPMENT_ALREADY_TENDERED, http: 409, condition: "Tender create requires shipment tender_status UNTENDERED" }
  - { id: ERR_SHIPMENT_NOT_TENDERED, http: 409, condition: "Tender accept requires shipment tender_status TENDERED" }
  - { id: ERR_SHIPMENT_NOT_BOOKED, http: 409, condition: "Depart requires shipment tender_status BOOKED" }
  - { id: ERR_SHIPMENT_NOT_IN_TRANSIT, http: 409, condition: "Deliver requires shipment execution_status IN_TRANSIT" }
  - { id: ERR_SHIPMENT_NOT_CANCELLABLE, http: 409, condition: "Shipment cancel requires execution_status PENDING" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "Invoice audit / claim approve requires shipment execution_status DELIVERED" }
  - { id: ERR_NO_ELIGIBLE_CARRIER, http: 409, condition: "Rate-shop candidate set is empty for the shipment's mode + order zones" }
  # --- State (Tender) ---
  - { id: ERR_TENDER_NOT_OFFERED, http: 409, condition: "Tender accept/decline/expire requires status OFFERED" }
  # --- State (Load) ---
  - { id: ERR_LOAD_NOT_BUILDING, http: 409, condition: "Add-shipment / dispatch requires load BUILDING" }
  - { id: ERR_LOAD_NOT_DISPATCHED, http: 409, condition: "Depart requires consolidating load DISPATCHED; close requires load DISPATCHED" }
  - { id: ERR_EMPTY_LOAD, http: 409, condition: "Dispatch requires consolidated_weight_lbs > 0" }
  - { id: ERR_NO_DOCK_APPOINTMENT, http: 409, condition: "Dispatch requires a SCHEDULED/CHECKED_IN dock appointment on the load" }
  - { id: ERR_LOAD_HAS_UNDELIVERED_SHIPMENTS, http: 409, condition: "Close requires all non-CANCELLED shipments DELIVERED" }
  - { id: ERR_LOAD_CAPACITY_EXCEEDED, http: 409, condition: "Adding shipment would push consolidated_weight_lbs above planned_capacity_lbs" }
  - { id: ERR_SHIPMENT_NOT_ON_BUILDING_LOAD, http: 409, condition: "Add-shipment requires shipment tender_status BOOKED and not already on a load" }
  # --- Concurrency ---
  - { id: ERR_STALE_LOAD_VERSION, http: 412, condition: "expected_load_version != current Load.version on add-shipment" }
  # --- State (DockAppointment) ---
  - { id: ERR_APPT_NOT_SCHEDULED, http: 409, condition: "Check-in / cancel requires appointment SCHEDULED" }
  - { id: ERR_APPT_NOT_CHECKED_IN, http: 409, condition: "Release requires appointment CHECKED_IN" }
  - { id: ERR_DOCK_DOUBLE_BOOKED, http: 409, condition: "Appointment [start,end) overlaps an existing SCHEDULED/CHECKED_IN appointment on the same door" }
  # --- State (FreightInvoice) ---
  - { id: ERR_INVOICE_NOT_RECEIVED, http: 409, condition: "Audit requires invoice RECEIVED" }
  - { id: ERR_INVOICE_NOT_AUDITED, http: 409, condition: "Approve / dispute requires invoice AUDITED" }
  - { id: ERR_VARIANCE_EXCEEDS_TOLERANCE, http: 409, condition: "Approve requires abs(variance_cents) <= 500" }
  # --- State (Claim) ---
  - { id: ERR_CLAIM_NOT_OPEN, http: 409, condition: "Approve / deny requires claim OPEN" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShipperOps
    description: "Owns orders, shipments, tendering initiation, and claim filing."
    identity: opaque
    exclusive_operations:
      - "POST /tms/orders — create order"
      - "POST /tms/orders/{id}/cancel — cancel order"
      - "POST /tms/shipments — create shipment"
      - "POST /tms/shipments/{id}/cancel — cancel shipment"
      - "POST /tms/shipments/{id}/tenders — rate-shop + create tender"
      - "POST /tms/claims — open claim"
    shared_operations:
      - "POST /tms/tenders/{id}/expire — expire tender (shared with CarrierOps)"
      - "all GET endpoints; POST /tms/_clock/set_current_utc"

  - name: CarrierOps
    description: "Owns carriers, contract rates, tender accept/decline, and physical execution (depart/deliver)."
    identity: opaque
    exclusive_operations:
      - "POST /tms/carriers — create carrier"
      - "POST /tms/carriers/{id}/suspend; /reinstate"
      - "POST /tms/contract-rates — create rate"
      - "POST /tms/contract-rates/{id}/retire"
      - "POST /tms/tenders/{id}/accept; /decline"
      - "POST /tms/shipments/{id}/depart; /deliver"
    shared_operations:
      - "POST /tms/tenders/{id}/expire — expire tender (shared with ShipperOps)"
      - "all GET endpoints; POST /tms/_clock/set_current_utc"

  - name: DockOps
    description: "Owns load consolidation, dock appointment scheduling, and dispatch/close."
    identity: opaque
    exclusive_operations:
      - "POST /tms/loads — create load"
      - "POST /tms/loads/{id}/shipments — consolidate shipment (OCC)"
      - "POST /tms/loads/{id}/dispatch; /close"
      - "POST /tms/dock-appointments — schedule appointment"
      - "POST /tms/dock-appointments/{id}/check-in; /release; /cancel"
    shared_operations:
      - "all GET endpoints; POST /tms/_clock/set_current_utc"

  - name: FreightAuditor
    description: "Owns freight audit (invoice lifecycle) and claim adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /tms/freight-invoices — record invoice"
      - "POST /tms/freight-invoices/{id}/audit; /approve; /dispute"
      - "POST /tms/claims/{id}/approve; /deny"
    shared_operations:
      - "all GET endpoints; POST /tms/_clock/set_current_utc"
