            - { call: "POST /telerad/discrepancy-cases/${cid}/reconcile", payload: { reconciliation_note: "reviewed with both readers" }, as: QaReviewer, as_user_id: "qa_neutral_1", captures: { st: $.data.status, by: $.data.reconciled_by } }
