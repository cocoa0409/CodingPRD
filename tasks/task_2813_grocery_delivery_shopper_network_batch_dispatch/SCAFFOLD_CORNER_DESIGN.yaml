        excluded_because:
          difficulty_instance: shopper_tier_rolling_vs_lifetime_divergence
          rationale: "That §1.8 instance shows the ROLLING_5 variant gating batch access while the LIFETIME variant gates reinstatement on the same shopper, which is the variant-selection claim for shopper_tier_scoring."

