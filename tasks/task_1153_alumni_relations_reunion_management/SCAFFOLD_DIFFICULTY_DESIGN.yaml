              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev11_id}/registrations"
              payload: { tier_id: "${tier11_id}", alumni_id: "${gueste_id}" }
              as: Alumni
              as_user_id: "${gueste_id}"
              captures: { regn11_id: $.data.id }
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev11_id}/mark-held"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/registrations/${regn11_id}/confirm-payment"
              payload: {}
              as: Alumni
              as_user_id: "${gueste_id}"
              captures: { err11_id: $.data.error_id }
          assert:
            - "error_id == ERR_EVENT_NOT_OPEN"
            - "EventRegistration.${regn11_id}.payment_status == PENDING_PAYMENT (unchanged)"

      - name: program_approve_gated_by_group_status
        grounds:
          - state_machines.ChapterProgram.PROPOSED_to_APPROVED
          - state_machines.AffinityGroup
          - errors[ERR_GROUP_NOT_ACTIVE]
        distinguishing_aspect: |
          Different entity pair ChapterProgram -> AffinityGroup: program approve
          requires the parent group's status == ACTIVE; suspending the group
          after proposal blocks approval even when budget and venue are clean.
        test_recipe:
          setup:
            - "AffinityGroup with budget 100000, program PROPOSED (allocated 10000, no venue conflicts); group then SUSPENDED by director"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Leader One", primary_email: "leader1@x.com", class_year: 2010, degree_code: "MBA" }
              as: AlumniRelationsStaff
              captures: { leader1_id: $.data.id }
            - call: "POST /alumni/groups"
              payload: { name: "NYC Chapter", kind: "REGIONAL_CHAPTER", annual_budget_cents: 100000 }
              as: AlumniRelationsStaff
              captures: { grp1_id: $.data.id }
            - call: "POST /alumni/groups/${grp1_id}/programs"
              payload: { title: "Spring Mixer", venue_slot_start: "2026-06-15T18:00:00Z", venue_slot_end: "2026-06-15T20:00:00Z", budget_allocated_cents: 10000, leader_id: "${leader1_id}" }
              as: AffinityGroupLeader
              as_user_id: "${leader1_id}"
              captures: { prog1_id: $.data.id }
            - call: "POST /alumni/programs/${prog1_id}/propose"
              payload: {}
              as: AffinityGroupLeader
              as_user_id: "${leader1_id}"
            - call: "POST /alumni/groups/${grp1_id}/suspend"
              payload: {}
              as: AlumniRelationsDirector
          trigger:
            - call: "POST /alumni/programs/${prog1_id}/approve"
              payload: {}
              as: AlumniRelationsStaff
              captures: { err12_id: $.data.error_id }
          assert:
            - "error_id == ERR_GROUP_NOT_ACTIVE"
            - "ChapterProgram.${prog1_id}.status == PROPOSED (unchanged)"
            - "AffinityGroup.${grp1_id}.budget_committed_cents == 0"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tier_sales_window_half_open_touching_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.TicketTier.fields.sales_start
        distinguishing_aspect: |
          Interval semantics: half-open [sales_start, sales_end) on the
          ReunionEvent tier resource — a new tier starting exactly at an existing
          tier's sales_end is ALLOWED (touching endpoints), while starting one
          second before sales_end is rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Event with existing tier [2026-05-01T00:00:00Z, 2026-06-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Reunion 25", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev13_id: $.data.id, ev13_v: $.data.version }
            - call: "POST /alumni/events/${ev13_id}/ticket-tiers"
              payload: { name: "Early", base_price_cents: 1000, capacity: 10, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-06-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${ev13_v}" }
              as: AlumniRelationsStaff
            - call: "GET /alumni/events/${ev13_id}"
              as: AlumniRelationsStaff
              captures: { ev13_v2: $.data.version }
          trigger:
            - call: "POST /alumni/events/${ev13_id}/ticket-tiers"
              payload: { name: "Regular", base_price_cents: 1500, capacity: 10, sales_start: "2026-06-01T00:00:00Z", sales_end: "2026-08-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${ev13_v2}" }
              as: AlumniRelationsStaff
              captures: { tier13b_id: $.data.id }
            - call: "GET /alumni/events/${ev13_id}"
              as: AlumniRelationsStaff
              captures: { ev13_v3: $.data.version }
            - call: "POST /alumni/events/${ev13_id}/ticket-tiers"
              payload: { name: "Overlapper", base_price_cents: 2000, capacity: 10, sales_start: "2026-07-31T23:59:59Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${ev13_v3}" }
              as: AlumniRelationsStaff
              captures: { err13_id: $.data.error_id }
          assert:
            - "Second tier created successfully (touching at 2026-06-01T00:00:00Z is allowed under half-open semantics)"
            - "Third tier rejected with error_id == ERR_WINDOW_OVERLAP (starts one second inside [2026-06-01, 2026-08-01))"

      - name: program_venue_closed_interval_with_buffer
        grounds:
          - state_machines.ChapterProgram.PROPOSED_to_APPROVED
          - errors[ERR_VENUE_CONFLICT]
        distinguishing_aspect: |
          Different resource (ChapterProgram venue slots per AffinityGroup) AND
          different interval semantics: closed intervals extended by a 60-minute
          post-event buffer — a program starting exactly at another's
          venue_slot_end still CONFLICTS because the buffer occupies
          [end, end+60min]; only a start >= prior_end + 60min is clean.
        test_recipe:
          setup:
            - "Group budget 500000; program P1 APPROVED at [2026-06-15T18:00, 2026-06-15T20:00]; leader proposes P2 at [2026-06-15T20:00, 2026-06-15T22:00] (touching, inside buffer) and P3 at [2026-06-15T21:00, 2026-06-15T23:00] (exactly at buffer end, clean)"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Leader Two", primary_email: "leader2@x.com", class_year: 2010, degree_code: "MBA" }
              as: AlumniRelationsStaff
              captures: { leader2_id: $.data.id }
            - call: "POST /alumni/groups"
              payload: { name: "Boston Chapter", kind: "REGIONAL_CHAPTER", annual_budget_cents: 500000 }
              as: AlumniRelationsStaff
              captures: { grp2_id: $.data.id }
            - call: "POST /alumni/groups/${grp2_id}/programs"
              payload: { title: "P1", venue_slot_start: "2026-06-15T18:00:00Z", venue_slot_end: "2026-06-15T20:00:00Z", budget_allocated_cents: 10000, leader_id: "${leader2_id}" }
              as: AffinityGroupLeader
              as_user_id: "${leader2_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /alumni/programs/${p1_id}/propose"
              payload: {}
              as: AffinityGroupLeader
              as_user_id: "${leader2_id}"
            - call: "POST /alumni/programs/${p1_id}/approve"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/groups/${grp2_id}/programs"
              payload: { title: "P2 touching", venue_slot_start: "2026-06-15T20:00:00Z", venue_slot_end: "2026-06-15T22:00:00Z", budget_allocated_cents: 10000, leader_id: "${leader2_id}" }
              as: AffinityGroupLeader
              as_user_id: "${leader2_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /alumni/programs/${p2_id}/propose"
              payload: {}
              as: AffinityGroupLeader
              as_user_id: "${leader2_id}"
            - call: "POST /alumni/groups/${grp2_id}/programs"
              payload: { title: "P3 after buffer", venue_slot_start: "2026-06-15T21:00:00Z", venue_slot_end: "2026-06-15T23:00:00Z", budget_allocated_cents: 10000, leader_id: "${leader2_id}" }
              as: AffinityGroupLeader
              as_user_id: "${leader2_id}"
              captures: { p3_id: $.data.id }
            - call: "POST /alumni/programs/${p3_id}/propose"
              payload: {}
              as: AffinityGroupLeader
              as_user_id: "${leader2_id}"
          trigger:
            - call: "POST /alumni/programs/${p2_id}/approve"
              payload: {}
              as: AlumniRelationsStaff
              captures: { err14_id: $.data.error_id }
            - call: "POST /alumni/programs/${p3_id}/approve"
              payload: {}
              as: AlumniRelationsStaff
          assert:
            - "P2 approve rejected with error_id == ERR_VENUE_CONFLICT (start at P1.end still inside [P1.start, P1.end+60min])"
            - "P3 approve succeeds: ChapterProgram.${p3_id}.status == APPROVED (start at exactly P1.end + 60min is outside the buffered interval)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: group_budget_invariant_under_approve_and_cancel
        grounds:
          - state_machines.ChapterProgram.PROPOSED_to_APPROVED
          - state_machines.ChapterProgram.APPROVED_to_CANCELLED
          - entities.AffinityGroup.fields.budget_remaining_cents
        distinguishing_aspect: |
          Conserved quantity: AffinityGroup budget. Invariant —
          budget_remaining_cents == annual_budget_cents - budget_committed_cents
          - budget_spent_cents must hold before and after the forward action
          (approve, +allocated to committed) paired with its compensating action
          (cancel, -allocated from committed): the pair leaves committed, spent,
          and remaining exactly unchanged.
        test_recipe:
          setup:
            - "Group annual_budget 200000, no programs; leader with a PROPOSED program allocating 50000"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Leader Three", primary_email: "leader3@x.com", class_year: 2010, degree_code: "MBA" }
              as: AlumniRelationsStaff
              captures: { leader3_id: $.data.id }
            - call: "POST /alumni/groups"
              payload: { name: "DC Chapter", kind: "REGIONAL_CHAPTER", annual_budget_cents: 200000 }
              as: AlumniRelationsStaff
              captures: { grp3_id: $.data.id }
            - call: "POST /alumni/groups/${grp3_id}/programs"
              payload: { title: "Gala", venue_slot_start: "2026-07-10T18:00:00Z", venue_slot_end: "2026-07-10T21:00:00Z", budget_allocated_cents: 50000, leader_id: "${leader3_id}" }
              as: AffinityGroupLeader
              as_user_id: "${leader3_id}"
              captures: { prog3_id: $.data.id }
            - call: "POST /alumni/programs/${prog3_id}/propose"
              payload: {}
              as: AffinityGroupLeader
              as_user_id: "${leader3_id}"
          trigger:
            - call: "POST /alumni/programs/${prog3_id}/approve"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/programs/${prog3_id}/cancel"
              payload: {}
              as: AlumniRelationsStaff
          assert:
            - "AffinityGroup.${grp3_id}.budget_committed_cents == 0 (approve +50000 then cancel -50000)"
            - "AffinityGroup.${grp3_id}.budget_spent_cents == 0"
            - "AffinityGroup.${grp3_id}.budget_remaining_cents == 200000 (invariant restored exactly)"
            - "ChapterProgram.${prog3_id}.status == CANCELLED"

      - name: tier_sold_count_and_revenue_invariant_under_confirm_and_refund
        grounds:
          - state_machines.EventRegistration.PENDING_PAYMENT_to_CONFIRMED
          - state_machines.EventRegistration.CONFIRMED_to_REFUNDED
          - entities.ReunionEvent.fields.total_revenue_cents
        distinguishing_aspect: |
          Different conserved quantity: seat inventory and revenue on
          TicketTier/ReunionEvent. Invariant — confirm (+1 sold_count,
          +final_price revenue) paired with refund (-1 sold_count, -final_price
          revenue) leaves sold_count and total_revenue_cents exactly at their
          pre-pair values; no drift.
        test_recipe:
          setup:
            - "Event OPEN_FOR_REGISTRATION, tier base 4000 capacity 0 window open, clock 2026-06-01 (before cutoff 2026-07-03... event_date 2026-09-01 -> cutoff 2026-07-03; late window starts 2026-08-25) so no adjustments: final 4000"
            - "Registrant G with no committee membership"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Chair Twelve", primary_email: "chair12@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chair12_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Guest F", primary_email: "guestf@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { guestf_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Reunion 25", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev15_id: $.data.id, ev15_v: $.data.version }
            - call: "POST /alumni/events/${ev15_id}/committee"
              payload: { name: "Committee" }
              as: AlumniRelationsStaff
              captures: { com15_id: $.data.id }
            - call: "POST /alumni/committees/${com15_id}/memberships"
              payload: { alumni_id: "${chair12_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem15_id: $.data.id }
            - call: "POST /alumni/memberships/${mem15_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair12_id}"
            - call: "POST /alumni/events/${ev15_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev15_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 4000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${ev15_v}" }
              as: AlumniRelationsStaff
              captures: { tier15_id: $.data.id }
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev15_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${ev15_id}/registrations"
              payload: { tier_id: "${tier15_id}", alumni_id: "${guestf_id}" }
              as: Alumni
              as_user_id: "${guestf_id}"
              captures: { regn15_id: $.data.id }
            - call: "POST /alumni/registrations/${regn15_id}/confirm-payment"
              payload: {}
              as: Alumni
              as_user_id: "${guestf_id}"
            - call: "POST /alumni/registrations/${regn15_id}/refund"
              payload: {}
              as: AlumniRelationsStaff
          assert:
            - "TicketTier.${tier15_id}.sold_count == 0 (confirm +1 then refund -1)"
            - "ReunionEvent.${ev15_id}.total_revenue_cents == 0 (confirm +4000 then refund -4000; no drift)"
            - "EventRegistration.${regn15_id}.payment_status == REFUNDED"
