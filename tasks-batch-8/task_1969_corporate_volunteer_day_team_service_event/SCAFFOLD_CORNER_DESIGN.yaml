  - section: consistency_model
    instances:
      - name: immediate_visibility_after_confirm
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.supervision_requirement]
        distinguishing_aspect: "Immediate consistency: the confirm RESPONSE already shows rsvp_status CONFIRMED, and a follow-up GET of the project and event shows confirmed_volunteer_count 1 / required_staff_leads 1 / confirmed_headcount 1 with no reconciliation delay."
        test_recipe:
          setup: ["project MATCHED to OPEN event; one volunteer REGISTERED with SIGNED waiver"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 52", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 500000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /service-events/${ev1}/open-registration", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /employee-volunteers", payload: { full_name: "Vol One", email: "v1@corp.com", department: "Eng", date_of_birth: "1990-01-01" }, as: CommunityEngagementManager, captures: { vol1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev1}", project_id: "${proj1}", wants_meal: false }, as: EmployeeVolunteer, as_user_id: "${vol1}", captures: { reg1: $.data.id } }
            - { call: "POST /registrations/${reg1}/sign-waiver", payload: { signer_name: "Vol One", signer_relation: "SELF", media_consent: false }, as: EmployeeVolunteer, as_user_id: "${vol1}" }
          trigger:
            - { call: "POST /registrations/${reg1}/confirm", payload: {}, as: CommunityEngagementManager, captures: { resp_status: $.data.rsvp_status } }
            - { call: "GET /service-projects/${proj1}", payload: {}, as: Any, captures: { p_count: $.data.confirmed_volunteer_count, p_req: $.data.required_staff_leads } }
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { e_count: $.data.confirmed_headcount } }
          assert:
            - "confirm response itself: rsvp_status == CONFIRMED"
            - "immediately after: project.confirmed_volunteer_count == 1, required_staff_leads == 1, event.confirmed_headcount == 1"

