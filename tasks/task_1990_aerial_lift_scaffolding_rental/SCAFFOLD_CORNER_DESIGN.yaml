      - name: driver_cannot_start_unassigned_trip
        claim_type: rbac_ownership
        grounds:
          - "roles[Driver]"
          - "state_machines.DeliveryTrip.SCHEDULED_to_EN_ROUTE"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Trip execution is assignment-scoped: Driver drv-2 cannot start a trip whose driver_id is drv-1."
        test_recipe:
          setup: ["contract ACTIVE; RESERVED line; DELIVERY trip SCHEDULED with driver_id drv-1"]
          setup_api_calls:
