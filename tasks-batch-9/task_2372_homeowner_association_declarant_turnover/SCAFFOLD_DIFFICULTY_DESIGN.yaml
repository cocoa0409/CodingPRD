# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2372_homeowner_association_declarant_turnover
# 9 rule_ids / 24 instances. Every numeric assert below was executed against the
# §1.3 formulas and their constants before being written down.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: reserve_adequacy_component_full_funding_vs_cash_flow_divergence
        grounds:
          - calculations.reserve_funding_adequacy
          - entities.ReserveStudy.fields.evaluated_method
          - entities.ReserveStudy.fields.percent_funded
          - entities.ReserveStudy.fields.min_projected_balance_cents
          - entities.ReserveStudy.fields.adequacy_verdict
          - entities.ReserveStudy.fields.recommended_annual_contribution_cents
          - state_machines.ReserveStudy.DRAFT_to_DRAFT
        distinguishing_aspect: |
          This instance lives in the reserve-funding domain (Association cash pool + CommonAreaComponent
          depreciation schedule): the two variants read DISJOINT input sets — component_full_funding reads
          the conveyed-component depreciation table and ignores planned_annual_contribution_cents, while
          cash_flow reads the contribution/expenditure pair and ignores the component table entirely — so
          one identical ReserveStudy row yields adequacy_verdict DEFICIENT with recommendation 740000 under
          COMPONENT_FULL_FUNDING and ADEQUATE with recommendation 700000 under CASH_FLOW.
        test_recipe:
          setup:
            - "Association 'Alpha Ridge' with reserve_pool_cents = 1200000."
            - "Two CommonAreaComponents, both build_status COMPLETE and conveyance_status CONVEYED: comp A replacement 6000000 / life 20 / age 12, comp B replacement 5000000 / life 25 / age 25 (age at cap)."
            - "One ReserveStudy in DRAFT with planned_annual_contribution_cents 700000 and projected_annual_expenditure_cents 500000."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Alpha Ridge", total_planned_lots: 30, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 1200000, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 150000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Clubhouse", category: "AMENITY", replacement_cost_cents: 6000000, useful_life_years: 20, effective_age_years: 12, promised_completion_date: "2024-05-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_a_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Private Streets", category: "INFRASTRUCTURE", replacement_cost_cents: 5000000, useful_life_years: 25, effective_age_years: 25, promised_completion_date: "2024-05-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_b_id: $.data.id }
            - call: "POST /hoa/components/${comp_a_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2024-05-10T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_a_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_a_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/components/${comp_b_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2024-05-10T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_b_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_b_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "COMPONENT_FULL_FUNDING", planned_annual_contribution_cents: 700000, projected_annual_expenditure_cents: 500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_id: $.data.id }
          trigger:
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "RECOMPUTE", method: "COMPONENT_FULL_FUNDING" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "first trigger call returns 200 with data.evaluated_method == COMPONENT_FULL_FUNDING"
            - "first trigger call: data.component_count == 2"
            - "first trigger call: data.fully_funded_balance_cents == 8600000"
            - "first trigger call: data.percent_funded == 13.95"
            - "first trigger call: data.min_projected_balance_cents == 0"
            - "first trigger call: data.adequacy_verdict == DEFICIENT"
            - "first trigger call: data.recommended_annual_contribution_cents == 740000"
            - "second trigger call returns 200 with data.evaluated_method == CASH_FLOW"
            - "second trigger call: data.min_projected_balance_cents == 1200000"
            - "second trigger call: data.adequacy_verdict == ADEQUATE"
            - "second trigger call: data.recommended_annual_contribution_cents == 700000"
            - "second trigger call: data.fully_funded_balance_cents == 8600000 and data.percent_funded == 13.95 are still reported, proving the CASH_FLOW verdict ignored them"
            - "Association.${assoc_id}.reserve_pool_cents == 1200000 unchanged by either evaluation"

      - name: claim_reserve_repair_cost_vs_diminution_variant_divergence
        grounds:
          - calculations.defect_claim_reserve_amount
          - entities.DefectClaim.fields.valuation_basis
          - entities.DefectClaim.fields.reserve_subtotal_cents
          - entities.DefectClaim.fields.litigation_admin_fee_cents
          - entities.DefectClaim.fields.reserved_amount_cents
          - entities.Association.fields.reserve_claim_available_cents
          - state_machines.DefectClaim.NOTICED_to_RESERVED
        distinguishing_aspect: |
          This instance lives in the construction-defect litigation domain (DefectClaim against a conveyed
          CommonAreaComponent), and its variant switch changes the SELECTED FEE TIER, not just the base
          number: two sibling claims carrying the identical pair (repair 2400000, diminution 1500000) land
          in tier 2 (rate 0.09, fee 216000, reserved 2616000) under REPAIR_COST and tier 1 (rate 0.12,
          fee 180000, reserved 1680000) under DIMINUTION.
        test_recipe:
          setup:
            - "Association 'Birch Commons' with reserve_claim_pool_cents = 5000000 and statute_of_repose_years = 8."
            - "One CommonAreaComponent, build_status COMPLETE with substantial_completion_date 2020-06-15T00:00:00Z and conveyance_status CONVEYED, so both claims carry repose_deadline 2028-06-15T00:00:00Z."
            - "Two DefectClaims on that component, both NOTICED, each with repair_cost_estimate_cents 2400000 and diminution_value_cents 1500000."
            - "Logical clock at its default 2026-08-01T00:00:00Z, well inside the repose period."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Birch Commons", total_planned_lots: 24, turnover_threshold_pct: 75.00, fixed_turnover_date: "2027-06-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 500000, reserve_claim_pool_cents: 5000000, declarant_monthly_subsidy_cents: 100000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Parking Structure", category: "STRUCTURE", replacement_cost_cents: 9000000, useful_life_years: 40, effective_age_years: 6, promised_completion_date: "2020-06-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2020-06-15T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Post-tension slab cracking, bay 3", repair_cost_estimate_cents: 2400000, diminution_value_cents: 1500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_r_id: $.data.id }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Post-tension slab cracking, bay 4", repair_cost_estimate_cents: 2400000, diminution_value_cents: 1500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_d_id: $.data.id }
            - call: "POST /hoa/defect-claims/${claim_r_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_d_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /hoa/defect-claims/${claim_r_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "REPAIR_COST" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims/${claim_d_id}/actions"
              payload: { action: "RESERVE", valuation_basis: "DIMINUTION" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "DefectClaim.${claim_r_id}.reserve_subtotal_cents == 2400000"
            - "DefectClaim.${claim_r_id}.litigation_admin_fee_cents == 216000"
            - "DefectClaim.${claim_r_id}.reserved_amount_cents == 2616000"
            - "DefectClaim.${claim_d_id}.reserve_subtotal_cents == 1500000"
            - "DefectClaim.${claim_d_id}.litigation_admin_fee_cents == 180000"
            - "DefectClaim.${claim_d_id}.reserved_amount_cents == 1680000"
            - "DefectClaim.${claim_r_id}.status == RESERVED and DefectClaim.${claim_d_id}.status == RESERVED"
            - "Association.${assoc_id}.reserve_claim_committed_cents == 4296000"
            - "Association.${assoc_id}.reserve_claim_available_cents == 704000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: assessment_reforecast_four_input_non_linear_composition
        grounds:
          - calculations.assessment_reforecast
          - calculations.reserve_funding_adequacy
          - entities.AssessmentSchedule.fields.billable_lot_count
          - entities.AssessmentSchedule.fields.reserve_contribution_cents
          - entities.AssessmentSchedule.fields.subsidy_offset_cents
          - entities.AssessmentSchedule.fields.annual_requirement_cents
          - entities.Association.fields.subsidy_end_date
        distinguishing_aspect: |
          Difficulty mode (a): annual_requirement_cents composes FOUR independently sourced inputs that no
          single entity holds — the request's projected_operating_cost_cents, the ADOPTED ReserveStudy's
          recommended_annual_contribution_cents (itself the output of a second calculation), the count of
          Lot rows filtered to {CLOSED, UNDER_CONTRACT}, and a subsidy offset that is
          declarant_monthly_subsidy_cents times the number of fiscal-year months strictly before
          Association.subsidy_end_date's YYYY-MM. With 7 billable lots of 9 total, a 700000 reserve
          recommendation and a 2026-11-01 subsidy end, FY2026 lands on 4800000 + 700000 - 1500000 = 4000000.
        test_recipe:
          setup:
            - "Association 'Cedar Bluff' with total_planned_lots 9 and declarant_monthly_subsidy_cents 150000, reserve_pool_cents 1200000."
            - "9 Lots: lots 1-4 CLOSED, lots 5-7 UNDER_CONTRACT, lots 8-9 UNSOLD, so billable_lot_count is 7 and 2 lots are excluded."
            - "One ADOPTED ReserveStudy evaluated under CASH_FLOW whose recommended_annual_contribution_cents is 700000."
            - "One ENGAGED AuditEngagement, and the TurnoverCase advanced to financial_status AUDIT_IN_PROGRESS with Association.subsidy_end_date = 2026-11-01T00:00:00Z."
            - "No AssessmentSchedule has ever been adopted, so the FY2026 draft is the first."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Cedar Bluff", total_planned_lots: 9, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 1200000, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 150000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/turnover-cases"
              payload: { association_id: "${assoc_id}", total_seats: 5 }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-001" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot1_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-002" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot2_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-003" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot3_id: $.data.id }
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-004" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { lot4_id: $.data.id }
            - call: "POST /hoa/lots/${lot1_id}/close-sale"
              payload: { closing_date: "2026-02-10T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot2_id}/close-sale"
              payload: { closing_date: "2026-02-11T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot3_id}/close-sale"
              payload: { closing_date: "2026-02-12T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots/${lot4_id}/close-sale"
              payload: { closing_date: "2026-02-13T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-005", sale_status: "UNDER_CONTRACT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-006", sale_status: "UNDER_CONTRACT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-007", sale_status: "UNDER_CONTRACT" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-008", sale_status: "UNSOLD" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/lots"
              payload: { association_id: "${assoc_id}", lot_number: "L-009", sale_status: "UNSOLD" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/reserve-studies"
              payload: { association_id: "${assoc_id}", funding_method: "CASH_FLOW", planned_annual_contribution_cents: 700000, projected_annual_expenditure_cents: 500000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { study_id: $.data.id }
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "RECOMPUTE", method: "CASH_FLOW" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/reserve-studies/${study_id}/actions"
              payload: { action: "ADOPT" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/audit-engagements"
              payload: { association_id: "${assoc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Auditor
              as_user_id: "auditor-9"
              captures: { audit_id: $.data.id }
            - call: "POST /hoa/turnover-cases/${case_id}/advance"
              payload: { dimension: "FINANCIAL", subsidy_end_date: "2026-11-01T00:00:00Z" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "GET /hoa/associations/${assoc_id}"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { assoc_v: $.data.version }
          trigger:
            - call: "POST /hoa/assessment-schedules"
              payload: { association_id: "${assoc_id}", fiscal_year: 2026, projected_operating_cost_cents: 4800000, expected_association_version: "${assoc_v}" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { sched_2026_id: $.data.id }
          assert:
            - "trigger returns 201"
            - "AssessmentSchedule.${sched_2026_id}.billable_lot_count == 7"
            - "AssessmentSchedule.${sched_2026_id}.reserve_contribution_cents == 700000"
            - "AssessmentSchedule.${sched_2026_id}.subsidy_offset_cents == 1500000"
            - "AssessmentSchedule.${sched_2026_id}.annual_requirement_cents == 4000000"
            - "AssessmentSchedule.${sched_2026_id}.per_lot_monthly_assessment_cents == 47620"
            - "AssessmentSchedule.${sched_2026_id}.increase_pct_vs_prior == 0.00"
            - "AssessmentSchedule.${sched_2026_id}.owner_vote_required == false"
            - "AssessmentSchedule.${sched_2026_id}.status == DRAFT"

      - name: assessment_per_lot_rounding_order_produces_residual
        grounds:
          - calculations.assessment_reforecast
          - entities.AssessmentSchedule.fields.per_lot_monthly_assessment_cents
          - entities.AssessmentSchedule.fields.annual_budget_total_cents
          - entities.AssessmentSchedule.fields.residual_cents
          - entities.Association.fields.reserve_pool_cents
          - state_machines.AssessmentSchedule.DRAFT_to_ADOPTED
        distinguishing_aspect: |
          Difficulty mode (b): the pinned rounding ORDER is per-lot-first-then-multiply-back-up, so
          annual_budget_total_cents (4000080 for FY2026, 4800096 for FY2027) deliberately overshoots
          annual_requirement_cents (4000000, 4800050) and leaves residual_cents 80 and 46; the forbidden
          sum-then-round-once order would report residual_cents 0 and an annual_budget_total equal to the
          requirement. Adoption then credits the residual to Association.reserve_pool_cents, so the
          rounding order is observable twice — on the schedule and on the association's cash.
        test_recipe:
          setup:
            - "Same Cedar Bluff shape as instance assessment_reforecast_four_input_non_linear_composition: 7 billable lots of 9, ADOPTED CASH_FLOW study recommending 700000, financial_status AUDIT_IN_PROGRESS, subsidy_end_date 2026-11-01T00:00:00Z, reserve_pool_cents 1200000."
            - "FY2026 draft already created with projected_operating_cost_cents 4800000 (requirement 4000000)."
          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Cedar Bluff", total_planned_lots: 9, turnover_threshold_pct: 66.67, fixed_turnover_date: "2026-07-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 1200000, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 150000 }
              as: PlatformAdmin
