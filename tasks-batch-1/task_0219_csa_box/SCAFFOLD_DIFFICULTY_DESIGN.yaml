            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 5 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m16@x.com", full_name: "M 16", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", requested_site_id: "${site_id}" }
              as: Anonymous
              captures: { wl_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              as: DeliveryCoordinator
              captures: { sea_v: $.data.version }
            - call: "POST /seasons/${season_id}/promote-waitlist"
              payload: { share_type_id: "${share_id}", requested_site_id: "${site_id}", expected_season_version: "${sea_v}" }
              as: DeliveryCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /waitlist-entries/${wl_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "WaitlistEntry.${wl_id}.status == CONVERTED (clock == offer_expires_at is inclusive, accept succeeds)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hold_then_release_conserves_outstanding_balance
        grounds:
          - state_machines.WeeklyBox.SCHEDULED_to_HELD
          - state_machines.WeeklyBox.HELD_to_SCHEDULED
          - calculations.outstanding_balance
        distinguishing_aspect: |
          Conserved quantity = Subscription.outstanding_balance_cents. A REFUND hold (CREDIT_HOLD_REFUND −4167) paired
          with its release (offsetting CHARGE +4167) MUST leave outstanding_balance_cents exactly equal to its pre-hold
          value (50000), with zero drift.
        test_recipe:
          setup:
            - "CONFIRMED BASELINE subscription, season_price 50000, outstanding 50000; clock 2026-06-15; REFUND hold placed on box week 5 then released"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S17", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
