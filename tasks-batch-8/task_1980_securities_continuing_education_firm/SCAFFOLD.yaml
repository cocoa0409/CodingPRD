# =============================================================================
# Task 1980: Securities Continuing Education & Firm Element (broker-dealer
# training department) — seed tables (SCAFFOLD.yaml, sections 1.0-1.7)
# =============================================================================

scenario: |
  1980. Securities Continuing Education & Firm Element (broker-dealer training department): regulatory element assignment & completion deadline, firm element needs analysis & training plan, annual attestation & documentation, product-specific training triggered by new offerings, delivery tracking & non-completion enforcement (registration inactive), state CE requirement for insurance-licensed reps, training content approval, audit evidence

domain_name: securities-ce-firm-element
api_prefix: ""   # flat API: every resource is a top-level collection; FKs travel in request bodies / list filters

# =============================================================================
# Complexity Profile (selected per SKILL.md section 0.1-0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects      # lapse cascade, void cascade, retire cascade
    - dual_variant_calculation    # plan certified-vs-projected; state-CE strict-vs-carryover
    - optimistic_concurrency      # OCC on Representative.version and TrainingContent.version
    - ops_run_checkpoint          # POST /enforcement/sweep advances deadline enforcement epoch
  entity_topology: flat           # peer entities with foreign-key references; no URL nesting
  state_machine_shape: branching  # content rework cycle; enrollment retake cycle; assignment OVERDUE/LAPSED forks; plan reopen loop
  relationship_patterns:
    - one_to_many                 # Representative -> enrollments/plans/assignments/certs/licenses
    - cross_aggregate             # Enrollment references TrainingContent + CourseSession; certs reference product + enrollment
    - polymorphic                 # AuditEvent.subject (entity_type + entity_id), deliberately NOT a constrained FK
  role_model: segregation_of_duties  # author != approver; rep attests self; only ComplianceOfficer voids
  consistency_model: immediate    # all side effects atomic in the triggering request
  calibration:
    level: Expert
    entity_count: 12
    endpoint_count: 54
    error_code_count: 39
    state_machine_count: 9

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Representative
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: crd_number, type: string, source: input, description: "Central Registration Depository number; unique across all representatives" }
      - { name: full_name, type: string, source: input, description: "Registered representative legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: role_tier, type: enum, source: input, description: "RR | PRINCIPAL — drives firm element base hours" }
      - { name: insurance_licensed, type: boolean, source: input, description: "True when the rep also holds a state insurance license (state CE applies)" }
      - { name: resident_state_code, type: string, source: input, description: "Two-letter resident state code" }
      - { name: prior_year_excess_hours, type: number, source: input, default: 0, description: "Firm element excess credit carried from the prior plan year (>= 0)" }
      - { name: registration_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE_CE | TERMINATED — flips on regulatory-element lapse / late completion" }

  - name: TrainingContent
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique course code" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: ce_category, type: enum, source: input, description: "REGULATORY_ELEMENT | FIRM_ELEMENT | PRODUCT | STATE_INSURANCE" }
      - { name: delivery_format, type: enum, source: input, description: "ELEARNING | INSTRUCTOR_LED" }
      - { name: credit_hours, type: number, source: input, description: "Credit hours awarded on completion (> 0, up to 2 decimal places)" }
      - { name: min_passing_score, type: integer, source: input, description: "Passing score 0..100; completion requires score >= min_passing_score" }
      - { name: content_status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | RETIRED" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the TrainingAdmin who created the content ( segregation-of-duties anchor )" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving ComplianceOfficer; null until APPROVED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at rejection; cleared on rework edit" }

  - name: CourseSession
    parent: null
    common_fields: true
    fields:
      - { name: content_id, type: string, source: input, description: "FK -> TrainingContent.id; delivered content" }
      - { name: room_name, type: string, source: input, description: "Room resource identifier for overlap checks" }
      - { name: start_at, type: datetime, source: input, description: "Session start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Session end (exclusive for room overlap; must be > start_at)" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity (>= 1)" }
      - { name: session_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | DELIVERED | CANCELLED" }
      - { name: available_seats, type: integer, source: computed, description: "= capacity - count(linked enrollments in ENROLLED/IN_PROGRESS/COMPLETED)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> Representative.id; enrolled rep" }
      - { name: content_id, type: string, source: input, description: "FK -> TrainingContent.id; optional in payload when session_id is supplied (derived from the session's content)" }
      - { name: session_id, type: string, source: input, description: "FK -> CourseSession.id; required iff content.delivery_format == INSTRUCTOR_LED, forbidden otherwise" }
      - { name: enrollment_status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | IN_PROGRESS | COMPLETED | FAILED | CANCELLED | EXPIRED | VOIDED" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of completion attempts recorded; MAX_ATTEMPTS = 3 caps retakes" }
      - { name: last_score, type: integer, source: system, description: "Score of the most recent completion attempt; null until first attempt" }
      - { name: expires_at, type: datetime, source: system, description: "= created_at + ENROLLMENT_VALIDITY_DAYS (90); recomputed on reattempt" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of the passing attempt; null until COMPLETED" }

  - name: RegulatoryAssignment
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> Representative.id; assigned rep" }
      - { name: cycle_year, type: integer, source: input, description: "Regulatory element cycle year" }
      - { name: assignment_status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | OVERDUE | LAPSED | COMPLETED" }
      - { name: due_at, type: datetime, source: system, description: "= created_at + ASSIGNMENT_WINDOW_DAYS (120)" }
      - { name: lapse_after, type: datetime, source: system, description: "= due_at + GRACE_DAYS (30)" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the fulfilling regulatory-element enrollment; null until completed" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp the assignment was fulfilled; null until COMPLETED" }

  - name: FirmElementPlan
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> Representative.id; plan owner" }
      - { name: plan_year, type: integer, source: input, description: "Calendar year the plan covers" }
      - { name: plan_status, type: enum, source: system, default: NEEDS_ANALYSIS, description: "NEEDS_ANALYSIS | PLAN_PUBLISHED | CLOSED | SUPERSEDED" }
      - { name: needs_analysis_document_ref, type: string, source: system, description: "Document reference recorded by the needs-analysis endpoint" }
      - { name: needs_analysis_notes, type: string, source: system, description: "Free-text needs analysis notes" }
      - { name: needs_analysis_completed_at, type: datetime, source: system, description: "Set when needs analysis is recorded; null until then" }
      - { name: required_hours, type: number, source: computed, description: "Firm element requirement computed at publish (see calculation firm_element_required_hours); null until published" }
      - { name: certified_hours, type: number, source: computed, default: 0, description: "Sum of credit_hours from COMPLETED non-voided FIRM_ELEMENT enrollments for this rep whose completed_at year == plan_year" }
      - { name: projected_hours, type: number, source: computed, default: 0, description: "certified_hours + credit_hours of IN_PROGRESS FIRM_ELEMENT enrollments (same rep/year filter)" }
      - { name: published_at, type: datetime, source: system, description: "Null until PLAN_PUBLISHED" }
      - { name: closed_at, type: datetime, source: system, description: "Null until CLOSED; cleared if the plan reopens" }

  - name: AnnualAttestation
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: system, description: "FK -> Representative.id; copied from the plan at creation" }
      - { name: plan_id, type: string, source: system, description: "FK -> FirmElementPlan.id; attestation belongs to exactly one plan" }
      - { name: attestation_status, type: enum, source: system, default: PENDING, description: "PENDING | ATTESTED | VOIDED" }
      - { name: attestation_statement, type: string, source: system, description: "Statement text recorded at attestation; null until ATTESTED" }
      - { name: attested_at, type: datetime, source: system, description: "Null until ATTESTED" }

  - name: ProductOffering
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: required_training_content_id, type: string, source: input, description: "FK -> TrainingContent.id; product-specific training that gates selling" }
      - { name: product_status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | LAUNCHED | WITHDRAWN" }
      - { name: launched_at, type: datetime, source: system, description: "Null until LAUNCHED" }

  - name: ProductCertification
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: system, description: "FK -> Representative.id; certified rep" }
      - { name: product_id, type: string, source: system, description: "FK -> ProductOffering.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the fulfilling product-training enrollment; null until CERTIFIED" }
      - { name: cert_status, type: enum, source: system, default: PENDING_TRAINING, description: "PENDING_TRAINING | CERTIFIED | SUSPENDED" }
      - { name: certified_at, type: datetime, source: system, description: "Null until CERTIFIED" }
      - { name: suspended_reason, type: enum, source: system, description: "REGISTRATION_INACTIVE | REGISTRATION_TERMINATED | CONTENT_RETIRED | PRODUCT_WITHDRAWN | TRAINING_VOIDED; null unless SUSPENDED" }

  - name: StateCELicense
    parent: null
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: input, description: "FK -> Representative.id; license holder (must have insurance_licensed == true)" }
      - { name: state_code, type: string, source: input, description: "Two-letter licensing state; unique per rep" }
      - { name: required_hours, type: number, source: input, description: "State-required CE hours per renewal period (> 0)" }
      - { name: period_start, type: datetime, source: input, description: "Current renewal period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Current renewal period end (exclusive for hour windows; must be > period_start)" }
      - { name: license_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LAPSED (sweep lapses deficient licenses past period_end)" }
      - { name: earned_hours_strict, type: number, source: computed, default: 0, description: "Sum of credit_hours from COMPLETED non-voided STATE_INSURANCE enrollments with completed_at in [period_start, period_end)" }
      - { name: earned_hours_effective, type: number, source: computed, default: 0, description: "= earned_hours_strict + min(CARRYOVER_CAP_HOURS, carried_excess_hours)" }
      - { name: reported_hours, type: number, source: computed, default: 0, description: "Sum over the strict-window set of round_half_up_to_0.5(credit_hours) — per-course rounding BEFORE summation" }
      - { name: carried_excess_hours, type: number, source: system, default: 0, description: "Carryover credit computed at renew: min(CARRYOVER_CAP_HOURS, max(0, strict - required_hours))" }

  - name: TrainingBlackoutWindow
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Blackout label (e.g., year-end close)" }
      - { name: start_at, type: datetime, source: input, description: "Blackout start (inclusive, closed interval)" }
      - { name: end_at, type: datetime, source: input, description: "Blackout end (inclusive, closed interval; must be > start_at)" }

  - name: AuditEvent
    parent: null
    common_fields: false   # append-only evidence log: id + created_at only; no updates, no version
    fields:
      - { name: event_type, type: enum, source: system, description: "CONTENT_APPROVED | CONTENT_REJECTED | CONTENT_RETIRED | ENROLLMENT_COMPLETED | ENROLLMENT_VOIDED | ATTESTATION_ATTESTED | ATTESTATION_VOIDED | ASSIGNMENT_LAPSED | ASSIGNMENT_COMPLETED | REGISTRATION_STATUS_CHANGED | PRODUCT_LAUNCHED | CERTIFICATION_STATUS_CHANGED | ENFORCEMENT_SWEEP_RUN | PLAN_PUBLISHED | PLAN_CLOSED | PLAN_REOPENED" }
      - { name: entity_type, type: string, source: system, description: "Polymorphic subject entity type (e.g., TrainingContent); not a constrained FK" }
      - { name: entity_id, type: string, source: system, description: "Polymorphic subject id; not a constrained FK" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for sweep-driven events" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor; 'system' for sweep-driven events" }
      - { name: detail, type: string, source: system, description: "Human-readable evidence detail (from/to states, amounts)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: TrainingContent
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /contents/{contentId}/submit"
        actor: TrainingAdmin
        preconditions:
          - "content_status == DRAFT (ERR_CONTENT_NOT_EDITABLE)"
        side_effects: []

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /contents/{contentId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "content_status == PENDING_APPROVAL (ERR_CONTENT_NOT_PENDING_APPROVAL)"
          - "X-User-ID != author_user_id (ERR_SOD_AUTHOR_CANNOT_APPROVE)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "AuditEvent CONTENT_APPROVED created"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /contents/{contentId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "content_status == PENDING_APPROVAL (ERR_CONTENT_NOT_PENDING_APPROVAL)"
        side_effects:
          - "rejection_reason := reason"
          - "AuditEvent CONTENT_REJECTED created"

      - from: REJECTED
        to: DRAFT
        trigger: "PUT /contents/{contentId} (rework edit)"
        actor: TrainingAdmin
        preconditions:
          - "content_status IN {DRAFT, REJECTED} (ERR_CONTENT_NOT_EDITABLE)"
          - "expected_content_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "rejection_reason cleared; approved_by_user_id cleared"
          - "increments TrainingContent.version by 1"
        note: "PUT from DRAFT stays DRAFT (same-state edit); from REJECTED returns to DRAFT — the rework loop"

      - from: DRAFT
        to: DRAFT
        trigger: "PUT /contents/{contentId} (same-state edit)"
        actor: TrainingAdmin
        preconditions:
          - "content_status IN {DRAFT, REJECTED} (ERR_CONTENT_NOT_EDITABLE)"
          - "expected_content_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "increments TrainingContent.version by 1"

      - from: APPROVED
        to: RETIRED
        trigger: "POST /contents/{contentId}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "content_status == APPROVED (ERR_CONTENT_NOT_RETIRABLE)"
        side_effects:
          - "linked Enrollments in {ENROLLED, IN_PROGRESS, FAILED} -> CANCELLED (session-linked ones release their seat)"
          - "linked CourseSessions in SCHEDULED -> CANCELLED"
          - "ProductCertifications in CERTIFIED whose product.required_training_content_id == this content -> SUSPENDED with suspended_reason = CONTENT_RETIRED"
          - "AuditEvent CONTENT_RETIRED created"

  - entity: CourseSession
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "system (POST /enforcement/sweep when end_at <= current logical clock)"
        actor: system
        preconditions:
          - "session_status == SCHEDULED and end_at <= now"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{sessionId}/cancel or content-retire cascade"
        actor: TrainingAdmin
        preconditions:
          - "session_status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects:
          - "linked Enrollments in {ENROLLED, IN_PROGRESS} -> CANCELLED (seat released)"

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [CANCELLED, EXPIRED, VOIDED]
    transitions:
      - from: ENROLLED
        to: IN_PROGRESS
        trigger: "POST /enrollments/{enrollmentId}/start"
        actor: RegisteredRep
        preconditions:
          - "enrollment_status == ENROLLED (ERR_ENROLLMENT_INVALID_STATE)"
          - "X-User-ID == rep_id (ERR_OWNERSHIP_REQUIRED)"
          - "Representative.registration_status == ACTIVE (ERR_REGISTRATION_INACTIVE / ERR_REGISTRATION_TERMINATED)"
          - "now <= expires_at (ERR_ENROLLMENT_EXPIRED)"
          - "TrainingContent.content_status == APPROVED (ERR_CONTENT_NOT_APPROVED)"
          - "if session_id set: CourseSession.session_status == SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /enrollments/{enrollmentId}/complete with score >= content.min_passing_score"
        actor: RegisteredRep
        preconditions:
          - "enrollment_status == IN_PROGRESS (ERR_ENROLLMENT_INVALID_STATE)"
          - "X-User-ID == rep_id (ERR_OWNERSHIP_REQUIRED)"
          - "Representative.registration_status == ACTIVE (ERR_REGISTRATION_INACTIVE / ERR_REGISTRATION_TERMINATED)"
          - "now <= expires_at (ERR_ENROLLMENT_EXPIRED)"
          - "TrainingContent.content_status == APPROVED (ERR_CONTENT_NOT_APPROVED)"
        side_effects:
          - "attempt_count += 1; last_score := score; completed_at := now"
          - "FIRM_ELEMENT content: recompute matching FirmElementPlan certified_hours/projected_hours (plan with rep_id == enrollment.rep_id, plan_year == year(completed_at), plan_status IN {PLAN_PUBLISHED, CLOSED})"
          - "REGULATORY_ELEMENT content: run regulatory_completion_selector — the rep's open assignment (assignment_status IN {ASSIGNED, OVERDUE, LAPSED}, earliest due_at ASC, tie-break created_at ASC) -> COMPLETED with enrollment_id/completed_at set; if rep was INACTIVE_CE and no other LAPSED assignment remains: Representative -> ACTIVE and ProductCertifications suspended with reason REGISTRATION_INACTIVE -> CERTIFIED (only where product LAUNCHED and content APPROVED)"
          - "PRODUCT content: ProductCertifications in PENDING_TRAINING for (rep_id, product whose required_training_content_id == content) -> CERTIFIED with enrollment_id/certified_at set"
          - "STATE_INSURANCE content: recompute matching StateCELicense earned_hours_strict/earned_hours_effective/reported_hours"
          - "AuditEvent ENROLLMENT_COMPLETED created"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /enrollments/{enrollmentId}/complete with score < content.min_passing_score"
        actor: RegisteredRep
        preconditions:
          - "same preconditions as the COMPLETED transition"
        side_effects:
          - "attempt_count += 1; last_score := score"
          - "no credit hours accrue anywhere"

      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /enrollments/{enrollmentId}/cancel or session-cancel / content-retire / terminate cascades"
        actor: TrainingAdmin
        preconditions:
          - "enrollment_status IN {ENROLLED, IN_PROGRESS} (ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "if session-linked: session.available_seats += 1"
          - "plan/license recomputes (CANCELLED rows are excluded from every hour aggregation)"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /enrollments/{enrollmentId}/cancel or session-cancel / content-retire / terminate cascades"
        actor: TrainingAdmin
        preconditions:
          - "enrollment_status IN {ENROLLED, IN_PROGRESS} (ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "if session-linked: session.available_seats += 1"
          - "plan projected_hours recomputed (dropping this enrollment's hours)"

      - from: FAILED
        to: ENROLLED
        trigger: "POST /enrollments/{enrollmentId}/reattempt"
        actor: RegisteredRep
        preconditions:
          - "enrollment_status == FAILED (ERR_ENROLLMENT_INVALID_STATE)"
          - "X-User-ID == rep_id (ERR_OWNERSHIP_REQUIRED)"
          - "attempt_count < MAX_ATTEMPTS (3) (ERR_MAX_ATTEMPTS_REACHED)"
          - "Representative.registration_status == ACTIVE (ERR_REGISTRATION_INACTIVE / ERR_REGISTRATION_TERMINATED)"
          - "TrainingContent.content_status == APPROVED (ERR_CONTENT_NOT_APPROVED)"
        side_effects:
          - "expires_at := now + ENROLLMENT_VALIDITY_DAYS (fresh 90-day window)"
        note: "retake cycle FAILED -> ENROLLED -> IN_PROGRESS -> ... until pass or attempts exhausted"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /enrollments/{enrollmentId}/void"
        actor: ComplianceOfficer
        preconditions:
          - "enrollment_status == COMPLETED (ERR_ENROLLMENT_INVALID_STATE)"
        side_effects:
          - "if session-linked: session.available_seats += 1"
          - "FIRM_ELEMENT: recompute plan hours; if plan CLOSED and certified_hours < required_hours -> plan reopens CLOSED -> PLAN_PUBLISHED (closed_at cleared) and its AnnualAttestation in ATTESTED -> VOIDED (AuditEvent PLAN_REOPENED + ATTESTATION_VOIDED)"
          - "STATE_INSURANCE: recompute license earned/reported hours"
          - "REGULATORY_ELEMENT: if a COMPLETED RegulatoryAssignment has enrollment_id == this enrollment, revert it per current clock: now <= due_at -> ASSIGNED; due_at < now <= lapse_after -> OVERDUE; now > lapse_after -> LAPSED (a lapse re-runs the registration cascade: rep -> INACTIVE_CE, CERTIFIED certs -> SUSPENDED with REGISTRATION_INACTIVE); enrollment_id/completed_at cleared"
          - "PRODUCT: ProductCertification with enrollment_id == this enrollment and CERTIFIED -> SUSPENDED with TRAINING_VOIDED"
          - "AuditEvent ENROLLMENT_VOIDED created"

      - from: ENROLLED
        to: EXPIRED
        trigger: "system (POST /enforcement/sweep when now > expires_at)"
        actor: system
        preconditions:
          - "enrollment_status IN {ENROLLED, IN_PROGRESS} and now > expires_at (strictly greater; exactly at expires_at still valid)"
        side_effects:
          - "if session-linked: session.available_seats += 1"

      - from: IN_PROGRESS
        to: EXPIRED
        trigger: "system (POST /enforcement/sweep when now > expires_at)"
        actor: system
        preconditions:
          - "enrollment_status IN {ENROLLED, IN_PROGRESS} and now > expires_at"
        side_effects:
          - "if session-linked: session.available_seats += 1"

  - entity: RegulatoryAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    transitions:
      - from: ASSIGNED
        to: OVERDUE
        trigger: "system (POST /enforcement/sweep when due_at < now <= lapse_after)"
        actor: system
        preconditions:
          - "assignment_status == ASSIGNED and due_at < now and now <= lapse_after"
        side_effects: []

      - from: ASSIGNED
        to: LAPSED
        trigger: "system (POST /enforcement/sweep when now > lapse_after)"
        actor: system
        preconditions:
          - "assignment_status IN {ASSIGNED, OVERDUE} and now > lapse_after"
        side_effects:
          - "Representative ACTIVE -> INACTIVE_CE (AuditEvent REGISTRATION_STATUS_CHANGED)"
          - "that registration flip then suspends the rep's ProductCertifications in CERTIFIED -> SUSPENDED with suspended_reason = REGISTRATION_INACTIVE (AuditEvent CERTIFICATION_STATUS_CHANGED)"
          - "AuditEvent ASSIGNMENT_LAPSED created"

      - from: OVERDUE
        to: LAPSED
        trigger: "system (POST /enforcement/sweep when now > lapse_after)"
        actor: system
        preconditions:
          - "assignment_status IN {ASSIGNED, OVERDUE} and now > lapse_after"
        side_effects:
          - "Representative ACTIVE -> INACTIVE_CE (AuditEvent REGISTRATION_STATUS_CHANGED)"
          - "that registration flip then suspends the rep's ProductCertifications in CERTIFIED -> SUSPENDED with suspended_reason = REGISTRATION_INACTIVE"
          - "AuditEvent ASSIGNMENT_LAPSED created"

      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (regulatory-element enrollment completion cascade)"
        actor: system
        preconditions:
          - "assignment selected by regulatory_completion_selector for the completing enrollment"
        side_effects:
          - "enrollment_id and completed_at set; AuditEvent ASSIGNMENT_COMPLETED"

      - from: OVERDUE
        to: COMPLETED
        trigger: "system (regulatory-element enrollment completion cascade — late completion within grace)"
        actor: system
        preconditions:
          - "assignment selected by regulatory_completion_selector"
        side_effects:
          - "enrollment_id and completed_at set; AuditEvent ASSIGNMENT_COMPLETED"

      - from: LAPSED
        to: COMPLETED
        trigger: "system (regulatory-element enrollment completion cascade — cure after lapse)"
        actor: system
        preconditions:
          - "assignment selected by regulatory_completion_selector"
        side_effects:
          - "enrollment_id and completed_at set; AuditEvent ASSIGNMENT_COMPLETED"
          - "if no other LAPSED assignment remains for the rep: Representative INACTIVE_CE -> ACTIVE (AuditEvent REGISTRATION_STATUS_CHANGED)"
          - "that registration restoration then reinstates ProductCertifications SUSPENDED with reason REGISTRATION_INACTIVE -> CERTIFIED, only where product_status == LAUNCHED and the required content is APPROVED"

  - entity: Representative
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: INACTIVE_CE
        trigger: "system (assignment-lapse cascade or void-driven lapse)"
        actor: system
        preconditions:
          - "a RegulatoryAssignment of this rep has just entered LAPSED"
        side_effects:
          - "ProductCertifications in CERTIFIED -> SUSPENDED with REGISTRATION_INACTIVE"

      - from: INACTIVE_CE
        to: ACTIVE
        trigger: "system (assignment-cure cascade)"
        actor: system
        preconditions:
          - "the rep's last open LAPSED assignment has just become COMPLETED"
        side_effects:
          - "ProductCertifications SUSPENDED with REGISTRATION_INACTIVE -> CERTIFIED where product LAUNCHED and content APPROVED"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /representatives/{repId}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "registration_status IN {ACTIVE, INACTIVE_CE} (ERR_REGISTRATION_TERMINATED)"
        side_effects:
          - "Enrollments in {ENROLLED, IN_PROGRESS, FAILED} -> CANCELLED (seats released)"
          - "ProductCertifications in {PENDING_TRAINING, CERTIFIED} -> SUSPENDED with REGISTRATION_TERMINATED"
          - "AnnualAttestations in PENDING -> VOIDED"
          - "AuditEvent REGISTRATION_STATUS_CHANGED"

      - from: INACTIVE_CE
        to: TERMINATED
        trigger: "POST /representatives/{repId}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "registration_status IN {ACTIVE, INACTIVE_CE} (ERR_REGISTRATION_TERMINATED)"
        side_effects:
          - "same cascade as ACTIVE -> TERMINATED"

  - entity: FirmElementPlan
    initial_state: NEEDS_ANALYSIS
    terminal_states: [SUPERSEDED]
    transitions:
      - from: NEEDS_ANALYSIS
        to: NEEDS_ANALYSIS
        trigger: "POST /firm-element-plans/{planId}/needs-analysis"
        actor: TrainingAdmin
        preconditions:
          - "plan_status == NEEDS_ANALYSIS (ERR_PLAN_NOT_NEEDS_ANALYSIS)"
        side_effects:
          - "needs_analysis_document_ref / needs_analysis_notes set; needs_analysis_completed_at := now"

      - from: NEEDS_ANALYSIS
        to: PLAN_PUBLISHED
        trigger: "POST /firm-element-plans/{planId}/publish"
        actor: TrainingAdmin
        preconditions:
          - "plan_status == NEEDS_ANALYSIS (ERR_PLAN_NOT_NEEDS_ANALYSIS)"
          - "needs_analysis_completed_at is set (ERR_NEEDS_ANALYSIS_MISSING)"
        side_effects:
          - "required_hours computed via firm_element_required_hours"
          - "published_at := now"
          - "an AnnualAttestation is created for this plan in PENDING (rep_id copied from plan)"
          - "AuditEvent PLAN_PUBLISHED"

      - from: PLAN_PUBLISHED
        to: CLOSED
        trigger: "POST /firm-element-plans/{planId}/close"
        actor: TrainingAdmin
        preconditions:
          - "plan_status == PLAN_PUBLISHED (ERR_PLAN_NOT_PUBLISHED)"
          - "certified_hours >= required_hours (ERR_PLAN_HOURS_UNMET)"
        side_effects:
          - "closed_at := now; AuditEvent PLAN_CLOSED"

      - from: CLOSED
        to: PLAN_PUBLISHED
        trigger: "system (void cascade: a COMPLETED enrollment crediting this plan is voided and certified_hours drops below required_hours)"
        actor: system
        preconditions:
          - "plan_status == CLOSED and recomputed certified_hours < required_hours"
        side_effects:
          - "closed_at cleared"
          - "the plan's AnnualAttestation in ATTESTED -> VOIDED (AuditEvent ATTESTATION_VOIDED)"
          - "AuditEvent PLAN_REOPENED"

      - from: NEEDS_ANALYSIS
        to: SUPERSEDED
        trigger: "system (POST /firm-element-plans for the same rep_id + plan_year supersedes the draft)"
        actor: system
        preconditions:
          - "a new plan is created for the same rep_id + plan_year while this plan is NEEDS_ANALYSIS"
        side_effects: []

  - entity: AnnualAttestation
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: ATTESTED
        trigger: "POST /attestations/{attestationId}/attest"
        actor: RegisteredRep
        preconditions:
          - "attestation_status == PENDING (ERR_ATTESTATION_NOT_PENDING)"
          - "X-User-ID == plan.rep_id (ERR_OWNERSHIP_REQUIRED)"
          - "FirmElementPlan.plan_status == CLOSED (ERR_PLAN_NOT_CLOSED)"
        side_effects:
          - "attestation_statement and attested_at recorded; AuditEvent ATTESTATION_ATTESTED"

      - from: ATTESTED
        to: VOIDED
        trigger: "system (plan-reopen cascade)"
        actor: system
        preconditions:
          - "parent plan has reopened CLOSED -> PLAN_PUBLISHED"
        side_effects:
          - "AuditEvent ATTESTATION_VOIDED"

      - from: PENDING
        to: VOIDED
        trigger: "system (representative termination cascade)"
        actor: system
        preconditions:
          - "rep registration_status -> TERMINATED"
        side_effects: []

  - entity: ProductOffering
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: LAUNCHED
        trigger: "POST /products/{productId}/launch"
        actor: ComplianceOfficer
        preconditions:
          - "product_status == PROPOSED (ERR_PRODUCT_NOT_PROPOSED)"
          - "required_training_content_id references content with content_status == APPROVED (ERR_PRODUCT_TRAINING_CONTENT_NOT_APPROVED)"
        side_effects:
          - "launched_at := now"
          - "fan-out: one ProductCertification (PENDING_TRAINING) created per Representative with registration_status == ACTIVE, processed in created_at ASC order with tie-break crd_number ASC"
          - "AuditEvent PRODUCT_LAUNCHED"

      - from: LAUNCHED
        to: WITHDRAWN
        trigger: "POST /products/{productId}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "product_status == LAUNCHED (ERR_PRODUCT_NOT_LAUNCHED)"
        side_effects:
          - "ProductCertifications in {PENDING_TRAINING, CERTIFIED} for this product -> SUSPENDED with PRODUCT_WITHDRAWN"

  - entity: ProductCertification
    initial_state: PENDING_TRAINING
    terminal_states: []
    transitions:
      - from: PENDING_TRAINING
        to: CERTIFIED
        trigger: "system (product-training enrollment completion cascade)"
        actor: system
        preconditions:
          - "completing enrollment's content == product.required_training_content_id and enrollment.rep_id == cert.rep_id"
        side_effects:
          - "enrollment_id and certified_at set; AuditEvent CERTIFICATION_STATUS_CHANGED"

      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system (registration lapse/termination, content retire, product withdraw, or training void cascades)"
        actor: system
        preconditions:
          - "one of the listed cascade triggers fired"
        side_effects:
          - "suspended_reason set to the triggering cause; AuditEvent CERTIFICATION_STATUS_CHANGED"

      - from: PENDING_TRAINING
        to: SUSPENDED
        trigger: "system (representative termination or product withdraw cascades)"
        actor: system
        preconditions:
          - "one of the listed cascade triggers fired"
        side_effects:
          - "suspended_reason set"

      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /product-certifications/{certId}/reinstate or registration-restoration cascade"
        actor: ComplianceOfficer
        preconditions:
          - "cert_status == SUSPENDED (ERR_CERTIFICATION_NOT_SUSPENDED)"
          - "Representative.registration_status == ACTIVE (ERR_REINSTATEMENT_BLOCKED)"
          - "ProductOffering.product_status == LAUNCHED (ERR_REINSTATEMENT_BLOCKED)"
          - "enrollment_id set, that Enrollment COMPLETED, and its TrainingContent APPROVED (ERR_REINSTATEMENT_BLOCKED)"
        side_effects:
          - "suspended_reason cleared; AuditEvent CERTIFICATION_STATUS_CHANGED"

  - entity: StateCELicense
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (POST /enforcement/sweep when now > period_end and earned_hours_effective < required_hours)"
        actor: system
        preconditions:
          - "license_status == ACTIVE and now > period_end and earned_hours_effective < required_hours"
        side_effects: []

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /state-ce-licenses/{licenseId}/renew"
        actor: TrainingAdmin
        preconditions:
          - "new_period_end > new_period_start (ERR_WINDOW_INVALID)"
        side_effects:
          - "carried_excess_hours := min(CARRYOVER_CAP_HOURS, max(0, earned_hours_strict - required_hours)) computed from the CURRENT window"
          - "period_start/period_end replaced by the new window; earned/reported hours recomputed against the new window"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /state-ce-licenses/{licenseId}/renew"
        actor: TrainingAdmin
        preconditions:
          - "new_period_end > new_period_start (ERR_WINDOW_INVALID)"
        side_effects:
          - "same as ACTIVE -> ACTIVE renewal (carryover computed, window replaced, status ACTIVE)"

# =============================================================================
# Table 1.2.1: Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-representative
    parent_entity: Representative
    write_endpoint: "POST /firm-element-plans"
    occ_field: "expected_representative_version"
    description: |
      Creating a FirmElementPlan against a Representative whose version has
      advanced since the client last observed it is rejected. Plan creation
      legitimately supersedes any NEEDS_ANALYSIS draft for the same
      rep_id + plan_year and bumps Representative.version, so a client holding
      a stale version must re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: content-update-stale-version
    parent_entity: TrainingContent
    write_endpoint: "PUT /contents/{contentId}"
    occ_field: "expected_content_version"
    description: |
      Editing a TrainingContent whose version has advanced since the client
      last observed it is rejected. An edit bumps TrainingContent.version (and
      returns REJECTED content to DRAFT), so a stale expected_content_version
      means the client's view of the content no longer matches the server.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: firm_element_required_hours
    trigger: "FirmElementPlan publish transition (NEEDS_ANALYSIS -> PLAN_PUBLISHED)"
    algorithm: threshold
    formula: |
      base = BASE_HOURS_BY_TIER[rep.role_tier]              # RR -> 12, PRINCIPAL -> 16
      product_count = count of ProductOfferings with product_status IN {LAUNCHED, WITHDRAWN}
                      and year(launched_at) == plan.plan_year
      surcharge = PER_PRODUCT_SURCHARGE * min(product_count, SURCHARGE_CAP)
      required_hours = max(MIN_REQUIRED_HOURS, base + surcharge - rep.prior_year_excess_hours)
      Evaluation order pinned: base -> capped surcharge -> excess subtraction -> floor.
      Result stored on plan.required_hours at publish and never recomputed afterwards.
    input_set: "The plan's Representative (role_tier, prior_year_excess_hours) and all ProductOfferings launched in plan_year"
    constants:
      MIN_REQUIRED_HOURS: 6
      BASE_HOURS_RR: 12
      BASE_HOURS_PRINCIPAL: 16
      PER_PRODUCT_SURCHARGE: 2
      SURCHARGE_CAP: 3
    precision: "integer-valued result; no rounding required"

  - name: plan_progress_hours
    trigger: "any Enrollment mutation (create/start/complete/cancel/void/expire) and any content retire cascade touching a FIRM_ELEMENT enrollment; plan publish recomputes once"
    algorithm: aggregation
    formula: |
      matching = Enrollments e where e.rep_id == plan.rep_id
                 and content(e).ce_category == FIRM_ELEMENT
                 and e.completed_at is not null and year(e.completed_at) == plan.plan_year
                 and e.enrollment_status == COMPLETED
      certified_hours = sum(content(e).credit_hours for e in matching)
      in_progress = Enrollments e where e.rep_id == plan.rep_id
                    and content(e).ce_category == FIRM_ELEMENT
                    and e.enrollment_status == IN_PROGRESS
      projected_hours = certified_hours + sum(content(e).credit_hours for e in in_progress)
      (IN_PROGRESS rows carry no completed_at, so the year filter applies to COMPLETED rows only.)
    input_set: "Enrollments of the plan's rep; COMPLETED rows filtered to year(completed_at) == plan_year; VOIDED/CANCELLED/EXPIRED/FAILED excluded"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: certified
        when: "close eligibility, attestation gating, reopen checks — only COMPLETED rows count"
        difference: "excludes IN_PROGRESS hours entirely"
      - name: projected
        when: "readiness projection surfaced on plan reads"
        difference: "adds IN_PROGRESS hours on top of certified; strictly >= certified"

  - name: state_ce_earned_hours
    trigger: "any STATE_INSURANCE Enrollment completion or void for the license's rep; license renew recomputes once"
    algorithm: chronological
    formula: |
      window_set = Enrollments e where e.rep_id == license.rep_id
                   and content(e).ce_category == STATE_INSURANCE
                   and e.enrollment_status == COMPLETED
                   and period_start <= e.completed_at < period_end   # half-open window
      earned_hours_strict = sum(content(e).credit_hours for e in window_set)
      earned_hours_effective = earned_hours_strict + min(CARRYOVER_CAP_HOURS, carried_excess_hours)
    input_set: "COMPLETED non-voided STATE_INSURANCE enrollments of the rep with completed_at inside the current [period_start, period_end) window"
    constants:
      CARRYOVER_CAP_HOURS: 6
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict_period
        when: "raw earned_hours_strict display and renew-time excess computation"
        difference: "current-window completions only; ignores carried_excess_hours"
      - name: with_carryover
        when: "compliance evaluation (sweep lapse check uses earned_hours_effective >= required_hours)"
        difference: "adds min(6, carried_excess_hours); can satisfy the requirement when strict alone cannot"

  - name: state_ce_reported_hours
    trigger: "same trigger set as state_ce_earned_hours"
    algorithm: aggregation
    formula: |
      reported_hours = sum over window_set (same set as state_ce_earned_hours) of
                       round_half_up_to_half(content(e).credit_hours)
      where round_half_up_to_half(x) = round_half_up(x * 2) / 2
      PINNED ORDER: each course is rounded to the nearest 0.5 hour FIRST, then the
      per-course values are summed. Summing raw hours first and rounding the total
      is a different, non-conforming computation (e.g., courses of 1.25 + 1.25:
      per-course-first yields 1.5 + 1.5 = 3.0; sum-first would yield 2.5).
    input_set: "identical to state_ce_earned_hours window_set"
    constants:
      ROUNDING_UNIT: 0.5
    precision: "per-course round_half_up to 0.5 hour, then exact decimal sum"

  - name: session_seat_accounting
    trigger: "session create; enrollment create/cancel/void/expire for a session-linked enrollment; session-cancel cascade"
    algorithm: aggregation
    formula: |
      active_seat_holders = count of Enrollments e where e.session_id == session.id
                            and e.enrollment_status IN {ENROLLED, IN_PROGRESS, COMPLETED}
      available_seats = capacity - active_seat_holders
      INVARIANT (conserved quantity): available_seats == capacity - active_seat_holders
      holds after every mutation; an enroll + cancel pair on the same session MUST
      return available_seats to its pre-enroll value.
    input_set: "Enrollments linked to the session; CANCELLED/EXPIRED/VOIDED/FAILED do not hold seats"
    precision: "integer"

  - name: assignment_clock
    trigger: "RegulatoryAssignment creation; sweep classification; completion on-time evaluation"
    algorithm: threshold
    formula: |
      due_at      = created_at + ASSIGNMENT_WINDOW_DAYS (120 days)
      lapse_after = due_at + GRACE_DAYS (30 days)
      on_time completion: completed_at <= due_at (INCLUSIVE — completing exactly at due_at is on time)
      sweep: due_at < now <= lapse_after -> OVERDUE; now > lapse_after -> LAPSED
    constants:
      ASSIGNMENT_WINDOW_DAYS: 120
      GRACE_DAYS: 30
    precision: "timestamp comparison at second precision; on-time boundary is inclusive"

  - name: regulatory_completion_selector
    trigger: "an Enrollment in REGULATORY_ELEMENT content reaches COMPLETED"
    algorithm: aggregation
    formula: |
      candidates = RegulatoryAssignments a where a.rep_id == enrollment.rep_id
                   and a.assignment_status IN {ASSIGNED, OVERDUE, LAPSED}
      order: due_at ASC, tie-break created_at ASC
      selected = first candidate; empty candidate set -> no-op (completion still succeeds)
      (POST /regulatory-assignments rejects creation while any open assignment exists,
      so in practice |candidates| <= 1.)
    input_set: "open (non-COMPLETED) RegulatoryAssignments of the completing rep"

  - name: enrollment_expiry_window
    trigger: "enrollment creation; reattempt; enforcement sweep"
    algorithm: threshold
    formula: |
      expires_at = created_at + ENROLLMENT_VALIDITY_DAYS (90 days)   # recomputed from now on reattempt
      start/complete blocked when now > expires_at (ERR_ENROLLMENT_EXPIRED); exactly at expires_at still allowed
      sweep expires ENROLLED/IN_PROGRESS enrollments when now > expires_at (strictly greater)
    constants:
      ENROLLMENT_VALIDITY_DAYS: 90
    precision: "timestamp comparison at second precision; expiry boundary is exclusive (now must be strictly later)"

  - name: product_certification_fanout
    trigger: "ProductOffering launch transition (PROPOSED -> LAUNCHED)"
    algorithm: aggregation
    formula: |
      eligible = Representatives r where r.registration_status == ACTIVE
      processing order: created_at ASC, tie-break crd_number ASC
      for each eligible rep: create ProductCertification(rep_id, product_id, PENDING_TRAINING)
      TERMINATED and INACTIVE_CE reps receive no certification.
    input_set: "all Representatives filtered by registration_status == ACTIVE at launch time"
    precision: "n/a"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced resource ids must exist: path-template ids validated left-to-right, then body foreign-key fields (rep_id, content_id, session_id, required_training_content_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body FK references"

  - priority: 3.1
    category: existence
    check: "Request body well-formed: required fields present, enums valid, score within 0..100, exactly one of content_id/session_id on enrollment create, justification >= 10 chars on void (ERR_INVALID_REQUEST); window sanity end strictly after start on sessions/blackouts/license windows (ERR_WINDOW_INVALID)"
    error_id: "ERR_INVALID_REQUEST | ERR_WINDOW_INVALID"
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 3.5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /contents/{contentId}; POST /firm-element-plans"
    note: "evaluated before all business checks, after existence/shape"

  - priority: 4
    category: state
    check: "Target entity state permits the transition (content DRAFT/PENDING/APPROVED guards; enrollment status guards; plan status guards; attestation PENDING; product PROPOSED/LAUNCHED; cert SUSPENDED; session SCHEDULED)"
    error_id: "ERR_CONTENT_NOT_PENDING_APPROVAL | ERR_CONTENT_NOT_EDITABLE | ERR_CONTENT_NOT_RETIRABLE | ERR_CONTENT_NOT_APPROVED | ERR_ENROLLMENT_INVALID_STATE | ERR_PLAN_NOT_NEEDS_ANALYSIS | ERR_PLAN_NOT_PUBLISHED | ERR_PLAN_NOT_CLOSED | ERR_ATTESTATION_NOT_PENDING | ERR_PRODUCT_NOT_PROPOSED | ERR_PRODUCT_NOT_LAUNCHED | ERR_CERTIFICATION_NOT_SUSPENDED | ERR_SESSION_NOT_SCHEDULED"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 4.1
    category: state
    check: "Cross-entity registration guard: rep must be ACTIVE (not INACTIVE_CE / TERMINATED) for enrollment create/start/complete/reattempt and assignment/plan creation"
    error_id: "ERR_REGISTRATION_INACTIVE | ERR_REGISTRATION_TERMINATED"
    http_status: 409
    applies_to: "POST /enrollments; POST /enrollments/{id}/start|complete|reattempt; POST /regulatory-assignments; POST /firm-element-plans"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: approver X-User-ID != content.author_user_id"
    error_id: ERR_SOD_AUTHOR_CANNOT_APPROVE
    http_status: 403
    applies_to: "POST /contents/{contentId}/approve"

  - priority: 5.1
    category: business_safety
    check: "Ownership: RegisteredRep may act only on own enrollments (rep_id match) and own attestations (plan.rep_id match)"
    error_id: ERR_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /enrollments/{id}/start|complete|reattempt; POST /attestations/{id}/attest"

  - priority: 5.2
    category: business_safety
    check: "Publish requires completed needs analysis"
    error_id: ERR_NEEDS_ANALYSIS_MISSING
    http_status: 409
    applies_to: "POST /firm-element-plans/{planId}/publish"

  - priority: 6
    category: business_constraint
    check: "Uniqueness: crd_number; content code; product_code; (rep_id, state_code) license; at most one open (non-COMPLETED) assignment per rep; no second plan for rep+year while one is PLAN_PUBLISHED/CLOSED; no duplicate active enrollment for (rep_id, content_id) with status IN {ENROLLED, IN_PROGRESS}"
    error_id: "ERR_DUPLICATE_CRD_NUMBER | ERR_DUPLICATE_CONTENT_CODE | ERR_DUPLICATE_PRODUCT_CODE | ERR_DUPLICATE_LICENSE_STATE | ERR_OPEN_ASSIGNMENT_EXISTS | ERR_DUPLICATE_PLAN_YEAR | ERR_DUPLICATE_ENROLLMENT"
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 6.1
    category: business_referential
    check: "State CE license creation requires rep.insurance_licensed == true; session's content must exist; enrollment session must belong to the referenced/derived content"
    error_id: "ERR_REP_NOT_INSURANCE_LICENSED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /state-ce-licenses; POST /sessions; POST /enrollments"

  - priority: 7
    category: business_temporal
    check: "Interval conflicts and expiry: room half-open overlap; blackout closed-interval conflict; enrollment start/complete after expires_at. (Window sanity end > start is a shape check covered by ERR_WINDOW_INVALID at priority 3.1.)"
    error_id: "ERR_ROOM_CONFLICT | ERR_BLACKOUT_CONFLICT | ERR_ENROLLMENT_EXPIRED"
    http_status: 409
    applies_to: "POST /sessions; POST /enrollments/{id}/start|complete"

  - priority: 8
    category: business_fiscal
    check: "Capacity: session seat available (active seat holders < capacity); plan close requires certified_hours >= required_hours"
    error_id: "ERR_SESSION_FULL | ERR_PLAN_HOURS_UNMET"
    http_status: 409
    applies_to: "POST /enrollments (session-linked); POST /firm-element-plans/{planId}/close"

  - priority: 8.1
    category: business_constraint
    check: "Retake budget: reattempt allowed only while attempt_count < MAX_ATTEMPTS (3)"
    error_id: ERR_MAX_ATTEMPTS_REACHED
    http_status: 409
    applies_to: "POST /enrollments/{enrollmentId}/reattempt"

  - priority: 8.2
    category: business_safety
    check: "Reinstatement requires rep ACTIVE, product LAUNCHED, fulfilling enrollment COMPLETED with APPROVED content"
    error_id: ERR_REINSTATEMENT_BLOCKED
    http_status: 409
    applies_to: "POST /product-certifications/{certId}/reinstate"

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.5: API Endpoint Table (flat topology; all resources top-level)
# =============================================================================
endpoints:
  # --- Representatives ---
  - { method: POST, path: "/representatives", description: "Register a representative", roles: [TrainingAdmin], code: 201, input: [crd_number, full_name, email, role_tier, insurance_licensed, resident_state_code, "prior_year_excess_hours?"], output: Representative, side_effects: ["registration_status := ACTIVE"] }
  - { method: GET, path: "/representatives", description: "List representatives", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["registration_status?", "limit?", "offset?"], output: "Representative[]", side_effects: [] }
  - { method: GET, path: "/representatives/{repId}", description: "Get one representative", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: Representative, side_effects: [] }
  - { method: POST, path: "/representatives/{repId}/terminate", description: "Terminate registration (cascades: enrollments cancelled, certs suspended, pending attestations voided)", roles: [ComplianceOfficer], code: 200, input: [], output: Representative, side_effects: ["registration_status -> TERMINATED + cascades per state machine"] }

  # --- Training content ---
  - { method: POST, path: "/contents", description: "Author training content (DRAFT)", roles: [TrainingAdmin], code: 201, input: [code, title, ce_category, delivery_format, credit_hours, min_passing_score], output: TrainingContent, side_effects: ["author_user_id := X-User-ID; content_status := DRAFT"] }
  - { method: GET, path: "/contents", description: "List content", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["ce_category?", "content_status?", "limit?", "offset?"], output: "TrainingContent[]", side_effects: [] }
  - { method: GET, path: "/contents/{contentId}", description: "Get one content", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: TrainingContent, side_effects: [] }
  - { method: PUT, path: "/contents/{contentId}", description: "Edit content in DRAFT/REJECTED (OCC; REJECTED returns to DRAFT)", roles: [TrainingAdmin], code: 200, input: [expected_content_version, "title?", "credit_hours?", "min_passing_score?"], output: TrainingContent, side_effects: ["increments TrainingContent.version by 1"] }
  - { method: POST, path: "/contents/{contentId}/submit", description: "Submit content for approval", roles: [TrainingAdmin], code: 200, input: [], output: TrainingContent, side_effects: ["content_status -> PENDING_APPROVAL"] }
  - { method: POST, path: "/contents/{contentId}/approve", description: "Approve content (SoD: approver != author)", roles: [ComplianceOfficer], code: 200, input: [], output: TrainingContent, side_effects: ["content_status -> APPROVED; approved_by_user_id set; AuditEvent"] }
  - { method: POST, path: "/contents/{contentId}/reject", description: "Reject content with reason", roles: [ComplianceOfficer], code: 200, input: [reason], output: TrainingContent, side_effects: ["content_status -> REJECTED; rejection_reason set; AuditEvent"] }
  - { method: POST, path: "/contents/{contentId}/retire", description: "Retire approved content (cancels non-terminal enrollments/sessions; suspends dependent certifications)", roles: [ComplianceOfficer], code: 200, input: [], output: TrainingContent, side_effects: ["content_status -> RETIRED + cascades per state machine"] }

  # --- Course sessions (instructor-led delivery) ---
  - { method: POST, path: "/sessions", description: "Schedule an instructor-led session; requires content APPROVED (ERR_CONTENT_NOT_APPROVED); room overlap (half-open) and blackout (closed) conflict checks", roles: [TrainingAdmin], code: 201, input: [content_id, room_name, start_at, end_at, capacity], output: CourseSession, side_effects: ["session_status := SCHEDULED; available_seats := capacity"] }
  - { method: GET, path: "/sessions", description: "List sessions", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["content_id?", "session_status?", "limit?", "offset?"], output: "CourseSession[]", side_effects: [] }
  - { method: GET, path: "/sessions/{sessionId}", description: "Get one session", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: CourseSession, side_effects: [] }
  - { method: POST, path: "/sessions/{sessionId}/cancel", description: "Cancel a scheduled session (cancels linked non-terminal enrollments)", roles: [TrainingAdmin], code: 200, input: [], output: CourseSession, side_effects: ["session_status -> CANCELLED; linked enrollments -> CANCELLED"] }

  # --- Enrollments (delivery tracking) ---
  - { method: POST, path: "/enrollments", description: "Enroll a rep; exactly one of content_id (ELEARNING) / session_id (INSTRUCTOR_LED)", roles: [TrainingAdmin], code: 201, input: [rep_id, "content_id?", "session_id?"], output: Enrollment, side_effects: ["enrollment_status := ENROLLED; expires_at := now + 90d; session seat consumed when session-linked"] }
  - { method: GET, path: "/enrollments", description: "List enrollments (reverse-reachability for rep/content/session FKs)", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["rep_id?", "content_id?", "session_id?", "enrollment_status?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{enrollmentId}", description: "Get one enrollment", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/enrollments/{enrollmentId}/start", description: "Rep starts own enrollment", roles: [RegisteredRep], code: 200, input: [], output: Enrollment, side_effects: ["enrollment_status -> IN_PROGRESS"] }
  - { method: POST, path: "/enrollments/{enrollmentId}/complete", description: "Rep completes own enrollment with a score (pass -> COMPLETED + credit cascades; fail -> FAILED)", roles: [RegisteredRep], code: 200, input: [score], output: Enrollment, side_effects: ["attempt_count += 1; pass/fail transition + category cascades per state machine"] }
  - { method: POST, path: "/enrollments/{enrollmentId}/cancel", description: "Cancel a non-terminal enrollment", roles: [TrainingAdmin], code: 200, input: [], output: Enrollment, side_effects: ["enrollment_status -> CANCELLED; seat released when session-linked"] }
  - { method: POST, path: "/enrollments/{enrollmentId}/reattempt", description: "Retake a FAILED enrollment (max 3 attempts; fresh 90-day window)", roles: [RegisteredRep], code: 200, input: [], output: Enrollment, side_effects: ["enrollment_status -> ENROLLED; expires_at recomputed"] }
  - { method: POST, path: "/enrollments/{enrollmentId}/void", description: "Void a COMPLETED enrollment as audit correction (reverses hours/certs/assignment per void cascade)", roles: [ComplianceOfficer], code: 200, input: [justification], output: Enrollment, side_effects: ["enrollment_status -> VOIDED + reversal cascades per state machine; AuditEvent"] }

  # --- Regulatory element assignments ---
  - { method: POST, path: "/regulatory-assignments", description: "Assign regulatory element cycle to a rep (one open assignment per rep)", roles: [TrainingAdmin], code: 201, input: [rep_id, cycle_year], output: RegulatoryAssignment, side_effects: ["assignment_status := ASSIGNED; due_at := now + 120d; lapse_after := due_at + 30d"] }
  - { method: GET, path: "/regulatory-assignments", description: "List assignments", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["rep_id?", "assignment_status?", "enrollment_id?", "limit?", "offset?"], output: "RegulatoryAssignment[]", side_effects: [] }
  - { method: GET, path: "/regulatory-assignments/{assignmentId}", description: "Get one assignment", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: RegulatoryAssignment, side_effects: [] }

  # --- Firm element plans ---
  - { method: POST, path: "/firm-element-plans", description: "Create annual firm element plan (OCC on Representative.version; supersedes NEEDS_ANALYSIS draft for same rep+year)", roles: [TrainingAdmin], code: 201, input: [rep_id, plan_year, expected_representative_version], output: FirmElementPlan, side_effects: ["plan_status := NEEDS_ANALYSIS; existing NEEDS_ANALYSIS plan for same rep+year -> SUPERSEDED; increments Representative.version by 1"] }
  - { method: GET, path: "/firm-element-plans", description: "List plans", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["rep_id?", "plan_year?", "plan_status?", "limit?", "offset?"], output: "FirmElementPlan[]", side_effects: [] }
  - { method: GET, path: "/firm-element-plans/{planId}", description: "Get one plan", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: FirmElementPlan, side_effects: [] }
  - { method: POST, path: "/firm-element-plans/{planId}/needs-analysis", description: "Record the annual needs analysis for a draft plan", roles: [TrainingAdmin], code: 200, input: [analysis_document_ref, analysis_notes], output: FirmElementPlan, side_effects: ["needs_analysis_completed_at := now"] }
  - { method: POST, path: "/firm-element-plans/{planId}/publish", description: "Publish plan (computes required_hours; spawns PENDING attestation)", roles: [TrainingAdmin], code: 200, input: [], output: FirmElementPlan, side_effects: ["plan_status -> PLAN_PUBLISHED; required_hours computed; AnnualAttestation PENDING created"] }
  - { method: POST, path: "/firm-element-plans/{planId}/close", description: "Close a published plan once certified_hours >= required_hours", roles: [TrainingAdmin], code: 200, input: [], output: FirmElementPlan, side_effects: ["plan_status -> CLOSED; closed_at set"] }

  # --- Annual attestations ---
  - { method: GET, path: "/attestations", description: "List attestations", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["rep_id?", "plan_id?", "attestation_status?", "limit?", "offset?"], output: "AnnualAttestation[]", side_effects: [] }
  - { method: GET, path: "/attestations/{attestationId}", description: "Get one attestation", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: AnnualAttestation, side_effects: [] }
  - { method: POST, path: "/attestations/{attestationId}/attest", description: "Rep attests own annual attestation (plan must be CLOSED)", roles: [RegisteredRep], code: 200, input: [attestation_statement], output: AnnualAttestation, side_effects: ["attestation_status -> ATTESTED; attested_at set; AuditEvent"] }

  # --- Product offerings & certifications ---
  - { method: POST, path: "/products", description: "Register a product offering (PROPOSED)", roles: [ComplianceOfficer], code: 201, input: [product_code, name, required_training_content_id], output: ProductOffering, side_effects: ["product_status := PROPOSED"] }
  - { method: GET, path: "/products", description: "List products", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["product_status?", "required_training_content_id?", "limit?", "offset?"], output: "ProductOffering[]", side_effects: [] }
  - { method: GET, path: "/products/{productId}", description: "Get one product", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: ProductOffering, side_effects: [] }
  - { method: POST, path: "/products/{productId}/launch", description: "Launch product (requires APPROVED training content; fans out PENDING_TRAINING certifications to ACTIVE reps)", roles: [ComplianceOfficer], code: 200, input: [], output: ProductOffering, side_effects: ["product_status -> LAUNCHED; certification fan-out per product_certification_fanout; AuditEvent"] }
  - { method: POST, path: "/products/{productId}/withdraw", description: "Withdraw a launched product (suspends its certifications)", roles: [ComplianceOfficer], code: 200, input: [], output: ProductOffering, side_effects: ["product_status -> WITHDRAWN; certs -> SUSPENDED (PRODUCT_WITHDRAWN)"] }
  - { method: GET, path: "/product-certifications", description: "List certifications", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["rep_id?", "product_id?", "enrollment_id?", "cert_status?", "limit?", "offset?"], output: "ProductCertification[]", side_effects: [] }
  - { method: GET, path: "/product-certifications/{certId}", description: "Get one certification", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: ProductCertification, side_effects: [] }
  - { method: POST, path: "/product-certifications/{certId}/reinstate", description: "Reinstate a suspended certification", roles: [ComplianceOfficer], code: 200, input: [], output: ProductCertification, side_effects: ["cert_status -> CERTIFIED; suspended_reason cleared; AuditEvent"] }

  # --- State CE licenses (insurance-licensed reps) ---
  - { method: POST, path: "/state-ce-licenses", description: "Register a state insurance CE license for a rep", roles: [TrainingAdmin], code: 201, input: [rep_id, state_code, required_hours, period_start, period_end], output: StateCELicense, side_effects: ["license_status := ACTIVE; carried_excess_hours := 0"] }
  - { method: GET, path: "/state-ce-licenses", description: "List licenses", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["rep_id?", "state_code?", "license_status?", "limit?", "offset?"], output: "StateCELicense[]", side_effects: [] }
  - { method: GET, path: "/state-ce-licenses/{licenseId}", description: "Get one license", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: StateCELicense, side_effects: [] }
  - { method: POST, path: "/state-ce-licenses/{licenseId}/renew", description: "Roll the license to a new renewal period (computes carryover from current window)", roles: [TrainingAdmin], code: 200, input: [new_period_start, new_period_end], output: StateCELicense, side_effects: ["carried_excess_hours computed; window replaced; license_status := ACTIVE; hours recomputed"] }

  # --- Blackout windows (firm training calendar) ---
  - { method: POST, path: "/blackout-windows", description: "Declare a training blackout window (closed interval)", roles: [ComplianceOfficer], code: 201, input: [label, start_at, end_at], output: TrainingBlackoutWindow, side_effects: [] }
  - { method: GET, path: "/blackout-windows", description: "List blackout windows", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: ["limit?", "offset?"], output: "TrainingBlackoutWindow[]", side_effects: [] }
  - { method: GET, path: "/blackout-windows/{windowId}", description: "Get one blackout window", roles: [TrainingAdmin, ComplianceOfficer, RegisteredRep, Auditor], code: 200, input: [], output: TrainingBlackoutWindow, side_effects: [] }

  # --- Enforcement sweep (ops-run checkpoint) ---
  - { method: POST, path: "/enforcement/sweep", description: "Run the deadline-enforcement epoch against the current logical clock: sessions DELIVERED (end_at <= now); enrollments EXPIRED (now > expires_at); assignments OVERDUE/LAPSED (+ registration + certification cascades); licenses LAPSED (now > period_end and earned_hours_effective < required_hours). Evaluation order pinned: sessions, enrollments, assignments, licenses.", roles: [ComplianceOfficer], code: 200, input: [], output: { sessions_marked_delivered: integer, enrollments_expired: integer, assignments_marked_overdue: integer, assignments_lapsed: integer, licenses_lapsed: integer }, side_effects: ["epoch transitions per state machines; AuditEvent ENFORCEMENT_SWEEP_RUN"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default before any set call is exactly 2026-08-01T00:00:00Z (never wall-clock). All created_at/due_at/expiry computations read this clock.", roles: [ComplianceOfficer], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced/set; no entity mutations (deadline effects happen only via /enforcement/sweep)"] }

  # --- Audit evidence ---
  - { method: GET, path: "/audit-events", description: "Query the append-only audit evidence log", roles: [Auditor, ComplianceOfficer], code: 200, input: ["entity_type?", "entity_id?", "event_type?", "limit?", "offset?"], output: "AuditEvent[]", side_effects: [] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_REQUIRED, http: 403, condition: "RegisteredRep acting on another rep's enrollment or attestation" }

  # --- Existence / shape ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, score outside 0..100, neither/both of content_id+session_id on enrollment create, session referenced for ELEARNING content (or vice versa missing session for INSTRUCTOR_LED), session/content mismatch, justification shorter than 10 chars" }
  - { id: ERR_WINDOW_INVALID, http: 400, condition: "end_at/period_end not strictly greater than start_at/period_start on session, blackout window, or license window" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

  # --- Content state ---
  - { id: ERR_CONTENT_NOT_PENDING_APPROVAL, http: 409, condition: "approve/reject requires content_status == PENDING_APPROVAL" }
  - { id: ERR_CONTENT_NOT_EDITABLE, http: 409, condition: "PUT or submit requires content_status IN {DRAFT, REJECTED}" }
  - { id: ERR_CONTENT_NOT_RETIRABLE, http: 409, condition: "retire requires content_status == APPROVED" }
  - { id: ERR_CONTENT_NOT_APPROVED, http: 409, condition: "enroll/start/complete/reattempt requires TrainingContent.content_status == APPROVED" }

  # --- Enrollment / session state ---
  - { id: ERR_ENROLLMENT_INVALID_STATE, http: 409, condition: "start requires ENROLLED; complete requires IN_PROGRESS; cancel requires ENROLLED/IN_PROGRESS; reattempt requires FAILED; void requires COMPLETED" }
  - { id: ERR_ENROLLMENT_EXPIRED, http: 409, condition: "start/complete attempted when now > expires_at" }
  - { id: ERR_MAX_ATTEMPTS_REACHED, http: 409, condition: "reattempt when attempt_count >= 3" }
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "enroll/start against a session not in SCHEDULED, or cancel of a non-SCHEDULED session" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "session-linked enrollment when active seat holders >= capacity" }

  # --- Registration ---
  - { id: ERR_REGISTRATION_INACTIVE, http: 409, condition: "operation requires registration_status == ACTIVE but rep is INACTIVE_CE" }
  - { id: ERR_REGISTRATION_TERMINATED, http: 409, condition: "operation on a TERMINATED rep, or terminate of an already-TERMINATED rep" }

  # --- Plan / attestation state ---
  - { id: ERR_PLAN_NOT_NEEDS_ANALYSIS, http: 409, condition: "needs-analysis/publish requires plan_status == NEEDS_ANALYSIS" }
  - { id: ERR_NEEDS_ANALYSIS_MISSING, http: 409, condition: "publish before needs analysis recorded" }
  - { id: ERR_PLAN_NOT_PUBLISHED, http: 409, condition: "close requires plan_status == PLAN_PUBLISHED" }
  - { id: ERR_PLAN_HOURS_UNMET, http: 409, condition: "close with certified_hours < required_hours" }
  - { id: ERR_PLAN_NOT_CLOSED, http: 409, condition: "attest while plan not CLOSED" }
  - { id: ERR_ATTESTATION_NOT_PENDING, http: 409, condition: "attest requires attestation_status == PENDING" }

  # --- Uniqueness / referential ---
  - { id: ERR_DUPLICATE_CRD_NUMBER, http: 409, condition: "crd_number already registered" }
  - { id: ERR_DUPLICATE_CONTENT_CODE, http: 409, condition: "content code already exists" }
  - { id: ERR_DUPLICATE_PRODUCT_CODE, http: 409, condition: "product_code already exists" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "rep already holds an active (ENROLLED/IN_PROGRESS) enrollment for the same content" }
  - { id: ERR_DUPLICATE_PLAN_YEAR, http: 409, condition: "a PLAN_PUBLISHED or CLOSED plan already exists for rep_id + plan_year" }
  - { id: ERR_DUPLICATE_LICENSE_STATE, http: 409, condition: "rep already holds a license for state_code" }
  - { id: ERR_OPEN_ASSIGNMENT_EXISTS, http: 409, condition: "rep already has an assignment in ASSIGNED/OVERDUE/LAPSED" }
  - { id: ERR_REP_NOT_INSURANCE_LICENSED, http: 409, condition: "state CE license creation for a rep with insurance_licensed == false" }

  # --- Temporal conflicts ---
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "session room overlap: same room_name, non-CANCELLED session, s1.start < s2.end and s2.start < s1.end (half-open; back-to-back allowed)" }
  - { id: ERR_BLACKOUT_CONFLICT, http: 409, condition: "session intersects a blackout window under closed-interval semantics: session.start_at <= blackout.end_at and blackout.start_at <= session.end_at (touching endpoints conflict)" }

  # --- Product / certification ---
  - { id: ERR_PRODUCT_NOT_PROPOSED, http: 409, condition: "launch requires product_status == PROPOSED" }
  - { id: ERR_PRODUCT_NOT_LAUNCHED, http: 409, condition: "withdraw requires product_status == LAUNCHED" }
  - { id: ERR_PRODUCT_TRAINING_CONTENT_NOT_APPROVED, http: 409, condition: "launch while required_training_content_id content is not APPROVED" }
  - { id: ERR_CERTIFICATION_NOT_SUSPENDED, http: 409, condition: "reinstate requires cert_status == SUSPENDED" }
  - { id: ERR_REINSTATEMENT_BLOCKED, http: 409, condition: "reinstate while rep not ACTIVE, product not LAUNCHED, or fulfilling enrollment/content no longer valid" }

  # --- Segregation of duties ---
  - { id: ERR_SOD_AUTHOR_CANNOT_APPROVE, http: 403, condition: "content approver X-User-ID equals author_user_id" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: TrainingAdmin
    description: "Broker-dealer training department staff; runs day-to-day CE administration (content authoring, sessions, enrollments, plans, assignments, licenses)"
    identity: "opaque"
    exclusive_operations:
      - "POST /representatives"
      - "POST /contents; PUT /contents/{id}; POST /contents/{id}/submit"
      - "POST /sessions; POST /sessions/{id}/cancel"
      - "POST /enrollments; POST /enrollments/{id}/cancel"
      - "POST /regulatory-assignments"
      - "POST /firm-element-plans; POST /firm-element-plans/{id}/needs-analysis|publish|close"
      - "POST /state-ce-licenses; POST /state-ce-licenses/{id}/renew"
    shared_operations:
      - "all GET list/detail endpoints"

  - name: ComplianceOfficer
    description: "Compliance reviewer; approves/retires content, launches products, runs enforcement, voids completions, manages blackouts and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /contents/{id}/approve|reject|retire"
      - "POST /products; POST /products/{id}/launch|withdraw"
      - "POST /product-certifications/{id}/reinstate"
      - "POST /enrollments/{id}/void"
      - "POST /representatives/{id}/terminate"
      - "POST /blackout-windows"
      - "POST /enforcement/sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET list/detail endpoints"
      - "GET /audit-events"

  - name: RegisteredRep
    description: "Registered representative; starts/completes/retakes own enrollments and attests own annual attestation (X-User-ID must equal the Representative id)"
    identity: "entity_backed:Representative"
    exclusive_operations:
      - "POST /enrollments/{id}/start|complete|reattempt (own enrollments only)"
      - "POST /attestations/{id}/attest (own attestation only)"
    shared_operations:
      - "all GET list/detail endpoints"

  - name: Auditor
    description: "Read-only audit role with access to the evidence log"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "all GET list/detail endpoints"
      - "GET /audit-events"
