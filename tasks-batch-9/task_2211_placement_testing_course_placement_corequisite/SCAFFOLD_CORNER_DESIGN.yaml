      - name: a_study_may_run_at_the_instant_its_window_closes_but_not_before
        claim_type: Triggerable
        grounds: ["errors[ERR_STUDY_WINDOW_OPEN]", "validations[priority=22]", "errors[ERR_STUDY_COHORT_EMPTY]"]
        distinguishing_aspect: |
          The observation window must be CLOSED, and closure is inclusive:
          window_end_at <= clock. One second early still refuses; the exact instant is
          accepted, and the proof that it was accepted is that the request then dies one
          check LATER with ERR_STUDY_COHORT_EMPTY. A refused run leaves run_count at 0
          and the state at DRAFT.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Course MATH-105 and one DRAFT candidate rule TEST_SCORE -> MATH-105 (min_score 600)."
            - "One study over the window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z); no Registration in the system has ever been graded."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "M105", title: "Quantitative Reasoning", subject_area: "MATH", level_rank: 105, units: 3.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_105: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TEST_SCORE", target_course_id: "${c_105}", priority_rank: 20, min_score: 600, effective_from: "2026-07-01T00:00:00Z", version_label: "CAND" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { cand: $.data.id, cand_status: $.data.status }
            - call: "POST /validation-studies"
              payload: { subject_area: "MATH", candidate_rule_id: "${cand}", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { study: $.data.id, study_state: $.data.state, study_runs: $.data.run_count }
          trigger:
            - call: "POST /validation-studies/${study}/run"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_open_far: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /validation-studies/${study}/run"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_open_edge: $.data.error_id }
            - call: "GET /validation-studies/${study}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { mid_state: $.data.state, mid_runs: $.data.run_count, mid_strict: $.data.strict_cohort_size }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /validation-studies/${study}/run"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e_cohort: $.data.error_id }
            - call: "GET /validation-studies/${study}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { end_state: $.data.state, end_runs: $.data.run_count }
          assert:
            - "${cand_status} == \"DRAFT\", ${study_state} == \"DRAFT\" and ${study_runs} == 0 (setup)"
            - "${e_open_far} == \"ERR_STUDY_WINDOW_OPEN\" with HTTP 422 at priority 22 — a month before the window closes"
            - "${e_open_edge} == \"ERR_STUDY_WINDOW_OPEN\" — one second before window_end_at is STILL open, so the test is not \"same day\" or \"strictly before the next day\""
            - "${mid_state} == \"DRAFT\", ${mid_runs} == 0 and ${mid_strict} == null — a refused run is atomic: it does not pass through RUNNING and does not increment the counter"
            - "${e_cohort} == \"ERR_STUDY_COHORT_EMPTY\" with HTTP 422 at priority 27 — at clock == window_end_at exactly the window check PASSES (window_end_at <= clock) and the request dies at the LATER viability check, which is the only observable proof that the boundary instant is accepted"
            - "${end_state} == \"DRAFT\" and ${end_runs} == 0 — the cohort refusal is atomic too"

      - name: approval_is_blocked_by_disproportionate_impact_even_when_the_success_rate_passes
        claim_type: Triggerable
        grounds: ["errors[ERR_DISPROPORTIONATE_IMPACT]", calculations.disproportionate_impact_index, "validations[priority=27]"]
        distinguishing_aspect: |
          The approval gate reads TWO metrics from the strict cohort, and they can
          disagree: an overall success rate of 0.85 sails past VALIDATION_MIN_SUCCESS_RATE
          while the per-group index 0.7000 fails DI_MIN_INDEX. The index needs at least
          MIN_SUBGROUP_N == 10 rows in a group to make that group eligible, and the
          reference group is the highest-rate eligible group, so the index is the WORST
          eligible group's rate divided by the best one's.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Course MATH-105 (units 3.0, no requisites) with an ACTIVE rule TEST_SCORE -> MATH-105 (min_score 500) and a DRAFT candidate rule TEST_SCORE -> MATH-105 (min_score 600)."
            - "TestAdministration K1 (room T70, MATH, proctor-70, 2026-08-01T00:00:00Z-02:00:00Z, capacity 5) OPEN."
            - "TEN sections of MATH-105, all term_code 2026FA, rooms R801..R810, meeting 2026-09-01T08:00:00Z-09:00:00Z through 2026-09-01T17:00:00Z-18:00:00Z in one-hour steps, capacity 5 each, all OPEN."
            - "TWO students, each with NO hs_gpa (so the only candidate rule is the TEST_SCORE one) and one attempt scored raw_score 100 -> scaled 625: SDIW (race_ethnicity_code WHITE) and SDIH (race_ethnicity_code HISPANIC). Each holds ONE determination with measure_type_used TEST_SCORE placing MATH-105."
            - "Both students are ENROLLED in ALL TEN sections and every registration is graded at clock 2026-08-01T00:00:00Z. SDIW receives A in all ten. SDIH receives A in the sections numbered 1-7 and F in the sections numbered 8, 9 and 10. No W grade is used anywhere, so the strict and inclusive cohorts coincide."
            - "The 10 registrations per student are all in term_code 2026FA and total 30.0 units, which is above MAX_TERM_UNITS — so the recipe uses TEN DISTINCT term_codes 2026FA, 2027SP, 2027SU, 2027FA, 2028SP, 2028SU, 2028FA, 2029SP, 2029SU and 2029FA, one per section, keeping each term at 3.0 units."
            - "One study over the window [2026-07-01T00:00:00Z, 2026-08-02T00:00:00Z) proposed by staff-1, run after the clock advances to 2026-08-02T00:00:00Z."
