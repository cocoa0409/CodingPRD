  # ============================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: session_slot_adjacency_half_open_no_overlap
        grounds:
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on Engineer resource via the
          session-slots endpoint. Two slots sharing exactly one endpoint
          (slot A ends at 10:00, slot B starts at 10:00) do NOT overlap and both
          can be booked. Slot-level semantics; entity = SessionSlot.
        test_recipe:
          setup:
            - "Engineer E capacity 480"
            - "Slot S1 [10:00, 11:00) confirmed BOOKED"
            - "New slot S2 [11:00, 12:00) — adjacent at boundary 11:00"
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/session-slots"
              payload: { engineer_id: "${eng_id}", slot_start_at: "2026-05-11T10:00:00Z", slot_end_at: "2026-05-11T11:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id }
            - call: "POST /studio/session-slots/${s1_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          trigger:
            - call: "POST /studio/session-slots"
              payload: { engineer_id: "${eng_id}", slot_start_at: "2026-05-11T11:00:00Z", slot_end_at: "2026-05-11T12:00:00Z" }
              as: StudioManager
              captures: { s2_id: $.data.id }
          assert:
            - "SessionSlot.${s2_id}.status == HELD"

      - name: project_book_capacity_aggregate_overlap
        grounds:
          - calculations.engineer_capacity_utilization
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics = AGGREGATE capacity — the sum of all overlapping booked
          slot minutes within a multi-day window must leave >= scheduled_duration_minutes
          of remaining capacity. Differs from slot-level pairwise overlap: an engineer
          with capacity_minutes_per_day=60 and one existing 60-minute slot CANNOT accept
          a second 60-minute project on the same day even though the two slots do not
          pairwise overlap. Entity = Project (via book endpoint); metric = aggregate
          minutes, not pairwise intersection.
        test_recipe:
          setup:
            - "Engineer E capacity_minutes_per_day = 60"
            - "Existing BOOKED slot [10:00, 11:00) consuming the day's full 60 minutes"
            - "New Project requests 60 minutes on [11:00, 12:00) same day"
          setup_api_calls:
