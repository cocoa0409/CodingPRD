      - name: terminal_operator_cannot_deliver_a_shipment_bound_elsewhere
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.TerminalOperator.identity
          - errors[ERR_TERMINAL_NOT_OWNER]
          - validations[priority=7]
          - endpoints[POST /nitrogen-ops/shipments/{id}/deliver]
        distinguishing_aspect: |
          The entity-backed identity is checked against this shipment's dest_asset_id, not against the
          role alone: the origin tank's operator gets 403 ERR_TERMINAL_NOT_OWNER on a movement addressed to
          the terminal, and the destination terminal's operator then delivers it, moving 20 tons out of the
          origin and into the destination in one call.
        test_recipe:
          setup:
            - "One plant with UREA tank UT-1 (capacity 20000, opening balance 5000) as origin and UREA terminal UT-2 (capacity 20000) as destination."
            - "Shipment SH-1 moves 20 tons 50 miles by TRUCK over 2026-08-05 -> 2026-08-06; it is booked against UT-1's current version and departed with the clock at 2026-08-05."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
