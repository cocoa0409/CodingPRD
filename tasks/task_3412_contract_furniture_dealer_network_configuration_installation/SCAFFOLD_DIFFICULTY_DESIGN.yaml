# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Task 3412 Contract Furniture Dealer Network
# §1.8 Test Targeting Index: 9 difficulty rules x >=2 instances = 22 instances
# All worked numbers are computed from SCAFFOLD.yaml's pinned constants:
#   TASK_CHAIR_SET unit parts = 125000c; WORKSTATION_6X6 = 85837c
#   FABRIC_UPCHARGE_PCT B=5, C=12; FABRIC_LEAD_DELTA B=7, C=14
#   TIER2_MIN_CENTS=25000000; TIER3_MIN_CENTS=75000000
#   discounts 0.10/0.15/0.20; PLANT_GR capacity 120; TRANSIT PLANT_GR 4
#   default clock 2026-09-01T00:00:00Z (a Tuesday)
# =============================================================================
scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_excludes_final_includes_current_order
        grounds:
          - calculations.order_pricing
          - entities.ProjectOrder.fields.provisional_tier
          - entities.ProjectOrder.fields.final_tier
          - state_machines.ProjectOrder.DRAFT_to_SUBMITTED
          - state_machines.ProjectOrder.SUBMITTED_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Same order, same agreement data: the PROVISIONAL variant (submit)
          keys the tier off cumulative volume EXCLUDING this order, the FINAL
          variant (acknowledge) keys it off cumulative volume INCLUDING this
          order's pre-discount total — 200 chairs at 125000c lands the final
          basis exactly on TIER2_MIN_CENTS=25000000, so the variants diverge
          (tier 1 vs tier 2). Entity domain: ProjectOrder pricing.
        test_recipe:
          setup:
            - "SEATING family base_lead_time_days=28; dealer level 4 with territories MI/OH; agreement 0.10/0.15/0.20 active 2026-01-01..2027-12-31"
            - "locked configuration: 200 x TASK_CHAIR_SET grade A (total_units 200 -> queue 12; lead 28+0+12=40; earliest install from 2026-09-01 is 2026-10-11)"
            - "order requested_install_date 2026-12-15 submitted and acknowledged at clock 2026-09-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chair program 200", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 200 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { prov_tier: "$.data.provisional_tier", prov_total: "$.data.provisional_total_cents", pre_total: "$.data.pre_discount_total_cents" } }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin, captures: { fin_tier: "$.data.final_tier", fin_total: "$.data.final_total_cents" } }
          assert:
            - "ProjectOrder.${ord_id}.pre_discount_total_cents == 25000000"
            - "provisional_tier == 1 and provisional_total_cents == 22500000 (tier basis 0 excludes this order)"
            - "final_tier == 2 and final_total_cents == 21250000 (tier basis 0+25000000 >= TIER2_MIN_CENTS 25000000)"
            - "provisional_total_cents != final_total_cents (delta == 1250000 on identical inputs)"

      - name: punch_escalation_business_days_authoritative_over_calendar_days
        grounds:
          - calculations.punch_escalation_age
          - entities.PunchTicket.fields.escalated
        distinguishing_aspect: |
          Same ticket, same clock: the CALENDAR variant reaches age 5 on
          2026-12-08 while the BUSINESS variant (authoritative for `escalated`)
          is still 3; at clock 2026-12-09 the variants disagree (calendar 6 vs
          business 4) and the flag must follow BUSINESS. Entity domain:
          PunchTicket service aging — different domain from order pricing.
        test_recipe:
          setup:
            - "full chain to a phase with install_status IN_PROGRESS; punch created at clock 2026-12-03 (a Thursday)"
            - "configuration: 4 x TASK_CHAIR_SET grade A; order install 2027-02-01; phase floor 1 seq 1 zone Z1 units 4; production 2026-11-02 at PLANT_GR"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Lobby chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2027-02-01" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders/${ord_id}/phases", payload: { floor_number: 1, phase_sequence: 1, building_zone_id: "Z1", planned_units: 4 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ph_id: "$.data.id" } }
            - { call: "POST /phases/${ph_id}/reserve-slot", payload: { plant_code: "PLANT_GR", production_date: "2026-11-02" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-03T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /phases/${ph_id}/start-install", as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /punch-tickets", payload: { installation_phase_id: "${ph_id}", severity: "MAJOR", description: "Scratched panel on workstation 12" }, as: EndUserRep, as_user_id: "${eu_id}", captures: { pt_id: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-09T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "GET /punch-tickets", payload: { installation_phase_id: "${ph_id}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { esc_wed: "$.data[0].escalated" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "GET /punch-tickets", payload: { installation_phase_id: "${ph_id}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { esc_thu: "$.data[0].escalated" } }
          assert:
            - "at clock 2026-12-09 escalated == false (business age 4 < 5 although calendar age 6 >= 5)"
            - "at clock 2026-12-10 escalated == true (business age 5 >= ESCALATION_BUSINESS_DAYS 5)"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_then_sum_beats_sum_then_round
        grounds:
          - calculations.order_pricing
          - calculations.bom_expansion
        distinguishing_aspect: |
          Mode (b) nested rounding: WORKSTATION_6X6 grade B unit exact price is
          85837 x 1.05 = 90128.85; the scaffold pins round-per-module-entry
          then sum, so entries of qty 3 and qty 1 give 270387 + 90129 = 360516,
          one cent more than the merged-quantity result 360515 — order of
          rounding changes the total.
        test_recipe:
          setup:
            - "SYSTEMS family base 42; dealer level 4; agreement active"
            - "configuration with TWO module entries of the same type and grade: 3 x WORKSTATION_6X6 B and 1 x WORKSTATION_6X6 B (total_units 4 -> queue 3; lead 42+7+3=52; earliest install 2026-10-23)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SYS-7500", name: "Systems 7500", category: "SYSTEMS", base_lead_time_days: 42 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Two-line trap", modules: [{ module_type: "WORKSTATION_6X6", fabric_grade: "B", qty: 3 }, { module_type: "WORKSTATION_6X6", fabric_grade: "B", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { pre_total: "$.data.pre_discount_total_cents", prov_total: "$.data.provisional_total_cents" } }
          assert:
            - "pre_discount_total_cents == 360516 (270387 + 90129; merged-quantity arithmetic would give 360515)"
            - "provisional_total_cents == 324464 (round_half_up(360516 x 0.90) = round_half_up(324464.4))"

      - name: tier_evaluation_order_pinned_off_prediscount_total
        grounds:
          - calculations.order_pricing
          - entities.VolumeAgreement.fields.cumulative_volume_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned: tier needs the order
          total, the total needs the tier — resolved by keying the tier off
          the PRE-discount cumulative + this order's PRE-discount total. With
          cumulative 12500000 and a 12500000 order, the basis is exactly
          25000000 -> tier 2 -> flat 15% over the whole order (average rate,
          not marginal): 10625000. Keying off the post-discount total
          (23187500) would wrongly keep tier 1.
        test_recipe:
          setup:
            - "agreement already carries cumulative_volume_cents == 12500000 (first 100-chair order acknowledged)"
            - "second order: another 100 x TASK_CHAIR_SET A (pre-discount 12500000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs 100", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 100 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord1_id: "$.data.id", ord1_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord1_id}/submit", payload: { expected_order_version: "${ord1_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord1_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord2_id: "$.data.id", ord2_v: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${ord2_id}/submit", payload: { expected_order_version: "${ord2_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { prov_tier: "$.data.provisional_tier", prov_total: "$.data.provisional_total_cents" } }
            - { call: "POST /project-orders/${ord2_id}/acknowledge", as: ManufacturerAdmin, captures: { fin_tier: "$.data.final_tier", fin_total: "$.data.final_total_cents" } }
          assert:
            - "order2.provisional_tier == 1 and provisional_total_cents == 11250000 (basis 12500000 < 25000000)"
            - "order2.final_tier == 2 and final_total_cents == 10625000 (basis 12500000+12500000 = 25000000 exactly; flat 0.15 over the whole pre-discount total)"

      - name: lead_time_max_over_modules_plus_unit_queue_tier
        grounds:
          - calculations.configuration_lead_time
          - validations[priority=20]
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: per-module
          family base + fabric delta (42+7, 28+14, 21+0), a max() over
          modules, plus a queue tier selected by total_units (16 -> 3 days):
          max(49,42,21)+3 = 52, and the boundary is inclusive — 2026-10-22
          fails, 2026-10-23 (= clock + 52) succeeds.
        test_recipe:
          setup:
            - "families SYSTEMS base 42, SEATING base 28, STORAGE base 21; dealer level 4; agreement active"
            - "configuration: 10 x WORKSTATION_6X6 B, 4 x TASK_CHAIR_SET C, 2 x STORAGE_WALL (fabric null) -> total_units 16"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SYS-7500", name: "Systems 7500", category: "SYSTEMS", base_lead_time_days: 42 }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "STOR-1100", name: "Storage 1100", category: "STORAGE", base_lead_time_days: 21 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Mixed floors", modules: [{ module_type: "WORKSTATION_6X6", fabric_grade: "B", qty: 10 }, { module_type: "TASK_CHAIR_SET", fabric_grade: "C", qty: 4 }, { module_type: "STORAGE_WALL", fabric_grade: null, qty: 2 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { mlt: "$.data.max_lead_time_days" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-10-22" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord1_id: "$.data.id", ord1_v: "$.data.version" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-10-23" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord2_id: "$.data.id", ord2_v: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${ord1_id}/submit", payload: { expected_order_version: "${ord1_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /project-orders/${ord2_id}/submit", payload: { expected_order_version: "${ord2_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { st2: "$.data.status" } }
          assert:
            - "max_lead_time_days == 52"
            - "order1 submit fails with ERR_LEAD_TIME_VIOLATION (2026-10-22 < 2026-09-01 + 52)"
            - "order2 submit succeeds at the exact boundary 2026-10-23 (>= semantics); status == SUBMITTED"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: configuration_spec_revision_cycle_locked_to_draft
        grounds:
          - state_machines.ConfigurationSpec
        distinguishing_aspect: |
          Cyclic shape on ConfigurationSpec: DRAFT->LOCKED->revise->DRAFT with
          revision_number 1->2 and version monotonically increasing; the cycle
          is re-entrant (the spec can be re-locked after revision).
        test_recipe:
          setup:
            - "SEATING family; dealer; one configuration 4 x TASK_CHAIR_SET A carried through a full lock, revise, re-lock cycle"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /configurations", payload: { name: "Rev loop", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id", cfg_v1: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v1}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { st_l1: "$.data.status" } }
          trigger:
            - { call: "POST /configurations/${cfg_id}/revise", as: DealerRep, as_user_id: "${dlr_id}", captures: { st_rev: "$.data.status", rev_no: "$.data.revision_number", cfg_v3: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v3}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { st_final: "$.data.status", v_final: "$.data.version", rev_final: "$.data.revision_number" } }
          assert:
            - "first lock lands LOCKED (version 2)"
            - "after revise: status == DRAFT, revision_number == 2, version == 3"
            - "after re-lock: status == LOCKED, revision_number == 2, version == 4 (create 1, lock 2, revise 3, lock 4)"

      - name: order_hold_release_cycle_via_dealer_suspension
        grounds:
          - state_machines.ProjectOrder.SUBMITTED_to_ON_HOLD
          - state_machines.ProjectOrder.ON_HOLD_to_SUBMITTED
          - state_machines.Dealer
        distinguishing_aspect: |
          Branching cycle on ProjectOrder driven cross-entity: dealer
          suspension flips SUBMITTED->ON_HOLD and reinstatement flips it back,
          and an acknowledge attempted while ON_HOLD is rejected
          (ERR_INVALID_STATE) even though the same call succeeds from
          SUBMITTED.
        test_recipe:
          setup:
            - "order submitted at clock 2026-09-01 (4 chairs, install 2026-12-15)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
