        claim_type: input_set_filtering
        grounds: ["calculations.acdbe_attainment"]
        distinguishing_aspect: "With zero ACCEPTED/ADJUSTED sales in the period, total_gross_cents is 0 and the pinned zero-denominator rule yields DEFICIENT with attainment_bp 0."
