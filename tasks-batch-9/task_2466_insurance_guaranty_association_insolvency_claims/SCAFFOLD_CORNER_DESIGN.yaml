              captures: { ins_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/poc-transfers"
              payload:
                receiver_batch_ref: "RB-002"
                records:
                  - { record_type: "POLICY", policy_number: "PA-3001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", policyholder_net_worth_cents: 50000000, effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
                  - { record_type: "POLICY", policy_number: "HO-3002", line_of_business: "HOMEOWNERS", policyholder_name: "Boris Ilic", policyholder_state_code: "MI", policyholder_net_worth_cents: 40000000, effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 900000 }
                  - { record_type: "CLAIM", policy_number: "PA-9999", claimant_name: "Cora Diaz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: ReceiverLiaison
              captures: { tr_id: $.data.id, rc: $.data.record_count }
