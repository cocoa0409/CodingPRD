            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 1, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
          trigger:
            - { call: "POST /quotes/${q}/issue", payload: {}, as: ServiceManager, captures: { q_issued: $.data.issued_at, q_exp: $.data.expires_at } }
          assert:
