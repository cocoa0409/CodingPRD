      - name: a_failing_tolerance_verdict_is_refused_only_at_release_and_is_a_dead_end
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TOLERANCE_BUDGET_EXCEEDED
          - validations.priority_25
          - state_machines.OpticalDesign.TOLERANCED_to_RELEASED
          - calculations.tolerance_stack_analysis
        distinguishing_aspect: |
          ERR_TOLERANCE_BUDGET_EXCEEDED lives on the release transition and nowhere else: the analysis of
          a design whose 0.0375-wave stack overruns its 0.0300-wave budget returns 200 and still moves the
          design to TOLERANCED with verdict FAIL, and only the release refuses it. The identically
          allocated design with a 0.0400-wave budget releases, which isolates the budget as the single
          differing input.
        test_recipe:
          setup:
            - "Two designs are created with the same single allocation (sensitivity 1.5, tolerance 0.0250, contributor 0.0375 waves): OD-2540-FAIL with tolerance_budget_waves 0.0300 and OD-2540-PASS with 0.0400."
            - "Both use the default STATISTICAL method, so governing_stack_waves == rss_stack_waves == 0.0375 for both."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-FAIL", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0300, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-PASS", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0400, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d2: $.data.id }
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
          trigger:
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/release"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/optical-designs/${d2}"
              payload: {}
              as: OpticsEngineer
          assert:
            - "the analysis of the failing design returns HTTP 200 with tolerance_verdict FAIL, rss_stack_waves 0.0375, worst_case_stack_waves 0.0375, governing_stack_waves 0.0375 and design_status TOLERANCED"
            - "its release returns HTTP 422 with error_id ERR_TOLERANCE_BUDGET_EXCEEDED"
            - "OpticalDesign.${d1}.design_status is still TOLERANCED with tolerance_verdict FAIL after the refusal, so the design is a dead end that no further call can rescue"
            - "the analysis of the passing design returns tolerance_verdict PASS with the identical 0.0375 stack"
            - "its release returns HTTP 200 with design_status RELEASED"
            - "the only difference between the two designs was tolerance_budget_waves 0.0300 versus 0.0400"

