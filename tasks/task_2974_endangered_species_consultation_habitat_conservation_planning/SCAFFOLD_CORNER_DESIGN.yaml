  # ==========================================================================
  # From Table 6 (Errors) — triggerability audit of all 38 declared error ids.
  # Every id below is provoked by at least one §1.8 (D:) or §1.9 (C:) instance;
  # this section adds only the two claims that no other section makes, namely
  # the shape of an error body and the pinning of each id to one HTTP status.
  #
  #   ERR_UNAUTHENTICATED                    C:absent_or_blank_auth_headers_are_401_and_only_proponent_creation_is_exempt
  #   ERR_ROLE_NOT_PERMITTED                 C:declared_but_unpermitted_role_is_403_while_an_unknown_role_string_is_401
  #   ERR_NOT_RESOURCE_OWNER                 C:proponent_ownership_is_resolved_through_the_whole_parent_chain
  #   ERR_INVALID_REQUEST                    C:every_input_schema_violation_collapses_to_one_400_error_id
  #   ERR_SPECIES_NOT_FOUND                  C:missing_resource_ids_return_their_own_404_error_ids
  #   ERR_PROPONENT_NOT_FOUND                C:body_foreign_keys_are_resolved_flat_with_per_target_error_ids
  #   ERR_PROJECT_ACTION_NOT_FOUND           C:missing_resource_ids_return_their_own_404_error_ids
  #   ERR_CRITICAL_HABITAT_UNIT_NOT_FOUND    C:critical_habitat_unit_parent_species_not_found
  #   ERR_PRESENCE_DETERMINATION_NOT_FOUND   C:missing_resource_ids_return_their_own_404_error_ids
  #   ERR_CONSULTATION_NOT_FOUND             C:missing_resource_ids_return_their_own_404_error_ids
  #   ERR_HCP_NOT_FOUND                      C:missing_resource_ids_return_their_own_404_error_ids
  #   ERR_CONSERVATION_BANK_NOT_FOUND        C:the_bank_commitment_link_is_agency_only_and_spans_every_plan
  #   ERR_PERMIT_NOT_FOUND                   C:proponent_ownership_is_resolved_through_the_whole_parent_chain
  #   ERR_MONITORING_REPORT_NOT_FOUND        C:missing_resource_ids_return_their_own_404_error_ids
  #   ERR_CIRCUMSTANCE_EVENT_NOT_FOUND       C:missing_resource_ids_return_their_own_404_error_ids
  #   ERR_STALE_HCP_VERSION                  C:stale_expected_hcp_version_is_412_on_every_commitment_write
  #   ERR_STALE_PERMIT_VERSION               C:stale_expected_permit_version_is_412_even_after_a_cascade_bump
  #   ERR_INVALID_STATE_TRANSITION           C:transitions_absent_from_the_table_are_refused_with_409
  #   ERR_PERMIT_NOT_ACTIVE                  D:permit_not_active_beats_take_limit_exceeded
  #   ERR_SEGREGATION_OF_DUTIES              C:segregation_of_duties_separates_approver_issuer_and_adjudicator
  #   ERR_ADJUDICATOR_CONFLICT               C:segregation_of_duties_separates_approver_issuer_and_adjudicator
  #   ERR_SPECIES_NOT_LISTED                 C:conservation_banks_may_only_cover_a_listed_species
  #   ERR_CONSULTATION_TYPE_MISMATCH         C:only_the_matching_consultation_type_may_be_concluded
  #   ERR_HCP_NOT_ALLOWED_FOR_FEDERAL_ACTION C:federal_actions_may_not_host_a_habitat_conservation_plan
  #   ERR_JEOPARDY_UNRESOLVED                D:jeopardy_unresolved_beats_mitigation_shortfall
  #   ERR_SURVEY_WINDOW_INVALID              C:survey_window_fields_are_required_exactly_when_the_method_is_a_field_survey
  #   ERR_CONSULTATION_DEADLINE_PASSED       C:information_request_deadline_boundary_is_inclusive
  #   ERR_PERIOD_OUTSIDE_PERMIT_TERM         C:reporting_period_bounds_are_checked_against_both_the_term_and_the_clock
  #   ERR_SURVEY_WINDOW_CONFLICT             D:survey_windows_on_a_habitat_unit_are_closed_intervals_with_a_buffer
  #   ERR_REPORTING_PERIOD_OVERLAP           D:reporting_periods_on_a_permit_are_half_open_and_may_be_adjacent
  #   ERR_NO_PRESENCE_DETERMINATIONS         D:empty_candidate_set_is_no_effect_not_an_error
  #   ERR_NO_MITIGATION_COMMITMENTS          C:submission_requires_a_reserved_commitment_before_and_after_a_revision
  #   ERR_BANK_NOT_ELIGIBLE                  C:bank_ineligibility_has_four_independent_grounds
  #   ERR_INSUFFICIENT_BANK_CREDITS          C:bank_credit_availability_is_an_aggregate_boundary_on_reservations
