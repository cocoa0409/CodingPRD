  - rule_id: resource_temporal_overlap
    instances:
      - name: meal_service_windows_half_open_require_sixty_minute_gap
        grounds:
          - validations[priority=53]
          - errors[ERR_MEAL_SERVICE_WINDOW_CONFLICT]
          - entities.MealServiceDay.fields.meal_services
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN [start, end) plus a mandatory 60-minute separation between
          consecutive meal services on the same day: LUNCH 11:30-12:30 with PM_SNACK 13:30-14:00 is
          accepted because the gap is exactly 60 minutes, while PM_SNACK 13:00-13:30 (gap 30) is
          rejected with ERR_MEAL_SERVICE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Sponsor APPROVED; one rural SELF_PREP site approved for LUNCH and PM_SNACK, APPROVED and OPERATING, season 2026-06-08..2026-08-14."
            - "Logical clock 2026-06-08T08:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
