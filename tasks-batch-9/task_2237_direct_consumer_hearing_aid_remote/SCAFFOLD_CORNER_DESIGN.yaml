            - { call: "POST /inventory-pools/${pool_mo}/restock", payload: { units: 5 }, as: PlatformAdmin }
            - { call: "POST /devices", payload: { serial_number: "SN-C002", model: "NEO", firmware_version: "4.0.0" }, as: PlatformAdmin }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "c2@x.test", full_name: "C Two", age_years: 70 }, as: CareOpsAgent, captures: { pat_c2: "$.data.id" } }
            - { call: "POST /patients/${pat_c2}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_c2}", captures: { scr_c2: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_c2}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_c2}" }
            - { call: "POST /screening-sessions/${scr_c2}/submit", payload: {}, as: Patient, as_user_id: "${pat_c2}" }
            - { call: "POST /patients/${pat_c2}/device-orders", payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 200000, discount_cents: 0, accessory_subtotal_cents: 0, shipping_cents: 1495 }, as: Patient, as_user_id: "${pat_c2}", captures: { ord_c2: "$.data.id" } }
            - { call: "POST /care-plan-subscriptions", payload: { patient_id: "${pat_c2}", device_order_id: "${ord_c2}", plan_tier: "STANDARD", base_fee_cents: 9900, firmware_auto_update_enabled: true }, as: Patient, as_user_id: "${pat_c2}", captures: { sub_c2: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { device_order_id: "${ord_c2}", outcome: "AUTHORIZED" }, as: PlatformAdmin }
            - { call: "POST /device-orders/${ord_c2}/confirm-fit", payload: {}, as: CareOpsAgent }
            - { call: "POST /device-orders/${ord_c2}/ship", payload: {}, as: CareOpsAgent }
            - { call: "POST /_shipments/scan", payload: { device_order_id: "${ord_c2}", event: "DELIVERED" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /care-plan-subscriptions/${sub_c2}/run-billing-cycle", payload: { charge_outcome: "DECLINED" }, as: PlatformAdmin }
          assert:
            - "HTTP 402 and the body contains exactly data.error_id == \"ERR_PAYMENT_DECLINED\" plus data.message (no entity payload)"
