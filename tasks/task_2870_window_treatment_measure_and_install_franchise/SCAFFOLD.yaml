scenario: |
  2870. Window Treatment Measure-and-Install Franchise (Budget Blinds): in-home design consultation & sample library check-out, precise opening measurement with inside/outside mount deduction rules, quote configuration across fabric, lift system and motorization options, vendor order routing with lead time and remake policy, child-safety cordless requirement compliance, motorized shade commissioning & smart-home integration, install exception (out-of-square, obstruction) and re-measure chargeback, franchise territory lead routing & royalty on net sales
domain_name: window-treatment-measure-and-install-franchise
api_prefix: "/blinds"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every write endpoint is a peer collection under /blinds with foreign keys carried in the
  # request body (POST /blinds/openings takes consultation_id; POST /blinds/quotes takes
  # consultation_id). No write path nests one entity id under another. The only nested paths
  # in §1.5 are the two read-side reverse-reachability collections
  # (GET /blinds/territories/{id}/ledger-entries) and the four action sub-paths on a single
  # resource (e.g. POST /blinds/quotes/{id}/accept), which address one entity, not a hierarchy.

  state_machine_shape: parallel
  # InstallJob carries two independent state dimensions on the same row:
  # install_status (SCHEDULED -> COMPLETED | EXCEPTION_RAISED | CANCELLED) and
  # commissioning_status (NOT_REQUIRED | PENDING -> PAIRED -> VERIFIED | FAILED -> PAIRED ...),
  # joined only by the COMPLETE guard. Quote (PRESENTED -> DRAFT -> PRESENTED), VendorOrder
  # (RECEIVED -> REMAKE_REQUESTED -> PLACED) and SampleKit (AVAILABLE -> ON_LOAN -> AVAILABLE)
  # add three revision/remake cycles on three further entities.

  relationship_patterns:
    - one_to_many
    - self_referential      # Opening.replaces_opening_id -> Opening.id (re-measure supersession chain)
    - polymorphic           # LedgerEntry.source_entity_type + source_entity_id address 4 entity types
    - cross_aggregate       # Designer scoring reads SampleCheckout rows through Consultation.designer_id

  role_model: peer_roles
  # Franchisor owns brand configuration (territories, vendors, logical clock); Franchisee owns
  # one Territory's staff, kits, leads and vendor orders; Designer owns the in-home workflow
  # (consultations, sample loans, measurements, quotes, installs, commissioning); VendorRep owns
  # only the ship transition on its own orders. Franchisor is NOT a superset: it cannot measure,
  # quote, install or commission.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Territory
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the franchised business unit."
        constraints: "1..120 chars"
      - name: postal_codes
        type: array
        source: input
        description: "Exclusive 5-digit postal codes this territory serves; the lead router matches Lead.postal_code against this set."
        constraints: "1..40 entries, each exactly 5 digits, no duplicates, no postal code may appear in two Territory rows whose status != TERMINATED"
      - name: royalty_rate_pct
        type: number
        source: input
        default: 0.055
        description: "Royalty fraction applied to net sales; see calculations.royalty_accrual."
        constraints: "0 <= royalty_rate_pct <= 0.15, at most 4 decimal places"
      - name: lead_capacity_per_week
        type: integer
        source: input
        default: 5
        description: "Maximum number of Leads with status IN {ROUTED, CONSULT_COMPLETE} this territory may hold; the lead router refuses to exceed it."
        constraints: ">= 1"
      - name: credit_limit_cents
        type: integer
        source: input
        default: 2000000
        description: "Ceiling on open_order_exposure_cents; a vendor order that would breach it is rejected."
        constraints: ">= 0"
      - name: liability_window
        type: enum
        source: input
        default: ROLLING_180D
        description: "Selects which variant of calculations.designer_liability_score applies to every Designer in this territory."
        constraints: "one of {ROLLING_180D, LIFETIME}"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Franchise standing. Only ACTIVE territories receive routed leads or permit new consultations, quotes and vendor orders."
        constraints: "one of {ACTIVE, PROBATION, SUSPENDED, TERMINATED}"
      - name: open_leads_count
        type: integer
        source: computed
        default: 0
        description: "Count of Lead rows with territory_id == this.id and status IN {ROUTED, CONSULT_COMPLETE}. Recomputed on every Lead status change."
      - name: net_sales_cents
        type: integer
        source: computed
        default: 0
        description: "Recognized net sales; increased on quote acceptance and adjusted by install true-up and full-credit remakes. See calculations.royalty_accrual."
      - name: royalty_accrued_cents
        type: integer
        source: computed
        default: 0
        description: "Running royalty owed to the franchisor; equals the signed sum of LedgerEntry.amount_cents rows with entry_type IN {NET_SALES_ROYALTY, ROYALTY_REVERSAL} for this territory."
      - name: remake_chargeback_cents
        type: integer
        source: computed
        default: 0
        description: "Running total of LedgerEntry.amount_cents rows with entry_type IN {REMAKE_CHARGEBACK, REMEASURE_CHARGEBACK} for this territory."
      - name: open_order_exposure_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of VendorOrder.order_cost_cents for orders of this territory with status IN {PLACED, SHIPPED, REMAKE_REQUESTED}."
      - name: available_kit_count
        type: integer
        source: computed
        default: 0
        description: "Count of SampleKit rows with territory_id == this.id and status == AVAILABLE."
      - name: on_loan_kit_count
        type: integer
        source: computed
        default: 0
        description: "Count of SampleKit rows with territory_id == this.id and status == ON_LOAN. Conserved against open SampleCheckout rows; see calculations.sample_loan_conservation."
      - name: lost_kit_count
        type: integer
        source: computed
        default: 0
        description: "Count of SampleKit rows with territory_id == this.id and status == LOST. Written only by the OPEN -> LOST return path; it is the third bucket of the conservation identity in calculations.sample_loan_conservation and never decreases."

  - name: Designer
    parent: null
    common_fields: true
    fields:
      - name: territory_id
        type: string
        source: input
        description: "FK -> Territory.id; the single territory this designer works for."
      - name: full_name
        type: string
        source: input
        description: "Designer's display name."
        constraints: "1..120 chars"
      - name: home_postal_code
        type: string
        source: input
        description: "Postal code the designer starts the day from; not used by the calendar buffer rule, which compares appointment postal codes."
        constraints: "exactly 5 digits"
      - name: certifications
        type: array
        source: input
        default: []
        description: "Held certifications; MOTORIZATION is required to pair a motorized shade."
        constraints: "subset of {MOTORIZATION, CHILD_SAFETY, COMMERCIAL}, no duplicates"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Only ACTIVE designers may be booked onto consultations or install jobs."
        constraints: "one of {ACTIVE, SUSPENDED, INACTIVE}"
      - name: remeasure_exception_count
        type: integer
        source: computed
        default: 0
        description: "Count of InstallJob rows with designer_id == this.id, install_status == EXCEPTION_RAISED, liable_party == MEASURER and exception_raised_at inside the active liability window."
      - name: late_sample_return_count
        type: integer
        source: computed
        default: 0
        description: "Count of SampleCheckout rows whose consultation_id resolves to a Consultation with designer_id == this.id, days_late > 0, and returned_at inside the active liability window."
      - name: clean_install_count
        type: integer
        source: computed
        default: 0
        description: "Count of InstallJob rows with designer_id == this.id, install_status == COMPLETED, exception_reason == NONE and completed_at inside the active liability window."
      - name: remeasure_liability_score
        type: number
        source: computed
        default: 100
        description: "Output of calculations.designer_liability_score; dropping below SUSPENSION_THRESHOLD auto-suspends the designer."

  - name: SampleKit
    parent: null
    common_fields: true
    fields:
      - name: territory_id
        type: string
        source: input
        description: "FK -> Territory.id; the sample library that owns this kit."
      - name: kit_code
        type: string
        source: input
        description: "Library label of the kit."
        constraints: "1..40 chars, unique among SampleKit rows with the same territory_id and status != LOST"
      - name: replacement_value_cents
        type: integer
        source: input
        description: "Cost charged to the territory when the kit is declared lost; also caps the accumulated late fee."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: "AVAILABLE -> ON_LOAN on check-out, back to AVAILABLE on return, LOST when returned more than SAMPLE_LOST_THRESHOLD_DAYS late."
        constraints: "one of {AVAILABLE, ON_LOAN, LOST}"
      - name: loan_count
        type: integer
        source: computed
        default: 0
        description: "Lifetime count of SampleCheckout rows created against this kit."
      - name: open_loan_count
        type: integer
        source: computed
        default: 0
        description: "Count of SampleCheckout rows with sample_kit_id == this.id and status == OPEN; invariantly 1 when status == ON_LOAN and 0 otherwise."

  - name: Lead
    parent: null
    common_fields: true
    fields:
      - name: customer_name
        type: string
        source: input
        description: "Homeowner name; also the last tie-break key of the queued-lead promotion selector."
        constraints: "1..120 chars"
      - name: postal_code
        type: string
        source: input
        description: "Service postal code used by the territory router."
        constraints: "exactly 5 digits"
      - name: source
        type: enum
        source: input
        description: "Where the inquiry originated."
        constraints: "one of {NATIONAL_CALL_CENTER, WEB_FORM, REFERRAL, WALK_IN}"
      - name: child_occupied_dwelling
        type: boolean
        source: input
        default: false
        description: "Homeowner declaration that children under 9 live in or regularly visit the dwelling; makes the cordless requirement apply to every opening of the job."
      - name: requested_at
        type: datetime
        source: input
        description: "Customer-stated earliest date they want a consultation; ISO 8601 UTC with three fractional digits."
      - name: territory_id
        type: string
        source: system
        description: "FK -> Territory.id; null while status IN {NEW, QUEUED, UNROUTABLE}, set by calculations.territory_lead_routing."
      - name: routed_at
        type: datetime
        source: system
        description: "Logical-clock instant the lead was bound to a territory; null until then."
      - name: status
        type: enum
        source: system
        default: NEW
        description: "Lifecycle; the create request always performs one routing transition before responding, so NEW is never observed in a response body."
        constraints: "one of {NEW, ROUTED, QUEUED, UNROUTABLE, CONSULT_COMPLETE, CONVERTED, LOST}"

  - name: Consultation
    parent: null
    common_fields: true
    fields:
      - name: lead_id
        type: string
        source: input
        description: "FK -> Lead.id; the routed lead this in-home appointment serves."
      - name: designer_id
        type: string
        source: input
        description: "FK -> Designer.id; the designer whose calendar this appointment occupies."
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Appointment start, ISO 8601 UTC with three fractional digits; inclusive endpoint of the half-open calendar occupation."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Appointment end, ISO 8601 UTC with three fractional digits; exclusive endpoint of the half-open calendar occupation."
        constraints: "strictly greater than scheduled_start_at"
      - name: service_postal_code
        type: string
        source: input
        description: "Postal code of the dwelling; must equal Lead.postal_code and drives the travel-buffer branch of the designer calendar rule."
        constraints: "exactly 5 digits"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "SCHEDULED -> COMPLETED on a successful visit, -> NO_SHOW when the homeowner is absent, -> CANCELLED when the assigned designer is auto-suspended."
        constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}"
      - name: measured_opening_count
        type: integer
        source: computed
        default: 0
        description: "Count of Opening rows with consultation_id == this.id and measure_status IN {MEASURED, CONFIGURED, QUOTED}."
      - name: configured_opening_count
        type: integer
        source: computed
        default: 0
        description: "Count of Opening rows with consultation_id == this.id and measure_status == CONFIGURED."
      - name: open_sample_loan_count
        type: integer
        source: computed
        default: 0
        description: "Count of SampleCheckout rows with consultation_id == this.id and status == OPEN; must be 0 before the appointment may be completed."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the appointment was completed; null otherwise."

  - name: SampleCheckout
    parent: null
    common_fields: true
    fields:
      - name: sample_kit_id
        type: string
        source: input
        description: "FK -> SampleKit.id; the kit taken out of the library."
      - name: consultation_id
        type: string
        source: input
        description: "FK -> Consultation.id; the appointment the kit was taken for."
      - name: hold_start_at
        type: datetime
        source: input
        description: "Start of the requested closed hold interval on the kit, ISO 8601 UTC with three fractional digits; must be >= the logical clock."
      - name: hold_end_at
        type: datetime
        source: input
        description: "End of the requested closed hold interval on the kit; both endpoints are inclusive for the collision rule."
        constraints: "strictly greater than hold_start_at and at most SAMPLE_MAX_HOLD_DAYS (14) days after it"
      - name: checked_out_at
        type: datetime
        source: system
        description: "Logical-clock instant the checkout row was created."
      - name: due_at
        type: datetime
        source: system
        description: "Equal to hold_end_at; the instant after which lateness accrues."
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant of the return call; null while status == OPEN."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN -> RETURNED on a return at or before SAMPLE_LOST_THRESHOLD_DAYS of lateness, OPEN -> LOST beyond it."
        constraints: "one of {OPEN, RETURNED, LOST}"
      - name: days_late
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.sample_late_fee; 0 while status == OPEN."
      - name: late_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.sample_late_fee; posted to the ledger on return."

  - name: Opening
    parent: null
    common_fields: true
    fields:
      - name: consultation_id
        type: string
        source: input
        description: "FK -> Consultation.id; the appointment at which this opening was measured."
      - name: quote_id
        type: string
        source: system
        description: "FK -> Quote.id; set when the opening is attached to a quote, cleared when that quote is superseded."
      - name: replaces_opening_id
        type: string
        source: input
        description: "FK -> Opening.id; the opening this re-measure supersedes. Null for a first measurement; required to be an opening with measure_status == REMEASURE_REQUIRED when supplied."
      - name: label
        type: string
        source: input
        description: "Human label such as 'Nursery west window'."
        constraints: "1..80 chars"
      - name: room_type
        type: enum
        source: input
        description: "Room the opening sits in; NURSERY and BEDROOM make the cordless requirement apply regardless of Lead.child_occupied_dwelling."
        constraints: "one of {BEDROOM, NURSERY, LIVING_ROOM, KITCHEN, BATH, OFFICE}"
      - name: mount_type
        type: enum
        source: input
        description: "INSIDE mount deducts from the narrowest/shortest reading and rounds DOWN to the eighth; OUTSIDE mount adds overlap to the widest/tallest reading and rounds UP."
        constraints: "one of {INSIDE, OUTSIDE}"
      - name: width_top_in
        type: number
        source: input
        description: "Width measured at the top of the opening, inches."
        constraints: "0.125 <= value <= 240.000, at most 3 decimal places"
      - name: width_middle_in
        type: number
        source: input
        description: "Width measured at mid-height, inches."
        constraints: "0.125 <= value <= 240.000, at most 3 decimal places"
      - name: width_bottom_in
        type: number
        source: input
        description: "Width measured at the sill, inches."
        constraints: "0.125 <= value <= 240.000, at most 3 decimal places"
      - name: height_left_in
        type: number
        source: input
        description: "Height measured at the left jamb, inches."
        constraints: "0.125 <= value <= 240.000, at most 3 decimal places"
      - name: height_center_in
        type: number
        source: input
        description: "Height measured at the centre, inches."
        constraints: "0.125 <= value <= 240.000, at most 3 decimal places"
      - name: height_right_in
        type: number
        source: input
        description: "Height measured at the right jamb, inches."
        constraints: "0.125 <= value <= 240.000, at most 3 decimal places"
      - name: depth_in
        type: number
        source: input
        description: "Usable pocket depth from the glass to the front of the jamb, inches; INSIDE mount requires at least MIN_INSIDE_DEPTH_IN."
        constraints: "0.125 <= value <= 24.000, at most 3 decimal places"
      - name: out_of_square_in
        type: number
        source: computed
        description: "Output of calculations.opening_finished_dimensions; the larger of the width spread and the height spread."
      - name: ordered_width_in
        type: number
        source: computed
        description: "Output of calculations.opening_finished_dimensions; the width sent to the vendor."
      - name: ordered_height_in
        type: number
        source: computed
        description: "Output of calculations.opening_finished_dimensions; the height sent to the vendor."
      - name: billable_sqft
        type: number
        source: computed
        default: 0
        description: "Output of calculations.opening_list_price; quarter-square-foot billing unit."
      - name: fabric_code
        type: string
        source: input
        description: "Fabric selected during quote configuration; null until PATCH /blinds/openings/{id}/configuration runs."
        constraints: "one of the keys of calculations.opening_list_price.constants.FABRIC_RATE_CENTS_PER_SQFT"
      - name: lift_system
        type: enum
        source: input
        description: "Lift mechanism selected during quote configuration; null until configured."
        constraints: "one of {CORDED, CORDLESS, CONTINUOUS_LOOP, MOTORIZED}"
      - name: motorization_option
        type: enum
        source: input
        default: NONE
        description: "Motor package; must be NONE unless lift_system == MOTORIZED, and must not be NONE when lift_system == MOTORIZED."
        constraints: "one of {NONE, BATTERY, HARDWIRED}"
      - name: list_price_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.opening_list_price; 0 while measure_status == MEASURED."
      - name: measure_status
        type: enum
        source: system
        default: MEASURED
        description: "MEASURED -> CONFIGURED once fabric and lift are set, -> QUOTED when attached to a quote, back to CONFIGURED when that quote is superseded, -> REMEASURE_REQUIRED after an install exception."
        constraints: "one of {MEASURED, CONFIGURED, QUOTED, REMEASURE_REQUIRED}"
      - name: install_outcome
        type: enum
        source: system
        default: PENDING
        description: "PENDING until an install job resolves this opening; INSTALLED on install completion, NOT_INSTALLED when an install exception names it."
        constraints: "one of {PENDING, INSTALLED, NOT_INSTALLED}"
      - name: credited
        type: boolean
        source: system
        default: false
        description: "True once a FULL_CREDIT remake has reversed this opening's revenue; credited openings are excluded from every royalty basis."

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: consultation_id
        type: string
        source: input
        description: "FK -> Consultation.id; the appointment whose CONFIGURED openings this quote prices. Also the OCC parent for quote creation."
      - name: lead_id
        type: string
        source: computed
        description: "Denormalized copy of the Consultation.lead_id of consultation_id; the server keeps it equal to that value on every write."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT -> PRESENTED -> ACCEPTED; PRESENTED -> DRAFT on revision; DRAFT|PRESENTED -> SUPERSEDED when a newer quote is created for the same consultation; PRESENTED -> EXPIRED once the logical clock reaches expires_at."
        constraints: "one of {DRAFT, PRESENTED, ACCEPTED, EXPIRED, SUPERSEDED}"
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: "Number of completed PRESENTED -> DRAFT revisions; capped at QUOTE_MAX_REVISIONS."
      - name: opening_count
        type: integer
        source: computed
        default: 0
        description: "Count of Opening rows with quote_id == this.id."
      - name: motorized_opening_count
        type: integer
        source: computed
        default: 0
        description: "Count of Opening rows with quote_id == this.id and motorization_option != NONE."
      - name: subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Step 1 of calculations.quote_totals: sum of the attached openings' already-rounded list_price_cents."
      - name: install_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Step 2 of calculations.quote_totals; discount-exempt labour charge."
      - name: pre_discount_total_cents
        type: integer
        source: computed
        default: 0
        description: "Step 3 of calculations.quote_totals: subtotal_cents + install_fee_cents; this is the value the discount tier is selected from."
      - name: discount_pct
        type: number
        source: computed
        default: 0
        description: "Step 4 of calculations.quote_totals: tier selected from pre_discount_total_cents."
      - name: discount_cents
        type: integer
        source: computed
        default: 0
        description: "Step 5 of calculations.quote_totals: discount_pct applied to subtotal_cents only, never to pre_discount_total_cents."
      - name: total_cents
        type: integer
        source: computed
        default: 0
        description: "Step 6 of calculations.quote_totals: pre_discount_total_cents - discount_cents; the customer-facing price."
      - name: net_sales_cents
        type: integer
        source: computed
        default: 0
        description: "Royalty base of the provisional variant: subtotal_cents - discount_cents (equivalently total_cents - install_fee_cents)."
      - name: recognized_net_sales_cents
        type: integer
        source: computed
        default: 0
        description: "Net sales currently recognized on the territory for this quote; equals net_sales_cents after acceptance and is re-stated by the install true-up and by full-credit remakes."
      - name: credited_net_sales_cents
        type: integer
        source: computed
        default: 0
        description: "Net sales reversed by FULL_CREDIT remakes on this quote's openings."
      - name: presented_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent presentation; null while DRAFT and never cleared once set."
      - name: expires_at
        type: datetime
        source: system
        description: "presented_at + QUOTE_VALIDITY_DAYS; cleared to null by a revision and re-stamped by the next presentation."
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of acceptance; null otherwise."

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Manufacturer name."
        constraints: "1..120 chars, unique across Vendor rows"
      - name: base_lead_time_days
        type: integer
        source: input
        description: "Whole days from the effective placement date to the promised ship date before adders."
        constraints: "1 <= value <= 120"
      - name: motorization_extra_days
        type: integer
        source: input
        default: 0
        description: "Extra days added when any opening on the order has motorization_option != NONE."
        constraints: "0 <= value <= 60"
      - name: cutoff_hour_utc
        type: integer
        source: input
        default: 17
        description: "Daily order cutoff; an order placed at an hour strictly below this value keeps the placement date, otherwise it rolls to the next day."
        constraints: "0 <= value <= 23"
      - name: remake_policy
        type: enum
        source: input
        description: "FULL_VENDOR_90D absorbs the whole remake cost within VENDOR_REMAKE_WINDOW_DAYS of receipt; SHARED_50_50 absorbs a floored half with no window limit; NO_REMAKE absorbs nothing and refuses remakes altogether."
        constraints: "one of {FULL_VENDOR_90D, SHARED_50_50, NO_REMAKE}"
      - name: concurrent_capacity
        type: integer
        source: input
        default: 2
        description: "Maximum number of this vendor's non-terminal orders whose inclusive production window may contain any single calendar date."
        constraints: ">= 1"
      - name: supported_lift_systems
        type: array
        source: input
        description: "Lift systems this vendor manufactures; every opening on an order must be covered."
        constraints: "non-empty subset of {CORDED, CORDLESS, CONTINUOUS_LOOP, MOTORIZED}, no duplicates"
      - name: supported_hub_platforms
        type: array
        source: input
        default: []
        description: "Smart-home hubs this vendor's motors pair with; required non-empty to win a motorized order."
        constraints: "subset of {ALEXA, GOOGLE_HOME, HOMEKIT, MATTER}, no duplicates"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Only ACTIVE vendors are eligible for routing."
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: open_order_count
        type: integer
        source: computed
        default: 0
        description: "Count of VendorOrder rows with vendor_id == this.id and status IN {PLACED, SHIPPED, REMAKE_REQUESTED}."

  - name: VendorOrder
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the accepted quote being manufactured. Also the OCC parent for order placement."
      - name: vendor_id
        type: string
        source: system
        description: "FK -> Vendor.id; chosen by calculations.vendor_routing_selector, or pinned when preferred_vendor_id is supplied and eligible."
      - name: opening_ids
        type: array
        source: input
        description: "Ids of the Opening rows on the quote included in this order; every entry must have quote_id == this.quote_id, install_outcome == PENDING and no other non-terminal order."
        constraints: "1..40 entries, no duplicates"
      - name: status
        type: enum
        source: system
        default: PLACED
        description: "PLACED -> SHIPPED -> RECEIVED; RECEIVED -> REMAKE_REQUESTED -> PLACED for a replacement remake; RECEIVED -> CANCELLED for a full-credit remake."
        constraints: "one of {PLACED, SHIPPED, RECEIVED, REMAKE_REQUESTED, CANCELLED}"
      - name: remake_count
        type: integer
        source: system
        default: 0
        description: "Number of completed remake cycles; capped at ORDER_MAX_REMAKES."
      - name: credit_scope
        type: enum
        source: system
        default: NONE
        description: "NONE until a remake is requested; REPLACEMENT re-places the same order, FULL_CREDIT cancels it and reverses revenue."
        constraints: "one of {NONE, REPLACEMENT, FULL_CREDIT}"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent placement (initial or remake re-placement)."
      - name: effective_placement_date
        type: string
        source: computed
        description: "Output of calculations.vendor_lead_time; YYYY-MM-DD, rolled to the next day when placed_at's hour is at or after the vendor cutoff."
      - name: lead_time_days
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.vendor_lead_time."
      - name: promised_ship_date
        type: string
        source: computed
        description: "Output of calculations.vendor_lead_time; YYYY-MM-DD, inclusive end of the production window used by the vendor capacity rule."
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ship call; null before."
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant of the receive call; null before. Starts the vendor remake window."
      - name: order_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Wholesale exposure of the order: VENDOR_COST_PCT of the included openings' list_price_cents, rounded half up once over the summed list price."
      - name: remake_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.remake_chargeback_waterfall for the most recent remake; 0 before any remake."
      - name: vendor_absorbed_cents
        type: integer
        source: computed
        default: 0
        description: "Bucket 1 of calculations.remake_chargeback_waterfall."
      - name: territory_absorbed_cents
        type: integer
        source: computed
        default: 0
        description: "Bucket 2 of calculations.remake_chargeback_waterfall."
      - name: customer_absorbed_cents
        type: integer
        source: computed
        default: 0
        description: "Bucket 3 of calculations.remake_chargeback_waterfall; carries the remainder so the three buckets sum exactly to remake_cost_cents."

  - name: InstallJob
    parent: null
    common_fields: true
    fields:
      - name: vendor_order_id
        type: string
        source: input
        description: "FK -> VendorOrder.id; the received order being installed."
      - name: designer_id
        type: string
        source: input
        description: "FK -> Designer.id; the installer, whose calendar this job occupies alongside consultations."
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Install window start, ISO 8601 UTC with three fractional digits; inclusive endpoint of the half-open calendar occupation."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Install window end; exclusive endpoint of the half-open calendar occupation."
        constraints: "strictly greater than scheduled_start_at"
      - name: service_postal_code
        type: string
        source: input
        description: "Postal code of the dwelling; drives the travel-buffer branch of the designer calendar rule."
        constraints: "exactly 5 digits"
      - name: install_status
        type: enum
        source: system
        default: SCHEDULED
        description: "First state dimension. SCHEDULED -> COMPLETED, -> EXCEPTION_RAISED, or -> CANCELLED when the assigned designer is auto-suspended."
        constraints: "one of {SCHEDULED, COMPLETED, EXCEPTION_RAISED, CANCELLED}"
      - name: commissioning_status
        type: enum
        source: system
        description: "Second, independent state dimension. Stamped NOT_REQUIRED at creation when motorized_channel_count == 0, otherwise PENDING; then PENDING|FAILED -> PAIRED -> VERIFIED|FAILED."
        constraints: "one of {NOT_REQUIRED, PENDING, PAIRED, VERIFIED, FAILED}"
      - name: motorized_channel_count
        type: integer
        source: computed
        default: 0
        description: "Count of Opening rows in the order's opening_ids with motorization_option != NONE, frozen at job creation."
      - name: paired_channel_count
        type: integer
        source: system
        default: 0
        description: "Channels the designer reports paired on the most recent pair call."
      - name: hub_platform
        type: enum
        source: system
        default: NONE
        description: "Smart-home hub reported on the most recent pair call; must be in the vendor's supported_hub_platforms."
        constraints: "one of {NONE, ALEXA, GOOGLE_HOME, HOMEKIT, MATTER}"
      - name: commissioning_attempt_count
        type: integer
        source: system
        default: 0
        description: "Number of pair calls made; capped at COMMISSIONING_MAX_ATTEMPTS."
      - name: exception_reason
        type: enum
        source: system
        default: NONE
        description: "Reason recorded by the exception call."
        constraints: "one of {NONE, OUT_OF_SQUARE, OBSTRUCTION, DAMAGED_GOODS}"
      - name: exception_opening_id
        type: string
        source: system
        description: "Id of the Opening named by the exception call; mirrors the opening_id request field and is null before any exception. Not a foreign key for discovery purposes: the affected opening is reachable through GET /blinds/openings?quote_id."
      - name: liable_party
        type: enum
        source: system
        default: NONE
        description: "Output of calculations.install_exception_liability."
        constraints: "one of {NONE, MEASURER, CUSTOMER, VENDOR}"
      - name: remeasure_charge_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.install_exception_liability; 0 unless liable_party == MEASURER."
      - name: exception_raised_at
        type: datetime
        source: system
        description: "Logical-clock instant of the exception call; null otherwise. Windowed by calculations.designer_liability_score."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the complete call; null otherwise."

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: territory_id
        type: string
        source: system
        description: "FK -> Territory.id; the franchise account the entry lands on."
      - name: entry_type
        type: enum
        source: system
        description: "Kind of accrual."
        constraints: "one of {NET_SALES_ROYALTY, ROYALTY_REVERSAL, REMAKE_CHARGEBACK, REMEASURE_CHARGEBACK, SAMPLE_LATE_FEE, SAMPLE_REPLACEMENT}"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount; positive increases what the territory owes, negative reverses a prior accrual. ROYALTY_REVERSAL rows are always negative, every other type is always positive."
      - name: basis_cents
        type: integer
        source: system
        description: "The measured quantity the amount was derived from (net sales for royalty rows, remake cost for chargeback rows, replacement value for sample rows)."
      - name: source_entity_type
        type: enum
        source: system
        description: "Polymorphic discriminator for source_entity_id."
        constraints: "one of {QUOTE, VENDOR_ORDER, INSTALL_JOB, SAMPLE_CHECKOUT}"
      - name: source_entity_id
        type: string
        source: system
        description: "Id of the row named by source_entity_type. Deliberately not declared as a single-parent foreign key because the target entity varies by discriminator."
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant of the triggering transition."
      - name: memo
        type: string
        source: system
        description: "Fixed machine-readable phrase naming the triggering transition, e.g. 'quote_accepted', 'install_trueup', 'remake_replacement', 'remake_full_credit', 'sample_late', 'sample_lost', 'remeasure_chargeback'."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Lead
    initial_state: NEW
    terminal_states: [UNROUTABLE, CONVERTED, LOST]
    transitions:
      - from: NEW
        to: ROUTED
        trigger: "POST /blinds/leads (the create request runs calculations.territory_lead_routing before responding)"
        actor: system
        preconditions:
          - "the candidate set of calculations.territory_lead_routing is non-empty"
        side_effects:
          - "set Lead.territory_id to the winning Territory.id and Lead.routed_at to the logical clock"
          - "increment the winning Territory.open_leads_count by 1 and Territory.version by 1"
        note: "NEW is never observable in a response body; the create response already carries ROUTED, QUEUED or UNROUTABLE."
      - from: NEW
        to: QUEUED
        trigger: "POST /blinds/leads"
        actor: system
        preconditions:
          - "at least one Territory with status == ACTIVE lists Lead.postal_code in postal_codes"
          - "every such Territory has open_leads_count >= lead_capacity_per_week"
        side_effects:
          - "leave Lead.territory_id and Lead.routed_at null"
      - from: NEW
        to: UNROUTABLE
        trigger: "POST /blinds/leads"
        actor: system
        preconditions:
          - "no Territory with status == ACTIVE lists Lead.postal_code in postal_codes"
        side_effects:
          - "leave Lead.territory_id and Lead.routed_at null"
        note: "Terminal. A lead outside every active territory is never revisited."
      - from: QUEUED
        to: ROUTED
        trigger: "system: a Territory's open_leads_count drops below lead_capacity_per_week as a consequence of one of its leads reaching CONVERTED or LOST"
        actor: system
        preconditions:
          - "the freeing Territory.status == ACTIVE"
          - "at least one Lead with status == QUEUED has postal_code IN that Territory.postal_codes"
        side_effects:
          - "promote exactly one lead - the QUEUED lead with the smallest created_at, tie-broken by smallest postal_code then smallest customer_name - by setting its territory_id and routed_at"
          - "increment that Territory.open_leads_count by 1 and Territory.version by 1"
        note: "Exactly one promotion per unit of freed capacity; a second QUEUED lead stays queued."
      - from: ROUTED
        to: CONSULT_COMPLETE
        trigger: "system: the Consultation for this lead reaches COMPLETED"
        actor: system
        preconditions:
          - "Lead.status == ROUTED"
        side_effects:
          - "Territory.open_leads_count is unchanged because CONSULT_COMPLETE is still an open status"
      - from: ROUTED
        to: LOST
        trigger: "system: the Consultation for this lead reaches NO_SHOW"
        actor: system
        preconditions: []
        side_effects:
          - "decrement Territory.open_leads_count by 1 and increment Territory.version by 1"
          - "that decrement itself triggers Lead.QUEUED_to_ROUTED on the same territory"
      - from: CONSULT_COMPLETE
        to: LOST
        trigger: "system: the lead's PRESENTED quote reaches EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "decrement Territory.open_leads_count by 1 and increment Territory.version by 1"
          - "that decrement itself triggers Lead.QUEUED_to_ROUTED on the same territory"
      - from: CONSULT_COMPLETE
        to: CONVERTED
        trigger: "system: a quote for this lead reaches ACCEPTED"
        actor: system
        preconditions: []
        side_effects:
          - "decrement Territory.open_leads_count by 1 and increment Territory.version by 1"
          - "that decrement itself triggers Lead.QUEUED_to_ROUTED on the same territory"
      - from: ROUTED
        to: CONVERTED
        trigger: "system: a quote for this lead reaches ACCEPTED while the consultation is still SCHEDULED"
        actor: system
        preconditions: []
        side_effects:
          - "decrement Territory.open_leads_count by 1 and increment Territory.version by 1"
          - "that decrement itself triggers Lead.QUEUED_to_ROUTED on the same territory"

  - entity: Consultation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /blinds/consultations/{id}/complete"
        actor: Designer
        preconditions:
          - "Consultation.status == SCHEDULED"
          - "the acting Designer id equals Consultation.designer_id"
          - "Consultation.measured_opening_count >= 1"
          - "Consultation.open_sample_loan_count == 0"
        side_effects:
          - "set Consultation.completed_at to the logical clock"
          - "drive Lead.ROUTED_to_CONSULT_COMPLETE on Consultation.lead_id"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /blinds/consultations/{id}/no-show"
        actor: Designer
        preconditions:
          - "Consultation.status == SCHEDULED"
          - "the logical clock is at or after Consultation.scheduled_start_at"
        side_effects:
          - "drive Lead.ROUTED_to_LOST on Consultation.lead_id, which decrements Territory.open_leads_count, which promotes one QUEUED lead"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the assigned Designer is auto-suspended by calculations.designer_liability_score"
        actor: system
        preconditions:
          - "Consultation.status == SCHEDULED"
          - "Consultation.scheduled_start_at is at or after the logical clock"
        side_effects:
          - "release the designer calendar occupation so a replacement booking is accepted"
          - "leave the Lead in its current status; a cancelled appointment does not lose the lead"

  - entity: SampleKit
    initial_state: AVAILABLE
    terminal_states: [LOST]
    transitions:
      - from: AVAILABLE
        to: ON_LOAN
        trigger: "POST /blinds/sample-checkouts"
        actor: Designer
        preconditions:
          - "SampleKit.status == AVAILABLE"
          - "no other SampleCheckout on this kit with status == OPEN has a closed hold interval that collides with the requested one"
        side_effects:
          - "increment SampleKit.loan_count and SampleKit.open_loan_count by 1"
          - "decrement Territory.available_kit_count by 1 and increment Territory.on_loan_kit_count by 1"
      - from: ON_LOAN
        to: AVAILABLE
        trigger: "POST /blinds/sample-checkouts/{id}/return"
        actor: Designer
        preconditions:
          - "SampleKit.status == ON_LOAN"
          - "calculations.sample_late_fee yields days_late <= SAMPLE_LOST_THRESHOLD_DAYS"
        side_effects:
          - "decrement SampleKit.open_loan_count by 1"
          - "increment Territory.available_kit_count by 1 and decrement Territory.on_loan_kit_count by 1, restoring both to their pre-checkout values"
      - from: ON_LOAN
        to: LOST
        trigger: "POST /blinds/sample-checkouts/{id}/return"
        actor: Designer
        preconditions:
          - "SampleKit.status == ON_LOAN"
          - "calculations.sample_late_fee yields days_late > SAMPLE_LOST_THRESHOLD_DAYS"
        side_effects:
          - "decrement SampleKit.open_loan_count by 1"
          - "decrement Territory.on_loan_kit_count by 1 and increment Territory.lost_kit_count by 1, without incrementing Territory.available_kit_count"
          - "append LedgerEntry(entry_type=SAMPLE_REPLACEMENT, amount_cents=SampleKit.replacement_value_cents, basis_cents=SampleKit.replacement_value_cents, source_entity_type=SAMPLE_CHECKOUT, memo='sample_lost')"

  - entity: SampleCheckout
    initial_state: OPEN
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /blinds/sample-checkouts/{id}/return"
        actor: Designer
        preconditions:
          - "SampleCheckout.status == OPEN"
          - "the acting Designer id equals the designer_id of SampleCheckout.consultation_id"
          - "calculations.sample_late_fee yields days_late <= SAMPLE_LOST_THRESHOLD_DAYS"
        side_effects:
          - "set returned_at to the logical clock and store days_late and late_fee_cents"
          - "when late_fee_cents > 0, append LedgerEntry(entry_type=SAMPLE_LATE_FEE, amount_cents=late_fee_cents, basis_cents=SampleKit.replacement_value_cents, source_entity_type=SAMPLE_CHECKOUT, memo='sample_late')"
          - "drive SampleKit.ON_LOAN_to_AVAILABLE"
          - "when days_late > 0, recompute Designer.late_sample_return_count and Designer.remeasure_liability_score for the designer of the consultation, which can drive Designer.ACTIVE_to_SUSPENDED"
      - from: OPEN
        to: LOST
        trigger: "POST /blinds/sample-checkouts/{id}/return"
        actor: Designer
        preconditions:
          - "SampleCheckout.status == OPEN"
          - "calculations.sample_late_fee yields days_late > SAMPLE_LOST_THRESHOLD_DAYS"
        side_effects:
          - "set returned_at, days_late and late_fee_cents = SampleKit.replacement_value_cents"
          - "drive SampleKit.ON_LOAN_to_LOST"
          - "recompute Designer.late_sample_return_count and Designer.remeasure_liability_score"

  - entity: Opening
    initial_state: MEASURED
    terminal_states: [REMEASURE_REQUIRED]
    transitions:
      - from: MEASURED
        to: CONFIGURED
        trigger: "PATCH /blinds/openings/{id}/configuration"
        actor: Designer
        preconditions:
          - "Opening.measure_status == MEASURED"
          - "the parent Consultation.status == SCHEDULED"
        side_effects:
          - "store fabric_code, lift_system and motorization_option"
          - "run calculations.opening_list_price and store billable_sqft and list_price_cents"
          - "increment the parent Consultation.configured_opening_count and Consultation.version by 1"
      - from: CONFIGURED
        to: CONFIGURED
        trigger: "PATCH /blinds/openings/{id}/configuration"
        actor: Designer
        preconditions:
          - "Opening.measure_status == CONFIGURED"
          - "the parent Consultation.status == SCHEDULED"
        side_effects:
          - "overwrite fabric_code, lift_system and motorization_option and re-run calculations.opening_list_price"
          - "increment the parent Consultation.version by 1"
        note: "Re-configuration is unrestricted until the opening is attached to a quote; the cordless requirement is a point-of-sale gate, not a configuration gate."
      - from: CONFIGURED
        to: QUOTED
        trigger: "POST /blinds/quotes"
        actor: system
        preconditions:
          - "Opening.measure_status == CONFIGURED"
          - "Opening.consultation_id equals the new quote's consultation_id"
        side_effects:
          - "set Opening.quote_id to the new quote id"
      - from: QUOTED
        to: CONFIGURED
        trigger: "system: the quote holding this opening reaches SUPERSEDED"
        actor: system
        preconditions: []
        side_effects:
          - "clear Opening.quote_id to null so the opening can be attached to the superseding quote"
      - from: QUOTED
        to: REMEASURE_REQUIRED
        trigger: "system: POST /blinds/install-jobs/{id}/exception names this opening"
        actor: system
        preconditions:
          - "Opening.measure_status == QUOTED"
          - "Opening.install_outcome == PENDING"
        side_effects:
          - "set Opening.install_outcome = NOT_INSTALLED"
          - "that NOT_INSTALLED outcome itself drives VendorOrder.RECEIVED_to_REMAKE_REQUESTED on the order carrying this opening"
        note: "Terminal for this row. The corrective measurement is a new Opening whose replaces_opening_id points here."

  - entity: Designer
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: calculations.designer_liability_score is recomputed and yields a score strictly below SUSPENSION_THRESHOLD"
        actor: system
        preconditions:
          - "Designer.status == ACTIVE"
        side_effects:
          - "drive Consultation.SCHEDULED_to_CANCELLED for every Consultation with designer_id == this.id, status == SCHEDULED and scheduled_start_at at or after the logical clock"
          - "drive InstallJob.SCHEDULED_to_CANCELLED for every InstallJob with designer_id == this.id, install_status == SCHEDULED and scheduled_start_at at or after the logical clock"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /blinds/designers/{id} with status ACTIVE"
        actor: Franchisee
        preconditions:
          - "Designer.status == SUSPENDED"
        side_effects:
          - "leave remeasure_liability_score untouched; reinstatement is a deliberate franchisee override and does not re-evaluate the score"
        note: "Suspension is sticky: a score that recovers on its own never reinstates the designer."
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /blinds/designers/{id} with status INACTIVE"
        actor: Franchisee
        preconditions:
          - "Designer.status == ACTIVE"
        side_effects:
          - "drive Consultation.SCHEDULED_to_CANCELLED and InstallJob.SCHEDULED_to_CANCELLED exactly as the suspension cascade does"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /blinds/quotes/{id}/present"
        actor: Designer
        preconditions:
          - "Quote.status == DRAFT"
          - "Quote.opening_count >= 1"
          - "every attached Opening has non-null fabric_code and lift_system"
          - "every attached Opening satisfies the cordless requirement of validations[priority=20]"
        side_effects:
          - "run calculations.quote_totals and store subtotal_cents, install_fee_cents, pre_discount_total_cents, discount_pct, discount_cents, total_cents and net_sales_cents"
          - "set presented_at to the logical clock and expires_at to presented_at + QUOTE_VALIDITY_DAYS"
      - from: PRESENTED
        to: DRAFT
        trigger: "POST /blinds/quotes/{id}/revise"
        actor: Designer
        preconditions:
          - "Quote.status == PRESENTED"
          - "the logical clock is strictly before Quote.expires_at"
          - "Quote.revision_count < QUOTE_MAX_REVISIONS"
        side_effects:
          - "increment Quote.revision_count by 1"
          - "clear Quote.expires_at to null while leaving presented_at at its previous value"
        note: "This is the revision cycle: PRESENTED -> DRAFT -> PRESENTED is legal up to QUOTE_MAX_REVISIONS round trips."
      - from: PRESENTED
        to: ACCEPTED
        trigger: "POST /blinds/quotes/{id}/accept"
        actor: Designer
        preconditions:
          - "Quote.status == PRESENTED"
          - "the logical clock is strictly before Quote.expires_at"
          - "the owning Territory.status == ACTIVE"
          - "every attached Opening satisfies the cordless requirement of validations[priority=20]"
        side_effects:
          - "set accepted_at to the logical clock"
          - "run the provisional variant of calculations.royalty_accrual: set Quote.recognized_net_sales_cents = Quote.net_sales_cents, add it to Territory.net_sales_cents, and append LedgerEntry(entry_type=NET_SALES_ROYALTY, source_entity_type=QUOTE, memo='quote_accepted') whose amount_cents raises Territory.royalty_accrued_cents"
          - "drive Lead.CONSULT_COMPLETE_to_CONVERTED (or Lead.ROUTED_to_CONVERTED), which decrements Territory.open_leads_count, which promotes one QUEUED lead"
      - from: PRESENTED
        to: EXPIRED
        trigger: "system: POST /blinds/quotes/{id}/present, /revise or /accept, or POST /blinds/vendor-orders naming this quote, evaluated at a logical clock at or after Quote.expires_at"
        actor: system
        preconditions:
          - "Quote.status == PRESENTED"
          - "the logical clock is at or after Quote.expires_at"
        side_effects:
          - "flip Quote.status to EXPIRED and reject the triggering request with ERR_QUOTE_EXPIRED; the state change is persisted even though the request fails"
          - "drive Lead.CONSULT_COMPLETE_to_LOST, which decrements Territory.open_leads_count, which promotes one QUEUED lead"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /blinds/quotes creates a newer quote for the same consultation_id"
        actor: system
        preconditions:
          - "Quote.status == DRAFT"
        side_effects:
          - "drive Opening.QUOTED_to_CONFIGURED for every Opening with quote_id == this.id so the openings re-attach to the superseding quote"
      - from: PRESENTED
        to: SUPERSEDED
        trigger: "system: POST /blinds/quotes creates a newer quote for the same consultation_id"
        actor: system
        preconditions:
          - "Quote.status == PRESENTED"
          - "the logical clock is strictly before Quote.expires_at"
        side_effects:
          - "drive Opening.QUOTED_to_CONFIGURED for every Opening with quote_id == this.id"
          - "clear expires_at to null"
        note: "This legitimate supersession is why quote creation is the OCC write in §1.2.1: a second create observing a stale Consultation.version would silently discard a presented price."

  - entity: VendorOrder
    initial_state: PLACED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLACED
        to: SHIPPED
        trigger: "POST /blinds/vendor-orders/{id}/ship"
        actor: VendorRep
        preconditions:
          - "VendorOrder.status == PLACED"
          - "the acting VendorRep id equals VendorOrder.vendor_id"
        side_effects:
          - "set shipped_at to the logical clock"
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /blinds/vendor-orders/{id}/receive"
        actor: Franchisee
        preconditions:
          - "VendorOrder.status == SHIPPED"
        side_effects:
          - "set received_at to the logical clock"
          - "decrement Vendor.open_order_count by 1 and Territory.open_order_exposure_cents by order_cost_cents"
      - from: RECEIVED
        to: REMAKE_REQUESTED
        trigger: "POST /blinds/vendor-orders/{id}/remake with credit_scope REPLACEMENT, or system: an Opening on this order reaches NOT_INSTALLED via an install exception"
        actor: Franchisee
        preconditions:
          - "VendorOrder.status == RECEIVED"
          - "VendorOrder.remake_count < ORDER_MAX_REMAKES"
          - "Vendor.remake_policy != NO_REMAKE"
          - "when Vendor.remake_policy == FULL_VENDOR_90D, the logical clock is at most VENDOR_REMAKE_WINDOW_DAYS after received_at"
        side_effects:
          - "set credit_scope = REPLACEMENT and increment remake_count by 1"
          - "run calculations.remake_chargeback_waterfall and store remake_cost_cents, vendor_absorbed_cents, territory_absorbed_cents and customer_absorbed_cents"
          - "when territory_absorbed_cents > 0, append LedgerEntry(entry_type=REMAKE_CHARGEBACK, amount_cents=territory_absorbed_cents, basis_cents=remake_cost_cents, source_entity_type=VENDOR_ORDER, memo='remake_replacement') and add it to Territory.remake_chargeback_cents"
      - from: REMAKE_REQUESTED
        to: PLACED
        trigger: "system: the same request that recorded the replacement remake immediately re-places the order"
        actor: system
        preconditions:
          - "VendorOrder.status == REMAKE_REQUESTED"
          - "VendorOrder.credit_scope == REPLACEMENT"
        side_effects:
          - "set placed_at to the logical clock, clear shipped_at and received_at to null"
          - "re-run calculations.vendor_lead_time, which now applies REMAKE_EXPEDITE_DAYS, and store the new effective_placement_date, lead_time_days and promised_ship_date"
          - "increment Vendor.open_order_count by 1 and Territory.open_order_exposure_cents by order_cost_cents"
        note: "This closes the remake cycle: the observable status after POST /remake with REPLACEMENT is PLACED with remake_count incremented."
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /blinds/vendor-orders/{id}/remake with credit_scope FULL_CREDIT"
        actor: Franchisee
        preconditions:
          - "VendorOrder.status == RECEIVED"
          - "Vendor.remake_policy != NO_REMAKE"
          - "when Vendor.remake_policy == FULL_VENDOR_90D, the logical clock is at most VENDOR_REMAKE_WINDOW_DAYS after received_at"
          - "every Opening in opening_ids has install_outcome == PENDING"
        side_effects:
          - "set credit_scope = FULL_CREDIT and run calculations.remake_chargeback_waterfall exactly as the replacement path does"
          - "set Opening.credited = true for every Opening in opening_ids"
          - "run the credit branch of calculations.royalty_accrual: add the credited net sales to Quote.credited_net_sales_cents, subtract it from Quote.recognized_net_sales_cents and from Territory.net_sales_cents, and append LedgerEntry(entry_type=ROYALTY_REVERSAL, amount_cents = the negative of the royalty on the credited net sales, source_entity_type=VENDOR_ORDER, memo='remake_full_credit') which lowers Territory.royalty_accrued_cents"
        note: "Terminal. A full credit is the compensating action of quote acceptance and must restore Territory.royalty_accrued_cents exactly."

  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, EXCEPTION_RAISED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /blinds/install-jobs/{id}/complete"
        actor: Designer
        preconditions:
          - "InstallJob.install_status == SCHEDULED"
          - "the acting Designer id equals InstallJob.designer_id"
          - "InstallJob.commissioning_status IN {NOT_REQUIRED, VERIFIED}"
          - "the referenced VendorOrder.status == RECEIVED"
        side_effects:
          - "set completed_at to the logical clock"
          - "set install_outcome = INSTALLED on every Opening in the order's opening_ids whose install_outcome is PENDING"
          - "run the final variant of calculations.royalty_accrual on the quote and post the delta as LedgerEntry(entry_type=NET_SALES_ROYALTY or ROYALTY_REVERSAL, source_entity_type=INSTALL_JOB, memo='install_trueup'), adjusting Territory.royalty_accrued_cents, Territory.net_sales_cents and Quote.recognized_net_sales_cents"
          - "recompute Designer.clean_install_count and Designer.remeasure_liability_score"
        note: "This is the join point of the two state dimensions: install_status cannot advance while commissioning_status is PENDING, PAIRED or FAILED."
      - from: SCHEDULED
        to: EXCEPTION_RAISED
        trigger: "POST /blinds/install-jobs/{id}/exception"
        actor: Designer
        preconditions:
          - "InstallJob.install_status == SCHEDULED"
          - "the acting Designer id equals InstallJob.designer_id"
          - "the request's opening_id is in the referenced VendorOrder.opening_ids and has install_outcome == PENDING"
        side_effects:
          - "store exception_reason, exception_opening_id and exception_raised_at, then run calculations.install_exception_liability and store liable_party and remeasure_charge_cents"
          - "when liable_party == MEASURER, append LedgerEntry(entry_type=REMEASURE_CHARGEBACK, amount_cents=remeasure_charge_cents, basis_cents=the named opening's list_price_cents, source_entity_type=INSTALL_JOB, memo='remeasure_chargeback') and add it to Territory.remake_chargeback_cents"
          - "drive Opening.QUOTED_to_REMEASURE_REQUIRED on the named opening (hop 1)"
          - "that opening reaching NOT_INSTALLED drives VendorOrder.RECEIVED_to_REMAKE_REQUESTED and then VendorOrder.REMAKE_REQUESTED_to_PLACED on the order carrying it (hop 2)"
          - "when liable_party == MEASURER, the REMEASURE_CHARGEBACK row raises Designer.remeasure_exception_count, which forces a recompute of Designer.remeasure_liability_score (hop 3)"
          - "a recomputed score strictly below SUSPENSION_THRESHOLD drives Designer.ACTIVE_to_SUSPENDED, which cancels that designer's other future consultations and install jobs (hop 4)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the assigned Designer is suspended or deactivated"
        actor: system
        preconditions:
          - "InstallJob.install_status == SCHEDULED"
          - "InstallJob.scheduled_start_at is at or after the logical clock"
        side_effects:
          - "release the designer calendar occupation"
          - "leave the referenced VendorOrder in RECEIVED so a replacement job can be scheduled"

  - entity: InstallJob.commissioning_status
    initial_state: PENDING
    terminal_states: [NOT_REQUIRED, VERIFIED]
    transitions:
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "POST /blinds/install-jobs (stamped at creation)"
        actor: system
        preconditions:
          - "the computed motorized_channel_count == 0"
        side_effects:
          - "stamp commissioning_status = NOT_REQUIRED so the COMPLETE guard is satisfied immediately"
        note: "This second dimension is independent of install_status: a NOT_REQUIRED job is created already satisfying the join guard, while install_status is still SCHEDULED."
      - from: PENDING
        to: PAIRED
        trigger: "POST /blinds/install-jobs/{id}/commissioning/pair"
        actor: Designer
        preconditions:
          - "InstallJob.commissioning_status == PENDING"
          - "InstallJob.install_status == SCHEDULED"
          - "the acting Designer holds MOTORIZATION in certifications"
          - "the requested hub_platform is in the order's Vendor.supported_hub_platforms"
          - "the requested paired_channel_count is between 0 and motorized_channel_count inclusive"
          - "InstallJob.commissioning_attempt_count < COMMISSIONING_MAX_ATTEMPTS"
        side_effects:
          - "store hub_platform and paired_channel_count and increment commissioning_attempt_count by 1"
      - from: FAILED
        to: PAIRED
        trigger: "POST /blinds/install-jobs/{id}/commissioning/pair"
        actor: Designer
        preconditions:
          - "InstallJob.commissioning_status == FAILED"
          - "InstallJob.install_status == SCHEDULED"
          - "InstallJob.commissioning_attempt_count < COMMISSIONING_MAX_ATTEMPTS"
        side_effects:
          - "overwrite hub_platform and paired_channel_count and increment commissioning_attempt_count by 1"
        note: "This is the commissioning retry cycle on the second dimension: PAIRED -> FAILED -> PAIRED, bounded by COMMISSIONING_MAX_ATTEMPTS."
      - from: PAIRED
        to: VERIFIED
        trigger: "POST /blinds/install-jobs/{id}/commissioning/verify"
        actor: Designer
        preconditions:
          - "InstallJob.commissioning_status == PAIRED"
          - "InstallJob.paired_channel_count == InstallJob.motorized_channel_count"
        side_effects:
          - "satisfy the COMPLETE guard of the install_status dimension without changing install_status"
      - from: PAIRED
        to: FAILED
        trigger: "POST /blinds/install-jobs/{id}/commissioning/verify"
        actor: Designer
        preconditions:
          - "InstallJob.commissioning_status == PAIRED"
          - "InstallJob.paired_channel_count < InstallJob.motorized_channel_count"
        side_effects:
          - "record the shortfall; the call returns 200 with the FAILED state rather than an error, because a failed verification is a recorded field observation"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =====================================================================
concurrency_rules:
  - rule_id: quote-create-stale-consultation
    parent_entity: Consultation
    write_endpoint: "POST /blinds/quotes"
    occ_field: "expected_consultation_version"
    description: |
      Creating a Quote against a Consultation whose version has advanced since the
      client last read it is rejected. Quote creation legitimately supersedes any
      earlier DRAFT or PRESENTED quote on the same consultation and re-attaches its
      openings, so a create built on a stale view of the consultation would silently
      discard a price the homeowner has already seen, or attach an opening set the
      writer never observed. The stale-version check makes the writer re-read the
      consultation first. Every opening create and every configuration patch bumps
      Consultation.version, so the value must be read back immediately before the
      create.
    error_id: ERR_STALE_CONSULTATION_VERSION
    http_status: 412

  - rule_id: vendor-order-create-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /blinds/vendor-orders"
    occ_field: "expected_quote_version"
    description: |
      Placing a VendorOrder against a Quote whose version has advanced since the
      client last read it is rejected. An accepted quote may legitimately be split
      across several vendor orders, so a second placement is a normal operation
      rather than a duplicate; it is refused only because the writer's view of which
      openings are still unplaced is out of date. Each successful placement bumps
      Quote.version, so the second placement must carry the version read after the
      first one landed.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: opening_finished_dimensions
    trigger: "POST /blinds/openings (on the create request, before the row is persisted)"
    algorithm: constraint_propagation
    formula: |
      narrowest_width_in = min(width_top_in, width_middle_in, width_bottom_in)
      widest_width_in    = max(width_top_in, width_middle_in, width_bottom_in)
      shortest_height_in = min(height_left_in, height_center_in, height_right_in)
      tallest_height_in  = max(height_left_in, height_center_in, height_right_in)

      out_of_square_in = round_half_up(
          max(widest_width_in - narrowest_width_in,
              tallest_height_in - shortest_height_in), 3)

      IF mount_type == INSIDE:
          raw_width_in  = narrowest_width_in - INSIDE_WIDTH_DEDUCTION_IN
          raw_height_in = shortest_height_in - INSIDE_HEIGHT_DEDUCTION_IN
          # an inside mount must never bind, so both dimensions round DOWN
          ordered_width_in  = floor(raw_width_in  * 8) / 8
          ordered_height_in = floor(raw_height_in * 8) / 8
      ELSE:   # mount_type == OUTSIDE
          raw_width_in  = widest_width_in + 2 * OUTSIDE_WIDTH_OVERLAP_IN
          raw_height_in = tallest_height_in + OUTSIDE_HEIGHT_HEADER_IN + OUTSIDE_HEIGHT_SILL_OVERLAP_IN
          # an outside mount must always cover, so both dimensions round UP
          ordered_width_in  = ceil(raw_width_in  * 8) / 8
          ordered_height_in = ceil(raw_height_in * 8) / 8
    input_set: |
      The six wall readings and depth_in supplied on the create request for this one
      Opening. No other Opening, and no prior measurement, participates - a re-measure
      opening created with replaces_opening_id recomputes from its own readings only.
    constants:
      INSIDE_WIDTH_DEDUCTION_IN: 0.500
      INSIDE_HEIGHT_DEDUCTION_IN: 0.250
      OUTSIDE_WIDTH_OVERLAP_IN: 1.500
      OUTSIDE_HEIGHT_HEADER_IN: 3.000
      OUTSIDE_HEIGHT_SILL_OVERLAP_IN: 1.500
    precision: "inches to 3 decimal places for out_of_square_in; ordered dimensions are exact multiples of 0.125 with the rounding DIRECTION selected by mount_type (floor for INSIDE, ceil for OUTSIDE)"
    variants: []

  - name: opening_list_price
    trigger: "PATCH /blinds/openings/{id}/configuration (both the MEASURED_to_CONFIGURED and the CONFIGURED_to_CONFIGURED transition)"
    algorithm: tiered_pricing
    formula: |
      billable_width_in  = max(ordered_width_in,  MIN_BILLABLE_WIDTH_IN)
      billable_height_in = max(ordered_height_in, MIN_BILLABLE_HEIGHT_IN)
      raw_sqft = (billable_width_in * billable_height_in) / 144
      billable_sqft = ceil(raw_sqft * 4) / 4              # quarter-sqft billing unit

      base_cents = round_half_up(billable_sqft * FABRIC_RATE_CENTS_PER_SQFT[fabric_code])   # ROUNDING STEP 1
      subtotal_before_surcharge_cents =
            base_cents
          + LIFT_UPLIFT_CENTS[lift_system]
          + MOTOR_PRICE_CENTS[motorization_option]

      oversize_pct = OVERSIZE_SURCHARGE_PCT if billable_width_in > OVERSIZE_WIDTH_IN else 0
      surcharge_cents = round_half_up(subtotal_before_surcharge_cents * oversize_pct)       # ROUNDING STEP 2
      list_price_cents = subtotal_before_surcharge_cents + surcharge_cents
    input_set: |
      Exactly one Opening row and its own configuration fields. billable_sqft is
      ceiled to the quarter square foot PER OPENING and base_cents is rounded PER
      OPENING; Quote.subtotal_cents then sums those already-rounded integers.
      Summing raw_sqft across a consultation's openings and ceiling once, or summing
      un-rounded base amounts and rounding once at the quote level, is FORBIDDEN and
      yields a different subtotal: three identical openings whose raw_sqft is
      6.017795 each price at 5875 cents apiece for a subtotal of 17625, whereas the
      forbidden sum-then-round order gives 18.25 sqft and 17155.
    constants:
      MIN_BILLABLE_WIDTH_IN: 12.000
      MIN_BILLABLE_HEIGHT_IN: 12.000
      OVERSIZE_WIDTH_IN: 72.000
      OVERSIZE_SURCHARGE_PCT: 0.15
      FABRIC_RATE_CENTS_PER_SQFT: { "LT-SHEER": 620, "CL-LINEN": 940, "BO-THERMAL": 1280, "WD-FAUX": 1550 }
      LIFT_UPLIFT_CENTS: { CORDED: 0, CORDLESS: 1800, CONTINUOUS_LOOP: 2600, MOTORIZED: 0 }
      MOTOR_PRICE_CENTS: { NONE: 0, BATTERY: 12500, HARDWIRED: 19500 }
    precision: |
      Integer cents, round_half_up, applied exactly twice and in this order:
      (1) base_cents from billable_sqft x fabric rate, (2) surcharge_cents from the
      already-summed subtotal_before_surcharge_cents. The surcharge is computed on
      the fabric+lift+motor sum, never on base_cents alone.
    variants: []

  - name: quote_totals
    trigger: "POST /blinds/quotes/{id}/present (the DRAFT_to_PRESENTED transition)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned because the discount tier and the discount base
      # are keyed on DIFFERENT quantities, which reads as a circular dependency
      # (total needs the discount, the discount tier needs a total that includes the
      # discount-exempt install fee). Steps run exactly 1..6, once each.

      # step 1
      subtotal_cents = sum(Opening.list_price_cents for Opening where quote_id == Quote.id)
      # step 2
      install_fee_cents = INSTALL_BASE_FEE_CENTS
                        + INSTALL_PER_OPENING_CENTS * opening_count
                        + MOTOR_COMMISSIONING_FEE_CENTS * motorized_opening_count
      # step 3
      pre_discount_total_cents = subtotal_cents + install_fee_cents
      # step 4 - the TIER is selected from pre_discount_total_cents
      discount_pct = 0.12 if pre_discount_total_cents >= 500000
                else 0.08 if pre_discount_total_cents >= 250000
                else 0.05 if pre_discount_total_cents >= 100000
                else 0
      # step 5 - the BASE is subtotal_cents only; install labour is discount-exempt
      discount_cents = round_half_up(subtotal_cents * discount_pct)
      # step 6
      total_cents = pre_discount_total_cents - discount_cents
      net_sales_cents = subtotal_cents - discount_cents
    input_set: |
      Every Opening row with quote_id == this quote's id, whatever its
      install_outcome. opening_count and motorized_opening_count are the counts of
      that same set. Openings still CONFIGURED on the consultation but not attached
      to this quote are excluded.
    constants:
      INSTALL_BASE_FEE_CENTS: 7500
      INSTALL_PER_OPENING_CENTS: 2500
      MOTOR_COMMISSIONING_FEE_CENTS: 4500
      DISCOUNT_TIER_1_MIN_CENTS: 100000
      DISCOUNT_TIER_1_PCT: 0.05
      DISCOUNT_TIER_2_MIN_CENTS: 250000
      DISCOUNT_TIER_2_PCT: 0.08
      DISCOUNT_TIER_3_MIN_CENTS: 500000
      DISCOUNT_TIER_3_PCT: 0.12
    precision: |
      Integer cents, round_half_up, exactly one rounding step (step 5). Tier
      comparisons use >= against pre_discount_total_cents. Selecting the tier from
      subtotal_cents, or applying discount_pct to pre_discount_total_cents, are both
      FORBIDDEN: for subtotal 99925 and install fee 19500 the pinned order yields
      discount_pct 0.05 and discount_cents 4996, while tier-on-subtotal yields 0 and
      base-on-pre_discount_total yields 5971.
    variants: []

  - name: quote_expiry_window
    trigger: "POST /blinds/quotes/{id}/present (stamping) and every subsequent read of Quote.status"
    algorithm: threshold
    formula: |
      presented_at = logical clock at the moment of presentation
      expires_at   = presented_at + QUOTE_VALIDITY_DAYS days (exact instant arithmetic, no truncation to midnight)

      A quote is still live iff logical_clock < expires_at  (STRICT).
      At logical_clock == expires_at the quote is already expired: any of
      /present, /revise, /accept, or a POST /blinds/vendor-orders naming it,
      first flips Quote.status to EXPIRED (persisted) and then fails with
      ERR_QUOTE_EXPIRED.
      POST /blinds/quotes/{id}/revise clears expires_at to null; the next
      presentation re-stamps both presented_at and expires_at from the clock at
      that later moment, so the window restarts rather than continuing.
    input_set: "The single Quote row and the logical clock."
    constants:
      QUOTE_VALIDITY_DAYS: 14
    precision: "Instant comparison at millisecond resolution; the boundary is closed on the expired side (>= expires_at is expired)."
    variants: []

  - name: royalty_accrual
    trigger: "POST /blinds/quotes/{id}/accept (provisional), POST /blinds/install-jobs/{id}/complete (final), POST /blinds/vendor-orders/{id}/remake with credit_scope FULL_CREDIT (credit branch)"
    algorithm: aggregation
    formula: |
      # Common helper. rate = the owning Territory.royalty_rate_pct.
      royalty_of(basis_cents) = round_half_up(basis_cents * rate)

      # --- variant `provisional` (quote acceptance) -------------------------
      recognized_basis_cents = Quote.net_sales_cents
            # = subtotal_cents - discount_cents over EVERY attached opening,
            #   whatever its install_outcome
      posted_cents = royalty_of(recognized_basis_cents) - royalty_of(0)
                   = royalty_of(recognized_basis_cents)
      Quote.recognized_net_sales_cents = recognized_basis_cents
      Territory.net_sales_cents       += recognized_basis_cents
      LedgerEntry(NET_SALES_ROYALTY, amount_cents = posted_cents,
                  basis_cents = recognized_basis_cents, memo='quote_accepted')

      # --- variant `final` (install completion true-up) --------------------
      installed_subtotal_cents = sum(Opening.list_price_cents
                                     for Opening where quote_id == Quote.id
                                     and install_outcome == INSTALLED
                                     and credited == false)
      final_discount_cents = round_half_up(installed_subtotal_cents * Quote.discount_pct)
      final_basis_cents    = installed_subtotal_cents - final_discount_cents
      delta_royalty_cents  = royalty_of(final_basis_cents)
                           - royalty_of(Quote.recognized_net_sales_cents)
      Territory.net_sales_cents += (final_basis_cents - Quote.recognized_net_sales_cents)
      Quote.recognized_net_sales_cents = final_basis_cents
      IF delta_royalty_cents > 0: LedgerEntry(NET_SALES_ROYALTY, amount_cents = delta_royalty_cents, memo='install_trueup')
      IF delta_royalty_cents < 0: LedgerEntry(ROYALTY_REVERSAL,  amount_cents = delta_royalty_cents, memo='install_trueup')
      IF delta_royalty_cents == 0: NO LedgerEntry row is written at all

      # --- credit branch (FULL_CREDIT remake) ------------------------------
      credited_subtotal_cents = sum(Opening.list_price_cents for Opening in VendorOrder.opening_ids)
      credited_discount_cents = round_half_up(credited_subtotal_cents * Quote.discount_pct)
      credited_basis_cents    = credited_subtotal_cents - credited_discount_cents
      new_recognized_cents    = Quote.recognized_net_sales_cents - credited_basis_cents
      posted_cents            = royalty_of(new_recognized_cents)
                              - royalty_of(Quote.recognized_net_sales_cents)   # negative
      Quote.credited_net_sales_cents  += credited_basis_cents
      Quote.recognized_net_sales_cents = new_recognized_cents
      Territory.net_sales_cents       -= credited_basis_cents
      LedgerEntry(ROYALTY_REVERSAL, amount_cents = posted_cents,
                  basis_cents = credited_basis_cents, memo='remake_full_credit')
    input_set: |
      The attached Opening rows of one Quote. The `provisional` variant reads all of
      them; the `final` variant reads only those with install_outcome == INSTALLED and
      credited == false; the credit branch reads only the openings on the cancelled
      VendorOrder. Openings left NOT_INSTALLED by an install exception drop out of the
      final basis, which is what makes the two variants diverge.
    constants:
      ROUNDING: round_half_up
    precision: |
      Integer cents. Royalty is ALWAYS re-derived from the full basis and posted as a
      difference of two independently rounded royalty figures, never by rounding the
      delta of the bases. Because every posting is such a difference,
      Territory.royalty_accrued_cents is exactly the signed sum of the territory's
      NET_SALES_ROYALTY and ROYALTY_REVERSAL rows and returns to its pre-acceptance
      value when a quote's whole opening set is fully credited.
    variants:
      - name: provisional
        when: "the PRESENTED -> ACCEPTED transition"
        difference: "Basis is every attached opening at its configured list price; install outcomes are not yet known and are ignored."
      - name: final
        when: "the InstallJob SCHEDULED -> COMPLETED transition"
        difference: "Basis is restricted to openings actually INSTALLED and not credited; the difference against the provisional figure is posted as a signed true-up row, and no row at all is written when the two agree."

  - name: designer_liability_score
    trigger: "recomputed by SampleCheckout OPEN -> RETURNED/LOST, InstallJob SCHEDULED -> EXCEPTION_RAISED, and InstallJob SCHEDULED -> COMPLETED"
    algorithm: decay_function
    formula: |
      # window_start depends on the owning Territory.liability_window
      IF Territory.liability_window == ROLLING_180D:
          window_start = logical_clock - LIABILITY_WINDOW_DAYS days   # half-open [window_start, clock]
          a row counts iff its stamp >= window_start
      ELSE:  # LIFETIME
          every row counts, however old

      remeasure_exception_count = |{InstallJob : designer_id == D.id
                                     and install_status == EXCEPTION_RAISED
                                     and liable_party == MEASURER
                                     and exception_raised_at counts}|
      late_sample_return_count  = |{SampleCheckout : its consultation's designer_id == D.id
                                     and days_late > 0
                                     and returned_at counts}|
      clean_install_count       = |{InstallJob : designer_id == D.id
                                     and install_status == COMPLETED
                                     and exception_reason == NONE
                                     and completed_at counts}|

      raw_score = BASE_SCORE
                - REMEASURE_PENALTY   * remeasure_exception_count
                - LATE_SAMPLE_PENALTY * late_sample_return_count
                + CLEAN_INSTALL_CREDIT * clean_install_count
      remeasure_liability_score = min(BASE_SCORE, max(0, raw_score))   # clamped both ends

      Designer.ACTIVE -> SUSPENDED fires iff remeasure_liability_score < SUSPENSION_THRESHOLD
      (STRICTLY below; a score exactly equal to SUSPENSION_THRESHOLD does not suspend).
    input_set: |
      Only rows belonging to this one Designer, and only those whose stamp falls in the
      window selected by the designer's territory. The counts are re-derived from
      scratch on every recompute; they are never incremented in place, so a row ageing
      out of a ROLLING_180D window silently raises the score on the next recompute.
    constants:
      BASE_SCORE: 100
      REMEASURE_PENALTY: 22
      LATE_SAMPLE_PENALTY: 9
      CLEAN_INSTALL_CREDIT: 3
      SUSPENSION_THRESHOLD: 80
      LIABILITY_WINDOW_DAYS: 180
    precision: |
      All terms are integers, so the score is exact with no rounding. Worked boundary:
      one MEASURER exception alone gives 100 - 22 = 78 < 80 and suspends; the same
      exception with one prior clean install gives 78 + 3 = 81 >= 80 and does not.
    variants:
      - name: ROLLING_180D
        when: "Territory.liability_window == ROLLING_180D"
        difference: "Only rows stamped at or after logical_clock - 180 days are counted, so old incidents stop weighing on the score."
      - name: LIFETIME
        when: "Territory.liability_window == LIFETIME"
        difference: "Every row counts forever. Three late sample returns two of which are older than 180 days score 100 - 27 = 73 and suspend the designer, where ROLLING_180D scores 100 - 9 = 91 and does not."

  - name: vendor_order_cost
    trigger: "POST /blinds/vendor-orders and the REMAKE_REQUESTED -> PLACED re-placement"
    algorithm: aggregation
    formula: |
      included_list_price_cents = sum(Opening.list_price_cents for Opening in opening_ids)
      order_cost_cents = round_half_up(included_list_price_cents * VENDOR_COST_PCT)
    input_set: |
      Exactly the Opening rows named in VendorOrder.opening_ids. Deliberately asymmetric
      with calculations.opening_list_price: the wholesale cost rounds ONCE over the
      summed retail prices, whereas retail pricing rounds once PER opening. Rounding
      each opening's wholesale share separately and summing is FORBIDDEN: three openings
      at 5875 cents each give 7403 cents wholesale under the pinned order (17625 x 0.42
      = 7402.5, rounded half up once) and 7404 under the forbidden one (2467.5 rounded
      to 2468 three times).
    constants:
      VENDOR_COST_PCT: 0.42
    precision: "Integer cents, round_half_up, exactly one rounding step applied to the summed retail figure."
    variants: []

  - name: vendor_lead_time
    trigger: "POST /blinds/vendor-orders (initial placement) and the VendorOrder REMAKE_REQUESTED -> PLACED re-placement"
    algorithm: threshold
    formula: |
      # 1. cutoff roll - hour comparison is >= against the vendor's cutoff
      placement_hour_utc = hour component of placed_at in UTC
      IF placement_hour_utc < Vendor.cutoff_hour_utc:
          effective_placement_date = calendar date of placed_at in UTC
      ELSE:
          effective_placement_date = calendar date of placed_at in UTC + 1 day

      # 2. adders
      motorized = any Opening in opening_ids has motorization_option != NONE
      raw_days = Vendor.base_lead_time_days
               + (Vendor.motorization_extra_days if motorized else 0)

      # 3. remake expedite, then the floor
      IF VendorOrder.remake_count > 0:
          raw_days = raw_days - REMAKE_EXPEDITE_DAYS
      lead_time_days = max(raw_days, MIN_LEAD_TIME_DAYS)

      # 4.
      promised_ship_date = effective_placement_date + lead_time_days days
    input_set: |
      The one VendorOrder being placed, its vendor's parameters and the motorization
      flags of its own openings. No other order participates; the promised date is
      never pushed out by the vendor's existing backlog - backlog is handled by the
      separate capacity validation, which rejects rather than delays.
    constants:
      REMAKE_EXPEDITE_DAYS: 4
      MIN_LEAD_TIME_DAYS: 5
    precision: |
      Whole days on whole UTC calendar dates, YYYY-MM-DD. Date arithmetic ignores
      weekends and holidays. Boundary: a vendor with cutoff_hour_utc 15 placed at
      14:59:59.999Z keeps the same effective_placement_date; placed at 15:00:00.000Z
      it rolls to the next day. Floor boundary: base 8 with no motor adder expedites
      to 8 - 4 = 4 which floors to 5, while base 9 expedites to exactly 5.
    variants:
      - name: initial
        when: "VendorOrder.remake_count == 0"
        difference: "No expedite subtraction; lead_time_days is the base plus the motorization adder."
      - name: remake_expedited
        when: "VendorOrder.remake_count >= 1 (the re-placement inside a REPLACEMENT remake)"
        difference: "REMAKE_EXPEDITE_DAYS is subtracted before the MIN_LEAD_TIME_DAYS floor, and the cutoff roll is re-evaluated against the NEW placed_at, so a remake can land on a later effective_placement_date and still promise an earlier ship date."

  - name: vendor_routing_selector
    trigger: "POST /blinds/vendor-orders when preferred_vendor_id is omitted"
    algorithm: topological
    formula: |
      # --- eligibility filter (all four conditions, evaluated per candidate) ---
      candidate V is eligible iff
        (1) V.status == ACTIVE
        (2) every Opening in opening_ids has lift_system IN V.supported_lift_systems
        (3) IF any Opening in opening_ids has motorization_option != NONE
            THEN V.supported_hub_platforms is non-empty
        (4) placing this order on V leaves every calendar date in the resulting
            production window at or below V.concurrent_capacity, evaluated by
            calculations.vendor_capacity_window

      # --- ranking expression over the eligible pool ---
      rank_key(V) = ( promised_ship_date(V) ASC,      # from calculations.vendor_lead_time
                      V.open_order_count   ASC,       # least loaded next
                      V.created_at         ASC,       # oldest partner next
                      V.id                 ASC )      # total order, see note
      chosen vendor = the eligible candidate with the smallest rank_key

      # --- empty-pool fallback ---
      IF the eligible pool is empty: the request fails with ERR_NO_ELIGIBLE_VENDOR (422)
      and NOTHING is written - no VendorOrder row, no Quote.version bump, no ledger row.
    input_set: |
      Every Vendor row in the system - vendors are franchisor-level, not territory-scoped -
      filtered by the four eligibility conditions. When preferred_vendor_id IS supplied the
      selector does not run at all: that single vendor is checked against conditions (1)-(3)
      with ERR_NO_ELIGIBLE_VENDOR on failure and against condition (4) with
      ERR_VENDOR_CAPACITY_EXCEEDED on failure, so the two paths surface different errors for
      a capacity breach.
    constants:
      TIE_BREAK_ORDER: "promised_ship_date, then open_order_count, then created_at, then id"
    precision: |
      Dates compare as YYYY-MM-DD strings, counts as integers. The id term is a
      last-resort total order that is only reachable when two vendors share a ship date,
      an open-order count AND a created_at instant; no business preference is expressed
      by it and no test may rely on which id wins - a suite exercising the tie-break
      stops at created_at.
    variants: []

  - name: vendor_capacity_window
    trigger: "POST /blinds/vendor-orders and the REMAKE_REQUESTED -> PLACED re-placement, for the chosen or pinned vendor"
    algorithm: interval_merge
    formula: |
      # A vendor order occupies its whole production window INCLUSIVELY on both ends.
      window(O) = [O.effective_placement_date, O.promised_ship_date]   # closed interval of dates
      occupying orders = VendorOrder rows with vendor_id == V.id
                         and status IN {PLACED, SHIPPED, REMAKE_REQUESTED}
                         (RECEIVED and CANCELLED orders release their slot)

      For the candidate order C, let W = window(C).
      load(d) = |{O in occupying orders : d IN window(O)}|   for each date d IN W
      The placement is admissible iff  max(load(d) for d in W) + 1 <= V.concurrent_capacity.

      This is an AGGREGATE count over a CLOSED date range: two orders that merely touch
      at one shared date DO collide, and the breach is a headcount on a single day rather
      than a pairwise relation, so three orders can be pairwise fine and still breach a
      capacity of 2.
    input_set: |
      All non-terminal orders of the one candidate vendor, across every territory. This is
      deliberately different geometry from calculations.designer_calendar_conflict_set,
      which is a PAIRWISE test on HALF-OPEN instant intervals with a conditional buffer.
    constants:
      OCCUPYING_STATUSES: "PLACED, SHIPPED, REMAKE_REQUESTED"
      WINDOW_ENDPOINTS: "both inclusive"
    precision: "Whole UTC calendar dates. A candidate whose promised_ship_date equals an existing order's effective_placement_date shares exactly one loaded date and counts against capacity on that date."
    variants: []

  - name: designer_calendar_conflict_set
    trigger: "POST /blinds/consultations and POST /blinds/install-jobs"
    algorithm: interval_merge
    formula: |
      # The designer's calendar is a single stream mixing BOTH appointment kinds.
      occupations(D) = { [Consultation.scheduled_start_at, Consultation.scheduled_end_at)
                         for Consultation with designer_id == D.id and status == SCHEDULED }
                     U { [InstallJob.scheduled_start_at, InstallJob.scheduled_end_at)
                         for InstallJob with designer_id == D.id and install_status == SCHEDULED }
      # CANCELLED, COMPLETED, NO_SHOW and EXCEPTION_RAISED rows free their slot.

      buffer(existing, candidate) =
          0 minutes                      IF existing.service_postal_code == candidate.service_postal_code
          TRAVEL_BUFFER_MINUTES          OTHERWISE

      candidate C collides with existing E iff
          C.start < E.end + buffer(E, C)  AND  E.start < C.end + buffer(E, C)
      # Half-open intervals: back-to-back appointments in the SAME postal code
      # (C.start == E.end) do not collide. In a DIFFERENT postal code they do,
      # until the gap reaches TRAVEL_BUFFER_MINUTES.

      The placement is admissible iff C collides with no member of occupations(D).
    input_set: |
      Every SCHEDULED consultation and SCHEDULED install job of the one designer, without
      regard to which territory, lead or quote they belong to. The test is PAIRWISE - no
      merging or counting is performed - and the buffer is a property of the PAIR, not of
      the candidate, so the same candidate may be legal against one neighbour and illegal
      against another.
    constants:
      TRAVEL_BUFFER_MINUTES: 45
      INTERVAL_ENDPOINTS: "start inclusive, end exclusive"
    precision: |
      Millisecond instant comparison. Boundaries: same postal code with C.start == E.end
      is admissible; different postal code needs C.start >= E.end + 45 minutes, so a gap
      of exactly 45 minutes is admissible and 44 minutes 59.999 seconds is not.
    variants: []

  - name: territory_lead_routing
    trigger: "POST /blinds/leads, and the system Lead QUEUED -> ROUTED promotion when capacity frees up"
    algorithm: topological
    formula: |
      # --- eligibility filter ---
      candidate T is eligible iff
        (1) T.status == ACTIVE                              # PROBATION, SUSPENDED, TERMINATED never receive leads
        (2) Lead.postal_code IN T.postal_codes
        (3) T.open_leads_count < T.lead_capacity_per_week

      # --- ranking expression ---
      remaining_capacity(T) = T.lead_capacity_per_week - T.open_leads_count
      rank_key(T) = ( remaining_capacity(T) DESC,   # spread work to the emptiest book
                      T.royalty_rate_pct    DESC,   # then to the highest-yielding franchise
                      T.created_at          ASC )   # then to the longest-tenured franchise
      chosen territory = the eligible candidate with the best rank_key

      # --- empty-pool fallback: two distinct outcomes ---
      IF the pool is empty because condition (3) failed for at least one candidate that
         satisfied (1) and (2):
             Lead.status = QUEUED, territory_id stays null      # capacity, retryable
      ELSE (no ACTIVE territory covers the postal code at all):
             Lead.status = UNROUTABLE, territory_id stays null  # coverage, terminal
      Both outcomes still return 201 with the created lead; routing failure is a business
      state, not a request error.
    input_set: |
      Every Territory row. Postal codes are contractually exclusive among non-terminated
      territories, but a TERMINATED territory's codes may already have been re-issued, so
      the ranking must be able to resolve a genuine multi-candidate pool deterministically.
    constants:
      QUEUE_ON: "capacity exhaustion"
      UNROUTABLE_ON: "no ACTIVE territory covering the postal code"
    precision: |
      Integer capacities; royalty_rate_pct compares as an exact decimal. Boundary:
      open_leads_count == lead_capacity_per_week - 1 is still eligible and routes;
      open_leads_count == lead_capacity_per_week queues.
    variants: []

  - name: sample_late_fee
    trigger: "POST /blinds/sample-checkouts/{id}/return"
    algorithm: threshold
    formula: |
      IF returned_at <= due_at:
          days_late = 0
      ELSE:
          days_late = ceil( (returned_at - due_at) / 1 day )   # any part-day counts as a whole day

      IF days_late > SAMPLE_LOST_THRESHOLD_DAYS:
          # the kit is written off instead of fined
          late_fee_cents = SampleKit.replacement_value_cents
          SampleCheckout.status = LOST and SampleKit.status = LOST
          LedgerEntry(SAMPLE_REPLACEMENT, amount_cents = late_fee_cents,
                      basis_cents = SampleKit.replacement_value_cents, memo='sample_lost')
      ELSE:
          late_fee_cents = min(SAMPLE_LATE_FEE_PER_DAY_CENTS * days_late,
                               SampleKit.replacement_value_cents)   # the fee never exceeds the kit
          SampleCheckout.status = RETURNED and SampleKit.status = AVAILABLE
          IF late_fee_cents > 0:
              LedgerEntry(SAMPLE_LATE_FEE, amount_cents = late_fee_cents, memo='sample_late')
    input_set: "One SampleCheckout row, its kit's replacement_value_cents, and the logical clock at the moment of the return call."
    constants:
      SAMPLE_LATE_FEE_PER_DAY_CENTS: 750
      SAMPLE_LOST_THRESHOLD_DAYS: 14
    precision: |
      Integer cents; days_late is a ceiling so one millisecond past due_at is one day
      late. Boundaries: returned_at exactly equal to due_at is 0 days and free;
      days_late == 14 is the last fined return (fee 10500 unless capped) and
      days_late == 15 is LOST. Cap boundary: a kit with replacement_value_cents 5000
      reaches its cap at days_late 7 (750 x 7 = 5250 -> 5000) and stays at 5000 for
      days_late 8..14.
    variants: []

  - name: sample_loan_conservation
    trigger: "POST /blinds/sample-checkouts and POST /blinds/sample-checkouts/{id}/return"
    algorithm: aggregation
    formula: |
      # Derived kit counters, re-derived from the kit rows on every checkout and return.
      Territory.available_kit_count = |{SampleKit : territory_id == T.id and status == AVAILABLE}|
      Territory.on_loan_kit_count   = |{SampleKit : territory_id == T.id and status == ON_LOAN}|
      Territory.lost_kit_count      = |{SampleKit : territory_id == T.id and status == LOST}|
      SampleKit.open_loan_count     = |{SampleCheckout : sample_kit_id == K.id and status == OPEN}|
      SampleKit.loan_count          = lifetime |{SampleCheckout : sample_kit_id == K.id}|   # never decreases

      # Conserved quantity. For any territory, at every observable moment:
      available_kit_count + on_loan_kit_count + lost_kit_count == total kit rows of the territory
      on_loan_kit_count == |{SampleCheckout : status == OPEN and its kit's territory_id == T.id}|
      SampleKit.open_loan_count IN {0, 1} always, and == 1 exactly when status == ON_LOAN

      # A checkout followed by a return is therefore an exact compensating pair on the
      # counters: available_kit_count and on_loan_kit_count return to their pre-checkout
      # values, while loan_count keeps the +1 because it records history, not inventory.
      # A LOST return does NOT restore them: the kit leaves both buckets permanently.
    input_set: |
      All SampleKit rows of the one territory plus their OPEN checkouts. Checkouts whose
      kit belongs to a different territory never move these counters, which is what makes
      the cross-territory checkout rejection observable on the counters as well as on the
      status code.
    constants:
      OPEN_LOAN_PER_KIT_MAX: 1
    precision: "Exact integer counts, re-derived rather than incremented, so no drift is possible across a checkout/return/checkout sequence."
    variants: []

  - name: install_exception_liability
    trigger: "POST /blinds/install-jobs/{id}/exception"
    algorithm: weighted_scoring
    formula: |
      # O = the Opening named by the request's opening_id.
      IF exception_reason == DAMAGED_GOODS:
          liable_party = VENDOR
      ELSE IF exception_reason == OUT_OF_SQUARE:
          liable_party = MEASURER IF (O.mount_type == INSIDE
                                     AND O.out_of_square_in > OUT_OF_SQUARE_TOLERANCE_IN)
                         ELSE CUSTOMER
          # An inside mount on a visibly racked opening was the measurer's call to refuse;
          # an outside mount, or a spread inside tolerance, is an unforeseeable wall condition.
      ELSE IF exception_reason == OBSTRUCTION:
          liable_party = MEASURER IF (O.mount_type == INSIDE
                                     AND O.depth_in >= MIN_INSIDE_DEPTH_IN)
                         ELSE CUSTOMER
          # A pocket the measurer certified as deep enough was a pocket they inspected.

      IF liable_party == MEASURER:
          remeasure_charge_cents = min(round_half_up(O.list_price_cents * REMEASURE_CHARGE_PCT),
                                       REMEASURE_CHARGE_CAP_CENTS)
      ELSE:
          remeasure_charge_cents = 0
    input_set: |
      The exception_reason on the request plus three stored fields of the ONE named
      opening (mount_type, out_of_square_in, depth_in) and its list_price_cents. Neither
      the other openings on the job nor the designer's history participate - the designer's
      history is a downstream consequence, not an input.
    constants:
      OUT_OF_SQUARE_TOLERANCE_IN: 0.375
      MIN_INSIDE_DEPTH_IN: 2.500
      REMEASURE_CHARGE_PCT: 0.35
      REMEASURE_CHARGE_CAP_CENTS: 12000
    precision: |
      Integer cents, round_half_up before the cap, never after. Boundaries:
      out_of_square_in exactly 0.375 on an inside mount is CUSTOMER (the comparison is
      strictly greater), 0.376 is MEASURER; depth_in exactly 2.500 on an inside mount is
      MEASURER (the comparison is greater-or-equal), 2.499 is CUSTOMER. Cap boundary: a
      34285-cent opening charges 11999.75 -> 12000 which is exactly the cap, and a
      34290-cent opening charges 12001.5 -> 12002 which is clipped back to 12000.
    variants: []

  - name: remake_chargeback_waterfall
    trigger: "the VendorOrder RECEIVED -> REMAKE_REQUESTED and RECEIVED -> CANCELLED transitions"
    algorithm: waterfall_allocation
    formula: |
      remake_cost_cents = VendorOrder.order_cost_cents      # wholesale value being redone

      # --- targets, chosen by the ORIGIN of the remake -----------------------
      IF remake_origin == INSTALL_EXCEPTION:      # driven by the install exception cascade
          liable = the driving InstallJob.liable_party
          vendor_target    = remake_cost_cents IF liable == VENDOR   ELSE 0
          territory_target = remake_cost_cents IF liable == MEASURER ELSE 0
          # liable == CUSTOMER leaves both targets 0, so the customer bucket takes it all
      ELSE:                                       # remake_origin == FRANCHISEE_REQUEST
          IF Vendor.remake_policy == FULL_VENDOR_90D:
              vendor_target    = remake_cost_cents
              territory_target = 0
          ELSE:   # SHARED_50_50 - the vendor absorbs a FLOORED half
              vendor_target    = floor(remake_cost_cents / 2)
              territory_target = remake_cost_cents - vendor_target

      # --- the waterfall: buckets are filled strictly in this order ----------
      bucket 1  vendor_absorbed_cents    = min(vendor_target, remake_cost_cents)
      bucket 2  territory_absorbed_cents = min(territory_target,
                                               REMAKE_TERRITORY_CAP_CENTS,
                                               remake_cost_cents - vendor_absorbed_cents)
      bucket 3  customer_absorbed_cents  = remake_cost_cents
                                         - vendor_absorbed_cents
                                         - territory_absorbed_cents   # REMAINDER, last bucket

      # Invariant, always exactly true and never restated by rounding:
      #   vendor_absorbed_cents + territory_absorbed_cents + customer_absorbed_cents
      #     == remake_cost_cents
      IF territory_absorbed_cents > 0:
          LedgerEntry(REMAKE_CHARGEBACK, amount_cents = territory_absorbed_cents,
                      basis_cents = remake_cost_cents, source_entity_type = VENDOR_ORDER)
    input_set: |
      The one VendorOrder's order_cost_cents, its vendor's remake_policy, and - only on
      the INSTALL_EXCEPTION path - the liable_party of the driving install job. Prior
      remakes on the same order do not change the split; each remake is allocated on its
      own, and the fields hold the MOST RECENT allocation only.
    constants:
      REMAKE_TERRITORY_CAP_CENTS: 15000
      VENDOR_SHARE_FULL_VENDOR_90D: 1.0
      VENDOR_SHARE_SHARED_50_50: "floor(cost / 2)"
    precision: |
      Integer cents throughout; the only non-trivial step is the FLOORED half, so an odd
      remake_cost_cents of 7403 splits 3701 to the vendor and 3702 to the territory - the
      extra cent lands on the territory, not the vendor. Cap boundary: a MEASURER-liable
      exception on a 15000-cent order charges the territory the whole 15000 and the
      customer 0, while a 15001-cent order charges the territory 15000 and the customer 1.
    variants:
      - name: FRANCHISEE_REQUEST
        when: "POST /blinds/vendor-orders/{id}/remake called directly by the Franchisee"
        difference: "The split is driven by Vendor.remake_policy, so the vendor always absorbs at least a floored half and the territory cap is only reachable on large SHARED_50_50 orders."
      - name: INSTALL_EXCEPTION
        when: "the remake is created by the InstallJob SCHEDULED -> EXCEPTION_RAISED cascade"
        difference: "Vendor.remake_policy is ignored entirely and the split is driven by liable_party, so a MEASURER-liable exception moves the vendor's whole share onto the territory (capped) and the customer bucket, even on a FULL_VENDOR_90D vendor."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
# The ladder is: authentication -> authorization -> existence -> ownership ->
# request shape -> referential integrity -> optimistic concurrency -> state
# preconditions -> safety/compliance -> constraint -> temporal -> fiscal.
# Safety deliberately sits BELOW state: a request against a wrongly-staged
# resource is not evaluated for cord-hazard compliance at all, so the state
# error is what a caller sees when both are violated.
validations:
  - priority: 1
    category: auth
    check: "The X-User-ID header is present, non-empty, and resolves to a known actor with a role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints including POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "The resolved actor's role appears in the endpoint's declared roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every {id} path parameter resolves to an existing row, validated left to right; the first unresolvable segment decides the error."
    error_id: "ERR_TERRITORY_NOT_FOUND | ERR_DESIGNER_NOT_FOUND | ERR_SAMPLE_KIT_NOT_FOUND | ERR_LEAD_NOT_FOUND | ERR_CONSULTATION_NOT_FOUND | ERR_SAMPLE_CHECKOUT_NOT_FOUND | ERR_OPENING_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_VENDOR_ORDER_NOT_FOUND | ERR_INSTALL_JOB_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: existence
    check: "Every foreign key carried in the request body resolves to an existing row, validated in the field order declared in the endpoint's input list (e.g. POST /blinds/consultations checks lead_id before designer_id)."
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /blinds/designers, POST /blinds/sample-kits, POST /blinds/consultations, POST /blinds/sample-checkouts, POST /blinds/openings, POST /blinds/quotes, POST /blinds/vendor-orders, POST /blinds/install-jobs, POST /blinds/install-jobs/{id}/exception"

  - priority: 5
    category: auth
    check: "A Franchisee actor may only read or write rows belonging to the Territory their user id is bound to. Reached only after existence, so probing a foreign id yields 403 while probing a nonexistent id yields 404."
    error_id: ERR_TERRITORY_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "all Franchisee operations on Territory, Designer, SampleKit, Lead and VendorOrder rows"

  - priority: 6
    category: auth
    check: "A Designer actor may only act on rows they are assigned to: Consultation.designer_id, the consultation behind a SampleCheckout, the consultation behind an Opening, the consultation behind a Quote, and InstallJob.designer_id."
    error_id: ERR_DESIGNER_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /blinds/consultations/{id}/complete, POST /blinds/consultations/{id}/no-show, POST /blinds/sample-checkouts, POST /blinds/sample-checkouts/{id}/return, POST /blinds/openings, PATCH /blinds/openings/{id}/configuration, POST /blinds/quotes, POST /blinds/quotes/{id}/present, POST /blinds/quotes/{id}/revise, POST /blinds/quotes/{id}/accept, POST /blinds/install-jobs/{id}/commissioning/pair, POST /blinds/install-jobs/{id}/commissioning/verify, POST /blinds/install-jobs/{id}/exception, POST /blinds/install-jobs/{id}/complete"

  - priority: 7
    category: business_constraint
    check: "Request shape: every required field present, no field of the wrong JSON type, every enum value a declared member, every instant a valid ISO 8601 UTC string, every array within its declared cardinality and free of duplicates. Fields declared source: system or source: computed are silently ignored when supplied, not rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 8
    category: business_constraint
    check: "Numeric and interval domains: each of the six measurement readings and depth_in strictly greater than 0 and at most 300.000 with at most 3 decimals; royalty_rate_pct within 0..0.15; cutoff_hour_utc within 0..23; every *_capacity and *_count at least 1; scheduled_end_at strictly after scheduled_start_at; hold_end_at strictly after hold_start_at and at most SAMPLE_MAX_HOLD_DAYS (14) days after it; hold_start_at at or after the logical clock; paired_channel_count at least 0."
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /blinds/territories, PATCH /blinds/territories/{id}, POST /blinds/vendors, POST /blinds/consultations, POST /blinds/sample-checkouts, POST /blinds/openings, POST /blinds/install-jobs, POST /blinds/install-jobs/{id}/commissioning/pair"

  - priority: 9
    category: business_referential
    check: "Territory coherence of a linkage: on POST /blinds/consultations the designer's territory_id must equal the lead's territory_id; on POST /blinds/sample-checkouts the kit's territory_id must equal the territory of the consultation's lead; on POST /blinds/install-jobs the designer's territory_id must equal the territory of the order's quote."
    error_id: ERR_CROSS_TERRITORY_FORBIDDEN
    http_status: 422
    applies_to: "POST /blinds/consultations, POST /blinds/sample-checkouts, POST /blinds/install-jobs"

  - priority: 10
    category: business_referential
    check: "Membership of a named opening: every id in POST /blinds/vendor-orders.opening_ids must be an Opening with quote_id equal to the request's quote_id; the opening_id on POST /blinds/install-jobs/{id}/exception must appear in the job's VendorOrder.opening_ids; the replaces_opening_id on POST /blinds/openings must be an Opening on the same consultation."
    error_id: ERR_OPENING_NOT_ON_QUOTE
    http_status: 422
    applies_to: "POST /blinds/vendor-orders, POST /blinds/install-jobs/{id}/exception, POST /blinds/openings"

  - priority: 11
    category: state
    check: "expected_consultation_version equals the current Consultation.version (§1.2.1 quote-create-stale-consultation)."
    error_id: ERR_STALE_CONSULTATION_VERSION
    http_status: 412
    applies_to: "POST /blinds/quotes"

  - priority: 12
    category: state
    check: "expected_quote_version equals the current Quote.version (§1.2.1 vendor-order-create-stale-quote)."
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
    applies_to: "POST /blinds/vendor-orders"

  - priority: 13
    category: state
    check: "The referenced Territory.status is ACTIVE. PROBATION, SUSPENDED and TERMINATED all fail. Checked before every state precondition on the row itself, so a suspended franchise blocks work on correctly-staged rows."
    error_id: ERR_TERRITORY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /blinds/designers, POST /blinds/sample-kits, POST /blinds/consultations, POST /blinds/sample-checkouts, POST /blinds/openings, POST /blinds/quotes, POST /blinds/quotes/{id}/present, POST /blinds/quotes/{id}/accept, POST /blinds/vendor-orders, POST /blinds/install-jobs"

  - priority: 14
    category: state
    check: "The referenced Designer.status is ACTIVE. SUSPENDED and INACTIVE both fail."
    error_id: ERR_DESIGNER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /blinds/consultations, POST /blinds/install-jobs"

  - priority: 15
    category: state
    check: "A Quote in status PRESENTED whose expires_at is at or before the logical clock is first flipped to EXPIRED - the flip is persisted - and the triggering request then fails. Evaluated before the per-endpoint status precondition, so an expired quote reports expiry rather than a status mismatch."
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /blinds/quotes/{id}/present, POST /blinds/quotes/{id}/revise, POST /blinds/quotes/{id}/accept, POST /blinds/vendor-orders"

  - priority: 16
    category: state
    check: "Quote.status is DRAFT."
    error_id: ERR_QUOTE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /blinds/quotes/{id}/present"

  - priority: 17
    category: state
    check: "Quote.status is PRESENTED."
    error_id: ERR_QUOTE_NOT_PRESENTED
    http_status: 409
    applies_to: "POST /blinds/quotes/{id}/revise, POST /blinds/quotes/{id}/accept"

  - priority: 18
    category: state
    check: "Quote.status is ACCEPTED."
    error_id: ERR_QUOTE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders"

  - priority: 19
    category: state
    check: "Quote.revision_count is strictly less than QUOTE_MAX_REVISIONS (2). The counter records completed PRESENTED -> DRAFT round trips, so the second revision succeeds with revision_count 1 -> 2 and the third fails."
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /blinds/quotes/{id}/revise"

  - priority: 20
    category: state
    check: "Consultation.status is SCHEDULED - the appointment is still open, so it can be closed out and samples can still be taken against it."
    error_id: ERR_CONSULTATION_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /blinds/consultations/{id}/complete, POST /blinds/consultations/{id}/no-show, POST /blinds/sample-checkouts"

  - priority: 21
    category: state
    check: "Consultation.status is SCHEDULED or COMPLETED. Measuring, configuring and quoting survive the end of the appointment - a re-measure trip and a later quote revision both attach to a COMPLETED consultation - but a CANCELLED or NO_SHOW appointment closes the file for good."
    error_id: ERR_CONSULTATION_CLOSED
    http_status: 409
    applies_to: "POST /blinds/openings, PATCH /blinds/openings/{id}/configuration, POST /blinds/quotes"

  - priority: 22
    category: state
    check: "SampleKit.status is AVAILABLE. ON_LOAN and LOST both fail."
    error_id: ERR_KIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /blinds/sample-checkouts"

  - priority: 23
    category: state
    check: "SampleCheckout.status is OPEN."
    error_id: ERR_CHECKOUT_NOT_OPEN
    http_status: 409
    applies_to: "POST /blinds/sample-checkouts/{id}/return"

  - priority: 24
    category: state
    check: "Opening.measure_status is MEASURED or CONFIGURED. QUOTED fails (detach the quote first by superseding it) and REMEASURE_REQUIRED fails permanently - a re-measure is a new Opening row, never an edit of the old one."
    error_id: ERR_OPENING_NOT_MEASURED
    http_status: 409
    applies_to: "PATCH /blinds/openings/{id}/configuration"

  - priority: 25
    category: state
    check: "The consultation named by POST /blinds/quotes has at least one Opening with measure_status == CONFIGURED to attach. A consultation whose openings are all still MEASURED produces no quote."
    error_id: ERR_QUOTE_HAS_NO_OPENINGS
    http_status: 422
    applies_to: "POST /blinds/quotes"

  - priority: 26
    category: state
    check: "No Opening named in POST /blinds/vendor-orders.opening_ids already belongs to a VendorOrder with status IN {PLACED, SHIPPED, RECEIVED, REMAKE_REQUESTED}. A CANCELLED order releases its openings."
    error_id: ERR_OPENING_ALREADY_ORDERED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders"

  - priority: 27
    category: state
    check: "VendorOrder.status is PLACED."
    error_id: ERR_ORDER_NOT_SHIPPABLE
    http_status: 409
    applies_to: "POST /blinds/vendor-orders/{id}/ship"

  - priority: 28
    category: state
    check: "VendorOrder.status is SHIPPED."
    error_id: ERR_ORDER_NOT_SHIPPED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders/{id}/receive"

  - priority: 29
    category: state
    check: "VendorOrder.status is RECEIVED - to request a remake on it, to schedule the install that fits it, AND to sign that install off. The order can leave RECEIVED after the job is scheduled (a remake re-places it), so completion re-checks the referenced order rather than trusting the check made at scheduling time."
    error_id: ERR_ORDER_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders/{id}/remake, POST /blinds/install-jobs, POST /blinds/install-jobs/{id}/complete"

  - priority: 30
    category: state
    check: "InstallJob.install_status is SCHEDULED. Checked on the first state dimension before anything on the second, so a COMPLETED job reports the job state rather than a commissioning state."
    error_id: ERR_INSTALL_JOB_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /blinds/install-jobs/{id}/commissioning/pair, POST /blinds/install-jobs/{id}/commissioning/verify, POST /blinds/install-jobs/{id}/exception, POST /blinds/install-jobs/{id}/complete"

  - priority: 31
    category: state
    check: "InstallJob.commissioning_status is PENDING or FAILED. NOT_REQUIRED means the order carries no motorized channel, and PAIRED or VERIFIED means pairing already succeeded; all three fail."
    error_id: ERR_COMMISSIONING_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /blinds/install-jobs/{id}/commissioning/pair"

  - priority: 32
    category: state
    check: "InstallJob.commissioning_status is PAIRED."
    error_id: ERR_COMMISSIONING_NOT_PAIRED
    http_status: 409
    applies_to: "POST /blinds/install-jobs/{id}/commissioning/verify"

  - priority: 33
    category: state
    check: "InstallJob.commissioning_status is NOT_REQUIRED or VERIFIED - the join point of the two parallel state dimensions. PENDING, PAIRED and FAILED all block completion."
    error_id: ERR_COMMISSIONING_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /blinds/install-jobs/{id}/complete"

  - priority: 34
    category: business_safety
    check: |
      Child-safety cordless requirement, evaluated at the point of sale rather than at
      configuration time. For every Opening attached to the quote, the requirement APPLIES
      when the opening's room_type IN {NURSERY, BEDROOM} OR the quote's lead has
      child_occupied_dwelling == true. Where it applies, lift_system must be CORDLESS or
      MOTORIZED; CORDED and CONTINUOUS_LOOP are both refused. A quote may be built and
      revised with a hazardous configuration - it may not be presented, accepted, or sent
      to a vendor.
    error_id: ERR_CORD_HAZARD_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /blinds/quotes/{id}/present, POST /blinds/quotes/{id}/accept, POST /blinds/vendor-orders"

  - priority: 35
    category: business_safety
    check: "An INSIDE mount requires depth_in >= MIN_INSIDE_DEPTH_IN (2.500). An OUTSIDE mount has no depth requirement."
    error_id: ERR_INSUFFICIENT_MOUNT_DEPTH
    http_status: 422
    applies_to: "POST /blinds/openings"

  - priority: 36
    category: business_safety
    check: "The acting Designer's certifications include MOTORIZATION."
    error_id: ERR_MOTORIZATION_CERT_REQUIRED
    http_status: 403
    applies_to: "POST /blinds/install-jobs/{id}/commissioning/pair"

  - priority: 37
    category: business_safety
    check: "The hub_platform on the pair request is a member of the order's Vendor.supported_hub_platforms. NONE is never a member."
    error_id: ERR_HUB_PLATFORM_UNSUPPORTED
    http_status: 422
    applies_to: "POST /blinds/install-jobs/{id}/commissioning/pair"

  - priority: 38
    category: business_constraint
    check: "paired_channel_count on the pair request is at most InstallJob.motorized_channel_count. Fewer channels than the order carries is legal and lands the job in FAILED at verification; more is a request the order cannot contain."
    error_id: ERR_CHANNEL_COUNT_EXCEEDS_ORDER
    http_status: 422
    applies_to: "POST /blinds/install-jobs/{id}/commissioning/pair"

  - priority: 39
    category: business_constraint
    check: "InstallJob.commissioning_attempt_count is strictly less than COMMISSIONING_MAX_ATTEMPTS (3). The counter increments on every accepted pair call, including the ones that later fail verification."
    error_id: ERR_COMMISSIONING_ATTEMPT_LIMIT
    http_status: 409
    applies_to: "POST /blinds/install-jobs/{id}/commissioning/pair"

  - priority: 40
    category: business_constraint
    check: "Motor package coherence: motorization_option must be NONE when lift_system != MOTORIZED, and must NOT be NONE when lift_system == MOTORIZED."
    error_id: ERR_MOTOR_OPTION_MISMATCH
    http_status: 422
    applies_to: "PATCH /blinds/openings/{id}/configuration"

  - priority: 41
    category: business_referential
    check: "calculations.vendor_routing_selector finds at least one eligible vendor, or - when preferred_vendor_id is supplied - that vendor satisfies the status, lift-system and hub-platform eligibility conditions."
    error_id: ERR_NO_ELIGIBLE_VENDOR
    http_status: 422
    applies_to: "POST /blinds/vendor-orders"

  - priority: 42
    category: business_temporal
    check: "calculations.designer_calendar_conflict_set finds no collision between the requested window and the designer's existing SCHEDULED consultations and install jobs, applying the conditional TRAVEL_BUFFER_MINUTES for a different service_postal_code."
    error_id: ERR_DESIGNER_CALENDAR_CONFLICT
    http_status: 409
    applies_to: "POST /blinds/consultations, POST /blinds/install-jobs"

  - priority: 43
    category: business_temporal
    check: "The requested [hold_start_at, hold_end_at] closed interval does not overlap the recorded hold interval of any SampleCheckout on the same kit with status IN {OPEN, RETURNED}. Both endpoints are inclusive, so a new hold starting exactly on an earlier hold's hold_end_at collides even after the kit has been returned early - the library ledger records where the kit was promised to be, not only where it is."
    error_id: ERR_SAMPLE_KIT_HOLD_CONFLICT
    http_status: 409
    applies_to: "POST /blinds/sample-checkouts"

  - priority: 44
    category: business_temporal
    check: "calculations.vendor_capacity_window admits the placement: no calendar date in the resulting production window reaches Vendor.concurrent_capacity + 1 once this order is counted."
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders"

  - priority: 45
    category: business_constraint
    check: "Vendor.remake_policy is not NO_REMAKE."
    error_id: ERR_REMAKE_NOT_OFFERED
    http_status: 422
    applies_to: "POST /blinds/vendor-orders/{id}/remake"

  - priority: 46
    category: business_constraint
    check: "VendorOrder.remake_count is strictly less than ORDER_MAX_REMAKES (2)."
    error_id: ERR_REMAKE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders/{id}/remake"

  - priority: 47
    category: business_temporal
    check: "When Vendor.remake_policy == FULL_VENDOR_90D, the logical clock is at most VENDOR_REMAKE_WINDOW_DAYS (90) after VendorOrder.received_at. SHARED_50_50 has no window."
    error_id: ERR_REMAKE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders/{id}/remake"

  - priority: 48
    category: business_constraint
    check: "A FULL_CREDIT remake requires every Opening in the order's opening_ids to still have install_outcome == PENDING; revenue that has already been trued up by an install cannot be reversed wholesale. A REPLACEMENT remake has no such requirement."
    error_id: ERR_OPENINGS_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders/{id}/remake"

  - priority: 49
    category: business_fiscal
    check: "Territory.open_order_exposure_cents + the new order's order_cost_cents is at most Territory.credit_limit_cents. Evaluated LAST, after vendor eligibility and capacity, so an order that breaches both capacity and credit reports the capacity error."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /blinds/vendor-orders"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
# 28 write endpoints carry the whole business surface; the remaining 21 GETs are
# the reverse-reachability channel demanded by §1.1's 16 foreign keys (one
# single-resource GET per entity to name its collection segment, nine filtered
# lists that collapse 2-3 FKs each, and one sub-resource list for the ledger).
# Filter parameters are query-string parameters; every list endpoint also accepts
# limit and offset and returns the §1.0 pagination fields.
endpoints:
  # ---------------- Territory (franchise unit) ----------------
  - method: POST
    path: "/blinds/territories"
    description: "Franchisor charters a franchised territory with its postal-code exclusivity, royalty rate, weekly lead capacity, credit limit and designer-liability window."
    roles: [Franchisor]
    code: 201
    input: [legal_name, postal_codes, "royalty_rate_pct?", "lead_capacity_per_week?", "credit_limit_cents?", "liability_window?"]
    output: Territory
    side_effects: ["status stamped ACTIVE", "all six derived counters stamped 0", "postal-code exclusivity checked against every Territory whose status != TERMINATED"]

  - method: PATCH
    path: "/blinds/territories/{id}"
    description: "Franchisor re-states a territory's standing or commercial terms. Setting status to PROBATION, SUSPENDED or TERMINATED closes the franchise to new work without touching rows already in flight."
    roles: [Franchisor]
    code: 200
    input: ["status?", "royalty_rate_pct?", "lead_capacity_per_week?", "credit_limit_cents?", "liability_window?"]
    output: Territory
    side_effects: ["version incremented", "a raised lead_capacity_per_week does NOT promote queued leads - only a lead reaching CONVERTED or LOST does", "a changed liability_window changes which variant of calculations.designer_liability_score applies at the NEXT recompute, and does not re-score anyone retroactively"]

  - method: GET
    path: "/blinds/territories/{id}"
    description: "Read one territory including its royalty, exposure and sample-library counters."
    roles: [Franchisor, Franchisee]
    code: 200
    input: []
    output: Territory
    side_effects: []

  - method: GET
    path: "/blinds/territories/{id}/ledger-entries"
    description: "Reverse-reachability list for LedgerEntry.territory_id - the only channel through which cascade-created ledger rows are observable, since no write endpoint returns them. Ordered by occurred_at ascending, then by created_at ascending for rows stamped at the same logical instant."
    roles: [Franchisor, Franchisee]
    code: 200
    input: ["entry_type?", "source_entity_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---------------- Designer ----------------
  - method: POST
    path: "/blinds/designers"
    description: "Franchisee hires a designer into their territory with their certification set."
    roles: [Franchisee]
    code: 201
    input: [territory_id, full_name, home_postal_code, "certifications?"]
    output: Designer
    side_effects: ["status stamped ACTIVE", "remeasure_liability_score stamped at BASE_SCORE (100)", "all three incident counters stamped 0"]

  - method: PATCH
    path: "/blinds/designers/{id}"
    description: "Franchisee reinstates a suspended designer, retires one, or re-states their certifications. This is the only path back out of SUSPENDED."
    roles: [Franchisee]
    code: 200
    input: ["status?", "certifications?"]
    output: Designer
    side_effects: ["status SUSPENDED -> ACTIVE or ACTIVE -> INACTIVE per §1.2", "reinstatement does NOT re-score the designer and does NOT un-cancel the consultations and install jobs the suspension cancelled", "setting status INACTIVE cancels that designer's future SCHEDULED consultations and install jobs exactly as a suspension does"]

  - method: GET
    path: "/blinds/designers/{id}"
    description: "Read one designer including the liability score and the three incident counters behind it."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: Designer
    side_effects: []

  - method: GET
    path: "/blinds/designers"
    description: "Reverse-reachability list for Designer.territory_id."
    roles: [Franchisor, Franchisee]
    code: 200
    input: ["territory_id?", "status?", "limit?", "offset?"]
    output: Designer[]
    side_effects: []

  # ---------------- Sample library ----------------
  - method: POST
    path: "/blinds/sample-kits"
    description: "Franchisee adds a fabric sample kit to their territory's library."
    roles: [Franchisee]
    code: 201
    input: [territory_id, kit_code, replacement_value_cents]
    output: SampleKit
    side_effects: ["status stamped AVAILABLE", "Territory.available_kit_count re-derived"]

  - method: GET
    path: "/blinds/sample-kits/{id}"
    description: "Read one sample kit and its loan counters."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: SampleKit
    side_effects: []

  - method: GET
    path: "/blinds/sample-kits"
    description: "Reverse-reachability list for SampleKit.territory_id."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: ["territory_id?", "status?", "limit?", "offset?"]
    output: SampleKit[]
    side_effects: []

  # ---------------- Lead routing ----------------
  - method: POST
    path: "/blinds/leads"
    description: "A national inquiry enters the system. The create request itself runs calculations.territory_lead_routing exactly once, so the response is already ROUTED, QUEUED or UNROUTABLE - NEW is never observable."
    roles: [Franchisor, Franchisee]
    code: 201
    input: [customer_name, postal_code, source, requested_at, "child_occupied_dwelling?"]
    output: Lead
    side_effects: ["Lead.NEW -> ROUTED | QUEUED | UNROUTABLE per the selector", "on ROUTED: territory_id and routed_at stamped, Territory.open_leads_count re-derived, Territory.version incremented"]

  - method: GET
    path: "/blinds/leads/{id}"
    description: "Read one lead including its routing outcome."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: Lead
    side_effects: []

  - method: GET
    path: "/blinds/leads"
    description: "Reverse-reachability list for Lead.territory_id; also the channel for observing which QUEUED lead the capacity-freeing promotion picked."
    roles: [Franchisor, Franchisee]
    code: 200
    input: ["territory_id?", "status?", "postal_code?", "limit?", "offset?"]
    output: Lead[]
    side_effects: []

  # ---------------- Consultation ----------------
  - method: POST
    path: "/blinds/consultations"
    description: "Book an in-home design consultation on a designer's calendar. The window is half-open and shares one calendar with that designer's install jobs, with a conditional travel buffer between different postal codes."
    roles: [Franchisee, Designer]
    code: 201
    input: [lead_id, designer_id, scheduled_start_at, scheduled_end_at, service_postal_code]
    output: Consultation
    side_effects: ["status stamped SCHEDULED", "calculations.designer_calendar_conflict_set evaluated against every SCHEDULED consultation and install job of the designer", "service_postal_code must equal the lead's postal_code"]

  - method: GET
    path: "/blinds/consultations/{id}"
    description: "Read one consultation including its measured, configured and open-sample-loan counters."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: Consultation
    side_effects: []

  - method: GET
    path: "/blinds/consultations"
    description: "Reverse-reachability list for Consultation.lead_id and Consultation.designer_id."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: ["lead_id?", "designer_id?", "status?", "limit?", "offset?"]
    output: Consultation[]
    side_effects: []

  - method: POST
    path: "/blinds/consultations/{id}/complete"
    description: "The designer closes out the appointment. Refused while any sample loan on it is still OPEN."
    roles: [Designer]
    code: 200
    input: []
    output: Consultation
    side_effects: ["Consultation.SCHEDULED -> COMPLETED", "completed_at stamped", "Lead.ROUTED -> CONSULT_COMPLETE", "the designer's calendar slot is freed for that window"]

  - method: POST
    path: "/blinds/consultations/{id}/no-show"
    description: "The homeowner was absent. Terminal for the appointment and fatal for the lead."
    roles: [Designer]
    code: 200
    input: []
    output: Consultation
    side_effects: ["Consultation.SCHEDULED -> NO_SHOW", "Lead.ROUTED -> LOST, which decrements Territory.open_leads_count and can promote one QUEUED lead", "the designer's calendar slot is freed"]

  # ---------------- Sample check-out ----------------
  - method: POST
    path: "/blinds/sample-checkouts"
    description: "The designer takes a kit out of the library for an appointment, reserving a closed hold interval on it."
    roles: [Designer]
    code: 201
    input: [sample_kit_id, consultation_id, hold_start_at, hold_end_at]
    output: SampleCheckout
    side_effects: ["status stamped OPEN, checked_out_at stamped from the logical clock, due_at set equal to hold_end_at", "SampleKit.AVAILABLE -> ON_LOAN", "SampleKit.loan_count and open_loan_count and both Territory kit counters re-derived per calculations.sample_loan_conservation"]

  - method: GET
    path: "/blinds/sample-checkouts/{id}"
    description: "Read one sample check-out including days_late and late_fee_cents."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: SampleCheckout
    side_effects: []

  - method: GET
    path: "/blinds/sample-checkouts"
    description: "Reverse-reachability list for SampleCheckout.sample_kit_id and SampleCheckout.consultation_id."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: ["sample_kit_id?", "consultation_id?", "status?", "limit?", "offset?"]
    output: SampleCheckout[]
    side_effects: []

  - method: POST
    path: "/blinds/sample-checkouts/{id}/return"
    description: "The kit comes back. Lateness, the capped late fee and the write-off decision all come from the logical clock at this moment."
    roles: [Designer]
    code: 200
    input: []
    output: SampleCheckout
    side_effects: ["calculations.sample_late_fee runs and stores days_late and late_fee_cents", "SampleCheckout.OPEN -> RETURNED or -> LOST", "SampleKit.ON_LOAN -> AVAILABLE or -> LOST", "a SAMPLE_LATE_FEE or SAMPLE_REPLACEMENT LedgerEntry when the fee is non-zero", "Designer.late_sample_return_count and remeasure_liability_score recomputed, which can suspend the designer"]

  # ---------------- Measurement ----------------
  - method: POST
    path: "/blinds/openings"
    description: "Record one measured opening: six wall readings, pocket depth and the mount decision. The finished dimensions are derived here and never supplied by the caller. A re-measure trip names the opening it replaces."
    roles: [Designer]
    code: 201
    input: [consultation_id, label, room_type, mount_type, width_top_in, width_middle_in, width_bottom_in, height_left_in, height_center_in, height_right_in, depth_in, "replaces_opening_id?"]
    output: Opening
    side_effects: ["calculations.opening_finished_dimensions runs and stores out_of_square_in, ordered_width_in and ordered_height_in", "measure_status stamped MEASURED, install_outcome stamped PENDING, credited stamped false, list_price_cents stamped 0", "Consultation.measured_opening_count re-derived and Consultation.version incremented"]

  - method: GET
    path: "/blinds/openings/{id}"
    description: "Read one opening including its derived dimensions and price."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: Opening
    side_effects: []

  - method: GET
    path: "/blinds/openings"
    description: "Reverse-reachability list for Opening.consultation_id, Opening.quote_id and the self-referential Opening.replaces_opening_id."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: ["consultation_id?", "quote_id?", "replaces_opening_id?", "measure_status?", "install_outcome?", "limit?", "offset?"]
    output: Opening[]
    side_effects: []

  - method: PATCH
    path: "/blinds/openings/{id}/configuration"
    description: "Choose fabric, lift system and motor package for one opening and re-price it. Repeatable while the opening is not attached to a quote; each call re-prices from scratch rather than adjusting the previous price."
    roles: [Designer]
    code: 200
    input: [fabric_code, lift_system, "motorization_option?"]
    output: Opening
    side_effects: ["calculations.opening_list_price runs and stores billable_sqft and list_price_cents", "Opening.MEASURED -> CONFIGURED or CONFIGURED -> CONFIGURED", "Consultation.configured_opening_count re-derived and Consultation.version incremented", "cord-hazard compliance is NOT checked here - a hazardous configuration is storable and only blocked at presentation, acceptance and ordering"]

  # ---------------- Quote ----------------
  - method: POST
    path: "/blinds/quotes"
    description: "Build a quote from every CONFIGURED opening on the consultation. Supersedes any earlier DRAFT or PRESENTED quote on the same consultation and re-attaches its openings, which is why it carries the consultation's expected version."
    roles: [Designer]
    code: 201
    input: [consultation_id, expected_consultation_version]
    output: Quote
    side_effects: ["status stamped DRAFT, revision_count stamped 0, all money fields stamped 0", "lead_id denormalized from the consultation", "every CONFIGURED Opening on the consultation gets quote_id set and moves CONFIGURED -> QUOTED", "any earlier DRAFT or PRESENTED quote on the consultation moves to SUPERSEDED and its openings move QUOTED -> CONFIGURED before being re-attached", "Consultation.version incremented"]

  - method: GET
    path: "/blinds/quotes/{id}"
    description: "Read one quote with all six ordered steps of calculations.quote_totals exposed as separate fields."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/blinds/quotes"
    description: "Reverse-reachability list for Quote.consultation_id."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: ["consultation_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/blinds/quotes/{id}/present"
    description: "Price and present the quote to the homeowner. This is the first gate at which the child-safety cordless requirement is enforced."
    roles: [Designer]
    code: 200
    input: []
    output: Quote
    side_effects: ["calculations.quote_totals runs all six steps and stores subtotal_cents, install_fee_cents, pre_discount_total_cents, discount_pct, discount_cents, total_cents and net_sales_cents", "Quote.DRAFT -> PRESENTED", "presented_at stamped and expires_at set per calculations.quote_expiry_window"]

  - method: POST
    path: "/blinds/quotes/{id}/revise"
    description: "Pull a presented quote back to DRAFT so its openings can be reconfigured. Capped at QUOTE_MAX_REVISIONS."
    roles: [Designer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote.PRESENTED -> DRAFT", "revision_count incremented", "expires_at cleared to null while presented_at is retained", "all six money fields cleared to 0", "the attached openings stay QUOTED and attached"]

  - method: POST
    path: "/blinds/quotes/{id}/accept"
    description: "The homeowner signs. Recognizes provisional net sales on the territory and accrues royalty."
    roles: [Designer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote.PRESENTED -> ACCEPTED and accepted_at stamped", "the provisional variant of calculations.royalty_accrual posts a NET_SALES_ROYALTY LedgerEntry and raises Territory.net_sales_cents and Territory.royalty_accrued_cents", "Lead -> CONVERTED, which frees weekly capacity and can promote one QUEUED lead"]

  # ---------------- Vendor ----------------
  - method: POST
    path: "/blinds/vendors"
    description: "Franchisor onboards a manufacturer with its lead-time parameters, daily cutoff hour, remake policy, concurrent production capacity and the lift systems and smart-home hubs it supports."
    roles: [Franchisor]
    code: 201
    input: [name, base_lead_time_days, motorization_extra_days, cutoff_hour_utc, remake_policy, concurrent_capacity, supported_lift_systems, "supported_hub_platforms?", "status?"]
    output: Vendor
    side_effects: ["open_order_count stamped 0", "status defaults to ACTIVE and may be created SUSPENDED to keep a manufacturer on file without routing to it"]

  - method: GET
    path: "/blinds/vendors/{id}"
    description: "Read one vendor including its open-order count."
    roles: [Franchisor, Franchisee]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # ---------------- Vendor order ----------------
  - method: POST
    path: "/blinds/vendor-orders"
    description: "Place a manufacturing order for a subset of an accepted quote's openings. The vendor is chosen by calculations.vendor_routing_selector unless preferred_vendor_id pins one. An accepted quote may be split across several orders, so the quote's expected version is required to keep the writer's view of the unplaced openings honest."
    roles: [Franchisee]
    code: 201
    input: [quote_id, opening_ids, expected_quote_version, "preferred_vendor_id?"]
    output: VendorOrder
    side_effects: ["calculations.vendor_routing_selector chooses the vendor, or the pinned vendor is validated against the same conditions", "calculations.vendor_order_cost stores order_cost_cents", "calculations.vendor_lead_time stores effective_placement_date, lead_time_days and promised_ship_date", "calculations.vendor_capacity_window admits or refuses the placement", "status stamped PLACED, placed_at stamped, remake_count 0, credit_scope NONE", "Vendor.open_order_count and Territory.open_order_exposure_cents re-derived", "Quote.version incremented"]

  - method: GET
    path: "/blinds/vendor-orders/{id}"
    description: "Read one order including its production window and the three remake-chargeback buckets."
    roles: [Franchisor, Franchisee, Designer, VendorRep]
    code: 200
    input: []
    output: VendorOrder
    side_effects: []

  - method: GET
    path: "/blinds/vendor-orders"
    description: "Reverse-reachability list for VendorOrder.quote_id and VendorOrder.vendor_id."
    roles: [Franchisor, Franchisee, VendorRep]
    code: 200
    input: ["quote_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: VendorOrder[]
    side_effects: []

  - method: POST
    path: "/blinds/vendor-orders/{id}/ship"
    description: "The manufacturer's own representative reports the order shipped. This is the VendorRep role's only write."
    roles: [VendorRep]
    code: 200
    input: []
    output: VendorOrder
    side_effects: ["VendorOrder.PLACED -> SHIPPED and shipped_at stamped", "the order keeps occupying its production window, so capacity is not released"]

  - method: POST
    path: "/blinds/vendor-orders/{id}/receive"
    description: "Goods arrive at the franchise. Starts the vendor remake window and releases the vendor's production slot."
    roles: [Franchisee]
    code: 200
    input: []
    output: VendorOrder
    side_effects: ["VendorOrder.SHIPPED -> RECEIVED and received_at stamped", "Vendor.open_order_count and Territory.open_order_exposure_cents re-derived downward"]

  - method: POST
    path: "/blinds/vendor-orders/{id}/remake"
    description: "Request a remake against the vendor's policy. REPLACEMENT re-manufactures the same openings on an expedited lead time and leaves the order PLACED again; FULL_CREDIT cancels the order and reverses the revenue it carried."
    roles: [Franchisee]
    code: 200
    input: [credit_scope]
    output: VendorOrder
    side_effects: ["calculations.remake_chargeback_waterfall stores the three buckets and posts a REMAKE_CHARGEBACK LedgerEntry when the territory's bucket is non-zero", "REPLACEMENT: RECEIVED -> REMAKE_REQUESTED -> PLACED in the same request, remake_count incremented, calculations.vendor_lead_time re-run with the expedite", "FULL_CREDIT: RECEIVED -> CANCELLED, every opening marked credited, and the credit branch of calculations.royalty_accrual posts a ROYALTY_REVERSAL LedgerEntry that restores Territory.royalty_accrued_cents"]

  # ---------------- Install & commissioning ----------------
  - method: POST
    path: "/blinds/install-jobs"
    description: "Schedule the installation of a received order on a designer's calendar. The motorized channel count is frozen here and decides whether commissioning is required at all."
    roles: [Franchisee, Designer]
    code: 201
    input: [vendor_order_id, designer_id, scheduled_start_at, scheduled_end_at, service_postal_code]
    output: InstallJob
    side_effects: ["install_status stamped SCHEDULED", "motorized_channel_count frozen from the order's openings", "commissioning_status stamped NOT_REQUIRED when that count is 0, otherwise PENDING", "calculations.designer_calendar_conflict_set evaluated against the designer's consultations AND install jobs together"]

  - method: GET
    path: "/blinds/install-jobs/{id}"
    description: "Read one install job with both state dimensions and the exception/liability fields."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: []
    output: InstallJob
    side_effects: []

  - method: GET
    path: "/blinds/install-jobs"
    description: "Reverse-reachability list for InstallJob.vendor_order_id and InstallJob.designer_id."
    roles: [Franchisor, Franchisee, Designer]
    code: 200
    input: ["vendor_order_id?", "designer_id?", "install_status?", "commissioning_status?", "limit?", "offset?"]
    output: InstallJob[]
    side_effects: []

  - method: POST
    path: "/blinds/install-jobs/{id}/commissioning/pair"
    description: "The designer pairs the motorized shades to the homeowner's smart-home hub and reports how many channels answered. Requires the MOTORIZATION certification."
    roles: [Designer]
    code: 200
    input: [paired_channel_count, hub_platform]
    output: InstallJob
    side_effects: ["paired_channel_count and hub_platform stored", "commissioning_attempt_count incremented", "commissioning_status PENDING -> PAIRED or FAILED -> PAIRED", "install_status is untouched - the two dimensions advance independently"]

  - method: POST
    path: "/blinds/install-jobs/{id}/commissioning/verify"
    description: "Verify the pairing against the order's motorized channel count. A shortfall is a recorded observation, not a request error: the call succeeds and lands the job in FAILED."
    roles: [Designer]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["commissioning_status PAIRED -> VERIFIED when paired_channel_count equals motorized_channel_count, otherwise PAIRED -> FAILED with the same 200", "install_status is untouched"]

  - method: POST
    path: "/blinds/install-jobs/{id}/exception"
    description: "The installer cannot fit one opening. Records the reason, apportions liability, charges the measurer when they were at fault, and drives the four-hop cascade through the opening, the vendor order, the designer's score and that designer's other bookings."
    roles: [Designer]
    code: 200
    input: [opening_id, exception_reason]
    output: InstallJob
    side_effects: ["calculations.install_exception_liability stores liable_party and remeasure_charge_cents", "a REMEASURE_CHARGEBACK LedgerEntry when the measurer is liable", "hop 1: the named Opening moves QUOTED -> REMEASURE_REQUIRED with install_outcome NOT_INSTALLED", "hop 2: its VendorOrder moves RECEIVED -> REMAKE_REQUESTED -> PLACED with the expedited lead time", "hop 3: Designer.remeasure_exception_count and remeasure_liability_score are recomputed", "hop 4: a score below SUSPENSION_THRESHOLD suspends the designer and cancels their other future consultations and install jobs", "InstallJob.SCHEDULED -> EXCEPTION_RAISED, which is terminal for this job"]

  - method: POST
    path: "/blinds/install-jobs/{id}/complete"
    description: "Sign off the installation. The join point of the two state dimensions and the moment provisional royalty is trued up to what was actually installed."
    roles: [Designer]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["InstallJob.SCHEDULED -> COMPLETED and completed_at stamped", "every still-PENDING Opening on the order moves to install_outcome INSTALLED", "the final variant of calculations.royalty_accrual posts a signed install_trueup LedgerEntry, or no row at all when the final basis equals the provisional one", "Designer.clean_install_count and remeasure_liability_score recomputed"]

  # ---------------- Test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window, lateness and lead-time rule in this domain reads. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Setting the clock is a pure test-driving operation and never re-evaluates any stored row - quote expiry, remake windows and rolling liability windows are all evaluated lazily by the next business request."
    roles: [Franchisor]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock moves to the supplied instant", "no state machine advances and no calculation re-runs as a consequence"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent, empty, or not resolvable to a known actor."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The actor's role is not in the endpoint's §1.5 roles list."
  - id: ERR_TERRITORY_OWNERSHIP_REQUIRED
    http: 403
    condition: "A Franchisee touches a row belonging to another territory."
  - id: ERR_DESIGNER_OWNERSHIP_REQUIRED
    http: 403
    condition: "A Designer acts on a consultation, sample loan, opening, quote or install job they are not assigned to."
  - id: ERR_MOTORIZATION_CERT_REQUIRED
    http: 403
    condition: "The acting designer's certifications do not include MOTORIZATION on a commissioning pair call."

  # ---- existence ----
  - id: ERR_TERRITORY_NOT_FOUND
    http: 404
    condition: "No Territory with the given id."
  - id: ERR_DESIGNER_NOT_FOUND
    http: 404
    condition: "No Designer with the given id."
  - id: ERR_SAMPLE_KIT_NOT_FOUND
    http: 404
    condition: "No SampleKit with the given id."
  - id: ERR_LEAD_NOT_FOUND
    http: 404
    condition: "No Lead with the given id."
  - id: ERR_CONSULTATION_NOT_FOUND
    http: 404
    condition: "No Consultation with the given id."
  - id: ERR_SAMPLE_CHECKOUT_NOT_FOUND
    http: 404
    condition: "No SampleCheckout with the given id."
  - id: ERR_OPENING_NOT_FOUND
    http: 404
    condition: "No Opening with the given id, including an unresolvable replaces_opening_id or exception opening_id."
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "No Quote with the given id."
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "No Vendor with the given id, including an unresolvable preferred_vendor_id."
  - id: ERR_VENDOR_ORDER_NOT_FOUND
    http: 404
    condition: "No VendorOrder with the given id."
  - id: ERR_INSTALL_JOB_NOT_FOUND
    http: 404
    condition: "No InstallJob with the given id."

  # ---- request shape / domain ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, undeclared enum member, malformed ISO 8601 instant, or an array violating its cardinality or duplicate rule."
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "A numeric field outside its declared domain, or an interval whose end does not follow its start, or a hold starting before the logical clock."

  # ---- referential integrity ----
  - id: ERR_CROSS_TERRITORY_FORBIDDEN
    http: 422
    condition: "A linkage spans two territories: designer and lead, kit and consultation, or designer and order."
  - id: ERR_OPENING_NOT_ON_QUOTE
    http: 422
    condition: "A named opening does not belong to the quote, order or consultation it is being used with."
  - id: ERR_NO_ELIGIBLE_VENDOR
    http: 422
    condition: "The routing selector's eligible pool is empty, or the pinned preferred vendor fails the status, lift-system or hub-platform conditions."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_CONSULTATION_VERSION
    http: 412
    condition: "expected_consultation_version does not match the current Consultation.version on quote creation."
  - id: ERR_STALE_QUOTE_VERSION
    http: 412
    condition: "expected_quote_version does not match the current Quote.version on vendor-order placement."

  # ---- state preconditions ----
  - id: ERR_TERRITORY_NOT_ACTIVE
    http: 409
    condition: "The owning territory is PROBATION, SUSPENDED or TERMINATED."
  - id: ERR_DESIGNER_NOT_ACTIVE
    http: 409
    condition: "The named designer is SUSPENDED or INACTIVE."
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "A PRESENTED quote is acted on at or after its expires_at; the quote is flipped to EXPIRED and the request then fails."
  - id: ERR_QUOTE_NOT_DRAFT
    http: 409
    condition: "Presentation attempted on a quote that is not DRAFT."
  - id: ERR_QUOTE_NOT_PRESENTED
    http: 409
    condition: "Revision or acceptance attempted on a quote that is not PRESENTED."
  - id: ERR_QUOTE_NOT_ACCEPTED
    http: 409
    condition: "Vendor-order placement attempted against a quote that is not ACCEPTED."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "Revision attempted when revision_count already equals QUOTE_MAX_REVISIONS."
  - id: ERR_QUOTE_HAS_NO_OPENINGS
    http: 422
    condition: "Quote creation on a consultation with no CONFIGURED opening to attach."
  - id: ERR_CONSULTATION_NOT_SCHEDULED
    http: 409
    condition: "Close-out, no-show or sample check-out attempted on a consultation that is not SCHEDULED."
  - id: ERR_CONSULTATION_CLOSED
    http: 409
    condition: "Measuring, configuring or quoting attempted on a CANCELLED or NO_SHOW consultation."
  - id: ERR_KIT_NOT_AVAILABLE
    http: 409
    condition: "Check-out attempted on a kit that is ON_LOAN or LOST."
  - id: ERR_CHECKOUT_NOT_OPEN
    http: 409
    condition: "Return attempted on a check-out already RETURNED or LOST."
  - id: ERR_OPENING_NOT_MEASURED
    http: 409
    condition: "Configuration attempted on an opening that is QUOTED or REMEASURE_REQUIRED."
  - id: ERR_OPENING_ALREADY_ORDERED
    http: 409
    condition: "An opening named for placement already sits on a non-cancelled vendor order."
  - id: ERR_ORDER_NOT_SHIPPABLE
    http: 409
    condition: "Ship attempted on an order that is not PLACED."
  - id: ERR_ORDER_NOT_SHIPPED
    http: 409
    condition: "Receive attempted on an order that is not SHIPPED."
  - id: ERR_ORDER_NOT_RECEIVED
    http: 409
    condition: "Remake requested, or an install scheduled, on an order that is not RECEIVED."
  - id: ERR_INSTALL_JOB_NOT_SCHEDULED
    http: 409
    condition: "Commissioning, exception or completion attempted on a job whose install_status is not SCHEDULED."
  - id: ERR_COMMISSIONING_NOT_APPLICABLE
    http: 409
    condition: "Pair attempted when commissioning_status is NOT_REQUIRED, PAIRED or VERIFIED."
  - id: ERR_COMMISSIONING_NOT_PAIRED
    http: 409
    condition: "Verify attempted when commissioning_status is not PAIRED."
  - id: ERR_COMMISSIONING_NOT_VERIFIED
    http: 409
    condition: "Completion attempted while commissioning_status is PENDING, PAIRED or FAILED."

  # ---- safety / compliance ----
  - id: ERR_CORD_HAZARD_NOT_PERMITTED
    http: 422
    condition: "An opening in a nursery or bedroom, or any opening on a lead that declared a child-occupied dwelling, is presented, accepted or ordered with a CORDED or CONTINUOUS_LOOP lift."
  - id: ERR_INSUFFICIENT_MOUNT_DEPTH
    http: 422
    condition: "An INSIDE mount is recorded with depth_in below MIN_INSIDE_DEPTH_IN."
  - id: ERR_HUB_PLATFORM_UNSUPPORTED
    http: 422
    condition: "The reported hub platform is not among the manufacturing vendor's supported_hub_platforms."

  # ---- constraints ----
  - id: ERR_CHANNEL_COUNT_EXCEEDS_ORDER
    http: 422
    condition: "paired_channel_count exceeds the job's frozen motorized_channel_count."
  - id: ERR_COMMISSIONING_ATTEMPT_LIMIT
    http: 409
    condition: "A pair call is made when commissioning_attempt_count already equals COMMISSIONING_MAX_ATTEMPTS."
  - id: ERR_MOTOR_OPTION_MISMATCH
    http: 422
    condition: "motorization_option is set on a non-motorized lift, or left NONE on a MOTORIZED lift."
  - id: ERR_REMAKE_NOT_OFFERED
    http: 422
    condition: "A remake is requested from a vendor whose remake_policy is NO_REMAKE."
  - id: ERR_REMAKE_LIMIT_REACHED
    http: 409
    condition: "A remake is requested when remake_count already equals ORDER_MAX_REMAKES."
  - id: ERR_OPENINGS_ALREADY_RESOLVED
    http: 409
    condition: "A FULL_CREDIT remake is requested on an order whose openings have already been resolved by an install."

  # ---- temporal ----
  - id: ERR_DESIGNER_CALENDAR_CONFLICT
    http: 409
    condition: "The requested consultation or install window collides with one of that designer's SCHEDULED bookings, including the conditional 45-minute travel buffer between different postal codes."
  - id: ERR_SAMPLE_KIT_HOLD_CONFLICT
    http: 409
    condition: "The requested closed hold interval overlaps a hold already recorded on the same kit."
  - id: ERR_VENDOR_CAPACITY_EXCEEDED
    http: 409
    condition: "Placing the order would push some calendar date in its production window past the vendor's concurrent_capacity."
  - id: ERR_REMAKE_WINDOW_CLOSED
    http: 409
    condition: "A FULL_VENDOR_90D remake is requested more than VENDOR_REMAKE_WINDOW_DAYS after receipt."

  # ---- fiscal ----
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "The new order's cost would push the territory's open exposure past its credit limit."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Franchisor
    description: "Brand headquarters. Charters territories, onboards manufacturers, drives the logical clock and reads every royalty ledger. Deliberately NOT a superset: headquarters never measures, quotes, installs or commissions."
    identity: "opaque"
    exclusive_operations:
      - "POST /blinds/territories"
      - "PATCH /blinds/territories/{id}"
      - "POST /blinds/vendors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /blinds/leads (shared with Franchisee - the national call centre and the local office both intake)"
      - "GET on territories, ledger-entries, designers, sample-kits, leads, consultations, sample-checkouts, openings, quotes, vendors, vendor-orders and install-jobs"

  - name: Franchisee
    description: "Owner-operator of exactly one Territory. Hires and reinstates designers, stocks the sample library, places and settles manufacturing orders, and carries the credit limit and the royalty obligation."
    identity: "entity_backed:Territory"
    exclusive_operations:
      - "POST /blinds/designers"
      - "PATCH /blinds/designers/{id}"
      - "POST /blinds/sample-kits"
      - "POST /blinds/vendor-orders"
      - "POST /blinds/vendor-orders/{id}/receive"
      - "POST /blinds/vendor-orders/{id}/remake"
    shared_operations:
      - "POST /blinds/leads (shared with Franchisor)"
      - "POST /blinds/consultations (shared with Designer)"
      - "POST /blinds/install-jobs (shared with Designer)"
      - "GET on every collection, restricted by §1.4 priority 5 to rows of their own territory"

  - name: Designer
    description: "The person in the home. Runs the appointment, borrows sample kits, measures and configures openings, builds and presents quotes, installs, commissions motorized shades and raises install exceptions. Every write is gated on being the assigned designer."
    identity: "entity_backed:Designer"
    exclusive_operations:
      - "POST /blinds/consultations/{id}/complete"
      - "POST /blinds/consultations/{id}/no-show"
      - "POST /blinds/sample-checkouts"
      - "POST /blinds/sample-checkouts/{id}/return"
      - "POST /blinds/openings"
