# =============================================================================
# SCAFFOLD.yaml — Boiler & Pressure-Vessel Inspection (Expert)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in siblings.
# =============================================================================

scenario: "Boiler & Pressure-Vessel Inspection: vessel registration & class, inspection interval & jurisdiction number, inspector & National Board report, deficiency & repair order, certificate & fee, insurance-inspector coordination, incident report, renewal"

domain_name: boiler-pressure-vessel-inspection

# Flat topology: peer top-level collections linked by foreign keys, no nesting
# in URL paths. api_prefix is empty because there is no single owning resource.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # flat: Vessel, Inspection, Deficiency, Certificate, FeeInvoice, etc. are peer
  # collections joined by FK fields; jurisdiction numbers / national-board numbers
  # are business identifiers carried in bodies, never URL nesting.

  state_machine_shape: parallel
  # Vessel carries two independent dimensions (registration_status x service_status).
  # Inspection is branching (fork on result); Deficiency is cyclic (reinspect loop).

  relationship_patterns:
    - one_to_many          # Vessel -> Inspection, Inspection -> Deficiency
    - cross_aggregate      # Certificate references Inspection; FeeInvoice references Certificate
    - self_referential     # Certificate.supersedes_certificate_id -> Certificate

  role_model: segregation_of_duties
  # The Inspector who raised a Deficiency (via the originating Inspection) may not
  # be the Inspector who clears it on reinspection (tracked by X-User-ID).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  # --- Configuration -------------------------------------------------------
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Two-letter jurisdiction code, e.g. 'CA', 'TX'."
        constraints: "unique; uppercase A-Z, length 2"
      - name: name
        type: string
        source: input
        description: "Human-readable jurisdiction name."
      - name: admin_fee_pct
        type: number
        source: input
        default: 0.075
        description: "Administrative surcharge applied per fee line item. Default 0.075 (7.5%)."
        constraints: ">= 0 and <= 1"
      - name: interval_months_override
        type: integer
        source: input
        default: null
        description: "If set, overrides the class-default inspection interval (months) for all vessels in this jurisdiction. null = use class default."
        constraints: "null or >= 1"
      - name: collected_fees_cents
        type: integer
        source: computed
        default: 0
        description: "Named conserved money quantity = sum(FeeInvoice.amount_paid_cents) - sum(FeeInvoice.refunded_cents) over all invoices whose vessel is in this jurisdiction. Credited on pay, debited on refund (invariant A)."

  - name: InsuranceCompany
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Insurer legal name."
      - name: nb_accreditation_number
        type: string
        source: input
        description: "National Board accreditation number of the insuring company."
        constraints: "unique"

  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Vessel owner / operator legal name."
      - name: contact_email
        type: string
        source: input
        description: "Owner contact email."

  # --- Actors --------------------------------------------------------------
  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Inspector full name."
      - name: commission_number
        type: string
        source: input
        description: "National Board commission number."
        constraints: "unique"
      - name: inspector_type
        type: enum
        source: input
        description: "JURISDICTION = state/province employed; INSURANCE = insurance-company employed."
        constraints: "one of {JURISDICTION, INSURANCE}"
      - name: insurance_company_id
        type: string
        source: input
        default: null
        description: "FK -> InsuranceCompany.id; required when inspector_type=INSURANCE, must be null when JURISDICTION."
      - name: commissioning_jurisdiction_id
        type: string
        source: input
        default: null
        description: "FK -> Jurisdiction.id; the jurisdiction in which this inspector holds (or seeks) a commission."
      - name: status
        type: enum
        source: system
        description: "Coordination status: PENDING (registered, not yet commissioned), COMMISSIONED (accepted by jurisdiction), SUSPENDED."
        constraints: "one of {PENDING, COMMISSIONED, SUSPENDED}; initial PENDING"

  # --- Core resources ------------------------------------------------------
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; owner of this vessel."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; jurisdiction of registration."
      - name: manufacturer
        type: string
        source: input
        description: "Manufacturer name."
      - name: national_board_number
        type: string
        source: input
        description: "The National Board number stamped on the vessel by the manufacturer."
        constraints: "unique"
      - name: vessel_class
        type: enum
        source: input
        description: "POWER_BOILER, HEATING_BOILER, or PRESSURE_VESSEL."
        constraints: "one of {POWER_BOILER, HEATING_BOILER, PRESSURE_VESSEL}"
      - name: mawp_psig
        type: integer
        source: input
        description: "Maximum allowable working pressure, in psig."
        constraints: ">= 1"
      - name: installed_at
        type: datetime
        source: input
        description: "Installation date (ISO 8601 UTC); used for age-based risk."
      - name: jurisdiction_number
        type: string
        source: computed
        default: null
        description: "Sequential jurisdiction registration number assigned at registration: '<code>-<zero-padded 6-digit sequence per jurisdiction>'. null until REGISTERED."
      - name: registration_status
        type: enum
        source: system
        description: "Registration dimension: DRAFT, REGISTERED, RETIRED."
        constraints: "one of {DRAFT, REGISTERED, RETIRED}; initial DRAFT"
      - name: service_status
        type: enum
        source: system
        description: "Service dimension (independent of registration_status): NOT_IN_SERVICE, IN_SERVICE, RESTRICTED, SUSPENDED, OUT_OF_SERVICE."
        constraints: "one of {NOT_IN_SERVICE, IN_SERVICE, RESTRICTED, SUSPENDED, OUT_OF_SERVICE}; initial NOT_IN_SERVICE"
      - name: current_certificate_id
        type: string
        source: computed
        default: null
        description: "FK -> Certificate.id; the vessel's currently ACTIVE certificate, or null."
      - name: open_deficiency_count
        type: integer
        source: computed
        default: 0
        description: "Count of Deficiency rows on this vessel in a non-terminal state {OPEN, UNDER_REPAIR, REINSPECTION}. Conserved-quantity anchor for the deficiency-count invariant."
      - name: open_critical_deficiency_count
        type: integer
        source: computed
        default: 0
        description: "Count of non-terminal Deficiency rows on this vessel with severity=CRITICAL."
      - name: risk_score_standard
        type: integer
        source: computed
        default: null
        description: "STANDARD (chronological) risk score in [0,100]; excludes deficiencies currently in REINSPECTION. Recomputed on inspection/deficiency/incident changes."
      - name: risk_score_forecast
        type: integer
        source: computed
        default: null
        description: "FORECAST (forward-looking) risk score in [0,100]; includes REINSPECTION deficiencies at full weight. Recomputed on the same events."

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the insured vessel."
      - name: insurance_company_id
        type: string
        source: input
        description: "FK -> InsuranceCompany.id; the insurer."
      - name: coverage_start
        type: datetime
        source: input
        description: "Coverage window start (ISO 8601 UTC, inclusive)."
      - name: coverage_end
        type: datetime
        source: input
        description: "Coverage window end (ISO 8601 UTC, inclusive). Coverage is a CLOSED interval [coverage_start, coverage_end]."
      - name: status
        type: enum
        source: system
        description: "ACTIVE, EXPIRED, CANCELLED."
        constraints: "one of {ACTIVE, EXPIRED, CANCELLED}; initial ACTIVE"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel under inspection."
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; the assigned inspector."
      - name: inspection_type
        type: enum
        source: input
        description: "INTERNAL, EXTERNAL, or SPECIAL (incident-triggered)."
        constraints: "one of {INTERNAL, EXTERNAL, SPECIAL}"
      - name: is_special
        type: boolean
        source: computed
        default: false
        description: "True when inspection_type=SPECIAL (incident-driven); drives the FINAL fee incident surcharge."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Scheduled window start (ISO 8601 UTC). Inspector-occupancy interval is HALF-OPEN [scheduled_start, scheduled_end)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Scheduled window end (ISO 8601 UTC), exclusive."
      - name: status
        type: enum
        source: system
        description: "SCHEDULED, PASSED, PASSED_WITH_DEFICIENCIES, FAILED, CANCELLED."
        constraints: "one of {SCHEDULED, PASSED, PASSED_WITH_DEFICIENCIES, FAILED, CANCELLED}; initial SCHEDULED"
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: "PROVISIONAL certificate fee variant computed at scheduling (0 deficiencies, no incident surcharge)."
      - name: result_recorded_at
        type: datetime
        source: computed
        default: null
        description: "Clock time the result transition fired; null while SCHEDULED."

  - name: NationalBoardReport
    parent: null
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection this report documents."
      - name: report_number
        type: string
        source: input
        description: "National Board report form number (e.g. Form NB-6)."
        constraints: "unique"
      - name: filed_by_inspector_id
        type: string
        source: system
        description: "FK -> Inspector.id; the inspector (X-User-ID) who filed the report."
      - name: findings_summary
        type: string
        source: input
        description: "Free-text summary of findings."

  - name: Deficiency
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the originating inspection."
      - name: vessel_id
        type: string
        source: system
        description: "FK -> Vessel.id; denormalized from the originating inspection for reverse lookup."
      - name: repair_order_id
        type: string
        source: system
        default: null
        description: "FK -> RepairOrder.id; the repair order addressing this deficiency, or null."
      - name: severity
        type: enum
        source: input
        description: "CRITICAL (bars certificate / forces OUT_OF_SERVICE) or NON_CRITICAL (RESTRICTED)."
        constraints: "one of {CRITICAL, NON_CRITICAL}"
      - name: description
        type: string
        source: input
        description: "What was found."
      - name: status
        type: enum
        source: system
        description: "OPEN, UNDER_REPAIR, REINSPECTION, CLEARED, WITHDRAWN."
        constraints: "one of {OPEN, UNDER_REPAIR, REINSPECTION, CLEARED, WITHDRAWN}; initial OPEN"

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel being repaired."
      - name: deficiency_ids
        type: array
        source: input
        description: "Deficiency.id values this order addresses (all must belong to vessel_id and be OPEN)."
      - name: description
        type: string
        source: input
        description: "Scope of the repair."
      - name: status
        type: enum
        source: system
        description: "IN_PROGRESS, COMPLETED, CANCELLED."
        constraints: "one of {IN_PROGRESS, COMPLETED, CANCELLED}; initial IN_PROGRESS"

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the certified vessel."
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the passing inspection this certificate rests on."
      - name: fee_invoice_id
        type: string
        source: input
        description: "FK -> FeeInvoice.id; the PAID fee invoice covering this certificate."
      - name: supersedes_certificate_id
        type: string
        source: input
        default: null
        description: "FK -> Certificate.id; the prior certificate this renewal supersedes, or null for a first issuance."
      - name: valid_from
        type: datetime
        source: computed
        description: "Issuance date (clock now), inclusive."
      - name: valid_until
        type: datetime
        source: computed
        description: "valid_from + interval_months(class/jurisdiction). A vessel is OVERDUE when clock now >= valid_until (>=)."
      - name: status
        type: enum
        source: system
        description: "ACTIVE, EXPIRED, SUPERSEDED, REVOKED."
        constraints: "one of {ACTIVE, EXPIRED, SUPERSEDED, REVOKED}; initial ACTIVE"

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel the fee is billed against."
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection whose FINAL fee this invoice bills."
      - name: certificate_id
        type: string
        source: system
        default: null
        description: "FK -> Certificate.id; set when a certificate is issued against this invoice, else null."
      - name: amount_cents
        type: integer
        source: computed
        description: "FINAL certificate fee variant (actual deficiency surcharge + incident surcharge)."
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Cents actually paid (equals amount_cents once PAID, 0 before)."
      - name: refunded_cents
        type: integer
        source: computed
        default: 0
        description: "Cents refunded (equals amount_cents once REFUNDED)."
      - name: status
        type: enum
        source: system
        description: "UNPAID, PAID, REFUNDED, VOID."
        constraints: "one of {UNPAID, PAID, REFUNDED, VOID}; initial UNPAID"

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel involved."
      - name: triggered_inspection_id
        type: string
        source: system
        default: null
        description: "FK -> Inspection.id; a SPECIAL inspection auto-created for CRITICAL incidents, else null."
      - name: severity
        type: enum
        source: input
        description: "MINOR or CRITICAL. CRITICAL suspends the vessel and cascades."
        constraints: "one of {MINOR, CRITICAL}"
      - name: occurred_at
        type: datetime
        source: input
        description: "When the incident occurred (ISO 8601 UTC)."
      - name: narrative
        type: string
        source: input
        description: "Description of the incident."

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:
  # ===== Vessel: PARALLEL dimensions (registration_status x service_status) ==
  - entity: Vessel
    dimension: registration_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /vessels/{vesselId}/register"
        actor: JurisdictionAdmin
        preconditions:
          - "vessel.registration_status == DRAFT"
          - "national_board_number is present and unique"
        side_effects:
          - "assign jurisdiction_number = '<jurisdiction.code>-<next 6-digit zero-padded sequence within that jurisdiction>'"
          - "increments Vessel.version by 1"
        note: "Registration is independent of service_status, which stays NOT_IN_SERVICE."
      - from: REGISTERED
        to: RETIRED
        trigger: "POST /vessels/{vesselId}/retire"
        actor: JurisdictionAdmin
        preconditions:
          - "vessel.registration_status == REGISTERED"
          - "vessel.service_status != SUSPENDED"
        side_effects:
          - "if an ACTIVE Certificate exists, transition it to REVOKED"
          - "set service_status = OUT_OF_SERVICE"
          - "increments Vessel.version by 1"

  - entity: Vessel
    dimension: service_status
    initial_state: NOT_IN_SERVICE
    terminal_states: []
    transitions:
      - from: NOT_IN_SERVICE
        to: IN_SERVICE
        trigger: "POST /certificates (first ACTIVE certificate issued)"
        actor: JurisdictionAdmin
        preconditions:
          - "vessel.registration_status == REGISTERED"
          - "referenced Inspection.status == PASSED"
          - "vessel.open_critical_deficiency_count == 0"
        side_effects:
          - "set current_certificate_id = new certificate id"
          - "recompute risk_score_standard and risk_score_forecast"
      - from: IN_SERVICE
        to: RESTRICTED
        trigger: "POST /inspections/{inspectionId}/result (result=PASS_WITH_DEFICIENCIES)"
        actor: Inspector
        preconditions:
          - "at least one NON_CRITICAL deficiency raised and zero CRITICAL"
        side_effects:
          - "recompute open_deficiency_count, risk scores"
      - from: RESTRICTED
        to: IN_SERVICE
        trigger: "POST /deficiencies/{deficiencyId}/reinspect (outcome=PASS) clearing the last non-terminal deficiency"
        actor: Inspector
        preconditions:
          - "after this clear, vessel.open_deficiency_count == 0"
        side_effects:
          - "recompute risk scores"
        note: "Bubble-up: fires only when the cleared deficiency was the vessel's last non-terminal one (cascade 2, link 2)."
      - from: IN_SERVICE
        to: SUSPENDED
        trigger: "POST /vessels/{vesselId}/incidents (severity=CRITICAL)"
        actor: Owner
        preconditions:
          - "vessel.service_status IN {IN_SERVICE, RESTRICTED}"
        side_effects:
          - "revoke ACTIVE certificate (cascade 1, link 2)"
          - "auto-create a SPECIAL Inspection in SCHEDULED, store its id on the incident's triggered_inspection_id"
          - "recompute risk scores (SUSPENDED adds SUSPENDED_PENALTY)"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /vessels/{vesselId}/incidents (severity=CRITICAL)"
        actor: Owner
        preconditions:
          - "vessel.service_status IN {IN_SERVICE, RESTRICTED}"
        side_effects:
          - "revoke ACTIVE certificate (cascade 1, link 2)"
          - "auto-create a SPECIAL Inspection in SCHEDULED"
          - "recompute risk scores"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /inspections/{inspectionId}/result (result=FAIL)"
        actor: Inspector
        preconditions:
          - "at least one CRITICAL deficiency raised"
        side_effects:
          - "recompute risk scores"
      - from: SUSPENDED
        to: IN_SERVICE
        trigger: "POST /vessels/{vesselId}/reinstate"
        actor: JurisdictionAdmin
        preconditions:
          - "the vessel's SPECIAL Inspection.status == PASSED"
          - "vessel.open_critical_deficiency_count == 0"
        side_effects:
          - "recompute risk scores"

  # ===== Inspector: coordination (insurance-inspector) ======================
  - entity: Inspector
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: COMMISSIONED
        trigger: "POST /inspectors/{inspectorId}/commission"
        actor: JurisdictionAdmin
        preconditions:
          - "inspector.commissioning_jurisdiction_id is set"
          - "if inspector_type=INSURANCE, insurance_company_id is set"
        side_effects:
          - "increments Inspector.version by 1"
      - from: COMMISSIONED
        to: SUSPENDED
        trigger: "POST /inspectors/{inspectorId}/suspend"
        actor: JurisdictionAdmin
        preconditions: ["inspector.status == COMMISSIONED"]
        side_effects: ["increments Inspector.version by 1"]
      - from: SUSPENDED
        to: COMMISSIONED
        trigger: "POST /inspectors/{inspectorId}/commission"
        actor: JurisdictionAdmin
        preconditions: ["inspector.status == SUSPENDED"]
        side_effects: ["increments Inspector.version by 1"]

  # ===== InsurancePolicy ====================================================
  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /insurance-policies/{policyId}/cancel"
        actor: JurisdictionAdmin
        preconditions: ["policy.status == ACTIVE"]
        side_effects: ["increments InsurancePolicy.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /insurance-policies/{policyId}/expire"
        actor: JurisdictionAdmin
        preconditions:
          - "policy.status == ACTIVE"
          - "clock now > coverage_end (strictly after the inclusive closed-interval end)"
        side_effects: ["increments InsurancePolicy.version by 1"]

  # ===== Inspection: BRANCHING (fork on result) =============================
  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, PASSED_WITH_DEFICIENCIES, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{inspectionId}/result (result=PASS)"
        actor: Inspector
        preconditions:
          - "acting inspector.id == inspection.inspector_id"
          - "no deficiencies were attached to this inspection"
        side_effects:
          - "set result_recorded_at = clock now"
          - "recompute vessel risk scores"
        note: "PASS branch: makes vessel eligible for certificate issuance."
      - from: SCHEDULED
        to: PASSED_WITH_DEFICIENCIES
        trigger: "POST /inspections/{inspectionId}/result (result=PASS_WITH_DEFICIENCIES)"
        actor: Inspector
        preconditions:
          - "acting inspector.id == inspection.inspector_id"
          - "one or more NON_CRITICAL deficiencies attached, zero CRITICAL"
        side_effects:
          - "set result_recorded_at = clock now"
          - "vessel.service_status: IN_SERVICE -> RESTRICTED (divergent side-effect vs PASS)"
          - "recompute open_deficiency_count and risk scores"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{inspectionId}/result (result=FAIL)"
        actor: Inspector
        preconditions:
          - "acting inspector.id == inspection.inspector_id"
          - "one or more CRITICAL deficiencies attached"
        side_effects:
          - "set result_recorded_at = clock now"
          - "vessel.service_status: IN_SERVICE -> OUT_OF_SERVICE (divergent side-effect vs PASS)"
          - "recompute open_critical_deficiency_count and risk scores"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: certificate revocation cascade OR POST /inspections/{inspectionId}/cancel"
        actor: system
        preconditions: ["inspection.status == SCHEDULED"]
        side_effects: ["no fee is billed for a cancelled inspection"]

  # ===== Deficiency: CYCLIC (reinspect loop) ================================
  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [CLEARED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REPAIR
        trigger: "POST /repair-orders (deficiency listed in deficiency_ids)"
        actor: Owner
        preconditions: ["deficiency.status == OPEN"]
        side_effects:
          - "set deficiency.repair_order_id = new repair order id"
      - from: UNDER_REPAIR
        to: REINSPECTION
        trigger: "POST /repair-orders/{repairOrderId}/complete"
        actor: Owner
        preconditions: ["parent RepairOrder.status == IN_PROGRESS"]
        side_effects:
          - "cascade 2, link 1: each linked deficiency UNDER_REPAIR -> REINSPECTION"
          - "recompute vessel.open_deficiency_count is unchanged (still non-terminal); risk_score_standard drops (REINSPECTION excluded) while risk_score_forecast unchanged"
      - from: REINSPECTION
        to: CLEARED
        trigger: "POST /deficiencies/{deficiencyId}/reinspect (outcome=PASS)"
        actor: Inspector
        preconditions:
          - "deficiency.status == REINSPECTION"
          - "acting inspector.id != originating Inspection.inspector_id (segregation of duties)"
        side_effects:
          - "decrement vessel.open_deficiency_count (and open_critical_deficiency_count if CRITICAL)"
          - "if this was the vessel's last non-terminal deficiency and service_status==RESTRICTED, set service_status=IN_SERVICE (cascade 2, link 2)"
          - "recompute risk scores"
      - from: REINSPECTION
        to: OPEN
        trigger: "POST /deficiencies/{deficiencyId}/reinspect (outcome=FAIL)"
        actor: Inspector
        preconditions:
          - "deficiency.status == REINSPECTION"
          - "acting inspector.id != originating Inspection.inspector_id (segregation of duties)"
        side_effects:
          - "clear deficiency.repair_order_id back to null (loop: a fresh repair order may be raised)"
          - "recompute risk scores"
        note: "Cyclic edge — a failed reinspection returns the deficiency to OPEN."
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /deficiencies/{deficiencyId}/withdraw"
        actor: Inspector
        preconditions:
          - "deficiency.status == OPEN"
          - "acting inspector.id == originating Inspection.inspector_id (only the raising inspector may retract an erroneously-raised deficiency)"
        side_effects:
          - "decrement vessel.open_deficiency_count (and open_critical_deficiency_count if CRITICAL) — compensating action for the raise (invariant B)"
          - "recompute risk scores"

  # ===== RepairOrder ========================================================
  - entity: RepairOrder
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /repair-orders/{repairOrderId}/complete"
        actor: Owner
        preconditions:
          - "repair_order.status == IN_PROGRESS"
          - "acting owner.id == vessel.owner_id"
        side_effects:
          - "cascade 2, link 1: each linked deficiency UNDER_REPAIR -> REINSPECTION"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /repair-orders/{repairOrderId}/cancel"
        actor: Owner
        preconditions: ["repair_order.status == IN_PROGRESS"]
        side_effects:
          - "each linked deficiency UNDER_REPAIR -> OPEN; clear its repair_order_id"

  # ===== Certificate ========================================================
  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED, SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /certificates with supersedes_certificate_id pointing at this ACTIVE certificate (renewal)"
        actor: JurisdictionAdmin
        preconditions: ["old certificate.status == ACTIVE"]
        side_effects:
          - "new ACTIVE certificate becomes vessel.current_certificate_id"
      - from: ACTIVE
        to: REVOKED
        trigger: "system: CRITICAL incident cascade OR POST /certificates/{certificateId}/revoke"
        actor: JurisdictionAdmin
        preconditions: ["certificate.status == ACTIVE"]
        side_effects:
          - "cascade 1, link 3: cancel the vessel's SCHEDULED non-SPECIAL inspections (SCHEDULED -> CANCELLED)"
          - "clear vessel.current_certificate_id"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /certificates/{certificateId}/expire"
        actor: JurisdictionAdmin
        preconditions:
          - "certificate.status == ACTIVE"
          - "clock now >= certificate.valid_until (>= boundary — at exactly valid_until the certificate is expired)"
        side_effects:
          - "clear vessel.current_certificate_id"

  # ===== FeeInvoice =========================================================
  - entity: FeeInvoice
    initial_state: UNPAID
    terminal_states: [REFUNDED, VOID]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /fee-invoices/{feeInvoiceId}/pay"
        actor: Owner
        preconditions:
          - "invoice.status == UNPAID"
          - "acting owner.id == vessel.owner_id"
        side_effects:
          - "set amount_paid_cents = amount_cents"
          - "increment jurisdiction.collected_fees_cents by amount_cents (invariant A forward action)"
      - from: PAID
        to: REFUNDED
        trigger: "POST /fee-invoices/{feeInvoiceId}/refund"
        actor: JurisdictionAdmin
        preconditions:
          - "invoice.status == PAID"
          - "no ACTIVE Certificate references this invoice (certificate must be REVOKED/SUPERSEDED/EXPIRED first)"
        side_effects:
          - "set refunded_cents = amount_cents"
          - "decrement jurisdiction.collected_fees_cents by amount_cents (invariant A compensating action — net zero)"
      - from: UNPAID
        to: VOID
        trigger: "POST /fee-invoices/{feeInvoiceId}/void"
        actor: JurisdictionAdmin
        preconditions: ["invoice.status == UNPAID"]
        side_effects: ["no ledger effect (was never paid)"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: cert-issue-stale-vessel
    parent_entity: Vessel
    write_endpoint: "POST /certificates"
    occ_field: "expected_vessel_version"
    description: |
      Issuing a Certificate against a Vessel whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already issued a certificate for the vessel (which legitimately
      becomes the current certificate and bumps the vessel version); the current
      writer's view of the vessel is therefore stale and the new issuance must not
      silently create a second ACTIVE certificate.
    error_id: ERR_STALE_VESSEL_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:
  - name: certificate_fee
    trigger: "PROVISIONAL variant on POST /inspections (stored as Inspection.provisional_fee_cents); FINAL variant on POST /fee-invoices (stored as FeeInvoice.amount_cents)."
    algorithm: tiered_pricing
    formula: |
      # Line items, in this fixed order:
      #   L1 = BASE_FEE_BY_CLASS[vessel.vessel_class]
      #   L2 = MAWP_TIER_FEE(vessel.mawp_psig)
      #   L3 = DEFICIENCY_SURCHARGE_PER * (count of NON_CRITICAL deficiencies attached
      #        to the inspection whose status != WITHDRAWN)      # FINAL only; 0 for PROVISIONAL
      #   L4 = INCIDENT_SPECIAL_SURCHARGE if inspection.is_special else 0  # FINAL only; 0 for PROVISIONAL
      # admin_pct = vessel.jurisdiction -> Jurisdiction.admin_fee_pct
      # ROUNDING ORDER IS PINNED: round EACH line to whole cents (round_half_up),
      # THEN sum. (round-per-line-then-sum, NOT sum-then-round.)
      #   per_line[i] = round_half_up(L[i] * (1 + admin_pct))
      #   fee_cents   = sum(per_line[i] for each non-zero line)
      # MAWP_TIER_FEE(p): p <= 15 -> 0 ; 15 < p <= 150 -> 4500 ;
      #                   150 < p <= 600 -> 12000 ; p > 600 -> 25000
    input_set: "PROVISIONAL: L1+L2 only (L3=L4=0), computed at scheduling. FINAL: L1+L2+L3+L4, computed at fee-invoice creation using the ACTUAL non-withdrawn NON_CRITICAL deficiency count on the inspection and its is_special flag."
    constants:
      BASE_FEE_BY_CLASS: { POWER_BOILER: 20000, HEATING_BOILER: 10000, PRESSURE_VESSEL: 15000 }
      MAWP_TIER_FEE: { LOW_LE_15: 0, MEDIUM_LE_150: 4500, HIGH_LE_600: 12000, EXTREME_GT_600: 25000 }
      DEFICIENCY_SURCHARGE_PER: 2500
      INCIDENT_SPECIAL_SURCHARGE: 30000
      DEFAULT_ADMIN_FEE_PCT: 0.075
    precision: "whole cents, round_half_up, applied PER LINE then summed"
    variants:
      - name: PROVISIONAL
        when: "computed at inspection scheduling (POST /inspections)"
        difference: "uses zero deficiency surcharge and zero incident surcharge (L3=L4=0); an estimate before findings exist."
      - name: FINAL
        when: "computed at fee-invoice creation (POST /fee-invoices), after the inspection result is recorded"
        difference: "adds L3 (actual non-withdrawn NON_CRITICAL deficiency count x surcharge) and L4 (incident special surcharge); diverges from PROVISIONAL whenever deficiencies were found or the inspection is_special."

  - name: vessel_risk_score
    trigger: "recomputed as a derived field on Vessel after any inspection result, deficiency status change, incident filing, or reinstatement; stored in risk_score_standard and risk_score_forecast."
    algorithm: weighted_scoring
    formula: |
      base = BASE_BY_CLASS[vessel.vessel_class]
      age_years = floor((clock_now - vessel.installed_at) in days / 365)
      age_factor = 0  if age_years < 5
                   10 if 5  <= age_years < 15
                   20 if 15 <= age_years < 30
                   35 if age_years >= 30
      # Deficiency inclusion set is the ONLY difference between variants:
      #   STANDARD : deficiencies in {OPEN, UNDER_REPAIR}          (REINSPECTION EXCLUDED)
      #   FORECAST : deficiencies in {OPEN, UNDER_REPAIR, REINSPECTION}  (REINSPECTION INCLUDED)
      crit    = count of included deficiencies with severity=CRITICAL
      noncrit = count of included deficiencies with severity=NON_CRITICAL
      deficiency_weight = CRIT_WEIGHT*crit + NONCRIT_WEIGHT*noncrit
      incident_penalty  = INCIDENT_PENALTY_PER * (count of IncidentReport on vessel with occurred_at within trailing 365 days of clock_now)
      clean_bonus = CLEAN_BONUS if the most recent terminal Inspection.status == PASSED with zero attached deficiencies else 0
      raw = base + age_factor + deficiency_weight + incident_penalty - clean_bonus
      if vessel.service_status == SUSPENDED: raw += SUSPENDED_PENALTY
      score = max(0, min(100, raw))    # clamp then integer
    input_set: "All non-terminal Deficiency rows on the vessel, filtered by state per variant; IncidentReport rows within trailing 365 days; the vessel's most recent terminal inspection."
    constants:
      BASE_BY_CLASS: { POWER_BOILER: 30, HEATING_BOILER: 15, PRESSURE_VESSEL: 20 }
      CRIT_WEIGHT: 8
      NONCRIT_WEIGHT: 3
      INCIDENT_PENALTY_PER: 25
      SUSPENDED_PENALTY: 40
      CLEAN_BONUS: 10
    precision: "integer, clamped to [0,100]"
    variants:
      - name: STANDARD
        when: "chronological / realized view — stored in risk_score_standard"
        difference: "EXCLUDES deficiencies in REINSPECTION; reflects only currently-realized open work."
      - name: FORECAST
        when: "forward-looking view — stored in risk_score_forecast"
        difference: "INCLUDES REINSPECTION deficiencies at full weight; a vessel mid-reinspection scores higher under FORECAST than STANDARD."

  - name: certificate_validity_window
    trigger: "computed on POST /certificates when an ACTIVE certificate is issued; sets valid_from and valid_until."
    algorithm: interval_merge
    formula: |
      valid_from = clock_now
      interval_months = jurisdiction.interval_months_override
                        if jurisdiction.interval_months_override is not null
                        else INTERVAL_BY_CLASS[vessel.vessel_class]
      valid_until = valid_from + interval_months (calendar-month addition, same day-of-month)
      # Overdue rule (boundary): a certificate is expirable / the vessel is OVERDUE
      # exactly when clock_now >= valid_until  (>=, inclusive of the boundary instant).
    input_set: "The issuing vessel's class and jurisdiction override at issuance time."
    constants:
      INTERVAL_BY_CLASS: { POWER_BOILER: 12, HEATING_BOILER: 12, PRESSURE_VESSEL: 24 }
    precision: "datetime (ISO 8601 UTC, millisecond); calendar-month arithmetic"
    variants: []

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number checked first)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc-open? no — all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role is permitted to call this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource referenced in the path or as an FK in the body exists; validated left-to-right in the path first, then body FKs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or FK body field"

  - priority: 4
    category: existence
    check: "For an entity_backed acting role, X-User-ID equals the owning FK of the target resource (Owner acts on own Vessel/RepairOrder/FeeInvoice; Inspector acts on own Inspection)."
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /repair-orders, POST /repair-orders/{repairOrderId}/complete, POST /fee-invoices/{feeInvoiceId}/pay, POST /inspections/{inspectionId}/result, POST /vessels/{vesselId}/incidents"

  - priority: 5
    category: state
    check: "The target resource is in a state that permits the requested transition (e.g. certificate issuance requires the referenced Inspection.status == PASSED or PASSED_WITH_DEFICIENCIES; expire requires ACTIVE)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "OCC: when expected_vessel_version is supplied, it must equal the Vessel's current version, else the write is rejected as stale."
    error_id: ERR_STALE_VESSEL_VERSION
    http_status: 412
    applies_to: "POST /certificates"

  - priority: 6
    category: business_safety
    check: "An Inspection may be scheduled/performed only when the Vessel is safe to inspect: registration_status == REGISTERED and service_status IN {IN_SERVICE, RESTRICTED, NOT_IN_SERVICE} (NOT SUSPENDED, NOT OUT_OF_SERVICE unless inspection_type == SPECIAL)."
    error_id: ERR_VESSEL_NOT_INSPECTABLE
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 6
    category: business_safety
    check: "A Certificate may not be issued while the vessel has any non-terminal CRITICAL deficiency (open_critical_deficiency_count must be 0)."
    error_id: ERR_CRITICAL_DEFICIENCY_OPEN
    http_status: 409
    applies_to: "POST /certificates"

  - priority: 7
    category: business_referential
    check: "For an Inspection assigned to an INSURANCE inspector: the inspector.status == COMMISSIONED, inspector.commissioning_jurisdiction_id == vessel.jurisdiction_id, and an ACTIVE InsurancePolicy exists from inspector.insurance_company_id covering the vessel with coverage_start <= scheduled_start <= coverage_end."
    error_id: ERR_INSURANCE_COORDINATION_INVALID
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 7
    category: business_referential
    check: "A JURISDICTION inspector assigned to an Inspection must be COMMISSIONED in the vessel's jurisdiction (inspector.commissioning_jurisdiction_id == vessel.jurisdiction_id)."
    error_id: ERR_INSPECTOR_NOT_COMMISSIONED
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 8
    category: business_constraint
    check: "Segregation of duties: the inspector clearing/failing a deficiency on reinspection (X-User-ID) must NOT be the inspector of the deficiency's originating inspection."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /deficiencies/{deficiencyId}/reinspect"

  - priority: 8
    category: business_constraint
    check: "Uniqueness: national_board_number (Vessel), commission_number (Inspector), report_number (NationalBoardReport), and jurisdiction code are unique."
    error_id: ERR_DUPLICATE_UNIQUE_FIELD
    http_status: 409
    applies_to: "POST /vessels, POST /inspectors, POST /inspections/{inspectionId}/national-board-report, POST /jurisdictions"

  - priority: 8
    category: business_constraint
    check: "All deficiency_ids on a RepairOrder must belong to vessel_id and be in state OPEN."
    error_id: ERR_DEFICIENCY_NOT_REPAIRABLE
    http_status: 409
    applies_to: "POST /repair-orders"

  - priority: 9
    category: business_temporal
    check: "Inspector scheduling overlap: the assigned Inspector must have no other non-cancelled Inspection whose HALF-OPEN window [scheduled_start, scheduled_end) intersects this one. Back-to-back (prev.end == this.start) is allowed."
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 9
    category: business_temporal
    check: "InsurancePolicy coverage overlap: a new ACTIVE policy on a vessel must not overlap an existing ACTIVE policy on the same vessel, treating coverage as a CLOSED interval [coverage_start, coverage_end]. Touching endpoints (existing.coverage_end == new.coverage_start) DO conflict."
    error_id: ERR_POLICY_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /insurance-policies"

  - priority: 10
    category: business_fiscal
    check: "A Certificate may be issued only when its referenced FeeInvoice.status == PAID and fee_invoice.vessel_id == vessel_id and fee_invoice.inspection_id == inspection_id."
    error_id: ERR_FEE_NOT_PAID
    http_status: 402
    applies_to: "POST /certificates"

  - priority: 11
    category: business_constraint
    check: "Request body field types, enum membership, and required-field presence are valid (e.g. vessel_class in enum, mawp_psig >= 1, admin_fee_pct in [0,1])."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH with a body"
    note: "Placed last only for cross-field business checks; primitive/enum/required-field checks conceptually run before body-FK existence but share this error_id."

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:
  # ===== Test-driving clock =================================================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [JurisdictionAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["advances the logical clock used by all interval/expiry/age rules"]

  # ===== Jurisdiction =======================================================
  - method: POST
    path: "/jurisdictions"
    description: "Create a jurisdiction."
    roles: [JurisdictionAdmin]
    code: 201
    input: [code, name, "admin_fee_pct?", "interval_months_override?"]
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/jurisdictions"
    description: "List jurisdictions."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []
  - method: GET
    path: "/jurisdictions/{jurisdictionId}"
    description: "Fetch a jurisdiction."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # ===== InsuranceCompany ===================================================
  - method: POST
    path: "/insurance-companies"
    description: "Create an insurance company."
    roles: [JurisdictionAdmin]
    code: 201
    input: [name, nb_accreditation_number]
    output: InsuranceCompany
    side_effects: []
  - method: GET
    path: "/insurance-companies"
    description: "List insurance companies."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: InsuranceCompany[]
    side_effects: []
  - method: GET
    path: "/insurance-companies/{insuranceCompanyId}"
    description: "Fetch an insurance company."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: InsuranceCompany
    side_effects: []

  # ===== Owner ==============================================================
  - method: POST
    path: "/owners"
    description: "Create an owner."
    roles: [JurisdictionAdmin]
    code: 201
    input: [name, contact_email]
    output: Owner
    side_effects: []
  - method: GET
    path: "/owners"
    description: "List owners."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Owner[]
    side_effects: []
  - method: GET
    path: "/owners/{ownerId}"
    description: "Fetch an owner."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # ===== Inspector ==========================================================
  - method: POST
    path: "/inspectors"
    description: "Register an inspector (starts PENDING)."
    roles: [JurisdictionAdmin]
    code: 201
    input: [name, commission_number, inspector_type, "insurance_company_id?", "commissioning_jurisdiction_id?"]
    output: Inspector
    side_effects: []
  - method: GET
    path: "/inspectors"
    description: "List inspectors; filter by employer or commissioning jurisdiction."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["insurance_company_id?", "commissioning_jurisdiction_id?", "status?", "limit?", "offset?"]
    output: Inspector[]
    side_effects: []
  - method: GET
    path: "/inspectors/{inspectorId}"
    description: "Fetch an inspector."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: Inspector
    side_effects: []
  - method: POST
    path: "/inspectors/{inspectorId}/commission"
    description: "Commission (or re-commission) an inspector in their jurisdiction."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Inspector
    side_effects: ["status PENDING|SUSPENDED -> COMMISSIONED", "increments Inspector.version by 1"]
  - method: POST
    path: "/inspectors/{inspectorId}/suspend"
    description: "Suspend a commissioned inspector."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Inspector
    side_effects: ["status COMMISSIONED -> SUSPENDED", "increments Inspector.version by 1"]

  # ===== Vessel =============================================================
  - method: POST
    path: "/vessels"
    description: "Register a vessel in DRAFT (owner-created)."
    roles: [Owner]
    code: 201
    input: [owner_id, jurisdiction_id, manufacturer, national_board_number, vessel_class, mawp_psig, installed_at]
    output: Vessel
    side_effects: []
  - method: GET
    path: "/vessels"
    description: "List vessels; filter by owner or jurisdiction."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["owner_id?", "jurisdiction_id?", "current_certificate_id?", "registration_status?", "service_status?", "limit?", "offset?"]
    output: Vessel[]
    side_effects: []
  - method: GET
    path: "/vessels/{vesselId}"
    description: "Fetch a vessel (includes computed risk_score_standard, risk_score_forecast, counts, current_certificate_id, jurisdiction_number)."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: Vessel
    side_effects: []
  - method: POST
    path: "/vessels/{vesselId}/register"
    description: "Assign a jurisdiction_number and move registration_status DRAFT -> REGISTERED."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: ["assign jurisdiction_number", "registration_status -> REGISTERED", "increments Vessel.version by 1"]
  - method: POST
    path: "/vessels/{vesselId}/retire"
    description: "Retire a registered vessel (REGISTERED -> RETIRED)."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: ["registration_status -> RETIRED", "revoke ACTIVE certificate", "service_status -> OUT_OF_SERVICE", "increments Vessel.version by 1"]
  - method: POST
    path: "/vessels/{vesselId}/reinstate"
    description: "Return a SUSPENDED vessel to IN_SERVICE after a passing SPECIAL inspection."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: ["service_status SUSPENDED -> IN_SERVICE", "recompute risk scores", "increments Vessel.version by 1"]
  - method: POST
    path: "/vessels/{vesselId}/incidents"
    description: "File an incident report against a vessel. CRITICAL severity cascades (suspend vessel, revoke certificate, void unpaid invoice, auto-create SPECIAL inspection)."
    roles: [Owner, JurisdictionAdmin]
    code: 201
    input: [severity, occurred_at, narrative]
    output: IncidentReport
    side_effects:
      - "CRITICAL: vessel.service_status -> SUSPENDED (cascade 1 link 1)"
      - "CRITICAL: ACTIVE certificate -> REVOKED (cascade 1 link 2)"
      - "CRITICAL: cascade 1 link 3 (via the revoke): the vessel's SCHEDULED non-SPECIAL inspections -> CANCELLED"
      - "CRITICAL: AFTER the revoke cascade, auto-create a SPECIAL Inspection (SCHEDULED); store id on triggered_inspection_id (not cancelled)"
      - "recompute risk scores; increments Vessel.version by 1"

  # ===== InsurancePolicy ====================================================
  - method: POST
    path: "/insurance-policies"
    description: "Record an insurance policy covering a vessel for a closed interval."
    roles: [JurisdictionAdmin]
    code: 201
    input: [vessel_id, insurance_company_id, coverage_start, coverage_end]
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/insurance-policies"
    description: "List insurance policies; filter by vessel or insurer."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["vessel_id?", "insurance_company_id?", "status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []
  - method: GET
    path: "/insurance-policies/{policyId}"
    description: "Fetch an insurance policy."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: POST
    path: "/insurance-policies/{policyId}/cancel"
    description: "Cancel an active policy."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status ACTIVE -> CANCELLED", "increments InsurancePolicy.version by 1"]
  - method: POST
    path: "/insurance-policies/{policyId}/expire"
    description: "Expire an active policy once the clock is strictly past coverage_end."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status ACTIVE -> EXPIRED", "increments InsurancePolicy.version by 1"]

  # ===== Inspection =========================================================
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection; computes provisional_fee_cents. Enforces vessel inspectability, inspector commissioning/coordination, and inspector double-booking."
    roles: [JurisdictionAdmin]
    code: 201
    input: [vessel_id, inspector_id, inspection_type, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: ["compute provisional_fee_cents (PROVISIONAL fee variant)"]
  - method: GET
    path: "/inspections"
    description: "List inspections; filter by vessel or inspector."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["vessel_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/inspections/{inspectionId}"
    description: "Fetch an inspection."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{inspectionId}/result"
    description: "Record the inspection result (PASS | PASS_WITH_DEFICIENCIES | FAIL). Branching fork with divergent vessel side effects."
    roles: [Inspector]
    code: 200
    input: [result]
    output: Inspection
    side_effects:
      - "PASS -> vessel eligible for certificate"
      - "PASS_WITH_DEFICIENCIES -> vessel.service_status IN_SERVICE->RESTRICTED"
      - "FAIL -> vessel.service_status IN_SERVICE->OUT_OF_SERVICE"
      - "set result_recorded_at; recompute risk scores"
  - method: POST
    path: "/inspections/{inspectionId}/deficiencies"
    description: "Raise a deficiency against an inspection (before recording result). Increments vessel open-deficiency counters."
    roles: [Inspector]
    code: 201
    input: [severity, description]
    output: Deficiency
    side_effects: ["set deficiency.vessel_id from inspection.vessel_id", "increment vessel.open_deficiency_count (+ open_critical_deficiency_count if CRITICAL)", "recompute risk scores"]
  - method: POST
    path: "/inspections/{inspectionId}/national-board-report"
    description: "File the National Board report for an inspection."
    roles: [Inspector]
    code: 201
    input: [report_number, findings_summary]
    output: NationalBoardReport
    side_effects: ["set filed_by_inspector_id from X-User-ID"]
  - method: POST
    path: "/inspections/{inspectionId}/cancel"
    description: "Cancel a scheduled inspection."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status SCHEDULED -> CANCELLED"]

  # ===== NationalBoardReport (reverse reachability) =========================
  - method: GET
    path: "/national-board-reports"
    description: "List National Board reports; filter by inspection or filing inspector."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["inspection_id?", "filed_by_inspector_id?", "limit?", "offset?"]
    output: NationalBoardReport[]
    side_effects: []
  - method: GET
    path: "/national-board-reports/{reportId}"
    description: "Fetch a National Board report."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: NationalBoardReport
    side_effects: []

  # ===== Deficiency =========================================================
  - method: GET
    path: "/deficiencies"
    description: "List deficiencies; filter by inspection, vessel, or repair order."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["inspection_id?", "vessel_id?", "repair_order_id?", "status?", "severity?", "limit?", "offset?"]
    output: Deficiency[]
    side_effects: []
  - method: GET
    path: "/deficiencies/{deficiencyId}"
    description: "Fetch a deficiency."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: Deficiency
    side_effects: []
  - method: POST
    path: "/deficiencies/{deficiencyId}/reinspect"
    description: "Reinspect a deficiency in REINSPECTION (outcome PASS -> CLEARED, FAIL -> OPEN). Enforces segregation of duties."
    roles: [Inspector]
    code: 200
    input: [outcome]
    output: Deficiency
    side_effects:
      - "PASS -> CLEARED; decrement vessel counters; bubble-up RESTRICTED->IN_SERVICE if last (cascade 2 link 2)"
      - "FAIL -> OPEN; clear repair_order_id"
      - "recompute risk scores"
  - method: POST
    path: "/deficiencies/{deficiencyId}/withdraw"
    description: "Withdraw an OPEN deficiency raised in error (compensating action). Only the raising inspector may call."
    roles: [Inspector]
    code: 200
    input: []
    output: Deficiency
    side_effects: ["status OPEN -> WITHDRAWN", "decrement vessel.open_deficiency_count (+ critical if applicable)", "recompute risk scores"]

  # ===== RepairOrder ========================================================
  - method: POST
    path: "/repair-orders"
    description: "Open a repair order addressing OPEN deficiencies on a vessel; moves each to UNDER_REPAIR."
    roles: [Owner]
    code: 201
    input: [vessel_id, deficiency_ids, description]
    output: RepairOrder
    side_effects: ["each listed deficiency OPEN -> UNDER_REPAIR; set its repair_order_id"]
  - method: GET
    path: "/repair-orders"
    description: "List repair orders; filter by vessel."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["vessel_id?", "status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: GET
    path: "/repair-orders/{repairOrderId}"
    description: "Fetch a repair order."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: POST
    path: "/repair-orders/{repairOrderId}/complete"
    description: "Mark a repair order COMPLETED; cascades each linked deficiency UNDER_REPAIR -> REINSPECTION (cascade 2 link 1)."
    roles: [Owner]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> COMPLETED", "each linked deficiency UNDER_REPAIR -> REINSPECTION", "recompute risk scores"]
  - method: POST
    path: "/repair-orders/{repairOrderId}/cancel"
    description: "Cancel a repair order; each linked deficiency reverts UNDER_REPAIR -> OPEN."
    roles: [Owner]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> CANCELLED", "each linked deficiency UNDER_REPAIR -> OPEN; clear repair_order_id"]

  # ===== FeeInvoice =========================================================
  - method: POST
    path: "/fee-invoices"
    description: "Create the FINAL fee invoice for a recorded inspection (computes amount_cents via the FINAL fee variant)."
    roles: [JurisdictionAdmin]
    code: 201
    input: [vessel_id, inspection_id]
    output: FeeInvoice
    side_effects: ["compute amount_cents (FINAL fee variant)"]
  - method: GET
    path: "/fee-invoices"
    description: "List fee invoices; filter by vessel, inspection, or certificate."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["vessel_id?", "inspection_id?", "certificate_id?", "status?", "limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []
  - method: GET
    path: "/fee-invoices/{feeInvoiceId}"
    description: "Fetch a fee invoice."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []
  - method: POST
    path: "/fee-invoices/{feeInvoiceId}/pay"
    description: "Pay a fee invoice (UNPAID -> PAID). Credits the jurisdiction fee ledger (invariant A forward)."
    roles: [Owner]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> PAID; amount_paid_cents = amount_cents; jurisdiction.collected_fees_cents += amount_cents"]
  - method: POST
    path: "/fee-invoices/{feeInvoiceId}/refund"
    description: "Refund a paid fee invoice (PAID -> REFUNDED) once no ACTIVE certificate references it. Debits the ledger (invariant A compensation)."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> REFUNDED; refunded_cents = amount_cents; jurisdiction.collected_fees_cents -= amount_cents"]
  - method: POST
    path: "/fee-invoices/{feeInvoiceId}/void"
    description: "Void an UNPAID fee invoice raised in error (UNPAID -> VOID)."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status UNPAID -> VOID"]

  # ===== Certificate ========================================================
  - method: POST
    path: "/certificates"
    description: "Issue (or renew via supersedes_certificate_id) a certificate. OCC-guarded on the vessel version. Sets validity window; first issuance moves vessel to IN_SERVICE."
    roles: [JurisdictionAdmin]
    code: 201
    input: [vessel_id, inspection_id, fee_invoice_id, expected_vessel_version, "supersedes_certificate_id?"]
    output: Certificate
    side_effects:
      - "compute valid_from/valid_until (certificate_validity_window)"
      - "if supersedes_certificate_id set: old certificate ACTIVE -> SUPERSEDED"
      - "set fee_invoice.certificate_id; set vessel.current_certificate_id"
      - "first issuance: vessel.service_status NOT_IN_SERVICE -> IN_SERVICE"
      - "increments Vessel.version by 1"
  - method: GET
    path: "/certificates"
    description: "List certificates; filter by vessel, inspection, fee invoice, or superseded certificate."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["vessel_id?", "inspection_id?", "fee_invoice_id?", "supersedes_certificate_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: GET
    path: "/certificates/{certificateId}"
    description: "Fetch a certificate."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: POST
    path: "/certificates/{certificateId}/revoke"
    description: "Revoke an ACTIVE certificate; cancels the vessel's SCHEDULED non-SPECIAL inspections (cascade 1 link 3)."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: ["status ACTIVE -> REVOKED", "cancel vessel's SCHEDULED non-SPECIAL inspections", "clear vessel.current_certificate_id"]
  - method: POST
    path: "/certificates/{certificateId}/expire"
    description: "Expire an ACTIVE certificate once the clock reaches valid_until (>= boundary)."
    roles: [JurisdictionAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: ["status ACTIVE -> EXPIRED", "clear vessel.current_certificate_id"]

  # ===== IncidentReport (reverse reachability) ==============================
  - method: GET
    path: "/incidents"
    description: "List incident reports; filter by vessel or triggered inspection."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: ["vessel_id?", "triggered_inspection_id?", "severity?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: GET
    path: "/incidents/{incidentId}"
    description: "Fetch an incident report."
    roles: [JurisdictionAdmin, Owner, Inspector]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role is not permitted to call this endpoint."
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "An entity_backed role (Owner/Inspector) acts on a resource it does not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or body FK references a non-existent resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested transition."
  - id: ERR_STALE_VESSEL_VERSION
    http: 412
    condition: "expected_vessel_version does not equal the vessel's current version on POST /certificates."
  - id: ERR_VESSEL_NOT_INSPECTABLE
    http: 409
    condition: "Inspection scheduled on a vessel not REGISTERED, or SUSPENDED/OUT_OF_SERVICE (unless SPECIAL)."
  - id: ERR_CRITICAL_DEFICIENCY_OPEN
    http: 409
    condition: "Certificate issuance attempted while vessel has a non-terminal CRITICAL deficiency."
  - id: ERR_INSURANCE_COORDINATION_INVALID
    http: 409
    condition: "INSURANCE inspector lacks commission in the vessel's jurisdiction or no ACTIVE policy from the inspector's insurer covers the scheduled_start."
  - id: ERR_INSPECTOR_NOT_COMMISSIONED
    http: 409
    condition: "Assigned inspector is not COMMISSIONED in the vessel's jurisdiction."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Reinspecting inspector is the same inspector who raised the deficiency (originating inspection inspector)."
  - id: ERR_DUPLICATE_UNIQUE_FIELD
    http: 409
    condition: "A unique field (national_board_number, commission_number, report_number, jurisdiction code, nb_accreditation_number) collides."
  - id: ERR_DEFICIENCY_NOT_REPAIRABLE
    http: 409
    condition: "A RepairOrder deficiency_id does not belong to the vessel or is not OPEN."
  - id: ERR_INSPECTOR_DOUBLE_BOOKED
    http: 409
    condition: "Assigned inspector already has a non-cancelled inspection whose half-open window overlaps."
  - id: ERR_POLICY_COVERAGE_OVERLAP
    http: 409
    condition: "New policy's closed coverage interval overlaps (or touches) an existing ACTIVE policy on the same vessel."
  - id: ERR_FEE_NOT_PAID
    http: 402
    condition: "Certificate issuance attempted with a fee invoice not in PAID status (or mismatched vessel/inspection)."
  - id: ERR_CERTIFICATE_NOT_DUE
    http: 409
    condition: "Expire attempted before clock now >= certificate.valid_until (boundary rule)."
  - id: ERR_POLICY_NOT_EXPIRABLE
    http: 409
    condition: "Policy expire attempted before clock now > coverage_end."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum value, or out-of-range primitive."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: JurisdictionAdmin
    description: "Operates the jurisdiction registry: configuration, registration, inspector commissioning, scheduling, certificate issuance/revocation, fee invoicing & refunds, incident acknowledgement."
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions, /insurance-companies, /owners, /inspectors"
      - "POST /inspectors/{id}/commission, /suspend"
      - "POST /vessels/{id}/register, /retire, /reinstate"
      - "POST /insurance-policies (+ /cancel, /expire)"
      - "POST /inspections (schedule), POST /inspections/{id}/cancel"
      - "POST /fee-invoices, POST /fee-invoices/{id}/refund"
      - "POST /certificates, /certificates/{id}/revoke, /certificates/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /vessels/{id}/incidents (shared with Owner)"
      - "all GET reads"

  - name: Owner
    description: "Vessel owner/operator. Registers vessels, arranges repairs, pays fees, files incidents."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /vessels (owner_id must equal X-User-ID)"
      - "POST /repair-orders (+ /complete, /cancel) on own vessels"
      - "POST /fee-invoices/{id}/pay on own vessel's invoices"
    shared_operations:
      - "POST /vessels/{id}/incidents (shared with JurisdictionAdmin)"
      - "all GET reads"

  - name: Inspector
    description: "Certified inspector (JURISDICTION or INSURANCE employed). Performs inspections, files National Board reports, raises/withdraws/reinspects deficiencies."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/result (must be the assigned inspector)"
      - "POST /inspections/{id}/deficiencies, /national-board-report"
      - "POST /deficiencies/{id}/reinspect (subject to segregation of duties), /withdraw"
    shared_operations:
      - "all GET reads"

# END SCAFFOLD.yaml






