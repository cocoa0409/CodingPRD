              as: Approver
              captures: { err: $.data.error_id }
          assert:
            - "Approver creating a JE rejected with ERR_FORBIDDEN (JE create is Preparer-exclusive)"

      - name: preparer_cannot_waive_task
        claim_type: rbac_denial
        grounds: ["roles.Controller", "roles.Preparer"]
        distinguishing_aspect: "Waiving a task is Controller-exclusive; a Preparer attempting it is rejected ERR_FORBIDDEN."
        test_recipe:
          setup: ["Period opened; a READY non-critical task exists"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
