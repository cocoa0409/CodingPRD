  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: disciplinary_post_cascades_flag_to_suspension_to_permit_revocation_to_ledger
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_SUSPENDED_REVIEW
          - state_machines.TemporaryPermit.ACTIVE_to_REVOKED
          - state_machines.ReviewAssignment.ASSIGNED_to_RELEASED
          - calculations.applicant_disciplinary_risk_index
          - calculations.application_fee_balance
          - entities.FeeLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          A single POST to /licensure/disciplinary-records propagates four hops away from the row it
          creates: DisciplinaryRecord -> Applicant.good_standing_flag -> LicenseApplication
          SUSPENDED_REVIEW -> TemporaryPermit REVOKED (with expires_at pulled back to the revocation
          instant) -> a PERMIT_FEE_REVERSAL FeeLedgerEntry that restores fee_balance_cents, plus the
          sibling release of the ReviewAssignment and the decrement of Evaluator.open_assignment_count.
          Nothing the caller supplies names the permit, the ledger or the assignment.
        test_recipe:
          setup:
            - "Profession RN; applicant with military_status NONE and no prior disciplinary history."
            - "ENDORSEMENT application submitted (gross 48000, no waiver) and fully paid down to fee_balance_cents 0."
            - "A CredentialEvaluation exists, so the application is UNDER_REVIEW; an ACTIVE evaluator holds one ASSIGNED ReviewAssignment."
            - "One ACTIVE TemporaryPermit effective 2026-08-01 with expires_at 2026-10-30 and permit_fee_cents 6000, leaving fee_balance_cents 6000."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
