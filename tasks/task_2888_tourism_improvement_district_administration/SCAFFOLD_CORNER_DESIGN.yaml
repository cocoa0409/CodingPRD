  # ===========================================================================
  # SECTION 7 — RBAC (claim-extraction-guide Table 7)
  # complexity_profile.role_model == segregation_of_duties, so the role-model
  # rows exercised here are the exclusive/shared split and the three
  # same-actor prohibitions the §1.4 priority-70 row declares.
  # ===========================================================================
  - section: rbac
    instances:

      - name: role_exclusive_operations_cannot_be_performed_by_other_roles
        claim_type: exclusive_operation_denial
        grounds:
          - roles.BoardMember.exclusive_operations
          - roles.IndependentAuditor.exclusive_operations
          - roles.HearingOfficer.exclusive_operations
          - roles.DistrictAdministrator.exclusive_operations
          - validations.p20_acting_role_appears_in_the_endpoint_roles_list
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Four exclusive operations are attempted twice each: once by a role that holds a different
          part of the surface and once by the role §1.7 names as their sole holder. The wrong-role
          attempt is refused 403 ERR_FORBIDDEN_ROLE at priority 20 with the target row untouched —
          not 404, not 409 — and the same request from the right role then succeeds, so the denial
          is proved to be about the role and nothing else. The four pairs deliberately cross the
          role graph in both directions: the DMO liaison cannot act on the budget, the hearing
          officer cannot audit, the auditor cannot resolve a dispute, and the board member cannot
          file a transparency record.
        test_recipe:
          setup:
            - "canonical district ACTIVE, st1 filed at 824500, plan FY2027 still DRAFT"
            - "a CALCULATION_ERROR dispute on st1 already moved to UNDER_REVIEW by the hearing officer"
            - "period FY2027-Q1 CLOSED at clock 2026-11-16, so an audit is admissible"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_plan_fy2027
            - *c_dispute_st1
            - *c_open_review_st1
            - *c_clock_period_end
            - *c_close_q1
          trigger:
            - call: "POST /annual-work-plans/${wp_id}/board-actions"
              payload: { action: "SPONSOR", note: "the DMO liaison tries to move the budget" }
              as: DmoLiaison
              as_user_id: "dmo-01"
            - call: "POST /annual-work-plans/${wp_id}/board-actions"
              payload: { action: "SPONSOR", note: "sponsored by the board member who holds the operation" }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audit_note: "the hearing officer tries to audit" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audit_note: "reported figures accepted without change" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
            - call: "POST /assessment-disputes/${dsp1_id}/resolution"
              payload: { outcome: "UPHELD", resolution_note: "the auditor tries to decide the dispute" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
            - call: "POST /assessment-disputes/${dsp1_id}/resolution"
              payload: { outcome: "UPHELD", resolution_note: "assessment basis confirmed at hearing" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "ANNUAL_REPORT", fiscal_year: 2027, scheduled_for: "2026-12-15T00:00:00Z", required_by: "2027-01-31T00:00:00Z" }
              as: BoardMember
              as_user_id: "board-member-01"
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "ANNUAL_REPORT", fiscal_year: 2027, scheduled_for: "2026-12-15T00:00:00Z", required_by: "2027-01-31T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { rec_fy27_id: "$.data.id" }
          assert:
            - "the DmoLiaison board-action returns 403 with data.error_id == ERR_FORBIDDEN_ROLE, and AnnualWorkPlan.${wp_id}.status is still DRAFT with sponsor_user_id == null and version == 1"
            - "the BoardMember board-action returns 200 and AnnualWorkPlan.${wp_id}.status == BOARD_REVIEW with sponsor_user_id == board-member-01"
            - "the HearingOfficer audit-certification returns 403 with data.error_id == ERR_FORBIDDEN_ROLE, and AssessmentStatement.${st1_id}.filing_status is still FILED with audited_by_user_id == null and final_assessment_cents == null"
            - "the IndependentAuditor audit-certification returns 200 and AssessmentStatement.${st1_id}.filing_status == AUDITED with audited_by_user_id == auditor-01 and final_assessment_cents == 824500"
            - "the IndependentAuditor resolution returns 403 with data.error_id == ERR_FORBIDDEN_ROLE, and AssessmentDispute.${dsp1_id}.status is still UNDER_REVIEW with resolved_by_user_id == null"
            - "the HearingOfficer resolution returns 200 and AssessmentDispute.${dsp1_id}.status == RESOLVED_UPHELD with resolved_by_user_id == hearing-01 and granted_adjustment_cents == 0"
            - "the BoardMember transparency-record creation returns 403 with data.error_id == ERR_FORBIDDEN_ROLE and no TransparencyRecord row exists for the district at that point"
            - "the DistrictAdministrator transparency-record creation returns 201 and TransparencyRecord.${rec_fy27_id}.status == SCHEDULED with engaged_by_user_id == admin-01"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents == 824500 throughout, since the UPHELD resolution grants nothing"

      - name: shared_filing_authority_covers_the_operator_and_the_administrator_while_ownership_still_binds
        claim_type: shared_operation
        grounds:
          - roles.LodgingOperator.shared_operations
          - roles.DistrictAdministrator.shared_operations
          - state_machines.AssessmentStatement.NOT_FILED_to_FILED
          - validations.p50_lodging_operator_resource_ownership
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          POST /assessment-statements/{id}/filings is shared, and the two holders are not
          symmetrical: the operator may file only its own statement, while the administrator files
          on any property's behalf because the priority-50 ownership row is scoped to
          X-User-Role == LodgingOperator. b1 files its own statement, the administrator files b2's,
          and b2 filing b3's statement is refused 403 ERR_NOT_RESOURCE_OWNER — three calls to one
          endpoint with three different outcomes decided purely by the header pair.
        test_recipe:
          setup:
            - "canonical district ACTIVE with the four-property roll, FY2027-Q1 open at clock 2026-08-01"
            - "statements generated for b1, b2, b3 and b4, all NOT_FILED"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_find_st2
            - *c_find_st3
          trigger:
            - call: "POST /assessment-statements/${st1_id}/filings"
              payload: { reported_room_nights: 2000, reported_gross_room_revenue_cents: 41225000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-statements/${st2_id}/filings"
              payload: { reported_room_nights: 600, reported_gross_room_revenue_cents: 20000000 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-statements/${st3_id}/filings"
              payload: { reported_room_nights: 100, reported_gross_room_revenue_cents: 1600800 }
              as: LodgingOperator
              as_user_id: "${b2_id}"
          assert:
            - "the operator filing its own statement returns 201 and AssessmentStatement.${st1_id}.filing_status == FILED with provisional_assessment_cents == 824500 and filed_at == 2026-08-01T00:00:00Z"
            - "the administrator filing b2's statement returns 201 and AssessmentStatement.${st2_id}.filing_status == FILED with provisional_assessment_cents == 340000"
            - "AssessmentStatement.${st2_id}.lodging_business_id == ${b2_id}, unchanged by the administrator having acted"
            - "b2 filing b3's statement returns 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "AssessmentStatement.${st3_id}.filing_status is still NOT_FILED with reported_room_nights == null and version == 1"
            - "AssessmentPeriod.${ap_id}.billed_total_cents == 1164500, the sum of the two accepted filings"

      - name: an_unknown_operator_identity_is_forbidden_before_any_path_id_is_resolved
        claim_type: identity_backed_role
        grounds:
          - roles.LodgingOperator.identity
          - validations.p25_operator_identity_resolves_to_a_lodging_business
          - validations.p40_path_id_existence_resolved_left_to_right
          - errors[ERR_OPERATOR_IDENTITY_UNKNOWN]
          - errors[ERR_ASSESSMENT_STATEMENT_NOT_FOUND]
        distinguishing_aspect: |
          LodgingOperator is the only entity_backed role, so its X-User-ID is itself a foreign key.
          The same absent statement id is requested twice: with an unresolvable operator identity it
          returns 403 ERR_OPERATOR_IDENTITY_UNKNOWN, because priority 25 runs before the priority-40
          path-id lookup; with a real operator identity the very same path returns 404
          ERR_ASSESSMENT_STATEMENT_NOT_FOUND. The pair pins the order of the two rungs, which a naive
          implementation resolving the path first would invert.
        test_recipe:
          setup:
            - "canonical district ACTIVE with the four-property roll and FY2027-Q1 statements generated"
            - "no AssessmentStatement carries id 00000000-0000-4000-8000-000000000000"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
          trigger:
            - call: "POST /assessment-statements/00000000-0000-4000-8000-000000000000/filings"
              payload: { reported_room_nights: 100, reported_gross_room_revenue_cents: 1000000 }
              as: LodgingOperator
              as_user_id: "not-a-lodging-business"
            - call: "POST /assessment-statements/00000000-0000-4000-8000-000000000000/filings"
              payload: { reported_room_nights: 100, reported_gross_room_revenue_cents: 1000000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
          assert:
            - "the unknown-identity call returns 403 with data.error_id == ERR_OPERATOR_IDENTITY_UNKNOWN"
            - "the known-identity call on the same absent path returns 404 with data.error_id == ERR_ASSESSMENT_STATEMENT_NOT_FOUND"
            - "no AssessmentStatement is created or mutated by either call, and District.${d_id}.version is unchanged"

      - name: the_same_auditor_cannot_audit_and_then_certify_one_statement
        claim_type: segregation_of_duties
        grounds:
          - roles.IndependentAuditor.description
          - validations.p70_segregation_of_duties
          - state_machines.AssessmentStatement.AUDITED_to_CERTIFIED
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.AssessmentStatement.fields.audited_by_user_id
        distinguishing_aspect: |
          Both halves of the audit are exclusive to IndependentAuditor, so the denial cannot be a
          role denial — it is an identity denial inside one role. auditor-01 audits st1 and is then
          refused 403 ERR_SEGREGATION_OF_DUTIES on CERTIFY at priority 70, while auditor-02, holding
          exactly the same role, certifies the same statement. The statement stays AUDITED across the
          refusal, proving the rejection happens before the transition rather than after it.
        test_recipe:
          setup:
            - "canonical district, st1 filed at 824500, no dispute on the statement"
            - "period FY2027-Q1 CLOSED at clock 2026-11-16 so the audit is admissible"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_clock_period_end
            - *c_close_q1
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audit_note: "reported figures accepted without change" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
          trigger:
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "CERTIFY", audit_note: "certified by the auditor who ran the audit" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "CERTIFY", audit_note: "certified by the review auditor" }
              as: IndependentAuditor
              as_user_id: "auditor-02"
          assert:
            - "AssessmentStatement.${st1_id}.audited_by_user_id == auditor-01 after the setup audit, with filing_status == AUDITED"
            - "the auditor-01 CERTIFY returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "AssessmentStatement.${st1_id}.filing_status is still AUDITED after the refusal"
            - "the auditor-02 CERTIFY returns 200 and AssessmentStatement.${st1_id}.filing_status == CERTIFIED"
            - "AssessmentStatement.${st1_id}.audited_by_user_id is still auditor-01, so certification does not overwrite the audit identity"
            - "final_assessment_cents == 824500 and effective_assessment_cents == 824500 across both calls"

      - name: the_administrator_who_engaged_the_financial_audit_cannot_complete_or_publish_it
        claim_type: segregation_of_duties
        grounds:
          - entities.TransparencyRecord.fields.engaged_by_user_id
          - state_machines.TransparencyRecord.NOTICED_to_COMPLETED
          - state_machines.TransparencyRecord.COMPLETED_to_PUBLISHED
          - validations.p70_segregation_of_duties
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The third same-actor prohibition binds on a record_type, not on a role: only
          DistrictAdministrator can advance a transparency record at all, so admin-01 — stamped as
          engaged_by_user_id when it created the FINANCIAL_AUDIT row — is refused on BOTH the
          COMPLETED and the PUBLISHED advance, while admin-02 passes both. The NOTICED advance is
          not gated, which distinguishes the rule from a blanket "creator may not advance" reading.
        test_recipe:
          setup:
            - "canonical district ACTIVE at clock 2026-08-01"
            - "a FINANCIAL_AUDIT record scheduled_for 2026-08-20, required_by 2026-09-30, created by admin-01"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "FINANCIAL_AUDIT", fiscal_year: 2027, scheduled_for: "2026-08-20T00:00:00Z", required_by: "2026-09-30T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { rec_fa_id: "$.data.id" }
            - call: "POST /transparency-records/${rec_fa_id}/advance"
              payload: { to_status: "NOTICED" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /transparency-records/${rec_fa_id}/advance"
              payload: { to_status: "COMPLETED" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records/${rec_fa_id}/advance"
              payload: { to_status: "COMPLETED" }
              as: DistrictAdministrator
              as_user_id: "admin-02"
            - call: "POST /transparency-records/${rec_fa_id}/advance"
              payload: { to_status: "PUBLISHED", document_reference: "FY2027-audit-opinion.pdf" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records/${rec_fa_id}/advance"
              payload: { to_status: "PUBLISHED", document_reference: "FY2027-audit-opinion.pdf" }
              as: DistrictAdministrator
              as_user_id: "admin-02"
          assert:
            - "TransparencyRecord.${rec_fa_id}.engaged_by_user_id == admin-01 and the admin-01 NOTICED advance in setup returned 200 with status == NOTICED"
            - "the admin-01 COMPLETED advance returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES and status is still NOTICED with completed_on == null"
            - "the admin-02 COMPLETED advance returns 200 with status == COMPLETED and completed_on == 2026-08-20T00:00:00Z"
            - "the admin-01 PUBLISHED advance returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES and status is still COMPLETED with published_on == null and document_reference == null"
            - "the admin-02 PUBLISHED advance returns 200 with status == PUBLISHED, published_on == 2026-08-20T00:00:00Z and document_reference == FY2027-audit-opinion.pdf"
            - "District.${d_id}.transparency_standing == COMPLIANT throughout, since nothing passed required_by"

      - name: public_viewer_cannot_read_the_assessment_roll_or_any_statement
        claim_type: peer_roles
        grounds:
          - roles.PublicViewer.shared_operations
          - endpoints.GET_/districts/{id}/lodging-businesses
          - endpoints.GET_/districts/{id}/financial-summary
          - validations.p10_public_endpoints_need_no_headers
          - validations.p20_acting_role_appears_in_the_endpoint_roles_list
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The transparency requirements define exactly what the public may see, and the boundary runs
          between two sub-resources of the same district: the header-free financial summary and
          transparency list are served, while the assessment roll and the statement list are refused
          403 ERR_FORBIDDEN_ROLE because PublicViewer is absent from their §1.5 roles. Both refusals
          are role denials rather than 401s, since the caller does present X-User-Role: PublicViewer.
        test_recipe:
          setup:
            - "canonical district ACTIVE with the four-property roll, st1 filed at 824500"
            - "one PUBLISHED-track ANNUAL_REPORT record is not required; only reads are exercised"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
          trigger:
            - call: "GET /districts/${d_id}/financial-summary"
              payload: {}
              as: PublicViewer
            - call: "GET /districts/${d_id}/transparency-records"
              payload: {}
              as: PublicViewer
            - call: "GET /districts/${d_id}/lodging-businesses"
              payload: {}
              as: PublicViewer
              as_user_id: "public-01"
            - call: "GET /assessment-periods/${ap_id}/statements"
              payload: {}
              as: PublicViewer
              as_user_id: "public-01"
          assert:
            - "the financial-summary read returns 200 with no headers at all and billed_total_cents == 824500"
            - "the transparency-records read returns 200 with response_type == array and an empty data array"
            - "the lodging-businesses read returns 403 with data.error_id == ERR_FORBIDDEN_ROLE and no roll data in the envelope"
            - "the period-statements read returns 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "both refused calls do carry X-User-Role: PublicViewer with X-User-ID public-01, so priority 10 passes and priority 20 decides; the two served reads carry no headers at all and are exempt from priority 10 because PublicViewer appears in their §1.5 roles list"

      - name: the_board_member_who_sponsors_a_plan_cannot_also_approve_it
        claim_type: segregation_of_duties
        grounds:
          - state_machines.AnnualWorkPlan.BOARD_REVIEW_to_APPROVED
          - validations.p70_segregation_of_duties
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.AnnualWorkPlan.fields.sponsor_user_id
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_administration_share_cap_on_plan_approval
          rationale: "That §1.8 instance approves with the sponsor's own X-User-ID on a plan whose administration line also breaches the share cap, so it asserts ERR_SEGREGATION_OF_DUTIES at priority 70 ahead of the priority-85 cap and then the cap error once a second board member acts; the plain same-actor denial is its first assertion."

  # ===========================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers (claim-extraction-guide)
  # complexity_profile.complexity_layers ==
  #   [optimistic_concurrency, cascading_side_effects,
  #    dual_variant_calculation, rate_threshold_triggers]
  # Each §1.2.1 concurrency rule gets its own stale-version instance; the two
  # cascade layers and the variant layer are already carried by §1.8 depth
  # instances and are emitted as stubs.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: a_stale_statement_version_is_refused_and_the_current_one_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.statement-amendment-stale-statement
          - endpoints.POST_/assessment-statements/{id}/amendments
          - errors[ERR_STALE_STATEMENT_VERSION]
          - entities.AssessmentStatement.fields.granted_adjustment_cents
        distinguishing_aspect: |
          The version the operator holds goes stale without any state change the operator can see:
          the statement is still FILED, still inside the filing window, still owned by the same
          property — only a hearing officer's ADJUSTED resolution has bumped version from 2 to 3
          behind its back. The amendment carrying expected_statement_version 2 is therefore refused
          412 ERR_STALE_STATEMENT_VERSION rather than 409, and re-reading the row and resubmitting
          with version 3 succeeds. The refusal must leave reported_gross_room_revenue_cents at the
          filed 41225000, proving the write was rejected before the recompute rather than rolled back.
        test_recipe:
          setup:
            - "canonical district ACTIVE, FY2027-Q1 open at clock 2026-08-01, st1 filed at 824500"
            - "a CALCULATION_ERROR dispute on st1 opened for review and resolved ADJUSTED for 82450"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_dispute_st1
            - *c_open_review_st1
            - call: "POST /assessment-disputes/${dsp1_id}/resolution"
              payload: { outcome: "ADJUSTED", granted_adjustment_cents: 82450, resolution_note: "resort fee removed from the revenue basis" }
              as: HearingOfficer
              as_user_id: "hearing-01"
          trigger:
            - call: "POST /assessment-statements/${st1_id}/amendments"
              payload: { expected_statement_version: "${st1_v_filed}", reported_room_nights: 1950, reported_gross_room_revenue_cents: 40000000, amendment_reason: "September folio corrections" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "GET /assessment-statements/${st1_id}"
              payload: {}
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { st1_v_current: "$.data.version" }
            - call: "POST /assessment-statements/${st1_id}/amendments"
              payload: { expected_statement_version: "${st1_v_current}", reported_room_nights: 1950, reported_gross_room_revenue_cents: 40000000, amendment_reason: "September folio corrections" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
          assert:
            - "${st1_v_filed} == 2, the version the filing response returned"
            - "after the ADJUSTED resolution AssessmentStatement.${st1_id}.granted_adjustment_cents == 82450, effective_assessment_cents == 742050, final_assessment_cents == null and version == 3"
            - "the amendment carrying expected_statement_version 2 returns 412 with data.error_id == ERR_STALE_STATEMENT_VERSION"
            - "after the refusal AssessmentStatement.${st1_id}.filing_status is still FILED, reported_gross_room_revenue_cents is still 41225000, amendment_count == 0 and version is still 3"
            - "${st1_v_current} == 3"
            - "the resubmitted amendment returns 200 with AssessmentStatement.${st1_id}.filing_status == AMENDED, amendment_count == 1 and version == 4"
            - "AssessmentStatement.${st1_id}.provisional_assessment_cents == 800000 and effective_assessment_cents == 717550, since the 82450 adjustment survives the amendment"
            - "AssessmentPeriod.${ap_id}.billed_total_cents == 717550"

      - name: a_stale_work_plan_version_is_refused_and_the_current_one_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.work-plan-amendment-stale-plan
          - endpoints.POST_/annual-work-plans/{id}/amendments
          - errors[ERR_STALE_WORK_PLAN_VERSION]
          - state_machines.AnnualWorkPlan.APPROVED_to_AMENDMENT_PENDING
          - calculations.funding_ratio
        distinguishing_aspect: |
          Here the silent bump is an automatic transition, not another actor's write: two downward
          statement amendments drop assessment_revenue_forecast_cents to 883500, the recomputed
          funding_ratio 0.8835 falls under MIN_FUNDING_RATIO and the plan moves APPROVED ->
          AMENDMENT_PENDING, incrementing version from 3 to 4 while the administrator still holds 3.
          The remedial amendment — the very call that would cure the shortfall — is refused 412
          ERR_STALE_WORK_PLAN_VERSION, and only the re-read version 4 is accepted, at which point
          the plan returns to APPROVED with funding_ratio 0.9300.
        test_recipe:
          setup:
            - "canonical district ACTIVE, st1 filed at 824500 and st2 filed at 340000"
            - "plan FY2027 sponsored by board-member-01 and APPROVED by board-member-02 at total 1000000"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_find_st2
            - *c_file_st2
            - *c_plan_fy2027
            - *c_sponsor
            - *c_approve
            - call: "POST /assessment-statements/${st1_id}/amendments"
              payload: { expected_statement_version: "${st1_v_filed}", reported_room_nights: 2000, reported_gross_room_revenue_cents: 31000000, amendment_reason: "group block cancelled after the filing" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "GET /assessment-statements/${st2_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st2_v_filed: "$.data.version" }
            - call: "POST /assessment-statements/${st2_id}/amendments"
              payload: { expected_statement_version: "${st2_v_filed}", reported_room_nights: 600, reported_gross_room_revenue_cents: 15500000, amendment_reason: "double-counted banquet revenue removed" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
          trigger:
            - call: "POST /annual-work-plans/${wp_id}/amendments"
              payload: { expected_work_plan_version: "${wp_v_approved}", expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 600000, narrative: "paid search and group sales, trimmed" }, { category: "ADMINISTRATION", amount_cents: 140000, narrative: "district staff and audit fees" }, { category: "CONTINGENCY_RESERVE", amount_cents: 90000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 120000, narrative: "harbour festival" }], amendment_reason: "budget resized to the revised assessment forecast" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /annual-work-plans/${wp_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { wp_v_pending: "$.data.version" }
            - call: "POST /annual-work-plans/${wp_id}/amendments"
              payload: { expected_work_plan_version: "${wp_v_pending}", expenditure_lines: [{ category: "SALES_AND_MARKETING", amount_cents: 600000, narrative: "paid search and group sales, trimmed" }, { category: "ADMINISTRATION", amount_cents: 140000, narrative: "district staff and audit fees" }, { category: "CONTINGENCY_RESERVE", amount_cents: 90000, narrative: "statutory reserve" }, { category: "DESTINATION_EVENTS", amount_cents: 120000, narrative: "harbour festival" }], amendment_reason: "budget resized to the revised assessment forecast" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "${wp_v_approved} == 3, the version the APPROVE response returned"
            - "after the st1 amendment AssessmentStatement.${st1_id}.provisional_assessment_cents == 620000 and AnnualWorkPlan.${wp_id}.funding_ratio == 0.9600, so the plan is still APPROVED at version 3"
            - "after the st2 amendment AssessmentStatement.${st2_id}.provisional_assessment_cents == 263500, assessment_revenue_forecast_cents == 883500 and funding_ratio == 0.8835"
            - "AnnualWorkPlan.${wp_id}.status == AMENDMENT_PENDING with version == 4, bumped by the automatic transition rather than by any administrator write"
            - "the amendment carrying expected_work_plan_version 3 returns 412 with data.error_id == ERR_STALE_WORK_PLAN_VERSION"
            - "after the refusal AnnualWorkPlan.${wp_id}.total_budget_cents is still 1000000, revision_count == 0, status is still AMENDMENT_PENDING and version is still 4"
            - "${wp_v_pending} == 4"
            - "the resubmitted amendment returns 200 with AnnualWorkPlan.${wp_id}.total_budget_cents == 950000, sales_and_marketing_cents == 600000, administration_cents == 140000, contingency_reserve_cents == 90000 and destination_events_cents == 120000"
            - "AnnualWorkPlan.${wp_id}.funding_ratio == 0.9300, status == APPROVED, revision_count == 1 and version == 5"

      - name: version_increments_on_every_write_to_the_same_row
        claim_type: optimistic_concurrency
        grounds:
          - entities.LodgingBusiness.common_fields
          - endpoints.POST_/lodging-businesses/{id}/revisions
          - entities.LodgingBusiness.fields.status
        distinguishing_aspect: |
          The OCC layer rests on version being a per-row write counter, not a change detector: three
          successive revisions of one LodgingBusiness take version 1 -> 2 -> 3 -> 4 even though the
          logical clock never moves, so updated_at is byte-identical across all three writes and
          cannot serve as the discriminator. The third revision rewrites room_count to the value it
          already held, and version still advances.
        test_recipe:
          setup:
            - "canonical district PROPOSED with the four-property roll, clock pinned at 2026-08-01"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
          trigger:
            - call: "POST /lodging-businesses/${b1_id}/revisions"
              payload: { classification: "LIMITED_SERVICE" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /lodging-businesses/${b1_id}/revisions"
              payload: { prior_year_gross_room_revenue_cents: 58000000 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /lodging-businesses/${b1_id}/revisions"
              payload: { room_count: 200 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "LodgingBusiness.${b1_id}.version == 1 immediately after creation"
            - "the first revision returns 200 with version == 2 and classification == LIMITED_SERVICE"
            - "the second revision returns 200 with version == 3 and prior_year_gross_room_revenue_cents == 58000000"
            - "the third revision returns 200 with version == 4 even though room_count was already 200"
            - "LodgingBusiness.${b1_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z on all three responses, since the logical clock is pinned"
            - "LodgingBusiness.${b1_id}.status == ASSESSABLE throughout and District.${d_id}.assessable_basis_cents == 98000000 after the second revision"

      - name: the_lien_referral_threshold_binds_at_exactly_one_million_outstanding_cents
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.delinquency_charges.delinquency_stage
          - calculations.delinquency_charges.constants.LIEN_REFERRAL_THRESHOLD_CENTS
          - entities.AssessmentStatement.fields.delinquency_stage
          - state_machines.AssessmentPeriod.CLOSED_to_DELINQUENCY_SWEPT
        distinguishing_aspect: |
          A dedicated district is rolled so that one sweep produces both stages from one line of
          code: outstanding_cents 1000000 lands exactly on LIEN_REFERRAL_THRESHOLD_CENTS and is
          referred, while 999999 — one cent below — is staged NOTICE. Both properties stand GOOD
          when the sweep begins, so the SUSPENDED disjunct cannot be what decides either stage, and
          both round to the same penalty 100000 and interest 500, which isolates the stage decision
          from the charge arithmetic.
        test_recipe:
          setup:
            - "a second district Lien Ridge, PCT_OF_ROOM_REVENUE, zones [ZONE_CORE] only, term 1 year, FY2027"
            - "roll: xb1 ZONE_CORE FULL_SERVICE 100 rooms 50000000; xb2 ZONE_CORE FULL_SERVICE 80 rooms 49999950; xb3 ZONE_CORE LIMITED_SERVICE 10 rooms 100000"
            - "xb1 and xb2 sign the formation drive, weighted support 0.9990, district ACTIVE"
            - "period FY2027-Q1 [2026-08-01, 2026-11-01), due 2026-11-15, grace 10, statements generated"
            - "xb1 and xb2 file and pay nothing; xb3 never files, so its statement carries total_due_cents 0"
          setup_api_calls:
            - *c_clock_form
            - call: "POST /districts"
              payload: { name: "Lien Ridge Tourism Improvement District", assessment_method: "PCT_OF_ROOM_REVENUE", included_zones: ["ZONE_CORE"], formation_threshold_pct: 0.6000, term_years: 1, current_fiscal_year: 2027 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { x_d_id: "$.data.id" }
            - call: "POST /lodging-businesses"
              payload: { district_id: "${x_d_id}", legal_name: "Ridgecrest Hotel", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 100, prior_year_gross_room_revenue_cents: 50000000, operator_contact_email: "ops@ridgecrest.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { xb1_id: "$.data.id" }
            - call: "POST /lodging-businesses"
              payload: { district_id: "${x_d_id}", legal_name: "Summit House", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 80, prior_year_gross_room_revenue_cents: 49999950, operator_contact_email: "ops@summithouse.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { xb2_id: "$.data.id" }
            - call: "POST /lodging-businesses"
              payload: { district_id: "${x_d_id}", legal_name: "Ridge Cabins", boundary_zone: "ZONE_CORE", classification: "LIMITED_SERVICE", room_count: 10, prior_year_gross_room_revenue_cents: 100000, operator_contact_email: "ops@ridgecabins.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { xb3_id: "$.data.id" }
            - call: "POST /petition-drives"
              payload: { district_id: "${x_d_id}", drive_type: "FORMATION", closes_at: "2026-09-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { x_pd_id: "$.data.id" }
            - call: "POST /petition-drives/${x_pd_id}/signatures"
              payload: { lodging_business_id: "${xb1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives/${x_pd_id}/signatures"
              payload: { lodging_business_id: "${xb2_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives/${x_pd_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /petition-drives/${x_pd_id}/certification"
              payload: { certified_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /districts/${x_d_id}/lifecycle-advances"
              payload: { to_status: "ACTIVE", effective_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-periods"
              payload: { district_id: "${x_d_id}", period_label: "FY2027-Q1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_date: "2026-11-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { x_ap_id: "$.data.id" }
            - call: "POST /assessment-periods/${x_ap_id}/statement-generation"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { x_generated: "$.data.generated_count" }
            - call: "GET /assessment-periods/${x_ap_id}/statements"
              payload: { lodging_business_id: "${xb1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { x_st1_id: "$.data[0].id" }
            - call: "POST /assessment-statements/${x_st1_id}/filings"
              payload: { reported_room_nights: 1000, reported_gross_room_revenue_cents: 50000000 }
              as: LodgingOperator
              as_user_id: "${xb1_id}"
            - call: "GET /assessment-periods/${x_ap_id}/statements"
              payload: { lodging_business_id: "${xb2_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { x_st2_id: "$.data[0].id" }
            - call: "POST /assessment-statements/${x_st2_id}/filings"
              payload: { reported_room_nights: 900, reported_gross_room_revenue_cents: 49999950 }
              as: LodgingOperator
              as_user_id: "${xb2_id}"
            - call: "GET /assessment-periods/${x_ap_id}/statements"
              payload: { lodging_business_id: "${xb3_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { x_st3_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-16T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-periods/${x_ap_id}/closure"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-26T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /assessment-periods/${x_ap_id}/delinquency-sweep"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "${x_generated} == 3 and AssessmentPeriod.${x_ap_id}.billed_total_cents == 1999999 before the sweep"
            - "AssessmentStatement.${x_st1_id}.effective_assessment_cents == 1000000 and AssessmentStatement.${x_st2_id}.effective_assessment_cents == 999999"
            - "the sweep returns 200 with AssessmentPeriod.${x_ap_id}.status == DELINQUENCY_SWEPT"
            - "AssessmentStatement.${x_st1_id}.delinquency_stage == LIEN_REFERRED, since outstanding_cents 1000000 >= LIEN_REFERRAL_THRESHOLD_CENTS"
            - "AssessmentStatement.${x_st2_id}.delinquency_stage == NOTICE, since outstanding_cents 999999 is one cent short"
            - "both statements move to payment_status DELINQUENT with penalty_cents == 100000 and interest_cents == 500 for one day late"
            - "AssessmentStatement.${x_st1_id}.total_due_cents == 1100500 and AssessmentStatement.${x_st2_id}.total_due_cents == 1100499"
            - "District.${x_d_id}.delinquent_charges_cents == 201000 == (100000 + 500) + (100000 + 500)"
            - "LodgingBusiness.${xb1_id}.delinquency_strike_count == 1 with compliance_standing == WATCH, and the same for ${xb2_id}"
            - "AssessmentStatement.${x_st3_id}.payment_status is still UNPAID with delinquency_stage == NONE, because its total_due_cents is 0 while NOT_FILED"
            - "no PetitionSignature moves to DISQUALIFIED, since neither property reached SUSPENDED"

      - name: the_four_hop_delinquency_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AssessmentPeriod.CLOSED_to_DELINQUENCY_SWEPT
          - calculations.petition_support
          - entities.PetitionSignature.fields.disqualification_reason
        excluded_because:
          difficulty_instance: transitive_cascade / delinquency_sweep_cascades_four_hops_into_renewal_petition_support
          rationale: "That §1.8 instance walks all four hops of the sweep — statement, charges, strike count and compliance standing, then signature disqualification and the drive re-score — and asserts the literal support figure at the far end, which is exactly this layer's N-level chain claim."

      - name: the_dispute_cascade_reaches_the_marketing_program_in_three_hops
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_/assessment-disputes/{id}/resolution
          - state_machines.AnnualWorkPlan.APPROVED_to_AMENDMENT_PENDING
          - state_machines.MarketingProgram.PLANNED_to_SUSPENDED_PENDING_AMENDMENT
        excluded_because:
          difficulty_instance: transitive_cascade / granted_dispute_cascades_through_funding_ratio_into_a_frozen_program
          rationale: "That §1.8 instance drives one granted adjustment through the funding ratio into the plan's AMENDMENT_PENDING transition and on into program suspension and spend freeze, then unwinds it, covering both the ordering sensitivity and the recovery half of this layer."

      - name: switching_the_assessment_variant_changes_the_stored_integer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.assessment_amount.variants
          - entities.AssessmentStatement.fields.provisional_assessment_cents
          - entities.AssessmentStatement.fields.final_assessment_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / assessment_provisional_and_final_diverge_after_mid_period_reclassification
          rationale: "That §1.8 instance holds the reported figures byte-identical, moves the property's classification mid-period and asserts both variant outputs plus their delta, which is precisely this layer's both-variants-and-the-delta claim."

      - name: the_instantaneous_support_threshold_binds_at_exactly_the_declared_percentage
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.petition_support
          - state_machines.PetitionDrive.OPEN_to_QUALIFIED
          - state_machines.PetitionDrive.OPEN_to_SHORT_OF_THRESHOLD
        excluded_because:
          difficulty_instance: boundary_precision_check / petition_weighted_support_rounds_onto_the_threshold_and_qualifies
          rationale: "That §1.8 instance sits the weighted support exactly on formation_threshold_pct after ROUND_HALF_UP and certifies, with the one-cent-lower roll refused, which is this layer's instantaneous-threshold-at-the-boundary claim; the cumulative side of the layer is carried by the LIEN_REFERRAL_THRESHOLD_CENTS instance above."

  # ===========================================================================
  # SECTION 9 — Consistency Model (claim-extraction-guide "From Consistency
  # Model"). complexity_profile.consistency_model == immediate, so every claim
  # here is of the form "all changes are visible in the same request's response"
  # and a re-read after the fact adds nothing.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: the_filing_response_already_carries_every_derived_total
        claim_type: immediate_visibility
        grounds:
          - endpoints.POST_/assessment-statements/{id}/filings
          - calculations.assessment_amount
          - calculations.payment_status_derivation
          - endpoints.GET_/districts/{id}/financial-summary
        distinguishing_aspect: |
          The filing response body is itself the authoritative view: provisional_assessment_cents,
          effective_assessment_cents, total_due_cents and version are all final in the 200 that the
          POST returns, with no second request needed to settle them. Re-reading the row and the two
          derived-on-read rollups — the period's billed_total_cents and the public financial summary —
          returns byte-identical figures, which is what distinguishes immediate consistency from a
          model where the denormalised district and period totals would lag one request behind.
        test_recipe:
          setup:
            - "canonical district ACTIVE with FY2027-Q1 open and four statements generated NOT_FILED"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
          trigger:
            - *c_file_st1
            - call: "GET /assessment-statements/${st1_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /assessment-periods/${ap_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /districts/${d_id}/financial-summary"
              payload: { fiscal_year: 2027 }
              as: PublicViewer
          assert:
            - "the filing response itself already carries filing_status == FILED, filed_at == 2026-08-01T00:00:00Z, provisional_assessment_cents == 824500, effective_assessment_cents == 824500, total_due_cents == 824500 and version == 2"
            - "the immediately following GET of the same statement returns exactly those seven values, with no field still null or stale"
            - "GET /assessment-periods/${ap_id} returns billed_total_cents == 824500 and collected_total_cents == 0 on the first read after the filing"
            - "GET /districts/${d_id}/financial-summary returns billed_total_cents == 824500, collected_to_date_cents == 0, statement_count == 4 and delinquent_statement_count == 0"
            - "no repeated read changes any of these figures, since the whole recompute is inside the filing request"

      - name: a_remittance_reaches_the_district_ledger_inside_the_same_request
        claim_type: immediate_visibility
        grounds:
          - endpoints.POST_/assessment-statements/{id}/remittances
          - calculations.remittance_waterfall
          - entities.District.fields.collected_to_date_cents
          - entities.AssessmentPeriod.fields.collected_total_cents
        distinguishing_aspect: |
          One payment touches four rows — Remittance, AssessmentStatement, AssessmentPeriod and
          District — and all four are settled before the 201 returns. The waterfall split is recorded
          on the Remittance row in the response, the statement is already PAID_IN_FULL, and the
          district and period money counters have already moved by the full amount_cents, so the
          public financial summary read that follows needs no delay and no re-read to agree.
        test_recipe:
          setup:
            - "canonical district ACTIVE, FY2027-Q1 open, st1 filed at 824500 with nothing paid"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
          trigger:
            - *c_pay_st1_full
            - call: "GET /assessment-statements/${st1_id}"
              payload: {}
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "GET /districts/${d_id}/financial-summary"
              payload: { fiscal_year: 2027 }
              as: PublicViewer
          assert:
            - "the remittance response carries applied_to_interest_cents == 0, applied_to_penalty_cents == 0, applied_to_principal_cents == 824500, applied_to_credit_cents == 0, status == APPLIED and version == 1"
            - "by the time that 201 returns AssessmentStatement.${st1_id}.principal_paid_cents == 824500, credit_balance_cents == 0, total_due_cents == 0, payment_status == PAID_IN_FULL and version == 3"
            - "the following GET of the statement returns the same five values unchanged"
            - "District.${d_id}.collected_to_date_cents == 824500 and AssessmentPeriod.${ap_id}.collected_total_cents == 824500 on the first read after the payment"
            - "GET /districts/${d_id}/financial-summary returns collected_to_date_cents == 824500, billed_total_cents == 824500, credit_total_cents == 0 and delinquent_charges_cents == 0"
