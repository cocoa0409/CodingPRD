      - BillingCycle.status remains BILLED
- section: cross_cutting_layers
  instances:
  - name: clock_default_is_fixed_epoch
    claim_type: derived_field_reconciliation
    grounds:
    - complexity_profile
    - endpoints[POST /_clock/set_current_utc]
    distinguishing_aspect: 'Before any set_current_utc call, the logical clock reads exactly 2026-08-01T00:00:00Z: a boil order issued with no
      clock-set has issued_utc == 2026-08-01T00:00:00Z and notification_deadline_utc == 2026-08-02T00:00:00Z.'
    test_recipe:
      setup:
      - District exists; no clock-set call made
      setup_api_calls:
      - call: POST /districts
        payload:
          district_name: LA
          usda_loan_principal_cents: 1000000
          annual_debt_service_cents: 120000
        as: SystemAdmin
        captures:
          la_id: $.data.id
      trigger:
      - call: POST /districts/${la_id}/boil-orders
        payload:
          reason: Default clock check
        as: FieldOperator
        captures:
          la_bo: $.data
      assert:
      - BoilOrder.issued_utc == 2026-08-01T00:00:00Z (default logical clock, not wall-clock)
      - BoilOrder.notification_deadline_utc == 2026-08-02T00:00:00Z (issued + 24h)
