# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3390_grant_competition_host_country_placement_exchange_visitor
#
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1-§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as excluded_because stubs.
# Shared base-chain calls are anchored at first use (&c_) and aliased later.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: cycle_create_returns_draft_with_system_fields
        claim_type: Creation
        grounds:
          - entities.CompetitionCycle
          - endpoints.POST_/exchange/cycles
        distinguishing_aspect: "A cycle created with only academic_year and application_deadline returns 201 with status DRAFT (system-set, never client-supplied), version 1, and non-null id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_cycle
              call: "POST /exchange/cycles"
              payload: { academic_year: "2027-2028", application_deadline: "2026-10-15T23:59:59Z" }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "CompetitionCycle.${cyc}.status == DRAFT and version == 1"
            - "academic_year == 2027-2028 and application_deadline == 2026-10-15T23:59:59Z round-trip"
            - "id, created_at, updated_at are present and system-generated; meta.api_request_id present"

      - name: country_program_create_initializes_slots_remaining
        claim_type: Computed Fields
        grounds:
          - entities.CountryProgram.fields.slots_remaining
          - calculations.slot_accounting
        distinguishing_aspect: "slots_remaining is computed, not stored from input: at creation it equals slot_quota (2), and a subsequent GET returns the same derived value."
        test_recipe:
          setup:
            - "One cycle in DRAFT."
          setup_api_calls:
            - *c_cycle
          trigger:
            - &c_prog_de_q2
              call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "DE", slot_quota: 2, min_duration_months: 6, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 360000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp: $.data.id, rem: $.data.slots_remaining }
            - call: "GET /exchange/country-programs/${cp}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
          assert:
            - "the create response status is 201 with slots_remaining == 2 (== slot_quota; zero consuming applications)"
            - "GET /exchange/country-programs/${cp} returns slots_remaining == 2 and language_requirement == NONE unchanged"

      - name: country_program_create_missing_required_quota_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CountryProgram.fields.slot_quota
          - validations[priority=9 business_constraint ERR_VALIDATION]
        distinguishing_aspect: "slot_quota is a required input with no default; omitting it is a 400 ERR_VALIDATION — distinct from any 404 or 409."
        test_recipe:
          setup:
            - "One cycle in DRAFT."
          setup_api_calls:
            - *c_cycle
          trigger:
            - call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "DE", min_duration_months: 6, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 360000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_VALIDATION"
            - "response_type is error and data carries error_id and message"

      - name: applicant_register_enrolled_missing_required_institution_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Applicant.fields.home_institution_name
          - validations[priority=9 business_constraint ERR_VALIDATION]
        distinguishing_aspect: "home_institution_name is conditionally required: omitted with applicant_type ENROLLED_STUDENT it fails with 400 ERR_VALIDATION, while the same omission with INDEPENDENT succeeds — the requirement flips on the enum value."
        test_recipe:
          setup:
            - "Empty database; clock default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/applicants"
              payload: { full_name: "No Institution", email: "no.inst@example.com", applicant_type: "ENROLLED_STUDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
            - call: "POST /exchange/applicants"
              payload: { full_name: "Free Agent", email: "free.agent@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { apl: $.data.id }
          assert:
            - "the ENROLLED_STUDENT registration without home_institution_name fails: status 400, error_id == ERR_VALIDATION"
            - "the INDEPENDENT registration without home_institution_name succeeds: status 201, Applicant.${apl}.id present"

      - name: applicant_register_duplicate_email_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.email
          - errors.ERR_DUPLICATE_EMAIL
        distinguishing_aspect: "Email uniqueness is enforced across applicants regardless of applicant_type: the second registration with an existing email is a 409 ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup:
            - "One registered applicant with email twin@example.com."
          setup_api_calls:
            - call: "POST /exchange/applicants"
              payload: { full_name: "Twin One", email: "twin@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
          trigger:
            - call: "POST /exchange/applicants"
              payload: { full_name: "Twin Two", email: "twin@example.com", applicant_type: "ENROLLED_STUDENT", home_institution_name: "State University", citizenship_country_code: "CA" }
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_EMAIL"

      - name: application_get_with_unknown_id_returns_application_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/exchange/applications/{application_id}
          - errors.ERR_APPLICATION_NOT_FOUND
          - validations[priority=3 existence]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the application path produces the entity-specific 404 ERR_APPLICATION_NOT_FOUND with the full error envelope — not a generic 400 or 500."
        test_recipe:
          setup:
            - "Empty database; clock default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /exchange/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_APPLICATION_NOT_FOUND"
            - "response_type == error and data carries both error_id and message; meta.api_request_timestamp present"

      - name: score_post_records_system_fields_without_version
        claim_type: System Fields
        grounds:
          - entities.ReviewScore
        distinguishing_aspect: "ReviewScore has common_fields: false — the response carries server-derived stage (CAMPUS from the application's state) and reviewer_id (from X-User-ID) plus id and created_at, but no version or updated_at fields, and the score is immutable (no update endpoint exists)."
        test_recipe:
          setup:
            - "Cycle with DE program OPEN; enrolled applicant's application submitted and sitting in CAMPUS_REVIEW."
          setup_api_calls:
            - *c_cycle
            - &c_prog_de_q1
              call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "DE", slot_quota: 1, min_duration_months: 6, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 360000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp: $.data.id }
            - &c_open
              call: "POST /exchange/cycles/${cyc}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /exchange/applicants"
              payload: { full_name: "En Rolla", email: "en.rolla@example.com", applicant_type: "ENROLLED_STUDENT", home_institution_name: "State University", citizenship_country_code: "US" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Wetland Mosses", project_summary: "Bryophyte survey", proposed_duration_months: 9, dependents_count: 0 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
          trigger:
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 71.5, country_fit_score: 66, language_score: 82, comment: "Strong feasibility" }
              as: CampusReviewer
              as_user_id: "cr-9"
              captures: { score_id: $.data.id }
          assert:
            - "the response status is 201; ReviewScore.${score_id}.stage == CAMPUS (derived from application state, not from the request)"
            - "ReviewScore.${score_id}.reviewer_id == cr-9 (from X-User-ID header, not the payload)"
            - "id and created_at are present; the response has NO version and NO updated_at fields (common_fields: false)"
            - "feasibility_score == 71.5 round-trips (decimal scores accepted within 0-100)"

      - name: application_create_with_unknown_field_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=9 business_constraint ERR_VALIDATION]
          - endpoints.POST_/exchange/applications
        distinguishing_aspect: "The application create contract is closed: a payload carrying an undeclared field (status, which is system-owned) is rejected with 400 ERR_VALIDATION rather than silently ignored."
        test_recipe:
          setup:
            - "Cycle with DE program OPEN; one independent applicant."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - &c_apl_ind
              call: "POST /exchange/applicants"
              payload: { full_name: "Indy Pendent", email: "indy.pendent@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { apl: $.data.id }
          trigger:
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Cave Paintings", project_summary: "Pigment analysis", proposed_duration_months: 10, dependents_count: 0, status: "SELECTED" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_VALIDATION (client-supplied system field status is an unknown request field)"
            - "no application is persisted for the rejected payload"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: cycle_open_without_country_programs_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CompetitionCycle.DRAFT_to_OPEN
          - errors.ERR_NO_COUNTRY_PROGRAMS
        distinguishing_aspect: "DRAFT -> OPEN is guarded by the existence of at least one CountryProgram; an empty cycle cannot open."
        test_recipe:
          setup:
            - "One cycle in DRAFT with no country programs."
          setup_api_calls:
            - *c_cycle
          trigger:
            - call: "POST /exchange/cycles/${cyc}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_COUNTRY_PROGRAMS"
            - "CompetitionCycle.${cyc}.status remains DRAFT"

      - name: cycle_finalize_with_applications_pending_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CompetitionCycle.SCREENING_to_AWARDS_FINALIZED
          - errors.ERR_APPLICATIONS_PENDING
        distinguishing_aspect: "FINALIZE_AWARDS is blocked while any application is still under review (here one sits in NATIONAL_SCREENING); the cycle stays in SCREENING."
        test_recipe:
          setup:
            - "Cycle with DE program; one independent application submitted (NATIONAL_SCREENING); cycle advanced OPEN -> CLOSED -> SCREENING."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - &c_app
              call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Harbor Sediments", project_summary: "Sediment core dating", proposed_duration_months: 10, dependents_count: 1 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - &c_submit
              call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
            - &c_close
              call: "POST /exchange/cycles/${cyc}/transition"
              payload: { action: "CLOSE" }
              as: PlatformAdmin
            - &c_screen
              call: "POST /exchange/cycles/${cyc}/transition"
              payload: { action: "BEGIN_SCREENING" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/cycles/${cyc}/transition"
              payload: { action: "FINALIZE_AWARDS" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_APPLICATIONS_PENDING"
            - "CompetitionCycle.${cyc}.status remains SCREENING"

      - name: application_submit_while_cycle_draft_returns_cycle_not_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.DRAFT_to_NATIONAL_SCREENING
          - errors.ERR_CYCLE_NOT_OPEN
        distinguishing_aspect: "The cycle gate binds application creation too: with the cycle still DRAFT (never opened), even creating the DRAFT application fails — submission gating is unreachable because no draft can exist."
        test_recipe:
          setup:
            - "Cycle in DRAFT with a DE program (programs are creatable pre-open); one independent applicant."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_apl_ind
          trigger:
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Tidal Flats", project_summary: "Wadden Sea transect", proposed_duration_months: 10, dependents_count: 0 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CYCLE_NOT_OPEN (create and SUBMIT share the OPEN gate)"
            - "no application exists afterwards"

      - name: withdrawn_application_cannot_be_submitted
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "WITHDRAWN is terminal: a withdrawn DRAFT rejects a later SUBMIT with 409 ERR_INVALID_STATE and stays WITHDRAWN."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; independent applicant's application created then WITHDRAWN."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "WITHDRAW" }
              as: Applicant
              as_user_id: "${apl}"
          trigger:
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Application.${app}.status remains WITHDRAWN"

      - name: decide_with_outcome_foreign_to_stage_returns_invalid_outcome
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=9 business_constraint ERR_INVALID_OUTCOME]
        distinguishing_aspect: "Outcome validity is stage-dependent: outcome SELECT is legal in HOST_REVIEW but in NATIONAL_SCREENING it is a 400 ERR_INVALID_OUTCOME (distinct from a 409 state error)."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; independent application submitted (NATIONAL_SCREENING)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
          trigger:
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: NationalReviewer
              as_user_id: "nr-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_OUTCOME"
            - "Application.${app}.status remains NATIONAL_SCREENING"

      - name: campus_endorse_without_quorum_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.CAMPUS_REVIEW_to_NATIONAL_SCREENING
          - errors.ERR_SCORE_QUORUM_NOT_MET
        distinguishing_aspect: "Campus endorsement requires CAMPUS_QUORUM (2) campus scores; with exactly one posted the ENDORSE decision fails — the quorum counts scores, not reviewers' intentions."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; enrolled application in CAMPUS_REVIEW with exactly one campus score."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Cam Pus", email: "cam.pus@example.com", applicant_type: "ENROLLED_STUDENT", home_institution_name: "State University", citizenship_country_code: "US" }
              as: Anonymous
              captures: { apl: $.data.id }
            - *c_app
            - *c_submit
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 75, country_fit_score: 75, language_score: 75 }
              as: CampusReviewer
              as_user_id: "cr-1"
          trigger:
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "ENDORSE" }
              as: CampusReviewer
              as_user_id: "cr-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SCORE_QUORUM_NOT_MET (1 of 2 required campus scores)"
            - "Application.${app}.status remains CAMPUS_REVIEW"

      - name: duplicate_score_from_same_reviewer_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=9 business_constraint ERR_DUPLICATE_SCORE]
        distinguishing_aspect: "Scores are unique per (application, stage, reviewer_id): the same national reviewer posting twice is a 409 ERR_DUPLICATE_SCORE, while a different reviewer's score is accepted."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; independent application in NATIONAL_SCREENING; reviewer nr-1 has already scored it."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - &c_score80a
              call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 80, country_fit_score: 80, language_score: 80 }
              as: NationalReviewer
              as_user_id: "nr-1"
          trigger:
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 90, country_fit_score: 90, language_score: 90 }
              as: NationalReviewer
              as_user_id: "nr-1"
              captures: { error_id: $.data.error_id }
            - &c_score80b
              call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 80, country_fit_score: 80, language_score: 80 }
              as: NationalReviewer
              as_user_id: "nr-2"
          assert:
            - "nr-1's second score fails: status 409, error_id == ERR_DUPLICATE_SCORE"
            - "nr-2's score succeeds (201) — uniqueness is per reviewer, not per stage alone"

      - name: placement_respond_after_deadline_returns_offer_expired
        claim_type: Temporal Validation
        grounds:
          - state_machines.PlacementRound.OFFERED_to_ACCEPTED
          - validations[priority=8 business_temporal ERR_OFFER_EXPIRED]
        distinguishing_aspect: "Offer deadlines are inclusive at expiry for responses: at clock 2027-02-01 the response_deadline 2027-01-01 has passed, so even the owning applicant's ACCEPT is rejected with ERR_OFFER_EXPIRED while the round remains OFFERED."
        test_recipe:
          setup:
            - "Base pipeline to PLACEMENT with one OFFERED round whose response_deadline is 2027-01-01; clock advanced past it to 2027-02-01."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - &c_recommend
              call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "RECOMMEND" }
              as: NationalReviewer
              as_user_id: "nr-1"
            - &c_select
              call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { app_v_sel: $.data.version }
            - &c_getgrants
              call: "GET /exchange/applications/${app}/grants"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { gr: $.data.0.id }
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "Heidelberg Institute", institution_band: "STANDARD", response_deadline: "2027-01-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { rnd: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_OFFER_EXPIRED"
            - "PlacementRound.${rnd}.status remains OFFERED (a late response does not auto-expire the round)"
            - "Application.${app}.status remains PLACEMENT"

      - name: placement_expire_before_deadline_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PlacementRound.OFFERED_to_EXPIRED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "EXPIRE is only legal strictly after the deadline: at clock 2027-01-01 equal to response_deadline 2027-01-01 the officer's EXPIRE is rejected (ERR_INVALID_STATE), and the applicant can still accept at the deadline instant."
        test_recipe:
          setup:
            - "Base pipeline to PLACEMENT with one OFFERED round, response_deadline 2027-01-01; clock exactly 2027-01-01."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - call: "POST /exchange/applications/${app}/placement-rounds"
