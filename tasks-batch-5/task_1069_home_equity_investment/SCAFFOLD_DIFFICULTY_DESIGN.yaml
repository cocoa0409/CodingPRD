              as: InvestmentAnalyst
              captures: { val_id: $.data.id }
            - call: "POST /hei/applications/${app_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /hei/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: InvestmentAnalyst
            - call: "POST /hei/applications/${app_id}/offers"
              payload: { valuation_id: "${val_id}", investment_amount_cents: 10000000, option_percentage: 0.25, risk_adjustment_pct: 0.10, term_months: 120, capped_annual_rate: 0.19, expires_at: "2027-01-01T00:00:00Z" }
              as: InvestmentAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /hei/offers/${offer_id}/accept"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "GET /hei/agreements?offer_id=${offer_id}"
              payload: {}
              as: InvestmentAnalyst
              captures: { agr_id: "$.data[0].id" }
            - call: "GET /hei/liens?agreement_id=${agr_id}"
              payload: {}
              as: ClosingAgent
              captures: { lien_id: "$.data[0].id" }
            - call: "POST /hei/liens/${lien_id}/record"
              payload: { title_status: "CLEAR", lien_position: 2 }
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/activate"
              payload: {}
              as: ClosingAgent
            - call: "POST /hei/agreements/${agr_id}/initiate-exit"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /hei/agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /hei/agreements/${agr_id}/settlements"
              payload: { settlement_type: "SALE", sale_price_cents: 120000000, mortgage_payoff_cents: 40000000, expected_agreement_version: "${agr_v}" }
              as: ComplianceOfficer
              captures: { s_id: $.data.id }
          assert:
            - "Settlement.${s_id}.appreciation_share_cents == 950000"
            - "Settlement.${s_id}.elapsed_months == 6"

      - name: settlement_fee_round_then_sum
        grounds:
          - calculations.settlement_fee
          - entities.Settlement.fields.settlement_fee_cents
        distinguishing_aspect: |
          Mode (b): rounding order. origination=round_half_up(0.03*1000050)=30002 and
          servicing=round_half_up(0.01*12345650)=123457, summed with ADMIN_FLAT 50000 gives 203459
          (round-then-sum). Sum-then-round would give 203458 — the pinned order changes the cent.
        test_recipe:
          setup:
            - "AGR-B: investment 1000050, AVM valuation 5000000 (risk_adj 0.10 -> adjusted_start 4500000), EXIT_INITIATED"
            - "Settlement SALE with sale_price 12345650, mortgage_payoff 1000000"
          setup_api_calls:
            - call: "POST /hei/funds"
              payload: { name: "F4", total_capital_cents: 5000000 }
              as: InvestmentAnalyst
              captures: { fund_id: $.data.id }
            - call: "POST /hei/homeowners"
