              captures: { d2: $.data.id }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-O", name: "Route O", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: $.data.id }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-O", name: "Store O", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: $.data.id }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "BUTTER-8", name: "Butter", units_per_case: 1, shelf_life_days: 60, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
              captures: { pl: $.data.id }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Ora Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: $.data.id }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 10 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "POST /dairy/route-sale-listings"
              payload: { route_id: "${r1}", asking_price_cents: 5000000, trailing_weeks: 12 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { l1: $.data.id }
            - { call: "POST /dairy/route-sale-listings/${l1}/publish", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - call: "POST /dairy/route-sale-listings/${l1}/submit-offer"
              payload: { buyer_distributor_id: "${d2}", offer_price_cents: 4900000 }
              as: DistributorOwner
              as_user_id: "${d2}"
            - { call: "POST /dairy/route-sale-listings/${l1}/accept-offer", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /dairy/route-sale-listings/${l1}/approve-transfer", payload: {}, as: TerritoryManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /dairy/orders/${o1}/cancel", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
            - { call: "POST /dairy/route-sale-listings/${l1}/approve-transfer", payload: {}, as: TerritoryManager, captures: { l1_status: "$.data.status" } }
            - { call: "GET /dairy/routes/${r1}", as: Any, captures: { r1_owner: "$.data.distributor_id" } }
          assert:
            - "err == ERR_ROUTE_HAS_OPEN_ORDERS while O1 PLANNED (cross-entity gate Listing -> Order)"
            - "l1_status == CLOSED after the order is cancelled"
            - "r1_owner == ${d2} (ownership transferred to buyer; route.version incremented)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_trips_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_TRIP_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource = Driver, interval semantics = half-open [depart, return):
          a second trip departing exactly at the first trip's return (12:00)
          is ALLOWED, while 11:59 overlaps and is rejected with
          ERR_TRIP_WINDOW_CONFLICT. Companion instance uses buffer semantics on
          a different resource (store dock appointments).
        test_recipe:
          setup:
            - "Distributor, ACTIVE route, store, driver DR1"
            - "Trip T1 PLANNED 2026-08-10 05:00-12:00Z for DR1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist P", license_number: "LIC-P-1" }
              as: TerritoryManager
              captures: { d1: $.data.id }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-P", name: "Route P", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: $.data.id }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-P", name: "Store P", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: $.data.id }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Pat Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: $.data.id }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 100, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T12:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-2", case_capacity: 100, planned_depart_at: "2026-08-10T12:00:00Z", planned_return_at: "2026-08-10T17:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t2: $.data.id }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-3", case_capacity: 100, planned_depart_at: "2026-08-10T11:59:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Trip T2 created successfully (depart == T1.return is allowed under half-open semantics)"
            - "err == ERR_TRIP_WINDOW_CONFLICT for T3 (11:59 < 12:00 overlaps [05:00, 12:00))"

      - name: store_dock_buffer_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_DOCK_WINDOW_CONFLICT]
          - state_machines.RouteOrder.PLANNED_to_CONFIRMED
        distinguishing_aspect: |
          Resource = Store dock, interval semantics = 15-minute buffer: a
          window starting exactly 15 minutes after a confirmed window's end is
          ALLOWED, while a 14-minute gap is rejected with
          ERR_DOCK_WINDOW_CONFLICT. Different resource and different interval
          arithmetic than driver_trips_half_open_adjacency (buffer vs
          half-open adjacency).
        test_recipe:
          setup:
            - "Distributor, ACTIVE route, store S1 (credit_limit 100000000), driver, product PL 250c; trip T1 2026-08-10"
            - "Order O1 window 08:00-08:30 CONFIRMED"
