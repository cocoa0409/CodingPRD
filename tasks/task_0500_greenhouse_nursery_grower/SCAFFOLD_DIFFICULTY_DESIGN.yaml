# =============================================================================
# Task 0500 — Greenhouse & Nursery Grower (wholesale)
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Nine Difficulty Rules (§0.5), 2 instances each = 18 instances.
# Default logical clock at startup: 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: PropagationBatch domain (saleable count) --------------
      - name: saleable_provisional_vs_final_diverge_on_batch
        grounds:
          - calculations.saleable_count
          - state_machines.PropagationBatch.GROWING_to_GRADING
          - state_machines.PropagationBatch.GRADING_to_SALEABLE
          - entities.PropagationBatch.fields.saleable_count
        distinguishing_aspect: |
          On entity domain PropagationBatch: at start-grading the PROVISIONAL
          variant = floor(live_count * 0.80) = 800 (a forward projection),
          while at finalize-grade the FINAL variant = live_count = 1000; the two
          variants on the SAME batch produce 800 vs 1000.
        test_recipe:
          setup:
            - "ACTIVE variety footprint=2, grow_cycle_days=10, height_min=12, min_live_pct=0.80, requires_phyto=false."
            - "OPEN zone capacity=4000."
            - "Batch sourced_count=1000, transplanted with started_count=1000 (live_count=1000), no culls."
            - "Clock advanced past target_ship_date; a GRADE measurement of height 15 recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Petunia A", cultivar_code: "PETA1", propagation_form: "PLUG", grow_cycle_days: 10, container_footprint_units: 2, ship_ready_grade_min_height_cm: 12, ship_ready_min_live_pct: 0.80, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH1 A", climate_class: "MIXED", capacity_units: 4000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "PlugCo", sourced_count: 1000 }
              as: ProductionTech
              captures: { batch_id: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${batch_id}/transplant"
              payload: { started_count: 1000, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-12T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${batch_id}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 15, dead_observed: 0 }
              as: ProductionTech
          trigger:
            - call: "POST /nursery/batches/${batch_id}/start-grading"
              payload: {}
              as: ProductionTech
              captures: { prov: $.data.saleable_count }
            - call: "POST /nursery/batches/${batch_id}/finalize-grade"
              payload: {}
              as: ProductionTech
              captures: { fin: $.data.saleable_count }
          assert:
            - "After start-grading: PropagationBatch.${batch_id}.saleable_count == 800 (provisional floor(1000*0.80))"
            - "After finalize-grade: PropagationBatch.${batch_id}.status == SALEABLE"
            - "After finalize-grade: PropagationBatch.${batch_id}.saleable_count == 1000 (final == live_count)"
            - "The two variants diverge: 800 != 1000"

      # --- Instance 2: loss-cost domain (Broker/standard vs actual) ----------
      - name: shrink_loss_standard_vs_actual_diverge_on_oversourced_batch
        grounds:
          - calculations.shrink_loss_cost
          - state_machines.PropagationBatch.GROWING_to_CULLED
          - entities.PropagationBatch.fields.sourced_count
          - entities.PropagationBatch.fields.started_count
        distinguishing_aspect: |
          On the loss-cost subject (a DIFFERENT calculation domain than saleable_count):
          STANDARD loss = culled*35 = 14000, but ACTUAL loss amortizes the
          over-sourced plug spend: unit = round_half_up(500*35/400)=44, actual =
          400*44 = 17600; standard != actual because sourced_count(500) != started_count(400).
        test_recipe:
          setup:
            - "ACTIVE variety footprint=2. OPEN zone capacity=4000."
            - "Batch sourced_count=500, transplanted started_count=400 (over-sourced), live_count=400, GROWING."
          setup_api_calls:
            - call: "POST /nursery/varieties"
              payload: { common_name: "Petunia B", cultivar_code: "PETB1", propagation_form: "PLUG", grow_cycle_days: 10, container_footprint_units: 2, ship_ready_grade_min_height_cm: 12, ship_ready_min_live_pct: 0.80, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH1 B", climate_class: "MIXED", capacity_units: 4000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "PlugCo", sourced_count: 500 }
              as: ProductionTech
              captures: { batch_id: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${batch_id}/transplant"
              payload: { started_count: 400, expected_zone_version: "${zv}" }
              as: ProductionTech
          trigger:
            - call: "POST /nursery/batches/${batch_id}/cull-batch"
              payload: { loss_basis: "ACTUAL" }
              as: ProductionTech
              captures: { cull: $.data.cull_count }
          assert:
            - "PropagationBatch.${batch_id}.status == CULLED"
            - "PropagationBatch.${batch_id}.cull_count == 400 and live_count == 0"
            - "STANDARD basis would charge 400*35 == 14000 cents"
            - "ACTUAL basis charges 400*round_half_up(500*35/400) == 400*44 == 17600 cents; 14000 != 17600"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Instance 1: mode (b) nested rounding order pinned -----------------
      - name: rebate_sum_then_round_not_round_per_line
        grounds:
          - calculations.order_pricing
          - state_machines.BrokerOrder.DRAFT_to_CONFIRMED
          - entities.BrokerOrder.fields.order_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two lines each extended=431375 cents, 2030
          units (>=2000 -> 2% tier). SUM-THEN-ROUND rebate = round_half_up(862750*0.02)
          = 17255; round-per-line would be 2*round_half_up(431375*0.02)=17256. The
          scaffold pins SUM-THEN-ROUND, so order_total_cents == 861495, not 861494.
        test_recipe:
          setup:
            - "Broker ship_to_state=WA (NEIGHBOR band), credit_limit very high. ACTIVE variety, two SALEABLE batches published @425c each, 1015 available each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Geranium C", cultivar_code: "GERC1", propagation_form: "LINER", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.50, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH2 A", climate_class: "MIXED", capacity_units: 5000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 1015 }
              as: ProductionTech
              captures: { b1: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv1: $.data.version }
            - call: "POST /nursery/batches/${b1}/transplant"
              payload: { started_count: 1015, expected_zone_version: "${zv1}" }
              as: ProductionTech
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 1015 }
              as: ProductionTech
              captures: { b2: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv2: $.data.version }
            - call: "POST /nursery/batches/${b2}/transplant"
              payload: { started_count: 1015, expected_zone_version: "${zv2}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-08T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${b1}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10, dead_observed: 0 }
              as: ProductionTech
            - call: "POST /nursery/batches/${b1}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${b1}/finalize-grade"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${b2}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10, dead_observed: 0 }
              as: ProductionTech
            - call: "POST /nursery/batches/${b2}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${b2}/finalize-grade"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/availability"
              payload: { batch_id: "${b1}", unit_price_cents: 425 }
              as: SalesCoordinator
              captures: { e1: $.data.id }
            - call: "POST /nursery/availability"
              payload: { batch_id: "${b2}", unit_price_cents: 425 }
              as: SalesCoordinator
              captures: { e2: $.data.id }
            - call: "POST /nursery/brokers"
              payload: { company_name: "WA Broker", contact_email: "wa@x.com", ship_to_state: "WA", credit_limit_cents: 5000000 }
              as: SalesCoordinator
              captures: { broker_id: $.data.id }
            - call: "POST /nursery/orders"
              payload: { broker_id: "${broker_id}", requested_ship_date: "2026-03-01T00:00:00Z" }
              as: SalesCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /nursery/orders/${order_id}/lines"
              payload: { availability_entry_id: "${e1}", quantity: 1015 }
              as: SalesCoordinator
            - call: "POST /nursery/orders/${order_id}/lines"
              payload: { availability_entry_id: "${e2}", quantity: 1015 }
              as: SalesCoordinator
            - call: "GET /nursery/orders/${order_id}"
              payload: {}
              as: SalesCoordinator
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /nursery/orders/${order_id}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesCoordinator
              captures: { total: $.data.order_total_cents, sub: $.data.order_subtotal_cents, frt: $.data.freight_cents }
          assert:
            - "BrokerOrder.${order_id}.order_subtotal_cents == 862750"
            - "BrokerOrder.${order_id}.freight_cents == 16000 (NEIGHBOR cap; 41 racks raw 49100 capped)"
            - "BrokerOrder.${order_id}.order_total_cents == 861495 (subtotal 862750 - rebate 17255 + freight 16000)"
            - "order_total_cents != 861494 (would be the round-per-line rebate of 17256)"

      # --- Instance 2: mode (a) >=3 inputs nested min/max tier ---------------
      - name: freight_tier_band_rack_min_max_interaction
        grounds:
          - calculations.freight_charge
          - calculations.order_pricing
          - state_machines.BrokerOrder.DRAFT_to_CONFIRMED
          - entities.BrokerOrder.fields.freight_cents
        distinguishing_aspect: |
          Mode (a) non-linear with 3 interacting inputs (total_units, zone_band
          from ship_to_state, rack ceil): FAR band, 100 units -> ceil(100/50)=2
          racks -> raw = 7000 + 2*1900 = 10800, then min(28000, max(7000, 10800))
          = 10800; freight_cents == 10800 (distinct band/rack/min-max path from
          the rebate-rounding instance).
        test_recipe:
          setup:
            - "Broker ship_to_state=NY (FAR band), high credit. One SALEABLE batch @500c, 100 available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Mum D", cultivar_code: "MUMD1", propagation_form: "LINER", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.50, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH2 B", climate_class: "MIXED", capacity_units: 1000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 100 }
              as: ProductionTech
              captures: { b1: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv1: $.data.version }
            - call: "POST /nursery/batches/${b1}/transplant"
              payload: { started_count: 100, expected_zone_version: "${zv1}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-08T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${b1}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10, dead_observed: 0 }
              as: ProductionTech
            - call: "POST /nursery/batches/${b1}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${b1}/finalize-grade"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/availability"
              payload: { batch_id: "${b1}", unit_price_cents: 500 }
              as: SalesCoordinator
              captures: { e1: $.data.id }
            - call: "POST /nursery/brokers"
              payload: { company_name: "NY Broker", contact_email: "ny@x.com", ship_to_state: "NY", credit_limit_cents: 5000000 }
              as: SalesCoordinator
              captures: { broker_id: $.data.id }
            - call: "POST /nursery/orders"
              payload: { broker_id: "${broker_id}", requested_ship_date: "2026-03-01T00:00:00Z" }
              as: SalesCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /nursery/orders/${order_id}/lines"
              payload: { availability_entry_id: "${e1}", quantity: 100 }
              as: SalesCoordinator
            - call: "GET /nursery/orders/${order_id}"
              payload: {}
              as: SalesCoordinator
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /nursery/orders/${order_id}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesCoordinator
              captures: { frt: $.data.freight_cents, total: $.data.order_total_cents }
          assert:
            - "BrokerOrder.${order_id}.order_subtotal_cents == 50000"
            - "BrokerOrder.${order_id}.freight_cents == 10800 (FAR: 7000 + ceil(100/50)*1900, within [7000,28000])"
            - "BrokerOrder.${order_id}.order_total_cents == 60800 (no rebate; 100 units < 2000)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Instance 1: PropagationBatch — branching fork + regrade cycle -----
      - name: batch_grade_fork_held_then_cycle_back_to_saleable
        grounds:
          - state_machines.PropagationBatch.GRADING_to_HELD
          - state_machines.PropagationBatch.HELD_to_GRADING
          - state_machines.PropagationBatch.GRADING_to_SALEABLE
          - entities.PropagationBatch.fields.status
        distinguishing_aspect: |
          PropagationBatch is non-linear: finalize-grade FORKS to HELD (fails
          height spec) vs SALEABLE, and HELD->GRADING->SALEABLE is a CYCLE after
          a fresh measurement. First finalize -> HELD (height 10 < 12), then a new
          GRADE 14, start-grading, finalize -> SALEABLE.
        test_recipe:
          setup:
            - "ACTIVE variety height_min=12, min_live_pct=0.80, footprint=1. OPEN zone cap 3000."
            - "Batch started 500, live 500. Clock past target. First GRADE height=10 (below spec)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Coleus E", cultivar_code: "COLE1", propagation_form: "PLUG", grow_cycle_days: 7, container_footprint_units: 1, ship_ready_grade_min_height_cm: 12, ship_ready_min_live_pct: 0.80, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH3 A", climate_class: "MIXED", capacity_units: 3000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 500 }
              as: ProductionTech
              captures: { batch_id: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${batch_id}/transplant"
              payload: { started_count: 500, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-09T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${batch_id}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10, dead_observed: 0 }
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/finalize-grade"
              payload: {}
              as: ProductionTech
          trigger:
            - call: "POST /nursery/batches/${batch_id}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 14, dead_observed: 0 }
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/finalize-grade"
              payload: {}
              as: ProductionTech
              captures: { st: $.data.status, sc: $.data.saleable_count }
          assert:
            - "After first finalize-grade: PropagationBatch.${batch_id}.status == HELD and saleable_count == 0"
            - "After cycle (new GRADE 14 -> start-grading -> finalize-grade): status == SALEABLE"
            - "After cycle: PropagationBatch.${batch_id}.saleable_count == 500 (live_count)"

      # --- Instance 2: Shipment — dispatch then compensating void ------------
      - name: shipment_dispatch_then_void_compensation_branch
        grounds:
          - state_machines.Shipment.DRAFT_to_DISPATCHED
          - state_machines.Shipment.DISPATCHED_to_VOIDED
          - entities.Shipment.fields.status
          - entities.PropagationBatch.fields.live_count
        distinguishing_aspect: |
          On the Shipment entity (different from PropagationBatch): the machine is
          non-linear via a compensating branch DISPATCHED->VOIDED that reverses
          every dispatch side-effect. Dispatch deducts batch.live_count by 60
          (500->440); void restores it (440->500).
        test_recipe:
          setup:
            - "ACTIVE variety footprint=1, no phyto. SALEABLE batch live=500 published @300c."
            - "ACTIVE broker FAR state NY high credit. Confirmed order with one line qty=60. Shipment DRAFT for 60 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Verbena F", cultivar_code: "VERF1", propagation_form: "LINER", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.50, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH3 B", climate_class: "MIXED", capacity_units: 3000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 500 }
              as: ProductionTech
              captures: { batch_id: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${batch_id}/transplant"
              payload: { started_count: 500, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${batch_id}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10, dead_observed: 0 }
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/finalize-grade"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/availability"
              payload: { batch_id: "${batch_id}", unit_price_cents: 300 }
              as: SalesCoordinator
              captures: { e1: $.data.id }
            - call: "POST /nursery/brokers"
              payload: { company_name: "NY Broker", contact_email: "ny@x.com", ship_to_state: "NY", credit_limit_cents: 5000000 }
              as: SalesCoordinator
              captures: { broker_id: $.data.id }
            - call: "POST /nursery/orders"
              payload: { broker_id: "${broker_id}", requested_ship_date: "2026-03-01T00:00:00Z" }
              as: SalesCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /nursery/orders/${order_id}/lines"
              payload: { availability_entry_id: "${e1}", quantity: 60 }
              as: SalesCoordinator
              captures: { line_id: $.data.id }
            - call: "GET /nursery/orders/${order_id}"
              payload: {}
              as: SalesCoordinator
              captures: { ov: $.data.version }
            - call: "POST /nursery/orders/${order_id}/confirm"
              payload: { expected_order_version: "${ov}" }
