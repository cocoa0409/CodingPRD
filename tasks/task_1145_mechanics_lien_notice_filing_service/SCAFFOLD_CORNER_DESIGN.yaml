            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Ck Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n_id: $.data.id } }
          trigger:
            - { call: "GET /lien/notices/${n_id}", payload: {}, as: OpsAgent, captures: { st: $.data.status, dl: $.data.service_deadline } }
          assert:
            - "NoticeOrder.${n_id}.status == DRAFT (default clock 2026-05-01 <= service_deadline 2026-05-22; no wall-clock fallback)"

      - name: cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: rule_supersede_expires_draft_notice_chain
          rationale: "Depth-3 cascade asserted end-to-end in §1.8; the payment cascade is covered by payment_verify_auto_release_chain."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: provisional_vs_final_claim_amount
          rationale: "Both variants asserted with diverging literals in §1.8."

      - name: derived_counters_covered_by_difficulty
        claim_type: derived_field_reconciliation
        grounds: [entities.Project.fields.open_notice_count, entities.Company.fields.open_notice_count]
        excluded_because:
          difficulty_instance: notice_create_expire_conserves_open_count
          rationale: "Reconciliation of both counters across create and expiry asserted in §1.8."
