              payload: { fc_code: "FC-A1", region_code: "US-WEST", prep_profile: "LABEL_ONLY", case_pack_min_units: 1, receiving_capacity_units_per_window: 100000, monthly_storage_rate_cents_per_cubic_foot: 87, ltsf_rate_cents_per_cubic_foot: 620 }
              as: MarketplaceAdmin
              captures: { fc_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv1: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-01T00:00:00Z", appointment_window_end: "2026-08-02T00:00:00Z", expected_seller_account_version: "${sv1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/line-items"
              payload: { sku_listing_id: "${l1_id}", units: 100, case_pack_units: 10, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { li1_id: "$.data.id" }
            - call: "PATCH /fulfillment/fulfillment-centers/${fc_id}"
              payload: { receiving_status: "SUSPENDED" }
              as: FcOperator
              as_user_id: "${fc_id}"
          trigger:
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/confirm"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { err_fc: "$.data.error_id" }
            - call: "PATCH /fulfillment/fulfillment-centers/${fc_id}"
              payload: { receiving_status: "OPEN" }
              as: FcOperator
              as_user_id: "${fc_id}"
              captures: { fc_status: "$.data.receiving_status" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/confirm"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { plan_status: "$.data.status", plan_alloc: "$.data.allocated_units" }
          assert:
            - "first confirm returns HTTP 409 with ${err_fc} == ERR_FC_RECEIVING_SUSPENDED"
            - "${fc_status} == OPEN"
            - "${plan_status} == CONFIRMED"
            - "${plan_alloc} == 100"
            - "InboundShipmentPlan.${p1_id}.final_allocated_units == 100"
            - "InboundShipmentPlan.${p1_id}.confirmed_at == 2026-08-01T00:00:00Z"
