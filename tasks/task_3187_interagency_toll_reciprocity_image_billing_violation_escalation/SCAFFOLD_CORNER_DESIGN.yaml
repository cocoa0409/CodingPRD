  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: Violation → Error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-Role header fails priority 1 with 400 before any role or existence check — even on a valid resource path."
        test_recipe:
          setup:
            - "One agency exists."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { ag: "$.data.id" }
          trigger:
            - call: "GET /toll/agencies/${ag}"
              payload: {}
              as: ""
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: existence_precedes_state_on_nested_path
        claim_type: Priority Ordering
        grounds:
          - validations.priority_3_existence
          - validations.priority_4_state
        distinguishing_aspect: "Voiding a transaction under a non-existent account path returns 404 ERR_NOT_FOUND (existence, priority 3) even when the transaction id is also bogus — existence beats state."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /toll/toll-transactions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/void"
              payload: {}
              as: AgencyOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

      - name: dispute_filed_after_window_closed
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DISPUTE_WINDOW_CLOSED
          - endpoints.POST_/toll/disputes
        distinguishing_aspect: "A classification dispute filed 91 epoch days after the trip is rejected with ERR_DISPUTE_WINDOW_CLOSED; at day 90 it is still accepted."
        test_recipe:
          setup:
            - "Account with TAG-W2 CLASS_2; AWAY P1 base 800 schedule; trip posted at day 0 (charged 800); clock advanced 91 days."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_5", base_rate_cents: 900, axle_multiplier: 2.5, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Win Dow", holder_email: "win@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 50000 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "POST /toll/accounts/${acct}/transponders"
              payload: { tag_number: "TAG-W2", vehicle_class: "CLASS_2", plate_number: "WIN100", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-W2", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T09:00:00Z", is_peak: false, idempotency_key: "w91" }
              as: AgencyOperations
              captures: { txn: "$.data.id" }
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 91 }
              as: SettlementOfficer
          trigger:
            - call: "POST /toll/disputes"
              payload: { account_id: "${acct}", dispute_type: "VEHICLE_CLASSIFICATION", toll_transaction_id: "${txn}", claimed_vehicle_class: "CLASS_5" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_DISPUTE_WINDOW_CLOSED"
            - "TollTransaction.${txn}.status == POSTED (not flipped to DISPUTED)"

      - name: reinstate_blocked_below_threshold_and_by_violations
        claim_type: Violation → Error
        grounds:
          - validations.priority_11_business_fiscal
          - errors.ERR_BALANCE_BELOW_THRESHOLD
          - errors.ERR_ACCOUNT_HAS_UNRESOLVED_VIOLATIONS
        distinguishing_aspect: "Reinstate on a REPLENISHMENT_FAILED-suspended account whose balance is still 400 (< 1000 threshold) fails ERR_BALANCE_BELOW_THRESHOLD; after topping up above threshold with no open violations it succeeds and clears fail count."
        test_recipe:
          setup:
            - "Account suspended after 3 failed replenishments; balance 400, threshold 1000."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: [] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Rey Inst", holder_email: "rey@example.com", discount_plan_id: "${plan_id}", low_balance_threshold_cents: 1000, replenishment_amount_cents: 2500, opening_balance_cents: 400 }
              as: AgencyOperations
              captures: { acct: "$.data.id" }
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { va: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${va}" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { vb: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${vb}" }
              as: AgencyOperations
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { vc: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "FAILED", expected_account_version: "${vc}" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/accounts/${acct}/reinstate"
              payload: {}
              as: AgencyOperations
              captures: { err1: "$.data.error_id" }
            - call: "GET /toll/accounts/${acct}"
              payload: {}
              as: AgencyOperations
              captures: { vd: "$.data.version" }
            - call: "POST /toll/accounts/${acct}/replenishments"
              payload: { amount_cents: 2500, outcome: "SUCCEEDED", expected_account_version: "${vd}" }
              as: AgencyOperations
            - call: "POST /toll/accounts/${acct}/reinstate"
              payload: {}
              as: AgencyOperations
          assert:
            - "first reinstate: 409 ERR_BALANCE_BELOW_THRESHOLD (400 < 1000)"
            - "after successful replenishment balance_cents == 2900 and replenishment_fail_count == 0"
            - "second reinstate: 200, Account.${acct}.status == ACTIVE and suspended_reason is null"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: duplicate_idempotency_key_rejected
        claim_type: Conditional action
        grounds:
          - entities.TollTransaction.fields.idempotency_key
          - errors.ERR_DUPLICATE_TRANSACTION
        distinguishing_aspect: "Reposting the same (away agency, plaza, trip timestamp, idempotency_key) is rejected with ERR_DUPLICATE_TRANSACTION and does NOT double-debit the account."
        test_recipe:
          setup:
            - "AWAY P1 CLASS_2 base 800; account TAG-K balance 10000; one trip posted with idempotency_key dup-1."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
