        claim_type: correct_result
        grounds:
          - calculations.exposure_car_years
          - entities.Policy.fields.exposure_car_years_current_period
          - entities.PlanPeriod.fields.total_assignable_car_years
          - endpoints[POST /plan/plan-periods/{id}/closure].side_effects
        distinguishing_aspect: |
          The exposure interval is clipped on three sides at once - the period window, the policy term
          and the running clock - and the period total is a sum of already-rounded values, never a
