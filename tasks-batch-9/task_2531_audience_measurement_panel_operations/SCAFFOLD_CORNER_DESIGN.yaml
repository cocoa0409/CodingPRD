      - name: meter_serial_uniqueness_outranks_type_occupancy
        claim_type: priority_ordering
        grounds:
          - validations[priority 15]
          - validations[priority 16]
          - validations[priority 73]
        distinguishing_aspect: "A request that repeats a serial AND repeats a meter type violates 15 and 16 at once and must return ERR_METER_SERIAL_DUPLICATE. The pair also has opposite treatment of REMOVED rows: a removed meter still burns its serial forever but no longer occupies its type slot. Removal itself is gated on the household being out of tab."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-675, RANK 175, T 4, B 1000, BUDGET 500000, plus one household h1 (persons_count 2) left in RECRUITED."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Serials", market_code: "DMA-675", dma_rank: 175, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m75_id: "$.data.id" }
            - call: "POST /markets/${m75_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c75_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m75_id}", quota_cell_id: "${c75_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h75_id: "$.data.id" }
          trigger:
            - call: "POST /meters"
              payload: { household_id: "${h75_id}", meter_type: "TV_TUNER", serial_no: "MT-002080" }
              as: FieldTechnician
              captures: { mt75a_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h75_id}", meter_type: "TV_TUNER", serial_no: "MT-002080" }
              as: FieldTechnician
              captures: { e75a: "$.data.error_id" }
            - call: "POST /meters"
              payload: { household_id: "${h75_id}", meter_type: "TV_TUNER", serial_no: "MT-002081" }
              as: FieldTechnician
              captures: { e75b: "$.data.error_id" }
            - call: "POST /meters/${mt75a_id}/removals"
              payload: { removal_note: "Wrong model shipped" }
              as: FieldTechnician
            - call: "POST /meters"
              payload: { household_id: "${h75_id}", meter_type: "TV_TUNER", serial_no: "MT-002081" }
              as: FieldTechnician
              captures: { mt75b_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h75_id}", meter_type: "TV_TUNER", serial_no: "MT-002080" }
              as: FieldTechnician
              captures: { e75c: "$.data.error_id" }
            - call: "POST /meters/${mt75b_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h75_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /meters/${mt75b_id}/removals"
              payload: { removal_note: "Household asked us to pull it" }
              as: FieldTechnician
              captures: { e75d: "$.data.error_id" }
            - call: "GET /meters"
              payload: { household_id: "${h75_id}" }
              as: FieldTechnician
          assert:
            - "Trigger call 1: HTTP 201 with data.install_status == SHIPPED and the household moved RECRUITED -> INSTALL_SCHEDULED"
            - "Trigger call 2: HTTP 409 with ${e75a} == ERR_METER_SERIAL_DUPLICATE - the body also duplicates the TV_TUNER slot, but priority 15 is evaluated before 16"
            - "Trigger call 3: HTTP 409 with ${e75b} == ERR_METER_TYPE_ALREADY_PRESENT - a fresh serial reaches the occupancy rule, which counts the SHIPPED meter"
            - "Trigger call 4: HTTP 200 with data.install_status == REMOVED - the household is INSTALL_SCHEDULED, which is in the removable set of priority 73"
            - "Trigger call 5: HTTP 201 - the REMOVED tuner no longer occupies the TV_TUNER slot, so the replacement ships"
            - "Trigger call 6: HTTP 409 with ${e75c} == ERR_METER_SERIAL_DUPLICATE - serial uniqueness is global and includes REMOVED rows, so MT-002080 can never be reused"
            - "Trigger call 9: HTTP 409 with ${e75d} == ERR_HOUSEHOLD_IN_TAB - h1 is ACTIVE after enumeration and ACTIVE is not one of {INSTALL_SCHEDULED, ENUM_PENDING, NONCOMPLIANT_HOLD, FAULT_HOLD}"
            - "Trigger call 10: data.total_count == 2 - the removal is a status change, not a delete, so both the REMOVED and the INSTALLED meter are listed"

      - name: tuning_interval_shape_methodology_and_recency_rules
        claim_type: conditional_validation
        grounds:
          - validations[priority 7]
          - validations[priority 25]
          - validations[priority 30]
          - validations[priority 32]
        distinguishing_aspect: "source_methodology is not free-form: it must match the parent meter's type under the fixed three-way mapping, so the SAME body is legal on a STREAMING_ROUTER and illegal on a TV_TUNER. Recency is a <= comparison against the logical clock, so an interval ending exactly at 'now' is accepted while one ending a minute later is not, and the shape rule at 25 outranks both."
        test_recipe:
          setup:
            - "CHAIN B with CODE DMA-676, RANK 176, T 4, B 1000, BUDGET 500000, PERSONS 2, SERIAL MT-002082 - one ACTIVE household whose only meter is a TV_TUNER."
            - "The clock is then advanced to 2026-08-05T00:00:00Z so that 2026-08-04 intervals are in the past."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Intervals", market_code: "DMA-676", dma_rank: 176, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
