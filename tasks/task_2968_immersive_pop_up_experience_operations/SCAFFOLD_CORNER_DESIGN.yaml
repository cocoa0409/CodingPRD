          - endpoints[POST /safety-inspections/{inspectionId}/void]
          - state_machines.SafetyInspection
          - endpoints[POST /experience-runs/{runId}/lift-suspension]
          - errors[ERR_INSPECTION_PASS_MISSING]
        distinguishing_aspect: |
          void is the API's only action endpoint whose entire purpose is to reach a terminal state
          that stores LESS than it found: outcome stays null and allowed_occupancy_cap stays 0, so a
          voided inspection is not merely unusable, it is unusable as clearing evidence. That makes
          it the sharpest probe of the lift-suspension precondition, which demands a FINALIZED
          inspection of the same type with outcome PASS. An implementation that keys the lift on
          'an inspection of this run exists and is not FAIL' accepts the void and reopens a run that
          nobody re-inspected; one that treats void as a soft undo lets it cancel the FAIL cascade.
