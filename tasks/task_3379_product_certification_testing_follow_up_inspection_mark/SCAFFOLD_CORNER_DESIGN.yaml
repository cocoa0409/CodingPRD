            - "FollowUpInspection.${insp_id}.status == SCHEDULED (rejected completion leaves it untouched)"
            - "Factory.${fac2_id}.conformity_score == 100 (no finding leaked to the other factory)"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: withdrawal_notice_publish_sets_cooling_off_dates
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST_/certification/withdrawal-notices/{id}/publish
          - state_machines.WithdrawalNotice.DRAFT_to_PUBLISHED
        distinguishing_aspect: "Publishing stamps published_on from the logical clock and effective_on exactly 14 days later (NOTICE_PERIOD_DAYS); the notice is PUBLISHED but not yet EFFECTIVE — enforcement waits for the clock sweep."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup; withdrawal notice drafted."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
            - call: "POST /certification/certifications/${cert_id}/withdrawal-notices"
              payload: { reason_code: "SAFETY", public_text: "Listing withdrawn: shock hazard." }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /certification/withdrawal-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { n_status: $.data.status, n_pub: $.data.published_on, n_eff: $.data.effective_on }
          assert:
            - "response fields: status == PUBLISHED, published_on == 2026-09-01T00:00:00Z, effective_on == 2026-09-15T00:00:00Z (exactly +14 days)"
            - "Certification.${cert_id}.status == ACTIVE immediately after publish (cooling-off has not elapsed)"

      - name: substitution_decide_reject_is_terminal_for_implement
        claim_type: conditional_action
        grounds:
          - state_machines.SubstitutionRequest.SUBMITTED_to_REJECTED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A REJECTED substitution cannot later be implemented: implement fails with ERR_ALREADY_TERMINAL and no construction-record revision is created."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup; substitution for slot power_supply created and decided REJECT."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
            - call: "POST /certification/certifications/${cert_id}/substitution-requests"
              payload: { slot: "power_supply", proposed_component: { component_name: "Generic PSU", material: "n/a", part_number: "GEN-25", rating: "100-240VAC" }, rationale: "Cost reduction" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /certification/substitution-requests/${sub_id}/decide"
              payload: { outcome: "REJECT", note: "Unlisted component family" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /certification/substitution-requests/${sub_id}/implement"
              payload: { expected_certification_version: "${cert_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "SubstitutionRequest.${sub_id}.status == REJECTED"
            - "the project's construction-records list still shows exactly one revision (1, FROZEN)"

      - name: list_endpoints_apply_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - endpoints.GET_/certification/projects
        distinguishing_aspect: "Omitting limit/offset applies the envelope defaults (limit 10, offset 0); with one project on file the response reports total_count 1 and has_more false."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical standard/manufacturer/factory; exactly one project."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
          trigger:
            - call: "GET /certification/projects"
              payload: { manufacturer_id: "${mfr_id}" }
              as: TestEngineer
          assert:
            - "data has length 1, total_count == 1, has_more == false"
            - "the effective limit is 10 and offset 0 (defaults from the fixed envelope)"

