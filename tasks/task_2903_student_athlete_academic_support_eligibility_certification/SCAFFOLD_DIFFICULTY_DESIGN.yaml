          assert:
            - "The trigger response is HTTP 422 with data.error_id == ERR_TUTOR_NOT_TRAINED"
            - "data.error_id != ERR_TUTOR_SUBJECT_MISMATCH even though Tutor.${t3_id}.subject_codes == [\"MATH\"] and the enrollment's course subject_code is SOCI"
            - "Tutor.${t3_id}.status == UNTRAINED and Tutor.${t3_id}.assigned_weekly_hours == 0.00"
            - "GET /athletics/tutor-assignments with tutor_id = ${t3_id} returns total_count == 0"
            - "StudentAthlete.${s12_id}.required_study_hall_hours == 0.0"

  # ---------------------------------------------------------------------------
  # Rule 6 - exact-boundary probes on different metrics at different endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ptd_progress_exactly_at_benchmark_passes
        grounds:
          - calculations.progress_benchmark_evaluation
          - entities.EligibilityCertification.fields.progress_pct
          - entities.EligibilityCertification.fields.required_progress_pct
        distinguishing_aspect: |
          Metric: progress_pct measured against required_progress_pct at exact equality
          (0.2000 == 0.2000) on POST /athletics/certifications. Step 4's comparison is
          inclusive, so the boundary value itself is a PASS and failure_reasons is empty;
          this probes a ratio at 4-decimal precision, not the integer/NULL boundary of the
          APR close probe.
        test_recipe:
          setup:
            - "DegreeProgram BSKINE (catalog_year 2026) has total_required_credits 60.00 and min_progress_gpa 2.00 (default)."
            - "KINE-101 carries 12.00 credit hours and is CORE for BSKINE at catalog year 2026; HIST-210 carries 12.00 credit hours and is NOT_APPLICABLE for BSKINE at catalog year 2026."
            - "Student S13 entered at term_index 1 with entry_catalog_year 2026 and declared BSKINE in term 2026FA, so the CATALOG_AT_ENTRY audit_variant (the default) reads the 2026 rules."
            - "S13 completed KINE-101 with grade B in 2026FA and HIST-210 with grade C in 2027SP, so completed_full_time_terms == 2, cumulative_gpa == 2.50 and degree_applicable_credits == 12.00."
            - "With n == 2 == PTD_GRACE_TERMS, required_progress_pct = min(1.0000, 0.1 * 2) = 0.2000, and progress_pct = 12.00 / 60.00 = 0.2000 exactly."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "BSKINE", name: "BS Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "HIST", course_number: "210", title: "Modern World History", credit_hours: 12.00, instructor_user_id: "instr_hist_1" }
              as: Registrar
              captures: { hist_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${hist_id}", effective_catalog_year: 2026, applicability: "NOT_APPLICABLE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Thirteen", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s13_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s13_id}/major-declaration"
              payload: { declared_program_id: "${prog_id}", term_id: "${term1_id}" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s13_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e13a_id: $.data.id }
            - call: "POST /athletics/enrollments/${e13a_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s13_id}", course_id: "${hist_id}", term_id: "${term2_id}" }
              as: Registrar
              captures: { e13b_id: $.data.id }
            - call: "POST /athletics/enrollments/${e13b_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "C" }
              as: Registrar
            - call: "GET /athletics/student-athletes/${s13_id}"
              payload: {}
              as: Registrar
              captures: { s13_v: $.data.version }
          trigger:
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s13_id}", term_id: "${term2_id}", certification_type: "CONTINUING", expected_student_athlete_version: "${s13_v}" }
              as: CertificationOfficer
              captures: { cert13_id: $.data.id }
          assert:
            - "The trigger response is HTTP 201 with data.status == DRAFT and data.audit_variant == CATALOG_AT_ENTRY"
            - "data.degree_applicable_credits_counted == 12.00 (HIST-210 is NOT_APPLICABLE and contributes 0.00)"
            - "data.completed_full_time_terms_counted == 2 and data.gpa_at_certification == 2.50"
            - "data.progress_pct == 0.2000 and data.required_progress_pct == 0.2000"
            - "data.benchmark_result == PASS and data.failure_reasons == [] because Step 4's comparison is inclusive at the boundary"
            - "StudentAthlete.${s13_id}.progress_pct == 0.2000"

      - name: apr_close_with_zero_eligible_students_yields_null_squad_apr
        grounds:
          - calculations.apr_points_award
          - state_machines.Term.transitions.OPEN_to_CLOSED
          - entities.Term.fields.squad_apr
        distinguishing_aspect: |
          Metric: squad_apr at the apr_points_possible == 0 boundary on
          POST /athletics/terms/{term_id}/apr-close - a different metric and a different
          endpoint from the progress_pct probe. Step 6 must emit NULL rather than 0 when the
          cohort denominator is empty, and the only enrollment in the term is DROPPED so the
          student is excluded from numerator and denominator alike.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) has is_apr_reporting_term == true and end_date 2026-12-18T00:00:00Z."
            - "Student S14 holds exactly one Enrollment in 2026FA and that enrollment is DROPPED, so per apr_points_award's input_set S14 is excluded from both numerator and denominator and the cohort is empty."
            - "No other Term rows exist, so the lower-term_index precondition is vacuously satisfied."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z", is_apr_reporting_term: true }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 12.00, instructor_user_id: "instr_soc_1" }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fourteen", sport_code: "BASE", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s14_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s14_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e14_id: $.data.id }
            - call: "POST /athletics/enrollments/${e14_id}/outcome"
              payload: { action: "DROP" }
              as: Registrar
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-12-18T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/terms/${term1_id}/apr-close"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "The trigger response is HTTP 200 with data.apr_status == CLOSED"
            - "data.apr_points_possible == 0 and data.apr_points_earned == 0"
            - "data.squad_apr is null, not 0"
            - "StudentAthlete.${s14_id}.apr_points_possible == 0, apr_points_earned == 0 and apr_points_forfeited == 0"
            - "StudentAthlete.${s14_id}.support_status == SUPPORT_NORMAL because an excluded student never reaches the APR_FORFEIT_ALERT_POINTS re-derivation"

  # ---------------------------------------------------------------------------
  # Rule 7 - an operation on entity A gated by the state of a different entity B
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: missed_class_request_requires_travel_approved_event
        grounds:
          - errors[ERR_EVENT_NOT_TRAVEL_APPROVED]
          - validations[priority=10]
          - state_machines.CompetitionEvent.transitions.SCHEDULED_to_TRAVEL_APPROVED
          - calculations.missed_class_units
        distinguishing_aspect: |
          Entity pair (MissedClassRequest, CompetitionEvent): creating a MissedClassRequest is
          gated on the referenced CompetitionEvent's status, and the same payload flips from
          rejected to accepted purely because the event moved SCHEDULED -> TRAVEL_APPROVED -
          no field of the request or the student changed. Both sides of the gate are exercised
          in one test.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) is OPEN; SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 50 minutes."
            - "Student S15 is ENROLLED in SOCI-150 with the default allowance: missed_class_units_allowance 9.00, charged 0.00, remaining 9.00."
            - "CompetitionEvent EV15 (REGULAR_SEASON, multiplier 1.0) travels 2026-09-14T08:00:00Z to 2026-09-15T00:00:00Z and starts in status SCHEDULED. The window covers exactly the Monday 2026-09-14 meeting, so missed_units = round(50 / 60, 2) = 0.83."
            - "The clock is 2026-09-01T00:00:00Z, which is 13 days before departure and therefore satisfies NOTIFICATION_LEAD_DAYS (7) for any later NOTIFY_INSTRUCTOR step."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 50 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Fifteen", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s15_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s15_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e15_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-15T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev15_id: $.data.id }
          trigger:
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev15_id}", enrollment_id: "${e15_id}" }
              as: AcademicAdvisor
            - call: "POST /athletics/competition-events/${ev15_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev15_id}", enrollment_id: "${e15_id}" }
              as: AcademicAdvisor
              captures: { r15_id: $.data.id }
          assert:
            - "The first trigger call is HTTP 409 with data.error_id == ERR_EVENT_NOT_TRAVEL_APPROVED while CompetitionEvent.${ev15_id}.status == SCHEDULED"
            - "After the first call, StudentAthlete.${s15_id}.missed_class_units_charged == 0.00 and GET /athletics/missed-class-requests with enrollment_id = ${e15_id} returns total_count == 0"
            - "The second trigger call is HTTP 200 with data.status == TRAVEL_APPROVED"
            - "The third trigger call, byte-identical to the first, is HTTP 201 with data.status == DRAFT, data.missed_meeting_count == 1, data.missed_units_gross == 0.83 and data.missed_units == 0.83"
            - "StudentAthlete.${s15_id}.missed_class_units_charged == 0.83 and missed_class_units_remaining == 8.17"
            - "CompetitionEvent.${ev15_id}.charged_units_total == 0.83"

      - name: appeal_decision_blocked_when_term_apr_closed
        grounds:
          - errors[ERR_APR_TERM_CLOSED]
          - validations[priority=8]
          - state_machines.EligibilityAppeal.transitions.COMMITTEE_REVIEW_to_DENIED
          - state_machines.Term.transitions.OPEN_to_CLOSED
        distinguishing_aspect: |
          Entity pair (EligibilityAppeal, Term) - a different pair from
          (MissedClassRequest, CompetitionEvent). The appeal sits in a legal from-state for
          DENY and the actor satisfies segregation of duties, yet the transition is refused
          solely because the Term two hops away (appeal -> certification -> term) reached
          apr_status CLOSED. The response must be ERR_APR_TERM_CLOSED (409), not
          ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1, is_apr_reporting_term true, end_date 2026-12-18T00:00:00Z) is the only Term row."
            - "Student S16 declared BSKINE (total_required_credits 60.00, min_progress_gpa 2.00) and completed KINE-101 (12.00 credits, CORE at catalog 2026) with grade D, so cumulative_gpa == 1.00 and progress_benchmark_evaluation yields benchmark_result FAIL with failure_reasons [GPA_BELOW_MINIMUM]."
            - "An INITIAL certification for 2026FA was requested by co_requester, SUBMITted by adv_1 and DENIED by co_decider, so the certification is DENIED and eligibility_state == INELIGIBLE."
            - "EligibilityAppeal AP16 (PROGRESS_WAIVER, requested_credit_relief 6.00) was submitted by adv_1 and moved to COMMITTEE_REVIEW while the term was still OPEN; round_number == 1."
            - "The clock is then advanced to 2026-12-18T00:00:00Z and 2026FA is APR-closed, which freezes every certification and appeal bound to it."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z", is_apr_reporting_term: true }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "BSKINE", name: "BS Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Sixteen", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s16_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s16_id}/major-declaration"
              payload: { declared_program_id: "${prog_id}", term_id: "${term1_id}" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s16_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e16_id: $.data.id }
            - call: "POST /athletics/enrollments/${e16_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "D" }
              as: Registrar
            - call: "GET /athletics/student-athletes/${s16_id}"
              payload: {}
              as: Registrar
              captures: { s16_v: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s16_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s16_v}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert16_id: $.data.id }
            - call: "POST /athletics/certifications/${cert16_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/certifications/${cert16_id}/status"
              payload: { action: "DENY" }
              as: CertificationOfficer
              as_user_id: "co_decider"
            - call: "POST /athletics/appeals"
              payload: { certification_id: "${cert16_id}", appeal_type: "PROGRESS_WAIVER", rationale: "Documented medical hardship during 2026FA", requested_credit_relief: 6.00 }
              as: AcademicAdvisor
              as_user_id: "adv_1"
              captures: { ap16_id: $.data.id }
            - call: "POST /athletics/appeals/${ap16_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/appeals/${ap16_id}/status"
              payload: { action: "OPEN_REVIEW" }
              as: AppealsCommittee
              as_user_id: "ac_2"
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-12-18T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /athletics/terms/${term1_id}/apr-close"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/appeals/${ap16_id}/status"
              payload: { action: "DENY" }
              as: AppealsCommittee
              as_user_id: "ac_2"
          assert:
            - "The trigger response is HTTP 409 with data.error_id == ERR_APR_TERM_CLOSED"
            - "data.error_id != ERR_INVALID_STATE_TRANSITION because COMMITTEE_REVIEW is a declared from-state for DENY"
            - "EligibilityAppeal.${ap16_id}.status == COMMITTEE_REVIEW, round_number == 1, decided_by_user_id is null and decided_at is null"
            - "EligibilityCertification.${cert16_id}.status == DENIED and credit_relief_applied == 0.00"
            - "StudentAthlete.${s16_id}.eligibility_state == INELIGIBLE"
            - "Term.${term1_id}.apr_status == CLOSED with apr_points_possible == 2, apr_points_earned == 1 and squad_apr == 500"

  # ---------------------------------------------------------------------------
  # Rule 8 - overlap on two different resources under two different semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: student_session_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - errors[ERR_STUDENT_SESSION_OVERLAP]
          - validations[priority=14]
          - entities.SupportSession.fields.start_at
          - entities.SupportSession.fields.end_at
        distinguishing_aspect: |
          Resource: the StudentAthlete's own calendar, under strict half-open [start_at, end_at)
          semantics - a session starting at the exact instant another ends is accepted and one
          minute of true overlap is rejected. Zero clear time is required, which is the opposite
          of the tutor rule's mandatory 20-minute gap.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) runs 2026-08-24T00:00:00Z to 2026-12-18T00:00:00Z, so every session below lies inside the term window."
            - "Student S17 was just created, so risk_tier == TIER_1 and support_status == SUPPORT_NORMAL; no tutor is involved and all three sessions are STUDY_HALL rows with tutor_assignment_id omitted."
            - "TIER_WEEKLY_HOUR_CAP applies only to tutor assignments, so study-hall duration is unconstrained here."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Seventeen", sport_code: "BASE", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s17_id: $.data.id }
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s17_id}", session_type: "STUDY_HALL", start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T16:00:00Z" }
              as: LearningSpecialist
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s17_id}", session_type: "STUDY_HALL", start_at: "2026-09-14T16:00:00Z", end_at: "2026-09-14T17:00:00Z" }
              as: LearningSpecialist
              captures: { sess2_id: $.data.id }
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s17_id}", session_type: "STUDY_HALL", start_at: "2026-09-14T16:59:00Z", end_at: "2026-09-14T18:00:00Z" }
              as: LearningSpecialist
          assert:
            - "The first trigger call is HTTP 201: a session starting exactly at the previous session's end_at is accepted, with data.hours_credited == 1.00 and data.term_index_of_record == 1"
            - "SupportSession.${sess1_id}.hours_credited == 2.00"
            - "The second trigger call is HTTP 409 with data.error_id == ERR_STUDENT_SESSION_OVERLAP because [16:59, 18:00) overlaps [16:00, 17:00) by one minute"
            - "GET /athletics/support-sessions with student_athlete_id = ${s17_id} returns total_count == 2"
            - "SupportSession is immutable (common_fields false), so no version field appears on any of these rows"

      - name: tutor_twenty_minute_buffer_rejects_ten_minute_gap
        grounds:
          - errors[ERR_TUTOR_BUFFER_VIOLATION]
          - validations[priority=14]
          - entities.SupportSession.fields.tutor_assignment_id
          - state_machines.TutorAssignment.transitions.PROPOSED_to_ACTIVE
        distinguishing_aspect: |
          Resource: the Tutor, shared across two different students' assignments - a different
          resource entity from the student calendar - and under travel-buffer semantics rather
          than half-open adjacency: TUTOR_TRAVEL_BUFFER_MINUTES (20) of clear time is required,
          so an exactly-20-minute gap passes while a 10-minute gap fails even though neither
          student's own calendar overlaps at all.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) is OPEN and SOCI-150 carries 3.00 credit hours."
            - "Students S18A and S18B were just created, so both are TIER_1 with a 2.0 weekly-hour cap, and each is ENROLLED in SOCI-150."
            - "Tutor T8 has subject_codes [\"SOCI\"], max_weekly_hours 20.00 and status TRAINED via COMPLETE_TRAINING in 2026FA."
            - "Assignments A18A (S18A, 2.00 h) and A18B (S18B, 2.00 h) are both ACTIVE, so Tutor.assigned_weekly_hours == 4.00 and both stay within TIER_WEEKLY_HOUR_CAP[TIER_1] == 2.0 per student."
            - "All sessions are TUTOR_SESSION rows logged by the tutor itself, so X-User-ID must equal the Tutor id."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1" }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Eighteen A", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s18a_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Eighteen B", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s18b_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s18a_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e18a_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s18b_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e18b_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tomas Buffer", subject_codes: ["SOCI"], max_weekly_hours: 20.00 }
              as: LearningSpecialist
              captures: { t8_id: $.data.id }
            - call: "POST /athletics/tutors/${t8_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t8_id}", enrollment_id: "${e18a_id}", weekly_hours: 2.00 }
              as: LearningSpecialist
              captures: { a18a_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a18a_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t8_id}", enrollment_id: "${e18b_id}", weekly_hours: 2.00 }
              as: LearningSpecialist
              captures: { a18b_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a18b_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s18a_id}", tutor_assignment_id: "${a18a_id}", session_type: "TUTOR_SESSION", start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z" }
              as: Tutor
              as_user_id: "${t8_id}"
          trigger:
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s18b_id}", tutor_assignment_id: "${a18b_id}", session_type: "TUTOR_SESSION", start_at: "2026-09-14T15:20:00Z", end_at: "2026-09-14T16:20:00Z" }
              as: Tutor
              as_user_id: "${t8_id}"
              captures: { sess18b_id: $.data.id }
            - call: "POST /athletics/support-sessions"
              payload: { student_athlete_id: "${s18a_id}", tutor_assignment_id: "${a18a_id}", session_type: "TUTOR_SESSION", start_at: "2026-09-14T16:30:00Z", end_at: "2026-09-14T17:00:00Z" }
              as: Tutor
              as_user_id: "${t8_id}"
          assert:
            - "The first trigger call is HTTP 201 with data.hours_credited == 1.00: the gap from 15:00:00Z to 15:20:00Z is exactly TUTOR_TRAVEL_BUFFER_MINUTES and is accepted"
            - "The second trigger call is HTTP 409 with data.error_id == ERR_TUTOR_BUFFER_VIOLATION because only 10 minutes separate 16:20:00Z from 16:30:00Z"
            - "data.error_id != ERR_STUDENT_SESSION_OVERLAP: S18A's own sessions [14:00, 15:00) and [16:30, 17:00) never overlap, so the conflict is purely the shared tutor's"
            - "TutorAssignment.${a18a_id}.logged_hours == 1.00 and TutorAssignment.${a18b_id}.logged_hours == 1.00, so the rejected session left no trace on either assignment"
            - "SupportSession.${sess18b_id}.term_index_of_record == 1"
            - "Tutor.${t8_id}.assigned_weekly_hours == 4.00 and Tutor.${t8_id}.status == TRAINED"
            - "GET /athletics/support-sessions with student_athlete_id = ${s18a_id} returns total_count == 1"

  # ---------------------------------------------------------------------------
  # Rule 9 - three different conserved quantities that must reconcile after undo
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: missed_class_unit_budget_conserved_after_cancellation
        grounds:
          - calculations.missed_class_units
          - state_machines.MissedClassRequest.transitions.DRAFT_to_CANCELLED
          - entities.StudentAthlete.fields.missed_class_units_remaining
          - entities.CompetitionEvent.fields.charged_units_total
        distinguishing_aspect: |
          Conserved quantity: the student's missed-class unit budget, with the invariant
          missed_class_units_allowance == missed_class_units_charged +
          missed_class_units_remaining. Cancelling the request must reverse the whole 6.00-unit
          charge on both the student and the parent event, leaving no drift - it is a budget of
          travel units, not tutor capacity hours and not APR points.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) is OPEN; SOCI-150 meets ISO weekdays [1, 3, 5] at minute 600 UTC for 180 minutes."
            - "Student S19 has the default allowance 9.00 with charged 0.00 and remaining 9.00."
            - "CompetitionEvent EV19 (REGULAR_SEASON, multiplier 1.0) is TRAVEL_APPROVED and travels 2026-09-14T08:00:00Z to 2026-09-17T00:00:00Z, covering the Monday 2026-09-14 and Wednesday 2026-09-16 meetings but not Friday 2026-09-18, so missed_units = 3.00 + 3.00 = 6.00."
            - "The request R19 is created and left in DRAFT, so CANCEL is legal without any instructor notification."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 180 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Nineteen", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s19_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s19_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e19_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "WBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-17T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev19_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev19_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
          trigger:
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev19_id}", enrollment_id: "${e19_id}" }
              as: AcademicAdvisor
              captures: { r19_id: $.data.id }
            - call: "POST /athletics/missed-class-requests/${r19_id}/status"
              payload: { action: "CANCEL" }
              as: AcademicAdvisor
          assert:
            - "The first trigger call is HTTP 201 with data.missed_meeting_count == 2, data.missed_units_gross == 6.00 and data.missed_units == 6.00"
            - "Immediately after the charge, StudentAthlete.${s19_id}.missed_class_units_charged == 6.00 and missed_class_units_remaining == 3.00, so 9.00 == 6.00 + 3.00 holds"
            - "CompetitionEvent.${ev19_id}.charged_units_total == 6.00 at that point"
            - "The second trigger call is HTTP 200 with data.status == CANCELLED"
            - "After the cancellation, StudentAthlete.${s19_id}.missed_class_units_charged == 0.00 and missed_class_units_remaining == 9.00, so 9.00 == 0.00 + 9.00 holds again with no residue"
            - "CompetitionEvent.${ev19_id}.charged_units_total == 0.00 and MissedClassRequest.${r19_id}.missed_units == 6.00 is retained on the cancelled row as a historical record"
            - "StudentAthlete.${s19_id}.required_study_hall_hours == 0.0 because the travel offset that 6.00 charged units produced is reversed with the charge"

      - name: tutor_capacity_hours_conserved_after_termination
        grounds:
          - entities.Tutor.fields.assigned_weekly_hours
          - state_machines.TutorAssignment.transitions.ACTIVE_to_SUSPENDED
          - state_machines.TutorAssignment.transitions.ACTIVE_to_TERMINATED
          - state_machines.TutorAssignment.transitions.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: the tutor's committed weekly capacity, with the invariant
          Tutor.assigned_weekly_hours == the sum of weekly_hours over that tutor's ACTIVE
          assignments only. Suspension, termination and reinstatement each move the running
          total by exactly the assignment's weekly_hours and the ledger reconciles at every
          step - a capacity ledger, not the student's travel budget and not APR points.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) is OPEN and SOCI-150 carries 3.00 credit hours."
            - "Students S20A, S20B and S20C were just created, so each is TIER_1 with a 2.0 weekly-hour cap, and each is ENROLLED in SOCI-150."
            - "Tutor T9 has subject_codes [\"SOCI\"], max_weekly_hours 20.00 and status TRAINED."
            - "Assignments A1 (S20A), A2 (S20B) and A3 (S20C) each carry weekly_hours 2.00 and are all ACTIVATEd, so Tutor.assigned_weekly_hours == 6.00 before the trigger."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LearningSpecialist
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1" }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Twenty A", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s20a_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Twenty B", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s20b_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Twenty C", sport_code: "SOC", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s20c_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s20a_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e20a_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s20b_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e20b_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s20c_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e20c_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tina Capacity", subject_codes: ["SOCI"], max_weekly_hours: 20.00 }
              as: LearningSpecialist
              captures: { t9_id: $.data.id }
            - call: "POST /athletics/tutors/${t9_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t9_id}", enrollment_id: "${e20a_id}", weekly_hours: 2.00 }
              as: LearningSpecialist
              captures: { a20a_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a20a_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t9_id}", enrollment_id: "${e20b_id}", weekly_hours: 2.00 }
              as: LearningSpecialist
              captures: { a20b_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a20b_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t9_id}", enrollment_id: "${e20c_id}", weekly_hours: 2.00 }
              as: LearningSpecialist
              captures: { a20c_id: $.data.id }
            - call: "POST /athletics/tutor-assignments/${a20c_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
          trigger:
            - call: "POST /athletics/tutor-assignments/${a20b_id}/status"
              payload: { action: "SUSPEND" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments/${a20c_id}/status"
              payload: { action: "TERMINATE", terminated_reason: "SPECIALIST_REQUEST" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments/${a20b_id}/status"
              payload: { action: "REINSTATE" }
              as: LearningSpecialist
          assert:
            - "Before the trigger, Tutor.${t9_id}.assigned_weekly_hours == 6.00 == 2.00 + 2.00 + 2.00 over the three ACTIVE assignments"
            - "After the SUSPEND call, TutorAssignment.${a20b_id}.status == SUSPENDED, suspension_count == 1 and Tutor.${t9_id}.assigned_weekly_hours == 4.00"
            - "After the TERMINATE call, TutorAssignment.${a20c_id}.status == TERMINATED with terminated_reason == SPECIALIST_REQUEST and Tutor.${t9_id}.assigned_weekly_hours == 2.00"
            - "After the REINSTATE call, TutorAssignment.${a20b_id}.status == ACTIVE and Tutor.${t9_id}.assigned_weekly_hours == 4.00, exactly the sum over the two ACTIVE rows"
            - "TutorAssignment.${a20a_id}.status == ACTIVE throughout and its weekly_hours == 2.00 is never double-counted"
            - "Tutor.${t9_id}.status == TRAINED and max_weekly_hours == 20.00 are unchanged by the three transitions"
            - "StudentAthlete.${s20c_id}.required_study_hall_hours == 0.0 after termination because a TIER_1 base of 0.0 hours cannot go negative"

      - name: apr_points_possible_conserved_across_revocation
        grounds:
          - calculations.apr_points_award
          - entities.StudentAthlete.fields.apr_points_forfeited
          - state_machines.EligibilityCertification.transitions.CERTIFIED_to_REVOKED
          - state_machines.Term.transitions.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: APR points, with the invariant apr_points_possible ==
          apr_points_earned + apr_points_forfeited holding exactly after every close. Revoking a
          certification mid-term must not retroactively rewrite the already-closed term's points,
          and the second close must absorb the loss as forfeited rather than shrinking possible -
          a point ledger across two closes, not a travel budget and not tutor capacity.
        test_recipe:
          setup:
            - "Terms 2026FA (term_index 1, is_apr_reporting_term true, ends 2026-12-18T00:00:00Z) and 2027SP (term_index 2, is_apr_reporting_term true, ends 2027-05-14T00:00:00Z) both exist; APR_POINTS_PER_STUDENT is 2 and APR_SCALE is 1000."
            - "Student S21 declared BSKINE (total_required_credits 60.00) and completed KINE-101 (12.00 credits, CORE at catalog 2026) with grade B, so cumulative_gpa == 3.00, completed_full_time_terms == 1 and degree_applicable_credits == 12.00; with n == 1 < PTD_GRACE_TERMS the required_progress_pct is 0.0000 and every benchmark below is PASS."
            - "S21 also holds an ENROLLED enrollment in HIST-210 (NOT_APPLICABLE at catalog 2026) for 2027SP, which makes S21 a member of both term cohorts."
            - "Certification CERT1 (INITIAL, 2026FA) is CERTIFIED before the first close, so the 2026FA close awards the eligibility point, and because 2027SP is still OPEN the PROJECTED variant awards the retention point on the ENROLLED intent."
            - "Certification CERT2 (CONTINUING, 2027SP) is CERTIFIED and then REVOKED while 2027SP is still OPEN; when 2027SP closes there is no next Term row, so the OBSERVED variant awards the retention point by default while the eligibility point is lost."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z", is_apr_reporting_term: true }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z", is_apr_reporting_term: true }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "BSKINE", name: "BS Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "HIST", course_number: "210", title: "Modern World History", credit_hours: 12.00, instructor_user_id: "instr_hist_1" }
              as: Registrar
              captures: { hist_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${hist_id}", effective_catalog_year: 2026, applicability: "NOT_APPLICABLE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Twentyone", sport_code: "TRACK", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s21_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s21_id}/major-declaration"
              payload: { declared_program_id: "${prog_id}", term_id: "${term1_id}" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s21_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e21a_id: $.data.id }
            - call: "POST /athletics/enrollments/${e21a_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s21_id}", course_id: "${hist_id}", term_id: "${term2_id}" }
              as: Registrar
              captures: { e21b_id: $.data.id }
            - call: "GET /athletics/student-athletes/${s21_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s21_v1: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s21_id}", term_id: "${term1_id}", certification_type: "INITIAL", expected_student_athlete_version: "${s21_v1}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert21a_id: $.data.id }
            - call: "POST /athletics/certifications/${cert21a_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/certifications/${cert21a_id}/status"
              payload: { action: "CERTIFY" }
              as: CertificationOfficer
              as_user_id: "co_decider"
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-12-18T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /athletics/terms/${term1_id}/apr-close"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-01-11T00:00:00Z" }
              as: CertificationOfficer
            - call: "GET /athletics/student-athletes/${s21_id}"
              payload: {}
              as: CertificationOfficer
              captures: { s21_v2: $.data.version }
            - call: "POST /athletics/certifications"
              payload: { student_athlete_id: "${s21_id}", term_id: "${term2_id}", certification_type: "CONTINUING", expected_student_athlete_version: "${s21_v2}" }
              as: CertificationOfficer
              as_user_id: "co_requester"
              captures: { cert21b_id: $.data.id }
            - call: "POST /athletics/certifications/${cert21b_id}/status"
              payload: { action: "SUBMIT" }
              as: AcademicAdvisor
              as_user_id: "adv_1"
            - call: "POST /athletics/certifications/${cert21b_id}/status"
              payload: { action: "CERTIFY" }
              as: CertificationOfficer
              as_user_id: "co_decider"
            - call: "POST /athletics/certifications/${cert21b_id}/status"
              payload: { action: "REVOKE" }
              as: CertificationOfficer
              as_user_id: "co_decider"
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-05-14T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /athletics/terms/${term2_id}/apr-close"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "The 2026FA close returns HTTP 200 with data.apr_points_possible == 2, data.apr_points_earned == 2 and data.squad_apr == 1000, because the PROJECTED variant accepts the ENROLLED 2027SP intent for the retention point"
            - "Right after that close, StudentAthlete.${s21_id}.apr_points_possible == 2, apr_points_earned == 2 and apr_points_forfeited == 0, so 2 == 2 + 0"
            - "The CONTINUING certification is created with data.benchmark_result == PASS, data.required_progress_pct == 0.0000 and data.progress_pct == 0.2000, then reaches CERTIFIED"
            - "After the REVOKE call, EligibilityCertification.${cert21b_id}.status == REVOKED and StudentAthlete.${s21_id}.eligibility_state == INELIGIBLE"
            - "The revocation does not touch the closed term: StudentAthlete.${s21_id}.apr_points_possible == 2, apr_points_earned == 2 and apr_points_forfeited == 0 still hold, and Term.${term1_id}.squad_apr == 1000 is unchanged"
            - "The 2027SP close returns HTTP 200 with data.apr_points_possible == 2, data.apr_points_earned == 1 and data.squad_apr == 500: the eligibility point is lost to the revocation while the OBSERVED retention point is awarded by default because no later Term row exists"
            - "After the second close, StudentAthlete.${s21_id}.apr_points_possible == 4, apr_points_earned == 3 and apr_points_forfeited == 1, so 4 == 3 + 1 - the loss is absorbed as forfeited and apr_points_possible never shrinks"
            - "EligibilityCertification.${cert21a_id}.status == CERTIFIED is untouched by either close"
