scaffold_corner_design:
  - section: entities
    instances:
      - name: contractor_creation_returns_201_with_computed_tier_and_active_status
        claim_type: creation
        grounds:
          - entities.Contractor
          - endpoints[POST /contractors]
          - calculations.effective_client_threshold_resolution
        distinguishing_aspect: "A minimal POST /contractors body returns 201 with every declared field materialized: status ACTIVE, base_hazard_tier 1 for an all-GENERAL profile, the four zero-valued computed counters, verified_coverage_types [] and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object and meta.api_request_id present"
            - "data.legal_name == Acme Mechanical, data.scope_of_work == [\"MECHANICAL_TRADE\"], data.hazard_profile == [\"GENERAL\"], data.employee_count == 40"
            - "data.status == ACTIVE and data.base_hazard_tier == 1 (no HIGH_HAZARD_CLASSES member in the profile)"
            - "data.incident_review_flag == false, data.open_severe_incident_count == 0, data.open_deficiency_count == 0, data.verified_coverage_types == []"
            - "data.version == 1 and data.id is a bare UUID with no type prefix"

      - name: get_site_by_id_returns_the_stored_row_with_defaults
        claim_type: retrieval
        grounds:
          - entities.Site
          - endpoints[GET /sites/{id}]
        distinguishing_aspect: "The single-resource read returns exactly what creation stored, including the min_grade default C and the two computed posture fields, with no recomputation drift."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; one Site PLANT-7 created with required_hazard_classes [GENERAL] and min_grade omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sites"
              payload: { site_code: "PLANT-7", required_hazard_classes: ["GENERAL"] }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}"
              payload: {}
              as: NetworkAdmin
          assert:
            - "HTTP 200 with data.id == ${site_id} and data.client_id == ${client_id}"
            - "data.site_code == PLANT-7, data.required_hazard_classes == [\"GENERAL\"], data.min_grade == C"
            - "data.granted_worker_count == 0 and data.access_gate_status == OPEN"
            - "data.version == 1"

      - name: prequalification_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /prequalifications]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three DRAFT rows for one client are paged with limit 2: the first page reports total_count 3 and has_more true, the second page returns the remaining row with has_more false, and the client_id filter is applied before the window rather than after."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind and a second Client Southgate, both on defaults."
            - "Three contractors each hold one DRAFT 2026 prequalification with Northwind; a fourth contractor holds one DRAFT 2026 prequalification with Southgate, which must never appear in the filtered pages."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Southgate Industrial", industry_code: "2362" }
              as: NetworkAdmin
              captures: { other_client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${c1_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${c1_v}" }
              as: ContractorAdmin
              as_user_id: "${c1_id}"
              captures: { pq1_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Bolt Rigging", scope_of_work: ["SCAFFOLDING"], hazard_profile: ["GENERAL"], employee_count: 12 }
              as: NetworkAdmin
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${c2_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${c2_v}" }
              as: ContractorAdmin
              as_user_id: "${c2_id}"
              captures: { pq2_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Cable Crew", scope_of_work: ["ELECTRICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 8 }
              as: NetworkAdmin
              captures: { c3_id: $.data.id, c3_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${c3_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${c3_v}" }
              as: ContractorAdmin
              as_user_id: "${c3_id}"
              captures: { pq3_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Deep Foundations", scope_of_work: ["EARTHWORK"], hazard_profile: ["GENERAL"], employee_count: 20 }
              as: NetworkAdmin
              captures: { c4_id: $.data.id, c4_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${c4_id}", client_id: "${other_client_id}", cycle_year: 2026, expected_contractor_version: "${c4_v}" }
              as: ContractorAdmin
              as_user_id: "${c4_id}"
              captures: { pq4_id: $.data.id }
          trigger:
            - call: "GET /prequalifications?client_id=${client_id}&limit=2&offset=0"
              payload: {}
              as: NetworkAdmin
            - call: "GET /prequalifications?client_id=${client_id}&limit=2&offset=2"
              payload: {}
              as: NetworkAdmin
          assert:
            - "first page: HTTP 200, response_type array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row, total_count == 3, has_more == false, offset == 2"
            - "the union of the two pages is exactly {${pq1_id}, ${pq2_id}, ${pq3_id}} and never contains ${pq4_id}"
            - "every returned row has status DRAFT, statistics_verification_status NOT_SUBMITTED and audit_state NOT_SELECTED"

      - name: get_contractor_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors.ERR_CONTRACTOR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown UUID on a single-resource read returns the entity-specific 404 (ERR_CONTRACTOR_NOT_FOUND), not the generic ERR_RECORD_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one unrelated contractor exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id }
          trigger:
            - call: "GET /contractors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_CONTRACTOR_NOT_FOUND"
            - "GET /contractors/${con_id} still returns 200, so the store is intact"

      - name: create_contractor_missing_required_hazard_profile_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - endpoints[POST /contractors]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "hazard_profile has source input and no default, so omitting it is a 400 body-schema failure at priority 3 - it must not fall through to a 422 field-constraint error or default to [GENERAL]."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty contractor registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], employee_count: 40 }
              as: NetworkAdmin
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST (not ERR_INVALID_FIELD_VALUE)"
            - "GET /contractors/{id} is impossible - no contractor row was created"

      - name: client_creation_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Client
          - endpoints[POST /clients]
        distinguishing_aspect: "Fourteen optional Client fields must materialize their declared defaults in one response - the four thresholds, the four weights summing to exactly 1.00, BALANCED policy, band 20, interval 12 months, sample rate 25, cascade depth 2 and required_coverage_types [GL, WC]."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty client registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
          assert:
            - "HTTP 201 with data.grading_policy == BALANCED"
            - "data.max_trir == 3.0, data.max_dart_rate == 1.5, data.max_emr == 1.0, data.max_citation_points == 6"
            - "data.weight_trir == 0.4, data.weight_dart == 0.25, data.weight_emr == 0.25, data.weight_citation == 0.1 (sum exactly 1.00)"
            - "data.conditional_band_pct == 20, data.requalification_interval_months == 12, data.audit_sample_rate_pct == 25, data.cascade_depth_limit == 2"
            - "data.required_coverage_types == [\"GL\", \"WC\"]"

      - name: create_contractor_supplying_computed_base_hazard_tier_returns_invalid_request
        claim_type: computed_fields
        grounds:
          - validations[priority=3]
          - entities.Contractor.fields.base_hazard_tier
          - endpoints[POST /contractors]
        distinguishing_aspect: "base_hazard_tier is source computed and unknown body fields are rejected at priority 3, so a client cannot pin the tier; the follow-up positive call proves the server derives tier 2 from a HEIGHTS profile on its own."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty contractor registry; HIGH_HAZARD_CLASSES includes HEIGHTS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /contractors"
              payload: { legal_name: "Summit Steel Erectors", scope_of_work: ["GENERAL_BUILDING"], hazard_profile: ["GENERAL", "HEIGHTS"], employee_count: 120, base_hazard_tier: 1 }
              as: NetworkAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Summit Steel Erectors", scope_of_work: ["GENERAL_BUILDING"], hazard_profile: ["GENERAL", "HEIGHTS"], employee_count: 120 }
              as: NetworkAdmin
              captures: { con_id: $.data.id }
          assert:
            - "first call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST (unknown field rejected)"
            - "second call: HTTP 201 with data.base_hazard_tier == 2, derived from the HEIGHTS member of hazard_profile"
            - "GET /contractors/${con_id} confirms base_hazard_tier == 2 and version == 1"

      - name: create_prequalification_supplying_status_returns_invalid_request
        claim_type: system_fields
        grounds:
          - validations[priority=3]
          - entities.Prequalification.fields.status
          - state_machines.Prequalification.null_to_DRAFT
        distinguishing_aspect: "status, statistics_verification_status, document_review_status and audit_state are all source system: the body may not carry them, and the accepted create seeds all four from the null_to_DRAFT transition rather than from input."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
          trigger:
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}", status: "APPROVED" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
          assert:
            - "first call: HTTP 400 with data.error_id == ERR_INVALID_REQUEST and no row created"
            - "second call: HTTP 201 with data.status == DRAFT, data.statistics_verification_status == NOT_SUBMITTED, data.document_review_status == NOT_STARTED, data.audit_state == NOT_SELECTED"
            - "second call: data.provisional_composite_score, final_composite_score, grade, effective_thresholds, graded_at, expires_at and conditional_expires_at are all null and deficiency_codes == []"
            - "Contractor.${con_id}.version == 2 after the accepted create (the transition increments it)"

      - name: written_program_with_out_of_enum_program_type_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.WrittenProgram.fields.program_type
          - errors.ERR_INVALID_FIELD_VALUE
        distinguishing_aspect: "Enum membership and the revision_date <= logical clock constraint are both priority-4 checks returning 422, distinct from the priority-3 body-schema 400: the field is present and correctly typed but carries a value outside the declared enum, and a second call shows a future revision_date failing the same rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme with a DRAFT 2026 prequalification."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "SAFETY_CULTURE", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-X-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-09-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          assert:
            - "out-of-enum program_type: HTTP 422 with data.error_id == ERR_INVALID_FIELD_VALUE"
            - "future revision_date 2026-09-01 against a 2026-08-01 clock: HTTP 422 with data.error_id == ERR_INVALID_FIELD_VALUE"
            - "GET /prequalifications/${pq_id}/written-programs returns 0 rows"
            - "Prequalification.${pq_id}.document_review_status is still NOT_STARTED"

      - name: worker_qualification_rows_carry_no_version_and_have_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.WorkerQualification
          - entities.Worker
          - endpoints[GET /workers/{id}/qualifications]
        distinguishing_aspect: "Worker and WorkerQualification are declared common_fields false: their rows expose only id and created_at, carry no version or updated_at, and §1.5 declares no PATCH or DELETE for either - the append-only history is what makes qualification expiry a pure clock comparison."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Contractor Acme with worker Dana Ruiz holding one OSHA10 record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id }
            - call: "POST /contractors/${con_id}/workers"
              payload: { full_name: "Dana Ruiz", employee_ref: "EMP-1001", trade_code: "MECHANICAL_TRADE" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { worker_id: $.data.id }
          trigger:
            - call: "POST /workers/${worker_id}/qualifications"
              payload: { qualification_code: "OSHA10", issued_date: "2026-01-15T00:00:00Z", expiration_date: "2029-01-15T00:00:00Z", training_provider: "SafeStart Institute", evidence_ref: "CERT-OSHA10-1001" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { qual_id: $.data.id }
            - call: "GET /workers/${worker_id}/qualifications"
              payload: {}
              as: NetworkAdmin
          assert:
            - "HTTP 201 on create; data.id and data.created_at are present while data.version and data.updated_at are absent"
            - "GET /workers/${worker_id} likewise returns id and created_at with no version or updated_at"
            - "GET /workers/${worker_id}/qualifications returns exactly 1 row with qualification_code OSHA10 and expiration_date 2029-01-15T00:00:00Z"
            - "a second POST /workers/${worker_id}/qualifications with qualification_code OSHA30 appends a second row (2 rows total) rather than replacing the first"

      - name: create_site_under_unknown_client_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - entities.Site.fields.client_id
          - errors.ERR_CLIENT_NOT_FOUND
        distinguishing_aspect: "Site is the only entity with a nested creation path, so the parent id is validated as a PATH segment at priority 5 (ERR_CLIENT_NOT_FOUND) rather than as a body FK at priority 6 - and it is validated before the priority-7 ownership check, which the same unknown id would also fail."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one real Client Northwind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/00000000-0000-4000-8000-000000000000/sites"
              payload: { site_code: "PLANT-7", required_hazard_classes: ["GENERAL"] }
              as: ClientSafetyManager
              as_user_id: "00000000-0000-4000-8000-000000000000"
          assert:
            - "HTTP 404 with data.error_id == ERR_CLIENT_NOT_FOUND (priority 5 precedes the priority-7 ownership check)"
            - "GET /clients/${client_id}/sites returns 0 rows"

      - name: subcontractor_link_junction_and_cycle_constraint_under_graph_topology
        claim_type: graph_topology
        grounds:
          - entities.SubcontractorLink
          - validations[priority=23]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cyclic_subcontractor_edge_beats_lapsed_flow_down_coverage_on_the_child
          rationale: "The graph-topology corner (many-to-many junction rows plus cycle rejection over the self-referential contractor graph) is asserted as the failure path of that §1.8 instance, whose setup also builds and reads back a valid depth-1 junction row."

  - section: state_machines
    instances:
      - name: written_program_review_accept_moves_row_to_accepted
        claim_type: valid_transition
        grounds:
          - state_machines.WrittenProgram.SUBMITTED_to_ACCEPTED
          - calculations.required_program_set
          - endpoints[POST /written-programs/{id}/review]
        distinguishing_aspect: "The accept transition writes review_status ACCEPTED, reviewed_by_user_id and the optional reviewer_note, and re-derives Prequalification.document_review_status - which must stay NOT_STARTED because the row is still DRAFT, not jump to IN_PROGRESS or COMPLETE with one of two required programs accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme (hazard_profile [GENERAL], so the required set is {HAZCOM, DISCIPLINE_POLICY})."
            - "A DRAFT 2026 prequalification carrying one SUBMITTED HAZCOM program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_id: $.data.id }
          trigger:
            - call: "POST /written-programs/${wp_id}/review"
              payload: { decision: "ACCEPT", reviewer_note: "Matches the client HazCom appendix" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
          assert:
            - "HTTP 200 with data.review_status == ACCEPTED"
            - "data.reviewed_by_user_id == ${client_id} and data.reviewer_note == Matches the client HazCom appendix"
            - "data.is_required == true (HAZCOM is in PROGRAM_REQUIREMENT_MAP[GENERAL])"
