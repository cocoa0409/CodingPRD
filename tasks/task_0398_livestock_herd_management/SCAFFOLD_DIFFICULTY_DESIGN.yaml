            - "data.error_id == ERR_PASTURE_OVER_CAPACITY"
            - "Pasture.${pen15}.current_au_load == 1.0"

      - name: pasture_grazing_rest_gap_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_REST_PERIOD_VIOLATION]
          - entities.Pasture.fields.rest_days
          - state_machines.MovementRecord.PLANNED_to_APPLIED
        distinguishing_aspect: "Adjacency-buffer interval semantics on a PASTURE: rest_days=10 forces a minimum gap between one occupancy's effective_to and the next effective_from; a re-entry at 2026-05-10 (9 days after the prior end 2026-05-01) is rejected — geometric treatment is a gap/buffer between adjacent intervals, not aggregate capacity."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Herd, PASTURE rest_days 10 capacity 50, one animal. Apply occupancy [2026-04-01,2026-05-01); move animal away to a PEN; then plan re-entry into the pasture at 2026-05-10 (only 9 days after the 2026-05-01 end)."
