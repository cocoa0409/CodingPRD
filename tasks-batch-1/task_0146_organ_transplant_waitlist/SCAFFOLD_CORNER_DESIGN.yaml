              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /candidates/${cand_id}/list"
              payload: {}
              as: TransplantCenter
              as_user_id: "${c5_id}"
            - call: "POST /donor-organs"
              payload: { opo_id: "${opo_id}", organ_type: "LIVER", blood_type: "O", donor_height_cm: 180, donor_weight_kg: 85, hla_a: ["A1","A2"], hla_b: ["B7","B8"], hla_dr: ["DR1","DR2"], recovered_at: "2026-06-01T00:00:00Z", max_cold_ischemia_hours: 10 }
