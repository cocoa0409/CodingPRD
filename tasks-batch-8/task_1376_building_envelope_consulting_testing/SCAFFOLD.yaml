    code: 200
    input: []
    output: MockUp
    side_effects: []
  - method: POST
    path: "/engagements/{id}/mock-ups/{mockUpId}/begin-construction"
    description: "PLANNED -> CONSTRUCTING"
    roles: [Consultant]
    code: 200
    input: []
    output: MockUp
    side_effects: ["status -> CONSTRUCTING"]
  - method: POST
    path: "/engagements/{id}/mock-ups/{mockUpId}/declare-ready"
    description: "CONSTRUCTING -> READY_FOR_TEST"
    roles: [Consultant]
    code: 200
    input: []
    output: MockUp
    side_effects: ["status -> READY_FOR_TEST"]
  - method: POST
    path: "/engagements/{id}/mock-ups/{mockUpId}/begin-testing"
    description: "READY_FOR_TEST|REMEDIATED -> TESTING; consumes the bound chamber slot; clock must be inside slot window. From REMEDIATED, payload new_chamber_slot_id is required and re-points the mock-up to a fresh RESERVED slot (the prior slot stays CONSUMED)."
    roles: [Consultant]
    code: 200
    input: ["new_chamber_slot_id?"]
    output: MockUp
    side_effects: ["status -> TESTING", "ChamberSlot -> CONSUMED", "from REMEDIATED: attempt_number += 1 and chamber_slot_id re-pointed to new_chamber_slot_id"]
