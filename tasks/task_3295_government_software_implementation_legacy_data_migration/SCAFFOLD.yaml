  input:
  - agency_id
  - solicitation_number
  - vendor_name
  - contract_value_cents
  output: ProcurementContract
  side_effects:
  - append AuditLogEntry
- method: GET
  path: /programs/contracts/{id}
  description: Get contract
  roles:
  - ProcurementOfficer
  - ImplementationManager
  - AgencyProjectManager
  - VendorProjectManager
  - FinanceOfficer
  - BusinessAnalyst
  - DataMigrationLead
  - InterfaceEngineer
  - SupportManager
  - PlatformAdmin
  code: 200
  input: []
  output: ProcurementContract
  side_effects: []
- method: POST
  path: /programs/contracts/{id}/transition
  description: 'Advance procurement lifecycle. target=POSTED (from DRAFT), Q&A_OPEN (from POSTED), Q&A_CLOSED, EVALUATION, AWARD_PENDING. Cyclic: target=PROTESTED from EVALUATION (note required), target=EVALUATION
    from PROTESTED (note required).'
  roles:
  - ProcurementOfficer
  code: 200
  input:
  - target
  - note?
  output: ProcurementContract
  side_effects:
  - increments ProcurementContract.version by 1
  - append AuditLogEntry (on protest resolution and award-path transitions)
- method: POST
  path: /programs/contracts/{id}/award
  description: AWARD_PENDING -> AWARDED (OCC-guarded)
  roles:
  - ProcurementOfficer
  code: 200
  input:
  - expected_contract_version
  output: ProcurementContract
  side_effects:
  - sets awarded_at
  - increments ProcurementContract.version by 1
  - append AuditLogEntry
- method: POST
  path: /programs/contracts/{id}/start-implementation
  description: AWARDED -> IMPLEMENTATION; activates phase 1
  roles:
  - ImplementationManager
  code: 200
  input: []
  output: ProcurementContract
  side_effects:
  - phase sequence_no==1 PLANNED -> ACTIVE
  - increments ProcurementContract.version by 1
- method: POST
  path: /programs/contracts/{id}/close
  description: IMPLEMENTATION -> CLOSED
  roles:
  - ImplementationManager
  code: 200
  input: []
  output: ProcurementContract
  side_effects:
  - increments ProcurementContract.version by 1
  - append AuditLogEntry
- method: POST
  path: /programs/contracts/{id}/cancel
  description: ANY non-terminal -> CANCELLED; cascades to phases/milestones
  roles:
  - ProcurementOfficer
  code: 200
  input:
  - cancel_reason
  output: ProcurementContract
  side_effects:
  - cascade cancel phases and milestones
  - increments ProcurementContract.version by 1
- method: POST
  path: /programs/contracts/{id}/phases
  description: Add implementation phase (sequence_no contiguous from 1)
  roles:
  - ImplementationManager
  code: 201
  input:
  - sequence_no
  - name
  - planned_start_on
  - planned_end_on
  output: ContractPhase
  side_effects: []
- method: GET
  path: /programs/contracts/{id}/phases
  description: List phases
  roles:
  - ImplementationManager
  - AgencyProjectManager
  - VendorProjectManager
  - PlatformAdmin
  code: 200
  input:
  - limit?
  - offset?
  output: ContractPhase[]
  side_effects: []
- method: POST
  path: /programs/phases/{id}/milestones
  description: List milestones of phase; contract_id? filter also supported (denormalized FK reverse lookup)
  roles:
  - ImplementationManager
