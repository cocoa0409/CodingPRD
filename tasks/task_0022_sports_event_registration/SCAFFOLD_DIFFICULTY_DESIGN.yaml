scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ranking_provisional_vs_final_on_ranking_entry
        grounds:
          - calculations.ranking_calculation
          - calculations.ranking_calculation.variants.provisional
          - calculations.ranking_calculation.variants.final
          - state_machines.Match.RESULT_PENDING_to_LOCKED
          - state_machines.Event.IN_PROGRESS_to_COMPLETED
          - entities.RankingEntry.fields.provisional_rank
          - entities.RankingEntry.fields.final_rank
          - state_machines.Dispute.OPEN_to_UPHELD
        distinguishing_aspect: |
          Provisional rank reacts to every Match LOCK and to score CORRECTIONs from
          upheld disputes, but final_rank is FROZEN at Event COMPLETED — a later
          dispute correction shifts provisional_rank yet leaves final_rank unchanged
          for the same RankingEntry row, producing different values for the same
          entity from identical inputs depending on variant.
        test_recipe:
          setup:
            - "Create Event(event_type=ROUND_ROBIN, prize_pool_cents=10000, tax_withholding_pct=0)."
            - "Register 4 Participants P1..P4 (distinct teams, distinct countries, distinct world_rankings 1,2,3,4)."
            - "Open registration, advance clock past registration_closes_at, /draw, /start."
            - "Schedule full round-robin (6 matches), assign HEAD+ASSISTANT referees, lock all 6 matches with scores producing rank order P1>P2>P3>P4."
            - "Complete event (snapshots final_rank)."
            - "File a Dispute on the P1-vs-P2 match, /resolve uphold=true with reversed scores."
          trigger:
            - "GET /events/{id}/rankings"
          assert:
            - "RankingEntry[P1].final_rank == 1 AND RankingEntry[P1].provisional_rank == 2 (provisional reflects correction; final does not)."
            - "RankingEntry[P2].final_rank == 2 AND RankingEntry[P2].provisional_rank == 1."
            - "AuditLog kind=RESULT_CHANGE row exists with subject_id == P1-vs-P2 match id."

      - name: prize_gross_first_vs_post_sanction_recompute_on_prize_payment
        grounds:
          - calculations.prize_calculation
          - calculations.prize_calculation.variants.gross_first
          - calculations.prize_calculation.variants.post_sanction_recompute
          - state_machines.SanctionRecord.ISSUED
          - state_machines.PrizePayment.SCHEDULED_to_FORFEITED
          - state_machines.PrizePayment.FORFEITED_to_SCHEDULED
          - entities.PrizePayment.fields.tax_withheld_cents
          - entities.PrizePayment.fields.net_amount_cents
        distinguishing_aspect: |
          gross_first computes gross fresh, then taxes; post_sanction_recompute
          freezes gross and tax at COMPLETED time and only adjusts forfeit. After a
          REVOKE cascade the same PrizePayment row carries net = gross - frozen_tax,
          which differs from re-running gross_first on the surviving pool because
          residual-cent reallocation to rank-1 would produce different cents under
          the latter — distinct entity domain (PrizePayment) from Rule-1 instance 1
          (RankingEntry).
        test_recipe:
          setup:
            - "Create Event with prize_pool_cents=10003, tax_withholding_pct=10, settlement_currency=USD, event_type=SINGLE_ELIM."
            - "Register 8 Participants A..H, draw, start, lock all 7 matches; A wins."
            - "Complete event so PrizePayment rows exist."
            - "Open DopingSample for B, /custody DISPATCH, /custody RECEIVE (officer 1), /result positive=true (officer 2)."
            - "Cascade flips PrizePayment[B] to FORFEITED."
            - "File Appeal on the resulting SanctionRecord, /appeals/{id}/decide uphold=true (REVOKE)."
          trigger:
            - "GET /events/{id}/prize-payments"
          assert:
            - "PrizePayment[A].gross_amount_cents == 5002 (50% of 10003 round_half_up; rank-1 residual reallocation adds 0 here since per-rank sum equals 10003)."
            - "PrizePayment[A].tax_withheld_cents == 500 (round_half_up(5002*10/100) = 500)."
            - "PrizePayment[A].net_amount_cents == 4502."
            - "PrizePayment[B].status == SCHEDULED AND forfeit_amount_cents == 0 AND tax_withheld_cents == 250 (frozen since COMPLETED) AND net_amount_cents == 2251 (gross 2501 - tax 250 - 0)."

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tie_break_six_key_lexicographic_sort
        grounds:
          - calculations.tie_break_sequence
          - calculations.ranking_calculation
          - entities.RankingEntry.fields.points
          - entities.RankingEntry.fields.goal_difference
          - entities.RankingEntry.fields.away_goals
          - entities.RankingEntry.fields.sets_won
        distinguishing_aspect: |
          Mode (a): a non-linear formula with ≥3 inputs and conditional branching —
          the sort consults six keys IN STRICT ORDER, key 3 is computed only when
          comparing two specific tied peers (pairwise head-to-head), key 5 is null
          for non-SETS_MATCH event_type, and the result depends on which earlier key
          first breaks the tie. This is non-linear interaction across 6 inputs.
        test_recipe:
          setup:
            - "Create Event(event_type=ROUND_ROBIN). Register P1..P4."
            - "Lock matches so P1, P2 finish with identical points=6 AND identical goal_difference=+2; head-to-head P1-vs-P2 ended 2-1 (P1 won, so head_to_head_points(P1,P2)=3, head_to_head_points(P2,P1)=0)."
          trigger:
            - "GET /events/{id}/rankings"
          assert:
            - "RankingEntry[P1].provisional_rank == 1 AND RankingEntry[P2].provisional_rank == 2 (key 3 head-to-head broke the tie even though keys 1 and 2 were equal)."

      - name: prize_per_rank_round_then_tax_round
        grounds:
          - calculations.prize_calculation
          - entities.PrizePayment.fields.gross_amount_cents
          - entities.PrizePayment.fields.tax_withheld_cents
          - entities.PrizePayment.fields.net_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins per-rank
          gross rounding HALF-UP first, then per-row tax rounding HALF-UP. With
          prize_pool=10000 and tax=11.5%, rounding tax first vs. rounding gross
          first produces different cents (5000*0.115=575 exact here; with pool=99
          and tax=11%, 49.5→50 then tax 50*0.11=5.5→6 vs. 49.5*0.11=5.445→5: the
          two orders diverge by 1 cent on net). This sits on a different mode from
          instance 1 (lexicographic sort).
        test_recipe:
          setup:
            - "Create Event(prize_pool_cents=99, tax_withholding_pct=11, event_type=SINGLE_ELIM, settlement_currency=USD)."
            - "Register 8 Participants, draw, start, lock all 7 matches; A wins, B is rank 2, C and D rank 3, E..H ranks 5..8."
            - "Complete event."
          trigger:
            - "GET /events/{id}/prize-payments"
          assert:
            - "PrizePayment[A].gross_amount_cents == 50 (round_half_up(99*0.50)=50)."
            - "PrizePayment[A].tax_withheld_cents == 6 (round_half_up(50*11/100) = round_half_up(5.5) = 6)."
            - "PrizePayment[A].net_amount_cents == 44 (50 - 6 - 0)."

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: match_dispute_revision_cycle
        grounds:
          - state_machines.Match
          - state_machines.Match.RESULT_PENDING_to_LOCKED
          - state_machines.Match.RESULT_PENDING_to_DISPUTED
          - state_machines.Match.DISPUTED_to_LOCKED
          - state_machines.Dispute
        distinguishing_aspect: |
          Match has a cyclic shape: SCHEDULED -> RESULT_PENDING -> LOCKED ->
          DISPUTED -> LOCKED. Re-entering LOCKED via correction is a true cycle on
          one entity (Match), not a linear pipeline. The two LOCKED-arrival paths
          have divergent side-effect sets (first arrival: ranking calc; second:
          ranking calc + AuditLog RESULT_CHANGE + winner flip cascade).
        test_recipe:
          setup:
            - "Create Event with 2 participants, draw, start, schedule round-1 match."
            - "Two referees submit matching results; Match LOCKED."
            - "File Dispute (Match -> DISPUTED), then resolve uphold=true with corrected scores."
          trigger:
            - "GET /events/{id}/matches"
          assert:
            - "Match.status == LOCKED (back to LOCKED via the cycle, not stuck in DISPUTED)."
            - "AuditLog row exists where kind == RESULT_CHANGE AND subject_id == match.id."
            - "Match.locked_home_score equals the corrected home score (different from initial REFEREE_SUBMISSION pair)."

      - name: sanction_appeal_branching_revoke_or_final
        grounds:
          - state_machines.SanctionRecord
          - state_machines.SanctionRecord.ISSUED_to_APPEALED
          - state_machines.SanctionRecord.APPEALED_to_REVOKED
          - state_machines.SanctionRecord.APPEALED_to_FINAL
          - state_machines.SanctionRecord.ISSUED_to_FINAL
          - state_machines.Appeal
        distinguishing_aspect: |
          SanctionRecord has branching (fork-join) shape: from ISSUED there are TWO
          divergent paths to terminal — the auto-FINAL path (no Appeal, 14 days
          elapse) and the APPEALED branch which itself forks to REVOKED or FINAL
          with different side effects (REVOKED unfreezes prizes & reinstates
          participant; FINAL emits SANCTION_ARCHIVED sync event). The two terminal
          paths from APPEALED have divergent side-effect sets, which is not linear.
          Different entity (SanctionRecord) from Rule-3 instance 1 (Match).
        test_recipe:
          setup:
            - "Run an event to COMPLETED, with one positive doping result for participant B that creates a SanctionRecord."
            - "Branch A: Participant B files an Appeal; AppealsBoard /decide uphold=true."
            - "Branch B (separate event/run): no Appeal filed; advance clock 14d; SanctionRecord auto -> FINAL."
          trigger:
            - "GET /sanctions/{branch_a_sanction_id}"
            - "GET /sanctions/{branch_b_sanction_id}"
          assert:
            - "Branch A: SanctionRecord.status == REVOKED AND PrizePayment[B].status == SCHEDULED AND Participant[B].status != DISQUALIFIED."
            - "Branch B: SanctionRecord.status == FINAL AND a SyncEvent with target_system=GOVERNING_BODY AND kind=SANCTION_ARCHIVED exists."

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: positive_doping_cascade_depth_4
        grounds:
          - state_machines.DopingSample.RECEIVED_to_POSITIVE
          - state_machines.SanctionRecord
          - state_machines.Participant.ACTIVE_to_DISQUALIFIED
          - state_machines.PrizePayment.SCHEDULED_to_FORFEITED
          - calculations.event_posture
          - entities.AuditLog
        distinguishing_aspect: |
          Originating trigger: POST /doping-samples/{id}/result with positive=true.
          Hop 1: DopingSample RECEIVED -> POSITIVE.
          Hop 2: that mutation itself creates SanctionRecord(ISSUED).
          Hop 3: SanctionRecord(ISSUED) creation itself triggers Participant ACTIVE
          -> DISQUALIFIED.
          Hop 4: Participant DISQUALIFIED itself triggers PrizePayment SCHEDULED ->
          FORFEITED.
          Each link is caused by the previous link, not directly by the original
          POST — depth ≥ 4. event_posture also recomputes as a separate side-effect
          read.
        test_recipe:
          setup:
            - "Run event to COMPLETED with PrizePayment for participant B (rank 2)."
            - "Open DopingSample for B; /custody DISPATCH (officer 1); /custody RECEIVE (officer 1)."
          trigger:
            - "POST /doping-samples/{sample_id}/result with positive=true (officer 2 to satisfy segregation)"
          assert:
            - "DopingSample.status == POSITIVE."
            - "SanctionRecord exists with sample_id == sample.id AND status == ISSUED."
            - "Participant[B].status == DISQUALIFIED."
            - "PrizePayment[B].status == FORFEITED AND forfeit_amount_cents == PrizePayment[B].gross_amount_cents."

      - name: event_cancel_cascade_depth_2
        grounds:
          - state_machines.Event.OPEN_to_CANCELLED
          - state_machines.Participant.REGISTERED_to_WITHDRAWN
          - entities.SyncEvent
        distinguishing_aspect: |
          Originating trigger: POST /events/{id}/cancel from OPEN.
          Hop 1: Event OPEN -> CANCELLED.
          Hop 2: that cancellation itself flips every Participant in {REGISTERED,
          SEEDED, ACTIVE} to WITHDRAWN, and each WITHDRAWN flip itself emits a
          SyncEvent(ENTRY_FEE_CHARGED, refund). Depth = 2 (per Rule 4 ≥ 2). Distinct
          triggering transition from Rule-4 instance 1 (sample positive vs. event
          cancel).
        test_recipe:
          setup:
            - "Create Event, /open, register 3 participants."
          trigger:
            - "POST /events/{event_id}/cancel"
          assert:
            - "Event.status == CANCELLED."
            - "All three Participant rows have status == WITHDRAWN."
            - "Three SyncEvent rows with target_system == PAYMENT and kind == ENTRY_FEE_CHARGED exist (one per participant)."

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_register
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors.ERR_INVALID_STATE
          - errors.ERR_REGISTRATION_CLOSED
        distinguishing_aspect: |
          Two failures stack on POST /events/{id}/participants — Event.status is
          DRAFT (state failure, priority 5) AND now() is past
          registration_closes_at (business_temporal failure, priority 13). The
          state-category check fires first; ERR_INVALID_STATE wins over
          ERR_REGISTRATION_CLOSED. Pair: state ↔ business_temporal.
        test_recipe:
          setup:
            - "Create Event with registration_opens_at = T0, registration_closes_at = T0+1h, starts_at = T0+2h."
            - "Do NOT /open the event (status stays DRAFT)."
            - "Advance clock to T0 + 2h (past registration_closes_at)."
          trigger:
            - "POST /events/{event_id}/participants with valid body"
          assert:
            - "HTTP 409, response.data.error_id == 'ERR_INVALID_STATE' (NOT ERR_REGISTRATION_CLOSED)."

      - name: business_safety_vs_business_referential_on_referee_assign
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors.ERR_CONFLICT_OF_INTEREST
          - errors.ERR_REFEREE_TIME_CONFLICT
        distinguishing_aspect: |
          Two failures stack on POST /matches/{id}/referee-assignments — referee
          shares country_code with a participant (business_safety, priority 9) AND
          referee already has an overlapping assignment elsewhere
          (business_referential, priority 11). The safety check fires first;
          ERR_CONFLICT_OF_INTEREST wins over ERR_REFEREE_TIME_CONFLICT. Pair:
          business_safety ↔ business_referential — DIFFERENT pair from instance 1.
        test_recipe:
          setup:
            - "Create Event(country_code='ES'). Register P1(country='ES') and P2(country='FR')."
            - "Create Referee R1(country_code='ES', team_affiliation=null, qualifications=[event_type], grade=A)."
            - "Draw, start. Round-1 Match M1 has scheduled_start_at=T1, scheduled_end_at=T1+1h."
            - "Pre-assign R1 to a different match M2 in same event with [T1, T1+1h] interval (this would cause overlap on R1)."
          trigger:
            - "POST /matches/{M1}/referee-assignments with referee_id=R1, role=HEAD"
          assert:
            - "HTTP 422, response.data.error_id == 'ERR_CONFLICT_OF_INTEREST' (R1 shares country with P1; the time-conflict check would also fail but priority-9 wins over priority-11)."

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: registration_close_inclusive_lower_exclusive_upper
        grounds:
          - validations[priority=13]
          - errors.ERR_REGISTRATION_CLOSED
          - entities.Event.fields.registration_opens_at
          - entities.Event.fields.registration_closes_at
        distinguishing_aspect: |
          Numeric/temporal threshold check on registration window: inclusive lower
          (>=) and exclusive upper (<). Boundary metric = clock instant on
          /events/{id}/participants endpoint.
        test_recipe:
          setup:
            - "Create Event(registration_opens_at=T0, registration_closes_at=T0+1h), /open."
            - "Advance clock to exactly T0+1h."
          trigger:
            - "POST /events/{event_id}/participants"
          assert:
            - "HTTP 409, response.data.error_id == 'ERR_REGISTRATION_CLOSED' (the upper bound is exclusive: at exactly T0+1h registration is closed)."

      - name: empty_referee_assignment_set_blocks_event_start
        grounds:
          - state_machines.Event.DRAWN_to_IN_PROGRESS
          - entities.RefereeAssignment
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Empty-set boundary: a Match with zero ASSIGNED HEAD RefereeAssignments
          rows blocks Event /start. Different metric (count of relations on a
          different entity) and different endpoint (/events/{id}/start) from
          Rule-6 instance 1 (clock window on /participants).
        test_recipe:
          setup:
            - "Create Event with 4 participants, /draw."
            - "Do NOT assign any referees to round-1 matches."
            - "Advance clock past starts_at."
          trigger:
            - "POST /events/{event_id}/start"
          assert:
            - "HTTP 409, response.data.error_id == 'ERR_INVALID_STATE' (precondition fails because ≥1 HEAD ASSIGNED count on round-1 matches is zero)."

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: match_lock_blocked_by_open_dispute
        grounds:
          - state_machines.Match.RESULT_PENDING_to_LOCKED
          - state_machines.Dispute
          - validations[priority=5]
        distinguishing_aspect: |
          Match's RESULT_PENDING -> LOCKED transition requires "no OPEN Dispute" —
          Match's valid next-state set depends on Dispute.status. Pair: Match ↔
          Dispute.
        test_recipe:
          setup:
            - "Run event to a round-1 match in status RESULT_PENDING with one ResultEntry submitted."
            - "Participant files /matches/{id}/disputes (Dispute status=OPEN)."
          trigger:
            - "POST /matches/{match_id}/results with a second matching entry (would normally lock)"
          assert:
            - "HTTP 409, response.data.error_id == 'ERR_INVALID_STATE'. Match.status remains RESULT_PENDING (or DISPUTED) — the Dispute being OPEN blocks the lock."

      - name: prize_payment_pay_blocked_by_event_posture_frozen
        grounds:
          - state_machines.PrizePayment.SCHEDULED_to_PAID
          - calculations.event_posture
          - state_machines.SanctionRecord.ISSUED_to_APPEALED
          - validations[priority=6]
        distinguishing_aspect: |
          PrizePayment's SCHEDULED -> PAID transition requires Event.posture ==
          CLEAN — the payment entity's valid next-state depends on a derived
          aggregate over SanctionRecord/Appeal on the Event. Pair: PrizePayment ↔
          Event (via SanctionRecord/Appeal). Different pair from instance 1
          (Match ↔ Dispute).
        test_recipe:
          setup:
            - "Run event to COMPLETED with PrizePayment[A] SCHEDULED; participant B has an APPEALED SanctionRecord (Event.posture=FROZEN)."
            - "scheduled_pay_at is starts_at + 7d."
          trigger:
            - "POST /_clock/advance to (starts_at + 7d + 1s)"
          assert:
            - "PrizePayment[A].status remains SCHEDULED (not PAID) — the FROZEN posture blocks even after scheduled_pay_at."
            - "After /appeals/{id}/decide uphold=false (FINAL) the posture recomputes to CLEAN/UNDER_REVIEW; running /_sweep/run then flips PrizePayment[A] to PAID."

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: referee_half_open_overlap_no_buffer
        grounds:
          - validations[priority=11]
          - errors.ERR_REFEREE_TIME_CONFLICT
          - entities.RefereeAssignment
        distinguishing_aspect: |
          Resource: Referee. Interval semantics: half-open [start, end); ADJACENT
          intervals (one ends at the same instant the next begins) are PERMITTED
          without buffer. Overlap check rejects only when intervals strictly
          intersect.
        test_recipe:
          setup:
            - "Create Event with two matches M1=[T0, T0+1h] and M2=[T0+1h, T0+2h] (adjacent)."
            - "Create Referee R1 (qualified, no COI)."
            - "Assign R1 to M1 as HEAD (succeeds)."
          trigger:
            - "POST /matches/{M2}/referee-assignments with referee_id=R1, role=HEAD"
          assert:
            - "HTTP 201; M2 assignment succeeds (adjacent half-open intervals do not overlap)."
            - "Now create M3 = [T0+30min, T0+90min]. POST /matches/{M3}/referee-assignments with R1 → HTTP 409, error_id='ERR_REFEREE_TIME_CONFLICT' (true overlap)."

      - name: participant_overlap_with_30_min_buffer
        grounds:
          - validations[priority=12]
          - errors.ERR_PARTICIPANT_TIME_CONFLICT
          - entities.Match.fields.scheduled_start_at
          - entities.Match.fields.scheduled_end_at
        distinguishing_aspect: |
          Resource: Participant (different from Referee). Interval semantics:
          ADJACENT intervals require a 30-MINUTE GAP — adjacency that the referee
          rule allows is forbidden here. Different geometric treatment of
          adjacency, different resource entity.
        test_recipe:
          setup:
            - "Create Event with 4 participants. /draw produces a bracket; /start."
            - "Schedule M_a [T0, T0+1h] with P1 vs P2 (locked)."
            - "Try to schedule next-round M_b [T0+1h, T0+2h] containing P1 (winner)."
          trigger:
            - "Manual scheduling endpoint that places M_b adjacent to M_a"
          assert:
            - "HTTP 409, response.data.error_id == 'ERR_PARTICIPANT_TIME_CONFLICT' (gap < 30min)."
            - "Re-schedule M_b at [T0+1h+30min, T0+2h+30min] → HTTP 201 (gap == 30min satisfies inclusive lower bound)."

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: prize_pool_conservation_under_sanction_revoke
        grounds:
          - calculations.prize_calculation
          - state_machines.PrizePayment.SCHEDULED_to_FORFEITED
          - state_machines.PrizePayment.FORFEITED_to_SCHEDULED
          - state_machines.SanctionRecord.APPEALED_to_REVOKED
          - entities.PrizePayment.fields.gross_amount_cents
          - entities.PrizePayment.fields.forfeit_amount_cents
          - entities.PrizePayment.fields.net_amount_cents
          - entities.PrizePayment.fields.tax_withheld_cents
        distinguishing_aspect: |
          Conserved quantity: per-row gross_amount_cents AND per-row tax_withheld_cents
          for the affected PrizePayment, AND aggregate
          sum(gross_amount_cents) over all PrizePayment rows for the event. The
          forward action (Sanction ISSUED -> PrizePayment FORFEITED) and its
          compensating action (Sanction APPEALED -> REVOKED -> PrizePayment
          SCHEDULED) MUST leave gross_amount_cents and tax_withheld_cents on every
          row exactly equal to their values immediately after Event COMPLETED.
          Invariant formula: ∀p ∈ PrizePayment[event]: p.gross_amount_cents ==
          gross_at_complete[p] AND p.tax_withheld_cents == tax_at_complete[p].
        test_recipe:
          setup:
            - "Run event to COMPLETED; snapshot gross_amount_cents and tax_withheld_cents for every PrizePayment row (call these G[p] and T[p])."
            - "Open DopingSample for participant B; /custody DISPATCH; /custody RECEIVE; /result positive=true."
            - "Now PrizePayment[B].status==FORFEITED and forfeit_amount_cents == G[B]."
          trigger:
            - "POST /appeals; POST /appeals/{id}/decide uphold=true"
          assert:
            - "For every participant p in the event, PrizePayment[p].gross_amount_cents == G[p] (unchanged from COMPLETED snapshot)."
            - "For every p, PrizePayment[p].tax_withheld_cents == T[p] (unchanged)."
            - "PrizePayment[B].forfeit_amount_cents == 0; PrizePayment[B].net_amount_cents == G[B] - T[B] - 0."

      - name: registered_count_conservation_under_withdraw_then_reopen
        grounds:
          - state_machines.Participant.REGISTERED_to_WITHDRAWN
          - entities.Event.fields.registered_count
          - state_machines.Event.OPEN_to_CANCELLED
          - state_machines.Participant.SEEDED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: Event.registered_count must always equal count of
          Participant rows in {REGISTERED, SEEDED, ACTIVE}. The forward action
          (POST /participants registers and increments) and its compensating action
          (POST /participants/{id}/withdraw) MUST keep the invariant
          Event.registered_count == |{p : p.event_id==e.id AND p.status IN
          {REGISTERED, SEEDED, ACTIVE}}|. Different conserved quantity (a
          population count) from instance 1 (a monetary cents amount) and a
          different invariant formula.
        test_recipe:
          setup:
            - "Create Event(capacity_min=2, capacity_max=8), /open."
            - "Register 4 participants P1..P4 (registered_count == 4)."
          trigger:
            - "POST /participants/P2/withdraw; POST /participants/P3/withdraw"
