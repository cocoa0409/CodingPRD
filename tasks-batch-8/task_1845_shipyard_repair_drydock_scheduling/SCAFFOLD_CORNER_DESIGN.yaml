          assert:
            - "captured rate_at_award == 500000 (price exactly 50000000 selects tier 2, not tier 1's 200000)"
            - "captured ld == 1000000 ((5 - 3) chargeable days x 500000; cap 5000000 not binding)"
      - name: critical_path_longest_chain_value
        claim_type: correct_result
        grounds: [calculations.calc_critical_path_days, entities.RepairProject.fields.critical_path_days, entities.RepairProject.fields.forecast_delivery_utc]
        distinguishing_aspect: "Topological longest path over the dependency DAG: chains A->B->D = 5+3+2 = 10 beat A->C = 5+4 = 9, so critical_path_days is 10 and forecast delivery is dock-in + 10 days."
