          setup:
            - "One COMMISSARY / CONUS store."
            - "One ACTIVE_DUTY patron suspended by ADMIN_ACTION."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Polk Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SPC W Adeyemi", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /patrons/${patron_id}/card-status"
              payload: { action: "SUSPEND", reason: "ADMIN_ACTION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_PATRON_CARD_NOT_VALID"
            - "Patron.${patron_id}.card_status == SUSPENDED and suspension_reason == ADMIN_ACTION"
            - "GET /sales with patron_id == ${patron_id} returns total_count == 0"

      - name: corner_dependent_with_suspended_sponsor_blocked_at_sale_open
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_31_ERR_SPONSOR_CARD_NOT_VALID
          - entities.Patron.fields.sponsor_patron_id
          - errors.ERR_SPONSOR_CARD_NOT_VALID
        distinguishing_aspect: |
          The dependent is enrolled AFTER the sponsor was suspended, so the
          SPONSOR_SUSPENDED cascade never reached it and its own card reads VALID:
          the 403 is therefore ERR_SPONSOR_CARD_NOT_VALID at priority 31, proving
          the sponsor's state is consulted separately from the shopper's own.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store."
            - "One ACTIVE_DUTY sponsor, suspended by ADMIN_ACTION FIRST."
            - "One DEPENDENT patron enrolled afterwards against that sponsor, so its own card_status is VALID."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Meade Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SSG X Ravensworth", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons/${sponsor_id}/card-status"
              payload: { action: "SUSPEND", reason: "ADMIN_ACTION" }
              as: ComplianceOfficer
            - call: "POST /patrons"
              payload: { full_name: "Y Ravensworth", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_id}" }
              as: ComplianceOfficer
              captures: { dependent_id: $.data.id }
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${dependent_id}" }
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_SPONSOR_CARD_NOT_VALID, NOT ERR_PATRON_CARD_NOT_VALID"
            - "Patron.${dependent_id}.card_status == VALID and suspension_reason == null"
            - "Patron.${sponsor_id}.card_status == SUSPENDED"
            - "GET /sales with patron_id == ${dependent_id} returns total_count == 0"

      - name: corner_role_denial_outranks_path_existence_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_4_ERR_SALE_NOT_FOUND
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          A StoreCashier voiding a sale id that does not exist gets 403
          ERR_ROLE_NOT_PERMITTED, not 404: authorisation at priority 2 runs before
          path existence at priority 4, so the API never leaks whether the id is
          real to a caller who may not use the endpoint.
        test_recipe:
          setup:
            - "No fixture is required beyond a store and a genuine sale that the cashier is NOT addressing, to show the endpoint exists."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Hood Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SGT Z Ferraro", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { real_sale_id: $.data.id }
          trigger:
            - call: "POST /sales/00000000-0000-4000-8000-000000000999/void"
              payload: { voided_reason: "CASHIER_ERROR" }
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_ROLE_NOT_PERMITTED, NOT ERR_SALE_NOT_FOUND with 404"
            - "Sale.${real_sale_id}.tender_state == OPEN — nothing else was disturbed"

      - name: corner_quantity_limit_exceeded_in_aggregate_across_lines
        claim_type: aggregate_validation
        grounds:
          - validations.priority_34_ERR_QUANTITY_LIMIT_EXCEEDED
          - validations.priority_38_ERR_ITEM_NOT_IN_ASSORTMENT
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / quantity_limit_safety_outranks_assortment_referential_check
          rationale: "The aggregate breach across lines is triggered there, alongside a simultaneous assortment miss, to pin the 34-before-38 ordering."

      - name: corner_project_close_outlay_above_obligation_returns_error
        claim_type: priority_conflict
        grounds:
          - validations.priority_46_ERR_OUTLAY_EXCEEDS_OBLIGATION
          - validations.priority_22_ERR_PROJECT_NOT_APPROVED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / project_state_check_outranks_outlay_ceiling_on_close
          rationale: "Both the ceiling breach and the state violation are raised together in the named §1.8 instance, which asserts the priority-22 error wins."

      - name: corner_overlapping_delegation_windows_for_same_pair_return_overlap
        claim_type: temporal_validation
        grounds:
          - validations.priority_37_ERR_DELEGATION_WINDOW_OVERLAP
          - entities.ShopperDelegation.fields.valid_to
        excluded_because:
          difficulty_instance: resource_temporal_overlap / same_pair_delegation_windows_half_open_adjacent_allowed_overlap_rejected
          rationale: "The adjacent-accepted / one-second-overlap-rejected pair for the same sponsor-delegate pair is exactly the named §1.8 instance."

      - name: corner_shelf_capacity_exceeded_by_overlapping_windows
        claim_type: aggregate_validation
        grounds:
          - validations.priority_41_ERR_SHELF_CAPACITY_EXCEEDED
          - entities.Store.fields.shelf_block_capacity_facings
        excluded_because:
          difficulty_instance: resource_temporal_overlap / closed_window_assortments_touching_at_endpoint_exceed_shelf_capacity
          rationale: "The collective-facings breach at a shared closed-window endpoint is the subject of the named §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_close_period_on_quiet_store_still_advances_the_index
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/stores/{id}/close-period
          - entities.Store.fields.period_close_index
          - entities.Store.fields.fund_posture
        distinguishing_aspect: |
          All six close-period steps are no-ops on a store with no delegations, no
          pending orders, no programs and no projects, yet the call still returns 200
          with period_close_index 1 and a bumped version — the counter is
          unconditional, not contingent on work being found.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with nothing else attached to it."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Wainwright Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
          trigger:
            - call: "POST /stores/${store_id}/close-period"
              payload: {}
              as: SurchargeFundController
          assert:
            - "HTTP status == 200"
            - "Store.${store_id}.period_close_index == 1"
            - "Store.${store_id}.version == ${store_v0} + 1"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0, dividend_fund_balance_cents == 0, surcharge_obligated_cents == 0"
            - "Store.${store_id}.fund_posture == FROZEN"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0"

      - name: corner_fund_ledger_filtered_by_entry_type_returns_subset
        claim_type: computed_read
        grounds:
          - endpoints.GET_/stores/{id}/fund-ledger
          - entities.FundLedgerEntry.fields.entry_type
          - entities.FundLedgerEntry.fields.fund
        distinguishing_aspect: |
          One tender writes two ledger rows into two different funds; filtering by
          entry_type ALLOWANCE_CREDIT returns exactly the DIVIDEND row with its own
          running balance, proving the filter narrows within a store rather than
          across stores and that balance_after_cents is per (store, fund).
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store, surcharge_rate_bp 500, exchange_markup_bp 0."
            - "One DSD assortment from vendor Northline Beverage with promo_allowance_bp 2000 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
            - "One TENDERED sale of 5 units at unit_cost_cents 1000: surcharge 250 into SURCHARGE, allowance 1000 into DIVIDEND."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Bragg Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-LED-1000", name: "Energy Drink 24pk", category: "GENERAL_MERCHANDISE", unit_cost_cents: 1000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AC1", facings: 6, supply_mode: "DSD", vendor_name: "Northline Beverage", promo_allowance_bp: 2000, promo_window_start: "2026-08-01T00:00:00Z", promo_window_end: "2026-09-01T00:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT A Lindqvist", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 5 }
              as: StoreCashier
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
          trigger:
            - call: "GET /stores/${store_id}/fund-ledger?entry_type=ALLOWANCE_CREDIT"
              payload: {}
              as: SurchargeFundController
          assert:
            - "HTTP status == 200 and total_count == 1"
            - "the single row has entry_type == ALLOWANCE_CREDIT, fund == DIVIDEND, amount_cents == 1000, balance_after_cents == 1000"
            - "that row has source_ref_kind == SALE, source_ref_id == ${sale_id}, period_close_index == 0"
            - "GET /stores/${store_id}/fund-ledger with no filter returns total_count == 2"
            - "GET /stores/${store_id}/fund-ledger with fund == SURCHARGE returns total_count == 1 with amount_cents == 250 and balance_after_cents == 250"

      - name: corner_store_mwr_programs_ordered_by_priority_rank_then_created_at
        claim_type: computed_read
        grounds:
          - endpoints.GET_/stores/{id}/mwr-programs
          - entities.MwrProgram.fields.priority_rank
          - calculations.dividend_waterfall_distribution
        distinguishing_aspect: |
          Three programs where two share priority_rank 2 come back rank ASC then
          created_at ASC — never insertion order and never id order — so the listing
          exposes exactly the sequence the dividend waterfall will follow.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store."
            - "Program EARLY_TIE at rank 2 created first, program TOP at rank 1 created second, program LATE_TIE at rank 2 created third."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Lewis Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /mwr-programs"
              payload: { store_id: "${store_id}", name: "Youth Sports", priority_rank: 2, funding_ceiling_cents: 100000 }
              as: MwrBoardOfficer
              captures: { early_tie_id: $.data.id }
            - call: "POST /mwr-programs"
              payload: { store_id: "${store_id}", name: "Family Readiness", priority_rank: 1, funding_ceiling_cents: 100000 }
              as: MwrBoardOfficer
              captures: { top_id: $.data.id }
            - call: "POST /mwr-programs"
              payload: { store_id: "${store_id}", name: "Outdoor Recreation", priority_rank: 2, funding_ceiling_cents: 100000 }
              as: MwrBoardOfficer
              captures: { late_tie_id: $.data.id }
          trigger:
            - call: "GET /stores/${store_id}/mwr-programs"
              payload: {}
              as: MwrBoardOfficer
          assert:
            - "HTTP status == 200 and total_count == 3"
            - "the ordering is exactly [${top_id}, ${early_tie_id}, ${late_tie_id}]"
            - "every returned row has ytd_funded_cents == 0 and status == ACTIVE"
            - "GET /stores/${store_id}/mwr-programs with status == SUSPENDED returns total_count == 0"

      - name: corner_deployed_site_special_order_is_accepted_with_no_money_committed
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/special-orders
          - validations.priority_33_ERR_PATRON_NOT_ELIGIBLE_IN_REGION
          - entities.SpecialOrder.fields.shipping_allowance_cents
        distinguishing_aspect: |
          DEPLOYED is the narrowest region, and an ACTIVE_DUTY patron is one of the
          three classes admitted there: placement succeeds with state SUBMITTED,
          route null and billable_weight_kg, gross_ship_cents, patron_share_cents and
          shipping_allowance_cents all still 0 — the 340-cent-per-kg deployed rate is
          not committed until the order is routed.
        test_recipe:
          setup:
            - "One EXCHANGE / DEPLOYED store."
            - "One assorted product at unit_cost_cents 4500 weighing 900 grams."
            - "One ACTIVE_DUTY patron with a VALID card."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Camp Arifjan Exchange", channel: "EXCHANGE", region: "DEPLOYED", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-DEP-4500", name: "Field Boots", category: "GENERAL_MERCHANDISE", unit_cost_cents: 4500, unit_weight_grams: 900 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AD1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SSG B Cardoza", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
          trigger:
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { order_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "SpecialOrder.${order_id}.state == SUBMITTED and route == null and cancelled_reason == null"
            - "SpecialOrder.${order_id}.billable_weight_kg == 0, gross_ship_cents == 0, patron_share_cents == 0, shipping_allowance_cents == 0"
            - "Store.${store_id}.shipping_allowance_committed_cents == 0"

      - name: corner_patron_can_cancel_own_special_order_through_kiosk
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/special-orders/{id}/cancel
          - rbac.Patron
          - state_machines.SpecialOrder.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          The Patron role is entity-backed: acting with X-User-ID equal to the
          order's patron_id, a patron cancels their own SUBMITTED order and the row
          reaches CANCELLED with cancelled_reason PATRON_REQUEST, so the kiosk path
          is a first-class actor rather than a cashier-only operation.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store, one assorted product and one ACTIVE_DUTY patron."
            - "One SUBMITTED special order placed for that patron by the cashier."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Eisenhower Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-KSK-2500", name: "Bluetooth Speaker", category: "GENERAL_MERCHANDISE", unit_cost_cents: 2500, unit_weight_grams: 700 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AE1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SPC C Mwangi", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${order_id}/cancel"
              payload: { cancelled_reason: "PATRON_REQUEST" }
              as: Patron
              as_user_id: "${patron_id}"
          assert:
            - "HTTP status == 200"
            - "SpecialOrder.${order_id}.state == CANCELLED and cancelled_reason == PATRON_REQUEST"
            - "SpecialOrder.${order_id}.shipping_allowance_cents == 0"
            - "Store.${store_id}.shipping_allowance_committed_cents == 0"

  # ===========================================================================
  - section: errors
    instances:
      - name: corner_missing_auth_headers_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
          - response_envelope
        distinguishing_aspect: |
          With X-User-Role and X-User-ID both omitted the request is refused at
          priority 1 with a well-formed error envelope carrying error_id and
          message, before any listing work happens — so a caller cannot enumerate
          stores anonymously.
        test_recipe:
          setup:
            - "One store exists, so a successful authenticated listing would return a non-empty page."
            - "The trigger sends NO X-User-Role and NO X-User-ID header at all."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Irwin Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
          trigger:
            - call: "GET /stores"
              payload: {}
              as: unauthenticated
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "HTTP status == 401 and ${error_id} == ERR_UNAUTHENTICATED"
            - "${message} is a non-empty string"
            - "the response envelope carries no data rows for the store list"
            - "Store.${store_id} is still readable by SurchargeFundController with name 'Fort Irwin Commissary'"

      - name: corner_patron_reading_another_patrons_sale_returns_scope_violation
        claim_type: error_triggerable
        grounds:
          - validations.priority_3_ERR_PATRON_SCOPE_VIOLATION
          - errors.ERR_PATRON_SCOPE_VIOLATION
          - rbac.Patron
        distinguishing_aspect: |
          The Patron role passes the role check at priority 2 for GET /sales/{id} and
          is then stopped at priority 3 because X-User-ID does not match
          Sale.patron_id — self-service scope is narrower than role permission.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and two ACTIVE_DUTY patrons, SELF and OTHER."
            - "One OPEN sale belonging to OTHER."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Riley Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SGT D Ivanenko", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { self_patron_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SGT E Barbosa", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { other_patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${other_patron_id}" }
              as: StoreCashier
              captures: { other_sale_id: $.data.id }
          trigger:
            - call: "GET /sales/${other_sale_id}"
              payload: {}
              as: Patron
              as_user_id: "${self_patron_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_PATRON_SCOPE_VIOLATION"
            - "the same GET as Patron with X-User-ID == ${other_patron_id} returns 200"
            - "Sale.${other_sale_id}.patron_id == ${other_patron_id} and tender_state == OPEN"

      - name: corner_second_void_returns_sale_already_voided
        claim_type: error_triggerable
        grounds:
          - validations.priority_21_ERR_SALE_ALREADY_VOIDED
          - errors.ERR_SALE_ALREADY_VOIDED
          - state_machines.Sale.OPEN_to_VOIDED
        distinguishing_aspect: |
          VOIDED is terminal and reports its own error rather than the generic
          not-open one: the second void of the same sale returns 409
          ERR_SALE_ALREADY_VOIDED and voided_reason keeps the FIRST reason.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and one ACTIVE_DUTY patron."
            - "One OPEN sale already voided once with reason CASHIER_ERROR."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Benning Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "PFC F Nowakowski", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/void"
              payload: { voided_reason: "CASHIER_ERROR" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: { voided_reason: "PATRON_DISPUTE" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${error_id} == ERR_SALE_ALREADY_VOIDED"
            - "Sale.${sale_id}.tender_state == VOIDED and voided_reason == CASHIER_ERROR"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0 — voiding a never-tendered sale writes no reversal"

      - name: corner_retire_of_retired_assortment_returns_assortment_not_active
        claim_type: error_triggerable
        grounds:
          - validations.priority_24_ERR_ASSORTMENT_NOT_ACTIVE
          - errors.ERR_ASSORTMENT_NOT_ACTIVE
          - state_machines.Assortment.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          Retirement is not idempotent: a second retire of the same allocation
          returns 409 ERR_ASSORTMENT_NOT_ACTIVE and, crucially, does NOT bump
          Store.version a second time, so the refused call has no side effect on the
          shelf-capacity aggregate.
        test_recipe:
          setup:
            - "One EXCHANGE / OVERSEAS store and one assorted product."
            - "One assortment already RETIRED; Store.version read fresh AFTER that retirement."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ramstein Exchange", channel: "EXCHANGE", region: "OVERSEAS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-RTR-1500", name: "Travel Mug", category: "GENERAL_MERCHANDISE", unit_cost_cents: 1500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AF1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_id: $.data.id }
            - call: "POST /assortments/${assortment_id}/retire"
              payload: { reason: "VENDOR_DISCONTINUED" }
              as: AssortmentPlanner
            - call: "GET /stores/${store_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { store_v_after_retire: $.data.version }
          trigger:
            - call: "POST /assortments/${assortment_id}/retire"
              payload: { reason: "PLANOGRAM_RESET" }
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${error_id} == ERR_ASSORTMENT_NOT_ACTIVE"
            - "Assortment.${assortment_id}.status == RETIRED"
            - "Store.${store_id}.version == ${store_v_after_retire} — the refused retire bumped nothing"

      - name: corner_route_of_already_routed_order_returns_not_routable
        claim_type: error_triggerable
        grounds:
          - validations.priority_25_ERR_SPECIAL_ORDER_NOT_ROUTABLE
          - errors.ERR_SPECIAL_ORDER_NOT_ROUTABLE
          - state_machines.SpecialOrder.SUBMITTED_to_LOCAL_FILL_PENDING
        distinguishing_aspect: |
          Routing is a one-shot fork: an order already in LOCAL_FILL_PENDING is
          refused with ERR_SPECIAL_ORDER_NOT_ROUTABLE — distinct from the terminal
          code — and keeps its LOCAL_FILL route, so a re-route cannot silently
          rewrite the branch.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store, one assorted product weighing 700 grams, one ACTIVE_DUTY patron."
            - "One special order already routed LOCAL_FILL, hence in LOCAL_FILL_PENDING."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Campbell Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-RRT-2000", name: "Duffel Bag", category: "GENERAL_MERCHANDISE", unit_cost_cents: 2000, unit_weight_grams: 700 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AG1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT G Yamashiro", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
              captures: { order_id: $.data.id }
            - call: "POST /special-orders/${order_id}/route"
              payload: { route: "LOCAL_FILL" }
              as: StoreCashier
          trigger:
            - call: "POST /special-orders/${order_id}/route"
              payload: { route: "LOCAL_FILL" }
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${error_id} == ERR_SPECIAL_ORDER_NOT_ROUTABLE, NOT ERR_SPECIAL_ORDER_TERMINAL"
            - "SpecialOrder.${order_id}.state == LOCAL_FILL_PENDING and route == LOCAL_FILL"
            - "SpecialOrder.${order_id}.shipping_allowance_cents == 0 and Store.${store_id}.shipping_allowance_committed_cents == 0"

      - name: corner_unknown_ids_return_entity_specific_not_found_codes
        claim_type: error_triggerable
        grounds:
          - validations.priority_4_path_existence
          - errors.ERR_STORE_NOT_FOUND
          - errors.ERR_PATRON_NOT_FOUND
          - errors.ERR_ASSORTMENT_NOT_FOUND
          - errors.ERR_DELEGATION_NOT_FOUND
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_MWR_PROGRAM_NOT_FOUND
        distinguishing_aspect: |
          Path existence resolves to a DIFFERENT error_id per addressed entity
          rather than one shared 404 code: six unknown-id reads by roles that ARE
          permitted on each endpoint return six distinct codes, all at 404.
        test_recipe:
          setup:
            - "One store and one patron exist, so each endpoint has at least one real row to contrast against."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Detrick Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SPC H Petrosyan", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: SurchargeFundController
              captures: { err_store: $.data.error_id }
            - call: "GET /patrons/00000000-0000-4000-8000-000000000102"
              payload: {}
              as: ComplianceOfficer
              captures: { err_patron: $.data.error_id }
            - call: "GET /assortments/00000000-0000-4000-8000-000000000103"
              payload: {}
              as: AssortmentPlanner
              captures: { err_assortment: $.data.error_id }
            - call: "GET /shopper-delegations/00000000-0000-4000-8000-000000000104"
              payload: {}
              as: ComplianceOfficer
              captures: { err_delegation: $.data.error_id }
            - call: "GET /capital-projects/00000000-0000-4000-8000-000000000105"
              payload: {}
              as: SurchargeFundController
              captures: { err_project: $.data.error_id }
            - call: "GET /mwr-programs/00000000-0000-4000-8000-000000000106"
              payload: {}
              as: MwrBoardOfficer
              captures: { err_program: $.data.error_id }
          assert:
            - "every one of the six calls returns HTTP status == 404"
            - "${err_store} == ERR_STORE_NOT_FOUND and ${err_patron} == ERR_PATRON_NOT_FOUND"
            - "${err_assortment} == ERR_ASSORTMENT_NOT_FOUND and ${err_delegation} == ERR_DELEGATION_NOT_FOUND"
            - "${err_project} == ERR_PROJECT_NOT_FOUND and ${err_program} == ERR_MWR_PROGRAM_NOT_FOUND"
            - "GET /stores/${store_id} and GET /patrons/${patron_id} both still return 200"

  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_cashier_cannot_void_sale
        claim_type: peer_roles
        grounds:
          - rbac.StoreCashier
          - rbac.ComplianceOfficer.exclusive_operations
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The cashier who opened and owns the sale still cannot void it: voiding is
          the ComplianceOfficer's exclusive power, so the same sale id that the
          cashier may read and tender is refused with 403 on the void path.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, one ACTIVE_DUTY patron and one OPEN sale opened by the cashier."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Novosel Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SGT I Kovalenko", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: { voided_reason: "CASHIER_ERROR" }
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_ROLE_NOT_PERMITTED"
            - "Sale.${sale_id}.tender_state == OPEN and voided_reason == null"
            - "GET /sales/${sale_id} as StoreCashier returns 200 — the cashier may read what it may not void"

      - name: corner_fund_controller_cannot_decide_capital_project
        claim_type: approval_chain
        grounds:
          - rbac.SurchargeFundController
          - rbac.MwrBoardOfficer.exclusive_operations
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The controller owns drafting, submission and closeout but is barred from the
          board's decision step: the very officer who submitted the project cannot
          approve it, and the project stays SUBMITTED with decided_by_user_id null.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and one SUBMITTED capital project submitted by sfc-701."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Rucker Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Bakery oven refit", requested_amount_cents: 250000 }
              as: SurchargeFundController
              as_user_id: "sfc-701"
              captures: { project_id: $.data.id }
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-701"
          trigger:
            - call: "POST /capital-projects/${project_id}/decision"
              payload: { decision: "APPROVE" }
              as: SurchargeFundController
              as_user_id: "sfc-701"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_ROLE_NOT_PERMITTED"
            - "CapitalProject.${project_id}.state == SUBMITTED and decided_by_user_id == null"
            - "CapitalProject.${project_id}.submitted_by_user_id == sfc-701"
            - "Store.${store_id}.surcharge_obligated_cents == 0"

      - name: corner_board_officer_cannot_submit_capital_project
        claim_type: approval_chain
        grounds:
          - rbac.MwrBoardOfficer
          - rbac.SurchargeFundController.exclusive_operations
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The chain is not hierarchical: the deciding role cannot reach back to the
          earlier submit step, so a DRAFT project addressed by a board officer stays
          DRAFT with submitted_by_user_id null.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and one DRAFT capital project created by sfc-702."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Cavazos Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Parking lot resurfacing", requested_amount_cents: 250000 }
              as: SurchargeFundController
              as_user_id: "sfc-702"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: MwrBoardOfficer
              as_user_id: "mwr-702"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_ROLE_NOT_PERMITTED"
            - "CapitalProject.${project_id}.state == DRAFT and submitted_by_user_id == null and revision_count == 0"
            - "GET /capital-projects/${project_id} as MwrBoardOfficer returns 200 — reading is shared, submitting is not"

      - name: corner_compliance_officer_cannot_create_products
        claim_type: peer_roles
        grounds:
          - rbac.ComplianceOfficer
          - rbac.AssortmentPlanner.exclusive_operations
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          Two peer authorities with disjoint write surfaces: the compliance officer,
          who may suspend cards and void sales, cannot add an item to the worldwide
          item file, and the refusal happens before any uniqueness check on the sku.
        test_recipe:
          setup:
            - "One product already on file, created by the planner, so the sku namespace is non-empty."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SKU-PEER-100", name: "Paper Towels 12pk", category: "GROCERY_STAPLE", unit_cost_cents: 1200 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-PEER-101", name: "Contraband Watchlist Item", category: "TOBACCO", unit_cost_cents: 900 }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_ROLE_NOT_PERMITTED"
            - "GET /products with category == TOBACCO as AssortmentPlanner returns total_count == 0"
            - "Product.${product_id}.sku == SKU-PEER-100"

      - name: corner_patron_role_cannot_list_all_patrons
        claim_type: peer_roles
        grounds:
          - rbac.Patron.shared_operations
          - endpoints.GET_/patrons
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The kiosk identity may read its OWN patron record but the collection
          endpoint is not in its shared_operations at all, so the roster is refused
          at priority 2 rather than filtered down to one row.
        test_recipe:
          setup:
            - "Two enrolled ACTIVE_DUTY patrons, so an unfiltered roster would return two rows."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "SGT J Abernathy", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { self_patron_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SPC K Vasconcelos", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { other_patron_id: $.data.id }
          trigger:
            - call: "GET /patrons"
              payload: {}
              as: Patron
              as_user_id: "${self_patron_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_ROLE_NOT_PERMITTED — not a 200 with one row"
            - "GET /patrons/${self_patron_id} as Patron with X-User-ID == ${self_patron_id} returns 200"
            - "GET /patrons as ComplianceOfficer returns total_count == 2 including ${other_patron_id}"

      - name: corner_shared_reads_work_for_both_fund_and_board_roles
        claim_type: peer_roles
        grounds:
          - rbac.SurchargeFundController.shared_operations
          - rbac.MwrBoardOfficer.shared_operations
          - endpoints.GET_/capital-projects/{id}
        distinguishing_aspect: |
          Segregation of duties partitions WRITES only: both the fund controller and
          the board officer read the same project and the same fund ledger with
          identical payloads, so the shared surface really is shared.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and one DRAFT capital project of 250000 (obligation 275000)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Leavenworth Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Deli case replacement", requested_amount_cents: 250000 }
              as: SurchargeFundController
              as_user_id: "sfc-703"
              captures: { project_id: $.data.id }
          trigger:
            - call: "GET /capital-projects/${project_id}"
              payload: {}
              as: MwrBoardOfficer
              as_user_id: "mwr-703"
            - call: "GET /stores/${store_id}/fund-ledger"
              payload: {}
              as: MwrBoardOfficer
              as_user_id: "mwr-703"
          assert:
            - "both calls return HTTP status == 200"
            - "CapitalProject.${project_id}.state == DRAFT, contingency_bp == 1000, contingency_cents == 25000, obligation_cents == 275000"
            - "the fund-ledger read returns total_count == 0"
            - "the identical two reads as SurchargeFundController return the same values"

      - name: corner_close_project_by_submitting_user_returns_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_49_ERR_SEGREGATION_OF_DUTIES
          - state_machines.CapitalProject.APPROVED_to_CLOSED
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          The role is right and the state is right, yet the identity is wrong: the
          SurchargeFundController user sfc-050 who submitted the project cannot close
          it, so the 403 is decided from the opaque X-User-ID against
          submitted_by_user_id and no CAPITAL_OUTLAY row is written.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with surcharge_rate_bp 1000."
            - "One TENDERED sale of 60 units at unit_cost_cents 100000: extended 6000000, surcharge 600000, so the fund posture is UNRESTRICTED."
            - "One CapitalProject of 400000 (contingency 40000, obligation 440000) submitted by sfc-050 and APPROVED by mwr-050 — 440000 <= 600000 available, so it went straight to APPROVED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort McCoy Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 1000 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-SOD-100000", name: "Pallet Coffee", category: "GROCERY_STAPLE", unit_cost_cents: 100000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AH1", facings: 10, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "MSG L Fontaine", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 60 }
              as: StoreCashier
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Front-end canopy", requested_amount_cents: 400000 }
              as: SurchargeFundController
              as_user_id: "sfc-050"
              captures: { project_id: $.data.id }
            - call: "POST /capital-projects/${project_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-050"
            - call: "POST /capital-projects/${project_id}/decision"
              payload: { decision: "APPROVE" }
              as: MwrBoardOfficer
              as_user_id: "mwr-050"
          trigger:
            - call: "POST /capital-projects/${project_id}/close"
              payload: { outlay_cents: 380000 }
              as: SurchargeFundController
              as_user_id: "sfc-050"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 403 and ${error_id} == ERR_SEGREGATION_OF_DUTIES"
            - "CapitalProject.${project_id}.state == APPROVED, outlay_cents == 0, closed_by_user_id == null"
            - "CapitalProject.${project_id}.submitted_by_user_id == sfc-050 and decided_by_user_id == mwr-050"
            - "Store.${store_id}.surcharge_obligated_cents == 440000 and surcharge_fund_balance_cents == 600000"
            - "GET /stores/${store_id}/fund-ledger with entry_type == CAPITAL_OUTLAY returns total_count == 0"
            - "the same close by a DIFFERENT SurchargeFundController user id succeeds with 200"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_stale_store_version_on_assortment_create_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.assortment-create-stale-store
          - validations.priority_11_ERR_STALE_STORE_VERSION
          - errors.ERR_STALE_STORE_VERSION
        distinguishing_aspect: |
          The first allocation bumps Store.version as a side effect, so a second
          allocation written from the SAME pre-read version is rejected 412 even
          though its shelf block and window are entirely free — the guard is the
          store-level aggregate, not the shelf block.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store with shelf capacity 24, version read once at creation."
            - "One product and one accepted allocation on shelf block AI1 written with that version, which advances the store."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Buchanan Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500, shelf_block_capacity_facings: 24 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-OCC-800", name: "Beach Chair", category: "GENERAL_MERCHANDISE", unit_cost_cents: 800 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AI1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { first_assortment_id: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { store_v1: $.data.version }
          trigger:
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AI2", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 412 and ${error_id} == ERR_STALE_STORE_VERSION"
            - "${store_v1} == ${store_v0} + 1"
            - "Store.${store_id}.version == ${store_v1} — the refused write did not advance it further"
            - "GET /assortments with store_id == ${store_id} returns total_count == 1, only ${first_assortment_id}"
            - "the identical retry carrying expected_store_version == ${store_v1} returns 201"

      - name: corner_stale_delegate_patron_version_on_delegation_create_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.delegation-create-stale-delegate
          - validations.priority_12_ERR_STALE_PATRON_VERSION
          - errors.ERR_STALE_PATRON_VERSION
        distinguishing_aspect: |
          The second sponsor's grant WOULD have superseded the first one, but the OCC
          guard at priority 12 fires first: the stale delegate version returns 412 and
          the incumbent delegation is still ACTIVE with superseded_by_delegation_id
          null, so no supersession side effect leaks out of a rejected write.
        test_recipe:
          setup:
            - "Two RETIREE sponsors and one ACTIVE_DUTY delegate whose version is read once at enrollment."
            - "One ACTIVE delegation from the first sponsor over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), which advances the delegate's version."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "SGM (Ret) M Oyelaran", id_card_class: "RETIREE" }
              as: ComplianceOfficer
              captures: { sponsor_1_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "COL (Ret) N Steinhauer", id_card_class: "RETIREE" }
              as: ComplianceOfficer
              captures: { sponsor_2_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SPC O Bhattacharya", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_1_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 50000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_1_id: $.data.id }
            - call: "GET /patrons/${delegate_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { delegate_v1: $.data.version }
          trigger:
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_2_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-20T00:00:00Z", per_sale_spend_cap_cents: 50000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 412 and ${error_id} == ERR_STALE_PATRON_VERSION"
            - "${delegate_v1} == ${delegate_v0} + 1 and Patron.${delegate_id}.version == ${delegate_v1}"
            - "ShopperDelegation.${delegation_1_id}.status == ACTIVE and superseded_by_delegation_id == null"
            - "GET /shopper-delegations with delegate_patron_id == ${delegate_id} returns total_count == 1"
            - "the identical retry carrying expected_delegate_patron_version == ${delegate_v1} returns 201 and DOES supersede ${delegation_1_id}"

      - name: corner_store_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.Store.common_fields
          - endpoints.POST_/assortments
          - endpoints.POST_/sales/{id}/tender
          - endpoints.POST_/stores/{id}/close-period
        distinguishing_aspect: |
          Store.version starts at 1 and advances by exactly one per write that
          touches the store — allocation create, tender, period close — while reads
          and line adds leave it alone, so the OCC token is monotone and not a change
          counter over unrelated traffic.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500, one product at unit_cost_cents 500 and one ACTIVE_DUTY patron."
            - "Versions are re-read after each write: creation, allocation create, line add, tender, period close."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Greely Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, v_created: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-VER-500", name: "Pasta 5lb", category: "GROCERY_STAPLE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AJ1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${v_created}" }
              as: AssortmentPlanner
            - call: "GET /stores/${store_id}"
              payload: {}
              as: SurchargeFundController
              captures: { v_after_assortment: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "SGT P Larsson", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
            - call: "GET /stores/${store_id}"
              payload: {}
              as: SurchargeFundController
              captures: { v_after_line: $.data.version }
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
            - call: "GET /stores/${store_id}"
              payload: {}
              as: SurchargeFundController
              captures: { v_after_tender: $.data.version }
          trigger:
            - call: "POST /stores/${store_id}/close-period"
              payload: {}
              as: SurchargeFundController
              captures: { v_after_close: $.data.version }
          assert:
            - "${v_created} == 1"
            - "${v_after_assortment} == 2 — the allocation create bumped the parent"
            - "${v_after_line} == 2 — ringing a line touches the Sale, not the Store"
            - "${v_after_tender} == 3 and ${v_after_close} == 4"
            - "Store.${store_id}.surcharge_fund_balance_cents == 50 and period_close_index == 1"

      - name: corner_assortment_retire_cascade_cancels_overseas_pending_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Assortment.ACTIVE_to_RETIRED
          - state_machines.SpecialOrder.OVERSEAS_SHIP_PENDING_to_CANCELLED
          - entities.Store.fields.shipping_allowance_committed_cents
          - calculations.special_order_shipping_allowance
        distinguishing_aspect: |
          Retiring the allocation reaches two hops out: the OVERSEAS_SHIP_PENDING
          order is cancelled with cancelled_reason ASSORTMENT_RETIRED (not
          PATRON_REQUEST) and the store's committed shipping allowance drops from 472
          back to 0, so the release is driven by the assortment rather than by the
          patron.
        test_recipe:
          setup:
            - "One EXCHANGE / OVERSEAS store."
            - "One assorted product at unit_cost_cents 3000 weighing 900 grams."
            - "One special order for quantity 3 routed OVERSEAS_SHIP: billable_weight_kg ceil(2700/1000) == 3, gross_ship 3 * 210 == 630, patron_share round_half_up(630 * 2500 / 10000) == 158, allowance min(15000, 630 - 158) == 472."
            - "Store.shipping_allowance_committed_cents == 472 before the trigger."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Torii Station Exchange", channel: "EXCHANGE", region: "OVERSEAS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-CAS-3000", name: "Rice Cooker", category: "GENERAL_MERCHANDISE", unit_cost_cents: 3000, unit_weight_grams: 900 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AK1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", overseas_shipping_allowance_cents: 100, expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SSG Q Delacruz", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}", product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { order_id: $.data.id }
            - call: "POST /special-orders/${order_id}/route"
              payload: { route: "OVERSEAS_SHIP" }
              as: StoreCashier
          trigger:
            - call: "POST /assortments/${assortment_id}/retire"
              payload: { reason: "VENDOR_DISCONTINUED" }
              as: AssortmentPlanner
          assert:
            - "HTTP status == 200 and Assortment.${assortment_id}.status == RETIRED"
            - "SpecialOrder.${order_id}.state == CANCELLED and cancelled_reason == ASSORTMENT_RETIRED"
            - "SpecialOrder.${order_id}.billable_weight_kg == 3, gross_ship_cents == 630, patron_share_cents == 158, shipping_allowance_cents == 472 — the audit figures survive the cancel"
            - "Store.${store_id}.shipping_allowance_committed_cents == 0"

      - name: corner_close_period_auto_approves_only_the_first_parked_project
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/stores/{id}/close-period
          - state_machines.CapitalProject.AWAITING_FUNDS_to_APPROVED
          - calculations.store_fund_posture
          - entities.Store.fields.surcharge_obligated_cents
        distinguishing_aspect: |
          Two identical parked projects are walked in created_at ASC at the period
          close: the earlier one is approved and books 220000, which drops the posture
          from UNRESTRICTED to CONSTRAINED, so the later one stays parked even though
          440000 is still available — the walk re-derives the posture after every
          booking instead of comparing both obligations against the opening balance.
          Note also that closing the big project beforehand released its obligation
          WITHOUT un-parking anything: only tender and period close carry that trigger.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 1000."
            - "One TENDERED sale of 70 units at unit_cost_cents 100000: surcharge 700000 collected, posture UNRESTRICTED."
            - "Project BIG of 400000 (obligation 440000) submitted by sfc-901, APPROVED, leaving available 260000 and posture CONSTRAINED."
            - "Projects EARLY then LATE, each 200000 (contingency 20000, obligation 220000), each APPROVE-decided while the posture was CONSTRAINED, so both parked in AWAITING_FUNDS."
            - "Project BIG then CLOSED by sfc-902 with outlay 40000: balance 660000, obligated 0, posture UNRESTRICTED, and EARLY and LATE are STILL parked."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Sam Houston Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 1000 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-CHK-100000", name: "Pallet Rice", category: "GROCERY_STAPLE", unit_cost_cents: 100000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AL1", facings: 10, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "1SG R Ellingsworth", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 70 }
              as: StoreCashier
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Roof membrane replacement", requested_amount_cents: 400000 }
              as: SurchargeFundController
              as_user_id: "sfc-901"
              captures: { project_big_id: $.data.id }
            - call: "POST /capital-projects/${project_big_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-901"
            - call: "POST /capital-projects/${project_big_id}/decision"
              payload: { decision: "APPROVE" }
              as: MwrBoardOfficer
              as_user_id: "mwr-901"
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Produce misting system", requested_amount_cents: 200000 }
              as: SurchargeFundController
              as_user_id: "sfc-901"
              captures: { project_early_id: $.data.id }
            - call: "POST /capital-projects/${project_early_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-901"
            - call: "POST /capital-projects/${project_early_id}/decision"
              payload: { decision: "APPROVE" }
              as: MwrBoardOfficer
              as_user_id: "mwr-901"
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Cart corral canopy", requested_amount_cents: 200000 }
              as: SurchargeFundController
              as_user_id: "sfc-901"
              captures: { project_late_id: $.data.id }
            - call: "POST /capital-projects/${project_late_id}/submit"
              payload: {}
              as: SurchargeFundController
              as_user_id: "sfc-901"
            - call: "POST /capital-projects/${project_late_id}/decision"
              payload: { decision: "APPROVE" }
              as: MwrBoardOfficer
              as_user_id: "mwr-901"
            - call: "POST /capital-projects/${project_big_id}/close"
              payload: { outlay_cents: 40000 }
              as: SurchargeFundController
              as_user_id: "sfc-902"
          trigger:
            - call: "POST /stores/${store_id}/close-period"
              payload: {}
              as: SurchargeFundController
          assert:
            - "HTTP status == 200"
            - "CapitalProject.${project_early_id}.state == APPROVED and CapitalProject.${project_late_id}.state == AWAITING_FUNDS"
            - "CapitalProject.${project_early_id}.created_at < CapitalProject.${project_late_id}.created_at"
            - "Store.${store_id}.surcharge_obligated_cents == 220000 and surcharge_fund_balance_cents == 660000"
            - "Store.${store_id}.fund_posture == CONSTRAINED — available 440000"
            - "CapitalProject.${project_big_id}.state == CLOSED with outlay_cents == 40000 and closed_by_user_id == sfc-902"
            - "GET /stores/${store_id}/fund-ledger with fund == SURCHARGE returns total_count == 2: SURCHARGE_COLLECTION +700000 (balance_after 700000) then CAPITAL_OUTLAY -40000 (balance_after 660000)"
            - "Store.${store_id}.period_close_index == 1"

      - name: corner_both_allowance_variants_produce_their_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - calculations.vendor_promotional_allowance.variants
          - entities.Sale.fields.provisional_allowance_cents
          - entities.Sale.fields.settled_allowance_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / allowance_provisional_vs_settled_diverge_when_clock_passes_promo_window
          rationale: "Both variants are computed on one sale there, with the clock moved between the line add and the tender so the delta lands in allowance_variance_cents."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_tender_response_shows_all_derived_money_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/sales/{id}/tender
          - calculations.line_retail_price
          - calculations.vendor_promotional_allowance
        distinguishing_aspect: |
          The tender response itself already carries every derived money field and
          both fund balances — nothing lags to a later read: markup 200, surcharge
          110, total_due 2310 and settled_allowance 330 are visible in the same
          request, and an immediately following GET returns identical values.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store, surcharge_rate_bp 500, exchange_markup_bp 1000."
            - "One DSD assortment from vendor Harborline Goods with promo_allowance_bp 1500 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
            - "One OPEN sale of an ACTIVE_DUTY patron with one line of quantity 4 at unit_cost_cents 500: per-unit markup round_half_up(500 * 1000 / 10000) == 50, unit_price 550, extended 2200, line_markup 200, surcharge round_half_up(2200 * 500 / 10000) == 110."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Story Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500, exchange_markup_bp: 1000 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-IMM-500", name: "Camp Chair", category: "GENERAL_MERCHANDISE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "AM1", facings: 6, supply_mode: "DSD", vendor_name: "Harborline Goods", promo_allowance_bp: 1500, promo_window_start: "2026-08-01T00:00:00Z", promo_window_end: "2026-09-01T00:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT S Kaminski", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 4 }
              as: StoreCashier
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
          assert:
            - "the tender RESPONSE body carries tender_state == TENDERED, merchandise_cents == 2200, markup_total_cents == 200, surcharge_total_cents == 110, tax_cents == 0, total_due_cents == 2310"
            - "the same response carries provisional_allowance_cents == 330, settled_allowance_cents == 330, allowance_variance_cents == 0"
            - "SaleLine.${line_id}.unit_price_cents == 550 and line_markup_cents == 200 and extended_cents == 2200"
            - "an immediately following GET /sales/${sale_id} returns exactly the same money fields"
            - "Store.${store_id}.surcharge_fund_balance_cents == 110 and dividend_fund_balance_cents == 330 in the very next read"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 2"
