            - "the same body with expected_furnace_version ${fv2} returns 201 with reserved_melt_tons 600.00, Furnace.${f}.version == 3 and reserved_pull_tons == 600.00"
            - "a second create PJ-CC1-B over 2026-08-03T01:00:00Z..2026-08-05T01:00:00Z reusing expected_furnace_version ${fv2} returns 412 ERR_STALE_FURNACE_VERSION"
            - "that same second create with the newly observed version 3 returns 201, leaving Furnace.${f}.version == 4 and reserved_pull_tons == 1200.00"

      - name: program_create_with_a_stale_design_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.program-create-stale-design
          - errors.ERR_STALE_DESIGN_VERSION
          - entities.BottleDesign.common_fields
        distinguishing_aspect: |
          The design version captured at risk-signoff is stale once the approval lands, so the first program
          create is 412; the post-approval version succeeds and itself bumps the design, so replaying it for
          a second program is 412 again - and only the fresh version lets the second program supersede the
          first.
        test_recipe:
          setup:
            - "Customer CUST-CC2 with design BD-CC2 (500.00 ml, 190.00 g, wall 1.80 mm, 500.00 bpm) taken to RISK_SIGNED and then APPROVED"
