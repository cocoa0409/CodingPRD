          assert:
            - "error_id == ERR_INVALID_WINDOW (temporal check at priority 6 beats booth-uniqueness constraint at priority 7)"
            - "http status == 422"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_threshold_boundary_provisional_aggregate
        grounds:
          - calculations.project_aggregate
          - entities.Project.fields.provisional_aggregate
        distinguishing_aspect: |
          Numeric threshold boundary (>= on a ceil'd quorum): with
          max_judges_per_project=3 and min_quorum_ratio_pct=66, the quorum is
          ceil(3*66/100)=2 sheets; at exactly 2 SUBMITTED sheets the provisional
          aggregate appears (= 0.50 for the pinned pool), at 1 sheet it is null.
          Metric: sheet count vs quorum threshold, via the score-sheets endpoint.
        test_recipe:
          setup:
            - "Edition (Z_SCORE, max_judges=3, quorum=66) in JUDGING; project PX with 3 assignments (J1,J2,J3); J2 has another sheet on PY so J2's pool is [85,75]"
