            - "One smoke lot of 5 units at 1850 cents each, so available_cents (1000) is below the unit cost."
            - "One household visited, arrived, education DECLINED, then completed with install_outcome DEFERRED - so visit_status is COMPLETED and install_status is INSTALL_DEFERRED."
