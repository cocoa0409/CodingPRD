            - "ERR_LOT_NOT_RELEASABLE (priority 8) is NOT returned even though the lot is QUARANTINED — priority 5 wins the conflict"

      - name: safety_eligibility_beats_fiscal_quantity_cap
        grounds:
          - validations[priority=7]
          - validations[priority=12]
        distinguishing_aspect: |
          Category pair (business_safety vs business_fiscal): a disbursement
