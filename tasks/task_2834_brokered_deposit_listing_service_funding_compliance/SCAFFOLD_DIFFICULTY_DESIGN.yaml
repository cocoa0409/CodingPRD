            - "forward leg: DepositPlacement.${pl_id}.funding_status == ACTIVE and classified_as == BROKERED"
            - "forward leg: Institution.${inst_id}.brokered_deposits_cents == 2000000000 and total_deposits_cents == 42000000000"
            - "forward leg: the first summary has wholesale_funding_ratio_bps == 476 and single_broker_max_ratio_bps == 476"
