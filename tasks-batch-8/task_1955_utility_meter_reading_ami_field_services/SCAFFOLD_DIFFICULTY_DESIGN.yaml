          assert:
            - "error_id == ERR_ACTIVE_HAZARD_BLOCKS_READ   # business_safety (priority 12) beats business_temporal (priority 15)"
            - "error_id != ERR_READ_OUTSIDE_WINDOW"
            - "RouteStop.${stop_id}.stop_status == PENDING   # unchanged"

  - rule_id: boundary_precision_check
    instances:
      - name: read_capture_window_date_inclusive_boundaries
        grounds:
          - calculations.read_window_alignment
          - errors[ERR_READ_OUTSIDE_WINDOW]
        distinguishing_aspect: |
          Boundary metric = read_at date vs the read window, on POST /route-stops/{id}/reads:
          read_at exactly ON the open date (00:00:00) and exactly ON the close date (23:59:59) are
          both accepted (inclusive/inclusive), while one second past close date midnight is rejected.
        test_recipe:
          setup:
            - "Three handheld accounts with meters on one IN_PROGRESS route; period window [2026-08-06..2026-08-10]"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
