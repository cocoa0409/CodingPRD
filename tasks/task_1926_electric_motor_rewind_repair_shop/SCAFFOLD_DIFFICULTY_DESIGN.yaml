            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-B30", rated_kw: 10, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { mb: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${mb}", priority: "STANDARD" }
              as: Technician
              captures: { wb: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wb}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wb}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 1, materials_cents: 0, replacement_cost_cents: 999999 }
              as: Technician
              as_user_id: "op-t"
            - call: "GET /shops/${shop_id}/work-orders/${wb}"
              as: Estimator
              captures: { wbv: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wb}/quotes"
              payload: { expected_work_order_version: "${wbv}" }
              as: Estimator
              captures: { qb: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wb}/quotes/${qb}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${wb}/quotes/${qb}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${wb}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wb}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wb}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.0, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
            - call: "POST /shops/${shop_id}/work-orders/${wb}/release"
              as: ServiceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "GET /shops/${shop_id}/customers/${cust_id}"
              as: ServiceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ShopAdmin
            - call: "GET /shops/${shop_id}/customers/${cust_id}"
              as: ServiceManager
          assert:
            - "First read (30 days overdue): Customer.${cust_id}.standing == WATCH   # > 30 required for HOLD; 30 is not > 30"
            - "Second read (31 days overdue): Customer.${cust_id}.standing == HOLD"

  # Rule 7 — cross_entity_state_dependency: two dependencies across DIFFERENT
  # entity pairs.
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pool_checkout_depends_on_contract_active_and_spare_in_pool
        grounds:
          - state_machines.PoolLoan.transitions
          - validations[priority=11]
          - state_machines.SparePoolContract.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair PoolLoan x SparePoolContract x Motor: loan checkout requires the
          CONTRACT in ACTIVE and the spare MOTOR in custody IN_POOL; suspending
          the contract or lending the spare elsewhere blocks checkout with
          ERR_POOL_UNAVAILABLE.
        test_recipe:
          setup:
            - "Contract SUSPENDED with a free spare P IN_POOL and a diagnosed work order W awaiting loan"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-11", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "P-2", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2019, is_pool_spare: true }
              as: ServiceManager
              captures: { spare_id: $.data.id }
            - call: "POST /shops/${shop_id}/pool-contracts"
              payload: { customer_id: "${cust_id}", slot_count: 1 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/pool-contracts/${contract_id}/suspend"
