      - name: scope_violation_beats_state_returns_403
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_CROSS_FAMILY_ACCESS]"]
        distinguishing_aspect: "A Parent from family B PATCHing an ARCHIVED child of family A fails scope (priority 4) with ERR_CROSS_FAMILY_ACCESS before the archived-state check (priority 6) is ever evaluated."
        test_recipe:
          setup: ["Family A with archived child A; Family B with parent B"]
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam SA", primary_contact_email: "sa@x.com", primary_parent_name: "Pat SA" }
              as: PlatformAdmin
              captures: { fam_sa: $.data.id }
            - call: "GET /api/families/${fam_sa}/parents"
