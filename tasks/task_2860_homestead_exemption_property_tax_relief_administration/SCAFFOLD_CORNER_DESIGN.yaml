      - name: granted_appeal_reopens_a_denied_application_into_a_duplicate_grant_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_DUPLICATE_GRANT]
          - state_machines.ExemptionApplication.DENIED_to_UNDER_REVIEW
          - state_machines.Appeal.SCHEDULED_to_GRANTED
        distinguishing_aspect: "The duplicate-grant guard keys on (parcel_id, program_id, effective_tax_year) with benefit_status in {ACTIVE, SUSPENDED}, so the application revived by a GRANTED appeal cannot be approved a second time: the reopened application sits in UNDER_REVIEW with determined_by_user_id cleared to null and the approval attempt returns 409 while the second grant keeps the parcel's 8400000 exemption."
