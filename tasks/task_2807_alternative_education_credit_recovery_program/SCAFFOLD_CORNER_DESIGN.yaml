            - "GraduationPlan.${plan_id}.expected_credits_by_grade == 0.25, credits_earned == 0.25 and posture == ON_TRACK, so the priority-15 rung passed"
            - "Placement.${pl_id}.attendance_component == 0.9000, pacing_component == 0.0000, credit_component == 0.0000, readiness_base_score == 0.4500, engagement_bonus == 0.0000 and readiness_score == 0.4500"
