              payload: {}
              as: ProgramDirector
            - *c_stu
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_a_id}", expected_section_version: "${c_sec_a_v}" }
              as: Registrar
              captures: { c_enr_occ_id: $.data.id }
          assert:
            - "the response status is 201"
            - "subsequent GET /sections/${c_sec_a_id} shows version == ${c_sec_a_v} + 1"

      - name: scheduled_action_touring_sync_state_progression
        claim_type: scheduled_actions
        grounds:
          - state_machines.TouringAssignment.ACCEPTED_to_ON_TOUR
          - state_machines.TouringAssignment.ON_TOUR_to_RETURNED
        distinguishing_aspect: "ACCEPTED touring assignment transitions ON_TOUR only when current_utc >= tour_start_utc, then RETURNED only when current_utc >= tour_end_utc. Time-based progression is clock-driven via the sync endpoint."
        test_recipe:
          setup: ["ACCEPTED touring assignment tour_start=2027-06-01, tour_end=2027-06-15. Clock at 2027-05-15."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - *c_instr
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *c_sec_a
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - *c_stu2
            - *c_enr_al
            - call: "POST /enrollments/${c_enr_al_id}/confirm"
              payload: {}
              as: Registrar
            - call: "POST /terms/${c_term_id}/start-session"
              payload: {}
              as: ProgramDirector
            - call: "POST /terms/${c_term_id}/close"
              payload: {}
              as: ProgramDirector
            - *c_vs
            - *c_cast3
            - &c_tour2
              call: "POST /touring-assignments"
              payload: { ensemble_cast_id: "${c_cast3_id}", principal_student_id: "${c_sid}", understudy_student_id: "${c_s2_id}", tour_start_utc: "2027-06-01T00:00:00Z", tour_end_utc: "2027-06-15T00:00:00Z" }
              as: CastingDirector
              captures: { c_tour2_id: $.data.id }
            - call: "POST /touring-assignments/${c_tour2_id}/accept"
              payload: {}
              as: Student
              as_user_id: "${c_sid}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-05-15T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /touring-assignments/${c_tour2_id}/sync"
              payload: {}
              as: CastingDirector
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-05T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /touring-assignments/${c_tour2_id}/sync"
              payload: {}
              as: CastingDirector
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-20T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /touring-assignments/${c_tour2_id}/sync"
              payload: {}
              as: CastingDirector
          assert:
            - "after first sync (before tour_start): status == ACCEPTED"
            - "after second sync (between start and end): status == ON_TOUR"
            - "after third sync (after end): status == RETURNED"
