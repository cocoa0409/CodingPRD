            - "final: Permit.status == ISSUED, issued_at == 2026-08-01T00:00:00Z, revision_count == 1, total_fee_cents == 190900"
            - "Owner.${owner_id}.fee_balance_cents == 0 and delinquency_status == CURRENT"
            - "Dam.${dam_id}.regulatory_status == REGISTERED (a CONSTRUCTION permit never moves it to REMOVAL_PERMITTED)"

  - rule_id: transitive_cascade
    instances:
      - name: certification_supersedes_reclassifies_revises_plan_and_opens_deficiency
        depth: 4
        grounds:
          - state_machines.ConsequenceAssessment.DRAFT_to_CERTIFIED
          - state_machines.ConsequenceAssessment.CERTIFIED_to_SUPERSEDED
          - state_machines.EmergencyActionPlan.APPROVED_to_REVISION_REQUIRED
          - calculations.hazard_classification
          - calculations.inspection_due_schedule
          - calculations.hazard_class_program_requirements
          - concurrency_rules[eap-create-stale-dam]
        distinguishing_aspect: |
          One certify call propagates four hops deep, each hop caused by the previous one:
          (1) the old CERTIFIED assessment is SUPERSEDED, so (2) the dam is reclassified
          SIGNIFICANT -> HIGH and its inspection due date is recomputed from a 12-month instead of a
          24-month interval, so (3) the APPROVED emergency action plan - whose inundation map is no
          longer the map of record - falls to REVISION_REQUIRED with expires_at cleared, so (4) a
          SYSTEM_EAP / EAP_MISSING / SERIOUS deficiency opens on a dam that is now eap_required with
          no approved plan. Link 4 is caused by link 3, not by the certify call directly.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z throughout."
            - "Dam registered 2019-04-15T00:00:00Z, first classified SIGNIFICANT by assessment A1 (score 6.60) whose inundation_map_ref is IM-2019-A."
            - "An emergency action plan built on IM-2019-A with 4 notification contacts (the SIGNIFICANT minimum) has been submitted and APPROVED, so expires_at = 2031-08-01T00:00:00Z (EAP_VALIDITY_MONTHS_SIGNIFICANT = 60)."
            - "A second DRAFT assessment A2 exists on a newer map IM-2026-B with population_at_risk 12, habitable_structures 4, travel 20 minutes, 300 acres."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "GET /dams/${dam_id}"
              payload: {}
              as: ProgramAdmin
              captures: { dam_v_after_a1: "$.data.version" }
            - call: "POST /emergency-action-plans"
              payload: { dam_id: "${dam_id}", version_label: "EAP-2019-rev0", inundation_map_ref: "IM-2019-A", notification_flowchart_ref: "FC-2019-A", notification_contact_count: 4, drawdown_procedure_ref: "DD-2019-A", expected_dam_version: "${dam_v_after_a1}" }
              as: DamOwner
              as_user_id: "${owner_id}"
              captures: { eap_id: "$.data.id" }
            - call: "POST /emergency-action-plans/${eap_id}/submit"
              payload: {}
              as: DamOwner
              as_user_id: "${owner_id}"
            - call: "POST /emergency-action-plans/${eap_id}/review"
              payload: { decision: "APPROVE", findings: "Flowchart and inundation mapping conform to the 2019 map of record." }
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 12, habitable_structures: 4, critical_facilities: 0, breach_peak_outflow_cfs: 18500, breach_travel_time_minutes: 20, inundation_area_acres: 300, inundation_map_ref: "IM-2026-B" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a2_id: "$.data.id" }
          trigger:
            - call: "POST /consequence-assessments/${a2_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
          assert:
            - "hop 1: ConsequenceAssessment.${a1_id}.status == SUPERSEDED and superseded_at == 2026-08-01T00:00:00Z"
            - "hop 2: Dam.${dam_id}.hazard_class == HIGH, current_consequence_score == 45.00, eap_required == true"
            - "hop 2: Dam.${dam_id}.next_inspection_due_at == 2020-04-15T00:00:00Z (12 months from registered_at, not the 24 months that applied while SIGNIFICANT) and inspection_overdue == true"
            - "hop 3: EmergencyActionPlan.${eap_id}.status == REVISION_REQUIRED and expires_at == null (it was 2031-08-01T00:00:00Z before the trigger)"
            - "hop 3: Dam.${dam_id}.latest_eap_status == REVISION_REQUIRED"
            - "hop 4: exactly one Deficiency exists on the dam with source == SYSTEM_EAP, category == EAP_MISSING, severity == SERIOUS, status == OPEN, inspection_id == null"
            - "hop 4: Dam.${dam_id}.open_deficiency_count == 1"
            - "GET /dams/${dam_id}/compliance-summary reports eap_expires_at == null, eap_exercise_current == false, open_deficiency_count == 1"
            - "Dam.${dam_id}.regulatory_status == REGISTERED and safety_status == UNRATED - the cascade never touches those dimensions"

      - name: sweep_default_assesses_penalty_then_delinquency_then_enforcement
        depth: 4
        grounds:
          - state_machines.RemediationOrder.ISSUED_to_DEFAULTED
          - state_machines.Deficiency.ORDERED_to_ESCALATED
          - state_machines.Dam.REGISTERED_to_UNDER_ENFORCEMENT
          - calculations.civil_penalty_accrual
          - calculations.owner_fee_balance_and_delinquency
          - entities.FeeLedgerEntry.fields.posted_by_user_id
        distinguishing_aspect: |
          A different trigger (POST /program/compliance-sweep, a system operation with no target id)
          and a different chain from the certification cascade: (1) the overdue EMERGENCY_ORDER
          defaults and an assessed penalty is computed, so (2) a CIVIL_PENALTY ledger row is appended
          by SYSTEM, so (3) the recomputed balance crosses DELINQUENCY_THRESHOLD_CENTS and the owner
          becomes DELINQUENT, so (4) because the owner became delinquent the dam moves REGISTERED ->
          UNDER_ENFORCEMENT. Hop 4 is conditioned on hop 3, not on the default itself.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z, then 2026-08-05T13:00:00Z, then 2026-08-18T13:00:00Z."
