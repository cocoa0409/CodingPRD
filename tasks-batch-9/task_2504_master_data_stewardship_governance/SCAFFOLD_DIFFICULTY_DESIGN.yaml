              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
            - call: "POST /mdm/domains/${dom_id}/activate"
              payload: {}
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [{ rule_code: "QR1", measured_pct: 90.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run1_score: $.data.weighted_score, run1_evaluated: $.data.rules_evaluated_count, run1_failed: $.data.rules_failed_count, run1_created: $.data.findings_created_count }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { posture_after_run1: $.data.governance_posture, weight_after_run1: $.data.open_finding_weight, certified_after_run1: $.data.quality_score_certified }
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [{ rule_code: "QR1", measured_pct: 89.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run2_id: $.data.id, run2_score: $.data.weighted_score, run2_failed: $.data.rules_failed_count, run2_created: $.data.findings_created_count }
            - call: "GET /mdm/quality-findings?scorecard_run_id=${run2_id}&quality_rule_id=${qr1_id}"
              as: GovernanceAdmin
              captures: { f_gap: "$.data[0].gap_pct", f_measured: "$.data[0].measured_pct", f_weight: "$.data[0].severity_weight", f_status: "$.data[0].status" }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { posture_after_run2: $.data.governance_posture, weight_after_run2: $.data.open_finding_weight, certified_after_run2: $.data.quality_score_certified }
          assert:
            - "${run1_evaluated} == 1 and ${run1_failed} == 0 and ${run1_created} == 0"
            - "${run1_score} == 100.00 (measured_pct == threshold_pct is a pass earning all 40 weight_points: 100 * 40 / 40)"
            - "${certified_after_run1} == 100.00 and ${weight_after_run1} == 0.00 and ${posture_after_run1} == OPEN"
            - "${run2_failed} == 1 and ${run2_created} == 1"
            - "${run2_score} == 98.90 (earned = round(40 * 89.00 / 90.00, 2) = 39.56, then round(100 * 39.56 / 40, 2) = 98.90; rounding once at the end would give 98.89)"
            - "${f_measured} == 89.00 and ${f_gap} == 1.00 and ${f_status} == OPEN"
            - "${f_weight} == 8.00 (HIGH base 8 x multiplier 1.00 pinned at creation while the posture was still OPEN)"
            - "${weight_after_run2} == 8.00 and ${posture_after_run2} == OPEN (8.00 < the 15.00 RESTRICTED threshold)"
            - "${certified_after_run2} == 98.90"

