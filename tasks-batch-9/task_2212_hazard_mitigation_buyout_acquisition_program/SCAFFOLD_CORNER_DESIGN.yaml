            - "trigger call 2 returns 401 with data.error_id == ERR_UNAUTHENTICATED and NOT 403 ERR_UNAUTHORIZED, even though StaffAppraiser is also not permitted to approve"
            - "trigger call 3 returns 200 with data.current_utc == 2026-08-02T00:00:00Z, because POST /_clock/set_current_utc is exempt from both header checks"

      - name: the_three_segregation_of_duties_bars_reject_a_user_who_is_otherwise_in_role
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_3
          - roles.ReviewAppraiser
