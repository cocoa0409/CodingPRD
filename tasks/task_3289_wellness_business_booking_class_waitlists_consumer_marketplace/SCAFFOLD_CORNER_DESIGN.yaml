            - "the zero-credit pack produces ERR_NO_ACTIVE_PACK at 409"
            - "error_id != ERR_CLASS_PACK_NOT_FOUND, because the pack exists and is merely exhausted"
            - "the session's seats_taken is unchanged by the failed attempt"

