          assert:
            - "PanelistAppointment.${apt_a_id}.conflict_score == 60.00"
            - "PanelistAppointment.${apt_a_id}.status == CONFLICTED"
            - "PanelistAppointment.${apt_a_id}.conflict_factors == [FINANCIAL_INTEREST]"
            - "PanelistAppointment.${apt_a_id}.status becomes REPLACED after the replace call, with replaced_by_appointment_id == ${apt_b_id}"
            - "PanelistAppointment.${apt_b_id}.conflict_score == 20.00"
            - "PanelistAppointment.${apt_b_id}.status == ACCEPTED"
            - "PanelistAppointment.${apt_b_id}.conflict_factors == [PRIOR_REPRESENTATION, SAME_FIRM]"
            - "The raw totals are 60 for ${apt_a_id} and 80 for ${apt_b_id}, so the final ordering 60.00 > 20.00 is the reverse of the raw ordering 60 < 80"
            - "POST /udrp/appointments/${apt_a_id}/waiver would have returned ERR_CONFLICT_NOT_WAIVABLE (409) because 60.00 >= CONFLICT_DISQUALIFY_THRESHOLD"
            - "Case.${case_id}.status == PANEL_CONSTITUTED once ${apt_b_id} is ACCEPTED"
            - "PanelistAppointment.${apt_b_id}.honoraria_cents == 105000, the whole honoraria pool of the single-member case"
            - "Panelist.${pan_a_id}.active_case_load == 0 and Panelist.${pan_b_id}.active_case_load == 1"

      - name: honoraria_floor_each_seat_then_remainder_to_presiding_on_odd_pool
