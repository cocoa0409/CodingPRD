  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_error_wins_over_fiscal_error_on_funding_allocation_create
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_EVENT_NOT_FUNDABLE]
          - errors[ERR_GRANT_FUNDS_INSUFFICIENT]
          - state_machines.RemembranceEvent.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Category pair `state` (priority 9) versus `business_fiscal` (priority 14):
          one request violates both because the funded event is CANCELLED and the
          award has only 5000 cents against a required 11446, and the response must
          be ERR_EVENT_NOT_FUNDABLE (409), never ERR_GRANT_FUNDS_INSUFFICIENT.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Hall A' with capacity 60 and turnover_buffer_minutes 30."
            - "GrantAward with awarded_cents 5000 and allowed_categories [REMEMBRANCE_EVENT], so available_cents is 5000."
            - "One RemembranceEvent with direct_cost_cents 10220 -> program_cost_total_cents 11446, then CANCELLED."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Hall A", capacity: 60, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/grant-awards"
              payload: { funder_name: "Small Trust", award_reference: "ST-2026-TINY", awarded_cents: 5000, allowed_categories: ["REMEMBRANCE_EVENT"], period_start: "2026-01-01", period_end: "2026-12-31", indirect_rate_bps: 1200 }
              as: ProgramDirector
              captures: { g_id: $.data.id, g_v1: $.data.version }
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "Cancelled Vigil", meeting_space_id: "${sp_id}", event_date: "2026-10-05", start_minute_utc: 600, duration_minutes: 60, expected_attendance: 20, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { ev_id: $.data.id }
            - call: "POST /bereavement/remembrance-events/${ev_id}/cancel"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /bereavement/funding-allocations"
              payload: { grant_award_id: "${g_id}", category: "REMEMBRANCE_EVENT", event_id: "${ev_id}", expected_grant_award_version: "${g_v1}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "err == ERR_EVENT_NOT_FUNDABLE"
            - "err != ERR_GRANT_FUNDS_INSUFFICIENT"
            - "GrantAward.${g_id}.committed_cents == 0"
            - "GrantAward.${g_id}.available_cents == 5000"
            - "GrantAward.${g_id}.version == 1"

      - name: temporal_error_wins_over_capacity_error_on_remembrance_event_create
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_SPACE_TIME_CONFLICT]
          - errors[ERR_SPACE_CAPACITY_EXCEEDED]
          - calculations.meeting_space_occupation_conflict
        distinguishing_aspect: |
          A different category pair from the state-versus-fiscal instance:
          `business_temporal` (priority 12) versus `business_constraint` (priority 13).
          One create violates both - it collides with the cohort's Tuesday block and
          asks for 50 seats in a 20-seat room - and must return ERR_SPACE_TIME_CONFLICT
          (409), never ERR_SPACE_CAPACITY_EXCEEDED (422).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20 and turnover_buffer_minutes 30."
            - "Cohort occupying that room every TUE from 600 for 90 minutes (block 600-690), series 2026-09-08 through 2026-10-27."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Tuesday Illness Group", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_id: $.data.id, c_end: $.data.series_end_date }
          trigger:
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "Overbooked Vigil", meeting_space_id: "${sp_id}", event_date: "2026-10-06", start_minute_utc: 720, duration_minutes: 60, expected_attendance: 50, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "err == ERR_SPACE_TIME_CONFLICT"
            - "err != ERR_SPACE_CAPACITY_EXCEEDED"
            - "c_end == 2026-10-27"
            - "GET /bereavement/remembrance-events?meeting_space_id=${sp_id} returns 0 rows"

  # ===================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: space_turnover_gap_equal_to_buffer_collides_one_minute_later_does_not
        grounds:
          - calculations.meeting_space_occupation_conflict
          - entities.MeetingSpace.fields.turnover_buffer_minutes
          - errors[ERR_SPACE_TIME_CONFLICT]
          - validations[priority=12]
        distinguishing_aspect: |
          A numeric threshold on the minute axis reached through
          POST /bereavement/remembrance-events: a gap of exactly
          turnover_buffer_minutes (30) still collides because the comparison is
          non-strict, while a gap of 31 minutes is legal - start_minute_utc 720 is
          rejected and 721 is created.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20 and turnover_buffer_minutes 30."
            - "Cohort occupying that room every TUE from 600 for 90 minutes, so the existing block is 600-690 on 2026-10-06."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Tuesday Illness Group", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "Exactly One Buffer Later", meeting_space_id: "${sp_id}", event_date: "2026-10-06", start_minute_utc: 720, duration_minutes: 60, expected_attendance: 15, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { err_at_boundary: $.data.error_id }
            - call: "POST /bereavement/remembrance-events"
              payload: { title: "One Minute Past The Buffer", meeting_space_id: "${sp_id}", event_date: "2026-10-06", start_minute_utc: 721, duration_minutes: 60, expected_attendance: 15, direct_cost_cents: 10220 }
              as: ProgramDirector
              captures: { ev_ok_id: $.data.id }
          assert:
