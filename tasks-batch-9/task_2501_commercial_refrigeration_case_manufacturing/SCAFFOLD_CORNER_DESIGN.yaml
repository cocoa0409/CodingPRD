            - "Second call: HTTP 200, total_count == 0, has_more == false"

  # ==========================================================================
  # SECTION 7 — RBAC (claim-extraction-guide Table 7)
  # ==========================================================================
  - section: rbac
    instances:

      - name: platform_admin_own_operations_allowed
        claim_type: own_ops_allowed
        grounds:
          - roles[PlatformAdmin].exclusive_operations
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[POST /test-chambers]
        distinguishing_aspect: "PlatformAdmin can perform each of its three exclusive operations back to back — refrigerant registration, chamber registration and driving the logical clock — with no other role involved."
        test_recipe:
          setup:
            - "The store is empty and the clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-454C", trade_name: "Opteon XL20", gwp_100yr: 146, safety_class: "A2L", max_charge_grams: 8000, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", as: PlatformAdmin, as_user_id: "admin-001", payload: { to_iso8601: "2026-09-01T09:00:00Z" } }
          assert:
            - "First call: HTTP 201, data.gwp_100yr == 146"
            - "Second call: HTTP 201, data.turnaround_hours == 12, data.closed_window_start is null"
            - "Third call: HTTP 200 with an empty data payload; the logical clock now reads 2026-09-01T09:00:00Z for every later window check"

