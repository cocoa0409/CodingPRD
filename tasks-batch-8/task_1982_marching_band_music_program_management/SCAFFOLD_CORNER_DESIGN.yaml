  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: payment_waterfall_allocates_oldest_first
        claim_type: correct_result
        grounds: [calculations.payment_allocation_waterfall]
        distinguishing_aspect: "A PAYMENT of 5000 against two outstanding debits (MANUAL_DEBIT 3000 created first, then 4000) allocates [3000 to the older, 2000 to the newer] in created_at ASC order."
        test_recipe:
          setup: ["program; enrolled student with MANUAL_DEBIT 3000 then MANUAL_DEBIT 4000 (posted in that order)"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "WF", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "WF", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "MANUAL_DEBIT", amount_cents: 3000 }, as: BoosterTreasurer, captures: { d1: $.data.id } }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "MANUAL_DEBIT", amount_cents: 4000 }, as: BoosterTreasurer, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 5000 }, as: BoosterTreasurer, captures: { pay: $.data.id } }
            - { call: "GET /band/payments/${pay}", payload: {}, as: Any }
          assert:
            - "Payment.${pay}.allocations == [{debit_payment_id: ${d1}, applied_cents: 3000}, {debit_payment_id: ${d2}, applied_cents: 2000}]"
            - "Student.${stu}.account_balance_cents == 2000"
      - name: refund_tier_boundary_exactly_14_days
        claim_type: boundary
        grounds: [calculations.refund_tier_of_withdrawal]
        distinguishing_aspect: "days_to_departure >= 14 → 100%: excusing at exactly 14 days before departure refunds the full net_paid; at 13 days only 50%."
        test_recipe:
          setup: ["program; event; trip est 10000 cap 5 departure 2026-08-15T00:00:00Z; students A and B each enrolled and paid 10000; clock set to 2026-08-01T00:00:00Z (exactly 14 days)"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "RB", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-08-15T15:00:00Z", ends_at: "2026-08-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 5, estimated_cost_cents: 10000, departure_at: "2026-08-15T00:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "RA", grade: 9, section: "BRASS" }, as: BandDirector, captures: { s_a: $.data.id } }
            - { call: "POST /band/students/${s_a}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "RB", grade: 9, section: "BRASS" }, as: BandDirector, captures: { s_b: $.data.id } }
            - { call: "POST /band/students/${s_b}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${s_a}" }, as: BandDirector, captures: { enr_a: $.data.id } }
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${s_b}" }, as: BandDirector, captures: { enr_b: $.data.id } }
            - { call: "POST /band/payments", payload: { student_id: "${s_a}", kind: "PAYMENT", amount_cents: 10000, trip_enrollment_id: "${enr_a}" }, as: BoosterTreasurer }
            - { call: "POST /band/payments", payload: { student_id: "${s_b}", kind: "PAYMENT", amount_cents: 10000, trip_enrollment_id: "${enr_b}" }, as: BoosterTreasurer }
          trigger:
            - { call: "POST /band/trip-enrollments/${enr_a}/excuse", payload: {}, as: BandDirector }
            - { call: "GET /band/trip-enrollments/${enr_a}", payload: {}, as: Any, captures: { ref_a: $.data.refunded_cents } }
            - { call: "POST /band/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: BandDirector }
            - { call: "POST /band/trip-enrollments/${enr_b}/excuse", payload: {}, as: BandDirector }
            - { call: "GET /band/trip-enrollments/${enr_b}", payload: {}, as: Any, captures: { ref_b: $.data.refunded_cents } }
          assert:
            - "ref_a == 10000 (days == 14 → full tier, inclusive)"
            - "ref_b == 5000 (days == 13 → 50% tier; round_half_up(10000*0.5))"
      - name: fundraiser_largest_remainder_lossless_allocation
        claim_type: correct_result
        grounds: [calculations.fundraiser_credit_allocation]
        distinguishing_aspect: "raised 10001 over 3 students at 1 hour each: floor 3333 apiece, remainder 2 distributed to the two earliest-created students; allocated_credit_cents == 10001 (lossless)."
        test_recipe:
          setup: ["program; students A, B, C enrolled (created in that order); fundraiser OPEN"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "FR", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "FA", grade: 9, section: "BRASS" }, as: BandDirector, captures: { s_a: $.data.id } }
            - { call: "POST /band/students/${s_a}/enroll", payload: {}, as: BandDirector }
