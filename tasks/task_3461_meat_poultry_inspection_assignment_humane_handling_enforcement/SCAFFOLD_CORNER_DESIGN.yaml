  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_establishment_manager_cannot_decide_grant
        claim_type: rbac_denial
        grounds:
          - roles.EstablishmentManager
          - roles.DistrictManager
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Grant decisions are DistrictManager-exclusive: an EstablishmentManager (even the applicant itself) calling decide gets 403 ERR_FORBIDDEN, before any state logic."
        test_recipe:
          setup: ["Clock default. Establishment; application UNDER_REVIEW with all findings ADEQUATE."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "RB1 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_id}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
          trigger:
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "GRANT" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "GrantApplication.${ga_id}.status remains UNDER_REVIEW"

      - name: rbac_label_officer_cannot_issue_nr
        claim_type: rbac_denial
        grounds:
          - roles.LabelOfficer
          - roles.Inspector
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "NR issuance is Inspector-exclusive: a LabelOfficer calling POST /noncompliance-records gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Clock default. Establishment exists."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "RB2 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${est_id}", regulation_family: "SANITATION", description: "label officer attempt", observed_at: "2026-08-31T06:00:00Z" }
              as: LabelOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "GET /inspection/noncompliance-records?establishment_id=${est_id} returns 0 rows"

      - name: rbac_recall_coordinator_cannot_determine_class
        claim_type: rbac_denial
        grounds:
          - roles.RecallCoordinator
          - roles.DistrictManager
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "determine-class is DistrictManager-exclusive even though RecallCoordinator owns every other recall endpoint — the peer-role split inside the recall workflow."
        test_recipe:
          setup: ["Clock default. Establishment; recall INITIATED (created by RecallCoordinator)."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "RB3 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/recalls"
              payload: { establishment_id: "${est_id}", product_description: "sausage lot 8", quantity_lbs: 250, reason_code: "MISBRANDING" }
              as: RecallCoordinator
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /inspection/recalls/${rc_id}/determine-class"
              payload: { recall_class: "CLASS_III" }
              as: RecallCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "Recall.${rc_id}.status remains INITIATED and recall_class is null"

      - name: sod_reviewer_is_issuer_on_appeal_decide
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=10]
          - errors.ERR_SOD_REVIEWER_IS_ISSUER
          - state_machines.Appeal.FILED_to_AFFIRMED
        distinguishing_aspect: "Segregation of duties on appeals: the SupervisoryReviewer whose X-User-ID equals the NR's issued_by_inspector_id is rejected 403 ERR_SOD_REVIEWER_IS_ISSUER; a different reviewer identity decides successfully."
        test_recipe:
          setup: ["Clock default. Establishment; inspector A issued an NR; NR appealed (FILED)."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "RB4 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-RB4A", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_a: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Sue Supervisor", badge_number: "B-RB4B", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_b: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_a}", regulation_family: "HUMANE", description: "nr under appeal", observed_at: "2026-08-31T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { nr1: $.data.id }
            - call: "POST /inspection/appeals"
              payload: { noncompliance_record_id: "${nr1}", grounds: "grounds-text-dd" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /inspection/appeals/${ap1}/decide"
              payload: { outcome: "AFFIRM" }
              as: SupervisoryReviewer
              as_user_id: "${insp_a}"
              captures: { err_sod: $.data.error_id }
            - call: "POST /inspection/appeals/${ap1}/decide"
              payload: { outcome: "AFFIRM" }
              as: SupervisoryReviewer
              as_user_id: "${insp_b}"
          assert:
            - "issuer as reviewer: response status 403 and err_sod == ERR_SOD_REVIEWER_IS_ISSUER"
            - "different reviewer: response status 200 and Appeal.${ap1}.status == AFFIRMED with decided_by_reviewer_id == \"${insp_b}\""

      - name: sod_reporter_cannot_confirm_own_humane_event
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=10]
          - errors.ERR_SOD_REVIEWER_IS_ISSUER
          - state_machines.HumaneHandlingEvent.REPORTED_to_CONFIRMED
        distinguishing_aspect: "The same segregation rule guards humane verification: the reporting inspector cannot confirm their own event (403), while a peer reviewer can."
        test_recipe:
          setup: ["Clock default. Establishment; inspector A reported an EGREGIOUS event; reviewer B exists."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "RB5 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-RB5A", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_a: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Sue Supervisor", badge_number: "B-RB5B", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_b: $.data.id }
            - call: "POST /inspection/humane-handling-events"
              payload: { establishment_id: "${est_id}", reported_by_inspector_id: "${insp_a}", species: "CATTLE", severity: "NON_EGREGIOUS", observed_at: "2026-08-31T06:00:00Z", description: "prod usage observation" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /inspection/humane-handling-events/${ev1}/confirm"
              as: SupervisoryReviewer
              as_user_id: "${insp_a}"
              captures: { err_sod: $.data.error_id }
            - call: "POST /inspection/humane-handling-events/${ev1}/confirm"
              as: SupervisoryReviewer
              as_user_id: "${insp_b}"
          assert:
            - "reporter as confirmer: response status 403 and err_sod == ERR_SOD_REVIEWER_IS_ISSUER"
            - "peer reviewer: response status 200 and HumaneHandlingEvent.${ev1}.status == CONFIRMED"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_version_increments_on_successful_enforcement_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enforcement-create-stale-establishment]
          - entities.Establishment
        distinguishing_aspect: "The OCC parent version actually advances on the guarded write: version captured before the create is exactly one less than the version after, which is what makes the next same-version create stale."
        test_recipe:
          setup: ["Clock default. Establishment registered (grant not required for WITHHOLD_MARKS eligibility) with one OPEN SANITATION NR; version captured before and after a WITHHOLD_MARKS create."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "CL1 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-CL1", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "SANITATION", description: "qualifying nr", observed_at: "2026-08-31T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /inspection/establishments/${est_id}/enforcement-actions"
              payload: { action_type: "WITHHOLD_MARKS", basis: "NR_LINKAGE", regulation_family: "SANITATION", expected_establishment_version: "${v_pre}" }
              as: DistrictManager
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
              captures: { v_post: $.data.version }
          assert:
            - "the create returns 201"
            - "captured v_post == v_pre + 1 (version advances by exactly one on the guarded write)"

      - name: suspension_then_lift_restores_held_labels_without_drift
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LabelApplication.UNDER_REVIEW_to_HELD
          - state_machines.LabelApplication.HELD_to_UNDER_REVIEW
          - state_machines.EnforcementAction.IN_EFFECT_to_LIFTED
        distinguishing_aspect: "Compensation on the cascade: lift returns HELD labels to UNDER_REVIEW (their pre-hold status), so the suspension+lift pair leaves the label pipeline with zero drift."
        test_recipe:
          setup: ["Clock default. Establishment granted with a label UNDER_REVIEW; establishment suspended via egregious confirm (label HELD); suspension then lifted."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "CL2 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
            - call: "POST /inspection/grant-applications"
              payload: { establishment_id: "${est_id}", facility_doc_ref: "doc-fac-1", sanitation_plan_ref: "doc-san-1", haccp_plan_ref: "doc-hac-1" }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { ga_id: $.data.id }
            - call: "POST /inspection/grant-applications/${ga_id}/begin-review"
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "FACILITY", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "SANITATION", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/record-adequacy"
              payload: { dimension: "HACCP", finding: "ADEQUATE" }
              as: DistrictManager
            - call: "POST /inspection/grant-applications/${ga_id}/decide"
              payload: { decision: "GRANT" }
              as: DistrictManager
            - call: "POST /inspection/label-applications"
              payload: { establishment_id: "${est_id}", product_name: "NoAbx Loin", label_claim: "NO_ANTIBIOTICS", documentation_refs: ["doc-n1", "doc-n2"] }
              as: EstablishmentManager
              as_user_id: "${est_id}"
              captures: { la_id: $.data.id }
            - call: "POST /inspection/label-applications/${la_id}/begin-review"
              as: LabelOfficer
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Ina Inspector", badge_number: "B-CL2A", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_a: $.data.id }
            - call: "POST /inspection/inspectors"
              payload: { full_name: "Sue Supervisor", badge_number: "B-CL2B", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_b: $.data.id }
            - call: "POST /inspection/humane-handling-events"
              payload: { establishment_id: "${est_id}", reported_by_inspector_id: "${insp_a}", species: "CATTLE", severity: "EGREGIOUS", observed_at: "2026-09-01T06:00:00Z", description: "egregious rail event" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { ev1: $.data.id }
            - call: "POST /inspection/humane-handling-events/${ev1}/confirm"
              as: SupervisoryReviewer
              as_user_id: "${insp_b}"
            - call: "GET /inspection/establishments/${est_id}/label-applications"
              as: LabelOfficer
              captures: { la_held: "$.data[0].status" }
            - call: "GET /inspection/establishments/${est_id}/enforcement-actions"
              as: DistrictManager
              captures: { ea1: "$.data[0].id" }
          trigger:
            - call: "POST /inspection/enforcement-actions/${ea1}/lift"
              payload: { abatement_evidence: "abatement verified by district office" }
              as: DistrictManager
          assert:
            - "captured la_held == HELD (suspension cascade reached the label)"
            - "after lift: GET /inspection/establishments/${est_id}/label-applications shows the label back at UNDER_REVIEW"
            - "Establishment.${est_id}.inspection_status == ACTIVE and suspension_count == 1"

