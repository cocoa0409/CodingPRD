              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "PASS" }
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "GET /license-applications/${la_id}/zoning-reviews"
              as: ZoningOfficer
              as_user_id: "zone-1"
              captures: { zr_id: $.data.0.id }
            - call: "POST /zoning-reviews/${zr_id}/decide"
              payload: { decision: "CLEAR" }
              as: ZoningOfficer
              as_user_id: "zone-1"
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /license-applications/${la_id}/open-protest-period"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Director
            - call: "POST /license-applications/${la_id}/approve"
              as: Director
              as_user_id: "dir-1"
            - call: "POST /license-applications/${la_id}/pay-fee"
              payload: { amount_cents: 110000 }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "POST /license-applications/${la_id}/issue"
              as: Director
              as_user_id: "dir-1"
            - call: "GET /licenses"
              payload: { application_id: "${la_id}" }
              as: Director
              as_user_id: "dir-1"
              captures: { lic_id: $.data.0.id }
            - call: "POST /violations"
              payload: { license_id: "${lic_id}", severity: "SERIOUS" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { vio1_id: $.data.id }
            - call: "POST /violations/${vio1_id}/sustain"
              payload: { action_type: "FINE" }
              as: AdjudicationOfficer
              as_user_id: "adj-1"
            - call: "POST /violations"
              payload: { license_id: "${lic_id}", severity: "EGREGIOUS" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { vio2_id: $.data.id }
          trigger:
            - call: "POST /violations/${vio2_id}/sustain"
              payload: { action_type: "SUSPENSION", suspension_days: 10 }
              as: AdjudicationOfficer
              as_user_id: "adj-1"
              captures: { act2_id: $.data.action_id }
          assert:
            - "AdministrativeAction.${act2_id}.fine_cents == 150000"
            - "License.${lic_id}.demerit_points == 10"
            - "License.${lic_id}.outstanding_fine_cents == 225000"

      - name: fee_rounding_order_per_component_vs_sum_then_round
        grounds:
          - calculations.fee_assessment
          - entities.LicenseApplication.fields.fee_quoted_cents
          - entities.LicenseClass.fields.base_fee_cents
          - state_machines.LicenseApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): a non-quota MANUFACTURER class with requires_zoning=true and
          base_fee_cents=50006 produces fee_quoted_cents == 67509 under the PINNED
          per-component rounding order (round each surcharge first: 5001 + 12502,
          then sum), whereas the forbidden sum-then-round order (round(50006*0.35))
          gives 67508 — a 1-cent divergence that the pinned order resolves.
        test_recipe:
          setup:
            - "MFR_X class: base_fee_cents=50006, premise_type=MANUFACTURER, requires_zoning=true, quota_managed=false, renewal_cycle_months=12, max_servers=0."
            - "A DRAFT application for MFR_X by a non-disqualified applicant; no quota slot (quota_managed=false)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "MFR_X", premise_type: "MANUFACTURER", quota_managed: false, base_fee_cents: 50006, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 0 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
            - call: "POST /applicants"
              payload: { legal_name: "Brewery Co" }
              as: Director
              captures: { app_owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${app_owner_id}", region_code: "CTY_LA", street_address: "9 Hop Way", distance_to_school_m: 50, zoning_district: "INDUSTRIAL" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${app_owner_id}", premise_id: "${prem_id}", license_class_code: "MFR_X" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { la_id: $.data.id }
          trigger:
            - call: "POST /license-applications/${la_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { quoted: $.data.fee_quoted_cents }
          assert:
            - "LicenseApplication.${la_id}.fee_quoted_cents == 67509"
            - "LicenseApplication.${la_id}.status == SUBMITTED"

      - name: excise_circular_rebate_keyed_on_excise_tier_evaluation_order
        grounds:
          - calculations.excise_assessment
          - entities.ComplianceReport.fields.excise_due_cents
          - entities.ComplianceReport.fields.gross_sales_cents
          - entities.ComplianceReport.fields.tier
        distinguishing_aspect: |
          Mode (c): the rebate is keyed on the EXCISE tier (not on gross_sales),
          a circular-looking dependency resolved by the pinned order (excise first,
          then rebate-tier from excise, then SUPPLIER double rebate). For
          gross_sales_cents=6000000, tier=SUPPLIER: excise=240000, rebate_base=24000,
          doubled to 48000, excise_due_cents == 192000.
        test_recipe:
          setup:
            - "An ISSUED License lic_id (ACTIVE) under class ON_47 for the SUPPLIER's reporting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { app_owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${app_owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${app_owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "GET /license-applications/${la_id}/background-checks"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "PASS" }
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "GET /license-applications/${la_id}/zoning-reviews"
              as: ZoningOfficer
              as_user_id: "zone-1"
              captures: { zr_id: $.data.0.id }
            - call: "POST /zoning-reviews/${zr_id}/decide"
              payload: { decision: "CLEAR" }
              as: ZoningOfficer
              as_user_id: "zone-1"
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /license-applications/${la_id}/open-protest-period"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Director
            - call: "POST /license-applications/${la_id}/approve"
              as: Director
