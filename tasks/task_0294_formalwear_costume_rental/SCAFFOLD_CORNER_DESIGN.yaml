# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Formalwear & Costume Rental — breadth probe. Walks references/claim-extraction-
# guide.md against SCAFFOLD.yaml §1.1–§1.7. Every test_recipe chain is executable
# from empty-DB using only §1.5 endpoints; excluded_because stubs cite §1.8 names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_catalog_returns_201_with_all_fields
        claim_type: Creation
        grounds: ["entities.Catalog", "endpoints"]
        distinguishing_aspect: "POST /catalogs with all required fields returns 201 and echoes style_name, category, rate fields; active_unit_count initialized to 0 and version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /catalogs"
              payload: { style_name: "Tux Z", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 1, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id, auc: $.data.active_unit_count, ver: $.data.version }
          assert:
            - "response code == 201"
            - "Catalog.${cat_id}.style_name == Tux Z"
            - "Catalog.${cat_id}.active_unit_count == 0"
            - "Catalog.${cat_id}.version == 1"

      - name: get_catalog_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Catalog", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /catalogs/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "GET /catalogs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_catalog_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Catalog", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /catalogs omitting daily_rate_cents (source:input, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /catalogs"
              payload: { style_name: "Tux NoRate", category: "FORMALWEAR", deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 1, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_catalog_invalid_enum_category_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Catalog.fields.category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /catalogs with category not in {FORMALWEAR, COSTUME} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /catalogs"
              payload: { style_name: "Bad Cat", category: "SPORTSWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 1, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_customer_duplicate_email_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Customer.fields.email", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /customers with an email already used by another customer returns ERR_INVALID_REQUEST (422) — email uniqueness."
        test_recipe:
          setup: ["One existing customer with email dup@x.com."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { full_name: "First", email: "dup@x.com" }
              as: StoreClerk
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Second", email: "dup@x.com" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: garment_unit_system_fields_ignored_input_on_create
        claim_type: System Fields
        grounds: ["entities.GarmentUnit.fields.status", "entities.GarmentUnit.fields.condition_grade"]
        distinguishing_aspect: "POST /garment-units only accepts catalog_id + size_code; status defaults AVAILABLE and condition_grade GRADE_A regardless of any client attempt."
        test_recipe:
          setup: ["A catalog exists."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux Y", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 1, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "L" }
              as: StoreManager
              captures: { unit_id: $.data.id, st: $.data.status, cg: $.data.condition_grade }
          assert:
            - "GarmentUnit.${unit_id}.status == AVAILABLE"
            - "GarmentUnit.${unit_id}.condition_grade == GRADE_A"
            - "GarmentUnit.${unit_id}.damage_strike_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_already_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Reservation.PENDING_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a Reservation already in CONFIRMED returns ERR_INVALID_STATE (409); no second unit allocated."
        test_recipe:
          setup: ["A confirmed reservation."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux X", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Uma A", email: "uma@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Reservation.${resv_id}.status == CONFIRMED"

      - name: pickup_from_pending_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Reservation.CONFIRMED_to_PICKED_UP", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pickup attempted on a PENDING reservation (never confirmed) returns ERR_INVALID_STATE (409) — pickup is only defined from CONFIRMED."
        test_recipe:
          setup: ["A PENDING reservation that was never confirmed."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux W", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Val B", email: "val@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Reservation.${resv_id}.status == PENDING"

      - name: cancel_from_settled_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Reservation", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SETTLED (terminal) reservation rejects cancel with ERR_INVALID_STATE (409); no transition out of terminal."
        test_recipe:
          setup: ["A fully settled standalone reservation (RETURNED clean then finalized)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux V", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Wes C", email: "wes@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 100, waist_cm: 84, inseam_cm: 80 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T17:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/return"
              payload: { returned_at_iso: "2026-09-03T12:00:00Z", disposition: "CLEAN" }
              as: StoreClerk
              captures: { settlement_id: $.data.id }
            - call: "POST /settlements/${settlement_id}/finalize"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "Reservation.${resv_id}.status == SETTLED"
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: new_reservation_starts_in_pending
        claim_type: Initial State
        grounds: ["state_machines.Reservation", "entities.Reservation.fields.status"]
        distinguishing_aspect: "A freshly created reservation has status PENDING and garment_unit_id null (no unit allocated until confirm)."
        test_recipe:
          setup: ["A catalog and customer exist."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux U", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Xan D", email: "xan@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id, st: $.data.status }
          assert:
            - "response code == 201"
            - "Reservation.${resv_id}.status == PENDING"
            - "Reservation.${resv_id}.garment_unit_id is null"

      - name: alteration_complete_from_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Alteration.REQUESTED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an Alteration already CANCELLED returns ERR_INVALID_STATE (409); no fee charged."
        test_recipe:
          setup: ["A confirmed reservation with an alteration that was cancelled."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux T", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Yui E", email: "yui@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /alterations"
              payload: { reservation_id: "${resv_id}", kind: "HEM", fee_cents: 4000 }
              as: StoreClerk
              captures: { alt_id: $.data.id }
            - call: "POST /alterations/${alt_id}/cancel"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /alterations/${alt_id}/complete"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "Alteration.${alt_id}.status == CANCELLED"
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Customer.${cust_id}.balance_owed_cents == 0"

  # ===========================================================================
  - section: validations
    instances:
      - name: reservation_window_incoherent_returns_invalid_window
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "POST /reservations with pickup_window_start AFTER return_window_end returns ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["A catalog and customer exist."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux S", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Zoe F", email: "zoe@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-05T09:00:00Z", return_window_end_iso: "2026-09-01T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_WINDOW"

      - name: pickup_fit_fail_returns_fit_not_cleared
        claim_type: Cross-entity validation
        grounds: ["validations[priority=11]", "errors[ERR_FIT_NOT_CLEARED]", "calculations.fit_verdict"]
        distinguishing_aspect: "Pickup with a FitCheck verdict FAIL (>=2 sizes off) returns ERR_FIT_NOT_CLEARED (409); a FAIL fit never clears even with no pending alteration."
        test_recipe:
          setup: ["A confirmed size-XS reservation but the customer's measurements recommend L (delta 3 -> FAIL)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux R", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "XS" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Abe G", email: "abe@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 110, waist_cm: 96, inseam_cm: 84 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "XS", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
              captures: { verdict: $.data.verdict }
          trigger:
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "FitCheck verdict == FAIL"                            # recommended L (chest 110) vs requested XS, delta 3
            - "response code == 409"
            - "error_id == ERR_FIT_NOT_CLEARED"
            - "Reservation.${resv_id}.status == CONFIRMED"

      - name: fit_needs_alteration_cleared_by_completed_alteration
        claim_type: Conditional validation
        grounds: ["calculations.fit_verdict", "validations[priority=11]", "state_machines.Alteration.REQUESTED_to_COMPLETED"]
        distinguishing_aspect: "A NEEDS_ALTERATION verdict (delta 1) blocks pickup until a COMPLETED alteration exists; after completing one (fee 0 keeps balance 0), pickup succeeds."
        test_recipe:
          setup: ["A confirmed size-M reservation whose customer measures to L (delta 1 -> NEEDS_ALTERATION); a completed alteration clears the gate."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux Q2", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Bea H", email: "bea@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 110, waist_cm: 92, inseam_cm: 84 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
              captures: { verdict: $.data.verdict }
            - call: "POST /alterations"
              payload: { reservation_id: "${resv_id}", kind: "LET_OUT", fee_cents: 0 }
              as: StoreClerk
