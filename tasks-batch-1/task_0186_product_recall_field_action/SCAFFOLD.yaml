# =============================================================================
# Product Recall & Field Action — PRD Benchmark Scaffold (Expert)
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys here)
# =============================================================================

scenario: |
  Product Recall & Field Action: affected lot/serial identification, recall
  classification (Class I/II/III), customer notification cascade,
  return/replace/refund disposition, FDA/CPSC reporting, effectiveness check,
  quarantine hold

domain_name: product-recall-field-action
api_prefix: ""   # flat topology: every entity is a sibling root collection (/products, /lots, /recalls, ...); no shared path prefix

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys (no nested URL paths). Recall,
  # Lot, Unit, Customer, Notification, Disposition, QuarantineHold,
  # RegulatoryReport, EffectivenessCheck are all top-level collections joined by
  # FK fields carried in request bodies and resolvable via filtered-list GETs.

  state_machine_shape: branching
  # Recall: branching with revert (DRAFT -> CLASSIFIED -> ANNOUNCED -> MONITORING
  #   -> {EFFECTIVE | TERMINATED}, plus CLASSIFIED -> DRAFT reclassification loop).
  # Disposition: parallel state dimensions (logistics_status x financial_status
  #   evolve independently on one row).
  # QuarantineHold: cyclic (ACTIVE -> LIFTED -> ACTIVE re-imposition loop).
  # Notification / RegulatoryReport / EffectivenessCheck: guarded linear.

  relationship_patterns:
    - one_to_many        # Recall -> Notification, Recall -> RegulatoryReport
    - many_to_many       # Recall <-> Lot via AffectedLot junction
    - cross_aggregate    # Disposition references both Unit and Recall

  role_model: segregation_of_duties
  # RecallCoordinator opens & classifies; QualityOfficer approves classification
  # and signs regulatory reports; the SAME user may not both classify AND
  # approve the same recall (4-eyes). FieldServiceAgent records dispositions;
  # FinanceClerk settles refunds. PlatformAdmin holds opaque operator surface.

  consistency_model: immediate
  # All cascades (quarantine, notification fan-out, disposition reconciliation,
  # effectiveness recompute) settle synchronously within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer SKU; unique across all Products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: regulator, type: enum, source: input, description: "Governing regulator", constraints: "one of FDA | CPSC" }
      - { name: unit_list_price_cents, type: integer, source: input, description: "List price per unit in cents; > 0", constraints: ">= 1" }
      - { name: active_recall_id, type: string, source: computed, description: "id of the Recall currently in a non-terminal state for this Product, else null; at most one at a time" }

  # ---------------------------------------------------------------------------
  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the manufactured product" }
      - { name: lot_code, type: string, source: input, description: "Lot/batch code; unique per product_id" }
      - { name: serial_start, type: integer, source: input, description: "First serial number in this lot's contiguous range (inclusive); >= 1", constraints: ">= 1" }
      - { name: serial_end, type: integer, source: input, description: "Last serial number in this lot's contiguous range (inclusive); >= serial_start", constraints: ">= serial_start" }
      - { name: manufactured_units, type: integer, source: computed, description: "= serial_end - serial_start + 1; total serials in range" }
      - { name: quarantine_status, type: enum, source: computed, description: "RELEASED | HELD — RELEASED unless an ACTIVE QuarantineHold targets this Lot", default: "RELEASED", constraints: "RELEASED | HELD" }

  # ---------------------------------------------------------------------------
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot this unit belongs to" }
      - { name: serial_number, type: integer, source: input, description: "Serial number; MUST fall within the lot's [serial_start, serial_end] range; unique per lot_id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; current owner/registrant of this unit" }
      - { name: sale_price_cents, type: integer, source: input, description: "Actual price the customer paid for this unit in cents; >= 0", constraints: ">= 0" }
      - { name: affected, type: boolean, source: computed, description: "true when this Unit's lot_id is in the active Recall's affected-lot set and serial_number is within the recall's serial filter; else false", default: false }

  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer or account name" }
      - { name: contact_channel, type: enum, source: input, description: "Preferred channel", constraints: "EMAIL | SMS | MAIL" }
      - { name: contact_address, type: string, source: input, description: "Email, phone, or postal address per channel" }
      - { name: reachable, type: boolean, source: input, description: "Whether contact_address is currently deliverable", default: true }

  # ---------------------------------------------------------------------------
  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the recalled product" }
      - { name: reason, type: string, source: input, description: "Free-text hazard description" }
      - { name: hazard_severity, type: enum, source: input, description: "Operator-assessed health hazard tier", constraints: "SERIOUS | TEMPORARY | MINOR" }
      - { name: injury_reported, type: boolean, source: input, description: "Whether any injury/death has been reported for the hazard", default: false }
      - { name: serial_filter_start, type: integer, source: input, description: "Lower bound (inclusive) of affected serials across affected lots; null means no lower bound" }
      - { name: serial_filter_end, type: integer, source: input, description: "Upper bound (inclusive) of affected serials; null means no upper bound" }
      - { name: classification, type: enum, source: computed, description: "Class I | Class II | Class III — derived at CLASSIFIED transition from hazard_severity + injury_reported", constraints: "CLASS_I | CLASS_II | CLASS_III" }
      - { name: classified_by_user_id, type: string, source: system, description: "X-User-ID of the RecallCoordinator who performed the CLASSIFIED transition; used for 4-eyes segregation" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the QualityOfficer who approved classification at ANNOUNCED; MUST differ from classified_by_user_id" }
      - { name: status, type: enum, source: system, description: "DRAFT | CLASSIFIED | ANNOUNCED | MONITORING | EFFECTIVE | TERMINATED", constraints: "DRAFT | CLASSIFIED | ANNOUNCED | MONITORING | EFFECTIVE | TERMINATED" }
      - { name: notification_deadline_hours, type: integer, source: computed, description: "Regulator-mandated customer-notification window in hours, derived from classification" }
      - { name: affected_unit_count, type: integer, source: computed, description: "count of Units whose affected flag is true under this recall" }
      - { name: recovered_unit_count, type: integer, source: computed, description: "count of affected Units whose Disposition.logistics_status is RETURNED or REPLACED" }
      - { name: effectiveness_pct, type: number, source: computed, description: "recovered_unit_count / affected_unit_count * 100, 2 dp; 0 when affected_unit_count == 0" }
      - { name: total_refund_cents, type: integer, source: computed, description: "sum of settled refund amounts across this recall's Dispositions whose financial_status is REFUNDED" }

  # ---------------------------------------------------------------------------
  - name: AffectedLot
    parent: null
    common_fields: false
    fields:
      - { name: recall_id, type: string, source: input, description: "FK -> Recall.id; the recall this membership belongs to" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot declared affected by the recall" }
      - { name: unit_count_snapshot, type: integer, source: computed, description: "Lot.manufactured_units captured at the moment of affected-lot creation" }

  # ---------------------------------------------------------------------------
  - name: QuarantineHold
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: input, description: "FK -> Recall.id; recall that justifies the hold" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot placed on quarantine hold" }
      - { name: reason, type: string, source: input, description: "Operator reason for the hold" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED — re-imposition allowed (LIFTED -> ACTIVE)", constraints: "ACTIVE | LIFTED" }
      - { name: lifted_count, type: integer, source: computed, description: "number of times this hold has transitioned ACTIVE -> LIFTED", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Notification
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: input, description: "FK -> Recall.id; the recall being announced" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the addressee" }
      - { name: channel, type: enum, source: computed, description: "Snapshot of Customer.contact_channel at send time", constraints: "EMAIL | SMS | MAIL" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | ACKNOWLEDGED | FAILED", constraints: "QUEUED | SENT | ACKNOWLEDGED | FAILED" }
      - { name: attempt_count, type: integer, source: computed, description: "number of send attempts; increments on each (re)send", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Disposition
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: input, description: "FK -> Recall.id; the recall this disposition resolves" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the affected unit being dispositioned" }
      - { name: disposition_type, type: enum, source: input, description: "How the unit is resolved", constraints: "RETURN | REPLACE | REFUND" }
      - { name: logistics_status, type: enum, source: system, description: "Logistics dimension: PENDING | RETURNED | REPLACED | CANCELLED (parallel to financial_status)", constraints: "PENDING | RETURNED | REPLACED | CANCELLED" }
      - { name: financial_status, type: enum, source: system, description: "Finance dimension: NOT_OWED | OWED | REFUNDED | VOID (parallel to logistics_status)", constraints: "NOT_OWED | OWED | REFUNDED | VOID" }
      - { name: refund_basis, type: enum, source: input, description: "Which price basis to refund", default: "SALE_PRICE", constraints: "SALE_PRICE | LIST_PRICE" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Settled refund amount in cents, fixed at the REFUNDED transition; 0 until then" }

  # ---------------------------------------------------------------------------
  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: input, description: "FK -> Recall.id; the recall reported" }
      - { name: agency, type: enum, source: computed, description: "Snapshot of the recalled Product.regulator at filing time", constraints: "FDA | CPSC" }
      - { name: report_kind, type: enum, source: input, description: "INITIAL (24h/15-day filing) | FOLLOWUP (periodic status) | FINAL (termination)", constraints: "INITIAL | FOLLOWUP | FINAL" }
      - { name: filed_within_deadline, type: boolean, source: computed, description: "true when an INITIAL report is filed within the regulator deadline window for the recall classification" }
      - { name: status, type: enum, source: system, description: "DRAFTED | SUBMITTED | ACKNOWLEDGED", constraints: "DRAFTED | SUBMITTED | ACKNOWLEDGED" }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of the QualityOfficer who SUBMITTED the report" }

  # ---------------------------------------------------------------------------
  - name: EffectivenessCheck
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: input, description: "FK -> Recall.id; the recall being audited for effectiveness" }
      - { name: target_pct, type: number, source: computed, description: "Required effectiveness threshold from effectiveness_target_rule: CLASS_I=90, CLASS_II=60, CLASS_III=30" }
      - { name: measured_pct, type: number, source: computed, description: "Snapshot of Recall.effectiveness_pct at the moment this check is recorded, 2 dp" }
      - { name: outcome, type: enum, source: computed, description: "PASS when measured_pct >= target_pct, else FAIL", constraints: "PASS | FAIL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Recall
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: CLASSIFIED
        trigger: "POST /recalls/{id}/classify"
        actor: RecallCoordinator
        preconditions:
          - "Recall has at least one AffectedLot (ERR_NO_AFFECTED_LOTS)"
          - "serial_filter_start, when present, <= serial_filter_end (ERR_INVALID_SERIAL_FILTER)"
        side_effects:
          - "Run classification_rule: set classification from hazard_severity + injury_reported"
          - "Run notification_window_rule: set notification_deadline_hours from classification"
          - "Set classified_by_user_id = acting X-User-ID"
          - "Recompute affected flag on every Unit in the recall's affected lots (affected_unit_recompute)"
          - "Recompute Recall.affected_unit_count, effectiveness_pct"
          - "Set Product.active_recall_id = this recall id"

      - from: CLASSIFIED
        to: DRAFT
        trigger: "POST /recalls/{id}/reclassify"
        actor: RecallCoordinator
        preconditions:
          - "No RegulatoryReport for this recall is SUBMITTED or ACKNOWLEDGED (ERR_REPORT_ALREADY_FILED)"
        side_effects:
          - "Clear classification, notification_deadline_hours, classified_by_user_id"
          - "Recompute affected flag on every Unit in the recall's affected lots"
        note: "Reclassification loop (cyclic): coordinator may revise scope/severity then re-classify."

      - from: CLASSIFIED
        to: ANNOUNCED
        trigger: "POST /recalls/{id}/announce"
        actor: QualityOfficer
        preconditions:
          - "Acting X-User-ID != classified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "At least one INITIAL RegulatoryReport exists for this recall in SUBMITTED or ACKNOWLEDGED (ERR_INITIAL_REPORT_REQUIRED)"
        side_effects:
          - "Set approved_by_user_id = acting X-User-ID"
          - "CASCADE hop 1: Recall ANNOUNCED creates one ACTIVE QuarantineHold per affected lot lacking one (quarantine_cascade)"
          - "CASCADE hop 2: each newly-ACTIVE QuarantineHold drives its target Lot.quarantine_status to HELD (the Lot status change is caused by the hold's ACTIVE state, not directly by the recall) "
          - "Fan out one QUEUED Notification per distinct Customer owning an affected Unit (notification_fanout)"

      - from: ANNOUNCED
        to: MONITORING
        trigger: "POST /recalls/{id}/begin-monitoring"
        actor: RecallCoordinator
        preconditions:
          - "Every Notification for this recall is in SENT, ACKNOWLEDGED, or FAILED (no QUEUED remaining) (ERR_NOTIFICATIONS_PENDING)"
        side_effects:
          - "Recall enters MONITORING; effectiveness checks may now be recorded"

      - from: MONITORING
        to: EFFECTIVE
        trigger: "POST /recalls/{id}/terminate"
        actor: QualityOfficer
        preconditions:
          - "Latest EffectivenessCheck for this recall has outcome PASS (ERR_EFFECTIVENESS_NOT_MET)"
          - "A FINAL RegulatoryReport for this recall is SUBMITTED or ACKNOWLEDGED (ERR_FINAL_REPORT_REQUIRED)"
        side_effects:
          - "Lift every ACTIVE QuarantineHold on this recall's affected lots (quarantine_release_cascade)"
          - "Recompute each released Lot.quarantine_status to RELEASED"
          - "Clear Product.active_recall_id"
        note: "Successful close: effectiveness target met."

      - from: MONITORING
        to: TERMINATED
        trigger: "POST /recalls/{id}/terminate"
        actor: QualityOfficer
        preconditions:
          - "A FINAL RegulatoryReport for this recall is SUBMITTED or ACKNOWLEDGED (ERR_FINAL_REPORT_REQUIRED)"
          - "request body force_terminate == true (administrative close without meeting effectiveness) (ERR_EFFECTIVENESS_NOT_MET when force_terminate is false and latest check FAILs)"
        side_effects:
          - "Lift every ACTIVE QuarantineHold on this recall's affected lots (quarantine_release_cascade)"
          - "Recompute each released Lot.quarantine_status to RELEASED"
          - "Clear Product.active_recall_id"
        note: "Administrative termination branch (force_terminate=true) diverges from the EFFECTIVE branch: TERMINATED records an unmet effectiveness close."

  # ---------------------------------------------------------------------------
  - entity: QuarantineHold
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /quarantine-holds/{id}/lift"
        actor: RecallCoordinator
        preconditions:
          - "Owning Recall.status is MONITORING, EFFECTIVE, or TERMINATED (ERR_HOLD_LOCKED_BY_RECALL)"
        side_effects:
          - "Increment lifted_count by 1"
          - "Recompute target Lot.quarantine_status: HELD if any OTHER ACTIVE hold remains on the lot, else RELEASED"

      - from: LIFTED
        to: ACTIVE
        trigger: "POST /quarantine-holds/{id}/reimpose"
        actor: RecallCoordinator
        preconditions:
          - "Owning Recall.status is not TERMINATED and not EFFECTIVE (ERR_HOLD_LOCKED_BY_RECALL)"
        side_effects:
          - "Recompute target Lot.quarantine_status to HELD"
        note: "Cyclic re-imposition loop (LIFTED -> ACTIVE)."

  # ---------------------------------------------------------------------------
  - entity: Notification
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, FAILED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /notifications/{id}/send"
        actor: PlatformAdmin
        preconditions:
          - "Addressee Customer.reachable == true (else send fails) (ERR_CUSTOMER_UNREACHABLE)"
        side_effects:
          - "Increment attempt_count by 1"
          - "Snapshot channel = Customer.contact_channel"

      - from: QUEUED
        to: FAILED
        trigger: "POST /notifications/{id}/send"
        actor: PlatformAdmin
        preconditions:
          - "Addressee Customer.reachable == false"
        side_effects:
          - "Increment attempt_count by 1"
        note: "Branch on Customer.reachable: a single send trigger forks to SENT or FAILED."

      - from: FAILED
        to: SENT
        trigger: "POST /notifications/{id}/send"
        actor: PlatformAdmin
        preconditions:
          - "Addressee Customer.reachable == true (ERR_CUSTOMER_UNREACHABLE)"
        side_effects:
          - "Increment attempt_count by 1"
          - "Snapshot channel = Customer.contact_channel"
        note: "Retry after a failed attempt once the customer becomes reachable."

      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /notifications/{id}/acknowledge"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Notification terminal; counts toward notification-complete gating"

  # ---------------------------------------------------------------------------
  - entity: Disposition
    initial_state: PENDING
    terminal_states: []
    # PARALLEL state dimensions on one row: logistics_status x financial_status.
    # logistics_status: PENDING -> {RETURNED | REPLACED | CANCELLED}
    # financial_status: {NOT_OWED | OWED} -> {REFUNDED | VOID}
    transitions:
      # --- logistics dimension ---
      - from: "logistics:PENDING"
        to: "logistics:RETURNED"
        trigger: "POST /dispositions/{id}/receive-return"
        actor: FieldServiceAgent
        preconditions:
          - "disposition_type in {RETURN, REFUND} (ERR_DISPOSITION_TYPE_MISMATCH)"
          - "Owning Recall.status in {ANNOUNCED, MONITORING} (ERR_RECALL_NOT_OPEN_FOR_DISPOSITION)"
        side_effects:
          - "Recompute Recall.recovered_unit_count and effectiveness_pct (effectiveness_recompute)"

      - from: "logistics:PENDING"
        to: "logistics:REPLACED"
        trigger: "POST /dispositions/{id}/ship-replacement"
        actor: FieldServiceAgent
        preconditions:
          - "disposition_type == REPLACE (ERR_DISPOSITION_TYPE_MISMATCH)"
          - "Owning Recall.status in {ANNOUNCED, MONITORING} (ERR_RECALL_NOT_OPEN_FOR_DISPOSITION)"
        side_effects:
          - "Recompute Recall.recovered_unit_count and effectiveness_pct (effectiveness_recompute)"

      - from: "logistics:PENDING"
        to: "logistics:CANCELLED"
        trigger: "POST /dispositions/{id}/cancel"
        actor: FieldServiceAgent
        preconditions:
          - "financial_status != REFUNDED (ERR_DISPOSITION_ALREADY_REFUNDED)"
        side_effects:
          - "If financial_status == OWED, set financial_status = VOID"
          - "Recompute Recall.recovered_unit_count and effectiveness_pct"

      # --- financial dimension ---
      - from: "financial:NOT_OWED"
        to: "financial:OWED"
        trigger: "POST /dispositions/{id}/accrue-refund"
        actor: FinanceClerk
        preconditions:
          - "disposition_type == REFUND (ERR_DISPOSITION_TYPE_MISMATCH)"
          - "logistics_status == RETURNED (ERR_RETURN_NOT_RECEIVED)"
        side_effects:
          - "financial_status moves NOT_OWED -> OWED"

      - from: "financial:OWED"
        to: "financial:REFUNDED"
        trigger: "POST /dispositions/{id}/settle-refund"
        actor: FinanceClerk
        preconditions:
          - "logistics_status == RETURNED (ERR_RETURN_NOT_RECEIVED)"
        side_effects:
          - "Run refund_amount_rule: fix refund_amount_cents from refund_basis"
          - "Recompute Recall.total_refund_cents (refund_ledger_recompute)"

  # ---------------------------------------------------------------------------
  - entity: RegulatoryReport
    initial_state: DRAFTED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFTED
        to: SUBMITTED
        trigger: "POST /regulatory-reports/{id}/submit"
        actor: QualityOfficer
        preconditions:
          - "Owning Recall.status is not DRAFT (classification must exist before filing) (ERR_RECALL_NOT_CLASSIFIED)"
        side_effects:
          - "Set signed_by_user_id = acting X-User-ID"
          - "Snapshot agency = recalled Product.regulator"
          - "If report_kind == INITIAL, run deadline_rule: set filed_within_deadline"

      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /regulatory-reports/{id}/acknowledge"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Report terminal"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — only sanctioned mechanism)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: affected-lot-add-stale-recall
    parent_entity: Recall
    write_endpoint: "POST /recalls/{id}/affected-lots"
    occ_field: "expected_recall_version"
    description: |
      Adding an AffectedLot to a Recall whose version has advanced since the
      client last observed it is rejected. A prior writer has already mutated
      the recall's affected-lot set (each add bumps Recall.version and recomputes
      affected_unit_count), so the current writer's view of the recall is stale
      and its add could double-count or contradict the prior scope edit.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: disposition-create-stale-recall
    parent_entity: Recall
    write_endpoint: "POST /dispositions"
    occ_field: "expected_recall_version"
    description: |
      Opening a Disposition against a Recall whose version has advanced since
      the client last read it is rejected. The recall's recovered/effectiveness
      counters and active_recall_id are recomputed by sibling disposition and
      lifecycle writes (each bumping Recall.version); a stale view may target a
      recall that has since moved past the disposition-open window.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant #1 (on Recall): classification ---------------------------
  - name: classification_rule
    trigger: "Recall DRAFT -> CLASSIFIED transition"
    algorithm: threshold
    formula: |
      # Hazard tier + injury history determine recall class.
      if hazard_severity == SERIOUS and injury_reported == true:
        classification = CLASS_I        # reasonable probability of serious harm/death
      elif hazard_severity == SERIOUS and injury_reported == false:
        classification = CLASS_II       # serious hazard but no injury yet -> remediable
      elif hazard_severity == TEMPORARY:
        classification = CLASS_II       # temporary/medically-reversible health consequence
      else:  # hazard_severity == MINOR
        classification = CLASS_III      # unlikely to cause adverse health consequence
    input_set: "Single Recall row; reads hazard_severity, injury_reported."
    constants: {}
    precision: "exact enum result"
    variants:
      - name: serious_with_injury
        when: "hazard_severity == SERIOUS and injury_reported == true"
        difference: "Escalates to CLASS_I; the injury_reported flag is the only differentiator between CLASS_I and CLASS_II at SERIOUS severity."
      - name: serious_without_injury
        when: "hazard_severity == SERIOUS and injury_reported == false"
        difference: "Same SERIOUS severity but stays CLASS_II — identical severity input, different class output driven solely by injury_reported."

  # --- Dual-variant #2 (on Disposition): refund amount basis ------------------
  - name: refund_amount_rule
    trigger: "Disposition financial OWED -> REFUNDED transition"
    algorithm: aggregation
    formula: |
      # Two valid refund bases produce different cents for the same unit.
      if refund_basis == SALE_PRICE:
        base_cents = Unit.sale_price_cents          # what the customer actually paid
      else:  # refund_basis == LIST_PRICE
        base_cents = Product.unit_list_price_cents   # current product list price
      # CLASS_I recalls add a 10% goodwill premium (regulator-encouraged for
      # serious hazards); other classes refund the base only.
      if Recall.classification == CLASS_I:
        refund_amount_cents = round_half_up(base_cents * 1.10)
      else:
        refund_amount_cents = base_cents
    input_set: "Single Disposition; reads its Unit.sale_price_cents, the Unit's lot's Product.unit_list_price_cents, and owning Recall.classification."
    constants: { CLASS_I_GOODWILL_MULTIPLIER: 1.10 }
    precision: "2 decimal places at cents granularity (integer cents), round_half_up"
    variants:
      - name: sale_price_basis
        when: "refund_basis == SALE_PRICE"
        difference: "Refunds the unit's actual paid price; diverges from list-price basis whenever sale_price_cents != unit_list_price_cents."
      - name: list_price_basis
        when: "refund_basis == LIST_PRICE"
        difference: "Refunds the product list price; identical inputs, different cents than SALE_PRICE whenever the unit sold at a discount or premium."

  # --- Combinatorial mode (a): notification window (>=3 inputs, branched) -----
  - name: notification_window_rule
    trigger: "Recall DRAFT -> CLASSIFIED transition (after classification_rule)"
    algorithm: threshold
    formula: |
      # Regulator-mandated customer notification deadline, in hours, depends on
      # THREE inputs interacting non-linearly: classification tier, regulator,
      # and injury_reported. CPSC fast-tracks injury cases regardless of class.
      if injury_reported == true and regulator == CPSC:
        notification_deadline_hours = 24
      elif classification == CLASS_I:
        notification_deadline_hours = 24
      elif classification == CLASS_II:
        notification_deadline_hours = 72 if regulator == FDA else 120
      else:  # CLASS_III
        notification_deadline_hours = 240
    input_set: "Single Recall; reads classification, the recalled Product.regulator, injury_reported."
    constants:
      CLASS_I_HOURS: 24
      CLASS_II_FDA_HOURS: 72
      CLASS_II_CPSC_HOURS: 120
      CLASS_III_HOURS: 240
      CPSC_INJURY_FASTTRACK_HOURS: 24
    precision: "integer hours"

  # --- Combinatorial mode (c): effectiveness with pinned evaluation order -----
  - name: effectiveness_recompute
    trigger: "Disposition logistics RETURNED/REPLACED/CANCELLED transitions; affected_unit_recompute"
    algorithm: aggregation
    formula: |
      # Circular-looking: effectiveness_pct depends on recovered_unit_count which
      # depends on the same Disposition set effectiveness gates. Evaluation order
      # is PINNED to break the cycle:
      #   step 1: affected_unit_count = count(Unit where affected == true)
      #   step 2: recovered_unit_count = count(Disposition d where
      #             d.recall_id == recall.id
      #             AND d.logistics_status IN {RETURNED, REPLACED}
      #             AND the dispositioned Unit.affected == true)
      #   step 3: if affected_unit_count == 0: effectiveness_pct = 0
      #           else: effectiveness_pct =
      #             round_half_up(recovered_unit_count / affected_unit_count * 100, 2)
      # CANCELLED dispositions never count as recovered.
    input_set: "All Units of the recall's affected lots (status filter affected==true); all Dispositions with recall_id == recall.id and logistics_status IN {RETURNED, REPLACED}."
    constants: {}
    precision: "effectiveness_pct: 2 decimal places, round_half_up; counts are integers"

  # --- Combinatorial mode (b): refund ledger, sum-then-nothing rounding order -
  - name: refund_ledger_recompute
    trigger: "Disposition financial OWED -> REFUNDED transition (settle-refund)"
    algorithm: aggregation
    formula: |
      # total_refund_cents is a sum over per-disposition integer-cent amounts.
      # Rounding order is PINNED: each Disposition.refund_amount_cents is rounded
      # to integer cents AT its own settle-refund (refund_amount_rule, round_half_up
      # PER LINE ITEM), THEN summed with no further rounding. "round-per-line then
      # sum" — never "sum the raw products then round" — so the goodwill premium
      # on CLASS_I lines rounds independently before aggregation.
      total_refund_cents = sum(
        d.refund_amount_cents
        for d in Disposition
        if d.recall_id == recall.id and d.financial_status == REFUNDED
      )
    input_set: "All Dispositions with recall_id == recall.id and financial_status == REFUNDED. Per-line rounding already applied at settle; aggregation is exact integer sum."
    constants: {}
    precision: "integer cents; per-line round_half_up already applied, aggregation exact"

  # --- Derived recompute: affected flag --------------------------------------
  - name: affected_unit_recompute
    trigger: "Recall classify/reclassify; AffectedLot add; Unit create"
    algorithm: aggregation
    formula: |
      for each Unit u whose lot_id is in {AffectedLot.lot_id where recall_id == recall.id}:
        in_lot = true
        within_filter =
          (recall.serial_filter_start is null or u.serial_number >= recall.serial_filter_start)
          and (recall.serial_filter_end is null or u.serial_number <= recall.serial_filter_end)
        u.affected = in_lot and within_filter and (recall.status != DRAFT)
      # Units outside affected lots are always affected=false.
    input_set: "Units whose lot_id is an affected lot of the recall; serial_filter bounds inclusive."
    constants: {}
    precision: "boolean"

  # --- Effectiveness target threshold per classification ----------------------
  - name: effectiveness_target_rule
    trigger: "EffectivenessCheck creation (POST /effectiveness-checks)"
    algorithm: threshold
    formula: |
      # Regulators expect higher recovery for more dangerous recalls.
      if Recall.classification == CLASS_I:
        target_pct = 90
      elif Recall.classification == CLASS_II:
        target_pct = 60
      else:  # CLASS_III
        target_pct = 30
      # outcome = PASS iff measured_pct >= target_pct  (>= boundary, inclusive)
      measured_pct = Recall.effectiveness_pct   # snapshot at check time
      outcome = PASS if measured_pct >= target_pct else FAIL
    input_set: "Single Recall classification + its current effectiveness_pct snapshot."
    constants:
      CLASS_I_TARGET_PCT: 90
      CLASS_II_TARGET_PCT: 60
      CLASS_III_TARGET_PCT: 30
    precision: "target_pct integer; measured_pct 2 dp; comparison uses >= (inclusive boundary)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body-referenced resource id resolves (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums valid, integers in declared ranges (e.g., serial_end >= serial_start, unit_list_price_cents >= 1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /recalls/{id}/affected-lots, POST /dispositions"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  # --- Domain business rules — SAFETY/COMPLIANCE precede FISCAL ---------------
  - priority: 7
    category: business_safety
    check: "Segregation of duties: the QualityOfficer announcing a recall must not be the user who classified it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /recalls/{id}/announce"

  - priority: 8
    category: business_safety
    check: "A recall cannot be announced without an INITIAL RegulatoryReport already SUBMITTED/ACKNOWLEDGED"
    error_id: ERR_INITIAL_REPORT_REQUIRED
    http_status: 409
    applies_to: "POST /recalls/{id}/announce"

  - priority: 9
    category: business_safety
    check: "A recall cannot terminate without a FINAL RegulatoryReport SUBMITTED/ACKNOWLEDGED"
    error_id: ERR_FINAL_REPORT_REQUIRED
    http_status: 409
    applies_to: "POST /recalls/{id}/terminate"

  - priority: 10
    category: business_safety
    check: "A QuarantineHold may not be lifted/reimposed while its owning Recall is in a state that locks holds (see hold state machine)"
    error_id: ERR_HOLD_LOCKED_BY_RECALL
    http_status: 409
    applies_to: "POST /quarantine-holds/{id}/lift, POST /quarantine-holds/{id}/reimpose"

  - priority: 11
    category: business_referential
    check: "A Recall must have >= 1 AffectedLot before it can be classified"
    error_id: ERR_NO_AFFECTED_LOTS
    http_status: 409
    applies_to: "POST /recalls/{id}/classify"

  - priority: 12
    category: business_referential
    check: "serial_filter_start, when present, must be <= serial_filter_end"
    error_id: ERR_INVALID_SERIAL_FILTER
    http_status: 422
    applies_to: "POST /recalls/{id}/classify"

  - priority: 13
    category: business_referential
    check: "A Disposition may only be opened for a Unit whose affected flag is true under the recall"
    error_id: ERR_UNIT_NOT_AFFECTED
    http_status: 409
    applies_to: "POST /dispositions"

  - priority: 14
    category: business_referential
    check: "At most one open Disposition (logistics_status == PENDING) per (recall_id, unit_id)"
    error_id: ERR_DUPLICATE_DISPOSITION
    http_status: 409
    applies_to: "POST /dispositions"

  - priority: 15
    category: business_constraint
    check: "Disposition action must match disposition_type (RETURN/REFUND -> receive-return; REPLACE -> ship-replacement; REFUND -> accrue-refund)"
    error_id: ERR_DISPOSITION_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /dispositions/{id}/receive-return, /ship-replacement, /accrue-refund"

  - priority: 16
    category: business_constraint
    check: "A refund cannot be accrued or settled until the unit's return is received (logistics_status == RETURNED)"
    error_id: ERR_RETURN_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /dispositions/{id}/accrue-refund, POST /dispositions/{id}/settle-refund"

  - priority: 17
    category: business_constraint
    check: "Dispositions can only be opened/advanced while the owning Recall is ANNOUNCED or MONITORING"
    error_id: ERR_RECALL_NOT_OPEN_FOR_DISPOSITION
    http_status: 409
    applies_to: "POST /dispositions, POST /dispositions/{id}/receive-return, POST /dispositions/{id}/ship-replacement"

  - priority: 18
    category: business_constraint
    check: "A serial number provided when creating a Unit must fall within its lot's [serial_start, serial_end]"
    error_id: ERR_SERIAL_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /units"

  - priority: 19
    category: business_constraint
    check: "A Notification cannot be sent to an unreachable customer (reachable == false)"
    error_id: ERR_CUSTOMER_UNREACHABLE
    http_status: 409
    applies_to: "POST /notifications/{id}/send"

  - priority: 20
    category: business_constraint
    check: "Begin-monitoring requires every Notification for the recall to be non-QUEUED"
    error_id: ERR_NOTIFICATIONS_PENDING
    http_status: 409
    applies_to: "POST /recalls/{id}/begin-monitoring"

  - priority: 21
    category: business_fiscal
    check: "Terminate-to-EFFECTIVE requires latest EffectivenessCheck.outcome == PASS unless force_terminate == true"
    error_id: ERR_EFFECTIVENESS_NOT_MET
    http_status: 409
    applies_to: "POST /recalls/{id}/terminate"

  - priority: 22
    category: business_referential
    check: "A reclassify is rejected once any RegulatoryReport for the recall is SUBMITTED/ACKNOWLEDGED"
    error_id: ERR_REPORT_ALREADY_FILED
    http_status: 409
    applies_to: "POST /recalls/{id}/reclassify"

  - priority: 23
    category: business_constraint
    check: "A Disposition already REFUNDED cannot be cancelled"
    error_id: ERR_DISPOSITION_ALREADY_REFUNDED
    http_status: 409
    applies_to: "POST /dispositions/{id}/cancel"

  - priority: 24
    category: business_referential
    check: "A RegulatoryReport cannot be submitted while its recall is still DRAFT (unclassified)"
    error_id: ERR_RECALL_NOT_CLASSIFIED
    http_status: 409
    applies_to: "POST /regulatory-reports/{id}/submit"

  - priority: 25
    category: business_referential
    check: "A Unit's serial must be unique within its lot; a Lot's lot_code unique within its product; a Product sku globally unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /products, POST /lots, POST /units"

  - priority: 26
    category: business_constraint
    check: "A new Lot's serial range [serial_start, serial_end] must not overlap any existing Lot of the same product_id. Overlap is CLOSED-interval collision: new.serial_start <= existing.serial_end AND new.serial_end >= existing.serial_start (touching endpoints, e.g. existing ends at 100 and new starts at 100, COLLIDE — both serials 100 cannot coexist in two lots)."
    error_id: ERR_LOT_RANGE_OVERLAP
    http_status: 409
    applies_to: "POST /lots"

  - priority: 27
    category: business_safety
    check: "A new Recall's affected serial window must not overlap the window of any existing non-terminal Recall (status != TERMINATED and != EFFECTIVE) on the same product_id. Windows use UNBOUNDED/HALF-OPEN semantics: a null serial_filter_start is -infinity, a null serial_filter_end is +infinity; two windows overlap when max(start_a, start_b) <= min(end_a, end_b) under that extended-real arithmetic. Unlike Lot ranges (always finite & closed), an unbounded recall window collides with ANY other window on the product."
    error_id: ERR_RECALL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /recalls"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a Product"
    roles: [RecallCoordinator, PlatformAdmin]
    code: 201
    input: [sku, name, regulator, unit_list_price_cents]
    output: Product
    side_effects: ["active_recall_id = null"]

  - method: GET
    path: "/products/{id}"
    description: "Get a Product"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List Products (filterable)"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["sku?", "regulator?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ---- Lot ----
  - method: POST
    path: "/lots"
    description: "Create a Lot for a product"
    roles: [RecallCoordinator, PlatformAdmin]
    code: 201
    input: [product_id, lot_code, serial_start, serial_end]
    output: Lot
    side_effects: ["manufactured_units = serial_end - serial_start + 1", "quarantine_status = RELEASED"]

  - method: GET
    path: "/lots/{id}"
    description: "Get a Lot"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List Lots; filter by product_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  # ---- Unit ----
  - method: POST
    path: "/units"
    description: "Register a Unit (serial) sold to a customer"
    roles: [RecallCoordinator, FieldServiceAgent, PlatformAdmin]
    code: 201
    input: [lot_id, serial_number, customer_id, sale_price_cents]
    output: Unit
    side_effects: ["affected recomputed (false unless an active recall covers this lot+serial)"]

  - method: GET
    path: "/units/{id}"
    description: "Get a Unit"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List Units; filter by lot_id or customer_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["lot_id?", "customer_id?", "affected?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a Customer"
    roles: [RecallCoordinator, FieldServiceAgent, PlatformAdmin]
    code: 201
    input: [name, contact_channel, contact_address, "reachable?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get a Customer"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: PATCH
    path: "/customers/{id}"
    description: "Update a Customer's contact details / reachability"
    roles: [RecallCoordinator, FieldServiceAgent, PlatformAdmin]
    code: 200
    input: ["contact_channel?", "contact_address?", "reachable?"]
    output: Customer
    side_effects: []

  # ---- Recall ----
  - method: POST
    path: "/recalls"
    description: "Open a Recall in DRAFT"
    roles: [RecallCoordinator, PlatformAdmin]
    code: 201
    input: [product_id, reason, hazard_severity, "injury_reported?", "serial_filter_start?", "serial_filter_end?"]
    output: Recall
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/recalls/{id}"
    description: "Get a Recall (computed counters/effectiveness included)"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: GET
    path: "/recalls"
    description: "List Recalls; filter by product_id (FK reverse-reachability) or status"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []

  - method: POST
    path: "/recalls/{id}/affected-lots"
    description: "Declare a Lot affected by the recall (OCC-guarded create of AffectedLot)"
    roles: [RecallCoordinator, PlatformAdmin]
    code: 201
    input: [lot_id, expected_recall_version]
    output: AffectedLot
    side_effects:
      - "Create AffectedLot; snapshot unit_count_snapshot = Lot.manufactured_units"
      - "Recompute affected flag on Units in that lot (affected_unit_recompute)"
      - "Recompute Recall.affected_unit_count, effectiveness_pct"
      - "increments Recall.version by 1"

  - method: GET
    path: "/affected-lots/{id}"
    description: "Get an AffectedLot membership record"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: AffectedLot
    side_effects: []

  - method: GET
    path: "/affected-lots"
    description: "List AffectedLots; filter by recall_id or lot_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["recall_id?", "lot_id?", "limit?", "offset?"]
    output: AffectedLot[]
    side_effects: []

  - method: POST
    path: "/recalls/{id}/classify"
    description: "Classify the recall (DRAFT -> CLASSIFIED)"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "classification_rule, notification_window_rule run"
      - "classified_by_user_id set; affected_unit_recompute; Product.active_recall_id set"

  - method: POST
    path: "/recalls/{id}/reclassify"
    description: "Send a CLASSIFIED recall back to DRAFT for revision (cyclic)"
    roles: [RecallCoordinator]
    code: 200
    input: ["hazard_severity?", "injury_reported?", "serial_filter_start?", "serial_filter_end?"]
    output: Recall
    side_effects: ["Clear classification fields; affected_unit_recompute; apply any provided field edits"]

  - method: POST
    path: "/recalls/{id}/announce"
    description: "QualityOfficer approves & announces (CLASSIFIED -> ANNOUNCED)"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "approved_by_user_id set (segregation enforced)"
      - "quarantine_cascade: ACTIVE QuarantineHold per affected lot"
      - "notification_fanout: one QUEUED Notification per distinct affected-unit Customer"
      - "Lots' quarantine_status -> HELD"

  - method: POST
    path: "/recalls/{id}/begin-monitoring"
    description: "Move ANNOUNCED -> MONITORING once all notifications are out of QUEUED"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: Recall
    side_effects: ["status = MONITORING"]

  - method: POST
    path: "/recalls/{id}/terminate"
    description: "Close recall: MONITORING -> EFFECTIVE (target met) or -> TERMINATED (force_terminate)"
    roles: [QualityOfficer]
    code: 200
    input: ["force_terminate?"]
    output: Recall
    side_effects:
      - "quarantine_release_cascade: lift all ACTIVE holds; Lots -> RELEASED"
      - "Clear Product.active_recall_id"

  - method: GET
    path: "/recalls/{id}/effectiveness"
    description: "Computed read: current effectiveness summary for the recall"
    roles: [RecallCoordinator, QualityOfficer, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: Recall
    side_effects: []

  # ---- QuarantineHold ----
  - method: GET
    path: "/quarantine-holds/{id}"
    description: "Get a QuarantineHold"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: QuarantineHold
    side_effects: []

  - method: GET
    path: "/quarantine-holds"
    description: "List QuarantineHolds; filter by recall_id or lot_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["recall_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: QuarantineHold[]
    side_effects: []

  - method: POST
    path: "/quarantine-holds/{id}/lift"
    description: "Lift an ACTIVE hold (ACTIVE -> LIFTED)"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: QuarantineHold
    side_effects: ["lifted_count += 1; recompute Lot.quarantine_status"]

  - method: POST
    path: "/quarantine-holds/{id}/reimpose"
    description: "Re-impose a LIFTED hold (LIFTED -> ACTIVE)"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: QuarantineHold
    side_effects: ["recompute Lot.quarantine_status to HELD"]

  # ---- Notification ----
  - method: GET
    path: "/notifications/{id}"
    description: "Get a Notification"
    roles: [RecallCoordinator, QualityOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Notification
    side_effects: []

  - method: GET
    path: "/notifications"
    description: "List Notifications; filter by recall_id or customer_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, PlatformAdmin]
    code: 200
    input: ["recall_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []

  - method: POST
    path: "/notifications/{id}/send"
    description: "Attempt to send (QUEUED/FAILED -> SENT, or QUEUED -> FAILED if unreachable)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Notification
    side_effects: ["attempt_count += 1; branch on Customer.reachable"]

  - method: POST
    path: "/notifications/{id}/acknowledge"
    description: "Mark a SENT notification ACKNOWLEDGED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Notification
    side_effects: []

  # ---- Disposition ----
  - method: POST
    path: "/dispositions"
    description: "Open a Disposition for an affected unit (OCC-guarded on Recall)"
    roles: [FieldServiceAgent]
    code: 201
    input: [recall_id, unit_id, disposition_type, "refund_basis?", expected_recall_version]
    output: Disposition
    side_effects:
      - "logistics_status = PENDING; financial_status = NOT_OWED"
      - "increments Recall.version by 1"

  - method: GET
    path: "/dispositions/{id}"
    description: "Get a Disposition"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: Disposition
    side_effects: []

  - method: GET
    path: "/dispositions"
    description: "List Dispositions; filter by recall_id or unit_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, FieldServiceAgent, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["recall_id?", "unit_id?", "logistics_status?", "financial_status?", "limit?", "offset?"]
    output: Disposition[]
    side_effects: []

  - method: POST
    path: "/dispositions/{id}/receive-return"
    description: "Record return receipt (logistics PENDING -> RETURNED)"
    roles: [FieldServiceAgent]
    code: 200
    input: []
    output: Disposition
    side_effects: ["effectiveness_recompute on owning Recall"]

  - method: POST
    path: "/dispositions/{id}/ship-replacement"
    description: "Ship replacement unit (logistics PENDING -> REPLACED)"
    roles: [FieldServiceAgent]
    code: 200
    input: []
    output: Disposition
    side_effects: ["effectiveness_recompute on owning Recall"]

  - method: POST
    path: "/dispositions/{id}/cancel"
    description: "Cancel a disposition (logistics PENDING -> CANCELLED)"
    roles: [FieldServiceAgent]
    code: 200
    input: []
    output: Disposition
    side_effects: ["If financial OWED -> VOID; effectiveness_recompute"]

  - method: POST
    path: "/dispositions/{id}/accrue-refund"
    description: "Accrue a refund liability (financial NOT_OWED -> OWED)"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Disposition
    side_effects: ["financial_status = OWED"]

  - method: POST
    path: "/dispositions/{id}/settle-refund"
    description: "Settle the refund (financial OWED -> REFUNDED)"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Disposition
    side_effects: ["refund_amount_rule fixes refund_amount_cents; refund_ledger_recompute updates Recall.total_refund_cents"]

  # ---- RegulatoryReport ----
  - method: POST
    path: "/regulatory-reports"
    description: "Draft a regulatory report for a recall"
    roles: [RecallCoordinator, QualityOfficer]
    code: 201
    input: [recall_id, report_kind]
    output: RegulatoryReport
    side_effects: ["status = DRAFTED"]

  - method: GET
    path: "/regulatory-reports/{id}"
    description: "Get a RegulatoryReport"
    roles: [RecallCoordinator, QualityOfficer, PlatformAdmin]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []

  - method: GET
    path: "/regulatory-reports"
    description: "List RegulatoryReports; filter by recall_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, PlatformAdmin]
    code: 200
    input: ["recall_id?", "report_kind?", "status?", "limit?", "offset?"]
    output: RegulatoryReport[]
    side_effects: []

  - method: POST
    path: "/regulatory-reports/{id}/submit"
    description: "QualityOfficer signs & submits a report (DRAFTED -> SUBMITTED)"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["signed_by_user_id set; agency snapshot; deadline_rule for INITIAL"]

  - method: POST
    path: "/regulatory-reports/{id}/acknowledge"
    description: "Mark a report ACKNOWLEDGED by the agency (SUBMITTED -> ACKNOWLEDGED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []

  # ---- EffectivenessCheck ----
  - method: POST
    path: "/effectiveness-checks"
    description: "Record an effectiveness check (snapshots current effectiveness vs target)"
    roles: [RecallCoordinator, QualityOfficer]
    code: 201
    input: [recall_id]
    output: EffectivenessCheck
    side_effects: ["effectiveness_target_rule: measured_pct = Recall.effectiveness_pct; target_pct per classification; outcome = PASS iff measured_pct >= target_pct"]

  - method: GET
    path: "/effectiveness-checks/{id}"
    description: "Get an EffectivenessCheck"
    roles: [RecallCoordinator, QualityOfficer, FinanceClerk, PlatformAdmin]
    code: 200
    input: []
    output: EffectivenessCheck
    side_effects: []

  - method: GET
    path: "/effectiveness-checks"
    description: "List EffectivenessChecks; filter by recall_id (FK reverse-reachability)"
    roles: [RecallCoordinator, QualityOfficer, FinanceClerk, PlatformAdmin]
    code: 200
    input: ["recall_id?", "outcome?", "limit?", "offset?"]
    output: EffectivenessCheck[]
    side_effects: []

  # ---- Test-driving endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: pin the server's current UTC clock (for deadline_rule determinism)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server now() returns to_iso8601 for subsequent deadline_rule evaluations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, or out-of-range integer" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Uniqueness violated: Product.sku global, Lot.lot_code per product, Unit.serial_number per lot" }
  - { id: ERR_SERIAL_OUT_OF_RANGE, http: 422, condition: "Unit serial_number outside its lot's [serial_start, serial_end]" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_recall_version != Recall.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_NO_AFFECTED_LOTS, http: 409, condition: "Classify attempted with zero AffectedLots" }
  - { id: ERR_INVALID_SERIAL_FILTER, http: 422, condition: "serial_filter_start > serial_filter_end" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Announcing QualityOfficer equals classifying user (4-eyes breach)" }
  - { id: ERR_INITIAL_REPORT_REQUIRED, http: 409, condition: "Announce attempted without an INITIAL report SUBMITTED/ACKNOWLEDGED" }
  - { id: ERR_FINAL_REPORT_REQUIRED, http: 409, condition: "Terminate attempted without a FINAL report SUBMITTED/ACKNOWLEDGED" }
  - { id: ERR_NOTIFICATIONS_PENDING, http: 409, condition: "Begin-monitoring attempted with at least one QUEUED Notification" }
  - { id: ERR_EFFECTIVENESS_NOT_MET, http: 409, condition: "Terminate-to-EFFECTIVE attempted but latest EffectivenessCheck is FAIL and force_terminate is not true" }
  - { id: ERR_HOLD_LOCKED_BY_RECALL, http: 409, condition: "QuarantineHold lift/reimpose blocked by owning Recall's state" }
  - { id: ERR_CUSTOMER_UNREACHABLE, http: 409, condition: "Notification send to a customer with reachable == false" }
  - { id: ERR_UNIT_NOT_AFFECTED, http: 409, condition: "Disposition opened for a Unit whose affected flag is false" }
  - { id: ERR_DUPLICATE_DISPOSITION, http: 409, condition: "A PENDING Disposition already exists for (recall_id, unit_id)" }
  - { id: ERR_DISPOSITION_TYPE_MISMATCH, http: 409, condition: "Action does not match disposition_type" }
  - { id: ERR_RETURN_NOT_RECEIVED, http: 409, condition: "Refund accrue/settle before logistics_status == RETURNED" }
  - { id: ERR_RECALL_NOT_OPEN_FOR_DISPOSITION, http: 409, condition: "Disposition op while owning Recall not in ANNOUNCED/MONITORING" }
  - { id: ERR_DISPOSITION_ALREADY_REFUNDED, http: 409, condition: "Cancel attempted on a REFUNDED disposition" }
  - { id: ERR_RECALL_NOT_CLASSIFIED, http: 409, condition: "RegulatoryReport submit while recall still DRAFT" }
  - { id: ERR_REPORT_ALREADY_FILED, http: 409, condition: "Reclassify attempted after a report is SUBMITTED/ACKNOWLEDGED" }
  - { id: ERR_LOT_RANGE_OVERLAP, http: 409, condition: "New Lot serial range overlaps an existing Lot of the same product (closed-interval collision)" }
  - { id: ERR_RECALL_WINDOW_OVERLAP, http: 409, condition: "New Recall serial window overlaps a non-terminal Recall on the same product (unbounded/half-open semantics)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RecallCoordinator
    description: "Opens recalls, declares affected lots, classifies, reclassifies, begins monitoring, manages quarantine holds, drafts reports, records effectiveness checks. May NOT announce or terminate (those require QualityOfficer)."
    identity: "opaque"
    exclusive_operations:
      - "POST /recalls — open recall"
      - "POST /recalls/{id}/affected-lots — declare affected lot"
      - "POST /recalls/{id}/classify — classify"
      - "POST /recalls/{id}/reclassify — reclassify"
      - "POST /recalls/{id}/begin-monitoring — begin monitoring"
      - "POST /quarantine-holds/{id}/lift — lift hold"
      - "POST /quarantine-holds/{id}/reimpose — reimpose hold"
    shared_operations:
      - "POST /products, POST /lots, POST /units, POST /customers, PATCH /customers/{id}"
      - "POST /regulatory-reports — draft report (with QualityOfficer)"
      - "POST /effectiveness-checks — record check (with QualityOfficer)"
      - "all GET reads"

  - name: QualityOfficer
    description: "Independent approver. Announces classified recalls (4-eyes vs classifier), terminates recalls, signs/submits regulatory reports, records effectiveness checks. May NOT classify."
    identity: "opaque"
    exclusive_operations:
      - "POST /recalls/{id}/announce — approve & announce"
      - "POST /recalls/{id}/terminate — close recall"
      - "POST /regulatory-reports/{id}/submit — sign & submit report"
    shared_operations:
      - "POST /regulatory-reports — draft report (with RecallCoordinator)"
      - "POST /effectiveness-checks — record check (with RecallCoordinator)"
      - "all GET reads"

  - name: FieldServiceAgent
    description: "Field operations. Registers units/customers and drives disposition logistics (open, receive-return, ship-replacement, cancel). No financial or lifecycle authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /dispositions — open disposition"
      - "POST /dispositions/{id}/receive-return"
      - "POST /dispositions/{id}/ship-replacement"
      - "POST /dispositions/{id}/cancel"
    shared_operations:
      - "POST /units, POST /customers, PATCH /customers/{id}"
      - "all GET reads"

  - name: FinanceClerk
    description: "Refund settlement only: accrue and settle refunds on dispositions whose returns are received. No logistics or lifecycle authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /dispositions/{id}/accrue-refund"
      - "POST /dispositions/{id}/settle-refund"
    shared_operations:
      - "all GET reads"

  - name: PlatformAdmin
    description: "Operational backbone: notification dispatch (send/acknowledge), report acknowledgement, clock control, and superset create access for setup. Does not classify, announce, terminate, or settle refunds (those are reserved to domain roles for segregation)."
    identity: "opaque"
    exclusive_operations:
      - "POST /notifications/{id}/send"
      - "POST /notifications/{id}/acknowledge"
      - "POST /regulatory-reports/{id}/acknowledge"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /products, POST /lots, POST /units, POST /customers, PATCH /customers/{id}, POST /recalls"
      - "all GET reads"
