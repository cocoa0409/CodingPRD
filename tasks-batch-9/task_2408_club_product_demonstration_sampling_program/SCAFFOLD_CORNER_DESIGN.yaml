            - "${remaining} == 3"
            - "${food_confirmed} == 0"
            - "${cats} == { HOUSEHOLD: 1 }"
            - "${wk} == 2026-09-14"
            - "${pool} == 20"
            - "${pool_used} == 6"
            - "${pool_left} == 14"
            - "${reserve_left} == 0"
            - "DemoEvent.${draft_event_id}.booking_status == DRAFT"

      - name: reconciliation_ignores_shipments_still_in_transit
        claim_type: input_set_filtering
        grounds:
          - calculations.sample_reconciliation_variance
          - entities.SampleShipment.fields.shipment_status
          - entities.SampleReconciliation.fields.units_delivered
          - endpoints[POST /demo-events/{id}/sample-reconciliation]
        distinguishing_aspect: "cases_delivered sums cases_received only over shipments whose shipment_status is DELIVERED or SHORT: with 3 cases received and 1 case still IN_TRANSIT at samples_per_case 10, units_delivered is 30 and not 40, so the 30 units accounted for balance to variance_units 0 instead of a 10-unit shortfall."
