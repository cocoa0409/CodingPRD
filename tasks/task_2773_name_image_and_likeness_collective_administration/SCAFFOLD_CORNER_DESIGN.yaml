            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
              captures: { dc_ver: $.data.version }
          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 40000, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-desig"
              captures: { err_mismatch: $.data.error_id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 50000, source_kind: "ONE_TIME_GIFT", designation: "CHARITY_PROGRAM", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { c_charity: $.data.id, charity_net: $.data.net_amount_cents }
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 48521, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-desig"
              captures: { err_insufficient: $.data.error_id }
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 48520, expected_deal_contract_version: "${dc_ver}" }
              as: TreasuryOfficer
              as_user_id: "treasury-desig"
              captures: { rel_id: $.data.id, rel_status: $.data.status, rel_net: $.data.net_payable_cents }
          assert:
            - "${err_mismatch} == ERR_FUNDING_DESIGNATION_MISMATCH"
            - "${charity_net} == 48520"
            - "${err_insufficient} == ERR_INSUFFICIENT_DESIGNATED_FUNDS"
            - "Both rejections return 422 and neither created a PaymentRelease row."
            - "${rel_status} == RELEASED"
            - "${rel_net} == 48520"
            - "The accepted amount is exactly the CHARITY_PROGRAM pool, one cent below the rejected request, so the priority 43 bound is inclusive."
            - "Collective.${col_id}.settled_net_funds_cents == 535990"
            - "Collective.${col_id}.released_total_cents == 48520"
            - "None of the three requests bumped DealContract.${dc_id}.version before the accepted one, which is why all three reuse ${dc_ver}."

  - section: rbac
    instances:

      - name: institution_reviewer_cannot_create_a_deal_contract
        claim_type: exclusive_operations
        grounds: [roles.InstitutionReviewer, roles.CollectiveDirector, validations.priority_3_rbac_endpoint_role_allowed]
        distinguishing_aspect: "The disclosure adjudicator and the contracting role hold disjoint exclusive operations in both directions: the reviewer cannot create a contract and the director cannot adjudicate its disclosure, so a single over-broad role table fails one of the two calls."
        test_recipe:
          setup: ["One collective, one ENROLLED athlete, and one DRAFT contract worth 100000 whose disclosure packet has already been submitted."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Rbac Collective", institution_name: "Rbac Institution", institution_ipeds_code: "025700", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Rbac Athlete", portal_user_id: "ath-rbac", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "OH-3345.56", association_rule_citation: "NCAA-2024-12.5" }
              as: CollectiveDirector
              captures: { disc_after_submit: $.data.disclosure_status }
          trigger:
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 50000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z" }
              as: InstitutionReviewer
              captures: { err_reviewer: $.data.error_id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: CollectiveDirector
              captures: { err_director: $.data.error_id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
