    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request with no X-User-Role/X-User-ID headers is rejected with 401 ERR_UNAUTHENTICATED before any role or existence check runs (priority
      1).
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /programs/contracts
        payload: {}
        as: ''
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_UNAUTHENTICATED with http 401
