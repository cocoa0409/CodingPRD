  - rule_id: cross_entity_state_dependency
    instances:
      - name: remittance_post_blocked_while_referenced_contract_suspended_for_quality
        grounds:
          - validations[priority=10]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - state_machines.SubsidyContract.SUSPENDED_FOR_QUALITY_to_ACTIVE
          - state_machines.SubsidyClaim.RECONCILED_to_SETTLED
          - calculations.remittance_allocation
          - endpoints[POST /fccn/providers/{id}/reinstate]
        distinguishing_aspect: |
          The entity pair is Remittance -> SubsidyContract: creating a Remittance is legal in every
          respect of its own row (amount, agency_reference, received_on all valid; there is no
          Remittance status to be wrong yet) and is refused solely because a DIFFERENT entity, the
          referenced SubsidyContract, sits in SUSPENDED_FOR_QUALITY. Reinstating the provider flips
          the contract back to ACTIVE and the identical request then succeeds, proving the gate is
          the other entity's state and nothing else.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with an ACTIVE SubsidyContract (daily_rate_cents 4500, absence_rate_pct 50, authorized_amount_cents 5000000)."
            - "One SubsidyClaim for 2026-07 walked to RECONCILED with final_amount_cents 137250."
            - "A ComplianceReview escalated to licensing, which cascades the contract to SUSPENDED_FOR_QUALITY; the RECONCILED claim is not held because HELD is only entered from DRAFT or SUBMITTED."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-07-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-07", lines: [{ enrollment_id: "${e1}", attended_days: 18, absent_days: 4 }, { enrollment_id: "${e2}", attended_days: 10, absent_days: 2 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id }
            - call: "POST /fccn/subsidy-claims/${cl1}/submit"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-claims/${cl1}/advance"
              as: FiscalOfficer
            - call: "POST /fccn/subsidy-claims/${cl1}/reconcile"
              as: FiscalOfficer
              captures: { fin1: $.data.final_amount_cents }
            - call: "POST /fccn/compliance-reviews"
              payload: { provider_id: "${p1}", standard_codes: ["QS-3"], severity: "SERIOUS", cap_due_on: "2026-08-31T00:00:00Z" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { rv1: $.data.id }
            - call: "POST /fccn/compliance-reviews/${rv1}/submit-cap"
              payload: { cap_narrative: "First plan" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/compliance-reviews/${rv1}/reject-cap"
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "POST /fccn/compliance-reviews/${rv1}/submit-cap"
              payload: { cap_narrative: "Second plan" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/compliance-reviews/${rv1}/reject-cap"
              as: QualityCoach
              as_user_id: "coach-b"
            - call: "POST /fccn/compliance-reviews/${rv1}/escalate"
              as: NetworkAdmin
          trigger:
            - call: "POST /fccn/remittances"
              payload: { contract_id: "${c1}", agency_reference: "AG-2026-07-A", amount_cents: 137250, received_on: "2026-08-01T00:00:00Z" }
              as: FiscalOfficer
              captures: { err_id: $.data.error_id }
            - call: "POST /fccn/providers/${p1}/reinstate"
              as: NetworkAdmin
              captures: { pstat: $.data.membership_status }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { cstat: $.data.status }
            - call: "POST /fccn/remittances"
              payload: { contract_id: "${c1}", agency_reference: "AG-2026-07-A", amount_cents: 137250, received_on: "2026-08-01T00:00:00Z" }
              as: FiscalOfficer
              captures: { rm1: $.data.id, unalloc: $.data.unallocated_cents }
          assert:
            - "${fin1} == 137250"
            - "${err_id} == ERR_CONTRACT_NOT_ACTIVE with HTTP 409 on the first post"
            - "no Remittance row exists for contract ${c1} after the refused post (GET /fccn/subsidy-contracts/${c1}/remittances total_count == 0)"
            - "${pstat} == ACTIVE and ${cstat} == ACTIVE"
            - "the identical second post returns 201 with Remittance.${rm1}.status == POSTED"
            - "${unalloc} == 0 and Remittance.${rm1}.allocations == [{ claim_id: ${cl1}, allocated_cents: 137250 }]"
            - "SubsidyClaim.${cl1}.status == SETTLED and paid_cents == 137250"
            - "SubsidyContract.${c1}.remitted_cents == 137250 and unallocated_credit_cents == 0"

      - name: enrollment_transfer_requires_receiving_provider_active_open_with_free_subsidy_slot
        grounds:
          - validations[priority=14]
          - errors[ERR_RECEIVING_PROVIDER_INELIGIBLE]
          - state_machines.Enrollment.TRANSITION_PENDING_to_TRANSFERRED
          - endpoints[POST /fccn/enrollments/{id}/transfer]
          - entities.Enrollment.fields.predecessor_enrollment_id
          - entities.SubsidyContract.fields.available_slots
        distinguishing_aspect: |
          A different entity pair — Enrollment -> receiving Provider AND that provider's
          SubsidyContract — and a two-condition dependency rather than one: the same transfer request
          is refused first because the receiving Provider is only PENDING_AGREEMENT, then refused
          again once it is ACTIVE/OPEN but has no ACTIVE contract with a free slot for a
          subsidy-certified child, and only succeeds when both far entities are in the right state.
          The source Enrollment's own status is TRANSITION_PENDING throughout, so nothing about the
          target row changes across the three attempts.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 exiting the network, so its subsidy-certified enrollment CH-1 is TRANSITION_PENDING with its slot already released."
            - "Provider P2 verified but still PENDING_AGREEMENT with an unexecuted SENT agreement and no subsidy contract."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
