        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[movement-apply-stale-animal]", "errors[ERR_STALE_VERSION]", endpoints]
        distinguishing_aspect: "After a first movement apply advances Animal.version, applying a second movement with the pre-advance expected_animal_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Clock 2026-04-01; herd + 454 kg animal; two PENs. Capture animal version, apply movement to A (version advances), plan a second movement to B."]
          setup_api_calls:
