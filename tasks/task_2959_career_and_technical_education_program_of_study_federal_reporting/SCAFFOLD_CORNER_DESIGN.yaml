              captures: { f_st: $.data.status, f_rd: $.data.negotiation_round, f_lvl: $.data.negotiated_level_pct, f_mt: $.data.met_threshold_pct, f_last: $.data.last_offer_pct, f_v: $.data.version }
          assert:
            - "${n1_st} == NEGOTIATING and ${n1_rd} == 1 and ${n1_lvl} == null"
            - "${n2_st} == NEGOTIATING and ${n2_rd} == 2"
            - "${n3_st} == NEGOTIATING and ${n3_rd} == 3"
            - "${n4_st} == NEGOTIATING and ${n4_rd} == 4 and ${n4_lvl} == null"
            - "${n5_st} == ARBITRATED and ${n5_rd} == 5"
            - "${n5_lvl} == 85.00 and ${n5_mt} == 76.50 and ${n5_last} == 93.00"
            - "the sixth negotiation-offers call returns error_id == ERR_NEGOTIATION_ROUNDS_EXHAUSTED with HTTP status 422"
            - "the accept-level call returns error_id == ERR_NEGOTIATION_ROUNDS_EXHAUSTED with HTTP status 422"
            - "${f_st} == ARBITRATED and ${f_rd} == 5 and ${f_lvl} == 85.00 and ${f_mt} == 76.50 and ${f_last} == 93.00"
            - "${f_v} == ${n5_v}"

  - section: endpoints
    instances:

      - name: patch_endpoints_update_only_the_supplied_fields_and_bump_the_version
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /cte/programs-of-study/{id}]
          - endpoints[PATCH /cte/sequence-courses/{id}]
          - entities.SequenceCourse.fields.depth_from_root
          - entities.ProgramOfStudy.fields.secondary_credit_total
        distinguishing_aspect: |
          The two PATCH endpoints declare every input as optional, so a one-field request must leave every other field
          exactly as it was while still incrementing version — a full-replacement handler would null out cluster and
          labor_market_data_asof. The course PATCH additionally declares three derived side effects that must all fire
          from a two-field request: depth_from_root on the patched course, the parent's credit totals and alignment index,
          and a version increment on BOTH the course and the parent program.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy with cip_code 15.1302, title Drafting Technology, cluster STEM and labor_market_data_asof 2026-03-01."
            - "Two SECONDARY sequence courses: S1 at position 1 with 4.00 credit hours and status ACTIVE, and S2 at position 2 with 2.00 credit hours, status DRAFT and prerequisite S1."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "15.1302", title: "Drafting Technology", cluster: "STEM", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "DFT-1", title: "Drafting I", segment: "SECONDARY", position: 1, credit_hours: 4.00, status: "ACTIVE" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_s1_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { code: "DFT-2", title: "Drafting II", segment: "SECONDARY", position: 2, credit_hours: 2.00, prerequisite_course_id: "${crs_s1_id}" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { crs_s2_id: $.data.id }
          trigger:
            - call: "GET /cte/programs-of-study/${pos_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { v0: $.data.version }
            - call: "PATCH /cte/programs-of-study/${pos_id}"
              payload: { title: "Drafting and Design Technology" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { t1: $.data.title, cl1: $.data.cluster, lmd1: $.data.labor_market_data_asof, cip1: $.data.cip_code, v1: $.data.version }
            - call: "PATCH /cte/sequence-courses/${crs_s2_id}"
              payload: { status: "ACTIVE", credit_hours: 3.00 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { cs: $.data.status, cch: $.data.credit_hours, cart: $.data.articulated_credit_hours, cpos: $.data.position, cdep: $.data.depth_from_root, ccode: $.data.code }
            - call: "GET /cte/programs-of-study/${pos_id}"
              payload: {}
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { v2: $.data.version, sct: $.data.secondary_credit_total, pct: $.data.postsecondary_credit_total }
            - call: "GET /cte/programs-of-study/${pos_id}/sequence-courses"
              payload: { status: "ACTIVE", limit: 10, offset: 0 }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { n_active: $.meta.total_count }
          assert:
            - "${t1} == Drafting and Design Technology"
            - "${cl1} == STEM and ${lmd1} == 2026-03-01 and ${cip1} == 15.1302"
            - "${v1} == ${v0} plus 1"
            - "${cs} == ACTIVE and ${cch} == 3.00 and ${ccode} == DFT-2"
            - "${cart} == 0 and ${cpos} == 2 — the two fields the request omitted are untouched"
            - "${cdep} == 1"
            - "${v2} == ${v1} plus 1 — the course PATCH also bumped the parent program"
            - "${sct} == 7.00 and ${pct} == 0 — the parent credit subtotals were recomputed by the course PATCH"
            - "${n_active} == 2"

      - name: student_exit_and_expenditure_obligation_apply_their_declared_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /cte/students/{id}/exit]
          - endpoints[POST /cte/expenditures/{id}/obligate]
          - calculations.concentrator_cohort_classification
          - state_machines.Expenditure.CERTIFIED_to_OBLIGATED
          - entities.Student.fields.concentrator_status
        distinguishing_aspect: |
          Two action endpoints whose side effects are easy to under-implement. The exit call must not merely stamp
          exited_on and exit_reason: it is the third clause of the COMPLETER test, so a student already carrying 2.00
          credits and one verified attainment must be reclassified from CONCENTRATOR straight to COMPLETER by the exit
          itself. The obligate call must move CERTIFIED to OBLIGATED while leaving approved_cents alone AND leaving the
          grant ledger identical, because both statuses are inside the rollup's input set — an implementation that
          re-adds the line on obligation doubles direct_obligated_cents.
        test_recipe:
          setup:
            - "One STATE_APPROVED ProgramOfStudy and one GrantAward for fiscal_year 2027 with allocation_cents 5000000."
            - "One CERTIFIED CONSUMABLE Expenditure of gross 100000 and approved_cents 85000, so the ledger already reads direct 85000, pool 6902, obligated 91902 and remaining 4908098."
            - "One Student in cohort_year 2026 holding 2.00 credits in the ACTIVE SECONDARY course and one VERIFIED attainment of the program credential, therefore CONCENTRATOR and still enrolled."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
