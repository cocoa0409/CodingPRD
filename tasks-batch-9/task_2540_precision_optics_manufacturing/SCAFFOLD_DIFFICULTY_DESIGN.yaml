            - call: "POST /optics/glass-lots/${gg}/certification"
              payload: { measured_index_homogeneity_grade: "H2", measured_striae_grade: "A", certificate_reference: "CERT-2540-G" }
              as: ProcurementOfficer
              captures: { ggv: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${gb}", element_count: 4, expected_glass_lot_version: "${gbv}" }
              as: ProcessTechnician
            - call: "POST /optics/work-orders"
