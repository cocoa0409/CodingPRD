        distinguishing_aspect: "Body-referenced edition that does not exist yields 422 ERR_REFERENTIAL_INTEGRITY (not 404 — path vs body distinction)."
        test_recipe:
          setup: ["One submitter"]
          setup_api_calls:
            - { call: "POST /festival/submitters", payload: { legal_name: "Ivy Sol", email: "ivy@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
          trigger:
