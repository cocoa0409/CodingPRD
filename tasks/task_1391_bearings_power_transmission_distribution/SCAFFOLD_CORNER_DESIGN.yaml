              as: ContractAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p_id}", on_hand_qty: 0, factory_lead_time_days: 4 }
              as: BranchManager
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
              as: CounterSalesRep
              captures: { o_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1, expedite_tier: "EMERGENCY" }
              as: CounterSalesRep
              captures: { l1_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1, expedite_tier: "RUSH" }
              as: CounterSalesRep
              captures: { l2_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/lines"
              payload: { product_id: "${p_id}", qty: 1, expedite_tier: "NONE" }
              as: CounterSalesRep
              captures: { l3_id: $.data.id }
            - call: "POST /motion/orders/${o_id}/confirm"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l1_id}/place-factory-order"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l2_id}/place-factory-order"
              payload: {}
              as: CounterSalesRep
            - call: "POST /motion/order-lines/${l3_id}/place-factory-order"
              payload: {}
              as: CounterSalesRep
          trigger:
            - call: "POST /motion/order-lines/${l1_id}/receive-factory"
              payload: {}
              as: BranchManager
              captures: { st1: $.data.sourcing_status }
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/order-lines/${l2_id}/receive-factory"
              payload: {}
              as: BranchManager
              captures: { st2: $.data.sourcing_status }
            - call: "POST /motion/order-lines/${l3_id}/receive-factory"
              payload: {}
              as: BranchManager
              captures: { err3: $.data.error_id }
            - call: "POST /motion/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /motion/order-lines/${l3_id}/receive-factory"
              payload: {}
              as: BranchManager
              captures: { st3: $.data.sourcing_status }
          assert:
            - "st1 == FACTORY_RECEIVED (EMERGENCY lead 0: same-instant receipt)"
            - "st2 == FACTORY_RECEIVED at +2d (RUSH halves 4 -> 2)"
            - "err3 == ERR_FACTORY_LEAD_TIME_UNMET at +2d (NONE needs 4)"
            - "st3 == FACTORY_RECEIVED at +4d"
            - "BranchStock on_hand_qty == 3 after the three receipts (factory goods land on shelf)"

      - name: price_file_cancel_effective_rejected
