            - "IncomeVerification.${civr_id}.fpg_percent == null"
            - "IncomeVerification.${civr_id}.assigned_discount_tier_id == null"
            - "IncomeVerification.${civr_id}.verified_by_user_id == null"
            - "Patient.${cpr_id}.sliding_fee_status == \"UNVERIFIED\""

      - name: suspend_site_side_effects_update_counter_governance_and_version
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServiceSite.IN_SCOPE_to_SUSPENDED
          - calculations.scope_listing_invariant
          - calculations.governance_posture
          - entities.HealthCenter.fields.in_scope_site_count
        distinguishing_aspect: >-
          Every declared side effect of IN_SCOPE->SUSPENDED fires in the one request:
          in_scope_site_count drops 1 -> 0, governance_posture is recomputed, and
          HealthCenter.version moves from exactly 5 to exactly 6.
        test_recipe:
          setup:
            - "BOOT_CORE is executed; HealthCenter.version is 5, in_scope_site_count is 1, in_scope_service_count is 1"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { pre_v: $.data.version, pre_sites: $.data.in_scope_site_count }
          trigger:
            - *c_suspend
          assert:
            - "the setup GET observed pre_v == 5 and pre_sites == 1"
            - "HTTP 200 and ServiceSite.${csite_id}.status == \"SUSPENDED\""
            - "HealthCenter.${chc_id}.in_scope_site_count == 0"
            - "HealthCenter.${chc_id}.in_scope_service_count == 1"
            - "HealthCenter.${chc_id}.version == 6"
            - "HealthCenter.${chc_id}.governance_posture == \"GOVERNANCE_DEFICIENT\""
            - "HealthCenter.${chc_id}.operational_status == \"ACTIVE\" and scope_posture == \"OPEN\" — suspension is not a condition"

      - name: uds_report_returned_to_draft_loop_increments_return_round
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.UDSReport.SUBMITTED_to_RETURNED
          - state_machines.UDSReport.RETURNED_to_DRAFT
          - entities.UDSReport.fields.return_round
        distinguishing_aspect: >-
          The UDSReport cycle SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED is traversable: compute on
          a RETURNED report moves it back to DRAFT with return_round exactly 1 and re-stamps
          computed_at, and the report can then be submitted again.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "A 2026 UDSReport with one QualityMeasureResult has been computed, submitted, and RETURNED by the ProjectOfficer"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_uds
            - *c_qm1
            - *c_compute
            - *c_uds_submit
            - call: "POST /uds-reports/${cuds_id}/adjudicate"
              payload: { decision: "RETURN", return_reason: "Recheck the hypertension denominator" }
              as: ProjectOfficer
              as_user_id: "po-1"
          trigger:
            - call: "POST /uds-reports/${cuds_id}/compute"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /uds-reports/${cuds_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "after the compute call UDSReport.${cuds_id}.status == \"DRAFT\" and return_round == 1"
            - "UDSReport.${cuds_id}.computed_at == \"2026-08-01T00:00:00.000Z\""
            - "UDSReport.${cuds_id}.included_measure_count == 1"
            - "UDSReport.${cuds_id}.composite_quality_rate_pct == 31.3"
            - "after the submit call UDSReport.${cuds_id}.status == \"SUBMITTED\" and return_round is still 1"

      - name: scope_change_submit_while_scope_frozen_rejected
        claim_type: guarded_transitions
        grounds:
          - state_machines.ScopeChangeRequest.DRAFT_to_SUBMITTED
          - validations[priority 15]
          - errors[ERR_SCOPE_CHANGE_FROZEN]
          - entities.HealthCenter.fields.scope_posture
        distinguishing_aspect: >-
          DRAFT->SUBMITTED carries a cross-entity guard on HealthCenter.scope_posture: after an
          ESCALATED CONDITION freezes the award the submit is refused with ERR_SCOPE_CHANGE_FROZEN /
          409 while the request itself is still legally in DRAFT, proving the guard is evaluated on
          the parent grantee and not on the request's own status.
        test_recipe:
          setup:
            - "BOOT_CORE is executed plus the PROPOSED annex site and a DRAFT ADD_SITE request"
            - "A CONDITION finding with cap_due_days 1 is issued at clock 2026-08-01, so cap_due_at is 2026-08-02"
            - "The clock is advanced to 2026-08-03 and the compliance sweep escalates the finding, freezing scope"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_site2
            - *c_scr_add
            - &c_find1
              call: "POST /health-centers/${chc_id}/site-visit-findings"
              payload: { service_site_id: "${csite_id}", requirement_code: "REQ_SLIDING_FEE_16", severity: "CONDITION", finding_summary: "Sliding fee schedule not posted at the point of service", cap_due_days: 1 }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { cfind1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sweep_esc: $.data.escalated_finding_count }
          trigger:
            - call: "POST /scope-change-requests/${cscr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_frozen: $.data.error_id }
          assert:
            - "the setup sweep reported escalated_finding_count == 1"
            - "SiteVisitFinding.${cfind1_id}.status == \"ESCALATED\" and cap_due_at == \"2026-08-02T00:00:00.000Z\""
            - "HealthCenter.${chc_id}.open_condition_count == 1"
            - "HealthCenter.${chc_id}.operational_status == \"CONDITIONS_IMPOSED\""
            - "HealthCenter.${chc_id}.scope_posture == \"CHANGE_FROZEN\""
            - "HTTP 409 and data.error_id == \"ERR_SCOPE_CHANGE_FROZEN\""
            - "ScopeChangeRequest.${cscr_id}.status == \"DRAFT\" and held_from_status == null"
            - "ServiceSite.${csite2_id}.status == \"PROPOSED\" — a DRAFT request is never put ON_HOLD"

      - name: scope_change_request_revision_loop_cap_is_respected
        claim_type: cyclic
        grounds:
          - state_machines.ScopeChangeRequest.REVISION_REQUESTED_to_SUBMITTED
          - validations[priority 12]
          - errors[ERR_LOOP_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: scope_change_request_revision_cycle_capped_at_three_rounds
          rationale: "The named §1.8 instance drives the DRAFT->SUBMITTED->UNDER_REVIEW->REVISION_REQUESTED cycle three times and asserts ERR_LOOP_LIMIT_EXCEEDED on the fourth submit."

      - name: finding_escalation_cascade_reaches_target_site_on_hold
        claim_type: cascade_down
        grounds:
          - state_machines.SiteVisitFinding.OPEN_to_ESCALATED
          - state_machines.ScopeChangeRequest.SUBMITTED_to_HELD
          - state_machines.ServiceSite.PROPOSED_to_ON_HOLD
        excluded_because:
          difficulty_instance: finding_escalation_freezes_scope_and_holds_target_site_depth_five
          rationale: "The named §1.8 instance asserts all five hops of the escalation cascade end-to-end, including the ON_HOLD target site and hold_reason SCOPE_FROZEN."

      - name: cap_acceptance_compensation_reverses_every_escalation_side_effect
        claim_type: compensation
        grounds:
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_ACCEPTED
          - state_machines.SiteVisitFinding.CAP_SUBMITTED_to_RESOLVED
          - state_machines.ScopeChangeRequest.HELD_to_SUBMITTED
          - state_machines.ServiceSite.ON_HOLD_to_PROPOSED
        excluded_because:
          difficulty_instance: cap_acceptance_restores_scope_cardinalities_and_releases_every_held_row
          rationale: "The named §1.8 instance asserts the four compensating hops and zero counter drift after acceptance."

  # ===========================================================================
  - section: calculations
    instances:

      - name: patient_charge_on_a_nominal_tier_correct_result
        claim_type: correct_result
        grounds:
          - calculations.patient_charge_cents
          - calculations.pps_encounter_rate_cents
          - calculations.discount_tier_assignment
          - entities.Encounter.fields.charge_basis
          - entities.Encounter.fields.pinned_discount_tier_id
        distinguishing_aspect: >-
          For fpg_percent 61.73 the half-open band [0,100) selects NOMINAL_FULL whose discount_kind
          is NOMINAL, so step S4 returns FeeSchedule.nominal_fee_cents 2500 outright (not a
          percentage of the 8000 gross) and step S5's min(2500, 8000) leaves it at 2500; the PPS
          rate is the unmultiplied base 20000 because the service is REQUIRED_PRIMARY at a
          SERVICE_DELIVERY site.
        test_recipe:
          setup:
            - "BOOT_PT is executed"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
          trigger:
            - *c_enc
          assert:
            - "HTTP 201 and Encounter.${cenc_id}.patient_charge_cents == 2500"
            - "Encounter.${cenc_id}.charge_basis == \"SLIDING_FEE_TIER\""
            - "Encounter.${cenc_id}.sliding_fee_applied == true"
            - "Encounter.${cenc_id}.pinned_discount_tier_id == ${ct1_id}"
            - "Encounter.${cenc_id}.income_verification_id == ${civ_id}"
            - "Encounter.${cenc_id}.fee_schedule_id == ${cfs_id}"
            - "Encounter.${cenc_id}.pps_encounter_rate_cents == 20000"
            - "Encounter.${cenc_id}.wraparound_due_cents == 0"
            - "Encounter.${cenc_id}.wraparound_status == \"NOT_APPLICABLE\""
            - "Encounter.${cenc_id}.charge_adjustment_cents == 0"
            - "Patient.${cp_id}.patient_balance_cents == 2500"

      - name: pps_rate_medicare_upper_limit_constant_clamps_the_rate
        claim_type: constants_applied
        grounds:
          - calculations.pps_encounter_rate_cents
          - calculations.patient_charge_cents
          - entities.HealthCenter.fields.medicare_upper_limit_cents
          - entities.Encounter.fields.payer_type
        distinguishing_aspect: >-
          payer_type MEDICARE triggers the declared ceiling clamp min(rate, 15000) on a base rate of
          20000, so pps_encounter_rate_cents is 15000 rather than 20000, while step S1 of
          patient_charge_cents independently zeroes the patient charge with charge_basis
          THIRD_PARTY even though the patient holds a VERIFIED sliding-fee determination.
        test_recipe:
          setup:
            - "BOOT_PT is executed; the grantee's pps_base_rate_cents is 20000 and medicare_upper_limit_cents is 15000"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-03-20T00:00:00Z", payer_type: "MEDICARE", gross_charge_cents: 30000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { mcare_id: $.data.id }
          assert:
            - "Encounter.${mcare_id}.pps_encounter_rate_cents == 15000"
            - "Encounter.${mcare_id}.patient_charge_cents == 0"
            - "Encounter.${mcare_id}.charge_basis == \"THIRD_PARTY\""
            - "Encounter.${mcare_id}.sliding_fee_applied == false"
            - "Encounter.${mcare_id}.pinned_discount_tier_id == null"
            - "Encounter.${mcare_id}.wraparound_status == \"NOT_APPLICABLE\""
            - "Patient.${cp_id}.patient_balance_cents == 0"

      - name: uds_income_distribution_excludes_void_encounters_and_dedupes_patients
        claim_type: input_set_filtering
        grounds:
          - calculations.uds_income_distribution
          - entities.UDSReport.fields.total_patient_count
          - entities.UDSReport.fields.unverified_patient_count
          - endpoints[POST /uds-reports/{id}/compute]
        distinguishing_aspect: >-
          The reported-patient set is DISTINCT patient_id over non-VOID encounters of the reporting
          year: Val Osei's two 2026 encounters count her once, Rue Marsh with no verification lands
          in unverified_patient_count, and Sol Vega — whose only encounter was voided — is excluded
          entirely, giving total_patient_count 2 rather than 3.
        test_recipe:
          setup:
            - "BOOT_PT is executed"
            - "Val Osei has two non-VOID 2026 encounters (2026-03-15 and 2026-04-01)"
            - "Patient 'Rue Marsh' (MRN-C03, household_size 1) has one non-VOID 2026 encounter and no IncomeVerification at all"
            - "Patient 'Sol Vega' (MRN-C04, household_size 1) has exactly one 2026 encounter and it is VOID"
            - "A DRAFT UDSReport for reporting_year 2026 exists with no QualityMeasureResult rows"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - *c_enc
            - *c_enc2
            - call: "POST /patients"
              payload: { mrn: "MRN-C03", full_name: "Rue Marsh", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { cp2_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${cp2_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-05-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cenc_p2: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C04", full_name: "Sol Vega", household_size: 1 }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { cp3_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${cp3_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-06-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cenc_p3: $.data.id }
            - call: "POST /encounters/${cenc_p3}/void"
              payload: { void_reason: "DUPLICATE" }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - *c_uds
          trigger:
            - *c_compute
          assert:
            - "UDSReport.${cuds_id}.total_patient_count == 2"
            - "UDSReport.${cuds_id}.patients_at_or_below_100_count == 1"
            - "UDSReport.${cuds_id}.patients_101_to_150_count == 0"
            - "UDSReport.${cuds_id}.patients_151_to_200_count == 0"
            - "UDSReport.${cuds_id}.patients_over_200_count == 0"
            - "UDSReport.${cuds_id}.unverified_patient_count == 1"
            - "UDSReport.${cuds_id}.included_measure_count == 0"
            - "UDSReport.${cuds_id}.composite_quality_rate_pct == null"
            - "UDSReport.${cuds_id}.computed_at == \"2026-08-01T00:00:00.000Z\""
            - "Encounter.${cenc_p3}.pps_claim_status == \"VOID\""

      - name: quality_measure_rate_uses_round_half_up_not_bankers_rounding
        claim_type: precision
        grounds:
          - calculations.uds_composite_quality_rate_pct
          - entities.QualityMeasureResult.fields.rate_pct
          - entities.QualityMeasureResult.fields.meets_benchmark
          - entities.UDSReport.fields.composite_quality_rate_pct
        distinguishing_aspect: >-
          Both measures land exactly on a half-cent boundary: 5/16 = 31.25 and 1/16 = 6.25. The
          declared round_half_up mode yields 31.3 and 6.3 (banker's rounding would yield 31.2 and
          6.2), and the composite of the already-rounded rates is (31.3 + 6.3) / 2 = 18.8, which no
          banker's-rounding implementation can reproduce.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "A DRAFT UDSReport for 2026 carries CMS165_BP_CONTROL 5/16 with benchmark_pct 31.3 and CMS122_HBA1C 1/16 with benchmark_pct 6.4"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_uds
            - *c_qm1
            - call: "POST /uds-reports/${cuds_id}/quality-measure-results"
              payload: { measure_code: "CMS122_HBA1C", numerator: 1, denominator: 16, benchmark_pct: 6.4 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cqm2_id: $.data.id }
          trigger:
            - *c_compute
          assert:
            - "QualityMeasureResult.${cqm1_id}.rate_pct == 31.3"
            - "QualityMeasureResult.${cqm1_id}.inclusion_status == \"INCLUDED\""
            - "QualityMeasureResult.${cqm1_id}.meets_benchmark == true"
            - "QualityMeasureResult.${cqm2_id}.rate_pct == 6.3"
            - "QualityMeasureResult.${cqm2_id}.inclusion_status == \"INCLUDED\""
            - "QualityMeasureResult.${cqm2_id}.meets_benchmark == false"
            - "UDSReport.${cuds_id}.included_measure_count == 2"
            - "UDSReport.${cuds_id}.composite_quality_rate_pct == 18.8"

      - name: wraparound_receivable_aggregation_after_payment_and_after_void
        claim_type: aggregation
        grounds:
          - calculations.wraparound_due_cents
          - entities.HealthCenter.fields.wraparound_receivable_cents
          - state_machines.Encounter.BILLED_to_PAID
          - state_machines.Encounter.PAID_to_VOID
          - calculations.patient_balance_invariant
        distinguishing_aspect: >-
          The grantee-level receivable is a running total over MEDICAID_MCO encounters: after two
          payments it is 3500 + 2500 = 6000, and voiding the first encounter removes its 3500 from
          the base leaving exactly 2500 — the reversal is recomputed from the surviving rows, not
          decremented by a stored delta.
        test_recipe:
          setup:
            - "BOOT_PT is executed"
            - "Two MEDICAID_MCO encounters of 8000 gross are created, billed, and paid: the first with mco_paid_cents 14000, the second with 15000"
            - "Each MCO charge is clamped to the 2500 nominal fee by step S7, so wraparound is max(0, 20000 - paid - 2500)"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - &c_mco1
              call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-03-15T00:00:00Z", payer_type: "MEDICAID_MCO", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cmco1_id: $.data.id }
            - &c_mco1_bill
              call: "POST /encounters/${cmco1_id}/bill"
              payload: { claim_reference: "CLM-M1" }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /encounters/${cmco1_id}/record-payment"
              payload: { mco_paid_cents: 14000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-04-01T00:00:00Z", payer_type: "MEDICAID_MCO", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cmco2_id: $.data.id }
            - call: "POST /encounters/${cmco2_id}/bill"
              payload: { claim_reference: "CLM-M2" }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /encounters/${cmco2_id}/record-payment"
              payload: { mco_paid_cents: 15000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "GET /health-centers/${chc_id}"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { recv_before: $.data.wraparound_receivable_cents }
          trigger:
            - call: "POST /encounters/${cmco1_id}/void"
              payload: { void_reason: "CODING_ERROR" }
              as: BillingSpecialist
              as_user_id: "bs-1"
          assert:
            - "the setup GET observed recv_before == 6000"
            - "Encounter.${cmco1_id}.patient_charge_cents was 2500 and wraparound_due_cents was 3500 with wraparound_status \"PENDING\""
            - "Encounter.${cmco2_id}.wraparound_due_cents == 2500 and wraparound_status == \"PENDING\""
            - "after the void Encounter.${cmco1_id}.pps_claim_status == \"VOID\""
            - "Encounter.${cmco1_id}.wraparound_status == \"NOT_APPLICABLE\""
            - "Encounter.${cmco1_id}.charge_adjustment_cents == -2500"
            - "HealthCenter.${chc_id}.wraparound_receivable_cents == 2500"
            - "Patient.${cp_id}.patient_balance_cents == 2500"

      - name: compliance_sweep_step_order_and_second_run_idempotence
        claim_type: chronological
        grounds:
          - calculations.compliance_sweep_epoch
          - state_machines.IncomeVerification.VERIFIED_to_EXPIRED
          - state_machines.SiteVisitFinding.OPEN_to_ESCALATED
          - state_machines.FeeSchedule.ADOPTED_to_EXPIRED
          - endpoints[POST /_ops/compliance-sweep]
        distinguishing_aspect: >-
          A single sweep at 2027-03-01 executes S1 -> S2 -> S3 -> S4 in the pinned order, so the
          same response reports expired_verification_count 1, escalated_finding_count 1 and
          expired_fee_schedule_count 1 AND the grantee already reads scope_posture CHANGE_FROZEN
          (S2 froze scope before S4 recomputed posture); a second sweep at the identical clock value
          reports all three counts as 0 and changes no row.
        test_recipe:
          setup:
            - "BOOT_PT is executed; the verification expires_at is 2027-03-01 and the fee schedule effective_end is 2027-01-01"
            - "A CONDITION finding with cap_due_days 30 is issued at clock 2026-08-01 so cap_due_at is 2026-08-31"
            - "The logical clock is advanced to 2027-03-01T00:00:00Z"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - &c_find30
              call: "POST /health-centers/${chc_id}/site-visit-findings"
              payload: { service_site_id: "${csite_id}", requirement_code: "REQ_BOARD_AUTHORITY_19", severity: "CONDITION", finding_summary: "Governing board lacks patient-majority composition", cap_due_days: 30 }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { cfind30_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1_iv: $.data.expired_verification_count, s1_find: $.data.escalated_finding_count, s1_fs: $.data.expired_fee_schedule_count, s1_hc: $.data.recomputed_health_center_count }
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s2_iv: $.data.expired_verification_count, s2_find: $.data.escalated_finding_count, s2_fs: $.data.expired_fee_schedule_count }
          assert:
            - "first sweep: s1_iv == 1, s1_find == 1, s1_fs == 1, s1_hc == 1"
            - "IncomeVerification.${civ_id}.status == \"EXPIRED\" and Patient.${cp_id}.sliding_fee_status == \"EXPIRED\""
            - "SiteVisitFinding.${cfind30_id}.status == \"ESCALATED\" and escalated_at == \"2027-03-01T00:00:00.000Z\""
            - "FeeSchedule.${cfs_id}.status == \"EXPIRED\" and review_status == \"CURRENT\""
            - "HealthCenter.${chc_id}.open_condition_count == 1 and operational_status == \"CONDITIONS_IMPOSED\" and scope_posture == \"CHANGE_FROZEN\" — observable after the FIRST sweep, proving S2 ran before S4"
            - "second sweep: s2_iv == 0, s2_find == 0, s2_fs == 0"
            - "after the second sweep IncomeVerification.${civ_id}.status is still \"EXPIRED\", SiteVisitFinding.${cfind30_id}.status is still \"ESCALATED\", FeeSchedule.${cfs_id}.status is still \"EXPIRED\" and HealthCenter.${chc_id}.open_condition_count is still 1"

      - name: fpg_percent_two_variants_diverge_across_the_100_percent_breakpoint
        claim_type: variant_divergence
        grounds:
          - calculations.fpg_percent
          - entities.IncomeVerification.fields.uds_fpg_percent
        excluded_because:
          difficulty_instance: fpg_percent_schedule_year_vs_intake_year_divergence
          rationale: "The named §1.8 instance pins both variants on one row (101.90 vs 98.17) and asserts the resulting tier/band disagreement."

      - name: patient_charge_variant_switch_reconciles_the_ledger_delta
        claim_type: reconciliation
        grounds:
          - calculations.patient_charge_cents
          - entities.Encounter.fields.charge_adjustment_cents
        excluded_because:
          difficulty_instance: patient_charge_provisional_vs_final_on_retroactive_verification
          rationale: "The named §1.8 instance asserts charge_adjustment_cents == -9500 and pps_claim_status PENDING_ADJUSTMENT when the FINAL variant replaces PROVISIONAL."

      - name: discount_tier_band_edge_threshold_selects_the_upper_tier
        claim_type: threshold
        grounds:
          - calculations.discount_tier_assignment
          - calculations.fpg_percent
        excluded_because:
          difficulty_instance: fpg_percent_exactly_at_band_edge_assigns_the_upper_tier
          rationale: "The named §1.8 instance tests fpg_percent 99.91 / 100.00 against the half-open [fpg_min_pct, fpg_max_pct) boundary."

      - name: composite_quality_rate_excludes_zero_denominator_measures
        claim_type: correct_result
        grounds:
          - calculations.uds_composite_quality_rate_pct
          - entities.QualityMeasureResult.fields.inclusion_status
        excluded_because:
          difficulty_instance: uds_composite_round_per_measure_then_average_mode_b
          rationale: "The named §1.8 instance asserts the 0/0 measure becomes EXCLUDED_ZERO_DENOMINATOR with rate_pct null and is dropped from both the numerator sum and the divisor."

  # ===========================================================================
  - section: validations
    instances:

      - name: list_limit_above_one_hundred_returns_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations[priority 5]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints[GET /poverty-guidelines]
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          limit 101 exceeds the declared max of 100, so the list endpoint answers
          ERR_INVALID_PAGINATION / 400 instead of silently clamping to 100.
        test_recipe:
          setup:
            - "The 2026 federal poverty guideline is published"
          setup_api_calls:
            - *c_pg26
          trigger:
            - call: "GET /poverty-guidelines"
              payload: { limit: 101 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_pag: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_PAGINATION\""
            - "GET /poverty-guidelines with limit 100 succeeds and returns total_count == 1"

      - name: scope_change_request_type_and_target_pairing_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 9]
          - errors[ERR_SCOPE_TARGET_MISMATCH]
          - endpoints[POST /health-centers/{id}/scope-change-requests]
          - entities.ScopeChangeRequest.fields.request_type
        distinguishing_aspect: >-
