    roles: [FederalProgramsDirector]
    code: 200
    input: ["decision_note?"]
    output: BudgetAmendment
    side_effects: ["status APPROVED -> VOIDED; prior_amounts restored; increments DistrictGrant.version by 1"]

  # --- MonitoringVisit / MonitoringFinding ---
  - method: POST
    path: "/title-i/monitoring-visits"
    description: "Schedule an SEA monitoring visit (closed day-interval; overlap with another visit of the same grant rejected)"
    roles: [SEAMonitor]
    code: 201
    input: [grant_id, visit_start_date, visit_end_date, scope]
    output: MonitoringVisit
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/title-i/monitoring-visits"
    description: "List visits (FK reverse lookup from DistrictGrant)"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: ["grant_id?", "status?", "limit?", "offset?"]
    output: "MonitoringVisit[]"
    side_effects: []
  - method: GET
    path: "/title-i/monitoring-visits/{id}"
    description: "Get one visit"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: []
    output: MonitoringVisit
    side_effects: []
  - method: POST
    path: "/title-i/monitoring-visits/{id}/start"
    description: "Begin the visit (clock date must be inside the visit window)"
    roles: [SEAMonitor]
    code: 200
    input: []
    output: MonitoringVisit
    side_effects: ["status SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/title-i/monitoring-visits/{id}/issue-report"
    description: "Issue the monitoring report; zero-finding visits auto-close"
    roles: [SEAMonitor]
    code: 200
    input: []
    output: MonitoringVisit
    side_effects: ["status IN_PROGRESS -> REPORT_ISSUED; if no findings exist, immediately -> CLOSED and monitoring_clearance recomputed"]
  - method: POST
    path: "/title-i/monitoring-findings"
    description: "Record a finding on an in-progress visit"
    roles: [SEAMonitor]
    code: 201
    input: [visit_id, citation, severity, description, cap_due_date]
    output: MonitoringFinding
    side_effects: ["status OPEN; grant.monitoring_clearance recomputed; grant.version += 1"]
  - method: GET
    path: "/title-i/monitoring-findings"
    description: "List findings (FK reverse lookup from MonitoringVisit)"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: ["visit_id?", "status?", "severity?", "limit?", "offset?"]
    output: "MonitoringFinding[]"
    side_effects: []
  - method: GET
    path: "/title-i/monitoring-findings/{id}"
    description: "Get one finding"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
    code: 200
    input: []
    output: MonitoringFinding
    side_effects: []
  - method: POST
    path: "/title-i/monitoring-findings/{id}/submit-cap"
    description: "Submit a corrective action plan (from OPEN, ESCALATED, or CAP_RETURNED — revision cycle)"
    roles: [ComplianceAnalyst, FederalProgramsDirector]
    code: 200
    input: [cap_narrative]
    output: MonitoringFinding
    side_effects: ["status -> CAP_SUBMITTED; cap_attempt_count += 1; cap_submitted_by_user_id recorded"]
  - method: POST
    path: "/title-i/monitoring-findings/{id}/accept-cap"
    description: "SEA accepts the CAP; last terminal finding auto-closes the visit and recomputes grant clearance (depth-3 bubble-up)"
    roles: [SEAMonitor]
    code: 200
    input: []
    output: MonitoringFinding
    side_effects: ["status CAP_SUBMITTED -> VERIFIED; visit may auto-close; grant.monitoring_clearance recomputed"]
  - method: POST
    path: "/title-i/monitoring-findings/{id}/return-cap"
    description: "SEA returns the CAP for rework (revision loop)"
    roles: [SEAMonitor]
    code: 200
    input: [return_note]
    output: MonitoringFinding
    side_effects: ["status CAP_SUBMITTED -> CAP_RETURNED"]
  - method: POST
    path: "/title-i/monitoring-findings/{id}/close-no-action"
    description: "SEA closes an OBSERVATION-severity finding without corrective action"
    roles: [SEAMonitor]
    code: 200
    input: []
    output: MonitoringFinding
    side_effects: ["status OPEN -> CLOSED_NO_ACTION; visit bubble-up check"]

  # --- Test-driving clock ---
  - method: POST
    path: "/title-i/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Setting the clock runs the finding-escalation sweep."
    roles: [FederalProgramsDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, escalated_finding_ids: array }
    side_effects: ["findings with cap_due_date < new date and status in {OPEN, CAP_RETURNED} -> ESCALATED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role may not call this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, type/enum violation, unknown or read-only field, measure mismatch with grant.poverty_measure" }
  - { id: ERR_NARRATIVE_TOO_SHORT, http: 400, condition: "cap_narrative or SNS narrative below the 50-character minimum" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "visit_end_date before visit_start_date, coverage_end_date <= coverage_start_date, or grade_span_low > grade_span_high" }
  - { id: ERR_DUPLICATE_FISCAL_YEAR, http: 409, condition: "A grant already exists for the fiscal year" }
  - { id: ERR_DUPLICATE_SCHOOL_ENTRY, http: 400, condition: "Snapshot entries contain the same school_id twice" }
  - { id: ERR_DUPLICATE_CONSULTATION, http: 409, condition: "A consultation already exists for this (grant_id, private_school_id)" }
  - { id: ERR_GRANT_INVALID_STATE, http: 409, condition: "Grant status does not permit the operation" }
  - { id: ERR_SNAPSHOT_NOT_CERTIFIABLE, http: 409, condition: "Snapshot is not DRAFT" }
  - { id: ERR_NO_CERTIFIED_SNAPSHOT, http: 409, condition: "lock-rankings requires a CERTIFIED snapshot" }
  - { id: ERR_ALLOCATION_NOT_PENDING, http: 409, condition: "Allocation certification requires status PENDING" }
  - { id: ERR_ALLOCATION_NOT_CERTIFIED, http: 409, condition: "Operation requires the school allocation to be CERTIFIED" }
  - { id: ERR_SNS_NOT_SUBMITTABLE, http: 409, condition: "SNS document not in DRAFT/RETURNED/STALE" }
  - { id: ERR_SNS_NOT_REVIEWABLE, http: 409, condition: "SNS document not in SUBMITTED" }
  - { id: ERR_CONSULTATION_INVALID_STATE, http: 409, condition: "Consultation status does not permit the operation" }
  - { id: ERR_INSUFFICIENT_CONSULTATION_SESSIONS, http: 409, condition: "sign-affirmation requires sessions_count >= 2" }
  - { id: ERR_EXPENDITURE_NOT_REVIEWABLE, http: 409, condition: "Expenditure not in PENDING_REVIEW" }
  - { id: ERR_EXPENDITURE_NOT_RECLASSIFIABLE, http: 409, condition: "Expenditure not in DISALLOWED" }
  - { id: ERR_AMENDMENT_INVALID_STATE, http: 409, condition: "Amendment status does not permit the operation" }
  - { id: ERR_VISIT_INVALID_STATE, http: 409, condition: "Visit status does not permit the operation" }
  - { id: ERR_VISIT_NOT_ACCEPTING_FINDINGS, http: 409, condition: "Findings may only be created while the visit is IN_PROGRESS" }
  - { id: ERR_FINDING_INVALID_STATE, http: 409, condition: "Finding status (or severity, for close-no-action) does not permit the operation" }
  - { id: ERR_WAIVER_INVALID_STATE, http: 409, condition: "Waiver request/decision not permitted in the current carryover_waiver_status" }
  - { id: ERR_STALE_GRANT_VERSION, http: 412, condition: "expected_grant_version does not match the grant's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Decider X-User-ID equals the submitter's — same person cannot perform both steps" }
  - { id: ERR_SUPPLANT_RISK_UNRESOLVED, http: 403, condition: "supplant_screen=true expenditure without an ACCEPTED SNS document for the allocation" }
  - { id: ERR_OPEN_FINDINGS_BLOCK_CLOSEOUT, http: 409, condition: "Close-out blocked by non-terminal monitoring findings" }
  - { id: ERR_SNAPSHOT_INCOMPLETE_COVERAGE, http: 422, condition: "Snapshot entries do not cover every active school exactly once" }
  - { id: ERR_PRIVATE_SCHOOL_NOT_VERIFIED, http: 422, condition: "Consultation requires nonprofit_verified == true" }
  - { id: ERR_CONSULTATION_INCOMPLETE, http: 409, condition: "CONSULTATION_AGREED grant cannot finalize while a verified private school lacks an AFFIRMATION_SIGNED consultation" }
  - { id: ERR_CHARGE_TARGET_AMBIGUOUS, http: 400, condition: "Expenditure must name exactly one of school_allocation_id / set_aside_id" }
  - { id: ERR_FUNCTION_TARGET_MISMATCH, http: 400, condition: "function_code inconsistent with the charge target type/category" }
  - { id: ERR_SCHOOL_LOCKED_BY_SNAPSHOT, http: 409, condition: "Cannot deactivate a school present in a CERTIFIED snapshot" }
  - { id: ERR_COST_OUTSIDE_FISCAL_PERIOD, http: 422, condition: "incurred_date outside the grant's funds period" }
  - { id: ERR_SESSION_DATE_IN_FUTURE, http: 422, condition: "session_date after the current logical clock date" }
  - { id: ERR_VISIT_WINDOW_MISSED, http: 409, condition: "Clock date outside [visit_start_date, visit_end_date] at start" }
  - { id: ERR_MONITORING_VISIT_OVERLAP, http: 409, condition: "Closed day-interval of the new visit intersects another visit of the same grant (shared boundary day counts as overlap)" }
  - { id: ERR_SNS_WINDOW_OVERLAP, http: 409, condition: "Half-open coverage window [start, end) intersects an existing window on the same allocation (touching endpoints do not overlap)" }
  - { id: ERR_SET_ASIDE_BELOW_MINIMUM, http: 422, condition: "reserved_cents would drop below minimum_cents" }
  - { id: ERR_AMENDMENT_NOT_NET_ZERO, http: 400, condition: "Sum of (new_amount_cents - current value) over amendment lines is not zero" }
  - { id: ERR_AMENDMENT_BELOW_LIQUIDATED, http: 422, condition: "Amendment would push a target below its liquidated (+pending) floor" }
  - { id: ERR_INSUFFICIENT_ALLOCATION_BALANCE, http: 402, condition: "Charge exceeds the target's remaining balance (allocation/reserved minus ALLOWED minus PENDING_REVIEW)" }
  - { id: ERR_CARRYOVER_WITHIN_LIMIT, http: 409, condition: "Waiver requested although provisional carryover is within the 15% limit" }
  - { id: ERR_CARRYOVER_WAIVER_WITHIN_3_YEARS, http: 409, condition: "A GRANTED waiver exists in one of the three prior fiscal years" }
  - { id: ERR_CARRYOVER_LIMIT_EXCEEDED, http: 422, condition: "Close-out carryover exceeds 1500 bp without a GRANTED waiver" }
  - { id: ERR_UNRESOLVED_EXPENDITURES, http: 409, condition: "Close-out blocked by PENDING_REVIEW expenditures" }
  - { id: ERR_UNRESOLVED_AMENDMENTS, http: 409, condition: "Close-out blocked by DRAFT/SUBMITTED amendments" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FederalProgramsDirector
    description: "District federal programs director — owns the grant lifecycle, rankings lock, allocation certification, allowable-cost and SNS review, amendment approval, waiver requests, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /title-i/grants, lock-rankings, finalize-allocations, close-out"
      - "POST /title-i/grants/{id}/request-carryover-waiver"
      - "POST /title-i/poverty-snapshots/{id}/certify"
      - "POST /title-i/school-allocations/{id}/certify"
      - "POST /title-i/set-asides/{id}/adjust"
      - "POST /title-i/expenditures/{id}/review"
      - "POST /title-i/supplement-documentation/{id}/review"
      - "POST /title-i/budget-amendments/{id}/approve, /reject, /void"
      - "POST /title-i/_clock/set_current_utc"
    shared_operations:
      - "POST /title-i/supplement-documentation (+/submit) — shared with ComplianceAnalyst"
      - "POST /title-i/budget-amendments (+/submit) — shared with ComplianceAnalyst"
      - "POST /title-i/monitoring-findings/{id}/submit-cap — shared with ComplianceAnalyst"
      - "all GET endpoints"
  - name: ComplianceAnalyst
    description: "District federal programs analyst — registers schools, builds snapshots, files SNS documentation and expenditures, drafts amendments and CAPs, logs consultation sessions"
    identity: opaque
    exclusive_operations:
      - "POST /title-i/schools, PATCH /title-i/schools/{id}"
      - "POST /title-i/private-schools"
      - "POST /title-i/poverty-snapshots"
      - "POST /title-i/expenditures, POST /title-i/expenditures/{id}/reclassify"
      - "POST /title-i/equitable-services-consultations (+/record-session)"
    shared_operations:
      - "POST /title-i/supplement-documentation (+/submit) — shared with FederalProgramsDirector"
      - "POST /title-i/budget-amendments (+/submit) — shared with FederalProgramsDirector"
      - "POST /title-i/monitoring-findings/{id}/submit-cap — shared with FederalProgramsDirector"
      - "all GET endpoints"
  - name: SEAMonitor
    description: "State education agency monitor — schedules and conducts monitoring visits, issues findings, adjudicates CAPs, decides carryover waivers, resolves private-school complaints"
    identity: opaque
    exclusive_operations:
      - "POST /title-i/monitoring-visits (+/start, /issue-report)"
      - "POST /title-i/monitoring-findings (+/accept-cap, /return-cap, /close-no-action)"
      - "POST /title-i/grants/{id}/decide-carryover-waiver"
      - "POST /title-i/equitable-services-consultations/{id}/resolve-complaint"
    shared_operations:
      - "all GET endpoints"
  - name: PrivateSchoolOmbudsman
    description: "Private-school ombudsman — signs equitable-services affirmations, raises disputes, files SEA complaints"
    identity: opaque
    exclusive_operations:
      - "POST /title-i/equitable-services-consultations/{id}/sign-affirmation"
      - "POST /title-i/equitable-services-consultations/{id}/dispute"
      - "POST /title-i/equitable-services-consultations/{id}/file-complaint"
    shared_operations:
      - "all GET endpoints"
