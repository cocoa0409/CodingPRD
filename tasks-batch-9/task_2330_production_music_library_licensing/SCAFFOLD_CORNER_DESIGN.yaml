            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Nadia Okoro" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Harbour Lights", duration_sec: 180, tempo_bpm: 130, genre: "CINEMATIC", mood_tags: ["EPIC"], instrumentation: ["STRINGS"] }
              as: CatalogAdmin
              captures: { compA: $.data.id }
            - call: "POST /music-library/compositions/${compA}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/license-tiers"
              payload: { code: "FILM-NAT", media_type: "FILM", allowed_scales: ["NATIONAL"], base_rate_cents: 600000, min_term_months: 6, max_term_months: 24 }
              as: CatalogAdmin
              captures: { t1: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Northwind Pictures", licensee_type: "PRODUCTION_COMPANY", credit_limit_cents: 10000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
          trigger:
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${compA}", licensee_id: "${lee1}", tier_id: "${t1}", media_type: "FILM", distribution_scale: "WORLDWIDE", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12 }
