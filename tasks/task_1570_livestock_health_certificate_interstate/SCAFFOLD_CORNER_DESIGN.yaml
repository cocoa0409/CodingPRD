            - "planned_ship_date 2026-09-09 (> permit valid_until 2026-09-08) -> error_id == 'ERR_MOVEMENT_OUTSIDE_PERMIT_WINDOW' at scheduling"
            - "planned_ship_date 2026-08-10 (< permit valid_from 2026-08-11) -> error_id == 'ERR_MOVEMENT_OUTSIDE_PERMIT_WINDOW' at scheduling"
            - "planned_ship_date 2026-08-11 == valid_from (inclusive) -> record SCHEDULED"
            - "depart at clock 2026-08-10 (< valid_from) -> error_id == 'ERR_MOVEMENT_OUTSIDE_PERMIT_WINDOW'"
            - "depart at clock 2026-08-11 == valid_from -> status 'IN_TRANSIT'"

      - name: zone_invalid_transition_matrix
        claim_type: invalid_transition
        grounds:
          - state_machines.OutbreakZone.MONITORING_to_ACTIVE
          - state_machines.OutbreakZone.ACTIVE_to_CONTAINED
          - state_machines.OutbreakZone.MONITORING_to_RESOLVED
          - errors[ERR_ZONE_INVALID_TRANSITION]
        distinguishing_aspect: |
          The zone machine's guards are exhaustive: contain requires ACTIVE,
          resolve forbids ACTIVE, and RESOLVED is terminal for every action; a
          direct MONITORING -> RESOLVED arc is legal (no holds to restore).
        test_recipe:
          setup:
            - "Zone Z1 (Colusa, AVIAN_INFLUENZA, POULTRY) effective 2026-08-01 open-ended; no premises registered"
          setup_api_calls:
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "MODERATE", effective_from: "2026-08-01T00:00:00Z" }
              as: StateVetOfficer
              captures: { z1: $.data.id }
          trigger:
            - call: "POST /api/outbreak-zones/${z1}/contain"
              as: StateVetOfficer
              captures: { err_c1: $.data.error_id }
            - call: "POST /api/outbreak-zones/${z1}/escalate"
              as: StateVetOfficer
              captures: { st_a: $.data.status }
            - call: "POST /api/outbreak-zones/${z1}/resolve"
              as: StateVetOfficer
              captures: { err_r1: $.data.error_id }
            - call: "POST /api/outbreak-zones/${z1}/contain"
              as: StateVetOfficer
              captures: { st_c: $.data.status }
            - call: "POST /api/outbreak-zones/${z1}/resolve"
              as: StateVetOfficer
              captures: { st_r: $.data.status }
            - call: "POST /api/outbreak-zones/${z1}/escalate"
              as: StateVetOfficer
              captures: { err_e2: $.data.error_id }
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "LOW", effective_from: "2026-08-05T00:00:00Z", effective_until: "2026-08-20T00:00:00Z" }
              as: StateVetOfficer
              captures: { z2: $.data.id }
            - call: "POST /api/outbreak-zones/${z2}/resolve"
              as: StateVetOfficer
              captures: { st_r2: $.data.status }
          assert:
            - "contain from MONITORING -> error_id == 'ERR_ZONE_INVALID_TRANSITION' (409)"
            - "escalate from MONITORING -> 'ACTIVE'"
            - "resolve from ACTIVE -> error_id == 'ERR_ZONE_INVALID_TRANSITION' (resolve allows only MONITORING/CONTAINED)"
            - "contain from ACTIVE -> 'CONTAINED'; resolve from CONTAINED -> 'RESOLVED'"
            - "escalate from RESOLVED -> error_id == 'ERR_ZONE_INVALID_TRANSITION' (terminal lockdown)"
            - "Z2 resolves directly from MONITORING -> 'RESOLVED' (direct arc exists)"

      - name: quarantine_lift_segregation_of_duties
        claim_type: precondition_enforcement
        grounds:
          - state_machines.QuarantineOrder.ACTIVE_to_LIFTED
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.QuarantineOrder.fields.issued_by_user_id
        distinguishing_aspect: |
          Segregation of duties: the officer whose X-User-ID was stamped as
          issued_by_user_id cannot lift their own order (ERR_SEGREGATION_OF_DUTIES,
          403), while a different officer can — and the lift restores the
          premises to MONITORED.
        test_recipe:
          setup:
            - "Premises P (Yolo CATTLE) under an ACTIVE quarantine order issued by officer-a"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch S19", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-15T00:00:00Z", reason: "TRACE_EXPOSURE" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { q_id: $.data.id, issuer: $.data.issued_by_user_id }
          trigger:
            - call: "POST /api/quarantine-orders/${q_id}/lift"
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { err_sod: $.data.error_id }
            - call: "GET /api/premises/${prem_id}"
              as: StateAuditor
              captures: { prem_mid: $.data.disease_status }
            - call: "POST /api/quarantine-orders/${q_id}/lift"
              as: StateVetOfficer
              as_user_id: "officer-b"
              captures: { q_status: $.data.status }
            - call: "GET /api/premises/${prem_id}"
              as: StateAuditor
              captures: { prem_end: $.data.disease_status }
          assert:
            - "QuarantineOrder.${q_id}.issued_by_user_id == 'officer-a' (stamped from X-User-ID at creation)"
            - "Lift by officer-a -> error_id == 'ERR_SEGREGATION_OF_DUTIES' with HTTP 403; order stays ACTIVE"
            - "Premises remains 'QUARANTINE_HOLD' after the denied lift"
            - "Lift by officer-b -> status 'LIFTED'; premises disease_status restored to 'MONITORED'"

      - name: quarantine_lift_twice_rejected
