            - { call: "POST /mill/green-receipts/${r_oak}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r_maple}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r_oak}" }, as: KilnOperator }
          assert:
            - "HARD_MAPLE receipt: status 422 with data.error_id == \"ERR_SPECIES_MISMATCH\"; the receipt stays \"ACCEPTED\" with kiln_charge_id == null."
            - "The charge still shows charged_green_bf == 0 and weighted_initial_moisture_pct == null after the rejection."
            - "RED_OAK receipt: status 200 with data.charged_green_bf == 5800 and data.weighted_initial_moisture_pct == 46.0."

