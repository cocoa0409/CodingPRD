# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2964
# Restaurant Group Purchasing Organization & Rebate Administration
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Deleting this file
# leaves the declared behavior identical.
#
# Shared fixture vocabulary used by the chains below (all literals):
#   ProgramTier ELITE  : member_share 7500 / retention 2500 / admin_low 300 /
#                        admin_high 150 / compliance_min 8000 / markup_cap 700 /
#                        dispute_window 45 / reversal_posture_limit 1
#   Distributor METRO-01 : contracted_markup_bps 900  (so min(900,700) = 700)
#   Member Harbor Grill  : committed_annual_spend_cents 20000000
#   Deal PBC-2026        : 2026-01-01..2026-12-31, required_purchase_window_days 60
#   Item BEEF-PATTY-4OZ-CS40 : pack 40, baseline 9800, contract 8900
#   TIERED card          : [{0,120},{50,180},{200,250}] 2026-01-01..2028-12-31
#   FLAT card            : PER_CASE 150 cents            2026-01-01..2028-12-31
#   Logical clock        : left at its 2026-08-01T00:00:00Z default unless a
#                          chain calls POST /_clock/set_current_utc explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: accrual_marginal_batch_vs_blended_period_rebase
        grounds:
          - calculations.rebate_gross
          - calculations.rebate_split
          - entities.RebateAccrual.fields.basis
          - entities.RebateAccrual.fields.final_adjustment_cents
          - state_machines.RebateAccrual.VALIDATED_to_PAID
          - endpoints["POST /manufacturer-deals/{deal_id}/close-period"]
        distinguishing_aspect: |
          Entity domain = rebate accrual arithmetic on RebateAccrual: the SAME
          three purchase lines yield gross 3600 + 6000 + 13200 = 22800 cents
          under the accrue-time MARGINAL_BATCH variant (tier ladder restarts per
          batch, straddling lines split across rates) and 5400 + 7200 + 16200 =
          28800 cents under the close-time BLENDED_PERIOD variant (one 180
          cents/case rate chosen from the period-wide 160-case total and applied
          to every case), a divergence of exactly 6000 cents on identical data.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01 (markup 900 bps), Member Harbor Grill ACTIVE with a countersigned PURCHASE_DATA_AND_PRICING letter."
            - "Deal PBC-2026 ACTIVE with item BEEF-PATTY-4OZ-CS40 carrying one APPROVED TIERED_VOLUME card [{0,120},{50,180},{200,250}]."
            - "Batch METRO-2026-06 (June) holds two matched lines of 30 and 40 cases; batch METRO-2026-07 (July) holds one matched line of 90 cases."
            - "Both batches are normalization_status == ACCRUED, so three accruals exist with basis == MARGINAL_BATCH and gross 3600, 6000 and 13200 cents."
            - "Member counters after both accruals: accrued_member_share_cents 16587, attributed_gpo_retention_cents 5529, attributed_admin_fee_cents 684; ytd_net_snapshot_cents still 0, so the low admin band (300 bps) is frozen on every accrual."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "TIERED_VOLUME", tier_breaks: [{ min_cases: 0, rate_cents_per_case: 120 }, { min_cases: 50, rate_cents_per_case: 180 }, { min_cases: 200, rate_cents_per_case: 250 }], effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 40, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8540, invoice_date: "2026-06-18" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /purchase-batches/${b1_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b1_id}/accrue"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-07-01", period_end: "2026-07-31", source_reference: "METRO-2026-07" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b2_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 90, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-07-10" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l3_id: $.data.id }
            - call: "POST /purchase-batches/${b2_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b2_id}/accrue"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "GET /accruals"
              payload: { purchase_line_id: "${l1_id}" }
              as: RebateAnalyst
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /accruals"
              payload: { purchase_line_id: "${l2_id}" }
              as: RebateAnalyst
              captures: { a2_id: "$.data[0].id" }
            - call: "GET /accruals"
              payload: { purchase_line_id: "${l3_id}" }
              as: RebateAnalyst
              captures: { a3_id: "$.data[0].id" }
          trigger:
            - call: "POST /manufacturer-deals/${deal_id}/close-period"
              payload: { period_start: "2026-06-01", period_end: "2026-07-31" }
              as: GpoAdmin
          assert:
            - "RebateAccrual.${a1_id}.basis == BLENDED_PERIOD"
            - "RebateAccrual.${a1_id}.gross_rebate_cents == 5400 (was 3600 under MARGINAL_BATCH)"
            - "RebateAccrual.${a1_id}.final_adjustment_cents == 1800"
            - "RebateAccrual.${a1_id}.admin_fee_bps_applied == 300 and admin_fee_cents == 162"
            - "RebateAccrual.${a1_id}.net_distributable_cents == 5238, member_share_cents == 3929, gpo_retention_cents == 1309"
            - "RebateAccrual.${a2_id}.gross_rebate_cents == 7200, final_adjustment_cents == 1200, admin_fee_cents == 216, member_share_cents == 5238, gpo_retention_cents == 1746"
            - "RebateAccrual.${a3_id}.gross_rebate_cents == 16200, final_adjustment_cents == 3000, admin_fee_cents == 486, member_share_cents == 11786, gpo_retention_cents == 3928"
            - "Member.${m1_id}.accrued_member_share_cents == 20953 (was 16587 before close-period)"
            - "Member.${m1_id}.attributed_gpo_retention_cents == 6983 (was 5529)"
            - "Member.${m1_id}.attributed_admin_fee_cents == 864 (was 684)"
            - "Member.${m1_id}.ytd_net_snapshot_cents == 27936"
            - "RebateAccrual.${a1_id}.status == ACCRUED and RebateAccrual.${a3_id}.status == ACCRUED (none was VALIDATED, so close-period pays nothing)"

      - name: savings_report_as_purchased_vs_full_basket_opportunity
        grounds:
          - calculations.savings_realized_vs_opportunity
          - entities.ContractedItem.fields.baseline_unit_cost_cents
          - entities.ContractedItem.fields.contract_unit_cost_cents
          - entities.PurchaseLine.fields.match_status
          - endpoints["GET /members/{member_id}/savings-report"]
        distinguishing_aspect: |
          Entity domain = member-facing savings reporting on Member, not accrual
          arithmetic: with identical stored data the AS_PURCHASED basis counts
          only the 70 MATCHED cases and reports opportunity_cents 63000 /
          capture_rate_bps 8441, while FULL_BASKET additionally prices the 20
          EXCLUDED fries cases and reports opportunity_cents 75000 /
          capture_rate_bps 7091; realized_cents is 53184 under both.
        test_recipe:
          setup:
            - "The dual_variant_calc TIERED fixture through the June batch, accrued: two matched beef lines of 30 and 40 cases at 9140 cents invoiced against baseline 9800 / contract 8900, giving member_share 2619 + 4365 = 6984 cents."
            - "A second deal PBF-2026 is left in DRAFT and carries item FRIES-SHOESTRING-CS30 (baseline 8100, contract 7500)."
            - "The June batch also holds a 20-case fries line at 8300 cents that normalization marked EXCLUDED with accrual_block_reason == DEAL_NOT_ACTIVE, because its only key candidate sits under the DRAFT deal."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "TIERED_VOLUME", tier_breaks: [{ min_cases: 0, rate_cents_per_case: 120 }, { min_cases: 50, rate_cents_per_case: 180 }, { min_cases: 200, rate_cents_per_case: 250 }], effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Fries Co", deal_code: "PBF-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal2_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal2_id}", manufacturer_sku: "PBF-FRY-SS", normalized_item_key: "FRIES-SHOESTRING-CS30", pack_size: 30, baseline_unit_cost_cents: 8100, contract_unit_cost_cents: 7500 }
              as: GpoAdmin
              captures: { item2_id: $.data.id }
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 40, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8540, invoice_date: "2026-06-18" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-71004", vendor_item_description: "Shoestring fries 30lb", normalized_item_key_reported: "FRIES-SHOESTRING-CS30", cases_shipped: 20, invoice_unit_cost_cents: 8300, distributor_base_cost_cents: 7500, invoice_date: "2026-06-20" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l4_id: $.data.id }
            - call: "POST /purchase-batches/${b1_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b1_id}/accrue"
              as: RebateAnalyst
              as_user_id: "analyst-01"
          trigger:
            - call: "GET /members/${m1_id}/savings-report"
              payload: { period_start: "2026-06-01", period_end: "2026-06-30", basis: "AS_PURCHASED" }
              as: MemberOperator
              as_user_id: "${m1_id}"
            - call: "GET /members/${m1_id}/savings-report"
              payload: { period_start: "2026-06-01", period_end: "2026-06-30", basis: "FULL_BASKET" }
              as: MemberOperator
              as_user_id: "${m1_id}"
          assert:
            - "PurchaseLine.${l4_id}.match_status == EXCLUDED and accrual_block_reason == DEAL_NOT_ACTIVE"
            - "AS_PURCHASED response: realized_cents == 53184, opportunity_cents == 63000, missed_opportunity_cents == 9816, capture_rate_bps == 8441"
            - "FULL_BASKET response: realized_cents == 53184, opportunity_cents == 75000, missed_opportunity_cents == 21816, capture_rate_bps == 7091"
            - "Both responses: matched_cases == 70, unmatched_cases == 20, invoice_spend_cents == 805800, rebate_member_share_cents == 6984, recovery_credit_cents == 0"
            - "The two responses differ ONLY in basis, opportunity_cents, missed_opportunity_cents and capture_rate_bps"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: mode_a_nested_tier_ladder_straddle_and_card_selection
        mode: a
        grounds:
          - calculations.rate_card_selection
          - calculations.rebate_gross
          - entities.RateCard.fields.tier_breaks
          - entities.RebateAccrual.fields.rate_card_id
          - endpoints["POST /purchase-batches/{batch_id}/accrue"]
        distinguishing_aspect: |
          Mode (a) — nested conditional selection. Two conditionals nest: first
          rate_card_selection picks a card (APPROVED, effective window covering
          invoice_date, not SUPERSEDED, highest effective_from), then inside the
          chosen card the tier ladder is walked per case, so the 40-case line
          STRADDLES the 50-case break and is paid 20 cases at 120 plus 20 cases
          at 180 = 6000, not 40*120 = 4800 and not 40*180 = 7200. A superseded
          card with a fatter 200 cents/case rate exists and must be ignored.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01, Member Harbor Grill ACTIVE with a countersigned letter."
            - "Deal PBC-2026 ACTIVE with item BEEF-PATTY-4OZ-CS40."
            - "Two APPROVED cards on that item: an old flat PER_CASE 200 card for 2025-01-01..2025-12-31 (window does not cover June 2026) and the TIERED_VOLUME card [{0,120},{50,180},{200,250}] for 2026-01-01..2028-12-31."
            - "June batch NORMALIZED with two MATCHED lines of 30 then 40 cases (invoice dates 2026-06-05 and 2026-06-18, so the ladder order is deterministic)."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 200, effective_from: "2025-01-01", effective_to: "2025-12-31" }
              as: GpoAdmin
              captures: { old_rc_id: $.data.id }
            - call: "POST /rate-cards/${old_rc_id}/approve"
              as: GpoAdmin
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v2: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "TIERED_VOLUME", tier_breaks: [{ min_cases: 0, rate_cents_per_case: 120 }, { min_cases: 50, rate_cents_per_case: 180 }, { min_cases: 200, rate_cents_per_case: 250 }], effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
