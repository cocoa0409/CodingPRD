              as: AccountHolder
              as_user_id: "${b_id}"
              captures: { child_b: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${b_id}", plan_id: "${plan_id}", child_id: "${child_b}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${b_id}"
              captures: { sub_b: $.data.id }
            - call: "POST /subscriptions/${sub_b}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${b_id}"
            - call: "POST /subscriptions/${sub_b}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { cb1: $.data.id }
            - call: "POST /cycles/${cb1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /cycles/${cb1}/lock"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${cb1}/charge"
              payload: {}
              as: OpsAdmin
            - call: "POST /cycles/${cb1}/dispatch"
              payload: { service_level: "STANDARD" }
