          assert:
            - "${e_type} == ${e_claim} == ${e_twice} == \"ERR_ENTRY_NOT_REVERSIBLE\", all at HTTP 422"
            - "the accepted reversal returns HTTP 200 with ${paidA} == 0, ${resA} == 1518000 and ${incA} == 1518000 - the payment and its reversal are a no-op on all four money fields"
            - "${rows} == 3 - INITIAL, PAYMENT and PAYMENT_REVERSAL; none of the three refusals appended a journal row"
            - "GET /warranty/reserve-entries with reversed_entry_id=${ePayA} returns total_count == 1 - the reversal names the entry it undid"
            - "Claim.${cB}.paid_cents == 100000 - the sibling claim was never touched by the probe that named its payment"

      - name: reserve_entry_guards_refuse_a_second_initial_and_an_authorisation_below_the_paid_amount
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_74
          - validations.priority_75
          - errors[ERR_INITIAL_RESERVE_ALREADY_SET]
          - errors[ERR_AUTHORIZATION_BELOW_DISBURSED]
        distinguishing_aspect: "The two reserve-entry guards fire on opposite sides of the journal: a second INITIAL is refused because the claim already carries one, and an ADJUSTMENT of 400000 is refused because 500000 has already been disbursed - while an ADJUSTMENT of 600000 is accepted and rewrites the reserve target rather than adding to it."
