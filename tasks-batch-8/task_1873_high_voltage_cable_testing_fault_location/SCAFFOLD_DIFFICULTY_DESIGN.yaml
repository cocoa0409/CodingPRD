            - { call: "POST /cable-diagnostics/test-series/${s1}/evaluate", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/test-series/${s1}/faults", as: TestSupervisor, captures: { f1: "$.data[0].id" } }
            - { call: "POST /cable-diagnostics/faults/${f1}/pinpoint", payload: { trace_time_us: 20.0, pinpoint_method: "PULSE_ECHO" }, as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s2: "$.data.id" } }
            - { call: "POST /cable-diagnostics/test-series/${s2}/energize", as: TestSupervisor }
