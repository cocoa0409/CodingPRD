ans the allocation was tied to a now-cancelled item but had been delivered against — a contractually unusual case (delivery happened against an item that then got cancelled, e.g., partial delivery before a late-day cancellation due to weather), but the §1.1 FulfilmentLog.event_type enum lists PROGRAM_VOIDED specifically for the cascade case, and the §1.5 void-delivery endpoint description notes 'the units field defaults to the allocation's current delivered_units' — so a PROGRAM_VOIDED row with units = pre-cascade delivered_units is the cascade-variant of the manual-void with units = current delivered_units.  The two variants have the same arithmetic on the net-delivered-units counter and the same effect on the tier_remaining_quota.  The test's cascade-variant assertion is therefore that the rule-9-B invariant holds across the deliver-then-cascade-void-via-ProgramItem-cancel chain, with the cascade's PROGRAM_VOIDED row playing the role that the manual VOIDED row plays in the manual round-trip.  Concretely, in the cascade variant: deliver 2 units on A_main_2 while P_perf2 is in some delivery-eligible state (we'd need a state-machine where the deliver is valid before the cancel — but the §1.2 deliver-precondition is 'tied ProgramItem.status == PERFORMED', so the only way to have a delivered-and-then-cancelled allocation is if the cancel happens after the PERFORMED transition, which the §1.2 ProgramItem's CANCELLED transition's from-list disallows.  So in this scaffold, the cascade-variant PROGRAM_VOIDED with non-zero magnitude is not reachable through the public API — the cascade only fires from a CANCEL on a {PROPOSED, CONFIRMED, ANNOUNCED} item, none of which is a deliver-eligible state, so the allocation's delivered_units is zero at the moment of the cascade and the PROGRAM_VOIDED row's units is zero.  The cascade-variant therefore exercises the zero-magnitude case of rule-9-B's invariant, where the deliver was a no-op (delivered_units never moved from zero) and the cascade-void is also a no-op (a PROGRAM_VOIDED row of units=0 doesn't change the net-counter).  The conserved quantity is trivially preserved across the zero-magnitude apply-and-compensate pair.  For the non-trivial-magnitude case, the manual /void-delivery path of the main test variant is the only reachable path, and the test relies on it as the primary evidence of the rule-9-B conservation.  The cascade-variant's zero-magnitude observation is a supporting completeness check that the PROGRAM_VOIDED event_type's bookkeeping arithmetic is symmetric with the VOIDED event_type's bookkeeping, both feeding into the same `Σ DELIVERED − Σ (VOIDED + PROGRAM_VOIDED)` net-counter formula in §1.3.  Together the two variants cover the full surface of the void compensation."
