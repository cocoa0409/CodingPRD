            - { call: "POST /sales-planning/ramp-schedules", payload: { name: "Std", multipliers: [0.00, 0.25, 0.50, 0.75, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00] }, as: SalesOpsAdmin, captures: { ramp: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Vet", email: "v@x.com", hire_date: "2025-03-10" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-01-01", ramp_schedule_id: "${ramp}" }, as: SalesOpsAdmin, captures: { asg: $.data.id } }
          assert:
