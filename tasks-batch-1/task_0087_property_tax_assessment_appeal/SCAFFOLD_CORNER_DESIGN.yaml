          setup: ["A CERTIFIED roll R1 and a roll R2 with prior_roll_id=R1."]
          setup_api_calls:
            - call: "POST /tax-rolls"
              payload: { tax_year: 2025, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll1_id: $.data.id }
            - call: "POST /tax-rolls/${roll1_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls/${roll1_id}/certify"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02, prior_roll_id: "${roll1_id}" }
              as: Assessor
              captures: { roll2_id: $.data.id }
          trigger:
            - call: "GET /tax-rolls?prior_roll_id=${roll1_id}"
              payload: {}
              as: Assessor
          assert:
            - "response_type == array; data length == 1; data[0].prior_roll_id == ${roll1_id}"

      - name: fk_reverse_parcels_filtered_by_owner
        claim_type: Listing
        grounds: [endpoints, entities.Parcel.fields.owner_id]
        distinguishing_aspect: "GET /parcels?owner_id={id} returns the Parcel[] owned by that owner (FK reverse-reachability for Parcel.owner_id)."
        test_recipe:
          setup: ["One ACTIVE parcel owned by O."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Fpo Owner", email: "fpo@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-FPO", situs_address: "42 Fpo", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "GET /parcels?owner_id=${owner_id}"
              payload: {}
              as: Assessor
          assert:
            - "response_type == array; data length == 1; data[0].owner_id == ${owner_id}"

      - name: fk_reverse_deferral_owner_via_parcel_list
        claim_type: Listing
        grounds: [endpoints, entities.DeferralAgreement.fields.owner_id]
        distinguishing_aspect: "DeferralAgreement.owner_id reverse-reachability: the agreement is discoverable via GET /parcels/{id}/deferrals (same agreement carries both parcel_id and owner_id); the listed item exposes owner_id for the owner FK."
        test_recipe:
          setup: ["ACTIVE deferral D on parcel P for owner O."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Fdo Owner", email: "fdo@x.com", birth_date: "1950-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-FDO", situs_address: "43 Fdo", is_primary_residence: true }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /deferrals"
              payload: { parcel_id: "${parcel_id}", owner_id: "${owner_id}", annual_interest_rate: 0.05 }
              as: Assessor
              captures: { def_id: $.data.id }
          trigger:
            - call: "GET /parcels/${parcel_id}/deferrals"
              payload: {}
              as: Assessor
          assert:
            - "response_type == array; data[0].owner_id == ${owner_id}; data[0].parcel_id == ${parcel_id}"
