              as: TaxReviewer
              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403); no run created"

      - name: rep_cannot_lock_run
        claim_type: role_denial
        grounds: ["roles[InvestorServicesRep]", "endpoints[POST /funds/allocation-runs/{runId}/lock]"]
        distinguishing_aspect: "InvestorServicesRep (delivery-ops role) cannot lock allocation runs (TaxReviewer-exclusive)."
        test_recipe:
          setup: ["fund with partner; TaxYear BOOKS_CLOSED; one COMPUTED FINAL run"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund RB2", ein: "22-7000002", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "P", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 10000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 1000000, capital_gain_cents: 0, interest_income_cents: 0 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id" }
            - call: "POST /funds/tax-years/${ty}/close-books"
