  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: shutoff_completion_three_hop_cascade
        grounds:
          - state_machines.ServiceOrder.DISPATCHED_to_COMPLETED
          - state_machines.Account.SHUTOFF_PENDING_to_DISCONNECTED
          - state_machines.PremiseMeter.SET_to_LOCKED
        distinguishing_aspect: |
          DEPTH 3: completing the SHUTOFF service order sets ServiceOrder.status=COMPLETED (hop 1);
          that drives Account.service_status=DISCONNECTED (hop 2); that drives PremiseMeter.status=LOCKED
          (hop 3). Each hop is caused by the previous, not by the original call directly.
        test_recipe:
          setup:
            - "RES account past_due 7500, SET meter, SHUTOFF_PENDING with a DISPATCHED SHUTOFF order; no emergency, no moratorium."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-15T00:00:00.000Z", heating_season_active: false }
              as: BillingAdmin
