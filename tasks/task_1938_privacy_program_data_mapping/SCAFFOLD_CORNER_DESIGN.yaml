        distinguishing_aspect: "Approve is LegalCounsel-exclusive: BusinessOwner (the submitter's role) -> 403 ERR_FORBIDDEN_ROLE before any state/SoD logic."
        test_recipe:
          setup: ["manual PIA in TRIGGERED"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
