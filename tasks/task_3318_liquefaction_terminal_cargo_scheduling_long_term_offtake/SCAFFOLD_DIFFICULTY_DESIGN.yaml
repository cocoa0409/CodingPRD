  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (SPA x Train; CargoSlot x ADP)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: spa_commence_requires_commercial_train
        grounds:
          - state_machines.SalesPurchaseAgreement.EXECUTED_to_DELIVERIES_COMMENCED
          - validations[priority=15]
          - errors[ERR_NO_COMMERCIAL_TRAIN]
        distinguishing_aspect: |
          Entity pair SPA x LiquefactionTrain: commence-deliveries is rejected while
          every train is pre-COD, and succeeds once any train reaches
          COMMERCIAL_OPERATION — the SPA's valid transition set depends on train state.
        test_recipe:
          setup:
            - "SPA EXECUTED; one train still in COMMISSIONING (0 of 1 commissioning cargoes recorded)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Mu Energy Partners", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 1 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
          trigger:
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/trains/${tr}/record-commissioning-cargo", payload: { proceeds_usd: 500000 }, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_after: $.data.status } }
          assert:
            - "first commence fails: error_id == ERR_NO_COMMERCIAL_TRAIN"
            - "after COD, second commence succeeds: SalesPurchaseAgreement.${spa}.status == DELIVERIES_COMMENCED"

      - name: vessel_nomination_requires_confirmed_adp
        grounds:
          - state_machines.CargoSlot.SCHEDULED_to_VESSEL_NOMINATED
          - errors[ERR_ADP_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair CargoSlot x AnnualDeliveryProgram (different from SPA x Train):
          a slot in the nominable state SCHEDULED still rejects vessel nomination
          while its parent ADP is PROPOSED; the slot's transition set depends on ADP
          state.
        test_recipe:
          setup:
            - "SPA commenced; ADP PROPOSED (not yet confirmed) with one slot"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Nu Bulk Energy", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id, slot_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
          trigger:
            - { call: "POST /api/cargo-slots/${slot}/vessel-nominations", payload: { vessel_name: "Gas Early", imo_number: "9333001", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ADP_INVALID_STATE"
            - "CargoSlot.${slot}.lift_status == SCHEDULED"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (half-open+buffer berth; closed turnaround)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: berth_window_changeover_buffer_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_BERTH_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open berth windows plus a mandatory 2h changeover
          buffer on resource Berth. An existing window [01-12T00:00, 01-14T00:00)
          accepts a new window starting exactly 01-14T02:00 (2h gap) but rejects one
          starting 01-14T01:00 (1h gap) even though the raw windows do not intersect.
        test_recipe:
          setup:
            - "Berth B1 with ACCEPTED call window 2027-01-12T00:00..2027-01-14T00:00; two further slots with NOMINATED calls"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Xi Gas Distribution", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-20T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot1: $.data.id, slot1_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-20T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot2: $.data.id, slot2_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-20T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot3: $.data.id, slot3_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/berths", payload: { name: "Berth 1", max_loa_m: 320, max_dwt_t: 120000 }, as: TerminalOperator, captures: { berth: $.data.id } }
            - { call: "POST /api/cargo-slots/${slot1}/vessel-nominations", payload: { vessel_name: "Gas One", imo_number: "9444001", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot1_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc1: $.data.id } }
            - { call: "POST /api/vessel-calls/${vc1}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-12T00:00:00Z", window_end: "2027-01-14T00:00:00Z" }, as: MarineScheduler }
            - { call: "POST /api/cargo-slots/${slot2}/vessel-nominations", payload: { vessel_name: "Gas Two", imo_number: "9444002", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot2_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc2: $.data.id } }
            - { call: "POST /api/cargo-slots/${slot3}/vessel-nominations", payload: { vessel_name: "Gas Three", imo_number: "9444003", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot3_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc3: $.data.id } }
          trigger:
            - { call: "POST /api/vessel-calls/${vc2}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-14T01:00:00Z", window_end: "2027-01-15T01:00:00Z" }, as: MarineScheduler, captures: { err: $.data.error_id } }
            - { call: "POST /api/vessel-calls/${vc3}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-14T02:00:00Z", window_end: "2027-01-15T02:00:00Z" }, as: MarineScheduler, captures: { vc3_after: $.data.status } }
          assert:
            - "1h changeover gap rejected: error_id == ERR_BERTH_WINDOW_OVERLAP"
            - "exactly 2h changeover gap accepted: VesselCall.${vc3}.status == ACCEPTED"

      - name: turnaround_closed_interval_touch_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_TURNAROUND_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource (LiquefactionTrain):
          turnaround windows are CLOSED day intervals, so a turnaround starting on the
          day another ends (2027-03-10 vs [03-01..03-10]) counts as overlap, while one
          starting the next day (03-11) is accepted — the opposite of the berth rule,
          where touching endpoints are allowed (with buffer).
        test_recipe:
          setup:
            - "Train with APPROVED turnaround 2027-03-01..2027-03-10"
          setup_api_calls:
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/turnarounds", payload: { planned_start_date: "2027-03-01", planned_end_date: "2027-03-10" }, as: TerminalOperator, as_user_id: "op-1", captures: { ta1: $.data.id } }
          trigger:
            - { call: "POST /api/trains/${tr}/turnarounds", payload: { planned_start_date: "2027-03-10", planned_end_date: "2027-03-20" }, as: TerminalOperator, as_user_id: "op-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/trains/${tr}/turnarounds", payload: { planned_start_date: "2027-03-11", planned_end_date: "2027-03-20" }, as: TerminalOperator, as_user_id: "op-1", captures: { ta2: $.data.id } }
          assert:
            - "touching closed intervals rejected: error_id == ERR_TURNAROUND_OVERLAP"
            - "next-day start accepted: MaintenanceTurnaround.${ta2}.status == PROPOSED"

  # =========================================================================
  # Rule 9 — compensating_invariant (gas balance; contract quantity)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pipeline_day_gas_conservation
        grounds:
          - calculations.prorata_nomination_scaling
          - entities.PipelineDaySchedule.fields.total_nominated_mmbtu
          - entities.PipelineDaySchedule.fields.total_confirmed_mmbtu
          - entities.PipelineDaySchedule.fields.total_cut_mmbtu
        distinguishing_aspect: |
          Conserved quantity: nominated gas. Forward action (close/proration) and its
          compensating action (cancellation-triggered re-proration) both preserve
          total_confirmed + total_cut == total_nominated == 130,000 on the schedule.
