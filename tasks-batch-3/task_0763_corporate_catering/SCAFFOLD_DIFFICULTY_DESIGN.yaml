# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls chain is empty-DB executable.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: session_theoretical_vs_actual_food_cost
        grounds:
          - calculations.theoretical_food_cost
          - calculations.actual_food_cost
          - entities.ServiceSession.fields.theoretical_food_cost_cents
          - entities.ServiceSession.fields.actual_food_cost_cents
          - state_machines.ServiceSession.IN_SERVICE_to_CLOSED
        distinguishing_aspect: "Same session, two algorithms: recipe-based theoretical (400) vs FIFO inventory actual (500) diverge because lot unit_cost_cents (500) != standard_recipe_cost_cents (400); the food-cost domain."
        test_recipe:
          setup:
            - "Site (target 0.32); PUBLISHED cycle with item Combo (price 1000, recipe 400, ENTREE); session IN_SERVICE; one COMPLETED txn of 1 Combo (revenue 1000, theoretical 400); one AVAILABLE COMBO_KIT lot qty 5 @ unit_cost 500."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "Dee Iner" }
              as: SiteAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Combo", category: "ENTREE", price_cents: 1000, standard_recipe_cost_cents: 400 }
              as: CafeteriaManager
              captures: { combo_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "PROTEIN" }
              as: SiteAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "COMBO_KIT", qty: 5, unit_cost_cents: 500 } ] }
              as: CafeteriaManager
              captures: { po_id: $.data.id }
            - call: "POST /api/purchase-orders/${po_id}/issue"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/purchase-orders/${po_id}/receive"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:00:00Z", window_end: "2026-03-02T12:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { sess_id: $.data.id }
            - call: "POST /api/service-sessions/${sess_id}/lock-forecast"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions/${sess_id}/open"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/badge-transactions"
              payload: { employee_id: "${emp_id}", service_session_id: "${sess_id}", lines: [ { menu_item_id: "${combo_id}", qty: 1 } ], payment_method: "BADGE_PAYROLL" }
              as: Diner
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /api/service-sessions/${sess_id}/close"
              payload: { consumed_ingredients: [ { ingredient: "COMBO_KIT", qty: 1 } ] }
              as: CafeteriaManager
              captures: { close_theoretical: $.data.theoretical_food_cost_cents, close_actual: $.data.actual_food_cost_cents }
          assert:
            - "ServiceSession.${sess_id}.theoretical_food_cost_cents == 400"
            - "ServiceSession.${sess_id}.actual_food_cost_cents == 500"
            - "theoretical_food_cost_cents != actual_food_cost_cents (400 vs 500)"

      - name: catering_estimate_vs_final_cost
        grounds:
          - calculations.catering_estimated_cost
          - calculations.catering_final_cost
          - entities.CateringOrder.fields.estimated_cost_cents
          - entities.CateringOrder.fields.final_cost_cents
          - state_machines.CateringOrder.CONFIRMED_to_FULFILLED
        distinguishing_aspect: "Catering domain: overhead-scaled recipe estimate at SUBMIT (288) vs FIFO actual inventory at FULFILL (450) — different entity domain than the session food-cost dual variant."
        test_recipe:
          setup:
            - "Site; PUBLISHED cycle with Wrap & Cup (price 350, recipe 120 each); venue cap 100; KIT lot qty 10 @ 450; order (headcount 25, 1 Wrap + 1 Cup) taken APPROVED then CONFIRMED (reserve KIT 1)."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Cup", category: "SIDE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { cup_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/catering-venues"
              payload: { client_site_id: "${site_id}", name: "Hall A", capacity: 100 }
              as: SiteAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "DRY_GOODS" }
              as: SiteAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "KIT", qty: 10, unit_cost_cents: 450 } ] }
              as: CafeteriaManager
              captures: { po_id: $.data.id }
            - call: "POST /api/purchase-orders/${po_id}/issue"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/purchase-orders/${po_id}/receive"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/catering-orders"
              payload: { client_site_id: "${site_id}", venue_id: "${venue_id}", event_date: "2026-03-10", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T11:00:00Z", headcount: 25, lines: [ { menu_item_id: "${wrap_id}", qty: 1 }, { menu_item_id: "${cup_id}", qty: 1 } ] }
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { order_id: $.data.id }
            - call: "POST /api/catering-orders/${order_id}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { est: $.data.estimated_cost_cents }
            - call: "POST /api/catering-orders/${order_id}/review"
              payload: { decision: "APPROVE" }
              as: CateringApprover
              as_user_id: "appr-1"
            - call: "GET /api/client-sites/${site_id}"
              payload: {}
              as: FinanceController
              captures: { site_v: $.data.version }
            - call: "POST /api/catering-orders/${order_id}/confirm"
              payload: { expected_client_site_version: "${site_v}", reserved_ingredients: [ { ingredient: "KIT", qty: 1 } ] }
              as: FinanceController
          trigger:
            - call: "POST /api/catering-orders/${order_id}/fulfill"
              payload: { consumed_ingredients: [ { ingredient: "KIT", qty: 1 } ] }
              as: CafeteriaManager
              captures: { fin: $.data.final_cost_cents, est2: $.data.estimated_cost_cents }
          assert:
            - "CateringOrder.${order_id}.estimated_cost_cents == 288"
            - "CateringOrder.${order_id}.final_cost_cents == 450"
            - "estimated_cost_cents != final_cost_cents (288 vs 450)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: badge_subsidy_min_cap_nonlinear
        grounds:
          - calculations.badge_subsidy
          - entities.BadgeTransaction.fields.subsidy_applied_cents
          - entities.BadgeTransaction.fields.employee_charge_cents
          - entities.ClientSite.fields.employer_subsidy_pct
        distinguishing_aspect: "Mode (a): >=3 inputs (per-category subtotal, pct, daily_used, cap) with a category filter and nested min/max; only ENTREE(900) subsidizable of 1100 subtotal → subsidy 450, charge 650."
        test_recipe:
          setup:
            - "Site (subsidy 0.5, cap 1000); IN_SERVICE session; items Chicken(ENTREE 900) and Soda(BEVERAGE 200); employee with 0 daily_subsidy_used."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "Dee Iner" }
              as: SiteAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Chicken", category: "ENTREE", price_cents: 900, standard_recipe_cost_cents: 300 }
              as: CafeteriaManager
              captures: { chick_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Soda", category: "BEVERAGE", price_cents: 200, standard_recipe_cost_cents: 50 }
              as: CafeteriaManager
              captures: { soda_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:00:00Z", window_end: "2026-03-02T12:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { sess_id: $.data.id }
            - call: "POST /api/service-sessions/${sess_id}/lock-forecast"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions/${sess_id}/open"
              payload: {}
              as: CafeteriaManager
          trigger:
            - call: "POST /api/badge-transactions"
              payload: { employee_id: "${emp_id}", service_session_id: "${sess_id}", lines: [ { menu_item_id: "${chick_id}", qty: 1 }, { menu_item_id: "${soda_id}", qty: 1 } ], payment_method: "BADGE_PAYROLL" }
              as: Diner
              as_user_id: "${emp_id}"
              captures: { txn_id: $.data.id }
          assert:
            - "BadgeTransaction.${txn_id}.subtotal_cents == 1100"
            - "BadgeTransaction.${txn_id}.subsidy_applied_cents == 450"
            - "BadgeTransaction.${txn_id}.employee_charge_cents == 650"

      - name: catering_per_line_round_then_sum
        grounds:
          - calculations.catering_client_charge
          - entities.CateringOrder.fields.order_charge_cents
          - entities.CateringOrder.fields.service_fee_cents
          - entities.CateringOrder.fields.total_charge_cents
          - state_machines.CateringOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Mode (b): pinned round-per-line-then-sum. Two 350 lines at 5% off each round 332.5->333 (sum 666); sum-then-round would give 665. Different mode than the (a) subsidy formula."
        test_recipe:
          setup:
            - "Site; PUBLISHED cycle with Wrap & Cup (price 350 each); venue cap 100; DRAFT order headcount 25 with 1 Wrap + 1 Cup."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Cup", category: "SIDE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { cup_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/catering-venues"
              payload: { client_site_id: "${site_id}", name: "Hall A", capacity: 100 }
              as: SiteAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/catering-orders"
              payload: { client_site_id: "${site_id}", venue_id: "${venue_id}", event_date: "2026-03-10", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T11:00:00Z", headcount: 25, lines: [ { menu_item_id: "${wrap_id}", qty: 1 }, { menu_item_id: "${cup_id}", qty: 1 } ] }
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/catering-orders/${order_id}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { oc: $.data.order_charge_cents, sf: $.data.service_fee_cents, tot: $.data.total_charge_cents }
          assert:
            - "CateringOrder.${order_id}.order_charge_cents == 666"
            - "CateringOrder.${order_id}.service_fee_cents == 120"
            - "CateringOrder.${order_id}.total_charge_cents == 786"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: catering_revision_cycle
        grounds:
          - state_machines.CateringOrder.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.CateringOrder.REVISION_REQUESTED_to_DRAFT
          - state_machines.CateringOrder.DRAFT_to_SUBMITTED
          - entities.CateringOrder.fields.status
        distinguishing_aspect: "CateringOrder cycles SUBMITTED->REVISION_REQUESTED->DRAFT->SUBMITTED, re-entering review — a genuine loop, not a linear pipeline."
        test_recipe:
          setup:
            - "Site; PUBLISHED cycle with Wrap; venue; order SUBMITTED once."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/catering-venues"
              payload: { client_site_id: "${site_id}", name: "Hall A", capacity: 100 }
              as: SiteAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/catering-orders"
              payload: { client_site_id: "${site_id}", venue_id: "${venue_id}", event_date: "2026-03-10", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T11:00:00Z", headcount: 25, lines: [ { menu_item_id: "${wrap_id}", qty: 1 } ] }
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { order_id: $.data.id }
            - call: "POST /api/catering-orders/${order_id}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /api/catering-orders/${order_id}/review"
              payload: { decision: "REQUEST_REVISION" }
              as: CateringApprover
              as_user_id: "appr-1"
              captures: { s1: $.data.status }
            - call: "POST /api/catering-orders/${order_id}/revise"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { s2: $.data.status }
            - call: "POST /api/catering-orders/${order_id}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { s3: $.data.status }
          assert:
            - "status after review == REVISION_REQUESTED"
            - "status after revise == DRAFT"
            - "status after resubmit == SUBMITTED (loop re-entered review)"

      - name: invoice_dispute_cycle
        grounds:
          - state_machines.VendorInvoice.MATCHED_to_DISPUTED
          - state_machines.VendorInvoice.DISPUTED_to_RECEIVED
          - state_machines.VendorInvoice.RECEIVED_to_MATCHED
          - state_machines.VendorInvoice.MATCHED_to_APPROVED
          - entities.VendorInvoice.fields.status
        distinguishing_aspect: "VendorInvoice cycles MATCHED->DISPUTED->RECEIVED->MATCHED with a corrected amount, a different entity than CateringOrder; second match variance (0) is within tolerance so it can APPROVE."
        test_recipe:
          setup:
            - "RECEIVED PO total 2000; invoice for 3000 (variance 1000 > 500 tol) matched then disputed; resubmitted at 2000."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "DRY_GOODS" }
              as: SiteAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "FLOUR", qty: 10, unit_cost_cents: 200 } ] }
              as: CafeteriaManager
              captures: { po_id: $.data.id }
            - call: "POST /api/purchase-orders/${po_id}/issue"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/purchase-orders/${po_id}/receive"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/vendor-invoices"
              payload: { vendor_id: "${vendor_id}", purchase_order_id: "${po_id}", invoiced_amount_cents: 3000 }
              as: FinanceController
              captures: { inv_id: $.data.id }
            - call: "POST /api/vendor-invoices/${inv_id}/match"
              payload: {}
              as: FinanceController
            - call: "POST /api/vendor-invoices/${inv_id}/resolve"
              payload: { resolution: "DISPUTE" }
              as: FinanceController
            - call: "POST /api/vendor-invoices/${inv_id}/resubmit"
              payload: { invoiced_amount_cents: 2000 }
              as: FinanceController
          trigger:
            - call: "POST /api/vendor-invoices/${inv_id}/match"
              payload: {}
              as: FinanceController
              captures: { var2: $.data.matched_variance_cents, st: $.data.status }
            - call: "POST /api/vendor-invoices/${inv_id}/resolve"
              payload: { resolution: "APPROVE" }
              as: FinanceController
              captures: { st2: $.data.status }
          assert:
            - "VendorInvoice.${inv_id}.matched_variance_cents == 0 after second match"
            - "status after second match == MATCHED"
            - "status after resolve APPROVE == APPROVED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: session_close_site_rollup_catering_flag
        grounds:
          - state_machines.ServiceSession.IN_SERVICE_to_CLOSED
          - calculations.actual_food_cost
          - calculations.site_food_cost_rollup
          - entities.ClientSite.fields.cost_status
          - entities.InventoryLot.fields.status
          - entities.CateringOrder.fields.requires_finance_review
        distinguishing_aspect: "Depth-3 chain from ServiceSession CLOSE: (1) COMBO_KIT lot depletes; (2) ClientSite pct 500/1000=0.5>0.32 -> cost_status OVER_TARGET; (3) the SUBMITTED CateringOrder is stamped requires_finance_review=true."
        test_recipe:
          setup:
            - "Site target 0.32; session IN_SERVICE with 1 COMPLETED Combo txn (revenue 1000); COMBO_KIT lot qty 1 @ 500; one SUBMITTED CateringOrder at the site."
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 100000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: $.data.id }
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "Dee Iner" }
              as: SiteAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: $.data.id }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Combo", category: "ENTREE", price_cents: 1000, standard_recipe_cost_cents: 400 }
              as: CafeteriaManager
              captures: { combo_id: $.data.id }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/catering-venues"
              payload: { client_site_id: "${site_id}", name: "Hall A", capacity: 100 }
              as: SiteAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/catering-orders"
              payload: { client_site_id: "${site_id}", venue_id: "${venue_id}", event_date: "2026-03-10", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T11:00:00Z", headcount: 25, lines: [ { menu_item_id: "${combo_id}", qty: 1 } ] }
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { order_id: $.data.id }
            - call: "POST /api/catering-orders/${order_id}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
