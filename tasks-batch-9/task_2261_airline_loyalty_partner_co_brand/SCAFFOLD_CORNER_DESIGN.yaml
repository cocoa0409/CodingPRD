          - entities.MemberAccount.fields.security_state
        distinguishing_aspect: "Signals chosen to land the weighted score on exactly the WATCH threshold (geo clamped to 100 contributes 35, dormancy 200 days contributes 5) prove the inclusive lower bound at 40 AND that the freeze bound at 70 is untouched: security_state is WATCH and freeze_applied is false, so redemptions remain possible."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at security_state NORMAL with mile_balance 1000 from a single 1000-mile partner earn dated 2026-07-15."
