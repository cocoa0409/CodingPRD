            - "Joint-scoped variant on Joint A would be 1/2 = 50.00 — different number than weldment-scoped 5.00"

  # -------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes from {(a),(b),(c)})
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: wps_thickness_envelope_3input_conditional
        grounds:
          - calculations.wps_thickness_envelope
          - entities.WPS.fields.thickness_min_mm
          - entities.PQR.fields.thickness_range_max_mm
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear conditional branches on entity
          state — envelope_valid is a 4-way AND over (PQR.min, PQR.max, WPS.min,
          WPS.max, Joint.thickness) evaluated at different lifecycle moments;
          approving a WPS with thickness_min_mm=3, thickness_max_mm=25 against
          a PQR with envelope [3, 25] is exactly at the inclusive boundary on
          both ends and succeeds; bumping WPS.thickness_max_mm to 25.01 fails
          even though it differs by 0.01.
        test_recipe:
          setup:
            - "Shop + APPROVED PQR with envelope [3.00, 25.00]"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S3", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-3", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3.00, thickness_range_max_mm: 25.00, test_report_id: "TR-3" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-3A", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 3.00, thickness_max_mm: 25.00 }
              as: QCManager
              captures: { wps_a_id: $.data.id, wps_a_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-3B", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 3.00, thickness_max_mm: 25.01 }
              as: QCManager
              captures: { wps_b_id: $.data.id, wps_b_v: $.data.version }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_a_id}/approve"
              payload: { expected_wps_version: "${wps_a_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_b_id}/approve"
              payload: { expected_wps_version: "${wps_b_v}" }
              as: QCManager
              captures: { reject_id: $.data.error_id }
          assert:
            - "WPS-3A approve succeeds (boundary inclusive on both ends)"
            - "WPS-3B approve rejected with ERR_WPS_THICKNESS_OUTSIDE_PQR (25.01 > 25.00)"

      - name: repair_rate_rounding_order
        grounds:
          - calculations.repair_rate_pct
          - entities.Weldment.fields.repair_rate_pct
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Weldment-scoped
          formula rounds AFTER the division: round_half_up(100.0 * 1/3, 2) =
          33.33. The joint-scoped variant computes per-joint then averages —
          (round_half_up(100.0 * 1/2, 2) + round_half_up(100.0 * 0/1, 2)) / 2 =
          (50.00 + 0.00) / 2 = 25.00. Two weldments with identical pass
          counts (1 repair / 3 total, distributed 1+1 on joint A and 0+1 on
          joint B) yield 33.33 by the weldment aggregate and 25.00 by the
          joint-then-average variant — the scaffold pins weldment aggregate
          as the authoritative gate.
        test_recipe:
          setup:
            - "Shop with repair_rate_limit_pct = 30 (between 25.00 and 33.33)"
            - "Weldment with 1 repair pass on joint A + 1 normal pass on joint A + 1 normal pass on joint B"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S4", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 30 }
