      # -- V9 -------------------------------------------------------------
      - name: conditionally_required_fields_are_only_required_on_their_own_branch_and_blank_is_absent
        claim_type: Required Fields
        grounds: "§1.2 EmergencyOverride PENDING -> ACTIVE and ACTIVE mode-change preconditions ('crawl_text is not null (ERR_CRAWL_TEXT_REQUIRED)', SCAFFOLD.yaml lines 909 and 949); §1.2 EmergencyOverride PENDING -> REJECTED precondition ('rejection_reason present (ERR_REJECTION_REASON_REQUIRED)'); §1.2 TechnicalFault DETECTED -> MITIGATED and MITIGATED -> RESOLVED preconditions ('mitigation_code present (ERR_MITIGATION_CODE_REQUIRED)', lines 1019 and 1029); §1.2 RegulatoryNotification PENDING/OVERDUE -> FILED preconditions ('filed_reference and narrative present (ERR_FILING_DETAILS_REQUIRED)', lines 1116 and 1134); §1.5 POST /playlists ('At least one item was supplied (ERR_PLAYLIST_EMPTY_INGEST)') vs §1.3 playlist_timeline_integrity ('if items is empty: raise ERR_PLAYLIST_NO_PROGRAM_CONTENT'); §1.4 priority 8 ERR_MISSING_REQUIRED_FIELD"
        distinguishing_aspect: "Six fields in this API are required ONLY on one branch of a transition, and each one has its own 422 error id that must not collapse into the generic ERR_MISSING_REQUIRED_FIELD. The corner is threefold. (i) DIRECTION: crawl_text is required when override_mode == CRAWL and must NOT be required for CUT_IN or FULL_TAKEOVER, and the requirement is re-evaluated at activation because activate accepts its own override_mode (a CUT_IN request activated as CRAWL needs crawl_text that the create call never had to supply). (ii) BLANK == ABSENT: narrative and filed_reference are declared REQUIRED inputs of POST /regulatory-notifications/{id}/file, so omitting them is caught by priority 8 (ERR_MISSING_REQUIRED_FIELD) and ERR_FILING_DETAILS_REQUIRED is reachable ONLY when the keys are present but empty/whitespace — an implementation that treats presence as satisfaction can never emit ERR_FILING_DETAILS_REQUIRED, and one that trims before the priority-8 check emits the wrong id for the omission. (iii) UNREACHABLE BRANCH: POST /emergency-overrides/{id}/release declares input [\"released_utc?\"] ONLY — there is no rejection_reason field anywhere in §1.5 — so the declared PENDING -> REJECTED transition can never satisfy its own precondition and a release aimed at a PENDING override always fails with ERR_REJECTION_REASON_REQUIRED. Implementations must not invent an undeclared field to make REJECTED reachable, and must not silently route the PENDING release to the ACTIVE -> RELEASED handler."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig (transmitter FULL_POWER, MUX-A, channel 12.1 ON_AIR, playlist pl1 ON_AIR with 7 items). Every trigger below is a single-field mutation of an otherwise valid request."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /emergency-overrides"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", requested_by_operator_id: "${op_mco_id}", alert_class: SEVERE_WEATHER, override_mode: CRAWL, requested_start_utc: "2026-08-01T12:05:00Z", expected_duration_seconds: 300}
              captures: {e_crawl_create: "$.data.error_id"}
            - call: "POST /emergency-overrides"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", requested_by_operator_id: "${op_mco_id}", alert_class: SEVERE_WEATHER, override_mode: CRAWL, requested_start_utc: "2026-08-01T12:05:00Z", expected_duration_seconds: 300, crawl_text: "   "}
              captures: {e_crawl_blank: "$.data.error_id"}
            - call: "POST /emergency-overrides"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", requested_by_operator_id: "${op_mco_id}", alert_class: SEVERE_WEATHER, override_mode: CUT_IN, requested_start_utc: "2026-08-01T12:05:00Z", expected_duration_seconds: 300}
              captures: {ov9_id: "$.data.id", ov9_state: "$.data.state"}
            - call: "POST /emergency-overrides/${ov9_id}/activate"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {authorized_by_operator_id: "${op_pd_id}", override_mode: CRAWL}
              captures: {e_crawl_activate: "$.data.error_id"}
            - call: "POST /emergency-overrides/${ov9_id}/release"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {}
              captures: {e_reject_reason: "$.data.error_id"}
            - call: "POST /technical-faults"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {fault_code: CAPTION_LOSS, severity: MINOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {f9_id: "$.data.id"}
            - call: "POST /technical-faults/${f9_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_state: MITIGATED}
              captures: {e_mit_absent: "$.data.error_id"}
            - call: "POST /technical-faults/${f9_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_state: MITIGATED, mitigation_code: ""}
              captures: {e_mit_blank: "$.data.error_id"}
            - call: "POST /technical-faults/${f9_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_state: MITIGATED, mitigation_code: "SWITCH_TO_BACKUP"}
              captures: {f9_state: "$.data.state"}
            - call: "POST /technical-faults/${f9_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_state: RESOLVED, cleared_utc: "2026-08-01T11:59:00Z"}
              captures: {e_mit_resolve: "$.data.error_id"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 60, reason: "ANTENNA_ICING"}
              captures: {tx9_state: "$.data.operational_state"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: ComplianceOfficer
              payload: {kind: POWER_REDUCTION}
              captures: {n9_id: "$.data[0].id"}
            - call: "POST /regulatory-notifications/${n9_id}/file"
              as: ComplianceOfficer
              payload: {filed_reference: "FCC-2026-0001"}
              captures: {e_file_missing: "$.data.error_id"}
            - call: "POST /regulatory-notifications/${n9_id}/file"
              as: ComplianceOfficer
              payload: {filed_reference: "FCC-2026-0001", narrative: ""}
              captures: {e_file_blank: "$.data.error_id"}
            - call: "POST /regulatory-notifications/${n9_id}/file"
              as: ComplianceOfficer
              payload: {filed_reference: "   ", narrative: "Antenna icing forced a reduction to 60 percent of authorized ERP."}
              captures: {e_file_blank_ref: "$.data.error_id"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}", broadcast_day: "2026-08-02", schedule_start_utc: "2026-08-02T12:00:00Z", items: []}
              captures: {e_empty_ingest: "$.data.error_id"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload:
                channel_id: "${ch1_id}"
                broadcast_day: "2026-08-02"
                schedule_start_utc: "2026-08-02T13:00:00Z"
                items:
                  - {sequence_number: 1, element_kind: COMMERCIAL, asset_id: "${aspot_id}", scheduled_start_utc: "2026-08-02T13:00:00Z", scheduled_duration_seconds: 30}
                  - {sequence_number: 2, element_kind: PROMO, asset_id: "${apromo_id}", scheduled_start_utc: "2026-08-02T13:00:30Z", scheduled_duration_seconds: 30}
                  - {sequence_number: 3, element_kind: INTERSTITIAL, asset_id: "${ainter_id}", scheduled_start_utc: "2026-08-02T13:01:00Z", scheduled_duration_seconds: 60}
              captures: {e_no_program: "$.data.error_id"}
          assert:
            - "CRAWL create with crawl_text absent -> 422 ${e_crawl_create} == ERR_CRAWL_TEXT_REQUIRED (NOT ERR_MISSING_REQUIRED_FIELD: crawl_text is declared optional in §1.5, so priority 8 cannot fire on it)"
            - "CRAWL create with crawl_text == \"   \" (whitespace only) -> 422 ${e_crawl_blank} == ERR_CRAWL_TEXT_REQUIRED: 'is not null' is read as 'has non-blank content'"
            - "the same request with override_mode CUT_IN and no crawl_text SUCCEEDS: ${ov9_state} == PENDING — the requirement is branch-local, not global"
            - "activating that CUT_IN request as override_mode CRAWL without crawl_text -> 422 ${e_crawl_activate} == ERR_CRAWL_TEXT_REQUIRED: the precondition is re-evaluated against the ACTIVATION mode, not the requested mode, and the override stays PENDING (version unchanged)"
            - "releasing the still-PENDING override -> 422 ${e_reject_reason} == ERR_REJECTION_REASON_REQUIRED, and this is UNCONDITIONAL: POST /emergency-overrides/{id}/release declares input [released_utc?] only, so no legal request body can ever satisfy the PENDING -> REJECTED precondition"
            - "the failed release must NOT be re-routed to the ACTIVE -> RELEASED handler: the override remains PENDING, released_utc stays null, active_mode stays null, and Channel.air_status stays ON_AIR (no OVERRIDE_OUT AsRunEntry is appended)"
            - "consequence to assert explicitly: EmergencyOverride.REJECTED is a declared but structurally unreachable state; GET /emergency-overrides?state=REJECTED returns an empty list for every reachable history of this API"
            - "fault MITIGATED with mitigation_code absent -> 422 ${e_mit_absent} == ERR_MITIGATION_CODE_REQUIRED; with mitigation_code == \"\" -> 422 ${e_mit_blank} == ERR_MITIGATION_CODE_REQUIRED (blank is absent here too)"
            - "with mitigation_code == SWITCH_TO_BACKUP the same call succeeds: ${f9_state} == MITIGATED"
            - "MITIGATED -> RESOLVED WITHOUT mitigation_code -> 422 ${e_mit_resolve} == ERR_MITIGATION_CODE_REQUIRED: the second hop re-requires the field even though the fault already carries one from the first hop — the stored value does not satisfy the new request's precondition"
            - "filing with narrative omitted -> 422 ${e_file_missing} == ERR_MISSING_REQUIRED_FIELD (priority 8 owns the OMISSION because narrative is a declared required input)"
            - "filing with narrative == \"\" -> 422 ${e_file_blank} == ERR_FILING_DETAILS_REQUIRED, and with filed_reference == \"   \" -> 422 ${e_file_blank_ref} == ERR_FILING_DETAILS_REQUIRED: this pair of blanks is the ONLY way ERR_FILING_DETAILS_REQUIRED becomes observable"
            - "the notification stays PENDING through all three failures: filed_utc, filed_reference and narrative are still null and version is unchanged"
            - "POST /playlists with items == [] -> 422 ${e_empty_ingest} == ERR_PLAYLIST_EMPTY_INGEST — NOT the 409 ERR_PLAYLIST_NO_PROGRAM_CONTENT that §1.3 playlist_timeline_integrity mentions for the empty set: the endpoint-level shape check (422) is evaluated before the timeline walk, so the empty-set edge has exactly one correct id"
            - "POST /playlists with three items of which NONE is element_kind PROGRAM -> 409 ${e_no_program} == ERR_PLAYLIST_NO_PROGRAM_CONTENT: the timeline is contiguous and legal, so only the composition rule can reject it, and it must be the 409 rather than the 422"
            - "no playlist row is created by either rejected ingest: GET /channels/${ch1_id}/playlists?broadcast_day=2026-08-02 returns an empty list"

      # -- V10 ------------------------------------------------------------
      - name: every_inclusive_threshold_accepts_its_exact_value_so_no_rule_may_fire_on_the_boundary
        claim_type: Correct Result
        grounds: "§1.4 rules 26 (>= EAS_MIN_ON_AIR_SECONDS 120), 28 (score >= QC_WAIVER_MIN_SCORE 40), 33 (len(justification) >= 20), 36 (>= FAULT_ESCALATION_SECONDS 120), 42 (event_utc <= logical_now), 43 (current_utc > logical_now), 45 (received_utc <= deadline + DELIVERY_GRACE_SECONDS 3600), 46 (<= makegood_deadline_utc), 54 (floor >= resolution minimum), 55 (floor <= requested), 67 (|actual - scheduled| <= ARM_VARIANCE_SECONDS 30); §1.3 asset_technical_score (verdict thresholds >= 85 / >= 70), spot_credit_settlement (AIRED_FULL when measured >= unit - 1), regulatory_notification_deadline ('<= due_utc is ON TIME'), live_encoder_concurrency_peak ('peak > total rejects, peak == total is legal'), commercial_inventory_ceiling (<= 960), power-reduction notification threshold (power_pct < 80 notifies)"
        distinguishing_aspect: "This is the negative-space instance: every other validation instance proves that a rule FIRES, and this one proves that the same rule STAYS SILENT at its exact threshold. Off-by-one implementations pass the firing tests and fail here, because the cheapest way to make a '>=' rule work is to write '>'. The census below pins the exact accepted value for all 17 inclusive thresholds in the spec, and includes the three thresholds whose polarity is INVERTED (rule 43 needs STRICTLY greater so the equal clock is refused; the encoder peak is legal at exactly total but rejected at total + 1; power_pct == 80 is NOT a reduction so no notification row may appear) — a uniform 'inclusive everywhere' shortcut fails those three, and a uniform 'exclusive everywhere' shortcut fails the other fourteen. The trigger drives the three cheapest of them live on the standing rig so that the boundary is observable end-to-end rather than only by inspection."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig. Three live boundary probes: (a) the clock advances by exactly 1 second, the smallest legal forward step; (b) the transmitter drops to exactly 80 percent, the largest power that is NOT a reduction; (c) item 1 is cued with event_utc exactly equal to logical_now, the largest legal event timestamp."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /_clock/set_current_utc"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {current_utc: "2026-08-01T11:59:01Z"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 80, reason: "PLANNED_ANTENNA_WORK"}
              captures: {tx10_state: "$.data.operational_state", tx10_pct: "$.data.current_power_pct"}
            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {ch10_posture: "$.data.posture", ch10_air: "$.data.air_status"}
            - call: "POST /_clock/set_current_utc"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {current_utc: "2026-08-01T12:00:00Z"}
            - call: "POST /playlist-items/${it1_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-01T12:00:00Z", source: OPERATOR}
              captures: {ev10_kind: "$.data.event_kind"}
            - call: "GET /playlist-items/${it1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {it1_state10: "$.data.playout_status"}
          assert:
            - "advancing the clock by exactly 1 second is accepted (rule 43 is STRICTLY greater, so 11:59:01 > 11:59:00 passes); a repeat of the same value would be ERR_CLOCK_NOT_MONOTONIC — see the paired firing case in the as-run ordering instance"
            - "power_pct == 80 is accepted and ${tx10_state} == REDUCED_POWER with ${tx10_pct} == 80, but NO RegulatoryNotification row is created: GET /transmitters/${tx1_id}/notifications?kind=POWER_REDUCTION returns an empty list, because the notification trigger is power_pct < 80 and 80 is not less than 80"
            - "the channel is unaffected by an 80 percent reduction: ${ch10_air} == ON_AIR and ${ch10_posture} is unchanged from its pre-probe value (a REDUCED_POWER transmitter at the threshold does not by itself degrade posture)"
            - "CUE with event_utc EXACTLY equal to logical_now is accepted (rule 42 is <=): ${ev10_kind} == CUE and ${it1_state10} == PLAYING; event_utc one second later would be ERR_EVENT_TIMESTAMP_IN_FUTURE"
            - "BOUNDARY CENSUS — each threshold below must ACCEPT the stated exact value, and the sibling instance named in parentheses proves the adjacent value is REJECTED: (1) power_pct == 80 -> no POWER_REDUCTION notification (79 notifies); (2) outage duration == 1800 s -> OUTAGE notification created, 1799 s -> none; (3) |actual_arm - scheduled| == 30 s -> ARMED, 31 s -> ERR_ARM_VARIANCE_EXCEEDED (rule 67); (4) join at scheduled + 30 s -> JOIN_IN_PROGRESS with late_join_seconds 30, +31 -> ERR_JOIN_OUTSIDE_GUARD_WINDOW (rule 58); (5) breakaway at exactly breakaway_utc - guard_seconds -> accepted, one second earlier -> ERR_BREAKAWAY_TOO_EARLY (rule 59); (6) EAS dwell == 120 s -> release accepted, 119 -> ERR_EAS_MINIMUM_DURATION_NOT_MET (rule 26); (7) MINOR fault age == 120 s -> escalation accepted, 119 -> ERR_FAULT_ESCALATION_TOO_EARLY (rule 36); (8) MINOR fault age == 900 s at a clock set -> AUTO_CLEARED, 899 -> still DETECTED; (9) commercial seconds in the hour == 960 -> accepted, 961 -> ERR_COMMERCIAL_INVENTORY_EXCEEDED; (10) qc score == 85 -> PASS and == 70 -> CONDITIONAL_PASS (84 and 69 fall through); (11) score == 40 -> waiver allowed, 39 -> ERR_QC_WAIVER_SCORE_TOO_LOW (rule 28); (12) len(waiver_justification) == 20 -> accepted, 19 -> ERR_WAIVER_JUSTIFICATION_REQUIRED (rule 33); (13) received_utc == delivery_deadline_utc + 3600 -> accepted with late_delivery true, +3601 -> the asset has already been swept to EXPIRED (rule 45 / rule 16); (14) certification_expires_utc == logical_now -> operator still valid, +1 s -> ERR_OPERATOR_CERTIFICATION_EXPIRED (rule 7); (15) filing at exactly due_utc -> FILED and on time, due_utc + 1 s at a sweep -> OVERDUE; (16) makegood placement at exactly makegood_deadline_utc -> accepted, +1 s -> ERR_MAKEGOOD_DEADLINE_PASSED (rule 46); (17) measured_duration == unit_duration - 1 -> AIRED_FULL with zero credit, unit - 2 -> SHORT_AIR; (18) sum(floors) == effective capacity -> allocations equal the floors exactly, one more floor -> ERR_BITRATE_FLOOR_UNSATISFIABLE; (19) floor == the resolution minimum (2000 for SD_480I) -> accepted, 1999 -> ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM (rule 54); (20) floor == requested_bitrate -> accepted, floor == requested + 1 -> ERR_BITRATE_FLOOR_EXCEEDS_REQUEST (rule 55); (21) encoder peak == live_encoder_units_total -> accepted, total + 1 -> ERR_ENCODER_CAPACITY_EXCEEDED; (22) event_utc == logical_now -> accepted, +1 s -> ERR_EVENT_TIMESTAMP_IN_FUTURE (rule 41)"
            - "INVERTED-POLARITY EXCEPTIONS that a blanket 'inclusive' reading gets wrong: rule 43 rejects current_utc == logical_now (ERR_CLOCK_NOT_MONOTONIC); the power-reduction notification trigger is a strict < 80 so equality does NOT notify; and rule 27's override authority / rule 28's self-authorization are identity tests with no threshold at all"
            - "no state anywhere in the census case is mutated by a boundary-satisfying request beyond the documented success side effects: version counters advance by exactly 1 per accepted call and by 0 per rejected call"

  # ===========================================================================
  # ENDPOINTS — all 59 endpoints in §1.5: 14 collection reads, 14 single-resource
  # reads (one of them purely computed), 31 writes. Every declared query filter,
  # every response shape, every partial-update rule and the clock endpoint.
  # ===========================================================================
  - section: endpoints
    instances:

      # -- E1 -------------------------------------------------------------
      - name: all_14_collection_reads_share_the_paginated_array_envelope_and_a_deterministic_order
        claim_type: Listing
        grounds: "§1.0 response_envelope (success shape with meta.api_request_id / meta.api_request_timestamp, response_type 'object' | 'array', data; pagination_fields [limit, offset, total_count, has_more]; pagination_defaults { limit: 10, min: 1, max: 100, offset: 0 }); §1.5 the 14 endpoints whose output is a typed array: GET /multiplexes, GET /channels, GET /assets, GET /qc-reports, GET /playlist-items, GET /spot-orders, GET /emergency-overrides, GET /technical-faults, GET /transmitters/{id}/notifications, GET /channels/{id}/playlists, GET /channels/{id}/feed-windows, GET /playlists/{id}/items, GET /playlists/{id}/as-run, GET /playlist-items/{id}/as-run"
        distinguishing_aspect: "Fourteen endpoints return arrays and every one of them must carry the SAME envelope, including the two that are easy to special-case: the as-run readers (which are append-only logs, not entity tables) and the empty result (which must be data: [] with total_count 0 and has_more false, never a 404 and never a bare null). The default limit is 10, which is smaller than the standing playlist (7 items is under it) but smaller than the 6 assets + 12 as-run rows a full airing produces — so the SECOND page must be requested to see the tail, and total_count must report the FILTERED total (all rows matching the query) while data reports only the current window. Ordering is the second half of the corner: the as-run log must be strictly chronological with ties broken by insertion order (a CUE and a START at the same instant keep their causal order), GET /playlists/{id}/items must be ordered by sequence_number ASC even after a traffic revision has renumbered the middle of the list, and GET /channels must be ordered by priority_rank ASC so the waterfall order is directly readable."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig (6 assets, 1 spot order, 7 playlist items, 2 channels on MUX-A), then air items 1-3 to generate as-run rows."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /playlists/${pl1_id}/items"
              as: TrafficCoordinator
              captures: {li1: "$.data[0].id"}
            - call: "GET /assets"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: {la1: "$.data[0].id"}
            - call: "GET /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {channel_id: "${ch1_id}"}
            - call: "GET /playlists/${pl1_id}/as-run"
              as: ComplianceOfficer
            - call: "GET /channels"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {multiplex_id: "${mux1_id}"}
              captures: {lc1: "$.data[0].id", lc2: "$.data[1].id"}
          assert:
            - "every one of the 14 array endpoints returns response_type == \"array\" with data as a JSON array, plus meta.api_request_id and meta.api_request_timestamp — including GET /playlists/${pl1_id}/as-run and GET /playlist-items/{id}/as-run, which are logs rather than entity tables"
            - "every one of them also returns limit, offset, total_count and has_more; with no pagination query the values are limit 10, offset 0"
            - "GET /playlists/${pl1_id}/items returns all 7 items in ONE page (total_count 7, has_more false) ordered by sequence_number ASC, and ${li1} is the sequence_number 1 item"
            - "GET /assets returns the 6 assets of the rig with total_count 6, has_more false; requesting limit=3&offset=0 gives 3 rows with total_count 6 and has_more true, and limit=3&offset=3 gives the remaining 3 with has_more false — total_count is the count of ALL matching rows, never the size of the returned page"
            - "GET /assets?status=QC_PASSED narrows data AND total_count together (the filter is applied before the window, not after it)"
            - "GET /technical-faults?channel_id=${ch1_id} on a rig with no faults returns HTTP 200 with data == [], total_count 0, has_more false — NOT a 404 and NOT data: null"
            - "limit is clamped by contract, not silently: limit=0 and limit=101 are rejected with 422 ERR_INVALID_FIELD_VALUE (declared min 1, max 100), while limit=100 is accepted; a negative offset is likewise 422"
            - "GET /playlists/${pl1_id}/as-run after airing items 1-3 returns 6 rows (CUE, START, END per item) ordered by event_utc ASC with insertion order as the tie break, so the CUE that shares an instant with the previous item's END still appears AFTER it"
            - "GET /channels?multiplex_id=${mux1_id} returns exactly 2 rows ordered by priority_rank ASC: ${lc1} is channel 12.1 (rank 1) and ${lc2} is channel 12.2 (rank 2) — the same order the bitrate waterfall walks"
            - "ordering is stable across a traffic revision: after items are renumbered, a re-read of GET /playlists/${pl1_id}/items is still sequence_number ASC with no duplicate or missing ordinal"
            - "the error envelope on the same endpoints is response_type == \"error\" with data.error_id and data.message and NO pagination fields"

      # -- E2 -------------------------------------------------------------
      - name: all_14_single_resource_reads_project_every_computed_field_and_never_mutate
        claim_type: Retrieval
        grounds: "§1.5 the 13 entity detail reads (GET /transmitters/{id}, /multiplexes/{id}, /operators/{id}, /channels/{id}, /assets/{id}, /qc-reports/{id}, /playlists/{id}, /playlist-items/{id}, /network-feed-windows/{id}, /emergency-overrides/{id}, /technical-faults/{id}, /spot-orders/{id}, /regulatory-notifications/{id}) plus the computed read GET /playlists/{id}/reconciliation; §1.1 the computed fields of each entity (Transmitter.derate_factor / cumulative_outage_seconds / notification_pending_count, Multiplex.effective_capacity_kbps / assigned_kbps / available_kbps / allocation_state, Channel.allocated_bitrate_kbps / posture, Asset.technical_score, Playlist.commercial_seconds_scheduled / projected_end_utc, SpotOrder.credit_accrued_cents)"
        distinguishing_aspect: "The single-resource reads are the only observation surface for the derived state that no write returns directly, and they must be pure. Three traps: (i) computed fields are DERIVED ON READ from the current world, so GET /multiplexes/{id} after a transmitter derate reports the derated effective_capacity_kbps and the re-run waterfall even though no write touched the multiplex row and its version did NOT change; (ii) GET must never advance a version, create a notification, sweep an expiry or auto-clear a fault — all sweeps belong to POST /_clock/set_current_utc alone, so reading a stale world twice returns the SAME stale answer; (iii) a suspended or certification-expired operator may still perform every GET (rules 6 and 7 gate mutations only), which makes the read surface the one place where an otherwise-blocked identity is legal."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig. Read each entity once, derate the transmitter to 75 percent, then read again without any other write."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {m_v_pre: "$.data.version"}
            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {c_v_pre: "$.data.version"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 75, reason: "SUMMER_DERATE"}
              captures: {tx_derate: "$.data.derate_factor"}
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {m_v_post: "$.data.version"}
            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {c_v_post: "$.data.version", c_posture: "$.data.posture"}
            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {c_v_post2: "$.data.version"}
            - call: "GET /spot-orders/${ord1_id}"
              as: TrafficCoordinator
            - call: "GET /playlist-items/${it2_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
            - call: "GET /qc-reports/${qc_prog_id}"
              as: ComplianceOfficer
            - call: "GET /operators/${op_mco_id}"
              as: StationAdmin
          assert:
            - "every detail read returns response_type == \"object\" with the full projection: no computed field is omitted, and none is returned as null where the entity declares a default (Transmitter.cumulative_outage_seconds 0, SpotOrder.credit_accrued_cents 0, Asset.technical_score present once a QC report exists)"
            - "the derate is observable through the multiplex read with NO write to the multiplex: effective_capacity_kbps drops from 38000 to 28300, available_kbps from 16000 to 6300, allocation_state to DEGRADED, and ${tx_derate} == 0.75"
            - "the multiplex version is UNCHANGED by that recomputation: ${m_v_post} == ${m_v_pre} — computed fields are projections, not persisted writes"
            - "the channel version is likewise unchanged (${c_v_post} == ${c_v_pre}) even though ${c_posture} now reflects the derated capacity"
            - "reading twice in a row is byte-identical apart from meta: ${c_v_post2} == ${c_v_post} — GET is idempotent and side-effect free"
            - "no GET performs a sweep: with the clock still at 11:59 an asset past its delivery grace stays EXPECTED, a 1000-second-old MINOR fault stays DETECTED and a past-due notification stays PENDING until POST /_clock/set_current_utc runs checkpoints (a)-(e)"
            - "GET /playlist-items/${it2_id} returns BOTH state axes (playout_status and clearance_status) plus the denormalized asset fields the item carries; GET /qc-reports/${qc_prog_id} returns the frozen technical_score and verdict of that report, not the asset's current score"
            - "GET /operators/${op_mco_id} returns role_class, override_authority, status and the derived certification_state"
            - "a SUSPENDED operator and a certification-expired operator can execute every read in this instance and receive 200; only their mutating calls are refused (rules 6 and 7)"
            - "path ids are validated for existence but NOT for kind: GET /channels/{a multiplex id} returns 404 ERR_CHANNEL_NOT_FOUND rather than leaking the other entity"

      # -- E3 -------------------------------------------------------------
      - name: all_31_declared_query_filters_narrow_without_erroring_and_bad_enum_values_still_422
        claim_type: Input Set Filtering
        grounds: "§1.5 the declared filter inputs of every collection endpoint: /transmitters/{id}/notifications [status, kind]; /multiplexes [transmitter_id]; /channels [multiplex_id, parent_channel_id, posture, air_status]; /channels/{id}/playlists [broadcast_day, status]; /channels/{id}/feed-windows [state]; /assets [status, house_number, waived_by_operator_id]; /qc-reports [asset_id, inspected_by_operator_id, basis, include_superseded]; /playlists/{id}/items [playout_status, clearance_status, element_kind]; /playlists/{id}/as-run [event_kind, from_utc, to_utc]; /playlist-items [playlist_id, asset_id, spot_order_id, feed_window_id, replaces_item_id, playout_status]; /emergency-overrides [channel_id, requested_by_operator_id, authorized_by_operator_id, state]; /technical-faults [channel_id, transmitter_id, playlist_item_id, state, severity]; /spot-orders [channel_id, status, priority_class]; §1.1 QCReport.superseded ('True once a newer QCReport with the same basis exists'); §1.4 priority 9 ERR_INVALID_ENUM_VALUE"
        distinguishing_aspect: "Thirty-one filters, and the interesting behaviour is what they must NOT do. A filter whose value is well-formed but matches nothing returns an empty page, never a 404 — but a filter whose value is not a member of the enum is a 422 ERR_INVALID_ENUM_VALUE even though no row could ever match it, so 'no matches' and 'not a legal value' are distinguishable. A filter naming a non-existent foreign id (playlist_id of a deleted-looking uuid) is likewise an empty page, not ERR_PLAYLIST_NOT_FOUND, because the id is a predicate, not a path segment. Two filters carry real semantics beyond equality: include_superseded is DEFAULT FALSE and its per-basis meaning means the same asset can have one governing INGEST report and one governing AIR_CHECK report visible simultaneously while an older INGEST report is hidden; and replaces_item_id is the only way to enumerate makegoods and substitutions, so it must match on the stored pointer rather than on is_makegood. Multi-filter requests AND together (posture=DEGRADED&air_status=ON_AIR returns only rows satisfying both, not their union)."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then add a second INGEST QC report for the program asset (superseding the first), a MAJOR fault on channel 12.1 and a MINOR fault on the transmitter."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /assets/${aprog_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${aprog_v3}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800}
              captures: {qc_new_id: "$.data.id"}
            - call: "GET /qc-reports"
              as: ComplianceOfficer
              payload: {asset_id: "${aprog_id}", basis: INGEST}
              captures: {qc_gov: "$.data[0].id"}
            - call: "GET /qc-reports"
              as: ComplianceOfficer
              payload: {asset_id: "${aprog_id}", basis: INGEST, include_superseded: true}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: AUDIO_LOSS, severity: MAJOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {f_ch_id: "$.data.id"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: RF_POWER_FAULT, severity: MAJOR, detected_utc: "2026-08-01T11:59:00Z", transmitter_id: "${tx1_id}"}
              captures: {f_tx_id: "$.data.id"}
            - call: "GET /technical-faults"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", severity: MAJOR, state: DETECTED}
              captures: {f_filtered: "$.data[0].id"}
            - call: "GET /technical-faults"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", severity: CRITICAL}
            - call: "GET /technical-faults"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {severity: CATASTROPHIC}
              captures: {e_filter_enum: "$.data.error_id"}
            - call: "GET /playlist-items"
              as: TrafficCoordinator
              payload: {playlist_id: "00000000-0000-4000-8000-0000000000ff"}
            - call: "GET /playlists/${pl1_id}/items"
              as: TrafficCoordinator
              payload: {element_kind: COMMERCIAL, clearance_status: CLEARED}
              captures: {itf1: "$.data[0].id"}
            - call: "GET /assets"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {house_number: "HN-PROG-01"}
              captures: {af1: "$.data[0].id"}
            - call: "GET /channels"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {parent_channel_id: "${ch1_id}"}
              captures: {cf1: "$.data[0].id"}
          assert:
            - "the new INGEST report supersedes the old one: GET /qc-reports?asset_id=${aprog_id}&basis=INGEST returns exactly ONE row and ${qc_gov} == ${qc_new_id}, while the same query with include_superseded=true returns TWO rows (newest first) including ${qc_prog_id} with superseded true"
            - "include_superseded is per-basis, not per-asset: GET /qc-reports?asset_id=${aprog_id} with no basis returns the governing report of EACH basis, so an AIR_CHECK report added later coexists with the governing INGEST report and neither supersedes the other"
            - "GET /technical-faults?channel_id=${ch1_id}&severity=MAJOR&state=DETECTED ANDs its three predicates: exactly one row, ${f_filtered} == ${f_ch_id}, and the transmitter fault ${f_tx_id} is excluded even though it is also DETECTED and also MAJOR"
            - "GET /technical-faults?channel_id=${ch1_id}&severity=CRITICAL matches nothing and returns 200 with data == [] and total_count 0 — NOT 404 ERR_FAULT_NOT_FOUND"
            - "GET /technical-faults?severity=CATASTROPHIC (not a member of the severity enum) -> 422 ${e_filter_enum} == ERR_INVALID_ENUM_VALUE: an illegal enum value is a request error even though it could only ever match zero rows"
            - "GET /playlist-items?playlist_id=<unknown uuid> returns 200 with data == [] — a filter value is a predicate and never triggers ERR_PLAYLIST_NOT_FOUND, unlike the same uuid in a path segment"
            - "GET /playlists/${pl1_id}/items?element_kind=COMMERCIAL&clearance_status=CLEARED returns only the cleared commercial items and ${itf1} is one of them; the BLOCKED or UNCLEARED commercials are excluded"
            - "GET /assets?house_number=HN-PROG-01 returns exactly one row (house_number is unique) and ${af1} == ${aprog_id}; the match is exact, not a prefix or substring match, so house_number=HN-PROG returns []"
            - "GET /channels?parent_channel_id=${ch1_id} returns the subchannel 12.2 (${cf1} == ${ch2_id}) and NOT the parent itself; GET /channels?multiplex_id=${mux1_id} returns both"
            - "GET /playlists/${pl1_id}/as-run?event_kind=CUE returns only the CUE rows, and the from_utc / to_utc window follows the spec's half-open interval convention: an event whose event_utc equals from_utc is INCLUDED and one whose event_utc equals to_utc is EXCLUDED"
            - "GET /playlist-items?replaces_item_id=<a preempted item id> is the enumeration path for makegoods and substitutions: it matches the stored pointer, so a makegood placed by POST /spot-orders/{id}/makegoods appears there while a plain scheduled spot does not"
            - "GET /emergency-overrides?requested_by_operator_id=X and ?authorized_by_operator_id=X are DIFFERENT predicates and, because of the segregation-of-duties rule 28, can never return the same row for the same X"
            - "GET /spot-orders?priority_class=GUARANTEED and ?status=PARTIALLY_CREDITED narrow independently; GET /channels/${ch1_id}/playlists?broadcast_day=2026-08-01&status=ON_AIR returns exactly the one airing playlist"

      # -- E4 -------------------------------------------------------------
      - name: patch_allocation_is_a_true_partial_update_whose_occ_token_belongs_to_the_parent
        claim_type: Creation
        grounds: "§1.5 PATCH /channels/{id}/allocation ('Change a channel's bitrate demand (requested, floor, priority_rank) or pin an explicit allocation. Re-runs the waterfall for the whole multiplex; carries expected_multiplex_version.', input [expected_multiplex_version, requested_bitrate_kbps?, floor_bitrate_kbps?, priority_rank?, pin_allocated_kbps?], output Channel, side_effects [multiplex_bitrate_allocation, Channel.allocation_state transitions, channel_posture, multiplex_capacity_conservation assertion]); §1.4 priority 67 ERR_MULTIPLEX_CAPACITY_EXCEEDED ('BOUNDARY: a total exactly equal to effective_capacity_kbps is accepted'); §1.4 priority 25 PRIORITY PAIR (b); §1.2.1 the channel-allocation OCC rule"
        distinguishing_aspect: "The only PATCH in the API, and it breaks three habits at once. (i) PARTIAL: an omitted key means UNCHANGED, not null — sending only priority_rank must leave requested_bitrate_kbps and floor_bitrate_kbps exactly as they were, while an explicit null (where accepted) is the only way to clear a pin through this endpoint. (ii) FOREIGN OCC TOKEN: the endpoint mutates a Channel but its concurrency token is expected_multiplex_version, and its output is a Channel — so the caller cannot chain requests from the response and must re-read GET /multiplexes/{id} between every write, and a bump caused by a SIBLING channel's allocation invalidates a token that the caller never saw change. (iii) CAPACITY IS THE LAST RULE IN THE LADDER: pinning exactly the free space is accepted, one kbps more is ERR_MULTIPLEX_CAPACITY_EXCEEDED, and when the same request is ALSO blocked by a SUSPENDED channel posture the answer flips to ERR_CHANNEL_SUSPENDED_POSTURE (PRIORITY PAIR (b)) — which means the capacity check must be evaluated after the posture check, the opposite of the numeric order of the two rule ids."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig: MUX-A effective 38000 kbps (pilot 800 of 38800), channel 12.1 requested 16000 / floor 8000 / rank 1, channel 12.2 requested 6000 / floor 2000 / rank 2."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mux1_v3}", priority_rank: 3}
              captures: {ch1_rank: "$.data.priority_rank"}
            - call: "GET /channels/${ch1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {ch1_req_after: "$.data.requested_bitrate_kbps", ch1_floor_after: "$.data.floor_bitrate_kbps"}
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {mv_a: "$.data.version"}
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mux1_v3}", priority_rank: 1}
              captures: {e_alloc_stale: "$.data.error_id"}
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mv_a}", pin_allocated_kbps: 36000}
              captures: {ch1_pin: "$.data.allocated_bitrate_kbps"}
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {mv_b: "$.data.version", mux_avail_pin: "$.data.available_kbps"}
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mv_b}", pin_allocated_kbps: 36001}
              captures: {e_cap: "$.data.error_id"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: ENCODER_FAILURE, severity: CRITICAL, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {f_crit_e4: "$.data.id"}
            - call: "GET /channels/${ch1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {ch1_posture_e4: "$.data.posture"}
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mv_b}", pin_allocated_kbps: 36001}
              captures: {e_pair_b: "$.data.error_id"}
          assert:
            - "the rank-only PATCH is a partial update: ${ch1_rank} == 3 while ${ch1_req_after} == 16000 and ${ch1_floor_after} == 8000 — omitted keys are UNCHANGED, never reset to null or to a default"
            - "the response of PATCH /channels/{id}/allocation is a CHANNEL, so it carries Channel.version; the multiplex version it consumed is only obtainable from GET /multiplexes/${mux1_id} (${mv_a} == ${mux1_v3} + 1 after the accepted rank change)"
            - "replaying the pre-PATCH token -> 412 ${e_alloc_stale} == ERR_STALE_MULTIPLEX_VERSION: the waterfall re-run bumped the parent even though the request only touched a child"
            - "pinning EXACTLY the free space is accepted: ${ch1_pin} == 36000 leaves channel 12.2 exactly its floor 2000, ${mux_avail_pin} == 0, and the conservation assertion (assigned + available + pilot == total) still holds"
            - "pinning one kbps more -> 409 ${e_cap} == ERR_MULTIPLEX_CAPACITY_EXCEEDED, and NOTHING moves: the pin stays 36000, channel 12.2 keeps 2000 and the multiplex version is unchanged (${mv_b} is still current)"
            - "a CRITICAL ENCODER_FAILURE on the channel drives ${ch1_posture_e4} == SUSPENDED"
            - "PRIORITY PAIR (b): the SAME over-capacity request now returns 409 ${e_pair_b} == ERR_CHANNEL_SUSPENDED_POSTURE, NOT ERR_MULTIPLEX_CAPACITY_EXCEEDED — rule 25 outranks rule 67 despite the lower rule id owning the higher priority, so posture must be checked before arithmetic"
            - "a pin is not a demand: while pinned, channel 12.1's requested_bitrate_kbps is still 16000, so a later rebalance with clear_pins returns it to its waterfall share rather than to 36000"
            - "PATCH with an empty body ({} plus the required expected_multiplex_version) is a legal no-op that still re-runs the waterfall and still bumps the multiplex version by exactly 1"
            - "pin_allocated_kbps below the channel's own floor is rejected by the floor rules (54/55 family), not by the capacity rule — the pin is validated as an allocation, not as a raw integer"

      # -- E5 -------------------------------------------------------------
      - name: rebalance_is_the_only_exit_from_starved_and_clear_pins_is_the_only_pin_eraser
        claim_type: Side Effect Execution
        grounds: "§1.5 POST /multiplexes/{id}/rebalance ('Re-run multiplex_bitrate_allocation across every channel on the multiplex, clearing any pinned allocations. The only way out of STARVED for a channel.', input [expected_multiplex_version, clear_pins?], output Multiplex, side_effects [multiplex_bitrate_allocation, Channel.allocation_state transitions ACTIVE <-> STARVED <-> STANDBY, channel_posture recomputation, multiplex_capacity_conservation assertion]); §1.3 multiplex_bitrate_allocation (waterfall with 1-kbps leftover sweep); §1.2.1 the multiplex-rebalance OCC rule"
        distinguishing_aspect: "Rebalance is a whole-subtree write behind a single OCC token: one request re-derives the allocation of EVERY channel on the multiplex, so its version bump is 1 on the multiplex while an arbitrary number of Channel rows change allocation_state and posture in the same transaction. Two corners. (i) clear_pins is OPTIONAL and its default must be FALSE even though the endpoint description says 'clearing any pinned allocations' — the description states the purpose, the input list states the switch, and a rebalance without the flag must PRESERVE pins (otherwise the flag would be meaningless and a routine rebalance would silently destroy an engineer's manual allocation). (ii) STARVED is a one-way street through this endpoint only: a channel starved by a derate cannot be rescued by PATCHing its own allocation (that would just re-run the same waterfall under the same capacity), so the test must show the starved channel staying STARVED across a PATCH and recovering only when capacity returns AND a rebalance runs."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, pin channel 12.1 to 36000 so channel 12.2 sits exactly on its floor, then derate the transmitter to 50 percent so the pinned world becomes infeasible and 12.2 starves."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mux1_v3}", pin_allocated_kbps: 36000}
              captures: {e5_pin: "$.data.allocated_bitrate_kbps"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 50, reason: "TRANSMITTER_B_ONLY"}
              captures: {e5_derate: "$.data.derate_factor"}
            - call: "GET /channels/${ch2_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {ch2_alloc_state: "$.data.allocation_state", ch2_alloc: "$.data.allocated_bitrate_kbps"}
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {mv_c: "$.data.version", e5_eff: "$.data.effective_capacity_kbps", e5_starved: "$.data.starved_channel_count"}
            - call: "PATCH /channels/${ch2_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mv_c}", priority_rank: 1}
              captures: {ch2_state_after_patch: "$.data.allocation_state"}
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {mv_d: "$.data.version"}
            - call: "POST /multiplexes/${mux1_id}/rebalance"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mv_d}"}
              captures: {mv_e: "$.data.version", e5_avail_nopins: "$.data.available_kbps"}
            - call: "GET /channels/${ch1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {ch1_alloc_nopins: "$.data.allocated_bitrate_kbps"}
            - call: "POST /multiplexes/${mux1_id}/rebalance"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mv_e}", clear_pins: true}
              captures: {mv_f: "$.data.version", e5_avail_cleared: "$.data.available_kbps"}
            - call: "GET /channels/${ch1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {ch1_alloc_cleared: "$.data.allocated_bitrate_kbps"}
            - call: "GET /channels/${ch2_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {ch2_state_cleared: "$.data.allocation_state", ch2_alloc_cleared: "$.data.allocated_bitrate_kbps"}
            - call: "POST /multiplexes/${mux1_id}/rebalance"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mv_e}", clear_pins: true}
              captures: {e5_stale: "$.data.error_id"}
          assert:
            - "after the derate ${e5_derate} == 0.50 and ${e5_eff} == 19000 (38800 total - 800 pilot = 38000, halved), so the 36000 pin plus 12.2's 2000 floor is no longer feasible"
            - "the infeasible world is resolved in favour of the CONSERVATION invariant, never by exceeding capacity: ${e5_starved} >= 1 on the Multiplex (starvation is counted on the parent, while allocation_state lives on the CHILD), assigned_kbps <= 19000 holds on every read, and ${ch2_alloc_state} == STARVED with ${ch2_alloc} == 0 (rank 2 loses first)"
            - "PATCHing the starved channel does NOT rescue it: ${ch2_state_after_patch} == STARVED even after it is promoted to priority_rank 1, because the pin on 12.1 still consumes the capacity — only a rebalance can move a pinned world"
            - "a rebalance WITHOUT clear_pins PRESERVES the pin: ${ch1_alloc_nopins} == 36000 is impossible under a 19000 capacity, so the correct observable is that the pin is preserved as a DEMAND and the conservation assertion still caps the assignment — assert available_kbps ${e5_avail_nopins} >= 0 and that no channel's allocated_bitrate_kbps sum exceeds 19000"
            - "a rebalance WITH clear_pins: true erases every pin and re-derives from requested/floor: ${ch1_alloc_cleared} is the waterfall share of a 19000 pool at rank 1 with requested 16000 and floor 8000, ${ch2_state_cleared} leaves STARVED, and ${e5_avail_cleared} is the swept remainder (< 1 kbps of slack is never left unassigned)"
            - "clear_pins defaults to FALSE: the two rebalance calls above differ ONLY in that flag and must produce different allocations, which is impossible if the default were true"
            - "one rebalance bumps the MULTIPLEX version by exactly 1 (${mv_e} == ${mv_d} + 1, ${mv_f} == ${mv_e} + 1) while changing allocation_state and posture on every affected channel in the same transaction — the child rows are not individually versioned by this endpoint"
            - "replaying the consumed token -> 412 ${e5_stale} == ERR_STALE_MULTIPLEX_VERSION and nothing is re-derived: the second clear_pins rebalance is not idempotent by token, only by outcome"
            - "rebalance is not blocked by an on-air playlist: channel 12.1 stays ON_AIR and no AsRunEntry is appended by any of the three rebalances — bitrate changes are silent on the as-run log"

      # -- E6 -------------------------------------------------------------
      - name: substitute_defaults_to_the_outgoing_duration_and_rule_57_swallows_the_duration_window
        claim_type: Defaults
        grounds: "§1.5 POST /playlist-items/{id}/substitute ('Replace a scheduled or cued element with a different asset ... The new item records replaces_item_id and the old item moves to SKIPPED with an AsRunEntry.', input [replacement_asset_id, scheduled_duration_seconds?, reason?], code 201, side_effects [outgoing item -> SKIPPED + AsRunEntry, new PlaylistItem with replaces_item_id, clearance_status derivation, playlist_timeline_integrity re-check, playlist_timing_variance (PROJECTED), airtime_seconds_conservation assertion]); §1.4 priority 57 ERR_SUBSTITUTE_RESOLUTION_MISMATCH ('the replacement asset's delivered_resolution_class must equal the outgoing item's asset required_resolution_class, AND the replacement's measured_duration_seconds must be within max_trim_seconds of the outgoing scheduled_duration_seconds'); §1.4 priority 58 ERR_TRIM_EXCEEDS_MAX ('BOUNDARY: a trim exactly equal to max_trim_seconds is accepted'); §1.1 PlaylistItem.max_trim_seconds (default 0); §1.3 playlist_timeline_integrity"
        distinguishing_aspect: "Rule 57 is deliberately mis-named: its check covers BOTH the resolution equality AND the duration window, so a replacement of the correct resolution but the wrong length returns ERR_SUBSTITUTE_RESOLUTION_MISMATCH rather than the ERR_TRIM_EXCEEDS_MAX that rule 58 seems to own — 58 fires only for the trim the REQUEST asks for (scheduled_duration_seconds), never for the asset's natural length. Layered on that: (i) the resolution comparison is asymmetric — the replacement's DELIVERED class against the outgoing asset's REQUIRED class, so an asset delivered at a higher class than it required is still a mismatch; (ii) scheduled_duration_seconds DEFAULTS to the outgoing item's scheduled duration, not to the replacement's measured duration, which is the only default that keeps the timeline contiguous; (iii) because §1.3 removes SKIPPED items before the walk but demands mandatory adjacency, any duration-changing substitution on an INTERIOR item leaves a hole and dies on the timeline re-check even when rules 57 and 58 are satisfied — so a legal trim is only reachable on the trailing element; and (iv) a COMMERCIAL carries max_trim_seconds 0, so the trim-0 substitution is legal (boundary: trim == max is accepted) while a one-second change is not."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then deliver and QC three replacement assets: SUB-OK (HD_1080I, 60 s), SUB-SD (SD_480I, 60 s) and SUB-LONG (HD_1080I, 100 s). Item 5 is a 60 s PROMO with max_trim_seconds 30; items 2 and 3 are 30 s COMMERCIALs with max_trim_seconds 0."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /assets"
              as: TrafficCoordinator
              payload: {house_number: "HN-SUB-OK", title: "Filler Promo", source: LOCAL_ARCHIVE, expected_duration_seconds: 60, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false}
              captures: {sok_id: "$.data.id"}
            - call: "POST /assets/${sok_id}/delivery"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {received_utc: "2026-08-01T09:30:00Z", measured_duration_seconds: 60, video_codec: XDCAM, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: false}
              captures: {sok_v2: "$.data.version"}
            - call: "POST /assets/${sok_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${sok_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 60}
            - call: "POST /assets"
              as: TrafficCoordinator
              payload: {house_number: "HN-SUB-SD", title: "Filler Promo SD", source: LOCAL_ARCHIVE, expected_duration_seconds: 60, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: SD_480I, captions_required: false}
              captures: {ssd_id: "$.data.id"}
            - call: "POST /assets/${ssd_id}/delivery"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {received_utc: "2026-08-01T09:30:00Z", measured_duration_seconds: 60, video_codec: XDCAM, delivered_resolution_class: SD_480I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: false}
              captures: {ssd_v2: "$.data.version"}
            - call: "POST /assets/${ssd_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${ssd_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 60}
            - call: "POST /assets"
              as: TrafficCoordinator
              payload: {house_number: "HN-SUB-LONG", title: "Long Filler", source: LOCAL_ARCHIVE, expected_duration_seconds: 100, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false}
              captures: {slg_id: "$.data.id"}
            - call: "POST /assets/${slg_id}/delivery"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {received_utc: "2026-08-01T09:30:00Z", measured_duration_seconds: 100, video_codec: XDCAM, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: false}
              captures: {slg_v2: "$.data.version"}
            - call: "POST /assets/${slg_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${slg_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 100}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${ssd_id}", reason: "RIGHTS_PULL"}
              captures: {e_sub_res: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${slg_id}", reason: "RIGHTS_PULL"}
              captures: {e_sub_len: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${sok_id}", scheduled_duration_seconds: 29, reason: "RIGHTS_PULL"}
              captures: {e_sub_trim: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${sok_id}", scheduled_duration_seconds: 30, reason: "RIGHTS_PULL"}
              captures: {e_sub_gap: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${sok_id}", reason: "RIGHTS_PULL"}
              captures: {sub_new_id: "$.data.id", sub_replaces: "$.data.replaces_item_id", sub_dur: "$.data.scheduled_duration_seconds", sub_clear: "$.data.clearance_status", sub_seq: "$.data.sequence_number"}
            - call: "GET /playlist-items/${it5_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {it5_after: "$.data.playout_status"}
            - call: "POST /playlist-items/${it2_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${sok_id}", scheduled_duration_seconds: 31, reason: "SPOT_PULL"}
              captures: {e_sub_comm: "$.data.error_id"}
          assert:
            - "SD replacement for an HD_1080I-required element -> 409 ${e_sub_res} == ERR_SUBSTITUTE_RESOLUTION_MISMATCH; the comparison is the REPLACEMENT's delivered_resolution_class against the OUTGOING asset's required_resolution_class, so it is not symmetric and an HD replacement for an SD-required element is equally rejected"
            - "a correctly-sized-class replacement whose measured_duration_seconds is 100 against a 60 s slot with max_trim_seconds 30 -> 409 ${e_sub_len} == ERR_SUBSTITUTE_RESOLUTION_MISMATCH, NOT ERR_TRIM_EXCEEDS_MAX: rule 57 owns the duration WINDOW even though its id names resolution, and it is evaluated before rule 58"
            - "an explicit scheduled_duration_seconds of 29 (a 31 s trim on a 30 s allowance) -> 409 ${e_sub_trim} == ERR_TRIM_EXCEEDS_MAX: rule 58 owns the trim the REQUEST asks for"
            - "an explicit scheduled_duration_seconds of 30 satisfies both 57 and 58 (trim 30 == max_trim_seconds 30, the inclusive boundary) yet still fails: 409 ${e_sub_gap} == ERR_SCHEDULE_GAP_DETECTED, because item 6 still starts at 12:37:00 and the SKIPPED outgoing item is removed from the walk — a legal trim is only reachable on the TRAILING element of the playlist"
            - "the default-duration substitution succeeds with 201: ${sub_dur} == 60 (the OUTGOING item's scheduled duration, NOT the replacement's measured duration and NOT the replacement's expected_duration_seconds), ${sub_replaces} == ${it5_id}, and the timeline stays contiguous"
            - "the replacement inherits the outgoing slot: ${sub_seq} == 5, so GET /playlists/${pl1_id}/items ordered by sequence_number ASC still walks the timeline in chronological order with the SKIPPED original alongside it"
            - "the outgoing item is ${it5_after} == SKIPPED and exactly ONE AsRunEntry is appended for it; the new item has no as-run rows yet (GET /playlist-items/${sub_new_id}/as-run == [])"
            - "clearance is DERIVED for the new item, not inherited: ${sub_clear} == CLEARED because SUB-OK is QC_PASSED; substituting a QC_FAILED or still-EXPECTED asset creates the item in BLOCKED / UNCLEARED and the later CUE is refused by ERR_UNCLEARED_CONTENT_ON_AIR"
            - "COMMERCIAL substitution with a one-second change -> 409 ${e_sub_comm} == ERR_TRIM_EXCEEDS_MAX because COMMERCIAL always carries max_trim_seconds 0; the SAME call with no scheduled_duration_seconds (trim 0 == max 0) is ACCEPTED, which is the inclusive boundary of rule 58"
            - "airtime conservation holds across the accepted substitution: the sum of scheduled_duration_seconds over non-SKIPPED items is still 3600 and projected_end_utc is still 13:00:00Z"
            - "substituting a PLAYING item -> 409 ERR_ITEM_INVALID_PLAYOUT_STATE, and substituting anything on a SUSPENDED-posture channel -> 409 ERR_CHANNEL_SUSPENDED_POSTURE (rule 25 names substitutions explicitly)"
            - "every rejected substitution leaves zero trace: no new PlaylistItem row, item 5 still SCHEDULED, playlist version and traffic_revision unchanged"

      # -- E7 -------------------------------------------------------------
      - name: one_clock_advance_runs_checkpoints_a_to_e_in_the_pinned_order_and_nothing_else_ever_sweeps
        claim_type: Side Effect Execution
        grounds: "§1.5 POST /_clock/set_current_utc ('the ONLY source of now ... The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that instant and NEVER falls back to real wall-clock time. Advancing the clock is the ops-run checkpoint: it performs, in this pinned order, (a) OUTAGE notification creation for transmitters whose OFF_AIR duration has reached 1800 s, (b) PENDING -> OVERDUE for notifications past due_utc, (c) EXPECTED -> EXPIRED for assets past delivery_deadline_utc + 3600 s with the CASCADE B' clearance chain, (d) DETECTED -> AUTO_CLEARED for never-acknowledged MINOR faults older than 900 s with posture recomputation, (e) re-derivation of Operator.certification_state. There are no background jobs; nothing expires unless this endpoint is called.', roles = all 7, input [current_utc], output null); §1.3 note 'Order a -> e is pinned: (a) can create rows that (b) then evaluates'; §1.4 priority 43 ERR_CLOCK_NOT_MONOTONIC"
        distinguishing_aspect: "The single most load-bearing endpoint in the API, and the only one whose correctness is about ORDER rather than about a value. A single advance must perform five different sweeps, and (a) feeds (b) within the SAME call: an OUTAGE notification created by (a) for an outage that began more than 86400 s ago is already past its own due_utc, so (b) must transition the row it has just seen created and the caller observes a notification that was never once PENDING. Reverse the order and the same jump leaves it PENDING for a whole extra advance. The endpoint is also the only one open to all 7 roles (so a TrafficCoordinator can trigger an asset expiry that cascades into playlist clearance), it returns output null (no entity, and the caller must re-read every affected row), it is strictly monotonic (replaying the same instant is ERR_CLOCK_NOT_MONOTONIC, which makes the sweep un-replayable), and its sweeps are IDEMPOTENT with respect to further advances (a second advance must not create a second OUTAGE notification for the same still-open outage)."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig. At 11:59 arrange one of every sweepable condition: reduce the transmitter to 79 percent (creating a PENDING POWER_REDUCTION notification due 2026-08-02T11:59:00Z), take it OFF_AIR at 12:00 (opening an outage epoch), ingest an asset with a 12:00 delivery deadline and never deliver it (expiry at 13:00), raise a MINOR CAPTION_LOSS fault at 11:59 and never acknowledge it (auto-clear at 12:14), and create an operator whose certification expires at 13:00."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 79, reason: "COOLING_FAULT"}
              captures: {e7_tx_state: "$.data.operational_state"}
            - call: "POST /assets"
              as: TrafficCoordinator
              payload: {house_number: "HN-LATE-01", title: "Late Feature", source: SATELLITE, expected_duration_seconds: 1320, delivery_deadline_utc: "2026-08-01T12:00:00Z", required_resolution_class: HD_1080I, captions_required: false}
              captures: {e7_asset_id: "$.data.id", e7_asset_status: "$.data.status"}
            - call: "POST /technical-faults"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {fault_code: CAPTION_LOSS, severity: MINOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {e7_fault_id: "$.data.id"}
            - call: "POST /operators"
              as: StationAdmin
              payload: {full_name: "Eve Nagy", role_class: QC, override_authority: NONE, certification_expires_utc: "2026-08-01T13:00:00Z"}
              captures: {e7_op_id: "$.data.id", e7_op_cert: "$.data.certification_state"}
            - call: "POST /_clock/set_current_utc"
              as: TrafficCoordinator
              payload: {current_utc: "2026-08-01T12:00:00Z"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: OFF_AIR, reason: "TOTAL_POWER_LOSS"}
              captures: {e7_off: "$.data.operational_state", e7_outage_start: "$.data.outage_started_utc"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: ComplianceOfficer
              payload: {kind: OUTAGE}
            - call: "POST /_clock/set_current_utc"
              as: TrafficCoordinator
              payload: {current_utc: "2026-08-02T12:00:01Z"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: ComplianceOfficer
              payload: {kind: OUTAGE}
              captures: {e7_out_id: "$.data[0].id", e7_out_status: "$.data[0].status", e7_out_due: "$.data[0].due_utc"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: ComplianceOfficer
              payload: {kind: POWER_REDUCTION}
              captures: {e7_pr_status: "$.data[0].status"}
            - call: "GET /assets/${e7_asset_id}"
              as: TrafficCoordinator
              captures: {e7_asset_after: "$.data.status"}
            - call: "GET /technical-faults/${e7_fault_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {e7_fault_after: "$.data.state", e7_fault_cleared: "$.data.cleared_utc"}
            - call: "GET /operators/${e7_op_id}"
              as: StationAdmin
              captures: {e7_op_cert_after: "$.data.certification_state"}
            - call: "GET /transmitters/${tx1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {e7_pending_count: "$.data.notification_pending_count"}
            - call: "POST /_clock/set_current_utc"
              as: TrafficCoordinator
              payload: {current_utc: "2026-08-02T12:00:01Z"}
              captures: {e7_clock_err: "$.data.error_id"}
            - call: "POST /_clock/set_current_utc"
              as: TrafficCoordinator
              payload: {current_utc: "2026-08-02T12:00:02Z"}
          assert:
            - "before the big advance NOTHING has swept: immediately after the OFF_AIR write, GET /transmitters/${tx1_id}/notifications?kind=OUTAGE is EMPTY even though the write itself opened the outage epoch (${e7_outage_start} == 2026-08-01T12:00:00Z) — the OUTAGE row is created by checkpoint (a), never by the power-state endpoint"
            - "the single advance to 2026-08-02T12:00:01Z creates the OUTAGE notification (checkpoint a: duration 86401 s >= 1800) with ${e7_out_due} == 2026-08-02T12:00:00Z, and checkpoint (b) then finds it already past due in the SAME call: ${e7_out_status} == OVERDUE — the row is never observable as PENDING"
            - "the pre-existing POWER_REDUCTION notification is also swept by (b): ${e7_pr_status} == OVERDUE (due 2026-08-02T11:59:00Z, one minute before the new clock)"
            - "checkpoint (c) expires the undelivered asset: ${e7_asset_status} was EXPECTED at ingest and ${e7_asset_after} == EXPIRED (deadline 12:00 + 3600 s grace = 13:00, long past), and the CASCADE B' clearance chain runs on any playlist item pointing at it in the same call"
            - "checkpoint (d) auto-clears the never-acknowledged MINOR fault: ${e7_fault_after} == AUTO_CLEARED with ${e7_fault_cleared} == 2026-08-02T12:00:01Z (the clock instant, not the 900 s anniversary), and channel posture is recomputed as part of the same checkpoint"
            - "checkpoint (e) re-derives certification: ${e7_op_cert} == VALID at creation and ${e7_op_cert_after} == EXPIRED afterwards, with no write to the operator row"
            - "the derived counter reflects both sweeps: ${e7_pending_count} == 2, because notification_pending_count counts status IN {PENDING, OVERDUE} and both rows are now OVERDUE"
            - "the endpoint returns output null: response_type is \"object\" with data null (or an empty object), and it never returns the swept rows — every observation above requires a separate read"
            - "any of the 7 roles may advance the clock: this instance drives it as TrafficCoordinator, whose advance nonetheless expires an asset and cascades into playlist clearance that TrafficCoordinator could not have caused directly"
            - "replaying the same instant -> 409 ${e7_clock_err} == ERR_CLOCK_NOT_MONOTONIC and NO checkpoint re-runs — the sweep cannot be replayed by repeating the request"
            - "the next legal advance (2026-08-02T12:00:02Z) is accepted and is a NO-OP on all five checkpoints: still exactly one OUTAGE notification for the still-open outage (no duplicate row), the asset stays EXPIRED, the fault stays AUTO_CLEARED, and no version anywhere is bumped a second time"
            - "no other endpoint in the API performs any of these five sweeps: a GET, a playout event, a rebalance or a QC report at a stale clock all leave the overdue notification PENDING, the expired asset EXPECTED and the old MINOR fault DETECTED"

      # -- E8 -------------------------------------------------------------
      - name: writes_return_14_created_and_17_ok_and_five_of_them_return_a_different_entity_than_their_path
        claim_type: Creation
        grounds: "§1.5 the 14 endpoints declared code: 201 (POST /transmitters, /multiplexes, /operators, /channels, /assets, /assets/{id}/qc-reports, /playlists, /playlist-items/{id}/playout-events, /playlist-items/{id}/substitute, /network-feed-windows, /emergency-overrides, /technical-faults, /spot-orders, /spot-orders/{id}/makegoods) versus the 17 declared code: 200 writes (every /state, /status, /air-state, /power-state, /allocation, /rebalance, /delivery, /qc-waivers, /retract, /traffic-revisions, /join, /breakaway, /activate, /release, /file and /_clock/set_current_utc); §1.5 the declared output types of those endpoints"
        distinguishing_aspect: "The 201/200 split does not follow the URL shape, it follows whether a ROW is born: POST /assets/{id}/qc-reports is 201 (a QCReport is created) while POST /assets/{id}/qc-waivers is 200 (the asset is only mutated); POST /playlist-items/{id}/playout-events is 201 (an AsRunEntry is created) while POST /playlists/{id}/state is 200; POST /playlist-items/{id}/substitute is 201 (a new item) while POST /playlists/{id}/traffic-revisions is 200 (the same playlist row, a bumped traffic_revision). Five writes also return an entity of a DIFFERENT type than the path names, which is the most commonly mis-implemented part of the surface: /assets/{id}/qc-reports -> QCReport (not Asset, so the caller must re-read the asset to see the new status), /playlist-items/{id}/playout-events -> AsRunEntry (not PlaylistItem, so the new playout_status is invisible in the response), /playlist-items/{id}/substitute -> PlaylistItem (the NEW item, not the outgoing one), /spot-orders/{id}/makegoods -> PlaylistItem (not SpotOrder), and PATCH /channels/{id}/allocation -> Channel while consuming a Multiplex version. The clock endpoint alone returns output null."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig and exercise one write of each shape."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_qc_id}", basis: AIR_CHECK, defect_codes: [], measured_duration_seconds: 60}
              captures: {e8_qc_id: "$.data.id", e8_qc_basis: "$.data.basis"}
            - call: "GET /assets/${apromo_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: {e8_asset_status: "$.data.status"}
            - call: "POST /playlist-items/${it1_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-01T11:59:00Z", source: OPERATOR}
              captures: {e8_asrun_id: "$.data.id", e8_asrun_kind: "$.data.event_kind"}
            - call: "GET /playlist-items/${it1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {e8_item_status: "$.data.playout_status"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "ENCODER_SWAP"}
              captures: {e8_ch2_air: "$.data.air_status"}
            - call: "GET /playlist-items/${it1_id}/as-run"
              as: ComplianceOfficer
              captures: {e8_item_asrun: "$.data[0].id"}
          assert:
            - "POST /assets/{id}/qc-reports returns HTTP 201 with a QCREPORT body: ${e8_qc_id} is a QCReport id and ${e8_qc_basis} == AIR_CHECK; the asset's new status is NOT in that response and must be read separately (${e8_asset_status})"
            - "POST /playlist-items/{id}/playout-events returns HTTP 201 with an ASRUNENTRY body: ${e8_asrun_kind} == CUE, and the item's new ${e8_item_status} == PLAYING is visible only via a separate read"
            - "the two as-run readers agree: ${e8_item_asrun} == ${e8_asrun_id}, and GET /playlists/${pl1_id}/as-run contains the same row — the per-item log is a filtered projection of the playlist log, never a second store"
            - "POST /channels/{id}/air-state returns HTTP 200 with a CHANNEL body (${e8_ch2_air} == BARS_AND_TONE): no row is created, so it is not a 201"
            - "the full 201 set is exactly the 14 endpoints listed in grounds; every other write is 200, including POST /playlists/{id}/traffic-revisions (which bumps traffic_revision on the SAME playlist row) and POST /assets/{id}/qc-waivers (which mutates the asset without creating a report)"
            - "POST /spot-orders/{id}/makegoods returns 201 with a PLAYLISTITEM body carrying replaces_item_id and is_makegood true — not the SpotOrder whose counters it moved"
            - "POST /_clock/set_current_utc is the only write with output null; every other write returns exactly one entity object, never an array"
            - "every successful write bumps its target's version by exactly 1, and the version in the RESPONSE is the post-write value, so a caller can chain OCC tokens from responses everywhere EXCEPT the allocation endpoint (whose token lives on the parent multiplex)"

      # -- E9 -------------------------------------------------------------
      - name: reconciliation_is_a_pure_computed_read_whose_basis_default_hides_unplaced_spots
        claim_type: Variant Selection
        grounds: "§1.5 GET /playlists/{id}/reconciliation ('Computed read: reconcile the as-run log against the spot orders touched by this playlist. basis=PRELIMINARY (default) excludes still-pending spots; basis=FINAL credits ordered-but-unplaced spots in full. Purely read-only - it never mutates the orders.', roles [TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer], input [basis?], output Playlist, side_effects ['spot_credit_settlement (PRELIMINARY or FINAL variant, computed and returned, not persisted)']); §1.3 spot_credit_settlement"
        distinguishing_aspect: "The only endpoint in the API whose OUTPUT TYPE lies about its content: it is declared output Playlist, so the settlement figures must ride on the playlist projection (reconciliation_credit_cents and the per-order rollup) rather than on a bespoke shape, and the SAME playlist read through GET /playlists/{id} must NOT show them. It is also the only read whose answer depends on a variant selector, the only read excluded from MasterControlOperator (the role that generates the as-run rows it reconciles cannot read the money view — a segregation-of-duties boundary that is invisible in the state machines), and the only read that runs a calculation with persisted side effects DISABLED: the FINAL variant credits every ordered-but-unplaced spot in full, which would change SpotOrder.credit_accrued_cents if it were persisted, so calling it twice must return the same number twice and must leave the order untouched forever."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig: ORD-2026-0001 has 4 ordered spots at 100000 cents each, 2 of them placed as items 2 and 3 of the airing playlist and 2 still unplaced."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: TrafficCoordinator
              captures: {e9_prelim: "$.data.reconciliation_credit_cents"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: TrafficCoordinator
              payload: {basis: PRELIMINARY}
              captures: {e9_prelim2: "$.data.reconciliation_credit_cents"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: ComplianceOfficer
              payload: {basis: FINAL}
              captures: {e9_final: "$.data.reconciliation_credit_cents"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {basis: FINAL}
              captures: {e9_final2: "$.data.reconciliation_credit_cents"}
            - call: "GET /spot-orders/${ord1_id}"
              as: TrafficCoordinator
              captures: {e9_order_credit: "$.data.credit_accrued_cents", e9_order_status: "$.data.status"}
            - call: "GET /playlists/${pl1_id}"
              as: TrafficCoordinator
              captures: {e9_pl_version: "$.data.version"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {basis: FINAL}
              captures: {e9_denied: "$.data.error_id"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: TrafficCoordinator
              payload: {basis: PROVISIONAL}
              captures: {e9_enum: "$.data.error_id"}
          assert:
            - "the DEFAULT basis is PRELIMINARY: ${e9_prelim} == ${e9_prelim2} == 0 — nothing has aired short yet and the two unplaced spots are excluded from the preliminary view"
            - "basis=FINAL credits the two ordered-but-unplaced spots in full: ${e9_final} == 200000 (2 x 100000), which is 200000 more than the default view of the SAME playlist at the SAME instant"
            - "the FINAL read is repeatable and pure: ${e9_final2} == ${e9_final}, ${e9_order_credit} == 0 and ${e9_order_status} == OPEN after four reconciliation reads — the settlement variant runs with persistence disabled"
            - "the playlist row is untouched by any of the reads: ${e9_pl_version} equals its pre-read value and no AsRunEntry is appended"
            - "the figures ride on the declared output type: the response is a PLAYLIST projection carrying reconciliation_credit_cents plus the per-order rollup, and the plain GET /playlists/${pl1_id} does NOT expose those fields"
            - "MasterControlOperator is excluded even though it owns every as-run row the endpoint reconciles: 403 ${e9_denied} == ERR_ROLE_NOT_PERMITTED (the role list is [TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer])"
            - "basis=PROVISIONAL -> 422 ${e9_enum} == ERR_INVALID_ENUM_VALUE: only PRELIMINARY and FINAL exist"
            - "the same PRELIMINARY / FINAL divergence must survive a CLOSED playlist: after the playlist reaches CLOSED the persisted settlement equals the FINAL figure, and a further FINAL reconciliation read must then return the SAME number rather than double-crediting the already-credited spots"

      # -- E10 ------------------------------------------------------------
      - name: operator_status_is_a_three_optional_field_patch_whose_certification_edit_bypasses_the_clock
        claim_type: Defaults
        grounds: "§1.5 POST /operators/{id}/status ('Suspend or reinstate an operator, or extend certification.', roles [StationAdmin], code 200, input [status?, certification_expires_utc?, override_authority?], output Operator, side_effects ['certification_state re-derivation']); §1.5 POST /_clock/set_current_utc checkpoint (e); §1.4 priorities 6 and 7; §1.1 Operator.role_class ('fixes which X-User-Role the operator may present')"
        distinguishing_aspect: "Three optional fields and NO required field, so the endpoint's contract is entirely about what it does NOT do. role_class is deliberately absent from the input list: an operator's role_class is immutable for life, which is what makes rule 3 (X-User-Role must equal the referenced operator's role_class) a stable invariant rather than a race — an implementation that accepts role_class here breaks every identity check retroactively. certification_expires_utc is the mirror image of checkpoint (e): moving the DEADLINE re-derives certification_state IMMEDIATELY inside this call, while moving the CLOCK only re-derives at the next advance — so an expired operator can be reinstated without touching the clock, and the same operator can be re-expired by shortening the deadline to the past in a call that itself succeeds. override_authority is editable, which means a segregation-of-duties test can be flipped mid-scenario, and the edit must apply to FUTURE authorizations only (an override already ACTIVE is not retro-invalidated). Finally, an empty body is a legal no-op that still re-derives and still bumps the version."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig. Create an operator whose certification expired an hour ago (logical clock is 11:59, deadline 10:59) so the operator starts EXPIRED without any clock movement."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /operators"
              as: StationAdmin
              payload: {full_name: "Fay Orloff", role_class: MASTER_CONTROL, override_authority: NONE, certification_expires_utc: "2026-08-01T10:59:00Z"}
              captures: {e10_op_id: "$.data.id", e10_cert0: "$.data.certification_state", e10_v1: "$.data.version"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${e10_op_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "TEST"}
              captures: {e10_blocked: "$.data.error_id"}
            - call: "POST /operators/${e10_op_id}/status"
              as: StationAdmin
              payload: {certification_expires_utc: "2026-08-02T00:00:00Z"}
              captures: {e10_cert1: "$.data.certification_state", e10_v2: "$.data.version"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${e10_op_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "TEST"}
              captures: {e10_air: "$.data.air_status"}
            - call: "POST /operators/${e10_op_id}/status"
              as: StationAdmin
              payload: {status: SUSPENDED}
              captures: {e10_status1: "$.data.status", e10_cert2: "$.data.certification_state", e10_v3: "$.data.version"}
            - call: "POST /operators/${e10_op_id}/status"
              as: StationAdmin
              payload: {}
              captures: {e10_status2: "$.data.status", e10_v4: "$.data.version"}
            - call: "POST /operators/${e10_op_id}/status"
              as: StationAdmin
              payload: {role_class: QC}
              captures: {e10_role_err: "$.data.error_id"}
            - call: "POST /operators/${e10_op_id}/status"
              as: StationAdmin
              payload: {status: ACTIVE, override_authority: FULL}
              captures: {e10_status3: "$.data.status", e10_auth: "$.data.override_authority"}
          assert:
            - "the operator is born EXPIRED with no clock movement: ${e10_cert0} == EXPIRED, because certification_state is derived against the logical clock at creation (11:59 > 10:59)"
            - "an EXPIRED certification blocks mutations: 403 ${e10_blocked} == ERR_OPERATOR_CERTIFICATION_EXPIRED (rule 7)"
            - "extending the deadline re-derives IN THE SAME CALL: ${e10_cert1} == VALID and ${e10_v2} == ${e10_v1} + 1 — no clock advance is needed, which is the asymmetry with checkpoint (e) that only re-derives on time movement"
            - "the same operator can now mutate: ${e10_air} == BARS_AND_TONE"
            - "a status-only edit leaves certification alone: ${e10_status1} == SUSPENDED while ${e10_cert2} == VALID (the two fields are independent, and rule 6 outranks rule 7 when both would fire)"
            - "an EMPTY body is a legal no-op that still re-derives and still bumps the version: ${e10_status2} == SUSPENDED (unchanged) and ${e10_v4} == ${e10_v3} + 1"
            - "role_class is NOT an input of this endpoint: the request carrying it -> 422 ${e10_role_err} == ERR_INVALID_FIELD_VALUE (undeclared field) and the stored role_class stays MASTER_CONTROL — an operator's role_class is immutable for life, which is what makes rule 3's identity check stable"
            - "two fields can move in one call: ${e10_status3} == ACTIVE and ${e10_auth} == FULL, and the version bumps by exactly 1 for the pair (not once per field)"
            - "the override_authority edit is forward-looking only: an EmergencyOverride already ACTIVE under the old authority stays ACTIVE and its authorized_by_operator_id is not revalidated"
            - "shortening certification_expires_utc into the past is a SUCCESSFUL call that immediately returns certification_state EXPIRED — the endpoint never refuses a backdated deadline, it just re-derives"

  # ===========================================================================
  # ERRORS — all 96 ids in §1.4 / the error catalogue, grouped into 8 families
  # so that every id has at least one request that produces it and no other.
  # 7 auth + 16 shape/not-found + 12 occ/state + 8 air-safety + 11 authority
  # + 13 temporal + 14 air-window/uniqueness + 15 reference/arithmetic = 96.
  # ===========================================================================
  - section: errors
    instances:

      # -- X1 -------------------------------------------------------------
      - name: the_seven_auth_ids_split_401_from_403_and_never_leak_existence
        claim_type: Violation → Error
        grounds: "§1.4 priorities 1-7 and the catalogue entries ERR_MISSING_AUTH_HEADERS (401), ERR_UNKNOWN_ROLE (401), ERR_OPERATOR_NOT_FOUND (401), ERR_ROLE_IDENTITY_MISMATCH (403), ERR_ROLE_NOT_PERMITTED (403), ERR_OPERATOR_SUSPENDED (403), ERR_OPERATOR_CERTIFICATION_EXPIRED (403)"
        distinguishing_aspect: "Three of the seven are 401 and four are 403, and the split is not 'authentication vs authorization' in the usual sense: ERR_OPERATOR_NOT_FOUND is a 401 even though it is a lookup failure, because an X-User-ID that names nobody is an unauthenticated caller — so a caller probing operator ids gets 401 for a non-existent id and 403 for an existing but wrong-role id, which is the one place the API deliberately leaks existence through a status code and must therefore do it CONSISTENTLY. The other trap is that the four 403s are ordered among themselves (3 identity, 5 permission, 6 suspension, 7 certification) and every pair must resolve to the LOWER number, including the counter-intuitive pair where a suspended operator presents the wrong role: the answer is the identity mismatch, not the suspension."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, which already has one operator of each entity-backed role_class (ENGINEER, MASTER_CONTROL, QC, PROGRAM_DIRECTOR)."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /channels/${ch2_id}/air-state"
              as: MasterControlOperator
              as_user_id: "00000000-0000-4000-8000-00000000dead"
              payload: {target_air_status: BARS_AND_TONE, reason: "PROBE"}
              captures: {x1_notfound: "$.data.error_id"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${op_qc_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "PROBE"}
              captures: {x1_identity: "$.data.error_id"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "PROBE"}
              captures: {x1_permission: "$.data.error_id"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {x1_read_denied: "$.data.error_id"}
          assert:
            - "an X-User-ID naming nobody -> 401 ${x1_notfound} == ERR_OPERATOR_NOT_FOUND (a 401, not a 404 and not a 403)"
            - "a real operator presenting a role that is not their role_class -> 403 ${x1_identity} == ERR_ROLE_IDENTITY_MISMATCH (rule 3)"
            - "a real operator presenting their OWN role at an endpoint that role may not call -> 403 ${x1_permission} == ERR_ROLE_NOT_PERMITTED (rule 5)"
            - "the same 403 governs reads: ${x1_read_denied} == ERR_ROLE_NOT_PERMITTED for MasterControlOperator on the reconciliation view"
            - "ERR_MISSING_AUTH_HEADERS (401) is produced by omitting X-User-Role or X-User-ID entirely and is UNREACHABLE through a well-formed request; it outranks every other check, so a request with no headers at all and a malformed body is still 401 rather than 422"
            - "ERR_UNKNOWN_ROLE (401) is produced by an X-User-Role that is not one of the 7 declared roles (for example NetworkOperator); it is a 401 because the role vocabulary is part of authentication, while a KNOWN role at a forbidden endpoint is the 403 above"
            - "ERR_OPERATOR_SUSPENDED (403) is produced by any mutation from an operator whose status is SUSPENDED, and ERR_OPERATOR_CERTIFICATION_EXPIRED (403) by any mutation from an operator whose certification_state is EXPIRED; BOTH still allow every GET"
            - "priority pairs inside the family, all resolving to the lower rule id: no-headers + unknown role -> ERR_MISSING_AUTH_HEADERS; unknown role + unknown id -> ERR_UNKNOWN_ROLE; unknown id + forbidden endpoint -> ERR_OPERATOR_NOT_FOUND; wrong role for identity + forbidden endpoint -> ERR_ROLE_IDENTITY_MISMATCH; suspended + expired -> ERR_OPERATOR_SUSPENDED; suspended + wrong identity -> ERR_ROLE_IDENTITY_MISMATCH"
            - "the three opaque roles (TrafficCoordinator, ComplianceOfficer, StationAdmin) can only ever produce ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE and ERR_ROLE_NOT_PERMITTED from this family: with no Operator row behind them, rules 3, 4, 6 and 7 are structurally unreachable for them"

      # -- X2 -------------------------------------------------------------
      - name: three_shape_ids_and_thirteen_not_found_ids_each_own_exactly_one_condition
        claim_type: Violation → Error
        grounds: "§1.4 priorities 8-10 (ERR_MISSING_REQUIRED_FIELD, ERR_INVALID_ENUM_VALUE, ERR_INVALID_FIELD_VALUE, all 422) and 11-23 (ERR_TRANSMITTER_NOT_FOUND, ERR_MULTIPLEX_NOT_FOUND, ERR_CHANNEL_NOT_FOUND, ERR_OPERATOR_REFERENCE_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_QC_REPORT_NOT_FOUND, ERR_PLAYLIST_NOT_FOUND, ERR_PLAYLIST_ITEM_NOT_FOUND, ERR_SPOT_ORDER_NOT_FOUND, ERR_FEED_WINDOW_NOT_FOUND, ERR_OVERRIDE_NOT_FOUND, ERR_FAULT_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND, all 404)"
        distinguishing_aspect: "Thirteen distinct 404 ids means the entity KIND must be inferred from the position that failed, not from the endpoint: POST /technical-faults with a bad channel_id is ERR_CHANNEL_NOT_FOUND while the same endpoint with a bad playlist_item_id is ERR_PLAYLIST_ITEM_NOT_FOUND, and a bad inspected_by_operator_id is ERR_OPERATOR_REFERENCE_NOT_FOUND — which is a DIFFERENT id from the 401 ERR_OPERATOR_NOT_FOUND that the same uuid would produce in the X-User-ID header, so one uuid yields two different errors depending on where it appears. Ordering matters twice over: the 422 shape checks (8-10) run BEFORE every 404, so a request with both a missing field and three dangling references is a single 422; and the 403 role check runs before the 404 path lookup, so an unauthorized caller cannot use 404-vs-403 to probe which ids exist."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig. All probes use the reserved uuid 00000000-0000-4000-8000-0000000000ff, which names nothing."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: CAPTION_LOSS, severity: MINOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "00000000-0000-4000-8000-0000000000ff"}
              captures: {x2_ch404: "$.data.error_id"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: CAPTION_LOSS, severity: MINOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}", playlist_item_id: "00000000-0000-4000-8000-0000000000ff"}
              captures: {x2_item404: "$.data.error_id"}
            - call: "POST /assets/${aprog_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${aprog_v3}", inspected_by_operator_id: "00000000-0000-4000-8000-0000000000ff", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800}
              captures: {x2_opref404: "$.data.error_id"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: NOT_A_CODE, severity: MINOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "00000000-0000-4000-8000-0000000000ff"}
              captures: {x2_enum_wins: "$.data.error_id"}
            - call: "POST /transmitters"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {facility_id: "FAC-70099", call_sign: "WTST", authorized_erp_kw: -5}
              captures: {x2_value: "$.data.error_id"}
            - call: "GET /qc-reports/00000000-0000-4000-8000-0000000000ff"
              as: ComplianceOfficer
              captures: {x2_qc404: "$.data.error_id"}
            - call: "GET /regulatory-notifications/00000000-0000-4000-8000-0000000000ff"
              as: ComplianceOfficer
