            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/vehicles", payload: { plate: "AAA111", vehicle_type: "TRACTOR" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${m_id}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-13T06:00:00Z" }, as: Cashier, as_user_id: "cash-1", captures: { r_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "SNACK-A", name: "Snack A", category: "RETAIL", unit: "ea", unit_price_cents: 999, reorder_point: 10, initial_on_hand_quantity: 5 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${p1}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CARD", max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T22:30:00Z" }, as: GeneralManager }
            - { call: "POST /parking-reservations/${r_id}/check-in", payload: { tender_type: "CARD", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { assigned: "$.data.assigned_space_id" } }
          trigger:
            - { call: "GET /sites/${site_id}/dashboard", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { pumps_total: "$.data.pumps_total", pumps_in_use: "$.data.pumps_in_use", parking_active: "$.data.parking_active_count", shower_q: "$.data.shower_queue_depth", laundry_q: "$.data.laundry_queue_depth", low_stock: "$.data.low_stock_count" } }
          assert:
            - "pumps_total == 2 and pumps_in_use == 1 (authorized sale holds pump 1)"
            - "parking_active_count == 1 (checked-in reservation) and assigned_space_id == the A1 space (selector: lowest space_number)"
            - "shower_queue_depth == 1 and laundry_queue_depth == 0"
            - "low_stock_count == 1"

      - name: endpoint_store_sale_refund_cycle
        claim_type: action_endpoint
        grounds:
          - "endpoints.POST /sites/{id}/store-sales"
          - "endpoints.POST /store-sales/{id}/refund"
          - "state_machines.StoreSale"
        distinguishing_aspect: "Store sale decrements stock and earns points at creation; refund restores stock exactly, claws back the earned 30 points via a negative lot, and reverses the cash in the shift - full round trip returns every counter to its origin."
        test_recipe:
          setup: ["Site, register float 20000, OPEN shift; stock SNACK-A (999, on_hand 50); member 0 pts; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site E3", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "SNACK-A", name: "Snack A", category: "RETAIL", unit: "ea", unit_price_cents: 999, reorder_point: 5, initial_on_hand_quantity: 50 }, as: GeneralManager, captures: { item_a: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/store-sales", payload: { shift_id: "${shift_id}", tender_type: "CASH", loyalty_member_id: "${m_id}", lines: [ { stock_item_id: "${item_a}", quantity: 3 } ] }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id", earned: "$.data.points_earned" } }
            - { call: "GET /stock-items/${item_a}", payload: {}, as: GeneralManager, captures: { on_hand_mid: "$.data.on_hand_quantity" } }
            - { call: "POST /store-sales/${sale_id}/refund", payload: { reason: "wrong item" }, as: ShiftManager, as_user_id: "sm-2", captures: { st: "$.data.status", ps: "$.data.payment_status" } }
            - { call: "GET /stock-items/${item_a}", payload: {}, as: GeneralManager, captures: { on_hand_end: "$.data.on_hand_quantity" } }
            - { call: "GET /loyalty-members/${m_id}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { bal: "$.data.points_balance" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected: "$.data.expected_cash_cents" } }
          assert:
            - "sale earns 30 points (round_half_up(29.97)) and stock drops to 47"
            - "refund: status REFUNDED, payment_status REFUNDED, stock restored to 50"
            - "member points_balance back to 0 (newest-first clawback)"
            - "shift expected_cash_cents back to 20000"

      - name: endpoint_service_pay_cash_shift_attribution
        claim_type: action_endpoint
        grounds:
          - "endpoints.POST /service-tickets/{id}/pay"
          - "calculations.shift_expected_cash"
        distinguishing_aspect: "Paying a shower ticket in CASH posts exactly total_price_cents (1500 on a Wednesday off-peak) into the payload shift's expected cash."
        test_recipe:
          setup: ["Site, register float 20000, OPEN shift; one QUEUED shower ticket; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site E4", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /service-tickets/${t_id}/pay", payload: { tender_type: "CASH", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { ps: "$.data.payment_status", price: "$.data.total_price_cents" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected: "$.data.expected_cash_cents" } }
          assert:
            - "total_price_cents == 1500 (base only: Wednesday 10:00 UTC is neither weekend nor peak)"
            - "payment_status == PAID from CALLED state"
            - "shift expected_cash_cents == 21500"

  # =====================================================================
  # Section: errors
  # =====================================================================
  - section: errors
    instances:
      - name: error_shift_not_open_after_close
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_SHIFT_NOT_OPEN]"
        distinguishing_aspect: "A drop posted to an already-CLOSED shift is rejected ERR_SHIFT_NOT_OPEN; no CashDrop row is created."
        test_recipe:
          setup: ["Site, register float 20000, shift opened by sm-1 then closed by sm-2 (counted 20000, variance 0)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /shifts/${shift_id}/close", payload: { counted_cash_cents: 20000 }, as: ShiftManager, as_user_id: "sm-2" }
          trigger:
            - { call: "POST /shifts/${shift_id}/drops", payload: { amount_cents: 1000, denominations: { "1000": 1 } }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /shifts/${shift_id}/cash-drops", payload: {}, as: ShiftManager, as_user_id: "sm-2" }
          assert:
            - "err == ERR_SHIFT_NOT_OPEN"
            - "cash-drops list remains empty"

      - name: error_register_not_available_second_shift
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_REGISTER_NOT_AVAILABLE]"
        distinguishing_aspect: "Opening a second shift on a register that already has an OPEN shift fails ERR_REGISTER_NOT_AVAILABLE; the first shift is untouched."
        test_recipe:
          setup: ["Site, register, one OPEN shift"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R2", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-2", shift_label: "NIGHT" }, as: ShiftManager, as_user_id: "sm-2", captures: { err: "$.data.error_id" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-1", captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_REGISTER_NOT_AVAILABLE"
            - "first shift still OPEN"

      - name: error_contract_not_active_pending
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_CONTRACT_NOT_ACTIVE]"
        distinguishing_aspect: "Quoting a PENDING contract (never activated) fails ERR_CONTRACT_NOT_ACTIVE even though the fleet is ACTIVE and the window covers now."
        test_recipe:
          setup: ["Site with diesel tank, pump, register, OPEN shift; fleet with PENDING contract C-1; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R3", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c_id}", max_gallons: 50.0 }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CONTRACT_NOT_ACTIVE"

      - name: error_bay_occupied_on_checkin
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_BAY_OCCUPIED]"
        distinguishing_aspect: "Check-in of a second (non-overlapping, properly scheduled) work order while the bay is OCCUPIED fails ERR_BAY_OCCUPIED."
        test_recipe:
          setup: ["Site with bay 1, technician; WO1 scheduled [08:00,10:00) and checked in; WO2 scheduled [10:00,12:00) on the same bay; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R4", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/technicians", payload: { name: "Tech One", hourly_rate_cents: 12500 }, as: GeneralManager, captures: { tech_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/bays", payload: { bay_number: 1 }, as: GeneralManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-1", complaint: "wo1" }, as: Cashier, as_user_id: "cash-1", captures: { wo1: "$.data.id" } }
            - { call: "POST /work-orders/${wo1}/estimate", payload: { labor_hours_est: 2.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo1}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /work-orders/${wo1}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T08:00:00Z", scheduled_to: "2026-08-13T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /work-orders/${wo1}/check-in", payload: {}, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-2", complaint: "wo2" }, as: Cashier, as_user_id: "cash-1", captures: { wo2: "$.data.id" } }
            - { call: "POST /work-orders/${wo2}/estimate", payload: { labor_hours_est: 2.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo2}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /work-orders/${wo2}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T10:00:00Z", scheduled_to: "2026-08-13T12:00:00Z" }, as: GeneralManager }
          trigger:
            - { call: "POST /work-orders/${wo2}/check-in", payload: {}, as: MaintenanceTech, as_user_id: "${tech_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_BAY_OCCUPIED (bay held by WO1 despite WO2's clean schedule window)"

      - name: error_network_not_active_on_activate
        claim_type: violation_to_error
        grounds:
          - "validations[priority=24]"
          - "errors[ERR_NETWORK_NOT_ACTIVE]"
        distinguishing_aspect: "Activating an enrollment while the network is still DRAFT fails ERR_NETWORK_NOT_ACTIVE; the enrollment remains PENDING."
        test_recipe:
          setup: ["DRAFT network; member with PENDING enrollment"]
          setup_api_calls:
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 5 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { en_id: "$.data.id" } }
          trigger:
            - { call: "POST /discount-enrollments/${en_id}/activate", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NETWORK_NOT_ACTIVE; enrollment stays PENDING"

      - name: error_duplicate_network_enrollment
        claim_type: violation_to_error
        grounds:
          - "validations[priority=25]"
          - "errors[ERR_DUPLICATE_NETWORK_ENROLLMENT]"
        distinguishing_aspect: "A second enrollment for the same member+network while the first is PENDING fails ERR_DUPLICATE_NETWORK_ENROLLMENT."
        test_recipe:
          setup: ["ACTIVE network; member with one PENDING enrollment in it"]
          setup_api_calls:
            - { call: "POST /discount-networks", payload: { name: "FleetPass", discount_per_gallon: 0.10, applicable_fuel_types: ["DIESEL"], program_cap: 5 }, as: GeneralManager, captures: { net_id: "$.data.id" } }
            - { call: "POST /discount-networks/${net_id}/activate", payload: {}, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /loyalty-members/${m_id}/discount-enrollments", payload: { network_program_id: "${net_id}" }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DUPLICATE_NETWORK_ENROLLMENT"

      - name: error_insufficient_stock_store_sale
        claim_type: violation_to_error
        grounds:
          - "validations[priority=32]"
          - "errors[ERR_INSUFFICIENT_STOCK]"
        distinguishing_aspect: "Store sale of quantity 3 against on_hand 2 fails ERR_INSUFFICIENT_STOCK; stock and shift cash unchanged."
        test_recipe:
          setup: ["Site, register, OPEN shift; stock SNACK-A on_hand 2; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R5", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "SNACK-A", name: "Snack A", category: "RETAIL", unit: "ea", unit_price_cents: 999, reorder_point: 1, initial_on_hand_quantity: 2 }, as: GeneralManager, captures: { item_a: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/store-sales", payload: { shift_id: "${shift_id}", tender_type: "CASH", lines: [ { stock_item_id: "${item_a}", quantity: 3 } ] }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /stock-items/${item_a}", payload: {}, as: GeneralManager, captures: { on_hand: "$.data.on_hand_quantity" } }
            - { call: "GET /shifts/${shift_id}", payload: {}, as: ShiftManager, as_user_id: "sm-2", captures: { expected: "$.data.expected_cash_cents" } }
          assert:
            - "err == ERR_INSUFFICIENT_STOCK"
            - "on_hand stays 2; shift expected stays 20000"

      - name: error_queue_empty_call
        claim_type: violation_to_error
        grounds:
          - "validations[priority=29]"
          - "errors[ERR_QUEUE_EMPTY]"
        distinguishing_aspect: "Calling the SHOWER queue with no QUEUED ticket fails ERR_QUEUE_EMPTY (selector empty-pool fallback)."
        test_recipe:
          setup: ["Site, register, OPEN shift; no tickets"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R6", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1" }
          trigger:
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_QUEUE_EMPTY"

      - name: error_no_active_price_for_fuel_type
        claim_type: violation_to_error
        grounds:
          - "validations[priority=23]"
          - "errors[ERR_NO_ACTIVE_PRICE]"
        distinguishing_aspect: "Retail authorize for DEF with no ACTIVE DEF price posted fails ERR_NO_ACTIVE_PRICE even though the pump serves DEF."
        test_recipe:
          setup: ["Site with diesel price only, pump serving DIESEL+DEF, register, OPEN shift; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R7", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL", "DEF"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DEF", tender_type: "CASH", max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NO_ACTIVE_PRICE"

      - name: error_no_points_after_expiry
        claim_type: violation_to_error
        grounds:
          - "validations[priority=33]"
          - "errors[ERR_NO_POINTS]"
          - "calculations.loyalty_points_accrual"
        distinguishing_aspect: "Points lots expire 360 days after earned_at: a 500-point lot granted 2025-08-10 is fully expired on 2026-08-12, so redeeming 100 fails ERR_NO_POINTS; a fresh 300-point lot then allows exactly 300 (quote 235) while 350 still fails."
        test_recipe:
          setup: ["Site with diesel price 385, pump, register, OPEN shift; member with a 500-point adjustment lot granted at 2025-08-10T00:00:00Z; clock advanced to 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R8", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-08-10T00:00:00Z" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 500, reason: "old promo" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2025-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
          trigger:
            - { call: "GET /loyalty-members/${m_id}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { bal0: "$.data.points_balance" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 100, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { err1: "$.data.error_id" } }
            - { call: "POST /loyalty-members/${m_id}/adjustments", payload: { points_delta: 300, reason: "fresh promo" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 350, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { err2: "$.data.error_id" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", loyalty_member_id: "${m_id}", requested_redeem_points: 300, max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { quote: "$.data.authorized_quote_cents_per_gallon" } }
          assert:
            - "points_balance == 0 at 2026-08-12 (500-point lot expired 2026-08-05)"
            - "err1 == ERR_NO_POINTS and err2 == ERR_NO_POINTS (350 > 300 fresh points)"
            - "redeeming exactly 300 succeeds: quote == 235 (385 - 150)"

      - name: error_queue_capacity_then_preemption_after_15_min
        claim_type: violation_to_error
        grounds:
          - "validations[priority=28]"
          - "errors[ERR_QUEUE_CAPACITY]"
          - "state_machines.ServiceQueueTicket.ACTIVE_to_NO_SHOW"
        distinguishing_aspect: "Start while the single shower is occupied fails ERR_QUEUE_CAPACITY when the occupant's elapsed time is under 15 minutes; after the clock passes 16 minutes the same start preempts the occupant (ACTIVE -> NO_SHOW) and succeeds."
        test_recipe:
          setup: ["Site (1 shower), register, OPEN shift; t1 ACTIVE (started 10:00), t2 CALLED; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R9", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t1: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t2: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /service-tickets/${t1}/start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /service-tickets/${t2}/start", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:16:00Z" }, as: GeneralManager }
            - { call: "POST /service-tickets/${t2}/start", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { t2_status: "$.data.status" } }
            - { call: "GET /service-tickets/${t1}", payload: {}, as: GeneralManager, captures: { t1_status: "$.data.status" } }
          assert:
            - "first start -> ERR_QUEUE_CAPACITY (t1 elapsed 0 < 15, not preemptable)"
            - "after clock +16 min: start succeeds, t2 ACTIVE, t1 preempted to NO_SHOW"

      - name: error_segregation_close_by_opener
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "The ShiftManager who opened a shift cannot close it: same X-User-ID (sm-1) -> ERR_SEGREGATION_OF_DUTIES; a different manager (sm-2) closes successfully."
        test_recipe:
          setup: ["Site, register float 20000, shift OPEN (expected 20000) opened by sm-1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R10", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/close", payload: { counted_cash_cents: 20000 }, as: ShiftManager, as_user_id: "sm-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /shifts/${shift_id}/close", payload: { counted_cash_cents: 20000 }, as: ShiftManager, as_user_id: "sm-2", captures: { st: "$.data.status" } }
          assert:
            - "close by opener sm-1 -> ERR_SEGREGATION_OF_DUTIES"
            - "close by sm-2 -> CLOSED"

      - name: error_segregation_payout_by_cashier
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "A ShiftManager whose user id equals the shift's cashier_user_id cannot approve a payout on that shift -> ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Site, register, shift OPEN with cashier_user_id cash-1 (expected 20000)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site R11", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /shifts/${shift_id}/payouts", payload: { amount_cents: 5000, reason: "manager covering till" }, as: ShiftManager, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (approver id equals cashier id)"

      - name: error_pump_not_available_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PUMP_NOT_AVAILABLE]"
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / pump_state_beats_points_fiscal"
          rationale: "Asserted as the winning error of the dual-failure instance."

      - name: error_plate_not_registered_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PLATE_NOT_REGISTERED]"
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / plate_referential_beats_capacity_constraint"
          rationale: "Asserted as the winning error of the dual-failure instance."

      - name: error_remaining_below_float_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REMAINING_BELOW_FLOAT]"
        excluded_because:
          difficulty_instance: "transitive_cascade / payout_expected_posture_close_block"
          rationale: "Asserted as the terminal hop of the payout cascade."

  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: rbac_cashier_cannot_post_fuel_price
        claim_type: role_exclusive_denial
        grounds:
          - "roles.FuelDeskLead"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Fuel-price posting is exclusive to FuelDeskLead: Cashier gets ERR_FORBIDDEN; FuelDeskLead succeeds and the site mirror updates."
        test_recipe:
          setup: ["Site exists; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site RB1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
          trigger:
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead, captures: { price_id: "$.data.id" } }
            - { call: "GET /sites/${site_id}", payload: {}, as: FuelDeskLead, captures: { mirror: "$.data.diesel_retail_cents_per_gallon" } }
          assert:
            - "Cashier -> ERR_FORBIDDEN"
            - "FuelDeskLead -> 201 and site diesel mirror == 385"

      - name: rbac_technician_cannot_start_others_work_order
        claim_type: role_exclusive_denial
        grounds:
          - "roles.MaintenanceTech"
          - "state_machines.WorkOrder.IN_SHOP_to_IN_PROGRESS"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "start-work is restricted to the ASSIGNED technician: tech2 (a valid MaintenanceTech of the same site) gets ERR_FORBIDDEN on tech1's work order; tech1 succeeds."
        test_recipe:
          setup: ["Site with two technicians and bay 1; WO assigned to tech1, checked in"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site RB2", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/technicians", payload: { name: "Tech One", hourly_rate_cents: 12500 }, as: GeneralManager, captures: { tech1: "$.data.id" } }
            - { call: "POST /sites/${site_id}/technicians", payload: { name: "Tech Two", hourly_rate_cents: 12500 }, as: GeneralManager, captures: { tech2: "$.data.id" } }
            - { call: "POST /sites/${site_id}/bays", payload: { bay_number: 1 }, as: GeneralManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-1", complaint: "noise" }, as: Cashier, as_user_id: "cash-1", captures: { wo_id: "$.data.id" } }
            - { call: "POST /work-orders/${wo_id}/estimate", payload: { labor_hours_est: 1.0 }, as: MaintenanceTech, as_user_id: "${tech1}" }
            - { call: "POST /work-orders/${wo_id}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /work-orders/${wo_id}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech1}", scheduled_from: "2026-08-13T08:00:00Z", scheduled_to: "2026-08-13T09:00:00Z" }, as: GeneralManager }
            - { call: "POST /work-orders/${wo_id}/check-in", payload: {}, as: MaintenanceTech, as_user_id: "${tech1}" }
          trigger:
            - { call: "POST /work-orders/${wo_id}/start-work", payload: {}, as: MaintenanceTech, as_user_id: "${tech2}", captures: { err: "$.data.error_id" } }
            - { call: "POST /work-orders/${wo_id}/start-work", payload: {}, as: MaintenanceTech, as_user_id: "${tech1}", captures: { st: "$.data.status" } }
          assert:
            - "tech2 -> ERR_FORBIDDEN (identity scope: assigned technician only)"
            - "tech1 -> IN_PROGRESS"

      - name: rbac_fleet_manager_scope_limited
        claim_type: role_scope
        grounds:
          - "roles.FleetManager"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "FleetManager identity equals a FleetAccount id: reading ANOTHER fleet is ERR_FORBIDDEN; reading its own fleet and approving its own fleet's work-order estimate succeed."
        test_recipe:
          setup: ["Fleets A and B; site with tech and bay; fleet-billed WO for fleet A advanced to ESTIMATED; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 5000000, pricing_tier: "T1" }, as: GeneralManager, captures: { fa: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet B", credit_limit_cents: 5000000, pricing_tier: "T1" }, as: GeneralManager, captures: { fb: "$.data.id" } }
            - { call: "POST /sites", payload: { name: "Site RB3", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/technicians", payload: { name: "Tech One", hourly_rate_cents: 12500 }, as: GeneralManager, captures: { tech_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-1", complaint: "fleet work", fleet_account_id: "${fa}" }, as: Cashier, as_user_id: "cash-1", captures: { wo_id: "$.data.id" } }
            - { call: "POST /work-orders/${wo_id}/estimate", payload: { labor_hours_est: 1.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
          trigger:
            - { call: "GET /fleet-accounts/${fb}", payload: {}, as: FleetManager, as_user_id: "${fa}", captures: { err: "$.data.error_id" } }
            - { call: "GET /fleet-accounts/${fa}", payload: {}, as: FleetManager, as_user_id: "${fa}", captures: { own_name: "$.data.name" } }
            - { call: "POST /work-orders/${wo_id}/approve-estimate", payload: {}, as: FleetManager, as_user_id: "${fa}", captures: { wo_status: "$.data.status" } }
          assert:
            - "GET fleet B as fleet A manager -> ERR_FORBIDDEN"
            - "GET own fleet -> 200 (name == Fleet A)"
            - "approve-estimate on own fleet's WO -> APPROVED"

      - name: rbac_loyalty_member_self_scope
        claim_type: role_scope
        grounds:
          - "roles.LoyaltyMember"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "LoyaltyMember identity equals a LoyaltyMember id: member A reading member B's record is ERR_FORBIDDEN; member A can cancel her own CONFIRMED reservation."
        test_recipe:
          setup: ["Members A (plate AAA111) and B; site parking_paid_capacity 2; reservation for A 22:00-06:00 CONFIRMED; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site RB4", parking_total_spaces: 10, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { ma: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver B", email: "b@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { mb: "$.data.id" } }
            - { call: "POST /loyalty-members/${ma}/vehicles", payload: { plate: "AAA111", vehicle_type: "TRACTOR" }, as: LoyaltyMember, as_user_id: "${ma}" }
            - { call: "POST /sites/${site_id}/parking-reservations", payload: { loyalty_member_id: "${ma}", vehicle_plate: "AAA111", space_type: "STANDARD", reserved_from: "2026-08-12T22:00:00Z", reserved_to: "2026-08-13T06:00:00Z" }, as: LoyaltyMember, as_user_id: "${ma}", captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "GET /loyalty-members/${mb}", payload: {}, as: LoyaltyMember, as_user_id: "${ma}", captures: { err: "$.data.error_id" } }
            - { call: "POST /parking-reservations/${r_id}/cancel", payload: {}, as: LoyaltyMember, as_user_id: "${ma}", captures: { st: "$.data.status" } }
          assert:
            - "member A reading member B -> ERR_FORBIDDEN"
            - "member A cancelling own reservation -> CANCELLED"

      - name: rbac_member_cannot_adjust_points
        claim_type: role_exclusive_denial
        grounds:
          - "roles.GeneralManager"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Points adjustments are exclusive to GeneralManager: a LoyaltyMember adjusting even their own balance gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Member A exists"]
          setup_api_calls:
