        grounds:
          - roles.LeagueAdministrator.identity
          - errors.ERR_OWNERSHIP_MISMATCH
          - validations.priority_3_ownership_mismatch
        distinguishing_aspect: "The LeagueAdministrator role is entity-backed by League, so the same endpoint and the same role must succeed for one X-User-ID and fail with 403 for another. Ownership is checked ahead of the 404 for a resource the caller may not see, and ahead of any body validation, which pins ERR_OWNERSHIP_MISMATCH rather than ERR_LEAGUE_POLICY_NOT_FOUND."
        test_recipe:
          setup:
