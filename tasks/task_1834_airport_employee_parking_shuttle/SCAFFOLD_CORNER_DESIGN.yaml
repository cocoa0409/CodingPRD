          - "entities.Permit.fields.employee_id"
        distinguishing_aspect: "One non-terminal permit per employee: a second application while OFFERED returns ERR_DUPLICATE_ACTIVE_PERMIT; after the first is CANCELLED a fresh application succeeds."
        test_recipe:
