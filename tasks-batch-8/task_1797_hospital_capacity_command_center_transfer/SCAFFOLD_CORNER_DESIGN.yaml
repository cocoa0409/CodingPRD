  # 4. Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role fail at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Auth Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /cc/facilities/${fac}"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: wrong_role_denied_on_exclusive_operation
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "AcceptingPhysician invoking POST /cc/facilities (SystemAdministrator-exclusive) is denied 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cc/facilities"
              payload: { name: "Nope", region: "R1" }
              as: AcceptingPhysician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: auth_beats_role_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=2]"]
        distinguishing_aspect: "A request missing headers AND carrying a role that would be denied returns the priority-1 auth error, not the priority-2 permission error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cc/facilities"
              payload: { name: "Nope", region: "R1" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (priority 1 wins over priority 2)"

      - name: state_vs_safety_priority_pair
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: state_beats_isolation_on_hold_create
          rationale: "Dual-failure ordering asserted in the named §1.8 instance."

      - name: safety_vs_quota_priority_pair
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=15]"]
        excluded_because:
          difficulty_instance: isolation_beats_hold_quota_on_hold_create
          rationale: "Dual-failure ordering asserted in the named §1.8 instance."

      - name: consult_ownership_wrong_physician_denied
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]", entities.TransferRequest.fields.accepting_physician_id]
        distinguishing_aspect: "Entity-backed ownership: a physician whose id is not the request's accepting_physician_id cannot respond to the consult (403), even though the role is correct."
        test_recipe:
          setup: ["Clock at 00:00; facility; physicians DrA (consulted) and DrB (both ON_CALL CARDIAC); request CONSULT_PENDING to DrA"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Own Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr A", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { drA: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr B", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { drB: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "POWN", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${drA}" }
              as: TransferCenterCoordinator
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${drB}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "TransferRequest.${tr}.status remains CONSULT_PENDING"

      - name: consult_physician_not_credentialed
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PHYSICIAN_NOT_CREDENTIALED_FOR_SERVICE]"]
        distinguishing_aspect: "Cross-entity validation: consult dispatch to a physician whose services lack the request's service fails 422 ERR_PHYSICIAN_NOT_CREDENTIALED_FOR_SERVICE."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician ON_CALL credentialed NEURO only; CARDIAC request in INTAKE"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Cred Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr N", services: ["NEURO"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PCRD", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_PHYSICIAN_NOT_CREDENTIALED_FOR_SERVICE"

      - name: consult_physician_off_call_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=11]", "errors[ERR_PHYSICIAN_NOT_ON_CALL]"]
        distinguishing_aspect: "Conditional on Physician.status: the same consult succeeds ON_CALL and fails ERR_PHYSICIAN_NOT_ON_CALL after the physician goes OFF_CALL."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician initially ON_CALL CARDIAC; two INTAKE CARDIAC requests"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Call Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr OC", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "POC1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "POC2", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr2: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr1}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/physicians/${dr}/status"
              payload: { to_status: "OFF_CALL" }
              as: HouseSupervisor
            - call: "POST /cc/transfer-requests/${tr2}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "first consult succeeds (TransferRequest.${tr1}.status == CONSULT_PENDING)"
            - "after OFF_CALL: second consult fails 409 ERR_PHYSICIAN_NOT_ON_CALL"

      - name: consult_response_after_deadline_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=13]", "errors[ERR_CONSULT_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Temporal: a consult-response at now == consult_deadline (>= rule) is rejected ERR_CONSULT_WINDOW_EXPIRED even though the request is still CONSULT_PENDING until the sweep runs."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician ON_CALL CARDIAC; request consulted at 00:00 (deadline 00:30); clock advanced to exactly 00:30"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Temp Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Tmp", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PTMP", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_CONSULT_WINDOW_EXPIRED"

      - name: sod_diversion_lift_same_actor_denied
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_SOD_DIVERSION_DECLARE_LIFT_SAME_ACTOR]"]
        distinguishing_aspect: "Segregation of duties: the HouseSupervisor who declared the diversion cannot lift it even after the 30-minute minimum has elapsed; a different supervisor can."
        test_recipe:
          setup: ["Clock at 00:00; facility; diversion declared by hs_1 at 00:00 over [00:00, 04:00); clock advanced to 00:45"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "SOD Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/diversions"
              payload: { level: "FULL", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T04:00:00Z" }
              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { dv: $.data.id }
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:45:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /cc/diversions/${dv}/lift"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { err: $.data.error_id }
            - call: "POST /cc/diversions/${dv}/lift"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_2"
          assert:
            - "same actor: HTTP 403 error_id == ERR_SOD_DIVERSION_DECLARE_LIFT_SAME_ACTOR"
            - "different actor: 200 and DiversionEvent.${dv}.status == LIFTED with lifted_by_user_id == hs_2"

      - name: diversion_lift_too_soon_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=13]", "errors[ERR_DIVERSION_LIFT_TOO_SOON]"]
        distinguishing_aspect: "Minimum-duration rule: a different actor lifting at minute 20 (before created_at + 30) fails ERR_DIVERSION_LIFT_TOO_SOON; at exactly minute 30 the lift succeeds."
        test_recipe:
          setup: ["Clock at 00:00; facility; diversion declared by hs_1 at 00:00 over [00:00, 04:00)"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Lift Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/diversions"
              payload: { level: "FULL", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T04:00:00Z" }
              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { dv: $.data.id }
          trigger:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/diversions/${dv}/lift"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_2"
              captures: { err: $.data.error_id }
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/diversions/${dv}/lift"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_2"
          assert:
            - "at 00:20: HTTP 409 error_id == ERR_DIVERSION_LIFT_TOO_SOON"
            - "at exactly 00:30 (created_at + 30, >= boundary): lift succeeds, status LIFTED"

      - name: sod_assignment_complete_same_actor_denied
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_SOD_ASSIGNMENT_CREATE_COMPLETE_SAME_ACTOR]"]
        distinguishing_aspect: "Segregation of duties on placement: completing an assignment with the same X-User-ID that created it is denied 403; a different BedManager user completes it."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; bed; request walked to ASSIGNED by coordinator coord_1 (assignment.created_by_user_id == coord_1)"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "SOD2 Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr S2", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PS2A", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
            - call: "GET /cc/transfer-requests/${tr}"
              as: Any
              captures: { tr_v: $.data.version }
            - call: "POST /cc/transfer-requests/${tr}/bed-assignments"
              payload: { bed_hold_id: "${hold}", expected_transfer_request_version: "${tr_v}" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /cc/bed-assignments/${asg}/complete"
              payload: {}
              as: BedManager
              as_user_id: "coord_1"
              captures: { err: $.data.error_id }
            - call: "POST /cc/bed-assignments/${asg}/complete"
              payload: {}
              as: BedManager
              as_user_id: "bm_1"
          assert:
            - "same user id as creator: HTTP 403 error_id == ERR_SOD_ASSIGNMENT_CREATE_COMPLETE_SAME_ACTOR"
            - "different user id: 200, BedAssignment.${asg}.status == COMPLETED, TransferRequest.${tr}.status == COMPLETED, Bed.${b1}.status == OCCUPIED"

      - name: boarding_record_duplicate_open_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_BOARDING_RECORD_ALREADY_OPEN]"]
        distinguishing_aspect: "Aggregate uniqueness: one open (WAITING/OFFERED) boarding record per admission; a second create on the same admission fails ERR_BOARDING_RECORD_ALREADY_OPEN."
        test_recipe:
          setup: ["Clock at 00:00; facility; ED admission with an open boarding record"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Dup Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "ED-1", label: "E1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { eb: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${eb}", patient_ref: "PDUP", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
          trigger:
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_BOARDING_RECORD_ALREADY_OPEN"

      - name: boarding_record_requires_ed_admission
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_ADMISSION_NOT_ED_BOARDER]"]
        distinguishing_aspect: "Cross-entity state check: boarding records only for ED-unit admissions; a med-surg admission yields ERR_ADMISSION_NOT_ED_BOARDER."
        test_recipe:
          setup: ["Clock at 00:00; facility; non-ED bed occupied by admission"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "ED Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "M1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { mb: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${mb}", patient_ref: "PNED", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
          trigger:
            - call: "POST /cc/facilities/${fac}/boarding-records"
              payload: { admission_id: "${adm}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_ADMISSION_NOT_ED_BOARDER"

      - name: admission_create_on_occupied_bed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_BED_NOT_AVAILABLE]"]
        distinguishing_aspect: "Aggregate/resource state: admitting into an already OCCUPIED bed fails ERR_BED_NOT_AVAILABLE (placement conflict resolution at admission time)."
        test_recipe:
          setup: ["Clock at 00:00; facility; bed occupied by first admission"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Occ Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "M1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { mb: $.data.id }
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${mb}", patient_ref: "POCC1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
          trigger:
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${mb}", patient_ref: "POCC2", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_BED_NOT_AVAILABLE"

      - name: rebalance_margin_below_threshold_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", calculations.rebalance_margin_check, "errors[ERR_REBALANCE_MARGIN_NOT_MET]"]
        distinguishing_aspect: "Rebalance requires weighted margin >= 10.0; a facility pair with margin 0 (105.0 vs 105.0) is rejected ERR_REBALANCE_MARGIN_NOT_MET."
        test_recipe:
          setup:
            - "Clock at 00:00; source facility FS: 5 beds — 3 OCCUPIED, 1 HELD by TR-S in HOLD_PLACED, 1 ED bed OCCUPIED with boarding record; inbound = TR-S + TR-X (INTAKE) -> pressure 3 + 0.5 + 0.75 + 1.0 = 5.25 -> weighted 105.0"
            - "target facility FT: 5 beds — 3 OCCUPIED, 1 HELD by its own HOLD_PLACED request, 1 ED bed OCCUPIED with boarding record; inbound = its HOLD_PLACED request + TR-Y (INTAKE) -> weighted 105.0; margin 0.0 < 10.0"
            - "TR-X in INTAKE on FS awaiting rebalance"
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
