      - name: settlement_tier_pinned_before_admin_fee
        mode: "(c) a circular-looking dependency resolved by a pinned evaluation order"
        grounds:
          - calculations.pool_settlement_waterfall
          - calculations.pool_distribution_allocation
          - entities.RiskPool.fields.surplus_tier
          - entities.RiskPool.fields.admin_fee_cents
          - entities.RiskPool.fields.shared_savings_pool_cents
          - state_machines.RiskPool.RESERVED_to_SETTLEMENT_PROPOSED
        distinguishing_aspect: |
          Mode (c): surplus_tier selects admin_fee_bps, the admin fee reduces
          the distributable surplus, and the distributable surplus looks like it
          should re-derive the surplus ratio — a closed loop. The scaffold pins
          S5 (tier on the PRE-fee ratio) before S6/S7, so the answer is
          TIER_3 / 1674, while one extra turn of the loop gives TIER_2 / 1395.
          This is neither a clamp test (mode a) nor a rounding-boundary test
