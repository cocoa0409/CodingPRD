            - "ColdStorageUnit.${unit_id}.status == AVAILABLE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cold_chain_mismatch_beats_capacity_on_intake
        grounds:
          - validations[priority=7]
          - validations[priority=11]
        distinguishing_aspect: |
          On POST /inventory-lots a lot can simultaneously violate cold-chain (business_safety,
          priority 7) and capacity (business_constraint, priority 11); the safety check wins
          (ERR_COLD_CHAIN_MISMATCH), pairing business_safety vs business_constraint.
        test_recipe:
          setup:
            - "A DRY unit with capacity 100 already holding 100 lbs (FULL). A PRODUCE (REFRIGERATED) lot of 50 lbs is intaken into it."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "DryFull", temp_zone: "DRY", capacity_lbs: 100 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "DRY_GOODS", source_type: "DONATION", intake_lbs: 100, expiration_date: "2026-12-01T00:00:00.000Z" }
              as: FoodBankOperator
          trigger:
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 50, expiration_date: "2026-12-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COLD_CHAIN_MISMATCH (safety priority 7 beats capacity priority 11)"
            - "HTTP status == 422"

      - name: cycle_not_open_beats_fair_share_on_approve
        grounds:
          - validations[priority=10]
          - validations[priority=13]
        distinguishing_aspect: |
          On POST /agency-orders/{id}/approve a stale-cycle order can violate both cycle-open
          (business_temporal, priority 10) and fair-share (business_fiscal, priority 13); the
          temporal check wins (ERR_CYCLE_NOT_OPEN), pairing business_temporal vs business_fiscal
          — a different category pair than the safety-vs-constraint instance.
        test_recipe:
          setup:
            - "An order submitted to an OPEN cycle requesting 7501 lbs (over the 7500 cap); cycle then CLOSED before approval."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency A", service_area: "County-A", fair_share_weight: 3 }
              as: AllocationManager
              captures: { agency_a: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Agency B", service_area: "County-B", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_b: $.data.id }
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 20000 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 9000, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /allocation-cycles"
              payload: { label: "2026-W30", total_pool_lbs: 10000 }
              as: AllocationManager
              captures: { cycle_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/open"
              payload: {}
              as: AllocationManager
            - call: "POST /agency-orders"
              payload: { agency_id: "${agency_a}", allocation_cycle_id: "${cycle_id}", lines: [ { food_category: "PRODUCE", requested_lbs: 7501 } ] }
              as: AgencyCoordinator
              as_user_id: "${agency_a}"
              captures: { order_id: $.data.id }
            - call: "POST /allocation-cycles/${cycle_id}/close"
              payload: {}
              as: AllocationManager
          trigger:
            - call: "POST /agency-orders/${order_id}/approve"
              payload: { expected_lot_version: "${lot_v}" }
              as: AllocationManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CYCLE_NOT_OPEN (temporal priority 10 beats fiscal priority 13)"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cold_storage_capacity_exact_fill_allowed
        grounds:
          - validations[priority=11]
          - calculations.cold_storage_occupancy
          - entities.ColdStorageUnit.fields.status
        distinguishing_aspect: |
          Numeric threshold boundary on cold-storage capacity via POST /inventory-lots: stored
          reaching exactly capacity_lbs (500 == 500) is allowed and flips status to FULL; only
          a would-exceed intake is rejected. (>= vs > on a poundage metric.)
        test_recipe:
          setup:
            - "A REFRIGERATED unit capacity 500 holding 300 lbs; a 200-lb PRODUCE lot brings it to exactly 500."
          setup_api_calls:
            - call: "POST /cold-storage-units"
              payload: { name: "Cooler", temp_zone: "REFRIGERATED", capacity_lbs: 500 }
              as: FoodBankOperator
              captures: { unit_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "PRODUCE", source_type: "DONATION", intake_lbs: 300, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
          trigger:
            - call: "POST /inventory-lots"
              payload: { cold_storage_unit_id: "${unit_id}", food_category: "DAIRY", source_type: "DONATION", intake_lbs: 200, expiration_date: "2026-09-01T00:00:00.000Z" }
              as: FoodBankOperator
              captures: { lot2_id: $.data.id }
          assert:
            - "POST succeeds with 201 (300+200 == 500 capacity, exactly-at allowed)"
            - "ColdStorageUnit.${unit_id}.stored_lbs == 500.00 and status == FULL"

      - name: tefap_income_exactly_at_threshold_is_eligible
        grounds:
          - validations[priority=5]
          - calculations.tefap_income_eligibility
          - entities.ClientHousehold.fields.tefap_eligible
        distinguishing_aspect: |
          Income-threshold boundary on a different metric and endpoint (POST /client-households):
          household_size 3 with monthly_income_cents exactly 340800 == threshold is tefap_eligible
          (<= passes), distinct from the capacity-poundage boundary.
        test_recipe:
          setup:
            - "A household of size 3 with monthly_income_cents 340800 (exactly the size-3 threshold)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Pantry G", service_area: "County-7", fair_share_weight: 1 }
              as: AllocationManager
              captures: { agency_id: $.data.id }
          trigger:
            - call: "POST /client-households"
              payload: { agency_id: "${agency_id}", household_size: 3, monthly_income_cents: 340800 }
              as: AgencyCoordinator
              as_user_id: "${agency_id}"
              captures: { hh_id: $.data.id, elig: $.data.tefap_eligible }
          assert:
            - "ClientHousehold.tefap_eligible == true (340800 == threshold, <= passes)"
            - "ClientHousehold.certification_status == PENDING"

