      - name: sm_cyclic_inspection_reopen_bounded_at_two
        claim_type: cyclic
        grounds:
          - state_machines.Inspection.PENDING_REVIEW_to_IN_PROGRESS
          - entities.Inspection.fields.reopen_count
          - global_constants.INSPECTION_MAX_REOPENS
          - validations.priority_42_ERR_INVALID_INSPECTION_STATE
        distinguishing_aspect: "The PENDING_REVIEW to IN_PROGRESS revert edge is walked exactly twice — reopen_count 1 then 2 — and the third attempt is refused with ERR_INVALID_INSPECTION_STATE 409, proving the cycle terminates instead of looping forever; each reopen also nulls outcome, age_groups_observed and submitted_at."
        test_recipe:
          setup:
            - "One ANNUAL inspection with no violations, taken to PENDING_REVIEW with outcome PASS at clock 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
