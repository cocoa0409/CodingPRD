          - "entities.SupplierOrder.fields.backordered"
        distinguishing_aspect: "Full receipt auto-closes with backordered == false; a manual close one unit short sets backordered == true."
        test_recipe:
          setup: ["supplier; SO1 qty 1 acknowledged; SO2 qty 2 acknowledged"]
