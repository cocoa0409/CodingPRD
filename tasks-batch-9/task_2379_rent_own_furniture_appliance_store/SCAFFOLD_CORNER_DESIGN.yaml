            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
