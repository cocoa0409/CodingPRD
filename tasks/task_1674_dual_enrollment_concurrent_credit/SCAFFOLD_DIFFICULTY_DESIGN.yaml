            - "Enrollment.${e1}.status == DROPPED and Enrollment.${e2}.status == DROPPED (depth-1 hop, REGISTERED branch)"
            - "Invoice.${inv1}.status == VOIDED, refund_pct == 100, refund_estimate_cents == 120000, refund_status == DUE (depth-2 hop; 30000 had been paid)"
            - "Invoice.${inv2}.status == VOIDED, refund_pct == 100, refund_status == NONE (nothing was paid)"
