scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_delivery_year_required_fields_and_defaults
        claim_type: creation_defaults
        grounds: [entities.DeliveryYear, endpoints.POST_/capacity-market/delivery-years]
        distinguishing_aspect: "POST with all required fields returns 201, status defaults to DRAFT, reliability_requirement_mw defaults to 0, forecast_version defaults to 0, and version starts at 1."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
          trigger:
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "DeliveryYear.${dy_id}.status == DRAFT"
            - "DeliveryYear.${dy_id}.reliability_requirement_mw == 0"
            - "DeliveryYear.${dy_id}.forecast_version == 0"
            - "DeliveryYear.${dy_id}.version == 1"
      - name: create_delivery_year_missing_label_returns_invalid_request
        claim_type: required_field_violation
        grounds: [entities.DeliveryYear.fields.delivery_year_label, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required delivery_year_label yields ERR_INVALID_REQUEST (400) and creates nothing."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
          trigger:
            - call: "POST /capacity-market/delivery-years"
              payload: { planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "GET /capacity-market/delivery-years returns total_count == 0"
      - name: get_delivery_year_not_found_returns_404
        claim_type: not_found
        grounds: [entities.DeliveryYear, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404), not an empty object."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
          trigger:
            - call: "GET /capacity-market/delivery-years/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MarketAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"
      - name: resource_creation_enum_violation_returns_invalid_request
        claim_type: type_constraint
        grounds: [entities.CapacityResource.fields.resource_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "resource_type 'SOLAR_FARM' is outside enum {GEN, DR, EE} and must be rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["DY DRAFT with RTO zone; owner O1 ACTIVE"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { o1_id: "$.data.id" }
          trigger:
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o1_id}", zone_id: "${zone_id}", resource_type: "SOLAR_FARM", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
      - name: settlement_entry_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.SettlementEntry]
        distinguishing_aspect: "SettlementEntry has common_fields: false — it carries id and created_at only (no version/updated_at), and §1.5 declares no PUT/PATCH/DELETE route for it; the ledger is append-only. Verified by fetching a posted CHARGE entry and confirming the absence of mutable common fields."
        test_recipe:
          setup: ["DY CLEARED; commitment C1 10 MW @ 100.00; EV (H=4) finalized with A1 expected 10 actual 8 (CHARGE -33.33 posted)"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: $.data.id }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o1_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { acc1_id: $.data.id }
            - call: "POST /capacity-market/accreditations/${acc1_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs"
              payload: { delivery_year_id: "${dy_id}", run_label: "BRA" }
              as: MarketAdmin
              captures: { run_id: $.data.id }
            - call: "POST /capacity-market/auction-runs/${run_id}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r1_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { off1_id: $.data.id }
            - call: "POST /capacity-market/auction-runs/${run_id}/seal"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/offers/${off1_id}/mitigation-review"
              payload: {}
              as: MarketAdmin
              captures: { rev1_id: "$.data[0].id" }
            - call: "POST /capacity-market/mitigation-reviews/${rev1_id}/resolve"
              payload: { outcome: "PASS" }
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs/${run_id}/clear"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/commitments?resource_id=${r1_id}"
              payload: {}
              as: MarketAdmin
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /capacity-market/emergency-events"
              payload: { delivery_year_id: "${dy_id}", event_start: "2029-06-10T13:00:00Z", event_end: "2029-06-10T17:00:00Z", event_type: "EMERGENCY_ACTION" }
              as: MarketAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /capacity-market/emergency-events/${ev_id}/begin-assessment"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/emergency-events/${ev_id}/assessments"
              payload: {}
              as: MarketAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "POST /capacity-market/assessments/${a1_id}/record-actual"
              payload: { expected_mw: 10.0, actual_mw: 8.0 }
              as: MarketAdmin
            - call: "POST /capacity-market/emergency-events/${ev_id}/finalize-assessments"
              payload: {}
              as: MarketAdmin
          trigger:
            - call: "GET /capacity-market/settlement-entries?commitment_id=${c1_id}"
              payload: {}
              as: MarketAdmin
          assert:
            - "len(data) == 1 and data[0].entry_type == CHARGE and data[0].amount_dollars == -33.33"
            - "data[0] has no version field and no updated_at field (common_fields: false)"
      - name: zone_parent_fk_reverse_reachable_via_list
        claim_type: parent_relationship
        grounds: [entities.Zone.fields.parent_zone_id, entities.Zone.fields.delivery_year_id]
        distinguishing_aspect: "Nested LDA zone created with parent_zone_id is discoverable via GET /capacity-market/delivery-years/{id}/zones and carries the FK back to its parent zone."
        test_recipe:
          setup: ["DY DRAFT with RTO zone"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { rto_id: "$.data.id" }
          trigger:
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "LDA", import_limit_mw: 25.0, parent_zone_id: "${rto_id}" }
              as: MarketAdmin
              captures: { lda_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Zone.${lda_id}.parent_zone_id == ${rto_id}"
            - "Zone.${lda_id}.delivery_year_id == ${dy_id}"
            - "GET /capacity-market/delivery-years/${dy_id}/zones returns total_count == 2"
      - name: accreditation_computed_fields_ignore_client_input
        claim_type: computed_field
        grounds: [entities.Accreditation.fields.accreditation_factor, entities.Accreditation.fields.ucap_mw]
        distinguishing_aspect: "accreditation_factor and ucap_mw are source=computed: absent from the create payload schema, null/absent while PENDING_REVIEW, and populated by calc accreditation_ucap only on approve — 0.85 / 85.0 for class_avg factor 0.85 on nameplate 100."
        test_recipe:
          setup: ["DY DRAFT with RTO zone and DRAFT forecast; owner O1 with REGISTERED resource R1 nameplate 100.0"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o1_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { r1_id: "$.data.id" }
          trigger:
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { acc_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc_id}/approve"
              payload: {}
              as: MarketAdmin
          assert:
            - "Accreditation.${acc_id}.accreditation_factor == 0.85"
            - "Accreditation.${acc_id}.ucap_mw == 85.0"
  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: offer_withdraw_from_sealed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.AuctionOffer, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SEALED offer cannot be withdrawn: after the run seals, withdraw is rejected with ERR_INVALID_STATE (409) because the SUBMITTED->WITHDRAWN transition requires status SUBMITTED."
        test_recipe:
          setup: ["DY with run OPEN; owner O1; accredited R1; offer OFF1 SUBMITTED then run sealed"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o1_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { acc1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc1_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs"
              payload: { delivery_year_id: "${dy_id}", run_label: "BRA" }
              as: MarketAdmin
              captures: { run_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r1_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 70.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { off1_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/seal"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/auction-runs/${run_id}"
              payload: {}
              as: MarketAdmin
              captures: { run_v: "$.data.version" }
          trigger:
            - call: "POST /capacity-market/offers/${off1_id}/withdraw"
              payload: { expected_auction_run_version: "${run_v}" }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "AuctionOffer.${off1_id}.status == SEALED (unchanged)"
      - name: terminal_state_lockdown_closed_delivery_year
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeliveryYear, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: lock-forecast on a CLOSED delivery year is rejected with ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["DY walked DRAFT->FORECAST_LOCKED->AUCTION_OPEN->CLEARED->SETTLED->CLOSED (single-offer happy path, no emergency events)"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/owners"
              payload: { legal_name: "Alpha GenCo", contact_email: "alpha@x.com", credit_score: 900 }
              as: MarketAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /capacity-market/resources"
              payload: { owner_id: "${o1_id}", zone_id: "${zone_id}", resource_type: "GEN", nameplate_mw: 100.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations"
              payload: { resource_id: "${r1_id}", delivery_year_id: "${dy_id}", method: "CLASS_AVG", class_avg_factor: 0.85, forced_outage_rate: 0.10, scarcity_hours_sampled: 100 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { acc1_id: "$.data.id" }
            - call: "POST /capacity-market/accreditations/${acc1_id}/approve"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs"
              payload: { delivery_year_id: "${dy_id}", run_label: "BRA" }
              as: MarketAdmin
              captures: { run_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/open"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/offers"
              payload: { resource_id: "${r1_id}", auction_run_id: "${run_id}", offer_mw: 10.0, offer_price_per_mw_day: 70.0 }
              as: ResourceOwner
              as_user_id: "${o1_id}"
              captures: { off1_id: "$.data.id" }
            - call: "POST /capacity-market/auction-runs/${run_id}/seal"
              payload: {}
              as: MarketAdmin
            - call: "GET /capacity-market/offers/${off1_id}/mitigation-review"
              payload: {}
              as: MarketAdmin
              captures: { rev1_id: "$.data[0].id" }
            - call: "POST /capacity-market/mitigation-reviews/${rev1_id}/resolve"
              payload: { outcome: "PASS" }
              as: MarketAdmin
            - call: "POST /capacity-market/auction-runs/${run_id}/clear"
              payload: {}
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years/${dy_id}/settle"
              payload: {}
              as: SettlementOps
            - call: "POST /capacity-market/delivery-years/${dy_id}/close"
              payload: {}
              as: SettlementOps
          trigger:
            - call: "POST /capacity-market/delivery-years/${dy_id}/lock-forecast"
              payload: {}
              as: MarketAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "DeliveryYear.${dy_id}.status == CLOSED (unchanged)"
      - name: accreditation_approve_initial_state_pending_review
        claim_type: initial_state
        grounds: [state_machines.Accreditation]
        distinguishing_aspect: "A freshly created Accreditation starts in PENDING_REVIEW, and approve from any later-terminal state is impossible — REJECTED accreditation cannot be approved (ERR_INVALID_STATE)."
        test_recipe:
          setup: ["DY DRAFT with RTO zone + forecast; owner O1; REGISTERED resource R1; accreditation ACC rejected"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
            - call: "POST /capacity-market/delivery-years"
              payload: { delivery_year_label: "2029/2030", planning_period_start: "2029-06-01T00:00:00Z", planning_period_end: "2030-05-31T23:59:59Z" }
              as: MarketAdmin
              captures: { dy_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/zones"
              payload: { zone_code: "RTO" }
              as: MarketAdmin
              captures: { zone_id: "$.data.id" }
            - call: "POST /capacity-market/delivery-years/${dy_id}/forecasts"
              payload: { rto_peak_load_mw: 10.0, reserve_margin_pct: 0.25, pool_wide_avg_eford: 0.04, zonal_peak_shares: { RTO: 1.0 } }
