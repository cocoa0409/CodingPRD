# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All numeric asserts are literals computed against the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: interim_ffs_vs_cost_settled_reimbursement
        grounds:
          - calculations.claim_total_charge
          - calculations.cost_settlement_net
          - entities.Claim.fields.total_charge_cents
          - entities.CostSettlement.fields.federal_share_cents
        distinguishing_aspect: |
          The FFS interim charge is computed on the Claim entity (fee-schedule:
          9000c) while the cost-settled reimbursement is computed on the
          CostSettlement entity (cost-based: 100000c); the same pool yields
          different reimbursement totals across two different entity domains.
        test_recipe:
          setup:
            - "One student with granted BILLING consent; active provider credential; active authorization (unit_minutes=15, rate=3000)."
            - "One verified ServiceLog (40 min -> 3 units -> 9000c) attached to a DRAFT claim (total_charge_cents=9000)."
            - "A CLOSED RMTS quarter (2 of 4 coded moments eligible -> ratio 0.5); a cost settlement with certified 1000000, iep 4000bps, fmap 5000bps, interim 9000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-1", first_name: "Ann", last_name: "Lee", date_of_birth: "2015-04-01", district_student_id: "D-1" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-1", first_name: "Pat", last_name: "Roe", discipline: "SLP" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "L1", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/iep-authorizations/${auth}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:00:00Z", end_time: "2026-03-01T09:40:00Z", delivered_minutes: 40 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { log: $.data.id }
            - call: "POST /sbmb/service-logs/${log}/document"
              payload: { documentation_note: "SOAP note" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/service-logs/${log}/verify"
              payload: {}
              as: BillingCoordinator
              captures: { units: $.data.delivered_units, charge: $.data.charge_cents }
            - call: "POST /sbmb/claims"
              payload: { student_id: "${stu}", service_month: "2026-03" }
              as: BillingCoordinator
              captures: { claim: $.data.id }
            - call: "POST /sbmb/claims/${claim}/attach"
              payload: { service_log_id: "${log}" }
              as: BillingCoordinator
            - call: "POST /sbmb/rmts-quarters"
              payload: { fiscal_quarter: "2026-Q1" }
              as: MedicaidCoordinator
              captures: { q: $.data.id }
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-01T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m1: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m1}/respond"
              payload: { activity_response: "provided speech therapy" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m1}/code"
              payload: { activity_category: "DIRECT_MEDICAL" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-02T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m2: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m2}/respond"
              payload: { activity_response: "evaluation" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m2}/code"
              payload: { activity_category: "MEDICAL_ADMIN" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-03T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m3: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m3}/respond"
              payload: { activity_response: "lunch" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m3}/code"
              payload: { activity_category: "NON_MEDICAL" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-04T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m4: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m4}/respond"
              payload: { activity_response: "general admin" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m4}/code"
              payload: { activity_category: "GENERAL_ADMIN" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-quarters/${q}/close"
              payload: {}
              as: MedicaidCoordinator
              captures: { qver: $.data.version }
          trigger:
            - call: "POST /sbmb/cost-settlements"
              payload: { rmts_quarter_id: "${q}", certified_cost_cents: 1000000, iep_ratio_bps: 4000, fmap_bps: 5000, interim_paid_cents: 9000, expected_rmts_quarter_version: "${qver}" }
              as: MedicaidCoordinator
              captures: { settle: $.data.id, fed: $.data.federal_share_cents }
          assert:
            - "Claim.${claim}.total_charge_cents == 9000"
            - "RMTSQuarter.${q}.medicaid_eligibility_ratio == 0.5"
            - "CostSettlement.${settle}.federal_share_cents == 100000"
            - "CostSettlement.${settle}.net_settlement_cents == 91000"
            - "Claim.${claim}.total_charge_cents != CostSettlement.${settle}.federal_share_cents"

      - name: authorized_vs_delivered_billable_units
        grounds:
          - calculations.service_log_billable_units
          - entities.ServiceLog.fields.delivered_units
          - entities.IEPAuthorization.fields.authorized_minutes_per_session
        distinguishing_aspect: |
          On the ServiceLog domain, the authorized-provisional variant
          (30 authorized min / 15 = 2 units) diverges from the delivered-final
          variant (40 delivered min / 15 = 3 units) for the same log.
        test_recipe:
          setup:
            - "Active authorization with unit_minutes=15, authorized_minutes_per_session=30 (provisional 2 units)."
            - "One log delivered_minutes=40 verified -> delivered_units=3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-2", first_name: "Bo", last_name: "Kim", date_of_birth: "2014-01-01", district_student_id: "D-2" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-2", first_name: "Sam", last_name: "Fox", discipline: "SLP" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "L2", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/iep-authorizations/${auth}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:00:00Z", end_time: "2026-03-01T09:40:00Z", delivered_minutes: 40 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { log: $.data.id }
            - call: "POST /sbmb/service-logs/${log}/document"
              payload: { documentation_note: "note" }
              as: ServiceProvider
              as_user_id: "${prov}"
          trigger:
            - call: "POST /sbmb/service-logs/${log}/verify"
              payload: {}
              as: BillingCoordinator
              captures: { units: $.data.delivered_units, charge: $.data.charge_cents }
          assert:
            - "ServiceLog.${log}.delivered_units == 3"
            - "ServiceLog.${log}.charge_cents == 9000"
            - "IEPAuthorization.${auth}.authorized_minutes_per_session / IEPAuthorization.${auth}.unit_minutes rounds to 2 (provisional), which differs from delivered_units 3"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: claim_total_per_log_rounding_then_sum
        grounds:
          - calculations.claim_total_charge
          - entities.Claim.fields.total_charge_cents
          - state_machines.ServiceLog.VERIFIED_to_CLAIMED
        distinguishing_aspect: |
          Mode (b) nested rounding: two logs each 8 min (unit 15) round to 1
          unit EACH (round-then-sum => 2 units => 6000c). Summing minutes first
          (16/15 -> 1 unit => 3000c) is wrong; the scaffold pins round-then-sum.
        test_recipe:
          setup:
            - "Active provider/credential/authorization (unit_minutes=15, rate=3000); granted consent."
            - "Two verified logs, each delivered_minutes=8 (non-overlapping times), attached to one DRAFT claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-3", first_name: "Cy", last_name: "Ng", date_of_birth: "2013-06-01", district_student_id: "D-3" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-3", first_name: "Lee", last_name: "Ray", discipline: "SLP" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "L3", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/iep-authorizations/${auth}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:00:00Z", end_time: "2026-03-01T09:08:00Z", delivered_minutes: 8 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { log1: $.data.id }
            - call: "POST /sbmb/service-logs/${log1}/document"
              payload: { documentation_note: "n1" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/service-logs/${log1}/verify"
              payload: {}
              as: BillingCoordinator
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T10:00:00Z", end_time: "2026-03-01T10:08:00Z", delivered_minutes: 8 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { log2: $.data.id }
            - call: "POST /sbmb/service-logs/${log2}/document"
              payload: { documentation_note: "n2" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/service-logs/${log2}/verify"
              payload: {}
              as: BillingCoordinator
            - call: "POST /sbmb/claims"
              payload: { student_id: "${stu}", service_month: "2026-03" }
              as: BillingCoordinator
              captures: { claim: $.data.id }
            - call: "POST /sbmb/claims/${claim}/attach"
              payload: { service_log_id: "${log1}" }
              as: BillingCoordinator
          trigger:
            - call: "POST /sbmb/claims/${claim}/attach"
              payload: { service_log_id: "${log2}" }
              as: BillingCoordinator
              captures: { total: $.data.total_charge_cents }
          assert:
            - "ServiceLog.${log1}.delivered_units == 1"
            - "ServiceLog.${log2}.delivered_units == 1"
            - "Claim.${claim}.total_charge_cents == 6000"
            - "Claim.${claim}.attached_log_count == 2"

      - name: cost_settlement_nested_ratio_chain
        grounds:
          - calculations.cost_settlement_net
          - entities.CostSettlement.fields.gross_medicaid_cost_cents
          - entities.CostSettlement.fields.net_settlement_cents
          - calculations.rmts_medicaid_eligibility_ratio
        distinguishing_aspect: |
          Mode (a) >=3-input nonlinear chain with per-step rounding: allocated
          =round(1000000*0.5)=500000; gross=round(500000*4000/10000)=200000;
          federal=round(200000*5000/10000)=100000; net=100000-150000=-50000
          (negative recoupment branch).
        test_recipe:
          setup:
            - "A CLOSED RMTS quarter with ratio 0.5 (2 of 4 coded moments eligible), provider sampled."
            - "Cost settlement inputs certified 1000000, iep 4000bps, fmap 5000bps, interim 150000 (drives a NEGATIVE net)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-4", first_name: "Di", last_name: "Ho", discipline: "OT" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/rmts-quarters"
              payload: { fiscal_quarter: "2026-Q2" }
              as: MedicaidCoordinator
              captures: { q: $.data.id }
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-01T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m1: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m1}/respond"
              payload: { activity_response: "therapy" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m1}/code"
              payload: { activity_category: "DIRECT_MEDICAL" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-02T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m2: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m2}/respond"
              payload: { activity_response: "eval" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m2}/code"
              payload: { activity_category: "MEDICAL_ADMIN" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-03T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m3: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m3}/respond"
              payload: { activity_response: "break" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m3}/code"
              payload: { activity_category: "NON_MEDICAL" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-moments"
              payload: { rmts_quarter_id: "${q}", provider_id: "${prov}", moment_timestamp: "2026-02-04T10:00:00Z" }
              as: MedicaidCoordinator
              captures: { m4: $.data.id }
            - call: "POST /sbmb/rmts-moments/${m4}/respond"
              payload: { activity_response: "admin" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/rmts-moments/${m4}/code"
              payload: { activity_category: "GENERAL_ADMIN" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/rmts-quarters/${q}/close"
              payload: {}
              as: MedicaidCoordinator
              captures: { qver: $.data.version }
          trigger:
            - call: "POST /sbmb/cost-settlements"
              payload: { rmts_quarter_id: "${q}", certified_cost_cents: 1000000, iep_ratio_bps: 4000, fmap_bps: 5000, interim_paid_cents: 150000, expected_rmts_quarter_version: "${qver}" }
              as: MedicaidCoordinator
              captures: { settle: $.data.id }
          assert:
            - "RMTSQuarter.${q}.medicaid_eligibility_ratio == 0.5"
            - "CostSettlement.${settle}.gross_medicaid_cost_cents == 200000"
            - "CostSettlement.${settle}.federal_share_cents == 100000"
            - "CostSettlement.${settle}.net_settlement_cents == -50000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_denied_rebill_cycle
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.DENIED_to_SUBMITTED
          - entities.Claim.fields.rebill_count
        distinguishing_aspect: |
          Claim cycles SUBMITTED->DENIED->SUBMITTED (rebill), incrementing
          rebill_count to 1, then ->PAID. A pure linear pipeline cannot revisit
          SUBMITTED.
        test_recipe:
          setup:
            - "A DRAFT claim with one attached verified log (9000c), provider credentialed, timely."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/students"
              payload: { medicaid_id: "MA-5", first_name: "Ed", last_name: "Vo", date_of_birth: "2012-02-01", district_student_id: "D-5" }
              as: MedicaidCoordinator
              captures: { stu: $.data.id }
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-5", first_name: "Mo", last_name: "Ba", discipline: "SLP" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "L5", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/iep-authorizations/${auth}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:00:00Z", end_time: "2026-03-01T09:40:00Z", delivered_minutes: 40 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { log: $.data.id }
            - call: "POST /sbmb/service-logs/${log}/document"
              payload: { documentation_note: "note" }
              as: ServiceProvider
              as_user_id: "${prov}"
            - call: "POST /sbmb/service-logs/${log}/verify"
              payload: {}
              as: BillingCoordinator
            - call: "POST /sbmb/claims"
              payload: { student_id: "${stu}", service_month: "2026-03" }
              as: BillingCoordinator
              captures: { claim: $.data.id }
            - call: "POST /sbmb/claims/${claim}/attach"
              payload: { service_log_id: "${log}" }
              as: BillingCoordinator
            - call: "POST /sbmb/claims/${claim}/submit"
              payload: {}
              as: BillingCoordinator
            - call: "POST /sbmb/claims/${claim}/adjudicate"
              payload: { outcome: "DENY", denial_reason: "DOC_INCOMPLETE" }
              as: StateReviewer
          trigger:
            - call: "POST /sbmb/claims/${claim}/submit"
              payload: {}
              as: BillingCoordinator
            - call: "POST /sbmb/claims/${claim}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: StateReviewer
          assert:
            - "Claim.${claim}.status == PAID"
            - "Claim.${claim}.rebill_count == 1"
            - "Claim.${claim}.denial_reason == null"
