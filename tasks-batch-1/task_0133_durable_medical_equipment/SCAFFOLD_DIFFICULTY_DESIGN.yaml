# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Durable Medical Equipment — Expert. 9 rule_ids x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls
# / trigger call resolves to a §1.5 endpoint; placeholders are closed by earlier
# captures; formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: capped_rental_provisional_vs_chronological
        grounds:
          - calculations.capped_rental_cycle_amount
          - calculations.modifier_adjusted_monthly
          - endpoints.GET /dme-orders/{id}/rental-quote
          - state_machines.RentalBillingCycle.NEW_to_BILLED
        distinguishing_aspect: |
          On a RentalBillingCycle/quote domain, the provisional forward-looking
          quote projects 13 * monthly = 130000, while the chronological actual
          total after only two months are posted is 2 * 10000 = 20000 —
          identical inputs, two valid algorithms, different cents.
        test_recipe:
          setup:
            - "Clock at 2026-01-01. CAPPED_RENTAL item (monthly_rental_cents=10000, requires_cmn=false, requires_prior_auth=false), order with modifier KX, ACTIVE after delivery+POD."
            - "Quote taken before any cycle; then exactly two monthly cycles posted (well under the 13-month cap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat A", medicare_id: "MBI-A1", date_of_birth: "1950-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup A", ptan: "PTAN-A1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0001", description: "Std wheelchair", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-01-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-01-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "Pat A" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "GET /dme-orders/${order_id}/rental-quote"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { quote_total: $.data.provisional_total_cents }
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { cyc1_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
          assert:
            - "rental-quote provisional_total_cents == 130000 (13 * 10000)"
            - "After two posted cycles, DMEOrder.${order_id}.total_allowed_cents == 20000"
            - "DMEOrder.${order_id}.total_allowed_cents (20000) != rental-quote provisional_total_cents (130000)"

      - name: audit_recoupment_billed_vs_settled_basis
        grounds:
          - calculations.audit_recoupment_total
          - state_machines.Audit.OPEN_to_UPHELD
          - entities.Audit.fields.recouped_total_cents
        distinguishing_aspect: |
          On the Audit domain, an OVERBILLED_PAST_CAP audit (billed_basis) recoups
          all 3 BILLED/PAID cycles = 30000, while a NO_PROOF_OF_DELIVERY audit
          (settled_only_basis) on an equivalent order recoups only the single PAID
          cycle = 10000 — same cycle data, two valid bases, different recouped_total_cents.
        test_recipe:
          setup:
            - "Two equivalent CAPPED_RENTAL orders (monthly 10000, KX) each ACTIVE with 3 posted cycles; in order_b cycle#1 marked PAID, cycles #2/#3 left BILLED."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat B", medicare_id: "MBI-B1", date_of_birth: "1951-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup B", ptan: "PTAN-B1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0002", description: "Std wheelchair 2", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-02-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_b: $.data.id }
            - call: "POST /dme-orders/${order_b}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_b}", scheduled_for_utc: "2026-02-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_b: $.data.id }
            - call: "POST /deliveries/${del_b}/confirm"
              payload: { pod_signature_name: "Pat B" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_b}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_b}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { b_cyc1: $.data.id }
            - call: "POST /dme-orders/${order_b}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_b}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /rental-cycles/${b_cyc1}/mark-paid"
              payload: {}
              as: PayerReviewer
            - call: "POST /audits"
              payload: { order_id: "${order_b}", reason_code: "NO_PROOF_OF_DELIVERY" }
              as: PayerReviewer
              captures: { audit_settled: $.data.id }
          trigger:
            - call: "POST /audits/${audit_settled}/uphold"
              payload: {}
              as: PayerReviewer
              captures: { recouped_settled: $.data.recouped_total_cents }
          assert:
            - "Audit.${audit_settled}.recouped_total_cents == 10000 (settled_only_basis recoups only the 1 PAID cycle)"
            - "Audit.${audit_settled}.recouped_cycle_count == 1"
            - "A billed_basis (OVERBILLED_PAST_CAP) audit over the same 3 BILLED/PAID cycles would recoup 30000 != 10000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: modifier_adjusted_monthly_nonlinear_minmax
        grounds:
          - calculations.modifier_adjusted_monthly
          - entities.HCPCSItem.fields.billing_category
          - entities.DMEOrder.fields.modifier
        distinguishing_aspect: |
          Mode (a): monthly allowed = clamp(min/max) of base * coverage_pct/100,
          with coverage_pct branching on (modifier==KX) vs (requires_cmn) and a
          separate OXYGEN floor/ceiling clamp — >=3 inputs (base, modifier,
          category) with nested min/max and conditional branches. An OXYGEN item
          base 30000 no-KX yields raw 24000 then clamps to ceiling 20000.
        test_recipe:
          setup:
            - "OXYGEN item base monthly 30000, requires_cmn=true; order modifier NONE (no KX); ACTIVE; one cycle posted."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat O", medicare_id: "MBI-O1", date_of_birth: "1949-01-01", address_state: "TX" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup O", ptan: "PTAN-O1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "E1390", description: "Oxygen concentrator", billing_category: "OXYGEN", purchase_price_cents: 500000, monthly_rental_cents: 30000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "NONE", ordered_at_utc: "2026-03-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-1", length_of_need_months: 99, signed_date: "2026-02-15" }
              as: PhysicianUser
              captures: { cmn_id: $.data.id }
            - call: "POST /cmns/${cmn_id}/activate"
              payload: { expected_order_version: "${order_v}" }
              as: PhysicianUser
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-03-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "Pat O" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { cyc_id: $.data.id, billed: $.data.billed_amount_cents }
          assert:
            - "RentalBillingCycle.${cyc_id}.billed_amount_cents == 20000 (raw 30000*80/100=24000 clamped to OXY_CEIL_CENTS 20000)"

      - name: audit_recoupment_round_per_cycle_then_sum
        grounds:
          - calculations.audit_recoupment_total
          - state_machines.Audit.OPEN_to_UPHELD
          - state_machines.RentalBillingCycle.BILLED_to_RECOUPED
        distinguishing_aspect: |
          Mode (b): recoupment rounds each cycle's billed_amount_cents to whole
          cents THEN sums (pinned order), not sum-then-round. Three cycles at
          8000 each (no-KX coverage 80% of 10000) sum to 24000 recouped; the
          pinned per-cycle order is asserted via recouped_total_cents == 24000.
        test_recipe:
          setup:
            - "CAPPED_RENTAL item monthly 10000, requires_cmn=true; order modifier NONE (no KX -> 8000/mo); ACTIVE; 3 cycles posted at 8000 each."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat C", medicare_id: "MBI-C1", date_of_birth: "1948-01-01", address_state: "NY" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup C", ptan: "PTAN-C1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0003", description: "Wheelchair cmn", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: true, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "NONE", ordered_at_utc: "2026-04-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /cmns"
              payload: { order_id: "${order_id}", physician_npi: "NPI-2", length_of_need_months: 12, signed_date: "2026-03-20" }
              as: PhysicianUser
              captures: { cmn_id: $.data.id }
            - call: "POST /cmns/${cmn_id}/activate"
              payload: { expected_order_version: "${order_v}" }
              as: PhysicianUser
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-04-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "Pat C" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /audits"
              payload: { order_id: "${order_id}", reason_code: "OVERBILLED_PAST_CAP" }
              as: PayerReviewer
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /audits/${audit_id}/uphold"
              payload: {}
              as: PayerReviewer
              captures: { recouped: $.data.recouped_total_cents }
          assert:
            - "Audit.${audit_id}.recouped_total_cents == 24000 (round_half_up(8000) per cycle, summed over 3 cycles)"
            - "Audit.${audit_id}.recouped_cycle_count == 3"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: dme_order_branch_convert_vs_close
        grounds:
          - state_machines.DMEOrder.ACTIVE_to_CONVERTED_TO_PURCHASE
          - state_machines.DMEOrder.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          DMEOrder branches from ACTIVE: reaching the 13-month cap drives
          ACTIVE -> CONVERTED_TO_PURCHASE (system, terminal), while an explicit close
          drives ACTIVE -> CLOSED (a different terminal) — divergent branches on one entity.
        test_recipe:
          setup:
            - "CAPPED_RENTAL order monthly 10000 KX, ACTIVE; bill only 2 cycles then close (cap not reached)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat D", medicare_id: "MBI-D1", date_of_birth: "1947-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup D", ptan: "PTAN-D1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0004", description: "Wheelchair close", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-05-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-05-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "Pat D" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /dme-orders/${order_id}/close"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { final_status: $.data.status }
          assert:
            - "DMEOrder.${order_id}.status == CLOSED"
            - "DMEOrder.${order_id}.cap_reached == false"

      - name: audit_branch_uphold_vs_dismiss
        grounds:
          - state_machines.Audit.OPEN_to_UPHELD
          - state_machines.Audit.OPEN_to_DISMISSED
        distinguishing_aspect: |
          Audit branches from OPEN: dismiss closes with zero ledger effect
          (recouped_total_cents stays 0, order.total_allowed_cents unchanged),
          a divergent branch from the recoupment cascade that uphold fires.
        test_recipe:
          setup:
            - "CAPPED_RENTAL order monthly 10000 KX, ACTIVE, 2 cycles posted (total 20000); audit OPEN."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat E", medicare_id: "MBI-E1", date_of_birth: "1946-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup E", ptan: "PTAN-E1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0005", description: "Wheelchair dismiss", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
              payload: { patient_id: "${pat_id}", supplier_id: "${sup_id}", hcpcs_item_id: "${item_id}", acquisition_type: "RENTAL", modifier: "KX", ordered_at_utc: "2026-06-01T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dme-orders/${order_id}/mark-ready"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /deliveries"
              payload: { order_id: "${order_id}", scheduled_for_utc: "2026-06-02T00:00:00Z" }
              as: SupplierUser
              as_user_id: "${sup_id}"
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/confirm"
              payload: { pod_signature_name: "Pat E" }
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/activate-billing"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /dme-orders/${order_id}/rental-cycles"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_id}"
            - call: "POST /audits"
              payload: { order_id: "${order_id}", reason_code: "NO_VALID_CMN" }
              as: PayerReviewer
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /audits/${audit_id}/dismiss"
              payload: {}
              as: PayerReviewer
              captures: { audit_status: $.data.status }
          assert:
            - "Audit.${audit_id}.status == DISMISSED"
            - "Audit.${audit_id}.recouped_total_cents == 0"
            - "DMEOrder.${order_id}.total_allowed_cents == 20000 (unchanged by dismiss)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: audit_uphold_recoupment_cascade_depth3
        grounds:
          - state_machines.Audit.OPEN_to_UPHELD
          - state_machines.RentalBillingCycle.BILLED_to_RECOUPED
          - calculations.order_total_allowed
          - entities.ClaimLine.fields.line_type
        distinguishing_aspect: |
          Depth-3 cascade triggered by Audit OPEN->UPHELD: (L1) each BILLED/PAID
          cycle -> RECOUPED, which itself (L2) creates a negative RECOUPMENT
          ClaimLine and voids the original line, which itself (L3) recomputes
          DMEOrder.total_allowed_cents. Each hop is caused by the previous hop.
        test_recipe:
          setup:
            - "CAPPED_RENTAL order monthly 10000 KX, ACTIVE, 2 cycles posted (total 20000); audit OPEN with reason OVERBILLED_PAST_CAP (billed_basis)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat F", medicare_id: "MBI-F1", date_of_birth: "1945-01-01", address_state: "CA" }
              as: PlatformAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /suppliers"
              payload: { name: "Sup F", ptan: "PTAN-F1", accreditation_active: true }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /hcpcs-items"
              payload: { hcpcs_code: "K0006", description: "Wheelchair cascade", billing_category: "CAPPED_RENTAL", purchase_price_cents: 100000, monthly_rental_cents: 10000, requires_cmn: false, requires_prior_auth: false, is_cpap: false }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /dme-orders"
