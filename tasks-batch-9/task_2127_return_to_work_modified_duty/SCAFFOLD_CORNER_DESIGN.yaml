- section: validations
  instances:
  - name: missing_user_role_header_returns_unauthenticated
    claim_type: Violation -> Error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request carrying no X-User-Role header fails the priority-1 authentication row with 401 ERR_UNAUTHENTICATED before any existence or state check runs.
    test_recipe:
      setup:
      - Empty database apart from the clock reset.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: GET /rtw/employees/00000000-0000-4000-8000-000000000000
        payload: {}
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_UNAUTHENTICATED
      - HTTP status == 401
      - ${err} != ERR_EMPLOYEE_NOT_FOUND
  - name: pagination_limit_above_maximum_returns_invalid_request
    claim_type: Violation -> Error
    grounds:
    - validations[priority=3]
    - response_envelope.pagination_defaults
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: limit 101 exceeds the declared maximum of 100 and is refused at priority 3 with 400 ERR_INVALID_REQUEST rather than being silently clamped.
    test_recipe:
      setup:
      - Empty database apart from the clock reset.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: GET /rtw/placements
        payload:
          limit: 101
          offset: 0
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
      - HTTP status == 400
