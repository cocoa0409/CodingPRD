  # ============================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: redemption_approval_depends_on_fiscal_year_final
        grounds:
          - state_machines.RedemptionRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.FiscalYear
        distinguishing_aspect: |
          Cross-entity pair RedemptionRequest → FiscalYear: a request cannot move
          UNDER_REVIEW → APPROVED unless the parent FiscalYear of every listed
          certificate is in CLOSED_FINAL. Attempting decide while year is still
          CLOSED_PROVISIONAL fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "District DIST-M, Member M19, FY11 CLOSED_PROVISIONAL (NOT yet CLOSED_FINAL)"
            - "1 PROVISIONAL allocation and ISSUED certificate for M19"
            - "RedemptionRequest R3 kind=RETIREMENT in UNDER_REVIEW referencing the cert"
            - "PASSED APPROVE_RETIREMENT resolution exists"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
