        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_FARM_NOT_COMPLIANT]
          - errors[ERR_DELIVERY_OUTSIDE_HARVEST_WINDOW]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: farm posture is
