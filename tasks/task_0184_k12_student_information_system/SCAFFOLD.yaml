    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: "DisciplineIncident[]"
    side_effects: []
  - method: GET
    path: "/discipline-incidents/{id}"
    description: "Get a discipline incident"
    roles: [Teacher, Administrator, Registrar, Parent]
    code: 200
    input: []
    output: DisciplineIncident
    side_effects: []
  - method: POST
    path: "/discipline-incidents/{id}/begin-review"
    description: "Administrator opens review (SoD: not the referrer)"
    roles: [Administrator]
    code: 200
    input: []
    output: DisciplineIncident
    side_effects: ["status -> UNDER_REVIEW", "adjudicator_user_id = X-User-ID"]
  - method: POST
    path: "/discipline-incidents/{id}/adjudicate"
    description: "Adjudicate an incident under review (consequence must exist)"
    roles: [Administrator]
    code: 200
    input: []
    output: DisciplineIncident
    side_effects: ["status -> ADJUDICATED"]
  - method: POST
    path: "/discipline-incidents/{id}/dismiss"
    description: "Dismiss an incident; rescinds active consequence cascade"
    roles: [Administrator]
    code: 200
