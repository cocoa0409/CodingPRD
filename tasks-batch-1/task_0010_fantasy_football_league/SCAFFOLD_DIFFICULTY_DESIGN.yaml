          setup:
            - "League IN_SEASON, current_week=1; Team_A has faab_balance_cents=10000."
            - "Team_A has submitted two SUBMITTED WaiverClaim rows in processing_week=1: claim_X bids 10000 cents on player_X (a free agent), claim_Y bids 100 cents on player_Y (also free agent)."
