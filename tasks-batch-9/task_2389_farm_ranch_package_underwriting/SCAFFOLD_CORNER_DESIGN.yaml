            - "GET /farm-accounts?agent_id=${ag_id} as A1 returns only A1's own account with total_count 1"

      - name: corner_segregation_of_duties_on_the_referral_decision
        claim_type: segregation_of_duties
        grounds: ["validations[priority=7]", "errors.ERR_SEGREGATION_OF_DUTIES", "state_machines.FarmPolicy.uw_status[REFERRED->RATED]"]
        distinguishing_aspect: "The senior underwriter who caused the referral by rating the policy cannot decide it: the same X-User-ID gets ERR_SEGREGATION_OF_DUTIES (403) while a second SeniorUnderwriter approves the identical body."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with an RC DWELLING at 40000000 and an AGRITOURISM exposure of 2500 visitors on 4000000 of receipts"
            - "the policy is rated by SeniorUnderwriter S1, which refers it for AGRITOURISM_VISITORS"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_agri
            - *k_rate_get
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: SeniorUnderwriter
              as_user_id: "senior-underwriter-s1"
              captures: { ref_status: $.data.uw_status, ref_reason: $.data.referral_reason_code, ref_by: $.data.referred_by_user_id, ref_total: $.data.total_premium_cents }
          trigger:
            - call: "POST /farm-policies/${pol_id}/referral-decisions"
              payload: { decision: "APPROVE", decision_note: "self-approval attempt" }
              as: SeniorUnderwriter
              as_user_id: "senior-underwriter-s1"
              captures: { e_sod: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/referral-decisions"
              payload: { decision: "APPROVE", decision_note: "agritourism exposure reviewed and accepted" }
              as: SeniorUnderwriter
              as_user_id: "senior-underwriter-s2"
              captures: { sod_status: $.data.uw_status, sod_expiry: $.data.quote_expires_at }
          assert:
            - "the rating produced uw_status REFERRED with referral_reason_code AGRITOURISM_VISITORS, referred_by_user_id senior-underwriter-s1 and quote_expires_at null"
            - "the premium was still fully computed and reserved on the referral: property 144000, liability 316000 (60000 + 2000 * 120 + 16000), cat_load 125200 and total_premium_cents 585200, with three RESERVED reservations"
            - "the self-decision returns HTTP 403 ERR_SEGREGATION_OF_DUTIES and leaves the policy REFERRED"
            - "the second senior's approval moves the policy to RATED and sets quote_expires_at 2026-09-14T00:00:00Z, thirty days from the decision clock"
            - "no premium figure changed across either decision attempt and no reservation was re-created"

      - name: corner_unauthenticated_requests_rejected_before_every_other_check
        claim_type: forbidden_operations
        grounds: ["errors.ERR_UNAUTHENTICATED", "validations[priority=1]"]
        distinguishing_aspect: "A blank X-User-ID short-circuits the whole ladder: the same three requests that would otherwise produce a 403, a 400 and a 404 all return ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy"
          setup_api_calls:
