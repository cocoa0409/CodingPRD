            - call: "POST /tuition-accounts/${acct1_id}/payments"
              payload: { amount_cents: 1 }
              as: Guardian
              as_user_id: "${m1_id}"
            - call: "GET /members/${m1_id}"
              as: RegistrarStaff
            - call: "POST /members/${m1_id}/status-transition"
              payload: { dimension: "ENROLLMENT", to_status: "GRADUATED" }
