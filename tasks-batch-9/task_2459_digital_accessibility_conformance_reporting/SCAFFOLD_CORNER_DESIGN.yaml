        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / attest_segregation_of_duties_precedes_expired_evidence
          rationale: "The second call of that instance violates only the evidence-age rule and asserts ERR_ASSESSMENT_EVIDENCE_EXPIRED with HTTP 422."

      - name: corner_error_train_capacity_exceeded
        claim_type: violation_to_error
        grounds:
          - validations[priority=82]
        excluded_because:
          difficulty_instance: boundary_precision_check / train_effort_capacity_at_exact_equality_then_one_point_over
          rationale: "The one-point-over commit there asserts ERR_TRAIN_CAPACITY_EXCEEDED with HTTP 409."

