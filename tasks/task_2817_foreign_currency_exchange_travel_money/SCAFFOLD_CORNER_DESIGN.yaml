              as: BranchTeller
              as_user_id: teller-01
              captures: { txn_id: "$.data.id" }
            - call: "POST /exchange-transactions/${txn_id}/authorize"
              payload: {}
              as: BranchTeller
              as_user_id: teller-01
            - call: "POST /exchange-transactions/${txn_id}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: teller-02
            - call: "POST /note-assessments"
              payload: { branch_id: "${br_id}", inventory_position_id: "${pos_id}", exchange_transaction_id: "${txn_id}", denomination_minor_units: 10000, note_count: 1, defect_type: "DAMAGED" }
              as: BranchTeller
              captures: { a_dmg: "$.data.id" }
            - call: "POST /note-assessments"
              payload: { branch_id: "${br_id}", inventory_position_id: "${pos_id}", exchange_transaction_id: "${txn_id}", denomination_minor_units: 10000, note_count: 1, defect_type: "SUSPECTED_COUNTERFEIT", serial_reference: "EX9911872" }
              as: BranchTeller
              captures: { a_cft: "$.data.id" }
            - call: "POST /note-assessments"
              payload: { branch_id: "${br_id}", inventory_position_id: "${pos_id}", exchange_transaction_id: "${txn_id}", denomination_minor_units: 10000, note_count: 1, defect_type: "OBSOLETE_SERIES" }
              as: BranchTeller
