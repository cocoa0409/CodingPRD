  - rule_id: resource_temporal_overlap
    instances:
      - name: inspection_window_overlap_with_travel_buffer_on_inspector
        grounds:
          - validations[priority=33]
          - errors[ERR_INSPECTOR_WINDOW_CONFLICT]
          - entities.Inspection.fields.scheduled_start_utc
          - entities.Inspection.fields.scheduled_end_utc
        distinguishing_aspect: |
          Resource entity: Rater acting as field inspector; interval semantics: half-open instant
          windows [start, end) expanded by a 45-minute travel buffer on both sides, where buffered
          intervals that merely touch do NOT collide. Against an existing 09:00-11:00 window
          (buffered 08:15-11:45), an 11:30-12:30 request (buffered 10:45-13:15) is rejected while a
          12:30-13:30 request (buffered 11:45-14:15) is accepted because the buffers only touch.
        test_recipe:
          setup:
            - "Builder Ashcombe Homes, subdivision Ember Field (IECC_2021, CZ4)"
            - "Field inspector Ines Pike with one SCHEDULED FINAL inspection on 2026-08-18 from 09:00Z to 11:00Z"
            - "A second home with its own PROJECTED rating so further inspections can be scheduled"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Ashcombe Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b16: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b16}", name: "Ember Field", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
              captures: { sd16: $.data.id }
