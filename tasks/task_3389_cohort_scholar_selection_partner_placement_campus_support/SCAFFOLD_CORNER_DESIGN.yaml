        distinguishing_aspect: "Priority 1: a request sent without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or business check runs — even on a read endpoint."
        test_recipe:
          setup: ["Send the trigger call with BOTH auth headers omitted (no X-User-Role, no X-User-ID)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/cohorts/00000000-0000-0000-0000-000000000000", as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 with error_id == ERR_UNAUTHENTICATED (captured ${err}) — not 404, proving auth precedes existence"
      - name: nomination_window_inclusive_boundaries
