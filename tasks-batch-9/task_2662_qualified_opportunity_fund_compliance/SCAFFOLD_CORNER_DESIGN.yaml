              captures: { proj_a2: $.data.id }
          assert:
            - "${err_missing} == ERR_AGGREGATION_GROUP_INVALID with HTTP 422 (AGGREGATED_GROUP demands a non-blank group_key)"
            - "${err_forbidden} == ERR_AGGREGATION_GROUP_INVALID with HTTP 422 (ASSET_BY_ASSET must omit group_key)"
            - "Third call HTTP 201 with ${denom_a1} == 400000.00 and FundAsset.${asset_a1}.status == IMPROVING"
            - "${err_cross_fund} == ERR_AGGREGATION_GROUP_INVALID with HTTP 422: GRP-2662-A already spans Fund.${fund_a}, so an asset of Fund.${fund_b} may not join it, and FundAsset.${asset_b1}.status stays HELD"
            - "Last call HTTP 201: a second asset of the SAME fund joins GRP-2662-A, so the group now holds ${proj_a1} and ${proj_a2} with a shared denominator of 400000.00 + 600000.00 == 1000000.00"

      - name: step_up_election_filing_guards_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - validations[priority=33]
          - errors[ERR_TEN_YEAR_HOLD_NOT_MET]
          - errors[ERR_DISPOSITION_SEQUENCE_INVALID]
          - errors[ERR_ELECTION_REVOKED]
        distinguishing_aspect: "Three step-up filing guards on one election. Priority 31 is NOT the short-hold case (a short hold is a DENIED StepUpElection, not an error) — it only rejects a filing whose investment_date is strictly after the logical clock, reachable by rewinding the clock. Priority 32 rejects a disposition_sequence that repeats an asset. Priority 33 answers 409 on a REVOKED election precisely because priority 14 exempts this endpoint from the terminal-state rule."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Step Guard Trust", taxpayer_type: "TRUST", tax_year_end_month: 12, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 300000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Step Guard QOF", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 150000.00, afs_fair_value: 150000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_a: $.data.id }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 300000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elec_id: $.data.id, inv_date: $.data.investment_date }
          trigger:
            - call: "POST /qof/_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { prev_utc: $.data.previous_utc }
            - call: "POST /qof/deferral-elections/${elec_id}/step-up-elections"
              payload: { claimed_fmv: 500000.00 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_hold: $.data.error_id }
            - call: "POST /qof/_clock/set_current_utc"
              payload: { current_utc: "2036-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /qof/deferral-elections/${elec_id}/step-up-elections"
              payload: { claimed_fmv: 500000.00, disposition_sequence: [ "${asset_a}", "${asset_a}" ] }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /qof/deferral-elections/${elec_id}/step-up-elections"
              payload: { claimed_fmv: 500000.00, disposition_sequence: [] }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_empty: $.data.error_id }
            - call: "POST /qof/deferral-elections/${elec_id}/revoke"
              payload: { revoked_reason_code: "INVESTOR_WITHDRAWAL" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { rev_status: $.data.status }
            - call: "POST /qof/deferral-elections/${elec_id}/step-up-elections"
              payload: { claimed_fmv: 500000.00 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_revoked: $.data.error_id }
          assert:
            - "${inv_date} == 2026-08-01T00:00:00Z and ${prev_utc} == 2026-08-01T00:00:00Z (the clock may move backwards; §1.5 declares no monotonicity)"
            - "${err_hold} == ERR_TEN_YEAR_HOLD_NOT_MET with HTTP 422 because investment_date 2026-08-01 is strictly after the clock 2026-07-15, so holding_period_days cannot be evaluated"
            - "${err_dup} == ERR_DISPOSITION_SEQUENCE_INVALID with HTTP 422 (${asset_a} appears twice)"
            - "${err_empty} == ERR_DISPOSITION_SEQUENCE_INVALID with HTTP 422 (a supplied disposition_sequence must be non-empty)"
            - "No StepUpElection row exists after the three rejections; DeferralElection.${elec_id}.status is still DEFERRED with current_basis == 0.00 and step_up_applied_pct == 0.0000, and FundAsset.${asset_a}.disposition_sequence_index == null"
            - "${rev_status} == REVOKED"
            - "${err_revoked} == ERR_ELECTION_REVOKED with HTTP 409 — NOT ERR_ALREADY_TERMINAL, because priority 14 exempts POST /qof/deferral-elections/{id}/step-up-elections"
            - "EligibleGain.${gain_id}.status == ELIGIBLE with elected_amount == 0.00 and unelected_amount == 300000.00 after the revocation"

      - name: disposition_out_of_declared_order_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=34]
          - entities.FundAsset.disposition_sequence_index
          - errors[ERR_DISPOSITION_ORDER_VIOLATION]
        distinguishing_aspect: "A GRANTED step-up writes 1-based disposition_sequence_index values onto the listed assets, and priority 34 then forces disposals to follow that order. The declared order is deliberately the REVERSE of creation order, so the rule cannot be satisfied by accident: disposing the second-indexed asset first is 409 ERR_DISPOSITION_ORDER_VIOLATION even though the asset is HELD and the caller owns the fund."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Order Discipline LLC", taxpayer_type: "PARTNERSHIP", tax_year_end_month: 12, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 300000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Order Discipline QOF", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 100000.00, afs_fair_value: 100000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_a: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-06T00:00:00Z", unadjusted_cost_basis: 200000.00, afs_fair_value: 200000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_b: $.data.id }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 300000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elec_id: $.data.id }
            - call: "POST /qof/_clock/set_current_utc"
              payload: { current_utc: "2036-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /qof/deferral-elections/${elec_id}/step-up-elections"
              payload: { claimed_fmv: 450000.00, disposition_sequence: [ "${asset_b}", "${asset_a}" ] }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sue_status: $.data.status, hold_days: $.data.holding_period_days }
          trigger:
            - call: "POST /qof/fund-assets/${asset_a}/dispose"
              payload: { proceeds_amount: 120000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_order: $.data.error_id }
            - call: "POST /qof/fund-assets/${asset_b}/dispose"
              payload: { proceeds_amount: 260000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { b_status: $.data.status }
            - call: "POST /qof/fund-assets/${asset_a}/dispose"
              payload: { proceeds_amount: 120000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { a_status: $.data.status }
          assert:
            - "${hold_days} == 3653 and ${sue_status} == GRANTED, so FundAsset.${asset_b}.disposition_sequence_index == 1 and FundAsset.${asset_a}.disposition_sequence_index == 2"
            - "${err_order} == ERR_DISPOSITION_ORDER_VIOLATION with HTTP 409: index 2 may not be disposed while index 1 is still HELD"
            - "FundAsset.${asset_a}.status is still HELD and disposed_at == null after the rejection"
            - "${b_status} == DISPOSED with proceeds_amount 260000.00 and disposed_at == 2036-08-01T00:00:00Z"
            - "${a_status} == DISPOSED once index 1 is DISPOSED; the same request that failed now succeeds with no change to its payload"
            - "Fund.${fund_id}.aggregate_asset_basis == 0.00 after both disposals (only HELD and IMPROVING assets count)"

      - name: inclusion_fraction_over_remaining_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=37]
          - calculations.inclusion_event_amount
          - errors[ERR_INCLUSION_FRACTION_EXCEEDS_REMAINING]
        distinguishing_aspect: "Priority 37 caps the RUNNING total, not the single event: 0.5000 is a perfectly legal included_fraction that becomes illegal only because 0.6000 was already recorded. The rejected event leaves included_fraction_total untouched, and a later 0.4000 event closes the election at exactly 1.0000."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Fraction Ceiling Trust", taxpayer_type: "TRUST", tax_year_end_month: 12, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_id: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_id}", gain_character: "SHORT_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { gain_id: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Fraction Ceiling QOF", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_id}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { elec_id: $.data.id }
          trigger:
            - call: "POST /qof/deferral-elections/${elec_id}/inclusion-events"
              payload: { event_type: "PARTIAL_REDEMPTION", included_fraction: 0.6000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { ev1: $.data.id, gross1: $.data.gross_inclusion_amount, net1: $.data.net_inclusion_amount }
            - call: "POST /qof/deferral-elections/${elec_id}/inclusion-events"
              payload: { event_type: "PARTIAL_REDEMPTION", included_fraction: 0.5000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_frac: $.data.error_id }
            - call: "POST /qof/deferral-elections/${elec_id}/inclusion-events"
              payload: { event_type: "SALE_OF_INTEREST", included_fraction: 0.4000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { ev2: $.data.id, gross2: $.data.gross_inclusion_amount, net2: $.data.net_inclusion_amount }
          assert:
            - "First event HTTP 201 with ${gross1} == 60000.00 and ${net1} == 60000.00 (holding_tier UNDER_FIVE grants no basis offset)"
            - "DeferralElection.${elec_id}.status == INCLUDED_PARTIAL with included_fraction_total == 0.6000 and deferred_remaining == 40000.00"
            - "${err_frac} == ERR_INCLUSION_FRACTION_EXCEEDS_REMAINING with HTTP 422 because round(0.6000 + 0.5000, 4) == 1.1000 > 1.0000"
            - "No second InclusionEvent row is created by the rejected call: included_fraction_total is still 0.6000 and included_amount is still 60000.00"
            - "Third event HTTP 201 with ${gross2} == 40000.00 and ${net2} == 40000.00; round(0.6000 + 0.4000, 4) == 1.0000 is allowed at the ceiling"
            - "DeferralElection.${elec_id}.status == INCLUDED_FULL with included_fraction_total == 1.0000, included_amount == 100000.00 and deferred_remaining == 0.00"
            - "Investor.${inv_id} rollups: included_gain_total == 100000.00 and deferred_gain_outstanding == 0.00"

      - name: third_cure_request_after_two_denials_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=38]
          - state_machines.PenaltyAssessment
          - errors[ERR_CURE_ATTEMPTS_EXHAUSTED]
        distinguishing_aspect: "cure_attempt_count is capped at 2, and only a REASONABLE_CAUSE denial returns the assessment to ASSESSED — so exactly two cure cycles are reachable before priority 38 answers 409. The assessment is still in the non-terminal ASSESSED state when the third request is refused, which is what distinguishes this from ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Segregation of duties is respected throughout: mgr-fund-1 measures and requests cures, co-certifier-1 certifies and decides."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Two Strikes QOF", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 1000000.00, afs_fair_value: 1000000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_id: $.data.id }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { ratio: $.data.ratio_pct, shortfall: $.data.shortfall_amount, months: $.data.failed_month_count }
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { test_status: $.data.status }
            - call: "GET /qof/penalty-assessments?fund_id=${fund_id}"
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { pen_id: "$.data[0].id", gross: "$.data[0].gross_penalty_amount" }
          trigger:
            - call: "POST /qof/penalty-assessments/${pen_id}/cure-requests"
              payload: { cure_basis: "REASONABLE_CAUSE", narrative_reference: "CURE-2662-A" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { st1: $.data.status, n1: $.data.cure_attempt_count }
            - call: "POST /qof/penalty-assessments/${pen_id}/cure-decisions"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { st2: $.data.status }
            - call: "POST /qof/penalty-assessments/${pen_id}/cure-requests"
              payload: { cure_basis: "REASONABLE_CAUSE", narrative_reference: "CURE-2662-B" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { st3: $.data.status, n2: $.data.cure_attempt_count }
            - call: "POST /qof/penalty-assessments/${pen_id}/cure-decisions"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { st4: $.data.status }
            - call: "POST /qof/penalty-assessments/${pen_id}/cure-requests"
              payload: { cure_basis: "REASONABLE_CAUSE", narrative_reference: "CURE-2662-C" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_exhausted: $.data.error_id }
          assert:
            - "${ratio} == 0.0000, ${shortfall} == 900000.00, ${months} == 6 and ${test_status} == CERTIFIED_FAIL, so ${gross} == 36000.00 (monthly_penalty_amount 6000.00 x 6)"
            - "${st1} == CURE_REQUESTED with ${n1} == 1; ${st2} == ASSESSED (a denied REASONABLE_CAUSE cure cycles back)"
            - "${st3} == CURE_REQUESTED with ${n2} == 2; ${st4} == ASSESSED"
            - "${err_exhausted} == ERR_CURE_ATTEMPTS_EXHAUSTED with HTTP 409 on the third request"
            - "PenaltyAssessment.${pen_id}.status is still ASSESSED with cure_attempt_count == 2, narrative_reference == CURE-2662-B, cure_credit_amount == 0.00 and net_penalty_amount == 36000.00"
            - "Fund.${fund_id}.compliance_posture == DEFICIENT and cumulative_penalty_months == 6 (the refused request changes nothing)"

      - name: fund_not_certified_error_corner
        claim_type: error_triggerable
        grounds:
          - validations[priority=11]
          - errors[ERR_FUND_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: asset_test_measure_requires_self_certified_fund
          rationale: "That §1.8 cross_entity_state_dependency instance measures a test on a DRAFT fund and asserts 409 ERR_FUND_NOT_CERTIFIED, and fund_state_gate_precedes_180_day_window additionally pins it ahead of the window error at priority 20; the catalog entry is therefore already triggered twice in §1.8."

      - name: investor_not_attested_error_corner
        claim_type: error_triggerable
        grounds:
          - validations[priority=16]
          - errors[ERR_INVESTOR_NOT_ATTESTED]
        excluded_because:
          difficulty_instance: deferral_election_blocked_by_investor_attestation
          rationale: "That §1.8 instance files an election for a PENDING investor, asserts 422 ERR_INVESTOR_NOT_ATTESTED, flips the investor to ATTESTED via PATCH and replays the identical request successfully, so both the violation and satisfaction halves of the rule are already covered."

      - name: elected_amount_exceeds_gain_error_corner
        claim_type: error_triggerable
        grounds:
          - validations[priority=19]
          - errors[ERR_ELECTED_AMOUNT_EXCEEDS_GAIN]
        excluded_because:
          difficulty_instance: attestation_gate_precedes_amount_ceiling
          rationale: "That §1.8 priority_pair_validation_conflict instance violates the attestation gate and the amount ceiling in one request, asserts the 422 ERR_INVESTOR_NOT_ATTESTED, then repairs the attestation and re-sends to expose 422 ERR_ELECTED_AMOUNT_EXCEEDS_GAIN on the unelected remainder."

      - name: one_hundred_eighty_day_window_closed_error_corner
        claim_type: error_triggerable
        grounds:
          - validations[priority=18]
          - errors[ERR_180_DAY_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: deferral_election_day_180_boundary
          rationale: "That §1.8 boundary_precision_check instance files elections at day 179, day 180 and day 181 from window_basis_date and asserts 201 / 201 / 422 ERR_180_DAY_WINDOW_CLOSED, which covers the error and its exact boundary."

      - name: testing_period_overlap_error_corner
        claim_type: error_triggerable
        grounds:
          - validations[priority=21]
          - errors[ERR_TESTING_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: asset_test_period_half_open_adjacency_allowed
          rationale: "That §1.8 resource_temporal_overlap instance accepts the adjacent half-open period and then asserts 409 ERR_TESTING_PERIOD_OVERLAP for a period overlapping by a single day, which is the only meaningful trigger for this id."

      - name: improvement_window_overlap_error_corner
        claim_type: error_triggerable
        grounds:
          - validations[priority=22]
          - errors[ERR_IMPROVEMENT_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: improvement_window_closed_interval_adjacency_collides
          rationale: "That §1.8 resource_temporal_overlap instance shows the closed-interval arithmetic of §1.1 rejecting a second project on the same asset whose window starts on window_end - 1 day, asserting 409 ERR_IMPROVEMENT_WINDOW_OVERLAP against the half-open AssetTest rule."

      - name: wcsh_aggregate_cap_error_corner
        claim_type: error_triggerable
        grounds:
          - validations[priority=36]
          - errors[ERR_WCSH_AGGREGATE_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: wcsh_aggregate_capacity_over_overlapping_plans
          rationale: "That §1.8 resource_temporal_overlap instance builds two individually legal plans whose covered months collectively pass the 31-percent-of-total_asset_value ceiling and asserts 422 ERR_WCSH_AGGREGATE_CAP_EXCEEDED on the second creation."

  # ---------------------------------------------------------------------------
  # Table 7 (RBAC): four roles, role_model == segregation_of_duties. Investor is
  # entity_backed (X-User-ID is an Investor.id); the other three are opaque
  # operator handles. ERR_ROLE_NOT_PERMITTED (3), ERR_INVESTOR_SCOPE_VIOLATION
  # (8) and ERR_FUND_MANAGER_MISMATCH (9) are triggered here.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: asset_test_certify_is_compliance_officer_exclusive
        claim_type: exclusive_operations
        grounds:
          - rbac.ComplianceOfficer
          - endpoints[POST /qof/asset-tests/{id}/certify]
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "§1.5 lists ComplianceOfficer as the ONLY role on certify — even PlatformAdmin is excluded, which is unusual and worth pinning. Priority 3 runs before every domain gate, so the three refused calls answer 403 ERR_ROLE_NOT_PERMITTED on a MEASURED test that would otherwise certify successfully, and the Investor caller's X-User-ID need not even exist."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Certify Authority QOF", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_id: $.data.id }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { measured_by: $.data.measured_by_user_id, st: $.data.status }
          trigger:
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_fm: $.data.error_id }
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_admin: $.data.error_id }
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: Investor
              as_user_id: "00000000-0000-4000-8000-000000000099"
              captures: { err_inv: $.data.error_id }
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { final_status: $.data.status, certified_by: $.data.certified_by_user_id }
          assert:
            - "${st} == MEASURED with ${measured_by} == mgr-fund-1"
            - "${err_fm} == ERR_ROLE_NOT_PERMITTED with HTTP 403 (a FundManager may measure but never certify)"
            - "${err_admin} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — PlatformAdmin is deliberately absent from this endpoint's roles list"
            - "${err_inv} == ERR_ROLE_NOT_PERMITTED with HTTP 403, raised at priority 3 before the unknown Investor id could ever be looked up"
            - "AssetTest.${test_id}.status is still MEASURED and certified_by_user_id == null after the three refusals"
            - "${final_status} == CERTIFIED_FAIL with ${certified_by} == co-certifier-1 on the ComplianceOfficer call (HTTP 200)"

      - name: each_role_is_denied_the_other_roles_exclusive_operations
        claim_type: denied_operation
        grounds:
          - rbac.PlatformAdmin
          - rbac.FundManager
          - rbac.Investor
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "One instance per direction of the role lattice: there is NO hierarchical override in this domain, so PlatformAdmin cannot self-certify a fund, a FundManager cannot mint investors or move the logical clock, a ComplianceOfficer cannot dispose an asset, and an Investor cannot create fund assets. Each refusal is 403 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Role Lattice QOF", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cert_status: $.data.certification_status }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 250000.00, afs_fair_value: 250000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_admin_certify: $.data.error_id }
            - call: "POST /qof/investors"
              payload: { legal_name: "Manager Minted Investor", taxpayer_type: "INDIVIDUAL" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_fm_investor: $.data.error_id }
            - call: "POST /qof/_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_fm_clock: $.data.error_id }
            - call: "POST /qof/fund-assets/${asset_id}/dispose"
              payload: { proceeds_amount: 260000.00 }
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { err_co_dispose: $.data.error_id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-06T00:00:00Z", unadjusted_cost_basis: 10000.00, afs_fair_value: 10000.00 }
              as: Investor
              as_user_id: "00000000-0000-4000-8000-000000000099"
              captures: { err_inv_asset: $.data.error_id }
            - call: "GET /qof/_clock"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { now: $.data.current_utc }
          assert:
            - "${cert_status} == SELF_CERTIFIED from the FundManager's own exclusive operation"
            - "${err_admin_certify} == ERR_ROLE_NOT_PERMITTED with HTTP 403 (self-certify is FundManager-exclusive; PlatformAdmin holds no override)"
            - "${err_fm_investor} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and no Investor row is created"
            - "${err_fm_clock} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${err_co_dispose} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and FundAsset.${asset_id}.status is still HELD"
            - "${err_inv_asset} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and Fund.${fund_id}.aggregate_asset_basis is still 250000.00"
            - "${now} == 2026-08-01T00:00:00Z — the refused clock write left the logical clock untouched, and reading it IS shared with FundManager"

      - name: investor_cannot_reach_another_investors_records
        claim_type: peer_roles
        grounds:
          - rbac.Investor
          - validations[priority=8]
          - complexity_profile.role_model
          - errors[ERR_INVESTOR_SCOPE_VIOLATION]
        distinguishing_aspect: "Investor is the only entity_backed role: X-User-ID IS an Investor.id, so ownership is checked against the row rather than an operator handle. Peer isolation must hold on the derived statement read as well as the raw gain read, while a ComplianceOfficer sees both investors."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "Peer One Trust", taxpayer_type: "TRUST", tax_year_end_month: 12, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_1: $.data.id }
            - call: "POST /qof/investors"
              payload: { legal_name: "Peer Two LLC", taxpayer_type: "PARTNERSHIP", tax_year_end_month: 12, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_2: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_1}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 80000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_1}"
              captures: { gain_1: $.data.id }
          trigger:
            - call: "GET /qof/eligible-gains/${gain_1}"
              as: Investor
              as_user_id: "${inv_2}"
              captures: { err_gain: $.data.error_id }
            - call: "GET /qof/investors/${inv_1}"
              as: Investor
              as_user_id: "${inv_2}"
              captures: { err_inv: $.data.error_id }
            - call: "GET /qof/investors/${inv_1}/statement"
              as: Investor
              as_user_id: "${inv_2}"
              captures: { err_stmt: $.data.error_id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_1}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 5000.00, realization_date: "2026-07-02T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_2}"
              captures: { err_create: $.data.error_id }
            - call: "GET /qof/eligible-gains/${gain_1}"
              as: Investor
              as_user_id: "${inv_1}"
              captures: { own_amount: $.data.eligible_amount }
            - call: "GET /qof/investors/${inv_1}/statement"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { co_total: $.data.eligible_gain_total }
          assert:
            - "${err_gain} == ERR_INVESTOR_SCOPE_VIOLATION with HTTP 403 (not 404 — the row exists, the caller is simply not its owner)"
            - "${err_inv} == ERR_INVESTOR_SCOPE_VIOLATION with HTTP 403"
            - "${err_stmt} == ERR_INVESTOR_SCOPE_VIOLATION with HTTP 403"
            - "${err_create} == ERR_INVESTOR_SCOPE_VIOLATION with HTTP 403: an Investor may not book a gain under another investor_id, and no second EligibleGain row exists"
            - "${own_amount} == 80000.00 on the owner's own read (HTTP 200)"
            - "${co_total} == 80000.00: a ComplianceOfficer is exempt from priority 8 and reads the statement of any investor"

      - name: fund_manager_cannot_write_another_managers_fund
        claim_type: peer_roles
        grounds:
          - rbac.FundManager
          - validations[priority=9]
          - complexity_profile.role_model
          - errors[ERR_FUND_MANAGER_MISMATCH]
        distinguishing_aspect: "FundManager is an OPAQUE handle compared against Fund.manager_user_id, so peer isolation is per-fund rather than per-user-row. Priority 9 sits ahead of the certification gate (11) and the state machine (13), so mgr-fund-2 re-certifying an already SELF_CERTIFIED fund answers 403 ERR_FUND_MANAGER_MISMATCH rather than 409."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Manager One QOF", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_1: $.data.id }
            - call: "POST /qof/funds/${fund_1}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds"
              payload: { name: "Manager Two QOF", entity_type: "CORPORATION", manager_user_id: "mgr-fund-2" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_2: $.data.id }
          trigger:
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_1}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 300000.00, afs_fair_value: 300000.00 }
              as: FundManager
              as_user_id: "mgr-fund-2"
              captures: { err_asset: $.data.error_id }
            - call: "POST /qof/funds/${fund_1}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-02-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-2"
              captures: { err_certify: $.data.error_id }
            - call: "POST /qof/funds/${fund_1}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-2"
              captures: { err_test: $.data.error_id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_1}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 300000.00, afs_fair_value: 300000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
          assert:
            - "${err_asset} == ERR_FUND_MANAGER_MISMATCH with HTTP 403 and Fund.${fund_1}.aggregate_asset_basis is still 0.00"
            - "${err_certify} == ERR_FUND_MANAGER_MISMATCH with HTTP 403, NOT ERR_INVALID_STATE_TRANSITION: priority 9 precedes priority 13 even though the fund is already SELF_CERTIFIED"
            - "${err_test} == ERR_FUND_MANAGER_MISMATCH with HTTP 403 and no AssetTest row exists for Fund.${fund_1}"
            - "Last call HTTP 201 for the rightful manager: Fund.${fund_1}.aggregate_asset_basis == 300000.00 and FundAsset.${asset_id}.status == HELD"
            - "Fund.${fund_2} is untouched with certification_status == DRAFT: nothing leaked across the peer boundary"

      - name: asset_test_measure_is_shared_by_manager_and_officer
        claim_type: shared_operations
        grounds:
          - rbac.FundManager
          - rbac.ComplianceOfficer
          - endpoints[POST /qof/asset-tests/{id}/measure]
        distinguishing_aspect: "measure is a SHARED operation: both roles may run it and measured_by_user_id records whoever did, which is what makes the segregation-of-duties check at certify time meaningful. Two adjacent half-open periods are used so neither creation trips priority 21."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; both testing periods lie entirely in the past."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Shared Measure QOF", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 400000.00, afs_fair_value: 400000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-03-31T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { test_1: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_2: $.data.id }
          trigger:
            - call: "POST /qof/asset-tests/${test_1}/measure"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { st_1: $.data.status, by_1: $.data.measured_by_user_id, res_1: $.data.result }
            - call: "POST /qof/asset-tests/${test_2}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { st_2: $.data.status, by_2: $.data.measured_by_user_id, res_2: $.data.result }
            - call: "GET /qof/funds/${fund_id}/asset-tests?limit=10&offset=0"
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { listed: $.data }
          assert:
            - "Both creations succeeded: POST /qof/funds/{id}/asset-tests is shared too, and the adjacent half-open periods [2026-01-01, 2026-04-01) and [2026-04-01, 2026-07-01) do not overlap"
            - "${st_1} == MEASURED with ${by_1} == mgr-fund-1 and ${res_1} == FAIL (the only asset is CASH, so ratio_pct == 0.0000)"
            - "${st_2} == MEASURED with ${by_2} == co-measurer-1 and ${res_2} == FAIL"
            - "${listed} contains exactly two AssetTest rows, both status MEASURED, with distinct measured_by_user_id values"
            - "Neither measure call sets certified_by_user_id, and Fund.${fund_id}.compliance_posture is still UNTESTED (only certify moves the posture)"

      - name: segregation_of_duties_measure_then_certify_corner
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=10]
          - complexity_profile.role_model
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: segregation_of_duties_precedes_terminal_check
          rationale: "That §1.8 priority_pair_validation_conflict instance has one ComplianceOfficer measure a test and then certify it, asserting 403 ERR_SEGREGATION_OF_DUTIES ahead of the 409 the already-certified target would otherwise raise, and finishes with a second officer certifying successfully — the full violation-plus-satisfaction pair for priority 10 on both certify endpoints."

  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers declared in §1.0:
  # rate_threshold_triggers, cascading_side_effects, dual_variant_calculation,
  # optimistic_concurrency. Both §1.2.1 concurrency rules get a stale-version
  # instance; the cascade and dual-variant layers are §1.8 territory.
  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: deferral_election_stale_fund_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[deferral-election-create-stale-fund]
          - endpoints[POST /qof/deferral-elections]
          - errors[ERR_STALE_FUND_VERSION]
        distinguishing_aspect: "The whole point of this OCC rule is that NO state precondition can catch the second writer: two elections against the same SELF_CERTIFIED fund are both legitimate, so only the fund's version reveals that the second investor's view of deferred_gain_committed is stale. The instance also pins the version ladder 1 (create) -> 2 (self-certify) -> 3 (first election) -> 4 (second election) and shows that the REJECTED write does not bump it."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Both gains use deadline_basis SALE_DATE with realization_date 2026-07-01, so an election on 2026-08-01 lands on day 31 of 180."
          setup_api_calls:
            - call: "POST /qof/investors"
              payload: { legal_name: "OCC Investor One", taxpayer_type: "TRUST", tax_year_end_month: 12, compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_1: $.data.id }
            - call: "POST /qof/investors"
              payload: { legal_name: "OCC Investor Two", taxpayer_type: "INDIVIDUAL", compliance_attestation_status: "ATTESTED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { inv_2: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_1}", gain_character: "LONG_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_1}"
              captures: { gain_1: $.data.id }
            - call: "POST /qof/eligible-gains"
              payload: { investor_id: "${inv_2}", gain_character: "SHORT_TERM_CAPITAL", eligible_amount: 100000.00, realization_date: "2026-07-01T00:00:00Z", deadline_basis: "SALE_DATE" }
              as: Investor
              as_user_id: "${inv_2}"
              captures: { gain_2: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "OCC Ladder QOF", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id, v_create: $.data.version }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v: $.data.version }
          trigger:
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_1}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_1}"
              captures: { elec_1: $.data.id }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_2}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_2}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /qof/funds/${fund_id}"
              as: Investor
              as_user_id: "${inv_2}"
              captures: { fund_v2: $.data.version, committed_mid: $.data.deferred_gain_committed }
            - call: "POST /qof/deferral-elections"
              payload: { eligible_gain_id: "${gain_2}", fund_id: "${fund_id}", elected_amount: 100000.00, expected_fund_version: "${fund_v2}" }
              as: Investor
              as_user_id: "${inv_2}"
              captures: { elec_2: $.data.id }
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { fund_v3: $.data.version, committed_end: $.data.deferred_gain_committed }
          assert:
            - "${v_create} == 1 and ${fund_v} == 2 (self-certify is a declared write on Fund)"
            - "First election HTTP 201 with DeferralElection.${elec_1}.days_from_basis == 31 and status DEFERRED"
            - "${err_stale} == ERR_STALE_FUND_VERSION with HTTP 412 — the second investor sent expected_fund_version 2 while the fund had already advanced to 3"
            - "${fund_v2} == 3 and ${committed_mid} == 100000.00: the refused write created no DeferralElection row and did NOT bump the version"
            - "EligibleGain.${gain_2}.status is still ELIGIBLE with unelected_amount == 100000.00 after the 412"
            - "Replaying the identical payload with expected_fund_version 3 answers HTTP 201 for DeferralElection.${elec_2}"
            - "${fund_v3} == 4 and ${committed_end} == 200000.00; both elections coexist because §1.2 imposes no state precondition on a second investment"

      - name: improvement_expenditure_stale_project_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[improvement-expenditure-stale-project]
          - endpoints[POST /qof/improvement-projects/{id}/expenditures]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: "The second §1.2.1 rule guards a different parent (ImprovementProject) with a different occ_field and a different 412 id. A second expenditure on an OPEN project is always legal, so the stale reader is only detectable through expected_project_version; the refused write must leave qualified_additions_total and improvement_ratio_pct exactly where they were."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; the project window is [2026-08-01, 2029-02-01) so every spend below is inside it."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "OCC Project QOF", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-05T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_id}", window_start: "2026-08-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { proj_id: $.data.id, proj_v: $.data.version, denom: $.data.basis_at_acquisition, w_end: $.data.window_end }
          trigger:
            - call: "POST /qof/improvement-projects/${proj_id}/expenditures"
              payload: { amount: 100000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${proj_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { exp_1: $.data.id }
            - call: "POST /qof/improvement-projects/${proj_id}/expenditures"
              payload: { amount: 100000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${proj_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_stale: $.data.error_id }
            - call: "GET /qof/improvement-projects/${proj_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { proj_v2: $.data.version, total_mid: $.data.qualified_additions_total, ratio_mid: $.data.improvement_ratio_pct }
            - call: "POST /qof/improvement-projects/${proj_id}/expenditures"
              payload: { amount: 100000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${proj_v2}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { exp_2: $.data.id }
            - call: "GET /qof/improvement-projects/${proj_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { proj_v3: $.data.version, total_end: $.data.qualified_additions_total, ratio_end: $.data.improvement_ratio_pct }
          assert:
            - "${denom} == 500000.00, ${w_end} == 2029-02-01T00:00:00Z and ${proj_v} == 1"
            - "First expenditure HTTP 201 for CapitalExpenditure.${exp_1} with spend_date == 2026-08-01T00:00:00Z"
            - "${err_stale} == ERR_STALE_PROJECT_VERSION with HTTP 412 (expected_project_version 1 against a project already at 2)"
            - "${proj_v2} == 2, ${total_mid} == 100000.00 and ${ratio_mid} == 20.0000: the refused write left no CapitalExpenditure row and did not move the running total"
            - "Retrying with expected_project_version 2 answers HTTP 201 for CapitalExpenditure.${exp_2}"
            - "${proj_v3} == 3, ${total_end} == 200000.00 and ${ratio_end} == 40.0000; the project is still OPEN because 40.0000 < 100.0000"

      - name: consecutive_failed_tests_resets_after_a_certified_pass
        claim_type: rate_threshold_triggers
        grounds:
          - entities.Fund.consecutive_failed_tests
          - state_machines.Fund.certification_status
          - calculations.semiannual_asset_test_ratio
        distinguishing_aspect: "The decertification trigger is a CUMULATIVE counter with a reset: §1.1 says consecutive_failed_tests is reset to 0 by any CERTIFIED_PASS. Three certified tests in FAIL / PASS / FAIL order therefore end at 1, one short of the threshold, so the fund is NOT decertified — the reset half of the rate_threshold_triggers layer, complementary to the §1.8 chain that reaches 2 on back-to-back fails."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. The fund elects UNADJUSTED_COST_BASIS so the valuation variant cannot confound the ratios; every afs_fair_value equals the cost basis anyway. mgr-fund-1 measures, co-certifier-1 certifies (priority 10 satisfied)."
          setup_api_calls:
            - call: "POST /qof/funds"
