  - rule_id: resource_temporal_overlap
    instances:
      - name: chart_week_halfopen_adjacency
        grounds:
          - validations[priority=11]
          - entities.ChartWeek
        distinguishing_aspect: |
          Interval semantics (i): half-open [opens_at, closes_at) — strict overlap of two weeks on the same chart is rejected, but a week opening exactly at another's closes_at is adjacent and permitted; resource entity: ChartWeek windows on a Chart.
        test_recipe:
          setup:
            - "Chart C exists; week W1 [2026-09-04T00:00:00Z, 2026-09-11T00:00:00Z) already created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-OV", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-OV", title: "Singles OV", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 2, opens_at: "2026-09-11T00:00:00Z", closes_at: "2026-09-18T00:00:00Z" }
              as: ChartManager
              captures: { w2_id: $.data.id }
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 3, opens_at: "2026-09-17T00:00:00Z", closes_at: "2026-09-25T00:00:00Z" }
              as: ChartManager
              captures: { w3_err: $.data.error_id }
          assert:
            - "adjacent week (opens_at == W1.closes_at) created successfully with id ${w2_id}"
            - "overlapping week (opens_at 2026-09-17 < W2.closes_at 2026-09-18) rejected with ERR_WEEK_WINDOW_OVERLAP"

      - name: availability_window_exclusive_end
        grounds:
          - validations[priority=12]
          - entities.TitleProduct.fields.availability_policy
        distinguishing_aspect: |
          Different interval semantics (ii): title availability [available_from, available_until) with an EXCLUSIVE end tested at the week's opens_at — a title whose available_until equals the week's opens_at is out of window (opens_at < available_until fails), while one second later keeps it eligible; resource entity: TitleProduct availability window vs ChartWeek instant.
        test_recipe:
