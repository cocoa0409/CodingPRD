        claim_type: not_found
        grounds: ["errors[ERR_ENERGY_MODEL_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent model UUID yields 404 ERR_ENERGY_MODEL_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /energy-models/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert: ["HTTP 404, captured err == ERR_ENERGY_MODEL_NOT_FOUND"]

      - name: get_credit_attempt_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CREDIT_ATTEMPT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent attempt UUID yields 404 ERR_CREDIT_ATTEMPT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /credit-attempts/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert: ["HTTP 404, captured err == ERR_CREDIT_ATTEMPT_NOT_FOUND"]

      - name: get_commissioning_task_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_COMMISSIONING_TASK_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent task UUID yields 404 ERR_COMMISSIONING_TASK_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
