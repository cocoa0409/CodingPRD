              captures: { set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version: "$.data.version" }
          trigger:
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id", cycle_version: "$.data.version" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { ev1_id: "$.data[0].id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Ada Frost", home_state_code: "PA", trained_through_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visitor_id: "$.data.id" }
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version2: "$.data.version" }
            - call: "POST /accreditation/written-plans"
              payload: { camp_id: "${camp_id}", plan_type: "SUPERVISION", body_ref: "doc://sup-1", effective_date: "2026-05-01", expires_at: "2027-04-30", expected_camp_version: "${camp_version2}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { plan_id: "$.data.id" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-07", expected_cycle_version: "${cycle_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${visitor_id}", team_role: "LEAD", travel_block_start_date: "2026-08-03", travel_block_end_date: "2026-08-05" }
              as: AccreditationOfficer
