              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { err: $.data.error_id }
            - call: "POST /exposure-assessments"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", variant: "PER_VIOLATION_STACKED", expected_jurisdiction_version: "${il_v_after_patch}" }
