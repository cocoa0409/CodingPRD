      - name: scholarship_award_min_chain_evaluation_order
        grounds:
          - calculations.scholarship_award
          - state_machines.ScholarshipApplication.UNDER_REVIEW_to_APPROVED
          - entities.Program.fields.scholarship_available_cents
        distinguishing_aspect: |
          MODE (c) circular-looking dependency: the award caps against a cost basis
          that must be evaluated BEFORE the award lands on the balance and must
          exclude scholarships/late fees/fundraising credit — with provisional
          basis 203010, need 75 and policy 50%/cap 150000/fund 500000, the
          need-pct link binds: award = min(100000, round_half_up(0.75*0.5*203010)=76129,
