      - name: clinical_image_review_revision_loop_returns_to_submitted
        grounds:
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_REVISION_REQUIRED
          - state_machines.ClinicalImageReviewSubmission.status.REVISION_REQUIRED_to_SUBMITTED
          - entities.ClinicalImageReviewSubmission.fields.attempt_number
          - entities.MammographyUnit.fields.reaccreditation_attempts_remaining
          - concurrency_rules[cirs-resubmit-stale-unit]
        distinguishing_aspect: |
          CYCLIC shape on ClinicalImageReviewSubmission — a different entity from
          the parallel Exam instance: the row leaves SUBMITTED for
          REVISION_REQUIRED and comes back to the SAME state SUBMITTED, and the
          loop is bounded not by the state graph but by the unit's monotonically
          decreasing reaccreditation_attempts_remaining, which goes 3 -> 2 on the
          first submission and 2 -> 1 on the resubmission while attempt_number
          climbs 1 -> 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit (accreditation_expires_on 2027-06-30), qualified staff."
            - "The facility is funded with 1000000 cents of prepaid credit."
            - "Two SCREENING exams on the unit, both interpreted to report_status INTERPRETED_FINAL."
            - "A clinical image packet of those two exams was submitted (attempt 1) and the accreditation body returned REVISION_REQUIRED."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - &c_fund
              call: "POST /facilities/${fac_id}/funding-deposits"
              payload: { amount_cents: 1000000, memo: "Accreditation application fees" }
