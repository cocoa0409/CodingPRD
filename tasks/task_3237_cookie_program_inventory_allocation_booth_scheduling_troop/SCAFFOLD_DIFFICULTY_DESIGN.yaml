              as: CouncilAdmin
              captures: { slot_touch: $.data.id }
            - call: "POST /cookie-program/booth-slots"
              payload: { location_id: "${loc1}", start_at: "2027-02-10T15:00:00Z", end_at: "2027-02-10T17:00:00Z", capacity_troops: 1 }
              as: CouncilAdmin
              captures: { slot_overlap_err: $.data.error_id }
          assert:
            - "slot_touch is created (201; touching boundary 16:00 == 16:00 allowed under half-open semantics)"
            - "slot_overlap_err == ERR_BOOTH_CONFLICT (15:00-17:00 strictly overlaps 14:00-16:00)"

      - name: site_capacity_aggregate_overlap_semantics
        grounds:
          - validations[priority=11]
          - entities.DistributionSite.fields.capacity_units
          - state_machines.BakerPurchaseOrder.ORDERED_to_PARTIALLY_DELIVERED
        distinguishing_aspect: |
          Resource = DistributionSite; semantics = AGGREGATE CAPACITY (not
          interval adjacency): deliveries from multiple POs accumulate against
          capacity_units; a delivery that would push received_units +
          delivered_now beyond capacity is rejected even though it is not a
          time interval at all — different interval semantics than the
          half-open booth rule and a different resource entity. Boundary:
          received 90 + delivery 10 == capacity 100 ALLOWED; +11 rejected.
        test_recipe:
          setup:
            - "Season OPEN; site capacity 100; PO-A quantity 90 placed; PO-B quantity 20 placed; PO-A fully delivered (received 90)"
          setup_api_calls:
