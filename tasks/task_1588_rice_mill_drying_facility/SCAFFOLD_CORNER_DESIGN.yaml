              captures: { l1: $.data.id }
            - call: "POST /mill/lots"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", source: "CONTRACT", contract_id: "${c_id}", expected_contract_version: "${cv1}", gross_weight_lbs: 22000, tare_weight_lbs: 12000, scheduled_date: "2026-08-11", moisture_pct_handheld: 13.0 }
              as: ScaleOperator
              captures: { err: $.data.error_id }
            - call: "GET /mill/contracts/${c_id}"
              as: ScaleOperator
              captures: { cv2: $.data.version }
            - call: "POST /mill/lots"
