  - rule_id: compensating_invariant
    instances:
      - name: rescue_dose_reservation_released_whole_on_undosed_abort_then_spent_on_dosed_abort
        grounds:
          - calculations.challenge_pc20_and_rescue_ledger
          - state_machines.ChallengeRun.ARMED_to_ABORTED_SAFETY
          - state_machines.ChallengeRun.IN_PROGRESS_to_ABORTED_SAFETY
          - entities.RescueMedicationLot.fields.doses_reserved
          - entities.RescueMedicationLot.fields.doses_remaining
        distinguishing_aspect: |
          The two ledger invariants (I1 doses_remaining + sum(rescue_doses_administered) ==
          doses_at_receipt, I2 doses_reserved == 4 * count of ARMED/IN_PROGRESS runs) are restored by two
          different compensations on the same lot: aborting RUN-1 at current_step_index 0 releases the
          reservation whole and leaves doses_remaining at 10 and the session untouched, while aborting RUN-2
          after one dose converts the reservation into a spend (doses_remaining 6) and additionally aborts
          the session - so the compensation is conditional on the run's own step counter.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "order ORD-1 is ASTHMA_DIAGNOSIS / ROUTINE_CLINICAL with challenge_type METHACHOLINE and is IN_TESTING"
            - "session SESS-1 is IN_PROGRESS with three ACCEPTABLE PRE_BD maneuvers, best_fev1_l 2.400 and fev1_pct_predicted 60.0"
            - "rescue lot L-2026-08 was received with 10 doses, expires 2026-12-31 and starts at doses_remaining 10 / doses_reserved 0"
            - "challenge run RUN-1 is ARMED against that lot and has recorded no step, so the lot reads doses_remaining 10 / doses_reserved 4"
