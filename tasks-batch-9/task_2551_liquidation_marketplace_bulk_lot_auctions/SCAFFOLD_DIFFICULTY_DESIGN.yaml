  # ===========================================================================
  # Rule 8 - resource/temporal overlap with different interval semantics
  #   instance 1: Warehouse dock door - buffer-padded half-open interval geometry
  #   instance 2: Carrier - per-UTC-calendar-date counting, no geometry at all
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: dock_door_conflict_uses_buffer_padded_half_open_windows
        grounds:
          - calculations.dock_door_assignment
          - validations[priority 13 -> ERR_DOCK_CAPACITY_EXHAUSTED]
          - errors[ERR_DOCK_CAPACITY_EXHAUSTED]
          - entities.Warehouse.fields.turnaround_buffer_minutes
          - entities.PickupAppointment.fields.dock_door_number
          - endpoints[POST /liquidation/sale-orders/{id}/pickup-appointments]
        distinguishing_aspect: |
          The contended resource is a dock door and the semantics are geometric: windows are
          half-open, but each is padded by turnaround_buffer_minutes, so back-to-back requests are NOT
          compatible. Against a booked [14:00, 15:00) on the warehouse's only door, [15:00, 16:00) is
          rejected (15:00 < 15:00 + 15 min) while [15:15, 16:15) is accepted because the strict <
          comparison is false at exactly one buffer's distance. A naive half-open overlap test admits
          the first request; a >= comparison rejects the second.
        test_recipe:
          setup:
            - "Seller, warehouse with dock_door_count 1 and turnaround_buffer_minutes 15, carrier with daily_pickup_capacity 5, one QUALIFIED buyer with a 10,000,000-cent limit."
            - "Two FIXED_PRICE lots at that warehouse, each one ACTIVE line 50 x 20000 at ask_price_cents 1000000, both OPEN over [2026-08-05T00:00:00Z, 2026-08-20T00:00:00Z)."
            - "At 2026-08-05T01:00:00Z the buyer buys both lots (each order total_due_cents 1148500, pickup_deadline_at 2026-08-15T01:00:00Z) and pays both in full."
            - "Order A books the only door for [2026-08-10T14:00:00Z, 2026-08-10T15:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
