            - call: "POST /v1/work-items/${rw_id}/complete"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/warranty-claims/${cl_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { cl_final: $.data.status }
          assert:
            - "captured cl_status == ACCEPTED and rw_id is set"
            - "captured rw_total == 0 and rw_kind == WARRANTY_REWORK"
            - "captured price_after_accept == 100000 (unchanged — yard absorbs rework cost)"
            - "captured cl_final == CLOSED (auto-transition fired by the rework item completing, on a DELIVERED project per the start-gate exception)"

  # ===================================================================
  # Section: errors
  # ===================================================================
  - section: errors
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["one dock exists"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
          trigger:
            - call: "GET /v1/docks/${dock_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_UNAUTHENTICATED (request sent with no X-User-Role / X-User-ID headers)"
      - name: survey_result_deficiency_discipline
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SURVEY_RESULT_INVALID]"]
        distinguishing_aspect: "FAILED without deficiency_count and PASSED with deficiency_count 1 both violate the result discipline and return ERR_SURVEY_RESULT_INVALID (422); the survey stays SCHEDULED."
        test_recipe:
          setup: ["DRAFT project; two SCHEDULED surveys by sv_1 on disjoint windows"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "CLASS_INTERMEDIATE", scheduled_start_utc: "2026-08-04T09:00:00Z", scheduled_end_utc: "2026-08-04T10:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s1: $.data.id }
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "LOAD_LINE", scheduled_start_utc: "2026-08-05T09:00:00Z", scheduled_end_utc: "2026-08-05T10:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /v1/surveys/${s1}/record-result"
              payload: { result: "FAILED" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { err1: $.data.error_id }
            - call: "POST /v1/surveys/${s2}/record-result"
              payload: { result: "PASSED", deficiency_count: 1 }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { err2: $.data.error_id }
            - call: "GET /v1/surveys/${s1}"
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s1_status: $.data.status }
          assert:
            - "captured err1 == ERR_SURVEY_RESULT_INVALID (FAILED requires deficiency_count >= 1)"
            - "captured err2 == ERR_SURVEY_RESULT_INVALID (PASSED forbids deficiency_count > 0)"
            - "captured s1_status == SCHEDULED (rejected recordings leave state untouched)"
      - name: hot_work_permit_conflict_on_touching_days
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_HOT_WORK_PERMIT_CONFLICT]", state_machines.Permit.APPLIED_to_GRANTED]
        distinguishing_aspect: "Closed day-interval semantics on the dock's hot-work calendar: a second GRANT covering 2026-08-10..2026-08-15 touches the existing 2026-08-01..2026-08-10 grant on the shared day 08-10 and conflicts; a disjoint 08-11..08-15 window grants cleanly."
        test_recipe:
          setup: ["two projects pinned to the same dock; project 1 holds a GRANTED HOT_WORK permit for 2026-08-01..2026-08-10; project 2 has two APPLIED permits: [08-10..08-15] and [08-11..08-15]"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
