# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3204
# Playlist Editorial Pitching & Algorithmic Promotion Trade-Offs
# 9 rules x 2 instances = 18 instances. All literals pre-computed.
# Common setup anchor: clock default 2026-09-01T00:00:00Z unless a chain sets it.
# Release dates are always set >= 14 days out so the pitch window
# (MIN_PITCH_LEAD_DAYS = 7) is open.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_pool_gross_vs_effective_share_divergence
        grounds:
          - calculations.royalty_pool_share
          - entities.RoyaltyStatement.fields.share_bps
          - entities.RoyaltyPeriod.fields.closed_variant
        distinguishing_aspect: |
          Royalty share on RoyaltyStatement: identical stream data closed under
          variant GROSS yields share_bps 6000/2000/2000, while variant
          EFFECTIVE — which weights the enrolled artist's discounted stream at
          0.5 — yields 5556/2222/2222 and moves 4440 cents of payout off the
          enrolled artist. This instance lives in the royalty-ledger domain;
          its sibling lives in the fraud-scoring domain.
        test_recipe:
          setup:
            - "Three artists A, B, C each with one LIVE release and one AVAILABLE focus track."
            - "Track A1 enrolled in promotion with discount_factor 0.5 over [2026-09-10T00:00:00Z, 2026-09-20T00:00:00Z)."
            - "OPEN period P [2026-09-01T00:00:00Z, 2026-09-30T00:00:00Z) with pool_cents 100000."
            - "Streams: A1 enrolled-window stream (0.5), A1 organic stream, A1 algorithmic stream; B1 one organic stream; C1 two organic streams of which exactly one is tainted by a CONFIRMED fraud case before close."
            - "Counted numerators: A raw 3 / effective 2.5; B 1 / 1.0; C 1 / 1.0."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "Artist A", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_a: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "Artist B", primary_genre: "ROCK", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_b: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "Artist C", primary_genre: "JAZZ", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_c: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_a}", title: "RA", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["POP"], mood_tags: ["CHILL"] }
              as: RightsHolder
              as_user_id: "${art_a}"
              captures: { rel_a: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_b}", title: "RB", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["ROCK"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_b}"
              captures: { rel_b: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_c}", title: "RC", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["JAZZ"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_c}"
              captures: { rel_c: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_a}", title: "TA1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_a}"
              captures: { trk_a: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_b}", title: "TB1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_b}"
              captures: { trk_b: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_c}", title: "TC1", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_c}"
              captures: { trk_c: $.data.id }
            - call: "POST /catalog/promotions"
              payload: { track_id: "${trk_a}", discount_factor: 0.5, starts_on: "2026-09-10T00:00:00Z", ends_on: "2026-09-20T00:00:00Z" }
              as: RightsHolder
              as_user_id: "${art_a}"
              captures: { promo_a: $.data.id }
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", pool_cents: 100000 }
              as: PlatformAdmin
              captures: { per_id: $.data.id, per_v: $.data.version }
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_a}", territory: "US", source: "ALGORITHMIC", occurred_on: "2026-09-15T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_a}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-16T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_a}", territory: "US", source: "EDITORIAL_PLAYLIST", occurred_on: "2026-09-17T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_b}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-15T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_c}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-15T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
              captures: { stream_c1: $.data.id }
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_c}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-16T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_c}", window_start: "2026-09-16T00:00:00Z", window_end: "2026-09-17T00:00:00Z", signal_bot_ratio: 0.9, signal_velocity_zscore: 0.9, signal_device_concentration: 0.8 }
              as: FraudAnalyst
              captures: { fc_c: $.data.id }
            - call: "POST /catalog/fraud-cases/${fc_c}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/royalty-periods/${per_id}/close"
              payload: { variant: "GROSS", expected_period_version: "${per_v}" }
              as: PlatformAdmin
            - call: "GET /catalog/royalty-statements"
              payload: { period_id: "${per_id}" }
              as: PlatformAdmin
          assert:
            - "GROSS close yields exactly 3 RoyaltyStatement rows"
            - "statement(Artist.${art_a}): raw_streams == 3, effective_streams == 2.50, share_bps == 6000, gross_payout_cents == 60000"
            - "statement(Artist.${art_b}): raw_streams == 1, share_bps == 2000, gross_payout_cents == 20000"
            - "statement(Artist.${art_c}): raw_streams == 1, share_bps == 2000, gross_payout_cents == 20000"
            - "RoyaltyPeriod.${per_id}.closed_variant == GROSS"
            - "counterfactual recomputation under EFFECTIVE (denominator 4.5) gives share_bps 5556/2222/2222 and gross_payout_cents 55560/22220/22220 — the enrolled discount moves exactly 4440 cents off Artist A; the closed period must NOT show these values"
            - "FraudCase.${fc_c}.clawback_cents == 0.60 (one tainted organic stream at rate 1.0 x 0.40 is 0.40; the enrolled-window stream is outside the case window)"

      - name: fraud_confidence_manual_vs_auto_flag_path_divergence
        grounds:
          - calculations.fraud_confidence_score
          - state_machines.FraudCase.OPEN_to_AUTO_FLAGGED
          - entities.FraudCase.fields.confidence_score
        distinguishing_aspect: |
          FraudCase verdict derivation: identical signal structure, two valid
          magnitudes produce different initial verdicts — signals 0.9/0.9/0.8
          compute confidence 0.8750 >= 0.7000 so the case is created
          AUTO_FLAGGED, while signals 0.5/0.5/0.5 compute 0.5000 < 0.7000 so
          the case is created OPEN. Same formula, different control path; this
          instance lives in the fraud domain, not the royalty-ledger domain.
        test_recipe:
          setup:
            - "Artist with a LIVE release and AVAILABLE track T."
            - "An OPEN royalty period covering 2026-09 so fraud-case creation is unremarkable."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "Fraud Target", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_f: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_f}", title: "RF", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_f}"
              captures: { rel_f: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_f}", title: "TF", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_f}"
              captures: { trk_f: $.data.id }
          trigger:
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_f}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-16T00:00:00Z", signal_bot_ratio: 0.9, signal_velocity_zscore: 0.9, signal_device_concentration: 0.8 }
              as: FraudAnalyst
              captures: { fc_hi: $.data.id }
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_f}", window_start: "2026-09-16T00:00:00Z", window_end: "2026-09-17T00:00:00Z", signal_bot_ratio: 0.5, signal_velocity_zscore: 0.5, signal_device_concentration: 0.5 }
              as: FraudAnalyst
              captures: { fc_lo: $.data.id }
          assert:
            - "FraudCase.${fc_hi}.confidence_score == 0.8750 and verdict == AUTO_FLAGGED"
            - "FraudCase.${fc_lo}.confidence_score == 0.5000 and verdict == OPEN"
            - "both cases were derived by the same fraud_confidence_score formula; only the 0.7000 threshold routes them onto different state-machine paths"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: editorial_boost_tier_multiplier_with_cap_and_floor
        grounds:
          - calculations.editorial_boost_score
          - entities.Artist.fields.follower_count
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: save_rate,
          completion_rate and skip_rate combine linearly but the result is then
          scaled by a follower-tier branch (0.8/1.0/1.2), clamped by an
          inclusive min cap at BOOST_CAP and floored at 0; a COLD_START variant
          halves the result. The four rollups below pin the tier branch, the
          halving variant, and the negative-raw floor.
        test_recipe:
          setup:
            - "Artist LOW with follower_count 5000 (tier multiplier 0.8) and artist BIG with follower_count 200000 (tier multiplier 1.2), each with a LIVE release and AVAILABLE focus track."
            - "LOW's track has an ACTIVE placement during the rollup window; BIG's tracks have no placement (COLD_START applies to one rollup)."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "Low", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_low: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "Big", primary_genre: "POP", home_territory: "US", follower_count: 200000 }
              as: PlatformAdmin
              captures: { art_big: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_low}", title: "RL", release_type: "SINGLE", release_date: "2026-09-15T00:00:00Z", genre_tags: ["POP"], mood_tags: ["CHILL"] }
              as: RightsHolder
              as_user_id: "${art_low}"
              captures: { rel_low: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_big}", title: "RB", release_type: "SINGLE", release_date: "2026-09-15T00:00:00Z", genre_tags: ["POP"], mood_tags: ["CHILL"] }
              as: RightsHolder
              as_user_id: "${art_big}"
              captures: { rel_big: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_low}", title: "TL", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_low}"
              captures: { trk_low: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_big}", title: "TB", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_big}"
              captures: { trk_big: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Fresh Pop", genre_focus: "POP", mood_focus: "ANY", slot_count: 3, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_pop: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_low}", pitch_text: "a pitch", target_playlist_id: "${pl_pop}" }
              as: RightsHolder
              as_user_id: "${art_low}"
              captures: { pit_low: $.data.id }
            - call: "POST /catalog/pitches/${pit_low}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_low}/decide"
              payload: { decision: "ACCEPT" }
              as: EditorialLead
              captures: { pit_acc: $.data.id }
            - call: "GET /catalog/placements"
              payload: { pitch_id: "${pit_low}" }
              as: EditorialLead
              captures: { plc_low: "$.data[0].id" }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/placements/${plc_low}/activate"
              payload: {}
              as: PlaylistEditor
          trigger:
            - call: "POST /catalog/tracks/${trk_low}/signal-rollup"
              payload: { window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-22T00:00:00Z", save_rate: 0.5, completion_rate: 0.4, skip_rate: 0.1 }
              as: PlatformAdmin
              captures: { boost_low: $.data.boost_score }
            - call: "POST /catalog/tracks/${trk_big}/signal-rollup"
              payload: { window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-22T00:00:00Z", save_rate: 0.5, completion_rate: 0.4, skip_rate: 0.1 }
              as: PlatformAdmin
              captures: { boost_big_cold: $.data.boost_score }
            - call: "POST /catalog/tracks/${trk_big}/signal-rollup"
              payload: { window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-22T00:00:00Z", save_rate: 0.0, completion_rate: 0.0, skip_rate: 0.9 }
              as: PlatformAdmin
              captures: { boost_neg: $.data.boost_score }
          assert:
            - "boost_low == 28  (raw 35 x tier 0.8 = 28.0, STANDARD variant)"
            - "boost_big_cold == 21  (raw 35 x tier 1.2 = 42 STANDARD, COLD_START halves to 21)"
            - "boost_neg == 0  (raw -18 is floored at 0, never negative)"
            - "the same rates (0.5/0.4/0.1) score 28 for the 0.8-tier track and 42-before-halving for the 1.2-tier track — the tier branch is a multiplicative, non-linear interaction"

      - name: royalty_waterfall_per_artist_floor_then_remainder
        grounds:
          - calculations.royalty_pool_share
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins
          per-artist floor FIRST and a remainder waterfall SECOND (one cent at a
          time, share_bps DESC then Artist.created_at ASC). With pool 77777 and
          raw streams 5/5 the tie both at share 5000 resolves to the earlier-
          created artist: 38889 vs 38888; sum-then-round or largest-remainder
          rules would give different cents. Distinct mode from the tiered
          editorial_boost instance.
        test_recipe:
          setup:
            - "Artists D (created first) and E (created second), each with a LIVE release and focus track."
            - "D's track enrolled at discount_factor 0.5 for the whole window; 5 streams each side, all inside the window."
            - "OPEN period [2026-09-01, 2026-10-01) with pool_cents 77777; clock advanced to 2026-10-01."
            - "Numerators: GROSS raw 5/5 (tie), EFFECTIVE 2.5/5.0."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "D", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_d: $.data.id }
            - call: "POST /catalog/artists"
              payload: { stage_name: "E", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_e: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_d}", title: "RD", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_d}"
              captures: { rel_d: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_e}", title: "RE", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_e}"
              captures: { rel_e: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_d}", title: "TD", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_d}"
              captures: { trk_d: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_e}", title: "TE", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_e}"
              captures: { trk_e: $.data.id }
            - call: "POST /catalog/promotions"
              payload: { track_id: "${trk_d}", discount_factor: 0.5, starts_on: "2026-09-10T00:00:00Z", ends_on: "2026-09-25T00:00:00Z" }
              as: RightsHolder
              as_user_id: "${art_d}"
            - call: "POST /catalog/royalty-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", pool_cents: 77777 }
              as: PlatformAdmin
              captures: { per2_id: $.data.id, per2_v: $.data.version }
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_d}", territory: "US", source: "ALGORITHMIC", occurred_on: "2026-09-11T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_d}", territory: "US", source: "ALGORITHMIC", occurred_on: "2026-09-12T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_d}", territory: "US", source: "ALGORITHMIC", occurred_on: "2026-09-13T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_d}", territory: "US", source: "ALGORITHMIC", occurred_on: "2026-09-14T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_d}", territory: "US", source: "ALGORITHMIC", occurred_on: "2026-09-15T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_e}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-11T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_e}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-12T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_e}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-13T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_e}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-14T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_e}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-15T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/royalty-periods/${per2_id}/close"
              payload: { variant: "GROSS", expected_period_version: "${per2_v}" }
              as: PlatformAdmin
          assert:
            - "GROSS share_bps: D == 5000, E == 5000 (tie at 5/5 raw)"
            - "per-artist floor gives 38888 + 38888 = 77776, remainder 1 goes to D (earlier created_at): gross_payout_cents D == 38889, E == 38888"
            - "sum(D,E) == 77777 == pool_cents exactly — the waterfall never loses a cent"
            - "counterfactual EFFECTIVE close would give share_bps 3333/6667 and payouts 25923/51854 — the pinned variant is what the statements show"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pitch_revision_cycle_loops_back_to_pitched
        grounds:
          - state_machines.PitchSubmission.NEEDS_REVISION_to_PITCHED
          - state_machines.PitchSubmission.UNDER_REVIEW_to_NEEDS_REVISION
          - entities.PitchSubmission.fields.revision_round
        distinguishing_aspect: |
          PitchSubmission is cyclic: UNDER_REVIEW -> NEEDS_REVISION -> PITCHED
          -> UNDER_REVIEW loops with revision_round incrementing per cycle and
          a hard cap MAX_REVISION_ROUNDS == 2, after which the revise
          transition no longer exists from NEEDS_REVISION. This is a cycle on
          PitchSubmission; the sibling cycle lives on PlaylistPlacement.
        test_recipe:
          setup:
            - "Artist with SCHEDULED release (date 2026-09-20) and focus track; playlist Fresh Pop (EDITORIAL_A); pitch submitted at clock 2026-09-01 (19 days lead)."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "Cyc", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_cy: $.data.id }
