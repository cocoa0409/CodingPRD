        claim_type: immediate
        grounds: [state_machines.MediationSession.IN_SESSION_to_FULL_AGREEMENT, entities.Case.fields.status]
        excluded_because:
          difficulty_instance: transitive_cascade / full_agreement_cascade_plan_support_case_depth3
          rationale: "The depth-3 cascade instance already asserts that ParentingPlan ADOPTED and Case AWAITING_JUDGMENT are observable immediately after the FULL_AGREEMENT conclude response, which is exactly the immediate-consistency claim."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: serve_answer_marks_petition_answered_excluded
        claim_type: Side Effect Execution
        grounds: [state_machines.Pleading.SERVED_to_ANSWERED, state_machines.Case.AWAITING_RESPONSE_to_CONTESTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / answer_serve_requires_petition_served
          rationale: "The positive ANSWER-serve path (which moves the case to CONTESTED and the petition to ANSWERED) is the satisfied branch of the petition-served dependency instance and is exercised in multiple §1.8 setup chains."
