              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${grower_id}"
            # P1 claim REPORTED
            - call: "POST /carriers/${carrier_id}/policies/${p1}/claims"
              payload: { coverage_unit_id: "${p1_cu}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { p1_claim: $.data.id }
            # P2 claim moved to INSPECTION_SCHEDULED
            - call: "POST /carriers/${carrier_id}/policies/${p2}/claims"
              payload: { coverage_unit_id: "${p2_cu}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { p2_claim: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${p2}/claims/${p2_claim}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
          trigger:
            - call: "POST /carriers/${carrier_id}/growers/${grower_id}/debar"
              payload: {}
              as: Underwriter
          assert:
            - "Grower.${grower_id}.status == DEBARRED"
            - "Policy.${p1}.lifecycle_state == CANCELLED"
            - "Policy.${p2}.lifecycle_state == CANCELLED"
            - "Claim.${p1_claim}.claim_state == WITHDRAWN"
            - "Claim.${p2_claim}.claim_state == WITHDRAWN"
            - "CoverageUnit.${p1_cu}.status == LAPSED_REPORT OR REPORTED (post-expire cascade)"
            - "CoverageUnit.${p2_cu}.status == LAPSED_REPORT OR REPORTED"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict on DIFFERENT error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: auth_role_trumps_state_policy_bind
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - state_machines.Policy.APPLICATION_to_BOUND
        distinguishing_aspect: |
          Pair = auth (priority 2) vs state (priority 4). A caller with the
          WRONG role attempts to bind a policy whose state is also wrong
          (already BOUND). The auth error must win because it has higher
          priority.
        test_recipe:
          setup:
            - "Carrier; grower; rate; policy already BOUND"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-I", legal_name: "Carrier I", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower I", tax_id_last4: "4444", email: "i@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
          trigger:
            # Wrong role (Policyholder) AND wrong state (already BOUND). Auth must win.
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS   (auth wins over state)"

      - name: temporal_loss_date_trumps_referential_adjuster_county
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          Different pair: business_temporal (priority 8, loss-date-out-of-
          coverage) vs business_referential (priority 11, adjuster county
          mismatch). Here the same claim-creation request violates BOTH; the
          earlier-priority (temporal) must win. NOTE: this conflict is realized
          because claim creation (POST /claims) checks loss_date; adjuster
          county is checked on assign-adjuster, NOT at claim creation. So to
          realize a true same-request conflict, we instead use the request
          `POST /claims` where coverage_unit_id references a unit whose Policy
          is INACTIVE for the loss_date AND the grower's reported acres mismatch.
          Simpler: use the determinations endpoint where temporal (loss_date
          out-of-coverage) and referential (adjuster county) are checked
          together — but per scaffold, only the segregation check and
          ERR_DOCS_INCOMPLETE apply at determinations. To keep the pair clean
          we pick a different endpoint pair: POST /claims (loss_date) vs the
          assign-adjuster chain.
        test_recipe:
          setup:
            - "Carrier; grower; PUBLISHED rate; BOUND+ACTIVE+PAID policy; CU REPORTED"
            - "Adjuster whose county_codes does NOT include '06001'"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-J", legal_name: "Carrier J", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower J", tax_id_last4: "6666", email: "j@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj J", license_number: "ADJ-J-1", county_codes: ["99999"], species_qualified: [], capacity_max_open_claims: 5 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { cu_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 1332 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_id}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 1 }
              as: Policyholder
              as_user_id: "${grower_id}"
          trigger:
            # Try to file a claim with loss_date out of coverage — temporal error (priority 8)
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2027-01-15T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOSS_DATE_OUT_OF_COVERAGE"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check on DIFFERENT metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: high_risk_surcharge_threshold_inclusive_boundary
        grounds:
          - calculations.high_risk_surcharge_tier
          - entities.Policy.fields.high_risk_surcharge_pct
        distinguishing_aspect: |
          Metric = prior_claims_count threshold; endpoint = POST /policies.
          Boundary is INCLUSIVE: prior_claims_count == 2 yields 10% surcharge;
          == 1 yields 0%. We pin both sides via two separate growers.
        test_recipe:
          setup:
            - "Carrier; rate; TWO growers G1 (claims=1) and G2 (claims=2)"
            - "Drive claims counts via full claim cycles on prior policies"
