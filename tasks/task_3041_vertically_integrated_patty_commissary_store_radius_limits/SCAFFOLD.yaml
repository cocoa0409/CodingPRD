# =============================================================================
# PRD Benchmark Scaffold (v1)
# Task: task_3041_vertically_integrated_patty_commissary_store_radius_limits
# =============================================================================

scenario: |
  Vertically Integrated Patty Commissary & Store Radius Limits (In-N-Out Burger):
  company-owned commissary producing patties, produce prep and buns for a bounded
  delivery radius, store expansion constrained by commissary distance limits and
  refrigerated delivery frequency, no-freezer store design forcing daily or
  near-daily delivery, fixed limited menu with an unlisted variation set handled
  by register modifiers, associate wage and promotion ladder with internal-only
  management sourcing, supplier beef sourcing with dedicated processing and
  quality specifications, new commissary siting decisions gating regional entry,
  demand surge handling at new-store openings with temporary queue management.

domain_name: patty-commissary
api_prefix: /v1

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_actions
    - cascading_side_effects
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - cross_aggregate
    - self_referential
    - one_to_many
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BeefSupplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Unique supplier code (e.g. RANCH-01)", constraints: "unique across all BeefSupplier rows" }
      - { name: spec_profile, type: object, source: input, description: "Quality specification profile", constraints: "must contain numeric keys lean_point_pct, max_fat_pct, max_bacterial_count_cfu_g, chilled_never_frozen (boolean)" }
      - { name: audit_frequency_days, type: integer, source: input, description: "Maximum days allowed between passed audits" }
      - { name: days_since_last_passed_audit, type: integer, source: system, description: "Integer calendar-day distance from the most recent PASS Audit.completed_at to the logical clock; initialized to 0 at supplier creation; recomputed by record-audit and on reads that consult eligibility" }
      - { name: status, type: enum, source: system, description: "PROBATION | APPROVED | SUSPENDED | RETIRED (see state machine)" }

  - name: Audit
    parent: BeefSupplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> BeefSupplier.id; supplier under audit" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned audit day (ISO8601)" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp when the audit result was recorded; null until recorded" }
      - { name: result, type: enum, source: system, description: "PASS | FAIL; null until recorded", default: null }
      - { name: findings, type: string, source: input, description: "Free-text findings recorded with the result", default: "" }
      - { name: recorded_by_id, type: string, source: system, description: "X-User-ID of the QualityAuditor who recorded the result; used for segregation-of-duties checks" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RECORDED | CANCELLED" }

  - name: Commissary
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Commissary name" }
      - { name: lat, type: number, source: input, description: "Latitude (decimal degrees)" }
      - { name: lng, type: number, source: input, description: "Longitude (decimal degrees)" }
      - { name: radius_limit_km, type: number, source: input, description: "Hard delivery-radius limit; store sites beyond this are rejected" }
      - { name: daily_patty_capacity, type: integer, source: input, description: "Patties the plant can grind/form per production day" }
      - { name: daily_bun_capacity, type: integer, source: input, description: "Buns the bakery line can bake per production day" }
      - { name: daily_produce_capacity, type: integer, source: input, description: "Produce prep units (lettuce/tomato/onion kits) per production day" }
      - { name: raw_beef_lbs_on_hand, type: number, source: computed, description: "Current raw-beef inventory in pounds; credited by confirm-receiving, debited by plan-production" }
      - { name: delivery_days_mask, type: array, source: input, description: "Array of 7 booleans indexed by weekday (0=Monday..6=Sunday); true on days the commissary runs refrigerated delivery routes" }
      - { name: regional_entry_open, type: boolean, source: computed, description: "True once the commissary reaches OPERATIONAL; gates store-site creation" }
      - { name: supplier_id, type: string, source: input, description: "FK -> BeefSupplier.id; dedicated beef supplier for this commissary" }
      - { name: status, type: enum, source: system, description: "PLANNING | BUILDING | OPERATIONAL | DECOMMISSIONED" }

  - name: Truck
    parent: Commissary
    common_fields: true
    fields:
      - { name: commissary_id, type: string, source: input, description: "FK -> Commissary.id; home commissary of the truck" }
      - { name: plate, type: string, source: input, description: "License plate", constraints: "unique among Trucks whose status is ACTIVE" }
      - { name: route_type, type: enum, source: input, description: "PRIMARY or RESERVE; RESERVE trucks may be activated only during OPENING_SURGE mode" }
      - { name: cooler_capacity_cases, type: integer, source: input, description: "Total refrigerated case capacity of the truck" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: DeliveryRoute
    parent: Commissary
    common_fields: true
    fields:
      - { name: commissary_id, type: string, source: input, description: "FK -> Commissary.id; commissary the route departs from" }
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id; truck assigned to the route" }
      - { name: service_date, type: datetime, source: input, description: "Calendar day the route serves (ISO8601 date at 00:00:00Z)" }
      - { name: store_ids, type: array, source: input, description: "Ordered array of Store.id values the route visits (the stop sequence)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | COMPLETED | CANCELLED" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Menu SKU", constraints: "unique across all MenuItem rows" }
      - { name: name, type: string, source: input, description: "Menu item name (fixed limited menu)" }
      - { name: base_price_cents, type: integer, source: input, description: "Listed base price in cents" }
      - { name: patty_count, type: integer, source: input, description: "Base patties per unit before modifiers" }
      - { name: produce_units, type: integer, source: input, description: "Base produce prep units per unit before modifiers" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the item is currently sellable" }

  - name: Store
    parent: Commissary
    common_fields: true
    fields:
      - { name: commissary_id, type: string, source: input, description: "FK -> Commissary.id; the single commissary allowed to supply this store" }
      - { name: name, type: string, source: input, description: "Store name" }
      - { name: lat, type: number, source: input, description: "Latitude (decimal degrees)" }
      - { name: lng, type: number, source: input, description: "Longitude (decimal degrees)" }
      - { name: distance_km, type: number, source: computed, description: "Haversine great-circle distance from the assigned commissary, rounded to 3 decimals; the radius-limit check compares against the RAW haversine value (see calculation store_radius_check)" }
      - { name: opening_mode, type: enum, source: system, description: "NORMAL | OPENING_SURGE", default: NORMAL }
      - { name: surge_day_index, type: integer, source: computed, description: "1-based calendar-day index inside the surge window; null when opening_mode is NORMAL; floor(clock_day - surge_start_day) + 1 while surging" }
      - { name: surge_start_date, type: datetime, source: system, description: "First calendar day of the opening surge window; set by begin-opening-surge; null otherwise" }
      - { name: surge_end_date, type: datetime, source: system, description: "Last calendar day of the surge window (inclusive); surge_start_date + SURGE_WINDOW_DAYS - 1" }
      - { name: manager_associate_id, type: string, source: input, description: "FK -> Associate.id; the store manager; when non-null it MUST reference an Associate whose current_level is MANAGER; nullable while SITE_REVIEW (bootstrap), MUST be non-null before approval", default: null }
      - { name: staffing_posture, type: enum, source: computed, description: "STEADY | STRAINED | CRITICAL; derived from active crew composition (see staffing_posture calculation); gates scheduling actions, it is not itself a state-machine state" }
      - { name: status, type: enum, source: system, description: "SITE_REVIEW | APPROVED | OPEN | CLOSED" }

  - name: DeliveryBatch
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; receiving store" }
      - { name: commissary_id, type: string, source: system, description: "FK -> Commissary.id; copied from Store.commissary_id at creation" }
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id; run that produced the goods; null until the batch is loaded" }
      - { name: route_id, type: string, source: system, description: "FK -> DeliveryRoute.id; route carrying the batch; null until the batch is loaded" }
      - { name: delivery_date, type: datetime, source: input, description: "Calendar day of delivery (ISO8601 date at 00:00:00Z)" }
      - { name: patty_count, type: integer, source: input, description: "Patties in the batch" }
      - { name: bun_count, type: integer, source: input, description: "Buns in the batch" }
      - { name: produce_units, type: integer, source: input, description: "Produce prep units in the batch" }
      - { name: cooler_cases_required, type: integer, source: computed, description: "Truck cooler cases consumed by this batch (see cooler_cases calculation)" }
      - { name: gap_hours_at_load, type: number, source: computed, description: "Hours between the previous DELIVERED batch's delivered_at for this store and this batch's delivery_date 00:00Z; null for the store's first loaded batch" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOADED | DELIVERED | CANCELLED" }

  - name: Order
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store where the order is placed" }
      - { name: placed_by_associate_id, type: string, source: input, description: "FK -> Associate.id; register associate taking the order" }
      - { name: lines, type: array, source: input, description: "Array of { menu_item_id, qty, modifier_codes: string[] }; modifier_codes draw from the unlisted variation set (see modifier_proration)" }
      - { name: base_total_cents, type: integer, source: computed, description: "Sum over lines of base_price_cents * qty, before modifiers" }
      - { name: modifier_charge_cents, type: integer, source: computed, description: "Total modifier upcharge across all lines (see modifier_proration)" }
      - { name: total_price_cents, type: integer, source: computed, description: "base_total_cents + modifier_charge_cents" }
      - { name: patties_reserved, type: integer, source: computed, description: "Total patties consumed from store on-hand inventory (see order_inventory_reservation)" }
      - { name: queue_position, type: integer, source: computed, description: "Position in the store queue at submission; null once the order reaches SERVED" }
      - { name: surge_pacing_minutes, type: integer, source: computed, description: "Pacing delay applied at submission when the store is in OPENING_SURGE (see surge_pacing_window)" }
      - { name: status, type: enum, source: system, description: "PLACED | SERVED | CANCELLED" }

  - name: Associate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Associate full name" }
      - { name: hired_date, type: datetime, source: input, description: "Hire date (ISO8601)" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; store the associate belongs to" }
      - { name: current_level, type: enum, source: system, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 | LEVEL_4 | LEVEL_5 | SHIFT_LEAD | MANAGER; always LEVEL_1 at hire" }
      - { name: hourly_wage_cents, type: integer, source: computed, description: "Current wage derived from current_level via the wage ladder (see wage_ladder_step)" }
      - { name: promotion_count, type: integer, source: system, description: "Number of successful promotions; 0 at hire", default: 0 }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the associate is currently employable/schedulable" }

  - name: ManagerPosting
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store needing a manager" }
      - { name: posted_by_id, type: string, source: system, description: "X-User-ID of the HRDirector who posted (segregation of duties vs. closing)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | CANCELLED" }
      - { name: filled_by_associate_id, type: string, source: system, description: "FK -> Associate.id; promoted candidate; null until closed" }

  - name: ManagerApplication
    parent: ManagerPosting
    common_fields: true
    fields:
      - { name: posting_id, type: string, source: input, description: "FK -> ManagerPosting.id; the posting applied to" }
      - { name: candidate_associate_id, type: string, source: input, description: "FK -> Associate.id; internal candidate; MUST NOT be the associate identified by Store.manager_associate_id of the posting's store (internal-only sourcing with a self-application bar)" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED | WITHDRAWN" }

  - name: ShiftAssignment
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store worked" }
      - { name: associate_id, type: string, source: input, description: "FK -> Associate.id; scheduled associate" }
      - { name: shift_start, type: datetime, source: input, description: "Shift start (ISO8601)" }
      - { name: shift_end, type: datetime, source: input, description: "Shift end (ISO8601); MUST be after shift_start; same associate may not hold two shifts whose [start, end) intervals overlap" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED" }

  - name: BeefDelivery
    parent: Commissary
    common_fields: true
    fields:
      - { name: commissary_id, type: string, source: input, description: "FK -> Commissary.id; receiving commissary" }
      - { name: supplier_id, type: string, source: input, description: "FK -> BeefSupplier.id; shipping supplier; MUST equal Commissary.supplier_id (dedicated processing)" }
      - { name: shipped_at, type: datetime, source: input, description: "Shipment timestamp (ISO8601)" }
      - { name: raw_beef_lbs, type: number, source: input, description: "Pounds of raw beef shipped" }
      - { name: transit_temp_celsius, type: number, source: input, description: "Recorded transit temperature in Celsius; cold-chain limit is 4.0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_TRANSIT | RECEIVED | REJECTED" }

  - name: ProductionRun
    parent: Commissary
    common_fields: true
    fields:
      - { name: commissary_id, type: string, source: input, description: "FK -> Commissary.id; producing commissary" }
      - { name: run_date, type: datetime, source: input, description: "Production calendar day (ISO8601 date at 00:00:00Z)" }
      - { name: patties_planned, type: integer, source: input, description: "Patties to produce; capacity checked" }
      - { name: buns_planned, type: integer, source: input, description: "Buns to bake; capacity checked" }
      - { name: produce_units_planned, type: integer, source: input, description: "Produce units to prep; capacity checked" }
      - { name: beef_lbs_required, type: integer, source: computed, description: "Whole pounds of raw beef required: CEIL(patties_planned / PATTIES_PER_LB)" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Commissary
    initial_state: PLANNING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PLANNING
        to: BUILDING
        trigger: "POST /v1/commissaries/{id}/begin-build"
        actor: SupplyChainDirector
        preconditions:
          - "Commissary.status == PLANNING (ERR_COMMISSARY_INVALID_STATE)"
          - "BeefSupplier referenced by supplier_id has status APPROVED (ERR_SUPPLIER_NOT_APPROVED)"
        side_effects:
          - "increments Commissary.version by 1"
      - from: BUILDING
        to: OPERATIONAL
        trigger: "POST /v1/commissaries/{id}/activate"
        actor: SupplyChainDirector
        preconditions:
          - "Commissary.status == BUILDING (ERR_COMMISSARY_INVALID_STATE)"
        side_effects:
          - "regional_entry_open recomputed to true — regional entry for this commissary's radius is now open; Store creation against this commissary becomes legal"
          - "increments Commissary.version by 1"
      - from: OPERATIONAL
        to: BUILDING
        trigger: "POST /v1/commissaries/{id}/recertify"
        actor: SupplyChainDirector
        preconditions:
          - "Commissary.status == OPERATIONAL (ERR_COMMISSARY_INVALID_STATE)"
          - "No DeliveryBatch with commissary_id == this commissary is in PLANNED or LOADED status (ERR_OPEN_BATCHES_EXIST)"
        side_effects:
          - "regional_entry_open recomputed to false — new Store creation is gated again until reactivation"
          - "increments Commissary.version by 1"
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /v1/commissaries/{id}/decommission"
        actor: SupplyChainDirector
        preconditions:
          - "Commissary.status == OPERATIONAL (ERR_COMMISSARY_INVALID_STATE)"
          - "Every Store with commissary_id == this commissary has status CLOSED (ERR_STORES_STILL_OPEN)"
        side_effects:
          - "Every Truck with commissary_id == this commissary and status ACTIVE → INACTIVE (cascade)"
          - "Every DeliveryRoute with commissary_id == this commissary and status DRAFT → CANCELLED (cascade; FINALIZED/COMPLETED untouched)"
          - "regional_entry_open recomputed to false"
          - "increments Commissary.version by 1"

  - entity: Store
    initial_state: SITE_REVIEW
    terminal_states: [CLOSED]
    transitions:
      - from: SITE_REVIEW
        to: APPROVED
        trigger: "POST /v1/stores/{id}/approve"
        actor: RealEstatePlanner
        preconditions:
          - "Store.status == SITE_REVIEW (ERR_STORE_INVALID_STATE)"
          - "Store.manager_associate_id is non-null and references an Associate with current_level == MANAGER (ERR_INVALID_REQUEST)"
          - "radius check passes: raw haversine distance < Commissary.radius_limit_km (ERR_RADIUS_LIMIT_EXCEEDED)"
          - "frequency check passes: per delivery_day_gap_projection (ERR_DELIVERY_FREQUENCY_VIOLATION)"
        side_effects:
          - "increments Store.version by 1"
      - from: APPROVED
        to: OPEN
        trigger: "POST /v1/stores/{id}/open"
        actor: RealEstatePlanner
        preconditions:
          - "Store.status == APPROVED (ERR_STORE_INVALID_STATE)"
        side_effects:
          - "increments Store.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /v1/stores/{id}/begin-opening-surge (demand-surge mode toggle; status field unchanged, opening_mode NORMAL → OPENING_SURGE)"
        actor: StoreManager
        preconditions:
          - "Store.status == OPEN (ERR_STORE_INVALID_STATE)"
          - "Store.opening_mode == NORMAL (ERR_SURGE_ALREADY_ACTIVE)"
        side_effects:
          - "opening_mode → OPENING_SURGE; surge_start_date ← current logical-clock day; surge_end_date ← surge_start_date + SURGE_WINDOW_DAYS - 1; surge_day_index ← 1"
          - "Every ACTIVE Truck with commissary_id == Store.commissary_id and route_type == RESERVE → becomes dispatch-eligible (dispatch eligibility is evaluated live from truck status + route_type + the presence of a surging store; this cascade does NOT mutate Truck rows and does NOT touch Truck.version or Commissary.version)"
          - "increments Store.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /v1/stores/{id}/end-opening-surge (opening_mode OPENING_SURGE → NORMAL)"
        actor: StoreManager
        preconditions:
          - "Store.status == OPEN (ERR_STORE_INVALID_STATE)"
          - "Store.opening_mode == OPENING_SURGE (ERR_SURGE_NOT_ACTIVE)"
        side_effects:
          - "opening_mode → NORMAL; surge_day_index, surge_start_date, surge_end_date ← null"
          - "RESERVE trucks → dispatch-ineligible again (live re-evaluation; no Truck or Commissary mutation)"
          - "increments Store.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/stores/{id}/close"
        actor: RealEstatePlanner
        preconditions:
          - "Store.status == OPEN (ERR_STORE_INVALID_STATE)"
          - "No ShiftAssignment with store_id == this store in SCHEDULED status with shift_end > current logical clock (ERR_OPEN_SHIFTS_EXIST)"
        side_effects:
          - "Every DeliveryBatch with store_id == this store and status PLANNED → CANCELLED (conditional cascade; LOADED/DELIVERED untouched)"
          - "Every DeliveryRoute that lists this store in store_ids and is DRAFT or FINALIZED → CANCELLED (cross-entity cascade); each cancelled route increments DeliveryRoute.version by 1"
          - "Every SCHEDULED ShiftAssignment with store_id == this store → CANCELLED (cascade)"
          - "increments Store.version by 1"

  - entity: BeefSupplier
    initial_state: PROBATION
    terminal_states: [RETIRED]
    transitions:
      - from: PROBATION
        to: APPROVED
        trigger: "POST /v1/suppliers/{id}/audits/{auditId}/record-audit with result PASS"
        actor: QualityAuditor
        preconditions:
          - "BeefSupplier.status == PROBATION (ERR_SUPPLIER_INVALID_STATE)"
          - "Target Audit.status == SCHEDULED (ERR_AUDIT_ALREADY_RECORDED)"
        side_effects:
          - "Audit.status → RECORDED, result ← PASS, completed_at ← logical clock, recorded_by_id ← caller"
          - "days_since_last_passed_audit ← 0 (stale-audit accumulator reset)"
          - "increments BeefSupplier.version by 1; increments Audit.version by 1"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /v1/suppliers/{id}/audits/{auditId}/record-audit with result PASS (renewal; status unchanged)"
        actor: QualityAuditor
        preconditions:
          - "BeefSupplier.status == APPROVED (ERR_SUPPLIER_INVALID_STATE)"
          - "Target Audit.status == SCHEDULED (ERR_AUDIT_ALREADY_RECORDED)"
        side_effects:
          - "Audit.status → RECORDED, result ← PASS, completed_at ← logical clock"
          - "days_since_last_passed_audit ← 0 (reset event restarts the stale-audit clock)"
          - "increments BeefSupplier.version by 1; increments Audit.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /v1/suppliers/{id}/audits/{auditId}/record-audit with result FAIL"
        actor: QualityAuditor
        preconditions:
          - "BeefSupplier.status == PROBATION (ERR_SUPPLIER_INVALID_STATE)"
          - "Target Audit.status == SCHEDULED (ERR_AUDIT_ALREADY_RECORDED)"
        side_effects:
          - "Audit.status → RECORDED, result ← FAIL"
          - "supplier_fail_suspension cascade fires (see calculation): every BeefDelivery with supplier_id == this supplier in SCHEDULED or IN_TRANSIT → REJECTED; every Commissary with supplier_id == this supplier and status OPERATIONAL → BUILDING with regional_entry_open recomputed to false (transitive depth-3 chain: audit → supplier → deliveries + commissaries)"
          - "increments BeefSupplier.version by 1; increments Audit.version by 1; each cascaded Commissary.version +1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /v1/suppliers/{id}/audits/{auditId}/record-audit with result FAIL"
        actor: QualityAuditor
        preconditions:
          - "BeefSupplier.status == APPROVED (ERR_SUPPLIER_INVALID_STATE)"
          - "Target Audit.status == SCHEDULED (ERR_AUDIT_ALREADY_RECORDED)"
        side_effects:
          - "Same as PROBATION → SUSPENDED (audit recorded FAIL; delivery rejections; commissary demotion cascade)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /v1/suppliers/{id}/audits/{auditId}/record-audit with result PASS (cycle: SUSPENDED → APPROVED)"
        actor: QualityAuditor
        preconditions:
          - "BeefSupplier.status == SUSPENDED (ERR_SUPPLIER_INVALID_STATE)"
          - "Target Audit.status == SCHEDULED (ERR_AUDIT_ALREADY_RECORDED)"
        side_effects:
          - "Audit.status → RECORDED, result ← PASS, days_since_last_passed_audit ← 0"
          - "increments BeefSupplier.version by 1"
      - from: APPROVED
        to: RETIRED
        trigger: "POST /v1/suppliers/{id}/retire"
        actor: SupplyChainDirector
        preconditions:
          - "BeefSupplier.status == APPROVED (ERR_SUPPLIER_INVALID_STATE)"
        side_effects:
          - "Every BeefDelivery with supplier_id == this supplier in SCHEDULED → CANCELLED (cascade; IN_TRANSIT left for receipt decision)"
          - "increments BeefSupplier.version by 1"

  - entity: Audit
    initial_state: SCHEDULED
    terminal_states: [RECORDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /v1/suppliers/{id}/audits/{auditId}/record-audit"
        actor: QualityAuditor
        preconditions:
          - "Audit.status == SCHEDULED (ERR_AUDIT_ALREADY_RECORDED)"
        side_effects:
          - "result, completed_at, recorded_by_id set; supplier transition fired per BeefSupplier machine"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/suppliers/{id}/audits/{auditId}/cancel"
        actor: QualityAuditor
        preconditions:
          - "Audit.status == SCHEDULED (ERR_AUDIT_ALREADY_RECORDED)"
        side_effects: []

  - entity: DeliveryRoute
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /v1/routes/{id}/finalize"
        actor: CommissaryPlanner
        preconditions:
          - "DeliveryRoute.status == DRAFT (ERR_ROUTE_INVALID_STATE)"
          - "Truck referenced by truck_id has status ACTIVE (ERR_TRUCK_INACTIVE)"
          - "If Truck.route_type == RESERVE then at least one Store in store_ids has opening_mode == OPENING_SURGE (ERR_TRUCK_INACTIVE)"
          - "Aggregate cooler check: sum of cooler_cases_required over all batches with route_id == this route and status == LOADED plus every candidate case increment <= Truck.cooler_capacity_cases (ERR_COOLER_CAPACITY_EXCEEDED)"
          - "For every Store in store_ids: delivery_date (service_date) satisfies the store's delivery-day window: weekday(service_date) allowed by Commissary.delivery_days_mask, and gap versus the store's previous DELIVERED batch within the store's effective max gap (ERR_DELIVERY_WINDOW_CONFLICT)"
        side_effects:
          - "increments DeliveryRoute.version by 1"
      - from: FINALIZED
        to: COMPLETED
        trigger: "POST /v1/routes/{id}/complete"
        actor: CommissaryPlanner
        preconditions:
          - "DeliveryRoute.status == FINALIZED (ERR_ROUTE_INVALID_STATE)"
          - "Every DeliveryBatch with route_id == this route has status DELIVERED (ERR_BATCHES_NOT_DELIVERED)"
        side_effects:
          - "increments DeliveryRoute.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /v1/routes/{id}/cancel, or system cascade (store close / commissary decommission)"
        actor: CommissaryPlanner
        preconditions:
          - "DeliveryRoute.status in {DRAFT, FINALIZED} (ERR_ROUTE_INVALID_STATE)"
        side_effects:
          - "increments DeliveryRoute.version by 1"
      - from: FINALIZED
        to: CANCELLED
        trigger: "POST /v1/routes/{id}/cancel, or system cascade (store close)"
        actor: CommissaryPlanner
        preconditions:
          - "DeliveryRoute.status in {DRAFT, FINALIZED} (ERR_ROUTE_INVALID_STATE)"
        side_effects:
          - "increments DeliveryRoute.version by 1"

  - entity: DeliveryBatch
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "POST /v1/batches/{id}/load"
        actor: CommissaryPlanner
        preconditions:
          - "DeliveryBatch.status == PLANNED (ERR_BATCH_INVALID_STATE)"
          - "Target ProductionRun.status == COMPLETED and ProductionRun.commissary_id == batch.commissary_id (ERR_RUN_NOT_COMPLETED)"
          - "Target DeliveryRoute.status in {DRAFT, FINALIZED}, route.commissary_id == batch.commissary_id, route.service_date == batch.delivery_date, and batch.store_id ∈ route.store_ids (ERR_ROUTE_INVALID_STATE)"
          - "gap_hours_at_load computed per delivery_gap_hours; if this is not the store's first batch, gap_hours_at_load <= store effective max gap hours (ERR_DELIVERY_FREQUENCY_VIOLATION)"
          - "Aggregate truck check: sum of cooler_cases_required of batches already LOADED on the route + this batch's cooler_cases_required <= route truck's cooler_capacity_cases (ERR_COOLER_CAPACITY_EXCEEDED)"
        side_effects:
          - "production_run_id, route_id, cooler_cases_required, gap_hours_at_load set"
          - "increments DeliveryBatch.version by 1"
      - from: LOADED
        to: DELIVERED
        trigger: "POST /v1/batches/{id}/deliver"
        actor: CommissaryPlanner
        preconditions:
          - "DeliveryBatch.status == LOADED (ERR_BATCH_INVALID_STATE)"
          - "DeliveryRoute referenced by route_id has status FINALIZED (ERR_ROUTE_INVALID_STATE)"
        side_effects:
          - "delivered_at ← logical clock (recorded on the batch)"
          - "Store on-hand inventory credited: +patty_count patties, +bun_count buns, +produce_units produce (tracked on the store inventory ledger used by order_inventory_reservation)"
          - "increments DeliveryBatch.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /v1/batches/{id}/cancel, or system cascade (store close)"
        actor: CommissaryPlanner
        preconditions:
          - "DeliveryBatch.status == PLANNED (ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "increments DeliveryBatch.version by 1"

  - entity: BeefDelivery
    initial_state: SCHEDULED
    terminal_states: [RECEIVED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /v1/beef-deliveries/{id}/ship"
        actor: CommissaryPlanner
        preconditions:
          - "BeefDelivery.status == SCHEDULED (ERR_DELIVERY_INVALID_STATE)"
          - "BeefSupplier referenced by supplier_id has status APPROVED (ERR_SUPPLIER_NOT_APPROVED)"
        side_effects:
          - "increments BeefDelivery.version by 1"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /v1/beef-deliveries/{id}/confirm-receiving"
        actor: CommissaryPlanner
        preconditions:
          - "BeefDelivery.status == IN_TRANSIT (ERR_DELIVERY_INVALID_STATE)"
          - "Cold chain: transit_temp_celsius <= COLD_CHAIN_MAX_C (4.0) — strictly-greater violates (ERR_COLD_CHAIN_VIOLATION)"
          - "BeefSupplier referenced by supplier_id has status APPROVED (ERR_SUPPLIER_NOT_APPROVED)"
        side_effects:
          - "Commissary.raw_beef_lbs_on_hand += raw_beef_lbs (ledger sync to commissary)"
          - "increments BeefDelivery.version by 1; increments Commissary.version by 1"
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /v1/beef-deliveries/{id}/reject-receiving, or system cascade (supplier suspension)"
        actor: CommissaryPlanner
        preconditions:
          - "BeefDelivery.status == IN_TRANSIT (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "No inventory credit; increments BeefDelivery.version by 1"
      - from: SCHEDULED
        to: REJECTED
        trigger: "system cascade (supplier suspension) or POST /v1/beef-deliveries/{id}/reject-receiving"
        actor: system
        preconditions:
          - "BeefDelivery.status == SCHEDULED (ERR_DELIVERY_INVALID_STATE)"
        side_effects:
          - "increments BeefDelivery.version by 1"

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /v1/production-runs/{id}/complete"
        actor: CommissaryPlanner
        preconditions:
          - "ProductionRun.status == PLANNED (ERR_RUN_INVALID_STATE)"
        side_effects:
          - "Finished goods made available for batch loading"
          - "increments ProductionRun.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /v1/production-runs/{id}/cancel"
        actor: CommissaryPlanner
        preconditions:
          - "ProductionRun.status == PLANNED (ERR_RUN_INVALID_STATE)"
          - "No DeliveryBatch references this run with status LOADED (ERR_BATCHES_NOT_DELIVERED)"
        side_effects:
          - "Raw beef debit is reversed: Commissary.raw_beef_lbs_on_hand += beef_lbs_required (compensating action restores the conserved beef ledger)"
          - "increments ProductionRun.version by 1; increments Commissary.version by 1"

  - entity: Order
    initial_state: PLACED
    terminal_states: [SERVED, CANCELLED]
    transitions:
      - from: PLACED
        to: SERVED
        trigger: "POST /v1/orders/{id}/serve"
        actor: Associate
        preconditions:
          - "Order.status == PLACED (ERR_ORDER_INVALID_STATE)"
          - "Acting associate (X-User-ID) has home_store_id == Order.store_id and active == true (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "queue_position ← null"
          - "increments Order.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /v1/orders/{id}/cancel"
        actor: Associate
        preconditions:
          - "Order.status == PLACED (ERR_ORDER_INVALID_STATE)"
          - "Acting associate has home_store_id == Order.store_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "Compensating action: store on-hand inventory is credited back (+patties_reserved patties and the corresponding bun/produce units computed from the lines); the conserved quantity 'store on-hand inventory' returns to its pre-placement value"
          - "queue_position ← null"
          - "increments Order.version by 1"

  - entity: ManagerPosting
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/manager-postings/{id}/close"
        actor: HRDirector
        preconditions:
          - "ManagerPosting.status == OPEN (ERR_POSTING_INVALID_STATE)"
          - "Request body candidate_application_id references a ManagerApplication with status PENDING on this posting (ERR_APPLICATION_INVALID_STATE)"
          - "Segregation of duties: X-User-ID != posted_by_id (the HRDirector who posted may not close it) (ERR_SOD_VIOLATION)"
        side_effects:
          - "filled_by_associate_id ← application's candidate_associate_id"
          - "Candidate ManagerApplication → ACCEPTED; every other PENDING ManagerApplication on this posting → REJECTED (cascade)"
          - "Candidate Associate: current_level SHIFT_LEAD → MANAGER; hourly_wage_cents recomputed via wage_ladder_step; promotion_count += 1 (compounding internal promotion); candidate Associate.home_store_id ← posting.store_id; posting store's manager_associate_id ← candidate id"
          - "increments ManagerPosting.version by 1; increments candidate Associate.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /v1/manager-postings/{id}/cancel"
        actor: HRDirector
        preconditions:
          - "ManagerPosting.status == OPEN (ERR_POSTING_INVALID_STATE)"
        side_effects:
          - "Every PENDING ManagerApplication on this posting → REJECTED (cascade)"
          - "increments ManagerPosting.version by 1"

  - entity: ManagerApplication
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "system (posting close selects this application)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "system (posting close selects another application, or posting cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /v1/manager-applications/{id}/withdraw"
        actor: Associate
        preconditions:
          - "ManagerApplication.status == PENDING (ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == candidate_associate_id (only the candidate may withdraw) (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "increments ManagerApplication.version by 1"

  - entity: ShiftAssignment
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/shifts/{id}/cancel, or system cascade (store close)"
        actor: StoreManager
        preconditions:
          - "ShiftAssignment.status == SCHEDULED (ERR_SHIFT_INVALID_STATE)"
        side_effects:
          - "Store staffing_posture recomputed via staffing_posture (derived field reconciliation on source removal)"
          - "increments ShiftAssignment.version by 1"

  - entity: Truck
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /v1/trucks/{id}/retire, or system cascade (commissary decommission)"
        actor: CommissaryPlanner
        preconditions:
          - "Truck.status == ACTIVE (ERR_TRUCK_INACTIVE)"
        side_effects:
          - "increments Truck.version by 1; increments Commissary.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: store-create-stale-commissary
    parent_entity: Commissary
    write_endpoint: "POST /v1/stores"
    occ_field: "expected_commissary_version"
    description: |
      Creating a Store against a Commissary whose version has advanced since
      the client last observed it is rejected with 412. Creating a store is a
      legitimate new-region entry that supersedes the client's stale view of
      the commissary's capacity/radius posture (any prior store creation,
      truck mutation, or beef receipt has advanced the version).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: batch-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /v1/batches"
    occ_field: "expected_store_version"
    description: |
      Creating a DeliveryBatch against a Store whose version has advanced
      since the client last observed it is rejected with 412. Surge toggles,
      status changes, and prior batch planning all advance Store.version; a
      stale read means the client's frequency/mode assumptions are outdated.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: store_radius_check
    trigger: "POST /v1/stores (creation) and POST /v1/stores/{id}/approve"
    algorithm: threshold
    formula: |
      R = 6371.0  # km
      φ1, φ2 = radians(commissary.lat), radians(store.lat)
      Δφ = radians(store.lat - commissary.lat)
      Δλ = radians(store.lng - commissary.lng)
      a = sin(Δφ/2)^2 + cos(φ1) * cos(φ2) * sin(Δλ/2)^2
      c = 2 * atan2(sqrt(a), sqrt(1-a))
      raw = R * c
      Store.distance_km = round_half_up(raw, 3)   # stored display value
      radius_ok = raw < commissary.radius_limit_km  # STRICT: raw, unrounded
    input_set: "The candidate store's lat/lng and its assigned Commissary's lat/lng and radius_limit_km"
    constants:
      EARTH_RADIUS_KM: 6371.0
    precision: "stored distance_km 3 decimal places, round_half_up; the gate compares the RAW value"
    variants: []

  - name: delivery_day_gap_projection
    trigger: "POST /v1/stores/{id}/approve"
    algorithm: forward_looking
    formula: |
      # Project the worst forward gap between consecutive delivery-capable days
      # over a 14-day horizon starting at the current logical-clock day.
      delivery_capable(d) = commissary.delivery_days_mask[weekday(d)] AND NOT
        (store.status == OPEN AND store.opening_mode == OPENING_SURGE
         AND surge_day(d) ∈ {1,2,3} AND NOT NEAR_DAILY_WEEKDAYS[weekday(d)])
      # NEAR_DAILY_WEEKDAYS = Mon..Sat (indices 0..5); surge days 1-3 drop Sunday
      days = [clock_day + i for i in 0..13]
      worst_gap = max over consecutive capable days (d_i, d_{i+1}) of (d_{i+1} - d_i) * 24 hours
      projected_ok = (count of capable days in window >= 2) AND worst_gap <= EFFECTIVE_MAX_GAP_HOURS(store)
    input_set: "Commissary.delivery_days_mask; logical clock day; Store opening_mode (NORMAL at approval); store demand class"
    constants:
      NORMAL_MAX_GAP_HOURS: 48
      PROJECTION_HORIZON_DAYS: 14
    precision: "integer hours"
    variants:
      - name: standard_store_projection
        when: "Store weekly patty demand class <= HIGH_DEMAND_PATTY_WEEK threshold"
        difference: "EFFECTIVE_MAX_GAP_HOURS = 48 (daily-or-better cadence required)"
      - name: high_demand_store_projection
        when: "Store weekly patty demand class > HIGH_DEMAND_PATTY_WEEK"
        difference: "EFFECTIVE_MAX_GAP_HOURS = 24 (twice-daily cadence) — identical mask and horizon produce a different verdict for high-demand stores"

  - name: modifier_proration
    trigger: "POST /v1/stores/{id}/orders (order creation)"
    algorithm: aggregation
    formula: |
      # Per-line modifier pricing, THEN sum (rounding order is pinned).
      for each line:
        units = line.qty * (1 + count(c in line.modifier_codes if c == "EXTRA_PATTY"))
        pre_discount_cents = units * MODIFIER_UNIT_CENTS[c] summed over modifier_codes
        line_modifier_cents = round_half_up(pre_discount_cents * (1 - WELL_DONE_DISCOUNT_PCT))
          where WELL_DONE_DISCOUNT_PCT applies iff "WELL_DONE" ∈ line.modifier_codes
      Order.modifier_charge_cents = Σ line_modifier_cents   # sum of rounded lines
      Order.base_total_cents = Σ (menu_item.base_price_cents * line.qty)
      Order.total_price_cents = base_total_cents + modifier_charge_cents
      # Resource footprint (separate pass, no rounding):
      Order.patties_reserved = Σ line.qty * (item.patty_count + count("EXTRA_PATTY" in modifiers))
    input_set: "Order lines referencing active MenuItems; modifier codes drawn from the fixed unlisted variation set {EXTRA_PATTY, ANIMAL_STYLE, PROTEIN_STYLE, WELL_DONE}"
    constants:
      MODIFIER_UNIT_CENTS: { EXTRA_PATTY: 150, ANIMAL_STYLE: 65, PROTEIN_STYLE: 0, WELL_DONE: 0 }
      WELL_DONE_DISCOUNT_PCT: 0.10
    precision: "integer cents; round per line (round_half_up) then sum — summing raw then rounding is FORBIDDEN"
    variants:
      - name: provisional_quote
        when: "computed for the POST response before placement commit"
        difference: "uses catalog prices as of request time; identical arithmetic to final"
      - name: final_charged
        when: "persisted on the Order at creation"
        difference: "authoritative value; must equal the provisional quote for the same request payload"

  - name: surge_pacing_window
    trigger: "POST /v1/stores/{id}/orders when Store.opening_mode == OPENING_SURGE"
    algorithm: threshold
    formula: |
      day_index = floor((clock_day - Store.surge_start_date) in days) + 1
      if day_index > SURGE_WINDOW_DAYS: opening_mode auto-reverts to NORMAL; pacing = 0
      open_orders = count of Orders with store_id == store AND status == PLACED
      intensity = floor(open_orders / SURGE_BUCKET_SIZE)
      raw_pacing = intensity * SURGE_PACING_STEP_MIN
      effective = max(MIN_PACING_MIN, min(raw_pacing, PACING_CAP_MIN[day_index]))
      Order.surge_pacing_minutes = effective
      Order.queue_position = open_orders + 1
    input_set: "Orders in PLACED status for the store at the instant of creation; logical clock; Store.surge_start_date"
    constants:
      SURGE_WINDOW_DAYS: 7
      SURGE_BUCKET_SIZE: 10
      SURGE_PACING_STEP_MIN: 5
      MIN_PACING_MIN: 5
      PACING_CAP_MIN: { 1: 45, 2: 45, 3: 45, 4: 30, 5: 30, 6: 20, 7: 20 }
    precision: "integer minutes"
    variants: []

  - name: wage_ladder_step
    trigger: "POST /v1/associates/{id}/promote and ManagerPosting close (compounding)"
    algorithm: tiered_pricing
    formula: |
      WAGE_CENTS = { LEVEL_1: 1750, LEVEL_2: 1850, LEVEL_3: 1975, LEVEL_4: 2100,
                     LEVEL_5: 2250, SHIFT_LEAD: 2500, MANAGER: 3200 }
      ORDER = [LEVEL_1, LEVEL_2, LEVEL_3, LEVEL_4, LEVEL_5, SHIFT_LEAD, MANAGER]
      # Preconditions for a /promote call (boundary precision is >=):
      #   tenure_days = (clock_date - Associate.hired_date).days >= TENURE_MIN_DAYS
      #   active_shift_count = count of ShiftAssignment with associate_id == id,
      #     status == SCHEDULED, shift_start >= clock_time  >= SHIFT_MIN_ACTIVE
      #   promotion_count < MAX_PROMOTIONS
      #   current_level != MANAGER (terminal rung)
      # On success: current_level = ORDER[index(current_level)+1];
      #   hourly_wage_cents = WAGE_CENTS[new level]; promotion_count += 1
      # MANAGER level is NEVER reachable via /promote — only via posting close.
    input_set: "The target Associate; their SCHEDULED future shifts; logical clock"
    constants:
      TENURE_MIN_DAYS: 180
      SHIFT_MIN_ACTIVE: 2
      MAX_PROMOTIONS: 6
    precision: "integer cents"
    variants: []

  - name: staffing_posture
    trigger: "Computed after every ShiftAssignment creation/cancellation and Associate deactivation for the store; read on Store"
    algorithm: aggregation
    formula: |
      # Coverage-first evaluation order (pinned):
      active_crew = count of Associates with home_store_id == store AND active == true
      sched_today = count of ShiftAssignment with store_id == store,
        status == SCHEDULED, shift_start <= clock_time < shift_end
      coverage_ratio = sched_today / max(active_crew, 1)
      if coverage_ratio < COVERAGE_CRITICAL_PCT: posture = CRITICAL      # checked FIRST
      elif count(active crew with current_level == MANAGER) == 0: posture = CRITICAL
      elif count(active crew with current_level in {SHIFT_LEAD, MANAGER}) < MIN_LEADS: posture = STRAINED
      else: posture = STEADY
      # Stores in OPENING_SURGE treat STRAINED as CRITICAL for scheduling gating.
    input_set: "Associates of the store (active == true only); today's SCHEDULED shifts; logical clock"
    constants:
      COVERAGE_CRITICAL_PCT: 0.60
      MIN_LEADS: 1
    precision: "ratio compared raw; no rounding"
    variants: []

  - name: supplier_fail_suspension
    trigger: "record-audit with result FAIL on PROBATION or APPROVED supplier"
    algorithm: constraint_propagation
    formula: |
      # Propagation order is pinned: deliveries first, then commissaries.
      1. supplier.status → SUSPENDED
      2. for each BeefDelivery with supplier_id == supplier AND status in {SCHEDULED, IN_TRANSIT}
           ordered by created_at ASC (tie-break: none needed, created_at is unique per creation):
             delivery.status → REJECTED
      3. for each Commissary with supplier_id == supplier AND status == OPERATIONAL:
             commissary.status → BUILDING; regional_entry_open ← false
      # No fixed-point iteration: exactly one pass, steps strictly ordered.
    input_set: "BeefDeliveries filtered by supplier_id and status ∈ {SCHEDULED, IN_TRANSIT}; Commissaries filtered by supplier_id and status == OPERATIONAL"
    constants: {}
    precision: "n/a"
    variants: []

  - name: stale_audit_suspension_check
    trigger: "POST /v1/beef-deliveries/{id}/ship and POST /v1/beef-deliveries/{id}/confirm-receiving"
    algorithm: decay_function
    formula: |
      days = calendar_days(most recent PASS Audit.completed_at, clock_now)
      # days_since_last_passed_audit is reset to 0 by every PASS record (reset event)
      eligible = supplier.status == APPROVED AND days <= supplier.audit_frequency_days
      # Boundary: days == audit_frequency_days is ELIGIBLE; days == audit_frequency_days + 1 is NOT.
      if not eligible: ERR_SUPPLIER_AUDIT_STALE
    input_set: "PASS Audits of the supplier (RECORDED status only), latest by completed_at; logical clock"
    constants: {}
    precision: "integer days; comparison is <="
    variants: []

  - name: cooler_cases
    trigger: "DeliveryBatch creation and load"
    algorithm: aggregation
    formula: |
      cooler_cases_required = CEIL(patty_count / PATTY_CASE) + CEIL(bun_count / BUN_CASE)
        + CEIL(produce_units / PRODUCE_CASE)
    input_set: "The batch's patty_count, bun_count, produce_units"
    constants:
      PATTY_CASE: 40
      BUN_CASE: 48
      PRODUCE_CASE: 12
    precision: "integer cases; CEIL per commodity then sum (order pinned)"
    variants: []

  - name: delivery_gap_hours
    trigger: "POST /v1/batches/{id}/load"
    algorithm: chronological
    formula: |
      prev = the DeliveryBatch with store_id == batch.store_id AND status == DELIVERED
             AND delivered_at < batch.delivery_date, latest by delivered_at
             (tie-break on equal delivered_at: earliest created_at first is EXCLUDED —
             latest created_at wins; ids never consulted)
      if prev is null: gap_hours_at_load = null (first batch exempt from gap check)
      else: gap_hours_at_load = (batch.delivery_date 00:00Z - prev.delivered_at) in hours
      pass = (gap_hours_at_load is null) OR (gap_hours_at_load <= EFFECTIVE_MAX_GAP_HOURS(store))
      # EFFECTIVE_MAX_GAP_HOURS = 24 during OPENING_SURGE days 1-3 and for
      # high-demand stores; 48 otherwise. Boundary is <= (exactly 48.0 passes).
    input_set: "DELIVERED batches of the store only (PLANNED/LOADED/CANCELLED excluded); logical clock"
    constants:
      NORMAL_MAX_GAP_HOURS: 48
      SURGE_MAX_GAP_HOURS: 24
    precision: "hours to 0.01"
    variants: []

  - name: order_inventory_reservation
    trigger: "POST /v1/stores/{id}/orders"
    algorithm: waterfall_allocation
    formula: |
      # Store on-hand ledger: {patties, buns, produce_units} credited by batch
      # delivery, debited by order placement, re-credited by order cancellation.
      required_patties = Σ per line qty * (item.patty_count + extra_patty_count)
      required_buns    = Σ per line qty * 1   # one bun per unit sold
      required_produce = Σ per line qty * item.produce_units
      # Waterfall: ALL three commodities must be satisfiable; the check is
      # all-or-nothing — if any commodity is short, NOTHING is debited and the
      # order is rejected (ERR_INSUFFICIENT_INVENTORY). No partial fills.
      # Zero-quantity edge: an order whose lines total 0 patties (e.g. all
      # PROTEIN_STYLE grilled-cheese SKUs with patty_count 0) still reserves
      # buns and produce; a store with 0 buns rejects it.
    input_set: "Order lines; store on-hand ledger for the store"
    constants: {}
    precision: "integer units"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is permitted for this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership/identity: entity-backed role's X-User-ID matches the resource's ownership field where the endpoint requires it (e.g. Associate serving an order at own store; StoreManager managing own store; candidate withdrawing own application)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Every id in the path exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Every FK id in the request body references an existing entity (commissary_id, supplier_id, store_id, menu_item_id, truck_id, production_run_id, route_id, candidate ids)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: business_constraint, check: "Request shape: required fields present, types valid, enum values in domain, modifier codes within the unlisted variation set, arrays well-formed", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 7, category: business_constraint, check: "OCC: expected_<parent>_version matches the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /v1/stores", "POST /v1/batches"] }
  - { priority: 8, category: state, check: "Target entity is in a state that permits the transition (per-entity ERR_*_INVALID_STATE / ERR_AUDIT_ALREADY_RECORDED / ERR_SURGE_ALREADY_ACTIVE / ERR_SURGE_NOT_ACTIVE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: business_safety, check: "Cold chain on beef receipt: transit_temp_celsius <= 4.0 (strictly greater violates)", error_id: ERR_COLD_CHAIN_VIOLATION, http_status: 422, applies_to: ["POST /v1/beef-deliveries/{id}/confirm-receiving"] }
  - { priority: 10, category: business_safety, check: "Supplier freshness: latest PASS audit within audit_frequency_days at ship/receipt time", error_id: ERR_SUPPLIER_AUDIT_STALE, http_status: 422, applies_to: ["POST /v1/beef-deliveries/{id}/ship", "POST /v1/beef-deliveries/{id}/confirm-receiving"] }
  - { priority: 11, category: business_referential, check: "Supplier status is APPROVED where required (begin-build, ship, confirm-receiving)", error_id: ERR_SUPPLIER_NOT_APPROVED, http_status: 422, applies_to: ["POST /v1/commissaries/{id}/begin-build", "POST /v1/beef-deliveries/{id}/ship", "POST /v1/beef-deliveries/{id}/confirm-receiving"] }
  - { priority: 12, category: business_referential, check: "Cross-entity linkage: store.manager_associate_id (when provided, and always at approve time) references an Associate at MANAGER level; commissary referenced by a new store has regional_entry_open == true; batch's store is on the route's store_ids; delivery's supplier_id == commissary.supplier_id (dedicated processing)", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: ["POST /v1/stores", "POST /v1/stores/{id}/approve", "POST /v1/batches", "POST /v1/batches/{id}/load", "POST /v1/beef-deliveries"] }
  - { priority: 13, category: business_temporal, check: "Radius limit: raw haversine distance strictly < Commissary.radius_limit_km", error_id: ERR_RADIUS_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /v1/stores", "POST /v1/stores/{id}/approve"] }
  - { priority: 14, category: business_temporal, check: "Delivery frequency: projected/actual gap within EFFECTIVE_MAX_GAP_HOURS; service_date weekday allowed by delivery_days_mask; surge days 1-3 tighten windows", error_id: ERR_DELIVERY_FREQUENCY_VIOLATION, http_status: 422, applies_to: ["POST /v1/stores/{id}/approve", "POST /v1/batches", "POST /v1/batches/{id}/load", "POST /v1/routes", "POST /v1/routes/{id}/finalize"] }
  - { priority: 15, category: business_temporal, check: "Shift overlap: associate has no existing SCHEDULED shift whose [start,end) interval overlaps the new one", error_id: ERR_SHIFT_OVERLAP, http_status: 422, applies_to: ["POST /v1/stores/{id}/shifts"] }
  - { priority: 16, category: business_temporal, check: "Route/truck temporal exclusivity: truck not already committed to a FINALIZED route on the same service_date; store not already visited by another FINALIZED route on that date (adjacent-day routes never conflict)", error_id: ERR_ROUTE_WINDOW_CONFLICT, http_status: 422, applies_to: ["POST /v1/routes", "POST /v1/routes/{id}/finalize"] }
  - { priority: 17, category: business_fiscal, check: "Commissary capacity & raw beef: patties_planned <= daily_patty_capacity, buns_planned <= daily_bun_capacity, produce_units_planned <= daily_produce_capacity, CEIL(patties/PATTIES_PER_LB) <= raw_beef_lbs_on_hand", error_id: ERR_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /v1/commissaries/{id}/production-runs"] }
  - { priority: 18, category: business_fiscal, check: "Truck cooler aggregate capacity on route (sum of loaded batch cases + candidate <= cooler_capacity_cases)", error_id: ERR_COOLER_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /v1/batches/{id}/load", "POST /v1/routes/{id}/finalize"] }
  - { priority: 19, category: business_fiscal, check: "Store on-hand inventory covers the order's patty/bun/produce footprint (all-or-nothing waterfall)", error_id: ERR_INSUFFICIENT_INVENTORY, http_status: 422, applies_to: ["POST /v1/stores/{id}/orders"] }
  - { priority: 20, category: business_constraint, check: "Promotion ladder: tenure_days >= 180 AND active future SCHEDULED shifts >= 2 AND promotion_count < 6 AND current_level != MANAGER", error_id: ERR_PROMOTION_INELIGIBLE, http_status: 422, applies_to: ["POST /v1/associates/{id}/promote"] }
  - { priority: 21, category: business_constraint, check: "Internal-only management sourcing: candidate is an active Associate at SHIFT_LEAD, is not the posting store's current manager, posting OPEN; posting close: caller HRDirector != posted_by_id", error_id: ERR_SOD_VIOLATION, http_status: 422, applies_to: ["POST /v1/manager-postings/{id}/applications", "POST /v1/manager-postings/{id}/close"] }
  - { priority: 22, category: business_constraint, check: "Store staffing_posture gates scheduling: posture CRITICAL blocks new ShiftAssignment creation (STRAINED blocks during OPENING_SURGE)", error_id: ERR_POSTURE_BLOCKS, http_status: 422, applies_to: ["POST /v1/stores/{id}/shifts"] }
  - { priority: 23, category: business_constraint, check: "Truck dispatchability: status ACTIVE; RESERVE trucks only while a served store is in OPENING_SURGE", error_id: ERR_TRUCK_INACTIVE, http_status: 422, applies_to: ["POST /v1/routes", "POST /v1/routes/{id}/finalize"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never wall-clock)."
    roles: [SupplyChainDirector]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; surge_day_index and days_since_last_passed_audit recomputed lazily on next read"]

  # --- BeefSupplier ---
  - method: POST
    path: "/v1/suppliers"
    description: "Register a beef supplier (starts PROBATION)"
    roles: [SupplyChainDirector]
    code: 201
    input: [supplier_code, spec_profile, audit_frequency_days]
    output: BeefSupplier
    side_effects: ["status PROBATION; days_since_last_passed_audit = 0"]
  - method: GET
    path: "/v1/suppliers"
    description: "List suppliers"
    roles: [SupplyChainDirector, QualityAuditor, CommissaryPlanner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BeefSupplier[]"
    side_effects: []
  - method: GET
    path: "/v1/suppliers/{id}"
    description: "Get a supplier"
    roles: [SupplyChainDirector, QualityAuditor, CommissaryPlanner]
    code: 200
    input: []
    output: BeefSupplier
    side_effects: []
  - method: POST
    path: "/v1/suppliers/{id}/retire"
    description: "Retire an APPROVED supplier"
    roles: [SupplyChainDirector]
    code: 200
    input: []
    output: BeefSupplier
    side_effects: ["SCHEDULED deliveries of this supplier → CANCELLED; version +1"]

  # --- Audit ---
  - method: POST
    path: "/v1/suppliers/{id}/audits"
    description: "Schedule an audit for a supplier"
    roles: [QualityAuditor]
    code: 201
    input: [scheduled_date]
    output: Audit
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/v1/suppliers/{id}/audits"
    description: "List audits of a supplier (FK reverse reachability)"
    roles: [QualityAuditor, SupplyChainDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Audit[]"
    side_effects: []
  - method: GET
    path: "/v1/audits/{id}"
    description: "Get an audit"
    roles: [QualityAuditor, SupplyChainDirector]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: POST
    path: "/v1/suppliers/{id}/audits/{auditId}/record-audit"
    description: "Record the result of a scheduled audit (PASS or FAIL); fires supplier transitions and cascades"
    roles: [QualityAuditor]
    code: 200
    input: [result, "findings?"]
    output: Audit
    side_effects: ["supplier status transition per BeefSupplier machine; FAIL fires supplier_fail_suspension cascade"]
  - method: POST
    path: "/v1/suppliers/{id}/audits/{auditId}/cancel"
    description: "Cancel a scheduled audit"
    roles: [QualityAuditor]
    code: 200
    input: []
    output: Audit
    side_effects: []

  # --- Commissary ---
  - method: POST
    path: "/v1/commissaries"
    description: "Register a commissary (starts PLANNING)"
    roles: [SupplyChainDirector]
    code: 201
    input: [name, lat, lng, radius_limit_km, daily_patty_capacity, daily_bun_capacity, daily_produce_capacity, delivery_days_mask, supplier_id]
    output: Commissary
    side_effects: ["raw_beef_lbs_on_hand = 0; regional_entry_open = false"]
  - method: GET
    path: "/v1/commissaries"
    description: "List commissaries (supplier_id filter gives FK reverse reachability for Commissary.supplier_id)"
    roles: [SupplyChainDirector, CommissaryPlanner, RealEstatePlanner]
    code: 200
    input: ["status?", "supplier_id?", "limit?", "offset?"]
    output: "Commissary[]"
    side_effects: []
  - method: GET
    path: "/v1/commissaries/{id}"
    description: "Get a commissary"
    roles: [SupplyChainDirector, CommissaryPlanner, RealEstatePlanner]
    code: 200
    input: []
    output: Commissary
    side_effects: []
  - method: PATCH
    path: "/v1/commissaries/{id}"
    description: "Update commissary configuration (delivery_days_mask, capacities, radius_limit_km) while PLANNING or BUILDING"
    roles: [SupplyChainDirector]
    code: 200
    input: ["radius_limit_km?", "daily_patty_capacity?", "daily_bun_capacity?", "daily_produce_capacity?", "delivery_days_mask?"]
    output: Commissary
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/commissaries/{id}/begin-build"
    description: "PLANNING → BUILDING (requires APPROVED supplier)"
    roles: [SupplyChainDirector]
    code: 200
    input: []
    output: Commissary
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/commissaries/{id}/activate"
    description: "BUILDING → OPERATIONAL; opens regional entry"
    roles: [SupplyChainDirector]
    code: 200
    input: []
    output: Commissary
    side_effects: ["regional_entry_open = true; version +1"]
  - method: POST
    path: "/v1/commissaries/{id}/recertify"
    description: "OPERATIONAL → BUILDING (no open batches); closes regional entry"
    roles: [SupplyChainDirector]
    code: 200
    input: []
    output: Commissary
    side_effects: ["regional_entry_open = false; version +1"]
  - method: POST
    path: "/v1/commissaries/{id}/decommission"
    description: "OPERATIONAL → DECOMMISSIONED (all stores closed)"
    roles: [SupplyChainDirector]
    code: 200
    input: []
    output: Commissary
    side_effects: ["trucks → INACTIVE; DRAFT routes → CANCELLED; version +1"]

  # --- Truck ---
  - method: POST
    path: "/v1/commissaries/{id}/trucks"
    description: "Register a truck at a commissary"
    roles: [CommissaryPlanner]
    code: 201
    input: [plate, route_type, cooler_capacity_cases]
    output: Truck
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/v1/commissaries/{id}/trucks"
    description: "List trucks of a commissary (FK reverse reachability)"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Truck[]"
    side_effects: []
  - method: GET
    path: "/v1/trucks/{id}"
    description: "Get a truck"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: []
    output: Truck
    side_effects: []
  - method: POST
    path: "/v1/trucks/{id}/retire"
    description: "ACTIVE → INACTIVE"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: Truck
    side_effects: ["Truck.version +1; Commissary.version +1"]

  # --- DeliveryRoute ---
  - method: POST
    path: "/v1/routes"
    description: "Create a DRAFT delivery route for a service_date with an ordered stop list"
    roles: [CommissaryPlanner]
    code: 201
    input: [commissary_id, truck_id, service_date, store_ids]
    output: DeliveryRoute
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/v1/commissaries/{id}/routes"
    description: "List routes of a commissary (FK reverse reachability)"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: ["service_date?", "limit?", "offset?"]
    output: "DeliveryRoute[]"
    side_effects: []
  - method: GET
    path: "/v1/routes/{id}"
    description: "Get a route"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/v1/routes"
    description: "List routes across commissaries (truck_id filter gives FK reverse reachability for DeliveryRoute.truck_id)"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: ["truck_id?", "commissary_id?", "limit?", "offset?"]
    output: "DeliveryRoute[]"
    side_effects: []
  - method: POST
    path: "/v1/routes/{id}/finalize"
    description: "DRAFT → FINALIZED with full window/capacity/truck checks"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/routes/{id}/complete"
    description: "FINALIZED → COMPLETED (all loaded batches DELIVERED)"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/routes/{id}/cancel"
    description: "DRAFT/FINALIZED → CANCELLED"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["version +1"]

  # --- MenuItem ---
  - method: POST
    path: "/v1/menu-items"
    description: "Create a fixed-menu item"
    roles: [SupplyChainDirector]
    code: 201
    input: [sku, name, base_price_cents, patty_count, produce_units, "active?"]
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/v1/menu-items"
    description: "List menu items"
    roles: [SupplyChainDirector, CommissaryPlanner, Associate, StoreManager, RealEstatePlanner, HRDirector, QualityAuditor]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: "MenuItem[]"
    side_effects: []
  - method: GET
    path: "/v1/menu-items/{id}"
    description: "Get a menu item"
    roles: [SupplyChainDirector, CommissaryPlanner, Associate, StoreManager]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/v1/stores"
    description: "Propose a store site (SITE_REVIEW); radius and regional-entry gates run at creation; OCC on Commissary.version"
    roles: [RealEstatePlanner]
    code: 201
    input: [commissary_id, name, lat, lng, "manager_associate_id?", expected_commissary_version]
    output: Store
    side_effects: ["distance_km computed; opening_mode NORMAL; staffing_posture computed; increments Commissary.version by 1"]
  - method: GET
    path: "/v1/stores"
    description: "List stores"
    roles: [RealEstatePlanner, SupplyChainDirector, CommissaryPlanner, HRDirector]
    code: 200
    input: ["commissary_id?", "status?", "manager_associate_id?", "limit?", "offset?"]
    output: "Store[]"
    side_effects: []
  - method: GET
    path: "/v1/stores/{id}"
    description: "Get a store"
    roles: [RealEstatePlanner, SupplyChainDirector, CommissaryPlanner, StoreManager, HRDirector]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: POST
    path: "/v1/stores/{id}/approve"
    description: "SITE_REVIEW → APPROVED (radius + delivery_day_gap_projection checks)"
    roles: [RealEstatePlanner]
    code: 200
    input: []
    output: Store
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/stores/{id}/open"
    description: "APPROVED → OPEN"
    roles: [RealEstatePlanner]
    code: 200
    input: []
    output: Store
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/stores/{id}/close"
    description: "OPEN → CLOSED; cascades to batches, routes, shifts"
    roles: [RealEstatePlanner]
    code: 200
    input: []
    output: Store
    side_effects: ["PLANNED batches → CANCELLED; DRAFT/FINALIZED routes listing the store → CANCELLED; SCHEDULED shifts → CANCELLED; version +1"]
  - method: POST
    path: "/v1/stores/{id}/begin-opening-surge"
    description: "Enter OPENING_SURGE mode (7-day window); activates RESERVE trucks"
    roles: [StoreManager]
    code: 200
    input: []
    output: Store
    side_effects: ["surge dates set; RESERVE trucks of the commissary become dispatch-eligible (no Truck/Commissary mutation); Store.version +1"]
  - method: POST
    path: "/v1/stores/{id}/end-opening-surge"
    description: "Exit OPENING_SURGE mode"
    roles: [StoreManager]
    code: 200
    input: []
    output: Store
    side_effects: ["surge fields cleared; RESERVE trucks dispatch-ineligible (no Truck/Commissary mutation); Store.version +1"]

  # --- DeliveryBatch ---
  - method: POST
    path: "/v1/batches"
    description: "Plan a delivery batch for a store; OCC on Store.version"
    roles: [CommissaryPlanner]
    code: 201
    input: [store_id, delivery_date, patty_count, bun_count, produce_units, expected_store_version]
    output: DeliveryBatch
    side_effects: ["cooler_cases_required computed; increments Store.version by 1"]
  - method: GET
    path: "/v1/stores/{id}/batches"
    description: "List batches of a store (FK reverse reachability)"
    roles: [CommissaryPlanner, StoreManager, SupplyChainDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeliveryBatch[]"
    side_effects: []
  - method: GET
    path: "/v1/batches/{id}"
    description: "Get a batch"
    roles: [CommissaryPlanner, StoreManager, SupplyChainDirector]
    code: 200
    input: []
    output: DeliveryBatch
    side_effects: []
  - method: GET
    path: "/v1/batches"
    description: "List batches across stores (filters give FK reverse reachability for commissary_id, production_run_id, route_id)"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: ["commissary_id?", "production_run_id?", "route_id?", "status?", "limit?", "offset?"]
    output: "DeliveryBatch[]"
    side_effects: []
  - method: POST
    path: "/v1/batches/{id}/load"
    description: "PLANNED → LOADED onto a route from a completed production run; gap and cooler checks"
    roles: [CommissaryPlanner]
    code: 200
    input: [production_run_id, route_id]
    output: DeliveryBatch
    side_effects: ["gap_hours_at_load computed; version +1"]
  - method: POST
    path: "/v1/batches/{id}/deliver"
    description: "LOADED → DELIVERED (route must be FINALIZED); credits store inventory"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: DeliveryBatch
    side_effects: ["delivered_at set; store on-hand inventory credited; version +1"]
  - method: POST
    path: "/v1/batches/{id}/cancel"
    description: "PLANNED → CANCELLED"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: DeliveryBatch
    side_effects: ["version +1"]

  # --- Order ---
  - method: POST
    path: "/v1/stores/{id}/orders"
    description: "Place an order at a store register; modifier pricing, inventory reservation, surge pacing"
    roles: [Associate]
    code: 201
    input: [placed_by_associate_id, lines]
    output: Order
    side_effects: ["store on-hand inventory debited; queue_position and surge_pacing_minutes computed; totals per modifier_proration"]
  - method: GET
    path: "/v1/stores/{id}/orders"
    description: "List orders of a store (FK reverse reachability)"
    roles: [Associate, StoreManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: GET
    path: "/v1/orders/{id}"
    description: "Get an order"
    roles: [Associate, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/v1/orders"
    description: "List orders across stores (placed_by_associate_id filter gives FK reverse reachability)"
    roles: [StoreManager, HRDirector]
    code: 200
    input: ["placed_by_associate_id?", "store_id?", "status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: POST
    path: "/v1/orders/{id}/serve"
    description: "PLACED → SERVED (associate of the order's store)"
    roles: [Associate]
    code: 200
    input: []
    output: Order
    side_effects: ["queue_position cleared; version +1"]
  - method: POST
    path: "/v1/orders/{id}/cancel"
    description: "PLACED → CANCELLED; inventory credited back"
    roles: [Associate]
    code: 200
    input: []
    output: Order
    side_effects: ["store on-hand inventory re-credited (compensating action); version +1"]

  # --- Associate ---
  - method: POST
    path: "/v1/associates"
    description: "Hire an associate at LEVEL_1"
    roles: [HRDirector]
    code: 201
    input: [full_name, hired_date, home_store_id, "active?"]
    output: Associate
    side_effects: ["current_level LEVEL_1; hourly_wage_cents 1750; promotion_count 0; home store staffing_posture recomputed"]
  - method: GET
    path: "/v1/associates"
    description: "List associates"
    roles: [HRDirector, StoreManager]
    code: 200
    input: ["home_store_id?", "current_level?", "active?", "limit?", "offset?"]
    output: "Associate[]"
    side_effects: []
  - method: GET
    path: "/v1/associates/{id}"
    description: "Get an associate"
    roles: [HRDirector, StoreManager, Associate]
    code: 200
    input: []
    output: Associate
    side_effects: []
  - method: GET
    path: "/v1/associates/{id}/manager-postings-filled"
    description: "List manager postings filled by this associate (FK reverse reachability for ManagerPosting.filled_by_associate_id)"
    roles: [HRDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "ManagerPosting[]"
    side_effects: []
  - method: PATCH
    path: "/v1/associates/{id}"
    description: "Update associate (active flag, home_store_id)"
    roles: [HRDirector]
    code: 200
    input: ["active?", "home_store_id?"]
    output: Associate
    side_effects: ["affected stores' staffing_posture recomputed; version +1"]
  - method: POST
    path: "/v1/associates/{id}/promote"
    description: "Promote one rung (never to MANAGER) if tenure/shift/count gates pass"
    roles: [HRDirector]
    code: 200
    input: []
    output: Associate
    side_effects: ["level +1 rung; wage recomputed; promotion_count +1; version +1; home store staffing_posture recomputed"]

  # --- ManagerPosting / ManagerApplication ---
  - method: POST
    path: "/v1/manager-postings"
    description: "Post an internal manager opening for a store"
    roles: [HRDirector]
    code: 201
    input: [store_id]
    output: ManagerPosting
    side_effects: ["posted_by_id ← caller X-User-ID"]
  - method: GET
    path: "/v1/stores/{id}/manager-postings"
    description: "List postings of a store (FK reverse reachability)"
    roles: [HRDirector, StoreManager, Associate]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ManagerPosting[]"
    side_effects: []
  - method: GET
    path: "/v1/manager-postings/{id}"
    description: "Get a posting"
    roles: [HRDirector, StoreManager, Associate]
    code: 200
    input: []
    output: ManagerPosting
    side_effects: []
  - method: POST
    path: "/v1/manager-postings/{id}/applications"
    description: "Internal SHIFT_LEAD applies to a posting"
    roles: [Associate]
    code: 201
    input: [candidate_associate_id]
    output: ManagerApplication
    side_effects: ["status PENDING"]
  - method: GET
    path: "/v1/manager-postings/{id}/applications"
    description: "List applications of a posting (FK reverse reachability)"
    roles: [HRDirector, Associate]
    code: 200
    input: ["limit?", "offset?"]
    output: "ManagerApplication[]"
    side_effects: []
  - method: GET
    path: "/v1/manager-applications"
    description: "List applications across postings (candidate_associate_id filter gives FK reverse reachability)"
    roles: [HRDirector]
    code: 200
    input: ["candidate_associate_id?", "status?", "limit?", "offset?"]
    output: "ManagerApplication[]"
    side_effects: []
  - method: GET
    path: "/v1/associates/{id}/manager-applications"
    description: "List this associate's manager applications (sub-resource FK reverse reachability)"
    roles: [HRDirector, Associate]
    code: 200
    input: ["limit?", "offset?"]
    output: "ManagerApplication[]"
    side_effects: []
  - method: POST
    path: "/v1/manager-applications/{id}/withdraw"
    description: "Candidate withdraws own application"
    roles: [Associate]
    code: 200
    input: []
    output: ManagerApplication
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/manager-postings/{id}/close"
    description: "Close posting, promoting the selected SHIFT_LEAD to MANAGER (segregation of duties: closer != poster)"
    roles: [HRDirector]
    code: 200
    input: [candidate_application_id]
    output: ManagerPosting
    side_effects: ["selected application → ACCEPTED; other PENDING applications → REJECTED; candidate → MANAGER with wage recompute and home_store move; store.manager_associate_id updated"]
  - method: POST
    path: "/v1/manager-postings/{id}/cancel"
    description: "Cancel an open posting; PENDING applications → REJECTED"
    roles: [HRDirector]
    code: 200
    input: []
    output: ManagerPosting
    side_effects: ["version +1"]

  # --- ShiftAssignment ---
  - method: POST
    path: "/v1/stores/{id}/shifts"
    description: "Schedule an associate shift (overlap + posture gates); HRDirector may schedule anywhere, StoreManager only at their own store"
    roles: [StoreManager, HRDirector]
    code: 201
    input: [associate_id, shift_start, shift_end]
    output: ShiftAssignment
    side_effects: ["store staffing_posture recomputed"]
  - method: GET
    path: "/v1/stores/{id}/shifts"
    description: "List shifts of a store (FK reverse reachability)"
    roles: [StoreManager, HRDirector]
    code: 200
    input: ["associate_id?", "limit?", "offset?"]
    output: "ShiftAssignment[]"
    side_effects: []
  - method: GET
    path: "/v1/shifts/{id}"
    description: "Get a shift"
    roles: [StoreManager, HRDirector]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []
  - method: GET
    path: "/v1/shifts"
    description: "List shifts across stores (associate_id filter gives FK reverse reachability)"
    roles: [StoreManager, HRDirector]
    code: 200
    input: ["associate_id?", "store_id?", "limit?", "offset?"]
    output: "ShiftAssignment[]"
    side_effects: []
  - method: POST
    path: "/v1/shifts/{id}/cancel"
    description: "Cancel a scheduled shift"
    roles: [StoreManager]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["store staffing_posture recomputed; version +1"]

  # --- BeefDelivery ---
  - method: POST
    path: "/v1/beef-deliveries"
    description: "Schedule a beef delivery from the commissary's dedicated supplier"
    roles: [CommissaryPlanner]
    code: 201
    input: [commissary_id, supplier_id, shipped_at, raw_beef_lbs, transit_temp_celsius]
    output: BeefDelivery
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/v1/commissaries/{id}/beef-deliveries"
    description: "List beef deliveries for a commissary (FK reverse reachability)"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: ["supplier_id?", "status?", "limit?", "offset?"]
    output: "BeefDelivery[]"
    side_effects: []
  - method: GET
    path: "/v1/beef-deliveries/{id}"
    description: "Get a beef delivery"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: []
    output: BeefDelivery
    side_effects: []
  - method: GET
    path: "/v1/beef-deliveries"
    description: "List beef deliveries across commissaries (supplier_id filter gives FK reverse reachability)"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: ["supplier_id?", "commissary_id?", "status?", "limit?", "offset?"]
    output: "BeefDelivery[]"
    side_effects: []
  - method: POST
    path: "/v1/beef-deliveries/{id}/ship"
    description: "SCHEDULED → IN_TRANSIT (supplier APPROVED + fresh audit)"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: BeefDelivery
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/beef-deliveries/{id}/confirm-receiving"
    description: "IN_TRANSIT → RECEIVED; cold-chain check; credits commissary raw beef"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: BeefDelivery
    side_effects: ["Commissary.raw_beef_lbs_on_hand += raw_beef_lbs; BeefDelivery.version +1; Commissary.version +1"]
  - method: POST
    path: "/v1/beef-deliveries/{id}/reject-receiving"
    description: "IN_TRANSIT → REJECTED; no inventory credit"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: BeefDelivery
    side_effects: ["version +1"]

  # --- ProductionRun ---
  - method: POST
    path: "/v1/commissaries/{id}/production-runs"
    description: "Plan a production run; capacity + raw-beef debit"
    roles: [CommissaryPlanner]
    code: 201
    input: [run_date, patties_planned, buns_planned, produce_units_planned]
    output: ProductionRun
    side_effects: ["beef_lbs_required computed; Commissary.raw_beef_lbs_on_hand -= beef_lbs_required; Commissary.version +1"]
  - method: GET
    path: "/v1/commissaries/{id}/production-runs"
    description: "List production runs of a commissary (FK reverse reachability)"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: ["run_date?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []
  - method: GET
    path: "/v1/production-runs/{id}"
    description: "Get a production run"
    roles: [CommissaryPlanner, SupplyChainDirector]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: POST
    path: "/v1/production-runs/{id}/complete"
    description: "PLANNED → COMPLETED; goods loadable"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["version +1"]
  - method: POST
    path: "/v1/production-runs/{id}/cancel"
    description: "PLANNED → CANCELLED; raw beef debit reversed (compensation)"
    roles: [CommissaryPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["Commissary.raw_beef_lbs_on_hand += beef_lbs_required; ProductionRun.version +1; Commissary.version +1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or names an undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Entity-backed identity check failed (wrong store's associate, non-candidate withdrawal, non-manager of the store)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK references a non-existent entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid fields, bad enum, unknown modifier code, malformed lines array" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-precondition failure on the target entity" }
  - { id: ERR_COMMISSARY_INVALID_STATE, http: 409, condition: "Commissary not in the required status for the transition" }
  - { id: ERR_STORE_INVALID_STATE, http: 409, condition: "Store not in the required status for the transition" }
  - { id: ERR_SURGE_ALREADY_ACTIVE, http: 409, condition: "begin-opening-surge on a store already in OPENING_SURGE" }
  - { id: ERR_SURGE_NOT_ACTIVE, http: 409, condition: "end-opening-surge on a store in NORMAL mode" }
  - { id: ERR_SUPPLIER_INVALID_STATE, http: 409, condition: "Supplier not in the required status for audit recording or retirement" }
  - { id: ERR_AUDIT_ALREADY_RECORDED, http: 409, condition: "Audit not SCHEDULED (already RECORDED or CANCELLED)" }
  - { id: ERR_ROUTE_INVALID_STATE, http: 409, condition: "Route not in the required status for the transition or batch linkage" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Batch not in the required status for the transition" }
  - { id: ERR_DELIVERY_INVALID_STATE, http: 409, condition: "BeefDelivery not in the required status for the transition" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "ProductionRun not in the required status for the transition" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "Order not PLACED when serve/cancel attempted" }
  - { id: ERR_POSTING_INVALID_STATE, http: 409, condition: "ManagerPosting not OPEN" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "ManagerApplication not PENDING, or candidate_application_id not a PENDING application on this posting" }
  - { id: ERR_SHIFT_INVALID_STATE, http: 409, condition: "ShiftAssignment not SCHEDULED when cancel attempted" }
  - { id: ERR_COLD_CHAIN_VIOLATION, http: 422, condition: "transit_temp_celsius strictly greater than 4.0 at receipt" }
  - { id: ERR_SUPPLIER_AUDIT_STALE, http: 422, condition: "Days since latest PASS audit strictly greater than audit_frequency_days at ship/receipt" }
  - { id: ERR_SUPPLIER_NOT_APPROVED, http: 422, condition: "Supplier status not APPROVED where required" }
  - { id: ERR_RADIUS_LIMIT_EXCEEDED, http: 422, condition: "Raw haversine distance >= Commissary.radius_limit_km" }
  - { id: ERR_DELIVERY_FREQUENCY_VIOLATION, http: 422, condition: "Projected or actual delivery gap exceeds the store's effective max gap, or service day not delivery-capable" }
  - { id: ERR_SHIFT_OVERLAP, http: 422, condition: "New shift's [start,end) overlaps an existing SCHEDULED shift of the same associate" }
  - { id: ERR_ROUTE_WINDOW_CONFLICT, http: 422, condition: "Truck or store already committed to a FINALIZED route on the same service_date" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Production run exceeds daily capacity or raw beef on hand" }
  - { id: ERR_COOLER_CAPACITY_EXCEEDED, http: 422, condition: "Aggregate loaded batch cases exceed truck cooler_capacity_cases" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Store on-hand patty/bun/produce ledger cannot cover the order footprint (all-or-nothing)" }
  - { id: ERR_PROMOTION_INELIGIBLE, http: 422, condition: "Tenure < 180 days, fewer than 2 active future shifts, promotion_count == 6, or current_level == MANAGER" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Segregation-of-duties breach: posting creator attempting close, or candidate is the store's current manager / not SHIFT_LEAD" }
  - { id: ERR_POSTURE_BLOCKS, http: 422, condition: "Store staffing_posture CRITICAL (or STRAINED during OPENING_SURGE) blocks shift creation" }
  - { id: ERR_TRUCK_INACTIVE, http: 422, condition: "Truck INACTIVE, or RESERVE truck dispatched with no surging store on the route" }
  - { id: ERR_OPEN_BATCHES_EXIST, http: 409, condition: "recertify blocked by PLANNED/LOADED batches of the commissary" }
  - { id: ERR_STORES_STILL_OPEN, http: 409, condition: "decommission blocked by non-CLOSED stores of the commissary" }
  - { id: ERR_BATCHES_NOT_DELIVERED, http: 409, condition: "Route completion blocked by non-DELIVERED batches, or run cancellation blocked by a LOADED batch" }
  - { id: ERR_OPEN_SHIFTS_EXIST, http: 409, condition: "Store close blocked by future SCHEDULED shifts" }
  - { id: ERR_RUN_NOT_COMPLETED, http: 422, condition: "Batch load references a ProductionRun not in COMPLETED status" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SupplyChainDirector
    description: "Owns commissaries, suppliers, menu catalog, and the logical clock"
    identity: "opaque"
    exclusive_operations: ["supplier registration/retirement", "commissary lifecycle (create/patch/begin-build/activate/recertify/decommission)", "menu item creation", "logical clock control"]
    shared_operations: ["read suppliers, commissaries, audits, trucks, routes, beef deliveries, production runs, batches, stores"]
  - name: CommissaryPlanner
    description: "Runs commissary daily operations: trucks, routes, batches, beef receiving, production"
    identity: "opaque"
    exclusive_operations: ["truck registration/retirement", "route create/finalize/complete/cancel", "batch plan/load/deliver/cancel", "beef delivery schedule/ship/receive/reject", "production run plan/complete/cancel"]
    shared_operations: ["read suppliers, commissaries, menu items, batches, stores"]
  - name: QualityAuditor
    description: "Schedules and records supplier audits; cannot touch deliveries or production (segregation of duties vs CommissaryPlanner)"
    identity: "opaque"
    exclusive_operations: ["audit schedule/record/cancel"]
    shared_operations: ["read suppliers, menu items"]
  - name: RealEstatePlanner
    description: "Owns store siting and lifecycle within radius limits"
    identity: "opaque"
    exclusive_operations: ["store create/approve/open/close"]
    shared_operations: ["read commissaries, stores, menu items"]
  - name: StoreManager
    description: "Manages one store's surge mode and shift schedule; identity is the store's manager associate"
    identity: "entity_backed:Associate"
    exclusive_operations: ["begin/end opening surge at own store", "shift create/cancel at own store"]
    shared_operations: ["read own store, its batches, orders, menu items, associates"]
  - name: Associate
    description: "Register associate; takes and serves orders; applies to internal manager postings"
    identity: "entity_backed:Associate"
    exclusive_operations: ["place/serve/cancel orders at own store", "apply to / withdraw from manager postings"]
    shared_operations: ["read menu items, own store's orders, postings, applications"]
  - name: HRDirector
    description: "Hires, promotes, and runs internal-only manager postings; posting creator may not close the same posting (segregation of duties)"
    identity: "opaque"
    exclusive_operations: ["associate hire/update/promote", "manager posting create/close/cancel"]
    shared_operations: ["read stores, associates, shifts, postings"]
