  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: labor_minutes_inclusive_boundary_on_submit
        grounds:
          - calculations.labor_time_standard
          - endpoints.POST_/fleets/{fleetId}/trucks/{truckId}/cases/{caseId}/claims/{claimId}/submit
        distinguishing_aspect: |
          Metric: labor_minutes_claimed vs labor_hours_allowed * 60. Endpoint:
          POST .../claims/{clid}/submit. Boundary: INCLUSIVE — exactly equal
          succeeds, +1 fails. For BASE_WARRANTY + SPN3216_FMI4 the allowed
          hours = 4.00 → boundary at 240 minutes (passes) and 241 (fails).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Fleet/Truck/Dealer/Bay; Case in PENDING_CLOSE."
            - "Two claims created on the case (both DRAFT): claim_ok with labor_minutes_claimed=240; claim_over with labor_minutes_claimed=241."
            - "Both claim_type=BASE_WARRANTY, fault_code=SPN3216_FMI4 → labor_hours_allowed = 4.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
