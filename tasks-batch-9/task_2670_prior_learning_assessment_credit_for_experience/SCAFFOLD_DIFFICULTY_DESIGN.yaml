# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Shared fixture conventions used by the chains below:
#   Program BSCS: total_credits_required 120, residency_min_credits 30,
#     pla_max_credits 30, pla_max_pct_bp 2500 -> effective_pla_cap_credits 30
#     (program_cap min(30, floor(120*2500/10000)=30) = 30; residency_headroom 90).
#   Course CS150: 6 credits, LOWER, department CS, outcomes OC1 weight_bp 8000
#     and OC2 weight_bp 2000, both mastery_threshold_bp 7000.
#   Logical clock starts at 2026-08-01T00:00:00Z and only moves via
#     POST /_clock/set_current_utc.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: pla_capacity_reserved_inclusive_vs_posted_only_divergence
        grounds:
          - calculations.program_pla_credit_capacity
          - calculations.graduation_audit_projection
          - entities.Student.fields.pla_credits_reserved
          - entities.Student.fields.pla_credits_posted
          - entities.Program.fields.effective_pla_cap_credits
          - endpoints[GET /students/{student_id}/graduation-audit]
        distinguishing_aspect: |
          Both capacity variants read the SAME Student row, yet reserved_inclusive
          subtracts pla_credits_reserved + pla_credits_awarded + pla_credits_posted
          while posted_only subtracts pla_credits_posted alone, so with one
          6-credit claim reserved and nothing posted the single graduation-audit
          response reports pla_cap_remaining_reserved_inclusive 19 and
          pla_cap_remaining_posted_only 25 at the same instant.
        test_recipe:
          setup:
            - "Program BSCS with effective_pla_cap_credits 30 and pla_upper_division_max_credits 6."
            - "Course CS150 (6 credits, LOWER) with outcomes OC1 (weight_bp 8000) and OC2 (weight_bp 2000)."
            - "Student S-1001 MATRICULATED in BSCS with transfer_credits_accepted 5 and institutional_credits_earned 0."
            - "One PORTFOLIO claim for CS150 submitted, so pla_credits_reserved is 6 while pla_credits_awarded and pla_credits_posted are both 0."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 5, institutional_credits_earned: 0 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Eight years of production Python" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Regression suite", evidence_uri: "s3://ev/2", outcome_mappings: [{ learning_outcome_id: "${oc2_id}", alignment: "SUPPORTING" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "GET /students/${stu_id}/graduation-audit"
              as: Registrar
              captures: { audit_reserved: "$.data.pla_cap_remaining_reserved_inclusive", audit_posted: "$.data.pla_cap_remaining_posted_only" }
          assert:
            - "Student.${stu_id}.pla_credits_reserved == 6"
            - "Student.${stu_id}.pla_credits_awarded == 0"
            - "Student.${stu_id}.pla_credits_posted == 0"
            - "graduation_audit.effective_pla_cap_credits == 30"
            - "graduation_audit.pla_cap_remaining_reserved_inclusive == 19"
            - "graduation_audit.pla_cap_remaining_posted_only == 25"
            - "graduation_audit.pla_cap_remaining_posted_only - graduation_audit.pla_cap_remaining_reserved_inclusive == 6"
            - "graduation_audit.upper_division_remaining == 6"
            - "graduation_audit.total_credits_applied == 5"
            - "graduation_audit.residency_satisfied == false"
            - "graduation_audit.audit_status == RESIDENCY_DEFICIENT"

      - name: coverage_provisional_self_reported_vs_assessor_verified_divergence
        grounds:
          - calculations.outcome_coverage_score
          - entities.PlaClaim.fields.provisional_coverage_bp
          - entities.PlaClaim.fields.verified_coverage_bp
          - entities.RubricScore.fields.score_ratio_bp
          - entities.LearningOutcome.fields.weight_bp
          - endpoints[POST /assessor-assignments/{assignment_id}/complete]
        distinguishing_aspect: |
          The same two artifact mappings (OC1 PRIMARY, OC2 SUPPORTING) yield
          provisional_coverage_bp 9000, while the assessor_verified variant
          replaces the self-reported credit with score_ratio_bp 7500 and 5000
          and yields verified_coverage_bp 7000 on the identical outcome weights
          — a 2000 bp divergence produced by variant choice alone, and only the
          verified figure drives the PASS decision.
        test_recipe:
          setup:
            - "Program BSCS, Course CS150 with OC1 weight_bp 8000 and OC2 weight_bp 2000, Student S-1001."
            - "FacultyAssessor E-9001 in department CS with credential_rank 2 and max_concurrent_assignments 3."
            - "A PORTFOLIO claim whose portfolio maps OC1 PRIMARY and OC2 SUPPORTING, submitted, invoice waived, assignment accepted."
            - "Rubric scores recorded: OC1 3 of 4, OC2 2 of 4."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Eight years of production Python" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Regression suite", evidence_uri: "s3://ev/2", outcome_mappings: [{ learning_outcome_id: "${oc2_id}", alignment: "SUPPORTING" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_prov_bp: "$.data.provisional_coverage_bp" }
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_id}"
              as: PlaCoordinator
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /fee-invoices/${inv_id}/waive"
              payload: { waive_reason: "HARDSHIP" }
              as: PlaCoordinator
            - call: "POST /pla-claims/${claim_id}/assessor-assignments"
              payload: { assessor_id: "${asr_id}" }
              as: PlaCoordinator
              captures: { asg_id: "$.data.id" }
            - call: "POST /assessor-assignments/${asg_id}/accept"
              as: FacultyAssessor
              as_user_id: "${asr_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc1_id}", points_awarded: 3, narrative: "Strong design evidence" }
              as: FacultyAssessor
              as_user_id: "${asr_id}"
              captures: { rs1_ratio: "$.data.score_ratio_bp" }
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc2_id}", points_awarded: 2, narrative: "Partial test evidence" }
              as: FacultyAssessor
              as_user_id: "${asr_id}"
              captures: { rs2_ratio: "$.data.score_ratio_bp" }
          trigger:
            - call: "POST /assessor-assignments/${asg_id}/complete"
              payload: { recommendation: "PASS" }
              as: FacultyAssessor
              as_user_id: "${asr_id}"
              captures: { asg_verified: "$.data.verified_coverage_bp" }
          assert:
            - "RubricScore for OC1 has score_ratio_bp == 7500 and outcome_met == true"
            - "RubricScore for OC2 has score_ratio_bp == 5000 and outcome_met == false"
            - "PlaClaim.${claim_id}.provisional_coverage_bp == 9000"
            - "PlaClaim.${claim_id}.verified_coverage_bp == 7000"
            - "AssessorAssignment.${asg_id}.verified_coverage_bp == 7000"
            - "PlaClaim.${claim_id}.provisional_coverage_bp - PlaClaim.${claim_id}.verified_coverage_bp == 2000"
            - "PlaClaim.${claim_id}.assessment_status == SCORED"
            - "PlaClaim.${claim_id}.assessor_recommendation == PASS"
            - "Portfolio.${pf_id}.status == LOCKED"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_invoice_six_line_composition_with_discount_tier_reselection
        grounds:
          - calculations.assessment_fee_invoice_total
          - entities.FeeInvoice.fields.lines
          - entities.FeeInvoice.fields.discount_bp
          - entities.FeeInvoice.fields.refunded_cents
          - endpoints[POST /_sla/run-escalation-sweep]
          - endpoints[POST /fee-invoices/{invoice_id}/payments]
        distinguishing_aspect: |
          The invoice total is not a sum of independent terms: inserting the
          negative SLA_SERVICE_CREDIT line (-4125 on a 27500 pre-credit subtotal)
          drops subtotal_cents from 27500 to 23375, which re-selects discount_bp
          from 1000 down to 500, so total_cents falls 24750 -> 22206 and the
          student is refunded 2544 — strictly LESS than the 4125 credit line,
          because the shrinking discount claws 1581 back.
        test_recipe:
          setup:
            - "Program BSCS; Course CS200 with 5 credits, LOWER, department CS, outcomes OC1 weight_bp 8000 and OC2 weight_bp 2000."
            - "Two ACTIVE CS assessors, E-9001 (credential_rank 2) and E-9002 (credential_rank 2), each max_concurrent_assignments 3."
            - "A PORTFOLIO claim for CS200 with 2 artifacts, submitted; invoice subtotal 27500, discount_bp 1000, discount 2750, total 24750, paid in full by CARD."
            - "An assignment created at the default clock 2026-08-01T00:00:00Z with sla_hours 240 and due_at 2026-08-11T00:00:00Z, accepted by E-9001."
            - "The logical clock advanced to exactly 2026-08-11T00:00:00Z so elapsed_bp is exactly 10000."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS200", title: "Data Structures", department_code: "CS", credits: 5, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Choose structures", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Analyse cost", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9002", full_name: "Dr Ivo Lang", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr2_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 5, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Production data-structure work" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Index engine", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Cost analysis", evidence_uri: "s3://ev/2", outcome_mappings: [{ learning_outcome_id: "${oc2_id}", alignment: "SUPPORTING" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_id}"
              as: PlaCoordinator
              captures: { inv_id: "$.data[0].id", inv_total_before: "$.data[0].total_cents" }
            - call: "POST /fee-invoices/${inv_id}/payments"
              payload: { amount_cents: 24750, method: "CARD" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/assessor-assignments"
              payload: { assessor_id: "${asr1_id}" }
              as: PlaCoordinator
              captures: { asg_id: "$.data.id", asg_due_at: "$.data.due_at" }
            - call: "POST /assessor-assignments/${asg_id}/accept"
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: PlaCoordinator
          trigger:
            - call: "POST /_sla/run-escalation-sweep"
              as: PlaCoordinator
              captures: { sweep_breached: "$.data.breached_count" }
          assert:
            - "Before the sweep FeeInvoice.${inv_id}.subtotal_cents == 27500, discount_bp == 1000, discount_cents == 2750, total_cents == 24750, paid_cents == 24750, balance_due_cents == 0"
            - "AssessorAssignment.${asg_id}.sla_hours == 240 and due_at == 2026-08-11T00:00:00Z and at_risk_at == 2026-08-09T00:00:00Z"
            - "sweep response breached_count == 1 and revoked_assignment_ids contains ${asg_id}"
            - "AssessorAssignment.${asg_id}.status == REVOKED and revoke_reason == SLA_BREACH and elapsed_bp == 10000 and sla_state == BREACHED"
            - "PlaClaim.${claim_id}.sla_breach_count == 1"
            - "FeeInvoice.${inv_id} SLA_SERVICE_CREDIT line == -4125"
            - "FeeInvoice.${inv_id}.subtotal_cents == 23375"
            - "FeeInvoice.${inv_id}.discount_bp == 500"
            - "FeeInvoice.${inv_id}.discount_cents == 1169"
            - "FeeInvoice.${inv_id}.total_cents == 22206"
            - "FeeInvoice.${inv_id}.refunded_cents == 2544"
            - "FeeInvoice.${inv_id}.balance_due_cents == 0"
            - "Student.${stu_id}.fee_paid_net_cents == 22206"
            - "FeeInvoice.${inv_id}.recompute_count == 1"

      - name: sla_due_at_tier_then_rush_two_step_composition
        grounds:
          - calculations.assessment_sla_due_at
          - calculations.assignment_sla_state
          - entities.AssessorAssignment.fields.sla_hours
          - entities.AssessorAssignment.fields.at_risk_at
          - entities.PlaClaim.fields.priority_tier
          - endpoints[POST /pla-claims/{claim_id}/assessor-assignments]
        distinguishing_aspect: |
          sla_hours is a two-factor composition over the source base, not a single
          lookup: PORTFOLIO base 240 h is first multiplied by the 5-artifact tier
          multiplier 12500 bp to 300 h and only then halved by RUSH_SLA_BP 5000 bp
          to 150 h, and at_risk_at is derived from the FINAL 150 h (offset 120 h),
          never from the pre-rush 300 h (which would give 240 h).
        test_recipe:
          setup:
            - "Program BSCS; Course CS200 (5 credits, LOWER, CS) with OC1 weight_bp 8000 and OC2 weight_bp 2000."
            - "One ACTIVE CS assessor E-9001, credential_rank 2, max_concurrent_assignments 3."
            - "A PORTFOLIO claim for CS200 with rush_requested true, so priority_tier is EXPEDITED, carrying 5 artifacts (tier TIER_4_TO_8)."
            - "Invoice waived so the assignment is permitted; logical clock still at the default 2026-08-01T00:00:00Z when the assignment is created."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS200", title: "Data Structures", department_code: "CS", credits: 5, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Choose structures", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Analyse cost", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 5, rush_requested: true }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Five evidence artifacts" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "A1", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/artifacts"
