            - "Second call HTTP status == 422"
            - "${err_id} == ERR_MEAL_SERVICE_WINDOW_CONFLICT"
            - "GET /sfsp/meal-service-days?site_id=${site_id} returns total_count == 1 (the rejected 2026-06-09 day was not persisted)"

