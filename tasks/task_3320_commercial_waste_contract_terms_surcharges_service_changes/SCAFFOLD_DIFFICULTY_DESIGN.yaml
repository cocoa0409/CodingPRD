            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 12 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_4, frequency_per_week: 5, base_rate_cents: 600000 }
              as: OpsManager
              captures: { sl1: $.data.id }
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/pickup-events"
              payload: { service_line_id: "${sl1}", occurred_date: "2026-09-02", outcome: MISSED }
              as: HaulerAgent
              captures: { ev1: $.data.id }
            - call: "POST /api/service-credits"
              payload: { service_line_id: "${sl1}", pickup_event_id: "${ev1}" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { cr1: $.data.id }
          trigger:
            - call: "POST /api/pickup-events/${ev1}/dispute"
              payload: {}
              as: Customer
              as_user_id: "${cu1}"
            - call: "POST /api/pickup-events/${ev1}/resolve-dispute"
              payload: { resolution: CREDITED }
              as: OpsManager
          assert:
            - "Customer.${cu1}.credit_balance_cents == 0 (forward +30000 fully compensated by -30000)"
            - "ServiceCredit.${cr1}.status == CANCELLED"
      - name: ld_assess_then_waive_conserves_balance
        grounds:
          - calculations.calc_ld_amount
          - calculations.calc_customer_credit_balance
          - state_machines.Contract.ACTIVE_to_TERMINATION_PENDING
        distinguishing_aspect: |
          Conserved quantity: Customer.credit_balance_cents under LD lifecycle.
          Untimely approval assesses 300000 (balance -300000); waiving credits back
          exactly 300000 (balance 0) while ld_status flips ASSESSED->WAIVED and the
          contract stays TERMINATION_PENDING — a different conserved path than the
          credit lifecycle (liability side, not credit side).
        test_recipe:
          setup:
            - "Clock 2026-09-01; ACTIVE contract (24mo, notice 60d), line @ 300000; untimely cancellation filed (requested_end 2027-07-04)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/customers"
              payload: { legal_name: "Waive Co", billing_email: "wv@x.example" }
              as: PlatformAdmin
              captures: { cu1: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_id: "${cu1}", start_date: "2026-09-01T00:00:00Z", term_months: 24, cancellation_notice_days: 60 }
              as: OpsManager
              captures: { ct1: $.data.id }
            - call: "POST /api/contracts/${ct1}/service-lines"
              payload: { container_size: CY_6, frequency_per_week: 3, base_rate_cents: 300000 }
              as: OpsManager
            - call: "POST /api/contracts/${ct1}/activate"
              payload: {}
              as: OpsManager
            - call: "POST /api/cancellation-requests"
              payload: { contract_id: "${ct1}", requested_end_date: "2027-07-04T00:00:00Z" }
              as: Customer
              as_user_id: "${cu1}"
              captures: { cx1: $.data.id }
          trigger:
            - call: "POST /api/cancellation-requests/${cx1}/approve"
              payload: {}
              as: OpsManager
            - call: "POST /api/cancellation-requests/${cx1}/waive-ld"
              payload: {}
              as: OpsManager
          assert:
            - "after approve: Customer.${cu1}.credit_balance_cents == -300000 and ld_status == ASSESSED"
            - "after waive: Customer.${cu1}.credit_balance_cents == 0 and ld_status == WAIVED"
            - "Contract.${ct1}.status still TERMINATION_PENDING (waive does not resurrect the contract)"
