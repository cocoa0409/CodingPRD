            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_id: "$.data.id" }
          assert:
            - "the first POST /ocs/service-visits is HTTP 422 with error_id ERR_SITE_NOT_PLANNED and no ServiceVisit row is created"
            - "Route.${route_id}.booked_minutes_total == 0 immediately after the refused request"
            - "size-and-plan returns recommended_model_id == ${model_id} (non-null) and creates one FORECAST ParLevel row for ${p_cof_id}"
            - "the second POST /ocs/service-visits, byte-identical to the first, is HTTP 201 with visit_status SCHEDULED"
            - "Route.${route_id}.booked_minutes_total == 45 after the accepted request"

      - name: placement_creation_depends_on_equipment_asset_stock_state
        grounds:
          - validations[priority=14]
          - errors[ERR_ASSET_NOT_AVAILABLE]
          - state_machines.EquipmentAsset.IN_STOCK_to_IN_SERVICE
          - concurrency_rules[POST /ocs/equipment-placements]
        distinguishing_aspect: |
          A different entity pair (EquipmentPlacement -> EquipmentAsset): the gate is
          EquipmentAsset.asset_status == IN_STOCK, a state on the fleet entity rather than a
          nullable field on the parent. One serialized asset already IN_SERVICE at site A cannot be
          placed at site B, while a second, untouched asset of the same model can.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; model URN-30; assets URN30-0001 and URN30-0002, both created IN_STOCK"
            - "one account with two planned sites A and B, neither holding a placement yet"
            - "asset URN30-0001 is then placed at site A on RENTAL terms, moving it to asset_status IN_SERVICE"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_1_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0002", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_2_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_a_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 4", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_b_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_a_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_a_v: "$.data.version" }
            - call: "POST /ocs/sites/${site_b_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_b_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_a_id}", asset_id: "${asset_1_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_a_v}" }
              as: AccountManager
              captures: { pl_a_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_b_id}", asset_id: "${asset_1_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_b_v}" }
              as: AccountManager
              captures: { err: "$.data.error_id" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_b_id}", asset_id: "${asset_2_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_b_v}" }
              as: AccountManager
              captures: { pl_b_id: "$.data.id" }
          assert:
            - "the first trigger call is HTTP 409 with error_id ERR_ASSET_NOT_AVAILABLE because EquipmentAsset.${asset_1_id}.asset_status == IN_SERVICE, not IN_STOCK"
            - "no EquipmentPlacement is created by the refused call and Site.${site_b_id}.version is unchanged at ${site_b_v} (a rejected OCC-guarded write does not consume the version)"
            - "the second trigger call, differing only in asset_id, is HTTP 201 with placement_status ACTIVE"
            - "EquipmentAsset.${asset_2_id}.asset_status == IN_SERVICE and EquipmentAsset.${asset_1_id} is still bound to placement ${pl_a_id} at site ${site_a_id}"
            - "GET /ocs/equipment-placements?asset_id=${asset_1_id} returns exactly 1 placement"

      - name: preventive_work_order_resolution_depends_on_asset_descale_state
        grounds:
          - validations[priority=22]
          - errors[ERR_DESCALE_OVERDUE]
          - state_machines.MaintenanceWorkOrder.IN_PROGRESS_to_RESOLVED
          - entities.EquipmentAsset.fields.last_descale_at
          - entities.EquipmentModel.fields.descale_interval_days
        distinguishing_aspect: |
          A third entity pair (MaintenanceWorkOrder -> EquipmentAsset, mediated by EquipmentModel):
          the RESOLVED transition of a PREVENTIVE order is blocked by a TIME-derived state of the
          asset (current_utc - last_descale_at > descale_interval_days), and the only way to clear
          it is to resolve a DESCALE order on the same asset, which rewrites last_descale_at. The
          blocked order itself never changes; a sibling entity's field unblocks it.
        test_recipe:
          setup:
            - "assets are created at clock 2026-08-03T08:00:00Z so last_descale_at == 2026-08-03T08:00:00Z; model URN-30 has descale_interval_days 90"
            - "one account, one planned site, asset URN30-0001 placed on RENTAL terms and IN_SERVICE"
            - "the clock is then advanced to 2026-11-10T08:00:00Z, i.e. 99 days after the last descale, so the asset is descale-overdue by 9 days"
            - "a PREVENTIVE work order on that asset has been advanced to IN_PROGRESS"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
