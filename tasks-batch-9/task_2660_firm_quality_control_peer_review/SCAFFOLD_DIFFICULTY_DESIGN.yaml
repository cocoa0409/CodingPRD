      - name: peer_reviewer_travel_buffer_extends_only_the_existing_window_end
        grounds:
          - calculations.peer_reviewer_selection
          - entities.PeerReviewer.fields.active_review_count
          - entities.PeerReview.fields.scheduled_window_start
          - entities.PeerReview.fields.scheduled_window_end
          - errors[ERR_REVIEWER_WINDOW_CONFLICT]
          - state_machines.PeerReview.SCHEDULED_to_PLANNING
        distinguishing_aspect: |
          A different resource with different interval semantics: one PeerReviewer already holds
          2026-09-01..2026-09-15, and three further named assignments probe the exact shape of the
          conflict test. A window starting on 2026-09-15 - the existing END date itself - conflicts,
          because the buffer extends the EXISTING end to 2026-09-20 and the comparison is strict
          (09-15 < 09-20). A window starting exactly on 2026-09-20, end + TRAVEL_BUFFER_DAYS, does not
          conflict. A window ENDING exactly on the existing start date 2026-09-01 also does not
          conflict, because the second clause r.scheduled_window_start < new.scheduled_window_end has
          no buffer at all: the buffer is one-sided. Symmetric-buffer, closed-interval or
          buffer-on-both-ends implementations each fail a different one of the three probes, and
          max_concurrent_reviews is 3 so the capacity clause never binds.
        test_recipe:
          setup:
            - "Four firms A/B/C/D, all CA, none with released engagements, so every review's target category set is empty and any reviewer qualifies."
            - "One roster reviewer 'Sennet Peer Review PC' (CA, max_concurrent_reviews 3, experience_hours 5000) with no independence conflicts."
            - "Firm A's review occupies the window 2026-09-01..2026-09-15 and is in PLANNING, a pre-report state that blocks."
