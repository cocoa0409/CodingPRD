            - "verify after rework: changeover_status == VERIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: batch_quarantine_cascades_release_demote_changeover_cancel
        grounds:
          - state_machines.NixtamalBatch.MASA_AVAILABLE_to_QUARANTINED
          - state_machines.BatchAllocation.RESERVED_to_RELEASED
          - state_machines.ProductionRun.SCHEDULED_to_PLANNED
          - state_machines.ChangeoverRecord.REQUIRED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from trigger 'batch quarantine': quarantine RELEASES the
          RESERVED allocation (link 1); the release drops run B's masa coverage
          below masa_required_kg and demotes it SCHEDULED -> PLANNED (link 2);
          the demotion cancels B's gating ChangeoverRecord (link 3) and the
          line posture falls back to AVAILABLE. Each link is caused by the
          previous link, not by the quarantine call directly.
        test_recipe:
          setup:
            - "batch MASA_AVAILABLE with 1552.0 kg"
            - "line L with run A (SOY_BLENDED, 08:00-10:00) then run B (CORN_ONLY, 12:00-14:00; exact 120-min FULL_SANITATION buffer)"
            - "run B SCHEDULED with 388.8 kg RESERVED (exactly masa_required_kg); gating changeover REQUIRED"
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-Q", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id" } }
