            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-10", capacity_head: 1 }, as: PlantManager, captures: { cd2: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd2}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LEAD_TIME_TOO_SHORT (business_temporal priority 7 beats business_fiscal priority 9)"
            - "no appointment is created for c1 on the 2026-08-10 day"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: booking_exactly_min_lead_days_allowed
        grounds:
          - validations[priority=7]
          - errors[ERR_LEAD_TIME_TOO_SHORT]
        distinguishing_aspect: |
          Metric: integer lead days with a >= boundary — exactly
          MIN_LEAD_DAYS (14) out succeeds, 13 fails. Reachable through
          POST /locker/appointments, a different metric and endpoint than the
          storage-day boundary instance.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; c1 ACTIVE; CapacityDay 2026-08-15 (exactly 14 days out) and 2026-08-14 (13 days out), each cap 1"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-15", capacity_head: 1 }, as: PlantManager, captures: { cd_ok: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-14", capacity_head: 1 }, as: PlantManager, captures: { cd_bad: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd_ok}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { ok_st: $.data.status } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd_bad}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "booking exactly 14 days out succeeds with status PENDING_DEPOSIT"
            - "booking 13 days out fails with ERR_LEAD_TIME_TOO_SHORT"

      - name: storage_free_window_last_free_day_vs_first_billable_day
        grounds:
          - calculations.storage_fee
          - entities.StorageRecord.fields.accrued_fee_cents
        distinguishing_aspect: |
          Metric: integer days_stored with the boundary between 7 (free) and 8
          (first billable day, 500 cents). Exercised through
          POST /locker/invoices/{id}/payments + GET storage — a different
          metric and endpoint than the lead-time instance.
