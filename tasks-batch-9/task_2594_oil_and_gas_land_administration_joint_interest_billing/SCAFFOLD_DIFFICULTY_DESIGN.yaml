      - name: minimum_consent_threshold_is_inclusive_at_closure
        grounds:
          - calculations.afe_consent_tally
          - state_machines.Afe.ELECTIONS_OPEN_to_PARTIALLY_CONSENTED
          - state_machines.Afe.ELECTIONS_OPEN_to_FAILED
          - endpoints.POST_/land-admin/afes/{afe_id}/election-closures
        boundary:
          metric: "Afe.consent_working_interest_pct measured against Afe.minimum_consent_pct at 6 decimal places"
          threshold: "consent == 0.800000 on both AFEs (operator 0.500000 + OA's consenting 0.300000); AFE-A requires 0.800000 and AFE-B requires 0.800001"
          at: "consent == minimum_consent_pct exactly (0.800000 vs 0.800000) - the comparison is inclusive, so AFE-A becomes PARTIALLY_CONSENTED and the non-consent machinery runs"
          just_above: "the same 0.800000 consent against a threshold of 0.800001 - one millionth short, so AFE-B becomes FAILED and every election on it is VOIDED"
        distinguishing_aspect: |
          A third metric on a third endpoint: a six-decimal percentage compared at closure, not a date
          and not a cent amount. The two AFEs are fed byte-identical election sets, so the only variable
          is the threshold, and the divergence in the SIDE EFFECTS is what makes the inclusive boundary
          consequential - PARTIALLY_CONSENTED flags non-consent interests and accrues penalty exposure,
          while FAILED voids the elections and touches no interest at all.
