      - name: analyst_cannot_open_program
        claim_type: rbac_denial
        grounds: [roles.CIO, roles.Analyst, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Analyst calling a CIO-exclusive endpoint (program open) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Program created with funded buffer"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops R1", staff_role: "OPS_ANALYST", email: "opsr1@x.com" }
              as: CIO
              captures: { ops: $.data.id }
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ana R1", staff_role: "ANALYST", email: "anar1@x.com" }
              as: CIO
              captures: { ana: $.data.id }
            - call: "POST /fof/programs"
              payload: { program_name: "PR1", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id }
            - call: "POST /fof/programs/${prog}/ledger-entries"
              payload: { entry_kind: "CONTRIBUTION", amount: 5000000 }
              as: OperationsAnalyst
              as_user_id: "${ops}"
          trigger:
            - call: "POST /fof/programs/${prog}/open"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"
            - "FoFProgram.${prog}.status == DRAFT"

      - name: ops_cannot_approve_proposal
        claim_type: rbac_denial
        grounds: [roles.InvestmentCommittee, roles.OperationsAnalyst, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "OperationsAnalyst calling ic-approve (IC-exclusive) -> ERR_UNAUTHORIZED; CIO calling dd submit (Analyst-exclusive) -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Program open; proposal RECOMMENDED (needs ic-approve)"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops R2", staff_role: "OPS_ANALYST", email: "opsr2@x.com" }
              as: CIO
              captures: { ops: $.data.id }
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ana R2", staff_role: "ANALYST", email: "anar2@x.com" }
              as: CIO
              captures: { ana: $.data.id }
            - call: "POST /fof/staff-users"
              payload: { display_name: "IC R2", staff_role: "IC_MEMBER", email: "icr2@x.com" }
              as: CIO
              captures: { ic: $.data.id }
            - call: "POST /fof/programs"
              payload: { program_name: "PR2", base_currency: "USD", total_nav_budget: 100000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id }
            - call: "POST /fof/programs/${prog}/ledger-entries"
              payload: { entry_kind: "CONTRIBUTION", amount: 20000000 }
              as: OperationsAnalyst
              as_user_id: "${ops}"
            - call: "POST /fof/programs/${prog}/open"
              payload: {}
              as: CIO
            - call: "POST /fof/programs/${prog}/pacing-plans"
              payload: { plan_label: "FY26", horizon_years: 4, start_vintage_year: 2026, target_strategy_mix: [{ strategy: "BUYOUT", weight: 1.0 }] }
              as: Analyst
              as_user_id: "${ana}"
              captures: { plan: $.data.id }
            - call: "POST /fof/programs/${prog}/pacing-plans/${plan}/approve"
              payload: {}
              as: CIO
            - call: "POST /fof/managers"
              payload: { legal_name: "RbacCap", domicile_country: "US", relationship_since_year: 2016 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { mgr: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles"
              payload: { fund_name: "Rbac I", strategy: "BUYOUT", vintage_year: 2026, fund_size_target: 400000000, mgmt_fee_rate_early: 0.02, mgmt_fee_rate_late: 0.01, investment_period_years: 5, carry_rate: 0.20, hurdle_rate: 0.08 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { veh: $.data.id }
