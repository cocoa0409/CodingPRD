  - name: corner_line_cycles_back_to_transmitted_after_backorder
    claim_type: cyclic
    grounds:
    - state_machines.DropshipOrderLine.BACKORDERED_to_TRANSMITTED
    - complexity_profile.state_machine_shape
    excluded_because:
      difficulty_instance: non_linear_state_machine / line_backorder_retransmit_cycle_returns_to_transmitted_on_fallback_vendor
      rationale: The cyclic-shape claim - re-entering TRANSMITTED with transmit_attempt_count 2 and a cleared acknowledged_at
        - is the entire subject of the named §1.8 instance.
  - name: corner_order_dual_axis_states_move_independently
    claim_type: parallel
    grounds:
    - state_machines.DropshipOrder.fulfillment_status
    - state_machines.DropshipOrder.financial_status
    excluded_because:
      difficulty_instance: non_linear_state_machine / order_fulfillment_and_financial_axes_advance_independently
      rationale: The parallel-shape claim is asserted axis-by-axis at four checkpoints inside the named §1.8 instance.
  - name: corner_item_activation_guarded_by_parent_vendor_state
    claim_type: guarded_transitions
    grounds:
    - state_machines.DropshipItem.DRAFT_to_ACTIVE
    - errors[ERR_VENDOR_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / item_activation_blocked_until_the_owning_vendor_reaches_active
      rationale: The guarded-transition claim (A->B only if the owning Vendor is ACTIVE) is asserted as both the
        failure and the success path of the named §1.8 instance.
  - name: corner_scorecard_publish_cascades_down_to_offers_and_lines
    claim_type: cascade_down
    grounds:
    - state_machines.VendorScorecard.DRAFT_to_PUBLISHED
    - state_machines.DropshipItem.ACTIVE_to_SUPPRESSED
    excluded_because:
      difficulty_instance: transitive_cascade / scorecard_publish_probation_cascades_to_suppress_offer_and_backorder_line
      rationale: The downward cascade from a published PROBATION scorecard to coverage rows, offers and lines is
        asserted hop-by-hop in the named §1.8 instance.
  - name: corner_ship_and_return_keep_the_vendor_ledger_in_sync
    claim_type: ledger_sync
    grounds:
    - calculations.vendor_settlement_ledger
    - entities.Vendor.fields.settlement_balance_cents
    excluded_because:
      difficulty_instance: compensating_invariant / cents_conservation_holds_across_return_authorization_and_rejection
      rationale: The ledger-sync claim (state change updates the ancestor's derived balances and reconciles before
        and after) is asserted at three checkpoints in the named §1.8 instance.
