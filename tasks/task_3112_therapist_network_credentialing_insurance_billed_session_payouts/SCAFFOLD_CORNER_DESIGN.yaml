            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
          trigger:
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
          assert:
            - "Session.${session_id}.quoted_cost_share_cents == 3000, being the copay alone once the allowed amount collapses to 0"
            - "the resolved rate is the NON_ELIGIBLE_RATE_CENTS constant 0, not 15000"
            - "an equivalent IN_PERSON session on the same license would resolve the full 15000, so the zero is caused by modality rather than by a missing rate row"
            - "the differential steps are skipped entirely for the VIDEO session, so no partial scaling of the contract rate occurs"

      - name: resolved_rate_floors_the_new_clinician_differential_on_an_odd_contract_rate
        claim_type: Precision
        grounds:
          - calculations.resolved_session_rate_cents
        distinguishing_aspect: "The new-clinician differential is floored rather than rounded, so an odd contract rate of 16999 inside the 90-day window resolves to 15299 — round-half-up would have produced 15300."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; the session is dated 2026-02-04T16:00:00Z, inside the 90-day window opened at onboarded_at. The contract rate is 16999 and the availability block covers Wednesday afternoon."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 16999, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - call: "POST /network/sessions"
              payload: { clinician_id: "${clinician_id}", patient_id: "${patient_id}", scheduled_start: "2026-02-04T16:00:00Z", scheduled_end: "2026-02-04T17:00:00Z", cpt_code: "90837", modality: "VIDEO" }
              as: OpsAdmin
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
          assert:
            - "the resolved rate is 15299: floor(16999 * 0.90) == 15299"
            - "the resolved rate is not 15300, which round-half-up would have produced"
            - "Session.${session_id}.quoted_cost_share_cents == 4948, computed as round_half_up(floor(15299 * 0.80) * 0.20) = round_half_up(12239 * 0.20) = 2448, then 0 + 2448 + 3000 - 500"
