          assert:
            - "the setup move A reports duplicate_match_score == 0.00, duplicate_candidate_move_id == null and duplicate_flag == NONE (its pool was empty)"
            - "the trigger returns HTTP 201 with data.duplicate_match_score == 0.71"
            - "the 0.71 decomposes as name 0.6*0.35 = 0.21 (surname Ruiz shared, given names differ), email 1.00*0.25 = 0.25 (identical address, case-folded), address 0.5*0.25 = 0.125 (same postal 30302 and state GA, different street so the hashes differ), recency (30-5)/30*0.15 = 0.125"
            - "data.duplicate_candidate_move_id == ${mv_a_id} (pool membership came from the shared email, not from the resident id, which differs)"
            - "data.duplicate_flag == NONE and data.blocked_reason == NONE because 0.71 < DUP_SUSPECT_THRESHOLD 0.80, so the move stays at INTAKE and remains actionable"

      - name: precision_duplicate_score_rounds_half_up_at_the_third_decimal
        claim_type: precision
        grounds:
          - calculations.duplicate_match_score.precision
          - calculations.duplicate_match_score.constants.W_RECENCY
          - calculations.duplicate_match_score.formula
        distinguishing_aspect: |
          A raw score that lands exactly on a half at the third decimal: 0.35 + 0.25 + 0.00 +
          0.045 = 0.645. ROUND_HALF_UP must return 0.65, while banker's rounding (Python's default
          round and float arithmetic) returns 0.64. The same call also pins the ranking rule, since
          the pool holds two earlier moves and the higher-scoring one must win.
        test_recipe:
          setup:
            - "The two Ruiz residents from the partial-component fixture, move A for Dana at 2026-08-20 in postal 30302, and move C for Marco at 2026-08-25 in postal 30302 on another street."
          setup_api_calls:
