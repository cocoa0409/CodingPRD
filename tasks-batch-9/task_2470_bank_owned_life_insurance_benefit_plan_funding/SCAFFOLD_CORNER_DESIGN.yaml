          assert:
            - "trigger call 1 returns HTTP 404 with data.error_id == ERR_PRODUCT_TYPE_NOT_FOUND"
            - "trigger call 2 returns HTTP 404 with data.error_id == ERR_REVIEW_NOT_FOUND"
            - "trigger call 3 returns HTTP 404 with data.error_id == ERR_REQUEST_NOT_FOUND"
            - "trigger call 4 returns HTTP 404 with data.error_id == ERR_POLICY_NOT_FOUND"
            - "trigger call 5 returns HTTP 404 with data.error_id == ERR_CLAIM_NOT_FOUND"
            - "trigger call 6 returns HTTP 404 with data.error_id == ERR_PLAN_NOT_FOUND"
            - "trigger call 7 returns HTTP 404 with data.error_id == ERR_ANALYSIS_NOT_FOUND"
            - "trigger call 8 returns HTTP 404 with data.error_id == ERR_RECORD_NOT_FOUND"
            - "trigger call 9 returns HTTP 404 with data.error_id == ERR_EMPLOYEE_NOT_FOUND"

      - name: two_low_yield_valuations_close_the_product_and_block_clear_diligence
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PRODUCT_CLOSED_TO_NEW]
          - calculations.valuation_net_yield.constants.CONSECUTIVE_LOW_YIELD_LIMIT
          - validations[priority=15][ERR_PRODUCT_CLOSED_TO_NEW]
        distinguishing_aspect: "Two consecutive statements below MIN_ACCEPTABLE_NET_YIELD_BPS drive the product to CLOSED_TO_NEW, and the closure is what blocks a later request: clear-diligence on a second request for the same product returns ERR_PRODUCT_CLOSED_TO_NEW (422) even though the carrier is still AUTHORIZED with a passing score."
