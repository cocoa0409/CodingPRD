    description: Record a reviewer's availability finding for an application; sets availability_reviewer_id (for SoD).
    roles: [UtilityReviewer]
    code: 201
    input: [application_id, distance_to_main_ft]
    output: AvailabilityDetermination
    side_effects: ["compute water/sewer_main_available and extension_required", "set application.availability_reviewer_id = X-User-ID"]
  - method: GET
    path: "/availability-determinations"
    description: List availability determinations (filter by application).
    roles: [UtilityReviewer, UtilityAdmin, Applicant]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: AvailabilityDetermination[]
    side_effects: []
  - method: GET
    path: "/availability-determinations/{id}"
    description: Fetch one availability determination.
    roles: [UtilityReviewer, UtilityAdmin, Applicant]
    code: 200
    input: []
    output: AvailabilityDetermination
    side_effects: []

  # ---- Main extension & developer agreement ----
  - method: POST
    path: "/main-extension-projects"
    description: Propose a main-extension project for an application.
    roles: [Developer, UtilityReviewer]
    code: 201
    input: [application_id, developer_user_id, length_ft, estimated_cost_cents, total_assessable_front_ft, total_assessable_area_sqft, reimbursement_cap_cents]
    output: MainExtensionProject
    side_effects: []
  - method: GET
    path: "/main-extension-projects"
    description: List main-extension projects (filter by application).
    roles: [Developer, UtilityReviewer, UtilityAdmin]
    code: 200
    input: ["application_id?", "developer_user_id?", "status?", "limit?", "offset?"]
    output: MainExtensionProject[]
    side_effects: []
  - method: GET
    path: "/main-extension-projects/{id}"
    description: Fetch one main-extension project (includes pool fields).
    roles: [Developer, UtilityReviewer, UtilityAdmin]
    code: 200
    input: []
    output: MainExtensionProject
    side_effects: []
  - method: POST
    path: "/main-extension-projects/{id}/start-construction"
    description: Developer begins construction.
    roles: [Developer]
    code: 200
    input: []
    output: MainExtensionProject
    side_effects: ["status -> UNDER_CONSTRUCTION"]
  - method: POST
    path: "/main-extension-projects/{id}/record-inspection"
    description: Record a passing construction inspection of the extension.
    roles: [FieldInspector]
    code: 200
    input: []
    output: MainExtensionProject
    side_effects: ["status -> INSPECTED"]
  - method: POST
    path: "/main-extension-projects/{id}/accept"
    description: Accept the completed extension; sets actual cost, reimbursable pool; cascades agreement -> COMPLETION_PENDING and flips availability.
    roles: [UtilityReviewer]
    code: 200
    input: [actual_construction_cost_cents]
    output: MainExtensionProject
    side_effects: ["status -> ACCEPTED", "set actual_construction_cost_cents + pool fields", "CASCADE: DeveloperAgreement -> COMPLETION_PENDING -> AvailabilityDetermination flipped available"]
  - method: POST
    path: "/main-extension-projects/{id}/cancel"
    description: Cancel a project not yet under construction.
    roles: [UtilityReviewer]
    code: 200
    input: []
    output: MainExtensionProject
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/developer-agreements"
    description: Create a developer agreement in DRAFT for a project.
    roles: [UtilityAdmin]
    code: 201
    input: [main_extension_project_id, developer_user_id]
    output: DeveloperAgreement
    side_effects: []
  - method: GET
    path: "/developer-agreements"
    description: List developer agreements (filter by project).
    roles: [UtilityAdmin, Developer]
    code: 200
    input: ["main_extension_project_id?", "developer_user_id?", "status?", "limit?", "offset?"]
    output: DeveloperAgreement[]
    side_effects: []
  - method: GET
    path: "/developer-agreements/{id}"
    description: Fetch one developer agreement (includes escrow balances + version).
    roles: [UtilityAdmin, Developer]
    code: 200
    input: []
    output: DeveloperAgreement
    side_effects: []
  - method: POST
    path: "/developer-agreements/{id}/offer"
    description: Offer the agreement; sets required escrow from project estimate.
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: DeveloperAgreement
    side_effects: ["status -> PENDING_ESCROW", "set required_escrow_cents"]
  - method: POST
    path: "/developer-agreements/{id}/execute"
    description: Execute once escrow is funded; cascades project -> APPROVED_TO_CONSTRUCT.
    roles: [Developer]
    code: 200
    input: []
    output: DeveloperAgreement
    side_effects: ["status -> EXECUTED", "CASCADE: MainExtensionProject -> APPROVED_TO_CONSTRUCT"]
  - method: POST
    path: "/developer-agreements/{id}/escrow-transactions"
    description: Append an escrow ledger entry (DEPOSIT/DRAWDOWN). OCC-guarded on agreement version.
    roles: [Developer]
    code: 201
    input: [txn_type, amount_cents, expected_developer_agreement_version, "memo?"]
    output: EscrowTransaction
    side_effects: ["recompute agreement escrow balances", "increment DeveloperAgreement.version by 1"]
  - method: GET
    path: "/developer-agreements/{id}/escrow-transactions"
    description: List escrow ledger entries for an agreement (reverse-reachability for EscrowTransaction).
    roles: [UtilityAdmin, Developer]
    code: 200
    input: ["txn_type?", "limit?", "offset?"]
    output: EscrowTransaction[]
    side_effects: []
  - method: POST
    path: "/developer-agreements/{id}/close"
    description: Close a completed agreement; refunds remaining escrow.
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: DeveloperAgreement
    side_effects: ["status -> CLOSED", "append REFUND EscrowTransaction for held balance"]
  - method: POST
    path: "/developer-agreements/{id}/terminate"
    description: Terminate an unexecuted agreement; refunds any escrow.
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: DeveloperAgreement
    side_effects: ["status -> TERMINATED", "refund any held escrow"]

  # ---- Inspection & meter set ----
  - method: POST
    path: "/inspections"
    description: Request an inspection for an application.
    roles: [Applicant, FieldInspector, UtilityReviewer]
    code: 201
    input: [application_id, inspector_id, inspection_type, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
