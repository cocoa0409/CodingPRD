  # ----------------------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: billing_volume_bracket_at_exactly_150000_gross
        grounds:
          - calculations.deliverable_billing
          - calculations.deliverable_billing.constants.VOLUME_BRACKETS
          - endpoints[POST /client-deliverables/{client_deliverable_id}/dispatch]
          - endpoints[POST /clients/{client_id}/scheduled-deliverables]
          - entities.ClientDeliverable.fields.gross_cents
          - entities.ClientDeliverable.fields.discount_cents
          - entities.ClientDeliverable.fields.total_cents
        distinguishing_aspect: |
          Metric: gross_cents against the 150000 volume-discount bracket floor, exercised on POST
          /client-deliverables/{id}/dispatch. A STANDARD client dispatching a 17-cell dataset lands on
          gross exactly 150000 and pays total 127500, while the 16-cell dataset lands on gross 145000
          and pays total 130500 - the higher gross bills LESS, which only holds if the >= comparison
          at exactly 150000 selects the 0.15 bracket.
        test_recipe:
          setup:
            - "Market DMA-512 with one quota cell (target 1, base incentive 2000), a published 2026Q3 universe of 120000 households for that cell and a published edit rule set."
            - "One ACTIVE household with an installed HEALTHY tuner and one 350-minute interval on 2026-08-10."
            - "A run over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z), edited and weighted FINAL (projected_average_audience 29167)."
            - "A STANDARD client contracted to the market, so tier_base_fee_cents is 65000 and delivery_sla_hours is 72."
            - "Two SCHEDULED_DATASET rows placed on that run BEFORE publication, with requested_cell_count 17 and 16 respectively; both have due_at null at placement time."
            - "The clock is moved to 2026-08-12T00:00:00Z and the run is published by a different operator, which stamps due_at 2026-08-15T00:00:00Z on both rows."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Mu", market_code: "DMA-512", dma_rank: 12, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m12_id: "$.data.id" }
