    path: "/menu-items/{id}/retire"
    description: "Retire a menu item (is_active -> false); historical appointments keep referencing it."
    roles: [SalonManager]
    code: 200
    input: []
    output: ServiceMenuItem
    side_effects: ["is_active -> false"]

  # ---- Add-ons ------------------------------------------------------------
