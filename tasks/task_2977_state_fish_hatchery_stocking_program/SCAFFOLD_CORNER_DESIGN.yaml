      - name: treating_a_reportable_finding_reports_pathogen_not_treatable
        claim_type: error_triggerable
        grounds:
          - validations.pathogen-treatable
          - validations.own-state-legal.note
          - errors.ERR_PATHOGEN_NOT_TREATABLE
        distinguishing_aspect: |
          FAILED_REPORTABLE has no treatment edge, so the generic state rule would
          say ERR_INVALID_STATE (409). The declared carve-out puts pathogen-treatable
          AHEAD of it for this endpoint, so the caller must get the specific
          ERR_PATHOGEN_NOT_TREATABLE at 422 — a reportable pathogen cannot be treated
          out, and the whole lot stays quarantined.
        test_recipe:
          setup:
            - "Inspection I1 recorded POSITIVE_REPORTABLE for WHIRLING_DISEASE, so it is FAILED_REPORTABLE and the lot is QUARANTINED"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - &c_res_pos_report
              call: "POST /health-inspections/${insp1_id}/record-result"
              payload: { result: "POSITIVE_REPORTABLE", pathogen_code: "WHIRLING_DISEASE" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
          trigger:
            - call: "POST /health-inspections/${insp1_id}/record-treatment"
              payload: { treatment_code: "FORMALIN", withdrawal_days: 21, treatment_completed_at: "2026-08-25T00:00:00Z" }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id ERR_PATHOGEN_NOT_TREATABLE"
            - "NOT ERR_INVALID_STATE (409) — the carve-out on own-state-legal makes the specific finding win on this endpoint"
            - "HealthInspection.${insp1_id}.status == FAILED_REPORTABLE, treatment_code == null, retest_count == 0"
            - "RearingLot.${lot_id}.health_status == QUARANTINED"
            - "attempting record-treatment on an inspection still in SAMPLED returns ERR_INVALID_STATE instead — the carve-out is narrow"

