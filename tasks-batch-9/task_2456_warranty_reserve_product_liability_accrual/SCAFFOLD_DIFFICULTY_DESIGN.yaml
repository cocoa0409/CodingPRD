          - entities.FieldAction.fields.is_safety_recall
          - errors[ERR_SAFETY_REMEDY_REQUIRED]
          - errors[ERR_REMEDY_OPTION_MISMATCH]
        distinguishing_aspect: |
          A DIFFERENT error-category pair from the first instance — `business_safety` x
          `business_referential` on POST /warranty/field-actions/{fieldActionId}/select-remedy:
          selecting an INTERIM_REPAIR option that belongs to a different field action on a
          SAFETY_RECALL violates both priority 17 and priority 20 and MUST return
          ERR_SAFETY_REMEDY_REQUIRED, while re-running with the foreign PERMANENT_REPAIR
          option leaves only priority 20 violated and returns ERR_REMEDY_OPTION_MISMATCH.
        test_recipe:
          setup:
            - "ProductFamily FAM-E exists."
            - "FieldAction FA-E-SAFE is a DRAFT SAFETY_RECALL over 2000 units with regulatory_notice_filed true, affected build window 2025-01-01..2025-03-31, version 1 and no remedy options of its own."
            - "FieldAction FA-E-CAMP is a DRAFT SERVICE_CAMPAIGN on the same family with affected build window 2025-06-01..2025-08-31 (62 days clear of the recall window, so the 30-day buffer check passes)."
            - "FA-E-CAMP owns two engineering-approved options: OPT-E-INT (INTERIM_REPAIR) and OPT-E-PERM (PERMANENT_REPAIR)."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-E", name: "Built-in Oven Platform", launch_date: "2024-04-01", base_warranty_months: 24, standard_cost_per_claim_cents: 21000, reserve_cap_cents: 90000000 }
              as: WarrantyAnalyst
              captures: { fam_e_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_e_id}", action_code: "FA-E-SAFE", action_type: "SAFETY_RECALL", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-03-31", affected_unit_count: 2000, regulatory_notice_filed: true }
              as: QualityEngineer
              captures: { fa_safe_id: $.data.id, fa_safe_ver: $.data.version }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_e_id}", action_code: "FA-E-CAMP", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-06-01", affected_build_end_date: "2025-08-31", affected_unit_count: 5000, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_camp_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_camp_id}/remedy-options"
              payload: { option_code: "OPT-E-INT", remedy_class: "INTERIM_REPAIR", parts_cost_cents: 1500, labor_hours_centi: 80, admin_cost_cents: 400, expected_take_rate_bps: 4000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_int_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_camp_id}/remedy-options"
              payload: { option_code: "OPT-E-PERM", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 5000, labor_hours_centi: 200, admin_cost_cents: 900, expected_take_rate_bps: 7000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_perm_id: $.data.id }
          trigger:
            - call: "POST /warranty/field-actions/${fa_safe_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_safe_ver}", remedy_option_id: "${opt_int_id}" }
              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_safe_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_safe_ver}", remedy_option_id: "${opt_perm_id}" }
              as: QualityEngineer
          assert:
            - "The first trigger call returns 422 with error_id ERR_SAFETY_REMEDY_REQUIRED, not ERR_REMEDY_OPTION_MISMATCH"
            - "The second trigger call returns 422 with error_id ERR_REMEDY_OPTION_MISMATCH"
            - "FieldAction.${fa_safe_id}.selected_remedy_option_id == null after both calls"
            - "FieldAction.${fa_safe_id}.specific_accrual_cents == 0"
            - "FieldAction.${fa_safe_id}.version == 1 (a rejected select-remedy never bumps the OCC version)"
            - "FieldAction.${fa_safe_id}.is_safety_recall == true"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: history_maturity_boundary_exact_twelve_months_and_five_thousand_units
        grounds:
          - calculations.history_maturity_classification
          - validations[priority=24]
          - entities.ProductFamily.fields.observed_history_months
          - entities.ProductFamily.fields.observed_exposure_units
          - entities.ProductFamily.fields.history_maturity_status
          - errors[ERR_INSUFFICIENT_CLAIM_HISTORY]
        distinguishing_aspect: |
          Probes the two INTEGER maturity metrics of calculations.history_maturity_classification
          (observed_history_months against 12 and observed_exposure_units against 5000) at
          exactly the threshold and exactly threshold-minus-one on POST /warranty/accruals:
          12 months plus 5000 units is MATURE and accepted, 12 months plus 4999 units is
          LIMITED and rejected, and 11 months plus 5000 units is LIMITED and rejected.
        test_recipe:
          setup:
            - "Three OPEN AccrualPeriods exist so each accrual attempt owns a fresh period version: 2026-Q3, 2026-Q4 and 2027-Q1."
            - "ProductFamily FAM-F has no analog basis, one ACTIVE vintage of exactly 5000 units and one [0,12) observation of 25 claims paid 200000 cents, so observed_history_months == 12 and observed_exposure_units == 5000."
            - "ProductFamily FAM-G is identical except its vintage ships exactly 4999 units."
            - "ProductFamily FAM-H is identical to FAM-F except its observation bucket is [0,11), so observed_history_months == 11."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { pf_id: $.data.id, pf_ver: $.data.version }
