            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork for the US carton."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: false }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
