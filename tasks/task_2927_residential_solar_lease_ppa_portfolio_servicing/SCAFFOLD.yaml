# ---------------------------------------------------------------------------
# SCAFFOLD.yaml — Residential Solar Lease & PPA Portfolio Servicing
# §1.0 through §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# ---------------------------------------------------------------------------

scenario: |
  2927. Residential Solar Lease & PPA Portfolio Servicing (Sunrun): lease vs
  power-purchase-agreement escalator and production guarantee terms, monthly
  production reconciliation against guarantee with shortfall credit,
  inverter/monitoring outage detection & truck-roll dispatch, homeowner transfer
  at sale (assumption, prepayment, or relocation) with credit qualification,
  utility net-metering successor tariff impact on savings, roof work
  removal-and-reinstall coordination, UCC fixture filing & title clearance for
  closings, end-of-term purchase/renew/removal election, warranty claims against
  module and inverter manufacturers

domain_name: residential-solar-portfolio-servicing
api_prefix: "/servicing"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under
  # /servicing; parentage is expressed purely by FK fields in request bodies and
  # by filtered list endpoints, never by nested URL segments. The only nested
  # path in §1.5 is a computed read (savings-projection), not a child resource.

  state_machine_shape: branching
  # TransferCase forks at INITIATED into a credit-qualification arm (ASSUMPTION)
  # and a direct-to-title arm (PREPAYMENT / RELOCATION) and re-joins at CLOSED
  # with a different side-effect set per transfer_type. SolarAgreement adds a
  # cycle (ACTIVE -> END_OF_TERM_PENDING -> ACTIVE on a RENEW election) plus
  # three independent state dimensions (lifecycle_state x monitoring_status x
  # service_status). WarrantyClaim adds a revision cycle
  # (SUBMITTED -> INFO_REQUESTED -> SUBMITTED) and OutageEvent adds a dispatch
  # cycle (TRIAGED -> DISPATCHED -> TRIAGED on truck-roll cancellation).

  relationship_patterns:
    - one_to_many          # SolarAgreement -> ProductionPeriod / OutageEvent / ...
    - self_referential     # SolarAgreement.relocated_from_agreement_id -> SolarAgreement.id
    - cross_aggregate      # WarrantyClaim -> TruckRoll -> OutageEvent -> ProductionPeriod

  role_model: segregation_of_duties
  # CreditUnderwriter owns the buyer credit decision, TitleAgent owns UCC
  # filings and title clearance, FieldOpsCoordinator owns monitoring/dispatch and
  # warranty claims, and within FieldOpsCoordinator the acting X-User-ID that
  # submitted a warranty claim may not be the X-User-ID that decides it.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the homeowner of record.
        constraints: "1..120 chars, non-blank"
      - name: email
        type: string
        source: input
        description: Contact email; used as the servicing portal login handle.
        constraints: "must contain '@'; unique across Homeowner"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the homeowner's mailing address.
        constraints: "exactly 2 uppercase letters"
      - name: fico_score
        type: integer
        source: input
        description: Most recent FICO score on file; input to credit qualification.
        constraints: "300..850"
      - name: dti_ratio
        type: number
        source: input
        description: Debt-to-income ratio expressed as a fraction of gross income.
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: monthly_income_cents
        type: integer
        source: input
        description: Verified gross monthly income in cents.
        constraints: ">= 0"

  - name: UtilityTariff
    parent: null
    common_fields: false
    # Configuration entity. Immutable once created: no PUT/PATCH/DELETE endpoint
    # exists in §1.5 and it carries no `version` field, so tariff terms can never
    # be edited under an agreement's feet — a successor tariff is a new row and an
    # agreement is moved onto it explicitly via POST /agreements/{id}/apply-tariff.
    fields:
      - name: utility_code
        type: string
        source: input
        description: Utility identifier (e.g. PGE, SCE, SRP).
        constraints: "2..12 uppercase alphanumeric chars"
      - name: tariff_code
        type: string
        source: input
        description: Utility's own schedule code for this tariff.
        constraints: "1..40 chars; unique together with utility_code"
      - name: generation
        type: enum
        source: input
        description: Net-metering generation this schedule belongs to.
        constraints: "one of NEM_1, NEM_2, NEM_3"
      - name: retail_rate_per_kwh_millicents
        type: integer
        source: input
        description: Blended retail import rate in millicents per kWh (1 millicent = 0.001 cent).
        constraints: "> 0"
      - name: export_credit_rate_per_kwh_millicents
        type: integer
        source: input
        description: Credit paid for exported kWh, in millicents per kWh.
        constraints: ">= 0"
      - name: monthly_fixed_charge_cents
        type: integer
        source: input
        description: Non-bypassable monthly utility charge in cents.
        constraints: ">= 0"
      - name: effective_from_date
        type: string
        source: input
        description: First calendar date this schedule applies (ISO date, YYYY-MM-DD).
        constraints: "valid ISO date"
      - name: grandfathers_predecessors
        type: boolean
        source: input
        description: >-
          True when systems interconnected before effective_from_date retain their
          prior export credit rate for GRANDFATHER_TERM_YEARS.
        default: false

  - name: SolarAgreement
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the lessee (LEASE) or offtaker (PPA) of record. Reassigned by an ASSUMPTION transfer close."
      - name: tariff_id
        type: string
        source: input
        description: "FK -> UtilityTariff.id; the net-metering schedule the host site is billed on today."
      - name: relocated_from_agreement_id
        type: string
        source: system
        description: "FK -> SolarAgreement.id; set only on a successor agreement minted by a RELOCATION transfer close; null otherwise."
        default: null
      - name: site_address
        type: string
        source: input
        description: Street address of the host site.
        constraints: "1..200 chars"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the host site.
        constraints: "exactly 2 uppercase letters"
      - name: product_type
        type: enum
        source: input
        description: LEASE bills a fixed escalating monthly rent; PPA bills escalating cents per metered kWh.
        constraints: "one of LEASE, PPA"
      - name: term_years
        type: integer
        source: input
        description: Initial contract term in whole years.
        constraints: "one of 10, 15, 20, 25"
      - name: contract_start_date
        type: string
        source: input
        description: First day of contract month 1 (ISO date).
        constraints: "valid ISO date whose day-of-month is exactly 01"
      - name: contract_end_date
        type: string
        source: computed
        description: contract_start_date plus term_years years minus one day; extended by each executed RENEW election.
      - name: escalator_pct
        type: number
        source: input
        description: Annual escalation applied to the lease payment or PPA rate, as a fraction.
        constraints: "0.0000..0.0500, 4 decimal places"
      - name: base_monthly_lease_cents
        type: integer
        source: input
        description: Contract-year-1 monthly rent in cents. Required when product_type == LEASE, must be null when PPA.
        default: null
      - name: base_ppa_rate_per_kwh_millicents
        type: integer
        source: input
        description: Contract-year-1 PPA rate in millicents per kWh. Required when product_type == PPA, must be null when LEASE.
        default: null
      - name: guaranteed_annual_kwh
        type: integer
        source: input
        description: Guaranteed annual production in whole kWh, before seasonality allocation.
        constraints: "> 0"
      - name: guarantee_band_pct
        type: number
        source: input
        description: Deadband below the expected figure inside which no shortfall credit is owed.
        default: 0.05
        constraints: "0.0000..0.2000, 4 decimal places"
      - name: system_dc_kw
        type: number
        source: input
        description: Nameplate DC capacity in kW; drives installed cost, FMV and removal pricing.
        constraints: "> 0, 2 decimal places"
      - name: lifecycle_state
        type: enum
        source: system
        description: Contract lifecycle dimension; see §1.2 SolarAgreement.
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, TRANSFER_PENDING, END_OF_TERM_PENDING, PREPAID_CLOSED, PURCHASED_CLOSED, REMOVED_CLOSED, RELOCATED_CLOSED"
      - name: monitoring_status
        type: enum
        source: system
        description: Monitoring/dispatch dimension; evolves independently of lifecycle_state.
        default: MONITORING_OK
        constraints: "one of MONITORING_OK, OUTAGE_OPEN, TRUCK_ROLL_DISPATCHED"
      - name: service_status
        type: enum
        source: system
        description: Physical-asset dimension; evolves independently of lifecycle_state and monitoring_status.
        default: IN_SERVICE
        constraints: "one of IN_SERVICE, ROOF_WORK_SUSPENDED, DECOMMISSION_PENDING, DECOMMISSIONED"
      - name: current_contract_year
        type: integer
        source: computed
        description: >-
          Contract year containing the logical clock's current date, computed as
          ((clock_year*12 + clock_month) - (start_year*12 + start_month)) // 12 + 1,
          clamped to 1..term_years + 12 * renewal_count.
      - name: credit_earned_cents
        type: integer
        source: computed
        description: >-
          Running total of shortfall credit granted to this agreement; see §1.3
          credit_ledger_invariant for the exact defining formula.
        default: 0
      - name: credit_applied_cents
        type: integer
        source: computed
        description: Running total of credit consumed by period settlements and by a PREPAYMENT payoff.
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Unapplied credit: credit_earned_cents minus credit_applied_cents. Never negative."
        default: 0
      - name: grandfathered_export_rate_millicents
        type: integer
        source: computed
        description: >-
          Export credit rate snapshotted from the agreement's tariff at the moment
          of activation; frozen thereafter and used by savings_projection_annual
          whenever tariff_grandfathered is true.
      - name: tariff_grandfathered
        type: boolean
        source: computed
        description: >-
          Recomputed at activation and on every apply-tariff; true when the current
          tariff grandfathers predecessors, the agreement started before that
          tariff's effective_from_date, and the clock is still inside
          GRANDFATHER_TERM_YEARS of contract_start_date.
        default: false
      - name: renewal_count
        type: integer
        source: computed
        description: Number of executed RENEW elections; each adds RENEWAL_TERM_YEARS to contract_end_date.
        default: 0
      - name: open_outage_count
        type: integer
        source: computed
        description: >-
          Number of OutageEvent rows for this agreement whose status is OPEN,
          TRIAGED or DISPATCHED. monitoring_status is derived from this set; see
          §1.3 monitoring_status_projection.
        default: 0
      - name: excused_downtime_minutes
        type: integer
        source: computed
        description: >-
          Portfolio-level running total of excused outage minutes; see §1.3
          excused_downtime_invariant. Increases only when an outage resolves with an
          operator-owned root cause and is restored exactly when that resolution is
          compensated.
        default: 0
  - name: ProductionPeriod
    parent: SolarAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SolarAgreement.id; the agreement this billing month belongs to."
      - name: period_year
        type: integer
        source: input
        description: Calendar year of the billing month.
        constraints: "2020..2099"
      - name: period_month
        type: integer
        source: input
        description: Calendar month of the billing month.
        constraints: "1..12; unique together with agreement_id"
      - name: metered_kwh
        type: integer
        source: input
        description: Inverter-reported production for the month in whole kWh.
        constraints: ">= 0"
      - name: contract_year
        type: integer
        source: computed
        description: >-
          Contract year this month falls in, computed from the agreement's
          contract_start_date exactly as SolarAgreement.current_contract_year but
          using period_year/period_month instead of the clock.
      - name: due_date
        type: string
        source: computed
        description: Last calendar day of the period month plus PAYMENT_TERM_DAYS days (ISO date).
      - name: gross_expected_kwh
        type: integer
        source: computed
        description: See §1.3 monthly_expected_production.
      - name: excused_days
        type: integer
        source: computed
        description: See §1.3 monthly_expected_production; whole days of excused unavailability inside the month.
      - name: adjusted_expected_kwh
        type: integer
        source: computed
        description: See §1.3 monthly_expected_production; gross_expected_kwh pro-rated for excused_days.
      - name: guarantee_floor_kwh
        type: integer
        source: computed
        description: See §1.3 monthly_shortfall_credit; adjusted_expected_kwh net of the guarantee band.
      - name: shortfall_kwh
        type: integer
        source: computed
        description: See §1.3 monthly_shortfall_credit; zero unless metered_kwh is strictly below guarantee_floor_kwh.
        default: 0
      - name: escalated_rate_millicents
        type: integer
        source: computed
        description: >-
          See §1.3 escalated_billing_rate, PPA variant: the contract-year escalated
          PPA rate in millicents per kWh. Always 0 for a LEASE agreement.
        default: 0
      - name: escalated_monthly_rent_cents
        type: integer
        source: computed
        description: >-
          See §1.3 escalated_billing_rate, LEASE variant: the contract-year escalated
          monthly rent in cents. Always 0 for a PPA agreement.
        default: 0
      - name: credit_rate_millicents
        type: integer
        source: computed
        description: See §1.3 monthly_shortfall_credit; escalated PPA rate for PPA, tariff retail rate for LEASE.
      - name: credit_cents
        type: integer
        source: computed
        description: See §1.3 monthly_shortfall_credit; the shortfall credit this month earns.
        default: 0
      - name: gross_due_cents
        type: integer
        source: computed
        description: See §1.3 period_net_settlement, step 1.
        default: 0
      - name: credit_applied_cents
        type: integer
        source: computed
        description: See §1.3 period_net_settlement, step 3; credit drawn from the agreement balance for this month.
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: See §1.3 period_net_settlement, step 4.
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: See §1.3 period_net_settlement, step 5; assessed only when the clock is past due_date.
        default: 0
      - name: total_invoiced_cents
        type: integer
        source: computed
        description: See §1.3 period_net_settlement, step 6.
        default: 0
      - name: status
        type: enum
        source: system
        description: See §1.2 ProductionPeriod.
        default: RECORDED
        constraints: "one of RECORDED, RECONCILED, CREDIT_ISSUED"

  - name: GuaranteeTrueUp
    parent: SolarAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SolarAgreement.id; the agreement whose contract year is being trued up."
      - name: contract_year
        type: integer
        source: input
        description: Contract year being trued up; the year must be fully elapsed relative to the clock.
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: >-
          Selects the §1.3 annual_guarantee_true_up variant. MONTHLY_ROLLING sums
          the twelve per-month credits; ANNUAL_TRUE_UP compares annual totals once.
        constraints: "one of MONTHLY_ROLLING, ANNUAL_TRUE_UP"
      - name: total_metered_kwh
        type: integer
        source: computed
        description: Sum of metered_kwh over the twelve ProductionPeriod rows in contract_year.
      - name: total_adjusted_expected_kwh
        type: integer
        source: computed
        description: Sum of adjusted_expected_kwh over the same twelve rows.
      - name: annual_guarantee_floor_kwh
        type: integer
        source: computed
        description: See §1.3 annual_guarantee_true_up; only populated for the ANNUAL_TRUE_UP variant, else 0.
        default: 0
      - name: annual_shortfall_kwh
        type: integer
        source: computed
        description: See §1.3 annual_guarantee_true_up.
        default: 0
      - name: credit_rate_millicents
        type: integer
        source: computed
        description: Rate used to price annual_shortfall_kwh under the ANNUAL_TRUE_UP variant.
        default: 0
      - name: gross_credit_cents
        type: integer
        source: computed
        description: See §1.3 annual_guarantee_true_up; the variant's raw credit figure before offsets.
        default: 0
      - name: already_issued_credit_cents
        type: integer
        source: computed
        description: >-
          Sum of credit_cents over ProductionPeriod rows in this contract_year whose
          status is CREDIT_ISSUED, evaluated at compute time.
        default: 0
      - name: net_credit_cents
        type: integer
        source: computed
        description: "max(0, gross_credit_cents - already_issued_credit_cents)."
        default: 0
      - name: covered_period_ids
        type: array
        source: computed
        description: >-
          Ids of the twelve ProductionPeriod rows aggregated by this true-up, in
          ascending (period_year, period_month) order. Recording only; posting does
          not alter those rows' status.
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID that posted this true-up; null while DRAFT.
        default: null
      - name: voided_by_user_id
        type: string
        source: system
        description: X-User-ID that voided this true-up; null unless VOID.
        default: null
      - name: status
        type: enum
        source: system
        description: See §1.2 GuaranteeTrueUp.
        default: DRAFT
        constraints: "one of DRAFT, POSTED, VOID"

  - name: OutageEvent
    parent: SolarAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SolarAgreement.id; the monitored system that alarmed."
      - name: inverter_serial
        type: string
        source: input
        description: Serial of the inverter or gateway that reported the fault.
        constraints: "1..40 chars, non-blank"
      - name: outage_type
        type: enum
        source: input
        description: Alarm classification reported by the monitoring platform.
        constraints: "one of INVERTER_FAULT, COMMS_LOSS, PRODUCTION_ANOMALY"
      - name: detected_at
        type: string
        source: input
        description: ISO-8601 UTC instant the monitoring platform first saw the fault.
        constraints: "must not be after the current logical clock instant"
      - name: resolved_at
        type: string
        source: computed
        description: ISO-8601 UTC instant the event left the open set; null until RESOLVED or FALSE_POSITIVE.
        default: null
      - name: severity
        type: enum
        source: computed
        description: See §1.3 outage_severity_grade.
        constraints: "one of LOW, MEDIUM, HIGH"
      - name: downtime_minutes
        type: integer
        source: computed
        description: >-
          Whole minutes from detected_at to resolved_at, or to the current clock
          instant while the event is still open. Truncated toward zero.
        default: 0
      - name: excused
        type: boolean
        source: computed
        description: >-
          True when the resolved root cause is one the operator owns
          (STRING_FAULT or COMMS_ONLY), which makes the downtime excused for
          guarantee purposes. Set at truck-roll completion; false otherwise.
        default: false
      - name: status
        type: enum
        source: system
        description: See §1.2 OutageEvent.
        default: OPEN
        constraints: "one of OPEN, TRIAGED, DISPATCHED, RESOLVED, FALSE_POSITIVE"

  - name: TruckRoll
    parent: OutageEvent
    common_fields: true
    fields:
      - name: outage_event_id
        type: string
        source: input
        description: "FK -> OutageEvent.id; the alarm this dispatch answers. Must be in TRIAGED status."
      - name: agreement_id
        type: string
        source: computed
        description: "FK -> SolarAgreement.id; copied from the linked OutageEvent, not accepted from the request body."
      - name: technician_code
        type: string
        source: input
        description: Identifier of the assigned field technician; the unit against which window overlap is checked.
        constraints: "1..24 chars, non-blank"
      - name: scheduled_window_start
        type: string
        source: input
        description: ISO-8601 UTC start of the technician's on-site window (inclusive).
      - name: scheduled_window_end
        type: string
        source: input
        description: >-
          ISO-8601 UTC end of the technician's on-site window (exclusive). Must be
          strictly after scheduled_window_start and no more than
          MAX_TRUCK_ROLL_WINDOW_HOURS hours later.
      - name: disposition
        type: enum
        source: input
        description: >-
          Outcome supplied at completion. SERVICE_COMPLETE drives status COMPLETED;
          NO_ACCESS drives status NO_ACCESS. Null while SCHEDULED.
        default: null
        constraints: "one of SERVICE_COMPLETE, NO_ACCESS when present"
      - name: root_cause
        type: enum
        source: input
        description: >-
          Diagnosed cause supplied at completion. Required when disposition is
          SERVICE_COMPLETE; must be omitted when disposition is NO_ACCESS.
        default: null
        constraints: "one of INVERTER_FAULT, MODULE_DEFECT, STRING_FAULT, COMMS_ONLY, HOMEOWNER_CAUSED when present"
      - name: billable_to
        type: enum
        source: computed
        description: See §1.3 truck_roll_cost_allocation; null while SCHEDULED.
        default: null
        constraints: "one of PENDING_MANUFACTURER, SUNRUN_OM, WARRANTY, HOMEOWNER when present"
      - name: labor_cost_cents
        type: integer
        source: computed
        description: See §1.3 truck_roll_cost_allocation; 0 while SCHEDULED.
        default: 0
      - name: completed_at
        type: string
        source: computed
        description: ISO-8601 UTC clock instant at which the roll was closed out; null while SCHEDULED or CANCELLED.
        default: null
      - name: dispatched_by_user_id
        type: string
        source: system
        description: X-User-ID that created the dispatch.
      - name: diagnosed_by_user_id
        type: string
        source: system
        description: X-User-ID that closed the roll out with a root cause; null until completion.
        default: null
      - name: status
        type: enum
        source: system
        description: See §1.2 TruckRoll.
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, NO_ACCESS, CANCELLED"

  - name: RoofWorkOrder
    parent: SolarAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SolarAgreement.id; the system to be removed and reinstalled for roof work."
      - name: requested_removal_date
        type: string
        source: input
        description: ISO date on which the array is to come off the roof. Must be on or after the clock date.
      - name: reinstall_target_date
        type: string
        source: input
        description: >-
          ISO date on which the array is to be reinstalled. Must be strictly after
          requested_removal_date and within MAX_ROOF_WORK_SPAN_DAYS days of it.
      - name: roofer_company
        type: string
        source: input
        description: Name of the third-party roofing contractor.
        constraints: "1..80 chars, non-blank"
      - name: quote_cents
        type: integer
        source: input
        description: Removal-and-reinstall labour quote in cents, supplied at quoting time.
        default: null
        constraints: ">= 0 when present"
      - name: suspension_start_date
        type: string
        source: computed
        description: >-
          Equal to requested_removal_date. Together with suspension_end_date this is
          the closed interval during which production is excused.
      - name: suspension_end_date
        type: string
        source: computed
        description: Equal to reinstall_target_date; the interval is inclusive of both endpoints.
      - name: suspension_days
        type: integer
        source: computed
        description: "(suspension_end_date - suspension_start_date) in days, plus 1 for inclusivity."
      - name: contract_year
        type: integer
        source: computed
        description: Contract year containing suspension_start_date; the unit for the per-year roof-work cap.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID that approved the work order; null until approval.
        default: null
      - name: status
        type: enum
        source: system
        description: See §1.2 RoofWorkOrder.
        default: REQUESTED
        constraints: "one of REQUESTED, QUOTED, APPROVED, PANELS_REMOVED, ROOF_COMPLETE, REINSTALLED, CANCELLED"

  - name: TransferCase
    parent: SolarAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SolarAgreement.id; the agreement being transferred, prepaid or relocated."
      - name: seller_homeowner_id
        type: string
        source: computed
        description: "FK -> Homeowner.id; copied from the agreement's homeowner_id at creation."
      - name: buyer_homeowner_id
        type: string
        source: input
        description: >-
          FK -> Homeowner.id; the purchasing homeowner. Required when transfer_type
          is ASSUMPTION and must be omitted for PREPAYMENT and RELOCATION.
        default: null
      - name: successor_agreement_id
        type: string
        source: computed
        description: >-
          FK -> SolarAgreement.id; the new agreement minted when a RELOCATION case
          closes. Null for every other transfer_type and before close.
        default: null
      - name: transfer_type
        type: enum
        source: input
        description: >-
          ASSUMPTION hands the contract to a qualified buyer, PREPAYMENT buys out
          the remaining term, RELOCATION moves the system to a new site under a
          successor agreement.
        constraints: "one of ASSUMPTION, PREPAYMENT, RELOCATION"
      - name: closing_date
        type: string
        source: input
        description: ISO date of the real-estate closing. Must be on or after the clock date.
      - name: new_site_address
        type: string
        source: input
        description: Destination address; required when transfer_type is RELOCATION, must be omitted otherwise.
        default: null
      - name: elapsed_term_months
        type: integer
        source: computed
        description: Whole contract months from contract_start_date up to but excluding the closing month.
      - name: remaining_term_months
        type: integer
        source: computed
        description: "(term_years + renewal_count * RENEWAL_TERM_YEARS) * 12 minus elapsed_term_months, floored at 0."
      - name: payoff_method
        type: enum
        source: computed
        description: See §1.3 transfer_payoff_quote; NONE for ASSUMPTION.
        constraints: "one of NPV_REMAINING_PAYMENTS, UNAMORTIZED_SYSTEM_COST, NONE"
      - name: payoff_quote_cents
        type: integer
        source: computed
        description: See §1.3 transfer_payoff_quote; 0 for ASSUMPTION.
        default: 0
      - name: credit_fico_snapshot
        type: integer
        source: computed
        description: Buyer's fico_score captured when the credit review is run; null otherwise.
        default: null
      - name: credit_dti_snapshot
        type: number
        source: computed
        description: Buyer's dti_ratio captured when the credit review is run; null otherwise.
        default: null
      - name: credit_composite_score
        type: number
        source: computed
        description: See §1.3 buyer_credit_qualification; null until the credit review is run.
        default: null
      - name: credit_decision
        type: enum
        source: computed
        description: See §1.3 buyer_credit_qualification; null until the credit review is run.
        default: null
        constraints: "one of APPROVED, APPROVED_WITH_DEPOSIT, DECLINED when present"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: See §1.3 buyer_credit_qualification; 0 unless credit_decision is APPROVED_WITH_DEPOSIT.
        default: 0
      - name: credit_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the underwriter that ran the credit review; null until then.
        default: null
      - name: title_cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the title agent that cleared title; null until then.
        default: null
      - name: status
        type: enum
        source: system
        description: See §1.2 TransferCase.
        default: INITIATED
        constraints: "one of INITIATED, CREDIT_REVIEW, CREDIT_APPROVED, CREDIT_DECLINED, TITLE_CLEARED, CLOSED, CANCELLED"

  - name: UccFiling
    parent: SolarAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SolarAgreement.id; the agreement whose rooftop fixture is perfected by this filing."
      - name: requested_by_transfer_case_id
        type: string
        source: computed
        description: >-
          FK -> TransferCase.id; set when a subordination or termination on this
          filing was driven by a transfer case, so title clearance can be traced.
          Null for filings never touched by a transfer.
        default: null
      - name: filing_number
        type: string
        source: input
        description: County or secretary-of-state filing number.
        constraints: "1..32 chars, non-blank; unique across UccFiling"
      - name: jurisdiction_code
        type: string
        source: input
        description: Recording jurisdiction identifier, e.g. CA-ALAMEDA.
        constraints: "1..24 chars, non-blank"
      - name: filing_type
        type: enum
        source: input
        description: FIXTURE_FILING is the original perfection; AMENDMENT amends an existing one.
        constraints: "one of FIXTURE_FILING, AMENDMENT"
      - name: filed_date
        type: string
        source: input
        description: ISO date the instrument was recorded. Must not be after the clock date.
      - name: terminated_date
        type: string
        source: computed
        description: ISO clock date on which the filing was terminated; null unless status is TERMINATED.
        default: null
      - name: status
        type: enum
        source: system
        description: See §1.2 UccFiling.
        default: FILED
        constraints: "one of FILED, SUBORDINATION_REQUESTED, SUBORDINATED, TERMINATION_REQUESTED, TERMINATED"

  - name: EndOfTermElection
    parent: SolarAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SolarAgreement.id; the agreement reaching the end of its term."
      - name: election_type
        type: enum
        source: input
        description: >-
          PURCHASE buys the system at fair market value, RENEW extends the term at a
          discounted payment, REMOVAL has the operator remove the system.
        constraints: "one of PURCHASE, RENEW, REMOVAL"
      - name: elected_on_date
        type: string
        source: computed
        description: ISO clock date on which the election was submitted; the value tested against the window.
      - name: window_open_date
        type: string
        source: computed
        description: See §1.3 end_of_term_election_pricing; contract_end_date minus ELECTION_WINDOW_OPEN_DAYS days.
      - name: window_close_date
        type: string
        source: computed
        description: >-
          See §1.3 end_of_term_election_pricing; contract_end_date minus
          ELECTION_WINDOW_CLOSE_DAYS days. The window is inclusive of this date.
      - name: elapsed_full_years
        type: integer
        source: computed
        description: Whole years from contract_start_date to elected_on_date; the depreciation clock.
      - name: residual_pct
        type: number
        source: computed
        description: See §1.3 end_of_term_election_pricing.
      - name: fair_market_value_cents
        type: integer
        source: computed
        description: See §1.3 end_of_term_election_pricing; 0 unless election_type is PURCHASE.
        default: 0
      - name: renewal_monthly_payment_cents
        type: integer
        source: computed
        description: See §1.3 end_of_term_election_pricing; 0 unless election_type is RENEW.
        default: 0
      - name: removal_cost_cents
        type: integer
        source: computed
        description: See §1.3 end_of_term_election_pricing; 0 unless election_type is REMOVAL.
        default: 0
      - name: elected_amount_cents
        type: integer
        source: computed
        description: >-
          The one of the three figures above that this election_type selects; the
          single number carried into execution.
        default: 0
      - name: elected_by_user_id
        type: string
        source: system
        description: X-User-ID that submitted the election.
      - name: accepted_at
        type: string
        source: computed
        description: ISO-8601 UTC clock instant of acceptance; null until ACCEPTED.
        default: null
      - name: executed_at
        type: string
        source: computed
        description: ISO-8601 UTC clock instant of execution; null until EXECUTED.
        default: null
      - name: status
        type: enum
        source: system
        description: See §1.2 EndOfTermElection.
        default: SUBMITTED
        constraints: "one of SUBMITTED, ACCEPTED, EXECUTED, WITHDRAWN"

  - name: WarrantyClaim
    parent: TruckRoll
    common_fields: true
    fields:
      - name: truck_roll_id
        type: string
        source: input
        description: >-
          FK -> TruckRoll.id; the completed service visit that diagnosed the failed
          component. Must be COMPLETED with a manufacturer-owned root_cause.
      - name: agreement_id
        type: string
        source: computed
        description: "FK -> SolarAgreement.id; copied from the linked TruckRoll, not accepted from the request body."
      - name: component_type
        type: enum
        source: input
        description: >-
          MODULE claims run against the module manufacturer's 25-year warranty,
          INVERTER claims against the inverter manufacturer's 10-year warranty.
        constraints: "one of MODULE, INVERTER"
      - name: manufacturer_code
        type: string
        source: input
        description: Manufacturer identifier the claim is filed against.
        constraints: "2..24 uppercase alphanumeric chars"
      - name: serial_number
        type: string
        source: input
        description: Serial number of the failed component.
        constraints: "1..40 chars, non-blank"
      - name: component_install_date
        type: string
        source: input
        description: ISO date the component was installed; the start of its warranty term.
      - name: claim_amount_cents
        type: integer
        source: input
        description: Amount claimed from the manufacturer in cents.
        constraints: "> 0"
      - name: warranty_term_years
        type: integer
        source: computed
        description: >-
          MODULE_WARRANTY_YEARS for MODULE, INVERTER_WARRANTY_YEARS for INVERTER;
          the window is measured from component_install_date.
      - name: warranty_expires_on
        type: string
        source: computed
        description: component_install_date plus warranty_term_years years, minus one day (ISO date, inclusive).
      - name: approved_amount_cents
        type: integer
        source: input
        description: >-
          Amount the manufacturer allowed, supplied at approval. Must not exceed
          claim_amount_cents. Null until APPROVED.
        default: null
      - name: info_request_note
        type: string
        source: input
        description: Adjuster's note explaining what additional information is required.
        default: null
        constraints: "1..500 chars when present"
      - name: revision_count
        type: integer
        source: computed
        description: >-
          Number of times this claim has been re-submitted after an information
          request; capped by MAX_CLAIM_REVISIONS.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the most recent submission; null while DRAFT.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID that approved or denied the claim; null until decided.
        default: null
      - name: status
        type: enum
        source: system
        description: See §1.2 WarrantyClaim.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, INFO_REQUESTED, APPROVED, DENIED"

# ---------------------------------------------------------------------------
# §1.2 State Machines
# SolarAgreement carries three independent dimensions; each is listed as its own
# machine and each advances without disturbing the other two.
# ---------------------------------------------------------------------------
state_machines:

  - entity: SolarAgreement
    dimension: lifecycle_state
    initial_state: DRAFT
    terminal_states: [PREPAID_CLOSED, PURCHASED_CLOSED, REMOVED_CLOSED, RELOCATED_CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /servicing/agreements/{agreement_id}/activate"
        preconditions:
          - "product_type == LEASE requires base_monthly_lease_cents non-null and base_ppa_rate_per_kwh_millicents null"
          - "product_type == PPA requires base_ppa_rate_per_kwh_millicents non-null and base_monthly_lease_cents null"
          - "contract_start_date must not be after the current clock date"
        side_effects:
          - "grandfathered_export_rate_millicents := the tariff's export_credit_rate_per_kwh_millicents (frozen from here on)"
          - "tariff_grandfathered recomputed per §1.3 nem_grandfathering_status"
          - "contract_end_date computed from contract_start_date and term_years"
          - "version incremented"
      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /servicing/transfer-cases"
        preconditions:
          - "no TransferCase for this agreement in status INITIATED, CREDIT_REVIEW, CREDIT_APPROVED or TITLE_CLEARED"
          - "service_status is not DECOMMISSIONED"
        side_effects:
          - "version incremented"
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/cancel"
        preconditions:
          - "the transfer case is in a non-terminal status"
        side_effects:
          - "version incremented"
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/run-credit-review"
        preconditions:
          - "credit_decision resolves to DECLINED"
        side_effects:
          - "version incremented"
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "transfer_type == ASSUMPTION"
        side_effects:
          - "homeowner_id := the case's buyer_homeowner_id"
          - "credit_balance_cents, credit_earned_cents and credit_applied_cents are carried over unchanged"
          - "version incremented"
      - from: TRANSFER_PENDING
        to: PREPAID_CLOSED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "transfer_type == PREPAYMENT"
        side_effects:
          - "credit_applied_cents += min(credit_balance_cents, payoff_quote_cents) and credit_balance_cents reduced by the same amount"
          - "every UccFiling for this agreement not already TERMINATED transitions to TERMINATED"
          - "every ProductionPeriod for this agreement still in RECORDED is left untouched (no retroactive settlement)"
          - "version incremented"
      - from: TRANSFER_PENDING
        to: RELOCATED_CLOSED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "transfer_type == RELOCATION"
        side_effects:
          - "a successor SolarAgreement is created in ACTIVE with relocated_from_agreement_id set to this agreement, site_address := the case's new_site_address, and every economic term (product_type, term_years, escalator_pct, base rate, guaranteed_annual_kwh, guarantee_band_pct, system_dc_kw, contract_start_date, tariff_id) copied verbatim"
          - "the successor's credit_earned_cents, credit_applied_cents and credit_balance_cents start at 0; this agreement's balances are frozen in place"
          - "this agreement's service_status advances to DECOMMISSIONED"
          - "successor_agreement_id recorded on the transfer case"
          - "version incremented"
      - from: ACTIVE
        to: END_OF_TERM_PENDING
        trigger: "POST /servicing/end-of-term-elections"
        preconditions:
          - "no EndOfTermElection for this agreement in status SUBMITTED or ACCEPTED"
          - "the clock date is inside the election window (see §1.4 election_window_open)"
        side_effects:
          - "version incremented"
      - from: END_OF_TERM_PENDING
        to: ACTIVE
        trigger: "POST /servicing/end-of-term-elections/{election_id}/execute"
        preconditions:
          - "election_type == RENEW"
        side_effects:
          - "renewal_count incremented by 1"
          - "contract_end_date extended by RENEWAL_TERM_YEARS years"
          - "version incremented"
      - from: END_OF_TERM_PENDING
        to: PURCHASED_CLOSED
        trigger: "POST /servicing/end-of-term-elections/{election_id}/execute"
        preconditions:
          - "election_type == PURCHASE"
        side_effects:
          - "every UccFiling for this agreement not already TERMINATED transitions to TERMINATED"
          - "version incremented"
      - from: END_OF_TERM_PENDING
        to: REMOVED_CLOSED
        trigger: "POST /servicing/end-of-term-elections/{election_id}/execute"
        preconditions:
          - "election_type == REMOVAL"
          - "service_status == DECOMMISSION_PENDING"
        side_effects:
          - "service_status advances to DECOMMISSIONED"
          - "every UccFiling for this agreement not already TERMINATED transitions to TERMINATED"
          - "version incremented"
      - from: END_OF_TERM_PENDING
        to: ACTIVE
        trigger: "POST /servicing/end-of-term-elections/{election_id}/withdraw"
        preconditions: []
        side_effects:
          - "version incremented"

  - entity: SolarAgreement
    dimension: monitoring_status
    initial_state: MONITORING_OK
    terminal_states: []
    transitions:
      - from: MONITORING_OK
        to: OUTAGE_OPEN
        trigger: "POST /servicing/outage-events"
        preconditions:
          - "lifecycle_state is not one of the four *_CLOSED states"
        side_effects:
          - "open_outage_count incremented"
          - "version incremented"
      - from: OUTAGE_OPEN
        to: TRUCK_ROLL_DISPATCHED
        trigger: "POST /servicing/truck-rolls"
        preconditions:
          - "the referenced OutageEvent is in TRIAGED"
        side_effects:
          - "version incremented"
      - from: TRUCK_ROLL_DISPATCHED
        to: OUTAGE_OPEN
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/cancel"
        preconditions:
          - "no other TruckRoll for this agreement is in SCHEDULED"
        side_effects:
          - "the linked OutageEvent returns to TRIAGED"
          - "open_outage_count unchanged"
          - "version incremented"
      - from: TRUCK_ROLL_DISPATCHED
        to: MONITORING_OK
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/complete"
        preconditions:
          - "disposition == SERVICE_COMPLETE"
          - "open_outage_count falls to 0 once the linked OutageEvent resolves"
        side_effects:
          - "open_outage_count decremented"
          - "version incremented"
      - from: TRUCK_ROLL_DISPATCHED
        to: OUTAGE_OPEN
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/complete"
        preconditions:
          - "disposition == NO_ACCESS"
        side_effects:
          - "the linked OutageEvent returns to TRIAGED and stays in the open set"
          - "open_outage_count unchanged"
          - "version incremented"
      - from: OUTAGE_OPEN
        to: MONITORING_OK
        trigger: "POST /servicing/outage-events/{outage_event_id}/mark-false-positive"
        preconditions:
          - "open_outage_count falls to 0 once this event closes"
        side_effects:
          - "open_outage_count decremented"
          - "version incremented"

  - entity: SolarAgreement
    dimension: service_status
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: ROOF_WORK_SUSPENDED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/remove-panels"
        preconditions:
          - "the work order is APPROVED"
          - "the clock date is on or after suspension_start_date"
        side_effects:
          - "version incremented"
      - from: ROOF_WORK_SUSPENDED
        to: IN_SERVICE
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/reinstall"
        preconditions:
          - "the work order is ROOF_COMPLETE"
        side_effects:
          - "version incremented"
      - from: IN_SERVICE
        to: DECOMMISSION_PENDING
        trigger: "POST /servicing/end-of-term-elections/{election_id}/accept"
        preconditions:
          - "election_type == REMOVAL"
        side_effects:
          - "version incremented"
      - from: DECOMMISSION_PENDING
        to: IN_SERVICE
        trigger: "POST /servicing/end-of-term-elections/{election_id}/withdraw"
        preconditions:
          - "the election is ACCEPTED and election_type == REMOVAL"
        side_effects:
          - "version incremented"
      - from: DECOMMISSION_PENDING
        to: DECOMMISSIONED
        trigger: "POST /servicing/end-of-term-elections/{election_id}/execute"
        preconditions:
          - "election_type == REMOVAL"
        side_effects:
          - "version incremented"
      - from: IN_SERVICE
        to: DECOMMISSION_PENDING
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/clear-title"
        preconditions:
          - "transfer_type == RELOCATION"
        side_effects:
          - "version incremented"
      - from: DECOMMISSION_PENDING
        to: DECOMMISSIONED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "transfer_type == RELOCATION"
        side_effects:
          - "version incremented"

  - entity: ProductionPeriod
    dimension: status
    initial_state: RECORDED
    terminal_states: []
    transitions:
      - from: RECORDED
        to: RECONCILED
        trigger: "POST /servicing/production-periods/{period_id}/reconcile"
        preconditions:
          - "the parent agreement's lifecycle_state is ACTIVE, TRANSFER_PENDING or END_OF_TERM_PENDING"
        side_effects:
          - "excused_days, adjusted_expected_kwh, guarantee_floor_kwh, shortfall_kwh, credit_rate_millicents and credit_cents recomputed per §1.3"
          - "gross_due_cents, credit_applied_cents, net_due_cents, late_fee_cents and total_invoiced_cents computed per §1.3 period_net_settlement in that exact order"
          - "agreement.credit_applied_cents += credit_applied_cents and agreement.credit_balance_cents reduced by the same amount"
          - "agreement.version incremented"
      - from: RECORDED
        to: CREDIT_ISSUED
        trigger: "POST /servicing/production-periods/{period_id}/reconcile"
        preconditions:
          - "the request body sets issue_credit to true"
          - "credit_cents resolves to a value strictly greater than 0"
        side_effects:
          - "every side effect of the RECORDED -> RECONCILED transition"
          - "agreement.credit_earned_cents += credit_cents and agreement.credit_balance_cents += credit_cents"
          - "agreement.version incremented exactly once in total for this transition, never once per ledger movement"
      - from: RECONCILED
        to: RECORDED
        trigger: "POST /servicing/production-periods/{period_id}/reopen"
        preconditions:
          - "no GuaranteeTrueUp in POSTED status covers this period"
        side_effects:
          - "agreement.credit_applied_cents -= credit_applied_cents and agreement.credit_balance_cents restored by the same amount"
          - "gross_due_cents, credit_applied_cents, net_due_cents, late_fee_cents and total_invoiced_cents reset to 0"
          - "agreement.version incremented"
      - from: CREDIT_ISSUED
        to: RECORDED
        trigger: "POST /servicing/production-periods/{period_id}/reopen"
        preconditions:
          - "no GuaranteeTrueUp in POSTED status covers this period"
        side_effects:
          - "agreement.credit_earned_cents -= credit_cents and agreement.credit_balance_cents reduced by the same amount"
          - "agreement.credit_applied_cents -= credit_applied_cents and agreement.credit_balance_cents restored by the same amount"
          - "gross_due_cents, credit_applied_cents, net_due_cents, late_fee_cents, total_invoiced_cents and credit_cents reset to 0"
          - "agreement.version incremented"

  - entity: GuaranteeTrueUp
    dimension: status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /servicing/guarantee-true-ups/{true_up_id}/post"
        preconditions:
          - "no other GuaranteeTrueUp for the same agreement_id and contract_year is already POSTED"
          - "the sum of net_credit_cents across POSTED true-ups for the agreement's contract_year, including this one, must not exceed the annual credit cap (see §1.4 annual_credit_cap)"
        side_effects:
          - "agreement.credit_earned_cents += net_credit_cents and agreement.credit_balance_cents += net_credit_cents"
          - "posted_by_user_id := the acting X-User-ID"
          - "posted_at := the current clock instant"
          - "the covered ProductionPeriod rows keep their existing status; posting never re-flags a period as CREDIT_ISSUED"
          - "agreement.version incremented"
      - from: POSTED
        to: VOID
        trigger: "POST /servicing/guarantee-true-ups/{true_up_id}/void"
        preconditions:
          - "the acting X-User-ID must differ from posted_by_user_id"
        side_effects:
          - "agreement.credit_earned_cents -= net_credit_cents and agreement.credit_balance_cents reduced by the same amount"
          - "voided_by_user_id := the acting X-User-ID"
          - "agreement.version incremented"
      - from: DRAFT
        to: VOID
        trigger: "POST /servicing/guarantee-true-ups/{true_up_id}/void"
        preconditions: []
        side_effects:
          - "voided_by_user_id := the acting X-User-ID"
          - "no ledger movement, because a DRAFT true-up never credited the agreement"

  - entity: OutageEvent
    dimension: status
    initial_state: OPEN
    terminal_states: [RESOLVED, FALSE_POSITIVE]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /servicing/outage-events/{outage_event_id}/triage"
        preconditions: []
        side_effects:
          - "severity recomputed per §1.3 outage_severity_grade against the clock"
          - "version incremented"
      - from: OPEN
        to: FALSE_POSITIVE
        trigger: "POST /servicing/outage-events/{outage_event_id}/mark-false-positive"
        preconditions:
          - "no TruckRoll exists for this event"
        side_effects:
          - "resolved_at := the current clock instant"
          - "downtime_minutes frozen at 0 and excused left false"
          - "agreement.open_outage_count decremented"
          - "version incremented"
      - from: TRIAGED
        to: DISPATCHED
        trigger: "POST /servicing/truck-rolls"
        preconditions:
          - "expected_outage_event_version must match version (see §1.2.1)"
        side_effects:
          - "version incremented"
      - from: DISPATCHED
        to: TRIAGED
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/cancel"
        preconditions:
          - "the truck roll is SCHEDULED"
        side_effects:
          - "version incremented"
      - from: DISPATCHED
        to: TRIAGED
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/complete"
        preconditions:
          - "disposition == NO_ACCESS"
        side_effects:
          - "version incremented"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/complete"
        preconditions:
          - "disposition == SERVICE_COMPLETE"
        side_effects:
          - "resolved_at := the current clock instant"
          - "downtime_minutes frozen at whole minutes between detected_at and resolved_at"
          - "excused := true when root_cause is STRING_FAULT or COMMS_ONLY, else false"
          - "agreement.excused_downtime_minutes += downtime_minutes when excused is true"
          - "agreement.open_outage_count decremented"
          - "version incremented"

  - entity: TruckRoll
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_ACCESS, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/complete"
        preconditions:
          - "disposition == SERVICE_COMPLETE and root_cause present"
          - "the acting X-User-ID must differ from dispatched_by_user_id"
        side_effects:
          - "completed_at := the current clock instant"
          - "diagnosed_by_user_id := the acting X-User-ID"
          - "billable_to and labor_cost_cents computed per §1.3 truck_roll_cost_allocation"
          - "the linked OutageEvent advances to RESOLVED"
      - from: SCHEDULED
        to: NO_ACCESS
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/complete"
        preconditions:
          - "disposition == NO_ACCESS and root_cause absent"
          - "the acting X-User-ID must differ from dispatched_by_user_id"
        side_effects:
          - "completed_at := the current clock instant"
          - "billable_to := HOMEOWNER and labor_cost_cents := NO_ACCESS_FEE_CENTS"
          - "the linked OutageEvent falls back to TRIAGED so it can be re-dispatched"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /servicing/truck-rolls/{truck_roll_id}/cancel"
        preconditions: []
        side_effects:
          - "the linked OutageEvent falls back to TRIAGED"
          - "billable_to and labor_cost_cents stay null and 0; the technician's window is freed for reuse"

  - entity: RoofWorkOrder
    dimension: status
    initial_state: REQUESTED
    terminal_states: [REINSTALLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/quote"
        preconditions:
          - "quote_cents present and >= 0"
        side_effects:
          - "quote_cents stored"
          - "version incremented"
      - from: QUOTED
        to: APPROVED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/approve"
        preconditions:
          - "no other RoofWorkOrder for the agreement in APPROVED, PANELS_REMOVED or ROOF_COMPLETE overlaps this suspension window widened by ROOF_WORK_BUFFER_DAYS (see §1.4 roof_window_conflict)"
          - "the count of RoofWorkOrders for the agreement in the same contract_year whose status is APPROVED, PANELS_REMOVED, ROOF_COMPLETE or REINSTALLED must not exceed MAX_ROOF_WORK_ORDERS_PER_YEAR once this one is approved"
        side_effects:
          - "approved_by_user_id := the acting X-User-ID"
          - "version incremented"
      - from: APPROVED
        to: PANELS_REMOVED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/remove-panels"
        preconditions:
          - "the clock date is on or after suspension_start_date"
        side_effects:
          - "agreement.service_status advances to ROOF_WORK_SUSPENDED"
          - "version incremented"
      - from: PANELS_REMOVED
        to: ROOF_COMPLETE
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/roof-complete"
        preconditions: []
        side_effects:
          - "version incremented"
      - from: ROOF_COMPLETE
        to: REINSTALLED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/reinstall"
        preconditions: []
        side_effects:
          - "agreement.service_status returns to IN_SERVICE"
          - "suspension_end_date is frozen; any ProductionPeriod reconciled afterwards excuses the suspended days"
          - "version incremented"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/cancel"
        preconditions: []
        side_effects:
          - "version incremented"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/cancel"
        preconditions: []
        side_effects:
          - "version incremented"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /servicing/roof-work-orders/{roof_work_order_id}/cancel"
        preconditions: []
        side_effects:
          - "the suspension window is released and stops blocking later approvals"
          - "version incremented"

  - entity: TransferCase
    dimension: status
    initial_state: INITIATED
    terminal_states: [CLOSED, CANCELLED, CREDIT_DECLINED]
    transitions:
      - from: INITIATED
        to: CREDIT_REVIEW
        trigger: "POST /servicing/transfer-cases"
        preconditions:
          - "transfer_type == ASSUMPTION (the fork is taken by the system inside the creation request; PREPAYMENT and RELOCATION cases stay in INITIATED)"
          - "buyer_homeowner_id present and resolvable"
        side_effects:
          - "payoff_method := NONE and payoff_quote_cents := 0"
          - "version incremented"
      - from: CREDIT_REVIEW
        to: CREDIT_APPROVED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/run-credit-review"
        preconditions:
          - "credit_decision resolves to APPROVED or APPROVED_WITH_DEPOSIT per §1.3 buyer_credit_qualification"
        side_effects:
          - "credit_fico_snapshot, credit_dti_snapshot, credit_composite_score, credit_decision and required_deposit_cents populated"
          - "credit_decided_by_user_id := the acting X-User-ID"
          - "version incremented"
      - from: CREDIT_REVIEW
        to: CREDIT_DECLINED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/run-credit-review"
        preconditions:
          - "credit_decision resolves to DECLINED per §1.3 buyer_credit_qualification"
        side_effects:
          - "the same five credit fields populated; required_deposit_cents stays 0"
          - "credit_decided_by_user_id := the acting X-User-ID"
          - "agreement.lifecycle_state returns to ACTIVE"
          - "version incremented"
      - from: CREDIT_APPROVED
        to: TITLE_CLEARED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/clear-title"
        preconditions:
          - "every UccFiling for the agreement is in SUBORDINATED or TERMINATED (see §1.4 title_not_clear)"
          - "closing_date must not be before the current clock date"
        side_effects:
          - "title_cleared_by_user_id := the acting X-User-ID"
          - "requested_by_transfer_case_id stamped on every UccFiling touched for this closing"
          - "version incremented"
      - from: INITIATED
        to: TITLE_CLEARED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/clear-title"
        preconditions:
          - "transfer_type is PREPAYMENT or RELOCATION"
          - "every UccFiling for the agreement is in SUBORDINATED, TERMINATION_REQUESTED or TERMINATED"
          - "closing_date must not be before the current clock date"
        side_effects:
          - "payoff_method and payoff_quote_cents computed per §1.3 transfer_payoff_quote"
          - "title_cleared_by_user_id := the acting X-User-ID"
          - "for RELOCATION, agreement.service_status advances to DECOMMISSION_PENDING"
          - "version incremented"
      - from: TITLE_CLEARED
        to: CLOSED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "the clock date is on or after closing_date"
        side_effects:
          - "the transfer_type-specific agreement side effects listed under the SolarAgreement lifecycle_state machine are applied"
          - "version incremented"
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/cancel"
        preconditions: []
        side_effects:
          - "agreement.lifecycle_state returns to ACTIVE"
          - "version incremented"
      - from: CREDIT_REVIEW
        to: CANCELLED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/cancel"
        preconditions: []
        side_effects:
          - "agreement.lifecycle_state returns to ACTIVE"
          - "version incremented"
      - from: CREDIT_APPROVED
        to: CANCELLED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/cancel"
        preconditions: []
        side_effects:
          - "agreement.lifecycle_state returns to ACTIVE"
          - "version incremented"
      - from: TITLE_CLEARED
        to: CANCELLED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/cancel"
        preconditions: []
        side_effects:
          - "agreement.lifecycle_state returns to ACTIVE"
          - "for RELOCATION, agreement.service_status returns to IN_SERVICE"
          - "version incremented"

  - entity: UccFiling
    dimension: status
    initial_state: FILED
    terminal_states: [TERMINATED]
    transitions:
      - from: FILED
        to: SUBORDINATION_REQUESTED
        trigger: "POST /servicing/ucc-filings/{ucc_filing_id}/request-subordination"
        preconditions:
          - "a TransferCase for the same agreement exists in INITIATED, CREDIT_REVIEW or CREDIT_APPROVED"
        side_effects:
          - "requested_by_transfer_case_id := that transfer case's id"
          - "version incremented"
      - from: SUBORDINATION_REQUESTED
        to: SUBORDINATED
        trigger: "POST /servicing/ucc-filings/{ucc_filing_id}/record-subordination"
        preconditions:
          - "the acting X-User-ID must differ from the X-User-ID that requested the subordination"
        side_effects:
          - "version incremented"
      - from: FILED
        to: TERMINATION_REQUESTED
        trigger: "POST /servicing/ucc-filings/{ucc_filing_id}/request-termination"
        preconditions: []
        side_effects:
          - "version incremented"
      - from: SUBORDINATED
        to: TERMINATION_REQUESTED
        trigger: "POST /servicing/ucc-filings/{ucc_filing_id}/request-termination"
        preconditions: []
        side_effects:
          - "version incremented"
      - from: TERMINATION_REQUESTED
        to: TERMINATED
        trigger: "POST /servicing/ucc-filings/{ucc_filing_id}/terminate"
        preconditions:
          - "no TransferCase for the agreement is in TITLE_CLEARED awaiting this filing"
        side_effects:
          - "terminated_date := the current clock date"
          - "version incremented"
      - from: FILED
        to: TERMINATED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "transfer_type == PREPAYMENT"
        side_effects:
          - "terminated_date := the current clock date"
          - "requested_by_transfer_case_id := the closing transfer case"
          - "version incremented"
      - from: SUBORDINATED
        to: TERMINATED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "transfer_type == PREPAYMENT"
        side_effects:
          - "terminated_date := the current clock date"
          - "requested_by_transfer_case_id := the closing transfer case"
          - "version incremented"
      - from: TERMINATION_REQUESTED
        to: TERMINATED
        trigger: "POST /servicing/transfer-cases/{transfer_case_id}/close"
        preconditions:
          - "transfer_type == PREPAYMENT"
        side_effects:
          - "terminated_date := the current clock date"
          - "version incremented"
      - from: FILED
        to: TERMINATED
        trigger: "POST /servicing/end-of-term-elections/{election_id}/execute"
        preconditions:
          - "election_type is PURCHASE or REMOVAL"
        side_effects:
          - "terminated_date := the current clock date"
          - "version incremented"
      - from: SUBORDINATED
        to: TERMINATED
        trigger: "POST /servicing/end-of-term-elections/{election_id}/execute"
        preconditions:
          - "election_type is PURCHASE or REMOVAL"
        side_effects:
          - "terminated_date := the current clock date"
          - "version incremented"

  - entity: EndOfTermElection
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [EXECUTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /servicing/end-of-term-elections/{election_id}/accept"
        preconditions:
          - "the agreement's credit_balance_cents must be 0 when election_type is PURCHASE (see §1.4 unapplied_credit_blocks_purchase)"
        side_effects:
          - "accepted_at := the current clock instant"
          - "for election_type REMOVAL, agreement.service_status advances to DECOMMISSION_PENDING"
          - "version incremented"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /servicing/end-of-term-elections/{election_id}/execute"
        preconditions:
          - "no TransferCase for the agreement is in a non-terminal status"
          - "no RoofWorkOrder for the agreement is in APPROVED, PANELS_REMOVED or ROOF_COMPLETE (see §1.4 roof_work_blocks_execution)"
        side_effects:
          - "executed_at := the current clock instant"
          - "the election_type-specific agreement side effects listed under the SolarAgreement lifecycle_state machine are applied"
          - "version incremented"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /servicing/end-of-term-elections/{election_id}/withdraw"
        preconditions: []
        side_effects:
          - "agreement.lifecycle_state returns to ACTIVE"
          - "version incremented"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /servicing/end-of-term-elections/{election_id}/withdraw"
        preconditions: []
        side_effects:
          - "agreement.lifecycle_state returns to ACTIVE"
          - "for election_type REMOVAL, agreement.service_status returns to IN_SERVICE"
          - "version incremented"

  - entity: WarrantyClaim
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /servicing/warranty-claims/{warranty_claim_id}/submit"
        preconditions:
          - "the clock date must not be after warranty_expires_on (see §1.4 warranty_window_expired)"
        side_effects:
          - "submitted_by_user_id := the acting X-User-ID"
          - "version incremented"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /servicing/warranty-claims/{warranty_claim_id}/request-info"
        preconditions:
          - "info_request_note present"
        side_effects:
          - "info_request_note stored"
          - "version incremented"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /servicing/warranty-claims/{warranty_claim_id}/submit"
        preconditions:
          - "revision_count must be strictly below MAX_CLAIM_REVISIONS"
          - "the clock date must not be after warranty_expires_on"
        side_effects:
          - "revision_count incremented by 1"
          - "submitted_by_user_id := the acting X-User-ID"
          - "info_request_note cleared to null"
          - "version incremented"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /servicing/warranty-claims/{warranty_claim_id}/approve"
        preconditions:
          - "approved_amount_cents present and not greater than claim_amount_cents"
          - "the acting X-User-ID must differ from submitted_by_user_id"
        side_effects:
          - "approved_amount_cents stored and decided_by_user_id := the acting X-User-ID"
          - "the linked TruckRoll's billable_to changes from PENDING_MANUFACTURER to WARRANTY"
          - "version incremented"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /servicing/warranty-claims/{warranty_claim_id}/deny"
        preconditions:
          - "the acting X-User-ID must differ from submitted_by_user_id"
        side_effects:
          - "approved_amount_cents := 0 and decided_by_user_id := the acting X-User-ID"
          - "the linked TruckRoll's billable_to changes from PENDING_MANUFACTURER to SUNRUN_OM"
          - "version incremented"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# The ONLY sanctioned write-write conflict mechanism in this domain. Both rules
# guard a child write against a parent that moved since the client last read it.
# ---------------------------------------------------------------------------
concurrency_rules:
  - write_endpoint: "POST /servicing/guarantee-true-ups"
    parent_entity: SolarAgreement
    occ_field: expected_agreement_version
    error_id: ERR_STALE_AGREEMENT_VERSION
    status: 412
    description: >-
      A true-up prices a whole contract year off the agreement's escalator and
      credit ledger, so it must be computed against the agreement revision the
      client actually read. The request must carry expected_agreement_version; if
      it does not equal the agreement's current version the write is refused. A
      successful create increments the agreement's version.

  - write_endpoint: "POST /servicing/truck-rolls"
    parent_entity: OutageEvent
    occ_field: expected_outage_event_version
    error_id: ERR_STALE_OUTAGE_EVENT_VERSION
    status: 412
    description: >-
      Dispatching a technician consumes the triage decision recorded on the
      outage event. The request must carry expected_outage_event_version; if it
      does not equal the outage event's current version the dispatch is refused.
      A successful create increments the outage event's version.

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# All money is whole cents. All energy is whole kWh. All unit rates are whole
# millicents (1 millicent = 0.001 cent). Every rounding step named below uses
# ROUND_HALF_UP and happens exactly where it is written: intermediate values are
# NOT rounded unless a step says so, and a value that a step rounds is used in
# its rounded form by every later step.
# ---------------------------------------------------------------------------
calculations:

  - rule_name: escalated_billing_rate
    algorithm_type: tiered_pricing
    description: >-
      Each contract year is a price tier. The escalator compounds from the
      contract-year-1 base, and the tier boundary is the contract-year rollover:
      contract year N uses factor (1 + escalator_pct) ** (N - 1).
    input_set: "The agreement's product_type, escalator_pct, base rate and guaranteed_annual_kwh, plus a target contract year N >= 1."
    formula: |
      factor(N) = (1 + escalator_pct) ** (N - 1)            # exact, never rounded

      variant PPA:
        escalated_rate_millicents(N)  = round_half_up(base_ppa_rate_per_kwh_millicents * factor(N), 0)
        escalated_monthly_rent_cents  = 0
        monthly_payment_cents(N)      = round_half_up(escalated_rate_millicents(N) * (guaranteed_annual_kwh / 12) / 1000, 0)

      variant LEASE:
        escalated_rate_millicents     = 0
        escalated_monthly_rent_cents(N) = round_half_up(base_monthly_lease_cents * factor(N), 0)
        monthly_payment_cents(N)      = escalated_monthly_rent_cents(N)

      annual_contract_value_cents(N)  = 12 * monthly_payment_cents(N)
    constants: {}
    precision: >-
      PINNED ROUNDING ORDER for PPA: the escalated per-kWh rate is rounded to a
      whole millicent FIRST, and the rounded rate is what multiplies kWh. Applying
      the escalator to an unrounded rate and rounding only the final cent figure is
      wrong and diverges for many (year, kWh) pairs.
    variants:
      - name: PPA
        applies_when: "product_type == PPA"
      - name: LEASE
        applies_when: "product_type == LEASE"

  - rule_name: monthly_expected_production
    algorithm_type: interval_merge
    description: >-
      Allocates the annual guarantee across the twelve calendar months by a fixed
      seasonality curve, then pro-rates the month down for days the system was
      excused from producing. Excused time comes from two independent interval
      sources that must be merged before they are counted, so a roof suspension
      overlapping an excused outage is never double-counted.
    input_set: >-
      The agreement's guaranteed_annual_kwh; every RoofWorkOrder for the agreement
      in status APPROVED, PANELS_REMOVED, ROOF_COMPLETE or REINSTALLED; every
      OutageEvent for the agreement in status RESOLVED with excused == true.
      REQUESTED, QUOTED and CANCELLED roof work orders and non-excused outages are
      excluded.
    formula: |
      gross_expected_kwh = round_half_up(guaranteed_annual_kwh * SEASONALITY_WEIGHTS[period_month - 1], 0)

      month_span      = [period_year-period_month-01T00:00:00Z, first instant of the following month)
      days_in_month   = calendar days in (period_year, period_month)

      roof_intervals  = for each qualifying RoofWorkOrder, the CLOSED date interval
                        [suspension_start_date, suspension_end_date]
      merged_roof     = union of roof_intervals with overlaps AND zero-day-gap adjacencies merged
                        (an interval ending on day D and one starting on day D+1 merge into one)
      roof_days       = count of distinct calendar days in merged_roof falling inside the period month

      outage_intervals = for each qualifying OutageEvent, the HALF-OPEN instant interval
                         [detected_at, resolved_at)
      merged_outage    = union of outage_intervals with overlaps and zero-length gaps merged
      outage_minutes   = whole minutes of merged_outage intersected with month_span, truncated toward zero

      excused_days    = min(days_in_month, roof_days + ceil(outage_minutes / 1440))
      availability    = max(0, (days_in_month - excused_days) / days_in_month)   # exact rational, not rounded
      adjusted_expected_kwh = round_half_up(gross_expected_kwh * availability, 0)
    constants:
      SEASONALITY_WEIGHTS: [0.0520, 0.0620, 0.0830, 0.0980, 0.1090, 0.1120, 0.1130, 0.1060, 0.0930, 0.0760, 0.0530, 0.0430]
      SEASONALITY_WEIGHTS_SUM: 1.0000
      MINUTES_PER_DAY: 1440
    precision: >-
      gross_expected_kwh is rounded to a whole kWh BEFORE availability is applied.
      availability itself is never rounded. outage_minutes truncates, but the
      conversion of minutes to excused days uses ceiling, so a single excused
      minute costs a whole day.

  - rule_name: monthly_shortfall_credit
    algorithm_type: threshold
    description: >-
      The guarantee is a floor, not a target. Production is compared against the
      adjusted expectation net of the deadband; only production strictly below the
      floor earns a credit.
    input_set: "One ProductionPeriod plus its agreement's guarantee_band_pct, product_type and current tariff."
    formula: |
      guarantee_floor_kwh = round_half_up(adjusted_expected_kwh * (1 - guarantee_band_pct), 0)

      if metered_kwh < guarantee_floor_kwh:
          shortfall_kwh = guarantee_floor_kwh - metered_kwh
      else:
          shortfall_kwh = 0

      credit_rate_millicents = PPA   -> escalated_rate_millicents for this period's contract_year
                               LEASE -> the agreement's current tariff retail_rate_per_kwh_millicents

      credit_cents = round_half_up(shortfall_kwh * credit_rate_millicents / 1000, 0)
    constants: {}
    precision: >-
      The comparison is strict: metered_kwh exactly equal to guarantee_floor_kwh
      yields shortfall_kwh 0 and credit_cents 0. guarantee_floor_kwh is rounded to a
      whole kWh before the comparison, so the boundary is an integer.

  - rule_name: period_net_settlement
    algorithm_type: waterfall_allocation
    description: >-
      Turns a reconciled month into an invoice. The six steps run in exactly the
      order written; each step consumes the rounded output of the previous one.
    input_set: "One ProductionPeriod being reconciled plus its agreement's credit ledger and the logical clock."
    formula: |
      step 1  gross_due_cents = PPA   -> round_half_up(escalated_rate_millicents * metered_kwh / 1000, 0)
                                LEASE -> escalated_monthly_rent_cents
      step 2  available_credit_cents = agreement.credit_balance_cents READ BEFORE this period issues any credit
      step 3  credit_applied_cents   = min(gross_due_cents, available_credit_cents)
      step 4  net_due_cents          = gross_due_cents - credit_applied_cents
      step 5  late_fee_cents         = (clock date > due_date) ? round_half_up(net_due_cents * LATE_FEE_PCT, 0) : 0
      step 6  total_invoiced_cents   = net_due_cents + late_fee_cents

      due_date = last calendar day of the period month + PAYMENT_TERM_DAYS days
    constants:
      LATE_FEE_PCT: 0.015
      PAYMENT_TERM_DAYS: 21
    precision: >-
      PINNED EVALUATION ORDER, two independent order traps. (1) The late fee is a
      percentage of net_due_cents, i.e. AFTER credit is applied, never of
      gross_due_cents. (2) available_credit_cents is the balance as it stood before
      this same period's own shortfall credit is issued, so a month that both earns
      and consumes credit cannot pay itself.

  - rule_name: annual_guarantee_true_up
    algorithm_type: aggregation
    description: >-
      Settles a full contract year against the production guarantee. Two
      contractual methods exist and they are not equivalent: the rolling method
      pays every monthly dip, while the annual method lets a strong summer offset a
      weak winter before any credit is owed.
    input_set: >-
      The twelve ProductionPeriod rows of the agreement whose contract_year equals
      the requested contract_year, ordered ascending by (period_year, period_month).
      All twelve must exist. Rows in any status are aggregated; only the
      already-issued offset looks at status.
    formula: |
      total_metered_kwh           = sum(metered_kwh over the twelve rows)
      total_adjusted_expected_kwh = sum(adjusted_expected_kwh over the twelve rows)

      variant MONTHLY_ROLLING:
        annual_guarantee_floor_kwh = 0
        annual_shortfall_kwh       = sum(shortfall_kwh over the twelve rows)
        credit_rate_millicents     = 0
        gross_credit_cents         = sum(credit_cents over the twelve rows)

      variant ANNUAL_TRUE_UP:
        annual_guarantee_floor_kwh = round_half_up(total_adjusted_expected_kwh * (1 - guarantee_band_pct), 0)
        annual_shortfall_kwh       = max(0, annual_guarantee_floor_kwh - total_metered_kwh)
        credit_rate_millicents     = PPA   -> escalated_rate_millicents for that contract_year
                                     LEASE -> the agreement's current tariff retail_rate_per_kwh_millicents
        gross_credit_cents         = round_half_up(annual_shortfall_kwh * credit_rate_millicents / 1000, 0)

      already_issued_credit_cents = sum(credit_cents over those twelve rows whose status == CREDIT_ISSUED)
      net_credit_cents            = max(0, gross_credit_cents - already_issued_credit_cents)
      covered_period_ids          = the twelve row ids in ascending (period_year, period_month) order

      annual_credit_cap_cents     = round_half_up(ANNUAL_CREDIT_CAP_PCT
                                                  * annual_contract_value_cents(contract_year), 0)
    constants:
      ANNUAL_CREDIT_CAP_PCT: 0.25
    precision: >-
      MONTHLY_ROLLING sums twelve already-rounded per-month cent figures, so its
      total carries twelve independent roundings. ANNUAL_TRUE_UP rounds once, at the
      end, off an annual kWh total. The two figures are expected to differ and both
      must be reproduced exactly.
    variants:
      - name: MONTHLY_ROLLING
        applies_when: "method == MONTHLY_ROLLING"
      - name: ANNUAL_TRUE_UP
        applies_when: "method == ANNUAL_TRUE_UP"

  - rule_name: transfer_payoff_quote
    algorithm_type: forward_looking
    description: >-
      Prices the exit. A prepayment buys out the remaining stream of escalating
      payments at a discount rate; a relocation instead recovers the unamortized
      capital plus the physical move. The two variants are chosen by transfer_type,
      not by the caller.
    input_set: >-
      The agreement's term, escalator, base rate, guaranteed_annual_kwh and
      system_dc_kw, the case's closing_date, and the derived elapsed_term_months /
      remaining_term_months. Cancelled and closed transfer cases are not re-priced.
    formula: |
      elapsed_term_months   = (closing_year*12 + closing_month) - (start_year*12 + start_month)
      total_term_months     = (term_years + renewal_count * RENEWAL_TERM_YEARS) * 12
      remaining_term_months = max(0, total_term_months - elapsed_term_months)
      first_open_year       = elapsed_term_months // 12 + 1

      variant NPV_REMAINING_PAYMENTS:      # transfer_type == PREPAYMENT
        buckets = ceil(remaining_term_months / 12)
        for k = 1 .. buckets:
            year_k       = first_open_year + k - 1
            months_k     = min(12, remaining_term_months - 12 * (k - 1))
            bucket_k     = monthly_payment_cents(year_k) * months_k
            discounted_k = round_half_up(bucket_k / ((1 + DISCOUNT_RATE_ANNUAL) ** (k - 1)), 0)
        payoff_quote_cents = sum of discounted_k over k = 1 .. buckets

      variant UNAMORTIZED_SYSTEM_COST:     # transfer_type == RELOCATION
        installed_cost_cents = round_half_up(system_dc_kw * INSTALLED_COST_PER_KW_CENTS, 0)
        unamortized_pct      = max(0, 1 - elapsed_term_months / total_term_months)   # exact rational
        payoff_quote_cents   = round_half_up(installed_cost_cents * unamortized_pct, 0) + RELOCATION_LABOR_CENTS

      variant NONE:                        # transfer_type == ASSUMPTION
        payoff_quote_cents = 0
    constants:
      DISCOUNT_RATE_ANNUAL: 0.06
      INSTALLED_COST_PER_KW_CENTS: 320000
      RELOCATION_LABOR_CENTS: 850000
      RENEWAL_TERM_YEARS: 5
    precision: >-
      PINNED ROUNDING ORDER for the NPV variant: each annual bucket is discounted
      and rounded to whole cents on its own, and the whole-cent bucket figures are
      then summed. Summing unrounded discounted buckets and rounding once at the end
      gives a different answer. Payments are grouped into whole annual buckets and
      discounted at the START of each bucket (k = 1 is undiscounted).
    variants:
      - name: NPV_REMAINING_PAYMENTS
        applies_when: "transfer_type == PREPAYMENT"
      - name: UNAMORTIZED_SYSTEM_COST
        applies_when: "transfer_type == RELOCATION"
      - name: NONE
        applies_when: "transfer_type == ASSUMPTION"

  - rule_name: buyer_credit_qualification
    algorithm_type: weighted_scoring
    description: >-
      Scores an assuming buyer on three weighted sub-scores and maps the composite
      onto three decision tiers. A hard FICO gate is evaluated before the score, and
      the middle tier carries its own integer FICO gate, so a passing composite is
      not sufficient on its own.
    input_set: >-
      The buyer Homeowner's fico_score, dti_ratio and monthly_income_cents, plus
      monthly_payment_cents for the agreement's current_contract_year.
    formula: |
      clamp01(x) = min(1, max(0, x))

      fico_norm     = clamp01((fico_score - FICO_FLOOR) / (FICO_CEIL - FICO_FLOOR))
      dti_score     = clamp01((DTI_CEIL - dti_ratio) / DTI_CEIL)
      burden_target_cents = round_half_up(monthly_income_cents * BURDEN_TARGET_PCT, 0)
      burden_ratio  = burden_target_cents == 0 ? 2 : monthly_payment_cents / burden_target_cents
      burden_score  = clamp01(2 - burden_ratio)

      raw = CREDIT_WEIGHT_FICO * fico_norm + CREDIT_WEIGHT_DTI * dti_score + CREDIT_WEIGHT_BURDEN * burden_score
      credit_composite_score = round_half_up(raw * 100, 2)

      decision, evaluated strictly top to bottom:
        1. fico_score < FICO_HARD_MIN                                          -> DECLINED,              deposit 0
        2. credit_composite_score >= APPROVE_SCORE_MIN                          -> APPROVED,              deposit 0
        3. credit_composite_score >= DEPOSIT_SCORE_MIN and fico_score >= DEPOSIT_TIER_FICO_MIN
                                                                                -> APPROVED_WITH_DEPOSIT,
                                                    required_deposit_cents = DEPOSIT_MONTHS * monthly_payment_cents
        4. otherwise                                                            -> DECLINED,              deposit 0
    constants:
      FICO_FLOOR: 580
      FICO_CEIL: 800
      FICO_HARD_MIN: 600
      DEPOSIT_TIER_FICO_MIN: 620
      DTI_CEIL: 0.45
      BURDEN_TARGET_PCT: 0.10
      CREDIT_WEIGHT_FICO: 0.55
      CREDIT_WEIGHT_DTI: 0.30
      CREDIT_WEIGHT_BURDEN: 0.15
      CREDIT_WEIGHTS_SUM: 1.00
      APPROVE_SCORE_MIN: 72.00
      DEPOSIT_SCORE_MIN: 50.00
      DEPOSIT_MONTHS: 3
    precision: >-
      The three sub-scores are clamped but never rounded; only the composite is
      rounded, to exactly 2 decimal places, and the tier comparisons use the ROUNDED
      composite. Both tier comparisons are >= (inclusive), so a composite of exactly
      72.00 is APPROVED and exactly 50.00 with a qualifying FICO is
      APPROVED_WITH_DEPOSIT.

  - rule_name: savings_projection_annual
    algorithm_type: projection
    description: >-
      Replays a year of the host site's energy economics under whichever
      net-metering terms actually apply, which is the crux of the successor-tariff
      question: a grandfathered system keeps its legacy export credit even after the
      site is moved onto a successor schedule for import.
    input_set: "One ACTIVE or END_OF_TERM_PENDING agreement plus its current UtilityTariff and its frozen grandfathered export rate."
    formula: |
      annual_production_kwh = guaranteed_annual_kwh
      self_consumed_kwh     = round_half_up(annual_production_kwh * SELF_CONSUMPTION_RATIO, 0)
      exported_kwh          = annual_production_kwh - self_consumed_kwh

      effective_export_rate_millicents = tariff_grandfathered
                                         ? grandfathered_export_rate_millicents
                                         : tariff.export_credit_rate_per_kwh_millicents

      avoided_import_cents  = round_half_up(self_consumed_kwh * tariff.retail_rate_per_kwh_millicents / 1000, 0)
      export_credit_cents   = round_half_up(exported_kwh * effective_export_rate_millicents / 1000, 0)
      utility_fixed_cents   = tariff.monthly_fixed_charge_cents * 12
      solar_cost_cents      = 12 * monthly_payment_cents(current_contract_year)

      annual_savings_cents  = avoided_import_cents + export_credit_cents - utility_fixed_cents - solar_cost_cents
    constants:
      SELF_CONSUMPTION_RATIO: 0.42
    precision: >-
      self_consumed_kwh is rounded to a whole kWh first and exported_kwh is the
      remainder, so the two always sum exactly to annual_production_kwh. The import
      rate always comes from the CURRENT tariff; only the export rate is subject to
      grandfathering. annual_savings_cents may be negative.

  - rule_name: nem_grandfathering_status
    algorithm_type: chronological
    description: >-
      Decides whether a system predates the tariff it now sits on and is therefore
      still protected. All three conditions must hold; the protection also expires on
      its own clock.
    input_set: "One agreement and the UtilityTariff currently attached to it, evaluated against the logical clock."
    formula: |
      tariff_grandfathered =
            tariff.grandfathers_predecessors == true
        AND contract_start_date < tariff.effective_from_date
        AND clock_date < (contract_start_date + GRANDFATHER_TERM_YEARS years)
    constants:
      GRANDFATHER_TERM_YEARS: 20
    precision: >-
      Both date comparisons are strict. A system whose contract_start_date equals the
      tariff's effective_from_date is NOT grandfathered, and protection ends on the
      exact anniversary rather than the day after.

  - rule_name: end_of_term_election_pricing
    algorithm_type: decay_function
    description: >-
      Prices the three end-of-term options off a straight-line residual curve on
      installed cost, with a floor under both the residual percentage and the
      resulting fair market value.
    input_set: "One agreement in END_OF_TERM_PENDING plus the election's elected_on_date."
    formula: |
      elapsed_full_years = whole years from contract_start_date to elected_on_date, floored
      residual_pct       = max(MIN_RESIDUAL_PCT,
                               round_half_up(1 - ANNUAL_DEPRECIATION_PCT * elapsed_full_years, 4))
      installed_cost_cents = round_half_up(system_dc_kw * INSTALLED_COST_PER_KW_CENTS, 0)
      final_contract_year  = term_years + renewal_count * RENEWAL_TERM_YEARS

      PURCHASE: fair_market_value_cents       = max(FMV_FLOOR_CENTS,
                                                   round_half_up(installed_cost_cents * residual_pct, 0))
      RENEW:    renewal_monthly_payment_cents = round_half_up(monthly_payment_cents(final_contract_year)
                                                             * RENEWAL_DISCOUNT_PCT, 0)
      REMOVAL:  removal_cost_cents            = round_half_up(system_dc_kw * REMOVAL_COST_PER_KW_CENTS, 0)
                                                + ROOF_PATCH_CENTS

      elected_amount_cents = the single figure selected by election_type; the other two stay 0

      window_open_date  = contract_end_date - ELECTION_WINDOW_OPEN_DAYS days
      window_close_date = contract_end_date - ELECTION_WINDOW_CLOSE_DAYS days
    constants:
      ANNUAL_DEPRECIATION_PCT: 0.045
      MIN_RESIDUAL_PCT: 0.10
      INSTALLED_COST_PER_KW_CENTS: 320000
      FMV_FLOOR_CENTS: 150000
      RENEWAL_DISCOUNT_PCT: 0.75
      RENEWAL_TERM_YEARS: 5
      REMOVAL_COST_PER_KW_CENTS: 45000
      ROOF_PATCH_CENTS: 120000
      ELECTION_WINDOW_OPEN_DAYS: 180
      ELECTION_WINDOW_CLOSE_DAYS: 30
    precision: >-
      residual_pct is rounded to 4 decimal places before the floor is applied and
      before it multiplies installed cost. The decay clock is elapsed_full_years from
      contract_start_date, so it resets nothing on renewal; a renewed agreement keeps
      depreciating from its original start.

  - rule_name: truck_roll_cost_allocation
    algorithm_type: constraint_propagation
    description: >-
      Propagates the field diagnosis into a cost owner, an excused-downtime flag and
      a labour figure, and then lets a downstream warranty decision re-point the cost
      owner one more time. The chain reaches a fixed point after the warranty
      decision; nothing re-points a second time.
    input_set: "One TruckRoll being closed out, plus any WarrantyClaim later filed against it."
    formula: |
      if disposition == NO_ACCESS:
          billable_to = HOMEOWNER            labor_cost_cents = NO_ACCESS_FEE_CENTS     outage excused = false
      else by root_cause:
          INVERTER_FAULT   -> billable_to = PENDING_MANUFACTURER  labor_cost_cents = MANUFACTURER_LABOR_CENTS  excused = false
          MODULE_DEFECT    -> billable_to = PENDING_MANUFACTURER  labor_cost_cents = MANUFACTURER_LABOR_CENTS  excused = false
          STRING_FAULT     -> billable_to = SUNRUN_OM             labor_cost_cents = OM_LABOR_CENTS            excused = true
          COMMS_ONLY       -> billable_to = SUNRUN_OM             labor_cost_cents = OM_LABOR_CENTS            excused = true
          HOMEOWNER_CAUSED -> billable_to = HOMEOWNER             labor_cost_cents = NO_ACCESS_FEE_CENTS       excused = false

      then, only while billable_to == PENDING_MANUFACTURER:
          a WarrantyClaim on this roll reaching APPROVED -> billable_to = WARRANTY
          a WarrantyClaim on this roll reaching DENIED   -> billable_to = SUNRUN_OM
      labor_cost_cents is never re-priced by the warranty decision, and the outage's
      excused flag is never revised by it either.
    constants:
      NO_ACCESS_FEE_CENTS: 12500
      OM_LABOR_CENTS: 38000
      MANUFACTURER_LABOR_CENTS: 52000
    precision: >-
      Only the two manufacturer-owned root causes are claimable, and only they leave
      billable_to in the PENDING_MANUFACTURER state that a warranty decision can move.
      Operator-owned causes excuse the downtime; homeowner-owned causes never do.

  - rule_name: outage_severity_grade
    algorithm_type: threshold
    description: Grades an outage by how long it has been open, re-evaluated at triage and frozen at resolution.
    input_set: "One OutageEvent, measured against resolved_at when set, otherwise against the logical clock."
    formula: |
      elapsed_minutes = whole minutes from detected_at to (resolved_at or the current clock instant),
                        truncated toward zero
      elapsed_minutes <  SEVERITY_MEDIUM_MINUTES                              -> LOW
      SEVERITY_MEDIUM_MINUTES <= elapsed_minutes < SEVERITY_HIGH_MINUTES      -> MEDIUM
      elapsed_minutes >= SEVERITY_HIGH_MINUTES                                -> HIGH
    constants:
      SEVERITY_MEDIUM_MINUTES: 1440
      SEVERITY_HIGH_MINUTES: 10080
    precision: >-
      Lower bounds are inclusive and upper bounds exclusive, so exactly 1440 minutes
      is MEDIUM and exactly 10080 minutes is HIGH.

  - rule_name: monitoring_status_projection
    algorithm_type: projection
    description: >-
      The agreement's monitoring_status is not stored independently; it is a
      projection over the agreement's open outage set and is re-derived after every
      event that adds to or removes from that set.
    input_set: "Every OutageEvent for the agreement in status OPEN, TRIAGED or DISPATCHED."
    formula: |
      open_outage_count = count(OutageEvent where agreement_id matches and status in (OPEN, TRIAGED, DISPATCHED))
      monitoring_status = open_outage_count == 0                                  -> MONITORING_OK
                          at least one of those events is DISPATCHED              -> TRUCK_ROLL_DISPATCHED
                          otherwise                                              -> OUTAGE_OPEN
    constants: {}
    precision: >-
      Re-derived, never incrementally toggled: cancelling one of two dispatched
      rolls must leave monitoring_status at TRUCK_ROLL_DISPATCHED because the other
      event is still DISPATCHED.

  - rule_name: credit_ledger_invariant
    algorithm_type: aggregation
    description: >-
      The defining identity for the agreement's three credit counters. It must hold
      after every single write in the system, including after a compensating one.
    input_set: >-
      Every ProductionPeriod and GuaranteeTrueUp of the agreement, plus any CLOSED
      PREPAYMENT TransferCase on it.
    formula: |
      credit_earned_cents  == sum(ProductionPeriod.credit_cents      where status == CREDIT_ISSUED)
                            + sum(GuaranteeTrueUp.net_credit_cents   where status == POSTED)

      credit_applied_cents == sum(ProductionPeriod.credit_applied_cents where status in (RECONCILED, CREDIT_ISSUED))
                            + sum over CLOSED PREPAYMENT TransferCases of the credit consumed at close

      credit_balance_cents == credit_earned_cents - credit_applied_cents
      credit_balance_cents >= 0 always
    constants: {}
    precision: >-
      Voiding a POSTED true-up and reopening a CREDIT_ISSUED period are compensating
      operations: each removes exactly the cents it added, with no drift, and the
      identity holds again immediately.

  - rule_name: excused_downtime_invariant
    algorithm_type: aggregation
    description: >-
      The defining identity for the agreement's excused-downtime counter and its open
      outage count. Dispatching and then cancelling a truck roll is a compensating
      pair that must leave both counters exactly where they started.
    input_set: "Every OutageEvent of the agreement."
    formula: |
      excused_downtime_minutes == sum(OutageEvent.downtime_minutes
                                      where excused == true and status == RESOLVED)
      open_outage_count        == count(OutageEvent where status in (OPEN, TRIAGED, DISPATCHED))
    constants: {}
    precision: >-
      Only a RESOLVED, excused outage contributes minutes. A DISPATCHED outage
      contributes nothing, so dispatching a roll and cancelling it again changes
      neither counter, and a NO_ACCESS completion likewise contributes nothing.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules — strict priority ladder
# When a single request violates several rules, the implementation MUST return
# the error of the LOWEST priority number and stop. The ladder is total: every
# rule below sits at exactly one priority, and no two rules at the same priority
# can be violated by the same request.
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    rule_name: request_authentication
    category: auth
    error_id: ERR_UNAUTHENTICATED
    status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: >-
      The X-User-ID header or the X-Role header is absent, or is present but its
      value is the empty string. Checked before anything else, including before the
      request body is parsed.

  - priority: 2
    rule_name: endpoint_role_permission
    category: authorization
    error_id: ERR_UNAUTHORIZED
    status: 403
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: >-
      The X-Role value is not listed in the endpoint's allowed_roles in §1.5, or is
      not one of the six roles in §1.7 at all. Checked before the body is validated,
      so a forbidden role with a malformed body still gets 403.

  - priority: 3
    rule_name: payload_shape_and_domain
    category: schema
    error_id: ERR_INVALID_REQUEST
    status: 400
    applies_to: "every endpoint that accepts a body or query parameters"
    condition: >-
      A required input field is missing or null; an unknown field is supplied for a
      field the endpoint declares as computed or system; a value has the wrong JSON
      type; an enum value is outside the declared set; a string violates its declared
      length; a numeric value violates its declared range (including negative money,
      fico_score outside 300..850, dti_ratio outside 0..1, guarantee_band_pct outside
      0..0.2, escalator_pct outside 0..0.05, period_month outside 1..12, term_years
      not in {10,15,20,25}); a date or instant is not valid ISO-8601; limit is outside
      1..100 or offset is negative.

  - priority: 4
    rule_name: path_resource_existence
    category: existence
    error_id: "the NOT_FOUND code of the entity named by the path segment"
    status: 404
    applies_to: "every endpoint with a {…_id} path parameter"
    condition: >-
      No entity of that collection has the given id. Returns
      ERR_HOMEOWNER_NOT_FOUND, ERR_TARIFF_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND,
      ERR_PERIOD_NOT_FOUND, ERR_TRUE_UP_NOT_FOUND, ERR_OUTAGE_EVENT_NOT_FOUND,
      ERR_TRUCK_ROLL_NOT_FOUND, ERR_ROOF_WORK_ORDER_NOT_FOUND,
      ERR_TRANSFER_CASE_NOT_FOUND, ERR_UCC_FILING_NOT_FOUND, ERR_ELECTION_NOT_FOUND
      or ERR_WARRANTY_CLAIM_NOT_FOUND according to the path segment.

  - priority: 5
    rule_name: body_reference_existence
    category: existence
    error_id: "the NOT_FOUND code of the entity named by the FK field"
    status: 404
    applies_to: "every POST that carries an FK field in its body"
    condition: >-
      An FK field in the body is syntactically acceptable but names no existing row.
      Evaluated only after every path id has resolved, and in the field order
      declared by the endpoint's input list so that a request with two bad FKs is
      deterministic.

  - priority: 6
    rule_name: homeowner_scope
    category: ownership
    error_id: ERR_NOT_AGREEMENT_HOMEOWNER
    status: 403
    applies_to: "every endpoint whose allowed_roles include Homeowner"
    condition: >-
      X-Role is Homeowner and the resolved target agreement's homeowner_id is not
      the acting X-User-ID's Homeowner id. A Homeowner may read and act only on
      their own agreement and its children; a successor agreement created by a
      RELOCATION close belongs to the same homeowner and is therefore visible.

  - priority: 7
    rule_name: segregation_of_duties
    category: segregation_of_duties
    error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    applies_to: >-
      POST /servicing/guarantee-true-ups/{true_up_id}/void,
      POST /servicing/truck-rolls/{truck_roll_id}/complete,
      POST /servicing/ucc-filings/{ucc_filing_id}/record-subordination,
      POST /servicing/warranty-claims/{warranty_claim_id}/approve,
      POST /servicing/warranty-claims/{warranty_claim_id}/deny
    condition: >-
      The acting X-User-ID equals the X-User-ID that performed the paired earlier
      step: posted_by_user_id for a void, dispatched_by_user_id for a completion,
      the requesting user for a subordination recording, submitted_by_user_id for a
      claim decision. Checked before any state check, so the same user re-voiding an
      already-VOID true-up gets ERR_SEGREGATION_OF_DUTIES rather than a state error.

  - priority: 8
    rule_name: state_transition_legality
    category: state
    error_id: "ERR_INVALID_STATE_TRANSITION, or one of the four specific state codes"
    status: 409
    applies_to: "every action endpoint"
    condition: >-
      The target entity is not in a state from which the requested trigger is listed
      in §1.2. Specific codes take precedence over the generic one when they apply:
      ERR_TRUE_UP_ALREADY_POSTED when posting a true-up for an agreement/contract
      year that already has a POSTED true-up or when re-posting a POSTED one;
      ERR_TRANSFER_ALREADY_OPEN when creating a TransferCase while one is already in
      a non-terminal status; ERR_ELECTION_ALREADY_OPEN when creating an
      EndOfTermElection while one is SUBMITTED or ACCEPTED; ERR_AGREEMENT_NOT_ACTIVE
      when a child write targets an agreement whose lifecycle_state is DRAFT,
      PREPAID_CLOSED or PURCHASED_CLOSED. An agreement closed by removal or
      relocation is NOT reported here: its panels are gone, so REMOVED_CLOSED and
      RELOCATED_CLOSED fall through to the priority-10 decommissioned-asset lockout
      instead. An agreement sitting in TRANSFER_PENDING is likewise NOT reported here
      when an EndOfTermElection creation targets it: that case falls through to the
      priority-12 transfer_blocks_execution rule (ERR_TRANSFER_IN_PROGRESS, 422), so
      the client learns which closing is in the way. Everything else returns
      ERR_INVALID_STATE_TRANSITION.

  - priority: 9
    rule_name: parent_version_freshness
    category: concurrency
    error_id: "ERR_STALE_AGREEMENT_VERSION or ERR_STALE_OUTAGE_EVENT_VERSION"
    status: 412
    applies_to: "POST /servicing/guarantee-true-ups, POST /servicing/truck-rolls"
    condition: >-
      The mandatory expected_agreement_version / expected_outage_event_version does
      not equal the parent's current version. See §1.2.1. Deliberately BELOW the
      state ladder: a stale version against a parent that is also in the wrong state
      returns the state error, because the client's whole premise is wrong.

  - priority: 10
    rule_name: decommissioned_asset_lockout
    category: safety
    error_id: ERR_AGREEMENT_DECOMMISSIONED
    status: 409
    applies_to: >-
      POST /servicing/production-periods, POST /servicing/outage-events,
      POST /servicing/roof-work-orders, POST /servicing/transfer-cases,
      POST /servicing/end-of-term-elections
    condition: >-
      The target agreement's service_status is DECOMMISSIONED, which happens exactly
      when it was closed by removal (REMOVED_CLOSED) or superseded by a relocation
      (RELOCATED_CLOSED). The panels are off the roof, so no new production,
      monitoring, roof or transfer activity may be recorded against it. Priority 8
      deliberately does NOT claim these two lifecycle states, so this more specific
      safety code is what the client sees.

  - priority: 11
    rule_name: election_window_open
    category: business_temporal
    error_id: ERR_ELECTION_WINDOW_CLOSED
    status: 422
    applies_to: "POST /servicing/end-of-term-elections"
    condition: >-
      The current clock date is before window_open_date or strictly after
      window_close_date. Both endpoints of the window are INCLUSIVE: an election
      submitted exactly on window_close_date is accepted.

  - priority: 11
    rule_name: closing_date_not_stale
    category: business_temporal
    error_id: ERR_CLOSING_DATE_IN_PAST
    status: 422
    applies_to: "POST /servicing/transfer-cases, POST /servicing/transfer-cases/{transfer_case_id}/clear-title"
    condition: >-
      At creation, closing_date is strictly before the current clock date. At title
      clearance, the same test is re-applied against the clock as it stands then, so
      a case whose closing slipped past cannot be cleared until it is re-dated.

  - priority: 11
    rule_name: detected_at_not_in_future
    category: business_temporal
    error_id: ERR_DETECTED_AT_IN_FUTURE
    status: 422
    applies_to: "POST /servicing/outage-events"
    condition: "detected_at is strictly after the current logical clock instant."

  - priority: 11
    rule_name: period_must_be_elapsed
    category: business_temporal
    error_id: ERR_PERIOD_NOT_ELAPSED
    status: 422
    applies_to: "POST /servicing/production-periods/{period_id}/reconcile, POST /servicing/guarantee-true-ups"
    condition: >-
      For a reconcile, the current clock instant is before the first instant of the
      month AFTER the period month. For a true-up, at least one of the twelve
      ProductionPeriod months in the requested contract_year has not yet fully
      elapsed against the clock.

  - priority: 11
    rule_name: warranty_window_expired
    category: business_temporal
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    status: 422
    applies_to: "POST /servicing/warranty-claims/{warranty_claim_id}/submit"
    condition: >-
      The current clock date is strictly after warranty_expires_on, which is
      component_install_date plus MODULE_WARRANTY_YEARS (25) or
      INVERTER_WARRANTY_YEARS (10) years, minus one day.

  - priority: 11
    rule_name: roof_dates_coherent
    category: business_temporal
    error_id: ERR_ROOF_DATES_INVALID
    status: 422
    applies_to: "POST /servicing/roof-work-orders"
    condition: >-
      requested_removal_date is strictly before the current clock date, or
      reinstall_target_date is not strictly after requested_removal_date, or the two
      are more than MAX_ROOF_WORK_SPAN_DAYS (45) days apart.

  - priority: 11
    rule_name: roof_removal_not_before_window
    category: business_temporal
    error_id: ERR_ROOF_DATES_INVALID
    status: 422
    applies_to: "POST /servicing/roof-work-orders/{roof_work_order_id}/remove-panels"
    condition: >-
      The current clock date is strictly before the order's suspension_start_date.
      This is the enforcement of the §1.2 APPROVED -> PANELS_REMOVED clock
      precondition: the array cannot come off the roof ahead of its committed window,
      and because this rule sits at priority 11 an order that is not APPROVED at all
      reports the priority-8 ERR_INVALID_STATE_TRANSITION first.

  - priority: 12
    rule_name: title_not_clear
    category: business_referential
    error_id: ERR_TITLE_NOT_CLEAR
    status: 422
    applies_to: "POST /servicing/transfer-cases/{transfer_case_id}/clear-title"
    condition: >-
      At least one UccFiling for the agreement is in FILED or
      SUBORDINATION_REQUESTED. For an ASSUMPTION the acceptable set is
      {SUBORDINATED, TERMINATED}; for a PREPAYMENT or RELOCATION it is
      {SUBORDINATED, TERMINATION_REQUESTED, TERMINATED}.

  - priority: 12
    rule_name: roof_work_blocks_execution
    category: business_referential
    error_id: ERR_ROOF_WORK_IN_PROGRESS
    status: 422
    applies_to: "POST /servicing/end-of-term-elections/{election_id}/execute"
    condition: >-
      A RoofWorkOrder for the agreement is in APPROVED, PANELS_REMOVED or
      ROOF_COMPLETE. The array is committed to a third-party roofing schedule, so the
      end-of-term outcome cannot be executed until the order finishes or is cancelled.

  - priority: 12
    rule_name: transfer_blocks_execution
    category: business_referential
    error_id: ERR_TRANSFER_IN_PROGRESS
    status: 422
    applies_to: "POST /servicing/end-of-term-elections/{election_id}/execute, POST /servicing/end-of-term-elections"
    condition: "A TransferCase for the agreement is in INITIATED, CREDIT_REVIEW, CREDIT_APPROVED or TITLE_CLEARED."

  - priority: 12
    rule_name: true_up_periods_complete
    category: business_referential
    error_id: ERR_PERIODS_INCOMPLETE
    status: 422
    applies_to: "POST /servicing/guarantee-true-ups"
    condition: >-
      Fewer than twelve ProductionPeriod rows exist for the agreement with the
      requested contract_year.

  - priority: 12
    rule_name: truck_roll_not_claimable
    category: business_referential
    error_id: ERR_TRUCK_ROLL_NOT_CLAIMABLE
    status: 422
    applies_to: "POST /servicing/warranty-claims"
    condition: >-
      The referenced TruckRoll is not COMPLETED, or its root_cause is not
      INVERTER_FAULT or MODULE_DEFECT, or its component_type does not match the
      root_cause (MODULE claims require MODULE_DEFECT, INVERTER claims require
      INVERTER_FAULT), or a non-DENIED WarrantyClaim already exists on that roll.

  - priority: 12
    rule_name: buyer_field_coherence
    category: business_referential
    error_id: ERR_BUYER_FIELD_MISMATCH
    status: 422
    applies_to: "POST /servicing/transfer-cases"
    condition: >-
      buyer_homeowner_id is absent for an ASSUMPTION, or present for a PREPAYMENT or
      RELOCATION, or equal to the agreement's current homeowner_id; or
      new_site_address is absent for a RELOCATION or present for the other two types.

  - priority: 12
    rule_name: unapplied_credit_blocks_purchase
    category: business_referential
    error_id: ERR_UNAPPLIED_CREDIT_BLOCKS_PURCHASE
    status: 422
    applies_to: "POST /servicing/end-of-term-elections/{election_id}/accept"
    condition: >-
      election_type is PURCHASE and the agreement's credit_balance_cents is greater
      than 0. Outstanding shortfall credit must be settled through a monthly
      reconciliation before the system can be sold to the homeowner.

  - priority: 13
    rule_name: technician_window_conflict
    category: business_constraint
    error_id: ERR_TECHNICIAN_WINDOW_CONFLICT
    status: 409
    applies_to: "POST /servicing/truck-rolls"
    condition: >-
      Another TruckRoll in status SCHEDULED with the same technician_code has a
      window that overlaps the requested one. Windows are HALF-OPEN
      [scheduled_window_start, scheduled_window_end), so a window starting at the
      exact instant another ends does NOT conflict, and there is no buffer.
      CANCELLED, COMPLETED and NO_ACCESS rolls never conflict.

  - priority: 13
    rule_name: roof_window_conflict
    category: business_constraint
    error_id: ERR_ROOF_WINDOW_CONFLICT
    status: 409
    applies_to: "POST /servicing/roof-work-orders/{roof_work_order_id}/approve"
    condition: >-
      Another RoofWorkOrder for the same agreement in APPROVED, PANELS_REMOVED or
      ROOF_COMPLETE has a suspension window that overlaps this one once BOTH windows
      are widened by ROOF_WORK_BUFFER_DAYS (3) days on each side. Windows are CLOSED
      date intervals, so adjacency conflicts and a 3-day gap still conflicts; a 7-day
      gap does not.

  - priority: 13
    rule_name: roof_work_annual_limit
    category: business_constraint
    error_id: ERR_ROOF_WORK_LIMIT_EXCEEDED
    status: 422
    applies_to: "POST /servicing/roof-work-orders/{roof_work_order_id}/approve"
    condition: >-
      Approving this order would make the count of RoofWorkOrders for the agreement
      in the same contract_year whose status is APPROVED, PANELS_REMOVED,
      ROOF_COMPLETE or REINSTALLED exceed MAX_ROOF_WORK_ORDERS_PER_YEAR (2).
      REQUESTED, QUOTED and CANCELLED orders are NOT counted.

  - priority: 13
    rule_name: claim_revision_limit
    category: business_constraint
    error_id: ERR_CLAIM_REVISION_LIMIT
    status: 422
    applies_to: "POST /servicing/warranty-claims/{warranty_claim_id}/submit"
    condition: >-
      The claim is in INFO_REQUESTED and revision_count already equals
      MAX_CLAIM_REVISIONS (3), so it cannot be re-submitted again.

  - priority: 13
    rule_name: duplicate_production_period
    category: business_constraint
    error_id: ERR_DUPLICATE_PERIOD
    status: 409
    applies_to: "POST /servicing/production-periods"
    condition: "A ProductionPeriod already exists for the same agreement_id, period_year and period_month."

  - priority: 13
    rule_name: duplicate_filing_number
    category: business_constraint
    error_id: ERR_DUPLICATE_FILING_NUMBER
    status: 409
    applies_to: "POST /servicing/ucc-filings"
    condition: "Another UccFiling already has the same filing_number."

  - priority: 13
    rule_name: duplicate_homeowner_email
    category: business_constraint
    error_id: ERR_DUPLICATE_EMAIL
    status: 409
    applies_to: "POST /servicing/homeowners"
    condition: "Another Homeowner already has the same email, compared case-insensitively."

  - priority: 13
    rule_name: duplicate_tariff_code
    category: business_constraint
    error_id: ERR_DUPLICATE_TARIFF_CODE
    status: 409
    applies_to: "POST /servicing/utility-tariffs"
    condition: "Another UtilityTariff already has the same utility_code and tariff_code pair."

  - priority: 13
    rule_name: product_terms_coherence
    category: business_constraint
    error_id: ERR_PRODUCT_TERMS_MISMATCH
    status: 422
    applies_to: "POST /servicing/agreements, POST /servicing/agreements/{agreement_id}/activate"
    condition: >-
      product_type is LEASE and base_monthly_lease_cents is absent or
      base_ppa_rate_per_kwh_millicents is present; or product_type is PPA and
      base_ppa_rate_per_kwh_millicents is absent or base_monthly_lease_cents is
      present.

  - priority: 14
    rule_name: annual_credit_cap
    category: business_fiscal
    error_id: ERR_CREDIT_CAP_EXCEEDED
    status: 422
    applies_to: "POST /servicing/guarantee-true-ups/{true_up_id}/post"
    condition: >-
      The sum of net_credit_cents over every GuaranteeTrueUp for the agreement's
      contract_year that is POSTED, PLUS this true-up's own net_credit_cents, would
      exceed round_half_up(ANNUAL_CREDIT_CAP_PCT (0.25) * annual_contract_value_cents(that
      contract year), 0). The target's own net_credit_cents is included in the sum
      whether or not it is already POSTED, so re-posting a POSTED true-up that
      consumed more than half the cap breaches the cap as well as the state ladder.

  - priority: 14
    rule_name: approved_amount_within_claim
    category: business_fiscal
    error_id: ERR_APPROVED_AMOUNT_EXCEEDS_CLAIM
    status: 422
    applies_to: "POST /servicing/warranty-claims/{warranty_claim_id}/approve"
    condition: "approved_amount_cents is strictly greater than claim_amount_cents."

# ---------------------------------------------------------------------------
# §1.5 Endpoint Table
# 69 endpoints. Every business path is prefixed with the api_prefix /servicing;
# the logical clock endpoint is deliberately outside it. Every entity has a
# detail GET at /servicing/<collection>/{id} and a filtered list GET at
# /servicing/<collection> that accepts every FK it carries as a query filter.
# `input:` lists body fields for writes and query parameters for reads; a
# trailing `?` marks the field optional.
# ---------------------------------------------------------------------------
endpoints:

  # --- Logical clock -------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [PortfolioAdmin, ServicingAgent, CreditUnderwriter, TitleAgent, FieldOpsCoordinator, Homeowner]
    input: [current_utc]
    output: "{ current_utc: string }"
    description: >-
      Sets the server's logical current UTC instant. Every temporal decision in
      this API reads this clock and never the wall clock. On startup the clock is
      initialised to 2026-08-01T00:00:00Z. Authentication headers are not required
      on this endpoint; when supplied they are ignored.
    side_effects:
      - "the logical clock moves; no entity is mutated and no derived field is recomputed until the next write or computed read"

  # --- Homeowner -----------------------------------------------------------
  - method: POST
    path: /servicing/homeowners
    roles: [PortfolioAdmin, ServicingAgent]
    input: [full_name, email, state_code, fico_score, dti_ratio, monthly_income_cents]
    output: Homeowner
    description: Registers a homeowner. Used both for the current customer and for an assuming buyer.
    side_effects: []

  - method: GET
    path: /servicing/homeowners/{homeowner_id}
    roles: [PortfolioAdmin, ServicingAgent, CreditUnderwriter, TitleAgent]
    input: []
    output: Homeowner
    description: Reads one homeowner.
    side_effects: []

  - method: GET
    path: /servicing/homeowners
    roles: [PortfolioAdmin, ServicingAgent, CreditUnderwriter]
    input: ["state_code?", "email?", "limit?", "offset?"]
    output: Homeowner[]
    description: Paginated homeowner list.
    side_effects: []

  # --- UtilityTariff -------------------------------------------------------
  - method: POST
    path: /servicing/utility-tariffs
    roles: [PortfolioAdmin]
    input: [utility_code, tariff_code, generation, retail_rate_per_kwh_millicents, export_credit_rate_per_kwh_millicents, monthly_fixed_charge_cents, effective_from_date, "grandfathers_predecessors?"]
    output: UtilityTariff
    description: >-
      Publishes a net-metering schedule. Immutable: there is no update or delete
      endpoint, so a successor tariff is always a new row.
    side_effects: []

  - method: GET
    path: /servicing/utility-tariffs/{tariff_id}
    roles: [PortfolioAdmin, ServicingAgent, CreditUnderwriter, TitleAgent, FieldOpsCoordinator, Homeowner]
    input: []
    output: UtilityTariff
    description: Reads one tariff.
    side_effects: []

  - method: GET
    path: /servicing/utility-tariffs
    roles: [PortfolioAdmin, ServicingAgent, CreditUnderwriter, TitleAgent, FieldOpsCoordinator, Homeowner]
    input: ["utility_code?", "generation?", "limit?", "offset?"]
    output: UtilityTariff[]
    description: Paginated tariff list.
    side_effects: []

  # --- SolarAgreement ------------------------------------------------------
  - method: POST
    path: /servicing/agreements
    roles: [PortfolioAdmin, ServicingAgent]
    input: [homeowner_id, tariff_id, site_address, state_code, product_type, term_years, contract_start_date, escalator_pct, guaranteed_annual_kwh, system_dc_kw, "guarantee_band_pct?", "base_monthly_lease_cents?", "base_ppa_rate_per_kwh_millicents?"]
    output: SolarAgreement
    description: >-
      Books a lease or PPA in DRAFT. Product-specific base-rate coherence is
      enforced here as well as at activation.
    side_effects:
      - "lifecycle_state DRAFT, monitoring_status MONITORING_OK, service_status IN_SERVICE"
      - "contract_end_date, current_contract_year and the three credit counters initialised"

  - method: GET
    path: /servicing/agreements/{agreement_id}
    roles: [PortfolioAdmin, ServicingAgent, CreditUnderwriter, TitleAgent, FieldOpsCoordinator, Homeowner]
    input: []
    output: SolarAgreement
    description: >-
      Reads one agreement including its three state dimensions, its credit ledger
      counters and its derived monitoring counters.
    side_effects: []

  - method: GET
    path: /servicing/agreements
    roles: [PortfolioAdmin, ServicingAgent, CreditUnderwriter, TitleAgent, FieldOpsCoordinator, Homeowner]
    input: ["homeowner_id?", "tariff_id?", "relocated_from_agreement_id?", "product_type?", "lifecycle_state?", "monitoring_status?", "service_status?", "limit?", "offset?"]
    output: SolarAgreement[]
    description: Paginated agreement list, filterable by owner, tariff, relocation predecessor, product and each state dimension.
    side_effects: []

  - method: POST
    path: /servicing/agreements/{agreement_id}/activate
    roles: [PortfolioAdmin, ServicingAgent]
    input: []
    output: SolarAgreement
    description: Moves a DRAFT agreement to ACTIVE and freezes its grandfathered export rate.
    side_effects:
      - "see §1.2 SolarAgreement.lifecycle_state DRAFT -> ACTIVE"

  - method: POST
    path: /servicing/agreements/{agreement_id}/apply-tariff
    roles: [PortfolioAdmin]
    input: [tariff_id]
    output: SolarAgreement
    description: >-
      Moves the host site onto a different published tariff, e.g. onto a NEM_3
      successor schedule, and re-evaluates grandfathering.
    side_effects:
      - "tariff_id replaced"
      - "tariff_grandfathered recomputed per §1.3 nem_grandfathering_status; grandfathered_export_rate_millicents is NOT re-snapshotted"
      - "version incremented"

  - method: GET
    path: /servicing/agreements/{agreement_id}/savings-projection
    roles: [PortfolioAdmin, ServicingAgent, Homeowner]
    input: []
    output: "{ agreement_id: string, contract_year: integer, self_consumed_kwh: integer, exported_kwh: integer, effective_export_rate_millicents: integer, avoided_import_cents: integer, export_credit_cents: integer, utility_fixed_cents: integer, solar_cost_cents: integer, annual_savings_cents: integer, tariff_grandfathered: boolean }"
    description: Computed read implementing §1.3 savings_projection_annual for the agreement's current contract year.
    side_effects: []

  # --- ProductionPeriod ----------------------------------------------------
  - method: POST
    path: /servicing/production-periods
    roles: [PortfolioAdmin, ServicingAgent]
    input: [agreement_id, period_year, period_month, metered_kwh, "auto_reconcile?", "auto_issue_credit?"]
    output: ProductionPeriod
    description: >-
      Records a metered month in RECORDED. When auto_reconcile is true the row is
      reconciled in the same request exactly as if
      POST /servicing/production-periods/{period_id}/reconcile had followed, with
      issue_credit taken from auto_issue_credit (default false). Both convenience
      flags are inputs only and are never echoed as stored fields.
    side_effects:
      - "gross_expected_kwh, excused_days, adjusted_expected_kwh, contract_year and due_date computed"
      - "when auto_reconcile is true, every side effect of the reconcile transition in §1.2 as well"

  - method: GET
    path: /servicing/production-periods/{period_id}
    roles: [PortfolioAdmin, ServicingAgent, Homeowner]
    input: []
    output: ProductionPeriod
    description: Reads one metered month with its full settlement breakdown.
    side_effects: []

  - method: GET
    path: /servicing/production-periods
    roles: [PortfolioAdmin, ServicingAgent, Homeowner]
    input: ["agreement_id?", "contract_year?", "period_year?", "period_month?", "status?", "limit?", "offset?"]
    output: ProductionPeriod[]
    description: Paginated month list, ordered ascending by (period_year, period_month) when agreement_id is supplied.
    side_effects: []

  - method: POST
    path: /servicing/production-periods/{period_id}/reconcile
    roles: [ServicingAgent]
    input: ["issue_credit?"]
    output: ProductionPeriod
    description: >-
      Runs §1.3 monthly_shortfall_credit and §1.3 period_net_settlement against the
      month. issue_credit defaults to false; when true and the month earned a
      credit, the month lands in CREDIT_ISSUED and the credit is added to the
      agreement's ledger.
    side_effects:
      - "see §1.2 ProductionPeriod RECORDED -> RECONCILED / CREDIT_ISSUED"

  - method: POST
    path: /servicing/production-periods/{period_id}/reopen
    roles: [PortfolioAdmin]
    input: []
    output: ProductionPeriod
    description: Compensating operation that returns a settled month to RECORDED and unwinds its exact ledger movements.
    side_effects:
      - "see §1.2 ProductionPeriod RECONCILED / CREDIT_ISSUED -> RECORDED"

  # --- GuaranteeTrueUp -----------------------------------------------------
  - method: POST
    path: /servicing/guarantee-true-ups
    roles: [PortfolioAdmin, ServicingAgent]
    input: [agreement_id, contract_year, method, expected_agreement_version]
    output: GuaranteeTrueUp
    description: >-
      Computes a DRAFT annual true-up under the requested method. Guarded by
      optimistic concurrency on the parent agreement (§1.2.1).
    side_effects:
      - "every computed figure in §1.3 annual_guarantee_true_up populated; no ledger movement yet"
      - "agreement.version incremented"

  - method: GET
    path: /servicing/guarantee-true-ups/{true_up_id}
    roles: [PortfolioAdmin, ServicingAgent, Homeowner]
    input: []
    output: GuaranteeTrueUp
    description: Reads one true-up.
    side_effects: []

  - method: GET
    path: /servicing/guarantee-true-ups
    roles: [PortfolioAdmin, ServicingAgent, Homeowner]
    input: ["agreement_id?", "contract_year?", "method?", "status?", "limit?", "offset?"]
    output: GuaranteeTrueUp[]
    description: Paginated true-up list.
    side_effects: []

  - method: POST
    path: /servicing/guarantee-true-ups/{true_up_id}/post
    roles: [PortfolioAdmin, ServicingAgent]
    input: []
    output: GuaranteeTrueUp
    description: Posts a DRAFT true-up, moving net_credit_cents onto the agreement's credit ledger.
    side_effects:
      - "see §1.2 GuaranteeTrueUp DRAFT -> POSTED"

  - method: POST
    path: /servicing/guarantee-true-ups/{true_up_id}/void
    roles: [PortfolioAdmin, ServicingAgent]
    input: []
    output: GuaranteeTrueUp
    description: >-
      Compensating operation for a posted true-up. Segregation of duties applies:
      the voiding user may not be the posting user.
    side_effects:
      - "see §1.2 GuaranteeTrueUp POSTED -> VOID and DRAFT -> VOID"

  # --- OutageEvent ---------------------------------------------------------
  - method: POST
    path: /servicing/outage-events
    roles: [FieldOpsCoordinator, PortfolioAdmin]
    input: [agreement_id, inverter_serial, outage_type, detected_at]
    output: OutageEvent
    description: Records a monitoring alarm in OPEN and grades its severity against the clock.
    side_effects:
      - "severity computed per §1.3 outage_severity_grade"
      - "agreement.open_outage_count incremented and monitoring_status re-derived per §1.3 monitoring_status_projection"
      - "agreement.version incremented"

  - method: GET
    path: /servicing/outage-events/{outage_event_id}
    roles: [FieldOpsCoordinator, PortfolioAdmin, ServicingAgent, Homeowner]
    input: []
    output: OutageEvent
    description: Reads one outage event including its live downtime figure and version.
    side_effects: []

  - method: GET
    path: /servicing/outage-events
    roles: [FieldOpsCoordinator, PortfolioAdmin, ServicingAgent, Homeowner]
    input: ["agreement_id?", "status?", "outage_type?", "severity?", "excused?", "limit?", "offset?"]
    output: OutageEvent[]
    description: Paginated outage list.
    side_effects: []

  - method: POST
    path: /servicing/outage-events/{outage_event_id}/triage
    roles: [FieldOpsCoordinator]
    input: []
    output: OutageEvent
    description: Confirms an alarm is real and makes it dispatchable.
    side_effects:
      - "see §1.2 OutageEvent OPEN -> TRIAGED"

  - method: POST
    path: /servicing/outage-events/{outage_event_id}/mark-false-positive
    roles: [FieldOpsCoordinator, PortfolioAdmin]
    input: []
    output: OutageEvent
    description: Closes an alarm that was never a real fault. Only possible before any truck roll exists.
    side_effects:
      - "see §1.2 OutageEvent OPEN -> FALSE_POSITIVE"

  # --- TruckRoll -----------------------------------------------------------
  - method: POST
    path: /servicing/truck-rolls
    roles: [FieldOpsCoordinator]
    input: [outage_event_id, technician_code, scheduled_window_start, scheduled_window_end, expected_outage_event_version]
    output: TruckRoll
    description: >-
      Dispatches a technician against a TRIAGED outage. Guarded by optimistic
      concurrency on the parent outage event (§1.2.1) and by a half-open
      technician window conflict check.
    side_effects:
      - "agreement_id copied from the outage event"
      - "dispatched_by_user_id := the acting X-User-ID"
      - "the outage event advances TRIAGED -> DISPATCHED and its version increments"
      - "agreement.monitoring_status re-derived; agreement.version incremented"

  - method: GET
    path: /servicing/truck-rolls/{truck_roll_id}
    roles: [FieldOpsCoordinator, PortfolioAdmin, ServicingAgent]
    input: []
    output: TruckRoll
    description: Reads one dispatch including its cost allocation.
    side_effects: []

  - method: GET
    path: /servicing/truck-rolls
    roles: [FieldOpsCoordinator, PortfolioAdmin, ServicingAgent]
    input: ["outage_event_id?", "agreement_id?", "technician_code?", "status?", "billable_to?", "root_cause?", "limit?", "offset?"]
    output: TruckRoll[]
    description: Paginated dispatch list.
    side_effects: []

  - method: POST
    path: /servicing/truck-rolls/{truck_roll_id}/complete
    roles: [FieldOpsCoordinator]
    input: [disposition, "root_cause?"]
    output: TruckRoll
    description: >-
      Closes out a dispatch. Segregation of duties applies: the closing user may
      not be the dispatching user. Runs §1.3 truck_roll_cost_allocation.
    side_effects:
      - "see §1.2 TruckRoll SCHEDULED -> COMPLETED / NO_ACCESS"

  - method: POST
    path: /servicing/truck-rolls/{truck_roll_id}/cancel
    roles: [FieldOpsCoordinator, PortfolioAdmin]
    input: []
    output: TruckRoll
    description: >-
      Compensating operation for a dispatch. Frees the technician window and
      returns the outage event to TRIAGED with both agreement counters untouched.
    side_effects:
      - "see §1.2 TruckRoll SCHEDULED -> CANCELLED"

  # --- RoofWorkOrder -------------------------------------------------------
  - method: POST
    path: /servicing/roof-work-orders
    roles: [Homeowner, ServicingAgent, PortfolioAdmin]
    input: [agreement_id, requested_removal_date, reinstall_target_date, roofer_company]
    output: RoofWorkOrder
    description: Opens a removal-and-reinstall request in REQUESTED and derives its suspension window.
    side_effects:
      - "suspension_start_date, suspension_end_date, suspension_days and contract_year computed"

  - method: GET
    path: /servicing/roof-work-orders/{roof_work_order_id}
    roles: [Homeowner, ServicingAgent, FieldOpsCoordinator, PortfolioAdmin]
    input: []
    output: RoofWorkOrder
    description: Reads one roof work order.
    side_effects: []

  - method: GET
    path: /servicing/roof-work-orders
    roles: [Homeowner, ServicingAgent, FieldOpsCoordinator, PortfolioAdmin]
    input: ["agreement_id?", "status?", "contract_year?", "limit?", "offset?"]
    output: RoofWorkOrder[]
    description: Paginated roof work order list.
    side_effects: []

  - method: POST
    path: /servicing/roof-work-orders/{roof_work_order_id}/quote
    roles: [FieldOpsCoordinator, ServicingAgent]
    input: [quote_cents]
    output: RoofWorkOrder
    description: Attaches the roofer's removal-and-reinstall quote.
    side_effects:
      - "see §1.2 RoofWorkOrder REQUESTED -> QUOTED"

  - method: POST
    path: /servicing/roof-work-orders/{roof_work_order_id}/approve
    roles: [ServicingAgent, PortfolioAdmin]
    input: []
    output: RoofWorkOrder
    description: >-
      Commits the suspension window. Enforces the buffered closed-interval window
      conflict check and the per-contract-year cap.
    side_effects:
      - "see §1.2 RoofWorkOrder QUOTED -> APPROVED"

  - method: POST
    path: /servicing/roof-work-orders/{roof_work_order_id}/remove-panels
    roles: [FieldOpsCoordinator]
    input: []
    output: RoofWorkOrder
    description: Records that the array is off the roof; suspends the asset without touching lifecycle_state.
    side_effects:
      - "see §1.2 RoofWorkOrder APPROVED -> PANELS_REMOVED"

  - method: POST
    path: /servicing/roof-work-orders/{roof_work_order_id}/roof-complete
    roles: [FieldOpsCoordinator]
    input: []
    output: RoofWorkOrder
    description: Records that the roofer has finished and the array can go back up.
    side_effects:
      - "see §1.2 RoofWorkOrder PANELS_REMOVED -> ROOF_COMPLETE"

  - method: POST
    path: /servicing/roof-work-orders/{roof_work_order_id}/reinstall
    roles: [FieldOpsCoordinator]
    input: []
    output: RoofWorkOrder
    description: Records reinstallation and returns the asset to service.
    side_effects:
      - "see §1.2 RoofWorkOrder ROOF_COMPLETE -> REINSTALLED"

  - method: POST
    path: /servicing/roof-work-orders/{roof_work_order_id}/cancel
    roles: [Homeowner, ServicingAgent, PortfolioAdmin]
    input: []
    output: RoofWorkOrder
    description: Abandons a roof work order and releases any window it was holding.
    side_effects:
      - "see §1.2 RoofWorkOrder REQUESTED / QUOTED / APPROVED -> CANCELLED"

  # --- TransferCase --------------------------------------------------------
  - method: POST
    path: /servicing/transfer-cases
    roles: [ServicingAgent]
    input: [agreement_id, transfer_type, closing_date, "buyer_homeowner_id?", "new_site_address?"]
    output: TransferCase
    description: >-
      Opens a transfer at sale. The system forks on transfer_type inside this one
      request: ASSUMPTION lands in CREDIT_REVIEW, PREPAYMENT and RELOCATION land in
      INITIATED.
    side_effects:
      - "seller_homeowner_id copied from the agreement"
      - "elapsed_term_months and remaining_term_months computed from closing_date"
      - "agreement.lifecycle_state ACTIVE -> TRANSFER_PENDING; agreement.version incremented"

  - method: GET
    path: /servicing/transfer-cases/{transfer_case_id}
    roles: [ServicingAgent, CreditUnderwriter, TitleAgent, PortfolioAdmin, Homeowner]
    input: []
    output: TransferCase
    description: Reads one transfer case including its credit decision and payoff quote.
    side_effects: []

  - method: GET
    path: /servicing/transfer-cases
    roles: [ServicingAgent, CreditUnderwriter, TitleAgent, PortfolioAdmin, Homeowner]
    input: ["agreement_id?", "seller_homeowner_id?", "buyer_homeowner_id?", "successor_agreement_id?", "transfer_type?", "status?", "limit?", "offset?"]
    output: TransferCase[]
    description: Paginated transfer case list.
    side_effects: []

  - method: POST
    path: /servicing/transfer-cases/{transfer_case_id}/run-credit-review
    roles: [CreditUnderwriter]
    input: []
    output: TransferCase
    description: Runs §1.3 buyer_credit_qualification on the buyer and records the tier decision.
    side_effects:
      - "see §1.2 TransferCase CREDIT_REVIEW -> CREDIT_APPROVED / CREDIT_DECLINED"

  - method: POST
    path: /servicing/transfer-cases/{transfer_case_id}/clear-title
    roles: [TitleAgent]
    input: []
    output: TransferCase
    description: >-
      Confirms every UCC fixture filing on the property has been dealt with and
      prices the payoff for a PREPAYMENT or RELOCATION.
    side_effects:
      - "see §1.2 TransferCase CREDIT_APPROVED / INITIATED -> TITLE_CLEARED"

  - method: POST
    path: /servicing/transfer-cases/{transfer_case_id}/close
    roles: [ServicingAgent, PortfolioAdmin]
    input: []
    output: TransferCase
    description: >-
      Closes the transfer. The side-effect set diverges completely by
      transfer_type: reassignment, payoff-and-termination, or a minted successor
      agreement.
    side_effects:
      - "see §1.2 TransferCase TITLE_CLEARED -> CLOSED and the matching SolarAgreement / UccFiling transitions"

  - method: POST
    path: /servicing/transfer-cases/{transfer_case_id}/cancel
    roles: [ServicingAgent, PortfolioAdmin]
    input: []
    output: TransferCase
    description: Abandons a transfer and returns the agreement to ACTIVE.
    side_effects:
      - "see §1.2 TransferCase INITIATED / CREDIT_REVIEW / CREDIT_APPROVED / TITLE_CLEARED -> CANCELLED"

  # --- UccFiling -----------------------------------------------------------
  - method: POST
    path: /servicing/ucc-filings
    roles: [TitleAgent, PortfolioAdmin]
    input: [agreement_id, filing_number, jurisdiction_code, filing_type, filed_date]
    output: UccFiling
    description: Records a rooftop fixture filing or an amendment in FILED.
    side_effects: []

  - method: GET
    path: /servicing/ucc-filings/{ucc_filing_id}
    roles: [TitleAgent, ServicingAgent, PortfolioAdmin]
    input: []
    output: UccFiling
    description: Reads one filing.
    side_effects: []

  - method: GET
    path: /servicing/ucc-filings
    roles: [TitleAgent, ServicingAgent, PortfolioAdmin]
    input: ["agreement_id?", "requested_by_transfer_case_id?", "jurisdiction_code?", "filing_type?", "status?", "limit?", "offset?"]
    output: UccFiling[]
    description: Paginated filing list.
    side_effects: []

  - method: POST
    path: /servicing/ucc-filings/{ucc_filing_id}/request-subordination
    roles: [TitleAgent, ServicingAgent]
    input: []
    output: UccFiling
    description: >-
      Asks the secured party to subordinate to the buyer's new mortgage. Requires an
      open transfer case on the same agreement, which it stamps onto the filing.
    side_effects:
      - "see §1.2 UccFiling FILED -> SUBORDINATION_REQUESTED"

  - method: POST
    path: /servicing/ucc-filings/{ucc_filing_id}/record-subordination
    roles: [TitleAgent]
    input: []
    output: UccFiling
    description: >-
      Records the executed subordination. Segregation of duties applies: the
      recording user may not be the requesting user.
    side_effects:
      - "see §1.2 UccFiling SUBORDINATION_REQUESTED -> SUBORDINATED"

  - method: POST
    path: /servicing/ucc-filings/{ucc_filing_id}/request-termination
    roles: [TitleAgent, ServicingAgent]
    input: []
    output: UccFiling
    description: Files the UCC-3 termination request ahead of a payoff or an end-of-term buyout.
    side_effects:
      - "see §1.2 UccFiling FILED / SUBORDINATED -> TERMINATION_REQUESTED"

  - method: POST
    path: /servicing/ucc-filings/{ucc_filing_id}/terminate
    roles: [TitleAgent]
    input: []
    output: UccFiling
    description: Records the recorded termination and stamps terminated_date from the clock.
    side_effects:
      - "see §1.2 UccFiling TERMINATION_REQUESTED -> TERMINATED"

  # --- EndOfTermElection ---------------------------------------------------
  - method: POST
    path: /servicing/end-of-term-elections
    roles: [Homeowner, ServicingAgent, PortfolioAdmin]
    input: [agreement_id, election_type]
    output: EndOfTermElection
    description: >-
      Submits the homeowner's end-of-term choice and prices all three options via
      §1.3 end_of_term_election_pricing. Only allowed inside the election window.
    side_effects:
      - "elected_on_date, window_open_date, window_close_date, elapsed_full_years, residual_pct and the three price figures computed"
      - "elected_by_user_id := the acting X-User-ID"
      - "agreement.lifecycle_state ACTIVE -> END_OF_TERM_PENDING; agreement.version incremented"

  - method: GET
    path: /servicing/end-of-term-elections/{election_id}
    roles: [Homeowner, ServicingAgent, PortfolioAdmin]
    input: []
    output: EndOfTermElection
    description: Reads one election with all three priced options.
    side_effects: []

  - method: GET
    path: /servicing/end-of-term-elections
    roles: [Homeowner, ServicingAgent, PortfolioAdmin]
    input: ["agreement_id?", "election_type?", "status?", "limit?", "offset?"]
    output: EndOfTermElection[]
    description: Paginated election list.
    side_effects: []

  - method: POST
    path: /servicing/end-of-term-elections/{election_id}/accept
    roles: [ServicingAgent, PortfolioAdmin]
    input: []
    output: EndOfTermElection
    description: >-
      Accepts the election. A PURCHASE cannot be accepted while unapplied shortfall
      credit is outstanding; a REMOVAL immediately flags the asset for decommission.
    side_effects:
      - "see §1.2 EndOfTermElection SUBMITTED -> ACCEPTED"

  - method: POST
    path: /servicing/end-of-term-elections/{election_id}/execute
    roles: [PortfolioAdmin]
    input: []
    output: EndOfTermElection
    description: >-
      Executes the accepted outcome. Blocked by an in-flight roof work order or
      transfer case. RENEW cycles the agreement back to ACTIVE; PURCHASE and REMOVAL
      close it and cascade UCC terminations.
    side_effects:
      - "see §1.2 EndOfTermElection ACCEPTED -> EXECUTED and the matching SolarAgreement / UccFiling transitions"

  - method: POST
    path: /servicing/end-of-term-elections/{election_id}/withdraw
    roles: [Homeowner, ServicingAgent, PortfolioAdmin]
    input: []
    output: EndOfTermElection
    description: Withdraws the election and rolls both affected agreement dimensions back.
    side_effects:
      - "see §1.2 EndOfTermElection SUBMITTED / ACCEPTED -> WITHDRAWN"

  # --- WarrantyClaim -------------------------------------------------------
  - method: POST
    path: /servicing/warranty-claims
    roles: [FieldOpsCoordinator]
    input: [truck_roll_id, component_type, manufacturer_code, serial_number, component_install_date, claim_amount_cents]
    output: WarrantyClaim
    description: >-
      Opens a manufacturer warranty claim in DRAFT against a completed truck roll
      whose diagnosis pointed at a module or inverter defect.
    side_effects:
      - "agreement_id copied from the truck roll"
      - "warranty_term_years and warranty_expires_on computed from component_type and component_install_date"

  - method: GET
    path: /servicing/warranty-claims/{warranty_claim_id}
    roles: [FieldOpsCoordinator, ServicingAgent, PortfolioAdmin]
    input: []
    output: WarrantyClaim
    description: Reads one claim.
    side_effects: []

  - method: GET
    path: /servicing/warranty-claims
    roles: [FieldOpsCoordinator, ServicingAgent, PortfolioAdmin]
    input: ["truck_roll_id?", "agreement_id?", "component_type?", "manufacturer_code?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    description: Paginated claim list.
    side_effects: []

  - method: POST
    path: /servicing/warranty-claims/{warranty_claim_id}/submit
    roles: [FieldOpsCoordinator]
    input: []
    output: WarrantyClaim
    description: >-
      Submits or re-submits the claim to the manufacturer. Re-submission after an
      information request increments revision_count and is capped.
    side_effects:
      - "see §1.2 WarrantyClaim DRAFT -> SUBMITTED and INFO_REQUESTED -> SUBMITTED"

  - method: POST
    path: /servicing/warranty-claims/{warranty_claim_id}/request-info
    roles: [FieldOpsCoordinator, PortfolioAdmin]
    input: [info_request_note]
    output: WarrantyClaim
    description: Records the manufacturer's request for additional information.
    side_effects:
      - "see §1.2 WarrantyClaim SUBMITTED -> INFO_REQUESTED"

  - method: POST
    path: /servicing/warranty-claims/{warranty_claim_id}/approve
    roles: [FieldOpsCoordinator, PortfolioAdmin]
    input: [approved_amount_cents]
    output: WarrantyClaim
    description: >-
      Records the manufacturer's allowance and re-points the truck roll's cost to
      WARRANTY. Segregation of duties applies against submitted_by_user_id.
    side_effects:
      - "see §1.2 WarrantyClaim SUBMITTED -> APPROVED"

  - method: POST
    path: /servicing/warranty-claims/{warranty_claim_id}/deny
    roles: [FieldOpsCoordinator, PortfolioAdmin]
    input: []
    output: WarrantyClaim
    description: >-
      Records a denial and re-points the truck roll's cost to SUNRUN_OM.
      Segregation of duties applies against submitted_by_user_id.
    side_effects:
      - "see §1.2 WarrantyClaim SUBMITTED -> DENIED"

# ---------------------------------------------------------------------------
# §1.6 Error Catalogue — 49 codes, every one reachable from §1.5
# ---------------------------------------------------------------------------
errors:

  # --- authentication / authorization -------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    status: 401
    category: auth
    when: "X-User-ID or X-Role is absent or empty on any endpoint other than the clock endpoint."
  - error_id: ERR_UNAUTHORIZED
    status: 403
    category: authorization
    when: "The X-Role value is not in the endpoint's §1.5 roles list, or is not one of the six §1.7 roles."
  - error_id: ERR_NOT_AGREEMENT_HOMEOWNER
    status: 403
    category: ownership
    when: "X-Role is Homeowner and the target agreement's homeowner_id is not the acting user's Homeowner id."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    status: 403
    category: segregation_of_duties
    when: "The acting X-User-ID is the same user that performed the paired earlier step of a two-person control."

  # --- schema --------------------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    status: 400
    category: schema
    when: "Missing required field, wrong type, unknown enum value, out-of-range number, malformed ISO date or instant, or bad pagination parameter."

  # --- existence -----------------------------------------------------------
  - error_id: ERR_HOMEOWNER_NOT_FOUND
    status: 404
    category: existence
    when: "A {homeowner_id} path segment or a homeowner_id / buyer_homeowner_id body reference names no Homeowner."
  - error_id: ERR_TARIFF_NOT_FOUND
    status: 404
    category: existence
    when: "A {tariff_id} path segment or a tariff_id body reference names no UtilityTariff."
  - error_id: ERR_AGREEMENT_NOT_FOUND
    status: 404
    category: existence
    when: "An {agreement_id} path segment or an agreement_id body reference names no SolarAgreement."
  - error_id: ERR_PERIOD_NOT_FOUND
    status: 404
    category: existence
    when: "A {period_id} path segment names no ProductionPeriod."
  - error_id: ERR_TRUE_UP_NOT_FOUND
    status: 404
    category: existence
    when: "A {true_up_id} path segment names no GuaranteeTrueUp."
  - error_id: ERR_OUTAGE_EVENT_NOT_FOUND
    status: 404
    category: existence
    when: "An {outage_event_id} path segment or an outage_event_id body reference names no OutageEvent."
  - error_id: ERR_TRUCK_ROLL_NOT_FOUND
    status: 404
    category: existence
    when: "A {truck_roll_id} path segment or a truck_roll_id body reference names no TruckRoll."
  - error_id: ERR_ROOF_WORK_ORDER_NOT_FOUND
    status: 404
    category: existence
    when: "A {roof_work_order_id} path segment names no RoofWorkOrder."
  - error_id: ERR_TRANSFER_CASE_NOT_FOUND
    status: 404
    category: existence
    when: "A {transfer_case_id} path segment names no TransferCase."
  - error_id: ERR_UCC_FILING_NOT_FOUND
    status: 404
    category: existence
    when: "A {ucc_filing_id} path segment names no UccFiling."
  - error_id: ERR_ELECTION_NOT_FOUND
    status: 404
    category: existence
    when: "An {election_id} path segment names no EndOfTermElection."
  - error_id: ERR_WARRANTY_CLAIM_NOT_FOUND
    status: 404
    category: existence
    when: "A {warranty_claim_id} path segment names no WarrantyClaim."

  # --- state ---------------------------------------------------------------
  - error_id: ERR_INVALID_STATE_TRANSITION
    status: 409
    category: state
    when: "The requested trigger is not listed in §1.2 for the entity's current state and no more specific state code applies."
  - error_id: ERR_TRUE_UP_ALREADY_POSTED
    status: 409
    category: state
    when: "Posting a true-up when the target is already POSTED, or when another true-up for the same agreement and contract_year is POSTED."
  - error_id: ERR_TRANSFER_ALREADY_OPEN
    status: 409
    category: state
    when: "Creating a TransferCase while one for the same agreement is in INITIATED, CREDIT_REVIEW, CREDIT_APPROVED or TITLE_CLEARED."
  - error_id: ERR_ELECTION_ALREADY_OPEN
    status: 409
    category: state
    when: "Creating an EndOfTermElection while one for the same agreement is SUBMITTED or ACCEPTED."
  - error_id: ERR_AGREEMENT_NOT_ACTIVE
    status: 409
    category: state
    when: "A child write targets an agreement whose lifecycle_state is DRAFT, PREPAID_CLOSED or PURCHASED_CLOSED. REMOVED_CLOSED and RELOCATED_CLOSED agreements are DECOMMISSIONED and return ERR_AGREEMENT_DECOMMISSIONED instead."

  # --- concurrency ---------------------------------------------------------
  - error_id: ERR_STALE_AGREEMENT_VERSION
    status: 412
    category: concurrency
    when: "expected_agreement_version on POST /servicing/guarantee-true-ups does not equal the agreement's current version."
  - error_id: ERR_STALE_OUTAGE_EVENT_VERSION
    status: 412
    category: concurrency
    when: "expected_outage_event_version on POST /servicing/truck-rolls does not equal the outage event's current version."

  # --- safety --------------------------------------------------------------
  - error_id: ERR_AGREEMENT_DECOMMISSIONED
    status: 409
    category: safety
    when: "A new ProductionPeriod, OutageEvent, RoofWorkOrder, TransferCase or EndOfTermElection is written against an agreement whose service_status is DECOMMISSIONED (i.e. one that is REMOVED_CLOSED or RELOCATED_CLOSED)."

  # --- business_temporal ---------------------------------------------------
  - error_id: ERR_ELECTION_WINDOW_CLOSED
    status: 422
    category: business_temporal
    when: "The clock date is before window_open_date or strictly after window_close_date. window_close_date itself is inside the window."
  - error_id: ERR_CLOSING_DATE_IN_PAST
    status: 422
    category: business_temporal
    when: "closing_date is strictly before the clock date, at TransferCase creation or at title clearance."
  - error_id: ERR_DETECTED_AT_IN_FUTURE
    status: 422
    category: business_temporal
    when: "detected_at on a new OutageEvent is strictly after the current clock instant."
  - error_id: ERR_PERIOD_NOT_ELAPSED
    status: 422
    category: business_temporal
    when: "Reconciling a month that has not fully elapsed, or truing up a contract year whose twelfth month has not fully elapsed."
  - error_id: ERR_WARRANTY_WINDOW_EXPIRED
    status: 422
    category: business_temporal
    when: "The clock date is strictly after the claim's warranty_expires_on."
  - error_id: ERR_ROOF_DATES_INVALID
    status: 422
    category: business_temporal
    when: >-
      At creation: requested_removal_date is before the clock date,
      reinstall_target_date is not after it, or the span exceeds
      MAX_ROOF_WORK_SPAN_DAYS. At removal: the clock date is still before the
      order's suspension_start_date.

  # --- business_referential ------------------------------------------------
  - error_id: ERR_TITLE_NOT_CLEAR
    status: 422
    category: business_referential
    when: "A UccFiling for the agreement is still FILED or SUBORDINATION_REQUESTED when title clearance is attempted."
  - error_id: ERR_ROOF_WORK_IN_PROGRESS
    status: 422
    category: business_referential
    when: "A RoofWorkOrder for the agreement is APPROVED, PANELS_REMOVED or ROOF_COMPLETE when an election execution is attempted."
  - error_id: ERR_TRANSFER_IN_PROGRESS
    status: 422
    category: business_referential
    when: "A non-terminal TransferCase exists for the agreement when an election is submitted or executed."
  - error_id: ERR_PERIODS_INCOMPLETE
    status: 422
    category: business_referential
    when: "Fewer than twelve ProductionPeriod rows exist for the agreement's requested contract_year."
  - error_id: ERR_TRUCK_ROLL_NOT_CLAIMABLE
    status: 422
    category: business_referential
    when: "The referenced TruckRoll is not COMPLETED, its root_cause is not manufacturer-owned, component_type does not match root_cause, or a non-DENIED claim already exists on it."
  - error_id: ERR_BUYER_FIELD_MISMATCH
    status: 422
    category: business_referential
    when: "buyer_homeowner_id or new_site_address is present when the transfer_type forbids it, absent when it requires it, or the buyer equals the current homeowner."
  - error_id: ERR_UNAPPLIED_CREDIT_BLOCKS_PURCHASE
    status: 422
    category: business_referential
    when: "A PURCHASE election is accepted while the agreement's credit_balance_cents is greater than 0."

  # --- business_constraint -------------------------------------------------
  - error_id: ERR_TECHNICIAN_WINDOW_CONFLICT
    status: 409
    category: business_constraint
    when: "Another SCHEDULED TruckRoll with the same technician_code overlaps the requested half-open window."
  - error_id: ERR_ROOF_WINDOW_CONFLICT
    status: 409
    category: business_constraint
    when: "Another active RoofWorkOrder's suspension window overlaps this one once both are widened by ROOF_WORK_BUFFER_DAYS."
  - error_id: ERR_ROOF_WORK_LIMIT_EXCEEDED
    status: 422
    category: business_constraint
    when: "Approving the order would push the agreement past MAX_ROOF_WORK_ORDERS_PER_YEAR approved-or-later orders in that contract_year."
  - error_id: ERR_CLAIM_REVISION_LIMIT
    status: 422
    category: business_constraint
    when: "Re-submitting a claim whose revision_count already equals MAX_CLAIM_REVISIONS."
  - error_id: ERR_DUPLICATE_PERIOD
    status: 409
    category: business_constraint
    when: "A ProductionPeriod already exists for the same agreement_id, period_year and period_month."
  - error_id: ERR_DUPLICATE_FILING_NUMBER
    status: 409
    category: business_constraint
    when: "Another UccFiling already carries the same filing_number."
  - error_id: ERR_DUPLICATE_EMAIL
    status: 409
    category: business_constraint
    when: "Another Homeowner already carries the same email, compared case-insensitively."
  - error_id: ERR_DUPLICATE_TARIFF_CODE
    status: 409
    category: business_constraint
    when: "Another UtilityTariff already carries the same utility_code and tariff_code pair."
  - error_id: ERR_PRODUCT_TERMS_MISMATCH
    status: 422
    category: business_constraint
    when: "The supplied base-rate fields do not match product_type, at agreement creation or at activation."

  # --- business_fiscal -----------------------------------------------------
  - error_id: ERR_CREDIT_CAP_EXCEEDED
    status: 422
    category: business_fiscal
    when: "Posting the true-up would push the contract year's posted net credit past ANNUAL_CREDIT_CAP_PCT of that year's annual contract value."
  - error_id: ERR_APPROVED_AMOUNT_EXCEEDS_CLAIM
    status: 422
    category: business_fiscal
    when: "approved_amount_cents is strictly greater than claim_amount_cents."

# ---------------------------------------------------------------------------
# §1.7 Roles
# Segregation of duties: the credit decision, title clearance, field diagnosis
# and portfolio administration are four separate hands, and three operations
# additionally require two DIFFERENT X-User-IDs inside the SAME role.
