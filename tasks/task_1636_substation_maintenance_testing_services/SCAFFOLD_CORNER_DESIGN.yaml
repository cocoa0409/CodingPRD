              captures: { tech_a: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Verifier OC2", employee_code: "EMP-OC2B" }
              as: OperationsManager
              captures: { tech_b: $.data.id }
            - call: "POST /technicians/${tech_b}/certifications"
              payload: { cert_type: "NETA_LEVEL_4", issued_at: "2025-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /relay-settings"
              payload: { asset_id: "${asset_id}", setting_group: "G1", pickup_a: 80, time_dial: 2.0, curve: "IEC_SI" }
              as: Technician
              as_user_id: "${tech_a}"
              captures: { rs1_id: $.data.id }
            - call: "POST /relay-settings/${rs1_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_a}"
            - call: "POST /relay-settings/${rs1_id}/verify"
              payload: {}
              as: Technician
              as_user_id: "${tech_b}"
            - call: "POST /relay-settings"
              payload: { asset_id: "${asset_id}", setting_group: "G1", pickup_a: 85, time_dial: 2.2, curve: "IEC_VI" }
              as: Technician
              as_user_id: "${tech_a}"
              captures: { rs2_id: $.data.id }
            - call: "POST /relay-settings/${rs2_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech_a}"
            - call: "POST /relay-settings/${rs2_id}/verify"
              payload: {}
              as: Technician
              as_user_id: "${tech_b}"
          trigger:
            - call: "POST /relay-settings/${rs1_id}/activate"
              payload: { expected_asset_version: "${asset_v_pre}" }
              as: Technician
              as_user_id: "${tech_b}"
              captures: { rs1_status: $.data.status }
            - call: "POST /relay-settings/${rs2_id}/activate"
              payload: { expected_asset_version: "${asset_v_pre}" }
              as: Technician
              as_user_id: "${tech_b}"
              captures: { err: $.data.error_id }
          assert:
            - "S1 activation succeeds with the pre-activation version (status == ACTIVE)"
            - "S2 activation with the SAME stale version rejected: error_id == ERR_STALE_VERSION and HTTP status == 412 (asset version advanced by S1's activation)"
      - name: selector_tie_break_covered
        claim_type: selector_determinism
        grounds: ["calculations.spare_selection_score"]
        excluded_because:
          difficulty_instance: combinatorial_formula / spare_selector_scoring_mode_a
          rationale: "Eligibility filter, ranking expression, and created_at ASC tie-break asserted in the named §1.8 instance."
      - name: derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds: ["entities.Asset.fields.condition_score"]
        excluded_because:
          difficulty_instance: transitive_cascade / workorder_verify_cascade_depth2
          rationale: "condition_score and next_due_date reconciliation after defect closure asserted in the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_consistency_on_create_and_mutate
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: mutation effects are visible in the same response and in the immediately following GET — no delayed reconciliation."
        test_recipe:
          setup: ["substation exists"]
          setup_api_calls:
            - call: "POST /substations"
              payload: { name: "Sub IM", code: "SUB-IM", region: "West" }
              as: OperationsManager
              captures: { sub_id: $.data.id }
            - call: "POST /asset-class-policies"
              payload: { asset_class: "POWER_TRANSFORMER", interval_months: 12, condition_escalation_threshold: 60, condition_critical_threshold: 40, oil_warn_ppm: 20, oil_critical_ppm: 35, ir_min_mohm: 1000, relay_timing_warn_pct: 5, relay_timing_fail_pct: 10, w_insulation: 0.4, w_oil: 0.35, w_relay: 0.25 }
              as: OperationsManager
          trigger:
            - call: "POST /assets"
              payload: { substation_id: "${sub_id}", asset_class: "POWER_TRANSFORMER", voltage_kv: 115, install_date: "2020-06-01T00:00:00Z" }
              as: OperationsManager
              captures: { asset_id: $.data.id, score_in_resp: $.data.condition_score, due_in_resp: $.data.next_due_date }
            - call: "GET /assets/${asset_id}"
              payload: {}
              as: OperationsManager
              captures: { score_read: $.data.condition_score, due_read: $.data.next_due_date }
          assert:
            - "create response already carries condition_score == 100.00 and next_due_date == '2021-06-01' (12 months from install_date 2020-06-01; no completed maintenance yet)"
            - "immediate GET returns identical values (no lag between write and read)"
      - name: completion_response_immediacy_covered
        claim_type: immediate_visibility
        grounds: ["endpoints.\"POST /work-orders/{id}/complete\""]
        excluded_because:
          difficulty_instance: combinatorial_formula / workorder_cost_rounding_mode_b
          rationale: "total_cost/cost_subtotal/mobilization_fee are captured from the completion response itself in the named §1.8 instance — same-request visibility is asserted there."
