          assert:
            - "HTTP 409 with data.error_id == 'ERR_ADVANCE_MANDATE_FLOOR'."
            - "A subsequent GET /advance-payments?claim_id=${cl} returns total_count == 1 with data[0].status == 'ISSUED', data[0].amount == 600.00 and data[0].voided_at_utc == null."
            - "A subsequent GET /claims/${cl} returns data.advance_paid_total == 600.00, data.advance_cap == 600.00, data.paid_amount == 600.00 and data.case_reserve == 1400.00."
            - "A subsequent GET /reserve-entries?claim_id=${cl} returns total_count == 2 (INITIAL_CASE plus the PAYMENT entry; no REVERSAL was appended)."

      - name: corner_err_reserve_would_go_negative_on_manual_revision
        claim_type: error_triggerable
        grounds: [errors.ERR_RESERVE_WOULD_GO_NEGATIVE, validations.priority_41]
        distinguishing_aspect: "A manual REVISION entry of -2500.00 against a claim whose case_reserve is 2000.00 returns HTTP 422 ERR_RESERVE_WOULD_GO_NEGATIVE and appends nothing, even though the supplied expected_claim_version is current."
        test_recipe:
          setup: ["DECLARED FL event; one TRIAGED FAST_TRACK claim whose only ReserveEntry is the INITIAL_CASE of 2000.00, so case_reserve == 2000.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm-001"
