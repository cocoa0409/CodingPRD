            - "GET /vendor-access/case-rep-authorizations/${auth_15160_id}/check-ins returns total_count == 0"
            - "VendorRep.${rep_bea_id}.access_status == CREDENTIALED and credential_posture == COMPLIANT — no state violation was in play"

      - name: release_under_a_fee_hold_returns_402
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VENDOR_FEE_HOLD]
          - validations.priority_39
          - global_constants.FEE_HOLD_THRESHOLD_CENTS
        distinguishing_aspect: "The fiscal gate is vendor-wide, not per set: a perfectly on-time set is blocked from release with 402 because a sibling set on another case pushed Vendor.late_fee_balance_cents to 105000, over the 100000 threshold."
        test_recipe:
          setup:
            - "Facility FH-62 has spd_turnaround_hours 4 and spd_bay_count 2; vendor FHOLV owns one ACTIVE non-implant product."
            - "Set A on case CASE-15170 (start 2026-11-02T08:00:00Z, 12 trays IMPLANT_SPECIALTY, lead 1 + 10 + 4 = 15 h, deadline 2026-11-01T17:00:00Z) is delivered at 2026-11-03T02:20:00Z: 2000 late minutes, per_tray round_half_up(2000 * 2.5 * 1.75) = 8750, fee 105000."
            - "Set B on case CASE-15171 (start 2026-11-05T08:00:00Z, 2 trays SIMPLE, deadline 2026-11-05T02:00:00Z) is delivered at 2026-11-05T01:00:00Z and is DELIVERED_ON_TIME with no fee."
          setup_api_calls:
