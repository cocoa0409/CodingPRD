              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordic Trade Bank", swift_bic: "NRTBSESS", country_code: "SE", country_risk_score: 15, credit_rating: "AA", confirmation_appetite_cents: 100000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Gulf Steel Exports LLC", country_code: "SG", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Singapore", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Stockholm", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { credit_id: $.data.id }
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/submit-for-approval"
              payload: { submission_note: "half-cent fee case" }
