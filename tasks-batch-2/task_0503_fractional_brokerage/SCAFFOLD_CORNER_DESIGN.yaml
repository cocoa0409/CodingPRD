              captures: { div_pay: $.data.id }
            - call: "POST /dividends/${div_pay}/pay"
              as: ClearingSystem
          trigger:
            - call: "POST /dividends/${div_pay}/pay"
              as: ClearingSystem
              captures: { err_pay: $.data.error_id }
          assert:
            - "Response status 409 and data.error_id == ERR_DIVIDEND_NOT_PAYABLE"

