            - "EntitlementAuthorization.${ent_id}.status == DRAFT at the moment of refusal and charged_billable_weight_lbs == 0"
            - "GET /hhg/entitlements/${ent_id}/shipments returns an empty list immediately after the refusal"
            - "after authorize: EntitlementAuthorization.${ent_id}.status == AUTHORIZED and total_billable_cap_lbs == 11000"
