      - name: restricted_vault_posture_blocks_coin_release
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=47]
          - errors[ERR_VAULT_RESTRICTED]
          - state_machines.Vault.OPEN_to_RESTRICTED
        distinguishing_aspect: "RESTRICTED is distinct from FROZEN: counting is unaffected but physical coin release is refused with ERR_VAULT_RESTRICTED at 409, and inventory boxes do not move."
        test_recipe:
          setup:
            - "Vault CV-C41 with QUARTER inventory on_hand_boxes 5; CustomerAccount ACC-C41 ACTIVE."
            - "A CoinOrder for 2 QUARTER boxes approved to APPROVED_FULL by u-mgr-1, then the vault posture moved OPEN -> RESTRICTED and the vault version re-read."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C41", name: "Restricted Posture Vault" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C41", customer_name: "Restricted Retail", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/vaults/${v_id}/inventory-adjustments"
              payload: { denomination: "QUARTER", delta_boxes: 5 }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "POST /cash-vault/coin-orders"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", pickup_window_start: "2026-08-05T10:00:00Z", pickup_window_end: "2026-08-05T12:00:00Z", lines: [ { denomination: "QUARTER", boxes_requested: 2 } ] }
              as: CustomerAccountHolder
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
            - call: "POST /cash-vault/coin-orders/${o_id}/approve"
              payload: { allow_partial: false }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { o_status: $.data.status }
            - call: "POST /cash-vault/vaults/${v_id}/posture"
              payload: { posture: "RESTRICTED" }
              as: VaultManager
              as_user_id: "u-mgr-1"
            - call: "GET /cash-vault/vaults/${v_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { v_ver: $.data.version, v_posture: $.data.posture }
          trigger:
            - call: "POST /cash-vault/coin-orders/${o_id}/release"
              payload: { expected_vault_version: "${v_ver}" }
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { err: $.data.error_id }
          assert:
            - "${o_status} == APPROVED_FULL"
            - "${v_posture} == RESTRICTED"
            - "${err} == ERR_VAULT_RESTRICTED"
            - "HTTP status of the trigger response == 409"
            - "CoinOrder.${o_id}.status == APPROVED_FULL"
            - "VaultInventory for (${v_id}, QUARTER).on_hand_boxes == 5"
            - "VaultInventory for (${v_id}, QUARTER).reserved_boxes == 2"
            - "CustomerAccount.${a_id}.ledger_balance_cents == 0"

