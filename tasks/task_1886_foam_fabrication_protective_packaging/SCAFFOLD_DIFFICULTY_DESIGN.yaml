  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_spec_not_approved_beats_machine_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_SPEC_NOT_APPROVED]
          - errors[ERR_MACHINE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Category pair = state vs business_temporal. Confirm of an order whose
          spec is only VALIDATED (state failure) with a machine window that also
          overlaps another confirmed order (temporal failure) must return
          ERR_SPEC_NOT_APPROVED (priority 7), not ERR_MACHINE_WINDOW_CONFLICT
          (priority 10).
        test_recipe:
          setup:
            - "Spec A VALIDATED (NOT approved) with LOCKED DIE program PA and QUOTED order OA"
            - "Spec B APPROVED with LOCKED DIE program PB and order OB CONFIRMED on machine CNC-1 window 2026-08-05T08:00-09:00"
