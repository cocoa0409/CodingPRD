# =============================================================================
# task_2152 — §1.9 Scaffold Corner Design (breadth coverage index)
# Walks references/claim-extraction-guide.md section by section against
# SCAFFOLD.yaml §1.1–§1.7. Instances already probed by §1.8 are emitted as
# excluded_because stubs.
# Shared fixture literals are identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   Institution "First Meridian Bank" lei 5493001KJTIIGC8Y1R12, activity_year
#   2026, prior_year_closed_end_originations 700 (NOT partial-exempt).
#   Logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: institution_creation_returns_computed_filing_profile
        claim_type: Creation
        grounds:
          - entities.Institution
          - calculations.filing_profile_resolution
          - endpoints[POST /hmda/institutions]
        distinguishing_aspect: "POST /hmda/institutions with the six declared inputs returns 201 and a body carrying partial_exemption_eligible false, quarterly_filer false, required_field_count 48, filing_deadline_at 2027-03-01T23:59:59.000Z, filing_posture OPEN and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id, inst_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Institution.${inst_id}.partial_exemption_eligible == false"
            - "Institution.${inst_id}.quarterly_filer == false"
            - "Institution.${inst_id}.required_field_count == 48"
            - "Institution.${inst_id}.filing_deadline_at == 2027-03-01T23:59:59.000Z"
            - "Institution.${inst_id}.filing_posture == OPEN"
            - "Institution.${inst_id}.version == 1"
            - "Institution.${inst_id}.total_application_count == 0"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: institution_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Institution
          - endpoints[GET /hmda/institutions/{id}]
        distinguishing_aspect: "GET /hmda/institutions/{id} returns the same id, lei and derived counters that the create response carried."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: Examiner
          assert:
            - "HTTP status == 200"
            - "response.data.id == ${inst_id}"
            - "response.data.lei == 5493001KJTIIGC8Y1R12"
            - "response.data.activity_year == 2026"

      - name: application_listing_is_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /hmda/institutions/{id}/applications]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three Applications on one Institution, GET /hmda/institutions/{id}/applications?limit=2&offset=0 returns 2 rows, total_count 3 and has_more true; offset=2 returns 1 row and has_more false."
        test_recipe:
          setup: ["One Institution with three Applications at INTAKE."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000201", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000202", application_date: "2026-02-11T00:00:00Z", application_channel: "MAIL", loan_type: "FHA", loan_purpose: "REFINANCING", occupancy_type: "SECOND", lien_status: "FIRST_LIEN", loan_amount_cents: 22000000 }
              as: LoanOfficer
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000203", application_date: "2026-02-12T00:00:00Z", application_channel: "INTERNET", loan_type: "VA", loan_purpose: "HOME_IMPROVEMENT", occupancy_type: "INVESTMENT", lien_status: "SUBORDINATE_LIEN", loan_amount_cents: 9000000 }
              as: LoanOfficer
          trigger:
            - call: "GET /hmda/institutions/${inst_id}/applications"
              payload: { limit: 2, offset: 0 }
              as: ComplianceAnalyst
          assert:
            - "HTTP status == 200"
            - "response.data has length 2"
            - "response.total_count == 3"
            - "response.has_more == true"
            - "a follow-up call with limit=2&offset=2 returns 1 row and has_more == false"

      - name: application_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_APPLICATION_NOT_FOUND]
          - validations[priority=40]
          - endpoints[GET /hmda/applications/{id}]
        distinguishing_aspect: "GET /hmda/applications/{id} with a syntactically valid but unknown UUID returns 404 ERR_APPLICATION_NOT_FOUND, not 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /hmda/applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_APPLICATION_NOT_FOUND"

      - name: application_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=50]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /hmda/applications]
        distinguishing_aspect: "Omitting lien_status, a required §1.5 input with no default, returns 400 ERR_INVALID_REQUEST and writes no Application row."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000211", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "Institution.${inst_id}.total_application_count == 0"

      - name: application_defaults_applied_when_optional_flags_omitted
        claim_type: Defaults
        grounds:
          - entities.Application.fields.business_or_commercial_purpose
          - entities.Application.fields.open_end_line_of_credit
          - entities.Application.fields.denial_reason_codes
        distinguishing_aspect: "Omitting business_or_commercial_purpose and open_end_line_of_credit stores false for both and an empty denial_reason_codes array, and lar_status is PENDING_FIELDS with exclusion_reason NOT_EXCLUDED."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000221", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.business_or_commercial_purpose == false"
            - "Application.${app_id}.open_end_line_of_credit == false"
            - "Application.${app_id}.denial_reason_codes == []"
            - "Application.${app_id}.lar_status == PENDING_FIELDS"
            - "Application.${app_id}.exclusion_reason == NOT_EXCLUDED"
            - "Application.${app_id}.stage == INTAKE"

      - name: application_computed_field_counts_reflect_applicable_set
        claim_type: Computed Fields
        grounds:
          - calculations.application_completeness
          - entities.Application.fields.captured_field_count
          - entities.Application.fields.applicable_field_count
        distinguishing_aspect: "For a non partial-exempt Institution and an Application with no action taken yet, applicable_field_count is 11 (10 core plus income_thousands) and captured_field_count is 9 because action_taken and action_taken_date are still null while income_thousands was supplied."
        test_recipe:
          setup: ["One non partial-exempt Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000231", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, income_thousands: 120 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.applicable_field_count == 11"
            - "Application.${app_id}.captured_field_count == 9"
            - "Application.${app_id}.lar_status == PENDING_FIELDS"

      - name: application_create_with_extra_field_rejected
        claim_type: System Fields
        grounds:
          - validations[priority=50]
          - entities.Application.fields.stage
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Supplying the system-owned field `stage` in the create body is not a declared §1.5 input and returns 400 ERR_INVALID_REQUEST rather than pre-seeding the state machine."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000241", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000, stage: "REGISTER_LOCKED" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: census_tract_is_immutable_and_has_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.CensusTract
          - endpoints[POST /hmda/census-tracts]
          - endpoints[GET /hmda/census-tracts/{id}]
        distinguishing_aspect: "CensusTract declares common_fields false, so §1.5 exposes only a create and two reads; the create response carries id and created_at and the entity is never mutated."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /hmda/census-tracts"
              payload: { tract_code: "06075010100", county_fips: "06075", state_code: "CA", msa_md_code: "41860", minority_population_pct: 42.5, tract_to_msa_income_pct: 88.4, owner_occupied_units: 1200, median_family_income_cents: 9500000 }
              as: SystemAdmin
              captures: { tract_id: $.data.id, tract_created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "CensusTract.${tract_id}.tract_code == 06075010100"
            - "CensusTract.${tract_id}.owner_occupied_units == 1200"
            - "no PATCH or DELETE endpoint for /hmda/census-tracts/{id} exists in §1.5"
            - "GET /hmda/census-tracts/${tract_id}/geocode-assignments returns 0 rows"

      - name: demographic_entry_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=50]
          - entities.DemographicEntry.fields.sex_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "sex_code UNKNOWN is outside the declared enum {MALE, FEMALE, BOTH, INFO_NOT_PROVIDED, NOT_APPLICABLE} and returns 400 ERR_INVALID_REQUEST before any demographic collection rule is evaluated."
        test_recipe:
          setup: ["One Institution and one MAIL Application at INTAKE."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000251", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "UNKNOWN" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: application_with_unknown_institution_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=60]
          - errors[ERR_INSTITUTION_NOT_FOUND]
          - entities.Application.fields.institution_id
        distinguishing_aspect: "A body foreign key that resolves to nothing returns 404 ERR_INSTITUTION_NOT_FOUND at priority 60, after body shape validation has already passed."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /hmda/applications"
              payload: { institution_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", uli: "10BX939C5543TQA1B00000261", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_INSTITUTION_NOT_FOUND"

      - name: flat_topology_geocode_for_unknown_application_returns_not_found
        claim_type: Creation
        grounds:
          - validations[priority=60]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - entities.GeocodeAssignment.fields.application_id
        distinguishing_aspect: "The flat topology carries every parent link in the body, so POST /hmda/geocode-assignments with an unknown application_id returns 404 ERR_APPLICATION_NOT_FOUND rather than a path-level 404."
        test_recipe:
          setup:
            - "One Institution and one real Application, so the OCC version input can be bound from a server response while the trigger still names a non-existent application_id."
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000271", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { real_app_id: $.data.id, real_app_v: $.data.version }
          trigger:
            - call: "POST /hmda/geocode-assignments"
              payload: { application_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", expected_application_version: "${real_app_v}", street_address: "1 Market St", city: "San Francisco", state_code: "CA", zip_code: "94105", county_fips: "06075" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_APPLICATION_NOT_FOUND"
            - "the existence check at priority 60 runs before the OCC check at priority 70"

  - section: state_machines
    instances:
      - name: application_starts_at_intake_and_pending_fields
        claim_type: Initial State
        grounds:
          - state_machines.Application.stage
          - state_machines.Application.lar_status
        distinguishing_aspect: "A freshly created Application carries stage INTAKE on one dimension and lar_status PENDING_FIELDS on the other, and Institution.pending_record_count becomes 1."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000301", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.stage == INTAKE"
            - "Application.${app_id}.lar_status == PENDING_FIELDS"
            - "Institution.${inst_id}.pending_record_count == 1"
            - "Institution.${inst_id}.total_application_count == 1"
            - "Institution.${inst_id}.open_register_count == 1"

      - name: advance_from_intake_straight_to_decisioned_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.stage.INTAKE_to_UNDERWRITING
          - validations[priority=80]
          - errors[ERR_INVALID_STAGE_TRANSITION]
        distinguishing_aspect: "INTAKE -> DECISIONED is not a declared transition, so the advance returns 409 ERR_INVALID_STAGE_TRANSITION and stage stays INTAKE."
        test_recipe:
          setup: ["One Institution and one Application at INTAKE with an APPLICANT DemographicEntry already recorded, so the demographic guard is not the reason for the rejection."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000311", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["NOT_HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "MALE" }
              as: LoanOfficer
          trigger:
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "DECISIONED" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STAGE_TRANSITION"
            - "Application.${app_id}.stage == INTAKE"

      - name: advance_to_underwriting_without_applicant_demographics_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.stage.INTAKE_to_UNDERWRITING
          - validations[priority=85]
          - errors[ERR_MISSING_APPLICANT_DEMOGRAPHICS]
        distinguishing_aspect: "With zero DemographicEntry rows the INTAKE -> UNDERWRITING advance returns 409 ERR_MISSING_APPLICANT_DEMOGRAPHICS; a CO_APPLICANT-only entry does not satisfy the guard either."
        test_recipe:
          setup: ["One Institution and one Application at INTAKE carrying only a CO_APPLICANT demographic row."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /hmda/applications"
              payload: { institution_id: "${inst_id}", uli: "10BX939C5543TQA1B00000321", application_date: "2026-02-10T00:00:00Z", application_channel: "MAIL", loan_type: "CONVENTIONAL", loan_purpose: "HOME_PURCHASE", occupancy_type: "PRINCIPAL", lien_status: "FIRST_LIEN", loan_amount_cents: 35000000 }
              as: LoanOfficer
              captures: { app_id: $.data.id }
            - call: "POST /hmda/demographic-entries"
              payload: { application_id: "${app_id}", applicant_role: "CO_APPLICANT", collection_method: "PROVIDED_BY_APPLICANT", ethnicity_codes: ["HISPANIC_OR_LATINO"], race_codes: ["WHITE"], sex_code: "FEMALE" }
              as: LoanOfficer
          trigger:
            - call: "POST /hmda/applications/${app_id}/advance"
              payload: { to_stage: "UNDERWRITING" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
