            - "MeasurementBatch.${batch_id}.coverage_rate is still 0.8 and scoring_status is still SCORED: the compensation touched only the IVT terms"

      - name: claim_reversal_unwinds_both_credit_ledgers_symmetrically
        grounds:
          - state_machines.RefundClaim.APPROVED_to_REVERSED
          - state_machines.MeasurementBatch.CREDITED_to_UNBILLED
          - entities.Advertiser.fields.credit_received_cents_total
          - entities.Publisher.fields.credit_issued_cents_total
          - calculations.claim_net_credit_cents
        distinguishing_aspect: |
          A different conserved quantity: INVARIANT_CREDIT_DOUBLE_ENTRY, the
          equality of Advertiser.credit_received_cents_total and
          Publisher.credit_issued_cents_total. Approval moves both legs to 4760
          and the reversal must move BOTH back to 0 - an implementation that
          unwinds only the advertiser leg leaves a 4760-cent asymmetry that no
          single-sided assertion would catch. The reversal is also deliberately
          NOT a full rollback: the frozen money triple (6400 / 5600 / 840 /
          4760) is retained as the audit record while the cited batch returns
          from CREDITED to UNBILLED and becomes citable again, and
          Campaign.open_claim_count stays at 0 because it was already
          decremented at approval.
        test_recipe:
          setup:
            - "Advertiser credit_cap_cents 1000000, both ledgers at 0, settled_claim_count 0."
            - "Campaign cpm_cents 875; one QUARANTINED batch (measured 10000, measurable 6000, in_view 5000, avg_in_view_seconds 0.8) with one CONFIRMED DATACENTER finding of 400 -> credited_impressions 6400 at approval."
