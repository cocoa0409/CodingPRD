      - name: release_revision_cycle_rejected_after_three_rounds
        claim_type: cyclic_shape
        grounds:
          - state_machines.SubjectRelease.transitions.SENT_to_REVISION_REQUESTED
          - state_machines.SubjectRelease.transitions.REVISION_REQUESTED_to_SENT
          - validations[priority=35]
          - errors.ERR_RELEASE_REVISION_LIMIT
          - entities.SubjectRelease.fields.revision_round_count
        distinguishing_aspect: "The SENT <-> REVISION_REQUESTED loop is bounded at three: the third request succeeds with revision_round_count 3 and the fourth is refused, so the cycle terminates on a counter rather than on a state and the release remains usable (still SENT) afterwards."
        test_recipe:
          setup: ["A production in CLEARANCE with one SENT SubjectRelease that has already been through three revision cycles (revision_round_count 3) and is back in SENT."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Three Revisions", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/subject-releases"
              payload: { subject_person_key: "walsh-eileen", release_type: "DEPICTION", depiction_from_date: "2026-03-01", depiction_to_date: "2026-03-31", approval_rights: "ROUGH_CUT" }
              as: ProductionAdmin
              captures: { rel_id: $.data.id }
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "REVISION_REQUESTED", reason: "Cycle 1" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "REVISION_REQUESTED", reason: "Cycle 2" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "REVISION_REQUESTED", reason: "Cycle 3" }
              as: ProductionAdmin
              captures: { rr3: $.data.revision_round_count }
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SENT" }
              as: ProductionAdmin
          trigger:
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "REVISION_REQUESTED", reason: "Cycle 4" }
              as: ProductionAdmin
            - call: "POST /subject-releases/${rel_id}/state"
              payload: { to_status: "SIGNED" }
              as: ClearanceSupervisor
          assert:
            - "revision_round_count was 1, 2 then 3 after the three accepted REVISION_REQUESTED calls"
            - "the fourth REVISION_REQUESTED returns 409 with error_id ERR_RELEASE_REVISION_LIMIT"
            - "SubjectRelease.${rel_id}.revision_round_count is still 3 after the rejection"
            - "the follow-up SIGNED call returns 200 — hitting the revision ceiling does not poison the release, it only closes the loop"
            - "SubjectRelease.${rel_id}.status == SIGNED"

      - name: fair_use_accept_without_an_issued_opinion_letter_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.FairUseAnalysis.transitions.SUBMITTED_to_ACCEPTED
          - validations[priority=22]
          - errors.ERR_NO_ISSUED_OPINION_LETTER
