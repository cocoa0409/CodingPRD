            - { call: "GET /credit/appraisers/${apr}/appraisals", as: CreditAnalyst, as_user_id: "${an}" }
            - { call: "GET /credit/loan-applications/${app}/policy-exceptions", as: CreditAnalyst, as_user_id: "${an}" }
