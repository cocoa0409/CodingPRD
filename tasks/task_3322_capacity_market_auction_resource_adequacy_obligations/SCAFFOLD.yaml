scenario: 'Capacity Market Auction & Resource Adequacy Obligations (PJM Interconnection): forecast of peak load and reserve
  requirements determining the capacity to procure for a future delivery year, resource qualification with accreditation reflecting
  expected availability during scarcity conditions, auction clearing with locational deliverability constraints producing
  zonal prices, capacity commitments obligating resources to be available with performance assessment during emergency events,
  non-performance charges and bonus payments redistributed among resources, demand response and energy efficiency participation
  with measurement requirements, replacement capacity transactions when a committed resource cannot perform, market seller
  offer caps and market power mitigation review

  '
domain_name: capacity-market-auction
api_prefix: /capacity-market
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
  - dual_variant_calculation
  - cascading_side_effects
  - rate_threshold_triggers
  - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  - polymorphic
  role_model: peer_roles
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: DeliveryYear
  parent: null
  common_fields: true
  fields:
  - name: delivery_year_label
    type: string
    source: input
    description: Human label, e.g. '2029/2030'. Unique across all DeliveryYear rows.
  - name: planning_period_start
    type: datetime
    source: input
    description: ISO8601 UTC start of the delivery year (June 1 00:00 of year Y).
  - name: planning_period_end
    type: datetime
    source: input
    description: ISO8601 UTC end of the delivery year (May 31 23:59:59 of year Y+1). Must be after planning_period_start.
  - name: status
    type: enum
    source: system
    description: Posture of the delivery year. DRAFT, FORECAST_LOCKED, AUCTION_OPEN, CLEARED, SETTLED, CLOSED.
    default: DRAFT
    constraints: enum {DRAFT, FORECAST_LOCKED, AUCTION_OPEN, CLEARED, SETTLED, CLOSED}
  - name: reliability_requirement_mw
    type: number
    source: computed
    description: Unforced capacity requirement = ceil over zones of the zonal requirement roll-up; computed by calc peak_load_requirement
      at FORECAST_LOCKED.
    default: 0
  - name: forecast_version
    type: integer
    source: system
    description: Monotonic counter of the locked LoadForecast revision used for clearing. Starts at 0; set to the locked LoadForecast.revision
      at FORECAST_LOCKED.
    default: 0
- name: Zone
  parent: DeliveryYear
  common_fields: true
  fields:
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; owning delivery year.
  - name: zone_code
    type: string
    source: input
    description: Short code, e.g. 'RTO', 'EMAAC'. Unique within (delivery_year_id).
  - name: parent_zone_id
    type: string
    source: input
    description: FK -> Zone.id; optional nesting for locational deliverability areas (LDA inside RTO). null for the RTO-wide
      zone.
    constraints: nullable; must reference a Zone in the same delivery_year_id
  - name: import_limit_mw
    type: number
    source: input
    description: Capacity import limit (CETL) into this zone from its parent in MW. null for the RTO-wide zone (unconstrained
      root).
    constraints: nullable; > 0 when present
  - name: zonal_requirement_mw
    type: number
    source: computed
    description: Zone's share of the reliability requirement, computed by calc peak_load_requirement from LoadForecast zonal
      peak shares. 0 until FORECAST_LOCKED.
    default: 0
  - name: clearing_price_per_mw_day
    type: number
    source: computed
    description: Zonal resource clearing price ($/MW-day) written by calc auction_clearing when the AuctionRun reaches CLEARED.
      null before clearing.
    constraints: nullable
  - name: cleared_mw
    type: number
    source: computed
    description: Total UCAP MW cleared inside this zone (including child-zone MW counted toward child requirement) at clearing.
      0 before clearing.
    default: 0
- name: LoadForecast
  parent: DeliveryYear
  common_fields: true
  fields:
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; owning delivery year.
  - name: revision
    type: integer
    source: system
    description: Server-assigned monotonically increasing revision per delivery_year_id, starting at 1. Higher revision supersedes
      lower.
  - name: rto_peak_load_mw
    type: number
    source: input
    description: Coincident RTO summer peak forecast in MW (weather-normalized 50/50).
  - name: reserve_margin_pct
    type: number
    source: input
    description: Installed reserve margin as a fraction (e.g. 0.161 for 16.1%). Must satisfy 0 < reserve_margin_pct < 1.
  - name: pool_wide_avg_eford
    type: number
    source: input
    description: Pool-wide average equivalent forced outage rate on demand, fraction in [0,1). Used by calc peak_load_requirement.
  - name: zonal_peak_shares
    type: object
    source: input
    description: Map of zone_code -> fraction of RTO peak (sum across non-nested top-level zones must equal 1.000 exactly
      after rounding to 3 decimals, round_half_up).
  - name: status
    type: enum
    source: system
    description: DRAFT until locked into the delivery year; SUPERSEDED when a later revision locks; LOCKED when adopted as
      forecast_version.
    default: DRAFT
    constraints: enum {DRAFT, LOCKED, SUPERSEDED}
- name: ResourceOwnerEntity
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Registered market participant legal name. Unique.
  - name: contact_email
    type: string
    source: input
    description: Primary contact email. Must contain '@'.
  - name: credit_score
    type: integer
    source: input
    description: Internal credit score 0-1000 used by the offer-floor mitigation band.
    constraints: 0 <= credit_score <= 1000
  - name: status
    type: enum
    source: system
    description: ACTIVE, SUSPENDED. SUSPENDED owners cannot submit offers or replacements.
    default: ACTIVE
    constraints: enum {ACTIVE, SUSPENDED}
- name: CapacityResource
  parent: ResourceOwnerEntity
  common_fields: true
  fields:
  - name: owner_id
    type: string
    source: input
    description: FK -> ResourceOwnerEntity.id; owning market participant.
  - name: zone_id
    type: string
    source: input
    description: FK -> Zone.id; interconnection zone for deliverability.
  - name: resource_type
    type: enum
    source: input
    description: GEN (thermal/hydro/nuclear generation), DR (demand response), EE (energy efficiency).
    constraints: enum {GEN, DR, EE}
  - name: nameplate_mw
    type: number
    source: input
    description: Installed capability (ICAP) in MW. Must be > 0.
  - name: status
    type: enum
    source: system
    description: REGISTERED, ACCREDITED, RETIRED. Only ACCREDITED resources may offer.
    default: REGISTERED
    constraints: enum {REGISTERED, ACCREDITED, RETIRED}
  - name: accredited_ucap_mw
    type: number
    source: computed
    description: Unforced capacity in MW from the effective Accreditation (calc accreditation_ucap). 0 until accredited.
    default: 0
  - name: must_offer
    type: boolean
    source: computed
    description: True for GEN resources with an existing commitment in the immediately prior delivery year (capacity must-offer
      obligation). False otherwise.
    default: false
- name: Accreditation
  parent: CapacityResource
  common_fields: true
  fields:
  - name: resource_id
    type: string
    source: input
    description: FK -> CapacityResource.id; subject resource.
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; delivery year this accreditation applies to.
  - name: method
    type: enum
    source: input
    description: CLASS_AVG (class-average ELCC) or UNIT_SPECIFIC (unit-specific marginal ELCC). Drives the dual-variant calc
      accreditation_ucap.
    constraints: enum {CLASS_AVG, UNIT_SPECIFIC}
  - name: class_avg_factor
    type: number
    source: input
    description: Class-average ELCC factor in (0,1]. Required when method=CLASS_AVG; ignored otherwise.
    constraints: nullable; 0 < class_avg_factor <= 1 when present
  - name: unit_elcc_factor
    type: number
    source: input
    description: Unit-specific marginal ELCC factor in (0,1]. Required when method=UNIT_SPECIFIC; ignored otherwise.
    constraints: nullable; 0 < unit_elcc_factor <= 1 when present
  - name: forced_outage_rate
    type: number
    source: input
    description: Unit's own EFORd in [0,1); used only by the UNIT_SPECIFIC variant to scale the marginal ELCC.
  - name: scarcity_hours_sampled
    type: integer
    source: input
    description: Number of scarcity hours in the ELCC sample window. Must be >= 1.
  - name: accreditation_factor
    type: number
    source: computed
    description: Effective accreditation factor from calc accreditation_ucap; rounded to 4 decimals round_half_up.
  - name: ucap_mw
    type: number
    source: computed
    description: nameplate_mw * accreditation_factor, rounded to 3 decimals round_half_up.
  - name: status
    type: enum
    source: system
    description: PENDING_REVIEW, EFFECTIVE, REJECTED. Only EFFECTIVE feeds CapacityResource.accredited_ucap_mw.
    default: PENDING_REVIEW
    constraints: enum {PENDING_REVIEW, EFFECTIVE, REJECTED}
- name: AuctionOffer
  parent: CapacityResource
  common_fields: true
  fields:
  - name: resource_id
    type: string
    source: input
    description: FK -> CapacityResource.id; offering resource.
  - name: auction_run_id
    type: string
    source: input
    description: FK -> AuctionRun.id; the auction run this offer is submitted into.
  - name: offer_mw
    type: number
    source: input
    description: UCAP MW offered. Must be > 0 and <= resource's accredited_ucap_mw at seal time.
  - name: offer_price_per_mw_day
    type: number
    source: input
    description: Offer floor price in $/MW-day, 2 decimals. Must be >= 0.
  - name: mitigated_cap_per_mw_day
    type: number
    source: computed
    description: Seller-specific offer cap from calc seller_offer_cap. Offers above the cap are repriced down to the cap when
      mitigation_status=MITIGATED.
  - name: mitigation_status
    type: enum
    source: system
    description: UNREVIEWED, PASSED, MITIGATED, EXEMPT. Set by MitigationReview resolution; EXEMPT when the resource passes
      the market-power screen automatically.
    default: UNREVIEWED
    constraints: enum {UNREVIEWED, PASSED, MITIGATED, EXEMPT}
  - name: effective_price_per_mw_day
    type: number
    source: computed
    description: min(offer_price_per_mw_day, mitigated_cap_per_mw_day) when MITIGATED; else offer_price_per_mw_day. The price
      used by calc auction_clearing.
  - name: cleared_mw
    type: number
    source: computed
    description: MW cleared from this offer by calc auction_clearing. 0 before clearing.
    default: 0
  - name: status
    type: enum
    source: system
    description: SUBMITTED, SEALED, CLEARED, PARTIALLY_CLEARED, REJECTED, WITHDRAWN.
    default: SUBMITTED
    constraints: enum {SUBMITTED, SEALED, CLEARED, PARTIALLY_CLEARED, REJECTED, WITHDRAWN}
- name: MitigationReview
  parent: AuctionOffer
  common_fields: true
  fields:
  - name: offer_id
    type: string
    source: input
    description: FK -> AuctionOffer.id; offer under review (1:1 — at most one open review per offer).
  - name: reviewer_note
    type: string
    source: input
    description: Free-text rationale recorded by the market monitor.
    constraints: nullable
  - name: pivotal_supplier_flag
    type: boolean
    source: input
    description: True when the owner fails the three-pivotal-supplier screen for the offer's LDA.
  - name: outcome
    type: enum
    source: system
    description: PENDING, PASS (offer usable as submitted), MITIGATE (offer repriced to cap), EXEMPT (no mitigation warranted).
    default: PENDING
    constraints: enum {PENDING, PASS, MITIGATE, EXEMPT}
  - name: resolved_at
    type: datetime
    source: system
    description: Set when outcome leaves PENDING. null while PENDING.
    constraints: nullable
- name: AuctionRun
  parent: DeliveryYear
  common_fields: true
  fields:
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; delivery year being cleared.
  - name: run_label
    type: string
    source: input
    description: e.g. 'BRA' (base residual auction) or 'IRA-1'. Unique within (delivery_year_id).
  - name: status
    type: enum
    source: system
    description: DRAFT, OPEN (accepting offers), SEALED (offer window closed, mitigation in flight), CLEARED (prices published),
      SETTLED (commitments confirmed).
    default: DRAFT
    constraints: enum {DRAFT, OPEN, SEALED, CLEARED, SETTLED}
  - name: sealed_at
    type: datetime
    source: system
    description: Timestamp of the OPEN->SEALED transition. null before.
    constraints: nullable
  - name: cleared_at
    type: datetime
    source: system
    description: Timestamp of the SEALED->CLEARED transition. null before.
    constraints: nullable
- name: CapacityCommitment
  parent: CapacityResource
  common_fields: true
  fields:
  - name: resource_id
    type: string
    source: input
    description: FK -> CapacityResource.id; committed resource.
  - name: offer_id
    type: string
    source: input
    description: FK -> AuctionOffer.id; the cleared offer this commitment was created from.
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; delivery year of obligation.
  - name: committed_mw
    type: number
    source: system
    description: UCAP MW of obligation, copied from the offer's cleared_mw at creation; reduced by approved ReplacementTransaction
      releases.
  - name: clearing_price_per_mw_day
    type: number
    source: system
    description: Zonal clearing price locked from Zone.clearing_price_per_mw_day at creation (the resource's zone).
  - name: daily_revenue_dollars
    type: number
    source: computed
    description: committed_mw * clearing_price_per_mw_day, rounded to 2 decimals round_half_up. Recomputed whenever committed_mw
      changes.
  - name: status
    type: enum
    source: system
    description: ACTIVE, REPLACEMENT_PENDING (a replacement offer is under review), SETTLED (delivery year ended and performance
      settled), DEFAULTED (failed to perform / terminated for cause).
    default: ACTIVE
    constraints: enum {ACTIVE, REPLACEMENT_PENDING, SETTLED, DEFAULTED}
  - name: cumulative_performance_score
    type: number
    source: computed
    description: Rolling weighted average of PerformanceAssessment.performance_ratio across assessments of this commitment,
      weighted by assessed MW-hours; 0 before first assessment. 4 decimals round_half_up.
    default: 0
- name: ReplacementTransaction
  parent: CapacityCommitment
  common_fields: true
  fields:
  - name: commitment_id
    type: string
    source: input
    description: FK -> CapacityCommitment.id; the selling (original) commitment being replaced.
  - name: replacement_resource_id
    type: string
    source: input
    description: FK -> CapacityResource.id; resource supplying replacement UCAP. Must be ACCREDITED, in a deliverable zone,
      owned by any ACTIVE owner (may be same or different owner), and not the commitment's own resource.
  - name: replacement_mw
    type: number
    source: input
    description: UCAP MW to release from the original commitment. Must be > 0 and <= commitment.committed_mw.
  - name: price_per_mw_day
    type: number
    source: input
    description: Bilateral price agreed between parties ($/MW-day, 2 decimals). Purely informational; does not change the
      original commitment's clearing price.
  - name: expected_commitment_version
    type: integer
    source: input
    description: 'OCC field: the CapacityCommitment.version the submitter last observed. Stale values rejected with ERR_STALE_VERSION.'
  - name: status
    type: enum
    source: system
    description: PENDING, APPROVED, REJECTED. Approval releases committed_mw from the original commitment and creates a new
      CapacityCommitment for the replacement resource.
    default: PENDING
    constraints: enum {PENDING, APPROVED, REJECTED}
- name: EmergencyEvent
  parent: DeliveryYear
  common_fields: true
  fields:
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; delivery year during which the emergency action occurred.
  - name: event_start
    type: datetime
    source: input
    description: ISO8601 UTC start of the performance assessment interval (PAI).
  - name: event_end
    type: datetime
    source: input
    description: ISO8601 UTC end of the PAI. Must be strictly after event_start, and both within the delivery year's planning
      period.
  - name: event_type
    type: enum
    source: input
    description: EMERGENCY_ACTION (triggers performance assessment for all commitments) or DR_TEST (assesses DR commitments
      only).
    constraints: enum {EMERGENCY_ACTION, DR_TEST}
  - name: status
    type: enum
    source: system
    description: DECLARED, ASSESSING (assessments being generated), ASSESSED (all assessments finalized), SETTLED (charges/bonuses
      posted).
    default: DECLARED
    constraints: enum {DECLARED, ASSESSING, ASSESSED, SETTLED}
- name: PerformanceAssessment
  parent: EmergencyEvent
  common_fields: false
  fields:
  - name: emergency_event_id
    type: string
    source: input
    description: FK -> EmergencyEvent.id; the PAI assessed.
  - name: commitment_id
    type: string
    source: input
    description: FK -> CapacityCommitment.id; obligation assessed.
  - name: expected_mw
    type: number
    source: input
    description: MW the resource was expected to deliver during the PAI (<= commitment.committed_mw at assessment time).
  - name: actual_mw
    type: number
    source: input
    description: Metered MW actually delivered during the PAI. Must be >= 0.
  - name: performance_ratio
    type: number
    source: computed
    description: min(actual_mw / expected_mw, 1.5) when expected_mw > 0, capped at 1.5 (over-performance bonus cap); 1.0 when
      expected_mw == 0. 4 decimals round_half_up. From calc performance_ratio_calc.
  - name: charge_or_credit_dollars
    type: number
    source: computed
    description: 'Signed settlement amount from calc nonperformance_charge: negative = non-performance charge owed, positive
      = bonus credit earned.'
  - name: assessed_mwh
    type: number
    source: computed
    description: expected_mw * event duration hours; weight used by CapacityCommitment.cumulative_performance_score.
  - name: status
    type: enum
    source: system
    description: DRAFT, FINALIZED. Only FINALIZED assessments post SettlementEntry rows and update the commitment score.
    default: DRAFT
    constraints: enum {DRAFT, FINALIZED}
- name: MeasurementReport
  parent: CapacityResource
  common_fields: true
  fields:
  - name: resource_id
    type: string
    source: input
    description: FK -> CapacityResource.id; DR or EE resource being measured. GEN resources may not submit.
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; delivery year measured.
  - name: reporting_period_start
    type: datetime
    source: input
    description: Start of measurement window (inclusive).
  - name: reporting_period_end
    type: datetime
    source: input
    description: End of measurement window (exclusive). Half-open interval; must be after start.
  - name: metered_mwh
    type: number
    source: input
    description: Metered reduction/delivered MWh over the window. Must be >= 0.
  - name: baseline_mwh
    type: number
    source: input
    description: Counterfactual baseline MWh from the approved baseline methodology. Must be > 0.
  - name: verified_ucap_mw
    type: number
    source: computed
    description: min(metered_mwh, baseline_mwh) / window_hours * accreditation factor at report time, 3 decimals round_half_up,
      from calc mv_verified_ucap. Compared against committed_mw for DR/EE under-delivery.
  - name: revision_of_id
    type: string
    source: input
    description: FK -> MeasurementReport.id; optional — a revision supersedes a prior REJECTED report for an overlapping window.
    constraints: nullable
  - name: status
    type: enum
    source: system
    description: SUBMITTED, UNDER_REVIEW, VERIFIED, REJECTED.
    default: SUBMITTED
    constraints: enum {SUBMITTED, UNDER_REVIEW, VERIFIED, REJECTED}
- name: SettlementEntry
  parent: DeliveryYear
  common_fields: false
  fields:
  - name: delivery_year_id
    type: string
    source: input
    description: FK -> DeliveryYear.id; settlement context.
  - name: commitment_id
    type: string
    source: input
    description: FK -> CapacityCommitment.id; commitment charged or credited.
  - name: emergency_event_id
    type: string
    source: input
    description: FK -> EmergencyEvent.id; PAI that generated this entry. null for daily capacity revenue accrual entries.
    constraints: nullable
  - name: entry_type
    type: enum
    source: system
    description: CHARGE (non-performance charge), BONUS (over-performance credit), REDISTRIBUTION (share of net charges redistributed
      to performers).
    constraints: enum {CHARGE, BONUS, REDISTRIBUTION}
  - name: amount_dollars
    type: number
    source: system
    description: Signed dollar amount, 2 decimals round_half_up. Negative = owed to the pool; positive = paid to the resource
      owner.
state_machines:
- entity: DeliveryYear
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  transitions:
  - from: DRAFT
    to: FORECAST_LOCKED
    trigger: POST /capacity-market/delivery-years/{id}/lock-forecast
    actor: MarketAdmin
    preconditions:
    - DeliveryYear.status == DRAFT
    - Exactly one LoadForecast for this delivery year exists and is in DRAFT (the highest revision)
    - At least one Zone exists for the delivery year and the RTO-wide zone (parent_zone_id null) exists
    side_effects:
    - 'Run calc peak_load_requirement: write Zone.zonal_requirement_mw for every zone and DeliveryYear.reliability_requirement_mw'
    - Set DeliveryYear.forecast_version = LoadForecast.revision; LoadForecast.status DRAFT -> LOCKED; any older LOCKED LoadForecast
      for the same delivery year -> SUPERSEDED
    note: Re-locking with a newer forecast revision requires reverting to DRAFT, which is impossible once AUCTION_OPEN — see
      the DRAFT-only precondition.
  - from: FORECAST_LOCKED
    to: AUCTION_OPEN
    trigger: POST /capacity-market/auction-runs (creation of an AuctionRun in OPEN)
    actor: MarketAdmin
    preconditions:
    - DeliveryYear.status == FORECAST_LOCKED
    side_effects:
    - DeliveryYear.status -> AUCTION_OPEN when the created AuctionRun enters OPEN
  - from: AUCTION_OPEN
    to: CLEARED
    trigger: POST /capacity-market/auction-runs/{id}/clear (AuctionRun SEALED -> CLEARED)
    actor: MarketAdmin
    preconditions:
    - DeliveryYear.status == AUCTION_OPEN
    - AuctionRun.status == SEALED
    - No MitigationReview in PENDING exists for any offer in this run
    side_effects:
    - Run calc auction_clearing; write Zone.clearing_price_per_mw_day and Zone.cleared_mw; create CapacityCommitment rows
      for cleared offers
    - DeliveryYear.status -> CLEARED
  - from: CLEARED
    to: SETTLED
    trigger: POST /capacity-market/delivery-years/{id}/settle
    actor: SettlementOps
    preconditions:
    - DeliveryYear.status == CLEARED
    - All EmergencyEvents for the delivery year are in ASSESSED or SETTLED
    - All PerformanceAssessments are FINALIZED
    - No ReplacementTransaction in PENDING exists for commitments of this delivery year
    side_effects:
    - Run calc redistribution_pool for every ASSESSED EmergencyEvent; post REDISTRIBUTION SettlementEntry rows; events ASSESSED
      -> SETTLED
    - CapacityCommitment rows with status ACTIVE -> SETTLED
  - from: SETTLED
    to: CLOSED
    trigger: POST /capacity-market/delivery-years/{id}/close
    actor: SettlementOps
    preconditions:
    - DeliveryYear.status == SETTLED
    side_effects: []
- entity: LoadForecast
  initial_state: DRAFT
  terminal_states:
  - SUPERSEDED
  - LOCKED
  transitions:
  - from: DRAFT
    to: LOCKED
    trigger: POST /capacity-market/delivery-years/{id}/lock-forecast
    actor: MarketAdmin
    preconditions:
    - This LoadForecast is the highest-revision DRAFT forecast for its delivery year
    side_effects:
    - Any previously LOCKED LoadForecast for the same delivery year -> SUPERSEDED
  - from: LOCKED
    to: SUPERSEDED
    trigger: system — a newer revision becomes LOCKED for the same delivery year
    actor: system
    preconditions:
    - DeliveryYear.status == DRAFT (forecast re-lock is only possible before lock-forecast)
    side_effects: []
- entity: CapacityResource
  initial_state: REGISTERED
  terminal_states:
  - RETIRED
  transitions:
  - from: REGISTERED
    to: ACCREDITED
    trigger: POST /capacity-market/accreditations/{id}/approve (Accreditation PENDING_REVIEW -> EFFECTIVE)
    actor: MarketAdmin
    preconditions:
    - CapacityResource.status == REGISTERED
    - Accreditation.status == PENDING_REVIEW
    - The accreditation's delivery year is in DRAFT or FORECAST_LOCKED
    side_effects:
    - Run calc accreditation_ucap for the effective accreditation
    - CapacityResource.accredited_ucap_mw = Accreditation.ucap_mw
    - CapacityResource.must_offer recomputed (true iff a CapacityCommitment exists for this resource in the prior delivery
      year)
  - from: ACCREDITED
    to: RETIRED
    trigger: POST /capacity-market/resources/{id}/retire
    actor: ResourceOwner
    preconditions:
    - CapacityResource.status == ACCREDITED
    - No CapacityCommitment for this resource in status ACTIVE or REPLACEMENT_PENDING
    - Acting X-User-ID == CapacityResource.owner_id
    side_effects:
    - Any SUBMITTED AuctionOffer rows for this resource -> WITHDRAWN
- entity: Accreditation
  initial_state: PENDING_REVIEW
  terminal_states:
  - EFFECTIVE
  - REJECTED
  transitions:
  - from: PENDING_REVIEW
    to: EFFECTIVE
    trigger: POST /capacity-market/accreditations/{id}/approve
    actor: MarketAdmin
    preconditions:
    - Accreditation.status == PENDING_REVIEW
    - No other EFFECTIVE Accreditation exists for the same (resource_id, delivery_year_id)
    side_effects:
    - 'Cascade: CapacityResource REGISTERED -> ACCREDITED (see CapacityResource machine)'
  - from: PENDING_REVIEW
    to: REJECTED
    trigger: POST /capacity-market/accreditations/{id}/reject
    actor: MarketAdmin
    preconditions:
    - Accreditation.status == PENDING_REVIEW
    side_effects: []
- entity: AuctionRun
  initial_state: DRAFT
  terminal_states:
  - SETTLED
  transitions:
  - from: DRAFT
    to: OPEN
    trigger: POST /capacity-market/auction-runs/{id}/open
    actor: MarketAdmin
    preconditions:
    - AuctionRun.status == DRAFT
    - DeliveryYear.status == FORECAST_LOCKED
    - No other AuctionRun for the same delivery year is in OPEN or SEALED
    side_effects:
    - DeliveryYear.status FORECAST_LOCKED -> AUCTION_OPEN
  - from: OPEN
    to: SEALED
    trigger: POST /capacity-market/auction-runs/{id}/seal
    actor: MarketAdmin
    preconditions:
    - AuctionRun.status == OPEN
    - At least one AuctionOffer in SUBMITTED exists for this run
    side_effects:
    - All SUBMITTED offers for this run -> SEALED; freeze offer_mw and effective_price_per_mw_day
    - For each SEALED offer, auto-create a MitigationReview with outcome EXEMPT when pivotal_supplier_flag would be false
      AND offer_price_per_mw_day <= calc seller_offer_cap cap; otherwise outcome PENDING with pivotal_supplier_flag from the
      screen
    - sealed_at = now
  - from: SEALED
    to: CLEARED
    trigger: POST /capacity-market/auction-runs/{id}/clear
    actor: MarketAdmin
    preconditions:
    - AuctionRun.status == SEALED
    - No MitigationReview in PENDING for any offer in this run
    side_effects:
    - 'Run calc auction_clearing: stack offers by effective_price_per_mw_day ascending per zone, tie-break by sealed_at then
      AuctionOffer.created_at; clear against Zone.zonal_requirement_mw subject to Zone.import_limit_mw'
    - Write Zone.clearing_price_per_mw_day, Zone.cleared_mw, AuctionOffer.cleared_mw; offers fully cleared -> CLEARED, partially
      -> PARTIALLY_CLEARED, zero-cleared -> REJECTED
    - Create CapacityCommitment (status ACTIVE) for each offer with cleared_mw > 0; committed_mw = cleared_mw; clearing_price_per_mw_day
      = resource's zone clearing price
    - cleared_at = now; DeliveryYear.status -> CLEARED
  - from: CLEARED
    to: SETTLED
    trigger: system — when the parent DeliveryYear reaches SETTLED
    actor: system
    preconditions:
    - DeliveryYear.status transition CLEARED -> SETTLED fired
    side_effects: []
- entity: AuctionOffer
  initial_state: SUBMITTED
  terminal_states:
  - CLEARED
  - PARTIALLY_CLEARED
  - REJECTED
  - WITHDRAWN
  transitions:
  - from: SUBMITTED
    to: SEALED
    trigger: system — parent AuctionRun OPEN -> SEALED
    actor: system
    preconditions:
    - offer_mw <= CapacityResource.accredited_ucap_mw at seal time (else offer -> REJECTED instead)
    side_effects:
    - mitigated_cap_per_mw_day computed via calc seller_offer_cap; effective_price_per_mw_day frozen
  - from: SUBMITTED
    to: WITHDRAWN
    trigger: POST /capacity-market/offers/{id}/withdraw
    actor: ResourceOwner
    preconditions:
    - AuctionOffer.status == SUBMITTED
    - AuctionRun.status == OPEN
    - Acting owner owns the offering resource
    side_effects: []
  - from: SEALED
    to: CLEARED
    trigger: system — calc auction_clearing assigns cleared_mw == offer_mw
    actor: system
    preconditions: []
    side_effects:
    - CapacityCommitment created (see AuctionRun SEALED -> CLEARED)
  - from: SEALED
    to: PARTIALLY_CLEARED
    trigger: system — calc auction_clearing assigns 0 < cleared_mw < offer_mw
    actor: system
    preconditions: []
    side_effects:
    - CapacityCommitment created with committed_mw = cleared_mw
  - from: SEALED
    to: REJECTED
    trigger: system — calc auction_clearing assigns cleared_mw == 0 (out-of-market or seal-time MW validation failure)
    actor: system
    preconditions: []
    side_effects: []
- entity: MitigationReview
  initial_state: PENDING
  terminal_states:
  - PASS
  - MITIGATE
  - EXEMPT
  transitions:
  - from: PENDING
    to: PASS
    trigger: POST /capacity-market/mitigation-reviews/{id}/resolve with outcome=PASS
    actor: MarketAdmin
    preconditions:
    - MitigationReview.outcome == PENDING
    side_effects:
    - AuctionOffer.mitigation_status -> PASSED; effective_price_per_mw_day = offer_price_per_mw_day
  - from: PENDING
    to: MITIGATE
    trigger: POST /capacity-market/mitigation-reviews/{id}/resolve with outcome=MITIGATE
    actor: MarketAdmin
    preconditions:
    - MitigationReview.outcome == PENDING
    - pivotal_supplier_flag == true
    side_effects:
    - AuctionOffer.mitigation_status -> MITIGATED; effective_price_per_mw_day = min(offer_price_per_mw_day, mitigated_cap_per_mw_day)
  - from: PENDING
    to: EXEMPT
    trigger: system — auto-exemption at seal when the offer clears the pivotal-supplier screen and prices under cap
    actor: system
    preconditions: []
    side_effects:
    - AuctionOffer.mitigation_status -> EXEMPT
- entity: CapacityCommitment
  initial_state: ACTIVE
  terminal_states:
  - SETTLED
  - DEFAULTED
  transitions:
  - from: ACTIVE
    to: REPLACEMENT_PENDING
    trigger: POST /capacity-market/replacement-transactions (creation against this commitment)
    actor: ResourceOwner
    preconditions:
    - CapacityCommitment.status == ACTIVE
    - expected_commitment_version == CapacityCommitment.version (OCC)
    - replacement_mw <= committed_mw
    - replacement resource is ACCREDITED for the commitment's delivery year with remaining accredited headroom >= replacement_mw
    side_effects:
    - CapacityCommitment.version += 1
  - from: REPLACEMENT_PENDING
    to: ACTIVE
    trigger: POST /capacity-market/replacement-transactions/{id}/reject (reviewer rejects) — the cyclic revert
    actor: MarketAdmin
    preconditions:
    - ReplacementTransaction.status == PENDING
    side_effects:
    - ReplacementTransaction.status -> REJECTED
    - CapacityCommitment REPLACEMENT_PENDING -> ACTIVE; committed_mw unchanged
  - from: REPLACEMENT_PENDING
    to: ACTIVE
    trigger: POST /capacity-market/replacement-transactions/{id}/approve
    actor: MarketAdmin
    preconditions:
    - ReplacementTransaction.status == PENDING
    side_effects:
    - ReplacementTransaction.status -> APPROVED
    - CapacityCommitment REPLACEMENT_PENDING -> ACTIVE with committed_mw reduced by replacement_mw; daily_revenue_dollars
      recomputed
    - 'New CapacityCommitment created for the replacement resource: committed_mw = replacement_mw, clearing_price_per_mw_day
      = original commitment''s clearing_price_per_mw_day, same delivery_year_id, status ACTIVE, offer_id copied from the original
      commitment'
  - from: ACTIVE
    to: SETTLED
    trigger: system — parent DeliveryYear CLEARED -> SETTLED
    actor: system
    preconditions: []
    side_effects: []
  - from: ACTIVE
    to: DEFAULTED
    trigger: POST /capacity-market/commitments/{id}/default
    actor: MarketAdmin
    preconditions:
    - CapacityCommitment.status == ACTIVE
    - cumulative_performance_score < 0.40 AND at least two FINALIZED PerformanceAssessment rows exist for the commitment
    side_effects:
    - CapacityResource must_offer recomputed false; resource remains ACCREDITED but cannot offer in the next run for the same
      delivery year
- entity: EmergencyEvent
  initial_state: DECLARED
  terminal_states:
  - SETTLED
  transitions:
  - from: DECLARED
    to: ASSESSING
    trigger: POST /capacity-market/emergency-events/{id}/begin-assessment
    actor: MarketAdmin
    preconditions:
    - EmergencyEvent.status == DECLARED
    - DeliveryYear.status == CLEARED
    - No other EmergencyEvent for the same delivery year in {DECLARED, ASSESSING, ASSESSED} has an overlapping PAI with this
      event (see validations business_temporal)
    side_effects:
    - 'Create a DRAFT PerformanceAssessment for every CapacityCommitment of the delivery year in ACTIVE or SETTLED status
      whose resource type matches event scope (EMERGENCY_ACTION: all; DR_TEST: DR only)'
  - from: ASSESSING
    to: ASSESSED
    trigger: POST /capacity-market/emergency-events/{id}/finalize-assessments
    actor: MarketAdmin
    preconditions:
    - EmergencyEvent.status == ASSESSING
    - All PerformanceAssessment rows for this event are DRAFT and have actual_mw recorded
    side_effects:
    - 'Each PerformanceAssessment DRAFT -> FINALIZED: compute performance_ratio and charge_or_credit_dollars via calc nonperformance_charge;
      post CHARGE/BONUS SettlementEntry rows'
    - 'Cascade: each affected CapacityCommitment.cumulative_performance_score recomputed (weighted by assessed_mwh across
      all FINALIZED assessments of that commitment)'
  - from: ASSESSED
    to: SETTLED
    trigger: system — DeliveryYear CLEARED -> SETTLED posts REDISTRIBUTION entries
    actor: system
    preconditions: []
    side_effects:
    - REDISTRIBUTION SettlementEntry rows posted per calc redistribution_pool
- entity: PerformanceAssessment
  initial_state: DRAFT
  terminal_states:
  - FINALIZED
  transitions:
  - from: DRAFT
    to: FINALIZED
    trigger: system — parent EmergencyEvent ASSESSING -> ASSESSED
    actor: system
    preconditions: []
    side_effects:
    - SettlementEntry (CHARGE or BONUS) posted; commitment score recomputed
- entity: MeasurementReport
  initial_state: SUBMITTED
  terminal_states:
  - VERIFIED
  - REJECTED
  transitions:
  - from: SUBMITTED
    to: UNDER_REVIEW
    trigger: POST /capacity-market/measurement-reports/{id}/start-review
    actor: MarketAdmin
    preconditions:
    - MeasurementReport.status == SUBMITTED
    side_effects: []
  - from: UNDER_REVIEW
    to: VERIFIED
    trigger: POST /capacity-market/measurement-reports/{id}/verify
    actor: MarketAdmin
    preconditions:
    - MeasurementReport.status == UNDER_REVIEW
    - No other VERIFIED MeasurementReport for the same resource has a half-open window overlapping this report's window
    side_effects:
    - verified_ucap_mw computed via calc mv_verified_ucap
    - 'If the resource has an ACTIVE CapacityCommitment in this delivery year and verified_ucap_mw < committed_mw, cascade:
      the shortfall (committed_mw - verified_ucap_mw, 3 decimals) triggers commitment review — commitment.status stays ACTIVE
      but a DRAFT ReplacementTransaction hint is NOT created; instead CapacityResource.must_offer is set true for the next
      delivery year'
  - from: UNDER_REVIEW
    to: REJECTED
    trigger: POST /capacity-market/measurement-reports/{id}/reject
    actor: MarketAdmin
    preconditions:
    - MeasurementReport.status == UNDER_REVIEW
    side_effects: []
  - from: REJECTED
    to: SUBMITTED
    trigger: POST /capacity-market/measurement-reports (revision submission with revision_of_id pointing at the REJECTED report)
    actor: ResourceOwner
    preconditions:
    - The prior report is REJECTED
    - The new report's window does not overlap any VERIFIED report for the same resource
    side_effects:
    - New MeasurementReport created in SUBMITTED; the REJECTED prior report is unchanged (append-only revision history)
concurrency_rules:
- rule_id: replacement-create-stale-commitment
  parent_entity: CapacityCommitment
  write_endpoint: POST /capacity-market/replacement-transactions
  occ_field: expected_commitment_version
  description: 'Creating a ReplacementTransaction against a CapacityCommitment whose

    version has advanced since the client last observed it is rejected.

    This captures the case where another replacement against the same

    commitment was approved (which legitimately reduces committed_mw and

    bumps version) or a prior PENDING replacement already moved the

    commitment to REPLACEMENT_PENDING, so the submitter''s view of the

    commitment is stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: offer-withdraw-stale-run
  parent_entity: AuctionRun
  write_endpoint: POST /capacity-market/offers/{id}/withdraw
  occ_field: expected_auction_run_version
  description: 'Withdrawing an offer while carrying a stale view of the parent

    AuctionRun is rejected: the run''s version advanced when it sealed,

    which re-priced and froze offers, so a withdraw issued against the

    pre-seal version is rejected as stale rather than as a plain state

    error.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: peak_load_requirement
  trigger: DeliveryYear DRAFT -> FORECAST_LOCKED (lock-forecast)
  algorithm: tiered_pricing
  formula: '# Step 1 (RTO-wide installed reserve requirement):

    ici_mw = rto_peak_load_mw * (1 + reserve_margin_pct)

    # Step 2 (unforced capacity basis, pool-wide):

    rto_requirement_mw = ici_mw * (1 - pool_wide_avg_eford)

    # Step 3 (zonal roll-down): for each top-level zone z (parent_zone_id null):

    #   share_z = zonal_peak_shares[z.zone_code]

    #   z.zonal_requirement_mw = round_half_up(rto_requirement_mw * share_z, 3)

    # For a nested LDA z with parent p:

    #   z.zonal_requirement_mw = round_half_up(p.zonal_requirement_mw * lda_share_z, 3)

    #   where lda_share_z is taken from zonal_peak_shares[z.zone_code] if present,

    #   else 1.0 when the LDA is the only child of p, else ERR_FORECAST_SHARES_INVALID.

    # Step 4: DeliveryYear.reliability_requirement_mw = rto_requirement_mw rounded

    # to 3 decimals round_half_up.

    '
  input_set: The single DRAFT LoadForecast of highest revision for the delivery year; all Zone rows of the delivery year.
  constants:
    ROUND_DECIMALS_MW: 3
  precision: 3 decimal places, round_half_up; money fields 2 decimals
  variants: []
- name: accreditation_ucap
  trigger: Accreditation PENDING_REVIEW -> EFFECTIVE (approve)
  algorithm: weighted_scoring
  formula: '# CLASS_AVG variant:

    #   accreditation_factor = class_avg_factor

    # UNIT_SPECIFIC variant (marginal ELCC derated by unit outage performance):

    #   base = unit_elcc_factor

    #   outage_derate = (1 - forced_outage_rate) / (1 - pool_wide_avg_eford_of_locked_forecast)

    #   sample_confidence = min(1.0, scarcity_hours_sampled / 100)

    #   accreditation_factor = base * outage_derate * sample_confidence

    # accreditation_factor = min(accreditation_factor, 1.0), rounded to 4 decimals round_half_up

    # ucap_mw = round_half_up(nameplate_mw * accreditation_factor, 3)

    '
  input_set: The accreditation being approved; its CapacityResource.nameplate_mw; the LOCKED LoadForecast.pool_wide_avg_eford
    for the accreditation's delivery year (or the DRAFT forecast of highest revision when the delivery year is still DRAFT).
  constants:
    FULL_SAMPLE_HOURS: 100
    FACTOR_CAP: 1.0
  precision: accreditation_factor 4 decimals round_half_up; ucap_mw 3 decimals round_half_up
  variants:
  - name: class_avg
    when: Accreditation.method == CLASS_AVG
    difference: Factor is the flat class-average ELCC; ignores forced_outage_rate and scarcity_hours_sampled.
  - name: unit_specific
    when: Accreditation.method == UNIT_SPECIFIC
    difference: Factor is the unit's marginal ELCC derated by relative outage performance and sample confidence — same nameplate_mw
      and unit factor inputs yield a different ucap_mw than class_avg.
- name: seller_offer_cap
  trigger: AuctionRun OPEN -> SEALED (per SEALED offer); also read at MitigationReview resolution
  algorithm: threshold
  formula: '# Offer cap = max(CON scarcity-net-cone floor, opportunity-cost screen):

    #   net_cone_per_mw_day = 390.00  (constant: net CONE $/MW-day screen)

    #   avoidable_cost_rate = 60.00 + 0.10 * (1000 - owner.credit_score)  # $/MW-day

    #   mitigated_cap_per_mw_day = max(0.10 * net_cone_per_mw_day, avoidable_cost_rate)

    #   capped at net_cone_per_mw_day:

    #   mitigated_cap_per_mw_day = min(mitigated_cap_per_mw_day, net_cone_per_mw_day)

    # Rounded to 2 decimals round_half_up.

    '
  input_set: The SEALED offer; the offering resource's owner's credit_score.
  constants:
    NET_CONE_PER_MW_DAY: 390.0
    ACR_BASE: 60.0
    ACR_CREDIT_SLOPE: 0.1
    MITIGATION_FLOOR_FRACTION: 0.1
  precision: 2 decimal places, round_half_up
- name: auction_clearing
  trigger: AuctionRun SEALED -> CLEARED (clear)
  algorithm: waterfall_allocation
  formula: '# Inputs: all SEALED offers of the run with mitigation resolved

    # (mitigation_status in {PASSED, MITIGATED, EXEMPT}); each offer''s

    # effective_price_per_mw_day and the resource''s zone.

    #

    # Step 1 (merit order, RTO-wide): sort offers by

    #   (effective_price_per_mw_day ASC, sealed_at ASC, AuctionOffer.created_at ASC).

    # Step 2 (zonal clearing, innermost LDA first, then parents, then RTO):

    #   For each nested LDA zone z (deepest first):

    #     internal_supply_z = sum of offer_mw of remaining offers whose zone == z

    #     requirement_z = z.zonal_requirement_mw

    #     # Deliverability: MW from OUTSIDE z usable toward requirement_z is

    #     # limited by z.import_limit_mw:

    #     import_need_z = max(0, requirement_z - internal_supply_z)

    #     importable_z = min(import_need_z, z.import_limit_mw)

    #     # Clear in merit order: internal offers first (cheapest-first within z),

    #     # then imported offers up to importable_z.

    #     # clearing price of z = effective_price of the marginal (last) offer

    #     # cleared for z; if requirement_z is not fully met, price of z =

    #     # max NET_CONE administrative price 390.00 (shortage pricing).

    #   For the RTO-wide zone: requirement = reliability_requirement_mw minus

    #   MW already counted toward nested-LDA requirements; clear remaining

    #   offers in merit order; RTO price = marginal offer''s effective_price.

    # Step 3 (price uplift — nested LDA price separation): a nested LDA''s

    #   clearing_price_per_mw_day = max(its own marginal price, parent zone''s

    #   marginal price) — prices separate UPWARD only; child-zone resources

    #   receive the child price, parent-zone resources the parent price.

    # Step 4 (commitment creation): for each offer in merit order, while

    #   the offer''s zone requirement remains, cleared_mw = min(offer_mw,

    #   remaining_requirement_of_offer_zone); an offer partially cleared when

    #   the marginal split lands inside it; remainder stays REJECTED quantity.

    # Rounding: all MW to 3 decimals round_half_up BEFORE price assignment;

    # the marginal offer is determined on rounded quantities.

    '
  input_set: SEALED offers of the run with mitigation resolved; Zone rows of the delivery year; DeliveryYear.reliability_requirement_mw.
  constants:
    SHORTAGE_PRICE_PER_MW_DAY: 390.0
    ROUND_DECIMALS_MW: 3
  precision: MW 3 decimals round_half_up (rounded before marginal determination); prices 2 decimals round_half_up
  variants: []
- name: performance_ratio_calc
  trigger: PerformanceAssessment DRAFT -> FINALIZED
  algorithm: threshold
  formula: '# expected_mw == 0  -> performance_ratio = 1.0000 (no obligation during PAI)

    # expected_mw > 0   -> performance_ratio = min(actual_mw / expected_mw, 1.5000)

    # 4 decimals round_half_up. The 1.5 cap bounds over-performance bonus.

    '
  input_set: The PerformanceAssessment being finalized.
  constants:
    BONUS_CAP_RATIO: 1.5
    NO_OBLIGATION_RATIO: 1.0
  precision: 4 decimal places, round_half_up
- name: nonperformance_charge
  trigger: PerformanceAssessment DRAFT -> FINALIZED (after performance_ratio_calc)
  algorithm: tiered_pricing
  formula: '# Let H = event duration hours = (event_end - event_start) in hours (fractional ok).

    # Let P = commitment.clearing_price_per_mw_day ($/MW-day).

    # Let D = 24.0 (hours per day). Stop-loss daily base rate BR = P / D ($/MW-hour).

    # shortfall_mw = max(0, expected_mw - actual_mw)

    # over_mw = max(0, actual_mw - expected_mw)

    # Non-performance charge (tiered on the ratio r = actual/expected, expected>0):

    #   r >= 0.60: charge = shortfall_mw * BR * H * 1.0

    #   0.30 <= r < 0.60: charge = shortfall_mw * BR * H * 1.5

    #   r < 0.30: charge = shortfall_mw * BR * H * 2.0

    # Bonus (over-performance, only when shortfall_mw == 0 and expected_mw > 0):

    #   bonus = min(over_mw, 0.5 * expected_mw) * BR * H * 1.0

    # charge_or_credit_dollars = round_half_up(bonus - charge, 2)

    #   (negative = net charge owed; positive = net credit)

    # When expected_mw == 0: charge_or_credit_dollars = 0.00.

    '
  input_set: The PerformanceAssessment being finalized; its CapacityCommitment.clearing_price_per_mw_day; the parent EmergencyEvent
    window.
  constants:
    HOURS_PER_DAY: 24.0
    TIER1_RATIO: 0.6
    TIER2_RATIO: 0.3
    TIER1_MULTIPLIER: 1.0
    TIER2_MULTIPLIER: 1.5
    TIER3_MULTIPLIER: 2.0
    BONUS_MW_CAP_FRACTION: 0.5
  precision: 2 decimal places, round_half_up; tier boundary evaluated on the UNROUNDED ratio actual_mw/expected_mw
- name: redistribution_pool
  trigger: DeliveryYear CLEARED -> SETTLED (settle), per ASSESSED EmergencyEvent
  algorithm: waterfall_allocation
  formula: '# Net pool for the event = sum over FINALIZED assessments of

    #   (-charge_or_credit_dollars) for negative entries (charges collected)

    #   minus sum of positive bonus credits already paid out of the pool.

    # pool_dollars = sum(max(0, -charge_or_credit)) - sum(max(0, charge_or_credit))

    # If pool_dollars <= 0: no REDISTRIBUTION entries.

    # Else distribute pool_dollars pro-rata over FINALIZED assessments with

    # performance_ratio >= 1.0000 (full performers), weighted by assessed_mwh:

    #   share_i = pool_dollars * assessed_mwh_i / sum(assessed_mwh of performers)

    # Round each share to 2 decimals round_half_up in order of

    # (PerformanceAssessment.created_at ASC); the LAST performer in that order

    # receives pool_dollars minus the sum of all prior rounded shares

    # (remainder-absorbing rounding; never uses id as tie-break).

    # Post one REDISTRIBUTION SettlementEntry per performer commitment.

    '
  input_set: FINALIZED PerformanceAssessment rows of one ASSESSED EmergencyEvent; their commitments.
  constants:
    PERFORMER_RATIO_FLOOR: 1.0
  precision: 2 decimal places, round_half_up; remainder absorbed by last performer in created_at order
- name: mv_verified_ucap
  trigger: MeasurementReport UNDER_REVIEW -> VERIFIED
  algorithm: forward_looking
  formula: '# window_hours = (reporting_period_end - reporting_period_start) in hours

    # delivered_mwh = min(metered_mwh, baseline_mwh)

    # avg_mw = delivered_mwh / window_hours

    # factor = the resource''s EFFECTIVE accreditation factor for the report''s

    #   delivery year (1.0 if none — unaccredited DR/EE still gets measured

    #   at face value)

    # verified_ucap_mw = round_half_up(avg_mw * factor, 3)

    '
  input_set: The MeasurementReport being verified; the resource's EFFECTIVE Accreditation for the report's delivery_year_id.
  constants: {}
  precision: 3 decimal places, round_half_up
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and one of the declared roles; X-User-ID present and non-empty
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: Role permitted to invoke this endpoint per §1.5 roles
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Every path-templated resource id exists, validated left-to-right
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 4
  category: existence
  check: Every body-supplied FK (resource_id, zone_id, delivery_year_id, owner_id, offer_id, commitment_id, replacement_resource_id,
    revision_of_id) resolves to an existing row
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all create/action endpoints
- priority: 5
  category: state
  check: 'OCC: expected_commitment_version / expected_auction_run_version matches the parent''s current version (checked BEFORE
    the target resource''s own state gate so a stale parent view yields 412 rather than a state error)'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /capacity-market/replacement-transactions, POST /capacity-market/offers/{id}/withdraw
- priority: 6
  category: state
  check: Target resource is in a state from which the requested transition exists per §1.2 (checked AFTER any OCC version
    gate on the parent)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 7
  category: business_safety
  check: 'Resource ownership: acting ResourceOwner (X-User-ID) must equal the owning ResourceOwnerEntity.id of the resource/offer/commitment
    being mutated'
  error_id: ERR_OWNERSHIP_VIOLATION
  http_status: 403
  applies_to: POST /capacity-market/resources/{id}/retire, POST /capacity-market/offers, POST /capacity-market/offers/{id}/withdraw,
    POST /capacity-market/replacement-transactions, POST /capacity-market/measurement-reports
- priority: 8
  category: business_safety
  check: 'Owner status: a SUSPENDED ResourceOwnerEntity may not submit offers, replacements, or measurement reports'
  error_id: ERR_OWNER_SUSPENDED
  http_status: 422
  applies_to: POST /capacity-market/offers, POST /capacity-market/replacement-transactions, POST /capacity-market/measurement-reports
- priority: 9
  category: business_temporal
  check: 'EmergencyEvent PAI overlap: for the same delivery year, no two events in {DECLARED, ASSESSING, ASSESSED} may have
    overlapping [event_start, event_end) half-open intervals; adjacent events (end == start) are allowed. Enforced at begin-assessment
    (creation permits overlap so reviews can be staged, but only non-overlapping events may enter ASSESSING).'
  error_id: ERR_EVENT_OVERLAP
  http_status: 409
  applies_to: POST /capacity-market/emergency-events/{id}/begin-assessment
- priority: 10
  category: business_temporal
  check: 'MeasurementReport window overlap: a VERIFIED report''s half-open [start, end) window blocks any later report for
    the same resource with an overlapping window from entering VERIFIED'
  error_id: ERR_MEASUREMENT_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /capacity-market/measurement-reports/{id}/verify
- priority: 11
  category: business_temporal
  check: 'Datetime sanity: planning_period_end > planning_period_start; event_end > event_start and both within delivery year
    planning period; reporting_period_end > reporting_period_start'
  error_id: ERR_INVALID_TIME_RANGE
  http_status: 422
  applies_to: POST /capacity-market/delivery-years, POST /capacity-market/emergency-events, POST /capacity-market/measurement-reports
- priority: 12
  category: business_constraint
  check: 'LoadForecast zonal_peak_shares: keys must cover every top-level zone code of the delivery year; fractions round
    to 3 decimals and sum to exactly 1.000 (round_half_up)'
  error_id: ERR_FORECAST_SHARES_INVALID
  http_status: 422
  applies_to: POST /capacity-market/delivery-years/{id}/forecasts
- priority: 13
  category: business_constraint
  check: 'Offer MW headroom: offer_mw <= CapacityResource.accredited_ucap_mw minus MW already offered by this resource into
    the same run in SUBMITTED/SEALED status'
  error_id: ERR_OFFER_EXCEEDS_UCAP
  http_status: 422
  applies_to: POST /capacity-market/offers
- priority: 14
  category: business_constraint
  check: 'Replacement headroom: replacement resource''s accredited_ucap_mw minus its ACTIVE committed MW in the same delivery
    year must be >= replacement_mw; replacement resource must differ from the commitment''s resource; replacement resource
    zone must be the commitment''s zone or an ancestor/descendant LDA of it (deliverability)'
  error_id: ERR_REPLACEMENT_NOT_DELIVERABLE
  http_status: 422
  applies_to: POST /capacity-market/replacement-transactions
- priority: 15
  category: business_constraint
  check: 'Mitigation gate: AuctionRun cannot clear while any MitigationReview for its offers is PENDING'
  error_id: ERR_MITIGATION_PENDING
  http_status: 409
  applies_to: POST /capacity-market/auction-runs/{id}/clear
- priority: 16
  category: business_constraint
  check: 'Accreditation uniqueness: at most one EFFECTIVE Accreditation per (resource_id, delivery_year_id)'
  error_id: ERR_ACCREDITATION_CONFLICT
  http_status: 409
  applies_to: POST /capacity-market/accreditations/{id}/approve
- priority: 17
  category: business_fiscal
  check: 'Replacement MW bound: replacement_mw > 0 and replacement_mw <= commitment.committed_mw at OCC check time'
  error_id: ERR_REPLACEMENT_EXCEEDS_COMMITMENT
  http_status: 422
  applies_to: POST /capacity-market/replacement-transactions
- priority: 18
  category: business_fiscal
  check: 'Default threshold: commitment default requires cumulative_performance_score < 0.40 with >= 2 FINALIZED assessments'
  error_id: ERR_DEFAULT_THRESHOLD_NOT_MET
  http_status: 422
  applies_to: POST /capacity-market/commitments/{id}/default
- priority: 19
  category: business_constraint
  check: GEN resources may not submit MeasurementReports; DR/EE only
  error_id: ERR_MEASUREMENT_NOT_APPLICABLE
  http_status: 422
  applies_to: POST /capacity-market/measurement-reports
- priority: 20
  category: business_constraint
  check: 'Required-field and type validation: missing required input fields, enum violations, numeric range violations (reserve_margin_pct
    in (0,1), credit_score in [0,1000], factors in (0,1])'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
endpoints:
- method: POST
  path: /capacity-market/delivery-years
  description: Create a delivery year in DRAFT.
  roles:
  - MarketAdmin
  code: 201
  input:
  - delivery_year_label
  - planning_period_start
  - planning_period_end
  output: DeliveryYear
  side_effects:
  - status=DRAFT
- method: GET
  path: /capacity-market/delivery-years
  description: List delivery years (paginated).
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - limit?
  - offset?
  - status?
  output: DeliveryYear[]
  side_effects: []
- method: GET
  path: /capacity-market/delivery-years/{id}
  description: Fetch one delivery year.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input: []
  output: DeliveryYear
  side_effects: []
- method: POST
  path: /capacity-market/delivery-years/{id}/lock-forecast
  description: Lock the highest-revision DRAFT LoadForecast; runs peak_load_requirement.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: DeliveryYear
  side_effects:
  - calc peak_load_requirement
  - DeliveryYear DRAFT->FORECAST_LOCKED
  - LoadForecast DRAFT->LOCKED; older LOCKED->SUPERSEDED
  - increments DeliveryYear.version by 1
- method: POST
  path: /capacity-market/delivery-years/{id}/settle
  description: Settle the delivery year; posts redistribution entries.
  roles:
  - SettlementOps
  code: 200
  input: []
  output: DeliveryYear
  side_effects:
  - calc redistribution_pool per ASSESSED event
  - DeliveryYear CLEARED->SETTLED
  - events ASSESSED->SETTLED
  - commitments ACTIVE->SETTLED
  - increments DeliveryYear.version by 1
- method: POST
  path: /capacity-market/delivery-years/{id}/close
  description: Close a settled delivery year.
  roles:
  - SettlementOps
  code: 200
  input: []
  output: DeliveryYear
  side_effects:
  - DeliveryYear SETTLED->CLOSED
  - increments DeliveryYear.version by 1
- method: POST
  path: /capacity-market/delivery-years/{id}/zones
  description: Create a zone in a delivery year (parent_zone_id optional for LDA nesting).
  roles:
  - MarketAdmin
  code: 201
  input:
  - zone_code
  - import_limit_mw?
  - parent_zone_id?
  output: Zone
  side_effects: []
- method: GET
  path: /capacity-market/delivery-years/{id}/zones
  description: List zones of a delivery year.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - limit?
  - offset?
  output: Zone[]
  side_effects: []
- method: GET
  path: /capacity-market/zones/{id}
  description: Fetch one zone (includes computed requirement/clearing fields).
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input: []
  output: Zone
  side_effects: []
- method: POST
  path: /capacity-market/delivery-years/{id}/forecasts
  description: Submit a new LoadForecast revision (DRAFT) for a delivery year.
  roles:
  - MarketAdmin
  code: 201
  input:
  - rto_peak_load_mw
  - reserve_margin_pct
  - pool_wide_avg_eford
  - zonal_peak_shares
  output: LoadForecast
  side_effects:
  - revision = max(existing revisions)+1
  - status=DRAFT
- method: GET
  path: /capacity-market/delivery-years/{id}/forecasts
  description: List forecast revisions of a delivery year.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - limit?
  - offset?
  - status?
  output: LoadForecast[]
  side_effects: []
- method: POST
  path: /capacity-market/owners
  description: Register a market participant.
  roles:
  - MarketAdmin
  code: 201
  input:
  - legal_name
  - contact_email
  - credit_score
  output: ResourceOwnerEntity
  side_effects:
  - status=ACTIVE
- method: GET
  path: /capacity-market/owners/{id}
  description: Fetch one owner.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input: []
  output: ResourceOwnerEntity
  side_effects: []
- method: POST
  path: /capacity-market/owners/{id}/suspend
  description: Suspend an owner (blocks offer/replacement/report submission).
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: ResourceOwnerEntity
  side_effects:
  - status->SUSPENDED
  - increments ResourceOwnerEntity.version by 1
- method: POST
  path: /capacity-market/resources
  description: Register a capacity resource under an owner and zone.
  roles:
  - ResourceOwner
  code: 201
  input:
  - owner_id
  - zone_id
  - resource_type
  - nameplate_mw
  output: CapacityResource
  side_effects:
  - status=REGISTERED
- method: GET
  path: /capacity-market/resources
  description: List resources; filter by owner_id, zone_id, resource_type, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - owner_id?
  - zone_id?
  - resource_type?
  - status?
  - limit?
  - offset?
  output: CapacityResource[]
  side_effects: []
- method: GET
  path: /capacity-market/resources/{id}
  description: Fetch one resource.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input: []
  output: CapacityResource
  side_effects: []
- method: POST
  path: /capacity-market/resources/{id}/retire
  description: Retire an accredited resource with no live commitments.
  roles:
  - ResourceOwner
  code: 200
  input: []
  output: CapacityResource
  side_effects:
  - CapacityResource ACCREDITED->RETIRED
  - SUBMITTED offers -> WITHDRAWN
  - increments CapacityResource.version by 1
- method: POST
  path: /capacity-market/accreditations
  description: Submit an accreditation (PENDING_REVIEW) for a resource and delivery year.
  roles:
  - ResourceOwner
  code: 201
  input:
  - resource_id
  - delivery_year_id
  - method
  - class_avg_factor?
  - unit_elcc_factor?
  - forced_outage_rate
  - scarcity_hours_sampled
  output: Accreditation
  side_effects:
  - status=PENDING_REVIEW
- method: GET
  path: /capacity-market/accreditations
  description: List accreditations; filter by resource_id, delivery_year_id, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - resource_id?
  - delivery_year_id?
  - status?
  - limit?
  - offset?
  output: Accreditation[]
  side_effects: []
- method: POST
  path: /capacity-market/accreditations/{id}/approve
  description: Approve an accreditation; computes UCAP and accredits the resource.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: Accreditation
  side_effects:
  - calc accreditation_ucap
  - Accreditation PENDING_REVIEW->EFFECTIVE
  - CapacityResource REGISTERED->ACCREDITED
  - updates CapacityResource.accredited_ucap_mw
- method: POST
  path: /capacity-market/accreditations/{id}/reject
  description: Reject an accreditation.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: Accreditation
  side_effects:
  - Accreditation PENDING_REVIEW->REJECTED
- method: POST
  path: /capacity-market/auction-runs
  description: Create an auction run (DRAFT) for a delivery year.
  roles:
  - MarketAdmin
  code: 201
  input:
  - delivery_year_id
  - run_label
  output: AuctionRun
  side_effects:
  - status=DRAFT
- method: GET
  path: /capacity-market/auction-runs
  description: List auction runs; filter by delivery_year_id, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - delivery_year_id?
  - status?
  - limit?
  - offset?
  output: AuctionRun[]
  side_effects: []
- method: GET
  path: /capacity-market/auction-runs/{id}
  description: Fetch one auction run.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input: []
  output: AuctionRun
  side_effects: []
- method: POST
  path: /capacity-market/auction-runs/{id}/open
  description: Open the run for offers (requires delivery year FORECAST_LOCKED).
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: AuctionRun
  side_effects:
  - AuctionRun DRAFT->OPEN
  - DeliveryYear FORECAST_LOCKED->AUCTION_OPEN
  - increments AuctionRun.version by 1
- method: POST
  path: /capacity-market/auction-runs/{id}/seal
  description: Seal the offer window; freezes offers, computes caps, opens mitigation reviews.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: AuctionRun
  side_effects:
  - AuctionRun OPEN->SEALED
  - offers SUBMITTED->SEALED (or REJECTED if over UCAP)
  - calc seller_offer_cap per offer
  - auto-create MitigationReview rows
  - increments AuctionRun.version by 1
- method: POST
  path: /capacity-market/auction-runs/{id}/clear
  description: Clear the auction; publishes zonal prices and creates commitments.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: AuctionRun
  side_effects:
  - calc auction_clearing
  - AuctionRun SEALED->CLEARED
  - writes Zone.clearing_price_per_mw_day/cleared_mw
  - creates CapacityCommitment rows
  - DeliveryYear AUCTION_OPEN->CLEARED
  - increments AuctionRun.version by 1
- method: POST
  path: /capacity-market/offers
  description: Submit an offer into an OPEN run for an ACCREDITED resource.
  roles:
  - ResourceOwner
  code: 201
  input:
  - resource_id
  - auction_run_id
  - offer_mw
  - offer_price_per_mw_day
  output: AuctionOffer
  side_effects:
  - status=SUBMITTED
- method: GET
  path: /capacity-market/offers
  description: List offers; filter by resource_id, auction_run_id, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - resource_id?
  - auction_run_id?
  - status?
  - limit?
  - offset?
  output: AuctionOffer[]
  side_effects: []
- method: GET
  path: /capacity-market/offers/{id}
  description: Fetch one offer.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input: []
  output: AuctionOffer
  side_effects: []
- method: POST
  path: /capacity-market/offers/{id}/withdraw
  description: Withdraw a SUBMITTED offer while the run is OPEN (OCC on the run's version).
  roles:
  - ResourceOwner
  code: 200
  input:
  - expected_auction_run_version
  output: AuctionOffer
  side_effects:
  - AuctionOffer SUBMITTED->WITHDRAWN
  - increments AuctionRun.version by 1
- method: GET
  path: /capacity-market/mitigation-reviews
  description: List mitigation reviews; filter by offer_id, outcome.
  roles:
  - MarketAdmin
  - SettlementOps
  code: 200
  input:
  - offer_id?
  - outcome?
  - limit?
  - offset?
  output: MitigationReview[]
  side_effects: []
- method: GET
  path: /capacity-market/offers/{id}/mitigation-review
  description: Fetch the (0-or-1) review for an offer.
  roles:
  - MarketAdmin
  - SettlementOps
  code: 200
  input: []
  output: MitigationReview[]
  side_effects: []
- method: POST
  path: /capacity-market/mitigation-reviews/{id}/resolve
  description: Resolve a PENDING review to PASS or MITIGATE.
  roles:
  - MarketAdmin
  code: 200
  input:
  - outcome
  - reviewer_note?
  output: MitigationReview
  side_effects:
  - MitigationReview PENDING->PASS|MITIGATE
  - updates AuctionOffer.mitigation_status and effective_price_per_mw_day
  - resolved_at set
- method: GET
  path: /capacity-market/commitments
  description: List commitments; filter by resource_id, delivery_year_id, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - resource_id?
  - delivery_year_id?
  - offer_id?
  - status?
  - limit?
  - offset?
  output: CapacityCommitment[]
  side_effects: []
- method: GET
  path: /capacity-market/commitments/{id}
  description: Fetch one commitment.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input: []
  output: CapacityCommitment
  side_effects: []
- method: POST
  path: /capacity-market/commitments/{id}/default
  description: Declare a commitment defaulted for sustained non-performance.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: CapacityCommitment
  side_effects:
  - CapacityCommitment ACTIVE->DEFAULTED
  - increments CapacityCommitment.version by 1
- method: POST
  path: /capacity-market/replacement-transactions
  description: Submit a bilateral replacement against an ACTIVE commitment (OCC on commitment version; moves commitment to
    REPLACEMENT_PENDING).
  roles:
  - ResourceOwner
  code: 201
  input:
  - commitment_id
  - replacement_resource_id
  - replacement_mw
  - price_per_mw_day
  - expected_commitment_version
  output: ReplacementTransaction
  side_effects:
  - status=PENDING
  - CapacityCommitment ACTIVE->REPLACEMENT_PENDING
  - increments CapacityCommitment.version by 1
- method: GET
  path: /capacity-market/replacement-transactions
  description: List replacements; filter by commitment_id, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - commitment_id?
  - replacement_resource_id?
  - status?
  - limit?
  - offset?
  output: ReplacementTransaction[]
  side_effects: []
- method: POST
  path: /capacity-market/replacement-transactions/{id}/approve
  description: Approve a PENDING replacement; releases MW and creates the replacement commitment.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: ReplacementTransaction
  side_effects:
  - ReplacementTransaction PENDING->APPROVED
  - original commitment committed_mw reduced, ->ACTIVE
  - new CapacityCommitment created for replacement resource
  - daily_revenue_dollars recomputed on original
- method: POST
  path: /capacity-market/replacement-transactions/{id}/reject
  description: Reject a PENDING replacement; commitment reverts to ACTIVE unchanged.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: ReplacementTransaction
  side_effects:
  - ReplacementTransaction PENDING->REJECTED
  - CapacityCommitment REPLACEMENT_PENDING->ACTIVE (no MW change)
- method: POST
  path: /capacity-market/emergency-events
  description: Declare an emergency event (PAI) in a delivery year.
  roles:
  - MarketAdmin
  code: 201
  input:
  - delivery_year_id
  - event_start
  - event_end
  - event_type
  output: EmergencyEvent
  side_effects:
  - status=DECLARED
- method: GET
  path: /capacity-market/emergency-events
  description: List emergency events; filter by delivery_year_id, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - delivery_year_id?
  - status?
  - limit?
  - offset?
  output: EmergencyEvent[]
  side_effects: []
- method: POST
  path: /capacity-market/emergency-events/{id}/begin-assessment
  description: Move event to ASSESSING; spawn DRAFT PerformanceAssessment rows for in-scope commitments.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: EmergencyEvent
  side_effects:
  - EmergencyEvent DECLARED->ASSESSING
  - creates DRAFT PerformanceAssessment per in-scope commitment
- method: GET
  path: /capacity-market/emergency-events/{id}/assessments
  description: List assessments of an event.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - limit?
  - offset?
  output: PerformanceAssessment[]
  side_effects: []
- method: POST
  path: /capacity-market/assessments/{id}/record-actual
  description: Record expected_mw and actual_mw on a DRAFT assessment.
  roles:
  - MarketAdmin
  code: 200
  input:
  - expected_mw
  - actual_mw
  output: PerformanceAssessment
  side_effects:
  - updates expected_mw/actual_mw on DRAFT assessment
- method: POST
  path: /capacity-market/emergency-events/{id}/finalize-assessments
  description: Finalize all DRAFT assessments; computes ratios, charges/bonuses; posts CHARGE/BONUS entries.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: EmergencyEvent
  side_effects:
  - calc performance_ratio_calc
  - calc nonperformance_charge
  - assessments DRAFT->FINALIZED
  - posts SettlementEntry CHARGE/BONUS rows
  - recomputes CapacityCommitment.cumulative_performance_score
  - EmergencyEvent ASSESSING->ASSESSED
- method: POST
  path: /capacity-market/measurement-reports
  description: Submit an M&V report for a DR/EE resource (or a revision of a REJECTED report).
  roles:
  - ResourceOwner
  code: 201
  input:
  - resource_id
  - delivery_year_id
  - reporting_period_start
  - reporting_period_end
  - metered_mwh
  - baseline_mwh
  - revision_of_id?
  output: MeasurementReport
  side_effects:
  - status=SUBMITTED
- method: GET
  path: /capacity-market/measurement-reports
  description: List measurement reports; filter by resource_id, delivery_year_id, status.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - resource_id?
  - delivery_year_id?
  - revision_of_id?
  - status?
  - limit?
  - offset?
  output: MeasurementReport[]
  side_effects: []
- method: POST
  path: /capacity-market/measurement-reports/{id}/start-review
  description: Move a SUBMITTED report to UNDER_REVIEW.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: MeasurementReport
  side_effects:
  - MeasurementReport SUBMITTED->UNDER_REVIEW
- method: POST
  path: /capacity-market/measurement-reports/{id}/verify
  description: Verify an UNDER_REVIEW report; computes verified_ucap_mw; enforces window overlap rule.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: MeasurementReport
  side_effects:
  - calc mv_verified_ucap
  - MeasurementReport UNDER_REVIEW->VERIFIED
  - may set CapacityResource.must_offer=true for next delivery year on shortfall
- method: POST
  path: /capacity-market/measurement-reports/{id}/reject
  description: Reject an UNDER_REVIEW report.
  roles:
  - MarketAdmin
  code: 200
  input: []
  output: MeasurementReport
  side_effects:
  - MeasurementReport UNDER_REVIEW->REJECTED
- method: GET
  path: /capacity-market/settlement-entries
  description: List settlement ledger entries; filter by delivery_year_id, commitment_id, emergency_event_id, entry_type.
  roles:
  - MarketAdmin
  - ResourceOwner
  - SettlementOps
  code: 200
  input:
  - delivery_year_id?
  - commitment_id?
  - emergency_event_id?
  - entry_type?
  - limit?
  - offset?
  output: SettlementEntry[]
  side_effects: []
- method: POST
  path: /capacity-market/_clock/set_current_utc
  description: Set the server's logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z
    and never falls back to wall-clock time.
  roles:
  - MarketAdmin
  code: 200
  input:
  - to_iso8601
  output: '{ current_utc: string }'
  side_effects:
