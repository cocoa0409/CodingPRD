            - "GET /vote-by-mail/ballot-packets/${pk1} returns status == \"MAILED\" and mailed_at == \"2026-09-10T09:00:00Z\" on the very next read"
            - "GET /vote-by-mail/ballot-requests/${br1} returns status == \"MAILED\""
            - "GET /vote-by-mail/elections/${e1} returns posture == \"MAILING\" and packets_mailed_count == 1"
            - "Accountability read: packets_mailed_count == 1, outstanding_packet_count == 1, postage_committed_cents == 141, postage_actual_cents == 141, accountability_delta == 0, reconciliation_status == \"IN_BALANCE\""
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=POSTURE_CHANGED returns total_count == 1 (the auto-transition is logged in the same cycle)"
