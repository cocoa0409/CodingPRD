      - name: allowed_amount_at_and_one_cent_above_the_scheduled_cap
        claim_type: threshold
        grounds:
          - calculations.provider_bill_allowed_amount
          - entities.ProviderBill.fields.scheduled_cap_cents
          - global_constants.SEVERITY_CAP_FACTOR_BPS
        distinguishing_aspect: "Three IN_NETWORK bills probe the scheduled cap at 299999, exactly 300000 and 300001: the allowed amount tracks the negotiated amount below the cap, equals it at the cap, and is clamped to the cap one cent above. A server using a strict comparison at the cap returns 299999 or 300001 for the middle or upper bill."
        test_recipe:
          setup:
            - "One league, one BASEBALL_U12 classification (DIAGNOSTIC_IMAGING cap 300000) and one ACTIVE policy with 404 participants."
            - "One ENROLLED athlete with a VERIFIED MODERATE injury report, so scheduled_cap_cents is exactly 300000 on every bill."
            - "Three IN_NETWORK DIAGNOSTIC_IMAGING bills, all billed 480000, with fee schedules of 299999, 300000 and 300001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /leagues"
              payload: { name: "Pinehurst Baseball", league_code: "PHB-121", state_code: "SC", governing_body_code: "USYSA", contact_email: "admin@phb.example" }
              as: ProgramAdministrator
