              payload: { author_resident_id: "${a_id}", body: "The man who parks by the corner house every night keeps circling the block.", category: "SUSPICIOUS_ACTIVITY", post_x_m: 0, post_y_m: 0, location_profiling_count: 4 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { post_id: "$.data.id", p_score0: "$.data.discrimination_score", p_state0: "$.data.state" }
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "This singles out a neighbour by where he parks." }
              as: Resident
              as_user_id: "${n1_id}"
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/flag"
              payload: { flag_reason: "Agreed, this is profiling." }
              as: Resident
              as_user_id: "${n2_id}"
              captures: { p_state1: "$.data.state", p_v1: "$.data.version" }
            - call: "POST /neighborhood-safety/moderation-cases"
              payload: { resident_post_id: "${post_id}", opened_reason: "RESIDENT_FLAGS", expected_resident_post_version: "${p_v1}" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { case_id: "$.data.id" }
            - call: "POST /neighborhood-safety/moderation-cases/${case_id}/decide"
              payload: { decision: "REQUEST_REVISION", decision_note: "Please remove the identifying detail about the vehicle and the address." }
              as: Moderator
              as_user_id: "mod-2"
              captures: { case_state: "$.data.state" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/revise"
              payload: { body: "A car has been circling our block repeatedly late at night; please keep an eye out.", location_profiling_count: 0 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { r_state: "$.data.state", r_score: "$.data.discrimination_score", r_rev: "$.data.revision_count", r_reason: "$.data.auto_flag_reason", r_v: "$.data.version" }
            - call: "POST /neighborhood-safety/resident-posts/${post_id}/revise"
              payload: { body: "A car has been circling our block repeatedly late at night; please keep an eye out.", location_profiling_count: 0 }
              as: Resident
              as_user_id: "${a_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /neighborhood-safety/resident-posts/${post_id}"
              payload: {}
              as: Resident
              as_user_id: "${a_id}"
              captures: { g_state: "$.data.state", g_rev: "$.data.revision_count", g_v: "$.data.version" }
          assert:
            - "${p_score0} == 0.46 and ${p_state0} == PUBLISHED"
            - "${p_state1} == FLAGGED and ${p_v1} == 3"
            - "${case_state} == DECIDED and ResidentPost.${post_id}.state == REVISION_REQUESTED just before the trigger"
            - "the first revise returns 200"
            - "${r_state} == PUBLISHED"
            - "${r_score} == 0.00"
            - "${r_rev} == 1"
            - "${r_reason} == null"
            - "the second revise returns 409 with ${err_id} == ERR_POST_NOT_REVISABLE"
            - "${g_state} == PUBLISHED and ${g_rev} == 1 and ${g_v} == ${r_v} — the refused call bumped nothing"

