              as: TaxAdmin
              captures: { ret1: $.data.id }
            - call: "POST /returns/${ret1}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-01-15T00:00:00Z", period_end: "2026-02-15T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 500000 } ] }
              as: TaxAdmin
              captures: { ret2: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-02-28T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 500000 } ] }
              as: TaxAdmin
              captures: { ret3: $.data.id }
          trigger:
            - call: "POST /returns/${ret2}/file"
