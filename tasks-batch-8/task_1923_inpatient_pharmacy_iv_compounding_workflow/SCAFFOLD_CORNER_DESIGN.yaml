          assert:
            - "case status == ESCALATED"
            - "GET diversion-cases?source_discrepancy_case_id returns exactly 1 row: status OPEN, opened_via == ESCALATION, station_id == ${st_id}, subject_staff_id == ${tech_id}"
      - name: diversion_case_branching_adjudication
        claim_type: invalid_transition
        grounds: ["state_machines.DiversionCase.OPEN_to_UNDER_REVIEW", "state_machines.DiversionCase.UNDER_REVIEW_to_SUBSTANTIATED"]
        distinguishing_aspect: "Branching fork: adjudicate from OPEN (skipping review) is rejected ERR_INVALID_STATE; after review, outcome SUBSTANTIATED succeeds and a second adjudicate on the terminal case fails."
        test_recipe:
          setup: ["Manual diversion case OPEN"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech DV", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-DV", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/diversion-cases"
              payload: { station_id: "${st_id}", subject_staff_id: "${subj_id}", reason: "anomaly" }
              as: DiversionOfficer
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/diversion-cases/${dc_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", note: "too early" }
              as: DiversionOfficer
              captures: { err1: $.data.error_id }
            - call: "POST /pharmacy/diversion-cases/${dc_id}/review"
              payload: {}
              as: DiversionOfficer
            - call: "POST /pharmacy/diversion-cases/${dc_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", note: "confirmed" }
              as: DiversionOfficer
              captures: { fin: $.data.status }
            - call: "POST /pharmacy/diversion-cases/${dc_id}/adjudicate"
              payload: { outcome: "CLOSED_UNSUBSTANTIATED", note: "flip" }
              as: DiversionOfficer
              captures: { err2: $.data.error_id }
          assert:
            - "adjudicate from OPEN: error_id == ERR_INVALID_STATE (409)"
            - "after review, adjudicate SUBSTANTIATED succeeds: status == SUBSTANTIATED, outcome_note == 'confirmed'"
            - "second adjudicate from terminal: error_id == ERR_INVALID_STATE (409)"
      - name: order_supersede_cascade_via_new_order
        claim_type: side_effect_execution
        grounds: ["state_machines.MedicationOrder.verification:PENDING_|_VERIFIED_|_ON_HOLD_to_verification:SUPERSEDED", "concurrency_rules[order-create-stale-patient-version]"]
        distinguishing_aspect: "Creating a second order for the same (patient, drug) supersedes the prior VERIFIED order: it flips to SUPERSEDED and the patient version increments by 1 per create."
        test_recipe:
          setup: ["Patient P (version 1); order O1 for drug D verified"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr SP", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat SP", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugSP", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
            - call: "POST /pharmacy/medication-orders/${o1}/verify"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 150.0, frequency_per_day: 1, expected_patient_version: "${pat_v} + 1" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o2: $.data.id }
            - call: "GET /pharmacy/medication-orders/${o1}"
              payload: {}
              as: Pharmacist
              captures: { o1_v: $.data.verification_status }
            - call: "GET /pharmacy/patients/${pat_id}"
              payload: {}
              as: PharmacyAdmin
              captures: { p_ver: $.data.version }
          assert:
            - "O1.verification_status == SUPERSEDED (auto-transition on the second create)"
            - "O2 created PENDING with ordered_dose_mg == 150.0"
            - "PatientProfile.version advanced from 1 to 3 (one increment per successful create)"

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: adc_count_chronological_replay_value
        claim_type: correct_result
        grounds: ["calculations.adc_expected_on_hand", "entities.InventoryEvent.fields.expected_on_hand_after"]
        distinguishing_aspect: "Known sequence restock 50, dispense 3, return 1, waste 1, return 1 -> expected 48; count at physical 48 returns variance 0 and no discrepancy case (below NON_CONTROLLED threshold 5)."
        test_recipe:
          setup: ["Pocket for non-controlled drug; verified PO order; stock built via the exact event sequence"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr CR", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech CR", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Nurse CR", staff_role: "NURSE" }
              as: PharmacyAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat CR", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugCR", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
            - call: "POST /pharmacy/medication-orders/${o1}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-CR", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_id}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id, pk_v: $.data.version }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 50, expected_pocket_version: "${pk_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_id}/dispense"
              payload: { order_id: "${o1}", units: 3 }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_id}/return"
              payload: { units: 1 }
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_id}/waste"
              payload: { units: 1 }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_id}/return"
              payload: { units: 1 }
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /pharmacy/adc-pockets/${pk_id}/count"
              payload: { physical_count_units: 48 }
              as: Pharmacist
              captures: { var: $.data.variance_units, exp: $.data.expected_on_hand_units, case_id: $.data.discrepancy_case_id }
          assert:
            - "expected_on_hand_units == 48 (50 - 3 + 1 - 1 + 1 replayed in order)"
            - "variance_units == 0 and discrepancy_case_id == null (no breach of threshold 5)"
      - name: discrepancy_threshold_inclusive_cii
        claim_type: correct_result
        grounds: ["calculations.adc_expected_on_hand", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Schedule-dependent threshold boundary: on a C_II pocket a variance of exactly -2 (|v| >= 2, INCLUSIVE) opens a DiscrepancyCase, while variance -1 does not; on a NON_CONTROLLED pocket variance -4 does not but -5 does."
        test_recipe:
          setup: ["Two pockets (C_II and NON_CONTROLLED), each restocked to 50"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech TH", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugTH2", schedule: "C_II", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_c2: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugTHN", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_nc: $.data.id }
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-TH", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_c2}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_c2: $.data.id, pk_c2_v: $.data.version }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_nc}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_nc: $.data.id, pk_nc_v: $.data.version }
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/restock"
              payload: { units: 50, expected_pocket_version: "${pk_c2_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/restock"
              payload: { units: 50, expected_pocket_version: "${pk_nc_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/count"
              payload: { physical_count_units: 49 }
              as: Pharmacist
              captures: { c2_m1: $.data.discrepancy_case_id }
            - call: "POST /pharmacy/adc-pockets/${pk_c2}/count"
              payload: { physical_count_units: 48 }
              as: Pharmacist
              captures: { c2_m2: $.data.discrepancy_case_id }
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/count"
              payload: { physical_count_units: 46 }
              as: Pharmacist
              captures: { nc_m4: $.data.discrepancy_case_id }
            - call: "POST /pharmacy/adc-pockets/${pk_nc}/count"
              payload: { physical_count_units: 45 }
              as: Pharmacist
              captures: { nc_m5: $.data.discrepancy_case_id }
          assert:
            - "C_II count at variance -1: discrepancy_case_id == null"
            - "C_II count at variance -2 (inclusive threshold): discrepancy_case_id != null"
            - "NON_CONTROLLED count at variance -4: discrepancy_case_id == null"
            - "NON_CONTROLLED count at variance -5 (inclusive threshold): discrepancy_case_id != null"
      - name: substitution_equivalent_dose_computed
        claim_type: correct_result
        grounds: ["calculations.substitution_equivalent_dose", "calculations.dose_rounding"]
        distinguishing_aspect: "80 mg x factor 0.5 -> 40 mg, step 1.0 (40 > 10) keeps 40.0, clamps [10, 200] inert: substituted order carries ordered_dose_mg == 40.0 and substituted_by_protocol_id set; renal recompute runs against the substitute drug."
        test_recipe:
          setup: ["Drug SHORT in_shortage; Drug SUB; verified PO order 80 mg flagged via activation"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr EQ", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat EQ", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugEQS", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, in_shortage: true }
              as: PharmacyAdmin
              captures: { drug_short: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugEQU", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_sub: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_short}", route: "PO", ordered_dose_mg: 80.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/substitution-protocols"
              payload: { shortage_drug_product_id: "${drug_short}", substitute_drug_product_id: "${drug_sub}", conversion_factor: 0.5, min_dose_mg: 10.0, max_dose_mg: 200.0, expires_at: "2026-09-01T00:00:00Z" }
              as: PharmacyAdmin
              captures: { proto_id: $.data.id }
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/activate"
              payload: {}
              as: PharmacyAdmin
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/substitute"
              payload: { protocol_id: "${proto_id}" }
              as: Pharmacist
              captures: { new_dose: $.data.ordered_dose_mg, new_drug: $.data.drug_product_id }
          assert:
            - "ordered_dose_mg == 40.0 (80 x 0.5, step-rounded, clamped to [10, 200])"
            - "drug_product_id == ${drug_sub} and substituted_by_protocol_id == ${proto_id}"
            - "substitution_pending == false"
      - name: waste_tolerance_release_gate
        claim_type: correct_result
        grounds: ["calculations.batch_yield_and_waste", "errors[ERR_WASTE_TOLERANCE_EXCEEDED]"]
