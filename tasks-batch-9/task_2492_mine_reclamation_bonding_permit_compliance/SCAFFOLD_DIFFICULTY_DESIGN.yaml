              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${permit13_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
          assert:
            - "The first decide returns HTTP 409 with ${xe1_err} == ERR_NO_ACCEPTED_ESTIMATE while Permit.${permit13_id}.status is still APPLICATION_SUBMITTED"
            - "Before acceptance Permit.${permit13_id}.bond_required_amount == null and bond_basis == null"
            - "After acceptance ReclamationCostEstimate.${est13_id}.status == ACCEPTED and Permit.${permit13_id}.bond_required_amount == 865998.00 with bond_basis == FULL_PLAN"
            - "The second decide returns 200 with Permit.${permit13_id}.status == ISSUED, issued_at stamped, bond_held_amount 900000.00, bond_deficiency_amount 0.00, compliance_posture COMPLIANT"

