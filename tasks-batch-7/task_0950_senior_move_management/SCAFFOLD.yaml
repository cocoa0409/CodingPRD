  - name: TimeEntry
    parent: CrewAssignment
    common_fields: true
    fields:
      - name: crew_assignment_id
        type: string
        source: input
        description: "FK -> CrewAssignment.id; the assignment this interval belongs to."
      - name: entry_kind
