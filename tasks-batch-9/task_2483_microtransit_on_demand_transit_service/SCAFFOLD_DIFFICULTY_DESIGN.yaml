              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
            - call: "POST /pool-assignments/${pa1_id}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00Z" }
