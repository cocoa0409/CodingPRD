              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { base: $.data.bonus_base_cents, up: $.data.campaign_uplift_cents, tot: $.data.bonus_total_cents, pol: $.data.policy_version_id, st: $.data.status, sub: $.data.submitted_at }
