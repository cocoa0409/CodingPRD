      - name: terminal_dispute_refuses_further_resolution_actions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Dispute.terminal_states
          - errors[ERR_DISPUTE_STATE_INVALID]
          - state_machines.Deduction.DISPUTED_to_WRITTEN_OFF
        distinguishing_aspect: |
          Once a dispute reaches WRITTEN_OFF, all three of its remaining triggers
          (write-off, record-recovery, send-to-retailer) return
          ERR_DISPUTE_STATE_INVALID (409) and the parent Deduction stays WRITTEN_OFF —
          a terminal dispute cannot be re-opened by any route.
        test_recipe:
          setup:
            - "A RECEIVED deduction disputed for 100.00 and written off for 100.00 by ded-2 (below WRITE_OFF_SELF_APPROVAL_LIMIT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
