            - "agr_final_status == EXECUTED and agr_final_round == 2 — the loop was traversed once and the round count survived execution"

      - name: the_info_requested_loop_increments_revision_round_and_clears_the_item_list_each_pass
        claim_type: Cyclic
        grounds:
          - state_machines.DiligenceReview.transitions.SUBMITTED_to_INFO_REQUESTED
          - state_machines.DiligenceReview.transitions.INFO_REQUESTED_to_SUBMITTED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The SUBMITTED -> INFO_REQUESTED -> SUBMITTED loop is unbounded and each resubmit both increments revision_round AND clears requested_info_items back to [], while Partner.status stays pinned at IN_DILIGENCE for the whole loop — the Partner machine has no edge for the loop at all, so a naive implementation that re-runs the PROSPECT -> IN_DILIGENCE side effect would bump Partner.version on every lap."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Partner A with a SUBMITTED review at revision_round 1."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "INFO_REQUESTED", requested_info_items: ["Audited FY2025 financials", "SOC 2 Type II report"], decision_note: "Two gaps before we can score funding." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { dr_info_status: $.data.status, dr_info_round: $.data.revision_round, dr_info_by: $.data.decided_by_user_id }
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/submit"
              payload: { submission_note: "Both items attached." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_r2_status: $.data.status, dr_r2_round: $.data.revision_round }
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "INFO_REQUESTED", requested_info_items: ["Signed BSA officer attestation"], decision_note: "One remaining gap." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { dr_info2_round: $.data.revision_round }
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/submit"
              payload: { submission_note: "Attestation attached." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { dr_r3_status: $.data.status, dr_r3_round: $.data.revision_round }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_loop_status: $.data.status, pa_loop_v: $.data.version }
          assert:
            - "dr_info_status == INFO_REQUESTED, dr_info_round == 1 (the decide does not touch the round), dr_info_by == co-brett"
            - "dr_r2_status == SUBMITTED and dr_r2_round == 2 and requested_info_items == []"
            - "dr_info2_round == 2 and dr_r3_status == SUBMITTED and dr_r3_round == 3 with requested_info_items == []"
            - "pa_loop_status == IN_DILIGENCE for the whole loop"
            - "pa_loop_v == 3 — create 1, review-create 2, first submit 3; the two loop resubmits add nothing because the Partner has no INFO_REQUESTED edge"

