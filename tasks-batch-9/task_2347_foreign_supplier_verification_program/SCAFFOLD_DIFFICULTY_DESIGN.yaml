      - name: entry_filing_blocked_by_unevaluated_supplier_under_modified_requirements
        grounds:
          - validations[priority=27]
          - entities.SupplierFoodPair.fields.modified_requirements_only
          - state_machines[SupplierFoodPair.exemption_status].transitions.CLAIMED_to_VERIFIED
          - endpoints["POST /fsvp/entry-submissions"]
        distinguishing_aspect: "Entity pair (EntrySubmission <- ForeignSupplier): the pair IS entry-eligible through a VERIFIED SMALL_IMPORTER_MODIFIED exemption, so the state checks at priorities 20 and 21 pass, yet the filing still fails with ERR_SUPPLIER_NOT_APPROVED because modified requirements keep supplier-approval gating in force while the supplier is still UNEVALUATED."
        test_recipe:
          setup:
            - "A very small importer (small_importer_flag true) with one designated QI."
            - "A foreign supplier that has never been evaluated (status UNEVALUATED)."
            - "Pair P3 with a CLAIMED then VERIFIED SMALL_IMPORTER_MODIFIED exemption, so entry_eligibility_status is ELIGIBLE and modified_requirements_only is true."
