        distinguishing_aspect: "Present with expected_ticket_version one behind the live ticket version -> ERR_STALE_TICKET_VERSION (412); ticket unchanged."
        test_recipe:
          setup: ["Ticket INTAKE with a service-line and DRAFT estimate; a PATCH bumps the ticket version so a stale value is one behind."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "OCC Cust", email: "occ@x.com", phone: "555-1025" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id }
