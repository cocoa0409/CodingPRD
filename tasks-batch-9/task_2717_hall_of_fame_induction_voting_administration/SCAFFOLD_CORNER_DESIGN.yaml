      - name: participation_counter_increments_then_lapses_on_second_missed_cycle
        claim_type: decay_function
        grounds:
          - calculations.elector_participation_maintenance
          - state_machines.Elector.CREDENTIALED_to_LAPSED
          - entities.VoterBloc.fields.seats_filled
