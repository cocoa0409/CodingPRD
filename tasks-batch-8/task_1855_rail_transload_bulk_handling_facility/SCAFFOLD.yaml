scenario: |
  1855. Rail Transload & Bulk Handling Facility (Watco transload facility): railcar placement & spot/pull scheduling, inbound car inventory & demurrage clock, transfer to truck & weight ticketing, product segregation & contamination prevention, storage-in-transit & inventory ownership, switching fee & car cleaning, plant safety & derail protection, customer allocation of track space

domain_name: rail-transload
api_prefix: /transload

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: free_demurrage_hours, type: integer, source: input, default: 48, description: "Free demurrage period in hours before billable days accrue; must be > 0" }
      - { name: sit_free_days, type: integer, source: input, default: 2, description: "Default free storage-in-transit days stamped onto new InventoryLots; must be >= 0" }
      - { name: switch_buffer_minutes, type: integer, source: input, default: 30, description: "Minimum gap between crew move windows on the same track; must be > 0" }
      - { name: free_switches_per_period, type: integer, source: input, default: 0, description: "Free switch moves per customer per billing period before per-move fees apply; must be >= 0" }
      - { name: contamination_policy, type: enum, source: input, default: "STRICT_MATRIX", description: "STRICT_MATRIX | WEIGHTED_SCORE — selects the contamination risk variant" }
      - { name: safety_posture, type: enum, source: computed, description: "NORMAL | ELEVATED | SUSPENDED — derived from open SafetyIncidents (see safety_posture calculation)" }
      - { name: open_incident_count, type: integer, source: computed, description: "Count of SafetyIncidents with status OPEN" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer company name" }
      - { name: credit_standing, type: enum, source: input, default: "GOOD_STANDING", description: "GOOD_STANDING | CREDIT_WATCH | CREDIT_HOLD — escalates demurrage multiplier; CREDIT_HOLD blocks new spot/transfer orders" }
      - { name: demurrage_basis, type: enum, source: input, default: "CONSTRUCTIVE", description: "CONSTRUCTIVE | ACTUAL — selects the demurrage clock-start variant" }
      - { name: sit_day_basis, type: enum, source: input, default: "CALENDAR", description: "CALENDAR | BUSINESS — selects the SIT day-count variant, stamped onto new InventoryLots" }
      - { name: allocated_car_spots, type: integer, source: input, description: "Track-space allocation: max occupied+reserved spots this customer may hold; >= 0; adjusted only via the OCC allocation-adjustments endpoint" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Commodity name" }
      - { name: hazard_class, type: enum, source: input, description: "NON_HAZARDOUS | HAZARDOUS | FOOD_GRADE" }
      - { name: segregation_group, type: enum, source: input, description: "FERTILIZER | FOOD_GRAIN | CHEMICAL | PETROLEUM — contamination segregation group" }
      - { name: requires_full_clean, type: boolean, source: input, description: "true → emptied railcar must pass cleaning before release; false → EMPTY_AWAITING_CLEANING auto-advances to READY_FOR_RELEASE" }

  - name: Track
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Track name" }
      - { name: spot_capacity, type: integer, source: input, description: "Number of railcar spot positions on this track; must be > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE — parallel dimension 1" }
      - { name: derail_protection, type: enum, source: system, default: "DISENGAGED", description: "ENGAGED | DISENGAGED — parallel dimension 2 (derail device)" }
      - { name: occupied_spots, type: integer, source: computed, default: 0, description: "Count of railcars with placement_status = SPOTTED on this track" }
      - { name: reserved_spots, type: integer, source: computed, default: 0, description: "Count of SpotOrders in REQUESTED or SCHEDULED on this track" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Equipment name (conveyor, pump, hose)" }
      - { name: equipment_type, type: enum, source: input, description: "CONVEYOR | PUMP | HOSE" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_USE | CLEANING" }
      - { name: last_product_id, type: string, source: system, description: "FK -> Product.id; provenance pointer to the last commodity handled; null when never used or after finish-cleaning; nullable" }

  - name: SafetyIncident
    parent: null
    common_fields: false
    fields:
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Incident description" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }

  - name: Railcar
    parent: null
    common_fields: true
    fields:
      - { name: car_initials, type: string, source: input, description: "Reporting mark initials, e.g. WATX" }
      - { name: car_number, type: string, source: input, description: "Car number digits, e.g. 10001" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; account owning the shipment" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; lading commodity" }
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id; SIT/ownership lot this car feeds" }
      - { name: quantity_loaded_tons, type: number, source: input, description: "Lading weight in tons; > 0; 3-decimal precision" }
      - { name: quantity_remaining_tons, type: number, source: computed, description: "Unloaded balance: starts = quantity_loaded_tons at arrive; decremented by certified ticket net; restored by ticket void" }
      - { name: track_id, type: string, source: system, description: "FK -> Track.id; track where currently spotted; null until spotted; nullable" }
      - { name: spot_number, type: integer, source: system, description: "Assigned spot position 1..spot_capacity; null until spotted; nullable" }
      - { name: placement_status, type: enum, source: system, description: "REGISTERED | ARRIVED | SPOTTED | IN_TRANSFER | EMPTY_AWAITING_CLEANING | CLEANING | READY_FOR_RELEASE | RELEASED | DEPARTED" }
      - { name: hold_status, type: enum, source: system, default: "NONE", description: "NONE | SAFETY_HOLD — parallel dimension gating transfers and release" }
      - { name: arrival_timestamp, type: datetime, source: system, description: "Logical-clock timestamp stamped by arrive; null until ARRIVED; nullable" }
      - { name: placed_timestamp, type: datetime, source: system, description: "Stamped by spot-order execute; null until first placement; nullable" }
      - { name: released_timestamp, type: datetime, source: system, description: "Stamped by release; null until RELEASED; nullable" }
      - { name: departed_timestamp, type: datetime, source: system, description: "Stamped by depart; null until DEPARTED; nullable" }
      - { name: demurrage_billable_days, type: integer, source: computed, description: "Provisional billable days from demurrage_accrual using current logical clock" }
      - { name: demurrage_accrued_cents, type: integer, source: computed, description: "Provisional demurrage amount from demurrage_accrual using current logical clock" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the stored product" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; stored commodity" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }
      - { name: quantity_received_tons, type: number, source: computed, default: 0, description: "Accumulates each linked car's quantity_loaded_tons at arrive" }
      - { name: quantity_shipped_tons, type: number, source: computed, default: 0, description: "Sum of net on CERTIFIED tickets of cars linked to this lot, minus voided" }
      - { name: quantity_rejected_tons, type: number, source: computed, default: 0, description: "Contamination write-offs (always 0 in this version; reserved)" }
      - { name: quantity_on_hand_tons, type: number, source: computed, default: 0, description: "= quantity_received_tons - quantity_shipped_tons - quantity_rejected_tons" }
      - { name: sit_start_timestamp, type: datetime, source: system, description: "Lot creation timestamp — SIT custody start" }
      - { name: sit_free_days, type: integer, source: system, description: "Stamped from Facility.sit_free_days at creation" }
      - { name: sit_day_basis, type: enum, source: system, description: "CALENDAR | BUSINESS — stamped from Customer.sit_day_basis at creation" }
      - { name: sit_daily_rate_cents, type: integer, source: input, description: "SIT daily rate in cents; > 0" }
      - { name: sit_billable_days, type: integer, source: computed, description: "Provisional billable SIT days from sit_accrual using current logical clock" }
      - { name: sit_accrued_cents, type: integer, source: computed, description: "Provisional SIT amount from sit_accrual using current logical clock" }
      - { name: close_timestamp, type: datetime, source: system, description: "Stamped by close; null while ACTIVE; nullable" }

  - name: SpotOrder
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id; car to place" }
      - { name: track_id, type: string, source: input, description: "FK -> Track.id; requested track" }
      - { name: spot_number, type: integer, source: input, description: "Requested spot position 1..track.spot_capacity" }
      - { name: window_start, type: datetime, source: input, description: "Reservation window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Reservation window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | EXECUTED | CLOSED | CANCELLED | SUPERSEDED" }
      - { name: switch_order_id, type: string, source: system, description: "FK -> SwitchOrder.id; crew move created at schedule; null until SCHEDULED; nullable" }

  - name: SwitchOrder
    parent: null
    common_fields: false
    fields:
      - { name: track_id, type: string, source: system, description: "FK -> Track.id; track the crew move serves" }
      - { name: move_type, type: enum, source: system, description: "SPOT | PULL" }
      - { name: railcar_id, type: string, source: system, description: "FK -> Railcar.id; car moved" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; account billed for the move" }
      - { name: window_start, type: datetime, source: system, description: "Crew window start (inclusive)" }
      - { name: window_end, type: datetime, source: system, description: "Crew window end (exclusive)" }
      - { name: sequence_number, type: integer, source: system, description: "Per-customer count of chargeable switch moves including this one; 1-based; used by switching_fee" }
      - { name: fee_cents, type: integer, source: computed, description: "Switch fee from switching_fee; 0 when inside free allowance" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: TransferOrder
    parent: null
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id; source car (product is always the car's lading)" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; transfer line used" }
      - { name: quantity_planned_tons, type: number, source: input, description: "Planned transfer quantity; > 0; 3-decimal precision" }
      - { name: quantity_completed_tons, type: number, source: computed, default: 0, description: "Sum of net on CERTIFIED tickets, minus voided" }
      - { name: risk_score, type: integer, source: computed, description: "Contamination risk score 0..100 computed at activation per contamination_risk_score" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | PAUSED | SUSPENDED | COMPLETED | CANCELLED" }

  - name: WeightTicket
    parent: null
    common_fields: true
    fields:
      - { name: transfer_order_id, type: string, source: system, description: "FK -> TransferOrder.id; parent transfer (from path)" }
      - { name: railcar_id, type: string, source: system, description: "FK -> Railcar.id; denormalized from the transfer order" }
      - { name: truck_reference, type: string, source: input, description: "External truck identifier" }
      - { name: gross_weight_tons, type: number, source: input, description: "Loaded truck scale weight; > 0; 3-decimal precision" }
      - { name: tare_weight_tons, type: number, source: input, description: "Empty truck scale weight; > 0; 3-decimal precision" }
      - { name: truck_max_payload_tons, type: number, source: input, description: "Legal payload limit for this truck; > 0" }
      - { name: net_weight_tons, type: number, source: computed, description: "= gross_weight_tons - tare_weight_tons, rounded to 3 decimals half-up" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | VOIDED" }

  - name: ChargeEntry
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; billed account" }
      - { name: railcar_id, type: string, source: system, description: "FK -> Railcar.id; car that occasioned the charge; null for lot-level SIT; nullable" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set when swept by issue; null while ACCRUED; nullable" }
      - { name: charge_type, type: enum, source: system, description: "DEMURRAGE | SWITCHING | CLEANING | STORAGE_IN_TRANSIT" }
      - { name: quantity, type: number, source: computed, description: "Billed units: demurrage/SIT days, switch moves (1), cleaning attempts (1)" }
      - { name: unit_rate_cents, type: integer, source: computed, description: "Effective blended rate in cents per unit; amount_cents / quantity when quantity > 0, else 0" }
      - { name: amount_cents, type: integer, source: computed, description: "Charge amount in cents, rounded half-up at line level" }
      - { name: status, type: enum, source: system, description: "ACCRUED | INVOICED | VOIDED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billed account" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (inclusive); must be >= period_start" }
      - { name: charge_count, type: integer, source: computed, default: 0, description: "Number of charges swept at issue" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Sum of swept charges' line-rounded amount_cents (see invoice_total)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | DISPUTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Track
    initial_state: "status=ACTIVE, derail_protection=DISENGAGED"
    terminal_states: []
    transitions:
      - from: "status=ACTIVE"
        to: "status=OUT_OF_SERVICE"
        trigger: "POST /transload/tracks/{trackId}/take-out-of-service"
        actor: YardMaster
        preconditions:
          - "occupied_spots == 0 (ERR_TRACK_OCCUPIED)"
        side_effects:
          - "Track.version += 1"
      - from: "status=OUT_OF_SERVICE"
        to: "status=ACTIVE"
        trigger: "POST /transload/tracks/{trackId}/restore-service"
        actor: YardMaster
        preconditions: []
        side_effects:
          - "Track.version += 1"
      - from: "derail_protection=DISENGAGED"
        to: "derail_protection=ENGAGED"
        trigger: "POST /transload/tracks/{trackId}/engage-derail"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "Track.version += 1"
      - from: "derail_protection=ENGAGED"
        to: "derail_protection=DISENGAGED"
        trigger: "POST /transload/tracks/{trackId}/disengage-derail"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "Track.version += 1"

  - entity: Railcar
    initial_state: "placement_status=REGISTERED, hold_status=NONE"
    terminal_states: ["placement_status=DEPARTED"]
    transitions:
      - from: REGISTERED
        to: ARRIVED
        trigger: "POST /transload/railcars/{railcarId}/arrive"
        actor: YardMaster
        preconditions: []
        side_effects:
          - "arrival_timestamp = current logical clock"
          - "quantity_remaining_tons = quantity_loaded_tons"
          - "InventoryLot[lot_id].quantity_received_tons += quantity_loaded_tons; recompute lot quantity_on_hand_tons; InventoryLot.version += 1"
          - "Railcar.version += 1"
      - from: ARRIVED
        to: SPOTTED
        trigger: "POST /transload/spot-orders/{spotOrderId}/execute (system via SpotOrder)"
        actor: system
        preconditions:
          - "executed SpotOrder.railcar_id == this car and its status was SCHEDULED"
        side_effects:
          - "track_id = SpotOrder.track_id; spot_number = SpotOrder.spot_number; placed_timestamp = current logical clock"
          - "Track.occupied_spots += 1; Track.reserved_spots -= 1 (Track.version += 1)"
          - "SpotOrder.status SCHEDULED -> EXECUTED"
          - "SwitchOrder[SpotOrder.switch_order_id].status SCHEDULED -> COMPLETED"
          - "Railcar.version += 1"
      - from: SPOTTED
        to: IN_TRANSFER
        trigger: "POST /transload/transfer-orders/{transferOrderId}/activate (system via TransferOrder)"
        actor: system
        preconditions:
          - "hold_status == NONE"
        side_effects:
          - "Railcar.version += 1"
      - from: IN_TRANSFER
        to: SPOTTED
        trigger: "POST /transload/transfer-orders/{transferOrderId}/pause (system via TransferOrder)"
        actor: system
        preconditions: []
        side_effects:
          - "Railcar.version += 1"
        note: "Cycle: SPOTTED -> IN_TRANSFER -> SPOTTED for multi-truck transfers"
      - from: IN_TRANSFER
        to: EMPTY_AWAITING_CLEANING
        trigger: "system (automatic when quantity_remaining_tons reaches exactly 0 after a ticket certification)"
        actor: system
        preconditions:
          - "quantity_remaining_tons == 0"
        side_effects:
          - "Railcar.version += 1"
      - from: EMPTY_AWAITING_CLEANING
        to: READY_FOR_RELEASE
        trigger: "system (automatic at the same instant the car empties, when Product[product_id].requires_full_clean == false)"
        actor: system
        preconditions:
          - "Product.requires_full_clean == false"
        side_effects:
          - "Railcar.version += 1"
      - from: EMPTY_AWAITING_CLEANING
        to: CLEANING
        trigger: "POST /transload/railcars/{railcarId}/start-cleaning"
        actor: TransferOperator
        preconditions:
          - "Product[product_id].requires_full_clean == true"
        side_effects:
          - "create ChargeEntry(CLEANING): customer_id, railcar_id, quantity=1, amount_cents per wash_type (RINSE 250000 | DETERGENT 600000 | STEAM 1200000), status=ACCRUED"
          - "Railcar.version += 1"
      - from: CLEANING
        to: EMPTY_AWAITING_CLEANING
        trigger: "POST /transload/railcars/{railcarId}/fail-cleaning"
        actor: TransferOperator
        preconditions: []
        side_effects:
          - "Railcar.version += 1"
        note: "Re-clean loop: each start-cleaning adds another CLEANING ChargeEntry"
      - from: CLEANING
        to: READY_FOR_RELEASE
        trigger: "POST /transload/railcars/{railcarId}/pass-cleaning"
        actor: TransferOperator
        preconditions: []
        side_effects:
          - "Railcar.version += 1"
      - from: READY_FOR_RELEASE
        to: RELEASED
        trigger: "POST /transload/railcars/{railcarId}/release"
        actor: YardMaster
        preconditions:
          - "hold_status == NONE (ERR_CAR_HELD)"
          - "Facility.safety_posture != SUSPENDED (ERR_FACILITY_SUSPENDED)"
          - "Track[track_id].derail_protection == DISENGAGED (ERR_DERAIL_ENGAGED)"
          - "no Invoice of Customer[customer_id] with status == ISSUED (ERR_UNPAID_CHARGES)"
        side_effects:
          - "released_timestamp = current logical clock; final demurrage computed via demurrage_accrual with end=released_timestamp"
          - "create ChargeEntry(DEMURRAGE): quantity=final billable days, amount_cents=final amount, status=ACCRUED (created even when amount is 0)"
          - "create SwitchOrder(move_type=PULL): window [released_timestamp, released_timestamp + 30 minutes); sequence_number per switching_fee; fee_cents per switching_fee; create ChargeEntry(SWITCHING) for that fee; status=SCHEDULED"
          - "Track.occupied_spots -= 1 (Track.version += 1)"
          - "if the EXECUTED SpotOrder that placed this car is still open: SpotOrder.status EXECUTED -> CLOSED"
          - "Railcar.version += 1"
      - from: RELEASED
        to: DEPARTED
        trigger: "POST /transload/railcars/{railcarId}/depart"
        actor: YardMaster
        preconditions: []
        side_effects:
          - "departed_timestamp = current logical clock"
          - "SwitchOrder of the release PULL move: SCHEDULED -> COMPLETED"
          - "Railcar.version += 1"
      - from: "hold_status=NONE"
        to: "hold_status=SAFETY_HOLD"
        trigger: "POST /transload/railcars/{railcarId}/place-hold"
        actor: SafetyOfficer
        preconditions:
          - "placement_status != DEPARTED"
        side_effects:
          - "Railcar.version += 1"
      - from: "hold_status=SAFETY_HOLD"
        to: "hold_status=NONE"
        trigger: "POST /transload/railcars/{railcarId}/lift-hold"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "Railcar.version += 1"

  - entity: InventoryLot
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /transload/lots/{lotId}/close"
        actor: FacilityAdmin
        preconditions:
          - "quantity_on_hand_tons == 0 (ERR_LOT_NOT_EMPTY)"
          - "no linked Railcar with placement_status NOT IN {RELEASED, DEPARTED} (ERR_LOT_HAS_ACTIVE_CARS)"
        side_effects:
          - "close_timestamp = current logical clock; final SIT computed via sit_accrual with end=close_timestamp"
          - "create ChargeEntry(STORAGE_IN_TRANSIT): customer_id, railcar_id=null, quantity=final billable days, amount_cents=final amount, status=ACCRUED (created even when amount is 0)"
          - "InventoryLot.version += 1"

  - entity: SpotOrder
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED, SUPERSEDED]
    note: "Creation via POST /transload/railcars/{railcarId}/spot-orders requires Railcar.placement_status IN {REGISTERED, ARRIVED, SPOTTED} (else ERR_INVALID_STATE, priority 5, before the OCC check at priority 16); creation supersedes the car's prior REQUESTED/SCHEDULED order and adds the new reservation (Track.reserved_spots += 1)."
    transitions:
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "POST /transload/railcars/{railcarId}/spot-orders (system: a new spot order for the same car supersedes the prior REQUESTED/SCHEDULED one)"
        actor: system
        preconditions: []
        side_effects:
          - "if superseded from SCHEDULED: Track.reserved_spots -= 1 (Track.version += 1)"
          - "linked SwitchOrder (if any) SCHEDULED -> CANCELLED; its SWITCHING ChargeEntry ACCRUED -> VOIDED"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "POST /transload/railcars/{railcarId}/spot-orders (system: supersede)"
        actor: system
        preconditions: []
        side_effects:
          - "Track.reserved_spots -= 1 (Track.version += 1)"
          - "linked SwitchOrder SCHEDULED -> CANCELLED; its SWITCHING ChargeEntry ACCRUED -> VOIDED"
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /transload/spot-orders/{spotOrderId}/schedule"
        actor: YardMaster
        preconditions:
          - "Railcar.placement_status == ARRIVED (ERR_CAR_NOT_ARRIVED)"
          - "Track.status == ACTIVE (ERR_TRACK_OUT_OF_SERVICE)"
          - "Track.derail_protection == DISENGAGED (ERR_DERAIL_ENGAGED)"
          - "Facility.safety_posture != SUSPENDED (ERR_FACILITY_SUSPENDED)"
          - "1 <= spot_number <= Track.spot_capacity (ERR_SPOT_NUMBER_INVALID)"
          - "no other SpotOrder in {REQUESTED, SCHEDULED, EXECUTED} on same track with same spot_number whose [window_start, window_end) overlaps this one (ERR_SPOT_WINDOW_OVERLAP)"
          - "no railcar currently SPOTTED on same track with that spot_number (ERR_SPOT_WINDOW_OVERLAP)"
          - "Track.occupied_spots + Track.reserved_spots (incl. this order) <= Track.spot_capacity (ERR_TRACK_FULL)"
          - "Customer.occupied+reserved across all tracks (incl. this order) <= Customer.allocated_car_spots (ERR_ALLOCATION_EXCEEDED)"
          - "Customer.credit_standing != CREDIT_HOLD (ERR_CREDIT_HOLD)"
          - "no SwitchOrder in SCHEDULED on same track whose window is within switch_buffer_minutes of this window (ERR_SWITCH_WINDOW_CONFLICT)"
        side_effects:
          - "Track.reserved_spots += 1 (Track.version += 1)"
          - "create SwitchOrder(move_type=SPOT) with this window; sequence_number and fee_cents per switching_fee; create ChargeEntry(SWITCHING, status=ACCRUED) for the fee; SpotOrder.switch_order_id set"
          - "SpotOrder.version += 1"
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /transload/spot-orders/{spotOrderId}/execute"
        actor: YardMaster
        preconditions:
          - "Railcar.placement_status == ARRIVED (ERR_CAR_NOT_ARRIVED)"
          - "Track.status == ACTIVE (ERR_TRACK_OUT_OF_SERVICE)"
          - "Track.derail_protection == DISENGAGED (ERR_DERAIL_ENGAGED)"
          - "Facility.safety_posture != SUSPENDED (ERR_FACILITY_SUSPENDED)"
          - "current logical clock within [window_start, window_end) (ERR_WINDOW_NOT_ACTIVE)"
        side_effects:
          - "Railcar ARRIVED -> SPOTTED (see Railcar machine): track_id/spot_number/placed_timestamp set; Track.occupied_spots += 1; Track.reserved_spots -= 1"
          - "SwitchOrder SCHEDULED -> COMPLETED"
          - "SpotOrder.version += 1"
      - from: EXECUTED
        to: CLOSED
        trigger: "system (when the placed railcar is released)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /transload/spot-orders/{spotOrderId}/cancel"
        actor: "YardMaster | CustomerRep (own)"
        preconditions: []
        side_effects:
          - "Track.reserved_spots -= 1 (Track.version += 1)"
          - "SpotOrder.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /transload/spot-orders/{spotOrderId}/cancel"
        actor: "YardMaster | CustomerRep (own)"
        preconditions: []
        side_effects:
          - "Track.reserved_spots -= 1 (Track.version += 1)"
          - "linked SwitchOrder SCHEDULED -> CANCELLED; its SWITCHING ChargeEntry ACCRUED -> VOIDED (compensation)"
          - "SpotOrder.version += 1"

  - entity: SwitchOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (spot-order execute for SPOT moves; railcar depart for PULL moves)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (spot-order cancel or supersede)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TransferOrder
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /transload/transfer-orders/{transferOrderId}/activate"
        actor: TransferOperator
        preconditions:
          - "Railcar.placement_status IN {SPOTTED, IN_TRANSFER} (ERR_CAR_NOT_SPOTTED)"
          - "Railcar.hold_status == NONE (ERR_CAR_HELD)"
          - "Facility.safety_posture != SUSPENDED (ERR_FACILITY_SUSPENDED)"
          - "Facility.safety_posture == ELEVATED and Product.hazard_class == HAZARDOUS -> blocked (ERR_POSTURE_ELEVATED_HAZMAT)"
          - "Equipment.status == AVAILABLE (ERR_EQUIPMENT_NOT_AVAILABLE)"
          - "no other TransferOrder on same railcar_id with status == ACTIVE (ERR_CAR_BUSY)"
          - "no other ACTIVE TransferOrder using same equipment_id (ERR_EQUIPMENT_NOT_AVAILABLE)"
          - "risk_score per contamination_risk_score < 100 (ERR_CONTAMINATION_RISK)"
          - "Customer.credit_standing != CREDIT_HOLD (ERR_CREDIT_HOLD)"
        side_effects:
          - "risk_score computed and stored"
          - "Equipment AVAILABLE -> IN_USE; Equipment.last_product_id := Railcar.product_id (Equipment.version += 1)"
          - "Railcar SPOTTED -> IN_TRANSFER when it was SPOTTED (already IN_TRANSFER on resume)"
          - "TransferOrder.version += 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /transload/transfer-orders/{transferOrderId}/activate"
        actor: TransferOperator
        preconditions:
          - "same gate set as PLANNED -> ACTIVE"
        side_effects:
          - "same side effects as PLANNED -> ACTIVE (cycle resume)"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /transload/transfer-orders/{transferOrderId}/pause"
        actor: TransferOperator
        preconditions: []
        side_effects:
          - "Equipment IN_USE -> AVAILABLE (Equipment.version += 1)"
          - "Railcar IN_TRANSFER -> SPOTTED"
          - "TransferOrder.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (Facility.safety_posture becomes SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Equipment IN_USE -> AVAILABLE (Equipment.version += 1)"
          - "Railcar IN_TRANSFER -> SPOTTED (Railcar.version += 1)"
          - "TransferOrder.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (Facility.safety_posture returns to NORMAL or ELEVATED)"
        actor: system
        preconditions: []
        side_effects:
          - "Equipment AVAILABLE -> IN_USE; Equipment.last_product_id := Railcar.product_id (Equipment.version += 1)"
          - "Railcar SPOTTED -> IN_TRANSFER (Railcar.version += 1)"
          - "TransferOrder.version += 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /transload/transfer-orders/{transferOrderId}/complete OR system (automatic when quantity_completed_tons >= quantity_planned_tons after a certification)"
        actor: "TransferOperator | system"
        preconditions:
          - "manual complete: quantity_completed_tons > 0 (ERR_NOTHING_TO_COMPLETE)"
        side_effects:
          - "Equipment IN_USE -> AVAILABLE (Equipment.version += 1)"
          - "Railcar IN_TRANSFER -> SPOTTED when quantity_remaining_tons > 0, else Railcar -> EMPTY_AWAITING_CLEANING (and on to READY_FOR_RELEASE when Product.requires_full_clean == false)"
          - "TransferOrder.version += 1"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /transload/transfer-orders/{transferOrderId}/complete"
        actor: TransferOperator
        preconditions:
          - "quantity_completed_tons > 0 (ERR_NOTHING_TO_COMPLETE)"
        side_effects:
          - "no equipment release (already AVAILABLE)"
          - "TransferOrder.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /transload/transfer-orders/{transferOrderId}/cancel"
        actor: TransferOperator
        preconditions: []
        side_effects:
          - "TransferOrder.version += 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /transload/transfer-orders/{transferOrderId}/cancel"
        actor: TransferOperator
        preconditions: []
        side_effects:
          - "TransferOrder.version += 1"

  - entity: WeightTicket
    initial_state: DRAFT
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /transload/weight-tickets/{weightTicketId}/certify"
        actor: TransferOperator
        preconditions:
          - "TransferOrder.status == ACTIVE (ERR_INVALID_STATE)"
          - "tare_weight_tons < gross_weight_tons (ERR_SCALE_TOLERANCE)"
          - "net_weight_tons <= truck_max_payload_tons (ERR_PAYLOAD_EXCEEDED)"
          - "quantity_completed_tons + net_weight_tons <= quantity_planned_tons (ERR_OVER_DELIVERY)"
          - "Railcar.quantity_remaining_tons >= net_weight_tons (ERR_OVER_DELIVERY)"
        side_effects:
          - "TransferOrder.quantity_completed_tons += net_weight_tons (TransferOrder.version += 1)"
          - "Railcar.quantity_remaining_tons -= net_weight_tons (Railcar.version += 1)"
          - "InventoryLot.quantity_shipped_tons += net_weight_tons; recompute quantity_on_hand_tons (InventoryLot.version += 1)"
          - "if quantity_completed_tons >= quantity_planned_tons: TransferOrder auto -> COMPLETED with its side effects (equipment release; railcar SPOTTED or EMPTY_AWAITING_CLEANING)"
          - "WeightTicket.version += 1"
      - from: CERTIFIED
        to: VOIDED
        trigger: "POST /transload/weight-tickets/{weightTicketId}/void"
        actor: TransferOperator
        preconditions:
          - "TransferOrder.status IN {ACTIVE, PAUSED} (ERR_INVALID_STATE)"
        side_effects:
          - "TransferOrder.quantity_completed_tons -= net_weight_tons (TransferOrder.version += 1)"
          - "Railcar.quantity_remaining_tons += net_weight_tons (Railcar.version += 1)"
          - "InventoryLot.quantity_shipped_tons -= net_weight_tons; recompute quantity_on_hand_tons (InventoryLot.version += 1)"
          - "WeightTicket.version += 1"
        note: "Compensation: certify+void restores railcar, lot, and order quantities exactly"

  - entity: Equipment
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IN_USE
        trigger: "system (transfer-order activate / suspension-resume)"
        actor: system
        preconditions:
          - "contamination_risk_score < 100 for the incoming product"
        side_effects:
          - "last_product_id := incoming Railcar.product_id"
          - "Equipment.version += 1"
      - from: IN_USE
        to: AVAILABLE
        trigger: "system (transfer-order pause / complete / facility suspension)"
        actor: system
        preconditions: []
        side_effects:
          - "Equipment.version += 1"
        note: "Cycle AVAILABLE -> IN_USE -> AVAILABLE; last_product_id persists as contamination provenance"
      - from: AVAILABLE
        to: CLEANING
        trigger: "POST /transload/equipment/{equipmentId}/start-cleaning"
        actor: TransferOperator
        preconditions: []
        side_effects:
          - "Equipment.version += 1"
      - from: CLEANING
        to: AVAILABLE
        trigger: "POST /transload/equipment/{equipmentId}/finish-cleaning"
        actor: TransferOperator
        preconditions: []
        side_effects:
          - "last_product_id := null"
          - "Equipment.version += 1"

  - entity: SafetyIncident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /transload/incidents/{incidentId}/resolve"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "recompute Facility.safety_posture per safety_posture calculation (Facility.version += 1 if posture changed)"
          - "if posture leaves SUSPENDED: every SUSPENDED TransferOrder -> ACTIVE (each with its resume side effects)"

  - entity: ChargeEntry
    initial_state: ACCRUED
    terminal_states: [INVOICED, VOIDED]
    transitions:
      - from: ACCRUED
        to: INVOICED
        trigger: "system (POST /transload/invoices/{invoiceId}/issue sweeps matching ACCRUED charges)"
        actor: system
        preconditions: []
        side_effects:
          - "invoice_id := issuing Invoice.id"
          - "ChargeEntry.version += 1"
      - from: ACCRUED
        to: VOIDED
        trigger: "POST /transload/charges/{chargeId}/void OR system (spot-order cancel/supersede voids its SWITCHING charge)"
        actor: "BillingClerk | FacilityAdmin | system"
        preconditions: []
        side_effects:
          - "ChargeEntry.version += 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, DISPUTED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /transload/invoices/{invoiceId}/issue"
        actor: "BillingClerk | FacilityAdmin"
        preconditions:
          - "at least one matching ACCRUED charge exists (ERR_INVOICE_EMPTY)"
        side_effects:
          - "sweep per invoice_total: matching ACCRUED charges -> INVOICED with invoice_id set (each ChargeEntry.version += 1)"
          - "charge_count and total_cents computed per invoice_total"
          - "Invoice.version += 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /transload/invoices/{invoiceId}/pay"
        actor: "CustomerRep (own) | BillingClerk"
        preconditions: []
        side_effects:
          - "Invoice.version += 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /transload/invoices/{invoiceId}/dispute"
        actor: "CustomerRep (own)"
        preconditions: []
        side_effects:
          - "Invoice.version += 1"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: spot-order-create-stale-railcar
    parent_entity: Railcar
    write_endpoint: "POST /transload/railcars/{railcarId}/spot-orders"
    occ_field: expected_railcar_version
    description: |
      Creating a SpotOrder against a Railcar whose version has advanced since the
      client last observed it is rejected. A successful create legitimately
      supersedes the car's prior REQUESTED/SCHEDULED spot order, so a writer
      holding a stale view of the railcar must not supersede state it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-adjustment-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /transload/customers/{customerId}/allocation-adjustments"
    occ_field: expected_customer_version
    description: |
      Posting a track-space allocation adjustment against a Customer whose
      version has advanced since the client last observed it is rejected. The
      floor for the new allocation is derived from the customer's current
      occupied+reserved spots, so an adjustment based on a stale view of the
      customer must not apply.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: demurrage_accrual
    trigger: "computed on every Railcar read (provisional, end = current logical clock) and finalized at release (end = released_timestamp), stamping Railcar.demurrage_billable_days / demurrage_accrued_cents and producing the DEMURRAGE ChargeEntry"
    algorithm: tiered_pricing
    formula: |
      start = arrival_timestamp                    if Customer.demurrage_basis == CONSTRUCTIVE
      start = placed_timestamp                     if Customer.demurrage_basis == ACTUAL
      if start is null: billable_days = 0, amount = 0
      end = released_timestamp if set else current logical clock
      elapsed_minutes = floor((end - start) / 60 seconds); clamp at 0
      free_minutes = Facility.free_demurrage_hours * 60
      billable_minutes = max(0, elapsed_minutes - free_minutes)
      billable_days = ceil(billable_minutes / 1440)
      tiered = TIER1_RATE * min(billable_days, TIER1_DAYS)
             + TIER2_RATE * min(max(billable_days - TIER1_DAYS, 0), TIER2_DAYS)
             + TIER3_RATE * max(billable_days - TIER1_DAYS - TIER2_DAYS, 0)
      hazard_mult = 1.5 if Product.hazard_class == HAZARDOUS else 1.0
      credit_mult = 1.0 if credit_standing == GOOD_STANDING
                    else 1.25 if CREDIT_WATCH else 1.5   # CREDIT_HOLD
      amount_cents = round_half_up(tiered * hazard_mult * credit_mult)   # single final rounding to integer cents
    input_set: "the Railcar, its Customer (basis, credit_standing), its Product (hazard_class), Facility.free_demurrage_hours; all placement states ARRIVED and later"
    constants:
      TIER1_DAYS: 3
      TIER1_RATE: 7500
      TIER2_DAYS: 4
      TIER2_RATE: 15000
      TIER3_RATE: 25000
    precision: "integer cents, round_half_up applied once after multipliers"
    variants:
      - name: constructive_basis
        when: "Customer.demurrage_basis == CONSTRUCTIVE"
        difference: "clock starts at arrival_timestamp even if the car waits unspotted"
      - name: actual_basis
        when: "Customer.demurrage_basis == ACTUAL"
        difference: "clock starts at placed_timestamp; while unspotted, accrual is 0"

  - name: sit_accrual
    trigger: "computed on every InventoryLot read (provisional, end = current logical clock) and finalized at lot close (end = close_timestamp), stamping sit_billable_days / sit_accrued_cents and producing the STORAGE_IN_TRANSIT ChargeEntry"
    algorithm: chronological
    formula: |
      window_start = sit_start_timestamp + sit_free_days * 86400 seconds
      end = close_timestamp if set else current logical clock
      whole_days = floor((end - window_start) / 86400); clamp at 0
      # block k (0-based) covers [window_start + k*86400, window_start + (k+1)*86400)
      CALENDAR: billable_days = whole_days
      BUSINESS: billable_days = count of blocks k in [0, whole_days) whose
                starting UTC date (window_start + k*86400) falls Monday..Friday
      amount_cents = billable_days * sit_daily_rate_cents
    input_set: "the InventoryLot (sit_start_timestamp, sit_free_days, sit_day_basis, sit_daily_rate_cents, close_timestamp); logical clock"
    constants: {}
    precision: "integer cents (exact product; no rounding needed)"
    variants:
      - name: calendar_basis
        when: "InventoryLot.sit_day_basis == CALENDAR"
        difference: "every 24h block counts"
      - name: business_basis
        when: "InventoryLot.sit_day_basis == BUSINESS"
        difference: "blocks starting Saturday or Sunday are free"

  - name: contamination_risk_score
    trigger: "TransferOrder activation (PLANNED/PAUSED -> ACTIVE), evaluated against Equipment.last_product_id and the railcar's lading Product"
    algorithm: weighted_scoring
    formula: |
      if Equipment.last_product_id is null: risk_score = 0
      else let P = Product[Equipment.last_product_id], N = railcar lading Product:
        group_mismatch = 1 if P.segregation_group != N.segregation_group else 0
        hazard_escalation = 1 if (P.hazard_class == HAZARDOUS or N.hazard_class == HAZARDOUS)
                                 and not (P.hazard_class == HAZARDOUS and N.hazard_class == HAZARDOUS) else 0
        food_involved = 1 if N.hazard_class == FOOD_GRADE or P.hazard_class == FOOD_GRADE else 0
      STRICT_MATRIX variant: risk_score = 100 if group_mismatch == 1 else 0
      WEIGHTED_SCORE variant: risk_score = 60 * group_mismatch + 25 * hazard_escalation + 15 * food_involved
      activation allowed iff risk_score < BLOCK_THRESHOLD
    input_set: "Equipment.last_product_id (null after finish-cleaning), both Products; Facility.contamination_policy selects the variant"
    constants:
      BLOCK_THRESHOLD: 100
    precision: "integer score 0..100"
    variants:
      - name: strict_matrix
        when: "Facility.contamination_policy == STRICT_MATRIX"
        difference: "any segregation-group mismatch is a hard block (score 100)"
      - name: weighted_score
        when: "Facility.contamination_policy == WEIGHTED_SCORE"
        difference: "weighted sum; e.g. CHEMICAL->PETROLEUM (non-food, non-haz) scores 60 and is allowed"

  - name: switching_fee
    trigger: "SwitchOrder creation (spot-order schedule creates the SPOT move; railcar release creates the PULL move)"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned to break the count/fee circularity:
      # 1) prior = count of existing SwitchOrders (any status incl. CANCELLED)
      #    with same customer_id and window_start in the same UTC calendar month
      # 2) sequence_number = prior + 1
      # 3) fee_cents = 0 if sequence_number <= Facility.free_switches_per_period
      #    else BASE_SPOT_FEE (move_type SPOT) or BASE_PULL_FEE (move_type PULL)
      # The move being priced never counts toward its own prior count.
    input_set: "all SwitchOrders of the customer in the UTC month of window_start; Facility.free_switches_per_period"
    constants:
      BASE_SPOT_FEE: 18500
      BASE_PULL_FEE: 20500
    precision: "integer cents"

  - name: cleaning_fee
    trigger: "railcar start-cleaning (each attempt, including re-cleans after fail-cleaning)"
    algorithm: threshold
    formula: |
      amount_cents = RINSE_FEE if wash_type == RINSE
                     else DETERGENT_FEE if wash_type == DETERGENT
                     else STEAM_FEE   # STEAM
      quantity = 1 attempt; unit_rate_cents = amount_cents
    input_set: "wash_type of the start-cleaning call"
    constants:
      RINSE_FEE: 250000
      DETERGENT_FEE: 600000
      STEAM_FEE: 1200000
    precision: "integer cents"

  - name: invoice_total
    trigger: "POST /transload/invoices/{invoiceId}/issue"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: each ChargeEntry.amount_cents is already
      # rounded to integer cents at line level (see demurrage_accrual /
      # cleaning_fee / switching_fee); the invoice NEVER re-rounds a sum of
      # unrounded values. total = sum of line amounts.
      eligible = ChargeEntry where customer_id == Invoice.customer_id
                 and status == ACCRUED
                 and period_start <= created_at <= period_end
      if eligible is empty: reject ERR_INVOICE_EMPTY
      total_cents = sum(amount_cents over eligible)   # integer sum of integers
      charge_count = count(eligible)
      every eligible charge: status -> INVOICED, invoice_id = this invoice
    input_set: "ACCRUED ChargeEntries of the customer created within [period_start, period_end] inclusive on both bounds"
    constants: {}
    precision: "integer cents; line-level rounding only (round-per-line then sum)"

  - name: safety_posture
    trigger: "SafetyIncident creation and resolution (recomputed for the singleton Facility)"
    algorithm: threshold
    formula: |
      open = SafetyIncidents with status == OPEN
      if any open.severity == CRITICAL or count(open) >= 3: posture = SUSPENDED
      else if count(open) >= 1: posture = ELEVATED
      else: posture = NORMAL
      Facility.open_incident_count = count(open)
      # boundary: exactly 1 CRITICAL -> SUSPENDED; exactly 3 MINOR/MAJOR -> SUSPENDED; 2 -> ELEVATED
      # cascade on entering SUSPENDED: every ACTIVE TransferOrder -> SUSPENDED,
      #   each releasing its Equipment (IN_USE -> AVAILABLE) and pausing its
      #   Railcar (IN_TRANSFER -> SPOTTED)
      # cascade on leaving SUSPENDED: every SUSPENDED TransferOrder -> ACTIVE,
      #   each re-acquiring its Equipment and resuming its Railcar
    input_set: "all SafetyIncidents (singleton facility scope)"
    constants:
      SUSPEND_INCIDENT_COUNT: 3
    precision: "enum posture"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles (endpoint authorization)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids resolve, validated left-to-right; body FK ids resolve (railcar_id, lot_id, customer_id, product_id, equipment_id, track_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "Envelope/shape: required fields present, types valid, enum members valid, numeric ranges valid (> 0 where required), window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: state
    check: "Entity is in a from-state that lists this trigger (spot order SCHEDULED for execute, ticket DRAFT for certify, car READY_FOR_RELEASE for release, lot ACTIVE for close, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "Ownership: CustomerRep may read/act only on resources of their own customer record (X-User-ID == Customer.id of the resource's customer chain)"
    error_id: ERR_RESOURCE_NOT_OWNED
    http_status: 403
    applies_to: "GET /transload/railcars, GET /transload/spot-orders, GET /transload/transfer-orders, GET /transload/weight-tickets, GET /transload/charges, GET /transload/invoices, GET single-entity variants of those, POST spot-order create/cancel, POST invoice pay/dispute"
  - priority: 7
    category: business_safety
    check: "Facility posture and derail gates: SUSPENDED blocks spot schedule/execute, transfer activate, railcar release; ELEVATED blocks HAZARDOUS transfer activation; derail ENGAGED blocks schedule/execute/release on that track"
    error_id: "ERR_FACILITY_SUSPENDED | ERR_POSTURE_ELEVATED_HAZMAT | ERR_DERAIL_ENGAGED"
    http_status: 409
    applies_to: "spot schedule/execute, transfer activate, railcar release"
  - priority: 8
    category: business_safety
    check: "Car-level safety: hold_status must be NONE for transfer activation and release"
    error_id: ERR_CAR_HELD
    http_status: 409
    applies_to: "transfer activate, railcar release"
  - priority: 9
    category: business_safety
    check: "Contamination: risk_score per contamination_risk_score must be < 100 (clean equipment or compatible segregation group)"
    error_id: ERR_CONTAMINATION_RISK
    http_status: 409
    applies_to: "transfer activate"
  - priority: 10
    category: business_constraint
    check: "Track/window constraints: spot_number range, half-open window overlap per spot, track capacity, crew buffer window conflicts, car arrived"
    error_id: "ERR_SPOT_NUMBER_INVALID | ERR_SPOT_WINDOW_OVERLAP | ERR_TRACK_FULL | ERR_SWITCH_WINDOW_CONFLICT | ERR_CAR_NOT_ARRIVED | ERR_WINDOW_NOT_ACTIVE"
    http_status: 409
    applies_to: "spot schedule/execute"
  - priority: 11
    category: business_constraint
    check: "Equipment/scale constraints: equipment AVAILABLE and not double-booked; car not already under another ACTIVE transfer; tare < gross; payload/over-delivery/lot sufficiency on certify; lot close preconditions"
    error_id: "ERR_EQUIPMENT_NOT_AVAILABLE | ERR_CAR_BUSY | ERR_SCALE_TOLERANCE | ERR_PAYLOAD_EXCEEDED | ERR_OVER_DELIVERY | ERR_LOT_NOT_EMPTY | ERR_LOT_HAS_ACTIVE_CARS | ERR_NOTHING_TO_COMPLETE"
    http_status: 409
    applies_to: "transfer activate/complete, ticket certify, lot close"
  - priority: 12
    category: business_fiscal
    check: "Credit hold blocks new spot-order scheduling and transfer activation"
    error_id: ERR_CREDIT_HOLD
    http_status: 409
    applies_to: "spot schedule, transfer activate"
  - priority: 13
    category: business_fiscal
    check: "No ISSUED (unpaid) invoice on the customer when releasing a railcar"
    error_id: ERR_UNPAID_CHARGES
    http_status: 402
    applies_to: "railcar release"
  - priority: 14
    category: business_fiscal
    check: "Invoice issue requires >= 1 matching ACCRUED charge"
    error_id: ERR_INVOICE_EMPTY
    http_status: 409
    applies_to: "invoice issue"
  - priority: 15
    category: business_fiscal
    check: "Allocation: scheduled occupied+reserved must fit allocated_car_spots; new allocation must be >= current occupied+reserved floor"
    error_id: "ERR_ALLOCATION_EXCEEDED | ERR_ALLOCATION_BELOW_FLOOR"
    http_status: 409
    applies_to: "spot schedule, allocation-adjustments"
  - priority: 16
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version (evaluated with the mutation, after the checks above)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /transload/railcars/{railcarId}/spot-orders, POST /transload/customers/{customerId}/allocation-adjustments"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Facility / config ---
  - { method: POST, path: "/transload/facilities", description: "Create facility (config + posture root)", roles: [FacilityAdmin], code: 201, input: [name, "free_demurrage_hours?", "sit_free_days?", "switch_buffer_minutes?", "free_switches_per_period?", "contamination_policy?"], output: Facility, side_effects: ["posture=NORMAL, open_incident_count=0"] }
  - { method: GET, path: "/transload/facilities/{facilityId}", description: "Get facility incl. computed posture", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: Facility, side_effects: [] }
  - { method: PATCH, path: "/transload/facilities/{facilityId}", description: "Update facility config (contamination_policy, free_demurrage_hours, sit_free_days, switch_buffer_minutes, free_switches_per_period)", roles: [FacilityAdmin], code: 200, input: ["free_demurrage_hours?", "sit_free_days?", "switch_buffer_minutes?", "free_switches_per_period?", "contamination_policy?"], output: Facility, side_effects: ["Facility.version += 1"] }
  # --- Customer ---
  - { method: POST, path: "/transload/customers", description: "Create customer", roles: [FacilityAdmin], code: 201, input: [name, allocated_car_spots, "credit_standing?", "demurrage_basis?", "sit_day_basis?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/transload/customers/{customerId}", description: "Get customer", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: PATCH, path: "/transload/customers/{customerId}", description: "Update credit_standing / demurrage_basis / sit_day_basis", roles: [FacilityAdmin], code: 200, input: ["credit_standing?", "demurrage_basis?", "sit_day_basis?"], output: Customer, side_effects: ["Customer.version += 1"] }
  - { method: POST, path: "/transload/customers/{customerId}/allocation-adjustments", description: "OCC track-space allocation adjustment (supersedes prior allocation)", roles: [FacilityAdmin], code: 201, input: [expected_customer_version, new_allocated_car_spots], output: Customer, side_effects: ["allocated_car_spots := new_allocated_car_spots", "Customer.version += 1", "floor check per v15"] }
  # --- Product ---
  - { method: POST, path: "/transload/products", description: "Create product", roles: [FacilityAdmin], code: 201, input: [name, hazard_class, segregation_group, requires_full_clean], output: Product, side_effects: [] }
  - { method: GET, path: "/transload/products/{productId}", description: "Get product", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: Product, side_effects: [] }
  # --- Track ---
  - { method: POST, path: "/transload/tracks", description: "Create track", roles: [FacilityAdmin], code: 201, input: [name, spot_capacity], output: Track, side_effects: ["status=ACTIVE, derail_protection=DISENGAGED, occupied=0, reserved=0"] }
  - { method: GET, path: "/transload/tracks/{trackId}", description: "Get track", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: Track, side_effects: [] }
  - { method: POST, path: "/transload/tracks/{trackId}/take-out-of-service", description: "Track ACTIVE -> OUT_OF_SERVICE", roles: [YardMaster], code: 200, input: [], output: Track, side_effects: ["Track.version += 1"] }
  - { method: POST, path: "/transload/tracks/{trackId}/restore-service", description: "Track OUT_OF_SERVICE -> ACTIVE", roles: [YardMaster], code: 200, input: [], output: Track, side_effects: ["Track.version += 1"] }
  - { method: POST, path: "/transload/tracks/{trackId}/engage-derail", description: "Derail protection DISENGAGED -> ENGAGED", roles: [SafetyOfficer], code: 200, input: [], output: Track, side_effects: ["Track.version += 1"] }
  - { method: POST, path: "/transload/tracks/{trackId}/disengage-derail", description: "Derail protection ENGAGED -> DISENGAGED", roles: [SafetyOfficer], code: 200, input: [], output: Track, side_effects: ["Track.version += 1"] }
  # --- Equipment ---
  - { method: POST, path: "/transload/equipment", description: "Create equipment", roles: [FacilityAdmin], code: 201, input: [name, equipment_type], output: Equipment, side_effects: ["status=AVAILABLE, last_product_id=null"] }
  - { method: GET, path: "/transload/equipment/{equipmentId}", description: "Get equipment", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: Equipment, side_effects: [] }
  - { method: GET, path: "/transload/equipment", description: "List equipment (contamination audit: filter by last_product_id)", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["last_product_id?", "status?", "limit?", "offset?"], output: "Equipment[]", side_effects: [] }
  - { method: POST, path: "/transload/equipment/{equipmentId}/start-cleaning", description: "Equipment AVAILABLE -> CLEANING", roles: [TransferOperator], code: 200, input: [], output: Equipment, side_effects: ["Equipment.version += 1"] }
  - { method: POST, path: "/transload/equipment/{equipmentId}/finish-cleaning", description: "Equipment CLEANING -> AVAILABLE, clears last_product_id", roles: [TransferOperator], code: 200, input: [], output: Equipment, side_effects: ["last_product_id := null", "Equipment.version += 1"] }
  # --- SafetyIncident ---
  - { method: POST, path: "/transload/incidents", description: "Report safety incident; recomputes facility posture and cascades on SUSPENDED", roles: [SafetyOfficer], code: 201, input: [severity, description], output: SafetyIncident, side_effects: ["safety_posture recompute", "if SUSPENDED: suspend ACTIVE transfer orders (equipment release + railcar pause)"] }
  - { method: GET, path: "/transload/incidents/{incidentId}", description: "Get incident", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: SafetyIncident, side_effects: [] }
  - { method: POST, path: "/transload/incidents/{incidentId}/resolve", description: "Incident OPEN -> RESOLVED; posture recompute; resume SUSPENDED transfers when posture leaves SUSPENDED", roles: [SafetyOfficer], code: 200, input: [], output: SafetyIncident, side_effects: ["safety_posture recompute", "resume cascade"] }
  # --- Railcar ---
  - { method: POST, path: "/transload/railcars", description: "Register inbound railcar (advance consist)", roles: [YardMaster], code: 201, input: [customer_id, product_id, lot_id, car_initials, car_number, quantity_loaded_tons], output: Railcar, side_effects: ["placement_status=REGISTERED, hold_status=NONE; lot must belong to customer and share product (referential)"] }
  - { method: GET, path: "/transload/railcars/{railcarId}", description: "Get railcar incl. provisional demurrage fields", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: Railcar, side_effects: [] }
  - { method: GET, path: "/transload/railcars", description: "List railcars with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["customer_id?", "product_id?", "lot_id?", "track_id?", "placement_status?", "limit?", "offset?"], output: "Railcar[]", side_effects: [] }
  - { method: POST, path: "/transload/railcars/{railcarId}/arrive", description: "REGISTERED -> ARRIVED; stamps arrival, loads lot received", roles: [YardMaster], code: 200, input: [], output: Railcar, side_effects: ["arrival_timestamp=clock", "quantity_remaining=quantity_loaded", "lot received += loaded"] }
  - { method: POST, path: "/transload/railcars/{railcarId}/depart", description: "RELEASED -> DEPARTED; completes PULL switch order", roles: [YardMaster], code: 200, input: [], output: Railcar, side_effects: ["departed_timestamp=clock", "PULL SwitchOrder -> COMPLETED"] }
  - { method: POST, path: "/transload/railcars/{railcarId}/place-hold", description: "hold_status NONE -> SAFETY_HOLD", roles: [SafetyOfficer], code: 200, input: [reason], output: Railcar, side_effects: ["Railcar.version += 1"] }
  - { method: POST, path: "/transload/railcars/{railcarId}/lift-hold", description: "hold_status SAFETY_HOLD -> NONE", roles: [SafetyOfficer], code: 200, input: [], output: Railcar, side_effects: ["Railcar.version += 1"] }
  - { method: POST, path: "/transload/railcars/{railcarId}/start-cleaning", description: "EMPTY_AWAITING_CLEANING -> CLEANING; adds CLEANING ChargeEntry per wash_type", roles: [TransferOperator], code: 200, input: [wash_type], output: Railcar, side_effects: ["ChargeEntry(CLEANING) ACCRUED", "Railcar.version += 1"] }
  - { method: POST, path: "/transload/railcars/{railcarId}/pass-cleaning", description: "CLEANING -> READY_FOR_RELEASE", roles: [TransferOperator], code: 200, input: [], output: Railcar, side_effects: ["Railcar.version += 1"] }
  - { method: POST, path: "/transload/railcars/{railcarId}/fail-cleaning", description: "CLEANING -> EMPTY_AWAITING_CLEANING (re-clean loop; charge stands)", roles: [TransferOperator], code: 200, input: [], output: Railcar, side_effects: ["Railcar.version += 1"] }
  - { method: POST, path: "/transload/railcars/{railcarId}/release", description: "READY_FOR_RELEASE -> RELEASED; final demurrage charge, PULL switch + fee, frees spot", roles: [YardMaster], code: 200, input: [], output: Railcar, side_effects: ["released_timestamp=clock", "ChargeEntry(DEMURRAGE)", "SwitchOrder(PULL)+ChargeEntry(SWITCHING)", "Track.occupied_spots -= 1", "placing SpotOrder EXECUTED -> CLOSED"] }
  # --- InventoryLot ---
  - { method: POST, path: "/transload/lots", description: "Create SIT inventory lot; stamps sit_free_days from facility and sit_day_basis from customer", roles: [FacilityAdmin], code: 201, input: [customer_id, product_id, sit_daily_rate_cents, "sit_free_days?"], output: InventoryLot, side_effects: ["sit_start_timestamp=clock", "status=ACTIVE"] }
  - { method: GET, path: "/transload/lots/{lotId}", description: "Get lot incl. provisional SIT fields", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: InventoryLot, side_effects: [] }
  - { method: GET, path: "/transload/lots", description: "List lots with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["customer_id?", "product_id?", "status?", "limit?", "offset?"], output: "InventoryLot[]", side_effects: [] }
  - { method: POST, path: "/transload/lots/{lotId}/close", description: "ACTIVE -> CLOSED; final SIT charge", roles: [FacilityAdmin], code: 200, input: [], output: InventoryLot, side_effects: ["close_timestamp=clock", "ChargeEntry(STORAGE_IN_TRANSIT)"] }
  # --- SpotOrder ---
  - { method: POST, path: "/transload/railcars/{railcarId}/spot-orders", description: "Create spot order for car (OCC on expected_railcar_version); supersedes prior REQUESTED/SCHEDULED spot order of the car", roles: [YardMaster, CustomerRep], code: 201, input: [expected_railcar_version, track_id, spot_number, window_start, window_end], output: SpotOrder, side_effects: ["prior REQUESTED/SCHEDULED spot order -> SUPERSEDED (releases reservation, cancels its switch order, voids its switch charge)", "Track.reserved_spots += 1", "Railcar.version += 1"] }
  - { method: GET, path: "/transload/spot-orders/{spotOrderId}", description: "Get spot order", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: SpotOrder, side_effects: [] }
  - { method: GET, path: "/transload/spot-orders", description: "List spot orders with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["railcar_id?", "track_id?", "switch_order_id?", "status?", "limit?", "offset?"], output: "SpotOrder[]", side_effects: [] }
  - { method: POST, path: "/transload/spot-orders/{spotOrderId}/schedule", description: "REQUESTED -> SCHEDULED; full gate set; creates SPOT SwitchOrder + SWITCHING charge", roles: [YardMaster], code: 200, input: [], output: SpotOrder, side_effects: ["SwitchOrder(SPOT) SCHEDULED", "ChargeEntry(SWITCHING) ACCRUED", "Track.reserved_spots already counted at create"] }
  - { method: POST, path: "/transload/spot-orders/{spotOrderId}/execute", description: "SCHEDULED -> EXECUTED; places car (ARRIVED -> SPOTTED)", roles: [YardMaster], code: 200, input: [], output: SpotOrder, side_effects: ["Railcar SPOTTED: track_id/spot_number/placed_timestamp", "Track.occupied += 1, reserved -= 1", "SwitchOrder -> COMPLETED"] }
  - { method: POST, path: "/transload/spot-orders/{spotOrderId}/cancel", description: "REQUESTED/SCHEDULED -> CANCELLED; releases reservation; voids switch charge (compensation)", roles: [YardMaster, CustomerRep], code: 200, input: [], output: SpotOrder, side_effects: ["Track.reserved_spots -= 1", "SwitchOrder SCHEDULED -> CANCELLED", "SWITCHING ChargeEntry ACCRUED -> VOIDED"] }
  # --- SwitchOrder ---
  - { method: GET, path: "/transload/switch-orders/{switchOrderId}", description: "Get switch order", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: SwitchOrder, side_effects: [] }
  - { method: GET, path: "/transload/switch-orders", description: "List switch orders with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["track_id?", "railcar_id?", "customer_id?", "status?", "limit?", "offset?"], output: "SwitchOrder[]", side_effects: [] }
  # --- TransferOrder ---
  - { method: POST, path: "/transload/transfer-orders", description: "Create transfer order for a spotted/held-eligible car", roles: [TransferOperator], code: 201, input: [railcar_id, equipment_id, quantity_planned_tons], output: TransferOrder, side_effects: ["status=PLANNED, quantity_completed_tons=0"] }
  - { method: GET, path: "/transload/transfer-orders/{transferOrderId}", description: "Get transfer order", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: TransferOrder, side_effects: [] }
  - { method: GET, path: "/transload/transfer-orders", description: "List transfer orders with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["railcar_id?", "equipment_id?", "status?", "limit?", "offset?"], output: "TransferOrder[]", side_effects: [] }
  - { method: POST, path: "/transload/transfer-orders/{transferOrderId}/activate", description: "PLANNED/PAUSED -> ACTIVE; posture, hold, equipment, contamination, credit gates; computes risk_score", roles: [TransferOperator], code: 200, input: [], output: TransferOrder, side_effects: ["risk_score computed", "Equipment AVAILABLE -> IN_USE, last_product_id := lading product", "Railcar SPOTTED -> IN_TRANSFER"] }
  - { method: POST, path: "/transload/transfer-orders/{transferOrderId}/pause", description: "ACTIVE -> PAUSED; releases equipment, returns car to SPOTTED", roles: [TransferOperator], code: 200, input: [], output: TransferOrder, side_effects: ["Equipment IN_USE -> AVAILABLE", "Railcar IN_TRANSFER -> SPOTTED"] }
  - { method: POST, path: "/transload/transfer-orders/{transferOrderId}/complete", description: "ACTIVE/PAUSED -> COMPLETED (short close); equipment release; car to SPOTTED or EMPTY_AWAITING_CLEANING", roles: [TransferOperator], code: 200, input: [], output: TransferOrder, side_effects: ["equipment release if ACTIVE", "railcar placement transition per remaining quantity"] }
  - { method: POST, path: "/transload/transfer-orders/{transferOrderId}/cancel", description: "PLANNED/PAUSED -> CANCELLED", roles: [TransferOperator], code: 200, input: [], output: TransferOrder, side_effects: [] }
  # --- WeightTicket ---
  - { method: POST, path: "/transload/transfer-orders/{transferOrderId}/weight-tickets", description: "Create DRAFT weight ticket under a transfer order", roles: [TransferOperator], code: 201, input: [truck_reference, gross_weight_tons, tare_weight_tons, truck_max_payload_tons], output: WeightTicket, side_effects: ["net_weight_tons computed", "railcar_id denormalized from transfer order"] }
  - { method: GET, path: "/transload/weight-tickets/{weightTicketId}", description: "Get weight ticket", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: WeightTicket, side_effects: [] }
  - { method: GET, path: "/transload/weight-tickets", description: "List weight tickets with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["transfer_order_id?", "railcar_id?", "status?", "limit?", "offset?"], output: "WeightTicket[]", side_effects: [] }
  - { method: POST, path: "/transload/weight-tickets/{weightTicketId}/certify", description: "DRAFT -> CERTIFIED; scale/payload/over-delivery/lot gates; decrements railcar and lot quantities; may auto-complete the transfer order", roles: [TransferOperator], code: 200, input: [], output: WeightTicket, side_effects: ["order/lot/railcar quantity updates", "auto-complete cascade at planned quantity", "car empty cascade at remaining 0"] }
  - { method: POST, path: "/transload/weight-tickets/{weightTicketId}/void", description: "CERTIFIED -> VOIDED while order ACTIVE/PAUSED; reverses all quantity effects", roles: [TransferOperator], code: 200, input: [], output: WeightTicket, side_effects: ["compensation of certify effects"] }
  # --- ChargeEntry ---
  - { method: GET, path: "/transload/charges/{chargeId}", description: "Get charge entry", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: ChargeEntry, side_effects: [] }
  - { method: GET, path: "/transload/charges", description: "List charge entries with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["customer_id?", "railcar_id?", "invoice_id?", "charge_type?", "status?", "limit?", "offset?"], output: "ChargeEntry[]", side_effects: [] }
  - { method: POST, path: "/transload/charges/{chargeId}/void", description: "ACCRUED -> VOIDED (billing correction)", roles: [BillingClerk, FacilityAdmin], code: 200, input: [], output: ChargeEntry, side_effects: ["ChargeEntry.version += 1"] }
  # --- Invoice ---
  - { method: POST, path: "/transload/invoices", description: "Create DRAFT invoice for a customer and period", roles: [BillingClerk, FacilityAdmin], code: 201, input: [customer_id, period_start, period_end], output: Invoice, side_effects: ["status=DRAFT, charge_count=0, total_cents=0"] }
  - { method: GET, path: "/transload/invoices/{invoiceId}", description: "Get invoice", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/transload/invoices", description: "List invoices with filters", roles: [FacilityAdmin, YardMaster, SafetyOfficer, TransferOperator, BillingClerk, CustomerRep], code: 200, input: ["customer_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/transload/invoices/{invoiceId}/issue", description: "DRAFT -> ISSUED; sweeps matching ACCRUED charges, computes total per invoice_total", roles: [BillingClerk, FacilityAdmin], code: 200, input: [], output: Invoice, side_effects: ["charges ACCRUED -> INVOICED", "charge_count/total_cents set"] }
  - { method: POST, path: "/transload/invoices/{invoiceId}/pay", description: "ISSUED -> PAID", roles: [CustomerRep, BillingClerk], code: 200, input: [], output: Invoice, side_effects: ["Invoice.version += 1"] }
  - { method: POST, path: "/transload/invoices/{invoiceId}/dispute", description: "ISSUED -> DISPUTED (terminal)", roles: [CustomerRep], code: 200, input: [], output: Invoice, side_effects: ["Invoice.version += 1"] }
  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [FacilityAdmin], code: 200, input: [to_iso8601], output: { current_utc: "datetime" }, side_effects: ["all subsequent timestamp stamps and provisional computations use this clock"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body referenced id does not exist (left-to-right path order)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, bad enum member, non-positive number, or window_end <= window_start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a from-state that lists this trigger (incl. acting on terminal states)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "CustomerRep acting on a resource of a different customer" }
  - { id: ERR_FACILITY_SUSPENDED, http: 409, condition: "Facility safety_posture == SUSPENDED blocks spot schedule/execute, transfer activate, release" }
  - { id: ERR_POSTURE_ELEVATED_HAZMAT, http: 409, condition: "Facility ELEVATED blocks activation of transfers for HAZARDOUS product" }
  - { id: ERR_DERAIL_ENGAGED, http: 409, condition: "Track derail_protection ENGAGED blocks schedule/execute/release involving that track" }
  - { id: ERR_TRACK_OUT_OF_SERVICE, http: 409, condition: "Track status OUT_OF_SERVICE blocks schedule/execute" }
  - { id: ERR_TRACK_OCCUPIED, http: 409, condition: "take-out-of-service while occupied_spots > 0" }
  - { id: ERR_TRACK_FULL, http: 409, condition: "occupied_spots + reserved_spots >= spot_capacity at schedule" }
  - { id: ERR_SPOT_NUMBER_INVALID, http: 409, condition: "spot_number outside 1..track.spot_capacity" }
  - { id: ERR_SPOT_WINDOW_OVERLAP, http: 409, condition: "Half-open window overlap on the same track+spot_number, or spot physically occupied" }
  - { id: ERR_SWITCH_WINDOW_CONFLICT, http: 409, condition: "Crew move window within switch_buffer_minutes of another SCHEDULED SwitchOrder on the same track" }
  - { id: ERR_CAR_NOT_ARRIVED, http: 409, condition: "Spot schedule/execute requires railcar placement_status == ARRIVED" }
  - { id: ERR_WINDOW_NOT_ACTIVE, http: 409, condition: "Execute outside [window_start, window_end) at current logical clock" }
  - { id: ERR_CAR_NOT_SPOTTED, http: 409, condition: "Transfer activate requires placement_status IN {SPOTTED, IN_TRANSFER}" }
  - { id: ERR_CAR_BUSY, http: 409, condition: "Another TransferOrder already ACTIVE on the same railcar" }
  - { id: ERR_CAR_HELD, http: 409, condition: "hold_status == SAFETY_HOLD blocks transfer activation and release" }
  - { id: ERR_CONTAMINATION_RISK, http: 409, condition: "contamination_risk_score >= 100 for equipment last product vs incoming lading" }
  - { id: ERR_EQUIPMENT_NOT_AVAILABLE, http: 409, condition: "Equipment not AVAILABLE (IN_USE/CLEANING) or already bound to another ACTIVE transfer" }
  - { id: ERR_SCALE_TOLERANCE, http: 409, condition: "tare_weight_tons >= gross_weight_tons at certify" }
  - { id: ERR_PAYLOAD_EXCEEDED, http: 409, condition: "net_weight_tons > truck_max_payload_tons at certify" }
  - { id: ERR_OVER_DELIVERY, http: 409, condition: "Certification would exceed quantity_planned_tons or the car's quantity_remaining_tons" }
  - { id: ERR_NOTHING_TO_COMPLETE, http: 409, condition: "Manual complete with quantity_completed_tons == 0" }
  - { id: ERR_CREDIT_HOLD, http: 409, condition: "Customer credit_standing == CREDIT_HOLD blocks spot scheduling and transfer activation" }
  - { id: ERR_UNPAID_CHARGES, http: 402, condition: "Customer has an ISSUED (unpaid) invoice when release is attempted" }
  - { id: ERR_INVOICE_EMPTY, http: 409, condition: "Issue with zero matching ACCRUED charges in period" }
  - { id: ERR_ALLOCATION_EXCEEDED, http: 409, condition: "Schedule would push customer's occupied+reserved spots above allocated_car_spots" }
  - { id: ERR_ALLOCATION_BELOW_FLOOR, http: 409, condition: "new_allocated_car_spots below current occupied+reserved floor" }
  - { id: ERR_LOT_NOT_EMPTY, http: 409, condition: "Lot close with quantity_on_hand_tons > 0" }
  - { id: ERR_LOT_HAS_ACTIVE_CARS, http: 409, condition: "Lot close while a linked railcar is not yet RELEASED/DEPARTED" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "Facility administrator: owns configuration, master data (customers, products, tracks, equipment), lots, allocation adjustments, billing oversight, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /transload/facilities*"
      - "POST /transload/customers, PATCH /transload/customers/{id}"
      - "POST /transload/customers/{id}/allocation-adjustments"
      - "POST /transload/products, POST /transload/tracks, POST /transload/equipment"
      - "POST /transload/lots, POST /transload/lots/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /transload/charges/{id}/void (with BillingClerk)"
      - "POST /transload/invoices, POST /transload/invoices/{id}/issue (with BillingClerk)"
  - name: YardMaster
    description: "Rail yard operations: railcar registry, arrivals/departures, spot scheduling and execution, releases, track service status"
    identity: opaque
    exclusive_operations:
      - "POST /transload/railcars and railcar lifecycle: arrive, depart, release"
      - "POST /transload/tracks/{id}/take-out-of-service, restore-service"
      - "POST /transload/spot-orders/{id}/schedule and /execute"
    shared_operations:
      - "All GET endpoints"
      - "POST /transload/railcars/{id}/spot-orders, POST /transload/spot-orders/{id}/cancel (with CustomerRep)"
  - name: SafetyOfficer
    description: "Plant safety: incidents, railcar safety holds, derail protection devices"
    identity: opaque
    exclusive_operations:
      - "POST /transload/incidents, POST /transload/incidents/{id}/resolve"
      - "POST /transload/railcars/{id}/place-hold, lift-hold"
      - "POST /transload/tracks/{id}/engage-derail, disengage-derail"
    shared_operations:
      - "All GET endpoints"
  - name: TransferOperator
    description: "Product transfer operations: transfer orders, weight tickets, equipment and car cleaning"
    identity: opaque
    exclusive_operations:
      - "POST /transload/transfer-orders and transfer-order actions (activate, pause, complete, cancel)"
      - "POST weight-tickets (create, certify, void)"
      - "POST /transload/equipment/{id}/start-cleaning, finish-cleaning"
      - "POST /transload/railcars/{id}/start-cleaning, pass-cleaning, fail-cleaning"
    shared_operations:
      - "All GET endpoints"
  - name: BillingClerk
    description: "Billing: invoices and charge corrections"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /transload/invoices, POST /transload/invoices/{id}/issue (with FacilityAdmin)"
      - "POST /transload/charges/{id}/void (with FacilityAdmin)"
      - "POST /transload/invoices/{id}/pay (with CustomerRep)"
  - name: CustomerRep
    description: "Customer representative (entity-backed by Customer): views own railcars/lots/charges/invoices, requests spot orders, pays or disputes own invoices"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /transload/invoices/{id}/dispute"
    shared_operations:
      - "GET endpoints scoped to own customer (ERR_RESOURCE_NOT_OWNED otherwise)"
      - "POST /transload/railcars/{id}/spot-orders, POST /transload/spot-orders/{id}/cancel (with YardMaster; own car only)"
      - "POST /transload/invoices/{id}/pay (with BillingClerk; own invoice only)"
