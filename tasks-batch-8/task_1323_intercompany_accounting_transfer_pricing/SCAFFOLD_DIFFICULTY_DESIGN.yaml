# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1323 intercompany transfer pricing
# 9 rules x 2 instances. All numeric asserts pre-computed from §1.3 formulas.
# Shared fixture math:
#   study comparables [300,400,500,600,700] -> nearest-rank p25=400 med=500 p75=600
#   agreement markup 200bp; txs cost/booked: (1_000_000, 1_020_000) + (2_000_000, 2_040_000)
#     S_cost=3_000_000  S_booked=3_060_000  margin = 60_000*10000/3_000_000 = 200bp
#     TO_MEDIAN:  target 3_000_000*1.05 = 3_150_000 -> true_up = 90_000
#     TO_RANGE_EDGE: nearest edge to 200 is 400 -> 3_120_000 -> true_up = 60_000
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: true_up_to_median_vs_to_range_edge_diverge
        grounds:
          - calculations.true_up_calculation
          - entities.IntercompanyAgreement.fields.true_up_method
        distinguishing_aspect: |
          Same input set (S_cost=3000000, S_booked=3060000, margin 200bp, pinned range
          400/500/600) yields true_up 90000 under TO_MEDIAN vs 60000 under
          TO_RANGE_EDGE — two valid targets producing different money on the
          Agreement/TrueUpRun domain.
        test_recipe:
          setup:
            - "Fiscal year 2026 OPEN (revenue 100000000, cbc_required false)"
            - "Entities E1(US) provider, E2(DE) recipient, both ACTIVE"
            - "Study CURRENT with comparables [300,400,500,600,700] -> range 400/500/600"
            - "Agreement A_med SERVICES TO_MEDIAN markup 200 ACTIVE; agreement A_edge FINANCING TO_RANGE_EDGE markup 200 ACTIVE (different transaction_type avoids overlap)"
            - "Each agreement has two MATCHED transactions: (cost 1000000, booked 1020000) and (cost 2000000, booked 2040000)"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr_med: $.data.id } }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "FINANCING", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_RANGE_EDGE", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr_edge: $.data.id } }
            - { call: "POST /tp/agreements/${agr_med}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/agreements/${agr_edge}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr_med}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_m1: $.data.id } }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr_med}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2040000, recipient_cost_cents: 2040000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_m2: $.data.id } }
            - { call: "POST /tp/transactions/${tx_m1}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions/${tx_m2}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr_edge}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_e1: $.data.id } }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr_edge}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2040000, recipient_cost_cents: 2040000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_e2: $.data.id } }
            - { call: "POST /tp/transactions/${tx_e1}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions/${tx_e2}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${agr_med}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run_med: $.data.id } }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${agr_edge}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run_edge: $.data.id } }
          trigger:
            - { call: "POST /tp/true_up_runs/${run_med}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs/${run_edge}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
          assert:
            - "TrueUpRun.${run_med}.actual_margin_bp == 200"
            - "TrueUpRun.${run_med}.true_up_amount_cents == 90000"
            - "TrueUpRun.${run_edge}.actual_margin_bp == 200"
            - "TrueUpRun.${run_edge}.true_up_amount_cents == 60000"
            - "TrueUpRun.${run_med}.true_up_amount_cents != TrueUpRun.${run_edge}.true_up_amount_cents"

      - name: pool_interest_average_vs_closing_balance_diverge
        grounds:
          - calculations.pool_interest_allocation
          - entities.CashPool.fields.interest_method
        distinguishing_aspect: |
          Same sweep pattern (E1 +1000000 at t0, +2000000 at t0+30d; E2 mirrored)
          yields lender interest 2795 cents under AVERAGE_BALANCE (120000000
          cent-days accrued) vs 4192 cents under CLOSING_BALANCE (3000000 x 60
          days) — dual-variant logic on the CashPool/treasury domain, a
          different entity domain from the Agreement/TrueUpRun pricing variant.
        test_recipe:
          setup:
            - "Fiscal years 2026 and 2027 OPEN; entities E1, E2 ACTIVE"
            - "Logical clock starts at default 2026-08-01T00:00:00Z"
            - "Pool A on 2026 with interest_method AVERAGE_BALANCE, admin_fee_cents 0; pool B on 2027 with CLOSING_BALANCE, admin_fee_cents 0"
            - "Identical sweeps on both pools: t0 E1 +1000000 / E2 -1000000; clock to 2026-08-31; E1 +2000000 / E2 -2000000; clock to 2026-09-30"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy26: $.data.id } }
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2027, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy27: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy26}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool_a: $.data.id, pool_a_v: $.data.version } }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy27}", interest_method: "CLOSING_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool_b: $.data.id, pool_b_v: $.data.version } }
            - { call: "POST /tp/cash_pools/${pool_a}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 1000000 }, { entity_id: "${e2}", amount_cents: -1000000 } ], expected_cash_pool_version: "${pool_a_v}" }, as: TreasuryManager, captures: { pool_a_v2: $.data.version } }
            - { call: "POST /tp/cash_pools/${pool_b}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 1000000 }, { entity_id: "${e2}", amount_cents: -1000000 } ], expected_cash_pool_version: "${pool_b_v}" }, as: TreasuryManager, captures: { pool_b_v2: $.data.version } }
            - { call: "POST /tp/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: GroupTaxAdmin }
            - { call: "POST /tp/cash_pools/${pool_a}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 2000000 }, { entity_id: "${e2}", amount_cents: -2000000 } ], expected_cash_pool_version: "${pool_a_v2}" }, as: TreasuryManager }
            - { call: "POST /tp/cash_pools/${pool_b}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 2000000 }, { entity_id: "${e2}", amount_cents: -2000000 } ], expected_cash_pool_version: "${pool_b_v2}" }, as: TreasuryManager }
            - { call: "POST /tp/_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: GroupTaxAdmin }
          trigger:
            - { call: "POST /tp/cash_pools/${pool_a}/begin_netting", payload: {}, as: TreasuryManager, captures: { pa_positions: $.data.positions } }
            - { call: "POST /tp/cash_pools/${pool_b}/begin_netting", payload: {}, as: TreasuryManager, captures: { pb_positions: $.data.positions } }
          assert:
            - "CashPool.${pool_a} position for ${e1}: interest_cents == 2795  (round_half_up(120000000 * 0.0085 / 365))"
            - "CashPool.${pool_a} position for ${e2}: interest_cents == -2795"
            - "CashPool.${pool_b} position for ${e1}: interest_cents == 4192  (round_half_up(180000000 * 0.0085 / 365))"
            - "CashPool.${pool_b} position for ${e2}: interest_cents == -4192"
            - "CashPool.${pool_a} E1 interest != CashPool.${pool_b} E1 interest for identical sweeps"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: true_up_multifactor_conditional_branching
        grounds:
          - calculations.true_up_calculation
        distinguishing_aspect: |
          Mode (a): >=3 inputs (S_cost, S_booked, pinned p25/median/p75,
          true_up_method) interact non-linearly via the conditional branch
          "within inclusive range -> 0 else adjust to selected target" — margin
          exactly 500 yields 0 while margin 200 yields 60000 under identical
          cost base.
        test_recipe:
          setup:
            - "Year 2026 OPEN; E1/E2 ACTIVE; study CURRENT range 400/500/600"
            - "A_in SERVICES TO_MEDIAN markup 200 ACTIVE with one MATCHED tx cost 2000000 booked 2100000 (margin exactly 500, inside [400,600])"
            - "A_out IP_ROYALTY TO_MEDIAN markup 200 ACTIVE with one MATCHED tx cost 2000000 booked 2040000 (margin 200, outside)"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { a_in: $.data.id } }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "IP_ROYALTY", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { a_out: $.data.id } }
            - { call: "POST /tp/agreements/${a_in}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/agreements/${a_out}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${a_in}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2100000, recipient_cost_cents: 2100000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_in: $.data.id } }
            - { call: "POST /tp/transactions/${tx_in}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${a_out}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2040000, recipient_cost_cents: 2040000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_out: $.data.id } }
            - { call: "POST /tp/transactions/${tx_out}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${a_in}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run_in: $.data.id } }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${a_out}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run_out: $.data.id } }
          trigger:
            - { call: "POST /tp/true_up_runs/${run_in}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs/${run_out}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
          assert:
            - "TrueUpRun.${run_in}.actual_margin_bp == 500"
            - "TrueUpRun.${run_in}.true_up_amount_cents == 0   (within inclusive range -> zero branch)"
            - "TrueUpRun.${run_out}.actual_margin_bp == 200"
            - "TrueUpRun.${run_out}.true_up_amount_cents == 60000   (2000000*1.05 - 2040000)"

      - name: pool_fee_round_per_position_then_residual
        grounds:
          - calculations.pool_fee_allocation
        distinguishing_aspect: |
          Mode (b): pinned nested rounding order — round_half_up per position
          THEN sum THEN reassign residual to the largest |balance|. Positions
          +100/+100/+100/-300 with fee 10000 give raw shares 1666.67 x3 + 5000;
          per-position rounding overshoots by 1, so the residual -1 lands on E4
          (largest |balance|): 1667/1667/1667/4999. Sum-then-round would give
          E4 5000 — the orders observably differ.
        test_recipe:
          setup:
            - "Year 2026 OPEN; E1..E4 created in order (E1 earliest created_at)"
            - "Pool on 2026, AVERAGE_BALANCE, admin_fee_cents 10000; netting happens at the default clock so interest is 0 for all positions"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E1", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E2", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E3", country_code: "FR", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e3: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E4", country_code: "NL", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e4: $.data.id } }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 10000 }, as: TreasuryManager, captures: { pool: $.data.id, pool_v: $.data.version } }
            - { call: "POST /tp/cash_pools/${pool}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 100 }, { entity_id: "${e2}", amount_cents: 100 }, { entity_id: "${e3}", amount_cents: 100 }, { entity_id: "${e4}", amount_cents: -300 } ], expected_cash_pool_version: "${pool_v}" }, as: TreasuryManager }
          trigger:
            - { call: "POST /tp/cash_pools/${pool}/begin_netting", payload: {}, as: TreasuryManager, captures: { positions: $.data.positions } }
          assert:
            - "position(${e1}).fee_cents == 1667"
            - "position(${e2}).fee_cents == 1667"
            - "position(${e3}).fee_cents == 1667"
            - "position(${e4}).fee_cents == 4999   (5000 rounded share minus residual 1; largest |balance|)"
            - "sum(fee_cents over positions) == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_amendment_cycle_restores_active_with_new_markup
        grounds:
          - state_machines.IntercompanyAgreement.ACTIVE_to_UNDER_AMENDMENT
          - state_machines.IntercompanyAgreement.UNDER_AMENDMENT_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on IntercompanyAgreement: ACTIVE -> UNDER_AMENDMENT ->
          ACTIVE is repeatable without bound; each approved cycle applies the
          pending markup and bumps amendments_count (250 after cycle 2).
        test_recipe:
          setup:
            - "Year 2026 OPEN; E1/E2 ACTIVE; study CURRENT; agreement SERVICES markup 200 ACTIVATED by mgr-1 (creator ana-1)"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/agreements/${agr}/start_amendment", payload: { new_markup_bp: 300 }, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/agreements/${agr}/approve_amendment", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/agreements/${agr}/start_amendment", payload: { new_markup_bp: 250 }, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/agreements/${agr}/approve_amendment", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { final_v: $.data.version } }
          assert:
            - "IntercompanyAgreement.${agr}.status == ACTIVE after both cycles"
            - "IntercompanyAgreement.${agr}.markup_bp == 250"
            - "IntercompanyAgreement.${agr}.amendments_count == 2"
            - "IntercompanyAgreement.${agr}.version == 6  (create=1, activate=2, start=3, approve=4, start=5, approve=6)"
            - "IntercompanyAgreement.${agr}.pending_markup_bp == null after each approval"

      - name: transaction_parallel_dimensions_advance_independently
        grounds:
          - state_machines.ICTransaction.UNMATCHED_to_MATCHED
          - state_machines.ICTransaction.UNSETTLED_to_NETTED
        distinguishing_aspect: |
          Parallel state dimensions on ICTransaction: settlement advances
          UNSETTLED -> NETTED (pool netting) while elimination is still
          MATCHED, and elimination later advances MATCHED -> ELIMINATED
          (begin_closing) while settlement stays NETTED — neither dimension
          gates the other.
        test_recipe:
          setup:
            - "Year 2026 OPEN; E1/E2 ACTIVE; study CURRENT; agreement ACTIVE markup 200"
            - "One transaction (cost 1000000, booked 1020000 both sides) matched"
            - "Cash pool for 2026 created (AVERAGE_BALANCE, fee 0), still OPEN"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx: $.data.id } }
            - { call: "POST /tp/transactions/${tx}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool: $.data.id } }
          trigger:
            - { call: "POST /tp/cash_pools/${pool}/begin_netting", payload: {}, as: TreasuryManager }
            - { call: "GET /tp/transactions/${tx}", payload: {}, as: TaxManager, captures: { mid_elim: $.data.elimination_status, mid_settle: $.data.settlement_status } }
            - { call: "POST /tp/fiscal_years/${fy}/begin_closing", payload: {}, as: GroupTaxAdmin }
            - { call: "GET /tp/transactions/${tx}", payload: {}, as: TaxManager, captures: { end_elim: $.data.elimination_status, end_settle: $.data.settlement_status } }
          assert:
            - "after begin_netting: ICTransaction.${tx}.settlement_status == NETTED while elimination_status == MATCHED"
            - "after begin_closing: ICTransaction.${tx}.elimination_status == ELIMINATED while settlement_status == NETTED"
            - "CashPool.${pool} position for ${e1}.balance_cents == 1020000 and for ${e2}.balance_cents == -1020000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: true_up_post_cascades_adjustment_elimination_pool_accrual
        grounds:
          - state_machines.TrueUpRun.APPROVED_to_POSTED
          - state_machines.ICTransaction.MATCHED_to_ELIMINATED
        distinguishing_aspect: |
          Depth-3 chain from POST .../true_up_runs/{id}/post: run -> creates
          adjustment ICTransaction (link 1) -> that creation auto-eliminates it
          (link 2) -> the elimination accrues pending_cents onto the OPEN cash
          pool's positions (link 3). Each link is caused by the previous link,
          not by the original trigger.
        test_recipe:
          setup:
            - "Year 2026, revenue 100000000; E1/E2 ACTIVE; study CURRENT 400/500/600"
            - "Agreement SERVICES TO_MEDIAN markup 200 ACTIVE; two MATCHED txs (1020000 + 2040000 booked on 3000000 cost)"
            - "Cash pool for 2026 created while year OPEN (no sweeps), status OPEN"
            - "Year moved to CLOSING (txs auto-ELIMINATED); run computed (90000) and approved by mgr-1"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx1: $.data.id } }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2040000, recipient_cost_cents: 2040000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx2: $.data.id } }
            - { call: "POST /tp/transactions/${tx1}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions/${tx2}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool: $.data.id } }
            - { call: "POST /tp/fiscal_years/${fy}/begin_closing", payload: {}, as: GroupTaxAdmin }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run: $.data.id } }
            - { call: "POST /tp/true_up_runs/${run}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs/${run}/approve", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/true_up_runs/${run}/post", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { adj_tx: $.data.adjustment_transaction_id } }
          assert:
            - "TrueUpRun.${run}.status == POSTED"
            - "ICTransaction.${adj_tx}.is_true_up_adjustment == true"
            - "ICTransaction.${adj_tx}.provider_revenue_cents == 90000 and recipient_cost_cents == 90000"
            - "ICTransaction.${adj_tx}.elimination_status == ELIMINATED   (link 2: auto-eliminated by its own creation)"
            - "CashPool.${pool} position for ${e1}.pending_cents == 90000   (link 3)"
            - "CashPool.${pool} position for ${e2}.pending_cents == -90000"
            - "FiscalYear.${fy}.consolidated_intercompany_net_cents == 0"

      - name: year_close_stales_study_flags_pinned_agreements
        grounds:
          - state_machines.FiscalYear.CLOSING_to_CLOSED
          - state_machines.BenchmarkingStudy.CURRENT_to_STALE
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST .../fiscal_years/{id}/close):
          close -> BenchmarkingStudy vintage 2024 <= 2026-2 becomes STALE (link 1)
          -> the agreement pinned to that study sets pricing_review_required =
          true (link 2, caused by link 1, not by the close directly).
        test_recipe:
          setup:
            - "Year 2026 OPEN, revenue 100000000 (cbc not required, no CBC filing precondition)"
            - "Study vintage_year 2024 approved CURRENT; agreement ACTIVE pinned to it"
            - "No transactions, no true-up runs (close preconditions satisfied)"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2024, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/fiscal_years/${fy}/begin_closing", payload: {}, as: GroupTaxAdmin }
          trigger:
            - { call: "POST /tp/fiscal_years/${fy}/close", payload: {}, as: GroupTaxAdmin }
          assert:
            - "FiscalYear.${fy}.status == CLOSED"
            - "BenchmarkingStudy.${study}.status == STALE   (link 1)"
            - "IntercompanyAgreement.${agr}.pricing_review_required == true   (link 2)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: doc_file_state_error_beats_cbc_fiscal_error
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_CBC_NOT_REQUIRED]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): filing a DRAFT CBC_REPORT in
          a year whose cbc_required is false violates both priority 4 (not
          APPROVED) and priority 9 (CbC not required); the state error must win.
        test_recipe:
          setup:
            - "Year 2026 OPEN with group_revenue_eur 600000000 -> cbc_required false"
            - "CBC_REPORT DocPackage created (allowed; uniqueness ok), still DRAFT"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 600000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/doc_packages", payload: { fiscal_year_id: "${fy}", doc_type: "CBC_REPORT" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { doc: $.data.id } }
          trigger:
            - { call: "POST /tp/doc_packages/${doc}/file", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION   (priority 4 state beats priority 9 fiscal)"
            - "DocPackage.${doc}.status == DRAFT (unchanged)"

      - name: audit_case_referential_beats_apa_year_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_ENTITY_INACTIVE]
          - errors[ERR_APA_YEAR_OVERLAP]
        distinguishing_aspect: |
          Category pair (business_referential, business_temporal): creating an
          APA case for an INACTIVE entity whose covered_year_indexes intersect
          an existing APA violates both priority 6 and priority 7; the
          referential error must win. Different category pair from the
          state-vs-fiscal instance.
        test_recipe:
          setup:
            - "E1 created ACTIVE; APA case 1 for E1 covering [2024, 2025] opened"
            - "E1 deactivated (no ACTIVE/UNDER_AMENDMENT agreements reference it)"
          setup_api_calls:
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "APA", authority_country: "US", covered_year_indexes: [2024, 2025] }, as: TransferPricingLead, captures: { apa1: $.data.id } }
            - { call: "POST /tp/legal_entities/${e1}/deactivate", payload: {}, as: GroupTaxAdmin }
          trigger:
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "APA", authority_country: "US", covered_year_indexes: [2025, 2026] }, as: TransferPricingLead, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENTITY_INACTIVE   (priority 6 referential beats priority 7 temporal overlap)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: cbcr_threshold_inclusive_at_750m
        grounds:
          - calculations.cbcr_threshold_check
        distinguishing_aspect: |
          Metric: group revenue in whole EUR at the CbCR threshold, via
          POST /tp/fiscal_years. 749999999 -> false; exactly 750000000 ->
          true (>=, inclusive boundary).
        test_recipe:
          setup: ["Empty database; logical clock at default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2030, group_revenue_eur: 749999999 }, as: GroupTaxAdmin, captures: { fy_below: $.data.id } }
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2031, group_revenue_eur: 750000000 }, as: GroupTaxAdmin, captures: { fy_at: $.data.id } }
          assert:
            - "FiscalYear.${fy_below}.cbc_required == false"
            - "FiscalYear.${fy_at}.cbc_required == true"

      - name: true_up_margin_at_p25_boundary_is_in_range
        grounds:
          - calculations.true_up_calculation
        distinguishing_aspect: |
          Metric: aggregate margin in basis points at the inclusive lower range
          edge, via POST /tp/true_up_runs/{id}/compute — a different metric and
          endpoint from the revenue threshold. Margin exactly 400 (== pinned
          p25) is IN range -> true_up 0; margin 397 is OUT -> 31000.
        test_recipe:
          setup:
            - "Year 2026 OPEN; E1/E2 ACTIVE; study CURRENT range 400/500/600"
            - "Agreement A SERVICES TO_MEDIAN ACTIVE with MATCHED txs cost 1000000+2000000, booked 1040000+2080000 (margin exactly 400)"
            - "Agreement B IP_ROYALTY TO_MEDIAN ACTIVE with MATCHED txs cost 1000000+2000000, booked 1039000+2080000 (margin rounds to 397)"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { a_bound: $.data.id } }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "IP_ROYALTY", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { a_below: $.data.id } }
            - { call: "POST /tp/agreements/${a_bound}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/agreements/${a_below}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${a_bound}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1040000, recipient_cost_cents: 1040000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_b1: $.data.id } }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${a_bound}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2080000, recipient_cost_cents: 2080000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_b2: $.data.id } }
            - { call: "POST /tp/transactions/${tx_b1}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions/${tx_b2}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${a_below}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1039000, recipient_cost_cents: 1039000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_l1: $.data.id } }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${a_below}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2080000, recipient_cost_cents: 2080000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_l2: $.data.id } }
            - { call: "POST /tp/transactions/${tx_l1}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions/${tx_l2}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${a_bound}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run_bound: $.data.id } }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${a_below}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run_below: $.data.id } }
          trigger:
            - { call: "POST /tp/true_up_runs/${run_bound}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs/${run_below}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
          assert:
            - "TrueUpRun.${run_bound}.actual_margin_bp == 400"
            - "TrueUpRun.${run_bound}.true_up_amount_cents == 0   (400 == p25 inclusive -> in range)"
            - "TrueUpRun.${run_below}.actual_margin_bp == 397"
            - "TrueUpRun.${run_below}.true_up_amount_cents == 31000   (3000000*1.05 - 3119000)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transaction_booking_requires_agreement_active
        grounds:
          - state_machines.IntercompanyAgreement
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair ICTransaction -> Agreement: booking is rejected while the
          referenced agreement is DRAFT; the same booking succeeds after the
          agreement's state (a different entity) flips to ACTIVE.
        test_recipe:
          setup:
            - "Year 2026 OPEN; E1/E2 ACTIVE; study CURRENT; agreement created but NOT activated (DRAFT)"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
          trigger:
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx: $.data.id } }
          assert:
            - "first booking: error_id == ERR_AGREEMENT_NOT_ACTIVE"
            - "after activation: booking succeeds, ICTransaction.${tx}.elimination_status == UNMATCHED"

      - name: true_up_approve_requires_fiscal_year_closing
        grounds:
          - state_machines.TrueUpRun.COMPUTED_to_APPROVED
          - errors[ERR_YEAR_NOT_CLOSING]
        distinguishing_aspect: |
          Entity pair TrueUpRun -> FiscalYear (different pair from
          ICTransaction -> Agreement): a COMPUTED run cannot be approved while
          its fiscal year is OPEN; approve succeeds once the year transitions
          to CLOSING.
        test_recipe:
          setup:
            - "Year 2026 OPEN; agreement ACTIVE; one MATCHED tx (cost 1000000 booked 1020000); run created and COMPUTED while year still OPEN"
          setup_api_calls:
