# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same operator may not open and adjudicate the same audit case" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum member, numeric range violated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not valid from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_USAGE_REPORT_OVERLAP, http: 409, condition: "Report window overlaps another non-terminal report of the same licensee (inclusive-day semantics)" }
  - { id: ERR_RATE_SCHEDULE_OVERLAP, http: 409, condition: "Schedule window overlaps another DRAFT/EFFECTIVE schedule of the same category (half-open semantics)" }
  - { id: ERR_NO_EFFECTIVE_RATE_SCHEDULE, http: 409, condition: "No EFFECTIVE schedule covers the report's period_start for the licensee's category" }
  - { id: ERR_LICENSEE_NOT_ACTIVE, http: 409, condition: "Licensee is not ACTIVE at report submission" }
  - { id: ERR_RECORDING_WITHDRAWN, http: 409, condition: "Claim target recording is WITHDRAWN" }
  - { id: ERR_PAYEE_NOT_VERIFIED, http: 409, condition: "Claimant or payee registration is not VERIFIED" }
  - { id: ERR_TERMINATION_BLOCKED, http: 409, condition: "In-flight reports, planned batches, or open audits block termination" }
  - { id: ERR_LIABILITY_NOT_PAID, http: 409, condition: "Batch execution requires liability in PAID status" }
  - { id: ERR_BATCH_NOT_DUE, http: 409, condition: "scheduled_for is still in the future relative to the logical clock" }
  - { id: ERR_ALREADY_EXISTS, http: 409, condition: "Uniqueness violated (one liability per report; one batch per report)" }
  - { id: ERR_RECOVERY_EXCEEDS_ASSESSMENT, http: 409, condition: "Cumulative recovery would exceed assessed underpayment" }
  - { id: ERR_AUDIT_NOT_SETTLABLE, http: 409, condition: "Audit cannot close: assessment positive and not fully recovered" }
  - { id: ERR_POOL_NOT_DISTRIBUTABLE, http: 409, condition: "Pool not in DISTRIBUTION_ELIGIBLE" }
  - { id: ERR_POOL_NOT_EXPIRABLE, http: 409, condition: "Pool expiry window (period_end + 365 days) not yet passed" }
  - { id: ERR_RECORDING_IN_DISPUTE, http: 409, condition: "Recording has an OPEN or UNDER_REVIEW ownership claim" }
  - { id: ERR_RATE_PROCEEDING_INVALID, http: 409, condition: "Proceeding operation invalid (decide on non-OPEN, publish on non-DECIDED, decided schedule not DRAFT)" }
  - { id: ERR_REPORT_NO_PLAY_LINES, http: 409, condition: "Submission requires at least one play line" }
  - { id: ERR_LIABILITY_NOT_COMPUTED, http: 409, condition: "Batch planning requires a COMPUTED/PAID liability to exist for the report" }
  - { id: ERR_DUPLICATE_ISRC, http: 409, condition: "Recording ISRC already registered" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "complete_campaign requires pool in MATCHING_CAMPAIGN" }
  - { id: ERR_PLAY_LINE_IMMUTABLE, http: 409, condition: "Play lines may only be added or removed while the report is DRAFT or AMENDED" }
  - { id: ERR_BATCH_NOT_CANCELLABLE, http: 409, condition: "Only PLANNED batches may be cancelled" }
  - { id: ERR_SCHEDULED_TIME_NOT_FUTURE, http: 400, condition: "Distribution batch scheduled_for must be strictly after the current logical clock time" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Collective administrator; licensee lifecycle, catalog, schedules, pools"
    identity: opaque
    exclusive_operations:
      - "POST /licensees, activate/suspend/reinstate/terminate"
      - "POST /rate-schedules and activate"
      - "POST /recordings and withdraw"
      - "POST /unclaimed-pools and expire"
      - "POST /royalty-liabilities/{id}/write_off"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /artists, POST /rights-owners (with PayeeAdmin)"
      - "GET endpoints across the surface"

  - name: Licensee
    description: "Registered noninteractive digital service reporting usage"
    identity: "entity_backed:Licensee"
    exclusive_operations:
      - "POST /usage-reports, submit, amend"
      - "POST /usage-reports/{id}/play-lines, DELETE /play-lines/{id}"
    shared_operations:
      - "GET own licensee record, reports, liabilities"

  - name: RoyaltyOps
    description: "Royalty processing operator; accepts reports, computes liabilities, bills, runs distributions"
    identity: opaque
    exclusive_operations:
      - "POST /usage-reports/{id}/accept and reject"
      - "POST /usage-reports/{id}/compute-liability"
      - "POST /royalty-liabilities/{id}/bill and record_payment"
      - "POST /usage-reports/{id}/distribution-batches, execute, cancel"
      - "POST /unclaimed-pools/{id}/release"
    shared_operations:
      - "GET endpoints across the surface"

  - name: PayeeAdmin
    description: "Payee registration and ownership-dispute administrator"
    identity: opaque
    exclusive_operations:
      - "POST /artists/{id}/verify, reject_registration, suspend_registration"
      - "POST /rights-owners/{id}/verify, reject_registration, suspend_registration"
      - "POST /recordings/{id}/ownership-claims; start_review, reopen, resolve, withdraw"
    shared_operations:
      - "POST /artists, POST /rights-owners (with Admin)"
      - "GET artists, rights owners, claims"

  - name: StatutoryBoard
    description: "Statutory rate board; runs rate proceedings"
    identity: opaque
    exclusive_operations:
      - "POST /rate-proceedings, decide, publish, close"
    shared_operations:
      - "GET /rate-schedules, /rate-proceedings"

  - name: RoyaltyAuditor
    description: "External auditor; examines licensee reporting and recovers underpayment"
    identity: opaque
    exclusive_operations:
      - "POST /licensees/{id}/audit-cases, issue_findings, record_recovery, close, waive"
    shared_operations:
      - "GET licensees, reports, liabilities, batches, lines"

  - name: MatchingAgent
    description: "Repertoire matching specialist; runs unmatched-play campaigns"
    identity: opaque
    exclusive_operations:
      - "POST /unclaimed-pools/{id}/start_campaign and complete_campaign"
    shared_operations:
      - "GET pools, play lines, recordings"
