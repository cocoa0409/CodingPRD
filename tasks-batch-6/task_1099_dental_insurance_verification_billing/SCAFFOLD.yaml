# =============================================================================
# Dental Insurance Verification & Billing Service — seed tables (v1)
# =============================================================================

scenario: |
  Dental Insurance Verification & Billing Service: patient & plan-breakdown
  verification, benefit/frequency & coordination-of-benefits, pre-authorization
  & attachment, claim & narrative, aging & appeal, payment-posting &
  patient-portion, membership-plan billing, reporting

domain_name: dental-insurance-verification-billing
# Flat topology: all resources are top-level sibling collections referenced by
# foreign keys in request bodies (no nested ownership tree). api_prefix is the
# common root so every collection sits directly under it: /patients, /claims, ...
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # flat: peer entities linked by FK fields in bodies; URL paths are all
  # top-level (/coverages/{id}), no parent nesting.

  state_machine_shape: cyclic
  # Claim (DENIED<->APPEALED<->ADJUDICATED revision loops), Membership
  # (ACTIVE<->PAST_DUE), and PreAuthorization (SUBMITTED<->PENDED) are all
  # non-linear; Payment is a simple revertible pair.

  relationship_patterns:
    - one_to_many          # Patient -> Coverage/Claim/Payment/Membership
    - many_to_many         # Patient <-> InsurancePlan via Coverage (COB)
    - self_referential     # Claim.primary_claim_id -> Claim.id (secondary COB claim)
    - polymorphic          # Attachment references either a Claim or a PreAuthorization
    - cross_aggregate      # Payment posting mutates Claim, Coverage, and Patient

  role_model: segregation_of_duties
  # Peer operational roles (FrontOffice, Biller, BillingManager) plus an
  # entity-backed Patient. SoD: the user who submitted a claim may not post
  # that claim's insurance payment.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | COLLECTIONS — COLLECTIONS when balance_cents > COLLECTIONS_THRESHOLD_CENTS", constraints: "ACTIVE | COLLECTIONS" }
      - { name: balance_cents, type: integer, source: computed, description: "Total patient responsibility owed (unpaid claim patient-portions + membership dues − patient payments). See patient_balance calc." }

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - { name: payer_name, type: string, source: input, description: "Carrier / payer name" }
      - { name: plan_name, type: string, source: input, description: "Plan display name" }
      - { name: annual_maximum_cents, type: integer, source: input, default: 150000, description: "Per-benefit-year insurance benefit ceiling" }
      - { name: deductible_cents, type: integer, source: input, default: 5000, description: "Annual deductible in cents" }
      - { name: deductible_applies_to, type: array, source: input, default: ["BASIC", "MAJOR"], description: "Categories the deductible applies to; subset of {PREVENTIVE, BASIC, MAJOR}" }
      - { name: preventive_coinsurance_pct, type: integer, source: input, default: 100, description: "Plan-pays percent for PREVENTIVE (0-100)" }
      - { name: basic_coinsurance_pct, type: integer, source: input, default: 80, description: "Plan-pays percent for BASIC" }
      - { name: major_coinsurance_pct, type: integer, source: input, default: 50, description: "Plan-pays percent for MAJOR" }
      - { name: cob_method, type: enum, source: input, default: "STANDARD", description: "Coordination-of-benefits method when this plan is SECONDARY", constraints: "STANDARD | NON_DUPLICATION" }

  - name: Procedure
    parent: null
    common_fields: true
    fields:
      - { name: cdt_code, type: string, source: input, description: "CDT procedure code; unique across catalog" }
      - { name: description, type: string, source: input, description: "Human description" }
      - { name: category, type: enum, source: input, description: "Benefit category", constraints: "PREVENTIVE | BASIC | MAJOR" }
      - { name: ucr_fee_cents, type: integer, source: input, description: "Usual/customary allowed fee used as the plan-allowed amount" }
      - { name: frequency_limit_per_year, type: integer, source: input, default: null, description: "Max submitted-claim occurrences per rolling FREQUENCY_WINDOW_DAYS; null = unlimited" }
      - { name: requires_narrative, type: boolean, source: input, default: false, description: "Claim submit requires non-empty narrative when a line uses this code" }
      - { name: requires_attachment, type: boolean, source: input, default: false, description: "Claim/PreAuth submit requires >=1 attachment when a line uses this code" }

  - name: Coverage
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id" }
      - { name: priority, type: enum, source: input, description: "COB rank", constraints: "PRIMARY | SECONDARY" }
      - { name: subscriber_id, type: string, source: input, description: "Member/subscriber id with the carrier" }
      - { name: relationship, type: enum, source: input, default: "SELF", description: "Patient relationship to subscriber", constraints: "SELF | SPOUSE | CHILD | OTHER" }
      - { name: effective_date, type: string, source: input, description: "ISO date; coverage start (inclusive)" }
      - { name: term_date, type: string, source: input, description: "ISO date; coverage end (inclusive)" }
      - { name: status, type: enum, source: computed, description: "ACTIVE when effective_date <= clock <= term_date, else TERMINATED", constraints: "ACTIVE | TERMINATED" }
      - { name: benefits_used_cents, type: integer, source: computed, description: "Sum of paid_insurance_cents attributed to this coverage in the current benefit year; incremented on claim adjudication, restored on payment reversal" }
      - { name: deductible_met_cents, type: integer, source: computed, description: "Deductible satisfied so far this benefit year via this coverage" }

  - name: Verification
    parent: null
    common_fields: true
    fields:
      - { name: coverage_id, type: string, source: input, description: "FK -> Coverage.id" }
      - { name: verified_annual_maximum_cents, type: integer, source: input, description: "Snapshot of plan annual maximum captured at verification time" }
      - { name: verified_deductible_cents, type: integer, source: input, description: "Snapshot deductible" }
      - { name: verified_preventive_pct, type: integer, source: input, description: "Snapshot preventive coinsurance percent" }
      - { name: verified_basic_pct, type: integer, source: input, description: "Snapshot basic coinsurance percent" }
      - { name: verified_major_pct, type: integer, source: input, description: "Snapshot major coinsurance percent" }
      - { name: verified_at, type: datetime, source: system, description: "Logical clock at creation (ISO 8601, ms precision)" }
      - { name: expires_at, type: datetime, source: computed, description: "verified_at + VERIFICATION_VALIDITY_DAYS (VERIFICATION_VALIDITY_DAYS = 30)" }
      - { name: status, type: enum, source: computed, description: "VERIFIED when clock <= expires_at, else EXPIRED", constraints: "VERIFIED | EXPIRED" }

  - name: PreAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: coverage_id, type: string, source: input, description: "FK -> Coverage.id" }
      - { name: procedures, type: array, source: input, description: "Line items: list of objects { cdt_code, tooth?, billed_fee_cents }" }
      - { name: narrative, type: string, source: input, default: null, description: "Optional clinical narrative" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "DRAFT | SUBMITTED | PENDED | APPROVED | DENIED" }
      - { name: estimated_benefit_cents, type: integer, source: computed, description: "Estimated insurance benefit for the pre-auth (claim_benefit_estimate over its procedures)" }
      - { name: approved_amount_cents, type: integer, source: system, default: null, description: "Benefit amount the carrier approved; set on APPROVED decision" }
      - { name: attachment_count, type: integer, source: computed, description: "Count of Attachment rows with preauth_id == this.id" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical clock when first SUBMITTED" }

  - name: Attachment
    parent: null
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: input, default: null, description: "FK -> Claim.id (nullable; set when attached to a Claim)" }
      - { name: preauth_id, type: string, source: input, default: null, description: "FK -> PreAuthorization.id (nullable; set when attached to a PreAuthorization)" }
      - { name: kind, type: enum, source: input, description: "Document kind", constraints: "XRAY | PERIO_CHART | NARRATIVE | PHOTO | OTHER" }
      - { name: filename, type: string, source: input, description: "Uploaded file name" }
      - { name: note, type: string, source: input, default: null, description: "Optional note" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: coverage_id, type: string, source: input, description: "FK -> Coverage.id (the coverage this claim bills)" }
      - { name: preauth_id, type: string, source: input, default: null, description: "FK -> PreAuthorization.id (optional)" }
      - { name: primary_claim_id, type: string, source: input, default: null, description: "FK -> Claim.id (set on a SECONDARY-coverage claim, points at the primary claim)" }
      - { name: procedures, type: array, source: input, description: "Line items: list of objects { cdt_code, tooth?, billed_fee_cents }" }
      - { name: narrative, type: string, source: input, default: null, description: "Clinical narrative text" }
      - { name: service_date, type: string, source: input, description: "ISO date of service; drives frequency window and aging" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "DRAFT | SUBMITTED | ADJUDICATED | DENIED | APPEALED | CLOSED" }
      - { name: total_billed_cents, type: integer, source: computed, description: "Sum of line billed_fee_cents" }
      - { name: estimated_insurance_cents, type: integer, source: computed, description: "Forward-looking benefit estimate set at submit (claim_benefit_estimate)" }
      - { name: estimated_patient_portion_cents, type: integer, source: computed, description: "total_billed_cents − estimated_insurance_cents at submit" }
      - { name: paid_insurance_cents, type: integer, source: computed, description: "Actual insurer-paid amount from the posted EOB Payment (claim_final_settlement); 0 until adjudicated" }
      - { name: final_patient_portion_cents, type: integer, source: computed, description: "total_billed_cents − paid_insurance_cents once adjudicated" }
      - { name: patient_paid_cents, type: integer, source: computed, description: "Sum of POSTED patient-portion payments applied to this claim" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor who submitted (SoD anchor)" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical clock at submit" }
      - { name: adjudicated_at, type: datetime, source: system, default: null, description: "Logical clock at latest adjudication/denial" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; capped by APPEAL_LIMIT (APPEAL_LIMIT = 2)" }
      - { name: aging_days, type: integer, source: computed, description: "floor((clock − submitted_at) days) while not CLOSED; 0 before submit" }
      - { name: aging_bucket, type: enum, source: computed, description: "CURRENT (<=30) | DAYS_31_60 | DAYS_61_90 | DAYS_90_PLUS", constraints: "CURRENT | DAYS_31_60 | DAYS_61_90 | DAYS_90_PLUS" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, default: null, description: "FK -> Claim.id (required for INSURANCE and claim-directed PATIENT payments)" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: payer_type, type: enum, source: input, description: "Who is paying", constraints: "INSURANCE | PATIENT" }
      - { name: amount_cents, type: integer, source: input, description: "Total amount of this payment in cents" }
      - { name: eob_lines, type: array, source: input, default: null, description: "INSURANCE only: EOB detail, list of objects { cdt_code, allowed_cents, paid_cents, deductible_applied_cents }" }
      - { name: is_denial, type: boolean, source: input, default: false, description: "INSURANCE only: true posts a full denial (paid 0) and drives claim -> DENIED" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED", constraints: "POSTED | REVERSED" }
      - { name: posted_at, type: datetime, source: system, description: "Logical clock at posting" }

  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "In-house membership plan name" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Yearly membership fee" }
      - { name: billing_period, type: enum, source: input, default: "MONTHLY", description: "Billing cadence", constraints: "MONTHLY | ANNUAL" }
      - { name: discount_pct, type: integer, source: input, default: 0, description: "Discount percent applied to included procedures" }
      - { name: included_cdt_codes, type: array, source: input, default: [], description: "CDT codes covered by the membership" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: membership_plan_id, type: string, source: input, description: "FK -> MembershipPlan.id" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "ACTIVE | PAST_DUE | CANCELLED" }
      - { name: enrolled_at, type: datetime, source: system, description: "Logical clock at enrollment" }
      - { name: period_start, type: string, source: input, description: "ISO date; membership active-period start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO date; membership active-period end (exclusive, half-open)" }
      - { name: paid_through_date, type: string, source: system, description: "ISO date dues are paid through; starts at period_start" }
      - { name: next_billing_date, type: string, source: computed, description: "paid_through_date advanced by one billing_period" }
      - { name: balance_cents, type: integer, source: computed, description: "Outstanding membership dues owed" }
      - { name: past_due_periods, type: integer, source: system, default: 0, description: "Consecutive unpaid billing periods; MAX_PAST_DUE_PERIODS triggers CANCELLED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: PreAuthorization
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /preauthorizations/{id}/submit"
        actor: Biller
        preconditions:
          - "procedures non-empty"
          - "If any line's Procedure.requires_attachment: attachment_count >= 1 (ERR_MISSING_ATTACHMENT)"
        side_effects:
          - "Compute estimated_benefit_cents via claim_benefit_estimate"
          - "submitted_at = clock"
      - from: PENDED
        to: SUBMITTED
        trigger: "POST /preauthorizations/{id}/submit (resubmit after adding attachment)"
        actor: Biller
        preconditions:
          - "If any line's Procedure.requires_attachment: attachment_count >= 1 (ERR_MISSING_ATTACHMENT)"
        side_effects:
          - "Recompute estimated_benefit_cents"
        note: "Cyclic: PENDED -> SUBMITTED, forming the revision loop with SUBMITTED -> PENDED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /preauthorizations/{id}/decision (outcome=APPROVED)"
        actor: Biller
        preconditions: []
        side_effects:
          - "approved_amount_cents = estimated_benefit_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /preauthorizations/{id}/decision (outcome=DENIED)"
        actor: Biller
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /preauthorizations/{id}/decision (outcome=PENDED)"
        actor: Biller
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /claims/{id}/submit"
        actor: Biller
        preconditions:
          - "Coverage.status == ACTIVE (ERR_COVERAGE_INACTIVE) [cross-entity: Claim depends on Coverage]"
          - "Coverage has at least one Verification record (ERR_VERIFICATION_REQUIRED) [cross-entity: Claim depends on Verification]"
          - "The latest Verification is not EXPIRED at clock (ERR_VERIFICATION_EXPIRED)"
          - "For each line's Procedure with frequency_limit_per_year: prior SUBMITTED/ADJUDICATED/CLOSED claim lines with same cdt_code and service_date within FREQUENCY_WINDOW_DAYS < limit (ERR_FREQUENCY_LIMIT_EXCEEDED)"
          - "If any line Procedure.requires_narrative: narrative non-empty (ERR_MISSING_NARRATIVE)"
          - "If any line Procedure.requires_attachment: >=1 Attachment with claim_id==this (ERR_MISSING_ATTACHMENT)"
          - "estimated_insurance_cents would not push coverage.benefits_used_cents over verified_annual_maximum_cents beyond remaining (ERR_ANNUAL_MAXIMUM_EXCEEDED)"
          - "If primary_claim_id set: that Claim.status in {ADJUDICATED, DENIED, CLOSED} (ERR_PRIMARY_CLAIM_NOT_ADJUDICATED) [cross-entity: secondary Claim depends on primary Claim]"
        side_effects:
          - "submitted_by_user_id = X-User-ID; submitted_at = clock"
          - "Compute total_billed_cents, estimated_insurance_cents (claim_benefit_estimate; cob_secondary_benefit when primary_claim_id set), estimated_patient_portion_cents"
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /payments (payer_type=INSURANCE, is_denial=false) referencing this claim"
        actor: BillingManager
        preconditions:
          - "Posting user X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "L1 (this claim): paid_insurance_cents = sum(eob_lines.paid_cents); adjudicated_at = clock; final_patient_portion_cents = total_billed_cents − paid_insurance_cents (claim_final_settlement)"
          - "L2 (caused by L1): Patient.balance_cents += final_patient_portion_cents (recompute patient_balance)"
          - "L3 (caused by L2): Patient.status recomputed = COLLECTIONS when balance_cents > COLLECTIONS_THRESHOLD_CENTS, else ACTIVE"
          - "Corroborating (also caused by L1, parallel to the chain): Coverage.benefits_used_cents += paid_insurance_cents; Coverage.deductible_met_cents += sum(eob_lines.deductible_applied_cents)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /payments (payer_type=INSURANCE, is_denial=true) referencing this claim"
        actor: BillingManager
        preconditions:
          - "Posting user X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "paid_insurance_cents = 0; adjudicated_at = clock; final_patient_portion_cents = total_billed_cents"
          - "CASCADE L3: Patient.balance_cents += total_billed_cents"
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: Biller
        preconditions:
          - "appeal_count < APPEAL_LIMIT (ERR_APPEAL_NOT_ALLOWED)"
        side_effects:
          - "appeal_count += 1"
      - from: ADJUDICATED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: Biller
        preconditions:
          - "appeal_count < APPEAL_LIMIT (ERR_APPEAL_NOT_ALLOWED)"
        side_effects:
          - "appeal_count += 1"
        note: "Appeal of an underpayment."
      - from: APPEALED
        to: ADJUDICATED
        trigger: "POST /payments (payer_type=INSURANCE, is_denial=false) referencing this claim"
        actor: BillingManager
        preconditions:
          - "Posting user X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "COMPENSATE prior settlement then re-apply: reverse the previous adjudication's Coverage.benefits_used_cents/deductible and Patient.balance deltas, then apply new paid_insurance_cents; net Coverage.benefits_used_cents change reflects only the new EOB (compensating_invariant on benefits pool)"
          - "final_patient_portion_cents recomputed; Patient.balance_cents recomputed"
        note: "Cyclic: APPEALED -> ADJUDICATED closes the revision loop."
      - from: APPEALED
        to: DENIED
        trigger: "POST /payments (payer_type=INSURANCE, is_denial=true) referencing this claim"
        actor: BillingManager
        preconditions:
          - "Posting user X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "paid_insurance_cents = 0; final_patient_portion_cents = total_billed_cents; Patient.balance_cents recomputed"
      - from: ADJUDICATED
        to: CLOSED
        trigger: "POST /payments (payer_type=PATIENT) that brings patient_paid_cents >= final_patient_portion_cents"
        actor: Patient
        preconditions:
          - "Payment amount_cents + patient_paid_cents <= final_patient_portion_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "patient_paid_cents += amount_cents; Patient.balance_cents -= amount_cents"
          - "When patient_paid_cents == final_patient_portion_cents: status = CLOSED"
      - from: DENIED
        to: CLOSED
        trigger: "POST /payments (payer_type=PATIENT) that brings patient_paid_cents >= final_patient_portion_cents"
        actor: Patient
        preconditions:
          - "Payment amount_cents + patient_paid_cents <= final_patient_portion_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "patient_paid_cents += amount_cents; Patient.balance_cents -= amount_cents; status = CLOSED when fully paid"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: BillingManager
        preconditions:
          - "Payment.status == POSTED (ERR_INVALID_STATE)"
        side_effects:
          - "INSURANCE: restore Coverage.benefits_used_cents and Coverage.deductible_met_cents to pre-post values; revert Claim.paid_insurance_cents/final_patient_portion_cents; Claim.status back to SUBMITTED; Patient.balance_cents restored (compensating_invariant on benefits pool)"
          - "PATIENT: patient_paid_cents -= amount_cents; Patient.balance_cents += amount_cents; if Claim was CLOSED it returns to prior adjudicated state (compensating_invariant on patient dues)"

  - entity: Membership
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /billing/run (system, when clock > paid_through_date + MEMBERSHIP_GRACE_DAYS and dues unpaid)"
        actor: system
        preconditions:
          - "clock > paid_through_date + MEMBERSHIP_GRACE_DAYS (strict)"
        side_effects:
          - "balance_cents += one billing_period fee (membership_billing); past_due_periods += 1"
          - "CASCADE L2: Patient.balance_cents += that dues amount"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /memberships/{id}/pay"
        actor: Patient
        preconditions:
          - "balance_cents > 0 (ERR_MEMBERSHIP_NOT_PAYABLE)"
        side_effects:
          - "balance_cents -= amount paid; paid_through_date advanced; past_due_periods = 0; Patient.balance_cents -= amount"
        note: "Cyclic: ACTIVE <-> PAST_DUE billing loop."
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /billing/run (system, when past_due_periods reaches MAX_PAST_DUE_PERIODS)"
        actor: system
        preconditions:
          - "past_due_periods >= MAX_PAST_DUE_PERIODS"
        side_effects:
          - "status = CANCELLED"

concurrency_rules:
  - rule_id: verification-supersede-stale-coverage
    parent_entity: Coverage
    write_endpoint: "POST /coverages/{coverageId}/verifications"
    occ_field: "expected_coverage_version"
    description: |
      Creating a Verification against a Coverage whose version has advanced
      since the client last observed it is rejected. A newly created
      Verification supersedes the coverage's prior benefit snapshot (the plan
      breakdown is re-pulled), which legitimately bumps Coverage.version; a
      second create still carrying the pre-supersede version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_benefit_estimate
    trigger: "Claim DRAFT -> SUBMITTED; PreAuthorization -> SUBMITTED"
    algorithm: tiered_pricing
    formula: |
      Inputs: claim.procedures (ordered as supplied), the Coverage's VERIFIED
      Verification snapshot (verified_*_pct, verified_deductible_cents,
      verified_annual_maximum_cents), each line's Procedure.category and
      ucr_fee_cents, and coverage.benefits_used_cents / deductible_met_cents.

      remaining_max = verified_annual_maximum_cents - coverage.benefits_used_cents
      remaining_deductible = max(0, verified_deductible_cents - coverage.deductible_met_cents)
      estimated_insurance = 0
      for line in procedures (in supplied order):        # order is pinned
        allowed      = min(line.billed_fee_cents, procedure.ucr_fee_cents)
        pct          = { PREVENTIVE: verified_preventive_pct,
                         BASIC: verified_basic_pct,
                         MAJOR: verified_major_pct }[procedure.category]
        if procedure.category in plan.deductible_applies_to:
          d          = min(remaining_deductible, allowed)
          remaining_deductible -= d
        else:
          d          = 0
        line_benefit = round_half_up((allowed - d) * pct / 100)   # ROUND PER LINE
        line_benefit = min(line_benefit, remaining_max)           # cap by remaining max
        remaining_max -= line_benefit
        estimated_insurance += line_benefit                       # THEN sum
      estimated_patient_portion = total_billed_cents - estimated_insurance
    input_set: "All lines of the claim/pre-auth; benefits_used/deductible_met from the billing coverage only."
    constants:
      DEFAULT_PREVENTIVE_PCT: 100
      DEFAULT_BASIC_PCT: 80
      DEFAULT_MAJOR_PCT: 50
    precision: "Whole cents. round_half_up applied PER LINE before summing (round-then-sum, not sum-then-round)."

  - name: claim_final_settlement
    trigger: "Claim SUBMITTED/APPEALED -> ADJUDICATED via INSURANCE Payment posting"
    algorithm: chronological
    formula: |
      paid_insurance_cents = sum(eob_lines[*].paid_cents)          # actual EOB, as posted
      final_patient_portion_cents = total_billed_cents - paid_insurance_cents
      # Differs from claim_benefit_estimate whenever the carrier's actual
      # allowed/paid amounts (eob_lines) diverge from the pre-service estimate.
    input_set: "The single INSURANCE Payment's eob_lines being posted."
    precision: "Whole cents; no rounding (paid_cents supplied as integers)."
    variants:
      - name: estimate
        when: "At Claim submit (pre-service)"
        difference: "Uses min(billed, ucr) * plan pct with projected deductible/remaining-max — a forecast."
      - name: final
        when: "At INSURANCE Payment posting (EOB)"
        difference: "Uses the carrier's actual paid_cents; final_patient_portion generally != estimated_patient_portion."

  - name: cob_secondary_benefit
    trigger: "Claim submit when primary_claim_id is set (secondary coverage)"
    algorithm: waterfall_allocation
    formula: |
      normal_benefit   = claim_benefit_estimate over the secondary plan snapshot
      primary_paid     = primary_claim.paid_insurance_cents
      allowed_basis    = sum over lines of min(billed_fee_cents, procedure.ucr_fee_cents)
      patient_remaining = allowed_basis - primary_paid
      if secondary_plan.cob_method == STANDARD:
        secondary_benefit = min(normal_benefit, patient_remaining)
      elif secondary_plan.cob_method == NON_DUPLICATION:
        secondary_benefit = max(0, normal_benefit - primary_paid)
      estimated_insurance_cents = secondary_benefit
    input_set: "Secondary claim lines + primary claim paid_insurance_cents."
    variants:
      - name: standard_cob
        when: "secondary plan cob_method == STANDARD"
        difference: "Pays lesser of its normal benefit and the patient's post-primary remainder."
      - name: non_duplication_cob
        when: "secondary plan cob_method == NON_DUPLICATION"
        difference: "Pays only the excess of its normal benefit over what primary already paid; often 0."

  - name: frequency_check
    trigger: "Claim DRAFT -> SUBMITTED"
    algorithm: aggregation
    formula: |
      for each line whose Procedure.frequency_limit_per_year is not null:
        prior = count of claim lines with the same cdt_code across claims of the
                same patient whose status in {SUBMITTED, ADJUDICATED, APPEALED, CLOSED}
                and whose service_date is within FREQUENCY_WINDOW_DAYS before this
                claim's service_date (inclusive window, this claim excluded)
        if prior >= frequency_limit_per_year:  reject ERR_FREQUENCY_LIMIT_EXCEEDED
    input_set: "Patient's non-DRAFT claim lines within the rolling window."
    constants:
      FREQUENCY_WINDOW_DAYS: 365
    precision: "Integer counts; boundary is prior >= limit (the limit-th occurrence is allowed, the (limit+1)-th rejected)."

  - name: annual_maximum_check
    trigger: "Claim DRAFT -> SUBMITTED"
    algorithm: threshold
    formula: |
      remaining_max = verified_annual_maximum_cents - coverage.benefits_used_cents
      if estimated_insurance_cents (uncapped, pre-min) > remaining_max
         AND remaining_max <= 0:  reject ERR_ANNUAL_MAXIMUM_EXCEEDED
      # When 0 < remaining_max < estimated, the estimate is capped (not rejected);
      # rejection is only when there is no remaining benefit at all (remaining_max <= 0).
    input_set: "Billing coverage benefits_used_cents vs verified annual maximum."
    precision: "Whole cents; boundary at remaining_max == 0 (>0 allowed with cap, <=0 rejected)."

  - name: patient_balance
    trigger: "Claim adjudication/denial/close, patient payment, payment reversal, membership billing/pay"
    algorithm: aggregation
    formula: |
      balance_cents = ( sum over patient's claims of max(0, final_patient_portion_cents
                          - patient_paid_cents) for claims in {ADJUDICATED, DENIED} )
                      + ( sum over patient's memberships of balance_cents )
      status = COLLECTIONS if balance_cents > COLLECTIONS_THRESHOLD_CENTS else ACTIVE
    input_set: "Patient's ADJUDICATED/DENIED claims (open patient portion) + membership dues."
    constants:
      COLLECTIONS_THRESHOLD_CENTS: 50000
    precision: "Whole cents."

  - name: membership_billing
    trigger: "POST /billing/run"
    algorithm: threshold
    formula: |
      period_fee = (billing_period == MONTHLY) ? round_half_up(annual_fee_cents / 12)
                                               : annual_fee_cents
      for each Membership with status in {ACTIVE, PAST_DUE}:
        if clock > paid_through_date + MEMBERSHIP_GRACE_DAYS:     # strict overdue boundary
          balance_cents += period_fee
          past_due_periods += 1
          status = PAST_DUE
          if past_due_periods >= MAX_PAST_DUE_PERIODS: status = CANCELLED
    input_set: "All non-CANCELLED memberships whose grace window has lapsed."
    constants:
      MEMBERSHIP_GRACE_DAYS: 15
      MAX_PAST_DUE_PERIODS: 2
    precision: "Whole cents; overdue boundary is strict > (exactly at grace end is NOT overdue)."

  - name: claim_aging
    trigger: "Read of a non-CLOSED claim; recomputed on POST /billing/run"
    algorithm: threshold
    formula: |
      aging_days = 0 if not submitted or CLOSED
                 else floor((clock - submitted_at) in whole days)
      aging_bucket = CURRENT      if aging_days <= 30
                     DAYS_31_60   if 31 <= aging_days <= 60
                     DAYS_61_90   if 61 <= aging_days <= 90
                     DAYS_90_PLUS if aging_days >= 91
    input_set: "Single claim vs clock."
    precision: "Whole days; bucket edges inclusive as written (30, 60, 90)."

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: auth
    check: "Patient role may only read/act on resources it owns (X-User-ID == resource.patient_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Patient-scoped reads and patient-portion/membership payments"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integer amounts >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: business_referential
    check: "POST /attachments must set exactly one of {claim_id, preauth_id}"
    error_id: ERR_ATTACHMENT_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /attachments"

  - priority: 7
    category: state
    check: "OCC: expected_coverage_version must equal current Coverage.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coverages/{coverageId}/verifications"

  - priority: 8
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: "SoD: insurance payment poster X-User-ID != Claim.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /payments (payer_type=INSURANCE)"

  - priority: 10
    category: business_referential
    check: "INSURANCE/PATIENT payment's claim_id references a claim in a postable state and matching patient/coverage"
    error_id: ERR_PAYMENT_CLAIM_MISMATCH
    http_status: 409
    applies_to: "POST /payments"

  - priority: 11
    category: business_referential
    check: "Secondary claim (primary_claim_id set) requires that primary claim already ADJUDICATED/DENIED/CLOSED"
    error_id: ERR_PRIMARY_CLAIM_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  - priority: 12
    category: state
    check: "Billing Coverage.status must be ACTIVE  [conflict-1 lower-priority member: state]"
    error_id: ERR_COVERAGE_INACTIVE
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  - priority: 13
    category: state
    check: "Coverage must have at least one Verification record (never-verified coverage fails here)"
    error_id: ERR_VERIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  - priority: 14
    category: business_temporal
    check: "The coverage's latest Verification must not be EXPIRED at clock (a record exists but has lapsed)  [conflict-2 higher-priority member: temporal]"
    error_id: ERR_VERIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "Per-code frequency limit not exceeded in rolling window  [conflict-2 lower-priority member: constraint]"
    error_id: ERR_FREQUENCY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  - priority: 16
    category: business_constraint
    check: "Narrative required when a line's Procedure.requires_narrative"
    error_id: ERR_MISSING_NARRATIVE
    http_status: 422
    applies_to: "POST /claims/{id}/submit"

  - priority: 17
    category: business_constraint
    check: "Attachment required when a line's Procedure.requires_attachment"
    error_id: ERR_MISSING_ATTACHMENT
    http_status: 422
    applies_to: "POST /claims/{id}/submit, POST /preauthorizations/{id}/submit"

  - priority: 18
    category: business_temporal
    check: "New Coverage may not overlap an existing ACTIVE coverage for the same patient+plan (closed intervals; adjacency counts as overlap)"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /coverages"

  - priority: 19
    category: business_temporal
    check: "New Membership may not overlap an existing non-CANCELLED membership for the same patient (half-open intervals; adjacency allowed)"
    error_id: ERR_MEMBERSHIP_OVERLAP
    http_status: 409
    applies_to: "POST /memberships"

  - priority: 20
    category: business_fiscal
    check: "Coverage must have remaining annual maximum (remaining_max > 0)  [conflict-1 higher-priority-number member: fiscal]"
    error_id: ERR_ANNUAL_MAXIMUM_EXCEEDED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  - priority: 21
    category: business_fiscal
    check: "Patient payment may not exceed the claim's outstanding patient portion"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payments (payer_type=PATIENT)"

  - priority: 22
    category: business_constraint
    check: "Appeal only from DENIED/ADJUDICATED and appeal_count < APPEAL_LIMIT"
    error_id: ERR_APPEAL_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /claims/{id}/appeal"

  - priority: 23
    category: state
    check: "Membership must have positive balance and not be CANCELLED to accept dues payment"
    error_id: ERR_MEMBERSHIP_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /memberships/{id}/pay"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Ops / clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is 2026-05-01T00:00:00Z (never real wall-clock)."
    roles: [BillingManager]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["Logical clock set to to_iso8601 for all deadline/expiry/aging/overdue evaluations"]

  - method: POST
    path: "/billing/run"
    description: "Run membership billing + aging recompute: charge lapsed periods, flip ACTIVE->PAST_DUE/CANCELLED, recompute claim aging."
    roles: [BillingManager]
    code: 200
    input: []
    output: "null"
    side_effects:
      - "membership_billing over all non-CANCELLED memberships"
      - "claim_aging recompute; patient_balance recompute"

  # --- Patient ---
  - method: POST
    path: "/patients"
    description: "Create a Patient"
    roles: [FrontOffice, BillingManager]
    code: 201
    input: [full_name, date_of_birth, email]
    output: Patient
    side_effects: ["status=ACTIVE, balance_cents=0"]

  - method: GET
    path: "/patients/{patientId}"
    description: "Get a Patient (with computed balance_cents/status)"
    roles: [FrontOffice, Biller, BillingManager, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- InsurancePlan (config) ---
  - method: POST
    path: "/insurance-plans"
    description: "Create an InsurancePlan"
    roles: [BillingManager]
    code: 201
    input: ["payer_name", "plan_name", "annual_maximum_cents?", "deductible_cents?", "deductible_applies_to?", "preventive_coinsurance_pct?", "basic_coinsurance_pct?", "major_coinsurance_pct?", "cob_method?"]
    output: InsurancePlan
    side_effects: []

  # --- Procedure (config) ---
  - method: POST
    path: "/procedures"
    description: "Create a Procedure catalog entry"
    roles: [BillingManager]
    code: 201
    input: ["cdt_code", "description", "category", "ucr_fee_cents", "frequency_limit_per_year?", "requires_narrative?", "requires_attachment?"]
    output: Procedure
    side_effects: []

  # --- MembershipPlan (config) ---
  - method: POST
    path: "/membership-plans"
    description: "Create a MembershipPlan"
    roles: [BillingManager]
    code: 201
    input: ["name", "annual_fee_cents", "billing_period?", "discount_pct?", "included_cdt_codes?"]
    output: MembershipPlan
    side_effects: []

  # --- Coverage ---
  - method: POST
    path: "/coverages"
    description: "Create a Coverage (Patient x InsurancePlan) with COB priority"
    roles: [FrontOffice, BillingManager]
    code: 201
    input: ["patient_id", "insurance_plan_id", "priority", "subscriber_id", "relationship?", "effective_date", "term_date"]
    output: Coverage
    side_effects: ["status computed from dates; benefits_used_cents=0; deductible_met_cents=0; ERR_COVERAGE_OVERLAP on interval collision"]

  - method: GET
    path: "/coverages/{coverageId}"
    description: "Get a Coverage"
    roles: [FrontOffice, Biller, BillingManager, Patient]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  - method: GET
    path: "/coverages"
    description: "List/filter Coverages"
    roles: [FrontOffice, Biller, BillingManager, Patient]
    code: 200
    input: ["patient_id?", "insurance_plan_id?", "priority?", "status?", "limit?", "offset?"]
    output: "Coverage[]"
    side_effects: []

  - method: POST
    path: "/coverages/{coverageId}/verifications"
    description: "Create a benefit Verification snapshot for a Coverage (OCC on Coverage.version)"
    roles: [FrontOffice, BillingManager]
    code: 201
    input: ["expected_coverage_version", "verified_annual_maximum_cents", "verified_deductible_cents", "verified_preventive_pct", "verified_basic_pct", "verified_major_pct"]
    output: Verification
    side_effects: ["verified_at=clock; expires_at=verified_at+VERIFICATION_VALIDITY_DAYS; supersedes prior verification; increments Coverage.version by 1"]

  # --- Verification ---
  - method: GET
    path: "/verifications/{verificationId}"
    description: "Get a Verification"
    roles: [FrontOffice, Biller, BillingManager]
    code: 200
    input: []
    output: Verification
    side_effects: []

  - method: GET
    path: "/verifications"
    description: "List/filter Verifications"
    roles: [FrontOffice, Biller, BillingManager]
    code: 200
    input: ["coverage_id?", "status?", "limit?", "offset?"]
    output: "Verification[]"
    side_effects: []

  # --- PreAuthorization ---
  - method: POST
    path: "/preauthorizations"
    description: "Create a DRAFT PreAuthorization"
    roles: [Biller, BillingManager]
    code: 201
    input: ["patient_id", "coverage_id", "procedures", "narrative?"]
    output: PreAuthorization
    side_effects: ["status=DRAFT; attachment_count=0"]

  - method: GET
    path: "/preauthorizations/{preauthId}"
    description: "Get a PreAuthorization"
    roles: [FrontOffice, Biller, BillingManager]
    code: 200
    input: []
    output: PreAuthorization
    side_effects: []

  - method: GET
    path: "/preauthorizations"
    description: "List/filter PreAuthorizations"
    roles: [FrontOffice, Biller, BillingManager]
    code: 200
    input: ["patient_id?", "coverage_id?", "status?", "limit?", "offset?"]
    output: "PreAuthorization[]"
    side_effects: []

  - method: POST
    path: "/preauthorizations/{preauthId}/submit"
    description: "Submit or resubmit a PreAuthorization (DRAFT/PENDED -> SUBMITTED)"
    roles: [Biller, BillingManager]
    code: 200
    input: []
    output: PreAuthorization
    side_effects: ["estimated_benefit_cents computed; submitted_at set"]

  - method: POST
    path: "/preauthorizations/{preauthId}/decision"
    description: "Record carrier decision (SUBMITTED -> APPROVED/DENIED/PENDED)"
    roles: [Biller, BillingManager]
    code: 200
    input: ["outcome"]
    output: PreAuthorization
    side_effects: ["APPROVED sets approved_amount_cents"]

  # --- Attachment (polymorphic) ---
  - method: POST
    path: "/attachments"
    description: "Upload an attachment tied to exactly one of a Claim or a PreAuthorization"
    roles: [FrontOffice, Biller, BillingManager]
    code: 201
    input: ["claim_id?", "preauth_id?", "kind", "filename", "note?"]
    output: Attachment
    side_effects: ["ERR_ATTACHMENT_TARGET_REQUIRED unless exactly one target set; increments target attachment_count"]

  - method: GET
    path: "/attachments/{attachmentId}"
    description: "Get an Attachment"
    roles: [FrontOffice, Biller, BillingManager]
    code: 200
    input: []
    output: Attachment
    side_effects: []

  - method: GET
    path: "/attachments"
    description: "List/filter Attachments"
    roles: [FrontOffice, Biller, BillingManager]
    code: 200
    input: ["claim_id?", "preauth_id?", "kind?", "limit?", "offset?"]
    output: "Attachment[]"
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "Create a DRAFT Claim"
    roles: [Biller, BillingManager]
    code: 201
    input: ["patient_id", "coverage_id", "procedures", "service_date", "narrative?", "preauth_id?", "primary_claim_id?"]
    output: Claim
    side_effects: ["status=DRAFT; total_billed_cents computed"]

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a Claim (with aging + estimate/final fields)"
    roles: [Biller, BillingManager, Patient]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List/filter Claims"
    roles: [Biller, BillingManager, Patient]
    code: 200
    input: ["patient_id?", "coverage_id?", "preauth_id?", "primary_claim_id?", "status?", "aging_bucket?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/claims/{claimId}/submit"
    description: "Submit a Claim (DRAFT -> SUBMITTED); runs verification/frequency/annual-max validations and estimate"
    roles: [Biller, BillingManager]
    code: 200
    input: []
    output: Claim
    side_effects: ["submitted_by_user_id/submitted_at set; estimated_insurance_cents/estimated_patient_portion_cents computed"]

  - method: POST
    path: "/claims/{claimId}/appeal"
    description: "Appeal a DENIED/ADJUDICATED Claim (-> APPEALED)"
    roles: [Biller, BillingManager]
    code: 200
    input: []
    output: Claim
    side_effects: ["appeal_count += 1"]

  # --- Payment ---
  - method: POST
    path: "/payments"
    description: "Post an INSURANCE EOB payment (adjudicates a claim) or a PATIENT-portion payment"
    roles: [Biller, BillingManager, Patient]
    code: 201
    input: ["patient_id", "payer_type", "amount_cents", "claim_id?", "eob_lines?", "is_denial?"]
    output: Payment
    side_effects:
      - "INSURANCE: adjudicates/denies claim; cascades to Coverage.benefits_used_cents/deductible_met_cents and Patient.balance_cents"
      - "PATIENT: reduces claim patient portion + Patient.balance_cents; may CLOSE the claim"
      - "status=POSTED; posted_at=clock"

  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a Payment"
    roles: [Biller, BillingManager, Patient]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List/filter Payments"
    roles: [Biller, BillingManager, Patient]
    code: 200
    input: ["claim_id?", "patient_id?", "payer_type?", "status?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/payments/{paymentId}/reverse"
    description: "Reverse a POSTED payment (compensating cascade)"
    roles: [BillingManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["status=REVERSED; restores all ledger side effects of the original posting"]

  # --- Membership ---
  - method: POST
    path: "/memberships"
    description: "Enroll a Patient in a MembershipPlan"
    roles: [FrontOffice, BillingManager, Patient]
    code: 201
    input: ["patient_id", "membership_plan_id", "period_start", "period_end"]
    output: Membership
    side_effects: ["status=ACTIVE; paid_through_date=period_start; ERR_MEMBERSHIP_OVERLAP on interval collision"]

  - method: GET
    path: "/memberships/{membershipId}"
    description: "Get a Membership"
    roles: [FrontOffice, BillingManager, Patient]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/memberships"
    description: "List/filter Memberships"
    roles: [FrontOffice, BillingManager, Patient]
    code: 200
    input: ["patient_id?", "membership_plan_id?", "status?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  - method: POST
    path: "/memberships/{membershipId}/pay"
    description: "Pay membership dues (PAST_DUE -> ACTIVE)"
    roles: [Patient, FrontOffice, BillingManager]
    code: 200
    input: ["amount_cents"]
    output: Membership
    side_effects: ["balance_cents reduced; paid_through_date advanced; past_due_periods=0; Patient.balance_cents reduced"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role header missing or invalid" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Patient acts on a resource whose patient_id != X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, negative amount" }
  - { id: ERR_ATTACHMENT_TARGET_REQUIRED, http: 422, condition: "POST /attachments without exactly one of claim_id/preauth_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_coverage_version != current Coverage.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Insurance payment poster is the claim's submitter" }
  - { id: ERR_PAYMENT_CLAIM_MISMATCH, http: 409, condition: "Payment claim not in a postable state or patient/coverage mismatch" }
  - { id: ERR_PRIMARY_CLAIM_NOT_ADJUDICATED, http: 409, condition: "Secondary claim submitted before its primary claim is adjudicated/denied/closed" }
  - { id: ERR_COVERAGE_INACTIVE, http: 409, condition: "Billing coverage status is not ACTIVE" }
  - { id: ERR_VERIFICATION_REQUIRED, http: 409, condition: "Coverage has no VERIFIED verification at submit" }
  - { id: ERR_VERIFICATION_EXPIRED, http: 409, condition: "The coverage's verification is EXPIRED at clock" }
  - { id: ERR_FREQUENCY_LIMIT_EXCEEDED, http: 409, condition: "Procedure frequency limit exceeded in the rolling window" }
  - { id: ERR_MISSING_NARRATIVE, http: 422, condition: "A line requires a narrative but none supplied" }
  - { id: ERR_MISSING_ATTACHMENT, http: 422, condition: "A line requires an attachment but none present" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "New coverage overlaps an existing ACTIVE coverage for same patient+plan (closed intervals)" }
  - { id: ERR_MEMBERSHIP_OVERLAP, http: 409, condition: "New membership overlaps an existing non-CANCELLED membership (half-open intervals)" }
  - { id: ERR_ANNUAL_MAXIMUM_EXCEEDED, http: 409, condition: "No remaining annual maximum on the coverage" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Patient payment exceeds outstanding patient portion" }
  - { id: ERR_APPEAL_NOT_ALLOWED, http: 409, condition: "Claim not appealable or appeal limit reached" }
  - { id: ERR_MEMBERSHIP_NOT_PAYABLE, http: 409, condition: "Membership has no balance or is CANCELLED" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: FrontOffice
    description: "Front-desk staff: register patients, build coverages, run benefit verifications, upload attachments, enroll memberships."
    identity: opaque
    exclusive_operations:
      - "POST /coverages/{coverageId}/verifications — run verification (shared with BillingManager)"
    shared_operations:
      - "POST /patients, POST /coverages, POST /attachments, POST /memberships, POST /memberships/{id}/pay"
      - "GET reads on patients, coverages, verifications, preauthorizations, attachments, memberships"

  - name: Biller
    description: "Billing specialist: pre-authorizations, claims, appeals, attachments, and posting insurance/patient payments (subject to SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /preauthorizations, POST /preauthorizations/{id}/submit, POST /preauthorizations/{id}/decision"
      - "POST /claims, POST /claims/{id}/submit, POST /claims/{id}/appeal"
    shared_operations:
      - "POST /payments (INSURANCE + PATIENT) — shared with BillingManager, gated by SoD"
      - "POST /attachments; GET reads on claims, payments, preauthorizations, attachments, verifications"

  - name: BillingManager
    description: "Billing manager: catalog/plan configuration, billing runs, clock control, payment reversals; may also submit claims and post payments (SoD still applies)."
    identity: opaque
    exclusive_operations:
      - "POST /insurance-plans, POST /procedures, POST /membership-plans"
      - "POST /billing/run, POST /_clock/set_current_utc, POST /payments/{id}/reverse"
    shared_operations:
      - "Everything Biller and FrontOffice can do (claims, payments, coverages, verifications, attachments, memberships)"

  - name: Patient
    description: "The patient/subscriber: reads own records, pays own patient-portion and membership dues, self-enrolls in memberships."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "GET own patient, coverages, claims, payments, memberships"
      - "POST /payments (payer_type=PATIENT, own claim), POST /memberships, POST /memberships/{id}/pay"
