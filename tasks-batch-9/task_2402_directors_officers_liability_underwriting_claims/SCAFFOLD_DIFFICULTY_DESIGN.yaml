  - rule_id: resource_temporal_overlap
    instances:
      - name: layer_band_overlap_versus_identical_band_coparticipation
        grounds:
          - validations[priority=70]
          - validations[priority=71]
          - validations[priority=45]
          - validations[priority=87]
          - calculations.tower_placement_posture
          - state_machines.Layer.ATTACHED_to_EXHAUSTED
          - entities.Layer.fields.participation_pct
        distinguishing_aspect: |
          Interval semantics #1 — intervals in MONEY space. A layer band is the half-open interval
          [attachment_point_usd, attachment_point_usd + limit_usd). Three outcomes must be told
          apart: an EXACTLY identical band is admitted as quota-share co-participation, an ADJACENT
          band (gap = 0) is admitted because the comparison is >= on the upper edge, and a PARTIALLY
          overlapping band is refused. Overlap is checked before both oversubscription and the tower
          limit, so a partially overlapping band that would also breach the program target still
          answers ERR_LAYER_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One bound Policy of Vantiq Bio Inc: shared_aggregate_limit_usd 10,000,000, program_target_limit_usd 20,000,000, tower_sealed false, no Layers, tower_posture INCOMPLETE."
