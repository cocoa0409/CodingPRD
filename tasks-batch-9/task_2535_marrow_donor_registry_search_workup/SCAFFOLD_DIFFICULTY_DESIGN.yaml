            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "${wc_id}", collection_center_id: "${ctr_id}", start_at: "2026-10-11T08:00:00Z", expected_workup_case_version: "${wc_ver1}" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { bk1_id: "$.data.id" }
