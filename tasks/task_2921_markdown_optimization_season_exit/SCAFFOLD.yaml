    output: Item[]
    side_effects: []
  - method: GET
    path: "/items/{item_id}"
    description: "Fetch one item with its computed lifecycle, sell-through and reserve fields"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, VendorRep, Controller]
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: GET
    path: "/items/{item_id}/sales-weeks"
    description: "List the item's posted weekly sales history in week_ending_date ASC order"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: ["limit?", "offset?"]
    output: SalesWeek[]
    side_effects: []
  - method: GET
    path: "/sales-weeks"
    description: "List posted sales weeks across items; item_id narrows the set, week_ending_date ASC then created_at ASC"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: ["item_id?", "week_ending_date?", "limit?", "offset?"]
    output: SalesWeek[]
    side_effects: []
  - method: GET
    path: "/sales-weeks/{sales_week_id}"
    description: "Fetch one posted sales week with its computed price_relative_pct"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: []
    output: SalesWeek
    side_effects: []
  - method: GET
    path: "/items/{item_id}/elasticity-estimates"
    description: "List the elasticity estimates produced for the item, created_at ASC"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ElasticityEstimate[]
    side_effects: []
  - method: GET
    path: "/elasticity-estimates"
    description: "List elasticity estimates across items; item_id filters to one item"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: ["item_id?", "status?", "confidence?", "limit?", "offset?"]
    output: ElasticityEstimate[]
    side_effects: []
  - method: GET
    path: "/elasticity-estimates/{estimate_id}"
    description: "Fetch one elasticity estimate with its coefficient, sample size and confidence"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: []
    output: ElasticityEstimate
    side_effects: []

  # ---- Reads: plans, ladders, executions -----------------------------------
  - method: GET
    path: "/markdown-plans"
    description: "List markdown plans; season_id / item_id / elasticity_estimate_id / superseded_by_plan_id narrow the set"
    roles: [PricingAnalyst, MerchandiseDirector, VendorRep, Controller]
    code: 200
    input: ["season_id?", "item_id?", "elasticity_estimate_id?", "superseded_by_plan_id?", "plan_type?", "status?", "limit?", "offset?"]
    output: MarkdownPlan[]
    side_effects: []
  - method: GET
    path: "/markdown-plans/{markdown_plan_id}"
    description: "Fetch one markdown plan with its recommended depth and markdown ledger totals"
    roles: [PricingAnalyst, MerchandiseDirector, VendorRep, Controller]
    code: 200
    input: []
    output: MarkdownPlan
    side_effects: []
  - method: GET
    path: "/markdown-plans/{markdown_plan_id}/steps"
    description: "List the plan's depth ladder in step_index ASC order"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MarkdownStep[]
    side_effects: []
  - method: GET
    path: "/markdown-steps"
    description: "List ladder rungs across plans; markdown_plan_id narrows the set, step_index ASC"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: ["markdown_plan_id?", "status?", "limit?", "offset?"]
    output: MarkdownStep[]
    side_effects: []
  - method: GET
    path: "/markdown-steps/{markdown_step_id}"
    description: "Fetch one ladder rung with its computed price_cents and occupancy window"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: []
    output: MarkdownStep
    side_effects: []
  - method: GET
    path: "/zone-executions"
    description: "List zone executions; markdown_plan_id / markdown_step_id / price_zone_id / store_id narrow the set"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: ["markdown_plan_id?", "markdown_step_id?", "price_zone_id?", "store_id?", "execution_scope?", "status?", "signage_status?", "limit?", "offset?"]
    output: ZoneExecution[]
    side_effects: []
  - method: GET
    path: "/zone-executions/{zone_execution_id}"
    description: "Fetch one zone execution with its signage state and per-line markdown amounts"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: []
    output: ZoneExecution
    side_effects: []

  # ---- Reads: clearance space, vendor money, disposition --------------------
  - method: GET
    path: "/clearance-reservations"
    description: "List clearance reservations; season_id / store_id / markdown_plan_id narrow the set"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: ["season_id?", "store_id?", "markdown_plan_id?", "status?", "limit?", "offset?"]
    output: ClearanceReservation[]
    side_effects: []
  - method: GET
    path: "/clearance-reservations/{reservation_id}"
    description: "Fetch one clearance reservation with its allocation_rank"
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, Controller]
    code: 200
    input: []
    output: ClearanceReservation
    side_effects: []
  - method: GET
    path: "/allowance-agreements"
    description: "List vendor allowance agreements; season_id filters to one season"
    roles: [PricingAnalyst, MerchandiseDirector, VendorRep, Controller]
    code: 200
    input: ["season_id?", "vendor_code?", "item_category_scope?", "status?", "limit?", "offset?"]
    output: VendorAllowanceAgreement[]
    side_effects: []
  - method: GET
    path: "/allowance-agreements/{agreement_id}"
    description: "Fetch one allowance agreement with its funding cap and remaining headroom"
    roles: [PricingAnalyst, MerchandiseDirector, VendorRep, Controller]
    code: 200
    input: []
    output: VendorAllowanceAgreement
    side_effects: []
  - method: GET
    path: "/vendor-claims"
    description: "List vendor claims; allowance_agreement_id / markdown_plan_id narrow the set"
    roles: [PricingAnalyst, MerchandiseDirector, VendorRep, Controller]
    code: 200
    input: ["allowance_agreement_id?", "markdown_plan_id?", "status?", "limit?", "offset?"]
    output: VendorClaim[]
    side_effects: []
  - method: GET
    path: "/vendor-claims/{claim_id}"
    description: "Fetch one vendor claim with its recognized amount and rejection reason"
    roles: [PricingAnalyst, MerchandiseDirector, VendorRep, Controller]
    code: 200
    input: []
    output: VendorClaim
    side_effects: []
  - method: GET
    path: "/disposition-orders"
    description: "List disposition orders; season_id / item_id narrow the set"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: ["season_id?", "item_id?", "channel?", "status?", "limit?", "offset?"]
    output: DispositionOrder[]
    side_effects: []
  - method: GET
    path: "/disposition-orders/{disposition_order_id}"
    description: "Fetch one disposition order with its projected and settled recovery"
    roles: [PricingAnalyst, MerchandiseDirector, Controller]
    code: 200
    input: []
    output: DispositionOrder
    side_effects: []

  # ---- Writes: season, zone and store registry ------------------------------
  - method: POST
    path: "/seasons"
    description: "Register a season with its exit targets and chain clearance-space budget"
    roles: [MerchandiseDirector]
    code: 201
    input: [code, category, season_start_date, season_end_date, exit_target_date, exit_units_target, sell_through_target_pct, clearance_space_units]
    output: Season
    side_effects:
      - "status initialised to PLANNING"
      - "reserved_clearance_units, committed_clearance_units and projected_exit_units initialised to 0"
  - method: POST
    path: "/seasons/{season_id}/transition"
    description: "Advance the season lifecycle: PLANNING -> ACTIVE -> EXIT_WINDOW -> CLOSED"
    roles: [MerchandiseDirector]
    code: 200
    input: [to_status]
    output: Season
    side_effects:
      - "on to_status == EXIT_WINDOW: every Item of the season is reclassified, so items whose weeks_to_exit is <= EXIT_PENDING_WEEKS move to EXIT_PENDING"
      - "on to_status == CLOSED: every VendorAllowanceAgreement in {PROPOSED, COUNTERED} moves to EXPIRED, every VendorClaim in SUBMITTED against those agreements moves to REJECTED with rejection_reason = AGREEMENT_EXPIRED, and every RESERVED or COMMITTED ClearanceReservation of the season moves to RELEASED; closing requires an existing FINAL exit review and no DispositionOrder in DRAFT or APPROVED"
      - "increments Season.version by 1"
  - method: POST
    path: "/price-zones"
    description: "Create a CHAIN, REGION or STORE price zone; a REGION or STORE zone may name a parent_zone_id"
    roles: [MerchandiseDirector]
    code: 201
    input: ["zone_code", "zone_type", "parent_zone_id?", "signage_lead_days?", "region_code?"]
    output: PriceZone
    side_effects:
      - "signage_lead_days defaults from SIGNAGE_LEAD_DEFAULT_DAYS[zone_type] when omitted"
  - method: POST
    path: "/stores"
    description: "Register a store inside a price zone with its clearance bay capacity"
    roles: [MerchandiseDirector]
    code: 201
    input: ["store_number", "price_zone_id", "clearance_bay_units", "region_code?", "status?"]
    output: Store
    side_effects:
      - "committed_clearance_units initialised to 0 and available_clearance_units initialised to clearance_bay_units"
  - method: PATCH
    path: "/stores/{store_id}"
    description: "Update a store's operating status or clearance bay capacity"
    roles: [MerchandiseDirector]
    code: 200
    input: ["status?", "clearance_bay_units?"]
    output: Store
    side_effects:
      - "available_clearance_units recomputed as clearance_bay_units - committed_clearance_units"
      - "increments Store.version by 1"

  # ---- Writes: items, sales history, elasticity -----------------------------
  - method: POST
    path: "/items"
    description: "Register an item in a season; protected_until_date is derived from first_receipt_date and the category's protected new-arrival period"
    roles: [PricingAnalyst, MerchandiseDirector]
    code: 201
    input: [sku, season_id, category, cluster_code, vendor_code, first_receipt_date, original_retail_cents, unit_cost_cents, units_received_total]
    output: Item
    side_effects:
      - "protected_until_date = first_receipt_date + PROTECTED_NEW_ARRIVAL_DAYS[category] days"
      - "current_retail_cents initialised to original_retail_cents and on_hand_units to units_received_total"
      - "calculations.lifecycle_stage_classification runs, so lifecycle_stage is NEW_ARRIVAL while the protected period is open"
  - method: POST
    path: "/items/{item_id}/sales-weeks"
    description: "Post one week of unit sales at a ticket price, which drives sell-through and elasticity"
    roles: [PricingAnalyst]
    code: 201
    input: [week_ending_date, units_sold, ticket_price_cents]
    output: SalesWeek
    side_effects:
      - "price_relative_pct = round_half_up(ticket_price_cents * 100 / Item.original_retail_cents, 2)"
      - "Item.units_sold_total += units_sold; Item.on_hand_units -= units_sold; Item.sample_weeks += 1"
      - "Item.sell_through_pct and Item.weeks_of_supply recomputed"
      - "calculations.lifecycle_stage_classification re-runs, which can move the item NEW_ARRIVAL -> AGING or CORE -> AGING"
      - "increments Item.version by 1"
  - method: POST
    path: "/elasticity-estimates"
    description: "Estimate the item's price elasticity from its own history or from its cluster peers"
    roles: [PricingAnalyst]
    code: 201
    input: ["item_id", "method?"]
    output: ElasticityEstimate
    side_effects:
      - "calculations.elasticity_coefficient_estimation runs; method AUTO resolves to OWN_HISTORY when the item has at least MIN_SAMPLE_WEEKS distinct ticket prices, otherwise to CLUSTER_POOLED"
      - "elasticity_coefficient, sample_weeks_used, peer_items_used, confidence and estimated_at stamped; status initialised to DRAFT"
  - method: POST
    path: "/elasticity-estimates/{estimate_id}/certify"
    description: "Certify an elasticity estimate so a markdown plan may be submitted against it; a LOW-confidence estimate needs override_low_confidence == true"
    roles: [PricingAnalyst, MerchandiseDirector]
    code: 200
    input: ["override_low_confidence?"]
    output: ElasticityEstimate
    side_effects:
      - "status moves DRAFT -> CERTIFIED and certified_at is stamped with the logical clock instant"
      - "every other ElasticityEstimate of the same item_id whose status is DRAFT or CERTIFIED moves to SUPERSEDED"
      - "increments ElasticityEstimate.version by 1"

  # ---- Writes: markdown plans and depth ladders ------------------------------
  - method: POST
    path: "/markdown-plans"
    description: "Open a markdown plan for one item of a season against a certified-or-draft elasticity estimate; expected_item_version must equal the item's current version"
    roles: [PricingAnalyst]
    code: 201
    input: [season_id, item_id, elasticity_estimate_id, plan_type, exit_date_target, expected_item_version]
    output: MarkdownPlan
    side_effects:
      - "calculations.recommended_first_step_depth runs and stamps recommended_depth_pct"
      - "created_by_user_id stamped from X-User-ID; status initialised to DRAFT; ladder_step_count 0"
      - "any earlier MarkdownPlan for the same (season_id, item_id) whose status is DRAFT or APPROVED moves to SUPERSEDED, its superseded_by_plan_id is set to the new plan, its PLANNED and SCHEDULED steps move to SUPERSEDED, and its RESERVED or COMMITTED ClearanceReservations move to RELEASED"
      - "increments Item.version by 1"
  - method: POST
    path: "/markdown-plans/{markdown_plan_id}/steps"
    description: "Append the next rung to the plan's depth ladder; the rung must clear the protected new-arrival period, the cadence floor, the exit-date buffer and the item's existing occupancy windows"
    roles: [PricingAnalyst]
    code: 201
    input: [step_index, effective_date, depth_pct]
    output: MarkdownStep
    side_effects:
      - "price_cents computed by calculations.markdown_step_price"
      - "window_end_date_exclusive set to MarkdownPlan.exit_date_target; the previous rung's window_end_date_exclusive is rewritten to this rung's effective_date"
      - "MarkdownPlan.ladder_step_count += 1 and MarkdownPlan.projected_exit_units recomputed"
      - "increments MarkdownPlan.version by 1"
  - method: POST
    path: "/markdown-plans/{markdown_plan_id}/submit"
    description: "Submit the plan for director review; requires a certified elasticity estimate, a markdown-eligible item and at least one rung"
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: MarkdownPlan
    side_effects:
      - "status moves DRAFT -> SUBMITTED"
      - "increments MarkdownPlan.version by 1"
  - method: POST
    path: "/markdown-plans/{markdown_plan_id}/request-revision"
    description: "Send a submitted plan back to the analyst with a revision reason"
    roles: [MerchandiseDirector]
    code: 200
    input: [revision_reason]
    output: MarkdownPlan
    side_effects:
      - "status moves SUBMITTED -> REVISION_REQUESTED and revision_round += 1"
      - "increments MarkdownPlan.version by 1"
  - method: POST
    path: "/markdown-plans/{markdown_plan_id}/reopen"
    description: "Reopen a revision-requested plan for editing, optionally clearing the whole ladder"
    roles: [PricingAnalyst]
    code: 200
    input: ["clear_ladder?"]
    output: MarkdownPlan
    side_effects:
      - "status moves REVISION_REQUESTED -> DRAFT"
      - "when clear_ladder == true: every PLANNED MarkdownStep of the plan moves to SUPERSEDED and ladder_step_count resets to 0"
      - "increments MarkdownPlan.version by 1"
  - method: POST
    path: "/markdown-plans/{markdown_plan_id}/approve"
    description: "Approve a submitted plan; the approving director must not be the plan's creator"
    roles: [MerchandiseDirector]
    code: 200
    input: []
    output: MarkdownPlan
    side_effects:
      - "status moves SUBMITTED -> APPROVED and approved_by_user_id is stamped from X-User-ID"
      - "increments MarkdownPlan.version by 1"

  # ---- Writes: zone execution and signage compliance -------------------------
  - method: POST
    path: "/zone-executions"
    description: "Schedule a rung's price change for a chain zone, a region zone or a single store, and open the signage window"
    roles: [PricingAnalyst]
    code: 201
    input: ["markdown_plan_id", "markdown_step_id", "price_zone_id", "execution_scope", "effective_date", "units_in_scope", "store_id?"]
    output: ZoneExecution
    side_effects:
      - "signage_due_date = effective_date - PriceZone.signage_lead_days days; signage_status initialised to PENDING; status initialised to SCHEDULED"
      - "the referenced MarkdownStep moves PLANNED -> SCHEDULED"
      - "increments MarkdownPlan.version by 1"
  - method: POST
    path: "/zone-executions/{zone_execution_id}/post-signage"
    description: "Store manager records that the markdown signage is up; posting after signage_due_date lands NON_COMPLIANT instead of POSTED"
    roles: [StoreManager]
    code: 200
    input: []
    output: ZoneExecution
    side_effects:
      - "signage_status moves PENDING -> POSTED when the logical clock date <= signage_due_date, otherwise PENDING -> NON_COMPLIANT"
      - "posted_at and posted_by_user_id stamped"
      - "increments ZoneExecution.version by 1"
  - method: POST
    path: "/zone-executions/{zone_execution_id}/verify-signage"
    description: "Director verifies posted signage, which is the safety gate for applying the price change"
    roles: [MerchandiseDirector]
    code: 200
    input: []
    output: ZoneExecution
    side_effects:
      - "signage_status moves POSTED -> VERIFIED and verified_by_user_id is stamped"
      - "increments ZoneExecution.version by 1"
  - method: POST
    path: "/zone-executions/{zone_execution_id}/apply"
    description: "Apply the scheduled price change; requires VERIFIED signage and drives the five-hop markdown apply cascade"
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: ZoneExecution
    side_effects:
      - "calculations.markdown_liability_line runs and stamps per_unit_markdown_cents, line_markdown_cents and price_cents_applied"
      - "status moves SCHEDULED -> APPLIED, applied_at stamped, and the MarkdownStep moves SCHEDULED -> EXECUTED"
      - "runs the markdown_apply_exit_window_cascade: Item.markdown_state and current_retail_cents update, Item.lifecycle_stage is reclassified, RESERVED ClearanceReservations of the item move to COMMITTED, Season counters shift from reserved to committed, and the season may auto-enter EXIT_WINDOW"
      - "MarkdownPlan.gross_markdown_cents += line_markdown_cents, net_markdown_cents recomputed, and the plan moves APPROVED -> EXECUTING on its first applied execution"
      - "increments ZoneExecution.version and Item.version by 1"
  - method: POST
    path: "/zone-executions/{zone_execution_id}/roll-back"
    description: "Reverse an applied price change and every side effect it produced"
    roles: [PricingAnalyst]
    code: 200
    input: [rollback_reason]
    output: ZoneExecution
    side_effects:
      - "status moves APPLIED -> ROLLED_BACK and the MarkdownStep moves EXECUTED -> SCHEDULED"
      - "Item.current_retail_cents, markdown_state, permanent_markdown_reserve_cents / promo_discount_cents and lifecycle_stage are restored, so the compensating invariant margin_exposure_cents = permanent_markdown_reserve_cents + promo_discount_cents holds again"
      - "COMMITTED ClearanceReservations of the item revert to RESERVED and the Season counters shift back from committed to reserved"
      - "MarkdownPlan.gross_markdown_cents -= line_markdown_cents and net_markdown_cents recomputed"
      - "increments ZoneExecution.version and Item.version by 1"

  # ---- Writes: clearance space allocation ------------------------------------
  - method: POST
    path: "/seasons/{season_id}/clearance-allocations"
    description: "Allocate clearance floor space for an approved plan across the season's open stores by the waterfall rule; all-or-nothing, and expected_season_version must equal the season's current version"
    roles: [PricingAnalyst]
    code: 201
    input: [markdown_plan_id, total_units, expected_season_version]
    output: ClearanceReservation[]
    side_effects:
      - "calculations.clearance_space_waterfall runs and creates one RESERVED ClearanceReservation per filled store, with allocation_rank 1..N in fill order"
      - "each filled Store.committed_clearance_units += reserved_units and available_clearance_units is recomputed"
      - "Season.reserved_clearance_units += total_units"
      - "increments Season.version by 1"
  - method: POST
    path: "/clearance-reservations/{reservation_id}/release"
    description: "Release a reserved or committed clearance allocation back to the store and the season budget"
    roles: [PricingAnalyst, MerchandiseDirector]
    code: 200
    input: ["release_reason?"]
    output: ClearanceReservation
    side_effects:
      - "status moves RESERVED or COMMITTED -> RELEASED and released_at is stamped"
      - "Store.committed_clearance_units -= reserved_units and available_clearance_units is recomputed"
      - "Season.reserved_clearance_units or committed_clearance_units -= reserved_units, matching the status the reservation held"
      - "increments ClearanceReservation.version and Season.version by 1"

  # ---- Writes: vendor allowance negotiation and funding ---------------------
  - method: POST
    path: "/allowance-agreements"
    description: "Open a vendor markdown-allowance negotiation for a vendor and item category inside a season; the retailer's opening offer sits on the table as PROPOSED"
    roles: [PricingAnalyst]
    code: 201
    input: [season_id, vendor_code, item_category_scope, current_share_pct, current_cap_cents]
    output: VendorAllowanceAgreement
    side_effects:
      - "status initialised to PROPOSED, round_index to 1, last_offer_by_role to PricingAnalyst and last_offer_by_user_id from X-User-ID"
      - "agreed_share_pct, funding_cap_cents and remaining_cap_cents stay null until the offer is accepted"
  - method: POST
    path: "/allowance-agreements/{agreement_id}/counter"
    description: "Put a counter-offer on the table; a VendorRep counter moves PROPOSED -> COUNTERED and a PricingAnalyst counter moves COUNTERED -> PROPOSED"
    roles: [PricingAnalyst, VendorRep]
    code: 200
    input: [share_pct, cap_cents]
    output: VendorAllowanceAgreement
    side_effects:
      - "current_share_pct and current_cap_cents overwritten with the counter terms"
      - "round_index += 1; last_offer_by_role and last_offer_by_user_id set to the acting party"
      - "increments VendorAllowanceAgreement.version by 1"
  - method: POST
    path: "/allowance-agreements/{agreement_id}/accept"
    description: "Accept the offer currently on the table; the accepting party's role must differ from last_offer_by_role"
    roles: [PricingAnalyst, VendorRep]
    code: 200
    input: []
    output: VendorAllowanceAgreement
    side_effects:
      - "status moves PROPOSED or COUNTERED -> AGREED"
      - "agreed_share_pct = current_share_pct, funding_cap_cents = current_cap_cents, remaining_cap_cents = funding_cap_cents, recognized_total_cents = 0"
      - "increments VendorAllowanceAgreement.version by 1"
  - method: POST
    path: "/vendor-claims"
    description: "Claim permanent-markdown funding from an agreed vendor allowance for one executing or completed plan"
    roles: [PricingAnalyst, MerchandiseDirector]
    code: 201
    input: [allowance_agreement_id, markdown_plan_id, claimed_cents]
    output: VendorClaim
    side_effects:
      - "status initialised to SUBMITTED and recognized_cents to 0"
  - method: POST
    path: "/vendor-claims/{claim_id}/recognize"
    description: "Controller recognises vendor funding, capped by the plan's share headroom and the agreement's remaining cap; drives the five-hop allowance-cap exhaustion cascade"
    roles: [Controller]
    code: 200
    input: []
    output: VendorClaim
    side_effects:
      - "calculations.vendor_funding_recognition runs and stamps recognized_cents; status moves SUBMITTED -> RECOGNIZED and recognized_by_user_id is stamped"
      - "runs the allowance_cap_exhaustion_cascade: agreement remaining_cap_cents -= recognized_cents and recognized_total_cents += recognized_cents; on exhaustion the agreement moves AGREED -> FUNDED, every other SUBMITTED claim against it moves to REJECTED with rejection_reason = CAP_EXHAUSTED"
      - "MarkdownPlan.vendor_funded_cents += recognized_cents and net_markdown_cents = gross_markdown_cents - vendor_funded_cents"
      - "increments VendorClaim.version and VendorAllowanceAgreement.version by 1"
  - method: POST
    path: "/vendor-claims/{claim_id}/reverse"
    description: "Reverse a recognised claim, returning the funding to the agreement's remaining cap"
    roles: [Controller]
    code: 200
    input: [reversal_reason]
    output: VendorClaim
    side_effects:
      - "status moves RECOGNIZED -> REVERSED"
      - "agreement remaining_cap_cents += recognized_cents, recognized_total_cents -= recognized_cents, and a FUNDED agreement returns to AGREED, so funding_cap_cents == remaining_cap_cents + sum of RECOGNIZED recognized_cents still holds"
      - "MarkdownPlan.vendor_funded_cents -= recognized_cents and net_markdown_cents recomputed"
      - "increments VendorClaim.version and VendorAllowanceAgreement.version by 1"

  # ---- Writes: residual inventory disposition -------------------------------
  - method: POST
    path: "/disposition-orders"
    description: "Commit residual units to a salvage, jobber or donation channel; SALVAGE and JOBBER require unit_recovery_cents and DONATION requires fmv_cents"
    roles: [PricingAnalyst]
    code: 201
    input: ["season_id", "item_id", "channel", "units", "unit_recovery_cents?", "fmv_cents?"]
    output: DispositionOrder
    side_effects:
      - "calculations.disposition_recovery runs and stamps projected_recovery_cents"
      - "created_by_user_id stamped from X-User-ID; status initialised to DRAFT"
      - "Item.units_committed_disposition += units, so item_available_units = on_hand_units - units_committed_disposition is conserved"
      - "increments Item.version by 1"
  - method: POST
    path: "/disposition-orders/{disposition_order_id}/approve"
    description: "Controller approves the disposition; the approver must not be the order's creator"
    roles: [Controller]
    code: 200
    input: []
    output: DispositionOrder
    side_effects:
      - "status moves DRAFT -> APPROVED and approved_by_user_id is stamped from X-User-ID"
      - "increments DispositionOrder.version by 1"
  - method: POST
    path: "/disposition-orders/{disposition_order_id}/settle"
    description: "Settle an approved disposition with the units actually shipped or donated"
    roles: [Controller]
    code: 200
    input: [settled_units]
    output: DispositionOrder
    side_effects:
      - "status moves APPROVED -> SETTLED; settled_units and settled_recovery_cents stamped from calculations.disposition_recovery on the settled quantity"
      - "Item.units_disposed_total += settled_units, Item.on_hand_units -= settled_units, Item.units_committed_disposition -= units"
      - "when Item.on_hand_units reaches 0 the item's markdown_state moves to SETTLED and lifecycle_stage to DISPOSED"
      - "increments DispositionOrder.version and Item.version by 1"
  - method: POST
    path: "/disposition-orders/{disposition_order_id}/cancel"
    description: "Cancel a draft or approved disposition and return its units to the item's available pool"
    roles: [PricingAnalyst, MerchandiseDirector]
    code: 200
    input: ["cancel_reason?"]
    output: DispositionOrder
    side_effects:
      - "status moves DRAFT or APPROVED -> CANCELLED"
      - "Item.units_committed_disposition -= units, restoring item_available_units = on_hand_units - units_committed_disposition"
      - "increments DispositionOrder.version and Item.version by 1"

  # ---- Writes: post-season review -------------------------------------------
  - method: POST
    path: "/seasons/{season_id}/exit-reviews"
    description: "Generate the season's margin and sell-through scorecard: PRELIMINARY while the season is ACTIVE or EXIT_WINDOW, FINAL while the season is EXIT_WINDOW (the FINAL review is the prerequisite for closing the season)"
    roles: [MerchandiseDirector, Controller]
    code: 201
    input: [review_type]
    output: SeasonExitReview
    side_effects:
      - "calculations.season_exit_scorecard runs in the variant matching review_type and stamps every money, unit and variance field"
      - "generated_at and generated_by_user_id stamped; the review is immutable once written"

  # ---- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every date-gated rule (protected periods, cadence, signage due dates, lifecycle aging) reads this clock."
    roles: [PricingAnalyst, MerchandiseDirector, StoreManager, VendorRep, Controller]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock is set to current_utc"
      - "calculations.lifecycle_stage_classification re-runs for every Item, which can move items NEW_ARRIVAL/CORE -> AGING -> CLEARANCE -> EXIT_PENDING and can flip RESERVED ClearanceReservations to COMMITTED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth --------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's §1.5 roles"
  - id: ERR_STORE_NOT_OWNED
    http: 403
    condition: "A StoreManager posts signage for a STORE-scope ZoneExecution whose store_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Plan approver equals the plan's creator, disposition approver equals the order's creator, or the accepting party's role equals the agreement's last_offer_by_role"
  # -- payload -----------------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "A required field is missing, or a field violates its declared type, enum membership or numeric range"
  # -- not found ---------------------------------------------------------------
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "season_id in the path or body matches no Season"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "item_id in the path or body matches no Item"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "price_zone_id or parent_zone_id matches no PriceZone"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "store_id in the path or body matches no Store"
  - id: ERR_ESTIMATE_NOT_FOUND
    http: 404
    condition: "estimate_id or elasticity_estimate_id matches no ElasticityEstimate"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "markdown_plan_id matches no MarkdownPlan"
  - id: ERR_STEP_NOT_FOUND
    http: 404
    condition: "markdown_step_id matches no MarkdownStep"
  - id: ERR_EXECUTION_NOT_FOUND
    http: 404
    condition: "zone_execution_id matches no ZoneExecution"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "reservation_id matches no ClearanceReservation"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreement_id or allowance_agreement_id matches no VendorAllowanceAgreement"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id matches no VendorClaim"
  - id: ERR_DISPOSITION_NOT_FOUND
    http: 404
    condition: "disposition_order_id matches no DispositionOrder"
  # -- concurrency -------------------------------------------------------------
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "expected_item_version does not equal the Item's current version on POST /markdown-plans"
  - id: ERR_STALE_SEASON_VERSION
    http: 412
    condition: "expected_season_version does not equal the Season's current version on POST /seasons/{season_id}/clearance-allocations"
  # -- state -------------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's current state does not declare the requested transition in §1.2, or a precondition of that transition with no dedicated error_id fails (apply before the execution's effective_date, apply when MarkdownStep.price_cents is not below Item.current_retail_cents, roll-back while a RECOGNIZED VendorClaim references the plan)"
  - id: ERR_SEASON_NOT_ACTIVE
    http: 409
    condition: "The governing Season is not ACTIVE or EXIT_WINDOW for an operation that requires an open season"
  - id: ERR_SEASON_NOT_IN_EXIT_WINDOW
    http: 409
    condition: "The governing Season is not EXIT_WINDOW for an exit-only operation: approving or settling a disposition order, or generating the FINAL exit review"
  - id: ERR_SEASON_CLOSED
    http: 409
    condition: "Any write against a Season whose status is CLOSED, including generating another exit review"
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "The governing MarkdownPlan is not APPROVED or EXECUTING when scheduling, applying or allocating against it"
  - id: ERR_PLAN_ALREADY_EXECUTING
    http: 409
    condition: "A new plan would supersede a prior plan that already has an APPLIED ZoneExecution"
  - id: ERR_SIGNAGE_ALREADY_POSTED
    http: 409
    condition: "post-signage called when signage_status is not PENDING"
  - id: ERR_SIGNAGE_NOT_POSTED
    http: 409
    condition: "verify-signage called when signage_status is not POSTED"
  - id: ERR_SIGNAGE_NOT_VERIFIED
    http: 409
    condition: "apply called while signage_status is PENDING, POSTED or NON_COMPLIANT"
  - id: ERR_EMPTY_LADDER
    http: 409
    condition: "submit called on a plan whose ladder_step_count is 0"
  - id: ERR_ELASTICITY_NOT_CERTIFIED
    http: 409
    condition: "submit called while the plan's ElasticityEstimate is DRAFT or SUPERSEDED, or the estimate belongs to a different item"
  - id: ERR_REVISION_ROUNDS_EXHAUSTED
    http: 409
    condition: "reopen called when revision_round already exceeds MAX_REVISION_ROUNDS"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "counter called when round_index has reached MAX_NEGOTIATION_ROUNDS"
  - id: ERR_PLAN_NOT_CLAIMABLE
    http: 409
    condition: "A vendor claim names a plan whose status is not EXECUTING or COMPLETED"
  - id: ERR_STEP_WINDOW_OVERLAP
    http: 409
    condition: "A new STORE-scope execution's half-open occupancy window intersects that of a live execution for the same item and store"
  - id: ERR_ZONE_SIGNAGE_WINDOW_CONFLICT
    http: 409
    condition: "Two live executions for the same item in the same price zone sit closer together than the zone's signage_lead_days"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A uniqueness key already exists: Season.code, Item.sku, Store.store_number, PriceZone.zone_code, (item_id, week_ending_date) or (season_id, review_type)"
  # -- business: eligibility and shape ----------------------------------------
  - id: ERR_MARKDOWN_NOT_ELIGIBLE
    http: 422
    condition: "submit called while Item.lifecycle_stage is NEW_ARRIVAL, CORE or DISPOSED"
  - id: ERR_ITEM_NOT_EXIT_ELIGIBLE
    http: 422
    condition: "A disposition order is created for an item whose lifecycle_stage is not CLEARANCE or EXIT_PENDING"
  - id: ERR_PROMO_NOT_CLAIMABLE
    http: 422
    condition: "A vendor claim names a plan whose plan_type is PROMOTIONAL"
  - id: ERR_ALLOWANCE_SCOPE_MISMATCH
    http: 422
    condition: "The agreement's vendor_code, item_category_scope or season_id does not match the claimed plan's item"
  - id: ERR_PROTECTED_PERIOD_ACTIVE
    http: 422
    condition: "A rung's effective_date is on or before the item's protected_until_date"
  - id: ERR_CADENCE_TOO_TIGHT
    http: 422
    condition: "A rung sits fewer than MIN_CADENCE_DAYS after the previous rung"
  - id: ERR_EXIT_DATE_MISSED
    http: 422
    condition: "A rung's effective_date is later than exit_date_target minus EXIT_BUFFER_DAYS"
  - id: ERR_EFFECTIVE_DATE_IN_PAST
    http: 422
    condition: "A rung's effective_date is before the logical clock's current date"
  - id: ERR_DEPTH_NOT_MONOTONIC
    http: 422
    condition: "A rung's depth_pct is not strictly greater than the previous rung's depth_pct"
  - id: ERR_STEP_INDEX_OUT_OF_SEQUENCE
    http: 422
    condition: "step_index does not equal MarkdownPlan.ladder_step_count + 1"
  - id: ERR_MAX_LADDER_STEPS
    http: 422
    condition: "The ladder already holds MAX_LADDER_STEPS rungs"
  - id: ERR_SIGNAGE_LEAD_VIOLATION
    http: 422
    condition: "An execution is scheduled so late that effective_date minus the zone's signage_lead_days is already in the past"
  - id: ERR_ZONE_SCOPE_MISMATCH
    http: 422
    condition: "execution_scope, the zone's zone_type, the presence of store_id, the store's zone membership or the rung's effective_date and plan ownership disagree"
  - id: ERR_DISPOSITION_CHANNEL_MISMATCH
    http: 422
    condition: "SALVAGE or JOBBER without unit_recovery_cents, DONATION without fmv_cents, or a channel carrying the other channel's money field"
  - id: ERR_INSUFFICIENT_PRICE_HISTORY
    http: 422
    condition: "An OWN_HISTORY estimate is requested for an item with fewer than MIN_SAMPLE_WEEKS sales weeks or with a single distinct ticket price"
  - id: ERR_EMPTY_PEER_POOL
    http: 422
    condition: "A CLUSTER_POOLED estimate is requested and no peer item in the same season, category and cluster holds a CERTIFIED estimate"
  - id: ERR_LOW_CONFIDENCE_NOT_OVERRIDDEN
    http: 422
    condition: "certify called on a LOW-confidence estimate without override_low_confidence == true"
  # -- business: fiscal and capacity ------------------------------------------
  - id: ERR_ZONE_UNITS_EXCEED_ON_HAND
    http: 409
    condition: "The item's live executions would cover more units than Item.on_hand_units"
  - id: ERR_SEASON_CLEARANCE_CAP_EXCEEDED
    http: 409
    condition: "A clearance allocation would push the season's reserved plus committed units past clearance_space_units"
  - id: ERR_CLEARANCE_SPACE_EXCEEDED
    http: 409
    condition: "The store waterfall cannot cover the requested units, so no reservation is created"
  - id: ERR_ALLOWANCE_CAP_EXHAUSTED
    http: 409
    condition: "Recognition would yield zero funding because the plan's share headroom or the agreement's remaining cap is already spent"
  - id: ERR_INSUFFICIENT_AVAILABLE_UNITS
    http: 409
    condition: "Disposition units exceed the item's uncommitted on-hand units, settled_units exceed the order's units, or posted units_sold exceed on_hand_units"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PricingAnalyst
    description: "Owns the markdown mechanics: registers items and sales history, estimates elasticity, builds depth ladders, schedules and applies zone executions, allocates clearance space, opens vendor negotiations and commits residual inventory to disposition"
    identity: "opaque"
    exclusive_operations:
      - "POST /items/{item_id}/sales-weeks"
      - "POST /elasticity-estimates"
      - "POST /markdown-plans"
      - "POST /markdown-plans/{markdown_plan_id}/steps"
      - "POST /markdown-plans/{markdown_plan_id}/submit"
      - "POST /markdown-plans/{markdown_plan_id}/reopen"
      - "POST /zone-executions"
      - "POST /zone-executions/{zone_execution_id}/apply"
      - "POST /zone-executions/{zone_execution_id}/roll-back"
      - "POST /seasons/{season_id}/clearance-allocations"
      - "POST /allowance-agreements"
      - "POST /disposition-orders"
    shared_operations:
      - "POST /items (with MerchandiseDirector)"
      - "POST /elasticity-estimates/{estimate_id}/certify (with MerchandiseDirector)"
      - "POST /clearance-reservations/{reservation_id}/release (with MerchandiseDirector)"
      - "POST /allowance-agreements/{agreement_id}/counter (with VendorRep)"
      - "POST /allowance-agreements/{agreement_id}/accept (with VendorRep)"
      - "POST /vendor-claims (with MerchandiseDirector)"
      - "POST /disposition-orders/{disposition_order_id}/cancel (with MerchandiseDirector)"
      - "POST /_clock/set_current_utc (all roles)"
      - "every GET endpoint except none"
  - name: MerchandiseDirector
    description: "Owns the season, zone and store registry, reviews and approves markdown plans, and verifies signage before a price change may be applied"
    identity: "opaque"
    exclusive_operations:
      - "POST /seasons"
      - "POST /seasons/{season_id}/transition"
      - "POST /price-zones"
      - "POST /stores"
      - "PATCH /stores/{store_id}"
      - "POST /markdown-plans/{markdown_plan_id}/request-revision"
      - "POST /markdown-plans/{markdown_plan_id}/approve"
      - "POST /zone-executions/{zone_execution_id}/verify-signage"
    shared_operations:
      - "POST /items (with PricingAnalyst)"
      - "POST /elasticity-estimates/{estimate_id}/certify (with PricingAnalyst)"
      - "POST /clearance-reservations/{reservation_id}/release (with PricingAnalyst)"
      - "POST /vendor-claims (with PricingAnalyst)"
      - "POST /disposition-orders/{disposition_order_id}/cancel (with PricingAnalyst)"
      - "POST /seasons/{season_id}/exit-reviews (with Controller)"
      - "POST /_clock/set_current_utc (all roles)"
      - "every GET endpoint"
  - name: StoreManager
    description: "Acts for one store: records that markdown signage is physically posted, which is the only path into the signage compliance chain"
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /zone-executions/{zone_execution_id}/post-signage"
    shared_operations:
      - "POST /_clock/set_current_utc (all roles)"
      - "GET /seasons, GET /seasons/{season_id}, GET /price-zones, GET /price-zones/{price_zone_id}, GET /stores, GET /stores/{store_id}, GET /items, GET /items/{item_id}, GET /markdown-plans/{markdown_plan_id}/steps, GET /markdown-steps/{markdown_step_id}, GET /zone-executions, GET /zone-executions/{zone_execution_id}, GET /clearance-reservations, GET /clearance-reservations/{reservation_id}"
  - name: VendorRep
    description: "Acts for a vendor_code across the negotiation table: counters and accepts markdown allowance offers, and reads the claims drawn against the agreement"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /allowance-agreements/{agreement_id}/counter (with PricingAnalyst)"
      - "POST /allowance-agreements/{agreement_id}/accept (with PricingAnalyst)"
      - "POST /_clock/set_current_utc (all roles)"
      - "GET /seasons, GET /seasons/{season_id}, GET /seasons/{season_id}/allowance-agreements, GET /items, GET /items/{item_id}, GET /markdown-plans, GET /markdown-plans/{markdown_plan_id}, GET /allowance-agreements, GET /allowance-agreements/{agreement_id}, GET /vendor-claims, GET /vendor-claims/{claim_id}"
  - name: Controller
    description: "Owns the money: recognises and reverses vendor allowance funding, approves and settles dispositions, and signs the post-season margin scorecard"
    identity: "opaque"
    exclusive_operations:
      - "POST /vendor-claims/{claim_id}/recognize"
      - "POST /vendor-claims/{claim_id}/reverse"
      - "POST /disposition-orders/{disposition_order_id}/approve"
      - "POST /disposition-orders/{disposition_order_id}/settle"
    shared_operations:
      - "POST /seasons/{season_id}/exit-reviews (with MerchandiseDirector)"
      - "POST /_clock/set_current_utc (all roles)"
      - "every GET endpoint"
