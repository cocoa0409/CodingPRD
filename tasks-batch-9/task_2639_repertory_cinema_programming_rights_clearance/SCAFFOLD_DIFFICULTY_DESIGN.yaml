          - endpoints[POST /kdm-keys/{id}/revoke]
        distinguishing_aspect: |
          Depth 3 through a DIFFERENT spine than the special-event cascade: the technical dimension
          drives the commercial one. Revoking the only covering KDM (1) marks the key REVOKED, which
          (2) leaves the showtime with no covering ISSUED key so playback_status falls back to
          UNVERIFIED and sale_status is forced to SALES_CLOSED, which (3) refunds the paid order into
