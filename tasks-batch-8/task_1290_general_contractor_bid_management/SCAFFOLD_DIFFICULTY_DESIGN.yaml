            - "Bid.${bid_y}.status == AWARDED and Bid.${bid_x}.status == NOT_AWARDED (link 2)"
            - "GET /bids/${bid_x}/bidder-feedbacks returns exactly 1 row: status DRAFT, leveled_rank == 2, leveled_amount_cents == 1250000, winning_leveled_amount_cents == 1100000 (link 3)"
            - "GET /bids/${bid_y}/bidder-feedbacks returns 0 rows (awarded bid gets no feedback)"

      - name: addendum_issue_two_level_cascade
        grounds:
          - state_machines.AddendumAcknowledgment.PENDING_to_ACKNOWLEDGED
          - entities.Bid.fields.addendum_ack_complete
          - entities.AddendumAcknowledgment.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (addendum issuance, not award):
          Addendum created (link 0) -> PENDING AddendumAcknowledgment rows
          created for each non-DECLINED invitee (link 1) -> each affected
          subcontractor's SUBMITTED Bid.addendum_ack_complete recomputed to
          false (link 2, caused by the acknowledgment creation, not directly
          by the issuance); DECLINED invitee Z receives no row.
        test_recipe:
          setup:
            - "Package PUBLISHED with invitations: X BIDDING (has a SUBMITTED bid), Y still SENT, Z DECLINED"
          setup_api_calls:
            - call: "POST /subcontractors"
