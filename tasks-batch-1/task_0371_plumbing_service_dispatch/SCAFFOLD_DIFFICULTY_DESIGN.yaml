              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_b_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { status2: $.data.status, labor2: $.data.labor_subtotal_cents }
          assert:
            - "After first present, Estimate.${est_id}.status == PRESENTED"
            - "After revise, Estimate.${est_id}.status == REVISED"
            - "After re-present, Estimate.${est_id}.status == PRESENTED"
            - "Estimate.${est_id}.labor_subtotal_cents == 20000"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: complete_cascades_estimate_then_truckstock_then_technician_depth3
        grounds:
          - state_machines.ServiceJob.IN_PROGRESS_to_COMPLETED
          - entities.TruckStock.fields.quantity
          - entities.TruckStock.fields.needs_restock
          - entities.Technician.fields.needs_restock_skus
        distinguishing_aspect: |
          Depth-3 chain off the COMPLETE trigger: job COMPLETED -> the approved Estimate flips to CONSUMED
          -> that consumption decrements TruckStock.quantity (10->2) -> the row crossing reorder_point flips
          needs_restock=true which itself increments Technician.needs_restock_skus from 0 to 1. Each link is
          caused by the previous link, not by the original complete call.
        test_recipe:
          setup:
            - "Technician has TruckStock of a part qty 10 reorder_point 2; job approved for 8 of that part; job started."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-05-01T10:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/parts"
              payload: { sku: "CSC-1", name: "Coupling", list_price_cents: 500 }
              as: OfficeManager
              captures: { part_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "CSC-FR", category: "REPIPE", base_price_cents: 30000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust CSC", service_address: "6 Spruce St", credit_limit_cents: 1000000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech CSC", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/truck-stock"
              payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity: 10, reorder_point: 2 }
              as: OfficeManager
              captures: { ts_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "REPIPE", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-05-01T11:00:00.000Z", window_end: "2026-05-01T13:00:00.000Z", eta: "2026-05-01T11:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "PART", part_id: "${part_id}", quantity: 8 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /plumbing/service-jobs/${job_id}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/complete"
              payload: { consumed_parts: [ { part_id: "${part_id}", units: 8 } ] }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/truck-stock/${ts_id}"
              payload: {}
              as: OfficeManager
              captures: { ts_qty: $.data.quantity, ts_flag: $.data.needs_restock }
            - call: "GET /plumbing/technicians/${tech_id}"
              payload: {}
              as: OfficeManager
              captures: { tech_restock: $.data.needs_restock_skus }
          assert:
            - "Estimate.${est_id}.status == CONSUMED"
            - "TruckStock.${ts_id}.quantity == 2"
            - "TruckStock.${ts_id}.needs_restock == true"
            - "Technician.${tech_id}.needs_restock_skus == 1"

      - name: approve_cascades_credit_commit_then_permit_autocreate_depth2
        grounds:
          - state_machines.ServiceJob.ON_SITE_to_AUTHORIZED
          - entities.Customer.fields.committed_credit_cents
          - entities.Permit.fields.status
          - entities.FlatRateItem.fields.requires_permit
        distinguishing_aspect: |
          Depth-2 chain off a DIFFERENT trigger (estimate APPROVE, not COMPLETE): approve -> job ON_SITE
