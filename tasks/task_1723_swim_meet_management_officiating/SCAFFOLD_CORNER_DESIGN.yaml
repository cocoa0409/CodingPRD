  # ============================================================
  # Section: errors (meet-level gate straggler)
  # ============================================================
  - section: errors
    instances:
      - name: event_start_blocked_until_meet_seeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEET_NOT_SEEDED]", state_machines.SwimEvent.SEEDED_to_IN_PROGRESS]
        distinguishing_aspect: "Starting an event while the meet is still ENTRIES_OPEN is rejected with ERR_MEET_NOT_SEEDED — the meet posture gate precedes the event's own state check."
        test_recipe:
          setup: ["meet ENTRIES_OPEN with one event defined"]
          setup_api_calls:
            - { call: "POST /meets", payload: { meet_name: "RE16", course: "SCY", start_date: "2026-08-15", entry_deadline_utc: "2026-08-10T00:00:00Z" }, as: MeetDirector, captures: { meet_id: $.data.id } }
