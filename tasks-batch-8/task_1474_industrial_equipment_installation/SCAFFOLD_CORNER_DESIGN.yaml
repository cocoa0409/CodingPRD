            - { call: "POST /v1/projects/${p_nl}/advance", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/projects/${p_nl}/advance", payload: {}, as: ProjectManager, captures: { nl_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_NO_EXECUTED_LIFT (${nl_err}); project remains INSTALLING"

      - name: checklist_not_signed_off_on_complete
