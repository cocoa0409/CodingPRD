  # ===========================================================================
  # Section: calculations — derived posture, report snapshot input set and
  # snapshot immutability, unit-status derivation. Formula-result claims
  # already covered by §1.8 are emitted as excluded_because stubs.
  # ===========================================================================
  - section: calculations
    instances:
      - name: posture_transitions_with_clock
        claim_type: threshold_boundary
        grounds:
          - calculations.case_posture
          - entities.Case.fields.posture
        distinguishing_aspect: "Posture is recomputed from the logical clock on every read: at clock 2026-08-10 (due 2026-09-09, 30 days out) ON_TRACK; at clock 2026-09-09 (due exactly today) AT_RISK — not OVERDUE; at clock 2026-09-10 (one day past due) OVERDUE."
        test_recipe:
          setup:
            - "Case CASE-CA1 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; all five benchmarks PENDING with 30-day benchmarks due 2026-09-09"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-CA1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "410 Beech St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgencyDirector
            - call: "GET /cases/${case_id}"
              as: CaseManager
              captures: { posture1: $.data.posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: AgencyDirector
            - call: "GET /cases/${case_id}"
              as: CaseManager
              captures: { posture2: $.data.posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: AgencyDirector
            - call: "GET /cases/${case_id}"
              as: CaseManager
              captures: { posture3: $.data.posture }
          assert:
            - "at clock 2026-08-10: posture == 'ON_TRACK' (nearest due date 30 days out, beyond the 7-day at-risk window)"
            - "at clock 2026-09-09: posture == 'AT_RISK' (due exactly today — OVERDUE requires due_date strictly before today)"
            - "at clock 2026-09-10: posture == 'OVERDUE' (2026-09-09 < 2026-09-10)"

      - name: report_snapshot_input_set
        claim_type: input_set_filtering
        grounds:
          - calculations.report_snapshot_counts
          - entities.FederalReport.fields.cases_arrived_count
