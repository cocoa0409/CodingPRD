              captures: { pp_id: $.data.id }
            - call: "POST /plan/assignment-cycles"
              payload: { plan_period_id: "${pp_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z" }
              as: PlanAdministrator
              captures: { cyc1_id: $.data.id }
          trigger:
            - call: "POST /plan/assignment-cycles"
              payload: { plan_period_id: "${pp_id}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/assignment-cycles"
              payload: { plan_period_id: "${pp_id}", window_start: "2026-10-02T00:00:00Z", window_end: "2026-10-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { cyc2_id: $.data.id }
          assert:
            - "the 2026-10-01 window returns 409 with error_id ERR_CYCLE_WINDOW_CONFLICT (window_start must be >= 2026-09-30 + 2 days)"
            - "the 2026-10-02 window returns 201 with AssignmentCycle.${cyc2_id}.window_start == 2026-10-02T00:00:00Z"
            - "AssignmentCycle.${cyc2_id}.status == SCHEDULED and AssignmentCycle.${cyc2_id}.assigned_count == 0 and AssignmentCycle.${cyc2_id}.deferred_count == 0"
            - "GET /plan/plan-periods/${pp_id}/assignment-cycles returns total_count == 2"
            - "AssignmentCycle.${cyc1_id}.window_end == 2026-09-30T00:00:00Z (untouched by the refused call)"
  - rule_id: compensating_invariant
    instances:
      - name: deposit_ledger_conserved_across_issuance_credit_and_cancellation_refund
        grounds:
          - calculations.earned_premium_at_cancellation
          - entities.Application.fields.deposit_balance_cents
          - entities.Application.fields.deposit_paid_total_cents
          - entities.Policy.fields.premium_credited_cents
          - entities.Policy.fields.refund_paid_cents
          - state_machines.Policy.premium_settlement_status.PREMIUM_OUTSTANDING_to_REFUND_ISSUED
        distinguishing_aspect: |
          Conserved quantity: every cent the producer ever deposited. Issuance moved the deposit out
          of deposit_balance_cents into Policy.premium_credited_cents, and the cancellation splits
          that credit into earned premium plus refund, so
          deposit_paid_total_cents == deposit_balance_cents + premium_credited_cents + refund_paid_cents
          must hold exactly (61709 == 0 + 61539 + 170) with no rounding drift. The sibling instance
          conserves a headcount, not money.
        test_recipe:
          setup:
            - "Clock at 2026-12-15. Policy AR-100013 is IN_FORCE with Atlas Mutual, effective 2026-09-15, total_annual_charge_cents 246834."
            - "The only money ever paid is a 61709-cent deposit, fully swept into premium_credited_cents at issuance, so deposit_balance_cents == 0 and premium_settlement_status == PREMIUM_OUTSTANDING."
            - "The policy has been in force 91 whole days and carries no open complaint."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/carriers"
