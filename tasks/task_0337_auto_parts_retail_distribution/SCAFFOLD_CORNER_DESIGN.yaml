# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Auto Parts Retail & Distribution — EXPERT band
# Breadth probe: every testable §1.1-§1.7 claim not already covered by §1.8.
# Names unique across §1.8 + §1.9. excluded_because stubs cite §1.8 by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_part_create_returns_201_with_computed_inventory_zeroed
        claim_type: Creation
        grounds: [entities.Part, endpoints]
        distinguishing_aspect: "POST /parts with all required fields returns 201; on_hand_qty/reserved_qty/available_qty all 0, status ACTIVE, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { sku: "BRK-1", description: "Brake kit", list_price_cents: 12000, cost_cents: 5000 }
              as: InventoryManager
              captures: { pid: $.data.id }
          assert:
            - "HTTP 201"
            - "Part.${pid}.on_hand_qty == 0 and reserved_qty == 0 and available_qty == 0"
            - "Part.${pid}.status == ACTIVE and version == 1"
            - "Part.${pid}.core_charge_cents == 0 and is_rebuildable == false (defaults applied)"

      - name: entity_part_missing_required_list_price_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Part.fields.list_price_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /parts omitting list_price_cents returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { sku: "BRK-2", description: "Brake kit", cost_cents: 5000 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST with HTTP 422"

      - name: entity_part_duplicate_sku_returns_conflict
        claim_type: Type Constraints
        grounds: ["entities.Part.fields.sku", "validations[priority=5]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Creating a second Part with an existing sku returns ERR_DUPLICATE_SKU 409."
        test_recipe:
          setup: ["one Part sku=DUP-1 exists"]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "DUP-1", description: "First", list_price_cents: 1000, cost_cents: 400 }
              as: InventoryManager
          trigger:
            - call: "POST /parts"
              payload: { sku: "DUP-1", description: "Second", list_price_cents: 2000, cost_cents: 800 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_SKU with HTTP 409"

      - name: entity_part_core_charge_inconsistent_rebuildable_zero_core
        claim_type: Type Constraints
        grounds: ["entities.Part.fields.is_rebuildable", "validations[priority=10]", "errors[ERR_CORE_CHARGE_INCONSISTENT]"]
        distinguishing_aspect: "is_rebuildable true with core_charge_cents 0 returns ERR_CORE_CHARGE_INCONSISTENT 422."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { sku: "REB-1", description: "Reman", list_price_cents: 15000, cost_cents: 7000, core_charge_cents: 0, is_rebuildable: true }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CORE_CHARGE_INCONSISTENT with HTTP 422"

      - name: entity_part_not_found_on_get
        claim_type: Not Found
        grounds: ["entities.Part", "errors[ERR_PART_NOT_FOUND]"]
        distinguishing_aspect: "GET /parts/{nonexistent} returns ERR_PART_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /parts/00000000-0000-4000-8000-000000000000"
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PART_NOT_FOUND with HTTP 404"

      - name: entity_part_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Part, endpoints]
        distinguishing_aspect: "GET /parts returns a paginated array with total_count and has_more in meta-level pagination fields."
        test_recipe:
          setup: ["two parts exist"]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "LST-1", description: "P1", list_price_cents: 1000, cost_cents: 400 }
              as: InventoryManager
            - call: "POST /parts"
              payload: { sku: "LST-2", description: "P2", list_price_cents: 2000, cost_cents: 800 }
              as: InventoryManager
          trigger:
            - call: "GET /parts"
              as: InventoryManager
          assert:
            - "response_type == array; total_count == 2; has_more == false; limit == 10, offset == 0 defaults"

      - name: entity_part_computed_inventory_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Part.fields.on_hand_qty, entities.Part.fields.available_qty]
        distinguishing_aspect: "Supplying on_hand_qty/available_qty in POST /parts is ignored (unknown input); created part still has 0 on hand."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { sku: "IGN-1", description: "Ignore test", list_price_cents: 3000, cost_cents: 1000 }
              as: InventoryManager
              captures: { pid: $.data.id }
          assert:
            - "Part.${pid}.on_hand_qty == 0 (computed/system, never client-set)"

      - name: entity_vehicle_year_out_of_range_rejected
        claim_type: Type Constraints
        grounds: ["entities.Vehicle.fields.year", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /vehicles with year 1800 (below 1900) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { year: 1800, make: "FORD", model: "MODEL-T" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST with HTTP 422"

      - name: entity_fitment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Fitment]
        distinguishing_aspect: "Fitment has common_fields false: response carries id and created_at, no version or updated_at, and no mutation endpoint exists."
        test_recipe:
          setup: ["a part and a vehicle exist"]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "FIT-1", description: "Fit part", list_price_cents: 1000, cost_cents: 400 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /vehicles"
              payload: { year: 2020, make: "TOYOTA", model: "CAMRY" }
              as: InventoryManager
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /fitments"
              payload: { part_id: "${pid}", vehicle_id: "${vid}", position: "FRONT" }
              as: InventoryManager
              captures: { fid: $.data.id }
          assert:
            - "Fitment.${fid} has id and created_at; position == FRONT; notes == '' (default)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_allocate_empty_order_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SalesOrder.fulfillment_status.OPEN_to_ALLOCATED", "errors[ERR_EMPTY_ORDER]"]
        distinguishing_aspect: "Allocating an order with zero lines returns ERR_EMPTY_ORDER 409."
        test_recipe:
          setup: ["OPEN wholesale order with no lines"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EMPTY_ORDER with HTTP 409"

      - name: sm_allocate_insufficient_stock_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SalesOrder.fulfillment_status.OPEN_to_ALLOCATED", "validations[priority=14]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Allocating a stock line whose qty exceeds available_qty returns ERR_INSUFFICIENT_STOCK 409."
        test_recipe:
          setup: ["stock part on_hand 1; order with stock line qty 2"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "LOW-1", description: "Low stock", list_price_cents: 4000, cost_cents: 1500, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 1 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 2 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_STOCK with HTTP 409"

      - name: sm_ship_from_open_invalid_fulfillment_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SalesOrder.fulfillment_status", "errors[ERR_INVALID_FULFILLMENT_STATE]"]
        distinguishing_aspect: "Shipping an OPEN (not ALLOCATED) order returns ERR_INVALID_FULFILLMENT_STATE 409; no inventory moves."
        test_recipe:
          setup: ["OPEN wholesale order with one stock line, not allocated"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "OPN-1", description: "Open part", list_price_cents: 4000, cost_cents: 1500, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_FULFILLMENT_STATE with HTTP 409"
            - "Part.${pid}.on_hand_qty == 5 (unchanged)"

      - name: sm_cancel_invoiced_order_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SalesOrder.fulfillment_status.OPEN_to_CANCELLED", "errors[ERR_ORDER_ALREADY_INVOICED]"]
        distinguishing_aspect: "Cancelling an order whose settlement_status is INVOICED returns ERR_ORDER_ALREADY_INVOICED 409."
        test_recipe:
          setup: ["a shipped+invoiced wholesale order"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "INV-1", description: "Inv part", list_price_cents: 4000, cost_cents: 1500, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            - call: "POST /sales-orders/${order_id}/invoice"
              as: WholesaleRep
          trigger:
            - call: "POST /sales-orders/${order_id}/cancel"
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_ALREADY_INVOICED with HTTP 409"

      - name: sm_pay_before_invoice_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.SalesOrder.settlement_status", "errors[ERR_NOT_INVOICED]"]
        distinguishing_aspect: "Paying an UNBILLED order (never invoiced) returns ERR_NOT_INVOICED 409."
        test_recipe:
          setup: ["a shipped but UNBILLED wholesale order"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "PAY-1", description: "Pay part", list_price_cents: 4000, cost_cents: 1500, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
          trigger:
            - call: "POST /sales-orders/${order_id}/pay"
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_INVOICED with HTTP 409"

      - name: sm_warranty_approve_from_submitted_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.WarrantyClaim", "errors[ERR_CLAIM_NOT_UNDER_REVIEW]"]
        distinguishing_aspect: "Approving a SUBMITTED claim (skipping start-review) returns ERR_CLAIM_NOT_UNDER_REVIEW 409."
        test_recipe:
          setup: ["a shipped line with a SUBMITTED warranty claim"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "WAR-1", description: "Warr part", list_price_cents: 8000, cost_cents: 3000, warranty_days: 365, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
              captures: { line_id: $.data.id }
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            - call: "POST /warranty-claims"
              payload: { order_line_id: "${line_id}", qty: 1, reason: "bad", resolution: "REFUND" }
              as: WholesaleRep
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/approve"
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLAIM_NOT_UNDER_REVIEW with HTTP 409"

      - name: sm_warranty_approve_expired_window_rejected
        claim_type: guarded transitions
        grounds: ["state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED", "validations[priority=11]", "errors[ERR_WARRANTY_EXPIRED]"]
        distinguishing_aspect: "Approving a claim on a part with warranty_days 0 (already expired at ship) returns ERR_WARRANTY_EXPIRED 409."
        test_recipe:
          setup: ["a shipped line on a zero-warranty part, claim escalated to UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "NOW-1", description: "No warranty", list_price_cents: 8000, cost_cents: 3000, warranty_days: 0, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
              captures: { line_id: $.data.id }
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v1: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v1}" }
              as: WholesaleRep
              captures: { v2: $.data.version }
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v2}" }
              as: WholesaleRep
            - call: "POST /warranty-claims"
              payload: { order_line_id: "${line_id}", qty: 1, reason: "dead", resolution: "REFUND" }
              as: WholesaleRep
              captures: { claim_id: $.data.id }
            - call: "POST /warranty-claims/${claim_id}/start-review"
              as: WarrantyAdmin
          trigger:
            - call: "POST /warranty-claims/${claim_id}/approve"
              as: WarrantyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WARRANTY_EXPIRED with HTTP 409"

      - name: sm_warranty_deny_from_under_review_terminal
        claim_type: Valid Transition
        grounds: [state_machines.WarrantyClaim.UNDER_REVIEW_to_DENIED]
        distinguishing_aspect: "A UNDER_REVIEW claim can be denied -> DENIED (terminal), no credit, no restock."
        test_recipe:
          setup: ["a shipped line, claim escalated to UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /price-tiers"
              payload: { name: "JOBBER", discount_pct: 0.30, core_discount_pct: 0.10, min_margin_pct: 0.20 }
              as: InventoryManager
              captures: { jobber_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "DNY-1", description: "Deny part", list_price_cents: 8000, cost_cents: 3000, warranty_days: 365, stockable: true, reorder_point: 0, reorder_qty: 0 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /parts/${pid}/receive-stock"
              payload: { qty: 5 }
              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
