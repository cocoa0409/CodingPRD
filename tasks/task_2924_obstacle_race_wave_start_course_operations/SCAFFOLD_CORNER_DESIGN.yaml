            - "S1 alone is locked, released at the 08:00:00 gun with one checked-in entry, and closed at 08:45:00; S2 is left untouched in SCHEDULED / OPEN."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
