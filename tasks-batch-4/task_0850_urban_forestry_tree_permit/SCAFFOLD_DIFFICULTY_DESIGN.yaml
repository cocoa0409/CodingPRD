  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: contractor_double_booking_half_open_adjacency_ok
        grounds:
          - validations[priority=17]
          - errors[ERR_CONTRACTOR_DOUBLE_BOOKED]
          - entities.WorkOrder.fields.scheduled_start
        distinguishing_aspect: "Contractor resource, HALF-OPEN [start,end): a second work order overlapping [08:00,10:00) is rejected, but a third booked exactly [10:00,12:00) (touching the end) is accepted — adjacency does not overlap."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, Tree T20; ACTIVE storm over Z1 spanning default clock; Contractor C1 ACTIVE."
            - "First EMERGENCY_REMOVAL work order on C1 booked [2026-03-01T08:00, 2026-03-01T10:00)."
