        payload:
          center_id: ${lk_ctr}
          patient_ref: P-LK-005
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T08:00:00Z'
        as: EdPhysician
