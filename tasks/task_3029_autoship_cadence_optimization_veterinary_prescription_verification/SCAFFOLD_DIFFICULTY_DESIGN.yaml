# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3029
#
# Cross-reference of §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_id blocks, 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: recalc_after_weight_change_redraws_consumption_cadence
        grounds:
          - calculations.run_cadence_days
          - entities.AutoshipItem.fields.unit_lifecycle_equivalent_days
          - entities.AutoshipPlan.fields.cadence_prompt_due_days_delta
        distinguishing_aspect: "Two valid readings of the same weight and pack size produce different equivalent-duration numbers on the item: the tiered-dosage pipeline yields unit_lifecycle_equivalent_days == 30 while the whole-day band reading yields 4, so the field cannot be derived without pinning which variant the compute uses."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One dog weighing 40.0 kg with an owned plan but no items."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "CAL-D40", product_name: "Calibration chew 40mg", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.035, pack_size_units: 30, unit_price_cents: 1610 }
              as: PlatformAdmin
              captures: { prod_d1: "$.data.id" }
            - call: "POST /v1/pets"
              payload: { pet_name: "Rex", species: "DOG", breed: "Labrador", weight_kg: 40.0, owner_state: "CA" }
              as: Customer
              captures: { pet_d1: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_d1}" }
              as: Customer
              as_user_id: "${pet_d1}"
              captures: { plan_d1: "$.data.id" }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_d1}/items"
              payload: { product_id: "${prod_d1}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_d1}"
              captures: { item_d1: "$.data.id" }
          assert:
            - "AutoshipItem.${item_d1}.cadence_days == 28 and default_quantity == 1"
            - "AutoshipItem.${item_d1}.unit_lifecycle_equivalent_days == 30"
            - "the band_cadence variant over the same inputs yields 4, so the two variants diverge by 26 days for identical data"
            - "AutoshipItem.${item_d1}.cadence_prompt_state == ALIGNED because run_cadence_days 30 minus cadence_days 28 is 2, which is not greater than PROMPT_ALIGNED_WINDOW_DAYS 3"
            - "AutoshipPlan.${plan_d1}.next_order_due_date == 2026-09-01T00:00:00Z"

      - name: dosage_projection_diverges_by_species_multiplier
        grounds:
          - calculations.dosage_mg_per_day
          - calculations.run_cadence_days
          - entities.Pet.fields.weight_kg
        distinguishing_aspect: "For a DOG the two dosage readings disagree by the species multiplier — 1.68 mg/day weighted versus 1.40 mg/day pet-only — while the weight-only consumption cadence is identical under both, so dosage and consumption diverge along different axes for the same row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One dog weighing 40.0 kg with an owned plan but no items."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "DSG-D40", product_name: "Dosage calibration chew", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.035, pack_size_units: 30, unit_price_cents: 1200 }
              as: PlatformAdmin
              captures: { prod_d2: "$.data.id" }
            - call: "POST /v1/pets"
              payload: { pet_name: "Bella", species: "DOG", breed: "Shepherd", weight_kg: 40.0, owner_state: "TX" }
              as: Customer
              captures: { pet_d2: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_d2}" }
              as: Customer
              as_user_id: "${pet_d2}"
              captures: { plan_d2: "$.data.id" }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_d2}/items"
              payload: { product_id: "${prod_d2}", cadence_days: 30, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_d2}"
              captures: { item_d2: "$.data.id" }
          assert:
            - "calculations.dosage_mg_per_day over (unit_dose_mg_per_kg 0.035, weight_kg 40.0, species DOG) == 1.68"
            - "the pet_only_projection variant over the same inputs == 1.40, a divergence of 0.28 driven only by the species multiplier"
            - "AutoshipItem.${item_d2}.unit_lifecycle_equivalent_days == 30 under both variants because run_cadence_days reads weight_kg and pack_size_units only"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: discount_rounding_order_changes_the_order_total
        grounds:
          - calculations.autoship_discount_cents
          - calculations.autoship_promo_reconciliation
          - entities.Order.fields.merchandise_subtotal_cents
        distinguishing_aspect: "Nested-rounding order: the pinned per-line-then-sum rule yields an autoship discount of 219 cents while rounding once on the order-level subtotal yields 221, so identical baskets produce different totals depending on where the single rounding is applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One plan whose first order is already composed, so the next compose uses the 10% recurring rate. One OTC line priced at 1550 cents per unit, one OTC line priced at 656 cents per unit."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "BLD-A1", product_name: "Foundation kibble", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 20, unit_price_cents: 1550 }
              as: PlatformAdmin
              captures: { prod_b1: "$.data.id" }
            - call: "POST /v1/products"
              payload: { sku: "BLD-B2", product_name: "Joint chew", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.01, pack_size_units: 10, unit_price_cents: 656 }
              as: PlatformAdmin
              captures: { prod_b2: "$.data.id" }
            - call: "POST /v1/pets"
              payload: { pet_name: "Otto", species: "DOG", breed: "Beagle", weight_kg: 20.0, owner_state: "CA" }
              as: Customer
              captures: { pet_b1: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_b1}" }
              as: Customer
              as_user_id: "${pet_b1}"
              captures: { plan_b1: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_b1}/items"
              payload: { product_id: "${prod_b1}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_b1}"
              captures: { item_b1: "$.data.id" }
            - call: "GET /v1/autoship-plans/${plan_b1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_b1}"
              captures: { plan_b1_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_b1}/compose"
              payload: { expected_plan_version: "${plan_b1_v}" }
              as: Customer
              as_user_id: "${pet_b1}"
              captures: { first_order_b1: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_b1}/items"
              payload: { product_id: "${prod_b2}", cadence_days: 14, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_b1}"
              captures: { item_b2: "$.data.id" }
            - call: "GET /v1/autoship-plans/${plan_b1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_b1}"
              captures: { plan_b1_v: "$.data.version" }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_b1}/compose"
              payload: { expected_plan_version: "${plan_b1_v}" }
              as: Customer
              as_user_id: "${pet_b1}"
              captures: { order_b1: "$.data.id" }
            - call: "GET /v1/orders/${order_b1}/lines"
              payload: {}
              as: Customer
              captures: { line_b1: "$.data[0].id", line_b2: "$.data[1].id" }
          assert:
            - "OrderLine.${line_b1}.line_item_subtotal_cents == 1550 and OrderLine.${line_b2}.line_item_subtotal_cents == 656"
            - "OrderLine.${line_b1}.line_autoship_discount_cents == 155"
            - "OrderLine.${line_b2}.line_autoship_discount_cents == 64"
            - "Order.${order_b1}.autoship_discount_cents == 220, the per-line sum"
            - "the order_level_rounding variant over merchandise_subtotal_cents 2206 yields 221, so the two rounding orders disagree by 1 cent"
            - "Order.${order_b1}.order_total_cents == 1986, so the bundled basket is priced below its 2206 subtotal"
            - "the per-line-then-sum order is exercised rather than an all-zero sum, because the bundle carries two lines and a strictly positive discount"
            - "Order.${order_b1}.order_kind == RECURRING, so the bundle is priced at the recurring rate rather than the first-order rate"

      - name: battery_capacity_ladder_and_guard_price_interact
        grounds:
          - calculations.cold_pack_units
          - calculations.autoship_price_protection
          - entities.PharmacySite.fields.cold_pack_committed_units
        distinguishing_aspect: "A formula with three-plus interacting inputs: the battery ladder (ambient degradation, site load and line quantity) and the rounded protection guard set both the charged line price and the reserved units, so an unchanged basket dispatches with 56 reserved units at one ambient/load configuration and 55 at another."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One OTC cold-pack item priced at 319 cents with quantity 2 and a 28-day cadence; the destination site is licensed for CA and holds cold_pack_capacity_units 411 with no committed load."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "SAC1", site_state: "CA", licensed_states: ["CA", "NV"], cold_pack_capacity_units: 411, csr_registered: true }
              as: ComplianceOfficer
              captures: { site_b2: "$.data.id" }
            - call: "POST /v1/products"
              payload: { sku: "BLD-C3", product_name: "Insulin analogue", medication_scope: "OTC", cold_pack_required: true, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 319 }
              as: PlatformAdmin
              captures: { prod_b3: "$.data.id" }
            - call: "POST /v1/pets"
              payload: { pet_name: "Nova", species: "CAT", breed: "Siamese", weight_kg: 18.0, owner_state: "CA" }
              as: Customer
              captures: { pet_b2: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_b2}" }
              as: Customer
              as_user_id: "${pet_b2}"
              captures: { plan_b2: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_b2}/items"
              payload: { product_id: "${prod_b3}", cadence_days: 28, default_quantity: 2 }
              as: Customer
              as_user_id: "${pet_b2}"
              captures: { item_b3: "$.data.id" }
            - call: "GET /v1/autoship-plans/${plan_b2}"
              payload: {}
              as: Customer
              as_user_id: "${pet_b2}"
              captures: { plan_b2_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_b2}/compose"
              payload: { expected_plan_version: "${plan_b2_v}" }
              as: Customer
              as_user_id: "${pet_b2}"
              captures: { first_order_b2: "$.data.id" }
            - call: "POST /v1/products/${prod_b3}/price"
              payload: { unit_price_cents: 599 }
              as: ComplianceOfficer
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-10-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/autoship-plans/${plan_b2}"
              payload: {}
              as: Customer
              as_user_id: "${pet_b2}"
              captures: { plan_b2_v: "$.data.version" }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_b2}/compose"
              payload: { expected_plan_version: "${plan_b2_v}" }
              as: Customer
              as_user_id: "${pet_b2}"
              captures: { order_b2: "$.data.id" }
            - call: "GET /v1/orders/${order_b2}/lines"
              payload: {}
              as: Customer
              captures: { line_b3: "$.data[0].id" }
            - call: "POST /v1/orders/${order_b2}/ship"
              payload: {}
              as: PharmacyTechnician
            - call: "GET /v1/orders/${order_b2}/shipments"
              payload: {}
              as: PharmacyTechnician
              captures: { ship_b2: "$.data[0].id" }
          assert:
            - "the protection guard over price_protected_unit_price_cents 319 is round_half_up(319 * 1.05) == 335, so the raised list price of 599 is charged at 335"
            - "OrderLine.${line_b3}.line_unit_price_cents == 335 and line_item_subtotal_cents == 670"
            - "the no_protection variant over the same line charges 599 per unit, a divergence of 264 cents per unit"
            - "Shipment.${ship_b2}.cold_pack_units == 56 because ceil(24.0 + 1.5 * 21.0 + 0.0 + (2 - 1) / 4.0) == 56"
            - "PharmacySite.${site_b2}.cold_pack_committed_units == 56"
            - "Shipment.${ship_b2}.cold_pack_required == true and cold_pack_units stays below cold_pack_capacity_units 411"

# ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: callback_workflow_cycles_within_the_attempt_cap
        grounds:
          - state_machines.Prescription.VERIFICATION_IN_PROGRESS_to_VERIFICATION_IN_PROGRESS
          - state_machines.Prescription.PENDING_VERIFICATION_to_VERIFICATION_IN_PROGRESS
          - state_machines.Prescription.VERIFICATION_IN_PROGRESS_to_VERIFICATION_FAILED
        distinguishing_aspect: "A genuine cycle on the Prescription: the callback workflow re-enters VERIFICATION_IN_PROGRESS from itself until attempt three, at which point the same trigger drives the terminal VERIFICATION_FAILED edge, so reachability of the terminal state depends on the count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One active autoship item on an ACTIVE plan carrying a PENDING_VERIFICATION prescription with callback_attempt_count 0."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "RX-CYC1", product_name: "Cycle test antibiotic", medication_scope: "PRESCRIPTION", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 2500 }
              as: PlatformAdmin
              captures: { prod_c1: "$.data.id" }
            - call: "POST /v1/veterinarians"
              payload: { full_name: "Dr Ana Ruiz", clinic_name: "Bayview Animal Clinic", clinic_phone: "4155550101", vet_email: "aruiz@bayviewvet.example", license_number: "VET-CA-9001", license_state: "CA" }
              as: PharmacyTechnician
              captures: { vet_c1: "$.data.id" }
            - call: "POST /v1/pets"
              payload: { pet_name: "Cleo", species: "CAT", breed: "Maine Coon", weight_kg: 6.0, owner_state: "CA" }
              as: Customer
              captures: { pet_c1: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_c1}" }
              as: Customer
              as_user_id: "${pet_c1}"
              captures: { plan_c1: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_c1}/items"
              payload: { product_id: "${prod_c1}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_c1}"
              captures: { item_c1: "$.data.id" }
            - call: "POST /v1/prescriptions"
              payload: { autoship_item_id: "${item_c1}", prescriber_id: "${vet_c1}", script_source: "UPLOADED_SCRIPT", script_document_id: "doc-cycle-1", drug_schedule: "NONE", temperature_sensitive: false, authorized_qty_total: 90, refills_authorized: 5 }
              as: PharmacyTechnician
              captures: { rx_c1: "$.data.id" }
          trigger:
            - call: "POST /v1/prescriptions/${rx_c1}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
              captures: { after_first_c1: "$.data.callback_attempt_count" }
            - call: "POST /v1/prescriptions/${rx_c1}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
              captures: { after_second_c1: "$.data.callback_attempt_count" }
            - call: "POST /v1/prescriptions/${rx_c1}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
              captures: { after_third_c1: "$.data.callback_attempt_count" }
          assert:
            - "the first call leaves Prescription.${rx_c1}.rx_status == VERIFICATION_IN_PROGRESS and callback_attempt_count == ${after_first_c1} == 1"
            - "the second call re-enters VERIFICATION_IN_PROGRESS, so callback_attempt_count == ${after_second_c1} == 2 while rx_status is unchanged"
            - "the third call is the cycle exit: callback_attempt_count == ${after_third_c1} == 3 and rx_status == VERIFICATION_FAILED"
            - "a fourth clinic-contacts call is rejected with ERR_INVALID_STATE because VERIFICATION_FAILED is terminal for this trigger"
            - "state_machines.Prescription.VERIFICATION_FAILED_to_PENDING_VERIFICATION is reachable only through POST /v1/prescriptions/${rx_c1}/reopen, which resets callback_attempt_count to 0"

      - name: order_carries_a_second_parking_axis_beside_delivery
        grounds:
          - state_machines.Order.SHIPPED_to_AWAITING_PET_PASSING_DECISION
          - state_machines.Shipment.DISPATCHED_to_AWAITING_PET_PASSING_DECISION
          - state_machines.Shipment.AWAITING_PET_PASSING_DECISION_to_CANCELED
        distinguishing_aspect: "Branching fork-join on the Order: from SHIPPED the machine forks into either the DELIVERED join or the AWAITING_PET_PASSING_DECISION park, and only the park branch lets the Order terminate as CANCELED while its Shipment also ends CANCELED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One dispatched order on an ACTIVE plan whose destination site is licensed for CA."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "SFO2", site_state: "CA", licensed_states: ["CA"], cold_pack_capacity_units: 40, csr_registered: true }
              as: ComplianceOfficer
              captures: { site_c2: "$.data.id" }
            - call: "POST /v1/products"
              payload: { sku: "OTC-CYC2", product_name: "Cycle test kibble", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { prod_c2: "$.data.id" }
            - call: "POST /v1/pets"
              payload: { pet_name: "Milo", species: "DOG", breed: "Poodle", weight_kg: 12.0, owner_state: "CA" }
              as: Customer
              captures: { pet_c2: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_c2}" }
              as: Customer
              as_user_id: "${pet_c2}"
              captures: { plan_c2: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_c2}/items"
              payload: { product_id: "${prod_c2}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_c2}"
              captures: { item_c2: "$.data.id" }
            - call: "GET /v1/autoship-plans/${plan_c2}"
              payload: {}
              as: Customer
              as_user_id: "${pet_c2}"
              captures: { plan_c2_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_c2}/compose"
              payload: { expected_plan_version: "${plan_c2_v}" }
              as: Customer
              as_user_id: "${pet_c2}"
              captures: { order_c2: "$.data.id" }
            - call: "POST /v1/shipments"
              payload: { order_id: "${order_c2}" }
              as: PharmacyTechnician
              captures: { ship_c2: "$.data.id" }
            - call: "POST /v1/orders/${order_c2}/ship"
              payload: {}
              as: PharmacyTechnician
          trigger:
            - call: "POST /v1/pets/${pet_c2}/passings"
              payload: { refund_destination: "WALLET" }
              as: Customer
              as_user_id: "${pet_c2}"
              captures: { rev_c2: "$.data.compassionate_review_id" }
            - call: "POST /v1/compassionate-reviews/${rev_c2}/decide"
              payload: { outcome: "REJECTED" }
              as: CustomerService
              as_user_id: "cs-dana"
          assert:
            - "Order.${order_c2}.order_status == AWAITING_PET_PASSING_DECISION after the passing, taking the fork away from the DELIVERED join"
            - "Shipment.${ship_c2}.shipment_status == AWAITING_PET_PASSING_DECISION"
            - "the rejecting decision still drives Shipment.${ship_c2}.shipment_status to CANCELED, so the park branch terminates rather than joining the DELIVERED join"
            - "AutoshipPlan.${plan_c2}.plan_status == COMPASSIONATE_CANCELED"
            - "the sibling delivery path remains unreachable for this order: POST /v1/orders/${order_c2}/deliver is rejected with ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: third_callback_failure_suspends_the_plan_and_revokes_discounts
        grounds:
          - state_machines.Prescription.VERIFICATION_IN_PROGRESS_to_VERIFICATION_FAILED
          - state_machines.AutoshipPlan.ACTIVE_to_SUSPENDED
          - entities.AutoshipPlan.fields.autoship_discount_eligibility
          - validations[priority=23]
        distinguishing_aspect: "A depth-3 chain from one trigger: the third callback attempt fails the Prescription, that failure blocks the item, and the blocked item suspends the Plan and revokes its discount eligibility — each hop caused by the previous hop rather than by the original call."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE plan with one PRESCRIPTION item whose prescription has seen two callback attempts."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "RX-CAS1", product_name: "Cascade test antibiotic", medication_scope: "PRESCRIPTION", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 2500 }
              as: PlatformAdmin
              captures: { prod_d3: "$.data.id" }
            - call: "POST /v1/veterinarians"
              payload: { full_name: "Dr Lena Okafor", clinic_name: "Cedar Vet Group", clinic_phone: "4155550102", vet_email: "lokafor@cedarvet.example", license_number: "VET-CA-9002", license_state: "CA" }
              as: PharmacyTechnician
              captures: { vet_d3: "$.data.id" }
