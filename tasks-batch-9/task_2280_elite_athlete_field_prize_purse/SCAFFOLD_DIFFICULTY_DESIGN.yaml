      - name: priority_role_from_state_beats_offer_deadline_lapse
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors.ERR_ROLE_NOT_PERMITTED_FROM_STATE
          - errors.ERR_OFFER_DEADLINE_PASSED
          - entities.Invitation.fields.response_deadline_at
        distinguishing_aspect: >-
          A THIRD distinct pair (auth at priority 9 versus business_temporal at priority 13, i.e. a 403
          beating a 422, unlike the 409-over-422 and 422-over-422 pairs in the other two instances):
          the invitation sits in COUNTERED, the state in which only the ElitesDirector may respond, and
          the AthleteAgent — correctly bound to the invitation's own agent_id, so validation 5 does not
          fire — responds anyway after the 14-day window has lapsed. Falsifiable in
          one sentence: an implementation that validates the deadline before the state-derived role
          returns 422 ERR_OFFER_DEADLINE_PASSED rather than 403 ERR_ROLE_NOT_PERMITTED_FROM_STATE.
