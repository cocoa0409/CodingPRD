  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_program_accept
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[program-accept-stale-design]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client reads design at version V, a revision cycle advances it to V+1, then accept with expected_program_design_version=V -> 412 ERR_STALE_VERSION; retry with current version succeeds."
        test_recipe:
          setup: ["account + asset; design at PROPOSED with version V captured; then request-revision + reopen-survey + draft + propose (version advanced)"]
          setup_api_calls:
            - call: "POST /wt/accounts"
              payload: { account_name: "OCC Co" }
              as: AccountManager
              captures: { x1_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${x1_acct}", asset_tag: "CT-X1", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { x1_asset: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${x1_asset}" }
              as: WaterChemist
              captures: { x1_pd: $.data.id }
            - { call: "POST /wt/program-designs/${x1_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${x1_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${x1_pd}/propose"
              payload: {}
              as: WaterChemist
              captures: { x1_v_stale: $.data.version }
            - { call: "POST /wt/program-designs/${x1_pd}/request-revision", payload: {}, as: CustomerContact, as_user_id: "${x1_acct}" }
            - { call: "POST /wt/program-designs/${x1_pd}/reopen-survey", payload: {}, as: WaterChemist }
            - { call: "POST /wt/program-designs/${x1_pd}/draft", payload: { proposed_coc: 3.5, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${x1_pd}/propose"
              payload: {}
