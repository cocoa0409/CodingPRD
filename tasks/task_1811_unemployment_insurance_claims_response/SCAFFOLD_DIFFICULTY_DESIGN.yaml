            - "Determination.${det_id}.status == 'REVERSED'"
            - "ChargeLineItem.${line_id}.status == 'REVERSED'"
            - "ChargeStatement.${stmt_id}.total_charged_cents == 0"
            - "EmployerAccount.${emp_id}.reserve_balance_cents == 30000000"

      - name: waive_restores_reserve_without_protest_credit
        grounds:
          - state_machines.ChargeLineItem.PENDING_to_WAIVED
          - entities.EmployerAccount.fields.reserve_balance_cents
          - entities.EmployerAccount.fields.protest_credits_cents
        distinguishing_aspect: |
          Conserved quantity pair with an asymmetric compensating action: posting a
          250000-cent line then WAIVING it restores EmployerAccount.reserve_balance_cents
          exactly (10000000 before and after) while protest_credits_cents MUST remain 0 —
          the compensation conserves the ledger but must NOT leak into the audit-credit
          quantity, distinguishing it from the protest-sustain path. A third conserved
          quantity type (reserve + credit-counter pair) beyond statement total and
          reserve-only.
        test_recipe:
          setup:
            - "Employer reserve_balance_cents 10000000, protest_credits_cents 0; claim exists; statement issued; one line 250000 posted"
