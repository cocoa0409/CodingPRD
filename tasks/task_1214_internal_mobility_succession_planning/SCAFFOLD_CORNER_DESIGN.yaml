            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_3_PLUS", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
          trigger:
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_SUCCESSOR; vacancy remains OPEN"

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_slate_fill
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Vacancy.OPEN_to_FILLED]
        distinguishing_aspect: "Immediate consistency: the fill response itself shows status FILLED, and the very next read of the role shows status ACTIVE with the new incumbent — no asynchronous lag anywhere in the cascade."
        test_recipe:
          setup: ["vacancy with one ACTIVE READY_NOW successor S135"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPC135", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC135", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S135", full_name: "Sue Cessor", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 135", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
          trigger:
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vst: $.data.status, by: $.data.filled_by_employee_id } }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rst: $.data.status, rinc: $.data.incumbent_employee_id } }
            - { call: "GET /talent/successors/${es}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { est: $.data.status } }
          assert:
            - "fill response: status == FILLED and filled_by_employee_id == ${suc} (cascade visible in the same request)"
            - "immediate read: CriticalRole.${r}.status == ACTIVE with incumbent_employee_id == ${suc}; SuccessorEntry.${es}.status == PROMOTED"
