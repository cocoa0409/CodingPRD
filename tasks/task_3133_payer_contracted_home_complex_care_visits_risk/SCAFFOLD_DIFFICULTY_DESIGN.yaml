            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 5, urgent_response_qualified: true }
              as: PlatformAdmin
              captures: { np_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member One", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-002", full_name: "Member Two", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["COPD"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 0 }
              as: PlatformAdmin
              captures: { m2_id: $.data.id, m2_v: $.data.version }
            - call: "POST /members/${m1_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${m1_v}" }
              as: EngagementSpecialist
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${e1_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${e1_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${e1_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            # E1 is CONSENTED (not yet ACTIVE) but CT is ACTIVE
            - call: "POST /members/${m2_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${m2_v}" }
              as: EngagementSpecialist
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments/${e2_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${e2_id}/record-consent"
              payload: { consent_document_id: "DOC-2" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${e2_id}/care-team"
              payload: { primary_np_id: "${np_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${e2_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${e2_id}/activate"
