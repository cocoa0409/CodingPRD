        claim_type: correct_result
        grounds: [calculations.weekly_allocation_waterfall]
        distinguishing_aspect: "Selector determinism: ELITE tier outranks STANDARD even when the STANDARD order was created earlier; the later ELITE order takes the whole 10-unit pool."
        test_recipe:
          setup: ["D1 STANDARD and D2 ELITE both ACTIVE; product P1 with one 10-unit lot; D1's order created BEFORE D2's, both for week 2026-09-07"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Std Dist", service_level_tier: "STANDARD" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/distributors", payload: { code: "D2", name: "Elite Dist", service_level_tier: "ELITE" }, as: BrandAdmin, captures: { d2: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
