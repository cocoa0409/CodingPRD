  - section: cross_cutting_layers
    instances:
      - name: occ_ticket_approve_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ticket-approve-stale-quote]"]
        distinguishing_aspect: "After a re-quote bumps the ticket version, an approve carrying the pre-re-quote version is rejected 412; carrying the current version succeeds."
        test_recipe:
          setup: ["Clock 2026-12-01 with capacity; WAX ticket quoted twice (version advanced by re-quote)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/shop-day-capacity", payload: { service_date: "2026-12-01", base_labor_minutes: 480, rush_reserved_minutes: 120 }, as: Manager }
            - { call: "POST /shop/customers", payload: { full_name: "Occ Currence", email: "occ@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/tune-tickets", payload: { customer_id: "${cust}", own_gear_description: "own skis", services: ["WAX"], rush: false }, as: Customer, as_user_id: "${cust}", captures: { tk: "$.data.id" } }
            - { call: "POST /shop/tune-tickets/${tk}/quote", payload: { parts_surcharge_cents: 0 }, as: Technician, captures: { v_old: "$.data.version", q1: "$.data.quoted_price_cents" } }
            - { call: "POST /shop/tune-tickets/${tk}/quote", payload: { parts_surcharge_cents: 700 }, as: Technician, captures: { v_new: "$.data.version", q2: "$.data.quoted_price_cents" } }
          trigger:
            - { call: "POST /shop/tune-tickets/${tk}/approve", payload: { expected_tune_ticket_version: "${v_old}" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
            - { call: "POST /shop/tune-tickets/${tk}/approve", payload: { expected_tune_ticket_version: "${v_new}" }, as: Customer, as_user_id: "${cust}", captures: { st: "$.data.status" } }
          assert:
            - "${q1} == 2500; ${q2} == 3200 (re-quote with 700 parts surcharge)"
            - "Stale approve: ${err} == ERR_STALE_VERSION; HTTP 412"
            - "Current-version approve: ${st} == APPROVED"

      - name: occ_lease_swap_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-swap-stale-version]"]
        distinguishing_aspect: "A swap carrying the version observed before a prior swap is rejected 412 even though all business preconditions (unit eligible, swap_count < 2) hold."
        test_recipe:
          setup: ["ACTIVE lease (version captured after activate); JUNIOR units J2 and J3 available"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T08:00:00Z" }, as: Manager }
            - { call: "POST /shop/customers", payload: { full_name: "Occ Lease", email: "ol@x.com", date_of_birth: "2014-06-01", height_cm: 140, weight_kg: 40, boot_sole_mm: 260, skier_type: "TYPE_1" }, as: FrontDesk, captures: { jun: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Occ Guard", email: "og@x.com", date_of_birth: "1980-03-10", height_cm: 182, weight_kg: 84, boot_sole_mm: 305, skier_type: "TYPE_2" }, as: FrontDesk, captures: { gua: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "130cm", tier: "JUNIOR", din_min: 1, din_max: 6, purchase_price_cents: 30000, base_daily_rate_cents: 2500 }, as: Manager, captures: { j1: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "135cm", tier: "JUNIOR", din_min: 1, din_max: 6, purchase_price_cents: 30000, base_daily_rate_cents: 2500 }, as: Manager, captures: { j2: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "140cm", tier: "JUNIOR", din_min: 1, din_max: 6, purchase_price_cents: 30000, base_daily_rate_cents: 2500 }, as: Manager, captures: { j3: "$.data.id" } }
            - { call: "POST /shop/season-leases", payload: { junior_customer_id: "${jun}", guardian_customer_id: "${gua}", season_start_date: "2026-11-01", season_end_date: "2027-03-31", package_tier: "JUNIOR_SKI", deposit_cents: 10000 }, as: FrontDesk, captures: { lease: "$.data.id" } }
            - { call: "POST /shop/season-leases/${lease}/activate", payload: { equipment_item_id: "${j1}" }, as: FrontDesk, captures: { v_act: "$.data.version" } }
            - { call: "POST /shop/season-leases/${lease}/swap", payload: { new_equipment_item_id: "${j2}", expected_season_lease_version: "${v_act}" }, as: FrontDesk, captures: { v_now: "$.data.version" } }
          trigger:
            - { call: "POST /shop/season-leases/${lease}/swap", payload: { new_equipment_item_id: "${j3}", expected_season_lease_version: "${v_act}" }, as: FrontDesk, captures: { err: "$.data.error_id" } }
          assert:
            - "First swap succeeded (version advanced ${v_act} -> ${v_now})"
            - "Second swap with stale ${v_act}: ${err} == ERR_STALE_VERSION; HTTP 412; lease still on unit ${j2} with swap_count 1"

      - name: selector_assigns_oldest_created_unit
        claim_type: selector_policy
        grounds: ["state_machines.ReservationItem.QUEUED_to_ASSIGNED"]
        distinguishing_aspect: "Auto-assign ranking is deterministic: among equally eligible AVAILABLE units the one with the earliest created_at wins; ids never decide."
        test_recipe:
          setup: ["Two identical eligible SKI STANDARD units created in order u1 then u2; one reservation item"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Sel Ector", email: "sel@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u1: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { u2: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
          trigger:
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk, captures: { got: "$.data.equipment_item_id" } }
          assert: ["${got} == ${u1} (earliest created_at wins); ${got} != ${u2}"]

      - name: cascade_cancel_releases_and_promotes
        claim_type: cascading_side_effects
        grounds: ["state_machines.Reservation"]
        distinguishing_aspect: "Cancel (a different trigger than release) frees the assigned unit and the same waitlist-promotion cascade assigns the queued item of another reservation."
        test_recipe:
          setup: ["R1 CONFIRMED with unit U assigned; R2 item QUEUED (empty pool)"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Can Cel", email: "cc@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { ca: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Wait Listed", email: "wl@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cb: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${ca}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${ca}", captures: { r1: "$.data.id" } }
            - { call: "POST /shop/reservations/${r1}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${ca}", captures: { i1: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i1}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${r1}/confirm", payload: { deposit_authorized_cents: 2400 }, as: Customer, as_user_id: "${ca}" }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cb}", start_date: "2026-12-14", end_date: "2026-12-16", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cb}", captures: { r2: "$.data.id" } }
            - { call: "POST /shop/reservations/${r2}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cb}", captures: { i2: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i2}/assign", payload: {}, as: FrontDesk, captures: { q2: "$.data.status" } }
          trigger:
            - { call: "POST /shop/reservations/${r1}/cancel", payload: {}, as: Customer, as_user_id: "${ca}", captures: { ful: "$.data.fulfillment_status", pay: "$.data.payment_status" } }
          assert:
            - "${ful} == CANCELLED and ${pay} == VOIDED; Reservation.${r1}.deposit_released_cents == 2400"
            - "ReservationItem.${i1}.status == RELEASED"
            - "Promotion cascade: ReservationItem.${i2}.status == ASSIGNED on unit ${unit} (was ${q2} QUEUED before cancel)"

  # ============================================================== consistency model
  - section: consistency_model
    instances:
      - name: confirm_response_immediately_consistent
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the confirm response itself already shows CONFIRMED/AUTHORIZED plus recomputed quote and deposit fields — no re-read needed."
        test_recipe:
          setup: ["Reservation with one ASSIGNED item (quoted 12000)"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Con Sist", email: "cs@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
          trigger:
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 5000 }, as: Customer, as_user_id: "${cust}", captures: { ful: "$.data.fulfillment_status", pay: "$.data.payment_status", qt: "$.data.quoted_total_cents", dm: "$.data.deposit_minimum_cents" } }
          assert:
            - "Same response: ${ful} == CONFIRMED; ${pay} == AUTHORIZED; ${qt} == 12000; ${dm} == 2400"
            - "version incremented from creation value"
