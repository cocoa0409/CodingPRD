scenario: "76. Daycare Enrollment & Billing: waiting list, sibling discount, Sliding Scale, Late Pickup fine, USDA CACFP food reimbursement, parent check-in app, annual Tax Statement"
domain_name: daycare-enrollment-billing
api_prefix: ""

complexity_profile:
  primary_archetype: Pricing engine
  secondary_archetype: Quota / allocation
  complexity_layers:
    - Optimistic concurrency
    - Cascading side effects
    - Dual-variant calculation
    - Rate / threshold triggers

  entity_topology: hybrid
  # Center is a hierarchy root (Classroom under Center); Family/Child/Enrollment/Invoice
  # are flat peers wired by FK; WaitlistEntry crosses Classroom and Child.

  state_machine_shape: branching
  # Enrollment: OFFERED -> {ACCEPTED, DECLINED}, ACTIVE -> {WITHDRAWN, GRADUATED};
  # Invoice has a parallel-ish lifecycle (DRAFT -> ISSUED -> {PAID, VOID}); WaitlistEntry
  # has a branching promote/expire/withdraw shape.

  relationship_patterns:
    - one_to_many       # Center -> Classroom, Family -> Child, Child -> Enrollment
    - cross_aggregate   # WaitlistEntry references Classroom + Child; Invoice references Family + Enrollment
    - self_referential  # Child.sibling_group_id clusters siblings within a Family

  role_model: peer_roles
  # CenterDirector (operator), BillingAdmin (operator), Parent (entity-backed Family),
  # Teacher (entity-backed Classroom, drives check-in/out).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Center
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: daycare center display name
      - name: cacfp_tier
        type: enum
        source: input
        description: "USDA CACFP area-eligibility tier governing per-meal reimbursement rates"
        constraints: "one of {TIER_I, TIER_II}; TIER_I = high reimbursement, TIER_II = low"
      - name: late_pickup_grace_minutes
        type: integer
        source: input
        description: "minutes after a child's scheduled_pickup_time before a late fine accrues"
        default: 5
        constraints: ">= 0"
      - name: late_pickup_fee_per_block_cents
        type: integer
        source: input
        description: "fine charged per started late block (see late_pickup_block_minutes)"
        default: 1500
        constraints: ">= 0"
      - name: late_pickup_block_minutes
        type: integer
        source: input
        description: "size of a late block in minutes; each started block is one chargeable unit"
        default: 15
        constraints: ">= 1"

  - name: Classroom
    parent: Center
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id"
      - name: name
        type: string
        source: input
        description: classroom label (e.g. Infant A, Toddler B)
      - name: age_band
        type: enum
        source: input
        description: "age band served by this classroom"
        constraints: "one of {INFANT, TODDLER, PRESCHOOL}"
      - name: licensed_capacity
        type: integer
        source: input
        description: "maximum number of ACTIVE enrollments allowed in this classroom"
        constraints: ">= 1"
      - name: base_monthly_tuition_cents
        type: integer
        source: input
        description: "list-price monthly tuition for this age band before any discount or sliding scale"
        constraints: ">= 0"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "count of Enrollment rows for this classroom whose status == ACTIVE"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN when active_enrollment_count < licensed_capacity, else FULL; derived after every enrollment mutation"
        default: OPEN
        constraints: "one of {OPEN, FULL}"

  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id"
      - name: primary_contact_name
        type: string
        source: input
        description: name of the enrolling parent/guardian
      - name: annual_household_income_cents
        type: integer
        source: input
        description: "self-reported gross annual household income, drives sliding-scale tier"
        constraints: ">= 0"
      - name: household_size
        type: integer
        source: input
        description: "number of people in the household, drives sliding-scale FPL ratio"
        constraints: ">= 1"
      - name: sliding_scale_tier
        type: enum
        source: computed
        description: "income-based subsidy tier derived from income, household_size, and the SlidingScaleTable; recomputed when income/size change"
        constraints: "one of {TIER_A, TIER_B, TIER_C, FULL_PAY}"
      - name: account_balance_cents
        type: integer
        source: computed
        description: "sum of (total_cents) over this family's Invoices with status == ISSUED, minus paid amounts; positive means owed"
        default: 0

  - name: SlidingScaleTable
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id"
      - name: tier
        type: enum
        source: input
        description: "the subsidy tier this row defines"
        constraints: "one of {TIER_A, TIER_B, TIER_C, FULL_PAY}"
      - name: max_fpl_ratio_pct
        type: integer
        source: input
        description: "upper bound (inclusive) of household income as a percent of the Federal Poverty Level for this tier; the lowest tier whose bound is satisfied wins"
        constraints: ">= 0; FULL_PAY row uses a sentinel of 999999"
      - name: parent_share_pct
        type: integer
        source: input
        description: "percent of base tuition the family pays in this tier (0..100); the remainder is the center's subsidy"
        constraints: "0 <= parent_share_pct <= 100"

  - name: Child
    parent: Family
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id"
      - name: full_name
        type: string
        source: input
        description: child's full name
      - name: birthdate
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD); used to validate age_band fit at enrollment"
      - name: sibling_group_id
        type: string
        source: input
        description: "FK -> Child.id; points to the eldest enrolled sibling that anchors this child's sibling cluster, or self if this child is the anchor"
      - name: enrolls_in_cacfp
        type: boolean
        source: input
        description: "whether the family consented to CACFP meal participation for this child"
        default: true

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id"
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id"
      - name: priority_rank
        type: integer
        source: computed
        description: "queue rank (1 = front); lower wins. Computed as: siblings-of-currently-ACTIVE-children first, then by created_at ASC within the same sibling-priority class"
        default: 0
      - name: has_active_sibling
        type: boolean
        source: computed
        description: "true if this child shares a sibling_group_id with a child holding an ACTIVE Enrollment at the same Center; pins the priority class"
        default: false
      - name: status
        type: enum
        source: system
        description: "lifecycle state of the waitlist entry"
        default: WAITING
        constraints: "one of {WAITING, OFFERED, CONVERTED, EXPIRED, WITHDRAWN}"
      - name: offer_expires_at
        type: datetime
        source: system
        description: "when set on promotion to OFFERED, the UTC instant after which the offer auto-expires"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id"
      - name: classroom_id
        type: string
        source: input
        description: "FK -> Classroom.id"
      - name: waitlist_entry_id
        type: string
        source: input
        description: "FK -> WaitlistEntry.id; the promoted offer this enrollment converts, or null for a direct enrollment"
      - name: status
        type: enum
        source: system
        description: "enrollment lifecycle state"
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, ACTIVE, DECLINED, WITHDRAWN, GRADUATED}"
      - name: sibling_discount_pct
        type: integer
        source: computed
        description: "0 for the anchor sibling, SIBLING_DISCOUNT_PCT for each additional ACTIVE sibling enrollment in the same Family at activation time"
        default: 0
      - name: locked_base_tuition_cents
        type: integer
        source: computed
        description: "Classroom.base_monthly_tuition_cents snapshotted at ACTIVE, so later list-price edits do not retro-bill"
        default: 0
      - name: locked_parent_share_pct
        type: integer
        source: computed
        description: "Family.sliding_scale_tier's parent_share_pct snapshotted at ACTIVE"
        default: 100
      - name: monthly_net_tuition_cents
        type: integer
        source: computed
        description: "computed monthly charge after sliding scale then sibling discount; see calculations.monthly_net_tuition"
        default: 0

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: service_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) of attendance"
      - name: scheduled_pickup_local
        type: string
        source: input
        description: "scheduled pickup wall-clock time on service_date as HH:MM (24h, center-local)"
      - name: check_in_at
        type: datetime
        source: system
        description: "UTC instant the Teacher recorded check-in via the parent check-in app"
      - name: check_out_at
        type: datetime
        source: system
        description: "UTC instant the Teacher recorded check-out; null until checked out"
      - name: meals_breakfast
        type: integer
        source: input
        description: "count of CACFP breakfasts served this day (0 or 1)"
        default: 0
        constraints: "0 <= meals_breakfast <= 1"
      - name: meals_lunch
        type: integer
        source: input
        description: "count of CACFP lunches served this day (0 or 1)"
        default: 0
        constraints: "0 <= meals_lunch <= 1"
      - name: meals_snack
        type: integer
        source: input
        description: "count of CACFP snacks served this day (0, 1, or 2)"
        default: 0
        constraints: "0 <= meals_snack <= 2"
      - name: late_pickup_minutes
        type: integer
        source: computed
        description: "minutes between scheduled_pickup_local and check_out_at beyond the center grace; 0 if on time or not yet checked out"
        default: 0
      - name: late_fine_cents
        type: integer
        source: computed
        description: "fine for this record per calculations.late_pickup_fine; 0 until check_out_at recorded late"
        default: 0
      - name: cacfp_reimbursement_cents
        type: integer
        source: computed
        description: "USDA reimbursement accrued to the center for this day's meals per calculations.cacfp_reimbursement"
        default: 0
      - name: status
        type: enum
        source: system
        description: "attendance record lifecycle"
        default: CHECKED_IN
        constraints: "one of {CHECKED_IN, CHECKED_OUT}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id"
      - name: billing_month
        type: string
        source: input
        description: "billing period as YYYY-MM"
      - name: status
        type: enum
        source: system
        description: "invoice lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, PAID, VOID}"
      - name: tuition_cents
        type: integer
        source: computed
        description: "sum over the family's ACTIVE Enrollments of monthly_net_tuition_cents at issue time"
        default: 0
      - name: late_fines_cents
        type: integer
        source: computed
        description: "sum of AttendanceRecord.late_fine_cents for the family in billing_month, captured at issue time"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "tuition_cents + late_fines_cents; see calculations.invoice_total"
        default: 0
      - name: amount_paid_cents
        type: integer
        source: system
        description: "cumulative payments applied to this invoice"
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: "UTC instant the invoice transitioned DRAFT -> ISSUED"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id"
      - name: amount_cents
        type: integer
        source: input
        description: "payment amount applied to the invoice"
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: "payment method"
        constraints: "one of {CARD, ACH, CASH}"

  - name: TaxStatement
    parent: null
    common_fields: false
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id"
      - name: tax_year
        type: integer
        source: input
        description: "calendar year the statement covers"
        constraints: ">= 2000"
      - name: total_paid_cents
        type: integer
        source: computed
        description: "sum of Payment.amount_cents whose Invoice.family_id == this family AND Invoice.status == PAID AND Invoice.billing_month is within tax_year; see calculations.tax_statement_total"
        default: 0
      - name: child_count
        type: integer
        source: computed
        description: "distinct count of the family's children who held an ACTIVE Enrollment at any point during tax_year"
        default: 0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [CONVERTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /classrooms/{id}/waitlist/promote"
        actor: CenterDirector
        preconditions:
          - "Classroom.status == OPEN (active_enrollment_count < licensed_capacity)"
          - "this entry has the minimum priority_rank among the classroom's WAITING entries (sibling class first, then created_at ASC; entry id never breaks ties)"
        side_effects:
          - "set WaitlistEntry.offer_expires_at = current_utc + WAITLIST_OFFER_TTL_HOURS"
          - "increments WaitlistEntry.version by 1"
        note: "selector picks exactly one WAITING entry deterministically; an empty WAITING set yields ERR_WAITLIST_EMPTY"
      - from: OFFERED
        to: CONVERTED
        trigger: "system: a POST /enrollments that sets waitlist_entry_id to this entry succeeds"
        actor: system
        preconditions:
          - "current_utc <= offer_expires_at"
        side_effects:
          - "creates the linked Enrollment in OFFERED state (see Enrollment initial)"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /classrooms/{id}/waitlist/expire-stale"
        actor: CenterDirector
        preconditions:
          - "current_utc > offer_expires_at"
        side_effects:
          - "increments WaitlistEntry.version by 1"
        note: "auto-expiry is operator-swept, never wall-clock-timer driven; selects all OFFERED entries on the classroom whose offer_expires_at < current_utc"
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /waitlist-entries/{id}/withdraw"
        actor: Parent
        preconditions:
          - "acting Parent owns the Child (Child.family_id == X-User-ID)"
        side_effects:
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /waitlist-entries/{id}/withdraw"
        actor: Parent
        preconditions:
          - "acting Parent owns the Child (Child.family_id == X-User-ID)"
        side_effects:
          - "increments WaitlistEntry.version by 1"

  - entity: Enrollment
    initial_state: OFFERED
    terminal_states: [DECLINED, WITHDRAWN, GRADUATED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /enrollments/{id}/accept"
        actor: Parent
        preconditions:
          - "acting Parent owns the Child (Child.family_id == X-User-ID)"
        side_effects:
          - "increments Enrollment.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /enrollments/{id}/decline"
        actor: Parent
        preconditions:
          - "acting Parent owns the Child (Child.family_id == X-User-ID)"
        side_effects:
          - "if waitlist_entry_id is set, that WaitlistEntry is left CONVERTED (offer already consumed)"
          - "increments Enrollment.version by 1"
      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: CenterDirector
        preconditions:
          - "Classroom.active_enrollment_count < Classroom.licensed_capacity (capacity re-checked at activation, not at offer)"
          - "Child.birthdate fits Classroom.age_band per age-band bounds"
        side_effects:
          - "snapshot locked_base_tuition_cents = Classroom.base_monthly_tuition_cents"
          - "recompute Family.sliding_scale_tier, snapshot locked_parent_share_pct from the matched SlidingScaleTable row"
          - "recompute sibling_discount_pct for THIS enrollment and bump every OTHER ACTIVE sibling enrollment in the Family (cascade: re-rank the family's ACTIVE siblings by enrollment created_at ASC; anchor gets 0%, each junior sibling gets SIBLING_DISCOUNT_PCT, then each affected enrollment's monthly_net_tuition_cents is recomputed)"
          - "set monthly_net_tuition_cents for this enrollment per calculations.monthly_net_tuition"
          - "increment Classroom.active_enrollment_count by 1; recompute Classroom.status (OPEN/FULL)"
          - "increments Enrollment.version by 1"
        note: "compound capacity gate + multi-sibling discount cascade fan into a depth>=3 chain at §1.3"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: CenterDirector
        preconditions:
          - "no ISSUED Invoice references this enrollment's billing for the current month is left unsettled? (not enforced; withdrawal allowed any time)"
        side_effects:
          - "decrement Classroom.active_enrollment_count by 1; recompute Classroom.status"
          - "recompute sibling_discount_pct across the Family's remaining ACTIVE sibling enrollments (cascade: the junior sibling that lost an elder may become the new anchor at 0%; recompute each affected monthly_net_tuition_cents)"
          - "increments Enrollment.version by 1"
        note: "compensating cascade — withdrawing a sibling must conserve the rule 'exactly one anchor at 0% per Family with >=1 ACTIVE sibling'"
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /enrollments/{id}/graduate"
        actor: CenterDirector
        preconditions: []
        side_effects:
          - "decrement Classroom.active_enrollment_count by 1; recompute Classroom.status"
          - "recompute sibling_discount_pct across the Family's remaining ACTIVE sibling enrollments (same cascade as withdraw)"
          - "increments Enrollment.version by 1"

  - entity: AttendanceRecord
    initial_state: CHECKED_IN
    terminal_states: [CHECKED_OUT]
    transitions:
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /attendance-records/{id}/check-out"
        actor: Teacher
        preconditions:
          - "acting Teacher owns the Classroom (Classroom.id == X-User-ID) the enrollment belongs to"
          - "check_out_at is not already set"
        side_effects:
          - "set check_out_at = current_utc"
          - "compute late_pickup_minutes and late_fine_cents per calculations.late_pickup_fine"
          - "compute cacfp_reimbursement_cents per calculations.cacfp_reimbursement"
          - "increments AttendanceRecord.version by 1"
        note: "check-in created the record in CHECKED_IN; meals + late math finalize at check-out"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingAdmin
        preconditions:
          - "the Family has >= 1 ACTIVE Enrollment OR >= 1 late_fine in billing_month (no empty invoices)"
        side_effects:
          - "freeze tuition_cents = sum of family's ACTIVE Enrollment.monthly_net_tuition_cents"
          - "freeze late_fines_cents = sum of family's CHECKED_OUT AttendanceRecord.late_fine_cents in billing_month"
          - "set total_cents = tuition_cents + late_fines_cents; set issued_at = current_utc"
          - "increment Family.account_balance_cents by total_cents (ledger sync)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "system: a POST /payments brings amount_paid_cents >= total_cents"
        actor: system
        preconditions:
          - "amount_paid_cents (after this payment) >= total_cents"
        side_effects:
          - "decrement Family.account_balance_cents by total_cents (ledger sync; balance returns to pre-issue level for this invoice)"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "amount_paid_cents == 0 (cannot void an invoice with payments)"
        side_effects:
          - "decrement Family.account_balance_cents by total_cents (compensation: reverse the issue-time ledger debit)"
          - "increments Invoice.version by 1"
        note: "compensating action — void after issue must conserve Family.account_balance_cents back to its pre-issue value"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: enrollment-create-stale-classroom
    parent_entity: Classroom
    write_endpoint: "POST /enrollments"
    occ_field: "expected_classroom_version"
    description: |
      Creating an Enrollment against a Classroom whose version has advanced
      since the client last observed it is rejected. A direct enrollment
      legitimately consumes one capacity slot; if another writer has already
      added an enrollment (advancing the classroom's version and possibly
      flipping it to FULL), the current writer's view of remaining capacity
      is stale and the create is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payment-apply-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /payments"
    occ_field: "expected_invoice_version"
    description: |
      Applying a Payment against an Invoice whose version has advanced since
      the client last observed it is rejected. A prior payment that pushed the
      invoice to PAID (or a void) advances the invoice version; a Payment built
      against the stale pre-transition view is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: sliding_scale_tier_selection
    trigger: "on Family create, and on PATCH /families/{id} that changes income or household_size; snapshotted into Enrollment.locked_parent_share_pct at OFFERED->...->ACTIVE activate"
    algorithm: threshold
    formula: |
      fpl_base = FPL_BASE_CENTS + (household_size - 1) * FPL_PER_PERSON_CENTS
      fpl_ratio_pct = floor(annual_household_income_cents * 100 / fpl_base)
      # choose the LOWEST-bounded tier whose max_fpl_ratio_pct >= fpl_ratio_pct;
      # iterate SlidingScaleTable rows for the center sorted by max_fpl_ratio_pct ASC,
      # tie-break created_at ASC; first row with max_fpl_ratio_pct >= fpl_ratio_pct wins.
      # FULL_PAY row (max_fpl_ratio_pct = 999999) is the guaranteed catch-all.
      sliding_scale_tier = winning_row.tier
    input_set: "all SlidingScaleTable rows for Family.center_id"
    constants:
      FPL_BASE_CENTS: 1508000          # one-person federal poverty line (annual, cents)
      FPL_PER_PERSON_CENTS: 532000     # incremental per additional household member
    precision: "integer cents; floor on the ratio division"
    variants: []

  - name: monthly_net_tuition
    trigger: "on Enrollment ACCEPTED->ACTIVE activate, and on every sibling-discount cascade recompute (activate/withdraw/graduate of a sibling)"
    algorithm: tiered_pricing
    formula: |
      # Order is PINNED: apply sliding scale FIRST, then sibling discount on the result.
      after_sliding = round_half_up(locked_base_tuition_cents * locked_parent_share_pct / 100)
      monthly_net_tuition_cents = round_half_up(after_sliding * (100 - sibling_discount_pct) / 100)
      # 'sum then round' is NOT used; each factor is applied and rounded in sequence (round per step).
    input_set: "the single Enrollment plus its Family's ACTIVE sibling set for sibling_discount_pct"
    constants:
      SIBLING_DISCOUNT_PCT: 10         # each non-anchor ACTIVE sibling
    precision: "2 implied decimals stored as integer cents, round_half_up at EACH step (pinned order: scale then sibling)"
    variants: []

  - name: late_pickup_fine
    trigger: "on AttendanceRecord CHECKED_IN->CHECKED_OUT check-out"
    algorithm: threshold
    formula: |
      sched_utc = service_date + scheduled_pickup_local interpreted in center-local, converted to UTC
      raw_late_min = max(0, minutes_between(sched_utc, check_out_at))
      billable_late_min = max(0, raw_late_min - Center.late_pickup_grace_minutes)
      # each STARTED block is chargeable: 1 minute over grace already starts block 1.
      blocks = ceil(billable_late_min / Center.late_pickup_block_minutes) if billable_late_min > 0 else 0
      late_fine_cents = blocks * Center.late_pickup_fee_per_block_cents
      late_pickup_minutes = billable_late_min
    input_set: "single AttendanceRecord; thresholds from its Enrollment's Classroom's Center"
    constants: {}
    precision: "integer minutes; ceil on block count; integer cents"
    variants:
      - name: within_grace
        when: "raw_late_min <= grace"
        difference: "billable_late_min == 0 -> blocks 0 -> fine 0 (boundary: exactly grace minutes late is FREE)"
      - name: one_minute_over_grace
        when: "raw_late_min == grace + 1"
        difference: "billable_late_min == 1 -> ceil(1/block)=1 block -> one full block fee charged"

  - name: cacfp_reimbursement
    trigger: "on AttendanceRecord CHECKED_IN->CHECKED_OUT check-out"
    algorithm: aggregation
    formula: |
      # Center.cacfp_tier selects the rate column; only meals on days the child
      # was actually present (status will be CHECKED_OUT) and enrolls_in_cacfp==true count.
      if Child.enrolls_in_cacfp == false: cacfp_reimbursement_cents = 0
      else:
        rate = CACFP_RATES[Center.cacfp_tier]
        cacfp_reimbursement_cents =
            meals_breakfast * rate.breakfast
          + meals_lunch     * rate.lunch
          + meals_snack     * rate.snack
    input_set: "single AttendanceRecord + its Child.enrolls_in_cacfp + Center.cacfp_tier"
    constants:
      CACFP_RATES:
        TIER_I:  { breakfast: 240, lunch: 449, snack: 119 }   # cents per meal, high reimbursement
        TIER_II: { breakfast: 90,  lunch: 271, snack: 33 }    # cents per meal, low reimbursement
    precision: "integer cents"
    variants:
      - name: tier_i_high
        when: "Center.cacfp_tier == TIER_I"
        difference: "uses the high rate column"
      - name: tier_ii_low
        when: "Center.cacfp_tier == TIER_II"
        difference: "uses the low rate column; same meal counts yield a strictly smaller reimbursement"

  - name: invoice_total
    trigger: "on Invoice DRAFT->ISSUED issue"
    algorithm: aggregation
    formula: |
      tuition_cents = sum( e.monthly_net_tuition_cents
                           for e in Enrollments where e.family_id_via_child == Family.id
                           and e.status == ACTIVE )
      late_fines_cents = sum( a.late_fine_cents
                              for a in AttendanceRecords
                              where a.status == CHECKED_OUT
                              and a.enrollment.child.family_id == Family.id
                              and a.service_date is in billing_month )
      total_cents = tuition_cents + late_fines_cents
      # 'sum the already-rounded per-enrollment net tuition' — components are pre-rounded integers,
      # so the sum is exact (no second rounding step).
    input_set: "Family's ACTIVE Enrollments + CHECKED_OUT AttendanceRecords in billing_month"
    constants: {}
    precision: "integer cents; component-then-sum (each monthly_net_tuition_cents already rounded)"
    variants: []

  - name: tax_statement_total
    trigger: "on POST /families/{id}/tax-statements"
    algorithm: chronological
    formula: |
      # Sum payments, not invoices, so partial-pay and void cases stay correct.
      total_paid_cents = sum( p.amount_cents
                              for p in Payments
                              where p.invoice.family_id == Family.id
                              and p.invoice.status == PAID
                              and year_of(p.invoice.billing_month) == tax_year )
      child_count = distinct count of Child.id where the child held status==ACTIVE Enrollment
                    at any point during tax_year (an ACTIVE enrollment whose created_at year
                    <= tax_year is counted)
    input_set: "Family's PAID Invoices in tax_year and their Payments; Family's Enrollments"
    constants: {}
    precision: "integer cents"
    variants:
      - name: cash_basis
        when: "always (this scaffold pins CASH basis: only PAID invoices count, by payment)"
        difference: "an ISSUED-but-unpaid invoice contributes 0; a partially-paid (still ISSUED) invoice contributes 0"

# =====================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path-referenced resource (center, classroom, family, child, enrollment, invoice, waitlist-entry, attendance-record) exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "every FK in the request body references an existing resource (e.g. classroom_id, child_id, family_id, invoice_id, waitlist_entry_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /enrollments, POST /classrooms/{id}/waitlist, POST /children, POST /attendance-records, POST /payments"

  - priority: 5
    category: business_referential
    check: "acting Parent owns the targeted resource (Child.family_id == X-User-ID for child/waitlist/enrollment-accept actions)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /enrollments/{id}/accept, POST /enrollments/{id}/decline, POST /waitlist-entries/{id}/withdraw, POST /children"

  - priority: 6
    category: business_referential
    check: "acting Teacher owns the Classroom (Classroom.id == X-User-ID) the attendance record's enrollment belongs to"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /attendance-records, POST /attendance-records/{id}/check-out"

  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_temporal
    check: "promoting an OFFERED waitlist entry to CONVERTED requires current_utc <= offer_expires_at; expire-stale requires current_utc > offer_expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /enrollments (when waitlist_entry_id set), POST /classrooms/{id}/waitlist/expire-stale"

  - priority: 9
    category: business_constraint
    check: "Child.birthdate must fall within the Classroom.age_band bounds at activation"
    error_id: ERR_AGE_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /enrollments/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "a Child may not hold two non-terminal Enrollments (OFFERED/ACCEPTED/ACTIVE) at once"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 11
    category: business_constraint
    check: "a Child may not have two WAITING/OFFERED WaitlistEntry rows on the same Classroom"
    error_id: ERR_DUPLICATE_WAITLIST
    http_status: 409
    applies_to: "POST /classrooms/{id}/waitlist"

  - priority: 12
    category: business_constraint
    check: "at most one CHECKED_IN AttendanceRecord may exist per enrollment per service_date"
    error_id: ERR_ALREADY_CHECKED_IN
    http_status: 409
    applies_to: "POST /attendance-records"

  - priority: 13
    category: business_safety
    check: "Classroom.active_enrollment_count < licensed_capacity (capacity gate) when activating an enrollment or promoting a waitlist offer"
    error_id: ERR_CLASSROOM_FULL
    http_status: 409
    applies_to: "POST /enrollments/{id}/activate, POST /classrooms/{id}/waitlist/promote"

  - priority: 14
    category: business_constraint
    check: "waitlist promote selector requires a non-empty WAITING set on the classroom"
    error_id: ERR_WAITLIST_EMPTY
    http_status: 409
    applies_to: "POST /classrooms/{id}/waitlist/promote"

  - priority: 15
    category: business_fiscal
    check: "an Invoice with no ACTIVE enrollments and no late fines in billing_month cannot be issued (no empty invoice)"
    error_id: ERR_EMPTY_INVOICE
    http_status: 409
    applies_to: "POST /invoices/{id}/issue"

  - priority: 16
    category: business_fiscal
    check: "a Payment may not exceed the invoice's outstanding (total_cents - amount_paid_cents)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payments"

  - priority: 17
    category: business_fiscal
    check: "an Invoice with amount_paid_cents > 0 cannot be voided"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "POST /invoices/{id}/void"

  - priority: 18
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments, POST /payments"

  - priority: 19
    category: business_constraint
    check: "request body field types/enums/ranges valid (e.g. meals within bounds, parent_share_pct 0..100, positive amounts)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ----- Center / config -----
  - method: POST
    path: "/centers"
    description: "create a daycare center"
    roles: [CenterDirector]
    code: 201
    input: [name, cacfp_tier, "late_pickup_grace_minutes?", "late_pickup_fee_per_block_cents?", "late_pickup_block_minutes?"]
    output: Center
    side_effects: []
  - method: GET
    path: "/centers/{id}"
    description: "fetch a center"
    roles: [CenterDirector, BillingAdmin, Parent, Teacher]
    code: 200
    input: []
    output: Center
    side_effects: []

  - method: POST
    path: "/centers/{id}/sliding-scale"
    description: "add a sliding-scale tier row to a center"
    roles: [CenterDirector]
    code: 201
    input: [tier, max_fpl_ratio_pct, parent_share_pct]
    output: SlidingScaleTable
    side_effects: []
  - method: GET
    path: "/centers/{id}/sliding-scale"
    description: "list sliding-scale rows for a center (reverse-reachability for SlidingScaleTable.center_id)"
    roles: [CenterDirector, BillingAdmin]
    code: 200
    input: []
    output: SlidingScaleTable[]
    side_effects: []

  # ----- Classroom -----
  - method: POST
    path: "/centers/{id}/classrooms"
    description: "create a classroom under a center"
    roles: [CenterDirector]
    code: 201
    input: [name, age_band, licensed_capacity, base_monthly_tuition_cents]
    output: Classroom
    side_effects: ["Classroom.status initialized OPEN"]
  - method: GET
    path: "/centers/{id}/classrooms"
    description: "list classrooms under a center (reverse-reachability for Classroom.center_id)"
    roles: [CenterDirector, BillingAdmin, Parent, Teacher]
    code: 200
    input: []
    output: Classroom[]
    side_effects: []
  - method: GET
    path: "/classrooms/{id}"
    description: "fetch a classroom incl. active_enrollment_count and status"
    roles: [CenterDirector, BillingAdmin, Parent, Teacher]
    code: 200
    input: []
    output: Classroom
    side_effects: []

  # ----- Family / Child -----
  - method: POST
    path: "/families"
    description: "create a family account"
    roles: [CenterDirector, BillingAdmin]
    code: 201
    input: [center_id, primary_contact_name, annual_household_income_cents, household_size]
    output: Family
    side_effects: ["compute sliding_scale_tier from SlidingScaleTable; account_balance_cents = 0"]
  - method: GET
    path: "/families"
    description: "list families, optionally filtered by center_id (reverse-reachability for Family.center_id)"
    roles: [CenterDirector, BillingAdmin]
    code: 200
    input: ["center_id?"]
    output: Family[]
    side_effects: []
  - method: GET
    path: "/families/{id}"
    description: "fetch a family incl. sliding_scale_tier and account_balance_cents"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: PATCH
    path: "/families/{id}"
    description: "update household income/size; recomputes sliding_scale_tier"
    roles: [CenterDirector, BillingAdmin]
    code: 200
    input: ["annual_household_income_cents?", "household_size?"]
    output: Family
    side_effects: ["recompute Family.sliding_scale_tier; increments Family.version by 1"]

  - method: POST
    path: "/children"
    description: "register a child under a family"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 201
    input: [family_id, full_name, birthdate, "sibling_group_id?", "enrolls_in_cacfp?"]
    output: Child
    side_effects: ["if sibling_group_id omitted, default to the child's own id (self-anchor)"]
  - method: GET
    path: "/children"
    description: "list children, filterable by family_id (reverse-reachability for Child.family_id and Child.sibling_group_id)"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: ["family_id?", "sibling_group_id?"]
    output: Child[]
    side_effects: []
  - method: GET
    path: "/children/{id}"
    description: "fetch a child"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: []
    output: Child
    side_effects: []

  # ----- Waitlist -----
  - method: POST
    path: "/classrooms/{id}/waitlist"
    description: "add a child to a classroom's waitlist"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 201
    input: [child_id]
    output: WaitlistEntry
    side_effects: ["compute has_active_sibling and priority_rank; status WAITING"]
  - method: GET
    path: "/classrooms/{id}/waitlist"
    description: "list a classroom's waitlist entries ordered by priority_rank (reverse-reachability for WaitlistEntry.classroom_id)"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: []
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/waitlist-entries"
    description: "list waitlist entries filterable by child_id (reverse-reachability for WaitlistEntry.child_id)"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: ["child_id?", "classroom_id?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/waitlist-entries/{id}"
    description: "fetch a waitlist entry"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: POST
    path: "/classrooms/{id}/waitlist/promote"
    description: "promote the front-of-queue WAITING entry to OFFERED (deterministic selector)"
    roles: [CenterDirector]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["selected entry WAITING->OFFERED; set offer_expires_at"]
  - method: POST
    path: "/classrooms/{id}/waitlist/expire-stale"
    description: "sweep OFFERED entries whose offer_expires_at < current_utc to EXPIRED"
    roles: [CenterDirector]
    code: 200
    input: []
    output: WaitlistEntry[]
    side_effects: ["each stale OFFERED entry OFFERED->EXPIRED"]
  - method: POST
    path: "/waitlist-entries/{id}/withdraw"
    description: "parent withdraws their child's waitlist entry"
    roles: [Parent]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["WAITING|OFFERED -> WITHDRAWN"]

  # ----- Enrollment -----
  - method: POST
    path: "/enrollments"
    description: "create an enrollment (direct, or by converting a promoted waitlist offer)"
    roles: [CenterDirector]
    code: 201
    input: [child_id, classroom_id, expected_classroom_version, "waitlist_entry_id?"]
    output: Enrollment
    side_effects:
      - "Enrollment created in OFFERED"
      - "if waitlist_entry_id set and that entry is OFFERED and not expired, transition it OFFERED->CONVERTED"
      - "increments Classroom.version by 1"
  - method: GET
    path: "/enrollments"
    description: "list enrollments filterable by child_id or classroom_id (reverse-reachability for Enrollment.child_id, Enrollment.classroom_id, Enrollment.waitlist_entry_id)"
    roles: [CenterDirector, BillingAdmin, Parent, Teacher]
    code: 200
    input: ["child_id?", "classroom_id?", "waitlist_entry_id?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/enrollments/{id}"
    description: "fetch an enrollment incl. computed tuition fields"
    roles: [CenterDirector, BillingAdmin, Parent, Teacher]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/accept"
    description: "parent accepts an offered enrollment"
    roles: [Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["OFFERED->ACCEPTED"]
  - method: POST
    path: "/enrollments/{id}/decline"
    description: "parent declines an offered enrollment"
    roles: [Parent]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["OFFERED->DECLINED"]
  - method: POST
    path: "/enrollments/{id}/activate"
    description: "director activates an accepted enrollment (capacity + age gate, snapshot pricing, sibling cascade)"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "ACCEPTED->ACTIVE"
      - "snapshot locked_base_tuition_cents, locked_parent_share_pct"
      - "recompute sibling_discount_pct + monthly_net_tuition_cents across the Family's ACTIVE siblings (cascade)"
      - "increment Classroom.active_enrollment_count; recompute Classroom.status"
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "director withdraws an active enrollment"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "ACTIVE->WITHDRAWN"
      - "decrement Classroom.active_enrollment_count; recompute Classroom.status"
      - "recompute sibling_discount_pct + monthly_net_tuition_cents across remaining ACTIVE siblings (compensating cascade)"
  - method: POST
    path: "/enrollments/{id}/graduate"
    description: "director graduates an active enrollment"
    roles: [CenterDirector]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "ACTIVE->GRADUATED"
      - "decrement Classroom.active_enrollment_count; recompute Classroom.status"
      - "recompute sibling_discount_pct + monthly_net_tuition_cents across remaining ACTIVE siblings"

  # ----- Attendance / check-in app -----
  - method: POST
    path: "/attendance-records"
    description: "teacher checks a child in for a service_date"
    roles: [Teacher]
    code: 201
    input: [enrollment_id, service_date, scheduled_pickup_local, "meals_breakfast?", "meals_lunch?", "meals_snack?"]
    output: AttendanceRecord
    side_effects: ["record created CHECKED_IN; set check_in_at = current_utc"]
  - method: GET
    path: "/attendance-records"
    description: "list attendance records filterable by enrollment_id (reverse-reachability for AttendanceRecord.enrollment_id)"
    roles: [CenterDirector, BillingAdmin, Teacher, Parent]
    code: 200
    input: ["enrollment_id?", "service_date?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: GET
    path: "/attendance-records/{id}"
    description: "fetch an attendance record incl. late fine + CACFP fields"
    roles: [CenterDirector, BillingAdmin, Teacher, Parent]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []
  - method: POST
    path: "/attendance-records/{id}/check-out"
    description: "teacher checks the child out; finalizes late fine + CACFP reimbursement"
    roles: [Teacher]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects:
      - "CHECKED_IN->CHECKED_OUT; set check_out_at = current_utc"
      - "compute late_pickup_minutes, late_fine_cents, cacfp_reimbursement_cents"

  # ----- Invoice / Payment -----
  - method: POST
    path: "/families/{id}/invoices"
    description: "create a draft invoice for a family + billing_month"
    roles: [BillingAdmin]
    code: 201
    input: [billing_month]
    output: Invoice
    side_effects: ["Invoice created DRAFT"]
  - method: GET
    path: "/families/{id}/invoices"
    description: "list a family's invoices (reverse-reachability for Invoice.family_id)"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "fetch an invoice incl. tuition/late/total"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "freeze totals and issue a draft invoice"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "DRAFT->ISSUED; freeze tuition_cents, late_fines_cents, total_cents; set issued_at"
      - "increment Family.account_balance_cents by total_cents"
  - method: POST
    path: "/invoices/{id}/void"
    description: "void a draft or unpaid issued invoice"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "->VOID; if was ISSUED, decrement Family.account_balance_cents by total_cents"
  - method: POST
    path: "/payments"
    description: "apply a payment to an issued invoice"
    roles: [BillingAdmin, Parent]
    code: 201
    input: [invoice_id, amount_cents, method, expected_invoice_version]
    output: Payment
    side_effects:
      - "increment Invoice.amount_paid_cents by amount_cents"
      - "if amount_paid_cents >= total_cents, transition Invoice ISSUED->PAID and decrement Family.account_balance_cents by total_cents"
      - "increments Invoice.version by 1"
  - method: GET
    path: "/invoices/{id}/payments"
    description: "list payments applied to an invoice (reverse-reachability for Payment.invoice_id)"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  # ----- Tax statement -----
  - method: POST
    path: "/families/{id}/tax-statements"
    description: "generate the annual tax statement for a family + tax_year"
    roles: [BillingAdmin, Parent]
    code: 201
    input: [tax_year]
    output: TaxStatement
    side_effects: ["compute total_paid_cents and child_count"]
  - method: GET
    path: "/families/{id}/tax-statements"
    description: "list a family's generated tax statements (reverse-reachability for TaxStatement.family_id)"
    roles: [CenterDirector, BillingAdmin, Parent]
    code: 200
    input: ["tax_year?"]
    output: TaxStatement[]
    side_effects: []

  # ----- Test-driving clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving: pin the server's current UTC instant for offer-expiry and timestamp determinism"
    roles: [CenterDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc set to to_iso8601 for all subsequent timestamp/expiry math"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers, or unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this operation per RBAC matrix"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting Parent does not own the child/resource, or acting Teacher does not own the classroom"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "a FK in the request body references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, bad enum, or out-of-range value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not defined from the resource's current state"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "converting an OFFERED waitlist entry after offer_expires_at, or expire-stale on a non-stale offer"
  - id: ERR_AGE_BAND_MISMATCH
    http: 422
    condition: "child's birthdate does not fit the classroom's age_band at activation"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "child already holds a non-terminal enrollment"
  - id: ERR_DUPLICATE_WAITLIST
    http: 409
    condition: "child already has a WAITING/OFFERED entry on this classroom"
  - id: ERR_ALREADY_CHECKED_IN
    http: 409
    condition: "an active CHECKED_IN attendance record already exists for this enrollment + service_date"
  - id: ERR_CLASSROOM_FULL
    http: 409
    condition: "classroom active_enrollment_count has reached licensed_capacity"
  - id: ERR_WAITLIST_EMPTY
    http: 409
    condition: "promote called on a classroom with no WAITING entries"
  - id: ERR_EMPTY_INVOICE
    http: 409
    condition: "issuing an invoice with no ACTIVE enrollments and no late fines in billing_month"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "payment amount exceeds the invoice's outstanding balance"
  - id: ERR_INVOICE_HAS_PAYMENTS
    http: 409
    condition: "voiding an invoice that already has amount_paid_cents > 0"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: CenterDirector
    description: "operates a center: config, classrooms, families, enrollment lifecycle, waitlist promotion/expiry"
    identity: "opaque"
    exclusive_operations:
      - "POST /centers"
      - "POST /centers/{id}/sliding-scale"
      - "POST /centers/{id}/classrooms"
      - "POST /enrollments"
      - "POST /enrollments/{id}/activate"
      - "POST /enrollments/{id}/withdraw"
      - "POST /enrollments/{id}/graduate"
      - "POST /classrooms/{id}/waitlist/promote"
      - "POST /classrooms/{id}/waitlist/expire-stale"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /families (with BillingAdmin)"
      - "PATCH /families/{id} (with BillingAdmin)"
      - "POST /children (with BillingAdmin, Parent)"
      - "POST /classrooms/{id}/waitlist (with BillingAdmin, Parent)"
      - "GET reads (with others per endpoint roles)"

  - name: BillingAdmin
    description: "manages invoices, payments, tax statements, and family financial records"
    identity: "opaque"
    exclusive_operations:
      - "POST /families/{id}/invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/void"
    shared_operations:
      - "POST /families (with CenterDirector)"
      - "PATCH /families/{id} (with CenterDirector)"
      - "POST /children (with CenterDirector, Parent)"
      - "POST /payments (with Parent)"
      - "POST /families/{id}/tax-statements (with Parent)"
      - "GET reads (with others per endpoint roles)"

  - name: Parent
    description: "the enrolling guardian; acts on their own Family's children, enrollments, waitlist, payments, statements"
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /enrollments/{id}/accept"
      - "POST /enrollments/{id}/decline"
      - "POST /waitlist-entries/{id}/withdraw"
    shared_operations:
      - "POST /children (with CenterDirector, BillingAdmin)"
      - "POST /classrooms/{id}/waitlist (with CenterDirector, BillingAdmin)"
      - "POST /payments (with BillingAdmin)"
      - "POST /families/{id}/tax-statements (with BillingAdmin)"
      - "GET reads on own family's resources"

  - name: Teacher
    description: "operates the parent check-in app for their classroom: records check-in and check-out"
    identity: "entity_backed:Classroom"
    exclusive_operations:
      - "POST /attendance-records"
      - "POST /attendance-records/{id}/check-out"
    shared_operations:
      - "GET reads on own classroom's enrollments/attendance"
