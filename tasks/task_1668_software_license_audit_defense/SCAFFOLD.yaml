# =============================================================================
# PRD Benchmark Seed Tables — Software License Audit Defense
# =============================================================================

scenario: |
  Software License Audit Defense (enterprise software asset management): entitlement
  record consolidation & purchase history, deployment discovery & measurement per
  vendor metric, self-audit gap analysis before vendor engagement, audit notice
  response & scope negotiation, data submission control & privilege consideration,
  settlement/true-up negotiation & future licensing terms, remediation of
  over-deployment, license position monitoring going forward

domain_name: software-license-audit-defense
api_prefix: /sam

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor (licensor) legal name" }
      - { name: vendor_code, type: string, source: input, description: "Unique short vendor code", constraints: "unique across all vendors" }
      - { name: default_license_metric, type: enum, source: input, description: "Default measurement metric for this vendor's products", constraints: "PER_INSTALL | PER_USER | PER_CORE" }
      - { name: notice_response_deadline_days, type: integer, source: input, default: 30, description: "Days the customer has to respond to an audit notice; used to compute AuditCase.response_deadline_on", constraints: "> 0" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; owning vendor" }
      - { name: name, type: string, source: input, description: "Product name (e.g. 'DataGrid Server')" }
      - { name: license_metric, type: enum, source: input, description: "Measurement metric for this product", constraints: "PER_INSTALL | PER_USER | PER_CORE" }
      - { name: unit_list_price_cents, type: integer, source: input, description: "List price per licensed unit, integer cents", constraints: "> 0" }
      - { name: support_rate_pct, type: number, source: input, description: "Annual support/maintenance rate as decimal fraction of list price (e.g. 0.22)", constraints: "0 <= x <= 1" }
      - { name: mission_critical, type: boolean, source: input, default: false, description: "Mission-critical flag; shortens gap_severity escalation (see gap_and_severity calc)" }
      - { name: counts_non_production, type: boolean, source: input, default: false, description: "When true, NON_PRODUCTION DeploymentRecords count toward deployed_quantity; when false only PRODUCTION counts" }

  - name: EntitlementRecord
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product this purchase entitles" }
      - { name: purchase_order_number, type: string, source: input, description: "Purchase order / contract reference from procurement history" }
      - { name: quantity, type: integer, source: input, description: "Licensed units granted", constraints: "> 0" }
      - { name: coverage_class, type: enum, source: input, description: "Usage class the entitlement covers", constraints: "PRODUCTION | NON_PRODUCTION | DISASTER_RECOVERY" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (inclusive; null = perpetual). Window semantics are CLOSED [from, to]: two records of the same product+coverage_class whose windows touch at a boundary date overlap", constraints: "must be > effective_from when present" }
      - { name: source, type: enum, source: input, description: "Provenance of the record; AUTO_TRUE_UP is system-reserved (created by remediation) and rejected on manual create", constraints: "input accepts MANUAL_IMPORT | CONTRACT_EXTRACT; AUTO_TRUE_UP system-only" }
      - { name: status, type: enum, source: system, description: "SCHEDULED (effective_from > now) | ACTIVE | EXPIRED (now >= effective_to) | VOID (manual void of erroneous record)", constraints: "SCHEDULED | ACTIVE | EXPIRED | VOID" }

  - name: DeploymentRecord
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product discovered" }
      - { name: measured_quantity, type: integer, source: input, description: "Measured units under the product's license_metric (installs / named users / cores)", constraints: "> 0" }
      - { name: environment, type: enum, source: input, description: "Environment of the measurement", constraints: "PRODUCTION | NON_PRODUCTION" }
      - { name: measurement_method, type: enum, source: input, description: "How the measurement was obtained", constraints: "SCAN | MANUAL_DECLARATION" }
      - { name: measured_on, type: datetime, source: input, description: "Timestamp of the measurement; must not be in the future at confirm time" }
      - { name: status, type: enum, source: system, description: "REPORTED -> CONFIRMED | REJECTED; CONFIRMED -> EXCLUDED (remediation); EXCLUDED -> CONFIRMED (remediation verification failure)", constraints: "REPORTED | CONFIRMED | REJECTED | EXCLUDED" }
      - { name: excluded_by_remediation_id, type: string, source: system, description: "FK -> RemediationAction.id; set when this record was EXCLUDED by a remediation completion; null otherwise; nullable" }

  - name: LicensePosition
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; exactly one position per product, auto-created with the product" }
      - { name: entitled_quantity, type: integer, source: computed, default: 0, description: "Sum of quantity over EntitlementRecords of this product with status == ACTIVE" }
      - { name: deployed_quantity, type: integer, source: computed, default: 0, description: "Sum of measured_quantity over DeploymentRecords of this product with status == CONFIRMED and (environment == PRODUCTION or product.counts_non_production == true)" }
      - { name: gap_quantity, type: integer, source: computed, default: 0, description: "= deployed_quantity - entitled_quantity; positive means over-deployment" }
      - { name: gap_severity, type: enum, source: computed, default: COMPLIANT, description: "Derived tier per gap_and_severity calculation", constraints: "COMPLIANT | MINOR | MATERIAL | CRITICAL" }
      - { name: self_audit_exposure_cents, type: integer, source: computed, default: 0, description: "Provisional exposure: max(0, gap_quantity) * unit_list_price_cents" }
      - { name: vendor_list_exposure_cents, type: integer, source: computed, default: 0, description: "Pessimistic exposure: max(0, gap_quantity) * round_half_up(unit_list_price_cents * (1 + support_rate_pct))" }
      - { name: position_basis, type: enum, source: system, default: SELF_AUDIT, description: "Which measurement basis currently governs: SELF_AUDIT -> VENDOR_MEASURED (first vendor finding) -> AGREED (settlement accepted)", constraints: "SELF_AUDIT | VENDOR_MEASURED | AGREED" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; auditing vendor" }
      - { name: audit_firm_name, type: string, source: input, description: "Name of the firm conducting the audit on the vendor's behalf" }
      - { name: notice_received_on, type: datetime, source: input, description: "Date the audit notice was received" }
      - { name: response_deadline_on, type: datetime, source: computed, description: "= notice_received_on + vendor.notice_response_deadline_days days; responding/confirming scope after this instant is rejected" }
      - { name: status, type: enum, source: system, description: "Lifecycle: NOTICE_RECEIVED -> SCOPE_NEGOTIATION -> EVIDENCE_COLLECTION -> FINDINGS_REVIEW -> SETTLEMENT_NEGOTIATION -> CLOSED_SETTLED | CLOSED_NO_ACTION | WITHDRAWN; FINDINGS_REVIEW -> EVIDENCE_COLLECTION reopen loop allowed", constraints: "NOTICE_RECEIVED | SCOPE_NEGOTIATION | EVIDENCE_COLLECTION | FINDINGS_REVIEW | SETTLEMENT_NEGOTIATION | CLOSED_SETTLED | CLOSED_NO_ACTION | WITHDRAWN" }
      - { name: provisional_case_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of position.self_audit_exposure_cents over products of CONFIRMED scope items" }
      - { name: worst_case_exposure_cents, type: integer, source: computed, default: 0, description: "Sum over CONFIRMED scope items of (vendor_finding_amount_cents if recorded else position.vendor_list_exposure_cents); sums stored per-line rounded cents without re-rounding" }
      - { name: settled_amount_cents, type: integer, source: system, description: "Accepted settlement amount; null until CLOSED_SETTLED; nullable" }
      - { name: accepted_future_discount_pct, type: number, source: system, description: "Future-licensing discount carried by the accepted offer; null until settlement; nullable" }
      - { name: last_tendered_offer_id, type: string, source: system, description: "id of the currently TENDERED SettlementOffer for this case; null when none pending; nullable" }

  - name: AuditScopeItem
    parent: null
    common_fields: true
    fields:
      - { name: audit_case_id, type: string, source: input, description: "FK -> AuditCase.id; case this scope item belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product proposed into scope" }
      - { name: proposed_by, type: enum, source: system, description: "Negotiating party that proposed the item: VENDOR when created by VendorAuditor, CUSTOMER when created by SAMManager", constraints: "VENDOR | CUSTOMER" }
      - { name: inclusion_rationale, type: string, source: input, description: "Why this product is believed to be in scope" }
      - { name: dispute_rationale, type: string, source: system, description: "Recorded when the customer disputes the item; null until disputed; nullable" }
      - { name: scope_status, type: enum, source: system, description: "PROPOSED -> CONFIRMED | DISPUTED; DISPUTED -> PROPOSED (re-propose loop) | EXCLUDED; CONFIRMED -> EXCLUDED while case in SCOPE_NEGOTIATION", constraints: "PROPOSED | CONFIRMED | DISPUTED | EXCLUDED" }
      - { name: vendor_finding_amount_cents, type: integer, source: computed, description: "Vendor's assessed true-up for this product per vendor_finding_line_pricing; null until a finding is recorded; nullable" }

  - name: DataSubmission
    parent: null
    common_fields: true
    fields:
      - { name: audit_case_id, type: string, source: input, description: "FK -> AuditCase.id; case this evidence package serves" }
      - { name: submission_label, type: string, source: input, description: "Human label for the package (e.g. 'Oracle DB usage extract Q3')" }
      - { name: covered_scope_item_ids, type: array, source: input, description: "Array of AuditScopeItem ids whose position data this package covers; must be non-empty" }
      - { name: contains_privileged, type: boolean, source: input, default: false, description: "Package contains attorney-client privileged material; release requires explicit waiver" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the preparer; segregation of duties: approver/releaser must differ" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PRIVILEGE_REVIEW -> APPROVED -> RELEASED; PRIVILEGE_REVIEW -> DRAFT return loop for redaction", constraints: "DRAFT | PRIVILEGE_REVIEW | APPROVED | RELEASED" }
      - { name: released_on, type: datetime, source: system, description: "Clock timestamp at release; null until RELEASED; nullable" }
      - { name: released_exposure_cents, type: integer, source: computed, description: "Snapshot at release: sum of self_audit_exposure_cents over covered items CONFIRMED at release time; frozen thereafter; null until RELEASED; nullable" }

  - name: SettlementOffer
    parent: null
    common_fields: true
    fields:
      - { name: audit_case_id, type: string, source: input, description: "FK -> AuditCase.id; case under negotiation" }
      - { name: offered_by, type: enum, source: input, description: "Tendering party; CUSTOMER offers by ProcurementLead, VENDOR offers by VendorAuditor", constraints: "CUSTOMER | VENDOR" }
      - { name: tendered_by_user_id, type: string, source: system, description: "X-User-ID of tenderer; acceptor must differ (segregation of duties)" }
      - { name: amount_cents, type: integer, source: input, description: "Offered true-up / settlement amount", constraints: "> 0; CUSTOMER offers additionally capped at AuditCase.worst_case_exposure_cents" }
      - { name: future_license_discount_pct, type: number, source: input, description: "Optional future-licensing discount carried by the offer (0 = none)", default: 0, constraints: "0 <= x <= 0.5" }
      - { name: status, type: enum, source: system, description: "Created directly in TENDERED; TENDERED -> ACCEPTED | WITHDRAWN | SUPERSEDED (auto when a new offer for the same case is tendered)", constraints: "TENDERED | ACCEPTED | WITHDRAWN | SUPERSEDED" }
      - { name: supersedes_offer_id, type: string, source: system, description: "FK -> SettlementOffer.id; the previously TENDERED offer this one replaces; null when none; nullable. Invariant: at most one TENDERED offer exists per audit case at any time (creation of a new offer supersedes it), so the supersede selector is deterministic" }

  - name: RemediationAction
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; over-deployed product being cured" }
      - { name: action_type, type: enum, source: input, description: "UNINSTALL (mark target deployments EXCLUDED) | PURCHASE_TRUE_UP (create AUTO_TRUE_UP entitlement)", constraints: "UNINSTALL | PURCHASE_TRUE_UP" }
      - { name: quantity, type: integer, source: input, description: "Units to cure; input for PURCHASE_TRUE_UP; for UNINSTALL the server ignores any input and computes quantity = sum of target deployments' measured_quantity", constraints: "> 0 when input; must be <= current gap_quantity" }
      - { name: target_deployment_ids, type: array, source: input, description: "DeploymentRecord ids to exclude; required and non-empty for UNINSTALL; forbidden for PURCHASE_TRUE_UP" }
      - { name: status, type: enum, source: system, description: "PLANNED -> IN_PROGRESS -> COMPLETED; COMPLETED -> PLANNED on failed verification (reverses all side effects); PLANNED|IN_PROGRESS -> CANCELLED", constraints: "PLANNED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: generated_entitlement_id, type: string, source: system, description: "id of the AUTO_TRUE_UP EntitlementRecord created on COMPLETED for PURCHASE_TRUE_UP; null otherwise; nullable" }

  - name: MonitoringAlert
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; product whose position breached a monitoring threshold" }
      - { name: alert_type, type: enum, source: system, description: "OVER_DEPLOYMENT (gap_quantity > 0) | ENTITLEMENT_EXPIRING (an ACTIVE entitlement reaches effective_to within 30 days)", constraints: "OVER_DEPLOYMENT | ENTITLEMENT_EXPIRING" }
      - { name: severity, type: enum, source: computed, description: "OVER_DEPLOYMENT maps gap_severity MINOR->INFO, MATERIAL->WARNING, CRITICAL->CRITICAL; ENTITLEMENT_EXPIRING is always WARNING", constraints: "INFO | WARNING | CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN -> SUPPRESSED -> OPEN (auto re-open when the triggering value worsens beyond suppressed_value) ; OPEN|SUPPRESSED -> RESOLVED (auto when condition clears). At most one non-RESOLVED alert per (product_id, alert_type)", constraints: "OPEN | SUPPRESSED | RESOLVED" }
      - { name: triggered_value, type: number, source: computed, description: "Observed value at last trigger: gap_quantity for OVER_DEPLOYMENT, days until effective_to for ENTITLEMENT_EXPIRING" }
      - { name: threshold_value, type: number, source: computed, description: "Threshold breached: 0 for OVER_DEPLOYMENT (condition value > 0), 30 for ENTITLEMENT_EXPIRING (condition 0 <= value <= 30)" }
      - { name: suppressed_value, type: number, source: system, description: "triggered_value captured at suppression; re-open fires when a later evaluation exceeds it; null unless SUPPRESSED; nullable" }
      - { name: suppression_reason, type: string, source: input, description: "Required reason recorded when suppressing an alert" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: EntitlementRecord
    initial_state: ACTIVE
    terminal_states: [EXPIRED, VOID]
    transitions:
      - from: "(create)"
        to: ACTIVE
        trigger: POST /sam/entitlements
        actor: SAMManager | ProcurementLead
        preconditions:
          - "effective_from <= current clock (else initial state is SCHEDULED)"
        side_effects:
          - "LicensePosition of product recomputed (entitled_quantity, gap, severity, exposures)"
          - "AuditCase rollups recomputed for every non-terminal case with a CONFIRMED scope item on this product"
          - "MonitoringAlert upsert for this product"
      - from: "(create)"
        to: SCHEDULED
        trigger: POST /sam/entitlements
        actor: SAMManager | ProcurementLead
        preconditions:
          - "effective_from > current clock"
        side_effects: []
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (clock sweep: effective_from <= current clock)"
        actor: system
        preconditions: []
        side_effects:
          - "LicensePosition recomputed; case rollups recomputed; MonitoringAlert upsert"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: current clock >= effective_to; monotonic, EXPIRED never reverts)"
        actor: system
        preconditions: []
        side_effects:
          - "LicensePosition recomputed (entitled_quantity drops); case rollups recomputed; MonitoringAlert upsert (OVER_DEPLOYMENT may open; ENTITLEMENT_EXPIRING resolves once expired)"
      - from: ACTIVE
        to: VOID
        trigger: POST /sam/entitlements/{entitlementId}/void
        actor: SAMManager
        preconditions:
          - "status in {ACTIVE, SCHEDULED} (ERR_ENTITLEMENT_INVALID_STATE)"
        side_effects:
          - "LicensePosition recomputed (if was ACTIVE, entitled_quantity drops); case rollups recomputed; MonitoringAlert upsert"
      - from: SCHEDULED
        to: VOID
        trigger: POST /sam/entitlements/{entitlementId}/void
        actor: SAMManager
        preconditions:
          - "status in {ACTIVE, SCHEDULED} (ERR_ENTITLEMENT_INVALID_STATE)"
        side_effects: []

  - entity: DeploymentRecord
    initial_state: REPORTED
    terminal_states: [REJECTED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: POST /sam/deployments/{deploymentId}/confirm
        actor: SAMManager
        preconditions:
          - "status == REPORTED (ERR_DEPLOYMENT_INVALID_STATE)"
          - "measured_on <= current clock (ERR_MEASUREMENT_DATE_IN_FUTURE)"
        side_effects:
          - "LicensePosition recomputed (deployed_quantity, gap, severity, exposures)"
          - "AuditCase rollups recomputed for non-terminal cases scoping this product"
          - "MonitoringAlert upsert (OVER_DEPLOYMENT opens/updates/resolves)"
      - from: REPORTED
        to: REJECTED
        trigger: POST /sam/deployments/{deploymentId}/reject
        actor: SAMManager
        preconditions:
          - "status == REPORTED (ERR_DEPLOYMENT_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: EXCLUDED
        trigger: "system (RemediationAction of type UNINSTALL covering this record transitions IN_PROGRESS -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "excluded_by_remediation_id set to the completing RemediationAction id"
          - "LicensePosition recomputed; case rollups recomputed; MonitoringAlert upsert"
      - from: EXCLUDED
        to: CONFIRMED
        trigger: "system (the excluding RemediationAction transitions COMPLETED -> PLANNED via fail-verification)"
        actor: system
        preconditions: []
        side_effects:
          - "excluded_by_remediation_id cleared to null"
          - "LicensePosition recomputed; case rollups recomputed; MonitoringAlert upsert"

  - entity: LicensePosition
    initial_state: SELF_AUDIT
    terminal_states: []
    transitions:
      - from: SELF_AUDIT
        to: VENDOR_MEASURED
        trigger: "system (first vendor-finding recorded on a CONFIRMED scope item for this product)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VENDOR_MEASURED
        to: AGREED
        trigger: "system (a SettlementOffer is ACCEPTED on an audit case with a CONFIRMED scope item for this product)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SELF_AUDIT
        to: AGREED
        trigger: "system (a SettlementOffer is ACCEPTED on an audit case with a CONFIRMED scope item for this product before any finding)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuditCase
    initial_state: NOTICE_RECEIVED
    terminal_states: [CLOSED_SETTLED, CLOSED_NO_ACTION, WITHDRAWN]
    transitions:
      - from: NOTICE_RECEIVED
        to: SCOPE_NEGOTIATION
        trigger: POST /sam/audit-cases/{auditCaseId}/advance  (to_state=SCOPE_NEGOTIATION)
        actor: LegalCounsel
        preconditions:
          - "status == NOTICE_RECEIVED (ERR_AUDIT_CASE_INVALID_STATE)"
          - "current clock <= response_deadline_on (ERR_RESPONSE_DEADLINE_PASSED)"
        side_effects: []
      - from: SCOPE_NEGOTIATION
        to: EVIDENCE_COLLECTION
        trigger: POST /sam/audit-cases/{auditCaseId}/advance  (to_state=EVIDENCE_COLLECTION)
        actor: LegalCounsel
        preconditions:
          - "status == SCOPE_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
          - "no scope item of this case in PROPOSED or DISPUTED status (ERR_SCOPE_ITEMS_PENDING)"
          - "at least one scope item in CONFIRMED status (ERR_EMPTY_AUDIT_SCOPE)"
        side_effects: []
      - from: EVIDENCE_COLLECTION
        to: FINDINGS_REVIEW
        trigger: POST /sam/audit-cases/{auditCaseId}/advance  (to_state=FINDINGS_REVIEW)
        actor: LegalCounsel
        preconditions:
          - "status == EVIDENCE_COLLECTION (ERR_AUDIT_CASE_INVALID_STATE)"
          - "at least one DataSubmission of this case in RELEASED status (ERR_NO_RELEASED_SUBMISSION)"
        side_effects: []
      - from: FINDINGS_REVIEW
        to: SETTLEMENT_NEGOTIATION
        trigger: POST /sam/audit-cases/{auditCaseId}/advance  (to_state=SETTLEMENT_NEGOTIATION)
        actor: LegalCounsel
        preconditions:
          - "status == FINDINGS_REVIEW (ERR_AUDIT_CASE_INVALID_STATE)"
          - "every CONFIRMED scope item has vendor_finding_amount_cents recorded (ERR_FINDINGS_INCOMPLETE)"
        side_effects: []
      - from: FINDINGS_REVIEW
        to: EVIDENCE_COLLECTION
        trigger: POST /sam/audit-cases/{auditCaseId}/reopen-evidence
        actor: VendorAuditor
        preconditions:
          - "status == FINDINGS_REVIEW (ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "increments AuditCase.version by 1"
        note: "Supplemental-data loop: the vendor requests more evidence after reviewing findings"
      - from: FINDINGS_REVIEW
        to: CLOSED_NO_ACTION
        trigger: POST /sam/audit-cases/{auditCaseId}/advance  (to_state=CLOSED_NO_ACTION)
        actor: LegalCounsel
        preconditions:
          - "status == FINDINGS_REVIEW (ERR_AUDIT_CASE_INVALID_STATE)"
          - "worst_case_exposure_cents == 0 (ERR_EXPOSURE_NOT_ZERO)"
        side_effects: []
      - from: SETTLEMENT_NEGOTIATION
        to: CLOSED_SETTLED
        trigger: "system (a SettlementOffer of this case transitions TENDERED -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "settled_amount_cents = accepted offer amount_cents; accepted_future_discount_pct = accepted offer future_license_discount_pct"
          - "LicensePosition.position_basis -> AGREED for every product with a CONFIRMED scope item in this case"
          - "increments AuditCase.version by 1"
      - from: "(any non-terminal)"
        to: WITHDRAWN
        trigger: POST /sam/audit-cases/{auditCaseId}/withdraw
        actor: VendorAuditor
        preconditions:
          - "status not in {CLOSED_SETTLED, CLOSED_NO_ACTION, WITHDRAWN} (ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "currently TENDERED SettlementOffer (if any) -> WITHDRAWN; last_tendered_offer_id cleared"
          - "PROPOSED and DISPUTED scope items -> EXCLUDED"
          - "increments AuditCase.version by 1"

  - entity: AuditScopeItem
    initial_state: PROPOSED
    terminal_states: [EXCLUDED]
    transitions:
      - from: "(create)"
        to: PROPOSED
        trigger: POST /sam/audit-scope-items
        actor: SAMManager | VendorAuditor
        preconditions:
          - "parent case status in {NOTICE_RECEIVED, SCOPE_NEGOTIATION} (ERR_AUDIT_CASE_INVALID_STATE)"
          - "no duplicate scope item for (audit_case_id, product_id) in PROPOSED/CONFIRMED/DISPUTED (ERR_DUPLICATE_SCOPE_ITEM)"
        side_effects:
          - "proposed_by derived from actor role"
      - from: PROPOSED
        to: CONFIRMED
        trigger: POST /sam/audit-scope-items/{scopeItemId}/confirm
        actor: LegalCounsel
        preconditions:
          - "scope_status == PROPOSED (ERR_SCOPE_ITEM_INVALID_STATE)"
          - "parent case status == SCOPE_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
          - "current clock <= case.response_deadline_on (ERR_RESPONSE_DEADLINE_PASSED)"
          - "no other audit case with status not in {CLOSED_SETTLED, CLOSED_NO_ACTION, WITHDRAWN} holds a CONFIRMED scope item for the same product (ERR_PRODUCT_UNDER_CONCURRENT_AUDIT); audit occupation is the half-open interval [notice_received_on, closure) so a case closed before this notice does not block"
        side_effects:
          - "AuditCase rollups recomputed (provisional and worst-case)"
          - "increments parent AuditCase.version by 1"
      - from: PROPOSED
        to: DISPUTED
        trigger: POST /sam/audit-scope-items/{scopeItemId}/dispute
        actor: LegalCounsel
        preconditions:
          - "scope_status == PROPOSED (ERR_SCOPE_ITEM_INVALID_STATE)"
          - "parent case status == SCOPE_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "dispute_rationale recorded from input"
      - from: DISPUTED
        to: PROPOSED
        trigger: POST /sam/audit-scope-items/{scopeItemId}/repropose
        actor: SAMManager | VendorAuditor
        preconditions:
          - "scope_status == DISPUTED (ERR_SCOPE_ITEM_INVALID_STATE)"
          - "parent case status == SCOPE_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "inclusion_rationale replaced by input value"
      - from: PROPOSED
        to: EXCLUDED
        trigger: POST /sam/audit-scope-items/{scopeItemId}/exclude
        actor: LegalCounsel
        preconditions:
          - "scope_status in {PROPOSED, DISPUTED, CONFIRMED} (ERR_SCOPE_ITEM_INVALID_STATE)"
          - "parent case status == SCOPE_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "if was CONFIRMED: AuditCase rollups recomputed; increments parent AuditCase.version by 1"
      - from: DISPUTED
        to: EXCLUDED
        trigger: POST /sam/audit-scope-items/{scopeItemId}/exclude
        actor: LegalCounsel
        preconditions:
          - "scope_status in {PROPOSED, DISPUTED, CONFIRMED} (ERR_SCOPE_ITEM_INVALID_STATE)"
          - "parent case status == SCOPE_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects: []
      - from: CONFIRMED
        to: EXCLUDED
        trigger: POST /sam/audit-scope-items/{scopeItemId}/exclude
        actor: LegalCounsel
        preconditions:
          - "scope_status in {PROPOSED, DISPUTED, CONFIRMED} (ERR_SCOPE_ITEM_INVALID_STATE)"
          - "parent case status == SCOPE_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
        side_effects:
          - "AuditCase rollups recomputed; increments parent AuditCase.version by 1"

  - entity: DataSubmission
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: "(create)"
        to: DRAFT
        trigger: POST /sam/data-submissions
        actor: SAMManager
        preconditions:
          - "parent case status not in {CLOSED_SETTLED, CLOSED_NO_ACTION, WITHDRAWN} (ERR_AUDIT_CASE_INVALID_STATE)"
          - "every id in covered_scope_item_ids exists (ERR_SCOPE_ITEM_NOT_FOUND) and belongs to the same audit case (ERR_SUBMISSION_SCOPE_MISMATCH)"
        side_effects:
          - "prepared_by_user_id stamped from X-User-ID"
      - from: DRAFT
        to: PRIVILEGE_REVIEW
        trigger: POST /sam/data-submissions/{submissionId}/submit-for-review
        actor: SAMManager
        preconditions:
          - "status == DRAFT (ERR_SUBMISSION_INVALID_STATE)"
        side_effects: []
      - from: PRIVILEGE_REVIEW
        to: APPROVED
        trigger: POST /sam/data-submissions/{submissionId}/approve
        actor: LegalCounsel
        preconditions:
          - "status == PRIVILEGE_REVIEW (ERR_SUBMISSION_INVALID_STATE)"
          - "X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: []
      - from: PRIVILEGE_REVIEW
        to: DRAFT
        trigger: POST /sam/data-submissions/{submissionId}/return
        actor: LegalCounsel
        preconditions:
          - "status == PRIVILEGE_REVIEW (ERR_SUBMISSION_INVALID_STATE)"
        side_effects:
          - "return_reason input recorded (revision loop for redaction)"
      - from: APPROVED
        to: RELEASED
        trigger: POST /sam/data-submissions/{submissionId}/release
        actor: LegalCounsel
        preconditions:
          - "status == APPROVED (ERR_SUBMISSION_INVALID_STATE)"
          - "parent case status in {EVIDENCE_COLLECTION, FINDINGS_REVIEW} (ERR_AUDIT_CASE_INVALID_STATE)"
          - "X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "contains_privileged == false OR payload privilege_waiver_confirmed == true (ERR_PRIVILEGED_CONTENT_REQUIRES_WAIVER)"
          - "at least one covered scope item is currently CONFIRMED (ERR_EMPTY_SUBMISSION_PACKAGE)"
        side_effects:
          - "released_on = current clock; released_exposure_cents = sum of self_audit_exposure_cents over covered items CONFIRMED at this instant (frozen snapshot)"
          - "increments parent AuditCase.version by 1"

  - entity: SettlementOffer
    initial_state: TENDERED
    terminal_states: [ACCEPTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: "(create)"
        to: TENDERED
        trigger: POST /sam/settlement-offers
        actor: ProcurementLead | VendorAuditor
        preconditions:
          - "expected_audit_case_version == current AuditCase.version (ERR_STALE_VERSION, 412)"
          - "parent case status == SETTLEMENT_NEGOTIATION (ERR_AUDIT_CASE_INVALID_STATE)"
          - "if offered_by == CUSTOMER: amount_cents <= case.worst_case_exposure_cents (ERR_OFFER_EXCEEDS_WORST_CASE_CAP)"
        side_effects:
          - "previously TENDERED offer for this case (if any) -> SUPERSEDED; supersedes_offer_id set to that offer's id"
          - "case.last_tendered_offer_id = this offer id"
          - "increments AuditCase.version by 1"
      - from: TENDERED
        to: ACCEPTED
        trigger: POST /sam/settlement-offers/{offerId}/accept
        actor: LegalCounsel (for VENDOR offers) | VendorAuditor (for CUSTOMER offers)
        preconditions:
          - "status == TENDERED (ERR_OFFER_INVALID_STATE)"
          - "actor role matches counterparty: offered_by == VENDOR requires LegalCounsel; offered_by == CUSTOMER requires VendorAuditor (ERR_INSUFFICIENT_PERMISSIONS)"
          - "X-User-ID != tendered_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "parent AuditCase -> CLOSED_SETTLED with settled_amount_cents and accepted_future_discount_pct copied from this offer"
          - "LicensePosition.position_basis -> AGREED for every product with a CONFIRMED scope item in this case"
          - "increments AuditCase.version by 1"
      - from: TENDERED
        to: WITHDRAWN
        trigger: POST /sam/settlement-offers/{offerId}/withdraw
        actor: ProcurementLead (CUSTOMER offers) | VendorAuditor (VENDOR offers)
        preconditions:
          - "status == TENDERED (ERR_OFFER_INVALID_STATE)"
          - "actor role matches offered_by party (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "case.last_tendered_offer_id cleared when it referenced this offer"
      - from: TENDERED
        to: SUPERSEDED
        trigger: "system (a new SettlementOffer for the same case is created in TENDERED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemediationAction
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: POST /sam/remediation-actions/{actionId}/start
        actor: SAMManager
        preconditions:
          - "status == PLANNED (ERR_REMEDIATION_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /sam/remediation-actions/{actionId}/complete
        actor: SAMManager
        preconditions:
          - "status == IN_PROGRESS (ERR_REMEDIATION_INVALID_STATE)"
        side_effects:
          - "UNINSTALL: each target DeploymentRecord CONFIRMED -> EXCLUDED with excluded_by_remediation_id = this action"
          - "PURCHASE_TRUE_UP: creates EntitlementRecord(source=AUTO_TRUE_UP, quantity=this.quantity, coverage_class=PRODUCTION, effective_from=current clock, effective_to=null, purchase_order_number='TRUEUP-<action id>'); generated_entitlement_id set"
          - "the new entitlement's activation recomputes LicensePosition (entitled/deployed, gap_quantity, gap_severity, exposures)"
          - "AuditCase rollups recomputed for every non-terminal case scoping this product; each such case's version increments by 1"
          - "MonitoringAlert upsert for this product (OVER_DEPLOYMENT resolves when gap_quantity reaches 0)"
      - from: COMPLETED
        to: PLANNED
        trigger: POST /sam/remediation-actions/{actionId}/fail-verification
        actor: SAMManager
        preconditions:
          - "status == COMPLETED (ERR_REMEDIATION_INVALID_STATE)"
        side_effects:
          - "UNINSTALL: every DeploymentRecord with excluded_by_remediation_id == this action reverts EXCLUDED -> CONFIRMED"
          - "PURCHASE_TRUE_UP: the generated entitlement transitions ACTIVE|SCHEDULED -> VOID; generated_entitlement_id retained for audit"
          - "LicensePosition recomputed; case rollups recomputed; MonitoringAlert upsert (conservation: deployed/entitled quantities return exactly to pre-completion values)"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /sam/remediation-actions/{actionId}/cancel
        actor: SAMManager
        preconditions:
          - "status in {PLANNED, IN_PROGRESS} (ERR_REMEDIATION_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: POST /sam/remediation-actions/{actionId}/cancel
        actor: SAMManager
        preconditions:
          - "status in {PLANNED, IN_PROGRESS} (ERR_REMEDIATION_INVALID_STATE)"
        side_effects: []

  - entity: MonitoringAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: "(upsert)"
        to: OPEN
        trigger: "system (alert condition true and no non-RESOLVED alert exists for (product_id, alert_type))"
        actor: system
        preconditions: []
        side_effects:
          - "severity, triggered_value, threshold_value stamped; created via position recompute or clock sweep"
      - from: OPEN
        to: SUPPRESSED
        trigger: POST /sam/monitoring-alerts/{alertId}/suppress
        actor: SAMManager
        preconditions:
          - "status == OPEN (ERR_ALERT_INVALID_STATE)"
        side_effects:
          - "suppressed_value = current triggered_value; suppression_reason recorded"
      - from: SUPPRESSED
        to: OPEN
        trigger: "system (re-evaluation finds triggered_value strictly worse than suppressed_value: gap_quantity larger, or days-to-expiry smaller)"
        actor: system
        preconditions: []
        side_effects:
          - "same alert row re-opens (id unchanged); suppressed_value cleared"
      - from: OPEN
        to: RESOLVED
        trigger: "system (alert condition false at re-evaluation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUPPRESSED
        to: RESOLVED
        trigger: "system (alert condition false at re-evaluation)"
        actor: system
        preconditions: []

# =============================================================================
# Concurrency Rules (OCC — see SKILL.md 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: offer-create-stale-audit-case
    parent_entity: AuditCase
    write_endpoint: "POST /sam/settlement-offers"
    occ_field: expected_audit_case_version
    description: |
      Creating a SettlementOffer against an AuditCase whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just tendered an offer (which legitimately supersedes the
      prior TENDERED offer and advances the case version), so the current writer's
      view of the negotiation — including the worst-case cap and the pending
      offer — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: entitled_quantity
    trigger: "entitlement create/void, clock sweep (SCHEDULED->ACTIVE, ACTIVE->EXPIRED), PURCHASE_TRUE_UP remediation completion or fail-verification"
    algorithm: aggregation
    formula: |
      entitled_quantity(P) = sum(quantity) over EntitlementRecord
        where product_id == P and status == ACTIVE
      Records in SCHEDULED, EXPIRED, or VOID never contribute.
    input_set: "EntitlementRecords of product P with status == ACTIVE at the current clock"
    precision: "integer units (exact)"

  - name: deployed_quantity
    trigger: "deployment confirm, UNINSTALL remediation completion, remediation fail-verification revert"
    algorithm: aggregation
    formula: |
      deployed_quantity(P) = sum(measured_quantity) over DeploymentRecord
        where product_id == P and status == CONFIRMED
        and (environment == 'PRODUCTION' or Product(P).counts_non_production == true)
      REPORTED, REJECTED, and EXCLUDED records never contribute; NON_PRODUCTION
      records contribute only when the product counts non-production usage.
    input_set: "DeploymentRecords of product P with status == CONFIRMED, environment-filtered by product flag"
    precision: "integer units (exact)"

  - name: gap_and_severity
    trigger: "any recompute of entitled_quantity or deployed_quantity; POST /sam/license-positions/{positionId}/recalculate"
    algorithm: threshold
    formula: |
      gap_quantity = deployed_quantity - entitled_quantity
      if gap_quantity <= 0: gap_severity = COMPLIANT
      elif entitled_quantity == 0: gap_severity = CRITICAL
      elif product.mission_critical and gap_quantity >= MISSION_CRITICAL_QTY: gap_severity = CRITICAL
      elif (deployed_quantity / entitled_quantity) >= MATERIAL_RATIO or gap_quantity >= CRITICAL_QTY: gap_severity = CRITICAL
      elif (deployed_quantity / entitled_quantity) > GRACE_RATIO or gap_quantity >= MATERIAL_QTY: gap_severity = MATERIAL
      else: gap_severity = MINOR
      Ratio comparisons use exact decimal arithmetic (no float drift): a ratio of
      exactly 1.05 is NOT material (strictly-greater rule); exactly 1.25 IS critical.
    input_set: "single LicensePosition row + its Product flags"
    constants:
      GRACE_RATIO: 1.05
      MATERIAL_RATIO: 1.25
      MATERIAL_QTY: 10
      CRITICAL_QTY: 100
      MISSION_CRITICAL_QTY: 25
    precision: "ratio compared as exact decimal; quantities are integers"

  - name: position_exposure
    trigger: "any recompute of gap_quantity; product price/support change via PATCH"
    algorithm: tiered_pricing
    formula: |
      self_audit_exposure_cents  = max(0, gap_quantity) * unit_list_price_cents
      vendor_list_exposure_cents = max(0, gap_quantity) * round_half_up(unit_list_price_cents * (1 + support_rate_pct))
    input_set: "single LicensePosition row + Product pricing fields"
    precision: "integer cents; round_half_up applied to the per-unit factor before multiplying"
    variants:
      - name: self_audit
        when: "provisional / customer-side gap analysis before and during vendor engagement"
        difference: "prices the shortfall at bare list price, no maintenance uplift"
      - name: vendor_list
        when: "pessimistic basis used for worst-case planning while no vendor finding is recorded on a scope item"
        difference: "adds one year of back-support at support_rate_pct per missing unit"

  - name: case_exposure_rollup
    trigger: "scope item confirm/exclude, vendor-finding recorded, position recompute for a scoped product"
    algorithm: aggregation
    formula: |
      Let S = scope items of the case with scope_status == CONFIRMED.
      provisional_case_exposure_cents = sum over S of position(item.product_id).self_audit_exposure_cents
      worst_case_exposure_cents      = sum over S of
          item.vendor_finding_amount_cents   if item.vendor_finding_amount_cents is not null
          else position(item.product_id).vendor_list_exposure_cents
      Both sums add stored integer cents exactly; no re-rounding at the total.
    input_set: "AuditScopeItems of the case with scope_status == CONFIRMED only (PROPOSED/DISPUTED/EXCLUDED never contribute)"
    precision: "integer cents (exact sums of stored cent values)"
    variants:
      - name: provisional
        when: "before any vendor finding is recorded — pure self-audit basis"
        difference: "uses self_audit_exposure_cents (list price only)"
      - name: worst_case
        when: "negotiation floor/cap during settlement — mixes recorded findings with vendor-list estimates"
        difference: "uses recorded vendor_finding_amount_cents where present, vendor_list_exposure_cents elsewhere"

  - name: vendor_finding_line_pricing
    trigger: "POST /sam/audit-scope-items/{scopeItemId}/vendor-finding"
    algorithm: tiered_pricing
    formula: |
      line_cents = round_half_up( gap_quantity(product) * unit_list_price_cents * (1 + BACK_SUPPORT_YEARS * support_rate_pct) )
      where gap_quantity(product) is read from the product's LicensePosition AT THE
      MOMENT of the finding. The rounded per-line cent value is STORED on the scope
      item (vendor_finding_amount_cents) and never recomputed retroactively; the
      case-level worst_case total sums the stored per-line rounded values.
      PINNED ROUNDING ORDER: round each line to cents first, then sum lines.
      (Sum-then-round is a different, rejected algorithm and yields different cents
      whenever per-line fractions accumulate below 0.5.)
    input_set: "single CONFIRMED scope item + its product's LicensePosition and pricing fields"
    constants:
      BACK_SUPPORT_YEARS: 2
    precision: "integer cents, round_half_up per line, then exact integer sum"

  - name: response_deadline
    trigger: "audit case creation"
    algorithm: chronological
    formula: |
      response_deadline_on = notice_received_on + vendor.notice_response_deadline_days days
      Responding (advance to SCOPE_NEGOTIATION) or confirming scope at a clock time
      strictly greater than response_deadline_on is rejected; exactly at the deadline is allowed.
    input_set: "AuditCase.notice_received_on + Vendor.notice_response_deadline_days"
    precision: "datetime, inclusive boundary (<= passes)"

  - name: alert_evaluation
    trigger: "LicensePosition recompute (OVER_DEPLOYMENT) and clock sweep (ENTITLEMENT_EXPIRING)"
    algorithm: threshold
    formula: |
      OVER_DEPLOYMENT condition: gap_quantity > 0
        boundary: gap_quantity == 0 does NOT trigger (strictly greater)
        severity: gap_severity MINOR -> INFO, MATERIAL -> WARNING, CRITICAL -> CRITICAL
        triggered_value = gap_quantity, threshold_value = 0
      ENTITLEMENT_EXPIRING condition: exists EntitlementRecord of the product with
        status == ACTIVE and 0 <= floor_days(effective_to - now) <= EXPIRY_WARNING_DAYS
        boundary: exactly 30 days remaining DOES trigger (inclusive); 31 does not
        triggered_value = min days-to-expiry over matching records, threshold_value = 30
        severity = WARNING
      Upsert rule: at most one alert per (product_id, alert_type) with status in
      {OPEN, SUPPRESSED}; a new trigger while SUPPRESSED re-opens the same row only
      when the value worsened beyond suppressed_value; condition false resolves
      any OPEN/SUPPRESSED row.
    input_set: "LicensePosition of each product; ACTIVE EntitlementRecords vs current clock"
    constants:
      EXPIRY_WARNING_DAYS: 30
    precision: "days computed as floor of (effective_to - now) in whole days"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC (including offered_by/role party match on settlement offers and VendorAuditor read restrictions)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: request_shape
    check: "Required fields present; types match; enum values valid; quantity/amount_cents > 0; effective_from < effective_to when both present; covered_scope_item_ids / target_deployment_ids non-empty where required; entitlement source restricted to MANUAL_IMPORT | CONTRACT_EXTRACT on manual create; future_license_discount_pct in [0, 0.5]; unknown request fields (including client-supplied id/version/created_at) are ignored, not rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints

  - priority: 4
    category: existence
    check: "Path ids exist left-to-right, then body-referenced ids (vendor_id, product_id, audit_case_id, covered_scope_item_ids, target_deployment_ids)"
    error_id: ERR_VENDOR_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_ENTITLEMENT_NOT_FOUND / ERR_DEPLOYMENT_NOT_FOUND / ERR_LICENSE_POSITION_NOT_FOUND / ERR_AUDIT_CASE_NOT_FOUND / ERR_SCOPE_ITEM_NOT_FOUND / ERR_SUBMISSION_NOT_FOUND / ERR_OFFER_NOT_FOUND / ERR_REMEDIATION_NOT_FOUND / ERR_ALERT_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 5
    category: concurrency
    check: "expected_audit_case_version equals current AuditCase.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sam/settlement-offers"

  - priority: 6
    category: state
    check: "Target resource's own status permits the transition (per state machines); then cross-entity state gates in this pinned order: parent case status for scope/submission/offer operations; advance-specific gates ERR_SCOPE_ITEMS_PENDING, ERR_EMPTY_AUDIT_SCOPE, ERR_NO_RELEASED_SUBMISSION, ERR_FINDINGS_INCOMPLETE, ERR_EXPOSURE_NOT_ZERO"
    error_id: ERR_AUDIT_CASE_INVALID_STATE / ERR_SCOPE_ITEM_INVALID_STATE / ERR_SUBMISSION_INVALID_STATE / ERR_OFFER_INVALID_STATE / ERR_DEPLOYMENT_INVALID_STATE / ERR_REMEDIATION_INVALID_STATE / ERR_ALERT_INVALID_STATE / ERR_ENTITLEMENT_INVALID_STATE / ERR_SCOPE_ITEMS_PENDING / ERR_EMPTY_AUDIT_SCOPE / ERR_NO_RELEASED_SUBMISSION / ERR_FINDINGS_INCOMPLETE / ERR_EXPOSURE_NOT_ZERO
    http_status: 409
    applies_to: all action endpoints

  - priority: 7
    category: business_temporal
    check: "current clock <= response_deadline_on for advance-to-SCOPE_NEGOTIATION and scope confirm; deployment measured_on <= current clock at confirm"
    error_id: ERR_RESPONSE_DEADLINE_PASSED / ERR_MEASUREMENT_DATE_IN_FUTURE
    http_status: 409
    applies_to: "POST /sam/audit-cases/{id}/advance, POST /sam/audit-scope-items/{id}/confirm, POST /sam/deployments/{id}/confirm"

  - priority: 8
    category: business_constraint
    check: "vendor_code uniqueness; no duplicate scope item for (audit_case_id, product_id) in PROPOSED/CONFIRMED/DISPUTED; product not CONFIRMED in another non-terminal audit case; entitlement window overlap (closed intervals, same product+coverage_class, non-terminal status, source != AUTO_TRUE_UP)"
    error_id: ERR_DUPLICATE_VENDOR_CODE / ERR_DUPLICATE_SCOPE_ITEM / ERR_PRODUCT_UNDER_CONCURRENT_AUDIT / ERR_ENTITLEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /sam/vendors, POST /sam/audit-scope-items, POST /sam/audit-scope-items/{id}/confirm, POST /sam/entitlements"

  - priority: 9
    category: business_safety
    check: "segregation of duties: submission approve/release and offer accept require actor != preparer/tenderer; privileged content release requires explicit waiver"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION / ERR_PRIVILEGED_CONTENT_REQUIRES_WAIVER
    http_status: 403
    applies_to: "POST /sam/data-submissions/{id}/approve, POST /sam/data-submissions/{id}/release, POST /sam/settlement-offers/{id}/accept"

  - priority: 10
    category: business_referential
    check: "covered scope items belong to the submission's audit case; remediation UNINSTALL targets belong to action.product_id and are CONFIRMED; at least one covered scope item is CONFIRMED at release"
    error_id: ERR_SUBMISSION_SCOPE_MISMATCH / ERR_REMEDIATION_TARGET_INVALID / ERR_EMPTY_SUBMISSION_PACKAGE
    http_status: 422
    applies_to: "POST /sam/data-submissions, POST /sam/data-submissions/{id}/release, POST /sam/remediation-actions"

  - priority: 11
    category: business_fiscal
    check: "CUSTOMER offer amount_cents <= case.worst_case_exposure_cents; remediation quantity <= current gap_quantity of the product's LicensePosition"
    error_id: ERR_OFFER_EXCEEDS_WORST_CASE_CAP / ERR_REMEDIATION_EXCEEDS_GAP
    http_status: 422
    applies_to: "POST /sam/settlement-offers, POST /sam/remediation-actions"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Vendors & Products (catalog administration) ---
  - method: POST
    path: "/sam/vendors"
    description: "Register a software vendor (licensor)"
    roles: [SAMPlatformAdmin]
    code: 201
    input: [name, vendor_code, default_license_metric, "notice_response_deadline_days?"]
    output: Vendor
    side_effects: []

  - method: POST
    path: "/sam/products"
    description: "Register a licensed product; auto-creates its LicensePosition (all quantities 0, COMPLIANT, SELF_AUDIT)"
    roles: [SAMPlatformAdmin]
    code: 201
    input: [vendor_id, name, license_metric, unit_list_price_cents, support_rate_pct, "mission_critical?", "counts_non_production?"]
    output: Product
    side_effects: ["creates the product's LicensePosition"]

  - method: GET
    path: "/sam/products"
    description: "List products; optional vendor filter"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: ["vendor_id?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/sam/products/{productId}"
    description: "Get a product"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: PATCH
    path: "/sam/products/{productId}"
    description: "Update pricing/flags; recomputes the product's LicensePosition exposures and case rollups"
    roles: [SAMPlatformAdmin]
    code: 200
    input: ["name?", "unit_list_price_cents?", "support_rate_pct?", "mission_critical?", "counts_non_production?"]
    output: Product
    side_effects: ["LicensePosition recomputed", "case rollups recomputed", "MonitoringAlert upsert"]

  # --- Entitlement consolidation & purchase history ---
  - method: POST
    path: "/sam/entitlements"
    description: "Consolidate a purchase/entitlement record; window-overlap and initial status (ACTIVE vs SCHEDULED) per clock"
    roles: [SAMManager, ProcurementLead]
    code: 201
    input: [product_id, purchase_order_number, quantity, coverage_class, effective_from, source, "effective_to?"]
    output: EntitlementRecord
    side_effects: ["LicensePosition recomputed when initial status is ACTIVE", "case rollups recomputed", "MonitoringAlert upsert"]

  - method: GET
    path: "/sam/products/{id}/entitlements"
    description: "List entitlement records of a product (purchase history)"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EntitlementRecord[]"
    side_effects: []

  - method: POST
    path: "/sam/entitlements/{entitlementId}/void"
    description: "Void an erroneous/duplicate entitlement record"
    roles: [SAMManager]
    code: 200
    input: []
    output: EntitlementRecord
    side_effects: ["LicensePosition recomputed when record was ACTIVE", "case rollups recomputed", "MonitoringAlert upsert"]

  # --- Deployment discovery & measurement ---
  - method: POST
    path: "/sam/deployments"
    description: "Record a deployment measurement per the product's vendor metric"
    roles: [ITAnalyst]
    code: 201
    input: [product_id, measured_quantity, environment, measurement_method, measured_on]
    output: DeploymentRecord
    side_effects: []

  - method: GET
    path: "/sam/products/{id}/deployments"
    description: "List deployment records of a product"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeploymentRecord[]"
    side_effects: []

  - method: POST
    path: "/sam/deployments/{deploymentId}/confirm"
    description: "Confirm a reported measurement into the license position"
    roles: [SAMManager]
    code: 200
    input: []
    output: DeploymentRecord
    side_effects: ["LicensePosition recomputed", "case rollups recomputed", "MonitoringAlert upsert"]

  - method: POST
    path: "/sam/deployments/{deploymentId}/reject"
    description: "Reject an erroneous measurement (terminal)"
    roles: [SAMManager]
    code: 200
    input: ["rejection_reason?"]
    output: DeploymentRecord
    side_effects: []

  # --- License position (self-audit gap analysis) ---
  - method: GET
    path: "/sam/products/{id}/license-positions"
    description: "Get the product's license position (array of length 0-1)"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: []
    output: "LicensePosition[]"
    side_effects: []

  - method: POST
    path: "/sam/license-positions/{positionId}/recalculate"
    description: "Explicitly recompute entitled/deployed/gap/severity/exposures from source records (gap analysis refresh)"
    roles: [SAMManager]
    code: 200
    input: []
    output: LicensePosition
    side_effects: ["all computed fields refreshed", "case rollups recomputed", "MonitoringAlert upsert"]

  # --- Audit case (notice response & lifecycle) ---
  - method: POST
    path: "/sam/audit-cases"
    description: "Open an audit case from a vendor audit notice; response_deadline_on computed"
    roles: [LegalCounsel]
    code: 201
    input: [vendor_id, audit_firm_name, notice_received_on]
    output: AuditCase
    side_effects: []

  - method: GET
    path: "/sam/audit-cases"
    description: "List audit cases; optional vendor/status filters"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead, VendorAuditor]
    code: 200
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: "AuditCase[]"
    side_effects: []

  - method: GET
    path: "/sam/audit-cases/{auditCaseId}"
    description: "Get an audit case including rollup exposures"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead, VendorAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: POST
    path: "/sam/audit-cases/{auditCaseId}/advance"
    description: "Advance the case lifecycle; to_state selects the target per the state machine"
    roles: [LegalCounsel]
    code: 200
    input: [to_state]
    output: AuditCase
    side_effects: ["per AuditCase state machine"]

  - method: POST
    path: "/sam/audit-cases/{auditCaseId}/reopen-evidence"
    description: "Vendor requests supplemental evidence: FINDINGS_REVIEW -> EVIDENCE_COLLECTION"
    roles: [VendorAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["increments AuditCase.version by 1"]

  - method: POST
    path: "/sam/audit-cases/{auditCaseId}/withdraw"
    description: "Vendor withdraws the audit from any non-terminal state"
    roles: [VendorAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["TENDERED offer -> WITHDRAWN", "PROPOSED/DISPUTED scope items -> EXCLUDED", "increments AuditCase.version by 1"]

  # --- Scope negotiation ---
  - method: POST
    path: "/sam/audit-scope-items"
    description: "Propose a product into audit scope; proposed_by derived from actor role (VendorAuditor->VENDOR, SAMManager->CUSTOMER)"
    roles: [SAMManager, VendorAuditor]
    code: 201
    input: [audit_case_id, product_id, inclusion_rationale]
    output: AuditScopeItem
    side_effects: []

  - method: GET
    path: "/sam/audit-cases/{id}/scope-items"
    description: "List scope items of a case"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead, VendorAuditor]
    code: 200
    input: ["scope_status?", "limit?", "offset?"]
    output: "AuditScopeItem[]"
    side_effects: []

  - method: GET
    path: "/sam/products/{id}/audit-scope-items"
    description: "List scope items referencing a product (across cases)"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead, VendorAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditScopeItem[]"
    side_effects: []

  - method: POST
    path: "/sam/audit-scope-items/{scopeItemId}/confirm"
    description: "Customer accepts a proposed item into confirmed scope"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: AuditScopeItem
    side_effects: ["case rollups recomputed", "increments parent AuditCase.version by 1"]

  - method: POST
    path: "/sam/audit-scope-items/{scopeItemId}/dispute"
    description: "Customer disputes a proposed item"
    roles: [LegalCounsel]
    code: 200
    input: [dispute_rationale]
    output: AuditScopeItem
    side_effects: []

  - method: POST
    path: "/sam/audit-scope-items/{scopeItemId}/repropose"
    description: "Re-propose a disputed item with a revised rationale (negotiation loop)"
    roles: [SAMManager, VendorAuditor]
    code: 200
    input: [inclusion_rationale]
    output: AuditScopeItem
    side_effects: []

  - method: POST
    path: "/sam/audit-scope-items/{scopeItemId}/exclude"
    description: "Exclude an item from scope while the case is in SCOPE_NEGOTIATION"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: AuditScopeItem
    side_effects: ["case rollups recomputed when item was CONFIRMED", "increments parent AuditCase.version by 1"]

  - method: POST
    path: "/sam/audit-scope-items/{scopeItemId}/vendor-finding"
    description: "Vendor records its assessed true-up finding for an item (per-line rounded pricing, snapshotted). Preconditions: scope_status == CONFIRMED (ERR_SCOPE_ITEM_INVALID_STATE) and parent case status == FINDINGS_REVIEW (ERR_AUDIT_CASE_INVALID_STATE)"
    roles: [VendorAuditor]
    code: 200
    input: []
    output: AuditScopeItem
    side_effects: ["vendor_finding_amount_cents computed and stored", "LicensePosition.position_basis -> VENDOR_MEASURED (first finding)", "case worst_case_exposure_cents recomputed", "increments parent AuditCase.version by 1"]

  # --- Data submission control & privilege ---
  - method: POST
    path: "/sam/data-submissions"
    description: "Prepare an evidence package covering scope items of a case"
    roles: [SAMManager]
    code: 201
    input: [audit_case_id, submission_label, covered_scope_item_ids, "contains_privileged?"]
    output: DataSubmission
    side_effects: ["prepared_by_user_id stamped from X-User-ID"]

  - method: GET
    path: "/sam/audit-cases/{id}/data-submissions"
    description: "List submissions of a case; VendorAuditor sees only RELEASED rows (server-side filter)"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead, VendorAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DataSubmission[]"
    side_effects: []

  - method: POST
    path: "/sam/data-submissions/{submissionId}/submit-for-review"
    description: "Send a draft package to privilege review"
    roles: [SAMManager]
    code: 200
    input: []
    output: DataSubmission
    side_effects: []

  - method: POST
    path: "/sam/data-submissions/{submissionId}/approve"
    description: "Counsel approves a package (cannot be the preparer)"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: DataSubmission
    side_effects: []

  - method: POST
    path: "/sam/data-submissions/{submissionId}/return"
    description: "Counsel returns a package to DRAFT for redaction (revision loop)"
    roles: [LegalCounsel]
    code: 200
    input: [return_reason]
    output: DataSubmission
    side_effects: []

  - method: POST
    path: "/sam/data-submissions/{submissionId}/release"
    description: "Release an approved package to the auditor; snapshots covered self-audit exposure; privileged content needs waiver"
    roles: [LegalCounsel]
    code: 200
    input: ["privilege_waiver_confirmed?"]
    output: DataSubmission
    side_effects: ["released_on/released_exposure_cents snapshot", "increments parent AuditCase.version by 1"]

  # --- Settlement / true-up negotiation ---
  - method: POST
    path: "/sam/settlement-offers"
    description: "Tender a settlement offer (created directly TENDERED); supersedes the case's pending offer; OCC-guarded on the case version"
    roles: [ProcurementLead, VendorAuditor]
    code: 201
    input: [audit_case_id, offered_by, amount_cents, expected_audit_case_version, "future_license_discount_pct?"]
    output: SettlementOffer
    side_effects: ["prior TENDERED offer -> SUPERSEDED", "case.last_tendered_offer_id set", "increments AuditCase.version by 1"]

  - method: GET
    path: "/sam/settlement-offers"
    description: "List offers; filter by case, supersession chain, or status"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead, VendorAuditor]
    code: 200
    input: ["audit_case_id?", "supersedes_offer_id?", "status?", "limit?", "offset?"]
    output: "SettlementOffer[]"
    side_effects: []

  - method: GET
    path: "/sam/settlement-offers/{offerId}"
    description: "Get a settlement offer"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead, VendorAuditor]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: []

  - method: POST
    path: "/sam/settlement-offers/{offerId}/accept"
    description: "Counterparty accepts a tendered offer; closes the case as CLOSED_SETTLED"
    roles: [LegalCounsel, VendorAuditor]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["AuditCase -> CLOSED_SETTLED with settled terms", "scoped positions -> AGREED", "increments AuditCase.version by 1"]

  - method: POST
    path: "/sam/settlement-offers/{offerId}/withdraw"
    description: "Tendering party withdraws its pending offer"
    roles: [ProcurementLead, VendorAuditor]
    code: 200
    input: []
    output: SettlementOffer
    side_effects: ["case.last_tendered_offer_id cleared when referencing this offer"]

  # --- Remediation of over-deployment ---
  - method: POST
    path: "/sam/remediation-actions"
    description: "Plan a remediation (UNINSTALL with target deployments, or PURCHASE_TRUE_UP with quantity)"
    roles: [SAMManager]
    code: 201
    input: [product_id, action_type, "quantity?", "target_deployment_ids?"]
    output: RemediationAction
    side_effects: []

  - method: GET
    path: "/sam/remediation-actions/{actionId}"
    description: "Get a remediation action"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: []
    output: RemediationAction
    side_effects: []

  - method: GET
    path: "/sam/products/{id}/remediation-actions"
    description: "List remediation actions of a product"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RemediationAction[]"
    side_effects: []

  - method: GET
    path: "/sam/remediation-actions/{id}/deployments"
    description: "List deployment records excluded by this remediation"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeploymentRecord[]"
    side_effects: []

  - method: POST
    path: "/sam/remediation-actions/{actionId}/start"
    description: "Begin executing a planned remediation"
    roles: [SAMManager]
    code: 200
    input: []
    output: RemediationAction
    side_effects: []

  - method: POST
    path: "/sam/remediation-actions/{actionId}/complete"
    description: "Complete a remediation; applies entitlement/deployment effects and recomputes positions, rollups, alerts"
    roles: [SAMManager]
    code: 200
    input: []
    output: RemediationAction
    side_effects: ["per RemediationAction state machine (cascade: deployment exclusion or AUTO_TRUE_UP entitlement -> position -> case rollups -> alerts)"]

  - method: POST
    path: "/sam/remediation-actions/{actionId}/cancel"
    description: "Cancel a planned or in-progress remediation"
    roles: [SAMManager]
    code: 200
    input: []
    output: RemediationAction
    side_effects: []

  - method: POST
    path: "/sam/remediation-actions/{actionId}/fail-verification"
    description: "Mark a completed remediation as failed verification; reverses all completion effects (compensating action)"
    roles: [SAMManager]
    code: 200
    input: ["verification_notes?"]
    output: RemediationAction
    side_effects: ["deployment exclusions reverted or generated entitlement VOIDed", "positions/rollups/alerts recomputed"]

  # --- Position monitoring going forward ---
  - method: GET
    path: "/sam/products/{id}/monitoring-alerts"
    description: "List monitoring alerts of a product"
    roles: [SAMPlatformAdmin, SAMManager, ITAnalyst, LegalCounsel, ProcurementLead]
    code: 200
    input: ["status?", "alert_type?", "limit?", "offset?"]
    output: "MonitoringAlert[]"
    side_effects: []

  - method: POST
    path: "/sam/monitoring-alerts/{alertId}/suppress"
    description: "Suppress an OPEN alert with a reason; re-opens automatically if the condition worsens"
    roles: [SAMManager]
    code: 200
    input: [suppression_reason]
    output: MonitoringAlert
    side_effects: ["suppressed_value stamped"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Triggers the entitlement sweep (SCHEDULED->ACTIVE, ACTIVE->EXPIRED), ENTITLEMENT_EXPIRING alert sweep, position recomputes and case rollups for affected products."
    roles: [SAMPlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["entitlement status sweep", "expiry alert sweep", "position recompute for affected products", "case rollups recomputed"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not recognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint (includes offered_by/role party mismatch on offers and VendorAuditor access to internal-only reads)" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, non-positive quantity/amount, empty required array, effective_from >= effective_to, or AUTO_TRUE_UP source on manual create" }
  # --- Existence (404) ---
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "vendor id (path or body) does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product id (path or body) does not exist" }
  - { id: ERR_ENTITLEMENT_NOT_FOUND, http: 404, condition: "entitlement id does not exist" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "deployment id (path or in target_deployment_ids) does not exist" }
  - { id: ERR_LICENSE_POSITION_NOT_FOUND, http: 404, condition: "license position id does not exist" }
  - { id: ERR_AUDIT_CASE_NOT_FOUND, http: 404, condition: "audit case id (path or body) does not exist" }
  - { id: ERR_SCOPE_ITEM_NOT_FOUND, http: 404, condition: "scope item id (path or in covered_scope_item_ids) does not exist" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "data submission id does not exist" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "settlement offer id does not exist" }
  - { id: ERR_REMEDIATION_NOT_FOUND, http: 404, condition: "remediation action id does not exist" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "monitoring alert id does not exist" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_audit_case_version does not match the current AuditCase.version (OCC)" }
  # --- State (409) ---
  - { id: ERR_AUDIT_CASE_INVALID_STATE, http: 409, condition: "AuditCase status does not permit the requested transition or child operation" }
  - { id: ERR_SCOPE_ITEM_INVALID_STATE, http: 409, condition: "AuditScopeItem scope_status does not permit the requested transition" }
  - { id: ERR_SUBMISSION_INVALID_STATE, http: 409, condition: "DataSubmission status does not permit the requested transition" }
  - { id: ERR_OFFER_INVALID_STATE, http: 409, condition: "SettlementOffer status is not TENDERED for accept/withdraw" }
  - { id: ERR_DEPLOYMENT_INVALID_STATE, http: 409, condition: "DeploymentRecord status is not REPORTED for confirm/reject" }
  - { id: ERR_REMEDIATION_INVALID_STATE, http: 409, condition: "RemediationAction status does not permit the requested transition" }
  - { id: ERR_ALERT_INVALID_STATE, http: 409, condition: "MonitoringAlert status is not OPEN for suppress" }
  - { id: ERR_ENTITLEMENT_INVALID_STATE, http: 409, condition: "EntitlementRecord status is not ACTIVE or SCHEDULED for void" }
  - { id: ERR_SCOPE_ITEMS_PENDING, http: 409, condition: "Advance to EVIDENCE_COLLECTION while PROPOSED or DISPUTED scope items remain" }
  - { id: ERR_EMPTY_AUDIT_SCOPE, http: 409, condition: "Advance to EVIDENCE_COLLECTION with zero CONFIRMED scope items" }
  - { id: ERR_NO_RELEASED_SUBMISSION, http: 409, condition: "Advance to FINDINGS_REVIEW without any RELEASED data submission" }
  - { id: ERR_FINDINGS_INCOMPLETE, http: 409, condition: "Advance to SETTLEMENT_NEGOTIATION while a CONFIRMED scope item lacks a vendor finding" }
  - { id: ERR_EXPOSURE_NOT_ZERO, http: 409, condition: "Advance to CLOSED_NO_ACTION while worst_case_exposure_cents > 0" }
  # --- Business temporal ---
  - { id: ERR_RESPONSE_DEADLINE_PASSED, http: 409, condition: "Current clock is past the case response_deadline_on (notice response or scope confirm too late)" }
  - { id: ERR_MEASUREMENT_DATE_IN_FUTURE, http: 422, condition: "Deployment measured_on is after the current clock at confirm time" }
  # --- Business constraint ---
  - { id: ERR_DUPLICATE_VENDOR_CODE, http: 409, condition: "vendor_code already registered" }
  - { id: ERR_DUPLICATE_SCOPE_ITEM, http: 409, condition: "Another scope item for the same (audit_case_id, product_id) exists in PROPOSED, CONFIRMED, or DISPUTED" }
  - { id: ERR_PRODUCT_UNDER_CONCURRENT_AUDIT, http: 409, condition: "Product is CONFIRMED in the scope of another audit case whose status is not CLOSED_SETTLED, CLOSED_NO_ACTION, or WITHDRAWN" }
  - { id: ERR_ENTITLEMENT_WINDOW_OVERLAP, http: 409, condition: "Closed effective windows [effective_from, effective_to] overlap for the same product and coverage_class among SCHEDULED/ACTIVE records (boundary-touching dates count as overlap); AUTO_TRUE_UP records are exempt" }
  # --- Business safety / privilege ---
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Actor X-User-ID equals prepared_by_user_id (submission approve/release) or tendered_by_user_id (offer accept)" }
  - { id: ERR_PRIVILEGED_CONTENT_REQUIRES_WAIVER, http: 422, condition: "Releasing a submission with contains_privileged=true without privilege_waiver_confirmed=true" }
  # --- Business referential ---
  - { id: ERR_SUBMISSION_SCOPE_MISMATCH, http: 422, condition: "A covered scope item belongs to a different audit case than the submission" }
  - { id: ERR_REMEDIATION_TARGET_INVALID, http: 422, condition: "UNINSTALL target deployment does not belong to the action's product or is not CONFIRMED" }
  - { id: ERR_EMPTY_SUBMISSION_PACKAGE, http: 422, condition: "Release attempted with zero covered scope items in CONFIRMED status" }
  # --- Business fiscal ---
  - { id: ERR_OFFER_EXCEEDS_WORST_CASE_CAP, http: 422, condition: "CUSTOMER offer amount_cents exceeds the case worst_case_exposure_cents (equality allowed)" }
  - { id: ERR_REMEDIATION_EXCEEDS_GAP, http: 422, condition: "Remediation quantity exceeds the product's current gap_quantity (equality allowed)" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: SAMPlatformAdmin
    description: "Platform administrator; owns the vendor/product catalog and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sam/vendors"
      - "POST /sam/products"
      - "PATCH /sam/products/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints except none restricted"

  - name: SAMManager
    description: "Software asset manager; consolidates entitlements, confirms deployments, runs gap analysis, prepares submissions, executes remediation, suppresses alerts"
    identity: opaque
    exclusive_operations:
      - "POST /sam/entitlements/{id}/void"
      - "POST /sam/deployments/{id}/confirm and /reject"
      - "POST /sam/license-positions/{id}/recalculate"
      - "POST /sam/data-submissions and /submit-for-review"
      - "All /sam/remediation-actions mutation endpoints"
      - "POST /sam/monitoring-alerts/{id}/suppress"
    shared_operations:
      - "POST /sam/entitlements (with ProcurementLead)"
      - "POST /sam/audit-scope-items and /repropose (with VendorAuditor)"
      - "GET endpoints (internal set)"

  - name: ITAnalyst
    description: "IT operations analyst feeding deployment discovery measurements"
    identity: opaque
    exclusive_operations:
      - "POST /sam/deployments"
    shared_operations:
      - "GET endpoints (internal set)"

  - name: LegalCounsel
    description: "Legal counsel; owns audit notice response, scope decisions, privilege review/release, and acceptance of vendor offers"
    identity: opaque
    exclusive_operations:
      - "POST /sam/audit-cases and /advance"
      - "POST /sam/audit-scope-items/{id}/confirm, /dispute, /exclude"
      - "POST /sam/data-submissions/{id}/approve, /return, /release"
    shared_operations:
      - "POST /sam/settlement-offers/{id}/accept (VENDOR offers only, with VendorAuditor for CUSTOMER offers)"
      - "GET endpoints (all)"

  - name: ProcurementLead
    description: "Procurement lead; tenders and withdraws customer-side settlement offers, records purchases"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /sam/settlement-offers and /withdraw (CUSTOMER offers, with VendorAuditor for VENDOR offers)"
      - "POST /sam/entitlements (with SAMManager)"
      - "GET endpoints (internal set)"

  - name: VendorAuditor
    description: "External auditor acting for the vendor; proposes scope, records findings, tenders/withdraws vendor offers, accepts customer offers, requests supplemental evidence, withdraws the audit; sees only RELEASED submissions"
    identity: opaque
    exclusive_operations:
