            - call: "POST /care-network/organizations/${r2_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals R2", capacity_total: 5 }
              as: OrgAdmin
              as_user_id: "${r2_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r1_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr1: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r2_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr2: $.data.id }
            - { call: "POST /care-network/agreements/${agr1}/approve", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/agreements/${agr2}/approve", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r1_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r2_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k_id}", sender_org_id: "${s_id}", receiver_org_id: "${r1_id}", service_offering_id: "${o1_id}", consent_id: "${c1_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/decline", payload: { reason: "no capacity fit" }, as: OrgAdmin, as_user_id: "${r1_id}" }
