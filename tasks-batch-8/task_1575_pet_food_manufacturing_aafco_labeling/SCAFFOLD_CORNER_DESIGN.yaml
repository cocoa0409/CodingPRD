          rationale: "The state(P4) vs business_safety(P6) conflict on pairing approve is asserted by the named §1.8 instance."

      - name: val_priority_referential_vs_constraint
        claim_type: priority_ordering
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: business_referential_vs_business_constraint_substantiate_conflict
          rationale: "The referential(P9) vs constraint(P11) conflict on substantiate is asserted by the named §1.8 instance."

      - name: val_inclusion_sum_gate
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INCLUSION_SUM_INVALID]
        excluded_because:
          difficulty_instance: revision_cycle_preserves_inclusion_sum
          rationale: "The 100.00 +/- 0.01 inclusion gate firing on a 105.0 re-submit is asserted by the named §1.8 instance."

      - name: val_line_schedule_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_LINE_SCHEDULE_CONFLICT]
        excluded_because:
          difficulty_instance: line_schedule_half_open_window_conflict
          rationale: "The half-open 8h line-window collision (15:59 blocked, 16:00 admitted) is asserted by the named §1.8 instance."

      - name: val_yield_variance_hold
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_YIELD_VARIANCE_HOLD]
        excluded_because:
          difficulty_instance: yield_variance_exactly_at_hold_threshold
          rationale: "The |variance| > 5.00 override gate (5.10 blocked) is asserted by the named §1.8 instance."

      - name: val_supplier_suspended_blocks_release
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_SUPPLIER_SUSPENDED]
        excluded_because:
          difficulty_instance: batch_release_depends_on_supplier_state
          rationale: "Release blocked by a SUSPENDED supplier is asserted by the named §1.8 instance."

      - name: val_open_recall_blocks_registration
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_OPEN_RECALL]
        excluded_because:
          difficulty_instance: registration_acceptance_depends_on_recall_flag
          rationale: "accept-for-review blocked by an open recall flag is asserted by the named §1.8 instance."

      - name: val_registration_resubmit_slot
        claim_type: violation_to_error
        grounds:
          - state_machines.StateRegistration.REJECTED_to_SUBMITTED
          - errors[ERR_DUPLICATE_KEY]
        excluded_because:
          difficulty_instance: registration_resubmit_after_rejection_window
          rationale: "Resubmit-after-reject fee recompute and the occupied-slot duplicate rejection are asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 5: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shapes_for_object_array_error
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: |
          §1.0's fixed envelope holds on all three response kinds: a single-
          resource POST returns response_type 'object' with meta.api_request_id
          and meta.api_request_timestamp; a list GET returns response_type
          'array' with the pagination fields; an error response returns
          response_type 'error' with data.error_id and data.message.
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Envelope Co", fein: "554000010", contact_email: "a@env.example" }
              as: PlatformAdmin
            - call: "GET /petfood/brand-owners"
              payload: {}
              as: PlatformAdmin
            - call: "GET /petfood/brand-owners/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST response: response_type == 'object'; meta.api_request_id and meta.api_request_timestamp present; data.legal_name == 'Envelope Co'"
            - "GET list response: response_type == 'array'; pagination fields limit, offset, total_count, has_more present"
            - "404 response: response_type == 'error'; data.error_id == ERR_NOT_FOUND and data.message present"

      - name: fk_reverse_reachability_lists
        claim_type: standard_crud
        grounds:
          - entities.FormulaIngredient.fields.formula_id
          - entities.BatchLotCode.fields.batch_id
          - entities.ComplaintCase.fields.brand_owner_id
          - entities.StateRegistration.fields.formula_id
        distinguishing_aspect: |
          Every FK declared in §1.1 is reverse-reachable through its declared
          sub-resource GET: the formula's ingredients, the batch's lots, the
          brand's complaint cases, and the formula's registrations each list
          exactly the child rows created above them.
        test_recipe:
          setup:
            - "SUBSTANTIATED formula with one ingredient line, one CA registration, one complaint, and one COMPLETED batch with one lot"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
