              payload: { sample_type: "BLOOD", sampled_at: "2026-09-02T05:00:00Z", blood_lead_ug_per_dl: 35.0 }
              as: SafetyOfficer
              as_user_id: "${saf_a_id}"
              captures: { wx_index: $.data.resulting_worker_index }
          trigger:
            - call: "POST /workers/${wy_id}/exposure-samples"
              payload: { sample_type: "BLOOD", sampled_at: "2026-09-02T05:30:00Z", blood_lead_ug_per_dl: 30.0 }
              as: SafetyOfficer
              as_user_id: "${saf_a_id}"
              captures: { wy_index: $.data.resulting_worker_index, wy_removed: $.data.triggered_removal }
          assert:
            - "${reserved_g} == 255.00   # estimated 102.00 kWh (min(150.66 theoretical, 20.00*6*0.85)) * 2.5 g/kWh"
            - "${wx_index} == 116.67 and Worker.${wx_id}.removal_status == MEDICAL_REMOVAL   # setup hop: 35.0/30*100"
            - "Plant.${plant_id}.compliance_posture BEFORE the trigger == RESTRICTED and FormationRun.${run_id}.run_state BEFORE the trigger == CHARGING"
            - "${wy_index} == 100.00 and ${wy_removed} == true   # HOP 1: 30.0/30*100 lands exactly on REMOVAL_INDEX_THRESHOLD and >= removes"
            - "Worker.${wy_id}.removal_status == MEDICAL_REMOVAL and Worker.${wy_id}.removal_count == 1"
            - "Plant.${plant_id}.open_medical_removal_count == 2 and Plant.${plant_id}.compliance_posture == FROZEN   # HOP 2"
            - "ProductionLot.${lot_id}.env_hold_status == HELD and ProductionLot.${lot_id}.hold_reason == PLANT_FROZEN   # HOP 3"
            - "ProductionLot.${lot_id}.process_state == FORMATION   # the hold axis is orthogonal: the lot did not move backwards"
            - "FormationRun.${run_id}.run_state == ABORTED and FormationRun.${run_id}.abort_reason == ENV_HOLD_CASCADE and FormationRun.${run_id}.actual_end_at == 2026-09-02T06:00:00Z   # HOP 4"
            - "Plant.${plant_id}.emission_reserved_g == 0.00 and Plant.${plant_id}.emission_consumed_g == 0.00 and Plant.${plant_id}.formation_energy_charge_cents == 0   # HOP 5: the reservation is released and nothing is booked"
            - "Plant.${plant_id}.compliance_posture is STILL FROZEN after hop 5 - the released ratio (0.0000) does not undo a freeze driven by two open removals"
            - "FormationRun.${run_id}.provisional_charge_cents is retained as history but never rolled into the plant charge total"

      - name: cascade_b_failed_capacity_test_quarantines_lot_revokes_assemblies_voids_tests
        grounds:
          - calculations.capacity_test_result
          - calculations.lot_capacity_yield
          - state_machines.CapacityTest.test_state.SCHEDULED_to_COMPLETED
          - state_machines.ProductionLot.process_state.LOT_TESTING_to_QUARANTINED
          - state_machines.BatteryAssembly.certification_status.CERTIFIED_to_REVOKED
          - state_machines.CapacityTest.test_state.SCHEDULED_to_VOIDED
