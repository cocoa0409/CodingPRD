    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Dealer.warranty_reserve_cents -= claim_amount_cents (compensates the submit reservation); decided_at = now
  - from: APPROVED
    to: SETTLED
    trigger: POST /agdata/warranty-claims/{id}/settle
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Dealer.warranty_reserve_cents -= claim_amount_cents; Dealer.warranty_paid_cents += payout_cents; settled_at = now
