# =============================================================================
# PRD Benchmark Scaffold — task_3362
# Audit Independence Monitoring, Partner Rotation & Client Acceptance (Deloitte)
# §1.0 – §1.7  (difficulty/corner indices live in the two sibling design files)
# =============================================================================
scenario: |
  Audit Independence Monitoring, Partner Rotation & Client Acceptance (Deloitte): client acceptance and continuance evaluation with risk scoring, management integrity assessment and industry expertise requirements, independence monitoring across the firm and affiliates including personal financial interests, employment relationships and prohibited services, non-audit service pre-approval by the client audit committee with service categorization, lead and concurring partner rotation with time-on and time-off period tracking, cooling-off periods before a professional may join an audit client in a financial reporting role, global network affiliate coordination for multinational engagements with shared independence obligations, quality control review requirements and engagement partner workload monitoring, regulatory inspection response and remediation

domain_name: audit-independence-monitoring
api_prefix: /audit

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - contagion_risk_propagation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the audit client or prospect.
      - name: industry_code
        type: enum
        source: input
        description: Client industry used by the industry-risk index of client_risk_score.
        constraints: "one of TECH | FINANCIAL_SERVICES | HEALTHCARE | MANUFACTURING | RETAIL | ENERGY | PUBLIC_SECTOR"
      - name: jurisdiction_country
        type: string
        source: input
        description: ISO-3166 alpha-2 country of incorporation; feeds the jurisdiction-risk index.
      - name: is_public_interest_entity
        type: boolean
        source: input
        default: false
        description: Public-interest-entity flag; drives the PIE surcharge, prohibited-service rules and rotation acceleration.
      - name: parent_client_id
        type: string
        source: input
        description: "FK -> Client.id; optional ultimate-parent client for a controlled group. null for a standalone client."
      - name: status
        type: enum
        source: system
        default: PROSPECT
        description: Client lifecycle status.
        constraints: "one of PROSPECT | ACTIVE | SUSPENDED | TERMINATED"
      - name: naf_annual_cap_cents
        type: number
        source: input
        default: 0
        description: Audit-committee pre-approved annual ceiling for non-audit service fees, in cents.
      - name: naf_approved_fee_cents
        type: number
        source: computed
        description: Sum of whole-dollar-rounded fees of APPROVED non-audit services (see naf_fee_pool).
      - name: aggregate_independence_status
        type: enum
        source: computed
        description: Worst independence posture across all engagements of this client.
        constraints: "one of CLEAR | RESTRICTED | FROZEN"
      - name: open_finding_count
        type: integer
        source: computed
        description: Number of IndependenceFinding rows for this client's engagements whose status is not CLOSED.

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the audited entity."
      - name: engagement_type
        type: enum
        source: input
        description: Nature of the assurance engagement.
        constraints: "one of STATUTORY_AUDIT | INTEGRATED_AUDIT | REVIEW_ENGAGEMENT"
      - name: fiscal_year_end
        type: datetime
        source: input
        description: ISO-8601 UTC fiscal year end covered by the engagement.
      - name: is_multinational
        type: boolean
        source: input
        default: false
        description: When true the engagement requires affiliate attestations from every network firm in scope.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Engagement lifecycle axis (parallel to independence_status).
        constraints: "one of DRAFT | ACCEPTANCE_PENDING | ACTIVE | SUSPENDED | CLOSED"
      - name: independence_status
        type: enum
        source: computed
        description: Independence posture axis (parallel to status); derived by engagement_independence_status.
        constraints: "one of CLEAR | RESTRICTED | FROZEN"
      - name: risk_tier
        type: enum
        source: computed
        description: Tier derived from combined_risk_score of the approved ClientAcceptance.
        constraints: "one of LOW | MODERATE | HIGH | SIGNIFICANT"
      - name: combined_risk_score
        type: number
        source: computed
        description: Clamped 0-100 combined risk score copied from the governing ClientAcceptance.
      - name: assigned_workload_points
        type: integer
        source: computed
        description: Sum of base workload points of ACTIVE EngagementRoleAssignment rows on this engagement.
      - name: lead_partner_id
        type: string
        source: computed
        description: "FK -> Professional.id; professional holding the ACTIVE LEAD_PARTNER assignment, else null."
      - name: concurring_partner_id
        type: string
        source: computed
        description: "FK -> Professional.id; professional holding the ACTIVE CONCURRING_PARTNER assignment, else null."
      - name: quality_review_required
        type: boolean
        source: computed
        description: True when risk_tier IN {HIGH, SIGNIFICANT} or the client is a public interest entity.

  - name: ClientAcceptance
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; client being evaluated for acceptance or continuance."
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement this evaluation governs."
      - name: proposed_by
        type: string
        source: input
        description: Name of the engagement partner proposing acceptance.
      - name: industry_expertise_required
        type: enum
        source: input
        description: Industry code of the expertise the engagement team must hold.
        constraints: "one of TECH | FINANCIAL_SERVICES | HEALTHCARE | MANUFACTURING | RETAIL | ENERGY | PUBLIC_SECTOR"
      - name: industry_expertise_confirmed
        type: boolean
        source: input
        default: false
        description: Set by the acceptance committee once industry expertise is evidenced on the team.
      - name: integrity_score
        type: number
        source: computed
        description: 0-100 management integrity score from the integrity_score calculation (higher is better).
      - name: risk_score
        type: number
        source: computed
        description: Unclamped risk score from client_risk_score (PROVISIONAL variant before submission, FINAL variant after).
      - name: combined_risk_score
        type: number
        source: computed
        description: min(100, max(0, risk_score)); drives Engagement.risk_tier.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Acceptance lifecycle status.
        constraints: "one of DRAFT | SUBMITTED | APPROVED | CONDITIONAL | REJECTED | WITHDRAWN"
      - name: decision_notes
        type: string
        source: input
        description: Free-text rationale captured with the committee decision; null until decided.
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of the committee decision; null until decided.

  - name: IntegrityAssessment
    parent: ClientAcceptance
    common_fields: true
    fields:
      - name: acceptance_id
        type: string
        source: input
        description: "FK -> ClientAcceptance.id; the acceptance evaluation this integrity evidence belongs to."
      - name: source_type
        type: enum
        source: input
        description: Origin of the adverse integrity evidence.
        constraints: "one of REGULATORY_ACTION | LITIGATION | MEDIA_ADVERSE | PRIOR_AUDIT_FINDING | CREDIT_EVENT"
      - name: severity
        type: enum
        source: input
        description: Assessed severity of the evidence.
        constraints: "one of LOW | MEDIUM | HIGH | CRITICAL"
      - name: score_impact
        type: integer
        source: input
        description: Integrity points deducted before time decay, 0-40.
        constraints: "integer 0..40"
      - name: assessed_on
        type: datetime
        source: input
        description: Date the evidence was assessed; MUST NOT be later than the logical clock.
      - name: resolved
        type: boolean
        source: input
        default: false
        description: Whether management has remediated the underlying matter.

  - name: Professional
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Display name of the firm professional.
      - name: grade
        type: enum
        source: input
        description: Professional grade; selects the materiality threshold for financial interests.
        constraints: "one of PARTNER | DIRECTOR | SENIOR_MANAGER | MANAGER"
      - name: home_affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; network member firm that employs the professional."
      - name: rotation_role_class
        type: enum
        source: input
        description: Rotation regime the professional is subject to.
        constraints: "one of LEAD_PARTNER | CONCURRING_PARTNER | EQ_REVIEWER | NONE"
      - name: availability
        type: enum
        source: computed
        description: Availability posture derived by assignment_workload_points and rotation_tenure.
        constraints: "one of AVAILABLE | IN_TIME_OFF | OVERLOADED"
      - name: max_workload_points
        type: integer
        source: input
        default: 100
        description: Personal ceiling on active workload points.
      - name: active_workload_points
        type: integer
        source: computed
        description: Sum of ACTIVE assignment base points plus the overload surcharge (see assignment_workload_points).
      - name: rotation_exposure_months
        type: integer
        source: computed
        description: Longest consecutive-service run in months across all of this professional's assignments.

  - name: EngagementRoleAssignment
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; the engagement being staffed."
      - name: professional_id
        type: string
        source: input
        description: "FK -> Professional.id; the professional being assigned."
      - name: role
        type: enum
        source: input
        description: Engagement role held.
        constraints: "one of LEAD_PARTNER | CONCURRING_PARTNER | EQ_REVIEWER | ENGAGEMENT_MANAGER"
      - name: started_on
        type: datetime
        source: input
        description: ISO-8601 UTC start of the assignment interval (inclusive).
      - name: scheduled_end_on
        type: datetime
        source: input
        description: ISO-8601 UTC planned end of the assignment interval (exclusive).
      - name: ended_on
        type: datetime
        source: computed
        description: Actual end stamped by the end action; null while the assignment is ACTIVE.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Assignment status.
        constraints: "one of ACTIVE | ENDED"
      - name: consecutive_service_months
        type: integer
        source: computed
        description: Contiguous months on this client for this role class, including prior contiguous assignments (see rotation_tenure).
      - name: time_off_months_required
        type: integer
        source: computed
        description: Cooling-off months owed once this assignment ends (see rotation_tenure).
      - name: eligible_return_on
        type: datetime
        source: computed
        description: Date the professional may serve this client in this role class again; null while ACTIVE.
      - name: rotation_status
        type: enum
        source: computed
        description: Rotation posture of the assignment.
        constraints: "one of ON_SERVICE | ROTATION_DUE | IN_TIME_OFF | ELIGIBLE"
      - name: workload_points
        type: integer
        source: computed
        description: Base workload points for this assignment before any professional-level overload surcharge.

  - name: IndependenceFinding
    parent: null
    common_fields: true
    fields:
      - name: professional_id
        type: string
        source: input
        description: "FK -> Professional.id; professional the finding is raised against."
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; engagement whose independence posture is affected."
      - name: origin
        type: enum
        source: input
        description: Which monitoring channel raised the finding.
        constraints: "one of DECLARATION | FINANCIAL_INTEREST | EMPLOYMENT_RELATIONSHIP | PROHIBITED_SERVICE | AFFILIATE_BREACH | WORKLOAD_LIMIT | INSPECTION"
      - name: origin_ref_id
        type: string
        source: input
        description: Identifier of the source record inside its own collection (no foreign key constraint).
      - name: finding_type
        type: enum
        source: input
        description: Independence threat category.
        constraints: "one of FINANCIAL_INTEREST | EMPLOYMENT_RELATIONSHIP | PROHIBITED_SERVICE | AFFILIATE_OBLIGATION | WORKLOAD_LIMIT"
      - name: severity
        type: enum
        source: input
        description: Severity drives the engagement independence posture.
        constraints: "one of LOW | MEDIUM | HIGH | CRITICAL"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Remediation lifecycle status.
        constraints: "one of OPEN | REMEDIATION | RE_TEST | CLOSED | REOPENED"
      - name: discovered_on
        type: datetime
        source: input
        description: Date the matter was discovered.
      - name: remediation_due_on
        type: datetime
        source: computed
        description: Due date = discovered_on + REMEDIATION_WINDOW_DAYS[severity]; recomputed on each re-open.
      - name: closed_on
        type: datetime
        source: computed
        description: Logical-clock timestamp when the finding reached CLOSED; null otherwise.
      - name: remediation_attempts
        type: integer
        source: computed
        default: 0
        description: Count of failed re-tests; a third failure escalates to the regulator-reporting queue.

  - name: IndependenceThreat
    parent: null
    common_fields: true
    fields:
      - name: professional_id
        type: string
        source: input
        description: "FK -> Professional.id; covered person who declared the relationship or interest."
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; client to which the interest or relationship attaches."
      - name: threat_type
        type: enum
        source: input
        description: Personal-independence threat category.
        constraints: "one of FINANCIAL_INTEREST | EMPLOYMENT_RELATIONSHIP"
      - name: instrument_type
        type: enum
        source: input
        description: Financial instrument held; null when threat_type is EMPLOYMENT_RELATIONSHIP.
        constraints: "one of EQUITY | DEBT | MUTUAL_FUND | DERIVATIVE | TRUST | null"
      - name: relationship_type
        type: enum
        source: input
        description: Employment relationship kind; null when threat_type is FINANCIAL_INTEREST.
        constraints: "one of IMMEDIATE_FAMILY_EMPLOYED_BY_CLIENT | FORMER_FIRM_PROFESSIONAL_JOINED_CLIENT | PROFESSIONAL_PRIOR_CLIENT_EMPLOYEE | CLIENT_BOARD_MEMBERSHIP | null"
      - name: value_cents
        type: number
        source: input
        default: 0
        description: Fair value of the holding in cents; 0 for employment relationships.
      - name: effective_on
        type: datetime
        source: input
        description: Date the interest was acquired or the relationship began.
      - name: is_material
        type: boolean
        source: computed
        description: Materiality verdict from financial_interest_materiality; always false for EMPLOYMENT_RELATIONSHIP.
      - name: cooling_off_end_on
        type: datetime
        source: computed
        description: End of the cooling-off window; equals effective_on for zero-month relationship types.
      - name: status
        type: enum
        source: system
        default: DECLARED
        description: Threat remediation status.
        constraints: "one of DECLARED | IN_COOLING_OFF | MITIGATED | DIVESTED | CLEARED"
      - name: cleared_on
        type: datetime
        source: computed
        description: Logical-clock timestamp when the threat reached CLEARED; null otherwise.

  - name: NonAuditService
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; client receiving the non-audit service."
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; related audit engagement, may be null for client-level services."
      - name: service_category
        type: enum
        source: input
        description: Service categorization used by the prohibited-service rules.
        constraints: "one of BOOKKEEPING | INTERNAL_AUDIT_OUTSOURCING | VALUATION | TAX_PREPARATION | TAX_ADVISORY | IT_SYSTEMS_DESIGN | ACTUARIAL | MANAGEMENT_FUNCTION | LEGAL | OTHER"
      - name: fee_cents
        type: number
        source: input
        description: Proposed fee in cents before whole-dollar rounding.
      - name: is_prohibited_for_pie
        type: boolean
        source: computed
        description: True when the category is on the prohibited list and the client is a public interest entity.
      - name: committee_resolution_ref
        type: string
        source: input
        description: Audit-committee resolution reference recorded at approval; null before approval.
      - name: approval_expires_on
        type: datetime
        source: input
        description: Date the pre-approval lapses; null when no expiry was granted.
      - name: approved_fee_cents
        type: number
        source: computed
        description: Whole-dollar-rounded approved fee in cents; null unless status is APPROVED.
      - name: approved_on
        type: datetime
        source: computed
        description: Logical-clock timestamp of approval; null unless status is APPROVED.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Pre-approval lifecycle status.
        constraints: "one of DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | REVOKED"

  - name: Affiliate
    parent: null
    common_fields: true
    fields:
      - name: firm_name
        type: string
        source: input
        description: Legal name of the network member firm.
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 country of the member firm.
      - name: network_tier
        type: enum
        source: input
        description: Tier of the member firm inside the global network.
        constraints: "one of MEMBER_FIRM | CORRESPONDENT | ALLIANCE"
      - name: independence_framework
        type: enum
        source: input
        description: Independence rule set the affiliate attests under.
        constraints: "one of SEC_RESTRICTED | EU_LOCAL | IFAC_BASELINE"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Affiliate status.
        constraints: "one of ACTIVE | SUSPENDED"
      - name: open_breach_count
        type: integer
        source: computed
        description: Number of this affiliate's attestations currently in BREACHED state.

  - name: AffiliateAttestation
    parent: null
    common_fields: true
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; attesting member firm."
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; multinational engagement the attestation covers."
      - name: attestation_status
        type: enum
        source: system
        default: PENDING
        description: Attestation lifecycle status.
        constraints: "one of PENDING | ATTESTED | BREACHED | WAIVED"
      - name: attested_on
        type: datetime
        source: computed
        description: Logical-clock timestamp when the affiliate attested; null while PENDING.
      - name: breach_count
        type: integer
        source: input
        default: 0
        description: Cumulative number of breaches reported by this affiliate on this engagement.

  - name: QualityReview
    parent: null
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> Engagement.id; engagement under review or inspection."
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> Professional.id; engagement quality control reviewer."
      - name: review_type
        type: enum
        source: input
        description: Kind of review being performed.
        constraints: "one of ENGAGEMENT_QUALITY_REVIEW | INSPECTION_READINESS | REGULATORY_INSPECTION"
      - name: inspection_body
        type: enum
        source: input
        description: Regulator for REGULATORY_INSPECTION reviews; null otherwise.
        constraints: "one of PCAOB | SEC | LOCAL_REGULATOR | INTERNAL_QC | null"
      - name: received_on
        type: datetime
        source: input
        description: Date the review or inspection was received; drives response_due_on.
      - name: due_on
        type: datetime
        source: input
        description: Planned completion date of the review.
      - name: response_due_on
        type: datetime
        source: computed
        description: Response deadline from inspection_response_due; null for non-inspection reviews.
      - name: deficiency_count
        type: integer
        source: input
        default: 0
        description: Number of deficiencies raised; halves the response window at 5 or more.
      - name: remediation_plan_ref
        type: string
        source: input
        description: Reference of the remediation plan filed with the regulator; null until filed.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Review lifecycle status.
        constraints: "one of SCHEDULED | IN_PROGRESS | PASSED | DEFICIENT | REMEDIATED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    axis: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACCEPTANCE_PENDING
        trigger: "system: cascade of POST /audit/client-acceptances/{id}/submit"
        actor: system
        preconditions:
          - "the acceptance being submitted targets this engagement and reaches SUBMITTED"
        side_effects:
          - "Engagement.updated_at refreshed"
      - from: ACCEPTANCE_PENDING
        to: DRAFT
        trigger: "system: cascade of POST /audit/client-acceptances/{id}/decision with decision=RETURN or decision=REJECT"
        actor: system
        preconditions:
          - "the governing ClientAcceptance reaches DRAFT (RETURN) or REJECTED (REJECT)"
        side_effects:
          - "Engagement.risk_tier reset to LOW"
          - "Engagement.combined_risk_score reset to 0"
      - from: ACCEPTANCE_PENDING
        to: ACTIVE
        trigger: "system: cascade of POST /audit/client-acceptances/{id}/decision with decision=APPROVE"
        actor: system
        preconditions:
          - "governing ClientAcceptance.status IN {APPROVED, CONDITIONAL} and combined_risk_score < 70"
          - "every ACTIVE EngagementRoleAssignment on this engagement references a Professional with no IndependenceFinding in status IN {OPEN, REMEDIATION, RE_TEST, REOPENED} of severity IN {HIGH, CRITICAL}"
          - "when is_multinational is true, no AffiliateAttestation for this engagement is in status PENDING"
        side_effects:
          - "Engagement.combined_risk_score and Engagement.risk_tier copied from the governing ClientAcceptance"
          - "Engagement.quality_review_required recomputed (true when risk_tier IN {HIGH, SIGNIFICANT} or Client.is_public_interest_entity is true)"
          - "Client.status set to ACTIVE"
          - "Engagement.independence_status recomputed via engagement_independence_status"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade of POST /audit/independence-findings, POST /audit/independence-threats or POST /audit/affiliate-attestations/{id}/transitions when the recomputed independence_status becomes FROZEN"
        actor: system
        preconditions:
          - "Engagement.independence_status == FROZEN"
        side_effects:
          - "all ACTIVE EngagementRoleAssignment rows on this engagement keep their status but are excluded from workload ceilings until the engagement resumes"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: cascade of POST /audit/independence-findings/{id}/transitions when the recomputed independence_status leaves FROZEN"
        actor: system
        preconditions:
          - "Engagement.independence_status IN {CLEAR, RESTRICTED}"
          - "no IndependenceFinding for this engagement in status IN {OPEN, REMEDIATION, RE_TEST, REOPENED} has severity CRITICAL"
        side_effects:
          - "Engagement.independence_status recomputed via engagement_independence_status"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /audit/engagements/{id}/transitions with action=CLOSE"
        actor: EngagementPartner
        preconditions:
          - "no IndependenceFinding for this engagement is in status IN {OPEN, REMEDIATION, RE_TEST, REOPENED}"
          - "no QualityReview for this engagement is in status IN {SCHEDULED, IN_PROGRESS, DEFICIENT}"
        side_effects:
          - "every ACTIVE EngagementRoleAssignment on this engagement is ended with ended_on = logical clock"
          - "Professional.active_workload_points recomputed for each affected professional"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /audit/engagements/{id}/transitions with action=CLOSE"
        actor: EngagementPartner
        preconditions:
          - "no IndependenceFinding for this engagement is in status IN {OPEN, REMEDIATION, RE_TEST, REOPENED}"
        side_effects:
          - "every ACTIVE EngagementRoleAssignment on this engagement is ended with ended_on = logical clock"

  - entity: Engagement
    axis: independence_status
    initial_state: CLEAR
    terminal_states: []
    note: "Parallel state axis on the same Engagement row; recomputed by engagement_independence_status on every mutation of its inputs."
    transitions:
      - from: CLEAR
        to: RESTRICTED
        trigger: "system: recompute after any finding, threat, attestation or non-audit service mutation"
        actor: system
        preconditions:
          - "exactly one IndependenceFinding for this engagement has severity HIGH and status IN {OPEN, REMEDIATION, RE_TEST, REOPENED}, OR at least one AffiliateAttestation for this engagement is BREACHED"
        side_effects:
          - "Engagement.version incremented by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: recompute after any finding, threat, attestation or non-audit service mutation"
        actor: system
        preconditions:
          - "at least one IndependenceFinding for this engagement has severity CRITICAL and status IN {OPEN, REMEDIATION, RE_TEST, REOPENED}, OR at least two have severity HIGH, OR at least one NonAuditService for this engagement has is_prohibited_for_pie true and status IN {PENDING_APPROVAL, APPROVED}, OR at least one IndependenceThreat for this client has threat_type FINANCIAL_INTEREST, is_material true and status DECLARED"
        side_effects:
          - "Engagement.status set to SUSPENDED when it was ACTIVE"
          - "Engagement.version incremented by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: recompute after any finding, threat, attestation or non-audit service mutation"
        actor: system
        preconditions:
          - "no FROZEN trigger holds and at least one RESTRICTED trigger holds"
        side_effects:
          - "Engagement.version incremented by 1"
      - from: RESTRICTED
        to: CLEAR
        trigger: "system: recompute after any finding, threat, attestation or non-audit service mutation"
        actor: system
        preconditions:
          - "no FROZEN trigger and no RESTRICTED trigger holds"
        side_effects:
          - "Engagement.status set to ACTIVE when it was SUSPENDED and no CRITICAL finding remains open"
          - "Engagement.version incremented by 1"

  - entity: ClientAcceptance
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /audit/client-acceptances/{id}/submit"
        actor: ClientAcceptanceCommittee
        preconditions:
          - "at least one IntegrityAssessment exists for this acceptance"
          - "industry_expertise_confirmed is true"
          - "no IntegrityAssessment for this acceptance has assessed_on later than the logical clock"
        side_effects:
          - "ClientAcceptance.integrity_score computed via integrity_score"
          - "ClientAcceptance.risk_score computed via client_risk_score with the FINAL variant"
          - "ClientAcceptance.combined_risk_score = min(100, max(0, risk_score))"
          - "governing Engagement.status set to ACCEPTANCE_PENDING"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /audit/client-acceptances/{id}/decision with decision=RETURN"
        actor: ClientAcceptanceCommittee
        preconditions: []
        side_effects:
          - "governing Engagement.status set back to DRAFT"
          - "decision_notes overwritten with the return rationale"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /audit/client-acceptances/{id}/decision with decision=APPROVE"
        actor: ClientAcceptanceCommittee
        preconditions:
          - "combined_risk_score < 70"
          - "no IntegrityAssessment for this acceptance has severity CRITICAL and resolved false"
        side_effects:
          - "decided_at stamped from the logical clock"
          - "governing Engagement.status set to ACTIVE and Engagement.combined_risk_score / risk_tier copied"
          - "Client.status set to ACTIVE"
      - from: SUBMITTED
        to: CONDITIONAL
        trigger: "POST /audit/client-acceptances/{id}/decision with decision=CONDITIONAL"
        actor: ClientAcceptanceCommittee
        preconditions:
          - "combined_risk_score >= 50 and combined_risk_score < 70"
          - "at least one IntegrityAssessment for this acceptance has resolved false"
        side_effects:
          - "decided_at stamped from the logical clock"
          - "governing Engagement.quality_review_required set to true"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /audit/client-acceptances/{id}/decision with decision=REJECT"
        actor: ClientAcceptanceCommittee
        preconditions: []
        side_effects:
          - "decided_at stamped from the logical clock"
          - "governing Engagement.status set back to DRAFT"
          - "Client.status set back to PROSPECT when the client has no other engagement outside DRAFT"
      - from: CONDITIONAL
        to: APPROVED
        trigger: "POST /audit/client-acceptances/{id}/decision with decision=APPROVE"
        actor: ClientAcceptanceCommittee
        preconditions:
          - "industry_expertise_confirmed is true"
          - "no IntegrityAssessment for this acceptance has severity CRITICAL and resolved false"
        side_effects:
          - "governing Engagement.status set to ACTIVE and Engagement.combined_risk_score / risk_tier copied"
          - "Client.status set to ACTIVE"
      - from: CONDITIONAL
        to: WITHDRAWN
        trigger: "POST /audit/client-acceptances/{id}/decision with decision=WITHDRAW"
        actor: ClientAcceptanceCommittee
        preconditions: []
        side_effects:
          - "governing Engagement.status set back to DRAFT"

  - entity: IndependenceFinding
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATION
        trigger: "POST /audit/independence-findings/{id}/transitions with action=START_REMEDIATION"
        actor: IndependenceOfficer
        preconditions:
          - "remediation_attempts < 3"
        side_effects:
          - "remediation_due_on = discovered_on + REMEDIATION_WINDOW_DAYS[severity]"
      - from: OPEN
        to: CLOSED
        trigger: "POST /audit/independence-findings/{id}/transitions with action=CLOSE_NO_ACTION"
        actor: IndependenceOfficer
        preconditions:
          - "severity == LOW"
        side_effects:
          - "closed_on stamped from the logical clock"
          - "Engagement.independence_status recomputed via engagement_independence_status"
          - "Client.open_finding_count recomputed"
      - from: REMEDIATION
        to: RE_TEST
        trigger: "POST /audit/independence-findings/{id}/transitions with action=SUBMIT_FOR_RETEST"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "Engagement.independence_status recomputed via engagement_independence_status"
      - from: RE_TEST
        to: CLOSED
        trigger: "POST /audit/independence-findings/{id}/transitions with action=PASS_RETEST"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "closed_on stamped from the logical clock"
          - "Engagement.independence_status recomputed via engagement_independence_status"
          - "Client.open_finding_count recomputed"
      - from: RE_TEST
        to: REOPENED
        trigger: "POST /audit/independence-findings/{id}/transitions with action=FAIL_RETEST"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "remediation_attempts incremented by 1"
          - "remediation_due_on recomputed from the logical clock"
          - "when remediation_attempts reaches 3, Engagement.independence_status is forced to FROZEN and Engagement.status set to SUSPENDED"
      - from: REOPENED
        to: REMEDIATION
        trigger: "POST /audit/independence-findings/{id}/transitions with action=RESTART_REMEDIATION"
        actor: IndependenceOfficer
        preconditions:
          - "remediation_attempts < 3"
        side_effects:
          - "remediation_due_on recomputed from the logical clock"

  - entity: NonAuditService
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /audit/non-audit-services/{id}/transitions with action=SUBMIT_FOR_APPROVAL"
        actor: AuditCommitteeLiaison
        preconditions:
          - "is_prohibited_for_pie is false"
          - "fee_cents > 0"
        side_effects: []
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /audit/non-audit-services/{id}/transitions with action=APPROVE"
        actor: AuditCommitteeLiaison
        preconditions:
          - "committee_resolution_ref is present"
          - "round_half_up(fee_cents / 100) * 100 + Client.naf_approved_fee_cents <= Client.naf_annual_cap_cents"
        side_effects:
          - "approved_fee_cents = round_half_up(fee_cents / 100) * 100"
          - "approved_on stamped from the logical clock"
          - "Client.naf_approved_fee_cents recomputed via naf_fee_pool"
          - "Client.aggregate_independence_status recomputed"
          - "every Engagement of the client has independence_status recomputed via engagement_independence_status"
          - "Client.version incremented by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /audit/non-audit-services/{id}/transitions with action=REJECT"
        actor: AuditCommitteeLiaison
        preconditions: []
        side_effects:
          - "Client.aggregate_independence_status recomputed"
          - "every Engagement of the client has independence_status recomputed via engagement_independence_status"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /audit/non-audit-services/{id}/transitions with action=REJECT"
        actor: AuditCommitteeLiaison
        preconditions: []
        side_effects:
          - "Engagement.independence_status recomputed via engagement_independence_status when engagement_id is set"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /audit/non-audit-services/{id}/transitions with action=RETURN_TO_DRAFT"
        actor: AuditCommitteeLiaison
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /audit/non-audit-services/{id}/transitions with action=REVOKE"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "approved_fee_cents reset to null and approved_on reset to null"
          - "Client.naf_approved_fee_cents recomputed via naf_fee_pool"
          - "Client.aggregate_independence_status recomputed"
          - "every Engagement of the client has independence_status recomputed via engagement_independence_status"
          - "Client.version incremented by 1"

  - entity: IndependenceThreat
    initial_state: DECLARED
    terminal_states: [CLEARED]
    transitions:
      - from: DECLARED
        to: IN_COOLING_OFF
        trigger: "system: cascade of POST /audit/independence-threats when cooling_off_end_on is later than effective_on"
        actor: system
        preconditions:
          - "threat_type == EMPLOYMENT_RELATIONSHIP"
        side_effects:
          - "the professional may not be assigned to any engagement of this client while the status is IN_COOLING_OFF"
      - from: DECLARED
        to: CLEARED
        trigger: "system: cascade of POST /audit/independence-threats when the threat is immaterial and has no cooling-off window"
        actor: system
        preconditions:
          - "is_material is false and cooling_off_end_on equals effective_on"
        side_effects:
          - "cleared_on stamped from the logical clock"
      - from: DECLARED
        to: DIVESTED
        trigger: "POST /audit/independence-threats/{id}/transitions with action=DIVEST"
        actor: IndependenceOfficer
        preconditions:
          - "threat_type == FINANCIAL_INTEREST"
          - "is_material is true"
        side_effects:
          - "Engagement.independence_status recomputed for every engagement of this client"
      - from: DECLARED
        to: MITIGATED
        trigger: "POST /audit/independence-threats/{id}/transitions with action=MITIGATE"
        actor: IndependenceOfficer
        preconditions:
          - "threat_type == EMPLOYMENT_RELATIONSHIP"
          - "cooling_off_end_on equals effective_on"
        side_effects: []
      - from: IN_COOLING_OFF
        to: CLEARED
        trigger: "system: recompute on any read or mutation once the logical clock reaches cooling_off_end_on"
        actor: system
        preconditions:
          - "logical clock >= cooling_off_end_on"
        side_effects:
          - "cleared_on stamped from the logical clock"
      - from: DIVESTED
        to: CLEARED
        trigger: "POST /audit/independence-threats/{id}/transitions with action=CONFIRM_CLEARANCE"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "cleared_on stamped from the logical clock"
          - "Engagement.independence_status recomputed for every engagement of this client"
      - from: MITIGATED
        to: CLEARED
        trigger: "POST /audit/independence-threats/{id}/transitions with action=CONFIRM_CLEARANCE"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "cleared_on stamped from the logical clock"

  - entity: AffiliateAttestation
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ATTESTED
        trigger: "POST /audit/affiliate-attestations/{id}/transitions with action=ATTEST"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "attested_on stamped from the logical clock"
          - "Engagement.independence_status recomputed via engagement_independence_status"
      - from: PENDING
        to: WAIVED
        trigger: "POST /audit/affiliate-attestations/{id}/transitions with action=WAIVE"
        actor: IndependenceOfficer
        preconditions:
          - "Affiliate.network_tier == ALLIANCE or Engagement.is_multinational is false"
        side_effects:
          - "attested_on stamped from the logical clock"
          - "Engagement.independence_status recomputed via engagement_independence_status"
      - from: ATTESTED
        to: BREACHED
        trigger: "POST /audit/affiliate-attestations/{id}/transitions with action=REPORT_BREACH"
        actor: IndependenceOfficer
        preconditions: []
        side_effects:
          - "breach_count incremented by 1"
          - "Affiliate.open_breach_count recomputed; Affiliate.status set to SUSPENDED when open_breach_count reaches 3 or more"
          - "an IndependenceFinding is created with origin AFFILIATE_BREACH, finding_type AFFILIATE_OBLIGATION, severity HIGH and origin_ref_id equal to this attestation id"
          - "Engagement.independence_status recomputed via engagement_independence_status"
      - from: BREACHED
        to: PENDING
        trigger: "POST /audit/affiliate-attestations/{id}/transitions with action=RESET_ATTESTATION"
        actor: IndependenceOfficer
        preconditions:
          - "no IndependenceFinding with origin_ref_id equal to this attestation id is in status IN {OPEN, REMEDIATION, RE_TEST, REOPENED}"
        side_effects:
          - "attested_on reset to null"
          - "Affiliate.open_breach_count recomputed"

  - entity: QualityReview
    initial_state: SCHEDULED
    terminal_states: [PASSED, REMEDIATED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /audit/quality-reviews/{id}/transitions with action=START"
        actor: QualityReviewer
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /audit/quality-reviews/{id}/transitions with action=PASS"
        actor: QualityReviewer
        preconditions:
          - "deficiency_count == 0"
        side_effects:
          - "Engagement.quality_review_required set to false"
      - from: IN_PROGRESS
        to: DEFICIENT
        trigger: "POST /audit/quality-reviews/{id}/transitions with action=FAIL"
        actor: QualityReviewer
        preconditions:
          - "deficiency_count > 0"
        side_effects:
          - "when deficiency_count >= 3 and the governing Engagement.status is ACTIVE, Engagement.status is set to SUSPENDED"
      - from: DEFICIENT
        to: REMEDIATED
        trigger: "POST /audit/quality-reviews/{id}/transitions with action=REMEDIATE"
        actor: QualityReviewer
        preconditions:
          - "remediation_plan_ref is present"
        side_effects:
          - "Engagement.status set back to ACTIVE when it was SUSPENDED by this review and Engagement.independence_status is not FROZEN"
      - from: REMEDIATED
        to: IN_PROGRESS
        trigger: "POST /audit/quality-reviews/{id}/transitions with action=REOPEN"
        actor: QualityReviewer
        preconditions: []
        side_effects: []

  - entity: Client
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system: cascade of POST /audit/client-acceptances/{id}/decision with decision=APPROVE"
        actor: system
        preconditions:
          - "the governing ClientAcceptance reaches APPROVED"
        side_effects:
          - "Client.naf_approved_fee_cents recomputed via naf_fee_pool"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade whenever Client.aggregate_independence_status becomes FROZEN"
        actor: system
        preconditions:
          - "at least one engagement of the client has independence_status FROZEN"
        side_effects:
          - "Client.version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: cascade whenever Client.aggregate_independence_status leaves FROZEN"
        actor: system
        preconditions:
          - "no engagement of the client has independence_status FROZEN"
        side_effects:
          - "Client.version incremented by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: cascade of POST /audit/engagements/{id}/transitions with action=CLOSE"
        actor: system
        preconditions:
          - "the client has no other engagement whose status is not CLOSED"
        side_effects:
          - "Client.aggregate_independence_status recomputed"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system: cascade of POST /audit/engagements/{id}/transitions with action=CLOSE"
        actor: system
        preconditions:
          - "the client has no other engagement whose status is not CLOSED"
        side_effects:
          - "Client.aggregate_independence_status recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on the parent version)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /audit/role-assignments"
    occ_field: "expected_engagement_version"
    description: |
      Creating an EngagementRoleAssignment against an Engagement whose version
      has advanced since the client last observed it is rejected. The
      engagement's version moves on every sibling assignment, acceptance
      decision and independence recompute, so a writer holding an earlier
      snapshot of the engagement would otherwise staff it from a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: finding-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /audit/independence-findings"
    occ_field: "expected_engagement_version"
    description: |
      Raising an IndependenceFinding against an Engagement whose version has
      advanced since the client last observed it is rejected. A second finding
      on the same engagement is a legitimate business action on its own, so the
      stale-snapshot case is resolved by the engagement version the writer
      presents rather than by any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: client_risk_score
    trigger: "computed on POST /audit/client-acceptances (PROVISIONAL) and re-computed on POST /audit/client-acceptances/{id}/submit (FINAL)"
    algorithm: weighted_scoring
    formula: |
      base = INDUSTRY_RISK_INDEX[Client.industry_code]
           + JURISDICTION_RISK_INDEX[Client.jurisdiction_country]
           + (PIE_SURCHARGE when Client.is_public_interest_entity is true else 0)
      # penalty is the integrity deduction; the input set is the variant's:
      #   PROVISIONAL input set = IntegrityAssessment rows of this acceptance with resolved == true
      #   FINAL       input set = ALL IntegrityAssessment rows of this acceptance
      penalty = sum over the variant's input set of (score_impact * decay(age_months))
      decay(age_months) = 1.0 when age_months <= 12, 0.5 when 12 < age_months <= 24, 0.25 when age_months > 24
      age_months = whole months from assessed_on to the logical clock's current date
      risk_score = base + penalty
      # ClientAcceptance.combined_risk_score = min(100, max(0, risk_score))  (clamp applied by the caller)
    input_set: "IntegrityAssessment rows attached to the ClientAcceptance; PROVISIONAL keeps resolved == true rows only, FINAL keeps every row"
    constants:
      INDUSTRY_RISK_INDEX: {TECH: 20, FINANCIAL_SERVICES: 35, HEALTHCARE: 25, MANUFACTURING: 20, RETAIL: 15, ENERGY: 30, PUBLIC_SECTOR: 10}
      JURISDICTION_RISK_INDEX: {US: 0, GB: 5, DE: 5, CA: 5, AU: 10, IN: 15, BR: 20, CN: 25}
      DEFAULT_JURISDICTION_RISK: 10
      PIE_SURCHARGE: 15
      DECAY_TIER_1_MONTHS: 12
      DECAY_TIER_2_MONTHS: 24
      DECAY_TIER_1_FACTOR: 1.0
      DECAY_TIER_2_FACTOR: 0.5
      DECAY_TIER_3_FACTOR: 0.25
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "the ClientAcceptance is read while status == DRAFT"
        difference: "unresolved integrity assessments are excluded from the input set entirely, so risk_score is lower than the FINAL value for the same rows"
      - name: FINAL
        when: "after POST /audit/client-acceptances/{id}/submit"
        difference: "every integrity assessment contributes; unresolved rows contribute their full decayed score_impact"

  - name: integrity_score
    trigger: "recomputed whenever an IntegrityAssessment is created for a ClientAcceptance and on POST /audit/client-acceptances/{id}/submit"
    algorithm: aggregation
    formula: |
      age_months = whole months from assessed_on to the logical clock's current date
      decay(age_months) = 1.0 when age_months <= 12, 0.5 when 12 < age_months <= 24, 0.25 when age_months > 24
      penalty = sum over ALL IntegrityAssessment rows of this acceptance of (score_impact * decay(age_months))
      integrity_score = max(0, 100 - penalty)
    input_set: "every IntegrityAssessment row attached to the ClientAcceptance, regardless of resolved"
    constants:
      MAX_SCORE: 100
      DECAY_TIER_1_MONTHS: 12
      DECAY_TIER_2_MONTHS: 24
      DECAY_TIER_1_FACTOR: 1.0
      DECAY_TIER_2_FACTOR: 0.5
      DECAY_TIER_3_FACTOR: 0.25
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: rotation_tenure
    trigger: "on POST /audit/role-assignments, on POST /audit/role-assignments/{id}/end, and on every read of an EngagementRoleAssignment"
    algorithm: aggregation
    formula: |
      months_between(a, b) = whole months from a to b, floored
      effective_end(a) = a.ended_on when set, else min(a.scheduled_end_on, logical clock)
      # consecutive service is measured over the ordered run of assignments for the same
      # (professional_id, client_id, role) triple, ordered by started_on ASC.
      # Tie-break when two rows share started_on: created_at ASC.
      run = 0; previous_end = null
      for a in ordered_triple_rows:
        gap = months_between(previous_end, a.started_on) when previous_end is not null else 0
        if previous_end is null or gap <= GAP_TOLERANCE_MONTHS:
          run = run + months_between(a.started_on, effective_end(a))
        else:
          run = months_between(a.started_on, effective_end(a))
        previous_end = effective_end(a)
        if a.id == this.id: break
      consecutive_service_months = run
      time_on_limit_months = TIME_ON_LIMIT[variant][role]     # 0 means unlimited
      time_off_months_required = TIME_OFF_MONTHS[variant][role]
      rotation_status = ON_SERVICE   when status == ACTIVE and time_on_limit_months == 0
                      = ROTATION_DUE when status == ACTIVE and consecutive_service_months >= time_on_limit_months
                      = ON_SERVICE   when status == ACTIVE and consecutive_service_months < time_on_limit_months
                      = IN_TIME_OFF  when status == ENDED and logical clock < eligible_return_on
                      = ELIGIBLE     when status == ENDED and logical clock >= eligible_return_on
      eligible_return_on = ended_on + time_off_months_required months when status == ENDED else null
    input_set: "all EngagementRoleAssignment rows sharing the (professional_id, client_id, role) triple, ACTIVE and ENDED alike; the run stops at this row"
    constants:
      GAP_TOLERANCE_MONTHS: 12
      TIME_ON_LIMIT:
        STANDARD: {LEAD_PARTNER: 84, CONCURRING_PARTNER: 84, EQ_REVIEWER: 84, ENGAGEMENT_MANAGER: 0}
        PIE_ACCELERATED: {LEAD_PARTNER: 60, CONCURRING_PARTNER: 60, EQ_REVIEWER: 84, ENGAGEMENT_MANAGER: 0}
      TIME_OFF_MONTHS:
        STANDARD: {LEAD_PARTNER: 24, CONCURRING_PARTNER: 24, EQ_REVIEWER: 36, ENGAGEMENT_MANAGER: 12}
        PIE_ACCELERATED: {LEAD_PARTNER: 60, CONCURRING_PARTNER: 60, EQ_REVIEWER: 36, ENGAGEMENT_MANAGER: 12}
    precision: "integer months; boundary is inclusive (>= limit marks ROTATION_DUE)"
    variants:
      - name: STANDARD
        when: "Client.is_public_interest_entity is false"
        difference: "84-month time-on limit and 24-month time-off for LEAD_PARTNER and CONCURRING_PARTNER"
      - name: PIE_ACCELERATED
        when: "Client.is_public_interest_entity is true"
        difference: "60-month time-on limit and 60-month time-off for LEAD_PARTNER and CONCURRING_PARTNER"

  - name: assignment_workload_points
    trigger: "on POST /audit/role-assignments, on POST /audit/role-assignments/{id}/end, and whenever Engagement.risk_tier changes"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned: (1) per-assignment base, (2) professional base sum,
      # (3) surcharge tier selected from the base sum, (4) professional total.
      # The surcharge is NEVER written back onto the assignment, so step 1 cannot
      # depend on step 3 — the apparent circularity is resolved by this fixed order.
      step1: for each ACTIVE assignment a:
               base(a) = round_half_up(BASE_POINTS[a.role] * TIER_MULTIPLIER[Engagement(a).risk_tier])
      step2: base_sum(p) = sum of base(a) over ACTIVE assignments a with a.professional_id == p
      step3: surcharge(p) = OVERLOAD_TIERS[k].points where k is the highest tier with base_sum(p) > OVERLOAD_TIERS[k].threshold; 0 when none
      step4: Professional.active_workload_points = base_sum(p) + surcharge(p)
             Engagement.assigned_workload_points = sum of base(a) over ACTIVE assignments a of that engagement
             EngagementRoleAssignment.workload_points = base(a)     # step-1 value only
      step5: Professional.availability = OVERLOADED  when active_workload_points > max_workload_points
                                       = IN_TIME_OFF when the professional has no ACTIVE assignment and at least one
                                                      ENDED assignment whose eligible_return_on is later than the logical clock
                                       = AVAILABLE   otherwise
    input_set: "EngagementRoleAssignment rows with status == ACTIVE; ENDED rows contribute nothing"
    constants:
      BASE_POINTS: {LEAD_PARTNER: 40, CONCURRING_PARTNER: 25, EQ_REVIEWER: 20, ENGAGEMENT_MANAGER: 15}
      TIER_MULTIPLIER: {LOW: 1.0, MODERATE: 1.25, HIGH: 1.5, SIGNIFICANT: 2.0}
      OVERLOAD_TIERS: [{threshold: 60, points: 5}, {threshold: 80, points: 10}]
      MAX_WORKLOAD_POINTS_DEFAULT: 100
    precision: "integer; round_half_up applied only at step 1; steps 2-4 are exact integer arithmetic"
    variants: []

  - name: naf_fee_pool
    trigger: "on NonAuditService approval, on NonAuditService revocation, and on every read of a Client"
    algorithm: aggregation
    formula: |
      rounded_fee(s) = round_half_up(s.fee_cents / 100) * 100
      Client.naf_approved_fee_cents = sum of rounded_fee(s) over NonAuditService rows s
                                      with s.client_id == Client.id and s.status == APPROVED
      # Rounding order is pinned: round EACH service fee to whole dollars first, then sum.
      # Summing raw cents and rounding the total once is explicitly NOT this algorithm and
      # produces different cents whenever two or more services have sub-dollar remainders.
      admission test at approval: rounded_fee(candidate) + Client.naf_approved_fee_cents <= Client.naf_annual_cap_cents
    input_set: "NonAuditService rows for the client with status == APPROVED; REVOKED, REJECTED, DRAFT and PENDING_APPROVAL rows are excluded"
    constants:
      ROUNDING_UNIT_CENTS: 100
    precision: "whole dollars (multiples of 100 cents), round_half_up per service before summing"
    variants: []

  - name: engagement_independence_status
    trigger: "recomputed on every mutation of IndependenceFinding, IndependenceThreat, NonAuditService, AffiliateAttestation and on acceptance approval"
    algorithm: threshold
    formula: |
      critical_open = count of IndependenceFinding where engagement_id == e and status IN {OPEN, REMEDIATION, RE_TEST, REOPENED} and severity == CRITICAL
      high_open     = count of IndependenceFinding where engagement_id == e and status IN {OPEN, REMEDIATION, RE_TEST, REOPENED} and severity == HIGH
      prohibited    = count of NonAuditService where (engagement_id == e or client_id == e.client_id) and is_prohibited_for_pie == true and status IN {DRAFT, PENDING_APPROVAL, APPROVED}
      breached      = count of AffiliateAttestation where engagement_id == e and attestation_status == BREACHED
      material      = count of IndependenceThreat where client_id == e.client_id and threat_type == FINANCIAL_INTEREST and is_material == true and status IN {DECLARED, IN_COOLING_OFF}
      network       = affiliate_network_risk(e)
      FROZEN     when critical_open >= 1 or high_open >= 2 or prohibited >= 1 or material >= 1 or network >= FROZEN_NETWORK_MIN
      RESTRICTED when not FROZEN and (high_open == 1 or breached >= 1 or network >= RESTRICTED_NETWORK_MIN)
      CLEAR      otherwise
      # Client roll-up, recomputed by the same trigger, over every engagement of the client:
      # Client.aggregate_independence_status = FROZEN when any engagement is FROZEN
      #                                      = RESTRICTED when none is FROZEN and any is RESTRICTED
      #                                      = CLEAR otherwise
      # Client.open_finding_count = count of IndependenceFinding rows whose engagement belongs to the
      #   client and whose status is not CLOSED
    input_set: "all findings, threats, services and attestations attached to the engagement or its client, restricted to the status sets named above"
    constants:
      FROZEN_CRITICAL_MIN: 1
      FROZEN_HIGH_MIN: 2
      FROZEN_NETWORK_MIN: 12
      RESTRICTED_HIGH_EXACT: 1
      RESTRICTED_NETWORK_MIN: 6
    precision: "integer counts; no rounding"
    variants: []

  - name: financial_interest_materiality
    trigger: "on POST /audit/independence-threats when threat_type == FINANCIAL_INTEREST"
    algorithm: threshold
    formula: |
      when threat_type != FINANCIAL_INTEREST: is_material = false
      direct = instrument_type IN {EQUITY, DEBT, DERIVATIVE, TRUST}
      indirect = instrument_type == MUTUAL_FUND
      when direct and Client.is_public_interest_entity is true: is_material = true
      otherwise: is_material = value_cents >= MATERIALITY_CENTS[Professional.grade] * (INDIRECT_MULTIPLIER when indirect else 1)
    input_set: "the IndependenceThreat being created plus its Professional.grade, Client.is_public_interest_entity and instrument_type"
    constants:
      MATERIALITY_CENTS: {PARTNER: 500000, DIRECTOR: 100000, SENIOR_MANAGER: 50000, MANAGER: 25000}
      INDIRECT_MULTIPLIER: 2
    precision: "exact integer cents; the boundary is inclusive (>=)"
    variants: []

  - name: cooling_off_window
    trigger: "on POST /audit/independence-threats when threat_type == EMPLOYMENT_RELATIONSHIP, and on every read once the logical clock advances"
    algorithm: scheduled_deferred
    formula: |
      cooling_off_end_on = effective_on + COOLING_OFF_MONTHS[relationship_type] months (day-of-month preserved)
      initial status = IN_COOLING_OFF when COOLING_OFF_MONTHS[relationship_type] > 0
                     = CLEARED       when COOLING_OFF_MONTHS[relationship_type] == 0 and is_material is false
                     = MITIGATED     when COOLING_OFF_MONTHS[relationship_type] == 0 and is_material is true
      a Professional may not hold an ACTIVE EngagementRoleAssignment on any engagement of a Client while an
      IndependenceThreat for that (professional, client) pair has status == IN_COOLING_OFF and the assignment's
      started_on falls inside [effective_on, cooling_off_end_on] inclusive of both ends
    input_set: "IndependenceThreat rows with threat_type == EMPLOYMENT_RELATIONSHIP for the (professional, client) pair"
    constants:
      COOLING_OFF_MONTHS: {IMMEDIATE_FAMILY_EMPLOYED_BY_CLIENT: 0, FORMER_FIRM_PROFESSIONAL_JOINED_CLIENT: 12, PROFESSIONAL_PRIOR_CLIENT_EMPLOYEE: 24, CLIENT_BOARD_MEMBERSHIP: 0}
    precision: "whole months; the cooling-off interval is closed at both ends"
    variants: []

  - name: affiliate_network_risk
    trigger: "on AffiliateAttestation transitions and on every engagement independence recompute"
    algorithm: weighted_scoring
    formula: |
      when Engagement.is_multinational is false: network_points = 0
      raw = sum over AffiliateAttestation rows a with a.engagement_id == e of (a.breach_count * TIER_WEIGHT[Affiliate(a.affiliate_id).network_tier])
      network_points = min(NETWORK_RISK_CEILING, max(0, raw))
    input_set: "AffiliateAttestation rows of the engagement joined to their Affiliate.network_tier; breach_count is cumulative and never reset"
    constants:
      TIER_WEIGHT: {MEMBER_FIRM: 3, CORRESPONDENT: 2, ALLIANCE: 1}
      NETWORK_RISK_CEILING: 50
    precision: "integer"
    variants: []

  - name: inspection_response_due
    trigger: "on POST /audit/quality-reviews when review_type == REGULATORY_INSPECTION"
    algorithm: threshold
    formula: |
      when review_type != REGULATORY_INSPECTION: response_due_on = null
      base_days = RESPONSE_WINDOW_DAYS[inspection_body]
      effective_days = base_days when deficiency_count < DEFICIENCY_HALVING_THRESHOLD
                     = round_half_up(base_days / 2) otherwise
      response_due_on = received_on + effective_days days
    input_set: "the QualityReview being created plus its inspection_body and deficiency_count"
    constants:
      RESPONSE_WINDOW_DAYS: {PCAOB: 30, SEC: 21, LOCAL_REGULATOR: 45, INTERNAL_QC: 15}
      DEFICIENCY_HALVING_THRESHOLD: 5
    precision: "whole days; the halving boundary is inclusive (>= 5 halves)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: business_constraint
    check: "request body matches the endpoint schema: required fields present, enum members valid, numeric ranges respected (score_impact 0..40, fee_cents >= 0, value_cents >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers are present"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "the resource named by the path id exists in its collection; the error id is the entity-specific one (ERR_CLIENT_NOT_FOUND, ERR_ENGAGEMENT_NOT_FOUND, ERR_ACCEPTANCE_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_PROFESSIONAL_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_THREAT_NOT_FOUND, ERR_SERVICE_NOT_FOUND, ERR_AFFILIATE_NOT_FOUND, ERR_ATTESTATION_NOT_FOUND, ERR_REVIEW_NOT_FOUND)"
    error_id: ERR_ENTITY_NOT_FOUND_ENTITY_SPECIFIC
    http_status: 404
    applies_to: "every endpoint with a {id} path segment"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the body resolves to an existing row (client_id, engagement_id, professional_id, affiliate_id, acceptance_id, reviewer_id)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"
  - priority: 6
    category: state
    check: "the target resource is in a state from which the requested action has a declared transition in §1.2; POST /audit/role-assignments additionally requires the engagement's status to be IN {DRAFT, ACCEPTANCE_PENDING, ACTIVE, SUSPENDED}, and POST /audit/independence-findings requires the engagement's status to be IN {DRAFT, ACCEPTANCE_PENDING, ACTIVE, SUSPENDED}"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition and action endpoints, plus POST /audit/role-assignments and POST /audit/independence-findings"
  - priority: 7
    category: state
    check: "OCC: the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /audit/role-assignments", "POST /audit/independence-findings"]
  - priority: 8
    category: business_safety
    check: "a NonAuditService whose is_prohibited_for_pie is true may not leave DRAFT"
    error_id: ERR_PROHIBITED_SERVICE
    http_status: 422
    applies_to: ["POST /audit/non-audit-services/{id}/transitions"]
  - priority: 9
    category: business_safety
    check: "a Professional holding an IndependenceThreat with threat_type FINANCIAL_INTEREST, is_material true and status IN {DECLARED, IN_COOLING_OFF} for the engagement's client may not be assigned to that engagement"
    error_id: ERR_MATERIAL_INTEREST_CONFLICT
    http_status: 422
    applies_to: ["POST /audit/role-assignments"]
  - priority: 10
    category: business_safety
    check: "a Professional under an active cooling-off window for the engagement's client may not be assigned to that engagement"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 422
    applies_to: ["POST /audit/role-assignments"]
  - priority: 11
    category: business_constraint
    check: "at most one ACTIVE EngagementRoleAssignment may exist per (engagement_id, role) for role IN {LEAD_PARTNER, CONCURRING_PARTNER, EQ_REVIEWER}"
    error_id: ERR_DUPLICATE_ROLE_HOLDER
    http_status: 409
    applies_to: ["POST /audit/role-assignments"]
  - priority: 12
    category: business_temporal
    check: "assignment intervals on the same (engagement_id, role) must not overlap; the interval is half-open [started_on, scheduled_end_on) so an assignment starting exactly at another's scheduled_end_on is allowed"
    error_id: ERR_ROLE_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: ["POST /audit/role-assignments"]
  - priority: 13
    category: business_temporal
    check: "QualityReview rows for the same (reviewer_id, review_type) must be separated by REVIEW_BUFFER_DAYS: the candidate received_on must be at least 5 days after the latest due_on of an overlapping or adjacent review of that reviewer and type"
    error_id: ERR_REVIEW_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /audit/quality-reviews"]
  - priority: 14
    category: business_constraint
    check: "consecutive_service_months for the (professional_id, client_id, role) run must stay below the time-on limit of the STANDARD or PIE_ACCELERATED variant"
    error_id: ERR_ROTATION_LIMIT_REACHED
    http_status: 422
    applies_to: ["POST /audit/role-assignments"]
  - priority: 15
    category: business_constraint
    check: "after the candidate assignment the Professional's active_workload_points must not exceed max_workload_points"
    error_id: ERR_WORKLOAD_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /audit/role-assignments"]
  - priority: 16
    category: business_constraint
    check: "remediation_attempts must be below 3 before a finding may re-enter remediation"
    error_id: ERR_REMEDIATION_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: ["POST /audit/independence-findings/{id}/transitions"]
  - priority: 17
    category: business_constraint
    check: "acceptance decision preconditions: combined_risk_score band for the requested decision and no unresolved CRITICAL integrity assessment"
    error_id: ERR_ACCEPTANCE_CONDITIONS_UNMET
    http_status: 422
    applies_to: ["POST /audit/client-acceptances/{id}/decision"]
  - priority: 18
    category: business_fiscal
    check: "round_half_up(fee_cents / 100) * 100 + Client.naf_approved_fee_cents must not exceed Client.naf_annual_cap_cents; evaluated as a pre-check on action=SUBMIT_FOR_APPROVAL and authoritatively on action=APPROVE"
    error_id: ERR_NAF_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /audit/non-audit-services/{id}/transitions"]
  - priority: 19
    category: business_temporal
    check: "IntegrityAssessment.assessed_on must not be later than the logical clock"
    error_id: ERR_ASSESSMENT_DATE_IN_FUTURE
    http_status: 422
    applies_to: ["POST /audit/client-acceptances/{id}/integrity-assessments"]
  - priority: 20
    category: business_temporal
    check: "EngagementRoleAssignment.started_on must not be earlier than the logical clock"
    error_id: ERR_BACKDATED_ASSIGNMENT
    http_status: 422
    applies_to: ["POST /audit/role-assignments"]
  - priority: 21
    category: business_referential
    check: "an Engagement whose independence_status is FROZEN may not be activated, staffed or resumed"
    error_id: ERR_ENGAGEMENT_FROZEN
    http_status: 409
    applies_to: ["POST /audit/role-assignments", "POST /audit/engagements/{id}/transitions", "POST /audit/client-acceptances/{id}/decision"]
  - priority: 22
    category: business_referential
    check: "an Engagement may not be closed while any of its IndependenceFinding rows is in status IN {OPEN, REMEDIATION, RE_TEST, REOPENED}"
    error_id: ERR_FINDINGS_OPEN
    http_status: 409
    applies_to: ["POST /audit/engagements/{id}/transitions"]
  - priority: 23
    category: business_referential
    check: "a multinational Engagement may not be activated while any AffiliateAttestation for it is in status PENDING"
    error_id: ERR_ATTESTATION_INCOMPLETE
    http_status: 409
    applies_to: ["POST /audit/client-acceptances/{id}/decision"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/audit/clients"
    description: "Register a client or prospect."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, industry_code, jurisdiction_country, "is_public_interest_entity?", "parent_client_id?", "naf_annual_cap_cents?"]
    output: Client
    side_effects: ["Client.status defaults to PROSPECT", "Client.naf_approved_fee_cents computed via naf_fee_pool"]
  - method: GET
    path: "/audit/clients"
    description: "List clients with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["industry_code?", "status?", "parent_client_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/audit/clients/{id}"
    description: "Read one client."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/audit/engagements"
    description: "Open an audit engagement for a client."
    roles: [EngagementPartner]
    code: 201
    input: [client_id, engagement_type, fiscal_year_end, "is_multinational?"]
    output: Engagement
    side_effects: ["Engagement.status defaults to DRAFT", "Engagement.independence_status defaults to CLEAR", "Engagement.risk_tier defaults to LOW"]
  - method: GET
    path: "/audit/engagements"
    description: "List engagements with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["client_id?", "lead_partner_id?", "concurring_partner_id?", "status?", "independence_status?", "risk_tier?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: GET
    path: "/audit/engagements/{id}"
    description: "Read one engagement."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/audit/engagements/{id}/independence-summary"
    description: "Computed independence posture roll-up for one engagement."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: {engagement_id: string, independence_status: string, critical_open_count: integer, high_open_count: integer, prohibited_service_count: integer, breached_attestation_count: integer, material_interest_count: integer, network_risk_points: integer}
    side_effects: ["recomputes engagement_independence_status and affiliate_network_risk before answering"]
  - method: POST
    path: "/audit/engagements/{id}/transitions"
    description: "Manual engagement lifecycle actions."
    roles: [EngagementPartner]
    code: 200
    input: [action]
    output: Engagement
    side_effects: ["action CLOSE ends every ACTIVE assignment and recomputes Professional.active_workload_points", "action SUSPEND moves ACTIVE to SUSPENDED", "action RESUME moves SUSPENDED to ACTIVE when independence_status is not FROZEN"]
  - method: POST
    path: "/audit/client-acceptances"
    description: "Open an acceptance or continuance evaluation."
    roles: [ClientAcceptanceCommittee]
    code: 201
    input: [client_id, engagement_id, proposed_by, industry_expertise_required, "industry_expertise_confirmed?"]
    output: ClientAcceptance
    side_effects: ["ClientAcceptance.status defaults to DRAFT", "integrity_score and risk_score computed with the PROVISIONAL variant"]
  - method: GET
    path: "/audit/client-acceptances"
    description: "List acceptance evaluations with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["client_id?", "engagement_id?", "status?", "limit?", "offset?"]
    output: ClientAcceptance[]
    side_effects: []
  - method: GET
    path: "/audit/client-acceptances/{id}"
    description: "Read one acceptance evaluation."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: ClientAcceptance
    side_effects: []
  - method: POST
    path: "/audit/client-acceptances/{id}/submit"
    description: "Submit the evaluation to the acceptance committee."
    roles: [ClientAcceptanceCommittee]
    code: 200
    input: []
    output: ClientAcceptance
    side_effects: ["risk_score recomputed with the FINAL variant", "combined_risk_score clamped", "governing Engagement.status set to ACCEPTANCE_PENDING"]
  - method: POST
    path: "/audit/client-acceptances/{id}/decision"
    description: "Record the committee decision."
    roles: [ClientAcceptanceCommittee]
    code: 200
    input: [decision, "decision_notes?"]
    output: ClientAcceptance
    side_effects: ["governing Engagement.status and risk_tier updated per §1.2", "Client.status set to ACTIVE on approval"]
  - method: POST
    path: "/audit/client-acceptances/{id}/integrity-assessments"
    description: "Record management integrity evidence on an evaluation."
    roles: [ClientAcceptanceCommittee]
    code: 201
    input: [source_type, severity, score_impact, assessed_on, "resolved?"]
    output: IntegrityAssessment
    side_effects: ["ClientAcceptance.integrity_score recomputed", "ClientAcceptance.risk_score recomputed with the active variant"]
  - method: GET
    path: "/audit/client-acceptances/{id}/integrity-assessments"
    description: "List integrity evidence for an evaluation."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: IntegrityAssessment[]
    side_effects: []
  - method: POST
    path: "/audit/affiliates"
    description: "Register a network member firm."
    roles: [PlatformAdmin]
    code: 201
    input: [firm_name, country_code, network_tier, independence_framework]
    output: Affiliate
    side_effects: ["Affiliate.status defaults to ACTIVE"]
  - method: GET
    path: "/audit/affiliates"
    description: "List network member firms."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["network_tier?", "status?", "country_code?", "limit?", "offset?"]
    output: Affiliate[]
