              as_user_id: "${cr_h_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_h: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_h}", score: 0.05 }
              as: PlatformAdmin
            - *clock
            - call: "GET /ugc/marketplace-items/${item_h_id}"
              payload: {}
              as: Creator
              as_user_id: "${cr_h_id}"
              captures: { item_h_v: $.data.version }
          trigger:
            - call: "POST /ugc/resale-listings"
              payload: { item_id: "${item_h_id}", ask_price_robux: 50, expected_item_version: "${item_h_v}" }
              as: Creator
              as_user_id: "${cr_h_id}"
              captures: { rl_h_id: $.data.id }
            - call: "POST /ugc/resale-listings"
              payload: { item_id: "${item_h_id}", ask_price_robux: 49, expected_item_version: "${item_h_v}" }
