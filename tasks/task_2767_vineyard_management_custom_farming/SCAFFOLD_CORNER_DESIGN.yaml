              payload: { applicator_license_no: "PCA-4471", wind_speed_mph: 5.0, expected_block_version: "${b1_v}" }
              as: Applicator
              as_user_id: "u-app-1"
              captures: { sr1_rei: $.data.rei_clear_at, sr1_phi: $.data.phi_clear_at }
            - call: "GET /blocks/${b1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { b1_v2: $.data.version, rei_after_1: $.data.rei_clear_at, phi_after_1: $.data.phi_clear_at }
            - call: "POST /spray-records/${sr2_id}/apply"
              payload: { applicator_license_no: "PCA-4471", wind_speed_mph: 4.0, expected_block_version: "${b1_v2}" }
              as: Applicator
              as_user_id: "u-app-1"
              captures: { sr2_rei: $.data.rei_clear_at, sr2_phi: $.data.phi_clear_at }
            - call: "GET /blocks/${b1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { rei_after_2: $.data.rei_clear_at, phi_after_2: $.data.phi_clear_at, posture_after_2: $.data.compliance_posture, b1_v3: $.data.version }
            - call: "GET /farming-plans/${p1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { p1_committed: $.data.committed_cost }
          assert:
            - "SprayRecord.${sr1_id}.rei_clear_at == 2026-08-04T00:00:00Z and phi_clear_at == 2026-08-22T00:00:00Z"
            - "SprayRecord.${sr2_id}.rei_clear_at == 2026-08-02T00:00:00Z and phi_clear_at == 2026-08-31T00:00:00Z"
            - "rei_after_1 == 2026-08-04T00:00:00Z and phi_after_1 == 2026-08-22T00:00:00Z"
            - "rei_after_2 == 2026-08-04T00:00:00Z (the 24-hour spray does NOT shorten it)"
            - "phi_after_2 == 2026-08-31T00:00:00Z"
            - "posture_after_2 == REENTRY_RESTRICTED"
            - "b1_v == 2, b1_v2 == 3 and b1_v3 == 4"
            - "FarmingPlan.${p1_id}.committed_cost == 1452.50 (812.50 + 640.00)"

      - name: labor_cost_variant_divergence_on_same_crew
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: work_order_labor_cost_estimated_vs_actual_divergence
          rationale: "The §1.8 dual_variant_calc instance already runs both variants over one crew and asserts the estimated/actual pair together with the exact delta, so a second divergence probe would re-test the same arithmetic."

      - name: yield_estimate_variant_selected_by_method
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: yield_estimate_cluster_count_vs_berry_sample_divergence
          rationale: "The §1.8 instance already files both methods on the same vines and asserts that the method field alone selects the branch (and that each branch rejects the other's fields), which is the variant-selection claim."

      - name: settlement_variant_reconciliation_provisional_to_final
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: contract_settlement_provisional_vs_final_divergence
          rationale: "The §1.8 instance already settles the same period provisionally and then finally and asserts the delta that lands on last_settlement_total, which is exactly the reconciliation claim."

      - name: settlement_rounding_precision_per_block
        claim_type: precision
        excluded_because:
          difficulty_instance: settlement_direct_cost_rounds_per_block_before_summing
          rationale: "The §1.8 boundary_precision_check instance already pins the per-block rounding order by asserting 6628.29 against the 6628.30 that a sum-then-round implementation yields."

      - name: direct_cost_overhead_waterfall_across_blocks
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: settlement_direct_cost_rounds_per_block_before_summing
          rationale: "The same §1.8 instance also exercises the per-block allocation of period_overhead_pool across three enrolled blocks in created_at order, including a block with no qualifying activity that still absorbs its share."

      - name: plan_budget_gate_threshold_at_exact_equality
        claim_type: threshold
        excluded_because:
          difficulty_instance: work_order_at_exact_plan_budget_equality_is_accepted
          rationale: "The §1.8 boundary_precision_check instance already tests the budget threshold at exact equality and one cent past it, which is the threshold-boundary claim for the committed-cost gate."

  - section: validations
    instances:
      - name: request_missing_x_user_id_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: "The identity check runs before everything else: a GET /vineyards/{id} that carries X-User-Role VineyardManager but no X-User-ID header returns ERR_UNAUTHENTICATED at HTTP 401 with response_type error, not 403 and not 404."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "GET /vineyards/${v1_id}"
              payload: {}
              as: VineyardManager
              captures: { auth_error: $.data.error_id }
          assert:
            - "the request is sent with X-User-Role VineyardManager and NO X-User-ID header"
            - "HTTP status is 401"
            - "error_id == ERR_UNAUTHENTICATED"
            - "the envelope carries response_type == error and data.message is non-empty"
            - "the same request with X-User-ID u-vm-1 returns 200"

      - name: block_list_limit_above_maximum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
          - response_envelope.pagination
        distinguishing_aspect: "The pagination band is 1..100 inclusive: limit 101 on GET /blocks returns ERR_INVALID_REQUEST at HTTP 400 rather than being silently clamped to 100, while limit 100 succeeds."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with one block B-12."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "GET /blocks"
              payload: { vineyard_id: "${v1_id}", limit: 101, offset: 0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { page_error: $.data.error_id }
            - call: "GET /blocks"
              payload: { vineyard_id: "${v1_id}", limit: 100, offset: 0 }
              as: VineyardManager
              as_user_id: "u-vm-1"
          assert:
            - "the limit 101 call: HTTP status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the limit 100 call: HTTP status is 200 with response_type array and one Block element"
            - "the successful call reports total_count 1 and has_more false"

      - name: yield_estimate_cluster_count_with_berry_fields_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_INVALID_REQUEST]
          - calculations.block_yield_estimate_tons.variants
        distinguishing_aspect: "The required field set is conditional on method: a CLUSTER_COUNT estimate that also carries berries_per_cluster returns ERR_INVALID_REQUEST at HTTP 400 even though avg_cluster_weight_lb is present, and the same payload without the berry field is accepted with estimated_tons 91.47."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (12.5 acres, vine_count 13612)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /blocks/${b1_id}/yield-estimates"
              payload: { method: "CLUSTER_COUNT", sample_date: "2026-08-01", avg_clusters_per_vine: 32.0, avg_cluster_weight_lb: 0.42, berries_per_cluster: 95 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { bad_error: $.data.error_id }
            - call: "POST /blocks/${b1_id}/yield-estimates"
              payload: { method: "CLUSTER_COUNT", sample_date: "2026-08-01", avg_clusters_per_vine: 32.0, avg_cluster_weight_lb: 0.42 }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { ye_ok: $.data.id, ye_ok_tons: $.data.estimated_tons }
          assert:
            - "the first call: HTTP status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the first call creates nothing: Block.${b1_id}.harvest_posture is still NOT_ESTIMATED immediately after it"
            - "the second call: HTTP status is 201 with estimated_tons == 91.47 and berries_per_cluster null"

      - name: crew_hourly_with_nonzero_piece_rate_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=33]
          - errors[ERR_INVALID_REQUEST]
          - entities.LaborCrew.fields.pay_structure
        distinguishing_aspect: "Pay-structure coherence is conditional both ways: an HOURLY crew with piece_rate_per_vine 0.65 returns ERR_INVALID_REQUEST at HTTP 400, and so does a PIECE_RATE crew with piece_rate_per_vine 0.00, while HOURLY with 0.00 is accepted."
        test_recipe:
          setup:
            - "Empty database with the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
          trigger:
            - call: "POST /crews"
              payload: { crew_name: "Bad Hourly", pay_structure: "HOURLY", crew_size: 8, base_hourly_rate: 22.00, piece_rate_per_vine: 0.65, vines_per_hour_standard: 40, task_capabilities: ["PRUNING"], pest_certified: false }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { hourly_error: $.data.error_id }
            - call: "POST /crews"
              payload: { crew_name: "Bad Piece", pay_structure: "PIECE_RATE", crew_size: 12, base_hourly_rate: 19.50, piece_rate_per_vine: 0.00, vines_per_hour_standard: 45, task_capabilities: ["PRUNING"], pest_certified: false }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { piece_error: $.data.error_id }
            - call: "POST /crews"
              payload: { crew_name: "Good Hourly", pay_structure: "HOURLY", crew_size: 8, base_hourly_rate: 22.00, piece_rate_per_vine: 0.00, vines_per_hour_standard: 40, task_capabilities: ["PRUNING"], pest_certified: false }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { ok_crew: $.data.id, ok_status: $.data.crew_status }
          assert:
            - "the HOURLY-with-piece-rate call: HTTP status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the PIECE_RATE-with-zero call: HTTP status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the coherent HOURLY call: HTTP status is 201, crew_status == ACTIVE and scheduled_work_order_count == 0"

      - name: duplicate_block_code_within_vineyard_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=96]
          - errors[ERR_DUPLICATE_BLOCK_CODE]
          - entities.Block.fields.block_code
        distinguishing_aspect: "block_code is unique per vineyard, not globally: a second B-12 under the same vineyard returns ERR_DUPLICATE_BLOCK_CODE at HTTP 409, while B-12 under a different vineyard is created successfully."
        test_recipe:
          setup:
            - "Vineyard V_A Ridgecrest Ranch with block B-12, and a second vineyard V_B Salinas Bench with no blocks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { va_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${va_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /vineyards"
              payload: { name: "Salinas Bench", owner_legal_name: "Salinas Bench Farms LLC", ava_region: "Monterey", client_contact_email: "ops@salinas.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { vb_id: $.data.id }
          trigger:
