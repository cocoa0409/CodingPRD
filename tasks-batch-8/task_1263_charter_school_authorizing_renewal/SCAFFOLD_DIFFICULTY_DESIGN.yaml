      - name: fee_ledger_conservation_pay_and_waive
        grounds:
          - calculations.fee_ledger_invariant
          - state_machines.FeeInvoice.FINALIZED_to_PAID
          - state_machines.FeeInvoice.FINALIZED_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity: invoice money. Both compensating terminals — pay (paid := billed)
          and waive (waived := billed) — preserve paid + waived + outstanding == billed_amount
          on two separate invoices billed at the same 6528000 cents; distinct conserved quantity
          (money) from the sibling's seat partition.
        test_recipe:
          setup:
            - "School OPEN (standard fixture); invoices FY2026 and FY2027 both ESTIMATED then FINALIZED with audited == estimated (400), billed 6528000 each"
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "CI Fee Academy", founding_group: "FG CI2", cycle_year: 2027, proposed_grades: "K-8" }
