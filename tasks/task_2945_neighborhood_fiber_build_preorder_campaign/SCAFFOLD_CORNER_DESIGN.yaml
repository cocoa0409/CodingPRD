      - name: fallback_selection_ranks_speed_then_price_and_honours_the_inclusive_distance_edge
        claim_type: topological
        grounds:
          - calculations.fallback_option_selection
          - endpoints["POST /service-addresses/{id}/fallback-offers"]
          - endpoints["POST /fallback-offers/{id}/response"]
        distinguishing_aspect: "Four options separate every clause of the ranking at once: the fastest and cheapest option is skipped because its reach is 799 m against a 800 m address (the >= comparison is inclusive only at exactly the boundary), a DISABLED 900 Mbps option is invisible, and between the two 300 Mbps survivors the cheaper one wins despite a far worse priority_rank -- price outranks operator preference. Declining that winner then permanently removes it for this address only, so the re-run promotes the 7000-cent option."
        test_recipe:
          setup:
            - "One campaign and one zone with a SINGLE_FAMILY address at distance_to_node_m 800, determined NOT_SERVICEABLE for EXCESSIVE_DISTANCE, with a GRANTED unserved exception."
            - "Four fallback options on the campaign: o1 FIXED_WIRELESS 300 Mbps / 7000 cents / reach 800 / rank 3; o2 SATELLITE_PARTNER 300 Mbps / 6500 cents / reach 1500 / rank 9; o3 DSL_PARTNER 500 Mbps / 4000 cents / reach 799 / rank 1; o4 FIXED_WIRELESS 900 Mbps / 3000 cents / reach 5000 / rank 1 but DISABLED."
            - "One RESIDENT account to receive the offer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "99 Ridge Rd", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 800 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "NOT_SERVICEABLE", not_serviceable_reason: "EXCESSIVE_DISTANCE" }
              as: ProgramManager
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "REQUEST", exception_reason: "Beyond aerial reach; resident requests alternative service." }
              as: ProgramManager
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "GRANT" }
              as: ProgramManager
            - call: "POST /fallback-options"
              payload: { campaign_id: "${camp}", technology: "FIXED_WIRELESS", min_downstream_mbps: 300, monthly_price_cents: 7000, max_serviceable_distance_m: 800, priority_rank: 3 }
              as: ProgramManager
              captures: { o1: $.data.id }
            - call: "POST /fallback-options"
              payload: { campaign_id: "${camp}", technology: "SATELLITE_PARTNER", min_downstream_mbps: 300, monthly_price_cents: 6500, max_serviceable_distance_m: 1500, priority_rank: 9 }
              as: ProgramManager
              captures: { o2: $.data.id }
            - call: "POST /fallback-options"
              payload: { campaign_id: "${camp}", technology: "DSL_PARTNER", min_downstream_mbps: 500, monthly_price_cents: 4000, max_serviceable_distance_m: 799, priority_rank: 1 }
              as: ProgramManager
              captures: { o3: $.data.id }
            - call: "POST /fallback-options"
              payload: { campaign_id: "${camp}", technology: "FIXED_WIRELESS", min_downstream_mbps: 900, monthly_price_cents: 3000, max_serviceable_distance_m: 5000, priority_rank: 1, option_status: "DISABLED" }
              as: ProgramManager
              captures: { o4: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Cass Doyle", email: "cass@example.com", phone: "+13035550103", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
          trigger:
            - call: "POST /service-addresses/${a1}/fallback-offers"
              payload: { account_id: "${acct1}", expires_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { of1: $.data.id, chosen1: $.data.fallback_option_id, tech1: $.data.technology, price1: $.data.monthly_price_cents }
            - call: "POST /fallback-offers/${of1}/response"
              payload: { response: "DECLINE" }
              as: Subscriber
              as_user_id: "${acct1}"
            - call: "POST /service-addresses/${a1}/fallback-offers"
              payload: { account_id: "${acct1}", expires_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
              captures: { of2: $.data.id, chosen2: $.data.fallback_option_id, tech2: $.data.technology, price2: $.data.monthly_price_cents }
          assert:
            - "${chosen1} == ${o2} -- equal speed, so the 6500-cent option beats the 7000-cent one even though its priority_rank is 9 against 3"
            - "${tech1} == SATELLITE_PARTNER and ${price1} == 6500 are snapshots, and FallbackOffer.${of1}.min_downstream_mbps == 300"
            - "${o3} was never chosen despite 500 Mbps at 4000 cents, because 799 < 800 fails max_serviceable_distance_m >= distance_to_node_m"
            - "${o4} was never chosen because option_status DISABLED removes it from the pool entirely"
            - "${chosen2} == ${o1} and ${tech2} == FIXED_WIRELESS with ${price2} == 7000 -- the DECLINED option is permanently excluded for this address"
            - "FallbackOffer.${of1}.status == DECLINED with responded_at == 2026-08-01T00:00:00Z, and FallbackOffer.${of2}.status == OFFERED with offered_at == 2026-08-01T00:00:00Z"
            - "ServiceAddress.${a1}.active_fallback_technology == null because nothing was accepted"

