  - section: calculations
    instances:
      - name: asset_reuse_discount_decreases_with_chain_depth
        claim_type: topological
        grounds:
          - calculations.asset_reuse_credit
          - entities.Asset.fields.reuse_depth
          - entities.Asset.fields.effective_complexity_points
        distinguishing_aspect: |
          Depth is counted in edges along the derived_from chain, not averaged and not capped at 1, and the
          discount shrinks with depth: an identical base of 200.00 is worth 120.00 at depth 1 but 150.00 at
          depth 2. The root itself takes no discount even though it is LIBRARY_APPROVED.
        test_recipe:
          setup:
            - "production AD01 is PRE_PRODUCTION (asset creation is legal there)"
            - "root asset A (300.00 points) is PUBLISHED and LIBRARY_APPROVED"
            - "asset B (200.00 points) derives from A and is itself driven to PUBLISHED and LIBRARY_APPROVED"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_ENV_CITY", asset_type: "ENVIRONMENT", base_complexity_points: 300.00 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { a_id: "$.data.id", a_depth: "$.data.reuse_depth", a_disc: "$.data.reuse_discount_pct", a_points: "$.data.effective_complexity_points" }
            - call: "POST /studio/assets/${a_id}/advance-build"
              payload: { to_build_status: "MODELING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${a_id}/advance-build"
              payload: { to_build_status: "RIGGING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${a_id}/advance-build"
              payload: { to_build_status: "SURFACING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${a_id}/advance-build"
              payload: { to_build_status: "PUBLISHED" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${a_id}/library-submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${a_id}/library-decision"
              payload: { decision: "APPROVED" }
              as: Supervisor
              as_user_id: "u-sup-01"
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_ENV_ALLEY", asset_type: "ENVIRONMENT", base_complexity_points: 200.00, derived_from_asset_id: "${a_id}" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { b_id: "$.data.id", b_depth: "$.data.reuse_depth", b_disc: "$.data.reuse_discount_pct", b_points: "$.data.effective_complexity_points" }
            - call: "POST /studio/assets/${b_id}/advance-build"
              payload: { to_build_status: "MODELING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${b_id}/advance-build"
              payload: { to_build_status: "RIGGING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${b_id}/advance-build"
              payload: { to_build_status: "SURFACING" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${b_id}/advance-build"
              payload: { to_build_status: "PUBLISHED" }
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${b_id}/library-submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/assets/${b_id}/library-decision"
              payload: { decision: "APPROVED" }
              as: Supervisor
              as_user_id: "u-sup-01"
          trigger:
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_ENV_DOORWAY", asset_type: "ENVIRONMENT", base_complexity_points: 200.00, derived_from_asset_id: "${b_id}" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { c_id: "$.data.id", c_depth: "$.data.reuse_depth", c_disc: "$.data.reuse_discount_pct", c_points: "$.data.effective_complexity_points", c_stale: "$.data.reuse_source_stale" }
            - call: "GET /studio/assets/${b_id}"
              as: Artist
              captures: { b_points_re: "$.data.effective_complexity_points", b_depth_re: "$.data.reuse_depth" }
          assert:
            - "${a_depth} == 0, ${a_disc} == 0.00 and ${a_points} == 300.00 — the root never discounts itself"
            - "${b_depth} == 1, ${b_disc} == 0.40 and ${b_points} == 120.00"
            - "${c_depth} == 2, ${c_disc} == 0.25 and ${c_points} == 150.00 and ${c_stale} == false"
            - "150.00 > 120.00: the deeper asset keeps MORE points, so the discount is not accumulated down the chain"
            - "${b_depth_re} == 1 and ${b_points_re} == 120.00 — adding a descendant never re-rates the ancestor"
      - name: shot_bcws_accrues_linearly_against_the_clock
        claim_type: correct_result
        grounds:
          - calculations.shot_earned_value
          - endpoints[GET /studio/shots/{id}/earned-value]
        distinguishing_aspect: |
          bcws is a pure function of the logical clock against the planned span, independent of any work
          performed: 15 days into a 60-day span the shot has earned nothing but has planned 25% of a
          1,000,000-cent budget, so bcws is 250000, bcwp is 0, spi is 0.0000 and cpi is null.
        test_recipe:
          setup:
            - "production AD01 is PRODUCTION_ACTIVE"
            - "shot AD01_010_0010 has budget 1,000,000 cents and the planned span 2026-08-01 -> 2026-09-30 (60 days)"
            - "no stage task has been assigned, submitted or logged, so acwp is 0"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, gate_types: ["SCRIPT"], master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/shots/${shot_id}/earned-value"
              as: ProductionManager
              captures: { bcws_t0: "$.data.bcws_cents", spi_t0: "$.data.spi" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { clock_now: "$.data.current_utc" }
            - call: "GET /studio/shots/${shot_id}/earned-value"
              as: ProductionManager
              captures: { ev_variant: "$.data.variant", bcws: "$.data.bcws_cents", bcwp: "$.data.bcwp_cents", acwp: "$.data.acwp_cents", cpi: "$.data.cpi", spi: "$.data.spi", computed_at: "$.data.computed_at" }
          assert:
            - "${bcws_t0} == 0 and ${spi_t0} is null at clock 2026-08-01 (elapsed 0 of the span, bcws 0 makes spi undefined)"
            - "${clock_now} == 2026-08-16T00:00:00Z"
            - "${ev_variant} == STAGE_WEIGHT (the default variant when the query parameter is omitted)"
            - "${bcws} == 250000 — 15 elapsed days / 60 span days = 0.25 exactly, times 1000000"
            - "${bcwp} == 0 and ${acwp} == 0"
            - "${cpi} is null because acwp is 0"
            - "${spi} == 0.0000 (0 / 250000), reported with 4 decimal places"
            - "${computed_at} == 2026-08-16T00:00:00Z"
      - name: labor_cost_rounds_half_up_on_total_hours_not_per_log
        claim_type: precision
        grounds:
          - calculations.shot_earned_value.constants.LABOR_RATE_CENTS_PER_HOUR
          - calculations.shot_earned_value.precision
          - endpoints[POST /studio/stage-tasks/{id}/log-hours]
        distinguishing_aspect: |
          acwp rounds ONCE on the summed hours. Logging 0.3335 h then 0.1665 h totals exactly 0.5 h and
          9000 * 0.5 = 4500 cents; an implementation that rounds each log (3002 then 1499) reports 4501,
          one cent too much, and the half-up rule is what makes the first partial land on 3002 rather than 3001.
        test_recipe:
          setup:
            - "production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 (budget 1,000,000)"
            - "the LAYOUT task is assigned to u-artist-01, so it is IN_PROGRESS and loggable"
            - "no render job exists, so acwp is pure labor"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, gate_types: ["SCRIPT"], master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_id}/submit"
