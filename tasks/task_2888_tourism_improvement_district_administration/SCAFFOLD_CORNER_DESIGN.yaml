          - calculations.petition_support.qualifies
        excluded_because:
          difficulty_instance: boundary_precision_check / petition_weighted_support_rounds_onto_the_threshold_and_qualifies
          rationale: "That §1.8 instance lands weighted_support_pct exactly on the threshold through the single end-of-calculation rounding and asserts the >= comparison qualifies the drive."

      - name: petition_variant_selection_depends_on_the_drive_type
        claim_type: variant_selection
