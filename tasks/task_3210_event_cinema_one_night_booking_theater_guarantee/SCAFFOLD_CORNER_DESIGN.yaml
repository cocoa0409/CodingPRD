            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_nv}", committed_screens: 40, expected_attendance: 90, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { winner_err: "$.data.error_id" }
          assert:
            - "the response status is 422"
            - "the safety check wins over the fiscal one — ${winner_err} == ERR_TERRITORY_UNLICENSED"
            - "the fiscal condition is genuinely violated too — guarantee_cents 100 is below the 1000000-cent floor, so this is a true dual failure"
            - "Booking.${b_id}.status is unchanged at DRAFT"

