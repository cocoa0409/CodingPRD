              as: Licensee
              as_user_id: "${l1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_AGREEMENT_NOT_ACTIVE (state priority 7 wins over period-overlap constraint priority 10)"
      - name: temporal_vs_fiscal_on_run_create
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_PERIOD_NOT_CLOSED]
          - errors[ERR_POOL_EXCEEDS_UNDISTRIBUTED]
        distinguishing_aspect: |
          Category pair {business_temporal, business_fiscal} — disjoint from
          instance one's {state, business_constraint}: run period_end is in the
          future AND pool exceeds undistributed; priority 11 temporal beats
          priority 13 fiscal.
        test_recipe:
          setup:
            - "AG ACTIVE with undistributed pool 5000 (one accepted report final 5000); logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "TF Co", tax_id: "TAX-TF-1", contact_email: "tf@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-11111-J1"
                title: "TF"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
