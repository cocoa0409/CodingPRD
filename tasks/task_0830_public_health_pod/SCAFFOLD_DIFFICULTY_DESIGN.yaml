            - call: "POST /shift-assignments/${sa6_id}/confirm"
              payload: {}
              as: ClinicalLead
          trigger:
            - call: "GET /pods/${pod_id}/operational-metrics"
              payload: { countermeasure_id: "${cm_id}" }
              as: PublicHealthAdmin
              captures: { current_tp: $.data.current_throughput_capacity_per_hour, planned_tp: $.data.planned_throughput_capacity_per_hour }
          assert:
            - "current_throughput_capacity_per_hour == 80  (floor(4/2)=2 lanes staffed CHECKED_IN; min(2,10)=2 effective lanes; 2*40=80; inventory cap floor(500/1)=500 not binding; 2 < surge threshold 6, no surge)"
            - "planned_throughput_capacity_per_hour == 120  (floor(6/2)=3 lanes staffed CONFIRMED+CHECKED_IN; min(3,10)=3; 3*40=120; 3 < 6, no surge)"
            - "current_throughput_capacity_per_hour != planned_throughput_capacity_per_hour  (80 != 120: same POD, same InventoryLot, different ShiftAssignment status filter)"

      - name: allocation_demand_provisional_vs_final_diverge
        grounds:
          - calculations.mutual_aid_demand_forecast
          - state_machines.DispensingEvent.SCREENED_to_DISPENSED
        distinguishing_aspect: |
          Inventory/allocation-demand domain (different entity domain than instance 1's
          staffing/throughput domain): provisional_demand_doses (forward-looking, discounted
          by NO_SHOW_RATE over not-yet-dispensed registrants) and final_demand_doses
          (chronological, exact sum of already-DISPENSED doses) diverge for the same
          POD+countermeasure (4 vs 2).
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL"
            - "Countermeasure doses_required=1; POD-scoped InventoryLot on_hand_quantity=50"
            - "6 DispensingEvent rows at this POD/countermeasure: 2 stay REGISTERED, 1 reaches SCREENED, 1 reaches DEFERRED, 2 reach DISPENSED (dose_count=1 each)"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Demand Forecast Plan", jurisdiction_code: "CTY02", target_population: 20000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Riverside POD", site_type: DRIVE_THROUGH, address: "200 River Rd", staffing_capacity_lanes: 5, lane_throughput_rate_per_hour: 20 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Prophylaxis Antiviral", countermeasure_type: ANTIVIRAL, doses_required: 1, unit_cost_cents: 800, reorder_point_quantity: 10 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${pod_id}", lot_number: "LOT-B1", on_hand_quantity: 50, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Clinical Staffer", email: "clin1@example.org", primary_role: CLINICAL_LEAD, mrc_unit: "UnitB", credential_type: RN_LICENSE, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant R1", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${clin_id}"
              captures: { de1_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant R2", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${clin_id}"
              captures: { de2_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant R3", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${clin_id}"
              captures: { de3_id: $.data.id }
            - call: "POST /dispensing-events/${de3_id}/screen"
              payload: { screened_by_staff_member_id: "${clin_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant R4", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${clin_id}"
              captures: { de4_id: $.data.id }
            - call: "POST /dispensing-events/${de4_id}/screen"
              payload: { screened_by_staff_member_id: "${clin_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events/${de4_id}/defer"
              payload: { deferral_reason: "Registrant reported acute illness" }
              as: ClinicalLead
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant R5", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${clin_id}"
              captures: { de5_id: $.data.id }
            - call: "POST /dispensing-events/${de5_id}/screen"
              payload: { screened_by_staff_member_id: "${clin_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events/${de5_id}/dispense"
              payload: { dispensed_by_staff_member_id: "${clin_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant R6", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${clin_id}"
              captures: { de6_id: $.data.id }
            - call: "POST /dispensing-events/${de6_id}/screen"
              payload: { screened_by_staff_member_id: "${clin_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events/${de6_id}/dispense"
              payload: { dispensed_by_staff_member_id: "${clin_id}" }
              as: ClinicalLead
          trigger:
            - call: "GET /pods/${pod_id}/operational-metrics"
              payload: { countermeasure_id: "${cm_id}" }
              as: PublicHealthAdmin
              captures: { provisional: $.data.provisional_demand_doses, final: $.data.final_demand_doses }
          assert:
            - "provisional_demand_doses == 4  (pending = de1,de2 REGISTERED + de3 SCREENED + de4 DEFERRED = 4; ceil(4*0.9*1)=ceil(3.6)=4)"
            - "final_demand_doses == 2  (de5,de6 DISPENSED, dose_count=1 each, exact sum)"
            - "provisional_demand_doses != final_demand_doses  (4 != 2: same POD+countermeasure, two calculations, two answers)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>=2, different modes: a / b / c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pod_throughput_surge_bonus_nonlinear_branch
        grounds:
          - calculations.pod_dose_throughput_capacity
        distinguishing_aspect: |
          Mode (a): >=3 inputs (lanes_staffed, POD.staffing_capacity_lanes,
          lane_throughput_rate_per_hour, inventory availability) combine through
          nested min()/floor() and a conditional branch on effective_lanes crossing
          SURGE_LANE_THRESHOLD, which multiplies the result by SURGE_BONUS_MULTIPLIER.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL, staffing_capacity_lanes=20, lane_throughput_rate_per_hour=10"
            - "Countermeasure doses_required=1; POD-scoped InventoryLot on_hand_quantity=10000 (never the binding constraint)"
            - "12 verified StaffMembers each CHECKED_IN on the same 2026-03-02T08:00-16:00 window (effective_lanes = floor(12/2) = 6, meets SURGE_LANE_THRESHOLD)"
            - "clock at 2026-03-02T10:00:00Z"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: PANDEMIC_INFLUENZA, title: "Surge POD Plan", jurisdiction_code: "CTY03", target_population: 80000 }
              as: PublicHealthAdmin
