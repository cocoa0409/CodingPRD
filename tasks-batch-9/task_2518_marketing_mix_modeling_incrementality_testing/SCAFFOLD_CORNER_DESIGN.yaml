      - name: refresh_stability_floor_constant_applied_with_override
        claim_type: constants_applied
        grounds:
          - "calculations.refresh_stability formula - stability_score = round(max(0, 1 - drift / base), 4) over the UNION of channels, with an absent channel contributing average_roi 0"
          - "global_constants.STABILITY_FLOOR 0.6000"
          - "validations priority 64 (business_constraint) - stability_score >= STABILITY_FLOOR unless body.override_stability == true, else ERR_MODEL_UNSTABLE (422)"
          - "calculations.refresh_stability formula - a market's FIRST publication has stability_score NULL, refresh_generation 1 and SKIPS the floor gate"
        distinguishing_aspect: |
          The floor is read from global_constants and applied only from the second publication onward: the
          first publish stores stability_score null and refresh_generation 1 with no gate, while a refit
          that DROPS B_SOCIAL scores 0.4756 (because B's ROI falls to 0 in the channel union) and is
          refused with 422 ERR_MODEL_UNSTABLE until override_stability true is sent, after which the very
          same 0.4756 is persisted.
          
        test_recipe:
          setup:
            - "Fixture F1 published: run R1 is an EFFECT_PERIOD fit over BOTH channels with average_roi A_SEARCH 10.2009 and B_SOCIAL 11.2487; being the market's first publication it stored stability_score null and refresh_generation 1."
            - "Run R2 is a second EFFECT_PERIOD run over the SAME sealed window but with included_channel_ids limited to A_SEARCH. Its A_SEARCH average_roi is unchanged at 10.2009 and its holdout MAPE is 10.82, so it reaches HOLDOUT_PASSED."
            - "drift = abs(10.2009 - 10.2009) + abs(0 - 11.2487) = 11.2487 and base = 10.2009 + 11.2487 = 21.4496, so stability_score = round(1 - 11.2487/21.4496, 4) = 0.4756, below the 0.6000 floor."
