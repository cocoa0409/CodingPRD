              captures: { alert1: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-7002", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert2: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "SVR", originator_sequence: "KSAXS-7003", fips_codes: ["20177"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert3: "$.data.id" }
            - call: "GET /alert-events/${alert1}"
