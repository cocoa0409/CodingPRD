  - name: dual_variant_layer_delta_when_the_royalty_basis_switches
    claim_type: dual_variant_calculation
    grounds:
    - complexity_profile.complexity_layers[dual_variant_calculation]
    - calculations.wrap_settlement.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / wrap_settlement_fixed_gross_vs_pool_basis_delta
      rationale: That §1.8 instance settles two wraps with identical inputs under FIXED_GROSS and POOL and pins the delta.
  - name: optimistic_concurrency_on_the_distribution_write_endpoint
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[distribution-declare-stale-production]
    - errors[ERR_STALE_PRODUCTION_VERSION]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / stale_production_version_occ_precedes_distribution_fiscal_ceiling
      rationale: That §1.8 instance drives the second concurrency rule with a stale token that is also fiscally illegal and asserts the 412.
  - name: cascading_side_effects_ordering_sensitivity
    claim_type: cascading_side_effects
    grounds:
    - complexity_profile.complexity_layers[cascading_side_effects]
    excluded_because:
      difficulty_instance: transitive_cascade / settle_closing_notice_four_hop_cascade_releases_reserve_and_closes
      rationale: That §1.8 instance walks the four-hop settlement cascade in order and shows hop 4 depends on hop 3 having booked the reserve release.
