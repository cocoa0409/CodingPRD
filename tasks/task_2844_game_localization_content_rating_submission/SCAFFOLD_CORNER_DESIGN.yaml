# ===========================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
# task_2844_game_localization_content_rating_submission
#
# Walked row-by-row against references/claim-extraction-guide.md's nine
# sections. `section:` values and `claim_type:` values are taken verbatim from
# that guide; no categories were invented. Corners already asserted by a §1.8
# instance are emitted as `excluded_because:` stubs naming that instance.
#
# Every setup_api_calls chain starts from an empty database and composes only
# §1.5 endpoints. All numeric literals were computed by executing the §1.3
# formulas.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  # 1. Entities
  # =========================================================================
  - section: entities
    instances:
      - name: title_create_returns_declared_defaults_and_counters
        claim_type: creation
        grounds:
          - endpoints[POST /titles]
          - entities.Title
          - response_envelope.success
        distinguishing_aspect: "A freshly created Title must carry every system/computed field at its declared default - PLANNING, string_lock false, three zero counters, release_gate_state OPEN and version 1 - not merely the echoed input fields."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { title_code: "NOVA-30", name: "Nova Drift 30", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "SIMULTANEOUS" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id", gate: "$.data.release_gate_state" }
          assert:
            - "HTTP 201 with meta.api_request_id, meta.api_request_timestamp, response_type == object and a data object"
            - "data.title_code == NOVA-30, data.name == Nova Drift 30, data.source_language == EN, data.release_mode == SIMULTANEOUS"
            - "data.localization_state == PLANNING, data.string_lock == false, data.release_gate_state == OPEN (zero market plans -> clause 5)"
            - "data.extracted_key_count == 0, data.market_plan_count == 0, data.ready_market_count == 0"
            - "data.version == 1 and data.id is a bare UUID with no type prefix"

      - name: title_get_by_id_round_trips_stored_values
        claim_type: retrieval
        grounds:
          - endpoints[GET /titles/{title_id}]
        distinguishing_aspect: "GET must return the persisted row, not a recomputed stub: the counters observed on read equal the ones the two child creations moved, and version reflects only the mutations that happened."
        test_recipe:
          setup:
            - "One Title with one StringKey and one MarketPlan, so two derived counters are non-zero."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-31", name: "Nova Drift 31", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
          trigger:
            - call: "GET /titles/${title_id}"
              payload: {}
              as: TranslationVendor
              captures: { read_state: "$.data.localization_state", read_keys: "$.data.extracted_key_count" }
          assert:
            - "HTTP 200, data.id == ${title_id} and data.title_code == NOVA-31"
            - "data.extracted_key_count == 1 and data.market_plan_count == 1"
            - "data.localization_state == PLANNING, data.string_lock == false, data.ready_market_count == 0"
            - "data.release_gate_state == OPEN (STAGGERED, 122 days out, nothing ready or blocked -> clause 5)"

      - name: market_plan_list_filtered_by_title_is_created_at_asc
        claim_type: listing
        grounds:
          - endpoints[GET /market-plans]
          - list_ordering
          - response_envelope.success
        distinguishing_aspect: "The list channel must filter on title_id and order strictly by created_at ASC - never by id - so the plan created first is at index 0 even though its UUID may sort after the other's."
        test_recipe:
          setup:
            - "Two Titles; the first has two MarketPlans created JP-then-DE, the second has one, so the filter has something to exclude."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-32", name: "Nova Drift 32", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_a: "$.data.id" }
            - call: "POST /titles"
              payload: { title_code: "NOVA-33", name: "Nova Drift 33", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_b: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_a}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_a}", market_code: "DE", rating_board: "USK", target_rating: "MATURE_15", scope_tier: "SUBTITLED", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_de: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_b}", market_code: "US", rating_board: "ESRB", target_rating: "MATURE_17", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_us: "$.data.id" }
          trigger:
            - call: "GET /market-plans?title_id=${title_a}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { first_plan: "$.data[0].id", second_plan: "$.data[1].id" }
            - call: "GET /market-plans?title_id=${title_a}&status=DRAFT&limit=1&offset=1"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { paged_plan: "$.data[0].id" }
          assert:
            - "the unfiltered-by-page call returns HTTP 200 with response_type == array, meta.total_count == 2 and meta.has_more == false"
            - "$.data[0].id == ${mp_jp} and $.data[1].id == ${mp_de} (created_at ASC, id never used for ordering)"
            - "${mp_us} does not appear in either response - the title_id filter excludes the other title's plan"
            - "the limit=1&offset=1 call returns exactly 1 row whose id == ${mp_de}, with meta.total_count == 2 and meta.has_more == false"

      - name: get_title_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors[ERR_TITLE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID on the path must produce the entity-specific 404 ERR_TITLE_NOT_FOUND, not a generic 404 and not a 500, even on an empty database."
        test_recipe:
          setup:
            - "Empty database - no Title rows at all."
          setup_api_calls: []
          trigger:
            - call: "GET /titles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: LocalizationProducer
              captures: { missing_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id == ERR_TITLE_NOT_FOUND"
            - "the envelope still carries meta.api_request_id and meta.api_request_timestamp"

      - name: market_plan_create_missing_required_scope_tier_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=25]
          - endpoints[POST /market-plans]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "scope_tier has source input and no default, so omitting it must be rejected at priority 25 - before any FK existence check at 32 - and must not fall back to a silent TEXT_ONLY."
        test_recipe:
          setup:
            - "One Title so the title_id FK resolves and the failure is unambiguously the missing field."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-34", name: "Nova Drift 34", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
          trigger:
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { invalid_error: "$.data.error_id" }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "no MarketPlan row is created: GET /market-plans?title_id=${title_id} returns meta.total_count == 0"
            - "Title.${title_id}.market_plan_count stays 0"

      - name: booth_and_talent_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.RecordingBooth.fields.turnaround_buffer_minutes
          - entities.VoiceTalent.fields.max_daily_recording_minutes
          - entities.StringKey.fields.context_note
        distinguishing_aspect: "Three different declared defaults on three entities must materialise when the optional input is omitted - 30 minutes of booth buffer, 240 talent minutes and a null context_note - rather than 0 or null."
        test_recipe:
          setup:
            - "One Title so the StringKey FK resolves."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-35", name: "Nova Drift 35", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
          trigger:
            - call: "POST /booths"
              payload: { booth_code: "TOK-A", studio_city: "Tokyo" }
              as: LocalizationProducer
              captures: { booth_id: "$.data.id", buffer: "$.data.turnaround_buffer_minutes" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Miki Sato", language_code: "JA", union_flag: false }
              as: LocalizationProducer
              captures: { talent_id: "$.data.id", cap: "$.data.max_daily_recording_minutes" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id", note: "$.data.context_note" }
          assert:
            - "RecordingBooth.${booth_id}.turnaround_buffer_minutes == 30 and reserved_minutes_total == 0"
            - "VoiceTalent.${talent_id}.max_daily_recording_minutes == 240 and reserved_minutes_on_clock_date == 0"
            - "StringKey.${key_id}.context_note == null and status == EXTRACTED"

      - name: translation_unit_overflow_chars_computed_from_display_char_limit
        claim_type: computed_fields
        grounds:
          - endpoints[PUT /translation-units/{translation_unit_id}]
          - entities.TranslationUnit.fields.overflow_chars
        distinguishing_aspect: "overflow_chars is max(0, target_char_count - StringKey.display_char_limit) read from the KEY, so the same 95-character translation overflows a 80-limit HUD key by 15 and leaves a 140-limit MENU key at 0. A client-supplied value is irrelevant - the field is computed."
        test_recipe:
          setup:
            - "Title NOVA-36 with a HUD key (display_char_limit 80) and a MENU key (display_char_limit 140), locked and handed to the vendor, so two PENDING units exist."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-36", name: "Nova Drift 36", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "hud.ammo", source_text: "Ammo", source_char_count: 60, ui_surface: "HUD", display_char_limit: 80, tm_match_pct: 80 }
              as: LocalizationProducer
              captures: { k_hud: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "DE", rating_board: "USK", target_rating: "MATURE_15", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_de: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_de}/scope"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_de}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "GET /translation-units?market_plan_id=${mp_de}&string_key_id=${k_hud}"
              payload: {}
              as: TranslationVendor
              captures: { u_hud: "$.data[0].id" }
            - call: "GET /translation-units?market_plan_id=${mp_de}&string_key_id=${k_menu}"
              payload: {}
              as: TranslationVendor
              captures: { u_menu: "$.data[0].id" }
          trigger:
            - call: "PUT /translation-units/${u_hud}"
              payload: { target_text: "Munitionsvorrat der aktuellen Waffe in Prozent angezeigt", target_char_count: 95, applied_tm_match_pct: 80 }
              as: TranslationVendor
              captures: { hud_overflow: "$.data.overflow_chars", hud_status: "$.data.translation_status" }
            - call: "PUT /translation-units/${u_menu}"
              payload: { target_text: "Spiel starten", target_char_count: 95, applied_tm_match_pct: 96 }
              as: TranslationVendor
              captures: { menu_overflow: "$.data.overflow_chars" }
          assert:
            - "TranslationUnit.${u_hud}.overflow_chars == 15 (95 - 80) and translation_status == DRAFTED"
            - "TranslationUnit.${u_menu}.overflow_chars == 0 (95 - 140 clamped at 0) even though target_char_count is identical"
            - "both units keep qa_status == NOT_CHECKED - the PUT touches only the translation axis"
            - "MarketPlan.${mp_de}.delivered_unit_count == 0 - drafting is not delivering"

      - name: qa_pass_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints[POST /qa-passes]
          - entities.QaPass.fields.pass_index
          - entities.QaPass.fields.opened_by_user_id
        distinguishing_aspect: "status, pass_index, opened_by_user_id, weighted_defect_points and defect_density are all source system/computed on QaPass; supplying hostile values for them in the body must change nothing - pass_index is still 1 and opened_by_user_id is still the X-User-ID header."
        test_recipe:
          setup:
            - "Title NOVA-37 with one key, JP plan driven to IN_LOCALIZATION so a QA pass may be opened."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-37", name: "Nova Drift 37", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "POST /qa-passes"
              payload: { market_plan_id: "${mp_jp}", pass_type: "LINGUISTIC", inspected_unit_count: 100, status: "CLOSED", pass_index: 99, opened_by_user_id: "somebody-else", weighted_defect_points: 500, defect_density: 9.9999, version: 42 }
              as: LqaTester
              as_user_id: "lqa-7"
              captures: { pass_id: "$.data.id", pass_index: "$.data.pass_index", opened_by: "$.data.opened_by_user_id" }
          assert:
            - "HTTP 201 - the extra system-field keys are ignored, not rejected"
            - "QaPass.${pass_id}.status == OPEN (not the supplied CLOSED) and pass_index == 1 (not 99)"
            - "QaPass.${pass_id}.opened_by_user_id == lqa-7 (the X-User-ID header, not the supplied somebody-else)"
            - "QaPass.${pass_id}.weighted_defect_points == 0, defect_density == 0.0000, reopen_count == 0, closed_at_utc == null, version == 1"

      - name: market_plan_create_with_invalid_enum_scope_tier_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.MarketPlan.fields.scope_tier
        distinguishing_aspect: "scope_tier is constrained to four literals; a plausible-but-undeclared value (DUBBED) must be rejected at priority 25 rather than stored verbatim or coerced to the nearest tier - a stored bad enum would silently corrupt SCOPE_MULTIPLIER lookups."
        test_recipe:
          setup:
            - "One Title so the FK resolves."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-38", name: "Nova Drift 38", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
          trigger:
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "TEEN_12", scope_tier: "DUBBED", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { enum_error: "$.data.error_id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "USK", target_rating: "TEEN_12", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { board_error: "$.data.error_id" }
          assert:
            - "the DUBBED request returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the JP+USK request also returns HTTP 400 with error_id == ERR_INVALID_REQUEST, because rating_board must equal MARKET_BOARD[JP] == CERO"
            - "Title.${title_id}.market_plan_count stays 0 after both refusals"

      - name: voice_session_with_end_before_start_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.VoiceSession.fields.start_utc
        distinguishing_aspect: "A numeric-range style constraint on a datetime pair: start_utc must be strictly before end_utc, and the check must fire at priority 25 before the booth-geometry rule at 62 ever computes a negative duration."
        test_recipe:
          setup:
            - "Title NOVA-39, DE FULL_VOICE plan at IN_LOCALIZATION, booth TOK-B, talent with a SIGNED DE contract."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-39", name: "Nova Drift 39", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "DE", rating_board: "USK", target_rating: "MATURE_15", scope_tier: "FULL_VOICE", cultural_adaptation_required: false, budget_cap_cents: 9000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_de: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_de}/scope"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_de}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "POST /booths"
              payload: { booth_code: "TOK-B", studio_city: "Tokyo", turnaround_buffer_minutes: 30 }
              as: LocalizationProducer
              captures: { booth_id: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Anke Roth", language_code: "DE", union_flag: true }
              as: LocalizationProducer
              captures: { talent_id: "$.data.id", talent_v: "$.data.version" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_id}", territory_scope: ["DE"], media_scope: "IN_GAME_AND_TRAILER", buyout_fee_cents: 500000, per_line_rate_cents: 250, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_v}" }
              as: LocalizationProducer
              captures: { contract_id: "$.data.id" }
            - call: "POST /talent-contracts/${contract_id}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
          trigger:
            - call: "POST /voice-sessions"
              payload: { market_plan_id: "${mp_de}", voice_talent_id: "${talent_id}", recording_booth_id: "${booth_id}", talent_contract_id: "${contract_id}", start_utc: "2026-09-10T12:00:00Z", end_utc: "2026-09-10T09:00:00Z", planned_line_count: 120 }
              as: LocalizationProducer
              captures: { range_error: "$.data.error_id" }
            - call: "POST /voice-sessions"
              payload: { market_plan_id: "${mp_de}", voice_talent_id: "${talent_id}", recording_booth_id: "${booth_id}", talent_contract_id: "${contract_id}", start_utc: "2026-09-10T22:00:00Z", end_utc: "2026-09-11T01:00:00Z", planned_line_count: 120 }
              as: LocalizationProducer
              captures: { spans_error: "$.data.error_id" }
          assert:
            - "the inverted-window request returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the 22:00-01:00 request returns HTTP 422 with error_id == ERR_SESSION_SPANS_TWO_DATES (priority 56), a different rule from the inverted range"
            - "RecordingBooth.${booth_id}.reserved_minutes_total == 0 after both refusals"
            - "GET /voice-sessions?market_plan_id=${mp_de} returns meta.total_count == 0"

      - name: string_key_create_with_unknown_title_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=32]
          - errors[ERR_TITLE_NOT_FOUND]
        distinguishing_aspect: "A body FK that does not resolve must produce the parent's own 404 at priority 32, distinct from the path-id check at 30, and must not create an orphan StringKey."
        test_recipe:
          setup:
            - "Empty database - not even the parent Title exists."
          setup_api_calls: []
          trigger:
            - call: "POST /string-keys"
              payload: { title_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { fk_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with error_id == ERR_TITLE_NOT_FOUND"
            - "GET /string-keys returns meta.total_count == 0 - no orphan row was written"

      - name: voice_session_contract_from_other_title_cross_parent_rejected
        claim_type: flat
        grounds:
          - validations[priority=34]
          - errors[ERR_CROSS_PARENT_MISMATCH]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology means coherence between two independently valid FKs must be checked explicitly: the contract exists and the market plan exists, but the contract's title_id belongs to a different Title, so the pair is incoherent (422 at priority 34) even though both 404 checks at 32 passed."
        test_recipe:
          setup:
            - "Two Titles. NOVA-40 carries the DE FULL_VOICE market plan at IN_LOCALIZATION; NOVA-41 carries the talent's SIGNED contract."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-40", name: "Nova Drift 40", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_a: "$.data.id" }
            - call: "POST /titles"
              payload: { title_code: "NOVA-41", name: "Nova Drift 41", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_b: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_a}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_a}", market_code: "DE", rating_board: "USK", target_rating: "MATURE_15", scope_tier: "FULL_VOICE", cultural_adaptation_required: false, budget_cap_cents: 9000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_de: "$.data.id" }
            - call: "POST /titles/${title_a}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_de}/scope"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_de}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "POST /booths"
              payload: { booth_code: "TOK-C", studio_city: "Tokyo", turnaround_buffer_minutes: 30 }
              as: LocalizationProducer
              captures: { booth_id: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Anke Roth", language_code: "DE", union_flag: true }
              as: LocalizationProducer
              captures: { talent_id: "$.data.id", talent_v: "$.data.version" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_id}", title_id: "${title_b}", territory_scope: ["DE"], media_scope: "ALL_MEDIA", buyout_fee_cents: 500000, per_line_rate_cents: 250, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_v}" }
              as: LocalizationProducer
              captures: { contract_b: "$.data.id" }
            - call: "POST /talent-contracts/${contract_b}/sign"
