      - name: dissemination_record_retry_cycle_to_dead
        grounds:
          - state_machines.DisseminationRecord.SENT_to_FAILED
          - state_machines.DisseminationRecord.QUEUED_to_SENT
          - entities.DisseminationRecord.fields.retry_count
        distinguishing_aspect: "DisseminationRecord has a genuine retry cycle SENT -> FAILED -> QUEUED -> SENT bounded by MAX_RETRIES = 3, ending in the terminal DEAD state — a cyclic machine on a different entity than Product."
        test_recipe:
          setup:
            - "Office, zone ZR (rect lat 0..0.1 lon 0..0.1), SEVERE storm wind 60, one WEA channel (supports WARNING, budget 360, requires_confirmation true). A WARNING polygon covering ZR is issued at 10:00, creating exactly one QUEUED record."
