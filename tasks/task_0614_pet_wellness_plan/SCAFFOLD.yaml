      - "compute_monthly_billing for due memberships"
      - "ContractTerm ACTIVE->RENEWAL_PENDING and RENEWAL_PENDING->EXPIRED+successor (cyclic renewal)"
      - "Grant fresh credits on successor terms"

  - method: POST
    path: "/wellness/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock."
    roles: [BillingAdmin, PlanAdmin]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects: ["ClockState.current_utc set to to_iso8601"]

