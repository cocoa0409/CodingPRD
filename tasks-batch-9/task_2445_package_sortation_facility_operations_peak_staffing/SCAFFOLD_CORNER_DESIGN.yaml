            - "DestinationLane.${lane_e_id}.sorted_package_count == 200 and DestinationLane.${lane_w_id}.sorted_package_count == 100"
            - "SortCenter.${center_id}.exception_hold_count == 0 and missort_corrected_count == 200"
            - "DestinationLane.${lane_e_id}.assigned_capacity_pph == 3000 (1200 + 1800)"

      - name: required_headcount_at_high_automation_tier_boundary
