            - call: "POST /tax/exemption-certificates"
              payload: { taxpayer_id: "${tp2_id}", exemption_type: "RESALE", certificate_number: "R-1", effective_date: "2025-01-01T00:00:00Z", expiry_date: "2025-06-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp2_id}"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp1_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", exemption_certificate_id: "${cert_id}", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
