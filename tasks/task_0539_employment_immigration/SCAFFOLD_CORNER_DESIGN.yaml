          - state_machines.PrevailingWageDetermination.PENDING_to_ISSUED
        distinguishing_aspect: "wage_source==EMPLOYER_SURVEY: on issuance prevailing_wage_cents==survey_wage_cents (12500000), NOT oes_wage_cents (10000000)."
        test_recipe:
          setup:
            - "A PENDING PWD with wage_source EMPLOYER_SURVEY, oes 10000000, survey 12500000."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "300000001", legal_name: "PW Co", employee_count: 10 }
