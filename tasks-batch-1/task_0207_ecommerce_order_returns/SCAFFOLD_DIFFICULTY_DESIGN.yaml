  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ship_cascades_reservation_commit_to_inventory_to_fulfillment_depth3
        grounds:
          - state_machines.Shipment.PENDING_to_SHIPPED
          - state_machines.Reservation.HELD_to_COMMITTED
          - entities.Reservation.fields.status
          - entities.InventoryItem.fields.on_hand_qty
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          POST /shipments/{id}/ship mutates Reservation→COMMITTED (link1); that commit itself decrements
          InventoryItem.on_hand_qty (link2); the decrement triggers available_qty recompute and OrderLine.shipped_qty,
          which bubbles up to re-derive Order.fulfillment_status=SHIPPED (link3) — a 3-hop chain where each hop is caused by the prior.
        test_recipe:
          setup:
            - "Captured single-line order (product unit 1000 qty 4) reserved at warehouse with on_hand 10; one PENDING shipment of qty4."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c4a@x.com", full_name: "C4A" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "W4A", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "S4A", title: "S4A", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 4 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
            - call: "GET /order-lines/${ol_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res_id}", qty: 4 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "GET /reservations/${res_id}"
              payload: {}
              as: StoreAdmin
              captures: { res_status: $.data.status }
            - call: "GET /inventory/${inv_id}"
              payload: {}
              as: StoreAdmin
              captures: { on_hand: $.data.on_hand_qty, avail: $.data.available_qty }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: StoreAdmin
              captures: { fulfil: $.data.fulfillment_status }
          assert:
            - "Reservation.${res_id}.status == COMMITTED  # link1"
            - "InventoryItem.${inv_id}.on_hand_qty == 6  # link2: 10 - 4 committed"
            - "InventoryItem.${inv_id}.available_qty == 6  # link2b: no remaining held reservation"
            - "Order.${ord_id}.fulfillment_status == SHIPPED  # link3 bubble-up"

      - name: settle_store_credit_cascades_refund_to_ledger_to_customer_balance_depth3
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_REFUNDED
          - entities.Refund.fields.amount_cents
