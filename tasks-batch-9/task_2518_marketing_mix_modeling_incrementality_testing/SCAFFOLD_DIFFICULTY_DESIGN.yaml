  - rule_id: cross_entity_state_dependency
    note: >-
      Two DIFFERENT entity pairs: ModelRun x DataWindow (fit gated on the training window's seal state) and BudgetScenario x Market (optimize gated on the market's derived data_posture).
    instances:
      - name: model_run_fit_requires_sealed_data_window
        grounds:
          - "state_machines ModelRun fit_status=PENDING -> FITTED, precondition: DataWindow.status == SEALED, else ERR_DATA_WINDOW_NOT_SEALED"
          - "state_machines ModelRun fit_status=STALE_FIT -> FITTED, carrying the same DataWindow precondition"
          - "state_machines DataWindow OPEN -> SEALED and SEALED -> REOPENED (with CASCADE HOP 1 driving FITTED runs to STALE_FIT)"
          - "validations priority 45 (state) - ERR_DATA_WINDOW_NOT_SEALED (409) on POST /mmm/model-runs/{id}/fit"
          - "calculations.model_run_aggregates and calculations.channel_contribution_decomposition for the pinned fit output"
          - "endpoints POST /mmm/model-runs/{id}/fit (200, Modeler) and POST /mmm/data-windows/{id}/reopen (200, DataEngineer)"
        distinguishing_aspect: |
          The entity pair under test is ModelRun x DataWindow: the same fit call on the same run flips
          409 -> 200 -> 409 purely because the OTHER entity moved OPEN -> SEALED -> REOPENED, and the
          run's own fit_status is a legal source state for fit at every one of the three attempts
          (PENDING, PENDING, STALE_FIT), so an implementation that gates fit only on the run's own
          dimension returns 200 on attempts 1 and 3.
          
