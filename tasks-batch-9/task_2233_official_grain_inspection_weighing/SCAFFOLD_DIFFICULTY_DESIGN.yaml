      - name: instrument_out_of_tolerance_cascades_analysis_portion_and_certificate_reversal
        mechanism: |
          A single comparison check whose deviation exceeds 0.50 walks Equipment -> ProteinAnalysis ->
          Sample -> Certificate -> Applicant: the instrument goes OUT_OF_TOLERANCE, every analysis it
          produced since the previous check is REJECTED_CALIBRATION, each rejection RETURNS the sample
          portion it consumed (so integrity_status falls back from CONSUMED to SEALED), any certificate
          carrying the rejected protein snapshot is VOIDED with its fee reversed, and the applicant
          ledger records the credit. The inspector's deviation counter also moves, on its own tighter
          threshold.
        distinguishing_aspect: "Every hop here is machine-triggered by a numeric tolerance rather than by a decision, and one hop moves a counter BACKWARDS (portion release), which the appeal sibling never does."
        entities_involved: [Equipment, ProteinAnalysis, Sample, Certificate, Applicant, Inspector, GradingResult]
        grounds:
          - "state_machines.Equipment.approval_status.APPROVED_to_OUT_OF_TOLERANCE"
          - "entities.ProteinAnalysis.fields.status"
          - "entities.Sample.fields.portions_available"
          - "calculations.applicant_balance_ledger"
          - "entities.Certificate.fields.protein_reported_pct_snapshot"
        test_recipe:
          setup:
            - "A DESIGNATED area with ACTIVE GRADING and PROTEIN fee schedules and an APPROVED PROTEIN_INSTRUMENT that has never been comparison-checked."
            - "A CORN request with GRADING and PROTEIN requested, a SEALED sample of 4 portions, an ACCEPTED protein analysis of 34.52 and a FINAL grading result."
            - "An ISSUED GRADE certificate for 34500 cents whose protein_reported_pct_snapshot comes from that analysis; the applicant ledger shows charges 34500 and open_balance 34500."
