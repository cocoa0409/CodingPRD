# =============================================================================
# PRD Benchmark Scaffold — task_0982_backyard_chicken_coop_service
# Backyard Chicken & Coop Service (§1.0–§1.7)
# =============================================================================

scenario: |
  982. Backyard Chicken & Coop Service: coop cleaning & flock health check,
  egg/feed & supply, vacation sitting & route, setup/install, predator-proofing,
  subscription, per-visit billing, seasonal

domain_name: backyard-chicken-coop-service
api_prefix: /coopcare

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # sitting engagements, tech schedules, seasonal windows, route stops
  secondary_archetype: pricing_engine          # per-visit billing, seasonal surcharges, subscription discounts
  complexity_layers:
    - optimistic_concurrency                   # OCC on Subscription.version and SittingRoute.version
    - cascading_side_effects                   # household-suspend cascade (depth 3), engagement-cancel cascade (depth 2)
    - dual_variant_calculation                 # provisional vs final visit price; quote vs settlement on sitting
    - scheduled_actions                        # pending plan change applied at renew-period; logical clock
  entity_topology: flat                        # peer entities joined by FK references; no URL nesting (except FK reverse reads)
  state_machine_shape: cyclic                  # ServiceVisit reschedule loop, Subscription ACTIVE<->PAUSED, Invoice ISSUED<->DISPUTED, SupplyOrder DRAFT->PLACED->DRAFT, SittingRoute PUBLISHED->PLANNED
  relationship_patterns:
    - one_to_many                              # HouseholdAccount -> Subscription/CoopSite/ServiceVisit/...
    - cross_aggregate                          # SupplyOrder.fulfillment_visit_id -> ServiceVisit; RouteStop -> SittingRoute x SittingEngagement
    - polymorphic                              # InvoiceLine.source_id references VISIT/SITTING/ORDER/SUBSCRIPTION_FEE/CANCELLATION_FEE/ADJUSTMENT sources
  role_model: peer_roles                       # Customer / ServiceTech / Dispatcher / BillingAdmin / PlatformAdmin own disjoint operations
  consistency_model: immediate                 # all mutations + cascades atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: HouseholdAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Household display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across households" }
      - { name: address, type: string, source: input, description: "Service street address" }
      - { name: zone_code, type: enum, source: input, description: "Service zone; drives zone pricing multiplier", constraints: "URBAN | SUBURBAN | RURAL" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: wallet_credit_cents, type: integer, source: system, description: "Prepaid credit balance; mutated only by wallet-adjustments, invoice issue (debit) and invoice void (refund)", default: 0 }

  - name: SubscriptionPlan
    parent: null
    common_fields: false
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique plan code (e.g. BASIC, PLUS)" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Subscription fee billed once per period via invoice SUBSCRIPTION_FEE line" }
      - { name: included_cleanings_per_period, type: integer, source: input, description: "COOP_CLEANING visits covered per period; coverage boundary uses strict less-than against used_cleanings" }
      - { name: included_health_checks_per_period, type: integer, source: input, description: "FLOCK_HEALTH_CHECK visits covered per period" }
      - { name: supply_discount_pct, type: number, source: input, description: "Fraction (0..1) discounted off SupplyOrder subtotal at place time" }
      - { name: sitting_discount_pct, type: number, source: input, description: "Fraction (0..1) discounted off sitting quotes and settlements" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> HouseholdAccount.id; owning household" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; currently active plan" }
      - { name: pending_plan_id, type: string, source: system, description: "FK -> SubscriptionPlan.id; scheduled plan change applied at next renew-period; null when none", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "ACTIVE | PAUSED | CANCELLED" }
      - { name: current_period_start, type: datetime, source: input, description: "Inclusive period start date (UTC midnight)" }
      - { name: current_period_end, type: datetime, source: computed, description: "Exclusive period end = current_period_start + 1 calendar month" }
      - { name: used_cleanings, type: integer, source: system, description: "Covered COOP_CLEANING reservations+completions this period; incremented at covered visit creation, decremented if that visit is CANCELLED/NO_SHOW before completion; reset by renew-period", default: 0 }
      - { name: used_health_checks, type: integer, source: system, description: "Same semantics for FLOCK_HEALTH_CHECK coverage", default: 0 }

  - name: CoopSite
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> HouseholdAccount.id; owning household" }
      - { name: site_label, type: string, source: input, description: "Human label for the coop (e.g. 'backyard north')" }
      - { name: coop_capacity_hens, type: integer, source: input, description: "Declared hen capacity; drives provisional flock tier fee" }
      - { name: predator_grade, type: enum, source: system, description: "Predator-proofing grade; upgraded by completed PREDATOR_PROOFING visits (NONE->B->A)", default: NONE, constraints: "NONE | B | A" }
      - { name: status, type: enum, source: system, description: "PLANNED until a SETUP_INSTALL visit completes, then INSTALLED", default: PLANNED, constraints: "PLANNED | INSTALLED" }

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> HouseholdAccount.id" }
      - { name: coop_site_id, type: string, source: input, description: "FK -> CoopSite.id; must belong to household_id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; set at creation when coverage resolves SUBSCRIPTION_COVERED, else null", default: null }
      - { name: visit_type, type: enum, source: input, description: "Service kind", constraints: "COOP_CLEANING | FLOCK_HEALTH_CHECK | PREDATOR_PROOFING | SETUP_INSTALL" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned window start; must be >= current logical clock time at creation" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned window end; must be > scheduled_start" }
      - { name: coverage, type: enum, source: computed, description: "Resolved at creation: SUBSCRIPTION_COVERED when an ACTIVE subscription covers this type and the used counter is strictly below the included count, else BILLABLE", constraints: "SUBSCRIPTION_COVERED | BILLABLE" }
      - { name: provisional_price_cents, type: integer, source: computed, description: "List-price quote computed at creation via visit_provisional_price (always computed, even when covered)" }
      - { name: final_price_cents, type: integer, source: computed, description: "Set at completion via visit_final_price; null until COMPLETED", default: null }
      - { name: assigned_technician_id, type: string, source: system, description: "Opaque technician identifier set by assign; not entity-backed", default: null }
      - { name: reschedule_count, type: integer, source: system, description: "Number of completed request-reschedule cycles; request-reschedule rejected when >= 2", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: REQUESTED, constraints: "REQUESTED | SCHEDULED | RESCHEDULE_REQUESTED | ON_SITE | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: billed_invoice_id, type: string, source: system, description: "Invoice this visit was swept into; null until billed; cleared when that invoice is voided", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock time of completion; null until COMPLETED", default: null }

  - name: SittingEngagement
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> HouseholdAccount.id" }
      - { name: coop_site_id, type: string, source: input, description: "FK -> CoopSite.id; must belong to household_id" }
      - { name: start_date, type: datetime, source: input, description: "First sitting date (UTC midnight); closed-interval occupancy start" }
      - { name: end_date, type: datetime, source: input, description: "Last sitting date (UTC midnight, inclusive for overlap); nights = end_date - start_date in days; must be 1..30 nights" }
      - { name: daily_window_start, type: string, source: input, description: "HH:MM UTC start of each daily 60-minute sitting stop window" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: REQUESTED, constraints: "REQUESTED | QUOTED | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Forward-looking quote set by quote action (sitting_quote_price); null until QUOTED", default: null }
      - { name: final_price_cents, type: integer, source: computed, description: "Chronological settlement set by settle action (sitting_final_settlement); null until COMPLETED", default: null }
      - { name: cancellation_fee_cents, type: integer, source: system, description: "Fee charged on cancel from CONFIRMED per sitting_cancellation_fee; 0 otherwise", default: 0 }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical clock time of cancellation; null until CANCELLED", default: null }
      - { name: settled_at, type: datetime, source: system, description: "Logical clock time of settlement; null until COMPLETED", default: null }
      - { name: billed_invoice_id, type: string, source: system, description: "Invoice this engagement (settlement or cancellation fee) was swept into; null until billed; cleared on void", default: null }

  - name: SittingRoute
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "Opaque technician identifier who runs this route; not entity-backed" }
      - { name: route_date, type: datetime, source: input, description: "Service date of the route (UTC midnight)" }
      - { name: zone_code, type: enum, source: input, description: "Zone this route serves", constraints: "URBAN | SUBURBAN | RURAL" }
      - { name: max_stops, type: integer, source: input, description: "Capacity: stop creation rejected when committed_stops >= max_stops" }
      - { name: committed_stops, type: integer, source: computed, description: "Count of RouteStops on this route with status IN {PENDING, DONE}; SKIPPED/REMOVED excluded", default: 0 }
      - { name: status, type: enum, source: system, description: "PLANNED | PUBLISHED | CANCELLED; PUBLISHED auto-demotes to PLANNED when a stop removal leaves committed_stops == 0", default: PLANNED, constraints: "PLANNED | PUBLISHED | CANCELLED" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> SittingRoute.id; owning route" }
      - { name: engagement_id, type: string, source: input, description: "FK -> SittingEngagement.id; sitting engagement served" }
      - { name: planned_start, type: datetime, source: input, description: "Planned stop window start" }
      - { name: planned_end, type: datetime, source: input, description: "Planned stop window end; must be > planned_start" }
      - { name: sequence, type: integer, source: system, description: "1-based stop order = committed_stops at insertion time + 1" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: PENDING, constraints: "PENDING | DONE | SKIPPED | REMOVED" }
      - { name: skip_reason, type: string, source: system, description: "Reason recorded on skip; null otherwise", default: null }

  - name: Product
    parent: null
    common_fields: false
    fields:
      - { name: sku, type: string, source: input, description: "Unique catalog SKU (e.g. FEED-LAYER-50)" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "Catalog category", constraints: "FEED | BEDDING | EGG_SUPPLIES | HEALTH" }
      - { name: unit_price_cents, type: integer, source: input, description: "List unit price in cents; snapshotted onto order lines at add time" }
      - { name: active, type: boolean, source: input, description: "Inactive products cannot be added to orders", default: true }

  - name: SupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> HouseholdAccount.id" }
      - { name: fulfillment_visit_id, type: string, source: input, description: "FK -> ServiceVisit.id; optional delivery visit; must belong to same household and be SCHEDULED at place time", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DRAFT, constraints: "DRAFT | PLACED | FULFILLED" }
      - { name: lines, type: array, source: system, description: "Embedded line items: array of { product_sku, quantity, unit_price_cents, line_total_cents }; line_total_cents = unit_price_cents * quantity (integer cents, no rounding)", default: [] }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_total_cents over lines", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * plan.supply_discount_pct) computed once on the subtotal at place time (NOT per line); 0 without an ACTIVE subscription", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents, frozen at place time", default: 0 }
      - { name: placed_at, type: datetime, source: system, description: "Logical clock time of placement; null until PLACED", default: null }
      - { name: billed_invoice_id, type: string, source: system, description: "Invoice this order was swept into; null until billed; cleared on void", default: null }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> HouseholdAccount.id" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive billing period start (UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive billing period end (UTC); must be > period_start" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DRAFT, constraints: "DRAFT | ISSUED | DISPUTED | PAID | VOID" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of InvoiceLine.amount_cents (each line already integer cents; invoice never re-rounds lines)", default: 0 }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * TAX_RATE) computed once on the subtotal", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents", default: 0 }
      - { name: credit_applied_cents, type: integer, source: system, description: "Wallet credit applied at issue time = min(household.wallet_credit_cents, total_cents); frozen through disputes; refunded and zeroed on void", default: 0 }
      - { name: amount_due_cents, type: integer, source: computed, description: "total_cents - credit_applied_cents", default: 0 }
      - { name: due_date, type: datetime, source: system, description: "Set at issue = logical clock date + 14 days; null until ISSUED", default: null }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time of first issue; null until ISSUED", default: null }

  - name: InvoiceLine
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; owning invoice" }
      - { name: source_type, type: enum, source: system, description: "Which source produced this line", constraints: "VISIT | SITTING | ORDER | SUBSCRIPTION_FEE | CANCELLATION_FEE | ADJUSTMENT" }
      - { name: source_id, type: string, source: system, description: "Polymorphic source reference: id of the ServiceVisit / SittingEngagement / SupplyOrder / Subscription / SittingEngagement(cancellation) / or the string 'ADJUSTMENT' for dispute adjustments; NOT a single-entity foreign key" }
      - { name: description, type: string, source: system, description: "Human-readable line description" }
      - { name: amount_cents, type: integer, source: system, description: "Line amount in integer cents (signed; ADJUSTMENT lines may be negative)" }

  - name: SeasonalWindow
    parent: null
    common_fields: false
    fields:
      - { name: window_code, type: string, source: input, description: "Unique window code (e.g. WINTER_PEAK)" }
      - { name: zone_code, type: enum, source: input, description: "Zone this window applies to", constraints: "URBAN | SUBURBAN | RURAL" }
      - { name: start_md, type: string, source: input, description: "Inclusive start as MM-DD; when start_md > end_md the window wraps across the year boundary" }
      - { name: end_md, type: string, source: input, description: "Inclusive end as MM-DD" }
      - { name: visit_surcharge_pct, type: number, source: input, description: "Fraction (0..1) surcharge applied multiplicatively to the visit base component for visits whose relevant date falls in this window" }
      - { name: sitting_surcharge_pct, type: number, source: input, description: "Fraction (0..1) surcharge applied to sitting daily rates for stop/quote dates in this window" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HouseholdAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /coopcare/households/{id}/suspend"
        actor: BillingAdmin
        preconditions:
          - "household.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
        side_effects:
          - "CASCADE link 1: household's Subscription with status == ACTIVE -> PAUSED"
          - "CASCADE link 2 (caused by the PAUSED transition): that subscription's covered ServiceVisits (coverage == SUBSCRIPTION_COVERED AND status IN {REQUESTED, SCHEDULED, RESCHEDULE_REQUESTED}) -> CANCELLED; each cancellation decrements the subscription's used_cleanings/used_health_checks reservation"
          - "CASCADE link 3 (caused by each visit CANCELLED transition): SupplyOrder with fulfillment_visit_id == visit.id AND status == PLACED -> DRAFT and fulfillment_visit_id cleared to null"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /coopcare/households/{id}/reinstate"
        actor: BillingAdmin
        preconditions:
          - "household.status == SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "No automatic resume: the Subscription stays PAUSED (explicit resume required); cancelled visits and reverted orders are NOT restored"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /coopcare/subscriptions/{id}/pause OR system (household suspension cascade)"
        actor: Customer | PlatformAdmin | system
        preconditions:
          - "subscription.status == ACTIVE (else ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "Covered ServiceVisits of this subscription (coverage == SUBSCRIPTION_COVERED AND status IN {REQUESTED, SCHEDULED, RESCHEDULE_REQUESTED}) -> CANCELLED; used_cleanings/used_health_checks decremented per cancelled reservation"
          - "Each such visit cancellation reverts linked PLACED SupplyOrders to DRAFT and clears fulfillment_visit_id"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /coopcare/subscriptions/{id}/resume"
        actor: Customer | PlatformAdmin
        preconditions:
          - "subscription.status == PAUSED (else ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "household.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
        side_effects: []
      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /coopcare/subscriptions/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions:
          - "subscription.status IN {ACTIVE, PAUSED} (else ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "Same covered-visit cancellation + order reversion side effects as pause"
          - "pending_plan_id cleared to null"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /coopcare/subscriptions/{id}/renew-period"
        actor: BillingAdmin
        preconditions:
          - "subscription.status == ACTIVE (else ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "logical clock date >= current_period_end (else ERR_PERIOD_NOT_ENDED)"
        side_effects:
          - "If pending_plan_id is set: plan_id = pending_plan_id, pending_plan_id = null (scheduled plan change lands)"
          - "used_cleanings = 0; used_health_checks = 0"
          - "current_period_start = old current_period_end; current_period_end = new start + 1 calendar month"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /coopcare/subscriptions/{id}/plan-changes"
        actor: Customer | PlatformAdmin
        preconditions:
          - "subscription.status == ACTIVE (else ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "expected_subscription_version == subscription.version (else ERR_STALE_VERSION, 412)"
        side_effects:
          - "pending_plan_id = new_plan_id (a new pending change legitimately supersedes any prior pending change)"
          - "increments Subscription.version by 1"

  - entity: CoopSite
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: INSTALLED
        trigger: "system (SETUP_INSTALL ServiceVisit completes)"
        actor: system
        preconditions:
          - "completing visit.visit_type == SETUP_INSTALL AND visit.coop_site_id == this coop"
        side_effects: []
      - from: INSTALLED
        to: INSTALLED
        trigger: "system (PREDATOR_PROOFING ServiceVisit completes: predator_grade NONE->B, B->A, A->A)"
        actor: system
        preconditions:
          - "completing visit.visit_type == PREDATOR_PROOFING AND visit.coop_site_id == this coop"
        side_effects: []

  - entity: ServiceVisit
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: [REQUESTED, RESCHEDULE_REQUESTED]
        to: SCHEDULED
        trigger: "POST /coopcare/service-visits/{id}/assign"
        actor: Dispatcher
        preconditions:
          - "visit.status IN {REQUESTED, RESCHEDULE_REQUESTED} (else ERR_VISIT_NOT_ASSIGNABLE)"
          - "30-minute buffered window does not collide with another SCHEDULED/ON_SITE visit of the same technician (else ERR_TECH_SCHEDULE_CONFLICT)"
        side_effects:
          - "assigned_technician_id = technician_id; scheduled window replaced when scheduled_start/scheduled_end overrides supplied"
      - from: SCHEDULED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /coopcare/service-visits/{id}/request-reschedule"
        actor: Customer
        preconditions:
          - "visit.status == SCHEDULED (else ERR_VISIT_NOT_SCHEDULED)"
          - "visit.reschedule_count < 2 (else ERR_RESCHEDULE_LIMIT_REACHED)"
        side_effects:
          - "reschedule_count += 1"
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /coopcare/service-visits/{id}/check-in"
        actor: ServiceTech
        preconditions:
          - "visit.status == SCHEDULED (else ERR_VISIT_NOT_SCHEDULED)"
          - "caller X-User-ID == visit.assigned_technician_id (else ERR_NOT_ASSIGNED_TECH)"
          - "household.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
        side_effects: []
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /coopcare/service-visits/{id}/complete"
        actor: ServiceTech
        preconditions:
          - "visit.status == ON_SITE (else ERR_VISIT_NOT_ON_SITE)"
          - "caller X-User-ID == visit.assigned_technician_id (else ERR_NOT_ASSIGNED_TECH)"
        side_effects:
          - "final_price_cents computed via visit_final_price; completed_at = logical clock"
          - "visit_type == SETUP_INSTALL -> CoopSite.status PLANNED -> INSTALLED"
          - "visit_type == PREDATOR_PROOFING -> CoopSite.predator_grade upgraded NONE->B / B->A / A->A"
          - "SupplyOrder with fulfillment_visit_id == visit.id AND status == PLACED -> FULFILLED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /coopcare/service-visits/{id}/mark-no-show"
        actor: ServiceTech
        preconditions:
          - "visit.status == SCHEDULED (else ERR_VISIT_NOT_SCHEDULED)"
          - "caller X-User-ID == visit.assigned_technician_id (else ERR_NOT_ASSIGNED_TECH)"
        side_effects:
          - "If coverage == SUBSCRIPTION_COVERED: subscription used counter for this visit type decremented (reservation released); no charge"
      - from: [REQUESTED, SCHEDULED, RESCHEDULE_REQUESTED]
        to: CANCELLED
        trigger: "POST /coopcare/service-visits/{id}/cancel OR system (subscription pause/cancel cascade)"
        actor: Customer | Dispatcher | system
        preconditions:
          - "visit.status IN {REQUESTED, SCHEDULED, RESCHEDULE_REQUESTED} (else ERR_VISIT_NOT_CANCELLABLE)"
        side_effects:
          - "If coverage == SUBSCRIPTION_COVERED: subscription used counter for this visit type decremented (reservation released)"
          - "SupplyOrder with fulfillment_visit_id == visit.id AND status == PLACED -> DRAFT and fulfillment_visit_id cleared to null"

  - entity: SittingEngagement
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /coopcare/sitting-engagements/{id}/quote"
        actor: Dispatcher
        preconditions:
          - "engagement.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "quoted_price_cents computed via sitting_quote_price"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /coopcare/sitting-engagements/{id}/confirm"
        actor: Customer | PlatformAdmin
        preconditions:
          - "engagement.status == QUOTED (else ERR_ENGAGEMENT_NOT_QUOTED)"
          - "coop_site.status == INSTALLED (else ERR_COOP_NOT_INSTALLED)"
          - "coop_site.predator_grade IN {B, A} (else ERR_PREDATOR_GRADE_INSUFFICIENT)"
          - "no closed-interval date overlap with another non-CANCELLED engagement of the same household (else ERR_ENGAGEMENT_DATE_OVERLAP)"
          - "route_assignment_selector finds an eligible route for every stop date (else ERR_NO_ROUTE_AVAILABLE; confirm is atomic - no stops created on failure)"
        side_effects:
          - "Creates one PENDING RouteStop per date d with start_date <= d < end_date on the selected route: planned window = d at daily_window_start for 60 minutes; each created stop increments its route's committed_stops and SittingRoute.version by 1"
      - from: [REQUESTED, QUOTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /coopcare/sitting-engagements/{id}/cancel"
        actor: Customer | Dispatcher
        preconditions:
          - "engagement.status IN {REQUESTED, QUOTED, CONFIRMED} (else ERR_ENGAGEMENT_NOT_CANCELLABLE)"
        side_effects:
          - "From CONFIRMED: cancellation_fee_cents computed via sitting_cancellation_fee (from REQUESTED/QUOTED: 0); cancelled_at = logical clock"
          - "CASCADE link 1 (caused by this CANCELLED transition): RouteStops of this engagement with status == PENDING -> REMOVED"
          - "CASCADE link 2 (caused by each stop's REMOVED transition): owning SittingRoute.committed_stops decremented and version incremented; if committed_stops becomes 0 and route status == PUBLISHED -> route auto-demoted to PLANNED"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /coopcare/sitting-engagements/{id}/settle"
        actor: BillingAdmin
        preconditions:
          - "engagement.status == CONFIRMED (else ERR_ENGAGEMENT_NOT_CONFIRMED)"
          - "every RouteStop of this engagement is terminal (status IN {DONE, SKIPPED, REMOVED}) (else ERR_STOPS_OUTSTANDING)"
        side_effects:
          - "final_price_cents computed via sitting_final_settlement; settled_at = logical clock"

  - entity: SittingRoute
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: PUBLISHED
        trigger: "POST /coopcare/sitting-routes/{id}/publish"
        actor: Dispatcher
        preconditions:
          - "route.status == PLANNED (else ERR_ROUTE_NOT_PLANNED)"
        side_effects: []
      - from: PUBLISHED
        to: PLANNED
        trigger: "system (auto-demotion: a stop removal leaves committed_stops == 0)"
        actor: system
        preconditions:
          - "a RouteStop transitioned to REMOVED and route.committed_stops == 0"
        side_effects: []
      - from: [PLANNED, PUBLISHED]
        to: CANCELLED
        trigger: "POST /coopcare/sitting-routes/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "route.status IN {PLANNED, PUBLISHED} (else ERR_ROUTE_NOT_PUBLISHED)"
          - "route.committed_stops == 0 (else ERR_ROUTE_NOT_EMPTY)"
        side_effects: []

  - entity: RouteStop
    initial_state: PENDING
    terminal_states: [DONE, SKIPPED, REMOVED]
    transitions:
      - from: PENDING
        to: DONE
        trigger: "POST /coopcare/route-stops/{id}/complete"
        actor: ServiceTech
        preconditions:
          - "stop.status == PENDING (else ERR_STOP_NOT_PENDING)"
          - "caller X-User-ID == route.technician_id (else ERR_NOT_ASSIGNED_TECH)"
        side_effects: []
      - from: PENDING
        to: SKIPPED
        trigger: "POST /coopcare/route-stops/{id}/skip"
        actor: ServiceTech
        preconditions:
          - "stop.status == PENDING (else ERR_STOP_NOT_PENDING)"
          - "caller X-User-ID == route.technician_id (else ERR_NOT_ASSIGNED_TECH)"
        side_effects:
          - "skip_reason recorded; committed_stops unchanged (SKIPPED excluded from committed count)"
      - from: PENDING
        to: REMOVED
        trigger: "system (engagement cancellation cascade)"
        actor: system
        preconditions:
          - "owning SittingEngagement transitioned to CANCELLED"
        side_effects:
          - "owning SittingRoute.committed_stops -= 1; route.version += 1; auto-demote route to PLANNED when committed_stops reaches 0"

  - entity: SupplyOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /coopcare/supply-orders/{id}/place"
        actor: Customer | PlatformAdmin
        preconditions:
          - "order.status == DRAFT (else ERR_ORDER_NOT_DRAFT)"
          - "household.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
          - "order.lines non-empty (else ERR_ORDER_EMPTY)"
          - "fulfillment_visit_id, when set, references a visit of the same household with status == SCHEDULED (else ERR_FULFILLMENT_VISIT_INVALID)"
          - "total_cents <= household.wallet_credit_cents + CREDIT_LIMIT (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "subtotal_cents, discount_cents, total_cents computed and frozen; placed_at = logical clock"
      - from: PLACED
        to: FULFILLED
        trigger: "system (fulfillment ServiceVisit completes)"
        actor: system
        preconditions:
          - "completing visit.id == order.fulfillment_visit_id"
        side_effects: []
      - from: PLACED
        to: DRAFT
        trigger: "system (fulfillment ServiceVisit cancelled)"
        actor: system
        preconditions:
          - "cancelled visit.id == order.fulfillment_visit_id"
        side_effects:
          - "fulfillment_visit_id cleared to null; subtotal/discount/total remain frozen from the original placement"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /coopcare/invoices/{id}/issue"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == DRAFT (else ERR_INVOICE_NOT_DRAFT)"
        side_effects:
          - "credit_applied_cents = min(household.wallet_credit_cents, total_cents); household.wallet_credit_cents -= credit_applied_cents"
          - "amount_due_cents = total_cents - credit_applied_cents; due_date = logical clock date + 14 days; issued_at = logical clock"
      - from: ISSUED
        to: PAID
        trigger: "POST /coopcare/invoices/{id}/mark-paid"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == ISSUED (else ERR_INVOICE_NOT_ISSUED)"
        side_effects: []
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /coopcare/invoices/{id}/dispute"
        actor: Customer
        preconditions:
          - "invoice.status == ISSUED (else ERR_INVOICE_NOT_ISSUED)"
          - "caller owns invoice.household_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /coopcare/invoices/{id}/resolve-dispute"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == DISPUTED (else ERR_INVOICE_NOT_DISPUTED)"
          - "adjustment_amount_cents != 0 and resulting total_cents >= 0 (else ERR_INVALID_ADJUSTMENT)"
        side_effects:
          - "Adds an ADJUSTMENT InvoiceLine with amount_cents = adjustment_amount_cents"
          - "Recomputes subtotal_cents, tax_cents, total_cents via invoice_total_composition; credit_applied_cents stays frozen; amount_due_cents = total_cents - credit_applied_cents"
      - from: ISSUED
        to: VOID
        trigger: "POST /coopcare/invoices/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == ISSUED (else ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "household.wallet_credit_cents += credit_applied_cents (compensation); credit_applied_cents = 0; amount_due_cents = total_cents"
          - "Every swept source's billed_invoice_id cleared to null (visit/engagement/order become re-billable)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-plan-change-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /coopcare/subscriptions/{id}/plan-changes"
    occ_field: expected_subscription_version
    description: |
      Creating a plan change against a Subscription whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just posted a plan change (which legitimately supersedes
      the prior pending change under the Subscription state machine) and the
      current writer's view of the subscription is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: route-stop-add-stale-version
    parent_entity: SittingRoute
    write_endpoint: "POST /coopcare/sitting-routes/{id}/stops"
    occ_field: expected_route_version
    description: |
      Adding a RouteStop to a SittingRoute whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just added a stop (a legitimate mutation under the route's
      capacity rules) and the current writer's view of the route is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: seasonal_surcharge_lookup
    trigger: "referenced by visit_provisional_price, visit_final_price, sitting_quote_price, sitting_final_settlement"
    algorithm: threshold
    formula: |
      For zone Z and date D, let md(D) be D's MM-DD string.
      Candidate windows: SeasonalWindow where zone_code == Z.
      Window coverage: if start_md <= end_md, covers md when start_md <= md <= end_md;
      if start_md > end_md (wrap), covers md when md >= start_md OR md <= end_md.
      Both bounds inclusive.
      SeasonalWindow creation validation guarantees at most one window covers any
      calendar day for a zone, so the candidate set has size 0 or 1.
      Return the covering window, or null.
    input_set: "SeasonalWindow rows for the household/route zone"
    constants: {}
    precision: "date granularity, inclusive MM-DD bounds"

  - name: visit_provisional_price
    trigger: "ServiceVisit creation"
    algorithm: tiered_pricing
    formula: |
      zone_mult = ZONE_MULT[household.zone_code]
      w = seasonal_surcharge_lookup(household.zone_code, date(scheduled_start))
      seasonal_pct = w ? w.visit_surcharge_pct : 0
      base_component = round_half_up(BASE_RATE[visit_type] * zone_mult * (1 + seasonal_pct))
      flock_fee = FLOCK_TIER_FEE(coop.coop_capacity_hens)
      provisional_price_cents = base_component + flock_fee
      where FLOCK_TIER_FEE(n) =
        0                        if n <= 6
        1500                     if 7 <= n <= 12
        3000                     if 13 <= n <= 20
        3000 + 250 * (n - 20)    if n > 20
      Computed regardless of coverage; coverage only decides whether an invoice
      line is later produced (covered visits never produce VISIT lines).
    input_set: "the created ServiceVisit, its HouseholdAccount, its CoopSite, SeasonalWindow of the zone"
    constants:
      BASE_RATE_COOP_CLEANING: 8000
      BASE_RATE_FLOCK_HEALTH_CHECK: 6000
      BASE_RATE_PREDATOR_PROOFING: 12000
      BASE_RATE_SETUP_INSTALL: 25000
      ZONE_MULT_URBAN: 1.0
      ZONE_MULT_SUBURBAN: 1.15
      ZONE_MULT_RURAL: 1.30
    precision: "integer cents; round_half_up applied once to base_component"
    variants:
      - name: provisional
        when: "at creation; uses scheduled_start date and declared coop_capacity_hens"
        difference: "no overtime component; seasonal window evaluated on scheduled date"

  - name: visit_final_price
    trigger: "ServiceVisit completion (ON_SITE -> COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      zone_mult = ZONE_MULT[household.zone_code]
      w = seasonal_surcharge_lookup(household.zone_code, date(completed_at))
      seasonal_pct = w ? w.visit_surcharge_pct : 0
      base_component = round_half_up(BASE_RATE[visit_type] * zone_mult * (1 + seasonal_pct))
      flock_fee = FLOCK_TIER_FEE(observed_flock_size)   # observed, NOT declared capacity
      overtime_minutes = max(0, actual_duration_minutes - STANDARD_DURATION[visit_type])
      overtime_blocks = ceil(overtime_minutes / 15)     # each STARTED 15-minute block bills
      overtime_fee = overtime_blocks * 700
      final_price_cents = base_component + flock_fee + overtime_fee
    input_set: "the completing ServiceVisit (observed_flock_size, actual_duration_minutes from completion payload), its HouseholdAccount, SeasonalWindow of the zone at completion date"
    constants:
      STANDARD_DURATION_COOP_CLEANING: 60
      STANDARD_DURATION_FLOCK_HEALTH_CHECK: 45
      STANDARD_DURATION_PREDATOR_PROOFING: 90
      STANDARD_DURATION_SETUP_INSTALL: 180
      OVERTIME_BLOCK_MINUTES: 15
      OVERTIME_BLOCK_FEE_CENTS: 700
    precision: "integer cents; round_half_up once on base_component"
    variants:
      - name: final
        when: "at completion; uses completed_at date and observed_flock_size, plus overtime"
        difference: "identical scheduled inputs can yield final != provisional when completion date falls inside a different seasonal window or observed flock tier differs"

  - name: sitting_quote_price
    trigger: "SittingEngagement quote (REQUESTED -> QUOTED)"
    algorithm: forward_looking
    formula: |
      nights = (end_date - start_date) in whole days
      w = seasonal_surcharge_lookup(household.zone_code, start_date)
      sitting_pct = w ? w.sitting_surcharge_pct : 0
      discount_pct = household has Subscription with status == ACTIVE ? plan.sitting_discount_pct : 0
      quoted_price_cents = round_half_up(nights * DAILY_RATE * (1 + sitting_pct) * (1 - discount_pct))
      Forward-looking: assumes every planned stop will be DONE.
    input_set: "the engagement, household's ACTIVE subscription plan (if any), SeasonalWindow at start_date"
    constants:
      DAILY_RATE_CENTS: 5000
    precision: "integer cents; round_half_up once"
    variants:
      - name: quote
        when: "at quote time; prices all nights as if served"
        difference: "uses start_date window and planned night count"

  - name: sitting_final_settlement
    trigger: "SittingEngagement settle (CONFIRMED -> COMPLETED)"
    algorithm: chronological
    formula: |
      Process this engagement's RouteStops in chronological order
      (planned_start ASC; tie-break created_at ASC), running accumulator:
      for each stop with status == DONE:
          w = seasonal_surcharge_lookup(route.zone_code, date(stop.planned_start))
          day_rate = round_half_up(DAILY_RATE * (1 + (w ? w.sitting_surcharge_pct : 0)))
          acc += day_rate
      SKIPPED and REMOVED stops contribute 0.
      discount_pct = household has Subscription with status == ACTIVE ? plan.sitting_discount_pct : 0
      final_price_cents = round_half_up(acc * (1 - discount_pct))
    input_set: "RouteStops of the engagement (DONE only contribute), household's ACTIVE subscription plan, SeasonalWindows per stop date"
    constants:
      DAILY_RATE_CENTS: 5000
    precision: "integer cents; per-day rate rounded round_half_up before summing; discount applied once to the sum"
    variants:
      - name: settlement
        when: "at settle time; replays actual stop outcomes"
        difference: "identical engagement yields settlement < quote whenever any stop is SKIPPED/REMOVED; per-day window evaluated per stop date"

  - name: sitting_cancellation_fee
    trigger: "SittingEngagement cancel from CONFIRMED"
    algorithm: threshold
    formula: |
      notice_hours = (start_date - current logical clock time) in hours (fractional allowed)
      if notice_hours >= 72: fee = 0
      elif notice_hours >= 24: fee = round_half_up(quoted_price_cents * 0.25)
      else: fee = round_half_up(quoted_price_cents * 0.50)
      Boundary: exactly 72.0 hours -> 0; exactly 24.0 hours -> 25% tier.
      From REQUESTED/QUOTED: fee = 0 regardless of notice.
    input_set: "the engagement (quoted_price_cents, start_date), logical clock"
    constants:
      FREE_NOTICE_HOURS: 72
      REDUCED_NOTICE_HOURS: 24
      REDUCED_FEE_PCT: 0.25
      LATE_FEE_PCT: 0.50
    precision: "integer cents; round_half_up"

  - name: subscription_coverage_resolution
    trigger: "ServiceVisit creation"
    algorithm: threshold
    formula: |
      s = household's Subscription with status == ACTIVE (at most one exists per ERR_SUBSCRIPTION_ALREADY_EXISTS)
      if no s OR visit_type IN {PREDATOR_PROOFING, SETUP_INSTALL}: coverage = BILLABLE
      elif date(scheduled_start) NOT IN [current_period_start, current_period_end): coverage = BILLABLE
      elif visit_type == COOP_CLEANING:
          coverage = SUBSCRIPTION_COVERED if s.used_cleanings < plan.included_cleanings_per_period else BILLABLE
      elif visit_type == FLOCK_HEALTH_CHECK:
          coverage = SUBSCRIPTION_COVERED if s.used_health_checks < plan.included_health_checks_per_period else BILLABLE
      Boundary is strict less-than: used == included -> BILLABLE.
      On SUBSCRIPTION_COVERED: subscription_id set, the used counter incremented immediately
      (reservation); released (decremented) if the visit is CANCELLED or NO_SHOW before completion.
    input_set: "household's ACTIVE subscription + plan, visit type, scheduled_start"
    constants: {}
    precision: "integer counters"

  - name: route_assignment_selector
    trigger: "SittingEngagement confirm (per stop date); also governs manual stop creation capacity/overlap checks"
    algorithm: constraint_propagation
    formula: |
      For stop date D with planned window [WS, WE) (WE = WS + 60 minutes):
      Eligibility filter: SittingRoute where route_date == D AND zone_code == household.zone_code
        AND status == PUBLISHED AND committed_stops < max_stops
        AND no PENDING/DONE stop on that route has a buffered conflict with [WS, WE).
      Buffered conflict between new [WS, WE) and existing [S, E):
        conflict iff NOT (WS >= E + 30 minutes OR WE <= S - 30 minutes).
        Touching at exactly E + 30 minutes is allowed; one minute earlier conflicts.
      Ranking: committed_stops ASC; tie-break route.created_at ASC.
      Empty candidate set for ANY stop date -> whole confirm rejected ERR_NO_ROUTE_AVAILABLE
      (atomic: no stops created, engagement stays QUOTED).
    input_set: "all SittingRoutes matching date+zone, their non-terminal stops"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
      STOP_DURATION_MINUTES: 60
    precision: "minute granularity, half-open windows with buffer expansion"

  - name: technician_schedule_conflict
    trigger: "ServiceVisit assign"
    algorithm: interval_merge
    formula: |
      Technician T's occupied set: ServiceVisits with assigned_technician_id == T
        AND status IN {SCHEDULED, ON_SITE}.
      New window [WS, WE) conflicts with existing [S, E) iff
        NOT (WS >= E + 30 minutes OR WE <= S - 30 minutes).
      On conflict -> ERR_TECH_SCHEDULE_CONFLICT.
    input_set: "SCHEDULED/ON_SITE visits of the technician"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "minute granularity, half-open windows with buffer"

  - name: engagement_date_overlap
    trigger: "SittingEngagement confirm"
    algorithm: interval_merge
    formula: |
      Existing engagements of the same household with status != CANCELLED occupy the
      CLOSED date interval [start_date, end_date] (both bounds inclusive).
      New engagement [NS, NE] overlaps iff NS <= existing.end_date AND NE >= existing.start_date.
      Consequence: NS == existing.end_date + 1 day is allowed (back-to-back);
      NS == existing.end_date overlaps and is rejected (ERR_ENGAGEMENT_DATE_OVERLAP).
    input_set: "non-CANCELLED engagements of the household"
    constants: {}
    precision: "whole-day granularity, closed intervals"

  - name: supply_order_totals
    trigger: "SupplyOrder place"
    algorithm: aggregation
    formula: |
      line_total_cents = unit_price_cents * quantity   (integer cents, per line, at add time)
      subtotal_cents = sum(line_total_cents over lines)
      discount_pct = household has Subscription with status == ACTIVE ? plan.supply_discount_pct : 0
      discount_cents = round_half_up(subtotal_cents * discount_pct)   # single rounding on the SUBTOTAL, never per line
      total_cents = subtotal_cents - discount_cents
    input_set: "order lines, household's ACTIVE subscription plan"
    constants: {}
    precision: "integer cents; one round_half_up on the subtotal-level discount"

  - name: invoice_total_composition
    trigger: "Invoice generate; resolve-dispute recompute"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned (lines -> subtotal -> tax -> total -> credit cap -> amount due):
      1. Each InvoiceLine.amount_cents is integer cents at creation (per-line rounding happens
         at the SOURCE: visit final price, order total, quote/settlement, fee). The invoice
         never re-rounds lines; subtotal = sum(amount_cents) exactly.
      2. subtotal_cents = sum over all lines (including negative ADJUSTMENT lines).
      3. tax_cents = round_half_up(subtotal_cents * TAX_RATE)   # single rounding on the subtotal
      4. total_cents = subtotal_cents + tax_cents
      5. At issue only: credit_applied_cents = min(household.wallet_credit_cents, total_cents)
      6. amount_due_cents = total_cents - credit_applied_cents
      Resolve-dispute reruns steps 2-4 and 6 with credit_applied_cents frozen.
    input_set: "InvoiceLines of the invoice; household wallet at issue time"
    constants:
      TAX_RATE: 0.0825
      DUE_DAYS: 14
    precision: "integer cents; round_half_up once on tax"

  - name: invoice_sweep
    trigger: "Invoice generate (POST /coopcare/invoices)"
    algorithm: aggregation
    formula: |
      Build DRAFT invoice lines for household H and half-open period [period_start, period_end):
      VISIT lines: ServiceVisits of H with coverage == BILLABLE AND status == COMPLETED
        AND billed_invoice_id IS NULL AND date(scheduled_start) in period -> line amount final_price_cents.
      SITTING lines: SittingEngagements of H with status == COMPLETED AND billed_invoice_id IS NULL
        AND date(settled_at) in period -> line amount final_price_cents.
      ORDER lines: SupplyOrders of H with status IN {PLACED, FULFILLED} AND billed_invoice_id IS NULL
        AND date(placed_at) in period -> line amount total_cents.
      SUBSCRIPTION_FEE line: if H has a Subscription with status IN {ACTIVE, PAUSED}
        AND current_period_start in period -> one line of plan.monthly_fee_cents.
      CANCELLATION_FEE lines: SittingEngagements of H with status == CANCELLED
        AND cancellation_fee_cents > 0 AND billed_invoice_id IS NULL
        AND date(cancelled_at) in period -> line amount cancellation_fee_cents.
      Zero swept lines -> ERR_INVOICE_EMPTY (no invoice created).
      A non-VOID invoice for H with overlapping half-open period exists -> ERR_INVOICE_PERIOD_OVERLAP
      (overlap iff new.period_start < existing.period_end AND new.period_end > existing.period_start).
      On creation all swept sources get billed_invoice_id = new invoice id; VOID clears them.
    input_set: "billable sources of the household in the period"
    constants: {}
    precision: "date granularity, half-open periods"

  - name: wallet_credit_ledger
    trigger: "wallet-adjustments, invoice issue, invoice void"
    algorithm: aggregation
    formula: |
      wallet_credit_cents changes ONLY via:
        POST wallet-adjustments: wallet += amount_cents (signed; result must be >= 0 else ERR_INSUFFICIENT_WALLET_CREDIT)
        Invoice issue: wallet -= credit_applied_cents
        Invoice void: wallet += credit_applied_cents (exact refund of that invoice's applied credit)
      Invariant: issuing an invoice and then voiding it leaves wallet_credit_cents unchanged.
    input_set: "the HouseholdAccount wallet and its invoices"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a known role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Ownership: Customer's X-User-ID must equal the target resource's household_id; ServiceTech's X-User-ID must equal assigned_technician_id / route.technician_id on tech-scoped actions"
    error_id: ERR_NOT_RESOURCE_OWNER / ERR_NOT_ASSIGNED_TECH
    http_status: 403
    applies_to: "household-scoped writes by Customer; check-in/complete/mark-no-show; route-stop complete/skip"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids exist (plan_id, product sku, engagement_id, new_plan_id)"
    error_id: "ERR_HOUSEHOLD_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_COOP_SITE_NOT_FOUND / ERR_VISIT_NOT_FOUND / ERR_ENGAGEMENT_NOT_FOUND / ERR_ROUTE_NOT_FOUND / ERR_STOP_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 5
    category: request
    check: "Required fields present; types valid; enum values in declared sets; end > start for visit/stop/invoice datetime windows; MM-DD / HH:MM well-formed; quantities positive. (SittingEngagement night count is NOT checked here — it is ruled by ERR_ENGAGEMENT_DURATION_INVALID at priority 11.)"
    error_id: ERR_INVALID_REQUEST / ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the operation (per §1.2 preconditions; includes household ACTIVE gates on visit creation/check-in, order place, subscription create/resume)"
    error_id: "ERR_ACCOUNT_SUSPENDED / ERR_SUBSCRIPTION_NOT_ACTIVE / ERR_PERIOD_NOT_ENDED / ERR_VISIT_NOT_ASSIGNABLE / ERR_VISIT_NOT_SCHEDULED / ERR_VISIT_NOT_ON_SITE / ERR_VISIT_NOT_CANCELLABLE / ERR_ENGAGEMENT_NOT_QUOTED / ERR_ENGAGEMENT_NOT_CONFIRMED / ERR_ENGAGEMENT_NOT_CANCELLABLE / ERR_ROUTE_NOT_PLANNED / ERR_ROUTE_NOT_PUBLISHED / ERR_STOP_NOT_PENDING / ERR_ORDER_NOT_DRAFT / ERR_INVOICE_NOT_DRAFT / ERR_INVOICE_NOT_ISSUED / ERR_INVOICE_NOT_DISPUTED / ERR_INVALID_STATE"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /coopcare/subscriptions/{id}/plan-changes; POST /coopcare/sitting-routes/{id}/stops"

  - priority: 8
    category: business_referential
    check: "Cross-referenced entity fits the operation: visit_type SETUP_INSTALL requires coop PLANNED; other visit types require coop INSTALLED; coop_site_id belongs to household_id; fulfillment visit belongs to same household and is SCHEDULED; engagement_id on stop add references a CONFIRMED engagement of a household whose zone matches the route"
    error_id: "ERR_COOP_NOT_INSTALLED / ERR_COOP_ALREADY_INSTALLED / ERR_FULFILLMENT_VISIT_INVALID / ERR_ENGAGEMENT_NOT_CONFIRMED"
    http_status: 409
    applies_to: "visit create; order create/place; route stop add"

  - priority: 9
    category: business_safety
    check: "Predator safety gate: sitting engagement confirm requires coop_site.predator_grade IN {B, A}"
    error_id: ERR_PREDATOR_GRADE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /coopcare/sitting-engagements/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "Time-window rules: scheduled_start >= logical clock at creation; engagement dates free of closed-interval overlap; seasonal windows do not overlap per zone; technician buffered windows do not collide; stop buffered windows do not collide; invoice periods do not overlap per household"
    error_id: "ERR_SCHEDULE_IN_PAST / ERR_ENGAGEMENT_DATE_OVERLAP / ERR_SEASONAL_WINDOW_OVERLAP / ERR_TECH_SCHEDULE_CONFLICT / ERR_STOP_TIME_CONFLICT / ERR_INVOICE_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "visit create/assign; engagement create (schedule-in-past only) and confirm (overlap); seasonal-window create; route stop add; invoice generate"

  - priority: 11
    category: business_constraint
    check: "Capacity/shape rules: route capacity (committed_stops < max_stops); reschedule_count < 2; order non-empty; engagement length 1..30 nights; subscription uniqueness per household; route cancellable only when committed_stops == 0; settle requires all stops terminal; selector found a route for every stop date; adjustment keeps total >= 0"
    error_id: "ERR_ROUTE_CAPACITY_FULL / ERR_RESCHEDULE_LIMIT_REACHED / ERR_ORDER_EMPTY / ERR_ENGAGEMENT_DURATION_INVALID / ERR_SUBSCRIPTION_ALREADY_EXISTS / ERR_ROUTE_NOT_EMPTY / ERR_STOPS_OUTSTANDING / ERR_NO_ROUTE_AVAILABLE / ERR_INVALID_ADJUSTMENT / ERR_INVOICE_EMPTY"
    http_status: "409 (ERR_ENGAGEMENT_DURATION_INVALID -> 400, ERR_INVALID_ADJUSTMENT -> 422 per §1.6)"
    applies_to: "stop add; request-reschedule; order place; engagement create; subscription create; route cancel; engagement settle; engagement confirm; resolve-dispute; invoice generate"

  - priority: 12
    category: business_fiscal
    check: "Money gates last: order total within wallet credit + CREDIT_LIMIT; wallet adjustment cannot drive balance negative"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED / ERR_INSUFFICIENT_WALLET_CREDIT"
    http_status: 402
    applies_to: "order place; wallet-adjustments"

# =============================================================================
# §1.5 API Endpoint Table (59 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time pinned) ---
  - method: POST
    path: "/coopcare/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z; the clock NEVER falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

  # --- HouseholdAccount ---
  - method: POST
    path: "/coopcare/households"
    description: "Onboard a household account (status ACTIVE, wallet 0)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email, address, zone_code]
    output: HouseholdAccount
    side_effects: ["status=ACTIVE", "wallet_credit_cents=0"]

  - method: GET
    path: "/coopcare/households/{id}"
    description: "Get a household account"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: HouseholdAccount
    side_effects: []

  - method: POST
    path: "/coopcare/households/{id}/suspend"
    description: "Suspend a household; cascades subscription pause -> covered visit cancels -> order reversion"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: HouseholdAccount
    side_effects: ["status ACTIVE->SUSPENDED", "cascade per HouseholdAccount state machine"]

  - method: POST
    path: "/coopcare/households/{id}/reinstate"
    description: "Reinstate a suspended household (no automatic subscription resume)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: HouseholdAccount
    side_effects: ["status SUSPENDED->ACTIVE"]

  - method: POST
    path: "/coopcare/households/{id}/wallet-adjustments"
    description: "Grant or claw back wallet credit (signed amount; balance must stay >= 0)"
    roles: [BillingAdmin]
    code: 201
    input: [amount_cents, reason]
    output: HouseholdAccount
    side_effects: ["wallet_credit_cents += amount_cents", "increments HouseholdAccount.version by 1"]

  # --- configuration ---
  - method: POST
    path: "/coopcare/subscription-plans"
    description: "Create a subscription plan (config)"
    roles: [PlatformAdmin]
    code: 201
    input: [plan_code, monthly_fee_cents, included_cleanings_per_period, included_health_checks_per_period, supply_discount_pct, sitting_discount_pct]
    output: SubscriptionPlan
    side_effects: []

  - method: POST
    path: "/coopcare/products"
    description: "Create a catalog product (config)"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, category, unit_price_cents, "active?"]
    output: Product
    side_effects: []

  - method: POST
    path: "/coopcare/seasonal-windows"
    description: "Create a seasonal pricing window; per-zone day-level overlap (wrap-aware) rejected"
    roles: [PlatformAdmin]
    code: 201
    input: [window_code, zone_code, start_md, end_md, visit_surcharge_pct, sitting_surcharge_pct]
    output: SeasonalWindow
    side_effects: []

  # --- Subscription ---
  - method: POST
    path: "/coopcare/subscriptions"
    description: "Start a subscription for a household (one non-CANCELLED subscription per household)"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [household_id, plan_id, current_period_start]
    output: Subscription
    side_effects: ["status=ACTIVE", "used counters=0", "current_period_end = start + 1 calendar month"]

  - method: GET
    path: "/coopcare/subscriptions"
    description: "List subscriptions with filters"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["household_id?", "plan_id?", "pending_plan_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/coopcare/subscriptions/{id}"
    description: "Get a subscription"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/coopcare/subscriptions/{id}/pause"
    description: "Pause an active subscription; cancels covered pending visits and reverts their linked orders"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status ACTIVE->PAUSED", "covered visit cancellations", "linked PLACED orders -> DRAFT"]

  - method: POST
    path: "/coopcare/subscriptions/{id}/resume"
    description: "Resume a paused subscription (household must be ACTIVE)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status PAUSED->ACTIVE"]

  - method: POST
    path: "/coopcare/subscriptions/{id}/cancel"
    description: "Cancel a subscription; same covered-visit cascade as pause; clears pending plan change"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status ->CANCELLED", "covered visit cancellations + order reversions", "pending_plan_id=null"]

  - method: POST
    path: "/coopcare/subscriptions/{id}/plan-changes"
    description: "Schedule a plan change for the next period (supersedes any pending change); OCC-guarded"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: [new_plan_id, expected_subscription_version]
    output: Subscription
    side_effects: ["pending_plan_id=new_plan_id", "increments Subscription.version by 1"]

  - method: POST
    path: "/coopcare/subscriptions/{id}/renew-period"
    description: "Roll the period forward once the logical clock passes period end; lands pending plan change, resets counters"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["plan_id=pending_plan_id when set", "used counters=0", "period advanced +1 month", "increments Subscription.version by 1"]

  # --- CoopSite ---
  - method: POST
    path: "/coopcare/coop-sites"
    description: "Register a coop site (PLANNED, predator_grade NONE)"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [household_id, site_label, coop_capacity_hens]
    output: CoopSite
    side_effects: ["status=PLANNED", "predator_grade=NONE"]

  - method: GET
    path: "/coopcare/coop-sites"
    description: "List coop sites with filters"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["household_id?", "status?", "limit?", "offset?"]
    output: CoopSite[]
    side_effects: []

  - method: GET
    path: "/coopcare/coop-sites/{id}"
    description: "Get a coop site"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: CoopSite
    side_effects: []

  # --- ServiceVisit ---
  - method: POST
    path: "/coopcare/service-visits"
    description: "Book a service visit; resolves subscription coverage and provisional price"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [household_id, coop_site_id, visit_type, scheduled_start, scheduled_end]
    output: ServiceVisit
    side_effects: ["status=REQUESTED", "coverage resolved", "provisional_price_cents computed", "covered counter incremented when SUBSCRIPTION_COVERED"]

  - method: GET
    path: "/coopcare/service-visits"
    description: "List service visits with filters"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["household_id?", "coop_site_id?", "subscription_id?", "status?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []

  - method: GET
    path: "/coopcare/service-visits/{id}"
    description: "Get a service visit"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []

  - method: POST
    path: "/coopcare/service-visits/{id}/assign"
    description: "Assign a technician (REQUESTED or RESCHEDULE_REQUESTED -> SCHEDULED); optional new window; buffered tech-conflict check"
    roles: [Dispatcher]
    code: 200
    input: [technician_id, "scheduled_start?", "scheduled_end?"]
    output: ServiceVisit
    side_effects: ["status ->SCHEDULED", "assigned_technician_id set", "window replaced when overrides supplied"]

  - method: POST
    path: "/coopcare/service-visits/{id}/request-reschedule"
    description: "Customer requests reschedule (SCHEDULED -> RESCHEDULE_REQUESTED); at most 2 per visit"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status ->RESCHEDULE_REQUESTED", "reschedule_count += 1"]

  - method: POST
    path: "/coopcare/service-visits/{id}/check-in"
    description: "Assigned technician arrives (SCHEDULED -> ON_SITE); household must be ACTIVE"
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status ->ON_SITE"]

  - method: POST
    path: "/coopcare/service-visits/{id}/complete"
    description: "Complete an on-site visit; computes final price; fires coop/order side effects"
    roles: [ServiceTech]
    code: 200
    input: [observed_flock_size, actual_duration_minutes, "findings_severity?"]
    output: ServiceVisit
    side_effects: ["status ->COMPLETED", "final_price_cents computed", "coop INSTALLED / grade upgrade per visit_type", "linked PLACED order -> FULFILLED"]

  - method: POST
    path: "/coopcare/service-visits/{id}/mark-no-show"
    description: "Mark a scheduled visit NO_SHOW; releases covered reservation without charge"
    roles: [ServiceTech]
    code: 200
    input: ["reason?"]
    output: ServiceVisit
    side_effects: ["status ->NO_SHOW", "covered counter decremented when SUBSCRIPTION_COVERED"]

  - method: POST
    path: "/coopcare/service-visits/{id}/cancel"
    description: "Cancel a non-terminal visit; releases covered reservation; reverts linked PLACED order to DRAFT"
    roles: [Customer, Dispatcher]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status ->CANCELLED", "covered counter decremented", "linked order -> DRAFT + unlinked"]

  # --- SittingEngagement ---
  - method: POST
    path: "/coopcare/sitting-engagements"
    description: "Request a vacation sitting engagement; occupancy overlap is validated at confirm time, not at creation"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [household_id, coop_site_id, start_date, end_date, daily_window_start]
    output: SittingEngagement
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/coopcare/sitting-engagements"
    description: "List sitting engagements with filters"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["household_id?", "coop_site_id?", "status?", "limit?", "offset?"]
    output: SittingEngagement[]
    side_effects: []

  - method: GET
    path: "/coopcare/sitting-engagements/{id}"
    description: "Get a sitting engagement"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: SittingEngagement
    side_effects: []

  - method: POST
    path: "/coopcare/sitting-engagements/{id}/quote"
    description: "Produce the forward-looking quote (REQUESTED -> QUOTED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: SittingEngagement
    side_effects: ["quoted_price_cents computed"]

  - method: POST
    path: "/coopcare/sitting-engagements/{id}/confirm"
    description: "Confirm a quoted engagement; safety + overlap gates; atomically creates route stops via selector"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: SittingEngagement
    side_effects: ["status ->CONFIRMED", "PENDING RouteStops created on selected routes", "route committed_stops/version bumped per stop"]

  - method: POST
    path: "/coopcare/sitting-engagements/{id}/cancel"
    description: "Cancel an engagement; notice-based fee from CONFIRMED; cascades stop REMOVED + route demotion"
    roles: [Customer, Dispatcher]
    code: 200
    input: []
    output: SittingEngagement
    side_effects: ["status ->CANCELLED", "cancellation_fee_cents computed", "PENDING stops -> REMOVED", "routes decremented/demoted"]

  - method: POST
    path: "/coopcare/sitting-engagements/{id}/settle"
    description: "Settle a confirmed engagement once all stops are terminal; computes chronological final price"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: SittingEngagement
    side_effects: ["status ->COMPLETED", "final_price_cents computed", "settled_at stamped"]

  # --- SittingRoute / RouteStop ---
  - method: POST
    path: "/coopcare/sitting-routes"
    description: "Create a sitting route (PLANNED)"
    roles: [Dispatcher]
    code: 201
    input: [technician_id, route_date, zone_code, max_stops]
    output: SittingRoute
    side_effects: ["status=PLANNED", "committed_stops=0"]

  - method: GET
    path: "/coopcare/sitting-routes/{id}"
    description: "Get a sitting route"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: SittingRoute
    side_effects: []

  - method: POST
    path: "/coopcare/sitting-routes/{id}/publish"
    description: "Publish a planned route so the selector can assign stops"
    roles: [Dispatcher]
    code: 200
    input: []
    output: SittingRoute
    side_effects: ["status PLANNED->PUBLISHED", "increments SittingRoute.version by 1"]

  - method: POST
    path: "/coopcare/sitting-routes/{id}/cancel"
    description: "Cancel a route with zero committed stops"
    roles: [Dispatcher]
    code: 200
    input: []
    output: SittingRoute
    side_effects: ["status ->CANCELLED"]

  - method: POST
    path: "/coopcare/sitting-routes/{id}/stops"
    description: "Manually add a stop for a CONFIRMED engagement; OCC-guarded; capacity + buffered-overlap checks"
    roles: [Dispatcher]
    code: 201
    input: [engagement_id, planned_start, planned_end, expected_route_version]
    output: RouteStop
    side_effects: ["RouteStop PENDING created", "committed_stops += 1", "increments SittingRoute.version by 1"]

  - method: GET
    path: "/coopcare/route-stops"
    description: "List route stops with filters"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["route_id?", "engagement_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  - method: GET
    path: "/coopcare/route-stops/{id}"
    description: "Get a route stop"
    roles: [Customer, ServiceTech, Dispatcher, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
