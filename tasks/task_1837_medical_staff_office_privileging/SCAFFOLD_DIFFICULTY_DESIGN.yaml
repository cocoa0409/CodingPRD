              as: MedicalStaffCoordinator
              captures: { appS_id: $.data.id, appS_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${appS_id}", item_kind: "WORK_HISTORY", is_primary_source: false }
              as: MedicalStaffCoordinator
              captures: { viS_id: $.data.id }
            - call: "POST /mso/delineations"
              payload: { application_id: "${appS_id}", privilege_line: "EMED-GEN", documented_training_months: 24, documented_cases_24mo: 100, expected_application_version: "${appS_v}" }
              as: MedicalStaffCoordinator
              captures: { delS_id: $.data.id }
            - call: "POST /mso/applications/${appS_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${viS_id}/mark-received"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${viS_id}/verify"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations/${delS_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications/${appS_id}/advance-to-committee"
              payload: {}
              as: CredentialsCommitteeChair
            - call: "GET /mso/agenda-items"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { agS_id: "$.data[0].id" }
            - call: "POST /mso/agenda-items/${agS_id}/committee-vote"
              payload: { votes_for: 3, votes_against: 0 }
              as: CredentialsCommitteeChair
            - call: "POST /mso/agenda-items/${agS_id}/mec-endorse"
              payload: { voter_id: "mec-user-s" }
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/agenda-items/${agS_id}/board-ratify"
              payload: {}
              as: BoardMember
            - call: "POST /mso/members"
              payload: { full_name: "Dr. Chief", npdb_subject_id: "NPDB-P1", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /mso/adverse-action-cases"
              payload: { subject_member_id: "${s1_id}", proposed_by_member_id: "${p1_id}", case_kind: "SUSPENSION" }
              as: DepartmentChief
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /mso/adverse-action-cases/${c1_id}/endorse"
              payload: {}
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/adverse-action-cases/${c1_id}/request-hearing"
              payload: {}
              as: Practitioner
