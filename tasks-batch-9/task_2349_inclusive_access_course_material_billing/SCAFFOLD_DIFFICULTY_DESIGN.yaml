  - rule_id: transitive_cascade
    instances:
      - name: cascade_opt_out_grant_four_hops_to_at_risk_and_stale_reconciliation
        grounds:
          - state_machines.OptOutRequest.SUBMITTED_to_GRANTED
          - state_machines.StudentCharge.POSTED_to_REFUNDED
          - state_machines.StudentCharge.PROVISIONED_to_REVOKED
          - state_machines.CourseSection.BILLED_to_AT_RISK
          - state_machines.PublisherAgreement.COMPUTED_to_STALE
          - calculations.section_participation_rate
        distinguishing_aspect: |
          One grant travels four hops across four entities: charge refunded and access revoked
          (hop 1) -> section counters and participation_rate recomputed to 0.3333 which trips
          BILLED -> AT_RISK (hops 2-3) -> the pricing agreement's reconciliation_status
          COMPUTED -> STALE (hop 4). The chain is only observable because the section carries three
          students and one prior opt-out, so the second grant is the one that crosses
          MIN_PARTICIPATION_RATE.
        test_recipe:
          setup:
            - "FA26 fixture with THREE students charged on day one: billing_basis_enrollment_count 3, tier [3,null], 7875 cents each, publisher share 6930 each."
            - "S-1001 already opted out (granted 2026-08-26), so participation_rate is 0.6667 and the section is still BILLED."
            - "A reconciliation run computed after that first opt-out leaves PUB-A.reconciliation_status == COMPUTED with billable_count 2 and gross 13860."
            - "S-1002 files a second opt-out on 2026-08-28 that is still pending."
