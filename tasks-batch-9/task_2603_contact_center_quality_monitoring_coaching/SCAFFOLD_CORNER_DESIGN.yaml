      - name: validation_source_eligibility_depends_on_flag_and_scan
        claim_type: conditional_validation
        grounds:
          - validations[priority=38]
          - validations[priority=39]
          - endpoints[POST /sample-selections]
          - endpoints[POST /analytics-scans]
          - calculations.analytics_priority_score
        distinguishing_aspect: "Rule 38 only bites for two of the three sources, and for TARGETED it is conditional on a *different* row existing: the same TARGETED request is ERR_SOURCE_NOT_ELIGIBLE before an AnalyticsScan exists on the interaction and 201 afterwards, while CUSTOMER_FLAGGED depends purely on the interaction's own customer_flagged flag and RANDOM carries no condition at all. Once the interaction is in the pool a second selection of it in the same plan is ERR_DUPLICATE_INTERACTION_SELECTION, which is a different rule from the eligibility one."
