            - "HTTP 200 for the 1440-minute window with ${x4_manifested_status} == MANIFESTED and ${x4_manifested_postage} == 57 == round_half_up(62 * (10000 - 850) / 10000), proving the span limit is inclusive"

      - name: press_line_faults_are_reported_separately_by_status_capability_and_capacity
        claim_type: error_triggerable
        grounds: [errors.ERR_PRESS_LINE_UNAVAILABLE, errors.ERR_PRESS_LINE_CAPABILITY_MISMATCH, errors.ERR_PRESS_CAPACITY_EXCEEDED, errors.ERR_NO_ELIGIBLE_PRESS_LINE]
        distinguishing_aspect: "Each eligibility predicate of the selector becomes its own explicit-naming error - MAINTENANCE status 409, missing DUPLEX capability 422, insufficient sheet headroom 409 - and when every line fails one of them the selector itself reports ERR_NO_ELIGIBLE_PRESS_LINE."
        test_recipe:
          setup:
            - "Client CL-X5 (dr_readiness_required false) with ACTIVE template T-X5: duplex_required true, sheets_per_document 2, no inserts, no color."
            - "Three records in postal_code 30301, so the presorted job needs 6 press sheets."
            - "Three press lines, each failing exactly one predicate: PL-X5M capabilities [DUPLEX] but status MAINTENANCE; PL-X5N AVAILABLE with capabilities [] and capacity 1000; PL-X5C AVAILABLE with capabilities [DUPLEX] but daily_sheet_capacity 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-X5", name: "Press Predicate Press", dr_readiness_required: false }
              as: BureauAdmin
              captures: { x5_client_id: "$.data.id" }
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-X5M", capabilities: ["DUPLEX"], sheets_per_hour: 600, daily_sheet_capacity: 1000, status: "MAINTENANCE" }
              as: BureauAdmin
              captures: { x5_maint_line: "$.data.id", x5_maint_status: "$.data.status" }
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-X5N", capabilities: [], sheets_per_hour: 600, daily_sheet_capacity: 1000 }
