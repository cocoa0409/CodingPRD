            - call: "POST /make-ready/turns/${t1}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "CleanCo", trade: "CLEAN" }
              as: PropertyManager
              captures: { v_c: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it1}", vendor_id: "${v_c}", start_date: "2026-08-05", end_date: "2026-08-08" }
              as: TurnCoordinator
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u2}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t2: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t2}", category: "CLEAN", description: "clean 102", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it2: $.data.id }
            - call: "POST /make-ready/turns/${t2}/finalize-scope"
              payload: {}
