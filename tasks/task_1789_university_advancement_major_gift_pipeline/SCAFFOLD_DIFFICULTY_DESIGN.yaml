# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# University Advancement & Major Gift Pipeline
# 9 rules x 2-3 instances = 21 instances. All recipes replay against §1.5 only.
# Logical clock default before any set: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Campaign vs Prospect)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: campaign_face_value_vs_cash_receipts_divergence
        grounds:
          - calculations.campaign_counted_totals
          - entities.Campaign.fields.face_value_counted_cents
          - entities.Campaign.fields.cash_counted_cents
        distinguishing_aspect: |
          Same gifts produce different totals under the two campaign counting
          variants: FACE_VALUE_BOOKING counts the booked 10000000-cent pledge net of
          write-offs and excludes pledge-linked payments, while CASH_RECEIPTS counts
          only in-window non-reversed payments (matched gift floored at 0.5x) —
          this instance operates on the Campaign entity domain, unlike the
          recognition instance which operates on Prospect.
        test_recipe:
          setup:
            - "Campaign C ACTIVE with inclusive window [2026-08-01T00:00:00Z, 2027-07-31T00:00:00Z]"
            - "Prospect rated band C, assigned to fundraiser, moved to CULTIVATION"
            - "PLEDGE proposal 10000000 approved (STANDARD), UNRESTRICTED agreement executed, pledge 10000000 in 3 monthly installments first due 2026-09-01 booked to campaign C (created at default clock inside window)"
            - "Payment P1 3333334 (received 2026-09-01, pledge-linked, campaign C, not matched); payment P2 666666 (received 2026-09-02, pledge-linked, campaign C, corporate_matched=true)"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/campaigns"
              payload: { name: "Campaign C", goal_cents: 50000000, counting_start: "2026-08-01T00:00:00Z", counting_end: "2027-07-31T00:00:00Z" }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { c_id: $.data.id }
            - call: "POST /advancement/campaigns/${c_id}/activate"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "PLEDGE", ask_amount_cents: 10000000, designation_purpose: "Library fund", expected_prospect_version: "${p_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/proposals/${prop_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/proposals/${prop_id}/agreements"
              payload: { restriction_type: "UNRESTRICTED", agreement_amount_cents: 10000000 }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /advancement/agreements/${agr_id}/present"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/agreements/${agr_id}/execute"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
            - call: "POST /advancement/pledges"
              payload: { agreement_id: "${agr_id}", total_amount_cents: 10000000, installment_count: 3, frequency: "MONTHLY", first_due_date: "2026-09-01T00:00:00Z", campaign_id: "${c_id}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /advancement/gift-payments"
              payload: { donor_prospect_id: "${p_id}", pledge_id: "${pl_id}", campaign_id: "${c_id}", amount_cents: 3333334, received_at: "2026-09-01T00:00:00Z", payment_method: "WIRE" }
              as: FinanceSteward
              as_user_id: "fin-1"
            - call: "POST /advancement/gift-payments"
              payload: { donor_prospect_id: "${p_id}", pledge_id: "${pl_id}", campaign_id: "${c_id}", amount_cents: 666666, received_at: "2026-09-02T00:00:00Z", payment_method: "CHECK", corporate_matched: true }
              as: FinanceSteward
              as_user_id: "fin-1"
          trigger:
            - call: "GET /advancement/campaigns/${c_id}/totals"
              payload: {}
              as: FinanceSteward
              as_user_id: "fin-1"
              captures: { face_total: $.data.face_value_counted_cents, cash_total: $.data.cash_counted_cents }
          assert:
            - "Campaign.${c_id}.face_value_counted_cents == 10000000  # pledge face, net of write-offs (0); pledge-linked payments excluded"
            - "Campaign.${c_id}.cash_counted_cents == 3666667  # 3333334 + floor(666666 * 0.5) = 3333334 + 333333"
            - "face_total != cash_total  # the two variants diverge on identical data"

      - name: recognition_cash_only_vs_comprehensive_divergence
        grounds:
          - calculations.recognition_society_scoring
          - entities.Prospect.fields.lifetime_given_cents
          - entities.Prospect.fields.outstanding_pledge_cents
          - entities.Prospect.fields.recognition_society_id
        distinguishing_aspect: |
          Same prospect scores differently under the two recognition variants:
          CASH_ONLY (8000000, settled hard credit only) yields no society membership
          below the 10000000 BRONZE threshold, while COMPREHENSIVE (cash + ACTIVE
          pledge outstanding + soft credits = 15000000) projects BRONZE — this
          instance operates on the Prospect/RecognitionSociety domain, unlike the
          Campaign-domain counting instance.
        test_recipe:
          setup:
            - "RecognitionSociety BRONZE threshold_cash_cents = 10000000"
            - "Prospect A rated band C with ACTIVE assignment; Prospect B exists (soft-credit payer)"
            - "A has: outright payment 8000000 (no pledge/fund/campaign); ACTIVE pledge 5000000 (1 installment) outstanding; SOFT split credit 2000000 from B's 4000000 payment split 50/50"
          setup_api_calls:
            - call: "POST /advancement/recognition-societies"
              payload: { name: "Bronze Circle", level: "BRONZE", threshold_cash_cents: 10000000 }
              as: DonorRelationsOfficer
              as_user_id: "dro-1"
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { pa_id: $.data.id }
            - call: "POST /advancement/prospects/${pa_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${pa_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${pa_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor B", prospect_type: "INDIVIDUAL", contact_email: "b@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { pb_id: $.data.id }
            - call: "POST /advancement/gift-payments"
              payload: { donor_prospect_id: "${pa_id}", amount_cents: 8000000, received_at: "2026-08-10T00:00:00Z", payment_method: "WIRE" }
              as: FinanceSteward
              as_user_id: "fin-1"
            - call: "GET /advancement/prospects/${pa_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { pa_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${pa_id}", proposal_type: "PLEDGE", ask_amount_cents: 5000000, designation_purpose: "Scholarships", expected_prospect_version: "${pa_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/proposals/${prop_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/proposals/${prop_id}/agreements"
              payload: { restriction_type: "UNRESTRICTED", agreement_amount_cents: 5000000 }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /advancement/agreements/${agr_id}/present"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/agreements/${agr_id}/execute"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
            - call: "POST /advancement/pledges"
              payload: { agreement_id: "${agr_id}", total_amount_cents: 5000000, installment_count: 1, frequency: "ANNUAL", first_due_date: "2026-12-01T00:00:00Z" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /advancement/gift-payments"
              payload: { donor_prospect_id: "${pb_id}", amount_cents: 4000000, received_at: "2026-08-12T00:00:00Z", payment_method: "STOCK", splits: [ { prospect_id: "${pb_id}", credit_type: "HARD", split_pct: 50 }, { prospect_id: "${pa_id}", credit_type: "SOFT", split_pct: 50 } ] }
              as: FinanceSteward
              as_user_id: "fin-1"
          trigger:
            - call: "GET /advancement/prospects/${pa_id}/recognition"
              payload: {}
              as: DonorRelationsOfficer
              as_user_id: "dro-1"
              captures: { cash_total: $.data.cash_total_cents, comp_total: $.data.comprehensive_total_cents, member_lvl: $.data.member_level, proj_lvl: $.data.projected_level }
          assert:
            - "recognition.cash_total_cents == 8000000  # CASH_ONLY: hard-credit non-reversed payments only"
            - "recognition.comprehensive_total_cents == 15000000  # 8000000 cash + 5000000 ACTIVE pledge outstanding + 2000000 soft credit"
            - "recognition.soft_credit_cents == 2000000"
            - "recognition.member_level is null  # 8000000 < 10000000 BRONZE threshold"
            - "recognition.projected_level == \"BRONZE\"  # 15000000 >= 10000000"
            - "cash_total != comp_total and member_lvl != proj_lvl  # variants diverge on identical data"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c — three different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: approval_tier_multi_input_branching
        grounds:
          - calculations.approval_tier_determination
          - entities.Proposal.fields.approval_tier
          - entities.Proposal.fields.effective_ask_cents
        distinguishing_aspect: |
          Mode (a): tier is a >=3-input non-linear function (ask amount x type
          multiplier x capacity band shift x organization exemption). Identical
          150000000 OUTRIGHT asks yield MAJOR for a band-A INDIVIDUAL (trusted
          shift down from PRINCIPAL) but PRINCIPAL for a band-A ORGANIZATION
          (shift blocked); a 120000000 PLANNED ask on band B yields MAJOR via the
          0.5 type multiplier (effective 60000000).
        test_recipe:
          setup:
            - "Fundraiser with capacity for 3 prospects"
            - "Prospect IND-A: INDIVIDUAL, band A (assessed 2000000000 VERIFIED_DOCUMENT)"
            - "Prospect ORG-A: ORGANIZATION, band A (assessed 2000000000 VERIFIED_DOCUMENT)"
            - "Prospect IND-B: INDIVIDUAL, band B (assessed 200000000 VERIFIED_DOCUMENT)"
            - "All three assigned to the fundraiser and moved to CULTIVATION"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 5, max_open_ask_cents: 10000000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Ind A", prospect_type: "INDIVIDUAL", contact_email: "ia@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { pia_id: $.data.id }
            - call: "POST /advancement/prospects/${pia_id}/assessments"
              payload: { assessed_capacity_cents: 2000000000, engagement_score: 90, philanthropy_score: 90, recency_score: 90, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { aia_id: $.data.id }
            - call: "POST /advancement/assessments/${aia_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${pia_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${pia_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/prospects"
              payload: { full_name: "Org A", prospect_type: "ORGANIZATION", contact_email: "oa@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { poa_id: $.data.id }
            - call: "POST /advancement/prospects/${poa_id}/assessments"
              payload: { assessed_capacity_cents: 2000000000, engagement_score: 90, philanthropy_score: 90, recency_score: 90, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { aoa_id: $.data.id }
            - call: "POST /advancement/assessments/${aoa_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { f_ver2: $.data.version }
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${poa_id}", expected_fundraiser_version: "${f_ver2}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${poa_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/prospects"
              payload: { full_name: "Ind B", prospect_type: "INDIVIDUAL", contact_email: "ib@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { pib_id: $.data.id }
            - call: "POST /advancement/prospects/${pib_id}/assessments"
              payload: { assessed_capacity_cents: 200000000, engagement_score: 50, philanthropy_score: 50, recency_score: 50, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { aib_id: $.data.id }
            - call: "POST /advancement/assessments/${aib_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { f_ver3: $.data.version }
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${pib_id}", expected_fundraiser_version: "${f_ver3}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${pib_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${pia_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { pia_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${pia_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 150000000, designation_purpose: "Endowment", expected_prospect_version: "${pia_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_ia: $.data.id }
            - call: "POST /advancement/proposals/${prop_ia}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${poa_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { poa_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${poa_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 150000000, designation_purpose: "Endowment", expected_prospect_version: "${poa_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_oa: $.data.id }
            - call: "POST /advancement/proposals/${prop_oa}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${pib_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { pib_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${pib_id}", proposal_type: "PLANNED", ask_amount_cents: 120000000, designation_purpose: "Bequest", expected_prospect_version: "${pib_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_ib: $.data.id }
            - call: "POST /advancement/proposals/${prop_ib}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
          trigger:
            - call: "GET /advancement/proposals/${prop_ia}"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
            - call: "GET /advancement/proposals/${prop_oa}"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
            - call: "GET /advancement/proposals/${prop_ib}"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
          assert:
            - "Proposal.${prop_ia}.approval_tier == \"MAJOR\"  # 150000000 >= TIER_PRINCIPAL_MIN but INDIVIDUAL band A shifts one step down"
            - "Proposal.${prop_ia}.pinned_capacity_band == \"A\""
            - "Proposal.${prop_oa}.approval_tier == \"PRINCIPAL\"  # identical ask and band, but ORGANIZATION blocks the trusted shift"
            - "Proposal.${prop_ib}.approval_tier == \"MAJOR\"  # effective_ask = round_half_up(120000000 * 0.5) = 60000000 -> [25000000, 100000000)"
            - "Proposal.${prop_ib}.effective_ask_cents == 60000000"

      - name: credit_split_residual_rounding_order
        grounds:
          - calculations.credit_split_rounding
          - entities.CampaignCreditSplit.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the pinned order (non-largest splits
          rounded half-up first in (split_pct ASC, index ASC) order; largest split
          absorbs the residual) decides the cents. Payment 10001 with 34/33/33
          splits yields HARD 3401 / SOFT 3300 / SOFT 3300; rounding the largest
          first would give 3400/3301/3300 — a different result the pinned order
          forbids.
        test_recipe:
          setup:
            - "Campaign ACTIVE with window covering 2026-09-01"
            - "Three prospects: donor D, spouse S, friend F (no ratings needed to receive credit)"
          setup_api_calls:
            - call: "POST /advancement/campaigns"
              payload: { name: "Split Campaign", goal_cents: 1000000, counting_start: "2026-08-01T00:00:00Z", counting_end: "2027-07-31T00:00:00Z" }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { c_id: $.data.id }
            - call: "POST /advancement/campaigns/${c_id}/activate"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor D", prospect_type: "INDIVIDUAL", contact_email: "d@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { pd_id: $.data.id }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Spouse S", prospect_type: "INDIVIDUAL", contact_email: "s@x.com", spouse_prospect_id: "${pd_id}" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { ps_id: $.data.id }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Friend F", prospect_type: "INDIVIDUAL", contact_email: "f@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { pf_id: $.data.id }
          trigger:
            - call: "POST /advancement/gift-payments"
