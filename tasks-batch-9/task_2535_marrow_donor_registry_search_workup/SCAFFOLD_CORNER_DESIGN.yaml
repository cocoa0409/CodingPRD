              payload: {}
              as: CollectionCenterOps
              as_user_id: "${center_id}"
              captures: { bk_status_final: "$.data.status" }
          assert:
            - "SCHEDULE with the creation-time version succeeds: conditioning_status \"SCHEDULED\", conditioning_start_date \"2026-08-05\" - which derives the legal collection window 2026-08-11..2026-08-13 from CONDITIONING_TO_COLLECTION_MIN_DAYS 6 .. MAX_DAYS 8 - and version advances past p_v1"
            - "START replaying the now-stale p_v1 returns 412 with error_id \"ERR_STALE_PATIENT_VERSION\" even though the booking IS confirmed and the clock IS inside the conditioning day - the guard is the version, not the timeline"
            - "the refused START does not touch the row: the patient is still \"SCHEDULED\" at the same version p_v2, so a rejected write never bumps the OCC counter"
            - "START resubmitted with p_v2 returns 200, conditioning_status \"STARTED\", and version advances to p_v3"
            - "the re-SCHEDULE to 2026-08-09 carrying the now-stale p_v2 returns 412 \"ERR_STALE_PATIENT_VERSION\", NOT the 409 that a re-schedule of an already-STARTED patient would otherwise earn: priority 34 answers before every conditioning state rule"
            - "nothing cascaded from the refusal: conditioning_start_date is still \"2026-08-05\", the patient is still \"STARTED\" at p_v3, and the booking is still \"CONFIRMED\" - had the stale re-schedule landed, the 2026-08-11 booking would have fallen outside the new 2026-08-15..2026-08-17 window and been cancelled"

      - name: blocked_day_count_is_re_derived_after_create_and_after_source_release
        claim_type: derived_field_reconciliation
        grounds:
          - entities.DonorProfile.fields.blocked_day_count
          - entities.DonorUnavailability.fields.day_count
          - entities.DonorUnavailability.fields.status
          - validations[priority=32]
        distinguishing_aspect: |
          blocked_day_count is declared as a SUM over the donor's ACTIVE windows, not as a counter that is
          incremented and decremented. This instance drives it purely through manual windows - three
          creates, two releases and one refused re-release - so the aggregate is checked after each kind of
          source mutation with no booking cascade in play. The discriminating detail is that a released
          window is still READABLE (it stays on the row with status RELEASED and a released_at stamp) while
          being excluded from the sum: an implementation that hard-deletes the row, or that keeps a
          hand-maintained counter, diverges at the re-release step, where the refusal must leave the
          aggregate exactly where it was.
        test_recipe:
          setup:
            - "one domestic registry with one donor D1; the logical clock stays at 2026-08-01T00:00:00Z, so every window below is in the future"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id", d1_blocked_initial: "$.data.blocked_day_count" }
          trigger:
            - call: "POST /registry/donors/${d1_id}/unavailability-windows"
              payload: { date_from: "2026-09-01", date_to: "2026-09-03", reason: "PERSONAL" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { w1: "$.data.id", w1_days: "$.data.day_count", w1_status: "$.data.status", w1_source: "$.data.source_booking_id" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { blocked_after_w1: "$.data.blocked_day_count" }
            - call: "POST /registry/donors/${d1_id}/unavailability-windows"
              payload: { date_from: "2026-09-10", date_to: "2026-09-10", reason: "MEDICAL_HOLD" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { w2: "$.data.id", w2_days: "$.data.day_count" }
            - call: "POST /registry/donors/${d1_id}/unavailability-windows"
              payload: { date_from: "2026-09-20", date_to: "2026-09-24", reason: "PERSONAL" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { w3: "$.data.id", w3_days: "$.data.day_count" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { blocked_after_three: "$.data.blocked_day_count" }
            - call: "DELETE /registry/donors/${d1_id}/unavailability-windows/${w1}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { blocked_after_first_release: "$.data.blocked_day_count", avail_after_release: "$.data.availability_status" }
            - call: "GET /registry/donors/${d1_id}/unavailability-windows"
              payload: { status: "RELEASED", limit: 10, offset: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { released_0_id: "$.data[0].id", released_0_status: "$.data[0].status", released_0_days: "$.data[0].day_count", released_0_at: "$.data[0].released_at" }
            - call: "DELETE /registry/donors/${d1_id}/unavailability-windows/${w3}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { blocked_after_second_release: "$.data.blocked_day_count" }
            - call: "DELETE /registry/donors/${d1_id}/unavailability-windows/${w1}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              is_negative_trigger: true
              captures: { err_re_release: "$.data.error_id" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { blocked_final: "$.data.blocked_day_count" }
            - call: "GET /registry/donors/${d1_id}/unavailability-windows"
              payload: { status: "ACTIVE", limit: 10, offset: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { active_0_id: "$.data[0].id", active_0_days: "$.data[0].day_count" }
          assert:
            - "a freshly registered donor reports blocked_day_count 0"
            - "the first window computes day_count 3 (2026-09-01..2026-09-03 inclusive) with status \"ACTIVE\" and source_booking_id null, and the donor immediately reports blocked_day_count 3"
            - "after the single-day window (day_count 1) and the five-day window (day_count 5) the donor reports blocked_day_count 9 = 3 + 1 + 5"
            - "releasing the three-day window returns 204 and the donor reports blocked_day_count 6 - the sum drops by exactly that row's day_count"
            - "the released row is still readable: the RELEASED-filtered list returns it with status \"RELEASED\", day_count still 3 and released_at \"2026-08-01T00:00:00Z\" - it is excluded from the aggregate, not deleted"
            - "releasing the five-day window brings the donor to blocked_day_count 1, the single remaining ACTIVE window"
            - "re-releasing the already-RELEASED three-day window returns 409 with error_id \"ERR_WINDOW_NOT_RELEASABLE\" and blocked_day_count stays 1 - the refusal cannot subtract a second time"
            - "the ACTIVE-filtered list returns exactly the MEDICAL_HOLD window with day_count 1, which reconciles with the final blocked_day_count 1"
            - "availability_status is untouched throughout: manual PERSONAL and MEDICAL_HOLD windows block the calendar but never defer the donor"

      - name: idm_failure_cascade_runs_end_to_end_through_five_levels
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.MatchCandidate
          - state_machines.WorkupCase
          - state_machines.SearchRequest
          - state_machines.ReimbursementClaim
        excluded_because:
          difficulty_instance: idm_panel_failure_cascades_five_levels_to_backup_promotion
          rationale: |
            §1.8 owns the deepest cascade in the scaffold and owns both of the sub-claims this layer asks
            for. Ordering sensitivity: the IDM FAIL must abandon the WorkupCase, VOID the PROVISIONAL claim
            (restoring Patient.committed_cost_cents), release the center minutes and the donor's
            COLLECTION_WINDOW, EXCLUDE the primary candidate and only THEN promote the backup and return the
            SearchRequest to PRIMARY_ENGAGED - a promotion that ran before the exclusion would leave two
            PRIMARY candidates. End-to-end verification: that instance reads back all five levels plus the
            two conserved aggregates. Partial-failure handling is asserted by the same §1.8 instance's
            sibling, conditioning_abort_after_start_cascades_three_levels_and_stalls_search, where the
            cascade finds NO backup and must stall the search instead of half-applying the promotion. A
            corner-level repetition would necessarily be a strict subset.

      - name: both_calculation_variants_produce_their_own_result_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.match_probability_score.variants
          - calculations.reimbursement_claim_total.variants
        excluded_because:
          difficulty_instance: provisional_vs_final_reimbursement_claim_diverges_on_claim
          rationale: |
            Both dual-variant calculations are already owned at §1.8 depth. That instance pins the
            reimbursement pair: the PROVISIONAL variant priced from the planned method and planned window
            days at claim creation, the FINAL variant re-priced at finalize from the actual method, actual
            window days, the CANCELLATION line and a re-read fx snapshot, with the delta reconciled into
            Patient.committed_cost_cents. Its sibling
            preliminary_vs_confirmed_match_score_diverges_on_match_candidate pins the scoring pair, where
            the PRELIMINARY variant reads ambiguous loci at antigen level and charges the ambiguity penalty
            while the CONFIRMED variant reads the reported allele-level typing and drops it, and both values
            are asserted on the same candidate row. Between them every claim this layer asks for - each
            variant's own result, correct variant selection by context, and the delta on switch - is already
            covered with computed literals.

  # ---------------------------------------------------------------------------
  # consistency_model: immediate
  # ---------------------------------------------------------------------------
  - section: consistency model
    instances:

      - name: cascade_results_are_visible_in_the_same_request_that_caused_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /registry/search-requests].side_effects
          - endpoints[POST /registry/match-candidates/{id}/workup-cases].side_effects
          - entities.Patient.fields.committed_cost_cents
        distinguishing_aspect: |
          With consistency_model immediate there is no place in this API for a lagging denormalized field:
          the response that triggers a cascade must already carry every computed field of the entity it
          returns, and the very next read - with no intervening write, no sweep and no clock move - must
          already show every cascaded neighbour at its new value. The two heaviest fan-out writes are used:
          search-request creation, which materializes the candidate pool with its scores and ranks in one
          shot, and workup-case opening, which creates three ClearanceItem rows, moves the candidate to
          WORKUP_OPEN, opens a PROVISIONAL ReimbursementClaim and raises the patient's committed_cost_cents
          in the same transaction. An eventual-consistency implementation that recomputed committed_cost_cents
          on a later read, or that returned the workup case before its clearance items existed, fails here
          even though every individual value it eventually settles on is correct.
        test_recipe:
          setup:
            - "one domestic registry, one donor D1 and the canonical patient; the clock stays at 2026-08-01T00:00:00Z for the whole instance"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id", p_v1: "$.data.version", p_committed_initial: "$.data.committed_cost_cents" }
          trigger:
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id", sr_status: "$.data.status", sr_pool_size: "$.data.match_pool_size", sr_backup_count: "$.data.backup_candidate_count" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}", limit: 10, offset: 0 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc_d1: "$.data[0].id", mc_prelim: "$.data[0].preliminary_score", mc_rank: "$.data[0].rank_score", mc_role: "$.data[0].candidate_role", mc_status: "$.data[0].status" }
            - call: "POST /registry/match-candidates/${mc_d1}/typing-requests"
