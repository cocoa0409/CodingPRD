          rationale: "The safety-versus-fiscal priority pair is exactly the named §1.8 instance."

  - section: errors
    instances:
      - name: every_child_entity_lookup_with_an_unknown_id_is_not_found
        claim_type: triggerability
        grounds:
          - errors[ERR_COURSE_NOT_FOUND]
          - errors[ERR_PREREQUISITE_COURSE_NOT_FOUND]
          - errors[ERR_COUNSELOR_NOT_FOUND]
          - errors[ERR_LEAD_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
          - errors[ERR_TEACH_OUT_PLAN_NOT_FOUND]
        distinguishing_aspect: "Each child aggregate has its own 404 code, and the prerequisite reference resolves to a distinct code from the target Course itself — seven unknown-id probes must return seven different error_ids, never a shared generic 404."
        test_recipe:
          setup:
            - "EXECUTED Partnership with one DRAFT Program and one Course; the id 00000000-0000-0000-0000-000000000000 is used as the unknown id everywhere."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
