  - name: cascade_plan_exit_to_iep_compensations
    claim_type: cascading_side_effects
    grounds:
    - state_machines.Section504Plan.UNDER_ANNUAL_REVIEW_to_EXITED_TO_IEP
    distinguishing_aspect: 'EXIT_TO_IEP completion cascades: accommodations DISCONTINUED,
      pending acks DECLINED, submitted testing requests DENIED, student status flipped'
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / review_complete_exit_to_iep_requires_iep_active
      rationale: The success-path retry already asserts plan_status == EXITED_TO_IEP
        and student status flip; sub-cascades follow from the same transition
- section: consistency_model
  instances:
  - name: ack_flips_plan_visible_immediately
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: After final teacher acknowledge, the SAME response shows
      plan transitioned to ACTIVE — no async lag
    test_recipe:
      setup:
      - Plan in PENDING_TEACHER_ACK with 1 ack remaining
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2025-12-15T00:00:00Z'
        as: District504Director
        as_user_id: bootstrap-director
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2025-2026
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: T
          full_name: T
          staff_role: TEACHER
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          t1_id: $.data.id
      - call: POST /training-records
        payload:
          staff_id: ${t1_id}
          training_topic: SECTION_504_BASICS
          trained_at: '2025-12-16T00:00:00Z'
        as: District504Director
        as_user_id: bootstrap-director
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_id: $.data.id
      - call: POST /referrals
        payload:
          student_id: ${stu_id}
          referral_reason: r
          suspected_disability_category: LEARNING
        as: Teacher
        as_user_id: ${t1_id}
        captures:
          ref_id: $.data.id
      - call: POST /referrals/${ref_id}/start-review
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /referrals/${ref_id}/initiate-evaluation
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          eval_id: $.data.id
      - call: POST /evaluations/${eval_id}/request-consent
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /evaluations/${eval_id}/record-consent
        payload:
          granted: true
          responded_by_parent_ref: p
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /evaluations/${eval_id}/start
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /evaluations/${eval_id}/determine
        payload:
          determination_outcome: ELIGIBLE
          disability_impairment_found: true
          major_life_activity_affected: true
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: GET /students/${stu_id}
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_v: $.data.version
      - call: POST /plans
        payload:
          student_id: ${stu_id}
          evaluation_id: ${eval_id}
          expected_student_version: ${stu_v}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          plan_id: $.data.id
      - call: POST /accommodations
        payload:
          plan_id: ${plan_id}
          accommodation_type: EXTENDED_TIME
          description: X
          applies_to_testing: false
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: GET /plans/${plan_id}
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          plan_v: $.data.version
      - call: POST /plans/${plan_id}/submit-for-consent
        payload:
          expected_plan_version: ${plan_v}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /plans/${plan_id}/record-parent-consent
        payload:
          granted: true
          responded_by_parent_ref: p
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: GET /teacher-acks?plan_id=${plan_id}&ack_status=PENDING
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          ack_id: $.data[0].id
      trigger:
      - call: POST /teacher-acks/${ack_id}/acknowledge
        payload: {}
        as: Teacher
        as_user_id: ${t1_id}
      - call: GET /plans/${plan_id}
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          final_status: $.data.plan_status
          final_effective: $.data.plan_effective_date
      assert:
      - final_status == ACTIVE (visible immediately after ack POST)
      - final_effective != null
