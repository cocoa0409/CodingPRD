            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P18", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10, priority: "STANDARD" }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/milestones"
              payload: { project_id: "${project_id}", title: "M1", amount_cents: 40000, sequence_no: 1 }
              as: ProjectManager
              captures: { m_id: $.data.id }
            - call: "POST /genealogy/deliverables"
              payload: { project_id: "${project_id}", deliverable_type: "RESEARCH_REPORT", milestone_id: "${m_id}" }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { d_id: $.data.id }
            - call: "POST /genealogy/deliverables/${d_id}/submit"
              payload: {}
              as: Researcher
              as_user_id: "${researcher_id}"
            - call: "POST /genealogy/deliverables/${d_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /genealogy/milestones/${m_id}/invoice"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /genealogy/milestones/${m_id}/cancel"
              payload: { reason: "client withdrew scope" }
              as: ProjectManager
          assert:
            - "Milestone.${m_id}.status == CANCELLED"
            - "ResearchProject.${project_id}.invoiced_total_cents == 43000"
            - "ResearchProject.${project_id}.credited_total_cents == 43000"
            - "ResearchProject.${project_id}.outstanding_balance_cents == 0"
