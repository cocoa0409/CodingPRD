scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pme_preliminary_vs_definitive_estimate_diverge_on_both_axes
        grounds:
          - calculations.pme_cost_and_generation_impact
          - entities.PmeMeasure.fields.cost_estimate_variant
          - entities.PmeMeasure.fields.annual_generation_loss_mwh
          - endpoints["POST /relicensing/pme-measures/{measure_id}/cost-estimate"]
        distinguishing_aspect: |
          The PRELIMINARY variant lowers nothing and raises nothing uniformly: it uses a 25 percent
          contingency (higher capital) together with the head-blind flow proxy for generation loss
          (lower MWh), while DEFINITIVE uses a 10 percent contingency (lower capital) together with
          the head-based physical formula (higher MWh), so annual_cost_usd falls from 99636.35 to
          93079.99 while annual_generation_loss_mwh rises from 1036.8 to 3174.1 in the same switch.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "RelicensingProject with pad_year 2026 (PAD filed) and base_annual_generation_mwh 250000."
            - "One FISH_PASSAGE PmeMeasure created by licensee user u_lic_a with source AGENCY_PRESCRIPTION, status INCLUDED, cost_estimate_variant PRELIMINARY, capital_cost_usd 1200000.00, annual_om_cost_usd 45000.00, construction_start_year 2029, flow_release_cfs 120, gross_head_ft 85, release_days 180."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4412", project_name: "Cascade Falls", installed_capacity_mw: 24.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              as_user_id: "u_reg_1"
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD filed" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", measure_name: "Upstream fish ladder", resource_category: "FISH_PASSAGE", source: "AGENCY_PRESCRIPTION", capital_cost_usd: 1200000.00, annual_om_cost_usd: 45000.00, construction_start_year: 2029, implementation_months: 18, flow_release_cfs: 120, gross_head_ft: 85, release_days: 180 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m1: $.data.id, m1_cost_prelim: $.data.annual_cost_usd, m1_gen_prelim: $.data.annual_generation_loss_mwh }
          trigger:
            - call: "POST /relicensing/pme-measures/${m1}/cost-estimate"
              payload: { estimate_note: "definitive engineering estimate" }
              as: Licensee
              as_user_id: "u_lic_b"
              captures: { m1_cost_def: $.data.annual_cost_usd, m1_gen_def: $.data.annual_generation_loss_mwh }
          assert:
            - "PRELIMINARY setup values: PmeMeasure.${m1}.escalated_capital_usd == 1639090.50, annualized_capital_usd == 54636.35, annual_cost_usd == 99636.35, annual_generation_loss_mwh == 1036.8, annual_generation_value_usd == 43545.60, annual_burden_usd == 143181.95"
            - "PmeMeasure.${m1}.cost_estimate_variant == DEFINITIVE"
            - "PmeMeasure.${m1}.escalated_capital_usd == 1442399.64"
            - "PmeMeasure.${m1}.annualized_capital_usd == 48079.99"
            - "PmeMeasure.${m1}.annual_cost_usd == 93079.99"
            - "PmeMeasure.${m1}.annual_generation_loss_mwh == 3174.1"
            - "PmeMeasure.${m1}.annual_generation_value_usd == 133312.20"
            - "PmeMeasure.${m1}.annual_burden_usd == 226392.19"
            - "PmeMeasure.${m1}.definitive_estimate_by_user_id == u_lic_b"
            - "RelicensingProject.${proj}.total_pme_annual_cost_usd == 93079.99 and total_generation_loss_mwh == 3174.1 after the switch"
            - "RelicensingProject.${proj}.administrative_annual_charge_usd == 1861.60 and total_annual_burden_usd == 228253.79 and burden_ratio_pct == 2.17"

      - name: annual_report_calendar_vs_anniversary_basis_assess_different_sets
        grounds:
          - calculations.compliance_year_assessment
          - entities.LicenseOrder.fields.last_report_basis
          - entities.ComplianceObligation.fields.due_date
          - endpoints["POST /relicensing/orders/{order_id}/annual-report"]
        distinguishing_aspect: |
          For one order with effective_date 2026-08-01 and period_year 2027, the CALENDAR basis
          window 2027-01-01..2027-12-31 assesses all three obligations (score 33.33) while the
          LICENSE_ANNIVERSARY window 2027-08-01..2028-07-31 assesses only the two dam obligations
          (score 0.00); the divergence comes from the window bounds, not from any status change.
          Neither basis assesses the PME obligation twice.
          Both reports are filed while the project is FROZEN, which reporting is exempt from.
          Note "the licensed project chain" below is reused verbatim by later instances.
        test_recipe:
          setup:
            - "A LicenseOrder ORD-1 in EFFECTIVE with effective_date 2026-08-01, generated from a fully licensed project."
            - "Three ComplianceObligation rows: one PME_IMPLEMENTATION due 2027-02-01 (certified 2027-01-10, on time) and two dam obligations (DAM_SAFETY_INSPECTION and PUBLIC_SAFETY_SIGNAGE) due 2027-08-01, still PENDING."
            - "Logical clock advanced to 2028-09-01 and a compliance sweep run, so both dam obligations are OVERDUE, the order is COMPLIANCE_FLAGGED and the project is FROZEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4413", project_name: "Cascade Falls II", installed_capacity_mw: 24.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/dams"
              payload: { project_id: "${proj}", dam_code: "D1", hazard_class: "HIGH", inspection_interval_months: 12, eap_exercise_required: false, max_concurrent_field_activities: 1 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { dam: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 10.0, min_rest_buffer_days: 0, cultural_sensitivity: "NONE" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD filed" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "FISH_PASSAGE", study_title: "Fish passage assessment", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "START" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "COMPLETE" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "final study report" }
              as: Licensee
              as_user_id: "u_lic_report"
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { party_a: $.data.id }
            - call: "POST /relicensing/studies/${study}/review-decision"
              payload: { decision: "ACCEPT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
            - call: "POST /relicensing/water-quality-certifications"
              payload: { project_id: "${proj}", certifying_agency_name: "State DEQ" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { wqc: $.data.id }
            - call: "POST /relicensing/water-quality-certifications/${wqc}/decision"
              payload: { decision: "ISSUE_WITH_CONDITIONS", conditions: [ { measure_name: "Minimum flow release", resource_category: "WATER_QUALITY", capital_cost_usd: 600000.00, annual_om_cost_usd: 20000.00, construction_start_year: 2026, implementation_months: 6, flow_release_cfs: 40, gross_head_ft: 60, release_days: 120 } ] }
              as: StateCertifier
              as_user_id: "u_state_1"
            - call: "GET /relicensing/pme-measures"
              payload: { project_id: "${proj}", source: "WQC_CONDITION" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { wm: "$.data[0].id" }
            - call: "POST /relicensing/pme-measures/${wm}/cost-estimate"
              payload: { estimate_note: "definitive estimate for certification condition" }
              as: Licensee
              as_user_id: "u_lic_b"
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version }
            - call: "POST /relicensing/applications"
              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${pv}", filing_note: "relicense application" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { app: $.data.id }
            - call: "POST /relicensing/applications/${app}/environmental-review"
              payload: { target_stage: "SCOPING" }
              as: Regulator
            - call: "POST /relicensing/applications/${app}/environmental-review"
              payload: { target_stage: "DRAFT_EA" }
              as: Regulator
            - call: "POST /relicensing/applications/${app}/environmental-review"
              payload: { target_stage: "FINAL_EA" }
              as: Regulator
            - call: "POST /relicensing/applications/${app}/order"
              payload: { order_number: "ORD-1" }
              as: Regulator
              captures: { order: $.data.id }
            - call: "GET /relicensing/obligations"
              payload: { order_id: "${order}", obligation_type: "PME_IMPLEMENTATION" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { ob_pme: "$.data[0].id" }
            - call: "POST /relicensing/obligations/${ob_pme}/schedule"
              payload: { activity_window_start: "2027-01-05", activity_window_end: "2027-01-20" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/obligations/${ob_pme}/certify"
              payload: { certification_note: "flow release constructed" }
              as: Licensee
              as_user_id: "u_lic_cert"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects/${proj}/run-compliance-sweep"
              payload: {}
              as: Regulator
          trigger:
            - call: "POST /relicensing/orders/${order}/annual-report"
              payload: { report_basis: "CALENDAR", period_year: 2027 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { cal_assessed: $.data.assessed_obligation_count, cal_bad: $.data.noncompliant_obligation_count, cal_score: $.data.compliance_score }
            - call: "POST /relicensing/orders/${order}/annual-report"
              payload: { report_basis: "LICENSE_ANNIVERSARY", period_year: 2027 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { ann_assessed: $.data.assessed_obligation_count, ann_bad: $.data.noncompliant_obligation_count, ann_score: $.data.compliance_score }
          assert:
            - "${cal_assessed} == 3"
            - "${cal_bad} == 2"
            - "${cal_score} == 33.33"
            - "${ann_assessed} == 2"
            - "${ann_bad} == 2"
            - "${ann_score} == 0.00"
            - "LicenseOrder.${order}.last_report_basis == LICENSE_ANNIVERSARY and last_report_period_year == 2027"
            - "LicenseOrder.${order}.compliance_state == COMPLIANCE_FLAGGED after both reports (reporting never clears a flag)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pme_estimate_combines_contingency_escalation_amortization_and_head
        grounds:
          - calculations.pme_cost_and_generation_impact
          - entities.PmeMeasure.fields.escalated_capital_usd
          - entities.RelicensingProject.fields.pad_year
        distinguishing_aspect: |
          Mode (a): one output is a composition of five independent inputs — contingency multiplier,
          escalation exponent (construction_start_year minus pad_year), category amortization years,
          hydraulic head and release days — and no single-factor scaling reproduces 93079.99 from
          the raw 1200000.00 capital. Changing only construction_start_year from 2029 to 2026 moves
          annual_cost_usd to 89000.00 while annual_generation_loss_mwh stays 3174.1.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; project with pad_year 2026 and base_annual_generation_mwh 250000."
            - "No PmeMeasure exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4414", project_name: "Granite Gorge", installed_capacity_mw: 30.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
          trigger:
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", measure_name: "Escalated ladder", resource_category: "FISH_PASSAGE", source: "LICENSEE_PROPOSED", capital_cost_usd: 1200000.00, annual_om_cost_usd: 45000.00, construction_start_year: 2029, implementation_months: 18, flow_release_cfs: 120, gross_head_ft: 85, release_days: 180 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m_far: $.data.id }
            - call: "POST /relicensing/pme-measures"
              payload: { project_id: "${proj}", measure_name: "Immediate ladder", resource_category: "FISH_PASSAGE", source: "LICENSEE_PROPOSED", capital_cost_usd: 1200000.00, annual_om_cost_usd: 45000.00, construction_start_year: 2026, implementation_months: 18, flow_release_cfs: 120, gross_head_ft: 85, release_days: 180 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { m_now: $.data.id }
          assert:
            - "PmeMeasure.${m_far}.escalated_capital_usd == 1639090.50"
            - "PmeMeasure.${m_far}.annualized_capital_usd == 54636.35"
            - "PmeMeasure.${m_far}.annual_cost_usd == 99636.35"
            - "PmeMeasure.${m_far}.annual_generation_loss_mwh == 1036.8"
            - "PmeMeasure.${m_now}.escalated_capital_usd == 1500000.00"
            - "PmeMeasure.${m_now}.annualized_capital_usd == 50000.00"
            - "PmeMeasure.${m_now}.annual_cost_usd == 95000.00"
            - "PmeMeasure.${m_now}.annual_generation_loss_mwh == 1036.8"
            - "RelicensingProject.${proj}.total_pme_annual_cost_usd == 194636.35"
            - "RelicensingProject.${proj}.total_generation_loss_mwh == 2073.6"

      - name: support_tally_rounds_per_party_before_summing_and_blocks_execution
        grounds:
          - calculations.settlement_support_tally
          - validations[priority=70]
          - entities.SettlementSignature.fields.share_pct
        distinguishing_aspect: |
          Mode (b): with three equally weighted parties and two SUPPORT signatures the pinned order
          (round each share to 33.33, then sum) yields support_pct 66.66 and rejects execution with
          ERR_SUPPORT_THRESHOLD_NOT_MET, whereas summing the unrounded two-thirds first and rounding
          once yields 66.67 and would execute. The two orders differ by one cent of percentage and
          flip the outcome.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with an APPROVED study plan (so the plan precondition is satisfied)."
            - "Three SettlementParty rows each with vote_weight 1: one AGENCY with conditioning authority (u_agency), one TRIBE (u_tribe), one NGO (u_ngo)."
            - "One Settlement in CIRCULATED at round_number 1 with SUPPORT signatures from the agency and the tribe and no signature from the NGO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4415", project_name: "Three Forks", installed_capacity_mw: 18.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 4.0, min_rest_buffer_days: 0, cultural_sensitivity: "NONE" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "RECREATION", study_title: "Boat access survey", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { party_a: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Tribe", party_type: "TRIBE", has_conditioning_authority: false, vote_weight: 1, contact_user_id: "u_tribe" }
              as: Regulator
              captures: { party_t: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "Watershed Alliance", party_type: "NGO", has_conditioning_authority: false, vote_weight: 1, contact_user_id: "u_ngo" }
              as: Regulator
              captures: { party_n: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version }
            - call: "POST /relicensing/settlements"
              payload: { project_id: "${proj}", title: "Comprehensive settlement", expected_project_version: "${pv}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { stl: $.data.id }
            - call: "POST /relicensing/settlements/${stl}/circulate"
              payload: { circulation_note: "round 1" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${party_a}", position: "SUPPORT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { sig_a: $.data.id }
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${party_t}", position: "SUPPORT" }
              as: Stakeholder
              as_user_id: "u_tribe"
              captures: { sig_t: $.data.id }
          trigger:
            - call: "POST /relicensing/settlements/${stl}/tally"
              payload: { intended_outcome: "EXECUTE" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
            - call: "POST /relicensing/settlements/${stl}/tally"
              payload: { intended_outcome: "CLOSE_ROUND" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pct: $.data.support_pct, weight: $.data.total_vote_weight, st: $.data.status }
          assert:
            - "${err} == ERR_SUPPORT_THRESHOLD_NOT_MET with HTTP 422"
            - "the rejected EXECUTE left Settlement.${stl}.status == CIRCULATED and executed_at null"
            - "${pct} == 66.66 (not 66.67) on the CLOSE_ROUND tally of the same round-1 signatures"
            - "${weight} == 3"
            - "${st} == NEGOTIATING and Settlement.${stl}.round_number == 2"
            - "SettlementSignature.${sig_a}.share_pct == 33.33 and SettlementSignature.${sig_t}.share_pct == 33.33"
            - "No PmeMeasure of project ${proj} changed status"

      - name: admin_charge_tier_keyed_on_pre_charge_pme_cost_only
        grounds:
          - calculations.project_burden_ledger
          - entities.RelicensingProject.fields.administrative_annual_charge_usd
          - entities.RelicensingProject.fields.total_annual_burden_usd
        distinguishing_aspect: |
          Mode (c): the tier lookup is pinned to step 1's total_pme_annual_cost_usd, so two INCLUDED
          measures totalling 495000.00 draw the 0.02 tier (admin 9900.00) even though the resulting
          total_annual_burden_usd of 546012.00 sits above the 500000.00 tier boundary; re-running the
          lookup against the burden total would give 17325.00 and a different ratio.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; project with pad_year 2026, base_annual_generation_mwh 250000."
            - "Two INCLUDED AGENCY_PRESCRIPTION measures with no escalation: a RECREATION measure (capital 1500000.00, om 0.00 -> annual_cost 125000.00) and a CULTURAL measure (capital 2960000.00, om 0.00 -> annual_cost 370000.00), each with release_days 0 so generation loss is 0.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
