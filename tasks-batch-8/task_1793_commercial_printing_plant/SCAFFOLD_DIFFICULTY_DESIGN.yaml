            - { call: "POST /estimates/${est}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${est}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { job: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${job}", file_uri: "s3://f.pdf" }, as: PrepressOperator, captures: { proof: $.data.id } }
            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /presses", payload: { name: "W2", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${job}", run_quantity: 1000, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { run: $.data.id } }
            - { call: "GET /paper-purchase-orders", payload: { paper_stock_id: "${stock}", source: "AUTO_REPLENISH" }, as: PurchasingManager }
          trigger:
