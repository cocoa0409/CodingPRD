          assert:
            - "src_st == 'SUSPENDED' (hop 1: miss-streak auto-suspension at epoch 3)"
            - "r1_st == 'WITHDRAWN' (hop 2: suspension cascade withdraws the source's ACTIVE records)"
            - "brand == 'CLEAN' (hop 3: withdrawal rollup recomputes — TX salvage record withdrawn, CA clean remains)"
            - "cl_st == 'DENIED' (hop 4: claim sweep finds escalation gone)"

      - name: correction_apply_cascade_record_to_vehicle_rollup
        grounds:
          - state_machines.CorrectionRequest.VERIFIED_to_APPLIED
          - state_machines.HistoryRecord.ACTIVE_to_SUPERSEDED
          - calculations.vehicle_brand_rollup
          - entities.Network.fields.enrolled_listing_count
        distinguishing_aspect: |
          Depth-2 cascade triggered by a DIFFERENT transition (correction apply,
          not advance_epoch): apply supersedes the target CLEAN title with a
          corrected SALVAGE title -> supersede recomputes the vehicle rollup to
          SALVAGE, making a claim filed after the correction approvable;
          Network.enrolled_listing_count decrements only when that approval
          voids the guarantee, not at apply time.
        test_recipe:
          setup:
            - "Network; MVA source ACTIVE; vehicle V with CA clean title; dealer listing L published and enrolled (enrolled_brand CLEAN)"
            - "Owner correction against the clean record routed and source-confirmed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id, rec: $.data.id, vv: $.data.version }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /dealers/${dl}/listings"
              payload: { vehicle_id: "${veh}", asking_price_cents: 800000 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lst: $.data.id }
            - call: "POST /dealers/${dl}/listings/${lst}/publish"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lv: $.data.version }
            - call: "POST /dealers/${dl}/listings/${lst}/enroll_guarantee"
              payload: { expected_listing_version: "${lv}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /consumers"
              payload: { email: "o@x.com" }
              as: VehicleOwner
              captures: { con: $.data.id }
            - call: "POST /vehicles/${veh}/corrections"
              payload: { target_record_id: "${rec}", reason: "was salvage", corrected_record: { jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01" }, expected_vehicle_version: "${vv}" }
              as: VehicleOwner
              as_user_id: "${con}"
              captures: { cr: $.data.id }
            - call: "POST /corrections/${cr}/route_to_source"
              payload: {}
              as: NetworkAdmin
            - call: "POST /corrections/${cr}/source_confirm"
              payload: {}
              as: SourceOperator
              as_user_id: "${mva}"
          trigger:
            - call: "GET /networks/${net}"
              as: Any
              captures: { cnt_before: $.data.enrolled_listing_count }
            - call: "POST /corrections/${cr}/apply"
              payload: { resolution_action: "SUPERSEDE", corrected_record: { jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01" } }
              as: NetworkAdmin
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { brand: $.data.canonical_brand, sup_cnt: $.data.superseded_record_count }
            - call: "GET /networks/${net}"
              as: Any
              captures: { cnt_after: $.data.enrolled_listing_count }
          assert:
            - "hop 1: CorrectionRequest.${cr}.status == 'APPLIED' and HistoryRecord.${rec}.status == 'SUPERSEDED' with superseded_by_record_id set"
            - "hop 2: brand == 'SALVAGE' and sup_cnt == 1 (rollup recomputed from the supersede)"
            - "cnt_before == 1 and cnt_after == 1 (enrollment count unchanged at apply time — decrement only fires on approval's guarantee void, a different trigger)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict across different error pairs.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_source_inactive_beats_future_event
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_SOURCE_NOT_ACTIVE]
          - errors[ERR_EVENT_IN_FUTURE]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a submission to a
          PENDING source with a future event_date violates both priority 5
          (ERR_SOURCE_NOT_ACTIVE) and priority 8 (ERR_EVENT_IN_FUTURE); the
          state check wins because it runs first.
        test_recipe:
          setup:
            - "Network; MVA source registered but never activated (PENDING)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2027-06-01", damage_severity: 3, payload_ref: "x1", idempotency_key: "k-x1" }
              as: SourceOperator
              as_user_id: "${src}"
          assert:
            - "HTTP 409 with error_id == 'ERR_SOURCE_NOT_ACTIVE' (priority 5 state check precedes priority 8 temporal check)"

      - name: auth_role_beats_existence_on_claims
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Error-category pair auth vs existence: a DealerAgent filing a claim
          against a non-existent listing violates both priority 2
          (ERR_FORBIDDEN_FOR_ROLE — claims are GuaranteeAdmin-exclusive) and
          priority 3 (ERR_NOT_FOUND); the auth check wins because it runs first.
        test_recipe:
          setup:
            - "Network; dealer D registered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { listing_id: "00000000-0000-0000-0000-000000000000", claimant_name: "X", claim_reason: "y" }
              as: DealerAgent
              as_user_id: "${dl}"
          assert:
            - "HTTP 403 with error_id == 'ERR_FORBIDDEN_FOR_ROLE' (priority 2 auth precedes priority 3 existence)"

  # =====================================================================
  # Rule 6 — boundary_precision_check on different metrics/endpoints.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: subscription_window_last_valid_epoch_vs_expired
        grounds:
          - calculations.subscription_window
          - errors[ERR_SUBSCRIPTION_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Numeric threshold on the subscription-window metric via POST
          /networks/{id}/reports: epoch_index == started + 29 (last valid
          epoch, strict < 30) succeeds, while epoch_index == started + 30
          fails with ERR_SUBSCRIPTION_WINDOW_EXPIRED — the boundary is
          inclusive-exclusive on the exact epoch integer.
        test_recipe:
          setup:
            - "Network; dealer STANDARD-subscribed at epoch 0 (window [0,30)); vehicle exists"
            - "Clock advanced 29 epochs (the 29 advance_epoch calls are transcribed as a loop by the unit-test generator)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /dealers/${dl}/subscribe"
              payload: { tier: "STANDARD" }
              as: DealerAgent
              as_user_id: "${dl}"
            # LOOP x29: expand verbatim
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "DEALER_SUBSCRIPTION", buyer_dealer_id: "${dl}" }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { ok_price: $.data.price_cents }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "DEALER_SUBSCRIPTION", buyer_dealer_id: "${dl}" }
              as: DealerAgent
              as_user_id: "${dl}"
          assert:
            - "Purchase at epoch 29 (started 0 + 29, last valid epoch) succeeds with ok_price == 0 (first included report)"
            - "Purchase at epoch 30 (started + 30) -> HTTP 409 ERR_SUBSCRIPTION_WINDOW_EXPIRED (exclusive end)"

      - name: miss_streak_two_keeps_active_three_suspends
        grounds:
          - calculations.feed_reliability_decay
          - state_machines.DataSource.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Zero-submission-count metric on a different endpoint (advance_epoch):
          a source with zero submissions for exactly 2 consecutive epochs stays
          ACTIVE with reliability 80, and the third zero-submission epoch (miss
          count == 3, the >= threshold) suspends it.
        test_recipe:
          setup:
            - "Network; MVA source ACTIVE; one submission in epoch 0 (so the epoch-0 sweep does not count a miss)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 2, payload_ref: "a1", idempotency_key: "k-a1" }
              as: SourceOperator
              as_user_id: "${src}"
          trigger:
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /sources/${src}"
              as: Any
              captures: { st1: $.data.status, r1: $.data.reliability_score }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /sources/${src}"
              as: Any
              captures: { st2: $.data.status, r2: $.data.reliability_score }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /sources/${src}"
              as: Any
              captures: { st3: $.data.status, r3: $.data.reliability_score }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /sources/${src}"
              as: Any
              captures: { st4: $.data.status, r4: $.data.reliability_score }
          assert:
            - "st1 == 'ACTIVE' and r1 == 100 (epoch-0 sweep saw the submission; recovery already at ceiling)"
            - "st2 == 'ACTIVE' and r2 == 90 (first miss: 100 - 10)"
            - "st3 == 'ACTIVE' and r3 == 80 (second miss; streak 2 < 3 keeps source ACTIVE)"
            - "st4 == 'SUSPENDED' and r4 == 70 (third miss hits >= 3 threshold and suspends)"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency across different entity pairs.
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: correction_verification_gated_by_record_source_identity
        grounds:
          - state_machines.CorrectionRequest.AWAITING_SOURCE_to_VERIFIED
          - errors[ERR_NOT_RECORD_SOURCE]
          - entities.HistoryRecord.fields.source_id
        distinguishing_aspect: |
          Entity pair CorrectionRequest -> DataSource: the
          AWAITING_SOURCE->VERIFIED transition is only permitted to the
          SourceOperator whose identity equals the TARGET RECORD's source_id —
          a different active source in good standing is rejected with
          ERR_NOT_RECORD_SOURCE.
        test_recipe:
          setup:
            - "Network; MVA source and INSURER source both ACTIVE; vehicle with MVA title record; correction routed to source"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "INSURER", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { ins: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /sources/${ins}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id, rec: $.data.id, vv: $.data.version }
            - call: "POST /consumers"
              payload: { email: "o@x.com" }
