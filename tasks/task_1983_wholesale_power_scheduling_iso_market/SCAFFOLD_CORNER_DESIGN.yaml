# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of every §1.1–§1.7 claim that
# §1.8 does not already exercise. Sections follow the claim-extraction guide.
# Names are unique across the union of §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: participant_create_applies_defaults
        claim_type: defaults
        grounds: [entities.MarketParticipant.fields.status, entities.MarketParticipant.fields.posted_collateral_cents, entities.MarketParticipant.fields.unsecured_allowance_cents]
        distinguishing_aspect: "Fresh participant starts ACTIVE with zeroed computed credit fields and the tier-driven allowance applied; system id is a prefix-less UUID."
        test_recipe:
          setup: ["empty DB; logical clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Defaults Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id, p_status: $.data.status, p_posted: $.data.posted_collateral_cents, p_req: $.data.collateral_requirement_cents, p_alw: $.data.unsecured_allowance_cents, p_v: $.data.version }
          trigger:
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
          assert:
            - "status == ACTIVE, posted_collateral_cents == 0, collateral_requirement_cents == 0, version == 1"
            - "unsecured_allowance_cents == 100000 for INVESTMENT_GRADE (0 for BELOW_INVESTMENT_GRADE)"
            - "id matches UUID format with no type prefix; created_at/updated_at are ISO8601 UTC with three fractional digits"

      - name: generator_availability_computed_on_create
        claim_type: computed_fields
        grounds: [entities.GeneratorAsset.fields.availability_mw]
        distinguishing_aspect: "availability_mw is computed (== capacity_mw with no covering outages) — a client-supplied availability_mw would be ignored."
        test_recipe:
          setup: ["participant exists"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Gen Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 12.5 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_avail: $.data.availability_mw, g_status: $.data.status }
          assert:
            - "GeneratorAsset.${g_id}.availability_mw == 12.5 (computed from capacity_mw, no APPROVED outage covering the clock)"
            - "status == AVAILABLE"

      - name: operating_day_duplicate_date_rejected
        claim_type: type_constraints
        grounds: [entities.OperatingDay.fields.market_date, "errors[ERR_OPERATING_DAY_EXISTS]"]
        distinguishing_aspect: "market_date uniqueness: second OperatingDay with the same market_date is rejected even though all fields are well-formed."
        test_recipe:
          setup: ["one operating day for 2026-08-03 exists"]
          setup_api_calls:
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T11:30:00Z" }
              as: IsoOperator
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_OPERATING_DAY_EXISTS (409)"

      - name: get_offer_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a well-formed but non-existent offer id returns the 404 envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "NF Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
          trigger:
            - call: "GET /market/offers/00000000-0000-0000-0000-000000000000"
              as: Trader
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404; envelope response_type == 'error'"

      - name: offer_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required offered_mw from the offer payload is a schema-level rejection before any state/fiscal check."
        test_recipe:
          setup: ["participant, generator, and DA_OPEN day exist"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Req Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
          trigger:
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400) — offered_mw is required"

      - name: participant_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.MarketParticipant.fields.credit_rating_tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "credit_rating_tier outside the declared enum set is rejected at request-schema priority."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IsoOperator
          trigger:
            - call: "POST /market/participants"
              payload: { company_name: "Enum Co", credit_rating_tier: "AAA" }
              as: IsoOperator
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: telemetry_resubmission_supersedes_prior_row
        claim_type: immutability
        grounds: [state_machines.RealTimeTelemetry.RECORDED_to_SUPERSEDED]
        distinguishing_aspect: "Telemetry rows are never updated in place — a corrected reading for the same (generator, day, interval) supersedes the prior row."
        test_recipe:
          setup: ["participant + generator; day gated (telemetry window open)"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Tel Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 5 } ] }
              as: Trader
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /market/generators/${g_id}"
              as: IsoOperator
              captures: { g_v2: $.data.version }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v2}", readings: [ { interval_index: 1, actual_mw: 7 } ] }
              as: Trader
              as_user_id: "${p_id}"
            - call: "GET /market/telemetry"
              payload: { generator_asset_id: "${g_id}", operating_day_id: "${d_id}", interval_index: 1 }
              as: IsoOperator
              captures: { t_old: "$.data[0].status", t_new: "$.data[1].status" }
          assert:
            - "First reading row status == SUPERSEDED (created_at ASC order), second == RECORDED with actual_mw 7"
            - "Both rows remain queryable — supersede is non-destructive"

      - name: price_nodes_listed_under_day
        claim_type: parent_relationships
        grounds: [entities.PriceNode.fields.operating_day_id]
        distinguishing_aspect: "PriceNode rows created by the DA run are discoverable via the sub-resource list under the operating day (FK reverse-reachability)."
        test_recipe:
          setup: ["operating day created"]
          setup_api_calls:
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 }, { node_name: "EAST_HUB", da_energy_cents_per_mwh: 5100, da_congestion_cents_per_mwh: 50, da_loss_cents_per_mwh: 60 } ] }
              as: IsoOperator
            - call: "GET /market/operating-days/${d_id}/price-nodes"
              as: IsoOperator
              captures: { n0: "$.data[0].node_name", n1: "$.data[1].node_name" }
          assert:
            - "Two PriceNode rows returned (WEST_HUB, EAST_HUB) with their DA components persisted"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: offer_submit_after_expire_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DayAheadOffer.DRAFT_to_EXPIRED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "A DRAFT offer that misses the DA run expires; EXPIRED is terminal, so submit is rejected with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["offer created DRAFT but never submitted; DA run executes"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Exp Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 10, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
          trigger:
            - call: "POST /market/offers/${o_id}/submit"
              as: Trader
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
            - call: "GET /market/offers/${o_id}"
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_st: $.data.status }
          assert:
            - "Offer went DRAFT → EXPIRED at the DA run; submit returns ERR_INVALID_STATE_TRANSITION (409)"
            - "DayAheadOffer.${o_id}.status == EXPIRED (terminal lockdown)"

      - name: outage_cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.OutageReport.SUBMITTED_to_CANCELLED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "CANCELLED is terminal for outage reports — acknowledge/approve on a cancelled report are rejected."
        test_recipe:
          setup: ["outage filed and cancelled"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Term Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 25, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-06T00:00:00Z", reason: "r1" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_id: $.data.id }
            - { call: "POST /market/outages/${out_id}/cancel", as: Trader, as_user_id: "${p_id}" }
          trigger:
            - call: "POST /market/outages/${out_id}/approve"
              as: IsoOperator
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; OutageReport.${out_id}.status remains CANCELLED"

      - name: margin_call_defaults_after_cure_deadline
        claim_type: valid_transition
        grounds: [state_machines.MarginCall.OPEN_to_DEFAULTED, calculations.credit_posture_evaluation, state_machines.MarketParticipant.MARGIN_CALL_to_SUSPENDED]
        distinguishing_aspect: "Cure-window boundary: at exactly due_at the call is still OPEN; one second later the evaluation defaults it and suspends the participant."
        test_recipe:
          setup:
            - "BELOW_INVESTMENT_GRADE participant; obligation 10 MW @ 1000000; full outage covering 2026-08-05 approved → margin call OPEN 500000, due_at 2026-08-06T00:00:00Z"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Def Co", credit_rating_tier: "BELOW_INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - { call: "POST /market/obligations", payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "FULL", derate_pct: 100, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-07T00:00:00Z", reason: "forced" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_id: $.data.id }
            - { call: "POST /market/outages/${out_id}/acknowledge", as: IsoOperator }
            - { call: "POST /market/outages/${out_id}/approve", as: IsoOperator }
            - call: "GET /market/margin-calls"
              payload: { market_participant_id: "${p_id}" }
              as: IsoOperator
              captures: { mc_id: "$.data[0].id", mc_due: "$.data[0].due_at" }
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants/${p_id}/evaluate-credit"
              as: IsoOperator
              captures: { p_st1: $.data.status }
            - call: "GET /market/margin-calls/${mc_id}"
              as: IsoOperator
              captures: { mc_st1: $.data.status }
          trigger:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:01Z" }, as: IsoOperator }
            - call: "POST /market/participants/${p_id}/evaluate-credit"
              as: IsoOperator
              captures: { p_st2: $.data.status }
            - call: "GET /market/margin-calls/${mc_id}"
              as: IsoOperator
              captures: { mc_st2: $.data.status }
          assert:
            - "At exactly due_at: MarginCall still OPEN and participant still MARGIN_CALL (cure would be accepted; default requires strictly past)"
            - "One second past due_at: MarginCall.${mc_id}.status == DEFAULTED and participant status == SUSPENDED"

      - name: offer_submit_blocked_when_participant_suspended
        claim_type: precondition_enforcement
        grounds: [state_machines.DayAheadOffer.DRAFT_to_SUBMITTED, "errors[ERR_PARTICIPANT_SUSPENDED]"]
        distinguishing_aspect: "A SUSPENDED participant's trader cannot submit offers — cross-entity gate on MarketParticipant.status."
        test_recipe:
          setup: ["participant defaulted into SUSPENDED (same cascade as margin_call_defaults_after_cure_deadline); fresh DA_OPEN day with a DRAFT offer created while healthy is unavailable — offer must be created BEFORE default; instead create day+offer before the default sequence"]
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Susp Co", credit_rating_tier: "BELOW_INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-08", da_gate_close_at: "2026-08-07T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 5, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /market/obligations", payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "FULL", derate_pct: 100, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-06T00:00:00Z", reason: "forced" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { out_id: $.data.id }
            - { call: "POST /market/outages/${out_id}/acknowledge", as: IsoOperator }
            - { call: "POST /market/outages/${out_id}/approve", as: IsoOperator }
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:01Z" }, as: IsoOperator }
            - { call: "POST /market/participants/${p_id}/evaluate-credit", as: IsoOperator }
            - { call: "POST /market/outages/${out_id}/cancel", as: Trader, as_user_id: "${p_id}" }
          trigger:
            - call: "POST /market/offers/${o_id}/submit"
              as: Trader
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
          assert:
            - "Participant is SUSPENDED (margin call defaulted); outage cancelled so the generator is AVAILABLE again — the ONLY failing precondition is the participant gate"
            - "error_id == ERR_PARTICIPANT_SUSPENDED (409); offer stays DRAFT"

      - name: day_close_blocked_by_unresolved_dispute
        claim_type: precondition_enforcement
        grounds: [state_machines.OperatingDay.FINAL_SETTLED_to_CLOSED, "errors[ERR_UNRESOLVED_DISPUTES]"]
        distinguishing_aspect: "Day close is gated on dispute resolution — one FILED dispute on any statement of the day blocks the epoch transition."
        test_recipe:
          setup: ["settled day with FINAL statement; dispute filed (statement UNDER_DISPUTE)"]
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Blk Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 10, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /market/offers/${o_id}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 } ] }
              as: IsoOperator
            - call: "POST /market/generators/${g_id}/telemetry"
              payload:
                operating_day_id: "${d_id}"
                expected_generator_asset_version: "${g_v}"
                readings: [ { interval_index: 1, actual_mw: 10 }, { interval_index: 2, actual_mw: 10 }, { interval_index: 3, actual_mw: 10 }, { interval_index: 4, actual_mw: 10 }, { interval_index: 5, actual_mw: 10 }, { interval_index: 6, actual_mw: 10 }, { interval_index: 7, actual_mw: 10 }, { interval_index: 8, actual_mw: 10 }, { interval_index: 9, actual_mw: 10 }, { interval_index: 10, actual_mw: 10 }, { interval_index: 11, actual_mw: 10 }, { interval_index: 12, actual_mw: 10 }, { interval_index: 13, actual_mw: 10 }, { interval_index: 14, actual_mw: 10 }, { interval_index: 15, actual_mw: 10 }, { interval_index: 16, actual_mw: 10 }, { interval_index: 17, actual_mw: 10 }, { interval_index: 18, actual_mw: 10 }, { interval_index: 19, actual_mw: 10 }, { interval_index: 20, actual_mw: 10 }, { interval_index: 21, actual_mw: 10 }, { interval_index: 22, actual_mw: 10 }, { interval_index: 23, actual_mw: 10 }, { interval_index: 24, actual_mw: 10 } ]
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [ { node_name: "WEST_HUB", rt_prelim_energy_cents_per_mwh: 4000, rt_prelim_congestion_cents_per_mwh: 50, rt_prelim_loss_cents_per_mwh: 25 } ] }
