          assert:
            - "Organization.${org_id}.standing == SUSPENDED and no_show_count == 3"
            - "${err} == ERR_ORG_SUSPENDED (http 409); no event persisted"

      - name: probation_confirm_requires_full_prepayment
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREPAYMENT_REQUIRED]", state_machines.EventReservation.APPROVED_to_CONFIRMED]
        distinguishing_aspect: "A PROBATION org (exactly 2 no-shows) confirming without prepayment gets 402 ERR_PREPAYMENT_REQUIRED; paying the provisional invoice to exactly paid+waived == total flips the same confirm to success (inclusive boundary)."
        test_recipe:
          setup: ["Org with 2 no-shows (events 08:00-09:00 and 09:00-10:00 on 2026-09-10, room buffer 0); new event 2026-09-21 14:00-15:00 approved (provisional total 1000)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Flake Jr", org_type: "INTERNAL_DEPARTMENT", contact_email: "fj@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
