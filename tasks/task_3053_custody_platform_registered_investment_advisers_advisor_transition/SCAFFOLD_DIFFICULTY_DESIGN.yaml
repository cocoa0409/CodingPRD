          - calculations.block_trade_average_price_allocation.precision
          - calculations.over_allocation_credit
          - state_machines.BlockOrder.EXECUTED_to_ALLOCATED
        distinguishing_aspect: "Rounding order is pinned: rounding each allocation's cost independently to the cent (ALLOCATE_THEN_ROUND) sums to 5237501 cents against a block notional of 5237500, whereas rounding the block first and splitting afterwards cannot exceed 5237500 — the pinned order is therefore observable as a one-cent excess that C4 must then credit back to 0."
