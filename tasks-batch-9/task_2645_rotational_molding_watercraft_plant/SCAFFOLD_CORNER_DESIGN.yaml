              as_user_id: "${t_op}"
              captures: { pov_a: $.data.version }
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T10:35:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /finished-units?molding_cycle_id=${cyc}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { d_fu1: "$.data[0].id", d_fu2: "$.data[1].id" }
            - call: "GET /molds/${mold}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { mcs_b: $.data.cycles_since_service }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { pov_b: $.data.version }
          assert:
            - "the demould returns 200 with status 'DEMOLDED' and actual_cooling_end_at '2026-08-01T10:35:00Z'"
            - "GET /finished-units?molding_cycle_id=${cyc} returns total_count 2 — one hull per cavity — and both rows carry build_status 'DEMOLDED', logistics_status 'UNALLOCATED', product_model_id ${pm} and a non-empty hull_serial"
            - "${mcs_a} == 0 and ${mcs_b} == 1: the counter rises by exactly one per demoulded cycle, and Mold.${mold}.status is back to 'AVAILABLE'"
            - "ResinLot.${lot} still reports available_kg 476.000, reserved_kg 0.000 and consumed_kg 24.000: the demould moves no resin because the charge was consumed at oven start"
            - "${pov_b} == ${pov_a} + 1, ProductionOrder.${po}.status == 'IN_PRODUCTION' and completed_qty == 0, because a DEMOLDED hull is not yet SELLABLE"
            - "GET /molding-cycles/${cyc} reports scheduled_cooling_minutes 30 and an actual cooling span of 35 minutes, so ERR_COOLING_TIME_INSUFFICIENT never applies"
            - "FinishedUnit.${d_fu1}.is_zone_anchor is false and warehouse_id is null on both hulls: the demould cascade does not store anything"

      - name: layer_dual_variant_calculation_oven_window_same_arm_versus_different_arm_same_station
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.oven_arm_window_check
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - errors.ERR_INVALID_QUANTITY
          - validations.priority_22
          - validations.priority_62
        distinguishing_aspect: |
          Two cycles whose oven windows are IDENTICAL to the second coexist on
          arm 1 and arm 2 of the same station (the DIFFERENT_ARM_SAME_STATION
          variant ignores the changeover buffer entirely), while a third cycle
          with that same window on arm 1 is refused 409 ERR_OVEN_WINDOW_CONFLICT
          — and the refusal comes from priority 62, before the mould pool at
          priority 70 and before the build quota at priority 79, both of which
          would also have failed.
        test_recipe:
          setup:
            - "Two moulds MLD-CD-1 and MLD-CD-2 for PM-CD-KM, each cavity_count 2 and cycles_since_service 0, so two cycles can run concurrently."
            - "OvenStation OVN-CD-1 has arm_count 2 and changeover_buffer_min 15; CoolingBay BAY-CD-1 has concurrent_slot_capacity 2."
            - "ProductionOrder PO-CD-4 (ordered_qty 4) is released, and cycles CYC-A on arm 1 and CYC-B on arm 2 both occupy exactly 2026-08-01T09:00:00Z to 10:00:00Z with 30 minutes of cooling."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_mold2
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_wh
            - *cd2_lot
            - *cd2_po4
            - *cd2_po4rel
            - *cd2_cyc
            - *cd2_chg
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v2: $.data.version }
            - *cd2_cycb
          trigger:
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v20: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v20}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 3, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T14:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v20}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "CYC-A and CYC-B both exist in status 'SCHEDULED' with oven_station_id ${station}, identical oven_start_at '2026-08-01T09:00:00Z' and arm_index 1 and 2 respectively — the DIFFERENT_ARM_SAME_STATION variant permits a fully coincident window with no buffer at all"
            - "CYC-A holds mold_id ${mold} and CYC-B holds mold_id ${mold2}: the two cycles are separated by tool as well as by arm"
            - "the third create on arm 1 returns status 409 with data.error_id 'ERR_OVEN_WINDOW_CONFLICT', NOT 'ERR_NO_ELIGIBLE_MOLD' and NOT 'ERR_ORDER_OVERBUILD', even though both moulds are occupied over that span and the 4-unit quota is already filled by two 2-cavity cycles"
            - "ProductionOrder.${po}.version == ${po_v20} after that refusal and GET /molding-cycles?production_order_id=${po} still returns total_count 2"
            - "the arm_index 3 create returns status 422 with data.error_id 'ERR_INVALID_QUANTITY' because OvenStation.${station}.arm_count is 2 — the range check at priority 22 fires before the overlap check at priority 62, so a nonexistent arm is never treated as a free arm"

      # ---- layers already asserted by §1.8 (difficulty design) ----
      - name: layer_dual_variant_calculation_freight_quoted_nested_versus_billed_gross
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.freight_charge
        excluded_because:
          difficulty_instance: "dual_variant_calc / freight_quote_nested_vs_bill_gross_divergence"
          rationale: "That instance seals a trailer to obtain the QUOTED variant over nested cube and delivers it to obtain the BILLED variant over gross cube on the same hulls, asserting both cent figures and their divergence, which is exactly this layer's claim."

      - name: layer_dual_variant_calculation_warpage_provisional_versus_final
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.warpage_allowance
        excluded_because:
          difficulty_instance: "dual_variant_calc / warpage_provisional_schedule_vs_final_actual_divergence"
          rationale: "That instance computes the provisional variant from scheduled minutes and the final variant from actual minutes on one cycle and asserts the two results differ, so the variant switch is already bound to its trigger condition."

      - name: layer_dual_variant_calculation_mold_selector_first_attempt_versus_retry
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.mold_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / mold_selection_first_attempt_vs_retry_with_exclusions"
          rationale: "That instance runs POST /molding-cycles without exclude_mold_ids and then with it, asserting the first-ranked and second-ranked tools respectively and the empty-pool fallback, which covers both declared variants of the selector."

      - name: layer_cascading_side_effects_transitive_chain_across_three_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Mold
          - state_machines.ProductionOrder
        excluded_because:
          difficulty_instance: "transitive_cascade / demold_service_cascade_unblocks_three_resin_blocked_orders"
          rationale: "That instance drives the full transitive chain — demould raises cycles_since_service to the service interval, the mould goes to MAINTENANCE, its SCHEDULED cycles abort, their charges release resin, and three BLOCKED_RESIN orders return to READY_TO_SCHEDULE — so the multi-hop cascade is already asserted end to end."

  # ===========================================================================
  # SECTION: consistency_model
  # Claim row from claim-extraction-guide.md "From Consistency Model". The
  # profile declares consistency_model: immediate, so every claim below asserts
  # that a write's effects — including its OCC version bump and its cascades —
  # are fully visible to the very next request, and that the ONLY concurrency
  # mechanism is optimistic concurrency on a named parent version (412), never a
  # lock, a retry window or a first-writer-wins race.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: occ_cycle_create_stale_order_version_then_the_refreshed_version_succeeds
        claim_type: immediate
        grounds:
          - concurrency_rules.cycle-create-stale-order
          - errors.ERR_STALE_PRODUCTION_ORDER_VERSION
          - validations.priority_80
        distinguishing_aspect: |
          The second cycle is legitimate in every other respect — free arm, free
          tool, quota headroom of exactly 4 units and a free cooling slot — so the
          only reason it is refused is that the first create advanced
          ProductionOrder.version, and re-reading that version makes the same
          request succeed.
        test_recipe:
          setup:
            - "Two moulds MLD-CD-1 and MLD-CD-2 for PM-CD-KM, each cavity_count 2, both AVAILABLE with cycles_since_service 0."
            - "OvenStation OVN-CD-1 (arm_count 2) and CoolingBay BAY-CD-1 (concurrent_slot_capacity 2), both OPERATIONAL."
            - "ProductionOrder PO-CD-4 (ordered_qty 4, no demand_bucket_id) is READY_TO_SCHEDULE, so two 2-cavity cycles fit inside floor(4 * 1.20) = 4."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_mold2
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_wh
            - *cd2_lot
            - *cd2_po4
            - *cd2_po4rel
          trigger:
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { ov_a: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${ov_a}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_a: $.data.id }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${ov_a}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { ov_b: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${ov_b}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_b: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { ov_c: $.data.version }
          assert:
            - "the first create returns 201 with status 'SCHEDULED', mold_id ${mold} and arm_index 1"
            - "the second create with the pre-read version returns status 412 with data.error_id 'ERR_STALE_PRODUCTION_ORDER_VERSION'"
            - "GET /molding-cycles?production_order_id=${po} returns total_count 1 immediately after the 412 — the refusal created nothing"
            - "${ov_b} == ${ov_a} + 1: the first create's bump is visible to the very next read, with no settle step"
            - "the retry with ${ov_b} returns 201 with arm_index 2 and mold_id ${mold2}, proving the request itself was always valid"
            - "${ov_c} == ${ov_b} + 1 and GET /molding-cycles?production_order_id=${po} returns total_count 2"
            - "no request in this instance ever waits, retries internally or returns a lock or conflict-retry hint: the only concurrency signal is the 412 on a named parent version"

      - name: occ_charge_create_stale_resin_lot_version_preserves_the_mass_ledger
        claim_type: immediate
        grounds:
          - concurrency_rules.charge-create-stale-resin-lot
          - errors.ERR_STALE_RESIN_LOT_VERSION
          - validations.priority_81
        distinguishing_aspect: |
          The refused reservation leaves the three-bucket ledger exactly where the
          first reservation left it (available 476.000, reserved 24.000, consumed
          0.000, summing to the 500.000 kg receipt), and the retry with the
          refreshed version moves precisely one more charge's worth of mass — so
          a 412 that had partially reserved would be caught by the invariant.
        test_recipe:
          setup:
            - "PO-CD-4 released with cycle CYC-A on arm 1 and cycle CYC-B on arm 2, both SCHEDULED over 09:00-10:00 with 30 minutes of cooling, on moulds MLD-CD-1 and MLD-CD-2."
            - "LOT-CD-1 holds its full 500.000 kg receipt: available 500.000, reserved 0.000, consumed 0.000, status AVAILABLE, regrind 10.00 pct."
            - "T-CD-RES-1 is ACTIVE and holds RESIN_BLENDING; the logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_mold2
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_wh
            - *cd2_lot
            - *cd2_po4
            - *cd2_po4rel
            - *cd2_cyc
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v2: $.data.version }
            - *cd2_cycb
          trigger:
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { rl_a: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${rl_a}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chg_a: $.data.id }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cycb}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${rl_a}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { rl_b: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cycb}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${rl_b}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chg_b: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { rl_c: $.data.version }
          assert:
            - "the first charge returns 201 with status 'RESERVED' and charge_kg 24.000"
            - "the second charge with the pre-read version returns status 412 with data.error_id 'ERR_STALE_RESIN_LOT_VERSION' — not ERR_RESIN_LOT_NOT_AVAILABLE and not ERR_REGRIND_LIMIT_EXCEEDED, both of which pass"
            - "immediately after the 412 ResinLot.${lot} reports available_kg 476.000, reserved_kg 24.000 and consumed_kg 0.000, summing to received_kg 500.000"
            - "GET /resin-charges?molding_cycle_id=${cycb} returns total_count 0 after the 412"
            - "${rl_b} == ${rl_a} + 1 and the retry with ${rl_b} returns 201 with status 'RESERVED'"
            - "${rl_c} == ${rl_b} + 1 and ResinLot.${lot} then reports available_kg 452.000, reserved_kg 48.000, consumed_kg 0.000 — still exactly 500.000 kg in total"

      - name: occ_store_unit_stale_warehouse_version_after_the_sibling_hull_lands
        claim_type: immediate
        grounds:
          - concurrency_rules.store-unit-stale-warehouse
          - errors.ERR_STALE_WAREHOUSE_VERSION
          - validations.priority_82
        distinguishing_aspect: |
          Both hulls are SELLABLE and UNALLOCATED and the site has 20.0000 m3 of
          capacity, so storing the second hull can only fail on the version the
          first store advanced; the refreshed retry then nests it at 1.0000 m3
          behind the 2.0000 m3 anchor, which the footprint summary shows in the
          request immediately after.
        test_recipe:
          setup:
            - "Base plant with both hulls SELLABLE and UNALLOCATED, nothing stored yet."
            - "Warehouse WH-CD has one zone Z-A of 20.0000 m3 and thresholds 85.00 / 95.00, so the site posture stays NORMAL throughout."
            - "Logical clock at 2026-08-01T10:35:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
          trigger:
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { sw_a: $.data.version }
            - call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${sw_a}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${sw_a}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { sw_b: $.data.version }
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${sw_b}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { sw_c: $.data.version }
          assert:
            - "the first store returns 200 with logistics_status 'STORED', is_zone_anchor true and footprint_cube_m3 2.0000"
            - "the second store with the pre-read version returns status 412 with data.error_id 'ERR_STALE_WAREHOUSE_VERSION' — not ERR_WAREHOUSE_FROZEN and not ERR_WAREHOUSE_CUBE_EXCEEDED, both of which pass at 10.00 pct utilisation"
            - "immediately after the 412 FinishedUnit.${fu2}.logistics_status is still 'UNALLOCATED' and Warehouse.${wh}.committed_cube_m3 is still 2.0000"
            - "${sw_b} == ${sw_a} + 1 and the retry with ${sw_b} returns 200 with is_zone_anchor false and footprint_cube_m3 1.0000"
            - "the footprint summary read in the very next request reports zone Z-A committed_cube_m3 3.0000, remaining_cube_m3 17.0000, utilization_pct 15.00 and posture 'NORMAL', with one anchor for PM-CD-KM"
            - "${sw_c} == ${sw_b} + 1: exactly two successful stores produced exactly two version bumps"

      - name: occ_line_create_stale_shipment_version_before_the_nest_position_is_taken
        claim_type: immediate
