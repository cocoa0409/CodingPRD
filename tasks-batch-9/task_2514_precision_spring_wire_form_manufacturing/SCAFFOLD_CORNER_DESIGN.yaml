        captures:
          wl_id: $.data.id
      assert:
      - HTTP 404
      - data.error_id == 'ERR_MATERIAL_SPEC_NOT_FOUND'
      - GET /wire-lots as QualityInspector returns total_count == 0
  - name: tooling_create_against_an_unknown_design_is_not_found
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DESIGN_NOT_FOUND]
