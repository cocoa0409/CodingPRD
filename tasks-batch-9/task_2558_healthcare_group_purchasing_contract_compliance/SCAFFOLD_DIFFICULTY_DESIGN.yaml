              as: ContractManager
              as_user_id: "CM-1"
              captures: { a1_status_after_endorse: $.data.status }
            - call: "POST /gpo/commitments/${k1}/open-requalification"
              payload: { reason: "September requalification opened before the exception was approved." }
              as: ComplianceAnalyst
            - call: "POST /gpo/price-activations/${a1}/approve"
              payload: {}
              as: ContractManager
              as_user_id: "CM-2"
