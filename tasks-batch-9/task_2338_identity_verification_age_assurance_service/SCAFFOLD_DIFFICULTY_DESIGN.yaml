            - "VerificationSession.${s_id}.identity_state == VERIFIED, disposition_reason == SCORE_SATISFIED, assurance_score_final == 31 and completed_at == 2026-08-10T09:00:00Z"
            - "Client.${client_id}.stored_template_count == 0"
            - "GET /idv/verification-sessions/${s_id}/audit-events?event_type=TEMPLATE_DELETED returns total_count == 1"

  # =====================================================================================
  # RULE 7 — cross_entity_state_dependency
  # Three different entity pairs: MethodAttempt<-Client, BiasAudit<-MethodProfile,
  # MethodAttempt<-VerificationPolicy.
  # =====================================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: attempt_creation_blocked_by_suspended_client_state
        grounds:
          - validations[priority=24]
          - entities.Client.fields.integration_state
          - entities.MethodAttempt.fields.session_id
          - state_machines.MethodAttempt.state.AWAITING_EVIDENCE_to_SCORED
        distinguishing_aspect: |
          Entity pair MethodAttempt <- Client: the session itself is untouched and IN_PROGRESS, but
          because the owning Client moved to SUSPENDED after the session opened, adding an attempt
          must fail with ERR_CLIENT_NOT_LIVE while the same call succeeded before the suspension.
        test_recipe:
          setup:
            - "Client Acme X1 is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN, min_assurance_score 60, doc floor 8000, no age gate; PUBLISHED."
            - "Session subj-r7a is open and IN_PROGRESS, and a first DOCUMENT_SCAN attempt A1 was created successfully while the client was LIVE."
            - "The client is then PATCHed to SUSPENDED; the session stays IN_PROGRESS."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme X1", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r7a", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "SUSPENDED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 409 and $.data.error_id == ERR_CLIENT_NOT_LIVE"
            - "GET /idv/method-attempts?session_id=${s_id} returns total_count == 1 with data[0].id == ${a1}"
            - "VerificationSession.${s_id}.identity_state == IN_PROGRESS and Client.${client_id}.integration_state == SUSPENDED"

      - name: bias_evaluation_blocked_by_restricted_profile_state_on_second_audit
        grounds:
          - validations[priority=26]
          - entities.MethodProfile.fields.bias_state
          - state_machines.BiasAudit.state.COLLECTING_to_REMEDIATION_REQUIRED
          - calculations.cohort_disparity_evaluation
        distinguishing_aspect: |
          Entity pair BiasAudit <- MethodProfile: the second audit is itself perfectly valid
          (COLLECTING, three in-scope cohorts, non-overlapping window), yet evaluation must fail with
          ERR_METHOD_RESTRICTED_BY_BIAS purely because the audited MethodProfile is RESTRICTED.
        test_recipe:
          setup:
            - "A DOCUMENT_SCAN profile docv1 exists."
            - "Audit A1 over 2026-06-01 -> 2026-07-01 collected frr 500 / 300 / 400 cohorts and its evaluation drove the profile to RESTRICTED, leaving A1 in REMEDIATION_REQUIRED."
            - "Audit A2 over the adjacent window 2026-07-01 -> 2026-08-01 was accepted and holds three cohorts with mild frr 400 / 410 / 390."
          setup_api_calls:
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_doc_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit1_id: "$.data.id" }
            - call: "POST /idv/bias-audits/${audit1_id}/cohort-metrics"
              payload: { cohort_code: "AGE_18_24", attempt_count: 1000, false_reject_count: 50, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit1_id}/cohort-metrics"
              payload: { cohort_code: "AGE_25_44", attempt_count: 1000, false_reject_count: 30, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit1_id}/cohort-metrics"
              payload: { cohort_code: "AGE_65_PLUS", attempt_count: 1000, false_reject_count: 40, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit1_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_doc_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit2_id: "$.data.id" }
            - call: "POST /idv/bias-audits/${audit2_id}/cohort-metrics"
              payload: { cohort_code: "AGE_18_24", attempt_count: 1000, false_reject_count: 40, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit2_id}/cohort-metrics"
              payload: { cohort_code: "AGE_25_44", attempt_count: 1000, false_reject_count: 41, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit2_id}/cohort-metrics"
              payload: { cohort_code: "AGE_65_PLUS", attempt_count: 1000, false_reject_count: 39, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /idv/bias-audits/${audit2_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 409 and $.data.error_id == ERR_METHOD_RESTRICTED_BY_BIAS"
            - "BiasAudit.${audit2_id}.state == COLLECTING with disparity_ratio_max_to_pooled_bps == null and evaluated_by_user_id == null"
            - "BiasAudit.${audit1_id}.state == REMEDIATION_REQUIRED and MethodProfile.${p_doc_id}.bias_state == RESTRICTED"
            - "GET /idv/method-profiles/${p_doc_id}/bias-audits returns total_count == 2"

      - name: attempt_creation_blocked_by_retired_pinned_policy_state
        grounds:
          - validations[priority=25]
          - state_machines.VerificationPolicy.state.PUBLISHED_to_RETIRED
          - entities.VerificationSession.fields.policy_id
          - concurrency_rules[policy-publication-supersede]
        distinguishing_aspect: |
          Entity pair MethodAttempt <- VerificationPolicy: the client is LIVE and the session is
          IN_PROGRESS, but the policy the session pinned at creation was superseded to RETIRED by the
          publication of policy_version 2, so adding an attempt must fail with
          ERR_PINNED_POLICY_RETIRED.
        test_recipe:
          setup:
            - "Client Acme X3 is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 (DOCUMENT_SCAN, min_assurance_score 60, doc floor 8000) is PUBLISHED and session subj-r7c pins it."
            - "The client version observed after the first publication is captured, then policy v2 is created and published, which supersedes v1 to RETIRED."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme X3", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v1: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy1_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy1_id}/publish"
              payload: { expected_client_version: "${client_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r7c", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 2, allowed_method_codes: ["DOCUMENT_SCAN", "DATABASE_CHECK"], min_assurance_score: 50, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy2_id: "$.data.id" }
            - call: "GET /idv/clients/${client_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v2: "$.data.version" }
            - call: "POST /idv/verification-policies/${policy2_id}/publish"
              payload: { expected_client_version: "${client_v2}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 409 and $.data.error_id == ERR_PINNED_POLICY_RETIRED"
            - "VerificationPolicy.${policy1_id}.state == RETIRED and VerificationPolicy.${policy2_id}.state == PUBLISHED"
            - "VerificationSession.${s_id}.policy_id == ${policy1_id} and identity_state == IN_PROGRESS"
            - "GET /idv/method-attempts?session_id=${s_id} returns total_count == 0"

  # =====================================================================================
  # RULE 8 — resource_temporal_overlap
  # Two different resources with two different interval semantics.
  # =====================================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bias_audit_windows_half_open_adjacency_admitted_containment_rejected
        grounds:
          - validations[priority=39]
          - entities.BiasAudit.fields.window_start
          - entities.BiasAudit.fields.window_end
          - entities.BiasAudit.fields.method_profile_id
        distinguishing_aspect: |
          Resource MethodProfile with half-open [window_start, window_end) semantics and capacity 1:
          an audit starting exactly where the previous one ends is admitted, while an audit strictly
          contained in an existing window is rejected with ERR_AUDIT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "A KNOWLEDGE_BASED profile kbav1 exists."
            - "Audit A1 occupies 2026-06-01T00:00:00Z -> 2026-07-01T00:00:00Z and is COLLECTING."
            - "Audit A2 requesting 2026-07-01T00:00:00Z -> 2026-08-01T00:00:00Z is admitted because the windows only touch at the shared endpoint."
          setup_api_calls:
            - call: "POST /idv/method-profiles"
              payload: { method_code: "KNOWLEDGE_BASED", vendor_code: "kbav1", assurance_weight: 15, acceptance_floor_bps: 6000, far_bps: 150, frr_bps: 900, strong_evidence: false, cost_cents: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_kba_id: "$.data.id" }
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_kba_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit1_id: "$.data.id" }
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_kba_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit2_id: "$.data.id" }
          trigger:
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_kba_id}", window_start: "2026-07-15T00:00:00Z", window_end: "2026-07-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the adjacent audit ${audit2_id} was created with status 201 and state == COLLECTING"
            - "response status is 409 and $.data.error_id == ERR_AUDIT_WINDOW_OVERLAP"
            - "GET /idv/method-profiles/${p_kba_id}/bias-audits returns total_count == 2 with data[0].id == ${audit1_id} and data[1].id == ${audit2_id}"

      - name: client_rolling_quota_window_closed_at_both_ends_with_aggregate_capacity
        grounds:
          - calculations.client_rolling_window_usage
          - validations[priority=49]
          - entities.Client.fields.daily_session_quota
          - entities.VerificationSession.fields.client_id
        distinguishing_aspect: |
          Resource Client with a rolling [clock - 24h, clock] window closed at BOTH ends and an
          aggregate capacity of 2 sessions: at exactly 24h after the first session that session is
          still counted, so the third creation is refused, and one second later it drops out of the
          window and the creation succeeds.
        test_recipe:
          setup:
            - "Clock is set to 2026-08-10T09:00:00Z."
            - "Client Acme Quota is LIVE with daily_session_quota 2, DELETE_ON_COMPLETE, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN, min_assurance_score 60, no age gate; PUBLISHED."
            - "Session S1 is created at 2026-08-10T09:00:00Z."
            - "The clock is advanced to exactly 2026-08-11T09:00:00Z and session S2 is created: the window [2026-08-10T09:00:00Z, 2026-08-11T09:00:00Z] still contains S1, so used == 1 < 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /idv/clients"
              payload: { name: "Acme Quota", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 2, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-q1", requested_assurance_tier: "BASIC", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-q2", requested_assurance_tier: "BASIC", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s2_id: "$.data.id" }
          trigger:
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-q3", requested_assurance_tier: "BASIC", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T09:00:01Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-q4", requested_assurance_tier: "BASIC", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s4_id: "$.data.id" }
          assert:
            - "the subj-q3 creation at 2026-08-11T09:00:00Z returns status 409 with $.data.error_id == ERR_CLIENT_DAILY_QUOTA_EXCEEDED because S1 is still inside the closed window"
            - "the subj-q4 creation at 2026-08-11T09:00:01Z returns status 201 with expires_at == 2026-08-11T10:00:01Z because S1 has dropped out of the window"
            - "VerificationSession.${s1_id}.expires_at == 2026-08-10T10:00:00Z and VerificationSession.${s2_id}.expires_at == 2026-08-11T10:00:00Z"
            - "GET /idv/verification-sessions?client_id=${client_id} returns total_count == 3 and no session with external_subject_ref == subj-q3 exists"

  # =====================================================================================
  # RULE 9 — compensating_invariant
  # Three different conserved quantities.
  # =====================================================================================
  - rule_id: compensating_invariant
    instances:

      - name: review_credit_pool_conserved_across_assignment_and_decision
        grounds:
          - calculations.review_credit_pool
          - entities.Client.fields.reserved_review_credits
          - entities.Client.fields.available_review_credits
          - entities.Client.fields.consumed_review_count
          - state_machines.ManualReviewCase.state.QUEUED_to_ASSIGNED
          - state_machines.ManualReviewCase.state.ASSIGNED_to_DECIDED
          - state_machines.VerificationSession.identity_state.MANUAL_REVIEW_to_VERIFIED
        distinguishing_aspect: |
          Conserved quantity: reserved_review_credits + available_review_credits ==
          granted_review_credits (1) holds before assignment (0 + 1), while the case is ASSIGNED
          (1 + 0) and after the decision releases the credit (0 + 1), with consumed_review_count
          rising to 1 as the separate lifetime counter.
        test_recipe:
          setup:
            - "Client Acme Cred is LIVE, DELETE_ON_COMPLETE, quota 50 and exactly 1 granted review credit."
            - "Policy v1 allows DOCUMENT_SCAN, min_assurance_score 60, doc floor 8000, no age gate; PUBLISHED."
            - "Session subj-r9a finalized a FORGED document attempt, so it is MANUAL_REVIEW with a QUEUED case that holds no credit."
            - "ReviewManager rm-1 assigns the case to reviewer mr-1, reserving the single credit."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Cred", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r9a", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
            - call: "POST /idv/method-attempts/${a1}/document-captures"
              payload: { document_type: "RESIDENCE_PERMIT", required_feature_count: 10, passed_feature_count: 5, tamper_signal_count: 3, mrz_checksum_valid: false }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a1}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "GET /idv/verification-sessions/${s_id}/manual-review-cases"
              payload: {}
              as: ReviewManager
              as_user_id: "rm-1"
              captures: { case_id: "$.data[0].id" }
            - call: "POST /idv/manual-review-cases/${case_id}/assign"
              payload: { assigned_reviewer_user_id: "mr-1" }
              as: ReviewManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /idv/manual-review-cases/${case_id}/decision"
              payload: { decision: "APPROVE" }
              as: ManualReviewer
              as_user_id: "mr-1"
          assert:
            - "immediately after the assign call Client.${client_id}.reserved_review_credits == 1 and available_review_credits == 0"
            - "after the decision Client.${client_id}.reserved_review_credits == 0 and available_review_credits == 1"
            - "Client.${client_id}.reserved_review_credits + Client.${client_id}.available_review_credits == 1 == granted_review_credits at every step"
            - "Client.${client_id}.consumed_review_count == 1"
            - "ManualReviewCase.${case_id}.state == DECIDED, decision == APPROVE, decided_by_user_id == mr-1 and assigned_by_user_id == rm-1"
            - "VerificationSession.${s_id}.identity_state == VERIFIED, manual_override_flag == true, disposition_reason == MANUAL_OVERRIDE and assurance_score_final == 0"

      - name: biometric_custody_count_conserved_across_store_and_immediate_deletion
        grounds:
          - calculations.retention_schedule
          - entities.Client.fields.stored_template_count
          - entities.BiometricTemplate.fields.state
          - entities.BiometricTemplate.fields.deletion_reason
          - state_machines.MethodAttempt.state.AWAITING_EVIDENCE_to_SCORED
          - state_machines.BiometricTemplate.state.STORED_to_DELETED
        distinguishing_aspect: |
          Conserved quantity: Client.stored_template_count equals the number of BiometricTemplate
          rows in state STORED — it rises to 1 when the liveness capture stores a template and falls
          back to 0 exactly once when DELETE_ON_COMPLETE deletes it at session completion, with the
          template row retained for audit in state DELETED.
        test_recipe:
          setup:
            - "Clock is set to 2026-08-10T09:00:00Z."
            - "Client Acme Cust is LIVE with DELETE_ON_COMPLETE retention, quota 50, 1 review credit."
            - "Policy v1 allows BIOMETRIC_COMPARISON, pad_threshold_bps 7500, min_assurance_score 30, no age gate; PUBLISHED."
            - "Session subj-r9b has biometric_consent true and one biometric attempt whose ACTIVE pad 9000 / match 9200 capture PASSes at threshold 7250 with quality 9120 -> 31 points, storing one template; the attempt is then ACCEPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /idv/clients"
              payload: { name: "Acme Cust", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "BIOMETRIC_COMPARISON", vendor_code: "biov1", assurance_weight: 35, acceptance_floor_bps: 7000, far_bps: 20, frr_bps: 500, strong_evidence: true, cost_cents: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_bio_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["BIOMETRIC_COMPARISON"], min_assurance_score: 30, pad_threshold_bps: 7500, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r9b", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: true, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_bio_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
            - call: "POST /idv/method-attempts/${a1}/liveness-checks"
              payload: { capture_modality: "ACTIVE", pad_score_bps: 9000, match_score_bps: 9200 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a1}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/complete"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
          assert:
            - "immediately after the liveness capture Client.${client_id}.stored_template_count == 1 and GET /idv/verification-sessions/${s_id}/biometric-templates?state=STORED returns total_count == 1"
            - "after completion GET /idv/verification-sessions/${s_id}/biometric-templates returns total_count == 1 with data[0].state == DELETED, data[0].deletion_reason == POLICY_IMMEDIATE, data[0].deleted_at == 2026-08-10T09:00:00Z and data[0].retention_expires_at == null"
            - "Client.${client_id}.stored_template_count == 0"
            - "VerificationSession.${s_id}.identity_state == VERIFIED and assurance_score_final == 31"
            - "GET /idv/verification-sessions/${s_id}/audit-events?event_type=TEMPLATE_DELETED returns total_count == 1"

      - name: pending_stepup_counter_conserved_across_two_step_up_cycles
        grounds:
          - entities.Client.fields.pending_stepup_count
          - state_machines.VerificationSession.identity_state.IN_PROGRESS_to_AWAITING_EVIDENCE
          - state_machines.VerificationSession.identity_state.AWAITING_EVIDENCE_to_IN_PROGRESS
          - calculations.document_authenticity_assessment
          - entities.VerificationSession.fields.step_up_round
        distinguishing_aspect: |
          Conserved quantity: Client.pending_stepup_count equals the number of that client's sessions
          in AWAITING_EVIDENCE — it goes 0 -> 1 on the first non-tamper rejection, back to 0 on the
          step-up, 1 again on the second rejection and 0 again on the second step-up, so the counter
          never drifts even though step_up_round only ever increases.
