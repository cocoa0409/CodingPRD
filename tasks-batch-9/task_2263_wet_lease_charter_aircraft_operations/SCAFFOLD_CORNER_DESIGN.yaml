      - name: decision_clear_conditions_and_double_revoke_on_a_settled_docket_return_approval_invalid_state
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_APPROVAL_INVALID_STATE
          - validations[priority 42 ERR_APPROVAL_INVALID_STATE]
          - state_machines.RegulatoryApproval[APPROVED -> REVOKED]
          - endpoints[POST /wetlease/regulatory-approvals/{approvalId}/decision]
        distinguishing_aspect: |
          A docket that has already been decided is closed to further decisions: `decision` is only
          lawful from UNDER_REVIEW (or CONDITIONAL, but solely to DENIED) and `clear-conditions` only
          from CONDITIONAL, so both are 409 ERR_APPROVAL_INVALID_STATE on an APPROVED docket - and the
          clear-conditions rejection must NOT be reported as a success-with-no-effect just because the
          docket is already APPROVED. Revocation is the one remaining lawful move, and it is not
          idempotent: the second revoke of the now-REVOKED docket raises the same error, proving
          REVOKED is terminal and that revocation_reason from the first call is not overwritten.
          
