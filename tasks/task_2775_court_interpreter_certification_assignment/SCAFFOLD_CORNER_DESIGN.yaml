              captures: { a1_cancelled: "$.data.service_status" }
            - call: "POST /assignments/${a2}/confirm"
              payload: {}
              as: Interpreter
              captures: { a2_status2: "$.data.service_status", a2_v3: "$.data.version" }
            - call: "GET /courthouses/${ch_thrift}"
              payload: {}
              as: FiscalOfficer
              captures: { ch_enc2: "$.data.encumbered_pay_cents", ch_avail2: "$.data.available_pay_cents" }
          assert:
            - "${a1_status} == CONFIRMED, ${ch_enc0} == 17500 and ${ch_avail0} == 2500 — only 2500 of budget is left, less than the 17500 the second confirmation needs"
            - "${budget_err} == ERR_COURTHOUSE_BUDGET_EXCEEDED with HTTP 409, raised by validation priority 36 on POST /assignments/{id}/confirm"
            - "${a2_status} == PROPOSED and ${a2_v2} == ${a2_v1} — the rejected call bumped no version, so the assignment is still confirmable"
            - "${h2_status} == SCHEDULED: the hearing was never marked COVERED by the failed attempt"
            - "GET /pay-claims with assignment_id ${a2} returns an empty list — no ENCUMBERED row was written and then abandoned, and ${pc1} remains the only claim in the system"
            - "${ch_enc1} == ${ch_enc0} and ${ch_avail1} == ${ch_avail0}, and ${iA_pending1} == 17500 counts only the surviving claim"
            - "${a1_cancelled} == CANCELLED at a lead time far above late_cancellation_hours, which VOIDs ${pc1} and releases its 17500"
            - "the identical second confirmation now succeeds: ${a2_status2} == CONFIRMED with ${a2_v3} == ${a2_v1} + 1, ${ch_enc2} == 17500 and ${ch_avail2} == 2500 — the earlier rejection left no residue that could have blocked or double-counted it"
