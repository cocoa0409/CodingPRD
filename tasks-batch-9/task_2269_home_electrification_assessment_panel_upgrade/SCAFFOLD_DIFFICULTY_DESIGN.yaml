# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2269
# Home Electrification Assessment & Panel Upgrade Rebate
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Every numeric literal in
# `assert:` was computed by executing the referenced §1.3 formula in code.
#
# Shared fixture vocabulary used across instances (each chain builds it from an
# empty DB; nothing is assumed):
#   Program        budget_total_cents 50000000, ttl 120 d, extension window 30 d,
#                  max extension 60 d, 1 extension per reservation,
#                  tier caps 1400000 / 800000 / 300000,
#                  cost shares 1.00 / 0.50 / 0.30, AMI cuts 80.0 / 150.0,
#                  group cap 800000, panel cap 400000,
#                  federal 0.30 capped 200000, combined benefit 1.00,
#                  1 remediation, suspension < 70, recertification >= 75
#   Catalog        HP-HVAC-01  unit 800000 cap 800000 HVAC_GROUP     sort 10 needs 200 A, anchor
#                  HP-DUCT-01  unit 250000 cap 250000 HVAC_GROUP     sort 15 needs 100 A, prereq HP-HVAC-01
#                  HPWH-01     unit 175000 cap 175000 WATER_GROUP    sort 20 needs 125 A, anchor
#                  PANEL-200A  unit 400000 cap 400000 ELECTRICAL_GROUP sort 30 panel upgrade to 200 A
#                  PANEL-400A  unit 900000 cap 900000 ELECTRICAL_GROUP sort 35 panel upgrade to 400 A
#                  STOVE-IND-01 unit 84000 cap 84000  APPLIANCE_GROUP sort 40 needs 150 A, anchor
#   Users          admin-1 / admin-2 (ProgramAdmin), reviewer-1 / reviewer-2
#                  (ProgramReviewer); entity-backed roles send the entity id.
#   Clock          unset = 2026-08-01T00:00:00Z (§1.5 POST /_clock/set_current_utc)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_vs_final_project_incentive_divergence
        grounds:
          - calculations.measure_incentive_allocation
          - calculations.measure_line_incentive
          - entities.RebateProject.fields.provisional_total_incentive_cents
          - entities.RebateProject.fields.final_total_incentive_cents
          - entities.ProjectMeasure.fields.provisional_incentive_cents
          - entities.ProjectMeasure.fields.final_incentive_cents
          - state_machines.RebateProject.INSTALLED_to_VERIFIED
        distinguishing_aspect: |
          This dual variant operates on MONEY belonging to the RebateProject
          aggregate: the provisional variant reads planned_quantity and
          estimated_cost_cents while the final variant reads verified_quantity
          and actual_cost_cents, and the final variant adds this project's own
          reserved_amount_cents back into the household-cap headroom T, so the
          same measure set yields 1375000 provisionally and 1230000 finally.
        test_recipe:
          setup:
            - "An OPEN program with the shared catalog (HP-HVAC-01, HPWH-01, PANEL-200A)."
            - "Household with a VERIFIED income verification at exactly 80.0% AMI: income_tier LOW, rebate_cap_cents 1400000, cost share 1.00."
            - "An ENROLLED_ACTIVE contractor with crew_capacity 2 and credentials valid through 2027-06-30."
            - "An APPROVED assessment with assessed_panel_amps 100 whose PANEL-200A line raises effective_panel_amps to 200, so HP-HVAC-01 (200 A) and HPWH-01 (125 A) both qualify."
            - "A RESERVED project whose provisional lines are 800000 / 175000 / 400000 and whose reservation encumbers 1375000, leaving lifetime_cap_remaining_cents 25000."
            - "Installation reported with actual costs 700000 / 150000 / 380000 and verified_quantity 1 on every line."
            - "A SCHEDULED POST_INSTALL inspection, not yet recorded."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026", state_code: "CO", budget_total_cents: 50000000, reservation_ttl_days: 120, extension_window_days: 30, max_extension_days: 60, max_extensions_per_reservation: 1, low_tier_cap_cents: 1400000, moderate_tier_cap_cents: 800000, standard_tier_cap_cents: 300000, low_tier_cost_share_pct: 1.00, moderate_tier_cost_share_pct: 0.50, standard_tier_cost_share_pct: 0.30, ami_low_threshold_pct: 80.0, ami_moderate_threshold_pct: 150.0, group_cap_cents: 800000, panel_upgrade_cap_cents: 400000, federal_credit_pct: 0.30, federal_credit_cap_cents: 200000, max_combined_benefit_pct: 1.00, max_remediations_per_project: 1, quality_suspension_threshold: 70, recertification_threshold: 75 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, max_quantity: 1, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true, sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HPWH-01", measure_name: "Heat pump water heater", category: "WATER_HEATING", unit_incentive_cents: 175000, max_quantity: 1, measure_cap_cents: 175000, combined_cap_group: "WATER_GROUP", required_panel_capacity_amps: 125, qualifies_as_appliance_anchor: true, standard_tier_eligible: true, sort_order: 20 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "PANEL-200A", measure_name: "200 A panel and service upgrade", category: "ELECTRICAL_INFRASTRUCTURE", unit_incentive_cents: 400000, max_quantity: 1, measure_cap_cents: 400000, combined_cap_group: "ELECTRICAL_GROUP", required_panel_capacity_amps: 0, upgraded_capacity_amps: 200, is_panel_upgrade: true, requires_qualifying_appliance: true, standard_tier_eligible: true, sort_order: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Ada Rivera", email: "ada@example.com", service_address_line1: "12 Alder St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4, document_reference: "DOC-A1" }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY", reviewer_notes: "Pay stubs and 1040 on file" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Peak Electric", license_number: "EC-4471", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30", crew_capacity: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { hh_v1: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 100, expected_household_version: "${hh_v1}", assessment_notes: "100 A panel, full electrification", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 }, { measure_code: "HPWH-01", proposed_quantity: 1, estimated_cost_cents: 300000 }, { measure_code: "PANEL-200A", proposed_quantity: 1, estimated_cost_cents: 600000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1900000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 }, { measure_code: "HPWH-01", planned_quantity: 1, estimated_cost_cents: 300000 }, { measure_code: "PANEL-200A", planned_quantity: 1, estimated_cost_cents: 600000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id, prov_total: $.data.provisional_total_incentive_cents }
            - call: "POST /rebate-projects/${proj_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /rebate-projects/${proj_id}/review"
              payload: { decision: "APPROVE", review_notes: "Documentation complete" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { prog_v1: $.data.version }
            - call: "POST /rebate-projects/${proj_id}/reservations"
              payload: { expected_program_version: "${prog_v1}", reservation_notes: "Full electrification package" }
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { resv_id: $.data.id }
            - call: "POST /rebate-projects/${proj_id}/installation"
              payload: { install_start_date: "2026-08-10", install_end_date: "2026-08-20", installed_panel_amps: 200, actual_project_cost_cents: 1230000, measure_results: [ { measure_code: "HP-HVAC-01", verified_quantity: 1, actual_cost_cents: 700000 }, { measure_code: "HPWH-01", verified_quantity: 1, actual_cost_cents: 150000 }, { measure_code: "PANEL-200A", verified_quantity: 1, actual_cost_cents: 380000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /inspectors"
              payload: { program_id: "${prog_id}", inspector_name: "Nia Osei", certification_id: "INS-77", certification_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections"
              payload: { project_id: "${proj_id}", inspector_id: "${insp_id}", inspection_type: "POST_INSTALL", scheduled_start: "2026-08-21T09:00:00Z", scheduled_end: "2026-08-21T11:00:00Z" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { pi_id: $.data.id }
          trigger:
            - call: "POST /inspections/${pi_id}/result"
              payload: { result: "PASS", deficiency_count: 0, deficiency_severity_max: 0 }
              as: FieldInspector
              as_user_id: "${insp_id}"
          assert:
            - "RebateProject.${proj_id}.provisional_total_incentive_cents == 1375000"
            - "RebateProject.${proj_id}.final_total_incentive_cents == 1230000"
            - "RebateProject.${proj_id}.provisional_total_incentive_cents - RebateProject.${proj_id}.final_total_incentive_cents == 145000"
            - "ProjectMeasure(project=${proj_id}, measure_code=HP-HVAC-01).provisional_incentive_cents == 800000 and final_incentive_cents == 700000"
            - "ProjectMeasure(project=${proj_id}, measure_code=HPWH-01).provisional_incentive_cents == 175000 and final_incentive_cents == 150000"
            - "ProjectMeasure(project=${proj_id}, measure_code=PANEL-200A).provisional_incentive_cents == 400000 and final_incentive_cents == 380000"
            - "Reservation.${resv_id}.initial_reserved_amount_cents == 1375000 and reserved_amount_cents == 1375000 (payment has not run, so the reservation is not yet reconciled)"
            - "RebateProject.${proj_id}.status == VERIFIED"
            - "RebateProject.${proj_id}.conditional_pass_flag == false"

      - name: rolling_window_vs_severity_weighted_contractor_quality
        grounds:
          - calculations.contractor_quality_score
          - entities.Contractor.fields.quality_score_rolling
          - entities.Contractor.fields.completed_inspection_count
          - entities.Inspection.fields.deficiency_count
          - state_machines.Contractor.ENROLLED_ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          This dual variant operates on a REPUTATION SCORE belonging to the
          Contractor aggregate, not on money and not on the RebateProject: the
          rolling_window variant weights the last 10 results equally and the
          severity_weighted variant weights each result by 1 + deficiency_count
          inside a 365-day horizon, so the same three inspection outcomes
          (PASS, PASS, FAIL with 3 deficiencies) score 67 and 33 respectively.
        test_recipe:
          setup:
            - "An OPEN program with HP-HVAC-01 in the catalog."
            - "A LOW-tier household with a VERIFIED income verification."
            - "An ENROLLED_ACTIVE contractor whose quality_score_rolling starts at 100 with completed_inspection_count 0."
            - "A DRAFT project of that contractor (SPOT inspections do not require any later project state)."
            - "Three SPOT inspections of that project on 2026-09-01, 2026-09-02 and 2026-09-03, each 09:00Z-10:00Z, so no inspector window conflicts."
            - "The logical clock is left at its 2026-08-01T00:00:00Z default, so all three results land inside the 365-day severity window."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026", state_code: "CO", budget_total_cents: 50000000, quality_suspension_threshold: 70, recertification_threshold: 75 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, max_quantity: 1, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true, sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Ben Ito", email: "ben@example.com", service_address_line1: "9 Birch Ln", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Summit Mechanical", license_number: "MC-2210", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30", crew_capacity: 2 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { hh_v1: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v1}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /inspectors"
              payload: { program_id: "${prog_id}", inspector_name: "Nia Osei", certification_id: "INS-77" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections"
              payload: { project_id: "${proj_id}", inspector_id: "${insp_id}", inspection_type: "SPOT", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T10:00:00Z" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { sp1_id: $.data.id }
            - call: "POST /inspections"
              payload: { project_id: "${proj_id}", inspector_id: "${insp_id}", inspection_type: "SPOT", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { sp2_id: $.data.id }
            - call: "POST /inspections"
              payload: { project_id: "${proj_id}", inspector_id: "${insp_id}", inspection_type: "SPOT", scheduled_start: "2026-09-03T09:00:00Z", scheduled_end: "2026-09-03T10:00:00Z" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { sp3_id: $.data.id }
            - call: "POST /inspections/${sp1_id}/result"
              payload: { result: "PASS", deficiency_count: 0, deficiency_severity_max: 0 }
              as: FieldInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${sp2_id}/result"
              payload: { result: "PASS", deficiency_count: 0, deficiency_severity_max: 0 }
              as: FieldInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${sp3_id}/result"
              payload: { result: "FAIL", deficiency_count: 3, deficiency_severity_max: 4, notes: "Three bonding deficiencies" }
              as: FieldInspector
              as_user_id: "${insp_id}"
            - call: "GET /contractors/${ctr_id}/quality-review"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "GET /contractors/${ctr_id}/quality-review returns rolling_window_score == 67"
            - "GET /contractors/${ctr_id}/quality-review returns severity_weighted_score == 33"
            - "rolling_window_score (67) != severity_weighted_score (33); the delta is 34 points on identical history"
            - "GET /contractors/${ctr_id}/quality-review returns rolling_window_inspection_count == 3 and weighted_inspection_count == 3"
            - "GET /contractors/${ctr_id}/quality-review returns recertification_eligible == false"
            - "Contractor.${ctr_id}.quality_score_rolling == 67 (the persisted field tracks the rolling_window variant only)"
            - "Contractor.${ctr_id}.completed_inspection_count == 3"
            - "Contractor.${ctr_id}.status == SUSPENDED and suspension_reason == QUALITY_SCORE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: measure_line_nested_min_four_distinct_binding_arms
        grounds:
          - calculations.measure_line_incentive
          - entities.MeasureCatalogItem.fields.max_quantity
          - entities.MeasureCatalogItem.fields.measure_cap_cents
          - entities.Program.fields.panel_upgrade_cap_cents
          - endpoints.GET_/rebate-projects/{id}/incentive-quote
        distinguishing_aspect: |
          Mode (a): a nested min() over four independent arms — raw unit
          incentive after the max_quantity clamp, the per-measure cap, the
          tier cost-share cap, and the program panel-upgrade cap — where the
          four lines of ONE project each have a DIFFERENT arm binding
          (measure cap, cost-share cap, quantity clamp, panel cap). No
          proration is involved: every group sum and the household cap are
          comfortably above their limits, so the instance isolates the
          per-line min() chain from the allocation waterfall.
        test_recipe:
          setup:
            - "An OPEN program with moderate_tier_cost_share_pct 0.50, moderate_tier_cap_cents 2000000 (deliberately high so no household proration occurs), group_cap_cents 800000 and panel_upgrade_cap_cents 400000."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 700000 (cap below unit), HPWH-01 unit 200000 / cap 175000, PANEL-400A unit 900000 / cap 950000 with is_panel_upgrade, STOVE-IND-01 unit 84000 / max_quantity 1 / cap 120000."
            - "A household at exactly 120.0% AMI: income_tier MODERATE, cost share 0.50, rebate_cap_cents 2000000."
            - "An APPROVED assessment with assessed_panel_amps 100 whose PANEL-400A line propagates effective_panel_amps to 400, so HP-HVAC-01 (200 A) and STOVE-IND-01 (150 A) both clear the capacity gate."
            - "A DRAFT project carrying all four lines with planned_quantity 1 / 1 / 1 / 3 and estimated costs 2000000 / 300000 / 2000000 / 400000."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Mode A", state_code: "CO", budget_total_cents: 50000000, moderate_tier_cap_cents: 2000000, moderate_tier_cost_share_pct: 0.50, group_cap_cents: 800000, panel_upgrade_cap_cents: 400000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, max_quantity: 1, measure_cap_cents: 700000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true, sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HPWH-01", measure_name: "Heat pump water heater", category: "WATER_HEATING", unit_incentive_cents: 200000, max_quantity: 1, measure_cap_cents: 175000, combined_cap_group: "WATER_GROUP", required_panel_capacity_amps: 125, qualifies_as_appliance_anchor: true, sort_order: 20 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "PANEL-400A", measure_name: "400 A panel and service upgrade", category: "ELECTRICAL_INFRASTRUCTURE", unit_incentive_cents: 900000, max_quantity: 1, measure_cap_cents: 950000, combined_cap_group: "ELECTRICAL_GROUP", required_panel_capacity_amps: 0, upgraded_capacity_amps: 400, is_panel_upgrade: true, requires_qualifying_appliance: true, sort_order: 35 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "STOVE-IND-01", measure_name: "Induction range", category: "APPLIANCE", unit_incentive_cents: 84000, max_quantity: 1, measure_cap_cents: 120000, combined_cap_group: "APPLIANCE_GROUP", required_panel_capacity_amps: 150, qualifies_as_appliance_anchor: true, sort_order: 40 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Cara Lund", email: "cara@example.com", service_address_line1: "44 Cedar Ct", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
