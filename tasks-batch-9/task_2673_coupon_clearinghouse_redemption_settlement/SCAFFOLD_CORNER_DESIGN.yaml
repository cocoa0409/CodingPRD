            - "trigger call 3 returns 409 ERR_INVALID_STATE_TRANSITION"
            - "trigger call 4: data.withdrawn_reason is still \"Artwork recalled\", data.barcode_payload is still \"8110380000005001261231030\", and data.version == 3 (create, register, withdraw) — the two refused calls bumped nothing"

