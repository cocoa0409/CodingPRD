# =============================================================================
# §1.8 Scaffold Difficulty Design — FRAGMENT A
# Rules owned by this fragment: dual_variant_calc, combinatorial_formula,
# boundary_precision_check. Merged by the orchestrator into
# SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_calc__payer_impact_forward_vs_historical_on_payer_contract_domain
        grounds:
          - calculations.payer_impact_delta
          - calculations.payer_impact_delta.variants.FORWARD_PROJECTED
          - calculations.payer_impact_delta.variants.HISTORICAL_REPLAY
          - calculations.gross_charge_from_price_rule
          - entities.PriceChangeImpactAnalysis.fields.total_reimbursement_delta_cents
          - entities.PriceChangeImpactAnalysis.fields.payer_lines
          - entities.PayerContract.fields.trailing_units
          - entities.Facility.fields.volume_growth_bp
          - entities.Facility.fields.impact_lookback_days
        distinguishing_aspect: |
          This dual-variant calculation lives on the PayerContract / CapturedCharge
          reimbursement-economics domain (not on any ChargeItem identity metric): the
          very same ChangeRequest analysed twice returns total_reimbursement_delta_cents
          == 144592 with 3 payer_lines under FORWARD_PROJECTED and 49168 with 2
          payer_lines under HISTORICAL_REPLAY, because FORWARD_PROJECTED scales
          PayerContract.trailing_units by Facility.volume_growth_bp and emits a
          zero-unit line for a payer that has no captured charges at all, while
          HISTORICAL_REPLAY uses actual CapturedCharge quantities and emits no line for
          that payer.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z for every call."
            - "Facility ACME with rounding_mode = NEAREST_CENT, aggregate_markup_limit_bp = 40000, volume_growth_bp = 10500, impact_lookback_days = 90; posture OPEN."
            - "Department CARDIAC (manager_user_id = u_dm_cardiac, allowed_revenue_code_values omitted => unrestricted)."
            - "RevenueCode 0300 (requires_hcpcs = false, allowed_code_types includes CDM_INTERNAL, status ACTIVE)."
            - "One ACTIVE PriceRule on (ACME, 0300): COST_PLUS_MARKUP, default markup_tiers, min_medicare_multiple_bp = 12000, market_cap_multiple_bp = 11000, effective_from = 2026-08-01T00:00:00Z, effective_to = null."
            - "ChargeItem CDM-1000: cost_basis_cents = 40000, medicare_rate_cents = 20000, market_p75_cents = 200000, code_type CDM_INTERNAL, no companion. Repriced (gross_charge_cents = 128000) and driven DRAFT -> PENDING_REVIEW -> APPROVED -> ACTIVE."
            - "One RECONCILED ChargeCaptureBatch over the closed window 2026-06-01..2026-06-30 (inside the 90-day lookback ending at 2026-08-01) holding two MATCHED lines on CDM-1000: 3 units for payer AETNA_COMM and 2 units for payer BCBS_STATE."
            - "Three ACTIVE PayerContracts on ACME, all with term 2026-01-01..2026-12-31: AETNA_COMM/COMMERCIAL PERCENT_OF_CHARGE 4500bp trailing_units 7; BCBS_STATE/COMMERCIAL LESSER_OF_FEE_SCHEDULE 6000bp fee_schedule_cents 80000 trailing_units 13; MEDICAID_MCO_A/MEDICAID_MCO CASE_RATE 500000 trailing_units 0."
            - "One SUBMITTED PRICE_CHANGE ChangeRequest on CDM-1000 with proposed_cost_basis_cents = 49900, whose dry run pins projected_gross_charge_cents = 159680 and projected_markup_ratio_bp = 32000."
          setup_api_calls:
            - call: "POST /chargemaster/facilities"
              payload: { name: "ACME Regional", cms_certification_number: "CCN-2193-A", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000, volume_growth_bp: 10500, impact_lookback_days: 90, duplicate_detection_mode: "STRICT_CODE" }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "u_dm_cardiac" }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CDM_INTERNAL", "REV_ONLY", "CPT", "HCPCS"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc_id}", cdm_number: "CDM-1000", description: "CARDIAC CATH TRAY STANDARD", code_type: "CDM_INTERNAL", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { item_v_after_reprice: $.data.version }
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW", note: "ready for pricing committee" }
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "APPROVE", note: "priced at 128000" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "ACTIVATE", note: "live" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", window_start_date: "2026-06-01T00:00:00Z", window_end_date: "2026-06-30T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "u_dm_cardiac"
              captures: { batch_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-1000", encounter_id: "ENC-1", payer_code: "AETNA_COMM", service_datetime: "2026-06-10T09:00:00Z", quantity: 3, posted_charge_cents: 384000 }
              as: DepartmentManager
              as_user_id: "u_dm_cardiac"
              captures: { line_aetna_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-1000", encounter_id: "ENC-2", payer_code: "BCBS_STATE", service_datetime: "2026-06-15T09:00:00Z", quantity: 2, posted_charge_cents: 256000 }
              as: DepartmentManager
              as_user_id: "u_dm_cardiac"
              captures: { line_bcbs_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/reconcile"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lifecycle"
              payload: { action: "FINALIZE", note: "clean pass" }
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "AETNA_COMM", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", percent_of_charge_bp: 4500, trailing_units: 7, renegotiation_notice_days: 30 }
              as: ContractManager
              captures: { pc_aetna_id: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "LESSER_OF_FEE_SCHEDULE", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", percent_of_charge_bp: 6000, fee_schedule_cents: 80000, trailing_units: 13, renegotiation_notice_days: 30 }
              as: ContractManager
              captures: { pc_bcbs_id: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "MEDICAID_MCO_A", product_line: "MEDICAID_MCO", reimbursement_method: "CASE_RATE", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", case_rate_cents: 500000, trailing_units: 0, renegotiation_notice_days: 30 }
              as: ContractManager
              captures: { pc_mcaid_id: $.data.id }
            - call: "POST /chargemaster/change-requests"
              payload: { department_id: "${dept_id}", charge_item_id: "${item_id}", request_type: "PRICE_CHANGE", justification: "vendor cost increase on the cath tray", proposed_cost_basis_cents: 49900 }
              as: DepartmentManager
              as_user_id: "u_dm_cardiac"
              captures: { cr_id: $.data.id, cr_projected_gross: $.data.projected_gross_charge_cents }
          trigger:
            - call: "POST /chargemaster/price-change-analyses"
              payload: { change_request_id: "${cr_id}", variant: "FORWARD_PROJECTED" }
              as: ContractManager
              captures: { fwd_id: $.data.id }
            - call: "POST /chargemaster/price-change-analyses"
              payload: { change_request_id: "${cr_id}", variant: "HISTORICAL_REPLAY" }
              as: ContractManager
              captures: { hist_id: $.data.id }
          assert:
            - "ChargeItem.${item_id}.gross_charge_cents == 128000"
            - "ChangeRequest.${cr_id}.projected_gross_charge_cents == 159680"
            - "ChangeRequest.${cr_id}.projected_markup_ratio_bp == 32000"
            - "PriceChangeImpactAnalysis.${fwd_id}.old_gross_charge_cents == 128000"
            - "PriceChangeImpactAnalysis.${fwd_id}.new_gross_charge_cents == 159680"
            - "PriceChangeImpactAnalysis.${fwd_id}.total_reimbursement_delta_cents == 144592"
            - "len(PriceChangeImpactAnalysis.${fwd_id}.payer_lines) == 3"
            - "PriceChangeImpactAnalysis.${fwd_id}.payer_lines[0] == { payer_code: AETNA_COMM, product_line: COMMERCIAL, units: 7, old_reimbursement_cents: 403200, new_reimbursement_cents: 502992, delta_cents: 99792 }"
            - "PriceChangeImpactAnalysis.${fwd_id}.payer_lines[1] == { payer_code: BCBS_STATE, product_line: COMMERCIAL, units: 14, old_reimbursement_cents: 1075200, new_reimbursement_cents: 1120000, delta_cents: 44800 }"
            - "PriceChangeImpactAnalysis.${fwd_id}.payer_lines[2] == { payer_code: MEDICAID_MCO_A, product_line: MEDICAID_MCO, units: 0, old_reimbursement_cents: 0, new_reimbursement_cents: 0, delta_cents: 0 }"
            - "PriceChangeImpactAnalysis.${hist_id}.total_reimbursement_delta_cents == 49168"
            - "len(PriceChangeImpactAnalysis.${hist_id}.payer_lines) == 2"
            - "PriceChangeImpactAnalysis.${hist_id}.payer_lines[0] == { payer_code: AETNA_COMM, product_line: COMMERCIAL, units: 3, old_reimbursement_cents: 172800, new_reimbursement_cents: 215568, delta_cents: 42768 }"
            - "PriceChangeImpactAnalysis.${hist_id}.payer_lines[1] == { payer_code: BCBS_STATE, product_line: COMMERCIAL, units: 2, old_reimbursement_cents: 153600, new_reimbursement_cents: 160000, delta_cents: 6400 }"
            - "PriceChangeImpactAnalysis.${fwd_id}.total_reimbursement_delta_cents != PriceChangeImpactAnalysis.${hist_id}.total_reimbursement_delta_cents"
            - "PriceChangeImpactAnalysis.${fwd_id}.status == COMPUTED"
            - "PriceChangeImpactAnalysis.${hist_id}.status == COMPUTED"

      - name: dual_variant_calc__duplicate_similarity_strict_vs_fuzzy_on_charge_item_domain
        grounds:
          - calculations.duplicate_similarity_score
          - calculations.duplicate_similarity_score.variants.STRICT_CODE
          - calculations.duplicate_similarity_score.variants.FUZZY_DESCRIPTION
          - entities.Facility.fields.duplicate_detection_mode
          - entities.ChargeItem.fields.duplicate_of_item_id
          - state_machines.ChargeItem.lifecycle_status.ACTIVE_to_INACTIVE
          - validations[priority=48]
          - errors.ERR_DUPLICATE_SIMILARITY_TOO_LOW
        distinguishing_aspect: |
          This dual-variant calculation operates on the ChargeItem code/description
          identity domain (not on payer reimbursement economics): the identical item
          pair scores 0.7750 under FUZZY_DESCRIPTION — rejecting MARK_DUPLICATE with
          ERR_DUPLICATE_SIMILARITY_TOO_LOW — and 1.0000 under STRICT_CODE, admitting the
          very same call, so flipping only Facility.duplicate_detection_mode reverses the
          verdict on unchanged data.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z."
            - "Facility DUPE with rounding_mode = NEAREST_CENT, aggregate_markup_limit_bp = 40000, duplicate_detection_mode = FUZZY_DESCRIPTION; posture OPEN."
            - "One Department SURGERY, one ACTIVE RevenueCode 0450 with requires_hcpcs = true and allowed_code_types [CPT, HCPCS]."
            - "One ACTIVE COST_PLUS_MARKUP PriceRule on (DUPE, 0450) with the default markup tiers."
            - "Two ChargeItems in the SAME department, SAME revenue code, SAME code_type CPT and SAME code_value 99213, differing only in cdm_number and description: subject CDM-2001 'CARDIAC TRAY ALPHA' and survivor CDM-2002 'CARDIAC BETA'. Both have cost_basis_cents = 40000, medicare_rate_cents = 20000, market_p75_cents = 200000, are repriced to gross_charge_cents = 128000 and are driven all the way to lifecycle_status = ACTIVE."
            - "Description token sets are {CARDIAC, TRAY, ALPHA} and {CARDIAC, BETA}: intersection 1, union 4, so jaccard = 0.2500 exactly."
          setup_api_calls:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Dupe Memorial", cms_certification_number: "CCN-2193-D", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000, duplicate_detection_mode: "FUZZY_DESCRIPTION" }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Surgery", cost_center_code: "CC-450", manager_user_id: "u_dm_surgery" }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0450", description: "Emergency Room", requires_hcpcs: true, allowed_code_types: ["CPT", "HCPCS"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc_id}", cdm_number: "CDM-2001", description: "CARDIAC TRAY ALPHA", code_type: "CPT", code_value: "99213", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { s_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc_id}", cdm_number: "CDM-2002", description: "CARDIAC BETA", code_type: "CPT", code_value: "99213", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${s_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${t_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${s_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${s_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-items/${s_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-items/${t_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${t_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-items/${t_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
          trigger:
            - call: "POST /chargemaster/charge-items/${s_id}/lifecycle"
              payload: { action: "MARK_DUPLICATE", duplicate_of_item_id: "${t_id}", note: "fuzzy attempt" }
              as: RevenueIntegrityAnalyst
            - call: "GET /chargemaster/charge-items/${s_id}/duplicate-candidates"
              payload: { min_score: 0.8000, limit: 50, offset: 0 }
              as: RevenueIntegrityAnalyst
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: SystemAdmin
              captures: { fac_v: $.data.version }
            - call: "PATCH /chargemaster/facilities/${fac_id}"
              payload: { expected_facility_version: "${fac_v}", duplicate_detection_mode: "STRICT_CODE" }
              as: SystemAdmin
            - call: "GET /chargemaster/charge-items/${s_id}/duplicate-candidates"
              payload: { min_score: 0.8000, limit: 50, offset: 0 }
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${s_id}/lifecycle"
              payload: { action: "MARK_DUPLICATE", duplicate_of_item_id: "${t_id}", note: "strict retry" }
              as: RevenueIntegrityAnalyst
          assert:
            - "trigger[0] responds 422 with data.error_id == ERR_DUPLICATE_SIMILARITY_TOO_LOW (FUZZY_DESCRIPTION score 0.7750 < 0.8000)"
            - "After trigger[0]: ChargeItem.${s_id}.lifecycle_status == ACTIVE and ChargeItem.${s_id}.duplicate_of_item_id is null"
            - "trigger[1] responds 200 with len(data) == 0 (no FUZZY_DESCRIPTION candidate reaches min_score 0.8000)"
            - "trigger[4] responds 200 with len(data) == 1 and data[0].id == ${t_id} (STRICT_CODE score 1.0000)"
            - "trigger[5] responds 200"
            - "ChargeItem.${s_id}.lifecycle_status == INACTIVE"
            - "ChargeItem.${s_id}.duplicate_of_item_id == ${t_id}"
            - "ChargeItem.${t_id}.lifecycle_status == ACTIVE"
            - "Facility.${fac_id}.active_item_count == 1"
            - "Facility.${fac_id}.aggregate_gross_charge_cents == 128000"
            - "Facility.${fac_id}.aggregate_cost_basis_cents == 40000"
            - "Facility.${fac_id}.aggregate_markup_ratio_bp == 32000"

  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_formula__mode_a_tier_floor_cap_nesting_with_rounding_mode_applied_last
        grounds:
          - calculations.gross_charge_from_price_rule
          - calculations.gross_charge_from_price_rule.variants.floor_then_cap
          - calculations.price_rule_selector
          - entities.Facility.fields.rounding_mode
          - entities.PriceRule.fields.markup_tiers
          - entities.PriceRule.fields.min_medicare_multiple_bp
          - entities.PriceRule.fields.market_cap_multiple_bp
          - entities.ChargeItem.fields.price_conflict
          - entities.ChargeItem.fields.prior_gross_charge_cents
          - state_machines.ChargeItem.price_status.PRICE_STALE_to_PRICED_CURRENT
        distinguishing_aspect: |
          This is mode (a) — a single formula with five interacting inputs
          (cost_basis_cents tier selection, markup_bp, medicare floor, market cap,
          facility rounding_mode) whose nested max(base, floor) then min(..., cap) then
          one final rounding step is non-linear: item Y prices to 110000 under
          NEAREST_CENT (cap wins over the higher Medicare floor, price_conflict = true)
          whereas the cap-before-floor order would return 120000, and item X sitting
          exactly on the 250000 tier boundary prices to 450000 rather than the 600000 the
          lower tier's 24000bp would produce.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z."
            - "Facility CMB created with rounding_mode = NEAREST_CENT (later PATCHed to NEAREST_DOLLAR then PSYCHOLOGICAL_99)."
            - "RevenueCode 0300 (PROCEDURE) with an ACTIVE COST_PLUS_MARKUP PriceRule R1: markup_tiers [(0, 32000), (50000, 24000), (250000, 18000)], min_medicare_multiple_bp = 12000, market_cap_multiple_bp = 11000, effective_from 2026-08-01T00:00:00Z, effective_to null."
            - "RevenueCode 0636 (PHARMACY) with an ACTIVE MEDICARE_MULTIPLE PriceRule R2: min_medicare_multiple_bp = 11250, market_cap_multiple_bp = 11000, same interval."
            - "Three ChargeItems left in lifecycle_status DRAFT (reprice is independent of the lifecycle dimension, so no facility aggregate or approval gate participates): X on 0300 with cost_basis_cents = 250000 exactly on the third tier boundary, medicare_rate_cents = 100000, market_p75_cents = 900000; Y on 0300 with cost_basis_cents = 20000, medicare_rate_cents = 100000, market_p75_cents = 100000 so the Medicare floor 120000 exceeds the market cap 110000; W on 0636 with medicare_rate_cents = 85396 so base_cents is the exact half 96070.5."
          setup_api_calls:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Combinatorial General", cms_certification_number: "CCN-2193-C", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Pharmacy", cost_center_code: "CC-636", manager_user_id: "u_dm_rx" }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CDM_INTERNAL", "REV_ONLY"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc300_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0636", description: "Drugs requiring detailed coding", requires_hcpcs: false, allowed_code_types: ["CDM_INTERNAL", "REV_ONLY"], pricing_class: "PHARMACY", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc636_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc300_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
