        distinguishing_aspect: |
          FOUR independent exclusion rules are exercised at once with decoy rows of
          5000000.00 each, so any leak is visible by orders of magnitude: an UNVERIFIED
          HISTORICAL row, a VERIFIED HISTORICAL row dated 2023-01-31 (before the
          INCLUSIVE lookback_start_date 2023-07-01), a VERIFIED HISTORICAL row dated
          exactly 2026-07-01 (the EXCLUSIVE baseline_date), and a VERIFIED POST_HIRE
          row. A fifth exclusion is at book level: the WITHDRAWN 'Ridgeline Foods'
          entry has zero verified records, so if it entered scope the assessment would
          fail with ERR_UNVERIFIED_COLLECTION_DATA instead of succeeding.
