# =============================================================================
# PRD Benchmark Scaffold — Occupational Licensure Portability &
# Military Spouse Endorsement (state licensing agency)
# §1.0 – §1.7.  Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2478. Occupational Licensure Portability & Military Spouse Endorsement (state licensing agency):
  substantial equivalency evaluation of out-of-state credentials with scope-of-practice comparison,
  universal recognition pathway eligibility with residency and good-standing requirements,
  military spouse expedited licensure with temporary permits during full review, military training
  and experience credit toward licensure requirements, examination waiver criteria and jurisprudence
  exam requirements, temporary practice permits with expiration and conversion to full licensure,
  disciplinary history review across states through national databases, processing time standards
  and applicant status transparency, fee waivers and reciprocal agreements

domain_name: licensure-portability
api_prefix: /licensure

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /licensure with explicit
  # FK fields in request bodies; no entity is nested inside another's URL path
  # for creation. Only reverse-reachability reads use a /{id}/<segment> shape.

  state_machine_shape: cyclic
  # LicenseApplication is cyclic (UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW, capped
  # at MAX_DEFICIENCY_CYCLES) and branching at the same node (UNDER_REVIEW ->
  # {DEFICIENT, DENIED, APPROVED, SUSPENDED_REVIEW}). CredentialEvaluation carries
  # two parallel state dimensions (scope_review_status x discipline_review_status)
  # whose compound function drives overall_status.

  relationship_patterns:
    - one_to_many          # Applicant -> OutOfStateCredential / MilitaryTrainingRecord / DisciplinaryRecord
    - cross_aggregate      # CreditAward joins LicenseApplication x MilitaryTrainingRecord;
                           # ReviewAssignment joins Evaluator x LicenseApplication
  role_model: segregation_of_duties
  # The LicensingAnalyst who recorded the scope review may not be the BoardDeputy
  # who decides the same application (compared on X-User-ID).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Profession
    parent: null
    common_fields: true
    fields:
      - name: profession_code
        type: string
        source: input
        description: "Agency code for the regulated profession, e.g. RN."
        constraints: "2-8 uppercase chars; unique across Profession rows"
      - name: title
        type: string
        source: input
        description: "Human-readable profession title."
      - name: required_scope_elements
        type: array
        source: input
        description: "Ordered list of scope-of-practice element codes this state requires."
        constraints: "non-empty; 1-12 unique uppercase codes; order fixed at creation and used to order missing_scope_elements"
      - name: critical_scope_elements
        type: array
        source: input
        description: "Subset of required_scope_elements whose absence draws CRITICAL_MISS_PENALTY under the STRICT_SCOPE variant."
        default: []
        constraints: "every member must appear in required_scope_elements"
      - name: required_practice_hours
        type: integer
        source: input
        description: "Documented supervised practice hours that map to hours_ratio = 1.0."
        constraints: ">= 1"
      - name: requirement_hours_total
        type: number
        source: input
        description: "Total licensure requirement hours a candidate must satisfy (military credit counts toward it)."
        constraints: "> 0; one decimal place"
      - name: exam_waiver_min_score
        type: number
        source: input
        description: "Substantial-equivalency score at or above which the national examination is waived (>= comparison)."
        constraints: "0.00-100.00, two decimal places"
      - name: jurisprudence_exam_required
        type: boolean
        source: input
        description: "Whether this state's jurisprudence (law) exam is required before licensure."
        default: true
      - name: universal_recognition_min_residency_months
        type: integer
        source: input
        description: "Months of in-state residency required for the UNIVERSAL_RECOGNITION pathway."
        constraints: ">= 0"
      - name: standard_processing_days
        type: integer
        source: input
        description: "Published processing-time standard in days used to compute review_deadline_at for non-expedited reviews."
        constraints: ">= 1"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Application fee component in cents."
        constraints: ">= 0"
      - name: endorsement_fee_cents
        type: integer
        source: input
        description: "Endorsement component charged on ENDORSEMENT and UNIVERSAL_RECOGNITION pathways."
        constraints: ">= 0"
      - name: exam_fee_cents
        type: integer
        source: input
        description: "National examination seat-fee component; reversed when the exam is waived."
        constraints: ">= 0"
      - name: jurisprudence_fee_cents
        type: integer
        source: input
        description: "Jurisprudence exam component charged when jurisprudence_exam_required is true."
        constraints: ">= 0"
      - name: permit_fee_cents
        type: integer
        source: input
        description: "List fee for one temporary practice permit before statutory waiver."
        constraints: ">= 0"
      - name: expedite_surcharge_pct
        type: number
        source: input
        description: "Fraction of gross_subtotal_cents added when LicenseApplication.expedited is true."
        constraints: "0.00-1.00, two decimal places"

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Applicant legal name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter code of the applicant's current state of residence; matched against ReciprocalAgreement.partner_state."
        constraints: "exactly 2 uppercase letters"
      - name: residency_months
        type: integer
        source: input
        description: "Completed months of in-state residency, used by the UNIVERSAL_RECOGNITION eligibility check."
        default: 0
        constraints: ">= 0"
      - name: military_status
        type: enum
        source: input
        description: "Military affiliation driving fee waiver tiers and pathway eligibility."
        default: NONE
        constraints: "NONE | SERVICE_MEMBER | MILITARY_SPOUSE | VETERAN"
      - name: disciplinary_risk_index_reported
        type: number
        source: computed
        description: "REPORTED_AT variant of calculations.applicant_disciplinary_risk_index."
        default: 0.00
        constraints: "0.00-100.00, two decimal places"
      - name: disciplinary_risk_index_effective
        type: number
        source: computed
        description: "EFFECTIVE_AT variant of calculations.applicant_disciplinary_risk_index."
        default: 0.00
        constraints: "0.00-100.00, two decimal places"
      - name: good_standing_flag
        type: boolean
        source: computed
        description: "True when the applicant has no unresolved DisciplinaryRecord of severity SUSPENSION or REVOCATION AND disciplinary_risk_index_reported < GOOD_STANDING_MAX_INDEX."
        default: true
      - name: fee_waiver_eligible
        type: boolean
        source: computed
        description: "True when military_status IN {SERVICE_MEMBER, MILITARY_SPOUSE, VETERAN}."
        default: false

  - name: OutOfStateCredential
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the holder of this out-of-state credential."
      - name: issuing_state
        type: string
        source: input
        description: "Two-letter code of the state that issued the credential."
        constraints: "exactly 2 uppercase letters"
      - name: license_number
        type: string
        source: input
        description: "Credential number as printed by the issuing state."
      - name: scope_elements
        type: array
        source: input
        description: "Scope-of-practice element codes the issuing state grants under this credential."
        constraints: "0-12 unique uppercase codes"
      - name: practice_hours
        type: integer
        source: input
        description: "Documented supervised practice hours attached to this credential."
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: "Standing of the credential in the issuing state as verified at intake."
        default: ACTIVE
        constraints: "ACTIVE | LAPSED | SUSPENDED | REVOKED"
      - name: verified_good_standing
        type: boolean
        source: input
        description: "True when the issuing state's verification letter confirms good standing."
        default: false
      - name: issued_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the issuing state granted the credential."

  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; must equal X-User-ID when the caller's role is Applicant."
      - name: profession_id
        type: string
        source: input
        description: "FK -> Profession.id; the license being sought."
      - name: primary_credential_id
        type: string
        source: input
        description: "FK -> OutOfStateCredential.id; the credential offered as the equivalency basis."
      - name: pathway
        type: enum
        source: input
        description: "Portability pathway requested by the applicant."
        constraints: "ENDORSEMENT | UNIVERSAL_RECOGNITION | MILITARY_SPOUSE_EXPEDITED"
      - name: expedited
        type: boolean
        source: input
        description: "Applicant purchased expedited processing (adds expedite_surcharge_cents and shortens review_deadline_at)."
        default: false
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state; see state_machines.LicenseApplication."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | DEFICIENT | SUSPENDED_REVIEW | APPROVED | DENIED"
      - name: deficiency_cycle_count
        type: integer
        source: computed
        description: "Number of times this application has entered DEFICIENT; capped by MAX_DEFICIENCY_CYCLES."
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the DRAFT -> SUBMITTED transition; null while DRAFT."
        default: null
      - name: review_deadline_at
        type: datetime
        source: computed
        description: "Published processing-time standard deadline from calculations.review_deadline; null while DRAFT."
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the terminal APPROVED or DENIED transition; null otherwise."
        default: null
      - name: processing_elapsed_days
        type: integer
        source: computed
        description: "Whole days from submitted_at to min(decided_at, clock_now) per calculations.processing_time_metrics."
        default: 0
      - name: processing_standard_met
        type: boolean
        source: computed
        description: "True when decided_at is non-null and decided_at <= review_deadline_at; null while undecided."
        default: null
      - name: statutory_waiver_pct
        type: number
        source: computed
        description: "Waiver fraction selected at submit by calculations.net_fee_due_cents step 4; reused by permit fee and reversal arithmetic."
        default: 0.00
        constraints: "0.00 | 0.25 | 0.50 | 1.00 and any ReciprocalAgreement.fee_waiver_pct value"
      - name: gross_total_cents
        type: integer
        source: computed
        description: "Pre-waiver total from calculations.net_fee_due_cents step 3, frozen at submit."
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: "Sum of every FeeLedgerEntry.amount_cents for this application per calculations.application_fee_balance."
        default: 0
      - name: requirement_hours_satisfied
        type: number
        source: computed
        description: "Military credit hours applied to this application per calculations.military_credit_hours."
        default: 0.0
        constraints: "one decimal place; <= Profession.requirement_hours_total"
      - name: requirement_hours_remaining
        type: number
        source: computed
        description: "Profession.requirement_hours_total - requirement_hours_satisfied; conserved quantity of the credit-hour invariant."
        constraints: "one decimal place; >= 0.0"
      - name: national_exam_passed
        type: boolean
        source: computed
        description: "Set by POST /licensure/applications/{id}/exam-results with exam_kind NATIONAL."
        default: false
      - name: jurisprudence_exam_passed
        type: boolean
        source: computed
        description: "Set by POST /licensure/applications/{id}/exam-results with exam_kind JURISPRUDENCE."
        default: false
      - name: pathway_risk_index
        type: number
        source: computed
        description: "Variant-selected disciplinary index: Applicant.disciplinary_risk_index_reported when pathway == UNIVERSAL_RECOGNITION, else Applicant.disciplinary_risk_index_effective."
        default: 0.00
      - name: scope_reviewed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the LicensingAnalyst who recorded the scope review; compared against the deciding BoardDeputy for segregation of duties."
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the BoardDeputy who issued the terminal decision."
        default: null

  - name: CredentialEvaluation
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; at most one evaluation per application."
      - name: credential_id
        type: string
        source: input
        description: "FK -> OutOfStateCredential.id; the credential compared against Profession.required_scope_elements."
      - name: variant
        type: enum
        source: computed
        description: "Scoring variant pinned at creation from the application's pathway: UNIVERSAL_RECOGNITION pathway -> UNIVERSAL_RECOGNITION, otherwise STRICT_SCOPE."
        constraints: "STRICT_SCOPE | UNIVERSAL_RECOGNITION"
      - name: scope_review_status
        type: enum
        source: system
        description: "First parallel state dimension: scope-of-practice comparison outcome."
        default: PENDING
        constraints: "PENDING | EQUIVALENT | DEFICIENT_SCOPE"
      - name: discipline_review_status
        type: enum
        source: system
        description: "Second parallel state dimension: national-database disciplinary review outcome."
        default: PENDING
        constraints: "PENDING | CLEAR | ADVERSE"
      - name: overall_status
        type: enum
        source: computed
        description: "Compound of both dimensions plus finalized_at per calculations.evaluation_overall_status."
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | COMPLETE"
      - name: matched_scope_elements
        type: array
        source: computed
        description: "Intersection of the credential's scope_elements with Profession.required_scope_elements, in Profession order."
        default: []
      - name: missing_scope_elements
        type: array
        source: computed
        description: "Profession.required_scope_elements not present on the credential, in Profession order."
        default: []
      - name: equivalency_score
        type: number
        source: computed
        description: "Result of calculations.substantial_equivalency_score under this row's variant; null until finalize."
        default: null
        constraints: "two decimal places"
      - name: exam_waiver_granted
        type: boolean
        source: computed
        description: "True when equivalency_score >= Profession.exam_waiver_min_score at finalize."
        default: false
      - name: finalized_at
        type: datetime
        source: computed
        description: "Logical-clock instant the analyst finalized the evaluation; null while either dimension is PENDING."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the LicensingAnalyst who recorded the scope review on this evaluation."
        default: null

  - name: MilitaryTrainingRecord
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; owner of the training record."
      - name: category
        type: enum
        source: input
        description: "Credit category selecting the CONVERSION_FACTOR."
        constraints: "MOS_TRAINING | FIELD_EXPERIENCE | JOINT_SERVICE_TRANSCRIPT"
      - name: documented_hours
        type: integer
        source: input
        description: "Hours documented on the service transcript."
        constraints: ">= 1"
      - name: source_document
        type: string
        source: input
        description: "Identifier of the transcript or evaluation letter backing the hours."
      - name: verified
        type: boolean
        source: input
        description: "True when agency staff verified the transcript; unverified records cannot be credited."
        default: false

  - name: CreditAward
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; the application the credit is applied to."
      - name: training_record_id
        type: string
        source: input
        description: "FK -> MilitaryTrainingRecord.id; at most one AWARDED CreditAward per (application_id, training_record_id)."
      - name: awarded_hours
        type: number
        source: computed
        description: "Per-record converted hours from calculations.military_credit_hours step 1 (rounded to one decimal before summing)."
        constraints: "one decimal place; >= 0.0"
      - name: status
        type: enum
        source: system
        description: "AWARDED at creation; REVOKED after the compensating revoke action."
        default: AWARDED
        constraints: "AWARDED | REVOKED"
      - name: revoked_at
        type: datetime
        source: computed
        description: "Logical-clock instant of revocation; null while AWARDED."
        default: null

  - name: TemporaryPermit
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; the pending application this permit bridges."
      - name: effective_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the practice window; half-open interval start."
      - name: expires_at
        type: datetime
        source: computed
        description: "Half-open interval end from calculations.permit_window; truncated to converted_at on conversion."
      - name: permit_max_days
        type: integer
        source: computed
        description: "PERMIT_MAX_DAYS selected by the application's pathway, frozen at issuance."
      - name: permit_fee_cents
        type: integer
        source: computed
        description: "Profession.permit_fee_cents net of LicenseApplication.statutory_waiver_pct, frozen at issuance."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle; see state_machines.TemporaryPermit."
        default: ACTIVE
        constraints: "ACTIVE | CONVERTED | EXPIRED | REVOKED"
      - name: converted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the permit converted to full licensure; null otherwise."
        default: null
      - name: revoked_at
        type: datetime
        source: computed
        description: "Logical-clock instant the permit was revoked; null otherwise."
        default: null
      - name: revocation_reason_code
        type: string
        source: system
        description: "Copied verbatim from the revoke call's reason_code input, or set to the literal DISCIPLINARY_ACTION when the permit was revoked by a good-standing cascade, or APPLICATION_DENIED when revoked by a denial cascade; null while the permit has never been revoked."
        default: null

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; the approved application that minted this license."
      - name: profession_id
        type: string
        source: input
        description: "FK -> Profession.id; copied from the application at mint time."
      - name: converted_from_permit_id
        type: string
        source: computed
        description: "FK -> TemporaryPermit.id; the permit converted by this mint, or null when the applicant held no ACTIVE permit."
        default: null
      - name: license_number
        type: string
        source: computed
        description: "Agency license number minted as `<Profession.profession_code>-<zero-padded 6-digit mint sequence>`; sequence increments once per License row in created_at ASC order starting at 000001."
      - name: status
        type: enum
        source: system
        description: "Licenses are minted ACTIVE and are not deactivated in this release."
        default: ACTIVE
        constraints: "ACTIVE"
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the mint."
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + LICENSE_TERM_DAYS (730)."

  - name: DisciplinaryRecord
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; subject of the sister-state action."
      - name: source_state
        type: string
        source: input
        description: "Two-letter code of the state that took the action."
        constraints: "exactly 2 uppercase letters"
      - name: source_database
        type: enum
        source: input
        description: "National database the record was surfaced from."
        constraints: "NPDB | NURSYS | STATE_BOARD_DIRECT"
      - name: severity
        type: enum
        source: input
        description: "Action severity selecting SEVERITY_POINTS."
        constraints: "ADVISORY | PROBATION | SUSPENSION | REVOCATION"
      - name: action_effective_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the sister state's action took effect; timestamp key of the EFFECTIVE_AT variant."
      - name: reported_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the national database surfaced the action; timestamp key of the REPORTED_AT variant."
      - name: resolved
        type: boolean
        source: computed
        description: "False at creation; set true by the resolve action, which removes the record from both risk-index sweeps."
        default: false
      - name: resolved_at
        type: datetime
        source: computed
        description: "Logical-clock instant of resolution; null while unresolved."
        default: null

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> LicenseApplication.id; the application whose balance this entry moves."
      - name: entry_type
        type: enum
        source: system
        description: "Kind of ledger movement; every value is produced by a declared transition."
        constraints: "ASSESSMENT | WAIVER_CREDIT | PAYMENT | EXAM_FEE_REVERSAL | PERMIT_FEE | PERMIT_FEE_REVERSAL | CONVERSION_CREDIT"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed movement in cents: ASSESSMENT and PERMIT_FEE are positive; WAIVER_CREDIT, PAYMENT, EXAM_FEE_REVERSAL, PERMIT_FEE_REVERSAL and CONVERSION_CREDIT are negative."
      - name: memo
        type: string
        source: system
        description: "Fixed machine memo string per entry_type, e.g. `submit assessment`, `permit fee reversal`."

  - name: Evaluator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Contract reviewer who performs national-database disciplinary review."
      - name: profession_code
        type: string
        source: input
        description: "Profession.profession_code this evaluator is credentialed to review; must match the application's profession."
      - name: status
        type: enum
        source: input
        description: "Only ACTIVE evaluators may take new assignments."
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: max_concurrent_reviews
        type: integer
        source: input
        description: "Aggregate cap on ReviewAssignment rows with status ASSIGNED for this evaluator."
        default: 2
        constraints: ">= 1"
      - name: open_assignment_count
        type: integer
        source: computed
        description: "Count of ReviewAssignment rows for this evaluator with status == ASSIGNED per calculations.evaluator_open_assignment_count."
        default: 0

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - name: evaluator_id
        type: string
        source: input
        description: "FK -> Evaluator.id; the reviewer occupying the slot."
      - name: application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; the application under review."
      - name: window_start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the reviewer's closed occupation interval."
      - name: window_end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the reviewer's closed occupation interval; must be strictly after window_start_at."
      - name: status
        type: enum
        source: system
        description: "ASSIGNED while open; COMPLETED when the application is approved; RELEASED when the application leaves the reviewable set."
        default: ASSIGNED
        constraints: "ASSIGNED | COMPLETED | RELEASED"
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the assignment left ASSIGNED; null while ASSIGNED."
        default: null

  - name: ReciprocalAgreement
    parent: null
    common_fields: true
    fields:
      - name: profession_id
        type: string
        source: input
        description: "FK -> Profession.id; the profession the compact covers."
      - name: partner_state
        type: string
        source: input
        description: "Two-letter code of the partner state; matched against Applicant.state_code."
        constraints: "exactly 2 uppercase letters"
      - name: fee_waiver_pct
        type: number
        source: input
        description: "Waiver fraction granted to non-military applicants residing in partner_state."
        constraints: "0.00-1.00, two decimal places"
      - name: exam_waiver_allowed
        type: boolean
        source: input
        description: "Whether the compact allows the national examination to be waived regardless of equivalency score."
        default: false
      - name: jurisprudence_waiver_allowed
        type: boolean
        source: input
        description: "Whether the compact waives this state's jurisprudence exam."
        default: false
      - name: expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which the compact no longer applies (compact applies while clock_now <= expires_on)."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: LicenseApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    shape: "cyclic + branching (UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW loop capped at MAX_DEFICIENCY_CYCLES=2; UNDER_REVIEW branches to {DEFICIENT, DENIED, APPROVED, SUSPENDED_REVIEW})"
    transitions:

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensure/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == LicenseApplication.applicant_id"
          - "Applicant.good_standing_flag == true"
          - "LicenseApplication.pathway_risk_index < PATHWAY_BAR_INDEX (12.00) using the pathway-selected variant"
          - "pathway == MILITARY_SPOUSE_EXPEDITED implies Applicant.military_status == MILITARY_SPOUSE"
          - "pathway == UNIVERSAL_RECOGNITION implies Applicant.residency_months >= Profession.universal_recognition_min_residency_months"
          - "count of OutOfStateCredential rows with applicant_id == LicenseApplication.applicant_id AND status == ACTIVE AND verified_good_standing == true is >= 1"
          - "the row referenced by primary_credential_id is a member of that qualifying set"
        side_effects:
          - "submitted_at = clock_now; status = SUBMITTED"
          - "review_deadline_at = calculations.review_deadline"
          - "statutory_waiver_pct and gross_total_cents = calculations.net_fee_due_cents (steps 3 and 4)"
          - "append FeeLedgerEntry {entry_type: ASSESSMENT, amount_cents: +gross_total_cents, memo: 'submit assessment'}"
          - "then append FeeLedgerEntry {entry_type: WAIVER_CREDIT, amount_cents: -waiver_credit_cents, memo: 'statutory waiver credit'} (append order pinned: ASSESSMENT before WAIVER_CREDIT)"
          - "fee_balance_cents = calculations.application_fee_balance"
          - "requirement_hours_remaining = Profession.requirement_hours_total - requirement_hours_satisfied"
          - "version += 1"
        note: "WAIVER_CREDIT is appended even when waiver_credit_cents == 0, so the ledger always carries exactly two entries after submit."

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /licensure/credential-evaluations (creating the application's evaluation)"
        actor: LicensingAnalyst
        preconditions:
          - "status == SUBMITTED"
          - "no CredentialEvaluation row exists with application_id == this application"
          - "OutOfStateCredential(credential_id).applicant_id == LicenseApplication.applicant_id"
        side_effects:
          - "create CredentialEvaluation with scope_review_status = PENDING, discipline_review_status = PENDING, overall_status = IN_PROGRESS"
          - "CredentialEvaluation.variant = UNIVERSAL_RECOGNITION when pathway == UNIVERSAL_RECOGNITION else STRICT_SCOPE"
          - "CredentialEvaluation.matched_scope_elements and missing_scope_elements computed immediately from Profession.required_scope_elements"
          - "status = UNDER_REVIEW; version += 1"

      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /licensure/applications/{id}/deficiency"
        actor: LicensingAnalyst
        preconditions:
          - "status == UNDER_REVIEW"
          - "deficiency_cycle_count + 1 <= MAX_DEFICIENCY_CYCLES (2)"
        side_effects:
          - "deficiency_cycle_count += 1; status = DEFICIENT; version += 1"
        note: "Branch A of the deficiency endpoint. Any ACTIVE TemporaryPermit stays ACTIVE — DEFICIENT is still inside the reviewable set."

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /licensure/applications/{id}/deficiency (third deficiency)"
        actor: LicensingAnalyst
        preconditions:
          - "status == UNDER_REVIEW"
          - "deficiency_cycle_count + 1 > MAX_DEFICIENCY_CYCLES (2)"
        side_effects:
          - "deficiency_cycle_count += 1; status = DENIED; decided_at = clock_now; decided_by_user_id = X-User-ID"
          - "processing_elapsed_days and processing_standard_met = calculations.processing_time_metrics"
          - "cascade: every TemporaryPermit of this application with status == ACTIVE -> REVOKED (see state_machines.TemporaryPermit ACTIVE_to_REVOKED)"
          - "cascade: every ReviewAssignment of this application with status == ASSIGNED -> RELEASED (see state_machines.ReviewAssignment ASSIGNED_to_RELEASED)"
          - "version += 1"
        note: "Branch B of the same endpoint: exceeding the deficiency cap denies instead of looping."

      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /licensure/applications/{id}/cure"
        actor: Applicant
        preconditions:
          - "status == DEFICIENT"
          - "X-User-ID == LicenseApplication.applicant_id"
        side_effects:
          - "status = UNDER_REVIEW; version += 1"
        note: "Closes the revision cycle; deficiency_cycle_count is NOT decremented, so the cap is cumulative."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /licensure/applications/{id}/decision with decision == APPROVE"
        actor: BoardDeputy
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != LicenseApplication.scope_reviewed_by_user_id (segregation of duties)"
          - "Applicant.good_standing_flag == true AND pathway_risk_index < PATHWAY_BAR_INDEX (12.00)"
          - "the application's CredentialEvaluation exists with overall_status == COMPLETE"
          - "requirement_hours_remaining == 0.0"
          - "CredentialEvaluation.exam_waiver_granted == true OR national_exam_passed == true"
          - "Profession.jurisprudence_exam_required == false OR jurisprudence_exam_passed == true OR a ReciprocalAgreement row exists with profession_id == this profession AND partner_state == Applicant.state_code AND jurisprudence_waiver_allowed == true AND clock_now <= expires_on"
          - "fee_balance_cents <= 0"
        side_effects:
          - "status = APPROVED; decided_at = clock_now; decided_by_user_id = X-User-ID"
          - "processing_elapsed_days and processing_standard_met = calculations.processing_time_metrics"
          - "CASCADE LINK 1: mint License {application_id, profession_id, license_number, status: ACTIVE, issued_at: clock_now, expires_at: issued_at + LICENSE_TERM_DAYS}"
          - "CASCADE LINK 2 (caused by link 1, because a License now exists for this application): the application's TemporaryPermit with status == ACTIVE -> CONVERTED, converted_at = clock_now, expires_at truncated to converted_at, and License.converted_from_permit_id = that permit's id"
          - "CASCADE LINK 3 (caused by link 2, because the permit's window was truncated): append FeeLedgerEntry {entry_type: CONVERSION_CREDIT, amount_cents: calculations.permit_conversion_credit_cents (negative), memo: 'permit conversion credit'} and recompute fee_balance_cents"
          - "fan-out of link 1: every ReviewAssignment of this application with status == ASSIGNED -> COMPLETED"
          - "version += 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /licensure/applications/{id}/decision with decision == DENY"
        actor: BoardDeputy
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != LicenseApplication.scope_reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "status = DENIED; decided_at = clock_now; decided_by_user_id = X-User-ID"
          - "processing_elapsed_days and processing_standard_met = calculations.processing_time_metrics"
          - "cascade: every TemporaryPermit of this application with status == ACTIVE -> REVOKED"
          - "cascade: every ReviewAssignment of this application with status == ASSIGNED -> RELEASED"
          - "version += 1"
        note: "DENY skips every substantive precondition of APPROVE except state and segregation of duties."

      - from: SUBMITTED
        to: SUSPENDED_REVIEW
        trigger: "system, on POST /licensure/disciplinary-records whose write flips Applicant.good_standing_flag true -> false"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "the posted record belongs to LicenseApplication.applicant_id"
          - "Applicant.good_standing_flag transitioned true -> false on this write"
        side_effects:
          - "status = SUSPENDED_REVIEW; version += 1"
          - "CASCADE LINK 3 (caused by leaving the reviewable set): TemporaryPermit with status == ACTIVE -> REVOKED"
          - "CASCADE LINK 3': ReviewAssignment with status == ASSIGNED -> RELEASED"

      - from: UNDER_REVIEW
        to: SUSPENDED_REVIEW
        trigger: "system, on POST /licensure/disciplinary-records whose write flips Applicant.good_standing_flag true -> false"
        actor: system
        preconditions:
          - "status == UNDER_REVIEW"
          - "the posted record belongs to LicenseApplication.applicant_id"
          - "Applicant.good_standing_flag transitioned true -> false on this write"
        side_effects:
          - "status = SUSPENDED_REVIEW; version += 1"
          - "CASCADE LINK 3 (caused by leaving the reviewable set): TemporaryPermit with status == ACTIVE -> REVOKED"
          - "CASCADE LINK 3': ReviewAssignment with status == ASSIGNED -> RELEASED"

      - from: DEFICIENT
        to: SUSPENDED_REVIEW
        trigger: "system, on POST /licensure/disciplinary-records whose write flips Applicant.good_standing_flag true -> false"
        actor: system
        preconditions:
          - "status == DEFICIENT"
          - "the posted record belongs to LicenseApplication.applicant_id"
          - "Applicant.good_standing_flag transitioned true -> false on this write"
        side_effects:
          - "status = SUSPENDED_REVIEW; version += 1"
          - "CASCADE LINK 3 (caused by leaving the reviewable set): TemporaryPermit with status == ACTIVE -> REVOKED"
          - "CASCADE LINK 3': ReviewAssignment with status == ASSIGNED -> RELEASED"

      - from: SUSPENDED_REVIEW
        to: UNDER_REVIEW
        trigger: "system, on POST /licensure/disciplinary-records/{id}/resolve whose write flips Applicant.good_standing_flag false -> true"
        actor: system
        preconditions:
          - "status == SUSPENDED_REVIEW"
          - "Applicant.good_standing_flag transitioned false -> true on this write"
          - "a CredentialEvaluation row exists with application_id == this application"
        side_effects:
          - "status = UNDER_REVIEW; version += 1"
        note: "Permits revoked during suspension are NOT restored — the applicant must request a new permit."

      - from: SUSPENDED_REVIEW
        to: SUBMITTED
        trigger: "system, on POST /licensure/disciplinary-records/{id}/resolve whose write flips Applicant.good_standing_flag false -> true"
        actor: system
        preconditions:
          - "status == SUSPENDED_REVIEW"
          - "Applicant.good_standing_flag transitioned false -> true on this write"
          - "no CredentialEvaluation row exists with application_id == this application"
        side_effects:
          - "status = SUBMITTED; version += 1"

  - entity: CredentialEvaluation
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETE]
    shape: "parallel dimensions — scope_review_status and discipline_review_status advance independently on the same row; overall_status is their compound"
    transitions:

      - from: PENDING
        to: EQUIVALENT
        dimension: scope_review_status
        trigger: "POST /licensure/credential-evaluations/{id}/scope-review with decision == EQUIVALENT"
        actor: LicensingAnalyst
        preconditions:
          - "scope_review_status == PENDING"
          - "finalized_at == null"
          - "LicenseApplication.status IN {UNDER_REVIEW, DEFICIENT}"
          - "missing_scope_elements contains no member of Profession.critical_scope_elements"
        side_effects:
          - "scope_review_status = EQUIVALENT; reviewed_by_user_id = X-User-ID"
          - "LicenseApplication.scope_reviewed_by_user_id = X-User-ID; LicenseApplication.version += 1"
          - "overall_status = calculations.evaluation_overall_status (stays IN_PROGRESS until finalize)"
          - "version += 1"

      - from: PENDING
        to: DEFICIENT_SCOPE
        dimension: scope_review_status
        trigger: "POST /licensure/credential-evaluations/{id}/scope-review with decision == DEFICIENT_SCOPE"
        actor: LicensingAnalyst
        preconditions:
          - "scope_review_status == PENDING"
          - "finalized_at == null"
          - "LicenseApplication.status IN {UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "scope_review_status = DEFICIENT_SCOPE; reviewed_by_user_id = X-User-ID"
          - "LicenseApplication.scope_reviewed_by_user_id = X-User-ID; LicenseApplication.version += 1"
          - "version += 1"
        note: "DEFICIENT_SCOPE does not block finalize; it only feeds the score through missing_scope_elements."

      - from: PENDING
        to: CLEAR
        dimension: discipline_review_status
        trigger: "POST /licensure/credential-evaluations/{id}/discipline-finding with finding == CLEAR"
        actor: Evaluator
        preconditions:
          - "discipline_review_status == PENDING"
          - "finalized_at == null"
          - "a ReviewAssignment row exists with application_id == CredentialEvaluation.application_id AND evaluator_id == X-User-ID AND status == ASSIGNED"
          - "clock_now <= that ReviewAssignment.window_end_at"
        side_effects:
          - "discipline_review_status = CLEAR; version += 1"
          - "overall_status = calculations.evaluation_overall_status"

      - from: PENDING
        to: ADVERSE
        dimension: discipline_review_status
        trigger: "POST /licensure/credential-evaluations/{id}/discipline-finding with finding == ADVERSE"
        actor: Evaluator
        preconditions:
          - "discipline_review_status == PENDING"
          - "finalized_at == null"
          - "a ReviewAssignment row exists with application_id == CredentialEvaluation.application_id AND evaluator_id == X-User-ID AND status == ASSIGNED"
          - "clock_now <= that ReviewAssignment.window_end_at"
        side_effects:
          - "discipline_review_status = ADVERSE; version += 1"
          - "overall_status = calculations.evaluation_overall_status"
        note: "ADVERSE does not by itself suspend the application — only a posted DisciplinaryRecord that flips good_standing_flag does."

      - from: IN_PROGRESS
        to: COMPLETE
        dimension: overall_status
        trigger: "POST /licensure/credential-evaluations/{id}/finalize"
        actor: LicensingAnalyst
        preconditions:
          - "overall_status == IN_PROGRESS AND finalized_at == null"
          - "scope_review_status != PENDING AND discipline_review_status != PENDING (both parallel dimensions resolved)"
          - "LicenseApplication.status IN {UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "equivalency_score = calculations.substantial_equivalency_score under this row's variant"
          - "exam_waiver_granted = (equivalency_score >= Profession.exam_waiver_min_score) OR (a ReciprocalAgreement row exists with profession_id == this profession AND partner_state == Applicant.state_code AND exam_waiver_allowed == true AND clock_now <= expires_on)"
          - "finalized_at = clock_now; overall_status = COMPLETE"
          - "when exam_waiver_granted == true: append FeeLedgerEntry {entry_type: EXAM_FEE_REVERSAL, amount_cents: -(Profession.exam_fee_cents - round_half_up(Profession.exam_fee_cents * LicenseApplication.statutory_waiver_pct)), memo: 'exam fee reversal'} and recompute LicenseApplication.fee_balance_cents; LicenseApplication.version += 1"
          - "version += 1"

  - entity: TemporaryPermit
    initial_state: ACTIVE
    terminal_states: [CONVERTED, EXPIRED, REVOKED]
    shape: "branching — one ACTIVE node forks to three terminal outcomes with divergent side-effect sets"
    transitions:

      - from: ACTIVE
        to: CONVERTED
        trigger: "system, on the LicenseApplication UNDER_REVIEW -> APPROVED transition (cascade link 2)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "a License row was just minted for this permit's application_id"
        side_effects:
          - "status = CONVERTED; converted_at = clock_now; expires_at = converted_at"
          - "append FeeLedgerEntry {entry_type: CONVERSION_CREDIT, amount_cents: calculations.permit_conversion_credit_cents, memo: 'permit conversion credit'}"
          - "LicenseApplication.fee_balance_cents recomputed; License.converted_from_permit_id = this permit's id"
          - "version += 1"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /licensure/temporary-permits/{id}/revoke, or system on the application leaving the reviewable set (SUSPENDED_REVIEW / DENIED cascades)"
        actor: BoardDeputy | system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status = REVOKED; revoked_at = clock_now; expires_at = revoked_at; revocation_reason_code = the revoke call's reason_code, or DISCIPLINARY_ACTION / APPLICATION_DENIED for the two system cascades"
          - "append FeeLedgerEntry {entry_type: PERMIT_FEE_REVERSAL, amount_cents: -permit_fee_cents, memo: 'permit fee reversal'}"
          - "LicenseApplication.fee_balance_cents recomputed; LicenseApplication.version += 1"
          - "version += 1"
        note: "Full reversal, not prorated — this is the compensating action of the PERMIT_FEE entry and leaves fee_balance_cents exactly at its pre-issuance value."

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /licensure/permit-expiry-runs (ops sweep)"
        actor: AgencyAdmin
        preconditions:
          - "status == ACTIVE"
          - "expires_at <= clock_now"
        side_effects:
          - "status = EXPIRED; version += 1"
        note: "No ledger movement — an expired permit consumed its full window, so the fee stands."

  - entity: ReviewAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, RELEASED]
    shape: "branching"
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "system, on the LicenseApplication UNDER_REVIEW -> APPROVED transition"
        actor: system
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "status = COMPLETED; closed_at = clock_now"
          - "Evaluator.open_assignment_count = calculations.evaluator_open_assignment_count; Evaluator.version += 1"
          - "version += 1"
      - from: ASSIGNED
        to: RELEASED
        trigger: "system, on the application entering SUSPENDED_REVIEW or DENIED"
        actor: system
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "status = RELEASED; closed_at = clock_now"
          - "Evaluator.open_assignment_count = calculations.evaluator_open_assignment_count; Evaluator.version += 1"
          - "version += 1"

  - entity: CreditAward
    initial_state: AWARDED
    terminal_states: [REVOKED]
    shape: "linear with compensation"
    transitions:
      - from: AWARDED
        to: REVOKED
        trigger: "POST /licensure/credit-awards/{id}/revoke"
        actor: LicensingAnalyst
        preconditions:
          - "status == AWARDED"
          - "LicenseApplication.status IN {SUBMITTED, UNDER_REVIEW, DEFICIENT}"
        side_effects:
          - "status = REVOKED; revoked_at = clock_now"
          - "LicenseApplication.requirement_hours_satisfied and requirement_hours_remaining recomputed by calculations.military_credit_hours over the remaining AWARDED rows; LicenseApplication.version += 1"
          - "version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:

  - rule_id: permit-issue-stale-application
    parent_entity: LicenseApplication
    write_endpoint: "POST /licensure/temporary-permits"
    occ_field: "expected_application_version"
    description: |
      Issuing a TemporaryPermit against a LicenseApplication whose version has
      advanced since the analyst last read it is rejected as stale. A permit
      issued against a stale view would legitimately supersede the applicant's
      practice authority for an overlapping window, so the API demands the
      version the writer actually observed instead of silently stacking permits.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: review-assignment-stale-evaluator
    parent_entity: Evaluator
    write_endpoint: "POST /licensure/review-assignments"
    occ_field: "expected_evaluator_version"
    description: |
      Creating a ReviewAssignment against an Evaluator whose version has advanced
      since the analyst last read it is rejected as stale. The evaluator's
      remaining capacity and slot geometry are exactly what the writer was
      reasoning about, so a booking built on a stale view of open_assignment_count
      is refused rather than admitted and later reconciled.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: substantial_equivalency_score
    trigger: "POST /licensure/credential-evaluations/{id}/finalize (CredentialEvaluation IN_PROGRESS -> COMPLETE side effect sets equivalency_score)"
    algorithm: weighted_scoring
    formula: |
      required      = Profession.required_scope_elements                 # ordered, non-empty
      granted       = OutOfStateCredential(credential_id).scope_elements
      matched       = [e for e in required if e in granted]              # Profession order
      missing       = [e for e in required if e not in granted]          # Profession order
      scope_ratio   = len(matched) / len(required)
      hours_ratio   = min(1.0, OutOfStateCredential.practice_hours / Profession.required_practice_hours)
      if CredentialEvaluation.variant == "UNIVERSAL_RECOGNITION"
         and Applicant.residency_months >= Profession.universal_recognition_min_residency_months:
             hours_ratio = 1.0                                          # residency substitutes for documented hours
      standing      = 1.0 if OutOfStateCredential.verified_good_standing else 0.0
      raw           = W_SCOPE * scope_ratio + W_HOURS * hours_ratio + W_STANDING * standing
      critical_miss = count of e in missing where e in Profession.critical_scope_elements
      penalty       = CRITICAL_MISS_PENALTY * critical_miss if variant == "STRICT_SCOPE" else 0.0
      equivalency_score = round_half_up(raw * 100 - penalty, 2)          # clamped to [0.00, 100.00]
    input_set: "Exactly one OutOfStateCredential — the row named by CredentialEvaluation.credential_id — regardless of how many other credentials the applicant filed. Credential status is NOT re-filtered here; the ACTIVE/verified filter was enforced at submit."
    constants:
      W_SCOPE: 0.60
      W_HOURS: 0.25
      W_STANDING: 0.15
      CRITICAL_MISS_PENALTY: 10.0
    precision: "2 decimal places, round_half_up; clamp to [0.00, 100.00] after the penalty"
    variants:
      - name: STRICT_SCOPE
        when: "CredentialEvaluation.variant == STRICT_SCOPE (application pathway IN {ENDORSEMENT, MILITARY_SPOUSE_EXPEDITED})"
        difference: "Subtracts CRITICAL_MISS_PENALTY per missing critical scope element and never substitutes residency for hours_ratio."
      - name: UNIVERSAL_RECOGNITION
        when: "CredentialEvaluation.variant == UNIVERSAL_RECOGNITION (application pathway == UNIVERSAL_RECOGNITION)"
        difference: "Ignores critical-miss penalties entirely and lifts hours_ratio to 1.0 once residency_months clears the profession's universal-recognition minimum — identical credential data therefore scores strictly higher."

  - name: applicant_disciplinary_risk_index
    trigger: "POST /licensure/disciplinary-records and POST /licensure/disciplinary-records/{id}/resolve (both variants recomputed on every such write)"
    algorithm: decay_function
    formula: |
      for variant_key in ("reported_at", "action_effective_at"):
          rows = DisciplinaryRecord where applicant_id == Applicant.id and resolved == false
          rows = sort(rows, key = (row[variant_key] ASC, row.created_at ASC))   # tie-break created_at, never id
          running = 0.00
          for row in rows:
              age_years    = floor((clock_now - row[variant_key]) / 365 days)   # whole 365-day blocks
              factor       = max(DECAY_FLOOR, 1.0 - DECAY_PER_FULL_YEAR * age_years)
              contribution = round_half_up(SEVERITY_POINTS[row.severity] * factor, 2)
              running      = running + contribution
              if running > INDEX_CEILING: running = INDEX_CEILING               # ceiling applied per row, order-sensitive
          store round_half_up(running, 2) into
              disciplinary_risk_index_reported   if variant_key == "reported_at"
              disciplinary_risk_index_effective  if variant_key == "action_effective_at"
      good_standing_flag = (no row with resolved == false and severity IN {SUSPENSION, REVOKED_SET})
                           and disciplinary_risk_index_reported < GOOD_STANDING_MAX_INDEX
      # REVOKED_SET is the literal severity value REVOCATION.
      LicenseApplication.pathway_risk_index =
          disciplinary_risk_index_reported   if pathway == UNIVERSAL_RECOGNITION
          disciplinary_risk_index_effective  otherwise
    input_set: "Every DisciplinaryRecord of the applicant with resolved == false. Resolved rows leave both sweeps entirely. Records are never filtered by source_database."
    constants:
      SEVERITY_POINTS: { ADVISORY: 5, PROBATION: 15, SUSPENSION: 30, REVOCATION: 60 }
      DECAY_PER_FULL_YEAR: 0.20
      DECAY_FLOOR: 0.20
      INDEX_CEILING: 100.00
      GOOD_STANDING_MAX_INDEX: 25.00
      PATHWAY_BAR_INDEX: 12.00
    precision: "2 decimal places, round_half_up per contribution and again on the running total"
    variants:
      - name: REPORTED_AT
        when: "Persisted to Applicant.disciplinary_risk_index_reported; selected as pathway_risk_index for pathway == UNIVERSAL_RECOGNITION and always used for good_standing_flag"
        difference: "Ages each action from the date the national database surfaced it, so recently-surfaced old actions decay little and score high."
      - name: EFFECTIVE_AT
        when: "Persisted to Applicant.disciplinary_risk_index_effective; selected as pathway_risk_index for pathways ENDORSEMENT and MILITARY_SPOUSE_EXPEDITED"
        difference: "Ages each action from the sister state's effective date, so the same rows decay further and the index — and the processing order of the sweep — differ from REPORTED_AT."

  - name: net_fee_due_cents
    trigger: "LicenseApplication DRAFT -> SUBMITTED transition (POST /licensure/applications/{id}/submit); sets statutory_waiver_pct, gross_total_cents and the two ledger entries"
    algorithm: threshold
    formula: |
      # STEP 1 — components, pre-waiver (integer cents)
      base_component          = Profession.base_fee_cents
      endorsement_component   = Profession.endorsement_fee_cents
                                 if pathway IN {ENDORSEMENT, UNIVERSAL_RECOGNITION} else 0
      exam_component          = Profession.exam_fee_cents
      jurisprudence_component = Profession.jurisprudence_fee_cents
                                 if Profession.jurisprudence_exam_required else 0
      gross_subtotal_cents    = base_component + endorsement_component
                                + exam_component + jurisprudence_component
      # STEP 2 — expedite surcharge (keyed on the STEP 1 subtotal, never on the net)
      expedite_surcharge_cents = round_half_up(gross_subtotal_cents * Profession.expedite_surcharge_pct)
                                 if LicenseApplication.expedited else 0
      # STEP 3
      gross_total_cents = gross_subtotal_cents + expedite_surcharge_cents
      # STEP 4 — waiver tier. EVALUATION ORDER IS PINNED: the tier is keyed on
      # gross_total_cents from STEP 3, NOT on the net total from STEP 6, even
      # though the tier is what produces the net. Reading the tier off the net
      # would be circular and is forbidden.
      if pathway == MILITARY_SPOUSE_EXPEDITED or Applicant.military_status IN {SERVICE_MEMBER, MILITARY_SPOUSE, VETERAN}:
          statutory_waiver_pct = 1.00 if gross_total_cents <= MILITARY_FULL_WAIVER_CAP_CENTS else 0.50
      elif exists ReciprocalAgreement r with r.profession_id == profession_id
           and r.partner_state == Applicant.state_code and clock_now <= r.expires_on:
          statutory_waiver_pct = r.fee_waiver_pct
          # candidate set tie-break: lowest partner_state alphabetically cannot tie
          # (partner_state is unique per profession_id, enforced at §1.4 priority 3)
      else:
          statutory_waiver_pct = 0.00
      # STEP 5 — waiver credit: ROUND PER COMPONENT, THEN SUM (order pinned;
      # summing first and rounding once is a different, forbidden answer)
      waiver_credit_cents = round_half_up(base_component          * statutory_waiver_pct)
                          + round_half_up(endorsement_component   * statutory_waiver_pct)
                          + round_half_up(exam_component          * statutory_waiver_pct)
                          + round_half_up(jurisprudence_component * statutory_waiver_pct)
                          + round_half_up(expedite_surcharge_cents * statutory_waiver_pct)
      # STEP 6
      net_fee_due_cents = gross_total_cents - waiver_credit_cents
    input_set: "One Profession row (the application's), one Applicant row, and at most one ReciprocalAgreement row matching (profession_id, Applicant.state_code) that has not expired at clock_now. Military eligibility short-circuits the compact branch entirely."
    constants:
      MILITARY_FULL_WAIVER_CAP_CENTS: 40000
    precision: "integer cents; round_half_up applied per component in STEP 5 before summing"

  - name: military_credit_hours
    trigger: "POST /licensure/credit-awards and POST /licensure/credit-awards/{id}/revoke (both recompute LicenseApplication.requirement_hours_satisfied / requirement_hours_remaining)"
    algorithm: aggregation
    formula: |
      # STEP 1 — per-record conversion, ROUNDED PER RECORD to one decimal.
      # CreditAward.awarded_hours stores this rounded value.
      awarded_hours(award) = round_half_up(
          MilitaryTrainingRecord(award.training_record_id).documented_hours
          * CONVERSION_FACTOR[MilitaryTrainingRecord.category], 1)
      # STEP 2 — sum the ALREADY-ROUNDED per-record values in created_at ASC order.
      # "Sum the raw products then round once" is a different answer and is forbidden.
      raw_sum = sum(awarded_hours(a) for a in CreditAward
                    where a.application_id == this application and a.status == AWARDED
                    ordered by a.created_at ASC)
      requirement_hours_satisfied = min(Profession.requirement_hours_total, round_half_up(raw_sum, 1))
      requirement_hours_remaining = Profession.requirement_hours_total - requirement_hours_satisfied
      # INVARIANT (conserved quantity: requirement hours)
      # requirement_hours_satisfied + requirement_hours_remaining == Profession.requirement_hours_total
    input_set: "CreditAward rows of this application with status == AWARDED only; REVOKED rows leave the sum entirely. Unverified MilitaryTrainingRecords can never enter because §1.4 rejects the award at creation."
    constants:
      CONVERSION_FACTOR: { MOS_TRAINING: 0.75, FIELD_EXPERIENCE: 0.40, JOINT_SERVICE_TRANSCRIPT: 0.90 }
    precision: "1 decimal place, round_half_up, applied per record in STEP 1 and once more on raw_sum in STEP 2"

  - name: review_deadline
    trigger: "LicenseApplication DRAFT -> SUBMITTED transition"
    algorithm: threshold
    formula: |
      processing_days = EXPEDITE_PROCESSING_DAYS
                        if (LicenseApplication.expedited == true
                            or pathway == MILITARY_SPOUSE_EXPEDITED)
                        else Profession.standard_processing_days
      review_deadline_at = submitted_at + processing_days days
    input_set: "The application's own pathway/expedited flags and its Profession's published standard."
    constants:
      EXPEDITE_PROCESSING_DAYS: 30
    precision: "whole days added to the ISO 8601 UTC submitted_at instant"

  - name: permit_window
    trigger: "POST /licensure/temporary-permits (sets expires_at, permit_max_days, permit_fee_cents at issuance)"
    algorithm: interval_merge
    formula: |
      permit_max_days = PERMIT_MAX_DAYS[LicenseApplication.pathway]
      candidate_pathway_cap = effective_at + permit_max_days days
      candidate_review_cap  = LicenseApplication.review_deadline_at + PERMIT_GRACE_DAYS days
      expires_at = min(candidate_pathway_cap, candidate_review_cap)      # nested cap, three inputs
      permit_fee_cents = Profession.permit_fee_cents
                         - round_half_up(Profession.permit_fee_cents * LicenseApplication.statutory_waiver_pct)
      # Occupation interval is HALF-OPEN: [effective_at, expires_at).
      # A new permit whose effective_at equals an existing permit's expires_at does
      # NOT collide (see §1.4 priority 30).
    input_set: "The application's pathway, review_deadline_at and statutory_waiver_pct, plus the requested effective_at. No other permit affects the geometry — collision is a §1.4 validation, not a calculation."
    constants:
      PERMIT_MAX_DAYS: { ENDORSEMENT: 90, UNIVERSAL_RECOGNITION: 120, MILITARY_SPOUSE_EXPEDITED: 180 }
      PERMIT_GRACE_DAYS: 30
    precision: "whole days; integer cents with round_half_up on the waiver portion"

  - name: permit_conversion_credit_cents
    trigger: "TemporaryPermit ACTIVE -> CONVERTED (cascade link 3 of the APPROVE transition)"
    algorithm: aggregation
    formula: |
      total_days   = floor((expires_at_before_truncation - effective_at) / 1 day)
      elapsed_days = floor((clock_now - effective_at) / 1 day)
      unused_days  = max(0, total_days - elapsed_days)
      credit_cents = 0 if total_days == 0
                     else round_half_up(permit_fee_cents * unused_days / total_days)
      CONVERSION_CREDIT.amount_cents = -credit_cents
    input_set: "The single permit being converted, using its pre-truncation expires_at. total_days == 0 (same-instant conversion) yields a zero credit and no drift."
    constants: {}
    precision: "integer cents, round_half_up on the prorated product"

  - name: application_fee_balance
    trigger: "every FeeLedgerEntry append (submit assessment, waiver credit, payment, exam fee reversal, permit fee, permit fee reversal, conversion credit)"
    algorithm: aggregation
    formula: |
      fee_balance_cents = sum(e.amount_cents for e in FeeLedgerEntry
                              where e.application_id == this application)
      # No status filter — FeeLedgerEntry is append-only and immutable, so the sum
      # over all entries in created_at ASC order is the balance by construction.
      # INVARIANT (conserved quantity: cents)
      # After PERMIT_FEE(+p) followed by PERMIT_FEE_REVERSAL(-p) the balance equals
      # its pre-issuance value exactly, for any p.
    input_set: "All FeeLedgerEntry rows of the application, ordered created_at ASC; the order does not change the sum but pins the audit read order."
    constants: {}
    precision: "integer cents; no rounding (all entries are already integral)"

  - name: evaluation_overall_status
    trigger: "POST scope-review, POST discipline-finding, POST finalize"
    algorithm: constraint_propagation
    formula: |
      overall_status = COMPLETE if (scope_review_status != PENDING
                                    and discipline_review_status != PENDING
                                    and finalized_at != null)
                       else IN_PROGRESS
    input_set: "The two parallel dimension fields on this row plus finalized_at. No child entities participate."
    constants: {}
    precision: "n/a"

  - name: evaluator_open_assignment_count
    trigger: "POST /licensure/review-assignments, and the ReviewAssignment ASSIGNED -> COMPLETED / ASSIGNED -> RELEASED transitions"
    algorithm: aggregation
    formula: |
      open_assignment_count = count(a for a in ReviewAssignment
                                    where a.evaluator_id == Evaluator.id
                                    and a.status == ASSIGNED)
    input_set: "ReviewAssignment rows of this evaluator with status == ASSIGNED only; COMPLETED and RELEASED rows are excluded."
    constants: {}
    precision: "integer count"

  - name: processing_time_metrics
    trigger: "the APPROVED and DENIED transitions of LicenseApplication, and every GET that returns a LicenseApplication"
    algorithm: aggregation
    formula: |
      reference_instant      = decided_at if decided_at != null else clock_now
      processing_elapsed_days = 0 if submitted_at == null
                                else floor((reference_instant - submitted_at) / 1 day)
      processing_standard_met = null if decided_at == null
                                else (decided_at <= review_deadline_at)
    input_set: "The application's own submitted_at / decided_at / review_deadline_at fields and the logical clock."
    constants: {}
    precision: "whole days, floor"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending `priority` order; the
# FIRST violated row decides the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request shape: every required body field present; enums are declared members; datetimes are ISO 8601 UTC; integer cents and hour fields are >= their declared floor; arrays respect their size bounds; Profession.critical_scope_elements is a subset of required_scope_elements; ReviewAssignment.window_end_at > window_start_at; payment amount_cents > 0; Profession.profession_code unique; (profession_id, partner_state) unique across ReciprocalAgreement; limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: "ERR_PROFESSION_NOT_FOUND | ERR_APPLICANT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_CREDIT_AWARD_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_EVALUATOR_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_DISCIPLINARY_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves: applicant_id, profession_id, primary_credential_id, credential_id, application_id, training_record_id, evaluator_id"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_PROFESSION_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_TRAINING_RECORD_NOT_FOUND | ERR_EVALUATOR_NOT_FOUND"
    http_status: 404
    applies_to: "POST /licensure/applications, POST /licensure/credential-evaluations, POST /licensure/credit-awards, POST /licensure/temporary-permits, POST /licensure/review-assignments, POST /licensure/disciplinary-records"

  - priority: 6
    category: auth
    check: "an entity-backed caller may only act on its own rows: role Applicant requires X-User-ID == the target's applicant_id (or the body's applicant_id on create); role Evaluator requires X-User-ID == the ReviewAssignment.evaluator_id backing the operation, and this clause is evaluated ONLY when at least one ASSIGNED ReviewAssignment exists for the target application — when none exists the case belongs to priority 18, not here"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /licensure/applicants/{id}/out-of-state-credentials, POST /licensure/applicants/{id}/military-training-records, POST /licensure/applications, POST /licensure/applications/{id}/submit, POST /licensure/applications/{id}/cure, POST /licensure/applications/{id}/payments, POST /licensure/credential-evaluations/{id}/discipline-finding, and every GET whose target belongs to a different applicant when the caller's role is Applicant"

  - priority: 7
    category: state
    check: "expected_application_version equals LicenseApplication.version / expected_evaluator_version equals Evaluator.version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /licensure/temporary-permits, POST /licensure/review-assignments"

  - priority: 8
    category: state
    check: "the LicenseApplication is in a from-state permitted for this operation — submit requires DRAFT; cure requires DEFICIENT; deficiency, decision and credential-evaluation creation require UNDER_REVIEW (creation requires SUBMITTED); permit issuance, exam results and credit-award writes require status IN {SUBMITTED, UNDER_REVIEW, DEFICIENT}"
    error_id: ERR_APPLICATION_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /licensure/applications/{id}/submit, /cure, /deficiency, /decision, /exam-results, POST /licensure/credential-evaluations, POST /licensure/credit-awards, POST /licensure/credit-awards/{id}/revoke, POST /licensure/temporary-permits, POST /licensure/review-assignments"

  - priority: 9
    category: state
    check: "the TemporaryPermit is ACTIVE"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /licensure/temporary-permits/{id}/revoke"

  - priority: 10
    category: state
    check: "the CredentialEvaluation has finalized_at == null, and the dimension being written is still PENDING; finalize additionally requires both dimensions non-PENDING"
    error_id: ERR_EVALUATION_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /licensure/credential-evaluations/{id}/scope-review, /discipline-finding, /finalize"

  - priority: 11
    category: state
    check: "at most one CredentialEvaluation per application_id"
    error_id: ERR_EVALUATION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /licensure/credential-evaluations"

  - priority: 12
    category: state
    check: "the CreditAward is AWARDED / the DisciplinaryRecord has resolved == false"
    error_id: "ERR_CREDIT_AWARD_ALREADY_REVOKED | ERR_DISCIPLINARY_RECORD_ALREADY_RESOLVED"
    http_status: 409
    applies_to: "POST /licensure/credit-awards/{id}/revoke, POST /licensure/disciplinary-records/{id}/resolve"

  - priority: 13
    category: business_safety
    check: "disciplinary bar: reject when Applicant.good_standing_flag == false, or when LicenseApplication.pathway_risk_index >= PATHWAY_BAR_INDEX (12.00) using the pathway-selected risk-index variant"
    error_id: ERR_DISCIPLINARY_BAR
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/submit, POST /licensure/temporary-permits, POST /licensure/applications/{id}/decision with decision == APPROVE"

  - priority: 14
    category: business_safety
    check: "segregation of duties: X-User-ID must differ from LicenseApplication.scope_reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /licensure/applications/{id}/decision"

  - priority: 15
    category: business_referential
    check: "the referenced OutOfStateCredential.applicant_id equals the applicant of the application"
    error_id: ERR_CREDENTIAL_APPLICANT_MISMATCH
    http_status: 422
    applies_to: "POST /licensure/applications, POST /licensure/credential-evaluations"

  - priority: 16
    category: business_referential
    check: "Evaluator.profession_code equals Profession.profession_code of the application's profession"
    error_id: ERR_EVALUATOR_PROFESSION_MISMATCH
    http_status: 422
    applies_to: "POST /licensure/review-assignments"

  - priority: 17
    category: business_referential
    check: "Evaluator.status == ACTIVE"
    error_id: ERR_EVALUATOR_INACTIVE
    http_status: 422
    applies_to: "POST /licensure/review-assignments"

  - priority: 18
    category: business_referential
    check: "the calling Evaluator holds a ReviewAssignment for this evaluation's application with status == ASSIGNED"
    error_id: ERR_NO_OPEN_REVIEW_ASSIGNMENT
    http_status: 422
    applies_to: "POST /licensure/credential-evaluations/{id}/discipline-finding"

  - priority: 19
    category: business_temporal
    check: "clock_now <= that ReviewAssignment.window_end_at"
    error_id: ERR_REVIEW_WINDOW_LAPSED
    http_status: 422
    applies_to: "POST /licensure/credential-evaluations/{id}/discipline-finding"

  - priority: 20
    category: business_referential
    check: "for pathway IN {ENDORSEMENT, UNIVERSAL_RECOGNITION} a CredentialEvaluation row must already exist for the application; pathway MILITARY_SPOUSE_EXPEDITED is exempt (permits issue during full review)"
    error_id: ERR_EVALUATION_REQUIRED_FOR_PERMIT
    http_status: 422
    applies_to: "POST /licensure/temporary-permits"

  - priority: 21
    category: business_referential
    check: "the application's CredentialEvaluation exists with overall_status == COMPLETE"
    error_id: ERR_EVALUATION_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/decision with decision == APPROVE"

  - priority: 22
    category: business_constraint
    check: "pathway == MILITARY_SPOUSE_EXPEDITED requires Applicant.military_status == MILITARY_SPOUSE"
    error_id: ERR_MILITARY_STATUS_REQUIRED
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/submit"

  - priority: 23
    category: business_constraint
    check: "pathway == UNIVERSAL_RECOGNITION requires Applicant.residency_months >= Profession.universal_recognition_min_residency_months"
    error_id: ERR_RESIDENCY_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/submit"

  - priority: 24
    category: business_constraint
    check: "the qualifying credential set — OutOfStateCredential rows with applicant_id == the application's applicant AND status == ACTIVE AND verified_good_standing == true — is non-empty, and primary_credential_id belongs to it"
    error_id: ERR_NO_QUALIFYING_CREDENTIAL
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/submit"

  - priority: 25
    category: business_constraint
    check: "no other LicenseApplication for the same (applicant_id, profession_id) has status IN {SUBMITTED, UNDER_REVIEW, DEFICIENT, SUSPENDED_REVIEW, APPROVED}"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /licensure/applications"

  - priority: 26
    category: business_referential
    check: "MilitaryTrainingRecord.applicant_id equals the application's applicant_id"
    error_id: ERR_TRAINING_RECORD_APPLICANT_MISMATCH
    http_status: 422
    applies_to: "POST /licensure/credit-awards"

  - priority: 27
    category: business_constraint
    check: "MilitaryTrainingRecord.verified == true"
    error_id: ERR_TRAINING_RECORD_UNVERIFIED
    http_status: 422
    applies_to: "POST /licensure/credit-awards"

  - priority: 28
    category: business_constraint
    check: "no CreditAward with status == AWARDED already exists for this (application_id, training_record_id)"
    error_id: ERR_TRAINING_RECORD_ALREADY_CREDITED
    http_status: 409
    applies_to: "POST /licensure/credit-awards"

  - priority: 29
    category: business_temporal
    check: "effective_at >= clock_now (a permit may start now or later, never in the past)"
    error_id: ERR_PERMIT_EFFECTIVE_IN_PAST
    http_status: 422
    applies_to: "POST /licensure/temporary-permits"

  - priority: 30
    category: business_temporal
    check: "HALF-OPEN interval collision on the applicant's practice authority: reject when any TemporaryPermit with status IN {ACTIVE, CONVERTED} whose application shares (applicant_id, profession_id) with this application satisfies `new.effective_at < existing.expires_at AND existing.effective_at < new.expires_at`. Touching endpoints (new.effective_at == existing.expires_at) do NOT collide; zero buffer is applied."
    error_id: ERR_PERMIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /licensure/temporary-permits"

  - priority: 31
    category: business_temporal
    check: "CLOSED interval collision with a mandatory buffer on the evaluator's calendar: reject when any ReviewAssignment of the same evaluator with status == ASSIGNED satisfies `new.window_start_at - REVIEW_BUFFER_HOURS (24) <= existing.window_end_at AND existing.window_start_at <= new.window_end_at + REVIEW_BUFFER_HOURS (24)`. Adjacent and even 24-hour-separated windows therefore DO collide, unlike permits."
    error_id: ERR_EVALUATOR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /licensure/review-assignments"

  - priority: 32
    category: business_constraint
    check: "Evaluator.open_assignment_count + 1 <= Evaluator.max_concurrent_reviews"
    error_id: ERR_EVALUATOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /licensure/review-assignments"

  - priority: 33
    category: business_constraint
    check: "LicenseApplication.requirement_hours_remaining == 0.0"
    error_id: ERR_REQUIREMENT_HOURS_UNSATISFIED
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/decision with decision == APPROVE"

  - priority: 34
    category: business_constraint
    check: "CredentialEvaluation.exam_waiver_granted == true OR LicenseApplication.national_exam_passed == true"
    error_id: ERR_NATIONAL_EXAM_REQUIRED
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/decision with decision == APPROVE"

  - priority: 35
    category: business_constraint
    check: "Profession.jurisprudence_exam_required == false OR LicenseApplication.jurisprudence_exam_passed == true OR an unexpired ReciprocalAgreement for (profession_id, Applicant.state_code) has jurisprudence_waiver_allowed == true"
    error_id: ERR_JURISPRUDENCE_EXAM_REQUIRED
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/decision with decision == APPROVE"

  - priority: 36
    category: business_fiscal
    check: "LicenseApplication.fee_balance_cents <= 0"
    error_id: ERR_FEE_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /licensure/temporary-permits, POST /licensure/applications/{id}/decision with decision == APPROVE"

  - priority: 37
    category: business_fiscal
    check: "amount_cents <= LicenseApplication.fee_balance_cents (no overpayment; the ledger never goes credit-positive through a payment)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /licensure/applications/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table   (all business paths sit under /licensure)
# =============================================================================
endpoints:

  # ---- Profession & reciprocal agreements ----------------------------------
  - method: POST
    path: "/licensure/professions"
    description: "Register a regulated profession with its scope requirements, processing standard and fee schedule."
    roles: [AgencyAdmin]
    code: 201
    input: ["profession_code", "title", "required_scope_elements", "critical_scope_elements?", "required_practice_hours", "requirement_hours_total", "exam_waiver_min_score", "jurisprudence_exam_required?", "universal_recognition_min_residency_months", "standard_processing_days", "base_fee_cents", "endorsement_fee_cents", "exam_fee_cents", "jurisprudence_fee_cents", "permit_fee_cents", "expedite_surcharge_pct"]
    output: Profession
    side_effects: ["none"]

  - method: GET
    path: "/licensure/professions/{id}"
    description: "Read one profession."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: Profession
    side_effects: []

  - method: POST
    path: "/licensure/professions/{id}/reciprocal-agreements"
    description: "Record a reciprocal (compact) agreement between this profession and a partner state."
    roles: [AgencyAdmin]
    code: 201
    input: ["partner_state", "fee_waiver_pct", "exam_waiver_allowed?", "jurisprudence_waiver_allowed?", "expires_on"]
    output: ReciprocalAgreement
    side_effects: ["none"]

  - method: GET
    path: "/licensure/professions/{id}/reciprocal-agreements"
    description: "List the compacts recorded for this profession (reverse reachability for ReciprocalAgreement.profession_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: ReciprocalAgreement[]
    side_effects: []

  # ---- Applicant, credentials, training records, discipline ---------------
  - method: POST
    path: "/licensure/applicants"
    description: "Create an applicant record at agency intake. X-User-ID of role Applicant equals the returned id."
    roles: [AgencyAdmin]
    code: 201
    input: ["full_name", "state_code", "residency_months?", "military_status?"]
    output: Applicant
    side_effects: ["good_standing_flag = true; both risk indexes = 0.00; fee_waiver_eligible derived from military_status"]

  - method: GET
    path: "/licensure/applicants/{id}"
    description: "Read one applicant including both disciplinary risk-index variants and good_standing_flag."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/licensure/applicants/{id}/out-of-state-credentials"
    description: "File an out-of-state credential with its granted scope-of-practice elements."
    roles: [Applicant, AgencyAdmin]
    code: 201
    input: ["issuing_state", "license_number", "scope_elements", "practice_hours", "status?", "verified_good_standing?", "issued_at"]
    output: OutOfStateCredential
    side_effects: ["none"]

  - method: GET
    path: "/licensure/applicants/{id}/out-of-state-credentials"
    description: "List the applicant's credentials (reverse reachability for OutOfStateCredential.applicant_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutOfStateCredential[]
    side_effects: []

  - method: POST
    path: "/licensure/applicants/{id}/military-training-records"
    description: "File a military training or field-experience record for credit consideration."
    roles: [Applicant, AgencyAdmin]
    code: 201
    input: ["category", "documented_hours", "source_document", "verified?"]
    output: MilitaryTrainingRecord
    side_effects: ["none"]

  - method: GET
    path: "/licensure/applicants/{id}/military-training-records"
    description: "List the applicant's training records (reverse reachability for MilitaryTrainingRecord.applicant_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: MilitaryTrainingRecord[]
    side_effects: []

  - method: POST
    path: "/licensure/disciplinary-records"
    description: "Post a disciplinary action surfaced by a national database sweep."
    roles: [AgencyAdmin]
    code: 201
    input: [applicant_id, source_state, source_database, severity, action_effective_at, reported_at]
    output: DisciplinaryRecord
    side_effects:
      - "recompute Applicant.disciplinary_risk_index_reported and _effective and good_standing_flag (calculations.applicant_disciplinary_risk_index); Applicant.version += 1"
      - "cascade when good_standing_flag flips true -> false: every LicenseApplication of the applicant with status IN {SUBMITTED, UNDER_REVIEW, DEFICIENT} -> SUSPENDED_REVIEW, then each such application's ACTIVE TemporaryPermit -> REVOKED with revocation_reason_code = DISCIPLINARY_ACTION, then each revoked permit appends a PERMIT_FEE_REVERSAL entry and the application's fee_balance_cents is recomputed; ASSIGNED ReviewAssignments -> RELEASED with Evaluator.open_assignment_count refreshed"

  - method: GET
    path: "/licensure/applicants/{id}/disciplinary-records"
    description: "List the applicant's disciplinary records (reverse reachability for DisciplinaryRecord.applicant_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["resolved?", "limit?", "offset?"]
    output: DisciplinaryRecord[]
    side_effects: []

  - method: POST
    path: "/licensure/disciplinary-records/{id}/resolve"
    description: "Mark a disciplinary record resolved (sister state vacated or completed the action)."
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: DisciplinaryRecord
    side_effects:
      - "resolved = true; resolved_at = clock_now"
      - "recompute both Applicant risk-index variants and good_standing_flag; Applicant.version += 1"
      - "cascade when good_standing_flag flips false -> true: each SUSPENDED_REVIEW application returns to UNDER_REVIEW when it has a CredentialEvaluation, otherwise to SUBMITTED"

  # ---- LicenseApplication --------------------------------------------------
  - method: POST
    path: "/licensure/applications"
    description: "Open a DRAFT licensure application on one of the three portability pathways."
    roles: [Applicant]
    code: 201
    input: ["applicant_id", "profession_id", "primary_credential_id", "pathway", "expedited?"]
    output: LicenseApplication
    side_effects: ["status = DRAFT; requirement_hours_remaining = Profession.requirement_hours_total; pathway_risk_index seeded from the applicant's variant-selected index"]

  - method: GET
    path: "/licensure/applications/{id}"
    description: "Read one application including fee balance, requirement hours, processing metrics and status transparency fields."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["processing_elapsed_days refreshed from the logical clock on read (calculations.processing_time_metrics)"]

  - method: GET
    path: "/licensure/applications"
    description: "List applications with filters (reverse reachability for applicant_id, profession_id and primary_credential_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["applicant_id?", "profession_id?", "primary_credential_id?", "status?", "limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []

  - method: POST
    path: "/licensure/applications/{id}/submit"
    description: "Submit a DRAFT application: runs pathway eligibility, freezes the fee assessment and starts the processing-time clock."
    roles: [Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects:
      - "DRAFT -> SUBMITTED; submitted_at = clock_now; review_deadline_at = calculations.review_deadline"
      - "statutory_waiver_pct and gross_total_cents = calculations.net_fee_due_cents; append ASSESSMENT then WAIVER_CREDIT FeeLedgerEntry rows; fee_balance_cents recomputed"
      - "increments LicenseApplication.version by 1"

  - method: POST
    path: "/licensure/applications/{id}/payments"
    description: "Record an applicant payment against the application's outstanding balance."
    roles: [Applicant]
    code: 201
    input: [amount_cents]
    output: FeeLedgerEntry
    side_effects: ["append FeeLedgerEntry {entry_type: PAYMENT, amount_cents: -amount_cents}; LicenseApplication.fee_balance_cents recomputed; LicenseApplication.version += 1"]

  - method: GET
    path: "/licensure/applications/{id}/fee-ledger-entries"
    description: "Read the append-only fee ledger of one application in created_at ASC order (reverse reachability for FeeLedgerEntry.application_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/licensure/applications/{id}/exam-results"
    description: "Record a national or jurisprudence exam result for the application."
    roles: [AgencyAdmin]
    code: 200
    input: ["exam_kind", "passed", "score?"]
    output: LicenseApplication
    side_effects: ["exam_kind NATIONAL sets national_exam_passed = passed; exam_kind JURISPRUDENCE sets jurisprudence_exam_passed = passed; version += 1"]

  - method: POST
    path: "/licensure/applications/{id}/deficiency"
    description: "Record a deficiency. Loops the application to DEFICIENT, or denies it once MAX_DEFICIENCY_CYCLES is exceeded."
    roles: [LicensingAnalyst]
    code: 200
    input: [reason_code]
    output: LicenseApplication
    side_effects:
      - "deficiency_cycle_count += 1"
      - "branch A (count <= 2): status = DEFICIENT"
      - "branch B (count > 2): status = DENIED, decided_at = clock_now, ACTIVE permits -> REVOKED with revocation_reason_code = APPLICATION_DENIED and a PERMIT_FEE_REVERSAL, ASSIGNED assignments -> RELEASED"
      - "version += 1"

  - method: POST
    path: "/licensure/applications/{id}/cure"
    description: "Applicant cures the recorded deficiency and returns the application to review."
    roles: [Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["DEFICIENT -> UNDER_REVIEW; deficiency_cycle_count unchanged; version += 1"]

  - method: POST
    path: "/licensure/applications/{id}/decision"
    description: "Board deputy approves or denies the application. APPROVE mints a License and converts any ACTIVE permit."
    roles: [BoardDeputy]
    code: 200
    input: ["decision", "memo?"]
    output: LicenseApplication
    side_effects:
      - "APPROVE: status = APPROVED, decided_at = clock_now, decided_by_user_id = X-User-ID, mint License, cascade permit -> CONVERTED, append CONVERSION_CREDIT, ASSIGNED assignments -> COMPLETED"
      - "DENY: status = DENIED, ACTIVE permits -> REVOKED with revocation_reason_code = APPLICATION_DENIED and a PERMIT_FEE_REVERSAL, ASSIGNED assignments -> RELEASED"
      - "processing_elapsed_days and processing_standard_met computed; version += 1"

  # ---- CredentialEvaluation -----------------------------------------------
  - method: POST
    path: "/licensure/credential-evaluations"
    description: "Open the substantial-equivalency evaluation for a submitted application; moves the application to UNDER_REVIEW."
    roles: [LicensingAnalyst]
    code: 201
    input: [application_id, credential_id]
    output: CredentialEvaluation
    side_effects:
      - "variant pinned from the application's pathway; matched_scope_elements and missing_scope_elements computed"
      - "LicenseApplication SUBMITTED -> UNDER_REVIEW; LicenseApplication.version += 1"

  - method: GET
    path: "/licensure/credential-evaluations/{id}"
    description: "Read one evaluation with both parallel dimensions, the compound overall_status and the score."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: CredentialEvaluation
    side_effects: []

  - method: GET
    path: "/licensure/credential-evaluations"
    description: "List evaluations with filters (reverse reachability for application_id and credential_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["application_id?", "credential_id?", "overall_status?", "limit?", "offset?"]
    output: CredentialEvaluation[]
    side_effects: []

  - method: POST
    path: "/licensure/credential-evaluations/{id}/scope-review"
    description: "Analyst records the scope-of-practice comparison outcome (first parallel dimension)."
    roles: [LicensingAnalyst]
    code: 200
    input: ["decision", "note?"]
    output: CredentialEvaluation
    side_effects: ["scope_review_status = decision; reviewed_by_user_id = X-User-ID; LicenseApplication.scope_reviewed_by_user_id = X-User-ID (segregation-of-duties anchor); both versions += 1"]

  - method: POST
    path: "/licensure/credential-evaluations/{id}/discipline-finding"
    description: "Assigned evaluator records the national-database disciplinary finding (second parallel dimension)."
    roles: [Evaluator]
    code: 200
    input: [finding, databases_checked]
    output: CredentialEvaluation
    side_effects: ["discipline_review_status = finding; overall_status recomputed; version += 1"]

  - method: POST
    path: "/licensure/credential-evaluations/{id}/finalize"
    description: "Finalize the evaluation: computes the substantial-equivalency score under the pinned variant and the examination-waiver decision."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: CredentialEvaluation
    side_effects:
      - "equivalency_score = calculations.substantial_equivalency_score; exam_waiver_granted decided against Profession.exam_waiver_min_score (>=) or an unexpired compact"
      - "finalized_at = clock_now; overall_status = COMPLETE"
      - "when exam_waiver_granted: append EXAM_FEE_REVERSAL FeeLedgerEntry and recompute LicenseApplication.fee_balance_cents; LicenseApplication.version += 1"
      - "version += 1"

  # ---- Military credit ----------------------------------------------------
  - method: POST
    path: "/licensure/credit-awards"
    description: "Award military training/experience credit from one verified training record toward the application's requirement hours."
    roles: [LicensingAnalyst]
    code: 201
    input: [application_id, training_record_id]
    output: CreditAward
    side_effects: ["awarded_hours = per-record conversion (rounded to 1 decimal); LicenseApplication.requirement_hours_satisfied / requirement_hours_remaining recomputed; LicenseApplication.version += 1"]

  - method: GET
    path: "/licensure/credit-awards/{id}"
    description: "Read one credit award."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: CreditAward
    side_effects: []

  - method: GET
    path: "/licensure/credit-awards"
    description: "List credit awards with filters (reverse reachability for application_id and training_record_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["application_id?", "training_record_id?", "status?", "limit?", "offset?"]
    output: CreditAward[]
    side_effects: []

  - method: POST
    path: "/licensure/credit-awards/{id}/revoke"
    description: "Compensating action: revoke a credit award and return the hours to the application's remaining requirement."
    roles: [LicensingAnalyst]
    code: 200
    input: []
    output: CreditAward
    side_effects: ["status = REVOKED; revoked_at = clock_now; requirement_hours_satisfied / requirement_hours_remaining recomputed over the remaining AWARDED rows; LicenseApplication.version += 1"]

  # ---- Temporary permits --------------------------------------------------
  - method: POST
    path: "/licensure/temporary-permits"
    description: "Issue a temporary practice permit for an application still under review. OCC-guarded on the application's version."
    roles: [LicensingAnalyst]
    code: 201
    input: [application_id, effective_at, expected_application_version]
    output: TemporaryPermit
    side_effects:
      - "expires_at, permit_max_days and permit_fee_cents = calculations.permit_window"
      - "append FeeLedgerEntry {entry_type: PERMIT_FEE, amount_cents: +permit_fee_cents}; LicenseApplication.fee_balance_cents recomputed"
      - "increments LicenseApplication.version by 1"

  - method: GET
    path: "/licensure/applications/{id}/temporary-permits"
    description: "List the permits issued against one application (reverse reachability for TemporaryPermit.application_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TemporaryPermit[]
    side_effects: []

  - method: POST
    path: "/licensure/temporary-permits/{id}/revoke"
    description: "Compensating action: revoke an ACTIVE permit and reverse its fee in full."
    roles: [BoardDeputy]
    code: 200
    input: [reason_code]
    output: TemporaryPermit
    side_effects: ["status = REVOKED; revoked_at = clock_now; expires_at = revoked_at; revocation_reason_code = reason_code; append PERMIT_FEE_REVERSAL; LicenseApplication.fee_balance_cents recomputed; LicenseApplication.version += 1"]

  - method: POST
    path: "/licensure/permit-expiry-runs"
    description: "Ops sweep: expire every ACTIVE permit whose expires_at <= the logical clock, in created_at ASC order."
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: "{ expired_count: integer, expired_permit_ids: string[] }"
    side_effects: ["each swept TemporaryPermit ACTIVE -> EXPIRED with version += 1; no ledger movement"]

  # ---- Evaluators & review assignments -----------------------------------
  - method: POST
    path: "/licensure/evaluators"
    description: "Register a contract evaluator for national-database disciplinary review."
    roles: [AgencyAdmin]
    code: 201
    input: ["full_name", "profession_code", "status?", "max_concurrent_reviews?"]
    output: Evaluator
    side_effects: ["open_assignment_count = 0"]

  - method: GET
    path: "/licensure/evaluators/{id}"
    description: "Read one evaluator including open_assignment_count and the current version for OCC."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: Evaluator
    side_effects: []

  - method: POST
    path: "/licensure/review-assignments"
    description: "Book an evaluator's review window for an application. OCC-guarded on the evaluator's version."
    roles: [LicensingAnalyst]
    code: 201
    input: [evaluator_id, application_id, window_start_at, window_end_at, expected_evaluator_version]
    output: ReviewAssignment
    side_effects:
      - "status = ASSIGNED; Evaluator.open_assignment_count = calculations.evaluator_open_assignment_count"
      - "increments Evaluator.version by 1"

  - method: GET
    path: "/licensure/review-assignments/{id}"
    description: "Read one review assignment."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []

  - method: GET
    path: "/licensure/review-assignments"
    description: "List review assignments with filters (reverse reachability for evaluator_id and application_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["evaluator_id?", "application_id?", "status?", "limit?", "offset?"]
    output: ReviewAssignment[]
    side_effects: []

  # ---- Licenses -----------------------------------------------------------
  - method: GET
    path: "/licensure/licenses/{id}"
    description: "Read one minted license."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licensure/licenses"
    description: "List minted licenses with filters (reverse reachability for application_id, profession_id and converted_from_permit_id)."
    roles: [AgencyAdmin, LicensingAnalyst, BoardDeputy, Evaluator, Applicant]
    code: 200
    input: ["application_id?", "profession_id?", "converted_from_permit_id?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  # ---- Logical clock (test-driving endpoint) ------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every deadline, decay, expiry and window rule reads this clock."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; subsequent reads and writes observe the new instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's §1.5 roles"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "an entity-backed caller (Applicant, Evaluator) targets a row that belongs to a different entity instance"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, non-member enum value, malformed ISO 8601 datetime, out-of-range number, array bound violation, window_end_at <= window_start_at, amount_cents <= 0, duplicate profession_code, duplicate (profession_id, partner_state), or limit/offset outside bounds"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_application_version != LicenseApplication.version, or expected_evaluator_version != Evaluator.version"
  - id: ERR_PROFESSION_NOT_FOUND
    http: 404
    condition: "no Profession with the given id"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "no Applicant with the given id"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "no OutOfStateCredential with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no LicenseApplication with the given id"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "no CredentialEvaluation with the given id"
  - id: ERR_TRAINING_RECORD_NOT_FOUND
    http: 404
    condition: "no MilitaryTrainingRecord with the given id"
  - id: ERR_CREDIT_AWARD_NOT_FOUND
    http: 404
    condition: "no CreditAward with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "no TemporaryPermit with the given id"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "no License with the given id"
  - id: ERR_EVALUATOR_NOT_FOUND
    http: 404
    condition: "no Evaluator with the given id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no ReviewAssignment with the given id"
  - id: ERR_DISCIPLINARY_RECORD_NOT_FOUND
    http: 404
    condition: "no DisciplinaryRecord with the given id"
  - id: ERR_APPLICATION_NOT_REVIEWABLE
    http: 409
    condition: "the LicenseApplication is not in a from-state this operation permits (validation priority 8)"
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 409
    condition: "revoke targeted a TemporaryPermit whose status is not ACTIVE"
  - id: ERR_EVALUATION_ALREADY_FINALIZED
    http: 409
    condition: "the evaluation already has finalized_at set, or the targeted parallel dimension is no longer PENDING, or finalize was called while a dimension is still PENDING"
  - id: ERR_EVALUATION_ALREADY_EXISTS
    http: 409
    condition: "a CredentialEvaluation already exists for this application_id"
  - id: ERR_CREDIT_AWARD_ALREADY_REVOKED
    http: 409
    condition: "revoke targeted a CreditAward already in REVOKED"
  - id: ERR_DISCIPLINARY_RECORD_ALREADY_RESOLVED
    http: 409
    condition: "resolve targeted a DisciplinaryRecord already resolved"
  - id: ERR_DISCIPLINARY_BAR
    http: 422
    condition: "Applicant.good_standing_flag == false, or pathway_risk_index >= PATHWAY_BAR_INDEX (12.00) under the pathway-selected variant"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding BoardDeputy's X-User-ID equals LicenseApplication.scope_reviewed_by_user_id"
  - id: ERR_CREDENTIAL_APPLICANT_MISMATCH
    http: 422
    condition: "the referenced OutOfStateCredential belongs to a different applicant than the application"
  - id: ERR_EVALUATOR_PROFESSION_MISMATCH
    http: 422
    condition: "Evaluator.profession_code differs from the application profession's profession_code"
  - id: ERR_EVALUATOR_INACTIVE
    http: 422
    condition: "the target Evaluator has status INACTIVE"
  - id: ERR_NO_OPEN_REVIEW_ASSIGNMENT
    http: 422
    condition: "the calling Evaluator holds no ASSIGNED ReviewAssignment for the evaluation's application"
  - id: ERR_REVIEW_WINDOW_LAPSED
    http: 422
    condition: "the logical clock is past the assignment's window_end_at"
  - id: ERR_EVALUATION_REQUIRED_FOR_PERMIT
    http: 422
    condition: "permit requested on an ENDORSEMENT or UNIVERSAL_RECOGNITION application that has no CredentialEvaluation yet"
  - id: ERR_EVALUATION_NOT_COMPLETE
    http: 422
    condition: "approval attempted while the application's evaluation is missing or still IN_PROGRESS"
  - id: ERR_MILITARY_STATUS_REQUIRED
    http: 422
    condition: "MILITARY_SPOUSE_EXPEDITED submitted by an applicant whose military_status is not MILITARY_SPOUSE"
  - id: ERR_RESIDENCY_REQUIREMENT_NOT_MET
    http: 422
    condition: "UNIVERSAL_RECOGNITION submitted with residency_months below the profession's minimum"
  - id: ERR_NO_QUALIFYING_CREDENTIAL
    http: 422
    condition: "the applicant's qualifying credential set (ACTIVE and verified_good_standing) is empty, or primary_credential_id is not a member of it"
  - id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http: 409
    condition: "another application for the same (applicant_id, profession_id) is in SUBMITTED, UNDER_REVIEW, DEFICIENT, SUSPENDED_REVIEW or APPROVED"
  - id: ERR_TRAINING_RECORD_APPLICANT_MISMATCH
    http: 422
    condition: "the training record belongs to a different applicant than the application"
  - id: ERR_TRAINING_RECORD_UNVERIFIED
    http: 422
    condition: "credit requested from a MilitaryTrainingRecord with verified == false"
  - id: ERR_TRAINING_RECORD_ALREADY_CREDITED
    http: 409
    condition: "an AWARDED CreditAward already exists for this (application_id, training_record_id)"
  - id: ERR_PERMIT_EFFECTIVE_IN_PAST
    http: 422
    condition: "requested effective_at is strictly before the logical clock"
  - id: ERR_PERMIT_WINDOW_OVERLAP
    http: 409
    condition: "the requested half-open permit window intersects an existing ACTIVE or CONVERTED permit window for the same (applicant, profession)"
  - id: ERR_EVALUATOR_SLOT_CONFLICT
    http: 409
    condition: "the requested closed review window, inflated by REVIEW_BUFFER_HOURS (24) on both sides, intersects an ASSIGNED window of the same evaluator"
  - id: ERR_EVALUATOR_CAPACITY_EXCEEDED
    http: 409
    condition: "the evaluator already holds max_concurrent_reviews ASSIGNED assignments"
  - id: ERR_REQUIREMENT_HOURS_UNSATISFIED
    http: 422
    condition: "approval attempted while requirement_hours_remaining > 0.0"
  - id: ERR_NATIONAL_EXAM_REQUIRED
    http: 422
    condition: "approval attempted with neither exam_waiver_granted nor national_exam_passed"
  - id: ERR_JURISPRUDENCE_EXAM_REQUIRED
    http: 422
    condition: "approval attempted while the profession requires the jurisprudence exam, the applicant has not passed it and no unexpired compact waives it"
  - id: ERR_FEE_BALANCE_OUTSTANDING
    http: 402
    condition: "permit issuance or approval attempted while fee_balance_cents > 0"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "payment amount_cents exceeds the application's outstanding fee_balance_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Credential holder seeking licensure by portability; acts only on their own rows."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /licensure/applications"
      - "POST /licensure/applications/{id}/submit"
      - "POST /licensure/applications/{id}/cure"
      - "POST /licensure/applications/{id}/payments"
    shared_operations:
      - "POST /licensure/applicants/{id}/out-of-state-credentials (shared with AgencyAdmin)"
      - "POST /licensure/applicants/{id}/military-training-records (shared with AgencyAdmin)"
      - "every GET, restricted to rows belonging to this applicant"

  - name: LicensingAnalyst
    description: "Agency analyst who evaluates equivalency, records deficiencies, awards military credit, issues temporary permits and books evaluators."
    identity: "opaque"
    exclusive_operations:
      - "POST /licensure/credential-evaluations"
      - "POST /licensure/credential-evaluations/{id}/scope-review"
      - "POST /licensure/credential-evaluations/{id}/finalize"
      - "POST /licensure/applications/{id}/deficiency"
      - "POST /licensure/credit-awards"
      - "POST /licensure/credit-awards/{id}/revoke"
      - "POST /licensure/temporary-permits"
      - "POST /licensure/review-assignments"
    shared_operations:
      - "every GET"

  - name: Evaluator
    description: "Contract reviewer who searches national disciplinary databases and records the finding on evaluations they are assigned to."
    identity: "entity_backed:Evaluator"
    exclusive_operations:
      - "POST /licensure/credential-evaluations/{id}/discipline-finding"
    shared_operations:
      - "every GET"

  - name: BoardDeputy
    description: "Licensing board deputy who issues the final decision and may revoke a temporary permit. Cannot have recorded the same application's scope review."
    identity: "opaque"
    exclusive_operations:
      - "POST /licensure/applications/{id}/decision"
      - "POST /licensure/temporary-permits/{id}/revoke"
    shared_operations:
      - "every GET"

  - name: AgencyAdmin
    description: "Agency operations staff: configures professions and compacts, performs intake, posts national-database findings, records exam results, registers evaluators, runs the expiry sweep and sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /licensure/professions"
      - "POST /licensure/professions/{id}/reciprocal-agreements"
      - "POST /licensure/applicants"
      - "POST /licensure/disciplinary-records"
      - "POST /licensure/disciplinary-records/{id}/resolve"
      - "POST /licensure/applications/{id}/exam-results"
      - "POST /licensure/evaluators"
      - "POST /licensure/permit-expiry-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /licensure/applicants/{id}/out-of-state-credentials (shared with Applicant)"
      - "POST /licensure/applicants/{id}/military-training-records (shared with Applicant)"
      - "every GET"
