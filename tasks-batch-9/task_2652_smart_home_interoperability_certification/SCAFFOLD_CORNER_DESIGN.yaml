      - name: competency_review_needs_an_authorized_lab_and_a_completed_session
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
          - validations[priority=47]
          - endpoints[POST /test-laboratories/{laboratory_id}/competency-review]
        distinguishing_aspect: >
          A PROVISIONAL laboratory is refused with ERR_INVALID_LABORATORY_STATE (priority 15) before the
          empty-history rule is consulted; an AUTHORIZED laboratory with no COMPLETE session is refused
          with ERR_NO_COMPLETED_SESSIONS (priority 47). Neither refusal writes competency_score,
          competency_variant or competency_reviewed_at.
        test_recipe:
          setup:
            - "Laboratory L1 registered and AUTHORIZED; laboratory L2 left PROVISIONAL. No test sessions exist at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Northbridge Lab", bench_capacity: 2, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab1_id: $.data.id }
            - call: "POST /test-laboratories/${lab1_id}/accreditation-decision"
              payload: { decision: "AUTHORIZE" }
              as: ProgramAdmin
            - call: "POST /test-laboratories"
              payload: { name: "Southgate Lab", bench_capacity: 1, authorized_device_types: ["LIGHTING"], accreditation_expires_at: "2027-12-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { lab2_id: $.data.id }
          trigger:
            - call: "POST /test-laboratories/${lab2_id}/competency-review"
              payload: { variant: "ROLLING_90D" }
              as: ProgramAdmin
              captures: { err_lab_state: $.data.error_id }
            - call: "POST /test-laboratories/${lab1_id}/competency-review"
              payload: { variant: "ROLLING_90D" }
              as: ProgramAdmin
              captures: { err_no_sessions: $.data.error_id }
            - call: "POST /test-laboratories/${lab1_id}/competency-review"
              payload: { variant: "LIFETIME" }
              as: ProgramAdmin
              captures: { err_no_sessions_lifetime: $.data.error_id }
            - call: "POST /test-laboratories/${lab1_id}/competency-review"
              payload: { variant: "ROLLING_30D" }
              as: ProgramAdmin
              captures: { err_variant_enum: $.data.error_id }
            - call: "GET /test-laboratories/${lab1_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "The PROVISIONAL laboratory returns 409 ERR_INVALID_LABORATORY_STATE - priority 15 outranks priority 47, even though it also has no completed sessions"
            - "The AUTHORIZED laboratory returns 409 ERR_NO_COMPLETED_SESSIONS under both ROLLING_90D and LIFETIME"
            - "variant \"ROLLING_30D\" returns 422 ERR_INVALID_ENUM_VALUE - priority 7 outranks both state rules"
            - "TestLaboratory.${lab1_id}.competency_score, competency_variant and competency_reviewed_at are all null and accreditation_status is still \"AUTHORIZED\" - no refused review wrote anything"

