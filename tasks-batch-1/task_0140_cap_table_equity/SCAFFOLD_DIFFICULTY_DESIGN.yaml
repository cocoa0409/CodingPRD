          - state_machines.OptionGrant.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Numeric threshold boundary on vested_shares: at 11 whole months
          elapsed (just under a 12-month cliff) vested == 0; at exactly 12
          months vested jumps to floor(48000*12/48) == 12000. Boundary metric =
          months-elapsed vs cliff_months, observed via GET /option-grants/{id}.
