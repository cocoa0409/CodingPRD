  # 8. Cross-cutting complexity layers — dual_variant_calculation,
  #    cascading_side_effects, rate_threshold_triggers, optimistic_concurrency
  - section: complexity_layers
    instances:
      - name: stale_expected_commitment_version_on_a_second_delivery_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[loan-delivery-stale-commitment]
          - validations[priority 18]
        distinguishing_aspect: |
          The OCC guard on the delivery endpoint is exercised with strictly
          sequential requests: the first delivery advances Commitment.version,
          so a second delivery still carrying the pre-delivery version is
          refused with 412 even though the line has ample capacity for it. The
          refusal leaves allocated_amount_cents, available_amount_cents and
          version untouched, and re-reading the commitment then makes the very
          same delivery succeed — proving the check is on the version token, not
          on capacity or state.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CHAIN-APPROVED seller ${s1} and MANDATORY commitment ${c1} of 100000000 cents, version captured as ${cv1} at creation"
