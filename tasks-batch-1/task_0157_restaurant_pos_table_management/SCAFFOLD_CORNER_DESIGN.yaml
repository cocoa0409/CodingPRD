  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: buss_with_correct_table_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[table-buss-stale-promote]", state_machines.DiningTable.DIRTY_to_AVAILABLE]
        distinguishing_aspect: "Bussing a DIRTY table with expected_table_version equal to the live version succeeds and increments DiningTable.version by 1 (the OCC happy path)."
        test_recipe:
          setup: ["A DIRTY table (seated then cleared), no waitlist; current version read."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-03T12:00:00Z" }
              as: Manager
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /seatings/${seat}/clear"
              payload: {}
              as: Host
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /tables/${tbl}/buss"
              payload: { expected_table_version: "${tv}" }
              as: Host
              captures: { occ: $.data.occupancy_status, newv: $.data.version }
          assert:
            - "response status == 200"
            - "DiningTable.${tbl}.occupancy_status == AVAILABLE  (no waitlist to promote)"
            - "DiningTable.${tbl}.version == ${tv} + 1"

      - name: buss_with_stale_table_version_returns_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[table-buss-stale-promote]", "errors[ERR_STALE_TABLE_VERSION]"]
        distinguishing_aspect: "After one successful buss bumps DiningTable.version, a second buss still carrying the pre-buss version (expressed as ${tv}, captured before the first buss) returns ERR_STALE_TABLE_VERSION 412."
        test_recipe:
          setup: ["A DIRTY table; version ${tv} read; one buss already applied (re-dirtied so a second buss is state-legal)."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-03T12:00:00Z" }
              as: Manager
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat1: $.data.id }
            - call: "POST /seatings/${seat1}/clear"
              payload: {}
              as: Host
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
              captures: { tv: $.data.version }
            - call: "POST /tables/${tbl}/buss"
              payload: { expected_table_version: "${tv}" }
              as: Host
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat2: $.data.id }
            - call: "POST /seatings/${seat2}/clear"
              payload: {}
              as: Host
          trigger:
            - call: "POST /tables/${tbl}/buss"
              payload: { expected_table_version: "${tv}" }
              as: Host
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_TABLE_VERSION  (${tv} is now stale after the first buss)"

      - name: error_cascade_clear_free_promote_three_levels
        claim_type: cascading_side_effects
        grounds: [state_machines.DiningTable.DIRTY_to_AVAILABLE, state_machines.WaitlistEntry.WAITING_to_PROMOTED]
        excluded_because:
          difficulty_instance: transitive_cascade / buss_depth3_free_table_promotes_waitlist_creates_seating
          rationale: "The depth-3 clear→free→promote cascade is fully asserted by the named §1.8 instance."

      - name: error_void_restores_86_count_threshold
        claim_type: rate_threshold_triggers
        grounds: [entities.MenuItem.fields.available_count]
        excluded_because:
          difficulty_instance: compensating_invariant / void_item_conserves_menu_item_available_count
          rationale: "The 86-count restore and conservation are fully asserted by the named §1.8 instance."

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: close_check_contributes_tip_to_pool_in_same_request
        claim_type: immediate
        grounds: [state_machines.Check.PRESENTED_to_CLOSED, entities.TipPool.fields.pooled_cents]
        distinguishing_aspect: "Closing a check immediately reflects its tip in the day's TipPool.pooled_cents within the same atomic request (immediate consistency), readable on the next GET."
        test_recipe:
          setup: ["A presented check fully paid with tip 300; a tip pool already exists for the close-day 2026-06-02."]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R", tax_rate_bps: 0 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { restaurant_id: "${rid}", to_iso8601: "2026-06-02T10:00:00Z" }
              as: Manager
            - call: "POST /tip-pools"
              payload: { restaurant_id: "${rid}", business_date: "2026-06-02", distribution_mode: "EVEN_BY_HOURS" }
              as: Manager
              captures: { pool: $.data.id }
            - call: "POST /menu-items"
              payload: { restaurant_id: "${rid}", name: "Item", station: "GRILL", base_price_cents: 1000, happy_hour_price_cents: 1000, initial_available_count: 5 }
              as: Manager
              captures: { mi: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${rid}", table_number: "T1", capacity: 4 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /staff-members"
              payload: { restaurant_id: "${rid}", name: "Sam", role: "SERVER", tip_weight_bps: 10000 }
              as: Manager
              captures: { sm: $.data.id }
            - call: "POST /seatings"
              payload: { restaurant_id: "${rid}", table_id: "${tbl}", party_size: 2 }
              as: Host
              captures: { seat: $.data.id }
            - call: "POST /checks"
              payload: { restaurant_id: "${rid}", seating_id: "${seat}", server_staff_id: "${sm}", party_size: 2 }
              as: Server
              as_user_id: "${sm}"
              captures: { chk: $.data.id }
            - call: "POST /courses"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", course_number: 1 }
              as: Server
              as_user_id: "${sm}"
              captures: { crs: $.data.id }
            - call: "POST /order-items"
              payload: { restaurant_id: "${rid}", course_id: "${crs}", menu_item_id: "${mi}", quantity: 1 }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /courses/${crs}/fire"
              payload: {}
              as: Server
              as_user_id: "${sm}"
            - call: "POST /checks/${chk}/present"
              payload: {}
              as: Server
              as_user_id: "${sm}"
            - call: "POST /payments"
              payload: { restaurant_id: "${rid}", check_id: "${chk}", amount_cents: 1000, tip_cents: 300, method: "CARD" }
              as: Server
              as_user_id: "${sm}"
            - call: "POST /checks/${chk}/close"
              payload: {}
              as: Server
              as_user_id: "${sm}"
          trigger:
            - call: "GET /tip-pools/${pool}"
              payload: {}
              as: Manager
              captures: { pooled: $.data.pooled_cents }
          assert:
            - "TipPool.${pool}.pooled_cents == 300  (tip contributed atomically at close)"
