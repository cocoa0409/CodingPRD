scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: order_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.AssemblyOrder.fields.cut_length_mm, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/assembly-orders without required cut_length_mm is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Customer and reel exist"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "ReqCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: reel_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Reel.fields.remaining_length_mm, entities.Reel.fields.scrap_length_mm]
        distinguishing_aspect: "Client-supplied remaining_length_mm / scrap_length_mm on reel creation are ignored; server initializes remaining = initial and scrap = 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8S", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000, remaining_length_mm: 999, scrap_length_mm: 50 }
              as: ShopManager
              captures: { reel_id: $.data.id }
          assert:
            - "Reel.${reel_id}.remaining_length_mm == 50000 (client input 999 ignored)"
            - "Reel.${reel_id}.scrap_length_mm == 0 (client input 50 ignored)"
            - "Reel.${reel_id}.status == AVAILABLE"
            - "Reel.${reel_id}.version == 1"

      - name: coupling_computed_available_after_receipt
        claim_type: computed_fields
        grounds: [entities.Coupling.fields.available_qty, entities.Coupling.fields.on_hand_qty]
        distinguishing_aspect: "available_qty is derived as on_hand_qty - reserved_qty; after a receipt of 6 onto initial 4 with no reservations, available_qty == 10."
        test_recipe:
          setup: ["Coupling created with initial_on_hand_qty 4"]
          setup_api_calls:
            - call: "POST /api/couplings"
              payload: { coupling_sku: "1CA43-8-8A", size_in: 0.5, unit_price_cents: 1200, initial_on_hand_qty: 4 }
              as: ShopManager
              captures: { coup_id: $.data.id }
          trigger:
            - call: "POST /api/couplings/${coup_id}/receipts"
              payload: { quantity: 6 }
              as: ShopManager
          assert:
            - "Coupling.${coup_id}.on_hand_qty == 10"
            - "Coupling.${coup_id}.reserved_qty == 0"
            - "Coupling.${coup_id}.available_qty == 10"

      - name: customer_program_defaults_when_not_enrolled
        claim_type: defaults
        grounds: [entities.Customer.fields.program_status, entities.Customer.fields.compliance_score_strict]
        distinguishing_aspect: "A customer created without program flags gets program_status NONE, both scores 100.00, credit_hold false, inspection_interval_days 365."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { name: "PlainCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.program_status == NONE"
            - "Customer.${cust_id}.compliance_score_strict == 100.00"
            - "Customer.${cust_id}.compliance_score_projected == 100.00"
            - "Customer.${cust_id}.credit_hold == false"
            - "Customer.${cust_id}.inspection_interval_days == 365"

      - name: asset_get_unknown_id_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ASSET_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/equipment-assets/{unknown uuid} returns ERR_ASSET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/equipment-assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSET_NOT_FOUND"
            - "HTTP status == 404"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: record_pressure_test_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssemblyOrder.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "record-pressure-test is only valid from BUILT; from DRAFT it fails with ERR_INVALID_STATE and stores nothing."
        test_recipe:
          setup: ["Customer, reel, and a DRAFT order (cut 1000, req_wp 2000)"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "StateCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8T", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "AssemblyOrder.${order_id}.status remains DRAFT and test_result remains null"

      - name: cancel_completed_order_returns_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.AssemblyOrder, "errors[ERR_ORDER_TERMINAL]"]
        excluded_because:
          difficulty_instance: terminal_state_beats_credit_hold
          rationale: "That §1.8 instance confirms a COMPLETED order and asserts ERR_ORDER_TERMINAL — the terminal-lockdown rejection path is exercised there."

      - name: rework_from_built_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssemblyOrder.TEST_FAILED_to_REWORK, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "rework is only valid from TEST_FAILED; from BUILT it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order confirmed and built (status BUILT)"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "ReworkCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8RW", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/rework"
              payload: {}
              as: ShopTechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "AssemblyOrder.${order_id}.status remains BUILT"

      - name: tag_from_built_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssemblyOrder.TEST_PASSED_to_TAGGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "tag requires TEST_PASSED; tagging a merely BUILT order fails with ERR_INVALID_STATE and stores no tag_serial."
        test_recipe:
          setup: ["Order confirmed and built (status BUILT)"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "TagCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8TG", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/tag"
              payload: { tag_serial: "TAG-EARLY" }
              as: ShopTechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "AssemblyOrder.${order_id}.tag_serial remains null"

      - name: new_inspection_supersedes_scheduled
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.SCHEDULED_to_SUPERSEDED, "concurrency_rules[inspection-create-stale-asset]"]
        distinguishing_aspect: "Creating a second inspection for the same asset (with the current asset version) atomically moves the prior SCHEDULED inspection to SUPERSEDED."
        test_recipe:
          setup: ["Customer; ACTIVE asset; inspection I1 SCHEDULED (window 2026-08-10..2026-08-11)"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "SupersedeCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/equipment-assets"
              payload: { customer_id: "${cust_id}", asset_tag: "SS-01", machine_type: "skid steer", installed_at: "2026-07-01T00:00:00Z" }
              as: ShopManager
              captures: { asset_id: $.data.id, asset_v: $.data.version }
            - call: "POST /api/equipment-assets/${asset_id}/inspections"
              payload: { expected_equipment_asset_version: "${asset_v}", scheduled_window_start: "2026-08-10T00:00:00Z", scheduled_window_end: "2026-08-11T00:00:00Z" }
              as: CounterSales
              captures: { i1_id: $.data.id }
            - call: "GET /api/equipment-assets/${asset_id}"
              as: ShopManager
              captures: { asset_v2: $.data.version }
          trigger:
            - call: "POST /api/equipment-assets/${asset_id}/inspections"
              payload: { expected_equipment_asset_version: "${asset_v2}", scheduled_window_start: "2026-08-20T00:00:00Z", scheduled_window_end: "2026-08-21T00:00:00Z" }
              as: CounterSales
              captures: { i2_id: $.data.id }
            - call: "GET /api/equipment-assets/${asset_id}/inspections"
              as: ShopManager
          assert:
            - "Inspection.${i1_id}.status == SUPERSEDED"
            - "Inspection.${i2_id}.status == SCHEDULED"
            - "EquipmentAsset.${asset_id}.version advanced by 1 per inspection create (1 -> 2 -> 3)"

      - name: reel_auto_status_depleted_on_confirm
        claim_type: side_effect_execution
        grounds: [state_machines.Reel.LOW_to_DEPLETED, calculations.cut_waste_allocation]
        excluded_because:
          difficulty_instance: cut_length_exactly_equals_remaining
          rationale: "That §1.8 instance confirms an order consuming a reel to exactly 0 and asserts Reel.status == DEPLETED — the auto-transition is covered there."

      - name: dispatch_complete_from_requested_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceDispatch.ON_SITE_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete requires ON_SITE; completing a freshly REQUESTED dispatch fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Customer; dispatch on VAN-2 in REQUESTED"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "DispCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/service-dispatches"
              payload: { customer_id: "${cust_id}", van_id: "VAN-2", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z" }
              as: CounterSales
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /api/service-dispatches/${disp_id}/complete"
              payload: {}
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "ServiceDispatch.${disp_id}.status remains REQUESTED"

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: remnant_exactly_min_is_kept
        claim_type: boundary_edge
        grounds: [calculations.cut_waste_allocation, entities.Reel.fields.scrap_length_mm]
        distinguishing_aspect: "remaining_after == MIN_REMNANT_MM (1000) exactly is KEPT (strict < rule): no scrap, no waste surcharge, reel drops to LOW not DEPLETED."
        test_recipe:
          setup: ["Customer; reel 6000mm (LOW); order cut 5000mm"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "RemnantCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8M", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 6000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 5000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "GET /api/reels/${reel_id}"
              as: ShopManager
            - call: "GET /api/assembly-orders/${order_id}"
              as: CounterSales
          assert:
            - "Reel.${reel_id}.remaining_length_mm == 1000"
            - "Reel.${reel_id}.scrap_length_mm == 0"
            - "Reel.${reel_id}.status == LOW (1000 >= MIN_REMNANT_MM, < LOW_THRESHOLD_MM)"
            - "AssemblyOrder.${order_id}.waste_surcharge_cents == 0"
            - "AssemblyOrder.${order_id}.scrap_charged_mm == 0"

      - name: test_pressure_exactly_double_passes
        claim_type: boundary_edge
        grounds: ["validations[priority=10]", calculations.assembly_price]
        distinguishing_aspect: "test_pressure_psi == 2.0x required_working_pressure_psi satisfies the >= rule; the test is accepted and the order moves to TEST_PASSED."
        test_recipe:
          setup: ["Order BUILT with required_working_pressure_psi 2000"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "PressCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8PR", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
            - call: "POST /api/assembly-orders/${order_id}/complete-build"
              payload: { measured_crimp_diameter_mm: 25.0, actual_labor_minutes: 10 }
              as: ShopTechnician
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/record-pressure-test"
              payload: { test_pressure_psi: 4000, result: "PASSED" }
              as: ShopTechnician
          assert:
            - "HTTP 200; AssemblyOrder.${order_id}.status == TEST_PASSED (4000 == 2.0 * 2000 meets the >= boundary)"
            - "AssemblyOrder.${order_id}.test_pressure_psi == 4000"

      - name: next_due_recompute_on_install
        claim_type: correct_result
        grounds: [calculations.next_due_date]
        excluded_because:
          difficulty_instance: order_completion_cascade_depth3
          rationale: "That §1.8 instance asserts next_due_date == 2026-09-30T00:00:00Z from a 2026-08-01 install with a 60-day interval — the calculation is verified there."

      - name: labor_tier_mid_rate_applied
        claim_type: constants_applied
        grounds: [calculations.assembly_price]
        distinguishing_aspect: "Reel diameter 0.75in (> DIA_STD_MAX_IN 0.5, <= DIA_MID_MAX_IN 1.0) selects the MID tier of 200c/min: quoted = 2000 hose + 10min*200 = 4000 cents."
        test_recipe:
          setup: ["Customer; reel dia 0.75in at 1000c/m, wp 3000, 50000mm"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "TierCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-12", hose_diameter_in: 0.75, working_pressure_psi: 3000, price_per_meter_cents: 1000, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 2000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 27.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
          assert:
            - "AssemblyOrder.${order_id}.quoted_total_cents == 4000 (hose 2m*1000=2000 + labor 10*200=2000; MID tier, not STD 150)"

  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["A customer exists"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "AuthCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /api/customers/${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: credit_hold_blocks_confirm
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_CREDIT_HOLD]"]
        distinguishing_aspect: "Confirming an order for a credit-hold customer fails with ERR_CREDIT_HOLD (402) even though all safety/referential checks pass."
        test_recipe:
          setup: ["Customer created with credit_hold true; DRAFT order cut 1000 req_wp 2000 on a healthy reel"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "HoldCo", credit_hold: true }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8H", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
              as: CounterSales
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CREDIT_HOLD"
            - "HTTP status == 402"
            - "AssemblyOrder.${order_id} remains DRAFT; reel length untouched"

      - name: waiver_required_then_satisfied
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_WAIVER_REQUIRED]", entities.AssemblyOrder.fields.waiver_signed]
        distinguishing_aspect: "An application_error_suspected order cannot confirm without waiver fields (ERR_WAIVER_REQUIRED); supplying waiver_signed_by + waiver_liability_cents confirms and sets waiver_signed."
        test_recipe:
          setup: ["Customer; reel; DRAFT order with application_error_suspected true"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "WaiveCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8W", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
                application_error_suspected: true
              as: CounterSales
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
              captures: { err: $.data.error_id }
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: { waiver_signed_by: "Pat Customer", waiver_liability_cents: 50000 }
              as: CounterSales
          assert:
            - "First confirm: error_id == ERR_WAIVER_REQUIRED (422)"
            - "Second confirm succeeds: AssemblyOrder.${order_id}.status == CONFIRMED"
            - "AssemblyOrder.${order_id}.waiver_signed == true and waiver_liability_cents == 50000"

      - name: insufficient_coupling_stock_at_confirm
        claim_type: aggregate_validation
        grounds: ["validations[priority=19]", "errors[ERR_INSUFFICIENT_COUPLING_STOCK]", entities.Coupling.fields.available_qty]
        distinguishing_aspect: "Line quantity 5 exceeds coupling available_qty 2 at confirm; rejected with ERR_INSUFFICIENT_COUPLING_STOCK (422) even though the reel check passes."
        test_recipe:
          setup: ["Customer; reel 50000mm; coupling stock 2; DRAFT order with line qty 5"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "StockCo" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /api/reels"
              payload: { hose_sku: "PARK-387-8ST", hose_diameter_in: 0.5, working_pressure_psi: 3000, price_per_meter_cents: 800, initial_length_mm: 50000 }
              as: ShopManager
              captures: { reel_id: $.data.id }
            - call: "POST /api/couplings"
              payload: { coupling_sku: "1CA43-8-8S", size_in: 0.5, unit_price_cents: 1200, initial_on_hand_qty: 2 }
              as: ShopManager
              captures: { coup_id: $.data.id }
            - call: "POST /api/assembly-orders"
              payload:
                customer_id: "${cust_id}"
                reel_id: "${reel_id}"
                cut_length_mm: 1000
                required_working_pressure_psi: 2000
                crimp_diameter_spec_mm: 25.0
                estimated_labor_minutes: 10
                lines: [ { coupling_id: "${coup_id}", quantity: 5 } ]
              as: CounterSales
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/assembly-orders/${order_id}/confirm"
              payload: {}
              as: CounterSales
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_COUPLING_STOCK"
            - "HTTP status == 422"
            - "Coupling.${coup_id}.reserved_qty == 0 (no partial reservation)"

