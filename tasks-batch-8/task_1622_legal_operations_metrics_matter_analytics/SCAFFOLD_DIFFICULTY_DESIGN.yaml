            - "posture == CRITICAL — >= 0.95 is INCLUSIVE (not WARNING, not EXCEEDED)"

      - name: capacity_over_capacity_strict_greater_than
        grounds:
          - calculations.workload_utilization_per_counsel
          - validations[priority=17]
        distinguishing_aspect: |
          Zero-quantity / equality boundary on a DIFFERENT metric (counsel
          capacity hours, not budget cents) reached through a DIFFERENT
          endpoint (POST /legal-ops/matters/{id}/assignments). Total_allocated
