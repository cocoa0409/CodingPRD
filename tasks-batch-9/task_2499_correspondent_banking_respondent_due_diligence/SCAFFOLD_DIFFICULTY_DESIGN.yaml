            - { call: "POST /correspondent-banking/respondents/${f_id}/payment-instructions", payload: { ordering_jurisdiction_code: "DE", beneficiary_jurisdiction_code: "DE", amount_usd: 786499.99, purpose_code: "TRADE_SETTLEMENT", involves_nested_party: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { pay_below: $.data.id } }
