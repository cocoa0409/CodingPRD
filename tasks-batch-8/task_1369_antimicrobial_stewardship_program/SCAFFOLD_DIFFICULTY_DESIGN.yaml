# =============================================================================
# Task 1369 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 elements.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dot_calendar_vs_dose_basis_divergence
        grounds:
          - calculations.days_of_therapy
          - entities.AntibioticOrder.fields.dot_calendar
          - entities.AntibioticOrder.fields.dot_dose
          - entities.DOTMetricSnapshot.fields.dot_per_1000_pd_calendar
          - entities.DOTMetricSnapshot.fields.dot_per_1000_pd_dose
        distinguishing_aspect: |
          Same administration events on one AntibioticOrder produce different DOT totals
          under the two variants: calendar-day basis counts distinct dates (2), while
          administered-dose basis divides by frequency (3 doses / QID frequency 4 = 0.75),
          so the two DOT-per-1000-patient-days metrics on DOTMetricSnapshot diverge.
        test_recipe:
          setup:
            - "Hospital H (defaults), Practitioner MD (physician), PatientCase P (admitted 2026-08-01, CrCl 90), Antimicrobial D unrestricted non-penicillin with PO form"
            - "Order O on P, drug D, route PO, dose 500mg, frequency_per_day 4, indication EMPIRIC -> ACTIVE at clock 2026-08-01T08:00:00Z"
            - "3 administrations recorded: two on 2026-08-01 (08:00, 12:00), one on 2026-08-02 (08:00)"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "LEVOFLOXACIN", drug_class: "FLUOROQUINOLONE", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-01T08:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "PO", dose_mg: 500, frequency_per_day: 4, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-01T08:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-01T12:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-02T08:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-02T08:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
          trigger:
            - call: "GET /stewardship/antibiotic-orders/${ord_id}"
              payload: {}
              as: IDPharmacist
              as_user_id: "${md_id}"
          assert:
            - "AntibioticOrder.${ord_id}.dot_calendar == 2"
            - "AntibioticOrder.${ord_id}.dot_dose == 0.75"
            - "AntibioticOrder.${ord_id}.dot_calendar != AntibioticOrder.${ord_id}.dot_dose"

      - name: allergy_risk_intake_vs_verified_baseline
        grounds:
          - calculations.penicillin_allergy_risk_score
          - entities.AllergyAssessment.fields.risk_score
          - entities.AllergyAssessment.fields.delabel_eligible
        distinguishing_aspect: |
          Dual variant on the AllergyAssessment domain (distinct from the AntibioticOrder
          DOT domain of the sibling instance): intake_estimate uses self-reported
          years_since_reaction as-is, while verified_baseline recomputes recency from
          effective_years = intake + full elapsed years since assessment creation at
          schedule time, producing a different risk_score for the same assessment.
        test_recipe:
          setup:
            - "Hospital H; Practitioner MD; Practitioner PH (pharmacist, stewardship member)"
            - "Patient P admitted; clock at 2026-08-10T00:00:00Z at creation"
            - "AllergyAssessment A on P: reaction 'mild rash', severity MILD, years_since_reaction 9 -> intake score = 10 + 0 + max(0,30-27) + 0 = 13.00, eligible"
            - "Clock then advanced to 2027-09-01T00:00:00Z (> 1 full year later) before scheduling"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-10T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/allergy-assessments"
              payload: { patient_case_id: "${p_id}", reported_reaction: "mild rash", reaction_severity: "MILD", years_since_reaction: 9 }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { al_id: $.data.id, al_score_intake: $.data.risk_score }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2027-09-01T00:00:00Z" }
              as: StewardshipAdmin
          trigger:
            - call: "POST /stewardship/allergy-assessments/${al_id}/schedule-test"
              payload: {}
              as: IDPharmacist
              as_user_id: "${ph_id}"
          assert:
            - "captured intake variant: al_score_intake == 13.00 (intake_estimate variant, recency_term 3 at years 9)"
            - "After schedule-test: AllergyAssessment.${al_id}.risk_score == 10.00 (verified_baseline: effective_years = 9 + 1 elapsed = 10 -> recency_term max(0,30-30)=0)"
            - "AllergyAssessment.${al_id}.status == TESTING_SCHEDULED"
            - "intake and verified scores differ (13.00 != 10.00)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) and (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: iv_to_po_multigate_weighted_score
        grounds:
          - calculations.iv_to_po_eligibility_score
          - entities.ConversionOpportunity.fields.eligibility_score
        distinguishing_aspect: |
          Mode (a) formula: >= 3 inputs with non-linear interaction — 5 hard gates
          (including a conditional immunocompromised gate) plus three weighted terms with
          a min() cap on renal term and a floor()-decay duration term. Exact pinned score
          97.00 at CrCl 80 / 72 IV-hours vs rejection one hour earlier.
        test_recipe:
          setup:
            - "Hospital H with iv_to_po_min_iv_hours 48 (default); MD; PH"
            - "Patient P: CrCl 80, not immunocompromised, enteral access true"
            - "Drug D unrestricted, has_po_form true"
            - "Order O route IV, frequency 4; 12 IV administrations (3/day for 4 days, 6h apart) -> cumulative_iv_hours = 12 * 6 = 72"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 80 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "LEVOFLOXACIN", drug_class: "FLUOROQUINOLONE", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-01T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 500, frequency_per_day: 4, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-01T00:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-01T06:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-01T12:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-02T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-02T00:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-02T06:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-02T12:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-03T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-03T00:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-03T06:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-03T12:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-04T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-04T00:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-04T06:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-04T12:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
          trigger:
            - call: "POST /stewardship/conversion-opportunities/detect"
              payload: { antibiotic_order_id: "${ord_id}", opportunity_kind: "IV_TO_PO", suggested_antimicrobial_id: "${drug_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { opp_id: $.data.id }
          assert:
            - "ConversionOpportunity.${opp_id}.eligibility_score == 97.00 (hemodynamic 40 + renal 0.4*80=32 + duration 30-5*floor(24/24)=25)"
            - "ConversionOpportunity.${opp_id}.status == DETECTED"

      - name: antibiogram_row_rounding_order_pinned
        grounds:
          - calculations.antibiogram_susceptibility_rate
          - entities.AntibiogramRow.fields.pct_susceptible
          - entities.AntibiogramRow.fields.is_reportable
        distinguishing_aspect: |
          Mode (b) nested rounding: per-row round_half_up of 100*S/N then threshold check
          (pinned order), NOT pool-then-round. A row with 1 S of 3 isolates yields 33.33;
          the forbidden pooled alternative would change the 2dp value. Also exercises
          first-isolate filtering and the half-open window boundary.
        test_recipe:
          setup:
            - "Hospital H with antibiogram_min_isolates 1; Microbiologist MB; MD"
            - "Patient P; 3 cultures, each a distinct organism (E_COLI, KLEBSIELLA, PROTEUS) from URINE collected on 2026-08-01 — each is that (organism, source) pair's first isolate"
            - "Each culture has one susceptibility row for AMPICILLIN: S, S, R respectively; all 3 FINAL"
            - "Antibiogram window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) -> 3 rows, each isolate_count 1, per-row rounded pct (100.00, 100.00, 0.00)"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1", antibiogram_min_isolates: 1 }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MB", license_no: "L-MB-1", discipline: "MICROBIOLOGIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "AMPICILLIN", drug_class: "NARROW_PENICILLIN", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-02T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2026-08-01T00:00:00Z", organism: "E_COLI" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2026-08-01T01:00:00Z", organism: "KLEBSIELLA" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2026-08-01T02:00:00Z", organism: "PROTEUS" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /stewardship/culture-reports/${c1_id}/susceptibility-results"
              payload: { antimicrobial_id: "${drug_id}", interpretation: "S", mic_value: 2.0 }
              as: Microbiologist
              as_user_id: "${mb_id}"
            - call: "POST /stewardship/culture-reports/${c2_id}/susceptibility-results"
              payload: { antimicrobial_id: "${drug_id}", interpretation: "S", mic_value: 4.0 }
              as: Microbiologist
              as_user_id: "${mb_id}"
            - call: "POST /stewardship/culture-reports/${c3_id}/susceptibility-results"
              payload: { antimicrobial_id: "${drug_id}", interpretation: "R", mic_value: 32.0 }
              as: Microbiologist
              as_user_id: "${mb_id}"
            - call: "POST /stewardship/culture-reports/${c1_id}/finalize"
              payload: {}
              as: Microbiologist
              as_user_id: "${mb_id}"
            - call: "POST /stewardship/culture-reports/${c2_id}/finalize"
              payload: {}
              as: Microbiologist
              as_user_id: "${mb_id}"
            - call: "POST /stewardship/culture-reports/${c3_id}/finalize"
              payload: {}
              as: Microbiologist
              as_user_id: "${mb_id}"
          trigger:
            - call: "POST /stewardship/antibiograms"
              payload: { hospital_id: "${h_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { ab_id: $.data.id }
          assert:
            - "Antibiogram.${ab_id}.row_count == 3 (one row per distinct organism for the single drug)"
            - "Each AntibiogramRow: isolate_count == 1, is_reportable == true"
            - "E_COLI row pct_susceptible == 100.00; PROTEUS row pct_susceptible == 0.00 — per-row rounding pinned (no pooling across organisms)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: audit_intervention_negotiation_cycle
        grounds:
          - state_machines.AuditIntervention.RECOMMENDED_to_REJECTED
          - state_machines.AuditIntervention.REJECTED_to_APPEALED
          - state_machines.AuditIntervention.APPEALED_to_RECOMMENDED
        distinguishing_aspect: |
          Cyclic negotiation loop on AuditIntervention (RECOMMENDED -> REJECTED ->
          APPEALED -> RECOMMENDED via UPHOLD) — the intervention can cycle more than once,
          and each UPHOLD grants a fresh 24h due_at window.
        test_recipe:
          setup:
            - "Hospital H; MD prescriber; PH pharmacist; DIR stewardship director (3 distinct practitioners)"
            - "Patient P; unrestricted drug D; ACTIVE order O (created at default clock 2026-08-01)"
            - "AuditIntervention I on O by PH, issued -> RECOMMENDED"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr DIR", license_no: "L-DIR-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { dir_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "CEFTRIAXONE", drug_class: "CEPHALOSPORIN", is_restricted: false, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 1, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/audit-interventions"
              payload: { antibiotic_order_id: "${ord_id}", auditor_id: "${ph_id}", intervention_type: "DURATION_REDUCTION", recommendation_text: "Reduce total course from 14 to 7 days per guideline" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { int_id: $.data.id }
            - call: "POST /stewardship/audit-interventions/${int_id}/issue"
              payload: {}
              as: IDPharmacist
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /stewardship/audit-interventions/${int_id}/respond"
              payload: { response: "REJECTED", responder_id: "${md_id}" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/audit-interventions/${int_id}/appeal"
              payload: { appealer_id: "${ph_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
            - call: "POST /stewardship/audit-interventions/${int_id}/adjudicate"
              payload: { verdict: "UPHOLD", adjudicator_id: "${dir_id}" }
              as: StewardshipDirector
              as_user_id: "${dir_id}"
          assert:
            - "AuditIntervention.${int_id}.recommendation_status == RECOMMENDED (cycle returned to RECOMMENDED after UPHOLD)"
            - "AuditIntervention.${int_id}.appeal_adjudicator_id == ${dir_id}"
            - "Practitioner.${md_id}.unresolved_noncompliance_count == 0 (UPHOLD does not increment)"

      - name: antibiotic_order_parallel_dimensions
        grounds:
          - state_machines.AntibioticOrder
          - entities.AntibioticOrder.fields.approval_status
          - entities.AntibioticOrder.fields.therapy_status
        distinguishing_aspect: |
          Parallel state dimensions on one entity: approval_status
          (PENDING/APPROVED/DENIED/EXPIRED) evolves independently of therapy_status
          (AWAITING_APPROVAL/ACTIVE/REVIEW_REQUIRED/...). Approval expiry flips the
          approval dimension AND cascades to the therapy dimension, while a separate
          audit cycle only moves the therapy dimension.
        test_recipe:
          setup:
            - "Hospital H with restricted_auto_expire_hours 72; MD; PH"
            - "Patient P; restricted drug R"
            - "Order O restricted: approval_status PENDING, therapy_status AWAITING_APPROVAL"
            - "ApprovalRequest AR submitted at clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "MEROPENEM", drug_class: "CARBAPENEM", is_restricted: true, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/approval-requests"
              payload: { antibiotic_order_id: "${ord_id}", requester_id: "${md_id}", justification: "Suspected ESBL bacteremia per prior cultures" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-04T00:00:01Z" }
              as: StewardshipAdmin
          assert:
            - "ApprovalRequest.${ar_id}.status == EXPIRED (72h auto-expiry swept at 2026-08-04T00:00:01 > submitted_at + 72h)"
            - "AntibioticOrder.${ord_id}.approval_status == EXPIRED"
            - "AntibioticOrder.${ord_id}.therapy_status == DISCONTINUED (cascade from approval dimension into therapy dimension)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; one depth >= 3, one >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clock_sweep_approval_order_intervention_cascade
        grounds:
          - state_machines.ApprovalRequest.SUBMITTED_to_EXPIRED
          - state_machines.AntibioticOrder
          - endpoints.POST_/stewardship/_clock/set_current_utc
        distinguishing_aspect: |
          Depth-3 chain triggered by clock-set: clock advance -> ApprovalRequest EXPIRED
          (hop 1) -> AntibioticOrder approval_status EXPIRED + therapy_status DISCONTINUED
          (hop 2, mutation caused by hop 1's side effect) -> the DOCUMENTED
          AuditIntervention attached to that order SUPERSEDED (hop 3, mutation caused by
          hop 2's discontinuation, per the discontinue side-effect rule). Distinct
          trigger from the adjudicate cascade.
        test_recipe:
          setup:
            - "Hospital H (restricted_auto_expire_hours 72 default); MD; PH"
            - "Patient P; restricted drug R -> order O created PENDING / AWAITING_APPROVAL"
            - "ApprovalRequest AR submitted for O at clock 2026-08-01T00:00:00Z"
            - "AuditIntervention I documented against O (creation does not require ACTIVE; issuance does) — I stays DOCUMENTED"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "MEROPENEM", drug_class: "CARBAPENEM", is_restricted: true, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/approval-requests"
              payload: { antibiotic_order_id: "${ord_id}", requester_id: "${md_id}", justification: "Suspected ESBL bacteremia per prior cultures" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /stewardship/audit-interventions"
              payload: { antibiotic_order_id: "${ord_id}", auditor_id: "${ph_id}", intervention_type: "DURATION_REDUCTION", recommendation_text: "Planned early stop once culture results finalize" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { int_id: $.data.id }
          trigger:
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-04T00:00:01Z" }
              as: StewardshipAdmin
          assert:
            - "Hop 1: ApprovalRequest.${ar_id}.status == EXPIRED (clock passed submitted_at + 72h)"
            - "Hop 2: AntibioticOrder.${ord_id}.approval_status == EXPIRED and therapy_status == DISCONTINUED (mutation caused by hop 1)"
            - "Hop 3: AuditIntervention.${int_id}.recommendation_status == SUPERSEDED (mutation caused by hop 2's discontinuation — open interventions on a discontinued order are superseded)"

      - name: adjudicate_overturn_standing_cascade
        grounds:
          - state_machines.AuditIntervention.APPEALED_to_REJECTED_FINAL
          - entities.Practitioner.fields.unresolved_noncompliance_count
          - entities.Practitioner.fields.stewardship_standing
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (adjudicate OVERTURN, not clock):
          adjudication -> AuditIntervention REJECTED_FINAL (hop 1) -> Practitioner
          unresolved_noncompliance_count += 1 and stewardship_standing recompute (hop 2).
          Stacking two OVERTURNs on the same prescriber flips standing GOOD -> WATCH.
        test_recipe:
          setup:
            - "Hospital H; MD prescriber; PH pharmacist; DIR director"
            - "Patient P; unrestricted drug D; two ACTIVE orders O1, O2 (different drugs D1, D2 to satisfy duplicate-active-order rule)"
            - "Interventions I1 on O1 and I2 on O2, both driven RECOMMENDED -> REJECTED -> APPEALED"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr DIR", license_no: "L-DIR-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { dir_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "CEFTRIAXONE", drug_class: "CEPHALOSPORIN", is_restricted: false, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug1: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "AZITHROMYCIN", drug_class: "MACROLIDE", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug2: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug1}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 1, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug2}", prescriber_id: "${md_id}", route: "PO", dose_mg: 500, frequency_per_day: 1, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /stewardship/audit-interventions"
              payload: { antibiotic_order_id: "${o1_id}", auditor_id: "${ph_id}", intervention_type: "DURATION_REDUCTION", recommendation_text: "Reduce total course from 14 to 7 days per guideline" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /stewardship/audit-interventions/${i1_id}/issue"
              payload: {}
              as: IDPharmacist
              as_user_id: "${ph_id}"
            - call: "POST /stewardship/audit-interventions/${i1_id}/respond"
              payload: { response: "REJECTED", responder_id: "${md_id}" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/audit-interventions/${i1_id}/appeal"
              payload: { appealer_id: "${ph_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
            - call: "POST /stewardship/audit-interventions"
              payload: { antibiotic_order_id: "${o2_id}", auditor_id: "${ph_id}", intervention_type: "DOSE_OPTIMIZATION", recommendation_text: "Reduce dose to 250mg daily given renal function" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { i2_id: $.data.id }
            - call: "POST /stewardship/audit-interventions/${i2_id}/issue"
              payload: {}
              as: IDPharmacist
              as_user_id: "${ph_id}"
            - call: "POST /stewardship/audit-interventions/${i2_id}/respond"
              payload: { response: "REJECTED", responder_id: "${md_id}" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/audit-interventions/${i2_id}/appeal"
              payload: { appealer_id: "${ph_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /stewardship/audit-interventions/${i1_id}/adjudicate"
              payload: { verdict: "OVERTURN", adjudicator_id: "${dir_id}" }
              as: StewardshipDirector
              as_user_id: "${dir_id}"
            - call: "POST /stewardship/audit-interventions/${i2_id}/adjudicate"
              payload: { verdict: "OVERTURN", adjudicator_id: "${dir_id}" }
              as: StewardshipDirector
              as_user_id: "${dir_id}"
          assert:
            - "AuditIntervention.${i1_id}.recommendation_status == REJECTED_FINAL"
            - "AuditIntervention.${i2_id}.recommendation_status == REJECTED_FINAL"
            - "Practitioner.${md_id}.unresolved_noncompliance_count == 2 (hop 2 fired once per OVERTURN)"
            - "Practitioner.${md_id}.stewardship_standing == WATCH (>= 2 boundary is inclusive)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_allergy_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_PATIENT_DISCHARGED]
          - errors[ERR_ALLERGY_BLOCKS_ORDER]
        distinguishing_aspect: |
          Category pair state(p5) vs business_safety(p7): ordering a penicillin-class
          drug for a DISCHARGED patient with an active allergy must yield
          ERR_PATIENT_DISCHARGED (p5 wins over p7) — not ERR_ALLERGY_BLOCKS_ORDER.
        test_recipe:
          setup:
            - "Hospital H; MD; PH; patient P DISCHARGED; allergy assessment A on P in SUSPECTED (created before discharge)"
            - "Penicillin-class drug PC (is_penicillin_class true)"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/allergy-assessments"
              payload: { patient_case_id: "${p_id}", reported_reaction: "mild rash", reaction_severity: "MILD", years_since_reaction: 3 }
              as: IDPharmacist
              as_user_id: "${ph_id}"
            - call: "POST /stewardship/patient-cases/${p_id}/discharge"
              payload: {}
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "AMOXICILLIN", drug_class: "NARROW_PENICILLIN", is_restricted: false, has_po_form: true, is_penicillin_class: true }
              as: StewardshipAdmin
              captures: { drug_pc: $.data.id }
          trigger:
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_pc}", prescriber_id: "${md_id}", route: "PO", dose_mg: 500, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PATIENT_DISCHARGED (priority 5 state beats priority 7 business_safety)"
            - "error_id != ERR_ALLERGY_BLOCKS_ORDER"

      - name: safety_vs_referential_cross_facility_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - errors[ERR_ALLERGY_BLOCKS_ORDER]
          - errors[ERR_CROSS_FACILITY_REFERENCE]
        distinguishing_aspect: |
          Different error-category pair from the sibling instance: business_safety(p7)
          vs business_referential(p19). A single order request that violates BOTH
          (penicillin-class drug with active allergy AND a prescriber from another
          facility) must surface ERR_ALLERGY_BLOCKS_ORDER, not
          ERR_CROSS_FACILITY_REFERENCE.
        test_recipe:
          setup:
            - "Hospitals H1 and H2; MD1 in H1; MD2 in H2; PH1 in H1"
            - "Patient P in H1 with SUSPECTED penicillin allergy"
            - "Penicillin-class drug PC registered in H1"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H1", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /stewardship/hospitals"
              payload: { name: "H2", nhsn_facility_id: "NHSN-2" }
              as: StewardshipAdmin
              captures: { h2_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h1_id}", full_name: "Dr MD1", license_no: "L-MD1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md1_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h2_id}", full_name: "Dr MD2", license_no: "L-MD2", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md2_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h1_id}", full_name: "Pharm PH1", license_no: "L-PH1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph1_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h1_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md1_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/allergy-assessments"
              payload: { patient_case_id: "${p_id}", reported_reaction: "mild rash", reaction_severity: "MILD", years_since_reaction: 3 }
              as: IDPharmacist
              as_user_id: "${ph1_id}"
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h1_id}", drug_name: "AMOXICILLIN", drug_class: "NARROW_PENICILLIN", is_restricted: false, has_po_form: true, is_penicillin_class: true }
              as: StewardshipAdmin
              captures: { drug_pc: $.data.id }
          trigger:
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_pc}", prescriber_id: "${md2_id}", route: "PO", dose_mg: 500, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLERGY_BLOCKS_ORDER (priority 7 business_safety beats priority 19 business_referential)"
            - "error_id != ERR_CROSS_FACILITY_REFERENCE"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: benchmark_percentile_exact_floor
        grounds:
          - calculations.dot_benchmark_percentile
          - entities.DOTMetricSnapshot.fields.benchmark_percentile
          - endpoints.POST_/stewardship/dot-snapshots
        distinguishing_aspect: |
          Inclusive-floor boundary on the benchmark percentile metric: the percentile
          ladder uses >= at each floor, so a rate below the P25 floor (350) maps to P10,
          while a rate at exactly a floor would jump to that floor's tier. Exercised via
          POST /stewardship/dot-snapshots with 3 calendar DOTs over 100 patient-days
          (30.00 -> P10). Distinct metric and endpoint from the conversion-hours boundary.
        test_recipe:
          setup:
            - "Hospital H; IP infection preventionist; MD"
            - "One unrestricted order accrues 3 distinct-date DOTs (2026-08-01/02/03, one PO dose each) in the 2026-08 month; patient_days = 100 -> 3/100*1000 = 30.00"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Nurse IP", license_no: "L-IP-1", discipline: "INFECTION_PREVENTIONIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ip_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
