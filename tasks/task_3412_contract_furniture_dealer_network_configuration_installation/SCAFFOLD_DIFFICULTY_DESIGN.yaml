          assert:
            - "error_id == ERR_ORDER_NOT_ACKNOWLEDGED and phase logistics_status remains PLANNED"

      - name: punch_create_requires_install_in_progress
        grounds:
          - validations[priority=8]
          - state_machines.InstallationPhase
          - state_machines.PunchTicket
        distinguishing_aspect: |
          Entity pair PunchTicket <- InstallationPhase: a punch can only be
          filed while the phase's install dimension is IN_PROGRESS; against a
          SCHEDULED-but-NOT_STARTED phase (manufacturing reserved, install not
          begun) the create is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "phase logistics_status SCHEDULED, install_status NOT_STARTED (clock advanced to production date 2026-11-02)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
