          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "OC", name: "OCC Store", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.5, predicted_instore_mix_pct: 0.5, headcount: 4, expected_store_version: "${store_v0}" }
              as: StoreManager
              captures: { deploy_id: $.data.id }
            - call: "GET /api/v1/stores/${store_id}"
              payload: {}
              as: StoreManager
          assert:
            - "the create succeeds (201)"
            - "Store.${store_id}.version == ${store_v0} + 1"

      - name: cascading_suppression_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - calculations.suppression_cascade
        excluded_because:
          difficulty_instance: ingredient_depletion_cascades_to_marketplace_suppression
          rationale: "The §1.8 transitive_cascade instance already exercises the 3-level cascade end-to-end."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: all_changes_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the order-place response itself carries the computed promised_at, subtotal, commission and line assignment without requiring a follow-up GET."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store, BOWL, stock, window."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "IM", name: "Immediate", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /api/v1/menu-items/${item_id}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_id}", quantity: 1, customizations: [] }] }
              as: StoreManager
              captures: { order_id: $.data.id }
          assert:
            - "the 201 response body already shows promised_at == 2026-09-01T10:30:00Z"
            - "the response body shows line == DIGITAL, entree_count == 1, subtotal_cents == 1095"
            - "no follow-up GET is required to observe these computed values"
