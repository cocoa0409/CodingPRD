  - rule_id: resource_temporal_overlap
    instances:

      - name: technician_occupation_is_half_open_so_adjacent_dispatch_is_legal
        grounds:
          - calculations.technician_occupation_interval
          - validations[priority=32]
          - errors.ERR_TECHNICIAN_DISPATCH_OVERLAP
          - entities.Technician.fields.open_dispatch_count
        distinguishing_aspect: |
          The technician's occupation interval is [dispatched_at, planned_release_at + 60 min) —
          half-open on the right — so a second dispatch starting EXACTLY at the first interval's end
          (2026-08-03T11:00:00.000Z for a 10:00 planned release) is admitted, while a dispatch one
          minute earlier at 10:59 overlaps and is refused. The 60-minute turnaround is invisible in
          the inputs: 10:59 lies well after the 10:00 planned release and only conflicts because of it.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "ONE recovery technician, three donors all approved for recovery (death 2026-08-03T02:00:00.000Z, cooled 03:00, window 960, deadline 18:00)"
            - "recovery r1 on that technician: dispatched_at 2026-08-03T06:30:00.000Z, planned_release_at 2026-08-03T10:00:00.000Z, left DISPATCHED -> occupation [06:30, 11:00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
