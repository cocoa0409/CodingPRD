              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DRUG_DISCONTINUED (422); order remains PENDING"
      - name: error_not_order_prescriber
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_ORDER_PRESCRIBER]", "validations[priority=16]"]
        distinguishing_aspect: "A prescriber other than the ordering prescriber cannot discontinue: ERR_NOT_ORDER_PRESCRIBER (403)."
        test_recipe:
          setup: ["Order by prescriber A; prescriber B exists"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr NP-A", staff_role: "PRESCRIBER" }
