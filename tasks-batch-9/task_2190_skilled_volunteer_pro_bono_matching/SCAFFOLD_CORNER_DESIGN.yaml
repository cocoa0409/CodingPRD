            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {err: "$.data.error_id"}}
          assert:
