            - call: "POST /cooks/${cook_id}/standing-actions"
              payload: { action: "REINSTATE", reason: "REVIEW_CLOSED_NO_FINDING" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /menu-items/${mi_id}/submit"
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
          assert:
            - "after the SUSPEND call: Cook.${cook_id}.compliance_standing == SUSPENDED"
            - "after the SUSPEND call: Cook.${cook_id}.onboarding_status == ACTIVE (the other dimension did not move)"
            - "after the SUSPEND call: Cook.${cook_id}.standing_reason == MANUAL_SAFETY_REVIEW"
            - "the first submit responds 409 with error.id == ERR_COOK_SUSPENDED"
            - "MenuItem.${mi_id}.review_status == DRAFT after the rejected submit"
            - "after the REINSTATE call: Cook.${cook_id}.compliance_standing == CLEAR AND Cook.${cook_id}.onboarding_status == ACTIVE"
            - "the second submit responds 200 and MenuItem.${mi_id}.review_status == UNDER_REVIEW"

      - name: menu_item_revision_cycle_terminates_at_max_rounds
        grounds:
          - state_machines.MenuItem.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.MenuItem.UNDER_REVIEW_to_REJECTED
          - state_machines.MenuItem.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.MenuItem.fields.revision_round
        distinguishing_aspect: |
          A bounded cycle whose exit edge is chosen by a counter, not by the caller. The identical
          payload decision REQUEST_REVISION lands on REVISION_REQUESTED while revision_round is
          below MAX_REVISION_ROUNDS (2) and on the terminal REJECTED once it equals 2, and the
          counter increments on both edges - so the third REQUEST_REVISION leaves revision_round
          at 3 with review_status REJECTED, after which submit is no longer a declared transition.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Fay is ACTIVE and CLEAR."
