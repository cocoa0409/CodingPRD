# =============================================================================
# Task 1968 — Prior Authorization Criteria & Utilization Management Vendor
# =============================================================================

scenario: |
  1968. Prior Authorization Criteria & Utilization Management Vendor (utilization
  management vendor): criteria library & clinical guideline versioning, request
  intake channels & auto-approval rules, clinical reviewer & medical director
  escalation tiers, turnaround-time compliance by urgency & regulation,
  peer-to-peer scheduling & determination notice content, appeal linkage &
  overturn analysis, gold-carding program for high-approval providers,
  delegation oversight & audit

domain_name: prior-authorization-um
api_prefix: /um

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - version_pinning_on_approval   # requests pin the guideline version at intake; later supersession never re-pins
    - rate_threshold_triggers       # gold-card grant/suspend driven by rolling approval-rate thresholds
    - scheduled_actions             # logical clock drives TAT breach sweeps; P2P conferences occupy time intervals
    - derived_field_reconciliation  # provider rolling stats, arrangement open_deficiency_count, overturn metrics
  entity_topology: flat             # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: branching    # intake fork (auto vs pend), escalation cycle, appeal fork — with cycles on Request/Provider
  relationship_patterns:
    - one_to_many                   # criteria set -> guideline versions; request -> p2p conferences; determination -> appeals
    - self_referential              # GuidelineVersion.supersedes_version_id -> GuidelineVersion.id
    - cross_aggregate               # request pins guideline version; finding references determination across aggregates
  role_model: segregation_of_duties # appeal reviewer != original decider; MD != escalating reviewer; void is admin-only
  consistency_model: immediate      # all cascades settle inside the triggering request

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique across providers (duplicate rejected)" }
      - { name: name, type: string, source: input, description: "Provider organization name" }
      - { name: specialty, type: string, source: input, required: false, description: "Optional specialty label" }
      - { name: gold_card_status, type: enum, source: system, default: NOT_GOLD_CARDED, constraints: "NOT_GOLD_CARDED | GOLD_CARDED | SUSPENDED", description: "Gold-card program standing" }
      - { name: gold_card_service_category, type: string, source: system, description: "Service category the gold card applies to; null unless GOLD_CARDED" }
      - { name: rolling_determination_count, type: integer, source: computed, default: 0, description: "Human-lane determinations (FINAL or OVERTURNED, CLINICAL_REVIEWER/MEDICAL_DIRECTOR) with issued_at inside [now-90d, now]" }
      - { name: rolling_approval_count, type: integer, source: computed, default: 0, description: "Subset of rolling determinations whose effective outcome is APPROVED" }
      - { name: rolling_approval_rate, type: number, source: computed, description: "rolling_approval_count / rolling_determination_count, 4dp round_half_up; null when count is 0" }
      - { name: lifetime_determination_count, type: integer, source: computed, default: 0, description: "Same inclusion set as rolling counts but without the 90-day window" }
      - { name: lifetime_approval_count, type: integer, source: computed, default: 0, description: "Lifetime effective approvals" }
      - { name: lifetime_approval_rate, type: number, source: computed, description: "lifetime_approval_count / lifetime_determination_count, 4dp round_half_up; null when count is 0" }

  - name: ClinicalCriteriaSet
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Criteria library name (used in determination notices)" }
      - { name: line_of_business, type: enum, source: input, constraints: "COMMERCIAL | MEDICARE | MEDICAID", description: "Regulation dimension for turnaround SLA" }
      - { name: service_category, type: string, source: input, description: "Service category this criteria set governs; matched against gold-card category" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | ACTIVE | RETIRED", description: "Lifecycle status" }

  - name: GuidelineVersion
    parent: null
    common_fields: true
    fields:
      - { name: criteria_set_id, type: string, source: system, description: "FK -> ClinicalCriteriaSet.id; owning criteria set (path)" }
      - { name: version_label, type: string, source: input, description: "Human version label, e.g. '1.0' (used in notices)" }
      - { name: content, type: string, source: input, description: "Clinical criteria text" }
      - { name: auto_approve_eligible, type: boolean, source: input, description: "Whether requests pinned to this version may auto-approve via the rules lane" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the effective window (closed interval)" }
      - { name: effective_until, type: datetime, source: input, required: false, description: "Inclusive end of the effective window; null = open-ended; clamped by server on supersession" }
      - { name: supersedes_version_id, type: string, source: input, required: false, description: "FK -> GuidelineVersion.id; the PUBLISHED version in the same set this version replaces on publish" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | PUBLISHED | SUPERSEDED | RETIRED", description: "Lifecycle status" }

  - name: PriorAuthRequest
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; requesting provider" }
      - { name: member_ref, type: string, source: input, description: "External member identifier string (no member registry)" }
      - { name: criteria_set_id, type: string, source: input, description: "FK -> ClinicalCriteriaSet.id; governs criteria and regulation" }
      - { name: guideline_version_id, type: string, source: system, description: "FK -> GuidelineVersion.id; pinned at intake to the PUBLISHED version whose closed window contains received_at; never re-pinned" }
      - { name: service_code, type: string, source: input, description: "Procedure/service code requested" }
      - { name: urgency, type: enum, source: input, constraints: "STANDARD | URGENT", description: "Urgency dimension for turnaround SLA" }
      - { name: intake_channel, type: enum, source: input, constraints: "PORTAL | FAX | PHONE | EDI", description: "Channel the request arrived on; PORTAL/EDI feed the rules lane" }
      - { name: documentation_complete, type: boolean, source: input, description: "Whether required clinical documentation was attached at intake" }
      - { name: status, type: enum, source: system, constraints: "RECEIVED | AUTO_APPROVED | PENDED_REVIEW | ESCALATED_MD | APPROVED | DENIED | WITHDRAWN", description: "Pipeline status; RECEIVED is transient within the intake call" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at intake" }
      - { name: due_at, type: datetime, source: computed, description: "received_at + SLA hours by (urgency x line_of_business); see turnaround_due_at" }
      - { name: determined_at, type: datetime, source: system, description: "Timestamp of the current non-VOID determination; null while undetermined" }
      - { name: escalated_by_user_id, type: string, source: system, description: "X-User-ID of the ClinicalReviewer who escalated; null unless status == ESCALATED_MD" }
      - { name: is_tat_breached, type: boolean, source: computed, default: false, description: "Sticky flag set by clock sweep (now > due_at while undetermined) or by a late determination (issued_at > due_at)" }

  - name: Determination
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> PriorAuthRequest.id; at most one non-VOID determination per request" }
      - { name: outcome, type: enum, source: system, constraints: "APPROVED | DENIED", description: "Recorded outcome (an OVERTURNED denial keeps outcome DENIED with status OVERTURNED)" }
      - { name: reason_code, type: enum, source: system, constraints: "GOLD_CARD_AUTO | AUTO_RULE | MEDICAL_NECESSITY_MET | MEDICAL_NECESSITY_NOT_MET | INSUFFICIENT_INFO | EXPERIMENTAL_INVESTIGATIONAL", description: "Determination reason; auto lanes use GOLD_CARD_AUTO / AUTO_RULE" }
      - { name: decided_by_role, type: enum, source: system, constraints: "SYSTEM_RULE | CLINICAL_REVIEWER | MEDICAL_DIRECTOR", description: "Which tier decided" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the decider; null for SYSTEM_RULE" }
      - { name: guideline_version_id, type: string, source: system, description: "FK -> GuidelineVersion.id; copied from the request's pinned version" }
      - { name: notice_text, type: string, source: computed, description: "Determination notice rendered per notice_text_render template" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: status, type: enum, source: system, default: FINAL, constraints: "FINAL | OVERTURNED | VOID", description: "FINAL until overturned on appeal or voided by admin" }

  - name: PeerToPeerConference
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> PriorAuthRequest.id; the escalated request under discussion" }
      - { name: md_user_id, type: string, source: system, description: "X-User-ID of the scheduling MedicalDirector" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; must be after scheduled_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED", description: "Conference lifecycle" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: determination_id, type: string, source: system, description: "FK -> Determination.id; the appealed determination (path)" }
      - { name: appeal_reason, type: string, source: input, description: "Free-text appeal basis" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at filing" }
      - { name: due_at, type: datetime, source: computed, description: "received_at + 720h (30-day appeal SLA)" }
      - { name: status, type: enum, source: system, default: RECEIVED, constraints: "RECEIVED | IN_REVIEW | UPHELD | OVERTURNED | WITHDRAWN", description: "Appeal lifecycle" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the AppealsReviewer who began review; set by begin-review" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of decision; null until decided" }
      - { name: is_tat_breached, type: boolean, source: computed, default: false, description: "Sticky flag set by clock sweep when now > due_at while undecided" }

  - name: GoldCardEvaluation
    parent: null
    common_fields: false
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; evaluated provider (path)" }
      - { name: service_category, type: string, source: input, description: "Category the gold card would cover" }
      - { name: window_start, type: datetime, source: system, description: "Evaluation time minus 90 days (inclusive lower bound)" }
      - { name: window_end, type: datetime, source: system, description: "Evaluation time (logical clock)" }
      - { name: window_determination_count, type: integer, source: system, description: "Rolling determination count observed at evaluation" }
      - { name: window_approval_rate, type: number, source: system, description: "Rolling approval rate observed at evaluation, 4dp" }
      - { name: decision, type: enum, source: system, constraints: "GRANTED | REINSTATED", description: "REINSTATED when provider was SUSPENDED, else GRANTED" }

  - name: DelegationArrangement
    parent: null
    common_fields: true
    fields:
      - { name: delegating_plan_name, type: string, source: input, description: "Health plan delegating UM authority to the vendor" }
      - { name: criteria_set_id, type: string, source: input, description: "FK -> ClinicalCriteriaSet.id; delegated scope (at most one arrangement per criteria set)" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "SUSPENDED automatically at 3 open deficiencies; resumes ACTIVE below 3" }
      - { name: open_deficiency_count, type: integer, source: computed, default: 0, description: "Count of OPEN findings with finding_type != COMPLIANT" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: arrangement_id, type: string, source: system, description: "FK -> DelegationArrangement.id; audited arrangement (path)" }
      - { name: determination_id, type: string, source: input, description: "FK -> Determination.id; audited determination (must fall in arrangement scope)" }
      - { name: finding_type, type: enum, source: input, constraints: "COMPLIANT | NOTICE_DEFICIENT | CRITERIA_MISAPPLIED | TAT_VIOLATION", description: "Audit verdict; non-COMPLIANT types are deficiencies" }
      - { name: status, type: enum, source: system, default: OPEN, constraints: "OPEN | CLOSED", description: "Finding lifecycle" }

  - name: ComplianceEvent
    parent: null
    common_fields: false
    fields:
      - { name: event_type, type: enum, source: system, constraints: "AUTO_APPROVAL_FIRED | TAT_BREACHED | GOLD_CARD_GRANTED | GOLD_CARD_SUSPENDED | DELEGATION_SUSPENDED | DETERMINATION_VOIDED | APPEAL_OVERTURNED", description: "Audit event kind" }
      - { name: request_id, type: string, source: system, description: "FK -> PriorAuthRequest.id; null when event is not request-scoped" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; null when event is not provider-scoped" }
      - { name: details, type: string, source: system, description: "Human-readable audit detail" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ClinicalCriteriaSet
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /um/criteria-sets/{id}/transition {to_status: ACTIVE}"
        actor: ClinicalPolicyEditor
        preconditions:
          - "Set must be DRAFT (ERR_INVALID_CRITERIA_SET_TRANSITION)"
          - "At least one GuidelineVersion in this set has status PUBLISHED (ERR_NO_ACTIVE_GUIDELINE)"
        side_effects: ["increments ClinicalCriteriaSet.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /um/criteria-sets/{id}/transition {to_status: RETIRED}"
        actor: ClinicalPolicyEditor
        preconditions:
          - "Set must be ACTIVE (ERR_INVALID_CRITERIA_SET_TRANSITION)"
        side_effects:
          - "increments ClinicalCriteriaSet.version by 1"
          - "In-flight requests pinned to this set's guideline versions are unaffected (version pinning)"
        note: "DRAFT -> RETIRED and RETIRED -> anything are invalid transitions"

  - entity: GuidelineVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /um/guideline-versions/{id}/transition {to_status: PUBLISHED}"
        actor: ClinicalPolicyEditor
        preconditions:
          - "OCC: expected_criteria_set_version == criteria set's current version (ERR_STALE_VERSION)"
          - "Owning criteria set status IN {DRAFT, ACTIVE} (ERR_CRITERIA_SET_NOT_ACTIVE... set RETIRED rejects with ERR_INVALID_GUIDELINE_TRANSITION)"
          - "Version must be DRAFT (ERR_INVALID_GUIDELINE_TRANSITION)"
          - "supersedes_version_id, if present, belongs to the same criteria set (ERR_SUPERSEDES_CROSS_SET)"
          - "supersedes_version_id, if present, has status PUBLISHED (ERR_INVALID_GUIDELINE_TRANSITION)"
          - "Closed effective window [effective_from, effective_until] (null until = +infinity) must not intersect any OTHER PUBLISHED version's closed window in the same set (ERR_GUIDELINE_WINDOW_OVERLAP)"
        side_effects:
          - "status -> PUBLISHED"
          - "If supersedes_version_id present: that version -> SUPERSEDED and its effective_until := this.effective_from - 1 second"
          - "increments owning ClinicalCriteriaSet.version by 1"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /um/guideline-versions/{id}/transition {to_status: RETIRED}"
        actor: ClinicalPolicyEditor
        preconditions:
          - "OCC: expected_criteria_set_version matches (ERR_STALE_VERSION)"
          - "Version must be DRAFT (ERR_INVALID_GUIDELINE_TRANSITION)"
        side_effects: ["increments owning ClinicalCriteriaSet.version by 1"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /um/guideline-versions/{id}/transition {to_status: RETIRED}"
        actor: ClinicalPolicyEditor
        preconditions:
          - "OCC: expected_criteria_set_version matches (ERR_STALE_VERSION)"
          - "Version must be PUBLISHED (ERR_INVALID_GUIDELINE_TRANSITION)"
          - "No PriorAuthRequest pinned to this version is in PENDED_REVIEW or ESCALATED_MD (ERR_GUIDELINE_HAS_INFLIGHT_REQUESTS)"
        side_effects: ["increments owning ClinicalCriteriaSet.version by 1"]
        note: "PUBLISHED -> SUPERSEDED happens only as a side effect of another version's publish, never via direct transition"

  - entity: PriorAuthRequest
    initial_state: RECEIVED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: AUTO_APPROVED
        trigger: "system (inside POST /um/prior-auth-requests, auto_approval_decision lane fires)"
        actor: system
        preconditions: ["auto_approval_decision: gold lane OR rules lane true"]
        side_effects:
          - "Determination created: outcome APPROVED, reason_code GOLD_CARD_AUTO or AUTO_RULE, decided_by_role SYSTEM_RULE, decided_by_user_id null, guideline_version_id = pinned version, status FINAL, issued_at = clock"
          - "determined_at := issued_at"
          - "ComplianceEvent AUTO_APPROVAL_FIRED created (request_id, provider_id)"
      - from: RECEIVED
        to: PENDED_REVIEW
        trigger: "system (inside POST /um/prior-auth-requests, no auto-approval lane fires)"
        actor: system
        preconditions: ["auto_approval_decision: both lanes false"]
        side_effects: []
      - from: PENDED_REVIEW
        to: APPROVED
        trigger: "POST /um/prior-auth-requests/{id}/reviewer-decision {decision: APPROVE}"
        actor: ClinicalReviewer
        preconditions:
          - "Request must be PENDED_REVIEW (ERR_REQUEST_NOT_PENDING)"
          - "reason_code == MEDICAL_NECESSITY_MET (ERR_INVALID_REQUEST)"
        side_effects:
          - "Determination created (decided_by_role CLINICAL_REVIEWER, decided_by_user_id = X-User-ID, status FINAL)"
          - "determined_at := issued_at; if issued_at > due_at then is_tat_breached := true and TAT_BREACHED event created"
          - "Provider rolling/lifetime stats recompute; gold-card auto-suspend check runs"
      - from: PENDED_REVIEW
        to: DENIED
        trigger: "POST /um/prior-auth-requests/{id}/reviewer-decision {decision: DENY}"
        actor: ClinicalReviewer
        preconditions:
          - "Request must be PENDED_REVIEW (ERR_REQUEST_NOT_PENDING)"
          - "reason_code IN {MEDICAL_NECESSITY_NOT_MET, INSUFFICIENT_INFO, EXPERIMENTAL_INVESTIGATIONAL} (ERR_INVALID_REQUEST)"
        side_effects:
          - "Determination created (CLINICAL_REVIEWER, status FINAL)"
          - "determined_at := issued_at; late determination marks is_tat_breached + event"
          - "Provider stats recompute; gold-card auto-suspend check runs (this is the trigger that can flip GOLD_CARDED -> SUSPENDED and emit GOLD_CARD_SUSPENDED)"
      - from: PENDED_REVIEW
        to: ESCALATED_MD
        trigger: "POST /um/prior-auth-requests/{id}/reviewer-decision {decision: ESCALATE}"
        actor: ClinicalReviewer
        preconditions:
          - "Request must be PENDED_REVIEW (ERR_REQUEST_NOT_PENDING)"
          - "reason_code must be omitted for ESCALATE (ERR_INVALID_REQUEST)"
        side_effects: ["escalated_by_user_id := X-User-ID"]
      - from: ESCALATED_MD
        to: APPROVED
        trigger: "POST /um/prior-auth-requests/{id}/md-decision {decision: APPROVE}"
        actor: MedicalDirector
        preconditions:
          - "Request must be ESCALATED_MD (ERR_REQUEST_NOT_ESCALATED)"
          - "X-User-ID != escalated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "reason_code == MEDICAL_NECESSITY_MET (ERR_INVALID_REQUEST)"
        side_effects:
          - "Determination created (MEDICAL_DIRECTOR, status FINAL); determined_at set; late-determination breach marking"
          - "Provider stats recompute; auto-suspend check runs"
      - from: ESCALATED_MD
        to: DENIED
        trigger: "POST /um/prior-auth-requests/{id}/md-decision {decision: DENY}"
        actor: MedicalDirector
        preconditions:
          - "Request must be ESCALATED_MD (ERR_REQUEST_NOT_ESCALATED)"
          - "X-User-ID != escalated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No PeerToPeerConference for this request in SCHEDULED status (ERR_P2P_CONFERENCE_OUTSTANDING)"
          - "reason_code IN {MEDICAL_NECESSITY_NOT_MET, INSUFFICIENT_INFO, EXPERIMENTAL_INVESTIGATIONAL} (ERR_INVALID_REQUEST)"
        side_effects:
          - "Determination created (MEDICAL_DIRECTOR, status FINAL); determined_at set; late-determination breach marking"
          - "Provider stats recompute; auto-suspend check runs"
      - from: ESCALATED_MD
        to: PENDED_REVIEW
        trigger: "POST /um/prior-auth-requests/{id}/md-decision {decision: SEND_BACK}"
        actor: MedicalDirector
        preconditions:
          - "Request must be ESCALATED_MD (ERR_REQUEST_NOT_ESCALATED)"
          - "X-User-ID != escalated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["escalated_by_user_id := null"]
        note: "Send-back cycle: the request returns to the reviewer tier"
      - from: PENDED_REVIEW
        to: WITHDRAWN
        trigger: "POST /um/prior-auth-requests/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions:
          - "Request must be PENDED_REVIEW or ESCALATED_MD (ERR_REQUEST_NOT_WITHDRAWABLE)"
        side_effects:
          - "Any PeerToPeerConference for this request in SCHEDULED status -> CANCELLED (conditional cascade)"
      - from: ESCALATED_MD
        to: WITHDRAWN
        trigger: "POST /um/prior-auth-requests/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions:
          - "Request must be PENDED_REVIEW or ESCALATED_MD (ERR_REQUEST_NOT_WITHDRAWABLE)"
        side_effects:
          - "Any SCHEDULED PeerToPeerConference for this request -> CANCELLED"
      - from: DENIED
        to: APPROVED
        trigger: "system (cascade from Appeal decided OVERTURNED)"
        actor: system
        preconditions: ["Linked appeal decided OVERTURNED"]
        side_effects: ["Provider stats recompute (the overturned denial now counts as an approval)"]
      - from: AUTO_APPROVED
        to: PENDED_REVIEW
        trigger: "system (cascade from Determination void where decided_by_role == SYSTEM_RULE)"
        actor: system
        preconditions: ["Determination voided"]
        side_effects: ["determined_at := null"]
      - from: APPROVED
        to: PENDED_REVIEW
        trigger: "system (cascade from Determination void where decided_by_role == CLINICAL_REVIEWER)"
        actor: system
        preconditions: ["Determination voided"]
        side_effects: ["determined_at := null"]
      - from: APPROVED
        to: ESCALATED_MD
        trigger: "system (cascade from Determination void where decided_by_role == MEDICAL_DIRECTOR)"
        actor: system
        preconditions: ["Determination voided"]
        side_effects: ["determined_at := null", "escalated_by_user_id retains its prior value"]
      - from: DENIED
        to: PENDED_REVIEW
        trigger: "system (cascade from Determination void where decided_by_role == CLINICAL_REVIEWER)"
        actor: system
        preconditions: ["Determination voided"]
        side_effects: ["determined_at := null"]
      - from: DENIED
        to: ESCALATED_MD
        trigger: "system (cascade from Determination void where decided_by_role == MEDICAL_DIRECTOR)"
        actor: system
        preconditions: ["Determination voided"]
        side_effects: ["determined_at := null", "escalated_by_user_id retains its prior value"]

  - entity: Determination
    initial_state: FINAL
    terminal_states: [OVERTURNED, VOID]
    transitions:
      - from: FINAL
        to: OVERTURNED
        trigger: "system (cascade from POST /um/appeals/{id}/decide {outcome: OVERTURNED})"
        actor: system
        preconditions: ["Determination must be FINAL"]
        side_effects:
          - "PriorAuthRequest DENIED -> APPROVED"
          - "Provider stats recompute (effective outcome becomes APPROVED)"
          - "ComplianceEvent APPEAL_OVERTURNED created (request_id, provider_id)"
      - from: FINAL
        to: VOID
        trigger: "POST /um/determinations/{id}/void"
        actor: UMAdmin
        preconditions:
          - "Determination must be FINAL (ERR_DETERMINATION_NOT_VOIDABLE)"
          - "No Appeal for this determination in RECEIVED or IN_REVIEW (ERR_DETERMINATION_NOT_VOIDABLE)"
        side_effects:
          - "Request reverts: SYSTEM_RULE/CLINICAL_REVIEWER decisions -> PENDED_REVIEW; MEDICAL_DIRECTOR decisions -> ESCALATED_MD; determined_at := null"
          - "Provider stats recompute excluding this determination (VOID rows never count)"
          - "ComplianceEvent DETERMINATION_VOIDED created (request_id, provider_id)"

  - entity: PeerToPeerConference
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /um/peer-to-peer-conferences/{id}/resolve {outcome: COMPLETED}"
        actor: MedicalDirector
        preconditions:
          - "Conference must be SCHEDULED (ERR_P2P_NOT_RESOLVABLE)"
          - "X-User-ID == md_user_id (ERR_NOT_ASSIGNED_MD)"
        side_effects: ["MD denial is no longer blocked for the request"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /um/peer-to-peer-conferences/{id}/resolve {outcome: NO_SHOW}"
        actor: MedicalDirector
        preconditions:
          - "Conference must be SCHEDULED (ERR_P2P_NOT_RESOLVABLE)"
          - "X-User-ID == md_user_id (ERR_NOT_ASSIGNED_MD)"
        side_effects: ["MD denial is no longer blocked for the request"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from request withdraw)"
        actor: system
        preconditions: ["Parent request withdrawn"]
        side_effects: []

  - entity: Appeal
    initial_state: RECEIVED
    terminal_states: [UPHELD, OVERTURNED, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: IN_REVIEW
        trigger: "POST /um/appeals/{id}/begin-review"
        actor: AppealsReviewer
        preconditions:
          - "Appeal must be RECEIVED (ERR_INVALID_APPEAL_STATE)"
          - "determination.decided_by_user_id is null OR X-User-ID != determination.decided_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["reviewer_id := X-User-ID"]
      - from: IN_REVIEW
        to: UPHELD
        trigger: "POST /um/appeals/{id}/decide {outcome: UPHELD}"
        actor: AppealsReviewer
        preconditions:
          - "Appeal must be IN_REVIEW (ERR_INVALID_APPEAL_STATE)"
          - "X-User-ID == reviewer_id (ERR_NOT_ASSIGNED_REVIEWER)"
        side_effects: ["decided_at := clock"]
      - from: IN_REVIEW
        to: OVERTURNED
        trigger: "POST /um/appeals/{id}/decide {outcome: OVERTURNED}"
        actor: AppealsReviewer
        preconditions:
          - "Appeal must be IN_REVIEW (ERR_INVALID_APPEAL_STATE)"
          - "X-User-ID == reviewer_id (ERR_NOT_ASSIGNED_REVIEWER)"
        side_effects:
          - "decided_at := clock"
          - "Determination FINAL -> OVERTURNED (see Determination machine for the downstream cascade)"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /um/appeals/{id}/withdraw"
        actor: AppealsClerk
        preconditions: ["Appeal must be RECEIVED or IN_REVIEW (ERR_INVALID_APPEAL_STATE)"]
        side_effects: []
      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /um/appeals/{id}/withdraw"
        actor: AppealsClerk
        preconditions: ["Appeal must be RECEIVED or IN_REVIEW (ERR_INVALID_APPEAL_STATE)"]
        side_effects: []

  - entity: Provider
    initial_state: NOT_GOLD_CARDED
    terminal_states: []
    transitions:
      - from: NOT_GOLD_CARDED
        to: GOLD_CARDED
        trigger: "POST /um/providers/{id}/gold-card-evaluations (decision GRANTED)"
        actor: UMAdmin
        preconditions:
          - "Provider must not already be GOLD_CARDED (ERR_ALREADY_GOLD_CARDED)"
          - "gold_card_eligibility passes: rolling_determination_count >= 10 AND rolling_approval_rate >= 0.90 (ERR_GOLD_CARD_NOT_ELIGIBLE)"
        side_effects:
          - "gold_card_service_category := evaluation.service_category"
          - "ComplianceEvent GOLD_CARD_GRANTED created (provider_id)"
      - from: SUSPENDED
        to: GOLD_CARDED
        trigger: "POST /um/providers/{id}/gold-card-evaluations (decision REINSTATED)"
        actor: UMAdmin
        preconditions:
          - "gold_card_eligibility passes on freshly recomputed rolling stats (ERR_GOLD_CARD_NOT_ELIGIBLE)"
        side_effects:
          - "gold_card_service_category := evaluation.service_category"
          - "ComplianceEvent GOLD_CARD_GRANTED created (provider_id)"
      - from: GOLD_CARDED
        to: SUSPENDED
        trigger: "system (auto-suspend on stats recompute after a human-lane determination insert or determination void)"
        actor: system
        preconditions:
          - "rolling_determination_count >= 10 AND rolling_approval_rate < 0.90 after recompute"
        side_effects:
          - "gold_card_service_category := null"
          - "ComplianceEvent GOLD_CARD_SUSPENDED created (provider_id)"

  - entity: DelegationArrangement
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from AuditFinding create: open_deficiency_count reaches 3)"
        actor: system
        preconditions: ["open_deficiency_count >= 3 after the new finding is counted"]
        side_effects:
          - "ComplianceEvent DELEGATION_SUSPENDED created (request_id null, provider_id null, details reference arrangement)"
          - "Subsequent intake for this criteria set is rejected (ERR_DELEGATION_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade from AuditFinding close: open_deficiency_count drops below 3)"
        actor: system
        preconditions: ["open_deficiency_count < 3 after the close is counted"]
        side_effects: ["Intake for this criteria set unblocked"]

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /um/audit-findings/{id}/transition {to_status: CLOSED}"
        actor: ComplianceOfficer
        preconditions: ["Finding must be OPEN (ERR_FINDING_NOT_OPEN)"]
        side_effects:
          - "arrangement.open_deficiency_count recompute"
          - "If count drops below 3 and arrangement SUSPENDED: arrangement -> ACTIVE (cascade)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: guideline-transition-stale-criteria-set
    parent_entity: ClinicalCriteriaSet
    write_endpoint: "POST /um/guideline-versions/{id}/transition"
    occ_field: expected_criteria_set_version
    description: |
      Transitioning a guideline version (publish or retire) against a criteria
      set whose version has advanced since the client last observed it is
      rejected. This captures the case where another policy editor has just
      published or retired a version (which legitimately supersedes or changes
      the published set under the library rules) and the current writer's view
      of the criteria set is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: turnaround_due_at
    trigger: "request intake (request due_at); appeal filing (appeal due_at); breach detection on clock-set sweep and at determination issuance"
    algorithm: threshold
    formula: |
      request due_at = received_at + SLA_HOURS[urgency][criteria_set.line_of_business]
      appeal  due_at = received_at + APPEAL_SLA_HOURS
      A request is TAT-breached when the logical clock is STRICTLY greater than due_at
      while the request is undetermined (PENDED_REVIEW | ESCALATED_MD); at exactly
      due_at it is still compliant. An appeal is breached when clock > due_at while
      status IN {RECEIVED, IN_REVIEW}. A determination issued with issued_at > due_at
      marks the request breached at issuance.
    input_set: "undetermined requests / undecided appeals"
    constants:
      SLA_URGENT_MEDICARE_HOURS: 24
      SLA_URGENT_MEDICAID_HOURS: 24
      SLA_URGENT_COMMERCIAL_HOURS: 48
      SLA_STANDARD_MEDICARE_HOURS: 72
      SLA_STANDARD_MEDICAID_HOURS: 120
      SLA_STANDARD_COMMERCIAL_HOURS: 168
      APPEAL_SLA_HOURS: 720
    precision: "whole seconds; comparison is strict (clock > due_at breaches, clock == due_at does not)"

  - name: auto_approval_decision
    trigger: "request intake, synchronously inside POST /um/prior-auth-requests"
    algorithm: rule_selection
    formula: |
      gold_lane  = (provider.gold_card_status == "GOLD_CARDED")
                   AND (provider.gold_card_service_category == criteria_set.service_category)
      rules_lane = (pinned_guideline.auto_approve_eligible == true)
                   AND (intake_channel IN {"PORTAL", "EDI"})
                   AND (documentation_complete == true)
      if gold_lane:        status = AUTO_APPROVED, reason_code = GOLD_CARD_AUTO
      elif rules_lane:     status = AUTO_APPROVED, reason_code = AUTO_RULE
      else:                status = PENDED_REVIEW
      Evaluation order is pinned: gold_lane is evaluated first, so a request that
      satisfies both lanes records reason_code GOLD_CARD_AUTO.
    input_set: "the new request, its provider, its criteria set, the pinned guideline version"
    precision: "boolean; no rounding"

  - name: provider_approval_stats
    trigger: "determination issuance, determination void, appeal overturn cascade, gold-card evaluation (always recompute before deciding)"
    algorithm: aggregation
    formula: |
      inclusion set = determinations of this provider with
        status IN {FINAL, OVERTURNED} AND decided_by_role IN {CLINICAL_REVIEWER, MEDICAL_DIRECTOR}
        (SYSTEM_RULE auto-approvals and VOID determinations never count)
      effective_approval(d) = (d.status == FINAL AND d.outcome == APPROVED) OR (d.status == OVERTURNED)
      rolling variant: additionally require issued_at IN [now - 90*24h, now] (both bounds inclusive)
      lifetime variant: no time window
      count = |inclusion set|; approvals = |effective approvals|; rate = approvals / count (null when count == 0)
    input_set: "determinations joined through their requests' provider_id"
    constants:
      ROLLING_WINDOW_HOURS: 2160   # 90 days
    precision: "4 decimal places, round_half_up"
    variants:
      - name: rolling_window
        when: "gold-card grant/suspension decisions"
        difference: "restricts to determinations issued within the trailing 90-day window of the logical clock"
      - name: lifetime
        when: "oversight reporting fields on Provider"
        difference: "no time window; for identical data the two variants disagree whenever older determinations exist"

  - name: gold_card_eligibility
    trigger: "POST /um/providers/{id}/gold-card-evaluations"
    algorithm: threshold
    formula: |
      Step 1 (pinned evaluation order): recompute provider_approval_stats rolling_window
        FIRST, counting ONLY human-lane determinations (CLINICAL_REVIEWER / MEDICAL_DIRECTOR).
        This breaks the circular dependency in which gold-card auto-approvals would
        otherwise inflate the very rate used to keep the gold card.
      Step 2: eligible = (rolling_determination_count >= MIN_COUNT)
                       AND (rolling_approval_rate >= MIN_RATE)
      count == 0 => rate is null => not eligible.
    input_set: "rolling-window human-lane determinations of the provider"
    constants:
      MIN_COUNT: 10
      MIN_RATE: 0.90
    precision: "rate compared at 4 decimal places; >= is inclusive (exactly 0.9000 is eligible)"

  - name: appeal_overturn_rates
    trigger: "GET /um/metrics/overturn-analysis"
    algorithm: aggregation
    formula: |
      appeals_filed      = count of all appeals ever created (any status, including WITHDRAWN and in-flight)
      appeals_decided    = count of appeals with status IN {UPHELD, OVERTURNED}
      overturn_rate_decided = overturned_count / (upheld_count + overturned_count)   # null when 0
      overturn_rate_filed   = overturned_count / appeals_filed                       # null when 0
    input_set: "all Appeal rows"
    precision: "4 decimal places, round_half_up"
    variants:
      - name: decided_denominator
        when: "regulatory overturn analysis"
        difference: "denominator excludes withdrawn and undecided appeals"
      - name: filed_denominator
        when: "program-intake burden analysis"
        difference: "denominator includes every filed appeal, so for identical data it is strictly smaller whenever undecided or withdrawn appeals exist"

  - name: delegation_deficiency_threshold
    trigger: "AuditFinding create and close"
    algorithm: threshold
    formula: |
      open_deficiency_count = count of findings for the arrangement with
        status == OPEN AND finding_type IN {NOTICE_DEFICIENT, CRITERIA_MISAPPLIED, TAT_VIOLATION}
      on create: if open_deficiency_count >= SUSPEND_THRESHOLD -> arrangement ACTIVE -> SUSPENDED + DELEGATION_SUSPENDED event
      on close:  if open_deficiency_count <  SUSPEND_THRESHOLD and arrangement SUSPENDED -> SUSPENDED -> ACTIVE
    input_set: "findings of the arrangement"
    constants:
      SUSPEND_THRESHOLD: 3
    precision: "integer count; >= is inclusive (the third open deficiency suspends)"

  - name: notice_text_render
    trigger: "determination issuance (all lanes)"
    algorithm: template_render
    formula: |
      notice_text = "OUTCOME:" + outcome
                  + "|SERVICE:" + request.service_code
                  + "|REASON:" + reason_code
                  + "|CRITERIA:" + criteria_set.name + "@" + guideline_version.version_label
                  + "|ISSUED:" + issued_at (ISO8601 UTC, 3 fractional digits)
                  + "|APPEAL_BY:" + (issued_at + APPEAL_WINDOW_HOURS) (same format)
                  + "|DECIDED_BY:" + decided_by_role
    input_set: "the determination, its request, its criteria set, the pinned guideline version"
    constants:
      APPEAL_WINDOW_HOURS: 4320   # 180 days
    precision: "exact string; segment order and separators are part of the contract"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Required request-body fields present and well-typed; enums in domain; foreign-key body references exist (provider_id, criteria_set_id, member_ref non-empty, determination_id, supersedes_version_id exists); scheduled_end > scheduled_start; reason_code matches the decision mapping (APPROVE <-> MEDICAL_NECESSITY_MET, DENY <-> denial codes, omitted on ESCALATE/SEND_BACK); duplicate npi rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 5
    category: concurrency
    check: "expected_criteria_set_version must equal the criteria set's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /um/guideline-versions/{id}/transition"
    note: "OCC check is performed BEFORE any business validation on that endpoint"

  - priority: 6
    category: state
    check: "Target resource state preconditions: criteria set ACTIVE for intake and DRAFT/ACTIVE for guideline publish; no PUBLISHED guideline window covering received_at -> ERR_NO_ACTIVE_GUIDELINE (also set activation with zero published versions); request PENDED_REVIEW for reviewer-decision; request ESCALATED_MD for md-decision and P2P scheduling; request PENDED_REVIEW/ESCALATED_MD for withdraw; determination FINAL for appeal-create (else ERR_INVALID_APPEAL_STATE) and void (ERR_DETERMINATION_NOT_VOIDABLE); appeal in the required from-state (ERR_INVALID_APPEAL_STATE); conference SCHEDULED for resolve (ERR_P2P_NOT_RESOLVABLE); finding OPEN for close (ERR_FINDING_NOT_OPEN); arrangement ACTIVE for finding create (ERR_DELEGATION_SUSPENDED); provider not GOLD_CARDED for evaluation (ERR_ALREADY_GOLD_CARDED); valid from-states for criteria-set/guideline transitions (ERR_INVALID_CRITERIA_SET_TRANSITION / ERR_INVALID_GUIDELINE_TRANSITION)"
    error_id: "ERR_CRITERIA_SET_NOT_ACTIVE | ERR_NO_ACTIVE_GUIDELINE | ERR_REQUEST_NOT_PENDING | ERR_REQUEST_NOT_ESCALATED | ERR_REQUEST_NOT_WITHDRAWABLE | ERR_DETERMINATION_NOT_VOIDABLE | ERR_INVALID_APPEAL_STATE | ERR_P2P_NOT_RESOLVABLE | ERR_FINDING_NOT_OPEN | ERR_DELEGATION_SUSPENDED | ERR_ALREADY_GOLD_CARDED | ERR_INVALID_CRITERIA_SET_TRANSITION | ERR_INVALID_GUIDELINE_TRANSITION"
    http_status: 409
    applies_to: "stateful action endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties and due process: md-decision X-User-ID != escalated_by_user_id; appeal begin-review X-User-ID != determination.decided_by_user_id (when non-null); appeal decide by assigned reviewer_id; P2P resolve by scheduling md_user_id; MD DENY blocked while a conference is SCHEDULED"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_NOT_ASSIGNED_REVIEWER | ERR_NOT_ASSIGNED_MD | ERR_P2P_CONFERENCE_OUTSTANDING"
    http_status: 403
    applies_to: "md-decision, appeal begin-review/decide, P2P resolve"
    note: "ERR_P2P_CONFERENCE_OUTSTANDING is http 409; the other three are 403"

  - priority: 8
    category: business_referential
    check: "Cross-references must be internally consistent: supersedes_version_id must belong to the same criteria set; audit finding's determination must belong to a request whose criteria_set_id == arrangement.criteria_set_id; at most one DelegationArrangement per criteria set; at most one appeal per determination with status != WITHDRAWN"
    error_id: "ERR_SUPERSEDES_CROSS_SET | ERR_DELEGATION_SCOPE_MISMATCH | ERR_ARRANGEMENT_ALREADY_EXISTS | ERR_APPEAL_ALREADY_OPEN"
    http_status: 422
    applies_to: "guideline transition, finding create, arrangement create, appeal create"
    note: "ERR_ARRANGEMENT_ALREADY_EXISTS and ERR_APPEAL_ALREADY_OPEN are http 409; the other two are 422"

  - priority: 9
    category: business_constraint
    check: "Guideline retire blocked while any request pinned to it is PENDED_REVIEW or ESCALATED_MD"
    error_id: ERR_GUIDELINE_HAS_INFLIGHT_REQUESTS
    http_status: 409
    applies_to: "POST /um/guideline-versions/{id}/transition (to RETIRED)"

  - priority: 10
    category: business_temporal
    check: "Interval conflicts: guideline publish closed-window overlap within the set (excluding the superseded version); P2P half-open overlap among the same MD's SCHEDULED conferences (new.start < existing.end AND existing.start < new.end; touching endpoints allowed); at most one SCHEDULED conference per request"
    error_id: "ERR_GUIDELINE_WINDOW_OVERLAP | ERR_P2P_SCHEDULE_CONFLICT"
    http_status: 409
    applies_to: "guideline transition (to PUBLISHED), P2P schedule"

  - priority: 11
    category: business_threshold
    check: "Gold-card evaluation eligibility: recomputed rolling_determination_count >= 10 AND rolling_approval_rate >= 0.90"
    error_id: ERR_GOLD_CARD_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /um/providers/{id}/gold-card-evaluations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Providers ---
  - method: POST
    path: "/um/providers"
    description: "Register a provider organization"
    roles: [UMAdmin]
    code: 201
    input: [npi, name, "specialty?"]
    output: Provider
    side_effects: ["gold_card_status = NOT_GOLD_CARDED; all stat counters 0"]

  - method: GET
    path: "/um/providers/{id}"
    description: "Get a provider including recomputed-as-of-last-event stats"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/um/providers/{id}/gold-card-evaluations"
    description: "Run a gold-card eligibility evaluation for a service category; grants or reinstates the gold card on success"
    roles: [UMAdmin]
    code: 201
    input: [service_category]
    output: GoldCardEvaluation
    side_effects:
      - "recompute provider_approval_stats rolling_window at the logical clock"
      - "eligible -> Provider GOLD_CARDED (+category), event GOLD_CARD_GRANTED; decision REINSTATED when provider was SUSPENDED"
      - "already GOLD_CARDED -> ERR_ALREADY_GOLD_CARDED; ineligible -> ERR_GOLD_CARD_NOT_ELIGIBLE (no record created)"

  - method: GET
    path: "/um/providers/{id}/gold-card-evaluations"
    description: "List gold-card evaluations for a provider"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: "GoldCardEvaluation[]"
    side_effects: []

  - method: GET
    path: "/um/providers/{id}/compliance-events"
    description: "List compliance events scoped to a provider"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: ["event_type?"]
    output: "ComplianceEvent[]"
    side_effects: []

  # --- Criteria sets ---
  - method: POST
    path: "/um/criteria-sets"
    description: "Create a clinical criteria set"
    roles: [ClinicalPolicyEditor]
    code: 201
    input: [name, line_of_business, service_category]
    output: ClinicalCriteriaSet
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/um/criteria-sets/{id}"
    description: "Get a criteria set (carries the OCC version used by guideline transitions)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: ClinicalCriteriaSet
    side_effects: []

  - method: POST
    path: "/um/criteria-sets/{id}/transition"
    description: "Transition criteria set DRAFT -> ACTIVE (requires >= 1 PUBLISHED guideline version) or ACTIVE -> RETIRED"
    roles: [ClinicalPolicyEditor]
    code: 200
    input: [to_status]
    output: ClinicalCriteriaSet
    side_effects: ["increments ClinicalCriteriaSet.version by 1"]

  - method: POST
    path: "/um/criteria-sets/{id}/guideline-versions"
    description: "Create a DRAFT guideline version in the set"
    roles: [ClinicalPolicyEditor]
    code: 201
    input: [version_label, content, auto_approve_eligible, effective_from, "effective_until?", "supersedes_version_id?"]
    output: GuidelineVersion
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/um/guideline-versions/{id}"
    description: "Get a guideline version"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: GuidelineVersion
    side_effects: []

  - method: GET
    path: "/um/guideline-versions"
    description: "List/filter guideline versions (reverse-reachability for criteria_set_id and supersedes_version_id)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: ["criteria_set_id?", "supersedes_version_id?", "status?"]
    output: "GuidelineVersion[]"
    side_effects: []

  - method: POST
    path: "/um/guideline-versions/{id}/transition"
    description: "Publish (DRAFT -> PUBLISHED, with supersede/window semantics) or retire (DRAFT/PUBLISHED -> RETIRED) a guideline version; OCC-guarded on the owning criteria set"
    roles: [ClinicalPolicyEditor]
    code: 200
    input: [to_status, expected_criteria_set_version]
    output: GuidelineVersion
    side_effects:
      - "increments owning ClinicalCriteriaSet.version by 1"
      - "on publish with supersedes_version_id: superseded version -> SUPERSEDED and effective_until clamped to new.effective_from - 1s"

  # --- Prior auth requests ---
  - method: POST
    path: "/um/prior-auth-requests"
    description: "Intake a prior-auth request; pins the governing guideline version and runs auto_approval_decision synchronously"
    roles: [IntakeSpecialist]
    code: 201
    input: [provider_id, member_ref, criteria_set_id, service_code, urgency, intake_channel, documentation_complete]
    output: PriorAuthRequest
    side_effects:
      - "guideline_version_id pinned to the PUBLISHED version whose closed window contains received_at (selector: criteria_set match AND status PUBLISHED AND effective_from <= received_at AND (effective_until IS NULL OR received_at <= effective_until); ranking effective_from DESC, tie-break created_at DESC; empty -> ERR_NO_ACTIVE_GUIDELINE)"
      - "received_at from logical clock; due_at computed per turnaround_due_at"
      - "auto lane -> AUTO_APPROVED + Determination + AUTO_APPROVAL_FIRED event; else PENDED_REVIEW"
      - "arrangement SUSPENDED for this criteria set -> ERR_DELEGATION_SUSPENDED"

  - method: GET
    path: "/um/prior-auth-requests/{id}"
    description: "Get a request"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: PriorAuthRequest
    side_effects: []

  - method: GET
    path: "/um/prior-auth-requests"
    description: "List/filter requests (reverse-reachability for provider_id, criteria_set_id, guideline_version_id; supports pagination)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: ["provider_id?", "criteria_set_id?", "guideline_version_id?", "status?", "urgency?", "limit?", "offset?"]
    output: "PriorAuthRequest[]"
    side_effects: []

  - method: POST
    path: "/um/prior-auth-requests/{id}/withdraw"
    description: "Withdraw a pending/escalated request; cancels any SCHEDULED P2P conference"
    roles: [IntakeSpecialist]
    code: 200
    input: []
    output: PriorAuthRequest
    side_effects: ["status -> WITHDRAWN; SCHEDULED conferences -> CANCELLED"]

  - method: POST
    path: "/um/prior-auth-requests/{id}/reviewer-decision"
    description: "Clinical reviewer tier decision: APPROVE / DENY (creates Determination) or ESCALATE to the medical director"
    roles: [ClinicalReviewer]
    code: 200
    input: [decision, "reason_code?"]
    output: PriorAuthRequest
    side_effects:
      - "APPROVE/DENY -> Determination (CLINICAL_REVIEWER), determined_at, provider stats recompute + auto-suspend check, late-determination breach marking"
      - "ESCALATE -> status ESCALATED_MD, escalated_by_user_id := X-User-ID"

  - method: POST
    path: "/um/prior-auth-requests/{id}/md-decision"
    description: "Medical director tier decision: APPROVE / DENY (creates Determination) or SEND_BACK to the reviewer tier"
    roles: [MedicalDirector]
    code: 200
    input: [decision, "reason_code?"]
    output: PriorAuthRequest
    side_effects:
      - "APPROVE/DENY -> Determination (MEDICAL_DIRECTOR), determined_at, provider stats recompute + auto-suspend check, late-determination breach marking"
      - "DENY blocked while a P2P conference is SCHEDULED (ERR_P2P_CONFERENCE_OUTSTANDING)"
      - "SEND_BACK -> status PENDED_REVIEW, escalated_by_user_id := null"

  - method: POST
    path: "/um/prior-auth-requests/{id}/peer-to-peer-conferences"
    description: "Schedule a peer-to-peer conference for an escalated request (half-open interval per MD)"
    roles: [MedicalDirector]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: PeerToPeerConference
    side_effects: ["md_user_id := X-User-ID; status SCHEDULED"]

  - method: GET
    path: "/um/prior-auth-requests/{id}/peer-to-peer-conferences"
    description: "List P2P conferences for a request"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: "PeerToPeerConference[]"
    side_effects: []

  - method: POST
    path: "/um/peer-to-peer-conferences/{id}/resolve"
    description: "Resolve a scheduled conference as COMPLETED or NO_SHOW by its scheduling MD"
    roles: [MedicalDirector]
    code: 200
    input: [outcome]
    output: PeerToPeerConference
    side_effects: ["status -> COMPLETED | NO_SHOW; MD denial unblocked for the request"]

  # --- Determinations ---
  - method: GET
    path: "/um/determinations/{id}"
    description: "Get a determination (includes notice_text)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Determination
    side_effects: []

  - method: GET
    path: "/um/determinations"
    description: "List/filter determinations (reverse-reachability for request_id and guideline_version_id)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: ["request_id?", "guideline_version_id?"]
    output: "Determination[]"
    side_effects: []

  - method: POST
    path: "/um/determinations/{id}/void"
    description: "Void a FINAL determination with no open appeal; reverts the request and provider stats"
    roles: [UMAdmin]
    code: 200
    input: []
    output: Determination
    side_effects:
      - "status -> VOID; request reverts to PENDED_REVIEW (SYSTEM_RULE/CLINICAL_REVIEWER) or ESCALATED_MD (MEDICAL_DIRECTOR); determined_at := null"
      - "provider stats recompute excluding the voided row; event DETERMINATION_VOIDED"

  - method: POST
    path: "/um/determinations/{id}/appeals"
    description: "File an appeal against a FINAL determination"
    roles: [AppealsClerk]
    code: 201
    input: [appeal_reason]
    output: Appeal
    side_effects: ["status RECEIVED; received_at from clock; due_at = received_at + 720h"]

  - method: GET
    path: "/um/determinations/{id}/appeals"
    description: "List appeals for a determination"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/um/determinations/{id}/audit-findings"
    description: "List audit findings referencing a determination"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: "AuditFinding[]"
    side_effects: []

  # --- Appeals ---
  - method: GET
    path: "/um/appeals/{id}"
    description: "Get an appeal"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/um/appeals/{id}/begin-review"
    description: "Begin review; assigns the calling AppealsReviewer; segregation vs original decider enforced"
    roles: [AppealsReviewer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status -> IN_REVIEW; reviewer_id := X-User-ID"]

  - method: POST
    path: "/um/appeals/{id}/decide"
    description: "Decide an appeal UPHELD or OVERTURNED (overturn cascades to determination, request, provider stats, event)"
    roles: [AppealsReviewer]
    code: 200
    input: [outcome, "rationale?"]
    output: Appeal
    side_effects:
      - "decided_at := clock"
      - "OVERTURNED -> Determination FINAL -> OVERTURNED -> request DENIED -> APPROVED -> provider stats recompute + APPEAL_OVERTURNED event"

  - method: POST
    path: "/um/appeals/{id}/withdraw"
    description: "Withdraw an undecided appeal"
    roles: [AppealsClerk]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status -> WITHDRAWN"]

  # --- Delegation oversight ---
  - method: POST
    path: "/um/delegation-arrangements"
    description: "Create a delegation arrangement for a criteria set (at most one per set)"
    roles: [UMAdmin]
    code: 201
    input: [delegating_plan_name, criteria_set_id]
    output: DelegationArrangement
    side_effects: ["status ACTIVE; open_deficiency_count 0"]

  - method: GET
    path: "/um/delegation-arrangements/{id}"
    description: "Get a delegation arrangement"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: DelegationArrangement
    side_effects: []

  - method: GET
    path: "/um/delegation-arrangements"
    description: "List/filter delegation arrangements (reverse-reachability for criteria_set_id)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: ["criteria_set_id?"]
    output: "DelegationArrangement[]"
    side_effects: []

  - method: POST
    path: "/um/delegation-arrangements/{id}/audit-findings"
    description: "Record an audit finding against a determination in the arrangement's scope"
    roles: [ComplianceOfficer]
    code: 201
    input: [determination_id, finding_type]
    output: AuditFinding
    side_effects:
      - "status OPEN; open_deficiency_count recompute"
      - "count reaching 3 -> arrangement ACTIVE -> SUSPENDED + DELEGATION_SUSPENDED event"

  - method: GET
    path: "/um/delegation-arrangements/{id}/audit-findings"
    description: "List audit findings for an arrangement"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: "AuditFinding[]"
    side_effects: []

  - method: POST
    path: "/um/audit-findings/{id}/transition"
    description: "Close an OPEN finding; count dropping below 3 resumes a SUSPENDED arrangement"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status]
    output: AuditFinding
    side_effects: ["status -> CLOSED; open_deficiency_count recompute; possible arrangement resume cascade"]

  # --- Request-scoped audit ---
  - method: GET
    path: "/um/prior-auth-requests/{id}/compliance-events"
    description: "List compliance events scoped to a request"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: ["event_type?"]
    output: "ComplianceEvent[]"
    side_effects: []

  - method: GET
    path: "/um/compliance-events"
    description: "Query the audit log across all scopes (the only read path for events that carry neither request_id nor provider_id, e.g. DELEGATION_SUSPENDED)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: ["event_type?", "request_id?", "provider_id?"]
    output: "ComplianceEvent[]"
    side_effects: []

  # --- Metrics ---
  - method: GET
    path: "/um/metrics/overturn-analysis"
    description: "Overturn analysis aggregates across all appeals (both rate variants)"
    roles: [UMAdmin, ClinicalPolicyEditor, IntakeSpecialist, ClinicalReviewer, MedicalDirector, AppealsClerk, AppealsReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: { appeals_filed: integer, appeals_decided: integer, appeals_withdrawn: integer, overturned_count: integer, upheld_count: integer, overturn_rate_decided: "number|null", overturn_rate_filed: "number|null" }
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/um/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to wall-clock time before this endpoint is called. After setting, runs the TAT breach sweep: every undetermined request (PENDED_REVIEW | ESCALATED_MD) and every undecided appeal (RECEIVED | IN_REVIEW) whose due_at is strictly before the new clock is flagged is_tat_breached (sticky) and gains a TAT_BREACHED ComplianceEvent; already-flagged rows are skipped (idempotent sweep)."
    roles: [UMAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, requests_flagged: integer, appeals_flagged: integer }
    side_effects: ["logical clock := to_iso8601; breach sweep with TAT_BREACHED events"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/mistyped required field, enum outside domain, nonexistent body FK reference, scheduled_end <= scheduled_start, reason_code/decision mapping violation, duplicate npi" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_criteria_set_version does not match the criteria set's current version" }
  - { id: ERR_CRITERIA_SET_NOT_ACTIVE, http: 409, condition: "Intake references a criteria set that is not ACTIVE" }
  - { id: ERR_INVALID_CRITERIA_SET_TRANSITION, http: 409, condition: "Criteria set transition not allowed from current status" }
  - { id: ERR_NO_ACTIVE_GUIDELINE, http: 409, condition: "No PUBLISHED guideline version's closed window contains received_at at intake; or set activation attempted with zero PUBLISHED versions" }
  - { id: ERR_INVALID_GUIDELINE_TRANSITION, http: 409, condition: "Guideline transition not allowed from current status (including publish under a RETIRED set, or superseding a non-PUBLISHED version)" }
  - { id: ERR_SUPERSEDES_CROSS_SET, http: 422, condition: "supersedes_version_id belongs to a different criteria set" }
  - { id: ERR_GUIDELINE_WINDOW_OVERLAP, http: 409, condition: "Publish would create intersecting closed effective windows among PUBLISHED versions of the set (excluding the superseded version)" }
  - { id: ERR_GUIDELINE_HAS_INFLIGHT_REQUESTS, http: 409, condition: "Retire blocked: a request pinned to this version is PENDED_REVIEW or ESCALATED_MD" }
  - { id: ERR_REQUEST_NOT_PENDING, http: 409, condition: "reviewer-decision requires status PENDED_REVIEW" }
  - { id: ERR_REQUEST_NOT_ESCALATED, http: 409, condition: "md-decision or P2P scheduling requires status ESCALATED_MD" }
  - { id: ERR_REQUEST_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires status PENDED_REVIEW or ESCALATED_MD" }
  - { id: ERR_P2P_CONFERENCE_OUTSTANDING, http: 409, condition: "MD DENY blocked while a conference is SCHEDULED for the request" }
  - { id: ERR_P2P_SCHEDULE_CONFLICT, http: 409, condition: "New conference half-open interval intersects another SCHEDULED conference of the same MD, or the request already has a SCHEDULED conference" }
  - { id: ERR_P2P_NOT_RESOLVABLE, http: 409, condition: "resolve requires conference status SCHEDULED" }
  - { id: ERR_NOT_ASSIGNED_MD, http: 403, condition: "resolve caller is not the scheduling md_user_id" }
  - { id: ERR_DELEGATION_SUSPENDED, http: 409, condition: "Intake or finding-create blocked because the criteria set's delegation arrangement is SUSPENDED" }
  - { id: ERR_ARRANGEMENT_ALREADY_EXISTS, http: 409, condition: "A delegation arrangement already exists for this criteria set" }
  - { id: ERR_DELEGATION_SCOPE_MISMATCH, http: 422, condition: "Finding's determination does not belong to the arrangement's criteria set" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "Finding close requires status OPEN" }
  - { id: ERR_GOLD_CARD_NOT_ELIGIBLE, http: 422, condition: "Rolling determination count < 10 or rolling approval rate < 0.90 at evaluation" }
  - { id: ERR_ALREADY_GOLD_CARDED, http: 409, condition: "Evaluation attempted on a provider already GOLD_CARDED" }
  - { id: ERR_DETERMINATION_NOT_VOIDABLE, http: 409, condition: "Void requires status FINAL and no appeal in RECEIVED or IN_REVIEW" }
  - { id: ERR_INVALID_APPEAL_STATE, http: 409, condition: "Appeal action not allowed from current status (includes filing against a non-FINAL determination)" }
  - { id: ERR_APPEAL_ALREADY_OPEN, http: 409, condition: "Another appeal for the same determination exists with status RECEIVED, IN_REVIEW, UPHELD, or OVERTURNED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "MD deciding a case they escalated as reviewer, or appeal reviewer who issued the appealed determination" }
  - { id: ERR_NOT_ASSIGNED_REVIEWER, http: 403, condition: "Appeal decide caller is not the assigned reviewer_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UMAdmin
    description: "Vendor operations administrator: provider registry, delegation arrangements, gold-card evaluations, determination voids, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /um/providers"
      - "POST /um/providers/{id}/gold-card-evaluations"
      - "POST /um/delegation-arrangements"
      - "POST /um/determinations/{id}/void"
      - "POST /um/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: ClinicalPolicyEditor
    description: "Maintains the criteria library: criteria sets and guideline version lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /um/criteria-sets"
      - "POST /um/criteria-sets/{id}/transition"
      - "POST /um/criteria-sets/{id}/guideline-versions"
      - "POST /um/guideline-versions/{id}/transition"
    shared_operations: ["all GET endpoints"]

  - name: IntakeSpecialist
    description: "Request intake across channels; withdraws requests"
    identity: opaque
    exclusive_operations:
      - "POST /um/prior-auth-requests"
      - "POST /um/prior-auth-requests/{id}/withdraw"
    shared_operations: ["all GET endpoints"]

  - name: ClinicalReviewer
    description: "First clinical tier: approves, denies, or escalates pended requests"
    identity: opaque
    exclusive_operations:
      - "POST /um/prior-auth-requests/{id}/reviewer-decision"
    shared_operations: ["all GET endpoints"]

  - name: MedicalDirector
    description: "Second clinical tier: decides escalated cases, schedules and resolves peer-to-peer conferences; may not decide a case they escalated as reviewer"
    identity: opaque
    exclusive_operations:
      - "POST /um/prior-auth-requests/{id}/md-decision"
      - "POST /um/prior-auth-requests/{id}/peer-to-peer-conferences"
      - "POST /um/peer-to-peer-conferences/{id}/resolve"
    shared_operations: ["all GET endpoints"]

  - name: AppealsClerk
    description: "Files and withdraws appeals"
    identity: opaque
    exclusive_operations:
      - "POST /um/determinations/{id}/appeals"
      - "POST /um/appeals/{id}/withdraw"
    shared_operations: ["all GET endpoints"]

  - name: AppealsReviewer
    description: "Reviews and decides appeals; may not review a determination they issued"
    identity: opaque
    exclusive_operations:
      - "POST /um/appeals/{id}/begin-review"
      - "POST /um/appeals/{id}/decide"
    shared_operations: ["all GET endpoints"]

  - name: ComplianceOfficer
    description: "Delegation oversight: records and closes audit findings"
    identity: opaque
    exclusive_operations:
      - "POST /um/delegation-arrangements/{id}/audit-findings"
      - "POST /um/audit-findings/{id}/transition"
    shared_operations: ["all GET endpoints"]
