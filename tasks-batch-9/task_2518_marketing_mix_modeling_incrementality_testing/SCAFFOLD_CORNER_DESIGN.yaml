            - "After call 1, GET /mmm/markets/${mkt} shows held_out_population == 0 and GET /mmm/markets/${mkt2} shows held_out_population == 0."
            - "Call 2 returns 200 with data.status == CELLS_ASSIGNED, treatment_population 100000 and control_population 100000."
