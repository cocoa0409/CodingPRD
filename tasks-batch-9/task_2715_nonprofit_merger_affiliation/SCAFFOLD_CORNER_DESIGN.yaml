            - "RestrictedFund.${fund_u}.historic_dollar_value_cents == 62000000"
            - "RestrictedFund.${fund_u}.transfer_status == MODIFIED"
            - "RestrictedFund.${fund_u}.transferable_amount_cents == 4340000"
            - "Organization.${org_a}.restricted_corpus_cents == 62000000"

      - name: role_check_precedes_body_validation_which_precedes_existence
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_3_ERR_INVALID_REQUEST
          - validations.priority_5_ERR_RESTRUCTURING_NOT_FOUND
        distinguishing_aspect: |
          One request carries three defects at once - a forbidden role, a body missing
          the required summary field, and a restructuring_id that names nothing - and the
          ladder must return exactly ERR_ROLE_NOT_PERMITTED (403). Removing the role
          defect must then surface ERR_INVALID_REQUEST (400), and removing the body
          defect must finally surface ERR_RESTRUCTURING_NOT_FOUND (404). Any
          implementation that validates the body first, or that dereferences the FK
          before authorising, returns a different code for the very first call and leaks
          the existence of deals to a caller who may not touch them.
        test_recipe:
          setup:
            - "No entities are required; every reference below is deliberately unresolvable"
          setup_api_calls: []
          trigger:
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "3f9a7c21-5b6e-4d08-9a11-7c4e2b8d60f5", workstream: "FINANCE", severity: "HIGH", exposure_cents: 100000 }
              as: StrategyOfficer
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { e_role: $.data.error_id }
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "3f9a7c21-5b6e-4d08-9a11-7c4e2b8d60f5", workstream: "FINANCE", severity: "HIGH", exposure_cents: 100000 }
              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { e_body: $.data.error_id }
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "3f9a7c21-5b6e-4d08-9a11-7c4e2b8d60f5", workstream: "FINANCE", severity: "HIGH", summary: "Placeholder finding against a deal that does not exist", exposure_cents: 100000 }
              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { e_missing: $.data.error_id }
          assert:
            - "the first call returns HTTP status 403 with error ERR_ROLE_NOT_PERMITTED"
            - "the second call returns HTTP status 400 with error ERR_INVALID_REQUEST"
            - "the third call returns HTTP status 404 with error ERR_RESTRUCTURING_NOT_FOUND"
            - "every response carries a non-empty error_id and message and creates no DiligenceRequest"

      - name: deal_state_error_outranks_the_fiscal_floor_error_on_select_structure
        claim_type: priority_conflict
        grounds:
