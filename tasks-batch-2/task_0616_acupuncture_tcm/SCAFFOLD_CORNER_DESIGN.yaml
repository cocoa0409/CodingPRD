            - call: "POST /appointments/${ap}/cancel"
              payload: {}
              as: ClinicAdmin
              captures: { cs: $.data.clinical_status }
            - call: "GET /addons"
              payload: {}
              as: ClinicAdmin
          assert:
            - "Appointment.${ap}.clinical_status == CANCELLED; Patient.${pid}.strike_count == 0 (>24h lead, no strike)"
            - "Both add-ons status == VOIDED in the addons list"

