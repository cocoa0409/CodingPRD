              as: RetailerOwner
              as_user_id: "${owner_id}"
          assert:
            - "both creates are 201 and all three actions are 200"
            - "EquipmentOrder.${order_pos_id}: subtotal_cents == 185000, subsidy_cents == 0, net_equipment_cents == 185000, handling_fee_cents == 0, total_due_cents == 185000"
            - "EquipmentOrder.${order_paper_id}: subtotal_cents == 8000, subsidy_cents == 0, net_equipment_cents == 8000, handling_fee_cents == 1500, total_due_cents == 9500"
            - "EquipmentOrder.${order_pos_id}.status == FULFILLED with placed_at set to the logical clock"
            - "EquipmentOrder.${order_paper_id}.status == CANCELLED, cancel_reason_code == RETAILER_WITHDREW and placed_at == null"
            - "the filtered list returns total_count == 1 containing only ${order_pos_id}"

      - name: order_pricing_is_computed_at_draft_and_frozen_by_place_not_re_derived
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/equipment-orders/{orderId}/place
          - calculations.equipment_order_totals
          - errors.ERR_STORE_NOT_AUTHORIZED
        distinguishing_aspect: "place is a conditional action gated on Store.authorization_status, and its freeze is a snapshot, not a recomputation: an order drafted while the store was NOT_AUTHORIZED keeps subsidy_cents 0 and total_due_cents 42500 even after the store becomes AUTHORIZED, while an identical order drafted after authorization is fully subsidized to a total of 0."
        test_recipe:
          setup:
