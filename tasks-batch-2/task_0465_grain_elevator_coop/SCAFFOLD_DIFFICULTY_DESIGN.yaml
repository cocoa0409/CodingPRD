# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Expert band
# Grain Elevator & Marketing (Co-op) — depth index over the nine §0.5 rules.
# Every grounds[] ref resolves to SCAFFOLD.yaml §1.1–§1.7; every assert value
# is a literal pre-computed against the §1.3 formula and its constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: storage_charge_estimate_vs_actual_diverge_on_frozen_position
        grounds:
          - calculations.storage_charge
          - calculations.storage_charge.variants.estimate_forward_looking
          - calculations.storage_charge.variants.actual_chronological
          - entities.StoragePosition.fields.frozen_days
          - entities.Settlement.fields.storage_basis
          - state_machines.Settlement.DRAFT_to_SETTLED
        distinguishing_aspect: |
          On the SAME StoragePosition (entity domain: storage accrual on
          StoragePosition), ESTIMATE charges the full grace-end->today span
          (60 days -> 18.00) while ACTUAL subtracts frozen_days=20 (40 days ->
          12.00); the two storage-charge variants produce DIFFERENT dollars for
          identical bushels and clock.
        test_recipe:
          setup:
            - "CORN commodity (test_weight 56, base_moisture 15.0, shrink 1.4, drying 4)."
            - "Clock at default 2026-01-01T00:00:00Z; one clean 1000-bushel ticket graded DELAYED_PRICE so a StoragePosition is STORED with storage_start_date 2026-01-01."
            - "Position frozen 2026-01-01..2026-01-21 then unfrozen, banking frozen_days=20."
            - "A CASH contract priced at net_price 4.70 (board futures 4.80, basis -0.10); clock advanced to 2026-04-01 (60 calendar days past the 30-day grace end of 2026-01-31)."
            - "Two DRAFT settlements of 600 priced_bushels each against the same position+contract: one ESTIMATE, one ACTUAL."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Aaron Farm" }
              as: Merchandiser
              captures: { m_a_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_a_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_a_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_a_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_a_id: $.data.storage_position_id }
            - call: "POST /commodities/storage-positions/${pos_a_id}/freeze-charge"
              payload: {}
              as: Merchandiser
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-21T00:00:00Z" }
              as: Merchandiser
            - call: "POST /commodities/storage-positions/${pos_a_id}/unfreeze-charge"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_a_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_a_id: $.data.id }
            - call: "POST /commodities/contracts/${c_a_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_a_id}", storage_position_id: "${pos_a_id}", priced_bushels: 600, storage_basis: "ESTIMATE" }
              as: SettlementOfficer
              captures: { s_est_id: $.data.id }
          trigger:
            - call: "GET /commodities/settlements/${s_est_id}"
              payload: {}
              as: SettlementOfficer
              captures: { est_charge: $.data.storage_charge_dollars }
          assert:
            - "Settlement.${s_est_id}.storage_charge_dollars == 18.00"
            - "An ACTUAL settlement of 600 bushels on the same position computes storage_charge_dollars == 12.00 (frozen_days=20 subtracted), so ESTIMATE != ACTUAL by exactly 6.00."
            - "Settlement.${s_est_id}.gross_proceeds_dollars == 2820.00"

      - name: contract_net_price_basis_vs_hta_diverge_on_same_board_history
        grounds:
          - calculations.contract_net_price
          - calculations.contract_net_price.variants.basis_contract_pricing
          - calculations.contract_net_price.variants.hta_contract_pricing
          - entities.Contract.fields.futures_leg
          - entities.Contract.fields.basis_leg
          - state_machines.Contract.OPEN_to_PRICED
        distinguishing_aspect: |
          Entity domain is Contract pricing (distinct from storage accrual on
          StoragePosition). For the SAME board history (create board futures
          4.50/basis -0.30, fixing board futures 4.80/basis -0.10), a BASIS
          contract fixes the LATE futures_leg from the board -> net 4.50, while
          an HTA contract fixes the LATE basis_leg -> net 4.40; same prose, two
          algorithms, different net_price.
        test_recipe:
          setup:
            - "CORN commodity exists; first board posted futures 4.50 basis -0.30 (current at create)."
            - "A BASIS contract created with basis_leg -0.30 and an HTA contract created with futures_leg 4.50."
            - "A second board posted futures 4.80 basis -0.10, becoming current; both contracts fixed against it."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Beth Farm" }
              as: Merchandiser
              captures: { m_b_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.50, cash_basis: -0.30 }
              as: Merchandiser
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_b_id}", commodity_id: "${corn_id}", contract_type: "BASIS", contracted_bushels: 500, basis_leg: -0.30 }
              as: Merchandiser
              captures: { c_basis_id: $.data.id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_b_id}", commodity_id: "${corn_id}", contract_type: "HTA", contracted_bushels: 500, futures_leg: 4.50 }
              as: Merchandiser
              captures: { c_hta_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/contracts/${c_basis_id}/fix-price"
              payload: {}
              as: Merchandiser
              captures: { basis_net: $.data.net_price }
          trigger:
            - call: "POST /commodities/contracts/${c_hta_id}/fix-price"
              payload: {}
              as: Merchandiser
              captures: { hta_net: $.data.net_price }
          assert:
            - "Contract.${c_basis_id}.net_price == 4.5000 (futures_leg 4.80 from fixing board + basis_leg -0.30 from create)"
            - "Contract.${c_hta_id}.net_price == 4.4000 (futures_leg 4.50 from create + basis_leg -0.10 from fixing board)"
            - "Contract.${c_basis_id}.net_price != Contract.${c_hta_id}.net_price by exactly 0.1000"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a)/(b)/(c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: grade_in_nonlinear_dockage_then_shrink_mode_a
        grounds:
          - calculations.grade_in
          - entities.ScaleTicket.fields.net_dry_bushels
          - entities.ScaleTicket.fields.drying_charge_dollars
          - entities.Commodity.fields.shrink_pct_per_point
          - state_machines.ScaleTicket.WEIGHED_to_GRADED
        distinguishing_aspect: |
          Mode (a): grade_in is a >=3-input non-linear formula — dockage_pct,
          moisture_pct, and the Commodity shrink/test-weight constants interact
          multiplicatively (clean = net*(1-dockage); dry = clean*(1-shrink*points)),
          with a conditional max(0,...) branch on moisture. Inputs gross 58000 /
          tare 18000 / moisture 18.0 / dockage 1.5 uniquely yield net_dry_bushels
          674.0214 and drying_charge 80.88.
        test_recipe:
          setup:
            - "CORN commodity (test_weight 56, base_moisture 15.0, shrink 1.4, drying 4)."
            - "One WEIGHED ticket: gross 58000, tare 18000, moisture 18.0, dockage 1.5, DELAYED_PRICE."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Carl Farm" }
              as: Merchandiser
              captures: { m_c_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_c_id}", commodity_id: "${corn_id}", gross_weight_lbs: 58000, tare_weight_lbs: 18000, moisture_pct: 18.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 1.5 }
              as: GradeClerk
              captures: { tk_c_id: $.data.id }
          trigger:
            - call: "POST /commodities/scale-tickets/${tk_c_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { ndb: $.data.net_dry_bushels, dchg: $.data.drying_charge_dollars }
          assert:
            - "ScaleTicket.${tk_c_id}.net_weight_lbs == 40000"
            - "ScaleTicket.${tk_c_id}.clean_weight_lbs == 39400.0 (dockage 600 lbs removed first)"
            - "ScaleTicket.${tk_c_id}.moisture_points == 3.0"
            - "ScaleTicket.${tk_c_id}.wet_bushels == 703.5714"
            - "ScaleTicket.${tk_c_id}.net_dry_bushels == 674.0214"
            - "ScaleTicket.${tk_c_id}.drying_charge_dollars == 80.88"

      - name: patronage_floor_then_waterfall_remainder_mode_b
        grounds:
          - calculations.patronage_distribution
          - entities.PatronageAllocation.fields.cash_dollars
          - entities.PatronageAllocation.fields.equity_dollars
          - entities.Member.fields.net_priced_bushels
          - state_machines.PatronagePeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (b): nested rounding where order is PINNED — each member's cash is
          FLOORED to cents (ROUND_DOWN), then the residue between round(sum_alloc*pct)
          and sum(floored cash) is waterfalled whole to the lead member. With three
          members each at 1000 net_priced_bushels and pool 100000 / cash_pct 0.20,
          floor-per-member gives 6666.66*3 = 19999.98, target 20000.00, remainder
          0.02 -> lead member. 'Sum then round' would not floor and would not leave 0.02.
        test_recipe:
          setup:
            - "CORN commodity and a current board futures 4.80 basis -0.10 (cash net 4.70)."
            - "Three members A, B, C created in that order (created_at A<B<C)."
            - "Each member has exactly one clean 1000-bushel ticket graded DELAYED_PRICE, a CASH contract of 1000 bushels priced at 4.70, and one SETTLED settlement of 1000 priced_bushels -> Member.net_priced_bushels == 1000 each."
            - "An OPEN PatronagePeriod FY2026 with pool 100000 and qualified_cash_pct 0.20."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "A Farm" }
              as: Merchandiser
              captures: { m_a_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_a_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_a_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_a_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_a_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_a_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_a_id: $.data.id }
            - call: "POST /commodities/contracts/${c_a_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_a_id}", storage_position_id: "${pos_a_id}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_a_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_a_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_a_v: $.data.version }
            - call: "POST /commodities/settlements/${s_a_id}/post"
              payload: { expected_storage_position_version: "${pos_a_v}" }
              as: SettlementOfficer
            - call: "POST /commodities/members"
              payload: { name: "B Farm" }
              as: Merchandiser
              captures: { m_b_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_b_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_b_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_b_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_b_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_b_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_b_id: $.data.id }
            - call: "POST /commodities/contracts/${c_b_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_b_id}", storage_position_id: "${pos_b_id}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_b_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_b_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_b_v: $.data.version }
            - call: "POST /commodities/settlements/${s_b_id}/post"
              payload: { expected_storage_position_version: "${pos_b_v}" }
              as: SettlementOfficer
            - call: "POST /commodities/members"
              payload: { name: "C Farm" }
              as: Merchandiser
              captures: { m_cc_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_cc_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_cc_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_cc_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_cc_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_cc_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_cc_id: $.data.id }
            - call: "POST /commodities/contracts/${c_cc_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_cc_id}", storage_position_id: "${pos_cc_id}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_cc_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_cc_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_cc_v: $.data.version }
            - call: "POST /commodities/settlements/${s_cc_id}/post"
              payload: { expected_storage_position_version: "${pos_cc_v}" }
              as: SettlementOfficer
            - call: "POST /commodities/patronage-periods"
              payload: { label: "FY2026", pool_dollars: 100000, qualified_cash_pct: 0.20 }
              as: Merchandiser
              captures: { pp_id: $.data.id }
          trigger:
            - call: "POST /commodities/patronage-periods/${pp_id}/close"
              payload: {}
              as: Merchandiser
              captures: { total_bu: $.data.total_bushels }
          assert:
            - "PatronagePeriod.${pp_id}.total_bushels == 3000"
            - "Member.${m_a_id} allocation: allocation_dollars == 33333.33, cash_dollars == 6666.68, equity_dollars == 26666.65 (lead member absorbs the 0.02 remainder)"
            - "Member.${m_b_id} allocation: allocation_dollars == 33333.33, cash_dollars == 6666.66, equity_dollars == 26666.67"
            - "Member.${m_cc_id} allocation: allocation_dollars == 33333.33, cash_dollars == 6666.66, equity_dollars == 26666.67"
            - "Sum of cash_dollars across the three allocations == 20000.00 (remainder conserved, not dropped)"

      - name: contract_net_price_evaluation_order_pinned_mode_c
        grounds:
          - calculations.contract_net_price
          - entities.Contract.fields.futures_leg
          - entities.Contract.fields.basis_leg
          - entities.Contract.fields.net_price
          - entities.PriceBoard.fields.is_current
          - state_machines.Contract.OPEN_to_PRICED
        distinguishing_aspect: |
          Mode (c): the net_price has an evaluation-order dependency the scaffold
          PINS — the LATE leg must be read from the CURRENT PriceBoard at fixing
          time, not at create time. A BASIS contract created under board A
          (futures 4.50) then fixed after board B (futures 4.80) becomes current
          yields net 4.50, proving the late futures_leg is taken at fixing (4.80),
          not at create (4.50); evaluation order, not algebra, decides the value.
        test_recipe:
          setup:
            - "CORN commodity; board A posted futures 4.50 basis -0.30 (current)."
            - "A BASIS contract created with basis_leg -0.30 (futures_leg unset)."
            - "Board B posted futures 4.80 basis -0.10 — now the current board, superseding A."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Dale Farm" }
              as: Merchandiser
              captures: { m_d_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.50, cash_basis: -0.30 }
              as: Merchandiser
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_d_id}", commodity_id: "${corn_id}", contract_type: "BASIS", contracted_bushels: 500, basis_leg: -0.30 }
              as: Merchandiser
              captures: { c_d_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
          trigger:
            - call: "POST /commodities/contracts/${c_d_id}/fix-price"
              payload: {}
              as: Merchandiser
              captures: { dnet: $.data.net_price, dfut: $.data.futures_leg }
          assert:
            - "Contract.${c_d_id}.futures_leg == 4.80 (read from the CURRENT board B at fixing, not board A at create)"
            - "Contract.${c_d_id}.basis_leg == -0.30 (fixed at create)"
            - "Contract.${c_d_id}.net_price == 4.5000"
            - "Contract.${c_d_id}.status == PRICED"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: hedge_position_open_margincall_open_cycle
        grounds:
          - state_machines.HedgePosition.OPEN_to_MARGIN_CALL
          - state_machines.HedgePosition.MARGIN_CALL_to_OPEN
          - state_machines.HedgePosition.OPEN_to_OPEN
          - calculations.margin_mark_to_market
          - entities.HedgePosition.fields.status
        distinguishing_aspect: |
          HedgePosition is cyclic: OPEN -> MARGIN_CALL (mark drops equity below
          maintenance) -> OPEN (meet-call cures), and also self-loops OPEN -> OPEN
          on a benign mark. A SHORT CORN position of 3 contracts entered at 4.50
          marked to 4.80 enters MARGIN_CALL, and a deposit of 4500 returns it to
          OPEN — a genuine A->B->A loop on HedgePosition.
        test_recipe:
          setup:
            - "CORN commodity (futures_contract_bushels 5000)."
            - "A SHORT HedgePosition, 3 contracts, entry 4.50 -> posted_margin 6000, OPEN."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/hedge-positions"
              payload: { commodity_id: "${corn_id}", side: "SHORT", contracts: 3, entry_futures_price: 4.50 }
              as: RiskManager
              captures: { hp_id: $.data.id }
            - call: "POST /commodities/hedge-positions/${hp_id}/mark"
              payload: { mark_futures_price: 4.80 }
              as: RiskManager
              captures: { hp_call: $.data.margin_call_dollars }
            - call: "GET /commodities/hedge-positions/${hp_id}"
              payload: {}
              as: RiskManager
              captures: { hp_v: $.data.version }
          trigger:
            - call: "POST /commodities/hedge-positions/${hp_id}/meet-call"
              payload: { deposit_dollars: 4500, expected_hedge_position_version: "${hp_v}" }
              as: RiskManager
              captures: { hp_status: $.data.status }
          assert:
            - "After mark 4.80, HedgePosition.${hp_id}.status == MARGIN_CALL and margin_call_dollars == 4500.00 (equity 1500 < maintenance 4500)"
            - "After meet-call deposit 4500, HedgePosition.${hp_id}.status == OPEN (A->B->A cycle closed)"
            - "HedgePosition.${hp_id}.margin_call_dollars == 0 and posted_margin_dollars == 10500.00"

      - name: storage_position_stored_frozen_stored_cycle
        grounds:
          - state_machines.StoragePosition.STORED_to_CHARGE_FROZEN
          - state_machines.StoragePosition.CHARGE_FROZEN_to_STORED
          - entities.StoragePosition.fields.frozen_days
          - entities.StoragePosition.fields.status
        distinguishing_aspect: |
          A DIFFERENT entity (StoragePosition) carries its own cycle: STORED ->
          CHARGE_FROZEN (freeze-charge) -> STORED (unfreeze-charge), banking whole
          frozen days. Freezing at 2026-01-01 and unfreezing at 2026-01-21 returns
          status to STORED with frozen_days == 20 — an A->B->A loop distinct from
          the HedgePosition cycle.
        test_recipe:
          setup:
            - "CORN commodity; clock at default 2026-01-01T00:00:00Z."
            - "A clean 1000-bushel DELAYED_PRICE position STORED with storage_start_date 2026-01-01."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Ed Farm" }
              as: Merchandiser
              captures: { m_e_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_e_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_e_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_e_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_e_id: $.data.storage_position_id }
            - call: "POST /commodities/storage-positions/${pos_e_id}/freeze-charge"
              payload: {}
              as: Merchandiser
              captures: { frozen_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-21T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "POST /commodities/storage-positions/${pos_e_id}/unfreeze-charge"
              payload: {}
              as: Merchandiser
              captures: { fd: $.data.frozen_days, st: $.data.status }
          assert:
            - "After freeze-charge, StoragePosition.${pos_e_id}.status == CHARGE_FROZEN"
            - "After unfreeze-charge at 2026-01-21, StoragePosition.${pos_e_id}.status == STORED"
            - "StoragePosition.${pos_e_id}.frozen_days == 20"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settlement_post_depletes_position_cancels_receipt_depth3
        grounds:
          - state_machines.Settlement.DRAFT_to_SETTLED
          - state_machines.StoragePosition.STORED_to_DEPLETED
          - state_machines.WarehouseReceipt.ISSUED_to_CANCELLED
          - entities.StoragePosition.fields.bushels_available
          - entities.WarehouseReceipt.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single trigger (settlement post): posting the
          Settlement drives bushels_available to 0, which ITSELF transitions the
          StoragePosition to DEPLETED, which ITSELF cascades the ISSUED
          WarehouseReceipt to CANCELLED. Each hop is caused by the prior hop, not
          directly by the post.
        test_recipe:
          setup:
            - "CORN commodity; current board futures 4.80 basis -0.10."
            - "A clean 1000-bushel WAREHOUSE_RECEIPT position with an ISSUED WarehouseReceipt."
            - "A CASH contract for 1000 bushels priced at 4.70; a DRAFT settlement drawing all 1000 bushels."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Fay Farm" }
              as: Merchandiser
              captures: { m_f_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_f_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "WAREHOUSE_RECEIPT", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_f_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_f_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_f_id: $.data.storage_position_id }
            - call: "POST /commodities/warehouse-receipts"
              payload: { storage_position_id: "${pos_f_id}" }
              as: Merchandiser
              captures: { wr_id: $.data.id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_f_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_f_id: $.data.id }
            - call: "POST /commodities/contracts/${c_f_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_f_id}", storage_position_id: "${pos_f_id}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_f_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_f_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_f_v: $.data.version }
          trigger:
            - call: "POST /commodities/settlements/${s_f_id}/post"
              payload: { expected_storage_position_version: "${pos_f_v}" }
              as: SettlementOfficer
              captures: { s_f_status: $.data.status }
          assert:
            - "Settlement.${s_f_id}.status == SETTLED"
            - "StoragePosition.${pos_f_id}.bushels_available == 0 and StoragePosition.${pos_f_id}.status == DEPLETED"
            - "WarehouseReceipt.${wr_id}.status == CANCELLED (cascaded from the position depletion)"

      - name: patronage_close_creates_allocation_credits_member_depth2
        grounds:
          - state_machines.PatronagePeriod.OPEN_to_CLOSED
          - entities.PatronageAllocation.fields.allocation_dollars
          - entities.Member.fields.equity_credit_dollars
          - entities.Member.fields.cash_paid_dollars
          - calculations.patronage_distribution
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (patronage period close): closing
          the period creates a PatronageAllocation per member, and creating that
          allocation ITSELF credits Member.equity_credit_dollars and
          Member.cash_paid_dollars. Distinct propagation pattern from the
          settlement-post cascade.
        test_recipe:
          setup:
            - "CORN commodity, board futures 4.80 basis -0.10."
            - "A single member with one SETTLED settlement of 1000 priced_bushels -> net_priced_bushels 1000."
            - "An OPEN PatronagePeriod pool 50000, qualified_cash_pct 0.20."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "Gus Farm" }
              as: Merchandiser
              captures: { m_g_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_g_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_g_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_g_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_g_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_g_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_g_id: $.data.id }
            - call: "POST /commodities/contracts/${c_g_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_g_id}", storage_position_id: "${pos_g_id}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_g_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_g_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_g_v: $.data.version }
            - call: "POST /commodities/settlements/${s_g_id}/post"
              payload: { expected_storage_position_version: "${pos_g_v}" }
              as: SettlementOfficer
            - call: "POST /commodities/patronage-periods"
              payload: { label: "FY2026", pool_dollars: 50000, qualified_cash_pct: 0.20 }
              as: Merchandiser
              captures: { pp_g_id: $.data.id }
          trigger:
            - call: "POST /commodities/patronage-periods/${pp_g_id}/close"
