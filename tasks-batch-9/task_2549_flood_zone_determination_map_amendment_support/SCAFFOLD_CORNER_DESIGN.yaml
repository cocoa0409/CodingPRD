          assert:
            - "all eleven detail reads return 404, and the eleven error_id values are pairwise distinct: ERR_COMMUNITY_NOT_FOUND, ERR_LENDER_NOT_FOUND, ERR_MAP_PANEL_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_STRUCTURE_NOT_FOUND, ERR_LOAN_FOLIO_NOT_FOUND, ERR_DETERMINATION_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_ELEVATION_CERTIFICATE_NOT_FOUND, ERR_MAP_AMENDMENT_REQUEST_NOT_FOUND, ERR_COMPLIANCE_NOTICE_NOT_FOUND"
            - "every one of those responses carries a non-empty data.message alongside the error_id"
            - "all seven filtered list reads return 200 with total_count == 0 and an empty rows array - an unknown filter value is an empty result set, never a 404"
            - "the same unknown id used as a body FK on a write returns the FK owner's not-found error, e.g. POST /flood-zone/structures with property_id == that UUID returns ERR_PROPERTY_NOT_FOUND and POST /flood-zone/loan-folios with lender_id == that UUID returns ERR_LENDER_NOT_FOUND"
            - "GET /flood-zone/map-panels/99999999-9999-4999-8999-999999999999/impact-analysis returns ERR_MAP_PANEL_NOT_FOUND, so existence (priority 6) is checked before the PRELIMINARY-state gate"

