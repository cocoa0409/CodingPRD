            - "SAME DATE, DISJOINT INSTANTS: PF_B (2026-10-06T20:00Z..23:00Z) is refused with 409 ERR_PARTICIPATION_WINDOW_CONFLICT even though PF_A ended at 18:00Z the same day - two clear hours apart, but the same UTC calendar date"
