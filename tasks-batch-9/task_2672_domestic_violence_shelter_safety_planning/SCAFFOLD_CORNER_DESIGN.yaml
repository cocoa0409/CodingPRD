      - name: second_risk_assessment_on_the_same_call_rejected
        claim_type: idempotency
        grounds:
          - state_machines.HotlineCall.RECEIVED_to_RISK_ASSESSED
          - validations[priority 55]
        distinguishing_aspect: |
          Scoring is once-per-call: repeating the identical assessment body against a RISK_ASSESSED
          call is 409, leaving exactly one RiskAssessment row and the client's score untouched -
          the operation is guarded, not silently idempotent.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and Client C-2007 exist."
            - "The client's HotlineCall has been risk-assessed once (danger_score 48.4, MODERATE)."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-2007", legal_name: "Quin Adler", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "He has a gun in the truck." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { ra_id: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /hotline-calls/${call_id}/risk-assessments"
              payload: { limit: 10, offset: 0 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { only_ra: "$.data[0].id" }
          assert:
            - "HTTP 409 and ${err} == ERR_INVALID_STATE_TRANSITION"
            - "total_count == 1 and ${only_ra} == ${ra_id}: no second assessment row was written"
            - "HotlineCall.${call_id}.status == RISK_ASSESSED with version == 2 (unchanged by the rejected call)"
            - "Client.${client_id}.current_danger_score == 48.4, current_risk_band == MODERATE and version == 2"

      - name: dispose_branching_reaches_each_of_the_three_terminal_states
        claim_type: branching
        grounds:
          - state_machines.HotlineCall.transitions
          - complexity_profile.state_machine_shape
          - endpoints[POST /hotline-calls/{id}/dispose]
        distinguishing_aspect: |
          The three forks out of RISK_ASSESSED are mutually exclusive and each produces its own
          artifact set: SCREENING_REFERRED creates a ScreeningRequest and no plan,
          SAFETY_PLAN_ONLY creates a SafetyPlan and no request, RESOURCE_REFERRED creates neither
          and instead moves Client.resource_referral_count to 1.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and Shelter Cedar House with one STANDARD unit exist."
            - "Three clients C-2008, C-2009 and C-2010 each have one risk-assessed HotlineCall scoring 48.4 (MODERATE), so none of them is IMMINENT."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
