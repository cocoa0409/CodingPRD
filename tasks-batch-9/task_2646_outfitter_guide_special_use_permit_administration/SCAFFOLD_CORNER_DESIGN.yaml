      - name: reinstatement_reveals_the_point_gate_then_the_fee_gate_and_a_late_cure_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_POINTS_THRESHOLD_UNRESOLVED]
          - errors[ERR_CURE_DEADLINE_PASSED]
          - errors[ERR_FEE_BALANCE_OUTSTANDING]
          - state_machines.Permit.transitions[SUSPENDED->ACTIVE]
          - validations.priority_12_intra_tier_order
        distinguishing_aspect: |
          Reinstatement is a four-gate ladder and the ladder is climbed one rung at a time: while the
          point total is at 12 the request fails on the constraint tier and never reaches the fiscal
          tier, and appealing the action does NOT unwind that — an APPEALED action keeps contributing
          its points, so the identical rejection repeats. Only a RESCINDED decision drops the total,
          and the very next attempt exposes the fiscal rung, which must be the FEE error rather than
          the insurance or bond error because the pinned priority-12 order puts insurance and bond
          first and both of them pass. The late cure shows the deadline is inclusive on the wrong side
          of the clock: one day past cure_deadline_date the correction is refused outright.
        test_recipe:
          setup:
            - "Alpine holds an ACTIVE permit for 200 service days on BRW-01: approved 2027 plan, indemnification acknowledged, gap-free 100000000-cent endorsed GENERAL_LIABILITY coverage, a 1000000-cent bond and two authorized guides worth 16 client slots"
            - "at clock 2027-06-15 one use report is accepted, creating a PROVISIONAL assessment with balance_due_cents 60000"
            - "a MAJOR/SUSPENSION action (10 points) and a MINOR/WARNING action (2 points), both with cure_deadline_date 2027-07-31, drive the total to 12 and suspend the permit"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
