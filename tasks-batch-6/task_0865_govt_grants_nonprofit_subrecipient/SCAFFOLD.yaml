    code: 201
    input: [nonprofit_id, project_title, requested_amount_cents, proposed_period_start, proposed_period_end, indirect_method, "negotiated_indirect_rate?"]
    output: Application
    side_effects: ["Application created in DRAFT"]
  - method: GET
    path: "/applications"
    description: "List applications; filter by nofo_id and/or nonprofit_id (reverse reachability for both FKs)."
    roles: [ProgramOfficer, GrantsManager, Subrecipient, Panelist]
    code: 200
    input: ["nofo_id?", "nonprofit_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/applications/{id}"
    description: "Fetch an application."
    roles: [ProgramOfficer, GrantsManager, Subrecipient, Panelist]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit (DRAFT->SUBMITTED) or resubmit (REVISION_REQUESTED->SUBMITTED)."
    roles: [Subrecipient]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/applications/{id}/start-review"
    description: "Move a submitted application into review (SUBMITTED->UNDER_REVIEW)."
    roles: [ProgramOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/applications/{id}/request-revision"
    description: "Send an application back for revision (UNDER_REVIEW->REVISION_REQUESTED)."
    roles: [ProgramOfficer]
    code: 200
    input: ["revision_note?"]
    output: Application
    side_effects: []
