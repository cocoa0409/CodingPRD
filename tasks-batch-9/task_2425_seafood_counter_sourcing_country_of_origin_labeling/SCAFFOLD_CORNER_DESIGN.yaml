              as_user_id: "officer-claim-2"
              captures: { e_eligible: $.data.error_id }
            - call: "POST /seafood-ops/certifications/${cert_b}/review"
              payload: { decision: "REJECT", review_note: "species is not enrolled in a counter claim program" }
              as: ComplianceOfficer
              as_user_id: "officer-claim-2"
          assert:
            - "trigger call 1 returns HTTP 422 with ${e_eligible} == ERR_SPECIES_NOT_CLAIM_ELIGIBLE"
            - "SustainabilityCertification.${cert_a}.status == PENDING_REVIEW and review_note == null"
            - "trigger call 2 returns HTTP 200 with SustainabilityCertification.${cert_b}.status == REVOKED"
            - "SustainabilityCertification.${cert_b}.review_note == \"species is not enrolled in a counter claim program\""

      - name: weight_ceilings_on_sales_and_shrink_are_enforced_against_remaining
        claim_type: aggregate_validation
        grounds:
          - validations[priority=50]
          - validations[priority=51]
          - errors.ERR_INSUFFICIENT_REMAINING_WEIGHT
          - errors.ERR_SHRINK_EXCEEDS_REMAINING
          - state_machines.SupplierLot.intake_status.CASED_to_DEPLETED
        distinguishing_aspect: |
          Both ceilings float on remaining_weight_kg as it is consumed, not on
          received_weight_kg: after 4.000 kg is sold from a 10.000 kg lot, 6.001 kg of sales and
          6.500 kg of shrink are both refused while 6.000 kg of either is accepted, and posting
          that shrink drives remaining to exactly 0.000, which deplete-cascades the lot and
          withdraws its label.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod SupplierLot of 10.000 kg cased into slot 1 with a PUBLISHED CaseLabel"
