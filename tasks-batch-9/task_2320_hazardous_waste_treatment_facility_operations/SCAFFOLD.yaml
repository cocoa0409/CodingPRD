# =============================================================================
# §1.7 RBAC Table
# =============================================================================
roles:
  - name: PlatformAdmin
    identity: opaque
    description: "Registry operator: creates facilities, generators and permitted units; reads everything; signs nothing"
    exclusive_operations:
      - "POST /tsdf/facilities"
    shared_operations:
      - "POST /tsdf/generators, POST /tsdf/storage-units"
      - "Every GET in §1.5 except the Generator-scoped sub-resources"
  - name: ComplianceManager
    identity: opaque
    description: "Facility compliance officer: assurance instruments, generator standing, profile suspension, discrepancy resolution, container condition, inspections, repair orders, LDR verification and permit renewal filing"
    exclusive_operations:
      - "POST /tsdf/facilities/{id}/permit-renewal-request"
      - "POST /tsdf/financial-assurance-instruments"
      - "POST /tsdf/financial-assurance-instruments/{id}/cancel"
      - "POST /tsdf/generators/{id}/status"
      - "POST /tsdf/waste-profiles/{id}/status"
      - "POST /tsdf/storage-units/{id}/status"
      - "POST /tsdf/manifests/{id}/discrepancy-resolution"
      - "POST /tsdf/containers/{id}/compliance-state"
      - "POST /tsdf/treatment-batches/{id}/ldr-verification"
    shared_operations:
      - "POST /tsdf/generators, POST /tsdf/storage-units, POST /tsdf/waste-profiles"
      - "POST /tsdf/inspection-events, POST /tsdf/emission-repair-orders/{id}/actions, POST /tsdf/compliance-findings/{id}/status"
      - "Reads across the facility"
  - name: ReceivingClerk
    identity: opaque
    description: "Receiving dock: manifest receipt, certification, container creation and custody moves"
    exclusive_operations:
      - "POST /tsdf/manifests/{id}/receive"
      - "POST /tsdf/manifests/{id}/certify"
      - "POST /tsdf/containers"
    shared_operations:
      - "POST /tsdf/manifests, POST /tsdf/containers/{id}/custody-state"
      - "Reads of manifests, lines, containers, units, profiles and generators"
  - name: WasteApprovalChemist
    identity: opaque
    description: "Laboratory and approval authority: records verification samples and signs profile decisions, subject to segregation of duties"
    exclusive_operations:
      - "POST /tsdf/waste-profiles/{id}/samples"
      - "POST /tsdf/waste-profiles/{id}/decision"
    shared_operations:
      - "Reads of profiles, samples and generators"
  - name: TreatmentOperator
    identity: opaque
    description: "Treatment floor: schedules and runs batches, empties treated containers, performs repair attempts"
    exclusive_operations:
      - "POST /tsdf/treatment-batches"
      - "POST /tsdf/treatment-batches/{id}/operations"
    shared_operations:
      - "POST /tsdf/containers/{id}/custody-state, POST /tsdf/emission-repair-orders/{id}/actions"
      - "Reads of units, containers, batches, inspections and repair orders"
  - name: RegulatoryInspector
    identity: opaque
    description: "Regulator: cites findings, decides permit renewals, closes findings, may inspect"
    exclusive_operations:
      - "POST /tsdf/facilities/{id}/permit-decision"
      - "POST /tsdf/compliance-findings"
    shared_operations:
      - "POST /tsdf/inspection-events, POST /tsdf/compliance-findings/{id}/status"
      - "Reads across facilities, units, batches, findings and assurance"
  - name: Generator
    identity: "entity_backed:Generator"
    description: "Offsite generator acting for itself: X-User-ID must equal the Generator.id, and every row it addresses must carry that generator_id"
    exclusive_operations:
      - "POST /tsdf/waste-profiles/{id}/submit"
    shared_operations:
      - "POST /tsdf/waste-profiles, POST /tsdf/manifests"
      - "GET /tsdf/generators/{id}, GET /tsdf/generators/{id}/reliability-score, GET /tsdf/waste-profiles/{id}, GET /tsdf/waste-profiles, GET /tsdf/waste-profiles/{id}/samples, GET /tsdf/waste-profiles/{id}/manifest-lines, GET /tsdf/manifests/{id}, GET /tsdf/manifests, GET /tsdf/manifests/{id}/lines — all narrowed to its own generator_id"

segregation_of_duties:
  - "The X-User-ID that records the latest ProfileSample may not sign that profile's decision (both callers are WasteApprovalChemist)"
  - "The X-User-ID that completes a TreatmentBatch (TreatmentOperator) may not sign its LDR verification (ComplianceManager) — enforced on the user id, not on the role"
