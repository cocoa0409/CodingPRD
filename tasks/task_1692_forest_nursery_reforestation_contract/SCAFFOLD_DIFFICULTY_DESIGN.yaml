        grounds:
          - validations[priority=5]
          - validations[priority=21]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ALLOCATION_EXCEEDS_AVAILABLE]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: allocating 99999999 seedlings against a CANCELLED order
          violates both the from-state precondition and the available-quantity cap; priority 5 state wins
          with ERR_INVALID_STATE (409), not ERR_ALLOCATION_EXCEEDS_AVAILABLE.
