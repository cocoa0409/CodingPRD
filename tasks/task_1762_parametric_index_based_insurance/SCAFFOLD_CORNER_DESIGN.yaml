  # ===========================================================================
  # Excluded stubs — corners already covered by §1.8 difficulty instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_stub_dispute_cycle
        claim_type: cyclic
        grounds: [state_machines.DisputeCase]
        excluded_because:
          difficulty_instance: dispute_case_cyclic_open_awaiting_open
          rationale: "The OPEN -> AWAITING_CUSTOMER -> OPEN loop is exercised end-to-end by the named §1.8 instance."

      - name: corner_stub_parallel_policy_dimensions
        claim_type: parallel
        grounds: [state_machines.ParametricPolicy, state_machines.ParametricPolicy_settlement_posture]
        excluded_because:
          difficulty_instance: parametric_policy_parallel_dimensions_independent
          rationale: "Parallel lifecycle x posture dims, including the PAYMENT_PENDING cancel guard, asserted there."

      - name: corner_stub_annulment_compensation_cascade
        claim_type: compensation
        grounds: [state_machines.TriggerEvent.VERIFIED_to_ANNULLED]
        excluded_because:
          difficulty_instance: observation_revision_annuls_event_cascades_claims_and_posture
          rationale: "Annulment cascade (event -> claims -> posture) with late-revision trigger is the depth-3 cascade instance."

      - name: corner_stub_blacklist_cascade
        claim_type: cross_entity
        grounds: [state_machines.Policyholder.ACTIVE_to_BLACKLISTED]
        excluded_because:
          difficulty_instance: blacklist_cascades_claims_voided
          rationale: "Conditional cascade (GENERATED/ADJUSTED void; APPROVED spared) asserted there."

      - name: corner_stub_treaty_exhaustion_boundary
        claim_type: threshold_boundary
        grounds: [state_machines.ReinsuranceTreaty.ACTIVE_to_EXHAUSTED]
        excluded_because:
          difficulty_instance: treaty_exhaustion_exact_limit_boundary
          rationale: "Exact-limit EXHAUSTED flip and zero-cession follow-on asserted there."

      - name: corner_stub_invoice_conservation
        claim_type: compensating_invariant
        grounds: [state_machines.PremiumInvoice]
        excluded_because:
          difficulty_instance: invoice_payment_conservation_partial_plus_final_equals_total
          rationale: "Partial/final payment conservation and overpayment rejection covered there."

  - section: calculations
    instances:
      - name: corner_stub_dual_variant_payout
        claim_type: variant_divergence
        grounds: [calculations.provisional_payout, calculations.final_payout]
        excluded_because:
          difficulty_instance: payout_provisional_forward_vs_final_chronological_capped
          rationale: "Provisional 1,000,000 vs capped final 0 divergence asserted with literal values."

      - name: corner_stub_cession_rounding
        claim_type: precision
        grounds: [calculations.cession_allocation]
        excluded_because:
          difficulty_instance: cession_waterfall_mode_b_rounding_order
          rationale: "Per-treaty-then-sum rounding with per-treaty recovered_to_date literals covered there."

      - name: corner_stub_premium_branching
        claim_type: correct_result
        grounds: [calculations.premium_pricing]
        excluded_because:
          difficulty_instance: premium_pricing_mode_a_multibranch_formula
          rationale: "ADMITTED vs SURPLUS branch divergence on identical inputs covered there; DERIVATIVE zero-tax covered by corner instance premium_derivative_contract_zero_tax."

      - name: corner_stub_tier_inclusive_boundary
        claim_type: threshold_boundary
        grounds: [calculations.max_tier_breached]
        excluded_because:
          difficulty_instance: threshold_inclusive_boundary_at_exact_tier_value
          rationale: "BELOW inclusive boundary at exactly 30mm -> tier 2 covered there; ABOVE boundary covered by corner strike_direction_above_breach_semantics."

  - section: validations
    instances:
      - name: corner_stub_exposure_vs_premium_priority
        claim_type: priority_conflict
        grounds:
