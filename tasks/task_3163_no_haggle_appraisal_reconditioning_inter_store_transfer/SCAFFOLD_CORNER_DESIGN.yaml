            - call: "GET /v1/vehicles/${veh_a}"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/vehicles/${veh_a}"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/vehicles/${veh_a}"
              payload: {}
              as: StoreManager
              as_user_id: "${mgr1}"
          assert:
            - "days_in_inventory == 0 at 2026-09-01, == 29 at 2026-09-30, == 30 at 2026-10-01"
            - "inventory_acquired_at stays 2026-09-01T00:00:00Z throughout (no return occurred)"

