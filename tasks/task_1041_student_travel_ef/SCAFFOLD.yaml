    roles: [Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: SupplierBooking[]
    side_effects: []

  - method: POST
    path: "/supplier-bookings"
    description: "Hold a supplier service window for a departure (half-open overlap check)."
    roles: [Operator]
    code: 201
    input: [departure_id, supplier_id, service_window_start, service_window_end, room_block, cost_cents]
    output: SupplierBooking
    side_effects: []

  - method: GET
    path: "/supplier-bookings/{id}"
    description: "Fetch one supplier booking."
    roles: [Operator]
    code: 200
    input: []
    output: SupplierBooking
    side_effects: []

  - method: POST
    path: "/supplier-bookings/{id}/confirm"
    description: "HELD -> CONFIRMED (departure must be GUARANTEED)."
    roles: [Operator]
    code: 200
    input: []
    output: SupplierBooking
    side_effects: []

  - method: POST
    path: "/supplier-bookings/{id}/cancel"
    description: "HELD -> CANCELLED; releases the occupied window."
    roles: [Operator]
    code: 200
    input: []
    output: SupplierBooking
    side_effects: ["releases [service_window_start, service_window_end)"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Operator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent deadline/window/refund-tier evaluations use this instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not one of {Operator, GroupLeader, Traveler}"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for endpoint, or entity_backed owner mismatch"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, or illegal enum value"
  - id: ERR_TOUR_NOT_FOUND
    http: 404
    condition: "tour_id does not resolve"
  - id: ERR_GROUP_LEADER_NOT_FOUND
    http: 404
    condition: "group_leader_id does not resolve"
  - id: ERR_DEPARTURE_NOT_FOUND
    http: 404
    condition: "departure id/departure_id does not resolve"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment id/enrollment_id does not resolve"
  - id: ERR_PAYMENT_PLAN_NOT_FOUND
    http: 404
    condition: "payment_plan_id does not resolve"
  - id: ERR_PERMISSION_FORM_NOT_FOUND
    http: 404
    condition: "permission form id does not resolve"
  - id: ERR_ROOMING_NOT_FOUND
    http: 404
    condition: "rooming assignment id does not resolve"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "supplier_id does not resolve"
  - id: ERR_SUPPLIER_BOOKING_NOT_FOUND
    http: 404
    condition: "supplier booking id does not resolve"
  - id: ERR_CHAPERONE_NOT_FOUND
    http: 404
    condition: "chaperone id does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a state permitting the requested transition (generic state precondition)"
  - id: ERR_DEPARTURE_NOT_OPEN
    http: 409
    condition: "enrollment confirm requires parent departure in {OPEN, GUARANTEED}"
  - id: ERR_ENROLLMENT_CLOSED
    http: 422
    condition: "POST /enrollments after departure.enrollment_deadline"
  - id: ERR_DEPARTURE_FULL
    http: 409
    condition: "POST /enrollments when departure.available_seats < 1"
  - id: ERR_ROOM_FULL
    http: 409
    condition: "rooming member add/finalize would exceed room capacity"
  - id: ERR_ROOMING_GENDER_MISMATCH
    http: 422
    condition: "member Enrollment.traveler_gender != room_gender"
  - id: ERR_DOCS_INCOMPLETE
    http: 409
    condition: "rooming finalize with a member lacking an APPROVED permission form"
  - id: ERR_SUPPLIER_DOUBLE_BOOKED
    http: 409
    condition: "supplier booking window overlaps an existing non-CANCELLED window on the same supplier (half-open)"
  - id: ERR_CHAPERONE_UNAVAILABLE
    http: 409
    condition: "same-email chaperone already serving an overlapping/buffer-adjacent departure"
  - id: ERR_GUARANTEE_NOT_MET
    http: 409
    condition: "guarantee attempted below min_to_guarantee enrollments"
  - id: ERR_NOT_ENOUGH_CHAPERONES
    http: 409
    condition: "guarantee attempted with fewer CONFIRMED chaperones than ceil(active_enrollment_count / chaperone_ratio)"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "payment amount_cents exceeds remaining balance (total_cents - amount_paid_cents)"
  - id: ERR_REBOOK_TARGET_INVALID
    http: 409
    condition: "rebook target departure not in {OPEN, GUARANTEED} or has no available seats"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_enrollment_version does not match current Enrollment.version on POST /payment-plans"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Operator
    description: "Tour-operator staff: manage catalog (tours, suppliers, bookings), departures lifecycle, reviews, refunds, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /tours"
      - "POST /departures"
      - "POST /departures/{id}/open"
      - "POST /departures/{id}/guarantee"
      - "POST /departures/{id}/depart"
      - "POST /departures/{id}/cancel"
      - "POST /group-leaders"
      - "POST /permission-forms/{id}/review"
      - "POST /suppliers"
      - "POST /supplier-bookings"
      - "POST /supplier-bookings/{id}/confirm"
      - "POST /supplier-bookings/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/confirm"
      - "POST /enrollments/{id}/cancel"
      - "POST /enrollments/{id}/rebook"
      - "POST /payment-plans"
      - "POST /payments"
      - "POST /permission-forms"
      - "POST /permission-forms/{id}/submit"
      - "POST /chaperones"
      - "POST /rooming-assignments"
      - "POST /rooming-assignments/{id}/members"
      - "POST /rooming-assignments/{id}/finalize"
      - "GET (all read endpoints)"

  - name: GroupLeader
    description: "Teacher who owns a departure's roster: enroll travelers, manage chaperones and rooming, set up payment plans."
    identity: "entity_backed:GroupLeader"
    exclusive_operations: []
    shared_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/confirm"
      - "POST /enrollments/{id}/cancel"
      - "POST /enrollments/{id}/rebook"
      - "POST /payment-plans"
      - "POST /payments"
      - "POST /permission-forms"
      - "POST /permission-forms/{id}/submit"
      - "POST /chaperones"
      - "POST /rooming-assignments"
      - "POST /rooming-assignments/{id}/members"
      - "POST /rooming-assignments/{id}/finalize"
      - "GET departures/enrollments/plans/forms (own roster)"
    note: "Ownership: may act only where departure.group_leader_id == X-User-ID (directly or via the resource's departure)."

  - name: Traveler
    description: "Student/parent acting on their own enrollment: pay, submit permission form, cancel."
    identity: "entity_backed:Enrollment"
    exclusive_operations: []
    shared_operations:
      - "POST /payments"
      - "POST /permission-forms"
      - "POST /permission-forms/{id}/submit"
      - "POST /enrollments/{id}/cancel"
      - "GET own enrollment/plan/form"
    note: "Ownership: X-User-ID == enrollment.id; for POST /payments and POST /permission-forms the referenced plan/form must resolve to that enrollment."
