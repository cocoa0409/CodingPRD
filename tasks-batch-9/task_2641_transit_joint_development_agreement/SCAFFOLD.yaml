  - error_id: ERR_STAGING_WINDOW_NOT_REQUESTED
    http_status: 409
    category: state
    message_template: "Staging window is in status {status}; REQUESTED is required to decide it"
    trigger: "POST /jda/staging-windows/{id}/decision on a window that is already decided"
  - error_id: ERR_STAGING_WINDOW_NOT_CLOSABLE
    http_status: 409
    category: state
    message_template: "Staging window is in status {status}; APPROVED or SUSPENDED is required to close it"
    trigger: "POST /jda/staging-windows/{id}/close on a REQUESTED, REJECTED or already CLOSED window"

  - error_id: ERR_DEVELOPER_DEBARRED
    http_status: 409
    category: business_safety
    message_template: "Developer {id} has debarment_status {status} and may not participate"
    trigger: "Proposal submission, award or agreement drafting naming a SUSPENDED or DEBARRED developer"
  - error_id: ERR_AFFORDABLE_MINIMUM_NOT_MET
    http_status: 422
    category: business_safety
    message_template: "Affordable share {actual} is below the required minimum {required}"
    trigger: "Proposal affordable_pct below the solicitation minimum, or an agreement whose committed affordable share is below it"
  - error_id: ERR_JOINT_USE_NOT_COMMITTED
    http_status: 422
    category: business_safety
    message_template: "This solicitation requires a joint use commitment"
    trigger: "joint_use_committed omitted or false while Solicitation.joint_use_required is true"
  - error_id: ERR_VALUATION_NOT_CERTIFIED
    http_status: 409
    category: business_referential
    message_template: "Valuation {id} is in status {status}; CERTIFIED is required"
    trigger: "Submit-for-review backed by a DRAFT or SUPERSEDED valuation, or certification attempted on a valuation that is not DRAFT"
  - error_id: ERR_VALUATION_SITE_MISMATCH
    http_status: 422
    category: business_referential
    message_template: "Valuation {valuation_id} belongs to site {valuation_site_id}, not {site_id}"
    trigger: "POST /jda/agreements whose valuation or proposal belongs to a different site than site_id"
  - error_id: ERR_NEGOTIATION_PERIOD_EXPIRED
    http_status: 409
    category: business_referential
    message_template: "No live exclusive negotiation period covers proposal {proposal_id}"
    trigger: "Agreement drafting or submit-for-review while the proposal's period is EXPIRED, TERMINATED or past its end_date"
  - error_id: ERR_FACILITY_REPLACEMENT_INCOMPLETE
    http_status: 409
    category: business_referential
    message_template: "Transit facility replacement is not yet in place"
    trigger: "Execution or staging approval on a site with transit_facility_present while no replacement has reached INTERIM_IN_PLACE or COMPLETE"
  - error_id: ERR_FACILITY_REPLACEMENT_DEFICIENT
    http_status: 409
    category: business_referential
    message_template: "Transit facility replacement is DEFICIENT with a capacity deficit of {deficit}"
    trigger: "POST /jda/agreements/{id}/execute while any replacement of the agreement is DEFICIENT"
  - error_id: ERR_INVALID_INTERVAL
    http_status: 422
    category: business_temporal
    message_template: "Interval end must be strictly after interval start"
    trigger: "negotiation_end_date <= negotiation_start_date, new_end_date <= end_date, end_at <= start_at, or period_end <= period_start"
  - error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 409
    category: business_temporal
    message_template: "Solicitation response deadline {deadline} has passed"
    trigger: "Issue or proposal submission after the logical clock has reached response_deadline"
  - error_id: ERR_STAGING_WINDOW_OUTSIDE_TERM
    http_status: 422
    category: business_temporal
    message_template: "Staging interval falls outside the permitted envelope {envelope_start}..{envelope_end}"
    trigger: "POST /jda/staging-windows whose half-open interval is not contained in [ENP.start_date, ENP.end_date + 180 days)"
  - error_id: ERR_DUPLICATE_SITE_CODE
    http_status: 409
    category: business_constraint
    message_template: "Site code {site_code} already exists"
    trigger: "POST /jda/sites reusing an existing site_code"
  - error_id: ERR_NEGOTIATION_PERIOD_OVERLAP
    http_status: 409
    category: business_constraint
    message_template: "Requested period collides with negotiation period {other_id}"
    trigger: "A closed-closed date collision with another ACTIVE or EXTENDED period on the same site, including sharing a single boundary day"
  - error_id: ERR_MAX_EXTENSIONS_REACHED
    http_status: 409
    category: business_constraint
    message_template: "Negotiation period has already been extended {count} times"
    trigger: "A third extension attempt on the same period"
  - error_id: ERR_STAGING_CAPACITY_EXCEEDED
    http_status: 409
    category: business_constraint
    message_template: "Peak staging occupancy {peak} exceeds facility capacity {capacity}"
    trigger: "A staging request or approval whose half-open interval pushes overlapping approved bays above total_bay_capacity"
  - error_id: ERR_NO_RESPONSIVE_PROPOSALS
    http_status: 409
    category: business_constraint
    message_template: "Solicitation has {count} responsive proposals but requires {required}"
    trigger: "POST /jda/solicitations/{id}/close below min_proposals_required"
  - error_id: ERR_RANK_DEVIATION_UNJUSTIFIED
    http_status: 422
    category: business_constraint
    message_template: "Awarding rank {rank} requires a deviation_justification"
    trigger: "POST /jda/solicitations/{id}/award for a proposal whose rank is not 1 with no justification supplied"
  - error_id: ERR_EMPTY_LINE_ITEMS
    http_status: 422
    category: business_constraint
    message_template: "line_items must contain at least one entry"
    trigger: "POST /jda/shared-facilities/{id}/maintenance-charges with an empty line_items array"
  - error_id: ERR_FEDERAL_INTEREST_INSUFFICIENT
    http_status: 409
    category: business_fiscal
    message_template: "Unencumbered federal interest {available} is below the required {required}"
    trigger: "A disposition request whose computed federal interest amount exceeds the site's remaining unencumbered federal interest"
  - error_id: ERR_AFFORDABLE_COMMITMENT_SHORTFALL
    http_status: 409
    category: business_fiscal
    message_template: "Agreement commits {committed} affordable units but the selected proposal offered {offered}"
    trigger: "POST /jda/agreements/{id}/submit-for-review with affordable_units_committed below the proposal's affordable_units"
  - error_id: ERR_BELOW_PERMISSIBLE_FLOOR
    http_status: 409
    category: business_fiscal
    message_template: "Consideration {consideration} is below the permissible transfer floor {floor}"
    trigger: "POST /jda/agreements/{id}/submit-for-review where consideration_value_cents < the valuation's permissible_floor_cents"

# ============================================================================
# §1.7 Role Permission Matrix
# ============================================================================
roles:
  - name: RealEstateOfficer
    identity: opaque
    description: "Transit agency real estate office staff who run inventory, solicitation, developer selection, negotiation periods and agreement drafting."
    exclusive_operations:
      - "POST /jda/sites"
      - "POST /jda/sites/{id}/assessments"
      - "POST /jda/assessments/{id}/certify"
      - "POST /jda/sites/{id}/release-for-solicitation"
      - "POST /jda/sites/{id}/reopen-inventory"
      - "POST /jda/developers"
      - "POST /jda/sites/{id}/solicitations"
      - "POST /jda/solicitations/{id}/issue"
      - "POST /jda/solicitations/{id}/close"
      - "POST /jda/solicitations/{id}/award"
      - "POST /jda/proposals/{id}/shortlist"
      - "POST /jda/sites/{id}/negotiation-periods"
      - "POST /jda/negotiation-periods/{id}/extend"
      - "POST /jda/negotiation-periods/{id}/terminate"
      - "POST /jda/agreements"
      - "PATCH /jda/agreements/{id}"
      - "POST /jda/agreements/{id}/submit-for-review"
      - "POST /jda/agreements/{id}/execute"
    shared_operations: ["all GET endpoints"]
  - name: ValuationOfficer
    identity: opaque
    description: "Independent valuation staff who determine fair market value and certify the permissible transfer floor. Cannot draft or approve the agreement that relies on the valuation."
    exclusive_operations:
      - "POST /jda/sites/{id}/valuations"
      - "POST /jda/valuations/{id}/certify"
    shared_operations: ["all GET endpoints"]
  - name: BoardSecretary
    identity: opaque
    description: "Board clerk who records the board's revision requests and approvals. The operator identity that board-approves must differ from the one that submitted the agreement for review."
    exclusive_operations:
      - "POST /jda/agreements/{id}/request-revision"
      - "POST /jda/agreements/{id}/board-approve"
    shared_operations: ["all GET endpoints"]
  - name: GrantsComplianceOfficer
    identity: opaque
    description: "Federal grant compliance staff who file disposition requests and record the grantor's determination."
    exclusive_operations:
      - "POST /jda/agreements/{id}/disposition-requests"
      - "POST /jda/disposition-requests/{id}/determination"
      - "POST /jda/disposition-requests/{id}/withdraw"
    shared_operations: ["all GET endpoints"]
  - name: TransitOperationsManager
    identity: opaque
    description: "Operations staff who own transit facility replacement, shared facilities, staging decisions and maintenance cost allocation."
    exclusive_operations:
      - "POST /jda/agreements/{id}/facility-replacements"
      - "POST /jda/facility-replacements/{id}/status"
      - "POST /jda/sites/{id}/shared-facilities"
      - "POST /jda/staging-windows/{id}/decision"
      - "POST /jda/staging-windows/{id}/close"
      - "POST /jda/shared-facilities/{id}/maintenance-charges"
    shared_operations: ["all GET endpoints"]
  - name: Developer
    identity: "entity_backed:Developer"
    description: "A registered development partner. X-User-ID is the Developer.id, so a Developer caller may only submit proposals under its own id, read its own proposals, and request staging windows on agreements it holds."
    exclusive_operations:
      - "POST /jda/solicitations/{id}/proposals"
      - "POST /jda/staging-windows"
    shared_operations: ["all GET endpoints"]
  - name: SystemAdmin
    identity: opaque
    description: "Operator of the deterministic logical clock used by every deadline and expiry rule."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
