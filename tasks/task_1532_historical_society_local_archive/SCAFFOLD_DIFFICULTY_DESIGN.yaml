          assert:
            - "StorageZone.${z}.posture == RESTRICTED (${posture}) and breach_streak == 3 (${streak})"
            - "Item.${i}.status == ZONE_HOLD (link 2 fired from the posture change)"
            - "ReadingRoomAppointment.${appt}.status == NEEDS_RESCHEDULE (link 3 fired from the item mutation)"
            - "Item.${i}.version and ReadingRoomAppointment.${appt}.version each incremented by the cascade (updated_at refreshed)"

      - name: deaccession_finalize_cascade
        grounds:
          - state_machines.DeaccessionProposal
          - state_machines.Item
          - state_machines.ResearchRequest
          - state_machines.ReadingRoomAppointment
        distinguishing_aspect: |
          Depth-3 chain from the finalize trigger (different trigger from the
          environmental instance): proposal finalize deaccessions the item
          (link 1), which denies the open request referencing it (link 2), which
          cancels the request's confirmed appointment (link 3) — plus fan-out to
          the queued digitization ticket and the QUOTED reproduction order, and
          bubble-up retiring the emptied collection and its published finding aid.
        test_recipe:
          setup:
            - "Collection C with a single item I AVAILABLE; PUBLISHED finding aid FA; researcher R with request RQ APPROVED over [I]; appointment APPT CONFIRMED (2026-08-10); ticket T QUEUED on I; reproduction order O QUOTED over [I]; proposal TRANSFER over [I] approved and cooled off"
