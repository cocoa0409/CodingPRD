scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_listing_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Listing, "endpoints[\"POST /listings\"]"]
        distinguishing_aspect: "POST /listings with required fields returns 201; status DRAFT, calendar_version 1, version 1, id/created_at present."
        test_recipe:
          setup: ["A registered host."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c1@x.com", display_name: "C1" }
              as: Anonymous
              captures: { hc1: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { host_id: "${hc1}", title: "L", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc1}"
              captures: { lc1: $.data.id }
          assert:
            - "Response code 201"
            - "Listing.${lc1}.status == DRAFT"
            - "Listing.${lc1}.calendar_version == 1"
            - "Listing.${lc1}.version == 1"

      - name: get_listing_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Listing, "endpoints[\"GET /listings/{id}\"]"]
        distinguishing_aspect: "GET /listings/{id} returns the stored listing with matching id and base_nightly_rate_cents."
        test_recipe:
          setup: ["A created listing."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c2@x.com", display_name: "C2" }
              as: Anonymous
              captures: { hc2: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hc2}", title: "L2", base_nightly_rate_cents: 25000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc2}"
              captures: { lc2: $.data.id }
          trigger:
            - call: "GET /listings/${lc2}"
              payload: {}
              as: Host
              as_user_id: "${hc2}"
          assert:
            - "Listing.${lc2}.base_nightly_rate_cents == 25000"

      - name: list_listings_paginated_envelope
        claim_type: Listing
        grounds: [entities.Listing, "endpoints[\"GET /listings\"]"]
        distinguishing_aspect: "GET /listings returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least one listing exists for a host."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c3@x.com", display_name: "C3" }
              as: Anonymous
              captures: { hc3: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hc3}", title: "L3", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc3}"
          trigger:
            - call: "GET /listings?host_id=${hc3}&limit=10&offset=0"
              payload: { host_id: "${hc3}", limit: 10, offset: 0 }
              as: Host
              as_user_id: "${hc3}"
          assert:
            - "Response response_type == array"
            - "Response meta includes total_count >= 1 and has_more boolean"

      - name: get_listing_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Listing, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /listings/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["A registered host (for auth)."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c4@x.com", display_name: "C4" }
              as: Anonymous
              captures: { hc4: $.data.id }
          trigger:
            - call: "GET /listings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Host
              as_user_id: "${hc4}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404 with error_id == ERR_NOT_FOUND"

      - name: create_listing_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Listing, "errors[ERR_VALIDATION]", "validations[priority=16]"]
        distinguishing_aspect: "POST /listings omitting base_nightly_rate_cents returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A registered host."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c5@x.com", display_name: "C5" }
              as: Anonymous
              captures: { hc5: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { host_id: "${hc5}", title: "L5", cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc5}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 422 with error_id == ERR_VALIDATION"

      - name: listing_default_cancellation_tier_applied
        claim_type: Defaults
        grounds: [entities.Listing.fields.cancellation_tier]
        distinguishing_aspect: "Omitting cancellation_tier yields the default MODERATE on the created listing."
        test_recipe:
          setup: ["A registered host."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c6@x.com", display_name: "C6" }
              as: Anonymous
              captures: { hc6: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { host_id: "${hc6}", title: "L6", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc6}"
              captures: { lc6: $.data.id }
          assert:
            - "Listing.${lc6}.cancellation_tier == MODERATE"

      - name: booking_computed_nights_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.nights, calculations.nightly_pricing]
        distinguishing_aspect: "Booking.nights is computed from check_out - check_in (3 nights); any client-supplied nights field is ignored (not in input)."
        test_recipe:
          setup: ["A LISTED listing with a STD rate plan."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c7@x.com", display_name: "C7" }
              as: Anonymous
              captures: { hc7: $.data.id }
            - call: "POST /guests"
              payload: { email: "gc7@x.com", full_name: "GC7", govt_id_verified: true, prior_cancellations: 0, chargeback_flag: false }
              as: Anonymous
              captures: { gc7: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hc7}", title: "L7", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc7}"
              captures: { lc7: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${lc7}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${hc7}"
            - call: "POST /listings/${lc7}/publish"
              payload: {}
              as: Host
              as_user_id: "${hc7}"
          trigger:
            - call: "GET /listings/${lc7}"
              payload: {}
              as: Guest
              as_user_id: "${gc7}"
              captures: { lc7_cv_165: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${lc7}", guest_id: "${gc7}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${lc7_cv_165}" }
              as: Guest
              as_user_id: "${gc7}"
              captures: { bc7: $.data.id }
          assert:
            - "Booking.${bc7}.nights == 3"

      - name: create_booking_fk_guest_not_found_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Booking.fields.guest_id, "errors[ERR_FK_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "POST /bookings with a non-existent guest_id returns 404 ERR_FK_NOT_FOUND (body FK integrity)."
        test_recipe:
          setup: ["A LISTED listing."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c8@x.com", display_name: "C8" }
              as: Anonymous
              captures: { hc8: $.data.id }
            - call: "POST /guests"
              payload: { email: "gc8@x.com", full_name: "GC8", govt_id_verified: true }
              as: Anonymous
              captures: { gc8: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hc8}", title: "L8", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc8}"
              captures: { lc8: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${lc8}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${hc8}"
            - call: "POST /listings/${lc8}/publish"
              payload: {}
              as: Host
              as_user_id: "${hc8}"
          trigger:
            - call: "GET /listings/${lc8}"
              payload: {}
              as: Guest
              as_user_id: "${gc8}"
              captures: { lc8_cv_202: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${lc8}", guest_id: "00000000-0000-0000-0000-000000000000", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${lc8_cv_202}" }
              as: Guest
              as_user_id: "${gc8}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404 with error_id == ERR_FK_NOT_FOUND"

      - name: invalid_enum_cancellation_tier_rejected
        claim_type: Type Constraints
        grounds: [entities.Listing.fields.cancellation_tier, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /listings with cancellation_tier=PREMIUM (not in enum) returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A registered host."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c9@x.com", display_name: "C9" }
              as: Anonymous
              captures: { hc9: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { host_id: "${hc9}", title: "L9", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, cancellation_tier: "PREMIUM" }
              as: Host
              as_user_id: "${hc9}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 422 with error_id == ERR_VALIDATION"

      - name: imported_reservation_immutable_no_version_field
        claim_type: System Fields
        grounds: [entities.ImportedReservation, "endpoints[\"POST /channel-connections/{id}/imported-reservations\"]"]
        distinguishing_aspect: "ImportedReservation id/created_at are system-minted; import_status is system-set ACCEPTED on a clean import (client cannot set it)."
        test_recipe:
          setup: ["A CONNECTED channel connection on a listing."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "c10@x.com", display_name: "C10" }
              as: Anonymous
              captures: { hc10: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hc10}", title: "L10", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hc10}"
              captures: { lc10: $.data.id }
            - call: "POST /channel-connections"
              payload: { listing_id: "${lc10}", channel: "AIRBNB" }
              as: Host
              as_user_id: "${hc10}"
              captures: { ccc10: $.data.id }
            - call: "POST /channel-connections/${ccc10}/connect"
              payload: {}
              as: Host
              as_user_id: "${hc10}"
          trigger:
            - call: "POST /channel-connections/${ccc10}/imported-reservations"
              payload: { external_ref: "EXT-1", start_date: "2026-09-01", end_date: "2026-09-05" }
              as: PlatformAdmin
              captures: { ir10: $.data.id, irblk10: $.data.calendar_block_id }
          assert:
            - "ImportedReservation.${ir10}.import_status == ACCEPTED"
            - "ImportedReservation.${ir10}.calendar_block_id is non-null"

  # =========================================================================
  - section: state_machines
    instances:
      - name: booking_initial_state_is_requested
        claim_type: Initial State
        grounds: [state_machines.Booking, entities.Booking.fields.status]
        distinguishing_aspect: "A freshly created booking starts in status REQUESTED."
        test_recipe:
          setup: ["A LISTED listing with a STD rate plan."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "s1@x.com", display_name: "S1" }
              as: Anonymous
              captures: { hs1: $.data.id }
            - call: "POST /guests"
              payload: { email: "gs1@x.com", full_name: "GS1", govt_id_verified: true }
              as: Anonymous
              captures: { gs1: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hs1}", title: "S1L", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hs1}"
              captures: { ls1: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${ls1}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${hs1}"
            - call: "POST /listings/${ls1}/publish"
              payload: {}
              as: Host
              as_user_id: "${hs1}"
          trigger:
            - call: "GET /listings/${ls1}"
              payload: {}
              as: Guest
              as_user_id: "${gs1}"
              captures: { ls1_cv_296: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${ls1}", guest_id: "${gs1}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${ls1_cv_296}" }
              as: Guest
              as_user_id: "${gs1}"
              captures: { bs1: $.data.id }
          assert:
            - "Booking.${bs1}.status == REQUESTED"

      - name: confirm_from_requested_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.APPROVED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /bookings/{id}/confirm on a REQUESTED (not APPROVED) booking returns 409 ERR_INVALID_STATE; no SecurityDeposit/Payout created."
        test_recipe:
          setup: ["A REQUESTED booking."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "s2@x.com", display_name: "S2" }
              as: Anonymous
              captures: { hs2: $.data.id }
            - call: "POST /guests"
              payload: { email: "gs2@x.com", full_name: "GS2", govt_id_verified: true }
              as: Anonymous
              captures: { gs2: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hs2}", title: "S2L", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hs2}"
              captures: { ls2: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${ls2}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${hs2}"
            - call: "POST /listings/${ls2}/publish"
              payload: {}
              as: Host
              as_user_id: "${hs2}"
            - call: "GET /listings/${ls2}"
              payload: {}
              as: Guest
              as_user_id: "${gs2}"
              captures: { ls2_cv_332: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${ls2}", guest_id: "${gs2}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${ls2_cv_332}" }
              as: Guest
              as_user_id: "${gs2}"
              captures: { bs2: $.data.id }
          trigger:
            - call: "POST /bookings/${bs2}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${gs2}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_INVALID_STATE"

      - name: cancel_already_declined_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Booking, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal DECLINED, POST /bookings/{id}/cancel returns 409 ERR_INVALID_STATE (no transition out of terminal)."
        test_recipe:
          setup: ["A booking driven to terminal DECLINED."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "s3@x.com", display_name: "S3" }
              as: Anonymous
              captures: { hs3: $.data.id }
            - call: "POST /guests"
              payload: { email: "gs3@x.com", full_name: "GS3", govt_id_verified: true }
              as: Anonymous
              captures: { gs3: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hs3}", title: "S3L", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hs3}"
              captures: { ls3: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${ls3}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${hs3}"
            - call: "POST /listings/${ls3}/publish"
              payload: {}
              as: Host
              as_user_id: "${hs3}"
            - call: "GET /listings/${ls3}"
              payload: {}
              as: Guest
              as_user_id: "${gs3}"
              captures: { ls3_cv_374: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${ls3}", guest_id: "${gs3}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${ls3_cv_374}" }
              as: Guest
              as_user_id: "${gs3}"
              captures: { bs3: $.data.id }
            - call: "POST /bookings/${bs3}/screen"
              payload: {}
              as: Host
              as_user_id: "${hs3}"
            - call: "POST /bookings/${bs3}/decline"
              payload: {}
              as: Host
              as_user_id: "${hs3}"
          trigger:
            - call: "POST /bookings/${bs3}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${gs3}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_INVALID_STATE"

      - name: screen_twice_idempotency_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Booking.REQUESTED_to_SCREENING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second POST /bookings/{id}/screen (already SCREENING) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A booking already in SCREENING."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "s4@x.com", display_name: "S4" }
              as: Anonymous
              captures: { hs4: $.data.id }
            - call: "POST /guests"
              payload: { email: "gs4@x.com", full_name: "GS4", govt_id_verified: true }
              as: Anonymous
              captures: { gs4: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hs4}", title: "S4L", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hs4}"
              captures: { ls4: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${ls4}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${hs4}"
            - call: "POST /listings/${ls4}/publish"
              payload: {}
              as: Host
              as_user_id: "${hs4}"
            - call: "GET /listings/${ls4}"
              payload: {}
              as: Guest
              as_user_id: "${gs4}"
              captures: { ls4_cv_424: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${ls4}", guest_id: "${gs4}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${ls4_cv_424}" }
              as: Guest
              as_user_id: "${gs4}"
              captures: { bs4: $.data.id }
            - call: "POST /bookings/${bs4}/screen"
              payload: {}
              as: Host
              as_user_id: "${hs4}"
          trigger:
            - call: "POST /bookings/${bs4}/screen"
              payload: {}
              as: Host
              as_user_id: "${hs4}"
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_INVALID_STATE"

      - name: channel_sync_round_cycle_clears_pending
        claim_type: Valid Transition
        grounds: [state_machines.ChannelConnection.SYNCING_to_CONNECTED, entities.ChannelConnection.fields.pending_sync_count]
        distinguishing_aspect: "CONNECTED->SYNCING->CONNECTED clears pending_sync_count to 0 and stamps last_synced_at."
        test_recipe:
          setup: ["A CONNECTED channel with pending_sync_count > 0 from a manual block create."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "s5@x.com", display_name: "S5" }
              as: Anonymous
              captures: { hs5: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hs5}", title: "S5L", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${hs5}"
              captures: { ls5: $.data.id }
            - call: "POST /channel-connections"
              payload: { listing_id: "${ls5}", channel: "VRBO" }
              as: Host
              as_user_id: "${hs5}"
              captures: { ccs5: $.data.id }
            - call: "POST /channel-connections/${ccs5}/connect"
              payload: {}
              as: Host
              as_user_id: "${hs5}"
            - call: "GET /listings/${ls5}"
              payload: {}
              as: Host
              as_user_id: "${hs5}"
              captures: { ls5_cv_467: $.data.calendar_version }
            - call: "POST /listings/${ls5}/calendar-blocks"
              payload: { source: "MANUAL", start_date: "2026-09-10", end_date: "2026-09-13", expected_listing_calendar_version: "${ls5_cv_467}" }
              as: Host
              as_user_id: "${hs5}"
            - call: "POST /channel-connections/${ccs5}/sync"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /channel-connections/${ccs5}/sync-complete"
              payload: {}
              as: PlatformAdmin
              captures: { psc: $.data.pending_sync_count }
          assert:
            - "ChannelConnection.${ccs5}.pending_sync_count == 0 after sync-complete"
            - "ChannelConnection.${ccs5}.status == CONNECTED"

      - name: manual_release_of_booking_block_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.CalendarBlock.ACTIVE_to_RELEASED, "errors[ERR_RELEASE_BOOKING_BLOCK]"]
        distinguishing_aspect: "POST /listings/{id}/calendar-blocks/{block_id}/release on a BOOKING-source block returns 409 ERR_RELEASE_BOOKING_BLOCK."
        test_recipe:
          setup: ["A REQUESTED booking with its BOOKING-source CalendarBlock."]
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "s6@x.com", display_name: "S6" }
              as: Anonymous
              captures: { hs6: $.data.id }
            - call: "POST /guests"
              payload: { email: "gs6@x.com", full_name: "GS6", govt_id_verified: true }
              as: Anonymous
              captures: { gs6: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${hs6}", title: "S6L", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
