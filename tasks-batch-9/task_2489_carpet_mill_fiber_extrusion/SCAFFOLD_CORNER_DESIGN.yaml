          - errors[ERR_RUN_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          The setup values are all in spec (gauge, pile and pattern would pass priority 15), so the
          only thing rejecting the call is the logical clock sitting at the 2026-08-01 default,
