            - call: "POST /reroof/work-windows/${w1}/status"
              payload: { action: "START" }
              as: RoofingContractor
              as_user_id: "${roofer_b}"
              captures: { e_off_project_roofer: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 403"
            - "${e_crew_creates_project} == ERR_ROLE_NOT_PERMITTED"
            - "${e_roofer_removes} == ERR_ROLE_NOT_PERMITTED"
            - "${e_owner_waives} == ERR_ROLE_NOT_PERMITTED"
            - "${e_sysowner_decides_permit} == ERR_ROLE_NOT_PERMITTED"
            - "${e_ahj_reviews_order} == ERR_ROLE_NOT_PERMITTED (not ERR_SOURCING_ORDER_NOT_FOUND, because priority 2 precedes priority 3)"
            - "${e_coordinator_deenergizes} == ERR_ROLE_NOT_PERMITTED"
