          trigger:
            - call: "POST /cosmetics/listings/${lst_id}/substantiations"
              payload: { assessor_name: "Dr M Ivanov", assessment_basis: "INGREDIENT_READ_ACROSS" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub2_id}/review-items"
              payload: { evidence_type: "CLINICAL_SAFETY_STUDY", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "HRIPT 2026-007" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub2_id}/review-items"
              payload: { evidence_type: "IN_VITRO_TOXICOLOGY", reviewer_credential: "ERT", citation: "OECD 492 repeat" }
