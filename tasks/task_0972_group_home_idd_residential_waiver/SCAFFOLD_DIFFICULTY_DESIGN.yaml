            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-12-31" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
            - { call: "POST /authorizations/${auth_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T09:00:00Z", check_out_at: "2026-06-02T10:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { visit_id: $.data.id } }
          trigger:
            - { call: "POST /evv-visits/${visit_id}/flag-exception", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { vs1: $.data.verification_status, bs1: $.data.billing_status } }
            - { call: "POST /evv-visits/${visit_id}/resolve-exception", payload: { adjusted_minutes: 60, resolution_note: "Verified from case notes" }, as: QIDP, as_user_id: "${q_id}", captures: { vs2: $.data.verification_status, bs2: $.data.billing_status } }
            - { call: "POST /claims", payload: { individual_id: "${ind_id}", service_period_start: "2026-06-02", service_period_end: "2026-06-02" }, as: BillingSpecialist, captures: { claim_id: $.data.id, ta: $.data.total_amount_cents } }
            - { call: "POST /claims/${claim_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
            - { call: "POST /claims/${claim_id}/post-payment", payload: { paid_amount_cents: 6000 }, as: BillingSpecialist, as_user_id: "bill-2" }
            - { call: "POST /claims/${claim_id}/void", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
            - call: "GET /evv-visits"
              payload: { authorization_id: "${auth_id}" }
              as: Any
              captures: { vs_f: "$.data[0].verification_status", bs_f: "$.data[0].billing_status" }
          assert:
            - "after flag-exception: verification_status == EXCEPTION and billing_status == UNBILLED"
            - "after resolve-exception: verification_status == VERIFIED and billing_status still == UNBILLED (verification axis moved alone)"
            - "claim total_amount_cents == 6000 (4 units * 1500)"
            - "after claim sweep + payment: billing_status was BILLED while verification_status stayed VERIFIED"
            - "after void: billing_status == UNBILLED again and verification_status still == VERIFIED (billing axis moved alone)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances, depth 3 each, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: critical_incident_cascades_home_claims_agency
        grounds:
          - state_machines.Incident.DRAFT_to_SUBMITTED
          - state_machines.BillingClaim.DRAFT_to_HOLD
          - calculations.home_compliance_posture
          - entities.ProviderAgency.fields.held_claims_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by a CRITICAL incident submit:
          Incident -> GroupHome.compliance_posture recomputed to CRITICAL (link 1);
          the posture change itself moves the resident's DRAFT claim to HOLD
          (link 2); the claim HOLD itself recomputes ProviderAgency.held_claims_count
          (link 3). Trigger differs from the ISP-expiry cascade.
