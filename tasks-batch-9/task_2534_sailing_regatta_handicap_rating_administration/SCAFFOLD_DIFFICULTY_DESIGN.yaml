          assert:
            - "RatingCertificate.${c_a}.raw_speed_index == 0.6545 and RatingCertificate.${c_a}.rating_value == 171.3 and RatingCertificate.${c_a}.band_key_spm == 171.3"
            - "RatingCertificate.${c_f}.raw_speed_index == 0.8215 and RatingCertificate.${c_f}.rating_value == 107.8"
            - "RatingCertificate.${c_c}.raw_speed_index == 0.9518 and RatingCertificate.${c_c}.rating_value == 58.3"
            - "RatingCertificate.${c_d1}.raw_speed_index == 0.5767 and RatingCertificate.${c_d1}.rating_value == 200.9 and RatingCertificate.${c_d1}.band_key_spm == 200.9"
