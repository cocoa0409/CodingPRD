              payload: { homeowner_id: "${hoM1_id}", tariff_id: "${tM1_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agM1_id: $.data.id }
            - call: "POST /servicing/agreements/${agM1_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agM1_id}", period_year: 2026, period_month: 6, metered_kwh: 900 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ppM1_id: $.data.id }
          trigger:
            - call: "POST /servicing/production-periods/${ppM1_id}/reconcile"
              payload: { issue_credit: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "GET /servicing/agreements/${agM1_id}"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/outage-events"
              payload: { agreement_id: "${agM1_id}", inverter_serial: "INV-7781-A", outage_type: "COMMS_LOSS", detected_at: "2026-07-04T09:00:00Z" }
              as: FieldOpsCoordinator
              as_user_id: "u_ops_1"
