            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${la}", eggs_taken: 10000, expected_egg_lot_version: "${lav}"}, as: IncubationOperator}
            - {call: "POST /grower-farms", payload: {code: "FM1", operator_user_id: "u_grower_1", capacity_chicks: 20000}, as: HatcheryManager, captures: {fm1: "$.data.id"}}
            - {call: "POST /grower-farms/${fm1}/clear", payload: {}, as: Veterinarian}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-22T00:00:00Z", requested_chicks: 5000}, as: HatcheryManager, captures: {o1: "$.data.id"}}
            - {call: "POST /placement-orders/${o1}/confirm", payload: {}, as: HatcheryManager}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/candle", payload: {fertile_count: 9600}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/transfer", payload: {hatcher_unit_id: "${u2}"}, as: IncubationOperator, captures: {h1: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-22T18:00:00Z"}, as: HatcheryManager}
            - {call: "POST /hatcher-loads/${h1}/pull", payload: {hatched_count: 9000}, as: ChickProcessor, captures: {cb1: "$.data.id"}}
            - {call: "POST /chick-batches/${cb1}/sex", payload: {male_count: 4275, female_count: 4275, unsexed_count: 0, sexing_cull_count: 450}, as: ChickProcessor}
            - {call: "POST /chick-batches/${cb1}/vaccinate", payload: {vaccine_code: "MAREKS_HVT"}, as: ChickProcessor, captures: {cb_stale: "$.data.version"}}
            - {call: "POST /chick-batches/${cb1}/box", payload: {}, as: ChickProcessor, captures: {cbv: "$.data.version"}}
          trigger:
            - {call: "POST /chick-batches/${cb1}/allocations", payload: {expected_chick_batch_version: "${cb_stale}"}, as: HatcheryManager, captures: {e1: "$.data.error_id"}}
            - {call: "POST /chick-batches/${cb1}/allocations", payload: {expected_chick_batch_version: "${cbv}"}, as: HatcheryManager, captures: {a1: "$.data[0].id"}}
          assert:
            - "First call: HTTP 412 with data.error_id == ERR_STALE_VERSION; GET /delivery-assignments?chick_batch_id=${cb1} returns total_count 0"
            - "ChickBatch.${cb1}.unassigned_chicks stays 8481 and its version is unchanged by the rejected call"
            - "Second call: HTTP 201 with one assignment ${a1} of 5000 chicks (50 boxes) against ${o1}"
            - "ChickBatch.${cb1}.unassigned_chicks == 3481 and version == ${cbv} + 1, so replaying the same request with ${cbv} would now be a 412"

      - name: version_increments_on_every_write_and_only_on_writes
        claim_type: optimistic_concurrency
        grounds:
          - response_envelope
          - entities.EggLot
          - entities.BreederFlock
        distinguishing_aspect: "version is a per-row write counter: three successive writes on one lot take it 1 -> 2 -> 3 -> 4 while an untouched sibling lot stays at 1, and the reads interleaved between the writes leave both alone. An implementation that bumps a global counter or bumps on read fails."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 is IN_LAY with two COLLECTED lots L1 and L2."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 10500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T06:00:00Z", collected_count: 4200}, as: FlockManager, captures: {l2: "$.data.id"}}
          trigger:
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager, captures: {v2: "$.data.version"}}
            - {call: "GET /egg-lots/${l1}", payload: {}, as: IncubationOperator}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {v3: "$.data.version"}}
            - {call: "POST /egg-lots/${l1}/sanitation-hold", payload: {}, as: Veterinarian, captures: {v4: "$.data.version"}}
            - {call: "GET /egg-lots/${l2}", payload: {}, as: IncubationOperator, captures: {v_other: "$.data.version"}}
          assert:
            - "EggLot.${l1}.version was 1 at creation; ${v2} == 2 after grading, ${v3} == 3 after storage, ${v4} == 4 after the sanitation hold"
            - "The interleaved GET returns version 2 and does not advance it"
            - "${v_other} == 1: the sibling lot L2 is untouched by any of L1's writes"
            - "BreederFlock.${f1}.version is unchanged by L1's grading and storage (no ancestor bump for those writes)"
            - "updated_at advances on each of the three writes and equals the logical clock 2026-08-01T12:00:00Z"

      - name: error_occ_on_the_egg_lot_draw_endpoint
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.egg-lot-draw-stale-version
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / items_stale_version_beats_egg_lot_state
          rationale: "The egg-lot OCC rule is asserted there both as a stale-version 412 and as a successful draw with the refreshed version, on top of the priority ladder."

      - name: error_cascading_side_effects_multi_level
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / lab_positive_condemns_eggs_and_aborts_load
          rationale: "A four-level chain end-to-end in one request, with the non-terminal-children-only rule, is that instance's subject; the reverse direction is covered by reverse_assignment_restores_pool_and_steps_order_back."

      - name: error_dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / chick_quality_provisional_vs_final_diverge
          rationale: "Both §1.8 dual_variant_calc instances already assert the two variants and the exact delta between them."

      - name: error_rate_threshold_trigger_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: boundary_precision_check / segment_degree_hours_exactly_threshold_does_not_open
          rationale: "The cumulative degree-hour trigger at, below and above its threshold plus the DEVIATION_CLEAR_HOURS reset are covered by that instance together with setter_load_environment_dimension_parallel."

  - section: consistency_model
    instances:
      - name: cascade_visible_in_the_triggering_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.EggLot.ALLOCATED_to_CONDEMNED
          - calculations.conservation_invariants
        distinguishing_aspect: "The condemn response itself must already show the terminal state of the whole cascade - lot CONDEMNED with eggs_remaining 0 - and an immediately following read of the setter load must show it ABORTED with total_eggs_set 0, with no second request, no retry and no lag anywhere in the chain."
        test_recipe:
          setup:
