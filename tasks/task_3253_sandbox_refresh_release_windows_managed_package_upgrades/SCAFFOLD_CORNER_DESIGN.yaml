  - section: rbac
    instances:
      - name: release_manager_cannot_publish_package_version
        claim_type: peer_roles
        grounds:
          - roles.ReleaseManager
          - roles.PlatformAdmin
          - endpoints.POST_/platform/package-versions
        distinguishing_aspect: "Peer-role separation on the vendor surface: ReleaseManager installs and upgrades packages but cannot publish a package version, which is PlatformAdmin's exclusive operation, while ReleaseManager's own install operation still succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox and one published orbit package version."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "orbit", major_version: 1, name: "Orbit Core 1" }
              as: PlatformAdmin
              captures: { pv_rb_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Peer Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_peer_id: $.data.id, env_peer_v: $.data.version }
          trigger:
            - call: "POST /platform/package-versions"
              payload: { namespace: "nimbus", major_version: 1, name: "Nimbus Core 1" }
              as: ReleaseManager
              captures: { err_publish: $.data.error_id }
            - call: "POST /platform/environments/${env_peer_id}/package-installations"
              payload: { package_version_id: "${pv_rb_id}", expected_environment_version: "${env_peer_v}" }
              as: ReleaseManager
              captures: { pkg_peer_id: $.data.id }
          assert:
            - "the publish returns error_id ERR_UNAUTHORIZED with http 403"
            - "the install returns http 201 with InstalledPackage.${pkg_peer_id}.status == INSTALLED"
            - "no PackageVersion with namespace nimbus exists afterwards"
            - "the same publish as PlatformAdmin succeeds with http 201"

      - name: environment_admin_cannot_open_access_audit
        claim_type: peer_roles
        grounds:
          - roles.EnvironmentAdmin
          - roles.SecurityAuditor
          - endpoints.POST_/platform/access-audits
          - endpoints.POST_/platform/refresh-jobs
        distinguishing_aspect: "A second peer pair on the audit surface: EnvironmentAdmin owns the refresh lifecycle but cannot open an access audit, while SecurityAuditor can open the audit but cannot open a refresh job."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with one grant."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Audit Peer Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ape_id: $.data.id }
            - call: "POST /platform/environments/${env_ape_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "PeerProfile", user_id: "0050a0000b0001" }
              as: SecurityAuditor
              captures: { ape_p_id: $.data.id }
          trigger:
            - call: "POST /platform/access-audits"
              payload: { environment_id: "${env_ape_id}", reviewed_assignment_ids: ["${ape_p_id}"] }
              as: EnvironmentAdmin
              captures: { err_audit: $.data.error_id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_ape_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: SecurityAuditor
              captures: { err_refresh: $.data.error_id }
            - call: "POST /platform/access-audits"
              payload: { environment_id: "${env_ape_id}", reviewed_assignment_ids: ["${ape_p_id}"] }
              as: SecurityAuditor
              captures: { audit_peer_id: $.data.id }
          assert:
            - "the EnvironmentAdmin audit attempt returns error_id ERR_UNAUTHORIZED with http 403"
            - "the SecurityAuditor refresh attempt returns error_id ERR_UNAUTHORIZED with http 403"
            - "the SecurityAuditor audit attempt returns http 201 with AccessAudit.${audit_peer_id}.status == OPEN"
            - "AccessAudit.${audit_peer_id}.overreach_count == 0, so a single-layer operator does not overreach"

      - name: shared_permission_grant_available_to_two_roles
        claim_type: shared_operations
        grounds:
          - roles.SecurityAuditor.shared_operations
          - roles.PlatformAdmin.shared_operations
          - endpoints.POST_/platform/environments/{id}/permissions
        distinguishing_aspect: "A shared operation is genuinely available to both declared roles: SecurityAuditor and PlatformAdmin can each create a permission assignment, while StorageArchivist cannot."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Shared Op Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_so_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_so_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "SharedOne", user_id: "0050a0000c0001" }
              as: SecurityAuditor
              captures: { so_p1_id: $.data.id }
            - call: "POST /platform/environments/${env_so_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "SharedTwo", user_id: "0050a0000c0002" }
              as: PlatformAdmin
              captures: { so_p2_id: $.data.id }
            - call: "POST /platform/environments/${env_so_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "SharedThree", user_id: "0050a0000c0003" }
              as: StorageArchivist
              captures: { err_shared: $.data.error_id }
          assert:
            - "both shared-role creates return http 201 with PermissionAssignment.${so_p1_id}.sharing_rule_scope == PRIVATE and PermissionAssignment.${so_p2_id}.sharing_rule_scope == PRIVATE"
            - "the StorageArchivist attempt returns error_id ERR_UNAUTHORIZED with http 403"
            - "GET /platform/environments/${env_so_id}/permissions returns exactly 2 rows"
            - "both created grants are distinct rows even though they name different principal_name values for different operators"

      - name: app_developer_cannot_accept_own_governor_request
        claim_type: approval_chain
        grounds:
          - roles.AppDeveloper
          - roles.PlatformAdmin
          - endpoints.POST_/platform/governor-limit-requests/{id}/approve
        distinguishing_aspect: "The request/approval chain is enforced: the AppDeveloper who declares and submits a governor request cannot accept it, and only PlatformAdmin can move it from SUBMITTED to ACCEPTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with one submitted request."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Chain Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_chain_id: $.data.id }
            - call: "POST /platform/environments/${env_chain_id}/governor-limit-requests"
              payload: { request_kind: "QUEUEABLE", scope_count: 50, callout_graph: [], max_concurrent_jobs: 5 }
              as: AppDeveloper
              captures: { gov_chain_id: $.data.id }
            - call: "POST /platform/governor-limit-requests/${gov_chain_id}/submit"
              payload: {}
              as: AppDeveloper
          trigger:
            - call: "POST /platform/governor-limit-requests/${gov_chain_id}/approve"
              payload: {}
              as: AppDeveloper
              captures: { err_chain: $.data.error_id }
            - call: "POST /platform/governor-limit-requests/${gov_chain_id}/approve"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the AppDeveloper approval attempt returns error_id ERR_UNAUTHORIZED with http 403"
            - "GovernorLimitRequest.${gov_chain_id}.status remains SUBMITTED after the refusal"
            - "the PlatformAdmin approval succeeds with status ACCEPTED"
            - "the PlatformAdmin could also read the request before approving, so the denial is specific to the accept step"

      - name: storage_archivist_exclusive_ledger_operations
        claim_type: peer_roles
        grounds:
          - roles.StorageArchivist
          - roles.ReleaseManager
          - endpoints.POST_/platform/environments/{id}/storage-ledgers
          - endpoints.POST_/platform/environments/{id}/storage/archive
        distinguishing_aspect: "StorageArchivist holds exclusive storage operations while other write-capable roles are refused them, and DeploymentJob completion remains EnvironmentAdmin's exclusive operation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Storage Peer Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_spe_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_spe_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 1048576, rank_index: 1 }
              as: ReleaseManager
              captures: { err_ledger: $.data.error_id }
            - call: "POST /platform/environments/${env_spe_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { spe_l_id: $.data.id }
            - call: "POST /platform/environments/${env_spe_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 1 }
              as: StorageArchivist
              captures: { err_archive_auth: $.data.error_id }
          assert:
            - "the ReleaseManager ledger create returns error_id ERR_UNAUTHORIZED with http 403"
            - "the StorageArchivist ledger create returns http 201 with StorageLedger.${spe_l_id}.status == LIVE"
            - "the archive attempt returns error_id ERR_ARCHIVE_WINDOW_CLOSED with http 422, so the role is permitted and the refusal is a business rule rather than an authorization failure"
            - "StorageLedger.${spe_l_id}.archivable == false and status remains LIVE"

      - name: opaque_identity_roles_accept_any_operator_identifier
        claim_type: peer_roles
        grounds:
          - roles.PlatformAdmin
          - roles.EnvironmentAdmin
          - endpoints.POST_/platform/refresh-jobs
        distinguishing_aspect: "Every declared role is opaque, so two different operator identifiers presenting the same role are both admitted: neither refresh-job creation is tied to a persisted entity id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Opaque Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_op_id: $.data.id }
          trigger:
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_op_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              as_user_id: "operator-one"
              captures: { op_rj1_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_op_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              as_user_id: "operator-two"
              captures: { op_rj2_id: $.data.id }
          assert:
            - "both creates return http 201 even though the two operator identifiers differ"
            - "RefreshJob.${op_rj1_id}.status == PENDING and RefreshJob.${op_rj2_id}.status == PENDING"
            - "GET /platform/environments/${env_op_id}/refresh-jobs returns exactly 2 rows"
            - "neither refresh job references an entity-backed identifier, consistent with EnvironmentAdmin being opaque"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_installation_rule_already_asserted_by_difficulty
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules[env-serialize-package-installations]
        excluded_because:
          difficulty_instance: package_installation_rejects_stale_environment_version
          rationale: "The stale-version rejection and the successful re-send are the named §1.8 instance's assertions."
      - name: occ_change_set_rule_already_asserted_by_difficulty
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules[env-serialize-change-set-creation]
        excluded_because:
          difficulty_instance: change_set_creation_rejects_stale_target_version
          rationale: "The stale-version rejection and the version-advance check are the named §1.8 instance's assertions."
      - name: cascading_side_effects_already_asserted_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - calculations.upgrade_candidate_evaluation
        excluded_because:
          difficulty_instance: package_publish_refreshes_every_installations_stale_marker
          rationale: "The fan-out across environments and the ordering-sensitive install_count write are asserted by the named §1.8 instance."
      - name: version_pinning_already_asserted_by_difficulty
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers.version_pinning_on_approval
          - entities.MetadataChangeSet.fields.component_digests
        excluded_because:
          difficulty_instance: digest_mismatch_blocks_deployment_completion
          rationale: "The pinned-digest mismatch and its blocking of deployment completion are asserted by the named §1.8 instance."
      - name: derived_field_reconciliation_already_asserted_by_difficulty
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
          - entities.Environment.fields.storage_headroom_bytes
        excluded_because:
          difficulty_instance: live_archived_partition_keeps_headroom_stable
          rationale: "The LIVE/ARCHIVED partition reconciliation and the pinned conserved total are asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: install_side_effects_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/platform/environments/{id}/package-installations
          - entities.Environment.fields.installed_version_ids
        distinguishing_aspect: "The installation response already reflects every derived field the install cascade produced: the stripped-down radius of the roll-up is visible without a follow-up read, so the model is immediate rather than eventual."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox and one published acme package version."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_imm_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Immediate Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_imm_id: $.data.id, env_imm_v: $.data.version }
          trigger:
            - call: "POST /platform/environments/${env_imm_id}/package-installations"
              payload: { package_version_id: "${pv_imm_id}", expected_environment_version: "${env_imm_v}" }
              as: ReleaseManager
              captures: { pkg_imm_id: $.data.id }
          assert:
            - "the install response already carries InstalledPackage.${pkg_imm_id}.namespace == \"acme\" without a follow-up read"
            - "a single follow-up GET /platform/environments/${env_imm_id} shows Environment.${env_imm_id}.installed_version_ids == [\"${pv_imm_id}\"]"
            - "the environment version in the same response equals the version a follow-up read reports, so no reconciliation lag exists"
            - "PackageVersion.${pv_imm_id}.install_count == 1 on the first read, with no delay required"

      - name: archive_side_effects_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/platform/environments/{id}/storage/archive
          - entities.StorageLedger.fields.status
        distinguishing_aspect: "The archive response reports the archived ledger ids and bytes it just moved, and a follow-up read of the same environment agrees exactly, so the storage roll-up is reconciled inside the request rather than asynchronously."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER sandbox released onto SU26 with two FILE ledgers."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Archive Immediate Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ai_id: $.data.id }
            - call: "POST /platform/environments/${env_ai_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { ai_l1_id: $.data.id }
            - call: "POST /platform/environments/${env_ai_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 2097152, rank_index: 2 }
              as: StorageArchivist
              captures: { ai_l2_id: $.data.id }
            - call: "POST /platform/environments/${env_ai_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_ai_id}/apply-release"
              payload: {}
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_ai_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 1 }
              as: StorageArchivist
              captures: { ai_archived_bytes: $.data.storage_archived_bytes, ai_batch_id: $.data.last_archive_batch_id }
            - call: "GET /platform/environments/${env_ai_id}/storage-ledgers"
              payload: {}
              as: StorageArchivist
          assert:
            - "the archive response reports Environment.${env_ai_id}.storage_archived_bytes == 1048576 and a non-null last_archive_batch_id"
            - "the immediate follow-up read shows StorageLedger.${ai_l1_id}.status == ARCHIVED and StorageLedger.${ai_l1_id}.archive_batch_id == ${ai_batch_id}"
            - "the same read shows StorageLedger.${ai_l2_id}.status == LIVE and archived_at is null"
            - "Environment.${env_ai_id}.storage_used_bytes == 2097152 and storage_archived_bytes == 1048576 on the first read after the archive"
