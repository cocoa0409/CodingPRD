scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_provisional_vs_final_subtotal
        grounds:
          - "calculations.order_subtotal"
          - "state_machines.Order.DRAFT_to_PLACED"
          - "state_machines.Order.PLACED_to_FULFILLED"
          - "state_machines.Lot.AVAILABLE_to_RECALLED"
          - "entities.Order.fields.provisional_subtotal_cents"
          - "entities.Order.fields.final_subtotal_cents"
        distinguishing_aspect: "Cost accounting on Order: provisional_subtotal captured at place equals the full ordered value (9000), while final_subtotal recomputed at fulfil after a recall shorted the only line is 0 — same order, two variants, divergent money."
        test_recipe:
          setup:
            - "GOLD customer (lifetime 1000); product priced 5000 cents, not practitioner-line; a single lot with exactly 2 units; a one-off order with one line of quantity 2, PLACED (provisional captured)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "g1@x.com", full_name: "Gold One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /_inject/loyalty_state"
              payload: { customer_id: "${cust_id}", lifetime_points_earned: 1000, points_balance: 0 }
              as: StoreOperator
            - call: "POST /products"
              payload: { name: "Prov Final SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "PF-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 2 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /lots/${lot_id}/state"
              payload: { to_status: "RECALLED", reason: "contamination", severity: "CLASS_I" }
              as: StoreOperator
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: StoreOperator
          assert:
            - "Order.${order_id}.provisional_subtotal_cents == 9000"
            - "Order.${order_id}.final_subtotal_cents == 0"

      - name: return_refund_full_vs_unwanted
        grounds:
          - "calculations.return_refund"
          - "state_machines.Return.APPROVED_to_REFUNDED"
          - "entities.Return.fields.refund_cents"
          - "entities.Return.fields.restock"
        distinguishing_aspect: "Refund on Return diverges by reason for identical returned lines: UNWANTED applies the 15% restocking fee (4250) and restocks, while DEFECT refunds the gross (5000) and does not restock — a different entity domain (Return) than the Order-subtotal variant."
        test_recipe:
          setup:
            - "BRONZE customer; product priced 5000; lot with 10 units; a one-off order with two identical single-unit lines, PLACED and FULFILLED; two returns (one UNWANTED, one DEFECT), each APPROVED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "b1@x.com", full_name: "Bronze One" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Refund SKU", form: "TABLET", regimen_goals: ["JOINT"], dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "RF-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_b: "$.data.id" }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: StoreOperator
            - call: "POST /returns"
              payload: { order_id: "${order_id}", order_line_id: "${line_a}", quantity: 1, reason: "UNWANTED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_a: "$.data.id" }
            - call: "POST /returns"
              payload: { order_id: "${order_id}", order_line_id: "${line_b}", quantity: 1, reason: "DEFECT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_b: "$.data.id" }
            - call: "POST /returns/${ret_a}/state"
              payload: { to_status: "APPROVED" }
              as: StoreOperator
            - call: "POST /returns/${ret_b}/state"
              payload: { to_status: "APPROVED" }
              as: StoreOperator
          trigger:
            - call: "POST /returns/${ret_a}/state"
              payload: { to_status: "REFUNDED" }
              as: StoreOperator
            - call: "POST /returns/${ret_b}/state"
              payload: { to_status: "REFUNDED" }
              as: StoreOperator
          assert:
            - "Return.${ret_a}.refund_cents == 4250"
            - "Return.${ret_a}.restock == true"
            - "Return.${ret_b}.refund_cents == 5000"
            - "Return.${ret_b}.restock == false"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_line_pricing_per_unit_rounding
        grounds:
          - "calculations.order_line_pricing"
          - "entities.OrderLine.fields.net_unit_price_cents"
          - "entities.OrderLine.fields.line_total_cents"
          - "entities.Bundle.fields.discount_pct"
        distinguishing_aspect: "Mode (b) nested rounding order: net_unit is round_half_up(1999*0.85*0.90)=1529 rounded PER UNIT then *3 = 4587, which differs from rounding after multiplying (4588); the scaffold pins per-unit-then-multiply."
        test_recipe:
          setup:
            - "GOLD customer (purchase discount 0.10); product priced 1999; a bundle containing that product with 0.15 stack discount; lot with 100 units; a one-off order with one bundled line of quantity 3."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "g2@x.com", full_name: "Gold Two" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /_inject/loyalty_state"
              payload: { customer_id: "${cust_id}", lifetime_points_earned: 1000, points_balance: 0 }
              as: StoreOperator
            - call: "POST /products"
              payload: { name: "Rounding SKU", form: "GUMMY", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 1999 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "RD-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 100 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /bundles"
              payload: { name: "Round Stack", component_product_ids: ["${prod_id}"], discount_pct: 0.15 }
              as: StoreOperator
              captures: { bundle_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 3, bundle_id: "${bundle_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "OrderLine.${line_id}.net_unit_price_cents == 1529"
            - "OrderLine.${line_id}.line_total_cents == 4587"

      - name: loyalty_points_earned_tiered_autoship
        grounds:
          - "calculations.loyalty_points_earned"
          - "entities.Customer.fields.loyalty_tier"
          - "entities.Order.fields.order_type"
          - "entities.Order.fields.points_earned"
        distinguishing_aspect: "Mode (a) >=3-input non-linear: points = min(floor(base * (TIER_EARN_MULTIPLIER[GOLD]=1.5 + AUTOSHIP_EARN_BONUS=0.25)), cap) = floor(95*1.75) = 166 on an AUTOSHIP order — subtotal, tier multiplier and order_type bonus interact, a different mode than the per-unit rounding instance."
        test_recipe:
          setup:
            - "GOLD customer; product priced 5000; lot with 100 units; an ACTIVE 30-day subscription (autoship discount 0.05, quantity_per_cycle 2); an auto-ship order generated from it (line quantity 2)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "g3@x.com", full_name: "Gold Three" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /_inject/loyalty_state"
              payload: { customer_id: "${cust_id}", lifetime_points_earned: 1000, points_balance: 0 }
              as: StoreOperator
            - call: "POST /products"
              payload: { name: "Autoship SKU", form: "CAPSULE", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "AS-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 100 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 2, cadence_days: 30, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/generate-order"
              payload: { expected_subscription_version: "${sub_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: StoreOperator
          assert:
            - "Order.${order_id}.final_subtotal_cents == 9500"
            - "Order.${order_id}.points_earned == 166"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_available_quarantined_cycle
        grounds:
          - "state_machines.Lot.AVAILABLE_to_QUARANTINED"
          - "state_machines.Lot.QUARANTINED_to_AVAILABLE"
          - "entities.Lot.fields.status"
        distinguishing_aspect: "Lot loops AVAILABLE -> QUARANTINED -> AVAILABLE (a cycle); after the round trip the status is AVAILABLE again — a non-linear cyclic machine on Lot."
        test_recipe:
          setup:
            - "A product with one AVAILABLE lot that has been QUARANTINED."
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Cycle SKU", form: "POWDER", regimen_goals: ["DIGESTION"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "CY-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 5 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /lots/${lot_id}/state"
              payload: { to_status: "QUARANTINED" }
              as: StoreOperator
          trigger:
            - call: "POST /lots/${lot_id}/state"
              payload: { to_status: "AVAILABLE" }
              as: StoreOperator
          assert:
            - "Lot.${lot_id}.status == AVAILABLE"

      - name: subscription_active_paused_cycle
        grounds:
          - "state_machines.Subscription.ACTIVE_to_PAUSED"
          - "state_machines.Subscription.PAUSED_to_ACTIVE"
          - "entities.Subscription.fields.status"
        distinguishing_aspect: "Subscription loops ACTIVE -> PAUSED -> ACTIVE (a cycle) on a different entity than Lot; resume restores ACTIVE and re-enables generate-order."
        test_recipe:
          setup:
            - "A customer with an ACTIVE 60-day subscription that has been PAUSED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "Cust Four" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Sub SKU", form: "LIQUID", regimen_goals: ["SLEEP"], dshea_claim_type: "NONE", unit_price_cents: 2000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 60, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/state"
              payload: { to_status: "PAUSED" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/state"
              payload: { to_status: "ACTIVE" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_release_short_cascade
        grounds:
          - "state_machines.Lot.AVAILABLE_to_RECALLED"
          - "entities.OrderLine.fields.short_quantity"
          - "entities.OrderLine.fields.lot_allocations"
          - "entities.Lot.fields.quantity_reserved"
          - "state_machines.Order.PLACED_to_FULFILLED"
          - "entities.Order.fields.final_subtotal_cents"
        distinguishing_aspect: "Depth-3 chain from a lot recall: Lot->RECALLED releases its RESERVED allocation (hop 1) which increments OrderLine.short_quantity (hop 2, caused by the release) which drops the Order.final_subtotal to 0 at fulfil (hop 3, caused by the short); each hop caused by the prior."
        test_recipe:
          setup:
            - "A customer; product priced 5000; a lot with exactly 2 units; a one-off order with one line of quantity 2, PLACED so the 2 units are RESERVED against the lot."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "Cust Five" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Recall SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "RC-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 2 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /lots/${lot_id}/state"
              payload: { to_status: "RECALLED", reason: "supplier defect", severity: "CLASS_II" }
              as: StoreOperator
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: StoreOperator
          assert:
            - "Lot.${lot_id}.quantity_reserved == 0"
            - "OrderLine.${line_id}.short_quantity == 2"
            - "Order.${order_id}.final_subtotal_cents == 0"

      - name: customer_suspend_pause_cancel_cascade
        grounds:
          - "state_machines.Customer.ACTIVE_to_SUSPENDED"
          - "state_machines.Subscription.ACTIVE_to_PAUSED"
          - "state_machines.Order.DRAFT_to_CANCELLED"
          - "entities.Subscription.fields.status"
          - "entities.Order.fields.status"
        distinguishing_aspect: "Depth-2 chain from a different trigger (customer suspend): Customer->SUSPENDED pauses its ACTIVE Subscription (hop 1) which in turn cancels that subscription's DRAFT auto-ship Order (hop 2, caused by the pause)."
        test_recipe:
          setup:
            - "A customer with an ACTIVE 30-day subscription and a DRAFT auto-ship order already generated from it."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "Cust Six" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Casc SKU", form: "TABLET", regimen_goals: ["ENERGY"], dshea_claim_type: "NONE", unit_price_cents: 3000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "CS-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 30, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /subscriptions/${sub_id}/generate-order"
              payload: { expected_subscription_version: "${sub_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /customers/${cust_id}/suspend"
              payload: {}
              as: StoreOperator
          assert:
            - "Customer.${cust_id}.status == SUSPENDED"
            - "Subscription.${sub_id}.status == PAUSED"
            - "Order.${order_id}.status == CANCELLED"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_over_inventory_conflict
        grounds:
          - "validations[priority=5]"
          - "validations[priority=15]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_INSUFFICIENT_INVENTORY]"
        distinguishing_aspect: "Category pair state vs business_constraint: an already-PLACED order (which reserved the entire lot, leaving 0 available) re-placed fails the priority-5 state check with ERR_INVALID_STATE, NOT the priority-15 ERR_INSUFFICIENT_INVENTORY, even though both hold."
        test_recipe:
          setup:
            - "A customer; product; a lot with exactly 3 units; a one-off order with one line of quantity 3 already PLACED (all 3 units reserved, 0 available)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "Cust Seven" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Conflict SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 4000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "CF-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 3 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "The second place returns error_id ERR_INVALID_STATE with HTTP 409 (not ERR_INSUFFICIENT_INVENTORY)."

      - name: safety_over_fiscal_conflict
        grounds:
          - "validations[priority=7]"
          - "validations[priority=17]"
          - "errors[ERR_PRACTITIONER_AUTH_REQUIRED]"
          - "errors[ERR_INSUFFICIENT_POINTS]"
        distinguishing_aspect: "Category pair business_safety vs business_fiscal: placing an order for a practitioner-line product with no recommendation AND redeeming more points (100) than the balance (0) fails the priority-7 ERR_PRACTITIONER_AUTH_REQUIRED, NOT the priority-17 ERR_INSUFFICIENT_POINTS."
        test_recipe:
          setup:
            - "A customer with 0 points balance; a practitioner-line product with a lot; a one-off order created with points_redeemed 100 and one line of the practitioner-line product; no recommendation exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c8@x.com", full_name: "Cust Eight" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Rx SKU", form: "CAPSULE", regimen_goals: ["JOINT"], is_practitioner_line: true, dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "RX-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: { points_redeemed: 100 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "place returns error_id ERR_PRACTITIONER_AUTH_REQUIRED with HTTP 403 (not ERR_INSUFFICIENT_POINTS)."

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: inventory_exact_available_boundary
        grounds:
          - "calculations.fefo_allocation"
          - "validations[priority=15]"
          - "errors[ERR_INSUFFICIENT_INVENTORY]"
        distinguishing_aspect: "Numeric inventory threshold on the place endpoint: a line for exactly the available count (10) succeeds and drives available to 0, but a line for available+1 (11) is rejected ERR_INSUFFICIENT_INVENTORY."
        test_recipe:
          setup:
            - "A customer; a product; lot L1 with 10 units placed to exhaustion by one order (available now 0); a fresh lot L2 with 10 units; a second order carrying an 11-unit line."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c9@x.com", full_name: "Cust Nine" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Boundary SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "BD-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot1: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_ok: "$.data.id" }
            - call: "POST /orders/${order_ok}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_ok: "$.data.id" }
            - call: "POST /orders/${order_ok}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "BD-2", expiration_date: "2027-02-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot2: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_bad: "$.data.id" }
            - call: "POST /orders/${order_bad}/lines"
              payload: { product_id: "${prod_id}", quantity: 11 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_bad: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_bad}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Order.${order_ok}.status == PLACED"
            - "place of order_bad returns error_id ERR_INSUFFICIENT_INVENTORY with HTTP 409."

      - name: zero_quantity_line_boundary
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_INVALID_QUANTITY]"
          - "entities.OrderLine.fields.quantity"
        distinguishing_aspect: "Zero-count boundary on a different endpoint (add-line): a line with quantity 0 is rejected ERR_INVALID_QUANTITY (quantity must be >= 1), a metric distinct from the inventory-threshold boundary."
        test_recipe:
          setup:
            - "A customer with a DRAFT one-off order and a product."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c10@x.com", full_name: "Cust Ten" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Zero SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "add-line returns error_id ERR_INVALID_QUANTITY with HTTP 422."

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_place_requires_customer_active
        grounds:
          - "state_machines.Order.DRAFT_to_PLACED"
          - "entities.Customer.fields.status"
          - "validations[priority=9]"
          - "errors[ERR_CUSTOMER_SUSPENDED]"
        distinguishing_aspect: "Entity pair Order<-Customer: Order DRAFT->PLACED is gated on Customer.status==ACTIVE; suspending the customer makes place fail ERR_CUSTOMER_SUSPENDED."
        test_recipe:
          setup:
            - "A customer with a DRAFT one-off order (one line, inventory available), then the customer is SUSPENDED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c11@x.com", full_name: "Cust Eleven" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Susp SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "SU-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/suspend"
              payload: {}
              as: StoreOperator
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "place returns error_id ERR_CUSTOMER_SUSPENDED with HTTP 409."

      - name: practitioner_line_requires_recommendation
        grounds:
          - "state_machines.Order.DRAFT_to_PLACED"
          - "entities.Recommendation.fields.status"
          - "entities.Product.fields.is_practitioner_line"
          - "validations[priority=7]"
        distinguishing_aspect: "Entity pair Order<-Recommendation (distinct from Order<-Customer): with a valid ISSUED recommendation for (customer, product) present, placing a practitioner-line line succeeds — proving the transition depends on Recommendation state."
        test_recipe:
          setup:
            - "A customer; a practitioner; a practitioner-line product with a lot; an ISSUED recommendation for (customer, product) with 5 units; a DRAFT order with one line of quantity 2."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c12@x.com", full_name: "Cust Twelve" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /practitioners"
              payload: { full_name: "Dr Ada", license_number: "LIC-1" }
              as: StoreOperator
              captures: { prac_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Rx Ok SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], is_practitioner_line: true, dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "RXOK-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /recommendations"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", expires_at: "2026-12-31T00:00:00Z", max_units: 5 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { rec_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.status == PLACED"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: recommendation_interval_overlap
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_RECOMMENDATION_OVERLAP]"
          - "entities.Recommendation.fields.issued_at"
          - "entities.Recommendation.fields.expires_at"
        distinguishing_aspect: "Half-open interval overlap on the Recommendation resource: a second ISSUED recommendation for the same (customer, product) whose [issued_at, expires_at) overlaps the first's [2026-07-01, 2026-12-31) is rejected ERR_RECOMMENDATION_OVERLAP."
        test_recipe:
          setup:
            - "Clock at 2026-07-01; a customer; a practitioner; a practitioner-line product; one ISSUED recommendation for (customer, product) valid until 2026-12-31."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c13@x.com", full_name: "Cust Thirteen" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /practitioners"
              payload: { full_name: "Dr Bee", license_number: "LIC-2" }
              as: StoreOperator
              captures: { prac_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Overlap SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], is_practitioner_line: true, dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreOperator
            - call: "POST /recommendations"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", expires_at: "2026-12-31T00:00:00Z", max_units: 5 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { rec1: "$.data.id" }
          trigger:
            - call: "POST /recommendations"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", expires_at: "2026-10-01T00:00:00Z", max_units: 3 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the second recommendation returns error_id ERR_RECOMMENDATION_OVERLAP with HTTP 409."

      - name: subscription_window_buffer_conflict
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_SUBSCRIPTION_WINDOW_CONFLICT]"
          - "entities.Subscription.fields.next_ship_date"
        distinguishing_aspect: "Closed buffer adjacency on the Subscription resource (distinct interval semantics from the half-open recommendation overlap): a second subscription for the same (customer, product) whose first_ship_date is only 2 days after the existing next_ship_date — strictly within the 7-day buffer — is rejected ERR_SUBSCRIPTION_WINDOW_CONFLICT."
        test_recipe:
          setup:
            - "A customer; a product; one ACTIVE subscription for that product with next_ship_date 2026-08-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c14@x.com", full_name: "Cust Fourteen" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Window SKU", form: "TABLET", regimen_goals: ["SLEEP"], dshea_claim_type: "NONE", unit_price_cents: 2000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 30, first_ship_date: "2026-08-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub1: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { product_id: "${prod_id}", quantity_per_cycle: 1, cadence_days: 30, first_ship_date: "2026-08-03T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the second subscription returns error_id ERR_SUBSCRIPTION_WINDOW_CONFLICT with HTTP 409."

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_reservation_conservation
        grounds:
          - "state_machines.Order.DRAFT_to_PLACED"
          - "state_machines.Order.PLACED_to_CANCELLED"
          - "entities.Lot.fields.quantity_available"
          - "entities.Lot.fields.quantity_reserved"
          - "entities.Lot.fields.quantity_on_hand"
        distinguishing_aspect: "Conserved quantity = on-hand inventory units: place (reserve 4) followed by cancel (release 4) restores lot.quantity_reserved to 0 and quantity_available to 10 == quantity_on_hand, i.e. quantity_available == quantity_on_hand - quantity_reserved is invariant across the forward+compensating pair."
        test_recipe:
          setup:
            - "A customer; a product; a lot with 10 units; a one-off order with one line of quantity 4 that was PLACED (reserving 4)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c15@x.com", full_name: "Cust Fifteen" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Conserve SKU", form: "CAPSULE", regimen_goals: ["IMMUNITY"], dshea_claim_type: "NONE", unit_price_cents: 1000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "CN-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 4 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Lot.${lot_id}.quantity_reserved == 0"
            - "Lot.${lot_id}.quantity_available == 10"
            - "Lot.${lot_id}.quantity_on_hand == 10"

      - name: loyalty_points_conservation
        grounds:
          - "state_machines.Order.PLACED_to_FULFILLED"
          - "state_machines.Return.APPROVED_to_REFUNDED"
          - "entities.Customer.fields.points_balance"
          - "calculations.return_refund"
          - "calculations.loyalty_points_earned"
        distinguishing_aspect: "Conserved quantity = loyalty points (distinct from inventory units): fulfilling the order credits 100 points to points_balance and fully returning it reverses exactly 100, leaving points_balance back at its pre-fulfilment value of 0."
        test_recipe:
          setup:
            - "A BRONZE customer with 0 points; product priced 5000; lot with 10 units; a one-off order with one line of quantity 2 that is PLACED and FULFILLED (earning 100 points), then a full-quantity DEFECT return that is APPROVED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c16@x.com", full_name: "Cust Sixteen" }
              as: StoreOperator
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "Points SKU", form: "CAPSULE", regimen_goals: ["SLEEP"], dshea_claim_type: "NONE", unit_price_cents: 5000 }
              as: StoreOperator
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/lots"
              payload: { lot_number: "PT-1", expiration_date: "2027-01-01T00:00:00Z", quantity_received: 10 }
              as: StoreOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: "$.data.id" }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: StoreOperator
            - call: "POST /returns"
              payload: { order_id: "${order_id}", order_line_id: "${line_id}", quantity: 2, reason: "DEFECT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: "$.data.id" }
            - call: "POST /returns/${ret_id}/state"
              payload: { to_status: "APPROVED" }
              as: StoreOperator
          trigger:
            - call: "POST /returns/${ret_id}/state"
              payload: { to_status: "REFUNDED" }
              as: StoreOperator
          assert:
            - "Customer.${cust_id}.points_balance == 0"
