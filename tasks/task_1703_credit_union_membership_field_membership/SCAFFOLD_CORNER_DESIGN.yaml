            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 50000, posted_date: "2026-08-01" }, as: OperationsOfficer }
          trigger:
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "WITHDRAWAL", amount_cents: 30000, posted_date: "2026-08-01" }, as: OperationsOfficer, captures: { rb: "$.data.running_balance_cents" } }
            - { call: "GET /credit-union/share-accounts/${acct1}/transactions", as: OperationsOfficer, captures: { r1: "$.data[1].running_balance_cents", r2: "$.data[2].running_balance_cents" } }
          assert:
            - "r1 == 150000 and rb == 120000 and r2 == 120000 (created_at ASC breaks the same-date tie)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: occ_check_precedes_business_temporal_errors
        claim_type: priority_conflict
        grounds: ["validations[priority=6]", "validations[priority=11]", "errors[ERR_STALE_CHARTER_VERSION]"]
        distinguishing_aspect: "A submission that is both stale-baselined and carries a past effective_date MUST surface the 412 OCC error, not the temporal 422."
        test_recipe:
          setup: ["charter at version 2 after a first amendment submission; filer still holds baseline version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id", charter_v1: "$.data.version" } }
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "ADD_SEGMENT", proposed_segment_type: "COMMUNITY", proposed_segment_descriptor: "Riverside County residents", proposed_segment_required_documents: ["GOVERNMENT_ID", "ADDRESS_PROOF"], effective_date: "2026-09-01", expected_charter_version: "${charter_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "ADD_SEGMENT", proposed_segment_type: "COMMUNITY", proposed_segment_descriptor: "Old Town residents", proposed_segment_required_documents: ["GOVERNMENT_ID", "ADDRESS_PROOF"], effective_date: "2026-07-01", expected_charter_version: "${charter_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_STALE_CHARTER_VERSION (412): the OCC check (priority 6) precedes ERR_EFFECTIVE_DATE_NOT_FUTURE (priority 11)"

      - name: existence_precedes_state_on_action_endpoints
        claim_type: priority_conflict
        grounds: ["validations[priority=5]", "validations[priority=7]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Approving a nonexistent application id returns ERR_NOT_FOUND (404), never a state-machine error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /credit-union/membership-applications/00000000-0000-0000-0000-000000000000/approve", as: MembershipOfficer, as_user_id: "officer-9", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND (404)"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Authentication is priority 1: a request with no user headers fails with 401 even when the body is otherwise valid."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /credit-union/charters", payload: { bond_type: "COMMUNITY", par_value_cents: 500, segments: [] }, as: "", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_UNAUTHENTICATED (401)"

      - name: syntactic_validation_precedes_existence
        claim_type: priority_conflict
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "An out-of-range enum (basis FOOBAR) plus a nonexistent segment_id returns 400 ERR_VALIDATION_FAILED, not 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Bad Enum", date_of_birth: "1990-01-01", basis: "FOOBAR", segment_id: "00000000-0000-0000-0000-000000000000", documents_provided: [] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION_FAILED (400)"

      - name: member_role_cannot_read_other_members_record
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "The Member role is scoped by ownership: member m1 reading member m2's record is a 403 ERR_NOT_RESOURCE_OWNER, while reading their own record succeeds."
        test_recipe:
          setup: ["two approved members m1, m2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Owner One", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Owner Two", date_of_birth: "1990-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app2: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app2}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m2: "$.data.resulting_member_id" } }
          trigger:
            - { call: "GET /credit-union/members/${m2}", as: Member, as_user_id: "${m1}", captures: { err: "$.data.error_id" } }
            - { call: "GET /credit-union/members/${m1}", as: Member, as_user_id: "${m1}", captures: { own_name: "$.data.full_name" } }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER (403)"
            - "own_name == 'Owner One' (own record readable)"

      - name: segregation_filer_cannot_approve_own_application
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The deciding MembershipOfficer must differ from the filer; same X-User-ID yields 403 even when every other precondition passes."
        test_recipe:
          setup: ["complete SEGMENT_MATCH application filed by officer-1"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Self Approve", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id", filer: "$.data.filed_by_user_id" } }
          trigger:
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { st: "$.data.status" } }
          assert:
            - "filer == officer-1 and err == ERR_SEGREGATION_OF_DUTIES (403)"
            - "the same approve by officer-2 succeeds: st == APPROVED"

      - name: segregation_flagger_cannot_confirm_own_review
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.EligibilityReview]
        distinguishing_aspect: "The confirming ComplianceOfficer must differ from the flagging one; the same actor is rejected with 403, a different actor succeeds."
        test_recipe:
          setup: ["member flagged by co-1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "SoD Sam", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev1: "$.data.id" } }
          trigger:
            - { call: "POST /credit-union/eligibility-reviews/${rev1}/confirm-ineligible", as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev1}/confirm-ineligible", as: ComplianceOfficer, as_user_id: "co-2", captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (403) for co-1"
            - "st == CONFIRMED_INELIGIBLE for co-2"

      - name: sponsor_not_active_at_approval
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_SPONSOR_NOT_ELIGIBLE]", entities.Member.fields.sponsor_member_id]
        distinguishing_aspect: "The sponsor's status is re-validated at approval time: the sponsor was ACTIVE when the FAMILY application was filed but is INELIGIBLE_UNDER_REVIEW at approval, so approval fails."
        test_recipe:
          setup: ["sponsor member approved; FAMILY application filed (docs complete); sponsor then flagged -> INELIGIBLE_UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Sponsor Sue", date_of_birth: "1985-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appS: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appS}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mS: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Family Fred", date_of_birth: "1992-02-02", basis: "FAMILY", sponsor_member_id: "${mS}", relationship_to_sponsor: "SPOUSE", documents_provided: ["GOVERNMENT_ID", "RELATIONSHIP_PROOF"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appF: "$.data.id", docs_ok: "$.data.docs_complete" } }
            - { call: "POST /credit-union/members/${mS}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /credit-union/membership-applications/${appF}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "docs_ok == true (creation-time validation passed while sponsor was ACTIVE)"
            - "err == ERR_SPONSOR_NOT_ELIGIBLE (422) at approval"

      - name: documentation_incomplete_blocks_approval
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DOCUMENTATION_INCOMPLETE]", entities.MembershipApplication.fields.docs_complete]
        distinguishing_aspect: "docs_complete is a hard approval gate: missing one required code yields 422 and no Member is created."
        test_recipe:
          setup: ["SEGMENT_MATCH application with only GOVERNMENT_ID (EMPLOYER_LETTER required)"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Docs Dana", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id", docs_ok: "$.data.docs_complete" } }
          trigger:
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "docs_ok == false and err == ERR_DOCUMENTATION_INCOMPLETE (422)"

      - name: bond_type_mismatch_on_add_segment
        claim_type: conditional_validation
        grounds: ["validations[priority=9]", "errors[ERR_BOND_TYPE_MISMATCH]"]
        distinguishing_aspect: "A SINGLE_OCCUPATIONAL charter rejects an ASSOCIATIONAL proposed segment; the same payload is accepted under a MULTIPLE_COMMON_BOND charter (conditional on charter config)."
        test_recipe:
          setup: ["SINGLE_OCCUPATIONAL charter at version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "SINGLE_OCCUPATIONAL", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id", charter_v: "$.data.version" } }
          trigger:
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "ADD_SEGMENT", proposed_segment_type: "ASSOCIATIONAL", proposed_segment_descriptor: "Riverside Teachers Association members", proposed_segment_required_documents: ["GOVERNMENT_ID", "ASSOCIATION_CARD"], effective_date: "2026-09-01", expected_charter_version: "${charter_v}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_BOND_TYPE_MISMATCH (422)"

      - name: effective_date_must_be_future_at_approval
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "errors[ERR_EFFECTIVE_DATE_NOT_FUTURE]", state_machines.CharterAmendmentApplication.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "effective_date is validated again at approval: a date that was future at submission but has passed by approval yields 422."
        test_recipe:
          setup: ["amendment submitted 2026-08-01 with effective_date 2026-08-10; clock advanced to 2026-08-12 before the Regulator acts"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id", charter_v: "$.data.version" } }
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "ADD_SEGMENT", proposed_segment_type: "COMMUNITY", proposed_segment_descriptor: "Riverside County residents", proposed_segment_required_documents: ["GOVERNMENT_ID", "ADDRESS_PROOF"], effective_date: "2026-08-10", expected_charter_version: "${charter_v}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { amend1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /credit-union/charter-amendment-applications/${amend1}/approve", as: Regulator, as_user_id: "reg-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_EFFECTIVE_DATE_NOT_FUTURE (422); amendment remains SUBMITTED"

      - name: dividend_not_yet_payable_then_payable_on_date
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "errors[ERR_DIVIDEND_NOT_YET_PAYABLE]", state_machines.DividendDeclaration.DECLARED_to_PAID]
        distinguishing_aspect: "Payment is date-gated with an inclusive boundary: 2026-08-09 fails, 2026-08-10 (== payable_date) succeeds."
        test_recipe:
          setup: ["DECLARED declaration with payable_date 2026-08-10, no eligible accounts"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl1: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations/${decl1}/pay", as: OperationsOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations/${decl1}/pay", as: OperationsOfficer, captures: { st: "$.data.status", paid: "$.data.paid_total_cents" } }
          assert:
            - "err == ERR_DIVIDEND_NOT_YET_PAYABLE (409) on 2026-08-09"
            - "st == PAID and paid == 0 on 2026-08-10 (>= boundary)"

      - name: payable_date_must_exceed_period_end
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DATE_ORDER_INVALID]"]
        distinguishing_aspect: "payable_date equal to period_end violates the strict ordering (payable > period_end)."
        test_recipe:
          setup: ["empty database, clock at default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-07-31" }, as: BoardDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DATE_ORDER_INVALID (422)"

      - name: meeting_date_ordering_rule
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DATE_ORDER_INVALID]", entities.AnnualMeeting.fields.voting_open_date]
        distinguishing_aspect: "record_date must be strictly before voting_open_date, which must be <= meeting_date; voting_open before record violates the ordering."
        test_recipe:
          setup: ["empty database, clock at default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-09-15", record_date: "2026-08-20", voting_open_date: "2026-08-10", quorum_threshold: 1 }, as: BoardDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DATE_ORDER_INVALID (422)"

      - name: transaction_posted_date_bounds
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_TRANSACTION_DATE]"]
        distinguishing_aspect: "posted_date must lie inside [opened_date, current date]: a future date and a pre-opening date both fail with the same 422."
        test_recipe:
          setup: ["PRIMARY 100,000 opened at clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Date Drew", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
          trigger:
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 100, posted_date: "2026-08-02" }, as: OperationsOfficer, captures: { err_future: "$.data.error_id" } }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 100, posted_date: "2026-07-31" }, as: OperationsOfficer, captures: { err_past: "$.data.error_id" } }
