              payload: { reason: "CERT_EXPIRED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /farriers/${fr1}/reactivate"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "Farrier.${fr1}.status == DECERTIFIED"

