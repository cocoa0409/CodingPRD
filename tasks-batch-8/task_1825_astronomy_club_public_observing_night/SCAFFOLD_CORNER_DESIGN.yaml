  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_telescope_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[telescope-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT /club/telescopes/{id} with expected_telescope_version behind current version is rejected 412 ERR_STALE_VERSION; correct version succeeds and bumps version by 1."
        test_recipe:
          setup: ["telescope created (version 1); a loan reserve/cancel pair bumps version"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "OCC Olga", email: "olga@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "OCC Scope", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope_id: $.data.id, v0: $.data.version }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFRACTOR", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-07T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /club/loan-reservations/${loan_id}/cancel"
              payload: {}
              as: EquipmentChair
            - call: "GET /club/telescopes/${scope_id}"
              payload: {}
              as: EquipmentChair
              captures: { v1: $.data.version }
          trigger:
            - call: "PUT /club/telescopes/${scope_id}"
              payload: { name: "Renamed", expected_telescope_version: "${v0}" }
              as: EquipmentChair
              captures: { err: $.data.error_id }
            - call: "PUT /club/telescopes/${scope_id}"
              payload: { name: "Renamed", expected_telescope_version: "${v1}" }
              as: EquipmentChair
              captures: { ok_name: $.data.name, ok_v: $.data.version }
          assert:
            - "err == ERR_STALE_VERSION (412) — ${v0} predates the reserve/cancel bumps"
            - "ok_name == Renamed"
            - "ok_v == ${v1} + 1"

      - name: stale_event_version_on_confirm
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[event-confirm-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirm carrying a pre-accept version is rejected 412; re-reading then confirming succeeds."
        test_recipe:
          setup: ["SCHEDULED event, operator accepted (version bumped by coverage recompute)"]
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "OCC Eve", email: "eve@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/telescopes"
              payload: { name: "Eve Scope", equipment_class: "DOBSONIAN" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "DOBSONIAN", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/observing-events"
              payload: { title: "OCC PN", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-20T01:00:00Z", window_end: "2026-08-20T05:00:00Z", moon_illumination_pct: 10, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
              captures: { ev_v1: $.data.version }
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${event_id}", member_id: "${member_id}", telescope_id: "${scope_id}" }
              as: EventCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /club/event-operator-assignments/${asg_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /club/observing-events/${event_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v2: $.data.version }
          trigger:
            - call: "POST /club/observing-events/${event_id}/confirm"
              payload: { expected_event_version: "${ev_v1}" }
              as: EventCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /club/observing-events/${event_id}/confirm"
              payload: { expected_event_version: "${ev_v2}" }
              as: EventCoordinator
              captures: { ok_status: $.data.status }
          assert:
            - "err == ERR_STALE_VERSION (ev_v1 predates the accept-triggered coverage bump)"
            - "ok_status == CONFIRMED"

      - name: derived_condition_score_reconciles_across_tickets
        claim_type: derived_field_reconciliation
        grounds: ["calculations.condition_score_reconcile", "entities.Telescope.fields.condition_score"]
        distinguishing_aspect: "condition_score recomputed from ALL CLOSED tickets on each close: two tickets with deltas -10 and -5 yield 85, and closing order does not matter (commutative recompute)."
        test_recipe:
          setup: ["telescope; ticket T1 (-10) closed; ticket T2 (-5) closed"]
          setup_api_calls:
            - call: "POST /club/telescopes"
              payload: { name: "Score Scope", equipment_class: "SCT" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/maintenance-tickets"
              payload: { telescope_id: "${scope_id}", kind: "REPAIR", severity: "LOW", condition_delta: -10 }
              as: EquipmentChair
              captures: { t1: $.data.id }
            - call: "POST /club/maintenance-tickets/${t1}/start"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets/${t1}/submit-verification"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets/${t1}/close"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets"
              payload: { telescope_id: "${scope_id}", kind: "CLEANING", severity: "LOW", condition_delta: -5 }
              as: EquipmentChair
              captures: { t2: $.data.id }
            - call: "POST /club/maintenance-tickets/${t2}/start"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets/${t2}/submit-verification"
              payload: {}
              as: EquipmentChair
          trigger:
            - call: "POST /club/maintenance-tickets/${t2}/close"
              payload: {}
              as: EquipmentChair
            - call: "GET /club/telescopes/${scope_id}"
              payload: {}
              as: EquipmentChair
              captures: { score: $.data.condition_score, status: $.data.status }
          assert:
            - "score == 85 (100 - 10 - 5)"
            - "status == AVAILABLE (all tickets closed)"

