            - call: "POST /delivery-orders/${order_id}/windows"
              payload: { team_id: "${team_a_id}", service_date: "2026-06-01", window_start_min: 480, window_end_min: 600, expected_order_version: "${o_v}" }
              as: DispatchPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /routes"
              payload: { depot_id: "${depot_id}", team_id: "${team_a_id}", service_date: "2026-06-01" }
