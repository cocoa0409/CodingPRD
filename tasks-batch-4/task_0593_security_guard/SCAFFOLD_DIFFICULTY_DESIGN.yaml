scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: shift_provisional_vs_final_billable_diverge
        grounds:
          - calculations.shift_billable_amount
          - calculations.tour_compliance
          - entities.CoverageShift.fields.provisional_billable_cents
          - entities.CoverageShift.fields.final_billable_cents
          - entities.CoverageShift.fields.sla_credit_cents
          - state_machines.CoverageShift.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          This dual variant lives in the COST domain on CoverageShift: the PROVISIONAL variant bills
          scheduled hours flat (33750) while the FINAL variant ceils actual hours to the quarter,
          caps at scheduled+0.5h and deducts a 10% SLA credit for sub-floor tour compliance (31387) —
          two different integers from the same shift row.
        test_recipe:
          setup:
            - "Logical clock at the 2026-05-01T00:00:00Z default."
            - "Client Acme, Site HQ, Post North Lobby with bill_rate 4500 c/h, four NFC checkpoint tags, tour floor 80.0, no required certs."
            - "Post has one PUBLISHED PostOrder."
            - "Guard Grace (pay_rate 2200 c/h) is ACTIVE and LICENSED."
            - "Shift 2026-05-04T08:00Z→16:00Z with a 30-minute break (scheduled_hours 7.5) is CONFIRMED to Grace."
            - "Grace clocks in on time, scans only 3 of the 4 checkpoint tags, and clocks out at 16:12Z (12 minutes of overrun)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Acme Holdings", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "HQ Campus" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "North Lobby", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: ["TAG_A", "TAG_B", "TAG_C", "TAG_D"], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v}", body_text: "Patrol the lobby every hour.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po_id: $.data.id }
            - call: "POST /post-orders/${po_id}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /guards"
              payload: { full_name: "Grace Hopper", employee_code: "G-001", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "L-001", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "CONFIRM" }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/clock-in"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /shifts/${shift_id}/scans"
              payload: { checkpoint_tag_uid: "TAG_A" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /shifts/${shift_id}/scans"
              payload: { checkpoint_tag_uid: "TAG_B" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /shifts/${shift_id}/scans"
              payload: { checkpoint_tag_uid: "TAG_C" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T16:12:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shifts/${shift_id}/clock-out"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
          assert:
            - "CoverageShift.${shift_id}.scheduled_hours == 7.5"
            - "CoverageShift.${shift_id}.provisional_billable_cents == 33750"
            - "CoverageShift.${shift_id}.billable_hours == 7.75"
            - "CoverageShift.${shift_id}.tour_compliance_pct == 75.00"
            - "CoverageShift.${shift_id}.sla_credit_cents == 3488"
            - "CoverageShift.${shift_id}.final_billable_cents == 31387"
            - "CoverageShift.${shift_id}.final_billable_cents != CoverageShift.${shift_id}.provisional_billable_cents"
            - "CoverageShift.${shift_id}.pay_cents == 17050"
            - "CoverageShift.${shift_id}.margin_cents == 14337"

      - name: guard_reliability_provisional_vs_verified_diverge
        grounds:
          - calculations.guard_reliability_score
          - entities.Guard.fields.reliability_score
          - entities.Guard.fields.verified_reliability_score
          - entities.Guard.fields.missed_checkpoint_count
          - state_machines.CoverageShift.COMPLETED_to_VERIFIED
        distinguishing_aspect: |
          This dual variant lives in the RISK domain on Guard (not on CoverageShift cost): the PROVISIONAL
          score counts the missed checkpoint of a COMPLETED-but-unverified shift (98.00) while the CONFIRMED
          score ignores unverified shifts entirely (100.00); supervisor VERIFY then collapses the gap to 98.00.
        test_recipe:
          setup:
            - "Same fixture as shift_provisional_vs_final_billable_diverge: Grace worked a 4-checkpoint post and scanned only 3 tags."
            - "The shift is COMPLETED (clocked out) but not yet supervisor-VERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Acme Holdings", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /sites"
              payload: { client_id: "${client_id}", name: "HQ Campus" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /posts"
              payload: { site_id: "${site_id}", name: "North Lobby", bill_rate_cents_per_hour: 4500, max_concurrent_guards: 1, required_cert_codes: [], checkpoint_tag_uids: ["TAG_A", "TAG_B", "TAG_C", "TAG_D"], tour_compliance_floor_pct: 80.0 }
              as: AccountManager
              captures: { post_id: $.data.id, post_v: $.data.version }
            - call: "POST /post-orders"
              payload: { post_id: "${post_id}", expected_post_version: "${post_v}", body_text: "Patrol the lobby every hour.", revision_label: "REV-A" }
              as: AccountManager
              captures: { po_id: $.data.id }
            - call: "POST /post-orders/${po_id}/publish"
              payload: {}
              as: AccountManager
            - call: "POST /guards"
              payload: { full_name: "Grace Hopper", employee_code: "G-001", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "L-001", expires_at: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
            - call: "POST /shifts"
              payload: { post_id: "${post_id}", scheduled_start_at: "2026-05-04T08:00:00Z", scheduled_end_at: "2026-05-04T16:00:00Z", planned_break_minutes: 30 }
              as: Scheduler
              captures: { shift_id: $.data.id, shift_v: $.data.version }
            - call: "POST /shifts/${shift_id}/assignments"
              payload: { guard_id: "${guard_id}", expected_shift_version: "${shift_v}" }
              as: Scheduler
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "CONFIRM" }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/clock-in"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /shifts/${shift_id}/scans"
              payload: { checkpoint_tag_uid: "TAG_A" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /shifts/${shift_id}/scans"
              payload: { checkpoint_tag_uid: "TAG_B" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /shifts/${shift_id}/scans"
              payload: { checkpoint_tag_uid: "TAG_C" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T16:12:00Z" }
              as: PlatformAdmin
            - call: "POST /shifts/${shift_id}/clock-out"
              payload: {}
              as: Guard
              as_user_id: "${guard_id}"
          trigger:
            - call: "GET /guards/${guard_id}"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /shifts/${shift_id}/actions"
              payload: { action: "VERIFY" }
              as: FieldSupervisor
            - call: "GET /guards/${guard_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Before VERIFY: Guard.${guard_id}.missed_checkpoint_count == 1"
            - "Before VERIFY: Guard.${guard_id}.reliability_score == 98.00"
            - "Before VERIFY: Guard.${guard_id}.verified_reliability_score == 100.00"
            - "Before VERIFY: Guard.${guard_id}.reliability_score != Guard.${guard_id}.verified_reliability_score"
            - "After VERIFY: Guard.${guard_id}.verified_reliability_score == 98.00"
            - "After VERIFY: Guard.${guard_id}.reliability_score == 98.00"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: weekly_overtime_with_night_differential_straddle
        grounds:
          - calculations.guard_weekly_pay
          - entities.CoverageShift.fields.overtime_hours
          - entities.CoverageShift.fields.pay_cents
          - entities.CoverageShift.fields.paid_hours
        distinguishing_aspect: |
          Mode (a) — four interacting inputs (paid hours, the chronological weekly accumulator, the night-window
          rate branch and the 1.5x overtime multiplier) with nested min/max: the Saturday 22:00Z night shift
          straddles the 40h line, splitting 8.00 paid hours into 4.00 regular + 4.00 overtime at the
          night-differential rate of 2420 c/h, yielding exactly 24200 cents.
        test_recipe:
          setup:
            - "Guard Nox (pay_rate 2200 c/h) is ACTIVE and LICENSED; post has no checkpoints and no required certs."
            - "Three completed 12-hour day shifts (Mon/Wed/Fri 2026-05-04/06/08, 08:00Z→20:00Z, no break) put 36.00 paid hours on the ISO week starting 2026-05-04."
            - "A fourth shift runs Sat 2026-05-09T22:00Z→Sun 2026-05-10T06:00Z (8h, no break), starting inside the night window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Nyx Logistics", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
