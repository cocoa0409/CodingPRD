      - name: cyclic_shape_analysis_return_loop_bounded
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.CoverageAnalysis.transitions[RETURNED -> DRAFT]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / analysis_return_loop_closes_twice_then_is_bounded"
          rationale: "That instance walks the DRAFT -> UNDER_REVIEW -> RETURNED -> DRAFT loop twice and asserts ERR_RETURN_LIMIT_EXCEEDED on the third return, covering both the loop closure and its termination condition."

      - name: parallel_shape_charge_dimensions_independent
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Charge.note
        excluded_because:
          difficulty_instance: "non_linear_state_machine / charge_routing_and_billing_dimensions_move_independently"
          rationale: "That instance asserts each combination of routing_state x billing_state reached by the three review decisions and the invoice submission, which is the parallel-dimension claim in full."

      - name: guarded_transition_charge_review_gated_by_study_posture
        claim_type: guarded_transitions
        grounds:
          - state_machines.Charge.transitions[UNROUTED -> ROUTED_PAYER].preconditions
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / payer_routing_requires_study_qct_state_not_charge_state"
          rationale: "That instance asserts the RT-1 cross-entity precondition (study.billing_hold_posture == OPEN) failing and then passing without the charge itself changing."

      - name: cross_entity_side_effect_amendment_rebuild_chain
        claim_type: cross_entity
        grounds:
          - state_machines.Amendment.transitions[SUBMITTED -> IMPLEMENTED].side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / amendment_implementation_five_level_rebuild_cascade"
          rationale: "That instance verifies all five cascade links end to end, including the StudyCalendar and Charge rows the amendment adjusts."

      - name: ledger_sync_after_charge_state_change
        claim_type: ledger_sync
        grounds:
          - calculations.study_ledger_rollup
        excluded_because:
          difficulty_instance: "compensating_invariant / audit_refund_conserves_total_payer_position"
          rationale: "That instance reconciles the study's payer rollup fields before and after the charge's billing_state change, which is the ledger-sync claim."

      - name: compensation_reverses_invoice_submission
        claim_type: compensation
        grounds:
          - state_machines.Charge.transitions[INVOICED_SPONSOR -> UNBILLED]
        excluded_because:
          difficulty_instance: "compensating_invariant / invoice_dispute_release_conserves_sponsor_position_and_aging"
          rationale: "That instance asserts BL-4 undoing BL-3 with no drift, including the preserved unbilled_since that proves the aging clock was not reset."

