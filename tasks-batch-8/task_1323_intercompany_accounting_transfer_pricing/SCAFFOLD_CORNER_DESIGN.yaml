# =============================================================================
# §1.9 Scaffold Corner Design — task_1323 intercompany transfer pricing
# Enumerative coverage of every §1.1–§1.7 testable claim not already covered
# by §1.8. excluded_because stubs cite the covering §1.8 instance by name.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: fiscal_year_create_computes_cbc_and_defaults
        claim_type: creation
        grounds: [entities.FiscalYear, calculations.cbcr_threshold_check]
        distinguishing_aspect: "Create with revenue below threshold: status OPEN, cbc_required false (computed), consolidated net 0, version 1 — creation + computed + initial state in one probe."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id, st: $.data.status, cbc: $.data.cbc_required, v: $.data.version } }
          assert:
            - "FiscalYear.${fy}.status == OPEN"
            - "FiscalYear.${fy}.cbc_required == false"
            - "FiscalYear.${fy}.consolidated_intercompany_net_cents == 0"
            - "FiscalYear.${fy}.version == 1"

      - name: legal_entity_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.LegalEntity.fields.country_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input country_code yields ERR_INVALID_REQUEST (400); no entity is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/legal_entities", payload: { name: "NoCountryCo", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: entity_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.LegalEntity]
        distinguishing_aspect: "Client-supplied id/version on create are ignored: server mints a UUID id and version starts at 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/legal_entities", payload: { name: "SysCo", country_code: "US", functional_currency: "USD", id: "11111111-1111-1111-1111-111111111111", version: 99 }, as: GroupTaxAdmin, captures: { e: $.data.id, v: $.data.version } }
          assert:
            - "LegalEntity.${e}.id != '11111111-1111-1111-1111-111111111111'"
            - "LegalEntity.${e}.version == 1"

      - name: transaction_computed_price_and_margin_at_booking
        claim_type: computed_fields
        grounds: [entities.ICTransaction.fields.provisional_al_price_cents, entities.ICTransaction.fields.margin_bp, calculations.provisional_price_calc]
        distinguishing_aspect: "Booking computes provisional_al_price_cents = 1020000 (cost 1000000, markup 200bp) and margin_bp = 200 from booked revenue; both read-only computed."
        test_recipe:
          setup: ["Year 2026 OPEN; E1/E2 ACTIVE; study CURRENT; agreement markup 200 ACTIVE"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx: $.data.id, p: $.data.provisional_al_price_cents, m: $.data.margin_bp } }
          assert:
            - "ICTransaction.${tx}.provisional_al_price_cents == 1020000"
            - "ICTransaction.${tx}.margin_bp == 200"
            - "ICTransaction.${tx}.elimination_status == UNMATCHED and settlement_status == UNSETTLED (initial parallel state)"

      - name: agreement_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tp/agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: TaxManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_amendment_from_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IntercompanyAgreement, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "approve_amendment is only defined from UNDER_AMENDMENT; calling it on an ACTIVE agreement fails with ERR_INVALID_STATE_TRANSITION and leaves markup unchanged."
        test_recipe:
          setup: ["Year 2026; E1/E2; study CURRENT; agreement ACTIVE markup 200"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/agreements/${agr}/approve_amendment", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "IntercompanyAgreement.${agr}.status == ACTIVE and markup_bp == 200 (unchanged)"

      - name: activate_after_terminate_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IntercompanyAgreement]
        distinguishing_aspect: "TERMINATED is terminal: terminate an ACTIVE agreement with no transactions, then activate must fail."
        test_recipe:
          setup: ["Year 2026; E1/E2; study CURRENT; agreement ACTIVE, no transactions"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/agreements/${agr}/terminate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "IntercompanyAgreement.${agr}.status == TERMINATED"

      - name: true_up_compute_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TrueUpRun]
        distinguishing_aspect: "compute is only defined from DRAFT; a second compute on a COMPUTED run fails (idempotency of triggers not implied)."
        test_recipe:
          setup: ["Year 2026; agreement ACTIVE with one MATCHED tx (cost 1000000, booked 1020000); run created and computed once"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx: $.data.id } }
            - { call: "POST /tp/transactions/${tx}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run: $.data.id } }
            - { call: "POST /tp/true_up_runs/${run}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
          trigger:
            - { call: "POST /tp/true_up_runs/${run}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "TrueUpRun.${run}.status == COMPUTED (unchanged)"

      - name: doc_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DocPackage]
        distinguishing_aspect: "DocPackage machine is DRAFT -> SUBMITTED -> APPROVED -> FILED; approve on DRAFT (skipping submit) fails."
        test_recipe:
          setup: ["Year 2026; MASTER_FILE doc created (DRAFT)"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/doc_packages", payload: { fiscal_year_id: "${fy}", doc_type: "MASTER_FILE" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { doc: $.data.id } }
          trigger:
            - { call: "POST /tp/doc_packages/${doc}/approve", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "DocPackage.${doc}.status == DRAFT"

      - name: audit_case_first_attach_auto_advances
        claim_type: side_effect_execution
        grounds: [state_machines.AuditCase.OPENED_to_ACTIVE_PREP]
        distinguishing_aspect: "First successful attach_doc auto-transitions OPENED -> ACTIVE_PREP and appends the doc id; second attach keeps ACTIVE_PREP and appends."
        test_recipe:
          setup: ["Year 2026; E1 ACTIVE; MASTER_FILE doc approved (submit by ana-1, approve by mgr-1); AUDIT case opened for E1"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/doc_packages", payload: { fiscal_year_id: "${fy}", doc_type: "MASTER_FILE" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { doc: $.data.id } }
            - { call: "POST /tp/doc_packages/${doc}/submit", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/doc_packages/${doc}/approve", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "AUDIT", authority_country: "US" }, as: TransferPricingLead, captures: { ac: $.data.id } }
          trigger:
            - { call: "POST /tp/audit_cases/${ac}/attach_doc", payload: { doc_package_id: "${doc}" }, as: TransferPricingLead, captures: { st: $.data.status, docs: $.data.defense_doc_ids } }
          assert:
            - "AuditCase.${ac}.status == ACTIVE_PREP (auto-advanced on first attach)"
            - "AuditCase.${ac}.defense_doc_ids == [${doc}]"

      - name: pool_settle_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CashPool]
        distinguishing_aspect: "settle is defined only from NETTING; calling it on an OPEN pool fails."
        test_recipe:
          setup: ["Year 2026; pool created (OPEN)"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool: $.data.id } }
          trigger:
            - { call: "POST /tp/cash_pools/${pool}/settle", payload: {}, as: TreasuryManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "CashPool.${pool}.status == OPEN"

      - name: year_close_blocked_by_unmatched_transaction_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.FiscalYear.CLOSING_to_CLOSED, "errors[ERR_YEAR_HAS_OPEN_TRANSACTIONS]"]
        distinguishing_aspect: "A single UNMATCHED transaction blocks year close even after begin_closing ran (nothing to auto-eliminate)."
        test_recipe:
          setup: ["Year 2026; agreement ACTIVE; one transaction booked but never matched; year in CLOSING"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/fiscal_years/${fy}/begin_closing", payload: {}, as: GroupTaxAdmin }
          trigger:
            - { call: "POST /tp/fiscal_years/${fy}/close", payload: {}, as: GroupTaxAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_YEAR_HAS_OPEN_TRANSACTIONS"
            - "FiscalYear.${fy}.status == CLOSING"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: margin_bp_rounds_half_up_at_exact_half
        claim_type: precision
        grounds: [calculations.provisional_price_calc]
        distinguishing_aspect: "cost 2000000 booked 2000100 gives raw margin exactly 0.5bp; round_half_up yields 1 (not 0) — the rounding mode is observable."
        test_recipe:
          setup: ["Year 2026; E1/E2; study CURRENT; agreement ACTIVE markup 200"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2000100, recipient_cost_cents: 2000100 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx: $.data.id, m: $.data.margin_bp, p: $.data.provisional_al_price_cents } }
          assert:
            - "ICTransaction.${tx}.margin_bp == 1   (round_half_up(0.5))"
            - "ICTransaction.${tx}.provisional_al_price_cents == 2040000"

      - name: iqr_nearest_rank_even_count
        claim_type: correct_result
        grounds: [calculations.interquartile_range]
        distinguishing_aspect: "n=6 comparables [300,350,400,500,600,700]: nearest-rank ranks ceil(1.5)=2, ceil(3)=3, ceil(4.5)=5 -> p25=350, median=400, p75=600 (no interpolation)."
        test_recipe:
          setup: ["Draft study with 6 comparables"]
          setup_api_calls:
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "GOODS", region: "NA", vintage_year: 2026, comparables_bp: [700, 300, 500, 350, 600, 400] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
          trigger:
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1", captures: { p25: $.data.p25_bp, med: $.data.median_bp, p75: $.data.p75_bp } }
          assert:
            - "BenchmarkingStudy.${study}.p25_bp == 350"
            - "BenchmarkingStudy.${study}.median_bp == 400"
            - "BenchmarkingStudy.${study}.p75_bp == 600"
            - "BenchmarkingStudy.${study}.status == CURRENT"

      - name: study_with_too_few_comparables_rejected
        claim_type: constants_applied
        grounds: [calculations.interquartile_range, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "comparables_bp with 4 entries violates the >=5 minimum -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "GOODS", region: "NA", vintage_year: 2026, comparables_bp: [300, 400, 500, 600] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: unmatched_transactions_excluded_from_true_up_input
        claim_type: input_set_filtering
        grounds: [calculations.true_up_calculation]
        distinguishing_aspect: "Input set is elimination_status IN {MATCHED, ELIMINATED}: a 9x-larger UNMATCHED transaction is excluded, so the run computes margin 200 and true_up 30000 from the matched transaction alone."
        test_recipe:
          setup: ["Year 2026; agreement ACTIVE TO_MEDIAN; one MATCHED tx (cost 1000000 booked 1020000) and one UNMATCHED tx (cost 9000000 booked 9000000, never matched)"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx_m: $.data.id } }
            - { call: "POST /tp/transactions/${tx_m}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 9000000, provider_revenue_cents: 9000000, recipient_cost_cents: 9000000 }, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run: $.data.id } }
          trigger:
            - { call: "POST /tp/true_up_runs/${run}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1", captures: { amt: $.data.true_up_amount_cents, marg: $.data.actual_margin_bp } }
          assert:
            - "TrueUpRun.${run}.actual_margin_bp == 200   (UNMATCHED 9M tx excluded)"
            - "TrueUpRun.${run}.true_up_amount_cents == 30000   (1000000*1.05 - 1020000)"

      - name: cbc_below_threshold_carries_no_obligation
        claim_type: correct_result
        grounds: [calculations.cbcr_threshold_check]
        excluded_because:
          difficulty_instance: cbcr_threshold_inclusive_at_750m
          rationale: "The below/at threshold pair (749999999 false, 750000000 true) is asserted as the failure-and-pass paths of the named §1.8 boundary instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request without X-User-Role header -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), before any role or existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER when X-User-Role header is stripped by the test harness"

      - name: analyst_cannot_approve_submitted_doc
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Role check (priority 2) fires before state: TaxAnalyst calling approve on a SUBMITTED doc -> ERR_FORBIDDEN_FOR_ROLE (403), not a state error."
        test_recipe:
          setup: ["Year 2026; MASTER_FILE doc submitted by ana-1"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
