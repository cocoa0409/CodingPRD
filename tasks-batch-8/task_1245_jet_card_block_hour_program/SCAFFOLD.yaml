# =============================================================================
# Task 1245: Jet Card & Block-Hour Program (Wheels Up style)
# Pricing engine + ledger reconciliation archetypes with OCC, dual-variant
# calculations, cascading side effects, and rate/threshold triggers.
# =============================================================================

scenario: |
  1245. Jet Card & Block-Hour Program (Wheels Up style card): card purchase &
  hour bank accounting, category swap ratio & unused hour expiration,
  service-level guarantee (aircraft availability window), peak-period blackout
  & surcharge, taxi/flight-time billing rules & minimums, escrow of unused
  funds & refund policy, upgrade to fractional credit, one-way vs round-trip
  pricing.

domain_name: jet-card-block-hour
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CardProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code, e.g. WHEELS_UP_25H" }
      - { name: aircraft_category, type: enum, source: input, description: "LIGHT | MIDSIZE | SUPER_MID | HEAVY" }
      - { name: hours_purchased, type: integer, source: input, description: "Block-hour quantity on card face (25, 50, 100)" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Upfront purchase price in cents" }
      - { name: swap_ratio_to_lower, type: number, source: input, description: "Multiplier when swapping DOWN a category (e.g. 1.0 hour MIDSIZE = 0.85 hour LIGHT)" }
      - { name: swap_ratio_to_higher, type: number, source: input, description: "Multiplier when swapping UP a category (e.g. 1.0 hour MIDSIZE = 1.30 hour SUPER_MID)" }
      - { name: expiry_months, type: integer, source: input, description: "Months until unused hours expire (typically 18-24)" }
      - { name: taxi_minutes_per_leg, type: integer, source: input, description: "Fixed taxi-time minutes billed per leg (e.g. 12)" }
      - { name: min_billable_minutes_per_leg, type: integer, source: input, description: "Minimum billable minutes per leg (e.g. 60)" }
      - { name: peak_surcharge_pct, type: number, source: input, description: "Peak-period surcharge multiplier (e.g. 0.15 for +15%)" }
      - { name: availability_window_hours, type: integer, source: input, description: "Guaranteed aircraft availability window in hours (e.g. 24)" }
      - { name: round_trip_discount_pct, type: number, source: input, description: "Discount applied when trip qualifies as round-trip (e.g. 0.10)" }
      - { name: early_termination_penalty_pct, type: number, source: input, description: "Penalty on refund if card is cancelled before first anniversary (e.g. 0.20)" }
      - { name: fractional_upgrade_ratio, type: number, source: input, description: "Hours-to-fractional-share conversion ratio (e.g. 25 hours = 1/16 share)" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member email, unique" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: member_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: tier, type: enum, source: input, description: "INDIVIDUAL | FAMILY | CORPORATE" }
      - { name: home_base_icao, type: string, source: input, description: "Home airport ICAO code" }

  - name: JetCard
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; cardholder" }
      - { name: program_id, type: string, source: input, description: "FK -> CardProgram.id; card program purchased" }
      - { name: card_status, type: enum, source: system, description: "PENDING_PAYMENT | ACTIVE | SUSPENDED | EXPIRED | CLOSED | REFUNDED" }
      - { name: purchased_at, type: datetime, source: system, description: "Timestamp when payment cleared and card activated" }
      - { name: expires_at, type: datetime, source: computed, description: "purchased_at + program.expiry_months; after this, unused hours lapse" }
      - { name: hours_total, type: integer, source: system, description: "Hours originally purchased (mirrors program.hours_purchased)" }
      - { name: hours_remaining, type: number, source: computed, description: "Current usable hours (sum of un-expired, un-consumed ledger entries)" }
      - { name: hours_consumed, type: number, source: computed, description: "Hours debited by completed trips" }
      - { name: hours_expired, type: number, source: computed, description: "Hours that have lapsed unused" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "Unused funds currently in escrow (proportional to hours_remaining)" }
      - { name: peak_hours_used, type: number, source: computed, description: "Hours consumed during peak periods (for surcharge audit)" }

  - name: HourBankLedger
    parent: JetCard
    common_fields: false
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> JetCard.id; owning card" }
      - { name: entry_kind, type: enum, source: system, description: "PURCHASE_GRANT | TRIP_DEBIT | EXPIRATION_DEBIT | REFUND_DEBIT | UPGRADE_DEBIT | SWAP_ADJUSTMENT" }
      - { name: hours_delta, type: number, source: system, description: "Signed hours change (positive = grant, negative = debit)" }
      - { name: effective_at, type: datetime, source: system, description: "When the entry takes effect (trip completion, expiration sweep, etc.)" }
      - { name: trip_id, type: string, source: system, description: "FK -> TripRequest.id; set for TRIP_DEBIT entries, null otherwise" }
      - { name: note, type: string, source: input, description: "Free-text annotation" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "Aircraft tail number, unique" }
      - { name: category, type: enum, source: input, description: "LIGHT | MIDSIZE | SUPER_MID | HEAVY" }
      - { name: home_base_icao, type: string, source: input, description: "Home airport" }
      - { name: seats, type: integer, source: input, description: "Passenger seat count" }
      - { name: aircraft_status, type: enum, source: system, description: "AVAILABLE | IN_SERVICE | MAINTENANCE | GROUNDED" }
      - { name: reposition_rate_cents_per_nm, type: integer, source: input, description: "Positioning cost per nautical mile (for one-way pricing)" }

  - name: TripRequest
    parent: JetCard
    common_fields: true
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> JetCard.id; paying card" }
      - { name: trip_kind, type: enum, source: input, description: "ONE_WAY | ROUND_TRIP" }
      - { name: departure_icao, type: string, source: input, description: "Origin airport ICAO" }
      - { name: arrival_icao, type: string, source: input, description: "Destination airport ICAO" }
      - { name: requested_departure_utc, type: datetime, source: input, description: "Requested departure time" }
      - { name: requested_return_utc, type: datetime, source: input, description: "Requested return departure (ROUND_TRIP only, null for ONE_WAY)" }
      - { name: pax_count, type: integer, source: input, description: "Passenger count" }
      - { name: requested_category, type: enum, source: input, description: "Aircraft category requested" }
      - { name: swap_applied, type: boolean, source: computed, description: "True when dispatched category differs from requested_category" }
      - { name: dispatched_aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; null until dispatch" }
      - { name: trip_status, type: enum, source: system, description: "QUOTE | CONFIRMED | DISPATCHED | IN_FLIGHT | COMPLETED | CANCELED | NO_SHOW | DENIED" }
      - { name: denial_reason, type: enum, source: system, description: "INSUFFICIENT_HOURS | BLACKOUT | AVAILABILITY_WINDOW | PEAK_RESTRICTED, null unless DENIED" }
      - { name: is_peak_period, type: boolean, source: computed, description: "True when requested_departure_utc falls inside a PeakCalendar window" }
      - { name: quoted_hours, type: number, source: computed, description: "Estimated billable hours at quote time" }
      - { name: final_hours, type: number, source: computed, description: "Final billable hours after completion" }
      - { name: sla_met, type: boolean, source: computed, description: "True when dispatched within availability_window_hours of request" }

  - name: TripLeg
    parent: TripRequest
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> TripRequest.id; owning trip" }
      - { name: leg_seq, type: integer, source: input, description: "Sequence number (1 = outbound, 2 = return)" }
      - { name: departure_icao, type: string, source: input, description: "Origin airport ICAO" }
      - { name: arrival_icao, type: string, source: input, description: "Destination airport ICAO" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Planned departure" }
      - { name: actual_block_minutes, type: integer, source: system, description: "Actual block time (wheels-out to wheels-in); null until COMPLETED" }
      - { name: billable_minutes, type: integer, source: computed, description: "actual_block_minutes + taxi_minutes_per_leg, floored at min_billable_minutes_per_leg" }
      - { name: billable_hours, type: number, source: computed, description: "billable_minutes / 60, rounded to 2 decimal places, round_half_up" }
      - { name: swap_multiplier, type: number, source: computed, description: "Swap ratio applied (1.0 if no swap; swap_ratio_to_lower or _to_higher otherwise)" }
      - { name: debited_hours, type: number, source: computed, description: "billable_hours * swap_multiplier" }
      - { name: leg_status, type: enum, source: system, description: "PLANNED | FLOWN | CANCELED" }

  - name: Invoice
    parent: TripRequest
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> TripRequest.id; the trip billed" }
      - { name: invoice_status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | DISPUTED | WRITTEN_OFF" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Pre-surcharge, pre-discount amount" }
      - { name: peak_surcharge_cents, type: integer, source: computed, description: "Surcharge amount if trip is peak-period; 0 otherwise" }
      - { name: round_trip_discount_cents, type: integer, source: computed, description: "Round-trip discount; 0 for ONE_WAY" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal + peak_surcharge - round_trip_discount" }
      - { name: issued_at, type: datetime, source: system, description: "When invoice was issued (on trip COMPLETED)" }

  - name: PeakCalendar
    parent: CardProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CardProgram.id; owning program" }
      - { name: window_start_utc, type: datetime, source: input, description: "Peak window start (inclusive)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Peak window end (exclusive)" }
      - { name: label, type: string, source: input, description: "Human label (e.g. Thanksgiving 2026)" }

  - name: BlackoutWindow
    parent: CardProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CardProgram.id; owning program" }
      - { name: window_start_utc, type: datetime, source: input, description: "Blackout start (inclusive)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Blackout end (exclusive)" }
      - { name: applies_to_category, type: enum, source: input, description: "LIGHT | MIDSIZE | SUPER_MID | HEAVY — blackout only blocks trips in this category" }
      - { name: reason, type: string, source: input, description: "Human-readable reason" }

  - name: EscrowAccount
    parent: JetCard
    common_fields: true
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> JetCard.id; owning card" }
      - { name: principal_cents, type: integer, source: system, description: "Initial escrowed principal (== program.purchase_price_cents at card activation)" }
      - { name: available_cents, type: integer, source: computed, description: "Funds still in escrow; decreases on trip completion, refund, expiration sweep" }
      - { name: released_cents, type: integer, source: computed, description: "Cumulative funds released back to operator (consumed hours or refunds paid)" }
      - { name: forfeited_cents, type: integer, source: computed, description: "Cumulative funds forfeited via expiration" }

  - name: Refund
    parent: JetCard
    common_fields: true
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> JetCard.id; card being refunded" }
      - { name: refund_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | SETTLED" }
      - { name: hours_at_request, type: number, source: system, description: "Snapshot of hours_remaining when refund requested" }
      - { name: gross_refund_cents, type: integer, source: computed, description: "Pre-penalty refund (proportional escrow release)" }
      - { name: penalty_cents, type: integer, source: computed, description: "Early-termination penalty (0 if past first anniversary)" }
      - { name: net_refund_cents, type: integer, source: computed, description: "gross_refund_cents - penalty_cents, floor at 0" }
      - { name: requested_at, type: datetime, source: system, description: "Refund submission timestamp" }
      - { name: denial_reason, type: string, source: system, description: "Reason if DENIED, else null" }

  - name: FractionalUpgrade
    parent: JetCard
    common_fields: true
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> JetCard.id; card converted" }
      - { name: hours_converted, type: number, source: system, description: "Hours consumed by the conversion" }
      - { name: share_fraction, type: string, source: computed, description: "Resulting fractional share (e.g. 1/16)" }
      - { name: upgrade_status, type: enum, source: system, description: "PENDING | APPLIED | CANCELED" }
      - { name: applied_at, type: datetime, source: system, description: "Timestamp the conversion took effect" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: JetCard
    field: card_status
    initial_state: PENDING_PAYMENT
    terminal_states: [EXPIRED, CLOSED, REFUNDED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /cards/{cardId}/activate"
        actor: Ops
        preconditions:
          - "CardProgram referenced by program_id exists"
        side_effects:
          - "Set purchased_at = now; compute expires_at = purchased_at + program.expiry_months"
          - "Insert HourBankLedger PURCHASE_GRANT of +hours_total"
          - "Create EscrowAccount with principal_cents = program.purchase_price_cents"
          - "Card.version increments by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cards/{cardId}/suspend"
        actor: Ops
        preconditions: []
        side_effects:
          - "Blocks new TripRequest creation; existing CONFIRMED trips remain dispatchable"
          - "Card.version increments by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cards/{cardId}/resume"
        actor: Ops
        preconditions: []
        side_effects:
          - "Card.version increments by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (ops-run expiration sweep when now >= expires_at AND hours_remaining > 0)"
        actor: system
        preconditions:
          - "now >= expires_at"
          - "hours_remaining > 0"
        side_effects:
          - "Insert HourBankLedger EXPIRATION_DEBIT of -hours_remaining"
          - "EscrowAccount.forfeited_cents += escrow_balance_cents; available_cents → 0"
          - "Member.member_status unchanged (member may hold other cards)"
          - "Card.version increments by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "system (ops-run closure sweep when now >= expires_at AND hours_remaining == 0)"
        actor: system
        preconditions:
          - "now >= expires_at"
          - "hours_remaining == 0"
        side_effects:
          - "Card.version increments by 1"

      - from: ACTIVE
        to: REFUNDED
        trigger: "Refund transitions to SETTLED (cascade)"
        actor: system
        preconditions:
          - "A Refund for this card transitioned to SETTLED"
        side_effects:
          - "Insert HourBankLedger REFUND_DEBIT of -hours_remaining at refund approval time"
          - "EscrowAccount.available_cents -= Refund.net_refund_cents; released_cents += Refund.net_refund_cents"
          - "Card.version increments by 1"

  - entity: TripRequest
    field: trip_status
    initial_state: QUOTE
    terminal_states: [COMPLETED, CANCELED, DENIED, NO_SHOW]
    transitions:
      - from: QUOTE
        to: CONFIRMED
        trigger: "POST /trips/{tripId}/confirm"
        actor: Member
        preconditions:
          - "Card.card_status == ACTIVE"
          - "Card.hours_remaining >= quoted_hours"
          - "requested_departure_utc NOT within any BlackoutWindow matching requested_category"
          - "Member.member_status == ACTIVE"
        side_effects:
          - "TripRequest.version increments by 1"

      - from: QUOTE
        to: DENIED
        trigger: "system (confirm precondition fails)"
        actor: system
        preconditions: []
        side_effects:
          - "Set denial_reason to the failed precondition class"
          - "TripRequest.version increments by 1"

      - from: CONFIRMED
        to: DISPATCHED
        trigger: "POST /trips/{tripId}/dispatch"
        actor: Ops
        preconditions:
          - "At least one Aircraft with category compatible (same or swap-eligible) in aircraft_status == AVAILABLE"
          - "Dispatch occurs within CardProgram.availability_window_hours of requested_departure_utc"
        side_effects:
          - "Set dispatched_aircraft_id to chosen Aircraft (eligibility: category compatible, status AVAILABLE, home_base != departure_icao means reposition cost accrues; ranking: same-category first, then by created_at ASC; tie-break: created_at ASC; empty-set fallback: ERR_NO_AIRCRAFT_AVAILABLE)"
          - "Aircraft.aircraft_status → IN_SERVICE"
          - "Set sla_met = (dispatched_at - requested_departure_utc) <= availability_window_hours"
          - "Set swap_applied = (dispatched category != requested_category)"
          - "Create TripLeg records (1 leg for ONE_WAY, 2 legs for ROUND_TRIP) in PLANNED status"
          - "TripRequest.version increments by 1"

      - from: DISPATCHED
        to: IN_FLIGHT
        trigger: "POST /trips/{tripId}/depart"
        actor: Ops
        preconditions: []
        side_effects:
          - "TripRequest.version increments by 1"

      - from: IN_FLIGHT
        to: COMPLETED
        trigger: "POST /trips/{tripId}/complete with per-leg actual_block_minutes"
        actor: Ops
        preconditions:
          - "All TripLeg.actual_block_minutes provided"
        side_effects:
          - "Compute billable_minutes, billable_hours, swap_multiplier, debited_hours per TripLeg"
          - "Compute final_hours = SUM(TripLeg.debited_hours)"
          - "Insert HourBankLedger TRIP_DEBIT of -final_hours"
          - "Update Card.hours_consumed += final_hours; Card.hours_remaining -= final_hours"
          - "If is_peak_period: Card.peak_hours_used += final_hours"
          - "EscrowAccount.available_cents -= (final_hours / hours_total) * principal_cents; released_cents += same"
          - "Aircraft.aircraft_status → AVAILABLE"
          - "All TripLeg.leg_status → FLOWN"
          - "Create Invoice with computed subtotal, peak_surcharge, round_trip_discount, total"
          - "TripRequest.version increments by 1"

      - from: [QUOTE, CONFIRMED]
        to: CANCELED
        trigger: "POST /trips/{tripId}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "TripRequest.version increments by 1"

      - from: DISPATCHED
        to: CANCELED
        trigger: "POST /trips/{tripId}/cancel"
        actor: Ops
        preconditions: []
        side_effects:
          - "Aircraft.aircraft_status → AVAILABLE"
          - "All TripLeg.leg_status → CANCELED"
          - "TripRequest.version increments by 1"

      - from: DISPATCHED
        to: NO_SHOW
        trigger: "POST /trips/{tripId}/no_show"
        actor: Ops
        preconditions: []
        side_effects:
          - "Bill minimum trip: insert HourBankLedger TRIP_DEBIT of -(min_billable_minutes_per_leg/60 * swap_multiplier)"
          - "Aircraft.aircraft_status → AVAILABLE"
          - "All TripLeg.leg_status → CANCELED"
          - "TripRequest.version increments by 1"

  - entity: Refund
    field: refund_status
    initial_state: DRAFT
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /refunds/{refundId}/submit"
        actor: Member
        preconditions:
          - "Card.card_status == ACTIVE"
          - "Card has no TripRequest in CONFIRMED, DISPATCHED, or IN_FLIGHT status"
        side_effects:
          - "Snapshot hours_at_request = Card.hours_remaining"
          - "Compute gross_refund_cents = (hours_at_request / hours_total) * EscrowAccount.principal_cents"
          - "Compute penalty_cents = (now < purchased_at + 12 months) ? gross_refund_cents * early_termination_penalty_pct : 0"
          - "Compute net_refund_cents = max(0, gross_refund_cents - penalty_cents)"
          - "Refund.version increments by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /refunds/{refundId}/approve"
        actor: Ops
        preconditions: []
        side_effects:
          - "Refund.version increments by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /refunds/{refundId}/deny"
        actor: Ops
        preconditions: []
        side_effects:
          - "Set denial_reason from input"
          - "Refund.version increments by 1"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /refunds/{refundId}/settle"
        actor: Ops
        preconditions: []
        side_effects:
          - "Cascade: JetCard.card_status → REFUNDED"
          - "Insert HourBankLedger REFUND_DEBIT of -hours_at_request"
          - "EscrowAccount.available_cents -= net_refund_cents; released_cents += net_refund_cents"
          - "Card.hours_remaining -= hours_at_request"
          - "Refund.version increments by 1"

  - entity: Invoice
    field: invoice_status
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system (TripRequest completion cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Set issued_at = now"
          - "Invoice.version increments by 1"

      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/mark_paid"
        actor: Ops
        preconditions: []
        side_effects:
          - "Invoice.version increments by 1"

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{invoiceId}/dispute"
        actor: Member
        preconditions: []
        side_effects:
          - "Invoice.version increments by 1"

      - from: DISPUTED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/mark_paid"
        actor: Ops
        preconditions: []
        side_effects:
          - "Invoice.version increments by 1"

      - from: [ISSUED, DISPUTED]
        to: WRITTEN_OFF
        trigger: "POST /invoices/{invoiceId}/write_off"
        actor: Ops
        preconditions: []
        side_effects:
          - "Invoice.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: card-refund-stale-version
    parent_entity: JetCard
    write_endpoint: "POST /cards/{cardId}/refunds"
    occ_field: "expected_card_version"
    description: |
      Creating a Refund against a JetCard whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just completed a trip (which legitimately debits the card's
      hours) and the refund writer's view of remaining hours is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: card-upgrade-stale-version
    parent_entity: JetCard
    write_endpoint: "POST /cards/{cardId}/fractional_upgrades"
    occ_field: "expected_card_version"
    description: |
      Creating a FractionalUpgrade against a JetCard whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has just changed the card's hour balance and the upgrade
      writer's conversion math would operate on stale hours.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billable_hours_per_leg
    description: "Per-leg billable time with taxi and minimum floor"
    trigger: "TripRequest completion (per TripLeg)"
    algorithm: threshold
    formula: |
      raw_minutes = TripLeg.actual_block_minutes + CardProgram.taxi_minutes_per_leg
      billable_minutes = max(raw_minutes, CardProgram.min_billable_minutes_per_leg)
      billable_hours = round_half_up(billable_minutes / 60, 2)
    input_set: "All TripLeg records where leg_status == PLANNED and trip is being COMPLETED"
    constants:
      DECIMAL_PLACES: 2
    precision: "2 decimal places, round_half_up"

  - name: debited_hours_per_leg
    description: "Swap-ratio adjusted debit per leg"
    trigger: "TripRequest completion (per TripLeg, after billable_hours_per_leg)"
    algorithm: tiered_pricing
    formula: |
      if TripLeg dispatched category == TripRequest.requested_category:
        swap_multiplier = 1.0
      elif dispatched category is LOWER tier than requested:
        swap_multiplier = CardProgram.swap_ratio_to_lower
      else:
        swap_multiplier = CardProgram.swap_ratio_to_higher
      debited_hours = round_half_up(billable_hours * swap_multiplier, 2)
    input_set: "Same as billable_hours_per_leg; depends on dispatched aircraft category"
    constants:
      DECIMAL_PLACES: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: no_swap
        when: "dispatched_aircraft.category == TripRequest.requested_category"
        difference: "swap_multiplier = 1.0; debited_hours == billable_hours"
      - name: downgrade_swap
        when: "dispatched category is lower tier than requested"
        difference: "swap_multiplier = swap_ratio_to_lower (<1.0); member debited FEWER hours"
      - name: upgrade_swap
        when: "dispatched category is higher tier than requested"
        difference: "swap_multiplier = swap_ratio_to_higher (>1.0); member debited MORE hours"

  - name: invoice_total
    description: "Final trip invoice with peak surcharge and round-trip discount"
    trigger: "TripRequest completion (after all legs computed)"
    algorithm: tiered_pricing
    formula: |
      # Step 1: subtotal from per-leg debited hours × program's implied hourly rate
      implied_hourly_rate_cents = CardProgram.purchase_price_cents / CardProgram.hours_purchased
      subtotal_cents = round_half_up(SUM(TripLeg.debited_hours) * implied_hourly_rate_cents, 0)

      # Step 2: peak surcharge applies only when is_peak_period
      if TripRequest.is_peak_period:
        peak_surcharge_cents = round_half_up(subtotal_cents * CardProgram.peak_surcharge_pct, 0)
      else:
        peak_surcharge_cents = 0

      # Step 3: round-trip discount applies to (subtotal + peak_surcharge)
      if TripRequest.trip_kind == ROUND_TRIP:
        round_trip_discount_cents = round_half_up(
          (subtotal_cents + peak_surcharge_cents) * CardProgram.round_trip_discount_pct, 0)
      else:
        round_trip_discount_cents = 0

      total_cents = subtotal_cents + peak_surcharge_cents - round_trip_discount_cents
    input_set: "All TripLeg records of the trip; TripRequest fields"
    constants:
      DECIMAL_PLACES_MONEY: 0
    precision: "0 decimal places (whole cents), round_half_up at each step"
    variants:
      - name: one_way_peak
        when: "trip_kind == ONE_WAY AND is_peak_period"
        difference: "total = subtotal + peak_surcharge; no round-trip discount"
      - name: one_way_offpeak
        when: "trip_kind == ONE_WAY AND NOT is_peak_period"
        difference: "total = subtotal; no surcharge, no discount"
      - name: round_trip_peak
        when: "trip_kind == ROUND_TRIP AND is_peak_period"
        difference: "total = (subtotal + peak_surcharge) * (1 - round_trip_discount_pct)"
      - name: round_trip_offpeak
        when: "trip_kind == ROUND_TRIP AND NOT is_peak_period"
        difference: "total = subtotal * (1 - round_trip_discount_pct)"

  - name: hour_bank_reconciliation
    description: "Derive hours_remaining from ledger (forward-looking vs chronological variants)"
    trigger: "Card read; ops-run sweep"
    algorithm: aggregation
    formula: |
      # Chronological variant: replay ledger in effective_at ASC order
      hours_remaining_chrono = SUM(HourBankLedger.hours_delta WHERE effective_at <= now)
      # Forward-looking variant: include scheduled future expirations as of expires_at
      hours_remaining_fwd = SUM(HourBankLedger.hours_delta WHERE effective_at <= MIN(now, Card.expires_at))
      # Persisted field uses chronological
      Card.hours_remaining = hours_remaining_chrono
    input_set: "All HourBankLedger entries for the card, ordered by effective_at ASC, tie-break by created_at ASC"
    constants: {}
    precision: "2 decimal places"
    variants:
      - name: chronological
        when: "Persisted on Card.hours_remaining; drives all trip authorization"
        difference: "Only entries with effective_at <= now count"
      - name: forward_looking
        when: "Used by GET /cards/{id}/projection endpoint for what-if display"
        difference: "Includes entries with effective_at <= expires_at; forecasts the post-expiry floor"

  - name: escrow_release_on_completion
    description: "Proportional escrow release per completed trip"
    trigger: "TripRequest completion"
    algorithm: waterfall_allocation
    formula: |
      release_cents = round_half_up(
        (TripRequest.final_hours / Card.hours_total) * EscrowAccount.principal_cents, 0)
      EscrowAccount.available_cents -= release_cents
      EscrowAccount.released_cents += release_cents
      Card.escrow_balance_cents = EscrowAccount.available_cents
    input_set: "Single trip's final_hours; card's hours_total; escrow principal"
    constants:
      DECIMAL_PLACES_MONEY: 0
    precision: "0 decimal places (whole cents), round_half_up"

  - name: refund_net_amount
    description: "Refund with tiered early-termination penalty"
    trigger: "Refund submit"
    algorithm: threshold
    formula: |
      gross_refund_cents = round_half_up(
        (Refund.hours_at_request / Card.hours_total) * EscrowAccount.principal_cents, 0)
      months_since_purchase = (now - Card.purchased_at) / 30 days
      if months_since_purchase < 12:
        penalty_cents = round_half_up(gross_refund_cents * CardProgram.early_termination_penalty_pct, 0)
      else:
        penalty_cents = 0
      net_refund_cents = max(0, gross_refund_cents - penalty_cents)
    input_set: "Card, EscrowAccount, Refund snapshots; program penalty rate"
    constants:
      EARLY_TERMINATION_MONTHS: 12
    precision: "0 decimal places (whole cents), round_half_up at each step"

  - name: fractional_upgrade_credit
    description: "Convert unused card hours into fractional share"
    trigger: "POST /cards/{id}/fractional_upgrades"
    algorithm: forward_looking
    formula: |
      # Value of remaining hours at implied rate
      implied_hourly_rate_cents = CardProgram.purchase_price_cents / CardProgram.hours_purchased
      conversion_value_cents = round_half_up(Card.hours_remaining * implied_hourly_rate_cents, 0)
      # Each share-fraction costs fractional_upgrade_ratio * hours_purchased * implied rate
      share_cost_cents = CardProgram.fractional_upgrade_ratio * CardProgram.purchase_price_cents
      # Resulting share = conversion_value / share_cost (must be >= 1/16 share threshold)
      if conversion_value_cents >= share_cost_cents / 16:
        share_fraction = "1/16"
        hours_to_debit = Card.hours_remaining
      else:
        raise ERR_INSUFFICIENT_HOURS_FOR_UPGRADE
    input_set: "Card's current hours_remaining; program's conversion constants"
    constants:
      MIN_SHARE_DENOMINATOR: 16
    precision: "0 decimal places (whole cents), round_half_up"

  - name: quoted_hours_estimate
    description: "Forward estimate at quote time"
    trigger: "TripRequest creation"
    algorithm: projection
    formula: |
      # Heuristic: estimate 50 minutes per 100 nautical miles + taxi
      # For benchmark determinism, quote is computed from a fixed lookup:
      # quoted_hours = ceil( (distance_nm / 400) * 60 + taxi_minutes ) / 60 rounded to 2dp
      # distance_nm is computed server-side from ICAO pair via haversine on a
      # fixed airport coordinate table (not exposed in this scaffold).
      # quoted_hours uses per-leg computation then sums.
      per_leg_estimate_hours = round_half_up(
        (distance_nm / 400) + CardProgram.taxi_minutes_per_leg / 60, 2)
      if TripRequest.trip_kind == ONE_WAY:
        quoted_hours = max(per_leg_estimate_hours, CardProgram.min_billable_minutes_per_leg / 60)
      else:
        quoted_hours = 2 * max(per_leg_estimate_hours, CardProgram.min_billable_minutes_per_leg / 60)
    input_set: "TripRequest ICAO pair, trip_kind; program constants"
    constants:
      CRUISE_KNOTS: 400
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and recognized; X-User-ID header present when role is entity_backed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is authorized to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (program, member, card, trip, invoice, refund, aircraft)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys exist (program_id, dispatched_aircraft_id, trip_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: ["POST /members/{memberId}/cards", "POST /cards/{cardId}/trips"]

  - priority: 5
    category: state
    check: "Card is in ACTIVE status for operations that require it (trip creation, refund submit, upgrade)"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /cards/{cardId}/trips", "POST /refunds/{refundId}/submit", "POST /cards/{cardId}/fractional_upgrades"]

  - priority: 6
    category: state
    check: "Member is in ACTIVE status for card purchase and trip confirmation"
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /members/{memberId}/cards", "POST /trips/{tripId}/confirm"]

  - priority: 7
    category: state
    check: "Trip is in expected from-state for the invoked transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST action endpoints on TripRequest, Refund, Invoice, JetCard"

  - priority: 8
    category: business_safety
    check: "Card has no TripRequest in CONFIRMED, DISPATCHED, or IN_FLIGHT status when submitting a refund"
    error_id: ERR_OPEN_TRIPS_EXIST
    http_status: 409
    applies_to: ["POST /refunds/{refundId}/submit"]

  - priority: 9
    category: business_temporal
    check: "requested_departure_utc does NOT intersect any BlackoutWindow matching requested_category for the card's program"
    error_id: ERR_BLACKOUT_PERIOD
    http_status: 422
    applies_to: ["POST /trips/{tripId}/confirm"]

  - priority: 10
    category: business_temporal
    check: "Dispatch occurs within CardProgram.availability_window_hours of requested_departure_utc"
    error_id: ERR_SLA_WINDOW_MISSED
    http_status: 422
    applies_to: ["POST /trips/{tripId}/dispatch"]

  - priority: 11
    category: business_constraint
    check: "At least one Aircraft exists with category compatible (same or swap-eligible) AND aircraft_status == AVAILABLE at dispatch time"
    error_id: ERR_NO_AIRCRAFT_AVAILABLE
    http_status: 422
    applies_to: ["POST /trips/{tripId}/dispatch"]

  - priority: 12
    category: business_constraint
    check: "pax_count <= chosen aircraft's seats"
    error_id: ERR_PAX_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: ["POST /trips/{tripId}/dispatch"]

  - priority: 13
    category: business_fiscal
    check: "Card.hours_remaining >= TripRequest.quoted_hours at confirm time"
    error_id: ERR_INSUFFICIENT_HOURS
    http_status: 402
    applies_to: ["POST /trips/{tripId}/confirm"]

  - priority: 14
    category: business_fiscal
    check: "Card.hours_remaining sufficient for upgrade minimum share (1/16)"
    error_id: ERR_INSUFFICIENT_HOURS_FOR_UPGRADE
    http_status: 402
    applies_to: ["POST /cards/{cardId}/fractional_upgrades"]

  - priority: 15
    category: business_referential
    check: "OCC expected_card_version matches current JetCard.version on stale-vulnerable endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /cards/{cardId}/refunds", "POST /cards/{cardId}/fractional_upgrades"]

  - priority: 16
    category: business_temporal
    check: "ROUND_TRIP requests have requested_return_utc strictly after requested_departure_utc"
    error_id: ERR_INVALID_RETURN_TIME
    http_status: 422
    applies_to: ["POST /cards/{cardId}/trips"]

  - priority: 17
    category: business_constraint
    check: "Card cannot transition to EXPIRED while hours_remaining > 0 unless sweep has already debited ledger"
    error_id: ERR_EXPIRATION_SWEEP_INCOMPLETE
    http_status: 409
    applies_to: ["system expiration sweep"]

  - priority: 18
    category: business_fiscal
    check: "Refund gross_refund_cents must be > 0 (refusing to refund empty card)"
    error_id: ERR_NOTHING_TO_REFUND
    http_status: 422
    applies_to: ["POST /refunds/{refundId}/submit"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Card Program ---
  - method: POST
    path: "/programs"
    description: "Create a CardProgram"
    roles: [Ops]
    code: 201
    input: ["program_code", "aircraft_category", "hours_purchased", "purchase_price_cents", "swap_ratio_to_lower", "swap_ratio_to_higher", "expiry_months", "taxi_minutes_per_leg", "min_billable_minutes_per_leg", "peak_surcharge_pct", "availability_window_hours", "round_trip_discount_pct", "early_termination_penalty_pct", "fractional_upgrade_ratio"]
    output: CardProgram
    side_effects: []

  - method: GET
    path: "/programs/{programId}"
    description: "Get a CardProgram"
    roles: [Ops, Member, Anonymous]
    code: 200
    input: []
    output: CardProgram
    side_effects: []

  - method: GET
    path: "/programs"
    description: "List CardPrograms"
    roles: [Ops, Member, Anonymous]
    code: 200
    input: ["aircraft_category?", "limit?", "offset?"]
    output: "CardProgram[]"
    side_effects: []

  # --- Peak Calendar ---
  - method: POST
    path: "/programs/{programId}/peak_windows"
    description: "Add a PeakCalendar window"
    roles: [Ops]
    code: 201
    input: ["window_start_utc", "window_end_utc", "label"]
    output: PeakCalendar
    side_effects: []

  - method: GET
    path: "/programs/{programId}/peak_windows"
    description: "List PeakCalendar windows for a program"
    roles: [Ops, Member, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: "PeakCalendar[]"
    side_effects: []

  # --- Blackout Window ---
  - method: POST
    path: "/programs/{programId}/blackout_windows"
    description: "Add a BlackoutWindow"
    roles: [Ops]
    code: 201
    input: ["window_start_utc", "window_end_utc", "applies_to_category", "reason"]
    output: BlackoutWindow
    side_effects: []

  - method: GET
    path: "/programs/{programId}/blackout_windows"
    description: "List BlackoutWindows for a program"
    roles: [Ops, Member, Anonymous]
    code: 200
    input: ["applies_to_category?", "limit?", "offset?"]
    output: "BlackoutWindow[]"
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/members"
    description: "Register a Member"
    roles: [Ops]
    code: 201
    input: ["email", "full_name", "tier", "home_base_icao"]
    output: Member
    side_effects: ["member_status = ACTIVE"]

  - method: GET
    path: "/members/{memberId}"
    description: "Get a Member"
    roles: [Ops, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{memberId}/suspend"
    description: "Suspend a Member"
    roles: [Ops]
    code: 200
    input: []
    output: Member
    side_effects: ["member_status → SUSPENDED"]

  # --- JetCard ---
  - method: POST
    path: "/members/{memberId}/cards"
    description: "Purchase a JetCard (starts in PENDING_PAYMENT)"
    roles: [Ops]
    code: 201
    input: ["program_id"]
    output: JetCard
    side_effects: ["card_status = PENDING_PAYMENT"]

  - method: POST
    path: "/cards/{cardId}/activate"
    description: "Activate card (payment cleared)"
    roles: [Ops]
    code: 200
    input: []
    output: JetCard
    side_effects:
      - "card_status → ACTIVE"
      - "Insert PURCHASE_GRANT ledger entry"
      - "Create EscrowAccount"

  - method: POST
    path: "/cards/{cardId}/suspend"
    description: "Suspend a card"
    roles: [Ops]
    code: 200
    input: []
    output: JetCard
    side_effects: ["card_status → SUSPENDED"]

  - method: POST
    path: "/cards/{cardId}/resume"
    description: "Resume a suspended card"
    roles: [Ops]
    code: 200
    input: []
