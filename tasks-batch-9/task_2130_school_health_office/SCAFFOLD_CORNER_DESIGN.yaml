            - "Two MedicationAuthorizations for that student with consent_status CONSENT_GRANTED: one METHYLPHENIDATE (is_controlled true) and one ALBUTEROL."
            - "One DisclosureRequest with requester_type SCHOOL_STAFF, purpose_code ENROLLMENT and scope [VISITS, MEDICATIONS], guardian-consented and physician-approved."
          setup_api_calls:
            - call: "POST /health-office/schools"
