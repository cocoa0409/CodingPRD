        distinguishing_aspect: "Sweep with clock past the NOI deadline and no ACKNOWLEDGED notice yields NONCOMPLIANT; after the parent files and the registrar acknowledges, the next sweep recomputes back to GOOD_STANDING (absolute recompute, recovery included)."
        test_recipe:
          setup: ["year OPEN (NOI deadline 2026-09-15); family; student; enrollment REGISTERED with a DRAFT notice never filed; clock then set to 2026-09-16"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
