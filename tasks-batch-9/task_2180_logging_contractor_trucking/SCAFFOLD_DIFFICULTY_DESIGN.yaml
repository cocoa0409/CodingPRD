  - rule_id: resource_temporal_overlap
    instances:

      - name: crew_occupation_window_is_half_open_with_a_two_day_move_buffer
        grounds:
          - validations[priority=75]
          - errors[ERR_CREW_WINDOW_CONFLICT]
          - entities.CrewAssignment.fields.window_start
          - entities.CrewAssignment.fields.window_end
          - entities.Crew.fields.status
        distinguishing_aspect: |
          Interval semantics A, on the Crew resource: half-open [window_start, window_end)
          with a two-day tail buffer appended to every existing assignment. An assignment
          starting exactly on the prior window_end is REJECTED because the buffer still covers
          it, and one starting exactly two days later is admitted - adjacency is a conflict
          here.
        test_recipe:
          setup:
            - "Crew Alpha exists with no mill, carrier or route involved"
            - "Tract Unit A holds a SCHEDULED assignment for Crew Alpha over [2026-08-01, 2026-09-01)"
            - "Tract Unit B exists and is empty"
          setup_api_calls:
            - call: "POST /crews"
              payload: { name: "Crew Alpha", crew_type: "MECHANIZED_GROUND", equipment_pieces: 4, daily_rate_cents: 480000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Unit A", legal_description: "T2S R4W Sec 11 NW1/4", gross_acres: 95, planned_volume_tons: 3100, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_a_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Unit B", legal_description: "T2S R4W Sec 12 NE1/4", gross_acres: 70, planned_volume_tons: 2400, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_b_id: $.data.id }
            - call: "POST /tracts/${tract_a_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", move_in_miles: 40, window_start: "2026-08-01", window_end: "2026-09-01" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_a_id: $.data.id }
          trigger:
            - call: "POST /tracts/${tract_b_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", move_in_miles: 40, window_start: "2026-09-01", window_end: "2026-09-20" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /tracts/${tract_b_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", move_in_miles: 40, window_start: "2026-09-03", window_end: "2026-09-20" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_b_id: $.data.id }
          assert:
            - "response.status == 409 on the 2026-09-01 assignment"
            - "response.data.error_id == ERR_CREW_WINDOW_CONFLICT"
            - "CrewAssignment.${ca_b_id}.window_start == 2026-09-03"
            - "CrewAssignment.${ca_b_id}.status == SCHEDULED"
            - "CrewAssignment.${ca_b_id}.move_in_cost_cents == 186750"
            - "CrewAssignment.${ca_a_id}.status == SCHEDULED"

      - name: truck_haul_interval_is_closed_so_touching_endpoints_collide
        grounds:
          - validations[priority=75]
          - errors[ERR_TRUCK_WINDOW_CONFLICT]
          - entities.Load.fields.scheduled_depart_at
          - entities.Load.fields.scheduled_arrive_at
          - calculations.mill_contract_quota_position
        distinguishing_aspect: |
          Interval semantics B, on the Truck resource and geometrically different from the
          crew rule: CLOSED [scheduled_depart_at, scheduled_arrive_at] with no buffer at all. A
          load departing at exactly the prior load's arrival instant collides because both
          endpoints are inclusive, while one second later is admitted - the opposite adjacency
          verdict from the half-open-plus-buffer crew rule for a one-instant difference.
        test_recipe:
          setup:
            - "MillContract A quota 500 tons, ACTIVE tract, OPEN route, COMPLIANT carrier"
            - "Load 1 occupies the only truck over the closed interval 2026-08-03T08:00:00Z .. 2026-08-03T10:00:00Z and is still DISPATCHED, hence non-terminal"
            - "MillContract A shows reserved_tons 26.50 before the trigger"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_a_id}", species: "DOUGLAS_FIR", grade: "SAWLOG_1", quota_tons: 500, base_rate_cents_per_ton: 4200, period_start: "2026-07-01", period_end: "2026-09-30", overrun_tolerance_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_a_id: $.data.id }
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
