      - name: promo_window_closed_interval_touching_rejected
        claim_type: temporal_validation
        grounds: ['validations[priority=9"]', 'errors[ERR_PROMO_WINDOW_OVERLAP]']
        distinguishing_aspect: "Closed date intervals: a second program starting ON the existing end_date (10-07) overlaps and is rejected; starting 10-08 is allowed — different semantics from the half-open run windows."
        test_recipe:
          setup: ["approved A1; product P1; program PP1 AUTHORIZED for 2026-10-01..2026-10-07"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 1000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-01", end_date: "2026-10-07", budget_cents: 40000, estimated_units: 10 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp1: $.data.id } }
            - { call: "POST /api/promo-programs/${pp1}/authorize", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-07", end_date: "2026-10-14", budget_cents: 40000, estimated_units: 10 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp2: $.data.id } }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-08", end_date: "2026-10-14", budget_cents: 40000, estimated_units: 10 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp3: $.data.id } }
          trigger:
            - { call: "POST /api/promo-programs/${pp2}/authorize", payload: { decision: "APPROVE" }, as: BrandAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/promo-programs/${pp3}/authorize", payload: { decision: "APPROVE" }, as: BrandAdmin }
          assert:
            - "err == ERR_PROMO_WINDOW_OVERLAP for start_date == existing end_date (closed intervals touch)"
            - "PromoProgram.${pp3}.status == AUTHORIZED for start_date the day after"

      - name: run_create_blocked_while_plant_shutdown
        claim_type: violation_to_error
        grounds: ['validations[priority=8"]', 'errors[ERR_INCIDENT_ACTIVE]', state_machines.Incident.TRIAGED_to_CONFIRMED_RECALL]
        distinguishing_aspect: "Safety gate across aggregates: after confirm-recall shuts the plant down, scheduling a new run there fails until a FALSE_ALARM resolution reopens it."
        test_recipe:
          setup: ["plant PL1 SHUTDOWN via incident I1 TRIAGED -> CONFIRMED_RECALL"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/incidents", payload: { plant_id: "${pl1}", title: "Salmonella", severity: "CRITICAL", affected_run_ids: [] }, as: SafetyOfficer, captures: { i1: $.data.id } }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "TRIAGED" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CONFIRMED_RECALL" }, as: SafetyOfficer }
          trigger:
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-02T06:00:00Z", window_end: "2026-09-02T12:00:00Z", capacity_units: 100, planned_units: 50 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INCIDENT_ACTIVE and Plant.${pl1}.status == SHUTDOWN"

      - name: run_window_inverted_rejected_as_validation
        claim_type: violation_to_error
        grounds: ['validations[priority=4"]', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Shape check fires before overlap checks: window_start == window_end is a 400, not a 409."
        test_recipe:
          setup: ["plant PL1 ACTIVE; product P1"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T06:00:00Z", capacity_units: 100, planned_units: 50 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (http 400)"

      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=1"]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "Missing X-User-Role / X-User-ID yields 401 before any role or shape check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/products", payload: {}, as: BrandAdmin, captures: { list_ok: $.data } }
          assert:
            - "a request without X-User-Role or X-User-ID returns 401 ERR_UNAUTHENTICATED (verified by the test client omitting headers; list_ok confirms the control case succeeds)"
        note: "the negative half is exercised by the test client sending no auth headers; the structured call documents the positive control"

      - name: capacity_and_pull_boundaries
        claim_type: violation_to_error
        grounds: ['errors[ERR_CAPACITY_EXCEEDED"]', 'errors[ERR_LOT_EXPIRED]']
        excluded_because:
          difficulty_instance: boundary_precision_check / capacity_equality_allowed_excess_rejected
          rationale: "Capacity equality and excess asserted there; pull-deadline boundary asserted in pull_at_exact_deadline_is_on_time."

      - name: promo_floor_and_budget_error_triggers
        claim_type: violation_to_error
        grounds: ['errors[ERR_PROMO_BELOW_FLOOR"]', 'errors[ERR_PROMO_BUDGET_EXCEEDED]']
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_floor_beats_fiscal_on_promo_authorize
          rationale: "Both error ids are exercised as the dual-failure pair; the floor error is the asserted winner."

      - name: run_and_visit_overlap_error_triggers
        claim_type: violation_to_error
        grounds: ['errors[ERR_RUN_OVERLAP"]', 'errors[ERR_VISIT_TOO_CLOSE]']
        excluded_because:
