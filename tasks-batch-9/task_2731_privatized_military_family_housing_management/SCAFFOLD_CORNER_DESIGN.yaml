  # =========================================================================
  # SECTION 9 - CROSS-CUTTING LAYERS. One instance per declared complexity layer:
  # the three optimistic_concurrency rules of §1.2.1 each get their own probe (a
  # stale token refused, a fresh token accepted, and the accepted token refused on
  # replay), the ops-run checkpoints are probed through their epoch counters, the
  # ledger read is probed as pagination_with_filtering, and installation scoping is
  # probed as multi_tenancy. Layers whose whole point is a §1.8 depth probe are
  # stubbed against the instance that already carries them.
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: the_lease_version_token_is_consumed_by_the_write_that_uses_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.rent-redetermination-stale-lease
          - validations.priority_16
          - errors.ERR_STALE_LEASE_VERSION
          - endpoints.POST_/leases/{id}/rent-redetermination
          - entities.Lease.fields.rent_basis
          - entities.Lease.fields.rent_effective_year
        distinguishing_aspect: "Probes the OCC rule in four moves rather than two - stale refused, fresh accepted, the accepted token replayed and refused, then a re-read accepted - which is the only shape that shows the guard is a consumed token on a repeatable operation instead of a disguised state precondition."
        test_recipe:
          setup:
            - "One installation (Fort Cavazos Family Housing, ARMY, TX-FTC, bill_of_rights_version 2026.1) carrying the five Installation defaults: turn_buffer_days 5, offer_response_hours 72, decline_limit 2, decline_penalty_days 15, incentive_base_pct 0.03."
            - "One BahRate row for pay_grade E5, with_dependents true, effective_year 2026: monthly_rate_cents 245000, utility_allowance_cents 19500."
            - "One unit A-101, 2 bedrooms, TOWNHOME, designated JUNIOR_ENLISTED, historic_flag false."
            - "One E5 sponsor (rank_category JUNIOR_ENLISTED) with three full-time-custody dependents - spouse born 1992-03-04 plus two boys born 2018-04-10 and 2022-03-15 - so bedroom_eligibility is 2 and dependent_count is 3."
            - "The application (pcs_orders_date 2026-08-25) was offered A-101 by the offer run, accepted it, and the lease starting 2026-09-01 for 12 months was written, inspected and acknowledged."
            - "The lease is OCCUPIED / ACTIVE after move-in at 2026-09-01T09:00:00Z with gross_rent_cents 237650, utility_allowance_cents 19500, net_rent_cents 218150 and daily_rent_cents 7172; the unit is OCCUPIED; the allotment ledger is empty."
            - "The lease has been read once so its current version is in hand as ${l1_ver}; rent_basis is MOVE_IN_FINAL and rent_effective_year is 2026."
            - "The allotment ledger is empty and no allotment run has been made."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-09-01", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: "$.data.id" }
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l1_id}", scheduled_date: "2026-08-31" }
              as: PropertyManager
              captures: { insp1_id: "$.data.id" }
            - call: "POST /move-in-inspections/${insp1_id}/tenant-acknowledge"
              payload: { tenant_signature_name: "Ana Reyes", bill_of_rights_version_ack: "2026.1" }
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leases/${l1_id}/move-in"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "GET /leases/${l1_id}"
              payload: {}
              as: PropertyManager
              captures: { l1_ver: "$.data.version", l1_rent: "$.data.gross_rent_cents" }
            - call: "POST /leases/${l1_id}/rent-redetermination"
              payload: { expected_lease_version: "${l1_ver} - 1", effective_date: "2026-10-01" }
              as: PropertyManager
              captures: { e_stale1: "$.data.error_id" }
            - call: "POST /leases/${l1_id}/rent-redetermination"
              payload: { expected_lease_version: "${l1_ver}", effective_date: "2026-10-01" }
              as: PropertyManager
              captures: { v1: "$.data.version", rent1: "$.data.gross_rent_cents", basis1: "$.data.rent_basis", year1: "$.data.rent_effective_year" }
            - call: "POST /leases/${l1_id}/rent-redetermination"
              payload: { expected_lease_version: "${l1_ver}", effective_date: "2026-10-01" }
              as: PropertyManager
              captures: { e_replay: "$.data.error_id" }
            - call: "POST /leases/${l1_id}/rent-redetermination"
              payload: { expected_lease_version: "${v1}", effective_date: "2026-10-01" }
              as: PlatformAdmin
              captures: { v2: "$.data.version", rent2: "$.data.gross_rent_cents" }
            - call: "GET /leases/${l1_id}/allotment-transactions?limit=10&offset=0"
              payload: {}
              as: PropertyManager
          assert:
            - "${e_stale1} == ERR_STALE_LEASE_VERSION with HTTP 412 - a token one behind the stored version is refused even though every other precondition on the call is satisfiable."
            - "${v1} == ${l1_ver} + 1 - the accepted redetermination advanced Lease.version by exactly one."
            - "${e_replay} == ERR_STALE_LEASE_VERSION with HTTP 412 - REPLAYING the token that just worked is now refused, which is the property that separates optimistic concurrency from an idempotency key: the token is consumed by the write, not by the payload."
            - "${v2} == ${l1_ver} + 2 - a second redetermination from a FRESH read succeeds, so the endpoint carries no state precondition of its own; the version check is the only guard, exactly as §1.2.1 rent-redetermination-stale-lease describes."
            - "${rent1} == ${rent2} == ${l1_rent} == 237650 and ${basis1} == MOVE_IN_FINAL and ${year1} == 2026 - the money is identical across both accepted writes because the effective_date 2026-10-01 selects the same 2026 E5 with-dependents rate row; the version moved but the rent did not, so a version bump is not evidence of a repricing."
            - "The lease allotment-transactions read returns an empty array with total_count 0 - neither accepted redetermination posted an AllotmentTransaction; the new rent applies to subsequent allotment runs only."

      - name: recertification_is_repeatable_in_output_but_not_in_token
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.recertify-stale-application
          - validations.priority_17
          - errors.ERR_STALE_APPLICATION_VERSION
          - endpoints.POST_/waitlist-applications/{id}/recertify
          - entities.WaitlistApplication.fields.effective_control_date
          - entities.WaitlistApplication.fields.dependent_count_at_application
        distinguishing_aspect: "The second OCC rule, on a row whose accepted writes produce byte-identical business output - so the ONLY observable of a successful write is the version bump, and the two accepted calls are issued from the two different roles §1.5 allows to prove the token is row-scoped rather than caller-scoped."
