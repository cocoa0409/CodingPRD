# =============================================================================
# SCAFFOLD — School Bus Routing & Ridership (task_0232)
# Difficulty: Expert. §1.0–§1.7 (+ complexity_profile, concurrency_rules).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
#
# URL topology: FLAT. Every entity is a top-level collection (`/routes/{id}`,
# `/students/{id}`, …); parent links are body/query FK fields, never path nesting.
# api_prefix is the root mount ("") so collections live directly under it.
# =============================================================================

scenario: "School Bus Routing & Ridership: route/stop assignment, ridership eligibility (distance/hazard), GPS/ETA tracking, RFID tap on/off, parent notification, special-needs transport, substitute driver, missed-bus protocol"

domain_name: school-bus-routing-ridership
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: quota / allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # All entities are top-level collections joined by FK fields (district_id,
  # route_id, student_id, …) carried in bodies/queries — no nested URL paths.

  state_machine_shape: posture_driven
  # Route.posture (OPEN/RESTRICTED/SUSPENDED) gates BusTrip ops + ridership
  # assignment. BusTrip is a branching lifecycle with an incident fork + a
  # stop-to-stop self-loop. RidershipApplication has a cyclic revision loop
  # (UNDER_REVIEW <-> CHANGES_REQUESTED).

  relationship_patterns:
    - one_to_many        # District->Route, Route->Stop/BusTrip, BusTrip->TapEvent
    - cross_aggregate    # RidershipApplication.assigned_stop_id -> Stop across the Student aggregate
    - self_referential   # DriverAssignment.replaces_assignment_id -> DriverAssignment (substitute chain)

  role_model: peer_roles
  # TransportAdmin (opaque ops), Driver (entity_backed Driver, own trips/taps),
  # Parent (entity_backed Parent, owns Students + applications + reads notices).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "District name" }
      - { name: school_lat, type: number, source: input, description: "Latitude of the school campus, decimal degrees" }
      - { name: school_lng, type: number, source: input, description: "Longitude of the school campus, decimal degrees" }
      - { name: walk_threshold_miles, type: number, source: input, default: 1.5, description: "Students living strictly beyond this straight-line distance are distance-eligible; at-or-below are not (unless hazard-eligible)" }
      - { name: hazard_override_enabled, type: boolean, source: input, default: true, description: "When true, a hazard_zone home makes a within-threshold student eligible; when false, hazard is ignored and only distance counts" }
      - { name: missed_bus_grace_minutes, type: integer, source: input, default: 10, description: "Minutes after a Stop's scheduled_departure within which a missed-bus report may still be filed for that trip" }
      - { name: service_day_index, type: integer, source: system, default: 0, description: "Monotonic ops-epoch counter; advanced by POST /districts/{id}/advance-service-day" }
      - { name: active_route_count, type: integer, source: computed, description: "Count of Routes for this District whose posture IN {OPEN, RESTRICTED} (SUSPENDED excluded)" }

  - name: Route
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: name, type: string, source: input, description: "Route name/number" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum seated riders; must be > 0" }
      - { name: wheelchair_capacity, type: integer, source: input, default: 0, description: "Number of securement positions for special-needs (wheelchair) riders; must be >= 0" }
      - { name: posture, type: enum, source: system, default: OPEN, description: "OPEN | RESTRICTED | SUSPENDED. OPEN: full service. RESTRICTED: existing riders served, no new ridership assignment. SUSPENDED: no trips, no assignment." }
      - { name: assigned_rider_count, type: integer, source: computed, description: "Count of RidershipApplications in status APPROVED whose assigned_route_id is this Route" }
      - { name: assigned_wheelchair_count, type: integer, source: computed, description: "Count of APPROVED RidershipApplications on this Route whose Student.special_needs == true" }
      - { name: open_incident, type: boolean, source: computed, description: "True iff at least one BusTrip on this Route is in status INCIDENT_HOLD" }

  - name: Stop
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: label, type: string, source: input, description: "Human-readable stop label" }
      - { name: lat, type: number, source: input, description: "Stop latitude, decimal degrees" }
      - { name: lng, type: number, source: input, description: "Stop longitude, decimal degrees" }
      - { name: sequence, type: integer, source: input, description: "1-based order of this stop along the route; unique per Route; must be >= 1" }
      - { name: scheduled_departure, type: string, source: input, description: "ISO 8601 UTC time the bus is scheduled to depart this stop on any service day" }

  - name: Student
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: parent_id, type: string, source: input, description: "FK -> Parent.id; the parent/guardian who owns this student record" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: grade, type: integer, source: input, description: "Grade level 0 (K) through 12" }
      - { name: home_lat, type: number, source: input, description: "Home latitude, decimal degrees" }
      - { name: home_lng, type: number, source: input, description: "Home longitude, decimal degrees" }
      - { name: hazard_zone, type: boolean, source: input, default: false, description: "True iff the home->school walk crosses a state-designated hazard (no sidewalk, highway crossing)" }
      - { name: special_needs, type: boolean, source: input, default: false, description: "True iff the student requires a wheelchair securement position (special-needs transport)" }
      - { name: rfid_uid, type: string, source: input, description: "Unique RFID card UID for tap on/off; unique across all Students in the District" }
      - { name: home_distance_miles, type: number, source: computed, description: "Straight-line (haversine) miles from (home_lat,home_lng) to the District's (school_lat,school_lng), rounded to 2 dp" }

  - name: RidershipApplication
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: requested_route_id, type: string, source: input, description: "FK -> Route.id; the Route the parent requests" }
      - { name: requested_stop_id, type: string, source: input, description: "FK -> Stop.id; must belong to requested_route_id" }
      - { name: eligibility_basis, type: enum, source: computed, default: PENDING, description: "PENDING | DISTANCE | HAZARD | NONE. How the student qualifies; NONE means ineligible." }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | CHANGES_REQUESTED | APPROVED | DENIED | WITHDRAWN" }
      - { name: assigned_route_id, type: string, source: system, description: "FK -> Route.id; set on APPROVE, equals requested_route_id at approval time" }
      - { name: assigned_stop_id, type: string, source: system, description: "FK -> Stop.id; set on APPROVE, equals requested_stop_id at approval time" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Number of CHANGES_REQUESTED->resubmit cycles completed" }
      - { name: denial_reason, type: enum, source: system, description: "INELIGIBLE | ROUTE_FULL | WHEELCHAIR_FULL | ROUTE_NOT_OPEN | null" }

  - name: Driver
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: is_substitute, type: boolean, source: input, default: false, description: "True iff this driver may only hold substitute assignments" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | ON_DUTY. ON_DUTY while a BusTrip they drive is BOARDING/IN_TRANSIT; returns to AVAILABLE on complete/cancel/suspend-cascade." }

  - name: DriverAssignment
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: role, type: enum, source: input, default: PRIMARY, description: "PRIMARY | SUBSTITUTE. SUBSTITUTE requires replaces_assignment_id." }
      - { name: replaces_assignment_id, type: string, source: input, description: "FK -> DriverAssignment.id; required when role==SUBSTITUTE, names the PRIMARY assignment being covered; null for PRIMARY" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED. A PRIMARY becomes SUPERSEDED when a SUBSTITUTE that names it via replaces_assignment_id is created; the SUBSTITUTE itself stays ACTIVE." }

  - name: BusTrip
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: driver_assignment_id, type: string, source: input, description: "FK -> DriverAssignment.id; the ACTIVE assignment whose driver runs this trip" }
      - { name: service_day_index, type: integer, source: system, description: "District.service_day_index captured at trip creation" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | BOARDING | IN_TRANSIT | INCIDENT_HOLD | COMPLETED | CANCELLED" }
      - { name: current_stop_sequence, type: integer, source: system, default: 0, description: "Sequence of the stop the bus is currently at/heading to; 0 before BOARDING, set to 1 on start-boarding" }
      - { name: last_lat, type: number, source: system, description: "Most recent GPS latitude reported; null until first ping" }
      - { name: last_lng, type: number, source: system, description: "Most recent GPS longitude reported; null until first ping" }
      - { name: eta_next_stop_minutes, type: number, source: computed, description: "Estimated minutes to the current_stop_sequence stop; null when no next stop or before first ping/board" }
      - { name: onboard_count, type: integer, source: computed, description: "Number of Students currently ON the bus = unmatched TAP_ON events for this trip" }
      - { name: incident_count, type: integer, source: system, default: 0, description: "Number of times this trip has entered INCIDENT_HOLD" }

  - name: TapEvent
    parent: BusTrip
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: bus_trip_id, type: string, source: input, description: "FK -> BusTrip.id" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; resolved from rfid_uid at tap time" }
      - { name: rfid_uid, type: string, source: input, description: "RFID UID tapped; must resolve to a Student with an APPROVED RidershipApplication on this trip's Route" }
      - { name: direction, type: enum, source: input, description: "TAP_ON | TAP_OFF" }
      - { name: stop_sequence, type: integer, source: input, description: "Sequence of the Stop at which the tap occurred; must equal the trip's current_stop_sequence" }

  - name: ParentNotification
    parent: District
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: district_id, type: string, source: system, description: "FK -> District.id" }
      - { name: parent_id, type: string, source: system, description: "FK -> Parent.id; recipient guardian" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; subject student" }
      - { name: bus_trip_id, type: string, source: system, description: "FK -> BusTrip.id; the trip that triggered the notice (null for application-decision notices)" }
      - { name: kind, type: enum, source: system, description: "TAP_ON | TAP_OFF | MISSED_BUS | INCIDENT | APPLICATION_DECISION (each emitted by the correspondingly-named transition/endpoint side-effect)" }
      - { name: payload, type: object, source: system, description: "Notice body; e.g. {stop_sequence, eta_minutes, decision}" }

  - name: MissedBusReport
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the student who missed the bus" }
      - { name: bus_trip_id, type: string, source: input, description: "FK -> BusTrip.id; the trip that was missed" }
      - { name: reported_stop_sequence, type: integer, source: input, description: "Sequence of the Stop where the student should have boarded" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACKNOWLEDGED | RESOLVED. Lifecycle of the missed-bus protocol." }
      - { name: resolution, type: enum, source: system, description: "PARENT_PICKUP | REBOARDED_NEXT_TRIP | null" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Route.posture: posture-driven gate over BusTrip + ridership ----------
  - entity: Route
    field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /routes/{route_id}/posture (action=RESTRICT)"
        actor: TransportAdmin
        preconditions:
          - "Route.posture == OPEN"
          - "expected_route_version matches Route.version (OCC)"
        side_effects:
          - "increments Route.version by 1"
          - "While RESTRICTED, no RidershipApplication may be APPROVED onto this Route (gate at approve precondition)"
        note: "RESTRICTED keeps existing riders + running trips but blocks new ridership assignment."

      - from: RESTRICTED
        to: OPEN
        trigger: "POST /routes/{route_id}/posture (action=REOPEN)"
        actor: TransportAdmin
        preconditions:
          - "Route.posture == RESTRICTED"
          - "expected_route_version matches Route.version (OCC)"
        side_effects:
          - "increments Route.version by 1"

      - from: OPEN
        to: SUSPENDED
        trigger: "POST /routes/{route_id}/posture (action=SUSPEND)"
        actor: TransportAdmin
        preconditions:
          - "Route.posture == OPEN"
          - "No BusTrip on this Route in status BOARDING or IN_TRANSIT (else ERR_TRIP_IN_FLIGHT)"
          - "expected_route_version matches Route.version (OCC)"
        side_effects:
          - "increments Route.version by 1"
          - "Cascade: every SCHEDULED BusTrip on this Route -> CANCELLED"
          - "Cascade: each cancelled trip's Driver.status -> AVAILABLE if it was ON_DUTY for that trip"

      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /routes/{route_id}/posture (action=SUSPEND)"
        actor: TransportAdmin
        preconditions:
          - "Route.posture == RESTRICTED"
          - "No BusTrip on this Route in status BOARDING or IN_TRANSIT (else ERR_TRIP_IN_FLIGHT)"
          - "expected_route_version matches Route.version (OCC)"
        side_effects:
          - "increments Route.version by 1"
          - "Cascade: every SCHEDULED BusTrip on this Route -> CANCELLED"
          - "Cascade: each cancelled trip's Driver.status -> AVAILABLE if it was ON_DUTY for that trip"

      - from: SUSPENDED
        to: OPEN
        trigger: "POST /routes/{route_id}/posture (action=REOPEN)"
        actor: TransportAdmin
        preconditions:
          - "Route.posture == SUSPENDED"
          - "expected_route_version matches Route.version (OCC)"
        side_effects:
          - "increments Route.version by 1"

  # ---- RidershipApplication: cyclic revision loop + branching decision ------
  - entity: RidershipApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /ridership-applications/{application_id}/start-review"
        actor: TransportAdmin
        preconditions:
          - "RidershipApplication.status == SUBMITTED"
        side_effects:
          - "eligibility_basis recomputed via eligibility_determination calc (DISTANCE | HAZARD | NONE)"

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /ridership-applications/{application_id}/request-changes"
        actor: TransportAdmin
        preconditions:
          - "RidershipApplication.status == UNDER_REVIEW"
        side_effects: []

      - from: CHANGES_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /ridership-applications/{application_id}/resubmit"
        actor: Parent
        preconditions:
          - "RidershipApplication.status == CHANGES_REQUESTED"
          - "Acting Parent owns the Student (X-User-ID == Student.parent_id)"
        side_effects:
          - "review_round incremented by 1"
          - "requested_route_id / requested_stop_id may be updated from the resubmit body"
          - "eligibility_basis recomputed via eligibility_determination calc"
        note: "Cyclic revision loop between UNDER_REVIEW and CHANGES_REQUESTED."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /ridership-applications/{application_id}/approve"
        actor: TransportAdmin
        preconditions:
          - "RidershipApplication.status == UNDER_REVIEW"
          - "eligibility_basis IN {DISTANCE, HAZARD} (NONE -> ERR_NOT_ELIGIBLE)"
          - "requested Route.posture == OPEN (RESTRICTED/SUSPENDED -> ERR_ROUTE_NOT_OPEN)"
          - "requested Route.assigned_rider_count < Route.seat_capacity (else ERR_ROUTE_FULL)"
          - "if Student.special_needs: requested Route.assigned_wheelchair_count < Route.wheelchair_capacity (else ERR_WHEELCHAIR_FULL)"
        side_effects:
          - "assigned_route_id = requested_route_id, assigned_stop_id = requested_stop_id"
          - "Route.assigned_rider_count recomputed (+1); if special_needs, Route.assigned_wheelchair_count recomputed (+1)"
          - "ParentNotification(kind=APPLICATION_DECISION, payload.decision=APPROVED) appended for Student.parent_id"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /ridership-applications/{application_id}/deny"
        actor: TransportAdmin
        preconditions:
          - "RidershipApplication.status == UNDER_REVIEW"
        side_effects:
          - "denial_reason set from body (INELIGIBLE | ROUTE_FULL | WHEELCHAIR_FULL | ROUTE_NOT_OPEN)"
          - "ParentNotification(kind=APPLICATION_DECISION, payload.decision=DENIED) appended for Student.parent_id"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /ridership-applications/{application_id}/withdraw"
        actor: Parent
        preconditions:
          - "RidershipApplication.status == SUBMITTED"
          - "Acting Parent owns the Student"
        side_effects: []

      - from: CHANGES_REQUESTED
        to: WITHDRAWN
        trigger: "POST /ridership-applications/{application_id}/withdraw"
        actor: Parent
        preconditions:
          - "RidershipApplication.status == CHANGES_REQUESTED"
          - "Acting Parent owns the Student"
        side_effects: []

  # ---- BusTrip: branching lifecycle with incident fork + stop self-loop -----
  - entity: BusTrip
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BOARDING
        trigger: "POST /bus-trips/{bus_trip_id}/start-boarding"
        actor: Driver
        preconditions:
          - "BusTrip.status == SCHEDULED"
          - "Route.posture IN {OPEN, RESTRICTED} (SUSPENDED -> ERR_ROUTE_NOT_OPEN)"
          - "Acting Driver is the driver of BusTrip.driver_assignment_id"
          - "the DriverAssignment.status == ACTIVE (else ERR_ASSIGNMENT_NOT_ACTIVE)"
          - "the Driver is not already running another in-flight trip (no other BusTrip with the same driver in status BOARDING or IN_TRANSIT) (else ERR_DRIVER_DOUBLE_BOOKED)"
        side_effects:
          - "current_stop_sequence set to 1 (first stop)"
          - "Driver.status -> ON_DUTY"

      - from: BOARDING
        to: IN_TRANSIT
        trigger: "POST /bus-trips/{bus_trip_id}/depart-stop"
        actor: Driver
        preconditions:
          - "BusTrip.status == BOARDING"
          - "body stop_sequence == BusTrip.current_stop_sequence"
        side_effects:
          - "current_stop_sequence advanced to the next Stop.sequence on the Route (smallest sequence greater than current)"
          - "eta_next_stop_minutes recomputed via eta_estimate calc"

      - from: IN_TRANSIT
        to: IN_TRANSIT
        trigger: "POST /bus-trips/{bus_trip_id}/depart-stop"
        actor: Driver
        preconditions:
          - "BusTrip.status == IN_TRANSIT"
          - "body stop_sequence == BusTrip.current_stop_sequence"
          - "BusTrip.current_stop_sequence is not the final Stop.sequence on the Route"
        side_effects:
          - "current_stop_sequence advanced to the next Stop.sequence"
          - "eta_next_stop_minutes recomputed via eta_estimate calc"
        note: "Self-loop: progress stop to stop while more stops remain."

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /bus-trips/{bus_trip_id}/complete"
        actor: Driver
        preconditions:
          - "BusTrip.status == IN_TRANSIT"
          - "BusTrip.current_stop_sequence equals the final Stop.sequence on the Route"
          - "onboard_count == 0 (else ERR_RIDERS_STILL_ONBOARD)"
        side_effects:
          - "eta_next_stop_minutes -> null"
          - "Driver.status -> AVAILABLE"

      - from: BOARDING
        to: INCIDENT_HOLD
        trigger: "POST /bus-trips/{bus_trip_id}/raise-incident"
        actor: Driver
        preconditions:
          - "BusTrip.status == BOARDING"
        side_effects:
          - "incident_count incremented by 1"
          - "Route.open_incident recomputed -> true"
          - "ParentNotification(kind=INCIDENT) appended for every Student currently ON the bus (onboard set)"

      - from: IN_TRANSIT
        to: INCIDENT_HOLD
        trigger: "POST /bus-trips/{bus_trip_id}/raise-incident"
        actor: Driver
        preconditions:
          - "BusTrip.status == IN_TRANSIT"
        side_effects:
          - "incident_count incremented by 1"
          - "Route.open_incident recomputed -> true"
          - "ParentNotification(kind=INCIDENT) appended for every onboard Student"

      - from: INCIDENT_HOLD
        to: IN_TRANSIT
        trigger: "POST /bus-trips/{bus_trip_id}/clear-incident"
        actor: TransportAdmin
        preconditions:
          - "BusTrip.status == INCIDENT_HOLD"
        side_effects:
          - "Route.open_incident recomputed (false iff no other INCIDENT_HOLD trips remain on the Route)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /bus-trips/{bus_trip_id}/cancel  OR  Route SUSPEND cascade"
        actor: "TransportAdmin or system"
        preconditions:
          - "BusTrip.status == SCHEDULED"
        side_effects:
          - "Driver.status -> AVAILABLE if it was ON_DUTY for this trip"

  # ---- MissedBusReport: linear missed-bus protocol lifecycle ----------------
  - entity: MissedBusReport
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /missed-bus-reports/{report_id}/acknowledge"
        actor: TransportAdmin
        preconditions:
          - "MissedBusReport.status == OPEN"
        side_effects: []

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /missed-bus-reports/{report_id}/resolve"
        actor: TransportAdmin
        preconditions:
          - "MissedBusReport.status == ACKNOWLEDGED"
        side_effects:
          - "resolution set from body (PARENT_PICKUP | REBOARDED_NEXT_TRIP)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: posture-change-stale-route
    parent_entity: Route
    write_endpoint: "POST /routes/{route_id}/posture"
    occ_field: "expected_route_version"
    description: |
      Changing a Route's posture against a Route whose version has advanced since
      the client last observed it is rejected. A posture write legitimately
      supersedes the prior posture, so a writer holding a stale version (an earlier
      posture write already flipped OPEN->RESTRICTED and advanced the version) is
      rejected on the stale-version check rather than silently re-flipping.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: substitute-assign-stale-route
    parent_entity: Route
    write_endpoint: "POST /routes/{route_id}/driver-assignments"
    occ_field: "expected_route_version"
    description: |
      Creating a SUBSTITUTE DriverAssignment that supersedes a PRIMARY on a Route
      whose version has advanced since the client last read it is rejected. The
      substitute legitimately supersedes the primary, so a writer holding a stale
      Route version (an earlier assignment creation already advanced it) is rejected
      on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: home_distance_haversine
    trigger: "Student create (POST /students); referenced by eligibility_determination"
    algorithm: weighted_scoring
    formula: |
      # Great-circle (haversine) straight-line distance, home -> school, in miles.
      R_MILES = 3958.7613
      dlat = radians(home_lat - school_lat)
      dlng = radians(home_lng - school_lng)
      a = sin(dlat/2)**2 + cos(radians(home_lat))*cos(radians(school_lat))*sin(dlng/2)**2
      c = 2 * asin(sqrt(a))
      home_distance_miles = round(R_MILES * c, 2)   # round_half_up, 2 dp
    input_set: "Single Student's home coords vs its District's school coords."
    constants:
      R_MILES: 3958.7613
    precision: "2 decimal places, round_half_up"

  - name: eligibility_determination
    trigger: "RidershipApplication start-review and resubmit transitions"
    algorithm: threshold
    formula: |
      # Distance dominates; hazard is an override only when enabled. Strict > on distance.
      d = Student.home_distance_miles
      T = District.walk_threshold_miles
      if d > T:                                  # strictly beyond threshold
          eligibility_basis = DISTANCE
      elif District.hazard_override_enabled and Student.hazard_zone:
          eligibility_basis = HAZARD
      else:
          eligibility_basis = NONE
      # Boundary: d == T exactly is NOT distance-eligible (uses > not >=); falls
      # through to HAZARD (if override enabled and hazard_zone) else NONE.
    input_set: "One Student + its District config. Distance compared with strict > T."
    constants:
      BOUNDARY_NOTE: "At d == T exactly, basis is HAZARD (if enabled+zone) else NONE."
    precision: "Comparison on 2-dp home_distance_miles vs walk_threshold_miles"

  - name: eta_estimate
    trigger: "BusTrip depart-stop transitions and GPS ping (POST /bus-trips/{id}/gps)"
    algorithm: forward_looking
    formula: |
      # Straight-line distance from the measurement origin to the next undeparted
      # Stop (the Stop whose sequence == current_stop_sequence), / avg speed -> minutes.
      AVG_SPEED_MPH = 25.0
      R_MILES = 3958.7613
      next_stop = Stop on the Route whose sequence == BusTrip.current_stop_sequence
      if next_stop is null (current_stop_sequence past final stop): eta_next_stop_minutes = null
      else:
        dist_miles = haversine(origin, (next_stop.lat, next_stop.lng))   # same R_MILES
        eta_next_stop_minutes = round((dist_miles / AVG_SPEED_MPH) * 60.0, 1)   # 1 dp, round_half_up
    input_set: "Measurement origin (GPS ping or previous stop) + next undeparted Stop."
    constants:
      AVG_SPEED_MPH: 25.0
      R_MILES: 3958.7613
    precision: "1 decimal place, round_half_up"
    variants:
      - name: gps_based
        when: "A GPS ping has been recorded for the trip (last_lat/last_lng set)"
        difference: "origin = the actual last ping coordinates (last_lat,last_lng)."
      - name: stop_based_fallback
        when: "No GPS ping yet (last_lat/last_lng null) but trip is BOARDING/IN_TRANSIT"
        difference: "origin = the previously departed Stop's coords (or the school for stop 1); same speed constant."

  - name: onboard_count_projection
    trigger: "Every TapEvent create; read on BusTrip; precondition of complete"
    algorithm: projection
    formula: |
      # Replay the trip's append-only TapEvent log in created_at ASC order
      # (ties broken by sequence ASC — created_at, never id).
      onboard = empty set
      for ev in TapEvents(bus_trip_id) ordered by created_at ASC, then stop_sequence ASC:
          if ev.direction == TAP_ON:  onboard.add(ev.student_id)
          if ev.direction == TAP_OFF: onboard.discard(ev.student_id)
      onboard_count = size(onboard)
    input_set: "All TapEvents for the trip, replayed chronologically."
    precision: "Integer count; no rounding."

  - name: missed_bus_window
    trigger: "POST /missed-bus-reports (file report)"
    algorithm: threshold
    formula: |
      # A report is accepted iff (timely) AND (bus departed the stop) AND (no tap-on).
      stop = Stop with sequence == reported_stop_sequence on the trip's Route
      grace = District.missed_bus_grace_minutes
      now = current server clock (POST /_clock/set_current_utc controls it in tests)
      deadline = stop.scheduled_departure + grace minutes
      timely   = (now <= deadline)               # inclusive boundary: now == deadline IS timely
      departed = (BusTrip.current_stop_sequence > reported_stop_sequence) OR BusTrip.status == COMPLETED
      no_tap_on = no TAP_ON TapEvent exists for (student_id, bus_trip_id)
      accept iff timely AND departed AND no_tap_on; else ERR_MISSED_BUS_WINDOW.
    input_set: "One trip + its Stop + the student's TapEvents + the District grace + server clock."
    constants:
      BOUNDARY_NOTE: "now == deadline is INSIDE the window (<=, not <)."
    precision: "Whole-minute clock comparison."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC; Parent acting on a Student/application they do not own is denied"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums valid, numbers in range (seat_capacity>0, wheelchair_capacity>=0, sequence>=1, grade 0..12, lat/lng numeric)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 5
    category: business_referential
    check: "Body FK references resolve and respect parentage (requested_stop_id belongs to requested_route_id; driver_assignment belongs to the trip's Route; rfid_uid resolves to a Student in the District; route/student belong to district)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "POST /routes, POST /stops, POST /ridership-applications, POST /driver-assignments, POST /bus-trips, POST /bus-trips/{id}/taps, POST /missed-bus-reports"

  - priority: 6
    category: business_constraint
    check: "rfid_uid is unique within the District; Stop.sequence is unique within the Route"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /students, POST /stops"

  - priority: 6.5
    category: business_temporal
    check: "A new Stop's scheduled_departure must be strictly later than every existing Stop on the Route with a lower sequence AND strictly earlier than every existing Stop with a higher sequence (the route's stop times are a strictly increasing 1-D timeline; adjacency-collision or inversion is rejected)"
    error_id: ERR_STOP_TIME_ORDER
    http_status: 422
    applies_to: "POST /stops"

  - priority: 7
    category: state
    check: "OCC: expected_route_version matches Route.version on posture and substitute-assignment writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /routes/{id}/posture, POST /routes/{id}/driver-assignments"

  - priority: 8
    category: state
    check: "Target resource is in a legal state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions"

  - priority: 9
    category: business_safety
    check: "A Route cannot be SUSPENDED while any of its BusTrips is BOARDING or IN_TRANSIT"
    error_id: ERR_TRIP_IN_FLIGHT
    http_status: 409
    applies_to: "POST /routes/{id}/posture (SUSPEND)"

  - priority: 10
    category: business_safety
    check: "start-boarding requires the trip's DriverAssignment.status == ACTIVE"
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bus-trips/{id}/start-boarding"

  - priority: 10.5
    category: business_temporal
    check: "start-boarding is rejected when the trip's Driver is already running another in-flight trip (a BusTrip in BOARDING or IN_TRANSIT) — a driver occupies at most one in-flight slot at a time"
    error_id: ERR_DRIVER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bus-trips/{id}/start-boarding"

  - priority: 11
    category: business_safety
    check: "A SUBSTITUTE DriverAssignment must name a replaces_assignment_id that is an ACTIVE PRIMARY on the same Route; a substitute driver (is_substitute) may never hold a PRIMARY"
    error_id: ERR_SUBSTITUTE_RULE
    http_status: 409
    applies_to: "POST /routes/{id}/driver-assignments"

  - priority: 12
    category: business_constraint
    check: "A trip may be completed only when onboard_count == 0"
    error_id: ERR_RIDERS_STILL_ONBOARD
    http_status: 409
    applies_to: "POST /bus-trips/{id}/complete"

  - priority: 13
    category: business_referential
    check: "A tap's student must have an APPROVED RidershipApplication whose assigned_route_id is this trip's Route"
    error_id: ERR_NOT_ASSIGNED_RIDER
    http_status: 409
    applies_to: "POST /bus-trips/{id}/taps"

  - priority: 14
    category: business_constraint
    check: "A TAP_OFF requires a prior unmatched TAP_ON for the same student on this trip; a TAP_ON requires the student not currently onboard"
    error_id: ERR_TAP_SEQUENCE
    http_status: 409
    applies_to: "POST /bus-trips/{id}/taps"

  - priority: 15
    category: business_constraint
    check: "Applicant eligibility_basis must be DISTANCE or HAZARD to approve"
    error_id: ERR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /ridership-applications/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "Approval requires requested Route.posture == OPEN"
    error_id: ERR_ROUTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /ridership-applications/{id}/approve"

  - priority: 17
    category: business_fiscal
    check: "Approval requires assigned_rider_count < seat_capacity"
    error_id: ERR_ROUTE_FULL
    http_status: 409
    applies_to: "POST /ridership-applications/{id}/approve"

  - priority: 18
    category: business_fiscal
    check: "Approval of a special_needs student requires assigned_wheelchair_count < wheelchair_capacity"
    error_id: ERR_WHEELCHAIR_FULL
    http_status: 409
    applies_to: "POST /ridership-applications/{id}/approve"

  - priority: 19
    category: business_temporal
    check: "A missed-bus report is rejected if filed after scheduled_departure + grace_minutes, or before the bus departed that stop, or if a TAP_ON exists for the student on that trip"
    error_id: ERR_MISSED_BUS_WINDOW
    http_status: 409
    applies_to: "POST /missed-bus-reports"

# =============================================================================
# §1.5 API Endpoint Table  (FLAT topology — collections at root)
# =============================================================================
endpoints:
  # ---- District -------------------------------------------------------------
  - method: POST
    path: "/districts"
    description: "Create a District"
    roles: [TransportAdmin]
    code: 201
    input: [name, school_lat, school_lng, "walk_threshold_miles?", "hazard_override_enabled?", "missed_bus_grace_minutes?"]
    output: District
    side_effects: ["service_day_index=0; active_route_count computed as 0"]

  - method: GET
    path: "/districts/{district_id}"
    description: "Get a District"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: POST
    path: "/districts/{district_id}/advance-service-day"
    description: "Advance the district service-day epoch counter"
    roles: [TransportAdmin]
    code: 200
    input: []
    output: District
    side_effects: ["service_day_index incremented by 1"]

  # ---- Route ----------------------------------------------------------------
  - method: POST
    path: "/routes"
    description: "Create a Route"
    roles: [TransportAdmin]
    code: 201
    input: [district_id, name, seat_capacity, "wheelchair_capacity?"]
    output: Route
    side_effects: ["posture=OPEN; assigned_rider_count=0; assigned_wheelchair_count=0; open_incident=false"]

  - method: GET
    path: "/routes"
    description: "List Routes (filter by district_id — reverse-reachability for Route.district_id; filter by posture)"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: ["district_id?", "posture?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: GET
    path: "/routes/{route_id}"
    description: "Get a Route"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/routes/{route_id}/posture"
    description: "Change Route posture (action RESTRICT | REOPEN | SUSPEND)"
    roles: [TransportAdmin]
    code: 200
    input: [action, expected_route_version]
    output: Route
    side_effects:
      - "increments Route.version by 1"
      - "SUSPEND cascades SCHEDULED BusTrips -> CANCELLED and frees their ON_DUTY drivers"

  # ---- Stop -----------------------------------------------------------------
  - method: POST
    path: "/stops"
    description: "Add a Stop to a Route"
    roles: [TransportAdmin]
    code: 201
    input: [route_id, label, lat, lng, sequence, scheduled_departure]
    output: Stop
    side_effects: []

  - method: GET
    path: "/stops"
    description: "List Stops (filter by route_id — reverse-reachability for Stop.route_id)"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: ["route_id?", "limit?", "offset?"]
    output: Stop[]
    side_effects: []

  - method: GET
    path: "/stops/{stop_id}"
    description: "Get a Stop"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: []
    output: Stop
    side_effects: []

  # ---- Student --------------------------------------------------------------
  - method: POST
    path: "/students"
    description: "Register a Student (parent-owned)"
    roles: [TransportAdmin, Parent]
    code: 201
    input: [district_id, parent_id, full_name, grade, home_lat, home_lng, rfid_uid, "hazard_zone?", "special_needs?"]
    output: Student
    side_effects: ["home_distance_miles computed via home_distance_haversine"]

  - method: GET
    path: "/students/{student_id}"
    description: "Get a Student"
    roles: [TransportAdmin, Parent]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: "List Students (filter by district_id / parent_id — reverse-reachability for Student.district_id and Student.parent_id)"
    roles: [TransportAdmin, Parent]
    code: 200
    input: ["district_id?", "parent_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  # ---- RidershipApplication -------------------------------------------------
  - method: POST
    path: "/ridership-applications"
    description: "Submit a ridership application for a Student"
    roles: [TransportAdmin, Parent]
    code: 201
    input: [district_id, student_id, requested_route_id, requested_stop_id]
    output: RidershipApplication
    side_effects: ["status=SUBMITTED; eligibility_basis=PENDING"]

  - method: GET
    path: "/ridership-applications/{application_id}"
    description: "Get a ridership application"
    roles: [TransportAdmin, Parent]
    code: 200
    input: []
    output: RidershipApplication
    side_effects: []

  - method: GET
    path: "/ridership-applications"
    description: "List ridership applications (filter by district_id / student_id / requested_route_id / assigned_route_id / status — reverse-reachability)"
    roles: [TransportAdmin, Parent]
    code: 200
    input: ["district_id?", "student_id?", "requested_route_id?", "requested_stop_id?", "assigned_route_id?", "assigned_stop_id?", "status?", "limit?", "offset?"]
    output: RidershipApplication[]
    side_effects: []

  - method: POST
    path: "/ridership-applications/{application_id}/start-review"
    description: "Begin review (computes eligibility_basis)"
    roles: [TransportAdmin]
    code: 200
    input: []
    output: RidershipApplication
    side_effects: ["status->UNDER_REVIEW; eligibility_basis recomputed"]

  - method: POST
    path: "/ridership-applications/{application_id}/request-changes"
    description: "Request changes from the parent"
    roles: [TransportAdmin]
    code: 200
    input: []
    output: RidershipApplication
    side_effects: ["status->CHANGES_REQUESTED"]

  - method: POST
    path: "/ridership-applications/{application_id}/resubmit"
    description: "Parent resubmits (cyclic revision loop)"
    roles: [Parent]
    code: 200
    input: ["requested_route_id?", "requested_stop_id?"]
    output: RidershipApplication
    side_effects: ["status->UNDER_REVIEW; review_round +1; eligibility_basis recomputed"]

  - method: POST
    path: "/ridership-applications/{application_id}/approve"
    description: "Approve and assign the rider to the route/stop"
    roles: [TransportAdmin]
    code: 200
    input: []
    output: RidershipApplication
    side_effects:
      - "assigned_route_id/assigned_stop_id set; Route.assigned_rider_count +1; assigned_wheelchair_count +1 if special_needs"
      - "ParentNotification(kind=APPLICATION_DECISION) appended"

  - method: POST
    path: "/ridership-applications/{application_id}/deny"
    description: "Deny the application"
    roles: [TransportAdmin]
    code: 200
    input: [denial_reason]
    output: RidershipApplication
    side_effects: ["status->DENIED; ParentNotification appended"]

  - method: POST
    path: "/ridership-applications/{application_id}/withdraw"
    description: "Parent withdraws the application"
    roles: [Parent]
    code: 200
    input: []
    output: RidershipApplication
    side_effects: ["status->WITHDRAWN"]

  # ---- Driver ---------------------------------------------------------------
  - method: POST
    path: "/drivers"
    description: "Create a Driver"
    roles: [TransportAdmin]
    code: 201
    input: [district_id, full_name, "is_substitute?"]
    output: Driver
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/drivers/{driver_id}"
    description: "Get a Driver"
    roles: [TransportAdmin, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: GET
    path: "/drivers"
    description: "List Drivers (filter by district_id — reverse-reachability for Driver.district_id)"
    roles: [TransportAdmin, Driver]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []

  # ---- DriverAssignment -----------------------------------------------------
  - method: POST
    path: "/routes/{route_id}/driver-assignments"
    description: "Assign a driver to a Route (PRIMARY or SUBSTITUTE supersede)"
    roles: [TransportAdmin]
    code: 201
    input: [driver_id, "role?", "replaces_assignment_id?", expected_route_version]
    output: DriverAssignment
    side_effects:
      - "increments Route.version by 1"
      - "SUBSTITUTE: the named PRIMARY DriverAssignment.status -> SUPERSEDED"

  - method: GET
    path: "/driver-assignments/{assignment_id}"
    description: "Get a driver assignment"
    roles: [TransportAdmin, Driver]
    code: 200
    input: []
    output: DriverAssignment
    side_effects: []

  - method: GET
    path: "/driver-assignments"
    description: "List driver assignments (filter by route_id / driver_id / replaces_assignment_id / status — reverse-reachability)"
    roles: [TransportAdmin, Driver]
    code: 200
    input: ["route_id?", "driver_id?", "replaces_assignment_id?", "status?", "limit?", "offset?"]
    output: DriverAssignment[]
    side_effects: []

  # ---- BusTrip --------------------------------------------------------------
  - method: POST
    path: "/bus-trips"
    description: "Schedule a BusTrip on a Route for the current service day"
    roles: [TransportAdmin]
    code: 201
    input: [route_id, driver_assignment_id]
    output: BusTrip
    side_effects: ["status=SCHEDULED; service_day_index captured; current_stop_sequence=0"]

  - method: GET
    path: "/bus-trips/{bus_trip_id}"
    description: "Get a BusTrip (includes computed eta and onboard_count)"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: []
    output: BusTrip
    side_effects: []

  - method: GET
    path: "/bus-trips"
    description: "List BusTrips (filter by route_id / driver_assignment_id / status — reverse-reachability)"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: ["route_id?", "driver_assignment_id?", "status?", "limit?", "offset?"]
    output: BusTrip[]
    side_effects: []

  - method: POST
    path: "/bus-trips/{bus_trip_id}/gps"
    description: "Report a GPS ping for a trip (drives ETA)"
    roles: [Driver]
    code: 200
    input: [lat, lng]
    output: BusTrip
    side_effects: ["last_lat/last_lng updated; eta_next_stop_minutes recomputed via eta_estimate (gps_based variant)"]

  - method: POST
    path: "/bus-trips/{bus_trip_id}/start-boarding"
    description: "Driver starts boarding at the first stop"
    roles: [Driver]
    code: 200
    input: []
    output: BusTrip
    side_effects: ["status->BOARDING; current_stop_sequence=1; Driver.status->ON_DUTY"]

  - method: POST
    path: "/bus-trips/{bus_trip_id}/depart-stop"
    description: "Driver departs the current stop, advancing to the next"
    roles: [Driver]
    code: 200
    input: [stop_sequence]
    output: BusTrip
    side_effects: ["current_stop_sequence advanced; eta recomputed; first depart moves BOARDING->IN_TRANSIT"]

  - method: POST
    path: "/bus-trips/{bus_trip_id}/raise-incident"
    description: "Driver raises an incident hold on the trip"
    roles: [Driver]
    code: 200
    input: []
    output: BusTrip
    side_effects:
      - "status->INCIDENT_HOLD; incident_count +1; Route.open_incident->true"
      - "ParentNotification(kind=INCIDENT) appended for every onboard Student"

  - method: POST
    path: "/bus-trips/{bus_trip_id}/clear-incident"
    description: "Admin clears an incident hold (returns to IN_TRANSIT)"
    roles: [TransportAdmin]
    code: 200
    input: []
    output: BusTrip
    side_effects: ["status->IN_TRANSIT; Route.open_incident recomputed"]

  - method: POST
    path: "/bus-trips/{bus_trip_id}/complete"
    description: "Driver completes the trip (requires onboard_count==0)"
    roles: [Driver]
    code: 200
    input: []
    output: BusTrip
    side_effects: ["status->COMPLETED; eta->null; Driver.status->AVAILABLE"]

  - method: POST
    path: "/bus-trips/{bus_trip_id}/cancel"
    description: "Admin cancels a SCHEDULED trip"
    roles: [TransportAdmin]
    code: 200
    input: []
    output: BusTrip
    side_effects: ["status->CANCELLED; Driver freed if ON_DUTY"]

  # ---- TapEvent -------------------------------------------------------------
  - method: POST
    path: "/bus-trips/{bus_trip_id}/taps"
    description: "Record an RFID tap on/off; sends parent notification"
    roles: [Driver]
    code: 201
    input: [rfid_uid, direction, stop_sequence]
    output: TapEvent
    side_effects:
      - "TapEvent appended; BusTrip.onboard_count recomputed"
      - "ParentNotification(kind=TAP_ON|TAP_OFF) appended for the student's parent"

  - method: GET
    path: "/tap-events/{tap_event_id}"
    description: "Get a single TapEvent"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: []
    output: TapEvent
    side_effects: []

  - method: GET
    path: "/tap-events"
    description: "List TapEvents (filter by bus_trip_id / student_id / direction — reverse-reachability for TapEvent.bus_trip_id and .student_id)"
    roles: [TransportAdmin, Parent, Driver]
    code: 200
    input: ["bus_trip_id?", "student_id?", "direction?", "limit?", "offset?"]
    output: TapEvent[]
    side_effects: []

  # ---- ParentNotification ---------------------------------------------------
  - method: GET
    path: "/parent-notifications/{notification_id}"
    description: "Get a single ParentNotification"
    roles: [TransportAdmin, Parent]
    code: 200
    input: []
    output: ParentNotification
    side_effects: []

  - method: GET
    path: "/parent-notifications"
    description: "List parent notifications (filter by district_id / parent_id / student_id / bus_trip_id / kind — reverse-reachability)"
    roles: [TransportAdmin, Parent]
    code: 200
    input: ["district_id?", "parent_id?", "student_id?", "bus_trip_id?", "kind?", "limit?", "offset?"]
    output: ParentNotification[]
    side_effects: []

  # ---- MissedBusReport ------------------------------------------------------
  - method: POST
    path: "/missed-bus-reports"
    description: "File a missed-bus report (missed-bus protocol)"
    roles: [TransportAdmin, Parent]
    code: 201
    input: [district_id, student_id, bus_trip_id, reported_stop_sequence]
    output: MissedBusReport
    side_effects:
      - "status=OPEN; ParentNotification(kind=MISSED_BUS) appended"

  - method: GET
    path: "/missed-bus-reports/{report_id}"
    description: "Get a missed-bus report"
    roles: [TransportAdmin, Parent]
    code: 200
    input: []
    output: MissedBusReport
    side_effects: []

  - method: GET
    path: "/missed-bus-reports"
    description: "List missed-bus reports (filter by district_id / student_id / bus_trip_id / status — reverse-reachability)"
    roles: [TransportAdmin, Parent]
    code: 200
    input: ["district_id?", "student_id?", "bus_trip_id?", "status?", "limit?", "offset?"]
    output: MissedBusReport[]
    side_effects: []

  - method: POST
    path: "/missed-bus-reports/{report_id}/acknowledge"
    description: "Admin acknowledges an open report"
    roles: [TransportAdmin]
    code: 200
    input: []
    output: MissedBusReport
    side_effects: ["status OPEN->ACKNOWLEDGED"]

  - method: POST
    path: "/missed-bus-reports/{report_id}/resolve"
    description: "Admin resolves an acknowledged report"
    roles: [TransportAdmin]
    code: 200
    input: [resolution]
    output: MissedBusReport
    side_effects: ["status ACKNOWLEDGED->RESOLVED; resolution set"]

  # ---- Test-driving endpoint (clock) ----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-only: set the server's current UTC clock (drives missed-bus window)"
    roles: [TransportAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN,              http: 403, condition: "Acting role not permitted for this operation, or Parent acting on a Student/application they do not own" }
  - { id: ERR_NOT_FOUND,              http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST,       http: 422, condition: "Malformed body: missing required field, bad enum, or numeric out of range (seat_capacity<=0, sequence<1, grade out of 0..12)" }
  - { id: ERR_INVALID_REFERENCE,     http: 422, condition: "A body FK does not resolve or violates parentage (stop not on requested route; assignment not on trip's route; rfid not in district)" }
  - { id: ERR_DUPLICATE,             http: 409, condition: "rfid_uid already used in the District, or Stop.sequence already used on the Route" }
  - { id: ERR_STOP_TIME_ORDER,       http: 422, condition: "New Stop's scheduled_departure breaks the route's strictly-increasing stop-time timeline relative to lower/higher-sequence stops" }
  - { id: ERR_DRIVER_DOUBLE_BOOKED,  http: 409, condition: "start-boarding while the Driver already runs an in-flight (BOARDING/IN_TRANSIT) trip" }
  - { id: ERR_STALE_VERSION,         http: 412, condition: "expected_route_version does not match the Route's current version (OCC)" }
  - { id: ERR_INVALID_STATE,         http: 409, condition: "Target resource is not in a legal state for the requested transition" }
  - { id: ERR_TRIP_IN_FLIGHT,        http: 409, condition: "Route SUSPEND attempted while a BusTrip is BOARDING or IN_TRANSIT" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "start-boarding attempted with a DriverAssignment whose status is not ACTIVE" }
  - { id: ERR_SUBSTITUTE_RULE,       http: 409, condition: "Substitute assignment violates substitute rules (no/invalid replaces target, or is_substitute driver assigned PRIMARY)" }
  - { id: ERR_RIDERS_STILL_ONBOARD,  http: 409, condition: "complete attempted while onboard_count > 0" }
  - { id: ERR_NOT_ASSIGNED_RIDER,    http: 409, condition: "Tap student has no APPROVED RidershipApplication on this trip's Route" }
  - { id: ERR_TAP_SEQUENCE,          http: 409, condition: "TAP_OFF with no prior unmatched TAP_ON, or TAP_ON while already onboard" }
  - { id: ERR_NOT_ELIGIBLE,          http: 409, condition: "Approve attempted with eligibility_basis == NONE" }
  - { id: ERR_ROUTE_NOT_OPEN,        http: 409, condition: "Approve attempted while requested Route.posture != OPEN" }
  - { id: ERR_ROUTE_FULL,            http: 409, condition: "Approve attempted but assigned_rider_count == seat_capacity" }
  - { id: ERR_WHEELCHAIR_FULL,       http: 409, condition: "Approve of special_needs student but assigned_wheelchair_count == wheelchair_capacity" }
  - { id: ERR_MISSED_BUS_WINDOW,     http: 409, condition: "Missed-bus report filed outside grace window, before stop departure, or with an existing TAP_ON" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TransportAdmin
    description: "District transportation operations: configures districts/routes/stops, reviews and decides ridership applications, manages drivers and assignments, schedules and cancels trips, clears incidents, runs the missed-bus protocol."
    identity: "opaque"
    exclusive_operations:
      - "POST /districts — create district"
      - "POST /districts/{id}/advance-service-day"
      - "POST /routes — create route"
      - "POST /routes/{id}/posture — change posture"
      - "POST /stops — add stop"
      - "POST /routes/{id}/driver-assignments — assign driver"
      - "POST /drivers — create driver"
      - "POST /bus-trips — schedule trip"
      - "POST /bus-trips/{id}/clear-incident"
      - "POST /bus-trips/{id}/cancel"
      - "POST /ridership-applications/{id}/start-review|request-changes|approve|deny"
      - "POST /missed-bus-reports/{id}/acknowledge|resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /students (with Parent)"
      - "POST /ridership-applications (with Parent)"
      - "POST /missed-bus-reports (with Parent)"
      - "All GET reads"

  - name: Parent
    description: "Guardian who owns Student records, submits/resubmits/withdraws ridership applications for their own students, reads notifications, and may file missed-bus reports for their own students. X-User-ID equals a Parent.id (the opaque guardian id stored as Student.parent_id)."
    identity: "entity_backed:Parent"
    exclusive_operations:
      - "POST /ridership-applications/{id}/resubmit — own student only"
      - "POST /ridership-applications/{id}/withdraw — own student only"
    shared_operations:
      - "POST /students (with TransportAdmin) — owns the created student"
      - "POST /ridership-applications — own student"
      - "POST /missed-bus-reports — own student"
      - "GET reads scoped to own students / notifications"

  - name: Driver
    description: "Bus driver who runs their own scheduled trips: GPS pings, boarding, stop departures, RFID taps, incident raises, and completion. X-User-ID equals a Driver.id."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /bus-trips/{id}/gps — own trip"
      - "POST /bus-trips/{id}/start-boarding — own trip"
      - "POST /bus-trips/{id}/depart-stop — own trip"
      - "POST /bus-trips/{id}/raise-incident — own trip"
      - "POST /bus-trips/{id}/complete — own trip"
      - "POST /bus-trips/{id}/taps — own trip"
    shared_operations:
      - "GET route/stop/trip/driver/assignment reads"

# Note on Parent identity: Parent is entity_backed but has no standalone Parent
# CRUD endpoint — a Parent's id is an opaque guardian id minted outside this API,
# supplied as Student.parent_id at student creation and as X-User-ID on Parent
# calls. Ownership checks compare X-User-ID to Student.parent_id (transitively to
# the application's student's parent_id). The FK `Parent.id` therefore has no
# reverse-reachability GET of its own; children of Parent (Student,
# ParentNotification) are discoverable via their `parent_id?` filtered lists.
