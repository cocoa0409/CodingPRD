        distinguishing_aspect: "Waiver is legal only for non-critical items: the unit-required ACLS item (critical) rejects waive with ERR_ITEM_NOT_WAIVABLE while the ATTESTATION item waives cleanly."
        test_recipe:
          setup: ["Clock 2026-08-01; unit ICU requires ACLS; travel nurse with a DRAFT packet (items materialized, all MISSING)."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
