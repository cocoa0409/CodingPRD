            - call: "POST /fmc/carriers"
              payload: { org_name: "Cover Beta Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /fmc/carrier-agreements"
              payload: { agreement_number: "AG-2026-09", agreement_type: "SPACE_CHARTER", member_carrier_ids: ["${ca_id}", "${cb_id}"] }
