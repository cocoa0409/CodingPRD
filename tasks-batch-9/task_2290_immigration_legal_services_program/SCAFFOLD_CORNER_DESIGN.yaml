              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-14T09:00:00.000Z", ends_at_utc: "2026-09-14T10:00:00.000Z", location_code: "USCIS-ELP-ASC", assigned_representative_id: "${atty_a_id}" }
              as: ProgramDirector
              captures: { e1: "$.data.id" }
          trigger:
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-14T10:00:00.000Z", ends_at_utc: "2026-09-14T11:00:00.000Z", location_code: "USCIS-ELP-ASC", assigned_representative_id: "${atty_b_id}" }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter2_id}", event_type: "FILING_DEADLINE", starts_at_utc: "2026-09-14T09:30:00.000Z", ends_at_utc: "2026-09-14T09:30:00.000Z", location_code: "MAIL", assigned_representative_id: "${atty_b_id}" }
              as: ProgramDirector
              captures: { e2: "$.data.id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-14T10:00:00.001Z", ends_at_utc: "2026-09-14T11:00:00.000Z", location_code: "USCIS-ELP-ASC", assigned_representative_id: "${atty_b_id}" }
              as: ProgramDirector
              captures: { e3: "$.data.id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-14T09:30:00.000Z", ends_at_utc: "2026-09-14T09:45:00.000Z", location_code: "USCIS-ELP-ASC", assigned_representative_id: "${atty_a_id}" }
              as: ProgramDirector
          assert:
            - "trigger 1: HTTP status == 409, error_id == 'ERR_CLIENT_CALENDAR_CONFLICT' and NOT 'ERR_REPRESENTATIVE_CALENDAR_CONFLICT' — Ben Cole owns no other events, so geometry A is silent and only the fully closed client comparison at 10:00:00.000Z fires"
            - "trigger 2: HTTP status == 201 — a FILING_DEADLINE candidate is dropped from geometry B on the candidate side even though it sits squarely inside the M1 biometrics window; CalendarEvent.${e2}.travel_buffer_minutes == 0"
            - "trigger 3: HTTP status == 201 — one millisecond past the closed endpoint clears geometry B; against ${e2} the FILING_DEADLINE exemption removes the X side too"
            - "trigger 4: HTTP status == 409, error_id == 'ERR_REPRESENTATIVE_CALENDAR_CONFLICT' — this candidate violates BOTH geometry A (Ada Ortiz, 30-minute buffer from the existing BIOMETRICS) and geometry B (client overlap), and the normative order representative -> client -> facility requires the representative id"
            - "GET /calendar-events?client_id=${client_id} returns 3 rows spanning both matters"

      - name: facility_visit_lead_time_credential_and_per_date_slot_aggregate
        claim_type: aggregate_validation
        grounds:
          - calculations.calendar_conflict_scan
          - endpoints[POST /calendar-events]
          - validations[priority 31 ERR_FACILITY_LEAD_TIME_NOT_MET]
          - errors[ERR_FACILITY_CREDENTIAL_EXPIRED]
          - errors[ERR_FACILITY_VISIT_SLOTS_EXHAUSTED]
        distinguishing_aspect: "Geometry C is not an interval comparison at all but a per-UTC-calendar-date count against max_daily_visit_slots, so a second visit 11 hours after the first is rejected while a visit 24 hours later on the next date is accepted even though the two are equally far apart in the second case. The same instance pins the lead-time boundary to the millisecond (exactly visit_lead_time_hours after the clock is accepted, one millisecond earlier is not) and the credential comparison at UTC-date granularity (a credential expiring ON the event date is still valid). NOTE: §1.4 priority 31 folds the credential check under ERR_FACILITY_LEAD_TIME_NOT_MET while §1.5 and §1.6 give it the dedicated id ERR_FACILITY_CREDENTIAL_EXPIRED; the specific id is asserted here."
