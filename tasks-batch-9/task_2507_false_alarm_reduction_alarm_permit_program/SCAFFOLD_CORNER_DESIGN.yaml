  # ===========================================================================
  # 5. ENDPOINTS — the guide's Table 5 patterns (Standard CRUD, Action endpoint,
  #    Bulk action, Cross-reference link, Computed read, Conditional action) swept
  #    across the §1.5 surface, with an instance for every endpoint that no
  #    earlier section already exercises as its trigger. Batch 1: the read and
  #    list halves of Standard CRUD, where filtering and projection live.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: fee_schedule_read_returns_every_governing_constant
        claim_type: Standard CRUD (Read)
        grounds:
          - endpoints.GET_/false-alarm-program/fee-schedules/{scheduleId}
          - entities.FeeSchedule
        distinguishing_aspect: "The read is the widest-open endpoint in the program — all eight roles may call it — and it must return the nested constant structures (fee_tiers, occupancy_multipliers, late_renewal_tiers, exempt_cause_codes) verbatim rather than a flattened summary, because every fee assertion downstream is computed from them."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; FS-2026-A created and activated."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
          trigger:
            - call: "GET /false-alarm-program/fee-schedules/${sched_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { fs_read_v: $.data.version, fs_read_status: $.data.status, fs_read_code: $.data.schedule_code }
          assert:
            - "the response status is 200 and response_type is object"
            - "FeeSchedule.${sched_id}.schedule_code == \"FS-2026-A\" with status ACTIVE and activated_at 2026-08-01T00:00:00Z"
            - "fee_tiers has 5 rows in from_index order and the terminal row is { from_index: 6, to_index: null, base_fee_cents: 75000 }"
            - "occupancy_multipliers.COMMERCIAL == 1.50, late_renewal_tiers has 3 rows and exempt_cause_codes has 6 members including NEW_INSTALLATION_GRACE"
            - "admin_fee_pct 0.05 with admin_fee_min_cents 500 and admin_fee_max_cents 5000 all round-trip unchanged"

      - name: fee_schedules_list_filtered_to_active_excludes_the_superseded_row
        claim_type: Standard CRUD (List)
        grounds:
          - endpoints.GET_/false-alarm-program/fee-schedules
          - state_machines.FeeSchedule.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: "Activating a second schedule supersedes the first, so the status filter is the only way to find the one row that actually prices anything: status=ACTIVE returns total_count 1 (FS-2026-DEL) while the unfiltered list still returns 2, which proves the filter narrows rather than the collection shrinking."
