              as: FirmAdmin
            - call: "POST /bpp/assets"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_l}", asset_tag: "L1", category: "MACHINERY", acquisition_cost_cents: 800000, acquisition_date: "2026-01-05", in_service_date: "2026-01-10" }
              as: TaxAnalyst
