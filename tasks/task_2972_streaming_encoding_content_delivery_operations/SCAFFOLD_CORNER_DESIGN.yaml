              payload: { region_code: "US", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", license_tier: "PREMIUM" }
              as: ContentOps
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "HOLDCDN", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /live-reservations"
              payload: { title_id: "${t_id}", primary_vendor_id: "${v_id}", window_start_at: "2026-09-10T18:00:00Z", window_end_at: "2026-09-10T22:00:00Z", reserved_gbps: 40.00 }
