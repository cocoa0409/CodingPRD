            - call: "POST /tower-colo/towers"
              payload: { site_name: "T1 Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 10000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 20000, baseline_reserved_load_units: 2000, baseline_reserved_ground_sqft: 0 }
