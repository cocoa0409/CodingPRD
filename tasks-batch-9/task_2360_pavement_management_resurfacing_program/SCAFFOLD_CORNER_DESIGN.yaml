      - name: utility_coordination_conflict_loop_returns_to_clearance_requested
        claim_type: cyclic_shape
        grounds: ["state_machines.UtilityCoordination.CONFLICT_DECLARED_to_WORK_SCHEDULED", "state_machines.UtilityCoordination.WORK_SCHEDULED_to_WORK_COMPLETE", "state_machines.UtilityCoordination.WORK_COMPLETE_to_CLEARANCE_REQUESTED"]
        distinguishing_aspect: "The four-hop conflict cycle and the CLEARED_AFTER_WORK terminal it must reach (rather than plain CLEARED), together with round_count incrementing on the RE_REQUEST hop, are already driven end-to-end by the §1.8 non-linear-state-machine instance."
        excluded_because:
          difficulty_instance: "utility_coordination_cycle_ends_in_cleared_after_work_not_cleared"
          rationale: "That §1.8 instance walks CLEARANCE_REQUESTED -> CONFLICT_DECLARED -> WORK_SCHEDULED -> WORK_COMPLETE -> CLEARANCE_REQUESTED -> CLEARED_AFTER_WORK on one roster row, asserts round_count 2 and pins the CLEARED_AFTER_WORK terminal plus the 3% utility_share_cents it unlocks on the project estimate. Every transition, precondition and side effect this corner claim would cover is asserted there with literal values, so a separate corner test would be a strict subset."

      - name: service_request_closed_as_duplicate_straight_from_new
        claim_type: valid_transition
        grounds: ["state_machines.ServiceRequest.NEW_to_CLOSED_DUPLICATE", "entities.NetworkSegment.fields.open_service_request_count", "calculations.service_request_sla"]
        distinguishing_aspect: "CLOSED_DUPLICATE is the one terminal reachable directly from NEW: the request skips triage entirely, closed_at is stamped, the segment's open_service_request_count falls 1 -> 0, and sla_breached is evaluated against closed_at (not the clock) so it reads false even though the clock is later moved past the 72-hour HIGH deadline."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St exists; a resident filed a HIGH-severity POTHOLE request at 2026-08-01T00:00:00Z, so sla_due_at is 2026-08-04T00:00:00Z and the segment's open_service_request_count is 1."
            - "The request was never triaged — request_status is NEW."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/service-requests"
              payload: { segment_id: "${seg1}", complaint_type: "POTHOLE", reported_severity: "HIGH", location_note: "deep pothole at 1200 block driveway" }
              as: Resident
              as_user_id: "resident-1"
              captures: { sr1: "$.data.id" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { pre_open: "$.data.open_service_request_count" }
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/service-requests/${sr1}/close"
              payload: { closure_code: "DUPLICATE" }
              as: PavementEngineer
              captures: { cl_st: "$.data.request_status", cl_at: "$.data.closed_at", cl_code: "$.data.closure_code", cl_breach: "$.data.sla_breached", cl_due: "$.data.sla_due_at" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { post_open: "$.data.open_service_request_count" }
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PavementEngineer
            - call: "GET /pavement/service-requests/${sr1}"
              payload: {}
              as: PavementEngineer
              captures: { late_breach: "$.data.sla_breached" }
          assert:
            - "HTTP 200."
            - "data.request_status == 'CLOSED_DUPLICATE' — NEW reaches this terminal without passing through TRIAGED_PATCH or DEFERRED_TO_CAPITAL."
            - "data.closure_code == 'DUPLICATE' and data.closed_at == '2026-08-02T00:00:00Z'."
            - "data.sla_due_at == '2026-08-04T00:00:00Z' (created_at + 72 h for HIGH) and data.sla_breached == false."
            - "${pre_open} == 1 and ${post_open} == 0."
            - "After the clock moves to 2026-08-10 (six days past the deadline) ${late_breach} is still false — a closed request freezes its reference instant at closed_at."
            - "data.triaged_at == null and data.capital_project_id == null."

      - name: service_request_closed_as_patched_from_new_rejected
        claim_type: invalid_transitions
        grounds: ["validations.ERR_SERVICE_REQUEST_NOT_TRIAGED", "errors.ERR_SERVICE_REQUEST_NOT_TRIAGED", "state_machines.ServiceRequest.TRIAGED_PATCH_to_CLOSED_PATCHED"]
        distinguishing_aspect: "close is legal from NEW (the priority-50 status rule admits NEW) yet the PATCHED code specifically is not: CLOSED_PATCHED is reachable only from TRIAGED_PATCH, so closing a NEW request with closure_code PATCHED is 409 ERR_SERVICE_REQUEST_NOT_TRIAGED while the very same request accepts closure_code DUPLICATE."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St exists and one HIGH-severity POTHOLE request sits in request_status NEW."
            - "No triage call has been made, so no crew was ever dispatched."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/service-requests"
              payload: { segment_id: "${seg1}", complaint_type: "POTHOLE", reported_severity: "HIGH", location_note: "deep pothole at 1200 block driveway" }
              as: Resident
              as_user_id: "resident-1"
              captures: { sr1: "$.data.id" }
          trigger:
            - call: "POST /pavement/service-requests/${sr1}/close"
              payload: { closure_code: "PATCHED" }
              as: PavementEngineer
              captures: { e_id: "$.data.error_id" }
            - call: "GET /pavement/service-requests/${sr1}"
              payload: {}
              as: PavementEngineer
              captures: { st: "$.data.request_status", cl_at: "$.data.closed_at" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { open_after: "$.data.open_service_request_count" }
          assert:
            - "HTTP 409."
            - "data.error_id == 'ERR_SERVICE_REQUEST_NOT_TRIAGED'."
            - "request_status is still 'NEW', closed_at is null and closure_code is null."
            - "open_service_request_count is still 1 — the failed close did not decrement the segment counter."


  # calculations — correct result, constants, precision, thresholds, aggregation
  - section: calculations
    instances:
      - name: segment_area_sy_rounds_half_up_at_the_third_decimal
        claim_type: precision
        grounds: ["calculations.segment_area_sy", "entities.NetworkSegment.fields.area_sy"]
        distinguishing_aspect: "Two segments one foot apart in length straddle the rounding rule in opposite directions: 1000.00 x 30.00 / 9 = 3333.3333... truncates DOWN to 3333.33 while 1001.00 x 30.00 / 9 = 3336.6666... rounds UP to 3336.67 — and the 0.01 SY difference is not cosmetic, it propagates into a 3,336.67-vs-3,333.33 CRACK_SEAL cost gap later in the chain."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St is 1000.00 ft x 30.00 ft (30000 sqft / 9 = 3333.3333... SY)."
            - "Elm St is 1001.00 ft x 30.00 ft (30030 sqft / 9 = 3336.6666... SY)."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Elm St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z3", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1001.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg4: "$.data.id" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { a1: "$.data.area_sy" }
            - call: "GET /pavement/segments/${seg4}"
              payload: {}
              as: PavementEngineer
              captures: { a4: "$.data.area_sy" }
          assert:
            - "Maple St: data.area_sy == 3333.33 (the trailing 33... is dropped, not carried)."
            - "Elm St: data.area_sy == 3336.67 (the trailing 66... rounds half-up to 67)."
            - "Neither value is 3333.3333 or 3336.6667 — area_sy is quantised to exactly 2 decimals at write time."
            - "Both segments report condition_index == 76.0, confirming the two rows differ ONLY in area."

      - name: measured_index_coverage_factor_doubles_the_deduct_at_fifty_percent_coverage
        claim_type: constants_applied
        grounds: ["calculations.survey_measured_condition_index", "entities.DistressObservation.fields.sample_coverage_pct", "calculations.treatment_selection"]
        distinguishing_aspect: "The coverage factor is a DIVISION by coverage, not a multiplication: identical raw distress measured over 50% of the segment yields coverage_factor 2.0000, deduct 61.80 instead of 30.90 and PCI 38.2 instead of 69.1 — which also flips the treatment two tiers, from MILL_AND_OVERLAY to RECONSTRUCTION, off the same physical readings."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Two identical LOCAL segments 1000.00 x 30.00 (area 3333.33): Maple St first, Cedar St second."
            - "Both observations report alligator 3000 sqft, longitudinal 500 lf, rutting 0.55 in, patching 1500 sqft, IRI 155 — raw deduct 30.9000 in both cases."
            - "Maple St's pass covered 100.0% of the segment; Cedar St's covered 50.0%."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Cedar St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1b: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id", full_ded: "$.data.deduct_total", full_pci: "$.data.measured_condition_index" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1b}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 50.0 }
              as: PavementEngineer
              captures: { obs_cov: "$.data.id", half_ded: "$.data.deduct_total", half_pci: "$.data.measured_condition_index" }
            - call: "POST /pavement/distress-observations/${obs_cov}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { net_idx: "$.data.network_condition_index" }
            - call: "POST /pavement/condition-surveys/${sv}/generate-candidates"
              payload: {}
              as: PavementEngineer
              captures: { cand_low: "$.data[0].id" }
            - call: "GET /pavement/treatment-candidates/${cand_low}"
              payload: {}
              as: PavementEngineer
              captures: { cl_tt: "$.data.treatment_type", cl_sel: "$.data.selection_condition_index" }
          assert:
            - "${full_ded} == 30.90 and ${full_pci} == 69.1 at 100% coverage."
            - "${half_ded} == 61.80 (30.9000 * round_half_up(100/50.0, 4) = 30.9000 * 2.0000) and ${half_pci} == 38.2 at 50% coverage."
            - "The two segments have identical area and identical raw distress, so the 31.90-point PCI gap is attributable to coverage alone."
            - "Candidate generation orders by condition_index ASC, so data[0] is Cedar St: treatment_type == 'RECONSTRUCTION' with selection_condition_index == 38.2 (38.2 < OVERLAY_FLOOR 40.0)."
            - "Maple St's candidate is 'MILL_AND_OVERLAY' at selection_condition_index 69.1."
            - "${net_idx} == 53.7 (equal areas: round_half_up((69.1 + 38.2)/2, 1) = round_half_up(53.65, 1))."

      - name: measured_index_clamps_at_zero_when_the_deduct_exceeds_one_hundred
        claim_type: correct_result
        grounds: ["calculations.survey_measured_condition_index", "calculations.treatment_selection", "calculations.candidate_estimated_cost_cents"]
        distinguishing_aspect: "The clamp is real and it is not saturating arithmetic on the deduct: deduct_total is published at its true 201.40 while measured_condition_index floors at 0.0 — and that 0.0 is a live number downstream, driving band FAILED, the 1.12 condition penalty and a RECONSTRUCTION cost of 38,444,629 cents, 3,3x the same segment's 69.1 MILL estimate."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St is LOCAL, 1000.00 x 30.00 (30000 sqft, 3333.33 SY)."
            - "Its observation reports total failure at 100% coverage: alligator 30000 sqft (100.00%), longitudinal 1000 lf (100.00%), rutting 3.00 in, patching 30000 sqft (100.00%), IRI 300 (205 over the threshold) -> raw deduct 0.45*100 + 0.18*100 + 40*2.75 + 0.12*100 + 0.08*205 = 201.4000."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
          trigger:
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 30000.0, longitudinal_cracking_lf: 1000.0, rutting_depth_in: 3.0, patching_sqft: 30000.0, iri_in_per_mi: 300.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs_z: "$.data.id", z_ded: "$.data.deduct_total", z_pci: "$.data.measured_condition_index" }
            - call: "POST /pavement/distress-observations/${obs_z}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { net_idx: "$.data.network_condition_index" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { z_band: "$.data.condition_band", z_seg_pci: "$.data.condition_index" }
            - call: "POST /pavement/condition-surveys/${sv}/generate-candidates"
              payload: {}
              as: PavementEngineer
              captures: { cz: "$.data[0].id" }
            - call: "GET /pavement/treatment-candidates/${cz}"
              payload: {}
              as: PavementEngineer
              captures: { cz_tt: "$.data.treatment_type", cz_cost: "$.data.estimated_cost_cents", cz_gain: "$.data.treatment_pci_gain", cz_bcr: "$.data.benefit_cost_ratio" }
          assert:
            - "data.deduct_total == 201.40 — the deduct itself is NOT clamped."
            - "data.measured_condition_index == 0.0 (clamp(100.0 - 201.40, 0.0, 100.0)), not -101.4."
            - "After the seal the segment reports condition_index == 0.0 and condition_band == 'FAILED'."
            - "${net_idx} == 0.0 for the single-segment network."
            - "Candidate: treatment_type == 'RECONSTRUCTION', treatment_pci_gain == 100.0 (min(100.0 cap, 100.0 - 0.0))."
            - "estimated_cost_cents == 38444629 (round_half_up(3333.33 * 9500 * 1.06 * 1.12) = 37594629, + 850000 mobilization) — the 1.12 FAILED penalty is applied."
            - "benefit_cost_ratio == 26011.4098 (round_half_up(100.0 * 30 * 3333.33, 2) = 9999990.00, / 384.44629 thousand)."

      - name: model_projected_index_applies_the_knee_coefficient_only_past_eight_years
        claim_type: decay_function
        grounds: ["calculations.model_projected_condition_index", "entities.NetworkSegment.fields.decay_knee_coefficient"]
        distinguishing_aspect: "The knee is piecewise, not a rescaling of the whole curve: at age 5 the LOCAL segment has lost exactly 1.4*5 = 7.0 points (85.0) while at age 10 it has lost 1.4*10 + 1.0*2 = 16.0 (76.0) — the second segment's extra 9.0 points of loss over 5 extra years proves B applies to the 2 years past the knee and to nothing before it."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Three identical LOCAL segments 1000.00 x 30.00 with baseline_condition_index 92.0, differing only in last_treatment_date."
            - "Maple St: 2021-08-01 -> 1826 days -> age_years 5 (below the 8-year knee)."
            - "Cedar St: 2018-08-01 -> 2922 days -> age_years 8 (exactly AT the knee, so max(0, 8-8) = 0 knee years)."
            - "Oak St: 2016-08-01 -> 3652 days -> age_years 10 (2 knee years)."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2021-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg_a: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Cedar St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2018-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg_b: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Oak St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg_c: "$.data.id" }
            - call: "GET /pavement/segments/${seg_a}"
              payload: {}
              as: PavementEngineer
              captures: { pci_a: "$.data.condition_index", band_a: "$.data.condition_band" }
            - call: "GET /pavement/segments/${seg_b}"
              payload: {}
              as: PavementEngineer
              captures: { pci_b: "$.data.condition_index" }
            - call: "GET /pavement/segments/${seg_c}"
              payload: {}
              as: PavementEngineer
              captures: { pci_c: "$.data.condition_index" }
          assert:
            - "${pci_a} == 85.0 (92.0 - 1.4*5 - 1.0*max(0, 5-8) = 92.0 - 7.0)."
            - "${pci_b} == 80.8 (92.0 - 1.4*8 - 1.0*0) — exactly at the knee the knee term is still zero."
            - "${pci_c} == 76.0 (92.0 - 1.4*10 - 1.0*2)."
            - "The three losses are 7.0, 11.2 and 16.0: the 5->8 span costs 4.2 (3 * 1.4) while the 8->10 span costs 4.8 (2 * 2.4), so the per-year rate really does change at 8."
            - "All three report decay_coefficient == 1.4 and decay_knee_coefficient == 1.0 and condition_index_source == 'MODEL_PROJECTED'."

