              as: TrustAuditor
              as_user_id: "auditor-31"
          assert:
            - "the LicensingAnalyst - who scheduled this very audit - is refused with 403 ${e1} == ERR_FORBIDDEN_ROLE, because POST /commission/trust-audits/{id}/fieldwork lists TrustAuditor only"
            - "the unrelated TrustAuditor is refused with 403 ${e2} == ERR_AUDITOR_MISMATCH: the role is right, the identity is not"
            - "the assigned auditor's identical empty body returns 200 with status == FIELDWORK and computed_shortage_cents == 200000"
            - "the unrelated auditor's ISSUE_FINDINGS returns 403 ${e3} == ERR_AUDITOR_MISMATCH and the audit is still FIELDWORK - priority 7 outranks the from-state check at priority 9 and no side effect fires"
