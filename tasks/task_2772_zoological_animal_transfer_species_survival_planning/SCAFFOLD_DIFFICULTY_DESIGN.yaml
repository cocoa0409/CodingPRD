  - rule_id: boundary_precision_check
    instances:
      - name: molecular_inbreeding_exact_limit_blocks_endorsement
        grounds:
          - calculations.kinship_and_pairing_verdict
          - validations[priority=78, error_id=ERR_INBREEDING_LIMIT_EXCEEDED]
          - entities.PopulationRecommendation.fields.projected_offspring_inbreeding
          - entities.PopulationRecommendation.fields.pairing_verdict
          - errors[ERR_INBREEDING_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          The verdict band is an INCLUSIVE lower bound at MAX_OFFSPRING_INBREEDING 0.125, and it is
          evaluated on the 4-decimal rounded value. molecular_similarity_pct 31.25 lands exactly on
          0.1250 and must read NOT_RECOMMENDED, while 31.2 yields 0.1248 and must read CONDITIONAL.
          An implementation using a strict > comparison, or comparing the unrounded intermediate,
          endorses a pairing that the program forbids.
        test_recipe:
          setup:
            - "Clock left at its 2026-08-01T00:00:00Z default."
            - "A published SSP_RED plan with four unrelated animals: M1 and M2 at Cedar Ridge Zoo, F1 and F2 at Harbor Bay Zoo, all with null sire_id and dam_id so f_pedigree is 0.0000 for both pairs."
            - "Two PEDIGREE_PLUS_MOLECULAR BREED_WITH recommendations are created: REC_A on M2 x F2 with molecular_similarity_pct 31.25, REC_B on M1 x F1 with 31.2."
