  - rule_id: resource_temporal_overlap
    instances:
      - name: session_window_overlap_same_center_same_date_half_open
        grounds:
          - validations[priority=10]
          - endpoints[POST /test-sessions]
          - entities.TestSession.fields.window_start_utc
          - entities.TestSession.fields.window_end_utc
        distinguishing_aspect: |
          Two sessions at the same center on the same date with overlapping
          half-open [start,end) windows collide (ERR_SESSION_WINDOW_OVERLAP); a
          back-to-back session starting exactly at the prior window_end is allowed
          (adjacency permitted under half-open semantics). Resource = TestCenter slot.
        test_recipe:
          setup:
            - "One existing session 13:00-17:00Z at a center on 2026-09-01."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "ACT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T16:00:00.000Z", window_end_utc: "2026-09-01T20:00:00.000Z", base_fee_cents: 7000 }
              as: TestCenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_SESSION_WINDOW_OVERLAP  (16:00 < 17:00 overlaps [13:00,17:00))"

      - name: candidate_accommodated_schedule_rest_buffer_conflict
        grounds:
          - validations[priority=11]
          - endpoints[POST /accommodation-requests/{id}/approve]
          - calculations.allotted_minutes
        distinguishing_aspect: |
          A candidate's two accommodated sittings on the same day must be separated
          by >= REST_BUFFER_HOURS; approving the second accommodation whose window
          is within the buffer of the first is rejected (ERR_CANDIDATE_SCHEDULE_CONFLICT).
