  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: exam_waiver_threshold_at_exactly_min_score_vs_one_hundredth_below
        grounds:
          - calculations.substantial_equivalency_score
          - entities.Profession.fields.exam_waiver_min_score
          - entities.CredentialEvaluation.fields.exam_waiver_granted
          - validations.priority_34_ERR_NATIONAL_EXAM_REQUIRED
        distinguishing_aspect: |
          Two credentials differing by a single documented practice hour (800 vs 799 of a required 2000)
          score 70.00 and 69.99 against exam_waiver_min_score 70.00. The `>=` comparison must grant the
          waiver at exactly the threshold and withhold it 0.01 below, and the difference is visible in
          cents: the 70.00 arm receives an EXAM_FEE_REVERSAL of -6000 while the 69.99 arm keeps its full
          32000 balance.
        test_recipe:
          setup:
            - "Profession RD with required_scope_elements [ASSESS, TREAT, PRESCRIBE, SUPERVISE], critical_scope_elements empty, required_practice_hours 2000, exam_waiver_min_score 70.00, jurisprudence_exam_required false and jurisprudence_fee_cents 0."
            - "Applicant X holds a verified ACTIVE credential granting [ASSESS, TREAT, SUPERVISE] with practice_hours 800."
            - "Applicant Y holds an otherwise identical credential with practice_hours 799."
            - "Both are non-military TX residents on the ENDORSEMENT pathway, so statutory_waiver_pct is 0.00 and each gross is 32000."
            - "Because critical_scope_elements is empty the scope review can be EQUIVALENT despite the missing PRESCRIBE element, so no critical-miss penalty applies to either arm."
            - "Both evaluations are EQUIVALENT/CLEAR and unfinalized; one ACTIVE RD evaluator with max_concurrent_reviews 2 holds both assignments in non-conflicting windows."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RD", title: "Registered Dietitian", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: [], required_practice_hours: 2000, requirement_hours_total: 100.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: false, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 20000, endorsement_fee_cents: 6000, exam_fee_cents: 6000, jurisprudence_fee_cents: 0, permit_fee_cents: 5000, expedite_surcharge_pct: 0.10 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof_rd: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Omar Vidal", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_x: $.data.id }
            - call: "POST /licensure/applicants/${ap_x}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-99001", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 800, status: "ACTIVE", verified_good_standing: true, issued_at: "2022-02-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap_x}"
              captures: { cred_x: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap_x}", profession_id: "${prof_rd}", primary_credential_id: "${cred_x}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap_x}"
              captures: { app_x: $.data.id }
            - call: "POST /licensure/applications/${app_x}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap_x}"
            - call: "POST /licensure/applicants"
              payload: { full_name: "Pia Groen", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_y: $.data.id }
            - call: "POST /licensure/applicants/${ap_y}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-99002", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 799, status: "ACTIVE", verified_good_standing: true, issued_at: "2022-02-01T00:00:00Z" }
              as: Applicant
