          rationale: "The divergence between the ROLLING_30D and CALENDAR_MONTH windows across a month boundary (1821078 versus 910539 on identical data) is the whole point of that §1.8 dual_variant_calc instance."

      - name: corridor_target_constraint_propagation
        claim_type: constraint_propagation
        grounds:
          - calculations.corridor_inventory_target
          - calculations.corridor_inventory_target.constants
        excluded_because:
          difficulty_instance: corridor_inventory_target_nested_min_max_across_currency_classes
          rationale: "The nested min/max propagation of baseline, season_days, demand index, currency class cap and vault share - and the final round-to-largest-denomination step - is exactly what that §1.8 combinatorial_formula instance walks for a MAJOR and a RESTRICTED line in one plan."

      - name: repatriation_manifest_waterfall_allocation
        claim_type: waterfall_allocation
        grounds:
          - calculations.repatriation_surplus_manifest
