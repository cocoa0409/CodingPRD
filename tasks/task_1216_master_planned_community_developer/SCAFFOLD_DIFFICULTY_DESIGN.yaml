# =============================================================================
# Task 1216 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances. Every chain replays from empty-DB against SCAFFOLD.yaml
# §1.5. Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: district_interest_provisional_vs_certified
        grounds:
          - calculations.district_interest_provisional
          - calculations.reimbursement_waterfall
          - entities.ReimbursementDistrict.fields.provisional_interest_cents
          - entities.ReimbursementPayment.fields.certified_interest_cents
        distinguishing_aspect: |
          District-finance domain (not assessment): for identical advances and the same logical
          clock, the provisional simple-interest accrual (round per advance then sum) yields
          132055 cents while the certified daily-compound accrual yields 133000 cents — two
          valid algorithms, different results, pinned as separate fields.
        test_recipe:
          setup:
            - "Active community C; reimbursement district at 5.0% with advances 6,000,000c on 2026-01-01 and 4,000,000c on 2026-03-01"
            - "Logical clock at its default 2026-05-01T00:00:00Z (120 and 61 days outstanding)"
            - "A REQUESTED payment of 500,000c exists"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Solstice Ranch", total_planned_units: 100 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/districts"
              payload: { community_id: "${c_id}", district_name: "MUD 7", interest_rate_annual_pct: 5.0 }
              as: DeclarantController
              captures: { d_id: $.data.id }
            - call: "POST /mpc/advances"
              payload: { district_id: "${d_id}", amount_cents: 6000000, advance_date: "2026-01-01T00:00:00Z", description: "roads" }
              as: DeclarantController
              captures: { adv1_id: $.data.id }
            - call: "POST /mpc/advances"
              payload: { district_id: "${d_id}", amount_cents: 4000000, advance_date: "2026-03-01T00:00:00Z", description: "sewer" }
              as: DeclarantController
              captures: { adv2_id: $.data.id }
            - call: "GET /mpc/districts/${d_id}"
              as: DeclarantController
              captures: { prov_interest: $.data.provisional_interest_cents }
            - call: "POST /mpc/payments"
              payload: { district_id: "${d_id}", amount_cents: 500000 }
              as: DeclarantController
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /mpc/payments/${pay_id}/certify"
              payload: {}
              as: AssociationDirector
              captures: { cert_interest: $.data.certified_interest_cents, cert_principal: $.data.certified_principal_cents }
          assert:
            - "provisional (simple) district total ${prov_interest} == 132055"
            - "certified (daily-compound) interest ${cert_interest} == 133000"
            - "${cert_interest} != ${prov_interest} (variant divergence is 945 cents on identical data)"
            - "certified principal ${cert_principal} == 367000 (500000 - 133000, interest-first)"

      - name: assessment_uniform_vs_declarant_subsidy
        grounds:
          - calculations.assessment_levy_setting
          - entities.AssessmentRate.fields.per_unit_annual_cents
          - entities.AssessmentRate.fields.declarant_subsidy_cents
        distinguishing_aspect: |
          Assessment domain (not district finance): two communities with byte-identical FY2028
          budgets (gap 24,000,000c, 100 planned units, FY2027 EFFECTIVE prior rate 200,000c)
          produce per_unit_annual_cents 240000 under the uniform variant vs 200000 plus
          declarant_subsidy_cents 4000000 under the subsidy variant.
        test_recipe:
          setup:
            - "Communities A and B, each ACTIVE with 100 planned units, stage DECLARANT_CONTROL"
            - "Both FY2027 budgets (gap 20,000,000c) adopted at clock 2026-05-17; both FY2027 rates (uniform, 200,000c) armed at 2026-11-02 after notices SENT 2026-11-01; both EFFECTIVE after the 2027-01-01 sweep"
            - "Both FY2028 budgets (gap 24,000,000c) adopted at clock 2027-01-20"
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Uniform Hills", total_planned_units: 100 }
              as: DeclarantExecutive
              captures: { ca_id: $.data.id }
            - call: "POST /mpc/communities"
              payload: { community_name: "Subsidy Springs", total_planned_units: 100 }
              as: DeclarantExecutive
              captures: { cb_id: $.data.id }
            - call: "POST /mpc/communities/${ca_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/communities/${cb_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/budgets"
              payload: { community_id: "${ca_id}", fiscal_year: 2027, non_assessment_income_cents: 2000000 }
              as: DeclarantController
              captures: { bud27a: $.data.id }
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud27a}", category: "LANDSCAPE_MAINTENANCE", amount_cents: 12000000 }
              as: DeclarantController
            - call: "POST /mpc/line-items"
