scaffold_difficulty_design:

  # =====================================================================================
  # RULE 1 — dual_variant_calc
  # The two instances live in different entity domains: session assurance scoring
  # (VerificationSession) and bias disparity measurement (BiasAudit / MethodProfile).
  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: assurance_final_variant_applies_bias_haircut_absent_from_provisional
        grounds:
          - calculations.assurance_score
          - calculations.method_evidence_quality
          - calculations.cohort_disparity_evaluation
          - entities.VerificationSession.fields.assurance_score_provisional
          - entities.VerificationSession.fields.assurance_score_final
          - state_machines.VerificationSession.identity_state.IN_PROGRESS_to_MANUAL_REVIEW
        distinguishing_aspect: |
          The dual variant here is on the session assurance-scoring domain: PROVISIONAL sums raw
          contribution_points over {SCORED, ACCEPTED} attempts and ignores profile bias_state, while
          FINAL halves the contribution of every attempt whose MethodProfile is RESTRICTED, so the
          same two accepted attempts read 58 provisional and 38 final on the same session.
        test_recipe:
          setup:
            - "Client Acme Verify is LIVE, DELETE_ON_COMPLETE retention, quota 50, 2 granted review credits."
            - "Policy v1 allows DOCUMENT_SCAN and DATABASE_CHECK, min_assurance_score 60, doc floor 8000, no age gate; it is PUBLISHED and pinned by the session."
            - "Session subj-r1a is STANDARD tier, value 0, STANDARD_DOCS -> risk_score 30 / LOW."
            - "Attempt A1 on the DOCUMENT_SCAN profile (weight 45) scored 8750 -> 39 points and is ACCEPTED; attempt A2 on the DATABASE_CHECK profile (weight 25) scored 7777 -> 19 points and is ACCEPTED, so assurance_score_provisional == 58."
            - "A bias audit on the DOCUMENT_SCAN profile has already been evaluated and drove that profile to bias_state RESTRICTED; both attempts are already terminal, so no cascade touched them."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Verify", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DATABASE_CHECK", vendor_code: "dbv1", assurance_weight: 25, acceptance_floor_bps: 6000, far_bps: 80, frr_bps: 600, strong_evidence: false, cost_cents: 40 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_db_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN", "DATABASE_CHECK"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r1a", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
            - call: "POST /idv/method-attempts/${a1}/document-captures"
              payload: { document_type: "PASSPORT", required_feature_count: 16, passed_feature_count: 14, tamper_signal_count: 0, mrz_checksum_valid: true }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a1}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_db_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a2: "$.data.id" }
            - call: "POST /idv/method-attempts/${a2}/data-evidence"
              payload: { matched_field_count: 7, total_field_count: 9 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a2}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_doc_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_18_24", attempt_count: 1000, false_reject_count: 50, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_25_44", attempt_count: 1000, false_reject_count: 30, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_65_PLUS", attempt_count: 1000, false_reject_count: 40, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/complete"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
          assert:
            - "MethodProfile.${p_doc_id}.bias_state == RESTRICTED"
            - "MethodAttempt.${a1}.state == ACCEPTED and MethodAttempt.${a1}.contribution_points == 39"
            - "MethodAttempt.${a2}.state == ACCEPTED and MethodAttempt.${a2}.contribution_points == 19"
            - "VerificationSession.${s_id}.assurance_score_provisional == 58"
            - "VerificationSession.${s_id}.assurance_score_final == 38"
            - "VerificationSession.${s_id}.identity_state == MANUAL_REVIEW"
            - "VerificationSession.${s_id}.disposition_reason == null"
            - "GET /idv/verification-sessions/${s_id}/manual-review-cases returns total_count == 1 with data[0].trigger_reason == SCORE_SHORTFALL"

      - name: disparity_disclosure_variant_diverges_from_gating_variant_on_same_cohorts
        grounds:
          - calculations.cohort_disparity_evaluation
          - entities.BiasAudit.fields.disparity_ratio_max_to_min_bps
          - entities.BiasAudit.fields.disparity_ratio_max_to_pooled_bps
          - entities.MethodProfile.fields.bias_state
          - state_machines.MethodProfile.bias_state.CLEARED_to_MONITORED
        distinguishing_aspect: |
          The dual variant here is on the bias-measurement domain, not on session scoring: over the
          identical three cohort rows MAX_TO_MIN (disclosure) yields 12500 bps while MAX_TO_POOLED
          (gating) yields 11338 bps, and because only MAX_TO_POOLED gates the profile the outcome is
          MONITORED rather than the RESTRICTED that the disclosure ratio alone would suggest.
        test_recipe:
          setup:
            - "A BIOMETRIC_COMPARISON profile biov1 exists with bias_state CLEARED."
            - "A bias audit on it is COLLECTING over window 2026-07-01 -> 2026-08-01 with three cohorts: AGE_18_24 500/25, AGE_25_44 1000/40, AGE_65_PLUS 200/10 (all >= MIN_COHORT_SAMPLE 50 attempts, so all three are included)."
            - "Cohort frr values are 500, 400 and 500 bps; pooled frr is 10000 * 75 / 1700 = 441 bps."
          setup_api_calls:
            - call: "POST /idv/method-profiles"
              payload: { method_code: "BIOMETRIC_COMPARISON", vendor_code: "biov1", assurance_weight: 35, acceptance_floor_bps: 7000, far_bps: 20, frr_bps: 500, strong_evidence: true, cost_cents: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_bio_id: "$.data.id" }
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_bio_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_18_24", attempt_count: 500, false_reject_count: 25, false_accept_count: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_25_44", attempt_count: 1000, false_reject_count: 40, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_65_PLUS", attempt_count: 200, false_reject_count: 10, false_accept_count: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /idv/bias-audits/${audit_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "BiasAudit.${audit_id}.max_frr_bps == 500 and BiasAudit.${audit_id}.min_frr_bps == 400"
            - "BiasAudit.${audit_id}.pooled_frr_bps == 441"
            - "BiasAudit.${audit_id}.disparity_ratio_max_to_min_bps == 12500"
            - "BiasAudit.${audit_id}.disparity_ratio_max_to_pooled_bps == 11338"
            - "BiasAudit.${audit_id}.included_cohort_count == 3 and BiasAudit.${audit_id}.excluded_cohort_count == 0 and BiasAudit.${audit_id}.insufficient_sample == false"
            - "BiasAudit.${audit_id}.worst_cohort_code == AGE_18_24"
            - "BiasAudit.${audit_id}.state == EVALUATED"
            - "MethodProfile.${p_bio_id}.bias_state == MONITORED and MethodProfile.${p_bio_id}.restricted_at == null"

  # =====================================================================================
  # RULE 2 — combinatorial_formula
  # Three instances in three different modes: (a) >=3-input non-linear composition,
  # (b) rounding order, (c) pinned evaluation order.
  # =====================================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: liveness_effective_threshold_composes_policy_risk_retry_and_modality
        grounds:
          - calculations.liveness_pad_decision
          - calculations.session_risk_assessment
          - calculations.method_evidence_quality
          - entities.LivenessCheck.fields.effective_threshold_bps
          - entities.LivenessCheck.fields.decision
          - entities.MethodAttempt.fields.retry_index
        distinguishing_aspect: |
          Mode (a): four independent inputs (policy pad_threshold_bps, session risk_level bump,
          attempt retry_index escalation, ACTIVE-modality relief) combine non-linearly through a
          9500 ceiling and a 300 bps inconclusive band, so the same 8000 pad score is INCONCLUSIVE
          at threshold 8050 on retry 0 and the threshold moves to 8250 on retry 1.
        test_recipe:
          setup:
            - "Client Acme Bio is LIVE with RETAIN_90_DAYS retention, quota 50, 1 review credit."
            - "Policy v1 allows BIOMETRIC_COMPARISON and DOCUMENT_SCAN, pad_threshold_bps 7500, min_assurance_score 30, step_up_max_rounds 2, no age gate; PUBLISHED."
            - "Session subj-r2a is ENHANCED tier with declared value 150000 cents and biometric_consent true -> risk_score 70 / HIGH."
            - "Attempt A1 on the biometric profile receives an ACTIVE liveness capture with pad 8000 and match 9200: threshold 7500 + 800 (HIGH) + 0 (retry 0) - 250 (ACTIVE) = 8050, so 8000 lands in the inconclusive band [7750, 8050) -> INCONCLUSIVE, quality halved to 4360, and finalize rejects the attempt and pushes the session to AWAITING_EVIDENCE."
            - "The session is stepped back up to IN_PROGRESS and a second biometric attempt A2 is opened, whose retry_index is 1."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Bio", home_jurisdiction_code: "US", biometric_retention_mode: "RETAIN_90_DAYS", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "BIOMETRIC_COMPARISON", vendor_code: "biov1", assurance_weight: 35, acceptance_floor_bps: 7000, far_bps: 20, frr_bps: 500, strong_evidence: true, cost_cents: 200 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_bio_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["BIOMETRIC_COMPARISON", "DOCUMENT_SCAN"], min_assurance_score: 30, pad_threshold_bps: 7500, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r2a", requested_assurance_tier: "ENHANCED", subject_jurisdiction_code: "US", declared_transaction_value_cents: 150000, biometric_consent: true, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_bio_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
            - call: "POST /idv/method-attempts/${a1}/liveness-checks"
              payload: { capture_modality: "ACTIVE", pad_score_bps: 8000, match_score_bps: 9200 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a1}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/verification-sessions/${s_id}/step-up"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_bio_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a2: "$.data.id" }
          trigger:
            - call: "POST /idv/method-attempts/${a2}/liveness-checks"
              payload: { capture_modality: "ACTIVE", pad_score_bps: 8250, match_score_bps: 9200 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
          assert:
            - "VerificationSession.${s_id}.risk_score == 70 and VerificationSession.${s_id}.risk_level == HIGH"
            - "GET /idv/method-attempts/${a1}/liveness-checks returns data[0].effective_threshold_bps == 8050 and data[0].decision == INCONCLUSIVE and data[0].retry_index == 0"
            - "MethodAttempt.${a1}.evidence_quality_bps == 4360 and MethodAttempt.${a1}.contribution_points == 15 and MethodAttempt.${a1}.state == REJECTED and MethodAttempt.${a1}.rejection_reason == LIVENESS_FAILED"
            - "MethodAttempt.${a2}.retry_index == 1"
            - "GET /idv/method-attempts/${a2}/liveness-checks returns data[0].effective_threshold_bps == 8250 and data[0].decision == PASS and data[0].retry_index == 1"
            - "MethodAttempt.${a2}.evidence_quality_bps == 8820 and MethodAttempt.${a2}.contribution_points == 30 and MethodAttempt.${a2}.state == SCORED"
            - "VerificationSession.${s_id}.assurance_score_provisional == 30"

      - name: assurance_contributions_floored_per_attempt_before_summation
        grounds:
          - calculations.assurance_score
          - calculations.method_evidence_quality
          - calculations.document_authenticity_assessment
          - entities.MethodAttempt.fields.contribution_points
          - entities.VerificationSession.fields.assurance_score_final
        distinguishing_aspect: |
          Mode (b) rounding order: three attempts with quality 8750 / 7777 / 7142 and weights 45 / 25
          / 15 must be floored per attempt and then summed to 39 + 19 + 10 = 68; summing the exact
          weighted products first and flooring once yields 69, so the pinned order is observable.
        test_recipe:
          setup:
            - "Client Acme Round is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN, DATABASE_CHECK and KNOWLEDGE_BASED with min_assurance_score 60, doc floor 8000, no age gate; PUBLISHED."
            - "Session subj-r2b is STANDARD / value 0 / STANDARD_DOCS -> risk 30 LOW."
            - "Three attempts are scored and ACCEPTED: DOCUMENT_SCAN 14/16 features with no tamper signal -> 8750 bps, DATABASE_CHECK 7 of 9 fields matched -> 7777 bps, KNOWLEDGE_BASED 5 of 7 answers -> 7142 bps."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Round", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DATABASE_CHECK", vendor_code: "dbv1", assurance_weight: 25, acceptance_floor_bps: 6000, far_bps: 80, frr_bps: 600, strong_evidence: false, cost_cents: 40 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_db_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "KNOWLEDGE_BASED", vendor_code: "kbav1", assurance_weight: 15, acceptance_floor_bps: 6000, far_bps: 150, frr_bps: 900, strong_evidence: false, cost_cents: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_kba_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN", "DATABASE_CHECK", "KNOWLEDGE_BASED"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r2b", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
            - call: "POST /idv/method-attempts/${a1}/document-captures"
              payload: { document_type: "PASSPORT", required_feature_count: 16, passed_feature_count: 14, tamper_signal_count: 0, mrz_checksum_valid: true }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a1}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_db_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a2: "$.data.id" }
            - call: "POST /idv/method-attempts/${a2}/data-evidence"
              payload: { matched_field_count: 7, total_field_count: 9 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a2}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_kba_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a3: "$.data.id" }
            - call: "POST /idv/method-attempts/${a3}/data-evidence"
              payload: { correct_answer_count: 5, question_count: 7 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a3}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/complete"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
          assert:
            - "MethodAttempt.${a1}.evidence_quality_bps == 8750 and MethodAttempt.${a1}.contribution_points == 39"
            - "MethodAttempt.${a2}.evidence_quality_bps == 7777 and MethodAttempt.${a2}.contribution_points == 19"
            - "MethodAttempt.${a3}.evidence_quality_bps == 7142 and MethodAttempt.${a3}.contribution_points == 10"
            - "VerificationSession.${s_id}.assurance_score_provisional == 68"
            - "VerificationSession.${s_id}.assurance_score_final == 68"
            - "VerificationSession.${s_id}.assurance_score_final != 69"
            - "VerificationSession.${s_id}.identity_state == VERIFIED and VerificationSession.${s_id}.disposition_reason == SCORE_SATISFIED"

      - name: document_tamper_tier_keyed_on_pre_penalty_base_score
        grounds:
          - calculations.document_authenticity_assessment
          - entities.DocumentCapture.fields.base_score_bps
          - entities.DocumentCapture.fields.tamper_tier_multiplier_bps
          - entities.DocumentCapture.fields.tamper_penalty_bps
          - entities.DocumentCapture.fields.authenticity_score_bps
          - state_machines.MethodAttempt.state.AWAITING_EVIDENCE_to_SCORED
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the tamper tier multiplier is selected from the
          PRE-penalty base score 8889 (tier 15000) and only then subtracted, giving 6189; selecting
          the tier from the post-penalty score would drop into the 20000 tier and yield 5289.
        test_recipe:
          setup:
            - "Client Acme Order is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN with doc_authenticity_floor_bps 8000, min_assurance_score 60, no age gate; PUBLISHED."
            - "Session subj-r2c is STANDARD / value 0 / STANDARD_DOCS and has one AWAITING_EVIDENCE attempt A1 on the DOCUMENT_SCAN profile (weight 45)."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Order", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 60, doc_authenticity_floor_bps: 8000, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r2c", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /idv/method-attempts/${a1}/document-captures"
              payload: { document_type: "NATIONAL_ID", required_feature_count: 9, passed_feature_count: 8, tamper_signal_count: 4, mrz_checksum_valid: true }
              as: ClientIntegrator
              as_user_id: "${client_id}"
          assert:
            - "DocumentCapture for attempt ${a1} has base_score_bps == 8889"
            - "DocumentCapture for attempt ${a1} has tamper_tier_multiplier_bps == 15000"
            - "DocumentCapture for attempt ${a1} has tamper_penalty_bps == 2700"
            - "DocumentCapture for attempt ${a1} has authenticity_score_bps == 6189"
            - "DocumentCapture for attempt ${a1} has authenticity_score_bps != 5289"
            - "DocumentCapture for attempt ${a1} has assessment == SUSPECT"
            - "MethodAttempt.${a1}.state == SCORED and MethodAttempt.${a1}.evidence_quality_bps == 6189 and MethodAttempt.${a1}.contribution_points == 27"
            - "MethodAttempt.${a1}.tamper_flag == false"

  # =====================================================================================
  # RULE 3 — non_linear_state_machine
  # Three different entities, three different non-linear shapes.
  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: session_identity_and_age_axes_advance_independently_across_step_up_cycle
        grounds:
          - state_machines.VerificationSession.identity_state.IN_PROGRESS_to_AWAITING_EVIDENCE
          - state_machines.VerificationSession.identity_state.AWAITING_EVIDENCE_to_IN_PROGRESS
          - state_machines.VerificationSession.age_state.PENDING_to_FAILED
          - state_machines.VerificationSession.age_state.FAILED_to_ASSURED
          - calculations.age_assurance_decision
          - entities.VerificationSession.fields.age_state
          - entities.VerificationSession.fields.step_up_round
        distinguishing_aspect: |
          VerificationSession carries two parallel state dimensions plus a cycle: the age axis moves
          PENDING -> FAILED -> ASSURED while the identity axis independently moves IN_PROGRESS ->
          AWAITING_EVIDENCE -> IN_PROGRESS, and the step-up transition leaves age_state ASSURED
          untouched while raising step_up_round to 1.
        test_recipe:
          setup:
            - "Client Acme Axes is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN, required_min_age_years 18, age_buffer_multiplier_bps 15000, doc floor 8000, min_assurance_score 30, step_up_max_rounds 2; PUBLISHED, so the session opens with age_state PENDING."
            - "An AGE_ESTIMATION profile agev1 documents estimation_mae_months 18 and band accuracies for every band."
            - "A first ESTIMATION result of 242 months yields buffer 27 and effective age 215 -> band B16_17 -> FAILED, so age_state is FAILED."
            - "A DOCUMENT_SCAN attempt scores 7 of 8 features with 2 tamper signals -> 7400 bps SUSPECT, below the 8000 floor, so finalize rejects it without a tamper flag and the identity axis moves to AWAITING_EVIDENCE."
            - "A second ESTIMATION result of 243 months yields effective age 216 -> band B18_20 -> ASSURED, flipping the age axis to ASSURED while the identity axis stays AWAITING_EVIDENCE."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Axes", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "AGE_ESTIMATION", vendor_code: "agev1", assurance_weight: 10, acceptance_floor_bps: 5000, far_bps: 200, frr_bps: 800, strong_evidence: false, cost_cents: 30, estimation_mae_months: 18, band_accuracy_bps: { U13: 8500, B13_15: 8800, B16_17: 9100, B18_20: 9400, A21_PLUS: 9600 } }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_age_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 30, doc_authenticity_floor_bps: 8000, required_min_age_years: 18, age_buffer_multiplier_bps: 15000, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r3a", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/age-assurance-results"
              payload: { method: "ESTIMATION", estimation_profile_id: "${p_age_id}", estimated_age_months: 242 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { a1: "$.data.id" }
            - call: "POST /idv/method-attempts/${a1}/document-captures"
              payload: { document_type: "DRIVERS_LICENSE", required_feature_count: 8, passed_feature_count: 7, tamper_signal_count: 2, mrz_checksum_valid: true }
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/method-attempts/${a1}/finalize"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
            - call: "POST /idv/verification-sessions/${s_id}/age-assurance-results"
              payload: { method: "ESTIMATION", estimation_profile_id: "${p_age_id}", estimated_age_months: 243 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/step-up"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
          assert:
            - "GET /idv/verification-sessions/${s_id}/age-assurance-results returns total_count == 2 with data[0].effective_age_months == 215, data[0].resolved_band == B16_17 and data[0].decision == FAILED"
            - "GET /idv/verification-sessions/${s_id}/age-assurance-results returns data[1].buffer_months == 27, data[1].effective_age_months == 216, data[1].resolved_band == B18_20, data[1].decision == ASSURED and data[1].documented_accuracy_bps == 9400"
            - "MethodAttempt.${a1}.evidence_quality_bps == 7400 and MethodAttempt.${a1}.state == REJECTED and MethodAttempt.${a1}.tamper_flag == false and MethodAttempt.${a1}.rejection_reason == DOCUMENT_SUSPECT"
            - "VerificationSession.${s_id}.identity_state == IN_PROGRESS after the step-up while age_state == ASSURED"
            - "VerificationSession.${s_id}.step_up_round == 1"
            - "VerificationSession.${s_id}.resolved_age_band == B18_20"
            - "Client.${client_id}.pending_stepup_count == 0"

      - name: bias_audit_cycles_through_remediation_back_to_collecting_and_clears
        grounds:
          - state_machines.BiasAudit.state.COLLECTING_to_REMEDIATION_REQUIRED
          - state_machines.BiasAudit.state.REMEDIATION_REQUIRED_to_COLLECTING
          - state_machines.BiasAudit.state.COLLECTING_to_REMEDIATED
          - state_machines.MethodProfile.bias_state.RESTRICTED_to_MONITORED
          - state_machines.MethodProfile.bias_state.MONITORED_to_CLEARED
          - calculations.cohort_disparity_evaluation
          - concurrency_rules[bias-remediation-record]
        distinguishing_aspect: |
          BiasAudit is the cyclic machine: COLLECTING -> REMEDIATION_REQUIRED -> COLLECTING ->
          REMEDIATED revisits COLLECTING with remediation_round 1, and the second evaluation scores
          only the post-remediation cohort rows, which is what makes the loop terminate at REMEDIATED
          instead of looping forever.
        test_recipe:
          setup:
            - "A DOCUMENT_SCAN profile docv1 exists with bias_state CLEARED."
            - "A bias audit over 2026-07-01 -> 2026-08-01 collected three cohorts with frr 500 / 300 / 400 bps, giving max_to_pooled 12500 >= 12500, so evaluation by co-1 set the audit to REMEDIATION_REQUIRED and the profile to RESTRICTED."
            - "The profile version observed after that evaluation is captured for the remediation write."
            - "co-2 (a different compliance officer, satisfying segregation of duties) records the remediation, returning the audit to COLLECTING with remediation_round 1 and the profile to MONITORED."
            - "Three fresh cohort rows are submitted after remediated_at with frr 400 / 420 / 380 bps."
          setup_api_calls:
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_doc_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_18_24", attempt_count: 1000, false_reject_count: 50, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_25_44", attempt_count: 1000, false_reject_count: 30, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_65_PLUS", attempt_count: 1000, false_reject_count: 40, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /idv/method-profiles/${p_doc_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_v: "$.data.version" }
            - call: "POST /idv/bias-audits/${audit_id}/remediation"
              payload: { expected_method_profile_version: "${p_doc_v}", remediation_note: "recalibrated document matcher on cohort-balanced training data" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "SKIN_TONE_I_III", attempt_count: 1000, false_reject_count: 40, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "SKIN_TONE_IV_VI", attempt_count: 1000, false_reject_count: 42, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_45_64", attempt_count: 1000, false_reject_count: 38, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /idv/bias-audits/${audit_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "BiasAudit.${audit_id}.state == REMEDIATED and BiasAudit.${audit_id}.remediation_round == 1"
            - "BiasAudit.${audit_id}.remediated_by_user_id == co-2 and BiasAudit.${audit_id}.evaluated_by_user_id == co-1"
            - "BiasAudit.${audit_id}.max_frr_bps == 420 and BiasAudit.${audit_id}.min_frr_bps == 380 and BiasAudit.${audit_id}.pooled_frr_bps == 400"
            - "BiasAudit.${audit_id}.disparity_ratio_max_to_min_bps == 11053 and BiasAudit.${audit_id}.disparity_ratio_max_to_pooled_bps == 10500"
            - "BiasAudit.${audit_id}.included_cohort_count == 3 and BiasAudit.${audit_id}.excluded_cohort_count == 0"
            - "BiasAudit.${audit_id}.worst_cohort_code == SKIN_TONE_IV_VI"
            - "MethodProfile.${p_doc_id}.bias_state == CLEARED and MethodProfile.${p_doc_id}.restricted_at == null"
            - "GET /idv/bias-audits/${audit_id}/cohort-metrics returns total_count == 6"

      - name: alternative_pathway_fork_joins_with_type_specific_ceiling_side_effects
        grounds:
          - state_machines.AlternativePathway.state.VOUCH_PENDING_to_APPROVED
          - state_machines.AlternativePathway.state.ATTESTATION_PENDING_to_APPROVED
          - state_machines.MethodAttempt.state.AWAITING_EVIDENCE_to_ACCEPTED
          - calculations.method_candidate_selection
          - calculations.method_evidence_quality
          - entities.AlternativePathway.fields.granted_points
          - entities.VerificationSession.fields.assurance_ceiling
        distinguishing_aspect: |
          AlternativePathway forks at creation into two branches that rejoin on the same APPROVE
          trigger with divergent side effects: the VOUCHING branch grants 27 points and leaves
          assurance_ceiling 100, while the ATTESTATION branch grants 21 points and clamps
          assurance_ceiling to 70 on its own session.
        test_recipe:
          setup:
            - "Client Acme Incl is LIVE, DELETE_ON_COMPLETE, quota 50, 2 review credits."
            - "Policy v1 allows DOCUMENT_SCAN, alternative_pathway_enabled true, min_assurance_score 60, no age gate; PUBLISHED."
            - "A VOUCHING_ATTESTATION profile vouv1 (weight 30) exists for pathway grants."
            - "Two sessions are opened with documentation_status NO_STANDARD_DOCS: S1 requests a VOUCHING pathway (state VOUCH_PENDING) and S2 requests an ATTESTATION pathway (state ATTESTATION_PENDING)."
            - "InclusionReviewer ir-1 has already APPROVED the VOUCHING pathway on S1."
