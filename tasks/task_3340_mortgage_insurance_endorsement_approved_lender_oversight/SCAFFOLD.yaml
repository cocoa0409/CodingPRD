# =============================================================================
# SCAFFOLD — FHA Mortgage Insurance Endorsement & Approved Lender Oversight
# =============================================================================
scenario: |
  Mortgage Insurance Endorsement & Approved Lender Oversight (Federal Housing
  Administration): lender approval with net worth, quality control plan and
  audited financial requirements, loan endorsement review verifying underwriting
  compliance with program handbook requirements, appraisal requirements with
  minimum property standards, repair escrow and appraisal transfer rules,
  mortgage insurance premium collection covering upfront and annual components
  with cancellation rules by loan vintage, defect taxonomy applied in
  post-endorsement reviews with severity tiers and lender remediation,
  indemnification agreements and claim denial when defects are found after a
  default, loss mitigation waterfall requirements servicers must follow before
  foreclosure, claim submission with conveyance or claim without conveyance
  options

domain_name: fha-mi-endorsement-oversight
api_prefix: /mi

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all entities top-level, FK links)
# =============================================================================
entities:
  - name: Lender
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Lender legal name" }
      - { name: institution_type, type: enum, source: input, description: "MORTGAGEE_SUPERVISED | MORTGAGEE_NONSUPERVISED | MORTGAGEE_INVESTING" }
      - { name: home_state, type: string, source: input, description: "Two-letter state code" }
      - { name: qc_plan_on_file, type: boolean, source: input, description: "Quality control plan attestation flag recorded at application" }
      - { name: status, type: enum, source: system, description: "DESK_REVIEW | FIELD_REVIEW | RETURNED | APPROVED | SUSPENDED | TERMINATED" }
      - { name: advanced_by_user_id, type: string, source: system, description: "FhaReviewer X-User-ID who advanced to FIELD_REVIEW; segregation-of-duties reference" }
      - { name: approved_by_user_id, type: string, source: system, description: "FhaApprover X-User-ID who approved" }
      - { name: endorsed_volume_cents, type: integer, source: computed, default: 0, description: "Sum of base_loan_amount_cents over LoanCases with status IN {ENDORSED, IN_DEFAULT, CLAIM_FILED}" }
      - { name: net_worth_variant, type: enum, source: computed, description: "SMALL_LENDER | STANDARD — which net-worth rule applies (see required_net_worth calc)" }
      - { name: required_net_worth_cents, type: integer, source: computed, description: "Net worth floor per required_net_worth calculation; recomputed on endorse/void/filing-accept/approve" }
      - { name: last_accepted_filing_id, type: string, source: system, description: "Most recently ACCEPTED FinancialFiling id, null if none" }

  - name: FinancialFiling
    parent: null
    common_fields: true
    fields:
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; filing lender" }
      - { name: fiscal_year_end, type: string, source: input, description: "Fiscal year end date, ISO date YYYY-MM-DD" }
      - { name: total_assets_cents, type: integer, source: input, description: "Audited total assets" }
      - { name: total_liabilities_cents, type: integer, source: input, description: "Audited total liabilities" }
      - { name: liquid_assets_cents, type: integer, source: input, description: "Audited liquid assets (liquidity test numerator)" }
      - { name: adjusted_net_worth_cents, type: integer, source: computed, description: "= total_assets_cents - total_liabilities_cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED" }
      - { name: decided_by_user_id, type: string, source: system, description: "FhaReviewer X-User-ID who decided the filing" }

  - name: LoanCase
    parent: null
    common_fields: true
    fields:
      - { name: lender_id, type: string, source: input, description: "FK -> Lender.id; originating lender" }
      - { name: borrower_reference, type: string, source: input, description: "Borrower external reference" }
      - { name: base_loan_amount_cents, type: integer, source: input, description: "Base loan amount before UFMIP financing" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraised property value used for LTV" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months" }
      - { name: note_rate_bps, type: integer, source: input, description: "Note rate in basis points" }
      - { name: current_monthly_payment_cents, type: integer, source: input, description: "Current monthly P&I payment at origination" }
      - { name: refinance_of_case_id, type: string, source: input, description: "FK -> LoanCase.id; prior endorsed case this case refinances (null when not a refinance)", constraints: "optional; must reference an ENDORSED case of the same lender" }
      - { name: status, type: enum, source: system, description: "CASE_NUMBER_ASSIGNED | UNDERWRITE_SUBMITTED | DEFICIENT | BLOCKED | ENDORSED | IN_DEFAULT | CLAIM_FILED | VOIDED | CLAIM_PAID | CLAIM_DENIED" }
      - { name: ltv_bps, type: integer, source: computed, description: "round_half_up(base_loan_amount_cents / appraised_value_cents * 10000) computed at endorsement" }
      - { name: mip_vintage, type: enum, source: computed, description: "PRE_CUTOFF if endorsement_date < 2024-01-01T00:00:00Z else POST_CUTOFF" }
      - { name: endorsement_date, type: datetime, source: system, description: "Logical-clock timestamp of endorsement" }
      - { name: endorsement_reviewer_id, type: string, source: system, description: "FhaReviewer X-User-ID who endorsed; later post-endorsement reviews must use a different reviewer" }
      - { name: endorsement_integrity, type: enum, source: computed, default: SOUND, description: "SOUND | IMPAIRED — IMPAIRED while a TIER_1 defect is CONFIRMED and unremediated" }
      - { name: default_date, type: datetime, source: system, description: "Logical-clock timestamp of declare-default" }
      - { name: mip_cancelled, type: boolean, source: system, default: false, description: "True once annual MIP cancelled" }
      - { name: mip_retained_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over MipLedgerEntry rows with status != CANCELLED (REFUND rows carry negative amount)" }
      - { name: forfeited_escrow_total_cents, type: integer, source: computed, default: 0, description: "Sum of remaining_amount_cents of escrows forfeited at WITHOUT_CONVEYANCE claim filing" }
      - { name: deficiency_codes, type: array, source: system, description: "Deficiency codes recorded on the latest FLAG_DEFICIENT review" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: loan_case_id, type: string, source: input, description: "FK -> LoanCase.id; case the appraisal is currently attached to" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraiser opinion of value" }
      - { name: effective_date, type: string, source: input, description: "Appraisal effective date, ISO date YYYY-MM-DD" }
      - { name: expiry_date, type: string, source: computed, description: "= effective_date + 120 days; validity window is half-open [effective_date, expiry_date)" }
      - { name: mps_deficiency_codes, type: array, source: input, description: "Minimum property standards deficiency codes; [] when compliant", default: [] }
      - { name: status, type: enum, source: system, description: "DELIVERED | ACCEPTED | REJECTED | EXPIRED | TRANSFERRED" }
      - { name: transferred_from_case_id, type: string, source: system, description: "Original LoanCase id when status == TRANSFERRED" }

  - name: RepairEscrow
    parent: null
    common_fields: true
    fields:
      - { name: loan_case_id, type: string, source: input, description: "FK -> LoanCase.id; case holding the repair escrow" }
      - { name: amount_cents, type: integer, source: input, description: "Escrowed repair funds" }
      - { name: start_date, type: string, source: input, description: "Window start, ISO date YYYY-MM-DD (closed bound)" }
      - { name: end_date, type: string, source: input, description: "Window end, ISO date YYYY-MM-DD (closed bound)" }
      - { name: status, type: enum, source: system, description: "OPEN | FROZEN | DISBURSED | EXPIRED | FORFEITED" }
      - { name: freeze_origin, type: enum, source: system, description: "SUSPENSION | IMPAIRMENT — which cascade froze the escrow; null when not FROZEN" }
      - { name: remaining_amount_cents, type: integer, source: computed, description: "= amount_cents until disbursed; then amount_cents - disbursed_amount_cents" }
      - { name: disbursed_amount_cents, type: integer, source: system, default: 0, description: "Amount released on disburse" }

  - name: MipLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: loan_case_id, type: string, source: input, description: "FK -> LoanCase.id; case the premium entry belongs to" }
      - { name: entry_type, type: enum, source: system, description: "UPFRONT | ANNUAL | REFUND" }
      - { name: period_index, type: integer, source: system, description: "1-based annual period index for ANNUAL/REFUND rows; 0 for UPFRONT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; UPFRONT/ANNUAL positive, REFUND negative" }
      - { name: credit_cents, type: integer, source: system, default: 0, description: "UFMIP refinance refund credit applied to an UPFRONT row" }
      - { name: rate_bps, type: integer, source: system, description: "Premium rate applied (175 UFMIP; vintage rate for ANNUAL)" }
      - { name: status, type: enum, source: system, description: "BILLED | CANCELLED" }

  - name: PostEndorsementReview
    parent: null
    common_fields: true
    fields:
      - { name: loan_case_id, type: string, source: input, description: "FK -> LoanCase.id; reviewed case" }
      - { name: reviewer_user_id, type: string, source: system, description: "FhaReviewer X-User-ID performing the review; must differ from LoanCase.endorsement_reviewer_id" }
      - { name: scope_codes, type: array, source: input, description: "Review scope codes" }
      - { name: status, type: enum, source: system, description: "INITIATED | FINDINGS_RECORDED | CLOSURE_PENDING | CLOSED" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp when CLOSED" }

  - name: Defect
    parent: null
    common_fields: true
    fields:
      - { name: review_id, type: string, source: input, description: "FK -> PostEndorsementReview.id; review the defect was recorded in" }
      - { name: defect_code, type: enum, source: input, description: "INCOME_MISCALC | APPRAISAL_INFLATED | ASSET_VERIFICATION_MISSING | QC_PLAN_VIOLATION | ELIGIBILITY_CRITERIA_UNMET" }
      - { name: detail, type: string, source: input, description: "Free-text finding detail" }
      - { name: severity_score, type: integer, source: computed, description: "Weighted score per defect_severity_scoring calculation" }
      - { name: severity_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 from severity_score bands" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | REMEDIATED | DISMISSED" }
      - { name: created_by_user_id, type: string, source: system, description: "FhaReviewer X-User-ID who recorded the defect" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "FhaApprover X-User-ID who confirmed/dismissed/remediated" }

  - name: IndemnificationAgreement
    parent: null
    common_fields: true
    fields:
      - { name: loan_case_id, type: string, source: input, description: "FK -> LoanCase.id; case covered by the indemnification" }
      - { name: coverage_cap_cents, type: integer, source: input, description: "Maximum indemnification recovery" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | SATISFIED" }
      - { name: recovered_total_cents, type: integer, source: computed, default: 0, description: "Cumulative recoveries recorded against this agreement" }
      - { name: created_by_user_id, type: string, source: system, description: "FhaApprover X-User-ID or system when auto-drafted by review close" }

  - name: LossMitigationAction
    parent: null
    common_fields: true
    fields:
      - { name: loan_case_id, type: string, source: input, description: "FK -> LoanCase.id; defaulted case under mitigation" }
      - { name: action_type, type: enum, source: input, description: "REPAYMENT_PLAN | SPECIAL_FORBEARANCE | LOAN_MODIFICATION | PARTIAL_CLAIM | PRE_FORECLOSURE_SALE | DEED_IN_LIEU" }
      - { name: tier, type: integer, source: computed, description: "Waterfall tier 1..6 in action_type order above" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | FAILED | INFEASIBLE" }
      - { name: new_upb_cents, type: integer, source: system, description: "Restructured unpaid principal balance; set only for evaluated LOAN_MODIFICATION" }
      - { name: new_payment_cents, type: integer, source: system, description: "Restructured monthly payment; set only for evaluated LOAN_MODIFICATION" }
      - { name: reduction_bps, type: integer, source: system, description: "Payment reduction in basis points; set only for evaluated LOAN_MODIFICATION" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical-clock timestamp of evaluation" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: loan_case_id, type: string, source: input, description: "FK -> LoanCase.id; defaulted case the claim is filed against" }
      - { name: claim_type, type: enum, source: input, description: "CONVEYANCE | WITHOUT_CONVEYANCE" }
      - { name: unpaid_principal_balance_cents, type: integer, source: input, description: "UPB at claim time" }
      - { name: expense_items, type: array, source: input, description: "Array of { amount_cents: integer, allowable_pct_bps: integer } allowable expense lines" }
      - { name: principal_component_cents, type: integer, source: computed, description: "Per claim_payment calculation (coverage pct, CWOC damage factor)" }
      - { name: expense_component_cents, type: integer, source: computed, description: "Per claim_payment calculation (round per line, then sum)" }
      - { name: forfeited_escrow_offset_cents, type: integer, source: computed, default: 0, description: "Forfeited escrow total subtracted for WITHOUT_CONVEYANCE claims" }
      - { name: total_claim_cents, type: integer, source: computed, description: "Per claim_payment calculation" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | PAID | DENIED" }
      - { name: denial_reason, type: enum, source: system, description: "EXAMINER_DENIAL | INDEMNIFIED_DEFECT — set when status == DENIED" }
      - { name: decided_by_user_id, type: string, source: system, description: "ClaimsExaminer X-User-ID who decided, or system for cascade denial" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lender
    initial_state: DESK_REVIEW
    terminal_states: [TERMINATED]
    transitions:
      - from: DESK_REVIEW
        to: FIELD_REVIEW
        trigger: "POST /mi/lenders/{lenderId}/status-change action=ADVANCE_TO_FIELD_REVIEW"
        actor: FhaReviewer
        preconditions:
          - "lender.status == DESK_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "advanced_by_user_id = X-User-ID"
          - "increments Lender.version by 1"
      - from: DESK_REVIEW
        to: RETURNED
        trigger: "POST /mi/lenders/{lenderId}/status-change action=RETURN"
        actor: FhaReviewer
        preconditions: []
        side_effects: ["increments Lender.version by 1"]
      - from: FIELD_REVIEW
        to: RETURNED
        trigger: "POST /mi/lenders/{lenderId}/status-change action=RETURN"
        actor: FhaReviewer
        preconditions: []
        side_effects: ["increments Lender.version by 1"]
      - from: RETURNED
        to: DESK_REVIEW
        trigger: "POST /mi/lenders/{lenderId}/status-change action=RESUBMIT"
        actor: LenderOfficer
        preconditions:
          - "X-User-ID == lender.id (ownership, ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["increments Lender.version by 1"]
        note: "resubmission cycle: RETURNED -> DESK_REVIEW -> FIELD_REVIEW may repeat"
      - from: FIELD_REVIEW
        to: APPROVED
        trigger: "POST /mi/lenders/{lenderId}/status-change action=APPROVE"
        actor: FhaApprover
        preconditions:
          - "X-User-ID != advanced_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "last_accepted_filing_id non-null and its fiscal_year_end within 15 months before current logical date (ERR_FILING_STALE)"
          - "latest ACCEPTED filing adjusted_net_worth_cents >= required_net_worth_cents (ERR_NET_WORTH_DEFICIENT)"
          - "latest ACCEPTED filing liquid_assets_cents * 5 >= required_net_worth_cents (ERR_LIQUIDITY_DEFICIENT)"
          - "qc_plan_on_file == true (ERR_QC_PLAN_MISSING)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "required_net_worth_cents and net_worth_variant recomputed"
          - "increments Lender.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /mi/lenders/{lenderId}/status-change action=SUSPEND"
        actor: FhaApprover
        preconditions: []
        side_effects:
          - "cascade B hop 1: every LoanCase of this lender in UNDERWRITE_SUBMITTED -> BLOCKED"
          - "cascade B hop 2 (caused by hop 1): every RepairEscrow of a newly-BLOCKED case with status OPEN -> FROZEN with freeze_origin=SUSPENSION"
          - "increments Lender.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /mi/lenders/{lenderId}/status-change action=REINSTATE"
        actor: FhaApprover
        preconditions: []
        side_effects:
          - "unblock cascade: every LoanCase of this lender in BLOCKED -> UNDERWRITE_SUBMITTED"
          - "unfreeze cascade (caused by unblock): escrows of those cases FROZEN with freeze_origin=SUSPENSION -> OPEN, freeze_origin cleared"
          - "increments Lender.version by 1"
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /mi/lenders/{lenderId}/status-change action=TERMINATE"
        actor: FhaApprover
        preconditions:
          - "no LoanCase of this lender in a non-terminal state (CASE_NUMBER_ASSIGNED, UNDERWRITE_SUBMITTED, DEFICIENT, BLOCKED, ENDORSED, IN_DEFAULT, CLAIM_FILED) — else ERR_LENDER_HAS_ACTIVE_CASES"
        side_effects: ["increments Lender.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mi/lenders/{lenderId}/status-change action=TERMINATE"
        actor: FhaApprover
        preconditions:
          - "same active-case precondition as APPROVED -> TERMINATED"
        side_effects: ["increments Lender.version by 1"]

  - entity: FinancialFiling
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mi/financial-filings/{filingId}/decide decision=ACCEPT"
        actor: FhaReviewer
        preconditions:
          - "expected_lender_version == current Lender.version (ERR_STALE_VERSION)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "any other ACCEPTED filing of same lender with same fiscal_year_end -> SUPERSEDED (accept-with-supersede)"
          - "lender.last_accepted_filing_id = this filing id"
          - "recompute lender.required_net_worth_cents / net_worth_variant"
          - "increments Lender.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mi/financial-filings/{filingId}/decide decision=REJECT"
        actor: FhaReviewer
        preconditions:
          - "expected_lender_version == current Lender.version (ERR_STALE_VERSION)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "increments Lender.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (when a newer filing for the same lender and same fiscal_year_end is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LoanCase
    initial_state: CASE_NUMBER_ASSIGNED
    terminal_states: [VOIDED, CLAIM_PAID]
    transitions:
      - from: CASE_NUMBER_ASSIGNED
        to: UNDERWRITE_SUBMITTED
        trigger: "POST /mi/loan-cases/{loanCaseId}/submit-underwriting"
        actor: LenderOfficer
        preconditions:
          - "lender.status == APPROVED (ERR_LENDER_NOT_APPROVED)"
        side_effects: []
      - from: DEFICIENT
        to: UNDERWRITE_SUBMITTED
        trigger: "POST /mi/loan-cases/{loanCaseId}/submit-underwriting"
        actor: LenderOfficer
        preconditions:
          - "lender.status == APPROVED (ERR_LENDER_NOT_APPROVED)"
        side_effects: []
        note: "deficiency cure cycle: UNDERWRITE_SUBMITTED -> DEFICIENT -> UNDERWRITE_SUBMITTED may repeat"
      - from: UNDERWRITE_SUBMITTED
        to: ENDORSED
        trigger: "POST /mi/loan-cases/{loanCaseId}/endorsement-review decision=ENDORSE"
        actor: FhaReviewer
        preconditions:
          - "lender.status == APPROVED (ERR_LENDER_NOT_APPROVED)"
          - "an Appraisal with loan_case_id == this case, status == ACCEPTED exists (ERR_APPRAISAL_NOT_ACCEPTED)"
          - "that appraisal is not expired: current logical date < appraisal.expiry_date, half-open [effective_date, expiry_date) (ERR_APPRAISAL_EXPIRED)"
        side_effects:
          - "compute ltv_bps; compute mip_vintage from endorsement_date; endorsement_date = current clock; endorsement_reviewer_id = X-User-ID"
          - "create MipLedgerEntry UPFRONT per ufmip_with_refinance_credit (credit_cents set when refinance_of_case_id non-null and within 36 months)"
          - "lender.endorsed_volume_cents += base_loan_amount_cents; recompute lender.required_net_worth_cents"
      - from: UNDERWRITE_SUBMITTED
        to: DEFICIENT
        trigger: "POST /mi/loan-cases/{loanCaseId}/endorsement-review decision=FLAG_DEFICIENT"
        actor: FhaReviewer
        preconditions:
          - "deficiency_codes non-empty (ERR_VALIDATION)"
        side_effects:
          - "deficiency_codes = request deficiency_codes"
      - from: ENDORSED
        to: VOIDED
        trigger: "POST /mi/loan-cases/{loanCaseId}/void-endorsement"
        actor: FhaApprover
        preconditions: []
        side_effects:
          - "lender.endorsed_volume_cents -= base_loan_amount_cents; recompute lender.required_net_worth_cents"
          - "every MipLedgerEntry of this case with entry_type == ANNUAL and status == BILLED -> CANCELLED"
          - "mip_retained_cents recomputed (compensating invariant: volume and ledger return to pre-endorsement totals)"
      - from: ENDORSED
        to: IN_DEFAULT
        trigger: "POST /mi/loan-cases/{loanCaseId}/declare-default"
        actor: ServicerOfficer
        preconditions: []
        side_effects:
          - "default_date = current clock"
      - from: IN_DEFAULT
        to: CLAIM_FILED
        trigger: "POST /mi/loan-cases/{loanCaseId}/claims"
        actor: ServicerOfficer
        preconditions:
          - "waterfall exhausted: every LossMitigationAction tier 1..6 of this case has an action with status IN {INFEASIBLE, FAILED} (ERR_WATERFALL_NOT_EXHAUSTED)"
          - "current logical date <= default_date + 180 days, inclusive (ERR_CLAIM_DEADLINE_PASSED)"
        side_effects:
          - "WITHOUT_CONVEYANCE: every RepairEscrow of this case with status IN {OPEN, EXPIRED} -> FORFEITED and forfeited_escrow_total_cents = sum of their remaining_amount_cents"
      - from: CLAIM_FILED
        to: CLAIM_PAID
        trigger: "POST /mi/claims/{claimId}/decide decision=PAY"
        actor: ClaimsExaminer
        preconditions: []
        side_effects: []
      - from: CLAIM_FILED
        to: IN_DEFAULT
        trigger: "POST /mi/claims/{claimId}/decide decision=DENY (or system cascade denial on indemnification execute)"
        actor: ClaimsExaminer
        preconditions: []
        side_effects:
          - "case returns to IN_DEFAULT; claim may be refiled while the default+180-day deadline still holds"
        note: "denial loop: IN_DEFAULT -> CLAIM_FILED -> IN_DEFAULT may repeat"
      - from: UNDERWRITE_SUBMITTED
        to: BLOCKED
        trigger: "system (cascade B hop 1: lender suspended)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade B hop 2: this case's OPEN RepairEscrows -> FROZEN with freeze_origin=SUSPENSION"
      - from: BLOCKED
        to: UNDERWRITE_SUBMITTED
        trigger: "system (unblock cascade: lender reinstated)"
        actor: system
        preconditions: []
        side_effects:
          - "escrows FROZEN with freeze_origin=SUSPENSION -> OPEN"

  - entity: Appraisal
    initial_state: DELIVERED
    terminal_states: [REJECTED, EXPIRED, TRANSFERRED]
    transitions:
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /mi/appraisals/{appraisalId}/decide decision=ACCEPT"
        actor: FhaReviewer
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: REJECTED
        trigger: "POST /mi/appraisals/{appraisalId}/decide decision=REJECT"
        actor: FhaReviewer
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when the new logical date >= expiry_date)"
        actor: system
        preconditions: []
        side_effects: []
        note: "half-open validity: still usable strictly before expiry_date; expired AT expiry_date"
      - from: ACCEPTED
        to: TRANSFERRED
        trigger: "POST /mi/appraisals/{appraisalId}/transfer"
        actor: LenderOfficer
        preconditions:
          - "current logical date < expiry_date (ERR_TRANSFER_WINDOW_CLOSED at or after expiry_date)"
          - "target LoanCase belongs to the same lender (ERR_FORBIDDEN_OWNERSHIP cross-case check)"
          - "target LoanCase.status == CASE_NUMBER_ASSIGNED (ERR_INVALID_STATE)"
          - "target LoanCase has no other Appraisal with status IN {DELIVERED, ACCEPTED} (ERR_CASE_ALREADY_HAS_APPRAISAL)"
        side_effects:
          - "transferred_from_case_id = prior loan_case_id; loan_case_id = to_loan_case_id"

  - entity: RepairEscrow
    initial_state: OPEN
    terminal_states: [DISBURSED, FORFEITED]
    transitions:
      - from: OPEN
        to: DISBURSED
        trigger: "POST /mi/repair-escrows/{escrowId}/disburse"
        actor: ServicerOfficer
        preconditions:
          - "current logical date <= end_date (ERR_ESCROW_EXPIRED)"
          - "disbursed_amount_cents <= amount_cents (ERR_VALIDATION)"
        side_effects:
          - "disbursed_amount_cents set; remaining_amount_cents = amount_cents - disbursed_amount_cents"
      - from: OPEN
        to: EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when the new logical date > end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: FROZEN
        trigger: "system (cascade: lender suspension hop 2, or endorsement_integrity impairment hop 3)"
        actor: system
        preconditions: []
        side_effects:
          - "freeze_origin = SUSPENSION or IMPAIRMENT per cascade"
      - from: FROZEN
        to: OPEN
        trigger: "system (cascade reversal: lender reinstate, or review closed with integrity restored to SOUND)"
        actor: system
        preconditions: []
        side_effects:
          - "freeze_origin cleared"
      - from: OPEN
        to: FORFEITED
        trigger: "system (WITHOUT_CONVEYANCE claim filed on the case)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_amount_cents added to LoanCase.forfeited_escrow_total_cents"
      - from: EXPIRED
        to: FORFEITED
        trigger: "system (WITHOUT_CONVEYANCE claim filed on the case)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_amount_cents added to LoanCase.forfeited_escrow_total_cents"

  - entity: MipLedgerEntry
    initial_state: BILLED
    terminal_states: [CANCELLED]
    transitions:
      - from: BILLED
        to: CANCELLED
        trigger: "system (void-endorsement cancels BILLED ANNUAL rows)"
        actor: system
        preconditions: []
        side_effects:
          - "LoanCase.mip_retained_cents recomputed"

  - entity: PostEndorsementReview
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: FINDINGS_RECORDED
        trigger: "system (first Defect recorded via POST /mi/post-endorsement-reviews/{reviewId}/defects)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINDINGS_RECORDED
        to: FINDINGS_RECORDED
        trigger: "POST /mi/post-endorsement-reviews/{reviewId}/defects (additional defect)"
        actor: FhaReviewer
        preconditions: []
        side_effects: []
        note: "self-loop: more findings keep the review in FINDINGS_RECORDED"
      - from: FINDINGS_RECORDED
        to: CLOSURE_PENDING
        trigger: "system (cascade A hop 1: a TIER_1 defect of this review is CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade A hop 2: LoanCase.endorsement_integrity = IMPAIRED"
          - "cascade A hop 3 (caused by hop 2): every RepairEscrow of the case with status OPEN -> FROZEN with freeze_origin=IMPAIRMENT"
      - from: FINDINGS_RECORDED
        to: CLOSED
        trigger: "POST /mi/post-endorsement-reviews/{reviewId}/close"
        actor: FhaReviewer
        preconditions:
          - "every Defect of this review has status IN {CONFIRMED, REMEDIATED, DISMISSED} (ERR_DEFECTS_OPEN)"
        side_effects:
          - "closed_at = current clock"
      - from: CLOSURE_PENDING
        to: CLOSED
        trigger: "POST /mi/post-endorsement-reviews/{reviewId}/close"
        actor: FhaReviewer
        preconditions:
          - "every Defect of this review has status IN {CONFIRMED, REMEDIATED, DISMISSED} (ERR_DEFECTS_OPEN)"
        side_effects:
          - "closed_at = current clock"
          - "if any CONFIRMED TIER_1 defect remains unremediated: auto-create IndemnificationAgreement DRAFT with coverage_cap_cents = defect severity exposure (claim total basis), created_by_user_id = 'system'"
          - "if no CONFIRMED TIER_1 defect remains: LoanCase.endorsement_integrity = SOUND and escrows FROZEN with freeze_origin=IMPAIRMENT -> OPEN"

  - entity: Defect
    initial_state: OPEN
    terminal_states: [REMEDIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /mi/defects/{defectId}/confirm decision=CONFIRM"
        actor: FhaApprover
        preconditions: []
        side_effects:
          - "confirmed_by_user_id = X-User-ID"
          - "if severity_tier == TIER_1: cascade A hop 0 -> review FINDINGS_RECORDED -> CLOSURE_PENDING -> case IMPAIRED -> escrows FROZEN"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /mi/defects/{defectId}/confirm decision=DISMISS"
        actor: FhaApprover
        preconditions: []
        side_effects:
          - "confirmed_by_user_id = X-User-ID"
      - from: CONFIRMED
        to: REMEDIATED
        trigger: "POST /mi/defects/{defectId}/confirm decision=MARK_REMEDIATED"
        actor: FhaApprover
        preconditions: []
        side_effects:
          - "remediation evidence accepted; if this was the last unremediated CONFIRMED TIER_1 defect of the case, integrity restores at next review close"

  - entity: IndemnificationAgreement
    initial_state: DRAFT
    terminal_states: [SATISFIED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /mi/indemnification-agreements/{agreementId}/execute"
        actor: LenderOfficer
        preconditions:
          - "X-User-ID == loan case's lender_id (ownership, ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "claim-denial cascade: every InsuranceClaim of the case with status == UNDER_REVIEW -> DENIED with denial_reason=INDEMNIFIED_DEFECT, decided_by_user_id='system'; the case returns CLAIM_FILED -> IN_DEFAULT"
      - from: EXECUTED
        to: SATISFIED
        trigger: "POST /mi/indemnification-agreements/{agreementId}/record-recovery (when cumulative recovered_total_cents >= coverage_cap_cents)"
        actor: ClaimsExaminer
        preconditions: []
        side_effects:
          - "recovered_total_cents += recovery_amount_cents; SATISFIED iff recovered_total_cents >= coverage_cap_cents"

  - entity: LossMitigationAction
    initial_state: PENDING
    terminal_states: [APPROVED, FAILED, INFEASIBLE]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /mi/loss-mitigation-actions/{actionId}/evaluate decision=APPROVE"
        actor: ServicerOfficer
        preconditions:
          - "for LOAN_MODIFICATION: modification_restructure reduction_bps >= 1000 else ERR_MODIFICATION_INSUFFICIENT_REDUCTION"
        side_effects:
          - "for LOAN_MODIFICATION: new_upb_cents, new_payment_cents, reduction_bps computed and stored"
          - "evaluated_at = current clock"
      - from: PENDING
        to: FAILED
        trigger: "POST /mi/loss-mitigation-actions/{actionId}/evaluate decision=FAIL"
        actor: ServicerOfficer
        preconditions: []
        side_effects: ["evaluated_at = current clock"]
      - from: PENDING
        to: INFEASIBLE
        trigger: "POST /mi/loss-mitigation-actions/{actionId}/evaluate decision=INFEASIBLE"
        actor: ServicerOfficer
        preconditions: []
        side_effects: ["evaluated_at = current clock"]

  - entity: InsuranceClaim
    initial_state: UNDER_REVIEW
    terminal_states: [PAID, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: PAID
        trigger: "POST /mi/claims/{claimId}/decide decision=PAY"
        actor: ClaimsExaminer
        preconditions:
          - "no IndemnificationAgreement of the case with status IN {EXECUTED, SATISFIED} (ERR_INDEMNIFICATION_BLOCKS_PAYMENT)"
        side_effects:
          - "LoanCase CLAIM_FILED -> CLAIM_PAID"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /mi/claims/{claimId}/decide decision=DENY"
        actor: ClaimsExaminer
        preconditions: []
        side_effects:
          - "denial_reason = EXAMINER_DENIAL; LoanCase CLAIM_FILED -> IN_DEFAULT"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system (claim-denial cascade: indemnification executed while claim under review)"
        actor: system
        preconditions: []
        side_effects:
          - "denial_reason = INDEMNIFIED_DEFECT; LoanCase CLAIM_FILED -> IN_DEFAULT"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: filing-create-stale-lender
    parent_entity: Lender
    write_endpoint: "POST /mi/lenders/{lenderId}/financial-filings"
    occ_field: expected_lender_version
    description: |
      Creating a FinancialFiling against a Lender whose version has advanced
      since the client last observed it is rejected. A newly ACCEPTED filing
      for the same fiscal year legitimately supersedes the prior one, so a
      writer holding a stale lender version must re-read before filing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: filing-decide-stale-lender
    parent_entity: Lender
    write_endpoint: "POST /mi/financial-filings/{filingId}/decide"
    occ_field: expected_lender_version
    description: |
      Deciding a FinancialFiling while carrying a Lender.version that no
      longer matches the current version is rejected; accept-with-supersede
      mutates the lender's filing set, so a stale accept must not silently
      supersede a filing the reviewer never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ltv_bps
    trigger: "LoanCase endorsement (UNDERWRITE_SUBMITTED -> ENDORSED)"
    algorithm: aggregation
    formula: |
      ltv_bps = round_half_up(base_loan_amount_cents / appraised_value_cents * 10000)
      Computed once at endorsement from the case's own input fields; stored.
    input_set: "the LoanCase being endorsed"
    precision: "integer basis points, round_half_up"

  - name: required_net_worth
    trigger: "recomputed on: filing ACCEPT, endorsement, void-endorsement, and read at APPROVE precondition time"
    algorithm: threshold
    formula: |
      if institution_type == MORTGAGEE_NONSUPERVISED and endorsed_volume_cents < 5000000000:
        variant = SMALL_LENDER; required_net_worth_cents = 50000000
      else:
        variant = STANDARD; required_net_worth_cents = max(100000000, round_half_up(endorsed_volume_cents * 0.01))
    input_set: "the Lender row (institution_type, endorsed_volume_cents)"
    constants:
      SMALL_LENDER_FLOOR_CENTS: 50000000
      STANDARD_FLOOR_CENTS: 100000000
      VOLUME_RATE: 0.01
      SMALL_LENDER_VOLUME_CAP_CENTS: 5000000000
    precision: "integer cents"
    variants:
      - name: SMALL_LENDER
        when: "institution_type == MORTGAGEE_NONSUPERVISED and endorsed_volume_cents < 5000000000"
        difference: "flat 50000000 cents floor regardless of volume"
      - name: STANDARD
        when: "all other lenders"
        difference: "max(100000000, 1% of endorsed_volume_cents); diverges from SMALL_LENDER for identical non-supervised financials above the floor"

  - name: ufmip_with_refinance_credit
    trigger: "LoanCase endorsement — creates the UPFRONT MipLedgerEntry"
    algorithm: tiered_pricing
    formula: |
      gross_ufmip = round_half_up(base_loan_amount_cents * 175 / 10000)
      credit = 0
      if refinance_of_case_id is not null:
        prior = LoanCase[refinance_of_case_id]
        months_elapsed = number of complete calendar months between
                         prior.endorsement_date (date part) and this endorsement date
        if 1 <= months_elapsed <= 36:
          refund_pct_bps = max(1000, 8000 - 200 * (months_elapsed - 1))
          prior_ufmip = amount_cents + credit_cents of prior case's UPFRONT entry (gross, before credit)
          credit = round_half_up(prior_ufmip * refund_pct_bps / 10000)
      upfront_amount = gross_ufmip - credit
      # tiered on months_elapsed, conditional on refinance flag and 36-month window,
      # 3 inputs (prior_ufmip, months_elapsed, base_loan) with non-linear interaction
    input_set: "the endorsed LoanCase plus its refinance_of_case_id prior case when present"
    constants:
      UFMIP_RATE_BPS: 175
      REFUND_START_BPS: 8000
      REFUND_STEP_BPS_PER_MONTH: 200
      REFUND_FLOOR_BPS: 1000
      REFUND_WINDOW_MONTHS: 36
    precision: "integer cents, round_half_up"

  - name: annual_mip_and_cancellation
    trigger: "POST /mi/loan-cases/{loanCaseId}/mip-events (ANNUAL_BILL computes amount; CANCEL evaluates eligibility)"
    algorithm: threshold
    formula: |
      ANNUAL_BILL amount:
        PRE_CUTOFF:  annual = round_half_up(current_balance_cents * 55 / 10000)
        POST_CUTOFF: rate_bps = 50 if ltv_bps <= 9000 else (55 if ltv_bps <= 9500 else 80)
                     annual = round_half_up(current_balance_cents * rate_bps / 10000)
      CANCEL eligibility:
        PRE_CUTOFF:  eligible iff current_balance_cents <= round_half_up(appraised_value_cents * 7800 / 10000)
                     AND endorsement age >= 60 months; else ERR_MIP_CANCELLATION_INELIGIBLE
        POST_CUTOFF: if ltv_bps > 9000 -> ERR_VINTAGE_LIFE_OF_LOAN (never cancellable)
                     else eligible iff endorsement age >= 132 months; else ERR_MIP_CANCELLATION_INELIGIBLE
      age in complete calendar months between endorsement_date and current logical date.
    input_set: "the LoanCase (mip_vintage, ltv_bps, appraised_value_cents, endorsement_date) and the request's current_balance_cents"
    constants:
      VINTAGE_CUTOVER_ISO: "2024-01-01T00:00:00Z"
      PRE_ANNUAL_RATE_BPS: 55
      POST_RATE_LTV_LE_9000_BPS: 50
      POST_RATE_LTV_LE_9500_BPS: 55
      POST_RATE_LTV_GT_9500_BPS: 80
      PRE_CANCEL_BALANCE_BPS: 7800
      PRE_CANCEL_MIN_AGE_MONTHS: 60
      POST_CANCEL_MIN_AGE_MONTHS: 132
      POST_CANCEL_LTV_GATE_BPS: 9000
    precision: "integer cents, round_half_up"
    variants:
      - name: PRE_CUTOFF
        when: "endorsement_date < 2024-01-01T00:00:00Z"
        difference: "flat 55 bps; cancellable at 78% balance-to-original-value after 60 months — differs from POST_CUTOFF on identical loan amounts"
      - name: POST_CUTOFF
        when: "endorsement_date >= 2024-01-01T00:00:00Z"
        difference: "LTV-tiered 50/55/80 bps; cancellable only after 132 months and only when initial LTV <= 9000 bps"

  - name: defect_severity_scoring
    trigger: "Defect creation (POST /mi/post-endorsement-reviews/{reviewId}/defects)"
    algorithm: weighted_scoring
    formula: |
      base = CODE_WEIGHT[defect_code]
      pattern_mult = 1.5 if defect_code appears in >= 2 other PostEndorsementReviews
                     (any non-CLOSED or CLOSED status) of the same lender with
                     created_at within the trailing 12 months before current logical date,
                     else 1.0
      default_mult = 1.25 if LoanCase.status == IN_DEFAULT at defect creation else 1.0
      severity_score = round_half_up(base * pattern_mult * default_mult)
      severity_tier = TIER_1 if severity_score >= 50
                      else (TIER_2 if severity_score >= 25 else TIER_3)
    input_set: "the new Defect, its case, and the lender's trailing-12-month reviews"
    constants:
      CODE_WEIGHT_INCOME_MISCALC: 40
      CODE_WEIGHT_APPRAISAL_INFLATED: 35
      CODE_WEIGHT_ASSET_VERIFICATION_MISSING: 20
      CODE_WEIGHT_QC_PLAN_VIOLATION: 15
      CODE_WEIGHT_ELIGIBILITY_CRITERIA_UNMET: 25
      PATTERN_MULT: 1.5
      PATTERN_MIN_OTHER_REVIEWS: 2
      PATTERN_WINDOW_MONTHS: 12
      DEFAULT_MULT: 1.25
      TIER1_MIN_SCORE: 50
      TIER2_MIN_SCORE: 25
    precision: "integer score, round_half_up; multipliers applied before rounding"

  - name: claim_payment
    trigger: "InsuranceClaim creation (POST /mi/loan-cases/{loanCaseId}/claims)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round each expense line to whole cents FIRST, then sum.
      # (sum-then-round is a rejected interpretation; it diverges by >= 1 cent when
      #  two lines each carry a 0.5-cent fraction.)
      principal_component_cents =
        CONVEYANCE:         round_half_up(unpaid_principal_balance_cents * 8500 / 10000)
        WITHOUT_CONVEYANCE: round_half_up(round_half_up(unpaid_principal_balance_cents * 8500 / 10000) * 9000 / 10000)
      expense_component_cents =
        sum over expense_items of round_half_up(amount_cents * allowable_pct_bps / 10000)
      forfeited_escrow_offset_cents =
        CONVEYANCE: 0
        WITHOUT_CONVEYANCE: forfeited_escrow_total_cents (escrows forfeited at filing)
      total_claim_cents = principal_component_cents + expense_component_cents - forfeited_escrow_offset_cents
    input_set: "the new InsuranceClaim (claim_type, unpaid_principal_balance_cents, expense_items) and the case's forfeited escrow total"
    constants:
      COVERAGE_PCT_BPS: 8500
      CWOC_PRINCIPAL_FACTOR_BPS: 9000
    precision: "integer cents, round_half_up; per-line rounding pinned before summation"
    variants:
      - name: CONVEYANCE
        when: "claim_type == CONVEYANCE"
        difference: "full 85% coverage, no damage factor, no escrow offset"
      - name: WITHOUT_CONVEYANCE
        when: "claim_type == WITHOUT_CONVEYANCE"
        difference: "principal component scaled by 90% damage factor and forfeited escrow total subtracted"

  - name: modification_restructure
    trigger: "LossMitigationAction evaluate decision=APPROVE on a LOAN_MODIFICATION action"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER (breaks the circular-looking dependency between
      # old payment -> late fees -> arrears -> new UPB -> new payment -> reduction test):
      (1) freeze old_payment = LoanCase.current_monthly_payment_cents
      (2) late_fees = round_half_up(old_payment * 400 / 10000) * months_late
      (3) arrears = months_late * old_payment + late_fees + escrow_advances_cents
      (4) new_upb_cents = unpaid principal proxy = LoanCase.base_loan_amount_cents + arrears
      (5) modified_rate_bps = max(LoanCase.note_rate_bps - 200, 300)
      (6) new_payment_cents = round_half_up(new_upb_cents * modified_rate_bps / 120000)
      (7) reduction_bps = round_half_up((old_payment - new_payment_cents) / old_payment * 10000)
      (8) APPROVE allowed iff reduction_bps >= 1000, else ERR_MODIFICATION_INSUFFICIENT_REDUCTION
    input_set: "the PENDING LOAN_MODIFICATION action, its LoanCase, months_late and escrow_advances_cents inputs"
    constants:
      LATE_FEE_BPS: 400
      RATE_REDUCTION_BPS: 200
      RATE_FLOOR_BPS: 300
      MIN_REDUCTION_BPS: 1000
    precision: "integer cents / basis points, round_half_up; step order (1)-(8) pinned"

  - name: mip_cancel_refund
    trigger: "POST /mi/loan-cases/{loanCaseId}/mip-events event_type=CANCEL after eligibility passes"
    algorithm: aggregation
    formula: |
      period_index = floor(age_in_months / 12) + 1  (age from endorsement_date to current date)
      months_into_period = age_in_months - 12 * (period_index - 1)
      unused_months = 12 - months_into_period
      current_period_entry = the ANNUAL MipLedgerEntry of this case with
                             period_index == computed period_index and status == BILLED
      refund = round_half_up(current_period_entry.amount_cents * unused_months / 12)
      create REFUND entry with amount_cents = -refund for that period
      mip_cancelled = true
      INVARIANT: mip_retained_cents == sum(amount_cents over entries with status != CANCELLED)
    input_set: "the case's MipLedgerEntry rows and logical clock"
    precision: "integer cents, round_half_up"

  - name: endorsed_volume
    trigger: "LoanCase endorsement, void-endorsement"
    algorithm: aggregation
    formula: |
      Lender.endorsed_volume_cents = sum(base_loan_amount_cents) over LoanCases of the
      lender with status IN {ENDORSED, IN_DEFAULT, CLAIM_FILED}
      INVARIANT: endorse then void-endorse returns endorsed_volume_cents to its
      pre-endorsement value exactly.
    input_set: "LoanCases of the lender filtered by status"
    precision: "integer cents"

  - name: waterfall_next_tier
    trigger: "LossMitigationAction creation (POST /mi/loan-cases/{loanCaseId}/loss-mitigation-actions)"
    algorithm: waterfall_allocation
    formula: |
      tier_of: REPAYMENT_PLAN=1, SPECIAL_FORBEARANCE=2, LOAN_MODIFICATION=3,
               PARTIAL_CLAIM=4, PRE_FORECLOSURE_SALE=5, DEED_IN_LIEU=6
      eligibility filter: tiers with NO action of this case at that tier
      ranking: tier ASC (lowest unevaluated tier first)
      allowed_new_tier = min over eligible tiers
      create of action_type whose tier != allowed_new_tier -> ERR_WATERFALL_ORDER_VIOLATION
      a PENDING action of any tier blocks all creation -> ERR_WATERFALL_ORDER_VIOLATION
      an action with status IN {INFEASIBLE, FAILED} opens the next tier
      an action with status APPROVED permanently blocks claims (waterfall not exhausted)
      empty eligible set (all tiers terminal) -> waterfall exhausted; claim precondition met
    input_set: "LossMitigationActions of the case"
    precision: "integer tier"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint; on POST /mi/lenders/{id}/status-change the role-to-action matrix applies (RESUBMIT=LenderOfficer; ADVANCE_TO_FIELD_REVIEW/RETURN=FhaReviewer; APPROVE/SUSPEND/REINSTATE/TERMINATE=FhaApprover)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "entity-backed ownership: LenderOfficer/ServicerOfficer X-User-ID must equal the lender id owning the target resource (directly, or via LoanCase.lender_id, or via the parent chain of filings/appraisals/escrows/reviews/claims)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "all mutating endpoints for entity-backed roles"
  - priority: 4
    category: existence
    check: "every id in path and body references an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "request payload shape and field domains: required fields present, enums valid, amounts positive, start_date <= end_date, deficiency_codes non-empty on FLAG_DEFICIENT"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "OCC: expected_lender_version matches current Lender.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mi/lenders/{id}/financial-filings, POST /mi/financial-filings/{id}/decide"
  - priority: 7
    category: state
    check: "target resource in a state permitting the transition (terminal lockdown, BLOCKED case rejects endorsement review with ERR_CASE_BLOCKED)"
    error_id: "ERR_INVALID_STATE | ERR_CASE_BLOCKED | ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "segregation of duties: APPROVE approver != advanced_by_user_id; post-endorsement reviewer != LoanCase.endorsement_reviewer_id"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_REVIEWER_CONFLICT"
    http_status: 422
    applies_to: "status-change APPROVE; POST /mi/loan-cases/{id}/post-endorsement-reviews"
  - priority: 9
    category: business_referential
    check: "linked-entity state gates: lender APPROVED for case create/submit/endorse; ACCEPTED appraisal for endorsement; no second open review; target case free of live appraisal; no executed indemnification blocking claim pay; no open defects at review close; no active cases at lender termination"
    error_id: "ERR_LENDER_NOT_APPROVED | ERR_APPRAISAL_NOT_ACCEPTED | ERR_REVIEW_ALREADY_OPEN | ERR_CASE_ALREADY_HAS_APPRAISAL | ERR_INDEMNIFICATION_BLOCKS_PAYMENT | ERR_DEFECTS_OPEN | ERR_LENDER_HAS_ACTIVE_CASES"
    http_status: 409
    applies_to: "cross-entity gated endpoints"
  - priority: 10
    category: business_temporal
    check: "window checks: appraisal unexpired at endorsement; transfer before expiry_date; filing within 15 months at approval; review within 24 months of endorsement; claim within 180 days of default; escrow disbursement before end_date"
    error_id: "ERR_APPRAISAL_EXPIRED | ERR_TRANSFER_WINDOW_CLOSED | ERR_FILING_STALE | ERR_REVIEW_WINDOW_PASSED | ERR_CLAIM_DEADLINE_PASSED | ERR_ESCROW_EXPIRED"
    http_status: 422
    applies_to: "time-windowed endpoints"
  - priority: 11
    category: business_constraint
    check: "domain constraints: escrow closed-window overlap; escrow frozen; waterfall ordering and exhaustion; modification reduction floor; life-of-loan vintage"
    error_id: "ERR_ESCROW_WINDOW_OVERLAP | ERR_ESCROW_FROZEN | ERR_WATERFALL_ORDER_VIOLATION | ERR_WATERFALL_NOT_EXHAUSTED | ERR_MODIFICATION_INSUFFICIENT_REDUCTION | ERR_VINTAGE_LIFE_OF_LOAN"
    http_status: 409
    applies_to: "escrow, loss-mitigation, claim, MIP endpoints"
  - priority: 12
    category: business_fiscal
    check: "financial sufficiency at approval: net worth floor, 20% liquidity test, QC plan attestation; MIP cancellation eligibility balance test"
    error_id: "ERR_NET_WORTH_DEFICIENT | ERR_LIQUIDITY_DEFICIENT | ERR_QC_PLAN_MISSING | ERR_MIP_CANCELLATION_INELIGIBLE"
    http_status: 422
    applies_to: "status-change APPROVE; mip-events CANCEL"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time. Advancing the clock fires time-based transitions: ACCEPTED Appraisals whose expiry_date <= new date become EXPIRED; OPEN RepairEscrows whose end_date < new date become EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "appraisal expiry sweep (ACCEPTED -> EXPIRED when new date >= expiry_date)"
      - "escrow expiry sweep (OPEN -> EXPIRED when new date > end_date)"

  - method: POST
    path: "/mi/lenders"
    description: "Onboard a lender application (lands in DESK_REVIEW)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, institution_type, home_state, qc_plan_on_file]
    output: Lender
    side_effects: ["status=DESK_REVIEW, endorsed_volume_cents=0, required_net_worth_cents computed per variant"]

  - method: GET
    path: "/mi/lenders/{lenderId}"
    description: "Get a lender"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: Lender
    side_effects: []

  - method: POST
    path: "/mi/lenders/{lenderId}/status-change"
    description: "Drive the lender approval lifecycle. action: RESUBMIT (LenderOfficer owner, RETURNED->DESK_REVIEW) | ADVANCE_TO_FIELD_REVIEW (FhaReviewer, DESK_REVIEW->FIELD_REVIEW) | RETURN (FhaReviewer, DESK_REVIEW/FIELD_REVIEW->RETURNED) | APPROVE (FhaApprover, FIELD_REVIEW->APPROVED) | SUSPEND (FhaApprover, APPROVED->SUSPENDED) | REINSTATE (FhaApprover, SUSPENDED->APPROVED) | TERMINATE (FhaApprover, APPROVED/SUSPENDED->TERMINATED)"
    roles: [LenderOfficer, FhaReviewer, FhaApprover]
    code: 200
    input: [action, "note?"]
    output: Lender
    side_effects: ["per §1.2 Lender transitions, including cascade B on SUSPEND/REINSTATE"]

  - method: POST
    path: "/mi/lenders/{lenderId}/financial-filings"
    description: "Submit an audited financial filing (lands SUBMITTED); OCC-guarded create-with-supersede per concurrency_rules[filing-create-stale-lender]"
    roles: [LenderOfficer]
    code: 201
    input: [fiscal_year_end, total_assets_cents, total_liabilities_cents, liquid_assets_cents, expected_lender_version]
    output: FinancialFiling
    side_effects: ["adjusted_net_worth_cents computed", "increments Lender.version by 1"]

  - method: GET
    path: "/mi/lenders/{lenderId}/financial-filings"
    description: "List a lender's filings"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: FinancialFiling[]
    side_effects: []

  - method: POST
    path: "/mi/financial-filings/{filingId}/decide"
    description: "Accept (superseding any prior ACCEPTED filing for the same lender and fiscal_year_end) or reject a filing; OCC-guarded per concurrency_rules[filing-decide-stale-lender]"
    roles: [FhaReviewer]
    code: 200
    input: [decision, expected_lender_version, "note?"]
    output: FinancialFiling
    side_effects: ["per §1.2 FinancialFiling transitions", "increments Lender.version by 1"]

  - method: POST
    path: "/mi/loan-cases"
    description: "Open a mortgage insurance case (CASE_NUMBER_ASSIGNED); lender must be APPROVED"
    roles: [LenderOfficer]
    code: 201
    input: [lender_id, borrower_reference, base_loan_amount_cents, appraised_value_cents, term_months, note_rate_bps, current_monthly_payment_cents, "refinance_of_case_id?"]
    output: LoanCase
    side_effects: ["endorsement_integrity=SOUND"]

  - method: GET
    path: "/mi/loan-cases"
    description: "List loan cases; filterable by lender_id and refinance_of_case_id"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: ["lender_id?", "refinance_of_case_id?"]
    output: LoanCase[]
    side_effects: []

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}"
    description: "Get a loan case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: LoanCase
    side_effects: []

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/submit-underwriting"
    description: "Submit underwriting package from CASE_NUMBER_ASSIGNED or DEFICIENT (deficiency cure cycle)"
    roles: [LenderOfficer]
    code: 200
    input: []
    output: LoanCase
    side_effects: ["status -> UNDERWRITE_SUBMITTED"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/endorsement-review"
    description: "Endorsement review decision: ENDORSE (verifies appraisal acceptance/validity, computes ltv_bps/mip_vintage, bills UFMIP with refinance credit, credits lender endorsed_volume) or FLAG_DEFICIENT (case -> DEFICIENT with deficiency_codes)"
    roles: [FhaReviewer]
    code: 200
    input: [decision, "deficiency_codes?"]
    output: LoanCase
    side_effects: ["per §1.2 LoanCase UNDERWRITE_SUBMITTED transitions"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/void-endorsement"
    description: "Void an endorsement; compensates endorsed_volume and cancels BILLED ANNUAL MIP rows"
    roles: [FhaApprover]
    code: 200
    input: [reason]
    output: LoanCase
    side_effects: ["per §1.2 LoanCase ENDORSED -> VOIDED"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/declare-default"
    description: "Declare the case in default; sets default_date from the logical clock"
    roles: [ServicerOfficer]
    code: 200
    input: []
    output: LoanCase
    side_effects: ["status -> IN_DEFAULT, default_date = current clock"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/appraisals"
    description: "Deliver an appraisal for the case (lands DELIVERED)"
    roles: [LenderOfficer]
    code: 201
    input: [appraised_value_cents, effective_date, "mps_deficiency_codes?"]
    output: Appraisal
    side_effects: ["expiry_date = effective_date + 120 days"]

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}/appraisals"
    description: "List appraisals currently attached to the case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: Appraisal[]
    side_effects: []

  - method: POST
    path: "/mi/appraisals/{appraisalId}/decide"
    description: "Accept or reject a DELIVERED appraisal (minimum property standards review)"
    roles: [FhaReviewer]
    code: 200
    input: [decision, "note?"]
    output: Appraisal
    side_effects: ["status -> ACCEPTED or REJECTED"]

  - method: POST
    path: "/mi/appraisals/{appraisalId}/transfer"
    description: "Transfer an ACCEPTED appraisal to another case of the same lender; validity window half-open [effective_date, expiry_date) — a transfer with current date >= expiry_date is rejected"
    roles: [LenderOfficer]
    code: 200
    input: [to_loan_case_id]
    output: Appraisal
    side_effects: ["status -> TRANSFERRED, loan_case_id moved, transferred_from_case_id recorded"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/repair-escrows"
    description: "Open a repair escrow; windows are CLOSED intervals [start_date, end_date] and any intersection — including touching endpoints (start == other end) — with another OPEN or FROZEN escrow of the same case is rejected"
    roles: [LenderOfficer]
    code: 200
    input: [amount_cents, start_date, end_date]
    output: RepairEscrow
    side_effects: ["status=OPEN, remaining_amount_cents=amount_cents"]
    code_override: null

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}/repair-escrows"
    description: "List repair escrows of the case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: RepairEscrow[]
    side_effects: []

  - method: POST
    path: "/mi/repair-escrows/{escrowId}/disburse"
    description: "Disburse escrowed funds on completed repairs"
    roles: [ServicerOfficer]
    code: 200
    input: [disbursed_amount_cents]
    output: RepairEscrow
    side_effects: ["status -> DISBURSED, remaining_amount_cents reduced"]

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}/mip-ledger-entries"
    description: "List MIP ledger entries of the case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: MipLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/mip-events"
    description: "MIP servicing events: ANNUAL_BILL bills the next annual premium per vintage rate on current_balance_cents; CANCEL applies vintage cancellation rules (PRE_CUTOFF: balance <= 78% of original value after 60 months; POST_CUTOFF: initial LTV <= 9000 bps after 132 months, else life-of-loan) and posts a pro-rated REFUND"
    roles: [ServicerOfficer]
    code: 200
    input: [event_type, current_balance_cents]
    output: MipLedgerEntry
    side_effects: ["per annual_mip_and_cancellation and mip_cancel_refund calculations"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/post-endorsement-reviews"
    description: "Open a post-endorsement review; reviewer must differ from endorsement_reviewer_id (segregation), within 24 months of endorsement, one open review per case"
    roles: [FhaReviewer]
    code: 201
    input: [scope_codes]
    output: PostEndorsementReview
    side_effects: ["reviewer_user_id = X-User-ID"]

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}/post-endorsement-reviews"
    description: "List post-endorsement reviews of the case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: PostEndorsementReview[]
    side_effects: []

  - method: POST
    path: "/mi/post-endorsement-reviews/{reviewId}/defects"
    description: "Record a defect finding; computes severity_score/severity_tier via weighted scoring"
    roles: [FhaReviewer]
    code: 201
    input: [defect_code, "detail?"]
    output: Defect
    side_effects: ["review INITIATED -> FINDINGS_RECORDED (or stays)", "created_by_user_id = X-User-ID"]

  - method: GET
    path: "/mi/post-endorsement-reviews/{reviewId}/defects"
    description: "List defects recorded in the review"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: Defect[]
    side_effects: []

  - method: POST
    path: "/mi/post-endorsement-reviews/{reviewId}/close"
    description: "Close the review; all defects must be terminal; CONFIRMED TIER_1 remnants auto-draft an IndemnificationAgreement"
    roles: [FhaReviewer]
    code: 200
    input: []
    output: PostEndorsementReview
    side_effects: ["per §1.2 PostEndorsementReview close transitions"]

  - method: POST
    path: "/mi/defects/{defectId}/confirm"
    description: "Confirm, dismiss, or mark a defect remediated (decision: CONFIRM | DISMISS | MARK_REMEDIATED); confirming a TIER_1 defect fires cascade A"
    roles: [FhaApprover]
    code: 200
    input: [decision]
    output: Defect
    side_effects: ["per §1.2 Defect transitions incl. cascade A"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/indemnification-agreements"
    description: "Draft an indemnification agreement for a case with an unremediated CONFIRMED TIER_1 defect"
    roles: [FhaApprover]
    code: 201
    input: [coverage_cap_cents]
    output: IndemnificationAgreement
    side_effects: ["status=DRAFT, recovered_total_cents=0"]

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}/indemnification-agreements"
    description: "List indemnification agreements of the case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: IndemnificationAgreement[]
    side_effects: []

  - method: POST
    path: "/mi/indemnification-agreements/{agreementId}/execute"
    description: "Lender executes the agreement; any UNDER_REVIEW claim on the case is cascade-DENIED (INDEMNIFIED_DEFECT) and future PAY is blocked"
    roles: [LenderOfficer]
    code: 200
    input: []
    output: IndemnificationAgreement
    side_effects: ["per §1.2 IndemnificationAgreement DRAFT -> EXECUTED claim-denial cascade"]

  - method: POST
    path: "/mi/indemnification-agreements/{agreementId}/record-recovery"
    description: "Record a recovery payment; agreement SATISFIES when recovered_total_cents >= coverage_cap_cents"
    roles: [ClaimsExaminer]
    code: 200
    input: [recovery_amount_cents]
    output: IndemnificationAgreement
    side_effects: ["recovered_total_cents += recovery_amount_cents; maybe EXECUTED -> SATISFIED"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/loss-mitigation-actions"
    description: "Open the next loss-mitigation option; strict waterfall order — only the lowest tier with no existing action may be created, and not while another action is PENDING"
    roles: [ServicerOfficer]
    code: 201
    input: [action_type]
    output: LossMitigationAction
    side_effects: ["tier computed from action_type; status=PENDING"]

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}/loss-mitigation-actions"
    description: "List loss-mitigation actions of the case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: LossMitigationAction[]
    side_effects: []

  - method: POST
    path: "/mi/loss-mitigation-actions/{actionId}/evaluate"
    description: "Evaluate a PENDING action (decision: APPROVE | FAIL | INFEASIBLE); LOAN_MODIFICATION APPROVE runs modification_restructure and requires reduction_bps >= 1000"
    roles: [ServicerOfficer]
    code: 200
    input: [decision, "months_late?", "escrow_advances_cents?"]
    output: LossMitigationAction
    side_effects: ["per §1.2 LossMitigationAction transitions"]

  - method: POST
    path: "/mi/loan-cases/{loanCaseId}/claims"
    description: "File an insurance claim (CONVEYANCE or WITHOUT_CONVEYANCE); requires waterfall exhausted and filing within 180 days of default; computes claim_payment amounts"
    roles: [ServicerOfficer]
    code: 201
    input: [claim_type, unpaid_principal_balance_cents, expense_items]
    output: InsuranceClaim
    side_effects: ["case IN_DEFAULT -> CLAIM_FILED; CWOC escrow forfeiture"]

  - method: GET
    path: "/mi/loan-cases/{loanCaseId}/claims"
    description: "List claims of the case"
    roles: [PlatformAdmin, LenderOfficer, ServicerOfficer, FhaReviewer, FhaApprover, ClaimsExaminer]
    code: 200
    input: []
    output: InsuranceClaim[]
    side_effects: []

  - method: POST
    path: "/mi/claims/{claimId}/decide"
    description: "Pay or deny an UNDER_REVIEW claim (decision: PAY | DENY)"
    roles: [ClaimsExaminer]
    code: 200
    input: [decision, "denial_reason?"]
    output: InsuranceClaim
    side_effects: ["per §1.2 InsuranceClaim transitions"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role unrecognized" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint or for the requested status-change action" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the lender of the target resource (incl. appraisal transfer across lenders)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed payload: missing required field, invalid enum, non-positive amount, start_date > end_date, empty deficiency_codes on FLAG_DEFICIENT, disbursement exceeding escrow amount" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lender_version does not match current Lender.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that does not permit the transition" }
  - { id: ERR_CASE_BLOCKED, http: 409, condition: "LoanCase is BLOCKED by lender suspension; endorsement review rejected" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target is in a terminal state; no further transitions" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "APPROVE attempted by the same user recorded as advanced_by_user_id" }
  - { id: ERR_REVIEWER_CONFLICT, http: 422, condition: "Post-endorsement reviewer equals LoanCase.endorsement_reviewer_id" }
  - { id: ERR_LENDER_NOT_APPROVED, http: 409, condition: "Case create, submit-underwriting, or endorsement while lender is not APPROVED" }
  - { id: ERR_APPRAISAL_NOT_ACCEPTED, http: 409, condition: "Endorsement without an ACCEPTED appraisal on the case" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "Case already has a review in INITIATED, FINDINGS_RECORDED, or CLOSURE_PENDING" }
  - { id: ERR_CASE_ALREADY_HAS_APPRAISAL, http: 409, condition: "Appraisal transfer target case already has a DELIVERED or ACCEPTED appraisal" }
  - { id: ERR_INDEMNIFICATION_BLOCKS_PAYMENT, http: 409, condition: "Claim PAY while an EXECUTED or SATISFIED indemnification agreement covers the case" }
  - { id: ERR_DEFECTS_OPEN, http: 409, condition: "Review close while any defect is still OPEN" }
  - { id: ERR_LENDER_HAS_ACTIVE_CASES, http: 409, condition: "Lender termination with loan cases in non-terminal states" }
  - { id: ERR_APPRAISAL_EXPIRED, http: 409, condition: "Endorsement with appraisal at or past expiry_date (half-open window)" }
  - { id: ERR_TRANSFER_WINDOW_CLOSED, http: 409, condition: "Appraisal transfer at or after expiry_date" }
  - { id: ERR_FILING_STALE, http: 422, condition: "No ACCEPTED filing with fiscal_year_end within 15 months before the current logical date at approval" }
  - { id: ERR_REVIEW_WINDOW_PASSED, http: 422, condition: "Post-endorsement review opened more than 24 months after endorsement_date" }
  - { id: ERR_CLAIM_DEADLINE_PASSED, http: 422, condition: "Claim filed more than 180 days after default_date" }
  - { id: ERR_ESCROW_EXPIRED, http: 409, condition: "Disbursement after escrow end_date" }
  - { id: ERR_ESCROW_WINDOW_OVERLAP, http: 409, condition: "New escrow closed window [start_date, end_date] intersects (including touching endpoints) another OPEN or FROZEN escrow of the same case" }
  - { id: ERR_ESCROW_FROZEN, http: 409, condition: "Disbursement attempted on a FROZEN escrow" }
  - { id: ERR_WATERFALL_ORDER_VIOLATION, http: 409, condition: "Loss-mitigation action created out of waterfall tier order or while another action is PENDING" }
  - { id: ERR_WATERFALL_NOT_EXHAUSTED, http: 409, condition: "Claim filed before every tier 1..6 holds an INFEASIBLE or FAILED action" }
  - { id: ERR_MODIFICATION_INSUFFICIENT_REDUCTION, http: 422, condition: "LOAN_MODIFICATION APPROVE with reduction_bps < 1000" }
  - { id: ERR_VINTAGE_LIFE_OF_LOAN, http: 422, condition: "POST_CUTOFF annual MIP cancellation with initial LTV > 9000 bps (life-of-loan premium)" }
  - { id: ERR_MIP_CANCELLATION_INELIGIBLE, http: 422, condition: "MIP cancellation failing the vintage balance/age test" }
  - { id: ERR_NET_WORTH_DEFICIENT, http: 422, condition: "Latest ACCEPTED filing adjusted_net_worth_cents below required_net_worth_cents at approval" }
  - { id: ERR_LIQUIDITY_DEFICIENT, http: 422, condition: "Latest ACCEPTED filing liquid_assets_cents * 5 below required_net_worth_cents at approval" }
  - { id: ERR_QC_PLAN_MISSING, http: 422, condition: "Approval with qc_plan_on_file == false" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Agency platform operator; onboards lender applications and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /mi/lenders"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: LenderOfficer
    description: "Approved-lender operations officer; files audited financials, originates and submits cases, delivers and transfers appraisals, opens repair escrows, executes indemnification agreements, resubmits returned applications"
    identity: "entity_backed:Lender"
    exclusive_operations:
      - "POST /mi/lenders/{id}/financial-filings"
      - "POST /mi/loan-cases"
      - "POST /mi/loan-cases/{id}/submit-underwriting"
      - "POST /mi/loan-cases/{id}/appraisals"
      - "POST /mi/appraisals/{id}/transfer"
      - "POST /mi/loan-cases/{id}/repair-escrows"
      - "POST /mi/indemnification-agreements/{id}/execute"
    shared_operations:
      - "POST /mi/lenders/{id}/status-change action=RESUBMIT (shared endpoint; action gated to LenderOfficer)"
      - "All GET endpoints"
  - name: ServicerOfficer
    description: "Servicing arm of the approved lender; declares defaults, disburses escrows, bills and cancels MIP, works the loss-mitigation waterfall, files claims"
    identity: "entity_backed:Lender"
    exclusive_operations:
      - "POST /mi/loan-cases/{id}/declare-default"
      - "POST /mi/repair-escrows/{id}/disburse"
      - "POST /mi/loan-cases/{id}/mip-events"
      - "POST /mi/loan-cases/{id}/loss-mitigation-actions"
      - "POST /mi/loss-mitigation-actions/{id}/evaluate"
      - "POST /mi/loan-cases/{id}/claims"
    shared_operations:
      - "All GET endpoints"
  - name: FhaReviewer
    description: "Agency reviewer; advances/returns applications, decides filings and appraisals, runs endorsement reviews, records defects, closes reviews"
    identity: opaque
    exclusive_operations:
      - "POST /mi/financial-filings/{id}/decide"
