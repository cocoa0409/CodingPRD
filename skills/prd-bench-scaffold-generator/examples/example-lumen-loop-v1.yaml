# =============================================================================
# Example: lumen-loop benchmark seed tables (v1)
# LumenLoop: Launch Sales, Device Lifecycle, and Aftercare API
# =============================================================================

scenario: |
  Product launch lifecycle management system. Manages programs (launches), customers,
  orders, payments, devices, care plans, trade-ins, returns, aftercare claims,
  adjustments, quality campaigns, alerts, and ops runs. Considerations: program posture
  (ACTIVE/GUARDED/FROZEN/CLOSED), customer standing and credit/balance-due ledger,
  inventory management with build lots and replacement reserve, payment authorization
  and capture lifecycle, device serial tracking and activation, warranty and care plan
  coverage, trade-in provisional/final credit with reversal, return inspection and
  refund/replacement resolution, aftercare claims with advance replacement deposits,
  quality campaigns (ship-hold/recall) with quarantine cascades, alert-driven posture
  escalation, ops-run checkpoint rules, and idempotency.

domain_name: lumen-loop
api_prefix: /programs

# =============================================================================
# Table 1: Complexity Profile
# =============================================================================
complexity_profile:
  entity_count: 14
  state_machine_count: 14
  calculation_count: 10
  validation_layers: 7
  endpoint_count: 64
  error_code_count: 34
  role_count: 5

# =============================================================================
# Table 2: Entity Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "Unique program identifier" }
      - { name: display_name, type: string, source: input, description: "Program display name" }
      - { name: program_posture, type: enum, source: computed, description: "PROGRAM_ACTIVE | PROGRAM_GUARDED | PROGRAM_FROZEN | PROGRAM_CLOSED" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic counter, starts at 0, increments on run_ops" }
      - { name: available_to_commit_units, type: integer, source: computed, description: "Shippable units minus committed minus replacement reserve (5 units)" }

  - name: Customer
    parent: Program
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "Unique customer identifier" }
      - { name: display_name, type: string, source: input, description: "Customer name" }
      - { name: customer_status, type: enum, source: system, description: "ACTIVE | LIMITED | LOCKED | CLOSED" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Store credit balance, never negative" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Amount owed by customer" }

  - name: Session
    parent: Program
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "Unique session identifier" }
      - { name: actor_id, type: string, source: input, description: "Actor making the call" }
      - { name: actor_type, type: enum, source: input, description: "Customer | Support | Ops | System" }
      - { name: session_status, type: enum, source: system, description: "ACTIVE | ENDED | REVOKED" }

  - name: BuildLot
    parent: Program
    common_fields: true
    fields:
      - { name: build_lot_id, type: string, source: system, description: "Unique build lot identifier" }
      - { name: build_tag, type: string, source: input, description: "Manufacturing build tag" }
      - { name: build_lot_status, type: enum, source: system, description: "AVAILABLE | QUARANTINED | CONSUMED" }

  - name: Order
    parent: Program
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Unique order identifier" }
      - { name: customer_id, type: string, source: system, description: "Associated customer" }
      - { name: order_status, type: enum, source: system, description: "DRAFT | SUBMITTED | ON_HOLD | SHIPPED | DELIVERED | CANCELED | EXPIRED | REFUNDED" }
      - { name: model_code, type: string, source: input, description: "Product model code" }
      - { name: unit_price_cents, type: integer, source: system, description: "Unit price from program" }
      - { name: care_plan_price_cents, type: integer, source: system, description: "Care plan price from program" }
      - { name: paid_by_credit_cents, type: integer, source: computed, description: "Amount paid by credit" }
      - { name: paid_by_card_cents, type: integer, source: computed, description: "Amount paid by card" }
      - { name: payment_id, type: string, source: system, description: "Associated payment, null until submit" }
      - { name: device_id, type: string, source: system, description: "Associated device, null until ship" }
      - { name: care_plan_id, type: string, source: system, description: "Associated care plan, null if not included" }
      - { name: tradein_id, type: string, source: input, required: false, description: "Associated trade-in" }

  - name: Payment
    parent: Program
    common_fields: true
    fields:
      - { name: payment_id, type: string, source: system, description: "Unique payment identifier" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: payment_status, type: enum, source: system, description: "AUTHORIZED | CAPTURED | VOIDED | REFUNDED | DISPUTED | CHARGEBACK_LOST" }
      - { name: amount_cents, type: integer, source: computed, description: "Payment amount" }

  - name: Device
    parent: Program
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "Unique device identifier" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: customer_id, type: string, source: system, description: "Associated customer" }
      - { name: serial_number, type: string, source: input, description: "Device serial number" }
      - { name: build_tag, type: string, source: input, description: "Device build tag" }
      - { name: device_status, type: enum, source: system, description: "PROVISIONED | SHIPPED | ACTIVE | QUARANTINED | RETURNED | SCRAPPED" }

  - name: CarePlan
    parent: Program
    common_fields: true
    fields:
      - { name: care_plan_id, type: string, source: system, description: "Unique care plan identifier" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: customer_id, type: string, source: system, description: "Associated customer" }
      - { name: device_id, type: string, source: system, description: "Associated device, null until ship" }
      - { name: care_plan_status, type: enum, source: system, description: "PENDING_ACTIVATION | ACTIVE | PAUSED | CANCELED | VOIDED" }

  - name: TradeIn
    parent: Program
    common_fields: true
    fields:
      - { name: tradein_id, type: string, source: system, description: "Unique trade-in identifier" }
      - { name: customer_id, type: string, source: system, description: "Associated customer" }
      - { name: tradein_status, type: enum, source: system, description: "DRAFT | SUBMITTED | INBOUND | APPRAISED | CREDITED | REVERSED | EXPIRED" }
      - { name: quoted_credit_cents, type: integer, source: input, description: "Quoted credit amount" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Final appraised credit, null until appraisal" }

  - name: Return
    parent: Program
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "Unique return identifier" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: device_id, type: string, source: system, description: "Associated device" }
      - { name: customer_id, type: string, source: system, description: "Associated customer" }
      - { name: return_status, type: enum, source: system, description: "REQUESTED | APPROVED | INBOUND | RECEIVED | COMPLETED | REJECTED" }
      - { name: resolution_preference, type: enum, source: input, description: "REFUND | REPLACEMENT" }
      - { name: inspection_outcome, type: enum, source: input, description: "RESTOCK | REFURB | SCRAP, null until received" }
      - { name: refunded_to_card_cents, type: integer, source: computed, description: "Card refund amount" }
      - { name: refunded_to_credit_cents, type: integer, source: computed, description: "Credit refund amount" }
      - { name: replacement_device_id, type: string, source: system, description: "Replacement device, null unless replacement" }

  - name: Claim
    parent: Program
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "Unique claim identifier" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: device_id, type: string, source: system, description: "Associated device" }
      - { name: customer_id, type: string, source: system, description: "Associated customer" }
      - { name: claim_status, type: enum, source: system, description: "OPEN | APPROVED | INBOUND | RECEIVED | ADVANCE_SHIPPED | COMPLETED | CANCELED | EXPIRED" }
      - { name: claim_type, type: enum, source: input, description: "WARRANTY | CARE_PLAN | RECALL" }
      - { name: claim_resolution, type: enum, source: system, description: "REPLACEMENT | ADVANCE_REPLACEMENT, null until approved" }
      - { name: inspection_outcome, type: enum, source: input, description: "REFURB | SCRAP, null until received" }
      - { name: replacement_device_id, type: string, source: system, description: "Replacement device, null until replacement ships" }

  - name: Adjustment
    parent: Program
    common_fields: true
    fields:
      - { name: adjustment_id, type: string, source: system, description: "Unique adjustment identifier" }
      - { name: customer_id, type: string, source: system, description: "Associated customer" }
      - { name: adjustment_type, type: enum, source: input, description: "GOODWILL_CREDIT | WRITE_OFF | CREDIT_CLAWBACK" }
      - { name: adjustment_status, type: enum, source: system, description: "PENDING | APPLIED | VOIDED" }
      - { name: amount_cents, type: integer, source: input, description: "Adjustment amount" }

  - name: QualityCampaign
    parent: Program
    common_fields: true
    fields:
      - { name: quality_campaign_id, type: string, source: system, description: "Unique campaign identifier" }
      - { name: campaign_type, type: enum, source: input, description: "SHIP_HOLD | RECALL" }
      - { name: campaign_status, type: enum, source: system, description: "OPEN | CONTAINED | RESOLVED | CLOSED" }
      - { name: build_tag_prefix, type: string, source: input, description: "Build tag prefix to match affected lots/devices" }

  - name: Alert
    parent: Program
    common_fields: true
    fields:
      - { name: alert_id, type: string, source: system, description: "Unique alert identifier" }
      - { name: alert_type, type: enum, source: system, description: "CUSTOMER_LOCKED | PAYMENT_DISPUTED | CHARGEBACK_LOST | TRADEIN_REVERSAL | SUPPLY_SHORTFALL | RECALL_ACTIVE | AFTERCARE_OVERDUE" }
      - { name: alert_status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | RESOLVED" }
      - { name: opened_ops_run_index, type: integer, source: system, description: "Ops run index when alert was opened" }
      - { name: customer_id, type: string, source: system, required: false, description: "Associated customer if applicable" }
      - { name: order_id, type: string, source: system, required: false, description: "Associated order if applicable" }
      - { name: device_id, type: string, source: system, required: false, description: "Associated device if applicable" }
      - { name: payment_id, type: string, source: system, required: false, description: "Associated payment if applicable" }
      - { name: tradein_id, type: string, source: system, required: false, description: "Associated trade-in if applicable" }
      - { name: quality_campaign_id, type: string, source: system, required: false, description: "Associated campaign if applicable" }
      - { name: claim_id, type: string, source: system, required: false, description: "Associated claim if applicable" }

# =============================================================================
# Table 3: State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    field: program_posture
    initial_state: PROGRAM_ACTIVE
    terminal_states: [PROGRAM_CLOSED]
    transitions:
      - from: PROGRAM_ACTIVE
        to: PROGRAM_GUARDED
        trigger: "system (at least one OPEN alert, or supply shortfall detected)"
        actor: system
        preconditions:
          - "At least one alert in OPEN status, OR committed units exceed non-quarantined supply"
        side_effects: []

      - from: PROGRAM_ACTIVE
        to: PROGRAM_FROZEN
        trigger: "POST /programs/{program_id}/freeze or system (recall opened, or ops-run thresholds)"
        actor: "Ops or system"
        preconditions:
          - "Manual: Ops calls freeze"
          - "Auto-immediate: RECALL campaign opened"
          - "Auto-ops-run: 3+ payments CHARGEBACK_LOST during run, 5+ LOCKED customers at run close, or any alert OPEN across 2 ops runs"
        side_effects: []

      - from: PROGRAM_GUARDED
        to: PROGRAM_FROZEN
        trigger: "POST /programs/{program_id}/freeze or system"
        actor: "Ops or system"
        preconditions: []
        side_effects: []

      - from: PROGRAM_FROZEN
        to: PROGRAM_ACTIVE
        trigger: "POST /programs/{program_id}/unfreeze"
        actor: Ops
        preconditions:
          - "No recall campaign that isn't CLOSED"
          - "No alerts in OPEN status"
          - "At least one full ops run completed since most recent freeze"
        side_effects: []

      - from: PROGRAM_ACTIVE
        to: PROGRAM_CLOSED
        trigger: "POST /programs/{program_id}/close"
        actor: Ops
        preconditions:
          - "Posture is PROGRAM_ACTIVE"
          - "No OPEN alerts"
          - "No orders in SUBMITTED, ON_HOLD, SHIPPED, or DELIVERED"
          - "No returns in REQUESTED, APPROVED, INBOUND, or RECEIVED"
          - "No claims in OPEN, APPROVED, INBOUND, RECEIVED, or ADVANCE_SHIPPED"
          - "No adjustments in PENDING"
          - "No quality campaign that isn't CLOSED"
        side_effects: []

  - entity: Customer
    field: customer_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: LIMITED
        trigger: "system (balance_due > 0, or aftercare swap pending)"
        actor: system
        preconditions:
          - "Customer has positive balance_due_cents, or aftercare advance replacement deposit placed"
        side_effects: []

      - from: ACTIVE
        to: LOCKED
        trigger: "system (chargeback lost, trade-in reversal with balance due, aftercare overdue, clawback with balance due)"
        actor: system
        preconditions: []
        side_effects:
          - "Opens CUSTOMER_LOCKED alert"
          - "Blocks new orders, device activation, credit usage"

      - from: LIMITED
        to: LOCKED
        trigger: "system (same triggers as ACTIVE → LOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "Opens CUSTOMER_LOCKED alert"

      - from: LOCKED
        to: ACTIVE
        trigger: "POST /customers/{customer_id}/unlock"
        actor: "Support or Ops"
        preconditions:
          - "Balance due is zero"
          - "No blocking conditions remain"
        side_effects: []

      - from: LIMITED
        to: ACTIVE
        trigger: "system (balance_due settles to zero, confirmed at next ops run)"
        actor: system
        preconditions:
          - "balance_due_cents == 0 and no other blocking conditions"
        side_effects: []

  - entity: Session
    field: session_status
    initial_state: ACTIVE
    terminal_states: [ENDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /sessions/{session_id}/end"
        actor: "Customer, Support, or Ops"
        preconditions: []
        side_effects: []

  - entity: BuildLot
    field: build_lot_status
    initial_state: AVAILABLE
    terminal_states: [CONSUMED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system (quality campaign opened with matching build_tag_prefix)"
        actor: system
        preconditions: []
        side_effects:
          - "Units removed from shippable pool"

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "system (SHIP_HOLD campaign closed, lot released)"
        actor: system
        preconditions:
          - "Campaign that caused quarantine is CLOSED"
        side_effects:
          - "Units restored to shippable pool"

      - from: AVAILABLE
        to: CONSUMED
        trigger: "system (all units shipped)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Order
    field: order_status
    initial_state: DRAFT
    terminal_states: [CANCELED, EXPIRED, REFUNDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{order_id}/submit"
        actor: Customer
        preconditions:
          - "Program is PROGRAM_ACTIVE"
          - "Customer is ACTIVE"
          - "Sufficient available-to-commit units"
          - "Credit usage does not exceed credit_balance"
        side_effects:
          - "Commits one unit from available-to-commit"
          - "Deducts applied credit from customer credit_balance"
          - "Creates card payment authorization for remainder"

      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system (authorization released at ops-run, customer locked, trade-in reversal, supply shortfall, ship-hold campaign)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_HOLD
        to: SUBMITTED
        trigger: "POST /orders/{order_id}/refresh_payment"
        actor: Customer
        preconditions:
          - "Program is PROGRAM_ACTIVE (not GUARDED or FROZEN)"
          - "Hold reason is payment refresh"
        side_effects:
          - "Creates new card authorization"

      - from: SUBMITTED
        to: SHIPPED
        trigger: "POST /orders/{order_id}/ship"
        actor: "Support or Ops"
        preconditions:
          - "Order is SUBMITTED (not ON_HOLD)"
          - "Build lot is AVAILABLE"
        side_effects:
          - "Captures authorized payment"
          - "Creates device record with serial number and build tag"
          - "Creates care plan if included"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{order_id}/mark_delivered"
        actor: "Support or Ops"
        preconditions: []
        side_effects: []

      - from: [DRAFT, SUBMITTED, ON_HOLD]
        to: CANCELED
        trigger: "POST /orders/{order_id}/cancel"
        actor: "Customer, Support, or Ops"
        preconditions:
          - "Order not shipped or delivered"
        side_effects:
          - "Releases committed unit to available-to-commit"
          - "Voids authorized payment"
          - "Returns applied credit (reduces balance_due first)"
          - "Voids care plan if present"

      - from: ON_HOLD
        to: EXPIRED
        trigger: "system (ops-run checkpoint: still on hold for payment refresh after second ops run)"
        actor: system
        preconditions: []
        side_effects:
          - "Releases committed unit"
          - "Unwinds credit usage"

      - from: DELIVERED
        to: REFUNDED
        trigger: "system (return completed as refund)"
        actor: system
        preconditions: []
        side_effects:
          - "Refunds captured payment"
          - "Returns applied credit (reduces balance_due first)"
          - "Cancels care plan"

  - entity: Payment
    field: payment_status
    initial_state: AUTHORIZED
    terminal_states: [VOIDED, REFUNDED, CHARGEBACK_LOST]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "system (order ships)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AUTHORIZED
        to: VOIDED
        trigger: "system (order canceled, or authorization released at ops-run checkpoint)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CAPTURED
        to: REFUNDED
        trigger: "system (return completed as refund)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [AUTHORIZED, CAPTURED]
        to: DISPUTED
        trigger: "POST /payments/{payment_id}/dispute"
        actor: "Support or Ops"
        preconditions:
          - "Payment is AUTHORIZED or CAPTURED"
        side_effects:
          - "Opens PAYMENT_DISPUTED alert"

      - from: DISPUTED
        to: CHARGEBACK_LOST
        trigger: "POST /payments/{payment_id}/resolve_dispute with outcome=CHARGEBACK_LOST"
        actor: "Support or Ops"
        preconditions: []
        side_effects:
          - "Customer becomes LOCKED"
          - "Balance due increased"
          - "Opens CHARGEBACK_LOST alert"

      - from: DISPUTED
        to: REFUNDED
        trigger: "POST /payments/{payment_id}/resolve_dispute with outcome=REFUNDED"
        actor: "Support or Ops"
        preconditions: []
        side_effects:
          - "Does NOT change order_status (order refunds only via returns)"

  - entity: Device
    field: device_status
    initial_state: SHIPPED
    terminal_states: [RETURNED, SCRAPPED]
    transitions:
      - from: PROVISIONED
        to: SHIPPED
        trigger: "system (replacement device ships)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SHIPPED
        to: ACTIVE
        trigger: "POST /devices/{device_id}/activate"
        actor: Customer
        preconditions:
          - "Order is DELIVERED"
          - "Customer is not LOCKED"
          - "Device is not QUARANTINED"
          - "Program is not FROZEN (exception: recall remediation activation allowed)"
        side_effects:
          - "Warranty clock begins (12 ops runs)"
          - "Care plan becomes ACTIVE if present"

      - from: [SHIPPED, ACTIVE]
        to: QUARANTINED
        trigger: "system (RECALL campaign escalated, matching build_tag)"
        actor: system
        preconditions: []
        side_effects:
          - "Activation blocked"
          - "Care plan PAUSED if was ACTIVE"

      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /devices/{device_id}/remediate (was previously ACTIVE)"
        actor: Ops
        preconditions:
          - "Device was ACTIVE before quarantine"
        side_effects:
          - "Care plan resumes to ACTIVE if was PAUSED due to quarantine"

      - from: QUARANTINED
        to: SHIPPED
        trigger: "POST /devices/{device_id}/remediate (was previously SHIPPED)"
        actor: Ops
        preconditions:
          - "Device was SHIPPED before quarantine"
        side_effects: []

      - from: [ACTIVE, SHIPPED, QUARANTINED]
        to: RETURNED
        trigger: "system (return or claim completed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [ACTIVE, SHIPPED, QUARANTINED]
        to: SCRAPPED
        trigger: "system (return or claim completed with inspection_outcome=SCRAP)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CarePlan
    field: care_plan_status
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELED, VOIDED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "system (device activated)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: PAUSED
        trigger: "system (device quarantined under recall)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: ACTIVE
        trigger: "system (device remediated or replacement device activated)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELED
        trigger: "system (refund return completed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING_ACTIVATION
        to: VOIDED
        trigger: "system (order canceled before activation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TradeIn
    field: tradein_status
    initial_state: DRAFT
    terminal_states: [CREDITED, REVERSED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tradeins/{tradein_id}/submit"
        actor: Customer
        preconditions: []
        side_effects:
          - "Provisional credit issued if eligible (program ACTIVE, customer ACTIVE, zero balance_due, quoted <= $300, no open alerts for customer)"

      - from: SUBMITTED
        to: INBOUND
        trigger: "POST /tradeins/{tradein_id}/mark_inbound"
        actor: "Support or Ops"
        preconditions: []
        side_effects: []

      - from: INBOUND
        to: APPRAISED
        trigger: "POST /tradeins/{tradein_id}/appraise (accepted=true or false)"
        actor: "Support or Ops"
        preconditions: []
        side_effects:
          - "If accepted: final credit set; delta between provisional and final adjusts credit/balance_due"
          - "If rejected: final_credit=0; provisional credit reversed; balance_due created; customer LOCKED"

      - from: APPRAISED
        to: CREDITED
        trigger: "system (credit finalized after accepted appraisal)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CREDITED
        to: REVERSED
        trigger: "POST /tradeins/{tradein_id}/reverse_credit"
        actor: "Support or Ops"
        preconditions: []
        side_effects:
          - "Credit removed from balance (never below zero)"
          - "Remainder becomes balance_due"
          - "Customer LOCKED if balance_due > 0"
          - "Alert opened"
          - "Unshipped orders go ON_HOLD"

      - from: [DRAFT, SUBMITTED, INBOUND]
        to: EXPIRED
        trigger: "system (ops-run checkpoint)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Return
    field: return_status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{return_id}/approve"
        actor: Support
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: INBOUND
        trigger: "POST /returns/{return_id}/mark_inbound"
        actor: "Support or Ops"
        preconditions: []
        side_effects: []

      - from: INBOUND
        to: RECEIVED
        trigger: "POST /returns/{return_id}/receive"
        actor: "Support or Ops"
        preconditions: []
        side_effects:
          - "Records inspection_outcome (RESTOCK, REFURB, or SCRAP)"
          - "RESTOCK increases available-to-commit (only for non-activated, non-quarantined devices)"

      - from: RECEIVED
        to: COMPLETED
        trigger: "POST /returns/{return_id}/complete"
        actor: Support
        preconditions:
          - "Resolution is REFUND or REPLACEMENT"
          - "Replacement requires: inspection_outcome not RESTOCK, program not frozen (except for recall), customer not locked, replacement stock available"
        side_effects:
          - "Refund: order → REFUNDED, refund payment, return credit, cancel care plan, device → RETURNED/SCRAPPED"
          - "Replacement: new device created, order stays DELIVERED, care plan follows replacement"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /returns/{return_id}/complete with rejection"
        actor: Support
        preconditions: []
        side_effects: []

  - entity: Claim
    field: claim_status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELED, EXPIRED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /claims/{claim_id}/approve"
        actor: Support
        preconditions:
          - "WARRANTY: device is ACTIVE, within 12 ops runs of activation"
          - "CARE_PLAN: care plan is ACTIVE for that order"
          - "RECALL: device is QUARANTINED under a recall campaign"
        side_effects:
          - "Resolution set to REPLACEMENT or ADVANCE_REPLACEMENT"
          - "ADVANCE_REPLACEMENT: $150 deposit added to customer balance_due, customer → LIMITED, unshipped orders → ON_HOLD"

      - from: OPEN
        to: CANCELED
        trigger: "POST /claims/{claim_id}/cancel"
        actor: Support
        preconditions:
          - "No replacement device has shipped"
        side_effects: []

      - from: APPROVED
        to: ADVANCE_SHIPPED
        trigger: "POST /claims/{claim_id}/ship_advance_replacement"
        actor: "Support or Ops"
        preconditions:
          - "Resolution is ADVANCE_REPLACEMENT"
        side_effects:
          - "New device created (PROVISIONED → SHIPPED)"
          - "Consumes from replacement reserve (or sale inventory if depleted)"

      - from: APPROVED
        to: INBOUND
        trigger: "POST /claims/{claim_id}/mark_inbound"
        actor: "Support or Ops"
        preconditions: []
        side_effects: []

      - from: [APPROVED, INBOUND]
        to: EXPIRED
        trigger: "system (ops-run checkpoint: approved but not inbound by next run, or inbound but not received by next run)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Advance replacements don't expire; they escalate overdue instead"

      - from: ADVANCE_SHIPPED
        to: COMPLETED
        trigger: "system (old device received)"
        actor: system
        preconditions: []
        side_effects:
          - "Deposit released (reduces balance_due first; excess becomes credit)"

      - from: INBOUND
        to: RECEIVED
        trigger: "POST /claims/{claim_id}/receive"
        actor: "Support or Ops"
        preconditions: []
        side_effects:
          - "Records inspection_outcome (REFURB or SCRAP)"

      - from: RECEIVED
        to: COMPLETED
        trigger: "POST /claims/{claim_id}/complete"
        actor: Support
        preconditions: []
        side_effects:
          - "Replacement device created and shipped"
          - "Original device → RETURNED/SCRAPPED"
          - "Care plan follows replacement device"
          - "Warranty clock resets on new device activation"

  - entity: Adjustment
    field: adjustment_status
    initial_state: PENDING
    terminal_states: [APPLIED, VOIDED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /adjustments/{adjustment_id}/apply"
        actor: "Support or Ops"
        preconditions:
          - "GOODWILL_CREDIT: program ACTIVE (not guarded), customer ACTIVE, no balance_due, no open alerts for customer"
          - "WRITE_OFF: allowed even while frozen"
          - "CREDIT_CLAWBACK: no special restrictions"
        side_effects:
          - "GOODWILL_CREDIT: credit_balance increases"
          - "WRITE_OFF: balance_due decreases"
          - "CREDIT_CLAWBACK: credit removed, remainder → balance_due; if balance_due created → customer LOCKED, alert opened, unshipped orders → ON_HOLD"

      - from: APPLIED
        to: VOIDED
        trigger: "POST /adjustments/{adjustment_id}/void"
        actor: "Support or Ops"
        preconditions:
          - "Must be within the same ops-run window (next ops run not yet closed)"
        side_effects:
          - "Reverses the adjustment's effect"
          - "Voiding credit-adding adjustment: credit removed; if already spent, shortfall → balance_due → possible lock and alert"

  - entity: QualityCampaign
    field: campaign_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CONTAINED
        trigger: "system or Ops"
        actor: Ops
        preconditions: []
        side_effects: []

      - from: OPEN
        to: OPEN
        trigger: "POST /quality_campaigns/{id}/escalate (SHIP_HOLD → RECALL)"
        actor: Ops
        preconditions:
          - "Campaign type is SHIP_HOLD"
        side_effects:
          - "Campaign type changes to RECALL"
          - "All matching devices → QUARANTINED"
          - "Activation blocked for affected devices"
          - "Care plans for affected devices → PAUSED"
          - "Program → PROGRAM_FROZEN immediately"

      - from: CONTAINED
        to: RESOLVED
        trigger: "POST /quality_campaigns/{id}/resolve"
        actor: Ops
        preconditions:
          - "All affected devices remediated"
          - "All affected lots consumed, quarantined, or released"
        side_effects: []

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /quality_campaigns/{id}/close"
        actor: Ops
        preconditions: []
        side_effects:
          - "SHIP_HOLD: quarantined lots released back to AVAILABLE"
          - "Does NOT auto-resolve associated alerts"

  - entity: Alert
    field: alert_status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /alerts/{alert_id}/acknowledge"
        actor: "Support or Ops"
        preconditions: []
        side_effects: []

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /alerts/{alert_id}/resolve"
        actor: "Support or Ops"
        preconditions:
          - "Underlying situation must be clean (e.g., balance_due settled, campaign closed, claim completed, etc.)"
        side_effects: []

# =============================================================================
# Table 4: Calculation Rules Table
# =============================================================================
calculations:
  - name: available_to_commit_units
    trigger: "supply changes, commitments change, quarantines, replacements"
    algorithm: aggregation
    formula: |
      available_to_commit = sum(non-quarantined lot units) - committed_units - replacement_reserve
      replacement_reserve = 5 (set at program creation)
      committed_units = count of orders in SUBMITTED or ON_HOLD status
    note: "Never bounces unexpectedly; changes only from supply, commitment, or quality decisions"

  - name: credit_balance_update
    trigger: "trade-in credit, order credit usage, refund, reversal, adjustment, settlement"
    algorithm: aggregation
    formula: |
      Trade-in provisional credit: credit_balance += quoted_credit_cents (if eligible)
      Order submit: credit_balance -= paid_by_credit_cents
      Order cancel/expire: credit_balance += paid_by_credit_cents (reduces balance_due first)
      Refund: credit returned (reduces balance_due first)
      Reversal/clawback: credit_balance -= amount (never below 0); remainder → balance_due
      Goodwill credit: credit_balance += amount
      Settlement: balance_due -= amount
    note: "Credit never goes negative. If reversal exceeds credit, remainder becomes balance_due"

  - name: provisional_credit_eligibility
    trigger: "trade-in submission"
    algorithm: threshold
    formula: |
      Eligible when ALL of:
        program_posture == PROGRAM_ACTIVE
        customer_status == ACTIVE
        balance_due_cents == 0
        quoted_credit_cents <= 30000 ($300)
        no OPEN alert tied to that customer

  - name: warranty_expiry
    trigger: "ops run"
    algorithm: clock
    formula: |
      Warranty starts at device activation ops_run_index.
      Warranty is valid through activation_ops_run + 12.
      Warranty expired once ops_run_index > activation_ops_run + 12.
    constants:
      WARRANTY_DURATION: 12  # ops runs

  - name: payment_staleness
    trigger: "ops run"
    algorithm: checkpoint
    formula: |
      If order is SUBMITTED and authorization was created before current ops run:
        void authorization, order → ON_HOLD (payment refresh)
      If order is ON_HOLD for payment refresh and still unresolved at next ops run:
        order → EXPIRED, release unit, unwind credit

  - name: claim_staleness
    trigger: "ops run"
    algorithm: checkpoint
    formula: |
      APPROVED claim not marked inbound by next ops run → EXPIRED
      INBOUND claim not received by next ops run → EXPIRED
      ADVANCE_SHIPPED: if old device not received by 2nd ops run after ship → overdue
        customer → LOCKED, alert opened

  - name: advance_replacement_deposit
    trigger: "claim approval with ADVANCE_REPLACEMENT"
    algorithm: fixed
    formula: |
      $150 (15000 cents) deposit added to customer balance_due
      Customer → LIMITED
      Unshipped orders → ON_HOLD
      On completion: deposit released (reduces balance_due first; excess → credit)
    constants:
      DEPOSIT_CENTS: 15000

  - name: posture_escalation
    trigger: "ops run close"
    algorithm: threshold
    formula: |
      PROGRAM_FROZEN if:
        3+ payments entered CHARGEBACK_LOST during this run
        5+ customers are LOCKED at run close
        any alert stayed OPEN across 2 ops runs
      PROGRAM_GUARDED if:
        any OPEN alert exists
        supply shortfall detected

  - name: replacement_inventory
    trigger: "replacement action (return or claim)"
    algorithm: reserve_draw
    formula: |
      Replacement draws from 5-unit reserve first.
      When reserve depleted, draws from sale inventory (reduces available_to_commit).
      If no inventory at all, replacement fails.

  - name: refund_credit_return
    trigger: "return completed as refund, or order canceled/expired"
    algorithm: aggregation
    formula: |
      Credit returned to customer:
        if balance_due > 0: reduce balance_due first
        remainder → credit_balance
      Card payment refunded separately.

# =============================================================================
# Table 5: Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "X_Session_Id must identify an ACTIVE session for the actor (except POST /programs and POST /sessions)"
    error_id: ERR_SESSION_NOT_ACTIVE
    http_status: 400
    applies_to: "mutating endpoints by Customer, Support, or Ops"

  - priority: 3
    category: auth
    check: "Actor type must be allowed to perform this operation"
    error_id: ERR_FORBIDDEN_FOR_ACTOR
    http_status: 403
    applies_to: all endpoints

  - priority: 4
    category: existence
    check: "Resource IDs in path must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: state
    check: "Invalid lifecycle transition for the resource's current state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 400
    applies_to: state transition endpoints

  - priority: 6
    category: posture
    check: "Program posture blocks the requested action (frozen > guarded)"
    error_id: "ERR_PROGRAM_FROZEN / ERR_PROGRAM_CLOSED / ERR_PROGRAM_REVIEW_REQUIRED"
    http_status: 400
    applies_to: "value-extending actions"
    note: "Device quarantine (ERR_DEVICE_QUARANTINED) takes precedence over posture for activation"

  - priority: 7
    category: customer_standing
    check: "Customer status blocks the requested action"
    error_id: "ERR_CUSTOMER_LOCKED / ERR_CUSTOMER_CLOSED / ERR_CUSTOMER_NOT_ELIGIBLE"
    http_status: 400
    applies_to: "customer-scoped value-extending actions"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 6: API Endpoint Table (48 endpoints)
# =============================================================================
endpoints:
  # --- Programs ---
  - method: POST
    path: "/programs"
    description: "Create a new program"
    roles: [Ops]
    code: 201
    input: [display_name, unit_price_cents, care_plan_price_cents]
    output: Program
    side_effects: ["posture=PROGRAM_ACTIVE, ops_run_index=0, available_to_commit_units=0"]

  - method: GET
    path: "/programs/{program_id}"
    description: "Get program details"
    roles: [Any]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/run_ops"
    description: "Run ops checkpoint"
    roles: [Ops]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Increments ops_run_index"
      - "Applies all checkpoint rules (payment staleness, hold expiry, warranty aging, claim staleness, adjustment finalization, posture escalation)"

  - method: POST
    path: "/programs/{program_id}/freeze"
    description: "Manually freeze program"
    roles: [Ops]
    code: 200
    input: [reason]
    output: Program
    side_effects: ["posture → PROGRAM_FROZEN"]

  - method: POST
    path: "/programs/{program_id}/unfreeze"
    description: "Unfreeze program"
    roles: [Ops]
    code: 200
    input: []
    output: Program
    side_effects: ["posture → PROGRAM_ACTIVE (if eligible)"]

  - method: POST
    path: "/programs/{program_id}/close"
    description: "Close program (terminal)"
    roles: [Ops]
    code: 200
    input: []
    output: Program
    side_effects: ["posture → PROGRAM_CLOSED"]

  # --- Sessions ---
  - method: POST
    path: "/programs/{program_id}/sessions"
    description: "Create a session"
    roles: [Any]
    code: 201
    input: [actor_id, actor_type]
    output: Session
    side_effects: []

  - method: GET
    path: "/programs/{program_id}/sessions/{session_id}"
    description: "Get session details"
    roles: [Any]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/sessions/{session_id}/end"
    description: "End a session"
    roles: [Any]
    code: 200
    input: []
    output: Session
    side_effects: ["session_status → ENDED"]

  # --- Customers ---
  - method: POST
    path: "/programs/{program_id}/customers"
    description: "Create a customer"
    roles: [Any]
    code: 201
    input: [display_name]
    output: Customer
    side_effects: ["customer_status=ACTIVE, credit_balance_cents=0, balance_due_cents=0"]

  - method: GET
    path: "/programs/{program_id}/customers/{customer_id}"
    description: "Get customer details"
    roles: [Any]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/customers/{customer_id}/lock"
    description: "Lock a customer"
    roles: [Support, Ops]
    code: 200
    input: [reason]
    output: Customer
    side_effects: ["customer_status → LOCKED"]

  - method: POST
    path: "/programs/{program_id}/customers/{customer_id}/unlock"
    description: "Unlock a customer"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Customer
    side_effects: ["customer_status → ACTIVE"]

  - method: POST
    path: "/programs/{program_id}/customers/{customer_id}/settle_balance_due"
    description: "Settle customer balance due"
    roles: [Support, Ops]
    code: 200
    input: [amount_cents]
    output: Customer
    side_effects: ["balance_due_cents decreases"]

  # --- Adjustments ---
  - method: POST
    path: "/programs/{program_id}/customers/{customer_id}/adjustments"
    description: "Create an adjustment"
    roles: [Support, Ops]
    code: 201
    input: [adjustment_type, amount_cents]
    output: Adjustment
    side_effects: ["adjustment_status=PENDING"]

  - method: GET
    path: "/programs/{program_id}/adjustments/{adjustment_id}"
    description: "Get adjustment details"
    roles: [Any]
    code: 200
    input: []
    output: Adjustment
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/adjustments/{adjustment_id}/apply"
    description: "Apply an adjustment"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["adjustment_status → APPLIED, balance updates applied"]

  - method: POST
    path: "/programs/{program_id}/adjustments/{adjustment_id}/void"
    description: "Void an adjustment"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["adjustment_status → VOIDED, balance updates reversed"]

  # --- Build Lots ---
  - method: POST
    path: "/programs/{program_id}/build_lots"
    description: "Create a build lot"
    roles: [Ops]
    code: 201
    input: [build_tag, units]
    output: BuildLot
    side_effects: ["build_lot_status=AVAILABLE"]

  - method: GET
    path: "/programs/{program_id}/build_lots/{build_lot_id}"
    description: "Get build lot details"
    roles: [Any]
    code: 200
    input: []
    output: BuildLot
    side_effects: []

  # --- Orders ---
  - method: POST
    path: "/programs/{program_id}/customers/{customer_id}/orders"
    description: "Create a draft order"
    roles: [Customer]
    code: 201
    input: [model_code, "use_credit_cents?", "tradein_id?"]
    output: Order
    side_effects: ["order_status=DRAFT"]

  - method: GET
    path: "/programs/{program_id}/orders/{order_id}"
    description: "Get order details"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/programs/{program_id}/orders"
    description: "List orders (filterable by customer_id, order_status)"
    roles: [Any]
    code: 200
    input: ["customer_id?", "order_status?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/orders/{order_id}/submit"
    description: "Submit order (commit unit, authorize payment)"
    roles: [Customer]
    code: 200
    input: [include_care_plan]
    output: Order
    side_effects:
      - "order_status → SUBMITTED"
      - "Commits one unit"
      - "Deducts credit, creates payment authorization"
      - "Creates care plan if include_care_plan=true"

  - method: POST
    path: "/programs/{program_id}/orders/{order_id}/refresh_payment"
    description: "Refresh payment on held order"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["Creates new authorization, order → SUBMITTED"]

  - method: POST
    path: "/programs/{program_id}/orders/{order_id}/cancel"
    description: "Cancel an order"
    roles: [Customer, Support, Ops]
    code: 200
    input: [reason]
    output: Order
    side_effects: ["order_status → CANCELED, unit released, payment voided, credit returned"]

  - method: POST
    path: "/programs/{program_id}/orders/{order_id}/ship"
    description: "Ship an order"
    roles: [Support, Ops]
    code: 200
    input: [build_lot_id, serial_number, build_tag]
    output: Order
    side_effects: ["order_status → SHIPPED, payment captured, device created"]

  - method: POST
    path: "/programs/{program_id}/orders/{order_id}/mark_delivered"
    description: "Mark order delivered"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Order
    side_effects: ["order_status → DELIVERED"]

  # --- Payments ---
  - method: GET
    path: "/programs/{program_id}/payments/{payment_id}"
    description: "Get payment details"
    roles: [Any]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/payments/{payment_id}/dispute"
    description: "Dispute a payment"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Payment
    side_effects: ["payment_status → DISPUTED, opens PAYMENT_DISPUTED alert"]

  - method: POST
    path: "/programs/{program_id}/payments/{payment_id}/resolve_dispute"
    description: "Resolve a payment dispute"
    roles: [Support, Ops]
    code: 200
    input: [outcome]
    output: Payment
    side_effects: ["payment_status → CHARGEBACK_LOST or REFUNDED based on outcome"]

  # --- Devices ---
  - method: GET
    path: "/programs/{program_id}/devices/{device_id}"
    description: "Get device details"
    roles: [Any]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/devices/{device_id}/activate"
    description: "Activate a device (customer-only)"
    roles: [Customer]
    code: 200
    input: []
    output: Device
    side_effects: ["device_status → ACTIVE, warranty starts, care plan activates"]

  - method: POST
    path: "/programs/{program_id}/devices/{device_id}/remediate"
    description: "Remediate a quarantined device"
    roles: [Ops]
    code: 200
    input: [note]
    output: Device
    side_effects: ["device_status restored to pre-quarantine state, care plan resumes if applicable"]

  # --- Claims ---
  - method: POST
    path: "/programs/{program_id}/devices/{device_id}/claims"
    description: "Open a claim on a device"
    roles: [Support]
    code: 201
    input: [claim_type]
    output: Claim
    side_effects: ["claim_status=OPEN"]

  - method: GET
    path: "/programs/{program_id}/claims/{claim_id}"
    description: "Get claim details"
    roles: [Any]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/claims/{claim_id}/approve"
    description: "Approve a claim"
    roles: [Support]
    code: 200
    input: [resolution]
    output: Claim
    side_effects: ["claim_status → APPROVED, deposit placed for ADVANCE_REPLACEMENT"]

  - method: POST
    path: "/programs/{program_id}/claims/{claim_id}/cancel"
    description: "Cancel a claim"
    roles: [Support]
    code: 200
    input: [reason]
    output: Claim
    side_effects: ["claim_status → CANCELED"]

  - method: POST
    path: "/programs/{program_id}/claims/{claim_id}/mark_inbound"
    description: "Mark claim device inbound"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_status → INBOUND"]

  - method: POST
    path: "/programs/{program_id}/claims/{claim_id}/receive"
    description: "Receive claim device"
    roles: [Support, Ops]
    code: 200
    input: [inspection_outcome]
    output: Claim
    side_effects: ["claim_status → RECEIVED"]

  - method: POST
    path: "/programs/{program_id}/claims/{claim_id}/ship_advance_replacement"
    description: "Ship advance replacement for recall claim"
    roles: [Support, Ops]
    code: 200
    input: [replacement_build_lot_id, replacement_serial_number, replacement_build_tag]
    output: Claim
    side_effects: ["claim_status → ADVANCE_SHIPPED, new device created"]

  - method: POST
    path: "/programs/{program_id}/claims/{claim_id}/complete"
    description: "Complete a claim with replacement"
    roles: [Support]
    code: 200
    input: ["replacement_build_lot_id?", "replacement_serial_number?", "replacement_build_tag?"]
    output: Claim
    side_effects: ["claim_status → COMPLETED, replacement device created, original device updated"]

  # --- Care Plans ---
  - method: GET
    path: "/programs/{program_id}/care_plans/{care_plan_id}"
    description: "Get care plan details"
    roles: [Any]
    code: 200
    input: []
    output: CarePlan
    side_effects: []

  # --- Trade-ins ---
  - method: POST
    path: "/programs/{program_id}/customers/{customer_id}/tradeins"
    description: "Create a trade-in"
    roles: [Customer]
    code: 201
    input: [quoted_credit_cents]
    output: TradeIn
    side_effects: ["tradein_status=DRAFT"]

  - method: GET
    path: "/programs/{program_id}/tradeins/{tradein_id}"
    description: "Get trade-in details"
    roles: [Any]
    code: 200
    input: []
    output: TradeIn
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/tradeins/{tradein_id}/submit"
    description: "Submit a trade-in"
    roles: [Customer]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["tradein_status → SUBMITTED, provisional credit if eligible"]

  - method: POST
    path: "/programs/{program_id}/tradeins/{tradein_id}/mark_inbound"
    description: "Mark trade-in inbound"
    roles: [Support, Ops]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["tradein_status → INBOUND"]

  - method: POST
    path: "/programs/{program_id}/tradeins/{tradein_id}/appraise"
    description: "Appraise a trade-in"
    roles: [Support, Ops]
    code: 200
    input: [accepted, final_credit_cents]
    output: TradeIn
    side_effects: ["tradein_status → APPRAISED, credit/balance_due adjusted"]

  - method: POST
    path: "/programs/{program_id}/tradeins/{tradein_id}/reverse_credit"
    description: "Reverse trade-in credit"
    roles: [Support, Ops]
    code: 200
    input: [reason]
    output: TradeIn
    side_effects: ["tradein_status → REVERSED, credit reversed, balance_due created, customer locked"]

  # --- Returns ---
  - method: POST
    path: "/programs/{program_id}/orders/{order_id}/returns"
    description: "Request a return"
    roles: [Customer, Support]
    code: 201
    input: [resolution_preference]
    output: Return
    side_effects: ["return_status=REQUESTED"]

  - method: GET
    path: "/programs/{program_id}/returns/{return_id}"
    description: "Get return details"
    roles: [Any]
    code: 200
    input: []
    output: Return
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/returns/{return_id}/approve"
    description: "Approve a return"
    roles: [Support]
    code: 200
    input: []
    output: Return
    side_effects: ["return_status → APPROVED"]

  - method: POST
    path: "/programs/{program_id}/returns/{return_id}/mark_inbound"
    description: "Mark return inbound"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Return
    side_effects: ["return_status → INBOUND"]

  - method: POST
    path: "/programs/{program_id}/returns/{return_id}/receive"
    description: "Receive return with inspection"
    roles: [Support, Ops]
    code: 200
    input: [inspection_outcome]
    output: Return
    side_effects: ["return_status → RECEIVED, RESTOCK increases available-to-commit"]

  - method: POST
    path: "/programs/{program_id}/returns/{return_id}/complete"
    description: "Complete return as refund or replacement"
    roles: [Support]
    code: 200
    input: [resolution, "replacement_build_lot_id?", "replacement_serial_number?", "replacement_build_tag?"]
    output: Return
    side_effects: ["return_status → COMPLETED, order/payment/device/care-plan updated"]

  # --- Quality Campaigns ---
  - method: POST
    path: "/programs/{program_id}/quality_campaigns"
    description: "Create a quality campaign"
    roles: [Ops]
    code: 201
    input: [campaign_type, build_tag_prefix]
    output: QualityCampaign
    side_effects:
      - "campaign_status=OPEN"
      - "Matching build lots → QUARANTINED"
      - "RECALL: matching devices → QUARANTINED, program → PROGRAM_FROZEN"

  - method: GET
    path: "/programs/{program_id}/quality_campaigns/{quality_campaign_id}"
    description: "Get quality campaign details"
    roles: [Any]
    code: 200
    input: []
    output: QualityCampaign
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/quality_campaigns/{quality_campaign_id}/escalate"
    description: "Escalate SHIP_HOLD to RECALL"
    roles: [Ops]
    code: 200
    input: []
    output: QualityCampaign
    side_effects: ["campaign_type → RECALL, devices quarantined, program frozen"]

  - method: POST
    path: "/programs/{program_id}/quality_campaigns/{quality_campaign_id}/resolve"
    description: "Resolve a campaign"
    roles: [Ops]
    code: 200
    input: []
    output: QualityCampaign
    side_effects: ["campaign_status → RESOLVED"]

  - method: POST
    path: "/programs/{program_id}/quality_campaigns/{quality_campaign_id}/close"
    description: "Close a campaign"
    roles: [Ops]
    code: 200
    input: []
    output: QualityCampaign
    side_effects: ["campaign_status → CLOSED, SHIP_HOLD lots released"]

  # --- Alerts ---
  - method: GET
    path: "/programs/{program_id}/alerts"
    description: "List alerts (filterable)"
    roles: [Any]
    code: 200
    input: ["alert_status?", "alert_type?", "customer_id?", "payment_id?", "tradein_id?", "claim_id?"]
    output: "Alert[]"
    side_effects: []

  - method: GET
    path: "/programs/{program_id}/alerts/{alert_id}"
    description: "Get alert details"
    roles: [Any]
    code: 200
    input: []
    output: Alert
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/alerts/{alert_id}/acknowledge"
    description: "Acknowledge an alert"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Alert
    side_effects: ["alert_status → ACKNOWLEDGED"]

  - method: POST
    path: "/programs/{program_id}/alerts/{alert_id}/resolve"
    description: "Resolve an alert"
    roles: [Support, Ops]
    code: 200
    input: []
    output: Alert
    side_effects: ["alert_status → RESOLVED"]

# =============================================================================
# Table 7: Error Code Catalogue (30 error codes)
# =============================================================================
errors:
  # --- Request Validation ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource with given ID does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request body, missing required fields, invalid parameters"

  - id: ERR_INVALID_STATE_TRANSITION
    http: 400
    condition: "Requested state transition is not valid for the resource's current state"

  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_SESSION_NOT_ACTIVE
    http: 400
    condition: "X_Session_Id does not identify an ACTIVE session for the actor"

  - id: ERR_FORBIDDEN_FOR_ACTOR
    http: 403
    condition: "Actor type cannot perform this operation (e.g., Support/Ops cannot activate devices)"

  # --- Program Posture ---
  - id: ERR_PROGRAM_FROZEN
    http: 400
    condition: "Program is FROZEN; action blocked"

  - id: ERR_PROGRAM_CLOSED
    http: 400
    condition: "Program is CLOSED; nothing mutates"

  - id: ERR_PROGRAM_REVIEW_REQUIRED
    http: 400
    condition: "Program is GUARDED; expansion actions blocked until cleanup"

  - id: ERR_PROGRAM_NOT_ELIGIBLE_TO_UNFREEZE
    http: 400
    condition: "Unfreeze preconditions not met (open recall, open alerts, or no full ops run since freeze)"

  - id: ERR_PROGRAM_NOT_ELIGIBLE_TO_CLOSE
    http: 400
    condition: "Close preconditions not met (active orders, returns, claims, adjustments, or campaigns exist)"

  # --- Customer Standing ---
  - id: ERR_CUSTOMER_LOCKED
    http: 400
    condition: "Customer is LOCKED; value-extending actions blocked"

  - id: ERR_CUSTOMER_CLOSED
    http: 400
    condition: "Customer is CLOSED for this program"

  - id: ERR_CUSTOMER_NOT_ELIGIBLE
    http: 400
    condition: "Customer does not meet eligibility requirements for this action"

  # --- Inventory ---
  - id: ERR_OUT_OF_STOCK
    http: 400
    condition: "No available-to-commit units for new orders or replacements"

  - id: ERR_BUILD_LOT_QUARANTINED
    http: 400
    condition: "Build lot is quarantined; cannot ship from it"

  # --- Orders ---
  - id: ERR_ORDER_ON_HOLD
    http: 400
    condition: "Order is ON_HOLD; shipping blocked"

  - id: ERR_ORDER_PAYMENT_REQUIRED
    http: 400
    condition: "Order requires payment refresh before proceeding"

  - id: ERR_ORDER_NOT_CANCELABLE
    http: 400
    condition: "Order is SHIPPED or DELIVERED; cancel not allowed (use returns)"

  # --- Payments ---
  - id: ERR_PAYMENT_NOT_REFUNDABLE
    http: 400
    condition: "Payment is not in a refundable state"

  - id: ERR_PAYMENT_NOT_DISPUTABLE
    http: 400
    condition: "Payment is not in AUTHORIZED or CAPTURED state; dispute not allowed"

  # --- Devices ---
  - id: ERR_DEVICE_NOT_ACTIVATABLE
    http: 400
    condition: "Device cannot be activated (order not delivered, or other precondition not met)"

  - id: ERR_DEVICE_QUARANTINED
    http: 400
    condition: "Device is quarantined; activation blocked (takes precedence over posture)"

  # --- Care Plans ---
  - id: ERR_CARE_PLAN_NOT_ELIGIBLE
    http: 400
    condition: "Care plan is not in a state that allows this operation"

  # --- Trade-ins ---
  - id: ERR_TRADEIN_NOT_ELIGIBLE
    http: 400
    condition: "Trade-in is not eligible for this operation in its current state"

  - id: ERR_TRADEIN_REQUIRES_APPRAISAL
    http: 400
    condition: "Trade-in must be appraised before this operation"

  # --- Returns ---
  - id: ERR_RETURN_NOT_ELIGIBLE
    http: 400
    condition: "Return is not eligible (activated device without recall, duplicate return, etc.)"

  - id: ERR_RETURN_NOT_RESOLVABLE
    http: 400
    condition: "Return cannot be resolved in its current state"

  # --- Alerts ---
  - id: ERR_ALERT_NOT_RESOLVABLE
    http: 400
    condition: "Alert underlying situation is not clean; cannot resolve"

  # --- Claims ---
  - id: ERR_CLAIM_NOT_ELIGIBLE
    http: 400
    condition: "Claim is not eligible (non-terminal claim exists, or concurrent return active)"

  - id: ERR_CLAIM_NOT_RESOLVABLE
    http: 400
    condition: "Claim cannot be resolved in its current state"

  # --- Adjustments ---
  - id: ERR_ADJUSTMENT_NOT_ELIGIBLE
    http: 400
    condition: "Adjustment type not allowed under current conditions"

  - id: ERR_ADJUSTMENT_NOT_VOIDABLE
    http: 400
    condition: "Adjustment void window has passed (next ops run already closed)"

  # --- Idempotency ---
  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 400
    condition: "Idempotency key reused with different payload"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End user; places orders, activates devices, creates trade-ins"
    exclusive_operations:
      - "POST .../orders — Create draft order"
      - "POST .../orders/{id}/submit — Submit order"
      - "POST .../orders/{id}/refresh_payment — Refresh payment"
      - "POST .../devices/{id}/activate — Activate device"
      - "POST .../tradeins — Create trade-in"
      - "POST .../tradeins/{id}/submit — Submit trade-in"

  - name: Support
    description: "Support team; manages returns, claims, adjustments, trade-in lifecycle"
    exclusive_operations:
      - "POST .../returns/{id}/approve — Approve return"
      - "POST .../returns/{id}/complete — Complete return"
      - "POST .../claims — Open claim"
      - "POST .../claims/{id}/approve — Approve claim"
      - "POST .../claims/{id}/complete — Complete claim"
      - "POST .../claims/{id}/cancel — Cancel claim"

  - name: Ops
    description: "Operations team; manages programs, build lots, quality campaigns, device remediation"
    exclusive_operations:
      - "POST /programs — Create program"
      - "POST .../run_ops — Run ops"
      - "POST .../freeze — Freeze program"
      - "POST .../unfreeze — Unfreeze program"
      - "POST .../close — Close program"
      - "POST .../build_lots — Create build lot"
      - "POST .../quality_campaigns — Create quality campaign"
      - "POST .../quality_campaigns/{id}/escalate — Escalate campaign"
      - "POST .../quality_campaigns/{id}/resolve — Resolve campaign"
      - "POST .../quality_campaigns/{id}/close — Close campaign"
      - "POST .../devices/{id}/remediate — Remediate device"

  - name: System
    description: "Internal system actor for automated state transitions"
    exclusive_operations:
      - "Automated checkpoint operations during ops runs"
      - "Posture escalation"
      - "Alert creation"

  - name: Any
    description: "Shared across all actor types"
    shared_operations:
      - "GET /programs/{program_id} — Read program"
      - "GET .../customers/{id} — Read customer"
      - "GET .../orders/{id} — Read order"
      - "GET .../orders — List orders"
      - "GET .../payments/{id} — Read payment"
      - "GET .../devices/{id} — Read device"
      - "GET .../care_plans/{id} — Read care plan"
      - "GET .../tradeins/{id} — Read trade-in"
      - "GET .../returns/{id} — Read return"
      - "GET .../claims/{id} — Read claim"
      - "GET .../adjustments/{id} — Read adjustment"
      - "GET .../quality_campaigns/{id} — Read campaign"
      - "GET .../alerts — List alerts"
      - "GET .../alerts/{id} — Read alert"
      - "POST .../sessions — Create session"
      - "GET .../sessions/{id} — Read session"
      - "POST .../sessions/{id}/end — End session"
