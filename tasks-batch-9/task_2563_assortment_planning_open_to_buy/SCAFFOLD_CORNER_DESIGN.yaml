            - call: "POST /otb/receipt-commitments/${rc_id}/receipts"
              payload: { received_units_delta: 41 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { e_over: $.data.error_id }
            - call: "GET /otb/receipt-commitments/${rc_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { mid_recv: $.data.received_units, mid_fulfil: $.data.fulfillment_status }
            - call: "POST /otb/receipt-commitments/${rc_id}/receipts"
              payload: { received_units_delta: 40 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { f_recv: $.data.received_units, f_fulfil: $.data.fulfillment_status, f_commit: $.data.commit_status, f_open_cost: $.data.open_cost_cents, f_recv_cost: $.data.received_cost_cents }
