            - "Vendor.${v_watchv_id}.compliance_status == WATCH with scorecard_tier == TIER_STANDARD and access_quota_in_effect == 4"
            - "Vendor.${v_goodv_id}.provisional_compliance_score == 85 and adjudicated_compliance_score == 85"
            - "Vendor.${v_goodv_id}.compliance_status == IN_GOOD_STANDING with scorecard_tier == TIER_STANDARD and access_quota_in_effect == 4"
            - "${rt_rescored} counts both vendors and ComplianceSweep.${rt_sweep_id}.reps_suspended_count == 0 — DOCUMENTATION_FAILURE never suspends"
            - "VendorRep.${rep_wade_id}.access_status and VendorRep.${rep_gil_id}.access_status are both still PENDING"
            - "GET /vendor-access/vendors/${v_watchv_id}/scorecard reports substantiated_incident_count == 2 and open_incident_count == 0"

      - name: sweep_expiry_cascade_reaches_the_badge
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /vendor-access/compliance-sweeps]
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_credential_expiry_cascades_five_hops_to_voided_badge
          rationale: "That §1.8 instance walks the full five-hop chain credential -> posture -> access_status -> authorization -> badge inside one sweep and asserts every hop."

      - name: both_score_variants_are_maintained_side_by_side
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.vendor_compliance_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / vendor_provisional_vs_adjudicated_score_diverge_on_open_incident
          rationale: "That §1.8 instance holds provisional 92 against adjudicated 97 on the same vendor at the same instant, which is the whole dual-variant layer."

  - section: consistency model
    instances:

      - name: approval_side_effects_are_visible_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /vendor-access/case-rep-authorizations/{id}/decide]
        distinguishing_aspect: "Every derived value the approval touches is already correct in the approval response itself and in reads taken immediately afterwards — the badge window, the case counters and projection, the rep's open_authorization_count and the vendor's epoch usage — with no sweep, no retry and no eventual reconciliation."
        test_recipe:
          setup:
            - "Facility IM-69 keeps the default badge lead 60 and grace 30; vendor IMMV has an ACTIVE implant product."
            - "Rep Iris is CREDENTIALED; implant case CASE-15220 runs 2026-10-16T08:00:00Z to 10:00:00Z and reads UNCOVERED / PENDING before the decision."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Immediate Hospital", code: "IM-69", spd_turnaround_hours: 4, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_im_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Immediate Devices", vendor_code: "IMMV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_immv_id: $.data.id, v_immv_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_immv_id}", facility_id: "${f_im_id}", product_name: "Immediate Cage", product_catalog_number: "IC-2100", manufacturer: "Immv", is_implant: true, unit_cost_cents: 410000, expected_vendor_version: "${v_immv_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_immv_id}"
              captures: { pir_ic_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_ic_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_immv_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_ic_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_ic_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_immv_id}", full_name: "Iris Immediate", email: "iris@immv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_iris_id: $.data.id }
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_iris_id}", credential_type: "IMMUNIZATION_INFLUENZA", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "FLU-IM-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_iris_flu_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_iris_flu_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_iris_id}", credential_type: "TRAINING_BLOODBORNE_PATHOGENS", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BBP-IM-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_iris_bbp_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_iris_bbp_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_iris_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-IM-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_iris_bgc_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_iris_bgc_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_iris_id}", credential_type: "COI_GIFT_ATTESTATION", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "COI-IM-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_iris_coi_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_iris_coi_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_im_id}", case_number: "CASE-15220", procedure_name: "Immediate Fusion", scheduled_start_utc: "2026-10-16T08:00:00Z", scheduled_end_utc: "2026-10-16T10:00:00Z", implant_required: true }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15220_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_15220_id}"
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15220_coverage_before: $.data.vendor_coverage_status }
            - call: "POST /vendor-access/case-rep-authorizations"
              payload: { surgical_case_id: "${case_15220_id}", vendor_rep_id: "${rep_iris_id}", requested_role: "IMPLANT_SUPPORT" }
              as: VendorAdmin
              as_user_id: "${v_immv_id}"
              captures: { auth_15220_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/case-rep-authorizations/${auth_15220_id}/decide"
              payload: { decision: "APPROVE" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { auth_15220_status: $.data.status, auth_15220_win_start: $.data.badge_window_start_utc, auth_15220_win_end: $.data.badge_window_end_utc, auth_15220_epoch: $.data.epoch_number }
            - call: "GET /vendor-access/surgical-cases/${case_15220_id}"
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_15220_coverage_after: $.data.vendor_coverage_status, case_15220_approved: $.data.approved_rep_count }
            - call: "GET /vendor-access/vendors/${v_immv_id}"
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { immv_used_after: $.data.authorizations_used_epoch }
          assert:
            - "${case_15220_coverage_before} == UNCOVERED (an implant case with no approved rep)"
            - "the decision response already carries ${auth_15220_status} == APPROVED, ${auth_15220_win_start} == 2026-10-16T07:00:00Z, ${auth_15220_win_end} == 2026-10-16T10:30:00Z and ${auth_15220_epoch} == 0"
            - "the immediately following case read shows ${case_15220_coverage_after} == COVERED and ${case_15220_approved} == 1 — no sweep was run"
            - "${immv_used_after} == 1 and VendorRep.${rep_iris_id}.open_authorization_count == 1 in the same read window"
            - "SurgicalCase.${case_15220_id}.implant_readiness_status == PENDING (implant case, no loaner set registered yet)"
            - "decided_by_user_id == user_orc_1 and decided_at_utc == 2026-08-01T00:00:00Z, the default logical clock"
