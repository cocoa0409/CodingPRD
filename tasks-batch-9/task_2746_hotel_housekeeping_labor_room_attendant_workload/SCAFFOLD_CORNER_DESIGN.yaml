              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/linen-items"
              payload: { property_id: "${prop_id}", linen_type: "SHEET_SET", total_owned_sets: 20 }
              as: LaundryLead
              captures: { linen_id: $.data.id, lv1: $.data.version }
            - call: "POST /housekeeping/linen-items/${linen_id}/soil"
              payload: { sets: 8 }
              as: LaundryLead
              captures: { lv2: $.data.version }
          trigger:
            - call: "POST /housekeeping/laundry-cycles"
              payload: { linen_item_id: "${linen_id}", batch_sets: 6, dispatched_at: "2026-08-03T08:00:00.000Z", expected_return_at: "2026-08-03T12:00:00.000Z", expected_linen_item_version: "${lv1}" }
              as: LaundryLead
              captures: { stale_error: $.data.error_id }
          assert:
            - "After the soil LinenItem.${linen_id} holds on_hand_clean 12, in_laundry 0, soiled_queue 8 and version == ${lv2}, one greater than ${lv1}"
            - "HTTP 412 with error_id == ERR_STALE_LINEN_VERSION"
            - "LinenItem.${linen_id} is unchanged at on_hand_clean 12, in_laundry 0, soiled_queue 8 and version ${lv2}"
            - "GET /housekeeping/laundry-cycles?linen_item_id=${linen_id} returns an empty list"
            - "Re-sending the same body with expected_linen_item_version ${lv2} is accepted and moves 6 sets into in_laundry"

      - name: layer_cascading_side_effects_reach_three_levels
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.LaundryCycle[QUEUED->LATE_ESCALATED].side_effects
        distinguishing_aspect: "Covered by the difficulty design, which follows a late laundry return through the linen ledger, the deferred deep cleans, the affected roster totals and the day ledger."
        excluded_because:
          difficulty_instance: late_laundry_return_cascades_to_deferred_deep_clean_and_day_ledger
          rationale: "That instance already walks the full multi-level chain end to end and asserts each hop's fields, which is the layer claim for cascading side effects."

      - name: layer_dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.forecast_required_credits.variants
        distinguishing_aspect: "Covered by the difficulty design, which computes the projected variant at publish and the reconciled variant at close and pins the variance between them."
        excluded_because:
          difficulty_instance: forecast_projected_inventory_mix_versus_actual_reconciled_credits
          rationale: "Both variants and the delta carried into credit_variance_pct are asserted there with pre-computed literals."

      - name: layer_selector_policy_is_fully_pinned
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers[selector_policy]
          - calculations.inspection_sampling_plan
        distinguishing_aspect: "Covered by the difficulty design for the empty-pool branch, and by the endpoints section for the ranking expression."
        excluded_because:
          difficulty_instance: sampling_plan_on_empty_eligible_pool_reports_zero_samples_and_empty_selection
          rationale: "The degenerate branch of the selector is asserted there, and ep_sample_plan_computed_read_ranks_credits_before_room_number in this file pins the ranking and tie-break order, so a third instance would only restate them."

