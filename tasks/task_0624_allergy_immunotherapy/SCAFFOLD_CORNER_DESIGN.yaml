          difficulty_instance: non_linear_state_machine / plan_held_active_revert_cycle
          rationale: "Reaching MAINTENANCE with an open ADMINISTERED visit requires the full release ladder already prototyped in §1.8; the ERR_NOT_AT_MAINTENANCE complete-guard is the reachable corner (covered in the calculations/state sections) and ERR_OPEN_VISIT_EXISTS is an alternate guard on the same complete transition."

