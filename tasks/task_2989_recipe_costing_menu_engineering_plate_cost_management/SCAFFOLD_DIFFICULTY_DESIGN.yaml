            - call: "POST /culinary/menu-items/${mi_a_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_a: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_a_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-B", name: "Grilled Cheese B", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_b_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_b_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_b: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_b_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/price-change-proposals"
              payload: { menu_item_id: "${mi_a_id}", proposed_price_cents: 455, effective_from: "2026-09-01T00:00:00.000Z", elasticity_bps: 12000 }
              as: RecipeDeveloper
              captures: { prop_a_id: $.data.id }
            - call: "POST /culinary/price-change-proposals"
              payload: { menu_item_id: "${mi_b_id}", proposed_price_cents: 455, effective_from: "2026-09-01T00:00:00.000Z", elasticity_bps: 12000 }
