# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3170_scheduled_train_plan_car_trip_plan_compliance
#
# Breadth probe: every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Sections and
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: yard_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Yard
          - endpoints.POST_/rail/yards
        distinguishing_aspect: "A yard created with only yard_code, dwell_benchmark_hours, classification_capacity_cars returns 201 with posture OPEN, current_dwell_overage_hours 0, version 1, and server-stamped id/created_at/updated_at — computed fields are never taken from the client."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (server default; no set call needed). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /rail/yards"
              payload: { yard_code: "EN-NPL", dwell_benchmark_hours: 12, classification_capacity_cars: 250 }
              as: NetworkPlanner
              captures: { y: $.data.id, po: $.data.posture, ov: $.data.current_dwell_overage_hours, v: $.data.version }
          assert:
            - "response status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "po == OPEN and ov == 0 and v == 1"
            - "Yard.${y}.yard_code == \"EN-NPL\" and dwell_benchmark_hours == 12 and classification_capacity_cars == 250"
            - "created_at == updated_at == the logical clock instant 2026-09-01T00:00:00.000Z"

      - name: train_plan_create_starts_in_draft
        claim_type: Creation
        grounds:
          - entities.TrainPlan
          - state_machines.TrainPlan
          - endpoints.POST_/rail/train-plans
        distinguishing_aspect: "A new train plan is born DRAFT with version 1 and cannot be retired (retire requires ACTIVE) until activated — initial-state pinning."
        test_recipe:
          setup:
            - "Yards EN2-A and EN2-B exist."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "EN2-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "EN2-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
          trigger:
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "EN2-MSGAL", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 45, frequency_mask: ["WED", "FRI"], route_distance_miles: 412.5, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "st == DRAFT and v == 1"
            - "TrainPlan.${p}.cutoff_minutes == 45 and route_distance_miles == 412.5 and frequency_mask == [\"WED\", \"FRI\"]"

      - name: yards_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/rail/yards
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three yards on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count spans the full filtered set, not the page."
        test_recipe:
          setup:
            - "Three yards EN3-1, EN3-2, EN3-3 exist."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "EN3-1", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "EN3-2", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "EN3-3", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
          trigger:
            - call: "GET /rail/yards"
              payload: { limit: 2, offset: 0 }
              as: Any
          assert:
            - "page 1: response_type array, data length 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2 (limit 2, offset 2): data length 1, total_count == 3, has_more == false"
            - "omitting limit/offset entirely returns all 3 rows under the default limit 10"

      - name: get_nonexistent_yard_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_YARD_NOT_FOUND]
          - endpoints.GET_/rail/yards/{id}
        distinguishing_aspect: "GET with a well-formed but unknown yard UUID returns 404 ERR_YARD_NOT_FOUND with the standard error envelope."
        test_recipe:
          setup:
            - "Empty database; logical clock at default."
          setup_api_calls: []
          trigger:
            - call: "GET /rail/yards/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 and err == ERR_YARD_NOT_FOUND"
            - "response_type == error and data.message is non-empty"

      - name: shipment_create_with_unknown_customer_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Shipment.fields.customer_id
          - errors[ERR_CUSTOMER_NOT_FOUND]
        distinguishing_aspect: "Shipment creation references three parents; a non-existent customer_id is rejected 404 ERR_CUSTOMER_NOT_FOUND before any yard or commitment logic runs (existence priority 3)."
        test_recipe:
          setup:
            - "Yards EN5-A and EN5-B exist."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "EN5-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "EN5-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
          trigger:
            - call: "POST /rail/shipments"
              payload: { customer_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", origin_yard_id: "${yA}", destination_yard_id: "${yB}", car_count: 2, first_mile_pickup_by: "2026-09-02T00:00:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 and err == ERR_CUSTOMER_NOT_FOUND"
            - "no shipment persisted: GET /rail/shipments?customer_id=<same uuid> returns total_count 0"

      - name: train_plan_create_same_yard_rejected
        claim_type: Type Constraints
        grounds:
          - entities.TrainPlan.fields.destination_yard_id
          - errors[ERR_SAME_ORIGIN_DESTINATION]
        distinguishing_aspect: "origin_yard_id == destination_yard_id is rejected ERR_SAME_ORIGIN_DESTINATION (422) on plan creation — the referential guard fires before the plan is ever persisted."
        test_recipe:
          setup:
            - "Yard EN6-A exists."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "EN6-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
          trigger:
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "EN6-LOOP", origin_yard_id: "${yA}", destination_yard_id: "${yA}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 30, frequency_mask: ["WED"], route_distance_miles: 100, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 and err == ERR_SAME_ORIGIN_DESTINATION"
            - "GET /rail/train-plans returns total_count 0 (nothing persisted)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: plan_activate_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TrainPlan.DRAFT_to_ACTIVE
          - errors[ERR_PLAN_NOT_DRAFT]
        distinguishing_aspect: "Activating an already-ACTIVE plan while carrying the CURRENT version passes OCC (priority 4) and is rejected by the state precondition (priority 5) with ERR_PLAN_NOT_DRAFT — idempotency of the activate trigger is denied, not replayed."
        test_recipe:
          setup:
            - "Yards SM1-A, SM1-B; plan SM1-P created (v1) and activated (v2; capture current version from the activate response)."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "SM1-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "SM1-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "SM1-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 30, frequency_mask: ["WED"], route_distance_miles: 100, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 and err == ERR_PLAN_NOT_DRAFT (not ERR_STALE_VERSION — the version was current)"
            - "TrainPlan.${p}.status == ACTIVE and version unchanged at 2"

      - name: pool_replenish_while_open_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CrewPool.EXHAUSTED_to_REOPENED
          - errors[ERR_POOL_NOT_REPLENISHABLE]
        distinguishing_aspect: "Replenish is only defined from EXHAUSTED; calling it on an OPEN pool (which still has free crews) returns 409 ERR_POOL_NOT_REPLENISHABLE and leaves crews_available untouched."
        test_recipe:
          setup:
            - "Yard SM2-A; OPEN pool SM2-POOL with 3 crews, 0 booked."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "SM2-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 3 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
          trigger:
            - call: "POST /rail/crew-pools/${pool}/replenish"
              payload: { additional_crews: 2 }
              as: CrewDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 and err == ERR_POOL_NOT_REPLENISHABLE"
            - "CrewPool.${pool}.crews_available == 3 (unchanged) and status == OPEN"

      - name: pool_close_and_second_close_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.CrewPool.OPEN_to_CLOSED
          - errors[ERR_POOL_ALREADY_CLOSED]
        distinguishing_aspect: "An un-booked OPEN pool closes cleanly (terminal); a second close on the CLOSED pool is rejected ERR_POOL_ALREADY_CLOSED — terminal-state lockdown for the crew-pool epoch."
        test_recipe:
          setup:
            - "Yard SM3-A; OPEN pool SM3-POOL with 2 crews, none booked."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "SM3-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "ENGINEER", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
          trigger:
            - call: "POST /rail/crew-pools/${pool}/close"
              payload: {}
              as: CrewDispatcher
              captures: { st: $.data.status }
            - call: "POST /rail/crew-pools/${pool}/close"
              payload: {}
              as: CrewDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "first close: st == CLOSED"
            - "second close: response status 409 and err == ERR_POOL_ALREADY_CLOSED"

      - name: locomotive_release_repair_while_available_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Locomotive.BAD_ORDER_to_AVAILABLE
          - errors[ERR_UNIT_NOT_BAD_ORDER]
        distinguishing_aspect: "release-repair is defined only from BAD_ORDER; calling it on an AVAILABLE unit returns 409 ERR_UNIT_NOT_BAD_ORDER — the cyclic locomotive machine's reverse edge is guarded."
        test_recipe:
          setup:
            - "Yard SM4-A; locomotive SM4-UP1 AVAILABLE at SM4-A."
          setup_api_calls:
            - call: "POST /rail/yards"
              payload: { yard_code: "SM4-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "SM4-UP1", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
          trigger:
            - call: "POST /rail/locomotives/${loco}/release-repair"
              payload: {}
              as: PowerPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 and err == ERR_UNIT_NOT_BAD_ORDER"
            - "Locomotive.${loco}.status == AVAILABLE (unchanged)"

      - name: shipment_cancel_after_departure_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Shipment.OPEN_to_CANCELLED
          - errors[ERR_SHIPMENT_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancel is defined only from OPEN; once the first TRAIN_DEPARTURE event flips the shipment to IN_TRANSIT, cancel returns 409 ERR_SHIPMENT_NOT_CANCELLABLE — in-flight freight cannot be cancelled."
        test_recipe:
          setup:
            - "Yards SM5-A, SM5-B; ACTIVE plan SM5-P dep 2026-09-01T08:00:00Z TUE; customer; shipment SM5-S assigned [SM5-P]; pool, locomotive, SCHEDULED departure; departure finalized at 08:00; TRAIN_DEPARTURE event recorded at SM5-A."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "SM5-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "SM5-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "SM5-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "SM5-CU", name: "Cancel Late Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yB}", car_count: 1, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-04T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /rail/shipments/${s}/trip-legs"
              payload: { expected_shipment_version: "${s_v}", legs: [{ train_plan_id: "${p}", leg_sequence: 1 }] }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 1 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "SM5-UP1", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 1, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
              captures: { dep: $.data.id }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/train-departures/${dep}/finalize"
              payload: {}
              as: TerminalSuperintendent
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yA}", event_type: "TRAIN_DEPARTURE", occurred_at: "2026-09-01T08:00:00Z", car_count: 1 }
              as: TerminalSuperintendent
          trigger:
            - call: "POST /rail/shipments/${s}/cancel"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 and err == ERR_SHIPMENT_NOT_CANCELLABLE"
            - "Shipment.${s}.status == IN_TRANSIT (unchanged)"

      - name: departure_finalize_before_schedule_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TrainDeparture.SCHEDULED_to_DEPARTED
          - errors[ERR_DEPARTURE_TOO_EARLY]
        distinguishing_aspect: "Finalize with the logical clock strictly before the plan's scheduled_departure_utc is rejected ERR_DEPARTURE_TOO_EARLY even when every other precondition (crew, power, yard) passes."
        test_recipe:
          setup:
            - "Yards SM6-A, SM6-B; ACTIVE plan SM6-P dep 2026-09-01T08:00:00Z; pool 1 crew; locomotive; SCHEDULED departure. Clock pinned at 2026-09-01T07:59:00Z."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "SM6-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "SM6-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "SM6-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 1 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "SM6-UP1", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 1, crew_hours_estimated: 6 }
              as: TerminalSuperintendent
              captures: { dep: $.data.id }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T07:59:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /rail/train-departures/${dep}/finalize"
              payload: {}
              as: TerminalSuperintendent
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 and err == ERR_DEPARTURE_TOO_EARLY"
            - "TrainDeparture.${dep}.status == SCHEDULED and CrewPool.${pool}.crews_booked == 0 (no booking consumed)"

      - name: exception_resolve_requires_replanned_shipment
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceException.INVESTIGATING_to_RESOLVED
          - errors[ERR_EXCEPTION_NOT_RECOVERABLE]
        distinguishing_aspect: "A MISSED_CONNECTION exception under INVESTIGATING cannot resolve while the shipment's trip_plan_status is still MISSED_CONNECTION — recovery requires the replan to land first (cross-entity gate on resolve)."
        test_recipe:
          setup:
            - "Yards EX1-A, EX1-B; ACTIVE plan EX1-P dep 2026-09-01T08:00:00Z; customer; shipment EX1-S assigned [EX1-P]; departure scheduled then cancelled at clock 07:00 -> leg MISSED, exception EX raised (OPEN)."
            - "Exception triaged to INVESTIGATING; shipment NOT yet replanned."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "EX1-A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "EX1-B", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yB: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "EX1-P", origin_yard_id: "${yA}", destination_yard_id: "${yB}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p: $.data.id, p_v: $.data.version }
            - call: "POST /rail/train-plans/${p}/activate"
              payload: { expected_train_plan_version: "${p_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "EX1-CU", name: "Exception Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yB}", car_count: 2, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-04T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T07:00:00Z" }
              as: NetworkPlanner
