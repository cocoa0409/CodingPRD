      - name: day6_caps_at_week_rate
        claim_type: constants_applied
        grounds: [calculations.rental_charge_accrual]
        distinguishing_aspect: "A 6-day window hits the day-block cap min(6 x 12000, 60000) = 60000 — same time charge as the 7-day week, proving the weekly cap constant engages below the tier boundary."
        test_recipe:
