              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "immediately after the hazard-declaration call: Inspection.${insp_id}.hazard_state == HAZARD_DECLARED and Inspection.${insp_id}.status == IN_PROGRESS"
            - "ViolationFinding.${hz_finding_id}.declared_hazard == true"
            - "immediately after the hazard-declaration call: Establishment.${est_id}.license_status == CLOSED_IMMINENT_HAZARD and Establishment.${est_id}.compliance_posture == FROZEN"
            - "immediately after the submit call: Inspection.${insp_id}.status == PENDING_REVIEW and Inspection.${insp_id}.hazard_state == HAZARD_DECLARED"
            - "Inspection.${insp_id}.provisional_adjusted_score == 40.00"
            - "Inspection.${insp_id}.provisional_outcome == IMMEDIATE_CLOSURE"
            - "after the finalize call: Inspection.${insp_id}.status == FINALIZED and Inspection.${insp_id}.hazard_state == HAZARD_DECLARED"
            - "Inspection.${insp_id}.final_adjusted_score == 40.00"
            - "Inspection.${insp_id}.final_outcome == IMMEDIATE_CLOSURE"
            - "Establishment.${est_id}.demerit_balance == 40.00"
            - "Establishment.${est_id}.license_status == CLOSED_IMMINENT_HAZARD"

      - name: citation_amendment_cycle_loops_back_to_contested_until_rounds_exhausted
        grounds:
          - state_machines.Citation.ISSUED_to_CONTESTED
          - state_machines.Citation.CONTESTED_to_HEARING_SCHEDULED
          - state_machines.Citation.HEARING_SCHEDULED_to_AMENDED
          - state_machines.Citation.AMENDED_to_CONTESTED
          - entities.Citation.fields.hearing_round_count
          - entities.Hearing.fields.round_index
          - validations[priority=82]
        distinguishing_aspect: |
          Citation - a different entity from Inspection - runs a true cycle
          CONTESTED -> HEARING_SCHEDULED -> AMENDED -> CONTESTED, traversed twice with the fine
          re-derived each lap (56160 -> 21000 -> 10500), and the loop is bounded by
          MAX_HEARING_ROUNDS so the third hearing request is rejected with
          ERR_HEARING_ROUNDS_EXHAUSTED rather than by a status precondition.
