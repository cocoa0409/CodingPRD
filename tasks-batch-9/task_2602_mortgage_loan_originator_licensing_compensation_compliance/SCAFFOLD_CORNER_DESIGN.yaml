              as: LoanOperations
              as_user_id: "ops-1"
              captures: { v5: $.data.version }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ExaminationCoordinator
              as_user_id: "exam-1"
              captures: { v6: $.data.version }
