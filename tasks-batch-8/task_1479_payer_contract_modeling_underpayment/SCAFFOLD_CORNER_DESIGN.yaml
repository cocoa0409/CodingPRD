          trigger:
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
              captures: { exp: $.data.expected_reimbursement_cents, nf: $.data.network_flag }
          assert:
            - "Claim.${claim_id}.network_flag == OUT_OF_NETWORK (${nf})"
            - "Claim.${claim_id}.expected_reimbursement_cents == 100000 (${exp})"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: val_missing_auth_header_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority pair auth vs existence: a GET on a nonexistent contract WITHOUT X-User-Role returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, not 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/payer-contracts/00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (priority 1 masks the 404)"

      - name: val_role_denied_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Priority pair authorization vs existence: Auditor deactivating a nonexistent payer gets 403 ERR_FORBIDDEN_FOR_ROLE, not 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/payers/00000000-0000-0000-0000-000000000000/deactivate"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 with ${err} == ERR_FORBIDDEN_FOR_ROLE (priority 2 masks the 404)"

      - name: val_shape_error_beats_state_error
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Priority pair request-shape vs state (different pair from the §1.8 conflicts): write_off missing required amount_cents on a QUEUED case returns 400 ERR_INVALID_REQUEST, not the state error the case would otherwise produce."
        test_recipe:
          setup: ["case QUEUED (claim priced 200000, remittance 100000 -> variance 100000)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer SH", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "SH-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-SH1", patient_account_number: "PA-SH1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: FinanceDirector
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/underpayment-cases/${case_id}/write_off"
              payload: { reason: "missing the amount" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with ${err} == ERR_INVALID_REQUEST (priority 3 masks the priority-6 state rejection)"
            - "UnderpaymentCase.${case_id}.status still == QUEUED"

      - name: val_escalator_creation_on_active_contract_allowed
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=6]", "endpoints[POST /api/rate-escalators]"]
        distinguishing_aspect: "Satisfaction side of the escalator state rule: creation on an ACTIVE contract (not only DRAFT) succeeds with status SCHEDULED."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer EA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "EA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
          trigger:
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", escalator_bp: 1500, compounding: true }
              as: ContractAnalyst
              captures: { esc_id: $.data.id, st: $.data.status }
          assert:
            - "created 201: RateEscalator.${esc_id}.status == SCHEDULED (${st})"

      - name: val_cross_payer_renewal_link_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PRIOR_CONTRACT_MISMATCH]", entities.PayerContract.fields.prior_contract_id]
        distinguishing_aspect: "Cross-entity validation: prior_contract_id pointing at ANOTHER payer's contract is rejected ERR_PRIOR_CONTRACT_MISMATCH."
        test_recipe:
          setup: ["payer PA with contract CA (2026); payer PB"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer PA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_a: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_a}", contract_code: "PA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_a: $.data.id }
            - call: "POST /api/payers"
              payload: { name: "Payer PB", payer_type: "MEDICAID_MCO", appeal_deadline_days: 30 }
              as: ContractManager
              captures: { payer_b: $.data.id }
          trigger:
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_b}", contract_code: "PB-2027", effective_date: "2027-01-01", expiration_date: "2027-12-31", prior_contract_id: "${contract_a}" }
              as: ContractAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_PRIOR_CONTRACT_MISMATCH"

      - name: val_amendment_supersede_other_contract_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_AMENDMENT_SUPERSEDE_MISMATCH]", entities.RateAmendment.fields.supersedes_amendment_id]
        distinguishing_aspect: "Cross-entity validation: supersedes_amendment_id naming an amendment of a DIFFERENT contract is rejected ERR_AMENDMENT_SUPERSEDE_MISMATCH."
        test_recipe:
          setup: ["payer P with ACTIVE contracts C1 (2026-01-01..2026-06-30) and C2 (2026-07-01..2026-12-31), each with an INPATIENT_MEDICAL term; DRAFT amendment M2 exists on C2"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer SM", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "SM-H1", effective_date: "2026-01-01", expiration_date: "2026-06-30" }
              as: ContractAnalyst
              captures: { c1: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${c1}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${c1}/activate"
              as: ContractManager
              captures: { cv1: $.data.version }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "SM-H2", effective_date: "2026-07-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { c2: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${c2}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${c2}/activate"
              as: ContractManager
              captures: { cv2: $.data.version }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${c2}", effective_date: "2026-09-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 110000 } ], expected_contract_version: "${cv2}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${c1}", effective_date: "2026-03-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 105000 } ], supersedes_amendment_id: "${m2}", expected_contract_version: "${cv1}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_AMENDMENT_SUPERSEDE_MISMATCH"

  # ===========================================================================
  # Section: errors — one triggerable instance per error not covered elsewhere.
  # §1.8-covered errors appear as excluded_because stubs at the end.
  # Errors covered by other §1.9 sections (not repeated here):
  #   ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER / ERR_INVALID_REQUEST /
  #   ERR_NOT_FOUND (entities+validations), ERR_FORBIDDEN_FOR_ROLE (rbac),
  #   ERR_PAYER_INACTIVE (sm_payer_deactivate_blocks_contract_activation),
  #   ERR_PRIOR_CONTRACT_MISMATCH / ERR_AMENDMENT_SUPERSEDE_MISMATCH
  #   (validations), ERR_CASE_ALREADY_ACTIVE (sm_second_variance_event_
  #   restates_existing_case — system-path invariant, no public trigger).
  # ===========================================================================
  - section: errors
    instances:
      - name: err_contract_not_draft_on_term_creation
        claim_type: triggerable
        grounds: ["errors[ERR_CONTRACT_NOT_DRAFT]", "validations[priority=6]", "endpoints[POST /api/contract-terms]"]
        distinguishing_aspect: "Loading a term onto an ACTIVE contract is rejected ERR_CONTRACT_NOT_DRAFT — mid-term changes must flow through RateAmendment."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with one INPATIENT_MEDICAL term"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer ND2", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "ND2-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
          trigger:
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "EMERGENCY", rate_model: "CASE_RATE", base_rate_cents: 200000 }
              as: ContractAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_CONTRACT_NOT_DRAFT"

      - name: err_proposal_stale_on_submit
        claim_type: triggerable
        grounds: ["errors[ERR_PROPOSAL_STALE]", entities.ContractProposal.fields.is_stale, "state_machines.ContractProposal.MODELED_to_SUBMITTED"]
        distinguishing_aspect: "After run_model pins modeled_contract_version, any contract version bump (here: amendment creation) makes the proposal stale; submit is rejected ERR_PROPOSAL_STALE."
        test_recipe:
          setup: ["payer P; contract C ACTIVE CASE_RATE OUTPATIENT_SURGERY 500000; proposal modeled against C"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer ST", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "ST-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 500000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 550000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 2 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              captures: { proposal_id: $.data.id }
            - call: "POST /api/contract-proposals/${proposal_id}/run_model"
              as: ContractAnalyst
            - call: "GET /api/payer-contracts/${contract_id}"
              as: ContractAnalyst
              captures: { cv2: $.data.version }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", term_overrides: [ { service_category: "OUTPATIENT_SURGERY", base_rate_cents: 510000 } ], expected_contract_version: "${cv2}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
          trigger:
            - call: "POST /api/contract-proposals/${proposal_id}/submit"
              as: ContractManager
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_PROPOSAL_STALE (modeled version behind the contract's current version)"
            - "ContractProposal.${proposal_id}.status still == MODELED and is_stale == true"

      - name: err_sod_amendment_self_approve_rejected
        claim_type: triggerable
        grounds: ["errors[ERR_SOD_AMENDMENT_SELF_APPROVE]", "validations[priority=7]", entities.RateAmendment.fields.created_by_user_id]
        distinguishing_aspect: "Segregation of duties: the amendment's creator (X-User-ID cm-1) approving their own amendment is rejected ERR_SOD_AMENDMENT_SELF_APPROVE."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term; DRAFT amendment created by user cm-1 (ContractManager)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer SA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "SA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 110000 } ], expected_contract_version: "${cv}" }
              as: ContractManager
              as_user_id: "cm-1"
              captures: { amendment_id: $.data.id }
          trigger:
            - call: "POST /api/rate-amendments/${amendment_id}/approve"
              as: ContractManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_SOD_AMENDMENT_SELF_APPROVE"
            - "RateAmendment.${amendment_id}.status still == DRAFT and approved_by_user_id is null"

      - name: err_appeal_level_mismatch_on_skip
        claim_type: triggerable
        grounds: ["errors[ERR_APPEAL_LEVEL_MISMATCH]", "state_machines.UnderpaymentCase.UNDER_REVIEW_to_APPEAL_L1"]
        distinguishing_aspect: "Creating a level-2 appeal on an UNDER_REVIEW case (escalation_level 0, eligible level 1) is rejected ERR_APPEAL_LEVEL_MISMATCH."
        test_recipe:
          setup: ["case UNDER_REVIEW (claim 200000, remittance 100000, pick_up by rm-1)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer LM", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "LM-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-LM1", patient_account_number: "PA-LM1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RecoveryManager
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/underpayment-cases/${case_id}/pick_up"
              as: RecoveryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 2 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_APPEAL_LEVEL_MISMATCH"
            - "UnderpaymentCase.${case_id}.status still == UNDER_REVIEW and escalation_level == 0"

      - name: err_no_matching_term_on_price
        claim_type: triggerable
        grounds: ["errors[ERR_NO_MATCHING_TERM]", "validations[priority=8]", "state_machines.Claim.UNPRICED_to_PRICED"]
        distinguishing_aspect: "Pricing an EMERGENCY claim when the resolved contract has no EMERGENCY term is rejected ERR_NO_MATCHING_TERM."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with ONLY an INPATIENT_MEDICAL term; EMERGENCY claim CL-NM1 anchored inside C's window, one line"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer NM", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "NM-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-NM1", patient_account_number: "PA-NM1", service_category: "EMERGENCY", admission_date: "2026-06-10", discharge_date: "2026-06-10", total_billed_charges_cents: 90000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
