            - "response error_id == ERR_UNAUTHORIZED"

      - name: appeal_decide_missing_auth_headers
        claim_type: peer_roles
        grounds: ["roles", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Calling a protected endpoint with no auth headers -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 401"
            - "response error_id == ERR_UNAUTHENTICATED"

      - name: segregation_of_duties_stub
        claim_type: Segregation of duties
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: compensating_invariant / assessment_abatement_conserves_account_balance
          rationale: "The SoD gate on appeal decide is the same rule exercised (positive path) by the abatement instance; a negative SoD test (decider == issuer) is its direct complement and is covered under §1.8's decide flow."

  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_return_version_on_refund_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[refund-create-stale-return]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first refund create bumps TaxReturn.version, a second create still carrying the previously observed expected_return_version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACTIVE taxpayer; a FILED return; ret_v captured from the file response"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "OccTP", entity_type: "LLC", email: "oc@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v: $.data.version }
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_id}", claim_amount_cents: 5000, reason: "TAXPAYER_ERROR", overpayment_date: "2026-04-01T00:00:00Z", expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { claim1_id: $.data.id }
          trigger:
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_id}", claim_amount_cents: 6000, reason: "TAXPAYER_ERROR", overpayment_date: "2026-04-01T00:00:00Z", expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 412"
            - "response error_id == ERR_STALE_VERSION"

      - name: refund_create_supersedes_prior_open_claim
        claim_type: optimistic_concurrency
        grounds: ["state_machines.RefundClaim.OPEN_to_SUPERSEDED", "entities.RefundClaim.fields.status"]
        distinguishing_aspect: "A second refund create using the fresh (bumped) expected_return_version supersedes the prior OPEN claim (OPEN -> SUPERSEDED) and the new claim is OPEN."
        test_recipe:
          setup: ["ACTIVE taxpayer; FILED return; one OPEN refund claim; return version re-read after that claim"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "SupTP", entity_type: "LLC", email: "su@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v1: $.data.version }
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_id}", claim_amount_cents: 5000, reason: "TAXPAYER_ERROR", overpayment_date: "2026-04-01T00:00:00Z", expected_return_version: "${ret_v1}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { claim1_id: $.data.id }
            - call: "GET /tax/returns/${ret_id}"
              payload: {}
              as: TaxAdmin
              captures: { ret_v2: $.data.version }
          trigger:
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_id}", claim_amount_cents: 6000, reason: "TAXPAYER_ERROR", overpayment_date: "2026-04-01T00:00:00Z", expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { claim2_id: $.data.id }
          assert:
            - "HTTP 201"
            - "RefundClaim.${claim1_id}.status == SUPERSEDED"
            - "RefundClaim.${claim2_id}.status == OPEN"

      - name: reinstate_suspended_account_cycle
        claim_type: derived_field_reconciliation
        grounds: ["state_machines.Taxpayer.SUSPENDED_to_ACTIVE", "entities.Taxpayer.fields.account_status"]
        distinguishing_aspect: "A SUSPENDED account re-activated returns to ACTIVE (suspend_reason cleared), demonstrating the ACTIVE<->SUSPENDED cycle."
        test_recipe:
          setup: ["one taxpayer activated then suspended"]
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "ReinTP", entity_type: "LLC", email: "re@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/taxpayers/${tp_id}/suspend"
              payload: { suspend_reason: "Delinquent" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
          assert:
            - "Taxpayer.${tp_id}.account_status == ACTIVE"

