          assert:
            - "Exactly 1 TRANSACTIONS_AVAILABLE WebhookEvent exists for connection ${conn_id} and its payload.new_transaction_count == 7"
            - "The zero-count refresh produced no webhook (total TRANSACTIONS_AVAILABLE count == 1)"

      - name: deletion_progress_completes_after_last_recipient_ack
        claim_type: correct_result
        grounds:
          - calculations.deletion_propagation_progress
          - state_machines.DataDeletionRequest.PROPAGATING_to_ACKED_BY_ALL
        distinguishing_aspect: "Deletion request stays PROPAGATING until the required recipient acks; the ack flips it through ACKED_BY_ALL to COMPLETED with completed_at set, and a duplicate ack is rejected."
        test_recipe:
          setup: ["ACTIVE consent for consumer cons_aa under APPROVED recipient R; connection ACTIVE"]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Delete Bank", supported_methods: ["CREDENTIALS"], target_method: "CREDENTIALS", migration_window_start: "2026-09-10T00:00:00Z", migration_window_end: "2026-10-10T00:00:00Z" }
