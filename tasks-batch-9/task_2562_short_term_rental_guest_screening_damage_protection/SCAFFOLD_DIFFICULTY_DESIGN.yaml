              payload: { payment_risk_signal: "CLEAN", chargeback_count: 2 }
              as: PlatformAdmin
              captures: { pre_score: $.data.risk_score, pre_tier: $.data.risk_tier }
          trigger:
            - call: "POST /rentals/guests/${g1}/payment-signals"
              payload: { payment_risk_signal: "CLEAN", chargeback_count: 3 }
              as: PlatformAdmin
          assert:
            - "${pre_score} == 45 and ${pre_tier} == ELEVATED"
            - "Guest.${g1}.chargeback_count == 3"
            - "Guest.${g1}.risk_score == 50"
            - "Guest.${g1}.risk_tier == HIGH"
            - "Guest.${g1}.risk_tier != ELEVATED and Guest.${g1}.risk_tier != CRITICAL"
            - "GET /rentals/guests/${g1}/risk-profile returns risk_score 50, risk_tier HIGH, chargeback_count 3, completed_stay_count 0, substantiated_incident_count 0, approved_claim_count 0"
