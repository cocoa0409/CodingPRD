# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Endurance Event Volunteer Operations
# 9 rules x instances = 26 non-stub instances.
# Shared fixture convention: every instance starts from empty DB; the logical
# clock defaults to 2026-08-01T00:00:00Z and is always set explicitly.
# Standard event window literals used throughout:
#   early_access 2026-08-10T00:00:00Z / opens 2026-08-17T00:00:00Z
#   closes 2026-09-27T00:00:00Z / race day 2026-10-04T06:00:00Z..22:00:00Z
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: credit_provisional_vs_settled_diverge
        grounds:
          - calculations.fundraising_credit
          - entities.FundraisingGroup.fields.status
          - entities.HourLog.fields.status
        distinguishing_aspect: |
          Dual-variant calculation on the FundraisingGroup (money) domain: identical
          underlying data yields provisional_credit_cents 5000 (PENDING+VERIFIED logs at
          claimed_hours) vs settled_credit_cents 2000 (VERIFIED logs only at credited_hours);
          the two variants disagree because the input SETS differ, not because of time.
        test_recipe:
          setup:
            - "Event PUBLISHED then raced; role WATER-MARSHAL weight 1.0; shift 06:00-14:00 headcount 5"
            - "Group CHARITY-TC with volunteers V1 (4h log VERIFIED) and V2 (6h log PENDING_VERIFICATION)"
            - "Clock ends at 2026-10-04T12:00:00Z; event RACE_DAY"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "WATER-MARSHAL", title: "Water Station Marshal", min_age_years: 16, required_skill: NONE, required_training_module: NONE, credit_weight: 1.0 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T14:00:00Z", required_headcount: 5 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/fundraising-groups", payload: { event_id: "${ev}", name: "Track Club", charity_code: "CHARITY-TC" }, as: EventDirector, captures: { grp: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01", group_id: "${grp}" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "1999-05-05", group_id: "${grp}" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg2}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg2}/confirm", payload: {}, as: Volunteer, as_user_id: "${v2}" }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg2}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T10:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T12:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg2}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/hour-logs?signup_id=${sg1}", as: VolunteerCoordinator, captures: { hl1: "$.data[0].id" } }
            - { call: "GET /volunteer-ops/hour-logs?signup_id=${sg2}", as: VolunteerCoordinator, captures: { hl2: "$.data[0].id" } }
            - { call: "POST /volunteer-ops/hour-logs/${hl1}/verify", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "GET /volunteer-ops/fundraising-groups/${grp}/credit-summary", as: EventDirector, captures: { prov: $.data.provisional_credit_cents, sett: $.data.settled_credit_cents } }
          assert:
            - "credit-summary.provisional_effective_hours == 10.0 (4.00 claimed of VERIFIED hl1 + 6.00 claimed of PENDING hl2)"
            - "credit-summary.provisional_credit_cents == 5000"
            - "credit-summary.settled_effective_hours == 4.0 (VERIFIED hl1 only)"
            - "credit-summary.settled_credit_cents == 2000"
            - "credit-summary.sponsor_match_cents == 100 (2000 base < 50000 -> 5%)"
            - "credit-summary.total_settled_credit_cents == 2100"
            - "${prov} != ${sett} (identical data, two variants, different cents)"

      - name: recognition_projected_vs_official_diverge
        grounds:
          - calculations.recognition_points
          - entities.Volunteer.fields.is_returning
          - entities.Signup.fields.is_captain
        distinguishing_aspect: |
          Dual-variant calculation on the Volunteer (recognition points) domain —
          a different entity domain than fundraising money: identical data yields
          projected_points 115 (counts the PENDING log at claimed_hours) vs
          official_points 75 (VERIFIED-only), and verifying the log reconciles
          official up to 115 while projected never moves.
        test_recipe:
          setup:
            - "Returning volunteer V1, captain of shift 06:00-14:00, one 4h HourLog PENDING_VERIFICATION"
            - "CAPTAIN_COURSE passed before captain assignment; event RACE_DAY"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16, required_skill: NONE, required_training_module: NONE, credit_weight: 1.0 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T14:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01", is_returning: true }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/training-records", payload: { event_id: "${ev}", volunteer_id: "${v1}", module_code: CAPTAIN_COURSE }, as: VolunteerCoordinator, captures: { tr1: $.data.id } }
            - { call: "POST /volunteer-ops/training-records/${tr1}/pass", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/signups/${sg1}/assign-captain", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T10:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/hour-logs?signup_id=${sg1}", as: VolunteerCoordinator, captures: { hl1: "$.data[0].id" } }
          trigger:
            - { call: "GET /volunteer-ops/volunteers/${v1}/recognition-summary", as: VolunteerCoordinator, captures: { proj1: $.data.projected_points, off1: $.data.official_points } }
            - { call: "POST /volunteer-ops/hour-logs/${hl1}/verify", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/volunteers/${v1}/recognition-summary", as: VolunteerCoordinator, captures: { proj2: $.data.projected_points, off2: $.data.official_points } }
          assert:
            - "first read: projected_points == 115 (4.00 claimed h x 10 + captain 25 + returning 50)"
            - "first read: official_points == 75 (0 verified hours + 25 + 50)"
            - "first read: recognition_tier == BRONZE (75 >= 50, < 150)"
            - "first read: captain_shift_count == 1 and no_show_count == 0"
            - "after verify: official_points == 115 (reconciliation on variant switch)"
            - "after verify: projected_points == 115 (projected unchanged by verification)"
            - "${off1} == 75 and ${off2} == 115 and ${proj1} == ${proj2}"

  - rule_id: combinatorial_formula
    instances:
      - name: tiered_credit_weighted_straddle
        grounds:
          - calculations.fundraising_credit
          - entities.RoleCatalogEntry.fields.credit_weight
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (per-log credited_hours, role
          credit_weight 3.0, tier table) with non-linear nested min/max tier
          slicing — 144.00 effective hours straddles the 100h tier boundary:
          100x500 + 44x800 = 85200 cents.
        test_recipe:
          setup:
            - "Role HEAVY-MEDICAL weight 3.0; shift 06:00-22:00 headcount 3"
            - "Group G with V1,V2,V3; each checked in 06:00 and out 22:00 (960 min -> 16.00 credited h -> 48.00 effective h each); all three logs VERIFIED"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "HEAVY", title: "Heavy Marshal", min_age_years: 16, required_skill: NONE, required_training_module: NONE, credit_weight: 3.0 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T22:00:00Z", required_headcount: 3 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/fundraising-groups", payload: { event_id: "${ev}", name: "Track Club", charity_code: "CHARITY-TC" }, as: EventDirector, captures: { grp: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01", group_id: "${grp}" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02", group_id: "${grp}" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Three", date_of_birth: "2000-01-03", group_id: "${grp}" }, as: Anonymous, captures: { v3: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v3}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v3}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg3: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg2}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg3}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/signups/${sg2}/confirm", payload: {}, as: Volunteer, as_user_id: "${v2}" }
            - { call: "POST /volunteer-ops/signups/${sg3}/confirm", payload: {}, as: Volunteer, as_user_id: "${v3}" }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg2}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg3}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T22:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg2}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg3}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/hour-logs?signup_id=${sg1}", as: VolunteerCoordinator, captures: { hl1: "$.data[0].id" } }
            - { call: "GET /volunteer-ops/hour-logs?signup_id=${sg2}", as: VolunteerCoordinator, captures: { hl2: "$.data[0].id" } }
            - { call: "GET /volunteer-ops/hour-logs?signup_id=${sg3}", as: VolunteerCoordinator, captures: { hl3: "$.data[0].id" } }
            - { call: "POST /volunteer-ops/hour-logs/${hl1}/verify", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/hour-logs/${hl2}/verify", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/hour-logs/${hl3}/verify", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "GET /volunteer-ops/fundraising-groups/${grp}/credit-summary", as: EventDirector, captures: { sett: $.data.settled_credit_cents } }
          assert:
            - "credit-summary.settled_effective_hours == 144.0 (3 x round_half_up(16.00 x 3.0, 2) = 3 x 48.00)"
            - "credit-summary.settled_credit_cents == 85200 (100x500 + 44x800 — tier-2 straddle)"
            - "credit-summary.sponsor_match_cents == 12780 (85200 >= 50000 -> 15%)"
            - "credit-summary.total_settled_credit_cents == 97980"
            - "credit-summary.provisional_credit_cents == 85200 (all logs VERIFIED; claimed == credited at 960 min)"

      - name: quarter_rounding_per_entry_order
        grounds:
          - calculations.credited_hours_quarter_rounding
          - entities.HourLog.fields.credited_hours
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters — the scaffold
          pins per-ENTRY quarter rounding before summation; two 6-minute logs credit
          0.00 + 0.00 = 0.00 settled hours, while the forbidden sum-then-round order
          would yield round_half_up(12/15) x 0.25 = 0.25 and 125 cents.
        test_recipe:
          setup:
            - "Two same-segment adjacent shifts S1 06:00-08:00, S2 08:00-10:00; volunteer V1 in group G works 6 minutes on each"
            - "Both HourLogs VERIFIED; clock ends 2026-10-04T08:06:00Z"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16, required_skill: NONE, required_training_module: NONE, credit_weight: 1.0 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T08:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T08:00:00Z", end_at: "2026-10-04T10:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh2: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/fundraising-groups", payload: { event_id: "${ev}", name: "Track Club", charity_code: "CHARITY-TC" }, as: EventDirector, captures: { grp: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01", group_id: "${grp}" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh1}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh2}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg2}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg2}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
