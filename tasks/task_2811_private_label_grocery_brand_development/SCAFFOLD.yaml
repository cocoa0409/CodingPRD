# =============================================================================
# SCAFFOLD.yaml — Private-Label Grocery Brand Development (private brand agency)
# Sections §1.0 - §1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml respectively.
# =============================================================================

scenario: |
  2811. Private-Label Grocery Brand Development (Daymon private brand agency): category gap
  analysis and tier strategy (opening price, national-brand-equivalent, premium), supplier
  qualification, capability audit and cost modeling, bench-top cutting and consumer panel
  comparison against the national brand, packaging design, claim review and nutrition panel
  generation, first-production run approval and specification lock, ongoing quality audit,
  complaint trending and supplier scorecard, cost change negotiation and material substitution
  approval, brand relaunch and item rationalization

domain_name: private-label-brand-development
api_prefix: /private-label

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_band: beyond_expert
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: flat
  # flat: 14 peer entities linked by explicit foreign keys; every URL is
  # /private-label/<collection>[/{id}[/<action>]] — no parent ids in any path.

  state_machine_shape: cyclic
  # CostChangeRequest negotiation rounds (SUBMITTED->COUNTERED->SUBMITTED),
  # ArtworkRound revision loop (IN_REVIEW->CHANGES_REQUESTED->IN_REVIEW),
  # Supplier recertification self-loop (QUALIFIED->QUALIFIED), plus ProductItem
  # carrying two independent state dimensions (development_status x quality_posture).

  relationship_patterns:
    - one_to_many
    - self_referential      # ProductItem.replacement_item_id -> ProductItem.id
    - cross_aggregate       # Specification pins CostModel + ArtworkRound versions
    - polymorphic: false

  role_model: segregation_of_duties
  # A LabelClaim may not be reviewed by the user who submitted it; a ProductionRun
  # may not be approved by the user who locked its Specification.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BrandProgram
    parent: null
    common_fields: true
    fields:
      - name: brand_name
        type: string
        source: input
        description: private brand name being developed
      - name: retailer_name
        type: string
        source: input
        description: retailer sponsoring the private brand program
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the program budget belongs to
        constraints: "2020 <= fiscal_year <= 2100"
      - name: dev_budget_cents
        type: integer
        source: input
        description: total development budget in cents available for slotting fees and tooling
        constraints: ">= 0"
      - name: committed_budget_cents
        type: integer
        source: computed
        description: >-
          sum(Specification.slotting_fee_cents where Specification.status IN {LOCKED, SUPERSEDE_PENDING, SUPERSEDED})
          + sum(ProductionRun.committed_tooling_cents where ProductionRun.status IN {SCHEDULED, APPROVED, HOLD, COMPLETED});
          recomputed on every commit and release
        default: 0
      - name: lifetime_committed_cents
        type: integer
        source: computed
        description: monotonically increasing total of every commitment ever booked against this program
        default: 0
      - name: lifetime_released_cents
        type: integer
        source: computed
        description: monotonically increasing total of every commitment released by a compensating action
        default: 0
      - name: active_item_count
        type: integer
        source: computed
        description: count of ProductItem with gap_id in this program whose development_status NOT IN {RATIONALIZED, DISCONTINUED}
        default: 0
      - name: status
        type: enum
        source: system
        description: program lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, RELAUNCH_FREEZE, CLOSED}"

  - name: CategoryGap
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> BrandProgram.id; program this category gap analysis belongs to
      - name: category_code
        type: string
        source: input
        description: retailer category code (e.g. GROC-PASTA-SAUCE)
      - name: national_brand_name
        type: string
        source: input
        description: national brand used as the benchmark for this category
      - name: nb_retail_price_cents
        type: integer
        source: input
        description: national brand shelf price in cents
        constraints: "> 0"
      - name: category_annual_sales_cents
        type: integer
        source: input
        description: retailer annual category sales in cents
        constraints: ">= 0"
      - name: pl_share_pct
        type: number
        source: input
        description: current private-label unit share of the category, percent
        constraints: "0.0 <= pl_share_pct <= 100.0"
      - name: unit_velocity_per_week
        type: integer
        source: input
        description: category unit velocity per store per week
        constraints: ">= 0"
      - name: shelf_slots_quota
        type: integer
        source: input
        description: number of private-label shelf slots the retailer authorises for this category
        constraints: ">= 1"
      - name: slots_consumed
        type: integer
        source: computed
        description: count of ProductItem with this gap_id whose development_status NOT IN {RATIONALIZED, DISCONTINUED}
        default: 0
      - name: slots_open
        type: integer
        source: computed
        description: shelf_slots_quota - slots_consumed
      - name: slots_consumed_lifetime
        type: integer
        source: computed
        description: monotonically increasing count of slot acquisitions on this gap
        default: 0
      - name: slots_released_lifetime
        type: integer
        source: computed
        description: monotonically increasing count of slot releases on this gap
        default: 0
      - name: gap_score
        type: number
        source: computed
        description: output of calculations.category_gap_score, 2 decimals; null until ANALYZED
      - name: recommended_tier
        type: enum
        source: computed
        description: tier recommended by calculations.category_gap_score
        constraints: "one of {OPENING_PRICE, NBE, PREMIUM}; null until ANALYZED"
      - name: approved_tier
        type: enum
        source: input
        description: tier the program director locks in at tier-decision time
        constraints: "one of {OPENING_PRICE, NBE, PREMIUM}; null until TIER_APPROVED"
      - name: override_justification
        type: string
        source: input
        description: required prose when approved_tier != recommended_tier
      - name: status
        type: enum
        source: system
        description: gap analysis lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ANALYZED, TIER_APPROVED, REJECTED}"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> BrandProgram.id; program the supplier is enrolled in
      - name: legal_name
        type: string
        source: input
        description: supplier legal entity name
      - name: plant_country
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country code of the manufacturing plant
      - name: gfsi_certificate_expiry
        type: datetime
        source: input
        description: expiry instant of the plant GFSI food-safety certificate, ISO 8601 UTC
      - name: qualification_status
        type: enum
        source: system
        description: supplier qualification state
        default: PROSPECT
        constraints: "one of {PROSPECT, QUALIFIED, CONDITIONAL, SUSPENDED, DISQUALIFIED}"
      - name: qualified_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent decision that set qualification_status to QUALIFIED or CONDITIONAL; null while PROSPECT
      - name: composite_score_cached
        type: number
        source: computed
        description: calculations.supplier_composite_score under the rolling_12m variant, 2 decimals; recomputed on audit finalize, complaint create and run completion
      - name: probation_item_count
        type: integer
        source: computed
        description: count of ProductItem with supplier_id == this supplier and quality_posture == PROBATION
        default: 0
      - name: weighted_complaint_points
        type: integer
        source: computed
        description: 5*CRITICAL + 2*MAJOR + 1*MINOR over Complaint rows whose item.supplier_id == this supplier and created_at within the trailing 365 days
        default: 0

  - name: PlantLine
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; supplier plant that owns this production line
      - name: line_code
        type: string
        source: input
        description: line identifier inside the plant, unique per supplier_id
      - name: daily_capacity_units
        type: integer
        source: input
        description: units the line can produce per 24h day
        constraints: "> 0"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: sanitation/changeover buffer applied to BOTH ends of every production window booked on this line
        default: 120
        constraints: ">= 0"

  - name: PlantAudit
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; supplier whose plant is audited
      - name: audit_type
        type: enum
        source: input
        description: capability audit for qualification, or ongoing quality audit after launch
        constraints: "one of {CAPABILITY, ONGOING_QUALITY}"
      - name: window_start
        type: datetime
        source: input
        description: audit window start, ISO 8601 UTC; interval is half-open [window_start, window_end)
      - name: window_end
        type: datetime
        source: input
        description: audit window end, ISO 8601 UTC, must be strictly after window_start
      - name: food_safety_score
        type: integer
        source: input
        description: food-safety pillar score supplied at finalize
        constraints: "0 <= score <= 100"
      - name: sanitation_score
        type: integer
        source: input
        description: sanitation pillar score supplied at finalize
        constraints: "0 <= score <= 100"
      - name: capacity_score
        type: integer
        source: input
        description: capacity pillar score supplied at finalize
        constraints: "0 <= score <= 100"
      - name: traceability_score
        type: integer
        source: input
        description: traceability pillar score supplied at finalize
        constraints: "0 <= score <= 100"
      - name: audited_yield_pct
        type: number
        source: input
        description: line yield measured during the audit, percent; feeds the audited_actual cost variant
        constraints: "0.0 < audited_yield_pct <= 100.0"
      - name: result
        type: enum
        source: computed
        description: PASS when food_safety_score >= 90 and min(all four pillars) >= 80; CONDITIONAL when food_safety_score >= 80 and min(all four) >= 70; otherwise FAIL
        constraints: "one of {PASS, CONDITIONAL, FAIL}; null until FINALIZED"
      - name: status
        type: enum
        source: system
        description: audit lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, FINALIZED}"

  - name: ProductItem
    parent: null
    common_fields: true
    fields:
      - name: gap_id
        type: string
        source: input
        description: FK -> CategoryGap.id; category gap this item fills
      - name: supplier_id
        type: string
        source: computed
        description: FK -> Supplier.id; awarded supplier, set from the accepted CostModel; null until a CostModel is ACCEPTED
      - name: replacement_item_id
        type: string
        source: input
        description: FK -> ProductItem.id; successor item supplied at rationalize time when disposition == REPLACE; null otherwise
      - name: item_name
        type: string
        source: input
        description: private-label item description
      - name: tier
        type: enum
        source: input
        description: price tier of this item; must equal CategoryGap.approved_tier
        constraints: "one of {OPENING_PRICE, NBE, PREMIUM}"
      - name: pack_size_desc
        type: string
        source: input
        description: pack size as printed on the label
      - name: development_status
        type: enum
        source: system
        description: development dimension of the item state, independent of quality_posture
        default: CONCEPT
        constraints: "one of {CONCEPT, SOURCED, BENCHMARKED, PACKAGING_APPROVED, SPEC_LOCKED, LAUNCHED, RELAUNCH_PENDING, RATIONALIZED, DISCONTINUED}"
      - name: quality_posture
        type: enum
        source: system
        description: quality dimension of the item state, independent of development_status
        default: GREEN
        constraints: "one of {GREEN, WATCH, PROBATION, SUSPENDED}"
      - name: trailing_90d_units
        type: integer
        source: input
        description: trailing-90-day shipped units from the retailer shipment feed; denominator of complaint_ppm_90d
        default: 0
        constraints: ">= 0"
      - name: complaint_ppm_90d
        type: number
        source: computed
        description: output of calculations.complaint_ppm_trend, 2 decimals
        default: 0.00
      - name: retail_price_cents
        type: integer
        source: computed
        description: output of calculations.spec_lock_pricing; null until the first Specification is LOCKED
      - name: spec_revision_count
        type: integer
        source: computed
        description: number of Specification rows ever created for this item; incremented on every specification create
        default: 0

  - name: CostModel
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> ProductItem.id; item this quote costs out
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; supplier submitting the quote
      - name: ingredient_cost_cents_per_unit
        type: integer
        source: input
        description: quoted ingredient cost per unit in cents
        constraints: ">= 0"
      - name: packaging_cost_cents_per_unit
        type: integer
        source: input
        description: quoted packaging cost per unit in cents
        constraints: ">= 0"
      - name: conversion_cost_cents_per_unit
        type: integer
        source: input
        description: quoted conversion (labour + overhead) cost per unit in cents
        constraints: ">= 0"
      - name: effective_base_cents
        type: integer
        source: computed
        description: >-
          ingredient_cost_cents_per_unit + packaging_cost_cents_per_unit + conversion_cost_cents_per_unit at
          create; thereafter increased by calculations.cost_change_settlement.net_increase_cents on every
          accepted CostChangeRequest. The three component fields are immutable after create
      - name: quoted_yield_pct
        type: number
        source: input
        description: yield the supplier quotes, percent; used by the as_quoted cost variant
        constraints: "0.0 < quoted_yield_pct <= 100.0"
      - name: freight_cents_per_pallet
        type: integer
        source: input
        description: inbound freight cost per pallet in cents
        constraints: ">= 0"
      - name: units_per_pallet
        type: integer
        source: input
        description: units per pallet, freight amortisation divisor
        constraints: "> 0"
      - name: moq_units
        type: integer
        source: input
        description: minimum order quantity in units
        constraints: "> 0"
      - name: tooling_cents
        type: integer
        source: input
        description: one-time tooling cost in cents, committed against the program when a ProductionRun is scheduled on this model's Specification
        constraints: ">= 0"
      - name: landed_unit_cost_cents_as_quoted
        type: integer
        source: computed
        description: calculations.landed_unit_cost under the as_quoted variant
      - name: landed_unit_cost_cents_audited
        type: integer
        source: computed
        description: calculations.landed_unit_cost under the audited_actual variant; null until a FINALIZED CAPABILITY audit exists for supplier_id
      - name: open_change_request_count
        type: integer
        source: computed
        description: count of CostChangeRequest rows on this model whose status IN {SUBMITTED, COUNTERED}
        default: 0
      - name: status
        type: enum
        source: system
        description: quote lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, REJECTED, SUPERSEDED}"

  - name: ComparisonStudy
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> ProductItem.id; item benchmarked against the national brand
      - name: study_type
        type: enum
        source: input
        description: bench-top cutting by the agency, or blind consumer panel
        constraints: "one of {BENCH_TOP, CONSUMER_PANEL}"
      - name: nb_control_lot_code
        type: string
        source: input
        description: lot code of the national-brand control sample
      - name: appearance_delta
        type: number
        source: input
        description: bench-top appearance delta vs the national brand, BENCH_TOP only
        constraints: "-3.0 <= delta <= 3.0"
      - name: aroma_delta
        type: number
        source: input
        description: bench-top aroma delta vs the national brand, BENCH_TOP only
        constraints: "-3.0 <= delta <= 3.0"
      - name: texture_delta
        type: number
        source: input
        description: bench-top texture delta vs the national brand, BENCH_TOP only
        constraints: "-3.0 <= delta <= 3.0"
      - name: flavor_delta
        type: number
        source: input
        description: bench-top flavor delta vs the national brand, BENCH_TOP only
        constraints: "-3.0 <= delta <= 3.0"
      - name: n_panelists
        type: integer
        source: input
        description: panel size, CONSUMER_PANEL only; must equal prefer_pl_count + prefer_nb_count + no_preference_count
        constraints: ">= 1"
      - name: prefer_pl_count
        type: integer
        source: input
        description: panelists preferring the private-label sample, CONSUMER_PANEL only
        constraints: ">= 0"
      - name: prefer_nb_count
        type: integer
        source: input
        description: panelists preferring the national brand, CONSUMER_PANEL only
        constraints: ">= 0"
      - name: no_preference_count
        type: integer
        source: input
        description: panelists with no preference, CONSUMER_PANEL only; excluded from the preference denominator
        constraints: ">= 0"
      - name: parity_index
        type: number
        source: computed
        description: calculations.bench_top_parity_index output, 2 decimals; null for CONSUMER_PANEL
      - name: preference_share_pct
        type: number
        source: computed
        description: calculations.panel_preference_share output, 2 decimals; null for BENCH_TOP
      - name: verdict
        type: enum
        source: computed
        description: outcome of calculations.bench_top_parity_index (BENCH_TOP) or calculations.panel_preference_share (CONSUMER_PANEL)
        constraints: "one of {SUPERIOR, PARITY, INFERIOR}; null until FINALIZED"
      - name: status
        type: enum
        source: system
        description: study lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED}"

  - name: ArtworkRound
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> ProductItem.id; item whose packaging this round designs
      - name: round_number
        type: integer
        source: computed
        description: 1 + count of pre-existing ArtworkRound rows for item_id, assigned at create
      - name: designer_user_id
        type: string
        source: system
        description: X-User-ID of the PackagingDesigner who created the round
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer who last decided this round; null until reviewed
      - name: serving_size_g
        type: number
        source: input
        description: label serving size in grams, supplied to the nutrition-panel generator
        constraints: "> 0.0"
      - name: servings_per_container
        type: number
        source: input
        description: servings per container as printed
        constraints: "> 0.0"
      - name: fat_g_per_100g
        type: number
        source: input
        description: total fat grams per 100 g of finished product
        constraints: ">= 0.0"
      - name: satfat_g_per_100g
        type: number
        source: input
        description: saturated fat grams per 100 g
        constraints: ">= 0.0"
      - name: carb_g_per_100g
        type: number
        source: input
        description: total carbohydrate grams per 100 g
        constraints: ">= 0.0"
      - name: fiber_g_per_100g
        type: number
        source: input
        description: dietary fiber grams per 100 g
        constraints: ">= 0.0"
      - name: sugars_g_per_100g
        type: number
        source: input
        description: total sugars grams per 100 g
        constraints: ">= 0.0"
      - name: added_sugars_g_per_100g
        type: number
        source: input
        description: added sugars grams per 100 g
        constraints: ">= 0.0"
      - name: protein_g_per_100g
        type: number
        source: input
        description: protein grams per 100 g
        constraints: ">= 0.0"
      - name: sodium_mg_per_100g
        type: number
        source: input
        description: sodium milligrams per 100 g
        constraints: ">= 0.0"
      - name: declared_calories
        type: integer
        source: computed
        description: calories per serving as printed, from calculations.nutrition_panel_declaration
      - name: declared_fat_g
        type: number
        source: computed
        description: declared total fat grams per serving
      - name: declared_satfat_g
        type: number
        source: computed
        description: declared saturated fat grams per serving
      - name: declared_carb_g
        type: number
        source: computed
        description: declared total carbohydrate grams per serving
      - name: declared_fiber_g
        type: number
        source: computed
        description: declared dietary fiber grams per serving
      - name: declared_sugars_g
        type: number
        source: computed
        description: declared total sugars grams per serving
      - name: declared_added_sugars_g
        type: number
        source: computed
        description: declared added sugars grams per serving
      - name: declared_protein_g
        type: number
        source: computed
        description: declared protein grams per serving
      - name: declared_sodium_mg
        type: integer
        source: computed
        description: declared sodium milligrams per serving
      - name: nutrition_status
        type: enum
        source: system
        description: nutrition-panel dimension of the round state, independent of status
        default: NOT_GENERATED
        constraints: "one of {NOT_GENERATED, VALID, INVALIDATED}"
      - name: status
        type: enum
        source: system
        description: artwork review lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED, SUPERSEDED}"

  - name: LabelClaim
    parent: null
    common_fields: true
    fields:
      - name: artwork_round_id
        type: string
        source: input
        description: FK -> ArtworkRound.id; artwork round carrying this claim
      - name: claim_text
        type: string
        source: input
        description: claim exactly as printed on the package
      - name: claim_type
        type: enum
        source: input
        description: regulatory class of the claim
        constraints: "one of {NUTRIENT_CONTENT, HEALTH, ORGANIC, FREE_FROM, STRUCTURE_FUNCTION}"
      - name: substantiation_ref
        type: string
        source: input
        description: lab report or certificate reference substantiating the claim; required when claim_type IN {HEALTH, ORGANIC}
      - name: depends_on_nutrition
        type: boolean
        source: computed
        description: true when claim_type IN {NUTRIENT_CONTENT, HEALTH}; these claims are rescinded when the round's nutrition_status becomes INVALIDATED
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the user who created the claim
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer who decided the claim; null while PENDING
      - name: rationale
        type: string
        source: input
        description: reviewer rationale recorded at review time
      - name: status
        type: enum
        source: system
        description: claim review state
        default: PENDING
        constraints: "one of {PENDING, APPROVED, REJECTED, RESCINDED}"

  - name: Specification
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> ProductItem.id; item this specification governs
      - name: pinned_cost_model_id
        type: string
        source: input
        description: FK -> CostModel.id; cost model pinned into the specification
      - name: pinned_cost_model_version
        type: integer
        source: computed
        description: CostModel.version observed at specification create; a later CostModel version makes this pin stale
      - name: pinned_artwork_round_id
        type: string
        source: input
        description: FK -> ArtworkRound.id; artwork round pinned into the specification
      - name: pinned_artwork_version
        type: integer
        source: computed
        description: ArtworkRound.version observed at specification create; a later ArtworkRound version makes this pin stale
      - name: revision_no
        type: integer
        source: computed
        description: ProductItem.spec_revision_count after this specification was created, i.e. this specification's ordinal for the item
      - name: slotting_fee_cents
        type: integer
        source: computed
        description: calculations.spec_lock_pricing output; committed against BrandProgram.committed_budget_cents at lock
      - name: locked_at
        type: datetime
        source: system
        description: logical-clock instant the specification was locked; null while DRAFT
      - name: locked_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramDirector who locked the specification; a ProductionRun on this specification may not be approved by the same user
      - name: status
        type: enum
        source: system
        description: specification lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, LOCKED, SUPERSEDE_PENDING, SUPERSEDED}"

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> ProductItem.id; item being produced
      - name: specification_id
        type: string
        source: input
        description: FK -> Specification.id; specification the run is produced against; must have item_id equal to this run's item_id
      - name: plant_line_id
        type: string
        source: input
        description: FK -> PlantLine.id; line the run occupies
      - name: run_type
        type: enum
        source: input
        description: first production run gating launch, or an ongoing replenishment run
        constraints: "one of {FIRST_PRODUCTION, ONGOING}"
      - name: window_start
        type: datetime
        source: input
        description: run window start, ISO 8601 UTC; interval is closed [window_start, window_end] and expanded by PlantLine.changeover_buffer_minutes on both ends for conflict detection
      - name: window_end
        type: datetime
        source: input
        description: run window end, ISO 8601 UTC, must be strictly after window_start
      - name: planned_units
        type: integer
        source: input
        description: units planned for the run
        constraints: "> 0"
      - name: produced_units
        type: integer
        source: input
        description: units actually produced, supplied at completion
        constraints: ">= 0"
      - name: completed_on_time
        type: boolean
        source: input
        description: whether the run finished inside its window, supplied at completion; feeds the scorecard delivery component
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the run was completed; null until COMPLETED
      - name: committed_tooling_cents
        type: integer
        source: computed
        description: CostModel.tooling_cents of the specification's pinned cost model, snapshotted and committed to the program at scheduling time
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramDirector who approved the run; null until APPROVED
      - name: hold_reason
        type: string
        source: system
        description: reason recorded when the run was moved to HOLD by a cascade; null unless HOLD was ever applied
      - name: status
        type: enum
        source: system
        description: run lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, APPROVED, HOLD, COMPLETED, CANCELLED}"

  - name: Complaint
    parent: null
    common_fields: false
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> ProductItem.id; item complained about
      - name: defect_category
        type: enum
        source: input
        description: defect family of the complaint
        constraints: "one of {FOREIGN_MATERIAL, SPOILAGE, PACKAGING, LABEL, SENSORY}"
      - name: severity
        type: enum
        source: input
        description: severity class; weights 5 (CRITICAL), 2 (MAJOR), 1 (MINOR) in complaint trending
        constraints: "one of {CRITICAL, MAJOR, MINOR}"
      - name: lot_code
        type: string
        source: input
        description: production lot code cited by the consumer
      - name: narrative
        type: string
        source: input
        description: consumer narrative as logged by the quality desk
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant the complaint was logged; equals created_at and is the trending window reference time

  - name: CostChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: FK -> ProductItem.id; item whose cost the supplier wants to change
      - name: cost_model_id
        type: string
        source: input
        description: FK -> CostModel.id; ACCEPTED cost model the request re-prices
      - name: requested_ingredient_cost_cents_per_unit
        type: integer
        source: input
        description: newly requested ingredient cost per unit in cents
        constraints: ">= 0"
      - name: requested_packaging_cost_cents_per_unit
        type: integer
        source: input
        description: newly requested packaging cost per unit in cents
        constraints: ">= 0"
      - name: requested_conversion_cost_cents_per_unit
        type: integer
        source: input
        description: newly requested conversion cost per unit in cents
        constraints: ">= 0"
      - name: substitution_scope
        type: enum
        source: input
        description: material substitution the cost change depends on; INGREDIENT substitutions invalidate the nutrition panel
        constraints: "one of {NONE, PACKAGING_MATERIAL, INGREDIENT}"
      - name: substitution_material_desc
        type: string
        source: input
        description: description of the substituted material; required when substitution_scope != NONE
      - name: counter_base_cents
        type: integer
        source: input
        description: total base cost per unit the agency counters with, supplied at counter time
        constraints: ">= 0"
      - name: round_number
        type: integer
        source: computed
        description: negotiation round, 1 at create and incremented on every revise
        default: 1
      - name: raw_increase_cents
        type: integer
        source: computed
        description: calculations.cost_change_settlement step 3 output
      - name: increase_pct
        type: number
        source: computed
        description: calculations.cost_change_settlement step 4 output, 2 decimals
      - name: escalation_tier
        type: enum
        source: computed
        description: calculations.cost_change_settlement step 5 output; T2 and T3 may only be accepted by ProgramDirector
        constraints: "one of {T1, T2, T3}"
      - name: capped_increase_cents
        type: integer
        source: computed
        description: calculations.cost_change_settlement step 7 output
      - name: offset_fee_cents
        type: integer
        source: computed
        description: calculations.cost_change_settlement step 8 output
      - name: net_increase_cents
        type: integer
        source: computed
        description: calculations.cost_change_settlement step 9 output; added to CostModel.effective_base_cents on acceptance
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the agency user who accepted or rejected the request; null until decided
      - name: status
        type: enum
        source: system
        description: negotiation state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, COUNTERED, ACCEPTED, REJECTED, WITHDRAWN}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BrandProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: RELAUNCH_FREEZE
        trigger: "POST /private-label/programs/{program_id}/lifecycle with action=START_RELAUNCH"
        actor: ProgramDirector
        preconditions:
          - "program.status == ACTIVE"
          - "at least one ProductItem whose gap_id belongs to this program has development_status IN {LAUNCHED, RELAUNCH_PENDING}"
        side_effects:
          - "program.status := RELAUNCH_FREEZE"
          - "increments BrandProgram.version by 1"
        note: "While RELAUNCH_FREEZE, POST /private-label/items and POST /private-label/specifications/{specification_id}/lock are rejected with ERR_PROGRAM_RELAUNCH_FROZEN; rationalization stays open."
      - from: RELAUNCH_FREEZE
        to: ACTIVE
        trigger: "POST /private-label/programs/{program_id}/lifecycle with action=COMPLETE_RELAUNCH"
        actor: ProgramDirector
        preconditions:
          - "program.status == RELAUNCH_FREEZE"
          - "no ProductItem in this program has development_status == RELAUNCH_PENDING"
        side_effects:
          - "program.status := ACTIVE"
          - "increments BrandProgram.version by 1"
        note: "ACTIVE -> RELAUNCH_FREEZE -> ACTIVE is a cycle; a program may be relaunched repeatedly."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /private-label/programs/{program_id}/lifecycle with action=CLOSE"
        actor: ProgramDirector
        preconditions:
          - "program.status == ACTIVE"
          - "no ProductionRun on an item of this program has status IN {SCHEDULED, APPROVED, HOLD}"
        side_effects:
          - "program.status := CLOSED"
          - "every CategoryGap of this program with status IN {DRAFT, ANALYZED} transitions to REJECTED (cascade down, conditional on non-terminal status)"
          - "increments BrandProgram.version by 1"

  - entity: CategoryGap
    initial_state: DRAFT
    terminal_states: [TIER_APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: ANALYZED
        trigger: "POST /private-label/category-gaps/{gap_id}/analyze"
        actor: SourcingManager
        preconditions:
          - "gap.status == DRAFT"
          - "program.status == ACTIVE"
        side_effects:
          - "gap.gap_score := calculations.category_gap_score.gap_score"
          - "gap.recommended_tier := calculations.category_gap_score.recommended_tier"
          - "gap.status := ANALYZED"
          - "increments CategoryGap.version by 1"
      - from: ANALYZED
        to: ANALYZED
        trigger: "POST /private-label/category-gaps/{gap_id}/analyze (re-analysis self-loop)"
        actor: SourcingManager
        preconditions:
          - "gap.status == ANALYZED"
          - "program.status == ACTIVE"
        side_effects:
          - "gap.gap_score and gap.recommended_tier are recomputed from the current field values"
          - "increments CategoryGap.version by 1"
      - from: ANALYZED
        to: TIER_APPROVED
        trigger: "POST /private-label/category-gaps/{gap_id}/tier-decision with decision=APPROVE"
        actor: ProgramDirector
        preconditions:
          - "gap.status == ANALYZED"
          - "approved_tier is a member of {OPENING_PRICE, NBE, PREMIUM}"
          - "override_justification is non-empty when approved_tier != gap.recommended_tier"
        side_effects:
          - "gap.approved_tier := payload.approved_tier"
          - "gap.status := TIER_APPROVED"
          - "increments CategoryGap.version by 1"
      - from: ANALYZED
        to: REJECTED
        trigger: "POST /private-label/category-gaps/{gap_id}/tier-decision with decision=REJECT"
        actor: ProgramDirector
        preconditions:
          - "gap.status == ANALYZED"
        side_effects:
          - "gap.status := REJECTED"
          - "increments CategoryGap.version by 1"

  - entity: Supplier
    initial_state: PROSPECT
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PROSPECT
        to: QUALIFIED
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=QUALIFY"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status == PROSPECT"
          - "basis_audit_id references a PlantAudit with supplier_id == supplier.id, audit_type == CAPABILITY, status == FINALIZED and result == PASS"
          - "supplier.gfsi_certificate_expiry > logical clock now"
        side_effects:
          - "supplier.qualification_status := QUALIFIED"
          - "supplier.qualified_at := logical clock now"
          - "supplier.composite_score_cached := calculations.supplier_composite_score under variant rolling_12m"
          - "increments Supplier.version by 1"
      - from: PROSPECT
        to: CONDITIONAL
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=CONDITIONAL"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status == PROSPECT"
          - "basis_audit_id references a FINALIZED CAPABILITY PlantAudit for this supplier whose result IN {PASS, CONDITIONAL}"
          - "supplier.gfsi_certificate_expiry > logical clock now"
        side_effects:
          - "supplier.qualification_status := CONDITIONAL"
          - "supplier.qualified_at := logical clock now"
          - "increments Supplier.version by 1"
      - from: QUALIFIED
        to: QUALIFIED
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=QUALIFY (annual recertification self-loop)"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status == QUALIFIED"
          - "basis_audit_id references a FINALIZED CAPABILITY PlantAudit for this supplier with result == PASS whose window_end > supplier.qualified_at"
          - "supplier.gfsi_certificate_expiry > logical clock now"
        side_effects:
          - "supplier.qualified_at := logical clock now (this resets the period_to_date scorecard window)"
          - "supplier.composite_score_cached := calculations.supplier_composite_score under variant rolling_12m"
          - "increments Supplier.version by 1"
      - from: CONDITIONAL
        to: QUALIFIED
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=QUALIFY"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status == CONDITIONAL"
          - "basis_audit_id references a FINALIZED CAPABILITY PlantAudit for this supplier with result == PASS whose window_end > supplier.qualified_at"
          - "supplier.gfsi_certificate_expiry > logical clock now"
        side_effects:
          - "supplier.qualification_status := QUALIFIED"
          - "supplier.qualified_at := logical clock now"
          - "every ProductionRun with status == HOLD whose item.supplier_id == supplier.id transitions to SCHEDULED (cascade down, conditional on HOLD)"
          - "increments Supplier.version by 1"
      - from: QUALIFIED
        to: CONDITIONAL
        trigger: "system event: ProductItem.quality_posture became PROBATION and supplier.probation_item_count >= 2"
        actor: system
        preconditions:
          - "supplier.qualification_status == QUALIFIED"
          - "supplier.probation_item_count >= 2 after the posture recomputation"
        side_effects:
          - "supplier.qualification_status := CONDITIONAL"
          - "every ProductionRun whose item.supplier_id == supplier.id and status IN {SCHEDULED, APPROVED} transitions to HOLD with hold_reason = SUPPLIER_CONDITIONAL (cascade caused by this transition, not by the complaint)"
          - "increments Supplier.version by 1"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=SUSPEND"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status IN {QUALIFIED, CONDITIONAL}"
        side_effects:
          - "supplier.qualification_status := SUSPENDED"
          - "every ProductItem with supplier_id == supplier.id and development_status NOT IN {RATIONALIZED, DISCONTINUED} has quality_posture := SUSPENDED"
          - "every ProductionRun whose item.supplier_id == supplier.id and status IN {SCHEDULED, APPROVED} transitions to HOLD with hold_reason = SUPPLIER_SUSPENDED"
          - "increments Supplier.version by 1"
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=SUSPEND"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status == CONDITIONAL"
        side_effects:
          - "same side effects as the QUALIFIED -> SUSPENDED transition"
          - "increments Supplier.version by 1"
      - from: SUSPENDED
        to: CONDITIONAL
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=REINSTATE"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status == SUSPENDED"
          - "basis_audit_id references a FINALIZED CAPABILITY PlantAudit for this supplier with result IN {PASS, CONDITIONAL} whose window_end > supplier.qualified_at"
        side_effects:
          - "supplier.qualification_status := CONDITIONAL"
          - "supplier.qualified_at := logical clock now"
          - "every ProductItem with supplier_id == supplier.id and quality_posture == SUSPENDED has quality_posture recomputed by calculations.complaint_ppm_trend (SUSPENDED clears only here)"
          - "increments Supplier.version by 1"
        note: "SUSPENDED -> CONDITIONAL -> QUALIFIED closes the qualification cycle."
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision=DISQUALIFY"
        actor: ProgramDirector
        preconditions:
          - "supplier.qualification_status == SUSPENDED"
          - "no ProductionRun whose item.supplier_id == supplier.id has status IN {SCHEDULED, APPROVED}"
        side_effects:
          - "supplier.qualification_status := DISQUALIFIED"
          - "increments Supplier.version by 1"

  - entity: PlantAudit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: FINALIZED
        trigger: "POST /private-label/plant-audits/{plant_audit_id}/finalize"
        actor: QualityAuditor
        preconditions:
          - "audit.status == SCHEDULED"
          - "all four pillar scores and audited_yield_pct present in the payload"
        side_effects:
          - "audit.result := PASS | CONDITIONAL | FAIL per the entity field rule"
          - "audit.status := FINALIZED"
          - "for every CostModel with supplier_id == audit.supplier_id and status IN {SUBMITTED, ACCEPTED}: landed_unit_cost_cents_audited := calculations.landed_unit_cost variant audited_actual, and CostModel.version increments by 1"
          - "supplier.composite_score_cached := calculations.supplier_composite_score under variant rolling_12m"
          - "increments PlantAudit.version by 1"

  - entity: ProductItem
    dimension: development_status
    initial_state: CONCEPT
    terminal_states: [RATIONALIZED, DISCONTINUED]
    transitions:
      - from: CONCEPT
        to: SOURCED
        trigger: "POST /private-label/cost-models/{cost_model_id}/decision with decision=ACCEPT"
        actor: SourcingManager
        preconditions:
          - "item.development_status == CONCEPT"
          - "cost_model.status == SUBMITTED"
          - "supplier.qualification_status IN {QUALIFIED, CONDITIONAL}"
        side_effects:
          - "item.supplier_id := cost_model.supplier_id"
          - "item.development_status := SOURCED"
          - "every other CostModel for this item with status == SUBMITTED transitions to SUPERSEDED"
          - "increments ProductItem.version by 1"
      - from: SOURCED
        to: BENCHMARKED
        trigger: "system event on POST /private-label/comparison-studies/{study_id}/finalize when the tier benchmark gate is satisfied"
        actor: system
        preconditions:
          - "item.development_status == SOURCED"
          - "tier == OPENING_PRICE: a FINALIZED BENCH_TOP study for the item with parity_index >= 70.00 exists"
          - "tier == NBE: a FINALIZED BENCH_TOP study with parity_index >= 85.00 AND a FINALIZED CONSUMER_PANEL study with verdict IN {PARITY, SUPERIOR} exist"
          - "tier == PREMIUM: a FINALIZED BENCH_TOP study with parity_index >= 92.00 and flavor_delta >= 0.0 AND a FINALIZED CONSUMER_PANEL study with verdict == SUPERIOR exist"
        side_effects:
          - "item.development_status := BENCHMARKED"
          - "increments ProductItem.version by 1"
        note: "One-way gate: the auto-transition is evaluated only while development_status == SOURCED, so a later weaker study never reverts the item."
      - from: BENCHMARKED
        to: PACKAGING_APPROVED
        trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/review with decision=APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "item.development_status == BENCHMARKED"
          - "artwork_round.status == IN_REVIEW"
        side_effects:
          - "item.development_status := PACKAGING_APPROVED"
          - "increments ProductItem.version by 1"
      - from: PACKAGING_APPROVED
        to: SPEC_LOCKED
        trigger: "POST /private-label/specifications/{specification_id}/lock"
        actor: ProgramDirector
        preconditions:
          - "item.development_status == PACKAGING_APPROVED"
          - "specification.status == DRAFT"
        side_effects:
          - "item.retail_price_cents := calculations.spec_lock_pricing.retail_price_cents"
          - "item.development_status := SPEC_LOCKED"
          - "increments ProductItem.version by 1"
      - from: SPEC_LOCKED
        to: LAUNCHED
        trigger: "POST /private-label/items/{item_id}/launch"
        actor: ProgramDirector
        preconditions:
          - "item.development_status == SPEC_LOCKED"
          - "a ProductionRun for this item with run_type == FIRST_PRODUCTION and status == COMPLETED exists"
          - "item.quality_posture != SUSPENDED"
        side_effects:
          - "item.development_status := LAUNCHED"
          - "increments ProductItem.version by 1"
      - from: LAUNCHED
        to: RELAUNCH_PENDING
        trigger: "system event: at least one LabelClaim on the specification's pinned artwork round was RESCINDED by the nutrition-invalidation cascade"
        actor: system
        preconditions:
          - "item.development_status == LAUNCHED"
        side_effects:
          - "item.development_status := RELAUNCH_PENDING"
          - "increments ProductItem.version by 1"
      - from: RELAUNCH_PENDING
        to: LAUNCHED
        trigger: "POST /private-label/items/{item_id}/launch (relaunch after a new specification is locked)"
        actor: ProgramDirector
        preconditions:
          - "item.development_status == RELAUNCH_PENDING"
          - "a Specification for this item with status == LOCKED whose revision_no == item.spec_revision_count exists"
          - "the pinned artwork round of that specification has nutrition_status == VALID and no LabelClaim on it with status IN {PENDING, RESCINDED}"
        side_effects:
          - "item.development_status := LAUNCHED"
          - "increments ProductItem.version by 1"
        note: "LAUNCHED -> RELAUNCH_PENDING -> LAUNCHED is a cycle; the relaunch may repeat for every accepted ingredient substitution."
      - from: LAUNCHED
        to: RATIONALIZED
        trigger: "POST /private-label/items/{item_id}/rationalize with disposition=REPLACE"
        actor: ProgramDirector
        preconditions:
          - "item.development_status IN {LAUNCHED, RELAUNCH_PENDING}"
          - "replacement_item_id references a ProductItem with the same gap_id, id != item.id and development_status NOT IN {RATIONALIZED, DISCONTINUED}"
        side_effects:
          - "item.replacement_item_id := payload.replacement_item_id"
          - "item.development_status := RATIONALIZED"
          - "gap.slots_consumed decreases by 1 and gap.slots_released_lifetime increases by 1"
          - "program.active_item_count decreases by 1"
          - "every ProductionRun for this item with status IN {SCHEDULED, APPROVED, HOLD} transitions to CANCELLED (conditional cascade on non-terminal runs), each releasing its committed tooling"
          - "increments ProductItem.version by 1"
      - from: RELAUNCH_PENDING
        to: DISCONTINUED
        trigger: "POST /private-label/items/{item_id}/rationalize with disposition=DISCONTINUE"
        actor: ProgramDirector
        preconditions:
          - "item.development_status IN {LAUNCHED, RELAUNCH_PENDING}"
          - "payload carries no replacement_item_id"
        side_effects:
          - "item.development_status := DISCONTINUED"
          - "gap.slots_consumed decreases by 1 and gap.slots_released_lifetime increases by 1"
          - "program.active_item_count decreases by 1"
          - "every ProductionRun for this item with status IN {SCHEDULED, APPROVED, HOLD} transitions to CANCELLED, each releasing its committed tooling"
          - "increments ProductItem.version by 1"
      - from: LAUNCHED
        to: DISCONTINUED
        trigger: "POST /private-label/items/{item_id}/rationalize with disposition=DISCONTINUE"
        actor: ProgramDirector
        preconditions:
          - "item.development_status == LAUNCHED"
        side_effects:
          - "identical to the RELAUNCH_PENDING -> DISCONTINUED transition"
          - "increments ProductItem.version by 1"

  - entity: ProductItem
    dimension: quality_posture
    initial_state: GREEN
    terminal_states: []
    transitions:
      - from: GREEN
        to: WATCH
        trigger: "POST /private-label/complaints or POST /private-label/items/{item_id}/shipment-feed recomputing calculations.complaint_ppm_trend"
        actor: system
        preconditions:
          - "item.quality_posture == GREEN"
          - "the recomputed posture per calculations.complaint_ppm_trend equals WATCH"
        side_effects:
          - "item.quality_posture := WATCH"
          - "increments ProductItem.version by 1"
      - from: WATCH
        to: PROBATION
        trigger: "POST /private-label/complaints or POST /private-label/items/{item_id}/shipment-feed recomputing calculations.complaint_ppm_trend"
        actor: system
        preconditions:
          - "item.quality_posture IN {GREEN, WATCH}"
          - "the recomputed posture equals PROBATION (complaint_ppm_90d >= 150.00)"
        side_effects:
          - "item.quality_posture := PROBATION"
          - "supplier.probation_item_count is recomputed; when it reaches >= 2 and supplier.qualification_status == QUALIFIED the supplier transitions QUALIFIED -> CONDITIONAL (next hop of the cascade)"
          - "increments ProductItem.version by 1"
      - from: PROBATION
        to: WATCH
        trigger: "POST /private-label/items/{item_id}/shipment-feed recomputing calculations.complaint_ppm_trend after the denominator grows"
        actor: system
        preconditions:
          - "item.quality_posture == PROBATION"
          - "the recomputed posture equals WATCH or GREEN"
        side_effects:
          - "item.quality_posture := the recomputed posture"
          - "supplier.probation_item_count is recomputed"
          - "increments ProductItem.version by 1"
        note: "GREEN <-> WATCH <-> PROBATION is bidirectional; the posture dimension moves independently of development_status."
      - from: WATCH
        to: SUSPENDED
        trigger: "system event: supplier transitioned to SUSPENDED"
        actor: system
        preconditions:
          - "item.supplier_id == the suspended supplier"
          - "item.development_status NOT IN {RATIONALIZED, DISCONTINUED}"
        side_effects:
          - "item.quality_posture := SUSPENDED"
          - "increments ProductItem.version by 1"
        note: "Applies from any of {GREEN, WATCH, PROBATION}. Recomputation from complaint trending never sets or clears SUSPENDED."
      - from: SUSPENDED
        to: GREEN
        trigger: "system event: supplier transitioned SUSPENDED -> CONDITIONAL via decision=REINSTATE"
        actor: system
        preconditions:
          - "item.quality_posture == SUSPENDED"
        side_effects:
          - "item.quality_posture := the posture recomputed by calculations.complaint_ppm_trend (GREEN, WATCH or PROBATION)"
          - "increments ProductItem.version by 1"

  - entity: CostModel
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /private-label/cost-models/{cost_model_id}/decision with decision=ACCEPT"
        actor: SourcingManager
        preconditions:
          - "cost_model.status == SUBMITTED"
          - "item.development_status == CONCEPT"
          - "supplier.qualification_status IN {QUALIFIED, CONDITIONAL}"
        side_effects:
          - "cost_model.status := ACCEPTED"
          - "item.supplier_id := cost_model.supplier_id and item.development_status := SOURCED"
          - "increments CostModel.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /private-label/cost-models/{cost_model_id}/decision with decision=REJECT"
        actor: SourcingManager
        preconditions:
          - "cost_model.status == SUBMITTED"
        side_effects:
          - "cost_model.status := REJECTED"
          - "increments CostModel.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system event: a sibling CostModel for the same item was ACCEPTED"
        actor: system
        preconditions:
          - "cost_model.status == SUBMITTED"
          - "another CostModel for the same item_id transitioned to ACCEPTED"
        side_effects:
          - "cost_model.status := SUPERSEDED"
          - "increments CostModel.version by 1"

  - entity: ComparisonStudy
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /private-label/comparison-studies/{study_id}/finalize"
        actor: QualityAuditor
        preconditions:
          - "study.status == DRAFT"
          - "item.development_status IN {SOURCED, BENCHMARKED}"
        side_effects:
          - "study_type == BENCH_TOP: study.parity_index and study.verdict := calculations.bench_top_parity_index outputs"
          - "study_type == CONSUMER_PANEL: study.preference_share_pct and study.verdict := calculations.panel_preference_share outputs"
          - "study.status := FINALIZED"
          - "when item.development_status == SOURCED and the tier benchmark gate is now satisfied, the item auto-transitions SOURCED -> BENCHMARKED"
          - "increments ComparisonStudy.version by 1"

  - entity: ArtworkRound
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/submit"
        actor: PackagingDesigner
        preconditions:
          - "artwork_round.status == DRAFT"
          - "artwork_round.nutrition_status == VALID"
          - "at least one LabelClaim exists for this round"
        side_effects:
          - "artwork_round.status := IN_REVIEW"
          - "increments ArtworkRound.version by 1"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/review with decision=REQUEST_CHANGES"
        actor: RegulatoryReviewer
        preconditions:
          - "artwork_round.status == IN_REVIEW"
        side_effects:
          - "artwork_round.status := CHANGES_REQUESTED"
          - "artwork_round.reviewer_user_id := X-User-ID"
          - "increments ArtworkRound.version by 1"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/submit (resubmission after changes)"
        actor: PackagingDesigner
        preconditions:
          - "artwork_round.status == CHANGES_REQUESTED"
          - "artwork_round.nutrition_status == VALID"
        side_effects:
          - "artwork_round.status := IN_REVIEW"
          - "increments ArtworkRound.version by 1"
        note: "IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW is the revision loop; it may repeat without limit."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/review with decision=APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "artwork_round.status == IN_REVIEW"
          - "artwork_round.nutrition_status == VALID"
          - "no LabelClaim on this round has status IN {PENDING, REJECTED}"
          - "item.development_status == BENCHMARKED"
        side_effects:
          - "artwork_round.status := APPROVED and artwork_round.reviewer_user_id := X-User-ID"
          - "every other ArtworkRound for the same item with status == APPROVED transitions to SUPERSEDED"
          - "item.development_status := PACKAGING_APPROVED"
          - "increments ArtworkRound.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: a later ArtworkRound for the same item was APPROVED"
        actor: system
        preconditions:
          - "artwork_round.status == APPROVED"
        side_effects:
          - "artwork_round.status := SUPERSEDED"
          - "increments ArtworkRound.version by 1"

  - entity: ArtworkRound
    dimension: nutrition_status
    initial_state: NOT_GENERATED
    terminal_states: []
    transitions:
      - from: NOT_GENERATED
        to: VALID
        trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/nutrition-panel"
        actor: PackagingDesigner
        preconditions:
          - "artwork_round.status IN {DRAFT, CHANGES_REQUESTED}"
        side_effects:
          - "the ten nutrition input fields are stored and the nine declared_* fields := calculations.nutrition_panel_declaration outputs"
          - "artwork_round.nutrition_status := VALID"
          - "increments ArtworkRound.version by 1"
      - from: VALID
        to: INVALIDATED
        trigger: "system event: the Specification pinning this round entered SUPERSEDE_PENDING through an accepted CostChangeRequest whose substitution_scope == INGREDIENT"
        actor: system
        preconditions:
          - "artwork_round.nutrition_status == VALID"
          - "specification.pinned_artwork_round_id == artwork_round.id"
        side_effects:
          - "artwork_round.nutrition_status := INVALIDATED"
          - "every LabelClaim on this round with depends_on_nutrition == true and status == APPROVED transitions to RESCINDED (next hop of the cascade)"
          - "increments ArtworkRound.version by 1"
        note: "Conditional cascade: a PACKAGING_MATERIAL or NONE substitution leaves nutrition_status VALID."
      - from: INVALIDATED
        to: VALID
        trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/nutrition-panel (regeneration on a new round)"
        actor: PackagingDesigner
        preconditions:
          - "artwork_round.nutrition_status == INVALIDATED"
          - "artwork_round.status IN {DRAFT, CHANGES_REQUESTED}"
        side_effects:
          - "declared_* fields recomputed and artwork_round.nutrition_status := VALID"
          - "increments ArtworkRound.version by 1"

  - entity: LabelClaim
    initial_state: PENDING
    terminal_states: [REJECTED, RESCINDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /private-label/label-claims/{label_claim_id}/review with decision=APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "claim.status == PENDING"
          - "X-User-ID != claim.submitted_by_user_id"
          - "artwork_round.status IN {DRAFT, IN_REVIEW, CHANGES_REQUESTED}"
        side_effects:
          - "claim.status := APPROVED and claim.reviewed_by_user_id := X-User-ID"
          - "increments LabelClaim.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /private-label/label-claims/{label_claim_id}/review with decision=REJECT"
        actor: RegulatoryReviewer
        preconditions:
          - "claim.status == PENDING"
          - "X-User-ID != claim.submitted_by_user_id"
        side_effects:
          - "claim.status := REJECTED and claim.reviewed_by_user_id := X-User-ID"
          - "increments LabelClaim.version by 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "system event: the artwork round's nutrition_status became INVALIDATED"
        actor: system
        preconditions:
          - "claim.status == APPROVED"
          - "claim.depends_on_nutrition == true"
        side_effects:
          - "claim.status := RESCINDED"
          - "when the claim's artwork round is pinned by a Specification whose item is LAUNCHED, that item transitions LAUNCHED -> RELAUNCH_PENDING (final hop of the cascade)"
          - "increments LabelClaim.version by 1"

  - entity: Specification
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /private-label/specifications/{specification_id}/lock"
        actor: ProgramDirector
        preconditions:
          - "specification.status == DRAFT"
          - "program.status == ACTIVE"
          - "item.development_status IN {PACKAGING_APPROVED, RELAUNCH_PENDING}"
          - "supplier.qualification_status == QUALIFIED (cross-entity gate on the item's awarded supplier)"
          - "specification.pinned_cost_model_version == the pinned CostModel's current version"
          - "specification.pinned_artwork_version == the pinned ArtworkRound's current version"
          - "the pinned ArtworkRound has status == APPROVED and nutrition_status == VALID"
          - "program.committed_budget_cents + calculations.spec_lock_pricing.slotting_fee_cents <= program.dev_budget_cents"
        side_effects:
          - "specification.slotting_fee_cents := calculations.spec_lock_pricing.slotting_fee_cents"
          - "specification.status := LOCKED, locked_at := logical clock now, locked_by_user_id := X-User-ID"
          - "item.retail_price_cents := calculations.spec_lock_pricing.retail_price_cents"
          - "program.committed_budget_cents += slotting_fee_cents and program.lifetime_committed_cents += slotting_fee_cents"
          - "any other Specification for this item with status IN {LOCKED, SUPERSEDE_PENDING} transitions to SUPERSEDED (its slotting fee stays committed)"
          - "when item.development_status == PACKAGING_APPROVED it transitions to SPEC_LOCKED; when it is RELAUNCH_PENDING the development dimension is left unchanged"
          - "increments Specification.version by 1"
      - from: LOCKED
        to: SUPERSEDE_PENDING
        trigger: "system event: a CostChangeRequest against this specification's pinned CostModel was ACCEPTED"
        actor: system
        preconditions:
          - "specification.status == LOCKED"
          - "specification.pinned_cost_model_id == the accepted request's cost_model_id"
        side_effects:
          - "specification.status := SUPERSEDE_PENDING"
          - "when the accepted request's substitution_scope == INGREDIENT, the ArtworkRound identified by specification.pinned_artwork_round_id transitions nutrition_status VALID -> INVALIDATED (next hop of the cascade)"
          - "increments Specification.version by 1"
        note: "Only an accepted CostChangeRequest supersedes a locked specification; an audit-driven cost recompute bumps CostModel.version without touching specification.status."
      - from: SUPERSEDE_PENDING
        to: SUPERSEDED
        trigger: "system event: a newer Specification for the same item was LOCKED"
        actor: system
        preconditions:
          - "specification.status IN {LOCKED, SUPERSEDE_PENDING}"
        side_effects:
          - "specification.status := SUPERSEDED"
          - "increments Specification.version by 1"

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: APPROVED
        trigger: "POST /private-label/production-runs/{production_run_id}/approve"
        actor: ProgramDirector
        preconditions:
          - "run.status == SCHEDULED"
          - "specification.status == LOCKED (cross-entity gate; a SUPERSEDE_PENDING specification blocks approval)"
          - "item.quality_posture != SUSPENDED"
          - "X-User-ID != specification.locked_by_user_id (segregation of duties)"
        side_effects:
          - "run.status := APPROVED and run.approved_by_user_id := X-User-ID"
          - "increments ProductionRun.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /private-label/production-runs/{production_run_id}/complete"
        actor: QualityAuditor
        preconditions:
          - "run.status == APPROVED"
          - "logical clock now >= run.window_end"
        side_effects:
          - "run.status := COMPLETED, produced_units and completed_on_time stored, completed_at := logical clock now"
          - "supplier.composite_score_cached := calculations.supplier_composite_score under variant rolling_12m"
          - "increments ProductionRun.version by 1"
        note: "committed_tooling_cents stays committed on completion; only CANCELLED releases it."
      - from: SCHEDULED
        to: HOLD
        trigger: "system event: the item's supplier transitioned to CONDITIONAL or SUSPENDED"
        actor: system
        preconditions:
          - "run.status IN {SCHEDULED, APPROVED}"
        side_effects:
          - "run.status := HOLD and run.hold_reason := SUPPLIER_CONDITIONAL | SUPPLIER_SUSPENDED"
          - "committed tooling is NOT released - a held run still occupies its line window and its budget commitment"
          - "increments ProductionRun.version by 1"
      - from: APPROVED
        to: HOLD
        trigger: "system event: the item's supplier transitioned to CONDITIONAL or SUSPENDED"
        actor: system
        preconditions:
          - "run.status == APPROVED"
        side_effects:
          - "identical to the SCHEDULED -> HOLD transition; run.approved_by_user_id is retained"
          - "increments ProductionRun.version by 1"
      - from: HOLD
        to: SCHEDULED
        trigger: "POST /private-label/production-runs/{production_run_id}/release-hold"
        actor: SourcingManager
        preconditions:
          - "run.status == HOLD"
          - "supplier.qualification_status == QUALIFIED"
          - "item.quality_posture != SUSPENDED"
        side_effects:
          - "run.status := SCHEDULED and run.hold_reason retained for audit"
          - "increments ProductionRun.version by 1"
        note: "SCHEDULED -> HOLD -> SCHEDULED is a cycle driven by supplier posture."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /private-label/production-runs/{production_run_id}/cancel, or the item rationalization cascade"
        actor: SourcingManager
        preconditions:
          - "run.status IN {SCHEDULED, APPROVED, HOLD}"
        side_effects:
          - "run.status := CANCELLED"
          - "program.committed_budget_cents -= run.committed_tooling_cents and program.lifetime_released_cents += run.committed_tooling_cents (compensating action)"
          - "the run's line window is freed for overlap detection"
          - "increments ProductionRun.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /private-label/production-runs/{production_run_id}/cancel"
        actor: SourcingManager
        preconditions:
          - "run.status == APPROVED"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED transition"
          - "increments ProductionRun.version by 1"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /private-label/production-runs/{production_run_id}/cancel"
        actor: SourcingManager
        preconditions:
          - "run.status == HOLD"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED transition"
          - "increments ProductionRun.version by 1"

  - entity: CostChangeRequest
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /private-label/cost-change-requests/{cost_change_request_id}/counter"
        actor: SourcingManager
        preconditions:
          - "ccr.status == SUBMITTED"
        side_effects:
          - "ccr.counter_base_cents := payload.counter_base_cents"
          - "ccr.status := COUNTERED"
          - "increments CostChangeRequest.version by 1"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /private-label/cost-change-requests/{cost_change_request_id}/revise"
        actor: SupplierUser
        preconditions:
          - "ccr.status == COUNTERED"
          - "ccr.round_number < 3 (MAX_NEGOTIATION_ROUNDS)"
          - "X-User-ID == cost_model.supplier_id"
        side_effects:
          - "the three requested_*_cost_cents_per_unit fields are replaced by the payload values"
          - "ccr.round_number += 1"
          - "all calculations.cost_change_settlement outputs are recomputed from the revised request"
          - "ccr.status := SUBMITTED"
          - "increments CostChangeRequest.version by 1"
        note: "SUBMITTED -> COUNTERED -> SUBMITTED is the negotiation cycle; the fourth submission is refused with ERR_NEGOTIATION_ROUND_LIMIT."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /private-label/cost-change-requests/{cost_change_request_id}/decision with decision=ACCEPT"
        actor: ProgramDirector
        preconditions:
          - "ccr.status == SUBMITTED"
          - "escalation_tier == T1 permits SourcingManager or ProgramDirector; T2 and T3 permit ProgramDirector only"
        side_effects:
          - "ccr.status := ACCEPTED and ccr.decided_by_user_id := X-User-ID"
          - "hop 1: cost_model.effective_base_cents += ccr.net_increase_cents, cost_model.landed_unit_cost_cents_as_quoted and landed_unit_cost_cents_audited recomputed, CostModel.version incremented"
          - "hop 2: because the pinned CostModel changed, the item's Specification with status == LOCKED and pinned_cost_model_id == ccr.cost_model_id transitions LOCKED -> SUPERSEDE_PENDING"
          - "hop 3: because that specification entered SUPERSEDE_PENDING and ccr.substitution_scope == INGREDIENT, the pinned ArtworkRound transitions nutrition_status VALID -> INVALIDATED"
          - "hop 4: because nutrition_status became INVALIDATED, every APPROVED LabelClaim on that round with depends_on_nutrition == true transitions to RESCINDED"
          - "hop 5: because at least one claim was RESCINDED, the item transitions development_status LAUNCHED -> RELAUNCH_PENDING"
          - "increments CostChangeRequest.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /private-label/cost-change-requests/{cost_change_request_id}/decision with decision=REJECT"
        actor: ProgramDirector
        preconditions:
          - "ccr.status == SUBMITTED"
        side_effects:
          - "ccr.status := REJECTED and ccr.decided_by_user_id := X-User-ID"
          - "cost_model.open_change_request_count decreases by 1 and CostModel.version increments by 1"
          - "increments CostChangeRequest.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /private-label/cost-change-requests/{cost_change_request_id}/withdraw"
        actor: SupplierUser
        preconditions:
          - "ccr.status IN {SUBMITTED, COUNTERED}"
          - "X-User-ID == cost_model.supplier_id"
        side_effects:
          - "ccr.status := WITHDRAWN"
          - "cost_model.open_change_request_count decreases by 1 and CostModel.version increments by 1"
          - "increments CostChangeRequest.version by 1"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /private-label/cost-change-requests/{cost_change_request_id}/withdraw"
        actor: SupplierUser
        preconditions:
          - "ccr.status == COUNTERED"
          - "X-User-ID == cost_model.supplier_id"
        side_effects:
          - "identical to the SUBMITTED -> WITHDRAWN transition"
          - "increments CostChangeRequest.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: spec-create-stale-item
    parent_entity: ProductItem
    write_endpoint: "POST /private-label/specifications"
    occ_field: "expected_item_version"
    description: |
      Creating a Specification for an item whose version has advanced since the client
      last read it is rejected. Specification creation legitimately supersedes the item's
      prior specification revision (relaunch after an ingredient substitution), so a
      second create is not blocked by any state precondition; the stale-version check is
      what stops a writer from pinning cost and artwork versions it never observed.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

  - rule_id: cost-change-create-stale-cost-model
    parent_entity: CostModel
    write_endpoint: "POST /private-label/cost-change-requests"
    occ_field: "expected_cost_model_version"
    description: |
      Submitting a CostChangeRequest against a CostModel whose version has advanced since
      the supplier last read it is rejected. The requested cost deltas are evaluated against
      CostModel.effective_base_cents, which an audit-driven yield recompute or a previously
      accepted change request may already have moved, so a request carrying a stale version
      would be settled against a base the supplier never saw.
    error_id: ERR_STALE_COST_MODEL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. All rounding is round_half_up unless a step names
# floor/ceiling explicitly. No business decision uses a random `id`; every
# ordering, selection and tie-break below uses `created_at`.
# =============================================================================
calculations:
  - name: category_gap_score
    trigger: "POST /private-label/category-gaps/{gap_id}/analyze (both the DRAFT -> ANALYZED transition and the ANALYZED -> ANALYZED re-analysis self-loop)"
    algorithm: weighted_scoring
    formula: |
      sales_component     = min(SALES_CAP, round_half_up(category_annual_sales_cents / SALES_DIVISOR_CENTS, 2))
      share_component     = max(0.0, SHARE_BASELINE_PCT - pl_share_pct)
      velocity_component  = min(VELOCITY_CAP, round_half_up(unit_velocity_per_week / VELOCITY_DIVISOR, 2))
      price_component     = PRICE_CAP                                              if nb_retail_price_cents >= PRICE_CAP_TRIGGER_CENTS
                            else round_half_up(nb_retail_price_cents / PRICE_DIVISOR, 2)
      gap_score           = round_half_up(min(SCORE_CAP, sales_component + share_component
                                              + velocity_component + price_component), 2)

      recommended_tier    = PREMIUM        if gap_score >= PREMIUM_SCORE_MIN and nb_retail_price_cents >= PREMIUM_PRICE_MIN_CENTS
                            NBE            elif gap_score >= NBE_SCORE_MIN
                            OPENING_PRICE  otherwise
    input_set: "the four analysis fields of the single CategoryGap being analyzed; no other rows participate"
    constants:
      SALES_DIVISOR_CENTS: 25000000
      SALES_CAP: 40.0
      SHARE_BASELINE_PCT: 35.0
      VELOCITY_DIVISOR: 40
      VELOCITY_CAP: 15.0
      PRICE_DIVISOR: 40
      PRICE_CAP_TRIGGER_CENTS: 400
      PRICE_CAP: 10.0
      SCORE_CAP: 100.0
      PREMIUM_SCORE_MIN: 70.0
      PREMIUM_PRICE_MIN_CENTS: 500
      NBE_SCORE_MIN: 45.0
    precision: "gap_score and every component: 2 decimal places, round_half_up"
    notes: |
      Three of the four components are non-linear (two upper clamps and one lower clamp at zero) and the
      price component switches from a ratio to a flat cap. The tier band is NOT a pure function of
      gap_score: PREMIUM additionally requires nb_retail_price_cents >= 500, so a gap scoring 79.50 on a
      420-cent national brand is NBE, not PREMIUM.

  - name: landed_unit_cost
    trigger: "on POST /private-label/cost-models (both variants computed at create), on POST /private-label/plant-audits/{plant_audit_id}/finalize (audited variant refreshed for every SUBMITTED/ACCEPTED cost model of that supplier), and on CostChangeRequest acceptance (both variants refreshed from the new effective_base_cents)"
    algorithm: aggregation
    formula: |
      base_cents        = cost_model.effective_base_cents
      yield_adjusted    = base_cents / (yield_pct / 100)                 # yield_pct is variant-selected
      freight_per_unit  = cost_model.freight_cents_per_pallet / cost_model.units_per_pallet
      landed            = round_half_up(yield_adjusted + freight_per_unit + scrap_allowance_cents, 0)
    input_set: |
      One CostModel. The audited variant additionally reads the most recent FINALIZED PlantAudit for
      cost_model.supplier_id ordered by window_end descending, then created_at descending as the
      tie-break (never `id`); audits with status == SCHEDULED are excluded.
    constants:
      SCRAP_ALLOWANCE_PASS_CENTS: 0
      SCRAP_ALLOWANCE_CONDITIONAL_CENTS: 3
    precision: "integer cents; the division chain is carried at full precision and rounded once, at the end, round_half_up"
    variants:
      - name: as_quoted
        when: "always computed; it is the number the supplier is held to commercially and the fallback whenever no FINALIZED PlantAudit exists for the supplier"
        difference: "yield_pct := cost_model.quoted_yield_pct and scrap_allowance_cents := 0 regardless of any audit result"
      - name: audited_actual
        when: "computed only once a FINALIZED PlantAudit exists for cost_model.supplier_id; stored in landed_unit_cost_cents_audited and it is this variant that drives spec_lock_pricing"
        difference: |
          yield_pct := that audit's audited_yield_pct, and scrap_allowance_cents := 0 when the audit
          result is PASS or SCRAP_ALLOWANCE_CONDITIONAL_CENTS when the result is CONDITIONAL. A FAIL
          audit does not produce an audited cost - it leaves landed_unit_cost_cents_audited unchanged.
    notes: |
      Identical stored inputs, two different answers: base 221 with quoted yield 96.50% and freight
      48000/1200 gives 269, while the same model against an audit measuring 91.00% yield with a PASS
      result gives 283 (286 if that audit came back CONDITIONAL).

  - name: bench_top_parity_index
    trigger: "POST /private-label/comparison-studies/{study_id}/finalize when study_type == BENCH_TOP"
    algorithm: weighted_scoring
    formula: |
      penalty      = FLAVOR_WEIGHT     * abs(flavor_delta)
                   + TEXTURE_WEIGHT    * abs(texture_delta)
                   + AROMA_WEIGHT      * abs(aroma_delta)
                   + APPEARANCE_WEIGHT * abs(appearance_delta)
      parity_index = round_half_up(max(0.00, 100 - penalty), 2)

      verdict      = SUPERIOR  if parity_index >= SUPERIOR_INDEX_MIN and flavor_delta > 0.0
                     PARITY    elif parity_index >= PARITY_INDEX_MIN
                     INFERIOR  otherwise
    input_set: "the four sensory deltas of the single BENCH_TOP study being finalized; panel count fields are ignored"
    constants:
      FLAVOR_WEIGHT: 8
      TEXTURE_WEIGHT: 6
      AROMA_WEIGHT: 4
      APPEARANCE_WEIGHT: 2
      SUPERIOR_INDEX_MIN: 95.00
      PARITY_INDEX_MIN: 85.00
    precision: "2 decimal places, round_half_up; deltas are scored on a -3.0 .. +3.0 scale in 0.5 increments"
    notes: |
      The penalty uses absolute deltas, so being better than the national brand still costs index points -
      but the SUPERIOR verdict requires a strictly positive flavor_delta, so a high index earned by being
      different in the wrong direction can never read SUPERIOR. Deltas (flavor +0.5, texture 0.0,
      aroma -0.5, appearance +0.5) give penalty 7 and parity_index 93.00 -> PARITY.

  - name: panel_preference_share
    trigger: "POST /private-label/comparison-studies/{study_id}/finalize when study_type == CONSUMER_PANEL"
    algorithm: threshold
    formula: |
      denominator          = prefer_pl_count + prefer_nb_count        # no_preference_count is EXCLUDED
      preference_share_pct = 0.00 if denominator == 0
                             else round_half_up(prefer_pl_count * 100 / denominator, 2)

      verdict = SUPERIOR  if preference_share_pct >= SUPERIOR_SHARE_MIN
                PARITY    elif preference_share_pct >= PARITY_SHARE_MIN
                INFERIOR  otherwise
    input_set: "the three panelist counts of the single CONSUMER_PANEL study being finalized; sensory delta fields are ignored"
    constants:
      SUPERIOR_SHARE_MIN: 55.00
      PARITY_SHARE_MIN: 45.00
    precision: "2 decimal places, round_half_up"
    notes: |
      no_preference_count sits in n_panelists but not in the denominator, so a 45/55/40 panel of 140
      reads exactly 45.00 -> PARITY (the inclusive boundary), while treating no-preference panelists as
      part of the denominator would read 32.14 -> INFERIOR.

  - name: nutrition_panel_declaration
    trigger: "POST /private-label/artwork-rounds/{artwork_round_id}/nutrition-panel"
    algorithm: threshold
    formula: |
      # step 1 - unrounded per-serving amounts
      per_serving(x)      = x_per_100g * serving_size_g / 100          # full precision, NOT rounded here

      # step 2 - calories from the UNROUNDED per-serving macros
      calories_exact      = CAL_PER_G_CARB   * (per_serving(carb) - per_serving(fiber))
                          + CAL_PER_G_FIBER  * per_serving(fiber)
                          + CAL_PER_G_PROTEIN* per_serving(protein)
                          + CAL_PER_G_FAT    * per_serving(fat)

      # step 3 - banded label rounding, applied ONLY for display
      round_calories(c)   = 0                              if c < 5
                            nearest multiple of 5          if c <= 50
                            nearest multiple of 10         otherwise
      round_macro(g)      = 0.0                             if g < 0.5
                            nearest 0.5                     if g < 5
                            nearest 1                       otherwise
      round_sodium(mg)    = 0                               if mg < 5
                            nearest multiple of 5           if mg <= 140
                            nearest multiple of 10          otherwise

      declared_calories   = round_calories(calories_exact)
      declared_fat_g          = round_macro(per_serving(fat))
      declared_satfat_g       = round_macro(per_serving(satfat))
      declared_carb_g         = round_macro(per_serving(carb))
      declared_fiber_g        = round_macro(per_serving(fiber))
      declared_sugars_g       = round_macro(per_serving(sugars))
      declared_added_sugars_g = round_macro(per_serving(added_sugars))
      declared_protein_g      = round_macro(per_serving(protein))
      declared_sodium_mg      = round_sodium(per_serving(sodium_mg))
    input_set: "the ten per-100g / serving-size inputs of the single ArtworkRound; no other entity participates"
    constants:
      CAL_PER_G_CARB: 4
      CAL_PER_G_FIBER: 2
      CAL_PER_G_PROTEIN: 4
      CAL_PER_G_FAT: 9
      CALORIE_ROUND_5_MAX: 50
      MACRO_HALF_GRAM_MAX: 5
      SODIUM_ROUND_5_MAX: 140
    precision: |
      Every intermediate is carried at full decimal precision and each declared_* field is rounded
      exactly once, from the unrounded per-serving amount. All ties round half up.
    notes: |
      The order is load-bearing: calories MUST come from the unrounded macros. Serving 50 g of a product
      at (fat 13.0, satfat 5.0, carb 65.2, fiber 2.8, sugars 30.0, added 24.0, protein 6.8,
      sodium 640 mg) per 100 g yields calories_exact 199.7 -> declared_calories 200, whereas summing the
      already-rounded macros (carb 33, fiber 1.5, protein 3.5, fat 7) gives 206.0 -> 210. Fiber is
      counted at 2 kcal/g and is therefore subtracted from carbohydrate before the 4 kcal/g term.

  - name: complaint_ppm_trend
    trigger: "POST /private-label/complaints and POST /private-label/items/{item_id}/shipment-feed"
    algorithm: aggregation
    formula: |
      weighted_points_90d = sum over Complaint rows where complaint.item_id == item.id
                            and complaint.received_at >= (logical clock now - 90 days)
                            of (5 if severity == CRITICAL else 2 if severity == MAJOR else 1)

      complaint_ppm_90d   = 0.00 if item.trailing_90d_units == 0
                            else round_half_up(weighted_points_90d * 1000000 / item.trailing_90d_units, 2)

      recomputed_posture  = PROBATION if complaint_ppm_90d >= PROBATION_PPM_MIN
                            WATCH     elif complaint_ppm_90d >= WATCH_PPM_MIN
                            GREEN     otherwise
    input_set: |
      Complaint rows for this item inside the trailing 90 days of the logical clock (half-open
      [now - 90 days, now]) - Complaint is append-only, so no status filtering applies - and the item's
      current trailing_90d_units. The posture recomputation is applied only when
      item.quality_posture != SUSPENDED; a SUSPENDED item keeps its posture and only the numeric
      complaint_ppm_90d field is refreshed.
    constants:
      SEVERITY_WEIGHT_CRITICAL: 5
      SEVERITY_WEIGHT_MAJOR: 2
      SEVERITY_WEIGHT_MINOR: 1
      TREND_WINDOW_DAYS: 90
      WATCH_PPM_MIN: 60.00
      PROBATION_PPM_MIN: 150.00
    precision: "2 decimal places, round_half_up"
    notes: |
      A zero denominator is defined to 0.00 rather than an error or an infinite ppm, so complaints logged
      against an item with no shipment history never move the posture. 50000 trailing units with one
      CRITICAL + one MAJOR + one MINOR complaint gives weighted 8 -> 160.00 -> PROBATION; dropping the
      CRITICAL gives weighted 3 -> exactly 60.00 -> WATCH (inclusive boundary).

  - name: supplier_composite_score
    trigger: "on PlantAudit finalize, on supplier qualification decisions QUALIFY, on ProductionRun completion (all three write composite_score_cached under the rolling_12m variant) and on GET /private-label/suppliers/{supplier_id}/scorecard (which returns both variants side by side)"
    algorithm: weighted_scoring
    formula: |
      # window is variant-selected; every component is evaluated inside that window
      audit_component     = NEUTRAL_AUDIT_COMPONENT if no FINALIZED PlantAudit for this supplier has
                                                       window_end inside the window
                            else AUDIT_W_FOOD_SAFETY  * a.food_safety_score
                               + AUDIT_W_SANITATION   * a.sanitation_score
                               + AUDIT_W_TRACEABILITY * a.traceability_score
                               + AUDIT_W_CAPACITY     * a.capacity_score
                            where a = the FINALIZED PlantAudit with the greatest window_end inside the
                            window, tie-broken by the greater created_at (never by `id`)

      complaint_points    = sum of severity weights (5/2/1) over Complaint rows whose item.supplier_id ==
                            supplier.id and whose received_at is inside the window
      complaint_component = max(0.00, 100 - COMPLAINT_POINT_PENALTY * complaint_points)

      completed_runs      = ProductionRun rows with status == COMPLETED whose item.supplier_id ==
                            supplier.id and completed_at inside the window
      delivery_component  = NEUTRAL_DELIVERY_COMPONENT if completed_runs is empty
                            else round_half_up(count(completed_runs where completed_on_time == true)
                                               * 100 / count(completed_runs), 2)

      composite_score     = round_half_up(WEIGHT_AUDIT     * audit_component
                                        + WEIGHT_COMPLAINT * complaint_component
                                        + WEIGHT_DELIVERY  * delivery_component, 2)
    input_set: |
      FINALIZED PlantAudit rows, Complaint rows reached through ProductItem.supplier_id, and COMPLETED
      ProductionRun rows - each filtered to the variant's window. SCHEDULED audits, and runs in
      SCHEDULED / APPROVED / HOLD / CANCELLED, never participate.
    constants:
      AUDIT_W_FOOD_SAFETY: 0.40
      AUDIT_W_SANITATION: 0.25
      AUDIT_W_TRACEABILITY: 0.20
      AUDIT_W_CAPACITY: 0.15
      COMPLAINT_POINT_PENALTY: 2.5
      NEUTRAL_AUDIT_COMPONENT: 80.00
      NEUTRAL_DELIVERY_COMPONENT: 100.00
      WEIGHT_AUDIT: 0.50
      WEIGHT_COMPLAINT: 0.30
      WEIGHT_DELIVERY: 0.20
      ROLLING_WINDOW_DAYS: 365
    precision: "components and composite: 2 decimal places, round_half_up; the pillar weights sum to 1.00 and the three component weights sum to 1.00"
    variants:
      - name: rolling_12m
        when: "the cached scorecard written to Supplier.composite_score_cached, and the rolling_12m block of the scorecard read"
        difference: "window = [logical clock now - ROLLING_WINDOW_DAYS days, logical clock now]; it therefore keeps counting history that predates the current qualification period"
      - name: period_to_date
        when: "the period_to_date block of GET /private-label/suppliers/{supplier_id}/scorecard, used to judge behaviour since the current qualification was granted"
        difference: |
          window = [supplier.qualified_at, logical clock now]. Because every QUALIFY decision (including
          the QUALIFIED -> QUALIFIED recertification self-loop) resets qualified_at, this variant is
          reset by recertification while rolling_12m is not - and when the window contains no audit and
          no complaints the neutral constants apply, so the two variants diverge on identical stored data.
    notes: |
      A supplier whose only in-window audit scores (95, 90, 92, 88) with 12 complaint points and no
      completed runs reads rolling_12m = 0.50*92.10 + 0.30*70.00 + 0.20*100.00 = 87.05, while a
      qualified_at set after those events makes period_to_date = 0.50*80.00 + 0.30*100.00 +
      0.20*100.00 = 90.00. Same rows, different windows, different answers.

  - name: cost_change_settlement
    trigger: "POST /private-label/cost-change-requests (initial computation) and POST /private-label/cost-change-requests/{cost_change_request_id}/revise (full recomputation from the revised amounts)"
    algorithm: tiered_pricing
    formula: |
      # the ten steps run in exactly this order; reordering any pair changes the result
      1. requested_total_cents = requested_ingredient_cost_cents_per_unit
                               + requested_packaging_cost_cents_per_unit
                               + requested_conversion_cost_cents_per_unit
      2. old_base_cents        = cost_model.effective_base_cents        # current base, not the create-time components
      3. raw_increase_cents    = requested_total_cents - old_base_cents
      4. increase_pct          = round_half_up(raw_increase_cents * 100 / old_base_cents, 2)
      5. escalation_tier       = T1 if increase_pct <= TIER_T1_MAX_PCT
                                 T2 elif increase_pct <= TIER_T2_MAX_PCT
                                 T3 otherwise
      6. tier_cap_cents        = floor(old_base_cents * tier_cap_pct(escalation_tier) / 100)   # FLOOR, not round
      7. capped_increase_cents = min(raw_increase_cents, tier_cap_cents)
      8. offset_fee_cents      = round_half_up(capped_increase_cents * OFFSET_FEE_PCT / 100, 0)
      9. net_increase_cents    = capped_increase_cents - offset_fee_cents
      10. accepted_base_cents  = old_base_cents + net_increase_cents    # applied only on ACCEPT
    input_set: "one CostChangeRequest and the current effective_base_cents of its CostModel; sibling requests in SUBMITTED / COUNTERED do not participate, and counter_base_cents is a negotiating position that never enters the settlement arithmetic"
    constants:
      TIER_T1_MAX_PCT: 3.00
      TIER_T2_MAX_PCT: 8.00
      TIER_CAP_PCT_T1: 3.00
      TIER_CAP_PCT_T2: 6.50
      TIER_CAP_PCT_T3: 9.00
      OFFSET_FEE_PCT: 12.50
      MAX_NEGOTIATION_ROUNDS: 3
    precision: "increase_pct 2 decimals round_half_up; every cents value integer, with step 6 floored and step 8 rounded half up"
    notes: |
      Three order traps. (i) The tier is chosen from the RAW percentage but the cap is applied to the raw
      cents afterwards - tiering off the capped amount would demote T3 requests to T2. (ii) The cap is
      floored while the fee is rounded half up; using one rounding mode for both shifts the result by a
      cent. (iii) The offset fee is charged on the CAPPED increase, not the raw one. Against
      old_base 221 with requested (168, 33, 50): raw 30, increase_pct 13.57, tier T3, cap floor(19.89)
      = 19, capped 19, fee round_half_up(2.375) = 2, net 17, accepted base 238. Charging the fee before
      the cap would give net 19 and an accepted base of 240.

  - name: spec_lock_pricing
    trigger: "POST /private-label/specifications/{specification_id}/lock"
    algorithm: threshold
    formula: |
      landed_effective_cents = cost_model.landed_unit_cost_cents_audited
                               if it is not null else cost_model.landed_unit_cost_cents_as_quoted

      slotting_fee_cents     = TIER_SLOTTING_BASE_CENTS[item.tier]
                             + round_half_up(landed_effective_cents * cost_model.moq_units
                                             * SLOTTING_PCT_OF_FIRST_ORDER / 100, 0)

      raw_retail_cents       = round_half_up(landed_effective_cents
                                             / (1 - TIER_MARGIN_PCT[item.tier] / 100), 0)
      retail_price_cents     = the smallest integer >= raw_retail_cents whose last digit is 9   # ceil-to-9
    input_set: "the specification's pinned CostModel (as pinned, i.e. the row at its current values), the item's tier, and the item's CategoryGap for nothing more than tier agreement; no other specification participates"
    constants:
      TIER_SLOTTING_BASE_CENTS: { OPENING_PRICE: 150000, NBE: 250000, PREMIUM: 400000 }
      SLOTTING_PCT_OF_FIRST_ORDER: 0.50
      TIER_MARGIN_PCT: { OPENING_PRICE: 22.00, NBE: 30.00, PREMIUM: 38.00 }
    precision: "integer cents; the margin division is rounded half up once and only then walked up to the next price ending in 9"
    notes: |
      The audited landed cost wins whenever it exists, so the same specification locks at a different
      retail price depending on whether a FINALIZED audit has refreshed the cost model. NBE with
      landed_effective 283 and moq 12000 gives slotting 250000 + 16980 = 266980 and retail
      round_half_up(283 / 0.70) = 404 -> 409. After an accepted T3 cost change moves the base to 238
      (landed_effective 287) the same tier gives slotting 267220 and retail 410 -> 419.

  - name: commitment_ledger_reconciliation
    trigger: "on every commitment or release: specification lock, production-run schedule, production-run cancel, item rationalize; exposed by GET /private-label/programs/{program_id}/budget-ledger"
    algorithm: aggregation
    formula: |
      # conserved quantity 1 - program money
      program.committed_budget_cents == program.lifetime_committed_cents - program.lifetime_released_cents
      program.available_budget_cents  = program.dev_budget_cents - program.committed_budget_cents

      # conserved quantity 2 - category shelf slots
      gap.slots_consumed == gap.slots_consumed_lifetime - gap.slots_released_lifetime
      gap.slots_open      = gap.shelf_slots_quota - gap.slots_consumed
    input_set: |
      Money: Specification.slotting_fee_cents for statuses {LOCKED, SUPERSEDE_PENDING, SUPERSEDED} plus
      ProductionRun.committed_tooling_cents for statuses {SCHEDULED, APPROVED, HOLD, COMPLETED}.
      Slots: ProductItem rows of the gap whose development_status NOT IN {RATIONALIZED, DISCONTINUED}.
      A CANCELLED run releases its tooling; a RATIONALIZED or DISCONTINUED item releases its slot.
    constants:
      SLOT_COST_PER_ITEM: 1
    precision: "exact integers; no rounding anywhere in the ledger"
    notes: |
      Two independent conserved quantities with two different release triggers. Cancelling a run releases
      money but no slot; rationalizing an item releases a slot AND cancels its runs (thus releasing their
      tooling too), while the slotting fee of the item's locked specification stays committed forever -
      a shelf slot is recoverable, a slotting fee is not.

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule determines the response, later violations are not
# reported even when they are also true)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role in X-User-Role is listed in the called endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body and query string are well formed: no unknown fields, every required field present, types correct, enum values members of their declared set, numeric constraints from §1.1 respected, datetimes ISO 8601 UTC, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_GAP_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_PLANT_LINE_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_COST_MODEL_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_ARTWORK_ROUND_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_SPECIFICATION_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_CHANGE_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 6
    category: existence
    check: "every foreign key in the request body resolves to an existing row, validated in the field order declared in §1.1"
    error_id: "the NOT_FOUND code of the referenced entity, as in priority 5"
    http_status: 404
    applies_to: "all create endpoints, plus /rationalize (replacement_item_id) and /qualification-decision (basis_audit_id)"

  - priority: 7
    category: auth
    check: "when X-User-Role == SupplierUser, X-User-ID equals the supplier_id of the addressed resource (directly, or through cost_model.supplier_id for change requests)"
    error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /private-label/cost-models, POST /private-label/cost-change-requests, /revise, /withdraw, GET /private-label/suppliers/{supplier_id}/scorecard"

  - priority: 8
    category: auth
    check: "the reviewer of a label claim is not the user who submitted it (X-User-ID != claim.submitted_by_user_id)"
    error_id: ERR_CLAIM_SELF_REVIEW
    http_status: 403
    applies_to: "POST /private-label/label-claims/{label_claim_id}/review"

  - priority: 9
    category: auth
    check: "the approver of a production run is not the user who locked its specification (X-User-ID != specification.locked_by_user_id)"
    error_id: ERR_RUN_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /private-label/production-runs/{production_run_id}/approve"

  - priority: 10
    category: state
    check: "expected_item_version equals the current ProductItem.version (§1.2.1 rule spec-create-stale-item)"
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412
    applies_to: "POST /private-label/specifications"

  - priority: 11
    category: state
    check: "expected_cost_model_version equals the current CostModel.version (§1.2.1 rule cost-change-create-stale-cost-model)"
    error_id: ERR_STALE_COST_MODEL_VERSION
    http_status: 412
    applies_to: "POST /private-label/cost-change-requests"

  - priority: 12
    category: state
    check: "the governing BrandProgram is not CLOSED"
    error_id: ERR_PROGRAM_CLOSED
    http_status: 409
    applies_to: "every mutating endpoint whose resource resolves to a program"

  - priority: 13
    category: state
    check: "the governing BrandProgram is not RELAUNCH_FREEZE"
    error_id: ERR_PROGRAM_RELAUNCH_FROZEN
    http_status: 409
    applies_to: "POST /private-label/items, POST /private-label/specifications/{specification_id}/lock"

  - priority: 14
    category: state
    check: "the CategoryGap is in the status its operation requires: DRAFT or ANALYZED for /analyze, ANALYZED for /tier-decision, TIER_APPROVED for item creation against it"
    error_id: "ERR_GAP_STATE_INVALID | ERR_GAP_NOT_ANALYZED | ERR_GAP_NOT_TIER_APPROVED"
    http_status: 409
    applies_to: "/analyze, /tier-decision, POST /private-label/items"

  - priority: 15
    category: state
    check: "the Supplier qualification_status admits the requested decision, and the addressed PlantAudit is SCHEDULED when finalizing"
    error_id: "ERR_SUPPLIER_STATE_INVALID | ERR_AUDIT_NOT_SCHEDULED"
    http_status: 409
    applies_to: "/qualification-decision, /plant-audits/{plant_audit_id}/finalize"

  - priority: 16
    category: state
    check: "the addressed resource is in the state its transition requires: cost_model.status == SUBMITTED for /decision, study.status == DRAFT for /finalize, artwork_round.status == DRAFT or CHANGES_REQUESTED for /submit and IN_REVIEW for /review, claim.status == PENDING for /review, specification.status == DRAFT for /lock, run.status == SCHEDULED for /approve, APPROVED for /complete, HOLD for /release-hold, non-terminal for /cancel, request.status == SUBMITTED for /counter and /decision or COUNTERED for /revise, item.development_status admits /launch or /rationalize"
    error_id: "ERR_COST_MODEL_NOT_SUBMITTED | ERR_STUDY_NOT_DRAFT | ERR_ARTWORK_STATE_INVALID | ERR_CLAIM_NOT_PENDING | ERR_SPECIFICATION_NOT_DRAFT | ERR_RUN_STATE_INVALID | ERR_CHANGE_REQUEST_STATE_INVALID | ERR_ITEM_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 17
    category: business_safety
    check: "the item's quality_posture is not SUSPENDED"
    error_id: ERR_ITEM_QUALITY_SUSPENDED
    http_status: 422
    applies_to: "POST /private-label/production-runs, /production-runs/{production_run_id}/approve, /production-runs/{production_run_id}/release-hold, /items/{item_id}/launch"

  - priority: 18
    category: business_safety
    check: "the awarded supplier's qualification_status == QUALIFIED (CONDITIONAL is enough to accept a quote but not to lock a specification or release a hold)"
    error_id: ERR_SUPPLIER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /private-label/specifications/{specification_id}/lock, /production-runs/{production_run_id}/release-hold"

  - priority: 19
    category: business_safety
    check: "supplier.gfsi_certificate_expiry is strictly after the logical clock at decision time"
    error_id: ERR_GFSI_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /private-label/suppliers/{supplier_id}/qualification-decision with decision IN {QUALIFY, CONDITIONAL}"

  - priority: 20
    category: business_safety
    check: "basis_audit_id names a FINALIZED CAPABILITY PlantAudit of this supplier whose result satisfies the requested decision (PASS for QUALIFY, PASS or CONDITIONAL for CONDITIONAL and REINSTATE) and, for recertification, reinstatement and CONDITIONAL -> QUALIFIED, whose window_end is strictly after supplier.qualified_at"
    error_id: ERR_AUDIT_BASIS_INVALID
    http_status: 422
    applies_to: "POST /private-label/suppliers/{supplier_id}/qualification-decision"

  - priority: 21
    category: business_safety
    check: "substantiation_ref is present and non-empty when claim_type IN {HEALTH, ORGANIC}"
    error_id: ERR_SUBSTANTIATION_REQUIRED
    http_status: 422
    applies_to: "POST /private-label/label-claims"

  - priority: 22
    category: business_safety
    check: "the artwork round's nutrition_status == VALID"
    error_id: ERR_NUTRITION_PANEL_INVALID
    http_status: 422
    applies_to: "POST /private-label/artwork-rounds/{artwork_round_id}/submit, POST /private-label/specifications (pinned round), POST /private-label/specifications/{specification_id}/lock"

  - priority: 23
    category: business_safety
    check: "no LabelClaim on the round has status IN {PENDING, REJECTED, RESCINDED} when approving the artwork, and at least one claim exists"
    error_id: ERR_UNAPPROVED_CLAIM_PRESENT
    http_status: 422
    applies_to: "POST /private-label/artwork-rounds/{artwork_round_id}/review with decision=APPROVE, POST /private-label/artwork-rounds/{artwork_round_id}/submit (existence of at least one claim)"

  - priority: 24
    category: business_referential
    check: "item.tier equals the CategoryGap's approved_tier"
    error_id: ERR_TIER_MISMATCH
    http_status: 409
    applies_to: "POST /private-label/items"

  - priority: 25
    category: business_referential
    check: "the pinned CostModel has status == ACCEPTED and item_id == the specification's item_id, and the pinned ArtworkRound has status == APPROVED and item_id == the specification's item_id"
    error_id: ERR_PIN_ITEM_MISMATCH
    http_status: 409
    applies_to: "POST /private-label/specifications"

  - priority: 26
    category: business_referential
    check: "at lock time the pinned versions are still current: specification.pinned_cost_model_version == CostModel.version and specification.pinned_artwork_version == ArtworkRound.version"
    error_id: ERR_PIN_VERSION_STALE
    http_status: 409
    applies_to: "POST /private-label/specifications/{specification_id}/lock"

  - priority: 27
    category: business_referential
    check: "the run's specification_id has item_id equal to the run's item_id and status == LOCKED, and the run's plant_line_id belongs to the item's awarded supplier"
    error_id: "ERR_SPECIFICATION_ITEM_MISMATCH | ERR_SPECIFICATION_NOT_LOCKED | ERR_PLANT_LINE_SUPPLIER_MISMATCH"
    http_status: 409
    applies_to: "POST /private-label/production-runs, POST /private-label/production-runs/{production_run_id}/approve"

  - priority: 28
    category: business_referential
    check: "the change request's cost_model_id has status == ACCEPTED and item_id == the request's item_id"
    error_id: ERR_COST_MODEL_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /private-label/cost-change-requests"

  - priority: 29
    category: business_referential
    check: "replacement_item_id is present, refers to a different ProductItem sharing this item's gap_id and not in {RATIONALIZED, DISCONTINUED} when disposition == REPLACE; and is absent when disposition == DISCONTINUE"
    error_id: ERR_REPLACEMENT_ITEM_INVALID
    http_status: 409
    applies_to: "POST /private-label/items/{item_id}/rationalize"

  - priority: 30
    category: business_referential
    check: "a LabelClaim may only be added to an ArtworkRound whose status IN {DRAFT, CHANGES_REQUESTED}"
    error_id: ERR_ARTWORK_STATE_INVALID
    http_status: 409
    applies_to: "POST /private-label/label-claims"

  - priority: 31
    category: business_temporal
    check: "window_end is strictly after window_start on both PlantAudit and ProductionRun creates"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /private-label/plant-audits, POST /private-label/production-runs"

  - priority: 32
    category: business_temporal
    check: |
      the requested run window, expanded by PlantLine.changeover_buffer_minutes on BOTH ends, does not
      intersect the equally expanded window of any other ProductionRun on the same plant_line_id whose
      status IN {SCHEDULED, APPROVED, HOLD, COMPLETED}. Run windows are CLOSED intervals, so touching
      endpoints count as an intersection.
    error_id: ERR_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /private-label/production-runs"

  - priority: 33
    category: business_temporal
    check: |
      at most AUDIT_CONCURRENT_CAPACITY = 2 PlantAudit rows of the same supplier may cover any instant.
      Audit windows are HALF-OPEN intervals [window_start, window_end), so an audit starting exactly when
      another ends does not intersect it, and no changeover buffer applies.
    error_id: ERR_AUDIT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /private-label/plant-audits"

  - priority: 34
    category: business_temporal
    check: "the logical clock is at or after run.window_end when completing a run"
    error_id: ERR_RUN_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /private-label/production-runs/{production_run_id}/complete"

  - priority: 35
    category: business_constraint
    check: "gap.slots_open >= 1 at item creation"
    error_id: ERR_SHELF_SLOT_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /private-label/items"

  - priority: 36
    category: business_constraint
    check: "override_justification is present and non-empty when approved_tier != gap.recommended_tier"
    error_id: ERR_OVERRIDE_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /private-label/category-gaps/{gap_id}/tier-decision with decision=APPROVE"

  - priority: 37
    category: business_constraint
    check: "line_code is unique per supplier_id"
    error_id: ERR_DUPLICATE_LINE_CODE
    http_status: 409
    applies_to: "POST /private-label/plant-lines"

  - priority: 38
    category: business_constraint
    check: "the item has no other Specification with status == DRAFT"
    error_id: ERR_DRAFT_SPECIFICATION_EXISTS
    http_status: 409
    applies_to: "POST /private-label/specifications"

  - priority: 39
    category: business_constraint
    check: "cost_model.open_change_request_count == 0 (one live negotiation per cost model)"
    error_id: ERR_OPEN_CHANGE_REQUEST_EXISTS
    http_status: 409
    applies_to: "POST /private-label/cost-change-requests"

  - priority: 40
    category: business_constraint
    check: "substitution_material_desc is present and non-empty when substitution_scope != NONE"
    error_id: ERR_SUBSTITUTION_DESC_REQUIRED
    http_status: 422
    applies_to: "POST /private-label/cost-change-requests, POST /private-label/cost-change-requests/{cost_change_request_id}/revise"

  - priority: 41
    category: business_constraint
    check: "round_number < MAX_NEGOTIATION_ROUNDS (3) before a revision is accepted"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /private-label/cost-change-requests/{cost_change_request_id}/revise"

  - priority: 42
    category: business_constraint
    check: "planned_units >= cost_model.moq_units for run_type == FIRST_PRODUCTION"
    error_id: ERR_BELOW_MOQ
    http_status: 422
    applies_to: "POST /private-label/production-runs"

  - priority: 43
    category: business_constraint
    check: "planned_units <= floor(PlantLine.daily_capacity_units * window duration in minutes / 1440)"
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /private-label/production-runs"

  - priority: 44
    category: business_fiscal
    check: "program.committed_budget_cents + the specification's computed slotting_fee_cents <= program.dev_budget_cents"
    error_id: ERR_PROGRAM_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /private-label/specifications/{specification_id}/lock"

  - priority: 45
    category: business_fiscal
    check: "program.committed_budget_cents + the pinned cost model's tooling_cents <= program.dev_budget_cents"
    error_id: ERR_PROGRAM_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /private-label/production-runs"

  - priority: 46
    category: auth
    check: "escalation_tier == T1 may be decided by SourcingManager or ProgramDirector; escalation_tier IN {T2, T3} may only be decided by ProgramDirector"
    error_id: ERR_ESCALATION_ROLE_INSUFFICIENT
    http_status: 403
    applies_to: "POST /private-label/cost-change-requests/{cost_change_request_id}/decision"
    note: "Deliberately last: the required role is not knowable from the endpoint alone, only from the stored escalation_tier, so this check runs after existence and state checks have proven the request readable."

# =============================================================================
# §1.5 API Endpoint Table
# Flat surface: every path is /private-label/<collection>[/{id}[/<action>]].
# Every collection exposes a single-resource GET and a filtered list GET that
# carries each of its foreign keys as an optional filter (FK reverse-
# reachability). All list endpoints accept limit? and offset?.
# ALL ROLES = [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
# =============================================================================
endpoints:

  # --- BrandProgram -----------------------------------------------------------
  - method: POST
    path: "/private-label/programs"
    description: "Create a brand program with its development budget. Starts ACTIVE with all commitment counters at 0."
    roles: [ProgramDirector]
    code: 201
    input: [brand_name, retailer_name, fiscal_year, dev_budget_cents]
    output: BrandProgram
    side_effects:
      - "committed_budget_cents, lifetime_committed_cents, lifetime_released_cents and active_item_count initialised to 0"
      - "status := ACTIVE, version := 1"

  - method: GET
    path: "/private-label/programs/{program_id}"
    description: "Read one brand program with its live commitment counters."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: BrandProgram
    side_effects: []

  - method: GET
    path: "/private-label/programs"
    description: "List brand programs, newest created_at first."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["status?", "fiscal_year?", "limit?", "offset?"]
    output: BrandProgram[]
    side_effects: []

  - method: POST
    path: "/private-label/programs/{program_id}/lifecycle"
    description: "Drive the program lifecycle: action=START_RELAUNCH (ACTIVE -> RELAUNCH_FREEZE), COMPLETE_RELAUNCH (RELAUNCH_FREEZE -> ACTIVE) or CLOSE (ACTIVE -> CLOSED)."
    roles: [ProgramDirector]
    code: 200
    input: [action]
    output: BrandProgram
    side_effects:
      - "the §1.2 BrandProgram transition, including the CLOSE cascade that rejects every DRAFT/ANALYZED CategoryGap of the program"
      - "increments BrandProgram.version by 1"

  - method: GET
    path: "/private-label/programs/{program_id}/budget-ledger"
    description: "Computed read of calculations.commitment_ledger_reconciliation for one program: the committed/available split and the lifetime commit and release totals that must reconcile to it."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: "{ program_id: string, dev_budget_cents: integer, committed_budget_cents: integer, available_budget_cents: integer, lifetime_committed_cents: integer, lifetime_released_cents: integer, active_item_count: integer }"
    side_effects: []

  # --- CategoryGap ------------------------------------------------------------
  - method: POST
    path: "/private-label/category-gaps"
    description: "Open a category gap analysis under a program. Starts DRAFT with gap_score and recommended_tier null."
    roles: [SourcingManager, ProgramDirector]
    code: 201
    input: [program_id, category_code, national_brand_name, nb_retail_price_cents, category_annual_sales_cents, pl_share_pct, unit_velocity_per_week, shelf_slots_quota]
    output: CategoryGap
    side_effects:
      - "slots_consumed := 0, slots_open := shelf_slots_quota, both lifetime slot counters := 0"
      - "status := DRAFT, version := 1"

  - method: GET
    path: "/private-label/category-gaps/{gap_id}"
    description: "Read one category gap with its score, tiers and slot counters."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: CategoryGap
    side_effects: []

  - method: GET
    path: "/private-label/category-gaps"
    description: "List category gaps; program_id is the reverse-reachability filter from BrandProgram."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["program_id?", "status?", "recommended_tier?", "limit?", "offset?"]
    output: CategoryGap[]
    side_effects: []

  - method: POST
    path: "/private-label/category-gaps/{gap_id}/analyze"
    description: "Run calculations.category_gap_score. Any of the four analysis inputs may be restated in the payload; they are written to the gap first and the score is then recomputed from the stored values. Valid from DRAFT and from ANALYZED (re-analysis self-loop)."
    roles: [SourcingManager, ProgramDirector]
    code: 200
    input: ["category_annual_sales_cents?", "pl_share_pct?", "unit_velocity_per_week?", "nb_retail_price_cents?"]
    output: CategoryGap
    side_effects:
      - "supplied analysis fields overwrite the stored values"
      - "gap_score and recommended_tier := calculations.category_gap_score outputs"
      - "status := ANALYZED (unchanged on the self-loop)"
      - "increments CategoryGap.version by 1"

  - method: POST
    path: "/private-label/category-gaps/{gap_id}/tier-decision"
    description: "decision=APPROVE locks approved_tier (override_justification required when it differs from recommended_tier); decision=REJECT closes the gap."
    roles: [ProgramDirector]
    code: 200
    input: [decision, "approved_tier?", "override_justification?"]
    output: CategoryGap
    side_effects:
      - "approved_tier := payload.approved_tier and status := TIER_APPROVED, or status := REJECTED"
      - "increments CategoryGap.version by 1"

  # --- Supplier ---------------------------------------------------------------
  - method: POST
    path: "/private-label/suppliers"
    description: "Enrol a supplier in a program. Starts PROSPECT with qualified_at null."
    roles: [SourcingManager, ProgramDirector]
    code: 201
    input: [program_id, legal_name, plant_country, gfsi_certificate_expiry]
    output: Supplier
    side_effects:
      - "qualification_status := PROSPECT, composite_score_cached := null, probation_item_count := 0, weighted_complaint_points := 0"
      - "version := 1"

  - method: GET
    path: "/private-label/suppliers/{supplier_id}"
    description: "Read one supplier with its cached composite score and probation counter."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/private-label/suppliers"
    description: "List suppliers; program_id is the reverse-reachability filter from BrandProgram."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["program_id?", "qualification_status?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []

  - method: POST
    path: "/private-label/suppliers/{supplier_id}/qualification-decision"
    description: "Apply a qualification decision: QUALIFY, CONDITIONAL, SUSPEND, REINSTATE or DISQUALIFY. QUALIFY, CONDITIONAL and REINSTATE require basis_audit_id."
    roles: [ProgramDirector]
    code: 200
    input: [decision, "basis_audit_id?"]
    output: Supplier
    side_effects:
      - "the §1.2 Supplier transition, including the SUSPEND cascade (item posture SUSPENDED + runs to HOLD), the CONDITIONAL -> QUALIFIED release of held runs, and the REINSTATE posture recomputation"
      - "qualified_at := logical clock now on QUALIFY, CONDITIONAL and REINSTATE"
      - "composite_score_cached refreshed under the rolling_12m variant on QUALIFY"
      - "increments Supplier.version by 1"

  - method: GET
    path: "/private-label/suppliers/{supplier_id}/scorecard"
    description: "Computed read returning calculations.supplier_composite_score under BOTH variants side by side, with each component broken out. SupplierUser may only read its own scorecard."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: "{ supplier_id: string, rolling_12m_composite_score: number, rolling_12m_audit_component: number, rolling_12m_complaint_component: number, rolling_12m_delivery_component: number, rolling_12m_window_start: string, period_to_date_composite_score: number, period_to_date_audit_component: number, period_to_date_complaint_component: number, period_to_date_delivery_component: number, period_to_date_window_start: string }"
    side_effects: []

  # --- PlantLine --------------------------------------------------------------
  - method: POST
    path: "/private-label/plant-lines"
    description: "Register a production line at a supplier plant. line_code is unique per supplier."
    roles: [SourcingManager, ProgramDirector]
    code: 201
    input: [supplier_id, line_code, daily_capacity_units, "changeover_buffer_minutes?"]
    output: PlantLine
    side_effects:
      - "changeover_buffer_minutes defaults to 120 when omitted"
      - "version := 1"

  - method: GET
    path: "/private-label/plant-lines/{plant_line_id}"
    description: "Read one plant line with its capacity and changeover buffer."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: PlantLine
    side_effects: []

  - method: GET
    path: "/private-label/plant-lines"
    description: "List plant lines; supplier_id is the reverse-reachability filter from Supplier."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["supplier_id?", "limit?", "offset?"]
    output: PlantLine[]
    side_effects: []

  # --- PlantAudit -------------------------------------------------------------
  - method: POST
    path: "/private-label/plant-audits"
    description: "Schedule a CAPABILITY or ONGOING_QUALITY plant audit over the half-open window [window_start, window_end). At most two audits of a supplier may cover any instant."
    roles: [QualityAuditor]
    code: 201
    input: [supplier_id, audit_type, window_start, window_end]
    output: PlantAudit
    side_effects:
      - "status := SCHEDULED with result and all pillar scores null"
      - "version := 1"

  - method: GET
    path: "/private-label/plant-audits/{plant_audit_id}"
    description: "Read one plant audit with its pillar scores, audited yield and result."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: PlantAudit
    side_effects: []

  - method: GET
    path: "/private-label/plant-audits"
    description: "List plant audits; supplier_id is the reverse-reachability filter from Supplier."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["supplier_id?", "audit_type?", "status?", "result?", "limit?", "offset?"]
    output: PlantAudit[]
    side_effects: []

  - method: POST
    path: "/private-label/plant-audits/{plant_audit_id}/finalize"
    description: "Finalize the audit with its four pillar scores and measured yield; computes result and refreshes every audited landed cost of the supplier."
    roles: [QualityAuditor]
    code: 200
    input: [food_safety_score, sanitation_score, capacity_score, traceability_score, audited_yield_pct]
    output: PlantAudit
    side_effects:
      - "result := PASS | CONDITIONAL | FAIL and status := FINALIZED"
      - "every CostModel of this supplier with status IN {SUBMITTED, ACCEPTED} gets landed_unit_cost_cents_audited recomputed (calculations.landed_unit_cost variant audited_actual) and its version incremented"
      - "supplier.composite_score_cached refreshed under the rolling_12m variant"
      - "increments PlantAudit.version by 1"

  # --- ProductItem ------------------------------------------------------------
  - method: POST
    path: "/private-label/items"
    description: "Create a private-label item against a TIER_APPROVED category gap. Consumes one shelf slot. tier must equal the gap's approved_tier."
    roles: [ProgramDirector, SourcingManager]
    code: 201
    input: [gap_id, item_name, tier, pack_size_desc, "trailing_90d_units?"]
    output: ProductItem
    side_effects:
      - "development_status := CONCEPT, quality_posture := GREEN, complaint_ppm_90d := 0.00, spec_revision_count := 0"
      - "gap.slots_consumed += 1, gap.slots_open -= 1, gap.slots_consumed_lifetime += 1"
      - "program.active_item_count += 1"
      - "version := 1"

  - method: GET
    path: "/private-label/items/{item_id}"
    description: "Read one item, including both state dimensions, the trailing complaint ppm, the locked retail price and the version an OCC specification create must pin."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: ProductItem
    side_effects: []

  - method: GET
    path: "/private-label/items"
    description: "List items; gap_id, supplier_id and replacement_item_id are the reverse-reachability filters from CategoryGap, Supplier and ProductItem itself."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["gap_id?", "supplier_id?", "replacement_item_id?", "development_status?", "quality_posture?", "tier?", "limit?", "offset?"]
    output: ProductItem[]
    side_effects: []

  - method: POST
    path: "/private-label/items/{item_id}/shipment-feed"
    description: "Post the retailer's trailing-90-day shipped units for the item; recomputes complaint_ppm_90d and the quality posture in both directions."
    roles: [SourcingManager, QualityAuditor]
    code: 200
    input: [trailing_90d_units]
    output: ProductItem
    side_effects:
      - "trailing_90d_units := payload value and complaint_ppm_90d := calculations.complaint_ppm_trend"
      - "quality_posture recomputed (GREEN <-> WATCH <-> PROBATION; never sets or clears SUSPENDED), possibly cascading to supplier.probation_item_count"
      - "increments ProductItem.version by 1"

  - method: POST
    path: "/private-label/items/{item_id}/launch"
    description: "Launch the item after its first production run completed, or relaunch it after a new specification is locked."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProductItem
    side_effects:
      - "development_status := LAUNCHED (from SPEC_LOCKED or RELAUNCH_PENDING)"
      - "increments ProductItem.version by 1"

  - method: POST
    path: "/private-label/items/{item_id}/rationalize"
    description: "Rationalize the item: disposition=REPLACE requires replacement_item_id and ends RATIONALIZED, disposition=DISCONTINUE ends DISCONTINUED. Both release the shelf slot and cancel every non-terminal run."
    roles: [ProgramDirector]
    code: 200
    input: [disposition, "replacement_item_id?"]
    output: ProductItem
    side_effects:
      - "development_status := RATIONALIZED or DISCONTINUED"
      - "gap.slots_consumed -= 1, gap.slots_open += 1, gap.slots_released_lifetime += 1, program.active_item_count -= 1"
      - "every ProductionRun of the item in {SCHEDULED, APPROVED, HOLD} transitions to CANCELLED, each releasing committed_tooling_cents back to the program"
      - "increments ProductItem.version by 1"

  # --- CostModel --------------------------------------------------------------
  - method: POST
    path: "/private-label/cost-models"
    description: "Submit a supplier quote for an item. Computes the as_quoted landed cost immediately and the audited landed cost too when a FINALIZED audit already exists for the supplier."
    roles: [SupplierUser, SourcingManager]
    code: 201
    input: [item_id, supplier_id, ingredient_cost_cents_per_unit, packaging_cost_cents_per_unit, conversion_cost_cents_per_unit, quoted_yield_pct, freight_cents_per_pallet, units_per_pallet, moq_units, tooling_cents]
    output: CostModel
    side_effects:
      - "effective_base_cents := the sum of the three component costs"
      - "landed_unit_cost_cents_as_quoted := calculations.landed_unit_cost variant as_quoted; landed_unit_cost_cents_audited := variant audited_actual when a FINALIZED PlantAudit exists for supplier_id, else null"
      - "status := SUBMITTED, open_change_request_count := 0, version := 1"

  - method: GET
    path: "/private-label/cost-models/{cost_model_id}"
    description: "Read one cost model, including both landed-cost variants and the version an OCC change request must pin."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: CostModel
    side_effects: []

  - method: GET
    path: "/private-label/cost-models"
    description: "List cost models; item_id and supplier_id are the reverse-reachability filters from ProductItem and Supplier."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["item_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: CostModel[]
    side_effects: []

  - method: POST
    path: "/private-label/cost-models/{cost_model_id}/decision"
    description: "decision=ACCEPT awards the item to this supplier and supersedes the sibling quotes; decision=REJECT closes the quote."
    roles: [SourcingManager, ProgramDirector]
    code: 200
    input: [decision]
    output: CostModel
    side_effects:
      - "status := ACCEPTED or REJECTED"
      - "on ACCEPT: item.supplier_id := this supplier, item.development_status CONCEPT -> SOURCED, every sibling SUBMITTED cost model of the item -> SUPERSEDED"
      - "increments CostModel.version by 1"

  # --- ComparisonStudy --------------------------------------------------------
  - method: POST
    path: "/private-label/comparison-studies"
    description: "Open a BENCH_TOP cutting or a CONSUMER_PANEL study against the national-brand control. Sensory deltas are supplied for BENCH_TOP, panelist counts for CONSUMER_PANEL."
    roles: [QualityAuditor]
    code: 201
    input: [item_id, study_type, nb_control_lot_code, "appearance_delta?", "aroma_delta?", "texture_delta?", "flavor_delta?", "n_panelists?", "prefer_pl_count?", "prefer_nb_count?", "no_preference_count?"]
    output: ComparisonStudy
    side_effects:
      - "status := DRAFT with parity_index, preference_share_pct and verdict null"
      - "version := 1"

  - method: GET
    path: "/private-label/comparison-studies/{study_id}"
    description: "Read one comparison study with its computed index or share and its verdict."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: ComparisonStudy
    side_effects: []

  - method: GET
    path: "/private-label/comparison-studies"
    description: "List comparison studies; item_id is the reverse-reachability filter from ProductItem."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["item_id?", "study_type?", "status?", "verdict?", "limit?", "offset?"]
    output: ComparisonStudy[]
    side_effects: []

  - method: POST
    path: "/private-label/comparison-studies/{study_id}/finalize"
    description: "Finalize the study: computes calculations.bench_top_parity_index or calculations.panel_preference_share, sets the verdict, and re-evaluates the item's tier benchmark gate."
    roles: [QualityAuditor]
    code: 200
    input: []
    output: ComparisonStudy
    side_effects:
      - "parity_index or preference_share_pct and verdict written; status := FINALIZED"
      - "when the item is SOURCED and the tier gate is now satisfied, item.development_status -> BENCHMARKED"
      - "increments ComparisonStudy.version by 1"

  # --- ArtworkRound -----------------------------------------------------------
  - method: POST
    path: "/private-label/artwork-rounds"
    description: "Open a packaging artwork round for an item with its per-100g nutrient inputs. round_number is assigned from the number of pre-existing rounds. Starts DRAFT / NOT_GENERATED."
    roles: [PackagingDesigner]
    code: 201
    input: [item_id, serving_size_g, servings_per_container, fat_g_per_100g, satfat_g_per_100g, carb_g_per_100g, fiber_g_per_100g, sugars_g_per_100g, added_sugars_g_per_100g, protein_g_per_100g, sodium_mg_per_100g]
    output: ArtworkRound
    side_effects:
      - "round_number := 1 + count of existing rounds for the item; designer_user_id := X-User-ID"
      - "status := DRAFT, nutrition_status := NOT_GENERATED, every declared_* field null"
      - "version := 1"

  - method: GET
    path: "/private-label/artwork-rounds/{artwork_round_id}"
    description: "Read one artwork round with its nutrient inputs, generated panel and both state dimensions."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: ArtworkRound
    side_effects: []

  - method: GET
    path: "/private-label/artwork-rounds"
    description: "List artwork rounds; item_id is the reverse-reachability filter from ProductItem."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["item_id?", "status?", "nutrition_status?", "limit?", "offset?"]
    output: ArtworkRound[]
    side_effects: []

  - method: POST
    path: "/private-label/artwork-rounds/{artwork_round_id}/nutrition-panel"
    description: "Generate (or regenerate after an INVALIDATED panel) the printed nutrition panel via calculations.nutrition_panel_declaration. Any of the eleven nutrient/serving inputs may be restated in the payload and is written before the panel is computed."
    roles: [PackagingDesigner]
    code: 200
    input: ["serving_size_g?", "servings_per_container?", "fat_g_per_100g?", "satfat_g_per_100g?", "carb_g_per_100g?", "fiber_g_per_100g?", "sugars_g_per_100g?", "added_sugars_g_per_100g?", "protein_g_per_100g?", "sodium_mg_per_100g?"]
    output: ArtworkRound
    side_effects:
      - "supplied nutrient inputs overwrite the stored values"
      - "all nine declared_* fields written from calculations.nutrition_panel_declaration"
      - "nutrition_status := VALID (from NOT_GENERATED or INVALIDATED)"
      - "increments ArtworkRound.version by 1"

  - method: POST
    path: "/private-label/artwork-rounds/{artwork_round_id}/submit"
    description: "Submit the round for regulatory review. Requires a VALID nutrition panel and at least one label claim."
    roles: [PackagingDesigner]
    code: 200
    input: []
    output: ArtworkRound
    side_effects:
      - "status := IN_REVIEW (from DRAFT or CHANGES_REQUESTED)"
      - "increments ArtworkRound.version by 1"

  - method: POST
    path: "/private-label/artwork-rounds/{artwork_round_id}/review"
    description: "decision=APPROVE requires every claim on the round APPROVED and advances the item to PACKAGING_APPROVED; decision=REQUEST_CHANGES returns the round to the designer."
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision]
    output: ArtworkRound
    side_effects:
      - "reviewer_user_id := X-User-ID; status := APPROVED or CHANGES_REQUESTED"
      - "on APPROVE: any previously APPROVED round of the item -> SUPERSEDED, and item.development_status BENCHMARKED -> PACKAGING_APPROVED"
      - "increments ArtworkRound.version by 1"

  # --- LabelClaim -------------------------------------------------------------
  - method: POST
    path: "/private-label/label-claims"
    description: "Add a label claim to an artwork round in DRAFT or CHANGES_REQUESTED. HEALTH and ORGANIC claims require substantiation_ref. depends_on_nutrition is derived from claim_type."
    roles: [PackagingDesigner, RegulatoryReviewer]
    code: 201
    input: [artwork_round_id, claim_text, claim_type, "substantiation_ref?"]
    output: LabelClaim
    side_effects:
      - "submitted_by_user_id := X-User-ID; depends_on_nutrition := claim_type IN {NUTRIENT_CONTENT, HEALTH}"
      - "status := PENDING, version := 1"

  - method: GET
    path: "/private-label/label-claims/{label_claim_id}"
    description: "Read one label claim with its review state and nutrition dependency."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: LabelClaim
    side_effects: []

  - method: GET
    path: "/private-label/label-claims"
    description: "List label claims; artwork_round_id is the reverse-reachability filter from ArtworkRound."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["artwork_round_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: LabelClaim[]
    side_effects: []

  - method: POST
    path: "/private-label/label-claims/{label_claim_id}/review"
    description: "Approve or reject a pending claim. The reviewer may not be the user who submitted it (segregation of duties)."
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "rationale?"]
    output: LabelClaim
    side_effects:
      - "reviewed_by_user_id := X-User-ID, rationale stored, status := APPROVED or REJECTED"
      - "increments LabelClaim.version by 1"

  # --- Specification ----------------------------------------------------------
  - method: POST
    path: "/private-label/specifications"
    description: "Create a specification revision pinning an ACCEPTED cost model and an APPROVED artwork round. expected_item_version is the OCC guard of §1.2.1 rule spec-create-stale-item and must carry the ProductItem.version the client last read."
    roles: [ProgramDirector, SourcingManager]
    code: 201
    input: [item_id, pinned_cost_model_id, pinned_artwork_round_id, expected_item_version]
    output: Specification
    side_effects:
      - "pinned_cost_model_version := CostModel.version and pinned_artwork_version := ArtworkRound.version as observed now"
      - "item.spec_revision_count += 1 and revision_no := the new count"
      - "status := DRAFT, slotting_fee_cents null, version := 1"
      - "increments ProductItem.version by 1"

  - method: GET
    path: "/private-label/specifications/{specification_id}"
    description: "Read one specification with its pins, revision number, slotting fee and lock metadata."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: Specification
    side_effects: []

  - method: GET
    path: "/private-label/specifications"
    description: "List specifications; item_id, pinned_cost_model_id and pinned_artwork_round_id are the reverse-reachability filters from ProductItem, CostModel and ArtworkRound."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["item_id?", "pinned_cost_model_id?", "pinned_artwork_round_id?", "status?", "limit?", "offset?"]
    output: Specification[]
    side_effects: []

  - method: POST
    path: "/private-label/specifications/{specification_id}/lock"
    description: "Lock the specification: prices the item via calculations.spec_lock_pricing, commits the slotting fee against the program budget and supersedes the item's previous locked revision."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Specification
    side_effects:
      - "slotting_fee_cents and item.retail_price_cents := calculations.spec_lock_pricing outputs"
      - "status := LOCKED, locked_at := logical clock now, locked_by_user_id := X-User-ID"
      - "program.committed_budget_cents and program.lifetime_committed_cents increase by slotting_fee_cents"
      - "any other LOCKED or SUPERSEDE_PENDING specification of the item -> SUPERSEDED"
      - "item.development_status PACKAGING_APPROVED -> SPEC_LOCKED (unchanged when the item is RELAUNCH_PENDING)"
      - "increments Specification.version by 1"

  # --- ProductionRun ----------------------------------------------------------
  - method: POST
    path: "/private-label/production-runs"
    description: "Schedule a production run on a plant line against a LOCKED specification. The closed window is expanded by the line's changeover buffer on both ends for conflict detection, and the pinned cost model's tooling is committed to the program."
    roles: [SourcingManager, ProgramDirector]
    code: 201
    input: [item_id, specification_id, plant_line_id, run_type, window_start, window_end, planned_units]
    output: ProductionRun
    side_effects:
      - "committed_tooling_cents := the pinned CostModel.tooling_cents, snapshotted now"
      - "program.committed_budget_cents and program.lifetime_committed_cents increase by committed_tooling_cents"
      - "status := SCHEDULED, version := 1"

  - method: GET
    path: "/private-label/production-runs/{production_run_id}"
    description: "Read one production run with its window, committed tooling, hold reason and completion data."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/private-label/production-runs"
    description: "List production runs; item_id, specification_id and plant_line_id are the reverse-reachability filters from ProductItem, Specification and PlantLine."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["item_id?", "specification_id?", "plant_line_id?", "run_type?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  - method: POST
    path: "/private-label/production-runs/{production_run_id}/approve"
    description: "Approve a scheduled run. The approver may not be the user who locked the specification (segregation of duties)."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "status := APPROVED and approved_by_user_id := X-User-ID"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/private-label/production-runs/{production_run_id}/complete"
    description: "Close out an approved run once the logical clock has passed window_end; refreshes the supplier scorecard."
    roles: [QualityAuditor]
    code: 200
    input: [produced_units, completed_on_time]
    output: ProductionRun
    side_effects:
      - "produced_units, completed_on_time and completed_at stored; status := COMPLETED"
      - "supplier.composite_score_cached refreshed under the rolling_12m variant"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/private-label/production-runs/{production_run_id}/release-hold"
    description: "Return a held run to SCHEDULED once its supplier is QUALIFIED again and the item is no longer SUSPENDED."
    roles: [SourcingManager, ProgramDirector]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "status := SCHEDULED, hold_reason retained for audit"
      - "increments ProductionRun.version by 1"

  - method: POST
    path: "/private-label/production-runs/{production_run_id}/cancel"
    description: "Cancel a non-terminal run and release its committed tooling back to the program budget (compensating action)."
    roles: [SourcingManager, ProgramDirector]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "status := CANCELLED"
      - "program.committed_budget_cents decreases and program.lifetime_released_cents increases by committed_tooling_cents"
      - "the line window is freed for future overlap checks"
      - "increments ProductionRun.version by 1"

  # --- Complaint (append-only) ------------------------------------------------
  - method: POST
    path: "/private-label/complaints"
    description: "Log a consumer complaint against an item. Append-only: complaints have no version, no update and no delete. Recomputes the item's complaint ppm and posture, which may cascade to the supplier."
    roles: [QualityAuditor, RegulatoryReviewer]
    code: 201
    input: [item_id, defect_category, severity, lot_code, narrative]
    output: Complaint
    side_effects:
      - "received_at := logical clock now (equals created_at)"
      - "item.complaint_ppm_90d := calculations.complaint_ppm_trend and quality_posture possibly GREEN -> WATCH -> PROBATION"
      - "supplier.weighted_complaint_points, probation_item_count and composite_score_cached refreshed; a second PROBATION item drives the supplier QUALIFIED -> CONDITIONAL and its runs to HOLD"

  - method: GET
    path: "/private-label/complaints/{complaint_id}"
    description: "Read one logged complaint."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/private-label/complaints"
    description: "List complaints; item_id is the reverse-reachability filter from ProductItem."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["item_id?", "severity?", "defect_category?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  # --- CostChangeRequest ------------------------------------------------------
  - method: POST
    path: "/private-label/cost-change-requests"
    description: "Supplier opens a cost change (optionally with a material substitution) against an ACCEPTED cost model. expected_cost_model_version is the OCC guard of §1.2.1 rule cost-change-create-stale-cost-model. All ten settlement steps are computed at create."
    roles: [SupplierUser]
    code: 201
    input: [item_id, cost_model_id, requested_ingredient_cost_cents_per_unit, requested_packaging_cost_cents_per_unit, requested_conversion_cost_cents_per_unit, substitution_scope, "substitution_material_desc?", expected_cost_model_version]
    output: CostChangeRequest
    side_effects:
      - "raw_increase_cents, increase_pct, escalation_tier, capped_increase_cents, offset_fee_cents and net_increase_cents := calculations.cost_change_settlement outputs"
      - "round_number := 1, status := SUBMITTED, version := 1"
      - "cost_model.open_change_request_count += 1 and increments CostModel.version by 1"

  - method: GET
    path: "/private-label/cost-change-requests/{cost_change_request_id}"
    description: "Read one cost change request with its full settlement breakdown and negotiation round."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: []
    output: CostChangeRequest
    side_effects: []

  - method: GET
    path: "/private-label/cost-change-requests"
    description: "List cost change requests; item_id and cost_model_id are the reverse-reachability filters from ProductItem and CostModel."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: ["item_id?", "cost_model_id?", "status?", "escalation_tier?", "substitution_scope?", "limit?", "offset?"]
    output: CostChangeRequest[]
    side_effects: []

  - method: POST
    path: "/private-label/cost-change-requests/{cost_change_request_id}/counter"
    description: "Agency counters a submitted request with a total base cost. counter_base_cents is a negotiating position only - it never enters the settlement arithmetic."
    roles: [SourcingManager, ProgramDirector]
    code: 200
    input: [counter_base_cents]
    output: CostChangeRequest
    side_effects:
      - "counter_base_cents stored, status := COUNTERED"
      - "increments CostChangeRequest.version by 1"

  - method: POST
    path: "/private-label/cost-change-requests/{cost_change_request_id}/revise"
    description: "Supplier revises a countered request, incrementing round_number and recomputing all ten settlement steps. Refused once round_number has reached MAX_NEGOTIATION_ROUNDS (3)."
    roles: [SupplierUser]
    code: 200
    input: [requested_ingredient_cost_cents_per_unit, requested_packaging_cost_cents_per_unit, requested_conversion_cost_cents_per_unit, "substitution_scope?", "substitution_material_desc?"]
    output: CostChangeRequest
    side_effects:
      - "the three requested costs (and substitution fields when supplied) replaced; round_number += 1"
      - "every calculations.cost_change_settlement output recomputed; status := SUBMITTED"
      - "increments CostChangeRequest.version by 1"

  - method: POST
    path: "/private-label/cost-change-requests/{cost_change_request_id}/decision"
    description: "decision=ACCEPT applies net_increase_cents to the cost model and fires the substitution cascade; decision=REJECT closes the negotiation. T2 and T3 may only be accepted by a ProgramDirector."
    roles: [SourcingManager, ProgramDirector]
    code: 200
    input: [decision]
    output: CostChangeRequest
    side_effects:
      - "status := ACCEPTED or REJECTED, decided_by_user_id := X-User-ID"
      - "on ACCEPT: cost_model.effective_base_cents += net_increase_cents, both landed-cost variants recomputed, CostModel.version incremented; then the five-hop cascade - LOCKED specification -> SUPERSEDE_PENDING, pinned artwork nutrition_status -> INVALIDATED for an INGREDIENT substitution, nutrition-dependent APPROVED claims -> RESCINDED, LAUNCHED item -> RELAUNCH_PENDING"
      - "cost_model.open_change_request_count -= 1"
      - "increments CostChangeRequest.version by 1"

  - method: POST
    path: "/private-label/cost-change-requests/{cost_change_request_id}/withdraw"
    description: "Supplier withdraws its own request from SUBMITTED or COUNTERED."
    roles: [SupplierUser]
    code: 200
    input: []
    output: CostChangeRequest
    side_effects:
      - "status := WITHDRAWN, cost_model.open_change_request_count -= 1 and CostModel.version incremented"
      - "increments CostChangeRequest.version by 1"

  # --- test-driving endpoint --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to any instant, so window, expiry and trailing-window rules are exercised without wall-clock waits. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramDirector, SourcingManager, QualityAuditor, RegulatoryReviewer, PackagingDesigner, SupplierUser]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock returns current_utc for every subsequent request until it is set again"
      - "no entity is modified and no recomputation is triggered by the clock move itself"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / authorization ---------------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six roles in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_SUPPLIER_SCOPE_VIOLATION
    http: 403
    condition: "a SupplierUser addresses a resource that does not belong to its own supplier id"
  - id: ERR_CLAIM_SELF_REVIEW
    http: 403
    condition: "the label-claim reviewer is the same user id that submitted the claim"
  - id: ERR_RUN_SELF_APPROVAL
    http: 403
    condition: "the production-run approver is the same user id that locked the specification"
  - id: ERR_ESCALATION_ROLE_INSUFFICIENT
    http: 403
    condition: "a SourcingManager decides a cost change request whose escalation_tier is T2 or T3"

  # --- shape -----------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body or query: unknown field, missing required field, wrong type, enum value outside its declared set, numeric constraint violated, non-ISO-8601 datetime, or pagination limit/offset out of range"

  # --- existence -------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id in the path or body matches no BrandProgram"
  - id: ERR_GAP_NOT_FOUND
    http: 404
    condition: "gap_id matches no CategoryGap"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "supplier_id matches no Supplier"
  - id: ERR_PLANT_LINE_NOT_FOUND
    http: 404
    condition: "plant_line_id matches no PlantLine"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "plant_audit_id or basis_audit_id matches no PlantAudit"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "item_id or replacement_item_id matches no ProductItem"
  - id: ERR_COST_MODEL_NOT_FOUND
    http: 404
    condition: "cost_model_id or pinned_cost_model_id matches no CostModel"
  - id: ERR_STUDY_NOT_FOUND
    http: 404
    condition: "study_id matches no ComparisonStudy"
  - id: ERR_ARTWORK_ROUND_NOT_FOUND
    http: 404
    condition: "artwork_round_id or pinned_artwork_round_id matches no ArtworkRound"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "label_claim_id matches no LabelClaim"
  - id: ERR_SPECIFICATION_NOT_FOUND
    http: 404
    condition: "specification_id matches no Specification"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "production_run_id matches no ProductionRun"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint_id matches no Complaint"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "cost_change_request_id matches no CostChangeRequest"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_ITEM_VERSION
    http: 412
    condition: "expected_item_version does not equal the current ProductItem.version on specification create"
  - id: ERR_STALE_COST_MODEL_VERSION
    http: 412
    condition: "expected_cost_model_version does not equal the current CostModel.version on cost change request create"

  # --- program-level state ---------------------------------------------------
  - id: ERR_PROGRAM_CLOSED
    http: 409
    condition: "the governing BrandProgram is CLOSED"
  - id: ERR_PROGRAM_RELAUNCH_FROZEN
    http: 409
    condition: "item creation or specification lock attempted while the program is RELAUNCH_FREEZE"
  - id: ERR_NO_LAUNCHED_ITEMS
    http: 409
    condition: "action=START_RELAUNCH with no item of the program in LAUNCHED or RELAUNCH_PENDING"
  - id: ERR_RELAUNCH_INCOMPLETE
    http: 409
    condition: "action=COMPLETE_RELAUNCH while at least one item is still RELAUNCH_PENDING"
  - id: ERR_ACTIVE_RUNS_PRESENT
    http: 409
    condition: "action=CLOSE, or decision=DISQUALIFY, while a run in SCHEDULED, APPROVED or HOLD still exists in scope"

  # --- per-entity state ------------------------------------------------------
  - id: ERR_GAP_STATE_INVALID
    http: 409
    condition: "/analyze on a gap that is TIER_APPROVED or REJECTED"
  - id: ERR_GAP_NOT_ANALYZED
    http: 409
    condition: "/tier-decision on a gap whose status is not ANALYZED"
  - id: ERR_GAP_NOT_TIER_APPROVED
    http: 409
    condition: "item creation against a gap whose status is not TIER_APPROVED"
  - id: ERR_SUPPLIER_STATE_INVALID
    http: 409
    condition: "the requested qualification decision is not defined from the supplier's current qualification_status"
  - id: ERR_AUDIT_NOT_SCHEDULED
    http: 409
    condition: "/finalize on an audit that is already FINALIZED"
  - id: ERR_COST_MODEL_NOT_SUBMITTED
    http: 409
    condition: "/decision on a cost model that is ACCEPTED, REJECTED or SUPERSEDED"
  - id: ERR_STUDY_NOT_DRAFT
    http: 409
    condition: "/finalize on a study that is already FINALIZED"
  - id: ERR_ARTWORK_STATE_INVALID
    http: 409
    condition: "/submit from a status other than DRAFT or CHANGES_REQUESTED, /review from a status other than IN_REVIEW, or a claim added to a round that is IN_REVIEW, APPROVED or SUPERSEDED"
  - id: ERR_CLAIM_NOT_PENDING
    http: 409
    condition: "/review on a claim that is APPROVED, REJECTED or RESCINDED"
  - id: ERR_SPECIFICATION_NOT_DRAFT
    http: 409
    condition: "/lock on a specification that is LOCKED, SUPERSEDE_PENDING or SUPERSEDED"
  - id: ERR_RUN_STATE_INVALID
    http: 409
    condition: "/approve from a status other than SCHEDULED, /complete from other than APPROVED, /release-hold from other than HOLD, or /cancel on a COMPLETED or CANCELLED run"
  - id: ERR_CHANGE_REQUEST_STATE_INVALID
    http: 409
    condition: "/counter or /decision from a status other than SUBMITTED, /revise from other than COUNTERED, or /withdraw from a terminal status"
  - id: ERR_ITEM_STATE_INVALID
    http: 409
    condition: "/launch from a status other than SPEC_LOCKED or RELAUNCH_PENDING, or /rationalize from a status other than LAUNCHED or RELAUNCH_PENDING"
  - id: ERR_FIRST_PRODUCTION_INCOMPLETE
    http: 409
    condition: "/launch from SPEC_LOCKED with no COMPLETED FIRST_PRODUCTION run for the item"
  - id: ERR_RELAUNCH_PRECONDITION_UNMET
    http: 409
    condition: "/launch from RELAUNCH_PENDING without a LOCKED specification at the item's current revision, or whose pinned round is INVALIDATED or still carries PENDING or RESCINDED claims"

  # --- business safety / compliance ------------------------------------------
  - id: ERR_ITEM_QUALITY_SUSPENDED
    http: 422
    condition: "scheduling, approving, releasing or launching against an item whose quality_posture is SUSPENDED"
  - id: ERR_SUPPLIER_NOT_QUALIFIED
    http: 422
    condition: "specification lock or hold release while the awarded supplier is PROSPECT, CONDITIONAL, SUSPENDED or DISQUALIFIED"
  - id: ERR_GFSI_CERTIFICATE_EXPIRED
    http: 422
    condition: "a QUALIFY or CONDITIONAL decision when gfsi_certificate_expiry is at or before the logical clock"
  - id: ERR_AUDIT_BASIS_INVALID
    http: 422
    condition: "basis_audit_id is not a FINALIZED CAPABILITY audit of this supplier with a result the decision admits, or its window_end is not after qualified_at where freshness is required"
  - id: ERR_SUBSTANTIATION_REQUIRED
    http: 422
    condition: "a HEALTH or ORGANIC claim submitted without substantiation_ref"
  - id: ERR_NUTRITION_PANEL_INVALID
    http: 422
    condition: "artwork submit, specification create or specification lock while the round's nutrition_status is NOT_GENERATED or INVALIDATED"
  - id: ERR_UNAPPROVED_CLAIM_PRESENT
    http: 422
    condition: "artwork approve while a claim on the round is PENDING, REJECTED or RESCINDED, or artwork submit with no claim at all"

  # --- referential integrity -------------------------------------------------
  - id: ERR_TIER_MISMATCH
    http: 409
    condition: "item.tier differs from the category gap's approved_tier"
  - id: ERR_PIN_ITEM_MISMATCH
    http: 409
    condition: "the pinned cost model is not ACCEPTED for this item, or the pinned artwork round is not APPROVED for this item"
  - id: ERR_PIN_VERSION_STALE
    http: 409
    condition: "at lock time a pinned version no longer equals the pinned entity's current version"
  - id: ERR_SPECIFICATION_ITEM_MISMATCH
    http: 409
    condition: "the run's specification belongs to a different item than the run"
  - id: ERR_SPECIFICATION_NOT_LOCKED
    http: 409
    condition: "run scheduling or approval against a specification that is DRAFT, SUPERSEDE_PENDING or SUPERSEDED"
  - id: ERR_PLANT_LINE_SUPPLIER_MISMATCH
    http: 409
    condition: "the chosen plant line belongs to a supplier other than the item's awarded supplier"
  - id: ERR_COST_MODEL_NOT_ACCEPTED
    http: 409
    condition: "a cost change request targets a cost model that is not ACCEPTED, or whose item_id differs from the request's item_id"
  - id: ERR_REPLACEMENT_ITEM_INVALID
    http: 409
    condition: "disposition=REPLACE without a replacement item in the same gap that is itself still active, or disposition=DISCONTINUE with a replacement_item_id supplied"

  # --- temporal --------------------------------------------------------------
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_LINE_WINDOW_CONFLICT
    http: 409
    condition: "the buffer-expanded closed run window intersects another non-cancelled run on the same plant line"
  - id: ERR_AUDIT_CAPACITY_EXCEEDED
    http: 409
    condition: "a third audit of the same supplier would cover an instant already covered by two half-open audit windows"
  - id: ERR_RUN_WINDOW_NOT_ELAPSED
    http: 409
    condition: "/complete while the logical clock is still before run.window_end"

  # --- constraints -----------------------------------------------------------
  - id: ERR_SHELF_SLOT_QUOTA_EXCEEDED
    http: 409
    condition: "item creation when the gap has slots_open == 0"
  - id: ERR_OVERRIDE_JUSTIFICATION_REQUIRED
    http: 422
    condition: "an approved_tier different from recommended_tier without override_justification"
  - id: ERR_DUPLICATE_LINE_CODE
    http: 409
    condition: "line_code already exists for that supplier"
  - id: ERR_DRAFT_SPECIFICATION_EXISTS
    http: 409
    condition: "a second DRAFT specification is created for the same item"
  - id: ERR_OPEN_CHANGE_REQUEST_EXISTS
    http: 409
    condition: "a cost change request is created while the cost model already has one in SUBMITTED or COUNTERED"
  - id: ERR_SUBSTITUTION_DESC_REQUIRED
    http: 422
    condition: "substitution_scope is PACKAGING_MATERIAL or INGREDIENT without substitution_material_desc"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 409
    condition: "/revise when round_number has already reached MAX_NEGOTIATION_ROUNDS (3)"
  - id: ERR_BELOW_MOQ
    http: 422
    condition: "a FIRST_PRODUCTION run plans fewer units than the pinned cost model's moq_units"
  - id: ERR_LINE_CAPACITY_EXCEEDED
    http: 409
    condition: "planned_units exceeds the line's pro-rated capacity for the requested window"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_PROGRAM_BUDGET_EXCEEDED
    http: 422
    condition: "the slotting fee at lock, or the tooling commitment at run scheduling, would push committed_budget_cents above dev_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Agency program owner: budgets, tier decisions, supplier qualification, specification lock, run approval, launch and rationalization."
    identity: opaque
    exclusive_operations:
      - "POST /private-label/programs"
      - "POST /private-label/programs/{program_id}/lifecycle"
      - "POST /private-label/category-gaps/{gap_id}/tier-decision"
      - "POST /private-label/suppliers/{supplier_id}/qualification-decision"
      - "POST /private-label/specifications/{specification_id}/lock"
      - "POST /private-label/production-runs/{production_run_id}/approve"
      - "POST /private-label/items/{item_id}/launch"
      - "POST /private-label/items/{item_id}/rationalize"
      - "accepting a cost change request whose escalation_tier is T2 or T3"
    shared_operations:
      - "POST /private-label/category-gaps and /analyze (with SourcingManager)"
      - "POST /private-label/suppliers, /plant-lines, /items (with SourcingManager)"
      - "POST /private-label/cost-models and /cost-models/{cost_model_id}/decision (with SourcingManager)"
      - "POST /private-label/specifications (with SourcingManager)"
      - "POST /private-label/production-runs, /release-hold, /cancel (with SourcingManager)"
      - "POST /private-label/cost-change-requests/{cost_change_request_id}/counter and /decision (with SourcingManager, T1 only for the latter)"
      - "every GET, and POST /_clock/set_current_utc"

  - name: SourcingManager
    description: "Agency category sourcing lead: gap analysis, supplier onboarding, quote acceptance, specification drafting, run scheduling and cost-change negotiation."
    identity: opaque
    exclusive_operations:
      - "POST /private-label/items/{item_id}/shipment-feed (with QualityAuditor; no other role may post the shipment feed)"
    shared_operations:
      - "POST /private-label/category-gaps and /analyze (with ProgramDirector)"
      - "POST /private-label/suppliers, /plant-lines, /items (with ProgramDirector)"
      - "POST /private-label/cost-models and /cost-models/{cost_model_id}/decision (with ProgramDirector)"
      - "POST /private-label/specifications (with ProgramDirector)"
      - "POST /private-label/production-runs, /release-hold, /cancel (with ProgramDirector)"
      - "POST /private-label/cost-change-requests/{cost_change_request_id}/counter, and /decision for T1 only"
      - "every GET, and POST /_clock/set_current_utc"

  - name: QualityAuditor
    description: "Agency quality function: plant audits, comparison studies, run completion and complaint intake."
    identity: opaque
    exclusive_operations:
      - "POST /private-label/plant-audits"
      - "POST /private-label/plant-audits/{plant_audit_id}/finalize"
      - "POST /private-label/comparison-studies"
      - "POST /private-label/comparison-studies/{study_id}/finalize"
      - "POST /private-label/production-runs/{production_run_id}/complete"
    shared_operations:
      - "POST /private-label/items/{item_id}/shipment-feed (with SourcingManager)"
      - "POST /private-label/complaints (with RegulatoryReviewer)"
      - "every GET, and POST /_clock/set_current_utc"

  - name: RegulatoryReviewer
    description: "Label compliance reviewer: claim review and artwork review. May not review a claim it submitted itself."
    identity: opaque
    exclusive_operations:
      - "POST /private-label/artwork-rounds/{artwork_round_id}/review"
      - "POST /private-label/label-claims/{label_claim_id}/review"
    shared_operations:
      - "POST /private-label/label-claims (with PackagingDesigner)"
      - "POST /private-label/complaints (with QualityAuditor)"
      - "every GET, and POST /_clock/set_current_utc"

  - name: PackagingDesigner
    description: "Artwork studio: creates artwork rounds, generates the nutrition panel, drafts claims and submits rounds for review. Never reviews."
    identity: opaque
    exclusive_operations:
      - "POST /private-label/artwork-rounds"
      - "POST /private-label/artwork-rounds/{artwork_round_id}/nutrition-panel"
      - "POST /private-label/artwork-rounds/{artwork_round_id}/submit"
    shared_operations:
      - "POST /private-label/label-claims (with RegulatoryReviewer)"
      - "every GET, and POST /_clock/set_current_utc"

  - name: SupplierUser
    description: "The manufacturing supplier acting on its own records: quote submission and cost-change negotiation. X-User-ID is the Supplier id."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /private-label/cost-change-requests"
      - "POST /private-label/cost-change-requests/{cost_change_request_id}/revise"
      - "POST /private-label/cost-change-requests/{cost_change_request_id}/withdraw"
    shared_operations:
      - "POST /private-label/cost-models (with SourcingManager), restricted to its own supplier_id"
      - "every GET, and POST /_clock/set_current_utc; GET /private-label/suppliers/{supplier_id}/scorecard only for its own id"
