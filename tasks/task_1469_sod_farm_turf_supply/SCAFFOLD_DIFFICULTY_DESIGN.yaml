  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: maturity_scan_overaged_cascade_depth3
        grounds:
          - state_machines.FieldMaturity.MATURE_to_OVERAGED
          - state_machines.Order.CONFIRMED_to_PLACED
          - state_machines.HarvestBatch.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain with a DIFFERENT trigger than the crew cascade: a single
          POST /fields/{id}/maturity-scan mutates Field (maturity -> OVERAGED),
          which itself cancels the field's PENDING HarvestBatches, which itself
          reverts the under-allocated CONFIRMED Order to PLACED (window cleared,
          capacity released, links stripped). Each hop is caused by the previous
          mutation, not by the original request.
        test_recipe:
          setup:
            - "Field 'East 7' planted 2026-02-20 -> MATURE (age 162 at default clock 2026-08-01, within (150, 240]); quality gate passing"
            - "PENDING batch (10 PREMIUM pallets, sellable 1000) scheduled 2026-08-10 and a CONFIRMED order (line PREMIUM x10, turf 855.00) allocated to that batch with window 2026-08-10T08:00-10:00 (confirm at 2026-08-08, before the 2026-08-09T14:00 cutoff)"
            - "Clock then advanced to 2026-10-20 (age 242 > mature_max_days 240) so the scan flips the persisted maturity into OVERAGED"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "East 7", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-02-20T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 80 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 10, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-10", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { b_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cy Rao", email: "cy@example.com", phone: "555-0103", freight_zone: 3, address: "9 Elm Rd" }
              as: SalesRep
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T09:00:00Z" }
              as: FarmManager
            - call: "POST /quotes"
              payload:
                customer_id: "${c_id}"
                delivery_date: "2026-08-10"
                settlement_method: "CARD"
                z1_pallets: 0
                z2_pallets: 0
                z3_pallets: 10
                lines:
                  - { variety_id: "${v_id}", grade: "PREMIUM", pallet_count: 10, shortfall_slabs: 0, shortfall_rolls: 0 }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/accept"
              payload: {}
              as: SalesRep
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/confirm"
              payload: { delivery_window_start: "2026-08-10T08:00:00Z" }
              as: SalesRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T08:00:00Z" }
              as: FarmManager
          trigger:
            - call: "POST /fields/${f_id}/maturity-scan"
              payload: {}
              as: FarmManager
              captures: { f_mat: $.data.maturity_state }
          assert:
            - "Field.${f_id}.maturity_state == OVERAGED  # age 242 > mature_max_days 240"
            - "HarvestBatch.${b_id}.status == CANCELLED  # hop 2"
            - "Order.${o_id}.status == PLACED  # hop 3: reverted from CONFIRMED"
            - "Order.${o_id}.delivery_window_start == null"
            - "Order.${o_id}.allocated_sqft == 0"

      - name: crew_deactivate_cascade_depth2
        grounds:
          - state_machines.CrewReferral.REFERRED_to_REPLACED
          - entities.Order.fields.crew_referral_status
        distinguishing_aspect: |
          Depth-2 chain with a DIFFERENT trigger than the maturity cascade:
          POST /crews/{id}/deactivate mutates Crew (active=false), which replaces
          its REFERRED/SCHEDULED CrewReferrals, which itself flips each affected
          Order.crew_referral_status back to NONE.
        test_recipe:
          setup:
            - "Crew 'Alpha Install' (service_zones [2]) active; order CONFIRMED for a zone-2 customer with a REFERRED CrewReferral pointing at the crew"
          setup_api_calls:
            - call: "POST /price-configs"
