# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Air Traffic Flow Management & Ground Delay Program Administration
# Sections and claim types follow references/claim-extraction-guide.md.
# Logical clock default 2026-09-01T00:00:00Z; every recipe date is on/after it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: facility_creation_with_defaults
        claim_type: creation
        grounds:
          - entities.Facility
          - "endpoints[POST /atfm/facilities]"
        distinguishing_aspect: "A facility created without an explicit status starts OPERATIONAL with server-minted id, created_at, updated_at and version == 1."
        test_recipe:
          setup:
            - "empty database; clock pinned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /atfm/facilities"
              payload: { ident: "KJFK", facility_type: "AIRPORT", base_acceptance_rate: 40 }
              as: SystemAdministrator
              captures: { fac: $.data.id, fac_status: $.data.status, fac_v: $.data.version }
          assert:
            - "fac_status == OPERATIONAL (default applied)"
            - "fac_v == 1 and fac is a server-minted UUID"
            - "created_at corresponds to the logical clock 2026-09-15T12:00:00Z"

      - name: facility_duplicate_ident_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=12]
          - errors[ERR_FACILITY_IDENT_CONFLICT]
        distinguishing_aspect: "A second facility with the same ident is rejected with ERR_FACILITY_IDENT_CONFLICT (409) even when every other field differs."
        test_recipe:
          setup:
            - "KEWR already registered"
          setup_api_calls:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
          trigger:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "EN_ROUTE_SECTOR", base_acceptance_rate: 10 }
              as: SystemAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FACILITY_IDENT_CONFLICT with http 409"

      - name: facility_create_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Facility
        distinguishing_aspect: "Client-supplied id/created_at in the create body are ignored: the server mints its own id and stamps created_at from the logical clock."
        test_recipe:
          setup:
            - "clock pinned to 2026-09-15T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /atfm/facilities"
              payload: { ident: "KORD", facility_type: "AIRPORT", base_acceptance_rate: 20, id: "00000000-0000-0000-0000-000000000000", created_at: "2026-09-01T00:00:01Z" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          assert:
            - "fac != 00000000-0000-0000-0000-000000000000 (forged id ignored)"
            - "created_at corresponds to 2026-09-15T12:00:00Z, not the forged 2026-09-01T00:00:01Z value"

      - name: operator_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Operator.fields.operator_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "operator_type outside {SCHEDULED_CARRIER, GENERAL_AVIATION, UNSCHEDULED_CHARTER} is rejected with ERR_INVALID_REQUEST (400) at creation."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /atfm/operators"
              payload: { name: "Bad Charter", operator_type: "CHARTER" }
              as: SystemAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: flight_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Flight.fields.controlled_arrival
          - entities.Flight.fields.ops_status
        distinguishing_aspect: "Client-supplied controlled_arrival / provisional_delay_minutes / ops_status in the flight-create body are ignored: the flight starts SCHEDULED/UNCONTROLLED with null CTA and zero delay."
        test_recipe:
          setup:
            - "facility and operator exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
          trigger:
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z", controlled_arrival: "2026-09-15T13:00:00Z", provisional_delay_minutes: 99, ops_status: "LANDED" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f_cta: $.data.controlled_arrival, f_ops: $.data.ops_status, f_delay: $.data.provisional_delay_minutes, f_ctl: $.data.control_status }
          assert:
            - "f_cta == null and f_ops == SCHEDULED and f_ctl == UNCONTROLLED and f_delay == 0 (system/computed inputs ignored)"
            - "estimated_arrival defaulted to scheduled_arrival 2026-09-15T13:05:00Z"

      - name: flight_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_FLIGHT_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but unknown flight id returns ERR_FLIGHT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /atfm/flights/11111111-2222-3333-4444-555555555555"
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FLIGHT_NOT_FOUND with http 404"

      - name: tmi_revision_immutable_record
        claim_type: immutability
        grounds:
          - entities.TMIRevision
        distinguishing_aspect: "TMIRevision is common_fields:false — its create response carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6 over 13:00-15:00Z (zero flights filed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "GET /atfm/tmis/${tmi}"
              as: FlowManager
              captures: { tmi_v: $.data.version }
          trigger:
            - call: "POST /atfm/tmis/${tmi}/revisions"
              payload: { new_controlled_rate: 10, reason: "weather improving", expected_tmi_version: "${tmi_v}" }
              as: FlowManager
              captures: { rev_idx: $.data.revision_index, rev_applied: $.data.applied }
          assert:
            - "rev_idx == 1 and rev_applied == false"
            - "response data carries id and created_at but no version and no updated_at keys (common_fields: false)"
            - "origin == MANUAL and previous_controlled_rate == 6 and new_controlled_rate == 10"

      - name: ga_request_carrier_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=17]
          - errors[ERR_OPERATOR_TYPE_INELIGIBLE]
        distinguishing_aspect: "A SCHEDULED_CARRIER operator filing a GA accommodation request is rejected with ERR_OPERATOR_TYPE_INELIGIBLE (422); only GENERAL_AVIATION/UNSCHEDULED_CHARTER qualify."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6 over 13:00-15:00Z (zero flights); carrier operator op_a"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
          trigger:
            - call: "POST /atfm/operators/${op_a}/ga-requests"
              payload: { tmi_id: "${tmi}", requested_window_start: "2026-09-15T14:30:00Z", requested_window_end: "2026-09-15T15:00:00Z", priority_class: "STANDARD" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OPERATOR_TYPE_INELIGIBLE with http 422"
            - "no GAAccommodationRequest is created (GET /atfm/operators/${op_a}/ga-requests is empty)"

  - section: state_machines
    instances:
      - name: tmi_initial_state_proposed
        claim_type: initial_state
        grounds:
          - state_machines.TrafficManagementInitiative
        distinguishing_aspect: "A freshly proposed TMI is PROPOSED with revision_count 0, activated_at null and proposed_by_user_id taken from X-User-ID."
        test_recipe:
          setup:
            - "clock pinned; facility exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { st: $.data.status, proposer: $.data.proposed_by_user_id, revs: $.data.revision_count }
          assert:
            - "st == PROPOSED and revs == 0"
            - "proposer == fm-1 (recorded from the header for segregation of duties)"
            - "activated_at is null and published_by_user_id is null"

      - name: tmi_activate_from_proposed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TrafficManagementInitiative.PUBLISHED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activate skips PUBLISHED: from PROPOSED it is rejected with ERR_INVALID_STATE (409); no slots are generated."
        test_recipe:
          setup:
            - "PROPOSED GDP (never published)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
          trigger:
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE with http 409"
            - "TMI remains PROPOSED and GET /atfm/tmis/${tmi}/slots is empty"

      - name: tmi_terminal_lockdown_after_cancel
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TrafficManagementInitiative
          - errors[ERR_TMI_TERMINAL]
        distinguishing_aspect: "A CANCELLED TMI rejects both publish and activate with ERR_TMI_TERMINAL (409) — terminal states absorb every further transition."
        test_recipe:
          setup:
            - "GDP proposed then cancelled before ever publishing"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/cancel"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
          trigger:
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { err_pub: $.data.error_id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
              captures: { err_act: $.data.error_id }
            - call: "POST /atfm/tmis/${tmi}/complete"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
              captures: { err_cmp: $.data.error_id }
          assert:
            - "err_pub == ERR_TMI_TERMINAL and err_act == ERR_TMI_TERMINAL and err_cmp == ERR_TMI_TERMINAL"
            - "TMI remains CANCELLED"

      - name: constraint_clear_from_reported_valid
        claim_type: valid_transition
        grounds:
          - state_machines.ConstraintEvent.REPORTED_to_CLEARED
        distinguishing_aspect: "A REPORTED event can be cleared directly (skipping CONFIRMED); status becomes CLEARED and version increments."
        test_recipe:
          setup:
            - "facility with one REPORTED WEATHER event"
          setup_api_calls:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 1, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /atfm/constraint-events/${ev}/clear"
              as: FlowManager
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "st == CLEARED and v == 2"

      - name: constraint_confirm_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ConstraintEvent.REPORTED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming an already-CONFIRMED event is rejected with ERR_INVALID_STATE — the trigger is not idempotent."
        test_recipe:
          setup:
            - "facility with one CONFIRMED WEATHER event"
          setup_api_calls:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/facilities/${fac}/constraint-events"
              payload: { event_type: "WEATHER", severity: 1, window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { ev: $.data.id }
            - call: "POST /atfm/constraint-events/${ev}/confirm"
              as: FlowManager
          trigger:
            - call: "POST /atfm/constraint-events/${ev}/confirm"
              as: FlowManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE with http 409; status stays CONFIRMED"

      - name: flight_cancel_airborne_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Flight
          - errors[ERR_FLIGHT_NOT_CANCELLABLE]
        distinguishing_aspect: "Only SCHEDULED flights are cancellable; an AIRBORNE flight is rejected with ERR_FLIGHT_NOT_CANCELLABLE (409)."
        test_recipe:
          setup:
            - "facility, operator, one flight advanced to AIRBORNE"
          setup_api_calls:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id, f1_v: $.data.version }
            - call: "POST /atfm/flights/${f1}/updates"
              payload: { new_ops_status: "AIRBORNE", expected_flight_version: "${f1_v}" }
              as: Operator
              as_user_id: "${op_a}"
          trigger:
            - call: "POST /atfm/flights/${f1}/cancel"
              as: Operator
              as_user_id: "${op_a}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FLIGHT_NOT_CANCELLABLE with http 409"
            - "flight remains AIRBORNE"

      - name: flight_ops_skip_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Flight
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ops_status must step SCHEDULED -> AIRBORNE -> LANDED; a SCHEDULED -> LANDED skip is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "facility, operator, one SCHEDULED flight"
          setup_api_calls:
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id, f1_v: $.data.version }
          trigger:
            - call: "POST /atfm/flights/${f1}/updates"
              payload: { new_ops_status: "LANDED", expected_flight_version: "${f1_v}" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE with http 409; ops_status stays SCHEDULED"

      - name: slot_pool_shape_after_activation
        claim_type: side_effect_execution
        grounds:
          - calculations.rbs_slot_allocation
          - entities.ArrivalSlot.fields.is_ga_reserved
        distinguishing_aspect: "Activation of a rate-6 two-hour GDP mints exactly 12 slots; with 2 eligible flights exactly 2 are ASSIGNED, 9 carrier slots stay OPEN, and only the last slot (14:50) carries is_ga_reserved."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, 13:00-15:00Z; two op_a flights (13:05, 13:10)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Alpha Air", operator_type: "SCHEDULED_CARRIER" }
              as: SystemAdministrator
              captures: { op_a: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T15:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:05:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:10:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { f2: $.data.id }
          trigger:
