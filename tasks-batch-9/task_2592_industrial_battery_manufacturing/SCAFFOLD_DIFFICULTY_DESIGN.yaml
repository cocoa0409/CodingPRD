            - call: "POST /production-lots/${lot_big_id}/sampling-plans"
              payload: { expected_lot_version: "${lot_big_v2}", plan_reason: "tightened retest plan" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { big_n2: $.data.sample_size, big_c2: $.data.acceptance_number, big_rev2: $.data.sampling_plan_revision }
