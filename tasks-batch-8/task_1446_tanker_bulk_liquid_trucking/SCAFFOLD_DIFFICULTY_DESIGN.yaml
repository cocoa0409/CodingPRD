  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: variance_close_cascades_to_agreement_flag
        grounds:
          - state_machines.DeliveryTicket.OPEN_to_CLOSED_VARIANCE
          - state_machines.Shipment.DELIVERING_to_VARIANCE_REVIEW
          - entities.DedicatedTrailerAgreement.fields.flagged_shipment_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by delivery-ticket close (distinct trigger
          from the sibling's cert revoke): close mutates the DeliveryTicket
          (hop 1); that mutation flips Shipment DELIVERING -> VARIANCE_REVIEW
          (hop 2); that flip increments the ACTIVE DedicatedTrailerAgreement's
          flagged_shipment_count (hop 3, below the suspension threshold of 2).
        test_recipe:
          setup:
            - "Enrolled customer with ACTIVE dedicated agreement on trailer T-101; 1000-gal shipment on that trailer delivering; clock 2026-08-02T10:30:00Z"
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Dedicated Co", credit_limit_cents: 1000000000, dedicated_program_enrolled: true }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
