            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${g1}", readiness_rating: "READY_1_2", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { e1: $.data.id } }
