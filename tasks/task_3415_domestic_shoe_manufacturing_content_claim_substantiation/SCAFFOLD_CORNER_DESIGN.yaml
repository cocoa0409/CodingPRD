          - entities.TrainingEnrollment.fields.last_score
        distinguishing_aspect: "TRAINING_PASS_SCORE is inclusive: exactly 80 certifies on the first attempt; 79 routes to REMEDIATION (and a second 79 routes REMEDIATION -> FAILED, terminal)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory; ACTIVE workers Ada (enrolled STITCHING) and Grace (enrolled LASTING)."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_w_std
            - &k_enr_80
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w1}", operation: "STITCHING", target_level: 1 }
              as: TrainingCoordinator
              captures: { e80: $.data.id }
            - &k_w2_std
              call: "POST /footwear/workers"
              payload: { factory_id: "${f_id}", full_name: "Grace Hopper" }
              as: TrainingCoordinator
              captures: { w2: $.data.id }
            - &k_enr_79
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w2}", operation: "LASTING", target_level: 1 }
              as: TrainingCoordinator
              captures: { e79: $.data.id }
          trigger:
            - call: "POST /footwear/training-enrollments/${e80}/record-assessment"
              payload: { score: 80 }
              as: TrainingCoordinator
              captures: { s80: $.data.status }
            - call: "POST /footwear/training-enrollments/${e79}/record-assessment"
              payload: { score: 79 }
              as: TrainingCoordinator
              captures: { s79: $.data.status }
            - call: "POST /footwear/training-enrollments/${e79}/record-assessment"
              payload: { score: 79 }
              as: TrainingCoordinator
              captures: { s79b: $.data.status }
          assert:
            - "score 80: s80 == CERTIFIED (boundary is inclusive)"
            - "first score 79: s79 == REMEDIATION"
            - "second score 79 from REMEDIATION: s79b == FAILED (terminal) with attempt_count == 2"

      - name: second_open_enrollment_same_operation_is_rejected
        claim_type: Violation -> Error
