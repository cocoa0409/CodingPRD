          assert:
            - "response.data.error_id == ERR_OUTSIDE_RESTRICTION_WINDOW"
            - "HTTP status == 422"

      - name: complete_capacity_equal_allowed_strict_gt
        grounds:
          - validations[priority=12]
          - entities.Equipment.hopper_capacity_lbs
          - state_machines.SweepEvent.SCHEDULED_to_SWEPT
        distinguishing_aspect: |
          Weight boundary on POST /api/sweep-events/{id}/complete: total exactly equal to
          hopper_capacity_lbs (5000) is ALLOWED (strict >); 4200 + 800 == 5000 succeeds.
        test_recipe:
          setup:
            - "Started shift, 5000-lb hopper, already at 4200 lbs from one SWEPT event; a second event pending."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-5", type: "MECHANICAL", hopper_capacity_lbs: 5000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Ann", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/shifts/${shift_id}/start"
              payload: {}
              as: RouteDispatcher
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_a: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "B", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_b: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_a}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_a: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_b}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_a}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 4200 }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/sweep-events/${ev_b}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 800 }
              as: RouteDispatcher
          assert:
            - "SweepEvent.${ev_b}.status == SWEPT"
            - "Shift.${shift_id}.total_debris_lbs == 5000"

  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: citation_requires_block_sign_verified
        grounds:
          - validations[priority=8]
          - entities.Block.sign_status
          - state_machines.Citation.ISSUED_to_CONTESTED
        distinguishing_aspect: |
          Entity pair Citation<-Block: issuing a Citation depends on Block.sign_status ==
          VERIFIED. A POSTED-but-unverified block blocks issuance with
          ERR_SIGNAGE_NOT_ENFORCEABLE (no active suspension, so only the cross-entity dep bites).
        test_recipe:
          setup:
            - "Block with a POSTED (not VERIFIED) sign; no suspension; clock inside window."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "DEP001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SIGNAGE_NOT_ENFORCEABLE"

      - name: complete_requires_shift_in_progress
        grounds:
          - validations[priority=6]
          - entities.Shift.status
          - state_machines.SweepEvent.SCHEDULED_to_SWEPT
        distinguishing_aspect: |
          Entity pair SweepEvent<-Shift: completing a sweep depends on Shift.status ==
          IN_PROGRESS. A PLANNED (unstarted) shift blocks completion with
          ERR_SHIFT_NOT_IN_PROGRESS — a different entity pair than Citation<-Block.
        test_recipe:
          setup:
            - "A PLANNED (never started) shift, route + block, one SCHEDULED sweep."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-6", type: "VACUUM", hopper_capacity_lbs: 20000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Ivy", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/sweep-events/${ev_id}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 500 }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIFT_NOT_IN_PROGRESS"
            - "HTTP status == 409"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sweep_event_overlap_on_block_half_open
        grounds:
          - validations[priority=11]
          - entities.SweepEvent.window_start_utc
          - entities.SweepEvent.window_end_utc
          - errors[ERR_SWEEP_OVERLAP]
        distinguishing_aspect: |
          Resource = Block, interval semantics = half-open [start,end) with adjacency allowed.
          A second event [09:00,11:00) overlaps [08:00,10:00) on the same block -> ERR_SWEEP_OVERLAP.
        test_recipe:
          setup:
            - "Block with one SCHEDULED sweep [08:00,10:00) on 2026-03-10."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T08:00:00Z", window_end_utc: "2026-03-10T10:00:00Z" }
              as: RouteDispatcher
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T09:00:00Z", window_end_utc: "2026-03-10T11:00:00Z" }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SWEEP_OVERLAP"
            - "HTTP status == 409"

      - name: shift_overlap_on_equipment_buffer
        grounds:
          - validations[priority=11]
          - entities.Shift.start_utc
          - entities.Shift.end_utc
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Resource = Equipment, interval semantics = CLOSED with a 30-minute buffer. A shift
          starting 10:15 on the same unit whose prior shift ended 10:00 falls inside the
          10:00+30min buffer -> ERR_SHIFT_OVERLAP (different arithmetic than the block's
          adjacency-allowed half-open rule).
        test_recipe:
          setup:
            - "Equipment with one shift 06:00-10:00 on 2026-03-10."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-7", type: "MECHANICAL", hopper_capacity_lbs: 20000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Ken", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T10:00:00Z" }
              as: RouteDispatcher
              captures: { shift1: $.data.id }
          trigger:
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Mia", shift_date: "2026-03-10", start_utc: "2026-03-10T10:15:00Z", end_utc: "2026-03-10T14:00:00Z" }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHIFT_OVERLAP"
            - "HTTP status == 409"

  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: citation_issue_dismiss_pending_cents_conserved
        grounds:
          - state_machines.Citation.ISSUED_to_CONTESTED
          - state_machines.Citation.CONTESTED_to_DISMISSED
          - calculations.block_pending_citation_cents
          - entities.Block.pending_citation_cents
        distinguishing_aspect: |
          Conserved quantity = money (Block.pending_citation_cents). Issue debits +6000,
          the compensating dismissal credits -6000, leaving pending_citation_cents back at 0
          == sum of amount_due over {ISSUED,CONTESTED} citations.
        test_recipe:
          setup:
            - "Block VERIFIED sign, pending_citation_cents == 0 before issuance."
            - "One citation issued (6000), contested, then dismissed."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "INV001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
            - call: "POST /api/citations/${cit_id}/contest"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /api/citations/${cit_id}/adjudicate"
              payload: { decision: "DISMISS" }
              as: EnforcementOfficer
              as_user_id: "officer-2"
          assert:
            - "Citation.${cit_id}.status == DISMISSED"
            - "Block.${block_id}.pending_citation_cents == 0"

      - name: sweep_complete_void_completed_count_conserved
        grounds:
          - state_machines.SweepEvent.SCHEDULED_to_SWEPT
          - state_machines.SweepEvent.SWEPT_to_VOIDED
          - calculations.route_completed_block_count
          - entities.Route.completed_block_count
        distinguishing_aspect: |
          Conserved quantity = a count (Route.completed_block_count). Complete increments +1,
          the compensating void decrements -1, returning completed_block_count to 0 == count
          of SWEPT events on the route. A different conserved-quantity type than the money ledger.
        test_recipe:
          setup:
            - "Started shift, route + block, one SCHEDULED sweep; route.completed_block_count == 0."
            - "Sweep completed (count -> 1) then voided."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-8", type: "MECHANICAL", hopper_capacity_lbs: 20000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Ron", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/shifts/${shift_id}/start"
              payload: {}
              as: RouteDispatcher
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_id}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 900 }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/sweep-events/${ev_id}/void"
              payload: { reason: "data entry error" }
              as: RouteDispatcher
          assert:
            - "SweepEvent.${ev_id}.status == VOIDED"
            - "Route.${route_id}.completed_block_count == 0"
            - "Shift.${shift_id}.total_debris_lbs == 0"
