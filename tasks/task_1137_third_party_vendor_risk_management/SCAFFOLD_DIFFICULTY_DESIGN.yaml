              as: InternalAuditor
          assert:
            - "AuditExercise.${au_ac}.status == FINDINGS_ISSUED"
            - "AuditFinding.${f_ac}.raised_incident_id != null  # hop 1"
            - "Incident identified by AuditFinding.${f_ac}.raised_incident_id has status == OPEN AND severity == SEV_2 AND incident_type == REGULATORY_FINDING"
            - "VendorEngagement.${e_ac}.risk_attention_state remains NORMAL until the auto-raised Incident is TRIAGED (cascade hop 2 is incident → triage → engagement, not incident → engagement directly)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_sod_on_dd_approve
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_DD_NOT_UNDER_REVIEW]
          - errors[ERR_SOD_DD_SELF_APPROVE]
        distinguishing_aspect: |
          Error-category pair = state (priority 4) vs business_safety (priority 5).
          Submit a DD package (do NOT begin review) and then have the SAME
          VendorRelationshipManager who submitted attempt to approve as RiskOfficer
          with the submitter's X-User-ID. Both violations fire: state check
          (package is SUBMITTED, not UNDER_REVIEW) AND SoD check (approver ==
          submitter). The state error must win because 4 < 5. The supplied
          OCC version is well-formed (a ${var} from a prior GET) so the only
          reason for rejection is the state / SoD conflict.
        test_recipe:
          setup:
            - "Vendor, engagement, DD package created and submitted by VRM user vrm_submitter_1."
          setup_api_calls:
            - call: "POST /tprm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tprm/vendors"
              payload: { legal_name: "Prio1 Vendor", headquarters_region: "NA", service_category: "BPO" }
              as: VendorRelationshipManager
              captures: { v_pr1: $.data.id }
            - call: "POST /tprm/vendors/${v_pr1}/engagements"
              payload: { engagement_code: "PR1-E1", service_summary: "BPO", annual_spend_cents: 100, data_sensitivity: "INTERNAL" }
              as: VendorRelationshipManager
              captures: { e_pr1: $.data.id }
            - call: "POST /tprm/engagements/${e_pr1}/due-diligence-packages"
              payload: { financial_review_score: 90, security_review_score: 90, compliance_review_score: 90, financial_reviewer_id: "u_f14", security_reviewer_id: "u_s14", compliance_reviewer_id: "u_c14" }
              as: VendorRelationshipManager
