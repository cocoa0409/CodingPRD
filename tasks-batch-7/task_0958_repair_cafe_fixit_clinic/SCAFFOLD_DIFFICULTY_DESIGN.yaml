  - rule_id: boundary_precision_check
    instances:
      - name: shift_duration_exactly_21600_allowed
        grounds:
          - validations[priority=6]
          - entities.FixerShift.fields.end_time
        distinguishing_aspect: |
          Metric = shift duration in seconds, endpoint = POST /api/fixer-shifts: exactly
          21600 seconds (6h00m00s) MUST be accepted (<=), while 21601 seconds MUST fail
          with ERR_SHIFT_TOO_LONG — the boundary itself is the test.
        test_recipe:
          setup: ["Event + station + fixer exist; clock 2026-06-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/repair-events", payload: { name: "Cafe Lambda", starts_at: "2026-06-01T06:00:00Z", ends_at: "2026-06-01T22:00:00Z", intake_item_cap: 5 }, as: Coordinator, captures: { ev: $.data.id } }
