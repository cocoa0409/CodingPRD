# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth probe over §1.1–§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: member_create_initial_state_and_computed_defaults
        claim_type: creation_defaults_computed
        grounds:
          - "entities.Member"
        distinguishing_aspect: "A created member starts INTAKE with server-computed adherence 100.00/100.00 and oop 0; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mtm/members", payload: { full_name: "C One", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-C1", allergies: ["PEANUT"], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_status: $.data.status, m_ad: $.data.adherence_delivered_pct, m_oop: $.data.oop_accumulator_cents, m_v: $.data.version } }
          assert:
            - "Member.${m_id}.status == INTAKE"
            - "adherence_delivered_pct == 100.00 and adherence_confirmed_pct == 100.00 (vacuous window)"
            - "oop_accumulator_cents == 0 and version == 1"

      - name: member_list_pagination_envelope
        claim_type: listing_pagination
        grounds:
          - "entities.Member"
          - "response_envelope"
        distinguishing_aspect: "GET /mtm/members with limit=1 returns one row plus pagination fields total_count == 2 and has_more == true per the fixed envelope."
        test_recipe:
          setup: ["two members exist"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "C Two", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-C2", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator }
            - { call: "POST /mtm/members", payload: { full_name: "C Three", payer_type: "MEDICARE_ADVANTAGE", payer_member_id: "MA-C3", allergies: [], income_fpl_percent: 160, household_size: 1 }, as: CareCoordinator }
          trigger:
            - { call: "GET /mtm/members", payload: { limit: 1 }, as: Dietitian }
          assert:
            - "response_type == array; data length == 1; total_count == 2; has_more == true"

      - name: member_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Member"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but unknown member UUID returns the error envelope with ERR_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mtm/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Dietitian, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and response_type == error"

      - name: menu_item_create_missing_required_field
        claim_type: required_fields
        grounds:
          - "entities.MenuItem"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting the required input field name yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mtm/menu-items", payload: { sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: cold_chain_reading_immutable_common_fields_false
        claim_type: immutability
        grounds:
          - "entities.ColdChainReading"
        distinguishing_aspect: "ColdChainReading is append-only (common_fields: false): its create response exposes id and created_at but no version or updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup:
            - "Delivery OUT_FOR_DELIVERY (minimal billing-free chain: member, referral, prescription, cycle, auth, route)"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "C Four", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-C4", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-05-04" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 5 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-20", weight_kg: 75.0, hba1c_pct: 7.0 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-C4" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-c4", route_date: "2026-05-06", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-05-06" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
          trigger:
            - { call: "POST /mtm/deliveries/${d_id}/cold-chain-readings", payload: { recorded_at: "2026-05-06T09:00:00Z", temp_celsius: 7.0 }, as: Driver, captures: { rd_id: $.data.id, rd_at: $.data.created_at } }
          assert:
            - "reading response contains id and created_at and temp_celsius == 7.0"
            - "reading response contains NO version and NO updated_at keys (common_fields: false)"

  # -------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: referral_accept_from_submitted_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Referral.SUBMITTED_to_TRIAGED"
          - "errors[ERR_REFERRAL_NOT_ACTIONABLE]"
        distinguishing_aspect: "ACCEPT is only legal from TRIAGED; from SUBMITTED it fails with ERR_REFERRAL_NOT_ACTIONABLE and the referral stays SUBMITTED."
        test_recipe:
          setup: ["member exists; referral SUBMITTED"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "S One", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-S1", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REFERRAL_NOT_ACTIONABLE"
            - "Referral.${r_id}.status == SUBMITTED (no side effects fired)"

      - name: referral_auto_expires_on_clock_sweep
        claim_type: auto_transition
        grounds:
          - "state_machines.Referral.SUBMITTED_to_EXPIRED"
        distinguishing_aspect: "Advancing the logical clock past expires_at flips a SUBMITTED referral to EXPIRED via the system sweep, with no explicit decision call."
        test_recipe:
          setup: ["member exists; referral SUBMITTED with expires_at 2026-05-01"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "S Two", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-S2", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-05-01" }, as: ReferringProvider, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /mtm/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /mtm/referrals/${r_id}", payload: {}, as: CareCoordinator, captures: { r_status: $.data.status } }
          assert:
            - "Referral.${r_id}.status == EXPIRED"

      - name: member_disenrolled_reactivation_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Member"
          - "errors[ERR_MEMBER_TERMINAL]"
        distinguishing_aspect: "DISENROLLED is terminal: a status request back to ACTIVE fails with ERR_MEMBER_TERMINAL."
        test_recipe:
          setup: ["member ACTIVE, then DISENROLLED (no prescriptions -> empty cascade)"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "S Three", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-S3", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "DISENROLLED" }, as: CareCoordinator }
          trigger:
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEMBER_TERMINAL"
            - "Member.${m_id}.status == DISENROLLED"
      - name: claim_denied_correct_resubmit_cycle
        claim_type: valid_transition_cycle
        grounds:
          - "state_machines.Claim.SUBMITTED_to_DENIED"
          - "state_machines.Claim.DENIED_to_DRAFT"
        distinguishing_aspect: "The resubmission loop works end-to-end: SUBMITTED -> DENIED (remit) -> DRAFT (correct) -> SUBMITTED (submit again) with no ledger effects from the denial."
        test_recipe:
          setup:
            - "Claim created and SUBMITTED for a delivered cycle (waiver member fpl 130 -> 0% tier; gross 4625 for Rice Bowl x5)"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "S Four", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-S4", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-04-13" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 5 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-15", weight_kg: 80.0, hba1c_pct: 7.1 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-S4" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-s4", route_date: "2026-04-15", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-04-15" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
            - { call: "POST /mtm/deliveries/${d_id}/out-for-delivery", payload: {}, as: Driver }
            - { call: "POST /mtm/deliveries/${d_id}/mark-delivered", payload: {}, as: Driver }
            - { call: "GET /mtm/reauthorizations/${a_id}", payload: {}, as: BillingSpecialist, captures: { a_v: $.data.version } }
            - { call: "POST /mtm/claims", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", authorization_id: "${a_id}", expected_reauthorization_version: "${a_v}" }, as: BillingSpecialist, captures: { c_id: $.data.id } }
            - { call: "POST /mtm/claims/${c_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bill-1" }
            - { call: "POST /mtm/claims/${c_id}/remit", payload: { outcome: "DENIED" }, as: PayerReviewer, captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /mtm/claims/${c_id}/correct", payload: {}, as: BillingSpecialist, captures: { st2: $.data.status } }
            - { call: "POST /mtm/claims/${c_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bill-1", captures: { st3: $.data.status } }
          assert:
            - "after DENIED remit: status == DENIED and Member.${m_id}.oop_accumulator_cents == 0"
            - "after correct: status == DRAFT"
            - "after resubmit: status == SUBMITTED (cycle still FULFILLED, authorization still APPROVED)"

      - name: delivery_mark_delivered_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Delivery.SCHEDULED_to_OUT_FOR_DELIVERY"
          - "errors[ERR_DELIVERY_NOT_OUT_FOR_DELIVERY]"
        distinguishing_aspect: "mark-delivered from SCHEDULED (skipping OUT_FOR_DELIVERY) fails with ERR_DELIVERY_NOT_OUT_FOR_DELIVERY and no unit consumption occurs."
        test_recipe:
          setup: ["delivery SCHEDULED on a DISPATCHED route (reserved_units == 1)"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "S Five", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-S5", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-05-04" }, as: Dietitian, captures: { mc_id: $.data.id } }
            - { call: "POST /mtm/menu-cycles/${mc_id}/items", payload: { menu_item_id: "${i_a}", quantity: 5 }, as: Dietitian }
            - { call: "POST /mtm/menu-cycles/${mc_id}/freeze", payload: {}, as: Dietitian }
            - { call: "POST /mtm/outcome-assessments", payload: { member_id: "${m_id}", assessed_at: "2026-04-20", weight_kg: 75.0, hba1c_pct: 7.0 }, as: Dietitian }
            - { call: "POST /mtm/reauthorizations", payload: { member_id: "${m_id}", authorized_units: 4, max_amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: CareCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /mtm/reauthorizations/${a_id}/approve", payload: { authorization_number: "AUTH-S5" }, as: PayerReviewer }
            - { call: "POST /mtm/delivery-routes", payload: { driver_id: "drv-s5", route_date: "2026-05-06", start_time: "08:00", end_time: "12:00", capacity_stops: 20 }, as: LogisticsCoordinator, captures: { rt_id: $.data.id } }
            - { call: "POST /mtm/delivery-routes/${rt_id}/dispatch", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /mtm/deliveries", payload: { member_id: "${m_id}", menu_cycle_id: "${mc_id}", route_id: "${rt_id}", service_date: "2026-05-06" }, as: LogisticsCoordinator, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /mtm/deliveries/${d_id}/mark-delivered", payload: {}, as: Driver, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DELIVERY_NOT_OUT_FOR_DELIVERY"
            - "Delivery.${d_id}.status == SCHEDULED and Reauthorization.${a_id}.used_units == 0 and reserved_units == 1"

      - name: route_complete_with_open_delivery_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.DeliveryRoute.DISPATCHED_to_COMPLETED"
          - "errors[ERR_ROUTE_HAS_OPEN_DELIVERIES]"
        distinguishing_aspect: "Route completion is blocked while any of its deliveries is non-terminal (compound guard on child states)."
        test_recipe:
          setup: ["DISPATCHED route with one SCHEDULED delivery"]
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "S Six", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-S6", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
            - { call: "POST /mtm/members/${m_id}/status", payload: { target_status: "ACTIVE" }, as: CareCoordinator, captures: { m_v1: $.data.version } }
            - { call: "POST /mtm/referrals", payload: { member_id: "${m_id}", diagnosis_codes: ["N18.3"], referred_diet_type: "RENAL", expires_at: "2026-06-30" }, as: ReferringProvider, captures: { r_id: $.data.id } }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "TRIAGE" }, as: CareCoordinator }
            - { call: "POST /mtm/referrals/${r_id}/decision", payload: { decision: "ACCEPT" }, as: CareCoordinator }
            - { call: "POST /mtm/diet-prescriptions", payload: { member_id: "${m_id}", referral_id: "${r_id}", diet_type: "RENAL", daily_sodium_mg_max: 2000, daily_potassium_mg_max: 2000, daily_phosphorus_mg_max: 1000, daily_carbs_g_max: 250, daily_protein_g_min: 60, excluded_allergens: [], meals_per_week: 10, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: Dietitian, captures: { p_id: $.data.id } }
            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Rice Bowl", sodium_mg: 400, potassium_mg: 300, phosphorus_mg: 150, carbs_g: 40, protein_g: 20, allergen_codes: [], base_cost_cents: 700 }, as: ProgramAdmin, captures: { i_a: $.data.id } }
