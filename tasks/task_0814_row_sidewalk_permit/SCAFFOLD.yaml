scenario: "Right-of-Way & Sidewalk Obstruction Permit: application & site sketch, closure/obstruction & traffic-control plan, fee & restoration bond, inspection & restoration sign-off, utility-cut moratorium, encroachment agreement, violation/penalty, expiration"
domain_name: "row-sidewalk-permit"
api_prefix: "/"
# Multiple top-level resource collections (/permits, /applicants, /street-segments,
# /sidewalk-spans, plus child action collections /lane-closures, /bonds,
# /traffic-control-plans, /encroachment-agreements); the API root is "/".

complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "temporal_windowing"
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  # Central Permit aggregate (hierarchical children: TCP, Bond, LaneClosure,
  # SidewalkObstruction, EncroachmentAgreement, ViolationNotice) PLUS flat FK
  # references to Applicant / StreetSegment / SidewalkSpan resources.
  state_machine_shape: cyclic
  # Permit review revision loop (UNDER_REVIEW<->RETURNED_FOR_REVISION) and
  # LaneClosure restoration loop (RESTORATION_PENDING<->RESTORATION_REJECTED)
  # are cyclic; Bond and Permit terminal fan-out are branching.
  relationship_patterns:
    - one_to_many          # Permit -> LaneClosure / SidewalkObstruction / ViolationNotice
    - cross_aggregate      # Bond release depends on LaneClosure states; permit fee on segment zone
  role_model: segregation_of_duties
  # The PermitReviewer who APPROVED a permit (assigned_reviewer_user_id) may NOT
  # be the same X-User-ID that ISSUES it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Legal name of the contractor/permittee organization"
      - name: license_number
        type: string
        source: input
        description: "Municipal contractor license identifier"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email"

  - name: StreetSegment
    parent: null
    common_fields: true
    fields:
      - name: block_label
        type: string
        source: input
        description: "Human label for the roadway block face, e.g. 'Main St 100-199'"
      - name: zone_class
        type: enum
        source: input
        description: "Right-of-way class driving fee rates and moratorium length"
        constraints: "one of RESIDENTIAL, COMMERCIAL, ARTERIAL"
      - name: last_repaved_date
        type: string
        source: input
        description: "Date the roadway was last repaved (YYYY-MM-DD); anchors utility-cut moratorium"
      - name: roadway_lane_count
        type: integer
        source: input
        description: "Number of travel lanes on this segment"
      - name: moratorium_waived
        type: boolean
        source: input
        default: false
        description: "When true, the utility-cut moratorium is administratively waived for this segment"
      - name: moratorium_end_date
        type: string
        source: computed
        description: "Computed = last_repaved_date + MORATORIUM_YEARS[zone_class]; see calculations.moratorium_window"
      - name: active_lane_closure_count
        type: integer
        source: computed
        default: 0
        description: "Derived count of LaneClosures on this segment currently in ACTIVE status; see calculations.segment_active_closure_count"

  - name: SidewalkSpan
    parent: null
    common_fields: true
    fields:
      - name: block_label
        type: string
        source: input
        description: "Human label for the sidewalk span"
      - name: side
        type: enum
        source: input
        description: "Which side of the block the span runs along"
        constraints: "one of NORTH, SOUTH, EAST, WEST"
      - name: width_ft
        type: number
        source: input
        description: "Total sidewalk width in feet"
      - name: ada_min_clearance_ft
        type: number
        source: input
        default: 4.0
        description: "Minimum pedestrian clearance (feet) that must remain passable during an obstruction"

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the permittee who owns this permit"
      - name: street_segment_id
        type: string
        source: input
        description: "FK -> StreetSegment.id; the roadway block the permit governs"
      - name: primary_obstruction_type
        type: enum
        source: input
        description: "Scope used for the estimated occupancy fee"
        constraints: "one of LANE, FULL_ROAD, SIDEWALK"
      - name: requested_start_date
        type: string
        source: input
        description: "Requested occupancy start date (YYYY-MM-DD)"
      - name: requested_end_date
        type: string
        source: input
        description: "Requested occupancy end date (YYYY-MM-DD); must be strictly after requested_start_date"
      - name: requires_utility_cut
        type: boolean
        source: input
        default: false
        description: "Whether the requested work involves a pavement cut (moratorium-relevant)"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle state"
        constraints: "one of DRAFT, UNDER_REVIEW, RETURNED_FOR_REVISION, APPROVED, ISSUED, CLOSED_OUT, EXPIRED, REVOKED"
      - name: assigned_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the PermitReviewer who APPROVED the permit; used for segregation-of-duties on issue"
      - name: actual_start_date
        type: string
        source: system
        description: "Set to the logical clock date when the first LaneClosure is activated (nullable until then)"
      - name: actual_end_date
        type: string
        source: system
        description: "Set to the logical clock date at close-out (nullable until then)"
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: "Occupancy fee (estimated variant) computed at issue from requested dates; see calculations.occupancy_fee"
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Occupancy fee (final variant) computed at close-out from actual dates; see calculations.occupancy_fee"
      - name: surcharge_cents
        type: integer
        source: computed
        description: "Municipal surcharge computed at issue; see calculations.total_permit_charge"
      - name: total_charge_cents
        type: integer
        source: computed
        description: "estimated_fee + TCP review fee + inspection fee + surcharge, computed at issue; see calculations.total_permit_charge"
      - name: cumulative_penalty_cents
        type: integer
        source: computed
        default: 0
        description: "Running sum of all ViolationNotice.penalty_cents on this permit; see calculations.penalty_assessment"
      - name: valid_until
        type: string
        source: system
        description: "Set to requested_end_date at issue; permit may be expired only after this date"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical clock timestamp at issue (nullable until issued)"

  - name: TrafficControlPlan
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit this traffic-control plan belongs to"
      - name: device_list
        type: array
        source: input
        description: "List of traffic-control devices deployed, e.g. [CONES, BARRICADES, SIGNS]"
      - name: requires_flaggers
        type: boolean
        source: input
        description: "Whether human flaggers are required for this plan"
      - name: flagger_count
        type: integer
        source: input
        default: 0
        description: "Number of flaggers assigned; must be >= 1 when requires_flaggers is true (checked at plan approval)"
      - name: setback_ft
        type: number
        source: input
        description: "Buffer setback in feet from the work zone to live traffic"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Plan review state"
        constraints: "one of SUBMITTED, APPROVED, REJECTED"
      - name: review_notes
        type: string
        source: system
        description: "Reviewer notes captured on the approve/reject decision (nullable)"

  - name: RestorationBond
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit this bond secures"
      - name: posted_cents
        type: integer
        source: input
        description: "Bond amount posted by the applicant, in cents"
      - name: required_cents
        type: integer
        source: computed
        description: "Minimum required bond = max(BOND_FLOOR, estimated_occupancy_fee * BOND_MULTIPLIER); see calculations.bond_required"
      - name: held_cents
        type: integer
        source: computed
        description: "Amount currently held; equals posted_cents while POSTED, 0 after RELEASED/FORFEITED"
      - name: refunded_cents
        type: integer
        source: computed
        default: 0
        description: "Final refund paid back at release; see calculations.bond_refund (final variant)"
      - name: forfeited_cents
        type: integer
        source: computed
        default: 0
        description: "Amount retained by the municipality at release or forfeiture; held_cents + refunded_cents + forfeited_cents always equals posted_cents"
      - name: provisional_refund_cents
        type: integer
        source: computed
        description: "Preview refund recomputed whenever a LaneClosure requests restoration, using estimated deficiencies; see calculations.bond_refund (provisional variant)"
      - name: status
        type: enum
        source: system
        default: POSTED
        description: "Bond lifecycle"
        constraints: "one of POSTED, RELEASED, FORFEITED"

  - name: LaneClosure
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit authorizing this closure"
      - name: street_segment_id
        type: string
        source: input
        description: "FK -> StreetSegment.id; the roadway resource occupied by this closure"
      - name: obstruction_type
        type: enum
        source: input
        description: "Roadway obstruction extent"
        constraints: "one of LANE, FULL_ROAD"
      - name: start_date
        type: string
        source: input
        description: "Closure occupancy start (YYYY-MM-DD); interval is half-open [start_date, end_date)"
      - name: end_date
        type: string
        source: input
        description: "Closure occupancy end (YYYY-MM-DD, exclusive); must be strictly after start_date"
      - name: requires_utility_cut
        type: boolean
        source: input
        default: false
        description: "Whether this closure involves a pavement cut (triggers utility-cut moratorium check)"
      - name: estimated_deficiency_cents
        type: integer
        source: input
        default: 0
        description: "Applicant/inspector estimate of restoration shortfall captured at request-restoration; feeds provisional bond refund"
      - name: assessed_deficiency_cents
        type: integer
        source: system
        default: 0
        description: "Inspector-assessed restoration shortfall captured at sign-off; feeds final bond refund"
      - name: inspector_user_id
        type: string
        source: system
        description: "X-User-ID of the Inspector who signed off restoration (nullable until sign-off)"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Closure lifecycle"
        constraints: "one of PLANNED, ACTIVE, RESTORATION_PENDING, RESTORED, RESTORATION_REJECTED, VOIDED"

  - name: SidewalkObstruction
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit authorizing this sidewalk obstruction"
      - name: sidewalk_span_id
        type: string
        source: input
        description: "FK -> SidewalkSpan.id; the sidewalk resource occupied"
      - name: start_date
        type: string
        source: input
        description: "Obstruction start (YYYY-MM-DD); occupancy requires a clearance buffer from neighbors, see validations"
      - name: end_date
        type: string
        source: input
        description: "Obstruction end (YYYY-MM-DD, exclusive); must be strictly after start_date"
      - name: maintained_clearance_ft
        type: number
        source: input
        description: "Pedestrian clearance the applicant will maintain; must be >= SidewalkSpan.ada_min_clearance_ft"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Obstruction lifecycle; created directly ACTIVE"
        constraints: "one of ACTIVE, RESTORED, VOIDED"

  - name: EncroachmentAgreement
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit this long-term encroachment agreement attaches to"
      - name: term_months
        type: integer
        source: input
        description: "Requested encroachment term in months"
      - name: proposed_fee_cents
        type: integer
        source: input
        description: "Applicant-proposed annual encroachment fee, in cents"
      - name: agreed_fee_cents
        type: integer
        source: system
        description: "Fee locked at execution (equals proposed_fee_cents at the time of execute); nullable until EXECUTED"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Agreement lifecycle"
        constraints: "one of PROPOSED, EXECUTED"

  - name: ViolationNotice
    parent: Permit
    common_fields: false
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the permit cited"
      - name: violation_type
        type: enum
        source: input
        description: "Category of the citation"
        constraints: "one of UNPERMITTED_WORK, TCP_VIOLATION, OVERSTAY, RESTORATION_FAILURE"
      - name: penalty_cents
        type: integer
        source: computed
        description: "Escalating penalty computed at issuance from the count of prior notices; see calculations.penalty_assessment"
      - name: note
        type: string
        source: input
        description: "Free-text enforcement note (optional)"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT, EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /permits/{id}/submit"
        actor: Applicant
        preconditions:
          - "acting Applicant owns the permit (permit.applicant_id == X-User-ID)"
        side_effects:
          - "status -> UNDER_REVIEW"
      - from: RETURNED_FOR_REVISION
        to: UNDER_REVIEW
        trigger: "POST /permits/{id}/submit"
        actor: Applicant
        preconditions:
          - "acting Applicant owns the permit"
        side_effects:
          - "status -> UNDER_REVIEW"
        note: "Revision loop: a returned permit is re-submitted for another review round (cycle)."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /permits/{id}/decision (outcome=APPROVED)"
        actor: PermitReviewer
        preconditions: []
        side_effects:
          - "status -> APPROVED"
          - "set assigned_reviewer_user_id = X-User-ID of the reviewer"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /permits/{id}/decision (outcome=RETURNED)"
        actor: PermitReviewer
        preconditions: []
        side_effects:
          - "status -> RETURNED_FOR_REVISION"
          - "store review_notes"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: PermitReviewer
        preconditions:
          - "the permit's TrafficControlPlan exists and is APPROVED (business_safety)"
          - "the permit's RestorationBond exists with status POSTED (business_fiscal)"
          - "X-User-ID != permit.assigned_reviewer_user_id (segregation of duties)"
        side_effects:
          - "status -> ISSUED"
          - "compute estimated_fee_cents (occupancy_fee estimated variant)"
          - "compute surcharge_cents and total_charge_cents (total_permit_charge)"
          - "set valid_until = requested_end_date"
          - "set issued_at = logical clock now"
      - from: ISSUED
        to: CLOSED_OUT
        trigger: "POST /permits/{id}/close-out"
        actor: PermitReviewer
        preconditions:
          - "every LaneClosure on the permit is in {RESTORED, VOIDED}"
          - "every SidewalkObstruction on the permit is in {RESTORED, VOIDED}"
        side_effects:
          - "status -> CLOSED_OUT"
          - "set actual_end_date = logical clock date"
          - "compute final_fee_cents (occupancy_fee final variant) using actual_start_date..actual_end_date; if actual_start_date is null (no closures activated), final_fee_cents = estimated_fee_cents"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /permits/{id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "logical clock date > permit.valid_until (strictly after the last valid day)"
        side_effects:
          - "status -> EXPIRED"
      - from: ISSUED
        to: REVOKED
        trigger: "system: POST /permits/{id}/violations pushes cumulative_penalty_cents >= PENALTY_REVOKE_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "permit.status == ISSUED"
          - "permit.cumulative_penalty_cents >= 37500 after the notice is applied"
        side_effects:
          - "status -> REVOKED"
          - "CASCADE: every LaneClosure in {PLANNED, ACTIVE, RESTORATION_PENDING} -> VOIDED (see LaneClosure ISSUED-revoke transition)"
          - "CASCADE: every SidewalkObstruction in {ACTIVE} -> VOIDED"

  - entity: TrafficControlPlan
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /traffic-control-plans/{id}/decision (outcome=APPROVED)"
        actor: PermitReviewer
        preconditions:
          - "if plan.requires_flaggers is true then plan.flagger_count >= 1 (business_safety)"
        side_effects:
          - "status -> APPROVED"
          - "store review_notes"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /traffic-control-plans/{id}/decision (outcome=REJECTED)"
        actor: PermitReviewer
        preconditions: []
        side_effects:
          - "status -> REJECTED"
          - "store review_notes"

  - entity: RestorationBond
    initial_state: POSTED
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: POSTED
        to: RELEASED
        trigger: "POST /bonds/{id}/release"
        actor: PermitReviewer
        preconditions:
          - "every LaneClosure on the bond's permit is in {RESTORED, VOIDED} (cross-entity: Bond depends on LaneClosure states)"
        side_effects:
          - "compute refunded_cents (bond_refund final variant)"
          - "set forfeited_cents = posted_cents - refunded_cents"
          - "set held_cents = 0"
          - "status -> RELEASED"
      - from: POSTED
        to: FORFEITED
        trigger: "system: cascade from Permit REVOKED via a VOIDED LaneClosure with outstanding restoration"
        actor: system
        preconditions:
          - "a LaneClosure on this permit transitioned to VOIDED while not RESTORED"
        side_effects:
          - "set forfeited_cents = held_cents"
          - "set held_cents = 0, refunded_cents = 0"
          - "status -> FORFEITED"

  - entity: LaneClosure
    initial_state: PLANNED
    terminal_states: [RESTORED, VOIDED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /lane-closures/{id}/activate"
        actor: Applicant
        preconditions:
          - "parent Permit.status == ISSUED (cross-entity: LaneClosure depends on Permit state)"
          - "acting Applicant owns the permit"
        side_effects:
          - "status -> ACTIVE"
          - "increment StreetSegment.active_lane_closure_count by 1"
          - "if permit.actual_start_date is null, set permit.actual_start_date = logical clock date"
      - from: ACTIVE
        to: RESTORATION_PENDING
        trigger: "POST /lane-closures/{id}/request-restoration"
        actor: Applicant
        preconditions:
          - "acting Applicant owns the permit"
        side_effects:
          - "status -> RESTORATION_PENDING"
          - "set estimated_deficiency_cents from input"
          - "recompute parent bond.provisional_refund_cents (bond_refund provisional variant)"
      - from: RESTORATION_PENDING
        to: RESTORED
        trigger: "POST /lane-closures/{id}/sign-off (result=PASS)"
        actor: Inspector
        preconditions:
          - "closure.status == RESTORATION_PENDING"
        side_effects:
          - "status -> RESTORED"
          - "set assessed_deficiency_cents from input, set inspector_user_id"
          - "decrement StreetSegment.active_lane_closure_count by 1"
      - from: RESTORATION_PENDING
        to: RESTORATION_REJECTED
        trigger: "POST /lane-closures/{id}/sign-off (result=FAIL)"
        actor: Inspector
        preconditions:
          - "closure.status == RESTORATION_PENDING"
        side_effects:
          - "status -> RESTORATION_REJECTED"
          - "set assessed_deficiency_cents from input, set inspector_user_id"
      - from: RESTORATION_REJECTED
        to: RESTORATION_PENDING
        trigger: "POST /lane-closures/{id}/request-restoration"
        actor: Applicant
        preconditions:
          - "acting Applicant owns the permit"
        side_effects:
          - "status -> RESTORATION_PENDING"
          - "set estimated_deficiency_cents from input"
          - "recompute parent bond.provisional_refund_cents"
        note: "Restoration loop: a failed restoration is re-worked and re-submitted (cycle)."
      - from: ACTIVE
        to: VOIDED
        trigger: "system: cascade from Permit REVOKED"
        actor: system
        preconditions:
          - "parent Permit transitioned to REVOKED"
        side_effects:
          - "status -> VOIDED"
          - "decrement StreetSegment.active_lane_closure_count by 1"
          - "CASCADE: if this closure was never RESTORED, drive parent RestorationBond POSTED -> FORFEITED"
      - from: PLANNED
        to: VOIDED
        trigger: "system: cascade from Permit REVOKED"
        actor: system
        preconditions:
          - "parent Permit transitioned to REVOKED"
        side_effects:
          - "status -> VOIDED"
      - from: RESTORATION_PENDING
        to: VOIDED
        trigger: "system: cascade from Permit REVOKED"
        actor: system
        preconditions:
          - "parent Permit transitioned to REVOKED"
        side_effects:
          - "status -> VOIDED"
          - "decrement StreetSegment.active_lane_closure_count by 1"
          - "CASCADE: if this closure was never RESTORED, drive parent RestorationBond POSTED -> FORFEITED"

  - entity: SidewalkObstruction
    initial_state: ACTIVE
    terminal_states: [RESTORED, VOIDED]
    transitions:
      - from: ACTIVE
        to: RESTORED
        trigger: "POST /sidewalk-obstructions/{id}/complete-restoration"
        actor: Applicant
        preconditions:
          - "acting Applicant owns the permit"
        side_effects:
          - "status -> RESTORED"
      - from: ACTIVE
        to: VOIDED
        trigger: "system: cascade from Permit REVOKED"
        actor: system
        preconditions:
          - "parent Permit transitioned to REVOKED"
        side_effects:
          - "status -> VOIDED"

  - entity: EncroachmentAgreement
    initial_state: PROPOSED
    terminal_states: [EXECUTED]
    transitions:
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /encroachment-agreements/{id}/execute"
        actor: PermitReviewer
        preconditions:
          - "parent Permit.status == ISSUED (cross-entity: EncroachmentAgreement depends on Permit state)"
        side_effects:
          - "status -> EXECUTED"
          - "set agreed_fee_cents = proposed_fee_cents"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: bond-post-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /permits/{id}/bond"
    occ_field: "expected_permit_version"
    description: |
      Posting a RestorationBond against a Permit whose version has advanced since
      the client last observed it is rejected. A permit's bond may be re-posted to
      supersede a prior bond (e.g. to raise the amount before issue); when a
      superseding bond has already been posted the parent permit's version has
      advanced, so a post that still carries the stale version is refused. The rule
      is stated purely as a stale-version check, not in terms of overlapping requests.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: occupancy_fee
    trigger: "estimated variant at POST /permits/{id}/issue; final variant at POST /permits/{id}/close-out"
    algorithm: tiered_pricing
    formula: |
      base   = ZONE_BASE_CENTS[segment.zone_class]
      daily  = ZONE_DAILY_CENTS[segment.zone_class]
      area   = AREA_FACTOR[obstruction_type]
      raw    = base + round_half_up(daily * area * duration_days)
      fee    = min(raw, ZONE_CAP_CENTS[segment.zone_class])
      # duration_days (estimated) = (requested_end_date - requested_start_date) in whole days
      # duration_days (final)     = (actual_end_date  - actual_start_date)  in whole days
    input_set: "one Permit joined to its StreetSegment.zone_class; obstruction_type = permit.primary_obstruction_type"
    constants:
      ZONE_BASE_CENTS: { RESIDENTIAL: 5000, COMMERCIAL: 10000, ARTERIAL: 20000 }
      ZONE_DAILY_CENTS: { RESIDENTIAL: 500, COMMERCIAL: 1500, ARTERIAL: 3000 }
      ZONE_CAP_CENTS: { RESIDENTIAL: 200000, COMMERCIAL: 500000, ARTERIAL: 1000000 }
      AREA_FACTOR: { SIDEWALK: 1.0, LANE: 2.0, FULL_ROAD: 3.5 }
    precision: "integer cents, round_half_up on the daily*area*duration product before adding base"
    variants:
      - name: estimated
        when: "at issue; duration from requested_start_date..requested_end_date -> Permit.estimated_fee_cents"
        difference: "uses the applicant's requested window"
      - name: final
        when: "at close-out; duration from actual_start_date..actual_end_date -> Permit.final_fee_cents; if actual_start_date is null, final = estimated"
        difference: "uses the true occupancy window (first activation .. close-out), so an overstay yields a strictly larger fee than estimated"

  - name: total_permit_charge
    trigger: "POST /permits/{id}/issue"
    algorithm: aggregation
    formula: |
      components = [ estimated_occupancy_fee_cents, TCP_REVIEW_FEE_CENTS, INSPECTION_FEE_CENTS ]
      # PINNED ORDER: compute the surcharge PER COMPONENT, round_half_up each to whole
      # cents, THEN sum. This differs from summing components first and rounding once.
      surcharge_cents    = sum( round_half_up(component * SURCHARGE_PCT) for component in components )
      total_charge_cents = sum(components) + surcharge_cents
    input_set: "single Permit at issue"
    constants:
      TCP_REVIEW_FEE_CENTS: 7500
      INSPECTION_FEE_CENTS: 4000
      SURCHARGE_PCT: 0.0725
    precision: "integer cents; round_half_up applied once per component (per-line-item), never on the aggregate"

  - name: bond_required
    trigger: "POST /permits/{id}/bond"
    algorithm: threshold
    formula: |
      est_occ = occupancy_fee(estimated variant, from permit.requested window)
      required_cents = max(BOND_FLOOR_CENTS, est_occ * BOND_MULTIPLIER)
    input_set: "single Permit + its StreetSegment at bond-post time"
    constants:
      BOND_FLOOR_CENTS: 50000
      BOND_MULTIPLIER: 2
    precision: "integer cents"

  - name: bond_refund
    trigger: "provisional variant recomputed on POST /lane-closures/{id}/request-restoration; final variant on POST /bonds/{id}/release"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall over the posted bond: deficiencies first, then unpaid penalties.
      deficiency_total = sum( closure.<deficiency>_cents for closure in permit.lane_closures where status in FILTER )
      refund   = max(0, posted_cents - deficiency_total - permit.cumulative_penalty_cents)
      forfeit  = posted_cents - refund
    input_set: "one RestorationBond, its parent Permit, and the permit's LaneClosures"
    constants: {}
    precision: "integer cents; refund floored at 0"
    variants:
      - name: provisional
        when: "on each request-restoration; FILTER = closures in {RESTORATION_PENDING}; uses estimated_deficiency_cents -> Bond.provisional_refund_cents"
        difference: "preview based on the applicant's estimated deficiency"
      - name: final
        when: "at release; FILTER = closures in {RESTORED}; uses assessed_deficiency_cents -> Bond.refunded_cents (and forfeited_cents)"
        difference: "authoritative, based on the inspector's assessed deficiency, which may exceed the estimate"

  - name: penalty_assessment
    trigger: "POST /permits/{id}/violations"
    algorithm: threshold
    formula: |
      prior_count = count of ViolationNotice already on this permit (ordered by created_at ASC)
      penalty     = min(PENALTY_MAX_CENTS, round_half_up(PENALTY_BASE_CENTS * (1 + ESCALATION_PCT * prior_count)))
      permit.cumulative_penalty_cents += penalty
      # Revoke boundary: when cumulative_penalty_cents >= PENALTY_REVOKE_THRESHOLD_CENTS
      # AND permit.status == ISSUED, auto-revoke (see Permit ISSUED->REVOKED).
    input_set: "the citing Permit and the count of its prior ViolationNotices"
    constants:
      PENALTY_BASE_CENTS: 15000
      ESCALATION_PCT: 0.5
      PENALTY_MAX_CENTS: 100000
      PENALTY_REVOKE_THRESHOLD_CENTS: 37500
    precision: "integer cents; round_half_up on the escalated product"

  - name: moratorium_window
    trigger: "computed at StreetSegment creation; enforced on POST /permits/{id}/lane-closures when requires_utility_cut is true"
    algorithm: threshold
    formula: |
      moratorium_end_date = last_repaved_date + MORATORIUM_YEARS[zone_class] (calendar years)
      # A utility-cut LaneClosure is rejected when start_date < moratorium_end_date
      # (inclusive boundary: start_date == moratorium_end_date is ALLOWED, i.e. >=),
      # unless segment.moratorium_waived is true.
    input_set: "one StreetSegment"
    constants:
      MORATORIUM_YEARS: { RESIDENTIAL: 2, COMMERCIAL: 3, ARTERIAL: 5 }
    precision: "whole calendar dates"

  - name: segment_active_closure_count
    trigger: "recomputed on LaneClosure activate (+1) and on RESTORED / VOIDED (-1)"
    algorithm: aggregation
    formula: |
      StreetSegment.active_lane_closure_count == count( LaneClosure where street_segment_id == segment.id AND status == ACTIVE )
    input_set: "all LaneClosures on the segment with status == ACTIVE"
    constants: {}
    precision: "non-negative integer; invariant maintained on every activate/restore/void"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7; for entity_backed Applicant acting on a permit, permit.applicant_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Permit in path exists"
    error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: "all /permits/{id}/* and child action endpoints resolving a permit"
  - priority: 3
    category: existence
    check: "Applicant referenced by applicant_id exists"
    error_id: ERR_APPLICANT_NOT_FOUND
    http_status: 404
    applies_to: "POST /permits"
  - priority: 3
    category: existence
    check: "StreetSegment referenced exists"
    error_id: ERR_SEGMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /permits, POST /permits/{id}/lane-closures, GET /street-segments/{id}/*"
  - priority: 3
    category: existence
    check: "SidewalkSpan referenced exists"
    error_id: ERR_SPAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /permits/{id}/sidewalk-obstructions, GET /sidewalk-spans/{id}/*"
  - priority: 3
    category: existence
    check: "LaneClosure / RestorationBond / TrafficControlPlan / EncroachmentAgreement in path exists"
    error_id: ERR_CLOSURE_NOT_FOUND
    http_status: 404
    applies_to: "/lane-closures/{id}/*, /bonds/{id}/*, /traffic-control-plans/{id}/*, /encroachment-agreements/{id}/*"
  - priority: 4
    category: business_constraint
    check: "requested_end_date > requested_start_date (Permit) and end_date > start_date (closures/obstructions)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /permits, POST /permits/{id}/lane-closures, POST /permits/{id}/sidewalk-obstructions"
  - priority: 5
    category: state
    check: "target Permit is in the correct state for this transition (submit: DRAFT|RETURNED_FOR_REVISION; decision: UNDER_REVIEW; issue: APPROVED; close-out: ISSUED; expire: ISSUED)"
    error_id: ERR_INVALID_PERMIT_STATE
    http_status: 409
    applies_to: "permit lifecycle actions"
  - priority: 5
    category: state
    check: "creating/activating a LaneClosure or SidewalkObstruction, or executing an EncroachmentAgreement, requires parent Permit.status == ISSUED"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /permits/{id}/lane-closures, POST /lane-closures/{id}/activate, POST /permits/{id}/sidewalk-obstructions, POST /encroachment-agreements/{id}/execute"
  - priority: 5
    category: state
    check: "LaneClosure is in the state required by the action (activate: PLANNED; request-restoration: ACTIVE|RESTORATION_REJECTED; sign-off: RESTORATION_PENDING)"
    error_id: ERR_INVALID_CLOSURE_STATE
    http_status: 409
    applies_to: "/lane-closures/{id}/*"
  - priority: 5
    category: state
    check: "TrafficControlPlan decision requires status SUBMITTED; RestorationBond release requires status POSTED; SidewalkObstruction restoration requires status ACTIVE; EncroachmentAgreement execute requires status PROPOSED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "/traffic-control-plans/{id}/decision, /bonds/{id}/release, /sidewalk-obstructions/{id}/complete-restoration, /encroachment-agreements/{id}/execute"
  - priority: 5
    category: state
    check: "expire requires logical clock date > permit.valid_until"
    error_id: ERR_NOT_YET_EXPIRED
    http_status: 409
    applies_to: "POST /permits/{id}/expire"
  - priority: 6
    category: state
    check: "OCC: expected_permit_version equals the permit's current version"
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
    applies_to: "POST /permits/{id}/bond"
  - priority: 7
    category: business_safety
    check: "issue requires the permit's TrafficControlPlan to be APPROVED"
    error_id: ERR_TCP_NOT_APPROVED
    http_status: 409
    applies_to: "POST /permits/{id}/issue"
  - priority: 7
    category: business_safety
    check: "segregation of duties: X-User-ID issuing the permit must differ from permit.assigned_reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /permits/{id}/issue"
  - priority: 7
    category: business_safety
    check: "approving a TrafficControlPlan with requires_flaggers=true requires flagger_count >= 1"
    error_id: ERR_FLAGGERS_REQUIRED
    http_status: 422
    applies_to: "POST /traffic-control-plans/{id}/decision"
  - priority: 8
    category: business_referential
    check: "a new LaneClosure must not overlap an existing PLANNED/ACTIVE closure on the same StreetSegment; intervals are half-open [start,end) and adjacency (a.end == b.start) is allowed"
    error_id: ERR_CLOSURE_CONFLICT
    http_status: 409
    applies_to: "POST /permits/{id}/lane-closures"
  - priority: 8
    category: business_referential
    check: "a new SidewalkObstruction must keep a >= SIDEWALK_BUFFER_DAYS (3) gap from every ACTIVE obstruction on the same SidewalkSpan; adjacency is NOT allowed (gap must be >= 3 days)"
    error_id: ERR_SIDEWALK_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /permits/{id}/sidewalk-obstructions"
  - priority: 8
    category: business_safety
    check: "SidewalkObstruction.maintained_clearance_ft >= SidewalkSpan.ada_min_clearance_ft"
    error_id: ERR_ADA_CLEARANCE
    http_status: 422
    applies_to: "POST /permits/{id}/sidewalk-obstructions"
  - priority: 9
    category: business_temporal
    check: "a utility-cut LaneClosure (requires_utility_cut=true) must have start_date >= segment.moratorium_end_date unless segment.moratorium_waived"
    error_id: ERR_UTILITY_CUT_MORATORIUM
    http_status: 409
    applies_to: "POST /permits/{id}/lane-closures"
  - priority: 10
    category: business_constraint
    check: "close-out requires every LaneClosure and SidewalkObstruction on the permit to be terminal (RESTORED/VOIDED); bond release requires every LaneClosure terminal"
    error_id: ERR_CLOSURES_OUTSTANDING
    http_status: 409
    applies_to: "POST /permits/{id}/close-out, POST /bonds/{id}/release"
  - priority: 11
    category: business_fiscal
    check: "issue requires a RestorationBond in status POSTED; bond posted_cents must be >= required_cents"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /permits/{id}/bond, POST /permits/{id}/issue"
  - priority: 12
    category: business_constraint
    check: "required body fields present and well-typed; enum values in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Applicant ----
  - method: POST
    path: "/applicants"
    description: "Register a contractor/permittee"
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, license_number, contact_email]
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applicants/{id}"
    description: "Fetch an applicant"
    roles: [PlatformAdmin, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---- StreetSegment ----
  - method: POST
    path: "/street-segments"
    description: "Create a roadway segment; computes moratorium_end_date"
    roles: [PlatformAdmin]
    code: 201
    input: [block_label, zone_class, last_repaved_date, roadway_lane_count, "moratorium_waived?"]
    output: StreetSegment
    side_effects: ["compute moratorium_end_date (moratorium_window)"]
  - method: GET
    path: "/street-segments/{id}"
    description: "Fetch a street segment (includes active_lane_closure_count, moratorium_end_date)"
    roles: [PlatformAdmin, Applicant, PermitReviewer]
    code: 200
    input: []
    output: StreetSegment
    side_effects: []
  - method: GET
    path: "/street-segments/{id}/lane-closures"
    description: "List lane closures occupying this segment (reverse of LaneClosure.street_segment_id)"
    roles: [PlatformAdmin, Applicant, PermitReviewer]
    code: 200
    input: []
    output: LaneClosure[]
    side_effects: []

  # ---- SidewalkSpan ----
  - method: POST
    path: "/sidewalk-spans"
    description: "Create a sidewalk span resource"
    roles: [PlatformAdmin]
    code: 201
    input: [block_label, side, width_ft, "ada_min_clearance_ft?"]
    output: SidewalkSpan
    side_effects: []
  - method: GET
    path: "/sidewalk-spans/{id}"
    description: "Fetch a sidewalk span"
    roles: [PlatformAdmin, Applicant, PermitReviewer]
    code: 200
    input: []
    output: SidewalkSpan
    side_effects: []
  - method: GET
    path: "/sidewalk-spans/{id}/obstructions"
    description: "List obstructions on this span (reverse of SidewalkObstruction.sidewalk_span_id)"
    roles: [PlatformAdmin, Applicant, PermitReviewer]
    code: 200
    input: []
    output: SidewalkObstruction[]
    side_effects: []

  # ---- Permit lifecycle ----
  - method: POST
    path: "/permits"
    description: "Create a draft permit (applicant owns it: applicant_id must equal X-User-ID)"
    roles: [Applicant]
    code: 201
    input: [applicant_id, street_segment_id, primary_obstruction_type, requested_start_date, requested_end_date, "requires_utility_cut?"]
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits/{id}"
    description: "Fetch a permit"
    roles: [Applicant, PermitReviewer, Inspector, EnforcementOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List/filter permits (reverse of Permit.applicant_id and Permit.street_segment_id)"
    roles: [PlatformAdmin, PermitReviewer, Applicant]
    code: 200
    input: ["applicant_id?", "street_segment_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{id}/submit"
    description: "Submit a draft or returned permit for review"
    roles: [Applicant]
    code: 200
    input: []
    output: Permit
    side_effects: ["status DRAFT|RETURNED_FOR_REVISION -> UNDER_REVIEW"]
  - method: POST
    path: "/permits/{id}/decision"
    description: "Reviewer approves or returns a permit under review"
    roles: [PermitReviewer]
    code: 200
    input: [outcome, "review_notes?"]
    output: Permit
    side_effects: ["UNDER_REVIEW -> APPROVED (set assigned_reviewer_user_id) or RETURNED_FOR_REVISION"]
  - method: POST
    path: "/permits/{id}/issue"
    description: "Issue an approved permit; computes fees and surcharge. Segregation of duties: issuer X-User-ID must differ from assigned_reviewer_user_id."
    roles: [PermitReviewer]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "status APPROVED -> ISSUED"
      - "compute estimated_fee_cents (occupancy_fee estimated)"
      - "compute surcharge_cents, total_charge_cents (total_permit_charge)"
      - "set valid_until = requested_end_date, issued_at = clock now"
  - method: POST
    path: "/permits/{id}/close-out"
    description: "Close out an issued permit once all occupations are terminal; computes final fee"
    roles: [PermitReviewer, Inspector]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "status ISSUED -> CLOSED_OUT"
      - "set actual_end_date = clock date"
      - "compute final_fee_cents (occupancy_fee final)"
  - method: POST
    path: "/permits/{id}/expire"
    description: "Expire an issued permit whose valid_until has passed (clock date > valid_until)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: ["status ISSUED -> EXPIRED"]

  # ---- TrafficControlPlan ----
  - method: POST
    path: "/permits/{id}/traffic-control-plan"
    description: "Attach and submit a traffic-control plan to a permit"
    roles: [Applicant]
    code: 201
    input: [device_list, requires_flaggers, "flagger_count?", setback_ft]
    output: TrafficControlPlan
    side_effects: ["create plan in SUBMITTED"]
  - method: GET
    path: "/permits/{id}/traffic-control-plans"
    description: "List traffic-control plans for a permit (reverse of TrafficControlPlan.permit_id)"
    roles: [Applicant, PermitReviewer, PlatformAdmin]
    code: 200
    input: []
    output: TrafficControlPlan[]
    side_effects: []
  - method: POST
    path: "/traffic-control-plans/{id}/decision"
    description: "Reviewer approves or rejects a submitted plan"
    roles: [PermitReviewer]
    code: 200
    input: [outcome, "review_notes?"]
    output: TrafficControlPlan
    side_effects: ["SUBMITTED -> APPROVED (checks flaggers) or REJECTED"]

  # ---- RestorationBond ----
  - method: POST
    path: "/permits/{id}/bond"
    description: "Post (or supersede) a restoration bond for a permit. OCC-guarded on the parent permit's version."
    roles: [Applicant]
    code: 201
    input: [posted_cents, expected_permit_version]
    output: RestorationBond
    side_effects:
      - "compute required_cents (bond_required); reject if posted_cents < required_cents"
      - "create/supersede bond in POSTED, held_cents = posted_cents, provisional_refund_cents = posted_cents"
      - "increments Permit.version by 1"
  - method: GET
    path: "/permits/{id}/bond"
    description: "List the restoration bond(s) for a permit (reverse of RestorationBond.permit_id; 0 or 1)"
    roles: [Applicant, PermitReviewer, PlatformAdmin]
    code: 200
    input: []
    output: RestorationBond[]
    side_effects: []
  - method: POST
    path: "/bonds/{id}/release"
    description: "Release a bond once all lane closures are terminal; computes final refund"
    roles: [PermitReviewer, PlatformAdmin]
    code: 200
    input: []
    output: RestorationBond
    side_effects:
      - "compute refunded_cents (bond_refund final), forfeited_cents = posted - refunded, held_cents = 0"
      - "status POSTED -> RELEASED"

  # ---- LaneClosure ----
  - method: POST
    path: "/permits/{id}/lane-closures"
    description: "Create a planned lane closure (checks overlap and utility-cut moratorium)"
    roles: [Applicant]
    code: 201
    input: [street_segment_id, obstruction_type, start_date, end_date, "requires_utility_cut?"]
    output: LaneClosure
    side_effects: ["half-open overlap check on segment; moratorium check when requires_utility_cut"]
  - method: GET
    path: "/permits/{id}/lane-closures"
    description: "List lane closures for a permit (reverse of LaneClosure.permit_id)"
    roles: [Applicant, PermitReviewer, Inspector, PlatformAdmin]
    code: 200
    input: []
    output: LaneClosure[]
    side_effects: []
  - method: POST
    path: "/lane-closures/{id}/activate"
    description: "Activate a planned closure (requires parent permit ISSUED)"
    roles: [Applicant]
    code: 200
    input: []
    output: LaneClosure
    side_effects:
      - "status PLANNED -> ACTIVE"
      - "increment StreetSegment.active_lane_closure_count by 1"
      - "set permit.actual_start_date if null"
  - method: POST
    path: "/lane-closures/{id}/request-restoration"
    description: "Applicant reports work complete and requests restoration inspection"
    roles: [Applicant]
    code: 200
    input: ["estimated_deficiency_cents?"]
    output: LaneClosure
    side_effects:
      - "status ACTIVE|RESTORATION_REJECTED -> RESTORATION_PENDING"
      - "set estimated_deficiency_cents; recompute parent bond.provisional_refund_cents (bond_refund provisional)"
  - method: POST
    path: "/lane-closures/{id}/sign-off"
    description: "Inspector signs off restoration (PASS restores; FAIL rejects)"
    roles: [Inspector]
    code: 200
    input: [result, "assessed_deficiency_cents?"]
    output: LaneClosure
    side_effects:
      - "RESTORATION_PENDING -> RESTORED (PASS): decrement segment.active_lane_closure_count; or -> RESTORATION_REJECTED (FAIL)"
      - "set assessed_deficiency_cents, inspector_user_id"

  # ---- SidewalkObstruction ----
  - method: POST
    path: "/permits/{id}/sidewalk-obstructions"
    description: "Create an active sidewalk obstruction (checks ADA clearance and buffer conflict)"
    roles: [Applicant]
    code: 201
    input: [sidewalk_span_id, start_date, end_date, maintained_clearance_ft]
    output: SidewalkObstruction
    side_effects: ["buffered overlap check on span; ADA clearance check; create ACTIVE"]
  - method: GET
    path: "/permits/{id}/sidewalk-obstructions"
    description: "List sidewalk obstructions for a permit (reverse of SidewalkObstruction.permit_id)"
    roles: [Applicant, PermitReviewer, Inspector, PlatformAdmin]
    code: 200
    input: []
    output: SidewalkObstruction[]
    side_effects: []
  - method: POST
    path: "/sidewalk-obstructions/{id}/complete-restoration"
    description: "Mark a sidewalk obstruction restored"
    roles: [Applicant, Inspector]
    code: 200
    input: []
    output: SidewalkObstruction
    side_effects: ["status ACTIVE -> RESTORED"]

  # ---- EncroachmentAgreement ----
  - method: POST
    path: "/permits/{id}/encroachment-agreement"
    description: "Propose a long-term encroachment agreement on a permit"
    roles: [Applicant]
    code: 201
    input: [term_months, proposed_fee_cents]
    output: EncroachmentAgreement
    side_effects: ["create agreement in PROPOSED"]
  - method: GET
    path: "/permits/{id}/encroachment-agreements"
    description: "List encroachment agreements for a permit (reverse of EncroachmentAgreement.permit_id)"
    roles: [Applicant, PermitReviewer, PlatformAdmin]
    code: 200
    input: []
    output: EncroachmentAgreement[]
    side_effects: []
  - method: POST
    path: "/encroachment-agreements/{id}/execute"
    description: "Reviewer executes a proposed agreement (requires parent permit ISSUED)"
    roles: [PermitReviewer]
    code: 200
    input: []
    output: EncroachmentAgreement
    side_effects: ["PROPOSED -> EXECUTED; set agreed_fee_cents = proposed_fee_cents"]

  # ---- ViolationNotice ----
  - method: POST
    path: "/permits/{id}/violations"
    description: "Issue a violation notice; computes escalating penalty and may auto-revoke the permit"
    roles: [EnforcementOfficer]
    code: 201
    input: [violation_type, "note?"]
    output: ViolationNotice
    side_effects:
      - "compute penalty_cents (penalty_assessment); add to permit.cumulative_penalty_cents"
      - "if cumulative_penalty_cents >= 37500 and permit ISSUED: cascade REVOKE (void closures/obstructions, forfeit bond)"
  - method: GET
    path: "/permits/{id}/violations"
    description: "List violation notices for a permit (reverse of ViolationNotice.permit_id)"
    roles: [PermitReviewer, EnforcementOfficer, PlatformAdmin, Applicant]
    code: 200
    input: []
    output: ViolationNotice[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock = to_iso8601"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or entity_backed Applicant acting on a permit it does not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "issuer X-User-ID equals permit.assigned_reviewer_user_id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id in path does not exist"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "applicant_id references a non-existent applicant"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "street_segment_id references a non-existent segment"
  - id: ERR_SPAN_NOT_FOUND
    http: 404
    condition: "sidewalk_span_id references a non-existent span"
  - id: ERR_CLOSURE_NOT_FOUND
    http: 404
    condition: "lane-closure/bond/traffic-control-plan/encroachment-agreement id in path does not exist"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "end date not strictly after start date"
  - id: ERR_INVALID_PERMIT_STATE
    http: 409
    condition: "permit not in the state required by the lifecycle action"
  - id: ERR_PERMIT_NOT_ISSUED
    http: 409
    condition: "closure/obstruction/encroachment operation requires parent permit ISSUED"
  - id: ERR_INVALID_CLOSURE_STATE
    http: 409
    condition: "lane closure not in the state required by the action"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "TCP/bond/obstruction/encroachment not in the state required by the action"
  - id: ERR_NOT_YET_EXPIRED
    http: 409
    condition: "expire attempted while clock date <= valid_until"
  - id: ERR_STALE_PERMIT_VERSION
    http: 412
    condition: "expected_permit_version does not match the permit's current version on bond post"
  - id: ERR_TCP_NOT_APPROVED
    http: 409
    condition: "issue attempted without an APPROVED traffic-control plan"
  - id: ERR_FLAGGERS_REQUIRED
    http: 422
    condition: "TCP approval with requires_flaggers=true but flagger_count < 1"
  - id: ERR_CLOSURE_CONFLICT
    http: 409
    condition: "new lane closure overlaps an existing PLANNED/ACTIVE closure on the same segment (half-open)"
  - id: ERR_SIDEWALK_BUFFER_CONFLICT
    http: 409
    condition: "new sidewalk obstruction within the 3-day clearance buffer of an ACTIVE obstruction on the same span"
  - id: ERR_ADA_CLEARANCE
    http: 422
    condition: "maintained_clearance_ft below the span's ada_min_clearance_ft"
  - id: ERR_UTILITY_CUT_MORATORIUM
    http: 409
    condition: "utility-cut closure start_date before segment.moratorium_end_date and not waived"
  - id: ERR_CLOSURES_OUTSTANDING
    http: 409
    condition: "close-out/release attempted while some closures/obstructions are non-terminal"
  - id: ERR_BOND_INSUFFICIENT
    http: 422
    condition: "posted_cents below required_cents, or issue without a POSTED bond"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing/malformed required field or out-of-range enum"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Applicant
    description: "Contractor/permittee: creates permits, plans, bonds, closures, obstructions, and encroachment proposals for permits it owns"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /permits"
      - "POST /permits/{id}/submit"
      - "POST /permits/{id}/traffic-control-plan"
      - "POST /permits/{id}/bond"
      - "POST /permits/{id}/lane-closures"
      - "POST /lane-closures/{id}/activate"
      - "POST /lane-closures/{id}/request-restoration"
      - "POST /permits/{id}/sidewalk-obstructions"
      - "POST /permits/{id}/encroachment-agreement"
    shared_operations:
      - "POST /sidewalk-obstructions/{id}/complete-restoration (with Inspector)"
      - "GET permit/segment/span reads"
  - name: PermitReviewer
    description: "Reviews permits and plans, issues permits, releases bonds, executes encroachment agreements"
    identity: opaque
    exclusive_operations:
      - "POST /permits/{id}/decision"
      - "POST /permits/{id}/issue"
      - "POST /traffic-control-plans/{id}/decision"
      - "POST /bonds/{id}/release"
      - "POST /encroachment-agreements/{id}/execute"
    shared_operations:
      - "POST /permits/{id}/close-out (with Inspector)"
      - "GET reads"
  - name: Inspector
    description: "Signs off restorations; may close out permits and complete sidewalk restorations"
    identity: opaque
    exclusive_operations:
      - "POST /lane-closures/{id}/sign-off"
    shared_operations:
      - "POST /permits/{id}/close-out (with PermitReviewer)"
      - "POST /sidewalk-obstructions/{id}/complete-restoration (with Applicant)"
      - "GET reads"
  - name: EnforcementOfficer
    description: "Issues violation notices/penalties"
    identity: opaque
    exclusive_operations:
      - "POST /permits/{id}/violations"
    shared_operations:
      - "GET reads"
  - name: PlatformAdmin
    description: "Manages applicants, segments, spans, permit expiration, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /applicants"
      - "POST /street-segments"
      - "POST /sidewalk-spans"
      - "POST /permits/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /bonds/{id}/release (with PermitReviewer)"
      - "GET reads"
