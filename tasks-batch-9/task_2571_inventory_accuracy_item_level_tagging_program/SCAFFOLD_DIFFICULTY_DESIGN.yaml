  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: tag_batch_rework_cycle_returns_to_encoded
        grounds:
          - state_machines.TagBatch.VERIFICATION_FAILED_to_ENCODED
          - state_machines.TagBatch.RECEIVED_to_VERIFICATION_FAILED
          - calculations.tag_verification_outcome
          - entities.TagBatch.fields.rework_round
          - global_constants.MAX_REWORK_ROUNDS
        distinguishing_aspect: |
          Non-linearity on the TagBatch entity, and it is a CYCLE: ENCODED -> RECEIVED ->
          VERIFICATION_FAILED -> ENCODED re-enters a state the row already occupied. The loop is not
          a no-op — rework_round increments, the four verification counters are wiped, and
          required_sample_units is re-frozen from the vendor band that the failure itself widened, so
          the same 1000-unit batch demands 50 sampled units on the first pass and 100 on the second.
          MAX_REWORK_ROUNDS bounds the loop. The other instance of this rule is Adjustment, a
          different entity, and its non-linearity is parallel dimensions rather than a cycle.
        test_recipe:
          setup:
            - "Category APPAREL; Store S100; Vendor VEND1 (fresh, so tag_compliance_score_bps 10000 and required_verification_sample_pct 5)."
            - "Item TEE-001 in APPAREL with tag_encoding_scheme SGTIN_96, epc_prefix_length 7 and tag_required true."
            - "A stock position at S100 for TEE-001 with opening on-hand 100 units, so the failure's tag_integrity_hold cascade has something to land on."
            - "A TagBatch for VEND1 / TEE-001 / S100 with quantity_encoded 1000, encoded with scheme SGTIN_96 and the 7-digit prefix 0614141 so required_sample_units freezes at ceil(1000 * 5 / 100) = 50."
            - "The batch is received and then verified with sampled 50 / readable 48, i.e. read_rate_bps floor(10000 * 48 / 50) = 9600 < 9800, so it FAILS and the vendor's score drops 10000 -> 8500, re-banding the sample percentage to 10."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches/${batch1}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
            - call: "POST /inventory-integrity/tag-batches/${batch1}/receive"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches/${batch1}/verify"
              payload: { sampled_units: 50, readable_units: 48, duplicate_epc_count: 0, unencoded_units: 0 }
              as: StoreOps
              as_user_id: "${store_s100}"
          trigger:
            - call: "POST /inventory-integrity/tag-batches/${batch1}/rework"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor1}"
          assert:
            - "after the verify step, TagBatch.${batch1}.status == \"VERIFICATION_FAILED\", read_rate_bps == 9600, verification_outcome == \"FAIL\" and required_sample_units was 50"
            - "response status 200"
            - "response data.status == \"ENCODED\" — the row re-enters a state it already occupied, so the machine is cyclic"
            - "response data.rework_round == 1"
            - "response data.required_sample_units == 100 — re-frozen at ceil(1000 * 10 / 100) from the widened band, NOT left at 50"
            - "response data.sampled_units == 0 and data.readable_units == 0 and data.duplicate_epc_count == 0 and data.unencoded_units == 0 and data.read_rate_bps == 0"
            - "response data.verification_outcome == null"
            - "Vendor.${vendor1}.tag_compliance_score_bps == 8500 and Vendor.${vendor1}.required_verification_sample_pct == 10"
            - "StockPosition.${pos_tee1}.tag_integrity_hold == true and promising_state == \"BLOCKED\" — rework does not clear the hold; only a VERIFIED_PASS does"
            - "a second FAIL followed by a second rework is still permitted because rework_round 1 < MAX_REWORK_ROUNDS 2; a third attempt raises ERR_REWORK_LIMIT_REACHED"

      - name: adjustment_parallel_approval_and_posting_dimensions
        grounds:
          - state_machines.Adjustment.parallel_dimensions
          - state_machines.Adjustment.PENDING_to_APPROVED
          - state_machines.Adjustment.UNPOSTED_to_POSTED
          - entities.Adjustment.fields.approval_state
          - entities.Adjustment.fields.posting_state
        distinguishing_aspect: |
          Non-linearity on the Adjustment entity — a different entity from the TagBatch instance —
          and of a different kind: two INDEPENDENT state dimensions on one row rather than a cycle.
          approve moves approval_state PENDING -> APPROVED while posting_state stays UNPOSTED and
          on_hand_units is untouched; post then moves posting_state UNPOSTED -> POSTED while
          approval_state remains APPROVED. Neither transition is reachable by advancing a single
          linear status field, and the pair (APPROVED, UNPOSTED) is a legal resting state that
          contributes nothing to inventory.
        test_recipe:
          setup:
            - "Category APPAREL (variance_tolerance_value_cents 20000); Store S100; Vendor VEND1; Item TEE-001 at 1234 cents."
            - "A stock position at S100 for TEE-001 with opening on-hand 100 units."
            - "No investigation is linked, so strictness stays at the default 10000 bps and there are no prior POSTED siblings: threshold = max(1000, floor(20000 * 1.0 * 1.0)) = 20000."
            - "An adjustment of -20 units is requested by u_analyst_1: value_impact 20 * 1234 = 24680 >= 20000, so it is created PENDING / UNPOSTED."
            - "u_super_1 approves it — a different user, so segregation of duties is satisfied, and 24680 is below SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS 500000 so no ShrinkController is required."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "GET /inventory-integrity/stock-positions/${pos_tee1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { pos_v: "$.data.version" }
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/adjustments"
              payload: { delta_units: -20, reason_code: "COUNT_VARIANCE", expected_stock_position_version: "${pos_v}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { adj1: "$.data.id" }
            - call: "POST /inventory-integrity/adjustments/${adj1}/approve"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          trigger:
            - call: "POST /inventory-integrity/adjustments/${adj1}/post"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          assert:
            - "at creation, Adjustment.${adj1}.value_impact_cents == 24680, authority_threshold_cents == 20000, approval_state == \"PENDING\", posting_state == \"UNPOSTED\""
            - "immediately after the approve step, Adjustment.${adj1}.approval_state == \"APPROVED\" AND posting_state == \"UNPOSTED\", and StockPosition.${pos_tee1}.on_hand_units is still 100 — approval alone moves no inventory"
            - "response status 200"
            - "response data.posting_state == \"POSTED\""
            - "response data.approval_state == \"APPROVED\" — posting did not touch the approval dimension"
            - "response data.posted_at == \"2026-08-01T00:00:00Z\""
            - "StockPosition.${pos_tee1}.on_hand_units == 80 and book_value_cents == 98720"
            - "a second post attempt returns ERR_ADJUSTMENT_INVALID_STATE (409) because posting_state is no longer UNPOSTED, while approval_state remains APPROVED"

