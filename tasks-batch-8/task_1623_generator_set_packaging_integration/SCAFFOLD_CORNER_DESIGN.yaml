              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { im_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${im_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { im_o: $.data.id, im_ov: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${im_o}", engine_model_id: "${im_e}", alternator_model_id: "${im_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${im_ov}" }
              as: ApplicationEngineer
              captures: { im_s: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${im_s}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${im_s}/approve"
              payload: {}
              as: SalesEngineer
            - call: "POST /genset-packaging/orders/${im_o}/authorize"
              payload: { amount_cents: 40000000, freight_charge_cents: 0 }
              as: SalesEngineer
          trigger:
            - call: "POST /genset-packaging/orders/${im_o}/cancel"
              payload: {}
              as: SalesEngineer
              captures: { im_ref: $.data.refunded_amount_cents, im_restock: $.data.restocking_fee_cents, im_build: $.data.build_status, im_comm: $.data.commercial_status }
          assert:
            - "cancel response: build_status == CANCELLED, commercial_status == REFUNDED in the SAME response"
            - "refunded_amount_cents == 40000000 and restocking_fee_cents == 0 (build was SIZING — no restocking)"
            - "immediately after: CustomerAccount.${im_c}.credit_utilized_cents == 0 (no eventual lag)"
