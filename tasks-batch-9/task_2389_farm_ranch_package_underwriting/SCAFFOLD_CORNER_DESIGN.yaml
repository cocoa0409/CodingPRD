            - "policy B on a separate account A8b with the identical RC DWELLING, still DRAFT"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-8", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 30000000 }
              as: PlatformAdmin
              captures: { p8_hail: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-8", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { p8_wind: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-8", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { p8_fire: $.data.id }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Thin Pool Farms A", state_code: "KS", county_name: "Pratt", cat_zone_code: "ZN-8", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct8a: $.data.id }
            - call: "POST /farm-policies"
