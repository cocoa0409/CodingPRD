              payload: { limit: 2, offset: 2 }
              as: SchedulingCoordinator
            - call: "GET /storage-contracts"
              payload: { shipper_id: "${s1}", service_class: "INTERRUPTIBLE", limit: 100 }
              as: SchedulingCoordinator
