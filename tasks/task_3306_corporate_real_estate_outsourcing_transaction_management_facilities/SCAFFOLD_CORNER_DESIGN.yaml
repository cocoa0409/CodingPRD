  - name: error_envelope_carries_error_id_and_message
    claim_type: response_envelope
    grounds:
    - response_envelope.error
    - errors[ERR_RESOURCE_NOT_FOUND]
    distinguishing_aspect: An error answer is shaped as response_type error with data.error_id and data.message and no business payload.
    test_recipe:
      setup:
      - empty database (no persisted resources); the baseline read confirms zero accounts
      setup_api_calls:
      - call: GET /api/accounts
        as: AccountExecutive
        captures:
          n0: $.pagination.total_count
      trigger:
      - call: GET /api/accounts/11111111-1111-1111-1111-111111111111
        as: AccountExecutive
        captures:
          rt: $.response_type
          e1: $.data.error_id
          msg: $.data.message
          rid: $.meta.api_request_id
      assert:
      - ${e1} == ERR_RESOURCE_NOT_FOUND
      - ${rt} == error
      - ${n0} == 0
  - name: success_envelope_carries_request_metadata
    claim_type: response_envelope
    grounds:
    - response_envelope.success
    distinguishing_aspect: A successful create answers with response_type object and a meta.api_request_id.
    test_recipe:
      setup:
      - empty database (no persisted resources); the baseline read confirms zero accounts
      setup_api_calls:
      - call: GET /api/accounts
