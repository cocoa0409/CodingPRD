          deposit_amount_cents: 4500
          replacement_part_id: null
          replacement_unit_cost_cents: 0
        as: ToolCribAttendant
        captures:
          t2: $.data.id
      - call: POST /commercial/tool-loans
        payload:
          account_id: ${acct}
          tool_catalog_id: ${t2}
          deposit_amount_cents: 4500
        as: CommercialSalesRep
        captures:
          ln2: $.data.id
      - call: POST /commercial/tool-loans/{loanId}/checkout
        payload:
          accepted_deposit_cents: 4500
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
      - call: POST /commercial/service-routes
        payload:
          route_code: R-D2
          service_date: '2026-09-02T00:00:00Z'
          driver_id: drv-deskroute
          driver_type: AFFILIATE
          departure_at: '2026-09-02T13:00:00Z'
          shift_end_at: '2026-09-02T21:00:00Z'
        as: RouteDispatcher
        captures:
          r2: $.data.id
          r2_v: $.data.version
      - call: POST /commercial/service-routes/{routeId}/stops
        payload:
          account_id: ${acct}
          stop_kind: RETURN_DESK
          delivery_window_start: '2026-09-02T15:30:00Z'
          delivery_window_end: '2026-09-02T16:30:00Z'
          travel_minutes_from_previous: 15
          drop_minutes: 5
          order_ids: []
          expected_route_version: ${r2_v}
        as: RouteDispatcher
        captures:
          r2_v2: $.data.version
      - call: POST /commercial/service-routes/${r2}/plan
        payload:
          expected_route_version: ${r2_v2}
        as: RouteDispatcher
      - call: POST /commercial/service-routes/${r2}/dispatch
        payload: {}
        as: RouteDispatcher
      - call: POST /commercial/tool-loans/${ln2}/return
        payload: {}
        as: DeliveryDriver
      - call: POST /commercial/tool-loans/${ln2}/inspect
        payload:
          return_condition: GOOD
