  # ============================================================== Endpoints
  - section: endpoints
    instances:
      - name: list_pagination_limit_has_more
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Pagination envelope: with two studies on one association, limit=1 returns exactly 1 row, total_count 2, has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["RULE_CA; association; study S1 FY2026 created then WITHDRAWN; study S2 FY2027 created (both visible in the list, sort created_at ASC)"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Pages HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /reserve-studies/${s1}/withdraw"
              as: ReserveSpecialist
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2027, study_type: "UPDATE_NO_VISIT", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s2: $.data.id }
          trigger:
            - call: "GET /associations/${a1}/reserve-studies?limit=1"
              as: ReserveSpecialist
              captures: { first_id: "$.data[0].id"}
            - call: "GET /associations/${a1}/reserve-studies?limit=1&offset=1"
              as: ReserveSpecialist
              captures: { second_id: "$.data[0].id"}
          assert:
            - "page 1: exactly 1 row, total_count == 2, has_more == true"
            - "first_id == s1 id (created_at ASC)"
            - "page 2: second_id == s2 id, has_more == false"

      - name: response_envelope_meta_shape
        claim_type: retrieval
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type 'object' for single reads, and data holding the entity."
        test_recipe:
          setup: ["RULE_CA; one association"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Envelope HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
          trigger:
            - call: "GET /associations/${a1}"
              as: BoardMember
          assert:
            - "response has meta.api_request_id (non-empty) and meta.api_request_timestamp (ISO 8601)"
            - "response_type == 'object'"
            - "data.id == ${a1}"

  # ============================================================== Errors
  - section: errors
    instances:
      - name: errors_from_temporal_rules_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SITE_VISIT_CADENCE]", "errors[ERR_ANNUAL_UPDATE_ALREADY_RUN]"]
        excluded_because:
          difficulty_instance: submit_cadence_temporal_beats_constraint
          rationale: "ERR_SITE_VISIT_CADENCE asserted there; ERR_ANNUAL_UPDATE_ALREADY_RUN asserted in annual_update_rolldown_recomputes_and_rearms."

      - name: errors_from_compensating_flows_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: plan_create_stale_study_version_returns_412
          rationale: "OCC stale-version 412 asserted in the cross-cutting corner instance plan_create_stale_study_version_returns_412 (cross_cutting_layers section)."

  # ============================================================== RBAC
  - section: rbac
    instances:
      - name: board_member_cannot_create_component
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "BoardMember is outside the specialist's exclusive component operations -> 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["RULE_CA; association; DRAFT study"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "RBAC HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000 }
              as: BoardMember
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403)"

      - name: association_manager_cannot_adopt_study
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "AssociationManager holds no approval-chain authority: adopt is BoardMember-exclusive -> 403."
        test_recipe:
          setup: ["RULE_CA; association; visit completed; study SUBMITTED with component + plan"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "RBAC2 HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
          trigger:
            - call: "POST /reserve-studies/${s1}/adopt"
              as: AssociationManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403)"

      - name: reserve_specialist_cannot_approve_expenditure
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Approval-chain segregation: the specialist who prepared the study cannot approve expenditures (BoardMember-exclusive) -> 403."
        test_recipe:
          setup: ["RULE_NV; association; adopted FY2026 study; expenditure SUBMITTED"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "NV", min_percent_funded_pct: 0, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: false }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "RBAC3 HOA", state_code: "NV", fiscal_year_end_month: 12, reserve_cash_balance_cents: 2000000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 5000, incurred_date: "2026-05-10", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /expenditures/${e1}/approve"
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (403)"

  # ============================================================== Cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: plan_create_stale_study_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-create-stale-study]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ReserveStudy.version: after a first plan create advances the study version, a second create carrying the previously observed version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["RULE_CA; F1 DRAFT study (version 3 after two component creates); BASELINE plan already created with the fresh version (version advanced to 4)"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "OCC HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Paving", category: "PAVING", useful_life_years: 4, remaining_useful_life_years: 1, current_replacement_cost_cents: 50000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
          trigger:
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "THRESHOLD", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (412) — ${sv1} went stale when the BASELINE create bumped the study version"

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: funding_plan_variants_diverge
          rationale: "Both variant families asserted in difficulty instances funding_plan_variants_diverge and expenditure_variance_chronological_vs_forward."

      - name: cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: expenditure_approve_compliance_cascade
          rationale: "Depth-3 cascade asserted there; depth-2 adoption cascade in adoption_supersedes_prior_study_cascade."

      - name: ops_checkpoint_layer_covered
        claim_type: ops_run_checkpoint
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: annual_update_rolldown_recomputes_and_rearms
          rationale: "Annual-update checkpoint asserted in the corner instance annual_update_rolldown_recomputes_and_rearms (calculations section)."

  # ============================================================== Consistency model
  - section: consistency_model
    instances:
      - name: create_then_read_immediately_consistent
        claim_type: immediate
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: a component returned by create is fully visible with identical field values in the very next list read, including server-computed status ACTIVE and actuals 0."
        test_recipe:
          setup: ["RULE_CA; association; DRAFT study"]
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Consistent HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "GET /reserve-studies/${s1}/components"
              as: ReserveSpecialist
              captures: { r_name: "$.data[0].name", r_rul: "$.data[0].remaining_useful_life_years", r_status: "$.data[0].status", r_actuals: "$.data[0].actual_expenditure_cents"}
          assert:
            - "r_name == 'Roof' and r_rul == 2 (write visible immediately)"
            - "r_status == ACTIVE and r_actuals == 0"
