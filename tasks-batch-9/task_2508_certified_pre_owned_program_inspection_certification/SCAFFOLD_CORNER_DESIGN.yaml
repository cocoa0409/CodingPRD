      - name: measurement_contradicts_outcome_rejected
        claim_type: conditional
        grounds:
          - validations.priority_18
          - errors.ERR_MEASUREMENT_CONTRADICTS_OUTCOME
          - entities.ChecklistItem.fields.min_measure
        distinguishing_aspect: |
          The rule is conditional on the ChecklistItem carrying a measurement range, and it cuts both
          ways: PASS with a value outside [4.0, 12.0], FAIL with a value inside it, and PASS with no
          measured_value at all are all rejected, while the inclusive endpoints 4.0 and 12.0 are
          accepted as passes. An unmeasured item like P1 must accept PASS with no value at all,
          which distinguishes "measured item" from "every item".
        test_recipe:
          setup:
            - "Published MPI-172 with unmeasured P1 and measured B1 (4.0..12.0); inspection I1 in DRAFT."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
          trigger:
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 3.9 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "B1", outcome: "FAIL", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS" }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 4.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 12.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
          assert:
            - "trigger call 1 returns 422 ERR_MEASUREMENT_CONTRADICTS_OUTCOME: 3.9 is below min_measure 4.0 yet the row claims PASS"
            - "trigger call 2 returns 422 ERR_MEASUREMENT_CONTRADICTS_OUTCOME: 8.0 sits inside the range yet the row claims FAIL"
            - "trigger call 3 returns 422 ERR_MEASUREMENT_CONTRADICTS_OUTCOME: a PASS on a measured item must carry measured_value, and its absence is not an ERR_INVALID_REQUEST because the field is optional in the schema"
            - "trigger calls 4 and 5 both return 200 - the range endpoints are inclusive - and P1 passes with no measured_value at all because it declares no range"
            - "Inspection.${i1}.attempt_count == 2 at the end: only the two accepted calls incremented it, and GET results returns 4 rows across attempt_index 1 and 2"

      - name: submit_blocked_by_incomplete_checklist_then_by_open_reconditioning
        claim_type: priority_ordering
        grounds:
          - validations.priority_19
          - validations.priority_20
          - errors.ERR_INCOMPLETE_CHECKLIST
          - errors.ERR_RECONDITIONING_INCOMPLETE
