              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /formation-bays
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", bay_code: "BAY-1", rated_power_kw: 20.00, cooldown_minutes: 45 }
              captures: { bay_id: "$.data.id" }
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-E", quantity: 9 }
              captures: { lot_id: "$.data.id" }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: PLATE_PRODUCTION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: FORMATION }
          trigger:
            - call: POST /formation-runs
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { lot_id: "${lot_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-02T06:00:00Z", scheduled_end_at: "2026-09-02T12:00:00Z" }
              captures: { run_id: "$.data.id", reserved_g: "$.data.reserved_emission_g" }
            - call: GET /plants/${plant_id}/emission-ledger
              as: PlantAdmin
            - call: POST /formation-runs/${run_id}/start
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { actual_start_at: "2026-09-02T06:00:00Z" }
              captures: { err_id: "$.data.error_id" }
          assert:
            - "The run is created with reserved_emission_g == 255.00 (estimated_energy_kwh 102.00 * 2.50 g/kWh) - the budget check passes because 255.00 / 300.00 == 0.8500 is below the 1.0000 rejection line."
            - "emission-ledger answers emission_reserved_g == 255.00, emission_consumed_g == 0.00 and emission_utilization_ratio == 0.8500."
            - "emission-ledger answers compliance_posture == \"RESTRICTED\" - the ratio sits exactly on POSTURE_RESTRICTED_RATIO and the comparison is >=, so 0.8500 is already RESTRICTED and not OPEN."
            - "The start call answers 403 with error_id \"ERR_PLANT_RESTRICTED\" and the run stays in \"SCHEDULED\"."
            - "GET /plants/${plant_id} answers compliance_posture == \"RESTRICTED\", NOT \"FROZEN\" - the ratio is below 1.0000 and open_medical_removal_count is 0."
            - "A non-formation write remains legal under RESTRICTED: POST /battery-assemblies is not blocked by posture (only ERR_LOT_STATE_INVALID would apply for a FORMATION-state lot), proving RESTRICTED is narrower than FROZEN."

