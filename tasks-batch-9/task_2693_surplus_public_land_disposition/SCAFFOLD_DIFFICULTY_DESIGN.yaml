            - "PreferenceOffer.${offer_id}.entity_round_count == 0"
            - "PreferenceOffer.${offer_id}.timely_response_count == 0"
            - "PreferenceOffer.${offer_id}.interim_good_faith_score == 30"
            - "PreferenceOffer.${offer_id}.final_good_faith_score == null"
            - "PreferenceOffer.${offer_id}.agreed_price_cents == null"
            - "the NegotiationRound created by the trigger has round_number == 2, party == CUSTODIAN_AGENCY and is_timely == false"
            - "SurplusDeclaration.${decl_id}.status == NOTICED"

      - name: appraisal_reported_challenged_reported_revision_cycle_repeats
        grounds:
          - state_machines.Appraisal.REPORTED_to_CHALLENGED
          - state_machines.Appraisal.CHALLENGED_to_REPORTED
          - state_machines.AppraisalChallenge.SUBMITTED_to_SUSTAINED
          - state_machines.AppraisalChallenge.SUBMITTED_to_DENIED
          - calculations.challenge_deposit_requirement
        distinguishing_aspect: |
          The non-linear entity is Appraisal, not PreferenceOffer: the pair of
          edges REPORTED -> CHALLENGED -> REPORTED is a genuine cycle that
          traverses TWICE on one row, and the second traversal is only reachable
          because the first one rewrote appraised_value_cents to 92000000, which
          re-derives the admissibility thresholds (required deposit 1000000 ->
          920000, minimum delta 5000000 -> 4600000) so challenge_count reaches 2
          while status returns to REPORTED both times.
        test_recipe:
          setup:
            - "One Fund F-LAND with priority_rank 1 and allocation_pct 1.0, so a DENIED challenge has a forfeiture target."
            - "One custodian Agency and one COUNTY Agency that will be noticed and will act as the challenger."
            - "One Parcel and one Appraiser licensed to 2028-01-01T00:00:00Z."
            - "One Appraisal in status REPORTED with appraised_value_cents 100000000, reported_at 2026-08-01T00:00:00Z and expires_on 2027-08-01T00:00:00Z; the challenge window therefore closes 2026-08-31T00:00:00Z."
            - "One ADOPTED SurplusDeclaration on that parcel whose StatutoryNotice was served on the county, satisfying challenger eligibility; adopted_by_user_id is clerk-adopt-1."
            - "A first AppraisalChallenge with asserted_value_cents 90000000 and deposit_paid_cents 1000000 already determined SUSTAINED with revised_value_cents 92000000 by clerk-determine-1, so the appraisal is back in REPORTED at 92000000 with challenge_count 1."
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Land Acquisition Reserve", fund_code: "F-LAND", priority_rank: 1, allocation_pct: 1.0 }
              as: FinanceOfficer
              captures: { fund_1_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend County", agency_type: "COUNTY", contact_email: "assessor@riverbendcounty.gov" }
