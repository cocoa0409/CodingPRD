      - name: rbac_consumer_cannot_create_vendor
        claim_type: exclusive_operation_denied
        grounds: [roles.Consumer, roles.VendorManager]
        distinguishing_aspect: "Vendor creation is VendorManager-exclusive; Consumer -> 403."
        test_recipe:
          setup: ["a consumer exists"]
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
          trigger:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "Sneaky", home_region: US, processes_categories: [] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (403); no vendor created"

      - name: rbac_consumer_cannot_read_other_consumers_requests
        claim_type: exclusive_operation_denied
        grounds: [roles.Consumer, entities.RightsRequest.fields.consumer_id]
        distinguishing_aspect: "Ownership rule: Consumer B (X-User-ID == consumer B id) listing consumer A's requests -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["consumers A and B; A has one request"]
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "a@x.com", full_name: "A One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons_a: $.data.id }
            - call: "POST /privacy/consumers"
              payload: { email: "b@x.com", full_name: "B One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons_b: $.data.id }
            - call: "POST /privacy/consumers/${cons_a}/rights-requests"
              payload: { request_type: ACCESS, requested_categories: [BASIC_CONTACT] }
              as: Consumer
              as_user_id: "${cons_a}"
          trigger:
            - call: "GET /privacy/consumers/${cons_a}/rights-requests"
              payload: {}
              as: Consumer
              as_user_id: "${cons_b}"
              captures: { err: $.data.error_id }
            - call: "GET /privacy/consumers/${cons_a}/rights-requests"
              payload: {}
              as: Consumer
              as_user_id: "${cons_a}"
          assert:
            - "consumer B -> error_id == ERR_FORBIDDEN_ROLE (403)"
            - "consumer A (self) -> 200 with 1 request"

      - name: rbac_legal_cannot_publish_notice
        claim_type: exclusive_operation_denied
        grounds: [roles.LegalCounsel, roles.PrivacyAdmin]
        distinguishing_aspect: "Publish is PrivacyAdmin-exclusive: LegalCounsel -> 403 even though the notice exists and is DRAFT."
        test_recipe:
          setup: ["DRAFT notice exists"]
