# =============================================================================
# Task 1247: Campus Recruiting & Internship Program — scaffold seed tables
# Difficulty target: harder than expert (dense coupling over 14 entities:
# posture-gated season epochs, dual-variant scoring & deadline math, buffered
# vs half-open interval conflicts, OCC on offer/school-target writes, ledger
# and seat compensating invariants, segregation of duties).
# =============================================================================

scenario: |
  generate task hard than expert level! 1247. Campus Recruiting & Internship Program (corporate university recruiting): school target list & event calendar, application volume & screening at scale, interview day logistics & evaluator assignment, offer timing norms & exploding-offer policy, intern project assignment & mentor pairing, mid/final evaluation & return-offer decision, conversion tracking & alumni pipeline, housing/relocation stipend administration

domain_name: campus-recruiting
api_prefix: /campus-recruiting

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RecruitingSeason
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cohort label, e.g. '2027 Summer Internship Season'" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SELECTION | OFFER_PERIOD | INTERN_ACTIVE | CLOSED; posture gates all child operations" }
      - { name: application_open_at, type: datetime, source: input, description: "Application window open instant (inclusive)" }
      - { name: application_close_at, type: datetime, source: input, description: "Application window close instant (inclusive)" }
      - { name: interview_window_start_at, type: datetime, source: input, description: "Earliest instant an InterviewDay window may start" }
      - { name: interview_window_end_at, type: datetime, source: input, description: "Latest instant an InterviewDay window may end" }
      - { name: offer_window_open_at, type: datetime, source: input, description: "Earliest instant an offer may be extended (inclusive)" }
      - { name: offer_window_close_at, type: datetime, source: input, description: "Latest instant an offer may be extended (inclusive)" }
      - { name: exploding_offer_hours_default, type: integer, source: input, default: 72, description: "Default exploding-offer lifetime in hours when the school has no override" , constraints: ">= 1" }
      - { name: deadline_policy_mode, type: enum, source: input, default: WALL_CLOCK, description: "WALL_CLOCK | BUSINESS_HOURS; selects the exploding_offer_deadline variant" }
      - { name: max_extension_hours, type: integer, source: input, default: 72, description: "Per-offer cap on cumulative exploding-deadline extension hours", constraints: ">= 1" }
      - { name: shortlist_score_threshold, type: integer, source: input, description: "Minimum final screening score to shortlist (inclusive, >=)", constraints: "0..100" }
      - { name: stipend_budget_cents, type: integer, source: input, description: "Total housing/relocation stipend pool for the season", constraints: ">= 0" }
      - { name: stipend_reserved_cents, type: integer, source: computed, default: 0, description: "Invariant: == SUM(StipendDisbursement.amount_cents WHERE offer.application.season_id = this.id AND status = RESERVED)" }
      - { name: stipend_disbursed_cents, type: integer, source: computed, default: 0, description: "Invariant: == SUM(StipendDisbursement.amount_cents WHERE offer.application.season_id = this.id AND status = DISBURSED)" }
      - { name: applications_total_count, type: integer, source: computed, default: 0, description: "Stored counter incremented by +1 on every Application creation in this season" }
      - { name: offers_extended_count, type: integer, source: computed, default: 0, description: "Stored counter incremented by +1 when an Offer enters EXTENDED" }
      - { name: offers_accepted_count, type: integer, source: computed, default: 0, description: "Stored counter incremented by +1 when an Offer enters ACCEPTED" }
      - { name: completed_assignments_count, type: integer, source: computed, default: 0, description: "Stored counter incremented by +1 when a ProjectAssignment enters COMPLETED" }
      - { name: return_offers_extended_count, type: integer, source: computed, default: 0, description: "Stored counter incremented by +1 when a FINAL intern evaluation computes return_offer_decision = EXTENDED" }
      - { name: return_offers_accepted_count, type: integer, source: computed, default: 0, description: "Stored counter incremented by +1 when return_offer_outcome is recorded ACCEPTED" }

  - name: SchoolTarget
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> RecruitingSeason.id; owning season (from path)" }
      - { name: school_name, type: string, source: input, description: "School name; unique within the season (case-sensitive)" }
      - { name: tier, type: enum, source: input, description: "CORE | TARGET | EXPLORATORY; feeds screening_score TIER_WEIGHT" }
      - { name: application_cap, type: integer, source: input, description: "Max applications for this school with status NOT IN {SCREENED_OUT, WITHDRAWN}; submit rejected when count >= cap", constraints: ">= 1" }
      - { name: stipend_region, type: enum, source: input, description: "METRO | REGIONAL | REMOTE; feeds stipend_amount REGION_BASE and offer_total_comp REGION_MULTIPLIER" }
      - { name: exploding_offer_hours_override, type: integer, source: input, description: "Optional per-school exploding-offer lifetime in hours; null means use season default", constraints: ">= 1 or null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DROPPED" }

  - name: CampusEvent
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> RecruitingSeason.id; owning season (from path)" }
      - { name: school_target_id, type: string, source: input, description: "FK -> SchoolTarget.id; school hosting the event" }
      - { name: event_type, type: enum, source: input, description: "CAREER_FAIR | INFO_SESSION | RESUME_DROP" }
      - { name: start_at, type: datetime, source: input, description: "Event start (half-open interval lower bound)" }
      - { name: end_at, type: datetime, source: input, description: "Event end (half-open interval upper bound; must be > start_at)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: resume_count, type: integer, source: system, default: 0, description: "Resumes collected; set from payload at completion", constraints: ">= 0" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Globally unique candidate email (lowercased comparison)" }
      - { name: full_name, type: string, source: input, description: "Candidate full name" }
      - { name: expected_graduation_date, type: datetime, source: input, description: "Expected graduation date" }
      - { name: is_alumnus, type: boolean, source: computed, default: false, description: "Cross-entity derivation: true iff EXISTS ProjectAssignment pa JOIN Application a ON pa.application_id = a.id WHERE a.candidate_id = this.id AND pa.status = COMPLETED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> RecruitingSeason.id; owning season (from path)" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; applicant; must equal X-User-ID when role is Candidate" }
      - { name: school_target_id, type: string, source: input, description: "FK -> SchoolTarget.id; school the candidate applies from" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SHORTLISTED | INTERVIEW_SCHEDULED | DECISION_PENDING | OFFER_PENDING | ACCEPTED | SCREENED_OUT | REJECTED | WITHDRAWN | EXPIRED" }
      - { name: referral_flag, type: boolean, source: input, default: false, description: "Employee-referral flag; adds REFERRAL_POINTS to screening_score" }
      - { name: prior_internship_count, type: integer, source: input, default: 0, description: "Number of prior internships; adds PRIOR_INTERNSHIP_POINTS each", constraints: ">= 0" }
      - { name: relocation_distance_miles, type: integer, source: input, description: "One-way relocation distance; feeds stipend distance band", constraints: ">= 0" }
      - { name: screening_score_provisional, type: integer, source: computed, description: "Snapshot of screening_score evaluated at submission time; never recomputed afterwards" }
      - { name: screening_score_final, type: integer, source: computed, description: "screening_score evaluated at screen time (current tier + current COMPLETED events); null until screened", constraints: "null until first screen" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> RecruitingSeason.id; season this staff member serves (from path)" }
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: email, type: string, source: input, description: "Staff email; unique within the season" }
      - { name: alma_mater_school_name, type: string, source: input, description: "Optional alma mater; conflict-of-interest when equal (case-insensitive) to an applicant school's school_name", constraints: "null allowed" }
      - { name: daily_slot_limit, type: integer, source: input, default: 6, description: "Max BOOKED/COMPLETED slots per day for this evaluator", constraints: ">= 1" }
      - { name: max_interns, type: integer, source: input, default: 2, description: "Max concurrent intern assignments as mentor", constraints: ">= 1" }
      - { name: can_evaluate, type: boolean, source: input, default: true, description: "Capability flag: may be assigned as slot evaluator" }
      - { name: can_mentor, type: boolean, source: input, default: true, description: "Capability flag: may be assigned as mentor" }
      - { name: calibrated, type: boolean, source: input, default: false, description: "Calibration flag; required to evaluate candidates from CORE-tier schools" }
      - { name: assigned_intern_count, type: integer, source: computed, default: 0, description: "Invariant: == COUNT(ProjectAssignment WHERE mentor_id = this.id AND status IN {ACTIVE, COMPLETED})" }

  - name: InterviewDay
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> RecruitingSeason.id; owning season (from path)" }
      - { name: window_start_at, type: datetime, source: input, description: "Day window start; slots must start at or after this instant" }
      - { name: window_end_at, type: datetime, source: input, description: "Day window end; slots must end at or before this instant; must be > window_start_at" }
      - { name: capacity, type: integer, source: input, description: "Max seat-consuming slots (BOOKED/COMPLETED/NO_SHOW)", constraints: ">= 1" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Invariant: == COUNT(InterviewSlot WHERE interview_day_id = this.id AND status IN {BOOKED, COMPLETED, NO_SHOW})" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | COMPLETED" }

  - name: InterviewSlot
    parent: null
    common_fields: true
    fields:
      - { name: interview_day_id, type: string, source: system, description: "FK -> InterviewDay.id; owning day (from path)" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; interviewed candidate's application" }
      - { name: evaluator_id, type: string, source: input, description: "FK -> Employee.id; assigned evaluator (can_evaluate must be true)" }
      - { name: start_at, type: datetime, source: input, description: "Slot start (half-open lower bound)" }
      - { name: end_at, type: datetime, source: input, description: "Slot end (half-open upper bound; must be > start_at)" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - { name: interview_slot_id, type: string, source: system, description: "FK -> InterviewSlot.id; slot being scored (from path); unique — one evaluation per slot" }
      - { name: evaluator_id, type: string, source: system, description: "FK -> Employee.id; denormalized from slot.evaluator_id at submission" }
      - { name: score, type: integer, source: input, description: "Interview score", constraints: "1..5" }
      - { name: recommendation, type: enum, source: input, description: "STRONG_HIRE | HIRE | LEAN_NO | NO_HIRE" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; offeree's application (from path); unique — at most one Offer per application" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXTENDED | ACCEPTED | DECLINED | EXPIRED | RESCINDED" }
      - { name: weekly_rate_cents, type: integer, source: input, description: "Weekly internship pay in cents", constraints: "> 0" }
      - { name: duration_weeks, type: integer, source: input, description: "Internship length in weeks", constraints: ">= 1" }
      - { name: sign_on_bonus_cents, type: integer, source: input, default: 0, description: "One-time sign-on bonus in cents", constraints: ">= 0" }
      - { name: total_comp_cents, type: integer, source: computed, description: "offer_total_comp result; recomputed on every terms revision and at extend" }
      - { name: policy_hours_snapshot, type: integer, source: system, description: "Exploding-offer hours pinned at extend: school.exploding_offer_hours_override ?? season.exploding_offer_hours_default; null until extended" }
      - { name: extended_at, type: datetime, source: system, description: "Instant the offer entered EXTENDED; null until extended" }
      - { name: deadline_at, type: datetime, source: computed, description: "exploding_offer_deadline result; inclusive accept boundary; null until extended" }
      - { name: extension_hours_granted, type: integer, source: system, default: 0, description: "Cumulative deadline-extension hours granted; capped by season.max_extension_hours" }
      - { name: stipend_amount_cents, type: integer, source: computed, description: "stipend_amount result computed at extend; null until extended" }

  - name: StipendDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; offer whose acceptance reserved this stipend; unique" }
      - { name: amount_cents, type: integer, source: computed, description: "Copied from Offer.stipend_amount_cents at accept; immutable thereafter" }
      - { name: status, type: enum, source: system, description: "RESERVED | DISBURSED | RELEASED" }

  - name: InternProject
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> RecruitingSeason.id; owning season (from path)" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: capacity, type: integer, source: input, description: "Max intern seats", constraints: ">= 1" }
      - { name: assigned_count, type: integer, source: computed, default: 0, description: "Invariant: == COUNT(ProjectAssignment WHERE intern_project_id = this.id AND status IN {ACTIVE, COMPLETED})" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: ProjectAssignment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the intern's ACCEPTED application; unique — one assignment per application" }
      - { name: intern_project_id, type: string, source: system, description: "FK -> InternProject.id; assigned project (from path)" }
      - { name: mentor_id, type: string, source: input, description: "FK -> Employee.id; paired mentor (can_mentor must be true)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | UNASSIGNED" }
      - { name: return_offer_decision, type: enum, source: system, default: NONE, description: "NONE | EXTENDED | NO_OFFER; computed by return_offer_decision on FINAL intern evaluation" }
      - { name: return_offer_outcome, type: enum, source: system, default: NONE, description: "NONE | ACCEPTED | DECLINED; recorded once by Recruiter when decision = EXTENDED" }

  - name: InternEvaluation
    parent: null
    common_fields: false
    fields:
      - { name: project_assignment_id, type: string, source: system, description: "FK -> ProjectAssignment.id; evaluated assignment (from path)" }
      - { name: eval_type, type: enum, source: input, description: "MID | FINAL; unique per assignment (one MID and one FINAL max)" }
      - { name: rating, type: integer, source: input, description: "Intern performance rating", constraints: "1..5" }
      - { name: would_rehire, type: boolean, source: input, description: "Mentor rehire recommendation; gates return_offer_decision on FINAL" }
      - { name: submitted_by_mentor_id, type: string, source: system, description: "X-User-ID of the submitting Mentor; must equal assignment.mentor_id" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RecruitingSeason
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /campus-recruiting/seasons/{id}/advance"
        actor: RecruitingAdmin
        preconditions:
          - "At least one SchoolTarget with status ACTIVE exists for this season (ERR_SEASON_ADVANCE_BLOCKED)"
        side_effects: []
      - from: OPEN
        to: SELECTION
        trigger: "POST /campus-recruiting/seasons/{id}/advance"
        actor: RecruitingAdmin
        preconditions:
          - "Logical clock now > application_close_at (ERR_SEASON_ADVANCE_BLOCKED)"
        side_effects: []
      - from: SELECTION
        to: OFFER_PERIOD
        trigger: "POST /campus-recruiting/seasons/{id}/advance"
        actor: RecruitingAdmin
        preconditions:
          - "No Application in this season has status SUBMITTED (ERR_SEASON_ADVANCE_BLOCKED)"
        side_effects: []
      - from: OFFER_PERIOD
        to: INTERN_ACTIVE
        trigger: "POST /campus-recruiting/seasons/{id}/advance"
        actor: RecruitingAdmin
        preconditions:
          - "No Offer whose application's season is this season has status EXTENDED (ERR_SEASON_ADVANCE_BLOCKED)"
        side_effects: []
      - from: INTERN_ACTIVE
        to: CLOSED
        trigger: "POST /campus-recruiting/seasons/{id}/close"
        actor: RecruitingAdmin
        preconditions:
          - "No ProjectAssignment whose application's season is this season has status ACTIVE (ERR_SEASON_CLOSE_BLOCKED)"
        side_effects:
          - "Cascade L1: every Offer (whose application's season_id = this.id) with status EXTENDED -> EXPIRED"
          - "Cascade L2: each such Offer flip conditionally flips its Application OFFER_PENDING -> EXPIRED (only when the Application is currently OFFER_PENDING)"
          - "Cascade L1: every StipendDisbursement (whose offer's application's season_id = this.id) with status RESERVED -> RELEASED"
          - "Cascade L2: each such disbursement flip decrements this season's stipend_reserved_cents by the disbursement's amount_cents (ledger bubble-up)"

  - entity: SchoolTarget
    initial_state: ACTIVE
    terminal_states: [DROPPED]
    transitions:
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /campus-recruiting/school-targets/{id}/drop"
        actor: RecruitingAdmin
        preconditions:
          - "Season status IN {DRAFT, OPEN, SELECTION} (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects:
          - "Cascade L1: every CampusEvent with school_target_id = this.id and status SCHEDULED -> CANCELLED"
          - "Cascade L2: each such event cancellation shrinks the COMPLETED/SCHEDULED engagement pool read by future screening_score final-variant computations for applications of this school (stored screening_score_provisional snapshots are NOT recomputed)"

  - entity: CampusEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /campus-recruiting/campus-events/{id}/complete"
        actor: Recruiter
        preconditions:
          - "Season status IN {OPEN, SELECTION} (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects:
          - "resume_count set from payload"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /campus-recruiting/campus-events/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "Season status IN {OPEN, SELECTION} (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from SchoolTarget drop)"
        actor: system
        preconditions: []
        side_effects:
          - "Contributes to the drop cascade L2 engagement-pool shrink"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [SCREENED_OUT, REJECTED, WITHDRAWN, ACCEPTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /campus-recruiting/applications/{id}/screen with decision = SHORTLIST"
        actor: Recruiter
        preconditions:
          - "Season status = SELECTION (ERR_SEASON_POSTURE_FORBIDDEN)"
          - "screening_score_final (computed now) >= season.shortlist_score_threshold (ERR_SCREENING_THRESHOLD_NOT_MET)"
        side_effects:
          - "screening_score_final computed via screening_score final variant and stored"
      - from: SUBMITTED
        to: SCREENED_OUT
        trigger: "POST /campus-recruiting/applications/{id}/screen with decision = REJECT"
        actor: Recruiter
        preconditions:
          - "Season status = SELECTION (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects:
          - "screening_score_final computed via screening_score final variant and stored"
      - from: SHORTLISTED
        to: INTERVIEW_SCHEDULED
        trigger: "system (automatic on first InterviewSlot booked for this application)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INTERVIEW_SCHEDULED
        to: SHORTLISTED
        trigger: "system (auto-flip rule: after any InterviewSlot status mutation for this application, when application.status = INTERVIEW_SCHEDULED and every slot is terminal and COUNT(slots with status COMPLETED) = 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cycle SHORTLISTED <-> INTERVIEW_SCHEDULED via book-then-cancel-all"
      - from: INTERVIEW_SCHEDULED
        to: DECISION_PENDING
        trigger: "system (auto-flip rule: after any InterviewSlot status mutation for this application, when application.status = INTERVIEW_SCHEDULED and every slot is terminal and COUNT(slots with status COMPLETED) >= 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DECISION_PENDING
        to: OFFER_PENDING
        trigger: "system (automatic on Offer extend)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFER_PENDING
        to: DECISION_PENDING
        trigger: "system (conditional cascade on Offer EXTENDED -> DECLINED or EXTENDED -> RESCINDED; fires only when application is currently OFFER_PENDING)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cycle DECISION_PENDING <-> OFFER_PENDING via decline/rescind then re-extend"
      - from: OFFER_PENDING
        to: ACCEPTED
        trigger: "system (automatic on Offer accept)"
        actor: system
        preconditions: []
        side_effects:
          - "Bubble-up: season.offers_accepted_count incremented by +1 (driven by the Offer flip)"
      - from: OFFER_PENDING
        to: EXPIRED
        trigger: "system (conditional cascade on Offer EXTENDED -> EXPIRED, including the lazy flip on accept-after-deadline and the season-close sweep; fires only when application is currently OFFER_PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DECISION_PENDING
        to: REJECTED
        trigger: "POST /campus-recruiting/applications/{id}/reject"
        actor: Recruiter
        preconditions:
          - "Season status IN {SELECTION, OFFER_PERIOD} (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /campus-recruiting/applications/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "X-User-ID = application.candidate_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /campus-recruiting/applications/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "X-User-ID = application.candidate_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: INTERVIEW_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /campus-recruiting/applications/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "X-User-ID = application.candidate_id (ERR_FORBIDDEN)"
        side_effects:
          - "Ordered cascade: (1) each BOOKED InterviewSlot of this application -> CANCELLED with its InterviewDay.booked_count decremented by 1 (auto-flip rule suppressed during this cascade); (2) application status set WITHDRAWN last"
      - from: DECISION_PENDING
        to: WITHDRAWN
        trigger: "POST /campus-recruiting/applications/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "X-User-ID = application.candidate_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: OFFER_PENDING
        to: WITHDRAWN
        trigger: "POST /campus-recruiting/applications/{id}/withdraw"
        actor: Candidate
        preconditions:
          - "X-User-ID = application.candidate_id (ERR_FORBIDDEN)"
        side_effects:
          - "Ordered cascade: (1) the EXTENDED Offer -> DECLINED with its application-flip side effect suppressed; (2) each BOOKED InterviewSlot -> CANCELLED with booked_count decrement (auto-flip suppressed); (3) application status set WITHDRAWN last"

  - entity: InterviewDay
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /campus-recruiting/interview-days/{id}/lock"
        actor: Recruiter
        preconditions:
          - "Season status = SELECTION (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects: []
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /campus-recruiting/interview-days/{id}/complete"
        actor: Recruiter
        preconditions:
          - "Every InterviewSlot of this day has status IN {COMPLETED, CANCELLED, NO_SHOW} (ERR_DAY_STATE_FORBIDDEN)"
        side_effects: []

  - entity: InterviewSlot
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "system (automatic when the slot's Evaluation is submitted)"
        actor: system
        preconditions: []
        side_effects:
          - "Application auto-flip rule re-evaluated for the slot's application"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /campus-recruiting/interview-slots/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "Season status = SELECTION (ERR_SEASON_POSTURE_FORBIDDEN)"
          - "InterviewDay status = OPEN (ERR_DAY_STATE_FORBIDDEN)"
        side_effects:
          - "InterviewDay.booked_count decremented by 1 (compensating action of the booking)"
          - "Application auto-flip rule re-evaluated"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /campus-recruiting/interview-slots/{id}/no-show"
        actor: Recruiter
        preconditions:
          - "Season status = SELECTION (ERR_SEASON_POSTURE_FORBIDDEN)"
          - "InterviewDay status IN {OPEN, LOCKED} (ERR_DAY_STATE_FORBIDDEN)"
        side_effects:
          - "InterviewDay.booked_count UNCHANGED (no-show consumes the seat)"
          - "Application auto-flip rule re-evaluated"
      - from: BOOKED
        to: CANCELLED
        trigger: "system (cascade from Application withdraw)"
        actor: system
        preconditions: []
        side_effects:
          - "InterviewDay.booked_count decremented by 1 (auto-flip suppressed within the withdraw cascade)"

  - entity: Offer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, RESCINDED]
    transitions:
      - from: DRAFT
        to: EXTENDED
        trigger: "POST /campus-recruiting/offers/{id}/extend"
        actor: Recruiter
        preconditions:
          - "Season status IN {OFFER_PERIOD, INTERN_ACTIVE} (ERR_SEASON_POSTURE_FORBIDDEN)"
          - "offer_window_open_at <= now <= offer_window_close_at (ERR_OFFER_WINDOW_CLOSED)"
          - "Application status = DECISION_PENDING (ERR_APPLICATION_STATE_FORBIDDEN)"
        side_effects:
          - "policy_hours_snapshot := school.exploding_offer_hours_override ?? season.exploding_offer_hours_default"
          - "extended_at := now"
          - "deadline_at := exploding_offer_deadline(extended_at, policy_hours_snapshot, season.deadline_policy_mode)"
          - "stipend_amount_cents := stipend_amount(school.stipend_region, school.tier, application.relocation_distance_miles)"
          - "total_comp_cents := offer_total_comp(weekly_rate_cents, duration_weeks, sign_on_bonus_cents, school.stipend_region)"
          - "Application DECISION_PENDING -> OFFER_PENDING"
          - "Bubble-up: season.offers_extended_count incremented by +1 (driven by the Application flip)"
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /campus-recruiting/offers/{id}/accept"
        actor: Candidate
        preconditions:
          - "X-User-ID = offer.application.candidate_id (ERR_FORBIDDEN)"
          - "Season status IN {OFFER_PERIOD, INTERN_ACTIVE} (ERR_SEASON_POSTURE_FORBIDDEN)"
          - "now <= deadline_at; if now > deadline_at the offer first flips EXTENDED -> EXPIRED and the request fails with ERR_OFFER_EXPIRED"
          - "season.stipend_reserved_cents + offer.stipend_amount_cents <= season.stipend_budget_cents (ERR_STIPEND_BUDGET_EXCEEDED)"
        side_effects:
          - "Cascade L1: StipendDisbursement created with status RESERVED, amount_cents := offer.stipend_amount_cents"
          - "Cascade L2: season.stipend_reserved_cents incremented by amount_cents (driven by the disbursement creation)"
          - "Cascade L1: Application OFFER_PENDING -> ACCEPTED"
          - "Cascade L2: season.offers_accepted_count incremented by +1 (driven by the Application flip)"
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /campus-recruiting/offers/{id}/decline"
        actor: Candidate
        preconditions:
          - "X-User-ID = offer.application.candidate_id (ERR_FORBIDDEN)"
          - "Season status IN {OFFER_PERIOD, INTERN_ACTIVE} (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects:
          - "Conditional cascade: Application OFFER_PENDING -> DECISION_PENDING (only when currently OFFER_PENDING)"
      - from: EXTENDED
        to: EXPIRED
        trigger: "POST /campus-recruiting/offers/{id}/expire"
        actor: Recruiter
        preconditions:
          - "now > deadline_at (ERR_OFFER_NOT_YET_EXPIRED)"
        side_effects:
          - "Conditional cascade: Application OFFER_PENDING -> EXPIRED (only when currently OFFER_PENDING)"
      - from: EXTENDED
        to: EXPIRED
        trigger: "system (lazy flip when any offer operation observes now > deadline_at; also season-close sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Conditional cascade: Application OFFER_PENDING -> EXPIRED (only when currently OFFER_PENDING)"
      - from: EXTENDED
        to: RESCINDED
        trigger: "POST /campus-recruiting/offers/{id}/rescind"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "Conditional cascade: Application OFFER_PENDING -> DECISION_PENDING (only when currently OFFER_PENDING)"
      - from: DECLINED
        to: DRAFT
        trigger: "PUT /campus-recruiting/offers/{id} (terms revision; OCC via expected_offer_version)"
        actor: Recruiter
        preconditions:
          - "expected_offer_version = current offer.version (ERR_STALE_OFFER_VERSION)"
        side_effects:
          - "Terms fields updated; total_comp_cents recomputed; version incremented by 1"
          - "Cycle DRAFT -> EXTENDED -> DECLINED -> DRAFT enables re-negotiation"
      - from: DRAFT
        to: DRAFT
        trigger: "PUT /campus-recruiting/offers/{id} (terms revision; OCC via expected_offer_version)"
        actor: Recruiter
        preconditions:
          - "expected_offer_version = current offer.version (ERR_STALE_OFFER_VERSION)"
        side_effects:
          - "Terms fields updated; total_comp_cents recomputed; version incremented by 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /campus-recruiting/offers/{id}/extend-deadline"
        actor: RecruitingAdmin
        preconditions:
          - "extension_hours_granted + additional_hours <= season.max_extension_hours (ERR_EXTENSION_CAP_EXCEEDED)"
        side_effects:
          - "extension_hours_granted += additional_hours"
          - "deadline_at += additional_hours hours (wall-clock shift regardless of deadline_policy_mode)"

  - entity: StipendDisbursement
    initial_state: RESERVED
    terminal_states: [DISBURSED, RELEASED]
    transitions:
      - from: RESERVED
        to: DISBURSED
        trigger: "POST /campus-recruiting/stipend-disbursements/{id}/disburse"
        actor: Recruiter
        preconditions:
          - "Season status = INTERN_ACTIVE (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects:
          - "Season.stipend_reserved_cents decremented by amount_cents"
          - "Season.stipend_disbursed_cents incremented by amount_cents"
      - from: RESERVED
        to: RELEASED
        trigger: "system (cascade from RecruitingSeason close)"
        actor: system
        preconditions: []
        side_effects:
          - "Season.stipend_reserved_cents decremented by amount_cents"

  - entity: InternProject
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /campus-recruiting/intern-projects/{id}/close"
        actor: Recruiter
        preconditions: []
        side_effects: []

  - entity: ProjectAssignment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, UNASSIGNED]
    transitions:
      - from: ACTIVE
        to: UNASSIGNED
        trigger: "POST /campus-recruiting/project-assignments/{id}/unassign"
        actor: Recruiter
        preconditions:
          - "Season status = INTERN_ACTIVE (ERR_SEASON_POSTURE_FORBIDDEN)"
        side_effects:
          - "InternProject.assigned_count decremented by 1 (compensating action of the assignment)"
          - "Employee.assigned_intern_count (mentor) decremented by 1"
          - "return_offer_decision and return_offer_outcome frozen at their current values"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /campus-recruiting/project-assignments/{id}/complete"
        actor: Recruiter
        preconditions:
          - "Season status = INTERN_ACTIVE (ERR_SEASON_POSTURE_FORBIDDEN)"
          - "An InternEvaluation with eval_type = FINAL exists for this assignment (ERR_FINAL_EVALUATION_REQUIRED)"
        side_effects:
          - "Season.completed_assignments_count incremented by +1"
          - "Capacity counts unchanged (assigned_count keeps counting COMPLETED assignments)"
          - "Candidate.is_alumnus for the application's candidate becomes true"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-terms-stale-update
    parent_entity: Offer
    write_endpoint: "PUT /campus-recruiting/offers/{id}"
    occ_field: "expected_offer_version"
    description: |
      Revising an Offer's terms with an expected_offer_version that does not
      match the offer's current version is rejected. This captures the case
      where another writer has already revised the terms (or a decline/revise
      cycle has advanced the version) since the client last observed the offer,
      so the client's read-modify-write would silently supersede newer terms.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
  - rule_id: school-target-config-stale-update
    parent_entity: SchoolTarget
    write_endpoint: "PATCH /campus-recruiting/school-targets/{id}"
    occ_field: "expected_school_target_version"
    description: |
      Patching a SchoolTarget (tier, cap, stipend region, exploding-offer
      override) with an expected_school_target_version that does not match the
      target's current version is rejected. Tier edits feed screening_score's
      final variant, so a stale read-modify-write would clobber a concurrent
      config change that screening decisions have already observed.
    error_id: ERR_STALE_SCHOOL_TARGET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_score
    trigger: "Provisional variant: on Application creation (POST /campus-recruiting/seasons/{id}/applications). Final variant: on POST /campus-recruiting/applications/{id}/screen (stored to screening_score_final)."
    algorithm: weighted_scoring
    formula: |
      score = min(SCORE_CAP,
                  TIER_WEIGHT[school.tier]
                  + EVENT_POINTS * completed_event_count
                  + REFERRAL_POINTS * (1 if application.referral_flag else 0)
                  + PRIOR_INTERNSHIP_POINTS * application.prior_internship_count)
      where completed_event_count = COUNT(CampusEvent e
        WHERE e.school_target_id = application.school_target_id
          AND e.season_id = application.season_id
          AND e.status = COMPLETED
          AND e.end_at <= as_of)
      as_of = application.created_at for the provisional variant;
              as_of = current logical clock for the final variant.
      school.tier is read at evaluation time (current value), so a tier edit
      between submission and screen shifts the final score.
    input_set: "The Application, its SchoolTarget (current tier), and that school's CampusEvents in the same season with status COMPLETED and end_at <= as_of. CANCELLED and SCHEDULED events are excluded."
    constants:
      TIER_WEIGHT_CORE: 40
      TIER_WEIGHT_TARGET: 25
      TIER_WEIGHT_EXPLORATORY: 10
      EVENT_POINTS: 5
      REFERRAL_POINTS: 15
      PRIOR_INTERNSHIP_POINTS: 10
      SCORE_CAP: 100
    precision: "integer arithmetic; no rounding"
    variants:
      - name: provisional
        when: "At application submission; stored to screening_score_provisional and never recomputed"
        difference: "as_of = application.created_at; events completing after submission and later tier edits are invisible"
      - name: final
        when: "At screen time; stored to screening_score_final"
        difference: "as_of = current logical clock and current school tier; diverges from provisional whenever events completed or the tier changed between submission and screen"

  - name: exploding_offer_deadline
    trigger: "On POST /campus-recruiting/offers/{id}/extend (stored to deadline_at); extend-deadline shifts deadline_at by whole hours in wall-clock regardless of variant."
    algorithm: threshold
    formula: |
      hours = school.exploding_offer_hours_override ?? season.exploding_offer_hours_default
      WALL_CLOCK variant: deadline_at = extended_at + hours * 3600 seconds.
      BUSINESS_HOURS variant: deadline_at = earliest instant t such that the
      count of seconds in [extended_at, t] falling inside Monday-Friday
      09:00:00-17:00:00 UTC (half-open [09:00, 17:00)) equals hours * 3600.
      Accept boundary is inclusive: accept succeeds iff now <= deadline_at.
    input_set: "The Offer's extended_at, the school's exploding_offer_hours_override, the season's exploding_offer_hours_default and deadline_policy_mode."
    constants:
      BUSINESS_DAY_START_HOUR: 9
      BUSINESS_DAY_END_HOUR: 17
      BUSINESS_DAYS: "Monday..Friday (UTC)"
    precision: "second precision; no sub-second rounding"
    variants:
      - name: wall_clock
        when: "season.deadline_policy_mode = WALL_CLOCK"
        difference: "Straight hour addition; weekends and nights count"
      - name: business_hours
        when: "season.deadline_policy_mode = BUSINESS_HOURS"
        difference: "Only Mon-Fri 09:00-17:00 UTC seconds count; identical extended_at and hours yield a strictly later deadline than wall_clock whenever the interval crosses any non-business second"

  - name: stipend_amount
    trigger: "On POST /campus-recruiting/offers/{id}/extend (stored to Offer.stipend_amount_cents)"
    algorithm: tiered_pricing
    formula: |
      base = REGION_BASE[school.stipend_region]
      distance_bonus = 150000 if application.relocation_distance_miles >= 1500
                       else 75000 if application.relocation_distance_miles >= 500
                       else 0
      surcharge = CORE_METRO_SURCHARGE if (school.stipend_region = METRO and school.tier = CORE) else 0
      amount = min(STIPEND_CAP_CENTS, base + distance_bonus + surcharge)
    input_set: "The application's relocation_distance_miles and its SchoolTarget's current stipend_region and tier at extend time."
    constants:
      REGION_BASE_METRO: 300000
      REGION_BASE_REGIONAL: 200000
      REGION_BASE_REMOTE: 100000
      DISTANCE_BONUS_HIGH: 150000
      DISTANCE_BONUS_MID: 75000
      DISTANCE_HIGH_MILES: 1500
      DISTANCE_MID_MILES: 500
      CORE_METRO_SURCHARGE: 50000
      STIPEND_CAP_CENTS: 400000
    precision: "integer cents; no rounding"
    variants: []

  - name: offer_total_comp
    trigger: "On Offer creation, on every PUT /campus-recruiting/offers/{id} terms revision, and re-stored at extend"
    algorithm: aggregation
    formula: |
      mult = REGION_MULTIPLIER[school.stipend_region]
      salary_component = round_half_up_to_integer_cents(weekly_rate_cents * duration_weeks * mult)
      bonus_component  = round_half_up_to_integer_cents(sign_on_bonus_cents * mult)
      total_comp_cents = salary_component + bonus_component
      PINNED ORDER: each component is rounded to integer cents FIRST, then the
      two integer components are summed. The alternative reading
      (round_half_up((weekly_rate_cents * duration_weeks + sign_on_bonus_cents) * mult))
      is a valid prose interpretation that can differ by one cent and is NOT used.
    input_set: "The Offer's weekly_rate_cents, duration_weeks, sign_on_bonus_cents, and the SchoolTarget's current stipend_region."
    constants:
      REGION_MULTIPLIER_METRO: 1.25
      REGION_MULTIPLIER_REGIONAL: 1.10
      REGION_MULTIPLIER_REMOTE: 1.00
    precision: "integer cents; round_half_up per component, then sum"
    variants: []

  - name: return_offer_decision
    trigger: "On POST /campus-recruiting/project-assignments/{id}/intern-evaluations with eval_type = FINAL (stored to ProjectAssignment.return_offer_decision)"
    algorithm: weighted_scoring
    formula: |
      weighted_score = round_half_up_to_2dp((MID.rating + 2 * FINAL.rating) / 3)
      decision = EXTENDED if (weighted_score >= RETURN_OFFER_THRESHOLD and FINAL.would_rehire = true)
                 else NO_OFFER
    input_set: "The assignment's MID InternEvaluation.rating and the just-submitted FINAL InternEvaluation.rating and would_rehire."
    constants:
      MID_WEIGHT: 1
      FINAL_WEIGHT: 2
      RETURN_OFFER_THRESHOLD: 4.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: conversion_rates
    trigger: "On GET /campus-recruiting/seasons/{id}/conversion-summary"
    algorithm: aggregation
    formula: |
      conversion_rate_provisional = round_half_up_to_4dp(return_offers_accepted_count / offers_accepted_count)
      conversion_rate_final       = round_half_up_to_4dp(return_offers_accepted_count / completed_assignments_count)
      Either rate is 0 when its denominator is 0.
    input_set: "The season's stored counters: return_offers_accepted_count, offers_accepted_count, completed_assignments_count."
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Always reported alongside final"
        difference: "Denominator is offers_accepted_count (all accepted interns)"
      - name: final
        when: "Always reported alongside provisional"
        difference: "Denominator is completed_assignments_count (interns who finished); strictly smaller-or-equal denominator, so the final rate is >= provisional and differs whenever any accepted intern has not completed an assignment"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Candidate endpoints require X-User-ID = candidate.id (POST applications: payload candidate_id = X-User-ID; withdraw/accept/decline/read-own: X-User-ID = application.candidate_id); Evaluator submit/revise requires X-User-ID = slot.evaluator_id; Mentor intern-evaluation requires X-User-ID = assignment.mentor_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (season before school_target before child resources)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Request body shape: required fields present, types valid, enum members valid, ranges honored (score/rating 1..5, capacities >= 1, hours >= 1, cents >= 0, end_at > start_at, relocation_distance_miles >= 0)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "OCC: expected_school_target_version equals the SchoolTarget's current version"
    error_id: ERR_STALE_SCHOOL_TARGET_VERSION
    http_status: 412
    applies_to: "PATCH /campus-recruiting/school-targets/{id}"
  - priority: 7
    category: state
    check: "OCC: expected_offer_version equals the Offer's current version"
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
    applies_to: "PUT /campus-recruiting/offers/{id}"
  - priority: 8
    category: state
    check: "Season posture gate: POST applications requires OPEN; screen/day create/slot book/slot cancel/no-show/evaluation submit+revise require SELECTION; offer create requires SELECTION or OFFER_PERIOD; offer extend/accept/decline/extend-deadline require OFFER_PERIOD or INTERN_ACTIVE; event create/complete/cancel require OPEN or SELECTION; disburse/assignment create/unassign/complete/intern-evaluation/record-outcome require INTERN_ACTIVE"
    error_id: ERR_SEASON_POSTURE_FORBIDDEN
    http_status: 409
    applies_to: "posture-gated endpoints"
  - priority: 9
    category: state
    check: "Season advance gates: DRAFT->OPEN requires >= 1 ACTIVE SchoolTarget; OPEN->SELECTION requires now > application_close_at; SELECTION->OFFER_PERIOD requires zero SUBMITTED applications; OFFER_PERIOD->INTERN_ACTIVE requires zero EXTENDED offers"
    error_id: ERR_SEASON_ADVANCE_BLOCKED
    http_status: 409
    applies_to: "POST /campus-recruiting/seasons/{id}/advance"
  - priority: 10
    category: state
    check: "Season close gate: zero ACTIVE ProjectAssignments in the season"
    error_id: ERR_SEASON_CLOSE_BLOCKED
    http_status: 409
    applies_to: "POST /campus-recruiting/seasons/{id}/close"
  - priority: 11
    category: state
    check: "Application status allows the transition: screen requires SUBMITTED; reject requires DECISION_PENDING; withdraw excludes terminal states and ACCEPTED; slot booking requires SHORTLISTED or INTERVIEW_SCHEDULED; offer create requires DECISION_PENDING; project-assignment creation requires ACCEPTED"
    error_id: ERR_APPLICATION_STATE_FORBIDDEN
    http_status: 409
    applies_to: "application transitions and dependents"
  - priority: 12
    category: state
    check: "Offer status allows the transition: extend requires DRAFT; accept/decline/rescind/expire/extend-deadline require EXTENDED; PUT revision requires DRAFT or DECLINED"
    error_id: ERR_OFFER_STATE_FORBIDDEN
    http_status: 409
    applies_to: "offer transitions"
  - priority: 13
    category: state
    check: "InterviewDay status allows the operation: slot book/cancel require OPEN; no-show requires OPEN or LOCKED; evaluation submit requires OPEN or LOCKED; evaluation revise requires OPEN; lock requires OPEN; complete requires LOCKED and all slots terminal"
    error_id: ERR_DAY_STATE_FORBIDDEN
    http_status: 409
    applies_to: "interview-day dependents"
  - priority: 14
    category: state
    check: "InterviewSlot status allows the transition: cancel/no-show/evaluation-submit require BOOKED"
    error_id: ERR_SLOT_STATE_FORBIDDEN
    http_status: 409
    applies_to: "interview-slot transitions"
  - priority: 15
    category: state
    check: "CampusEvent status allows the transition: complete/cancel require SCHEDULED"
    error_id: ERR_EVENT_STATE_FORBIDDEN
    http_status: 409
    applies_to: "campus-event transitions"
  - priority: 16
    category: state
    check: "StipendDisbursement status allows disburse: requires RESERVED"
    error_id: ERR_DISBURSEMENT_STATE_FORBIDDEN
    http_status: 409
    applies_to: "POST /campus-recruiting/stipend-disbursements/{id}/disburse"
  - priority: 17
    category: state
    check: "InternProject status allows assignment creation: requires OPEN"
    error_id: ERR_PROJECT_STATE_FORBIDDEN
    http_status: 409
    applies_to: "POST /campus-recruiting/intern-projects/{id}/project-assignments"
  - priority: 18
    category: state
    check: "ProjectAssignment status allows the transition: unassign/complete/intern-evaluations require ACTIVE; record-return-offer-outcome requires status IN {ACTIVE, COMPLETED} with return_offer_decision = EXTENDED and return_offer_outcome = NONE"
    error_id: ERR_ASSIGNMENT_STATE_FORBIDDEN
    http_status: 409
    applies_to: "project-assignment transitions"
  - priority: 19
    category: business_safety
    check: "Evaluator conflict of interest: employee.alma_mater_school_name must NOT equal (case-insensitive) the application's SchoolTarget.school_name"
    error_id: ERR_EVALUATOR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /campus-recruiting/interview-days/{id}/interview-slots"
  - priority: 20
    category: business_safety
    check: "Calibration gate: applications from CORE-tier schools require evaluator.calibrated = true"
    error_id: ERR_EVALUATOR_NOT_CALIBRATED
    http_status: 422
    applies_to: "POST /campus-recruiting/interview-days/{id}/interview-slots"
  - priority: 21
    category: business_safety
    check: "Segregation of duties: mentor_id must NOT equal the evaluator_id of any Evaluation submitted on any InterviewSlot of the application"
    error_id: ERR_MENTOR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /campus-recruiting/intern-projects/{id}/project-assignments"
  - priority: 22
    category: business_safety
    check: "Capability flags: slot booking requires employee.can_evaluate = true; mentor assignment requires employee.can_mentor = true"
    error_id: ERR_CAPABILITY_MISSING
    http_status: 422
    applies_to: "slot booking and project-assignment creation"
  - priority: 23
    category: business_temporal
    check: "Application submit requires application_open_at <= now <= application_close_at (both bounds inclusive)"
    error_id: ERR_APPLICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /campus-recruiting/seasons/{id}/applications"
  - priority: 24
    category: business_temporal
    check: "InterviewDay window containment: season.interview_window_start_at <= window_start_at and window_end_at <= season.interview_window_end_at"
    error_id: ERR_DAY_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /campus-recruiting/seasons/{id}/interview-days"
  - priority: 25
    category: business_temporal
    check: "Slot containment: day.window_start_at <= slot.start_at and slot.end_at <= day.window_end_at"
    error_id: ERR_SLOT_OUTSIDE_DAY_WINDOW
    http_status: 422
    applies_to: "POST /campus-recruiting/interview-days/{id}/interview-slots"
  - priority: 26
    category: business_temporal
    check: "Offer extend requires offer_window_open_at <= now <= offer_window_close_at (both bounds inclusive)"
    error_id: ERR_OFFER_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /campus-recruiting/offers/{id}/extend"
  - priority: 27
    category: business_temporal
    check: "Accept with now > deadline_at: flip offer EXTENDED -> EXPIRED (with conditional application cascade) and reject"
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: "POST /campus-recruiting/offers/{id}/accept"
  - priority: 28
    category: business_temporal
    check: "Expire sweep requires now > deadline_at"
    error_id: ERR_OFFER_NOT_YET_EXPIRED
    http_status: 422
    applies_to: "POST /campus-recruiting/offers/{id}/expire"
  - priority: 29
    category: business_temporal
    check: "FINAL intern evaluation requires an existing MID evaluation on the same assignment"
    error_id: ERR_MID_EVALUATION_REQUIRED
    http_status: 422
    applies_to: "POST /campus-recruiting/project-assignments/{id}/intern-evaluations"
  - priority: 30
    category: business_temporal
    check: "Assignment completion requires an existing FINAL intern evaluation"
    error_id: ERR_FINAL_EVALUATION_REQUIRED
    http_status: 422
    applies_to: "POST /campus-recruiting/project-assignments/{id}/complete"
  - priority: 31
    category: business_constraint
    check: "Candidate email globally unique (case-insensitive)"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /campus-recruiting/candidates"
  - priority: 32
    category: business_constraint
    check: "One application per (candidate_id, season_id)"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /campus-recruiting/seasons/{id}/applications"
  - priority: 33
    category: business_constraint
    check: "School application cap: COUNT(applications of this school in this season with status NOT IN {SCREENED_OUT, WITHDRAWN}) >= application_cap rejects a new submission"
    error_id: ERR_SCHOOL_APPLICATION_CAP_REACHED
    http_status: 422
    applies_to: "POST /campus-recruiting/seasons/{id}/applications"
  - priority: 34
    category: business_referential
    check: "Referenced SchoolTarget must have status ACTIVE (applications, campus events)"
    error_id: ERR_SCHOOL_DROPPED
    http_status: 422
    applies_to: "POST /campus-recruiting/seasons/{id}/applications and POST /campus-recruiting/seasons/{id}/campus-events"
  - priority: 35
    category: business_constraint
    check: "Screen decision SHORTLIST requires screening_score_final >= season.shortlist_score_threshold"
    error_id: ERR_SCREENING_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /campus-recruiting/applications/{id}/screen"
  - priority: 36
    category: business_constraint
    check: "CampusEvent half-open overlap: reject when the new [start_at, end_at) intersects any existing event of the SAME school_target with status IN {SCHEDULED, COMPLETED}; touching endpoints (a.end_at = b.start_at) are allowed"
    error_id: ERR_EVENT_TIME_OVERLAP
    http_status: 409
    applies_to: "POST /campus-recruiting/seasons/{id}/campus-events"
  - priority: 37
    category: business_constraint
    check: "Candidate schedule overlap: reject when the new slot's [start_at, end_at) intersects any existing BOOKED slot of the same application (half-open, any day)"
    error_id: ERR_CANDIDATE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /campus-recruiting/interview-days/{id}/interview-slots"
  - priority: 38
    category: business_constraint
    check: "Evaluator buffered overlap: reject when the gap between the new slot and any existing BOOKED or COMPLETED slot of the same evaluator on the same day is < EVALUATOR_BUFFER_MINUTES (gap = max(0, max(start2-end1, start1-end2))); gap exactly = 15 minutes is allowed"
    error_id: ERR_EVALUATOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /campus-recruiting/interview-days/{id}/interview-slots"
  - priority: 39
    category: business_constraint
    check: "Day capacity: InterviewDay.booked_count >= capacity rejects a new booking; also evaluator daily load COUNT(BOOKED/COMPLETED slots of evaluator on the day) >= daily_slot_limit rejects"
    error_id: ERR_DAY_AT_CAPACITY
    http_status: 422
    applies_to: "POST /campus-recruiting/interview-days/{id}/interview-slots"
  - priority: 40
    category: business_constraint
    check: "At most one Offer per application"
    error_id: ERR_OFFER_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /campus-recruiting/applications/{id}/offers"
  - priority: 41
    category: business_constraint
    check: "Deadline extension cap: offer.extension_hours_granted + additional_hours <= season.max_extension_hours (equality allowed)"
    error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /campus-recruiting/offers/{id}/extend-deadline"
  - priority: 42
    category: business_constraint
    check: "Project capacity: InternProject.assigned_count >= capacity rejects a new assignment"
    error_id: ERR_PROJECT_AT_CAPACITY
    http_status: 422
    applies_to: "POST /campus-recruiting/intern-projects/{id}/project-assignments"
  - priority: 43
    category: business_constraint
    check: "Mentor capacity: employee.assigned_intern_count >= employee.max_interns rejects a new assignment"
    error_id: ERR_MENTOR_AT_CAPACITY
    http_status: 422
    applies_to: "POST /campus-recruiting/intern-projects/{id}/project-assignments"
  - priority: 44
    category: business_constraint
    check: "At most one ProjectAssignment per application"
    error_id: ERR_ASSIGNMENT_EXISTS
    http_status: 409
    applies_to: "POST /campus-recruiting/intern-projects/{id}/project-assignments"
  - priority: 45
    category: business_constraint
    check: "At most one InternEvaluation per (project_assignment_id, eval_type)"
    error_id: ERR_EVALUATION_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /campus-recruiting/project-assignments/{id}/intern-evaluations"
  - priority: 46
    category: business_fiscal
    check: "Stipend budget: season.stipend_reserved_cents + offer.stipend_amount_cents > season.stipend_budget_cents rejects the accept (equality allowed)"
    error_id: ERR_STIPEND_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /campus-recruiting/offers/{id}/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/campus-recruiting/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [RecruitingAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # ---- RecruitingSeason ----
  - method: POST
    path: "/campus-recruiting/seasons"
    description: "Create a recruiting season (starts DRAFT)"
    roles: [RecruitingAdmin]
    code: 201
    input: [name, application_open_at, application_close_at, interview_window_start_at, interview_window_end_at, offer_window_open_at, offer_window_close_at, shortlist_score_threshold, stipend_budget_cents, "exploding_offer_hours_default?", "deadline_policy_mode?", "max_extension_hours?"]
    output: RecruitingSeason
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons"
    description: "List seasons (paginated, filterable by status)"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RecruitingSeason[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons/{id}"
    description: "Get one season including ledger and counters"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: RecruitingSeason
    side_effects: []
  - method: POST
    path: "/campus-recruiting/seasons/{id}/advance"
    description: "Advance the season one epoch: DRAFT->OPEN->SELECTION->OFFER_PERIOD->INTERN_ACTIVE"
    roles: [RecruitingAdmin]
    code: 200
    input: []
    output: RecruitingSeason
    side_effects: ["season transition per state machine; increments season.version by 1"]
  - method: POST
    path: "/campus-recruiting/seasons/{id}/close"
    description: "Close the season (INTERN_ACTIVE->CLOSED) with offer-expiry and stipend-release cascades"
    roles: [RecruitingAdmin]
    code: 200
    input: []
    output: RecruitingSeason
    side_effects: ["EXTENDED offers -> EXPIRED; their OFFER_PENDING applications -> EXPIRED; RESERVED disbursements -> RELEASED; stipend_reserved_cents decremented per release; increments season.version by 1"]
  - method: GET
    path: "/campus-recruiting/seasons/{id}/conversion-summary"
    description: "Computed conversion funnel: counters plus provisional/final conversion rates"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: { applications_total_count: integer, offers_extended_count: integer, offers_accepted_count: integer, completed_assignments_count: integer, return_offers_extended_count: integer, return_offers_accepted_count: integer, stipend_budget_cents: integer, stipend_reserved_cents: integer, stipend_disbursed_cents: integer, conversion_rate_provisional: number, conversion_rate_final: number }
    side_effects: []

  # ---- SchoolTarget ----
  - method: POST
    path: "/campus-recruiting/seasons/{id}/school-targets"
    description: "Add a school to the season target list"
    roles: [RecruitingAdmin]
    code: 201
    input: [school_name, tier, application_cap, stipend_region, "exploding_offer_hours_override?"]
    output: SchoolTarget
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons/{id}/school-targets"
    description: "List school targets of a season"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: SchoolTarget[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/school-targets/{id}"
    description: "Get one school target"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: SchoolTarget
    side_effects: []
  - method: PATCH
    path: "/campus-recruiting/school-targets/{id}"
    description: "Edit tier/cap/region/override with OCC on the school target's version"
    roles: [RecruitingAdmin]
    code: 200
    input: ["tier?", "application_cap?", "stipend_region?", "exploding_offer_hours_override?", expected_school_target_version]
    output: SchoolTarget
    side_effects: ["increments SchoolTarget.version by 1"]
  - method: POST
    path: "/campus-recruiting/school-targets/{id}/drop"
    description: "Drop a school from the target list; cancels its SCHEDULED campus events"
    roles: [RecruitingAdmin]
    code: 200
    input: []
    output: SchoolTarget
    side_effects: ["SCHEDULED CampusEvents of this school -> CANCELLED; increments SchoolTarget.version by 1"]

  # ---- CampusEvent ----
  - method: POST
    path: "/campus-recruiting/seasons/{id}/campus-events"
    description: "Schedule a campus event with half-open overlap check per school"
    roles: [RecruitingAdmin, Recruiter]
    code: 201
    input: [school_target_id, event_type, start_at, end_at]
    output: CampusEvent
    side_effects: []
  - method: GET
    path: "/campus-recruiting/campus-events/{id}"
    description: "Get one campus event"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: CampusEvent
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons/{id}/campus-events"
    description: "List campus events of a season (filterable)"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["school_target_id?", "event_type?", "status?", "limit?", "offset?"]
    output: CampusEvent[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/school-targets/{id}/campus-events"
    description: "List campus events of one school target"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CampusEvent[]
    side_effects: []
  - method: POST
    path: "/campus-recruiting/campus-events/{id}/complete"
    description: "Mark an event COMPLETED and record collected resumes"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: [resume_count]
    output: CampusEvent
    side_effects: ["resume_count stored; increments CampusEvent.version by 1"]
  - method: POST
    path: "/campus-recruiting/campus-events/{id}/cancel"
    description: "Cancel a scheduled event"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: CampusEvent
    side_effects: ["increments CampusEvent.version by 1"]

  # ---- Candidate ----
  - method: POST
    path: "/campus-recruiting/candidates"
    description: "Register a candidate (global identity across seasons)"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, expected_graduation_date]
    output: Candidate
    side_effects: []
  - method: GET
    path: "/campus-recruiting/candidates/{id}"
    description: "Get one candidate (Candidate may read only its own id)"
    roles: [RecruitingAdmin, Recruiter, Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: []
  - method: GET
    path: "/campus-recruiting/candidates/{id}/applications"
    description: "List a candidate's applications across seasons"
    roles: [RecruitingAdmin, Recruiter, Candidate]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/campus-recruiting/seasons/{id}/applications"
    description: "Submit an application; computes screening_score_provisional"
    roles: [Candidate]
    code: 201
    input: [candidate_id, school_target_id, "prior_internship_count?", "referral_flag?", relocation_distance_miles]
    output: Application
    side_effects: ["screening_score_provisional computed (provisional variant); season.applications_total_count incremented by +1"]
  - method: GET
    path: "/campus-recruiting/applications/{id}"
    description: "Get one application"
    roles: [RecruitingAdmin, Recruiter, Candidate]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons/{id}/applications"
    description: "List applications of a season (filterable)"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["school_target_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/school-targets/{id}/applications"
    description: "List applications from one school target"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/campus-recruiting/applications/{id}/screen"
    description: "Screening decision; computes and stores screening_score_final"
    roles: [Recruiter]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["screening_score_final computed (final variant); SUBMITTED -> SHORTLISTED or SCREENED_OUT"]
  - method: POST
    path: "/campus-recruiting/applications/{id}/reject"
    description: "Reject an application pending decision"
    roles: [Recruiter]
    code: 200
    input: []
    output: Application
    side_effects: ["DECISION_PENDING -> REJECTED"]
  - method: POST
    path: "/campus-recruiting/applications/{id}/withdraw"
    description: "Candidate withdraws; cancels booked slots and declines any extended offer"
    roles: [Candidate]
    code: 200
    input: []
    output: Application
    side_effects: ["ordered withdraw cascade (offer DECLINED with app-flip suppressed; BOOKED slots CANCELLED with booked_count decrement; application WITHDRAWN last)"]

  # ---- Employee (evaluator + mentor) ----
  - method: POST
    path: "/campus-recruiting/seasons/{id}/employees"
    description: "Register a staff member (evaluator and/or mentor) for the season"
    roles: [RecruitingAdmin]
    code: 201
    input: [full_name, email, "alma_mater_school_name?", "daily_slot_limit?", "max_interns?", "can_evaluate?", "can_mentor?", "calibrated?"]
    output: Employee
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons/{id}/employees"
    description: "List staff of a season"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/employees/{id}"
    description: "Get one staff member"
    roles: [RecruitingAdmin, Recruiter, Evaluator, Mentor]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/campus-recruiting/employees/{id}/interview-slots"
    description: "List interview slots assigned to this evaluator"
    roles: [RecruitingAdmin, Recruiter, Evaluator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterviewSlot[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/employees/{id}/project-assignments"
    description: "List project assignments mentored by this staff member"
    roles: [RecruitingAdmin, Recruiter, Mentor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProjectAssignment[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/employees/{id}/evaluations"
    description: "List interview evaluations submitted by this evaluator"
    roles: [RecruitingAdmin, Recruiter, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: Evaluation[]
    side_effects: []

  # ---- InterviewDay ----
  - method: POST
    path: "/campus-recruiting/seasons/{id}/interview-days"
    description: "Create an interview day; window must be contained in the season interview window"
    roles: [RecruitingAdmin, Recruiter]
    code: 201
    input: [window_start_at, window_end_at, capacity]
    output: InterviewDay
    side_effects: []
  - method: GET
    path: "/campus-recruiting/interview-days/{id}"
    description: "Get one interview day"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: InterviewDay
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons/{id}/interview-days"
    description: "List interview days of a season"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterviewDay[]
    side_effects: []
  - method: POST
    path: "/campus-recruiting/interview-days/{id}/lock"
    description: "Lock a day (no more bookings or cancels)"
    roles: [Recruiter]
    code: 200
    input: []
    output: InterviewDay
    side_effects: ["OPEN -> LOCKED; increments InterviewDay.version by 1"]
  - method: POST
    path: "/campus-recruiting/interview-days/{id}/complete"
    description: "Complete a locked day once all slots are terminal"
    roles: [Recruiter]
    code: 200
    input: []
    output: InterviewDay
    side_effects: ["LOCKED -> COMPLETED; increments InterviewDay.version by 1"]
  - method: GET
    path: "/campus-recruiting/interview-days/{id}/interview-slots"
    description: "List slots of an interview day"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterviewSlot[]
    side_effects: []

  # ---- InterviewSlot ----
  - method: POST
    path: "/campus-recruiting/interview-days/{id}/interview-slots"
    description: "Book an interview slot (containment, COI, calibration, overlap, capacity checks)"
    roles: [Recruiter]
    code: 201
    input: [application_id, evaluator_id, start_at, end_at]
    output: InterviewSlot
    side_effects: ["InterviewDay.booked_count incremented by 1; Application SHORTLISTED -> INTERVIEW_SCHEDULED when first slot"]
  - method: GET
    path: "/campus-recruiting/interview-slots/{id}"
    description: "Get one interview slot"
    roles: [RecruitingAdmin, Recruiter, Evaluator]
    code: 200
    input: []
    output: InterviewSlot
    side_effects: []
  - method: POST
    path: "/campus-recruiting/interview-slots/{id}/cancel"
    description: "Cancel a booked slot (frees the seat)"
    roles: [Recruiter]
    code: 200
    input: []
    output: InterviewSlot
    side_effects: ["BOOKED -> CANCELLED; InterviewDay.booked_count decremented by 1; application auto-flip rule re-evaluated"]
  - method: POST
    path: "/campus-recruiting/interview-slots/{id}/no-show"
    description: "Mark a booked slot NO_SHOW (seat stays consumed)"
    roles: [Recruiter]
    code: 200
    input: []
    output: InterviewSlot
    side_effects: ["BOOKED -> NO_SHOW; booked_count unchanged; application auto-flip rule re-evaluated"]
  - method: GET
    path: "/campus-recruiting/applications/{id}/interview-slots"
    description: "List interview slots of an application"
    roles: [RecruitingAdmin, Recruiter, Candidate]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterviewSlot[]
    side_effects: []

  # ---- Evaluation ----
  - method: POST
    path: "/campus-recruiting/interview-slots/{id}/evaluations"
    description: "Submit the evaluation for a slot (evaluator owner only); completes the slot"
    roles: [Evaluator]
    code: 201
    input: [score, recommendation]
    output: Evaluation
    side_effects: ["InterviewSlot BOOKED -> COMPLETED; application auto-flip rule re-evaluated"]
  - method: PUT
    path: "/campus-recruiting/evaluations/{id}"
    description: "Revise an evaluation while its interview day is still OPEN"
    roles: [Evaluator]
    code: 200
    input: ["score?", "recommendation?"]
    output: Evaluation
    side_effects: ["increments Evaluation.version by 1"]
  - method: GET
    path: "/campus-recruiting/evaluations/{id}"
    description: "Get one evaluation"
    roles: [RecruitingAdmin, Recruiter, Evaluator]
    code: 200
    input: []
    output: Evaluation
    side_effects: []
  - method: GET
    path: "/campus-recruiting/interview-slots/{id}/evaluations"
    description: "List evaluations of a slot (0 or 1 element)"
    roles: [RecruitingAdmin, Recruiter, Evaluator]
    code: 200
    input: ["limit?", "offset?"]
    output: Evaluation[]
    side_effects: []

  # ---- Offer ----
  - method: POST
    path: "/campus-recruiting/applications/{id}/offers"
    description: "Create a DRAFT offer for a DECISION_PENDING application (one per application)"
    roles: [Recruiter]
    code: 201
    input: [weekly_rate_cents, duration_weeks, "sign_on_bonus_cents?"]
    output: Offer
    side_effects: ["total_comp_cents computed"]
  - method: GET
    path: "/campus-recruiting/offers/{id}"
    description: "Get one offer"
    roles: [RecruitingAdmin, Recruiter, Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/campus-recruiting/applications/{id}/offers"
    description: "List offers of an application (0 or 1 element)"
    roles: [RecruitingAdmin, Recruiter, Candidate]
    code: 200
    input: ["limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: PUT
    path: "/campus-recruiting/offers/{id}"
    description: "Revise offer terms (DRAFT or DECLINED -> DRAFT) with OCC on the offer version"
    roles: [Recruiter]
    code: 200
    input: ["weekly_rate_cents?", "duration_weeks?", "sign_on_bonus_cents?", expected_offer_version]
    output: Offer
    side_effects: ["total_comp_cents recomputed; DECLINED -> DRAFT; increments Offer.version by 1"]
  - method: POST
    path: "/campus-recruiting/offers/{id}/extend"
    description: "Extend the offer: pins policy snapshot, computes exploding deadline, stipend, comp"
    roles: [Recruiter]
    code: 200
    input: []
    output: Offer
    side_effects: ["DRAFT -> EXTENDED; policy_hours_snapshot/extended_at/deadline_at/stipend_amount_cents computed; Application DECISION_PENDING -> OFFER_PENDING; season.offers_extended_count incremented by +1"]
  - method: POST
    path: "/campus-recruiting/offers/{id}/accept"
    description: "Candidate accepts; creates the RESERVED stipend disbursement"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: ["EXTENDED -> ACCEPTED (lazy EXPIRED flip first when now > deadline_at); StipendDisbursement created RESERVED; season.stipend_reserved_cents incremented; Application OFFER_PENDING -> ACCEPTED; season.offers_accepted_count incremented by +1"]
  - method: POST
    path: "/campus-recruiting/offers/{id}/decline"
    description: "Candidate declines; application returns to DECISION_PENDING"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: ["EXTENDED -> DECLINED; conditional Application OFFER_PENDING -> DECISION_PENDING"]
  - method: POST
    path: "/campus-recruiting/offers/{id}/rescind"
    description: "Rescind an extended offer; application returns to DECISION_PENDING"
    roles: [Recruiter, RecruitingAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["EXTENDED -> RESCINDED; conditional Application OFFER_PENDING -> DECISION_PENDING"]
  - method: POST
    path: "/campus-recruiting/offers/{id}/expire"
    description: "Expire an extended offer once its deadline has passed"
    roles: [Recruiter, RecruitingAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: ["EXTENDED -> EXPIRED; conditional Application OFFER_PENDING -> EXPIRED"]
  - method: POST
    path: "/campus-recruiting/offers/{id}/extend-deadline"
    description: "Grant additional hours on an exploding offer (capped by season.max_extension_hours)"
    roles: [RecruitingAdmin]
    code: 200
    input: [additional_hours]
    output: Offer
    side_effects: ["extension_hours_granted += additional_hours; deadline_at shifted by additional_hours wall-clock hours"]

  # ---- StipendDisbursement ----
  - method: GET
    path: "/campus-recruiting/offers/{id}/stipend-disbursements"
    description: "List stipend disbursements of an offer (0 or 1 element)"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["limit?", "offset?"]
    output: StipendDisbursement[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/stipend-disbursements/{id}"
    description: "Get one stipend disbursement"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: StipendDisbursement
    side_effects: []
  - method: POST
    path: "/campus-recruiting/stipend-disbursements/{id}/disburse"
    description: "Disburse a RESERVED stipend once the season is INTERN_ACTIVE"
    roles: [Recruiter, RecruitingAdmin]
    code: 200
    input: []
    output: StipendDisbursement
    side_effects: ["RESERVED -> DISBURSED; season.stipend_reserved_cents -= amount_cents; season.stipend_disbursed_cents += amount_cents"]

  # ---- InternProject ----
  - method: POST
    path: "/campus-recruiting/seasons/{id}/intern-projects"
    description: "Create an intern project with a seat capacity"
    roles: [RecruitingAdmin, Recruiter]
    code: 201
    input: [title, capacity]
    output: InternProject
    side_effects: []
  - method: GET
    path: "/campus-recruiting/seasons/{id}/intern-projects"
    description: "List intern projects of a season"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InternProject[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/intern-projects/{id}"
    description: "Get one intern project"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: []
    output: InternProject
    side_effects: []
  - method: POST
    path: "/campus-recruiting/intern-projects/{id}/close"
    description: "Close a project to new assignments"
    roles: [Recruiter]
    code: 200
    input: []
    output: InternProject
    side_effects: ["OPEN -> CLOSED; increments InternProject.version by 1"]
  - method: GET
    path: "/campus-recruiting/intern-projects/{id}/project-assignments"
    description: "List assignments of a project"
    roles: [RecruitingAdmin, Recruiter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProjectAssignment[]
    side_effects: []

  # ---- ProjectAssignment ----
  - method: POST
    path: "/campus-recruiting/intern-projects/{id}/project-assignments"
    description: "Assign an intern (ACCEPTED application) to a project with a mentor; capacity + SoD checks"
    roles: [Recruiter]
    code: 201
    input: [application_id, mentor_id]
    output: ProjectAssignment
    side_effects: ["InternProject.assigned_count incremented by 1; Employee.assigned_intern_count incremented by 1"]
  - method: GET
    path: "/campus-recruiting/project-assignments/{id}"
    description: "Get one project assignment"
    roles: [RecruitingAdmin, Recruiter, Mentor]
    code: 200
    input: []
    output: ProjectAssignment
    side_effects: []
  - method: GET
    path: "/campus-recruiting/applications/{id}/project-assignments"
    description: "List project assignments of an application (0 or 1 element)"
    roles: [RecruitingAdmin, Recruiter, Candidate]
    code: 200
    input: ["limit?", "offset?"]
    output: ProjectAssignment[]
    side_effects: []
  - method: POST
    path: "/campus-recruiting/project-assignments/{id}/unassign"
    description: "Unassign an intern; frees project and mentor capacity"
    roles: [Recruiter]
    code: 200
    input: []
    output: ProjectAssignment
    side_effects: ["ACTIVE -> UNASSIGNED; InternProject.assigned_count decremented by 1; Employee.assigned_intern_count decremented by 1"]
  - method: POST
    path: "/campus-recruiting/project-assignments/{id}/complete"
    description: "Complete an internship once the FINAL evaluation exists"
    roles: [Recruiter]
    code: 200
    input: []
    output: ProjectAssignment
    side_effects: ["ACTIVE -> COMPLETED; season.completed_assignments_count incremented by +1; candidate becomes alumnus"]
  - method: POST
    path: "/campus-recruiting/project-assignments/{id}/intern-evaluations"
    description: "Mentor submits a MID or FINAL intern evaluation; FINAL computes the return-offer decision"
    roles: [Mentor]
    code: 201
    input: [eval_type, rating, would_rehire]
    output: InternEvaluation
    side_effects: ["on FINAL: ProjectAssignment.return_offer_decision computed via return_offer_decision; when EXTENDED, season.return_offers_extended_count incremented by +1"]
  - method: GET
    path: "/campus-recruiting/project-assignments/{id}/intern-evaluations"
    description: "List intern evaluations of an assignment"
    roles: [RecruitingAdmin, Recruiter, Mentor]
    code: 200
    input: ["limit?", "offset?"]
    output: InternEvaluation[]
    side_effects: []
  - method: GET
    path: "/campus-recruiting/intern-evaluations/{id}"
    description: "Get one intern evaluation"
    roles: [RecruitingAdmin, Recruiter, Mentor]
    code: 200
    input: []
    output: InternEvaluation
    side_effects: []
  - method: POST
    path: "/campus-recruiting/project-assignments/{id}/record-return-offer-outcome"
    description: "Record the candidate's response to a return offer"
    roles: [Recruiter]
    code: 200
    input: [outcome]
    output: ProjectAssignment
    side_effects: ["return_offer_outcome set; when ACCEPTED, season.return_offers_accepted_count incremented by +1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or entity-backed ownership check failed (Candidate/Evaluator/Mentor acting on another principal's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource id does not exist (validated left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid type, invalid enum member, or range violation (score/rating outside 1..5, end_at <= start_at, negative amounts)" }
  - { id: ERR_STALE_SCHOOL_TARGET_VERSION, http: 412, condition: "expected_school_target_version does not match the SchoolTarget's current version" }
  - { id: ERR_STALE_OFFER_VERSION, http: 412, condition: "expected_offer_version does not match the Offer's current version" }
  - { id: ERR_SEASON_POSTURE_FORBIDDEN, http: 409, condition: "Season status does not permit this operation (per-endpoint posture gate)" }
  - { id: ERR_SEASON_ADVANCE_BLOCKED, http: 409, condition: "Season advance precondition failed (no ACTIVE school target; clock not past application_close_at; SUBMITTED applications remain; EXTENDED offers remain)" }
  - { id: ERR_SEASON_CLOSE_BLOCKED, http: 409, condition: "Season close attempted while ACTIVE ProjectAssignments remain" }
  - { id: ERR_APPLICATION_STATE_FORBIDDEN, http: 409, condition: "Application status does not permit the requested transition or dependent operation" }
  - { id: ERR_OFFER_STATE_FORBIDDEN, http: 409, condition: "Offer status does not permit the requested transition" }
  - { id: ERR_DAY_STATE_FORBIDDEN, http: 409, condition: "InterviewDay status does not permit the operation (book/cancel need OPEN; complete needs LOCKED with all slots terminal)" }
  - { id: ERR_SLOT_STATE_FORBIDDEN, http: 409, condition: "InterviewSlot is not BOOKED" }
  - { id: ERR_EVENT_STATE_FORBIDDEN, http: 409, condition: "CampusEvent is not SCHEDULED" }
  - { id: ERR_DISBURSEMENT_STATE_FORBIDDEN, http: 409, condition: "StipendDisbursement is not RESERVED" }
  - { id: ERR_PROJECT_STATE_FORBIDDEN, http: 409, condition: "InternProject is not OPEN" }
  - { id: ERR_ASSIGNMENT_STATE_FORBIDDEN, http: 409, condition: "ProjectAssignment status or return-offer fields do not permit the operation" }
  - { id: ERR_EVALUATOR_CONFLICT_OF_INTEREST, http: 422, condition: "Evaluator's alma_mater_school_name equals (case-insensitive) the applicant's school name" }
  - { id: ERR_EVALUATOR_NOT_CALIBRATED, http: 422, condition: "CORE-tier school's candidate assigned to an uncalibrated evaluator" }
  - { id: ERR_MENTOR_CONFLICT_OF_INTEREST, http: 422, condition: "Proposed mentor previously submitted an evaluation for this application (segregation of duties)" }
  - { id: ERR_CAPABILITY_MISSING, http: 422, condition: "Employee lacks the required capability flag (can_evaluate / can_mentor)" }
  - { id: ERR_APPLICATION_WINDOW_CLOSED, http: 422, condition: "Application submitted outside [application_open_at, application_close_at]" }
  - { id: ERR_DAY_OUTSIDE_WINDOW, http: 422, condition: "InterviewDay window not contained in the season interview window" }
  - { id: ERR_SLOT_OUTSIDE_DAY_WINDOW, http: 422, condition: "Slot interval not contained in the interview day's window" }
  - { id: ERR_OFFER_WINDOW_CLOSED, http: 422, condition: "Offer extend attempted outside [offer_window_open_at, offer_window_close_at]" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "Accept attempted after deadline_at; offer flipped to EXPIRED" }
  - { id: ERR_OFFER_NOT_YET_EXPIRED, http: 422, condition: "Expire sweep attempted while now <= deadline_at" }
  - { id: ERR_MID_EVALUATION_REQUIRED, http: 422, condition: "FINAL intern evaluation submitted before any MID evaluation exists" }
  - { id: ERR_FINAL_EVALUATION_REQUIRED, http: 422, condition: "Assignment completion attempted before any FINAL intern evaluation exists" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Candidate email already registered" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Candidate already has an application in this season" }
  - { id: ERR_SCHOOL_APPLICATION_CAP_REACHED, http: 422, condition: "School's non-terminal application count has reached application_cap" }
  - { id: ERR_SCHOOL_DROPPED, http: 422, condition: "Referenced SchoolTarget has status DROPPED" }
  - { id: ERR_SCREENING_THRESHOLD_NOT_MET, http: 422, condition: "SHORTLIST decision with screening_score_final below the season threshold" }
  - { id: ERR_EVENT_TIME_OVERLAP, http: 409, condition: "Campus event interval intersects another event of the same school (half-open semantics; touching allowed)" }
  - { id: ERR_CANDIDATE_SCHEDULE_CONFLICT, http: 409, condition: "Candidate already holds a BOOKED slot overlapping the requested interval" }
  - { id: ERR_EVALUATOR_SCHEDULE_CONFLICT, http: 409, condition: "Evaluator would have less than the 15-minute buffer between slots on the same day" }
  - { id: ERR_DAY_AT_CAPACITY, http: 422, condition: "InterviewDay.booked_count >= capacity or evaluator daily_slot_limit reached" }
  - { id: ERR_OFFER_ALREADY_EXISTS, http: 409, condition: "An Offer already exists for this application" }
  - { id: ERR_EXTENSION_CAP_EXCEEDED, http: 422, condition: "extension_hours_granted + additional_hours exceeds season.max_extension_hours" }
  - { id: ERR_PROJECT_AT_CAPACITY, http: 422, condition: "InternProject.assigned_count >= capacity" }
  - { id: ERR_MENTOR_AT_CAPACITY, http: 422, condition: "Mentor's assigned_intern_count >= max_interns" }
  - { id: ERR_ASSIGNMENT_EXISTS, http: 409, condition: "Application already has a ProjectAssignment" }
  - { id: ERR_EVALUATION_ALREADY_SUBMITTED, http: 409, condition: "An InternEvaluation of this eval_type already exists for the assignment" }
  - { id: ERR_STIPEND_BUDGET_EXCEEDED, http: 422, condition: "season.stipend_reserved_cents + offer.stipend_amount_cents would exceed season.stipend_budget_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RecruitingAdmin
    description: "Program administrator; owns season configuration, target list, exploding-offer exceptions, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /campus-recruiting/seasons"
      - "POST /campus-recruiting/seasons/{id}/advance"
      - "POST /campus-recruiting/seasons/{id}/close"
      - "POST /campus-recruiting/seasons/{id}/school-targets"
      - "PATCH /campus-recruiting/school-targets/{id}"
      - "POST /campus-recruiting/school-targets/{id}/drop"
      - "POST /campus-recruiting/seasons/{id}/employees"
      - "POST /campus-recruiting/offers/{id}/extend-deadline"
      - "POST /campus-recruiting/_clock/set_current_utc"
    shared_operations:
      - "All list/read endpoints"
      - "Campus event create/complete/cancel"
      - "Interview day create"
      - "Offer rescind/expire"
      - "Stipend disburse"
      - "Intern project create"
  - name: Recruiter
    description: "University-recruiting operator; runs screening, interview logistics, offers, projects, and conversion recording"
    identity: "opaque"
    exclusive_operations:
      - "POST /campus-recruiting/applications/{id}/screen"
      - "POST /campus-recruiting/applications/{id}/reject"
      - "POST /campus-recruiting/interview-days/{id}/lock"
      - "POST /campus-recruiting/interview-days/{id}/complete"
      - "POST /campus-recruiting/interview-days/{id}/interview-slots"
      - "POST /campus-recruiting/interview-slots/{id}/cancel"
      - "POST /campus-recruiting/interview-slots/{id}/no-show"
      - "POST /campus-recruiting/applications/{id}/offers"
      - "PUT /campus-recruiting/offers/{id}"
      - "POST /campus-recruiting/offers/{id}/extend"
      - "POST /campus-recruiting/intern-projects/{id}/close"
      - "POST /campus-recruiting/intern-projects/{id}/project-assignments"
      - "POST /campus-recruiting/project-assignments/{id}/unassign"
      - "POST /campus-recruiting/project-assignments/{id}/complete"
      - "POST /campus-recruiting/project-assignments/{id}/record-return-offer-outcome"
    shared_operations:
      - "All list/read endpoints"
      - "Campus event create/complete/cancel"
      - "Interview day create"
      - "Offer rescind/expire"
      - "Stipend disburse"
      - "Intern project create"
  - name: Candidate
    description: "Student applicant; self-service application, withdrawal, and offer response"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /campus-recruiting/seasons/{id}/applications"
      - "POST /campus-recruiting/applications/{id}/withdraw"
      - "POST /campus-recruiting/offers/{id}/accept"
      - "POST /campus-recruiting/offers/{id}/decline"
    shared_operations:
      - "Read own candidate record, own applications, own offers, own interview slots, own project assignments"
  - name: Evaluator
    description: "Staff interviewer; scores only interview slots assigned to them"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /campus-recruiting/interview-slots/{id}/evaluations"
      - "PUT /campus-recruiting/evaluations/{id}"
    shared_operations:
      - "Read own employee record, own interview slots, own evaluations"
  - name: Mentor
    description: "Staff mentor; evaluates only interns assigned to them"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /campus-recruiting/project-assignments/{id}/intern-evaluations"
    shared_operations:
      - "Read own employee record, own project assignments, own intern evaluations"
  - name: Anonymous
    description: "Unauthenticated public caller; candidate self-registration only"
    identity: "opaque"
    exclusive_operations:
      - "POST /campus-recruiting/candidates"
    shared_operations: []
