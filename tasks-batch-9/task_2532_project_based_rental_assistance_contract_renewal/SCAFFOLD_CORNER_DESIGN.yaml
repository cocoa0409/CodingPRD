              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_id: $.data.id, case_track: $.data.rent_track_status }
          trigger:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners II LP", tin: "27-3310011", contact_email: "agent2@cedarridge.example" }
              as: ContractAdministrator
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${property_id}", unit_number: "101", household_name: "Nakamura", annual_adjusted_income_cents: 900000, annual_gross_income_cents: 900000, family_size: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/tenant-households/${t1_id}/move-out"
