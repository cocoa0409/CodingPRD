              captures: { loc2: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-060031", railroad_code: "BNSF", road_authority_locality_id: "${loc1}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cx_id}", locality_id: "${loc1}", closure_type: "CLOSURE" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { ag: $.data.id }
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "PROPOSED" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "DOT_ACCEPTED" }
              as: RailSafetyOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "LOCALITY_RATIFIED" }
              as: LocalAuthority
              as_user_id: "${loc2}"
              captures: { err: $.data.error_id }
          assert:
            - "ratify by locality 2 -> ERR_LOCALITY_MISMATCH (403); agreement stays DOT_ACCEPTED"

      - name: responsibility_gap_and_mismatch
        claim_type: exclusive_operation_denied
        grounds: ["validations[priority=8]", "errors[ERR_RESPONSIBILITY_GAP]", "errors[ERR_RESPONSIBILITY_MISMATCH]"]
        distinguishing_aspect: "Work-order creation fails without an ACTIVE assignment (gap), and fails when the actor's party does not match the assigned responsible_party (mismatch); the matching road authority succeeds."
        test_recipe:
