        distinguishing_aspect: |
          Withdrawing a DRAFT submission with reason ABANDON must land review_status WITHDRAWN and
          make the submission read-only, so a following POST /submissions/{id}/correlations fails
          with ERR_SUBMISSION_STATE_INVALID (409) and the cycle's submission_count stays 0.
