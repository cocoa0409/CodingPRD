      - name: a_new_plan_may_supersede_a_draft_but_not_an_approved_plan
        claim_type: conditional_action
        grounds:
          - endpoints[POST /provost/academic-programs/{id}/teach-out-plans]
          - validations[priority=46]
          - errors[ERR_TEACH_OUT_IN_EFFECT]
          - state_machines.TeachOutPlan.DRAFT_to_SUPERSEDED
        distinguishing_aspect: |
          The identical create call is allowed or refused purely on the state of
          the plan already on the program: a DRAFT is silently superseded, an
          APPROVED plan blocks the write. Note also that every accepted create
          bumps the program's version, so the second author must re-read the
          program before echoing expected_program_version.
        test_recipe:
          setup:
            - "Fixture A program HIST-BA with a RATIFIED DISCONTINUATION decision (effective_term_index 4) and one DRAFT teach-out plan 3/4/5 already filed. The plan carries no guarantees and no students, so it is approvable as it stands."
