# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3199_fare_prediction_price_freeze_booking_guarantee_products
#
# Breadth probe. Every claim the §1.1-§1.7 surface declares that §1.8 does not
# already exercise. Non-applicable taxonomy rows are skipped without ceremony
# (no bulk action endpoint exists; no entity declares common_fields: false).
#
# Recurring fixture fragments (chained with `extend` semantics):
#   F1 = clock + Route R1 (8900/band/peak idx 4) + day-0 curve + Itinerary I1
#   F2 = F1 + DRAFT freeze + two activation calls + one 10000 observation
#   F3 = F2 + a CANCELLATION protection carrying freeze_id
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_route_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - endpoints.POST_/fare/routes
          - entities.Route
        distinguishing_aspect: "A route created with only the required commercial fields comes back 201 with posture ACTIVE, version 1, and system-stamped id / created_at / updated_at; posture is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Route.${r1_id}.posture == ACTIVE and posture_reason_code == \"\""
            - "Route.${r1_id}.version == 1 and war_chest_cents == 0 and reserved_exposure_cents == 0 and available_exposure_cents == 0"
            - "Route.${r1_id}.curve_published == false, peak_day_demand_multiplier == 1.0 and disclosure_version == 1"
            - "the payload omitted travel_class, volatility_index, hedge_ratio_pct and cancel_minimum_disruption, which default to ECO, 0.20, 0.60 and 0.30"
            - "the response meta carries api_request_id and api_request_timestamp"

      - name: corner_service_offsets_create_returns_fee_transit_snapshot
        claim_type: Creation
        grounds:
          - endpoints.POST_/fare/itineraries
          - entities.Itinerary
        distinguishing_aspect: "An itinerary created on a route that already has a published curve is populated with the curve-derived fields at creation, and its zero-state fields stay zero when no curve exists."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 has a day-0 curve [8200,9000,9600,11200,12800] and a second route R3 has no curve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "DEN", flight_number: "HA103", region: "WEST", base_fare_cents: 6400, fare_band_cents: [5000, 5600, 6200, 7000, 7600], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r3_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
          trigger:
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r3_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i9_id: $.data.id }
          assert:
            - "the response status is 201 for both creations"
            - "Itinerary.${i1_id}.travel_status == PLANNED and booking_date == 2026-09-01T00:00:00Z"
            - "Itinerary.${i1_id}.demand_curve_price_cents == 8200, each_day_disruption_fare_cents == 1171.78 and fare_tier_ceiling_cents == 30000"
            - "Itinerary.${i1_id}.listed_fare_cents == 0 and observed_fares_cents == [], because no live observation has been appended"
            - "Itinerary.${i9_id}.demand_curve_price_cents == 0 and each_day_disruption_fare_cents == 0 and fare_tier_ceiling_cents == 0"

      - name: corner_route_get_with_an_unknown_id_returns_route_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/fare/routes/{route_id}
          - errors.ERR_ROUTE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated route id on a path segment produces the entity-specific 404 ERR_ROUTE_NOT_FOUND rather than a generic not-found code."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No route has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fare/routes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OpsAgent
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the response status is 404 and response_type is error"
            - "the error_id is ERR_ROUTE_NOT_FOUND, not ERR_ITINERARY_NOT_FOUND or ERR_FREEZE_NOT_FOUND"
            - "the error body carries a non-empty message and the envelope still carries meta.api_request_id"

      - name: corner_routes_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/fare/routes
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three routes on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false, so total_count counts the filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d1" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "BOS", flight_number: "HA102", region: "WEST", base_fare_cents: 9100, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d2" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "ORD", destination_airport: "LHR", flight_number: "HA707", region: "MIDWEST", base_fare_cents: 13200, fare_band_cents: [9000, 12000, 15000, 17000, 19000], peak_price_day_index: 0, seats_left: 6, disclosure_headline: "d3" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fare/routes"
              payload: { limit: 2, offset: 0 }
              as: OpsAgent
          assert:
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /fare/routes?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /fare/routes?region=MIDWEST returns exactly 1 row, the ORD route"
            - "GET /fare/routes with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"
            - "response_type is array"

      - name: corner_route_create_with_allowed_fields_defaults_to_low_disruption_listing
        claim_type: Defaults
        grounds:
          - entities.Route.fields.cancel_minimum_disruption
          - entities.Route.fields.hedge_ratio_pct
          - endpoints.POST_/fare/routes
        distinguishing_aspect: "Omitting the four optional commercial fields yields their declared defaults, and supplying one of them overrides only that field."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "BOS", flight_number: "HA102", region: "WEST", base_fare_cents: 9100, fare_band_cents: [7000, 8000, 9000, 10000, 11000], hedge_ratio_pct: 0.9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
          assert:
            - "Route.${r1_id}.cancel_minimum_disruption == 0.30, hedge_ratio_pct == 0.60, protection_base_rate == 0.25, protection_floor_rate == 0.20, disruption_severity_index == 0.1429, default_disruption_probability == 0.25 and max_guarantee_exposure_cents == 50000"
            - "Route.${r2_id}.hedge_ratio_pct == 0.90 while every other optional field keeps its default"
            - "Route.${r1_id}.peak_day_demand_multiplier == 1.0"

      - name: corner_itinerary_derived_fields_are_zero_until_their_sources_exist
        claim_type: Computed Fields
        grounds:
          - entities.Itinerary.fields.each_day_disruption_fare_cents
          - entities.Itinerary.fields.fare_tier_ceiling_cents
          - endpoints.POST_/fare/itineraries
        distinguishing_aspect: "Every derived itinerary field starts at its declared zero state on a route with a curve published, and each becomes non-zero only after the observation or curve event that supplies its source."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 has a published curve so curve-derived fields are computable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
          trigger:
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10200, seats_left: 5 }
              as: OpsAgent
          assert:
            - "Itinerary.${i1_id}.each_day_disruption_fare_cents == 1171.78 and fare_tier_ceiling_cents == 30000 on a route whose curve has been published"
            - "Itinerary.${i1_id}.demand_curve_price_cents == 8200"
            - "Itinerary.${i1_id}.listed_fare_cents is still 0 before the observation and == 10200 after it"
            - "the derived fields are readable from the creation response, and no client-supplied value participates"

      - name: corner_itinerary_rejects_a_nonpositive_fare_or_a_bad_deposit_amount
        claim_type: Type Constraints
        grounds:
          - validations[priority=34]
          - errors.ERR_INVALID_REQUEST
          - entities.PriceFreeze.fields.deposit_cents
        distinguishing_aspect: "The amount ranges are enforced: a deposit below its floor and a fare below 1 are both rejected as malformed payloads."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 and itinerary I1 exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 99, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 0, seats_left: 9 }
              as: OpsAgent
              captures: { err2_id: $.data.error_id, err2_message: $.data.message }
          assert:
            - "the 99-cent deposit is rejected with ERR_INVALID_REQUEST at priority 34 because the floor is 100 cents"
            - "the zero-cent observation is rejected with ERR_INVALID_REQUEST at priority 34 because a fare must be at least 1 cent"
            - "PriceFreeze count for ${i1_id} is 0 and Itinerary.${i1_id}.observed_fares_cents == []"
            - "a 100-cent deposit and a 5000-cent deposit would both be accepted, so the range is inclusive at both ends"

      - name: corner_entity_foreign_keys_use_the_canonical_declaration_and_resolve
        claim_type: Parent Relationships
        grounds:
          - entities.Itinerary.fields.route_id
          - entities.ProtectionProduct.fields.freeze_id
          - endpoints.POST_/fare/itineraries
        distinguishing_aspect: "Every foreign key resolves through the declared parent and a child created against a mismatched parent is refused, so the entity graph is not merely decorative."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Routes R1 and R3 exist; itinerary I1 hangs off R1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "DEN", flight_number: "HA103", region: "WEST", base_fare_cents: 6400, fare_band_cents: [5000, 5600, 6200, 7000, 7600], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r3_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
          trigger:
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r3_id}", itinerary_id: "${i1_id}", fare_cents: 9000, seats_left: 9 }
              as: OpsAgent
              captures: { err_id: $.data.error_id, err_message: $.data.message }
          assert:
            - "the cross-route observation is rejected with ERR_ROUTE_ITINERARY_MISMATCH at priority 29"
            - "GET /fare/routes/${r1_id}/itineraries returns exactly 1 row, the itinerary on R1"
            - "GET /fare/itineraries?route_id=${r3_id} returns 0 rows"
            - "Itinerary.${i1_id}.route_id == ${r1_id} and the itinerary was never re-parented"

      - name: corner_price_freeze_computed_cap_and_tier_fields_ignore_input
        claim_type: Computed Fields
        grounds:
          - entities.PriceFreeze.fields.cap_cents
          - entities.PriceFreeze.fields.guaranteed_ceiling_cents
          - endpoints.POST_/fare/price-freezes
        distinguishing_aspect: "The freeze's cap and tier ceilings are server-derived from the route's base fare; a client that posts them has the posted values discarded."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 at base 8800, itinerary I1 on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8800, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id }
          assert:
            - "the creation response reports PriceFreeze.${f1_id}.cap_cents == 12320.00 and guaranteed_ceiling_cents == 30000 without any client input for either"
            - "PriceFreeze.${f1_id}.manifest_fare_cents == 8800 and firm_tier_ceiling_cents == 30000 and cap_tier_ceiling_cents == 30000"
            - "PriceFreeze.${f1_id}.status == DRAFT and freeze_date and freeze_expires_at are both null before activation"
            - "Itinerary.${i1_id}.guarantee_locked == true even though the freeze has not been activated"

      - name: corner_watch_subscription_is_the_child_of_its_itinerary_and_lists_both_ways
        claim_type: Parent Relationships
        grounds:
          - entities.WatchSubscription.fields.itinerary_id
          - endpoints.GET_/fare/watch-subscriptions
          - endpoints.POST_/fare/itineraries/{itinerary_id}/watch-subscription
        distinguishing_aspect: "The watch reaches its parent through the declared FK, and the filtered list discovers it from the itinerary id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with a curve, itinerary I1, watch W1 armed on I1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/watch-subscription"
              payload: { expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "GET /fare/watch-subscriptions"
              payload: { itinerary_id: "${i1_id}" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "the filtered list returns exactly 1 row and its id equals ${w1_id}"
            - "WatchSubscription.${w1_id}.itinerary_id == ${i1_id}"
            - "GET /fare/watch-subscriptions?itinerary_id=8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2 returns 0 rows"
            - "WatchSubscription.${w1_id}.expires_at == Itinerary.${i1_id}.departure_date"

      - name: corner_payment_allocations_are_an_order_preserving_audit_log
        claim_type: System Fields
        grounds:
          - entities.Payment.fields.allocations
          - entities.Payment.fields.refundable_remaining_cents
          - endpoints.POST_/fare/payments/{payment_id}/refunds
        distinguishing_aspect: "The allocation array is append-only and ordered by application instant, and every allocation debits the refundable balance so the array is the audit truth for the payment."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A captured DEPOSIT payment of 7500 on freeze F1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 7500, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id }
            - call: "POST /fare/payments"
              payload: { itinerary_id: "${i1_id}", payment_kind: "CHANGE_FEE", amount_cents: 2000, capture: true }
              as: OpsAgent
              captures: { p999_id: $.data.id }
          trigger:
            - call: "POST /fare/payments/${p999_id}/refunds"
              payload: { refund_cents: 500 }
              as: OpsAgent
            - call: "POST /fare/payments/${p999_id}/refunds"
              payload: { refund_cents: 1500 }
              as: OpsAgent
          assert:
            - "Payment.${p999_id}.allocations has 3 entries in application order: CHANGE_FEE 2000, REFUND 500, REFUND 1500"
            - "Payment.${p999_id}.refundable_remaining_cents == 0 and status == REFUNDED"
            - "a third refund of 1 cent is rejected with ERR_PAYMENT_OVER_ALLOCATED at priority 28, and the allocation array is unchanged"
            - "the sum of the REFUND allocations never exceeds the original amount_cents"

      - name: corner_hedging_position_get_returns_the_stored_mark_state
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/fare/hedging-positions/{position_id}
          - entities.HedgingPosition
        distinguishing_aspect: "A position's stored mark, pool binding and regression flag round-trip through GET exactly as the mark wrote them."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 in WEST with pool WEST-RP-1, and a position HP1 at hedge price 9000 marked to a projected cost of 7000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/risk-pools"
              payload: { region: "WEST", pool_code: "WEST-RP-1" }
              as: RiskAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/hedging-positions"
              payload: { route_id: "${r1_id}", coverage_date: "2026-09-15T00:00:00Z", hedge_price_cents: 9000, contract_quantity_cents: 500000, expected_route_version: "${r1_version}" }
              as: RiskAnalyst
              captures: { hp_id: $.data.id }
            - call: "POST /fare/hedging-positions/${hp_id}/marks"
              payload: { projected_day_cost_cents: 7000 }
              as: RiskAnalyst
          trigger:
            - call: "GET /fare/hedging-positions/${hp_id}"
              payload: {}
              as: RiskAnalyst
          assert:
            - "HedgingPosition.${hp_id}.hedge_price_cents == 9000 and projected_day_cost_cents == 7000"
            - "HedgingPosition.${hp_id}.mark_value_cents == 0 because the projected cost sits below the hedge price"
            - "HedgingPosition.${hp_id}.pool_id == ${pool_id} and status == HEDGED"
            - "HedgingPosition.${hp_id}.regression_reversed == false"
  # ===========================================================================
  - section: state_machines
    instances:

      - name: corner_itinerary_watching_to_planned_revert_on_wait
        claim_type: Valid Transition
        grounds:
          - state_machines.Itinerary.WATCHING_to_PLANNED
          - state_machines.WatchSubscription.NOTIFIED_to_WAIT
        distinguishing_aspect: "A WAIT evaluation returns the itinerary to PLANNED and disarms its watch, so the watching state is not sticky."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with a curve, itinerary I1 observed at 10000 so the tier ceiling of 30000 keeps reading WAIT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "POST /fare/itineraries/${i1_id}/watch-subscription"
              payload: { expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { w1_id: $.data.id }
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "Itinerary.${i1_id}.travel_status == PLANNED and watch_armed == false after the WAIT pass"
            - "WatchSubscription.${w1_id}.notification_status == WAIT and is not terminal"
            - "watch_armed can be re-armed later"
            - "Itinerary.${i1_id}.guarantee_locked is unchanged by the revert"

      - name: corner_itinerary_booked_is_terminal_and_refuses_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Itinerary.PLANNED_to_BOOKED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once BOOKED, a cancellation and a second booking are both refused, so BOOKED is a true terminal state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with seats_left 1 and a PLANNED itinerary I1 on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 1, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
            - call: "POST /fare/itineraries/${i1_id}/bookings"
              payload: {}
              as: Traveler
              as_user_id: "tv-mara"
          trigger:
            - call: "POST /fare/itineraries/${i1_id}/cancellations"
              payload: { cancel_reason: "CHANGED_MIND" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err_id: $.data.error_id, err_message: $.data.message }
            - call: "POST /fare/itineraries/${i1_id}/bookings"
              payload: {}
              as: Traveler
              as_user_id: "tv-mara"
              captures: { err2_id: $.data.error_id, err2_message: $.data.message }
          assert:
            - "the cancellation is rejected with ERR_INVALID_STATE at priority 8 and the booking is rejected the same way"
            - "Itinerary.${i1_id}.travel_status remains BOOKED after both refusals"
            - "Route.${r1_id}.seats_left remains 0, so neither refused call released a seat"
            - "Itinerary.${i1_id}.listed_fare_cents was stamped with the base fare at booking and is unchanged"

      - name: corner_price_observation_is_append_only_and_has_no_update_path
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PriceObservation.OBSERVED_to_OBSERVED
          - entities.Itinerary.fields.observed_fares_cents
          - endpoints.POST_/fare/price-observations
        distinguishing_aspect: "Every observation appends to the itinerary's ladder and re-stamps the latest fare, and no endpoint exists that mutates or deletes an observation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with a curve and a PLANNED itinerary I1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
          trigger:
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 9000, seats_left: 7 }
              as: OpsAgent
              captures: { obs_id: $.data.id }
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "GET /fare/price-observations"
              payload: { itinerary_id: "${i1_id}" }
              as: OpsAgent
          assert:
            - "Itinerary.${i1_id}.observed_fares_cents == [9000, 10000] in ascending observed_at order"
            - "Itinerary.${i1_id}.listed_fare_cents == 10000 and last_observed_fare_cents == 10000"
            - "GET /fare/price-observations?itinerary_id=${i1_id} returns 2 rows"
            - "no PATCH, PUT or DELETE route exists for a price observation, so the first observation at ${obs_id} is unmodified"

      - name: corner_demand_curve_publication_supersedes_in_place
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DemandCurve.PUBLISHED_to_PUBLISHED
          - entities.Route.fields.highest_curve_price_cents
        distinguishing_aspect: "Republishing a curve for the same route and date replaces the stored forecast in place rather than creating a second row, and the route's high-water price is the maximum across every curve the route has ever held."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with an itinerary I1 on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id }
          trigger:
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
              captures: { curve_a: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8300, 9100, 9700, 11300, 12900], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "GET /fare/demand-curves"
              payload: { route_id: "${r1_id}" }
              as: OpsAgent
          assert:
            - "the list returns exactly 1 row for the date 2026-09-01T00:00:00Z, whose id is ${curve_a}"
            - "DemandCurve.${curve_a}.each_day_prices_cents == [8300, 9100, 9700, 11300, 12900] after supersession"
            - "Route.${r1_id}.highest_curve_price_cents == 12900"
            - "Itinerary.${i1_id}.demand_curve_price_cents == 8300, re-derived on the supersession"

      - name: corner_route_posture_transitions_from_each_allowed_state
        claim_type: Valid Transition
        grounds:
          - state_machines.Route.ACTIVE_to_SURGE
          - state_machines.Route.SURGE_to_ACTIVE
          - state_machines.Route.ACTIVE_to_CLOSED
        distinguishing_aspect: "Each operator posture move is legal only from its declared source state, and the closed endpoint is reachable from several states rather than one."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1, plus the WEST pool so the regional re-derivation has something to read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/risk-pools"
              payload: { region: "WEST", pool_code: "WEST-RP-1" }
              as: RiskAnalyst
              captures: { pool_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "d" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
          trigger:
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "SURGE", posture_reason_code: "DEMAND_PEAK", expected_route_version: "${r1_version}" }
              as: PlatformAdmin
              captures: { r1_v2: $.data.version }
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "ACTIVE", posture_reason_code: "PEAK_PASSED", expected_route_version: "${r1_v2}" }
              as: PlatformAdmin
              captures: { r1_v3: $.data.version }
            - call: "POST /fare/routes/${r1_id}/posture-transitions"
              payload: { to_posture: "CLOSED", posture_reason_code: "ROUTE_RETIRED", expected_route_version: "${r1_v3}" }
              as: PlatformAdmin
          assert:
            - "the response data for each call carries the new posture in order: SURGE, then ACTIVE, then CLOSED"
            - "Route.${r1_id}.posture == CLOSED at the end and posture_reason_code == ROUTE_RETIRED"
            - "Route.${r1_id}.version advanced by exactly 3 across the chain"
            - "CLOSED is reported in the route's terminal_states, so no further posture move is accepted"

      - name: corner_price_freeze_cancellation_is_refused_from_claim_states
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PriceFreeze.FROZEN_to_CLAIM_PENDING
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A freeze that has reached CLAIM_PENDING cannot be cancelled directly; the claim must be withdrawn or rejected first, which is the sanctioned return arc."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1, itinerary I1, a FROZEN freeze F1, an observation of 14000 and a FILED claim C1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
