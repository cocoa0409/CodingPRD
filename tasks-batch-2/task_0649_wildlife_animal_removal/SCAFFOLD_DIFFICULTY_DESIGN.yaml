          - concurrency_rules[cancel-stale-work-order]
        distinguishing_aspect: |
          Conserved quantity = money (cents). At accept net_charged=provisional=26000; one trap
          SET makes performed_subtotal=12000; cancel refunds 14000 and settles net to 12000.
          Invariant: net_charged_cents (12000) + refund (14000) == provisional (26000).
