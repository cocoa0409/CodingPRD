              payload: { employee_id: "${ei1}", certification_level: "LEVEL_3", max_active_cases: 1 }
              as: ERManager
              captures: { inv1: $.data.id }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "COMPENSATION", severity: "LOW" }
              as: ERManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /er/cases"
              payload: { intake_channel_id: "${ch1}", reporter_employee_id: "${rep}", subject_employee_id: "${sub}", category: "COMPENSATION", severity: "LOW" }
              as: ERManager
              captures: { c2: $.data.id, c2_v: $.data.version }
          trigger:
            - call: "POST /er/cases/${c1}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c1_v}" }
              as: ERManager
            - call: "POST /er/cases/${c2}/assign"
              payload: { investigator_id: "${inv1}", expected_case_version: "${c2_v}" }
              as: ERManager
              captures: { err_id: $.data.error_id }
          assert:
            - "first assign succeeds: Case.${c1}.status == ASSIGNED"
            - "second assign rejected: error_id == ERR_CAPACITY_EXCEEDED"
            - "http status == 422"
            - "Case.${c2}.status remains TRIAGE"

      - name: reopen_third_time_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_REOPEN_LIMIT]
        distinguishing_aspect: "A case with reopen_count == 2 (two prior CLOSED -> REOPENED cycles, each driven back to CLOSED) rejects a third reopen with ERR_REOPEN_LIMIT."
        test_recipe:
