            - "the outcome depends only on the logical clock: both POSTs carry identical 10-day windows and identical claimed figures"

      - name: liquidated_damages_cap_boundary_on_service_commencement
        metric: "net_late_days * ld_daily_rate_cents against ld_cap_cents (5000000), a min() applied to the MONEY product"
        endpoint: "POST /ppp/concessions/{id}/certify-service-commencement"
        grounds:
          - calculations.liquidated_damages_late_commencement
          - entities.Concession.fields.ld_accrued_cents
          - state_machines.Concession.CONSTRUCTION_to_OPERATIONS
        distinguishing_aspect: |
          A fourth metric (a money product against a money cap) on a fourth endpoint. With
          rate 250000 and cap 5000000 the cap bites at exactly 20 net late days. Concession A
          commences on 2027-01-21, exactly 20 days late, and must accrue exactly 5000000 —
          the cap is reached, not exceeded, and min() must not be off by one day. Concession B
          commences on 2027-01-22, 21 days late, computes 5250000 and must be clamped back to
          5000000. Capping the DAY COUNT instead of the product gives 5000000 for both but for
          the wrong reason, and is caught by asserting the day count alongside the money.
        test_recipe:
          setup:
            - "Two independent concessions, both at CONSTRUCTION with scheduled_service_commencement 2027-01-01, ld_daily_rate_cents 250000, ld_cap_cents 5000000 and financial_close_date 2026-09-15."
            - "Neither concession has any GRANTED RELIEF_EVENT claim, so excused_days == 0 for both."
            - "Logical clock at 2027-01-22T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_a: $.data.id }
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Kestrel Highways Projectco", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_b: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_a}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_a: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_b}", project_name: "B12 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_b: $.data.id }
            - call: "POST /ppp/concessions/${csn_a}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_a_v: $.data.version }
            - call: "POST /ppp/concessions/${csn_b}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_b_v: $.data.version }
            - call: "POST /ppp/concessions/${csn_a}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_a_v}" }
              as: Concessionaire
              as_user_id: "${cnr_a}"
              captures: { ma_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_b}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_b_v}" }
              as: Concessionaire
              as_user_id: "${cnr_b}"
              captures: { mb_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${ma_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${mb_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${ma_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /ppp/drawdown-milestones/${mb_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-22T00:00:00Z" }
              as: PlatformAdmin
          trigger:
