        grounds:
          - calculations.authorization_documentation_completeness.formula
          - calculations.authorization_documentation_completeness.input_set
          - endpoints[POST /opo/authorizations/{id}/documents]
        distinguishing_aspect: |
          The document set is a set, not a log: uploading SIGNED_CONSENT_FORM twice leaves
          document_types_present with one entry and completeness false, and the packet only becomes
          complete when WITNESS_ATTESTATION arrives *with* a witness_name - the extra non-document
          conjunct that separates this rule from plain subset containment.
