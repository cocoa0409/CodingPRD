# =============================================================================
# Task 1160: Airport Capital Program & Federal Grant (AIP) Administration
# Difficulty: harder than expert level
# =============================================================================

scenario: |
  generate task hard than expert level! 1160. Airport Capital Program & Federal Grant (AIP) Administration: capital improvement plan & priority scoring, grant application & sponsor assurances, federal/state/local funding split & cash flow, DBE goal & contractor reporting, construction phasing to maintain operations, invoice/reimbursement request & drawdown, grant closeout & audit, useful-life & disposal restriction

domain_name: airport-aip-grants
api_prefix: /aip

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: beyond_expert

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_name, type: string, source: input, description: "Airport sponsor legal name" }
      - { name: loc_id, type: string, source: input, description: "3-letter airport location identifier; unique across all sponsors", constraints: "exactly 3 uppercase letters A-Z; unique" }
      - { name: airport_size_tier, type: enum, source: input, description: "LARGE_HUB | MEDIUM_HUB | SMALL_HUB | NONHUB — drives federal share percentage" }
      - { name: npe_entitlement_total, type: number, source: input, description: "Total non-primary entitlement (NPE) apportionment for the sponsor, dollars", constraints: ">= 0" }
      - { name: npe_entitlement_available, type: number, source: computed, description: "= npe_entitlement_total - sum of entitlement_portion over all Grants whose status != CLOSED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (only value; sponsors are never deactivated)" }

  - name: AirfieldFacility
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; owning sponsor" }
      - { name: facility_name, type: string, source: input, description: "e.g. Runway 09/27, Taxiway B" }
      - { name: facility_type, type: enum, source: input, description: "RUNWAY | TAXIWAY | APRON" }

  - name: CapitalProgram
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; owning sponsor" }
      - { name: fiscal_year, type: integer, source: input, description: "Federal fiscal year this CIP covers (e.g. 2027)", constraints: "2026..2035; unique per sponsor" }
      - { name: selection_budget, type: number, source: system, description: "Budget ceiling used by the most recent apply-selection; 0 until first selection", default: 0 }
      - { name: selected_total_cost, type: number, source: computed, description: "Sum of estimated_cost over child CIPProjects in status SELECTED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACCEPTED -> AMENDMENT_DRAFT -> SUBMITTED (amendment cycle) -> EXPIRED" }

  - name: CIPProject
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CapitalProgram.id; parent CIP" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: project_type, type: enum, source: input, description: "RUNWAY_SAFETY | CAPACITY | PRESERVATION | SECURITY | ENVIRONMENTAL | NOISE" }
      - { name: estimated_cost, type: number, source: input, description: "Estimated total project cost, dollars", constraints: "> 0" }
      - { name: safety_score, type: integer, source: input, description: "Sponsor-scored safety component", constraints: "0..20" }
      - { name: capacity_score, type: integer, source: input, description: "Sponsor-scored capacity component", constraints: "0..20" }
      - { name: preservation_score, type: integer, source: input, description: "Sponsor-scored preservation component", constraints: "0..20" }
      - { name: security_score, type: integer, source: input, description: "Sponsor-scored security component", constraints: "0..20" }
      - { name: environmental_score, type: integer, source: input, description: "Sponsor-scored environmental component", constraints: "0..20" }
      - { name: runway_safety_noncompliant, type: boolean, source: input, default: false, description: "True if project addresses a runway safety area noncompliance" }
      - { name: multi_airport_system, type: boolean, source: input, default: false, description: "True if project benefits a multi-airport system" }
      - { name: priority_score_sponsor, type: number, source: computed, description: "Sponsor-variant priority score (see cip_priority_score); null until apply-selection" }
      - { name: priority_score_federal, type: number, source: computed, description: "Federal-variant priority score (see cip_priority_score); null until apply-selection" }
      - { name: selection_rank, type: integer, source: computed, description: "Rank by priority_score_sponsor DESC, tie-break created_at ASC; null until apply-selection" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> SELECTED / DEFERRED (via apply-selection; DEFERRED may return to SELECTED on re-selection) -> DROPPED" }

  - name: GrantApplication
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; applicant sponsor" }
      - { name: program_id, type: string, source: input, description: "FK -> CapitalProgram.id; CIP this application draws projects from" }
      - { name: project_ids, type: array, source: input, description: "Array of FK -> CIPProject.id; every listed project must belong to program_id (SELECTED status is enforced at submit time, not at creation)", constraints: "at least 1 element; no duplicates" }
      - { name: total_eligible_cost, type: number, source: computed, description: "Sum of estimated_cost over project_ids at creation; recomputed whenever a referenced project is dropped" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the SponsorStaff who created the application (segregation-of-duties anchor)" }
      - { name: assurances_total, type: integer, source: system, default: 6, description: "Number of SponsorAssurance children auto-created with the application (always 6)" }
      - { name: assurances_cleared, type: integer, source: computed, description: "Count of child SponsorAssurance in CERTIFIED or WAIVED" }
      - { name: submission_deadline, type: datetime, source: computed, description: "= May 15T23:59:59Z of (fiscal_year - 1), from the referenced CapitalProgram.fiscal_year" }
      - { name: offered_federal_obligated, type: number, source: system, description: "Federal obligation computed by the offer; null until OFFERED" }
      - { name: offered_entitlement_portion, type: number, source: system, description: "Part of offered_federal_obligated funded from sponsor NPE; null until OFFERED" }
      - { name: created_grant_id, type: string, source: system, description: "id of the Grant created by accept-offer; null until then" }
      - { name: status, type: enum, source: system, description: "DRAFT -> UNDER_REVIEW -> RETURNED -> UNDER_REVIEW (resubmit cycle) -> OFFERED -> ACCEPTED / DECLINED; DRAFT|UNDER_REVIEW|RETURNED -> EXPIRED (checkpoint past deadline)" }

  - name: SponsorAssurance
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> GrantApplication.id; owning application" }
      - { name: assurance_code, type: enum, source: system, description: "TITLE_VI | BUY_AMERICAN | DBE_PROGRAM | ENVIRONMENTAL_REVIEW | PREVAILING_WAGE | AIRPORT_FEES — one row per code, auto-created" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying ComplianceOfficer; null until certified" }
      - { name: status, type: enum, source: system, description: "PENDING -> CERTIFIED / WAIVED" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: system, description: "FK -> Sponsor.id; copied from application" }
      - { name: application_id, type: string, source: system, description: "FK -> GrantApplication.id; source application" }
      - { name: grant_number, type: string, source: system, description: "System-minted grant number AIP-<loc_id>-<fiscal_year>-<seq>" }
      - { name: federal_share_pct, type: number, source: computed, description: "From sponsor tier: LARGE_HUB 0.75, MEDIUM_HUB 0.80, SMALL_HUB 0.90, NONHUB 0.95" }
      - { name: total_budget, type: number, source: system, description: "= application.total_eligible_cost at acceptance; increased by approved amendments" }
      - { name: federal_obligated, type: number, source: system, description: "Federal dollars obligated at offer; increased by approved amendments; at closeout reduced to federal_drawn" }
      - { name: federal_drawn, type: number, source: computed, default: 0, description: "Sum of federal_amount over APPROVED ReimbursementRequests + closeout final settlement payment" }
      - { name: federal_available, type: number, source: computed, description: "= federal_obligated - federal_drawn" }
      - { name: state_share_estimated, type: number, source: computed, description: "From funding_split waterfall on total_budget" }
      - { name: local_share_estimated, type: number, source: computed, description: "From funding_split waterfall on total_budget" }
      - { name: entitlement_portion, type: number, source: system, description: "Part of federal_obligated funded from sponsor NPE; the rest is discretionary" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> CLOSEOUT_REQUESTED -> UNDER_AUDIT -> CLOSED" }

  - name: GrantAmendment
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; amended grant (from path)" }
      - { name: added_scope_cost, type: number, source: input, description: "New scope cost being added, dollars", constraints: "> 0" }
      - { name: reason, type: string, source: input, description: "Amendment justification" }
      - { name: contingency_amount, type: number, source: computed, description: "From amendment_contingency_release; = new_total - total_budget - added_scope_cost" }
      - { name: new_total_budget, type: number, source: computed, description: "From amendment_contingency_release" }
      - { name: federal_delta, type: number, source: computed, description: "round_half_up(federal_share_pct * (new_total_budget - total_budget), 2)" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED / REJECTED / SUPERSEDED (new PENDING amendment supersedes prior PENDING one)" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; sponsor that registered this contractor" }
      - { name: contractor_name, type: string, source: input, description: "Contractor legal name" }
      - { name: dbe_certified, type: boolean, source: input, default: false, description: "True if the contractor itself is a certified DBE" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> SUSPENDED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; funding grant" }
      - { name: cip_project_id, type: string, source: input, description: "FK -> CIPProject.id; must be one of the grant application's project_ids" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; awardee" }
      - { name: awarded_value, type: number, source: input, description: "Contract award amount, dollars", constraints: "> 0" }
      - { name: dbe_goal_pct, type: number, source: input, description: "DBE participation goal, percent 0..100 with 2dp", constraints: "0 <= g <= 100" }
      - { name: retainage_pct, type: number, source: input, description: "Retainage fraction withheld from each invoice", constraints: "0 <= r <= 0.20" }
      - { name: invoiced_total, type: number, source: computed, default: 0, description: "Sum of gross_amount over invoices in SUBMITTED|VERIFIED|INCLUDED|PAID (excludes REJECTED, WITHHELD)" }
      - { name: remaining_value, type: number, source: computed, description: "= awarded_value - invoiced_total" }
      - { name: retainage_held, type: number, source: computed, default: 0, description: "Sum of retainage_withheld over invoices in VERIFIED|INCLUDED|PAID; released to 0 at contract CLOSED" }
      - { name: dbe_posture, type: enum, source: computed, default: "UNEVALUATED", description: "UNEVALUATED | COMPLIANT | NON_COMPLIANT — driven by latest adjudicated DBEReport" }
      - { name: status, type: enum, source: system, description: "AWARDED -> CLOSED (via grant closeout approval cascade)" }

  - name: DBEReport
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; reported contract" }
      - { name: reporting_period, type: string, source: input, description: "e.g. 2026-Q2; unique per contract" }
      - { name: dbe_paid_amount, type: number, source: input, description: "Dollars actually paid to DBE subcontractors this period", constraints: ">= 0" }
      - { name: total_paid_amount, type: number, source: input, description: "Total dollars paid to all subcontractors this period", constraints: "> 0; >= dbe_paid_amount" }
      - { name: achieved_dbe_pct, type: number, source: computed, description: "round_half_up(dbe_paid_amount / total_paid_amount * 100, 2)" }
      - { name: status, type: enum, source: system, description: "PENDING -> COMPLIANT / SHORTFALL (via adjudicate)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; billed contract" }
      - { name: invoice_number, type: string, source: input, description: "Contractor invoice number; unique per contract" }
      - { name: period, type: string, source: input, description: "Billing period label, e.g. 2026-05" }
      - { name: gross_amount, type: number, source: input, description: "Gross billed dollars", constraints: "> 0" }
      - { name: retainage_withheld, type: number, source: computed, description: "round_half_up(gross_amount * contract.retainage_pct, 2)" }
      - { name: net_payable, type: number, source: computed, description: "= gross_amount - retainage_withheld" }
      - { name: drawdown_id, type: string, source: system, description: "FK -> ReimbursementRequest.id; set when the invoice is INCLUDED in a drawdown; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VERIFIED / REJECTED; VERIFIED -> INCLUDED -> PAID; VERIFIED -> WITHHELD -> VERIFIED (DBE compliance cycle)" }

  - name: ReimbursementRequest
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; grant drawn against" }
      - { name: invoice_ids, type: array, source: input, description: "Array of FK -> Invoice.id; every invoice VERIFIED, on contracts of this grant", constraints: "at least 1 element; no duplicates" }
      - { name: total_net, type: number, source: computed, description: "Sum of net_payable over included invoices" }
      - { name: federal_amount, type: number, source: computed, description: "Sum over invoices of round_half_up(net_payable * grant.federal_share_pct, 2) — per-line rounding, pinned" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceOfficer who created the request (SoD anchor)" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying ComplianceOfficer; must differ from prepared_by_user_id" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CERTIFIED -> SUBMITTED -> APPROVED; SUBMITTED -> DRAFT (return correction loop)" }

  - name: AuditFinding
    parent: null
    common_fields: false
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; audited grant" }
      - { name: finding_code, type: enum, source: input, description: "INELIGIBLE_COST | MISSING_DOCUMENTATION | DBE_SHORTFALL | PROCUREMENT | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: description, type: string, source: input, description: "Finding narrative" }
      - { name: status, type: enum, source: system, description: "OPEN -> RESOLVED" }

  - name: GrantAsset
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; acquiring grant" }
      - { name: asset_kind, type: enum, source: input, description: "EQUIPMENT | LAND — selects disposal_payback variant" }
      - { name: description, type: string, source: input, description: "Asset description" }
      - { name: acquisition_federal_share, type: number, source: input, description: "Federal dollars embedded in the acquisition", constraints: "> 0" }
      - { name: useful_life_years, type: integer, source: input, description: "Federal useful life", constraints: "1..50" }
      - { name: in_service_date, type: datetime, source: input, description: "ISO8601 UTC date the asset entered service" }
      - { name: service_credit_value, type: number, source: computed, description: "= round_half_up(acquisition_federal_share * elapsed_years / useful_life_years, 2); elapsed_years = floor(days_since_in_service / 365) capped at useful_life_years" }
      - { name: remaining_restricted_value, type: number, source: computed, description: "= acquisition_federal_share - service_credit_value" }
      - { name: payback_due, type: number, source: computed, description: "Set at disposal approval per disposal_payback variant; 0 otherwise", default: 0 }
      - { name: status, type: enum, source: system, description: "IN_SERVICE -> DISPOSAL_REQUESTED -> DISPOSED / IN_SERVICE (return-to-service loop)" }

  - name: ConstructionPhase
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; funding grant" }
      - { name: cip_project_id, type: string, source: input, description: "FK -> CIPProject.id; executed project" }
      - { name: facility_id, type: string, source: input, description: "FK -> AirfieldFacility.id; facility occupied during the phase" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id; contractor on site" }
      - { name: closure_type, type: enum, source: input, description: "FULL_CLOSURE | NIGHT_ONLY" }
      - { name: start_utc, type: datetime, source: input, description: "Phase window start (half-open)" }
      - { name: end_utc, type: datetime, source: input, description: "Phase window end (half-open, exclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED -> ACTIVE -> COMPLETED; PLANNED|ACTIVE -> CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CapitalProgram
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /aip/capital-programs/{programId}/submit"
        actor: SponsorStaff
        preconditions:
          - "At least one child CIPProject in PROPOSED|SELECTED|DEFERRED (ERR_PROGRAM_EMPTY)"
        side_effects:
          - "increments CapitalProgram.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /aip/capital-programs/{programId}/accept"
        actor: FAAManager
        preconditions: []
        side_effects:
          - "increments CapitalProgram.version by 1"
      - from: ACCEPTED
        to: AMENDMENT_DRAFT
        trigger: "POST /aip/capital-programs/{programId}/begin-amendment"
        actor: SponsorStaff
        preconditions: []
        side_effects:
          - "increments CapitalProgram.version by 1"
      - from: AMENDMENT_DRAFT
        to: SUBMITTED
        trigger: "POST /aip/capital-programs/{programId}/submit"
        actor: SponsorStaff
        preconditions:
          - "At least one child CIPProject in PROPOSED|SELECTED|DEFERRED (ERR_PROGRAM_EMPTY)"
        side_effects:
          - "increments CapitalProgram.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (POST /_ops/run_checkpoint when clock > Dec 31T23:59:59Z of fiscal_year - 1 and program still DRAFT)"
        actor: system
        preconditions: []
        side_effects:
          - "All child CIPProjects in PROPOSED|SELECTED|DEFERRED -> DROPPED"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (POST /_ops/run_checkpoint when clock > Dec 31T23:59:59Z of fiscal_year - 1 and program still SUBMITTED)"
        actor: system
        preconditions: []
        side_effects:
          - "All child CIPProjects in PROPOSED|SELECTED|DEFERRED -> DROPPED"
      - from: AMENDMENT_DRAFT
        to: EXPIRED
        trigger: "system (POST /_ops/run_checkpoint when clock > Dec 31T23:59:59Z of fiscal_year - 1 and program still AMENDMENT_DRAFT)"
        actor: system
        preconditions: []
        side_effects:
          - "All child CIPProjects in PROPOSED|SELECTED|DEFERRED -> DROPPED"

  - entity: CIPProject
    initial_state: PROPOSED
    terminal_states: [DROPPED]
    transitions:
      - from: PROPOSED
        to: SELECTED
        trigger: "POST /aip/capital-programs/{programId}/apply-selection"
        actor: SponsorStaff
        preconditions:
          - "Program ACCEPTED"
          - "Cumulative estimated_cost of higher-ranked projects + this project <= selection_budget"
        side_effects:
          - "priority_score_sponsor / priority_score_federal / selection_rank recomputed for every project of the program"
          - "Program.selected_total_cost recomputed"
      - from: PROPOSED
        to: DEFERRED
        trigger: "POST /aip/capital-programs/{programId}/apply-selection"
        actor: SponsorStaff
        preconditions:
          - "Program ACCEPTED"
          - "Cumulative estimated_cost of higher-ranked projects + this project > selection_budget"
        side_effects: []
      - from: DEFERRED
        to: SELECTED
        trigger: "POST /aip/capital-programs/{programId}/apply-selection (re-selection with larger budget)"
        actor: SponsorStaff
        preconditions:
          - "Program ACCEPTED"
          - "Cumulative estimated_cost of higher-ranked projects + this project <= selection_budget"
        side_effects:
          - "Program.selected_total_cost recomputed"
      - from: SELECTED
        to: DEFERRED
        trigger: "POST /aip/capital-programs/{programId}/apply-selection (re-selection with smaller budget)"
        actor: SponsorStaff
        preconditions:
          - "Program ACCEPTED"
          - "Cumulative estimated_cost of higher-ranked projects + this project > selection_budget"
        side_effects:
          - "Program.selected_total_cost recomputed"
          - "Any DRAFT GrantApplication whose project_ids contains this project: project removed, total_eligible_cost recomputed"
      - from: SELECTED
        to: DROPPED
        trigger: "POST /aip/cip-projects/{projectId}/drop"
        actor: SponsorStaff
        preconditions:
          - "No Contract references this project (ERR_PROJECT_UNDER_CONTRACT)"
          - "No GrantApplication in UNDER_REVIEW|OFFERED references this project (ERR_PROJECT_IN_ACTIVE_APPLICATION)"
        side_effects:
          - "DRAFT|RETURNED GrantApplications referencing it: project removed from project_ids, total_eligible_cost recomputed"
          - "Program.selected_total_cost recomputed"
      - from: DEFERRED
        to: DROPPED
        trigger: "POST /aip/cip-projects/{projectId}/drop"
        actor: SponsorStaff
        preconditions: []
        side_effects:
          - "Program.selected_total_cost recomputed"
      - from: PROPOSED
        to: DROPPED
        trigger: "POST /aip/cip-projects/{projectId}/drop"
        actor: SponsorStaff
        preconditions: []
        side_effects: []

  - entity: GrantApplication
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /aip/grant-applications/{applicationId}/submit"
        actor: SponsorStaff
        preconditions:
          - "Referenced CapitalProgram.status == ACCEPTED (ERR_PROGRAM_NOT_ACCEPTED)"
          - "Clock <= submission_deadline (ERR_APPLICATION_DEADLINE_PASSED)"
          - "project_ids non-empty (ERR_APPLICATION_EMPTY)"
          - "Every project in project_ids has status SELECTED (ERR_PROJECT_NOT_SELECTED)"
          - "assurances_cleared == assurances_total (ERR_ASSURANCES_INCOMPLETE)"
        side_effects:
          - "increments GrantApplication.version by 1"
      - from: RETURNED
        to: UNDER_REVIEW
        trigger: "POST /aip/grant-applications/{applicationId}/submit (resubmission)"
        actor: SponsorStaff
        preconditions:
          - "Referenced CapitalProgram.status == ACCEPTED (ERR_PROGRAM_NOT_ACCEPTED)"
          - "Clock <= submission_deadline (ERR_APPLICATION_DEADLINE_PASSED)"
          - "project_ids non-empty (ERR_APPLICATION_EMPTY)"
          - "Every project in project_ids has status SELECTED (ERR_PROJECT_NOT_SELECTED)"
          - "assurances_cleared == assurances_total (ERR_ASSURANCES_INCOMPLETE)"
        side_effects:
          - "increments GrantApplication.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /aip/grant-applications/{applicationId}/return"
        actor: FAAManager
        preconditions: []
        side_effects:
          - "increments GrantApplication.version by 1"
      - from: UNDER_REVIEW
        to: OFFERED
        trigger: "POST /aip/grant-applications/{applicationId}/offer"
        actor: FAAManager
        preconditions:
          - "federal_obligated = round_half_up(sponsor-tier pct * total_eligible_cost, 2) must be <= sponsor.npe_entitlement_available + discretionary_amount (ERR_ENTITLEMENT_INSUFFICIENT)"
        side_effects:
          - "federal_obligated and entitlement_portion = min(federal_obligated, npe_entitlement_available) computed and stored on the application response payload (carried to Grant on acceptance)"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /aip/grant-applications/{applicationId}/accept-offer"
        actor: SponsorStaff
        preconditions:
          - "entitlement_portion <= sponsor.npe_entitlement_available at acceptance time (ERR_ENTITLEMENT_INSUFFICIENT)"
        side_effects:
          - "Grant created (status ACTIVE, version 1): sponsor_id/application_id copied; federal_share_pct from tier; total_budget = total_eligible_cost; federal_obligated/entitlement_portion from offer; funding_split waterfall computes state_share_estimated and local_share_estimated"
          - "Sponsor.npe_entitlement_available -= entitlement_portion"
          - "created_grant_id set on the application"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /aip/grant-applications/{applicationId}/decline-offer"
        actor: SponsorStaff
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: EXPIRED
        trigger: "system (POST /_ops/run_checkpoint when clock > submission_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "system (POST /_ops/run_checkpoint when clock > submission_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: EXPIRED
        trigger: "system (POST /_ops/run_checkpoint when clock > submission_deadline)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SponsorAssurance
    initial_state: PENDING
    terminal_states: [CERTIFIED, WAIVED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /aip/sponsor-assurances/{assuranceId}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "certifier X-User-ID != application.created_by_user_id (ERR_SOD_ASSURANCE_SELF_CERTIFY)"
        side_effects:
          - "certified_by_user_id set; application.assurances_cleared recomputed"
      - from: PENDING
        to: WAIVED
        trigger: "POST /aip/sponsor-assurances/{assuranceId}/waive"
        actor: FAAManager
        preconditions: []
        side_effects:
          - "application.assurances_cleared recomputed"

  - entity: Grant
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSEOUT_REQUESTED
        trigger: "POST /aip/grants/{grantId}/request-closeout"
        actor: SponsorStaff
        preconditions:
          - "No ReimbursementRequest for this grant in DRAFT|CERTIFIED|SUBMITTED (ERR_CLOSEOUT_BLOCKED_PENDING_DRAWDOWNS)"
          - "No ConstructionPhase for this grant in PLANNED|ACTIVE (ERR_CLOSEOUT_BLOCKED_OPEN_PHASES)"
        side_effects:
          - "increments Grant.version by 1"
      - from: CLOSEOUT_REQUESTED
        to: UNDER_AUDIT
        trigger: "POST /aip/grants/{grantId}/begin-audit"
        actor: Auditor
        preconditions: []
        side_effects:
          - "increments Grant.version by 1"
      - from: UNDER_AUDIT
        to: CLOSED
        trigger: "POST /aip/grants/{grantId}/approve-closeout"
        actor: FAAManager
        preconditions:
          - "Zero AuditFinding with status OPEN for this grant (ERR_CLOSEOUT_BLOCKED_OPEN_FINDINGS)"
          - "Zero GrantAsset with status DISPOSAL_REQUESTED for this grant (ERR_CLOSEOUT_BLOCKED_PENDING_DISPOSALS)"
        side_effects:
          - "closeout_final_settlement recomputed: federal_obligated := federal_drawn (unused obligation de-obligated)"
          - "Sponsor.npe_entitlement_available += (released entitlement) so total = available + committed over non-CLOSED grants"
          - "CASCADE depth-2: every child Contract AWARDED -> CLOSED"
          - "CASCADE depth-3: every Invoice of those contracts in VERIFIED|WITHHELD -> PAID; contract.retainage_held released to 0"
          - "Every GrantAsset IN_SERVICE: service_credit_value / remaining_restricted_value recomputed at clock"
          - "increments Grant.version by 1"

  - entity: GrantAmendment
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /aip/grant-amendments/{amendmentId}/approve"
        actor: FAAManager
        preconditions:
          - "Grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "federal_delta <= sponsor.npe_entitlement_available (ERR_ENTITLEMENT_INSUFFICIENT)"
        side_effects:
          - "Grant.total_budget := new_total_budget; Grant.federal_obligated += federal_delta; Grant.entitlement_portion += federal_delta"
          - "Sponsor.npe_entitlement_available -= federal_delta"
          - "Grant.state_share_estimated / local_share_estimated recomputed via funding_split on new total_budget"
          - "increments Grant.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /aip/grant-amendments/{amendmentId}/reject"
        actor: FAAManager
        preconditions: []
        side_effects: []
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (when POST /aip/grants/{grantId}/amendments succeeds while this amendment is PENDING)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Contractor
    initial_state: REGISTERED
    terminal_states: [SUSPENDED]
    transitions:
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /aip/contractors/{contractorId}/suspend"
        actor: SponsorStaff
        preconditions: []
        side_effects: []

  - entity: Contract
    initial_state: AWARDED
    terminal_states: [CLOSED]
    transitions:
      - from: AWARDED
        to: CLOSED
        trigger: "system (grant approve-closeout cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "retainage_held released to 0"
          - "Every Invoice in VERIFIED|WITHHELD -> PAID"

  - entity: DBEReport
    initial_state: PENDING
    terminal_states: [COMPLIANT, SHORTFALL]
    transitions:
      - from: PENDING
        to: COMPLIANT
        trigger: "POST /aip/dbe-reports/{reportId}/adjudicate when achieved_dbe_pct >= contract.dbe_goal_pct (inclusive)"
        actor: ComplianceOfficer
        preconditions:
          - "Contract.status == AWARDED (ERR_CONTRACT_CLOSED)"
        side_effects:
          - "Contract.dbe_posture := COMPLIANT"
          - "Every Invoice of the contract in WITHHELD -> VERIFIED (release), contract.invoiced_total / remaining_value recomputed"
      - from: PENDING
        to: SHORTFALL
        trigger: "POST /aip/dbe-reports/{reportId}/adjudicate when achieved_dbe_pct < contract.dbe_goal_pct"
        actor: ComplianceOfficer
        preconditions:
          - "Contract.status == AWARDED (ERR_CONTRACT_CLOSED)"
        side_effects:
          - "CASCADE depth-1: Contract.dbe_posture := NON_COMPLIANT"
          - "CASCADE depth-2: every Invoice of the contract in VERIFIED -> WITHHELD"
          - "CASCADE depth-3: for each withheld invoice, contract.invoiced_total decreases and remaining_value increases (ledger recompute caused by the invoice flip)"

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /aip/invoices/{invoiceId}/verify"
        actor: SponsorStaff
        preconditions:
          - "Contract.status == AWARDED (ERR_CONTRACT_CLOSED)"
          - "Grant of the contract must be ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "contract.invoiced_total + gross_amount <= contract.awarded_value (ERR_INVOICE_EXCEEDS_CONTRACT_VALUE)"
        side_effects:
          - "contract.invoiced_total += gross_amount; contract.remaining_value recomputed"
          - "contract.retainage_held += retainage_withheld"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /aip/invoices/{invoiceId}/reject"
        actor: SponsorStaff
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: INCLUDED
        trigger: "system (POST /aip/reimbursement-requests listing this invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "drawdown_id set to the new ReimbursementRequest.id"
      - from: INCLUDED
        to: PAID
        trigger: "system (drawdown approve)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: PAID
        trigger: "system (grant approve-closeout cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: WITHHELD
        trigger: "system (DBEReport SHORTFALL cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "contract.invoiced_total -= gross_amount; contract.remaining_value recomputed"
      - from: WITHHELD
        to: VERIFIED
        trigger: "system (DBEReport COMPLIANT cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "contract.invoiced_total += gross_amount; contract.remaining_value recomputed"
      - from: WITHHELD
        to: PAID
        trigger: "system (grant approve-closeout cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReimbursementRequest
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /aip/reimbursement-requests/{requestId}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "certifier X-User-ID != prepared_by_user_id (ERR_SOD_CERTIFIER_IS_PREPARER)"
        side_effects:
          - "certified_by_user_id set"
      - from: CERTIFIED
        to: SUBMITTED
        trigger: "POST /aip/reimbursement-requests/{requestId}/submit"
        actor: FinanceOfficer
        preconditions:
          - "Grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "Every included invoice still INCLUDED and its contract.dbe_posture != NON_COMPLIANT (ERR_PAYMENTS_WITHHELD_DBE)"
          - "federal_amount <= grant.federal_available (ERR_FEDERAL_FUNDS_INSUFFICIENT)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /aip/reimbursement-requests/{requestId}/approve"
        actor: FAAManager
        preconditions:
          - "Grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "federal_amount <= grant.federal_available (ERR_FEDERAL_FUNDS_INSUFFICIENT)"
        side_effects:
          - "grant.federal_drawn += federal_amount; grant.federal_available recomputed"
          - "Every included Invoice -> PAID"
          - "increments Grant.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /aip/reimbursement-requests/{requestId}/return"
        actor: FAAManager
        preconditions: []
        side_effects:
          - "certified_by_user_id cleared to null (re-certification required)"

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /aip/audit-findings/{findingId}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "Grant.status == UNDER_AUDIT (ERR_INVALID_STATE)"
        side_effects: []

  - entity: GrantAsset
    initial_state: IN_SERVICE
    terminal_states: [DISPOSED]
    transitions:
      - from: IN_SERVICE
        to: DISPOSAL_REQUESTED
        trigger: "POST /aip/grant-assets/{assetId}/request-disposal"
        actor: SponsorStaff
        preconditions: []
        side_effects:
          - "service_credit_value / remaining_restricted_value recomputed at clock"
      - from: DISPOSAL_REQUESTED
        to: DISPOSED
        trigger: "POST /aip/grant-assets/{assetId}/approve-disposal"
        actor: FAAManager
        preconditions:
          - "asset_kind == LAND requires fair_market_value in request payload (ERR_FMV_REQUIRED)"
        side_effects:
          - "payback_due computed per disposal_payback variant; remaining_restricted_value := 0"
      - from: DISPOSAL_REQUESTED
        to: IN_SERVICE
        trigger: "POST /aip/grant-assets/{assetId}/return-to-service"
        actor: SponsorStaff
        preconditions: []
        side_effects:
          - "payback_due stays 0; restriction continues"

  - entity: ConstructionPhase
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /aip/construction-phases/{phaseId}/activate"
        actor: SponsorStaff
        preconditions:
          - "Grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "Clock >= start_utc and clock < end_utc (ERR_PHASE_OUTSIDE_WINDOW)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /aip/construction-phases/{phaseId}/complete"
        actor: SponsorStaff
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /aip/construction-phases/{phaseId}/cancel"
        actor: SponsorStaff
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /aip/construction-phases/{phaseId}/cancel"
        actor: SponsorStaff
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC only — see SKILL.md 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-grant
    parent_entity: Grant
    write_endpoint: "POST /aip/grants/{grantId}/amendments"
    occ_field: expected_grant_version
    description: |
      Creating a GrantAmendment against a Grant whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created an amendment (which legitimately
      supersedes the prior PENDING one) and the current writer's view of the
      grant is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: selection-apply-stale-program
    parent_entity: CapitalProgram
    write_endpoint: "POST /aip/capital-programs/{programId}/apply-selection"
    occ_field: expected_program_version
    description: |
      Applying project selection against a CapitalProgram whose version has
      advanced since the client last observed it is rejected. A selection
      apply recomputes every project's score/rank and legitimately supersedes
      the prior selection outcome, so a stale client view must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cip_priority_score
    trigger: "POST /aip/capital-programs/{programId}/apply-selection (recomputed for every child CIPProject not DROPPED)"
    algorithm: weighted_scoring
    formula: |
      # Both variants start from the five 0..20 component scores.
      # SPONSOR variant:
      s_eff = safety_score * 2 if runway_safety_noncompliant else safety_score
      base = 0.30*s_eff + 0.20*preservation_score + 0.20*capacity_score
             + 0.15*security_score + 0.15*environmental_score   # weights sum to 1.00; max base = 20 (26 with doubled safety)
      bonus = 5 if multi_airport_system else 0
      priority_score_sponsor = min(100, round_half_up(base + bonus, 2))
      # FEDERAL variant (national priority ranking):
      base_f = 0.40*safety_score + 0.25*capacity_score + 0.15*preservation_score
               + 0.10*security_score + 0.10*environmental_score
      penalty = 10 if runway_safety_noncompliant else 0
      priority_score_federal = max(0, round_half_up(base_f - penalty, 2))
      # selection_rank: sort by priority_score_sponsor DESC, tie-break created_at ASC (never id)
    input_set: "All child CIPProjects of the program with status != DROPPED"
    constants:
      W_SPONSOR: { safety: 0.30, preservation: 0.20, capacity: 0.20, security: 0.15, environmental: 0.15 }
      W_FEDERAL: { safety: 0.40, capacity: 0.25, preservation: 0.15, security: 0.10, environmental: 0.10 }
      NONCOMPLIANT_SAFETY_MULTIPLIER: 2
      MULTI_AIRPORT_BONUS: 5
      NONCOMPLIANT_FEDERAL_PENALTY: 10
      SCORE_CAP: 100
    precision: "2 decimal places, round_half_up"
    variants:
      - name: sponsor_variant
        when: "Sponsor CIP selection ordering (selection_rank) and apply-selection budget sweep"
        difference: "Doubles safety component when runway_safety_noncompliant; grants +5 multi-airport bonus; no penalty"
      - name: federal_variant
        when: "Federal review priority reported on the project record"
        difference: "Uses federal weights, no multi-airport bonus, and subtracts 10 when runway_safety_noncompliant"

  - name: funding_split
    trigger: "Grant creation (accept-offer) and GrantAmendment approval (recomputed on new total_budget)"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order — each step consumes the remainder of the previous:
      # 1. federal_raw  = round_half_up(FED_PCT(tier) * total_budget, 2)
      # 2. federal      = federal_raw  (obligation cap is enforced at offer time, not here)
      # 3. state        = round_half_up(STATE_PCT_OF_NONFEDERAL * (total_budget - federal), 2)
      # 4. local        = total_budget - federal - state
      # Outputs land on grant.state_share_estimated / local_share_estimated.
    input_set: "The single Grant's total_budget and its sponsor's airport_size_tier"
    constants:
      FED_PCT: { LARGE_HUB: 0.75, MEDIUM_HUB: 0.80, SMALL_HUB: 0.90, NONHUB: 0.95 }
      STATE_PCT_OF_NONFEDERAL: 0.50
    precision: "2 decimal places, round_half_up"

  - name: drawdown_federal_share
    trigger: "POST /aip/reimbursement-requests creation (and any re-derivation of an existing DRAFT request)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode b): round per invoice line, then sum.
      #   federal_amount = SUM_over_invoices( round_half_up(net_payable * grant.federal_share_pct, 2) )
      # The alternative (sum net_payable first, then round once) is explicitly REJECTED
      # and produces different cents: e.g. nets 33333.33 x 3 at pct 0.90 ->
      #   per-line: 3 * round_half_up(30000.00, 2) = 90000.00  vs
      #   sum-first: round_half_up(99999.99 * 0.90, 2) = 89999.99.
      # total_net = SUM_over_invoices(net_payable)   (no rounding needed; already 2dp)
    input_set: "Invoices whose ids are in the request's invoice_ids, all VERIFIED at inclusion time"
    constants: {}
    precision: "2 decimal places, round_half_up per line, then exact sum"

  - name: amendment_contingency_release
    trigger: "POST /aip/grants/{grantId}/amendments creation"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking definition, evaluation order pinned here (mode c):
      # contingency is defined as CONTINGENCY_PCT of the NEW total budget, and the
      # new total itself includes the contingency:
      #     new_total = total_budget + added_scope_cost + contingency
      #     contingency = CONTINGENCY_PCT * new_total
      # Pinned resolution (evaluate exactly in this order):
      #     1. base        = total_budget + added_scope_cost
      #     2. new_total   = round_half_up(base / (1 - CONTINGENCY_PCT), 2)
      #     3. contingency = new_total - base
      #     4. federal_delta = round_half_up(grant.federal_share_pct * (new_total - total_budget), 2)
    input_set: "The target Grant (total_budget, federal_share_pct) and the amendment's added_scope_cost"
    constants:
      CONTINGENCY_PCT: 0.10
    precision: "2 decimal places, round_half_up"

  - name: retainage_split
    trigger: "Invoice creation (POST /aip/invoices)"
    algorithm: aggregation
    formula: |
      retainage_withheld = round_half_up(gross_amount * contract.retainage_pct, 2)
      net_payable = gross_amount - retainage_withheld
    input_set: "The new invoice and its contract's retainage_pct"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: dbe_attainment
    trigger: "DBEReport creation (achieved_dbe_pct) and adjudication (status decision)"
    algorithm: threshold
    formula: |
      achieved_dbe_pct = round_half_up(dbe_paid_amount / total_paid_amount * 100, 2)
      # Adjudication boundary is INCLUSIVE: achieved >= goal -> COMPLIANT; achieved < goal -> SHORTFALL.
      # Comparison is performed on the rounded 2dp value.
    input_set: "The single DBEReport and its contract's dbe_goal_pct"
    constants: {}
    precision: "2 decimal places, round_half_up; comparison on the rounded value"

  - name: disposal_payback
    trigger: "POST /aip/grant-assets/{assetId}/approve-disposal"
    algorithm: decay_function
    formula: |
      elapsed_years = min(useful_life_years, floor((clock - in_service_date) in whole days / 365))
      remaining_years = useful_life_years - elapsed_years
      # Variant selection by asset_kind:
      #   EQUIPMENT (straight_line): payback = round_half_up(acquisition_federal_share * remaining_years / useful_life_years, 2)
      #   LAND (fair_market):        payback = round_half_up(fair_market_value * grant_fed_pct_at_acquisition * remaining_years / useful_life_years, 2)
      # where grant_fed_pct_at_acquisition = acquisition_federal_share / acquisition total; pinned as
      # the grant's federal_share_pct captured on the asset at creation time is NOT stored — instead the
      # LAND variant uses the parent grant's CURRENT federal_share_pct.
      # Boundary: remaining_years == 0 (elapsed >= useful_life_years) -> payback = 0.00.
    input_set: "The GrantAsset, its parent Grant.federal_share_pct, the logical clock, and fair_market_value (LAND only)"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: straight_line
        when: "asset_kind == EQUIPMENT"
        difference: "Payback is proportional to the ORIGINAL federal share (book-value amortization)"
      - name: fair_market
        when: "asset_kind == LAND"
        difference: "Payback scales with current fair_market_value times the grant federal percentage — diverges from book value whenever FMV != original cost"

  - name: closeout_final_settlement
    trigger: "POST /aip/grants/{grantId}/approve-closeout"
    algorithm: chronological
    formula: |
      # Final settlement replays the grant ledger in chronological order of approval:
      #   final_federal = federal_drawn (all APPROVED drawdowns, in approval order)
      #   released      = federal_obligated - final_federal   (>= 0 by construction)
      #   federal_obligated := final_federal
      #   Sponsor.npe_entitlement_available += entitlement portion of `released`
      #     (entitlement_released = min(released, grant.entitlement_portion))
      # Reconciliation with the provisional drawdown variant: any unpaid verified/withheld
      # invoices are marked PAID by the cascade but are NOT added to federal_drawn —
      # their payment is a sponsor-local obligation outside the federal ledger.
    input_set: "All ReimbursementRequests of the grant with status APPROVED, ordered by approved_at (created_at ASC tie-break)"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix; entity_backed Contractor may only act on invoices/reports of its own contracts"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids and body FK references resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource state permits the requested transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "GrantApplication submit: referenced CapitalProgram must be ACCEPTED"
    error_id: ERR_PROGRAM_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /aip/grant-applications/{applicationId}/submit"
  - priority: 6
    category: state
    check: "Grant-dependent operations (invoice verify, drawdown submit/approve, phase activate, amendment approve) require Grant ACTIVE"
    error_id: ERR_GRANT_NOT_ACTIVE
    http_status: 409
    applies_to: "invoice verify; drawdown submit/approve; phase activate; amendment approve"
  - priority: 7
    category: business_safety
    check: "FULL_CLOSURE phase duration must be <= 72 hours; NIGHT_ONLY phase duration must be <= 8 hours (operations-continuity limits)"
    error_id: ERR_CLOSURE_DURATION_EXCEEDED
    http_status: 422
    applies_to: "POST /aip/construction-phases"
  - priority: 8
    category: business_temporal
    check: "Phase end_utc must be strictly after start_utc"
    error_id: ERR_PHASE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /aip/construction-phases"
  - priority: 9
    category: business_temporal
    check: "GrantApplication submit: clock must be <= submission_deadline"
    error_id: ERR_APPLICATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /aip/grant-applications/{applicationId}/submit"
  - priority: 10
    category: business_temporal
    check: "Phase activate: clock must be within [start_utc, end_utc)"
    error_id: ERR_PHASE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /aip/construction-phases/{phaseId}/activate"
  - priority: 11
    category: business_constraint
    check: "FULL_CLOSURE phases on the same facility in PLANNED|ACTIVE must not overlap under half-open [start,end) semantics; adjacency (end == start) is allowed"
    error_id: ERR_FACILITY_OVERLAP
    http_status: 409
    applies_to: "POST /aip/construction-phases"
  - priority: 12
    category: business_constraint
    check: "Phases with the same contractor_id must keep a minimum 24-hour buffer between windows (start >= prior end + 24h or symmetric); a gap of exactly 24h is allowed"
    error_id: ERR_CONTRACTOR_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /aip/construction-phases"
  - priority: 13
    category: business_constraint
    check: "Project component scores within 0..20; useful_life_years within 1..50; retainage_pct within [0,0.20]; dbe_goal_pct within [0,100]; invoice_number unique per contract; reporting_period unique per contract; loc_id unique; fiscal_year unique per sponsor"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all creation endpoints"
  - priority: 14
    category: business_constraint
    check: "GrantApplication create: project_ids non-empty, no duplicates; drawdown create: invoice_ids non-empty, no duplicates"
    error_id: ERR_EMPTY_SELECTION
    http_status: 422
    applies_to: "POST /aip/grant-applications; POST /aip/reimbursement-requests"
  - priority: 15
    category: business_referential
    check: "Cross-sponsor references forbidden: facility/contractor/project must belong to the same sponsor as the grant/program; contract project must be in the grant application's project_ids"
    error_id: ERR_CROSS_SPONSOR_REFERENCE
    http_status: 422
    applies_to: "POST /aip/construction-phases; POST /aip/contracts"
  - priority: 16
    category: business_referential
    check: "Contractor must be REGISTERED (not SUSPENDED) at contract award"
    error_id: ERR_CONTRACTOR_SUSPENDED
    http_status: 422
    applies_to: "POST /aip/contracts"
  - priority: 17
    category: business_referential
    check: "Application submit: every project in project_ids must be SELECTED; drawdown create: every invoice VERIFIED and on a contract of this grant"
    error_id: ERR_PROJECT_NOT_SELECTED
    http_status: 422
    applies_to: "POST /aip/grant-applications/{applicationId}/submit"
  - priority: 18
    category: business_referential
    check: "Drawdown create: every invoice in invoice_ids is VERIFIED and its contract belongs to this grant"
    error_id: ERR_INVOICE_NOT_VERIFIABLE
    http_status: 422
    applies_to: "POST /aip/reimbursement-requests"
  - priority: 19
    category: business_referential
    check: "Project drop: no Contract references the project"
    error_id: ERR_PROJECT_UNDER_CONTRACT
    http_status: 422
    applies_to: "POST /aip/cip-projects/{projectId}/drop"
  - priority: 20
    category: business_referential
    check: "Project drop: no UNDER_REVIEW|OFFERED application references the project"
    error_id: ERR_PROJECT_IN_ACTIVE_APPLICATION
    http_status: 422
    applies_to: "POST /aip/cip-projects/{projectId}/drop"
  - priority: 21
    category: business_safety
    check: "Segregation of duties: assurance certifier != application creator; drawdown certifier != drawdown preparer (compared on X-User-ID)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /aip/sponsor-assurances/{assuranceId}/certify; POST /aip/reimbursement-requests/{requestId}/certify"
  - priority: 22
    category: business_safety
    check: "Application submit: assurances_cleared must equal assurances_total"
    error_id: ERR_ASSURANCES_INCOMPLETE
    http_status: 422
    applies_to: "POST /aip/grant-applications/{applicationId}/submit"
  - priority: 23
    category: business_safety
    check: "Drawdown submit: no included invoice's contract may be DBE NON_COMPLIANT"
    error_id: ERR_PAYMENTS_WITHHELD_DBE
    http_status: 422
    applies_to: "POST /aip/reimbursement-requests/{requestId}/submit"
  - priority: 24
    category: business_safety
    check: "Closeout approval: zero OPEN audit findings; zero DISPOSAL_REQUESTED assets; request-closeout: no pending drawdowns and no PLANNED|ACTIVE phases"
    error_id: ERR_CLOSEOUT_BLOCKED
    http_status: 422
    applies_to: "POST /aip/grants/{grantId}/approve-closeout; POST /aip/grants/{grantId}/request-closeout"
  - priority: 25
    category: business_fiscal
    check: "Offer / amendment approve: federal amount must fit sponsor NPE available (+ discretionary input on offer)"
    error_id: ERR_ENTITLEMENT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /aip/grant-applications/{applicationId}/offer; POST /aip/grant-applications/{applicationId}/accept-offer; POST /aip/grant-amendments/{amendmentId}/approve"
  - priority: 26
    category: business_fiscal
    check: "Invoice verify: contract.invoiced_total + gross_amount <= contract.awarded_value (equality allowed)"
    error_id: ERR_INVOICE_EXCEEDS_CONTRACT_VALUE
    http_status: 402
    applies_to: "POST /aip/invoices/{invoiceId}/verify"
  - priority: 27
    category: business_fiscal
    check: "Drawdown submit/approve: federal_amount <= grant.federal_available (equality allowed)"
    error_id: ERR_FEDERAL_FUNDS_INSUFFICIENT
    http_status: 402
    applies_to: "POST /aip/reimbursement-requests/{requestId}/submit; POST /aip/reimbursement-requests/{requestId}/approve"
  - priority: 28
    category: business_fiscal
    check: "Disposal approval of a LAND asset requires fair_market_value in the payload"
    error_id: ERR_FMV_REQUIRED
    http_status: 422
    applies_to: "POST /aip/grant-assets/{assetId}/approve-disposal"
  - priority: 29
    category: business_constraint
    check: "OCC: expected_grant_version / expected_program_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /aip/grants/{grantId}/amendments; POST /aip/capital-programs/{programId}/apply-selection"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving (outside the public business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Default before any call is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [FAAManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  - method: POST
    path: "/_ops/run_checkpoint"
    description: "Execute the fiscal checkpoint batch: expire DRAFT|UNDER_REVIEW|RETURNED applications past submission_deadline; expire DRAFT|SUBMITTED|AMENDMENT_DRAFT programs past fiscal_year-1 Dec 31; recompute GrantAsset service credits at the clock."
    roles: [FAAManager]
    code: 200
    input: []
    output: "{ applications_expired: integer, programs_expired: integer, assets_recomputed: integer }"
    side_effects: ["expiry cascades per state machines; asset credit recompute"]

  # --- Sponsors ---
  - method: POST
    path: "/aip/sponsors"
    description: "Register an airport sponsor"
    roles: [FAAManager]
    code: 201
    input: [sponsor_name, loc_id, airport_size_tier, npe_entitlement_total]
    output: Sponsor
    side_effects: []
  - method: GET
    path: "/aip/sponsors"
    description: "List sponsors (paginated)"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Sponsor[]"
    side_effects: []
  - method: GET
    path: "/aip/sponsors/{sponsorId}"
    description: "Get one sponsor (includes computed npe_entitlement_available)"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  # --- Airfield facilities ---
  - method: POST
    path: "/aip/facilities"
    description: "Register an airfield facility for a sponsor"
    roles: [SponsorStaff]
    code: 201
    input: [sponsor_id, facility_name, facility_type]
    output: AirfieldFacility
    side_effects: []
  - method: GET
    path: "/aip/facilities"
    description: "List facilities, optionally by sponsor"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["sponsor_id?", "facility_type?", "limit?", "offset?"]
    output: "AirfieldFacility[]"
    side_effects: []
  - method: GET
    path: "/aip/facilities/{facilityId}"
    description: "Get one facility"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: AirfieldFacility
    side_effects: []

  # --- Capital programs (CIP) ---
  - method: POST
    path: "/aip/capital-programs"
    description: "Create a capital improvement program for a sponsor and federal fiscal year"
    roles: [SponsorStaff]
    code: 201
    input: [sponsor_id, fiscal_year]
    output: CapitalProgram
    side_effects: []
  - method: GET
    path: "/aip/capital-programs"
    description: "List programs, optionally by sponsor/status"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["sponsor_id?", "status?", "limit?", "offset?"]
    output: "CapitalProgram[]"
    side_effects: []
  - method: GET
    path: "/aip/capital-programs/{programId}"
    description: "Get one program"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: CapitalProgram
    side_effects: []
  - method: POST
    path: "/aip/capital-programs/{programId}/submit"
    description: "Submit program (from DRAFT or AMENDMENT_DRAFT) for federal acceptance"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: CapitalProgram
    side_effects: ["status -> SUBMITTED", "increments CapitalProgram.version by 1"]
  - method: POST
    path: "/aip/capital-programs/{programId}/accept"
    description: "FAA accepts a submitted program"
    roles: [FAAManager]
    code: 200
    input: []
    output: CapitalProgram
    side_effects: ["status -> ACCEPTED", "increments CapitalProgram.version by 1"]
  - method: POST
    path: "/aip/capital-programs/{programId}/begin-amendment"
    description: "Open an amendment cycle on an accepted program"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: CapitalProgram
    side_effects: ["status -> AMENDMENT_DRAFT", "increments CapitalProgram.version by 1"]
  - method: POST
    path: "/aip/capital-programs/{programId}/apply-selection"
    description: "Recompute priority scores (both variants), rank projects, and SELECT projects greedily by rank while cumulative estimated_cost <= selection_budget; others become DEFERRED"
    roles: [SponsorStaff]
    code: 200
    input: [selection_budget, expected_program_version]
    output: CapitalProgram
    side_effects:
      - "cip_priority_score recomputed for all non-DROPPED projects"
      - "project statuses updated SELECTED/DEFERRED per rank sweep"
      - "selected_total_cost recomputed; selection_budget stored"
      - "DRAFT GrantApplications referencing a project that fell out of selection: project removed, total_eligible_cost recomputed"
      - "increments CapitalProgram.version by 1"

  # --- CIP projects ---
  - method: POST
    path: "/aip/cip-projects"
    description: "Add a project to a program (program must be DRAFT or AMENDMENT_DRAFT)"
    roles: [SponsorStaff]
    code: 201
    input: [program_id, title, project_type, estimated_cost, safety_score, capacity_score, preservation_score, security_score, environmental_score, "runway_safety_noncompliant?", "multi_airport_system?"]
    output: CIPProject
    side_effects: []
  - method: GET
    path: "/aip/cip-projects"
    description: "List projects, optionally by program/status"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "CIPProject[]"
    side_effects: []
  - method: GET
    path: "/aip/cip-projects/{projectId}"
    description: "Get one project (includes both score variants and rank)"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: CIPProject
    side_effects: []
  - method: POST
    path: "/aip/cip-projects/{projectId}/drop"
    description: "Drop a project from the program"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: CIPProject
    side_effects: ["status -> DROPPED", "draft application reference removal + total recompute", "program selected_total_cost recompute"]

  # --- Grant applications ---
  - method: POST
    path: "/aip/grant-applications"
    description: "Create a grant application from SELECTED CIP projects; auto-creates the 6 SponsorAssurance children in PENDING"
    roles: [SponsorStaff]
    code: 201
    input: [sponsor_id, program_id, project_ids]
    output: GrantApplication
    side_effects: ["6 SponsorAssurance rows created", "created_by_user_id set from X-User-ID", "total_eligible_cost computed", "submission_deadline computed"]
  - method: GET
    path: "/aip/grant-applications"
    description: "List applications, optionally by sponsor/program/status"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["sponsor_id?", "program_id?", "status?", "limit?", "offset?"]
    output: "GrantApplication[]"
    side_effects: []
  - method: GET
    path: "/aip/grant-applications/{applicationId}"
    description: "Get one application"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: GrantApplication
    side_effects: []
  - method: GET
    path: "/aip/grant-applications/{id}/assurances"
    description: "List the application's assurance checklist"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: "SponsorAssurance[]"
    side_effects: []
  - method: POST
    path: "/aip/grant-applications/{applicationId}/submit"
    description: "Submit (or resubmit from RETURNED) an application for federal review"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status -> UNDER_REVIEW", "increments GrantApplication.version by 1"]
  - method: POST
    path: "/aip/grant-applications/{applicationId}/return"
    description: "FAA returns an application for correction"
    roles: [FAAManager]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status -> RETURNED", "increments GrantApplication.version by 1"]
  - method: POST
    path: "/aip/grant-applications/{applicationId}/offer"
    description: "FAA issues a grant offer with computed federal_obligated and entitlement/discretionary split"
    roles: [FAAManager]
    code: 200
    input: ["discretionary_amount?"]
    output: GrantApplication
    side_effects: ["status -> OFFERED", "federal_obligated + entitlement_portion computed and carried on the application"]
  - method: POST
    path: "/aip/grant-applications/{applicationId}/accept-offer"
    description: "Sponsor accepts the offer; creates the Grant in ACTIVE"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["Grant created", "npe_entitlement_available debited", "funding_split computed", "created_grant_id set"]
  - method: POST
    path: "/aip/grant-applications/{applicationId}/decline-offer"
    description: "Sponsor declines the offer"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status -> DECLINED"]

  # --- Sponsor assurances ---
  - method: POST
    path: "/aip/sponsor-assurances/{assuranceId}/certify"
    description: "Compliance officer certifies an assurance (SoD: cannot certify own application)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SponsorAssurance
    side_effects: ["status -> CERTIFIED", "application assurances_cleared recomputed"]
  - method: POST
    path: "/aip/sponsor-assurances/{assuranceId}/waive"
    description: "FAA waives an assurance"
    roles: [FAAManager]
    code: 200
    input: []
    output: SponsorAssurance
    side_effects: ["status -> WAIVED", "application assurances_cleared recomputed"]

  # --- Grants ---
  - method: GET
    path: "/aip/grants"
    description: "List grants, optionally by sponsor/application/status"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["sponsor_id?", "application_id?", "status?", "limit?", "offset?"]
    output: "Grant[]"
    side_effects: []
  - method: GET
    path: "/aip/grants/{grantId}"
    description: "Get one grant (includes drawn/available balances)"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: POST
    path: "/aip/grants/{grantId}/request-closeout"
    description: "Sponsor initiates grant closeout"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: Grant
    side_effects: ["status -> CLOSEOUT_REQUESTED", "increments Grant.version by 1"]
  - method: POST
    path: "/aip/grants/{grantId}/begin-audit"
    description: "Auditor opens the closeout audit"
    roles: [Auditor]
    code: 200
    input: []
    output: Grant
    side_effects: ["status -> UNDER_AUDIT", "increments Grant.version by 1"]
  - method: POST
    path: "/aip/grants/{grantId}/approve-closeout"
    description: "FAA approves closeout: final settlement, contract/invoice cascade, NPE release"
    roles: [FAAManager]
    code: 200
    input: []
    output: Grant
    side_effects: ["closeout_final_settlement", "contracts -> CLOSED", "unpaid verified/withheld invoices -> PAID", "NPE released", "increments Grant.version by 1"]

  # --- Grant amendments ---
  - method: POST
    path: "/aip/grants/{grantId}/amendments"
    description: "Create a grant amendment (OCC-guarded; supersedes any PENDING amendment); computes contingency and federal_delta"
    roles: [SponsorStaff]
    code: 201
    input: [added_scope_cost, reason, expected_grant_version]
    output: GrantAmendment
    side_effects:
      - "amendment_contingency_release computed"
      - "any existing PENDING amendment of this grant -> SUPERSEDED"
      - "increments Grant.version by 1"
  - method: GET
    path: "/aip/grants/{id}/amendments"
    description: "List amendments of a grant"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "GrantAmendment[]"
    side_effects: []
  - method: POST
    path: "/aip/grant-amendments/{amendmentId}/approve"
    description: "FAA approves an amendment: grant budget and obligation grow"
    roles: [FAAManager]
    code: 200
    input: []
    output: GrantAmendment
    side_effects: ["Grant.total_budget/federal_obligated/entitlement_portion increased", "NPE debited", "funding_split recomputed", "increments Grant.version by 1"]
  - method: POST
    path: "/aip/grant-amendments/{amendmentId}/reject"
    description: "FAA rejects an amendment"
    roles: [FAAManager]
    code: 200
    input: []
    output: GrantAmendment
    side_effects: []

  # --- Contractors ---
  - method: POST
    path: "/aip/contractors"
    description: "Register a contractor under a sponsor"
    roles: [SponsorStaff]
    code: 201
    input: [sponsor_id, contractor_name, "dbe_certified?"]
    output: Contractor
    side_effects: []
  - method: GET
    path: "/aip/contractors"
    description: "List contractors, optionally by sponsor"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["sponsor_id?", "limit?", "offset?"]
    output: "Contractor[]"
    side_effects: []
  - method: GET
    path: "/aip/contractors/{contractorId}"
    description: "Get one contractor"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: POST
    path: "/aip/contractors/{contractorId}/suspend"
    description: "Suspend a contractor (blocks new awards)"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: Contractor
    side_effects: ["status -> SUSPENDED"]

  # --- Contracts ---
  - method: POST
    path: "/aip/contracts"
    description: "Award a contract under a grant for a project to a contractor"
    roles: [SponsorStaff]
    code: 201
    input: [grant_id, cip_project_id, contractor_id, awarded_value, dbe_goal_pct, retainage_pct]
    output: Contract
    side_effects: ["dbe_posture := UNEVALUATED"]
  - method: GET
    path: "/aip/contracts"
    description: "List contracts, optionally by grant/contractor/project"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["grant_id?", "contractor_id?", "cip_project_id?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []
  - method: GET
    path: "/aip/contracts/{contractId}"
    description: "Get one contract (includes invoiced_total, remaining_value, retainage_held, dbe_posture)"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: Contract
    side_effects: []

  # --- DBE reports ---
  - method: POST
    path: "/aip/dbe-reports"
    description: "Contractor files a DBE participation report for its own contract (X-User-ID must equal the contract's contractor_id)"
    roles: [Contractor]
    code: 201
    input: [contract_id, reporting_period, dbe_paid_amount, total_paid_amount]
    output: DBEReport
    side_effects: ["achieved_dbe_pct computed"]
  - method: GET
    path: "/aip/contracts/{id}/dbe-reports"
    description: "List DBE reports of a contract"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "DBEReport[]"
    side_effects: []
  - method: POST
    path: "/aip/dbe-reports/{reportId}/adjudicate"
    description: "Compliance officer adjudicates: achieved >= goal (inclusive) -> COMPLIANT, else SHORTFALL with withholding cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DBEReport
    side_effects: ["dbe_attainment decision applied", "contract.dbe_posture updated", "invoice withhold/release cascade"]

  # --- Invoices ---
  - method: POST
    path: "/aip/invoices"
    description: "Contractor submits an invoice against its own contract (X-User-ID must equal the contract's contractor_id)"
    roles: [Contractor]
    code: 201
    input: [contract_id, invoice_number, period, gross_amount]
    output: Invoice
    side_effects: ["retainage_split computed"]
  - method: GET
    path: "/aip/invoices"
    description: "List invoices, optionally by contract/drawdown/status"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["contract_id?", "drawdown_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/aip/invoices/{invoiceId}"
    description: "Get one invoice"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/aip/invoices/{invoiceId}/verify"
    description: "Sponsor staff verifies a submitted invoice (contract-value cap enforced)"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VERIFIED", "contract totals updated"]
  - method: POST
    path: "/aip/invoices/{invoiceId}/reject"
    description: "Sponsor staff rejects a submitted invoice"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> REJECTED"]

  # --- Reimbursement requests (drawdowns) ---
  - method: POST
    path: "/aip/reimbursement-requests"
    description: "Finance officer prepares a drawdown over VERIFIED invoices; per-line federal rounding pinned"
    roles: [FinanceOfficer]
    code: 201
    input: [grant_id, invoice_ids]
    output: ReimbursementRequest
    side_effects: ["invoices -> INCLUDED with drawdown_id set", "total_net and federal_amount computed", "prepared_by_user_id set"]
  - method: GET
    path: "/aip/reimbursement-requests"
    description: "List drawdowns, optionally by grant/status"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["grant_id?", "status?", "limit?", "offset?"]
    output: "ReimbursementRequest[]"
    side_effects: []
  - method: GET
    path: "/aip/reimbursement-requests/{requestId}"
    description: "Get one drawdown"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: ReimbursementRequest
    side_effects: []
  - method: POST
    path: "/aip/reimbursement-requests/{requestId}/certify"
    description: "Compliance officer certifies the drawdown (SoD: certifier != preparer)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ReimbursementRequest
    side_effects: ["status -> CERTIFIED", "certified_by_user_id set"]
  - method: POST
    path: "/aip/reimbursement-requests/{requestId}/submit"
    description: "Finance officer submits a certified drawdown to the FAA"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ReimbursementRequest
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/aip/reimbursement-requests/{requestId}/approve"
    description: "FAA approves: federal funds move, invoices become PAID"
    roles: [FAAManager]
    code: 200
    input: []
    output: ReimbursementRequest
    side_effects: ["status -> APPROVED", "grant.federal_drawn += federal_amount", "invoices -> PAID", "increments Grant.version by 1"]
  - method: POST
    path: "/aip/reimbursement-requests/{requestId}/return"
    description: "FAA returns a submitted drawdown for correction (back to DRAFT)"
    roles: [FAAManager]
    code: 200
    input: []
    output: ReimbursementRequest
    side_effects: ["status -> DRAFT", "certified_by_user_id cleared"]

  # --- Audit findings ---
  - method: POST
    path: "/aip/audit-findings"
    description: "Auditor records a finding against a grant in UNDER_AUDIT"
    roles: [Auditor]
    code: 201
    input: [grant_id, finding_code, severity, description]
    output: AuditFinding
    side_effects: []
  - method: GET
    path: "/aip/grants/{id}/audit-findings"
    description: "List findings of a grant"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AuditFinding[]"
    side_effects: []
  - method: POST
    path: "/aip/audit-findings/{findingId}/resolve"
    description: "Compliance officer resolves an open finding"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AuditFinding
    side_effects: ["status -> RESOLVED"]

  # --- Grant assets (useful life / disposal) ---
  - method: POST
    path: "/aip/grant-assets"
    description: "Register an asset acquired with grant funds"
    roles: [SponsorStaff]
    code: 201
    input: [grant_id, asset_kind, description, acquisition_federal_share, useful_life_years, in_service_date]
    output: GrantAsset
    side_effects: ["service_credit_value / remaining_restricted_value computed at clock"]
  - method: GET
    path: "/aip/grants/{id}/assets"
    description: "List assets of a grant"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "GrantAsset[]"
    side_effects: []
  - method: POST
    path: "/aip/grant-assets/{assetId}/request-disposal"
    description: "Sponsor requests disposal of an asset"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: GrantAsset
    side_effects: ["status -> DISPOSAL_REQUESTED", "credit recompute at clock"]
  - method: POST
    path: "/aip/grant-assets/{assetId}/approve-disposal"
    description: "FAA approves disposal and fixes payback_due per the asset_kind variant"
    roles: [FAAManager]
    code: 200
    input: ["fair_market_value?"]
    output: GrantAsset
    side_effects: ["status -> DISPOSED", "disposal_payback computed", "remaining_restricted_value := 0"]
  - method: POST
    path: "/aip/grant-assets/{assetId}/return-to-service"
    description: "Cancel a disposal request and keep the asset in service"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: GrantAsset
    side_effects: ["status -> IN_SERVICE"]

  # --- Construction phases ---
  - method: POST
    path: "/aip/construction-phases"
    description: "Plan a construction phase on a facility with closure-type rules, overlap and contractor-buffer checks"
    roles: [SponsorStaff]
    code: 201
    input: [grant_id, cip_project_id, facility_id, contractor_id, closure_type, start_utc, end_utc]
    output: ConstructionPhase
    side_effects: []
  - method: GET
    path: "/aip/construction-phases"
    description: "List phases, optionally by grant/facility/contractor/project/closure_type"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: ["grant_id?", "facility_id?", "contractor_id?", "cip_project_id?", "closure_type?", "limit?", "offset?"]
    output: "ConstructionPhase[]"
    side_effects: []
  - method: GET
    path: "/aip/construction-phases/{phaseId}"
    description: "Get one phase"
    roles: [FAAManager, SponsorStaff, ComplianceOfficer, FinanceOfficer, Auditor, Contractor]
    code: 200
    input: []
    output: ConstructionPhase
    side_effects: []
  - method: POST
    path: "/aip/construction-phases/{phaseId}/activate"
    description: "Activate a planned phase (grant must be ACTIVE, clock inside window)"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: ConstructionPhase
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/aip/construction-phases/{phaseId}/complete"
    description: "Complete an active phase"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: ConstructionPhase
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/aip/construction-phases/{phaseId}/cancel"
    description: "Cancel a planned or active phase"
    roles: [SponsorStaff]
    code: 200
    input: []
    output: ConstructionPhase
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or entity_backed Contractor acting on another contractor's contract" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve (message names the entity type)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field-level constraint failure: score range, retainage/dbe/useful-life range, uniqueness (invoice_number per contract, reporting_period per contract, loc_id, fiscal_year per sponsor), missing required field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure for a transition not covered by a more specific error" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch on expected_grant_version / expected_program_version" }
  - { id: ERR_PROGRAM_EMPTY, http: 422, condition: "Program submit with no child projects in PROPOSED|SELECTED|DEFERRED" }
  - { id: ERR_PROGRAM_NOT_ACCEPTED, http: 409, condition: "Application submit while referenced program is not ACCEPTED" }
  - { id: ERR_APPLICATION_DEADLINE_PASSED, http: 422, condition: "Application submit after submission_deadline (clock-aware)" }
  - { id: ERR_APPLICATION_EMPTY, http: 422, condition: "Application submit with empty project_ids (all dropped)" }
  - { id: ERR_PROJECT_NOT_SELECTED, http: 422, condition: "Application submit references a project not in SELECTED status" }
  - { id: ERR_ASSURANCES_INCOMPLETE, http: 422, condition: "Application submit while assurances_cleared < assurances_total" }
  - { id: ERR_ENTITLEMENT_INSUFFICIENT, http: 402, condition: "Federal obligation would exceed sponsor NPE available (+ discretionary_amount on offer)" }
  - { id: ERR_CLOSURE_DURATION_EXCEEDED, http: 422, condition: "FULL_CLOSURE > 72h or NIGHT_ONLY > 8h (operations-continuity safety limit)" }
  - { id: ERR_PHASE_WINDOW_INVALID, http: 422, condition: "Phase end_utc <= start_utc" }
  - { id: ERR_PHASE_OUTSIDE_WINDOW, http: 422, condition: "Phase activation outside [start_utc, end_utc) per the logical clock" }
  - { id: ERR_FACILITY_OVERLAP, http: 409, condition: "FULL_CLOSURE overlap on the same facility under half-open interval semantics (adjacency allowed)" }
  - { id: ERR_CONTRACTOR_BUFFER_CONFLICT, http: 409, condition: "Same-contractor phases with less than the mandatory 24h buffer" }
  - { id: ERR_CROSS_SPONSOR_REFERENCE, http: 422, condition: "Facility/contractor/project belongs to a different sponsor, or contract project not in the grant's application scope" }
  - { id: ERR_CONTRACTOR_SUSPENDED, http: 422, condition: "Contract award to a SUSPENDED contractor" }
  - { id: ERR_INVOICE_NOT_VERIFIABLE, http: 422, condition: "Drawdown create includes an invoice that is not VERIFIED or belongs to another grant" }
  - { id: ERR_INVOICE_EXCEEDS_CONTRACT_VALUE, http: 402, condition: "Invoice verification would push invoiced_total beyond awarded_value (equality allowed)" }
  - { id: ERR_CONTRACT_CLOSED, http: 409, condition: "Operation requires an AWARDED contract but it is CLOSED" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "Operation requires Grant ACTIVE (invoice verify, drawdown submit/approve, phase activate, amendment approve)" }
  - { id: ERR_PAYMENTS_WITHHELD_DBE, http: 422, condition: "Drawdown submit while an included invoice's contract is DBE NON_COMPLIANT" }
  - { id: ERR_FEDERAL_FUNDS_INSUFFICIENT, http: 402, condition: "Drawdown federal_amount exceeds grant.federal_available (equality allowed)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: assurance certifier == application creator, or drawdown certifier == drawdown preparer (by X-User-ID)" }
  - { id: ERR_CLOSEOUT_BLOCKED, http: 422, condition: "Closeout blocked: pending drawdowns, open phases, OPEN findings, or DISPOSAL_REQUESTED assets" }
  - { id: ERR_FMV_REQUIRED, http: 422, condition: "LAND disposal approval without fair_market_value" }
  - { id: ERR_PROJECT_UNDER_CONTRACT, http: 422, condition: "Dropping a project referenced by a contract" }
  - { id: ERR_PROJECT_IN_ACTIVE_APPLICATION, http: 422, condition: "Dropping a project referenced by an UNDER_REVIEW|OFFERED application" }
  - { id: ERR_EMPTY_SELECTION, http: 422, condition: "Empty or duplicate-containing project_ids / invoice_ids array at creation" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: FAAManager
    description: "Federal program manager: accepts programs, reviews/offers applications, waives assurances, approves amendments/drawdowns/closeouts/disposals, runs checkpoints and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /aip/sponsors"
      - "POST /aip/capital-programs/{programId}/accept"
      - "POST /aip/grant-applications/{applicationId}/return"
      - "POST /aip/grant-applications/{applicationId}/offer"
      - "POST /aip/sponsor-assurances/{assuranceId}/waive"
      - "POST /aip/grant-amendments/{amendmentId}/approve"
      - "POST /aip/grant-amendments/{amendmentId}/reject"
      - "POST /aip/reimbursement-requests/{requestId}/approve"
      - "POST /aip/reimbursement-requests/{requestId}/return"
      - "POST /aip/grants/{grantId}/approve-closeout"
      - "POST /aip/grant-assets/{assetId}/approve-disposal"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run_checkpoint"
    shared_operations: ["all GET endpoints"]
  - name: SponsorStaff
    description: "Airport sponsor staff: builds the CIP, files applications, awards contracts, verifies invoices, plans construction phases, requests closeout/disposal"
    identity: opaque
    exclusive_operations:
      - "POST /aip/facilities"
      - "POST /aip/capital-programs"
      - "POST /aip/capital-programs/{programId}/submit"
      - "POST /aip/capital-programs/{programId}/begin-amendment"
      - "POST /aip/capital-programs/{programId}/apply-selection"
      - "POST /aip/cip-projects"
      - "POST /aip/cip-projects/{projectId}/drop"
      - "POST /aip/grant-applications"
      - "POST /aip/grant-applications/{applicationId}/submit"
      - "POST /aip/grant-applications/{applicationId}/accept-offer"
      - "POST /aip/grant-applications/{applicationId}/decline-offer"
      - "POST /aip/contractors"
      - "POST /aip/contractors/{contractorId}/suspend"
      - "POST /aip/contracts"
      - "POST /aip/invoices/{invoiceId}/verify"
      - "POST /aip/invoices/{invoiceId}/reject"
      - "POST /aip/grants/{grantId}/request-closeout"
      - "POST /aip/grants/{grantId}/amendments"
      - "POST /aip/grant-assets"
      - "POST /aip/grant-assets/{assetId}/request-disposal"
      - "POST /aip/grant-assets/{assetId}/return-to-service"
      - "POST /aip/construction-phases"
      - "POST /aip/construction-phases/{phaseId}/activate"
      - "POST /aip/construction-phases/{phaseId}/complete"
      - "POST /aip/construction-phases/{phaseId}/cancel"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Sponsor-side compliance: certifies assurances and drawdowns, adjudicates DBE reports, resolves audit findings; segregated from creators/preparers by X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /aip/sponsor-assurances/{assuranceId}/certify"
      - "POST /aip/reimbursement-requests/{requestId}/certify"
      - "POST /aip/dbe-reports/{reportId}/adjudicate"
      - "POST /aip/audit-findings/{findingId}/resolve"
    shared_operations: ["all GET endpoints"]
  - name: FinanceOfficer
    description: "Sponsor-side finance: prepares and submits reimbursement requests"
    identity: opaque
    exclusive_operations:
      - "POST /aip/reimbursement-requests"
      - "POST /aip/reimbursement-requests/{requestId}/submit"
    shared_operations: ["all GET endpoints"]
  - name: Auditor
    description: "Independent auditor: opens the closeout audit and records findings"
    identity: opaque
    exclusive_operations:
      - "POST /aip/grants/{grantId}/begin-audit"
      - "POST /aip/audit-findings"
    shared_operations: ["all GET endpoints"]
  - name: Contractor
    description: "Entity-backed contractor: files invoices and DBE reports only against contracts where contract.contractor_id == X-User-ID"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /aip/invoices"
      - "POST /aip/dbe-reports"
    shared_operations: ["all GET endpoints"]
