      - name: member_suspend_drops_project_rejects_record_book
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Project.ACTIVE_to_DROPPED
        distinguishing_aspect: |
          Depth-3 cascade triggered by Member suspend: suspending the Member sets
          eligibility_posture=INELIGIBLE (link 1), which drops the member's ACTIVE Project to
          DROPPED (link 2), and that Project drop itself rejects the non-terminal RecordBook to
          REJECTED (link 3). Each link is caused by the previous, not directly by the suspend.
        test_recipe:
          setup:
            - "ACTIVE member with an ACTIVE project and a DRAFT record book containing one ledger entry"
          setup_api_calls:
            - call: "POST /api/clubs"
