  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: make_available_requires_published_finding_aid
        grounds:
          - state_machines.Item
          - validations[priority=7]
          - errors[ERR_FINDING_AID_NOT_PUBLISHED]
          - entities.Collection.fields.published_finding_aid_present
        distinguishing_aspect: |
          Entity pair Item x FindingAid: the CATALOGED -> AVAILABLE transition is
          gated on the item's COLLECTION having a PUBLISHED finding aid — a
          computed cross-entity field — failing with ERR_FINDING_AID_NOT_PUBLISHED
          while the aid sits IN_REVIEW and succeeding after publish.
        test_recipe:
          setup:
            - "Item I CATALOGED in collection C; C's only finding aid is IN_REVIEW (never published); accession ACCESSIONED; zone OPEN"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 9000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: {}, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Diary" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Diary", condition_grade: "GOOD", appraised_value_cents: 1000, format: "MANUSCRIPT" }, as: Archivist }
          trigger:
            - { call: "POST /items/${i}/make-available", as: Archivist, captures: { err: $.data.error_id } }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist, captures: { st: $.data.status } }
          assert:
            - "first make-available: error_id == ERR_FINDING_AID_NOT_PUBLISHED (${err}); Item stays CATALOGED"
            - "after publish: Collection.${c}.published_finding_aid_present == true"
            - "second make-available succeeds: Item.${i}.status == AVAILABLE (${st})"

      - name: repro_order_blocked_by_deed_embargo
        grounds:
          - state_machines.ReproductionOrder
          - validations[priority=8]
          - errors[ERR_EMBARGO_ACTIVE]
          - entities.DeedOfGift.fields.embargo_until
        distinguishing_aspect: |
          Entity pair ReproductionOrder x DeedOfGift (different pair from the
          Item x FindingAid instance): order creation resolves each item's
          accession's current EXECUTED deed and rejects while its embargo_until
          is in the future; advancing the logical clock to exactly the embargo
          instant releases the gate (embargo_until <= now admits).
        test_recipe:
          setup:
            - "Item I AVAILABLE under an accession whose EXECUTED deed carries embargo_until == 2027-01-01T00:00:00Z; researcher R with APPROVED request over [I]; clock starts at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
            - { call: "POST /accessions", payload: { donor_name: "E. Stone", donor_contact: "s@example.org", accession_date: "2026-07-15", lot_appraised_value_cents: 9000 }, as: Registrar, captures: { a: $.data.id } }
            - { call: "POST /accessions/${a}/submit", as: Registrar }
            - { call: "POST /accessions/${a}/deeds", payload: { embargo_until: "2027-01-01T00:00:00Z" }, as: Registrar, captures: { d: $.data.id } }
            - { call: "GET /accessions/${a}", as: Registrar, captures: { av: $.data.version } }
            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Photos" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Prints", condition_grade: "GOOD", appraised_value_cents: 1000, format: "PHOTOGRAPH" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Mills", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
          trigger:
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_STANDARD", page_estimate: 60, license_class: "PERSONAL", rush: false }, as: Researcher, as_user_id: "${r}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_STANDARD", page_estimate: 60, license_class: "PERSONAL", rush: false }, as: Researcher, as_user_id: "${r}", captures: { o: $.data.id, q: $.data.quoted_fee_cents } }
          assert:
            - "at 2026-08-01: error_id == ERR_EMBARGO_ACTIVE (${err}) — embargo_until 2027-01-01 > now"
            - "at exactly 2027-01-01T00:00:00Z (embargo_until <= now): order created with id ${o}, quoted_fee_cents == 2000 (${q})"

