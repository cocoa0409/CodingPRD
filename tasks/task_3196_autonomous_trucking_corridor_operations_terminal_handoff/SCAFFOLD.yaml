    output: Corridor
    side_effects: ["corridor_status = PLANNED", "posture = FROZEN until launch readiness starts", "check_pass_count = 0", "check_count = 0"]

  - method: GET
    path: "/api/corridors"
    description: "List corridors"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Corridor[]"
    side_effects: []

  - method: GET
    path: "/api/corridors/{id}"
    description: "Get a corridor with its derived posture"
    roles: [Any]
    code: 200
    input: []
    output: Corridor
    side_effects: []

  - method: POST
    path: "/api/corridors/{id}/launch-readiness/start"
    description: "Open launch readiness review for a corridor"
    roles: [CorridorOperationsManager]
    code: 200
    input: []
    output: Corridor
    side_effects:
      - "corridor_status → READINESS_REVIEW"
      - "posture recomputes to RESTRICTED"
      - "check_pass_count recomputes"
      - "launch_authorized_at cleared to null"
      - "reproduces_from = launch_anchor_at on first open only"

  - method: POST
    path: "/api/corridors/{id}/launch-readiness/validate"
    description: "Pass the launch readiness gate and authorize the corridor"
    roles: [CorridorOperationsManager]
    code: 200
    input: [expected_corridor_version]
    output: Corridor
    side_effects:
      - "increments Corridor.version by 1"
      - "corridor_status → ACTIVE"
      - "launch_authorized_at = ledger clock"
      - "posture recomputes; OPEN when weather_risk_score < 40"
      - "each LaunchReadinessCheck in CALIBRATION_PASSED on the corridor moves to VALIDATED"
      - "corridor_readiness_score recomputes"

  - method: POST
    path: "/api/corridors/{id}/launch-readiness/fail"
    description: "Force a corridor into suspension when a blocking incident is open"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_corridor_version]
    output: Corridor
    side_effects:
      - "increments Corridor.version by 1"
      - "corridor_status → SUSPENDED"
      - "posture recomputes to FROZEN"
      - "every non-terminal RunPlan on the corridor moves to ABORTED"
      - "referenced StateAuthority.filing_required_next = true"

  - method: POST
    path: "/api/corridors/{id}/retire"
    description: "Retire a corridor with no run plan on the highway segment"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Corridor
    side_effects:
      - "corridor_status → RETIRED"
      - "posture recomputes to FROZEN"
      - "every non-terminal RunPlan on the corridor moves to ABORTED"
      - "every TerminalServiceWindow on those run plans in REQUESTED or APPROVED moves to CANCELLED"

  - method: GET
    path: "/api/corridors/{id}/launch-readiness-checks"
