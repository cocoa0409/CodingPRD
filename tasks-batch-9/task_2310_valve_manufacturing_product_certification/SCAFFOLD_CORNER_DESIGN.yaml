              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-C601", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-C601", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BONNET", net_weight_kg: 60.250 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/components/${c_id}/dispositions"
              payload: { action: "SCRAP" }
              as: QualityManager
          trigger:
            - call: "POST /valve-mfg/components/${c_id}/dispositions"
              payload: { action: "VOID" }
              as: QualityManager
              captures: { err: $.data.error_id }
