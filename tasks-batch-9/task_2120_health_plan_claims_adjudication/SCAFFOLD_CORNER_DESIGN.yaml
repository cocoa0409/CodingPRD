  # ===========================================================================
  - section: validations
    instances:
      - name: claim_with_an_empty_lines_array_returns_claim_no_lines
        claim_type: violation_to_error
        grounds: ["validations[priority=45]", "errors[ERR_CLAIM_NO_LINES]"]
        distinguishing_aspect: "An intake body whose lines array is empty fails the business_safety check at priority 45 with ERR_CLAIM_NO_LINES (422) and persists no Claim row."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan VAL-1, IN_NETWORK provider, member M-VAL-1 with an open-ended PRIMARY coverage from 2026-01-01."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VAL-1", name: "Validation Plan One", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "3000000001", name: "VAL1 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VAL-1", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-VAL-1", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [] }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CLAIM_NO_LINES"
            - "HTTP status is 422"
            - "GET /adjudication/claims returns total_count == 0"

      - name: reusing_a_member_number_returns_duplicate_member_number
        claim_type: violation_to_error
        grounds: ["validations[priority=62]", "errors[ERR_DUPLICATE_MEMBER_NUMBER]"]
        distinguishing_aspect: "member_number uniqueness is enforced at priority 62, so the second enrolment with member_number M-VAL-2 returns ERR_DUPLICATE_MEMBER_NUMBER (409) and no second accumulator is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan VAL-2 exists and member M-VAL-2 is already enrolled."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VAL-2", name: "Validation Plan Two", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VAL-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VAL-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_DUPLICATE_MEMBER_NUMBER"
            - "HTTP status is 409"
            - "GET /adjudication/members?plan_id=${plan_id} returns total_count == 1"

      - name: republishing_the_same_plan_code_and_effective_date_returns_duplicate_fee_rate
        claim_type: violation_to_error
        grounds: ["validations[priority=62]", "errors[ERR_DUPLICATE_FEE_RATE]"]
        distinguishing_aspect: "The uniqueness key is (plan_id, procedure_code, effective_date), so republishing 73721 at effective 2026-01-01 returns ERR_DUPLICATE_FEE_RATE (409) while publishing it at 2026-02-01 succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan VAL-3 already publishes fee schedule rate 73721 = 40000 effective 2026-01-01."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VAL-3", name: "Validation Plan Three", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
              captures: { rate_id: $.data.id }
          trigger:
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 44000, effective_date: "2026-01-01" }
              as: NetworkManager
              captures: { err_id: $.data.error_id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 44000, effective_date: "2026-02-01" }
              as: NetworkManager
              captures: { rate2_id: $.data.id }
          assert:
            - "${err_id} == ERR_DUPLICATE_FEE_RATE and HTTP status is 409"
            - "The second publication with effective_date 2026-02-01 returns HTTP 201"
            - "GET /adjudication/benefit-plans/${plan_id}/fee-schedule-rates?procedure_code=73721 returns total_count == 2"

      - name: pagination_limit_above_the_maximum_returns_invalid_pagination
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_INVALID_PAGINATION]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit is bounded to [1, 100], so limit=101 returns ERR_INVALID_PAGINATION (400) rather than silently clamping."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no other data is required."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "GET /adjudication/claims"
              payload: { limit: 101, offset: 0 }
              as: ClaimsExaminer
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_PAGINATION"
            - "HTTP status is 400"

      - name: timely_filing_at_exactly_ninety_days_is_accepted_and_ninety_one_is_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=54]", "errors[ERR_TIMELY_FILING_EXCEEDED]", "entities.BenefitPlan.fields.timely_filing_days"]
        distinguishing_aspect: "With timely_filing_days 90 and statement_to_date 2026-02-10, a claim received at 2026-05-11 (exactly 90 whole days) is ACCEPTED, while the same claim received at 2026-05-12 (91 days) returns ERR_TIMELY_FILING_EXCEEDED."
        test_recipe:
          setup:
            - "Plan VAL-5 with timely_filing_days 90, IN_NETWORK provider, fee schedule rate 99213 = 10000, member M-VAL-5 with an open-ended PRIMARY coverage from 2026-01-01."
            - "The logical clock starts at 2026-05-11T00:00:00Z, exactly 90 whole days after 2026-02-10."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VAL-5", name: "Validation Plan Five", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0, timely_filing_days: 90 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "3000000005", name: "VAL5 Clinic", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "99213", allowed_amount_cents: 10000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VAL-5", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-VAL-5A", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { ca_id: $.data.id, ca_st: $.data.status }
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-VAL-5B", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 20000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${ca_st} == RECEIVED and the 90-day claim was created with HTTP 201"
            - "${err_id} == ERR_TIMELY_FILING_EXCEEDED and HTTP status is 422"
            - "GET /adjudication/claims?member_id=${mem_id} returns total_count == 1"

      - name: accumulator_adjustment_below_zero_returns_accumulator_negative
        claim_type: violation_to_error
        grounds: ["validations[priority=72]", "errors[ERR_ACCUMULATOR_NEGATIVE]", "entities.BenefitAccumulator.fields.oop_applied_cents"]
        distinguishing_aspect: "A -1 cent out-of-pocket delta against a zeroed accumulator returns ERR_ACCUMULATOR_NEGATIVE (422) and leaves both counters at 0 and version unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan VAL-6 and member M-VAL-6 exist, so the plan_year 2026 accumulator sits at 0 / 0 with version 1."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VAL-6", name: "Validation Plan Six", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VAL-6", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "GET /adjudication/members/${mem_id}/accumulators"
              payload: {}
              as: PlanAdmin
              captures: { acc_id: "$.data[0].id", acc_v: "$.data[0].version" }
          trigger:
            - call: "POST /adjudication/accumulators/${acc_id}/adjustments"
              payload: { expected_accumulator_version: "${acc_v}", deductible_delta_cents: 0, oop_delta_cents: -1 }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_ACCUMULATOR_NEGATIVE"
            - "HTTP status is 422"
            - "GET /adjudication/members/${mem_id}/accumulators still shows deductible_applied_cents == 0, oop_applied_cents == 0 and version == 1"

      - name: contract_without_contract_pct_returns_invalid_field_value
        claim_type: conditional_validation
        grounds: ["validations[priority=21]", "errors[ERR_INVALID_FIELD_VALUE]", "entities.ProviderContract.fields.contract_pct"]
        distinguishing_aspect: "contract_pct is conditionally required: omitting it while pricing_method is PCT_OF_FEE_SCHEDULE returns ERR_INVALID_FIELD_VALUE (400), whereas omitting it with pricing_method CASE_RATE and a supplied case_rate_cents succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan VAL-7 and IN_NETWORK provider VAL7 Group exist with no contracts."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VAL-7", name: "Validation Plan Seven", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /adjudication/providers"
              payload: { npi: "3000000007", name: "VAL7 Group", network_status: "IN_NETWORK" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-06-30", pricing_method: "PCT_OF_FEE_SCHEDULE" }
              as: NetworkManager
              captures: { err_id: $.data.error_id }
            - call: "POST /adjudication/contracts"
              payload: { provider_id: "${prov_id}", plan_id: "${plan_id}", effective_date: "2026-01-01", term_date: "2026-06-30", pricing_method: "CASE_RATE", case_rate_cents: 50000 }
              as: NetworkManager
              captures: { ctr_id: $.data.id, ctr_method: $.data.pricing_method }
          assert:
            - "${err_id} == ERR_INVALID_FIELD_VALUE and HTTP status is 400"
            - "${ctr_method} == CASE_RATE and the second create returns HTTP 201"
            - "GET /adjudication/contracts?provider_id=${prov_id} returns total_count == 1"

      - name: claim_for_a_member_with_no_coverage_rows_returns_member_no_coverage
        claim_type: cross_entity_validation
        grounds: ["validations[priority=60]", "errors[ERR_MEMBER_NO_COVERAGE]"]
        distinguishing_aspect: "Priority 60 requires at least one MemberCoverage row of any status; a member with zero coverage rows fails intake with ERR_MEMBER_NO_COVERAGE (422) before any pricing or duplicate screening runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; plan VAL-8, IN_NETWORK provider and member M-VAL-8 exist, and M-VAL-8 has NO coverage segments at all."
          setup_api_calls:
