          assert:
            - "roy_300 == 1310 (10 * 131; 300s is still the flat tier — boundary is inclusive)"
            - "roy_301 == 15120 (10 * max(131, 252 * ceil(301/60)=6) = 10 * 1512)"

      - name: claim_validation_hold_expiry_boundary
        grounds:
          - validations[priority=19]
          - entities.RoyaltyAccrual.fields.hold_expires_at
        distinguishing_aspect: |
          Different metric (a datetime deadline, not a duration) through a
          different endpoint (claim validate, not line create): a claim
          validated with the clock at exactly hold_expires_at is REJECTED
