          - validations[priority=21]
        distinguishing_aspect: |
          Capacity-count boundary on PickupSlot via POST /orders/{id}/submit: with capacity
          2, booking the 2nd order (booked_count 1 -> 2, the capacity-1 -> capacity edge)
          succeeds and flips fill_status to FULL; the 3rd booking at booked_count == capacity
          is rejected with ERR_SLOT_FULL. Metric: slot occupancy count.
