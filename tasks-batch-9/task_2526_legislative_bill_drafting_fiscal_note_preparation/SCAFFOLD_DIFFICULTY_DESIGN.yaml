# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2526
# Legislative Bill Drafting & Fiscal Note Preparation
#
# 9 rule_id blocks x >= 2 instances. Every numeric literal in an `assert:` line
# was produced by executing the corresponding §1.3 formula in Python against the
# inputs pinned in the same instance's setup chain.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fiscal_note_incremental_cost_vs_full_absorption_diverge_on_identical_lines
        grounds:
          - calculations.fiscal_note_cost_total
          - entities.FiscalNoteRequest.fields.methodology
          - entities.FiscalNoteRequest.fields.direct_cost_cents
          - entities.FiscalNoteRequest.fields.certified_total_cents
          - entities.CostEstimate.fields.fte_count
          - state_machines.FiscalNoteRequest.ROUTED_to_SUBMITTED
        distinguishing_aspect: |
          Two fiscal note requests carrying byte-identical BASELINE cost lines but
          opposite `methodology` values produce different certified_total_cents
          (26568000 under INCREMENTAL_COST versus 42675120 under FULL_ABSORPTION),
          because INCREMENTAL_COST drops the sub-0.5-FTE line's personnel cost and
          applies no 18.5% indirect overhead — a 16107120-cent divergence on the
          FiscalNoteRequest entity domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one CONVENED session with required_fiscal_years [2027, 2028]."
            - "Two introduced HOUSE bills, each with appropriation_requested_cents 12000000 so fiscal_status is NOTE_PENDING."
            - "Bill A carries a ROUTED note with methodology INCREMENTAL_COST; bill B carries a ROUTED note with methodology FULL_ABSORPTION."
            - "Both notes hold the SAME two BASELINE lines in revision_round 0: FY2027 personnel 14000000 / operating 4100000 / one_time 3000000 / fte 1.0, and FY2028 personnel 10400000 / operating 3500000 / one_time 0 / fte 0.4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 4 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 4 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Dept of Revenue", agency_code: "DOR", status: "ACTIVE", max_open_requests: 3 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Transit capital funding", summary: "Appropriate transit capital funds.", requested_sections_count: 6, target_code_chapter: "Title 12", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 12000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_a_id: $.data.id }
            - call: "POST /drafting-requests/${dr_a_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-02T00:00:00Z", engagement_end_utc: "2026-09-05T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr_a_id}/complete-research"
              payload: { affected_sections_count: 9 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr_a_id}/certify-draft"
              payload: { style_findings_count: 0 }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr_a_id}" }
              as: Clerk
              captures: { b_a_id: $.data.id }
            - call: "POST /bills/${b_a_id}/fiscal-note-requests"
              payload: { agency_id: "${ag_id}", methodology: "INCREMENTAL_COST" }
              as: FiscalOfficer
              captures: { fnr_a_id: $.data.id, fnr_a_v: $.data.version }
            - call: "POST /fiscal-note-requests/${fnr_a_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${fnr_a_v}", fiscal_year: 2027, scenario: "BASELINE", personnel_cost_cents: 14000000, operating_cost_cents: 4100000, one_time_cost_cents: 3000000, fte_count: 1.0, revenue_impact_cents: 3333333, assumption_note: "Two new inspectors, full year." }
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
            - call: "GET /fiscal-note-requests/${fnr_a_id}"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
              captures: { fnr_a_v2: $.data.version }
            - call: "POST /fiscal-note-requests/${fnr_a_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${fnr_a_v2}", fiscal_year: 2028, scenario: "BASELINE", personnel_cost_cents: 10400000, operating_cost_cents: 3500000, one_time_cost_cents: 0, fte_count: 0.4, revenue_impact_cents: 1000000, assumption_note: "Residual part-time support absorbed by existing staff." }
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Transit operating funding", summary: "Appropriate transit operating funds.", requested_sections_count: 6, target_code_chapter: "Title 12", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 12000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_b_id: $.data.id }
            - call: "POST /drafting-requests/${dr_b_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-06T00:00:00Z", engagement_end_utc: "2026-09-09T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr_b_id}/complete-research"
              payload: { affected_sections_count: 9 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr_b_id}/certify-draft"
              payload: { style_findings_count: 0 }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr_b_id}" }
              as: Clerk
              captures: { b_b_id: $.data.id }
            - call: "POST /bills/${b_b_id}/fiscal-note-requests"
              payload: { agency_id: "${ag_id}", methodology: "FULL_ABSORPTION" }
              as: FiscalOfficer
              captures: { fnr_b_id: $.data.id, fnr_b_v: $.data.version }
            - call: "POST /fiscal-note-requests/${fnr_b_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${fnr_b_v}", fiscal_year: 2027, scenario: "BASELINE", personnel_cost_cents: 14000000, operating_cost_cents: 4100000, one_time_cost_cents: 3000000, fte_count: 1.0, revenue_impact_cents: 3333333, assumption_note: "Two new inspectors, full year." }
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
            - call: "GET /fiscal-note-requests/${fnr_b_id}"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
              captures: { fnr_b_v2: $.data.version }
            - call: "POST /fiscal-note-requests/${fnr_b_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${fnr_b_v2}", fiscal_year: 2028, scenario: "BASELINE", personnel_cost_cents: 10400000, operating_cost_cents: 3500000, one_time_cost_cents: 0, fte_count: 0.4, revenue_impact_cents: 1000000, assumption_note: "Residual part-time support absorbed by existing staff." }
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /fiscal-note-requests/${fnr_a_id}/submit"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
            - call: "POST /fiscal-note-requests/${fnr_b_id}/submit"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
          assert:
            - "FiscalNoteRequest.${fnr_a_id}.direct_cost_cents == 24600000"
            - "FiscalNoteRequest.${fnr_a_id}.contingency_pct == 0.08"
            - "FiscalNoteRequest.${fnr_a_id}.contingency_cents == 1968000"
            - "FiscalNoteRequest.${fnr_a_id}.certified_total_cents == 26568000"
            - "FiscalNoteRequest.${fnr_b_id}.direct_cost_cents == 39514000"
            - "FiscalNoteRequest.${fnr_b_id}.contingency_pct == 0.08"
            - "FiscalNoteRequest.${fnr_b_id}.contingency_cents == 3161120"
            - "FiscalNoteRequest.${fnr_b_id}.certified_total_cents == 42675120"
            - "FiscalNoteRequest.${fnr_b_id}.certified_total_cents - FiscalNoteRequest.${fnr_a_id}.certified_total_cents == 16107120"
            - "Both notes are in status SUBMITTED and both have late_submission == false"

      - name: drafting_complexity_intake_estimate_vs_post_research_actual_diverge
        grounds:
          - calculations.drafting_complexity_score
          - entities.DraftingRequest.fields.intake_complexity_estimate
          - entities.DraftingRequest.fields.actual_complexity_score
          - entities.DraftingRequest.fields.requested_sections_count
          - entities.DraftingRequest.fields.affected_sections_count
          - state_machines.DraftingRequest.RESEARCH_to_DRAFTING
        distinguishing_aspect: |
          On the SAME DraftingRequest row the INTAKE_ESTIMATE variant yields 59 while
          the POST_RESEARCH_ACTUAL variant yields 71, because the intake variant scores
          the member-declared 6 sections plus a 15-point appropriation tier bonus and no
          conflict terms, while the post-research variant scores the researched 9
          sections plus 2 ADVISORY and 1 BLOCKING conflicts and drops the appropriation
          bonus entirely — a different entity domain (DraftingRequest, effort scoring)
          from the FiscalNoteRequest money variant above.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one CONVENED session."
            - "A CONFIDENTIAL, priority drafting request with requested_sections_count 6 and appropriation_requested_cents 12000000, assigned to Drafter One and in RESEARCH."
            - "Three conflicts already filed while the request is still in RESEARCH: two ADVISORY and one BLOCKING, so no status move has occurred."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Confidential tax restructuring", summary: "Restructure the franchise tax.", requested_sections_count: 6, target_code_chapter: "Title 39", confidentiality: "CONFIDENTIAL", priority_flag: true, appropriation_requested_cents: 12000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_id: $.data.id, intake_score: $.data.intake_complexity_estimate }
            - call: "POST /drafting-requests/${dr_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-02T00:00:00Z", engagement_end_utc: "2026-09-30T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /statutory-conflicts"
              payload: { drafting_request_id: "${dr_id}", code_citation: "39-22-104", conflict_type: "STYLE_VIOLATION", severity: "ADVISORY" }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /statutory-conflicts"
              payload: { drafting_request_id: "${dr_id}", code_citation: "39-22-105", conflict_type: "DUPLICATE_ENACTMENT", severity: "ADVISORY" }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /statutory-conflicts"
              payload: { drafting_request_id: "${dr_id}", code_citation: "39-22-301", conflict_type: "AMENDS_SAME_SECTION", severity: "BLOCKING" }
              as: Drafter
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /drafting-requests/${dr_id}/complete-research"
              payload: { affected_sections_count: 9 }
              as: Drafter
              as_user_id: "${d1_id}"
          assert:
            - "DraftingRequest.${dr_id}.intake_complexity_estimate == 59"
            - "DraftingRequest.${dr_id}.actual_complexity_score == 71"
            - "DraftingRequest.${dr_id}.advisory_conflict_count == 2"
            - "DraftingRequest.${dr_id}.blocking_conflict_count == 1"
            - "DraftingRequest.${dr_id}.status == DRAFTING"
            - "DraftingRequest.${dr_id}.intake_complexity_estimate is unchanged by complete-research and still equals ${intake_score}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: revenue_projection_rounds_each_fiscal_year_before_summing
        grounds:
          - calculations.multi_year_revenue_projection
          - entities.FiscalNoteRequest.fields.projected_revenue_total_cents
          - entities.FiscalNoteRequest.fields.high_scenario_total_cents
          - entities.FiscalNoteRequest.fields.low_scenario_total_cents
          - entities.CostEstimate.fields.revenue_impact_cents
          - entities.Session.fields.required_fiscal_years
        distinguishing_aspect: |
          Mode (b) nested rounding: with a BASELINE base-year revenue_impact_cents of
          3333333 and GROWTH_RATE 0.0325 over a 4-year horizon, rounding each fiscal
          year to whole cents and then summing gives 13997529, whereas summing the exact
          rationals and rounding once gives 13997530 — the scaffold pins the per-year
          order, so the single-cent difference is the observable proof of which order ran.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one CONVENED session with required_fiscal_years [2027, 2028]."
            - "One introduced HOUSE bill with a ROUTED INCREMENTAL_COST note in revision_round 0."
            - "Three BASELINE/LOW lines filed: FY2027 BASELINE with revenue_impact_cents 3333333, FY2028 BASELINE with revenue_impact_cents 1000000, and NO HIGH line at all (so the HIGH base is derived) and NO LOW line at all (so the LOW base is derived too)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Dept of Revenue", agency_code: "DOR", status: "ACTIVE", max_open_requests: 3 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Severance tax rebasing", summary: "Rebase the severance tax schedule.", requested_sections_count: 4, target_code_chapter: "Title 39", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 12000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /drafting-requests/${dr_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-02T00:00:00Z", engagement_end_utc: "2026-09-05T00:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr_id}/complete-research"
              payload: { affected_sections_count: 4 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr_id}/certify-draft"
              payload: { style_findings_count: 0 }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr_id}" }
              as: Clerk
              captures: { b_id: $.data.id }
            - call: "POST /bills/${b_id}/fiscal-note-requests"
              payload: { agency_id: "${ag_id}", methodology: "INCREMENTAL_COST" }
              as: FiscalOfficer
              captures: { fnr_id: $.data.id, fnr_v: $.data.version }
            - call: "POST /fiscal-note-requests/${fnr_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${fnr_v}", fiscal_year: 2027, scenario: "BASELINE", personnel_cost_cents: 14000000, operating_cost_cents: 4100000, one_time_cost_cents: 3000000, fte_count: 1.0, revenue_impact_cents: 3333333, assumption_note: "Base-year net revenue gain." }
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
            - call: "GET /fiscal-note-requests/${fnr_id}"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
              captures: { fnr_v2: $.data.version }
            - call: "POST /fiscal-note-requests/${fnr_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${fnr_v2}", fiscal_year: 2028, scenario: "BASELINE", personnel_cost_cents: 10400000, operating_cost_cents: 3500000, one_time_cost_cents: 0, fte_count: 0.4, revenue_impact_cents: 1000000, assumption_note: "Out-year figure, not used to seed the curve." }
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /fiscal-note-requests/${fnr_id}/submit"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${ag_id}"
          assert:
            - "FiscalNoteRequest.${fnr_id}.projected_revenue_total_cents == 13997529"
            - "FiscalNoteRequest.${fnr_id}.projected_revenue_total_cents != 13997530"
            - "FiscalNoteRequest.${fnr_id}.high_scenario_total_cents == 16097159"
            - "FiscalNoteRequest.${fnr_id}.low_scenario_total_cents == 11897899"
            - "The FY2028 BASELINE revenue_impact_cents of 1000000 does NOT appear in any of the three totals"
            - "FiscalNoteRequest.${fnr_id}.status == SUBMITTED"

      - name: contingency_tier_selected_after_indirect_overhead_folds_into_direct_subtotal
        grounds:
          - calculations.fiscal_note_cost_total
          - entities.FiscalNoteRequest.fields.direct_cost_cents
          - entities.FiscalNoteRequest.fields.contingency_pct
          - entities.FiscalNoteRequest.fields.contingency_cents
          - entities.FiscalNoteRequest.fields.certified_total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the raw
          line sum is exactly 10000000, which alone would select the 0.05 tier, but the
          18.5% indirect overhead of 1480000 is folded into direct_cost_cents FIRST,
          making it 11480000 and selecting 0.08 — so contingency_cents is 918400 and the
          certified_total_cents is 12398400 rather than the 10500000 a
          tier-before-overhead order would produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one CONVENED session with required_fiscal_years [2027, 2028]."
            - "One introduced HOUSE bill with a ROUTED FULL_ABSORPTION note in revision_round 0."
            - "Two BASELINE lines, both with fte_count 1.0 so the FTE filter is inert: FY2027 personnel 5000000 / operating 1000000 / one_time 0, and FY2028 personnel 3000000 / operating 1000000 / one_time 0. Raw sum is exactly the 10000000 tier-1 ceiling."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /members"
              payload: { full_name: "Rep Alpha", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Dept of Corrections", agency_code: "DOC", status: "ACTIVE", max_open_requests: 3 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Reentry services expansion", summary: "Expand reentry case management.", requested_sections_count: 3, target_code_chapter: "Title 17", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 9000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /drafting-requests/${dr_id}/assign"
