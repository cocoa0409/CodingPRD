# =============================================================================
# Scaffold: Best Execution & Trade Surveillance (broker-dealer surveillance unit)
# =============================================================================

scenario: |
  Best Execution & Trade Surveillance (broker-dealer surveillance unit): execution
  quality metrics by venue & order type, periodic best-execution committee review,
  order routing arrangement & payment for order flow disclosure, surveillance alerts
  (front running/marking the close) & case review, employee trading & personal
  account monitoring, communications review & lexicon tuning, regulatory reporting
  of exceptions, policy update & training

domain_name: best-execution-trade-surveillance
api_prefix: /surveillance

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on arrangement amend / disclosure revise / lexicon patch
    - cascading_side_effects        # review publish -> venue -> arrangement -> order; lexicon retune -> rescore -> escalate -> case
    - dual_variant_calculation      # FAR_TOUCH vs MIDPOINT quality; MARGINAL vs RETROACTIVE PFOF tiers
    - rate_threshold_triggers       # alert score gate at 50; comm lexicon tiering at 40/100
    - derived_field_reconciliation  # PROVISIONAL snapshots recompute on read; LOCKED freeze
    - ops_run_checkpoint            # POST /ops/runs flips restricted entries, preclearances, attestations, training
    - version_pinning_on_approval   # disclosure lines pin arrangement versions at submit; staleness checked at publish
  entity_topology: flat             # peer entities with FK references; sub-resource reads for FK reversal
  state_machine_shape: parallel     # Employee (employment x attestation) and SurveillanceCase (review x filing); many cycles
  relationship_patterns:
    - one_to_many
    - self_referential              # PfofDisclosure.supersedes_id -> PfofDisclosure.id
    - cross_aggregate               # alerts link employee + order + trade + case
  role_model: segregation_of_duties # review creator cannot vote; employee requests, compliance decides
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: employee_ref, type: string, source: input, description: "External HR reference, unique across employees", constraints: "unique; duplicate -> ERR_DUPLICATE_EMPLOYEE_REF" }
      - { name: department, type: enum, source: input, description: "TRADING | OPERATIONS | COMPLIANCE | EXECUTIVE" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | TERMINATED; initial ACTIVE; parallel dimension 1" }
      - { name: attestation_status, type: enum, source: system, description: "CURRENT | DUE | LAPSED; parallel dimension 2; initial value computed at creation from attestation_due_at vs logical clock" }
      - { name: attestation_due_at, type: datetime, source: input, description: "Attestation deadline supplied at creation; refreshed to now+365d by attest action" }
      - { name: last_attested_at, type: datetime, source: system, description: "Timestamp of last successful attest action; null until first attest" }
      - { name: open_case_count, type: integer, source: computed, description: "Count of SurveillanceCase with subject_employee_id = this employee and review_status IN {OPEN, UNDER_INVESTIGATION, REOPENED}; recomputed on read" }
      - { name: training_overdue_count, type: integer, source: computed, description: "Count of TrainingAssignment with employee_id = this employee and status = OVERDUE; recomputed on read" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: venue_code, type: string, source: input, description: "Unique venue code, e.g. NYSE, ARCA, XATS", constraints: "unique; duplicate -> ERR_DUPLICATE_VENUE_CODE" }
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: venue_type, type: enum, source: input, description: "EXCHANGE | ATS | MARKET_MAKER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE; cyclic; SUSPENDED reachable manually or via best-ex review cascade" }

  - name: RoutingArrangement
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; arrangement governs routing to this venue" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, half-open [effective_from, effective_to)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; must be > effective_from else ERR_INVALID_WINDOW" }
      - { name: pfof_tiers, type: array, source: input, description: "Tier table [{min_monthly_shares: integer, rate_cents_per_share: number}] sorted ascending by min_monthly_shares; first entry must have min_monthly_shares = 0" }
      - { name: routing_fee_bps, type: number, source: input, description: "Explicit routing fee in basis points, informational" }
      - { name: status, type: enum, source: system, description: "NEGOTIATION | ACTIVE | SUSPENDED | TERMINATED; initial NEGOTIATION; ACTIVE<->SUSPENDED cycle" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: client_ref, type: string, source: input, description: "Client-side order reference from drop-copy feed" }
      - { name: symbol, type: string, source: input, description: "Instrument symbol" }
      - { name: side, type: enum, source: input, description: "BUY | SELL" }
      - { name: quantity, type: integer, source: input, description: "Order quantity in shares, must be > 0" }
      - { name: order_type, type: enum, source: input, description: "MARKET | LIMIT | MARKET_ON_CLOSE" }
      - { name: limit_price_cents, type: integer, source: input, description: "Limit price; required iff order_type = LIMIT, forbidden otherwise (ERR_LIMIT_PRICE_REQUIRED)" }
      - { name: arrival_nbbo_bid_cents, type: integer, source: input, description: "NBBO bid at order arrival, integer cents, > 0" }
      - { name: arrival_nbbo_ask_cents, type: integer, source: input, description: "NBBO ask at order arrival, integer cents, must be > bid" }
      - { name: arrangement_id, type: string, source: input, description: "FK -> RoutingArrangement.id; supplied on the ROUTED transition; null while RECEIVED" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ROUTED | EXECUTED | CANCELLED; initial RECEIVED" }
      - { name: routed_at, type: datetime, source: system, description: "Logical-clock timestamp of ROUTED transition; null until routed" }
      - { name: executed_price_cents, type: integer, source: input, description: "Execution price supplied on EXECUTED transition; full fills only (executed quantity always equals quantity)" }
      - { name: executed_at, type: datetime, source: input, description: "Execution timestamp supplied on EXECUTED transition; must be >= created_at and <= logical now (ERR_EXECUTION_WINDOW_VIOLATION)" }

  - name: ExecutionQualitySnapshot
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; metrics scoped to this venue" }
      - { name: order_type, type: enum, source: input, description: "MARKET | LIMIT | MARKET_ON_CLOSE; metric bucket" }
      - { name: period_month, type: string, source: input, description: "Calendar month key, format YYYY-MM; scope = [first instant of month, first instant of next month)" }
      - { name: variant, type: enum, source: input, description: "FAR_TOUCH | MIDPOINT benchmark; pinned at creation, immutable" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | LOCKED; initial PROVISIONAL; PROVISIONAL recomputes metrics on every read, LOCKED freezes them" }
      - { name: order_count, type: integer, source: computed, description: "Count of in-scope orders (see calc_execution_quality input set)" }
      - { name: total_quantity, type: integer, source: computed, description: "Sum of quantity over in-scope orders" }
      - { name: total_improvement_cents, type: number, source: computed, description: "Sum of per-order line improvements under the pinned variant; 2 decimal places" }
      - { name: avg_improvement_cents_per_share, type: number, source: computed, description: "round_half_up(total_improvement_cents / total_quantity, 4dp); 0 when total_quantity = 0" }

  - name: PfofDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: quarter, type: string, source: input, description: "Calendar quarter key, format YYYY-Qn; Q1 = [Jan 1, Apr 1), Q2 = [Apr 1, Jul 1), Q3 = [Jul 1, Oct 1), Q4 = [Oct 1, next Jan 1)" }
      - { name: pricing_variant, type: enum, source: input, description: "MARGINAL | RETROACTIVE tier evaluation mode; pinned at creation, immutable" }
      - { name: revision_number, type: integer, source: system, description: "1 for the first disclosure of a quarter; +1 per revise" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> PfofDisclosure.id; set on revisions created by revise; null on revision_number = 1" }
      - { name: has_pending_revision, type: boolean, source: system, description: "Set true on the source disclosure by revise; audit marker, default false" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | PUBLISHED | SUPERSEDED; initial DRAFT; PENDING_APPROVAL -> DRAFT withdraw cycle allowed" }
      - { name: venue_lines, type: array, source: computed, description: "Per-venue lines [{venue_id, arrangement_id, arrangement_version, total_shares, pfof_cents}]; DRAFT computes on read; frozen at submit with arrangement versions pinned" }
      - { name: total_pfof_cents, type: integer, source: computed, description: "Sum of venue_lines.pfof_cents (line-level integer cents summed after per-line rounding)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of DRAFT -> PENDING_APPROVAL; null until submitted" }

  - name: BestExReview
    parent: null
    common_fields: true
    fields:
      - { name: quarter, type: string, source: input, description: "Calendar quarter under review, format YYYY-Qn" }
      - { name: snapshot_ids, type: array, source: input, description: "Array of ExecutionQualitySnapshot id values referenced as evidence (reference list, not a scalar FK); all must be LOCKED at submit" }
      - { name: venue_decisions, type: array, source: input, description: "Array of {venue_id, determination: CONTINUE | MODIFY | TERMINATE_ROUTING}; must cover every ACTIVE venue at submit" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the BestExAnalyst creator; recorded at creation; segregation-of-duties anchor" }
      - { name: voter_user_ids, type: array, source: system, description: "Distinct X-User-ID values that have cast APPROVE votes while IN_COMMITTEE; cleared on return-to-DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_COMMITTEE | APPROVED | PUBLISHED; IN_COMMITTEE -> DRAFT rework cycle; auto-APPROVED on 3rd qualifying vote" }

  - name: SurveillanceAlert
    parent: null
    common_fields: true
    fields:
      - { name: alert_type, type: enum, source: system, description: "FRONT_RUNNING | MARKING_THE_CLOSE; set by the detection that created the alert" }
      - { name: subject_employee_id, type: string, source: system, description: "FK -> Employee.id; subject for FRONT_RUNNING alerts; null for MARKING_THE_CLOSE" }
      - { name: related_order_id, type: string, source: system, description: "FK -> Order.id; the client order whose execution triggered detection" }
      - { name: related_trade_id, type: string, source: system, description: "FK -> PersonalTrade.id; set for FRONT_RUNNING; null for MARKING_THE_CLOSE" }
      - { name: case_id, type: string, source: system, description: "FK -> SurveillanceCase.id; set when the alert is escalated (linked to existing open case or newly created case); null until escalated" }
      - { name: score, type: integer, source: computed, description: "Detection score computed at creation (calc_front_running_score / marking-the-close score); immutable thereafter" }
      - { name: score_inputs, type: object, source: computed, description: "Audit echo of score factors {delta_seconds, size_ratio, same_side} or {deviation_bps}" }
      - { name: status, type: enum, source: system, description: "NEW | ACKNOWLEDGED | ESCALATED | CLOSED_FALSE_POSITIVE; ESCALATED -> ACKNOWLEDGED occurs only as case-reopen compensation" }

  - name: SurveillanceCase
    parent: null
    common_fields: true
    fields:
      - { name: subject_employee_id, type: string, source: system, description: "FK -> Employee.id; case subject (alert subject or comm author); null for venue-level MARKING_THE_CLOSE cases" }
      - { name: opened_from, type: enum, source: system, description: "ALERT | COMM_REVIEW; provenance of case creation" }
      - { name: source_comm_item_id, type: string, source: system, description: "FK -> CommReviewItem.id; set when opened_from = COMM_REVIEW; null otherwise" }
      - { name: linked_alert_ids, type: array, source: system, description: "Array of SurveillanceAlert id values escalated into this case (reference list, not a scalar FK)" }
      - { name: review_status, type: enum, source: system, description: "OPEN | UNDER_INVESTIGATION | DISPOSITIONED | REOPENED; parallel dimension 1; DISPOSITIONED -> REOPENED -> UNDER_INVESTIGATION cycle" }
      - { name: disposition, type: enum, source: input, description: "VIOLATION_CONFIRMED | UNFOUNDED; supplied on the DISPOSITIONED transition; cleared on reopen" }
      - { name: dispositioned_at, type: datetime, source: system, description: "Logical-clock timestamp of disposition; null otherwise" }
      - { name: filing_status, type: enum, source: system, description: "NOT_REQUIRED | DRAFT | SUBMITTED | ACKNOWLEDGED; parallel dimension 2; SUBMITTED -> DRAFT rejection cycle" }
      - { name: filing_due_at, type: datetime, source: system, description: "dispositioned_at + 30 days, set when disposition = VIOLATION_CONFIRMED; cleared on reopen" }
      - { name: filing_submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of latest DRAFT -> SUBMITTED filing transition" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Regulatory late fee computed at each filing submit (calc_late_filing_fee); 0 when filed on or before filing_due_at" }

  - name: PersonalTrade
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; taken from X-User-ID of the CoveredEmployee creator, never from the request body" }
      - { name: symbol, type: string, source: input, description: "Instrument symbol" }
      - { name: side, type: enum, source: input, description: "BUY | SELL" }
      - { name: quantity, type: integer, source: input, description: "Share quantity, > 0" }
      - { name: status, type: enum, source: system, description: "PRECLEARANCE_REQUESTED | APPROVED | DENIED | EXECUTION_REPORTED | RECONCILED | EXPIRED; initial PRECLEARANCE_REQUESTED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of APPROVED/DENIED decision" }
      - { name: denial_reason, type: string, source: input, description: "Optional reason recorded when decision = DENIED" }
      - { name: expires_at, type: datetime, source: system, description: "decided_at + 48h, set on APPROVED; ops run flips APPROVED -> EXPIRED past this instant" }
      - { name: executed_price_cents, type: integer, source: input, description: "Reported execution price, supplied on EXECUTION_REPORTED" }
      - { name: executed_at, type: datetime, source: input, description: "Reported execution timestamp; must lie in [decided_at, expires_at] else ERR_EXECUTION_WINDOW_VIOLATION" }
      - { name: reconciled_at, type: datetime, source: system, description: "Logical-clock timestamp of RECONCILED transition" }

  - name: RestrictedListEntry
    parent: null
    common_fields: true
    fields:
      - { name: symbol, type: string, source: input, description: "Restricted symbol" }
      - { name: restriction_kind, type: enum, source: input, description: "ALL | EMPLOYEE_ONLY | CLIENT_ONLY; EMPLOYEE_ONLY blocks preclearance, CLIENT_ONLY blocks client order routing, ALL blocks both" }
      - { name: effective_from, type: datetime, source: input, description: "Window start; must be strictly in the future at creation (else ERR_INVALID_WINDOW)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end; must be > effective_from (else ERR_INVALID_WINDOW)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | EXPIRED; initial SCHEDULED; all transitions fired by ops run against the logical clock" }

  - name: CommReviewItem
    parent: null
    common_fields: true
    fields:
      - { name: channel, type: enum, source: input, description: "EMAIL | CHAT" }
      - { name: author_employee_id, type: string, source: input, description: "FK -> Employee.id; message author" }
      - { name: body_text, type: string, source: input, description: "Captured message body scanned against the ACTIVE lexicon policy" }
      - { name: captured_at, type: datetime, source: system, description: "Logical-clock capture timestamp" }
      - { name: score, type: integer, source: computed, description: "Sum of weights of matching terms in the ACTIVE lexicon policy (calc_lexicon_score); recomputed for QUEUED items on lexicon retune" }
      - { name: matched_terms, type: array, source: computed, description: "Terms that matched, audit echo" }
      - { name: scored_policy_version, type: integer, source: computed, description: "LexiconPolicy.version that produced the current score; audit value" }
      - { name: status, type: enum, source: system, description: "QUEUED | IN_REVIEW | CLEARED | ESCALATED; initial tier assigned at capture: score >= 100 -> ESCALATED, 40 <= score < 100 -> QUEUED, score < 40 -> CLEARED" }

  - name: LexiconPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Policy set name" }
      - { name: terms, type: array, source: input, description: "Array of {term: string, weight: integer 1..100}; matching is case-insensitive substring, each term counts at most once per item" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED; initial DRAFT; at most one ACTIVE policy fleet-wide (activating one retires the previous ACTIVE)" }

  - name: CompliancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: policy_code, type: string, source: input, description: "Stable policy identifier, e.g. PAT (personal account trading); multiple DRAFTs per code allowed, at most one EFFECTIVE per code" }
      - { name: title, type: string, source: input, description: "Policy title" }
      - { name: version_label, type: string, source: input, description: "Human version label, e.g. v2026.1" }
      - { name: status, type: enum, source: system, description: "DRAFT | EFFECTIVE | SUPERSEDED; initial DRAFT; publishing a DRAFT supersedes the prior EFFECTIVE policy of the same code" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; assignment target (every ACTIVE employee at publish time)" }
      - { name: policy_id, type: string, source: system, description: "FK -> CompliancePolicy.id; the policy version assigned" }
      - { name: due_date, type: datetime, source: system, description: "policy publish timestamp + 30 days" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | OVERDUE | COMPLETED | CANCELLED; initial ASSIGNED; ASSIGNED -> OVERDUE via ops run past due_date; CANCELLED via supersede cascade or employee termination" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }

# =============================================================================
# §1.2 State Machine Table (17 machines; Employee and SurveillanceCase carry
# two parallel dimensions each)
# =============================================================================
state_machines:
  - entity: Employee
    dimension: employment_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /surveillance/employees/{id}/employment-transition (to_status=ON_LEAVE)"
        actor: ComplianceAdmin
        preconditions: ["employment_status == ACTIVE"]
        side_effects: []
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /surveillance/employees/{id}/employment-transition (to_status=ACTIVE)"
        actor: ComplianceAdmin
        preconditions: ["employment_status == ON_LEAVE"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /surveillance/employees/{id}/employment-transition (to_status=TERMINATED)"
        actor: ComplianceAdmin
        preconditions: ["employment_status IN {ACTIVE, ON_LEAVE}"]
        side_effects:
          - "PersonalTrade of this employee in PRECLEARANCE_REQUESTED -> DENIED (denial_reason=EMPLOYMENT_ENDED)"
          - "PersonalTrade of this employee in APPROVED -> EXPIRED"
          - "TrainingAssignment of this employee in ASSIGNED or OVERDUE -> CANCELLED"
      - from: ON_LEAVE
        to: TERMINATED
        trigger: "POST /surveillance/employees/{id}/employment-transition (to_status=TERMINATED)"
        actor: ComplianceAdmin
        preconditions: ["employment_status IN {ACTIVE, ON_LEAVE}"]
        side_effects:
          - "PersonalTrade of this employee in PRECLEARANCE_REQUESTED -> DENIED (denial_reason=EMPLOYMENT_ENDED)"
          - "PersonalTrade of this employee in APPROVED -> EXPIRED"
          - "TrainingAssignment of this employee in ASSIGNED or OVERDUE -> CANCELLED"

  - entity: Employee
    dimension: attestation_status
    initial_state: "computed at creation: LAPSED if now >= attestation_due_at; DUE if now >= attestation_due_at - 30d; else CURRENT"
    terminal_states: []
    transitions:
      - from: CURRENT
        to: DUE
        trigger: "POST /surveillance/ops/runs when now >= attestation_due_at - 30d and now < attestation_due_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: LAPSED
        trigger: "POST /surveillance/ops/runs when now >= attestation_due_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURRENT
        to: LAPSED
        trigger: "POST /surveillance/ops/runs when now >= attestation_due_at (direct flip if DUE window was skipped by a large clock jump)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: CURRENT
        trigger: "POST /surveillance/employees/{id}/attest"
        actor: CoveredEmployee
        preconditions: ["X-User-ID == employee id (ERR_NOT_RESOURCE_OWNER)", "employment_status != TERMINATED (ERR_INVALID_STATE)"]
        side_effects: ["attestation_status = CURRENT", "last_attested_at = now", "attestation_due_at = now + 365 days"]
      - from: DUE
        to: CURRENT
        trigger: "POST /surveillance/employees/{id}/attest"
        actor: CoveredEmployee
        preconditions: ["X-User-ID == employee id (ERR_NOT_RESOURCE_OWNER)", "employment_status != TERMINATED (ERR_INVALID_STATE)"]
        side_effects: ["attestation_status = CURRENT", "last_attested_at = now", "attestation_due_at = now + 365 days"]
      - from: CURRENT
        to: CURRENT
        trigger: "POST /surveillance/employees/{id}/attest (early re-attestation refreshes the window)"
        actor: CoveredEmployee
        preconditions: ["X-User-ID == employee id (ERR_NOT_RESOURCE_OWNER)", "employment_status != TERMINATED (ERR_INVALID_STATE)"]
        side_effects: ["last_attested_at = now", "attestation_due_at = now + 365 days"]

  - entity: Venue
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /surveillance/venues/{id}/transition (to_status=SUSPENDED) OR best-ex review publish cascade (determination=TERMINATE_ROUTING)"
        actor: ComplianceAdmin | system
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "Every RoutingArrangement with venue_id = this venue and status == ACTIVE -> SUSPENDED (cascade link 2)"
          - "(via link 2) each such arrangement's suspension cancels its ROUTED orders (cascade link 3)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /surveillance/venues/{id}/transition (to_status=ACTIVE)"
        actor: ComplianceAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects:
          - "No automatic reinstatement: arrangements stay SUSPENDED, cancelled orders stay CANCELLED (asymmetric compensation)"

  - entity: RoutingArrangement
    dimension: status
    initial_state: NEGOTIATION
    terminal_states: [TERMINATED]
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "POST /surveillance/routing-arrangements/{id}/transition (to_status=ACTIVE)"
        actor: ComplianceAdmin
        preconditions:
          - "venue.status == ACTIVE (ERR_VENUE_SUSPENDED)"
          - "effective_to > now (ERR_INVALID_WINDOW)"
          - "No overlapping window with another arrangement of same venue in {NEGOTIATION, ACTIVE, SUSPENDED} (ERR_ARRANGEMENT_WINDOW_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /surveillance/routing-arrangements/{id}/transition (to_status=SUSPENDED) OR venue suspension cascade"
        actor: ComplianceAdmin | system
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "Every Order with arrangement_id = this arrangement and status == ROUTED -> CANCELLED (cascade link 3)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /surveillance/routing-arrangements/{id}/transition (to_status=ACTIVE)"
        actor: ComplianceAdmin
        preconditions:
          - "venue.status == ACTIVE (ERR_VENUE_SUSPENDED)"
          - "effective_to > now (ERR_INVALID_WINDOW)"
          - "No overlapping window (ERR_ARRANGEMENT_WINDOW_OVERLAP)"
        side_effects: []
      - from: NEGOTIATION
        to: TERMINATED
        trigger: "POST /surveillance/routing-arrangements/{id}/transition (to_status=TERMINATED)"
        actor: ComplianceAdmin
        preconditions: ["status IN {NEGOTIATION, ACTIVE, SUSPENDED}"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /surveillance/routing-arrangements/{id}/transition (to_status=TERMINATED)"
        actor: ComplianceAdmin
        preconditions: ["status IN {NEGOTIATION, ACTIVE, SUSPENDED}"]
        side_effects:
          - "Every Order with arrangement_id = this arrangement and status == ROUTED -> CANCELLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /surveillance/routing-arrangements/{id}/transition (to_status=TERMINATED)"
        actor: ComplianceAdmin
        preconditions: ["status IN {NEGOTIATION, ACTIVE, SUSPENDED}"]
        side_effects: []

  - entity: Order
    dimension: status
    initial_state: RECEIVED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: ROUTED
        trigger: "POST /surveillance/orders/{id}/transition (to_status=ROUTED, arrangement_id)"
        actor: OpsAdmin
        preconditions:
          - "arrangement exists (ERR_NOT_FOUND)"
          - "arrangement.venue.status == ACTIVE (ERR_VENUE_SUSPENDED)"
          - "no RestrictedListEntry for symbol with status == ACTIVE and restriction_kind IN {ALL, CLIENT_ONLY} (ERR_SYMBOL_RESTRICTED)"
          - "arrangement.status == ACTIVE and effective_from <= now < effective_to (ERR_NO_ACTIVE_ARRANGEMENT)"
        side_effects: ["routed_at = now"]
      - from: ROUTED
        to: EXECUTED
        trigger: "POST /surveillance/orders/{id}/transition (to_status=EXECUTED, executed_price_cents, executed_at)"
        actor: OpsAdmin
        preconditions:
          - "status == ROUTED"
          - "executed_at >= created_at and executed_at <= now (ERR_EXECUTION_WINDOW_VIOLATION)"
        side_effects:
          - "Front-running scan (calc_front_running_score): PersonalTrade with same symbol, status IN {EXECUTION_REPORTED, RECONCILED}, executed_at IN [executed_at - 60min, executed_at) -> create SurveillanceAlert FRONT_RUNNING per match"
          - "Marking-the-close check: if order_type == MARKET_ON_CLOSE and deviation_bps >= 25 -> create SurveillanceAlert MARKING_THE_CLOSE (see calc_marking_close_score)"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /surveillance/orders/{id}/transition (to_status=CANCELLED)"
        actor: OpsAdmin
        preconditions: ["status IN {RECEIVED, ROUTED}"]
        side_effects: []
      - from: ROUTED
        to: CANCELLED
        trigger: "POST /surveillance/orders/{id}/transition (to_status=CANCELLED) OR arrangement suspension/termination cascade"
        actor: OpsAdmin | system
        preconditions: ["status IN {RECEIVED, ROUTED}"]
        side_effects: []

  - entity: ExecutionQualitySnapshot
    dimension: status
    initial_state: PROVISIONAL
    terminal_states: [LOCKED]
    transitions:
      - from: PROVISIONAL
        to: LOCKED
        trigger: "POST /surveillance/execution-quality-snapshots/{id}/lock"
        actor: ComplianceAdmin
        preconditions:
          - "No Order with arrangement.venue_id == snapshot.venue_id and order_type == snapshot.order_type and status IN {RECEIVED, ROUTED} and created_at < period end (ERR_UNRESOLVED_ORDERS)"
        side_effects:
          - "Metrics (order_count, total_quantity, total_improvement_cents, avg_improvement_cents_per_share) computed one final time via calc_execution_quality and frozen; later order executions do not change a LOCKED snapshot"

  - entity: PfofDisclosure
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /surveillance/pfof-disclosures/{id}/transition (to_status=PENDING_APPROVAL)"
        actor: FilingOfficer
        preconditions:
          - "Every EXECUTED Order with executed_at inside the quarter has a covering arrangement (arrangement.venue routes it and effective_from <= executed_at < effective_to) (ERR_UNCOVERED_VOLUME)"
        side_effects:
          - "venue_lines computed via calc_pfof_accrual and frozen; each line pins arrangement_id + arrangement_version of the covering arrangement"
          - "submitted_at = now"
      - from: PENDING_APPROVAL
        to: PUBLISHED
        trigger: "POST /surveillance/pfof-disclosures/{id}/transition (to_status=PUBLISHED)"
        actor: FilingOfficer
        preconditions:
          - "For every venue line: the pinned arrangement still exists and arrangement.version == pinned arrangement_version (ERR_DISCLOSURE_STALE)"
        side_effects:
          - "If supersedes_id is set: the superseded disclosure PUBLISHED -> SUPERSEDED"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /surveillance/pfof-disclosures/{id}/transition (to_status=DRAFT) (withdraw for rework; venue_lines unfreeze and recompute on read)"
        actor: FilingOfficer
        preconditions: ["status == PENDING_APPROVAL"]
        side_effects: ["venue_lines cleared (recomputed on next read)", "submitted_at = null"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a revision disclosure of the same quarter transitions to PUBLISHED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BestExReview
    dimension: status
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: IN_COMMITTEE
        trigger: "POST /surveillance/best-ex-reviews/{id}/transition (to_status=IN_COMMITTEE)"
        actor: BestExAnalyst
        preconditions:
          - "snapshot_ids non-empty (ERR_INVALID_REQUEST)"
          - "Every snapshot in snapshot_ids has status == LOCKED (ERR_SNAPSHOT_NOT_LOCKED)"
          - "Every venue with status == ACTIVE has exactly one entry in venue_decisions (ERR_INCOMPLETE_VENUE_DECISIONS)"
        side_effects: []
      - from: IN_COMMITTEE
        to: DRAFT
        trigger: "POST /surveillance/best-ex-reviews/{id}/transition (to_status=DRAFT) (committee return for rework)"
        actor: CommitteeMember
        preconditions: ["status == IN_COMMITTEE"]
        side_effects: ["voter_user_ids cleared"]
      - from: IN_COMMITTEE
        to: APPROVED
        trigger: "system: the 3rd distinct qualifying vote (POST /surveillance/best-ex-reviews/{id}/vote) auto-transitions the review"
        actor: system
        preconditions: ["count(voter_user_ids) reaches 3 (APPROVAL_QUORUM)"]
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /surveillance/best-ex-reviews/{id}/transition (to_status=PUBLISHED)"
        actor: BestExAnalyst
        preconditions:
          - "A PfofDisclosure with quarter == review.quarter and status == PUBLISHED exists (ERR_DISCLOSURE_NOT_PUBLISHED)"
        side_effects:
          - "Cascade link 1: for each venue_decisions entry with determination == TERMINATE_ROUTING: that venue ACTIVE -> SUSPENDED"
          - "Cascade link 2 (caused by link 1): each venue suspension suspends its ACTIVE RoutingArrangements"
          - "Cascade link 3 (caused by link 2): each arrangement suspension cancels its ROUTED Orders"

  - entity: SurveillanceAlert
    dimension: status
    initial_state: NEW
    terminal_states: [CLOSED_FALSE_POSITIVE]
    transitions:
      - from: NEW
        to: ACKNOWLEDGED
        trigger: "POST /surveillance/surveillance-alerts/{id}/transition (to_status=ACKNOWLEDGED)"
        actor: SurveillanceAnalyst
        preconditions: ["status IN {NEW, ESCALATED} — ESCALATED -> ACKNOWLEDGED occurs only via case-reopen compensation (system), not via this endpoint"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /surveillance/surveillance-alerts/{id}/transition (to_status=ESCALATED)"
        actor: SurveillanceAnalyst
        preconditions:
          - "status == ACKNOWLEDGED"
          - "score >= 50 (ERR_ALERT_SCORE_BELOW_ESCALATION)"
        side_effects:
          - "Case selector: candidate set = SurveillanceCase with subject_employee_id == alert.subject_employee_id and review_status IN {OPEN, UNDER_INVESTIGATION, REOPENED}; invariant guarantees at most one such case per subject (auto-creation is the only creation path and it links instead when one exists). MARKING_THE_CLOSE alerts have subject_employee_id == null, so the candidate set is always empty and each escalation creates a fresh subject-less case. If a candidate exists -> link (alert.case_id = candidate, candidate.linked_alert_ids += alert.id). Else -> create SurveillanceCase(subject=alert.subject_employee_id possibly null, opened_from=ALERT, review_status=OPEN, linked_alert_ids=[alert.id]) and set alert.case_id."
      - from: NEW
        to: CLOSED_FALSE_POSITIVE
        trigger: "POST /surveillance/surveillance-alerts/{id}/transition (to_status=CLOSED_FALSE_POSITIVE)"
        actor: SurveillanceAnalyst
        preconditions:
          - "status IN {NEW, ACKNOWLEDGED}"
          - "score < 50 (ERR_ALERT_SCORE_ABOVE_FP_CEILING)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: CLOSED_FALSE_POSITIVE
        trigger: "POST /surveillance/surveillance-alerts/{id}/transition (to_status=CLOSED_FALSE_POSITIVE)"
        actor: SurveillanceAnalyst
        preconditions:
          - "status IN {NEW, ACKNOWLEDGED}"
          - "score < 50 (ERR_ALERT_SCORE_ABOVE_FP_CEILING)"
        side_effects: []
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "system (case-reopen compensation: linked case DISPOSITIONED -> REOPENED)"
        actor: system
        preconditions: []
        side_effects: ["alert.case_id cleared to null"]

  - entity: SurveillanceCase
    dimension: review_status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /surveillance/surveillance-cases/{id}/review-transition (to_status=UNDER_INVESTIGATION)"
        actor: SurveillanceAnalyst
        preconditions: ["review_status IN {OPEN, REOPENED}"]
        side_effects: []
      - from: REOPENED
        to: UNDER_INVESTIGATION
        trigger: "POST /surveillance/surveillance-cases/{id}/review-transition (to_status=UNDER_INVESTIGATION)"
        actor: SurveillanceAnalyst
        preconditions: ["review_status IN {OPEN, REOPENED}"]
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: DISPOSITIONED
        trigger: "POST /surveillance/surveillance-cases/{id}/review-transition (to_status=DISPOSITIONED, disposition)"
        actor: SurveillanceAnalyst
        preconditions: ["review_status == UNDER_INVESTIGATION", "disposition IN {VIOLATION_CONFIRMED, UNFOUNDED}"]
        side_effects:
          - "dispositioned_at = now"
          - "If disposition == VIOLATION_CONFIRMED: filing_status NOT_REQUIRED -> DRAFT; filing_due_at = now + 30 days"
          - "If disposition == UNFOUNDED: filing_status stays NOT_REQUIRED"
      - from: DISPOSITIONED
        to: REOPENED
        trigger: "POST /surveillance/surveillance-cases/{id}/review-transition (to_status=REOPENED)"
        actor: SurveillanceAnalyst
        preconditions:
          - "review_status == DISPOSITIONED"
          - "filing_status NOT IN {SUBMITTED, ACKNOWLEDGED} (ERR_FILING_IN_FLIGHT)"
        side_effects:
          - "Compensation: every linked alert ESCALATED -> ACKNOWLEDGED, alert.case_id cleared"
          - "If filing_status == DRAFT: filing_status -> NOT_REQUIRED, filing_due_at cleared, filing_submitted_at cleared, late_fee_cents reset to 0"
          - "disposition cleared, dispositioned_at cleared"

  - entity: SurveillanceCase
    dimension: filing_status
    initial_state: NOT_REQUIRED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: NOT_REQUIRED
        to: DRAFT
        trigger: "system (disposition = VIOLATION_CONFIRMED side effect)"
        actor: system
        preconditions: []
        side_effects: ["filing_due_at = dispositioned_at + 30 days"]
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /surveillance/surveillance-cases/{id}/filing-transition (to_status=SUBMITTED)"
        actor: FilingOfficer
        preconditions:
          - "filing_status == DRAFT (from NOT_REQUIRED -> ERR_FILING_NOT_REQUIRED)"
          - "review_status == DISPOSITIONED and disposition == VIOLATION_CONFIRMED (else ERR_FILING_NOT_REQUIRED)"
        side_effects:
          - "filing_submitted_at = now"
          - "late_fee_cents recomputed via calc_late_filing_fee"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /surveillance/surveillance-cases/{id}/filing-transition (to_status=ACKNOWLEDGED)"
        actor: FilingOfficer
        preconditions: ["filing_status == SUBMITTED"]
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /surveillance/surveillance-cases/{id}/filing-transition (to_status=DRAFT) (regulator rejection returns the filing for amendment)"
        actor: FilingOfficer
        preconditions: ["filing_status == SUBMITTED"]
        side_effects: ["filing_submitted_at retained as audit of the rejected submission until next submit overwrites it"]

  - entity: PersonalTrade
    dimension: status
    initial_state: PRECLEARANCE_REQUESTED
    terminal_states: [DENIED, RECONCILED, EXPIRED]
    transitions:
      - from: PRECLEARANCE_REQUESTED
        to: APPROVED
        trigger: "POST /surveillance/personal-trades/{id}/transition (to_status=APPROVED)"
        actor: ComplianceAdmin
        preconditions:
          - "status == PRECLEARANCE_REQUESTED"
          - "employee.employment_status == ACTIVE (ERR_EMPLOYEE_NOT_ACTIVE)"
          - "employee.attestation_status != LAPSED (ERR_ATTESTATION_LAPSED)"
          - "employee.training_overdue_count == 0 (ERR_TRAINING_OVERDUE)"
          - "employee.open_case_count == 0 (ERR_OPEN_SURVEILLANCE_CASE)"
          - "no RestrictedListEntry for symbol with status == ACTIVE and restriction_kind IN {ALL, EMPLOYEE_ONLY} (ERR_SYMBOL_RESTRICTED)"
          - "if side == SELL: no RECONCILED BUY PersonalTrade of same employee+symbol with executed_at within the trailing 30 days (ERR_MIN_HOLDING_PERIOD; exactly 30*86400 seconds or more after the BUY execution is allowed)"
        side_effects: ["decided_at = now", "expires_at = now + 48h"]
      - from: PRECLEARANCE_REQUESTED
        to: DENIED
        trigger: "POST /surveillance/personal-trades/{id}/transition (to_status=DENIED, denial_reason?) OR employee termination cascade (denial_reason=EMPLOYMENT_ENDED) OR ops-run restricted-list activation sweep"
        actor: ComplianceAdmin | system
        preconditions: ["status == PRECLEARANCE_REQUESTED; eligibility gates apply only to APPROVED, not to DENIED"]
        side_effects: ["decided_at = now"]
      - from: APPROVED
        to: EXECUTION_REPORTED
        trigger: "POST /surveillance/personal-trades/{id}/transition (to_status=EXECUTION_REPORTED, executed_price_cents, executed_at)"
        actor: CoveredEmployee
        preconditions:
          - "status == APPROVED"
          - "X-User-ID == trade.employee_id (ERR_NOT_RESOURCE_OWNER)"
          - "executed_at IN [decided_at, expires_at] (ERR_EXECUTION_WINDOW_VIOLATION)"
        side_effects:
          - "Reverse front-running scan: client Orders with same symbol, status == EXECUTED, executed_at IN (trade.executed_at, trade.executed_at + 60min] -> create SurveillanceAlert FRONT_RUNNING per match (calc_front_running_score)"
      - from: EXECUTION_REPORTED
        to: RECONCILED
        trigger: "POST /surveillance/personal-trades/{id}/transition (to_status=RECONCILED)"
        actor: ComplianceAdmin
        preconditions: ["status == EXECUTION_REPORTED"]
        side_effects: ["reconciled_at = now"]
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /surveillance/ops/runs when now > expires_at OR employee termination cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RestrictedListEntry
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [EXPIRED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /surveillance/ops/runs when now >= effective_from and now < effective_to"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: PersonalTrade in PRECLEARANCE_REQUESTED with symbol == entry.symbol -> DENIED with denial_reason=RESTRICTED_LIST (caused by this activation)"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /surveillance/ops/runs when now >= effective_to (entry created with a window that has fully passed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /surveillance/ops/runs when now >= effective_to"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CommReviewItem
    dimension: status
    initial_state: "QUEUED (with immediate auto-tiering at creation: score >= 100 -> ESCALATED; 40 <= score < 100 -> QUEUED; score < 40 -> CLEARED)"
    terminal_states: [CLEARED, ESCALATED]
    transitions:
      - from: QUEUED
        to: IN_REVIEW
        trigger: "POST /surveillance/comm-review-items/{id}/transition (to_status=IN_REVIEW)"
        actor: SurveillanceAnalyst
        preconditions: ["status == QUEUED"]
        side_effects: []
      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /surveillance/comm-review-items/{id}/transition (to_status=CLEARED)"
        actor: SurveillanceAnalyst
        preconditions: ["status IN {QUEUED, IN_REVIEW}"]
        side_effects: []
      - from: QUEUED
        to: CLEARED
        trigger: "POST /surveillance/comm-review-items/{id}/transition (to_status=CLEARED)"
        actor: SurveillanceAnalyst
        preconditions: ["status IN {QUEUED, IN_REVIEW}"]
        side_effects: []
      - from: QUEUED
        to: ESCALATED
        trigger: "POST /surveillance/comm-review-items/{id}/transition (to_status=ESCALATED) OR lexicon retune cascade (rescored QUEUED item reaches score >= 100)"
        actor: SurveillanceAnalyst | system
        preconditions: ["status IN {QUEUED, IN_REVIEW}"]
        side_effects:
          - "Create SurveillanceCase(subject = author_employee_id, opened_from = COMM_REVIEW, source_comm_item_id = this item, review_status = OPEN)"
      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /surveillance/comm-review-items/{id}/transition (to_status=ESCALATED)"
        actor: SurveillanceAnalyst
        preconditions: ["status IN {QUEUED, IN_REVIEW}"]
        side_effects:
          - "Create SurveillanceCase(subject = author_employee_id, opened_from = COMM_REVIEW, source_comm_item_id = this item, review_status = OPEN)"

  - entity: LexiconPolicy
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "PATCH /surveillance/lexicon-policies/{id} (to_status=ACTIVE)"
        actor: ComplianceAdmin
        preconditions: ["status == DRAFT"]
        side_effects:
          - "The previously ACTIVE LexiconPolicy (if any) -> RETIRED (at most one ACTIVE policy)"
          - "Cascade link 1: rescore every CommReviewItem in QUEUED against this policy (score, matched_terms, scored_policy_version updated)"
          - "Cascade link 2: each rescored QUEUED item with score >= 100 -> ESCALATED (caused by link 1)"
          - "Cascade link 3: each such auto-escalation creates a SurveillanceCase (caused by link 2); scores that drop never auto-down-tier (asymmetric cascade)"
      - from: ACTIVE
        to: RETIRED
        trigger: "PATCH /surveillance/lexicon-policies/{id} (to_status=RETIRED) OR superseded by another policy's activation"
        actor: ComplianceAdmin | system
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "Rescore every QUEUED CommReviewItem against the new ACTIVE policy if one exists, else score = 0; auto-escalation rule from link 2 applies (never auto-down-tier)"

  - entity: CompliancePolicy
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /surveillance/compliance-policies/{id}/publish"
        actor: ComplianceAdmin
        preconditions: ["status == DRAFT"]
        side_effects:
          - "The prior EFFECTIVE CompliancePolicy with the same policy_code (if any) -> SUPERSEDED"
          - "Fan-out: create TrainingAssignment(status=ASSIGNED, due_date = now + 30 days) for every Employee with employment_status == ACTIVE"
          - "Compensation: the superseded policy's TrainingAssignments in ASSIGNED or OVERDUE -> CANCELLED (COMPLETED ones untouched)"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system (a newer DRAFT of the same policy_code publishes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrainingAssignment
    dimension: status
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: OVERDUE
        trigger: "POST /surveillance/ops/runs when now > due_date"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /surveillance/training-assignments/{id}/complete"
        actor: CoveredEmployee
        preconditions: ["status IN {ASSIGNED, OVERDUE}", "X-User-ID == assignment.employee_id (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["completed_at = now"]
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /surveillance/training-assignments/{id}/complete"
        actor: CoveredEmployee
        preconditions: ["status IN {ASSIGNED, OVERDUE}", "X-User-ID == assignment.employee_id (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["completed_at = now"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (policy supersede cascade or employee termination cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: CANCELLED
        trigger: "system (policy supersede cascade or employee termination cascade)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: arrangement-amend-stale-version
    parent_entity: RoutingArrangement
    write_endpoint: "POST /surveillance/routing-arrangements/{id}/amend"
    occ_field: "expected_arrangement_version"
    description: |
      Amending a RoutingArrangement whose version has advanced since the client
      last observed it is rejected with ERR_STALE_VERSION. An amendment legitimately
      supersedes the current tier table / window, so a client holding a stale view
      must re-read before writing. The endpoint requires expected_arrangement_version
      and increments RoutingArrangement.version by 1 on success.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disclosure-revise-stale-version
    parent_entity: PfofDisclosure
    write_endpoint: "POST /surveillance/pfof-disclosures/{id}/revise"
    occ_field: "expected_disclosure_version"
    description: |
      Revising a PUBLISHED PfofDisclosure whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. A revision
      legitimately supersedes the published disclosure, so a stale client must
      re-read first. The endpoint requires expected_disclosure_version, sets
      has_pending_revision = true, and increments the source disclosure's
      version by 1 on success.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lexicon-patch-stale-version
    parent_entity: LexiconPolicy
    write_endpoint: "PATCH /surveillance/lexicon-policies/{id}"
    occ_field: "expected_lexicon_policy_version"
    description: |
      Patching a LexiconPolicy (terms retune and/or status change) whose version
      has advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Retunes trigger a fleet-wide rescore, so applying them
      from a stale base would silently drop another writer's term changes. The
      endpoint requires expected_lexicon_policy_version and increments
      LexiconPolicy.version by 1 on success.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (5 rules)
# =============================================================================
calculations:
  - name: calc_execution_quality
    trigger: "ExecutionQualitySnapshot read while PROVISIONAL (computed on read); snapshot lock (final freeze)"
    algorithm: aggregation
    formula: |
      Scope: orders O where O.arrangement.venue_id == snapshot.venue_id
        AND O.order_type == snapshot.order_type
        AND O.status == EXECUTED
        AND O.executed_at IN [period_start, period_end)   # half-open month window
      Per order, per-share improvement (cents), benchmark depends on snapshot.variant:
        mid = (arrival_nbbo_bid_cents + arrival_nbbo_ask_cents) / 2      # exact, .5 precision kept
        FAR_TOUCH:  BUY  -> arrival_nbbo_ask_cents - executed_price_cents
                    SELL -> executed_price_cents - arrival_nbbo_bid_cents
        MIDPOINT:   BUY  -> mid - executed_price_cents
                    SELL -> executed_price_cents - mid
      NESTED ROUNDING ORDER (pinned; alternative orders yield different cents):
        1. per_share = round_half_up(per-share improvement, 2dp)
        2. line_cents = round_half_up(per_share * O.quantity, 2dp)
        3. total_improvement_cents = sum(line_cents) over scope          # 2dp
        4. total_quantity = sum(O.quantity); order_count = count(scope)
        5. avg_improvement_cents_per_share = total_quantity == 0 ? 0
             : round_half_up(total_improvement_cents / total_quantity, 4dp)
    input_set: "Orders in EXECUTED status only; RECEIVED/ROUTED/CANCELLED excluded; venue and order_type must match; executed_at inside the half-open month window"
    constants:
      MONTH_WINDOW: "half-open [YYYY-MM-01T00:00:00Z, first instant of next month)"
    precision: "line 2dp round_half_up; average 4dp round_half_up"
    variants:
      - name: FAR_TOUCH
        when: "snapshot.variant == FAR_TOUCH (regulatory benchmark: improvement vs the far touch of the NBBO)"
        difference: "Uses arrival ask for BUY / arrival bid for SELL; strictly >= MIDPOINT result for the same order set"
      - name: MIDPOINT
        when: "snapshot.variant == MIDPOINT (committee benchmark: improvement vs the NBBO midpoint)"
        difference: "Uses mid = (bid+ask)/2; produces different totals and averages for identical order data"

  - name: calc_pfof_accrual
    trigger: "PfofDisclosure read while DRAFT (computed on read); disclosure submit DRAFT -> PENDING_APPROVAL (freeze + pin arrangement versions)"
    algorithm: tiered_pricing
    formula: |
      Quarter scope: all EXECUTED Orders with executed_at inside the quarter window
        (Q1=[Jan1,Apr1), Q2=[Apr1,Jul1), Q3=[Jul1,Oct1), Q4=[Oct1,next Jan1)).
      Group orders by (covering arrangement, calendar month of executed_at).
      An order's covering arrangement = the arrangement A with
        A.venue_id == O.arrangement.venue_id AND A.effective_from <= O.executed_at < A.effective_to.
      Venue windows are non-overlapping (validated), so at most one A covers any instant.
      For each (A, month m) group: S = sum(O.quantity).
      Tier evaluation of S against A.pfof_tiers (sorted asc by min_monthly_shares, first min = 0)
      depends on disclosure.pricing_variant:
        MARGINAL:     band_i shares = max(0, min(S, min_{i+1}) - min_i)  (last band uncapped);
                      pfof = sum over bands of round_half_up(band_shares * rate_i, 0dp integer cents)
        RETROACTIVE:  applicable rate = rate of the highest tier with min_i <= S;
                      pfof = round_half_up(S * applicable_rate, 0dp integer cents)
      Venue line per venue: total_shares = sum of S over the venue's groups;
        pfof_cents = sum of group pfof values (per-group rounding FIRST, then sum - pinned order).
        arrangement_id / arrangement_version pinned from the covering arrangement of the
        venue-month group with the greatest max(executed_at) (a venue has exactly one covering
        arrangement per instant, so per group the arrangement is unique; the line pins the
        arrangement of the latest-executed group).
      disclosure.total_pfof_cents = sum of venue_lines.pfof_cents.
      Submit blocks when any EXECUTED order in the quarter has NO covering arrangement
      (ERR_UNCOVERED_VOLUME).
    input_set: "EXECUTED orders only, executed_at in quarter window; groups keyed by (covering arrangement, calendar month)"
    constants:
      ROUNDING: "per-group integer cents round_half_up, then sum"
    precision: "integer cents per group, round_half_up"
    variants:
      - name: MARGINAL
        when: "disclosure.pricing_variant == MARGINAL"
        difference: "Each tier band's rate applies only to the shares inside that band"
      - name: RETROACTIVE
        when: "disclosure.pricing_variant == RETROACTIVE"
        difference: "The single highest qualifying tier rate applies to ALL shares of the group; produces a different total than MARGINAL for any S beyond the first tier boundary"

  - name: calc_front_running_score
    trigger: "Order -> EXECUTED (forward scan over prior employee trades) and PersonalTrade -> EXECUTION_REPORTED (reverse scan over later client orders)"
    algorithm: weighted_scoring
    formula: |
      Match set (forward scan on client order execution at time T):
        PersonalTrade P where P.symbol == O.symbol
          AND P.status IN {EXECUTION_REPORTED, RECONCILED}
          AND P.executed_at IN [T - 3600s, T)          # lower bound inclusive, upper exclusive
      Match set (reverse scan on trade report at P.executed_at):
        Order O where O.symbol == P.symbol AND O.status == EXECUTED
          AND O.executed_at IN (P.executed_at, P.executed_at + 3600s]   # note the mirror bounds
      Per match, factors:
        time_factor  = 50 * max(0, 1 - delta_seconds/3600)   # delta_seconds = |O.executed_at - P.executed_at|
        size_factor  = 30 * min(P.quantity, O.quantity) / max(P.quantity, O.quantity)
        side_factor  = 20 if P.side == O.side else 0
      ROUNDING (pinned): score = round_half_up(time_factor + size_factor + side_factor, 0dp integer).
        Factors are NOT rounded individually first; rounding the factors before summing yields a
        different integer on some inputs (e.g. 12.5 + 10.5 + 0 -> 23, not 24) and is forbidden.
      One SurveillanceAlert per match (alert_type=FRONT_RUNNING, subject=P.employee_id,
        related_trade_id=P.id, related_order_id=O.id, score as above,
        score_inputs={delta_seconds, size_ratio, same_side}).
    input_set: "see match sets; both scans run at the moment the second leg lands"
    constants:
      WINDOW_SECONDS: 3600
      W_TIME: 50
      W_SIZE: 30
      W_SIDE: 20
      ESCALATION_MIN: 50
    precision: "final score integer, round_half_up"

  - name: calc_marking_close_score
    trigger: "Order -> EXECUTED when order_type == MARKET_ON_CLOSE"
    algorithm: threshold
    formula: |
      mid = (arrival_nbbo_bid_cents + arrival_nbbo_ask_cents) / 2      # exact .5 precision
      deviation_bps = round_half_up(abs(executed_price_cents - mid) * 10000 / mid, 0dp integer)
      If deviation_bps >= 25 (boundary inclusive): create SurveillanceAlert
        (alert_type=MARKING_THE_CLOSE, subject_employee_id=null, related_order_id=O.id,
         score = min(100, deviation_bps * 2), score_inputs={deviation_bps}).
      If deviation_bps < 25: no alert.
    input_set: "the single executing MARKET_ON_CLOSE order"
    constants:
      DEVIATION_TRIGGER_BPS: 25
      SCORE_MULTIPLIER: 2
      SCORE_CAP: 100
    precision: "integer bps, round_half_up"

  - name: calc_lexicon_score
    trigger: "CommReviewItem creation; LexiconPolicy activation / retirement / ACTIVE-policy terms retune (rescore of QUEUED items only)"
    algorithm: aggregation
    formula: |
      score = sum of weight over terms of the ACTIVE LexiconPolicy whose term appears
        at least once in body_text (case-insensitive substring; each term counted once).
      matched_terms = the matching term strings; scored_policy_version = policy.version.
      If no LexiconPolicy is ACTIVE: score = 0, matched_terms = [], scored_policy_version = null.
      Auto-tiering (creation only, and rescore-escalation for QUEUED items):
        score >= 100          -> status ESCALATED + create SurveillanceCase (COMM_REVIEW)
        40 <= score < 100     -> status QUEUED
        score < 40            -> status CLEARED
      Rescore of QUEUED items applies the same >= 100 escalation; items whose rescore drops
      below 40 STAY QUEUED (no automatic down-tier).
    input_set: "ACTIVE lexicon policy terms vs item body; rescore input set = QUEUED items only (IN_REVIEW items are untouched)"
    constants:
      REVIEW_MIN: 40
      AUTO_ESCALATE: 100
    precision: "integer score"

  - name: calc_late_filing_fee
    trigger: "SurveillanceCase filing-transition DRAFT -> SUBMITTED"
    algorithm: threshold
    formula: |
      seconds_late = max(0, filing_submitted_at - filing_due_at) in seconds
      If filing_submitted_at <= filing_due_at (on time, boundary inclusive): late_fee_cents = 0
      Else (strictly late, even by 1 second):
        days_late = floor(seconds_late / 86400)
        late_fee_cents = min(LATE_CAP_CENTS, LATE_BASE_CENTS + LATE_PER_DAY_CENTS * days_late)
      Recomputed on every submit (rejection-and-resubmit uses the new filing_submitted_at
      against the same filing_due_at).
    input_set: "the case's filing_due_at and filing_submitted_at"
    constants:
      LATE_BASE_CENTS: 50000
      LATE_PER_DAY_CENTS: 5000
      LATE_CAP_CENTS: 500000
      FILING_WINDOW_DAYS: 30
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; 30 rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles list (for transition endpoints, the caller's role must also be permitted for the requested to_status target)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "Ownership: CoveredEmployee X-User-ID must equal the employee_id of the acted-on resource (attest path id, personal-trade owner, training assignment owner)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "POST /surveillance/employees/{id}/attest, POST /surveillance/personal-trades/{id}/transition (EXECUTION_REPORTED), POST /surveillance/training-assignments/{id}/complete" }
  - { priority: 4, category: existence, check: "Every id in the path (and arrangement_id / snapshot_ids / venue ids in body) resolves to an existing resource, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints" }
  - { priority: 5, category: existence, check: "Request shape: required fields present, types correct, enum members valid, quantity > 0, ask > bid, to_status a legal target name; the conditional limit_price_cents rule (present iff order_type=LIMIT) reports ERR_LIMIT_PRICE_REQUIRED instead", error_id: "ERR_INVALID_REQUEST | ERR_LIMIT_PRICE_REQUIRED", http_status: 400, applies_to: "all endpoints" }
  - { priority: 6, category: business_constraint, check: "Uniqueness: venue_code unique; employee_ref unique; (venue_id, order_type, period_month, variant) unique per ExecutionQualitySnapshot; at most one non-SUPERSEDED PfofDisclosure per quarter", error_id: "ERR_DUPLICATE_VENUE_CODE | ERR_DUPLICATE_EMPLOYEE_REF | ERR_DUPLICATE_SNAPSHOT | ERR_DUPLICATE_DISCLOSURE", http_status: 409, applies_to: "create endpoints for venues, employees, snapshots, disclosures" }
  - { priority: 7, category: business_temporal, check: "Logical clock is monotonic: set_current_utc to_iso8601 must be >= current clock value", error_id: ERR_CLOCK_REGRESSION, http_status: 409, applies_to: "POST /surveillance/_clock/set_current_utc" }
  - { priority: 8, category: business_constraint, check: "OCC: expected_*_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /surveillance/routing-arrangements/{id}/amend, POST /surveillance/pfof-disclosures/{id}/revise, PATCH /surveillance/lexicon-policies/{id}" }
  - { priority: 9, category: state, check: "Target resource is in a from-state that admits the requested transition per §1.2 (includes terminal lockdown: EXECUTED/CANCELLED orders, TERMINATED arrangements/employees, LOCKED snapshots, SUPERSEDED policies/disclosures, RETIRED lexicon policies, COMPLETED/CANCELLED assignments, DENIED/RECONCILED/EXPIRED trades, EXPIRED restricted entries, CLEARED/ESCALATED comm items admit no transitions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition / action endpoints" }
  - { priority: 10, category: business_safety, check: "Venue gate: venue.status == ACTIVE for arrangement activation/reinstatement and order routing", error_id: ERR_VENUE_SUSPENDED, http_status: 409, applies_to: "POST /surveillance/routing-arrangements/{id}/transition (ACTIVE), POST /surveillance/orders/{id}/transition (ROUTED)" }
  - { priority: 11, category: business_safety, check: "Employment gate: employee.employment_status == ACTIVE for preclearance approval", error_id: ERR_EMPLOYEE_NOT_ACTIVE, http_status: 409, applies_to: "POST /surveillance/personal-trades/{id}/transition (APPROVED)" }
  - { priority: 12, category: business_safety, check: "Attestation gate: employee.attestation_status != LAPSED for preclearance approval", error_id: ERR_ATTESTATION_LAPSED, http_status: 409, applies_to: "POST /surveillance/personal-trades/{id}/transition (APPROVED)" }
  - { priority: 13, category: business_safety, check: "Training gate: employee.training_overdue_count == 0 for preclearance approval", error_id: ERR_TRAINING_OVERDUE, http_status: 409, applies_to: "POST /surveillance/personal-trades/{id}/transition (APPROVED)" }
  - { priority: 14, category: business_safety, check: "Open-case gate: employee.open_case_count == 0 for preclearance approval", error_id: ERR_OPEN_SURVEILLANCE_CASE, http_status: 409, applies_to: "POST /surveillance/personal-trades/{id}/transition (APPROVED)" }
  - { priority: 15, category: business_temporal, check: "Restricted-list gate: no ACTIVE RestrictedListEntry covering the symbol — kinds {ALL, EMPLOYEE_ONLY} block preclearance approval, kinds {ALL, CLIENT_ONLY} block client order routing", error_id: ERR_SYMBOL_RESTRICTED, http_status: 409, applies_to: "POST /surveillance/personal-trades/{id}/transition (APPROVED), POST /surveillance/orders/{id}/transition (ROUTED)" }
  - { priority: 16, category: business_temporal, check: "Minimum holding period: SELL preclearance requires no RECONCILED BUY of same employee+symbol with executed_at within trailing 30 days (>= 30*86400s after is allowed, boundary exclusive)", error_id: ERR_MIN_HOLDING_PERIOD, http_status: 409, applies_to: "POST /surveillance/personal-trades/{id}/transition (APPROVED)" }
  - { priority: 17, category: business_temporal, check: "Execution windows: order executed_at in [created_at, now]; personal-trade executed_at in [decided_at, expires_at]", error_id: ERR_EXECUTION_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /surveillance/orders/{id}/transition (EXECUTED), POST /surveillance/personal-trades/{id}/transition (EXECUTION_REPORTED)" }
  - { priority: 18, category: business_temporal, check: "Window well-formedness: effective_to > effective_from; restricted-entry effective_from strictly in the future at creation; arrangement activation requires effective_to > now", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /surveillance/routing-arrangements, POST /surveillance/routing-arrangements/{id}/amend, POST /surveillance/restricted-list-entries, POST /surveillance/routing-arrangements/{id}/transition (ACTIVE)" }
  - { priority: 19, category: business_temporal, check: "Arrangement window overlap: per venue, half-open [effective_from, effective_to) windows of arrangements in {NEGOTIATION, ACTIVE, SUSPENDED} must not intersect; touching endpoints (to == next from) are ALLOWED", error_id: ERR_ARRANGEMENT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /surveillance/routing-arrangements, POST /surveillance/routing-arrangements/{id}/amend, POST /surveillance/routing-arrangements/{id}/transition (ACTIVE)" }
  - { priority: 20, category: business_temporal, check: "Restricted-list buffer: per symbol, new entry's buffered window [effective_from - 86400s, effective_to + 86400s) must not intersect any SCHEDULED/ACTIVE entry's [effective_from, effective_to); a gap of exactly 86400s is allowed, 86399s is rejected", error_id: ERR_RESTRICTED_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /surveillance/restricted-list-entries" }
  - { priority: 21, category: business_referential, check: "Arrangement usability for routing: arrangement.status == ACTIVE and effective_from <= now < effective_to", error_id: ERR_NO_ACTIVE_ARRANGEMENT, http_status: 409, applies_to: "POST /surveillance/orders/{id}/transition (ROUTED)" }
  - { priority: 22, category: business_referential, check: "Disclosure coverage: every EXECUTED order in the quarter has a covering arrangement at its executed_at", error_id: ERR_UNCOVERED_VOLUME, http_status: 409, applies_to: "POST /surveillance/pfof-disclosures/{id}/transition (PENDING_APPROVAL)" }
  - { priority: 23, category: business_referential, check: "Review evidence: every snapshot in snapshot_ids has status == LOCKED", error_id: ERR_SNAPSHOT_NOT_LOCKED, http_status: 409, applies_to: "POST /surveillance/best-ex-reviews/{id}/transition (IN_COMMITTEE)" }
  - { priority: 24, category: business_referential, check: "Review publish requires a PUBLISHED PfofDisclosure for the same quarter", error_id: ERR_DISCLOSURE_NOT_PUBLISHED, http_status: 409, applies_to: "POST /surveillance/best-ex-reviews/{id}/transition (PUBLISHED)" }
  - { priority: 25, category: business_referential, check: "Disclosure publish staleness: every venue line's pinned arrangement_version equals the arrangement's current version", error_id: ERR_DISCLOSURE_STALE, http_status: 409, applies_to: "POST /surveillance/pfof-disclosures/{id}/transition (PUBLISHED)" }
  - { priority: 26, category: business_constraint, check: "Review completeness: venue_decisions covers every ACTIVE venue exactly once", error_id: ERR_INCOMPLETE_VENUE_DECISIONS, http_status: 409, applies_to: "POST /surveillance/best-ex-reviews/{id}/transition (IN_COMMITTEE)" }
  - { priority: 27, category: business_constraint, check: "Segregation of duties: review voter's X-User-ID != review.created_by_user_id", error_id: ERR_SELF_APPROVAL_FORBIDDEN, http_status: 403, applies_to: "POST /surveillance/best-ex-reviews/{id}/vote" }
  - { priority: 28, category: business_constraint, check: "One vote per committee member per committee round: voter not already in voter_user_ids", error_id: ERR_DUPLICATE_VOTE, http_status: 409, applies_to: "POST /surveillance/best-ex-reviews/{id}/vote" }
  - { priority: 29, category: business_constraint, check: "Alert disposition gates: ESCALATED requires score >= 50; CLOSED_FALSE_POSITIVE requires score < 50 (complementary boundary, score == 50 escalates and cannot close)", error_id: "ERR_ALERT_SCORE_BELOW_ESCALATION | ERR_ALERT_SCORE_ABOVE_FP_CEILING", http_status: 409, applies_to: "POST /surveillance/surveillance-alerts/{id}/transition" }
  - { priority: 30, category: business_constraint, check: "Filing gates: filing submit requires review_status == DISPOSITIONED with disposition == VIOLATION_CONFIRMED (else ERR_FILING_NOT_REQUIRED); case reopen requires filing_status NOT IN {SUBMITTED, ACKNOWLEDGED} (else ERR_FILING_IN_FLIGHT); snapshot lock requires no unresolved in-scope orders (else ERR_UNRESOLVED_ORDERS)", error_id: "ERR_FILING_NOT_REQUIRED | ERR_FILING_IN_FLIGHT | ERR_UNRESOLVED_ORDERS", http_status: 409, applies_to: "POST /surveillance/surveillance-cases/{id}/filing-transition, POST /surveillance/surveillance-cases/{id}/review-transition (REOPENED), POST /surveillance/execution-quality-snapshots/{id}/lock" }

# =============================================================================
# §1.5 API Endpoint Table (54 endpoints)
# =============================================================================
endpoints:
  # --- Ops / test-driving ---
  - method: POST
    path: "/surveillance/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time. Monotonic: to_iso8601 must be >= current value (ERR_CLOCK_REGRESSION)."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["clock updated; no sweeps run (sweeps belong to /ops/runs)"]
  - method: POST
    path: "/surveillance/ops/runs"
    description: "Ops-run checkpoint: evaluates the logical clock and fires epoch sweeps — restricted entries SCHEDULED->ACTIVE / ACTIVE->EXPIRED (activation cascade denies pending preclearances in the symbol), APPROVED personal trades past expires_at -> EXPIRED, attestation CURRENT->DUE->LAPSED flips, training ASSIGNED->OVERDUE flips."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: "{ restricted_activated: integer, restricted_expired: integer, preclearances_expired: integer, preclearances_denied: integer, attestations_due: integer, attestations_lapsed: integer, training_marked_overdue: integer }"
    side_effects: ["epoch transitions per §1.2 for RestrictedListEntry, PersonalTrade, Employee.attestation_status, TrainingAssignment"]

  # --- Employee ---
  - method: POST
    path: "/surveillance/employees"
    description: "Create a covered employee. attestation_status initialized from attestation_due_at vs logical clock (LAPSED if now >= due, DUE if within 30d, else CURRENT)."
    roles: [ComplianceAdmin]
    code: 201
    input: [full_name, employee_ref, department, attestation_due_at]
    output: Employee
    side_effects: ["employment_status=ACTIVE", "attestation_status computed from clock"]
  - method: GET
    path: "/surveillance/employees/{id}"
    description: "Read an employee including computed open_case_count and training_overdue_count"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: POST
    path: "/surveillance/employees/{id}/employment-transition"
    description: "Employment dimension transitions: ACTIVE<->ON_LEAVE, ACTIVE|ON_LEAVE->TERMINATED. Termination cascade denies/expires pending personal trades and cancels non-terminal training."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_status]
    output: Employee
    side_effects: ["employment_status transition", "termination cascade per §1.2"]
  - method: POST
    path: "/surveillance/employees/{id}/attest"
    description: "Covered employee attests (self-service): attestation_status -> CURRENT, last_attested_at=now, attestation_due_at=now+365d"
    roles: [CoveredEmployee]
    code: 200
    input: []
    output: Employee
    side_effects: ["attestation fields refreshed"]
  - method: GET
    path: "/surveillance/employees/{id}/personal-trades"
    description: "List personal trades of an employee (FK reverse reachability); supports status filter"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PersonalTrade[]
    side_effects: []
  - method: GET
    path: "/surveillance/employees/{id}/comm-review-items"
    description: "List comm-review items authored by an employee (FK reverse reachability)"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommReviewItem[]
    side_effects: []

  # --- Venue ---
  - method: POST
    path: "/surveillance/venues"
    description: "Create a venue (status ACTIVE)"
    roles: [ComplianceAdmin]
    code: 201
    input: [venue_code, name, venue_type]
    output: Venue
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/surveillance/venues/{id}"
    description: "Read a venue"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/surveillance/venues/{id}/transition"
    description: "Venue lifecycle: ACTIVE<->SUSPENDED. Suspending cascades to arrangements (ACTIVE->SUSPENDED) and thence to ROUTED orders (->CANCELLED). Reinstatement does NOT restore arrangements or orders."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_status]
    output: Venue
    side_effects: ["venue status transition", "suspension cascade per §1.2"]
  - method: GET
    path: "/surveillance/venues/{id}/routing-arrangements"
    description: "List routing arrangements of a venue (FK reverse reachability)"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RoutingArrangement[]
    side_effects: []
  - method: GET
    path: "/surveillance/venues/{id}/execution-quality-snapshots"
    description: "List execution-quality snapshots of a venue (FK reverse reachability). PROVISIONAL snapshots recompute metrics on read; LOCKED snapshots return frozen values."
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["period_month?", "status?", "variant?", "limit?", "offset?"]
    output: ExecutionQualitySnapshot[]
    side_effects: ["PROVISIONAL rows recompute metrics from current order data before responding"]

  # --- RoutingArrangement ---
  - method: POST
    path: "/surveillance/routing-arrangements"
    description: "Create a routing arrangement in NEGOTIATION. Window overlap rule (half-open, adjacency allowed) applies at creation."
    roles: [ComplianceAdmin]
    code: 201
    input: [venue_id, effective_from, effective_to, pfof_tiers, routing_fee_bps]
    output: RoutingArrangement
    side_effects: ["status=NEGOTIATION"]
  - method: GET
    path: "/surveillance/routing-arrangements/{id}"
    description: "Read a routing arrangement"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: RoutingArrangement
    side_effects: []
  - method: POST
    path: "/surveillance/routing-arrangements/{id}/transition"
    description: "Arrangement lifecycle: NEGOTIATION->ACTIVE, ACTIVE->SUSPENDED, SUSPENDED->ACTIVE, any non-terminal->TERMINATED. SUSPENDED/TERMINATED cancel ROUTED orders."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_status]
    output: RoutingArrangement
    side_effects: ["arrangement status transition", "order cancellation cascade per §1.2"]
  - method: POST
    path: "/surveillance/routing-arrangements/{id}/amend"
    description: "Amend tier table and/or window of a non-TERMINATED arrangement. OCC-guarded: expected_arrangement_version required; version +1 on success. Amendment makes PENDING_APPROVAL disclosures pinning this arrangement stale (detected lazily at their publish)."
    roles: [ComplianceAdmin]
    code: 200
    input: [expected_arrangement_version, "pfof_tiers?", "routing_fee_bps?", "effective_from?", "effective_to?"]
    output: RoutingArrangement
    side_effects: ["increments RoutingArrangement.version by 1", "window re-validated against overlap rule", "downstream disclosure staleness"]
  - method: GET
    path: "/surveillance/routing-arrangements/{id}/orders"
    description: "List orders routed under an arrangement (FK reverse reachability)"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["order_type?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  # --- Order ---
  - method: POST
    path: "/surveillance/orders"
    description: "Ingest a client order from the drop-copy feed (status RECEIVED)"
    roles: [OpsAdmin]
    code: 201
    input: [client_ref, symbol, side, quantity, order_type, "limit_price_cents?", arrival_nbbo_bid_cents, arrival_nbbo_ask_cents]
    output: Order
    side_effects: ["status=RECEIVED"]
  - method: POST
    path: "/surveillance/orders/{id}/transition"
    description: "Order lifecycle: RECEIVED->ROUTED (arrangement_id; venue/restriction/arrangement gates), ROUTED->EXECUTED (executed_price_cents, executed_at; fires front-running scan and marking-the-close check), RECEIVED|ROUTED->CANCELLED."
    roles: [OpsAdmin]
    code: 200
    input: [to_status, "arrangement_id?", "executed_price_cents?", "executed_at?"]
    output: Order
    side_effects: ["order status transition", "surveillance detection side effects on EXECUTED per §1.2"]

  # --- ExecutionQualitySnapshot ---
  - method: POST
    path: "/surveillance/execution-quality-snapshots"
    description: "Create a PROVISIONAL snapshot bucket for (venue_id, order_type, period_month, variant); variant immutable; uniqueness enforced"
    roles: [ComplianceAdmin]
    code: 201
    input: [venue_id, order_type, period_month, variant]
    output: ExecutionQualitySnapshot
    side_effects: ["status=PROVISIONAL; metrics computed on read"]
  - method: POST
    path: "/surveillance/execution-quality-snapshots/{id}/lock"
    description: "Freeze a snapshot: final recompute then immutable. Blocked while in-scope orders remain RECEIVED/ROUTED (ERR_UNRESOLVED_ORDERS)."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: ExecutionQualitySnapshot
    side_effects: ["status=LOCKED", "metrics frozen"]

  # --- PfofDisclosure ---
  - method: POST
    path: "/surveillance/pfof-disclosures"
    description: "Create a DRAFT disclosure for a quarter (revision_number=1). Blocked if a non-SUPERSEDED disclosure already exists for the quarter (ERR_DUPLICATE_DISCLOSURE) — revise instead."
    roles: [FilingOfficer]
    code: 201
    input: [quarter, pricing_variant]
    output: PfofDisclosure
    side_effects: ["status=DRAFT", "venue_lines computed on read while DRAFT"]
  - method: GET
    path: "/surveillance/pfof-disclosures/{id}"
    description: "Read a disclosure. DRAFT rows recompute venue_lines on read; PENDING_APPROVAL/PUBLISHED/SUPERSEDED return frozen lines."
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: PfofDisclosure
    side_effects: ["DRAFT rows recompute venue_lines before responding"]
  - method: GET
    path: "/surveillance/pfof-disclosures"
    description: "List disclosures; supersedes_id filter returns revisions of a given disclosure (self-FK reverse reachability)"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["quarter?", "status?", "supersedes_id?", "limit?", "offset?"]
    output: PfofDisclosure[]
    side_effects: []
  - method: POST
    path: "/surveillance/pfof-disclosures/{id}/transition"
    description: "Disclosure lifecycle: DRAFT->PENDING_APPROVAL (computes and freezes venue_lines, pins arrangement versions; coverage gate), PENDING_APPROVAL->PUBLISHED (staleness gate; supersedes prior), PENDING_APPROVAL->DRAFT (withdraw, unfreezes lines)."
    roles: [FilingOfficer]
    code: 200
    input: [to_status]
    output: PfofDisclosure
    side_effects: ["disclosure status transition", "line freeze/pin on submit", "supersede side effect on publish"]
  - method: POST
    path: "/surveillance/pfof-disclosures/{id}/revise"
    description: "Create the next revision (new DRAFT, revision_number+1, supersedes_id=this) of a PUBLISHED disclosure. OCC-guarded: expected_disclosure_version required."
    roles: [FilingOfficer]
    code: 201
    input: [expected_disclosure_version]
    output: PfofDisclosure
    side_effects: ["new DRAFT revision created", "source disclosure has_pending_revision=true", "increments source PfofDisclosure.version by 1"]

  # --- BestExReview ---
  - method: POST
    path: "/surveillance/best-ex-reviews"
    description: "Create a DRAFT best-execution committee review for a quarter; created_by_user_id recorded from X-User-ID (segregation-of-duties anchor)"
    roles: [BestExAnalyst]
    code: 201
    input: [quarter, snapshot_ids, venue_decisions]
    output: BestExReview
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/surveillance/best-ex-reviews/{id}"
    description: "Read a review including voter_user_ids"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: BestExReview
    side_effects: []
  - method: POST
    path: "/surveillance/best-ex-reviews/{id}/transition"
    description: "Review lifecycle: DRAFT->IN_COMMITTEE by BestExAnalyst (evidence + completeness gates), IN_COMMITTEE->DRAFT by CommitteeMember (return; clears votes), APPROVED->PUBLISHED by BestExAnalyst (disclosure gate + TERMINATE_ROUTING cascade)."
    roles: [BestExAnalyst, CommitteeMember]
    code: 200
    input: [to_status]
    output: BestExReview
    side_effects: ["review status transition", "publish cascade per §1.2"]
  - method: POST
    path: "/surveillance/best-ex-reviews/{id}/vote"
    description: "Committee member casts an APPROVE vote while IN_COMMITTEE. SoD: creator cannot vote (ERR_SELF_APPROVAL_FORBIDDEN); one vote per member (ERR_DUPLICATE_VOTE). The 3rd distinct qualifying vote auto-transitions the review to APPROVED."
    roles: [CommitteeMember]
    code: 200
    input: []
    output: BestExReview
    side_effects: ["voter_user_ids += X-User-ID", "auto-transition to APPROVED when count reaches 3"]

  # --- SurveillanceAlert ---
  - method: GET
    path: "/surveillance/surveillance-alerts"
    description: "List alerts with filters (FK reverse reachability for subject_employee_id, related_order_id, related_trade_id, case_id)"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["subject_employee_id?", "related_order_id?", "related_trade_id?", "case_id?", "alert_type?", "status?", "limit?", "offset?"]
    output: SurveillanceAlert[]
    side_effects: []
  - method: GET
    path: "/surveillance/surveillance-alerts/{id}"
    description: "Read an alert"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: SurveillanceAlert
    side_effects: []
  - method: POST
    path: "/surveillance/surveillance-alerts/{id}/transition"
    description: "Alert lifecycle: NEW->ACKNOWLEDGED; ACKNOWLEDGED->ESCALATED (score >= 50; links or creates subject's open case); NEW|ACKNOWLEDGED->CLOSED_FALSE_POSITIVE (score < 50). MARKING_THE_CLOSE alerts (null subject) escalate into subject-less cases."
    roles: [SurveillanceAnalyst]
    code: 200
    input: [to_status]
    output: SurveillanceAlert
    side_effects: ["alert status transition", "case link-or-create on escalate"]

  # --- SurveillanceCase ---
  - method: GET
    path: "/surveillance/surveillance-cases"
    description: "List cases with filters (FK reverse reachability for subject_employee_id and source_comm_item_id)"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["subject_employee_id?", "source_comm_item_id?", "review_status?", "filing_status?", "limit?", "offset?"]
    output: SurveillanceCase[]
    side_effects: []
  - method: GET
    path: "/surveillance/surveillance-cases/{id}"
    description: "Read a case including both parallel dimensions and late_fee_cents"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: SurveillanceCase
    side_effects: []
  - method: POST
    path: "/surveillance/surveillance-cases/{id}/review-transition"
    description: "Review dimension: OPEN|REOPENED->UNDER_INVESTIGATION; UNDER_INVESTIGATION->DISPOSITIONED (disposition; VIOLATION_CONFIRMED opens filing DRAFT with due date); DISPOSITIONED->REOPENED (blocked while filing in flight; compensates alerts and voids draft filing)."
    roles: [SurveillanceAnalyst]
    code: 200
    input: [to_status, "disposition?"]
    output: SurveillanceCase
    side_effects: ["review_status transition", "filing dimension side effects per §1.2"]
  - method: POST
    path: "/surveillance/surveillance-cases/{id}/filing-transition"
    description: "Filing dimension: DRAFT->SUBMITTED (recomputes late_fee_cents), SUBMITTED->ACKNOWLEDGED (regulator ack), SUBMITTED->DRAFT (regulator rejection, amend-and-resubmit cycle)."
    roles: [FilingOfficer]
    code: 200
    input: [to_status]
    output: SurveillanceCase
    side_effects: ["filing_status transition", "late_fee_cents recomputed on submit"]

  # --- PersonalTrade ---
  - method: POST
    path: "/surveillance/personal-trades"
    description: "Covered employee requests preclearance for a personal trade. employee_id taken from X-User-ID, never from the body."
    roles: [CoveredEmployee]
    code: 201
    input: [symbol, side, quantity]
    output: PersonalTrade
    side_effects: ["status=PRECLEARANCE_REQUESTED"]
  - method: POST
    path: "/surveillance/personal-trades/{id}/transition"
    description: "Trade lifecycle: PRECLEARANCE_REQUESTED->APPROVED|DENIED by ComplianceAdmin (approval runs the eligibility/gauntlet gates; sets decided_at/expires_at), APPROVED->EXECUTION_REPORTED by the owning CoveredEmployee (execution window check; reverse front-running scan), EXECUTION_REPORTED->RECONCILED by ComplianceAdmin."
    roles: [ComplianceAdmin, CoveredEmployee]
    code: 200
    input: [to_status, "denial_reason?", "executed_price_cents?", "executed_at?"]
    output: PersonalTrade
    side_effects: ["trade status transition", "reverse front-running scan on EXECUTION_REPORTED"]

  # --- RestrictedListEntry ---
  - method: POST
    path: "/surveillance/restricted-list-entries"
    description: "Create a restricted-list entry (SCHEDULED). effective_from must be future; 1-day buffer conflict rule per symbol."
    roles: [ComplianceAdmin]
    code: 201
    input: [symbol, restriction_kind, effective_from, effective_to]
    output: RestrictedListEntry
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/surveillance/restricted-list-entries/{id}"
    description: "Read a restricted-list entry"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: RestrictedListEntry
    side_effects: []

  # --- CommReviewItem ---
  - method: POST
    path: "/surveillance/comm-review-items"
    description: "Capture a communication for review: scored against the ACTIVE lexicon policy and auto-tiered (>=100 ESCALATED + case created; 40..99 QUEUED; <40 CLEARED)"
    roles: [OpsAdmin]
    code: 201
    input: [channel, author_employee_id, body_text]
    output: CommReviewItem
    side_effects: ["lexicon scoring", "auto-tiering", "case creation when score >= 100"]
  - method: POST
    path: "/surveillance/comm-review-items/{id}/transition"
    description: "Review workflow: QUEUED->IN_REVIEW; QUEUED|IN_REVIEW->CLEARED|ESCALATED. Escalation creates a COMM_REVIEW case on the author."
    roles: [SurveillanceAnalyst]
    code: 200
    input: [to_status]
    output: CommReviewItem
    side_effects: ["comm item status transition", "case creation on escalate"]

  # --- LexiconPolicy ---
  - method: POST
    path: "/surveillance/lexicon-policies"
    description: "Create a lexicon policy set in DRAFT"
    roles: [ComplianceAdmin]
    code: 201
    input: [name, terms]
    output: LexiconPolicy
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/surveillance/lexicon-policies/{id}"
    description: "Read a lexicon policy"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: LexiconPolicy
    side_effects: []
  - method: PATCH
    path: "/surveillance/lexicon-policies/{id}"
    description: "Retune terms and/or change status (DRAFT->ACTIVE activates and retires the prior ACTIVE policy; ACTIVE->RETIRED). OCC-guarded: expected_lexicon_policy_version required. Changing the ACTIVE policy (terms or activation/retirement) rescores QUEUED comm items and auto-escalates those reaching score >= 100 (never auto-down-tiers)."
    roles: [ComplianceAdmin]
    code: 200
    input: [expected_lexicon_policy_version, "terms?", "to_status?"]
    output: LexiconPolicy
    side_effects: ["increments LexiconPolicy.version by 1", "status transition", "QUEUED item rescore cascade per §1.2"]

  # --- CompliancePolicy / TrainingAssignment ---
  - method: POST
    path: "/surveillance/compliance-policies"
    description: "Create a policy version in DRAFT"
    roles: [ComplianceAdmin]
    code: 201
    input: [policy_code, title, version_label]
    output: CompliancePolicy
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/surveillance/compliance-policies/{id}"
    description: "Read a policy"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: CompliancePolicy
    side_effects: []
  - method: POST
    path: "/surveillance/compliance-policies/{id}/publish"
    description: "Publish a DRAFT policy: -> EFFECTIVE; prior EFFECTIVE of same policy_code -> SUPERSEDED; fan out TrainingAssignments to all ACTIVE employees (due now+30d); superseded policy's ASSIGNED/OVERDUE assignments -> CANCELLED."
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: CompliancePolicy
    side_effects: ["policy status transitions", "training fan-out", "supersede compensation"]
  - method: GET
    path: "/surveillance/training-assignments"
    description: "List training assignments with filters (FK reverse reachability for employee_id and policy_id)"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: ["employee_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: TrainingAssignment[]
    side_effects: []
  - method: GET
    path: "/surveillance/training-assignments/{id}"
    description: "Read a training assignment"
    roles: [OpsAdmin, ComplianceAdmin, SurveillanceAnalyst, FilingOfficer, BestExAnalyst, CommitteeMember, CoveredEmployee]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: []
  - method: POST
    path: "/surveillance/training-assignments/{id}/complete"
    description: "Owning employee completes the assignment (ASSIGNED|OVERDUE -> COMPLETED)"
    roles: [CoveredEmployee]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["status=COMPLETED", "completed_at=now"]

# =============================================================================
# §1.6 Error Code Catalog (34 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint or for the requested transition target" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "CoveredEmployee X-User-ID does not match the employee that owns the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, non-positive quantity, ask <= bid, or unknown to_status target" }
  - { id: ERR_LIMIT_PRICE_REQUIRED, http: 422, condition: "order_type=LIMIT without limit_price_cents, or limit_price_cents supplied for a non-LIMIT order" }
  - { id: ERR_DUPLICATE_VENUE_CODE, http: 409, condition: "venue_code already in use" }
  - { id: ERR_DUPLICATE_EMPLOYEE_REF, http: 409, condition: "employee_ref already in use" }
  - { id: ERR_DUPLICATE_SNAPSHOT, http: 409, condition: "Snapshot already exists for (venue_id, order_type, period_month, variant)" }
  - { id: ERR_DUPLICATE_DISCLOSURE, http: 409, condition: "A non-SUPERSEDED disclosure already exists for the quarter; use revise" }
  - { id: ERR_CLOCK_REGRESSION, http: 409, condition: "set_current_utc would move the logical clock backwards" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a from-state that admits the requested transition (includes terminal lockdown)" }
  - { id: ERR_VENUE_SUSPENDED, http: 409, condition: "Venue is SUSPENDED; arrangement activation/reinstatement and order routing blocked" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Preclearance approval requires employee employment_status == ACTIVE" }
  - { id: ERR_ATTESTATION_LAPSED, http: 409, condition: "Preclearance approval requires attestation_status != LAPSED" }
  - { id: ERR_TRAINING_OVERDUE, http: 409, condition: "Preclearance approval requires training_overdue_count == 0" }
  - { id: ERR_OPEN_SURVEILLANCE_CASE, http: 409, condition: "Preclearance approval requires open_case_count == 0" }
  - { id: ERR_SYMBOL_RESTRICTED, http: 409, condition: "Symbol is on the ACTIVE restricted list with a kind covering this flow (EMPLOYEE_ONLY/ALL for preclearance, CLIENT_ONLY/ALL for client routing)" }
  - { id: ERR_MIN_HOLDING_PERIOD, http: 409, condition: "SELL preclearance within 30 days (strictly less than 30*86400s) of a RECONCILED BUY in the same symbol" }
  - { id: ERR_EXECUTION_WINDOW_VIOLATION, http: 422, condition: "executed_at outside the allowed window ([created_at, now] for orders; [decided_at, expires_at] for personal trades)" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "effective_to <= effective_from; restricted entry effective_from not in the future; arrangement activation with effective_to already past" }
  - { id: ERR_ARRANGEMENT_WINDOW_OVERLAP, http: 409, condition: "Half-open arrangement windows for the same venue intersect (adjacency allowed)" }
  - { id: ERR_RESTRICTED_WINDOW_CONFLICT, http: 409, condition: "Buffered restricted-list windows for the same symbol intersect (1-day buffer both sides; exact 86400s gap allowed)" }
  - { id: ERR_NO_ACTIVE_ARRANGEMENT, http: 409, condition: "Routing requires arrangement.status == ACTIVE and now inside its effective window" }
  - { id: ERR_UNCOVERED_VOLUME, http: 409, condition: "Disclosure submit: an EXECUTED order in the quarter has no arrangement covering its executed_at" }
  - { id: ERR_SNAPSHOT_NOT_LOCKED, http: 409, condition: "Review submit: every referenced snapshot must be LOCKED" }
  - { id: ERR_DISCLOSURE_NOT_PUBLISHED, http: 409, condition: "Review publish: no PUBLISHED disclosure exists for the review's quarter" }
  - { id: ERR_DISCLOSURE_STALE, http: 409, condition: "Disclosure publish: a pinned arrangement_version no longer matches the arrangement's current version" }
  - { id: ERR_INCOMPLETE_VENUE_DECISIONS, http: 409, condition: "Review submit: venue_decisions must cover every ACTIVE venue exactly once" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Review creator (created_by_user_id) may not cast a committee vote" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Committee member has already voted in this committee round" }
  - { id: ERR_ALERT_SCORE_BELOW_ESCALATION, http: 409, condition: "Alert escalate requires score >= 50" }
  - { id: ERR_ALERT_SCORE_ABOVE_FP_CEILING, http: 409, condition: "Alert close-as-false-positive requires score < 50" }
  - { id: ERR_FILING_NOT_REQUIRED, http: 409, condition: "Filing submit requires review_status == DISPOSITIONED with disposition == VIOLATION_CONFIRMED (filing_status == DRAFT)" }
  - { id: ERR_FILING_IN_FLIGHT, http: 409, condition: "Case reopen blocked while filing_status IN {SUBMITTED, ACKNOWLEDGED}" }
  - { id: ERR_UNRESOLVED_ORDERS, http: 409, condition: "Snapshot lock: in-scope orders remain in RECEIVED or ROUTED with created_at before period end" }

# =============================================================================
# §1.7 RBAC Matrix (7 roles)
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Operations feed operator: logical clock, ops-run checkpoints, order drop-copy ingestion and execution, communication capture"
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/_clock/set_current_utc"
      - "POST /surveillance/ops/runs"
      - "POST /surveillance/orders"
      - "POST /surveillance/orders/{id}/transition"
      - "POST /surveillance/comm-review-items"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceAdmin
    description: "Compliance administrator: employees, venues, routing arrangements, restricted list, lexicon and compliance policies, quality snapshot lifecycle, preclearance decisions and trade reconciliation"
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/employees"
      - "POST /surveillance/employees/{id}/employment-transition"
      - "POST /surveillance/venues and /surveillance/venues/{id}/transition"
      - "POST /surveillance/routing-arrangements and /{id}/transition and /{id}/amend"
      - "POST /surveillance/execution-quality-snapshots and /{id}/lock"
      - "POST /surveillance/restricted-list-entries"
      - "POST /surveillance/lexicon-policies and PATCH /surveillance/lexicon-policies/{id}"
      - "POST /surveillance/compliance-policies and /{id}/publish"
      - "POST /surveillance/personal-trades/{id}/transition for to_status IN {APPROVED, DENIED, RECONCILED}"
    shared_operations:
      - "All GET endpoints"
  - name: SurveillanceAnalyst
    description: "Surveillance analyst: works alerts, cases, and communications review"
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/surveillance-alerts/{id}/transition"
      - "POST /surveillance/surveillance-cases/{id}/review-transition"
      - "POST /surveillance/comm-review-items/{id}/transition"
    shared_operations:
      - "All GET endpoints"
  - name: FilingOfficer
    description: "Regulatory reporting officer: PFOF disclosures and exception filings"
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/pfof-disclosures and /{id}/transition and /{id}/revise"
      - "POST /surveillance/surveillance-cases/{id}/filing-transition"
    shared_operations:
      - "All GET endpoints"
  - name: BestExAnalyst
    description: "Best-execution analyst: drafts and publishes committee reviews; may not vote on own reviews (SoD via created_by_user_id)"
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/best-ex-reviews"
      - "POST /surveillance/best-ex-reviews/{id}/transition for to_status IN {IN_COMMITTEE, PUBLISHED}"
    shared_operations:
      - "All GET endpoints"
  - name: CommitteeMember
    description: "Best-execution committee member: votes and returns reviews for rework"
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/best-ex-reviews/{id}/vote"
      - "POST /surveillance/best-ex-reviews/{id}/transition for to_status = DRAFT (return)"
    shared_operations:
      - "All GET endpoints"
  - name: CoveredEmployee
    description: "Covered employee: requests personal-trade preclearance, reports executions, attests, completes training. X-User-ID equals the Employee id."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /surveillance/personal-trades"
      - "POST /surveillance/personal-trades/{id}/transition for to_status = EXECUTION_REPORTED (own trades only)"
      - "POST /surveillance/employees/{id}/attest (self only)"
      - "POST /surveillance/training-assignments/{id}/complete (own assignments only)"
    shared_operations:
      - "All GET endpoints"
