              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "c" }
