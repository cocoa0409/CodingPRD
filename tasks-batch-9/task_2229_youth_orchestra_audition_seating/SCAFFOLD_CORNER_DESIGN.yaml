      - name: waitlist_promotes_by_score_then_by_created_at
        claim_type: chronological
        grounds:
          - calculations.waitlist_promotion
          - entities.Placement.fields.waitlist_rank
          - endpoints[POST /placements/{placementId}/decline]
        distinguishing_aspect: |
          The queue is ordered by the audition's composite_final_score DESC with
          created_at ASC as the only tie-break, and it is re-ranked on every mutation - not
          served in arrival order. Declining Sara's offer promotes Tia (94.60) even though
          she was queued first-but-not-earliest, and declining Tia's promotes Early Eli over
          Later Lou, who tie at 81.80, purely because Eli's row was created an hour earlier.
          Each promotion stamps offer_expires_at at clock + 72h and clears waitlist_rank.
        test_recipe:
          setup:
            - "Season in PLACEMENT; the Philharmonic VIOLIN quota has max_count 1, so exactly"
            - "one OFFER can be outstanding while waitlisted rows consume no capacity."
            - "Four adjudicated VIOLIN members: Seat Sara 85.00, Top Tia 94.60, Early Eli 81.80"
            - "and Later Lou 81.80."
            - "Sara holds the single OFFERED placement; Tia, then Eli, then Lou hold WAITLISTED"
            - "placements created in that order. The logical clock was moved from"
            - "2026-08-05T09:00:00Z to 2026-08-05T10:00:00Z between Eli's and Lou's rows, so"
            - "their created_at values differ and the tie-break is observable."
          setup_api_calls:
