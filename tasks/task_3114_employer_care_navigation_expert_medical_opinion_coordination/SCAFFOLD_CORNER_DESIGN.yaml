scaffold_corner_design:
- section: entities
  instances:
  - name: employer_create_returns_all_declared_fields_and_version_one
    claim_type: Creation
    grounds:
    - entities.Employer
    - endpoints.POST_/care/employers
    distinguishing_aspect: Employer creation returns 201 with every input echoed plus system id/created_at/updated_at and version 1; envelope carries meta.api_request_id and response_type object.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /care/employers
        payload:
          name: Umbrella Corp
          pepm_fee_cents: 1750
          avg_in_out_cost_delta_cents: 275000
          emo_benefit_enabled: true
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      assert:
      - status 201, response_type object
      - Employer.${emp_id}.name == "Umbrella Corp" and pepm_fee_cents == 1750 and emo_benefit_enabled == true
      - Employer.${emp_id}.version == 1 with non-null id/created_at/updated_at
  - name: member_create_with_dependent_links_to_subscriber
    claim_type: Parent Relationships
    grounds:
    - entities.Member.fields.subscriber_id
    - endpoints.POST_/care/employers/{id}/members
    - endpoints.GET_/care/members/{id}/dependents
    distinguishing_aspect: A CHILD member with subscriber_id set is discoverable via the subscriber's dependents list; the SELF subscriber has subscriber_id null.
    test_recipe:
      setup:
      - Employer exists; subscriber member SELF created.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Vulcan LLC
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: true
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Dana White
          date_of_birth: '1980-01-01'
          relationship: SELF
          external_member_ref: V-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          sub_id: $.data.id
      trigger:
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Kiddo White
          date_of_birth: '2015-06-01'
          relationship: CHILD
          subscriber_id: ${sub_id}
          external_member_ref: V-2
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          dep_id: $.data.id
      - call: GET /care/members/${sub_id}/dependents
        payload: {}
        as: PlatformAdmin
      assert:
      - Member.${dep_id}.subscriber_id == ${sub_id} and relationship == CHILD
      - GET dependents on ${sub_id} returns exactly 1 row containing ${dep_id}
  - name: dependent_create_without_subscriber_id_rejected
    claim_type: Required Fields
    grounds:
    - entities.Member.fields.subscriber_id
    - validations[priority=3]
    distinguishing_aspect: 'Conditional required input: relationship SPOUSE/CHILD without subscriber_id is a 400 ERR_INVALID_REQUEST, while SELF without subscriber_id succeeds.'
    test_recipe:
      setup:
      - Employer exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Wayne Ent
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      trigger:
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Orphan Dep
          date_of_birth: '2018-01-01'
          relationship: CHILD
          external_member_ref: W-9
          deductible_limit_cents: 50000
          oop_max_cents: 250000
        as: PlatformAdmin
        captures:
          error_id: $.data.error_id
      assert:
      - status 400, error_id == ERR_INVALID_REQUEST
  - name: navigation_case_clinical_requires_acuity
    claim_type: Required Fields
    grounds:
    - entities.NavigationCase.fields.acuity
    - validations[priority=3]
    distinguishing_aspect: 'Conditional required input on question_type: CLINICAL without acuity -> 400; BENEFIT without acuity succeeds.'
    test_recipe:
      setup:
      - Employer + ACTIVE member.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Stark Ind
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Tony S
          date_of_birth: '1970-05-29'
          relationship: SELF
          external_member_ref: S-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      trigger:
      - call: POST /care/members/${m_id}/navigation-cases
        payload:
          question_type: CLINICAL
        as: Member
        as_user_id: ${m_id}
        captures:
          error_id: $.data.error_id
      assert:
      - status 400, error_id == ERR_INVALID_REQUEST (acuity missing for CLINICAL)
  - name: claim_create_computes_error_line_count
    claim_type: Computed Fields
    grounds:
    - entities.Claim.fields.error_line_count
    distinguishing_aspect: error_line_count is computed at creation from the lines array (2 flagged of 3) and any client-supplied value is ignored.
    test_recipe:
      setup:
      - Member + provider exist.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Oscorp
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Norman O
          date_of_birth: '1965-01-01'
          relationship: SELF
          external_member_ref: O-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/providers
        payload:
          name: Osborne Clinic
          specialty: GENERAL
          network_status: IN_NETWORK
        as: PlatformAdmin
        captures:
          prov_id: $.data.id
      trigger:
      - call: POST /care/claims
        payload:
          member_id: ${m_id}
          provider_id: ${prov_id}
          service_date: '2026-08-01'
          billed_amount_cents: 30000
          allowed_amount_cents: 25000
          lines:
          - line_code: A
            billed_cents: 10000
            schedule_rate: 1.0
            error_flag: DUPLICATE
          - line_code: B
            billed_cents: 10000
            schedule_rate: 0.9
            error_flag: UPCODING
          - line_code: C
            billed_cents: 10000
            schedule_rate: 1.0
            error_flag: NONE
        as: PlanAdministrator
        captures:
          claim_id: $.data.id
      assert:
      - Claim.${claim_id}.error_line_count == 2
      - Claim.${claim_id}.status == RECEIVED (initial state)
      - Claim.${claim_id}.repriced_total_cents is null before adjudication
  - name: member_get_unknown_id_returns_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/care/members/{id}
    - errors.ERR_NOT_FOUND
    - validations[priority=4]
    distinguishing_aspect: Syntactically valid but unallocated UUID yields 404 ERR_NOT_FOUND with the error envelope (error_id + message).
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /care/members/00000000-0000-4000-8000-000000000000
        payload: {}
        as: PlatformAdmin
        captures:
          error_id: $.data.error_id
      assert:
      - status 404, error_id == ERR_NOT_FOUND, response_type error with message present
  - name: coverage_window_defaults_effective_end_null_and_open
    claim_type: Defaults
    grounds:
    - entities.CoverageWindow.fields.effective_end
    - state_machines.CoverageWindow
    distinguishing_aspect: Omitting effective_end stores null (open-ended) with status OPEN — not today's date, not a far-future sentinel.
    test_recipe:
      setup:
      - Member exists at version 1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Globex
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Hank Scorpio
          date_of_birth: '1972-02-02'
          relationship: SELF
          external_member_ref: G-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
          m_v: $.data.version
      trigger:
      - call: POST /care/members/${m_id}/coverage-windows
        payload:
          coverage_tier: FAMILY
          effective_start: '2026-01-01'
          expected_member_version: ${m_v}
        as: PlatformAdmin
        captures:
          cw_id: $.data.id
      assert:
      - CoverageWindow.${cw_id}.effective_end is null and status == OPEN
  - name: consent_duplicate_active_scope_rejected
    claim_type: Type Constraints
    grounds:
    - validations[priority=9]
    - errors.ERR_CONSENT_ALREADY_ACTIVE
    distinguishing_aspect: 'Scoped uniqueness: a second ACTIVE consent for the same (member, scope) is 409, while a different scope for the same member succeeds.'
    test_recipe:
      setup:
      - Member ACTIVE with ACTIVE APPOINTMENT_BOOKING consent.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Initech
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Peter Gibbons
          date_of_birth: '1975-03-15'
          relationship: SELF
          external_member_ref: I-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/members/${m_id}/consents
        payload:
          scope: APPOINTMENT_BOOKING
          expires_at: '2027-01-01T00:00:00Z'
        as: Member
        as_user_id: ${m_id}
      trigger:
      - call: POST /care/members/${m_id}/consents
        payload:
          scope: APPOINTMENT_BOOKING
          expires_at: '2028-01-01T00:00:00Z'
        as: Member
        as_user_id: ${m_id}
        captures:
          error_id: $.data.error_id
      - call: POST /care/members/${m_id}/consents
        payload:
          scope: BILLING_ADVOCACY
          expires_at: '2028-01-01T00:00:00Z'
        as: Member
        as_user_id: ${m_id}
      assert:
      - 'duplicate scope: 409 ERR_CONSENT_ALREADY_ACTIVE'
      - 'different scope: 201'
  - name: provider_match_view_is_ephemeral_not_persisted
    claim_type: Immutability
    grounds:
    - entities.ProviderMatch
    distinguishing_aspect: 'ProviderMatch has common_fields false (view only): no id/version semantics — each provider-matches call recomputes, and no POST/PUT endpoint exists for it.'
    test_recipe:
      setup:
      - Member ACTIVE; two CARDIOLOGY providers with snapshots.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Hooli
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Richard H
          date_of_birth: '1980-07-07'
          relationship: SELF
          external_member_ref: H-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/providers
        payload:
          name: Cardio A
          specialty: CARDIOLOGY
          network_status: IN_NETWORK
        as: PlatformAdmin
        captures:
          pa: $.data.id
      - call: POST /care/providers/${pa}/quality-snapshots
        payload:
          period_start: '2026-01-01'
          period_end: '2026-06-30'
          outcome_score: 90
          cost_efficiency_score: 90
          access_score: 90
          claims_volume: 100
        as: PlatformAdmin
      trigger:
      - call: GET /care/members/${m_id}/provider-matches
        payload:
          specialty: CARDIOLOGY
        as: Member
        as_user_id: ${m_id}
      assert:
      - response_type array; each row carries provider_id, match_score, rank and NO id/version/updated_at fields
  - name: members_list_pagination_envelope
    claim_type: Listing
    grounds:
    - endpoints.GET_/care/employers/{id}/members
    - response_envelope.pagination_defaults
    distinguishing_aspect: With 3 members, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; defaults limit 10 offset 0.
    test_recipe:
      setup:
      - Employer with 3 members.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Pied Piper
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: M One
          date_of_birth: '1990-01-01'
          relationship: SELF
          external_member_ref: P-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: M Two
          date_of_birth: '1990-01-02'
          relationship: SELF
          external_member_ref: P-2
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: M Three
          date_of_birth: '1990-01-03'
          relationship: SELF
          external_member_ref: P-3
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
      trigger:
      - call: GET /care/employers/${emp_id}/members
        payload:
          limit: 2
          offset: 0
        as: EmployerAdmin
        as_user_id: ea-1
      assert:
      - 2 rows, total_count == 3, has_more == true
      - offset=2 returns 1 row with total_count == 3, has_more == false
      - 'no params: 3 rows with limit defaulting to 10 and offset to 0'
- section: state_machines
  instances:
  - name: navigation_case_full_route_start_resolve_close_happy_path
    claim_type: Valid Transition
    grounds:
    - state_machines.NavigationCase.ROUTED_to_IN_PROGRESS
    - state_machines.NavigationCase.IN_PROGRESS_to_RESOLVED
    - state_machines.NavigationCase.RESOLVED_to_CLOSED
    distinguishing_aspect: 'Full happy path with discipline gating: a COST case at 100000 routes ADVOCATE, only the assigned navigator may resolve, and CLOSED is reachable only via RESOLVED.'
    test_recipe:
      setup:
      - Employer + ACTIVE member; COST case 100000 created by member.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Aperture
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Chell
          date_of_birth: '1985-01-01'
          relationship: SELF
          external_member_ref: A-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/members/${m_id}/navigation-cases
        payload:
          question_type: COST
          estimated_cost_cents: 100000
        as: Member
        as_user_id: ${m_id}
        captures:
          nc_id: $.data.id
      trigger:
      - call: POST /care/navigation-cases/${nc_id}/start
        payload: {}
        as: CareAdvocate
        as_user_id: adv-9
      - call: POST /care/navigation-cases/${nc_id}/resolve
        payload: {}
        as: CareAdvocate
        as_user_id: adv-9
      - call: POST /care/navigation-cases/${nc_id}/close
        payload: {}
        as: CareAdvocate
        as_user_id: adv-9
      assert:
      - 'at creation: routed_discipline == ADVOCATE (100000 < 500000), status == ROUTED'
      - 'after start: status IN_PROGRESS, assigned_user_id == adv-9'
      - 'after resolve: status RESOLVED; after close: status CLOSED'
  - name: navigation_case_escalation_reassigns_discipline_advocate_to_nurse
    claim_type: Side Effect Execution
    grounds:
    - state_machines.NavigationCase.IN_PROGRESS_to_ESCALATED
    - calculations.intake_routing
    distinguishing_aspect: Escalate on an ADVOCATE case flips routed_discipline to NURSE, clears assignment, bumps escalation_count — and the escalated case then refuses another CareAdvocate start (ERR_DISCIPLINE_MISMATCH).
    test_recipe:
      setup:
      - COST case 100000 (ADVOCATE) IN_PROGRESS assigned adv-1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Black Mesa
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Gordon F
          date_of_birth: '1978-05-05'
          relationship: SELF
          external_member_ref: B-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/members/${m_id}/navigation-cases
        payload:
          question_type: COST
          estimated_cost_cents: 100000
        as: Member
        as_user_id: ${m_id}
        captures:
          nc_id: $.data.id
      - call: POST /care/navigation-cases/${nc_id}/start
        payload: {}
        as: CareAdvocate
        as_user_id: adv-1
      trigger:
      - call: POST /care/navigation-cases/${nc_id}/escalate
        payload: {}
        as: CareAdvocate
        as_user_id: adv-1
      - call: POST /care/navigation-cases/${nc_id}/start
        payload: {}
        as: CareAdvocate
        as_user_id: adv-2
        captures:
          error_id: $.data.error_id
      assert:
      - 'after escalate: status ESCALATED, routed_discipline == NURSE, escalation_count == 1, assigned_user_id null'
      - 'CareAdvocate start on the escalated case: 403 ERR_DISCIPLINE_MISMATCH'
  - name: resolve_by_non_assigned_navigator_rejected
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.NavigationCase.IN_PROGRESS_to_RESOLVED
    - errors.ERR_NOT_ASSIGNED_NAVIGATOR
    distinguishing_aspect: 'The assignment precondition on resolve is enforced against X-User-ID, not just role: a different CareAdvocate cannot resolve adv-1''s case.'
    test_recipe:
      setup:
      - COST case IN_PROGRESS assigned adv-1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Tyrell
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Rachael
          date_of_birth: '1990-01-01'
          relationship: SELF
          external_member_ref: T-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/members/${m_id}/navigation-cases
        payload:
          question_type: BENEFIT
        as: Member
        as_user_id: ${m_id}
        captures:
          nc_id: $.data.id
      - call: POST /care/navigation-cases/${nc_id}/start
        payload: {}
        as: CareAdvocate
        as_user_id: adv-1
      trigger:
      - call: POST /care/navigation-cases/${nc_id}/resolve
        payload: {}
        as: CareAdvocate
        as_user_id: adv-2
        captures:
          error_id: $.data.error_id
      assert:
      - 403 ERR_NOT_ASSIGNED_NAVIGATOR; status remains IN_PROGRESS
  - name: navigation_case_terminal_close_lockdown
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.NavigationCase
    distinguishing_aspect: 'From CLOSED no trigger is valid: start, escalate, resolve all return 409 ERR_INVALID_STATE.'
    test_recipe:
      setup:
      - BENEFIT case driven ROUTED->IN_PROGRESS->RESOLVED->CLOSED.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /care/employers
        payload:
          name: Wonka
          pepm_fee_cents: 1000
          avg_in_out_cost_delta_cents: 200000
          emo_benefit_enabled: false
        as: PlatformAdmin
        captures:
          emp_id: $.data.id
      - call: POST /care/employers/${emp_id}/members
        payload:
          full_name: Charlie B
          date_of_birth: '1995-01-01'
          relationship: SELF
          external_member_ref: W-1
          deductible_limit_cents: 100000
          oop_max_cents: 500000
        as: PlatformAdmin
        captures:
          m_id: $.data.id
      - call: POST /care/members/${m_id}/navigation-cases
        payload:
          question_type: BENEFIT
        as: Member
        as_user_id: ${m_id}
        captures:
