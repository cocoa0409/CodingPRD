            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", decoration_method: "SCREEN_PRINT", quantity: 200, imprint_color_count: 3 }, as: Customer, as_user_id: "${cust_id}", captures: { line1_id: "$.data.id", line1_v: "$.data.version" } }
            - { call: "POST /order-lines/${line1_id}/art-proofs", payload: { proof_url: "http://x/1.png", expected_order_line_version: "${line1_v}" }, as: AccountManager, captures: { p1_id: "$.data.id" } }
