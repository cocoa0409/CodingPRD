      - name: corner_permit_rejection_freezes_the_project_and_revokes_only_future_scheduled_windows
        claim_type: cross_entity
        grounds:
          - state_machines.PermitApplication.transitions["SUBMITTED -> REJECTED"].side_effects
          - state_machines.WorkWindow.transitions["SCHEDULED -> REVOKED"]
          - calculations.project_posture
          - calculations.permit_fee
        distinguishing_aspect: "One AHJ rejection reaches two other entities, and the window cascade is filtered by time: the window starting after clock_now is REVOKED while the window that already started before clock_now stays SCHEDULED. The submission fee is also pinned at 23100 cents (18000 base + round_half_up(6.0 * 850) with no expedite and no revision)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the jurisdiction has repermit_required_for_reinstall false so the SUBMITTED permit alone does not restrict posture, isolating the rejection as the cause of FROZEN."
            - "W_past runs 2026-07-25T14:00:00Z..22:00:00Z and W_future runs 2026-08-10T14:00:00Z..22:00:00Z; both belong to the roofer party, and their 15-day separation is far beyond the 120-minute mobilization buffer so they never conflict."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
