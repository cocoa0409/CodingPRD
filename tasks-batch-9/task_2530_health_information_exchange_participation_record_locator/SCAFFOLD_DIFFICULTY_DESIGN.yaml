              as: ParticipantAdmin
              as_user_id: "${pB2_id}"
            - call: "POST /hie/participants/${pB2_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pB1_id}/patient-records"
              payload: { source_mrn: "B1-0001", given_name: "Robert", family_name: "Nguyen", birth_date: "1979-04-12", sex: "M", ssn_last4: "4417", postal_code: "94110", phone_digits: "4155550111" }
              as: HieAdmin
              captures: { recB_l1: $.data.id }
            - call: "POST /hie/participants/${pB2_id}/patient-records"
