  # ==================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without the X-User-ID header fails priority-1 authentication with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before role or resource checks."
        test_recipe:
          setup: ["any resource exists (supplier SUP-AH)"]
          setup_api_calls:
            - { call: "POST /api/suppliers", payload: { supplier_code: "SUP-AH", name: "AH Co" }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
          trigger:
            - { call: "GET /api/suppliers", payload: {}, as: SupplierQualityEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "when dispatched WITHOUT the X-User-ID header: 400 error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: shape_failure_precedes_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A lot create with quantity 0 (shape, priority 3) AND a non-existent dmr_id (existence, priority 4) returns 400 ERR_VALIDATION — shape beats existence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-PE", dmr_id: "11111111-2222-3333-4444-555555555555", validation_protocol_id: "11111111-2222-3333-4444-555555555555", quantity: 0, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (400), not ERR_NOT_FOUND"

      - name: occ_check_precedes_state_check
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=7]", "errors[ERR_STALE_VERSION]", "concurrency_rules[revision-create-stale-dmr]"]
        distinguishing_aspect: "A revision create carrying a stale expected_dmr_version against a DRAFT (not APPROVED) DMR fails with 412 ERR_STALE_VERSION — the OCC check (priority 5) fires before the state precondition (priority 7)."
        test_recipe:
          setup: ["DMR DEV-OS rev A in DRAFT (version 1)"]
          setup_api_calls:
            - { call: "POST /api/device-master-records", payload: { device_code: "DEV-OS", revision_code: "A", sterile: true, shelf_life_claim_months: 20 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { dmr_id: "$.data.id", a_v1: "$.data.version" } }
          trigger:
            - { call: "POST /api/device-master-records/${dmr_id}/revisions", payload: { revision_code: "B", shelf_life_claim_months: 30, sterile: true, expected_dmr_version: "${a_v1} - 1" }, as: QualityEngineer, as_user_id: "qe-alice", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION, http 412 (OCC outranks the DMR-not-APPROVED state failure)"

      - name: sod_vs_state_conflict_covered_by_difficulty
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: sod_vs_state_on_dmr_approve
          rationale: "Dual-failure auth-vs-state ordering asserted in the named §1.8 instance."

      - name: temporal_vs_referential_conflict_covered_by_difficulty
        claim_type: priority_ordering
        grounds: ["validations[priority=10]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: temporal_vs_referential_on_scn_create
          rationale: "Dual-failure temporal-vs-referential ordering asserted in the named §1.8 instance."

  # ==================================================================
  - section: endpoints
    instances:
      - name: clock_regression_rejected
        claim_type: conditional_action
        grounds: ["errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "The logical clock is monotonic: after setting 2026-09-01, setting 2026-08-15 fails 400 ERR_CLOCK_REGRESSION and the clock stays at 2026-09-01."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: QMSAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: QMSAdmin, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CLOCK_REGRESSION (400)"
            - "subsequent read of server time (any created entity's created_at or clock response) shows 2026-09-01T00:00:00Z"

      - name: clock_sweep_expires_agreement_suspends_supplier
