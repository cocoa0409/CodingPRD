        distinguishing_aspect: |
          Unit resource, half-open interval extended by turnover_buffer_days:
          a new [2026-06-15,2026-07-15) booking is rejected because it overlaps
          the buffered window [2026-06-01, 2026-07-03) of an existing booking.
        test_recipe:
          setup:
            - "Verified host/tenant, unit LISTED buffer 2; booking b1 [2026-06-01,2026-07-01] REQUESTED"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host O", email: "hostO@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
              payload: {}
              as: ComplianceReviewer
            - call: "POST /tenants"
              payload: { full_name: "Nurse O", email: "nurseO@x.com", tenant_type: "TRAVEL_NURSE" }
              as: Anonymous
              captures: { tenant_id: $.data.id }
            - call: "POST /verifications"
              payload: { tenant_id: "${tenant_id}", doc_type: "GOVERNMENT_ID", document_ref: "docO" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: ComplianceReviewer
            - call: "POST /units"
              payload: { host_id: "${host_id}", title: "U15", address: "15 St", monthly_rate_cents: 300000, cleaning_included: true, turnover_buffer_days: 2, deposit_cents: 0 }
              as: Host
              as_user_id: "${host_id}"
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/transitions"
              payload: { to_status: "LISTED" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-01", end_date: "2026-07-01" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { unit_id: "${unit_id}", tenant_id: "${tenant_id}", start_date: "2026-06-15", end_date: "2026-07-15" }
              as: Tenant
              as_user_id: "${tenant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_UNIT_UNAVAILABLE (overlaps buffered half-open window on the Unit)"

      - name: tenant_overlap_closed_interval
        grounds:
          - validations[priority=10]
          - entities.Booking.fields.tenant_id
          - errors[ERR_TENANT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Tenant resource, closed interval with no buffer: a new booking on a
          different unit whose closed [2026-07-01,2026-08-01] touches the tenant's
          existing CONFIRMED [2026-06-01,2026-07-01] at the shared endpoint is
          rejected — adjacency counts, unlike the Unit's half-open semantics.
        test_recipe:
          setup:
            - "Verified host/tenant, two LISTED units; booking b1 on unit1 [2026-06-01,2026-07-01] CONFIRMED for the tenant"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host P", email: "hostP@x.com" }
