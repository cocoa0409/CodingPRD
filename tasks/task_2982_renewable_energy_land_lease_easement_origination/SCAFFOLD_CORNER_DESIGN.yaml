          assert:
            - "${executor} == pm-user-01"
            - "HTTP 422"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "OptionAgreement.${o_id}.status == EXECUTED and exercised_at is null"
            - "GET /land-origination/leases with option_agreement_id ${o_id} returns meta.total_count == 0"
            - "Parcel.${p_id}.status == OPTIONED and Landowner.${l_id}.status == UNDER_OPTION"
            - "Replaying the identical exercise as pm-user-02 returns 201 with a LeaseAgreement whose total_security_required_cents == 10450000"

  # ==========================================================================
  # The rate_threshold_triggers layer is covered from the calculations section
  # (crossing_surcharge_applies_only_above_thirty_free_days,
  # crossing_surcharge_is_capped_at_twenty_five_hundred_bps and
  # slope_exclusion_tier_break_is_upper_inclusive_at_five_percent), so this
  # section covers the remaining five layers.
  - section: complexity_layers
    instances:

      - name: option_create_with_a_stale_parcel_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[option-create-stale-parcel]
          - validations[priority 30]
          - errors[ERR_STALE_PARCEL_VERSION]
          - endpoints[POST /land-origination/parcels/{parcelId}/rescreen]
        distinguishing_aspect: "The intervening rescreen is a NO-OP on every observable field — it re-runs the same DESKTOP variant and leaves buildable_acres 200.00 and screening_score 82.15 untouched — so only an implementation that bumps version on the rescreen write itself, rather than on an actual value change, produces the 412."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451 (no setback rules): buildable_acres 200.00, screening_score 82.15, tier PRIORITY, status QUALIFIED."
            - "A DESKTOP rescreen of that same parcel, which changes nothing except version."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v1: "$.data.version", score1: "$.data.screening_score", build1: "$.data.buildable_acres" }
            - call: "POST /land-origination/parcels/${p_id}/rescreen"
              payload: { screen_mode: "DESKTOP" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_v2: "$.data.version", score2: "$.data.screening_score", build2: "$.data.buildable_acres" }
          trigger:
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v1}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "${score1} == 82.15 and ${score2} == 82.15 and ${build1} == 200.00 and ${build2} == 200.00"
            - "${p_v2} == ${p_v1} + 1 (the no-op rescreen still bumps the version)"
            - "HTTP 412"
            - "${err} == ERR_STALE_PARCEL_VERSION"
            - "GET /land-origination/option-agreements with parcel_id ${p_id} returns meta.total_count == 0"
            - "Replaying the identical body with expected_parcel_version ${p_v2} returns 201 with status DRAFT"

      - name: invoice_create_with_a_stale_lease_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-create-stale-lease]
          - validations[priority 31]
          - errors[ERR_STALE_LEASE_VERSION]
          - endpoints[POST /land-origination/leases/{leaseId}/post-security]
        distinguishing_aspect: "The second OCC pair guards a different entity with a differently named field (expected_lease_agreement_version) and is invalidated by a write from ANOTHER role: the payment administrator's own post-security call is what staled the version the payment administrator then quotes."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement sent, accepted, executed by pm-user-01 and exercised by pm-user-02; the lease version at exercise is captured."
            - "Security posted in full (10450000), which bumps the lease version."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/exercise"
              payload: { exercise_notice_reference: "NOE-2026-0001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_id: "$.data.id", lease_v1: "$.data.version", required: "$.data.total_security_required_cents" }
            - call: "POST /land-origination/leases/${lease_id}/post-security"
              payload: { amount_cents: 10450000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { lease_v2: "$.data.version", posted: "$.data.security_posted_cents" }
          trigger:
            - call: "POST /land-origination/leases/${lease_id}/rent-invoices"
              payload: { expected_lease_agreement_version: "${lease_v1}", period_year: 1, production_mwh: 0 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "${required} == 10450000 and ${posted} == 10450000"
            - "${lease_v2} == ${lease_v1} + 1"
            - "HTTP 412"
            - "${err} == ERR_STALE_LEASE_VERSION"
            - "GET /land-origination/rent-invoices with lease_agreement_id ${lease_id} returns meta.total_count == 0"
            - "Replaying with expected_lease_agreement_version ${lease_v2} returns 201 with rent_variant PROVISIONAL, acre_basis 200.00 and gross_rent_cents 24000000"

      - name: setback_rule_publication_cascades_to_every_matching_parcel
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /land-origination/setback-rules]
          - calculations.buildable_acres_derivation
          - state_machines.Parcel.QUALIFIED_to_SCREENING
          - state_machines.Landowner
        distinguishing_aspect: "One rule publication re-derives EVERY parcel in the jurisdiction, and the same 0.2500 rate pushes the 100-acre parcel below MIN_BUILDABLE_ACRES (75.00) while leaving the 200-acre parcel above it (150.00) — so the cascade must be per-parcel, must not touch screening_score, and must leave the landowner ENGAGED because one parcel survives."
        test_recipe:
          setup:
            - "One Landowner owning two parcels in county 48451 with no setback rules yet: P1 gross_acres 100.00 and P2 gross_acres 200.00, both slope 4.0 (no slope exclusion), both QUALIFIED with screening_score 82.15."
            - "The landowner is therefore ENGAGED."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 100.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p1_id: "$.data.id", p1_status: "$.data.status", p1_build: "$.data.buildable_acres" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-002", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p2_id: "$.data.id", p2_status: "$.data.status", p2_build: "$.data.buildable_acres" }
          trigger:
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "PROPERTY_LINE", setback_feet: 500, encumbrance_rate_per_acre: 0.2500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "${p1_status} == QUALIFIED and ${p1_build} == 100.00 and ${p2_status} == QUALIFIED and ${p2_build} == 200.00 before the publication"
            - "Parcel.${p1_id}: raw_setback_acres 25.00, consent_released_acres 0.00, setback_encumbered_acres 25.00, buildable_acres 75.00, status SCREENING"
            - "Parcel.${p2_id}: raw_setback_acres 50.00, setback_encumbered_acres 50.00, buildable_acres 150.00, status QUALIFIED (unchanged)"
            - "Parcel.${p1_id}.screening_score == 82.15 and Parcel.${p2_id}.screening_score == 82.15 (acreage does not feed the score)"
            - "Both parcels' version fields are bumped by the re-derivation"
            - "Landowner.${l_id}.status == ENGAGED (P2 still qualifies)"
            - "A parcel in a different county is untouched by this publication"

      - name: pagination_limit_above_the_maximum_returns_invalid_request
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope.pagination_defaults
          - validations[priority 15]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The bound is inclusive at 100, so limit 100 must succeed on the very same collection where limit 101 fails — the failure is a 400 on the query string, never a silent clamp to 100."
        test_recipe:
          setup:
            - "One Landowner and one clean 200.00-acre parcel in county 48451, so the collection is non-empty."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "GET /land-origination/parcels"
              payload: { limit: 101, offset: 0 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "response_type == error and no data array is returned"
            - "The same call with limit 100 returns 200 with meta.total_count == 1 and meta.has_more false"
            - "The same call with offset -1 also returns 400 ERR_INVALID_REQUEST"

      - name: two_filters_combine_conjunctively_on_the_parcel_list
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /land-origination/parcels]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three parcels are arranged so that each filter alone would match two of them and only their conjunction matches one — an implementation that ORs the filters, or that computes total_count before filtering, returns 2 or 3 instead of 1."
        test_recipe:
          setup:
            - "Landowner A owns P1 (gross_acres 200.00, buildable 200.00, QUALIFIED) and P2 (gross_acres 60.00, buildable 60.00 < MIN_BUILDABLE_ACRES, so SCREENING)."
            - "Landowner B owns P3 (gross_acres 200.00, QUALIFIED)."
            - "No setback rules exist, so acreage comes straight from gross_acres."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { a_id: "$.data.id" }
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Caprock Grazing Trust", entity_type: "TRUST", mailing_state: "TX", contact_email: "trustee@caprock.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { b_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${a_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p1_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-002", county_fips: "48451", landowner_id: "${a_id}", gross_acres: 60.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p2_id: "$.data.id", p2_status: "$.data.status" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-003", county_fips: "48451", landowner_id: "${b_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p3_id: "$.data.id" }
          trigger:
            - call: "GET /land-origination/parcels"
              payload: { landowner_id: "${a_id}", status: "QUALIFIED", limit: 10, offset: 0 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { first_id: "$.data[0].id", first_build: "$.data[0].buildable_acres" }
          assert:
            - "${p2_status} == SCREENING (60.00 buildable acres is below the 80.00 minimum)"
            - "HTTP 200"
            - "meta.total_count == 1 and meta.has_more == false"
            - "${first_id} == ${p1_id} and ${first_build} == 200.00"
            - "Filtering on landowner_id ${a_id} alone returns total_count 2; filtering on status QUALIFIED alone returns total_count 2; the unfiltered list returns 3"
            - "Landowner.${a_id}.status == ENGAGED and Landowner.${b_id}.status == ENGAGED"

      - name: clock_advance_expires_the_consent_and_completes_the_booking_in_pinned_order
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.NeighborConsent.REQUESTED_to_EXPIRED
          - state_machines.SiteAccessBooking.BOOKED_to_COMPLETED
        distinguishing_aspect: "One clock advance must drive two different sweeps (S2 and S3) and report each in its own counter while the two sweeps that have no candidates report 0; crucially the expiry of an UNGRANTED consent must NOT run an acreage recompute, so buildable_acres has to stay at 190.00."
        test_recipe:
          setup:
            - "One SetbackRule for 48451 at rate 0.0500 published before the parcel."
            - "One Landowner and one 200.00-acre parcel in county 48451: raw_setback_acres 10.00, buildable_acres 190.00, QUALIFIED."
            - "One NeighborConsent left in REQUESTED with consent_expiry_days 30 (expiry 2026-08-31T00:00:00Z)."
            - "One SiteAccessBooking in BOOKED for 2026-08-05..2026-08-10 with crew_count 2."
            - "No executed options and no issued invoices, so S1 and S4 have no candidates."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "PROPERTY_LINE", setback_feet: 150, encumbrance_rate_per_acre: 0.0500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", build_before: "$.data.buildable_acres" }
            - call: "POST /land-origination/neighbor-consents"
              payload: { parcel_id: "${p_id}", setback_rule_id: "${r_id}", neighbor_name: "H. Vaughn", consent_expiry_days: 30 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { c_id: "$.data.id" }
            - call: "POST /land-origination/site-access-bookings"
              payload: { parcel_id: "${p_id}", purpose: "GEOTECH", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z", crew_count: 2 }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { opts: "$.data.expired_option_count", cons: "$.data.expired_consent_count", books: "$.data.completed_booking_count", delq: "$.data.delinquent_lease_count", now: "$.data.current_utc" }
          assert:
            - "${build_before} == 190.00"
            - "HTTP 200"
            - "${now} == 2026-08-31T00:00:00Z"
            - "${opts} == 0, ${cons} == 1, ${books} == 1, ${delq} == 0"
            - "NeighborConsent.${c_id}.status == EXPIRED with released_acres 0.00 and granted_at null"
            - "SiteAccessBooking.${b_id}.status == COMPLETED"
            - "Parcel.${p_id}: setback_encumbered_acres 10.00, consent_released_acres 0.00, buildable_acres 190.00, status QUALIFIED — the S2 sweep ran no acreage recompute"
            - "A second identical clock call returns all four counters at 0 (the sweeps are idempotent)"

      - name: parcel_recount_fields_reconcile_after_the_curative_clear
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Parcel.fields.blocking_curative_open_count
          - entities.Parcel.fields.curative_cost_cents
        excluded_because:
          difficulty_instance: transitive_cascade / curative_clear_releases_successor_and_rescores
          rationale: "That instance clears the predecessor and then reconciles blocking_curative_open_count, curative_cost_cents, the title-grade step-down inside the screening score and the resulting Parcel/Landowner statuses in one assertion block."

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: derived_totals_are_readable_immediately_after_the_write_returns
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.NeighborConsent.REQUESTED_to_GRANTED
          - calculations.buildable_acres_derivation
        distinguishing_aspect: "The consent grant fires a four-hop cascade that ends in a Parcel promotion and a Landowner posture sync, and every one of those hops must be visible in the grant's own 200 response and in an immediately following GET — no polling, no retry loop, and no eventual-consistency window is permitted anywhere in the API."
        test_recipe:
          setup:
            - "One SetbackRule for 48451 at rate 0.2500, consent_waivable true, published before the parcel."
            - "One Landowner and one 100.00-acre parcel in county 48451: raw_setback_acres 25.00, buildable_acres 75.00, so the parcel sits in SCREENING and the landowner is PROSPECT."
            - "One NeighborConsent in REQUESTED against that rule."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48451", rule_type: "PROPERTY_LINE", setback_feet: 500, encumbrance_rate_per_acre: 0.2500, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { r_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 100.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", build_before: "$.data.buildable_acres", status_before: "$.data.status" }
            - call: "POST /land-origination/neighbor-consents"
              payload: { parcel_id: "${p_id}", setback_rule_id: "${r_id}", neighbor_name: "H. Vaughn", consent_expiry_days: 60 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/neighbor-consents/${c_id}/grant"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { released: "$.data.released_acres", c_status: "$.data.status" }
          assert:
            - "${build_before} == 75.00 and ${status_before} == SCREENING"
            - "HTTP 200"
            - "${c_status} == GRANTED and ${released} == 20.00 in the grant response itself"
            - "The very next GET /land-origination/parcels/${p_id} (no delay, no retry) returns consent_released_acres 20.00, setback_encumbered_acres 5.00, buildable_acres 95.00 and status QUALIFIED"
            - "The very next GET /land-origination/landowners/${l_id} returns status ENGAGED"
            - "GET /land-origination/parcels with status QUALIFIED already counts this parcel: meta.total_count == 1"
            - "Every read is served from the same authoritative state: repeating either GET returns byte-identical data"
