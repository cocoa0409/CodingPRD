  - rule_id: transitive_cascade
    instances:
      - name: disqualify_after_issuance_auto_clawback
        grounds:
          - state_machines.SpendEntry.QUALIFIED_to_DISQUALIFIED
          - calculations.credit_amount
          - entities.CreditCertificate.fields.overissued_exposure_cents
          - entities.ClawbackCase.fields.trigger_reason
        distinguishing_aspect: |
          Depth-3 chain where each link is CAUSED by the previous one, not by
          the original request: review-DISQUALIFY on entry B2 mutates the
          application totals (link 1); the application recompute drops
          recomputed_credit_cents to 35625000 which mutates the certificate's
          overissued_exposure_cents 0 -> 25125000 (link 2); that exposure
          transition itself auto-opens a ClawbackCase (link 3). Trigger:
          spend-entry review — distinct from the settle and vendor-revocation
          triggers below.
        test_recipe:
          setup:
            - "GA program OPEN; application APPROVED with qualified entries: ATL 40000000 (INV-ATL-001), BTL resident 100000000 (INV-BTL-002), BTL 60000000 (INV-BTL-003); vendor VERIFIED"
