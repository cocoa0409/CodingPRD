  - rule_id: combinatorial_formula
    instances:

      - name: statutory_due_at_composes_anchor_toll_and_extension
        grounds:
          - calculations.statutory_due_at
          - calculations.statutory_due_at.evaluation_order_is_load_bearing
          - state_machines.Request.AUTH_DEFECT_PENDING_to_INTAKE_REVIEW
          - endpoints.POST_/roi/authorizations/{id}/cure
        distinguishing_aspect: >
          Mode (a) — one output instant produced by composing four independent
          terms whose pinned order is load bearing: the polymorphic deadline
          window, a max() anchor against a signature date later than arrival, a
          tolling interval that is capped BEFORE it is added, and the extension
          added last. 2026-09-09T18:00:00Z, then 2026-09-24T18:00:00Z.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule (30 third-party days, 15 extension days); facility; patient; ATTORNEY requester."
            - "Authorization created with signature_verified false, so its status is DEFECTIVE."
            - "Third-party request received at 2026-08-01T00:00:00Z; its first statutory_due_at is 2026-08-31T00:00:00Z."
            - "Clock moved to 2026-08-05T00:00:00Z and the intake decision parks the request on the defect, opening the tolling interval."
            - "Clock moved to 2026-08-08T06:00:00Z; the cure carries a signature date of 2026-08-07T12:00:00Z, which is later than received_at."
