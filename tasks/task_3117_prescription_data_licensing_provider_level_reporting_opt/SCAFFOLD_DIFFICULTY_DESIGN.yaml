# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_3117 (§1.8 Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All numbers in assert: lines were computed by hand from the §1.3 formulas.
# Logical clock default is 2026-09-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: projection_weighted_vs_density_divergence
        grounds:
          - calculations.calc_market_projection
          - entities.ProjectionCell.fields.estimate_units
          - endpoints.POST_/projection-cells/{id}/recompute
        distinguishing_aspect: |
          On the ProjectionCell entity domain (market estimation), the two declared
          variants produce different estimates for identical inputs: WEIGHTED scales
          by outlet coverage (250 * 400/100 = 1000), DENSITY scales by population
          coverage times uptake (250 * (10000000/2000000) * 1.0 = 1250).
        test_recipe:
          setup:
            - "One methodology (default WEIGHTED) and one cell: CA-SOUTH / CARDIOLOGY / 2026-08, sample_units 250, market_outlets 400, sampled_outlets 100, market_population 10000000, sampled_population 2000000, uptake 1.0, no suppliers."
          setup_api_calls:
            - call: "POST /projection-methodologies"
              payload: { name: "M1", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "CA-SOUTH", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 250, market_outlets: 400, sampled_outlets: 100, market_population: 10000000, sampled_population: 2000000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /projection-cells/${c_id}/recompute"
              payload: { projection_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { est_w: $.data.estimate_units }
            - call: "POST /projection-cells/${c_id}/recompute"
              payload: { projection_variant: "PROJECTION_DENSITY" }
              as: PlatformAdmin
              captures: { est_d: $.data.estimate_units, delta_d: $.data.restatement_delta_units, st_d: $.data.status }
          assert:
            - "first recompute response estimate_units == 1000"
            - "second recompute response estimate_units == 1250"
            - "${est_w} != ${est_d} (the two variants diverge on identical inputs)"
            - "second recompute restatement_delta_units == 250 (1250 - 1000)"
            - "ProjectionCell.${c_id}.status == CURRENT after both recomputes"

      - name: sla_credit_period_vs_delivery_weighted
        grounds:
          - calculations.calc_sla_credit
          - state_machines.ReportDeliveryPeriod.OPEN_to_CLOSED
          - endpoints.POST_/report-delivery-periods/{id}/close
        distinguishing_aspect: |
          On the license-SLA entity domain (ReportDeliveryPeriod, different domain
          from instance projection_weighted_vs_density_divergence), identical breach
          data (2 breached of 2 due deliveries, fee 200000 cents) yields
          PERIOD_WEIGHTED credit 20000 (200000*0.05*2) versus DELIVERY_WEIGHTED
          credit 50000 (200000*2/2 capped at 25% of fee).
        test_recipe:
          setup:
            - "Clock 2026-10-01. Client (entitlement 100), methodology with one CURRENT cell per period (2026-08 and 2026-09), product with monthly_license_fee_cents 200000. Two periods (total_due_deliveries 2 each); in each period both deliveries end RECALLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Client SLA", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-SLA", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "CA-SOUTH", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "CA-SOUTH", specialty: "CARDIOLOGY", period_code: "2026-09", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-SLA", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 2 }
              as: PlatformAdmin
              captures: { pe1_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-09", period_end_date: "2026-09-30", total_due_deliveries: 2 }
              as: PlatformAdmin
              captures: { pe2_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe1_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe1_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe2_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d3_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe2_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d4_id: $.data.id }
            - call: "POST /report-deliveries/${d1_id}/compile"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d1_id}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d1_id}/recall"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d2_id}/compile"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d2_id}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d2_id}/recall"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d3_id}/compile"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d3_id}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d3_id}/recall"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d4_id}/compile"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d4_id}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d4_id}/recall"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /report-delivery-periods/${pe1_id}/close"
              payload: { sla_variant: "PERIOD_WEIGHTED" }
              as: PlatformAdmin
              captures: { credit_pw: $.data.sla_credit_cents, bc_pw: $.data.breach_count }
            - call: "POST /report-delivery-periods/${pe2_id}/close"
              payload: { sla_variant: "DELIVERY_WEIGHTED" }
              as: PlatformAdmin
              captures: { credit_dw: $.data.sla_credit_cents, bc_dw: $.data.breach_count }
          assert:
            - "period 1 breach_count == 2 and sla_credit_cents == 20000 (200000*0.05*2, under the 25% cap)"
            - "period 2 breach_count == 2 and sla_credit_cents == 50000 (200000*2/2 = 200000 capped at 25% of fee)"
            - "${credit_pw} != ${credit_dw} on identical breach data"
            - "both periods end in status CLOSED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: royalty_tiered_marginal_with_qa_bonus
        grounds:
          - calculations.calc_acquisition_royalty
          - entities.DataFeedBatch.fields.royalty_cents
          - endpoints.POST_/data-feed-batches/{id}/accept
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — marginal tiered rate
          (0/3/5 cents over 10000/50000 breakpoints) x supplier-type multiplier
          (PHARMACY 1.0) x conditional QA bonus (+10% because 0.99 >= 0.98).
          60000 records -> 0 + 40000*3 + 10000*5 = 170000; x1.0 = 170000; x1.10 = 187000.
        test_recipe:
          setup:
            - "PHARMACY supplier with ACTIVE agreement (budget 10000000), de-identification profile, one batch of 60000 records driven RECEIVED -> VALIDATED -> DEIDENTIFIED."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "PharmCo", supplier_type: "PHARMACY", state_code: "CA" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 10000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /deidentification-profiles"
              payload: { name: "DP1", salt_version: "sv1" }
              as: PrivacyOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 60000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches/${b_id}/deidentify"
              payload: { deidentification_profile_id: "${dp_id}" }
              as: PrivacyOfficer
          trigger:
            - call: "POST /data-feed-batches/${b_id}/accept"
              payload: { deid_qa_score: 0.99 }
              as: PrivacyOfficer
              captures: { roy: $.data.royalty_cents, st: $.data.status }
          assert:
            - "DataFeedBatch.${b_id}.royalty_cents == 187000"
            - "DataFeedBatch.${b_id}.status == ACCEPTED"
            - "GET /data-acquisition-agreements/${ag_id} shows royalty_spent_cents == 187000"

      - name: delivery_fee_per_cell_rounding_order
        grounds:
          - calculations.calc_delivery_fee
          - entities.ReportDelivery.fields.fee_cents
          - endpoints.POST_/report-deliveries/{id}/compile
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — scaffold pins
          round-per-cell-first. cell base 1235 x 1.5 = 1852.5 -> per-cell round_half_up
          1853; 3 cells = 5559; + base 50000 = 55559; x (1 - 0.10) = 50003.1 -> 50003.
          Sum-then-round would yield 50002 — a one-cent divergence the test pins.
        test_recipe:
          setup:
            - "Default clock 2026-09-01. Methodology with three CURRENT cells for period 2026-08. Client (entitlement 100). Product: base_fee_cents 50000, cell_fee_base_cents 1235, cell_fee_multiplier 1.5, volume_discount_pct 0.10. Period ending 2026-08-31 with one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Fee", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-FEE", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G2", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G3", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-FEE", prescriber_ids: [], base_fee_cents: 50000, cell_fee_base_cents: 1235, cell_fee_multiplier: 1.5, volume_discount_pct: 0.10, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { fee: $.data.fee_cents, ncells: $.data.compiled_cell_ids }
          assert:
            - "ReportDelivery.${d_id}.fee_cents == 50003 (per-cell-round-first order)"
            - "len(compiled_cell_ids) == 3"
            - "ReportDelivery.${d_id}.status == COMPILED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: batch_reject_reprocess_cycle
        grounds:
          - state_machines.DataFeedBatch
          - state_machines.DataFeedBatch.REJECTED_to_REPROCESSED
          - state_machines.DataFeedBatch.REPROCESSED_to_VALIDATED
        distinguishing_aspect: |
          Cyclic machine on DataFeedBatch: a batch can loop VALIDATED -> DEIDENTIFIED
          -> REJECTED -> REPROCESSED -> VALIDATED -> DEIDENTIFIED -> ACCEPTED; REJECTED
          is not terminal and the loop ends in the ACCEPTED terminal state.
        test_recipe:
          setup:
            - "PHARMACY supplier, ACTIVE agreement (budget 10000000), de-identification profile, batch of 20000 records."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "PharmCo2", supplier_type: "PHARMACY", state_code: "TX" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "RETAIL_SCRIPTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 10000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /deidentification-profiles"
              payload: { name: "DP2", salt_version: "sv1" }
              as: PrivacyOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 20000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches/${b_id}/deidentify"
              payload: { deidentification_profile_id: "${dp_id}" }
              as: PrivacyOfficer
            - call: "POST /data-feed-batches/${b_id}/reject"
              payload: { reason: "qa fail" }
              as: PrivacyOfficer
              captures: { st_rej: $.data.status, dp_rej: $.data.deidentification_profile_id }
            - call: "POST /data-feed-batches/${b_id}/reprocess"
              payload: {}
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { st_rep: $.data.status }
          trigger:
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
              captures: { st_val2: $.data.status }
            - call: "POST /data-feed-batches/${b_id}/deidentify"
              payload: { deidentification_profile_id: "${dp_id}" }
              as: PrivacyOfficer
            - call: "POST /data-feed-batches/${b_id}/accept"
              payload: { deid_qa_score: 0.95 }
              as: PrivacyOfficer
              captures: { st_acc: $.data.status, roy: $.data.royalty_cents }
          assert:
            - "reject response status == REJECTED and deidentification_profile_id is null after reject"
            - "reprocess response status == REPROCESSED"
            - "second validate response status == VALIDATED (cycle completed)"
            - "final accept status == ACCEPTED with royalty_cents == 30000 (20000 records, PHARMACY 1.0, no QA bonus since 0.95 < 0.98)"

      - name: delivery_release_recall_reissue_cycle
        grounds:
          - state_machines.ReportDelivery
          - state_machines.ReportDelivery.RECALLED_to_REISSUED
          - state_machines.ReportDelivery.REISSUED_to_RELEASED
        distinguishing_aspect: |
          Cyclic machine on ReportDelivery (different entity from DataFeedBatch):
          SCHEDULED -> COMPILED -> RELEASED -> RECALLED -> REISSUED -> RELEASED loops
          back to a previously-held state; recall_count accumulates and must_recompile
          gates release until reissue clears it.
        test_recipe:
          setup:
            - "Default clock. Client (entitlement 100), methodology with one CURRENT cell for 2026-08, product (base 10000, cell 1000 x 1.0, no discount), period ending 2026-08-31, one delivery."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Cyc", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-CYC", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "ONCOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-CYC", prescriber_ids: [], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /report-deliveries/${d_id}/compile"
              payload: {}
              as: PlatformAdmin
              captures: { fee_c: $.data.fee_cents }
            - call: "POST /report-deliveries/${d_id}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /report-deliveries/${d_id}/recall"
              payload: { reason: "client request" }
              as: PlatformAdmin
              captures: { rc: $.data.recall_count, mr: $.data.must_recompile }
          trigger:
            - call: "POST /report-deliveries/${d_id}/reissue"
              payload: {}
              as: PlatformAdmin
              captures: { st_rei: $.data.status, mr_rei: $.data.must_recompile }
            - call: "POST /report-deliveries/${d_id}/release"
              payload: {}
              as: PlatformAdmin
              captures: { st_fin: $.data.status, ver_fin: $.data.version }
          assert:
            - "compile fee_cents == 11000 (10000 + round(1000*1.0))"
            - "recall response recall_count == 1 and must_recompile == true"
            - "reissue response status == REISSUED and must_recompile == false"
            - "final release response status == RELEASED and version == 6 (create + compile + release + recall + reissue + release)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: agreement_suspend_cascades_batches_cells_deliveries
        grounds:
          - state_machines.DataAcquisitionAgreement.ACTIVE_to_SUSPENDED
          - state_machines.DataFeedBatch.VALIDATED_to_QUARANTINED
          - state_machines.ProjectionCell.CURRENT_to_PENDING_RESTATEMENT
          - state_machines.ReportDelivery.COMPILED_to_RECALLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by agreement suspension: suspend -> batch
          quarantined (link 1) -> matching cell PENDING_RESTATEMENT (link 2) ->
          COMPILED delivery RECALLED with entitlement credit (link 3); each link is
          caused by the previous link's mutation, not by the suspend call directly.
        test_recipe:
          setup:
            - "Default clock. Supplier S with ACTIVE agreement; one batch VALIDATED for period 2026-08 (not yet de-identified). Methodology with one CURRENT cell for 2026-08 whose supplier_ids contains S. Client (entitlement 100), product, period ended 2026-08-31, one delivery COMPILED over that cell (balance 99)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { name: "DistCo", supplier_type: "DISTRIBUTOR", state_code: "NV" }
              as: DataAcquisitionManager
              captures: { s_id: $.data.id }
            - call: "POST /suppliers/${s_id}/agreements"
              payload: { data_domain: "DISTRIBUTION_SHIPMENTS", exclusivity_start_date: "2026-01-01", exclusivity_end_date: "2027-01-01", royalty_budget_cents: 10000000 }
              as: DataAcquisitionManager
              captures: { ag_id: $.data.id }
            - call: "POST /data-acquisition-agreements/${ag_id}/activate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /data-feed-batches"
              payload: { agreement_id: "${ag_id}", period_code: "2026-08", record_count: 5000 }
              as: SupplierOperator
              as_user_id: "${s_id}"
              captures: { b_id: $.data.id }
            - call: "POST /data-feed-batches/${b_id}/validate"
              payload: {}
              as: DataAcquisitionManager
            - call: "POST /projection-methodologies"
              payload: { name: "M-CAS", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "NV-NORTH", specialty: "PRIMARY_CARE", period_code: "2026-08", sample_units: 100, market_outlets: 200, sampled_outlets: 100, market_population: 500000, sampled_population: 250000, specialty_uptake_index: 1.0, supplier_ids: ["${s_id}"] }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Client Cas", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /report-products"
