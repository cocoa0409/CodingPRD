        distinguishing_aspect: "The PARTIAL_CUSTOMER_SHARE_CAP_PCT constant binds: 365 elapsed days at the 137-cent daily rate give a raw share of 50005, but the customer share is capped at round_half_up(100000 x 0.5) = 50000."
        test_recipe:
