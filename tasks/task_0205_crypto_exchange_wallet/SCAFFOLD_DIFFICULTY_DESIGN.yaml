  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: withdrawal_reject_resubmit_cycle
        grounds:
          - state_machines.Withdrawal.SCREENING_to_REJECTED
          - state_machines.Withdrawal.SUBMITTED_to_SCREENING
          - entities.Withdrawal.fields.replaces_withdrawal_id
        distinguishing_aspect: |
          The Withdrawal machine is cyclic: a SCREENING->REJECTED withdrawal is resubmitted via
          POST /withdrawals with replaces_withdrawal_id, producing a fresh SUBMITTED withdrawal —
          the same lifecycle re-enters. This non-linearity is on the Withdrawal entity, distinct
          from the parallel Order machine.
