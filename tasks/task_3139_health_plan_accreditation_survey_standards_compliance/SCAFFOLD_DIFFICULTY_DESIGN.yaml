            - "after finalizing UM-1: decide succeeds; AccreditationOutcome.${outcome_dep}.status == ACCREDITED"
            - "AccreditationApplication.${app_id}.status == CLOSED (no CAP: every element fully awarded)"

      - name: session_complete_blocked_when_survey_not_confirmed
        grounds:
          - state_machines.SurveySession.SCHEDULED_to_COMPLETED
          - errors.ERR_SURVEY_INVALID_STATE
        distinguishing_aspect: |
          Entity pair SurveySession x Survey: a session can only complete
          while its parent survey is CONFIRMED; completing against a PLANNED
          survey fails even though the session itself is SCHEDULED.
