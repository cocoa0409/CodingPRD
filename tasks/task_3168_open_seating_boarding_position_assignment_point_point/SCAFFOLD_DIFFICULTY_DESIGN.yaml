  # =============================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: depart_blocked_by_broken_crew_pairing
        grounds:
          - state_machines.FlightLeg.SCHEDULED_to_DEPARTED
          - state_machines.CrewPairing.ACTIVE_to_BROKEN
        distinguishing_aspect: |
          FlightLeg→CrewPairing dependency: a leg whose covering CrewPairing is
          BROKEN cannot depart (ERR_INVALID_STATE) until the crew member is
          AVAILABLE again — FlightLeg's valid transitions depend on the state
          of a different entity (CrewPairing).
        test_recipe:
          setup:
            - "Stations DAL/HOU; aircraft N100; leg L1 STD 2026-10-01T12:00:00Z; routing R1=[L1]; captain C100 with pairing CP1=[L1]"
            - "No journeys on L1 (boarding open with zero assignments satisfies the assignment precondition)"
            - "Crew member marked UNAVAILABLE (pairing BROKEN) after boarding opened"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU", min_connection_minutes: 40 }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac1}", leg_ids: ["${leg1}"] }
              as: OpsController
            - call: "POST /ops/crew-members"
              payload: { employee_ref: "C100", crew_role: "CAPTAIN", qualified_fleet: "SINGLE_FLEET", base_station_code: "DAL" }
              as: OpsController
              captures: { cm1: $.data.id }
            - call: "POST /ops/crew-pairings"
              payload: { pairing_date: "2026-10-01", crew_member_id: "${cm1}", leg_ids: ["${leg1}"] }
              as: OpsController
              captures: { cp1: $.data.id }
            - call: "POST /ops/flight-legs/${leg1}/boarding/open"
              payload: {}
              as: GateAgent
            - call: "POST /ops/crew-members/${cm1}/availability"
              payload: { action: "MARK_UNAVAILABLE" }
              as: OpsController
          trigger:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg1}/depart"
              payload: {}
              as: GateAgent
              captures: { err: $.data.error_id }
            - call: "POST /ops/crew-members/${cm1}/availability"
              payload: { action: "MARK_AVAILABLE" }
              as: OpsController
          assert:
            - "depart with covering pairing BROKEN returns error_id == ERR_INVALID_STATE (HTTP 409)"
            - "CrewPairing.${cp1}.pairing_status == BROKEN"
            - "FlightLeg.${leg1}.leg_status remains SCHEDULED after the rejected depart"
            - "MARK_AVAILABLE does NOT auto-heal the pairing: CrewPairing.${cp1}.pairing_status still == BROKEN (no auto-restore), so a fresh pairing is required before departure"

      - name: journey_checkin_blocked_by_leg_cancelled
        grounds:
          - state_machines.PassengerJourney.BOOKED_to_CHECKED_IN
          - state_machines.FlightLeg.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          PassengerJourney→FlightLeg dependency (different entity pair than
          FlightLeg→CrewPairing): check-in is rejected because the journey's
          flight leg is already CANCELLED — the journey's own state is BOOKED
          and would otherwise allow check-in; the blocking state lives on the
          leg.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare FLEX; aircraft; leg L1 STD 2026-10-01T12:00:00Z; passenger PA with journey J1 BOOKED on L1"
            - "L1 CANCELLED via disruption post (which also cancels J1 system-side) — to isolate the state dependency, J2 on a DIFFERENT booking remains BOOKED because its check-in attempt races the cancellation window: realized deterministically as J2 BOOKED on leg L2 that is CANCELLED before J2's system cancellation is irrelevant — the pinned flow is: J2 created BOOKED on L1 is cancelled by cascade; the dependency test instead checks-in a journey on L1 AFTER L1 is DELAYED-then-CANCELLED, where the journey is already CANCELLED — precondition failure is leg-state-driven in the PRD's priority ordering (state priority 5 covers both; the distinguishing read is the leg, not the journey, determines eligibility)"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id, leg1_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKJ1", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/flight-legs/${leg1}/disruptions"
              payload: { disruption_type: "CANCELLATION", cause: "WEATHER" }
              as: OpsController
            - call: "GET /ops/flight-legs/${leg1}"
              payload: {}
              as: GateAgent
              captures: { leg1_v_cancelled: $.data.version }
          trigger:
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg1_v_cancelled}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "check-in on a CANCELLED leg returns error_id == ERR_INVALID_STATE (HTTP 409): the leg's state (not the journey's) determines eligibility"
            - "FlightLeg.${leg1}.leg_status == CANCELLED and PassengerJourney.${j1}.journey_status == CANCELLED (cascade already ran)"

  # =============================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_tail_half_open_overlap
        grounds:
          - calculations.routing_slack
          - validations[priority=9]
        distinguishing_aspect: |
          Half-open interval semantics on the Aircraft resource: routing R1
          covers legs ending STD 15:00 (last departure); a second routing R2
          on the same tail and date whose first window starts at STA 15:00
          touches but does not overlap (touching endpoints allowed) and is
          ACCEPTED; a routing whose window starts 14:59 overlaps [STA, STD)
          and is REJECTED with ERR_AIRCRAFT_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Stations DAL/HOU/AUS; aircraft N100; legs L1 DAL→HOU 12:00-13:00 and L2 HOU→AUS 13:35-14:35 (R1=[L1,L2], last STD 13:35, window spans 12:00→14:35 block time); legs L3 AUS→DAL 14:35-15:35 (touching at STA 14:35) and L4 AUS→DAL 14:34-15:34 (overlapping)"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "AUS", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_aus: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN2", origin_station_id: "${st_hou}", destination_station_id: "${st_aus}", scheduled_departure_utc: "2026-10-01T13:35:00Z", scheduled_arrival_utc: "2026-10-01T14:35:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { l2: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN3", origin_station_id: "${st_aus}", destination_station_id: "${st_dal}", scheduled_departure_utc: "2026-10-01T14:35:00Z", scheduled_arrival_utc: "2026-10-01T15:35:00Z", capacity_seats: 143, turn_target_minutes: 30 }
              as: OpsController
              captures: { l3: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN4", origin_station_id: "${st_aus}", destination_station_id: "${st_dal}", scheduled_departure_utc: "2026-10-01T14:34:00Z", scheduled_arrival_utc: "2026-10-01T15:34:00Z", capacity_seats: 143, turn_target_minutes: 30 }
              as: OpsController
              captures: { l4: $.data.id }
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac1}", leg_ids: ["${l1}", "${l2}"] }
              as: OpsController
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac1}", leg_ids: ["${l3}"] }
              as: OpsController
              captures: { r2: $.data.id }
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac1}", leg_ids: ["${l4}"] }
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "R2 [L3] starting at 14:35 (exactly R1's last STA) is ACCEPTED: touching endpoints do not overlap (half-open semantics)"
            - "R3 [L4] starting at 14:34 returns error_id == ERR_AIRCRAFT_DOUBLE_BOOKED (HTTP 409): window [12:00,14:35) x [14:34,15:34) intersects"
            - "both accepted routings have routing_status == ACTIVE"

      - name: crew_pairing_duty_span_aggregate
        grounds:
          - validations[priority=10]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the CrewMember resource —
          different from the tail's half-open geometry: the pairing's duty span
          (first STD to last STA) must be <= 840 minutes (14h) AND every
          connection gap <= 120 minutes; a 3-leg pairing spanning 13h59m is
          ACCEPTED at 839 minutes, while the same chain stretched to 841
          minutes is REJECTED with ERR_CREW_LEGALITY_VIOLATION even though no
          single leg overlaps — the violation is the aggregate window, not
          pairwise geometry.
        test_recipe:
          setup:
            - "Stations DAL/HOU/AUS; captain C100 base DAL AVAILABLE"
            - "Legs chain DAL→HOU 06:00-07:00, HOU→AUS 08:00-09:00 (gap 60 <= 120), AUS→DAL 18:59-19:59 for span 839 (06:00→19:59 = 13h59m = 839 min); variant leg AUS→DAL 19:00-20:01 for span 841"
            - "Connection gaps satisfy min_connection (30) and MAX_CONNECTION 120"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "AUS", min_connection_minutes: 30 }
              as: OpsController
              captures: { st_aus: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T06:00:00Z", scheduled_arrival_utc: "2026-10-01T07:00:00Z", capacity_seats: 143, turn_target_minutes: 30 }
              as: OpsController
              captures: { l1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN2", origin_station_id: "${st_hou}", destination_station_id: "${st_aus}", scheduled_departure_utc: "2026-10-01T08:00:00Z", scheduled_arrival_utc: "2026-10-01T09:00:00Z", capacity_seats: 143, turn_target_minutes: 30 }
              as: OpsController
              captures: { l2: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN3", origin_station_id: "${st_aus}", destination_station_id: "${st_dal}", scheduled_departure_utc: "2026-10-01T18:59:00Z", scheduled_arrival_utc: "2026-10-01T19:59:00Z", capacity_seats: 143, turn_target_minutes: 30 }
              as: OpsController
              captures: { l3: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN4", origin_station_id: "${st_aus}", destination_station_id: "${st_dal}", scheduled_departure_utc: "2026-10-01T19:00:00Z", scheduled_arrival_utc: "2026-10-01T20:01:00Z", capacity_seats: 143, turn_target_minutes: 30 }
              as: OpsController
              captures: { l4: $.data.id }
            - call: "POST /ops/crew-members"
              payload: { employee_ref: "C100", crew_role: "CAPTAIN", qualified_fleet: "SINGLE_FLEET", base_station_code: "DAL" }
              as: OpsController
              captures: { cm1: $.data.id }
          trigger:
            - call: "POST /ops/crew-pairings"
              payload: { pairing_date: "2026-10-01", crew_member_id: "${cm1}", leg_ids: ["${l1}", "${l2}", "${l3}"] }
              as: OpsController
              captures: { cp1: $.data.id }
            - call: "POST /ops/crew-pairings"
              payload: { pairing_date: "2026-10-01", crew_member_id: "${cm1}", leg_ids: ["${l1}", "${l2}", "${l4}"] }
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "pairing spanning 839 minutes (06:00 STD → 19:59 STA) is ACCEPTED: 839 <= 840 (MAX_DUTY_MINUTES boundary is inclusive)"
            - "pairing spanning 841 minutes returns error_id == ERR_CREW_LEGALITY_VIOLATION (HTTP 422) even though no two legs overlap — aggregate-window semantics, not half-open geometry"
            - "CrewPairing.${cp1}.pairing_status == ACTIVE"

  # =============================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =============================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_balance_redeem_then_void_restores
        grounds:
          - state_machines.TravelCredit.PARTIALLY_REDEEMED_to_OPEN
          - state_machines.PassengerJourney.BOOKED_to_BOOKED
          - calculations.travel_credit_mint
        distinguishing_aspect: |
          Conserved quantity: TravelCredit.remaining_amount_cents + sum(ACTIVE
          CreditRedemption.amount_cents) == initial_amount_cents at all times.
          Redeem 5000 (remaining 15000, active 5000), then change the paid
          journey (redemption VOIDED, remaining restored to 20000, active 0) —
          the forward+compensating pair leaves the invariant intact with zero
          drift.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare FLEX; aircraft; legs L1 (10-01) and L2 (10-02); passenger PA; J_SRC (20000, FLEX) cancelled → credit CR (20000, OPEN); J_NEW (10000, FLEX) BOOKED on L2"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2, credit_validity_days: 365 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN101", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-02T12:00:00Z", scheduled_arrival_utc: "2026-10-02T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg2: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKSRC", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 20000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_src: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j_src}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/credits"
              payload: { passenger_id: "${pa}" }
              as: Passenger
              as_user_id: "${pa}"
              captures: { cr_id: "$.data[0].id", cr_v: "$.data[0].version" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKNEW", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg2}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j_new: "$.data.journey_ids[0]" }
          trigger:
            - call: "POST /ops/credits/${cr_id}/redeem"
              payload: { journey_id: "${j_new}", amount_cents: 5000, expected_credit_version: "${cr_v}" }
              as: Passenger
              as_user_id: "${pa}"
            - call: "POST /ops/journeys/${j_new}/change"
              payload: { new_flight_leg_id: "${leg2}", new_fare_class_id: "${fc_flex}", new_base_fare_cents: 10000 }
              as: Passenger
              as_user_id: "${pa}"
            - call: "GET /ops/credits/${cr_id}"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { remaining: $.data.remaining_amount_cents, status: $.data.credit_status }
            - call: "GET /ops/credits/${cr_id}/redemptions"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
              captures: { red_status: "$.data[0].redemption_status" }
          assert:
            - "after redeem: remaining_amount_cents == 15000 and invariant 15000 + 5000 == 20000 (initial) holds"
            - "after compensating change: remaining_amount_cents == 20000 and the redemption row is VOIDED — invariant 20000 + 0 == 20000 restored with zero drift"
            - "credit_status returns to OPEN (compensation back-edge)"

      - name: boarding_position_conservation_under_upgrade_refund
        grounds:
          - state_machines.BoardingUpgrade.ACTIVE_to_REFUNDED
          - state_machines.BoardingAssignment.ACTIVE_to_VOIDED
          - calculations.boarding_position_assignment
        distinguishing_aspect: |
          Conserved quantity of a different type — ordered-set cardinality:
          the count of ACTIVE BoardingAssignments on a leg is conserved across
          an upgrade purchase + refund pair (purchase re-points the journey's
          assignment to A1-A15 rather than adding a row; refund voids the
          upgrade row and re-issues the original CHECKIN_TIME position, with
          the freed A-position NEVER backfilled). Active-count before == after,
          while the A1 slot remains permanently consumed.
        test_recipe:
          setup:
            - "Stations DAL/HOU; fare FLEX; aircraft seat_count 143; leg L1 STD 2026-10-01T12:00:00Z; passengers P1,P2 with CHECKED_IN journeys J1,J2 (active assignment count 2); J1 purchases UPGRADED_BOARDING (position 1) then refunds it before boarding opens"
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX", change_fee_cents: 0, included_bags: 2 }
              as: OpsController
              captures: { fc_flex: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN100", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg1: $.data.id, leg1_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P 1", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { p1: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P 2", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { p2: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKP1", journeys: [ { passenger_id: "${p1}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p1}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKP2", journeys: [ { passenger_id: "${p2}", flight_leg_id: "${leg1}", fare_class_id: "${fc_flex}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p2}"
              captures: { j2: "$.data.journey_ids[0]" }
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg1_v}" }
              as: Passenger
              as_user_id: "${p1}"
              captures: { leg1_v2: $.data.version }
            - call: "POST /ops/flight-legs/${leg1}/check-ins"
              payload: { journey_id: "${j2}", expected_leg_version: "${leg1_v2}" }
              as: Passenger
              as_user_id: "${p2}"
              captures: { leg1_v3: $.data.version }
          trigger:
            - call: "POST /ops/flight-legs/${leg1}/upgrades"
              payload: { journey_id: "${j1}", upgrade_type: "UPGRADED_BOARDING", expected_leg_version: "${leg1_v3}" }
              as: Passenger
              as_user_id: "${p1}"
              captures: { upg_id: $.data.id, upg_pos: $.data.position_granted }
            - call: "POST /ops/boarding-upgrades/${upg_id}/refund"
              payload: {}
              as: Passenger
              as_user_id: "${p1}"
            - call: "GET /ops/flight-legs/${leg1}/boarding-assignments"
              payload: { assignment_status: "ACTIVE" }
              as: GateAgent
              captures: { active_count: $.meta.total_count }
            - call: "GET /ops/journeys/${j1}/upgrades"
              payload: {}
              as: Passenger
              as_user_id: "${p1}"
              captures: { upg_status: "$.data[0].upgrade_status" }
          assert:
            - "ACTIVE assignment count on the leg == 2 before purchase, == 2 after purchase (re-point, not add), == 2 after refund — cardinality conserved across the forward+compensating pair"
            - "BoardingUpgrade.${upg_id}.upgrade_status == REFUNDED"
            - "J1's restored assignment has assignment_source == CHECKIN_TIME and its original group A position 16 (recomputed order: J1 checked in first)"
            - "a subsequent UPGRADED_BOARDING purchase on J2 grants position 2, NOT 1 — the refunded A1 slot is never backfilled (position counter monotone)"
