              captures: { err: $.data.error_id }
          assert:
            - "${route} == REMEDIATION"
            - "HTTP 409"
            - "${err} == ERR_COMPLAINT_ROUTE_MISMATCH"
            - "Complaint.${cmp_id}.state == TRIAGED"
            - "Complaint.${cmp_id}.accommodation_fulfilled_at is null"
            - "Product.${prod_id}.accommodations_fulfilled_count == 0"

      - name: corner_resolve_with_run_on_other_component_rejected
        claim_type: violation_to_error
        grounds:
