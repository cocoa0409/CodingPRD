            - "${err_1} == ERR_SITE_POSTURE_CRITICAL with HTTP 409, NOT ERR_INSUFFICIENT_TELEMETRY and NOT ERR_REVIEW_NOT_DRAFT"
            - "${posture_after} == NORMAL - the retrieval order cancelled the QUEUED auto-ticket, and nothing about the review changed"
            - "${err_2} == ERR_INSUFFICIENT_TELEMETRY with HTTP 422 - the constraint rule was violated all along and was outranked by the safety rule"
            - "UsageVarianceReview.${rev_id}.status == DRAFT and published_by_user_id == null after both attempts"

  - rule_id: boundary_precision_check
    instances:
      - name: drift_pct_tolerance_and_hard_fail_boundaries_are_inclusive_on_the_passing_side
        grounds:
          - calculations.concentration_drift_verdict
          - entities.CalibrationRecord.fields.drift_pct
          - entities.ChemicalProduct.fields.concentration_tolerance_pct
          - endpoints.POST_service_visits_visit_id_calibration_records
        distinguishing_aspect: |
          Metric is drift_pct - a signed percentage rounded to 2 decimals with round_half_up, compared
          against BOTH the product tolerance 10.00 and HARD_FAIL_DRIFT_PCT 25.00 - and the endpoint is
          POST /warewashing/service-visits/{visit_id}/calibration-records. Four probes pin both
          boundaries from both sides against a 1200 ppm target: 1080 ppm gives exactly -10.00 and must
          be PASS (equality is on the passing side), 1079 ppm gives -10.08 and must be ADJUSTED,
          1500 ppm gives exactly 25.00 and must still be ADJUSTED rather than FAIL, and 1501 ppm gives
          25.08 and must be FAIL. The rounding must happen before the comparison: -10.0833... would
          be out of tolerance either way, but a 1206 ppm probe (0.50 exactly) shows the rounded value is
          what the branches see.
        test_recipe:
          setup:
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and stays there."
            - "One INSTALLED placement with one DET-100 dispenser (target 1200 ppm, concentration_tolerance_pct left at its 10.00 default) at dose 8.00."
            - "One QUEUED CUSTOMER_REPORT RACK_QUALITY ticket, dispatched to the single AVAILABLE NW technician, with a visit that has already arrived, so the visit is IN_PROGRESS and accepts calibration records."
            - "The visit is deliberately never submitted or verified: no record is applied, so every assertion is about the values stamped at record creation."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Beacon Street Grill", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id, tol: $.data.concentration_tolerance_pct }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Beacon Street Kitchen", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-2701-K", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-901", expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Kit Marsh", region_code: "NW", certification_level: "L2", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${det_id}", calibrated_dose_ml_per_rack: 8.00 }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { disp_id: $.data.id, disp_v: $.data.version }
            - call: "POST /warewashing/service-tickets"
              payload: { placement_id: "${pl_id}", reported_symptom: "RACK_QUALITY" }
              as: CustomerContact
              as_user_id: "${cust_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /warewashing/service-tickets/${ticket_id}/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { assigned: $.data.assigned_technician_id }
            - call: "POST /warewashing/service-visits"
              payload: { ticket_id: "${ticket_id}", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/service-visits/${visit_id}/arrive"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /warewashing/service-visits/${visit_id}/calibration-records"
              payload: { dispenser_id: "${disp_id}", measured_ppm: 1080, measured_dose_ml_per_rack: 8.00, expected_dispenser_version: "${disp_v}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { drift_at: $.data.drift_pct, verdict_at: $.data.calibration_verdict, eff_at: $.data.efficacy_result }
            - call: "POST /warewashing/service-visits/${visit_id}/calibration-records"
              payload: { dispenser_id: "${disp_id}", measured_ppm: 1079, measured_dose_ml_per_rack: 8.00, adjusted_dose_ml_per_rack: 8.80, expected_dispenser_version: "${disp_v}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { drift_below: $.data.drift_pct, verdict_below: $.data.calibration_verdict }
            - call: "POST /warewashing/service-visits/${visit_id}/calibration-records"
              payload: { dispenser_id: "${disp_id}", measured_ppm: 1206, measured_dose_ml_per_rack: 8.00, expected_dispenser_version: "${disp_v}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { drift_half: $.data.drift_pct, verdict_half: $.data.calibration_verdict }
            - call: "POST /warewashing/service-visits/${visit_id}/calibration-records"
              payload: { dispenser_id: "${disp_id}", measured_ppm: 1500, measured_dose_ml_per_rack: 8.00, adjusted_dose_ml_per_rack: 6.40, expected_dispenser_version: "${disp_v}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { drift_hard: $.data.drift_pct, verdict_hard: $.data.calibration_verdict }
            - call: "POST /warewashing/service-visits/${visit_id}/calibration-records"
              payload: { dispenser_id: "${disp_id}", measured_ppm: 1501, measured_dose_ml_per_rack: 8.00, adjusted_dose_ml_per_rack: 6.40, expected_dispenser_version: "${disp_v}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { drift_over: $.data.drift_pct, verdict_over: $.data.calibration_verdict }
          assert:
            - "${tol} == 10.00 - the tolerance default was applied, not supplied"
            - "${assigned} == ${tech_id} and the visit is IN_PROGRESS when the records are filed"
            - "${drift_at} == -10.00 and ${verdict_at} == PASS - abs(drift) == tol is inclusive on the passing side, and no adjusted_dose_ml_per_rack was required"
            - "${drift_below} == -10.08 and ${verdict_below} == ADJUSTED - one ppm further out crosses the tolerance"
            - "${drift_half} == 0.50 and ${verdict_half} == PASS - (1206 - 1200) / 1200 * 100 is exactly 0.50 with no round_half_up ambiguity"
            - "${drift_hard} == 25.00 and ${verdict_hard} == ADJUSTED - abs(drift) == HARD_FAIL_DRIFT_PCT is still the passing side of the hard-fail branch, so FAIL here is wrong"
            - "${drift_over} == 25.08 and ${verdict_over} == FAIL"
            - "${eff_at} == NOT_APPLICABLE on every record - DET-100 is a DETERGENT, so no sanitizer efficacy verdict is computed and contact_seconds is absent"
            - "Dispenser.${disp_id}.calibrated_dose_ml_per_rack is still 8.00 and applied == false on all five records - nothing is applied until the visit is VERIFIED"
            - "ServiceVisit.${visit_id}.calibration_record_count == 5"

