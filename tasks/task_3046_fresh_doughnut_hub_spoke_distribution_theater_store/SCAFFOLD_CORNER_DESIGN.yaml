# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Doughnut Hub-and-Spoke / Theater Store Operations
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: network_create_returns_201_with_defaults
        claim_type: creation
        grounds: [entities.Network, endpoints]
        distinguishing_aspect: "POST /networks with required fields returns 201; network_posture defaults OPEN and ops_run_index defaults 0; system fields id/created_at/updated_at/version are server-set."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /networks"
              payload: { network_code: "NX", display_name: "Net X" }
              as: NetworkAdmin
              captures: { nx: $.data.id, nx_posture: $.data.network_posture, nx_idx: $.data.ops_run_index }
          assert:
            - "HTTP 201; Network.${nx}.network_posture == OPEN"
            - "Network.${nx}.ops_run_index == 0"
            - "version == 1 and created_at present"

      - name: network_create_missing_network_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Network"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input field network_code yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /networks"
              payload: { display_name: "No Code Net" }
              as: NetworkAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http 400"

      - name: variety_inverted_window_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Variety"
          - "validations[priority=6]"
          - "errors[ERR_WINDOW_OVERLAP]"
        distinguishing_aspect: "Variety with active_until <= active_from violates the window constraint (active_from < active_until) -> ERR_WINDOW_OVERLAP."
        test_recipe:
          setup: ["Network NV exists"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NV", display_name: "Net V" }
              as: NetworkAdmin
              captures: { nv: $.data.id }
          trigger:
            - call: "POST /networks/${nv}/varieties"
              payload: { variety_code: "BAD", collection_kind: "CORE", active_from: "2026-09-10T00:00:00Z", active_until: "2026-09-01T00:00:00Z", unit_cost_cents: 80 }
              as: NetworkAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_OVERLAP and http 422"

      - name: door_invalid_enum_kind_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Door"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "door_kind outside {THEATER, SPOKE, GROCERY, PARTNER} is rejected as invalid enum."
        test_recipe:
          setup: ["Network NE exists"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NE", display_name: "Net E" }
              as: NetworkAdmin
              captures: { ne: $.data.id }
          trigger:
            - call: "POST /networks/${ne}/doors"
              payload: { door_kind: "KIOSK", ownership: "COMPANY", territory_region: "R" }
              as: NetworkAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http 400"

      - name: get_nonexistent_network_returns_not_found
        claim_type: not_found
        grounds:
          - "entities.Network"
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET on a well-formed but nonexistent network id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /networks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: NetworkAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http 404"

      - name: list_doors_pagination_envelope
        claim_type: listing
        grounds: [entities.Door, response_envelope]
        distinguishing_aspect: "GET /networks/{nid}/doors returns pagination fields limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["Network NP exists with 2 doors"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NP", display_name: "Net P" }
              as: NetworkAdmin
              captures: { np: $.data.id }
            - call: "POST /networks/${np}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "RP" }
              as: NetworkAdmin
            - call: "POST /networks/${np}/doors"
              payload: { door_kind: "GROCERY", ownership: "COMPANY", territory_region: "RP" }
              as: NetworkAdmin
          trigger:
            - call: "GET /networks/${np}/doors"
              payload: {}
              as: NetworkAdmin
          assert:
            - "response is array with total_count == 2, has_more == false, limit == 10, offset == 0"

      - name: computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Hub]
        distinguishing_aspect: "Client-supplied committed_dozens_today on hub create is ignored; the computed field starts at 0."
        test_recipe:
          setup: ["Network NC exists"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NC", display_name: "Net C" }
              as: NetworkAdmin
              captures: { nc: $.data.id }
          trigger:
            - call: "POST /networks/${nc}/hubs"
              payload: { hub_code: "HC", daily_capacity_dozens: 300, territory_region: "RC", committed_dozens_today: 999 }
              as: NetworkAdmin
              captures: { hc: $.data.id }
          assert:
            - "Hub.${hc}.committed_dozens_today == 0 (computed input ignored)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: batch_invalid_transition_start_from_scheduled
        claim_type: invalid_transition
        grounds: [state_machines.ProductionBatch]
        distinguishing_aspect: "start on a SCHEDULED (never committed) batch is not in the transition list -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Network NS, hub HS (cap 500), line LS; batch BS SCHEDULED"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NS", display_name: "Net S" }
              as: NetworkAdmin
              captures: { ns: $.data.id }
            - call: "POST /networks/${ns}/hubs"
              payload: { hub_code: "HS", daily_capacity_dozens: 500, territory_region: "RS" }
              as: NetworkAdmin
              captures: { hs: $.data.id }
            - call: "POST /networks/${ns}/hubs/${hs}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { ls: $.data.id }
            - call: "POST /networks/${ns}/hubs/${hs}/batches"
              payload: { equipment_line_id: "${ls}", production_date: "2026-09-01", planned_dozens: 50 }
              as: HubManager
              captures: { bs: $.data.id }
          trigger:
            - call: "POST /networks/${ns}/hubs/${hs}/batches/${bs}/start"
              payload: {}
              as: HubManager
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (SCHEDULED -> RUNNING not allowed)"
            - "Batch remains SCHEDULED"

      - name: terminal_batch_rejects_complete
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.ProductionBatch"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "complete on a CANCELLED batch (terminal) is rejected; no side effects fire."
        test_recipe:
          setup: ["Network NT, hub HT, line LT; batch BT cancelled from SCHEDULED"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NT", display_name: "Net T" }
              as: NetworkAdmin
              captures: { nt: $.data.id }
            - call: "POST /networks/${nt}/hubs"
              payload: { hub_code: "HT", daily_capacity_dozens: 500, territory_region: "RT" }
              as: NetworkAdmin
              captures: { ht: $.data.id }
            - call: "POST /networks/${nt}/hubs/${ht}/lines"
              payload: { line_kind: "GLAZE_WATERFALL", rated_dozens_per_hour: 80, service_interval_hours: 100 }
              as: HubManager
              captures: { lt: $.data.id }
            - call: "POST /networks/${nt}/hubs/${ht}/batches"
              payload: { equipment_line_id: "${lt}", production_date: "2026-09-01", planned_dozens: 40 }
              as: HubManager
              captures: { bt: $.data.id }
            - call: "POST /networks/${nt}/hubs/${ht}/batches/${bt}/cancel"
              payload: {}
              as: HubManager
          trigger:
            - call: "POST /networks/${nt}/hubs/${ht}/batches/${bt}/complete"
              payload: { produced_dozens: 40 }
              as: HubManager
              captures: { e: $.data.error_id }
          assert:
            - "error_id in {ERR_ALREADY_TERMINAL, ERR_INVALID_STATE} and batch stays CANCELLED"

      - name: hot_light_on_non_theater_door_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_TERRITORY_VIOLATION]"
        distinguishing_aspect: "Creating a HotLightWindow for a SPOKE door violates the THEATER-only rule -> ERR_TERRITORY_VIOLATION."
        test_recipe:
          setup: ["Network NH with SPOKE FRANCHISE door DH supplied by hub HH (same region)"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NH", display_name: "Net H" }
              as: NetworkAdmin
              captures: { nh: $.data.id }
            - call: "POST /networks/${nh}/hubs"
              payload: { hub_code: "HH", daily_capacity_dozens: 500, territory_region: "RH" }
              as: NetworkAdmin
              captures: { hh: $.data.id }
            - call: "POST /networks/${nh}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "RH", hub_id: "${hh}" }
              as: NetworkAdmin
              captures: { dh: $.data.id }
          trigger:
            - call: "POST /networks/${nh}/doors/${dh}/hot-light-windows"
              payload: { lit_start: "2026-09-01T06:00:00Z", lit_end: "2026-09-01T08:00:00Z" }
              as: DoorManager
              as_user_id: "${dh}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_TERRITORY_VIOLATION and http 422"

      - name: franchise_door_territory_mismatch_rejected
        claim_type: precondition_enforcement
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_TERRITORY_VIOLATION]"
        distinguishing_aspect: "FRANCHISE door whose territory_region differs from its hub's territory_region is rejected; COMPANY doors are exempt."
        test_recipe:
          setup: ["Network NTR, hub HTR in region RA"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NTR", display_name: "Net TR" }
              as: NetworkAdmin
              captures: { ntr: $.data.id }
            - call: "POST /networks/${ntr}/hubs"
              payload: { hub_code: "HTR", daily_capacity_dozens: 500, territory_region: "RA" }
              as: NetworkAdmin
              captures: { htr: $.data.id }
          trigger:
            - call: "POST /networks/${ntr}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "RB", hub_id: "${htr}" }
              as: NetworkAdmin
              captures: { e: $.data.error_id }
            - call: "POST /networks/${ntr}/doors"
              payload: { door_kind: "SPOKE", ownership: "COMPANY", territory_region: "RB", hub_id: "${htr}" }
              as: NetworkAdmin
              captures: { ok_door: $.data.id }
          assert:
            - "FRANCHISE+region-mismatch create -> ERR_TERRITORY_VIOLATION"
            - "COMPANY+region-mismatch create succeeds (201)"

      - name: route_dispatch_blocked_over_vehicle_capacity
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Route.LOCKED_to_DISPATCHED"
          - "errors[ERR_CAPACITY_EXCEEDED]"
        distinguishing_aspect: "Dispatching a route whose loaded_dozens exceeds vehicle_capacity_dozens fails with ERR_CAPACITY_EXCEEDED at priority 9."
        test_recipe:
          setup: ["Network NRC, hub HRC (cap 500), line LRC; batch BRC COMPLETED 100; route RRC capacity 30 LOCKED with stop SRC and shipment of 40"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NRC", display_name: "Net RC" }
              as: NetworkAdmin
              captures: { nrc: $.data.id }
            - call: "POST /networks/${nrc}/hubs"
              payload: { hub_code: "HRC", daily_capacity_dozens: 500, territory_region: "RRC" }
              as: NetworkAdmin
              captures: { hrc: $.data.id, hrc_v: $.data.version }
            - call: "POST /networks/${nrc}/hubs/${hrc}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { lrc: $.data.id }
            - call: "POST /networks/${nrc}/doors"
              payload: { door_kind: "GROCERY", ownership: "COMPANY", territory_region: "RRC", hub_id: "${hrc}" }
              as: NetworkAdmin
              captures: { drc: $.data.id }
            - call: "POST /networks/${nrc}/hubs/${hrc}/batches"
              payload: { equipment_line_id: "${lrc}", production_date: "2026-09-01", planned_dozens: 100 }
              as: HubManager
              captures: { brc: $.data.id }
            - call: "POST /networks/${nrc}/hubs/${hrc}/batches/${brc}/commit"
              payload: { expected_hub_version: "${hrc_v}" }
              as: HubManager
            - call: "POST /networks/${nrc}/hubs/${hrc}/batches/${brc}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${nrc}/hubs/${hrc}/batches/${brc}/complete"
              payload: { produced_dozens: 100 }
              as: HubManager
            - call: "POST /networks/${nrc}/hubs/${hrc}/routes"
              payload: { route_code: "RRC", service_date: "2026-09-01", vehicle_capacity_dozens: 30 }
              as: RoutePlanner
              captures: { rrc: $.data.id }
            - call: "POST /networks/${nrc}/hubs/${hrc}/routes/${rrc}/stops"
              payload: { door_id: "${drc}", sequence_no: 1, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T10:00:00Z" }
              as: RoutePlanner
              captures: { src: $.data.id }
            - call: "POST /networks/${nrc}/hubs/${hrc}/routes/${rrc}/stops/${src}/shipments"
              payload: { production_batch_id: "${brc}", dozens_shipped: 40 }
              as: RoutePlanner
            - call: "POST /networks/${nrc}/hubs/${hrc}/routes/${rrc}/lock"
              payload: {}
              as: RoutePlanner
          trigger:
            - call: "POST /networks/${nrc}/hubs/${hrc}/routes/${rrc}/dispatch"
              payload: {}
              as: RoutePlanner
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_CAPACITY_EXCEEDED (loaded 40 > capacity 30)"
            - "Route remains LOCKED"

      - name: route_lock_without_stops_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Route.PLANNING_to_LOCKED"
          - "errors[ERR_ROUTE_NOT_LOCKABLE]"
        distinguishing_aspect: "Locking a route with zero stops violates the at-least-one-stop precondition -> ERR_ROUTE_NOT_LOCKABLE."
        test_recipe:
          setup: ["Network NRL, hub HRL, route RRL with no stops"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NRL", display_name: "Net RL" }
              as: NetworkAdmin
              captures: { nrl: $.data.id }
            - call: "POST /networks/${nrl}/hubs"
              payload: { hub_code: "HRL", daily_capacity_dozens: 500, territory_region: "RRL" }
              as: NetworkAdmin
              captures: { hrl: $.data.id }
            - call: "POST /networks/${nrl}/hubs/${hrl}/routes"
              payload: { route_code: "RRL", service_date: "2026-09-01", vehicle_capacity_dozens: 100 }
              as: RoutePlanner
              captures: { rrl: $.data.id }
          trigger:
            - call: "POST /networks/${nrl}/hubs/${hrl}/routes/${rrl}/lock"
              payload: {}
              as: RoutePlanner
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_NOT_LOCKABLE and route remains PLANNING"

      - name: duplicate_sequence_no_rejected
        claim_type: violation_to_error
        grounds:
          - "entities.RouteStop"
          - "errors[ERR_DUPLICATE_SEQUENCE]"
        distinguishing_aspect: "Two stops on the same route with identical sequence_no violate per-route uniqueness -> ERR_DUPLICATE_SEQUENCE."
        test_recipe:
          setup: ["Network NDQ, hub HDQ, route RDQ (PLANNING) with stop seq 1 already present; doors DDQ1/DDQ2 distinct so window-overlap does not fire first"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NDQ", display_name: "Net DQ" }
              as: NetworkAdmin
              captures: { ndq: $.data.id }
            - call: "POST /networks/${ndq}/hubs"
              payload: { hub_code: "HDQ", daily_capacity_dozens: 500, territory_region: "RDQ" }
              as: NetworkAdmin
              captures: { hdq: $.data.id }
            - call: "POST /networks/${ndq}/doors"
              payload: { door_kind: "GROCERY", ownership: "COMPANY", territory_region: "RDQ", hub_id: "${hdq}" }
              as: NetworkAdmin
              captures: { ddq1: $.data.id }
            - call: "POST /networks/${ndq}/doors"
              payload: { door_kind: "PARTNER", ownership: "COMPANY", territory_region: "RDQ", hub_id: "${hdq}" }
              as: NetworkAdmin
              captures: { ddq2: $.data.id }
            - call: "POST /networks/${ndq}/hubs/${hdq}/routes"
              payload: { route_code: "RDQ", service_date: "2026-09-01", vehicle_capacity_dozens: 100 }
              as: RoutePlanner
              captures: { rdq: $.data.id }
            - call: "POST /networks/${ndq}/hubs/${hdq}/routes/${rdq}/stops"
              payload: { door_id: "${ddq1}", sequence_no: 1, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T09:00:00Z" }
              as: RoutePlanner
          trigger:
            - call: "POST /networks/${ndq}/hubs/${hdq}/routes/${rdq}/stops"
              payload: { door_id: "${ddq2}", sequence_no: 1, window_start: "2026-09-01T09:00:00Z", window_end: "2026-09-01T10:00:00Z" }
              as: RoutePlanner
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_SEQUENCE and http 422"

      - name: fundraiser_fulfill_wrong_pickup_code
        claim_type: violation_to_error
        grounds:
          - "state_machines.FundraiserOrder.READY_to_FULFILLED"
          - "errors[ERR_PICKUP_CODE_MISMATCH]"
        distinguishing_aspect: "Fulfill with a pickup_code that does not match the issued code fails with ERR_PICKUP_CODE_MISMATCH; order stays READY."
        test_recipe:
          setup:
            - "Network NF, hub HF (cap 1000), line LF; THEATER COMPANY door DF region RF"
            - "Order FF 5 dozen approved, scheduled; batch BF COMPLETED 20 dozen; order marked READY (pickup_code issued); clock within grace"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NF", display_name: "Net F" }
              as: NetworkAdmin
              captures: { nf: $.data.id }
            - call: "POST /networks/${nf}/hubs"
              payload: { hub_code: "HF", daily_capacity_dozens: 1000, territory_region: "RF" }
              as: NetworkAdmin
              captures: { hf: $.data.id, hf_v: $.data.version }
            - call: "POST /networks/${nf}/hubs/${hf}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 200 }
              as: HubManager
              captures: { lf: $.data.id }
            - call: "POST /networks/${nf}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "RF" }
              as: NetworkAdmin
              captures: { df: $.data.id }
            - call: "POST /networks/${nf}/doors/${df}/fundraiser-orders"
              payload: { organization_name: "Choir", requested_dozens: 5, pickup_at: "2026-09-01T15:00:00Z" }
              as: DoorManager
              as_user_id: "${df}"
              captures: { ff: $.data.id }
            - call: "POST /networks/${nf}/doors/${df}/fundraiser-orders/${ff}/approve"
              payload: {}
              as: DoorManager
              as_user_id: "${df}"
            - call: "POST /networks/${nf}/hubs/${hf}/batches"
              payload: { equipment_line_id: "${lf}", production_date: "2026-09-01", planned_dozens: 20 }
              as: HubManager
              captures: { bf: $.data.id }
            - call: "POST /networks/${nf}/hubs/${hf}/batches/${bf}/commit"
              payload: { expected_hub_version: "${hf_v}" }
              as: HubManager
            - call: "POST /networks/${nf}/doors/${df}/fundraiser-orders/${ff}/schedule"
              payload: {}
              as: DoorManager
              as_user_id: "${df}"
            - call: "POST /networks/${nf}/hubs/${hf}/batches/${bf}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${nf}/hubs/${hf}/batches/${bf}/complete"
              payload: { produced_dozens: 20 }
              as: HubManager
            - call: "POST /networks/${nf}/doors/${df}/fundraiser-orders/${ff}/ready"
              payload: {}
              as: DoorManager
              as_user_id: "${df}"
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T15:30:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /networks/${nf}/doors/${df}/fundraiser-orders/${ff}/fulfill"
              payload: { pickup_code: "WRONGCODE" }
              as: DoorManager
              as_user_id: "${df}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_PICKUP_CODE_MISMATCH"
            - "FundraiserOrder.${ff}.fundraiser_status remains READY"

      - name: ready_fundraiser_expires_at_ops_run_past_grace
        claim_type: side_effect_execution
        grounds: [state_machines.FundraiserOrder.READY_to_EXPIRED, endpoints]
        distinguishing_aspect: "Ops-run checkpoint auto-expires READY orders whose pickup grace has passed; reserved dozens release."
        test_recipe:
          setup:
            - "Network NX9, hub HX9 (cap 1000), line LX9; THEATER COMPANY door DX9"
            - "Order FX9 5 dozen in READY with pickup_at 2026-09-01T10:00:00Z; covering batch completed; clock advanced to 2026-09-02 (past grace)"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "NX9", display_name: "Net X9" }
              as: NetworkAdmin
              captures: { nx9: $.data.id }
            - call: "POST /networks/${nx9}/hubs"
              payload: { hub_code: "HX9", daily_capacity_dozens: 1000, territory_region: "RX9" }
              as: NetworkAdmin
              captures: { hx9: $.data.id, hx9_v: $.data.version }
            - call: "POST /networks/${nx9}/hubs/${hx9}/lines"
              payload: { line_kind: "GLAZE_WATERFALL", rated_dozens_per_hour: 100, service_interval_hours: 300 }
              as: HubManager
              captures: { lx9: $.data.id }
            - call: "POST /networks/${nx9}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "RX9" }
              as: NetworkAdmin
              captures: { dx9: $.data.id }
            - call: "POST /networks/${nx9}/doors/${dx9}/fundraiser-orders"
