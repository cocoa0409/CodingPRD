              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000013001", subject: "SOCIAL_STUDIES", grade_low: 9, grade_high: 9, copyright_year: 2026, content_tags: ["PRIMARY_SOURCES"], page_count: 300, signature_page_capacity: 384, list_price_cents: 9100 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "GA.SS.9.1", depth_level: "MENTION", page_reference: "p. 120", evidence_citation: "The standard is named in the chapter opener only." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ga_id}"
          trigger:
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "GA.SS.11.9", depth_level: "MASTERY", page_reference: "pp. 200-240", evidence_citation: "A code that is not in this state's framework at all." }
              as: PublisherEditor
              captures: { err_code: $.data.error_id }
            - call: "POST /submissions/${sub_id}/file"
