      - name: assign_artist_over_daily_capacity_returns_error
        claim_type: aggregate_validation
        grounds:
          - validations[priority=14]
          - errors[ERR_ARTIST_CAPACITY_EXCEEDED]
        distinguishing_aspect: "With daily_capacity 1, a second (non-overlapping) RESERVED assignment on the same date exceeds capacity and returns ERR_ARTIST_CAPACITY_EXCEEDED (409)."
        test_recipe:
          setup: ["Account, contact, card, artist capacity 1, two draft orders; first assigned [09:00,10:00)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "vv4@x.com", display_name: "VV4" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /contacts"
              payload: { account_id: "${acct_id}", full_name: "Vv4", address_line1: "1 V", city: "LA", region: "CA", postal_code: "90001", country_code: "US" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { contact_id: $.data.id }
            - call: "POST /cards"
              payload: { sku: "CVV4", title: "Bday", category: "BIRTHDAY", base_price_cents: 200, weight_grams: 10 }
              as: PlatformAdmin
              captures: { card_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "PenCap", daily_capacity: 1, region_code: "CA" }
              as: PlatformAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "a", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_a: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", contact_id: "${contact_id}", card_id: "${card_id}", message_text: "b", scheduled_send_at: "2026-04-01T00:00:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_a}/assign-artist"
              payload: { artist_id: "${artist_id}", window_start: "2026-04-01T09:00:00Z", window_end: "2026-04-01T10:00:00Z" }
              as: StudioOperator
          trigger:
            - call: "POST /orders/${order_b}/assign-artist"
              payload: { artist_id: "${artist_id}", window_start: "2026-04-01T11:00:00Z", window_end: "2026-04-01T12:00:00Z" }
              as: StudioOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ARTIST_CAPACITY_EXCEEDED"
            - "HTTP status == 409"

      - name: order_gift_without_quantity_returns_invalid
        claim_type: conditional_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_GIFT_QUANTITY_INVALID]
        distinguishing_aspect: "POST /orders with gift_item_id present but gift_quantity 0 returns ERR_GIFT_QUANTITY_INVALID (422)."
        test_recipe:
          setup: ["Account, contact, card, gift."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "vv5@x.com", display_name: "VV5" }
