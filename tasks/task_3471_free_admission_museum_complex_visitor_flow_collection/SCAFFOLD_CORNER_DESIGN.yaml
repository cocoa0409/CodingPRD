          assert:
            - "headcount 41 fails err_size == ERR_GROUP_TOO_LARGE (422) — oversized groups are rejected outright, never waitlisted"
            - "visit 2026-10-06 (a Tuesday) fails err_day == ERR_PROGRAM_DAY_MISMATCH (422)"
            - "the follow-up GET /campus/school-reservations?program_id=... returns total_count 0 (no reservation rows created)"

      - name: docent_certification_and_double_booking_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_DOCENT_NOT_CERTIFIED]
        distinguishing_aspect: "Both docent gates share one error: a BASIC docent assigned to an ADVANCED-required program fails, and an already-booked docent assigned to a second SCHEDULED program on the same service_date fails — certification and double-booking are checked at assignment creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Museum; program ADVANCED-required (MON, gallery A1, 600-660); program B BASIC (MON, gallery B1, 600-660); program C BASIC (MON, gallery C1, 600-660); BASIC docent One and BASIC docent Two."
            - "Docent Two already ASSIGNED to program B for 2026-10-05."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "SAAM", display_name: "American Art", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Advanced Ceramics", gallery_code: "A1", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 20, docent_ratio: 10, max_group_size: 20, required_docent_certification: "ADVANCED" }
              as: ProgramCoordinator
              captures: { prog_adv: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Basic Drawing", gallery_code: "B1", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 20, docent_ratio: 10, max_group_size: 20, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_b: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Basic Sculpture", gallery_code: "C1", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 20, docent_ratio: 10, max_group_size: 20, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_c: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent One", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { d1: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent Two", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { d2: $.data.id }
            - call: "POST /campus/education-programs/${prog_b}/docent-assignments"
              payload: { docent_id: "${d2}", service_date: "2026-10-05" }
              as: ProgramCoordinator
              captures: { asg_b: $.data.id }
          trigger:
            - call: "POST /campus/education-programs/${prog_adv}/docent-assignments"
              payload: { docent_id: "${d1}", service_date: "2026-10-05" }
              as: ProgramCoordinator
              captures: { err_cert: $.data.error_id }
            - call: "POST /campus/education-programs/${prog_c}/docent-assignments"
              payload: { docent_id: "${d2}", service_date: "2026-10-05" }
              as: ProgramCoordinator
              captures: { err_double: $.data.error_id }
          assert:
            - "BASIC docent on ADVANCED program fails err_cert == ERR_DOCENT_NOT_CERTIFIED (422)"
            - "double-booking docent Two on the same service_date fails err_double == ERR_DOCENT_NOT_CERTIFIED (422)"
            - "DocentAssignment.${asg_b}.status remains ASSIGNED (unaffected)"

      - name: timed_pass_not_used_here_rejected
