              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_future_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2026-01-04T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
          trigger:
            - call: "POST /monitors/${mon_id}/approve"
              payload: { approval_note: "Attempted before the designation takes effect" }
              as: EpaRegionalReviewer
              captures: { err_id: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitors/${mon_id}/approve"
              payload: { approval_note: "Designation now effective" }
              as: EpaRegionalReviewer
          assert:
            - "first approve attempt: response status == 422 and ${err_id} == ERR_METHOD_NOT_DESIGNATED"
            - "first approve attempt: Monitor.${mon_id}.monitor_status == PENDING_APPROVAL"
            - "second approve attempt: response status == 200"
            - "second approve attempt: Monitor.${mon_id}.monitor_status == APPROVED"
            - "ReferenceMethod.${frm_future_id}.designation_status == DESIGNATED throughout"
            - "ReferenceMethod.${frm_future_id}.designation_change_count == 0"

      - name: site_change_request_approval_requires_approved_assessment
        grounds:
          - validations[priority=53]
          - state_machines.SiteChangeRequest.SUBMITTED_to_APPROVED
          - state_machines.NetworkAssessment.SUBMITTED_to_APPROVED
          - errors[ERR_ASSESSMENT_NOT_APPROVED]
          - entities.MonitoringNetwork.fields.network_status
        distinguishing_aspect: |
          The SiteChangeRequest -> NetworkAssessment pair: an identical APPROVE decision is rejected with
          ERR_ASSESSMENT_NOT_APPROVED while the cited assessment is only SUBMITTED and succeeds once the assessment reaches
          APPROVED, so the gate lives entirely in the other entity's state. A different entity pair from
          monitor_approval_requires_effective_method_designation.
