      - name: suspended_supplier_transitions_are_rejected
        claim_type: every error code triggerable
        grounds:
          - errors[ERR_INVALID_SUPPLIER_STATE]
          - state_machines[Supplier.dd_status]
          - endpoints["POST /suppliers/{id}/suspensions"]
        distinguishing_aspect: "SUSPENDED is terminal in both directions: once a VERIFIED supplier is suspended, a fresh due-diligence verification is refused with ERR_INVALID_SUPPLIER_STATE and so is a second suspension, while suspending straight from PENDING is a legal declared transition."
        test_recipe:
          setup:
            - "One supplier that is documented, VERIFIED and then SUSPENDED."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "ORIGIN_ATTESTATION", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-orig-2702-z5" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "MASS_BALANCE_STATEMENT", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-mb-2702-z5" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/due-diligence-verifications"
              payload: { valid_months: 12 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /suppliers/${sup_id}/suspensions"
              payload: { reason: "Traceability audit failure" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /suppliers/${sup_id}/due-diligence-verifications"
              payload: { valid_months: 12 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /suppliers/${sup_id}/suspensions"
              payload: { reason: "Duplicate suspension attempt" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
          assert:
            - "The verification after the two documents returns 200 with dd_status VERIFIED and dd_expires_at 2027-08-01T00:00:00Z"
            - "The suspension of the VERIFIED supplier returns 200 with dd_status SUSPENDED"
            - "The re-verification returns 409 ERR_INVALID_SUPPLIER_STATE and leaves dd_status SUSPENDED"
            - "The second suspension also returns 409 ERR_INVALID_SUPPLIER_STATE (SUSPENDED is outside the declared precondition set {PENDING, VERIFIED})"
            - "Supplier.${sup_id}.dd_document_type_count == 2 throughout"

