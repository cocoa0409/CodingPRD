            - "the new window 2026-08-10..2026-08-12 still clears job2 by more than one full calendar day, so the priority-64 booking-conflict check passes and the 412 was the ONLY reason the first attempt failed"
            - "InstallationJob.${job1_id}.status is still SCHEDULED throughout - a reschedule is not a state transition"

      - name: project_funds_and_allocation_buckets_reconcile_across_two_collects_and_a_partial_refund
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
          - calculations.fundraising_allocation
          - endpoints[POST /playground/projects/{id}/pledges]
          - endpoints[POST /playground/pledges/{id}/collect]
          - endpoints[POST /playground/pledges/{id}/refund]
          - entities.DesignProject
          - state_machines.FundraisingPledge
        distinguishing_aspect: >-
          Five derived fields on DesignProject (funds_collected_cents plus the four alloc_* buckets) are
          re-derived from the pledge table on every collect and refund, never incrementally patched. With
          TWO collected pledges the reconciliation is observable at four distinct points - after the
          creates (nothing collected), after a first partial collect that only half fills the SURFACING
          bucket's successor, after a second collect that overflows into CONTINGENCY, and after refunding
          only the second pledge, which must restore the exact three-bucket picture of the first collect.
          An implementation that adds and subtracts deltas instead of recomputing drifts on the refund
          (typically leaving CONTINGENCY at 6000 or STRUCTURE at 25800).
