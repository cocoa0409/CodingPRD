            - "Mold MLD-CD-SUP-LIVE on PM-CD-SUP-A, left AVAILABLE, so it is an existing but ineligible target."
            - "Mold MLD-CD-SUP-OTHER on PM-CD-SUP-B, retired, so it is retired but belongs to the wrong hull model."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
