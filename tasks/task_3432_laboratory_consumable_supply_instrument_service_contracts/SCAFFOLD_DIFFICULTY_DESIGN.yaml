              as: LabProcurement
              as_user_id: "${a_id}"
              captures: { pm2: $.data.id }
            - call: "POST /lab/service-requests/${pm2}/dispatch"
              payload: {}
              as: ServiceDispatcher
            - call: "POST /lab/service-requests/${pm2}/resolve"
              payload: { hours_on_site: 2, parts_cost_cents: 0 }
