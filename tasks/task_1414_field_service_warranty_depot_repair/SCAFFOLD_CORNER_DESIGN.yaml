            - { call: "POST /depot/ops/run_daily_close", as: DepotManager, payload: {} , captures: { closed1: $.data.closed_final_escalation_ids } }
            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-10-31T00:00:00Z" } }
            - { call: "POST /depot/ops/run_daily_close", as: DepotManager, payload: {} , captures: { closed2: $.data.closed_final_escalation_ids } }
          assert:
