# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers, or undeclared role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to invoke the endpoint per RBAC matrix."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path parameter references a non-existent resource (checked left-to-right)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition does not exist from the resource's current state (including terminal-state lockdown and double-fire idempotency failures)."
  - id: ERR_POSTURE_GATED
    http: 409
    condition: "WatchGroup.posture does not permit the operation (e.g., alert send while DEGRADED/FROZEN, member create while FROZEN)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Actor is the same person barred by a segregation-of-duties rule (reporter reviewing own incident; trainer certifying own trained group)."
  - id: ERR_QUIET_HOURS
    http: 422
    condition: "Alert scheduled_send_at (or immediate send) falls inside 22:00-07:00 quiet hours for a non-INCIDENT_BULLETIN alert."
  - id: ERR_ROOM_SLOT_CONFLICT
    http: 409
    condition: "LiaisonMeeting room slot [start, end) overlaps another SCHEDULED/HELD meeting slot in the same precinct; touching endpoints allowed."
  - id: ERR_CLOSURE_CONFLICT
    http: 409
    condition: "CommunityEvent buffered street-closure window touches or overlaps another APPROVED event's buffered window in the same group; zero-gap adjacency is rejected."
  - id: ERR_TRAINING_COOLDOWN
    http: 422
    condition: "TrainingSession.scheduled_at precedes WatchGroup.training_cooldown_until."
  - id: ERR_REFERENTIAL_INTEGRITY
    http: 422
    condition: "FK mismatch: member block not in the same group, alert target block foreign to the group, officer precinct mismatch, reporter not an ACTIVE member of the block's group."
  - id: ERR_CONSTRAINT_VIOLATION
    http: 409
    condition: "Uniqueness/cardinality breach: duplicate street_segment among non-DEREGISTERED blocks, second ACTIVE captain assignment for one member, duplicate badge_number, duplicate alert ack by the same member."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Field-level validity failure: missing required field, invalid enum, household_count < 1, severity outside [1,5], occurred_at in the future, room_slot_end <= room_slot_start."
  - id: ERR_INVENTORY_LIMIT
    http: 422
    condition: "Materials recall would drive an inventory below 0, or issue would exceed the per-group depot sign budget (50)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_<parent>_version does not equal the parent's current version."
  - id: ERR_DATA_SHARE_REQUIRED
    http: 409
    condition: "Operation requires an ACTIVE DataShareAgreement (incident corroboration; large-event approval at >=100 estimated attendance; liaison read of unshared incident)."
  - id: ERR_CERTIFICATION_REQUIRED
    http: 409
    condition: "Operation requires a stronger certification_status (NATIONAL_NIGHT_OUT approval requires CERTIFIED)."
  - id: ERR_NO_ACTIVE_CAPTAIN
    http: 409
    condition: "Block-scoped alert queue requires the target block to hold exactly one ACTIVE BlockCaptainAssignment."
  - id: ERR_REPORTER_ONLY
    http: 403
    condition: "Only the original reporter member may resubmit a NEEDS_INFO incident report."
  - id: ERR_DUPLICATE
    http: 409
    condition: "A PENDING CertificationReview already exists for the watch group; only one open review per group."

