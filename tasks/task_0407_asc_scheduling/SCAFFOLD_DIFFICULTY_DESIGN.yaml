              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480, anesthesiologist_id: "${anes_id}" }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/start"
              payload: {}
              as: ORManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DAY_NOT_LOCKED"
            - "SurgicalCase.${case_id}.case_status == SCHEDULED"

      - name: block_confirm_requires_surgeon_active
        grounds:
          - state_machines.SurgeonBlock.HELD_to_CONFIRMED
          - entities.Surgeon.fields.active
          - errors[ERR_SURGEON_INACTIVE]
        distinguishing_aspect: |
          Different entity pair SurgeonBlock -> Surgeon: confirming a HELD block whose owning Surgeon
          has active==false is rejected -> ERR_SURGEON_INACTIVE; block stays HELD.
        test_recipe:
          setup:
            - "Facility/OR/surgeon/day; HELD block [480,600); surgeon then deactivated via PATCH."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC N", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890", active: true }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id }
            - call: "PATCH /asc/surgeons/${surg_id}"
              payload: { active: false }
              as: Scheduler
          trigger:
            - call: "POST /asc/surgeon-blocks/${blk_id}/confirm"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_SURGEON_INACTIVE"
            - "SurgeonBlock.${blk_id}.status == HELD"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: or_overlap_with_turnover_buffer
        grounds:
          - validations[priority=12]
          - entities.Facility.fields.turnover_minutes
          - errors[ERR_OR_TIME_CONFLICT]
        distinguishing_aspect: |
          OR resource with turnover-buffer interval semantics: case1 [480,540) needs 25-min turnover,
          so case2 is only compatible at start_min >= 565. start_min=560 (< 565) collides ->
          ERR_OR_TIME_CONFLICT. The buffer is part of the geometry.
        test_recipe:
          setup:
            - "Facility(turnover 25)/OR/surgeon/2 patients/MAC-proc(60)/day; block [480,720); first case booked 480 occupying [480,540)+25 turnover."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC O", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat1_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN2", full_name: "Pat Two", date_of_birth: "1981-01-01" }
              as: Scheduler
              captures: { pat2_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 720 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat1_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case1_id: $.data.id, blk_v1: $.data.version }
          trigger:
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v1}", patient_id: "${pat2_id}", procedure_id: "${proc_id}", start_min: 560 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_OR_TIME_CONFLICT"

      - name: anesthesia_overlap_no_buffer_strict
        grounds:
          - validations[priority=13]
          - entities.Anesthesiologist.fields.full_name
          - errors[ERR_ANESTHESIA_TIME_CONFLICT]
        distinguishing_aspect: |
          DIFFERENT resource (Anesthesiologist) with NO-buffer interval semantics: same anesthesiologist
          across TWO different ORs; case A [480,540) and case B [510,570) strictly overlap ->
          ERR_ANESTHESIA_TIME_CONFLICT. Unlike OR, no turnover buffer participates; the geometry differs.
        test_recipe:
          setup:
            - "Facility(turnover 25)/two ORs/one MD anesthesiologist/2 patients/MAC-proc(60)/day; two blocks, one per OR; case A booked into block1 OR1 at 480 with the anesthesiologist."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC P", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or1_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-2" }
              as: ORManager
              captures: { or2_id: $.data.id }
            - call: "POST /asc/anesthesiologists"
              payload: { facility_id: "${fac_id}", full_name: "Dr Gas", credential: "MD" }
              as: ORManager
              captures: { anes_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat1_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN2", full_name: "Pat Two", date_of_birth: "1981-01-01" }
              as: Scheduler
              captures: { pat2_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or1_id}", start_min: 480, end_min: 720 }
              as: Scheduler
              captures: { blk1_id: $.data.id, blk1_v: $.data.version }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or2_id}", start_min: 480, end_min: 720 }
              as: Scheduler
              captures: { blk2_id: $.data.id, blk2_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk1_id}/cases"
              payload: { expected_block_version: "${blk1_v}", patient_id: "${pat1_id}", procedure_id: "${proc_id}", start_min: 480, anesthesiologist_id: "${anes_id}" }
              as: Scheduler
              captures: { caseA_id: $.data.id }
          trigger:
            - call: "POST /asc/surgeon-blocks/${blk2_id}/cases"
              payload: { expected_block_version: "${blk2_v}", patient_id: "${pat2_id}", procedure_id: "${proc_id}", start_min: 510, anesthesiologist_id: "${anes_id}" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ANESTHESIA_TIME_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: block_minutes_conservation_book_then_cancel
        grounds:
          - state_machines.SurgicalCase.SCHEDULED_to_CANCELLED
          - entities.SurgeonBlock.fields.committed_minutes
          - calculations.estimated_case_cost
        distinguishing_aspect: |
          Conserved quantity = SurgeonBlock.committed_minutes. Invariant pinned as
          committed_minutes == sum(scheduled_minutes of non-cancelled cases in block). Book a 60-min
          case (committed 60) then cancel it; committed_minutes returns to its pre-book value 0.
        test_recipe:
          setup:
            - "Facility/OR/surgeon/MAC-proc(60)/patient/day; block [480,600) with committed_minutes 0."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC Q", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/cancel"
              payload: {}
              as: Scheduler
          assert:
            - "SurgeonBlock.${blk_id}.committed_minutes == 0"

      - name: supply_reservation_conservation_attach_then_release
        grounds:
          - state_machines.CaseImplant.RESERVED_to_RELEASED
          - entities.SupplyItem.fields.reserved_qty
          - entities.SupplyItem.fields.on_hand_qty
          - calculations.supply_availability
        distinguishing_aspect: |
          DIFFERENT conserved quantity = SupplyItem.reserved_qty (units, not minutes). Invariant
          reserved_qty == sum(planned_qty of RESERVED implants for item). Attach planned_qty 4
          (reserved_qty 4) then release the implant; reserved_qty returns to 0 and on_hand_qty stays 7.
        test_recipe:
          setup:
            - "Facility/OR/surgeon/MAC-proc(60)/patient/day; block [480,600); device item on_hand 7 reserved 0; one SCHEDULED case 480; implant attached planned_qty 4 (reserved_qty 4)."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC R", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/supply-items"
              payload: { facility_id: "${fac_id}", sku: "DEV1", description: "Implant", unit_cost_cents: 5000, is_device: true, on_hand_qty: 7 }
              as: ORManager
              captures: { item_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/implants"
              payload: { supply_item_id: "${item_id}", planned_qty: 4 }
              as: ORManager
              captures: { imp_id: $.data.id }
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/implants/${imp_id}/release"
              payload: {}
              as: ORManager
          assert:
            - "CaseImplant.${imp_id}.status == RELEASED"
            - "SupplyItem.${item_id}.reserved_qty == 0"
            - "SupplyItem.${item_id}.on_hand_qty == 7"
