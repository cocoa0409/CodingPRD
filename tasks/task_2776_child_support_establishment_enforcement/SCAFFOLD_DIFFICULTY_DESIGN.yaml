              as: CaseWorker
              captures: { cbr_snapshot: $.data.arrears_certified_snapshot_cents, cbr_threshold: $.data.eligibility_threshold_cents, cbr_status: $.data.status }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "ARREARS_JUDGMENT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15", amount_cents: 145 }
              as: FinanceOfficer
            - call: "POST /child-support/cases/${case_id}/enforcement-actions"
