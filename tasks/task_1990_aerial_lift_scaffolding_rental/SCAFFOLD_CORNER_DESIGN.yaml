          trigger:
            - call: "GET /rental-contracts/${contract_id}"
              as: Customer
              as_user_id: "${custB}"
              captures: { err: $.data.error_id }
            - call: "GET /rental-contracts/${contract_id}"
              as: Customer
              as_user_id: "${custA}"
              captures: { ok_id: $.data.id }
          assert:
            - "Customer B: error_id == ERR_FORBIDDEN (403)"
            - "Customer A (owner): 200 with data.id == ${contract_id}"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[line-add-stale-contract]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on RentalContract.version: a line-add carrying expected_contract_version 2 after the contract has advanced to version 3 is rejected 412; the correct version succeeds."
        test_recipe:
          setup: ["customer; class S19OC; units U1, U2; DRAFT contract (version 1)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "OCC Co", contact_email: "ops@occ.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19OC", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19OC-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { u1: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19OC-002", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { u2: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "12 Version Ct", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
          trigger:
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${u1}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { l1: $.data.id }
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { cv2: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${u2}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 20, expected_contract_version: "${cv2}" }
              as: RentalCoordinator
              captures: { l2: $.data.id }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${u1}", requested_start_date: "2026-08-20", requested_end_date: "2026-08-25", required_working_height_ft: 20, expected_contract_version: "${cv2}" }
              as: RentalCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /rental-lines?contract_id=${contract_id}"
              as: RentalCoordinator
          assert:
            - "first add (expected ${cv} == version 1) succeeds; contract version advances to 2"
            - "second add (expected ${cv2} == version 2) succeeds; contract version advances to 3"
            - "third add replaying the stale expected ${cv2} (== 2, actual 3): error_id == ERR_STALE_VERSION, http 412"
            - "GET /rental-lines?contract_id=... total_count == 2 (rejected add created nothing)"

      - name: invoice_reflects_off_rent_segment
        claim_type: derived_field_reconciliation
        grounds: [calculations.contract_invoice_total, entities.RentalContract.fields.rental_subtotal_cents]
        distinguishing_aspect: "The invoice's rental subtotal is re-derived on every mutation: while OUT_ON_RENT it shows the forward-looking provisional 43500; after off-rent finalizes a 1-day segment it reconciles down to the actual 14500."
        test_recipe:
          setup: ["contract ACTIVE; class S19DR (daily 14500, weekly 43500, monthly 99000, min 1); line window 2026-08-10..2026-08-12 delivered 2026-08-10T09:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Reconcile Co", contact_email: "ops@rec.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19DR", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19DR-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "6 Ledger Way", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-12", required_working_height_ft: 20, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { line_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${line_id}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { trip_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${trip_id}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${trip_id}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
          trigger:
            - call: "GET /rental-contracts/${contract_id}/invoice"
              as: RentalCoordinator
              captures: { rent_before: $.data.rental_subtotal_cents, tot_before: $.data.invoice_total_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${line_id}/off-rent"
              as: RentalCoordinator
            - call: "GET /rental-contracts/${contract_id}/invoice"
              as: RentalCoordinator
              captures: { rent_after: $.data.rental_subtotal_cents, tot_after: $.data.invoice_total_cents }
          assert:
            - "while OUT_ON_RENT: rental_subtotal_cents == 43500 (provisional, projected end 2026-08-13T00:00:00Z -> 3 days -> min(43500, 43500, 99000)); invoice_total_cents == 58500 (43500 + trip fee 15000)"
            - "after off-rent at exactly 1 elapsed day: rental_subtotal_cents reconciles to 14500 (final segment); invoice_total_cents == 29500 (14500 + 15000)"
            - "derived subtotal tracks the source mutation within the same request sequence (immediate consistency)"

      - name: transitive_cascade_coverage
        claim_type: cascading_side_effects
        grounds: [state_machines.DamageClaim.ASSESSED_to_CHARGED, state_machines.InspectionRecord.SUBMITTED_to_CERTIFIED]
        excluded_because:
          difficulty_instance: claim_charge_suspends_customer
          rationale: "N-level cascade chains are asserted end-to-end by §1.8 instances claim_charge_suspends_customer (depth 3) and fail_inspection_quarantines_unit_cancels_line (depth 2)."

