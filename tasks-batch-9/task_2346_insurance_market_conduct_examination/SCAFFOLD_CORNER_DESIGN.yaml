# =============================================================================
# SCAFFOLD CORNER DESIGN - task 2346 Insurance Market Conduct Examination
# Section 1.9 breadth probe. Nine sections, taxonomy from
# references/claim-extraction-guide.md. Every claim the SCAFFOLD.yaml surface
# declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already cover is
# either given a real test_recipe here or stubbed with excluded_because.
#
# Standing actor identities (X-User-ID values):
#   SupervisingExaminer  A  11111111-1111-1111-1111-111111111111
#   SupervisingExaminer  B  22222222-2222-2222-2222-222222222222
#   ExaminerInCharge     A  33333333-3333-3333-3333-333333333333
#   MarketAnalyst        A  44444444-4444-4444-4444-444444444444
#   MultistateCoordinator   55555555-5555-5555-5555-555555555555
#   ExaminerInCharge     B  66666666-6666-6666-6666-666666666666
#   InsurerRespondent    -> always the examined Insurer.id
#   Non-existent id used for 404 probes: aaaaaaaa-0000-0000-0000-000000000001
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - entities
  # ===========================================================================
  - section: entities
    instances:

      - name: insurer_creation_returns_every_declared_field_with_computed_ratio_and_tier
        claim_type: creation
        grounds:
          - entities.Insurer
          - calculations.complaint_ratio_per_1k
          - endpoints[POST /market-conduct/insurers]
        distinguishing_aspect: |
          A carrier created with 120 confirmed complaints against 40000 policies in force comes back
          201 with complaint_ratio_per_1k 3.00 and risk_tier ELEVATED computed in the creation
          response itself, and with all four derived counters at 0 - nothing about the carrier is
          left for a later read to fill in.
        test_recipe:
          setup:
            - "Empty database. Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", ratio: "$.data.complaint_ratio_per_1k", tier: "$.data.risk_tier" }
          assert:
            - "HTTP 201"
            - "Insurer.${aurora_id}.name == 'Aurora Mutual Insurance Company' and naic_code == '10001'"
            - "Insurer.${aurora_id}.complaint_ratio_per_1k == 3.00 (120 * 1000 / 40000, round_half_up to 2 decimals)"
            - "Insurer.${aurora_id}.risk_tier == ELEVATED (3.00 >= 2.50 and < 5.00)"
            - "Insurer.${aurora_id}.open_exam_count == 0, pending_enforcement_exam_count == 0, lifetime_restitution_ordered_cents == 0"
            - "Insurer.${aurora_id}.license_status == LICENSED and version == 1"

      - name: insurer_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Insurer
          - endpoints[GET /market-conduct/insurers/{id}]
        distinguishing_aspect: |
          GET /insurers/{id} returns byte-identical input fields and the same computed ratio 3.00 /
          tier ELEVATED that the creation response carried, proving the ratio is persisted rather
          than recomputed differently on read.
        test_recipe:
          setup:
            - "One carrier AURORA created with 120 complaints against 40000 policies."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
          trigger:
            - call: "GET /market-conduct/insurers/${aurora_id}"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { got_ratio: "$.data.complaint_ratio_per_1k", got_tier: "$.data.risk_tier", got_version: "$.data.version" }
          assert:
            - "HTTP 200"
            - "Insurer.${aurora_id}.complaint_ratio_per_1k == 3.00 and risk_tier == ELEVATED"
            - "Insurer.${aurora_id}.annual_premium_written_cents == 1200000000 and policy_count_in_force == 40000"
            - "Insurer.${aurora_id}.version == 1 (a pure read does not bump the version)"

      - name: insurer_listing_returns_the_pagination_envelope_and_honours_filters
        claim_type: listing
        grounds:
          - entities.Insurer
          - endpoints[GET /market-conduct/insurers]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three carriers on file the unfiltered list reports total_count 3 / has_more false /
          limit 10 / offset 0 from the declared pagination defaults, limit 2 flips has_more to true,
          and the risk_tier filter narrows the same collection to exactly the HIGH carrier - filter
          and pagination are applied to the same query, not to two different ones.
        test_recipe:
          setup:
            - "Three carriers: AURORA (120/40000 -> 3.00 ELEVATED, LICENSED), BOREAL (500/100000 -> 5.00 HIGH, LICENSED), CEDAR (99/100000 -> 0.99 LOW, SUSPENDED)."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Boreal Casualty Company", naic_code: "10002", annual_premium_written_cents: 6000000000, policy_count_in_force: 100000, confirmed_complaints_12mo: 500, financial_stress_score: 80, consumer_trend_score: 70 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { boreal_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Cedar Indemnity Company", naic_code: "10003", annual_premium_written_cents: 300000000, policy_count_in_force: 100000, confirmed_complaints_12mo: 99, financial_stress_score: 20, consumer_trend_score: 10, license_status: "SUSPENDED" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { cedar_id: "$.data.id" }
          trigger:
            - call: "GET /market-conduct/insurers"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 2, offset: 0 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 2, offset: 2 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /market-conduct/insurers"
              payload: { risk_tier: "HIGH" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { high_first: "$.data[0].id", high_first_tier: "$.data[0].risk_tier" }
            - call: "GET /market-conduct/insurers"
              payload: { license_status: "SUSPENDED" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { susp_first: "$.data[0].id" }
          assert:
            - "The unfiltered list returns HTTP 200 with limit 10, offset 0, total_count 3 and has_more false"
            - "limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true"
            - "limit 2 / offset 2 returns 1 row with total_count 3 and has_more false"
            - "risk_tier HIGH returns exactly 1 row, ${boreal_id}, with total_count 1"
            - "license_status SUSPENDED returns exactly 1 row, ${cedar_id}, with total_count 1"
            - "total_count always reports the filtered population, never the unfiltered 3, on the two filtered reads"

      - name: pagination_limit_bounds_are_enforced_on_list_endpoints

        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - endpoints[GET /market-conduct/insurers]
          - validations[priority 30 ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          limit is declared 1..100, so limit 0 and limit 101 are both rejected with 422
          ERR_INVALID_REQUEST while limit 1 and limit 100 both succeed - the bounds are inclusive on
          both ends rather than exclusive.
        test_recipe:
          setup:
            - "One carrier on file so the collection is non-empty."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
          trigger:
            - call: "GET /market-conduct/insurers"
              payload: { limit: 0 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "GET /market-conduct/insurers"
              payload: { limit: 101 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "GET /market-conduct/insurers"
              payload: { limit: 1 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { one_first: "$.data[0].id" }
            - call: "GET /market-conduct/insurers"
              payload: { limit: 100, offset: 0 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { hundred_first: "$.data[0].id" }
          assert:
            - "limit 0 returns 422 ERR_INVALID_REQUEST"
            - "limit 101 returns 422 ERR_INVALID_REQUEST"
            - "limit 1 returns HTTP 200 with 1 row, total_count 1, has_more false"
            - "limit 100 returns HTTP 200 with 1 row, total_count 1, has_more false"

      - name: insurer_required_fields_are_each_individually_mandatory
        claim_type: required_fields
        grounds:
          - entities.Insurer
          - validations[priority 30 ERR_INVALID_REQUEST]
          - endpoints[POST /market-conduct/insurers]
        distinguishing_aspect: |
          Seven of the eight declared inputs carry no default, so omitting naic_code and omitting
          policy_count_in_force are each independently fatal with 422 ERR_INVALID_REQUEST, and no
          Insurer row is written in either case - the collection is still empty afterwards.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { err_no_naic: "$.data.error_id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { err_no_policy_count: "$.data.error_id" }
            - call: "GET /market-conduct/insurers"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
          assert:
            - "Omitting naic_code returns 422 ERR_INVALID_REQUEST"
            - "Omitting policy_count_in_force returns 422 ERR_INVALID_REQUEST"
            - "GET /market-conduct/insurers reports total_count == 0 - neither rejected request persisted a partial row"

      - name: insurer_license_status_defaults_to_licensed_when_omitted
        claim_type: defaults
        grounds:
          - entities.Insurer.fields.license_status
          - endpoints[POST /market-conduct/insurers]
        distinguishing_aspect: |
          license_status is the only Insurer input carrying a default, and omitting it yields exactly
          LICENSED - not null and not an error - which is what makes the carrier immediately eligible
          for both scoring and target selection.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", status: "$.data.license_status" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Boreal Casualty Company", naic_code: "10002", annual_premium_written_cents: 6000000000, policy_count_in_force: 100000, confirmed_complaints_12mo: 500, financial_stress_score: 80, consumer_trend_score: 70, license_status: "WITHDRAWN" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { boreal_id: "$.data.id", boreal_status: "$.data.license_status" }
          assert:
            - "Insurer.${aurora_id}.license_status == LICENSED (default applied)"
            - "Insurer.${boreal_id}.license_status == WITHDRAWN (explicit value wins over the default)"

      - name: insurer_computed_fields_are_rederived_on_every_market_data_patch
        claim_type: computed_fields
        grounds:
          - entities.Insurer.fields.complaint_ratio_per_1k
          - entities.Insurer.fields.risk_tier
          - calculations.complaint_ratio_per_1k
          - endpoints[PATCH /market-conduct/insurers/{id}/market-data]
        distinguishing_aspect: |
          complaint_ratio_per_1k and risk_tier are never client-writable: the PATCH endpoint accepts
          only the six raw indicators, and patching policy_count_in_force alone from 40000 to 20000
          moves the ratio 3.00 -> 6.00 and the tier ELEVATED -> HIGH without the client naming either
          derived field.
        test_recipe:
          setup:
            - "One carrier AURORA with 120 complaints against 40000 policies -> ratio 3.00, tier ELEVATED."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", ratio0: "$.data.complaint_ratio_per_1k", v0: "$.data.version" }
          trigger:
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { policy_count_in_force: 20000 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { ratio1: "$.data.complaint_ratio_per_1k", tier1: "$.data.risk_tier", v1: "$.data.version" }
          assert:
            - "Before: complaint_ratio_per_1k == 3.00, risk_tier == ELEVATED, version == 1"
            - "After: Insurer.${aurora_id}.complaint_ratio_per_1k == 6.00 (120 * 1000 / 20000) and risk_tier == HIGH"
            - "Insurer.${aurora_id}.confirmed_complaints_12mo is still 120 - the patch only touched the denominator"
            - "Insurer.${aurora_id}.version == 2"

      - name: insurer_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Insurer
          - endpoints[POST /market-conduct/insurers]
        distinguishing_aspect: |
          id, created_at, updated_at and version are absent from the endpoint's declared input, so the
          creation response is the only place they can come from: id is a fresh UUID, version starts
          at exactly 1, and created_at equals the logical clock rather than wall-clock time.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", created: "$.data.created_at", updated: "$.data.updated_at", ver: "$.data.version" }
          assert:
            - "Insurer.${aurora_id}.id is a well-formed UUID that the request never supplied"
            - "Insurer.${aurora_id}.version == 1"
            - "Insurer.${aurora_id}.created_at == 2026-08-01T00:00:00Z (the logical clock, not wall-clock time)"
            - "Insurer.${aurora_id}.updated_at == Insurer.${aurora_id}.created_at on a freshly created row"

      - name: insurer_enum_and_numeric_range_constraints_are_enforced
        claim_type: type_constraints
        grounds:
          - entities.Insurer.fields.license_status
          - entities.Insurer.fields.financial_stress_score
          - validations[priority 30 ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Three different shape violations on the same endpoint all resolve to 422
          ERR_INVALID_REQUEST: a license_status outside {LICENSED, SUSPENDED, WITHDRAWN}, a
          financial_stress_score of 101 above its 0..100 band, and a negative
          confirmed_complaints_12mo - and none of the three writes a row.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50, license_status: "REVOKED" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 101, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: -1, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "GET /market-conduct/insurers"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
          assert:
            - "license_status REVOKED returns 422 ERR_INVALID_REQUEST"
            - "financial_stress_score 101 returns 422 ERR_INVALID_REQUEST (declared band is 0..100)"
            - "confirmed_complaints_12mo -1 returns 422 ERR_INVALID_REQUEST"
            - "GET /market-conduct/insurers reports total_count == 0"

      - name: analysis_cycle_creation_applies_its_default_mode_and_slot_ledger
        claim_type: defaults
        grounds:
          - entities.MarketAnalysisCycle
          - entities.MarketAnalysisCycle.fields.default_exam_mode
          - entities.MarketAnalysisCycle.fields.slots_available
          - endpoints[POST /market-conduct/analysis-cycles]
        distinguishing_aspect: |
          A cycle created without default_exam_mode comes back ON_SITE, status DRAFT, both count
          fields 0, slots_committed 0 and slots_available equal to the requested capacity 3 - so the
          conserved-quantity pair (committed + available == capacity) already holds before any
          examination exists.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/analysis-cycles"
              payload: { cycle_label: "2026-H2-MARKET-ANALYSIS", reference_period_start: "2025-07-01", reference_period_end: "2026-06-30", target_slot_capacity: 3, default_fieldwork_start: "2026-09-01", default_fieldwork_end: "2026-11-30" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { cycle_id: "$.data.id", mode: "$.data.default_exam_mode", status: "$.data.status", avail: "$.data.slots_available" }
          assert:
            - "HTTP 201"
            - "MarketAnalysisCycle.${cycle_id}.default_exam_mode == ON_SITE (default applied)"
            - "MarketAnalysisCycle.${cycle_id}.status == DRAFT"
            - "MarketAnalysisCycle.${cycle_id}.scored_insurer_count == 0 and selected_target_count == 0"
            - "MarketAnalysisCycle.${cycle_id}.slots_committed == 0 and slots_available == 3"
            - "MarketAnalysisCycle.${cycle_id}.scored_at is null and closed_at is null"

      - name: analysis_cycle_period_and_window_ordering_are_enforced
        claim_type: type_constraints
        grounds:
          - entities.MarketAnalysisCycle.fields.reference_period_end
          - entities.MarketAnalysisCycle.fields.default_fieldwork_end
          - validations[priority 30 ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Both declared orderings are strict: reference_period_end equal to reference_period_start and
          default_fieldwork_end equal to default_fieldwork_start are each rejected with 422
          ERR_INVALID_REQUEST, so a zero-length period is not merely degenerate but illegal.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /market-conduct/analysis-cycles"
              payload: { cycle_label: "BAD-PERIOD", reference_period_start: "2026-06-30", reference_period_end: "2026-06-30", target_slot_capacity: 2, default_fieldwork_start: "2026-09-01", default_fieldwork_end: "2026-11-30" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "POST /market-conduct/analysis-cycles"
              payload: { cycle_label: "BAD-WINDOW", reference_period_start: "2025-07-01", reference_period_end: "2026-06-30", target_slot_capacity: 2, default_fieldwork_start: "2026-09-01", default_fieldwork_end: "2026-09-01" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "POST /market-conduct/analysis-cycles"
              payload: { cycle_label: "ZERO-CAPACITY", reference_period_start: "2025-07-01", reference_period_end: "2026-06-30", target_slot_capacity: 0, default_fieldwork_start: "2026-09-01", default_fieldwork_end: "2026-11-30" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
            - call: "GET /market-conduct/analysis-cycles"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
          assert:
            - "reference_period_end == reference_period_start returns 422 ERR_INVALID_REQUEST"
            - "default_fieldwork_end == default_fieldwork_start returns 422 ERR_INVALID_REQUEST"
            - "target_slot_capacity 0 returns 422 ERR_INVALID_REQUEST (declared >= 1)"
            - "GET /market-conduct/analysis-cycles reports total_count == 0"

      - name: analysis_score_rows_are_child_reads_of_both_their_cycle_and_their_insurer
        claim_type: parent_relationships
        grounds:
          - entities.AnalysisScore
          - entities.AnalysisScore.fields.cycle_id
          - entities.AnalysisScore.fields.insurer_id
