      - { name: court_id, type: string, source: system, description: "FK -> Court.id; court the lesson occupies" }
      - { name: kind, type: enum, source: input, description: "Private lesson or group clinic", constraints: "PRIVATE | CLINIC" }
      - { name: start_time, type: datetime, source: input, description: "ISO 8601 UTC start of the lesson interval" }
      - { name: end_time, type: datetime, source: input, description: "ISO 8601 UTC end of the lesson interval (half-open)" }
      - { name: capacity, type: integer, source: input, description: "Max ENROLLED members (PRIVATE fixed at 1)", default: 1, constraints: ">= 1" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of Enrollment rows for this lesson in status ENROLLED" }
      - { name: price_cents, type: integer, source: input, description: "Charge per enrolled member, posted at lesson completion", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: SCHEDULED, constraints: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
