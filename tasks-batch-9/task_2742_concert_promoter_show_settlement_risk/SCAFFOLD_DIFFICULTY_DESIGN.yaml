              captures: { r_s5_second_error: $.data.error_id }
            - call: "POST /cancellation-events"
              payload: { show_id: "${r_s1_id}", kind: "CANCELLED", reason: "Anchor date dropped from the routing" }
              as: RiskOfficer
              captures: { r_ce_cancel1_id: $.data.id }
            - call: "POST /cancellation-events"
              payload: { show_id: "${r_s4_id}", kind: "CANCELLED", reason: "Adjacent date dropped from the routing" }
              as: RiskOfficer
              captures: { r_ce_cancel4_id: $.data.id }
            - call: "POST /offers/${r_o3_id}/accept"
