  - rule_id: non_linear_state_machine
    instances:
      - name: harvest_lot_grade_regrade_cycle
        grounds:
          - state_machines.HarvestLot.CERTIFIED_to_DISPUTED
          - state_machines.HarvestLot.DISPUTED_to_SUBMITTED
          - state_machines.HarvestLot.SUBMITTED_to_CERTIFIED
          - entities.HarvestLot.fields.grade_version
        distinguishing_aspect: |
          HarvestLot's grade dimension is cyclic (SUBMITTED -> CERTIFIED -> DISPUTED -> SUBMITTED):
          after a dispute, a regrade submission returns the lot to SUBMITTED with grade_version
          bumped 1 -> 2, the new scores recomputing grade from PREMIUM to STANDARD, and
          certified_by_user_id reset to null until a fresh certification.
        test_recipe:
          setup:
            - "Canonical G1 chain through H1 certified PREMIUM (grade_version 1, submitted by qg-1, certified by qg-2, received by co-1)."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - *k_g1
            - *k_a1
            - *k_a1_dec
            - *k_l1
            - *k_w1
            - *k_p1
            - *k_clock_aug
            - *k_p1_conf
            - *k_clock_h1a
            - *k_h1
            - *k_clock_h1b
            - *k_h1_recv
            - *k_h1_grade
            - *k_h1_cert
          trigger:
            - call: "POST /licensing/harvest-lots/${h1_id}/dispute-grade"
              payload: { reason: "firmness gauge miscalibrated" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
            - call: "POST /licensing/harvest-lots/${h1_id}/certify-grade"
              payload: {}
              as: QualityGrader
              as_user_id: "qg-2"
              captures: { error_id: $.data.error_id }
            - call: "POST /licensing/harvest-lots/${h1_id}/grade"
              payload: { flavor_brix: 10.0, firmness_g: 320, appearance_score: 75, defect_pct: 4.0 }
              as: QualityGrader
              as_user_id: "qg-1"
            - call: "POST /licensing/harvest-lots/${h1_id}/certify-grade"
              payload: {}
              as: QualityGrader
              as_user_id: "qg-2"
          assert:
            - "after dispute: grade_status == DISPUTED, lot_status stays GRADED, grade_dispute_reason recorded"
            - "certify from DISPUTED is rejected: 409 ERR_INVALID_STATE (no DISPUTED -> CERTIFIED edge — the loop must pass through a fresh submission)"
            - "regrade: grade_status == SUBMITTED, grade_version == 2, grade == STANDARD (brix 10.0 drops out of PREMIUM), pack_designation == STANDARD, certified_by_user_id is null again"
            - "second certification succeeds (qg-2 != qg-1 submitter, != co-1 receiver): grade_status == CERTIFIED, lot_status == GRADED"

      - name: statement_dispute_resolve_cycle
        grounds:
          - state_machines.SettlementStatement.ISSUED_to_DISPUTED
          - state_machines.SettlementStatement.DISPUTED_to_ISSUED
          - state_machines.SettlementStatement.DISPUTED_to_FINAL
          - state_machines.SettlementStatement.FINAL_to_PAID
        distinguishing_aspect: |
          SettlementStatement is cyclic (ISSUED -> DISPUTED -> ISSUED on resolve ADJUST): the
          adjustment -500 recomputes net_cents 964093 -> 963593 and REFRESHES issued_at and
          dispute_deadline, which re-opens the dispute window and allows a second dispute —
          the loop is only exited by resolve UPHOLD (-> FINAL) and then pay (-> PAID).
        test_recipe:
          setup:
            - "Full canonical pool scenario through settle; G1 statement ISSUED with net_cents 964093, issued_at 2026-10-12T00:00:00Z, dispute_deadline 2026-10-26T00:00:00Z. Logical clock 2026-10-12T00:00:00Z."
            - "G2 statement ISSUED with net_cents 936693 and left untouched."
          setup_api_calls:
            - *k_clock0
            - *k_v1
            - *k_v1_rel
            - *k_g1
            - *k_a1
            - *k_a1_dec
            - *k_l1
            - *k_w1
            - *k_p1
            - *k_clock_aug
            - *k_p1_conf
            - *k_clock_h1a
            - *k_h1
            - *k_clock_h1b
            - *k_h1_recv
            - *k_h1_grade
            - *k_h1_cert
            - *k_p1_get3
            - *k_clock_h2a
            - *k_h2
            - *k_clock_h2b
            - *k_h2_recv
            - *k_h2_grade
            - *k_h2_cert
            - *k_g2
            - *k_a2
            - *k_a2_dec
            - *k_l2
            - *k_p2
            - *k_p2_conf
            - *k_clock_h3a
            - *k_h3
            - *k_clock_h3b
            - *k_h3_recv
            - *k_h3_grade
            - *k_h3_cert
            - *k_pool
            - *k_clock_close
            - *k_close
            - *k_settle
            - *k_stmt_g1_post
          trigger:
            - call: "POST /licensing/settlement-statements/${s_g1}/dispute"
              payload: { reason: "cold-chain deduction misapplied" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
            - call: "POST /licensing/settlement-statements/${s_g1}/resolve"
              payload: { resolution: "ADJUST", adjustment_cents: -500 }
              as: SettlementOfficer
            - call: "POST /licensing/settlement-statements/${s_g1}/dispute"
              payload: { reason: "second review of adjusted figures" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
            - call: "POST /licensing/settlement-statements/${s_g1}/resolve"
              payload: { resolution: "UPHOLD" }
              as: SettlementOfficer
            - call: "POST /licensing/settlement-statements/${s_g1}/pay"
              payload: {}
              as: SettlementOfficer
            - call: "GET /licensing/pool-periods/${pool_id}"
              payload: {}
              as: SettlementOfficer
          assert:
            - "first dispute: status DISPUTED, dispute_count == 1"
            - "resolve ADJUST: status back to ISSUED, net_cents == 963593 (== 964093 - 500), adjustment_total_cents == -500, issued_at refreshed so dispute_deadline recomputes"
            - "second dispute succeeds BECAUSE the window re-opened: status DISPUTED, dispute_count == 2"
            - "resolve UPHOLD: status FINAL, net_cents unchanged at 963593"
            - "pay from FINAL succeeds: status PAID, paid_at set"
            - "PoolPeriod.${pool_id}.status stays SETTLED — the compound SETTLED -> PAID gate holds because G2's statement is still ISSUED"

  - rule_id: transitive_cascade
    instances:
      - name: recall_enforce_depth_cascade
        grounds:
          - state_machines.RecallOrder.ISSUED_to_COMPLETE
          - state_machines.Planting.PLANNED_to_RECALLED
          - state_machines.Planting.PLANTED_to_RECALLED
          - state_machines.PlantLot.PLANTED_to_RECALLED
          - calculations.recall_compensation
        distinguishing_aspect: |
          The recall-enforce trigger chains depth 4: enforce RECALLS plantings (link 1); each
          recall recomputes its PlantLot's plant accounting and terminal status (link 2); the lot
          mutation unbooks the HarvestWindow (link 3) and debits GrowerAgreement.units_planted
          (link 3'), and the order's own totals are derived last (link 4). Every link is caused by
          the previous link, not fan-out from the enforce call.
        test_recipe:
          setup:
            - "Variety V3 (BLACKBERRY) RELEASED; grower G5 with ACTIVE agreement A5 (WA-SKAGIT, max 10000)."
            - "Window W9 [2026-10-26, 2026-11-02) target 5000 covers the blackberry 90-day first harvest (2026-10-30)."
            - "Lot L9: 1000 plants. Planting PA: planned 600, confirmed 600 on 2026-08-01 (yield 1200 booked). Planting PB: planned 200, never confirmed."
            - "V3 recalled with default compensation 22c/plant; RecallOrder ISSUED."
          setup_api_calls:
            - *k_clock0
            - &k_v3
              call: "POST /licensing/varieties"
              payload: { variety_code: "BRB-BLK-01", berry_type: "BLACKBERRY", name: "Midnight Canyon" }
              as: BreedingManager
              captures: { v3_id: $.data.id }
            - call: "POST /licensing/varieties/${v3_id}/release"
              payload: {}
              as: BreedingManager
            - &k_g5
