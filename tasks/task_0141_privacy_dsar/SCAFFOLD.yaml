# =============================================================================
# Privacy DSAR (GDPR/CCPA) benchmark seed tables
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  Privacy DSAR (GDPR/CCPA): request intake/identity verification, cross-system
  data discovery, access/deletion/opt-out fulfillment, 30/45-day deadline,
  exemption/legal-hold conflict, processor notification, consent registry

domain_name: privacy-dsar
api_prefix: ""
# Flat/peer topology: each entity is a top-level collection (/controllers, /data-subjects,
# /dsar-requests, ...). api_prefix is intentionally empty so the FK reverse-reachability
# linter derives each entity's collection segment from its root-level single-resource GET.

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # Tenant (Controller) -> DsarRequest -> {DiscoveryFinding, FulfillmentItem}
  # plus cross-cutting registries: Processor, ConsentRecord, LegalHold, DataSubject,
  # ProcessorNotification, ExemptionClaim, AuditEvent (event log).

  state_machine_shape: branching
  # DsarRequest forks by request_type (ACCESS / DELETION / OPT_OUT) into divergent
  # fulfillment side-effect sets; identity verification has a revision loop
  # (PENDING_VERIFICATION -> VERIFICATION_REJECTED -> PENDING_VERIFICATION); the
  # deadline clock advances on EXTENDED transitions.

  relationship_patterns:
    - one_to_many        # DsarRequest -> DiscoveryFinding / FulfillmentItem
    - flat_with_references # FulfillmentItem -> Processor; ConsentRecord -> DataSubject
    - cross_aggregate    # FulfillmentItem references Processor + LegalHold across aggregates

  role_model: segregation_of_duties
  # The IntakeAgent who verifies identity cannot also approve a deletion fulfillment;
  # the PrivacyOfficer who approves cannot self-verify the same request's identity.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration / registry entities ---
  - name: Controller
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the data controller (tenant)" }
      - { name: jurisdiction, type: enum, source: input, description: "Governing privacy regime: GDPR | CCPA. Determines base deadline and extension rules", constraints: "GDPR | CCPA" }
      - { name: dpo_email, type: string, source: input, description: "Data Protection Officer contact email" }
      - { name: open_request_count, type: integer, source: computed, description: "Number of DsarRequest rows owned by this Controller whose status NOT IN {CLOSED_FULFILLED, CLOSED_REJECTED, CLOSED_EXPIRED}" }

  - name: DataSubject
    parent: null
    common_fields: true
    fields:
      - { name: controller_id, type: string, source: input, description: "FK -> Controller.id; controller this subject's records belong to" }
      - { name: email, type: string, source: input, description: "Primary email used to match the subject across systems" }
      - { name: full_name, type: string, source: input, description: "Subject's declared full name" }
      - { name: jurisdiction_residency, type: enum, source: input, description: "Residency that grants the privacy right: EU | CALIFORNIA | OTHER", constraints: "EU | CALIFORNIA | OTHER" }
      - { name: known_record_count, type: integer, source: input, description: "Operator-declared count of records that exist for this subject across systems; used to size discovery", default: 0 }

  - name: Processor
    parent: null
    common_fields: true
    fields:
      - { name: controller_id, type: string, source: input, description: "FK -> Controller.id; controller that engaged this processor" }
      - { name: name, type: string, source: input, description: "Processor (sub-vendor) name" }
      - { name: notify_email, type: string, source: input, description: "Endpoint email for downstream processor notifications" }
      - { name: sla_ack_hours, type: integer, source: input, description: "Hours the processor is contractually allowed to acknowledge a notification", default: 72, constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED processors cannot receive new notifications", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED" }

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: data_subject_id, type: string, source: input, description: "FK -> DataSubject.id; subject whose consent this records" }
      - { name: purpose, type: enum, source: input, description: "Processing purpose: MARKETING | ANALYTICS | SALE_OF_DATA | ESSENTIAL", constraints: "MARKETING | ANALYTICS | SALE_OF_DATA | ESSENTIAL" }
      - { name: state, type: enum, source: system, description: "GRANTED | WITHDRAWN — see ConsentRecord state machine", default: "GRANTED", constraints: "GRANTED | WITHDRAWN" }
      - { name: withdrawn_at, type: datetime, source: system, description: "created_at-format UTC timestamp set when state flips to WITHDRAWN; null while GRANTED" }

  - name: LegalHold
    parent: null
    common_fields: true
    fields:
      - { name: controller_id, type: string, source: input, description: "FK -> Controller.id; controller that placed the hold" }
      - { name: data_subject_id, type: string, source: input, description: "FK -> DataSubject.id; subject whose data is frozen by this hold" }
      - { name: matter_reference, type: string, source: input, description: "Litigation/regulatory matter reference that justifies the hold" }
      - { name: data_categories, type: array, source: input, description: "Categories frozen: subset of {IDENTITY, FINANCIAL, BEHAVIORAL, CONTACT, HEALTH}", constraints: "non-empty subset of IDENTITY|FINANCIAL|BEHAVIORAL|CONTACT|HEALTH" }
      - { name: state, type: enum, source: system, description: "ACTIVE | LIFTED — only ACTIVE holds block deletion", default: "ACTIVE", constraints: "ACTIVE | LIFTED" }

  # --- Core request aggregate ---
  - name: DsarRequest
    parent: Controller
    common_fields: true
    fields:
      - { name: controller_id, type: string, source: input, description: "FK -> Controller.id; controller that must fulfill this request" }
      - { name: data_subject_id, type: string, source: input, description: "FK -> DataSubject.id; subject who filed the request" }
      - { name: request_type, type: enum, source: input, description: "ACCESS | DELETION | OPT_OUT — fixed at intake; drives the fulfillment branch", constraints: "ACCESS | DELETION | OPT_OUT" }
      - { name: received_at, type: datetime, source: input, description: "Operator-supplied ISO 8601 UTC instant the request was received; anchors the deadline clock" }
      - { name: status, type: enum, source: system, description: "Lifecycle: PENDING_VERIFICATION | VERIFICATION_REJECTED | DISCOVERY | UNDER_REVIEW | FULFILLING | CLOSED_FULFILLED | CLOSED_REJECTED | CLOSED_EXPIRED", default: "PENDING_VERIFICATION", constraints: "PENDING_VERIFICATION | VERIFICATION_REJECTED | DISCOVERY | UNDER_REVIEW | FULFILLING | CLOSED_FULFILLED | CLOSED_REJECTED | CLOSED_EXPIRED" }
      - { name: identity_attempts, type: integer, source: computed, description: "Count of identity-verification attempts (verify + reject) recorded against this request", default: 0 }
      - { name: extension_count, type: integer, source: computed, description: "Number of deadline extensions granted (0 or 1; a second extension is rejected)", default: 0 }
      - { name: deadline_at, type: datetime, source: computed, description: "Computed statutory deadline; see calculations.statutory_deadline. Recomputed on EXTENDED transitions" }
      - { name: business_days_remaining, type: integer, source: computed, description: "Computed business days between server clock and deadline_at; see calculations.business_days_remaining" }
      - { name: discovery_finding_count, type: integer, source: computed, description: "Count of DiscoveryFinding rows attached to this request" }
      - { name: fulfillment_progress_pct, type: number, source: computed, description: "Derived completion percentage over FulfillmentItem rows; see calculations.fulfillment_progress" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the IntakeAgent who last drove PENDING_VERIFICATION -> DISCOVERY; pinned for segregation-of-duties checks; null until verified" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation including cascades" }

  - name: DiscoveryFinding
    parent: DsarRequest
    common_fields: true
    fields:
      - { name: dsar_request_id, type: string, source: input, description: "FK -> DsarRequest.id; request this finding was discovered for" }
      - { name: processor_id, type: string, source: input, description: "FK -> Processor.id; processor/system in which the data was located" }
      - { name: data_category, type: enum, source: input, description: "IDENTITY | FINANCIAL | BEHAVIORAL | CONTACT | HEALTH", constraints: "IDENTITY | FINANCIAL | BEHAVIORAL | CONTACT | HEALTH" }
      - { name: record_count, type: integer, source: input, description: "Number of records located in this system for this category", constraints: ">= 1" }
      - { name: confidence, type: enum, source: input, description: "Match confidence: EXACT | PROBABLE — PROBABLE findings need confirmation before fulfillment", constraints: "EXACT | PROBABLE" }
      - { name: state, type: enum, source: system, description: "PENDING | CONFIRMED | DISMISSED — see DiscoveryFinding state machine", default: "PENDING", constraints: "PENDING | CONFIRMED | DISMISSED" }

  - name: ExemptionClaim
    parent: DsarRequest
    common_fields: true
    fields:
      - { name: dsar_request_id, type: string, source: input, description: "FK -> DsarRequest.id; request this exemption is asserted against" }
      - { name: data_category, type: enum, source: input, description: "Category the exemption shields: IDENTITY | FINANCIAL | BEHAVIORAL | CONTACT | HEALTH", constraints: "IDENTITY | FINANCIAL | BEHAVIORAL | CONTACT | HEALTH" }
      - { name: basis, type: enum, source: input, description: "Legal basis: LEGAL_OBLIGATION | FREEDOM_OF_EXPRESSION | LEGAL_HOLD | TRADE_SECRET", constraints: "LEGAL_OBLIGATION | FREEDOM_OF_EXPRESSION | LEGAL_HOLD | TRADE_SECRET" }
      - { name: state, type: enum, source: system, description: "ASSERTED | UPHELD | OVERRULED — only UPHELD exemptions shield a category from fulfillment", default: "ASSERTED", constraints: "ASSERTED | UPHELD | OVERRULED" }

  - name: FulfillmentItem
    parent: DsarRequest
    common_fields: true
    fields:
      - { name: dsar_request_id, type: string, source: input, description: "FK -> DsarRequest.id; request whose fulfillment this line item belongs to" }
      - { name: discovery_finding_id, type: string, source: input, description: "FK -> DiscoveryFinding.id; the CONFIRMED finding this item fulfills" }
      - { name: processor_id, type: string, source: input, description: "FK -> Processor.id; processor that must action this item (mirrors the finding's processor)" }
      - { name: data_category, type: enum, source: system, description: "Mirrors the finding's data_category", constraints: "IDENTITY | FINANCIAL | BEHAVIORAL | CONTACT | HEALTH" }
      - { name: action, type: enum, source: system, description: "DISCLOSE | ERASE | SUPPRESS — derived from the parent request_type", constraints: "DISCLOSE | ERASE | SUPPRESS" }
      - { name: record_count, type: integer, source: system, description: "Mirrors the finding's record_count at item creation" }
      - { name: state, type: enum, source: system, description: "QUEUED | DISPATCHED | COMPLETED | BLOCKED | SKIPPED_EXEMPT — see FulfillmentItem state machine", default: "QUEUED", constraints: "QUEUED | DISPATCHED | COMPLETED | BLOCKED | SKIPPED_EXEMPT" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation including cascades" }

  - name: ProcessorNotification
    parent: FulfillmentItem
    common_fields: true
    fields:
      - { name: fulfillment_item_id, type: string, source: input, description: "FK -> FulfillmentItem.id; item that triggered this downstream notification" }
      - { name: processor_id, type: string, source: input, description: "FK -> Processor.id; processor being notified" }
      - { name: dispatched_at, type: datetime, source: system, description: "created_at-format UTC instant the notification was dispatched; anchors the ack-SLA clock" }
      - { name: ack_deadline_at, type: datetime, source: computed, description: "dispatched_at + Processor.sla_ack_hours hours; see calculations.processor_ack_deadline" }
      - { name: state, type: enum, source: system, description: "SENT | ACKNOWLEDGED | OVERDUE — see ProcessorNotification state machine", default: "SENT", constraints: "SENT | ACKNOWLEDGED | OVERDUE" }

  - name: AuditEvent
    parent: DsarRequest
    common_fields: false  # append-only log: id + created_at only, immutable
    fields:
      - { name: dsar_request_id, type: string, source: input, description: "FK -> DsarRequest.id; request the audited action targeted" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor who caused the event" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor who caused the event" }
      - { name: event_type, type: enum, source: system, description: "IDENTITY_VERIFIED | IDENTITY_REJECTED | DISCOVERY_RECORDED | EXEMPTION_DECIDED | FULFILLMENT_DISPATCHED | REQUEST_CLOSED | DEADLINE_EXTENDED", constraints: "IDENTITY_VERIFIED | IDENTITY_REJECTED | DISCOVERY_RECORDED | EXEMPTION_DECIDED | FULFILLMENT_DISPATCHED | REQUEST_CLOSED | DEADLINE_EXTENDED" }
      - { name: detail, type: string, source: system, description: "Human-readable summary of the audited action" }

  # --- Test-driving clock entity (singleton) ---
  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Server's notion of 'now' (ISO 8601 UTC). Defaults to real wall clock; settable via /_clock/set_current_utc for deterministic deadline tests" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DsarRequest
    initial_state: PENDING_VERIFICATION
    terminal_states: [CLOSED_FULFILLED, CLOSED_REJECTED, CLOSED_EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: DISCOVERY
        trigger: "POST /dsar-requests/{id}/verify-identity"
        actor: IntakeAgent
        preconditions:
          - "DsarRequest.status == PENDING_VERIFICATION"
          - "Request not past deadline: SystemClock.current_utc <= deadline_at (else ERR_DEADLINE_PASSED)"
        side_effects:
          - "identity_attempts += 1"
          - "verified_by_user_id := X-User-ID of the acting IntakeAgent"
          - "Append AuditEvent{event_type=IDENTITY_VERIFIED}"
          - "increments DsarRequest.version by 1"

      - from: PENDING_VERIFICATION
        to: VERIFICATION_REJECTED
        trigger: "POST /dsar-requests/{id}/reject-identity"
        actor: IntakeAgent
        preconditions:
          - "DsarRequest.status == PENDING_VERIFICATION"
        side_effects:
          - "identity_attempts += 1"
          - "Append AuditEvent{event_type=IDENTITY_REJECTED}"
          - "increments DsarRequest.version by 1"

      - from: VERIFICATION_REJECTED
        to: PENDING_VERIFICATION
        trigger: "POST /dsar-requests/{id}/resubmit-identity"
        actor: IntakeAgent
        preconditions:
          - "DsarRequest.status == VERIFICATION_REJECTED"
          - "identity_attempts < 3 (after 3 attempts the request must be closed; ERR_VERIFICATION_ATTEMPTS_EXHAUSTED)"
        side_effects:
          - "increments DsarRequest.version by 1"
        note: "Revision loop: REJECTED -> PENDING_VERIFICATION -> (verify|reject) makes this a cyclic state machine."

      - from: VERIFICATION_REJECTED
        to: CLOSED_REJECTED
        trigger: "POST /dsar-requests/{id}/close"
        actor: PrivacyOfficer
        preconditions:
          - "DsarRequest.status == VERIFICATION_REJECTED"
        side_effects:
          - "Append AuditEvent{event_type=REQUEST_CLOSED}"
          - "decrements Controller.open_request_count (recomputed)"
          - "increments DsarRequest.version by 1"

      - from: DISCOVERY
        to: UNDER_REVIEW
        trigger: "POST /dsar-requests/{id}/complete-discovery"
        actor: PrivacyOfficer
        preconditions:
          - "DsarRequest.status == DISCOVERY"
          - "At least one DiscoveryFinding exists (discovery_finding_count >= 1; ERR_NO_FINDINGS)"
          - "No DiscoveryFinding remains in state PENDING (every finding CONFIRMED or DISMISSED; ERR_UNRESOLVED_FINDINGS)"
        side_effects:
          - "increments DsarRequest.version by 1"

      - from: UNDER_REVIEW
        to: FULFILLING
        trigger: "POST /dsar-requests/{id}/dispatch-fulfillment"
        actor: PrivacyOfficer
        preconditions:
          - "DsarRequest.status == UNDER_REVIEW"
          - "Acting PrivacyOfficer.X-User-ID != DsarRequest.verified_by_user_id (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
          - "Every ExemptionClaim on the request is decided (state IN {UPHELD, OVERRULED}; none ASSERTED; ERR_UNDECIDED_EXEMPTION)"
        side_effects:
          - "expected_request_version required; OCC check against DsarRequest.version"
          - "For each CONFIRMED DiscoveryFinding whose data_category is NOT shielded by an UPHELD ExemptionClaim: create a FulfillmentItem in QUEUED (action derived from request_type: ACCESS->DISCLOSE, DELETION->ERASE, OPT_OUT->SUPPRESS)"
          - "For each CONFIRMED DiscoveryFinding whose data_category IS shielded by an UPHELD ExemptionClaim: create a FulfillmentItem in SKIPPED_EXEMPT"
          - "For DELETION requests, each created ERASE item whose data_category is frozen by an ACTIVE LegalHold on the subject is created in BLOCKED instead of QUEUED"
          - "Append AuditEvent{event_type=FULFILLMENT_DISPATCHED}"
          - "increments DsarRequest.version by 1"

      - from: FULFILLING
        to: CLOSED_FULFILLED
        trigger: "POST /dsar-requests/{id}/close"
        actor: PrivacyOfficer
        preconditions:
          - "DsarRequest.status == FULFILLING"
          - "No FulfillmentItem in state QUEUED, DISPATCHED, or BLOCKED (every item COMPLETED or SKIPPED_EXEMPT; ERR_FULFILLMENT_INCOMPLETE)"
        side_effects:
          - "Append AuditEvent{event_type=REQUEST_CLOSED}"
          - "decrements Controller.open_request_count (recomputed)"
          - "increments DsarRequest.version by 1"

      - from: DISCOVERY
        to: CLOSED_EXPIRED
        trigger: "POST /dsar-requests/{id}/expire (system sweep at clock advance)"
        actor: system
        preconditions:
          - "SystemClock.current_utc > deadline_at"
          - "DsarRequest.status IN {PENDING_VERIFICATION, VERIFICATION_REJECTED, DISCOVERY, UNDER_REVIEW, FULFILLING}"
        side_effects:
          - "Append AuditEvent{event_type=REQUEST_CLOSED}"
          - "decrements Controller.open_request_count (recomputed)"
          - "increments DsarRequest.version by 1"
        note: "expire applies from any non-terminal status; DISCOVERY listed as a representative from-state. The /_clock/set_current_utc endpoint triggers the sweep over all non-terminal requests whose deadline_at is now in the past."

      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /dsar-requests/{id}/extend-deadline"
        actor: PrivacyOfficer
        preconditions:
          - "DsarRequest.status IN {DISCOVERY, UNDER_REVIEW} (extension only before fulfillment dispatch)"
          - "extension_count == 0 (only one extension permitted; ERR_EXTENSION_LIMIT_REACHED)"
          - "Jurisdiction permits extension (Controller.jurisdiction supports an extension window; both GDPR and CCPA do)"
        side_effects:
          - "extension_count += 1"
          - "deadline_at recomputed (calculations.statutory_deadline with extension applied)"
          - "Append AuditEvent{event_type=DEADLINE_EXTENDED}"
          - "increments DsarRequest.version by 1"
        note: "Self-loop (cyclic). extend-deadline is also valid from DISCOVERY; the from/to pair shown is representative."

  - entity: DiscoveryFinding
    initial_state: PENDING
    terminal_states: [DISMISSED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /findings/{id}/confirm"
        actor: PrivacyOfficer
        preconditions:
          - "DiscoveryFinding.state == PENDING"
          - "Parent DsarRequest.status == DISCOVERY (ERR_INVALID_STATE on parent)"
        side_effects:
          - "increments parent DsarRequest.version by 1"

      - from: PENDING
        to: DISMISSED
        trigger: "POST /findings/{id}/dismiss"
        actor: PrivacyOfficer
        preconditions:
          - "DiscoveryFinding.state == PENDING"
          - "Parent DsarRequest.status == DISCOVERY"
        side_effects:
          - "increments parent DsarRequest.version by 1"

      - from: CONFIRMED
        to: DISMISSED
        trigger: "POST /findings/{id}/dismiss"
        actor: PrivacyOfficer
        preconditions:
          - "DiscoveryFinding.state == CONFIRMED"
          - "Parent DsarRequest.status == DISCOVERY (cannot dismiss once review complete)"
        side_effects:
          - "increments parent DsarRequest.version by 1"
        note: "CONFIRMED -> DISMISSED gives the finding machine a non-linear re-decision edge while still in DISCOVERY."

  - entity: ExemptionClaim
    initial_state: ASSERTED
    terminal_states: [UPHELD, OVERRULED]
    transitions:
      - from: ASSERTED
        to: UPHELD
        trigger: "POST /exemptions/{id}/decide"
        actor: PrivacyOfficer
        preconditions:
          - "ExemptionClaim.state == ASSERTED"
          - "Parent DsarRequest.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "If basis == LEGAL_HOLD: an ACTIVE LegalHold on the subject covering this data_category MUST exist (ERR_EXEMPTION_BASIS_UNSUPPORTED)"
        side_effects:
          - "Append AuditEvent{event_type=EXEMPTION_DECIDED}"
          - "increments parent DsarRequest.version by 1"

      - from: ASSERTED
        to: OVERRULED
        trigger: "POST /exemptions/{id}/decide"
        actor: PrivacyOfficer
        preconditions:
          - "ExemptionClaim.state == ASSERTED"
          - "Parent DsarRequest.status == UNDER_REVIEW"
        side_effects:
          - "Append AuditEvent{event_type=EXEMPTION_DECIDED}"
          - "increments parent DsarRequest.version by 1"

  - entity: FulfillmentItem
    initial_state: QUEUED
    terminal_states: [COMPLETED, SKIPPED_EXEMPT]
    transitions:
      - from: QUEUED
        to: DISPATCHED
        trigger: "POST /fulfillment-items/{id}/dispatch"
        actor: FulfillmentWorker
        preconditions:
          - "FulfillmentItem.state == QUEUED"
          - "Parent DsarRequest.status == FULFILLING"
          - "Referenced Processor.status == ACTIVE (ERR_PROCESSOR_SUSPENDED)"
          - "expected_item_version matches FulfillmentItem.version (OCC)"
        side_effects:
          - "Create ProcessorNotification{state=SENT, dispatched_at=SystemClock.current_utc} for this item's processor"
          - "Append AuditEvent{event_type=FULFILLMENT_DISPATCHED}"
          - "increments FulfillmentItem.version by 1"

      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /fulfillment-items/{id}/complete"
        actor: FulfillmentWorker
        preconditions:
          - "FulfillmentItem.state == DISPATCHED"
          - "The item's ProcessorNotification.state == ACKNOWLEDGED (ERR_NOTIFICATION_NOT_ACKED)"
        side_effects:
          - "If action == SUPPRESS: for every ConsentRecord of the subject with purpose IN {MARKETING, ANALYTICS, SALE_OF_DATA} and state GRANTED, flip state to WITHDRAWN and stamp withdrawn_at (cascade)"
          - "increments FulfillmentItem.version by 1"

      - from: QUEUED
        to: BLOCKED
        trigger: "system at dispatch-fulfillment (DELETION item under ACTIVE LegalHold)"
        actor: system
        preconditions:
          - "action == ERASE AND an ACTIVE LegalHold on the subject covers this item's data_category"
        side_effects: []
        note: "Set at creation time during dispatch-fulfillment cascade; not a client-driven transition."

      - from: BLOCKED
        to: QUEUED
        trigger: "POST /fulfillment-items/{id}/unblock"
        actor: PrivacyOfficer
        preconditions:
          - "FulfillmentItem.state == BLOCKED"
          - "No ACTIVE LegalHold on the subject covers this item's data_category (the hold must have been LIFTED first; ERR_LEGAL_HOLD_ACTIVE)"
        side_effects:
          - "increments FulfillmentItem.version by 1"
        note: "Compensating edge: lifting the hold then unblocking returns the item to the normal queue."

  - entity: ProcessorNotification
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /processor-notifications/{id}/acknowledge"
        actor: ProcessorAgent
        preconditions:
          - "ProcessorNotification.state IN {SENT, OVERDUE}"
        side_effects: []
        note: "A notification may be acknowledged even after it has gone OVERDUE."

      - from: SENT
        to: OVERDUE
        trigger: "system sweep at /_clock/set_current_utc"
        actor: system
        preconditions:
          - "SystemClock.current_utc > ack_deadline_at"
          - "ProcessorNotification.state == SENT"
        side_effects: []
        note: "Set by the clock sweep; not client-driven."

  - entity: ConsentRecord
    initial_state: GRANTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: GRANTED
        to: WITHDRAWN
        trigger: "POST /consent-records/{id}/withdraw OR cascade from FulfillmentItem SUPPRESS completion"
        actor: DataSubjectAgent
        preconditions:
          - "ConsentRecord.state == GRANTED"
        side_effects:
          - "withdrawn_at := SystemClock.current_utc"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: dispatch-fulfillment-stale-request
    parent_entity: DsarRequest
    write_endpoint: "POST /dsar-requests/{id}/dispatch-fulfillment"
    occ_field: "expected_request_version"
    description: |
      Dispatching fulfillment against a DsarRequest whose version has advanced
      since the client last observed it is rejected. An exemption decision or a
      finding confirmation between the client's read and this dispatch legitimately
      bumps the request version; the client's view of which findings/exemptions
      are in play is therefore stale and the dispatch is refused on a version
      mismatch rather than fanning out items from an outdated picture.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispatch-item-stale-item
    parent_entity: FulfillmentItem
    write_endpoint: "POST /fulfillment-items/{id}/dispatch"
    occ_field: "expected_item_version"
    description: |
      Dispatching a FulfillmentItem whose version has advanced since the client
      last observed it is rejected. A prior unblock (BLOCKED -> QUEUED) advances
      the item version; a dispatch still carrying the pre-unblock version is
      refused on a stale-version mismatch rather than re-sending a notification
      from an outdated item snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: statutory_deadline
    trigger: "DsarRequest creation; recomputed on EXTENDED self-loop transition"
    algorithm: threshold
    formula: |
      base_days = (Controller.jurisdiction == "GDPR") ? 30 : 45      # GDPR=30 calendar days, CCPA=45
      extension_days = (Controller.jurisdiction == "GDPR") ? 60 : 45  # GDPR allows +60, CCPA allows +45
      total_calendar_days = base_days + (extension_count * extension_days)
      deadline_at = received_at + total_calendar_days CALENDAR days   # add calendar days to the received_at instant, preserving time-of-day
    input_set: "The owning Controller's jurisdiction and this request's received_at and extension_count."
    constants:
      GDPR_BASE_DAYS: 30
      GDPR_EXTENSION_DAYS: 60
      CCPA_BASE_DAYS: 45
      CCPA_EXTENSION_DAYS: 45
    precision: "Calendar-day arithmetic; deadline_at keeps received_at's time-of-day. No rounding."
    variants:
      - name: base
        when: "extension_count == 0"
        difference: "deadline = received_at + base_days"
      - name: extended
        when: "extension_count == 1"
        difference: "deadline = received_at + base_days + extension_days (single extension only)"

  - name: business_days_remaining
    trigger: "Read of DsarRequest (computed field); GET /dsar-requests/{id}"
    algorithm: chronological
    formula: |
      # Count business days (Mon-Fri, UTC) strictly between SystemClock.current_utc and deadline_at.
      # Half-open: the start day (current_utc's date) is EXCLUDED; the deadline day IS INCLUDED if it is a business day.
      # Iterate day-by-day from date(current_utc)+1 .. date(deadline_at) inclusive; +1 for each weekday (Mon=0..Fri=4).
      if deadline_at < current_utc: result = 0   # never negative
      else: result = count of dates d in (date(current_utc), date(deadline_at)] where weekday(d) in {Mon..Fri}
    input_set: "SystemClock.current_utc and this request's deadline_at."
    constants:
      WEEKEND_DAYS: ["SAT", "SUN"]
    precision: "Integer count of weekday dates; floors at 0. Boundary: start date excluded, deadline date included."

  - name: fulfillment_progress
    trigger: "Read of DsarRequest; recomputed whenever a child FulfillmentItem changes state"
    algorithm: aggregation
    formula: |
      items = FulfillmentItem rows where dsar_request_id == this request
      if items is empty: fulfillment_progress_pct = 0.00
      else:
        terminal = count(items where state IN {COMPLETED, SKIPPED_EXEMPT})
        fulfillment_progress_pct = round( 100.0 * terminal / count(items), 2 )   # round HALF_UP to 2 decimals AFTER the division
    input_set: "All FulfillmentItem rows of the request, partitioned by terminal vs non-terminal state."
    constants: {}
    precision: "2 decimal places, round_half_up; division performed first, single rounding at the end (sum-then-round, NOT per-item)."

  - name: processor_ack_deadline
    trigger: "ProcessorNotification creation (FulfillmentItem QUEUED -> DISPATCHED side effect)"
    algorithm: threshold
    formula: |
      ack_deadline_at = dispatched_at + Processor.sla_ack_hours HOURS   # exact hour arithmetic on the UTC instant
    input_set: "The notification's dispatched_at and the referenced Processor.sla_ack_hours."
    constants:
      DEFAULT_SLA_ACK_HOURS: 72
    precision: "Exact hour arithmetic on the UTC instant; no rounding."

  - name: erasure_exposure_score
    trigger: "Read of DsarRequest summary; GET /dsar-requests/{id}/risk"
    algorithm: weighted_scoring
    formula: |
      # Risk that a DELETION request leaves residual exposure. Operates on the request's CONFIRMED findings.
      # Per-category weight reflects sensitivity; BLOCKED/SKIPPED items still count as residual exposure.
      CATEGORY_WEIGHT = { HEALTH: 5, FINANCIAL: 4, IDENTITY: 3, CONTACT: 2, BEHAVIORAL: 1 }
      residual = 0
      for each FulfillmentItem fi of this request with action == ERASE and state IN {QUEUED, DISPATCHED, BLOCKED, SKIPPED_EXEMPT}:
        residual += CATEGORY_WEIGHT[fi.data_category] * fi.record_count
      total = 0
      for each FulfillmentItem fi of this request with action == ERASE:
        total += CATEGORY_WEIGHT[fi.data_category] * fi.record_count
      if total == 0: erasure_exposure_score = 0.00
      else: erasure_exposure_score = round( 100.0 * residual / total, 2 )   # percent of weighted records still exposed
    input_set: "ERASE FulfillmentItems of the request; COMPLETED items are fully remediated (excluded from residual)."
    constants:
      HEALTH_WEIGHT: 5
      FINANCIAL_WEIGHT: 4
      IDENTITY_WEIGHT: 3
      CONTACT_WEIGHT: 2
      BEHAVIORAL_WEIGHT: 1
    precision: "2 decimal places, round_half_up; weighted sum computed in integer space first, single rounding after the division."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right (controller, request, finding, item, processor, exemption)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_temporal
    check: "Request is not past its statutory deadline when a verify/discovery/dispatch action is attempted"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /dsar-requests/{id}/verify-identity, /complete-discovery, /dispatch-fulfillment"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: the PrivacyOfficer dispatching fulfillment must not be the user who verified identity (X-User-ID inequality)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dsar-requests/{id}/dispatch-fulfillment"

  - priority: 7
    category: business_safety
    check: "Identity-verification attempts not exhausted (identity_attempts < 3) before allowing resubmit"
    error_id: ERR_VERIFICATION_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /dsar-requests/{id}/resubmit-identity"

  - priority: 8
    category: business_referential
    check: "An asserted LEGAL_HOLD exemption must be backed by an ACTIVE LegalHold on the subject covering the same data_category"
    error_id: ERR_EXEMPTION_BASIS_UNSUPPORTED
    http_status: 409
    applies_to: "POST /exemptions/{id}/decide"

  - priority: 9
    category: business_referential
    check: "A BLOCKED erasure item cannot be unblocked while an ACTIVE LegalHold still covers its data_category"
    error_id: ERR_LEGAL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /fulfillment-items/{id}/unblock"

  - priority: 10
    category: business_constraint
    check: "Every ExemptionClaim on the request is decided (none ASSERTED) before fulfillment dispatch"
    error_id: ERR_UNDECIDED_EXEMPTION
    http_status: 409
    applies_to: "POST /dsar-requests/{id}/dispatch-fulfillment"

  - priority: 11
    category: business_constraint
    check: "No DiscoveryFinding remains PENDING (all CONFIRMED or DISMISSED) before completing discovery; at least one finding exists"
    error_id: ERR_UNRESOLVED_FINDINGS
    http_status: 409
    applies_to: "POST /dsar-requests/{id}/complete-discovery"

  - priority: 12
    category: business_constraint
    check: "A FulfillmentItem can only be dispatched if its Processor.status == ACTIVE"
    error_id: ERR_PROCESSOR_SUSPENDED
    http_status: 409
    applies_to: "POST /fulfillment-items/{id}/dispatch"

  - priority: 13
    category: business_constraint
    check: "A FulfillmentItem can only be completed once its ProcessorNotification is ACKNOWLEDGED"
    error_id: ERR_NOTIFICATION_NOT_ACKED
    http_status: 409
    applies_to: "POST /fulfillment-items/{id}/complete"

  - priority: 14
    category: business_constraint
    check: "At most one deadline extension per request (extension_count == 0 to grant)"
    error_id: ERR_EXTENSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /dsar-requests/{id}/extend-deadline"

  - priority: 15
    category: business_constraint
    check: "All fulfillment items terminal (COMPLETED/SKIPPED_EXEMPT) before closing a FULFILLING request"
    error_id: ERR_FULFILLMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /dsar-requests/{id}/close"

  - priority: 16
    category: business_constraint
    check: "complete-discovery requires at least one DiscoveryFinding"
    error_id: ERR_NO_FINDINGS
    http_status: 409
    applies_to: "POST /dsar-requests/{id}/complete-discovery"

  - priority: 17
    category: concurrency
    check: "expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dsar-requests/{id}/dispatch-fulfillment, POST /fulfillment-items/{id}/dispatch"

  - priority: 18
    category: business_constraint
    check: "Request body required fields present and well-typed; enum members valid; record_count >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/transition endpoints with a body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Controller ---
  - method: POST
    path: "/controllers"
    description: "Register a data Controller (tenant)"
    roles: [PrivacyOfficer]
    code: 201
    input: [name, jurisdiction, dpo_email]
    output: Controller
    side_effects: ["open_request_count=0"]

  - method: GET
    path: "/controllers/{id}"
    description: "Get a Controller"
    roles: [PrivacyOfficer, IntakeAgent]
    code: 200
    input: []
    output: Controller
    side_effects: []

  # --- DataSubject ---
  - method: POST
    path: "/data-subjects"
    description: "Register a DataSubject under a controller"
    roles: [IntakeAgent, PrivacyOfficer]
    code: 201
    input: [controller_id, email, full_name, jurisdiction_residency, "known_record_count?"]
    output: DataSubject
    side_effects: []

  - method: GET
    path: "/data-subjects/{id}"
    description: "Get a DataSubject"
    roles: [IntakeAgent, PrivacyOfficer]
    code: 200
    input: []
    output: DataSubject
    side_effects: []

  - method: GET
    path: "/data-subjects"
    description: "List DataSubjects, optionally filtered by controller (reverse-reachability for DataSubject.controller_id)"
    roles: [IntakeAgent, PrivacyOfficer]
    code: 200
    input: ["controller_id?", "limit?", "offset?"]
    output: DataSubject[]
    side_effects: []

  # --- Processor registry ---
  - method: POST
    path: "/processors"
    description: "Register a Processor (downstream vendor)"
    roles: [PrivacyOfficer]
    code: 201
    input: [controller_id, name, notify_email, "sla_ack_hours?"]
    output: Processor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/processors/{id}"
    description: "Get a Processor"
    roles: [PrivacyOfficer, FulfillmentWorker]
    code: 200
    input: []
    output: Processor
    side_effects: []

  - method: GET
    path: "/processors"
    description: "List Processors, optionally filtered by controller"
    roles: [PrivacyOfficer, FulfillmentWorker]
    code: 200
    input: ["controller_id?", "limit?", "offset?"]
    output: Processor[]
    side_effects: []

  - method: POST
    path: "/processors/{id}/suspend"
    description: "Suspend a Processor (ACTIVE -> SUSPENDED)"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: Processor
    side_effects: ["status=SUSPENDED"]

  # --- ConsentRecord registry ---
  - method: POST
    path: "/consent-records"
    description: "Record a consent grant for a subject/purpose"
    roles: [IntakeAgent, PrivacyOfficer]
    code: 201
    input: [data_subject_id, purpose]
    output: ConsentRecord
    side_effects: ["state=GRANTED"]

  - method: GET
    path: "/consent-records/{id}"
    description: "Get a ConsentRecord"
    roles: [IntakeAgent, PrivacyOfficer, DataSubjectAgent]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []

  - method: GET
    path: "/consent-records"
    description: "List ConsentRecords, optionally filtered by subject"
    roles: [IntakeAgent, PrivacyOfficer, DataSubjectAgent]
    code: 200
    input: ["data_subject_id?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []

  - method: POST
    path: "/consent-records/{id}/withdraw"
    description: "Subject withdraws a consent (GRANTED -> WITHDRAWN)"
    roles: [DataSubjectAgent, PrivacyOfficer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["state=WITHDRAWN", "withdrawn_at set"]

  # --- LegalHold registry ---
  - method: POST
    path: "/legal-holds"
    description: "Place a LegalHold on a subject's data categories"
    roles: [PrivacyOfficer]
    code: 201
    input: [controller_id, data_subject_id, matter_reference, data_categories]
    output: LegalHold
    side_effects: ["state=ACTIVE"]

  - method: GET
    path: "/legal-holds/{id}"
    description: "Get a LegalHold"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: LegalHold
    side_effects: []

  - method: GET
    path: "/legal-holds"
    description: "List LegalHolds, optionally filtered by controller or subject"
    roles: [PrivacyOfficer]
    code: 200
    input: ["controller_id?", "data_subject_id?", "limit?", "offset?"]
    output: LegalHold[]
    side_effects: []

  - method: POST
    path: "/legal-holds/{id}/lift"
    description: "Lift a LegalHold (ACTIVE -> LIFTED)"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: LegalHold
    side_effects: ["state=LIFTED"]

  # --- DsarRequest core ---
  - method: POST
    path: "/dsar-requests"
    description: "Intake a new DSAR (request_type fixed at intake)"
    roles: [IntakeAgent, PrivacyOfficer]
    code: 201
    input: [controller_id, data_subject_id, request_type, received_at]
    output: DsarRequest
    side_effects: ["status=PENDING_VERIFICATION", "deadline_at computed", "increments Controller.open_request_count"]

  - method: GET
    path: "/dsar-requests/{id}"
    description: "Get a DsarRequest (includes computed deadline/progress fields)"
    roles: [IntakeAgent, PrivacyOfficer, FulfillmentWorker]
    code: 200
    input: []
    output: DsarRequest
    side_effects: []

  - method: GET
    path: "/dsar-requests"
    description: "List DsarRequests, optionally filtered by controller or subject"
    roles: [IntakeAgent, PrivacyOfficer, FulfillmentWorker]
    code: 200
    input: ["controller_id?", "data_subject_id?", "status?", "limit?", "offset?"]
    output: DsarRequest[]
    side_effects: []

  - method: GET
    path: "/dsar-requests/{id}/risk"
    description: "Computed read: erasure exposure risk score for a DELETION request"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: "{ erasure_exposure_score: number, residual_weighted: integer, total_weighted: integer }"
    side_effects: []

  - method: POST
    path: "/dsar-requests/{id}/verify-identity"
    description: "IntakeAgent verifies subject identity (PENDING_VERIFICATION -> DISCOVERY)"
    roles: [IntakeAgent]
    code: 200
    input: [evidence_reference]
    output: DsarRequest
    side_effects: ["identity_attempts += 1", "verified_by_user_id set", "AuditEvent appended", "increments DsarRequest.version by 1"]

  - method: POST
    path: "/dsar-requests/{id}/reject-identity"
    description: "IntakeAgent rejects identity evidence (PENDING_VERIFICATION -> VERIFICATION_REJECTED)"
    roles: [IntakeAgent]
    code: 200
    input: [reason]
    output: DsarRequest
    side_effects: ["identity_attempts += 1", "AuditEvent appended", "increments DsarRequest.version by 1"]

  - method: POST
    path: "/dsar-requests/{id}/resubmit-identity"
    description: "Subject resubmits identity evidence (VERIFICATION_REJECTED -> PENDING_VERIFICATION)"
    roles: [IntakeAgent]
    code: 200
    input: []
    output: DsarRequest
    side_effects: ["increments DsarRequest.version by 1"]

  - method: POST
    path: "/dsar-requests/{id}/complete-discovery"
    description: "PrivacyOfficer closes discovery (DISCOVERY -> UNDER_REVIEW)"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: DsarRequest
    side_effects: ["increments DsarRequest.version by 1"]

  - method: POST
    path: "/dsar-requests/{id}/extend-deadline"
    description: "PrivacyOfficer grants the single permitted deadline extension"
    roles: [PrivacyOfficer]
    code: 200
    input: [reason]
    output: DsarRequest
    side_effects: ["extension_count += 1", "deadline_at recomputed", "AuditEvent appended", "increments DsarRequest.version by 1"]

  - method: POST
    path: "/dsar-requests/{id}/dispatch-fulfillment"
    description: "PrivacyOfficer fans out FulfillmentItems (UNDER_REVIEW -> FULFILLING). OCC-guarded."
    roles: [PrivacyOfficer]
    code: 200
    input: [expected_request_version]
    output: DsarRequest
    side_effects:
      - "Create one FulfillmentItem per CONFIRMED finding (QUEUED, BLOCKED, or SKIPPED_EXEMPT per exemption/legal-hold rules)"
      - "AuditEvent appended"
      - "increments DsarRequest.version by 1"

  - method: POST
    path: "/dsar-requests/{id}/close"
    description: "PrivacyOfficer closes the request (FULFILLING->CLOSED_FULFILLED or VERIFICATION_REJECTED->CLOSED_REJECTED)"
    roles: [PrivacyOfficer]
    code: 200
    input: [disposition]
    output: DsarRequest
    side_effects: ["status -> CLOSED_*", "AuditEvent appended", "decrements Controller.open_request_count"]

  # --- DiscoveryFinding (sub-resource of DsarRequest) ---
  - method: POST
    path: "/dsar-requests/{id}/findings"
    description: "Record a cross-system discovery finding for a request in DISCOVERY"
    roles: [PrivacyOfficer, IntakeAgent]
    code: 201
    input: [processor_id, data_category, record_count, confidence]
    output: DiscoveryFinding
    side_effects: ["state=PENDING", "increments DsarRequest.discovery_finding_count", "increments DsarRequest.version by 1"]

  - method: GET
    path: "/dsar-requests/{id}/findings"
    description: "List a request's DiscoveryFindings (reverse-reachability for DiscoveryFinding.dsar_request_id)"
    roles: [PrivacyOfficer, IntakeAgent, FulfillmentWorker]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: DiscoveryFinding[]
    side_effects: []

  - method: GET
    path: "/findings/{id}"
    description: "Get a single DiscoveryFinding"
    roles: [PrivacyOfficer, IntakeAgent, FulfillmentWorker]
    code: 200
    input: []
    output: DiscoveryFinding
    side_effects: []

  - method: GET
    path: "/findings"
    description: "List DiscoveryFindings filtered by processor (reverse-reachability for DiscoveryFinding.processor_id)"
    roles: [PrivacyOfficer, IntakeAgent, FulfillmentWorker]
    code: 200
    input: ["processor_id?", "dsar_request_id?", "limit?", "offset?"]
    output: DiscoveryFinding[]
    side_effects: []

  - method: POST
    path: "/findings/{id}/confirm"
    description: "Confirm a discovery finding (PENDING -> CONFIRMED)"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: DiscoveryFinding
    side_effects: ["increments parent DsarRequest.version by 1"]

  - method: POST
    path: "/findings/{id}/dismiss"
    description: "Dismiss a discovery finding (PENDING|CONFIRMED -> DISMISSED)"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: DiscoveryFinding
    side_effects: ["increments parent DsarRequest.version by 1"]

  # --- ExemptionClaim (sub-resource of DsarRequest) ---
  - method: POST
    path: "/dsar-requests/{id}/exemptions"
    description: "Assert an exemption against a request (in DISCOVERY or UNDER_REVIEW)"
    roles: [PrivacyOfficer]
    code: 201
    input: [data_category, basis]
    output: ExemptionClaim
    side_effects: ["state=ASSERTED", "increments DsarRequest.version by 1"]

  - method: GET
    path: "/dsar-requests/{id}/exemptions"
    description: "List a request's ExemptionClaims (reverse-reachability for ExemptionClaim.dsar_request_id)"
    roles: [PrivacyOfficer]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: ExemptionClaim[]
    side_effects: []

  - method: GET
    path: "/exemptions/{id}"
    description: "Get a single ExemptionClaim"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ExemptionClaim
    side_effects: []

  - method: POST
    path: "/exemptions/{id}/decide"
    description: "Uphold or overrule an exemption (ASSERTED -> UPHELD|OVERRULED)"
    roles: [PrivacyOfficer]
    code: 200
    input: [decision]
    output: ExemptionClaim
    side_effects: ["AuditEvent appended", "increments parent DsarRequest.version by 1"]

  # --- FulfillmentItem (sub-resource of DsarRequest) ---
  - method: GET
    path: "/dsar-requests/{id}/fulfillment-items"
    description: "List a request's FulfillmentItems (reverse-reachability for FulfillmentItem.dsar_request_id)"
    roles: [PrivacyOfficer, FulfillmentWorker]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: FulfillmentItem[]
    side_effects: []

  - method: GET
    path: "/fulfillment-items/{id}"
    description: "Get a single FulfillmentItem"
    roles: [PrivacyOfficer, FulfillmentWorker]
    code: 200
    input: []
    output: FulfillmentItem
    side_effects: []

  - method: GET
    path: "/fulfillment-items"
    description: "List FulfillmentItems filtered by finding or processor (reverse-reachability for discovery_finding_id and processor_id)"
    roles: [PrivacyOfficer, FulfillmentWorker]
    code: 200
    input: ["discovery_finding_id?", "processor_id?", "dsar_request_id?", "limit?", "offset?"]
    output: FulfillmentItem[]
    side_effects: []

  - method: POST
    path: "/fulfillment-items/{id}/dispatch"
    description: "Worker dispatches an item to its processor (QUEUED -> DISPATCHED). OCC-guarded."
    roles: [FulfillmentWorker]
    code: 200
    input: [expected_item_version]
    output: FulfillmentItem
    side_effects: ["ProcessorNotification created (SENT)", "AuditEvent appended", "increments FulfillmentItem.version by 1"]

  - method: POST
    path: "/fulfillment-items/{id}/complete"
    description: "Worker marks item complete after processor ack (DISPATCHED -> COMPLETED)"
    roles: [FulfillmentWorker]
    code: 200
    input: []
    output: FulfillmentItem
    side_effects: ["If action==SUPPRESS: cascade-withdraw subject ConsentRecords", "increments FulfillmentItem.version by 1"]

  - method: POST
    path: "/fulfillment-items/{id}/unblock"
    description: "PrivacyOfficer returns a BLOCKED item to QUEUED after the legal hold is lifted"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: FulfillmentItem
    side_effects: ["state=QUEUED", "increments FulfillmentItem.version by 1"]

  # --- ProcessorNotification (sub-resource of FulfillmentItem) ---
  - method: GET
    path: "/fulfillment-items/{id}/notifications"
    description: "List notifications for an item (reverse-reachability for ProcessorNotification.fulfillment_item_id)"
    roles: [PrivacyOfficer, FulfillmentWorker, ProcessorAgent]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: ProcessorNotification[]
    side_effects: []

  - method: GET
    path: "/processor-notifications/{id}"
    description: "Get a single ProcessorNotification"
    roles: [PrivacyOfficer, FulfillmentWorker, ProcessorAgent]
    code: 200
    input: []
    output: ProcessorNotification
    side_effects: []

  - method: GET
    path: "/processor-notifications"
    description: "List ProcessorNotifications filtered by processor (reverse-reachability for ProcessorNotification.processor_id)"
    roles: [PrivacyOfficer, FulfillmentWorker, ProcessorAgent]
    code: 200
    input: ["processor_id?", "fulfillment_item_id?", "limit?", "offset?"]
    output: ProcessorNotification[]
    side_effects: []

  - method: POST
    path: "/processor-notifications/{id}/acknowledge"
    description: "Processor agent acknowledges a notification (SENT|OVERDUE -> ACKNOWLEDGED)"
    roles: [ProcessorAgent]
    code: 200
    input: []
    output: ProcessorNotification
    side_effects: ["state=ACKNOWLEDGED"]

  # --- AuditEvent (append-only sub-resource of DsarRequest) ---
  - method: GET
    path: "/dsar-requests/{id}/audit-events"
    description: "List a request's AuditEvents (reverse-reachability for AuditEvent.dsar_request_id)"
    roles: [PrivacyOfficer, IntakeAgent]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's notion of 'now'; triggers deadline-expiry and notification-overdue sweeps"
    roles: [PrivacyOfficer]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects:
      - "SystemClock.current_utc := to_iso8601"
      - "Every non-terminal DsarRequest with deadline_at < current_utc -> CLOSED_EXPIRED (open_request_count recomputed)"
      - "Every ProcessorNotification SENT with ack_deadline_at < current_utc -> OVERDUE"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, or record_count < 1" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Request is past its statutory deadline for the attempted action" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Dispatching officer is the same user who verified identity" }
  - { id: ERR_VERIFICATION_ATTEMPTS_EXHAUSTED, http: 409, condition: "identity_attempts >= 3; resubmit no longer allowed" }
  - { id: ERR_EXEMPTION_BASIS_UNSUPPORTED, http: 409, condition: "LEGAL_HOLD exemption upheld without a matching ACTIVE LegalHold" }
  - { id: ERR_LEGAL_HOLD_ACTIVE, http: 409, condition: "Cannot unblock an erasure item while an ACTIVE LegalHold covers its category" }
  - { id: ERR_UNDECIDED_EXEMPTION, http: 409, condition: "An ExemptionClaim is still ASSERTED at fulfillment dispatch" }
  - { id: ERR_UNRESOLVED_FINDINGS, http: 409, condition: "A DiscoveryFinding is still PENDING at complete-discovery" }
  - { id: ERR_NO_FINDINGS, http: 409, condition: "complete-discovery attempted with zero findings" }
  - { id: ERR_PROCESSOR_SUSPENDED, http: 409, condition: "Dispatch to a SUSPENDED processor" }
  - { id: ERR_NOTIFICATION_NOT_ACKED, http: 409, condition: "Completing an item whose notification is not ACKNOWLEDGED" }
  - { id: ERR_EXTENSION_LIMIT_REACHED, http: 409, condition: "Second deadline extension attempted (extension_count already 1)" }
  - { id: ERR_FULFILLMENT_INCOMPLETE, http: 409, condition: "Closing a FULFILLING request with non-terminal items" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeAgent
    description: "Front-desk privacy operator: registers subjects, intakes requests, and performs identity verification. Cannot approve exemptions or dispatch fulfillment (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /dsar-requests/{id}/verify-identity"
      - "POST /dsar-requests/{id}/reject-identity"
      - "POST /dsar-requests/{id}/resubmit-identity"
    shared_operations:
      - "POST /data-subjects (with PrivacyOfficer)"
      - "POST /consent-records (with PrivacyOfficer)"
      - "POST /dsar-requests (with PrivacyOfficer)"
      - "POST /dsar-requests/{id}/findings (with PrivacyOfficer)"
      - "GET reads on controllers, data-subjects, requests, findings, audit-events"

  - name: PrivacyOfficer
    description: "Senior privacy decision-maker: manages controllers/processors/legal-holds, decides exemptions/findings, dispatches fulfillment, and closes requests. May not dispatch fulfillment on a request whose identity this same user verified."
    identity: "opaque"
    exclusive_operations:
      - "POST /controllers"
      - "POST /processors"
      - "POST /processors/{id}/suspend"
      - "POST /legal-holds"
      - "POST /legal-holds/{id}/lift"
      - "POST /dsar-requests/{id}/complete-discovery"
      - "POST /dsar-requests/{id}/extend-deadline"
      - "POST /dsar-requests/{id}/dispatch-fulfillment"
      - "POST /dsar-requests/{id}/close"
      - "POST /findings/{id}/confirm"
      - "POST /findings/{id}/dismiss"
      - "POST /dsar-requests/{id}/exemptions"
      - "POST /exemptions/{id}/decide"
      - "POST /fulfillment-items/{id}/unblock"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /data-subjects (with IntakeAgent)"
      - "POST /consent-records (with IntakeAgent)"
      - "POST /consent-records/{id}/withdraw (with DataSubjectAgent)"
      - "POST /dsar-requests (with IntakeAgent)"
      - "POST /dsar-requests/{id}/findings (with IntakeAgent)"
      - "GET reads across all resources"

  - name: FulfillmentWorker
    description: "Operations role that dispatches and completes fulfillment items against downstream processors. Cannot decide exemptions, confirm findings, or close requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /fulfillment-items/{id}/dispatch"
      - "POST /fulfillment-items/{id}/complete"
    shared_operations:
      - "GET reads on processors, requests, findings, fulfillment-items, notifications"

  - name: ProcessorAgent
    description: "Acts on behalf of a downstream Processor to acknowledge notifications. No write access to the request lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /processor-notifications/{id}/acknowledge"
    shared_operations:
      - "GET reads on notifications and consent-records"

  - name: DataSubjectAgent
    description: "Acts on behalf of the data subject to manage their own consent registry entries. No access to request internals."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /consent-records/{id}/withdraw (with PrivacyOfficer)"
      - "GET reads on consent-records"
