      - name: corner_valuation_validity_window_closed_at_day_one_hundred_twenty
        claim_type: temporal_validation
        grounds:
          - validations[priority=24]
          - errors.ERR_VALUATION_EXPIRED
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "An approved loan whose paperwork never changes flips from closeable to refused purely by moving the logical clock one day: with the accepted appraisal effective 2026-05-01, day 121 (2026-08-30) is ERR_VALUATION_EXPIRED and day 120 (2026-08-29) still closes, so the 120-day window is a closed interval rather than a strict one."
