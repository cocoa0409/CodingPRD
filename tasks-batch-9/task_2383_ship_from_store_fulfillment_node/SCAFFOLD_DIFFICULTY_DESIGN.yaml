            - "Three orders commit to S1: O1 (SKU-A x2) as a1, O2 (SKU-A x1) as a2, O3 (SKU-A x1) as a3; all three are accepted at 09:05, picked in full at 09:10 and packed in MEDIUM_BOX at 09:20."
