          assert:
            - "the amendment carrying ${lg_v2} returns 412 with data.error_id == 'ERR_STALE_LEAGUE_VERSION' - the token was invalidated by side effects the client never issued"
            - "the immediately following GET /leagues/${lg_id} returns version == ${lg_vN} and max_dues_arrears_weeks == 2 - a 412 is inert, it neither bumps the version nor half-applies the eighteen bylaw fields"
            - "the amendment carrying ${lg_vN} returns 200 with data.version == ${lg_vN} + 1 and max_dues_arrears_weeks == 3"
            - "replaying the same endpoint with ${lg_vN} once more returns 412 with the same code - the client's own successful write is what invalidated its token, which is the whole point of the rule"
            - "the ${t1_id} lineup carrying ${mt2_v1} returns 200 with data.version == ${mt2_v1} + 1 and away_team_handicap_per_game == 54 == 36 + 18"
            - "re-submitting the reordered ${t1_id} lineup with the now-stale ${mt2_v1} returns 412 with data.error_id == 'ERR_STALE_MATCH_VERSION' - the Match counter is its own, untouched by the League amendment that ran between them"
