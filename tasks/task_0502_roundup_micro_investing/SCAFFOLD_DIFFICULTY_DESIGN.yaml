        grounds:
          - calculations.sweep_and_threshold_invest
          - state_machines.RoundUpAccrual.PENDING_to_SWEPT
          - calculations.invest_settlement
          - calculations.bucket_drift
          - entities.Bucket.fields.needs_rebalance
        distinguishing_aspect: >
          Depth-4 transitive cascade from POST /accounts/{id}/sweep: (1) PENDING accruals -> SWEPT credits
          cash; (2) cash crossing sweep_threshold itself triggers (3) an auto INVEST order that settles and
          opens a TaxLot; (4) the new lot itself triggers a Bucket drift recompute updating needs_rebalance.
          Each hop is caused by the prior hop, not by the original sweep call directly.
