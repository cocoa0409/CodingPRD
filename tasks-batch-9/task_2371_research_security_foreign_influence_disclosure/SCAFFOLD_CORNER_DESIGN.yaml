        claim_type: priority_ordering
        grounds:
          - validations.priority_1_auth_headers
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 outranks everything else: with the X-User-ID header absent the request is 401 ERR_UNAUTHENTICATED even though the body is also missing a required field and the referenced investigator does not exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one unrelated investigator exists only so a real parent version can be read."
