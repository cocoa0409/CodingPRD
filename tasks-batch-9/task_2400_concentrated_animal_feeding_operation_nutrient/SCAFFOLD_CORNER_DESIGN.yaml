      - name: records_basis_summary_skips_voided_events_and_uncommitted_transfers
        claim_type: input_set_filtering
        grounds:
          - calculations.operation_manure_production
          - endpoints.GET /cafo/operations/{id}/nutrient-summary
          - calculations.application_event_nutrient_load
        distinguishing_aspect: |
          The RECORDS_BASIS input set is polled three times over the same rows: an INITIATED transfer
          contributes nothing, the same transfer contributes once ACKNOWLEDGED, and voiding the event
          removes its gallons — while total_n_applied_lbs tracks only application events, so the
          acknowledged transfer's 4800 lb of nitrogen never enters the nitrogen roll-up.
        test_recipe:
          setup:
            - "Canonical Willow Creek Dairy operation with a COVERED permit, an APPROVED 2026 plan, one ACTIVE budget and a lagoon holding 1000000 gallons"
            - "One RECORDED event of 300000 gallons applied 2026-07-20 by injection on 30 acres"
