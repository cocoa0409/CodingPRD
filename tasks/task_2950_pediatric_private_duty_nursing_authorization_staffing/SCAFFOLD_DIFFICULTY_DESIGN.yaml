              payload: { case_id: "${case1_id}", basis: "BROAD" }
              as: Scheduler
              as_user_id: "sch-001"
          assert:
            - "STRICT response: matched_assignment_count == 1, continuity_score == 15"
            - "BROAD response: matched_assignment_count == 3, continuity_score == 45"
            - "BROAD continuity_score 45 > STRICT continuity_score 15 on identical assignment history"
            - "the STRICT count excludes both CANCELLED assignments and the case-2 assignment; the BROAD count includes all three rows"

  - rule_id: combinatorial_formula
    instances:
      - name: weekly_settled_units_round_per_timesheet_not_on_summed_minutes
        grounds:
          - calculations.timesheet_net_billable_units
          - calculations.authorization_weekly_utilization.variants.SETTLED
          - endpoints[GET /pdn/authorizations/{id}/utilization]
          - entities.Timesheet.gross_billable_units
        distinguishing_aspect: >-
          Mode (b) aggregation-order sensitivity: two visits of 250 worked minutes each round to 17
          units apiece for a weekly settled total of 34 units / 510 minutes, whereas summing the
          minutes first (500) and rounding once yields 33 units / 495 minutes. The pinned order is
          round-per-timesheet-then-sum, so 34 is correct and 33 is the ordering bug.
        test_recipe:
          setup:
            - "Authorization approved at 40.00 h/wk is ACTIVE; payer ruleset STANDARD_15MIN."
            - "Two 4-hour shifts (240 scheduled minutes each) on 2026-08-03 and 2026-08-04, both assigned to N1."
            - "Each visit is clocked in on time by GPS and clocked out at 12:10, i.e. 250 worked minutes, and both timesheets are billing-accepted."
