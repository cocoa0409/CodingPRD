            - { call: "GET /api/faces/${fb}", payload: {}, as: SalesPlanner, captures: { fb_v: $.data.version } }
            - { call: "GET /api/faces/${fc}", payload: {}, as: SalesPlanner, captures: { fc_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-10-31" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fa}", rate_card_id: "${rc}", start_date: "2026-08-29", end_date: "2026-09-25", expected_face_version: "${fa_v}" }, as: SalesPlanner, captures: { flA: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fb}", rate_card_id: "${rc}", start_date: "2026-08-28", end_date: "2026-09-24", expected_face_version: "${fb_v}" }, as: SalesPlanner, captures: { flB: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${fc}", rate_card_id: "${rc}", start_date: "2026-08-14", end_date: "2026-09-10", expected_face_version: "${fc_v}" }, as: SalesPlanner, captures: { flC: $.data.id } }
