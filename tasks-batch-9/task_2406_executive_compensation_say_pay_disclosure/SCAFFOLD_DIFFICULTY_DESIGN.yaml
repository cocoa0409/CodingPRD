      - name: vote_certification_blocked_while_reopened_cda_awaits_refiling
        grounds:
          - state_machines.CdaDraft.FILED_to_DRAFTING
          - validations.priority_28_ERR_CDA_NOT_FILED
          - validations.priority_16_ERR_PROGRAM_NOT_DISCLOSED
          - state_machines.PayProgram.design_status_COMMITTEE_APPROVED_to_DISCLOSED
