            - "trigger step 2 returns status 201 because 2026-08-02T03:00:00Z == 2026-08-02T02:00:00Z + 60 minutes exactly, and the gap check is inclusive at equality"
            - "Activation.${act_3_id}.status == DRAFT"
            - "Activation.${act_3_id}.window_start_at == 2026-08-02T03:00:00Z"
            - "GET /cdp/activations with destination_id == ${dest_id} returns total_count 2, ordered created_at ASC as ${act_1_id} then ${act_3_id}"
            - "Activation.${act_1_id}.status == DRAFT"

      - name: suppression_half_open_window_touching_is_accepted
        grounds:
          - validations[priority=45]
          - errors[ERR_SUPPRESSION_WINDOW_OVERLAP]
          - entities.SuppressionEntry.fields.effective_at
          - endpoints[POST /cdp/suppression-entries]
