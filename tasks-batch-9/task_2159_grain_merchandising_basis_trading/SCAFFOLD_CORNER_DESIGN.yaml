              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_id: $.data.id }
            - call: "POST /grain/bids/${bid_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 4, avg_entry_price_cents: 448 }
              as: FuturesTrader
