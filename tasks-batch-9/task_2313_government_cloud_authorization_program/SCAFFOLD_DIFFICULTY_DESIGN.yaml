    distinguishing_aspect: 'contracted_hours == allocated_hours + unallocated_hours holds at every step of a 40.00 h pool:
      8.00 + 32.00 = 40.00 with the pool empty, 8.00 + 32.00 after the 32.00 h slot is cancelled, and 40.00 + 0.00 after the
      hours are re-allocated — a real-number hour ledger, distinct from the integer reuse-seat pool.'
