# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Final Expense & Burial Insurance — EXPERT band
# 9 Difficulty Rules x >=2 instances = 18 instances total.
#
# Shared canonical fixtures referenced by setup chains below:
#  - GRADED plan: benefit_type=GRADED_BENEFIT, base_monthly_rate_per_1000_cents=400,
#    graded_period_months=24, contestability_period_months=24, graded_refund_apr=0.10,
#    cash_value_factor_per_1000_cents=1500, cash_value_vesting_years=3,
#    max_loan_to_cash_value_pct=0.90, loan_apr=0.08, loan_cooldown_days=30,
#    grace_period_days=31, reinstatement_window_days=180,
#    age_bands=[{45-60:1.0},{61-75:1.5},{76-85:2.2}], max_issue_age=85, min_issue_age=45,
#    face_tiers=[SMALL 100000..1000000 load 0.0; MID 1000001..2500000 load 0.10;
#                LARGE 2500001..5000000 load 0.25],
#    surrender_charge_tiers=[0..50000 0.10; 50001..200000 0.05; 200001..99999999 0.0]
#  - Clock default before any set: 2026-01-01T00:00:00Z.
# Premium literals (computed against the formula):
#  - face 1000000c, age 65, STANDARD -> 6000 cents/mo
#  - face 1500000c, age 55, TOBACCO  -> 9900 cents/mo
#  - face 3000000c, age 80, SUBSTANDARD -> 66000 cents/mo
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_payout_graded_vs_full_face_on_claim
        grounds:
          - calculations.claim_payout
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.payout_basis
        distinguishing_aspect: |
          On the Claim entity domain, a NATURAL death inside the graded window pays the
          GRADED_REFUND variant (premiums + per-payment interest = 6146 cents), whereas an
          ACCIDENTAL death with identical timing pays the FULL_FACE variant (1000000 cents);
          same policy/face, two payout numbers.
        test_recipe:
          setup:
            - "GRADED plan created; applicant age 65 STANDARD; application approved at face 1000000c (premium 6000)."
            - "Policy issued 2026-02-01; one premium 6000 posted 2026-02-01 covering [2026-02-01,2026-03-01)."
            - "Clock at 2026-05-01; one NATURAL claim filed with date_of_death 2026-05-01 (3 months in force < 24)."
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}, {tier_name: "MID", min_face_cents: 1000001, max_face_cents: 2500000, tier_load_pct: 0.10}, {tier_name: "LARGE", min_face_cents: 2500001, max_face_cents: 5000000, tier_load_pct: 0.25}], age_bands: [{band_name: "A", min_age: 45, max_age: 60, age_factor: 1.0}, {band_name: "B", min_age: 61, max_age: 75, age_factor: 1.5}, {band_name: "C", min_age: 76, max_age: 85, age_factor: 2.2}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 50000, charge_pct: 0.10}, {min_gross_cents: 50001, max_gross_cents: 200000, charge_pct: 0.05}, {min_gross_cents: 200001, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Mabel Crane", date_of_birth: "1960-06-15", gender: "FEMALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_mabel" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /premium-payments"
              payload: { policy_id: "${policy_id}", amount_cents: 6000, coverage_start: "2026-02-01T00:00:00Z", coverage_end: "2026-03-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", date_of_death: "2026-05-01T00:00:00Z", manner_of_death: "NATURAL" }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/death-certificate"
              payload: { certificate_number: "DC-1", certified_cause: "ILLNESS", verified: true }
              as: ClaimsExaminer
          trigger:
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsExaminer
              captures: { basis: $.data.payout_basis, gross: $.data.gross_benefit_cents }
          assert:
            - "Claim.${claim_id}.payout_basis == GRADED_REFUND"
            - "Claim.${claim_id}.gross_benefit_cents == 6146"
            - "An otherwise-identical ACCIDENTAL claim at the same date_of_death yields payout_basis FULL_FACE and gross_benefit_cents 1000000 (variant divergence)."

      - name: surrender_gross_vs_net_cash_value_on_policy
        grounds:
          - calculations.net_surrender_value
          - state_machines.Policy.ACTIVE_to_SURRENDERED
          - entities.Policy.fields.net_cash_value_cents
        distinguishing_aspect: |
          On the Policy entity domain (different from Claim), gross_cash_value_cents = 30000
          (ignores charge/loan) while net surrender proceeds = 27000 (gross minus the
          gross-keyed 10% surrender charge); two different cash-value numbers from one policy.
        test_recipe:
          setup:
            - "GRADED plan; policy issued 2026-02-01 face 1000000c; clock advanced to 2031-02-01 (5 whole years; vested years = 2)."
            - "No loans outstanding."
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}, {tier_name: "MID", min_face_cents: 1000001, max_face_cents: 2500000, tier_load_pct: 0.10}, {tier_name: "LARGE", min_face_cents: 2500001, max_face_cents: 5000000, tier_load_pct: 0.25}], age_bands: [{band_name: "A", min_age: 45, max_age: 60, age_factor: 1.0}, {band_name: "B", min_age: 61, max_age: 75, age_factor: 1.5}, {band_name: "C", min_age: 76, max_age: 85, age_factor: 2.2}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 50000, charge_pct: 0.10}, {min_gross_cents: 50001, max_gross_cents: 200000, charge_pct: 0.05}, {min_gross_cents: 200001, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Otis Vale", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_otis" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-02-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: PolicyAdmin
              captures: { gross_cv: $.data.gross_cash_value_cents, net_cv: $.data.net_cash_value_cents }
          trigger:
            - call: "POST /policies/${policy_id}/surrender"
              payload: {}
              as: PolicyAdmin
              captures: { final_status: $.data.coverage_status }
          assert:
            - "Policy.${policy_id}.gross_cash_value_cents == 30000 (gross variant)"
            - "The net surrender proceeds paid out == 27000 (net variant = gross - 10% charge), distinct from gross_cash_value_cents."
            - "Policy.${policy_id}.coverage_status == SURRENDERED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: premium_rate_tiered_age_face_class_mode_a
        grounds:
          - calculations.premium_rate
          - state_machines.Application.SUBMITTED_to_APPROVED
          - entities.Application.fields.quoted_monthly_premium_cents
        distinguishing_aspect: |
          Mode (a): premium combines >=3 inputs with tiered-rate selection and a conditional
          class branch — face 1500000c selects MID tier (load 0.10), age 55 selects band A
          (1.0), TOBACCO selects class mult 1.5; raw 6000 -> *1.10 -> *1.50 = 9900 cents,
          rounded once at the end.
        test_recipe:
          setup:
            - "GRADED plan; applicant age 55 with tobacco_use true; application face 1500000c (MID tier)."
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}, {tier_name: "MID", min_face_cents: 1000001, max_face_cents: 2500000, tier_load_pct: 0.10}, {tier_name: "LARGE", min_face_cents: 2500001, max_face_cents: 5000000, tier_load_pct: 0.25}], age_bands: [{band_name: "A", min_age: 45, max_age: 60, age_factor: 1.0}, {band_name: "B", min_age: 61, max_age: 75, age_factor: 1.5}, {band_name: "C", min_age: 76, max_age: 85, age_factor: 2.2}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 50000, charge_pct: 0.10}, {min_gross_cents: 50001, max_gross_cents: 200000, charge_pct: 0.05}, {min_gross_cents: 200001, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Reba Stone", date_of_birth: "1970-06-15", gender: "FEMALE", tobacco_use: true, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1500000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
              captures: { premium: $.data.quoted_monthly_premium_cents, rc: $.data.rating_class }
          assert:
            - "Application.${application_id}.rating_class == TOBACCO"
            - "Application.${application_id}.quoted_monthly_premium_cents == 9900"
            - "Application.${application_id}.status == APPROVED"

      - name: graded_refund_per_payment_round_then_sum_mode_b
        grounds:
          - calculations.claim_payout
          - state_machines.Claim.FILED_to_UNDER_REVIEW
          - entities.PremiumPayment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): graded refund pins rounding order — interest is computed and rounded to
          whole cents PER POSTED PremiumPayment then summed. With three 6000c payments held
          181/153/122 days at 0.10 APR the per-payment interests 298/252/201 sum into
          gross 18751; sum-then-round would differ.
        test_recipe:
          setup:
            - "GRADED plan; policy issued 2026-02-01 face 1000000c; three monthly premiums 6000 posted 2026-02-01, 2026-03-01, 2026-04-01."
            - "NATURAL claim date_of_death 2026-08-01 (6 months in force < 24)."
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}, {tier_name: "MID", min_face_cents: 1000001, max_face_cents: 2500000, tier_load_pct: 0.10}, {tier_name: "LARGE", min_face_cents: 2500001, max_face_cents: 5000000, tier_load_pct: 0.25}], age_bands: [{band_name: "A", min_age: 45, max_age: 60, age_factor: 1.0}, {band_name: "B", min_age: 61, max_age: 75, age_factor: 1.5}, {band_name: "C", min_age: 76, max_age: 85, age_factor: 2.2}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 50000, charge_pct: 0.10}, {min_gross_cents: 50001, max_gross_cents: 200000, charge_pct: 0.05}, {min_gross_cents: 200001, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cyrus Webb", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_cyrus" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /premium-payments"
              payload: { policy_id: "${policy_id}", amount_cents: 6000, coverage_start: "2026-02-01T00:00:00Z", coverage_end: "2026-03-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /premium-payments"
              payload: { policy_id: "${policy_id}", amount_cents: 6000, coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2026-04-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /premium-payments"
              payload: { policy_id: "${policy_id}", amount_cents: 6000, coverage_start: "2026-04-01T00:00:00Z", coverage_end: "2026-05-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /claims"
              payload: { policy_id: "${policy_id}", date_of_death: "2026-08-01T00:00:00Z", manner_of_death: "NATURAL" }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/death-certificate"
              payload: { certificate_number: "DC-2", certified_cause: "ILLNESS", verified: true }
              as: ClaimsExaminer
          trigger:
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsExaminer
              captures: { gross: $.data.gross_benefit_cents }
          assert:
            - "Claim.${claim_id}.gross_benefit_cents == 18751 (298+252+201 interest, per-payment rounding before sum)"
            - "Claim.${claim_id}.payout_basis == GRADED_REFUND"

      - name: net_surrender_charge_keyed_on_gross_mode_c
        grounds:
          - calculations.net_surrender_value
          - state_machines.Policy.ACTIVE_to_SURRENDERED
          - entities.ProductPlan.fields.surrender_charge_tiers
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the surrender charge percent is selected from
          a tier keyed on the GROSS cash value, then subtracted from that same gross. Order is
          pinned (resolve gross 30000 first, select 10% tier, charge 3000, then net loans),
          producing 27000; selecting the tier on the post-charge value would change the answer.
        test_recipe:
          setup:
            - "GRADED plan; policy issued 2026-02-01 face 1000000c; clock 2031-02-01 (gross 30000, no loan)."
          setup_api_calls:
            - call: "POST /product-plans"
              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, graded_period_months: 24, contestability_period_months: 24, graded_refund_apr: 0.10, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, max_loan_to_cash_value_pct: 0.90, loan_apr: 0.08, loan_cooldown_days: 30, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}, {tier_name: "MID", min_face_cents: 1000001, max_face_cents: 2500000, tier_load_pct: 0.10}, {tier_name: "LARGE", min_face_cents: 2500001, max_face_cents: 5000000, tier_load_pct: 0.25}], age_bands: [{band_name: "A", min_age: 45, max_age: 60, age_factor: 1.0}, {band_name: "B", min_age: 61, max_age: 75, age_factor: 1.5}, {band_name: "C", min_age: 76, max_age: 85, age_factor: 2.2}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 50000, charge_pct: 0.10}, {min_gross_cents: 50001, max_gross_cents: 200000, charge_pct: 0.05}, {min_gross_cents: 200001, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Pearl Hatch", date_of_birth: "1960-06-15", gender: "FEMALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_pearl" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-02-01T00:00:00Z" }
              as: PolicyAdmin
          trigger:
            - call: "POST /policies/${policy_id}/surrender"
              payload: {}
              as: PolicyAdmin
              captures: { st: $.data.coverage_status }
          assert:
            - "Net surrender proceeds == 27000 (gross 30000 - 10% gross-keyed charge 3000 - 0 loan)"
            - "Policy.${policy_id}.coverage_status == SURRENDERED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: policy_cyclic_active_lapsed_active
        grounds:
          - state_machines.Policy.ACTIVE_to_LAPSED
          - state_machines.Policy.LAPSED_to_ACTIVE
          - entities.Policy.fields.coverage_status
        distinguishing_aspect: |
          Policy is cyclic on the coverage dimension: ACTIVE -> LAPSED (manual lapse after grace)
          -> ACTIVE (reinstatement within window). The same coverage_status field returns to
          ACTIVE after looping through LAPSED — not a one-way linear pipeline.
        test_recipe:
          setup:
            - "GRADED plan (grace 31d, reinstatement window 180d); policy issued 2026-02-01."
            - "No premium posted, so due_date=2026-02-01; clock advanced to 2026-04-01 (> 2026-02-01 + 31d) to allow manual lapse."
            - "Back premium posted to cover current cycle before reinstating."
