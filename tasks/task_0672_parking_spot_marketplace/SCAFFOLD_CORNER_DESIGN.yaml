              captures: { sp: $.data.id, sv: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${sp}", driver_id: "${d}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T12:00:00Z", expected_spot_version: "${sv}" }
              as: Driver
              as_user_id: "${d}"
              captures: { b: $.data.id, settle: $.data.settlement_status }
          trigger:
            - call: "GET /drivers/${d}"
              payload: {}
              as: Driver
