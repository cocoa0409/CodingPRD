# =============================================================================
# PRD Benchmark Seed Tables Template
# 
# 填写此文件的 6 张表，即可派生出完整的 benchmark：
#   PRD → types → api-client → tests → reference implementation
#
# 使用方法：
#   1. 描述你的场景（scenario 字段）
#   2. 填写或让 AI 生成 6 张种子表
#   3. 用 prd-bench-generator skill 生成下游产物
# =============================================================================

scenario: |
  [在此描述你的业务场景，1-3 句话]
  例如：一个医院排班系统，管理治疗计划、轮班、手术操作和医疗资源的分配，
  需要考虑预算控制、患者安全评分、设备消毒和感染风险。

domain_name: ""          # 例如: hospital-shifts, restaurant-orders
api_prefix: ""           # 例如: /treatment-plans, /restaurants

# =============================================================================
# 表 1: 实体关系表
# =============================================================================
entities:
  - name: ""
    parent: null           # null = 顶级资源; 否则填父实体名
    common_fields: true    # 自动包含 id, created_at, updated_at, version
    fields:
      - name: ""
        type: ""           # string | number | integer | boolean | enum | datetime | array
        source: input       # input = 客户端传入 | computed = 系统计算 | system = 系统生成
        required: true
        description: ""
        default: null       # 可选默认值
        constraints: ""     # 可选约束描述

# =============================================================================
# 表 2: 状态机表
# =============================================================================
state_machines:
  - entity: ""
    initial_state: ""
    terminal_states: []
    transitions:
      - from: ""
        to: ""
        trigger: ""         # 触发此转换的 API 操作
        actor: ""           # 角色名
        preconditions: []   # 前置条件列表
        side_effects: []    # 副作用（级联状态变更、计算触发等）

# =============================================================================
# 表 3: 计算规则表
# =============================================================================
calculations:
  - name: ""
    description: ""
    trigger: ""             # 何时触发此计算
    inputs: []              # 计算所需的输入
    algorithm: ""           # forward_looking | chronological | aggregation | threshold
    formula: |
      [伪代码或数学公式]
    constants:              # 数值常量
      THRESHOLD: 0
      MULTIPLIER: 1
    precision: "2 decimal places, round_half_up"
    variants:               # 同一计算的不同变体（关键难度来源）
      - name: ""
        when: ""
        difference: ""

# =============================================================================
# 表 4: 验证规则表（按优先级排序）
# =============================================================================
validations:
  - priority: 1
    category: auth          # auth | existence | state | business_safety | business_fiscal
    check: ""
    error_id: ""
    http_status: 400
    applies_to: "all"       # all | [endpoint list]
    description: ""

# =============================================================================
# 表 5: API 端点表
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  - method: POST
    path: ""
    description: ""
    authorized_roles: []
    success_code: 201
    request_body:
      - field: ""
        type: ""
        required: true
    response: ""            # 返回的实体名
    side_effects: []        # 触发的计算或状态变更

# =============================================================================
# 表 6: 错误码目录
# =============================================================================
errors:
  - id: ""
    http_status: 400
    condition: ""           # 触发条件
    applies_to: []          # 适用端点

# =============================================================================
# 表 7: RBAC 权限矩阵
# =============================================================================
roles:
  - name: ""
    description: ""
    exclusive_operations: []  # 此角色独有的操作
    shared_operations: []     # 与其他角色共享的操作

# =============================================================================
# 版本递进设计（可选）
# =============================================================================
versions:
  v1:
    type: greenfield
    scope: ""
  v2:
    type: brownfield
    additions: []
    constraint: "must pass all v1 tests"
  v3:
    type: brownfield
    additions: []
    constraint: "must pass all v1 + v2 tests"
