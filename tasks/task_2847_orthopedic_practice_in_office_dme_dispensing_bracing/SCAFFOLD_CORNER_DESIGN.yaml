        claim_type: Violation → Error
        grounds:
          - validations[priority=47]
          - validations[priority=48]
          - validations[priority=21]
          - errors[ERR_ABN_REQUIRED_FOR_EXCESS_UNITS]
          - errors[ERR_ABN_NOT_SIGNED]
          - state_machines.AbnNotice.ISSUED_to_DECLINED
          - state_machines.DispenseEncounter.ABN_ISSUED_to_SELF_PAY
          - endpoints[POST /dme/encounters/{id}/dispense]
          - endpoints[POST /dme/abn-notices/{id}/signature]
        distinguishing_aspect: |
          The two fiscal-consent gates are reached from two different financial
          states. Priority 47 fires on an AUTH_APPROVED encounter whose
          authorization covers only 1 of the 2 ordered units: authorization
          exists and has not expired, so priority 43 is silent, and the
          missing artefact is the beneficiary notice for the excess unit.
          Priority 48 fires on an ABN_ISSUED encounter, and the interesting
          part is that a DECLINED signature does not clear it -- recording a
          notice the patient refused to sign is accepted (the notice moves
          ISSUED -> DECLINED and the encounter stays ABN_ISSUED), and the next
          dispense is refused with the same error. Only after a corrected
          notice is issued and signed with OPTION_1 does the encounter reach
          SELF_PAY and dispense, priced from the notice rather than from the
          payer's allowed amount.
