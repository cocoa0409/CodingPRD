            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/confirm", payload: {}, as: LabTechnician, as_user_id: lab-2 }
            - { call: "POST /buying-points/storage-receipts", payload: { load_id: "${loadA}", warehouse_id: "${whg}" }, as: BuyingPointAdmin }
          trigger:
            - call: "POST /buying-points/growers/${g1}/settlements"
              payload: { crop_year: 2026, expected_grower_version: "${g1_v}" }
              as: SettlementClerk
