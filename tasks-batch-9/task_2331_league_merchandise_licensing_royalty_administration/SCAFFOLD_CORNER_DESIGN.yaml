      - name: activate_licensee_twice_second_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Licensee.PROSPECT_to_ACTIVE
          - errors.ERR_INVALID_STATE
          - validations.priority_12
        distinguishing_aspect: |
          Repeating a transition that already happened is an error, not a no-op:
          the second ACTIVATE returns ERR_INVALID_STATE (409) because the row is
          no longer PROSPECT, and Licensee.version stays at the value the first
          ACTIVATE produced. An idempotent implementation would return 200 and
          silently bump version, hiding double-activation from the caller.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_L2 exists in PROSPECT (version 1)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
