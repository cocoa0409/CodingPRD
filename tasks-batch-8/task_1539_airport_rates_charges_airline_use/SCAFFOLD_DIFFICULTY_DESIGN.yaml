  # ---------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (≥2, different interval semantics)
  # ---------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: consultation_window_vs_adopt_time
        grounds:
          - state_machines.RatesSetting
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantic: half-open minimum-duration window. Adopt is
          rejected before created_at + CONSULTATION_MIN_DAYS; permitted at
          exactly the boundary (>= semantics). Resource: the RatesSetting
          consultation window.
        test_recipe:
          setup:
            - "FY_OVL1 OPEN; RatesSetting RS_ovl published at logical time T0."
            - "Advance clock to T0 + 29 days (before the 30-day minimum)."
            - "Then advance clock to T0 + 30 days exactly (at the boundary)."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_OVL1", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_ovl1_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_ovl1_id}/open"
              payload: {}
              as: AirportFinance
            - call: "GET /airport/fiscal_years/${fy_ovl1_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_17: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_ovl1_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_17}" }
              as: AirportFinance
              captures: { rs_ovl1_id: $.data.id }
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_ovl1_id}/publish"
              payload: {}
              as: AirportFinance
          trigger:
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_ovl1_id}/adopt"
              payload: {}
              as: AirportDirector
              captures: { err1: $.data.error_id }
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_ovl1_id}/adopt"
              payload: {}
              as: AirportDirector
          assert:
            - "First adopt (T0+29 days) → err1 == ERR_TEMPORAL_VIOLATION (consultation window not elapsed)"
            - "Second adopt (T0+30 days) succeeds: RatesSetting.${rs_ovl1_id}.status == ADOPTED"

      - name: countersign_deadline_exact_boundary
        grounds:
          - state_machines.AirlineAgreement
          - validations[priority=18]
        distinguishing_aspect: |
          Interval semantic: closed-end deadline window (<=). Countersign at
          exactly countersign_deadline succeeds; one second after is
          ERR_COUNTERSIGN_LAPSED. Resource: AirlineAgreement countersign
          window — different entity than RatesSetting consultation and a
          different boundary direction (upper-bound vs lower-bound).
        test_recipe:
          setup:
            - "FY_OVL2 OPEN; RatesSetting adopted at T_adopt = 2026-09-01T00:00:00Z; countersign_deadline = T_adopt + 30 days = 2026-10-01T00:00:00Z."
            - "Airline OA agreement in NON_SIGNATORY."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_OVL2", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_ovl2_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_ovl2_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "OA", legal_name: "OnTime Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { oa_id: $.data.id }
            - call: "POST /airport/airlines"
              payload: { iata_code: "OB", legal_name: "Late Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { ob_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${oa_id}", fiscal_year_id: "${fy_ovl2_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_oa_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${ob_id}", fiscal_year_id: "${fy_ovl2_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_ob_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_ovl2_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_18: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_ovl2_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_18}" }
              as: AirportFinance
              captures: { rs_ovl2_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_ovl2_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_ovl2_id}/adopt"
              payload: {}
              as: AirportDirector
          trigger:
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/airline_agreements/{ag_oa_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${oa_id}"
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:01Z" }
              as: AirportFinance
            - call: "POST /airport/airline_agreements/{ag_ob_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${ob_id}"
              captures: { err: $.data.error_id }
          assert:
            - "OA countersign at exactly T_adopt+30d succeeds: AirlineAgreement.${ag_oa_id}.signature_status == SIGNATORY"
            - "OB countersign at T_adopt+30d+1s → err == ERR_COUNTERSIGN_LAPSED"
            - "AirlineAgreement.${ag_ob_id}.signature_status == NON_SIGNATORY"

  # ---------------------------------------------------------
  # Rule 9 — compensating_invariant (≥2, different conserved quantities)
  # ---------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: settlement_recompute_total_true_up_conserved
        grounds:
          - calculations.annual_true_up
          - concurrency_rules[settlement-recompute-stale-settlement]
        distinguishing_aspect: |
          Conserved quantity: AnnualSettlement.total_true_up_cents ==
          (actual_airfield + actual_terminal) - (total_billed_landing +
          total_billed_terminal). A recompute triggered by a new ActivityRecord
          must update both sides of the invariant — billed and actual — leaving
          the equality exact.
        test_recipe:
          setup:
            - "FY_INV1 OPEN; signatory airline with 1000 kg activity; settlement computed once; then one more 500 kg ActivityRecord is added; settlement is recomputed via OCC-guarded recompute endpoint."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_INV1", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_inv1_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_inv1_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "IV", legal_name: "Invariant Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { iv_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${iv_id}", fiscal_year_id: "${fy_inv1_id}", rented_space_sqft: 0 }
              as: AirportFinance
              captures: { ag_iv_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_inv1_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_19: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_inv1_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_19}" }
              as: AirportFinance
              captures: { rs_inv1_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_inv1_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_inv1_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_iv_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${iv_id}"
            - call: "POST /airport/fiscal_years/{fy_inv1_id}/activity_records"
              payload: { airline_id: "${iv_id}", activity_date: "2026-09-10T00:00:00Z", landed_weight_kg: 1000, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
            - call: "POST /airport/fiscal_years/{fy_inv1_id}/settlement/compute"
              payload: {}
              as: AirportFinance
              captures: { settle_inv1_id: $.data.id, settle_inv1_v: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_inv1_id}/activity_records"
              payload: { airline_id: "${iv_id}", activity_date: "2026-09-11T00:00:00Z", landed_weight_kg: 500, signature_status_at_activity: "SIGNATORY" }
              as: AirportFinance
          trigger:
            - call: "POST /airport/settlements/{settle_inv1_id}/recompute"
              payload: { expected_annual_settlement_version: "${settle_inv1_v}" }
              as: AirportFinance
            - call: "GET /airport/settlements/{settle_inv1_id}"
              as: AirportFinance
          assert:
            - "AnnualSettlement.${settle_inv1_id}.total_billed_landing_cents updated to reflect both activity records"
            - "AnnualSettlement.${settle_inv1_id}.total_true_up_cents == (actual_airfield_requirement_cents + actual_terminal_requirement_cents) - (total_billed_landing_cents + total_billed_terminal_cents) (invariant preserved exactly)"

      - name: supersede_agreement_rented_space_conserved
        grounds:
          - entities.AirlineAgreement.fields.superseded_by_id
          - entities.FiscalYear.fields.total_rented_space_sqft
        distinguishing_aspect: |
          Conserved quantity: FiscalYear.total_rented_space_sqft over the
          ACTIVE-agreement set. A CREATE-with-supersede of an AirlineAgreement
          (same airline, same FY, new rented_space_sqft) must atomically
          decrement the old contribution and add the new, so the aggregate
          changes by exactly (new_sqft - old_sqft), never double-counting.
          Different conserved quantity than settlement money.
        test_recipe:
          setup:
            - "FY_INV2 OPEN; airline SP with an ACTIVE agreement A_old, rented_space_sqft=1000, countersigned SIGNATORY."
            - "FiscalYear.total_rented_space_sqft == 1000."
          setup_api_calls:
            - call: "POST /airport/fiscal_years"
              payload: { year_label: "FY_INV2", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
              as: AirportFinance
              captures: { fy_inv2_id: $.data.id }
            - call: "POST /airport/fiscal_years/{fy_inv2_id}/open"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/airlines"
              payload: { iata_code: "SP", legal_name: "Space Air", carrier_class: "PASSENGER", pfc_approved: false }
              as: AirportFinance
              captures: { sp_id: $.data.id }
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${sp_id}", fiscal_year_id: "${fy_inv2_id}", rented_space_sqft: 1000 }
              as: AirportFinance
              captures: { ag_sp_old_id: $.data.id }
            - call: "GET /airport/fiscal_years/${fy_inv2_id}"
              payload: {}
              as: AirportFinance
              captures: { v_pre_rs_20: $.data.version }
            - call: "POST /airport/fiscal_years/{fy_inv2_id}/rates_settings"
              payload: { expected_fiscal_year_version: "${v_pre_rs_20}" }
              as: AirportFinance
              captures: { rs_inv2_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_inv2_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_inv2_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_sp_old_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${sp_id}"
          trigger:
            - call: "POST /airport/airline_agreements"
              payload: { airline_id: "${sp_id}", fiscal_year_id: "${fy_inv2_id}", rented_space_sqft: 1500 }
              as: AirportFinance
              captures: { ag_sp_new_id: $.data.id }
            - call: "GET /airport/fiscal_years/{fy_inv2_id}"
              as: AirportFinance
          assert:
            - "FiscalYear.${fy_inv2_id}.total_rented_space_sqft == 1000 (new agreement not yet countersigned; only old SIGNATORY one contributes — invariant: only ACTIVE+SIGNATORY agreements count)"
            - "AirlineAgreement.${ag_sp_old_id}.superseded_by_id == ${ag_sp_new_id}"
            - "After countersigning the new agreement, total_rented_space_sqft == 1500 exactly (delta = 1500 - 1000, no double-count)"
