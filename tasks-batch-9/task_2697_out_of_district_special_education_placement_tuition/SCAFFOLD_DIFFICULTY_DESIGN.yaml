  - rule_id: transitive_cascade
    instances:
      - name: terminate_frees_seat_then_promotes_waitlist_onto_a_second_placement
        grounds:
          - state_machines.Placement.ACTIVE_to_TERMINATED.CASCADE-A_LINK_4
          - state_machines.Placement.ACTIVE_to_TERMINATED.CASCADE-A_LINK_5
          - state_machines.Placement.ACTIVE_to_TERMINATED.CASCADE-A_LINK_6
          - state_machines.Placement.ACTIVE_to_TERMINATED.CASCADE-A_LINK_7
          - calculations.waitlist_promotion
          - calculations.transport_encumbrance
        distinguishing_aspect: |
          A four-hop transitive chain in which every hop is caused by the previous hop's
          mutation, not by the terminate call: terminating Placement P1 releases its
          TransportationAssignment A1 (LINK 4), releasing A1 frees a seat on TransportRoute R
          (LINK 5), the freed seat makes the waitlist_promotion selector run and promote the
          WAITLISTED assignment A2 (LINK 6), and promoting A2 commits 1152270 cents against a
          DIFFERENT Placement P2 and flips P2.transport_status (LINK 7). An implementation that
          stops at "release the terminated placement's transport" leaves P2 WAITLISTED with
          transport_encumbrance_cents 0 and leaves the route seat idle.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z, advanced to 2026-09-01T08:00:00Z for activation and 2026-10-01T08:00:00Z for the trigger."
            - "One DistrictFiscalAccount FY2027 authorized_cents 100000000."
            - "One TransportRoute R with seat_capacity 1, daily_rate_cents 6200, service window 360..600."
            - "Two students, two APPROVED decisions, two ACTIVE DAY placements P1 and P2 (both transportation_required true, 180 contracted instructional days, contract_encumbrance_cents 5760000 each)."
            - "A1 on route R for P1, pickup 420..450, 5 days/week, 36 weeks -> ACTIVE with encumbrance_cents 1152270, route seats_available 0."
            - "A2 on route R for P2, pickup 470..500 (does not collide with A1's buffered window [420,460)), same 5 x 36 shape -> WAITLISTED with encumbrance_cents 0."
